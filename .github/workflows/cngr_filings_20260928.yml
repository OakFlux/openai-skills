name: CNGR Official Filings Package

on:
  push:
    branches:
      - chatgpt-cngr-filings-20260928
    paths:
      - .github/workflows/cngr_filings_20260928.yml
      - scripts/build_cngr_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_cngr_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: cngr-official-filings-package
          path: |
            output/中伟新材_2020-2025年报_2026年第一季度报告.zip
            output/中伟新材_2020-2025年报_2026年第三季度报告.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
