name: Discover Mingguan 2020 annual report link

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/mingguan-2020-link-20261105.txt'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import html, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          u='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7096917&stockid=688560'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(u,timeout=60,allow_redirects=True); r.encoding=r.apparent_encoding or r.encoding or 'gb18030'
          t=html.unescape(r.text)
          print('PAGE',r.status_code,len(r.content),r.url,r.encoding,flush=True)
          soup=BeautifulSoup(t,'html.parser')
          found=[]
          for a in soup.find_all('a'):
              href=a.get('href') or ''
              if '7096917' in href or '.pdf' in href.lower():
                  found.append({'href':urljoin(r.url,href),'text':a.get_text(' ',strip=True)})
          print('FOUND',json.dumps(found,ensure_ascii=False,indent=2),flush=True)
          for m in sorted(set(re.findall(r'https?://[^\s\"\'<>]+(?:7096917|AN202104221487076841)[^\s\"\'<>]*',t,re.I))):
              print('REGEX',m,flush=True)
          PY
