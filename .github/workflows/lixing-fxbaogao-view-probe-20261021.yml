name: Probe Fxbaogao full view for Lixing reports

on:
  push:
    paths:
      - '.github/workflows/lixing-fxbaogao-view-probe-20261021.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Probe image pages and viewer endpoints
        shell: bash
        run: |
          python - <<'PY'
          import re,json,html,requests,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/detail/4772943'})
          bases=['https://public.fxbaogao.com/report-image/2025/04/08/4772943-{n}.{ext}']
          for n in range(1,8):
            for ext in ['png','jpg','jpeg','webp']:
              u=bases[0].format(n=n,ext=ext)
              try:
                r=s.get(u,timeout=(15,60),allow_redirects=True)
                print('IMG',n,ext,r.status_code,len(r.content),r.headers.get('content-type'),r.url,r.text[:80] if 'text' in r.headers.get('content-type','') else '')
              except Exception as e:print('IMGERR',n,ext,repr(e))
          for url in ['https://www.fxbaogao.com/view?id=4772943','https://www.fxbaogao.com/view/4772943','https://www.fxbaogao.com/detail/4772943']:
            print('\nVIEW',url)
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'CT',r.headers.get('content-type'))
              text=r.text
              for i,line in enumerate(text.splitlines(),1):
                low=line.lower()
                if any(k in low for k in ['4772943','report-image','pdf','pages','pagecount','download','oss','viewer','preview','api/']):
                  if len(line)<5000: print('LINE',i,line[:4800])
              urls=[]
              for m in re.findall(r'https?://[^\s"\'<>]+',text):
                m=html.unescape(m)
                if any(k in m.lower() for k in ['4772943','report-image','pdf','download']):urls.append(m)
              print('URLS',json.dumps(list(dict.fromkeys(urls))[:300],ensure_ascii=False,indent=2))
            except Exception as e:print('VIEWERR',repr(e))
          PY
