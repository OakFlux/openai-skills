name: Hongmian direct report check
on:
  push:
    paths:
      - '.github/workflows/hongmian-direct-report-check-20261006.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check coverage
        run: |
          python - <<'PY'
          import json
          import requests
          session = requests.Session()
          session.trust_env = False
          session.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          for report_type in ['0','1','2']:
              params = {'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2008-01-01','endTime':'2026-10-06','pageNo':'1','fields':'','qType':report_type,'orgCode':'','code':'000523','rcode':''}
              response = session.get(endpoint, params=params, timeout=120)
              print('TYPE', report_type, 'STATUS', response.status_code, 'BYTES', len(response.content))
              response.raise_for_status()
              rows = response.json().get('data') or []
              print('COUNT', len(rows))
              for row in rows:
                  print('ROW', json.dumps(row, ensure_ascii=False))
          PY
