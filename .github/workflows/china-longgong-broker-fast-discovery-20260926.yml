name: Fast discover China Longgong broker reports 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-broker-fast-discovery-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fast targeted discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fast_longgong
          python - <<'PY'
          import json,re,html,time
          from pathlib import Path
          from urllib.parse import quote_plus,urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          out={'eastmoney':[],'search':[],'pdf_probes':[],'errors':[]}

          def parse(r):
            try:return r.json()
            except Exception:
              m=re.search(r'^[^(]*\((.*)\)\s*;?$',r.text.strip(),re.S)
              if m:return json.loads(m.group(1))
              raise

          api='https://reportapi.eastmoney.com/report/list'
          tests=[]
          for code in ['03339','3339','03339.HK','3339.HK','HK03339','116.03339']:
            tests += [('code',code,'0'),('stockCode',code,'0'),('code',code,'1')]
          for field,code,qtype in tests:
            try:
              p={'pageSize':'100','beginTime':'2005-01-01','endTime':'2026-09-26','pageNo':'1','qType':qtype,'orgCode':'','author':'',field:code,'p':'1','pageNum':'1','pageNumber':'1','industryCode':'*','industry':'*','rating':'*','ratingChange':'*'}
              r=s.get(api,params=p,timeout=(15,45),headers={'Referer':'https://data.eastmoney.com/'})
              print('EM',field,code,qtype,r.status_code,len(r.content),r.url,flush=True)
              d=parse(r); recs=(d.get('data') or d.get('Data') or []) if isinstance(d,dict) else []
              matches=[]
              for rec in recs:
                t=json.dumps(rec,ensure_ascii=False)
                if any(k.lower() in t.lower() for k in ['中国龙工','中國龍工','lonking','03339','3339.hk']): matches.append(rec)
              if matches: out['eastmoney'].append({'field':field,'code':code,'qType':qtype,'url':r.url,'records':matches})
            except Exception as e: out['errors'].append({'stage':'em','field':field,'code':code,'error':repr(e)})

          queries=['"中国龙工" 券商 研报 pdf','"中国龙工" 深度报告','"Lonking Holdings" equity research pdf','site:pdf.dfcfw.com "中国龙工"','site:fxbaogao.com "中国龙工"','site:baogaobox.com "中国龙工"']
          candidate=[]
          for qi,q in enumerate(queries):
            for eng,base in [('bing','https://www.bing.com/search?q='),('baidu','https://www.baidu.com/s?wd=')]:
              try:
                u=base+quote_plus(q); r=s.get(u,timeout=(15,45),allow_redirects=True)
                print('SEARCH',eng,q,r.status_code,len(r.content),flush=True)
                Path(f'fast_longgong/{eng}_{qi}.html').write_bytes(r.content)
                soup=BeautifulSoup(r.text,'lxml'); links=[]
                for a in soup.find_all('a',href=True):
                  x=urljoin(r.url,html.unescape(a['href'])); txt=a.get_text(' ',strip=True)
                  if any(k in (x+' '+txt).lower() for k in ['中国龙工','lonking','03339','3339','pdf.dfcfw','fxbaogao','baogaobox','fhyanbao']):
                    links.append({'url':x,'text':txt})
                    if '.pdf' in x.lower(): candidate.append(x)
                out['search'].append({'engine':eng,'query':q,'status':r.status_code,'final':r.url,'links':links[:100]})
              except Exception as e:out['errors'].append({'stage':'search','query':q,'engine':eng,'error':repr(e)})

          # derive Eastmoney PDFs and probe only those plus direct search PDFs
          for grp in out['eastmoney']:
            for rec in grp['records']:
              info=str(rec.get('infoCode') or rec.get('info_code') or rec.get('infocode') or '')
              if info:
                candidate += [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/{info}.pdf']
              for v in rec.values():
                if isinstance(v,str) and ('pdf' in v.lower()) and v.startswith('http'):candidate.append(v)
          seen=set()
          for u in candidate:
            if u in seen:continue
            seen.add(u)
            try:
              r=s.get(u,timeout=(15,60),allow_redirects=True,headers={'Range':'bytes=0-65535'},stream=True)
              b=next(r.iter_content(65536),b'')
              rec={'url':u,'status':r.status_code,'final':r.url,'type':r.headers.get('content-type'),'length':r.headers.get('content-length'),'range':r.headers.get('content-range'),'head':b[:16].hex(),'is_pdf':b.startswith(b'%PDF-')}
              out['pdf_probes'].append(rec); print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
            except Exception as e:out['pdf_probes'].append({'url':u,'error':repr(e)})

          Path('fast_longgong/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('fast_longgong/eastmoney.json').write_text(json.dumps(out['eastmoney'],ensure_ascii=False,indent=2),encoding='utf-8')
          Path('fast_longgong/pdf_probes.json').write_text(json.dumps(out['pdf_probes'],ensure_ascii=False,indent=2),encoding='utf-8')
          print('EASTMONEY_MATCHES',json.dumps(out['eastmoney'],ensure_ascii=False,indent=2),flush=True)
          print('PDF_PROBES',json.dumps(out['pdf_probes'],ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-broker-fast-discovery
          path: fast_longgong
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
