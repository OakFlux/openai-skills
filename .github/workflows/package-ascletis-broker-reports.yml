name: Package Ascletis Pharma broker reports

on:
  push:
    branches:
      - chatgpt-ascletis-one-20260906
    paths:
      - '.github/workflows/package-ascletis-broker-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Discover, download, validate and package reports
        run: python scripts/package_ascletis_broker_reports.py
      - name: Publish generated package to branch
        run: |
          mkdir -p generated
          cp Ascletis_Reports.zip generated/Ascletis_Reports.zip
          cp Ascletis_Pharma_Broker_Reports.zip generated/Ascletis_Pharma_Broker_Reports.zip
          cp PACKAGE_SHA256.txt generated/PACKAGE_SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/Ascletis_Reports.zip generated/Ascletis_Pharma_Broker_Reports.zip generated/PACKAGE_SHA256.txt generated/ascletis_discovery.json
          git commit -m "Publish verified Ascletis Pharma broker report package" || true
          git push origin HEAD:chatgpt-ascletis-one-20260906
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-broker-reports-20260906
          path: |
            Ascletis_Reports.zip
            Ascletis_Pharma_Broker_Reports.zip
            PACKAGE_SHA256.txt
            generated/ascletis_discovery.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
