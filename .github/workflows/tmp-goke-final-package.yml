name: Temporary Goke Micro final deep report package

on:
  push:
    branches: [tmp-goke-final-package-20260830]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare tools
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf
      - name: Download, validate, and package two public original PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          reports = [
            {
              'broker':'国海证券','date':'2023-05-29','publish_date':'2023-05-30',
              'title':'深度报告：行业复苏与产品迭代共振，视频解编码+存储主控龙头再起航',
              'info_code':'AP202305301587348698','expected_pages':43,
              'filename':'01_Guohai_Securities_20230529_Goke_Micro_43p.pdf'
            },
            {
              'broker':'国金证券','date':'2023-11-27','publish_date':'2023-11-27',
              'title':'长期深耕视频编解码芯片，高清化与智能化趋势明确',
              'info_code':'AP202311271612384726','expected_pages':30,
              'filename':'02_Guohai?'
            }
          ]
          reports[1]['filename']='02_Guojin_Securities_20231127_Goke_Micro_30p.pdf'
          out=Path('reports'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*'})
          manifest=[]
          for item in reports:
            url=f"https://pdf.dfcfw.com/pdf/H3_{item['info_code']}_1.pdf"
            r=s.get(url,timeout=120,allow_redirects=True)
            print('DOWNLOAD',item['info_code'],r.status_code,len(r.content),r.headers.get('content-type'),r.url)
            r.raise_for_status()
            if not r.content.startswith(b'%PDF-') or len(r.content)<100000:
              raise RuntimeError(f"Invalid PDF for {item['info_code']}")
            path=out/item['filename']; path.write_bytes(r.content)
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
            if pages!=item['expected_pages']:
              raise RuntimeError(f"Page mismatch {item['info_code']}: {pages} != {item['expected_pages']}")
            text=''
            for pg in reader.pages[:min(6,pages)]:
              try:text += pg.extract_text() or ''
              except Exception:pass
            compact=re.sub(r'\s+','',text)
            if '国科微' not in compact and '300672' not in compact:
              raise RuntimeError(f"Company identity check failed {item['info_code']}")
            sha=hashlib.sha256(r.content).hexdigest()
            manifest.append({**item,'pages':pages,'bytes':len(r.content),'pdf_url':r.url,'sha256':sha})
          readme=['国科微（300672）券商深度报告下载包','',
                  '两份均为公开原始PDF；已核验文件头、实际页数、公司名称/证券代码、可解析性与SHA-256。','']
          for i,m in enumerate(manifest,1):
            readme += [f"{i}. {m['broker']}｜报告落款 {m['date']}｜{m['pages']}页",
                       f"   标题：{m['title']}",f"   文件：{m['filename']}",
                       f"   来源：{m['pdf_url']}",f"   SHA-256：{m['sha256']}",'']
          (out/'README_报告清单.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          package=Path('Goke_Micro_Broker_Deep_Reports_2.zip')
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted(out.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(package) as z:
            bad=z.testzip()
            if bad: raise RuntimeError(f'ZIP integrity failure: {bad}')
            print('ZIP_CONTENTS',z.namelist())
          print('FINAL_PACKAGE',package,package.stat().st_size)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload final package and individual PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Goke_Micro_Broker_Deep_Reports_2
          path: |
            Goke_Micro_Broker_Deep_Reports_2.zip
            reports/*.pdf
            reports/README_报告清单.txt
            reports/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
