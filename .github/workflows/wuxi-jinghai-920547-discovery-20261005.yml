name: Discover Wuxi Jinghai 920547 reports 20261005

on:
  push:
    paths:
      - '.github/workflows/wuxi-jinghai-920547-discovery-20261005.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query public announcement metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,*/*;q=0.8',
          })
          endpoint = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows = {}
          for stock_code in ['920547', '836547']:
              for page in range(1, 31):
                  params = {
                      'sr': '-1', 'page_size': '100', 'page_index': str(page),
                      'ann_type': 'A', 'client_source': 'web', 'stock_list': stock_code,
                  }
                  response = session.get(endpoint, params=params, timeout=60)
                  print('QUERY', stock_code, page, response.status_code, len(response.content), response.url, flush=True)
                  response.raise_for_status()
                  payload = response.json()
                  data = payload.get('data') or {}
                  rows = data.get('list') or []
                  print('COUNT', stock_code, len(rows), 'TOTAL', data.get('total_hits'), flush=True)
                  if not rows:
                      break
                  for row in rows:
                      code = row.get('art_code')
                      if code:
                          all_rows[code] = row
                  if len(rows) < 100:
                      break

          print('TOTAL_UNIQUE', len(all_rows), flush=True)
          for row in sorted(all_rows.values(), key=lambda x: str(x.get('notice_date') or x.get('sort_date') or '')):
              title = str(row.get('title') or row.get('title_ch') or '')
              if any(key in title for key in ['年度报告', '招股说明书', '公开发行说明书', '季度报告', '一季度报告', '三季度报告', '半年度报告']):
                  compact = {
                      'title': title,
                      'art_code': row.get('art_code'),
                      'notice_date': row.get('notice_date'),
                      'display_time': row.get('display_time'),
                      'columns': row.get('columns'),
                      'codes': row.get('codes'),
                  }
                  print('MATCH', json.dumps(compact, ensure_ascii=False), flush=True)
          PY
