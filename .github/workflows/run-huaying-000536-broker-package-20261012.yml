name: Run Huaying 000536 broker package 20261012

on:
  push:
    paths:
      - '.triggers/huaying-000536-broker-package-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml
      - name: Extract and execute package script
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/huaying-000536-broker-deep-reports-20261012.yml | sed '1d;$d;s/^          //' > /tmp/huaying_package.py
          python /tmp/huaying_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: huaying-000536-broker-deep-reports
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
