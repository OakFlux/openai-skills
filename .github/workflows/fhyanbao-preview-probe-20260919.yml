name: Probe FHYanbao report preview API 20260919

on:
  push:
    paths:
      - '.github/workflows/fhyanbao-preview-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests pillow pypdf
      - name: Fetch preview API variants
        shell: bash
        run: |
          set -u
          mkdir -p probe
          python - <<'PY'
          import hashlib, json, io
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'*/*','Origin':'https://www.fhyanbao.com','Referer':'https://www.fhyanbao.com/rpview/1917676'})
          urls=[
            'https://api.fhyanbao.com/api/report/preview/1917676?resize=0',
            'https://api.fhyanbao.com/api/report/preview/1917676?resize=1',
            'https://api.fhyanbao.com/api/report/preview/1917676',
            'https://api.fhyanbao.com/api/report/detail/1917676',
            'https://api.fhyanbao.com/api/report/1917676',
          ]
          out=[]
          for i,u in enumerate(urls,1):
            rec={'url':u}
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              rec.update(status=r.status_code,final=r.url,type=r.headers.get('content-type'),length=len(r.content),headers=dict(r.headers),sha256=hashlib.sha256(r.content).hexdigest())
              fn=Path(f'probe/{i:02d}_response.bin');fn.write_bytes(r.content)
              head=r.content[:100]
              rec['head_hex']=head.hex();rec['text_head']=r.text[:1000] if 'text' in (r.headers.get('content-type') or '') or 'json' in (r.headers.get('content-type') or '') else None
              try:
                if r.content.startswith(b'%PDF'):
                  fn2=fn.with_suffix('.pdf');fn.rename(fn2);rec['pdf_pages']=len(PdfReader(str(fn2)).pages)
                else:
                  with Image.open(io.BytesIO(r.content)) as im:
                    im.load();rec['image']={'format':im.format,'size':im.size}
                    fn2=fn.with_suffix('.'+(im.format or 'img').lower());fn.rename(fn2)
              except Exception as e: rec['parse_error']=repr(e)
            except Exception as e: rec['error']=repr(e)
            out.append(rec);print(json.dumps(rec,ensure_ascii=False),flush=True)
          Path('probe/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhyanbao-preview-probe
          path: probe
          retention-days: 7
          if-no-files-found: warn
