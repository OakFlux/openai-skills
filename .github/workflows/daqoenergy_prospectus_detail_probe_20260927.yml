name: Daqo Energy Prospectus Detail Probe

on:
  push:
    branches:
      - chatgpt-daqoenergy-filings-20260927
    paths:
      - .github/workflows/daqoenergy_prospectus_detail_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Inspect and validate final prospectus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          detail='https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=688303&id=7385536'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          r=s.get(detail,timeout=60,allow_redirects=True)
          r.encoding=r.apparent_encoding or 'gb18030'
          print('DETAIL',r.status_code,len(r.content),r.url,r.encoding,r.headers.get('content-type'))
          print(r.text[:4000])
          soup=BeautifulSoup(r.text,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
            text=' '.join(a.get_text(' ',strip=True).split())
            href=urljoin(r.url,a['href'])
            links.append({'text':text,'href':href})
          print('ALL_LINKS',json.dumps(links,ensure_ascii=False,indent=2))
          candidates=[]
          for item in links:
            blob=(item['text']+' '+item['href']).lower()
            if '.pdf' in blob or '下载' in blob or '公告' in blob:
              candidates.append(item['href'])
          candidates += re.findall(r'https?://[^\"\'<>\s]+\.PDF(?:\?[^\"\'<>\s]*)?',r.text,re.I)
          seen=[]
          for u in candidates:
            u=u.replace('&amp;','&')
            if u not in seen: seen.append(u)
          print('PDF_CANDIDATES',json.dumps(seen,ensure_ascii=False,indent=2))
          for u in seen:
            try:
              rr=s.get(u,headers={'Referer':detail},timeout=180,allow_redirects=True)
              print('TRY',u,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),repr(rr.content[:16]))
              if rr.status_code==200 and rr.content.startswith(b'%PDF-'):
                reader=PdfReader(io.BytesIO(rr.content))
                print('PDF_OK',json.dumps({'url':u,'final_url':rr.url,'pages':len(reader.pages),'encrypted':reader.is_encrypted,'bytes':len(rr.content)},ensure_ascii=False))
            except Exception as e:
              print('ERR',u,repr(e))
          PY
