name: Discover historical Wuhan Fingu report IDs 20261022

on:
  push:
    paths:
      - '.github/workflows/wuhan-fingu-exact-date-report-discover-20261022.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests
      - name: Query exact historical report dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2019-10-23','2019-10-29'),
            ('2020-08-08','2020-08-12'),
            ('2020-11-01','2020-11-05'),
          ]
          aliases=['武汉凡谷','002194']
          found=[];seen=set()
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1','2']:
              page=1;total=1
              while page<=total and page<=100:
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                payload=None
                for attempt in range(5):
                  try:
                    r=s.get(api,params=p,timeout=(20,120))
                    if r.status_code==200: payload=r.json();break
                  except Exception as exc: print('ERR',begin,end,qtype,page,repr(exc))
                  time.sleep(1+attempt)
                if payload is None:break
                total=min(int(payload.get('TotalPage') or 1),100)
                data=payload.get('data') or []
                if isinstance(data,dict):data=data.get('list') or data.get('data') or []
                print('PAGE',qtype,page,'COUNT',len(data),'TOTAL',total)
                if not data:break
                for row in data:
                  title=str(row.get('title') or '')
                  stock_code=str(row.get('stockCode') or '')
                  stock_name=str(row.get('stockName') or '')
                  if '武汉凡谷' in title or stock_code=='002194' or '武汉凡谷' in stock_name:
                    info=str(row.get('infoCode') or '')
                    if info in seen:continue
                    seen.add(info)
                    item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']}
                    item['qType']=qtype
                    found.append(item)
                    print('MATCH',json.dumps(item,ensure_ascii=False))
                if page>=total or len(data)<100:break
                page+=1
          print('ALL_MATCHES',json.dumps(found,ensure_ascii=False,indent=2))
          PY
