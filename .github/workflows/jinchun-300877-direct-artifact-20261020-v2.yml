name: Package Jinchun 300877 direct artifact 20261020

on:
  push:
    branches:
      - tmp/jinchun-300877-direct-artifact-20261020-v2
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download validated package from prior run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download 39348793280 \
            --repo OakFlux/openai-skills \
            --name jinchun-300877-all-annual-prospectus-latest-quarter-20261020 \
            --dir downloaded
          find downloaded -maxdepth 3 -type f -printf '%p %s bytes\n'

      - name: Expand final package and verify contents
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          downloaded = Path('downloaded')
          matches = list(downloaded.rglob('金春股份_300877_所有年报_招股说明书及最新季报.zip'))
          if len(matches) != 1:
              raise RuntimeError(f'Expected one inner package ZIP, found {len(matches)}: {matches}')
          source = matches[0]
          with zipfile.ZipFile(source, 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f'Inner ZIP CRC failed: {bad}')
              archive.extractall('payload')

          root = Path('payload/金春股份_300877_所有年报_招股说明书及最新季报')
          if not root.is_dir():
              raise RuntimeError(f'Expected package directory not found: {root}')
          pdfs = sorted(root.glob('*.pdf'))
          if len(pdfs) != 8:
              raise RuntimeError(f'Expected 8 PDF files, found {len(pdfs)}: {pdfs}')
          expected = {
              '01_金春股份_首次公开发行股票并在创业板上市招股说明书.pdf',
              '02_金春股份_2020年年度报告.pdf',
              '03_金春股份_2021年年度报告.pdf',
              '04_金春股份_2022年年度报告.pdf',
              '05_金春股份_2023年年度报告.pdf',
              '06_金春股份_2024年年度报告.pdf',
              '07_金春股份_2025年年度报告.pdf',
              '08_金春股份_2026Q1_最新季报.pdf',
          }
          actual = {p.name for p in pdfs}
          if actual != expected:
              raise RuntimeError(f'Unexpected PDF set: missing={expected-actual}, extra={actual-expected}')
          required_support = {
              'README_文件清单与核验说明.txt',
              'manifest.json',
              'manifest.csv',
              'SHA256SUMS.txt',
          }
          missing = [name for name in required_support if not (root / name).is_file()]
          if missing:
              raise RuntimeError(f'Missing support files: {missing}')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('stock_code') != '300877' or manifest.get('latest_quarter') != '2026Q1':
              raise RuntimeError(f'Unexpected manifest identity/quarter: {manifest.get("stock_code")}, {manifest.get("latest_quarter")}')
          print(json.dumps({
              'directory': str(root),
              'pdf_count': len(pdfs),
              'annual_years': manifest.get('annual_report_years'),
              'latest_quarter': manifest.get('latest_quarter'),
              'source_zip_bytes': source.stat().st_size,
              'source_zip_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload directly downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: jinchun-300877-direct-package-20261020
          path: payload/金春股份_300877_所有年报_招股说明书及最新季报/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
