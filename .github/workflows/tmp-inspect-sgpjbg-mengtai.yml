name: Temporary Inspect SGPJBG Mengtai Report

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-inspect-sgpjbg-mengtai.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Locate report ID and inspect page assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from urllib.parse import urljoin,unquote

          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www.sgpjbg.com/',
          })
          sources=[
            'https://www.sgpjbg.com/zhuanti/xianweixingyequshibaogao.html',
            'https://bg.sgpjbg.com/zhuanti/xianweixingyequshibaogao.html',
          ]
          links=[]
          for url in sources:
            r=session.get(url,timeout=90,allow_redirects=True)
            text=html.unescape(r.text).replace('\\/','/')
            print('SOURCE='+json.dumps({'url':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')},ensure_ascii=False))
            for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
              title=re.sub(r'<[^>]+>',' ',m.group(2)); title=re.sub(r'\s+',' ',html.unescape(title)).strip()
              href=urljoin(r.url,html.unescape(unquote(m.group(1))))
              blob=title+' '+href
              if '蒙泰高新' in blob or '丙纶长丝行业领跑者' in blob or '230613' in blob:
                item={'title':title,'href':href}
                if item not in links:links.append(item)
            for pat in [r'https?://[^"\'<>\s]+(?:蒙泰|mengtai)[^"\'<>\s]*',r'(?:baogao|bgdown)/(\d+)\.html']:
              vals=re.findall(pat,text,re.I)
              if vals:print('PATTERN='+json.dumps({'url':url,'pattern':pat,'values':vals[:100]},ensure_ascii=False))
          print('LINKS='+json.dumps(links,ensure_ascii=False))
          if not links:
            raise RuntimeError('Exact Mengtai link not found on topic pages')

          # Inspect every exact report/detail link and all assets/API-like strings.
          for item in links:
            url=item['href']
            if not any(x in url for x in ['/baogao/','/bgdown/']):continue
            r=session.get(url,timeout=90,allow_redirects=True)
            text=html.unescape(r.text).replace('\\/','/')
            visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
            visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
            visible=re.sub(r'<[^>]+>',' ',visible);visible=re.sub(r'\s+',' ',visible).strip()
            assets=[]
            for pat in [
              r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',
              r'https?://[^"\'<>\s]+?\.(?:png|jpe?g|webp)(?:\?[^"\'<>\s]*)?',
              r'(?:href|src|action|data|value)=["\']([^"\']+)["\']',
            ]:
              for v in re.findall(pat,text,re.I):
                if isinstance(v,tuple):v=v[0]
                u=urljoin(r.url,html.unescape(unquote(v)))
                low=u.lower()
                if any(k in low for k in ['pdf','down','download','file','report','baogao','img','upload','view','read']):
                  if u not in assets:assets.append(u)
            scripts=[urljoin(r.url,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)]
            snippets=[]
            for needle in ['download','下载PDF','pdf','fileurl','downurl','reportid','docid','bgdown','立即下载','预览','original','source']:
              for m in list(re.finditer(needle,text,re.I))[:20]:
                snippets.append(re.sub(r'\s+',' ',text[max(0,m.start()-350):m.start()+1200]))
            print('DETAIL='+json.dumps({'item':item,'final':r.url,'status':r.status_code,'bytes':len(r.content),'visible_head':visible[:2500],'assets':assets[:300],'scripts':scripts,'snippets':snippets[:100]},ensure_ascii=False))
            for su in scripts:
              try:
                q=session.get(su,timeout=90);body=q.text.replace('\\/','/')
                hits=[]
                for needle in ['download','pdf','bgdown','fileurl','downurl','reportid','baogao','ajax','api/']:
                  for m in list(re.finditer(needle,body,re.I))[:30]:hits.append(re.sub(r'\s+',' ',body[max(0,m.start()-400):m.start()+1400]))
                if hits:print('SCRIPT='+json.dumps({'url':su,'status':q.status_code,'bytes':len(q.content),'hits':hits[:100]},ensure_ascii=False))
              except Exception as e:print('SCRIPT_ERR='+json.dumps({'url':su,'error':repr(e)},ensure_ascii=False))
          PY
