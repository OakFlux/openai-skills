name: Probe Jingxue 301010 broker reports

on:
  push:
    branches:
      - tmp-jingxue-broker-probe-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query report indexes and validate attachments
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4 pypdf
          python3 - <<'PY'
          from __future__ import annotations
          import io, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5',
              'Referer':'https://data.eastmoney.com/report/301010.html',
          })

          params={
              'code':'301010','qType':'0','industryCode':'*','industry':'*',
              'pageSize':'100','pageNo':'1','beginTime':'2010-01-01','endTime':'2026-11-03',
              'rating':'','ratingChange':'','fields':'','orgCode':'','p':'1','pageNum':'1',
          }
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,90),allow_redirects=True)
          print('EASTMONEY_API',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          print(r.text[:5000])
          payload=r.json() if r.ok and r.text.strip().startswith('{') else {}
          rows=payload.get('data') or []
          if isinstance(rows,dict): rows=rows.get('data') or rows.get('list') or []
          print('ROW_COUNT',len(rows))
          for idx,x in enumerate(rows,1):
              title=str(x.get('title') or '')
              org=str(x.get('orgSName') or x.get('orgName') or '')
              date=str(x.get('publishDate') or '')
              info=str(x.get('infoCode') or '')
              pages=x.get('attachPages')
              print('ROW',idx,json.dumps({'title':title,'org':org,'date':date,'infoCode':info,'attachPages':pages,'raw':x},ensure_ascii=False)[:5000])
              if not info: continue
              for host in ['H2','H3']:
                  for ext in ['pdf','PDF']:
                      url=f'https://pdf.dfcfw.com/pdf/{host}_{info}_1.{ext}'
                      try:
                          z=s.get(url,headers={'Referer':f'https://data.eastmoney.com/report/info/{info}.html','Accept':'application/pdf,*/*'},timeout=(20,120),allow_redirects=True)
                          data=z.content
                          p=0; company=False; broker=False; chars=0
                          if data.startswith(b'%PDF-'):
                              try:
                                  rr=PdfReader(io.BytesIO(data),strict=False); p=len(rr.pages)
                                  text=''.join((pg.extract_text() or '') for pg in rr.pages)
                                  compact=re.sub(r'\s+','',text)
                                  chars=len(compact)
                                  company=('晶雪节能' in compact or '301010' in compact or '江苏晶雪节能科技股份有限公司' in compact)
                                  key=org.replace('证券股份有限公司','').replace('证券','')
                                  broker=(org in compact or (key and key in compact))
                              except Exception as e: print('PARSE_ERROR',url,repr(e))
                          print('PDF',url,'STATUS',z.status_code,'BYTES',len(data),'TYPE',z.headers.get('content-type'),'HEAD',data[:5],'PAGES',p,'COMPANY',company,'BROKER',broker,'CHARS',chars)
                      except Exception as e:
                          print('PDF_ERROR',url,repr(e))

          print('\n--- SINA REPORT LIST ---')
          urls=[
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=301010',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/company/index.phtml?symbol=301010',
          ]
          for u in urls:
              try:
                  q=s.get(u,timeout=(20,90),allow_redirects=True)
                  q.encoding=q.apparent_encoding or q.encoding or 'gb18030'
                  print('SINA',q.status_code,len(q.content),q.url,q.headers.get('content-type'))
                  soup=BeautifulSoup(q.text,'html.parser')
                  print('TITLE',soup.title)
                  for a in soup.find_all('a',href=True):
                      label=re.sub(r'\s+','',a.get_text(' ',strip=True))
                      href=urljoin(q.url,a.get('href'))
                      if any(k in label for k in ['晶雪节能','首次覆盖','深度']) or 'vReport_Show' in href:
                          print('SINA_LINK',label,href)
              except Exception as e:
                  print('SINA_ERROR',u,repr(e))
          PY
