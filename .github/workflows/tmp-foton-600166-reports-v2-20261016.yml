name: Build corrected Foton Motor financial-report package

on:
  push:
    branches: [tmp-foton-600166-reports-20261016]
    paths: ['.github/workflows/tmp-foton-600166-reports-v2-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='福田汽车_600166_2020-2025年报及最新季报'
          mkdir -p "$PACKAGE"

          python3 - <<'PY'
          import html, json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          outdir=Path('福田汽车_600166_2020-2025年报及最新季报')
          records=[
            {'category':'年度报告','period':'2020年度','detail_title':'福田汽车：2020年度报告全文','filename':'01_福田汽车_2020年年度报告.pdf','detail_url':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600166&id=7205087'},
            {'category':'年度报告','period':'2021年度','detail_title':'福田汽车：2021年度报告全文','filename':'02_福田汽车_2021年年度报告.pdf','detail_url':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600166&id=8171464'},
            {'category':'年度报告','period':'2022年度','detail_title':'福田汽车：2022年年度报告全文','filename':'03_福田汽车_2022年年度报告.pdf','detail_url':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600166&id=9170557'},
            {'category':'年度报告','period':'2023年度','detail_title':'福田汽车：2023年年度报告','filename':'04_福田汽车_2023年年度报告.pdf','detail_url':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600166&id=10119549'},
            {'category':'年度报告','period':'2024年度','detail_title':'福田汽车：2024年年度报告','filename':'05_福田汽车_2024年年度报告.pdf','detail_url':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600166&id=11003748'},
            {'category':'年度报告','period':'2025年度','detail_title':'福田汽车：2025年年度报告','filename':'06_福田汽车_2025年年度报告.pdf','detail_url':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600166&id=12196827'},
            {'category':'最新季报','period':'2026年第一季度','detail_title':'福田汽车：2026年第一季度报告（修订版）','filename':'07_福田汽车_2026年第一季度报告_修订版_最新季报.pdf','detail_url':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=600166&id=12293540'},
          ]

          def fetch(url,referer=None):
            headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8'}
            if referer: headers['Referer']=referer
            last=None
            for attempt in range(7):
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=300) as r:
                  return r.read(),r.geturl()
              except Exception as exc:
                last=exc; time.sleep(2+attempt)
            raise RuntimeError(f'Failed to fetch {url}: {last}')

          def decode(raw):
            for enc in ('utf-8','gb18030','gbk'):
              try: return raw.decode(enc)
              except UnicodeDecodeError: pass
            return raw.decode('utf-8',errors='replace')

          anchor_pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          def extract_pdf(detail_url):
            raw,final=fetch(detail_url)
            text=decode(raw)
            candidates=[]
            for m in anchor_pat.finditer(text):
              label=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
              label=re.sub(r'\s+','',label)
              href=urllib.parse.urljoin(final,html.unescape(m.group(1).strip()))
              if '下载公告' in label or '.pdf' in href.lower():
                candidates.append((0 if '下载公告' in label else 1,urllib.parse.unquote(href)))
            if not candidates:
              raise RuntimeError(f'Could not find PDF link on {detail_url}')
            candidates.sort(key=lambda x:x[0])
            return candidates[0][1]

          for rec in records:
            pdf_url=extract_pdf(rec['detail_url'])
            raw,final=fetch(pdf_url,rec['detail_url'])
            if not raw.startswith(b'%PDF-'):
              raise SystemExit(f'Not a PDF: {pdf_url}; prefix={raw[:80]!r}')
            if len(raw)<50000:
              raise SystemExit(f'PDF too small: {pdf_url}; bytes={len(raw)}')
            path=outdir/rec['filename']
            path.write_bytes(raw)
            rec['pdf_url']=final
            rec['bytes']=len(raw)
            print(f'Saved {path} ({len(raw)} bytes) from {final}')

          (outdir/'_download_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$qstatus"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l 12 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '北汽福田汽车股份有限公司|福田汽车|FOTON' "$pdf.txt"
            rm -f "$pdf.txt"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$pdf.render" >/dev/null 2>&1
            test -s "$pdf.render.png"
            rm -f "$pdf.render.png"
            echo "Validated: $(basename "$pdf") ($pages pages, $(stat -c%s "$pdf") bytes)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          folder=Path('福田汽车_600166_2020-2025年报及最新季报')
          meta=json.loads((folder/'_download_metadata.json').read_text(encoding='utf-8'))
          pdfs=sorted(folder.glob('*.pdf'))
          if len(pdfs)!=7: raise SystemExit(f'Expected 7 PDFs, found {len(pdfs)}')
          by_name={x['filename']:x for x in meta}
          lines=['北汽福田汽车股份有限公司（福田汽车，600166）','2020—2025年年度报告及最新季报','整理日期：2026-10-16','','收录说明：','1. 收录2020—2025年度报告全文，共6份。','2. 最新季报采用2026年5月1日披露的《2026年第一季度报告（修订版）》。','3. 截至2026-10-16，2026年第三季度报告尚未披露；2026年半年度报告不属于季度报告，未用其替代。','4. PDF来自公开披露公告附件镜像，正文所载指定披露平台为上海证券交易所。','','文件清单：']
          sums=[]; total_pages=0; total_bytes=0
          for pdf in pdfs:
            item=by_name[pdf.name]; data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace',stderr=subprocess.DEVNULL)
            pages=int(next(line.split(':',1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
            total_pages+=pages; total_bytes+=len(data)
            lines += [f'- {pdf.name}',f"  类型：{item['category']}；报告期：{item['period']}；页数：{pages}；大小：{len(data)}字节",f"  公告标题：{item['detail_title']}",f"  PDF来源：{item['pdf_url']}",f'  SHA-256：{sha}']
            sums.append(f'{sha}  {pdf.name}')
          lines += ['',f'合计页数：{total_pages}页。',f'PDF原件合计大小：{total_bytes}字节。','全部PDF均已通过文件头、文件大小、PDF结构、页数、正文公司名称及首页渲染检查。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (folder/'_download_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Foton-Motor-600166-2020-2025-annual-and-latest-quarter-v2
          path: 福田汽车_600166_2020-2025年报及最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
