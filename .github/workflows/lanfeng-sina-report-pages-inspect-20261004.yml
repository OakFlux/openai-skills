name: Inspect selected Sina Lanfeng reports 20261004
on:
  push:
    paths:
      - '.github/workflows/lanfeng-sina-report-pages-inspect-20261004.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,requests,html
          from pathlib import Path
          from bs4 import BeautifulSoup

          ids=['563614109620','381918492631','352393371359','343815550875']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://stock.finance.sina.com.cn/'})
          result=[]
          for rid in ids:
            url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
            r=s.get(url,timeout=60)
            raw=r.content
            Path(f'out/{rid}.html').write_bytes(raw)
            text=raw.decode('gb18030','replace')
            soup=BeautifulSoup(text,'lxml')
            title_node=soup.select_one('.content h1') or soup.find('h1') or soup.title
            title=' '.join(title_node.get_text(' ',strip=True).split()) if title_node else ''
            meta_node=soup.select_one('.content .creab') or soup.select_one('.creab')
            meta=' '.join(meta_node.get_text(' ',strip=True).split()) if meta_node else ''
            content_node=soup.select_one('.content .blk_container') or soup.select_one('.blk_container')
            body=''
            if content_node:
              for br in content_node.find_all('br'): br.replace_with('\n')
              body=content_node.get_text('\n',strip=True)
              body=re.sub(r'\n\s*\n+', '\n\n', body)
            links=[]
            for a in soup.find_all('a',href=True):
              href=a.get('href','')
              label=' '.join(a.get_text(' ',strip=True).split())
              if any(x in href.lower() for x in ('.pdf','download','report')) or any(x in label for x in ('下载','PDF','全文')):
                links.append({'text':label,'href':href})
            item={'report_id':rid,'url':url,'status':r.status_code,'bytes':len(raw),'title':title,'meta':meta,'body':body,'body_chars':len(body),'links':links}
            result.append(item)
            Path(f'out/{rid}.json').write_text(json.dumps(item,ensure_ascii=False,indent=2),encoding='utf-8')
            print(json.dumps(item,ensure_ascii=False,indent=2))
          Path('out/summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lanfeng-sina-report-pages-inspection
          path: out
          retention-days: 7
          if-no-files-found: error
