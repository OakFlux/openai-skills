name: Temporary inspect public Microbell Yuexiu report images

on:
  push:
    branches:
      - tmp-microbell-yuexiu-images-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public page images
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          python - <<'PY'
          import html, io, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          out=Path('output'); out.mkdir(exist_ok=True)
          page='https://www.microbell.com/repinfodetail_5101524.html'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':page})
          r=s.get(page,timeout=45)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          raw=html.unescape(r.text).replace('\\/','/')
          (out/'page.html').write_text(raw,encoding='utf-8')
          soup=BeautifulSoup(raw,'html.parser')
          urls=[]
          for tag in soup.find_all(True):
              for a in ['src','href','data-src','data-original','data-url','content']:
                  v=tag.get(a)
                  if isinstance(v,str):
                      u=urljoin(r.url,v)
                      if any(k in u.lower() for k in ['checkmd5file','hibor.com.cn','reportimage','report-image','.gif','.jpg','.png']):
                          urls.append(u)
          for m in re.findall(r'https?://[^\"\'<>\\\s]+',raw):
              if any(k in m.lower() for k in ['checkmd5file','hibor.com.cn','reportimage','report-image','.gif','.jpg','.png']): urls.append(m)
          urls=list(dict.fromkeys(urls))
          print('URLS',len(urls))
          for i,u in enumerate(urls,1): print('URL',i,u)
          meta=[]
          for i,u in enumerate(urls,1):
              try:
                  rr=s.get(u,timeout=45,headers={'Referer':page,'User-Agent':s.headers['User-Agent']})
                  print('FETCH',i,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'))
                  if rr.status_code==200 and len(rr.content)>1000:
                      suffix='.gif' if 'gif' in (rr.headers.get('content-type') or '').lower() or '.gif' in rr.url.lower() else '.bin'
                      p=out/f'asset_{i:03d}{suffix}'; p.write_bytes(rr.content)
                      try:
                          im=Image.open(io.BytesIO(rr.content)); frames=getattr(im,'n_frames',1)
                          info={'url':rr.url,'file':p.name,'format':im.format,'size':im.size,'frames':frames,'bytes':len(rr.content)}
                          print('IMAGE',json.dumps(info,ensure_ascii=False)); meta.append(info)
                          for fi in range(frames):
                              im.seek(fi); im.convert('RGB').save(out/f'asset_{i:03d}_frame_{fi+1:03d}.png')
                      except Exception as e: print('NOTIMAGE',repr(e))
              except Exception as e: print('ERR',i,u,repr(e))
          (out/'meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: microbell-yuexiu-public-images
          path: output
          retention-days: 1
