name: Build final Yunzhisheng 09678 filings package v2 20260927

on:
  push:
    paths:
      - '.github/workflows/unisound-09678-filings-explicit-final-v2-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download official HKEX PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='云知声_09678_全部年报_招股说明书及最新阶段性财务报告'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)

          docs=[
            {
              'type':'2025年年度报告','lang':'英文','filename':'01_Unisound_2025_Annual_Report_EN.pdf',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042906218.pdf',
              'min_pages':150,'expected_identity':['UNISOUND','ANNUAL']
            },
            {
              'type':'2025年年度报告','lang':'中文','filename':'02_云知声_2025年年度报告_中文.pdf',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042906219_c.pdf',
              'min_pages':150,'expected_identity':['雲知聲','年度報告']
            },
            {
              'type':'最终招股章程（全球发售）','lang':'英文','filename':'03_Unisound_Final_Prospectus_Global_Offering_EN_2025-06-20.pdf',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0620/2025062000023.pdf',
              'min_pages':500,'expected_identity':['UNISOUND','GLOBAL OFFERING']
            },
            {
              'type':'最终招股章程（全球发售）','lang':'中文','filename':'04_云知声_最终招股章程_全球发售_中文_2025-06-20.pdf',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0620/2025062000024_c.pdf',
              'min_pages':500,'expected_identity':['雲知聲','全球發售']
            },
            {
              'type':'2026年中期报告','lang':'英文','filename':'05_Unisound_2026_Interim_Report_EN.pdf',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0923/2026092301927.pdf',
              'min_pages':50,'expected_identity':['UNISOUND','INTERIM']
            },
            {
              'type':'2026年中期报告','lang':'中文','filename':'06_云知声_2026年中期报告_中文.pdf',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0923/2026092301928_c.pdf',
              'min_pages':50,'expected_identity':['雲知聲','中期']
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www1.hkexnews.hk/'
          })

          def download(url):
            last=None
            for attempt in range(7):
              try:
                r=s.get(url,timeout=(30,180),allow_redirects=True)
                last={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                  return r.content,last
              except Exception as e:
                last={'error':repr(e)}
              time.sleep(2+attempt)
            raise RuntimeError(f'download failed {url}: {last}')

          manifest=[]
          for rec in docs:
            data,meta=download(rec['url'])
            path=root/rec['filename']; path.write_bytes(data)
            reader=PdfReader(str(path),strict=False)
            pages=len(reader.pages)
            if pages<rec['min_pages']:
              raise RuntimeError(f"Page count too low for {path.name}: {pages} < {rec['min_pages']}")
            text='\n'.join((reader.pages[i].extract_text() or '') for i in range(min(5,pages))).upper()
            # Chinese extraction may be incomplete, so identity is recorded rather than used as a hard failure.
            identity_hits=[term for term in rec['expected_identity'] if term.upper() in text]
            subprocess.run(['qpdf','--check',str(path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/path.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(path),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<15000:
              raise RuntimeError(f'preview render failed: {path.name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**rec,'pages':pages,'bytes':len(data),'sha256':sha,'download':meta,'identity_hits':identity_hits,'preview_file':str(Path('首页预览')/preview.name),'validation':['PDF signature','minimum page count','qpdf structure','first-page render']})

          lines=[
            '云知声智能科技股份有限公司（09678.HK）官方披露资料包',
            '整理日期：2026-09-27','',
            '本包收录6份港交所官方PDF原件：2025年年度报告、2025年6月20日最终招股章程，以及2026年中期报告，均包含中文和英文版本。','',
            '范围说明：',
            '1. 云知声于2025年6月30日在香港联交所上市，因此上市后完整年度报告目前只有2025年年度报告。',
            '2. 2022—2024年历史财务资料载于最终招股章程及2025年年度报告的比较数据中；这些年份没有独立的上市公司年度报告。',
            '3. 港股公司通常不按A股口径披露第一季度和第三季度报告。最新完整阶段性财务文件为截至2026年6月30日止六个月的2026年中期报告，于2026年9月23日发布。','',
            '文件清单：'
          ]
          for i,x in enumerate(manifest,1):
            lines += [f"{i}. {x['filename']}",f"   类型：{x['type']}；语言：{x['lang']}；页数：{x['pages']}",f"   港交所来源：{x['url']}",f"   SHA-256：{x['sha256']}",'']
          lines += ['全部PDF已完成文件头、页数、qpdf结构和首页渲染检查；ZIP已通过CRC完整性测试。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failure: '+bad)
            pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if len(pdfs)!=6: raise RuntimeError(f'Expected 6 PDFs, found {len(pdfs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: unisound-09678-filings-explicit-final-v2
          path: 云知声_09678_全部年报_招股说明书及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
