name: Search Hangyan autocomplete for Zhaojin Mining reports
on:
  push:
    branches:
      - tmp-zhaojin-hangyan-autocomplete-20260907
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Query autocomplete
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          out=Path('output')
          queries=['招金矿业','优质老牌金企','海域金矿打开量增和降本空间','招金矿业 投资价值分析报告','01818.HK']
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36'
          result=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled'])
              for idx,q in enumerate(queries,1):
                  ctx=browser.new_context(viewport={'width':1440,'height':1200},locale='zh-CN',user_agent=ua,extra_http_headers={'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
                  ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined});")
                  page=ctx.new_page(); reqs=[]; resps=[]
                  page.on('request',lambda x:reqs.append({'url':x.url,'method':x.method,'type':x.resource_type,'post_data':x.post_data}) if any(k in x.url.lower() for k in ['search','autocomplete','report','query','algolia']) else None)
                  def on_resp(x):
                      if any(k in x.url.lower() for k in ['search','autocomplete','report','query','algolia']):
                          r={'url':x.url,'status':x.status,'headers':dict(x.headers)}
                          try:
                              c=x.headers.get('content-type') or ''
                              if 'json' in c or 'text' in c:r['body']=x.text()[:500000]
                          except Exception as exc:r['body_error']=repr(exc)
                          resps.append(r)
                  page.on('response',on_resp)
                  row={'query':q}
                  try:
                      rr=page.goto('https://www.hangyan.co/',wait_until='domcontentloaded',timeout=120000)
                      try:page.wait_for_load_state('networkidle',timeout=30000)
                      except PWTimeout:pass
                      page.wait_for_timeout(3000)
                      inp=page.locator('#autocomplete-0-input')
                      if inp.count()==0:
                          inp=page.locator('input[type="search"]').first
                      inp.fill(q)
                      page.wait_for_timeout(5000)
                      row.update({'status':rr.status if rr else None,'url':page.url,'title':page.title(),'body':' '.join(page.locator('body').inner_text().split())[:100000]})
                      row['all_links']=page.eval_on_selector_all('a','els=>els.map(e=>({href:e.href,text:(e.innerText||e.textContent||"").trim(),html:e.outerHTML}))')
                      row['suggestions']=page.eval_on_selector_all('.aa-Panel a, [role="option"] a, .aa-Item a, [class*="autocomplete"] a','els=>els.map(e=>({href:e.href,text:(e.innerText||e.textContent||"").trim(),html:e.outerHTML}))')
                      row['panel_html']=page.locator('.aa-Panel').inner_html() if page.locator('.aa-Panel').count() else ''
                      (out/f'page_{idx}.html').write_text(page.content(),encoding='utf-8')
                      page.screenshot(path=str(out/f'page_{idx}.png'),full_page=True)
                      print('QUERY',q,'links',len(row['all_links']),'suggestions',len(row['suggestions']),flush=True)
                      for a in row['all_links']:
                          hay=(a.get('href','')+' '+a.get('text','')).lower()
                          if any(k in hay for k in ['招金','zhaojin','优质老牌','海域金矿','01818']):
                              print('MATCH',q,json.dumps(a,ensure_ascii=False)[:5000],flush=True)
                  except Exception as exc:row['error']=repr(exc)
                  row['requests']=reqs[-3000:];row['responses']=resps[-3000:]
                  result.append(row);ctx.close()
              browser.close()
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-hangyan-autocomplete
          path: output/*
          retention-days: 1
          if-no-files-found: error
