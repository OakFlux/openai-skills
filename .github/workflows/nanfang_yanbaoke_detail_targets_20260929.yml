name: South Precision Yanbaoke Target Detail Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_yanbaoke_detail_targets_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow pypdf

      - name: Inspect target detail pages and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import io,json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader

          targets=[
            {'id':'9ZqeyWaMotixaPaLD9URUv','year':'2026','month':'01','pages':31,'label':'2026_galaxy'},
            {'id':'viNYkEYokEWS9s6k9cFXqM','year':'2022','month':'10','pages':26,'label':'2022_eastmoney'},
            {'id':'Hhrz8rvYiCE9H2ymLXSG8Z','year':'2018','month':'07','pages':22,'label':'2016_guojin'},
            {'id':'FDCE8TpTrmKKDrxC5bXcF7','year':'2018','month':'07','pages':33,'label':'2016_anxin'},
          ]
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          final=[]

          def is_image(resp):
            c=(resp.headers.get('content-type') or '').lower()
            return resp.status_code==200 and len(resp.content)>1000 and ('image' in c or resp.content.startswith(b'\x89PNG') or resp.content.startswith(b'\xff\xd8') or resp.content.startswith(b'RIFF'))

          for target in targets:
            doc_id=target['id']; page_url=f'https://www.yanbaoke.com/info/{doc_id}'
            r=session.get(page_url,timeout=60,allow_redirects=True)
            text=r.content.decode('utf-8','replace')
            Path(f"output/{target['label']}_detail.html").write_text(text,encoding='utf-8')
            soup=BeautifulSoup(text,'html.parser')
            print('\n'+'='*140)
            print('DETAIL',target,page_url,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')

            candidates=[]
            attrs=('href','src','data','data-src','data-url','data-file','value','content')
            for tag in soup.find_all(True):
              for attr in attrs:
                value=tag.get(attr)
                if not value or not isinstance(value,str): continue
                full=urljoin(r.url,value.replace('\\/','/'))
                blob=(tag.get_text(' ',strip=True)+' '+full+' '+str(tag.attrs)).lower()
                if any(k in blob for k in ['.pdf','.doc','.ppt','download','file','attachment','preview','viewer','quzili',doc_id.lower(),'api']):
                  candidates.append({'tag':tag.name,'attr':attr,'text':tag.get_text(' ',strip=True)[:160],'url':full,'attrs':str(tag.attrs)[:700]})
            for pattern in [r'https?://[^\"\'<>\\s]+', r'["\']([^"\']+\.(?:pdf|docx?|pptx?|jpg|jpeg|png|webp)(?:\?[^"\']*)?)["\']']:
              for m in re.finditer(pattern,text,re.I):
                value=m.group(1) if m.lastindex else m.group(0)
                value=urljoin(r.url,value.replace('\\/','/').replace('&amp;','&'))
                if any(k in value.lower() for k in ['pdf','doc','ppt','download','file','attachment','preview','viewer','quzili',doc_id.lower(),'api']):
                  candidates.append({'tag':'regex','attr':'','text':'','url':value,'attrs':''})
            dedup=[]; seen=set()
            for item in candidates:
              u=item['url'].rstrip('),;')
              if u not in seen:
                item['url']=u; dedup.append(item); seen.add(u)
            print('CANDIDATES',json.dumps(dedup,ensure_ascii=False,indent=2))

            print('RELEVANT_LINES')
            for i,line in enumerate(text.splitlines(),1):
              if re.search(r'pdf|download|file|attachment|preview|viewer|api|quzili|'+re.escape(doc_id)+r'|pageCount|totalPage|pageNum|original',line,re.I):
                print('LINE',i,line[:12000])

            scripts=[urljoin(r.url,tag['src']) for tag in soup.find_all('script',src=True)]
            script_hits=[]
            for js_url in scripts:
              try:
                jr=session.get(js_url,headers={'Referer':r.url},timeout=60)
                js=jr.content.decode('utf-8','replace')
                if re.search(r'pdf|download|attachment|preview|viewer|api|fileUrl|docId|quzili|pageCount',js,re.I):
                  script_hits.append({'url':js_url,'status':jr.status_code,'bytes':len(jr.content)})
                  print('SCRIPT',js_url,jr.status_code,len(jr.content))
                  for j,line in enumerate(js.splitlines(),1):
                    if re.search(r'pdf|download|attachment|preview|viewer|api|fileUrl|docId|quzili|pageCount',line,re.I):
                      print('JSLINE',j,line[:14000])
              except Exception as exc: print('SCRIPT_ERR',js_url,repr(exc))

            pdf_results=[]
            for item in dedup:
              u=item['url']
              if not any(k in u.lower() for k in ['.pdf','download','attachment','original','file/']): continue
              try:
                rr=session.get(u,headers={'Referer':r.url},timeout=120,allow_redirects=True)
                print('PDF_PROBE',u,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),repr(rr.content[:16]))
                if rr.status_code==200 and rr.content.startswith(b'%PDF'):
                  reader=PdfReader(io.BytesIO(rr.content))
                  text_probe=''
                  for p in range(min(3,len(reader.pages))):
                    try:text_probe+=reader.pages[p].extract_text() or ''
                    except:pass
                  pdf_results.append({'url':u,'final_url':rr.url,'pages':len(reader.pages),'bytes':len(rr.content),'encrypted':bool(reader.is_encrypted),'text_excerpt':re.sub(r'\s+',' ',text_probe)[:1200]})
              except Exception as exc: print('PDF_ERR',u,repr(exc))

            # Probe predictable public asset paths. Use known listing path pattern and common full-page suffixes.
            base=f"https://pic2.quzili.cn/files2/{target['year']}/{target['year']}-{target['month']}/{doc_id}"
            thumb=f'{base}/{doc_id}-0-thumb.jpg'
            tr=session.get(thumb,headers={'Referer':r.url},timeout=45)
            print('THUMB',thumb,tr.status_code,len(tr.content),tr.headers.get('content-type'),is_image(tr))
            asset_results=[]
            patterns=[
              '{id}-{n}.jpg','{id}-{n}.png','{id}-{n}.webp',
              '{id}-{n}-large.jpg','{id}-{n}-origin.jpg','{id}-{n}-preview.jpg',
              '{id}-{n}-thumb.jpg',
            ]
            for n in range(0,min(target['pages']+3,40)):
              page_found=[]
              for pat in patterns:
                u=base+'/'+pat.format(id=doc_id,n=n)
                try:
                  rr=session.get(u,headers={'Referer':r.url},timeout=35)
                  ok=is_image(rr)
                  if ok:
                    try:
                      im=Image.open(io.BytesIO(rr.content)); size=im.size; fmt=im.format
                    except Exception: size=None; fmt=None
                    rec={'n':n,'url':u,'bytes':len(rr.content),'content_type':rr.headers.get('content-type'),'size':size,'format':fmt}
                    page_found.append(rec); asset_results.append(rec)
                    print('ASSET_OK',json.dumps(rec,ensure_ascii=False))
                    if '-thumb' not in u: break
                except Exception as exc: pass
              if n>=3 and not page_found and not any(x['n']>=n-2 for x in asset_results):
                # keep scanning a little because some sets use 1-based indexing
                pass

            record={'target':target,'detail_url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'candidates':dedup,'script_hits':script_hits,'pdf_results':pdf_results,'asset_results':asset_results}
            final.append(record)
            Path(f"output/{target['label']}_result.json").write_text(json.dumps(record,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/all_results.json').write_text(json.dumps(final,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\nFINAL',json.dumps(final,ensure_ascii=False,indent=2))
          PY

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-yanbaoke-target-details
          path: output/
          retention-days: 1
