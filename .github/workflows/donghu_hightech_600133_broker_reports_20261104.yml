name: package-donghu-hightech-600133-broker-reports

on:
  push:
    branches:
      - tmp/donghu-hightech-600133-broker-reports-20261104-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download verify and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = "东湖高新"
          FULL_NAME = "武汉东湖高新集团股份有限公司"
          CODE = "600133"
          PREPARED = "2026-11-04"
          ROOT_NAME = "东湖高新_600133_券商深度研究报告"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def get_json(url: str):
              last = None
              for attempt in range(4):
                  try:
                      response = session.get(url, timeout=(30, 300), allow_redirects=True)
                      print("GET_JSON", response.status_code, len(response.content), url)
                      response.raise_for_status()
                      return response.json()
                  except Exception as exc:
                      last = exc
                      print("GET_JSON_ERROR", attempt, repr(exc), url)
                      time.sleep(1 + attempt)
              raise last

          candidates: dict[str, dict] = {}
          for year in range(2012, 2027):
              urls = [
                  f"https://raw.githubusercontent.com/metatools2023/reportlists/main/site/data/index-{year}.json",
                  f"https://reportlists.pages.dev/data/index-{year}.json",
              ]
              data = None
              for url in urls:
                  try:
                      data = get_json(url)
                      break
                  except Exception:
                      continue
              if not data:
                  print("INDEX_MISSING", year)
                  continue
              for rec in data.get("reports", []):
                  info = str(rec.get("i") or "")
                  stock = str(rec.get("s") or "")
                  title = str(rec.get("t") or "")
                  qtype = rec.get("q")
                  if not info or qtype != 0:
                      continue
                  blob = f"{stock} {title}"
                  if stock == COMPANY or COMPANY in blob or CODE in blob:
                      candidates[info] = {
                          "infoCode": info,
                          "date": str(rec.get("d") or ""),
                          "title": title,
                          "broker": str(rec.get("o") or ""),
                          "industry": str(rec.get("n") or ""),
                          "rating": str(rec.get("r") or ""),
                          "analyst": str(rec.get("a") or ""),
                          "stock": stock,
                          "index_year": year,
                      }

          print("CANDIDATE_COUNT", len(candidates))
          for item in sorted(candidates.values(), key=lambda x: (x["date"], x["infoCode"]), reverse=True):
              print("CANDIDATE", json.dumps(item, ensure_ascii=False))

          def safe_name(text: str, limit: int = 88) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text).strip(" ._")
              return text[:limit] or "report"

          def download_pdf(info_code: str):
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf",
              ]
              for url in urls:
                  try:
                      response = session.get(
                          url,
                          timeout=(30, 360),
                          allow_redirects=True,
                          headers={"Referer": "https://data.eastmoney.com/", "Accept": "application/pdf,*/*;q=0.8"},
                      )
                      print("PDF_PROBE", response.status_code, len(response.content), response.headers.get("content-type"), url)
                      if response.status_code == 200 and response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                          return response.content, url
                  except Exception as exc:
                      print("PDF_ERROR", url, repr(exc))
              return None

          def score(meta: dict, pages: int) -> int:
              title = meta["title"]
              value = 0
              if "首次覆盖" in title or "首次" in title:
                  value += 110
              if "深度" in title:
                  value += 90
              if any(token in title for token in ["轻装再出发", "投资价值", "价值重估", "战略转型", "转型升级", "园区运营", "数字科技", "数科"]):
                  value += 35
              if pages >= 35:
                  value += 75
              elif pages >= 25:
                  value += 60
              elif pages >= 18:
                  value += 45
              elif pages >= 12:
                  value += 30
              elif pages >= 8:
                  value += 15
              elif pages >= 5:
                  value += 5
              if meta["date"] >= "2023-01-01":
                  value += 20
              elif meta["date"] >= "2020-01-01":
                  value += 12
              if any(token in title for token in ["季报点评", "年报点评", "中报点评", "业绩点评", "点评报告"]):
                  value -= 20
              if pages < 8:
                  value -= 20
              return value

          downloaded = []
          temp_dir = Path("_downloaded")
          temp_dir.mkdir(exist_ok=True)
          for meta in sorted(candidates.values(), key=lambda x: (x["date"], x["infoCode"]), reverse=True):
              result = download_pdf(meta["infoCode"])
              if result is None:
                  continue
              data, source_url = result
              temp_path = temp_dir / f"{meta['infoCode']}.pdf"
              temp_path.write_bytes(data)
              try:
                  reader = PdfReader(str(temp_path), strict=False)
                  pages = len(reader.pages)
                  text_parts = []
                  for page in reader.pages[: min(8, pages)]:
                      try:
                          text_parts.append(page.extract_text() or "")
                      except Exception:
                          pass
                  compact = re.sub(r"\s+", "", "\n".join(text_parts))
              except Exception as exc:
                  print("PARSE_ERROR", meta["infoCode"], repr(exc))
                  continue
              if pages < 4:
                  continue
              issuer_text_match = COMPANY in compact or CODE in compact or FULL_NAME in compact
              item = {
                  **meta,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": source_url,
                  "temp_path": str(temp_path),
                  "issuer_text_match": issuer_text_match,
              }
              item["score"] = score(item, pages)
              downloaded.append(item)
              print("DOWNLOADED", item["score"], pages, issuer_text_match, json.dumps(meta, ensure_ascii=False))

          downloaded.sort(key=lambda x: (x["score"], x["date"], x["pages"]), reverse=True)
          qualified = [x for x in downloaded if x["score"] >= 35]
          if len(qualified) < 2:
              qualified = downloaded

          # Prefer at least two different report years; allow repeated broker when coverage is concentrated.
          selected = []
          used_years = set()
          for item in qualified:
              year = item["date"][:4]
              if year not in used_years:
                  selected.append(item)
                  used_years.add(year)
              if len(selected) == 3:
                  break
          if len(selected) < 3:
              for item in qualified:
                  if item not in selected:
                      selected.append(item)
                  if len(selected) == 3:
                      break
          if len(selected) < 2:
              raise RuntimeError(f"Only {len(selected)} validated public broker PDFs were found")

          manifest = []
          for idx, item in enumerate(selected, 1):
              filename = (
                  f"{idx:02d}_{safe_name(item['date'])}_{safe_name(item['broker'] or '未知机构')}_"
                  f"{safe_name(item['title'])}_{item['infoCode']}.pdf"
              )
              source_path = Path(item["temp_path"])
              output_path = PDF_DIR / filename
              output_path.write_bytes(source_path.read_bytes())

              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output_path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf validation failed for {filename}: {check.stdout}")

              prefix = PREVIEW_DIR / output_path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output_path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")

              clean = {k: v for k, v in item.items() if k != "temp_path"}
              clean.update({
                  "filename": filename,
                  "preview_file": str(Path("首页预览") / preview.name),
              })
              manifest.append(clean)

          readme = [
              f"{FULL_NAME}（{CODE}.SH）券商研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              f"本包包含{len(manifest)}份可公开下载并验证的券商原始PDF。",
              "筛选优先级：首次覆盖、公司深度、页数较长的专题研究；若深度覆盖不足，再保留研究价值较高的公司报告。",
              "全部文件均来自公开PDF地址，未使用网页摘要或二次排版文件替代原报告。",
              "",
          ]
          for idx, item in enumerate(manifest, 1):
              report_type = "公司深度/首次覆盖" if ("首次" in item["title"] or "深度" in item["title"] or item["pages"] >= 18) else "公司研究/专题或点评"
              item["report_type"] = report_type
              readme.extend([
                  f"{idx}. {item['filename']}",
                  f"   报告类型：{report_type}",
                  f"   券商：{item['broker']}；研究员：{item['analyst']}；日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['pages']}；原始来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、元数据对应公司、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "files": manifest,
              "all_validated_candidates": [{k: v for k, v in x.items() if k != "temp_path"} for x in downloaded],
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "报告类型", "券商", "研究员", "日期", "标题", "评级", "页数", "字节数", "SHA-256", "原始PDF来源"])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["report_type"], item["broker"], item["analyst"], item["date"],
                      item["title"], item["rating"], item["pages"], item["bytes"], item["sha256"], item["source_url"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("donghu_hightech_600133_broker_deep_reports.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != len(manifest):
                  raise RuntimeError(f"ZIP PDF count mismatch: {len(pdf_names)} vs {len(manifest)}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "files": [{k: item[k] for k in ["filename", "report_type", "broker", "analyst", "date", "title", "rating", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: donghu-hightech-600133-broker-reports-20261104
          path: |
            donghu_hightech_600133_broker_deep_reports.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
