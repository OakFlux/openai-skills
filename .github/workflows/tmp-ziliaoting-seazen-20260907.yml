name: Inspect public Seazen report share links
on:
  push:
    branches:
      - tmp-ziliaoting-seazen-20260907
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml pillow opencv-python-headless pyzbar
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzbar0
      - name: Inspect page, images, and QR codes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/images
          python - <<'PY'
          from __future__ import annotations
          import io, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import cv2
          import numpy as np
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pyzbar.pyzbar import decode as zdecode

          OUT=Path('output'); IMG=OUT/'images'
          page_url='https://www.ziliaoting.com/65594.html'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          result={'page_url':page_url,'images':[],'links':[]}
          r=s.get(page_url,timeout=90,allow_redirects=True)
          result.update({'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'headers':dict(r.headers)})
          (OUT/'page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'lxml')
          result['title']=soup.title.get_text(' ',strip=True) if soup.title else None
          for a in soup.find_all('a',href=True):
              href=urljoin(r.url,a['href']); text=' '.join(a.get_text(' ',strip=True).split())
              if href.startswith('http'):
                  result['links'].append({'href':href,'text':text,'attrs':dict(a.attrs)})
                  if any(k in href.lower() or k in text.lower() for k in ['pan.baidu','aliyundrive','quark','lanzou','123pan','cloud','drive','download','网盘','下载']):
                      print('LIKELY_LINK',json.dumps(result['links'][-1],ensure_ascii=False),flush=True)
          for i,img in enumerate(soup.find_all('img'),1):
              src=img.get('src') or img.get('data-src') or img.get('data-original')
              if not src: continue
              url=urljoin(r.url,src)
              row={'index':i,'url':url,'alt':img.get('alt'),'attrs':dict(img.attrs)}
              try:
                  rr=s.get(url,headers={'Referer':r.url},timeout=90,allow_redirects=True)
                  data=rr.content
                  row.update({'status':rr.status_code,'final_url':rr.url,'bytes':len(data),'content_type':rr.headers.get('content-type')})
                  ext='.bin'
                  try:
                      im=Image.open(io.BytesIO(data)); im.load()
                      row.update({'format':im.format,'width':im.width,'height':im.height})
                      ext='.'+(im.format or 'png').lower().replace('jpeg','jpg')
                      path=IMG/f'{i:03d}{ext}'; path.write_bytes(data); row['saved']=str(path)
                      decoded=[]
                      try:
                          for obj in zdecode(im):
                              decoded.append({'type':obj.type,'data':obj.data.decode('utf-8','replace')})
                      except Exception as e: row['pyzbar_error']=repr(e)
                      try:
                          arr=np.array(im.convert('RGB'))
                          detector=cv2.QRCodeDetector()
                          ok, infos, points, _=detector.detectAndDecodeMulti(arr)
                          if ok:
                              for info in infos:
                                  if info: decoded.append({'type':'QRCODE_OPENCV','data':info})
                          if not decoded:
                              info, pts, _=detector.detectAndDecode(arr)
                              if info: decoded.append({'type':'QRCODE_OPENCV_SINGLE','data':info})
                      except Exception as e: row['opencv_error']=repr(e)
                      row['decoded']=decoded
                      if decoded: print('QR',i,json.dumps(decoded,ensure_ascii=False),flush=True)
                      if im.width>=500 or im.height>=500:
                          print('LARGE_IMAGE',i,im.width,im.height,url,flush=True)
                  except Exception as e: row['image_error']=repr(e)
              except Exception as e: row['fetch_error']=repr(e)
              result['images'].append(row)
          # Search the raw HTML for URLs and cloud share strings.
          decoded_html=r.text.replace('\\/','/').replace('&amp;','&')
          result['raw_urls']=sorted(set(re.findall(r'https?://[^"\'<>\s]+',decoded_html,re.I)))
          for u in result['raw_urls']:
              if any(k in u.lower() for k in ['pan.baidu','aliyundrive','quark','lanzou','123pan','cloud','drive','download']):
                  print('RAW_LIKELY',u,flush=True)
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY',json.dumps({'status':r.status_code,'title':result['title'],'links':len(result['links']),'images':len(result['images'])},ensure_ascii=False),flush=True)
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: ziliaoting-seazen-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
