name: Inspect Hibor report API and mobile pages for Kaichuang International

on:
  push:
    paths:
      - '.github/workflows/kaichuang-international-hibor-api-inspect-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect dynamic report pages and scripts
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html,json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ids=['178938','182952','209931','210263','211839','211932']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for rid in ids:
            urls=[
              f'https://www.hibor.com.cn/docdetail_{rid}.html',
              f'https://www.hibor.com.cn/repinfodetail_{rid}.html',
              f'https://wap.hibor.com.cn/repinfodetail_{rid}.html',
              f'https://wap.hibor.com.cn/docdetail_{rid}.html',
            ]
            for url in urls:
              try:
                r=s.get(url,timeout=30,allow_redirects=True)
                print('\n=== FETCH',rid,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),'===',flush=True)
                if r.status_code!=200: continue
                r.encoding=r.apparent_encoding or 'utf-8'; text=r.text
                print('RAW_PREFIX',text[:18000],flush=True)
                soup=BeautifulSoup(text,'lxml')
                scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]
                print('SCRIPTS',json.dumps(scripts,ensure_ascii=False),flush=True)
                for src in scripts:
                  try:
                    sr=s.get(src,timeout=30); print('SCRIPT_FETCH',src,sr.status_code,len(sr.content),flush=True)
                    st=sr.text
                    terms=('docdetail','repinfodetail','report','pdf','download','ajax','api','data/','file','preview','getdoc','getreport')
                    for term in terms:
                      poses=[m.start() for m in re.finditer(re.escape(term),st,re.I)]
                      if poses:
                        print('SCRIPT_TERM',term,len(poses),flush=True)
                        for p in poses[:15]: print('SCRIPT_CTX',st[max(0,p-1000):p+3500],flush=True)
                  except Exception as e: print('SCRIPT_ERROR',src,repr(e),flush=True)
                for term in ('ajax','api','pdf','download','report','docid','reportid','data:','fetch(','axios','$.get','$.post'):
                  poses=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
                  if poses:
                    print('PAGE_TERM',term,len(poses),flush=True)
                    for p in poses[:30]: print('PAGE_CTX',text[max(0,p-1000):p+4000],flush=True)
              except Exception as e: print('FETCH_ERROR',rid,url,repr(e),flush=True)
          PY
