name: Build Nuosi 301333 disclosure package v2

on:
  push:
    branches:
      - tmp-nuosi-301333-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='诺思格_301333_年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE" /tmp/nuosi_v2_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('诺思格_301333_年报_招股说明书_最新季报')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=6, connect=6, read=6, status=6, backoff_factor=1,
                        status_forcelist=[429,500,502,503,504], allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})

          docs = [
            dict(order=1, file='01_诺思格_首次公开发行股票并在创业板上市招股说明书_2022-07-20.pdf',
                 title='首次公开发行股票并在创业板上市招股说明书', date='2022-07-20', kind='prospectus', min_pages=300,
                 bulletin_id='8371975', detail='https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=301333&id=8371975'),
            dict(order=2, file='02_诺思格_2022年年度报告.pdf', title='2022年年度报告', date='2023-04-25', kind='annual', min_pages=100,
                 bulletin_id='9053904', detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9053904&stockid=301333'),
            dict(order=3, file='03_诺思格_2023年年度报告.pdf', title='2023年年度报告', date='2024-04-22', kind='annual', min_pages=100,
                 bulletin_id='10017139', detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10017139&stockid=301333'),
            dict(order=4, file='04_诺思格_2024年年度报告.pdf', title='2024年年度报告', date='2025-03-28', kind='annual', min_pages=100,
                 bulletin_id='10813876', detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10813876&stockid=301333'),
            dict(order=5, file='05_诺思格_2025年年度报告.pdf', title='2025年年度报告', date='2026-03-28', kind='annual', min_pages=100,
                 bulletin_id='12031823', detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12031823&stockid=301333'),
            dict(order=6, file='06_诺思格_2026年第三季度报告.pdf', title='2026年第三季度报告', date='2026-10-27', kind='quarter', min_pages=8,
                 bulletin_id='12660085', detail='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12660085&stockid=301333'),
          ]

          def sina_urls(doc):
              y = doc['date'][:4]
              m = str(int(doc['date'][5:7]))
              m2 = doc['date'][5:7]
              d = doc['date']
              i = doc['bulletin_id']
              urls=[]
              for market in ('CNSESZ_STOCK','CNSESH_STOCK'):
                  for md in (f'{y}-{m}',f'{y}-{m2}'):
                      for host in ('211.154.219.97:9494','211.154.219.97%3A9494'):
                          urls.append(f'https://file.finance.sina.com.cn/{host}/MRGG/{market}/{y}/{md}/{d}/{i}.PDF')
              return urls

          def candidates(doc):
              urls = sina_urls(doc)
              if doc['kind']=='prospectus':
                  # The official CNINFO files disclosed on 2022-07-20 are sequentially numbered.
                  # Test a narrow sequence and accept only a >300-page PDF whose first pages identify the prospectus.
                  likely=[1214084627,1214084626,1214084625,1214084624,1214084631,1214084633,1214084634,1214084635]
                  likely += [n for n in range(1214084580,1214084661) if n not in likely]
                  urls += [f'https://static.cninfo.com.cn/finalpage/2022-07-20/{n}.PDF' for n in likely]
              return list(dict.fromkeys(urls))

          def text_matches(path, doc, pages):
              reader=PdfReader(str(path),strict=False)
              idxs=list(range(min(12,pages)))
              text=''
              for idx in idxs:
                  try: text += '\n'+(reader.pages[idx].extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','',text)
              if '诺思格' not in compact: return False
              if doc['kind']=='prospectus':
                  return '招股说明书' in compact and ('首次公开发行股票' in compact or '创业板上市' in compact)
              if doc['kind']=='annual':
                  return doc['title'] in compact or doc['title'].replace('年年度','年度') in compact
              return '2026年第三季度报告' in compact or '2026年三季度报告' in compact

          def download(doc):
              dest=out/doc['file']
              last=None
              for url in candidates(doc):
                  try:
                      r=session.get(url,headers={'Referer':doc['detail'],'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},timeout=(20,240),allow_redirects=True)
                      data=r.content
                      if r.status_code!=200 or not data.startswith(b'%PDF-') or len(data)<80000:
                          raise RuntimeError(f'HTTP={r.status_code} bytes={len(data)} type={r.headers.get("content-type")}')
                      dest.write_bytes(data)
                      pages=len(PdfReader(str(dest),strict=False).pages)
                      if pages<doc['min_pages']:
                          raise RuntimeError(f'pages={pages} below {doc["min_pages"]}')
                      if not text_matches(dest,doc,pages):
                          raise RuntimeError('title/company mismatch')
                      sha=hashlib.sha256(data).hexdigest()
                      print('DOWNLOADED',doc['title'],'pages=',pages,'bytes=',len(data),'source=',r.url,'sha256=',sha)
                      return dict(order=doc['order'],file=doc['file'],document=doc['title'],published=doc['date'],pages=pages,bytes=len(data),sha256=sha,source=r.url,announcement_page=doc['detail'])
                  except Exception as e:
                      last=e
                      dest.unlink(missing_ok=True)
                      print('FAILED',doc['title'],url,repr(e))
              raise RuntimeError(f'Could not download {doc["title"]}: {last!r}')

          records=[download(d) for d in docs]
          records.sort(key=lambda x:x['order'])
          lines=[
            '诺思格（301333）年度报告、招股说明书及最新季报资料包',
            '整理日期：2026-10-28','',
            '收录：2022—2025年全部年度报告全文、2022年正式发行版招股说明书、2026年第三季度报告。',
            '公司于2022年8月上市，故上市公司口径年度报告从2022年开始；更早历史财务数据已包含在招股说明书中。','',
            '文件清单：'
          ]
          sums=[]; total_pages=0; total_bytes=0
          for r in records:
              lines += [f"- {r['file']}",f"  文档：{r['document']}",f"  披露日期：{r['published']}",f"  页数：{r['pages']}页",f"  原始PDF：{r['source']}",f"  公告/索引页：{r['announcement_page']}",f"  SHA-256：{r['sha256']}"]
              sums.append(f"{r['sha256']}  {r['file']}")
              total_pages += r['pages']; total_bytes += r['bytes']
          lines += ['',f'合计：6份PDF，{total_pages}页，{total_bytes}字节。','未收录年度报告摘要、半年报或其他临时公告。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 6
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 8
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '诺思格（北京）医药科技股份有限公司|诺思格\(北京\)医药科技股份有限公司|诺思格' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/nuosi_v2_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/nuosi_v2_test.zip "$PACKAGE"
          unzip -t /tmp/nuosi_v2_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/nuosi_v2_test.zip | grep -c '\.pdf$')" -eq 6
          rm -f /tmp/nuosi_v2_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Nuosi-301333-annual-reports-prospectus-latest-quarter-v2
          path: 诺思格_301333_年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
