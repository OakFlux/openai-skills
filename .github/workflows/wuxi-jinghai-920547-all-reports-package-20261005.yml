name: Build Wuxi Jinghai 920547 all reports package 20261005

on:
  push:
    paths:
      - '.github/workflows/wuxi-jinghai-920547-all-reports-package-20261005.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '920547'
          PACKAGE = '无锡晶海_920547_所有年报_招股说明书及2026最新季报与半年报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          tasks = [
              {
                  'filename': '01_无锡晶海_向不特定合格投资者公开发行股票并在北交所上市招股说明书.pdf',
                  'title': '无锡晶海招股说明书（最终发行版）',
                  'type': '招股说明书',
                  'period': '向不特定合格投资者公开发行股票并在北京证券交易所上市',
                  'art_code': 'AN202311281612494234',
                  'announcement_date': '2023-11-28',
                  'min_pages': 250,
                  'min_bytes': 2_000_000,
              },
              {
                  'filename': '02_无锡晶海_2015年年度报告.pdf',
                  'title': '无锡晶海2015年年度报告',
                  'type': '年度报告',
                  'period': '2015年度',
                  'art_code': 'AN201604060014252166',
                  'announcement_date': '2016-04-06',
                  'min_pages': 40,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '03_无锡晶海_2016年年度报告.pdf',
                  'title': '无锡晶海2016年年度报告',
                  'type': '年度报告',
                  'period': '2016年度',
                  'art_code': 'AN201703270442534175',
                  'announcement_date': '2017-03-27',
                  'min_pages': 40,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '04_无锡晶海_2017年年度报告.pdf',
                  'title': '无锡晶海2017年年度报告',
                  'type': '年度报告',
                  'period': '2017年度',
                  'art_code': 'AN201803301115276818',
                  'announcement_date': '2018-03-30',
                  'min_pages': 40,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '05_无锡晶海_2018年年度报告.pdf',
                  'title': '无锡晶海2018年年度报告',
                  'type': '年度报告',
                  'period': '2018年度',
                  'art_code': 'AN201904241322130865',
                  'announcement_date': '2019-04-24',
                  'min_pages': 40,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '06_无锡晶海_2019年年度报告_更正后完整版本.pdf',
                  'title': '无锡晶海2019年年度报告（更正后完整版本）',
                  'type': '年度报告',
                  'period': '2019年度',
                  'art_code': 'AN202302081582904036',
                  'announcement_date': '2023-02-08',
                  'min_pages': 40,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '07_无锡晶海_2020年年度报告_更正后完整版本.pdf',
                  'title': '无锡晶海2020年年度报告（更正后完整版本）',
                  'type': '年度报告',
                  'period': '2020年度',
                  'art_code': 'AN202302081582904248',
                  'announcement_date': '2023-02-08',
                  'min_pages': 50,
                  'min_bytes': 400_000,
              },
              {
                  'filename': '08_无锡晶海_2021年年度报告_更正后完整版本.pdf',
                  'title': '无锡晶海2021年年度报告（更正后完整版本）',
                  'type': '年度报告',
                  'period': '2021年度',
                  'art_code': 'AN202302081582906034',
                  'announcement_date': '2023-02-08',
                  'min_pages': 50,
                  'min_bytes': 400_000,
              },
              {
                  'filename': '09_无锡晶海_2022年年度报告.pdf',
                  'title': '无锡晶海2022年年度报告',
                  'type': '年度报告',
                  'period': '2022年度',
                  'art_code': 'AN202304271585950685',
                  'announcement_date': '2023-04-27',
                  'min_pages': 50,
                  'min_bytes': 400_000,
              },
              {
                  'filename': '10_无锡晶海_2023年年度报告.pdf',
                  'title': '无锡晶海2023年年度报告',
                  'type': '年度报告',
                  'period': '2023年度',
                  'art_code': 'AN202404221630990089',
                  'announcement_date': '2024-04-22',
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '11_无锡晶海_2024年年度报告.pdf',
                  'title': '无锡晶海2024年年度报告',
                  'type': '年度报告',
                  'period': '2024年度',
                  'art_code': 'AN202504181658545719',
                  'announcement_date': '2025-04-18',
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '12_无锡晶海_2025年年度报告.pdf',
                  'title': '无锡晶海2025年年度报告',
                  'type': '年度报告',
                  'period': '2025年度',
                  'art_code': 'AN202604271821640774',
                  'announcement_date': '2026-04-27',
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '13_无锡晶海_2026年第一季度报告.pdf',
                  'title': '无锡晶海2026年第一季度报告',
                  'type': '季度报告',
                  'period': '2026年第一季度',
                  'art_code': 'AN202604271821640793',
                  'announcement_date': '2026-04-27',
                  'min_pages': 5,
                  'min_bytes': 80_000,
              },
              {
                  'filename': '14_无锡晶海_2026年半年度报告.pdf',
                  'title': '无锡晶海2026年半年度报告',
                  'type': '半年度报告',
                  'period': '2026年半年度',
                  'art_code': 'AN202608241828362015',
                  'announcement_date': '2026-08-24',
                  'min_pages': 40,
                  'min_bytes': 400_000,
              },
          ]

          def pdf_candidates(art_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H4_{art_code}_1.PDF',
              ]

          def download_pdf(task: dict, destination: Path) -> str:
              errors: list[str] = []
              for url in pdf_candidates(task['art_code']):
                  for attempt in range(1, 4):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 900),
                          ) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = temp.stat().st_size
                          with temp.open('rb') as fh:
                              header = fh.read(8)
                          if size < task['min_bytes'] or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, header={header!r}')
                          temp.replace(destination)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f"download failed for {destination.name}: {errors}")

          records: list[dict] = []
          hashes: set[str] = set()

          for task in tasks:
              destination = OUT / task['filename']
              source_url = download_pdf(task, destination)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < task['min_pages']:
                  raise RuntimeError(f'page count too small for {destination.name}: {pages}')

              qpdf = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  capture_output=True,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf validation failed for {destination.name}: {qpdf.stderr[-2000:]}')

              render_root = OUT / (destination.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(destination), str(render_root)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed for {destination.name}: {render.stderr[-1000:]}')
              render_size = render_file.stat().st_size
              render_file.unlink(missing_ok=True)

              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              hashes.add(digest)

              record = {
                  'filename': destination.name,
                  'title': task['title'],
                  'type': task['type'],
                  'period': task['period'],
                  'announcement_date': task['announcement_date'],
                  'art_code': task['art_code'],
                  'detail_url': f"https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{task['art_code']}.html",
                  'source_pdf_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '无锡晶海氨基酸股份有限公司（现证券代码：920547.BJ；原证券代码：836547）全部年度报告、招股说明书及2026年最新定期报告',
              '整理日期：2026-10-05',
              '',
              '收录范围：2015—2025年全部可获取完整年度报告、2023年向不特定合格投资者公开发行股票并在北京证券交易所上市的最终版招股说明书、2026年第一季度报告，以及截至整理日时间更近的2026年半年度报告。',
              '版本说明：2019—2021年年度报告采用后续披露的更正后完整版本；其他年度采用可核验的完整年度报告正文。未收录年度报告摘要、招股说明书申报稿/上会稿/注册稿等重复阶段稿。',
              '来源：北京证券交易所、全国股转系统及东方财富公告公开文件镜像。',
              '全部PDF均完成文件头、文件大小、页数、qpdf结构、首页渲染、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['title']}",
                  f"   文件：{record['filename']}",
                  f"   类型：{record['type']}；报告期：{record['period']}；公告日期：{record['announcement_date']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   公告代码：{record['art_code']}",
                  f"   PDF来源：{record['source_pdf_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 14:
                  raise RuntimeError(f'expected 14 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: wuxi-jinghai-920547-all-reports-20261005
          path: 无锡晶海_920547_所有年报_招股说明书及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
