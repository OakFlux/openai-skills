name: Inspect Eastmoney report JS for Lixing 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-report-js-inspect-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect report JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import re
          import requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/300421.html'})
          urls = [
              'https://data.eastmoney.com/newstatic/js/report/singlestock.js',
              'https://data.eastmoney.com/newstatic/js/report/stock.js',
          ]
          for url in urls:
              r = s.get(url, timeout=(20,60), allow_redirects=True)
              print('\nURL', url, 'STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content), 'CT', r.headers.get('content-type'))
              text = r.content.decode(r.apparent_encoding or 'utf-8', errors='replace')
              print('HEAD', repr(text[:1000]))
              keys = ['report/list', 'beginTime', 'endTime', 'qType', 'stockCode', 'code:', 'code=', 'reportapi', 'singlestock']
              for key in keys:
                  positions = [m.start() for m in re.finditer(re.escape(key), text, flags=re.I)]
                  print('KEY', key, 'COUNT', len(positions))
                  for pos in positions[:20]:
                      print('CTX', key, repr(text[max(0,pos-1500):pos+3000]))
          PY
