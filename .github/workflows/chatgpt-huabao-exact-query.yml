name: Query exact Huabao report titles

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-exact-query.yml'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query exact titles
        run: |
          mkdir -p exact
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          url='https://api.sdyanbao.com/api/file/search'
          phrases=['历尽千帆','香精行业龙头，业务结构多元','香精行业龙头 业务结构多元','经营拐点显现','真实业绩成色靓丽','烟用原料静待绽放']
          allrows={}
          for phrase in phrases:
            for only in (1,0):
              body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':30,'keyword':phrase,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              req=urllib.request.Request(url,data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
              try:
                with urllib.request.urlopen(req,timeout=25) as r: payload=json.loads(r.read().decode())
                rows=(payload.get('data') or {}).get('files') or []
                print('QUERY',repr(phrase),only,'ROWS',len(rows),flush=True)
              except Exception as e:
                print('FAIL',repr(phrase),only,repr(e),flush=True); continue
              for x in rows:
                title=str(x.get('name') or '')
                blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                if any(k in title for k in ['历尽千帆','香精行业龙头','经营拐点显现','真实业绩成色靓丽','烟用原料静待绽放']) or any(k in blob for k in ['华宝国际','華寶國際','00336','0336.hk']):
                  allrows[str(x.get('id'))]=x
          compact=[]
          for x in allrows.values():
            compact.append({'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),'page_url':x.get('page_url'),'share_url':x.get('share_url'),'organization':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),'type':(x.get('type') or {}).get('name'),'stock':x.get('stock'),'data_source':x.get('data_source'),'data_source_uuid':x.get('data_source_uuid')})
          compact.sort(key=lambda x:(x.get('date') or '',x.get('page_count') or 0),reverse=True)
          Path('exact/results.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULTS',json.dumps(compact,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-exact-query
          path: exact/
          retention-days: 3
