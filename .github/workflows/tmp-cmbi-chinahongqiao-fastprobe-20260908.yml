name: Fast probe CMBI report iframe URLs
on:
  push:
    branches:
      - tmp-cmbi-chinahongqiao-fastprobe-20260908
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf
      - name: Fetch article and iframe targets
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import urljoin, parse_qs, urlparse, unquote
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          ids=['6833','10002','10267','11073','12626','12805','13479']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9','Referer':'https://www.cmbi.com.hk/'})
          out={}; seen_pdfs={}
          for aid in ids:
            rec={'id':aid,'pages':[]}
            for lang in ['en','cn']:
              u=f'https://www.cmbi.com.hk/article/{aid}.html?lang={lang}'
              try:
                r=s.get(u,timeout=30,allow_redirects=True)
                text=r.text.replace('\\/','/')
                Path(f'output/{aid}_{lang}.html').write_text(text,encoding='utf-8')
                soup=BeautifulSoup(text,'lxml')
                refs=[]
                for t in soup.find_all(['iframe','embed','object','a','script']):
                  for a in ['src','href','data','data-src','data-url','file']:
                    v=t.get(a)
                    if isinstance(v,str) and v.strip(): refs.append({'tag':t.name,'attr':a,'url':urljoin(r.url,v),'text':' '.join(t.get_text(' ',strip=True).split())[:200]})
                for token in re.findall(r'https?://[^\"\'<>\s\\]+',text):
                  refs.append({'tag':'token','attr':'','url':token,'text':''})
                interesting=[]
                for x in refs:
                  if x['tag'] in ['iframe','embed','object'] or re.search(r'(\.pdf(?:$|[?&#])|pdf|viewer|download|report)',x['url'],re.I): interesting.append(x)
                item={'lang':lang,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'refs':interesting[:300]}
                rec['pages'].append(item)
                print('ARTICLE',aid,lang,r.status_code,len(r.content),json.dumps(interesting[:100],ensure_ascii=False),flush=True)
                for x in interesting:
                  target=x['url']
                  candidates=[target]
                  q=parse_qs(urlparse(target).query)
                  for key in ['file','url','src','pdf']:
                    for val in q.get(key,[]): candidates.append(unquote(val))
                  for cu in candidates:
                    if cu.startswith('//'): cu='https:'+cu
                    if not cu.startswith('http'): continue
                    try:
                      rr=s.get(cu,timeout=45,allow_redirects=True)
                      ct=rr.headers.get('content-type','')
                      print('TARGET',aid,cu,rr.status_code,ct,len(rr.content),rr.url,flush=True)
                      if rr.status_code==200 and rr.content.startswith(b'%PDF') and len(rr.content)>20000:
                        h=hashlib.sha256(rr.content).hexdigest()
                        if h not in seen_pdfs:
                          p=Path('output')/f'{aid}_{h[:10]}.pdf';p.write_bytes(rr.content)
                          reader=PdfReader(str(p));txt=''.join((pg.extract_text() or '') for pg in reader.pages[:4])
                          seen_pdfs[h]={'file':str(p),'source':rr.url,'bytes':len(rr.content),'pages':len(reader.pages),'text_chars_first4':len(txt.strip()),'first_text':' '.join(txt.split())[:3000],'sha256':h}
                          print('PDF',json.dumps(seen_pdfs[h],ensure_ascii=False),flush=True)
                    except Exception as e:
                      print('TARGET_ERROR',aid,cu,repr(e),flush=True)
              except Exception as e:
                rec['pages'].append({'lang':lang,'error':repr(e)});print('ARTICLE_ERROR',aid,lang,repr(e),flush=True)
            out[aid]=rec
          out['pdfs']=list(seen_pdfs.values())
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: cmbi-fastprobe
          path: output/*
          retention-days: 1
          if-no-files-found: error
