name: Temporary China Everbright fxbaogao HTML probe

on:
  push:
    branches:
      - tmp/china-everbright-fxbaogao-html-probe-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Probe detail and reader pages
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6'})
          ids=['5370196','5040903']
          for rid in ids:
              for u in [
                  f'https://www.fxbaogao.com/detail/{rid}',
                  f'https://www.fxbaogao.com/view?id={rid}',
                  f'https://www.fxbaogao.com/view/{rid}',
                  f'https://www.fxbaogao.com/report/{rid}',
              ]:
                  try:
                      r=s.get(u,timeout=90,allow_redirects=True)
                      print('\n=== FETCH',rid,u,'STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url,flush=True)
                      r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                      html=r.text
                      print('HTML_START',repr(html[:500]),flush=True)
                      print('HTML_END',repr(html[-1000:]),flush=True)
                      print('MARKERS',{
                          'title': '跨境资管标的' in html or '资负共振' in html,
                          'risk': '风险提示' in html,
                          'image': 'report-image' in html,
                          'pdf': '.pdf' in html.lower(),
                          'next': '__NEXT_DATA__' in html,
                          'nuxt': '__NUXT__' in html,
                          'content_len': len(html),
                      },flush=True)
                      soup=BeautifulSoup(html,'lxml')
                      text=soup.get_text('\n',strip=True)
                      print('TEXT_LEN',len(text),'TEXT_START',repr(text[:1500]),flush=True)
                      print('TEXT_END',repr(text[-3000:]),flush=True)

                      # Large text-bearing nodes.
                      large=[]
                      for tag in soup.find_all(['div','article','section','pre','script']):
                          val=tag.string if tag.name=='script' else tag.get_text('\n',strip=True)
                          if val and len(val)>10000:
                              large.append((tag.name,tag.get('id'),tag.get('class'),len(val),repr(val[:180]),repr(val[-300:])))
                      large=sorted(large,key=lambda x:x[3],reverse=True)[:15]
                      print('LARGE_NODES',json.dumps(large,ensure_ascii=False),flush=True)

                      # Extract candidate URLs and API paths.
                      urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',html)))
                      interesting=[x for x in urls if any(k in x.lower() for k in ['pdf','report','download','oss','image','api'])]
                      print('INTERESTING_URLS',json.dumps(interesting[:200],ensure_ascii=False),flush=True)
                      paths=sorted(set(re.findall(r'[\"\']((?:/api/|/report-|/download|/view|/detail)[^\"\']*)[\"\']',html)))
                      print('INTERESTING_PATHS',json.dumps(paths[:200],ensure_ascii=False),flush=True)

                      # Script summaries and likely embedded JSON.
                      for idx,script in enumerate(soup.find_all('script')):
                          val=script.string or script.get_text('',strip=False)
                          if not val:
                              continue
                          if any(k in val.lower() for k in ['5370196','5040903','report-image','download','pdfurl','fileurl','content']):
                              print('SCRIPT',idx,'TYPE',script.get('type'),'ID',script.get('id'),'LEN',len(val),'START',repr(val[:1500]),'END',repr(val[-1500:]),flush=True)

                      for patt in [
                          r'"(?:content|reportContent|ocrContent|text|description)"\s*:\s*"',
                          r'"(?:pdfUrl|fileUrl|downloadUrl|url)"\s*:\s*"([^"]+)',
                          r'report-image[^\"\']+',
                      ]:
                          matches=re.findall(patt,html,re.I)
                          print('PATTERN',patt,'COUNT',len(matches),'SAMPLE',json.dumps(matches[:20],ensure_ascii=False),flush=True)
                  except Exception as e:
                      print('ERROR',rid,u,repr(e),flush=True)
          PY
