name: Temporary COFCO Joycome report cover previews

on:
  push:
    branches:
      - tmp-cofco-joycome-covers-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public preview covers
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          out=Path('covers'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          pages={'2024':'https://www.sgpjbg.com/baogao/170763.html','2023':'https://www.sgpjbg.com/baogao/112694.html','2022':'https://www.sgpjbg.com/baogao/76453.html'}
          for year,url in pages.items():
            r=s.get(url,timeout=45); print(year,r.status_code,len(r.content),r.url)
            (out/f'{year}.html').write_bytes(r.content)
            soup=BeautifulSoup(r.text,'html.parser')
            meta=soup.find('meta',attrs={'property':'og:image'})
            if not meta: continue
            image=meta.get('content'); print('IMAGE',year,image)
            rr=s.get(image,timeout=45); print('IMAGE_FETCH',rr.status_code,len(rr.content),rr.headers.get('content-type'))
            ext='.gif' if 'gif' in (rr.headers.get('content-type') or '').lower() or image.lower().endswith('.gif') else '.img'
            (out/f'{year}_cover{ext}').write_bytes(rr.content)
          PY

      - name: Upload covers
        uses: actions/upload-artifact@v4
        with:
          name: cofco-joycome-report-covers
          path: covers
          retention-days: 1
