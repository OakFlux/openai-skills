name: Build Yongtai public company research package

on:
  pull_request:
    paths:
      - 'tasks/yongtai-002326-public-company-reports-20261015.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          reports = [
              {
                  'date': '2025-09-11',
                  'broker': '山西证券',
                  'title': '锂电“打针复原”黑科技落地，与复旦核心团队成立合资公司',
                  'classification': '首次覆盖公司研究',
                  'info_code': 'AP202509111741748142',
                  'expected_pages': 5,
              },
              {
                  'date': '2017-10-26',
                  'broker': '东兴证券',
                  'title': '三季度财报点评：六氟磷酸锂试生产，内生+外延持续发展',
                  'classification': '公司研究报告',
                  'info_code': 'AP201710260979351296',
                  'expected_pages': 5,
              },
              {
                  'date': '2017-04-11',
                  'broker': '东兴证券',
                  'title': '财报点评：内生增长稳健，外延发展持续',
                  'classification': '公司研究报告',
                  'info_code': 'AP201704110494896624',
                  'expected_pages': 6,
              },
          ]

          out = Path('package')
          renders = Path('renders')
          artifacts = Path('artifact_out')
          for directory in (out, renders, artifacts):
              directory.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept': 'application/pdf,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text):
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:115]

          manifest = []
          hashes = set()
          for index, report in enumerate(reports, 1):
              filename = f'{index:02d}_{report["date"]}_{report["broker"]}_{safe(report["title"])}.pdf'
              path = out / filename
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{report["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{report["info_code"]}_01.pdf',
              ]
              used_url = None
              errors = []
              for url in urls:
                  for attempt in range(1, 5):
                      try:
                          response = session.get(url, timeout=(20, 180), allow_redirects=True)
                          print('DOWNLOAD', index, attempt, response.status_code, len(response.content), url, flush=True)
                          if response.status_code == 200 and len(response.content) > 100000 and response.content.startswith(b'%PDF-'):
                              path.write_bytes(response.content)
                              used_url = url
                              break
                          errors.append(f'{url}: HTTP {response.status_code}, {len(response.content)} bytes')
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(attempt)
                  if used_url:
                      break
              if not used_url:
                  raise RuntimeError('Download failed: ' + ' | '.join(errors[-12:]))

              qpdf = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(qpdf.stderr[-1000:])
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 2 or abs(pages - report['expected_pages']) > 1:
                  raise RuntimeError(f'Unexpected page count for {filename}: {pages}')
              text_parts = []
              for page_index in range(min(8, pages)):
                  try:
                      text_parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              sample = '\n'.join(text_parts)
              if not any(term in sample for term in ('永太科技', '浙江永太科技股份有限公司', '002326')):
                  raise RuntimeError(f'Company identity check failed for {filename}')
              if not any(term in sample for term in ('证券研究报告', '公司研究', '研究报告', '投资评级', '首次覆盖', '财报点评')):
                  raise RuntimeError(f'Research-report check failed for {filename}')

              render_prefix = renders / f'cover_{index:02d}'
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(path), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              png = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not png.exists() or png.stat().st_size < 6000:
                  raise RuntimeError(f'Cover render failed for {filename}: {render.stderr[-800:]}')

              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in hashes:
                  raise RuntimeError(f'Duplicate PDF: {filename}')
              hashes.add(sha256)
              item = {
                  'filename': filename,
                  'date': report['date'],
                  'broker': report['broker'],
                  'title': report['title'],
                  'classification': report['classification'],
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'source_url': used_url,
                  'info_code': report['info_code'],
              }
              manifest.append(item)
              print('VERIFIED', json.dumps(item, ensure_ascii=False), flush=True)

          readme = [
              '浙江永太科技股份有限公司（永太科技，002326.SZ）券商公司研究报告合集',
              '整理日期：2026-10-15',
              '',
              '本包收录3份公开可直接下载并完成核验的完整券商公司研究PDF。',
              '其中山西证券报告为首次覆盖；两份东兴证券报告用于补充六氟磷酸锂、内生增长和外延布局等历史研究。',
              '公开渠道可检索到国联证券2022年27页公司深度报告《构建产业链一体化，打造业绩新曲线》，但完整PDF需要登录或会员下载，本包未用前10页预览、网页摘要或拼接文件替代完整原文。',
              '',
              '文件清单：',
          ]
          for number, item in enumerate(manifest, 1):
              readme += [
                  f'{number}. {item["filename"]}',
                  f'   券商：{item["broker"]}',
                  f'   类型：{item["classification"]}',
                  f'   标题：{item["title"]}',
                  f'   日期：{item["date"]}；页数：{item["pages"]}；大小：{item["bytes"]} bytes',
                  f'   公开PDF：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme.append('完整性检查：已检查PDF文件头、公司名称或证券代码、券商研究属性、实际页数、qpdf结构、首页渲染、重复文件及ZIP CRC。')

          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest), encoding='utf-8'
          )

          zip_path = artifacts / '永太科技_002326_券商公司研究报告_3份_公开完整版.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdf_count = sum(name.lower().endswith('.pdf') for name in archive.namelist())
              if bad or pdf_count != 3:
                  raise RuntimeError(f'ZIP validation failed: {bad}, {pdf_count}')

          print('FINAL_MANIFEST', json.dumps(manifest, ensure_ascii=False), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-public-company-report-package
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
