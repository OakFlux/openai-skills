name: Inspect public Ningbo Port broker report sources 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-inspect-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Search public API and inspect detail assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out = Path('inspect_out')
          out.mkdir(parents=True, exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/json,text/plain,text/html,*/*',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/',
          })

          queries = [
              '宁波港',
              '市场份额提升 码头结构优化',
              '非凡大港斩获殊勋茂绩',
              '依托浙江海洋经济区 成长性卓越',
              '港口翘楚 增长稳定',
              '腹地资源 水深优势 国际综合大港',
          ]
          endpoint = 'https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          all_rows = {}
          for qi, q in enumerate(queries, 1):
              body = {'keywords': q, 'pageIndex': 1, 'pageSize': 20, 'order': 1, 'nop': -1}
              try:
                  r = s.post(endpoint, json=body, timeout=(20, 120))
                  print('SEARCH', qi, q, r.status_code, len(r.content), r.headers.get('content-type'), flush=True)
                  (out / f'search_{qi:02d}.json').write_bytes(r.content)
                  print('SEARCH_BODY', q, r.text[:12000], flush=True)
                  if r.status_code == 200:
                      j = r.json()
                      data = (j.get('data') or {})
                      rows = data.get('dataList') or []
                      for row in rows:
                          did = str(row.get('docId') or row.get('id') or row.get('reportId') or '')
                          if did:
                              all_rows[did] = row
              except Exception as e:
                  print('SEARCH_ERR', q, repr(e), flush=True)

          (out / 'all_rows.json').write_text(json.dumps(all_rows, ensure_ascii=False, indent=2), encoding='utf-8')
          print('ALL_ROWS_COUNT', len(all_rows), flush=True)
          for did, row in all_rows.items():
              print('ROW_FULL', did, json.dumps(row, ensure_ascii=False), flush=True)

          # Ensure known report ID is inspected even if search ranking misses it.
          all_ids = set(all_rows)
          all_ids.update(['1422001'])
          # Keep exact Ningbo-related hits only plus known id.
          ids = []
          for did in all_ids:
              row = all_rows.get(did, {})
              blob = json.dumps(row, ensure_ascii=False)
              if did == '1422001' or '宁波港' in blob or '宁波舟山港' in blob:
                  ids.append(did)
          ids = sorted(ids)[:80]
          print('IDS', ids, flush=True)

          script_urls = set()
          page_records = []
          interesting_urls = set()
          page_templates = [
              'https://www.fxbaogao.com/detail/{id}',
              'https://www.fxbaogao.com/view?id={id}',
              'https://www.fxbaogao.com/detail/{id}/',
          ]
          for did in ids:
              for ti, tpl in enumerate(page_templates):
                  url = tpl.format(id=did)
                  try:
                      r = s.get(url, timeout=(20, 120), allow_redirects=True)
                      print('PAGE', did, ti, r.status_code, len(r.content), r.headers.get('content-type'), r.url, flush=True)
                      (out / f'page_{did}_{ti}.html').write_bytes(r.content)
                      if r.status_code != 200 or len(r.content) < 500:
                          continue
                      text = r.text
                      soup = BeautifulSoup(text, 'lxml')
                      title = soup.title.get_text(' ', strip=True) if soup.title else ''
                      scripts = []
                      for tag in soup.find_all('script', src=True):
                          su = urllib.parse.urljoin(r.url, tag['src'])
                          scripts.append(su)
                          script_urls.add(su)
                      for m in re.finditer(r'https?://[^\s"\'<>]+', text):
                          u = m.group(0).replace('\\/','/').rstrip(');,]}')
                          if any(k in u.lower() for k in ('pdf','download','file','oss','report','attach','doc')):
                              interesting_urls.add(u)
                      snippets = []
                      for pat in ('pdf','download','下载','docId','reportId','fileUrl','filePath','oss','原文','点击查看原文'):
                          for m in list(re.finditer(pat, text, re.I))[:25]:
                              snippets.append(text[max(0,m.start()-250):min(len(text),m.end()+450)])
                      rec = {'docId':did,'url':r.url,'title':title,'scripts':scripts,'snippets':snippets,'visible_text':' '.join(soup.get_text(' ',strip=True).split())[:10000]}
                      page_records.append(rec)
                      print('PAGE_REC', did, json.dumps(rec,ensure_ascii=False)[:16000], flush=True)
                  except Exception as e:
                      print('PAGE_ERR', did, url, repr(e), flush=True)

          script_records = []
          for idx, su in enumerate(sorted(script_urls), 1):
              try:
                  r = s.get(su, timeout=(20, 120), allow_redirects=True)
                  print('SCRIPT', idx, r.status_code, len(r.content), su, flush=True)
                  if r.status_code != 200 or len(r.content) < 200:
                      continue
                  text = r.text
                  (out / f'script_{idx:03d}.js').write_text(text, encoding='utf-8', errors='replace')
                  hits = []
                  for pat in [r'https?://[^\s"\'<>]+', r'/(?:mofoun|api|report|file|download)[A-Za-z0-9_?&=./${}:%-]{2,260}']:
                      for m in re.finditer(pat, text, re.I):
                          x = m.group(0).replace('\\/','/').rstrip(');,]}')
                          if any(k in x.lower() for k in ('report','pdf','download','file','oss','attach','docid','reportid')):
                              hits.append(x[:600])
                              if x.startswith('http'):
                                  interesting_urls.add(x)
                  # Also grab string literals around useful tokens.
                  for pat in ('download','pdf','fileUrl','filePath','reportId','docId','原文'):
                      for m in list(re.finditer(pat, text, re.I))[:60]:
                          hits.append(text[max(0,m.start()-180):min(len(text),m.end()+300)])
                  hits = list(dict.fromkeys(hits))[:600]
                  script_records.append({'url':su,'bytes':len(r.content),'hits':hits})
                  print('SCRIPT_HITS', su, json.dumps(hits[:120], ensure_ascii=False), flush=True)
              except Exception as e:
                  print('SCRIPT_ERR', su, repr(e), flush=True)

          (out / 'page_records.json').write_text(json.dumps(page_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out / 'script_records.json').write_text(json.dumps(script_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out / 'interesting_urls.txt').write_text('\n'.join(sorted(interesting_urls)),encoding='utf-8')

          # Probe any direct PDF-looking URL surfaced in public data or HTML/JS.
          candidates = set(interesting_urls)
          def walk(v):
              if isinstance(v, dict):
                  for vv in v.values(): walk(vv)
              elif isinstance(v, list):
                  for vv in v: walk(vv)
              elif isinstance(v, str):
                  if v.startswith('http') and any(k in v.lower() for k in ('pdf','download','file','oss','attach')):
                      candidates.add(v)
          walk(all_rows)
          probes = []
          for i, u in enumerate(sorted(candidates), 1):
              if len(u) > 1200 or any(x in u for x in ('${','{id}','webpack','sina.com')):
                  continue
              try:
                  r = s.get(u, timeout=(15, 90), allow_redirects=True, stream=False)
                  rec = {'url':u,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'prefix':r.content[:20].hex()}
                  probes.append(rec)
                  print('PROBE', json.dumps(rec,ensure_ascii=False), flush=True)
                  if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 50000:
                      (out / f'found_{i:03d}.pdf').write_bytes(r.content)
              except Exception as e:
                  print('PROBE_ERR', u, repr(e), flush=True)
          (out / 'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-fxbaogao-inspection
          path: inspect_out
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
