name: Baolidi Sina Report Probe

on:
  push:
    branches:
      - chatgpt-baolidi-broker-reports-20261004
    paths:
      - .github/workflows/baolidi_sina_report_probe_20261004.yml
      - scripts/probe_baolidi_sina_reports.py

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Query Sina research report pages
        run: |
          mkdir -p output
          python scripts/probe_baolidi_sina_reports.py

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: baolidi-sina-report-probe
          path: output/baolidi_sina_report_links.json
          retention-days: 1
