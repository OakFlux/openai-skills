name: Scan Eastmoney report index for Huabao company reports

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-eastmoney-date-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Scan date windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, requests, time
          from pathlib import Path

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list2'
          windows=[
            ('2026-03-15','2026-03-22'),
            ('2026-04-07','2026-04-23'),
            ('2026-08-10','2026-08-17'),
            ('2026-08-29','2026-09-03'),
          ]
          terms=['华宝国际','華寶國際','00336','0336.HK','香精行业龙头','业务结构多元','历尽千帆','涅槃重生','轻装上阵','全面出海','经营拐点显现','多元业务矩阵','烟用原料静待绽放','真实业绩成色靓丽']
          allmatches=[]; stats=[]
          for begin,end in windows:
            for qtype in [0,1,2]:
              page=1
              while page<=60:
                body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':'','code':'','qType':qtype}
                try:
                  r=s.post(api,json=body,timeout=(10,60)); r.raise_for_status(); j=r.json()
                  rows=j.get('data') or []; hits=int(j.get('hits') or 0); total=int(j.get('TotalPage') or ((hits+99)//100))
                  if page==1:
                    print('WINDOW',begin,end,'QTYPE',qtype,'HITS',hits,'PAGES',total,flush=True)
                    stats.append({'begin':begin,'end':end,'qtype':qtype,'hits':hits,'pages':total})
                  for x in rows:
                    blob=json.dumps(x,ensure_ascii=False)
                    if any(t.lower() in blob.lower() for t in terms):
                      rec={'window':[begin,end],'qtype':qtype,**x}
                      allmatches.append(rec)
                      print('MATCH',json.dumps(rec,ensure_ascii=False),flush=True)
                  if not rows or page>=total: break
                  page+=1; time.sleep(.12)
                except Exception as e:
                  print('FAIL',begin,end,qtype,page,repr(e),flush=True); break
          # De-duplicate by infoCode/title/date/org.
          dedup={}
          for x in allmatches:
            key=str(x.get('infoCode') or (x.get('title'),x.get('publishDate'),x.get('orgSName')))
            dedup[key]=x
          matches=list(dedup.values())
          Path('out/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/stats.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL_MATCHES',len(matches),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-eastmoney-date-scan
          path: out/
          retention-days: 3
          if-no-files-found: error
