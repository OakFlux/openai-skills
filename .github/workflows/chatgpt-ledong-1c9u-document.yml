name: Inspect exact 1c9u Ledong broker report document

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Inspect document page and public API routes
        shell: bash
        run: |
          cat > /tmp/inspect_doc.py <<'PY'
          from __future__ import annotations
          import io, json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path('doc_output'); OUT.mkdir(exist_ok=True)
          slug='z-5Lq65b2i5py65Zmo5Lq655-l6K-G5bqTADUw6aG1LTIwMjYwODA2LeS6pOmTtuWbvemZhS3kuZDliqjmnLrlmajkurotMTIzNi5ISy3kurrlvaLmnLrlmajkurrooYzkuJrns7vliJfvvIg077yJ77ya5LuO5oSf55-l57uE5Lu25Yiw5pm66IO95bqt6Zmi77yM54mp55CGQUnlj4zmm7Lnur_pqbHliqjmiJDplb_vvJvpppbkuojkubDlhaUucGRm'
          url='https://www.1c9u.com/zhishiku/document/'+slug
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          })
          r=s.get(url,timeout=90,allow_redirects=True)
          print('PAGE',r.status_code,r.url,r.headers.get('content-type'),len(r.content),'cookies',s.cookies.get_dict())
          print(r.text[:5000])
          (OUT/'document.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
          txt=' '.join(soup.get_text(' ',strip=True).split())
          print('TEXT',txt[:12000])
          links=[]
          for a in soup.find_all('a',href=True):
              href=urllib.parse.urljoin(r.url,a['href'])
              label=' '.join(a.get_text(' ',strip=True).split())
              links.append({'href':href,'label':label})
              print('LINK',repr(label[:500]),href)
          (OUT/'links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
          scripts=[]
          for tag in soup.find_all('script'):
              if tag.get('src'):
                  scripts.append(urllib.parse.urljoin(r.url,tag['src']))
              else:
                  body=tag.get_text() or ''
                  if body.strip():
                      (OUT/f'inline_{len(list(OUT.glob("inline_*.js"))):02d}.js').write_text(body,encoding='utf-8')
          print('SCRIPTS',len(scripts)); [print('SCRIPT',u) for u in scripts]
          patterns=[
              r'https?://[^\"\'<>\\\s]+',
              r'[^\"\'<>\\\s]{0,260}(?:download|pdf|file|document|preview|points|积分|/api/|storage|oss|cos)[^\"\'<>\\\s]{0,800}',
          ]
          all_hits=[]
          for i,u in enumerate(scripts):
              try:
                  rr=s.get(u,timeout=90); rr.raise_for_status()
                  name=f'js_{i:03d}_{urllib.parse.urlparse(u).path.rsplit("/",1)[-1] or "script"}'
                  (OUT/name).write_bytes(rr.content)
                  hits=[]
                  for p in patterns: hits.extend(re.findall(p,rr.text,re.I))
                  hits=list(dict.fromkeys(hits))
                  (OUT/(name+'.hits.txt')).write_text('\n'.join(hits),encoding='utf-8')
                  for h in hits:
                      if any(k in h.lower() for k in ('download','pdf','/api/','document','preview','points','file','storage','oss','cos')):
                          print('JSHIT',i,repr(h[:3500]))
                  all_hits.extend(hits)
              except Exception as e: print('JSERR',u,repr(e))
          for p in OUT.glob('inline_*.js'):
              body=p.read_text('utf-8',errors='ignore')
              hits=[]
              for pat in patterns: hits.extend(re.findall(pat,body,re.I))
              hits=list(dict.fromkeys(hits))
              for h in hits:
                  if any(k in h.lower() for k in ('download','pdf','/api/','document','preview','points','file','storage','oss','cos')):
                      print('INLINE_HIT',p.name,repr(h[:3500]))
              all_hits.extend(hits)
          (OUT/'all_hits.txt').write_text('\n'.join(dict.fromkeys(all_hits)),encoding='utf-8')

          # Only probe public, unauthenticated endpoints exposed by page scripts.
          api_candidates=[
              f'/api/documents/{urllib.parse.quote(slug,safe="")}',
              f'/api/document/{urllib.parse.quote(slug,safe="")}',
              f'/api/zhishiku/document/{urllib.parse.quote(slug,safe="")}',
              f'/api/doc/{urllib.parse.quote(slug,safe="")}',
              f'/api/documents/{urllib.parse.quote(slug,safe="")}/download',
              f'/api/document/{urllib.parse.quote(slug,safe="")}/download',
              f'/api/download?doc_id={urllib.parse.quote(slug,safe="")}',
              f'/api/download?docId={urllib.parse.quote(slug,safe="")}',
          ]
          for path in api_candidates:
              u=urllib.parse.urljoin(r.url,path)
              try:
                  rr=s.get(u,headers={'Accept':'application/json,application/pdf,*/*','Referer':r.url},timeout=60,allow_redirects=True)
                  is_pdf=b'%PDF' in rr.content[:4096] and len(rr.content)>20000
                  print('API',path,'=>',rr.status_code,rr.url,rr.headers.get('content-type'),len(rr.content),'pdf',is_pdf,repr(rr.content[:80]))
                  safe=re.sub(r'[^A-Za-z0-9_.-]+','_',path)[:120]
                  (OUT/f'api_{safe}.bin').write_bytes(rr.content)
                  if is_pdf:
                      reader=PdfReader(io.BytesIO(rr.content),strict=False)
                      print('API_PDF',path,'pages',len(reader.pages))
                      (OUT/'ledong_bocom.pdf').write_bytes(rr.content)
              except Exception as e: print('APIERR',path,repr(e))
          PY
          python /tmp/inspect_doc.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_1c9u_Document_Inspection
          path: doc_output
          retention-days: 2
          if-no-files-found: error
