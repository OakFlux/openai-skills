name: Temporary Resolve Orient Gene Report Codes via Calendar

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-stock-calendar.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query stock calendar report events
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,requests
          from pathlib import Path
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/stockcalendar/688298.html','Accept':'application/json,text/plain,*/*'})
          params={'reportName':'RPT_STOCKCALENDAR','columns':'ALL','filter':'(SECURITY_CODE="688298")','pageNumber':'1','pageSize':'5000','sortTypes':'-1','sortColumns':'NOTICE_DATE','source':'WEB','client':'WEB'}
          r=s.get('https://datacenter-web.eastmoney.com/api/data/v1/get',params=params,timeout=60);r.raise_for_status();payload=r.json()
          rows=((payload.get('result') or {}).get('data') or [])
          reports=[x for x in rows if x.get('EVENT_TYPE_CODE')=='020' or x.get('EVENT_TYPE')=='研报']
          keys=['东方POCT龙头呼之欲出','新生代国际化IVD龙头','深耕POCT国际市场','深耕国际市场的POCT全产业链企业','深耕POCT领域']
          targets=[]
          for x in reports:
            blob=json.dumps(x,ensure_ascii=False)
            if any(k in blob for k in keys) or str(x.get('NOTICE_DATE','')).startswith(('2020-01-13','2020-09-22','2020-11-09','2021-08-05','2022-03-14')):
              targets.append(x)
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_calendar_reports.json').write_text(json.dumps({'targets':targets,'reports':reports},ensure_ascii=False,indent=2),encoding='utf-8')
          print('TARGETS='+json.dumps(targets,ensure_ascii=False),flush=True)
          print('REPORT_COUNT='+str(len(reports)),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-calendar-reports
          path: out/orient_gene_calendar_reports.json
          if-no-files-found: error
          retention-days: 3
