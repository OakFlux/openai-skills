name: Build Shaanxi Jinye broker research package

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='陕西金叶_000812_券商研究报告_2份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/shaanxi_jinye_broker_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out=Path('陕西金叶_000812_券商研究报告_2份')
          s=requests.Session(); s.trust_env=False
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=7,connect=7,read=7,status=7,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'})

          reports=[
            dict(order=1,broker='中银国际',report_date='2011-05-03',publish_date='2011-05-04',title='春风吹渭水，金叶满长安',rtype='公司深度研究报告',filename='01_中银国际_春风吹渭水金叶满长安_2011-05-03.pdf',page='https://www.p5w.net/stock/lzft/gsyj/201105/t3592653.htm',min_pages=10,known_pdf='https://www.p5w.net/stock/lzft/gsyj/201105/P020110504525137822745.pdf'),
            dict(order=2,broker='安信证券',report_date='2009-08-11',publish_date='2009-08-11',title='中报业绩实现大幅增长',rtype='公司研究报告',filename='02_安信证券_中报业绩实现大幅增长_2009-08-11.pdf',page='https://www.p5w.net/stock/lzft/gsyj/200908/t2502835.htm',min_pages=2,known_pdf=''),
          ]

          def discover_pdf(r):
            candidates=[]
            if r['known_pdf']: candidates.append(r['known_pdf'])
            x=s.get(r['page'],timeout=(20,120),allow_redirects=True)
            x.raise_for_status(); x.encoding=x.apparent_encoding or x.encoding or 'gb18030'
            soup=BeautifulSoup(html.unescape(x.text),'html.parser')
            for a in soup.find_all('a',href=True):
              href=urljoin(x.url,a.get('href'))
              label=re.sub(r'\s+','',a.get_text(' ',strip=True))
              if '.pdf' in href.lower() and ('陕西金叶' in label or r['title'].replace('，','')[:6] in label.replace('，','') or '附件' in label or not label):
                candidates.append(href)
            for m in re.findall(r'[^\s\"\'<>]+\.pdf(?:\?[^\s\"\'<>]*)?',html.unescape(x.text),flags=re.I): candidates.append(urljoin(x.url,m))
            return list(dict.fromkeys(candidates))

          def fetch_pdf(r):
            last=None
            for url in discover_pdf(r):
              for attempt in range(5):
                try:
                  x=s.get(url,headers={'Referer':r['page']},timeout=(30,300),allow_redirects=True)
                  data=x.content
                  if x.status_code==200 and data.startswith(b'%PDF-') and len(data)>100000:
                    return x.url,data
                  last=RuntimeError(f'HTTP={x.status_code}, bytes={len(data)}, type={x.headers.get("content-type")}')
                except Exception as e: last=e
                time.sleep(1+attempt)
            raise RuntimeError(f'failed {r["title"]}: {last!r}')

          records=[]
          for r in reports:
            source,data=fetch_pdf(r)
            path=out/r['filename']; path.write_bytes(data)
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
            if pages<r['min_pages']: raise RuntimeError(f'{path.name}: pages={pages}')
            text=''
            for i in range(pages):
              try: text+='\n'+(reader.pages[i].extract_text() or '')
              except Exception: pass
            compact=re.sub(r'\s+','',text)
            if not any(k in compact for k in ('陕西金叶','000812')): raise RuntimeError(f'{path.name}: company mismatch')
            broker_key=r['broker'].replace('证券','').replace('国际','')
            if broker_key not in compact and r['broker'] not in compact: print('BROKER_TEXT_WARNING',path.name)
            sha=hashlib.sha256(data).hexdigest()
            records.append({**r,'source':source,'pages':pages,'bytes':len(data),'sha256':sha})
            print('DOWNLOADED',r['broker'],r['title'],'pages=',pages,'bytes=',len(data),'source=',source,'sha256=',sha)

          lines=['陕西金叶（000812）券商研究报告资料包','整理日期：2026-10-29','','版本说明：','1. 两份文件均为公开渠道直接下载的券商原始完整PDF，未使用网页摘要、截图或重新排版版本。','2. 陕西金叶近年公开券商覆盖较少，本包收录目前可稳定公开下载且经核验的历史研究报告。','3. 资料仅供研究参考，不构成投资建议。','','文件清单：']
          sums=[]; total_pages=0; total_bytes=0
          for x in records:
            total_pages+=x['pages']; total_bytes+=x['bytes']
            lines += [f"{x['order']}. {x['broker']}｜{x['title']}",f"   类型：{x['rtype']}",f"   报告日期：{x['report_date']}；公开页面日期：{x['publish_date']}",f"   页数：{x['pages']}页",f"   文件：{x['filename']}",f"   原始PDF：{x['source']}",f"   公开信息页：{x['page']}",f"   SHA-256：{x['sha256']}",'']
            sums.append(f"{x['sha256']}  {x['filename']}")
          lines += [f'合计：2份PDF，{total_pages}页，{total_bytes}字节。','全部文件已完成PDF结构、实际页数、公司名称及首末页渲染检查。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e; qpdf --check "$pdf" >"$pdf.qpdf" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 2
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '陕西金叶|000812' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/shaanxi_jinye_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/shaanxi_jinye_broker_test.zip "$PACKAGE"
          unzip -t /tmp/shaanxi_jinye_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/shaanxi_jinye_broker_test.zip | grep -c '\.pdf$')" -eq 2
          rm -f /tmp/shaanxi_jinye_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Shaanxi-Jinye-000812-broker-research-reports-2
          path: 陕西金叶_000812_券商研究报告_2份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
