name: Package Gaoce 688556 broker deep reports

on:
  push:
    branches:
      - tmp/gaoce-688556-broker-reports-20261103-v1
    paths:
      - .github/workflows/gaoce-688556-broker-reports-20261103-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = "688556"
          COMPANY = "高测股份"
          FULL = "青岛高测科技股份有限公司"
          PREPARED = "2026-11-03"
          ROOT_NAME = "高测股份_688556_券商深度研究报告_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF原件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "date": "2024-05-27",
                  "broker": "国联证券",
                  "analyst": "张旭、刘晓旭、裴婉晓",
                  "rating": "买入（首次）",
                  "report_type": "公司深度研究",
                  "title": "切割设备+耗材夯实龙头，切片代工增厚现金流",
                  "urls": [
                      "https://duplik-1252068037.cos.ap-beijing.myqcloud.com/duplik/447460783945158/520072899438150/793b587975be4f21bf10b47970b5820f447460783945158.pdf"
                  ],
                  "detail_url": "https://www.fxbaogao.com/detail/4323001",
                  "expected_min_pages": 20,
                  "title_tokens": ["切割设备", "切片代工", "增厚现金流"],
              },
              {
                  "date": "2022-07-18",
                  "broker": "浙商证券",
                  "analyst": "邱世梁、王华君、李思扬",
                  "rating": "增持（首次覆盖）",
                  "report_type": "公司深度报告",
                  "title": "光伏切割一体化解决龙头，切片代工+金刚线打开第二成长曲线",
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP202207191576330898_1.pdf",
                      "https://pdf.dfcfw.com/pdf/H2_AP202207191576330898_1.pdf"
                  ],
                  "detail_url": "https://data.eastmoney.com/report/info/AP202207191576330898.html",
                  "expected_min_pages": 25,
                  "title_tokens": ["光伏切割一体化", "第二成长曲线"],
              },
              {
                  "date": "2021-09-23",
                  "broker": "开源证券",
                  "analyst": "王珂",
                  "rating": "买入（首次）",
                  "report_type": "公司首次覆盖报告",
                  "title": "光伏切片方案专家，开拓硅片代工市场",
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP202109231518089377_1.pdf",
                      "https://pdf.dfcfw.com/pdf/H2_AP202109231518089377_1.pdf"
                  ],
                  "detail_url": "https://data.eastmoney.com/report/info/AP202109231518089377.html",
                  "expected_min_pages": 25,
                  "title_tokens": ["光伏切片方案专家", "硅片代工市场"],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text)
              return re.sub(r"\s+", " ", text).strip(" ._")[:180]

          def download(urls: list[str], referer: str):
              attempts = []
              for url in urls:
                  for attempt in range(5):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 420),
                              allow_redirects=True,
                              headers={
                                  "User-Agent": session.headers["User-Agent"],
                                  "Referer": referer,
                                  "Accept": "application/pdf,*/*;q=0.8",
                              },
                          )
                          record = {
                              "url": url,
                              "status": response.status_code,
                              "bytes": len(response.content),
                              "content_type": response.headers.get("content-type", ""),
                              "magic": response.content[:8].hex(),
                              "final_url": response.url,
                          }
                          attempts.append(record)
                          print("PDF_REQUEST", json.dumps(record, ensure_ascii=False))
                          if response.status_code == 200 and response.content.startswith(b"%PDF-") and len(response.content) > 100_000:
                              return response.content, response.url, attempts
                      except Exception as exc:
                          attempts.append({"url": url, "error": repr(exc)})
                      time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed: {attempts}")

          manifest = []
          for index, spec in enumerate(reports, 1):
              data, used_url, attempts = download(spec["urls"], spec["detail_url"])
              filename = safe_name(
                  f"{index:02d}_{spec['date'].replace('-', '')}_{spec['broker']}_{spec['title']}.pdf"
              )
              path = PDF_DIR / filename
              path.write_bytes(data)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < spec["expected_min_pages"]:
                  raise RuntimeError(f"Report too short: {filename}, pages={pages}")

              text_parts = []
              for page in reader.pages[:min(20, pages)]:
                  try:
                      text_parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              sample_text = "\n".join(text_parts)
              if not any(token in sample_text for token in [COMPANY, FULL, CODE]):
                  raise RuntimeError(f"Issuer validation failed: {filename}")
              if spec["title_tokens"] and not any(token in sample_text for token in spec["title_tokens"]):
                  raise RuntimeError(f"Title validation failed: {filename}")

              q = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if q.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {filename}: {q.stdout}")

              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")

              manifest.append({
                  **spec,
                  "filename": filename,
                  "actual_pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "pdf_url": used_url,
                  "preview_file": str(Path("首页预览") / preview.name),
                  "download_attempts": attempts,
              })

          readme = [
              f"高测股份（{CODE}.SH）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录3份可公开直接下载并完成结构核验的券商原始PDF：2份公司深度研究、1份首次覆盖报告。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   券商：{item['broker']}；报告类型：{item['report_type']}；研究员：{item['analyst']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   评级：{item['rating']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['detail_url']}",
                  f"   原始PDF：{item['pdf_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、报告标题、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "未使用网页摘要或自行重排文件替代券商原始PDF。",
          ]
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "all_files_are_original_broker_pdfs": True,
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as f:
              writer = csv.writer(f)
              writer.writerow(["文件名", "报告类型", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256", "来源页面", "PDF地址"])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["report_type"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"],
                      item["actual_pages"], item["bytes"], item["sha256"], item["detail_url"], item["pdf_url"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF原件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("gaoce_688556_broker_deep_reports_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "files": [{k: item[k] for k in ["filename", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256", "detail_url", "pdf_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: gaoce-688556-broker-deep-reports-3-20261103
          path: |
            gaoce_688556_broker_deep_reports_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
