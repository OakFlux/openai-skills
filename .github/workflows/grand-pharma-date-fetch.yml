name: grand-pharma-date-fetch
on:
  push:
    branches: [chatgpt-temp-grand-pharma-eastmoney-date-20260905]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and download public broker PDFs
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python <<'PY'
          import requests, json, re, os, time, hashlib, zipfile
          from datetime import date, timedelta
          from pathlib import Path
          from pypdf import PdfReader

          root = Path('grand_pharma_final')
          pdfdir = root / 'PDF'
          pdfdir.mkdir(parents=True, exist_ok=True)
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'*/*'})
          api = 'https://reportapi.eastmoney.com/report/list'
          windows = [
            (date(2025,6,23), date(2025,6,30)),
            (date(2025,5,18), date(2025,5,24)),
            (date(2024,9,26), date(2024,10,10)),
            (date(2025,9,15), date(2025,9,24)),
          ]
          keywords = ['远大医药','核药增速快','传统业务远航稳舵','核药等创新管线不断兑现','点亮核药蓝海市场','多业务齐头并进']
          log=[]
          def L(x):
            x=str(x); print(x); log.append(x)
          def parse_jsonp(t):
            a=t.find('{'); b=t.rfind('}')
            if a<0 or b<=a: return {}
            return json.loads(t[a:b+1])
          records=[]; seen=set()
          for start,end in windows:
            d=start
            while d<=end:
              ds=d.isoformat()
              for page in range(1,8):
                params={
                  'cb':'jQuery1124','pageSize':100,'pageNo':page,'qType':0,
                  'beginTime':ds,'endTime':ds,'fields':'','orgCode':'','author':'',
                  'industryCode':'*','industry':'*','rating':'','ratingChange':''
                }
                try:
                  r=s.get(api,params=params,timeout=30)
                  L(f'API {ds} p{page}: {r.status_code} {len(r.content)}')
                  obj=parse_jsonp(r.text)
                  rows=obj.get('data') or []
                  for rec in rows:
                    text=json.dumps(rec,ensure_ascii=False)
                    if any(k in text for k in keywords):
                      key=rec.get('infoCode') or text
                      if key not in seen:
                        seen.add(key); records.append(rec)
                        L('MATCH '+text)
                  total=int(obj.get('TotalPage') or 1)
                  if page>=total: break
                  time.sleep(0.3)
                except Exception as e:
                  L(f'API ERROR {ds} p{page}: {e!r}')
                  break
              d += timedelta(days=1)
          (root/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          L(f'TOTAL MATCHES {len(records)}')

          targets=[
            ('核药增速快',1000),
            ('传统业务远航稳舵',950),
            ('核药等创新管线不断兑现',900),
            ('点亮核药蓝海市场',850),
            ('多业务齐头并进',800),
          ]
          def score(rec):
            title=rec.get('title') or ''
            pages=int(rec.get('attachPages') or 0)
            val=pages
            for kw,base in targets:
              if kw in title: val+=base
            if '深度' in title or rec.get('indvIsNew')=='001': val+=100
            return val
          records.sort(key=score,reverse=True)
          downloaded=[]; used=set()
          for rec in records:
            if len(downloaded)>=3: break
            title=rec.get('title') or '远大医药研究报告'
            if title in used: continue
            info=rec.get('infoCode')
            if not info: continue
            org=rec.get('orgSName') or rec.get('orgName') or '券商'
            dt=str(rec.get('publishDate') or '')[:10]
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf',
              f'https://pdf.dfcfw.com/pdf/{info}_1.pdf',
            ]
            for url in urls:
              try:
                r=s.get(url,timeout=90,allow_redirects=True,headers={'Referer':'https://data.eastmoney.com/'})
                L(f'PDF {info} {r.status_code} {len(r.content)} {r.headers.get("content-type")} {url}')
                if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                  safe=re.sub(r'[\\/:*?"<>|]+','_',f'{dt}_{org}_远大医药_{title}')[:180]+'.pdf'
                  path=pdfdir/safe; path.write_bytes(r.content)
                  try:
                    pages=len(PdfReader(str(path)).pages)
                  except Exception as e:
                    L(f'BAD PDF {e!r}'); path.unlink(missing_ok=True); continue
                  if pages<7:
                    path.unlink(missing_ok=True); continue
                  sha=hashlib.sha256(r.content).hexdigest()
                  downloaded.append({'filename':safe,'title':title,'org':org,'date':dt,'pages':pages,'size':len(r.content),'sha256':sha,'infoCode':info,'url':r.url})
                  used.add(title)
                  L(f'VALID {safe} {pages} pages {sha}')
                  break
              except Exception as e:
                L(f'PDF ERROR {url}: {e!r}')
          if len(downloaded)<2:
            raise RuntimeError(f'Only {len(downloaded)} valid reports downloaded')
          manifest=['远大医药（00512.HK）券商深度报告','生成日期：2026-09-05',f'报告数量：{len(downloaded)}','']
          for i,x in enumerate(downloaded,1):
            manifest += [f'{i}. {x["org"]}｜{x["date"]}｜{x["title"]}',f'   页数：{x["pages"]}；文件：{x["filename"]}',f'   SHA-256：{x["sha256"]}','']
          (root/'文件清单与校验值.txt').write_text('\n'.join(manifest),encoding='utf-8')
          (root/'downloaded.json').write_text(json.dumps(downloaded,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'download.log').write_text('\n'.join(log),encoding='utf-8')
          zpath=root/f'远大医药_00512_券商深度报告_{len(downloaded)}份.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for x in downloaded: z.write(pdfdir/x['filename'],arcname=x['filename'])
            z.write(root/'文件清单与校验值.txt',arcname='文件清单与校验值.txt')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('CRC error '+bad)
          L(f'FINAL {zpath} {zpath.stat().st_size}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Grand-Pharma-Deep-Reports-Date-Fetch
          path: grand_pharma_final
          retention-days: 1
