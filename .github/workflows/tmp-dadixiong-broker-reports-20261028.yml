name: Build Dadixiong 688077 broker deep reports

on:
  push:
    branches:
      - tmp-dadixiong-broker-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='大地熊_688077_券商深度报告_3份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/dadixiong_broker_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('大地熊_688077_券商深度报告_3份')
          STOCK = '688077'

          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def parse_json_or_jsonp(text: str) -> Any:
              text = text.strip().lstrip('\ufeff')
              try:
                  return json.loads(text)
              except Exception:
                  pass
              left = text.find('(')
              right = text.rfind(')')
              if left >= 0 and right > left:
                  return json.loads(text[left + 1:right])
              raise ValueError('not JSON or JSONP')

          def collect_records(obj: Any) -> list[dict[str, Any]]:
              found: list[dict[str, Any]] = []
              def walk(node: Any) -> None:
                  if isinstance(node, dict):
                      lower = {str(k).lower(): v for k, v in node.items()}
                      if ('infocode' in lower or 'info_code' in lower) and ('title' in lower or 'reporttitle' in lower):
                          found.append(node)
                      for value in node.values():
                          walk(value)
                  elif isinstance(node, list):
                      for value in node:
                          walk(value)
              walk(obj)
              return found

          def getv(record: dict[str, Any], *names: str) -> Any:
              wanted = {name.lower() for name in names}
              for key, value in record.items():
                  if str(key).lower() in wanted:
                      return value
              return None

          def normalize(record: dict[str, Any]) -> dict[str, str]:
              return {
                  'infoCode': str(getv(record, 'infoCode', 'info_code') or '').strip(),
                  'title': str(getv(record, 'title', 'reportTitle', 'reporttitle') or '').strip(),
                  'broker': str(getv(record, 'orgSName', 'orgsname', 'orgName', 'orgname') or '').strip(),
                  'date': str(getv(record, 'publishDate', 'publishdate') or '').strip()[:10],
              }

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          params = {
              'pageSize': '100',
              'beginTime': '2019-01-01',
              'endTime': '2026-10-28',
              'pageNo': '1',
              'fields': '',
              'qType': '0',
              'orgCode': '',
              'author': '',
              'code': STOCK,
              'industryCode': '',
              'industry': '',
              'rating': '',
              'ratingChange': '',
              'beginMarketValue': '',
              'endMarketValue': '',
              'beginMonth': '',
              'endMonth': '',
              'keyWord': '',
              '_': str(int(time.time() * 1000)),
          }
          response = session.get(
              endpoint,
              params=params,
              headers={
                  'Referer': f'https://data.eastmoney.com/report/stock.jshtml?stockcode={STOCK}',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              },
              timeout=(30, 180),
          )
          print('REPORT API', response.status_code, response.url, 'bytes=', len(response.content))
          if response.status_code != 200:
              raise RuntimeError(f'report API HTTP {response.status_code}')
          payload = parse_json_or_jsonp(response.text)
          records = [normalize(r) for r in collect_records(payload)]

          # Add a verified public record in case the API omits older entries.
          manual = [
              {
                  'infoCode': 'AP202208291577795620',
                  'title': '持续优化产业链，永磁新贵厚积薄发',
                  'broker': '中邮证券',
                  'date': '2022-08-26',
              },
              {
                  'infoCode': 'AP202203291555855151',
                  'title': '把握碳中和机遇，稀土磁材产能有序扩张',
                  'broker': '华鑫证券',
                  'date': '2022-03-29',
              },
          ]
          by_code = {r['infoCode']: r for r in records if r['infoCode']}
          for item in manual:
              by_code.setdefault(item['infoCode'], item)
          records = list(by_code.values())

          print('DISCOVERED', len(records), 'REPORTS')
          for item in sorted(records, key=lambda x: x['date'], reverse=True):
              print('REPORT', item['date'], '|', item['broker'], '|', item['title'], '|', item['infoCode'])

          priority_terms = [
              '高性能烧结钕铁硼永磁领域领先企业',
              '专注稀土永磁的冉冉之星',
              '持续优化产业链',
              '把握碳中和机遇',
              '盈利能力稳步提升',
          ]

          def priority(item: dict[str, str]) -> tuple[int, str]:
              title = re.sub(r'\s+', '', item['title'])
              rank = len(priority_terms) + 5
              for idx, term in enumerate(priority_terms):
                  if re.sub(r'\s+', '', term) in title:
                      rank = idx
                      break
              return rank, item['date']

          candidates = sorted(records, key=priority)

          def pdf_urls(info_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H301_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.PDF',
              ]

          def download_and_validate(item: dict[str, str]) -> dict[str, Any] | None:
              if not item['infoCode']:
                  return None
              last: Exception | None = None
              for attempt in range(6):
                  for url in pdf_urls(item['infoCode']):
                      temp = OUT / f'_temp_{item["infoCode"]}.pdf'
                      try:
                          r = session.get(
                              url,
                              headers={
                                  'Referer': f'https://data.eastmoney.com/report/info/{item["infoCode"]}.html',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = r.content
                          if r.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 150_000:
                              raise RuntimeError(f'HTTP={r.status_code}, bytes={len(data)}, type={r.headers.get("content-type")}')
                          temp.write_bytes(data)
                          reader = PdfReader(str(temp), strict=False)
                          pages = len(reader.pages)
                          if pages < 15:
                              raise RuntimeError(f'only {pages} pages')
                          text = ''
                          indexes = list(range(min(12, pages)))
                          if pages > 12:
                              indexes.append(pages - 1)
                          for index in dict.fromkeys(indexes):
                              try:
                                  text += '\n' + (reader.pages[index].extract_text() or '')
                              except Exception:
                                  pass
                          compact = re.sub(r'\s+', '', text)
                          if '大地熊' not in compact and '安徽大地熊新材料股份有限公司' not in compact:
                              raise RuntimeError('company mismatch')
                          sha = hashlib.sha256(data).hexdigest()
                          temp.unlink(missing_ok=True)
                          return {
                              **item,
                              'data': data,
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': sha,
                              'source': r.url,
                          }
                      except Exception as exc:
                          last = exc
                          temp.unlink(missing_ok=True)
                  time.sleep(min(2 + attempt, 8))
              print('DOWNLOAD FAILED', item, repr(last))
              return None

          downloaded: list[dict[str, Any]] = []
          seen_codes: set[str] = set()
          for item in candidates:
              if item['infoCode'] in seen_codes:
                  continue
              seen_codes.add(item['infoCode'])
              result = download_and_validate(item)
              if result is not None:
                  downloaded.append(result)
              if len(downloaded) >= 3:
                  break

          if len(downloaded) < 2:
              raise RuntimeError(f'Only {len(downloaded)} complete long-form broker reports found')

          # Prefer the longer, clearly company-focused reports if more than three passed validation.
          downloaded.sort(key=lambda x: (priority(x)[0], -int(x['pages'])))
          downloaded = downloaded[:3]

          def clean_filename(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '', value)
              value = re.sub(r'\s+', '', value)
              return value[:56]

          records_out: list[dict[str, Any]] = []
          for index, item in enumerate(downloaded, start=1):
              broker = clean_filename(item['broker'] or '券商')
              title = clean_filename(item['title'])
              filename = f'{index:02d}_{broker}_{title}_{item["date"]}.pdf'
              path = OUT / filename
              path.write_bytes(item['data'])
              records_out.append({k: v for k, v in item.items() if k != 'data'} | {'file': filename})
              print('SELECTED', filename, 'pages=', item['pages'], 'bytes=', item['bytes'], 'sha256=', item['sha256'])

          for temp in OUT.glob('_temp_*.pdf'):
              temp.unlink(missing_ok=True)

          lines = [
              '大地熊（688077）券商深度报告资料包',
              '整理日期：2026-10-28',
              '',
              '收录原则：仅收录公开渠道可直接下载、页数不少于15页，并经PDF结构、公司名称和首末页验证的券商原始完整PDF。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for index, item in enumerate(records_out, start=1):
              total_pages += int(item['pages'])
              total_bytes += int(item['bytes'])
              lines += [
                  f'{index}. {item["broker"]}｜{item["title"]}',
                  f'   发布日期：{item["date"]}',
                  f'   页数：{item["pages"]}页',
                  f'   文件：{item["file"]}',
                  f'   研报索引：https://data.eastmoney.com/report/info/{item["infoCode"]}.html',
                  f'   原始PDF：{item["source"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
              sums.append(f'{item["sha256"]}  {item["file"]}')
          lines += [
              f'合计：{len(records_out)}份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records_out, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          pdf_count=$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)
          test "$pdf_count" -ge 2
          test "$pdf_count" -le 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 15
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '大地熊|安徽大地熊新材料股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/dadixiong_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/dadixiong_broker_test.zip "$PACKAGE"
          unzip -t /tmp/dadixiong_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/dadixiong_broker_test.zip | grep -c '\.pdf$')" -eq "$pdf_count"
          rm -f /tmp/dadixiong_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dadixiong-688077-broker-deep-reports
          path: 大地熊_688077_券商深度报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
