name: Fast build Silu Vision 300556 broker reports 20261021

on:
  push:
    paths:
      - '.github/workflows/silu-300556-fast-package-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pymupdf
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,subprocess,time,zipfile
          from pathlib import Path
          import pymupdf,requests

          root=Path('丝路视觉_300556_券商研究报告'); pdfdir=root/'原始PDF'; prev=root/'首页预览'
          for d in (root,pdfdir,prev): d.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})
          api='https://reportapi.eastmoney.com/report/list'
          aliases=['丝路视觉','丝路视觉科技股份有限公司','300556','瑞云科技','瑞云渲染','丝路蓝']
          strong=['空间计算','虚拟现实','增强现实','混合现实','元宇宙','数字创意','数字视觉','数字孪生','沉浸式','AIGC','文生视频','AI视频','数字人','XR','VR','MR']
          windows=[('2023-04-01','2023-06-30'),('2023-10-01','2023-12-31'),('2024-01-01','2024-03-31'),('2024-04-01','2024-07-31')]

          def getpdf(info):
              detail=f'https://data.eastmoney.com/report/info/{info}.html'
              for h in ['H3','H2','H1','H4']:
                  u=f'https://pdf.dfcfw.com/pdf/{h}_{info}_1.pdf'
                  try:
                      r=s.get(u,timeout=(20,240),headers={'User-Agent':s.headers['User-Agent'],'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'})
                      if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:return r.content,u,detail
                  except Exception:pass
              return None,None,detail
          def inspect(data):
              doc=pymupdf.open(stream=data,filetype='pdf'); hits=[];snips=[];occ=0
              for i in range(doc.page_count):
                  text=doc.load_page(i).get_text('text') or ''; compact=re.sub(r'\s+','',text); ph={}
                  for a in aliases:
                      n=compact.count(re.sub(r'\s+','',a))
                      if n:
                          ph[a]=n;occ+=n
                          if len(snips)<12:
                              pos=text.find(a)
                              if pos>=0:snips.append({'page':i+1,'alias':a,'text':' '.join(text[max(0,pos-140):pos+len(a)+260].split())})
                  if ph:hits.append({'page':i+1,'hits':ph})
              pages=doc.page_count;doc.close();return pages,hits,snips,occ

          rows=[];seen=set()
          for begin,end in windows:
              total=1
              for page in range(1,100):
                  if page>total:break
                  p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'1','orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  payload=None
                  for attempt in range(4):
                      try:
                          r=s.get(api,params=p,timeout=(20,120))
                          if r.status_code==200:payload=r.json();break
                      except Exception:pass
                      time.sleep(1+attempt)
                  if not payload:break
                  total=min(int(payload.get('TotalPage') or 1),99);data=payload.get('data') or []
                  if isinstance(data,dict):data=data.get('list') or data.get('data') or []
                  if not data:break
                  for row in data:
                      info=str(row.get('infoCode') or ''); title=str(row.get('title') or ''); pages=int(float(row.get('attachPages') or 0))
                      if info and info not in seen and pages>=10 and any(t.lower() in title.lower() for t in strong):
                          seen.add(info);rows.append(row)
                  if len(data)<100:break
          def score(r):
              title=str(r.get('title') or '');pages=int(float(r.get('attachPages') or 0));return pages*3+sum(80 for t in strong if t.lower() in title.lower())-(100 if any(x in title for x in ['周报','点评','日报']) else 0)
          rows.sort(key=score,reverse=True)
          direct=[];related=[];scanned=[]
          for row in rows[:75]:
              info=str(row.get('infoCode') or '');data,u,detail=getpdf(info)
              if not data:continue
              pages,hits,snips,occ=inspect(data)
              item={'info':info,'title':str(row.get('title') or ''),'broker':str(row.get('orgSName') or row.get('orgName') or '未知机构'),'date':str(row.get('publishDate') or '')[:10],'analysts':row.get('researcher') or '', 'rating':row.get('emRatingName') or '', 'data':data,'pdf_url':u,'detail':detail,'pages':pages,'hits':hits,'snips':snips,'occ':occ,'score':score(row)+len(hits)*250+occ*40}
              scanned.append({k:v for k,v in item.items() if k!='data'})
              (direct if hits else related).append(item)
              if len(direct)>=4 and len({x['broker'] for x in direct})>=2:break
          direct.sort(key=lambda x:x['score'],reverse=True);related.sort(key=lambda x:x['score'],reverse=True)

          company={'info':'AP202406281637023181','title':'首次覆盖：视觉即话语，细琢数字内容创意','broker':'万联证券','date':'2024-06-28','analysts':'夏清莹、李中港','rating':'增持'}
          cdata,cu,cdetail=getpdf(company['info'])
          if not cdata:raise RuntimeError('company PDF failed')
          cpages,chits,csnips,cocc=inspect(cdata);company.update(data=cdata,pdf_url=cu,detail=cdetail,pages=cpages,hits=chits,snips=csnips,occ=cocc,classification='公司首次覆盖深度报告')
          selected=[company];used={'万联证券'}
          for x in direct:
              if x['broker'] in used:continue
              x['classification']='行业深度报告（正文直接提及丝路视觉）';selected.append(x);used.add(x['broker'])
              if len(selected)==3:break
          for x in direct:
              if len(selected)==3:break
              if x not in selected:x['classification']='行业深度报告（正文直接提及丝路视觉）';selected.append(x)
          for x in related:
              if len(selected)>=2:break
              x['classification']='高度相关行业深度报告（正文未检出公司名）';selected.append(x)
          if len(selected)<2:raise RuntimeError('not enough usable PDFs')

          def safe(x):return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',x))[:80]
          manifest=[]
          for i,x in enumerate(selected[:3],1):
              name=f"{i:02d}_{safe(x['broker'])}_{safe(x['title'])}_{x['date']}.pdf";dest=pdfdir/name;dest.write_bytes(x['data'])
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=prev/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              png=Path(str(prefix)+'.png');sha=hashlib.sha256(x['data']).hexdigest()
              manifest.append({'filename':str(Path('原始PDF')/name),'broker':x['broker'],'title':x['title'],'date':x['date'],'analysts':x['analysts'],'rating':x['rating'],'classification':x['classification'],'pages':x['pages'],'company_mention_pages':x['hits'],'company_mention_occurrences':x['occ'],'mention_snippets':x['snips'],'source_report_page':x['detail'],'pdf_url':x['pdf_url'],'info_code':x['info'],'sha256':sha,'preview_file':str(Path('首页预览')/png.name)})
          lines=['丝路视觉（300556.SZ）券商研究报告资料包','整理日期：2026-10-21','']
          for i,x in enumerate(manifest,1):
              hp=', '.join(str(z['page']) for z in x['company_mention_pages']) or '未检出'
              lines += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}；页数：{x['pages']}",f"   分类：{x['classification']}；公司命中页：{hp}",f"   来源：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          lines += ['报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。','已核验PDF文件头、文档结构、首页渲染、全文公司关键词及ZIP CRC。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'candidate_scan.json').write_text(json.dumps(scanned,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')
          zpath=Path('siluvision_300556_broker_reports.zip')
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():z.write(p,arcname=f'{root.name}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              assert len([n for n in z.namelist() if n.lower().endswith('.pdf')])==len(manifest)
          Path('丝路视觉_300556_券商研究报告.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: siluvision-300556-broker-reports-fast-final
          path: |
            siluvision_300556_broker_reports.zip
            丝路视觉_300556_券商研究报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
