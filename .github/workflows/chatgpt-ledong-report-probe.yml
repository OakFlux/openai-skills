name: Probe public Ledong Robotics broker reports

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Probe report pages, public APIs, and PDF URLs
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import json, re, io, csv, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT = Path('probe_output'); OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          detail_ids = ['5593366','5646471']
          all_candidates = []
          for rid in detail_ids:
              url = f'https://www.fxbaogao.com/detail/{rid}'
              try:
                  r = s.get(url, timeout=60, allow_redirects=True)
                  print('\nDETAIL', rid, r.status_code, r.url, r.headers.get('content-type'), len(r.content))
                  print(r.text[:1200])
                  (OUT/f'fx_{rid}.html').write_bytes(r.content)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  scripts = [urllib.parse.urljoin(r.url, x.get('src')) for x in soup.find_all('script') if x.get('src')]
                  print('SCRIPTS', rid, len(scripts))
                  for x in scripts: print('SCRIPT', x)
                  text = r.text
                  pats = [
                      r'https?://[^\"\'<>\\\s]+\.pdf(?:\?[^\"\'<>\\\s]*)?',
                      r'https?://[^\"\'<>\\\s]+',
                      r'[^\"\'<>\\\s]{0,200}(?:download|pdfUrl|pdf_url|fileUrl|file_url|reportId|mofoun|detail)[^\"\'<>\\\s]{0,500}',
                  ]
                  hits=[]
                  for p in pats: hits.extend(re.findall(p,text,re.I))
                  hits=list(dict.fromkeys(hits))
                  (OUT/f'fx_{rid}_hits.txt').write_text('\n'.join(hits),encoding='utf-8')
                  for h in hits:
                      if any(k in h.lower() for k in ('pdf','download','mofoun','reportid','fileurl')):
                          print('HIT',rid,repr(h[:1500]))
                  # Fetch page-specific JS only, limited to 25 files.
                  for i,jsurl in enumerate(scripts[:25]):
                      try:
                          rr=s.get(jsurl,timeout=60); rr.raise_for_status()
                          name=f'fx_{rid}_js_{i:02d}.js'; (OUT/name).write_bytes(rr.content)
                          js=rr.text
                          jhits=[]
                          for p in pats: jhits.extend(re.findall(p,js,re.I))
                          jhits=list(dict.fromkeys(jhits))
                          for h in jhits:
                              if any(k in h.lower() for k in ('download','mofoun','pdfurl','fileurl','/detail/')):
                                  print('JSHIT',rid,i,repr(h[:1800]))
                      except Exception as e:
                          print('JSERR',rid,i,jsurl,repr(e))
              except Exception as e:
                  print('DETAIL_ERR',rid,repr(e))

          # Try Eastmoney HK/stock-report endpoints with several code variants.
          list2='https://reportapi.eastmoney.com/report/list2'
          for code in ['01236','1236','HK01236','01236.HK']:
              for method in ['POST','GET']:
                  body={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,
                        'beginTime':'2026-01-01','endTime':'2026-09-06','code':code,
                        'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
                  try:
                      if method=='POST':
                          rr=s.post(list2,json=body,headers={'Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/'},timeout=60)
                      else:
                          rr=s.get(list2,params=body,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=60)
                      print('\nEAST',method,code,rr.status_code,rr.headers.get('content-type'),len(rr.content),rr.text[:800])
                      rr.raise_for_status()
                      try:
                          data=rr.json(); (OUT/f'east_{method}_{code.replace(".","_")}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
                          rows=data.get('data') or []
                          print('EAST_ROWS',method,code,len(rows),'hits',data.get('hits'))
                          for row in rows:
                              print('EAST_REC',json.dumps(row,ensure_ascii=False)[:2500])
                      except Exception as je: print('EAST_JSON_ERR',repr(je))
                  except Exception as e: print('EAST_ERR',method,code,repr(e))

          # Probe reportapi generic listings around known publication dates and filter exact company/title.
          generic='https://reportapi.eastmoney.com/report/list'
          for begin,end in [('2026-08-01','2026-08-31'),('2026-09-01','2026-09-06')]:
              try:
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                          'beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':'1','orgCode':'','code':'','rcode':'',
                          'p':'1','pageNum':'1','pageNumber':'1'}
                  rr=s.get(generic,params=params,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=60)
                  print('\nGENERIC',begin,end,rr.status_code,len(rr.content),rr.text[:500])
                  rr.raise_for_status(); data=rr.json(); rows=data.get('data') or []
                  for row in rows:
                      txt=' '.join(str(row.get(k) or '') for k in ('title','stockName','orgSName','industryName'))
                      if any(k in txt for k in ('乐动机器人','樂動機器人','01236','割草机器人','视觉感知龙头','双曲线模式')):
                          print('GENERIC_MATCH',json.dumps(row,ensure_ascii=False)[:3500])
              except Exception as e: print('GENERIC_ERR',begin,end,repr(e))

          # Probe obvious public download routes only; do not attempt login/auth bypass.
          for rid in detail_ids:
              routes=[
                  f'https://www.fxbaogao.com/download/{rid}',
                  f'https://www.fxbaogao.com/detail/download/{rid}',
                  f'https://www.fxbaogao.com/api/download/{rid}',
                  f'https://www.fxbaogao.com/mofoun/agent/download?reportId={rid}',
                  f'https://api.fxbaogao.com/mofoun/agent/download?reportId={rid}',
              ]
              for u in routes:
                  try:
                      rr=s.get(u,timeout=60,allow_redirects=True)
                      head=rr.content[:20]
                      print('ROUTE',rid,u,'=>',rr.status_code,rr.url,rr.headers.get('content-type'),len(rr.content),repr(head))
                      if b'%PDF' in rr.content[:4096] and len(rr.content)>100000:
                          p=OUT/f'route_{rid}.pdf'; p.write_bytes(rr.content)
                          reader=PdfReader(io.BytesIO(rr.content),strict=False)
                          print('ROUTE_PDF',rid,len(reader.pages),p)
                  except Exception as e: print('ROUTE_ERR',rid,u,repr(e))
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_Robotics_Report_Probe
          path: probe_output
          retention-days: 2
          if-no-files-found: error
