name: Inspect Fxbaogao viewer API endpoints
on:
  push:
    paths:
      - '.github/workflows/china-baoan-fxbaogao-js-api-inspect-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet curl_cffi
      - shell: bash
        run: |
          python - <<'PY'
          import re
          from curl_cffi import requests
          s=requests.Session(impersonate='chrome')
          urls=[
            'https://m.fxbaogao.com/static/js/index.4ed7335b.js',
            'https://m.fxbaogao.com/static/js/chunk-vendors.48088b1b.js',
            'https://static.fxbaogao.com/detail_source/js/app-v1.js',
          ]
          for u in urls:
            print('\nFETCH',u,flush=True)
            r=s.get(u,timeout=120,headers={'Referer':'https://m.fxbaogao.com/view?id=2892941'})
            print('STATUS',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
            text=r.text
            print('URLS',flush=True)
            for x in sorted(set(re.findall(r'https?[^\s"\'`<>]+',text,re.I))):
              if any(k in x.lower() for k in ['api','report','pdf','image','download','fxbaogao','hufangde']): print(x[:2000],flush=True)
            keys=['report-image','docId','docid','pageCount','pagecount','download','pdf','/view','mofoun','report/detail','reportDetail','detailById','preview','oss']
            for key in keys:
              pos=0; count=0
              while True:
                pos=text.lower().find(key.lower(),pos)
                if pos<0 or count>=30: break
                print('CONTEXT',key,text[max(0,pos-1500):pos+4000],flush=True)
                pos+=len(key); count+=1
          PY
