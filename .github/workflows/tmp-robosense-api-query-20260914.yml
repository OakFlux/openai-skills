name: Query RoboSense official IR APIs
on:
  push:
    branches:
      - tmp-robosense-api-query-20260914
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Query public IR endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, requests
          from pathlib import Path

          base='https://server.comein.cn/comein'
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Origin':'https://ir.robosense.ai',
            'Referer':'https://ir.robosense.ai/'
          }
          s=requests.Session(); s.headers.update(headers)
          calls=[]
          def get(name,url,params=None):
              try:
                  r=s.get(url,params=params,timeout=90)
                  rec={'name':name,'request_url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'text':r.text}
              except Exception as exc:
                  rec={'name':name,'error':repr(exc)}
              calls.append(rec)
          def post(name,url,body):
              try:
                  r=s.post(url,json=body,timeout=90)
                  rec={'name':name,'request_url':r.url,'body':body,'status':r.status_code,'content_type':r.headers.get('content-type'),'text':r.text}
              except Exception as exc:
                  rec={'name':name,'body':body,'error':repr(exc)}
              calls.append(rec)

          get('store',f'{base}/irmcenter/anonymous/irstore/22837',{'languageType':0})
          get('quarter',f'{base}/irmcenter/anonymous/irstore/22837/quarter/performance',{'languageType':0,'isAll':'true'})
          get('announcements_store',f'{base}/irmcenter/v2/anonymous/irstore/22837/announcements',{'languageType':0,'isPublish':'true','pageStart':0,'pageNum':1000})
          get('announcements_stock',f'{base}/irmcenter/v3/anonymous/irstore/HK02498/announcements',{'languageType':0,'isPublish':'true','pageStart':0,'pageNum':1000})
          post('report_zh',f'{base}/irmcenter/anonymous/irstore/report/list',{'fullCode':'HK02498','languageType':0,'pageStart':0,'pageNum':1000})
          post('report_hk',f'{base}/irmcenter/anonymous/irstore/report/list',{'fullCode':'HK02498','languageType':2,'pageStart':0,'pageNum':1000})

          parsed=[]
          for rec in calls:
              out={k:v for k,v in rec.items() if k!='text'}
              if 'text' in rec:
                  try: out['json']=json.loads(rec['text'])
                  except Exception: out['text_head']=rec['text'][:2000]
              parsed.append(out)
          Path('output/result.json').write_text(json.dumps(parsed,ensure_ascii=False,indent=2),encoding='utf-8')
          for rec in parsed:
              print('CALL',rec.get('name'),'STATUS',rec.get('status'),'ERROR',rec.get('error'))
              print(json.dumps(rec.get('json',rec.get('text_head','')),ensure_ascii=False)[:30000])
          PY
      - name: Upload API responses
        uses: actions/upload-artifact@v4
        with:
          name: robosense-api-responses
          path: output/result.json
          retention-days: 1
          if-no-files-found: error
