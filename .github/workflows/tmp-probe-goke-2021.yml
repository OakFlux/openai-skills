name: Temporary Goke Micro 2021 public source probe

on:
  push:
    branches:
      - tmp-goke-2021-probe-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public resource page and exposed download links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import urllib.parse

          import requests
          from bs4 import BeautifulSoup

          page_url = "https://0101ssd.com/a/5175"
          s = requests.Session()
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/json,application/pdf,*/*;q=0.8",
          })
          r = s.get(page_url, timeout=60, allow_redirects=True)
          print("PAGE", r.status_code, len(r.content), r.headers.get("content-type"), r.url)
          r.raise_for_status()
          text = r.text
          soup = BeautifulSoup(text, "html.parser")
          print("TITLE", soup.title.get_text(" ", strip=True) if soup.title else "")
          print("COOKIES", s.cookies.get_dict())

          print("\n=== TAGS RELATED TO DOWNLOAD ===")
          for tag in soup.find_all(True):
              blob = str(tag).lower()
              visible = tag.get_text(" ", strip=True)
              if any(k in blob for k in ["download", "down", "file", "resource", "附件", "下载", "5175"]):
                  attrs = {k: v for k, v in tag.attrs.items() if k in [
                      "href", "src", "data", "data-id", "data-url", "data-file", "data-download",
                      "data-href", "onclick", "id", "class", "value", "name", "action"
                  ]}
                  if attrs or visible:
                      print("TAG", json.dumps({"tag": tag.name, "text": visible[:300], "attrs": attrs}, ensure_ascii=False)[:5000])

          print("\n=== INLINE SCRIPT CONTEXTS ===")
          for idx, tag in enumerate(soup.find_all("script")):
              if tag.get("src"):
                  continue
              script = tag.get_text("\n") or ""
              if any(k in script.lower() for k in ["download", "down", "file", "resource", "5175"]):
                  print("INLINE", idx, script[:15000])

          scripts = [urllib.parse.urljoin(r.url, t.get("src")) for t in soup.find_all("script", src=True)]
          print("\nSCRIPT_COUNT", len(scripts))
          for url in scripts:
              try:
                  rr = s.get(url, timeout=45)
                  body = rr.text
                  if any(k in body.lower() for k in ["download", "downfile", "fileurl", "resource", "/api/"]):
                      print("\nSCRIPT", url, rr.status_code, len(rr.content))
                      for needle in ["download", "downfile", "fileUrl", "file_url", "resource", "5175", "/api/"]:
                          for match in list(re.finditer(re.escape(needle), body, re.I))[:20]:
                              p = match.start()
                              print("CTX", needle, body[max(0, p-800):p+2200].replace("\n", " ")[:3000])
              except Exception as exc:
                  print("SCRIPT_ERR", url, repr(exc))

          # Extract only URLs or relative paths explicitly present in the public HTML/JS.
          corpus = text
          for url in scripts:
              try:
                  corpus += "\n" + s.get(url, timeout=45).text
              except Exception:
                  pass
          patterns = [
              r"https?://[^\s\"'<>]+(?:\.pdf|download|down|file|resource)[^\s\"'<>]*",
              r"[/A-Za-z0-9_.?=&%:-]*(?:download|down|file|resource)[/A-Za-z0-9_.?=&%:-]*",
          ]
          raw = set()
          for pat in patterns:
              raw.update(re.findall(pat, corpus, re.I))
          candidates = []
          for value in sorted(raw):
              value = value.strip("\\\"'()[]{};, ")
              if len(value) < 4:
                  continue
              url = urllib.parse.urljoin(r.url, value)
              if url not in candidates:
                  candidates.append(url)
          print("\nEXPLICIT_CANDIDATES", len(candidates))
          for url in candidates[:300]:
              print("CANDIDATE_URL", url)
              try:
                  rr = s.get(url, timeout=60, allow_redirects=False, headers={"Referer": r.url})
                  print("TEST", rr.status_code, rr.headers.get("content-type"), len(rr.content), rr.headers.get("location"), rr.content[:20])
                  if rr.status_code == 200 and rr.content.startswith(b"%PDF-"):
                      print("FOUND_PUBLIC_PDF", url, len(rr.content))
                      open("found_public_report.pdf", "wb").write(rr.content)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("TEST_ERR", repr(exc))
          print("NO_PUBLIC_PDF_FOUND_FROM_EXPOSED_LINKS")
          PY
      - name: Upload discovered PDF if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goke-2021-public-pdf-probe
          path: found_public_report.pdf
          if-no-files-found: ignore
          retention-days: 1
