name: Temporary Nanshan Prospectus Fetch

on:
  push:
    paths:
      - '.github/workflows/nanshan-prospectus-temp.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download official HKEX prospectus
        shell: bash
        run: |
          set -euo pipefail
          url='https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0317/2025031700020_c.pdf'
          out='Nanshan_Aluminium_International_2025_Prospectus_CN_OFFICIAL_HKEX.pdf'
          curl -fL --retry 6 --retry-delay 3 --connect-timeout 30 --max-time 600 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
            -H 'Referer: https://www1.hkexnews.hk/' \
            -o "$out" "$url"
          test "$(head -c 5 "$out")" = '%PDF-'
          test "$(stat -c%s "$out")" -gt 17000000
          sha256sum "$out" > SHA256SUMS.txt
          file "$out" > FILE_INFO.txt
          stat "$out" >> FILE_INFO.txt
      - name: Upload prospectus artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanshan-prospectus-cn-official
          path: |
            Nanshan_Aluminium_International_2025_Prospectus_CN_OFFICIAL_HKEX.pdf
            SHA256SUMS.txt
            FILE_INFO.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
