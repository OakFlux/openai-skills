name: Caihong Report Source Probe

on:
  push:
    branches:
      - chatgpt-caihong-reports-20260929
    paths:
      - .github/workflows/caihong_source_probe_20260929.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect source pages and direct PDF candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          urls = [
              'https://www.fxbaogao.com/detail/4749555',
              'https://www.fxbaogao.com/view?id=4749555',
              'https://www.fxbaogao.com/pdf?id=4749555',
              'https://news.10jqka.com.cn/field/sr/19700101/51148091.shtml',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/795314116180/index.phtml',
              'https://max.book118.com/html/2025/0315/6234153044011055.shtm',
          ]
          all_results=[]
          for url in urls:
              try:
                  r=s.get(url, timeout=60, allow_redirects=True)
                  text=r.text
                  print('\n===',url,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'===')
                  print(text[:3000])
                  soup=BeautifulSoup(text,'html.parser')
                  links=[]
                  for tag in soup.find_all(['a','iframe','embed','object','script','link','img']):
                      for attr in ('href','src','data','data-src'):
                          v=tag.get(attr)
                          if not v: continue
                          full=urljoin(r.url,v)
                          blob=(tag.get_text(' ',strip=True)+' '+full).lower()
                          if any(k in blob for k in ['pdf','download','view','report','4749555','795314116180','51148091','file','oss','static']):
                              links.append({'tag':tag.name,'attr':attr,'text':tag.get_text(' ',strip=True)[:120],'url':full})
                  raw_urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',text)))
                  raw_hits=[u for u in raw_urls if any(k in u.lower() for k in ['pdf','4749555','download','file','oss','static','report'])]
                  snippets=[]
                  for pat in ['4749555','pdf','download','resource','fileUrl','file_url','reportUrl','viewUrl','oss','static.fxbaogao','api.fxbaogao']:
                      for m in re.finditer(pat,text,re.I):
                          a=max(0,m.start()-300); b=min(len(text),m.end()+500)
                          sn=text[a:b].replace('\n',' ')[:1000]
                          if sn not in snippets: snippets.append(sn)
                          if len(snippets)>=30: break
                      if len(snippets)>=30: break
                  result={'source':url,'status':r.status_code,'final':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'links':links[:300],'raw_hits':raw_hits[:300],'snippets':snippets}
                  all_results.append(result)
                  print('LINKS',json.dumps(links[:100],ensure_ascii=False,indent=2))
                  print('RAW_HITS',json.dumps(raw_hits[:100],ensure_ascii=False,indent=2))
                  print('SNIPPETS',json.dumps(snippets[:20],ensure_ascii=False,indent=2))
              except Exception as e:
                  print('ERROR',url,repr(e))
                  all_results.append({'source':url,'error':repr(e)})
          with open('output/source_probe.json','w',encoding='utf-8') as f:
              json.dump(all_results,f,ensure_ascii=False,indent=2)
          PY
      - name: Upload probe metadata
        uses: actions/upload-artifact@v4
        with:
          name: caihong-source-probe
          path: output/source_probe.json
          retention-days: 1
