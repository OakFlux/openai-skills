name: Temporary Inspect Mengtai Report Detail Pages

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-inspect-mengtai-detail.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect report pages and candidate downloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from urllib.parse import urljoin,unquote
          reports=[
            ('2024-04-15','海通国际','公司年报点评：短期业绩承压，积极推进碳纤维项目落地','766484899961'),
            ('2024-04-02','海通证券','短期业绩承压，积极推进碳纤维项目落地','765366822786'),
            ('2023-08-21','海通证券','上半年业绩承压，授予限制性股票彰显发展信心','745945956219'),
            ('2022-08-12','海通证券','发行可转债，加码BCF和DTY布局','713612875462'),
            ('2021-08-11','海通证券','丙纶长丝业绩增长，研发锂电隔膜新材料','682007671819'),
            ('2021-06-23','海通证券','国内丙纶长丝龙头，募投扩产助力成长','677751088709'),
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://stock.finance.sina.com.cn/'})
          def dec(raw):
            for enc in ('utf-8','gb18030','gbk'):
              try:return raw.decode(enc)
              except UnicodeDecodeError:pass
            return raw.decode('utf-8','ignore')
          for date,broker,title,rid in reports:
            page=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
            r=s.get(page,timeout=60,allow_redirects=True)
            text=html.unescape(dec(r.content)).replace('\\/','/')
            visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
            visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
            visible=re.sub(r'<[^>]+>',' ',visible);visible=re.sub(r'\s+',' ',visible).strip()
            urls=[]
            for pat in [
              r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',
              r'(?:href|src|action|data|value)=["\']([^"\']+)["\']',
              r'url\s*[:=]\s*["\']([^"\']+)["\']',
            ]:
              for v in re.findall(pat,text,flags=re.I):
                if isinstance(v,tuple):v=v[0]
                u=urljoin(r.url,html.unescape(unquote(v)))
                low=u.lower()
                if any(k in low for k in ['pdf','down','download','file','report','rptid']):
                  if u not in urls:urls.append(u)
            snippets=[]
            for needle in ['pdf','download','down','file','attach','rptid','报告页数','page']:
              for m in list(re.finditer(needle,text,flags=re.I))[:5]:
                snippets.append(re.sub(r'\s+',' ',text[max(0,m.start()-180):m.start()+500]))
            print('DETAIL_JSON='+json.dumps({'date':date,'broker':broker,'title':title,'rid':rid,'page':page,'status':r.status_code,'bytes':len(r.content),'visible_head':visible[:1800],'urls':urls[:100],'snippets':snippets[:30]},ensure_ascii=False))
            candidates=[
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Down/kind/search/rptid/{rid}/index.phtml',
              f'http://stock.finance.sina.com.cn/stock/go.php/vReport_Down/kind/search/rptid/{rid}/index.phtml',
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Down/rptid/{rid}/index.phtml',
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Download/kind/search/rptid/{rid}/index.phtml',
            ]
            for u in candidates:
              try:
                q=s.get(u,timeout=60,allow_redirects=True)
                print('CANDIDATE_JSON='+json.dumps({'rid':rid,'url':u,'final':q.url,'status':q.status_code,'bytes':len(q.content),'type':q.headers.get('content-type'),'disposition':q.headers.get('content-disposition'),'head_hex':q.content[:16].hex()},ensure_ascii=False))
              except Exception as e:print('CANDIDATE_JSON='+json.dumps({'rid':rid,'url':u,'error':repr(e)},ensure_ascii=False))
          PY
