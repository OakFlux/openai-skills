name: package-laplace-688726-broker-reports-v2

on:
  push:
    branches:
      - tmp/laplace-688726-broker-20261105-v2

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY = "拉普拉斯新能源科技股份有限公司"
          CODE = "688726"
          PREPARED = "2026-11-05"
          ROOT_NAME = "拉普拉斯_688726_券商深度研究报告_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "sequence": 1,
                  "date": "2026-03-24",
                  "broker": "东吴证券",
                  "analyst": "周尔双、李文意",
                  "rating": "增持（首次覆盖）",
                  "report_type": "公司深度研究",
                  "title": "光伏电池设备龙头受益于技术迭代与设备出海，泛半导体设备打造第二成长曲线",
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP202603241820717273_1.pdf",
                  "filename": "01_20260324_东吴证券_光伏电池设备龙头受益于技术迭代与设备出海_公司深度研究.pdf",
                  "expected_pages": 36,
                  "markers": ["拉普拉斯", "688726", "光伏电池设备龙头"],
              },
              {
                  "sequence": 2,
                  "date": "2025-02-10",
                  "broker": "天风证券",
                  "analyst": "孙潇雅、朱晔",
                  "rating": "持有（首次评级）",
                  "report_type": "公司首次覆盖报告",
                  "title": "光伏电池设备持续深耕，碳化硅设备打开向上空间",
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP202502111642959385_1.pdf",
                  "filename": "02_20250210_天风证券_光伏电池设备持续深耕碳化硅设备打开向上空间_首次覆盖报告.pdf",
                  "expected_pages": 16,
                  "markers": ["拉普拉斯", "688726", "光伏电池设备持续深耕"],
              },
              {
                  "sequence": 3,
                  "date": "2024-10-26",
                  "broker": "国金证券",
                  "analyst": "姚遥",
                  "rating": "买入（首次评级）",
                  "report_type": "公司深度研究",
                  "title": "把握技术迭代契机，xBC再续辉煌",
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP202410281640531176_1.pdf",
                  "filename": "03_20241026_国金证券_把握技术迭代契机xBC再续辉煌_公司深度研究.pdf",
                  "expected_pages": 31,
                  "markers": ["把握技术迭代契机", "xBC再续辉煌", "姚遥"],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def download(url):
              last = None
              for candidate in [url, url + "?download=1"]:
                  for attempt in range(5):
                      try:
                          r = session.get(candidate, timeout=(30, 480), allow_redirects=True,
                                          headers={"Accept": "application/pdf,*/*;q=0.8", "Referer": "https://data.eastmoney.com/"})
                          print("DOWNLOAD", r.status_code, len(r.content), r.url, r.headers.get("content-type"))
                          r.raise_for_status()
                          if r.content.startswith(b"%PDF-") and len(r.content) > 100000:
                              return r.content, r.url, r.headers.get("content-type", "")
                          last = RuntimeError(f"Not PDF: {r.content[:60]!r}")
                      except Exception as exc:
                          last = exc
                          print("DOWNLOAD_ERROR", attempt, candidate, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f"Download failed {url}: {last}")

          manifest = []
          for report in reports:
              data, final_url, content_type = download(report["url"])
              out = PDF_DIR / report["filename"]
              out.write_bytes(data)
              reader = PdfReader(str(out), strict=False)
              pages = len(reader.pages)
              if pages != report["expected_pages"]:
                  raise RuntimeError(f"Page mismatch for {out.name}: {pages} != {report['expected_pages']}")

              check = subprocess.run(["qpdf", "--warning-exit-0", "--check", str(out)],
                                     stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {out.name}: {check.stdout}")

              text = subprocess.run(["pdftotext", "-f", "1", "-l", "8", str(out), "-"],
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True).stdout
              compact = re.sub(r"\s+", "", text)
              marker_hits = [m for m in report["markers"] if re.sub(r"\s+", "", m) in compact]
              print("TEXT_MARKERS", report["broker"], marker_hits)

              prefix = PREVIEW_DIR / out.stem
              render = subprocess.run(["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "160", "-singlefile", str(out), str(prefix)],
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f"Preview failed for {out.name}: {render.stdout}")

              record = {**report, "source_url": final_url, "content_type": content_type,
                        "pages": pages, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(),
                        "text_marker_hits": marker_hits, "preview_file": str(Path("首页预览") / preview.name)}
              manifest.append(record)
              print("VALIDATED", record["broker"], record["date"], pages, record["sha256"], record["title"])

          lines = [
              f"{COMPANY}（{CODE}.SH）券商深度研究报告资料包",
              f"整理日期：{PREPARED}", "",
              "本包收录3份可公开下载并验证的券商原始PDF，均为公司深度研究或首次覆盖报告。",
              "未使用网页摘要、索引页或重新排版文件替代原始报告。", "",
          ]
          for x in manifest:
              lines += [
                  f"{x['sequence']}. {x['filename']}",
                  f"   券商：{x['broker']}；研究员：{x['analyst']}",
                  f"   日期：{x['date']}；评级：{x['rating']}",
                  f"   类型：{x['report_type']}",
                  f"   标题：{x['title']}",
                  f"   页数：{x['pages']}；文件大小：{x['bytes']}字节",
                  f"   公开来源：{x['source_url']}",
                  f"   SHA-256：{x['sha256']}", "",
              ]
          lines += [
              "核验项目：PDF文件头、精确页数、qpdf结构、首页渲染、文本标记、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(lines), encoding="utf-8")

          payload = {"company": COMPANY, "stock_code": CODE, "prepared_on": PREPARED,
                     "report_count": len(manifest), "original_pdf_count": len(manifest), "files": manifest}
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as f:
              w = csv.writer(f)
              w.writerow(["序号", "券商", "日期", "研究员", "评级", "类型", "标题", "文件名", "页数", "字节数", "SHA-256", "公开来源", "首页预览"])
              for x in manifest:
                  w.writerow([x["sequence"], x["broker"], x["date"], x["analyst"], x["rating"], x["report_type"], x["title"], x["filename"], x["pages"], x["bytes"], x["sha256"], x["source_url"], x["preview_file"]])
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(f"{x['sha256']}  PDF文件/{x['filename']}" for x in manifest) + "\n", encoding="utf-8")

          zip_path = Path("laplace_688726_broker_deep_reports_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in sorted(ROOT.rglob("*")):
                  if p.is_file():
                      z.write(p, arcname=str(Path(ROOT_NAME) / p.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith(".pdf")]
              if bad or len(pdfs) != 3:
                  raise RuntimeError(f"ZIP validation failed bad={bad} pdfs={len(pdfs)}")

          result = {"package": zip_path.name, "zip_bytes": zip_path.stat().st_size,
                    "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
                    "report_count": len(manifest), "original_pdf_count": len(manifest),
                    "files": [{k: x[k] for k in ["broker", "date", "analyst", "rating", "report_type", "title", "pages", "bytes", "sha256", "source_url"]} for x in manifest]}
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: laplace-688726-broker-deep-reports-3-v2-20261105
          path: |
            laplace_688726_broker_deep_reports_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
