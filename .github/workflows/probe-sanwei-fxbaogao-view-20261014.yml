name: Probe Sanwei free report view pages

on:
  pull_request:
    paths:
      - 'tasks/probe-sanwei-fxbaogao-view-20261014.trigger'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect view pages
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests,pathlib
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://www.fxbaogao.com/'})
          out=pathlib.Path('out'); out.mkdir()
          for rid in [4736599,4790436,4665308]:
              u=f'https://www.fxbaogao.com/view?id={rid}'
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('FETCH',rid,r.status_code,len(r.content),r.url,flush=True)
              out.joinpath(f'{rid}.html').write_bytes(r.content)
              text=r.text
              urls=re.findall(r'https?://[^\"\'<> ]+',text)
              imgs=[x for x in urls if 'report-image' in x or '.pdf' in x.lower() or 'download' in x.lower()]
              print('ASSETS',rid,json.dumps(list(dict.fromkeys(imgs)),ensure_ascii=False,indent=2),flush=True)
              for pat in ['pageCount','page_count','totalPage','pages','report-image','pdf','download','docId','reportId']:
                  hits=[]
                  for m in re.finditer(pat,text,re.I):
                      hits.append(text[max(0,m.start()-180):min(len(text),m.end()+300)])
                  if hits: print('CONTEXT',rid,pat,json.dumps(hits[:30],ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sanwei-free-view-pages
          path: out/
          retention-days: 3
