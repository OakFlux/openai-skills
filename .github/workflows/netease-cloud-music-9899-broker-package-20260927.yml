name: Build NetEase Cloud Music 9899 broker deep report package 20260927

on:
  push:
    paths:
      - '.github/workflows/netease-cloud-music-9899-broker-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '网易云音乐_09899_券商深度报告_3份_公开完整PDF'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_华泰证券_云音乐_优质在线音乐社交社区_2022-02-07.pdf',
                  'broker': '华泰证券',
                  'title': '优质在线音乐社交社区',
                  'date': '2022-02-07',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202202071545436594_1.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 20,
                  'broker_terms': ['华泰证券', 'HTSC', 'Huatai'],
              },
              {
                  'filename': '02_东兴证券_云音乐深度系列2_互动功能驱动社区高活跃度_2023-03-06.pdf',
                  'broker': '东兴证券',
                  'title': '深度系列2：互动功能驱动社区高活跃度，音频直播释放社区变现潜力',
                  'date': '2023-03-06',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202303061584056750_1.pdf',
                  'min_bytes': 300_000,
                  'min_pages': 10,
                  'broker_terms': ['东兴证券', 'DONGXING', '东兴'],
              },
              {
                  'filename': '03_民生证券_网易云音乐首次覆盖_原创和社区打造差异化_2024-12-26.pdf',
                  'broker': '民生证券',
                  'title': '原创和社区打造差异化，会员数提升为当下重点',
                  'date': '2024-12-26',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202412271641445193_1.pdf',
                  'min_bytes': 400_000,
                  'min_pages': 12,
                  'broker_terms': ['民生证券', 'MINSHENG', '民生'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download_pdf(doc: dict, dest: Path) -> str:
              urls = [doc['url'], doc['url'] + '?download=1']
              errors = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 240), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          head = tmp.read_bytes()[:8]
                          if size < doc['min_bytes'] or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def extract_text(reader: PdfReader, dest: Path) -> str:
              pages = len(reader.pages)
              indices = list(range(min(15, pages)))
              if pages > 15:
                  indices += list(range(max(0, pages - 3), pages))
              parts = []
              for i in dict.fromkeys(indices):
                  try:
                      parts.append(reader.pages[i].extract_text() or '')
                  except Exception:
                      pass
              text = '\n'.join(parts)
              if len(text.strip()) < 500:
                  txt = dest.with_suffix('.txt')
                  subprocess.run(['pdftotext', '-f', '1', '-l', str(min(15, pages)), str(dest), str(txt)], check=False)
                  if txt.exists():
                      text += '\n' + txt.read_text(encoding='utf-8', errors='ignore')
                      txt.unlink(missing_ok=True)
              return text

          records = []
          seen = set()
          company_terms = ['网易云音乐', '網易雲音樂', '云音乐', '雲音樂', '9899', '09899', 'CLOUD MUSIC']

          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc, dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              text = extract_text(reader, dest)
              low = text.lower()
              if not any(term.lower() in low for term in company_terms):
                  raise RuntimeError(f'company identity not verified in {dest.name}')
              if not any(term.lower() in low for term in doc['broker_terms']):
                  raise RuntimeError(f'broker identity not verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen.add(sha)

              record = {
                  'filename': doc['filename'],
                  'broker': doc['broker'],
                  'title': doc['title'],
                  'publication_date': doc['date'],
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 3:
              raise RuntimeError(f'report count mismatch: {len(records)}')

          readme = [
              '网易云音乐 / 云音乐（09899.HK）券商深度研究报告',
              '整理日期：2026-09-27',
              '',
              '收录标准：公开可直接下载、公司与券商身份可核验、完整PDF、以首次覆盖或专题深度报告为主。',
              '未使用网页摘要、报告预览图、公司公告或招股书补足数量。',
              '',
              '文件清单：',
          ]
          for i, r in enumerate(records, 1):
              readme.extend([
                  f"{i}. {r['broker']}｜{r['title']}",
                  f"   发布日期：{r['publication_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",
                  f"   文件：{r['filename']}",
                  f"   来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ])
          readme.extend([
              '完整性核验：PDF文件头、实际页数、公司身份、券商身份、qpdf结构检查、重复文件检查、逐文件SHA-256及ZIP CRC。',
              '说明：研究报告仅供资料整理与研究参考，不构成任何投资建议。',
          ])

          (out / '00_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'PDF count mismatch in ZIP: {len(pdfs)}')

          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: netease-cloud-music-9899-broker-deep-reports-final
          path: 网易云音乐_09899_券商深度报告_3份_公开完整PDF.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
