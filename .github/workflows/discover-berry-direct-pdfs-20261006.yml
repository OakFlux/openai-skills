name: Discover Berry direct PDF URLs

on:
  pull_request:
    paths:
      - 'tasks/berry-direct-pdf-discovery-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect SGPJBG and NXNY report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls={
            'sg_page':'https://www.sgpjbg.com/baogao/20299.html',
            'sg_down':'https://www.sgpjbg.com/bgdown/20299.html',
            'nx_stock':'https://www.nxny.com/stock/stock_000710/',
          }
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/'})
          out={}
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=(25,120),allow_redirects=True)
              print('PAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path(f'output/{name}.bin').write_bytes(r.content)
              text=r.text if 'text' in (r.headers.get('content-type') or '') or r.content[:1] in (b'<',b'{',b'[') else ''
              soup=BeautifulSoup(text,'html.parser') if text else None
              links=[]
              if soup:
                for tag in soup.find_all(['a','iframe','embed','object','form','script','input','button']):
                  t=' '.join(tag.get_text(' ',strip=True).split())
                  attrs={a:tag.get(a) for a in ('href','src','action','data','value','data-url','data-href','onclick','id','name') if tag.get(a)}
                  blob=t+' '+json.dumps(attrs,ensure_ascii=False)
                  if any(k in blob.lower() for k in ('pdf','download','down','file','attach','20299','贝瑞基因','肿瘤早筛','解码生命经纬','基因测序行业的领头羊')):
                    norm={k:(urljoin(r.url,v) if k in ('href','src','action','data','data-url','data-href') and isinstance(v,str) else v) for k,v in attrs.items()}
                    links.append({'tag':tag.name,'text':t[:500],'attrs':norm})
              raw_urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',text)))
              tokens=sorted(set(re.findall(r'.{0,250}(?:\.pdf|download|bgdown|fileurl|file_url|filepath|attach|肿瘤早筛|解码生命经纬|基因测序行业的领头羊).{0,500}',text,flags=re.I|re.S)))
              out[name]={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'length':len(r.content),'links':links,'raw_urls':raw_urls,'tokens':[re.sub(r'\s+',' ',x)[:1200] for x in tokens[:200]]}
              print('LINKS',name,json.dumps(links,ensure_ascii=False)[:40000],flush=True)
              print('RAWURLS',name,json.dumps(raw_urls,ensure_ascii=False)[:40000],flush=True)
              print('TOKENS',name,json.dumps(out[name]['tokens'],ensure_ascii=False)[:40000],flush=True)
            except Exception as e:
              out[name]={'error':repr(e)};print('ERROR',name,repr(e),flush=True)
          Path('output/discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: berry-direct-pdf-discovery
          path: output/
          retention-days: 7
          if-no-files-found: error
