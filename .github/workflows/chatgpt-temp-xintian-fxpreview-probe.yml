name: chatgpt-temp-xintian-fxpreview-probe
on:
  push:
    branches: [chatgpt-temp-xintian-green-reports-20260906]
    paths: ['.github/workflows/chatgpt-temp-xintian-fxpreview-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query public preview metadata
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          from pathlib import Path
          import requests
          out=Path('preview_meta'); out.mkdir(exist_ok=True)
          base='https://api.fxbaogao.com'
          ids=['4734935','4985754','5360239','5371776']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json, text/plain, */*'})
          for rid in ids:
            cases=[
              ('images','GET',f'/mofoun/report/report/getReportPreviewImages?reportId={rid}',None),
              ('detail','POST','/mofoun/report/searchReport/detail',{'reportId':int(rid)}),
              ('catalog','GET',f'/mofoun/report/searchReport/detail/catalog?reportId={rid}',None),
            ]
            for name,method,path,body in cases:
              try:
                r=s.request(method,base+path,json=body,timeout=45)
                print(rid,name,r.status_code,len(r.content),r.headers.get('content-type'))
                print(r.text[:4000])
                (out/f'{rid}_{name}.txt').write_bytes(r.content)
              except Exception as e: print(rid,name,'ERROR',repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Xintian-Public-Preview-Metadata
          path: preview_meta
          retention-days: 1
          compression-level: 6
