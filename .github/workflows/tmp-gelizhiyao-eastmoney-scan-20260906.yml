name: Temporary Ascletis Eastmoney research scan

on:
  push:
    branches:
      - tmp-gelizhiyao-eastmoney-scan-20260906

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan research records and test PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          from __future__ import annotations
          import io, json, math, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('output'); out.mkdir(exist_ok=True)
          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Origin':'https://data.eastmoney.com',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9',
          })
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2025-03-31','2025-04-03'),
            ('2025-09-05','2025-09-10'),
            ('2025-12-26','2025-12-31'),
            ('2024-08-30','2024-09-05'),
          ]
          words=['歌礼制药','全新GLP-1减重不减肌','口服小分子率先破局','聚焦减重代谢产品差异化管线','创新药研发推进顺利','ASC30','ASC47']
          all_records=[]; matches={}; stats=[]
          for begin,end in windows:
            for qtype in range(0,8):
              page=1; total_pages=1
              while page<=total_pages and page<=50:
                params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':str(qtype),
                  'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),
                  'pageNumber':str(page),'client':'WEB','source':'WEB'
                }
                try:
                  response=session.get(endpoint,params=params,timeout=90)
                  obj=response.json()
                  records=obj.get('data') or obj.get('Data') or obj.get('result') or []
                  if isinstance(records,dict):
                    records=records.get('data') or records.get('list') or records.get('records') or []
                  hits=int(obj.get('hits') or obj.get('total') or 0)
                  total_pages=max(1,math.ceil(hits/100))
                  stats.append({'begin':begin,'end':end,'qtype':qtype,'page':page,'status':response.status_code,'rows':len(records),'hits':hits})
                  print('PAGE',begin,end,qtype,page,'rows',len(records),'hits',hits,flush=True)
                  if not records:
                    break
                  for record in records:
                    record={'window':[begin,end],'qtype':qtype,**record}
                    all_records.append(record)
                    searchable=' '.join(str(record.get(k) or '') for k in ['stockName','stockCode','title','orgSName','researcher','orgName','shortName'])
                    if any(word in searchable for word in words):
                      key=str(record.get('infoCode') or record.get('INFO_CODE') or record.get('id') or len(matches))
                      matches[key]=record
                      print('MATCH',json.dumps({k:record.get(k) for k in ['stockName','stockCode','title','orgSName','publishDate','infoCode','INFO_CODE','attachPages','attachSize','researcher','emRatingName']},ensure_ascii=False),flush=True)
                  page+=1
                  time.sleep(0.08)
                except Exception as exc:
                  stats.append({'begin':begin,'end':end,'qtype':qtype,'page':page,'error':repr(exc)})
                  print('ERR',begin,end,qtype,page,repr(exc),flush=True)
                  break

          pdf_results=[]
          for key,record in matches.items():
            info=str(record.get('infoCode') or record.get('INFO_CODE') or key)
            candidates=[
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time()*1000)}',
              f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf',
            ]
            tests=[]
            for url in candidates:
              try:
                rr=session.get(url,headers={'Referer':f'https://data.eastmoney.com/report/info/{info}.html','Accept':'application/pdf,*/*'},timeout=(20,180),allow_redirects=True)
                data=rr.content
                test={'url':url,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
                if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                  pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                  test['pages']=pages
                  filename=f'{info}_{record.get("orgSName") or "broker"}_{record.get("title") or "report"}.pdf'
                  for ch in '\\/:*?"<>|\r\n': filename=filename.replace(ch,'_')
                  path=out/filename[:220]
                  path.write_bytes(data)
                  test['saved']=path.name
                  print('PDF_OK',info,pages,len(data),path.name,flush=True)
                  tests.append(test)
                  break
                tests.append(test)
                print('PDF_BAD',info,rr.status_code,len(data),rr.headers.get('content-type'),flush=True)
              except Exception as exc:
                tests.append({'url':url,'error':repr(exc)})
                print('PDF_ERR',info,repr(exc),flush=True)
            pdf_results.append({'record':record,'tests':tests})

          (out/'stats.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matches.json').write_text(json.dumps(list(matches.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'pdf_results.json').write_text(json.dumps(pdf_results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT',len(matches),'PDF_RESULT_COUNT',len(pdf_results),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: gelizhiyiao-eastmoney-scan
          path: output/*
          retention-days: 1
          if-no-files-found: error
