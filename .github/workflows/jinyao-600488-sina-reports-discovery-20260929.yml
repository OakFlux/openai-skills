name: Discover Jinyao Pharma reports from Sina archive 20260929

on:
  push:
    paths:
      - '.github/workflows/jinyao-600488-sina-reports-discovery-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch Sina report archive pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          from html import unescape
          from urllib.parse import urljoin

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://finance.sina.com.cn/',
          })

          urls = [
              'https://biz.finance.sina.com.cn/qmx/stockreports.php?symbol=600488',
              'https://biz.finance.sina.com.cn/qmx/stockreports.php?symbol=sh600488',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh600488',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=600488',
          ]
          for url in urls:
              try:
                  r = s.get(url, timeout=60, allow_redirects=True)
                  print('\nURL', url, 'STATUS', r.status_code, 'FINAL', r.url, 'BYTES', len(r.content), 'CTYPE', r.headers.get('content-type'), flush=True)
                  text = r.content.decode(r.apparent_encoding or 'utf-8', errors='replace')
                  print('HEAD', text[:1000].replace('\n',' '), flush=True)
                  for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, re.I|re.S):
                      href = urljoin(r.url, unescape(m.group(1)))
                      title = re.sub(r'<[^>]+>', '', m.group(2))
                      title = unescape(re.sub(r'\s+', ' ', title)).strip()
                      if any(k in title for k in ('天药', '津药', '报告', '研报', '评级', '混改', '激素')) or '600488' in href:
                          print('LINK', title, href, flush=True)
              except Exception as exc:
                  print('ERROR', url, repr(exc), flush=True)
          PY
