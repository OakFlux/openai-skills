name: Package Infotmic 000670 broker deep reports 20261028

on:
  push:
    paths:
      - '.github/workflows/yingfangmicro-000670-broker-deep-package-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          TODAY='2026-10-28'
          CODE='000670'
          COMPANY='盈方微'
          FULL='盈方微电子股份有限公司'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART):
              d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,
              'broker':'光大证券',
              'date':'2014-05-20',
              'title':'凤凰涅磐，芯片设计新秀值得期待',
              'historical_stock_name':'S舜元',
              'source_url':'https://pdf.dfcfw.com/pdf/H3_AP201405210005864088_1.pdf',
              'report_page':'https://data.eastmoney.com/report/info/AP201405210005864088.html',
              'min_pages':12,
              'filename':'01_2014-05-20_光大证券_S舜元盈方微深度_凤凰涅磐_芯片设计新秀值得期待.pdf',
              'broker_tokens':['光大证券','EVERBRIGHT SECURITIES','光大'],
              'identity_tokens':['盈方微','S 舜元','S舜元','000670'],
              'theme_tokens':['IC设计','芯片','移动互联网','处理器','ARM']
            },
            {
              'order':2,
              'broker':'东方证券',
              'date':'2014-07-15',
              'title':'智能硬件处理器的领跑者',
              'historical_stock_name':'S舜元',
              'source_url':'https://pdf.dfcfw.com/pdf/H3_AP201407150006338047_1.pdf',
              'report_page':'https://data.eastmoney.com/report/info/AP201407150006338047.html',
              'min_pages':12,
              'filename':'02_2014-07-15_东方证券_S舜元盈方微首次报告_智能硬件处理器的领跑者.pdf',
              'broker_tokens':['东方证券','ORIENT SECURITIES','东方'],
              'identity_tokens':['盈方微','S 舜元','S舜元','000670'],
              'theme_tokens':['SoC','芯片','智能硬件','处理器','IC设计']
            }
          ]

          search_record={
            'stock_code':CODE,
            'current_stock_name':COMPANY,
            'database_result':'东方财富现行个股研报接口按000670检索为0条；扩大到历史简称和公开PDF后确认2份长篇公司深度报告。',
            'selected_reports':[
              {'date':'2014-05-20','broker':'光大证券','title':'凤凰涅磐，芯片设计新秀值得期待','info_code':'AP201405210005864088','selected':True},
              {'date':'2014-07-15','broker':'东方证券','title':'智能硬件处理器的领跑者','info_code':'AP201407150006338047','selected':True}
            ],
            'excluded_examples':[
              {'date':'2014-07-18','title':'股改顺利完成，芯片设计新秀腾飞在即','reason':'事件跟踪类短篇，未用于替代长篇深度'},
              {'date':'2014-12-26','title':'定增募资23亿，强势打造移动互联网一体化平台','reason':'定增事件点评，未用于补足数量'},
              {'date':'2015-01-29','title':'年报业绩预告低于预期，静待15年新产品发力','reason':'业绩预告点评，未用于补足数量'}
            ]
          }

          session=requests.Session(); session.trust_env=False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept':'application/pdf,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download(item):
              urls=[item['source_url']]
              base=item['source_url']
              for old,new in [('H3_','H2_'),('H3_','H1_'),('H3_','H4_')]:
                  u=base.replace(old,new)
                  if u not in urls:
                      urls.append(u)
              last={}
              for url in urls:
                  for attempt in range(1,7):
                      try:
                          r=session.get(url,headers={
                              'User-Agent':session.headers['User-Agent'],
                              'Referer':item['report_page'],
                              'Accept':'application/pdf,*/*;q=0.8'
                          },timeout=(30,420),allow_redirects=True)
                          last={'requested_url':url,'final_url':str(r.url),'status':r.status_code,
                                'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                          if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                              return r.content,str(r.url),last
                      except Exception as exc:
                          last={'requested_url':url,'error':repr(exc)}
                      time.sleep(attempt)
              raise RuntimeError(f'PDF download failed: {item["title"]}: {last}')

          manifest=[]
          for item in reports:
              data,resolved_url,download_meta=download(item)
              dest=OUT/item['filename']; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages<item['min_pages']:
                  raise RuntimeError(f'Too few pages: {dest.name}={pages}')

              txt=RENDER/f'{item["order"]:02d}_full.txt'
              subprocess.run(['pdftotext',str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              text=txt.read_text(encoding='utf-8',errors='ignore')
              identity_ok=any(x in text for x in item['identity_tokens'])
              broker_ok=any(x in text for x in item['broker_tokens'])
              theme_hits={x:(x in text) for x in item['theme_tokens']}
              theme_ok=sum(theme_hits.values())>=3
              if not identity_ok:
                  raise RuntimeError(f'Company identity check failed: {dest.name}')
              if not broker_ok:
                  raise RuntimeError(f'Broker identity check failed: {dest.name}')
              if not theme_ok:
                  raise RuntimeError(f'Theme relevance check failed: {dest.name}: {theme_hits}')

              q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              if q.returncode!=0:
                  raise RuntimeError(f'qpdf failed: {dest.name}: {q.stdout[-1200:]}')

              first=RENDER/f'{item["order"]:02d}_first'
              last=RENDER/f'{item["order"]:02d}_last'
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
              if not first_png.exists() or first_png.stat().st_size<8_000:
                  raise RuntimeError(f'First-page render failed: {dest.name}')
              if not last_png.exists() or last_png.stat().st_size<3_000:
                  raise RuntimeError(f'Last-page render failed: {dest.name}')

              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  'stock_code':CODE,'current_stock_name':COMPANY,'company_full_name':FULL,
                  'historical_stock_name_in_report':item['historical_stock_name'],
                  'broker':item['broker'],'publish_date':item['date'],'title':item['title'],
                  'pages':pages,'bytes':len(data),'sha256':sha,
                  'source_url':resolved_url,'report_page':item['report_page'],'filename':item['filename'],
                  'identity_check':identity_ok,'broker_check':broker_ok,'business_theme_hits':theme_hits,
                  'validation':['PDF header','company identity','broker identity','business themes','page count','qpdf structure','first-page render','last-page render'],
                  'download_meta':download_meta
              })

          if len(manifest)!=2 or len({m['sha256'] for m in manifest})!=2:
              raise RuntimeError('Report count or duplicate check failed')

          readme=[
              '盈方微（000670.SZ）券商深度报告资料包',
              f'整理日期：{TODAY}','',
              '收录数量：2份，均为公开可完整下载的公司长篇深度研究。',
              '历史名称说明：两份报告发布于上市公司股改和业务重组阶段，证券简称使用“S舜元”，证券代码均为000670；报告正文重点研究拟注入/已进入上市公司的上海盈方微电子芯片设计资产，因此属于盈方微转型阶段的公司深度研究。',
              '现行公开个股研报接口按000670检索为0条；扩大至历史简称后确认以上2份。为保证口径，未用短篇事件点评、公告、独立财务顾问报告、行业报告或网页摘要补足第三份。','',
              '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
              readme += [
                  f'{i}. {m["filename"]}',
                  f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
                  f'   标题：{m["title"]}',
                  f'   报告内证券简称：{m["historical_stock_name_in_report"]}；证券代码：{CODE}',
                  f'   PDF来源：{m["source_url"]}',
                  f'   SHA-256：{m["sha256"]}',''
              ]
          readme += [
              '核验说明：每份PDF均已检查文件头、公司/证券代码、券商身份、业务主题、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
              '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'盈方微历史券商研报检索记录.json').write_text(json.dumps(search_record,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'盈方微_000670_券商深度报告_2份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(OUT.iterdir()):
                  z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
              bad=z.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=2:
                  raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha,flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: yingfangmicro-000670-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
