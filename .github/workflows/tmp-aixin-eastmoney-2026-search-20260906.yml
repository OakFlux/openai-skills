name: Temporary Aixin Eastmoney research search
on:
  push:
    branches:
      - tmp-aixin-eastmoney-2026-search-20260906
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query date ranges and download matches
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf pymupdf
          mkdir -p output
          python - <<'PY'
          import io,json,math,re,time
          from pathlib import Path
          import requests,pymupdf
          from pypdf import PdfReader

          out=Path('output')
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9',
            'Referer':'https://data.eastmoney.com/report/','Origin':'https://data.eastmoney.com'
          })
          api='https://reportapi.eastmoney.com/report/list'
          ranges=[
            ('2026-01-25','2026-02-15'),
            ('2026-04-25','2026-05-10'),
            ('2026-06-07','2026-06-16'),
            ('2026-07-22','2026-08-01'),
            ('2026-08-08','2026-08-18'),
          ]
          wanted={}
          scanned=0
          for begin,end in ranges:
            page=1; total_pages=1
            while page<=total_pages and page<=50:
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),'client':'WEB','source':'WEB'}
              r=s.get(api,params=params,timeout=120); print('API',begin,end,page,r.status_code,len(r.content),flush=True); r.raise_for_status()
              obj=r.json(); batch=obj.get('data') or []
              if isinstance(batch,dict): batch=batch.get('data') or batch.get('list') or batch.get('records') or []
              hits=int(obj.get('hits') or obj.get('total') or 0); total_pages=max(1,math.ceil(hits/100))
              print('ROWS',len(batch),'HITS',hits,'TOTAL_PAGES',total_pages,flush=True)
              if not batch: break
              scanned+=len(batch)
              for rec in batch:
                title=str(rec.get('title') or rec.get('TITLE') or '')
                stock=str(rec.get('stockName') or rec.get('SECURITY_NAME_ABBR') or '')
                code=str(rec.get('stockCode') or rec.get('SECURITY_CODE') or '')
                joined=re.sub(r'\s+','',title+stock+code)
                if ('爱芯元智' in joined or code in {'00600','0600','600.HK','0600.HK','00600.HK'}):
                  info=str(rec.get('infoCode') or rec.get('INFO_CODE') or '')
                  if info:
                    wanted[info]=rec
                    print('TARGET',json.dumps({k:rec.get(k) for k in ['stockName','stockCode','title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName']},ensure_ascii=False),flush=True)
              page+=1; time.sleep(0.1)
          results=[]
          for info,rec in wanted.items():
            url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            try:
              rr=s.get(url,headers={'Referer':f'https://data.eastmoney.com/report/info/{rec.get("stockCode") or "00600"}/{info}.html','Accept':'application/pdf,*/*'},timeout=(20,240),allow_redirects=True)
              data=rr.content
              row={'infoCode':info,'record':rec,'url':url,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
              if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                pages=len(PdfReader(io.BytesIO(data),strict=False).pages); row['pages']=pages
                doc=pymupdf.open(stream=data,filetype='pdf'); text=''.join(doc.load_page(i).get_text('text') for i in range(min(3,len(doc)))); doc.close(); row['opening_text']=text[:6000]
                (out/f'{info}.pdf').write_bytes(data); row['saved']=f'{info}.pdf'
                print('PDF_OK',info,pages,len(data),rec.get('orgSName'),rec.get('title'),flush=True)
              else:
                print('PDF_BAD',info,row,flush=True)
              results.append(row)
            except Exception as exc:
              results.append({'infoCode':info,'record':rec,'url':url,'error':repr(exc)}); print('PDF_ERR',info,repr(exc),flush=True)
          (out/'records.json').write_text(json.dumps(list(wanted.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SCANNED',scanned,'TARGET_COUNT',len(wanted),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-eastmoney-2026-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
