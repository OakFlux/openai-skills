name: Search Sdyanbao for United Laboratories reports 20260922

on:
  push:
    paths:
      - '.github/workflows/sdyanbao-search-united-labs-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Search public API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,itertools
          from pathlib import Path
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report'})
          payloads=[]
          for kw in ['联邦制药','03933','3933.HK']:
            for extra in [
              {'keyword':kw,'page':1,'pageSize':100},
              {'search_key':kw,'page':1,'pageSize':100},
              {'key':kw,'page':1,'pageSize':100},
              {'keyword':kw,'currentPage':1,'pageSize':100},
              {'keyword':kw,'pageNo':1,'pageSize':100},
            ]:payloads.append(extra)
          out=[]
          for p in payloads:
            try:
              r=s.post('https://api.sdyanbao.com/api/file/search',json=p,timeout=(20,90))
              out.append({'payload':p,'status':r.status_code,'headers':dict(r.headers),'body':r.text[:1000000]})
            except Exception as e:out.append({'payload':p,'error':repr(e)})
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-search-united-labs
          path: out
          retention-days: 7
          if-no-files-found: error
