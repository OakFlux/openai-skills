name: Scan Eastmoney military PDFs for Tianwei Electronics 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-eastmoney-related-pdf-scan-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet requests

      - name: Query, download and scan candidate reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/matches work
          python - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import hashlib
          import json
          import re
          import subprocess
          import time
          from pathlib import Path
          from typing import Any
          import requests

          API='https://reportapi.eastmoney.com/report/list'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          session=requests.Session(); session.trust_env=False
          session.headers.update({'User-Agent':UA,'Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})

          all_rows: dict[str, dict[str, Any]]={}
          windows=[('2021-07-01','2022-12-31'),('2023-01-01','2024-12-31'),('2025-01-01','2026-10-12')]
          for begin,end in windows:
            for page in range(1,31):
              params={'industryCode':'1232','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'1','orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=session.get(API,params=params,timeout=(20,90)); r.raise_for_status(); data=r.json()
              rows=data.get('data') or []
              print('INDEX',begin,end,'page',page,'hits',data.get('hits'),'rows',len(rows))
              if not rows: break
              for row in rows:
                code=str(row.get('infoCode') or '')
                if code: all_rows[code]=row
              if len(rows)<100: break
              time.sleep(.05)

          title_terms=['军工','国防','军工电子','业绩','年报','中报','季报','策略','专题','板块','行业','电子','景气','估值','上市公司','复盘','总结','综述']
          def score(row:dict[str,Any])->int:
            title=str(row.get('title') or '')
            pages=int(row.get('attachPages') or 0)
            value=0
            for term in title_terms:
              if term in title: value+=5
            for term in ['业绩总结','业绩综述','年报及','中报业绩','季报总结','估值表','军工电子','上市公司']:
              if term in title: value+=20
            if pages>=15: value+=6
            if pages>=25: value+=5
            if pages>=40: value+=3
            date=str(row.get('publishDate') or '')
            if date[:4] in ('2021','2022','2023','2024'): value+=5
            return value

          candidates=[]
          for code,row in all_rows.items():
            pages=int(row.get('attachPages') or 0)
            title=str(row.get('title') or '')
            if pages<8 or pages>120: continue
            if not any(term in title for term in title_terms): continue
            candidates.append((score(row),code,row))
          candidates.sort(key=lambda x:(x[0],x[2].get('publishDate') or ''),reverse=True)
          candidates=candidates[:260]
          print('CANDIDATES',len(candidates),'INDEX_TOTAL',len(all_rows))
          Path('out/candidates.json').write_text(json.dumps([{'score':sc,**row} for sc,_,row in candidates],ensure_ascii=False,indent=2),encoding='utf-8')

          def scan_one(item):
            sc,code,row=item
            url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'
            pdf=Path('work')/f'{code}.pdf'; txt=Path('work')/f'{code}.txt'
            local=requests.Session(); local.trust_env=False
            try:
              rr=local.get(url,headers={'User-Agent':UA,'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'},timeout=(20,120),allow_redirects=True)
              if rr.status_code!=200 or rr.content[:5]!=b'%PDF-' or len(rr.content)<50_000:
                return None
              pdf.write_bytes(rr.content)
              proc=subprocess.run(['pdftotext','-layout',str(pdf),str(txt)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=90)
              if not txt.exists():
                pdf.unlink(missing_ok=True); return None
              text=txt.read_text(encoding='utf-8',errors='ignore')
              compact=re.sub(r'\s+','',text)
              hits=[]
              for term in ['天微电子','688511','四川天微']:
                if term in compact: hits.append(term)
              if not hits:
                pdf.unlink(missing_ok=True); txt.unlink(missing_ok=True); return None
              snippets=[]
              for term in hits:
                for m in list(re.finditer(re.escape(term),text,re.I))[:3]:
                  snippets.append(re.sub(r'\s+',' ',text[max(0,m.start()-220):m.end()+380]).strip())
              dest=Path('out/matches')/pdf.name
              pdf.replace(dest)
              txt.unlink(missing_ok=True)
              return {
                'score':sc,'infoCode':code,'title':row.get('title'),'orgName':row.get('orgName'),'orgSName':row.get('orgSName'),
                'publishDate':row.get('publishDate'),'researcher':row.get('researcher'),'attachPages':row.get('attachPages'),
                'attachSize':row.get('attachSize'),'industryCode':row.get('industryCode'),'industryName':row.get('industryName'),
                'pdf_url':url,'saved_file':str(dest),'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),
                'matched_terms':hits,'snippets':snippets,
              }
            except Exception as exc:
              pdf.unlink(missing_ok=True); txt.unlink(missing_ok=True)
              return {'error':repr(exc),'infoCode':code,'title':row.get('title'),'score':sc,'_not_match':True}

          matches=[]; errors=[]
          # Process in score order, in moderate parallel batches; stop after six verified matches.
          batch_size=24
          for start in range(0,len(candidates),batch_size):
            batch=candidates[start:start+batch_size]
            with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              results=list(executor.map(scan_one,batch))
            for result in results:
              if not result: continue
              if result.get('_not_match'):
                errors.append(result); continue
              matches.append(result)
              print('MATCH',json.dumps(result,ensure_ascii=False))
            if len(matches)>=6:
              break
          matches.sort(key=lambda x:(int(x.get('attachPages') or 0),x.get('publishDate') or ''),reverse=True)
          Path('out/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/errors.json').write_text(json.dumps(errors[:100],ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_MATCH_COUNT',len(matches))
          print(json.dumps(matches,ensure_ascii=False,indent=2))
          if len(matches)<2:
            raise RuntimeError(f'Only {len(matches)} related reports containing Tianwei were found')
          PY

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-eastmoney-related-pdf-scan
          path: out
          retention-days: 7
          if-no-files-found: error
