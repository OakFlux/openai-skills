name: Scan Yunji report source pages 20260919

on:
  push:
    paths:
      - '.github/workflows/yunji-source-scan-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Scan source HTML and linked assets
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('source-scan'); out.mkdir(exist_ok=True)
          urls={
            '9fzt-guotai':'https://gmg.9fzt.com/report/HKSE/02670/829740237518.html',
            'fx-guotai':'https://www.fxbaogao.com/detail/5357306',
            'fx-xingzheng':'https://www.fxbaogao.com/detail/5312314',
            'fx-ccbi':'https://www.fxbaogao.com/detail/5274246',
            'hangyan-xingzheng':'https://www.hangyan.co/reports/3858889155413018441',
            'nxny-ccbi':'https://www.nxny.com/report/view_6222117.html',
            'hibor-ccbi':'https://www.hibor.com.cn/repinfodetail_4917900.html',
          }
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          summary={}
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              print('PAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              (out/f'{name}.html').write_bytes(r.content)
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data-src','data-url','data-original','content','value'):
                  val=tag.get(attr)
                  if isinstance(val,str) and val.strip():
                    links.append({'tag':tag.name,'attr':attr,'raw':val,'absolute':urljoin(r.url,val)})
              (out/f'{name}-links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
              interesting=[]
              for item in links:
                v=item['absolute'].lower()
                if any(k in v for k in ('.pdf','download','report','file','attachment','oss','api','image')):
                  interesting.append(item)
                  print('LINK',name,json.dumps(item,ensure_ascii=False),flush=True)
              patterns=[r'https?://[^\s\"\'<>]+',r'[^\s\"\'<>]+\.pdf(?:\?[^\s\"\'<>]*)?',r'[^\s\"\'<>]*(?:download|report|file|attachment|api)[^\s\"\'<>]*']
              regex_hits=[]
              for pat in patterns:
                for x in re.findall(pat,text,re.I):
                  if isinstance(x,tuple): x=''.join(x)
                  if x not in regex_hits: regex_hits.append(x)
              for hit in regex_hits[:300]: print('REGEX',name,hit,flush=True)
              for needle in ('829740237518','5357306','5312314','5274246','.pdf','downloadUrl','fileUrl','report-image','reportPath','pdfUrl','docUrl'):
                for m in list(re.finditer(re.escape(needle),text,re.I))[:30]:
                  print('CTX',name,needle,repr(text[max(0,m.start()-350):m.start()+800]),flush=True)
              summary[name]={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'interesting_links':interesting,'regex_hits':regex_hits[:300]}
            except Exception as e:
              print('ERR',name,repr(e),flush=True); summary[name]={'error':repr(e)}
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yunji-source-scan
          path: source-scan
          retention-days: 7
          if-no-files-found: error
