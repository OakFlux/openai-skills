name: Build corrected HFC 301716 filing package

on:
  push:
    branches: [tmp-hfc-301716-filings-20261028]
    paths: ['.github/workflows/tmp-hfc-301716-filings-v2-20261028.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='鸿富诚_301716_招股说明书_上市前审计报告_最新季报'
          mkdir -p "$PACKAGE" /tmp/hfc_v2_check

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, time
          import requests
          from pypdf import PdfReader

          out=Path('鸿富诚_301716_招股说明书_上市前审计报告_最新季报')
          reports=[
            {
              'order':1,
              'filename':'01_鸿富诚_首次公开发行股票并在创业板上市招股说明书_正式发行版_2026-09-22.pdf',
              'kind':'正式招股说明书','period':'首次公开发行并上市',
              'title':'首次公开发行股票并在创业板上市招股说明书',
              'url':'https://static.cninfo.com.cn/finalpage/2026-09-22/1225574817.PDF',
              'expected_pages':408,
            },
            {
              'order':2,
              'filename':'02_鸿富诚_2023-2025年度财务报告及审计报告_上市前财务资料.pdf',
              'kind':'上市前财务报告及审计报告','period':'2023年度至2025年度',
              'title':'2023年度至2025年度财务报告及审计报告',
              'url':'https://reportdocs.static.szse.cn/UpFiles/rasinfodisc1/202605/RAS_202605_211540ECE8AACCF37E418E9B96519ECC553DD8.pdf',
              'expected_pages':159,
            },
            {
              'order':3,
              'filename':'03_鸿富诚_2026年第三季度报告_最新季报.pdf',
              'kind':'最新季报','period':'2026年第三季度',
              'title':'2026年第三季度报告',
              'url':'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-28/12668186.PDF',
              'expected_pages':12,
            },
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'})
          for r in reports:
            last=None
            for attempt in range(8):
              try:
                resp=s.get(r['url'],timeout=(30,360),allow_redirects=True)
                resp.raise_for_status()
                if not resp.content.startswith(b'%PDF-') or len(resp.content)<50000:
                  raise RuntimeError(f'invalid PDF {len(resp.content)} {resp.headers.get("content-type")}')
                p=out/r['filename']; p.write_bytes(resp.content)
                pages=len(PdfReader(str(p),strict=False).pages)
                if pages!=r['expected_pages']:
                  raise RuntimeError(f'expected {r["expected_pages"]} pages, got {pages}')
                r['pages']=pages; r['bytes']=len(resp.content); r['final_url']=resp.url
                print('SAVED',p.name,pages,len(resp.content),resp.url)
                break
              except Exception as exc:
                last=exc; time.sleep(2+attempt)
            else:
              raise RuntimeError(f'Failed {r["title"]}: {last!r}')
          (out/'_metadata.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 50000
            set +e; qpdf --check "$pdf" >"$pdf.check" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.check" >&2; exit "$rc"; fi
            rm -f "$pdf.check"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '深圳市鸿富诚新材料股份有限公司|鸿富诚' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/hfc_v2_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          folder=Path('鸿富诚_301716_招股说明书_上市前审计报告_最新季报')
          rows=json.loads((folder/'_metadata.json').read_text(encoding='utf-8'))
          lines=[
            '深圳市鸿富诚新材料股份有限公司（鸿富诚，301716）',
            '招股说明书、上市前年度财务资料及最新季度报告',
            '整理日期：2026-10-28',
            '',
            '收录说明：',
            '1. 鸿富诚于2026年9月29日在深交所创业板上市，截至2026年10月28日尚未到首次上市公司年度报告披露期，公开年报目录中没有独立年度报告。',
            '2. 为提供完整的年度历史财务资料，本包补充收录深交所公开的2023—2025年度财务报告及审计报告。该文件属于IPO上市前审计资料，不是上市公司年度报告。',
            '3. 招股说明书采用2026年9月22日披露的正式发行版，未使用招股意向书、申报稿、上会稿或注册稿替代。',
            '4. 最新季报为2026年第三季度报告，于2026年10月27日晚披露、公告日期标示为2026年10月28日。',
            '',
            '文件清单：',
          ]
          sums=[]; total_pages=0; total_bytes=0
          for r in sorted(rows,key=lambda x:x['order']):
            p=folder/r['filename']; data=p.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            total_pages+=r['pages']; total_bytes+=len(data)
            lines += [
              f'- {p.name}',
              f"  类型：{r['kind']}；报告期：{r['period']}；页数：{r['pages']}；大小：{len(data)}字节",
              f"  标题：{r['title']}",
              f"  PDF来源：{r['final_url']}",
              f'  SHA-256：{sha}',
            ]
            sums.append(f'{sha}  {p.name}')
          lines += ['',f'合计页数：{total_pages}页。',f'PDF原件合计大小：{total_bytes}字节。','全部PDF均已通过文件头、文件大小、PDF结构、实际页数、正文公司名称及首末页渲染检查。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (folder/'_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: HFC-301716-prospectus-audit-latest-quarter-v2
          path: 鸿富诚_301716_招股说明书_上市前审计报告_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
