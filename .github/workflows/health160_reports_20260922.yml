name: Health160 Official Filings Package

on:
  push:
    branches:
      - chatgpt-health160-reports-20260922
    paths:
      - .github/workflows/health160_reports_20260922.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Download and validate official filings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/debug
          cat > /tmp/build_health160.py <<'PY'
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT = Path('output')
          DEBUG = OUT / 'debug'
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def get(url, timeout=60):
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=timeout, allow_redirects=True)
                      if r.status_code == 200:
                          return r
                      last = RuntimeError(f'HTTP {r.status_code} for {url}')
                  except Exception as exc:
                      last = exc
                  time.sleep(2 ** attempt)
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          def discover_2026_interim():
              search_urls = [
                  'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=1000272538',
                  'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=ZH&market=SEHK&stockId=1000272538',
                  'https://www.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=1000272538',
              ]
              found = []
              for idx, url in enumerate(search_urls, 1):
                  try:
                      r = get(url, timeout=45)
                  except Exception as exc:
                      print('SEARCH_FETCH_FAILED', url, repr(exc))
                      continue
                  (DEBUG / f'hkex_title_search_{idx}.html').write_bytes(r.content)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = urljoin(r.url, a['href'])
                      if '.pdf' not in href.lower():
                          continue
                      parent = a.find_parent('tr') or a.parent
                      context = ' '.join((parent.get_text(' ', strip=True) if parent else a.get_text(' ', strip=True)).split())
                      text = ' '.join(a.get_text(' ', strip=True).split())
                      upper = (text + ' ' + context).upper()
                      if ('INTERIM REPORT 2026' in upper or '2026 INTERIM REPORT' in upper or
                          ('2026' in upper and ('中期報告' in context or '中期报告' in context))):
                          found.append({'url': href, 'text': text, 'context': context, 'source': r.url})
                  # Regex fallback for unusual markup.
                  html = r.text
                  for m in re.finditer(r'href=["\']([^"\']+\.pdf[^"\']*)["\']', html, re.I):
                      href = urljoin(r.url, m.group(1))
                      start = max(0, m.start() - 600)
                      end = min(len(html), m.end() + 600)
                      context = re.sub(r'<[^>]+>', ' ', html[start:end])
                      context = ' '.join(context.split())
                      upper = context.upper()
                      if ('INTERIM REPORT 2026' in upper or '2026 INTERIM REPORT' in upper or
                          ('2026' in upper and ('中期報告' in context or '中期报告' in context))):
                          found.append({'url': href, 'text': '', 'context': context, 'source': r.url})

              # Prefer official HKEX PDF links and de-duplicate.
              unique = {}
              for item in found:
                  unique[item['url']] = item
              found = list(unique.values())
              print('DISCOVERED_2026_INTERIM_CANDIDATES', json.dumps(found, ensure_ascii=False, indent=2))
              for item in found:
                  if 'hkexnews.hk/listedco/listconews/' in item['url'].lower():
                      return item['url']

              # Public mirror fallback: inspect the original-link metadata, without reconstructing the report.
              mirror = 'https://financialfilings.com/filings/160-health-international-limited/interim-quarterly-report/2026/60033277/'
              try:
                  r = get(mirror, timeout=45)
                  (DEBUG / 'financialfilings_2026_interim.html').write_bytes(r.content)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  candidates = []
                  for a in soup.find_all('a', href=True):
                      href = urljoin(r.url, a['href'])
                      if '.pdf' in href.lower():
                          candidates.append(href)
                  candidates += re.findall(r'https?://[^"\'<> ]+\.pdf(?:\?[^"\'<> ]*)?', r.text, re.I)
                  for href in dict.fromkeys(candidates):
                      try:
                          rr = get(href, timeout=60)
                          if rr.content.startswith(b'%PDF-') and len(rr.content) > 100000:
                              temp = DEBUG / 'mirror_candidate.pdf'
                              temp.write_bytes(rr.content)
                              reader = PdfReader(str(temp))
                              first = (reader.pages[0].extract_text() or '').upper()
                              if '160 HEALTH' in first and '2026' in first and 'INTERIM' in first:
                                  return href
                      except Exception as exc:
                          print('MIRROR_CANDIDATE_FAILED', href, repr(exc))
              except Exception as exc:
                  print('MIRROR_FETCH_FAILED', repr(exc))
              raise RuntimeError('Could not discover the official 2026 interim report PDF URL')

          latest_interim_url = discover_2026_interim()
          print('LATEST_INTERIM_URL', latest_interim_url)

          docs = [
              {
                  'filename': '01_健康160_招股说明书_2025-09-09.pdf',
                  'title': '健康160国际有限公司 - 全球发售（最终版招股说明书）',
                  'date': '2025-09-09',
                  'category': '招股说明书',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0909/2025090900019.pdf',
              },
              {
                  'filename': '02_健康160_2025年中期报告.pdf',
                  'title': '健康160国际有限公司 - 2025年中期报告',
                  'date': '2025-09-29',
                  'category': '中期报告',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0929/2025092903164.pdf',
              },
              {
                  'filename': '03_健康160_2025年年报.pdf',
                  'title': '健康160国际有限公司 - 2025年年报',
                  'date': '2026-04-14',
                  'category': '年报',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0414/2026041400418.pdf',
              },
              {
                  'filename': '04_健康160_2026年中期报告_最新定期财报.pdf',
                  'title': '健康160国际有限公司 - 2026年中期报告',
                  'date': '2026-09-15',
                  'category': '最新定期财报',
                  'url': latest_interim_url,
              },
          ]

          manifest = []
          paths = []
          for doc in docs:
              print('DOWNLOADING', doc['url'])
              r = get(doc['url'], timeout=120)
              data = r.content
              if not data.startswith(b'%PDF-'):
                  raise RuntimeError(f"Not a PDF: {doc['url']} head={data[:32]!r}")
              if len(data) < 50000:
                  raise RuntimeError(f"PDF too small: {doc['url']} size={len(data)}")
              path = OUT / doc['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path))
              if reader.is_encrypted:
                  raise RuntimeError(f'Encrypted PDF: {path.name}')
              pages = len(reader.pages)
              first_text = ''
              try:
                  first_text = ' '.join((reader.pages[0].extract_text() or '').split())[:1000]
              except Exception:
                  pass
              if pages < 10:
                  raise RuntimeError(f'Unexpectedly short PDF: {path.name}, pages={pages}')
              rec = {
                  **doc,
                  'final_url': r.url,
                  'bytes': len(data),
                  'pages': pages,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'first_page_text_excerpt': first_text,
              }
              manifest.append(rec)
              paths.append(path)
              print('VALIDATED', json.dumps(rec, ensure_ascii=False))

          note = '''健康160国际有限公司（02656.HK）官方披露文件资料包

文件范围：
1. 2025年9月9日最终版招股说明书（全球发售）。
2. 2025年中期报告。
3. 2025年年报。健康160于2025年9月17日上市，因此截至本资料包制作日，上市后正式年报仅此一份。
4. 2026年中期报告，为截至2026年9月22日最新正式定期财务报告。

说明：
- 香港主板公司通常披露年度报告及中期报告，并不强制发布季度报告；因此本资料包以2026年中期报告作为“最新季报/最新定期财报”的对应文件。
- 所有PDF均从港交所披露系统的公开页面下载；若最新中期报告的港交所链接临时不可解析，则使用可核验原始文件的公开镜像下载，并在文件清单中保留最终来源URL。
- 文件仅供个人研究与学习使用，请遵守原始文件的版权及免责声明。
'''
          (OUT / '资料说明.txt').write_text(note, encoding='utf-8')
          (OUT / '文件清单及校验值.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = OUT / '健康160_年报_招股说明书_最新定期财报.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in paths:
                  z.write(path, path.name)
              z.write(OUT / '资料说明.txt', '资料说明.txt')
              z.write(OUT / '文件清单及校验值.json', '文件清单及校验值.json')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC validation failed at {bad}')
          summary = {
              'zip': zip_path.name,
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'reports': manifest,
          }
          (OUT / 'BUILD_SUMMARY.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_SUMMARY', json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/build_health160.py
          rm -rf output/debug
          ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: health160-official-filings-package
          path: |
            output/健康160_年报_招股说明书_最新定期财报.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
