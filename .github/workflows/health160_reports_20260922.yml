name: Health160 Official Filings Package

on:
  push:
    branches:
      - chatgpt-health160-reports-20260922
    paths:
      - .github/workflows/health160_reports_20260922.yml
      - .github/scripts/build_health160_package.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Download and validate official filings
        run: python .github/scripts/build_health160_package.py

      - name: List package files
        run: ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: health160-official-filings-package
          path: |
            output/健康160_年报_招股说明书_最新定期财报.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
