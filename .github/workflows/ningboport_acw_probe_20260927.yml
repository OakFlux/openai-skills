name: Ningbo Port SSE PDF Probe

on:
  push:
    branches:
      - chatgpt-ningboport-filings-20260927
    paths:
      - .github/workflows/ningboport_acw_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe SSE PDF challenge
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, re, requests
          from urllib.parse import urlsplit

          url='https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-03-31/601018_20210331_2.pdf'
          positions=[15,35,29,24,33,16,1,38,10,9,19,31,40,27,22,23,25,13,6,11,39,18,20,8,14,21,32,26,2,30,7,4,17,5,3,28,34,37,12,36]
          mask='3000176000856006061501533003690027800375'
          s=requests.Session()
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://www.sse.com.cn/disclosure/listedinfo/regular/','Accept-Language':'zh-CN,zh;q=0.9'}
          r=s.get(url,headers=headers,timeout=30,allow_redirects=True)
          print('FIRST',r.status_code,len(r.content),r.url,r.headers.get('content-type'),repr(r.content[:120]))
          print('SETCOOKIE',r.headers.get('set-cookie'))
          m=re.search(r"arg1=['\"]([0-9A-Fa-f]+)['\"]",r.text)
          print('ARG1', bool(m), m.group(1) if m else None)
          if not m: raise SystemExit('no arg1')
          arg1=m.group(1)
          reordered=''.join(arg1[p-1] for p in positions)
          value=''.join(f'{int(reordered[i:i+2],16)^int(mask[i:i+2],16):02x}' for i in range(0,40,2))
          print('COOKIE_VALUE',value)
          host=urlsplit(r.url).hostname
          s.cookies.set('acw_sc__v2',value,domain=host,path='/')
          s.cookies.set('acw_sc__v2',value,domain='.sse.com.cn',path='/')
          print('COOKIEJAR',s.cookies.get_dict())
          for i, target in enumerate([r.url,url,'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-03-31/601018_20210331_2.pdf'],1):
              rr=s.get(target,headers={**headers,'Referer':r.url},timeout=60,allow_redirects=True)
              print('RETRY',i,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),repr(rr.content[:80]),hashlib.sha256(rr.content).hexdigest())
          PY
