name: Inspect Dongbei B 1999 archive metadata

on:
  push:
    paths:
      - '.github/workflows/dongbei-b-inspect-1999-metadata-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect cached discovery log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, requests, re
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; job=122579751663
          r=requests.get(f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},timeout=90,allow_redirects=True)
          print('LOG',r.status_code,len(r.content),r.url); r.raise_for_status(); text=r.content.decode('utf-8-sig',errors='replace')
          rows=[]
          for line in text.splitlines():
            p=line.find('MATCH ')
            if p<0: continue
            try: obj=json.loads(line[p+6:].strip())
            except Exception: continue
            rows.append(obj)
          print('COUNT',len(rows))
          for obj in rows:
            title=str(obj.get('title') or ''); date=str(obj.get('date') or ''); path=str(obj.get('path') or '')
            if any(k in title for k in ('1999','1998','年度报告','年报')) or date.startswith(('1999','2000','2001')):
              print('ROW',json.dumps({'title':title,'date':date,'path':path},ensure_ascii=False))
          PY
