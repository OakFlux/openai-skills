name: Search Eastmoney reports for China Hongqiao by title
on:
  push:
    branches:
      - tmp-chinahongqiao-eastmoney-title-search-20260908
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search public report APIs
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import requests

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          targets=['中国宏桥','高景气+一体化+高分红','全球电解铝龙头','成本企稳+铝行业高景气','产业升级顺势而为']
          attempts=[]
          matches=[]

          def inspect_data(data, tag):
              if not isinstance(data,dict): return
              rows=data.get('data') or data.get('result') or []
              if isinstance(rows,dict): rows=rows.get('data') or rows.get('list') or []
              if not isinstance(rows,list): return
              for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if any(t in blob for t in targets):
                      matches.append({'tag':tag,'row':row})
                      print('MATCH',tag,blob,flush=True)

          # Probe documented and legacy endpoints with likely keyword parameters.
          endpoints=[
            ('GET_list','https://reportapi.eastmoney.com/report/list'),
            ('GET_list2','https://reportapi.eastmoney.com/report/list2'),
          ]
          key_params=['searchText','keyword','title','stockName','name','q','search_text']
          for method,url in endpoints:
              for key in key_params:
                  params={'pageSize':100,'pageNo':1,'pageNum':1,'beginTime':'2024-01-01','endTime':'2026-09-08','qType':0,'code':'*','industryCode':'*',key:'中国宏桥'}
                  try:
                      r=s.get(url,params=params,timeout=30)
                      rec={'tag':f'{method}_{key}','status':r.status_code,'url':r.url,'bytes':len(r.content),'preview':r.text[:1000]}
                      attempts.append(rec)
                      try: inspect_data(r.json(),rec['tag'])
                      except Exception: pass
                  except Exception as e: attempts.append({'tag':f'{method}_{key}','error':repr(e)})

          # POST list2 with likely keyword fields.
          for key in key_params:
              body={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2024-01-01','endTime':'2026-09-08','code':'*','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':'',key:'中国宏桥'}
              try:
                  r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'Content-Type':'application/json'},timeout=30)
                  rec={'tag':f'POST_list2_{key}','status':r.status_code,'url':r.url,'bytes':len(r.content),'preview':r.text[:1000]}
                  attempts.append(rec)
                  try: inspect_data(r.json(),rec['tag'])
                  except Exception: pass
              except Exception as e: attempts.append({'tag':f'POST_list2_{key}','error':repr(e)})

          # Scan all stock reports in the narrow date windows surrounding known reports.
          windows=[('2024-05-01','2024-06-30'),('2025-04-01','2025-06-30'),('2025-08-01','2025-08-31'),('2026-04-01','2026-04-30')]
          for begin,end in windows:
              for page in range(1,201):
                  body={'pageSize':500,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'code':'*','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
                  try:
                      r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'Content-Type':'application/json'},timeout=30)
                      data=r.json()
                      tag=f'scan_{begin}_{end}_{page}'
                      inspect_data(data,tag)
                      rows=data.get('data') if isinstance(data,dict) else None
                      if isinstance(rows,dict): rows=rows.get('data') or rows.get('list')
                      if not rows or (isinstance(rows,list) and len(rows)<500):
                          attempts.append({'tag':tag,'status':r.status_code,'row_count':len(rows) if isinstance(rows,list) else None,'stopped':True,'preview':r.text[:300]})
                          break
                      if page%10==0: print('SCANNED',begin,end,page,flush=True)
                      time.sleep(0.15)
                  except Exception as e:
                      attempts.append({'tag':f'scan_{begin}_{end}_{page}','error':repr(e)})
                      break

          Path('output/attempts.json').write_text(json.dumps(attempts,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL_MATCHES',len(matches),flush=True)
          PY
      - name: Upload search output
        uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-eastmoney-title-search
          path: output/*
          retention-days: 1
