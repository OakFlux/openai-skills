name: Search exact Dagang report titles 20261022

on:
  push:
    branches:
      - tmp/dagang-002077-broker-discovery-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search exact titles and inspect results
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, time
          from urllib.parse import quote_plus, urljoin, unquote
          import requests
          from bs4 import BeautifulSoup

          queries = [
            '"大港股份：封测行业迎机遇，扩充产能求发展"',
            '"封测行业迎机遇，扩充产能求发展"',
            '"大港股份" "李玖" "东北证券"',
            '"瞄准IC产业新趋势，转型独立测试产业，打造行业龙头"',
            '"国企改革优质标的，产业转型打开成长空间" 大港股份',
            '"剥离亏损建材业务，半导体业务稳步增长" 大港股份',
            '"艾科半导体并表扭亏，建材业务拖累业绩" 大港股份',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          def clean(x): return re.sub(r'\s+',' ',x or '').strip()
          for q in queries:
            print('\n##########',q)
            engines=[
              ('bing',f'https://www.bing.com/search?q={quote_plus(q)}&count=100&setlang=zh-hans'),
              ('sogou',f'https://www.sogou.com/web?query={quote_plus(q)}&num=50'),
              ('baidu',f'https://www.baidu.com/s?wd={quote_plus(q)}&rn=50'),
              ('so360',f'https://www.so.com/s?q={quote_plus(q)}&pn=1'),
              ('google',f'https://www.google.com/search?q={quote_plus(q)}&num=50&hl=zh-CN'),
            ]
            for engine,url in engines:
              print('\n===',engine,url)
              try:
                r=s.get(url,timeout=(20,120),allow_redirects=True)
                print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url)
                enc=r.apparent_encoding or r.encoding or 'utf-8'
                text=r.content.decode(enc,errors='replace')
                soup=BeautifulSoup(text,'lxml')
                results=[]
                if engine=='bing':
                  for li in soup.select('li.b_algo'):
                    a=li.select_one('h2 a')
                    if a and a.get('href'):
                      results.append({'title':clean(a.get_text(' ',strip=True)),'url':a['href'],'snippet':clean((li.select_one('.b_caption') or li).get_text(' ',strip=True))[:700]})
                elif engine=='sogou':
                  for h3 in soup.select('h3'):
                    a=h3.find('a',href=True)
                    if a:
                      parent=h3.parent
                      results.append({'title':clean(a.get_text(' ',strip=True)),'url':urljoin(r.url,a['href']),'snippet':clean(parent.get_text(' ',strip=True))[:700]})
                elif engine=='baidu':
                  for div in soup.select('div.result,div.c-container'):
                    a=div.select_one('h3 a')
                    if a and a.get('href'):
                      results.append({'title':clean(a.get_text(' ',strip=True)),'url':a['href'],'snippet':clean(div.get_text(' ',strip=True))[:700]})
                elif engine=='so360':
                  for li in soup.select('li.res-list,li.res-list-v2'):
                    a=li.select_one('h3 a')
                    if a and a.get('href'):
                      results.append({'title':clean(a.get_text(' ',strip=True)),'url':urljoin(r.url,a['href']),'snippet':clean(li.get_text(' ',strip=True))[:700]})
                elif engine=='google':
                  for a in soup.select('a'):
                    h=a.find(['h3'])
                    href=a.get('href','')
                    if h and href.startswith('http'):
                      results.append({'title':clean(h.get_text(' ',strip=True)),'url':href})
                print('RESULTS',json.dumps(results[:80],ensure_ascii=False,indent=2))
              except Exception as exc:
                print('ERROR',repr(exc))
              time.sleep(.2)
          PY
