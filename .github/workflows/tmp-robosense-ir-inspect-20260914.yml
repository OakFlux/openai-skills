name: Inspect RoboSense investor document APIs
on:
  push:
    branches:
      - tmp-robosense-ir-inspect-20260914
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect investor relations page assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          base='https://ir.robosense.ai/?lang=zh-cn'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'})
          r=s.get(base,timeout=30);r.raise_for_status()
          Path('output/index.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'lxml')
          assets=[]
          for tag in soup.find_all(['script','link']):
              value=tag.get('src') or tag.get('href')
              if value:
                  url=urljoin(r.url,value)
                  if '.js' in url or 'api' in url.lower(): assets.append(url)
          records={'index_status':r.status_code,'index_url':r.url,'assets':assets,'matches':[]}
          patterns=re.compile(r'https?://[^"\'<>\s]+|/[A-Za-z0-9_./?=&%-]*(?:api|prospect|report|document|notice|announcement|file|download)[A-Za-z0-9_./?=&%-]*',re.I)
          for i,url in enumerate(assets[:30]):
              try:
                  rr=s.get(url,timeout=30);text=rr.text
                  Path(f'output/asset_{i}.js').write_text(text,encoding='utf-8',errors='ignore')
                  found=sorted(set(m.group(0) for m in patterns.finditer(text)))
                  relevant=[x for x in found if any(k in x.lower() for k in ['api','prospect','report','document','announcement','download','file'])]
                  if relevant:
                      records['matches'].append({'asset':url,'status':rr.status_code,'items':relevant[:300]})
              except Exception as exc:
                  records['matches'].append({'asset':url,'error':repr(exc)})
          Path('output/result.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(records,ensure_ascii=False))
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: robosense-ir-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
