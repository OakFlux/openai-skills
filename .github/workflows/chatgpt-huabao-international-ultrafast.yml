name: Ultra-fast Huabao International report lookup

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-international-ultrafast.yml'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query exact keyword once
        run: |
          mkdir -p result
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          url='https://api.sdyanbao.com/api/file/search'
          body={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':100,'keyword':'华宝国际','pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
          req=urllib.request.Request(url,data=json.dumps(body,ensure_ascii=False).encode('utf-8'),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=20) as r:
              payload=json.loads(r.read().decode('utf-8'))
          except Exception as e:
            print('ERROR',repr(e),flush=True)
            payload={'error':repr(e)}
          Path('result/payload.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          rows=(payload.get('data') or {}).get('files') or [] if isinstance(payload,dict) else []
          out=[]
          for x in rows:
            out.append({'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),'page_url':x.get('page_url'),'share_url':x.get('share_url'),'organization':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),'type':(x.get('type') or {}).get('name'),'stock':x.get('stock'),'data_source':x.get('data_source'),'data_source_uuid':x.get('data_source_uuid')})
          Path('result/compact.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('COMPACT',json.dumps(out,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-ultrafast-results
          path: result/
          retention-days: 3
