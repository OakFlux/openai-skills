name: pharnex-js-probe
on:
  push:
    branches: [chatgpt-temp-pharnex-js-20260905]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public JavaScript and image sequence
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          import os, re, json, io
          from pathlib import Path
          import requests
          from PIL import Image
          out=Path('probe'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://consult.pharnexcloud.com/report/detail/91826.html'})
          urls={
            'report-detail.js':'https://consult.pharnexcloud.com/assets/js/consult/web/report-detail.js',
            'APIConsultConfig.js':'https://consult.pharnexcloud.com/assets/js/consult/web/APIConsultConfig.js',
            'leaflet.js':'https://consult.pharnexcloud.com/assets/js/common/request/leaflet.js',
            'detail.html':'https://consult.pharnexcloud.com/report/detail/91826.html'
          }
          log=[]
          def L(x): print(x); log.append(str(x))
          for fn,u in urls.items():
            try:
              r=s.get(u,timeout=30,allow_redirects=True)
              L(f'{fn}: {r.status_code} {len(r.content)} {r.headers.get("content-type")} {r.url}')
              (out/fn).write_bytes(r.content)
            except Exception as e: L(f'{fn} ERROR {e!r}')
          # Probe all report page images; no auth or hidden endpoint use.
          base='https://oss-personal-public.bcpmdata.com/document/png/935bc7fa3426e20e5cf389649e377bac/{}.png'
          pages=[]
          for i in range(1,45):
            try:
              u=base.format(i); r=s.get(u,timeout=15)
              rec={'page':i,'status':r.status_code,'size':len(r.content),'ctype':r.headers.get('content-type'),'url':r.url}
              if r.status_code==200 and len(r.content)>1000:
                try:
                  im=Image.open(io.BytesIO(r.content)); rec.update({'width':im.width,'height':im.height,'format':im.format})
                  (out/f'page_{i:02d}.{(im.format or "png").lower()}').write_bytes(r.content)
                except Exception as e: rec['decode_error']=repr(e)
              pages.append(rec); L(rec)
            except Exception as e: pages.append({'page':i,'error':repr(e)}); L(f'page {i} ERROR {e!r}')
          (out/'pages.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')
          # Extract strings around download/API from JS.
          hits=[]
          for fn in ['report-detail.js','APIConsultConfig.js','leaflet.js']:
            p=out/fn
            if not p.exists(): continue
            text=p.read_text('utf-8',errors='ignore')
            for m in re.finditer(r'.{0,250}(?:download|report|file|attachment|api|91826).{0,350}',text,re.I|re.S):
              hits.append({'file':fn,'text':m.group(0)[:800]})
          (out/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'run.log').write_text('\n'.join(log),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Pharnex-Public-Report-Probe
          path: probe
          retention-days: 1
