name: Discover Guangyang broker reports

on:
  push:
    branches: [tmp-guangyang-broker-reports-20261028]
    paths: ['.github/workflows/tmp-guangyang-broker-discovery-20261028.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Eastmoney public report index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, requests
          url='https://reportapi.eastmoney.com/report/list'
          params={
            'cb':'datatable4263982','industryCode':'*','pageSize':'500','industry':'*',
            'rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2026-10-28',
            'pageNo':'1','fields':'','qType':'0','orgCode':'','code':'002708','rcode':''
          }
          r=requests.get(url,params=params,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockcode=002708'},timeout=120)
          r.raise_for_status()
          text=r.text.strip()
          m=re.match(r'^[^(]+\((.*)\)\s*;?$',text,re.S)
          payload=json.loads(m.group(1) if m else text)
          rows=payload.get('data') or []
          print('HITS',payload.get('hits'),'ROWS',len(rows))
          rows.sort(key=lambda x:(x.get('attachPages') or 0,x.get('publishDate') or ''),reverse=True)
          for row in rows:
            print('\t'.join([
              str(row.get('publishDate') or '')[:10],
              str(row.get('attachPages') or ''),
              str(row.get('orgSName') or row.get('orgName') or ''),
              str(row.get('infoCode') or ''),
              str(row.get('ratingName') or row.get('emRatingName') or ''),
              str(row.get('title') or ''),
            ]))
          PY
