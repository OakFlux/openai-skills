name: Probe Henghe Precision broker reports

on:
  push:
    paths:
      - '.github/workflows/probe-henghe-broker-reports-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query exact reports and PDF availability
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io, json, requests
          from pypdf import PdfReader

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/'
          })
          params = {
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
              'beginTime':'2017-01-01','endTime':'2030-01-01','pageNo':'1','fields':'','qType':'0',
              'orgCode':'','code':'300539','rcode':'','p':'1','pageNum':'1','pageNumber':'1'
          }
          r = s.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=40)
          print('API', r.status_code, r.url, len(r.content))
          data = r.json()
          print('HITS', data.get('hits'), 'SIZE', data.get('size'))
          records = data.get('data') or []
          for i, rec in enumerate(records, 1):
              print('\nREPORT', i)
              keys = ['publishDate','orgSName','title','researcher','emRatingName','ratingChange','attachPages','attachSize','infoCode','column','reportType']
              print(json.dumps({k:rec.get(k) for k in keys}, ensure_ascii=False))
              info = rec.get('infoCode')
              for tpl in [
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{info}.pdf'
              ]:
                  try:
                      pr = s.get(tpl, timeout=40)
                      ok = pr.status_code == 200 and pr.content.startswith(b'%PDF') and len(pr.content) > 1024
                      pages = None
                      if ok:
                          try: pages = len(PdfReader(io.BytesIO(pr.content)).pages)
                          except Exception as e: pages = f'ERR:{e!r}'
                      print('PDF', tpl, 'status', pr.status_code, 'len', len(pr.content), 'type', pr.headers.get('content-type'), 'ok', ok, 'pages', pages)
                      if ok: break
                  except Exception as e:
                      print('PDF_ERROR', tpl, repr(e))
          PY
