name: Probe Henghe Precision broker reports

on:
  push:
    paths:
      - '.github/workflows/probe-henghe-broker-reports-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect report page scripts and request schema
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/'
          })
          page_url = 'https://data.eastmoney.com/report/300539.html'
          r = s.get(page_url, timeout=40)
          print('PAGE', r.status_code, len(r.content), r.url)
          text = r.text
          for pat in ['reportapi', 'encodeUrl', '300539', '优质精密', 'AP202', 'qType', 'stockCode']:
              print('PAGE_PATTERN', pat, 'count', text.count(pat))
              for m in list(re.finditer(re.escape(pat), text, re.I))[:5]:
                  print('PAGE_SNIP', pat, text[max(0,m.start()-300):m.start()+600].replace('\n',' ')[:900])
          soup = BeautifulSoup(text, 'html.parser')
          scripts=[]
          for tag in soup.find_all('script'):
              src=tag.get('src')
              if src:
                  scripts.append(urljoin(page_url, src))
              else:
                  body=tag.get_text('\n', strip=False)
                  if any(x.lower() in body.lower() for x in ['reportapi','encodeurl','300539','qtype']):
                      print('INLINE_SCRIPT\n', body[:12000])
          print('SCRIPTS', len(scripts))
          for u in scripts:
              print('SCRIPT_URL', u)
          for u in scripts:
              try:
                  rr=s.get(u, timeout=40)
                  body=rr.text
                  hits=[p for p in ['reportapi','report/list','encodeUrl','qType','stockCode','rcode','pageNo','attachPages'] if p.lower() in body.lower()]
                  if hits:
                      print('\n=== SCRIPT_MATCH', u, rr.status_code, len(rr.content), hits, '===')
                      for pat in hits:
                          for m in list(re.finditer(re.escape(pat), body, re.I))[:8]:
                              print('SNIP', pat, body[max(0,m.start()-500):m.start()+1000].replace('\n',' ')[:1500])
              except Exception as e:
                  print('SCRIPT_ERROR', u, repr(e))
          PY
