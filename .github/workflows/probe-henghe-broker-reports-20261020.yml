name: Probe Henghe Precision broker reports

on:
  push:
    paths:
      - '.github/workflows/probe-henghe-broker-reports-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan public report corpus by date
        shell: bash
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time
          import requests

          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/'
          })
          windows=[
              ('2017-05-20','2017-05-24'),
              ('2023-06-18','2023-06-22'),
              ('2023-10-24','2023-10-28'),
              ('2024-03-06','2024-03-10'),
              ('2025-05-18','2025-05-22'),
              ('2025-08-31','2025-09-04'),
              ('2025-09-04','2025-09-08'),
              ('2025-10-08','2025-10-12'),
              ('2025-12-25','2025-12-30'),
              ('2026-05-08','2026-05-13'),
          ]
          found=[]
          for begin,end in windows:
              print('\nWINDOW',begin,end)
              for page in range(1,21):
                  params={
                      'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0',
                      'orgCode':'','code':'*','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
                  }
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=40)
                  d=r.json(); rows=d.get('data') or []
                  if page==1:
                      print('HITS',d.get('hits'),'TOTALPAGE',d.get('TotalPage'),'SIZE',d.get('size'),'URL',r.url)
                  if not rows: break
                  for rec in rows:
                      blob=' '.join(str(rec.get(k) or '') for k in ['stockCode','stockName','title'])
                      if '300539' in blob or '横河精密' in blob or '横河模具' in blob:
                          item={k:rec.get(k) for k in rec.keys()}
                          found.append(item)
                          print('FOUND',json.dumps(item,ensure_ascii=False))
                  total_pages=int(d.get('TotalPage') or 1)
                  if page>=total_pages: break
                  time.sleep(0.3)
          print('\nFOUND_COUNT',len(found))
          seen=set()
          for rec in found:
              key=rec.get('infoCode')
              if key in seen: continue
              seen.add(key)
              print('UNIQUE',json.dumps({
                  k:rec.get(k) for k in ['infoCode','stockCode','stockName','publishDate','orgSName','orgName','title','researcher','attachPages','attachSize','emRatingName','ratingChange','encodeUrl']
              },ensure_ascii=False))
          PY
