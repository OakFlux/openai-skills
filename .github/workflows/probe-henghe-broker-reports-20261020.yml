name: Probe Henghe Precision broker reports

on:
  push:
    paths:
      - '.github/workflows/probe-henghe-broker-reports-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe public report APIs
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re, time
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept': '*/*',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml?encodeUrl=vd11J+XAIrwl+rnaCtIRxg=='
          })

          urls = [
              ('eastmoney_reportapi', 'https://reportapi.eastmoney.com/report/list?pageSize=100&beginTime=2016-01-01&endTime=2026-10-20&stockCode=300539&pageNo=1&fields=&qType=0&orgCode=&author='),
              ('eastmoney_reportapi_jsonp', 'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&beginTime=2016-01-01&endTime=2026-10-20&stockCode=300539&pageNo=1&fields=&qType=0&orgCode=&author=&_=' + str(int(time.time()*1000))),
              ('sina_company_research', 'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=300539&t1=all'),
              ('eastmoney_stock_page', 'https://data.eastmoney.com/report/300539.html'),
          ]

          for name, url in urls:
              try:
                  r = s.get(url, timeout=30, allow_redirects=True)
                  print('\n===', name, '===')
                  print('status', r.status_code, 'type', r.headers.get('content-type'), 'len', len(r.content), 'final', r.url)
                  txt = r.text
                  print(txt[:12000])
              except Exception as e:
                  print('\n===', name, 'ERROR ===', repr(e))

          # Bing HTML query to discover indexed report pages/PDFs.
          for q in [
              '横河精密 300539 研报 PDF',
              '横河精密 首次覆盖 券商',
              '300539 公司深度 报告',
              'site:pdf.dfcfw.com 300539',
              'site:reportapi.eastmoney.com 300539'
          ]:
              try:
                  r = s.get('https://www.bing.com/search', params={'q': q, 'count': '20'}, timeout=30)
                  print('\n=== BING', q, '===', r.status_code, len(r.content))
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.select('li.b_algo h2 a')[:20]:
                      print(a.get_text(' ', strip=True), '\t', a.get('href'))
              except Exception as e:
                  print('BING ERROR', q, repr(e))
          PY
