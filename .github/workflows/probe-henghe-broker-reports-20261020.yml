name: Probe Henghe Precision broker reports

on:
  push:
    paths:
      - '.github/workflows/probe-henghe-broker-reports-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public report pages and links
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          })
          pages=[
              ('nxny_deep','https://www.nxny.com/report/view_5327845.html'),
              ('nxny_ne_2025','https://www.nxny.com/report/view_6073192.html'),
              ('nxny_zs_2025dec','https://www.nxny.com/report/view_6183963.html'),
              ('nxny_zs_2026may','https://www.nxny.com/report/view_6290105.html'),
              ('nxny_haitong_2017','https://www.nxny.com/report/view_3531979.html'),
              ('hibor_ne_2025','https://www.hibor.com.cn/repinfodetail_4445932.html'),
              ('ninef_deep','https://www.9fzt.com/detail/sz_300539_10_740567795901.html'),
              ('ninef_2025oct','https://www.9fzt.com/detail/sz_300539_10_813458614844.html'),
              ('sgpjbg_topic','https://www.sgpjbg.com/zhuanti/xinnengyuanjiegoujianbaogao.html'),
          ]
          key_patterns=['.pdf','download','down','fileurl','file_url','pdfurl','pdf_url','attachment','attach','encrypt','preview','original','reportid','docid','5327845','4445932','740567795901']
          for name,url in pages:
              print('\n\n===== PAGE',name,url,'=====')
              try:
                  r=s.get(url,timeout=45,allow_redirects=True)
                  print('STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'FINAL',r.url)
                  text=r.text
                  print('TITLE',BeautifulSoup(text,'html.parser').title.get_text(' ',strip=True) if BeautifulSoup(text,'html.parser').title else '')
                  for pat in key_patterns:
                      cnt=text.lower().count(pat.lower())
                      if cnt:
                          print('PATTERN',pat,'COUNT',cnt)
                          for m in list(re.finditer(re.escape(pat),text,re.I))[:6]:
                              print('SNIP',pat,text[max(0,m.start()-400):m.start()+900].replace('\n',' ')[:1300])
                  soup=BeautifulSoup(text,'html.parser')
                  print('LINKS')
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a['href'])
                      label=a.get_text(' ',strip=True)
                      if any(k in (href+' '+label).lower() for k in ['pdf','down','download','原文','报告','预览','附件']):
                          print(json.dumps({'text':label,'href':href},ensure_ascii=False))
                  print('FORMS')
                  for f in soup.find_all('form'):
                      print(json.dumps({'action':urljoin(r.url,f.get('action','')),'method':f.get('method'),'html':str(f)[:1500]},ensure_ascii=False))
                  scripts=[]
                  for sc in soup.find_all('script'):
                      if sc.get('src'):
                          scripts.append(urljoin(r.url,sc['src']))
                      else:
                          body=sc.get_text('\n',strip=False)
                          if any(k.lower() in body.lower() for k in key_patterns):
                              print('INLINE_SCRIPT',body[:12000])
                  print('SCRIPT_URLS',len(scripts))
                  for su in scripts:
                      if any(k in su.lower() for k in ['report','down','pdf','detail','view','common','main','app']):
                          print('SCRIPT',su)
                  # inspect relevant external scripts
                  for su in scripts[:40]:
                      try:
                          sr=s.get(su,timeout=30)
                          body=sr.text
                          hits=[k for k in key_patterns if k.lower() in body.lower()]
                          if hits:
                              print('\nSCRIPT_MATCH',su,'STATUS',sr.status_code,'LEN',len(sr.content),'HITS',hits)
                              for pat in hits[:8]:
                                  for m in list(re.finditer(re.escape(pat),body,re.I))[:4]:
                                      print('SCRIPT_SNIP',pat,body[max(0,m.start()-400):m.start()+1000].replace('\n',' ')[:1400])
                      except Exception as e:
                          print('SCRIPT_ERR',su,repr(e))
              except Exception as e:
                  print('PAGE_ERROR',repr(e))
          PY
