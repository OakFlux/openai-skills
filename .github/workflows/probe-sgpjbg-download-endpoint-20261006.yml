name: Probe SGPJBG report download endpoint

on:
  pull_request:
    paths:
      - 'tasks/probe-sgpjbg-download-endpoint-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe direct download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          ids=['887730','20299','4277']
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':'https://www.sgpjbg.com/'})
          result={}
          for bid in ids:
            variants=[
              f'https://www.sgpjbg.com/download.aspx?id={bid}',
              f'https://m.sgpjbg.com/download.aspx?id={bid}',
              f'https://www.sgpjbg.com/sgpjbg/download.aspx?id={bid}',
              f'https://www.sgpjbg.com/download.aspx?bid={bid}',
            ]
            probes=[]
            for j,url in enumerate(variants):
              try:
                r=s.get(url,timeout=(25,240),allow_redirects=True)
                rec={'url':url,'status':r.status_code,'final_url':r.url,'redirects':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in r.history],'content_type':r.headers.get('content-type'),'content_disposition':r.headers.get('content-disposition'),'length':len(r.content),'head':repr(r.content[:50])}
                if r.status_code==200 and r.content.startswith(b'%PDF') and len(r.content)>70000:
                  p=Path(f'output/{bid}_{j}.pdf');p.write_bytes(r.content);rec['pages']=len(PdfReader(str(p),strict=False).pages)
                else:
                  Path(f'output/{bid}_{j}.bin').write_bytes(r.content)
                probes.append(rec);print('PROBE',bid,json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e:
                rec={'url':url,'error':repr(e)};probes.append(rec);print('ERROR',bid,json.dumps(rec,ensure_ascii=False),flush=True)
            result[bid]=probes
          Path('output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sgpjbg-download-endpoint-probe
          path: output/
          retention-days: 7
          if-no-files-found: error
