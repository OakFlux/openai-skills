name: Temporary Aixin Fx image probe
on:
  push:
    branches:
      - tmp-aixin-fx-image-probe-20260906
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe sequential report images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests Pillow img2pdf pypdf
          mkdir -p output
          python - <<'PY'
          import hashlib
          import io
          import json
          import time
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          reports = {
              '5605896': {'date_path': '2026/08/15', 'label': '国盛证券_中报超预期边缘AI智能车驱动未来成长'},
              '5472548': {'date_path': '2026/06/11', 'label': '国泰海通证券_首次覆盖_AI终端平台公司智能汽车打开增量空间'},
              '5601555': {'date_path': '2026/08/13', 'label': '中邮证券_业绩全面高增新业务加速放量'},
              '5252285': {'date_path': '2026/02/02', 'label': '国投证券香港_新股点评'},
              '5248517': {'date_path': '2026/01/30', 'label': '国元国际_新股申购指南'},
              '5248522': {'date_path': '2026/01/30', 'label': '中国光大证券国际_新股预览'},
          }
          root = Path('output')
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer': 'https://www.fxbaogao.com/',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9',
          })
          summary = {}

          for report_id, meta in reports.items():
              report_dir = root / report_id
              report_dir.mkdir(exist_ok=True)
              valid = []
              failures = []
              seen_hashes = set()
              consecutive_missing = 0
              highest_valid = 0

              for page_no in range(1, 81):
                  url = f"https://public.fxbaogao.com/report-image/{meta['date_path']}/{report_id}-{page_no}.png"
                  try:
                      response = session.get(url, timeout=(15, 60), allow_redirects=True)
                      data = response.content
                      if response.status_code != 200:
                          raise RuntimeError(f'HTTP {response.status_code}')
                      image = Image.open(io.BytesIO(data))
                      image.load()
                      if image.width < 500 or image.height < 650:
                          raise RuntimeError(f'small image {image.width}x{image.height}, bytes={len(data)}')
                      digest = hashlib.sha256(data).hexdigest()
                      if digest in seen_hashes:
                          raise RuntimeError('duplicate image hash')
                      seen_hashes.add(digest)
                      target = report_dir / f'{page_no:03d}.png'
                      target.write_bytes(data)
                      valid.append({
                          'page': page_no,
                          'url': response.url,
                          'bytes': len(data),
                          'width': image.width,
                          'height': image.height,
                          'sha256': digest,
                      })
                      highest_valid = page_no
                      consecutive_missing = 0
                      print('VALID', report_id, page_no, image.width, image.height, len(data), response.url, flush=True)
                  except Exception as exc:
                      failures.append({'page': page_no, 'url': url, 'error': str(exc)})
                      consecutive_missing += 1
                      print('MISS', report_id, page_no, str(exc), flush=True)
                      if page_no > 2 and consecutive_missing >= 5:
                          break
                  time.sleep(0.05)

              contiguous = 0
              valid_pages = {row['page'] for row in valid}
              for page_no in range(1, highest_valid + 1):
                  if page_no in valid_pages:
                      contiguous = page_no
                  else:
                      break

              pdf_info = None
              if contiguous >= 2:
                  paths = [report_dir / f'{page_no:03d}.png' for page_no in range(1, contiguous + 1)]
                  pdf_path = root / f"{report_id}_{meta['label']}_{contiguous}页.pdf"
                  pdf_path.write_bytes(img2pdf.convert([str(path) for path in paths]))
                  pdf_bytes = pdf_path.read_bytes()
                  parsed_pages = len(PdfReader(io.BytesIO(pdf_bytes), strict=False).pages)
                  pdf_info = {
                      'path': pdf_path.name,
                      'pages': parsed_pages,
                      'bytes': len(pdf_bytes),
                      'sha256': hashlib.sha256(pdf_bytes).hexdigest(),
                  }
                  print('PDF', report_id, parsed_pages, len(pdf_bytes), pdf_path.name, flush=True)

              summary[report_id] = {
                  **meta,
                  'valid_count': len(valid),
                  'highest_valid': highest_valid,
                  'contiguous_count': contiguous,
                  'valid': valid,
                  'failures': failures,
                  'pdf': pdf_info,
              }

          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({key: {k: value[k] for k in ['valid_count','highest_valid','contiguous_count','pdf']} for key, value in summary.items()}, ensure_ascii=False, indent=2), flush=True)
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: aixin-fx-image-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
