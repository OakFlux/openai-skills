name: ZJLD Broker Report Final Package

on:
  push:
    branches:
      - chatgpt-zjld-broker-20260922
    paths:
      - .github/workflows/zjld_broker_final_package.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow pypdf

      - name: Download public preview pages and build PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cat > /tmp/build_zjld_broker.py <<'PY'
          import hashlib, io, json, re, time, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageOps
          from pypdf import PdfReader

          OUT=Path('output')
          session=requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports=[
            {
              'id':'177723','institution':'天风证券','date':'2024-10-14',
              'title':'三级引擎齐发力，珍酒李渡成长可期',
              'expected_total_pages':28,
              'filename':'01_天风证券_珍酒李渡_三级引擎齐发力成长可期_2024-10-14_公开预览15页.pdf',
            },
            {
              'id':'144022','institution':'华西证券','date':'2023-10-24',
              'title':'多赛道布局，老品牌开创酱酒新格局',
              'expected_total_pages':62,
              'filename':'02_华西证券_珍酒李渡_多赛道布局老品牌开创酱酒新格局_2023-10-24_公开预览15页.pdf',
            },
            {
              'id':'128486','institution':'海通国际','date':'2023-06-06',
              'title':'首次覆盖：珍酒与李渡双品牌驱动收入增长，多香型赛道市占率提升',
              'expected_total_pages':24,
              'filename':'03_海通国际_珍酒李渡_双品牌驱动收入增长_2023-06-06_公开预览15页.pdf',
            },
          ]

          def get(url, referer=None, timeout=60):
              headers={'Referer':referer} if referer else {}
              last=None
              for attempt in range(4):
                  try:
                      r=session.get(url,headers=headers,timeout=timeout,allow_redirects=True)
                      if r.status_code==200:
                          return r
                      last=RuntimeError(f'HTTP {r.status_code}: {url}')
                  except Exception as e:
                      last=e
                  time.sleep(2**attempt)
              raise RuntimeError(f'Fetch failed: {url}: {last}')

          manifest=[]
          pdf_paths=[]
          for spec in reports:
              rid=spec['id']
              detail=f'https://www.sgpjbg.com/baogao/{rid}.html'
              r=get(detail,timeout=45)
              html=r.text
              soup=BeautifulSoup(html,'html.parser')
              dp_el=soup.find('input',id='dp')
              if not dp_el or not dp_el.get('value'):
                  raise RuntimeError(f'Missing public reader page prefix for report {rid}')
              prefix=dp_el['value']
              def read_int(name):
                  m=re.search(rf'var\s+{re.escape(name)}\s*=\s*(?:parseInt\(["\']?)?([0-9]+)',html,re.I)
                  return int(m.group(1)) if m else None
              preview_pages=read_int('mtp')
              total_pages=read_int('fCount')
              force_free=read_int('ForceFreepage')
              if preview_pages!=15 or force_free!=15:
                  raise RuntimeError(f'Unexpected public preview range for {rid}: mtp={preview_pages}, ForceFreepage={force_free}')
              if total_pages!=spec['expected_total_pages']:
                  raise RuntimeError(f'Unexpected original page count for {rid}: {total_pages}')

              page_dir=OUT/f'pages_{rid}'
              page_dir.mkdir(parents=True,exist_ok=True)
              images=[]; page_records=[]
              for page_no in range(1,preview_pages+1):
                  # This range exactly matches the source site's stated public preview limit.
                  url=f'{prefix}{page_no}.gif'
                  rr=get(url,referer=detail,timeout=60)
                  data=rr.content
                  try:
                      im=Image.open(io.BytesIO(data))
                      im.load()
                  except Exception as e:
                      raise RuntimeError(f'Invalid public preview image for {rid} page {page_no}: {e}')
                  if im.width<600 or im.height<400:
                      raise RuntimeError(f'Unexpected image dimensions for {rid} page {page_no}: {im.size}')
                  rgba=im.convert('RGBA')
                  bg=Image.new('RGBA',rgba.size,(255,255,255,255))
                  bg.alpha_composite(rgba)
                  rgb=bg.convert('RGB')
                  jpg_path=page_dir/f'{page_no:03d}.jpg'
                  rgb.save(jpg_path,'JPEG',quality=95,optimize=True)
                  images.append(rgb.copy())
                  page_records.append({
                      'page':page_no,'url':url,'source_bytes':len(data),
                      'width':im.width,'height':im.height,
                      'source_sha256':hashlib.sha256(data).hexdigest(),
                  })
                  im.close(); rgba.close(); bg.close(); rgb.close()
              pdf_path=OUT/spec['filename']
              images[0].save(pdf_path,'PDF',resolution=150.0,save_all=True,append_images=images[1:])
              for im in images: im.close()
              reader=PdfReader(str(pdf_path))
              if reader.is_encrypted or len(reader.pages)!=preview_pages:
                  raise RuntimeError(f'PDF validation failed for {rid}: pages={len(reader.pages)}, encrypted={reader.is_encrypted}')
              rec={
                  **spec,
                  'source_detail_page':detail,
                  'public_preview_pages':preview_pages,
                  'original_report_pages':total_pages,
                  'page_prefix':prefix,
                  'pdf_pages':len(reader.pages),
                  'pdf_bytes':pdf_path.stat().st_size,
                  'pdf_sha256':hashlib.sha256(pdf_path.read_bytes()).hexdigest(),
                  'page_records':page_records,
                  'completeness':'公开预览版：收录平台公开在线阅读范围内的第1-15页；未包含账户权限限制后的剩余页面。',
              }
              manifest.append(rec); pdf_paths.append(pdf_path)
              print('VALIDATED',json.dumps({k:rec[k] for k in ['id','institution','title','public_preview_pages','original_report_pages','pdf_bytes','pdf_sha256']},ensure_ascii=False))

          note='''珍酒李渡（06979.HK）券商深度报告资料包 - 公开预览版

本资料包包含：
1. 天风证券：《三级引擎齐发力，珍酒李渡成长可期》，2024-10-14，原报告28页，收录公开预览第1-15页。
2. 华西证券：《多赛道布局，老品牌开创酱酒新格局》，2023-10-24，原报告62页，收录公开预览第1-15页。
3. 海通国际：《首次覆盖：珍酒与李渡双品牌驱动收入增长，多香型赛道市占率提升》，2023-06-06，原报告24页，收录公开预览第1-15页。

完整性说明：
- 三份原始报告的完整下载均要求来源平台账户权限；本资料包只收录来源平台明确公开展示的前15页。
- PDF由公开在线阅读页的原始逐页图像按原顺序合成，未改写、补写、裁剪或重排报告正文。
- 未请求或抓取公开预览范围以外的页面，未绕过登录、会员或付费限制。
- 文件仅供个人研究与学习使用，请遵守原报告版权及免责声明。
'''
          (OUT/'资料说明.txt').write_text(note,encoding='utf-8')
          (OUT/'文件清单及校验值.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          zip_path=OUT/'珍酒李渡_券商深度报告_公开预览版_3份.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in pdf_paths:
                  z.write(p,p.name)
              z.write(OUT/'资料说明.txt','资料说明.txt')
              z.write(OUT/'文件清单及校验值.json','文件清单及校验值.json')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip()
              if bad: raise RuntimeError(f'ZIP CRC failed at {bad}')
          summary={
              'zip':zip_path.name,'zip_bytes':zip_path.stat().st_size,
              'zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'reports':[{k:r[k] for k in ['id','institution','title','date','public_preview_pages','original_report_pages','pdf_bytes','pdf_sha256']} for r in manifest]
          }
          (OUT/'BUILD_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_SUMMARY',json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/build_zjld_broker.py
          rm -rf output/pages_*
          ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: zjld-broker-report-package
          path: |
            output/珍酒李渡_券商深度报告_公开预览版_3份.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
