name: ZJLD Broker Report Final Package

on:
  push:
    branches:
      - chatgpt-zjld-broker-20260922
    paths:
      - .github/workflows/zjld_broker_final_package.yml
      - scripts/build_zjld_broker_package.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow pypdf

      - name: Build verified public-preview package
        run: python scripts/build_zjld_broker_package.py

      - name: Remove temporary page images
        run: rm -rf output/pages_*

      - name: List package files
        run: ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: zjld-broker-report-package
          path: |
            output/珍酒李渡_券商深度报告_公开预览版_3份.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
