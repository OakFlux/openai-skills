name: Search open web for Henghe report PDFs

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-open-web-pdf-search-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Search public indexes and test candidates
        run: |
          python - <<'PY'
          import html,json,re,requests,time
          from bs4 import BeautifulSoup
          from urllib.parse import quote,urljoin,urlparse,parse_qs,unquote

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          queries=[
            '"优质精密制造企业，新能源汽车结构件打开成长空间" pdf',
            '"横河精密深度报告" pdf',
            '"扩产进入汽车产业，公司发展空间进一步扩大" pdf',
            '"国内优质的塑料制品与精密模具制造商" pdf',
            '"横河模具" "海通证券" pdf',
            '"横河精密" "浙商证券" filetype:pdf',
            '300539 券商深度报告 pdf',
          ]
          engines=[
            ('bing','https://www.bing.com/search?q={q}&count=50'),
            ('baidu','https://www.baidu.com/s?wd={q}&rn=50'),
            ('sogou','https://www.sogou.com/web?query={q}&num=50'),
            ('360','https://www.so.com/s?q={q}&pn=1'),
          ]
          candidates=[]
          for q in queries:
            for name,tpl in engines:
              url=tpl.format(q=quote(q))
              try:
                r=s.get(url,timeout=40,allow_redirects=True); print('\nSEARCH',name,q,r.status_code,len(r.content),r.url)
                if r.status_code!=200: continue
                r.encoding=r.apparent_encoding or r.encoding; soup=BeautifulSoup(r.text,'html.parser')
                for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(r.url,a['href'])
                  # Decode common redirect parameters.
                  p=parse_qs(urlparse(href).query)
                  for key in ('url','u','target','rurl'):
                    if key in p and p[key]: href=unquote(p[key][0])
                  raw=(label+' '+href).lower()
                  if any(k in raw for k in ['横河','300539','740567795901','548839599653','524851845385','pdf','研报','报告']):
                    print('RESULT',json.dumps({'engine':name,'q':q,'label':label[:500],'href':href},ensure_ascii=False)); candidates.append(href)
              except Exception as e: print('SEARCH_ERROR',name,q,repr(e))
              time.sleep(.2)

          # Add common mirror URL patterns discovered from known metadata.
          candidates += [
            'https://pdf.dfcfw.com/pdf/H3_AP202306201591351755_1.pdf',
            'https://pdf.dfcfw.com/pdf/H3_740567795901_1.pdf',
            'https://pdf.dfcfw.com/pdf/H3_548839599653_1.pdf',
            'https://pdf.dfcfw.com/pdf/H3_524851845385_1.pdf',
          ]
          tested=set()
          for u in candidates:
            if not u.startswith('http') or u in tested: continue
            tested.add(u)
            try:
              r=s.get(u,timeout=60,allow_redirects=True,stream=True,headers={'Referer':'https://www.baidu.com/','Range':'bytes=0-1048575'})
              data=b''
              for chunk in r.iter_content(65536):
                data+=chunk
                if len(data)>=1048576: break
              print('TEST',json.dumps({'url':u,'final':r.url,'status':r.status_code,'ctype':r.headers.get('content-type'),'length':r.headers.get('content-length'),'head':data[:20].hex(),'read':len(data)},ensure_ascii=False))
              if data.startswith(b'%PDF'): print('PDF_FOUND',u,r.url,r.headers.get('content-length'))
            except Exception as e: print('TEST_ERROR',u,repr(e))
          PY
