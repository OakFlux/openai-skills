name: Cirrus Alternative Sources

on:
  push:
    branches:
      - chatgpt-cirrus-fast-20260915
    paths:
      - .github/workflows/cirrus_alt_sources.yml

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml pillow

      - name: Inspect public alternative sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pages out/scripts out/assets
          cat > /tmp/alt_sources.py <<'PY'
          import json,re,hashlib,io
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          OUT=Path('out'); PAGES=OUT/'pages'; SCRIPTS=OUT/'scripts'; ASSETS=OUT/'assets'
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls={
            'reportify_haitong':'https://reportify.cn/reports/1135715571418140672',
            'yanbaoke_haitong':'https://www.yanbaoke.com/info/bztSXGcCqwYPRiku3yYYsJ',
            'vzkoo_zheshang':'https://www.vzkoo.com/document/202508208ffbbc2730955b6f322a3cbe.html',
            'sdy_huachuang':'https://www.sdyanbao.com/detail/872732',
            'sdy_zheshang':'https://www.sdyanbao.com/detail/909900',
            'book118_haitong':'https://max.book118.com/html/2025/0701/8032110001007105.shtm',
            'fx_guotai':'https://www.fxbaogao.com/detail/5278059',
          }
          result={}
          candidate_urls=[]
          def add_candidate(source,u,base):
            if not isinstance(u,str) or not u.strip(): return
            u=u.strip().replace('\\/','/')
            if u.startswith('//'): u='https:'+u
            if u.startswith(('http://','https://','/','./','../')):
              full=urljoin(base,u)
              if (source,full) not in candidate_urls: candidate_urls.append((source,full))
          for name,url in urls.items():
            rec={'url':url}
            try:
              r=S.get(url,timeout=45,allow_redirects=True); rec.update({'status':r.status_code,'final':r.url,'bytes':len(r.content),'ct':r.headers.get('content-type','')})
              PAGES.joinpath(name+'.html').write_bytes(r.content)
              text=r.text; soup=BeautifulSoup(text,'lxml')
              rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              rec['links']=[]; rec['contexts']=[]; rec['next_data']=None
              for tag in soup.find_all(True):
                for attr in ['href','src','data-src','data-original','data-url','data-file','data-pdf','data-download','content','value','poster']:
                  v=tag.get(attr)
                  if isinstance(v,str):
                    full=urljoin(r.url,v)
                    if any(k in (v+' '+full+' '+tag.get_text(' ',strip=True)).lower() for k in ['pdf','download','file','report','document','preview','page','image','oss','cos','cdn','api','1135715571418140672','872732','909900','bztSXGcCqwYPRiku3yYYsJ']):
                      rec['links'].append({'tag':tag.name,'attr':attr,'value':v,'absolute':full,'text':tag.get_text(' ',strip=True)[:400]}); add_candidate(name,v,r.url)
              # Save inline JSON structures.
              for sc in soup.find_all('script'):
                sid=sc.get('id',''); typ=sc.get('type',''); body=sc.string or sc.get_text() or ''
                if sid=='__NEXT_DATA__' or 'application/json' in typ or any(k in body for k in ['1135715571418140672','872732','909900','pdfUrl','downloadUrl','fileUrl']):
                  f=SCRIPTS/f'{name}_inline_{len(list(SCRIPTS.glob(name+"_inline_*"))):03d}.txt'; f.write_text(body,encoding='utf-8',errors='ignore')
                  if sid=='__NEXT_DATA__': rec['next_data']=body[:200000]
              for pat in ['pdf','download','fileUrl','pdfUrl','downloadUrl','sourceUrl','oss','cos','cdn','api','preview','pageList','pages','__NEXT_DATA__','1135715571418140672','872732','909900','bztSXGcCqwYPRiku3yYYsJ']:
                for m in list(re.finditer(pat,text,re.I))[:100]: rec['contexts'].append({'pattern':pat,'context':text[max(0,m.start()-1000):m.end()+1800]})
              # Extract URL-like strings in all HTML/JSON.
              for m in re.finditer(r'''(?P<q>["'])(?P<u>(?:https?:)?//[^"']+|/[^"']+)(?P=q)''',text):
                u=m.group('u')
                if any(k in u.lower() for k in ['pdf','download','file','report','document','preview','image','oss','cos','cdn','api']): add_candidate(name,u,r.url)
              # Fetch scripts and search URL strings.
              script_urls=[]
              for sc in soup.find_all('script',src=True):
                su=urljoin(r.url,sc['src'])
                if su not in script_urls: script_urls.append(su)
              rec['scripts']=[]
              for i,su in enumerate(script_urls[:60]):
                try:
                  rr=S.get(su,timeout=35,headers={'Referer':r.url}); data=rr.content
                  sm={'url':su,'status':rr.status_code,'bytes':len(data),'ct':rr.headers.get('content-type','')}; rec['scripts'].append(sm)
                  if rr.status_code==200 and len(data)<8_000_000:
                    st=rr.text; sf=SCRIPTS/f'{name}_{i:03d}_{re.sub(r"[^A-Za-z0-9._-]+","_",urlparse(su).path.rsplit("/",1)[-1] or "script")}' ; sf.write_text(st,encoding='utf-8',errors='ignore')
                    for m in re.finditer(r'''(?P<q>["'])(?P<u>(?:https?:)?//[^"']+|/[^"']+)(?P=q)''',st):
                      u=m.group('u')
                      if any(k in u.lower() for k in ['pdf','download','file','report','document','preview','image','oss','cos','cdn','api']): add_candidate(name,u,su)
                except Exception as e: rec['scripts'].append({'url':su,'error':repr(e)})
            except Exception as e: rec['error']=repr(e)
            result[name]=rec; print('PAGE',name,json.dumps({k:v for k,v in rec.items() if k not in ['links','contexts','next_data','scripts']},ensure_ascii=False))

          # Fetch likely public assets; do not submit credentials or bypass access controls.
          seen=set(); assets=[]
          for idx,(src,u) in enumerate(candidate_urls):
            if u in seen or len(u)>2000: continue
            seen.add(u)
            low=u.lower()
            if not any(k in low for k in ['.pdf','.png','.jpg','.jpeg','.webp','.gif','download','preview','document','report-image','file']): continue
            try:
              rr=S.get(u,timeout=30,allow_redirects=True,headers={'Referer':urls.get(src,'')}); data=rr.content; ct=rr.headers.get('content-type','').lower()
              rec={'source':src,'url':u,'final':rr.url,'status':rr.status_code,'bytes':len(data),'ct':ct,'head':data[:24].hex(),'sha256':hashlib.sha256(data).hexdigest()}
              valid=rr.status_code==200 and len(data)>5000
              if valid:
                ext='.bin'
                if data.startswith(b'%PDF-'): ext='.pdf'
                elif data.startswith(b'\x89PNG'): ext='.png'
                elif data[:3]==b'\xff\xd8\xff': ext='.jpg'
                elif data.startswith((b'GIF87a',b'GIF89a')): ext='.gif'
                elif data.startswith(b'RIFF') and b'WEBP' in data[:16]: ext='.webp'
                elif 'html' in ct or data.lstrip().startswith(b'<'): ext='.html'
                path=ASSETS/f'{idx:04d}_{src}{ext}'; path.write_bytes(data); rec['file']=path.name
                if ext in ['.png','.jpg','.gif','.webp']:
                  try:
                    im=Image.open(io.BytesIO(data)); rec.update({'width':im.width,'height':im.height,'format':im.format,'frames':getattr(im,'n_frames',1)})
                  except Exception as e: rec['image_error']=repr(e)
              assets.append(rec); print('ASSET',json.dumps(rec,ensure_ascii=False))
            except Exception as e: assets.append({'source':src,'url':u,'error':repr(e)})
            if len(seen)>=300: break
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'candidate_urls.json').write_text(json.dumps([{'source':s,'url':u} for s,u in candidate_urls],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'assets.json').write_text(json.dumps(assets,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY candidates',len(candidate_urls),'assets',len(assets))
          PY
          python /tmp/alt_sources.py
          find out -type f -printf '%p\t%s bytes\n' | sort > out/inventory.txt

      - name: Upload alternative source inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirrus-alternative-sources
          path: out
          retention-days: 1
