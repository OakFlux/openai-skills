name: Temporary Huaheng Biotech broker report collection

on:
  push:
    branches:
      - tmp/huaheng-biotech-broker-reports-20260830
    paths:
      - .github/workflows/tmp-huaheng-biotech-broker-reports.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF Pillow
      - name: Discover, download, validate, and package reports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw

          CODE = '688639'
          COMPANY = '华恒生物'
          FULL_NAME = '安徽华恒生物科技股份有限公司'

          OUT = Path('huaheng_reports')
          PDFDIR = OUT / 'pdfs'
          RENDERDIR = OUT / 'renders'
          for path in (OUT, PDFDIR, RENDERDIR):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })
          sd = requests.Session()
          sd.headers.update({
              'User-Agent': session.headers['User-Agent'],
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/',
          })

          logs: list[str] = []
          candidates: list[dict] = []
          downloaded: list[dict] = []
          hashes: set[str] = set()
          render_entries: list[tuple[str, Path]] = []

          def note(*parts):
              line = ' '.join(str(part) for part in parts)
              print(line, flush=True)
              logs.append(line)

          def clean(value: object, limit: int = 100) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n]+', '_', str(value or '')).strip(' ._')
              return (text or 'report')[:limit]

          def norm(value: object) -> str:
              return re.sub(r'[\W_]+', '', str(value or ''), flags=re.UNICODE).lower()

          def company_match(value: object) -> bool:
              text = re.sub(r'\s+', '', str(value or ''))
              return COMPANY in text or CODE in text or FULL_NAME in text

          preferred = [
              ('全球丙氨酸龙头持续突破新品助成长', 1300),
              ('平台型合成生物龙头构筑氨基酸维生素新材料三重成长曲线', 1250),
              ('合成生物学领军企业生物基产品布局打开新空间', 1200),
              ('平台型合成生物学龙头扩充氨基酸维生素新材料产品矩阵', 1100),
              ('全球丙氨酸龙头产品矩阵扩张打开成长天花板', 1050),
          ]

          def score(item: dict) -> float:
              title = str(item.get('title') or '')
              title_norm = norm(title)
              pages = int(item.get('pages_meta') or 0)
              value = pages * 2.5
              for key, points in preferred:
                  if key in title_norm:
                      value += points
                      break
              if any(key in title for key in ['深度报告', '深度研究', '公司深度', '深度分析']):
                  value += 260
              if any(key in title for key in ['首次覆盖', '首次评级', '首次推荐']):
                  value += 220
              if any(key in title for key in ['平台型', '合成生物', '丙氨酸龙头', '产品矩阵', '成长曲线']):
                  value += 75
              if any(key in title for key in ['点评', '季报', '年报', '中报', '业绩快报', '事件点评', '跟踪报告']):
                  value -= 220
              try:
                  year = int(str(item.get('date') or '')[:4])
                  value += max(0, year - 2021) * 8
              except Exception:
                  pass
              return value

          def add_candidate(item: dict):
              title = str(item.get('title') or '')
              identity_blob = ' '.join([
                  title,
                  str(item.get('stockCode') or ''),
                  str(item.get('stockName') or ''),
                  json.dumps(item.get('stock') or {}, ensure_ascii=False),
              ])
              if not company_match(identity_blob):
                  return
              if any(word in title for word in ['年度报告', '半年度报告', '季度报告', '招股说明书', '调研纪要', '会议纪要', '摘要']):
                  return
              if any(word in title for word in ['行业周报', '行业研究', '策略报告', '周报']):
                  return
              pages = int(item.get('pages_meta') or 0)
              if pages and pages < 15:
                  return
              code = str(item.get('code') or '')
              if not code.startswith('AP'):
                  return
              key = (code, norm(title))
              if any(existing['_key'] == key for existing in candidates):
                  return
              item['_key'] = key
              item['_score'] = score(item)
              candidates.append(item)
              note('CANDIDATE', json.dumps(item, ensure_ascii=False))

          # Primary source: Eastmoney's public stock-report catalogue.
          endpoint = 'https://reportapi.eastmoney.com/report/list2'
          windows = [
              ('2021-01-01', '2022-12-31'),
              ('2023-01-01', '2024-12-31'),
              ('2025-01-01', '2026-08-30'),
          ]
          for begin, end in windows:
              for page in range(1, 6):
                  body = {
                      'beginTime': begin,
                      'endTime': end,
                      'industryCode': '*',
                      'ratingChange': '*',
                      'rating': '*',
                      'orgCode': '*',
                      'code': CODE,
                      'rcode': '',
                      'pageSize': 100,
                      'pageNo': page,
                      'p': page,
                      'pageNum': page,
                      'pageNumber': page,
                      'qType': 0,
                  }
                  try:
                      response = session.post(
                          endpoint,
                          json=body,
                          timeout=45,
                          headers={
                              'Content-Type': 'application/json',
                              'Origin': 'https://data.eastmoney.com',
                              'Referer': 'https://data.eastmoney.com/report/stock.jshtml',
                          },
                      )
                      result = response.json()
                      rows = result.get('data') or []
                      total_pages = int(result.get('TotalPage') or result.get('totalPage') or 1)
                      note('EM_SEARCH', begin, end, page, response.status_code, len(rows), total_pages)
                  except Exception as exc:
                      note('EM_SEARCH_ERROR', begin, end, page, repr(exc))
                      break
                  for row in rows:
                      add_candidate({
                          'source': 'eastmoney',
                          'title': row.get('title') or '',
                          'org': row.get('orgSName') or row.get('orgName') or '',
                          'date': str(row.get('publishDate') or '')[:10],
                          'pages_meta': row.get('attachPages'),
                          'code': row.get('infoCode'),
                          'stockCode': row.get('stockCode') or row.get('code'),
                          'stockName': row.get('stockName') or row.get('name'),
                      })
                  if page >= total_pages or not rows:
                      break
                  time.sleep(0.2)

          # Secondary catalogue: exact-title searches fill any gaps and verify metadata.
          queries = [
              COMPANY,
              CODE,
              '华恒生物 全球丙氨酸龙头 持续突破新品',
              '华恒生物 平台型合成生物龙头 三重成长曲线',
              '华恒生物 合成生物学领军企业 生物基产品布局',
          ]
          for query in queries:
              for page in range(1, 3):
                  try:
                      response = sd.post(
                          'https://api.sdyanbao.com/api/file/search',
                          json={'page': page, 'pageSize': 100, 'keyword': query},
                          timeout=45,
                      )
                      rows = (response.json().get('data') or {}).get('files') or []
                      note('SD_SEARCH', query, page, len(rows))
                  except Exception as exc:
                      note('SD_SEARCH_ERROR', query, page, repr(exc))
                      break
                  for row in rows:
                      if not company_match((row.get('name') or '') + ' ' + json.dumps(row, ensure_ascii=False)):
                          continue
                      detail = {}
                      try:
                          payload = sd.post(
                              'https://api.sdyanbao.com/api/file/detail',
                              json={'id': row.get('id')},
                              timeout=45,
                          ).json()
                          if payload.get('status') == 1:
                              detail = payload.get('data') or {}
                      except Exception as exc:
                          note('SD_DETAIL_ERROR', row.get('id'), repr(exc))
                      add_candidate({
                          'source': 'sdyanbao',
                          'title': detail.get('name') or row.get('name') or '',
                          'org': ((detail.get('organization') or {}).get('name')
                                  or (row.get('organization') or {}).get('name')
                                  or ''),
                          'date': str(detail.get('time_text') or row.get('time_text') or '')[:10],
                          'pages_meta': detail.get('page_count') or row.get('page_count'),
                          'code': detail.get('data_source_uuid') or row.get('data_source_uuid'),
                          'stock': detail.get('stock') or row.get('stock'),
                      })
                  if len(rows) < 100:
                      break

          candidates.sort(key=lambda item: (item['_score'], str(item.get('date') or ''), int(item.get('pages_meta') or 0)), reverse=True)
          (OUT / 'candidates.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2), encoding='utf-8')
          note('CANDIDATE_COUNT', len(candidates))

          for meta in candidates:
              if len(downloaded) >= 12:
                  break
              code = str(meta.get('code') or '')
              data = None
              source_url = None
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{int(time.time() * 1000)}.pdf=',
              ]
              for url in urls:
                  try:
                      response = session.get(
                          url,
                          timeout=90,
                          allow_redirects=True,
                          headers={'Referer': 'https://data.eastmoney.com/', 'Accept': 'application/pdf,*/*;q=0.8'},
                      )
                      note('PDF_GET', response.status_code, len(response.content), response.headers.get('content-type'), response.url)
                      if response.status_code == 200 and len(response.content) > 50_000 and response.content.lstrip().startswith(b'%PDF'):
                          data = response.content
                          source_url = response.url
                          break
                  except Exception as exc:
                      note('PDF_GET_ERROR', url, repr(exc))
              if data is None:
                  continue

              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  continue
              temp = PDFDIR / f'_tmp_{digest[:12]}.pdf'
              temp.write_bytes(data)
              try:
                  doc = pymupdf.open(str(temp))
                  pages = doc.page_count
                  if pages < 15:
                      raise ValueError(f'only {pages} pages')
                  sample = sorted(set([0, 1, min(5, pages - 1), min(10, pages - 1), pages // 2, pages - 1]))
                  text = '\n'.join(doc.load_page(index).get_text('text') for index in sample)
                  if not company_match(text):
                      raise ValueError('company identity not found')
                  encrypted = bool(doc.is_encrypted)
                  stem = clean(meta['title'], 52)
                  for label, index in [('first', 0), ('middle', pages // 2), ('last', pages - 1)]:
                      pix = doc.load_page(index).get_pixmap(matrix=pymupdf.Matrix(0.75, 0.75), alpha=False)
                      render_path = RENDERDIR / f'{stem}_{label}.png'
                      pix.save(str(render_path))
                      render_entries.append((f'{stem}-{label}', render_path))
                  doc.close()
              except Exception as exc:
                  note('VALIDATION_ERROR', meta['title'], repr(exc))
                  temp.unlink(missing_ok=True)
                  continue

              hashes.add(digest)
              filename = f"{meta['date']}_{clean(meta['org'], 30)}_{clean(meta['title'], 90)}_{pages}页_原始PDF.pdf"
              final = PDFDIR / filename
              final.unlink(missing_ok=True)
              temp.rename(final)
              downloaded.append({
                  'file': filename,
                  'title': meta['title'],
                  'org': meta['org'],
                  'date': meta['date'],
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'encrypted': encrypted,
                  'source_url': source_url,
                  'score': meta['_score'],
                  'code': code,
              })
              note('SAVED', filename)

          unique: list[dict] = []
          seen_titles: set[str] = set()
          for item in sorted(downloaded, key=lambda x: (x['score'], x['date'], x['pages']), reverse=True):
              key = norm(item['title'])
              if key in seen_titles:
                  continue
              seen_titles.add(key)
              unique.append(item)

          selected: list[dict] = []
          used_orgs: set[str] = set()
          for item in unique:
              if len(selected) >= 3:
                  break
              if item['org'] in used_orgs:
                  continue
              selected.append(item)
              used_orgs.add(item['org'])
          if len(selected) < 3:
              for item in unique:
                  if item not in selected:
                      selected.append(item)
                  if len(selected) >= 3:
                      break
          selected = selected[:3]
          if len(selected) < 2:
              raise RuntimeError(f'Only {len(selected)} complete reports obtained')

          keep = {item['file'] for item in selected}
          for path in PDFDIR.glob('*.pdf'):
              if path.name not in keep:
                  path.unlink()

          # Contact sheet for visual QA.
          thumbnails = []
          selected_stems = {clean(item['title'], 52) for item in selected}
          for label, image_path in render_entries:
              if not any(label.startswith(stem) for stem in selected_stems):
                  continue
              if not image_path.exists():
                  continue
              with Image.open(image_path) as image:
                  image = image.convert('RGB')
                  image.thumbnail((280, 365))
                  canvas = Image.new('RGB', (300, 405), 'white')
                  canvas.paste(image, ((300 - image.width) // 2, 10))
                  ImageDraw.Draw(canvas).text((8, 382), label[:48], fill='black')
                  thumbnails.append(canvas)
          if thumbnails:
              columns = 3
              rows = (len(thumbnails) + columns - 1) // columns
              sheet = Image.new('RGB', (columns * 300, rows * 405), 'white')
              for index, thumbnail in enumerate(thumbnails):
                  sheet.paste(thumbnail, ((index % columns) * 300, (index // columns) * 405))
              sheet.save(OUT / 'contact_sheet.jpg', quality=88)

          (OUT / 'selected_reports.json').write_text(json.dumps(selected, ensure_ascii=False, indent=2), encoding='utf-8')
          readme = [
              '华恒生物（688639.SH）券商深度报告下载包',
              '',
              f'完整原始PDF数量：{len(selected)}份',
              f'合计页数：{sum(item["pages"] for item in selected)}页',
              '',
          ]
          for index, item in enumerate(selected, 1):
              readme.append(f"{index}. {item['date']}｜{item['org']}｜{item['title']}｜{item['pages']}页")
          readme += [
              '',
              '优先收录以华恒生物为主要研究主体的公司深度、首次覆盖或系统性公司研究；未使用行业周报、短篇财报点评、网页摘要或缺页预览。',
              '已核验PDF文件头、公司名称及证券代码、实际页数和加密状态，并检查首页、中间页与末页；ZIP完整性测试通过。',
              '版权归原发布机构及作者所有，仅供研究参考。',
          ]
          (OUT / 'README.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(f"{item['sha256']}  {item['file']}" for item in selected) + '\n', encoding='utf-8')
          (OUT / 'download_log.txt').write_text('\n'.join(logs), encoding='utf-8')

          zip_path = OUT / 'huaheng_biotech_broker_reports.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(PDFDIR.glob('*.pdf')):
                  archive.write(path, path.name)
              for name in ['README.txt', 'selected_reports.json', 'SHA256SUMS.txt']:
                  archive.write(OUT / name, name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != len(selected):
                  raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs, expected {len(selected)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (OUT / 'ZIP_SHA256.txt').write_text(f'{zip_sha}  {zip_path.name}\n', encoding='utf-8')
          print((OUT / 'README.txt').read_text(encoding='utf-8'), flush=True)
          print('FINAL_ZIP', zip_path.stat().st_size, zip_sha, flush=True)
          PY
      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: huaheng-biotech-broker-reports
          path: huaheng_reports/
          retention-days: 3
          if-no-files-found: error
