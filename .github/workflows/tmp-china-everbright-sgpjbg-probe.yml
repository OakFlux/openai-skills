name: Temporary China Everbright SGPJBG probe

on:
  push:
    branches:
      - tmp/china-everbright-sgpjbg-probe-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Find report detail and file URLs
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.parse,requests
          from bs4 import BeautifulSoup
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/'})
          starts=[
            'https://www.sgpjbg.com/zhuanti/beikeguangdabaogao.html',
            'https://www.sgpjbg.com/search?keyword='+urllib.parse.quote('中国光大控股'),
            'https://www.sgpjbg.com/search/'+urllib.parse.quote('中国光大控股'),
          ]
          targets=['资负共振','中国光大控股（0165.HK）','跨境资管标的','持续深耕硬科技','壮大资管']
          links=[]
          for u in starts:
            try:
              r=s.get(u,timeout=60); r.encoding=r.apparent_encoding or r.encoding or 'utf-8'; html=r.text
              print('\nPAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              for t in targets:
                pos=html.find(t)
                print('TARGET',t,'POS',pos,flush=True)
                if pos>=0: print('AROUND',html[max(0,pos-3000):pos+5000],flush=True)
              soup=BeautifulSoup(html,'lxml')
              for a in soup.find_all('a',href=True):
                text=(a.get_text(' ',strip=True)+' '+str(a.get('title') or ''))
                href=urllib.parse.urljoin(r.url,a['href'])
                if any(t in text for t in targets) or ('中国光大控股' in text):
                  print('MATCH_A',repr(text),href,str(a)[:5000],flush=True)
                  if href not in links: links.append(href)
              for m in re.finditer(r'(?:href|url|src)\s*[:=]\s*["\']([^"\']+)["\']',html,re.I):
                href=urllib.parse.urljoin(r.url,m.group(1))
                if any(x in href for x in ['/baogao/','/bgdown/','pdf','download']) and href not in links: links.append(href)
            except Exception as e: print('PAGE_ERR',u,repr(e),flush=True)
          print('LINKS',json.dumps(links,ensure_ascii=False,indent=2),flush=True)

          for u in links[:80]:
            try:
              r=s.get(u,timeout=60); r.encoding=r.apparent_encoding or r.encoding or 'utf-8'; html=r.text
              if not any(t in html for t in targets) and '中国光大控股' not in html: continue
              print('\nDETAIL',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              soup=BeautifulSoup(html,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for t in targets:
                pos=html.find(t)
                if pos>=0: print('DETAIL_AROUND',t,html[max(0,pos-2500):pos+5000],flush=True)
              for tag in soup.find_all(True):
                attrs=json.dumps(dict(tag.attrs),ensure_ascii=False)
                blob=(tag.get_text(' ',strip=True)+' '+attrs).lower()
                if any(k in blob for k in ['下载pdf','立即下载','bgdown','download','pdfurl','fileurl','file_url','.pdf','预览']):
                  print('TAG',tag.name,repr(tag.get_text(' ',strip=True)[:300]),attrs,str(tag)[:4000],flush=True)
              for patt in [
                r'https?://[^"\'<> ]+\.pdf(?:\?[^"\'<> ]*)?',
                r'["\']([^"\']*(?:download|bgdown|pdf|file)[^"\']*)["\']',
                r'(?:pdfUrl|fileUrl|downloadUrl|sourceUrl|file_path|filepath)\s*[:=]\s*["\']([^"\']+)["\']',
              ]:
                vals=re.findall(patt,html,re.I)
                print('PATTERN',patt,json.dumps(vals[:200],ensure_ascii=False),flush=True)
            except Exception as e: print('DETAIL_ERR',u,repr(e),flush=True)
          PY