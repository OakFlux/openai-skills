name: Search Sdyanbao Tianwei Electronics reports 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-electronics-sdyanbao-search-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Search report index and details
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          from typing import Any
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def post(url:str,payload:dict[str,Any]):
            last=None
            for n in range(7):
              try:
                r=s.post(url,json=payload,timeout=(20,120))
                last={'status':r.status_code,'text':r.text[:500]}
                if r.status_code==200: return r.json()
              except Exception as e: last={'error':repr(e)}
              time.sleep(1+n)
            raise RuntimeError((url,last))

          def records(obj):
            out=[]
            def walk(x):
              if isinstance(x,dict):
                if isinstance(x.get('id'),int) and isinstance(x.get('name'),str): out.append(x)
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(obj)
            return list({x['id']:x for x in out}.values())

          queries=['天微电子','688511','天微电子 深度','天微电子 首次覆盖','军用灭火防爆系统龙头']
          raw={}; allrec={}
          for q in queries:
            payload={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
            try:
              data=post('https://api.sdyanbao.com/api/file/search',payload)
              raw[q]=data
              for r in records(data): allrec[r['id']]=r
            except Exception as e:
              raw[q]={'error':repr(e)}
          details=[]
          for r in allrec.values():
            try:
              d=post('https://api.sdyanbao.com/api/file/detail',{'id':int(r['id'])})
              data=d.get('data') if isinstance(d,dict) else None
              details.append({'record':r,'detail':data,'raw_detail':d if not isinstance(data,dict) else None})
            except Exception as e:
              details.append({'record':r,'error':repr(e)})
            time.sleep(.08)
          Path('out/search_raw.json').write_text(json.dumps(raw,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          summary=[]
          for x in details:
            r=x.get('record') or {}; d=x.get('detail') or {}
            summary.append({'id':r.get('id'),'name':r.get('name'),'time_text':r.get('time_text'),'type':(r.get('type') or {}).get('name') if isinstance(r.get('type'),dict) else r.get('type'),'page_count':d.get('page_count') or r.get('page_count'),'page_url':d.get('page_url'),'data_source':d.get('data_source'),'publish_time':d.get('publish_time'),'file_size':d.get('file_size')})
          summary.sort(key=lambda x:(x.get('page_count') or 0,x.get('id') or 0),reverse=True)
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianwei-electronics-sdyanbao-search
          path: out
          retention-days: 7
          if-no-files-found: error
