name: Probe CR BMT report metadata
on:
  push:
    branches: [tmp-cr-bmt-report-probe-20260906]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query public Eastmoney report API
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import requests
          api = 'https://reportapi.eastmoney.com/report/list'
          headers = {'User-Agent': 'Mozilla/5.0', 'Referer': 'https://data.eastmoney.com/'}
          for code in ['01313', '1313', 'HK01313']:
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*', 'beginTime': '2010-01-01',
                  'endTime': '2030-01-01', 'pageNo': '1', 'qType': '0',
                  'orgCode': '', 'code': code, 'rcode': '', 'p': '1',
                  'pageNum': '1', 'pageNumber': '1'
              }
              response = requests.get(api, params=params, headers=headers, timeout=60)
              print('CODE', code, 'STATUS', response.status_code, 'SIZE', len(response.content))
              payload = response.json()
              print('HITS', payload.get('hits'))
              for item in payload.get('data', []):
                  print(json.dumps({
                      'publishDate': item.get('publishDate'),
                      'stockName': item.get('stockName'),
                      'stockCode': item.get('stockCode'),
                      'orgSName': item.get('orgSName'),
                      'title': item.get('title'),
                      'infoCode': item.get('infoCode'),
                      'attachPages': item.get('attachPages'),
                      'attachSize': item.get('attachSize')
                  }, ensure_ascii=False))
          PY
