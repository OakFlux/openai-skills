name: Build Bochu Electronics broker deep-report package

on:
  push:
    branches: [tmp-bochu-broker-reports-20261016]
    paths: ['.github/workflows/tmp-bochu-broker-package-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='柏楚电子_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=688188' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 6 "$out" "$out.txt" 2>/dev/null
            grep -Eq '柏楚电子|上海柏楚电子科技股份有限公司' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202310111601221123_1.PDF' \
            "$PACKAGE/01_浙商证券_国产激光控制系统龙头_国产替代与品类拓展双驱动_2023-10-10.pdf" \
            20

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202205311569076989_1.pdf' \
            "$PACKAGE/02_申港证券_柏学笃志恰到好楚_2022-05-31.pdf" \
            25

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202107041501745568_1.pdf' \
            "$PACKAGE/03_东吴证券_工业软件视角下公司无边界成长逻辑打通_2021-07-04.pdf" \
            35

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('柏楚电子_券商深度报告_3份')
          meta = {
              '01_浙商证券_国产激光控制系统龙头_国产替代与品类拓展双驱动_2023-10-10.pdf': {
                  'broker': '浙商证券',
                  'title': '国产激光控制系统龙头，国产替代+品类拓展双驱动',
                  'date': '2023-10-10',
                  'index': 'AP202310111601221123',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202310111601221123_1.PDF',
              },
              '02_申港证券_柏学笃志恰到好楚_2022-05-31.pdf': {
                  'broker': '申港证券',
                  'title': '“柏”学笃志，恰到好“楚”',
                  'date': '2022-05-31',
                  'index': 'AP202205311569076989',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202205311569076989_1.pdf',
              },
              '03_东吴证券_工业软件视角下公司无边界成长逻辑打通_2021-07-04.pdf': {
                  'broker': '东吴证券',
                  'title': '工业软件视角下，公司无边界成长逻辑打通',
                  'date': '2021-07-04',
                  'index': 'AP202107041501745568',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202107041501745568_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '柏楚电子（688188）券商公司深度报告',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 收录公开可下载的完整公司深度报告3份，排除短篇财报与季报点评。',
              '2. 三份报告分别从工业软件、激光控制系统国产替代及品类拓展等角度研究公司。',
              '3. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          for p in pdfs:
              item = meta[p.name]
              data = p.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(p)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(x.split(':', 1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              total_pages += pages
              lines += [
                  f'- {p.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {p.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Bochu-Electronics-broker-deep-reports-3
          path: 柏楚电子_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
