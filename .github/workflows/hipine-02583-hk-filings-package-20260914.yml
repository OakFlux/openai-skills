name: Build corrected HIPINE 02583 HK filing package 20260914

on:
  push:
    paths:
      - '.github/workflows/hipine-02583-hk-filings-package-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official HKEX filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '西普尼_02583_港股_招股章程_2025年报_2026中期业绩'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          def variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              return vals

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          docs = [
              {
                  'filename': '01_西普尼_02583_招股章程_中文版_2025-09-19.pdf',
                  'title': '西普尼招股章程（中文版）',
                  'date': '2025-09-19',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0919/2025091900020_c.pdf'),
                  'min_bytes': 1_000_000,
                  'min_pages': 700,
                  'required': ['西普尼', '2583'],
              },
              {
                  'filename': '02_HIPINE_02583_Prospectus_English_2025-09-19.pdf',
                  'title': 'HIPINE Prospectus (English)',
                  'date': '2025-09-19',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0919/2025091900019.pdf'),
                  'min_bytes': 1_000_000,
                  'min_pages': 700,
                  'required': ['HIPINE', '2583'],
              },
              {
                  'filename': '03_西普尼_02583_2025年年度报告_中英双语_2026-04-17.pdf',
                  'title': '西普尼2025年年度报告（中英双语）',
                  'date': '2026-04-17',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041700513.pdf'),
                  'min_bytes': 1_000_000,
                  'min_pages': 200,
                  'required': ['HIPINE', 'ANNUAL REPORT 2025', '2583'],
              },
              {
                  'filename': '04_西普尼_02583_2026年中期业绩公告_中文版_2026-08-28.pdf',
                  'title': '截至2026年6月30日止六个月中期业绩公告（中文版）',
                  'date': '2026-08-28',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082803075_c.pdf'),
                  'min_bytes': 100_000,
                  'min_pages': 20,
                  'required': ['西普尼', '二零二六年六月三十日', '2583'],
              },
              {
                  'filename': '05_HIPINE_02583_Interim_Results_English_2026-08-28.pdf',
                  'title': 'Interim Results Announcement for the Six Months Ended 30 June 2026 (English)',
                  'date': '2026-08-28',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082803074.pdf'),
                  'min_bytes': 100_000,
                  'min_pages': 20,
                  'required': ['HIPINE', '30 JUNE 2026', '2583'],
              },
          ]

          records: list[dict] = []
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')
              text = ''
              for page in reader.pages[:min(15, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              missing = [term for term in doc['required'] if term.lower() not in text.lower()]
              if missing:
                  raise RuntimeError(f'identity/period check failed for {dest.name}; missing={missing}')
              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')
              data = dest.read_bytes()
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'disclosure_date': doc['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '西普尼（02583.HK）港股披露文件',
              '整理日期：2026-09-14',
              '',
              '收录范围：仅收录香港交易所披露易公开文件。',
              '西普尼于2025-09-30在香港联交所主板上市；截至整理日，上市后完整年度报告只有2025年年度报告。',
              '香港主板公司不强制披露第一、第三季度报告。截至2026-09-14，港交所及公司投资者关系页面尚未列示完整2026年中期报告；因此，本包以2026-08-28披露的中期业绩公告（中文及英文原件）作为最新阶段性财务报告。',
              '本包不包含先前误标为“2026年中期报告”的2025年中期报告。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司及报告期文本、实际页数、qpdf结构检查、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 5:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload corrected ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: hipine-02583-hk-filings-corrected
          path: 西普尼_02583_港股_招股章程_2025年报_2026中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
