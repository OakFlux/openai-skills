name: Build final SIASUN Robot 300024 reports ZIP 20260928

on:
  push:
    paths:
      - '.github/workflows/siasun-300024-reports-direct-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download official disclosure PDFs and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '机器人_300024_2020-2025年报及2026最新季报与半年报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          documents = [
              {
                  'filename': '01_机器人_300024_2020年年度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2020年年度报告',
                  'period': '2020年度',
                  'announcement_date': '2021-04-29',
                  'art_code': 'AN202104281488450205',
                  'min_pages': 200,
                  'min_bytes': 4_000_000,
              },
              {
                  'filename': '02_机器人_300024_2021年年度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2021年年度报告',
                  'period': '2021年度',
                  'announcement_date': '2022-04-29',
                  'art_code': 'AN202204281562203651',
                  'min_pages': 200,
                  'min_bytes': 4_000_000,
              },
              {
                  'filename': '03_机器人_300024_2022年年度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2022年年度报告',
                  'period': '2022年度',
                  'announcement_date': '2023-04-14',
                  'art_code': 'AN202304131585437516',
                  'min_pages': 190,
                  'min_bytes': 5_000_000,
              },
              {
                  'filename': '04_机器人_300024_2023年年度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2023年年度报告',
                  'period': '2023年度',
                  'announcement_date': '2024-04-19',
                  'art_code': 'AN202404181630520734',
                  'min_pages': 190,
                  'min_bytes': 5_000_000,
              },
              {
                  'filename': '05_机器人_300024_2024年年度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2024年年度报告',
                  'period': '2024年度',
                  'announcement_date': '2025-04-19',
                  'art_code': 'AN202504181658568496',
                  'min_pages': 200,
                  'min_bytes': 5_000_000,
              },
              {
                  'filename': '06_机器人_300024_2025年年度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2025年年度报告',
                  'period': '2025年度',
                  'announcement_date': '2026-04-24',
                  'art_code': 'AN202604231821515889',
                  'min_pages': 180,
                  'min_bytes': 4_000_000,
              },
              {
                  'filename': '07_机器人_300024_2026年第一季度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2026年第一季度报告',
                  'period': '2026年第一季度',
                  'announcement_date': '2026-04-24',
                  'art_code': 'AN202604231821515936',
                  'min_pages': 8,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '08_机器人_300024_2026年半年度报告.pdf',
                  'title': '沈阳新松机器人自动化股份有限公司2026年半年度报告',
                  'period': '截至2026年6月30日止六个月',
                  'announcement_date': '2026-08-24',
                  'art_code': 'AN202608230006746134',
                  'min_pages': 120,
                  'min_bytes': 3_000_000,
              },
          ]

          def urls(art_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art_code}_1.pdf',
              ]

          def validate(path: Path, min_pages: int, min_bytes: int) -> tuple[int, int]:
              size = path.stat().st_size
              if size < min_bytes:
                  raise RuntimeError(f'file too small: {size} < {min_bytes}')
              if path.read_bytes()[:5] != b'%PDF-':
                  raise RuntimeError('invalid PDF header')
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < min_pages:
                  raise RuntimeError(f'page count too small: {pages} < {min_pages}')
              check = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(path)],
                  capture_output=True,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError('qpdf check failed: ' + check.stderr[-1500:])
              render_base = path.parent / (path.stem + '_page1')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(path), str(render_base)],
                  capture_output=True,
                  text=True,
              )
              png = Path(str(render_base) + '.png')
              if render.returncode != 0 or not png.exists() or png.stat().st_size < 10_000:
                  raise RuntimeError('first-page rendering failed: ' + render.stderr[-1000:])
              png_size = png.stat().st_size
              png.unlink(missing_ok=True)
              return pages, png_size

          def download(doc: dict, dest: Path) -> tuple[str, int, int]:
              errors: list[str] = []
              for url in urls(doc['art_code']):
                  for attempt in range(1, 3):
                      temp = dest.with_suffix(dest.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 300),
                          ) as response:
                              print('DOWNLOAD', dest.name, attempt, response.status_code, url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as handle:
                                  for chunk in response.iter_content(1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          pages, png_size = validate(temp, doc['min_pages'], doc['min_bytes'])
                          temp.replace(dest)
                          return str(response.url), pages, png_size
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download/validation failed for {dest.name}: {errors}')

          records: list[dict] = []
          hashes: set[str] = set()
          for doc in documents:
              destination = OUT / doc['filename']
              source_url, pages, png_size = download(doc, destination)
              data = destination.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in hashes:
                  raise RuntimeError('duplicate PDF: ' + destination.name)
              hashes.add(sha256)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'announcement_date': doc['announcement_date'],
                  'art_code': doc['art_code'],
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'first_page_png_bytes': png_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 8:
              raise RuntimeError(f'expected 8 reports, found {len(records)}')

          readme = [
              '沈阳新松机器人自动化股份有限公司（300024.SZ，证券简称：机器人）报告包',
              '整理日期：2026-09-28',
              '',
              '收录内容：2020—2025年完整年度报告、2026年第一季度报告、2026年半年度报告。',
              '说明：截至整理日，最新正式季度报告为2026年第一季度报告；同时附上更近期的2026年半年度报告。',
              '来源：上市公司公开披露文件的东方财富PDF镜像。',
              '检查项目：PDF文件头、文件大小、页数、qpdf结构、首页渲染、SHA-256及ZIP CRC。',
              '',
              '文件清单：',
          ]
          for i, record in enumerate(records, 1):
              readme.extend([
                  f"{i}. {record['title']}",
                  f"   文件：{record['filename']}",
                  f"   报告期：{record['period']}；公告日期：{record['announcement_date']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   来源：{record['source_url']}",
                  f"   公告代码：{record['art_code']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 8:
                  raise RuntimeError(f'expected 8 PDFs in ZIP, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: siasun-300024-final-reports-20260928
          path: 机器人_300024_2020-2025年报及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
