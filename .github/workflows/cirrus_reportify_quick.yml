name: Cirrus Reportify Quick

on:
  push:
    branches:
      - chatgpt-cirrus-fast-20260915
    paths:
      - .github/workflows/cirrus_reportify_quick.yml

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Reportify source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json
          from pathlib import Path
          from urllib.parse import urljoin
          urls={
            'haitong':'https://reportify.cn/reports/1135715571418140672',
            'company':'https://reportify.cn/companies/HK%3A02507/documents',
          }
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          out={}
          for name,u in urls.items():
            r=s.get(u,timeout=30); t=r.text
            Path(f'out/{name}.html').write_text(t,encoding='utf-8',errors='ignore')
            info={'status':r.status_code,'bytes':len(r.content),'final':r.url,'urls':[],'contexts':[],'json_scripts':[]}
            for m in re.finditer(r'''(?:https?:)?//[^\"'<>\s]+|/[A-Za-z0-9_./?=&%:+~-]+''',t):
              x=m.group(0).replace('\\/','/')
              if any(k in x.lower() for k in ['pdf','download','file','document','report','preview','image','attachment','api','1135715571418140672']):
                if x.startswith('//'): x='https:'+x
                elif x.startswith('/'): x=urljoin(r.url,x)
                if x not in info['urls']: info['urls'].append(x)
            for pat in ['1135715571418140672','pdfUrl','downloadUrl','fileUrl','sourceUrl','attachment','documentUrl','originalUrl','__NEXT_DATA__','_next/data','api/reports','reportId','storage','oss','cos']:
              for m in list(re.finditer(re.escape(pat),t,re.I))[:40]: info['contexts'].append({'pattern':pat,'context':t[max(0,m.start()-1200):m.end()+2400]})
            for m in re.finditer(r'<script[^>]*type=["\']application/json["\'][^>]*>(.*?)</script>',t,re.I|re.S):
              info['json_scripts'].append(m.group(1)[:500000])
            out[name]=info
            print(name,json.dumps({'status':info['status'],'bytes':info['bytes'],'urls':info['urls'][:100],'context_count':len(info['contexts'])},ensure_ascii=False,indent=2))
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cirrus-reportify-quick
          path: out
          retention-days: 1
