name: Inspect Hisun report pages simple 20261022

on:
  push:
    branches:
      - tmp/hisun-600267-deep-target-20261022-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          pages = [
              'https://fxbaogao.com/detail/3913491',
              'https://www.fxbaogao.com/detail/3913491',
              'https://www.hibor.com.cn/repinfodetail_2775481.html',
          ]

          for url in pages:
              print('\n===', url, '===')
              try:
                  response = session.get(url, timeout=(20, 120), allow_redirects=True)
                  print('STATUS', response.status_code, 'BYTES', len(response.content), 'FINAL', response.url)
                  response.encoding = response.apparent_encoding or response.encoding or 'utf-8'
                  text = response.text
                  soup = BeautifulSoup(text, 'lxml')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')
                  found = []
                  for tag in soup.find_all(True):
                      for attr in ['href', 'src', 'data-src', 'data-url', 'data-href']:
                          value = tag.get(attr)
                          if not value:
                              continue
                          full = urljoin(response.url, value)
                          label = re.sub(r'\s+', ' ', tag.get_text(' ', strip=True))[:160]
                          low = (full + ' ' + label).lower()
                          if any(word in low for word in ['pdf', 'download', '下载', '报告原文', 'report', 'attach', 'file']):
                              found.append({'tag': tag.name, 'attr': attr, 'label': label, 'url': full})
                  print('FOUND', json.dumps(found[:300], ensure_ascii=False, indent=2))
                  for keyword in ['资产重估', '下载报告', '打开报告原文', '35页', '35 页', '.pdf', 'download']:
                      positions = [match.start() for match in re.finditer(re.escape(keyword), text, re.I)]
                      for pos in positions[:10]:
                          snippet = text[max(0, pos - 300):pos + 800]
                          print('RAW_CONTEXT', keyword, snippet.replace('\n', ' ')[:1200])
                  body = re.sub(r'\s+', ' ', soup.get_text(' ', strip=True))
                  for keyword in ['资产重估', '下载报告', '打开报告原文', '35页', '35 页']:
                      pos = body.find(keyword)
                      if pos >= 0:
                          print('TEXT_CONTEXT', keyword, body[max(0, pos - 300):pos + 1000])
              except Exception as exc:
                  print('ERROR', repr(exc))
          PY
