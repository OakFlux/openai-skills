name: Build corrected Fulin Precision broker deep report package 20260928

on:
  push:
    paths:
      - '.github/workflows/fulin-precision-300432-broker-deep-reports-final-v2-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download public previews, build PDFs and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE='富临精工_300432_券商深度报告_公开预览版_3份_修正版'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          work=Path('_fulin_v2_work'); work.mkdir(exist_ok=True)

          reports=[
            {
              'order':1,'id':927433,'broker':'华安证券','date':'2025-10-27',
              'title':'富临精工（300432）：汽零+铁锂结构升级，机器人总成核心厂商',
              'analysts':'张志邦、刘千琳','rating':'买入（首次覆盖）','expected_pages':25,
            },
            {
              'order':2,'id':896468,'broker':'中泰证券','date':'2025-06-18',
              'title':'富临精工（300432）：机器人业务率先卡位，汽零+锂电引领产业升级',
              'analysts':'以报告原页为准','rating':'以报告原页为准','expected_pages':30,
            },
            {
              'order':3,'id':869931,'broker':'华创证券','date':'2025-04-11',
              'title':'富临精工（300432）深度研究报告：精密制造筑基，新能源与人形机器人双轮驱动新增长',
              'analysts':'黄麟、张程航、何家金','rating':'强推（首次覆盖）','expected_pages':26,
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url,payload):
            last=None
            for n in range(6):
              try:
                r=s.post(url,json=payload,timeout=(20,120)); last=(r.status_code,r.text[:300])
                if r.status_code==200: return r.json()
              except Exception as e: last=repr(e)
              time.sleep(1+n)
            raise RuntimeError((url,last))

          def get_image(url):
            last=None
            for n in range(6):
              try:
                r=s.get(url,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://www.sdyanbao.com/','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'},timeout=(20,120))
                last=(r.status_code,len(r.content),r.headers.get('content-type'))
                if r.status_code==200 and len(r.content)>10000:
                  with Image.open(BytesIO(r.content)) as im: im.verify()
                  return r.content
              except Exception as e: last=repr(e)
              time.sleep(1+n)
            raise RuntimeError((url,last))

          def safe(sv,limit=70):
            sv=re.sub(r'[\\/:*?"<>|]+','_',sv)
            sv=re.sub(r'\s+',' ',sv).strip()
            return sv[:limit]

          manifest=[]
          for r in reports:
            detail=post_json('https://api.sdyanbao.com/api/file/detail',{'id':r['id']})
            data=detail.get('data') if isinstance(detail,dict) else None
            if not isinstance(data,dict) or not data.get('page_url') or not data.get('page_count'):
              raise RuntimeError(f'Invalid detail for {r["id"]}: {detail}')
            total=int(data['page_count'])
            if total!=r['expected_pages']:
              raise RuntimeError(f'Page count mismatch for {r["id"]}: expected {r["expected_pages"]}, got {total}')
            count=min(10,total); base=str(data['page_url']).rstrip('/')
            wdir=work/f'r{r["order"]}'; wdir.mkdir(exist_ok=True)
            pages=[]
            for pno in range(count):
              raw=get_image(f'{base}/{pno}.png')
              src=wdir/f'{pno:02d}_src.png'; src.write_bytes(raw)
              with Image.open(src) as im:
                rgba=im.convert('RGBA'); white=Image.new('RGBA',rgba.size,(255,255,255,255)); white.alpha_composite(rgba)
                out=wdir/f'{pno:02d}.jpg'; white.convert('RGB').save(out,'JPEG',quality=95,subsampling=0); pages.append(out)
            pdf_name=f'{r["order"]:02d}_{r["broker"]}_富临精工_{safe(r["title"],58)}_公开预览前{count}页_{r["date"]}.pdf'
            pdf=root/pdf_name
            imgs=[Image.open(p).convert('RGB') for p in pages]
            try: imgs[0].save(pdf,save_all=True,append_images=imgs[1:],resolution=150.0,quality=95)
            finally:
              for im in imgs: im.close()
            reader=PdfReader(str(pdf),strict=False)
            if len(reader.pages)!=count: raise RuntimeError(f'PDF page mismatch {pdf}')
            subprocess.run(['qpdf','--check',str(pdf)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/pdf.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(pdf),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            cover=Path(str(prefix)+'.png')
            if not cover.exists() or cover.stat().st_size<10000: raise RuntimeError(f'Cover render failed {pdf}')
            sha=hashlib.sha256(pdf.read_bytes()).hexdigest()
            manifest.append({**r,'source_name':data.get('name'),'source_detail_page':f'https://www.sdyanbao.com/detail/{r["id"]}','page_image_base':base,'original_total_pages':total,'public_preview_pages':count,'pdf_file':pdf.name,'bytes':pdf.stat().st_size,'sha256':sha,'cover_preview':str(Path('首页预览')/cover.name),'document_nature':'公开预览原页；非券商原始完整PDF','validation':['image integrity','white background','PDF page count','qpdf structure','cover render']})

          lines=['富临精工（300432.SZ）券商深度报告公开预览资料包（修正版）','整理日期：2026-09-28','','本包仅保留3份真正的券商公司深度或首次覆盖报告，不含上市公司年报、半年报或季报。','完整原始PDF在相关研报平台需要账户或下载权限；本包未绕过登录、会员或付费限制。','']
          for i,r in enumerate(manifest,1):
            lines += [f"{i}. {r['broker']}：《{r['title']}》",f"   日期：{r['date']}；分析师：{r['analysts']}；评级：{r['rating']}",f"   原报告：{r['original_total_pages']}页；本PDF：公开预览前{r['public_preview_pages']}页",f"   来源：{r['source_detail_page']}",f"   SHA-256：{r['sha256']}",'']
          lines += ['报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','核验项目：预览图片完整性、白底校正、PDF页数、PDF结构、首页渲染、ZIP CRC与SHA-256。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['pdf_file']}\n" for x in manifest),encoding='utf-8')
          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as arc:
            for p in sorted(root.rglob('*')):
              if p.is_file(): arc.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(z) as arc:
            bad=arc.testzip()
            if bad: raise RuntimeError('ZIP CRC failure '+bad)
            if len([n for n in arc.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('PDF count mismatch')
          eng=Path('Fulin_Precision_300432_Broker_Deep_Reports_Public_Previews_3_Corrected.zip'); eng.write_bytes(z.read_bytes())
          print('FINAL_ZIP',z,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: fulin-precision-300432-broker-deep-reports-corrected-final
          path: |
            富临精工_300432_券商深度报告_公开预览版_3份_修正版.zip
            Fulin_Precision_300432_Broker_Deep_Reports_Public_Previews_3_Corrected.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
