name: Fetch fxbaogao 1422001 HTML only 20260927

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-1422001-html-only-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests, re, json
          from pathlib import Path
          from urllib.parse import urljoin
          u='https://www.fxbaogao.com/detail/1422001'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/'})
          r=s.get(u,timeout=(20,90),allow_redirects=True)
          print('STATUS',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
          Path('out/page.html').write_bytes(r.content)
          text=r.text
          Path('out/page.txt').write_text(text,encoding='utf-8')
          urls=[]
          for m in re.finditer(r'https?://[^\s"\'<>]+',text):
              x=m.group(0).replace('\\/','/').rstrip(');,]')
              urls.append(x)
          Path('out/urls.txt').write_text('\n'.join(sorted(set(urls))),encoding='utf-8')
          for term in ['1422001','pdf','download','fileUrl','reportUrl','__NEXT_DATA__','oss','cdn','查看完整报告']:
              print('TERM',term,flush=True)
              for m in list(re.finditer(re.escape(term),text,re.I))[:20]:
                  print(text[max(0,m.start()-200):min(len(text),m.end()+500)].replace('\n',' ')[:1000],flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-1422001-html-only
          path: out
          retention-days: 7
          if-no-files-found: error
