name: Read Ascletis report pages fast
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/read-9fzt-ascletis-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/read_9fzt_ascletis_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: 9fzt-ascletis-fast
          path: |
            9fzt_ascletis_fast.json
            9fzt_*.html
          if-no-files-found: error
          retention-days: 1
