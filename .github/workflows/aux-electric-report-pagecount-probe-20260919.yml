name: Probe AUX Electric report page counts 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-report-pagecount-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests pillow
      - name: Probe sequential pages and viewer
        shell: bash
        run: |
          set -u
          mkdir -p probe
          python - <<'PY'
          import hashlib, io, json, time
          from pathlib import Path
          import requests
          from PIL import Image

          items=[
            dict(name='财通',path='2026/05/31',id='5454573'),
            dict(name='国盛',path='2026/04/16',id='5357558'),
            dict(name='华西',path='2026/06/04',id='5463740'),
            dict(name='国联民生',path='2026/04/15',id='5353793'),
          ]
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'image/avif,image/webp,image/*,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9'})
          allres=[]
          for item in items:
            rec={'item':item,'pages':[],'viewer':None}
            try:
              vr=s.get(f"https://www.fxbaogao.com/view?id={item['id']}",headers={'Accept':'text/html,*/*'},timeout=(15,60),allow_redirects=True)
              rec['viewer']={'status':vr.status_code,'url':vr.url,'type':vr.headers.get('content-type'),'bytes':len(vr.content),'text_head':vr.text[:500]}
              Path(f"probe/{item['id']}_viewer.html").write_bytes(vr.content)
            except Exception as e:
              rec['viewer']={'error':repr(e)}
            misses=0
            for n in range(1,41):
              raw=f"https://public.fxbaogao.com/report-image/{item['path']}/{item['id']}-{n}.png"
              u=raw+'?x-oss-process=image/format,webp'
              try:
                r=s.get(u,headers={'Referer':f"https://www.fxbaogao.com/detail/{item['id']}"},timeout=(10,45),allow_redirects=True)
                info={'n':n,'status':r.status_code,'type':r.headers.get('content-type'),'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()}
                if r.status_code==200 and (r.headers.get('content-type') or '').startswith('image/'):
                  try:
                    with Image.open(io.BytesIO(r.content)) as im:
                      im.load();info['size']=im.size;info['format']=im.format
                    if len(r.content)>=15000 and info['size'][0]>=700 and info['size'][1]>=900:
                      info['valid']=True;misses=0
                    else:
                      info['valid']=False;misses+=1
                  except Exception as e:
                    info['image_error']=repr(e);info['valid']=False;misses+=1
                else:
                  info['valid']=False;misses+=1
                rec['pages'].append(info)
                print(item['name'],n,info,flush=True)
                if n>1 and misses>=2: break
              except Exception as e:
                rec['pages'].append({'n':n,'error':repr(e),'valid':False});misses+=1
                if n>1 and misses>=2: break
            rec['valid_count']=sum(1 for x in rec['pages'] if x.get('valid'))
            allres.append(rec)
          Path('probe/results.json').write_text(json.dumps(allres,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aux-electric-report-pagecount-probe
          path: probe
          retention-days: 7
          if-no-files-found: warn
