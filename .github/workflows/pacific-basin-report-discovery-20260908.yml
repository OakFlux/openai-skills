name: Discover public Pacific Basin broker report files 20260908

on:
  push:
    paths:
      - '.github/workflows/pacific-basin-report-discovery-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe report pages and public assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re,html
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages={
            'sdyanbao':'https://www.sdyanbao.com/detail/697752',
            'fhyanbao':'https://www.fhyanbao.com/rpview/1827593',
            'hangyan':'https://www.hangyan.co/reports/3485206680961025131?page_num=11',
          }
          allhits={}
          for name,url in pages.items():
            try:
              r=s.get(url,timeout=60)
              print('\nPAGE',name,r.status_code,len(r.content),r.url)
              text=r.text
              (out/f'{name}.html').write_text(text,encoding='utf-8',errors='ignore')
              soup=BeautifulSoup(text,'html.parser')
              scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')]
              links=[urljoin(r.url,x.get('href')) for x in soup.find_all('a') if x.get('href')]
              imgs=[urljoin(r.url,x.get('src')) for x in soup.find_all('img') if x.get('src')]
              rawurls=re.findall(r'https?:\\?/\\?/[^\"\'<>\\s]+',text)
              rawurls=[html.unescape(x.replace('\\/','/')) for x in rawurls]
              hits=sorted(set(scripts+links+imgs+rawurls))
              allhits[name]=hits
              for h in hits:
                if any(k in h.lower() for k in ['pdf','download','report','page','oss','static','api','file','img']): print('HIT',name,h)
              for i,js in enumerate(scripts):
                try:
                  rr=s.get(js,timeout=45)
                  if rr.status_code==200 and len(rr.content)<8_000_000:
                    p=out/f'{name}_script_{i}.js'; p.write_bytes(rr.content)
                    jtext=rr.text
                    keylines=[]
                    for line in jtext.splitlines():
                      if any(k in line.lower() for k in ['download','pdf','report','rpview','api/','preview','fileurl','oss.','page/']): keylines.append(line[:5000])
                    if keylines:
                      print('SCRIPT',name,js,'KEYLINES',len(keylines))
                      print('\n'.join(keylines[:20]))
                except Exception as e: print('SCRIPT_ERR',name,js,repr(e))
            except Exception as e: print('PAGE_ERR',name,repr(e))

          # Public report indexes / likely APIs.
          probes=[
            'https://reportapi.eastmoney.com/report/list?cb=&pageSize=100&pageNo=1&beginTime=2010-01-01&endTime=2026-09-08&code=02343&industryCode=*&rating=*&ratingChange=*&orgCode=*&rcode=*&qType=0',
            'https://reportapi.eastmoney.com/report/list?cb=&pageSize=100&pageNo=1&beginTime=2010-01-01&endTime=2026-09-08&code=2343&industryCode=*&rating=*&ratingChange=*&orgCode=*&rcode=*&qType=0',
            'https://quotes.sina.cn/hk/api/openapi.php/HK_ReportService.getReportList?symbol=02343&page=1&num=100',
            'https://quotes.sina.cn/hk/api/openapi.php/HK_ReportService.getList?symbol=02343&page=1&num=100',
          ]
          for i,u in enumerate(probes):
            try:
              rr=s.get(u,timeout=45)
              print('\nPROBE',i,rr.status_code,len(rr.content),rr.url,rr.text[:20000])
              (out/f'probe_{i}.txt').write_bytes(rr.content)
            except Exception as e: print('PROBE_ERR',i,repr(e))
          (out/'allhits.json').write_text(json.dumps(allhits,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: pacific-basin-report-discovery
          path: discovery/
          retention-days: 7
          if-no-files-found: error
