name: Query NEEQ legacy endpoint with modern parameters 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-old-modern-params-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query legacy endpoint with array fields
        run: |
          python - <<'PY'
          import json, requests
          endpoints=[
            'https://www.neeq.com.cn/disclosureInfoController/infoResult.do',
            'http://www.neeq.com.cn/disclosureInfoController/infoResult.do',
          ]
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.neeq.com.cn','Referer':'https://www.neeq.com.cn/','X-Requested-With':'XMLHttpRequest'})
          cases=[]
          for is_new in ['0','1']:
            for xxfcbj in ['1','2','3','']:
              cases.append((is_new,xxfcbj,'400062',''))
              cases.append((is_new,xxfcbj,'','400062'))
              cases.append((is_new,xxfcbj,'','国重装5'))
          for endpoint in endpoints:
            for n,(is_new,xxfcbj,company,keyword) in enumerate(cases,1):
              form=[
                ('flag','1'),('noticeType[]','5'),('disclosureType[]','5'),('disclosureSubtype[]',''),
                ('page','0'),('companyCd',company),('isNewThree',is_new),('keyword',keyword),
                ('startTime','2015-01-01'),('endTime','2020-06-30'),('xxfcbj[]',xxfcbj),('hyType[]',''),
                ('needFields[]','companyCd'),('needFields[]','companyName'),('needFields[]','disclosureTitle'),
                ('needFields[]','disclosurePostTitle'),('needFields[]','destFilePath'),('needFields[]','publishDate'),
                ('needFields[]','xxfcbj'),('needFields[]','fileExt'),('needFields[]','xxzrlx'),
                ('siteId','1'),('sortfield','xxssdq'),('sorttype','asc')
              ]
              try:
                r=s.post(endpoint,params={'callback':'jQuery183_test'},data=form,timeout=40,allow_redirects=True)
                raw=r.text.strip(); print('\nENDPOINT',endpoint,'CASE',n,'NEW',is_new,'XXF',repr(xxfcbj),'COMP',repr(company),'KW',repr(keyword),'STATUS',r.status_code,'LEN',len(raw),'FINAL',r.url)
                clean=raw
                if clean.startswith('jQuery') and '(' in clean: clean=clean[clean.find('(')+1:clean.rfind(')')]
                elif clean.startswith('null(') and clean.endswith(')'): clean=clean[5:-1]
                else: clean=clean.rstrip(';')
                try: obj=json.loads(clean)
                except Exception as exc:
                  print('PARSE_ERROR',repr(exc),'HEAD',repr(raw[:600])); continue
                blocks=obj if isinstance(obj,list) else [obj]
                total=0
                for block in blocks:
                  if not isinstance(block,dict): continue
                  li=block.get('listInfo') or {}; rows=li.get('content') or []
                  total+=len(rows)
                  for rec in rows: print('HIT',json.dumps(rec,ensure_ascii=False,sort_keys=True))
                print('TOTAL_ROWS',total)
              except Exception as exc:
                print('REQUEST_ERROR',repr(exc))
          PY
