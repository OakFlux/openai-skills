name: Probe Ascletis Waterdrop download
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/probe-sdyanbao-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_sdyanbao_download.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-download-probe
          path: |
            sdyanbao_download_probe.json
            *.pdf
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
