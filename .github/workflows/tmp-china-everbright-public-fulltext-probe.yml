name: Temporary China Everbright public full-text probe

on:
  push:
    branches:
      - tmp/china-everbright-public-fulltext-probe-20260831

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Probe public mirrors
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('probe_out'); OUT.mkdir()
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6',
          })
          result={'sgpjbg':{},'articles':{}}

          def fetch(url):
              r=s.get(url,timeout=90,allow_redirects=True)
              r.raise_for_status()
              r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
              return r

          topic='https://www.sgpjbg.com/zhuanti/beikeguangdabaogao.html'
          try:
              r=fetch(topic); html=r.text; soup=BeautifulSoup(html,'lxml')
              links=[]
              for a in soup.find_all('a',href=True):
                  text=a.get_text(' ',strip=True)
                  href=urllib.parse.urljoin(r.url,a['href'])
                  blob=(text+' '+href).replace(' ','')
                  if ('中国光大控股' in blob or '资负共振' in blob or '拐点已现' in blob):
                      links.append({'text':text,'url':href,'outer':str(a)[:3000]})
              result['sgpjbg']['topic_status']=r.status_code
              result['sgpjbg']['topic_len']=len(html)
              result['sgpjbg']['links']=links
              (OUT/'sgpjbg_topic.html').write_text(html,encoding='utf-8')
              print('SGPJBG_LINKS',json.dumps(links,ensure_ascii=False),flush=True)

              # Also find nearby hrefs around matching text in raw HTML.
              for phrase in ['资负共振','中国光大控股（0165.HK）','拐点已现']:
                  pos=html.find(phrase)
                  print('SGPJBG_CONTEXT',phrase,pos,repr(html[max(0,pos-3000):pos+6000]),flush=True)

              detail_urls=[]
              for item in links:
                  if item['url'] not in detail_urls:
                      detail_urls.append(item['url'])
              # Raw regex fallback for bgdown links around report title.
              for m in re.finditer(r'href=["\']([^"\']+)["\'][^>]*>[^<]*(?:中国光大控股|资负共振|拐点已现)',html,re.I):
                  u=urllib.parse.urljoin(r.url,m.group(1))
                  if u not in detail_urls: detail_urls.append(u)
              for m in re.finditer(r'/bgdown/\d+\.html',html):
                  u=urllib.parse.urljoin(r.url,m.group(0))
                  ctx=html[max(0,m.start()-1000):m.end()+2000]
                  if any(k in ctx for k in ['中国光大控股','资负共振','拐点已现']) and u not in detail_urls:
                      detail_urls.append(u)

              details=[]
              for idx,u in enumerate(detail_urls[:10]):
                  try:
                      dr=fetch(u); ds=BeautifulSoup(dr.text,'lxml')
                      text=ds.get_text('\n',strip=True)
                      urls=[]
                      for tag in ds.find_all(True):
                          for attr in ['href','src','data-src','data','action','value']:
                              v=tag.get(attr)
                              if not v: continue
                              full=urllib.parse.urljoin(dr.url,str(v))
                              if any(k in full.lower() for k in ['pdf','download','file','oss','cdn','report','bgdown','upload']):
                                  urls.append({'tag':tag.name,'attr':attr,'url':full,'text':tag.get_text(' ',strip=True)[:100],'attrs':dict(tag.attrs)})
                      raw_urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',dr.text)))
                      page_markers=re.findall(r'(?<!\d)(\d{1,3})\s*/\s*23(?!\d)',text)
                      item={
                          'url':dr.url,'status':dr.status_code,'html_len':len(dr.text),'text_len':len(text),
                          'title':ds.title.get_text(' ',strip=True) if ds.title else '',
                          'page_markers':page_markers[:100],
                          'interesting_urls':urls[:300],
                          'raw_urls':[x for x in raw_urls if any(k in x.lower() for k in ['pdf','download','file','oss','cdn','report','upload'])][:300],
                          'text_start':text[:3000], 'text_end':text[-5000:],
                      }
                      details.append(item)
                      (OUT/f'sgpjbg_detail_{idx}.html').write_text(dr.text,encoding='utf-8')
                      print('SGPJBG_DETAIL',json.dumps(item,ensure_ascii=False),flush=True)
                  except Exception as exc:
                      print('SGPJBG_DETAIL_ERROR',u,repr(exc),flush=True)
              result['sgpjbg']['details']=details
          except Exception as exc:
              result['sgpjbg']['error']=repr(exc); print('SGPJBG_ERROR',repr(exc),flush=True)

          article_urls=[
              'https://finance.sina.cn/stock/relnews/hk/2026-04-24/detail-inhvpyyk8130278.d.html',
              'https://daily.hstong.com/news/detail/26042422034988912',
              'https://caifuhao.eastmoney.com/news/20260424073426579316850',
          ]
          selectors=['#artibody','.article','.article-content','.article_content','.content','.news-content','#content','.main-content','.detail-content','.rich_media_content']
          for idx,u in enumerate(article_urls):
              try:
                  r=fetch(u); soup=BeautifulSoup(r.text,'lxml')
                  best=None; best_sel=''
                  for sel in selectors:
                      for node in soup.select(sel):
                          t=node.get_text('\n',strip=True)
                          if best is None or len(t)>len(best.get_text('\n',strip=True)):
                              best=node; best_sel=sel
                  if best is None: best=soup.body or soup
                  text=best.get_text('\n',strip=True)
                  imgs=[]
                  for im in best.find_all('img'):
                      src=im.get('data-src') or im.get('data-original') or im.get('src')
                      if src:
                          imgs.append(urllib.parse.urljoin(r.url,src))
                  links=[]
                  for a in best.find_all('a',href=True):
                      href=urllib.parse.urljoin(r.url,a['href'])
                      if any(k in href.lower() for k in ['pdf','download','file','report']):
                          links.append(href)
                  item={'url':r.url,'status':r.status_code,'html_len':len(r.text),'selector':best_sel,'text_len':len(text),'image_count':len(imgs),'images':imgs[:300],'links':links[:100],'text_start':text[:3000],'text_end':text[-5000:]}
                  result['articles'][u]=item
                  (OUT/f'article_{idx}.html').write_text(r.text,encoding='utf-8')
                  (OUT/f'article_{idx}_content.html').write_text(str(best),encoding='utf-8')
                  (OUT/f'article_{idx}.txt').write_text(text,encoding='utf-8')
                  print('ARTICLE',json.dumps(item,ensure_ascii=False),flush=True)
              except Exception as exc:
                  result['articles'][u]={'error':repr(exc)}; print('ARTICLE_ERROR',u,repr(exc),flush=True)

          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: china-everbright-public-fulltext-probe
          path: probe_out/
          retention-days: 3
          if-no-files-found: error