name: Locate Huabao report IDs on public report index
on:
  push:
    branches: [chatgpt-huabao-international-reports-20260907]
    paths: ['.github/workflows/chatgpt-huabao-fx-id.yml']
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Find exact public report pages
        run: |
          mkdir -p result
          python - <<'PY'
          import json,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False; s.headers['User-Agent']='Mozilla/5.0'
          hits=[]
          for p in range(954,962):
            u=f'https://www.fxbaogao.com/category/11?page={p}'
            try:
              r=s.get(u,timeout=(15,60)); print('PAGE',p,r.status_code,len(r.content),flush=True)
              Path(f'result/category_{p}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.find_all('a',href=True):
                text=a.get_text(' ',strip=True); href=urllib.parse.urljoin(r.url,a['href'])
                if any(k in text for k in ('历尽千帆','华宝国际','香精行业龙头','涅槃重生')):
                  hits.append({'page':p,'text':text,'href':href})
                  print('HIT',json.dumps(hits[-1],ensure_ascii=False),flush=True)
            except Exception as e: print('FAIL',p,repr(e),flush=True)
          Path('result/hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-fx-id
          path: result/
          retention-days: 3
