name: Build Dadongfang 600327 broker reports final

on:
  push:
    branches:
      - tmp-dadongfang-broker-final-20261103

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='大东方_600327_券商深度报告_2份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/dadongfang_final_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          out = Path('大东方_600327_券商深度报告_2份')
          reports = [
              {
                  'order': 1,
                  'broker': '华安证券',
                  'date': '2022-04-17',
                  'title': '夯实存量挖掘增量，零售+医疗双轮驱动',
                  'filename': '01_华安证券_夯实存量挖掘增量零售医疗双轮驱动_2022-04-17.pdf',
                  'expected_pages': 37,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202204181559970208_1.pdf',
                  'referer': 'https://data.eastmoney.com/report/info/AP202204181559970208.html',
                  'info': 'https://data.eastmoney.com/report/info/AP202204181559970208.html',
              },
              {
                  'order': 2,
                  'broker': '中泰证券',
                  'date': '2024-06-27',
                  'title': '无锡零售巨头发力儿科医疗，第二成长曲线逐步兑现',
                  'filename': '02_中泰证券_无锡零售巨头发力儿科医疗第二成长曲线逐步兑现_2024-06-27.pdf',
                  'expected_pages': 33,
                  'url': 'https://file.iyanbao.com/pdf/a38f0-9706dcd8-f162-4ef1-add2-2a33f360b73c.pdf',
                  'referer': 'https://www.iyanbao.com/',
                  'info': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?industry=&orgname=&symbol=600327&t1=all&title=',
              },
          ]

          records = []
          for report in reports:
              session = requests.Session()
              session.trust_env = False
              session.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  'Referer': report['referer'],
              })
              response = session.get(report['url'], timeout=(30, 180), allow_redirects=True)
              data = response.content
              if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 100_000:
                  raise RuntimeError(
                      f"{report['broker']}: HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get('content-type')}"
                  )
              destination = out / report['filename']
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f"{destination.name}: expected {report['expected_pages']} pages, got {pages}")

              text = ''
              for page in reader.pages:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '大东方' not in compact and '600327' not in compact:
                  raise RuntimeError(f'{destination.name}: company name or stock code not found')
              broker_key = report['broker'].replace('证券', '')
              if report['broker'] not in compact and broker_key not in compact:
                  raise RuntimeError(f'{destination.name}: broker name not found')

              sha = hashlib.sha256(data).hexdigest()
              record = {**report, 'pages': pages, 'bytes': len(data), 'source': response.url, 'sha256': sha}
              records.append(record)
              print('DOWNLOADED', report['broker'], report['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)

          lines = [
              '大东方（600327）券商深度报告资料包',
              '整理日期：2026-11-03',
              '',
              '收录说明：',
              '1. 本包收录2份可公开直接下载的券商完整PDF。',
              '2. 两份报告均为公司深度或首次覆盖类型，未使用网页摘要、预览截图或重新排版文件。',
              '3. 全部文件已核验公司名称、股票代码、券商名称、实际页数、PDF结构及首末页渲染。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   报告日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   信息页：{item['info']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f'合计：2份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 30
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '大东方|600327' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/dadongfang_final_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          test "$(pdfinfo "$PACKAGE/01_华安证券_夯实存量挖掘增量零售医疗双轮驱动_2022-04-17.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 37
          test "$(pdfinfo "$PACKAGE/02_中泰证券_无锡零售巨头发力儿科医疗第二成长曲线逐步兑现_2024-06-27.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 33

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/dadongfang_final_test.zip "$PACKAGE"
          unzip -t /tmp/dadongfang_final_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/dadongfang_final_test.zip | grep -c '\.pdf$')" -eq 2
          rm -f /tmp/dadongfang_final_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dadongfang-600327-broker-deep-reports-2
          path: 大东方_600327_券商深度报告_2份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
