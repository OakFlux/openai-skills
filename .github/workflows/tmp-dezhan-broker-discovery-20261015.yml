name: Discover DeZhan Health broker reports

on:
  push:
    branches: [tmp-dezhan-broker-reports-20261015]
    paths: ['.github/workflows/tmp-dezhan-broker-discovery-20261015.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney public report index
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=000813' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&beginTime=2018-01-01&endTime=2026-10-15&qType=0&code=000813&industryCode=*&orgCode=&author=&fields=' \
            -o reports.jsonp
          wc -c reports.jsonp
          cat reports.jsonp
