name: Discover Jianshe Industry broker reports v2

on:
  push:
    paths:
      - '.github/triggers/jianshe-industry-broker-discovery-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report index
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          out=Path('out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=002265'})
          logs=[]; rows=[]; seen=set()
          def parse(t):
              t=t.strip()
              try:return json.loads(t)
              except:pass
              m=re.search(r'^[^(]*\((.*)\)\s*;?$',t,re.S)
              if m:
                  try:return json.loads(m.group(1))
                  except:pass
          for q in ['0','1','2']:
            for pno in range(1,6):
              p={'pageSize':'100','pageNo':str(pno),'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2026-10-16','fields':'','qType':q,'orgCode':'','author':'','stockCode':'002265','rcode':'','p':str(pno),'pageNum':str(pno),'pageNumber':str(pno)}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=90)
              obj=parse(r.text)
              logs.append({'status':r.status_code,'url':r.url,'bytes':len(r.content),'prefix':r.text[:300]})
              cand=[]
              if isinstance(obj,dict):
                for key in ('data','result','list','rows'):
                  v=obj.get(key)
                  if isinstance(v,list): cand+=v
                  elif isinstance(v,dict):
                    for k2 in ('data','list','rows'):
                      if isinstance(v.get(k2),list): cand+=v[k2]
              elif isinstance(obj,list): cand=obj
              if not cand: break
              for x in cand:
                if not isinstance(x,dict): continue
                code=str(x.get('infoCode') or x.get('info_code') or x.get('reportCode') or '')
                key=code or json.dumps(x,ensure_ascii=False,sort_keys=True)
                if key not in seen: seen.add(key); rows.append(x)
          (out/'rows.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ROWS',len(rows)); print(json.dumps(rows,ensure_ascii=False,indent=2)[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jianshe-industry-broker-discovery-v2
          path: out
          retention-days: 7
