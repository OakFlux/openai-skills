name: Search Daqin Railway 601006 filings 20260927

on:
  push:
    paths:
      - '.github/workflows/daqin-601006-filings-search-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query SSE and CNINFO APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import requests

          out = {}

          # Shanghai Stock Exchange official announcement API
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=601006',
              'Accept': 'application/json,text/javascript,*/*;q=0.01',
          })
          sse_url = 'https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          params = {
              'isPagination': 'true',
              'productId': '601006',
              'keyWord': '',
              'securityType': '0101',
              'reportType2': 'DQBG',
              'reportType': 'ALL',
              'beginDate': '2019-01-01',
              'endDate': '2026-09-27',
              'pageHelp.pageSize': '200',
              'pageHelp.pageNo': '1',
              'pageHelp.beginPage': '1',
              'pageHelp.cacheSize': '1',
              'pageHelp.endPage': '5',
              '_': str(int(time.time() * 1000)),
          }
          try:
              r = s.get(sse_url, params=params, timeout=(20, 120))
              out['sse'] = {
                  'status': r.status_code,
                  'url': r.url,
                  'headers': dict(r.headers),
                  'text': r.text,
              }
          except Exception as exc:
              out['sse'] = {'error': repr(exc)}

          # CNINFO official designated disclosure platform search API
          c = requests.Session(); c.trust_env = False
          c.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Origin': 'https://www.cninfo.com.cn',
              'Referer': 'https://www.cninfo.com.cn/new/disclosure/stock?stockCode=601006&orgId=gssh0601006',
              'X-Requested-With': 'XMLHttpRequest',
          })
          cn_url = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
          payload = {
              'pageNum': '1',
              'pageSize': '100',
              'column': 'sse',
              'tabName': 'fulltext',
              'plate': 'sh',
              'stock': '601006,gssh0601006',
              'searchkey': '',
              'secid': '',
              'category': 'category_ndbg_szsh;category_bndbg_szsh;category_yjdbg_szsh;category_sjdbg_szsh',
              'trade': '',
              'seDate': '2019-01-01~2026-09-27',
              'sortName': '',
              'sortType': '',
              'isHLtitle': 'true',
          }
          try:
              r = c.post(cn_url, data=payload, timeout=(20, 120))
              out['cninfo'] = {
                  'status': r.status_code,
                  'url': r.url,
                  'headers': dict(r.headers),
                  'text': r.text,
              }
          except Exception as exc:
              out['cninfo'] = {'error': repr(exc)}

          Path('out/result.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2)[:400000])
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: daqin-601006-filings-search
          path: out
          retention-days: 7
          if-no-files-found: error
