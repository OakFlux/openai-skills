name: Inspect SolaX Q3 mirror download links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solax-q3-mirror-inspect-20261105.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import html,json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          urls = [
            'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12682787&stockid=688717',
            'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12682787&stockid=688717',
            'https://paper.cnstock.com/html/2026-10/31/content_2285287.htm',
            'https://epaper.cs.com.cn/zgzqb/html/2026-10/31/nw.D110000zgzqb_20261031_2-B044.htm',
            'https://q.stock.sohu.com/cn/688717/bw.shtml',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9'})
          for u in urls:
            try:
              r=s.get(u,timeout=30,allow_redirects=True)
              enc=r.apparent_encoding or r.encoding or 'utf-8'
              r.encoding=enc
              t=html.unescape(r.text)
              print('\n===PAGE===',u,r.status_code,len(r.content),r.url,r.headers.get('content-type'),enc,flush=True)
              soup=BeautifulSoup(t,'html.parser')
              found=[]
              for tag in soup.find_all(True):
                for a in ('href','src','data-src','data-url','content','onclick','value'):
                  v=tag.get(a)
                  if not v: continue
                  vv=str(v)
                  if any(k in vv.lower() for k in ('pdf','download','attach','file','12682787','688717_20261031_ndeu','print','content_2285287')):
                    found.append({'tag':tag.name,'attr':a,'value':urljoin(r.url,vv),'text':tag.get_text(' ',strip=True)[:120]})
              print('FOUND',json.dumps(found,ensure_ascii=False,indent=2),flush=True)
              for k in ('12682787','688717_20261031_NDEU','pdf','下载公告','附件','print'):
                i=t.lower().find(k.lower())
                if i>=0: print('CTX',k,t[max(0,i-1000):i+3000],flush=True)
            except Exception as e:
              print('ERROR',u,repr(e),flush=True)
          PY
