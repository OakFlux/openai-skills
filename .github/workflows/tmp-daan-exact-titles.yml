name: Temporary exact Daan Gene report title search

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-exact-titles.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Search exact titles and related report phrases
        run: |
          python - <<'PY'
          import json, re
          import requests

          queries = [
              '三季度业绩超预期 产能扩建有望延续新冠优势',
              '三季度业绩超预期',
              '产能扩建有望延续新冠优势',
              '后疫情时代新冠筛查从严 下半年业绩持续受益',
              '后疫情时代新冠筛查从严',
              '下半年业绩持续受益',
              '达安基因事件点评',
              '达安基因半年报点评',
              '达安基因三季报点评',
              '分子诊断龙头',
              '核酸检测龙头',
              '达安基因新冠',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          seen=set(); results=[]
          for q in queries:
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/search',json={'page':1,'pageSize':100,'keyword':q},timeout=60); r.raise_for_status(); rows=(r.json().get('data') or {}).get('files') or []
              except Exception as e:
                  print('ERROR',q,repr(e)); continue
              print('\nQUERY',q,'COUNT',len(rows))
              for row in rows:
                  name=str(row.get('name') or '')
                  # retain exact Daan Gene hits and close title matches
                  blob=name.replace(' ','')
                  if not ('达安基因' in blob or any(x.replace(' ','') in blob for x in ['三季度业绩超预期','产能扩建有望延续新冠优势','后疫情时代新冠筛查从严','下半年业绩持续受益'])):
                      continue
                  rid=row.get('id')
                  if rid in seen: continue
                  seen.add(rid)
                  try:
                      d=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=60).json(); detail=(d.get('data') or {}) if d.get('status')==1 else {}
                  except Exception as e:
                      detail={}; print('DETAIL_ERROR',rid,repr(e))
                  rec={
                      'id':rid,'name':name,'page_count':detail.get('page_count') or row.get('page_count'),
                      'time_text':detail.get('time_text') or row.get('time_text'),
                      'organization':((detail.get('organization') or {}).get('name') if isinstance(detail.get('organization'),dict) else detail.get('organization')),
                      'data_source_uuid':detail.get('data_source_uuid') or row.get('data_source_uuid'),
                      'original_id':detail.get('original_id') or row.get('original_id'),
                      'page_url':detail.get('page_url') or row.get('page_url'),
                      'file_size':detail.get('file_size') or row.get('file_size'),
                      'stock':detail.get('stock'),
                      'type':detail.get('type'),
                      'content_prefix':re.sub(r'\s+',' ',str(detail.get('content') or '')).strip()[:1600],
                  }
                  results.append(rec); print('MATCH',json.dumps(rec,ensure_ascii=False))
          print('SUMMARY',json.dumps({'count':len(results),'results':results},ensure_ascii=False))
          PY
