name: Search Jinlongyu public reports 20261015

on:
  push:
    paths:
      - '.triggers/jinlongyu-002882-fx-search-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Search report metadata
        shell: bash
        run: |
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
          ep='https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          seen={}
          for keyword in ['金龙羽','002882','金龙羽 固态电池','金龙羽 电线电缆']:
            for page in range(1,31):
              body={'keywords':keyword,'pageIndex':page,'pageSize':20,'order':2,'nop':-1}
              r=s.post(ep,json=body,timeout=60,headers={'Content-Type':'application/json'})
              print('QUERY',keyword,page,r.status_code,len(r.content),flush=True)
              if r.status_code!=200: break
              j=r.json(); rows=((j.get('data') or {}).get('dataList') or [])
              print('COUNT',keyword,page,len(rows),'CODE',j.get('code'),flush=True)
              if not rows: break
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if '002882' in blob or '金龙羽' in blob:
                  did=str(row.get('docId') or '')
                  if did: seen[did]=row
              if len(rows)<20: break
          print('TOTAL',len(seen),flush=True)
          for row in sorted(seen.values(),key=lambda x:int(x.get('pubTime') or 0),reverse=True):
            print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
          PY
