name: Probe free Sanwei report viewers

on:
  pull_request:
    paths:
      - 'tasks/probe-sanwei-fxbaogao-browser-20261014.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright requests pillow
          python -m playwright install --with-deps chromium
      - name: Inspect free report viewers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          from playwright.sync_api import sync_playwright

          reports = {
            'guosheng': 'https://fxbaogao.com/detail/4736599',
            'debang': 'https://www.fxbaogao.com/detail/4790436',
            'caitong': 'https://www.fxbaogao.com/detail/4665308',
          }
          out=pathlib.Path('browser_probe'); out.mkdir()
          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for name,url in reports.items():
              context=browser.new_context(viewport={'width':1440,'height':1000},user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',locale='zh-CN')
              page=context.new_page()
              assets=[]
              page.on('response',lambda resp,assets=assets: assets.append(resp.url) if ('report-image' in resp.url or '.pdf' in resp.url.lower() or 'download' in resp.url.lower() or '/api/' in resp.url.lower()) else None)
              page.goto(url,wait_until='networkidle',timeout=180000); page.wait_for_timeout(5000)
              print('REPORT',name,'TITLE',page.title(),flush=True)
              text=(page.locator('body').inner_text(timeout=30000) or '')
              (out/f'{name}_before.txt').write_text(text,encoding='utf-8')
              print('BODY_SNIP',name,text[:4000].replace('\n',' | '),flush=True)
              for selector in ['text=点击免费查看完整报告','text=免费查看完整报告','text=查看完整报告','button:has-text("免费")','a:has-text("免费")','button:has-text("完整报告")','a:has-text("完整报告")']:
                try:
                  loc=page.locator(selector).first
                  if loc.count():
                    print('CONTROL',name,selector,'visible',loc.is_visible(),'html',loc.evaluate('(e)=>e.outerHTML')[:1000],flush=True)
                except Exception as e: print('CONTROL_ERR',name,selector,repr(e),flush=True)
              clicked=False
              for selector in ['text=点击免费查看完整报告','text=免费查看完整报告','text=查看完整报告','button:has-text("免费")','a:has-text("免费")','button:has-text("完整报告")','a:has-text("完整报告")']:
                try:
                  loc=page.locator(selector).first
                  if loc.count():
                    loc.scroll_into_view_if_needed(timeout=10000)
                    loc.click(force=True,timeout=10000)
                    clicked=True
                    print('CLICKED',name,selector,flush=True)
                    page.wait_for_timeout(5000)
                    break
                except Exception as e: print('CLICK_ERR',name,selector,repr(e),flush=True)
              for _ in range(12):
                page.evaluate('window.scrollBy(0, Math.max(window.innerHeight*2, 1400))')
                page.wait_for_timeout(900)
              page.evaluate('window.scrollTo(0, document.body.scrollHeight)'); page.wait_for_timeout(5000)
              text2=(page.locator('body').inner_text(timeout=30000) or '')
              (out/f'{name}_after.txt').write_text(text2,encoding='utf-8')
              html=page.content(); (out/f'{name}.html').write_text(html,encoding='utf-8')
              page.screenshot(path=str(out/f'{name}.png'),full_page=True)
              images=[]
              imgs=page.locator('img')
              for i in range(imgs.count()):
                try:
                  src=imgs.nth(i).get_attribute('src') or imgs.nth(i).get_attribute('data-src') or imgs.nth(i).get_attribute('data-original')
                  if src and ('report-image' in src or 'report' in src.lower()): images.append(src)
                except Exception: pass
              print('CLICKED_STATE',name,clicked,'IMAGE_COUNT',len(images),flush=True)
              print('IMAGES',name,json.dumps(list(dict.fromkeys(images)),ensure_ascii=False,indent=2),flush=True)
              print('ASSETS',name,json.dumps(list(dict.fromkeys(assets)),ensure_ascii=False,indent=2),flush=True)
              context.close()
            browser.close()
          PY
      - name: Upload browser probe
        uses: actions/upload-artifact@v4
        with:
          name: sanwei-fxbaogao-browser-probe
          path: browser_probe/
          retention-days: 3
