name: Temporary Pingtan Development 9FZT inspect v8

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-9fzt-inspect-v8.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf
      - name: Inspect report list, scripts and APIs
        run: |
          mkdir -p out/pages out/scripts out/pdfs
          python - <<'PY'
          import hashlib, html, json, re, time, zipfile
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          O=Path('out'); H=O/'pages'; S=O/'scripts'; P=O/'pdfs'
          sess=requests.Session();sess.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          logs=[]; records=[]; candidates=[]; api_candidates=set(); pdfs=[]; seen=set()
          terms=['平潭发展','中福实业','福建中福','000592','乘平潭开发东风','主业稳健发展','依托林业资产','受益平潭实验区','建设两岸家园','扎根两岸家园']
          def note(*a):x=' '.join(map(str,a));print(x,flush=True);logs.append(x)
          def decode(r):
            for enc in [r.apparent_encoding,r.encoding,'gb18030','utf-8']:
              if not enc:continue
              try:return r.content.decode(enc,'replace')
              except:pass
            return r.content.decode('utf-8','replace')
          def clean(x,n=100):return re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x or '')).strip(' ._')[:n] or 'report'
          def save_pdf(content,meta,url):
            if len(content)<1500 or not content.lstrip().startswith(b'%PDF'):return False
            h=hashlib.sha256(content).hexdigest()
            if h in seen:return True
            seen.add(h);tmp=P/f'tmp_{h[:10]}.pdf';tmp.write_bytes(content)
            try:
              rd=PdfReader(str(tmp));pages=len(rd.pages);text=''
              for pg in rd.pages[:8]:
                try:text+='\n'+(pg.extract_text() or '')
                except:pass
            except Exception as e:note('BADPDF',url,repr(e));tmp.unlink(missing_ok=True);return False
            identity=any(k in text for k in ['平潭发展','中福实业','福建中福','000592'])
            title=meta.get('title') or '平潭发展研报';date=meta.get('date') or '';org=meta.get('org') or '未知机构'
            fn=f'{date}_{clean(org,35)}_{clean(title,95)}_{pages}页.pdf';dst=P/fn
            if dst.exists():dst=P/f'{h[:8]}_{fn}'
            tmp.rename(dst);pdfs.append({'file':dst.name,'pages':pages,'bytes':len(content),'sha256':h,'url':url,'identity':identity,'text_prefix':text[:1200],**meta});note('SAVED',dst.name,identity,url);return True
          def extract(text,base,source):
            raw=html.unescape(text).replace('\\/','/')
            soup=BeautifulSoup(text,'lxml')
            for tag in soup.find_all('a',href=True):
              label=' '.join(tag.stripped_strings);u=urljoin(base,tag['href'])
              if any(t in label+u for t in terms) or any(k in u.lower() for k in ['report','article','detail','contentid']):
                candidates.append({'title':label,'url':u,'source':source});note('CAND',label[:100],u)
            for tag in soup.find_all('script',src=True):
              u=urljoin(base,tag['src']);api_candidates.add(u)
            for u in re.findall(r'https?://[^\s"\'<>]+',raw,re.I):
              u=u.rstrip('),;')
              if any(k in u.lower() for k in ['api','report','article','detail','download','pdf','attach','file']):api_candidates.add(u)
            for pat in [r'["\']([^"\']*(?:api|report|article|detail|download|pdf|attach|file)[^"\']*)["\']']:
              for v in re.findall(pat,raw,re.I):
                if len(v)<1000:api_candidates.add(urljoin(base,v))
          start_urls=[
            'https://stock.9fzt.com/list/sz_000592_3.html',
            'http://stock.9fzt.com/list/sz_000592_3.html',
            'https://www.9fzt.com/stock/list/sz_000592_3.html',
            'https://www.9fzt.com/list/sz_000592_3.html',
            'https://stock.9fzt.com/stock/sz_000592.html',
            'https://www.9fzt.com/detail/sz_000592.html',
          ]
          for i,u in enumerate(start_urls):
            try:
              r=sess.get(u,timeout=45,allow_redirects=True);text=decode(r);note('START',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              (H/f'start_{i}.html').write_text(text,encoding='utf-8',errors='ignore')
              records.append({'requested':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'prefix':text[:2000]})
              save_pdf(r.content,{'title':'平潭发展研报','date':'','org':'九方智投'},r.url);extract(text,r.url,'start')
            except Exception as e:note('START_ERR',u,repr(e))
          # Fetch scripts and inspect endpoints/constants.
          for i,u in enumerate(list(api_candidates)[:250]):
            if not u.startswith(('http://','https://')):continue
            try:
              r=sess.get(u,timeout=45,allow_redirects=True,headers={'Referer':start_urls[0]});text=decode(r);note('SCRIPT/API',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              ext='.js' if 'javascript' in (r.headers.get('content-type') or '') or r.url.split('?')[0].endswith('.js') else '.txt'
              (S/f'resource_{i}{ext}').write_text(text[:3000000],encoding='utf-8',errors='ignore')
              records.append({'requested':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'prefix':text[:1500]})
              save_pdf(r.content,{'title':'平潭发展研报','date':'','org':'九方智投'},r.url);extract(text,r.url,'resource')
            except Exception as e:note('RESOURCE_ERR',u,repr(e))
            time.sleep(.1)
          # Deduplicate candidates and fetch target-looking pages.
          uniq=[];seen_u=set()
          for c in candidates:
            u=c['url']
            if u in seen_u:continue
            seen_u.add(u);uniq.append(c)
          for i,c in enumerate(uniq[:500]):
            u=c['url'];blob=c.get('title','')+' '+u
            if not (any(t in blob for t in terms) or any(k in u.lower() for k in ['report','article','detail','contentid'])):continue
            try:
              r=sess.get(u,timeout=50,allow_redirects=True,headers={'Referer':start_urls[0]});text=decode(r);note('DETAIL',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              (H/f'detail_{i}.html').write_text(text[:2000000],encoding='utf-8',errors='ignore')
              meta={'title':c.get('title') or '平潭发展研报','date':'','org':''}
              body=' '.join(BeautifulSoup(text,'lxml').stripped_strings)
              dm=re.search(r'(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})',body)
              if dm:meta['date']=f'{dm.group(1)}-{int(dm.group(2)):02d}-{int(dm.group(3)):02d}'
              for org in ['国海证券','中信建投证券','宏源证券','海通证券','国泰君安证券','民生证券','财达证券']:
                if org in body[:8000]:meta['org']=org;break
              save_pdf(r.content,meta,r.url);extract(text,r.url,'detail')
              records.append({'requested':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'title':c.get('title'),'prefix':text[:1800]})
            except Exception as e:note('DETAIL_ERR',u,repr(e))
            time.sleep(.1)
          (O/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'candidates.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'api_candidates.json').write_text(json.dumps(sorted(api_candidates),ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          with zipfile.ZipFile(O/'平潭发展_九方智投研报恢复包.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in P.glob('*.pdf'):z.write(f,f.name)
            z.write(O/'pdfs.json','pdfs.json')
          note('DONE','CANDS',len(uniq),'APIS',len(api_candidates),'PDFS',len(pdfs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-9fzt-inspect-v8
          path: out/
          if-no-files-found: error
          retention-days: 3
