name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe Hibor dynamic content endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          base_headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          }
          js_url='https://www.hibor.com.cn/hiborweb/DocDetailNew/js?v=JhJG5MdT9wDoAQX8-xy-bc9qho_6DU5Ailv07PYCEEg1'
          s=requests.Session(); s.trust_env=False; s.headers.update(base_headers)
          jr=s.get(js_url,timeout=(20,120)); print('JS',jr.status_code,len(jr.content),jr.headers.get('content-type'))
          Path('out/docdetail.js').write_bytes(jr.content)
          js=jr.text
          for line in js.splitlines():
            if any(k.lower() in line.lower() for k in ['newcontent','ncid','ajax','download','pdf','docdetail']):
              print('JS_LINE',line[:2000])

          pages=[
            ('180581','https://www.hibor.com.cn/docdetail_180581.html'),
            ('180909','https://www.hibor.com.cn/docdetail_180909.html'),
            ('128928','https://www.hibor.com.cn/docdetail_128928.html'),
            ('180711','https://www.hibor.com.cn/docdetail_180711.html'),
            ('181554','https://www.hibor.com.cn/docdetail_181554.html'),
          ]
          summary=[]
          for docid,url in pages:
            ss=requests.Session(); ss.trust_env=False; ss.headers.update(base_headers)
            r=ss.get(url,timeout=(20,120),allow_redirects=True)
            m=re.search(r"ncid\s*=\s*'([^']+)'",r.text)
            ncid=m.group(1) if m else ''
            print('PAGE',docid,r.status_code,r.url,'ncid',ncid,'cookies',dict(ss.cookies))
            endpoint=urljoin(r.url,'/hiborweb/DocDetail/NewContent')
            attempts=[]
            payloads=[
              ('post_form_ncid',{'ncid':ncid},None),
              ('post_form_id',{'id':ncid},None),
              ('post_form_Ncid',{'Ncid':ncid},None),
              ('post_json_ncid',None,{'ncid':ncid}),
              ('get_ncid',None,None),
            ]
            for label,data,jdata in payloads:
              try:
                headers={'Referer':r.url,'X-Requested-With':'XMLHttpRequest','Accept':'application/json,text/javascript,*/*;q=0.01'}
                if label=='get_ncid':
                  rr=ss.get(endpoint,params={'ncid':ncid},headers=headers,timeout=(20,120),allow_redirects=True)
                else:
                  rr=ss.post(endpoint,data=data,json=jdata,headers=headers,timeout=(20,120),allow_redirects=True)
                p=Path(f'out/{docid}_{label}.bin'); p.write_bytes(rr.content)
                text=rr.text[:10000]
                urls=re.findall(r'https?://[^\s"\'<>]+|/[A-Za-z0-9_./?=&%:-]{8,}',text)
                item={'docid':docid,'label':label,'status':rr.status_code,'final_url':rr.url,'bytes':len(rr.content),'content_type':rr.headers.get('content-type',''),'prefix':text[:800],'urls':urls[:100]}
                attempts.append(item)
                print('ATTEMPT_JSON',json.dumps(item,ensure_ascii=False))
              except Exception as exc:
                item={'docid':docid,'label':label,'error':repr(exc)}; attempts.append(item); print('ATTEMPT_JSON',json.dumps(item,ensure_ascii=False))
            summary.append({'docid':docid,'page_url':r.url,'ncid':ncid,'attempts':attempts})
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-hibor-content-probe
          path: out
          retention-days: 7
          if-no-files-found: error
