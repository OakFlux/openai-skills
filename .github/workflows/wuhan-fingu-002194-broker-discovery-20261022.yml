name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report index variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })
          api='https://reportapi.eastmoney.com/report/list'
          base={
            'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
            'ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31',
            'pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'',
            'p':'1','pageNum':'1','pageNumber':'1'
          }
          variants=[
            ('code_plain',{'code':'002194'}),
            ('code_szprefix',{'code':'SZ002194'}),
            ('code_suffix',{'code':'002194.SZ'}),
            ('stockCode',{'code':'','stockCode':'002194'}),
            ('securityCode',{'code':'','securityCode':'002194'}),
            ('name',{'code':'','stockName':'武汉凡谷'}),
            ('rcode',{'code':'','rcode':'002194'}),
          ]
          for label,extra in variants:
            p=base.copy(); p.update(extra)
            r=s.get(api,params=p,timeout=(20,120)); r.raise_for_status(); d=r.json(); rows=d.get('data') or []
            print('VARIANT',label,'HITS',d.get('hits'),'ROWS',len(rows))
            for x in rows[:10]:
              if str(x.get('stockCode') or '')=='002194' or '武汉凡谷' in str(x.get('title') or '') or '武汉凡谷' in str(x.get('stockName') or ''):
                print('MATCH',label,json.dumps(x,ensure_ascii=False,separators=(',',':')))

          # Known rating date from public historical forecast table.
          p=base.copy(); p.update({'code':'','beginTime':'2020-11-01','endTime':'2020-11-05'})
          for page in range(1,30):
            p.update({'pageNo':str(page),'p':str(page),'pageNum':str(page),'pageNumber':str(page)})
            r=s.get(api,params=p,timeout=(20,120)); r.raise_for_status(); d=r.json(); rows=d.get('data') or []
            print('WINDOW_PAGE',page,'HITS',d.get('hits'),'ROWS',len(rows))
            for x in rows:
              if str(x.get('stockCode') or '')=='002194' or '武汉凡谷' in str(x.get('title') or '') or '武汉凡谷' in str(x.get('stockName') or ''):
                print('WINDOW_MATCH',json.dumps(x,ensure_ascii=False,separators=(',',':')))
            if not rows or len(rows)<100: break
          PY
