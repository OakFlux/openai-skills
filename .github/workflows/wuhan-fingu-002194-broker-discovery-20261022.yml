name: Target Wuhan Fingu Exact Report Dates 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Scan exact historical dates and download matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          import requests

          api='https://reportapi.eastmoney.com/report/list'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          windows=[
            ('2020-08-09','2020-08-12'),
            ('2020-11-02','2020-11-04'),
            ('2019-10-23','2019-10-29'),
          ]
          qtypes=['0','1','2']
          matches=[]
          for begin,end in windows:
            for qtype in qtypes:
              for page in range(1,30):
                params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
                  'ratingChange':'*','beginTime':begin,'endTime':end,
                  'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'',
                  'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
                }
                r=s.get(api,params=params,timeout=(20,120)); r.raise_for_status()
                d=r.json(); rows=d.get('data') or []
                if page==1: print('WINDOW',begin,end,'QTYPE',qtype,'HITS',d.get('hits'),'ROWS',len(rows),'URL',r.url)
                for x in rows:
                  blob=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode','researcher','orgName','orgSName'])
                  wanted=(
                    '武汉凡谷' in blob or str(x.get('stockCode') or '')=='002194' or
                    '专注基站射频三十年' in blob or '5G滤波器再塑发展新天地' in blob or
                    '射频滤波器国产化机遇解析' in blob
                  )
                  if wanted:
                    item={'window':[begin,end],'qtype':qtype,'row':x}
                    code=str(x.get('infoCode') or '')
                    if not any(str(y['row'].get('infoCode') or '')==code and code for y in matches): matches.append(item)
                    print('MATCH',json.dumps(item,ensure_ascii=False,separators=(',',':')))
                if not rows or len(rows)<100: break
                time.sleep(.02)

          Path('out/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          for idx,item in enumerate(matches):
            x=item['row']; code=str(x.get('infoCode') or '')
            if not code: continue
            for prefix in ['H3','H2','H1','H4']:
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
              try:
                rr=s.get(url,timeout=(20,240),allow_redirects=True,headers={'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'})
                print('PDF',idx,prefix,rr.status_code,len(rr.content),rr.headers.get('content-type'),url,rr.content[:5])
                if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>30000:
                  Path(f'out/pdfs/{idx}_{prefix}_{code}.pdf').write_bytes(rr.content)
                  break
              except Exception as exc:
                print('PDF_ERROR',idx,prefix,repr(exc))
          PY
      - name: Upload target output
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-exact-date-recovery
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
