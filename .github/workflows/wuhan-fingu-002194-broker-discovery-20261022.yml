name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe SGPJBG report 16990 hosts
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils curl openssl
          mkdir -p out
          echo '=== DNS ==='
          for h in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com static.sgpjbg.com file.sgpjbg.com img.sgpjbg.com; do
            echo "--- $h"; dig +short "$h" A; dig +short "$h" CNAME; getent ahostsv4 "$h" || true
          done
          echo '=== TLS ==='
          for h in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com; do
            echo "--- $h"; timeout 15 openssl s_client -connect "$h:443" -servername "$h" -brief </dev/null 2>&1 | head -30 || true
          done
          echo '=== CURL PROBES ==='
          python - <<'PY'
          from __future__ import annotations
          import json, socket, ssl, urllib.request, urllib.error
          hosts=['bg.sgpjbg.com','www.sgpjbg.com','sgpjbg.com']
          paths=['/','/baogao/16990.html','/bgdown/16990.html','/download/16990.html','/down/16990.html']
          for host in hosts:
            try: print('PY_DNS',host,socket.getaddrinfo(host,443,type=socket.SOCK_STREAM))
            except Exception as e: print('PY_DNS_ERR',host,repr(e))
          PY
          for host in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com; do
            for path in / /baogao/16990.html /bgdown/16990.html /download/16990.html /down/16990.html; do
              key=$(echo "${host}${path}" | tr '/.' '__')
              echo "--- https://${host}${path}"
              curl -vkL --http1.1 --connect-timeout 15 --max-time 45 \
                -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
                -H 'Accept: text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8' \
                -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' \
                -e "https://${host}/baogao/16990.html" \
                -c out/cookies.txt -b out/cookies.txt \
                -D "out/${key}.headers" -o "out/${key}.body" \
                "https://${host}${path}" 2>"out/${key}.stderr" || true
              wc -c "out/${key}.body" 2>/dev/null || true
              head -c 20 "out/${key}.body" 2>/dev/null | od -An -tx1 || true
              sed -n '1,50p' "out/${key}.headers" 2>/dev/null || true
              tail -30 "out/${key}.stderr" 2>/dev/null || true
            done
          done
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-sgpjbg-16990-network-probe
          path: out
          retention-days: 7
          if-no-files-found: error
