name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe historical report pages and download links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          urls=[
            'https://www.hibor.com.cn/docdetail_180581.html',
            'https://www.hibor.com.cn/docdetail_180909.html',
            'https://www.hibor.com.cn/docdetail_128928.html',
            'https://www.hibor.com.cn/docdetail_180711.html',
            'https://www.hibor.com.cn/docdetail_181554.html',
            'https://www.microbell.com/repinfodetail_180581.html',
          ]
          summary=[]
          for i,url in enumerate(urls,1):
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              text=r.text
              Path(f'out/page_{i}.html').write_text(text,encoding='utf-8',errors='replace')
              hrefs=re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',text,re.I)
              resolved=[]
              for h in hrefs:
                u=urljoin(r.url,html.unescape(h))
                low=u.lower()
                if any(k in low for k in ['pdf','download','down','doc','report','file','view','preview']) or '原文' in h:
                  resolved.append(u)
              # Also capture strings that look like embedded file endpoints.
              embedded=re.findall(r'''https?://[^\s"'<>]+|/[A-Za-z0-9_./?=&%-]{8,}''',text)
              candidates=[]
              for u in resolved+embedded:
                if any(k in u.lower() for k in ['pdf','download','down','doc','report','file','view','preview']):
                  if u not in candidates: candidates.append(u)
              item={'input':url,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'title':re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:1],'candidates':candidates[:300]}
              summary.append(item)
              print('PAGE_JSON',json.dumps(item,ensure_ascii=False))
            except Exception as exc:
              item={'input':url,'error':repr(exc)}; summary.append(item)
              print('PAGE_JSON',json.dumps(item,ensure_ascii=False))
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-historical-report-page-probe
          path: out
          retention-days: 7
          if-no-files-found: error
