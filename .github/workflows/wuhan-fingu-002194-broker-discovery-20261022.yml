name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe mobile report viewer and direct assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/155 Mobile Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          ids=['180581','180909','128928','180711','181554','4368029']
          templates=[
            'https://wap.hibor.com.cn/repinfodetail_{id}.html',
            'https://wap.hibor.com.cn/docdetail_{id}.html',
            'https://www.hibor.com.cn/wap_detail.aspx?id={id}',
            'https://www.microbell.com/repinfodetail_{id}.html',
          ]
          summary=[]
          for docid in ids:
            for ti,tpl in enumerate(templates):
              url=tpl.format(id=docid)
              try:
                r=s.get(url,timeout=(20,120),allow_redirects=True)
                text=r.text
                name=f'{docid}_{ti}.html'; Path('out',name).write_text(text,encoding='utf-8',errors='replace')
                title=(re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S) or [''])[0]
                allurls=[]
                for h in re.findall(r'''(?:href|src|data-src|url|content)\s*=\s*["']([^"']+)["']''',text,re.I):
                  u=urljoin(r.url,html.unescape(h));
                  if u not in allurls: allurls.append(u)
                for u in re.findall(r'''https?://[^\s"'<>]+|/[A-Za-z0-9_./?=&%:+-]{8,}''',text):
                  u=urljoin(r.url,html.unescape(u))
                  if u not in allurls: allurls.append(u)
                interesting=[u for u in allurls if any(k in u.lower() for k in ['pdf','download','down','view','preview','image','img','page','report','repinfo','doc','file','read','original'])]
                item={'docid':docid,'template':ti,'input':url,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'title':re.sub('<[^>]+>','',title)[:300],'interesting':interesting[:400]}
                summary.append(item); print('MOBILE_JSON',json.dumps(item,ensure_ascii=False))
                for line in text.splitlines():
                  if any(k in line.lower() for k in ['pdf','download','downloadurl','viewurl','original','repinfodetail','pagecount','open report','报告原文','下载报告','打开报告','imgurl','imageurl']):
                    print('LINE',docid,ti,line[:2000])
              except Exception as exc:
                item={'docid':docid,'template':ti,'input':url,'error':repr(exc)}; summary.append(item); print('MOBILE_JSON',json.dumps(item,ensure_ascii=False))
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-mobile-viewer-probe
          path: out
          retention-days: 7
          if-no-files-found: error
