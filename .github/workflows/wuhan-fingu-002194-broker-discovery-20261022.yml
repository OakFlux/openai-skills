name: Probe 9FZT Wuhan Fingu Report Assets 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch page, scripts and discover report APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/scripts out/responses
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          page='https://www.9fzt.com/detail/sz_002194_10_650430884853.html'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          r=s.get(page,timeout=(20,120),allow_redirects=True); r.raise_for_status()
          Path('out/page.html').write_bytes(r.content)
          text=r.text
          print('PAGE',r.status_code,r.url,len(r.content),r.headers.get('content-type'))
          title=(re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S) or [''])[0]
          print('TITLE',re.sub('<[^>]+>',' ',title))

          # Collect all URLs and embedded identifiers.
          urls=[]
          for h in re.findall(r'''(?:href|src|data-src|data-url|data-api|url|content)\s*=\s*["']([^"']+)["']''',text,re.I):
            u=urljoin(r.url,html.unescape(h))
            if u not in urls: urls.append(u)
          for u in re.findall(r'''https?://[^\s"'<>]+|//[A-Za-z0-9.-]+/[A-Za-z0-9_./?=&%:+-]+|/[A-Za-z0-9_./?=&%:+-]{8,}''',text):
            u=urljoin(r.url,html.unescape(u))
            if u not in urls: urls.append(u)
          print('URLS',json.dumps(urls,ensure_ascii=False,indent=2))
          for line in text.splitlines():
            if any(k in line.lower() for k in ['650430884853','report','research','pdf','download','attach','研报','api','detail']):
              print('PAGE_LINE',line[:4000])

          # Fetch JS/CSS and scan for endpoint templates.
          scripts=[u for u in urls if urlparse(u).path.lower().endswith(('.js','.css'))]
          all_candidates=[]
          for idx,u in enumerate(scripts):
            try:
              rr=s.get(u,timeout=(20,120),allow_redirects=True,headers={'Referer':r.url})
              suffix='.js' if '.js' in urlparse(rr.url).path.lower() else '.css'
              Path(f'out/scripts/{idx:03d}{suffix}').write_bytes(rr.content)
              body=rr.text
              print('ASSET',idx,rr.status_code,rr.url,len(rr.content),rr.headers.get('content-type'))
              for line in body.splitlines():
                low=line.lower()
                if any(k in low for k in ['report','research','pdf','download','attach','650430884853','detailapi','yanbao','研报']):
                  print('ASSET_LINE',idx,line[:5000])
              for c in re.findall(r'''https?://[^\s"'<>]+|//[A-Za-z0-9.-]+/[A-Za-z0-9_./?=&%:+${}-]+|/[A-Za-z0-9_./?=&%:+${}-]{8,}''',body):
                if any(k in c.lower() for k in ['report','research','pdf','download','attach','detail','yanbao']):
                  all_candidates.append(urljoin(rr.url,c))
            except Exception as exc:
              print('ASSET_ERROR',u,repr(exc))
          all_candidates=list(dict.fromkeys(all_candidates))
          Path('out/candidates.json').write_text(json.dumps(all_candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CANDIDATES',json.dumps(all_candidates,ensure_ascii=False,indent=2))

          # Probe likely endpoint shapes around the visible record id.
          record='650430884853'; stock='002194'
          guessed=[]
          hosts=['https://www.9fzt.com','https://stock.9fzt.com','https://api.9fzt.com','https://openapi.9fzt.com']
          paths=[
            f'/api/detail/{record}', f'/api/report/{record}', f'/api/research/{record}',
            f'/api/v1/report/detail?id={record}', f'/api/v1/research/detail?id={record}',
            f'/api/report/detail?reportId={record}', f'/api/report/detail?id={record}',
            f'/report/download?id={record}', f'/api/report/download?id={record}',
            f'/detail/api?recordId={record}', f'/api/detail?recordId={record}',
            f'/api/stock/report/detail?stockCode={stock}&id={record}',
          ]
          for h in hosts:
            for p in paths: guessed.append(h+p)
          for idx,u in enumerate(list(dict.fromkeys(all_candidates+guessed))):
            try:
              rr=s.get(u,timeout=(10,40),allow_redirects=True,headers={
                'Referer':r.url,'Accept':'application/json,text/plain,application/pdf,*/*;q=0.8',
                'X-Requested-With':'XMLHttpRequest'
              })
              item={'url':u,'status':rr.status_code,'final_url':rr.url,'type':rr.headers.get('content-type',''),'bytes':len(rr.content),'prefix':rr.content[:80].hex()}
              if rr.status_code<500 and (len(rr.content)>100 or rr.content[:5]==b'%PDF-'):
                print('PROBE',json.dumps(item,ensure_ascii=False))
                Path(f'out/responses/{idx:04d}.bin').write_bytes(rr.content)
                Path(f'out/responses/{idx:04d}.json').write_text(json.dumps(item,ensure_ascii=False,indent=2),encoding='utf-8')
            except Exception as exc:
              pass
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-9fzt-asset-probe
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
