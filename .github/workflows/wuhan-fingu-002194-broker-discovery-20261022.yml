name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe SGPJBG pages and report links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          pages=[
            'https://www.sgpjbg.com/labels/sawluboqitedian.html',
            'https://www.sgpjbg.com/labels/luboqishishime.html',
            'https://www.sgpjbg.com/labels/shoujishepinluboqi.html',
            'https://www.sgpjbg.com/labels/luboqixingyefazhangaikuang.html',
            'https://bg.sgpjbg.com/zhuanti/jilintanguyanjiubaogao.html',
            'https://bg.sgpjbg.com/zhuanti/xintiandichanjituanbaogao.html',
          ]
          hits=[]
          for i,url in enumerate(pages):
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              text=r.text
              Path(f'out/page_{i}.html').write_text(text,encoding='utf-8',errors='replace')
              print('PAGE',i,r.status_code,r.url,len(r.content),r.headers.get('content-type'))
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',text,re.I|re.S):
                attrs=m.group(1); inner=re.sub(r'<[^>]+>',' ',m.group(2)); inner=html.unescape(re.sub(r'\s+',' ',inner)).strip()
                hm=re.search(r'href\s*=\s*["\']([^"\']+)',attrs,re.I)
                if not hm: continue
                href=urljoin(r.url,html.unescape(hm.group(1)))
                if '武汉凡谷' in inner or '专注基站射频三十年' in inner or '5G滤波器再塑发展新天地' in inner:
                  item={'page':r.url,'text':inner,'href':href,'attrs':attrs[:500]}
                  hits.append(item); print('HIT',json.dumps(item,ensure_ascii=False))
              # broad string context
              for kw in ['武汉凡谷','专注基站射频三十年','5G滤波器再塑发展新天地']:
                pos=text.find(kw)
                if pos>=0: print('CONTEXT',kw,text[max(0,pos-1200):pos+1800])
            except Exception as exc:
              print('PAGE_ERROR',url,repr(exc))
          # Fetch every unique matching href and enumerate candidate assets.
          seen=set()
          for j,item in enumerate(hits):
            url=item['href']
            if url in seen: continue
            seen.add(url)
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True,headers={'Referer':item['page']})
              text=r.text
              Path(f'out/hit_{j}.html').write_text(text,encoding='utf-8',errors='replace')
              urls=[]
              for h in re.findall(r'''(?:href|src|data-src|data-url|url|content)\s*=\s*["']([^"']+)["']''',text,re.I):
                u=urljoin(r.url,html.unescape(h))
                if u not in urls: urls.append(u)
              for u in re.findall(r'''https?://[^\s"'<>]+|/[A-Za-z0-9_./?=&%:+-]{8,}''',text):
                u=urljoin(r.url,html.unescape(u))
                if u not in urls: urls.append(u)
              interesting=[u for u in urls if any(k in u.lower() for k in ['pdf','download','down','file','attach','oss','cos','preview','view','baogao','bgdown'])]
              out={'input':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'interesting':interesting[:500]}
              print('HIT_PAGE',json.dumps(out,ensure_ascii=False))
              for line in text.splitlines():
                if any(k in line.lower() for k in ['.pdf','download','bgdown','baogao','fileurl','pdfurl','sourceurl','oss','attach']):
                  print('HIT_LINE',line[:2500])
            except Exception as exc:
              print('HIT_ERROR',url,repr(exc))
          Path('out/hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-sgpjbg-probe
          path: out
          retention-days: 7
          if-no-files-found: error
