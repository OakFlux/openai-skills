name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discovery-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })
          rows=[]
          for page in range(1,10):
            p={
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
              'ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31',
              'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'002194',
              'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
            }
            r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=(20,120))
            r.raise_for_status(); d=r.json(); batch=d.get('data') or []
            print('PAGE',page,'HITS',d.get('hits'),'ROWS',len(batch))
            if not batch: break
            rows.extend(batch)
            if len(batch)<100: break
          seen=set(); out=[]
          for x in rows:
            code=str(x.get('infoCode') or '')
            if not code or code in seen: continue
            seen.add(code)
            item={k:x.get(k) for k in [
              'title','stockName','stockCode','orgName','orgSName','publishDate','infoCode',
              'attachPages','attachSize','emRatingName','sRatingName','researcher','column','reportType'
            ]}
            out.append(item)
          out.sort(key=lambda x:(str(x.get('publishDate') or ''),int(x.get('attachPages') or 0)),reverse=True)
          print('TOTAL',len(out))
          for x in out:
            print('REPORT_JSON',json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY
