name: probe-donghu-eastmoney-js-v6

on:
  push:
    branches:
      - tmp/donghu-hightech-eastmoney-js-probe-20261104-v6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect page and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          url='https://data.eastmoney.com/report/600133.html'
          r=s.get(url,timeout=(15,30)); print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
          print('PAGE_HEAD',text[:3000])
          soup=BeautifulSoup(text,'lxml')
          scripts=[]
          for tag in soup.find_all('script'):
            src=tag.get('src')
            if src: scripts.append(urljoin(r.url,src))
            else:
              inline=tag.get_text('\n')
              if any(k in inline for k in ['report','list2','600133','stockCode']): print('INLINE',inline[:10000])
          print('SCRIPTS',len(scripts))
          for u in scripts: print('SCRIPT',u)
          for u in scripts:
            if not any(host in u for host in ['eastmoney','dfcfw','emdata','emweb']): continue
            try:
              rr=s.get(u,timeout=(15,30)); print('\nJS',rr.status_code,len(rr.content),u)
              js=rr.content.decode(rr.apparent_encoding or 'utf-8',errors='replace')
              if any(k in js for k in ['report/list','report/list2','list2','reportapi','stockCode','pageSize']):
                for pat in ['report/list2','report/list','reportapi','list2','stockCode','pageSize','qType']:
                  for m in list(re.finditer(re.escape(pat),js,re.I))[:10]:
                    print('MATCH',pat,re.sub(r'\s+',' ',js[max(0,m.start()-600):min(len(js),m.end()+1200)]))
            except Exception as e: print('JS_ERROR',u,repr(e))
          PY
