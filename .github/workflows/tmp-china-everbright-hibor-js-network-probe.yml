name: Temporary China Everbright Hibor JS and network probe

on:
  push:
    branches:
      - tmp/china-everbright-hibor-js-probe-20260831

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml Pillow selenium
      - name: Inspect static HTML, JS bundles, resource guesses, and browser network
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import re
          import shutil
          import time
          import urllib.parse

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          DETAIL = 'https://www.hibor.com.cn/repinfodetail_5073681.html'
          INTERNAL_IDS = ['5073633', '5073681']
          STAMP = '202604222229109838'

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://www.hibor.com.cn/',
          })

          r = s.get(DETAIL, timeout=60)
          r.raise_for_status()
          r.encoding = r.apparent_encoding or r.encoding or 'utf-8'
          html = r.text
          soup = BeautifulSoup(html, 'lxml')
          print('DETAIL', r.status_code, len(r.content), r.url, flush=True)

          # Print exact HTML around visible reader/download controls.
          patterns = ['打开报告原文', '下载报告', '点击浏览报告原文', '请阅读并同意免责条款']
          seen = set()
          for text_node in soup.find_all(string=True):
              text = str(text_node).strip()
              if not any(p in text for p in patterns):
                  continue
              tag = text_node.parent
              for level in range(4):
                  if not tag:
                      break
                  key = (level, str(tag)[:2000])
                  if key not in seen:
                      seen.add(key)
                      print('CONTROL_NODE', text, 'LEVEL', level, 'HTML', str(tag)[:6000], flush=True)
                  tag = tag.parent

          # Print forms, hidden inputs, onclick/data attributes and ID/class contexts.
          for tag in soup.find_all(True):
              attrs = dict(tag.attrs)
              blob = (tag.get_text(' ', strip=True) + ' ' + json.dumps(attrs, ensure_ascii=False)).lower()
              if any(k.lower() in blob for k in ['5073633', '5073681', STAMP, 'download', '报告原文', 'docview', 'openreport', 'checkmd5file', '浏览报告']):
                  print('INTERESTING_TAG', tag.name, str(tag)[:6000], flush=True)
          for form in soup.find_all('form'):
              print('FORM', str(form)[:8000], flush=True)
          for inp in soup.find_all('input'):
              if inp.get('type') == 'hidden' or any(k in str(inp.attrs).lower() for k in ['doc','file','did','report','download']):
                  print('INPUT', str(inp), flush=True)

          # Fetch and inspect JS bundles.
          script_urls = []
          for script in soup.find_all('script', src=True):
              src = urllib.parse.urljoin(r.url, script['src'])
              if src not in script_urls:
                  script_urls.append(src)
          for js_url in script_urls:
              try:
                  jr = s.get(js_url, timeout=60, headers={'Referer': DETAIL})
                  text = jr.text
                  print('\nJS', js_url, jr.status_code, len(jr.content), jr.headers.get('content-type'), hashlib.sha256(jr.content).hexdigest(), flush=True)
                  if not any(k in js_url.lower() for k in ['docdetail', 'layout']):
                      continue
                  keywords = [
                      'download', 'checkmd5file', 'pdf', 'docview', 'viewdoc', 'opendoc',
                      'openreport', 'reportoriginal', 'browse', 'readreport', 'getfile',
                      'getdoc', 'did=', 'document', 'freedownload', 'clientdownload'
                  ]
                  low = text.lower()
                  printed = set()
                  for keyword in keywords:
                      start = 0
                      while True:
                          pos = low.find(keyword, start)
                          if pos < 0:
                              break
                          left = max(0, pos - 500)
                          right = min(len(text), pos + 1000)
                          snippet = text[left:right]
                          marker = snippet[:300]
                          if marker not in printed:
                              printed.add(marker)
                              print('JS_CONTEXT', keyword, repr(snippet), flush=True)
                          start = pos + len(keyword)
                          if len(printed) > 140:
                              break
                      if len(printed) > 140:
                          break
                  paths = sorted(set(re.findall(r'''["']((?:https?:)?//[^"']+|/[^"']*(?:download|DownLoad|Download|pdf|PDF|file|File|doc|Doc|report|Report|browse|Browse|view|View)[^"']*)["']''', text)))
                  print('JS_PATHS', json.dumps(paths[:500], ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('JS_ERROR', js_url, repr(exc), flush=True)

          # Inspect the preview GIF: it may be animated or contain hidden frames.
          preview = f'https://huibobjb.hibor.com.cn/CheckMd5File/img/2026/4/{STAMP}.gif'
          pr = s.get(preview, timeout=60, headers={'Referer': DETAIL})
          print('PREVIEW', pr.status_code, len(pr.content), pr.headers.get('content-type'), pr.url, flush=True)
          if pr.status_code == 200 and len(pr.content) > 1000:
              try:
                  im = Image.open(io.BytesIO(pr.content))
                  print('PREVIEW_IMAGE', im.format, im.size, im.mode, 'FRAMES', getattr(im, 'n_frames', 1), 'INFO', im.info, flush=True)
                  for i in range(min(getattr(im, 'n_frames', 1), 30)):
                      im.seek(i)
                      print('PREVIEW_FRAME', i, im.size, im.mode, im.info.get('duration'), flush=True)
              except Exception as exc:
                  print('PREVIEW_IMAGE_ERROR', repr(exc), flush=True)

          # Probe plausible public resource paths. Status/size only.
          base_hosts = [
              'https://huibobjb.hibor.com.cn',
              'https://www.hibor.com.cn',
              'https://p.hibor.com.cn',
          ]
          resource_paths = []
          for root in ['', '/CheckMd5File', '/CheckMd5File/pdf', '/CheckMd5File/Pdf', '/CheckMd5File/PDF', '/CheckMd5File/file', '/CheckMd5File/File', '/CheckMd5File/files', '/CheckMd5File/doc', '/CheckMd5File/report', '/CheckMd5File/download', '/upload', '/uploads', '/pdf', '/files', '/report']:
              for ext in ['pdf', 'PDF', 'zip']:
                  resource_paths.extend([
                      f'{root}/2026/4/{STAMP}.{ext}',
                      f'{root}/{STAMP}.{ext}',
                  ])
          tested = set()
          for host in base_hosts:
              for path in resource_paths:
                  url = host + path
                  if url in tested:
                      continue
                  tested.add(url)
                  try:
                      rr = s.get(url, timeout=12, allow_redirects=False, headers={'Referer': DETAIL, 'Range': 'bytes=0-4095'})
                      if rr.status_code not in [404, 403] or len(rr.content) > 1000:
                          print('RESOURCE_PROBE', rr.status_code, len(rr.content), rr.headers.get('content-type'), rr.headers.get('location'), url, rr.content[:12].hex(), flush=True)
                  except Exception as exc:
                      pass

          # Browser automation: click public controls and capture requests/new windows.
          try:
              from selenium import webdriver
              from selenium.webdriver.chrome.options import Options
              from selenium.webdriver.common.by import By
              from selenium.webdriver.support.ui import WebDriverWait
              from selenium.webdriver.support import expected_conditions as EC

              chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium') or shutil.which('chromium-browser')
              driver_bin = shutil.which('chromedriver')
              print('BROWSER_BIN', chrome, driver_bin, flush=True)
              options = Options()
              options.add_argument('--headless=new')
              options.add_argument('--no-sandbox')
              options.add_argument('--disable-dev-shm-usage')
              options.add_argument('--window-size=1400,1200')
              options.add_argument('--disable-gpu')
              options.set_capability('goog:loggingPrefs', {'performance': 'ALL', 'browser': 'ALL'})
              driver = webdriver.Chrome(options=options)
              driver.get(DETAIL)
              WebDriverWait(driver, 25).until(lambda d: '中国光大控股' in d.page_source)
              print('BROWSER_URL', driver.current_url, 'WINDOWS', driver.window_handles, flush=True)

              # Dump matching elements, including non-anchor controls.
              elems = driver.find_elements(By.XPATH, "//*[contains(normalize-space(.),'打开报告原文') or contains(normalize-space(.),'下载报告') or contains(normalize-space(.),'浏览报告原文')]")
              dedup = set()
              for idx, elem in enumerate(elems):
                  try:
                      outer = elem.get_attribute('outerHTML') or ''
                      if outer in dedup:
                          continue
                      dedup.add(outer)
                      print('BROWSER_ELEMENT', idx, elem.tag_name, repr(elem.text[:200]), outer[:5000], flush=True)
                  except Exception as exc:
                      pass

              def drain_logs(label):
                  try:
                      entries = driver.get_log('performance')
                  except Exception:
                      entries = []
                  for entry in entries:
                      try:
                          msg = json.loads(entry['message'])['message']
                          method = msg.get('method')
                          params = msg.get('params') or {}
                          if method == 'Network.requestWillBeSent':
                              req = params.get('request') or {}
                              url = req.get('url') or ''
                              if any(k in url.lower() for k in ['hibor', 'pdf', 'download', 'checkmd5file', 'doc', 'report', 'file']):
                                  print('NETWORK_REQUEST', label, req.get('method'), url, req.get('postData'), flush=True)
                          elif method == 'Network.responseReceived':
                              resp = params.get('response') or {}
                              url = resp.get('url') or ''
                              if any(k in url.lower() for k in ['hibor', 'pdf', 'download', 'checkmd5file', 'doc', 'report', 'file']):
                                  print('NETWORK_RESPONSE', label, resp.get('status'), resp.get('mimeType'), url, flush=True)
                      except Exception:
                          continue

              drain_logs('initial')
              # Click the smallest visible controls by exact/near-exact text.
              selectors = [
                  "//*[normalize-space(text())='打开报告原文']",
                  "//*[normalize-space(text())='下载报告']",
                  "//*[contains(normalize-space(text()),'点击浏览报告原文')]",
              ]
              for sel in selectors:
                  matches = driver.find_elements(By.XPATH, sel)
                  for j, elem in enumerate(matches[:4]):
                      try:
                          if not elem.is_displayed():
                              continue
                          print('CLICKING', sel, j, elem.tag_name, elem.get_attribute('outerHTML')[:3000], flush=True)
                          before_handles = set(driver.window_handles)
                          driver.execute_script('arguments[0].scrollIntoView({block:"center"});', elem)
                          driver.execute_script('arguments[0].click();', elem)
                          time.sleep(3)
                          after_handles = set(driver.window_handles)
                          print('AFTER_CLICK', driver.current_url, list(after_handles), flush=True)
                          for handle in after_handles - before_handles:
                              driver.switch_to.window(handle)
                              print('NEW_WINDOW', driver.current_url, driver.title, flush=True)
                              drain_logs('new_window')
                              driver.close()
                              driver.switch_to.window(next(iter(before_handles)))
                          # Inspect modal/iframe created after click.
                          print('PAGE_AFTER_CLICK_SNIP', driver.page_source[-12000:], flush=True)
                          drain_logs('after_click')
                      except Exception as exc:
                          print('CLICK_ERROR', sel, j, repr(exc), flush=True)
              print('BROWSER_LOG', driver.get_log('browser'), flush=True)
              driver.quit()
          except Exception as exc:
              print('BROWSER_ERROR', repr(exc), flush=True)
          PY