name: Build Hubei Energy broker research-report package

on:
  push:
    branches: [tmp-hubei-energy-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hubei-energy-broker-package-final-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='湖北能源_券商研究报告_3份_含深度报告'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=000883' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 8 "$out" "$out.txt" 2>/dev/null
            grep -Eq '湖北能源|湖北能源集团股份有限公司' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202206061570328460_1.pdf' \
            "$PACKAGE/01_国信证券_水电业务稳定积极布局新能源和抽水蓄能_公司深度_2022-06-06.pdf" \
            25

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202408281639532173_1.pdf' \
            "$PACKAGE/02_国信证券_水电煤电业绩显著改善_公司跟踪_2024-08-28.pdf" \
            6

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202404291631644509_1.pdf' \
            "$PACKAGE/03_国信证券_24Q1业绩大幅增长来水向好促进盈利改善_公司跟踪_2024-04-29.pdf" \
            6

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('湖北能源_券商研究报告_3份_含深度报告')
          meta = {
              '01_国信证券_水电业务稳定积极布局新能源和抽水蓄能_公司深度_2022-06-06.pdf': {
                  'broker': '国信证券',
                  'title': '水电业务稳定，积极布局新能源和抽水蓄能',
                  'date': '2022-06-06',
                  'type': '公司深度报告',
                  'index': 'AP202206061570328460',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202206061570328460_1.pdf',
              },
              '02_国信证券_水电煤电业绩显著改善_公司跟踪_2024-08-28.pdf': {
                  'broker': '国信证券',
                  'title': '水电、煤电业绩显著改善，24H1归母净利润增幅较大',
                  'date': '2024-08-28',
                  'type': '公司跟踪报告',
                  'index': 'AP202408281639532173',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202408281639532173_1.pdf',
              },
              '03_国信证券_24Q1业绩大幅增长来水向好促进盈利改善_公司跟踪_2024-04-29.pdf': {
                  'broker': '国信证券',
                  'title': '24Q1业绩大幅增长，来水向好促进盈利改善',
                  'date': '2024-04-29',
                  'type': '公司跟踪报告',
                  'index': 'AP202404291631644509',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202404291631644509_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '湖北能源（000883）券商研究报告资料包',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 公开可直接下载且明确标注为公司深度报告的完整文件较少，本包收录1份28页公司深度报告。',
              '2. 为满足2—3份资料需求，另收录2份2024年公开完整公司跟踪报告；未使用网页摘要、付费预览或自行重建PDF。',
              '3. 三份文件均为券商发布的原始PDF，覆盖水电、煤电、新能源与抽水蓄能等主题。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')

          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Hubei-Energy-broker-research-reports-3
          path: 湖北能源_券商研究报告_3份_含深度报告/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
