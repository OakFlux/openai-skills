name: Discover Hubei Energy report PDF URLs

on:
  push:
    branches: [tmp-hubei-energy-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hubei-energy-pdf-url-discovery-20261016.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect report pages and attachment endpoints
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          fetch_page() {
            local name="$1"
            local url="$2"
            curl --http1.1 -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A "$UA" "$url" -D "${name}.headers" -o "${name}.html" || true
            echo "===== $name HEADERS ====="
            sed -n '1,80p' "${name}.headers" || true
            echo "===== $name PDF/URL CANDIDATES ====="
            python3 - "$name" <<'PY'
          import html, pathlib, re, sys
          name = sys.argv[1]
          p = pathlib.Path(name + '.html')
          if not p.exists():
              print('NO FILE')
              raise SystemExit
          raw = p.read_bytes()
          print('BYTES', len(raw), 'PREFIX', raw[:80])
          text = raw.decode('utf-8', errors='replace')
          text = html.unescape(text)
          patterns = [
              r'https?://[^\s"\'<>]+',
              r'//[^\s"\'<>]+',
              r'[^\s"\'<>]{0,120}\.pdf(?:\?[^\s"\'<>]*)?',
          ]
          seen = set()
          for pattern in patterns:
              for m in re.finditer(pattern, text, re.I):
                  s = m.group(0)
                  if any(k in s.lower() for k in ('pdf', 'download', 'report', 'attachment', 'file', 'view')) and s not in seen:
                      seen.add(s)
                      print(s[:1000])
          print('===== KEY LINES =====')
          for line in text.splitlines():
              if any(k in line.lower() for k in ('pdf', 'download', 'attachment', 'fileurl', 'reporturl', 'rptid', '研报附件')):
                  line = re.sub(r'\s+', ' ', line).strip()
                  if line:
                      print(line[:2000])
          PY
          }

          fetch_page sina_first 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/776531190726/index.phtml'
          fetch_page stockstar_2025 'https://stock.stockstar.com/JC2025121700034644.shtml'
          fetch_page fx_detail 'https://www.fxbaogao.com/detail/5191475'
          fetch_page fx_view 'https://www.fxbaogao.com/view?id=5191475'
          fetch_page stockstar_rating 'https://stock.quote.stockstar.com/corp/rating_000883.shtml'
