name: Package Wasion Holdings broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/wasion-broker-reports-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '威胜控股_03393_券商深度报告_2份'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_国元国际_威胜控股_海外业务高增长估值优势显著_2024-01-24.pdf',
                  'title': '海外业务高增长，估值优势显著',
                  'broker_expected': '国元国际',
                  'date': '2024-01-24',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202401251618102593_1.pdf',
                  'min_pages': 30,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '02_威胜控股_顺应配电侧高景气周期_2023-03-14.pdf',
                  'title': '顺应配电侧高景气周期',
                  'broker_expected': '',
                  'date': '2023-03-14',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202303141584246264_1.pdf',
                  'min_pages': 20,
                  'min_bytes': 300_000,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download(url: str, dest: Path, min_bytes: int) -> str:
              errs = []
              for attempt in range(1, 5):
                  tmp = dest.with_suffix('.pdf.part')
                  try:
                      with session.get(url, timeout=(30, 240), allow_redirects=True, stream=True) as r:
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, 'final', r.url, flush=True)
                          r.raise_for_status()
                          with tmp.open('wb') as fh:
                              for chunk in r.iter_content(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                          final_url = r.url
                      size = tmp.stat().st_size
                      head = tmp.read_bytes()[:8]
                      if size < min_bytes or not head.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF size={size} head={head!r}')
                      tmp.replace(dest)
                      return final_url
                  except Exception as exc:
                      errs.append(f'attempt {attempt}: {exc!r}')
                      tmp.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'download failed {url}: {errs}')

          broker_terms = [
              '国元国际', '国元证券', '中泰国际', '中泰证券', '东吴证券', '华泰证券',
              '开源证券', '兴业证券', '海通国际', '国泰君安', '申万宏源', '光大证券',
              '安信国际', '交银国际', '第一上海', '西证国际', '招银国际', '浙商证券',
          ]

          records = []
          seen = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download(doc['url'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample = ''
              for page in reader.pages[:min(8, pages)]:
                  try:
                      sample += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', sample)
              if not any(term in compact for term in ('威胜控股', '威勝控股', 'WasionHoldings', '03393', '3393')):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              title_compact = re.sub(r'[，,：:；;、\s]+', '', doc['title'])
              if title_compact not in re.sub(r'[，,：:；;、\s]+', '', sample):
                  raise RuntimeError(f'title could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen.add(sha)
              detected = [x for x in broker_terms if x in compact]
              broker = doc['broker_expected'] or (detected[0] if detected else '未从文本层可靠识别')
              rec = {
                  'filename': dest.name,
                  'company': '威胜控股有限公司（03393.HK）',
                  'title': doc['title'],
                  'broker': broker,
                  'report_date': doc['date'],
                  'pages': pages,
                  'bytes': len(data),
                  'source': '东方财富研报公开PDF镜像',
                  'source_url': final_url,
                  'sha256': sha,
              }
              records.append(rec)
              print('VALIDATED', json.dumps(rec, ensure_ascii=False), flush=True)
              print('FIRST_PAGES_TEXT_BEGIN', dest.name, flush=True)
              print(sample[:6000], flush=True)
              print('FIRST_PAGES_TEXT_END', dest.name, flush=True)

          # Rename the second report to include the detected broker when available.
          second = records[1]
          if second['broker'] != '未从文本层可靠识别':
              old = out / second['filename']
              new_name = f"02_{second['broker']}_威胜控股_顺应配电侧高景气周期_2023-03-14.pdf"
              new = out / new_name
              old.rename(new)
              second['filename'] = new_name

          readme = [
              '威胜控股有限公司（03393.HK）券商深度报告合集',
              '整理日期：2026-09-27',
              '',
              '本包收录2份能够公开匿名下载、公司身份与标题可核验、页数不少于20页的完整PDF。',
              '未收录仅有标题/摘要、需登录付费、仅有前几页预览或无法取得完整附件的研报。',
              '',
              '文件清单：',
          ]
          for i, r in enumerate(records, 1):
              readme.extend([
                  f"{i}. {r['broker']}｜{r['title']}",
                  f"   日期：{r['report_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MiB",
                  f"   文件：{r['filename']}",
                  f"   来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、报告标题、公司身份、实际页数、qpdf结构检查、重复哈希检查、ZIP CRC及SHA-256。')
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for p in sorted(out.iterdir()):
                  zf.write(p, arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: wasion-holdings-broker-reports-final
          path: 威胜控股_03393_券商深度报告_2份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
