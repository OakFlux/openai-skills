name: Fetch exact Adisseo 600299 deep report via API 20261016

on:
  push:
    paths:
      - '.github/workflows/adisseo-600299-exact-deep-report-api-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Query exact stock and fetch long report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time
          from pathlib import Path
          from typing import Any
          import requests
          from pypdf import PdfReader

          out=Path('adisseo_exact_deep'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=600299',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def parse_payload(text:str)->Any:
              text=text.strip()
              try: return json.loads(text)
              except Exception: pass
              m=re.search(r'^[^(]*\((.*)\)\s*;?$',text,re.S)
              if m:
                  try: return json.loads(m.group(1))
                  except Exception: pass
              return None

          def collect_rows(payload:Any)->list[dict[str,Any]]:
              if isinstance(payload,list): return [x for x in payload if isinstance(x,dict)]
              rows=[]
              if not isinstance(payload,dict): return rows
              stack=[payload]; visited=set()
              while stack:
                  cur=stack.pop()
                  if id(cur) in visited: continue
                  visited.add(id(cur))
                  for val in cur.values():
                      if isinstance(val,dict): stack.append(val)
                      elif isinstance(val,list):
                          ds=[x for x in val if isinstance(x,dict)]
                          if ds and any(any(k in x for k in ['infoCode','title','stockCode','orgSName','publishDate']) for x in ds): rows.extend(ds)
                          else: stack.extend(ds)
              return rows

          api='https://reportapi.eastmoney.com/report/list'
          all_rows=[]; seen=set(); request_log=[]
          date_windows=[
              ('2025-08-01','2025-11-15'),('20250801','20251115'),
              ('2020-03-01','2020-06-30'),('20200301','20200630'),
              ('2019-01-01','2026-10-16'),
          ]
          code_param_cases=[('code','600299'),('stockCode','600299')]
          for code_key,code_val in code_param_cases:
              for begin,end in date_windows:
                  for qtype in ['0','1','2']:
                      for page in range(1,6):
                          params={
                              'pageSize':'100','pageNo':str(page),'p':str(page),'pageNum':str(page),'pageNumber':str(page),
                              'qType':qtype,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*',
                              'fields':'','orgCode':'','author':'','rcode':'',
                              code_key:code_val,'beginTime':begin,'endTime':end,
                          }
                          payload=None; meta=None
                          for attempt in range(5):
                              try:
                                  r=s.get(api,params=params,timeout=(20,120))
                                  meta={'code_key':code_key,'begin':begin,'end':end,'qType':qtype,'page':page,'status':r.status_code,'bytes':len(r.content),'url':r.url,'prefix':r.text[:200]}
                                  if r.status_code==200:
                                      payload=parse_payload(r.text)
                                      if payload is not None: break
                              except Exception as exc:
                                  meta={'code_key':code_key,'begin':begin,'end':end,'qType':qtype,'page':page,'error':repr(exc)}
                              time.sleep(1+attempt)
                          request_log.append(meta)
                          if payload is None: break
                          rows=collect_rows(payload)
                          if not rows: break
                          added=0
                          for row in rows:
                              code=str(row.get('infoCode') or row.get('info_code') or row.get('reportCode') or row.get('rcode') or '')
                              key=code or json.dumps(row,ensure_ascii=False,sort_keys=True)
                              if key in seen: continue
                              seen.add(key); all_rows.append(row); added+=1
                          if len(rows)<100 or added==0: break
                          time.sleep(0.05)

          (out/'request_log.json').write_text(json.dumps(request_log,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'all_rows.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')

          def compact(x:Any)->str: return re.sub(r'\s+','',str(x or ''))
          def get(row:dict[str,Any],*keys:str)->str:
              for k in keys:
                  v=row.get(k)
                  if v not in (None,''): return str(v)
              return ''

          issuer_rows=[]
          scored=[]
          for row in all_rows:
              stock_code=get(row,'stockCode','stock_code','securityCode')
              stock_name=get(row,'stockName','stock_name','securityName')
              title=get(row,'title','reportTitle','reportName')
              broker=get(row,'orgSName','orgName','organization')
              pages_raw=get(row,'attachPages','pages','pageCount')
              try: pages=int(float(pages_raw)) if pages_raw else 0
              except Exception: pages=0
              if stock_code=='600299' or '安迪苏' in stock_name or '安迪苏' in title:
                  issuer_rows.append(row)
                  ct=compact(title)
                  score=0
                  if '全球蛋氨酸行业龙头' in ct: score+=1000
                  if '特种产品蓬勃发展' in ct: score+=800
                  if '蛋氨酸拐点在即' in ct: score+=700
                  if 'VA高景气周期' in ct: score+=600
                  if '首次覆盖' in ct: score+=300
                  if '深度' in ct: score+=250
                  if '东吴' in broker: score+=100
                  score+=min(pages,100)*10
                  if get(row,'infoCode','info_code','reportCode','rcode'): score+=50
                  scored.append((score,pages,row))

          scored.sort(key=lambda x:(x[0],x[1],get(x[2],'publishDate','date')),reverse=True)
          (out/'issuer_rows.json').write_text(json.dumps(issuer_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'ranked_candidates.json').write_text(json.dumps([
              {'score':score,'pages':pages,'title':get(row,'title','reportTitle','reportName'),'stockName':get(row,'stockName'),'stockCode':get(row,'stockCode'),'broker':get(row,'orgSName','orgName'),'date':get(row,'publishDate','date'),'infoCode':get(row,'infoCode','info_code','reportCode','rcode'),'row':row}
              for score,pages,row in scored[:100]
          ],ensure_ascii=False,indent=2),encoding='utf-8')
          print('ALL_ROWS',len(all_rows),'ISSUER_ROWS',len(issuer_rows),flush=True)
          print('TOP',json.dumps([
              {'score':x[0],'pages':x[1],'title':get(x[2],'title','reportTitle','reportName'),'broker':get(x[2],'orgSName','orgName'),'date':get(x[2],'publishDate','date'),'infoCode':get(x[2],'infoCode','info_code','reportCode','rcode')}
              for x in scored[:30]
          ],ensure_ascii=False,indent=2),flush=True)

          if not scored:
              raise RuntimeError('No Adisseo rows found with exact-stock API variants')

          download_failures=[]
          selected=None
          for score,indexed_pages,row in scored:
              code=get(row,'infoCode','info_code','reportCode','rcode')
              title=get(row,'title','reportTitle','reportName')
              if not code: continue
              ct=compact(title)
              is_target=any(k in ct for k in ['全球蛋氨酸行业龙头','特种产品蓬勃发展','蛋氨酸拐点在即','VA高景气周期'])
              if not is_target and indexed_pages<15: continue
              detail=f'https://data.eastmoney.com/report/info/{code}.html'
              attempts=[]; data=None; pdf_url=None
              for prefix in ['H3','H2','H1','H4']:
                  url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
                  for attempt in range(5):
                      try:
                          rr=s.get(url,timeout=(30,300),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'})
                          attempts.append({'url':url,'status':rr.status_code,'bytes':len(rr.content),'type':rr.headers.get('content-type',''),'final_url':rr.url})
                          if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>150000:
                              data=rr.content; pdf_url=url; break
                      except Exception as exc:
                          attempts.append({'url':url,'error':repr(exc)})
                      time.sleep(1+attempt)
                  if data is not None: break
              if data is None:
                  download_failures.append({'code':code,'title':title,'attempts':attempts[-12:]})
                  continue
              safe_title=re.sub(r'[\\/:*?"<>|]+','_',title).strip()[:100]
              filename=f"{get(row,'orgSName','orgName') or '券商'}_安迪苏_{safe_title}_{get(row,'publishDate','date')[:10]}.pdf"
              dest=out/filename; dest.write_bytes(data)
              try:
                  reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              except Exception as exc:
                  download_failures.append({'code':code,'title':title,'error':'PdfReader '+repr(exc)}); dest.unlink(missing_ok=True); continue
              if pages<15:
                  download_failures.append({'code':code,'title':title,'error':f'too few pages {pages}'}); dest.unlink(missing_ok=True); continue
              text=''
              for p in reader.pages[:min(15,pages)]:
                  try: text+='\n'+(p.extract_text() or '')
                  except Exception: pass
              ctext=compact(text)
              hits=[x for x in ['安迪苏','600299','蓝星安迪苏','全球蛋氨酸行业龙头','特种产品蓬勃发展','蛋氨酸拐点在即','VA高景气周期'] if compact(x) in ctext]
              if len(ctext)>300 and not any(x in hits for x in ['安迪苏','600299','蓝星安迪苏']):
                  download_failures.append({'code':code,'title':title,'error':'issuer text mismatch','hits':hits}); dest.unlink(missing_ok=True); continue
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=out/'首页预览.png'
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(preview.with_suffix(''))],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              if not preview.exists() or preview.stat().st_size<10000:
                  raise RuntimeError('Preview rendering failed')
              sha=hashlib.sha256(data).hexdigest()
              selected={'filename':filename,'title':title,'broker':get(row,'orgSName','orgName'),'authors':get(row,'researcher','author'),'date':get(row,'publishDate','date')[:10],'infoCode':code,'indexed_pages':indexed_pages,'actual_pages':pages,'bytes':len(data),'sha256':sha,'source_report_page':detail,'pdf_url':pdf_url,'text_hits':hits,'download_attempts':attempts,'raw_row':row}
              break

          (out/'download_failures.json').write_text(json.dumps(download_failures,ensure_ascii=False,indent=2),encoding='utf-8')
          if selected is None:
              raise RuntimeError('Exact stock records found but no long original PDF passed validation')
          (out/'manifest.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SELECTED',json.dumps(selected,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload exact long report
        uses: actions/upload-artifact@v4
        with:
          name: adisseo-600299-exact-deep-report
          path: adisseo_exact_deep
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
