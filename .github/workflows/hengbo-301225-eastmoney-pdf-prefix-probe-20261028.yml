name: Probe Hengbo Eastmoney PDF prefixes 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-eastmoney-pdf-prefix-probe-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe prefixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          for code in ['AP202606051823263343','AP202511241787234946','AP202305311587369843']:
            page=f'https://data.eastmoney.com/report/info/{code}.html'
            print('\nCODE',code)
            try:
              rp=s.get(page,headers={'User-Agent':ua,'Accept':'text/html,*/*'},timeout=(10,30))
              print('PAGE',rp.status_code,len(rp.content),rp.url)
            except Exception as e: print('PAGEERR',repr(e))
            for p in ['H3','H2','H1','H4']:
              u=f'https://pdf.dfcfw.com/pdf/{p}_{code}_1.pdf'
              try:
                r=s.get(u,headers={'User-Agent':ua,'Referer':page,'Accept':'application/pdf,*/*;q=0.8','Origin':'https://data.eastmoney.com'},timeout=(10,25),allow_redirects=True)
                print(p,r.status_code,len(r.content),r.headers.get('content-type'),repr(r.content[:10]),r.url)
              except Exception as e: print(p,'ERR',repr(e))
          PY
