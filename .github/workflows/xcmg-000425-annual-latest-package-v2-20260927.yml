name: Build XCMG Machinery 000425 annual and latest report package v2 20260927

on:
  push:
    paths:
      - '.github/workflows/xcmg-000425-annual-latest-package-v2-20260927.yml'
      - 'scripts/xcmg_reports_20260927.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf
      - name: Build package
        run: python scripts/xcmg_reports_20260927.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xcmg-000425-annual-latest-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
