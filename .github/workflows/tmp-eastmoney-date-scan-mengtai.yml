name: Temporary Scan Eastmoney Mengtai Reports by Date

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-eastmoney-date-scan-mengtai.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-mengtai-reports-20260830
          fetch-depth: 0
      - name: Query narrow date windows without stock code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,requests,time
          from pathlib import Path
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'})
          windows=[
            ('2023-06-12','2023-06-14'),('2023-04-24','2023-04-26'),
            ('2022-08-11','2022-08-13'),('2021-08-09','2021-08-12'),('2021-06-22','2021-06-24'),
            ('2024-04-01','2024-04-16')]
          results=[]
          for begin,end in windows:
            for code in ['*','']:
              params={'industryCode':'*','pageSize':'1000','industry':'*','rating':'','ratingchange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','_':str(int(time.time()*1000))}
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
                payload=r.json(); rows=payload.get('data') or []
                matches=[]
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False)
                  if any(k in blob for k in ['300876','蒙泰高新','丙纶长丝行业领跑者','丙纶景气触底','双基地强势进军碳纤维','布局碳纤维打开新增量']): matches.append(x)
                item={'begin':begin,'end':end,'code':code,'status':r.status_code,'hits':payload.get('hits'),'size':payload.get('size'),'rows':len(rows),'matches':matches}
              except Exception as e:item={'begin':begin,'end':end,'code':code,'error':repr(e)}
              results.append(item);print('SCAN_JSON='+json.dumps(item,ensure_ascii=False),flush=True)
          Path('discoveries').mkdir(exist_ok=True)
          Path('discoveries/mengtai_eastmoney_date_scan.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit results
        shell: bash
        run: |
          git config user.name 'OpenAI Report Discovery'
          git config user.email 'actions@users.noreply.github.com'
          git add discoveries/mengtai_eastmoney_date_scan.json
          git commit -m 'chore: persist Mengtai Eastmoney date scan' || exit 0
          git push origin HEAD:tmp/fetch-mengtai-reports-20260830
