name: Temporary Scan Eastmoney Mengtai Reports by Date

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-eastmoney-date-scan-mengtai.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query narrow date windows without stock code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,requests,time
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'})
          windows=[
            ('2023-06-12','2023-06-14'),('2023-04-24','2023-04-26'),
            ('2022-08-11','2022-08-13'),('2021-08-09','2021-08-12'),('2021-06-22','2021-06-24'),
            ('2024-04-01','2024-04-16')]
          for begin,end in windows:
            for code in ['*','']:
              params={'industryCode':'*','pageSize':'1000','industry':'*','rating':'','ratingchange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','cb':'','_':str(int(time.time()*1000))}
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
                payload=r.json(); rows=payload.get('data') or []
                matches=[]
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False)
                  if '300876' in blob or '蒙泰高新' in blob or '丙纶长丝行业领跑者' in blob or '丙纶景气触底' in blob:
                    matches.append(x)
                print('SCAN_JSON='+json.dumps({'begin':begin,'end':end,'code':code,'status':r.status_code,'hits':payload.get('hits'),'size':payload.get('size'),'rows':len(rows),'matches':matches},ensure_ascii=False))
              except Exception as e: print('SCAN_JSON='+json.dumps({'begin':begin,'end':end,'code':code,'error':repr(e)},ensure_ascii=False))
          PY
