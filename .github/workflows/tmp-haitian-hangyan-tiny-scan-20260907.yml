name: Tiny scan exact Hangyan pages for Haitian International reports
on:
  push:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Scan exact likely pages
        run: |
          mkdir -p out
          python - <<'PY'
          import json,time,requests
          from bs4 import BeautifulSoup
          pages=list(range(480,492))+list(range(750,760))
          terms=['升级扩产双轮驱动','制造业产能再分布']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          hits=[]
          for p in pages:
              for attempt in range(6):
                  r=s.get('https://www.hangyan.co/reports',params={'page':p},timeout=60)
                  if r.status_code==200: break
                  print('RETRY',p,attempt,r.status_code,flush=True); time.sleep(3)
              print('PAGE',p,'STATUS',r.status_code,flush=True)
              if r.status_code!=200: continue
              soup=BeautifulSoup(r.text,'html.parser')
              cards=[]
              for a in soup.select('a[data-controller="protected-link"]'):
                  title=a.get_text(' ',strip=True)
                  box=a.find_parent('div',class_=lambda c:c and 'box' in c.split())
                  meta=box.get_text(' ',strip=True) if box else title
                  if ' | 202' in meta: cards.append(meta)
                  if any(t in title for t in terms):
                      hit={'page':p,'title':title,'meta':meta,'token':a.get('data-protected-link-token-value','')}
                      hits.append(hit); print('MATCH',json.dumps(hit,ensure_ascii=False),flush=True)
              if cards: print('RANGE',p,cards[0],'=>',cards[-1],flush=True)
              time.sleep(1.2)
          open('out/results.json','w',encoding='utf-8').write(json.dumps({'hits':hits},ensure_ascii=False,indent=2))
          print('RESULT',json.dumps(hits,ensure_ascii=False,indent=2),flush=True)
          if not hits: raise SystemExit('No target hits')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haitian-hangyan-tiny-scan
          path: out
          retention-days: 1
          compression-level: 0
