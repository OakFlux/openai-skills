name: Inspect Hangyan API references
on:
  push:
    branches: [tmp-hangyan-api-inspect-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public report page and scripts
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://www.hangyan.co/reports/3399260180989347557'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          r=s.get(url,timeout=60)
          print('PAGE',r.status_code,len(r.content),r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[]
          for tag in soup.find_all('script',src=True):
              scripts.append(urljoin(r.url,tag['src']))
          print('SCRIPTS',len(scripts))
          for script in scripts:
              print('SCRIPT',script)
              try:
                  body=s.get(script,timeout=60).text
                  for pattern in [r'https?://[^\"\' ]+',r'/api/[^\"\' ]+',r'graphql[^\"\' ]*',r'reports[^\"\' ]{0,120}']:
                      for match in list(dict.fromkeys(re.findall(pattern,body,re.I)))[:50]:
                          if any(k in match.lower() for k in ['api','report','search','graphql']): print('MATCH',match[:800])
              except Exception as e: print('ERR',repr(e))
          PY
