name: Package Kerry Properties broker reports

on:
  push:
    branches: [chatgpt-kerry-report-images-20260906]
    paths: ['.github/workflows/package-kerry-properties-reports.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Download, validate and package reports
        run: python scripts/package_kerry_properties_reports.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: kerry-properties-broker-reports-20260906
          path: |
            Kerry_Properties_Reports.zip
            Kerry_Properties_Broker_Reports.zip
            PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
