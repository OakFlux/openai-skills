name: Temporary Export Tianshun Wind Energy Report Metadata

on:
  push:
    branches:
      - tmp/tianshun-wind-reports-20260830
    paths:
      - .github/workflows/tmp-tianshun-wind-metadata.yml

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query Eastmoney report catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          from pathlib import Path
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/002531.html','Accept':'application/json,text/plain,*/*'})
          rows=[]
          for page in range(1,12):
            p={'industryCode':'*','pageSize':'100','industry':'*','rating':'','ratingchange':'*','beginTime':'2018-01-01','endTime':'2026-08-30','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'002531','rcode':'','_':str(int(time.time()*1000))}
            r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=60);r.raise_for_status();data=r.json().get('data') or []
            rows.extend(data)
            if len(data)<100:break
          Path('out').mkdir(exist_ok=True)
          Path('out/tianshun_report_catalogue.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          slim=[]
          for x in rows:
            slim.append({k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','researcher','ratingName','encodeUrl'] if k in x})
          print('CATALOGUE='+json.dumps(slim,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianshun-report-metadata
          path: out/tianshun_report_catalogue.json
          retention-days: 3
