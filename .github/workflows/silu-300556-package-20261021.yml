name: Build Silu Vision 300556 broker deep reports 20261021

on:
  push:
    paths:
      - '.github/workflows/silu-300556-package-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pymupdf

      - name: Discover validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import pymupdf
          import requests

          STOCK_CODE = '300556'
          COMPANY = '丝路视觉'
          COMPANY_FULL = '丝路视觉科技股份有限公司'
          PACKAGE = 'siluvision_300556_broker_deep_reports'
          ROOT = Path('丝路视觉_300556_券商深度报告_3份')
          PDFDIR = ROOT / '原始PDF'
          PREVIEW = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREVIEW):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36',
              'Referer': f'https://data.eastmoney.com/report/stock.jshtml?stockCode={STOCK_CODE}',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          api = 'https://reportapi.eastmoney.com/report/list'

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              text = re.sub(r'\s+', '', text)
              return text[:84]

          def download_pdf(info_code: str, detail_page: str) -> tuple[bytes, str, list[dict[str, Any]]]:
              attempts: list[dict[str, Any]] = []
              for prefix in ('H3', 'H2', 'H1', 'H4'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info_code}_1.pdf'
                  for attempt in range(5):
                      try:
                          r = session.get(
                              url,
                              timeout=(30, 360),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': detail_page,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          attempts.append({
                              'url': url,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 80_000:
                              return r.content, url, attempts
                      except Exception as exc:
                          attempts.append({'url': url, 'error': repr(exc)})
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {attempts[-12:]}')

          def inspect_pdf(data: bytes) -> dict[str, Any]:
              doc = pymupdf.open(stream=data, filetype='pdf')
              aliases = [COMPANY, COMPANY_FULL, STOCK_CODE, '丝路蓝', '瑞云科技', '瑞云渲染']
              page_hits: list[dict[str, Any]] = []
              snippets: list[dict[str, Any]] = []
              occurrences = 0
              for pno in range(doc.page_count):
                  text = doc.load_page(pno).get_text('text') or ''
                  compact = re.sub(r'\s+', '', text)
                  hits: dict[str, int] = {}
                  for alias in aliases:
                      alias_compact = re.sub(r'\s+', '', alias)
                      n = compact.count(alias_compact)
                      if not n:
                          continue
                      hits[alias] = n
                      occurrences += n
                      if len(snippets) < 15:
                          pos = compact.find(alias_compact)
                          if pos >= 0:
                              # Use normal text for readability when possible.
                              raw_pos = text.find(alias)
                              if raw_pos >= 0:
                                  context = ' '.join(text[max(0, raw_pos-160):raw_pos+len(alias)+280].split())
                              else:
                                  context = compact[max(0, pos-160):pos+len(alias_compact)+280]
                              snippets.append({'page': pno + 1, 'alias': alias, 'text': context})
                  if hits:
                      page_hits.append({'page': pno + 1, 'hits': hits})
              pages = doc.page_count
              doc.close()
              exact = any(
                  any(k in {'丝路视觉', COMPANY_FULL, STOCK_CODE} for k in entry['hits'])
                  for entry in page_hits
              )
              return {
                  'pages': pages,
                  'page_hits': page_hits,
                  'occurrences': occurrences,
                  'snippets': snippets,
                  'exact_company_found': exact,
              }

          # 1) Confirmed company-level first-coverage report.
          company_report = {
              'info_code': 'AP202406281637023181',
              'title': '首次覆盖：视觉即话语，细琢数字内容创意',
              'broker': '万联证券',
              'date': '2024-06-28',
              'analysts': '夏清莹、李中港',
              'rating': '增持',
              'metadata_pages': 21,
              'classification': '公司首次覆盖深度报告',
              'source_kind': 'company',
          }

          # 2) Scan industry deep reports and retain PDFs whose full text names the company.
          windows = [
              ('2023-01-01', '2023-03-31'), ('2023-04-01', '2023-06-30'),
              ('2023-07-01', '2023-09-30'), ('2023-10-01', '2023-12-31'),
              ('2024-01-01', '2024-03-31'), ('2024-04-01', '2024-06-30'),
              ('2024-07-01', '2024-09-30'), ('2024-10-01', '2024-12-31'),
              ('2025-01-01', '2025-03-31'), ('2025-04-01', '2025-06-30'),
              ('2025-07-01', '2025-09-30'), ('2025-10-01', '2025-12-31'),
              ('2026-01-01', '2026-03-31'), ('2026-04-01', '2026-06-30'),
              ('2026-07-01', '2026-10-21'),
          ]
          title_terms = [
              '数字创意', '数字视觉', '数字内容', '虚拟现实', '增强现实', '混合现实',
              '空间计算', '元宇宙', '沉浸式', '数字孪生', 'AIGC', '生成式AI',
              '文生视频', 'AI视频', '视频生成', '展览展示', '三维', 'CG', 'XR',
              'VR', 'MR', '影视', '文化传媒', '传媒', '数字人', '游戏引擎',
          ]
          rows: list[dict[str, Any]] = []
          seen: set[str] = set()
          request_log: list[dict[str, Any]] = []
          for begin, end in windows:
              total_pages = 1
              for page in range(1, 151):
                  if page > total_pages:
                      break
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*',
                      'beginTime': begin, 'endTime': end, 'pageNo': str(page),
                      'fields': '', 'qType': '1', 'orgCode': '', 'author': '',
                      'code': '', 'rcode': '', 'p': str(page),
                      'pageNum': str(page), 'pageNumber': str(page),
                  }
                  payload = None
                  last: dict[str, Any] = {}
                  for attempt in range(5):
                      try:
                          r = session.get(api, params=params, timeout=(20, 120))
                          last = {'begin': begin, 'end': end, 'page': page, 'status': r.status_code, 'bytes': len(r.content)}
                          if r.status_code == 200:
                              payload = r.json()
                              break
                      except Exception as exc:
                          last = {'begin': begin, 'end': end, 'page': page, 'error': repr(exc)}
                      time.sleep(1 + attempt)
                  request_log.append(last)
                  if payload is None:
                      break
                  total_pages = min(int(payload.get('TotalPage') or 1), 150)
                  data = payload.get('data') or []
                  if isinstance(data, dict):
                      data = data.get('list') or data.get('data') or []
                  if not isinstance(data, list) or not data:
                      break
                  for row in data:
                      if not isinstance(row, dict):
                          continue
                      info = str(row.get('infoCode') or '')
                      if not info or info in seen:
                          continue
                      seen.add(info)
                      title = str(row.get('title') or '')
                      pages = int(float(row.get('attachPages') or 0))
                      term_hits = [term for term in title_terms if term.lower() in title.lower()]
                      if pages >= 10 and term_hits:
                          row = dict(row)
                          row['_term_hits'] = term_hits
                          rows.append(row)
                  if len(data) < 100:
                      break
                  time.sleep(0.03)

          def candidate_score(row: dict[str, Any]) -> int:
              title = str(row.get('title') or '')
              pages = int(float(row.get('attachPages') or 0))
              date = str(row.get('publishDate') or '')[:10]
              year = int(date[:4]) if date[:4].isdigit() else 0
              score = pages * 3 + max(0, year - 2022) * 12
              for strong in ['空间计算', '虚拟现实', '数字创意', '数字视觉', 'XR', '元宇宙', 'AIGC', '数字孪生', '沉浸式']:
                  if strong.lower() in title.lower():
                      score += 80
              for weak in ['影视', '传媒', '三维', '数字内容', '数字人', '视频生成']:
                  if weak.lower() in title.lower():
                      score += 30
              if any(x in title for x in ['周报', '日报', '点评', '快报']):
                  score -= 100
              return score

          rows.sort(key=candidate_score, reverse=True)
          candidates_meta: list[dict[str, Any]] = []
          direct_candidates: list[dict[str, Any]] = []
          related_candidates: list[dict[str, Any]] = []
          for row in rows[:140]:
              info = str(row.get('infoCode') or '')
              detail = f'https://data.eastmoney.com/report/info/{info}.html'
              try:
                  data, pdf_url, attempts = download_pdf(info, detail)
                  inspection = inspect_pdf(data)
              except Exception as exc:
                  candidates_meta.append({'info_code': info, 'title': row.get('title'), 'error': repr(exc)})
                  continue
              item = {
                  'info_code': info,
                  'title': str(row.get('title') or ''),
                  'broker': str(row.get('orgSName') or row.get('orgName') or '未知机构'),
                  'date': str(row.get('publishDate') or '')[:10],
                  'analysts': row.get('researcher') or row.get('author') or '',
                  'rating': row.get('emRatingName') or row.get('sRatingName') or '',
                  'metadata_pages': int(float(row.get('attachPages') or 0)),
                  'classification': '行业深度报告（正文直接提及丝路视觉）' if inspection['page_hits'] else '高度相关行业深度报告',
                  'source_kind': 'industry_direct' if inspection['page_hits'] else 'industry_related',
                  'term_hits': row.get('_term_hits') or [],
                  'source_report_page': detail,
                  'pdf_url': pdf_url,
                  'download_attempts': attempts,
                  'data': data,
                  **inspection,
              }
              item['rank_score'] = (
                  (2000 if item['exact_company_found'] else 0)
                  + len(item['page_hits']) * 250
                  + item['occurrences'] * 45
                  + candidate_score(row)
              )
              candidates_meta.append({k: v for k, v in item.items() if k != 'data'})
              if item['page_hits']:
                  direct_candidates.append(item)
              else:
                  related_candidates.append(item)
              # Stop early once there are several strong direct alternatives.
              direct_brokers = {x['broker'] for x in direct_candidates}
              if len(direct_candidates) >= 5 and len(direct_brokers) >= 3:
                  break

          direct_candidates.sort(key=lambda x: (x['rank_score'], x['date']), reverse=True)
          related_candidates.sort(key=lambda x: (x['rank_score'], x['date']), reverse=True)

          selected_industry: list[dict[str, Any]] = []
          used_brokers = {'万联证券'}
          for item in direct_candidates:
              if item['broker'] in used_brokers:
                  continue
              selected_industry.append(item)
              used_brokers.add(item['broker'])
              if len(selected_industry) == 2:
                  break
          for item in direct_candidates:
              if len(selected_industry) == 2:
                  break
              if item not in selected_industry:
                  selected_industry.append(item)
          # Only use related reports as fallback, and keep at least two PDFs total.
          for item in related_candidates:
              if len(selected_industry) >= 2:
                  break
              if item['broker'] in used_brokers and selected_industry:
                  continue
              selected_industry.append(item)
              used_brokers.add(item['broker'])

          # Download and inspect company report.
          company_detail = f"https://data.eastmoney.com/report/info/{company_report['info_code']}.html"
          company_data, company_pdf_url, company_attempts = download_pdf(company_report['info_code'], company_detail)
          company_inspection = inspect_pdf(company_data)
          company_item = {
              **company_report,
              'source_report_page': company_detail,
              'pdf_url': company_pdf_url,
              'download_attempts': company_attempts,
              'data': company_data,
              **company_inspection,
          }

          selected = [company_item] + selected_industry[:2]
          if len(selected) < 2:
              raise RuntimeError('Only one usable report found; package not created.')

          manifest: list[dict[str, Any]] = []
          for idx, item in enumerate(selected, 1):
              filename = f"{idx:02d}_{safe_name(item['broker'])}_{safe_name(item['title'])}_{item['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(item['data'])
              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(prefix) + '.png')
              if not preview_file.exists() or preview_file.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview failed for {filename}')
              sha = hashlib.sha256(item['data']).hexdigest()
              manifest.append({
                  'filename': str(Path('原始PDF') / filename),
                  'broker': item['broker'],
                  'title': item['title'],
                  'date': item['date'],
                  'analysts': item.get('analysts', ''),
                  'rating': item.get('rating', ''),
                  'classification': item['classification'],
                  'pages': item['pages'],
                  'company_mention_pages': item.get('page_hits', []),
                  'company_mention_occurrences': item.get('occurrences', 0),
                  'exact_company_name_or_code_found': item.get('exact_company_found', False),
                  'mention_snippets': item.get('snippets', []),
                  'source_report_page': item['source_report_page'],
                  'pdf_url': item['pdf_url'],
                  'info_code': item['info_code'],
                  'sha256': sha,
                  'preview_file': str(Path('首页预览') / preview_file.name),
                  'validation': ['PDF header', 'page count', 'qpdf structure', 'first-page render', 'full-text company alias scan'],
              })

          direct_count = sum(bool(x['company_mention_pages']) for x in manifest)
          company_count = sum(x['classification'].startswith('公司') for x in manifest)
          readme = [
              '丝路视觉科技股份有限公司（300556.SZ）券商研究报告资料包',
              '整理日期：2026-10-21',
              '',
              f'本包共收录{len(manifest)}份券商原始完整PDF。',
              f'其中公司级首次覆盖报告{company_count}份；正文直接提及丝路视觉的行业深度报告{max(0, direct_count-company_count)}份。',
              '若收录高度相关行业报告但正文未检出公司名称，已在分类中明确标注，未将其表述为公司独立覆盖。',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              hit_pages = ', '.join(str(p['page']) for p in x['company_mention_pages']) or '未检出'
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}；页数：{x['pages']}",
                  f"   分类：{x['classification']}；丝路视觉命中页：{hit_pages}",
                  f"   文件：{x['filename']}",
                  f"   来源页面：{x['source_report_page']}",
                  f"   SHA-256：{x['sha256']}",
                  '',
              ]
          readme += [
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、实际页数、qpdf结构、首页渲染、全文公司名称/代码检索及ZIP CRC。',
          ]
          (ROOT / '00_文件清单与重要说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_scan.json').write_text(json.dumps(candidates_meta, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'request_log.json').write_text(json.dumps(request_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      zf.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest) or len(pdfs) < 2:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}, manifest={len(manifest)}')

          chinese_alias = Path('丝路视觉_300556_券商深度报告.zip')
          chinese_alias.write_bytes(zip_path.read_bytes())
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print('DIRECT_REPORTS', direct_count, 'COMPANY_REPORTS', company_count)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: siluvision-300556-broker-deep-reports-final
          path: |
            siluvision_300556_broker_deep_reports.zip
            丝路视觉_300556_券商深度报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
