name: probe-emeishan-000888-sina-report-links

on:
  push:
    branches:
      - tmp/emeishan-000888-sina-probe-20261104

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Probe Sina list and detail pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          list_url='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=000888&t1=2'
          r=s.get(list_url,timeout=(20,60)); print('LIST',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          r.encoding=r.apparent_encoding or 'gbk'
          soup=BeautifulSoup(r.text,'lxml')
          wanted=['金顶索道改造提质增能','立足佛教名山','着眼明年']
          detail_urls=[]
          for a in soup.find_all('a',href=True):
            txt=' '.join(a.get_text(' ',strip=True).split())
            href=urljoin(r.url,a['href'])
            if any(w in txt for w in wanted) or 'vReport_Show' in href:
              print('LINK',repr(txt),href)
            if any(w in txt for w in wanted): detail_urls.append(href)
          # Add known first-coverage detail page.
          detail_urls.append('https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/818061282486/index.phtml')
          seen=set()
          for u in detail_urls:
            if u in seen: continue
            seen.add(u)
            print('\nDETAIL',u)
            try:
              d=s.get(u,timeout=(20,60),allow_redirects=True)
              print('STATUS',d.status_code,len(d.content),d.url,d.headers.get('content-type'))
              d.encoding=d.apparent_encoding or 'gbk'
              print('HEAD',repr(d.text[:1200]))
              ds=BeautifulSoup(d.text,'lxml')
              candidates=[]
              for tag in ds.find_all(['a','iframe','embed','object','script','source']):
                for attr in ['href','src','data','value']:
                  v=tag.get(attr)
                  if v and any(k in v.lower() for k in ['.pdf','download','attach','file','report']): candidates.append(urljoin(d.url,v))
              for m in re.findall(r'https?://[^\s\"\'<>]+',d.text):
                if any(k in m.lower() for k in ['.pdf','download','attach','file','report']): candidates.append(m)
              for c in dict.fromkeys(candidates): print('CAND',c)
            except Exception as e:
              print('ERROR',repr(e))
          PY
