name: Package ST Xiwang 000639 broker reports 20261020 v3

on:
  push:
    branches:
      - tmp/st-xiwang-000639-broker-package-20261020-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF and CJK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          CODE = "000639"
          CURRENT_SHORT = "ST西王"
          REPORT_SHORT = "西王食品"
          FULL = "西王食品股份有限公司"
          PREPARED = "2026-10-20"
          ROOT_NAME = "ST西王_000639_券商深度报告_3份"
          OUTPUT_ZIP = "st_xiwang_000639_broker_reports_3.zip"
          ROOT = Path(ROOT_NAME)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def validate_pdf(path: Path, min_pages: int, required_tokens: list[str]) -> tuple[int, str, Path]:
              if path.read_bytes()[:5] != b"%PDF-":
                  raise RuntimeError(f"Invalid PDF header: {path.name}")
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < min_pages:
                  raise RuntimeError(f"Too few pages for {path.name}: {pages} < {min_pages}")
              text = ""
              for page in reader.pages[:min(40, pages)]:
                  try:
                      text += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              compact = re.sub(r"\s+", "", text)
              missing = [token for token in required_tokens if re.sub(r"\s+", "", token) not in compact]
              if missing:
                  raise RuntimeError(f"PDF text validation failed for {path.name}: missing={missing}")
              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW / path.stem
              subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "130", "-singlefile", str(path), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + ".png")
              if not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview rendering failed for {path.name}")
              return pages, text, preview

          def download_original(info_code: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf",
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  "User-Agent": session.headers["User-Agent"],
                                  "Referer": f"https://data.eastmoney.com/report/info/{info_code}.html",
                                  "Accept": "application/pdf,*/*;q=0.8",
                              },
                              timeout=(20, 180),
                              allow_redirects=True,
                          )
                          last = {
                              "url": url,
                              "status": response.status_code,
                              "content_type": response.headers.get("content-type", ""),
                              "bytes": len(response.content),
                              "final_url": response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b"%PDF-" and len(response.content) > 80_000:
                              return response.content, url, last
                      except Exception as exc:
                          last = {"url": url, "error": repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Original PDF download failed for {info_code}: {last}")

          def fetch_source(urls: list[str]) -> tuple[requests.Response, str]:
              failures = []
              for url in urls:
                  for attempt in range(4):
                      try:
                          response = session.get(url, timeout=(20, 120), allow_redirects=True)
                          if response.status_code == 200 and len(response.content) > 10_000:
                              return response, url
                          failures.append({"url": url, "status": response.status_code, "bytes": len(response.content)})
                      except Exception as exc:
                          failures.append({"url": url, "error": repr(exc)})
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to fetch any report text page: {failures}")

          manifest: list[dict[str, Any]] = []

          # 1. Publicly downloadable original PDF.
          original = {
              "info_code": "AP201902181297566184",
              "broker": "新时代证券",
              "date": "2019-02-17",
              "authors": "孙金钜、任浪",
              "title": "中小盘首次覆盖报告：运动保健新龙头，大健康航母扬帆起航",
              "rating": "强烈推荐",
              "filename": "01_20190217_新时代证券_首次覆盖_运动保健新龙头大健康航母扬帆起航_原始PDF.pdf",
          }
          data, pdf_url, download_meta = download_original(original["info_code"])
          original_path = ROOT / original["filename"]
          original_path.write_bytes(data)
          pages, _, preview = validate_pdf(original_path, 18, [REPORT_SHORT, CODE, "运动保健"])
          if abs(pages - 21) > 2:
              raise RuntimeError(f"Unexpected original report page count: {pages}")
          manifest.append({
              **original,
              "document_form": "券商原始PDF",
              "actual_pages": pages,
              "bytes": original_path.stat().st_size,
              "sha256": sha256_file(original_path),
              "source_page": f"https://data.eastmoney.com/report/info/{original['info_code']}.html",
              "pdf_url": pdf_url,
              "download_meta": download_meta,
              "preview_file": str(Path("首页预览") / preview.name),
              "note": "公开证券研报聚合渠道提供的券商原始PDF。",
          })

          web_specs = [
              {
                  "broker": "中信建投证券",
                  "date": "2019-05-21",
                  "authors": "花小伟、孙金琦",
                  "title": "食用油、运动保健双业并进，大健康龙头起航",
                  "filename": "02_20190521_中信建投证券_食用油运动保健双业并进大健康龙头起航_公开网页全文整理版_非原始PDF.pdf",
                  "urls": [
                      "https://www.9fzt.com/detail/sz_000639_10_611762809718.html",
                      "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/611762809718/index.phtml",
                  ],
              },
              {
                  "broker": "东方证券",
                  "date": "2019-03-24",
                  "authors": "王克宇",
                  "title": "健康食品旗舰，边际改善再出发",
                  "filename": "03_20190324_东方证券_健康食品旗舰边际改善再出发_公开网页全文整理版_非原始PDF.pdf",
                  "urls": [
                      "https://www.9fzt.com/detail/sz_000639_10_606734802632.html",
                      "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/606734802632/index.phtml",
                  ],
              },
          ]

          for spec in web_specs:
              response, requested_url = fetch_source(spec["urls"])
              response.encoding = response.apparent_encoding or response.encoding or "utf-8"
              soup = BeautifulSoup(response.text, "lxml")
              title_node = soup.select_one(".title-header") or soup.select_one("h1")
              body_node = soup.select_one(".detail-article-content") or soup.select_one(".blk_container")
              broker_node = soup.select_one(".date-type")
              date_node = soup.select_one(".date-time")
              if title_node is None or body_node is None:
                  raise RuntimeError(f"Report page structure changed: {response.url}")

              title = re.sub(r"\s+", " ", title_node.get_text(" ", strip=True)) or spec["title"]
              broker = re.sub(r"\s+", " ", broker_node.get_text(" ", strip=True)) if broker_node else spec["broker"]
              report_date = re.sub(r"\s+", " ", date_node.get_text(" ", strip=True)) if date_node else spec["date"]
              for tag in body_node.find_all(["script", "style", "iframe", "form", "button", "noscript"]):
                  tag.decompose()
              for tag in body_node.find_all(True):
                  for attr in ["style", "class", "id", "onclick", "width", "height"]:
                      tag.attrs.pop(attr, None)
              body_text = re.sub(r"\s+", " ", body_node.get_text(" ", strip=True))
              if REPORT_SHORT not in (title + " " + body_text) or len(body_text) < 1_500:
                  raise RuntimeError(f"Insufficient report body from {response.url}: chars={len(body_text)}")

              clean_html = f"""<!doctype html>
              <html lang="zh-CN"><head><meta charset="utf-8"><title>{html.escape(title)}</title>
              <style>
                @page {{ size:A4; margin:17mm 17mm 19mm 17mm; @bottom-center {{ content:"公开网页全文整理版 - 第 " counter(page) " 页 / " counter(pages) " 页"; font-size:8.5pt; color:#666; }} }}
                body {{ font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif; font-size:10.4pt; line-height:1.72; color:#222; word-break:break-word; }}
                h1 {{ font-size:19pt; line-height:1.38; margin:0 0 12pt; }}
                .meta {{ font-size:10pt; color:#444; border-bottom:1px solid #aaa; padding-bottom:9pt; margin-bottom:13pt; line-height:1.65; }}
                .notice {{ border:1.5px solid #8c3131; background:#fff8f4; padding:10pt 12pt; margin:8pt 0 16pt; font-size:9.7pt; line-height:1.6; }}
                .notice strong {{ color:#781f1f; }} .source {{ font-size:8.3pt; color:#666; margin-top:7pt; word-break:break-all; }}
                p {{ margin:0 0 9pt; text-align:justify; }} a {{ color:#222; text-decoration:none; }}
              </style></head><body>
              <h1>{html.escape(title)}</h1>
              <div class="meta">券商：{html.escape(broker)}<br>研究员：{html.escape(spec['authors'])}<br>发布日期：{html.escape(report_date)}</div>
              <div class="notice"><strong>文件性质说明：</strong>本文件依据公开网页展示的券商研报正文整理并打印为PDF，<strong>不是券商发布的原始PDF</strong>。原报告封面、图表、原始页码、研究员签名及部分附录可能未被网页保留。文件名和清单已明确标注文件性质。<div class="source">公开正文来源：{html.escape(response.url)}</div></div>
              {str(body_node)}</body></html>"""

              path = ROOT / spec["filename"]
              HTML(string=clean_html, base_url=response.url).write_pdf(str(path))
              pages, _, preview = validate_pdf(path, 2, [REPORT_SHORT, spec["date"][:4], spec["broker"][:2]])
              manifest.append({
                  **spec,
                  "broker": broker,
                  "date": report_date,
                  "title": title,
                  "document_form": "公开网页全文整理版（非券商原始PDF）",
                  "actual_pages": pages,
                  "bytes": path.stat().st_size,
                  "sha256": sha256_file(path),
                  "source_page": response.url,
                  "requested_source": requested_url,
                  "preview_file": str(Path("首页预览") / preview.name),
                  "note": "公开网页正文离线排版版；不是券商原始PDF，可能不含原报告图表、封面与原始版式。",
              })

          readme = [
              f"ST西王 / 西王食品（{CODE}.SZ）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包共收录3份公司深度/首次覆盖研究资料：1份券商原始PDF，2份公开网页全文离线整理版。",
              "公司近年券商覆盖较少，因此所选报告集中于2019年前后，主要用于梳理公司当时的食用油与运动营养双主业逻辑，不代表当前投资判断。",
              "两份网页整理版均在文件名、PDF首页、清单、CSV和JSON中明确标注“非券商原始PDF”。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；研究员：{item['authors']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['source_page']}",
                  f"   SHA-256：{item['sha256']}",
                  f"   说明：{item['note']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、PDF结构、实际页数、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company_current_short_name": CURRENT_SHORT,
              "company_report_name": REPORT_SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "文件性质", "券商", "研究员", "发布日期", "标题", "页数", "字节数", "SHA-256", "来源页面", "说明"])
              for item in manifest:
                  writer.writerow([item["filename"], item["document_form"], item["broker"], item["authors"], item["date"], item["title"], item["actual_pages"], item["bytes"], item["sha256"], item["source_page"], item["note"]])
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(f"{item['sha256']}  {item['filename']}" for item in manifest) + "\n", encoding="utf-8")

          zip_path = Path(OUTPUT_ZIP)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": sha256_file(zip_path),
              "report_count": len(manifest),
              "files": [{"name": x["filename"], "form": x["document_form"], "broker": x["broker"], "date": x["date"], "title": x["title"], "pages": x["actual_pages"], "bytes": x["bytes"], "sha256": x["sha256"]} for x in manifest],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: st-xiwang-000639-broker-reports-20261020-v3
          path: st_xiwang_000639_broker_reports_3.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
