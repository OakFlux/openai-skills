name: Daqo Energy Prospectus Probe

on:
  push:
    branches:
      - chatgpt-daqoenergy-filings-20260927
    paths:
      - .github/workflows/daqoenergy_prospectus_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Probe prospectus pages and PDF links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688303.phtml',
            'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_NewStock/stockid/688303.phtml',
            'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/688303.phtml',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              r.encoding=r.apparent_encoding or 'utf-8'
              print('\n=== PAGE',url,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'ENC',r.encoding,'===')
              print(r.text[:2000])
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                text=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                blob=(text+' '+href).lower()
                if any(k in blob for k in ['招股','prospectus','raiseexplanation','pdf','allbulletindetail']):
                  links.append({'text':text,'href':href})
              print('LINKS',json.dumps(links,ensure_ascii=False,indent=2))
            except Exception as e:
              print('ERROR',url,repr(e))
          PY
