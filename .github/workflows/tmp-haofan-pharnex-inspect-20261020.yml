name: Inspect Pharnex mirrors for Haofan reports

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-pharnex-inspect-20261020.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect pages and candidate attachments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, html, urllib.parse, urllib.request
          pages=[
            'https://www.pharnexcloud.com/data/qynb_cbdc86e5f466e793c1e7cebab37e0a52.html',
            'https://www.pharnexcloud.com/data/qynb_1363d4c743b0a5d1c6e985d8b3fbd773.html',
            'https://www.pharnexcloud.com/data/qynb_7e2ddcfc6d9fcb73158899dca66e1e38.html',
          ]
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          for url in pages:
            print('\n===== PAGE',url,'=====')
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9'})
            try:
              with urllib.request.urlopen(req,timeout=180) as r:
                raw=r.read(); final=r.geturl(); headers=dict(r.headers)
            except Exception as e:
              print('FETCH ERROR',repr(e)); continue
            print('FINAL',final,'BYTES',len(raw),'HEADERS',headers)
            text=raw.decode('utf-8','ignore')
            print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:2])
            for pat_name,pat in [
              ('pdf',r'''https?://[^\s"'<>]+?\.pdf(?:\?[^\s"'<>]*)?'''),
              ('download',r'''[^\s"'<>]{0,200}(?:download|附件|报告附件|下载报告)[^\s"'<>]{0,400}'''),
              ('api',r'''https?://[^\s"'<>]+?(?:api|download|attachment|file)[^\s"'<>]{0,300}'''),
            ]:
              print('--',pat_name,'--')
              seen=set()
              for m in re.finditer(pat,text,re.I):
                s=html.unescape(m.group(0))
                if s not in seen:
                  seen.add(s); print(s[:1000])
            print('-- anchors --')
            for m in re.finditer(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',text,re.I|re.S):
              href=html.unescape(m.group(1)); label=re.sub(r'<[^>]+>',' ',m.group(2)); label=re.sub(r'\s+',' ',html.unescape(label)).strip()
              full=urllib.parse.urljoin(final,href)
              if any(k in (label+' '+full).lower() for k in ('下载','报告','download','pdf','附件','file')):
                print(repr(label),full)
            print('-- script src --')
            for src in re.findall(r'''<script[^>]+src=["']([^"']+)''',text,re.I):
              print(urllib.parse.urljoin(final,html.unescape(src)))
          PY
