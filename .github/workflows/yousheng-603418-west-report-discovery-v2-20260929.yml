name: Discover West Securities Yousheng report PDF v2 20260929

on:
  push:
    paths:
      - '.github/workflows/yousheng-603418-west-report-discovery-v2-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect report pages and endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          from html import unescape
          from urllib.parse import urljoin

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls = [
              'https://www.sgpjbg.com/baogao/1269661.html',
              'https://www.sgpjbg.com.cn/baogao/1320324.html',
              'https://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
              'http://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
          ]

          for url in urls:
              try:
                  referer = 'https://www.sgpjbg.com/' if 'sgpjbg' in url else 'https://stock.finance.sina.com.cn/'
                  response = session.get(url, headers={'Referer': referer}, timeout=(15, 50), allow_redirects=True)
                  print('\nURL', url, 'STATUS', response.status_code, 'FINAL', response.url, 'BYTES', len(response.content), 'CTYPE', response.headers.get('content-type'), 'ENC', response.apparent_encoding, flush=True)
                  text = response.content.decode(response.apparent_encoding or 'utf-8', errors='replace')
                  print('HEAD', text[:1800].replace('\n', ' '), flush=True)

                  for match in re.finditer(r"https?://[^\"'<> ]+\.pdf(?:\?[^\"'<> ]*)?", text, re.I):
                      print('PDF_URL', unescape(match.group(0))[:1500], flush=True)

                  for match in re.finditer(r"(?:href|src|data-url|data-src|url)\s*=\s*[\"']([^\"']+)[\"']", text, re.I):
                      raw = unescape(match.group(1))
                      full = urljoin(response.url, raw)
                      if any(token in full.lower() for token in ['pdf', 'download', 'down', 'file', 'attach', 'report', 'baogao']):
                          print('RESOURCE', full, flush=True)
              except Exception as exc:
                  print('ERROR', url, repr(exc), flush=True)

          bases = [
              'https://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
              'http://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
          ]
          for base in bases:
              for suffix in ['', '&download=1', '&type=pdf', '&url=1']:
                  url = base + suffix
                  try:
                      response = session.get(url, timeout=(15, 50), allow_redirects=False, stream=True)
                      head = next(response.iter_content(64), b'')
                      print('PROBE', url, 'STATUS', response.status_code, 'LOC', response.headers.get('location'), 'CTYPE', response.headers.get('content-type'), 'CLEN', response.headers.get('content-length'), 'HEAD', repr(head), flush=True)
                      response.close()
                  except Exception as exc:
                      print('PROBE_ERROR', url, repr(exc), flush=True)
          PY
