name: Build China Hongqiao public preview package
on:
  push:
    branches:
      - tmp-chinahongqiao-public-preview-package-20260908
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow pypdf
      - name: Download public preview pages and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/package output/pages
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, re, zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          reports=[
            {
              'broker':'西部证券','date':'2025-04-21',
              'title':'高景气+一体化+高分红，电解铝龙头静待价值重估',
              'base':'https://oss.sdyanbao.com/page/2025/5/7/1191962',
              'source':'https://www.sdyanbao.com/detail/886387',
              'expected_pages':10,
            },
            {
              'broker':'华创证券','date':'2025-05-27',
              'title':'全球电解铝龙头，一体化打造盈利护城河，高分红属性明显',
              'base':'https://oss.sdyanbao.com/page/2025/6/3/1200934',
              'source':'https://www.sdyanbao.com/detail/892745',
              'expected_pages':10,
            },
          ]
          out=Path('output/package'); pagedir=Path('output/pages')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://www.sdyanbao.com/','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'})
          manifest=[]
          for idx,r in enumerate(reports,1):
            imgs=[]; page_meta=[]
            rdir=pagedir/f'report_{idx:02d}'; rdir.mkdir(parents=True,exist_ok=True)
            for pageno in range(r['expected_pages']):
              url=f"{r['base']}/{pageno}.png"
              rr=s.get(url,timeout=45,allow_redirects=True)
              data=rr.content
              if rr.status_code!=200 or len(data)<20000:
                raise RuntimeError(f'page download failed {url}: status={rr.status_code}, bytes={len(data)}')
              try:
                im=Image.open(io.BytesIO(data)); im.load()
              except Exception as exc:
                raise RuntimeError(f'invalid image {url}: {exc!r}')
              if im.width<500 or im.height<700:
                raise RuntimeError(f'image dimensions too small {url}: {im.size}')
              pagefile=rdir/f'{pageno+1:02d}.png'; pagefile.write_bytes(data)
              rgb=im.convert('RGB')
              imgs.append(rgb)
              page_meta.append({'page':pageno+1,'url':url,'bytes':len(data),'width':im.width,'height':im.height,'sha256':hashlib.sha256(data).hexdigest()})
            safe=re.sub(r'[\\/:*?"<>|]+','_',r['title'])[:70]
            pdf=out/f"{idx:02d}_{r['date']}_{r['broker']}_{safe}_公开前10页预览.pdf"
            imgs[0].save(pdf,save_all=True,append_images=imgs[1:],resolution=150.0,quality=95)
            reader=PdfReader(str(pdf)); pages=len(reader.pages)
            if pages!=r['expected_pages'] or pdf.stat().st_size<300000:
              raise RuntimeError(f'PDF validation failed {pdf}: pages={pages}, bytes={pdf.stat().st_size}')
            manifest.append({
              '序号':idx,'券商':r['broker'],'报告日期':r['date'],'报告标题':r['title'],
              '版本':'公开前10页预览（非完整原始PDF）','PDF页数':pages,'文件大小_字节':pdf.stat().st_size,
              'SHA256':hashlib.sha256(pdf.read_bytes()).hexdigest(),'公开来源':r['source'],'文件名':pdf.name,
              '页面明细':page_meta,
            })
            for im in imgs: im.close()

          csv_rows=[{k:v for k,v in x.items() if k!='页面明细'} for x in manifest]
          with (out/'报告清单.csv').open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(csv_rows[0].keys())); w.writeheader(); w.writerows(csv_rows)
          readme=[
            '中国宏桥（01378.HK）券商深度报告公开预览包','',
            '收录2份券商深度报告的公开前10页预览。由于公开下载入口要求登录或会员权限，本包不冒充完整原始PDF。',
            '仅供个人研究与学习，请保留券商署名及版权信息。',''
          ]
          readme += [f"{x['序号']}. {x['券商']}｜{x['报告日期']}｜{x['报告标题']}｜{x['PDF页数']}页公开预览" for x in manifest]
          (out/'README.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          z=Path('output/China_Hongqiao_01378_Broker_Reports_Public_Previews_2.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for p in sorted(out.iterdir()): zz.write(p,p.name)
          with zipfile.ZipFile(z) as zz:
            assert zz.testzip() is None
            assert len([n for n in zz.namelist() if n.lower().endswith('.pdf')])==2
          status={'ok':True,'zip':str(z),'zip_bytes':z.stat().st_size,'zip_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'reports':csv_rows}
          Path('output/status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_STATUS',json.dumps(status,ensure_ascii=False),flush=True)
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: china-hongqiao-public-previews
          path: output/*
          retention-days: 1
          if-no-files-found: error
