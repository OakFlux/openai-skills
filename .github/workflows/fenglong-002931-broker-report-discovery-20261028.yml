name: Discover Fenglong 002931 broker reports

on:
  push:
    paths:
      - '.github/workflows/fenglong-002931-broker-report-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Query report indexes and validate PDF candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from urllib.parse import urlencode
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE='002931'
          NAME='锋龙股份'
          API='https://reportapi.eastmoney.com/report/list'
          s=requests.Session()
          retry=Retry(total=5,connect=5,read=5,status=5,backoff_factor=.8,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})

          results={}
          variants=[
              {'code':CODE,'stockCode':'','stockName':'','searchKey':''},
              {'code':'','stockCode':CODE,'stockName':'','searchKey':''},
              {'code':'','stockCode':'','stockName':NAME,'searchKey':''},
              {'code':'','stockCode':'','stockName':'','searchKey':NAME},
          ]
          windows=[('2017-01-01','2026-10-28'),('2020-01-01','2026-10-28')]
          for begin,end in windows:
              for qtype in ['0','1','2']:
                  for variant in variants:
                      for page in range(1,11):
                          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),**variant}
                          try:
                              r=s.get(API,params=params,timeout=60)
                              print('QUERY',begin,end,'q',qtype,'variant',variant,'page',page,'status',r.status_code,'len',len(r.content),flush=True)
                              r.raise_for_status(); data=r.json(); rows=data.get('data') or []; hits=int(data.get('hits') or 0)
                              if page==1:
                                  print('META',json.dumps({'begin':begin,'end':end,'qType':qtype,'variant':variant,'hits':hits,'rows':len(rows)},ensure_ascii=False),flush=True)
                              for x in rows:
                                  blob='|'.join(str(x.get(k) or '') for k in ('stockCode','stockName','title','orgName','orgSName'))
                                  if CODE in blob or NAME in blob:
                                      key=str(x.get('infoCode') or x.get('id') or json.dumps(x,sort_keys=True,ensure_ascii=False))
                                      results[key]=x
                                      print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                              if not rows or page*100>=hits: break
                              time.sleep(.1)
                          except Exception as e:
                              print('QUERY_ERROR',repr(e),flush=True); break

          print('RESULT_COUNT',len(results),flush=True)
          for key,x in results.items():
              print('FINAL',key,json.dumps(x,ensure_ascii=False),flush=True)
              info=str(x.get('infoCode') or '')
              if info:
                  for prefix in ('H3','H2'):
                      url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                      try:
                          r=s.get(url,timeout=60,headers={'Referer':'https://data.eastmoney.com/report/'})
                          print('PDF_PROBE',url,r.status_code,r.headers.get('content-type'),len(r.content),r.url,flush=True)
                      except Exception as e: print('PDF_PROBE_ERROR',url,repr(e),flush=True)

          # Probe Eastmoney HSF10 page scripts for additional API endpoints or report IDs.
          page_urls=[
              f'https://emweb.eastmoney.com/PC_HSF10/ResearchReport/index?code=SZ{CODE}&color=w&type=web',
              f'https://data.eastmoney.com/report/stock.jshtml?encodeUrl={CODE}',
              f'https://data.eastmoney.com/report/{CODE}.html',
          ]
          for url in page_urls:
              try:
                  r=s.get(url,timeout=60)
                  print('PAGE',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  text=r.text.replace('\\/','/')
                  for pat in [r'AP\d{15,}',r'AS\d{15,}',r'AN\d{15,}',r'infoCode["\':=\s]+([A-Z0-9]+)',r'https?://[^\s"\'<>]+']:
                      vals=[]
                      for m in re.finditer(pat,text,re.I):
                          v=m.group(1) if m.lastindex else m.group(0)
                          if CODE in v or v.startswith(('AP','AS','AN')) or 'report' in v.lower(): vals.append(v)
                      for v in list(dict.fromkeys(vals))[:100]: print('PAGE_HIT',url,v[:1000],flush=True)
              except Exception as e: print('PAGE_ERROR',url,repr(e),flush=True)
          PY
