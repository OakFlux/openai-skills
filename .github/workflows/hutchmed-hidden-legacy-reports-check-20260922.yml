name: Check hidden HUTCHMED legacy annual report files 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-hidden-legacy-reports-check-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests pypdf
      - name: Probe direct and archived report candidates
        run: |
          python - <<'PY'
          import json, requests, urllib3
          from io import BytesIO
          from pathlib import Path
          from pypdf import PdfReader
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          s=requests.Session(); s.trust_env=False; s.verify=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36'})
          names=[]
          for y in range(2008,2012):
            yy=str(y)[2:]
            for n in [f'{y}ar.pdf',f'{y}_ar.pdf',f'ar{y}.pdf',f'ar{yy}.pdf',f'annual{y}.pdf',f'annual_{y}.pdf',f'{y}annualreport.pdf',f'{y}-annual-report.pdf']:
              names.append((y,n))
          bases=[
            'https://www.hutch-med.com/wp-content/uploads/docArchive/reports/',
            'https://www.hutch-med.com/wp-content/uploads/docArchive/irinfo/reports/',
            'https://www.hutch-med.com/wp-content/uploads/docArchive/eng/irinfo/reports/',
          ]
          rows=[]; hits=[]
          for y,n in names:
            for base in bases:
              u=base+n
              try:
                r=s.get(u,timeout=25,verify=False,allow_redirects=True)
                row={'year':y,'url':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'ct':r.headers.get('content-type'),'header':r.content[:8].decode('latin1','replace')}
                if r.status_code==200 and r.content.startswith(b'%PDF'):
                  reader=PdfReader(BytesIO(r.content)); row['pages']=len(reader.pages)
                  txt=[]
                  for p in reader.pages[:5]:
                    try: txt.append(p.extract_text() or '')
                    except: pass
                  row['text']=' '.join(' '.join(txt).split())[:1200]
                  hits.append(row); print('HIT',json.dumps(row,ensure_ascii=False))
                rows.append(row)
              except Exception as e:
                rows.append({'year':y,'url':u,'error':repr(e)})
          Path('hidden_report_hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('hidden_report_checks.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HITS',len(hits))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-hidden-legacy-reports-check
          path: |
            hidden_report_hits.json
            hidden_report_checks.json
          retention-days: 7
