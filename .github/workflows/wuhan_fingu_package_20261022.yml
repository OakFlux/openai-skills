name: Build Wuhan Fingu broker report package 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_package_20261022.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf

      - name: Fetch and validate public reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          python - <<'PY'
          import os, re, json, hashlib, zipfile, urllib.parse, html
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT='package'; os.makedirs(OUT,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0 Safari/537.36'
          H={'User-Agent':UA,'Accept':'*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://data.eastmoney.com/report/002194.html'}

          def parse_jsonp(t):
              t=t.strip()
              m=re.match(r'^[^(]+\((.*)\)\s*;?$',t,re.S)
              if m:t=m.group(1)
              return json.loads(t)

          api='https://reportapi.eastmoney.com/report/list?pageSize=100&beginTime=2000-01-01&endTime=2026-10-22&stockCode=002194&pageNo=1&qType=0'
          r=s.get(api,headers=H,timeout=(15,45)); print('API',r.status_code,len(r.content),r.url,r.text[:120])
          r.raise_for_status(); obj=parse_jsonp(r.text)
          rows=[]
          if isinstance(obj,dict):
              for k in ('data','result','list'):
                  v=obj.get(k)
                  if isinstance(v,list): rows=v; break
                  if isinstance(v,dict):
                      for kk in ('data','list'):
                          if isinstance(v.get(kk),list): rows=v[kk]; break
                      if rows: break
          print('ROWS',len(rows))
          with open(os.path.join(OUT,'eastmoney_api_response.json'),'w',encoding='utf-8') as f:json.dump(obj,f,ensure_ascii=False,indent=2)

          def val(row,*names):
              for n in names:
                  v=row.get(n)
                  if v not in (None,''): return str(v)
              return ''
          def clean(x):
              x=re.sub(r'[\\/:*?"<>|]+','_',x)
              x=re.sub(r'\s+',' ',x).strip()
              return x[:100]
          def pdf_candidates(code,row):
              out=[]
              for k,v in row.items():
                  if isinstance(v,str) and ('url' in k.lower() or '.pdf' in v.lower()):
                      vv=html.unescape(v)
                      if vv.startswith('//'): vv='https:'+vv
                      if vv.startswith('http://'): vv='https://'+vv[7:]
                      if vv.startswith('https://'): out.append(vv)
              c=code.strip()
              if c and not c.startswith('AP') and c.isdigit(): c='AP'+c
              if c:
                  out += [
                    f'https://pdf.dfcfw.com/pdf/H3_{c}_1.pdf',
                    f'https://pdf.dfcfw.com/pdf/H3_{c}_1.PDF',
                    f'https://pdf.dfcfw.com/pdf/H3{c}_1.pdf',
                    f'https://pdf.dfcfw.com/pdf/H3{c}_1.PDF',
                    f'https://pdf.dfcfw.com/pdf/{c}_1.pdf',
                    f'https://pdf.dfcfw.com/pdf/{c}_1.PDF',
                  ]
              return list(dict.fromkeys(out))

          manifest=[]; hashes=set()
          # Prefer the first-coverage/deep report, then other full company research reports.
          def priority(row):
              title=val(row,'title','TITLE')
              date=val(row,'publishDate','REPORT_DATE')
              score=0
              for kw,w in [('首次',100),('深度',90),('公司研究',80),('专注基站',120),('价值分析',70),('季报点评',10),('三季报',5)]:
                  if kw in title: score+=w
              if date.startswith('2020-08'): score+=60
              return -score
          rows=sorted(rows,key=priority)
          for row in rows:
              title=val(row,'title','TITLE','reportTitle')
              org=val(row,'orgSName','ORG_SNAME','orgName')
              date=val(row,'publishDate','REPORT_DATE','date')[:10]
              code=val(row,'infoCode','INFO_CODE','artCode','ART_CODE')
              print('REPORT',date,org,title,code)
              got=None
              for u in pdf_candidates(code,row):
                  try:
                      rr=s.get(u,headers=H,timeout=(10,35),allow_redirects=True)
                      data=rr.content
                      print('TRY',rr.status_code,len(data),rr.headers.get('content-type',''),rr.url)
                      if data.startswith(b'%PDF') and len(data)>20000:
                          got=(u,rr.url,data); break
                  except Exception as e: print('ERR',u,repr(e))
              if not got: continue
              src,final,data=got
              sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: continue
              hashes.add(sha)
              base=clean(f'{date}_{org}_{title}') or f'report_{len(manifest)+1}'
              path=os.path.join(OUT,base+'.pdf')
              with open(path,'wb') as f:f.write(data)
              try:
                  reader=PdfReader(path); pages=len(reader.pages)
                  first='\n'.join((reader.pages[i].extract_text() or '') for i in range(min(2,pages)))[:7000]
              except Exception as e:
                  print('PDFREADERR',repr(e)); os.remove(path); continue
              company_ok=('武汉凡谷' in first or '002194' in first or '武漢凡谷' in first)
              rec={'filename':os.path.basename(path),'date':date,'broker':org,'title':title,'info_code':code,'pages':pages,'size_bytes':len(data),'sha256':sha,'source_url':src,'final_url':final,'company_verified':company_ok}
              manifest.append(rec); print('SAVED',json.dumps(rec,ensure_ascii=False))

          # Public mirror fallback for the 21-page Haitong report (report id 16990).
          if not any('专注基站' in x.get('title','') for x in manifest):
              urls=['https://bg.sgpjbg.com/baogao/16990.html','https://bg.sgpjbg.com/bgdown/16990.html']
              found=[]
              for page in urls:
                  try:
                      rr=s.get(page,headers={**H,'Referer':'https://bg.sgpjbg.com/'},timeout=(15,45),allow_redirects=True)
                      print('MIRRORPAGE',rr.status_code,len(rr.content),rr.url)
                      text=rr.text
                      with open(os.path.join(OUT,'mirror_'+str(len(found))+'.html'),'w',encoding='utf-8') as f:f.write(text)
                      soup=BeautifulSoup(text,'lxml')
                      for tag in soup.find_all(True):
                          for a in ('href','src','data-src','data-url','data-file','data-pdf'):
                              v=tag.get(a)
                              if v:
                                  u=urllib.parse.urljoin(rr.url,html.unescape(str(v)))
                                  if '.pdf' in u.lower() or '16990' in u: found.append(u)
                      found += re.findall(r'https?://[^\s"\'<>]+(?:\.pdf|16990)[^\s"\'<>]*',text,re.I)
                  except Exception as e: print('MIRRORERR',repr(e))
              for u in list(dict.fromkeys(found))[:40]:
                  try:
                      rr=s.get(u,headers={**H,'Referer':'https://bg.sgpjbg.com/baogao/16990.html'},timeout=(10,30),allow_redirects=True)
                      data=rr.content
                      if not data.startswith(b'%PDF') or len(data)<20000: continue
                      sha=hashlib.sha256(data).hexdigest()
                      if sha in hashes: continue
                      p=os.path.join(OUT,'2020-08-10_海通证券_专注基站射频三十年_5G滤波器再塑发展新天地.pdf')
                      with open(p,'wb') as f:f.write(data)
                      reader=PdfReader(p); pages=len(reader.pages); first=(reader.pages[0].extract_text() or '')[:4000]
                      rec={'filename':os.path.basename(p),'date':'2020-08-10','broker':'海通证券','title':'专注基站射频三十年，5G滤波器再塑发展新天地','info_code':'','pages':pages,'size_bytes':len(data),'sha256':sha,'source_url':u,'final_url':rr.url,'company_verified':('武汉凡谷' in first or '002194' in first)}
                      manifest.append(rec); hashes.add(sha); print('MIRRORSAVED',json.dumps(rec,ensure_ascii=False)); break
                  except Exception as e: print('MIRRORDLERR',u,repr(e))

          # Keep up to three verified full PDFs. Prefer longer documents and different brokers.
          verified=[x for x in manifest if x.get('company_verified')]
          verified.sort(key=lambda x:(0 if ('首次' in x['title'] or '专注基站' in x['title'] or x.get('pages',0)>=15) else 1,-x.get('pages',0)))
          chosen=[]; used_brokers=set()
          for x in verified:
              if len(chosen)>=3: break
              if x['broker'] not in used_brokers or len(chosen)<2:
                  chosen.append(x); used_brokers.add(x['broker'])
          if len(chosen)<3:
              for x in verified:
                  if x not in chosen:
                      chosen.append(x)
                      if len(chosen)>=3: break
          chosen_names={x['filename'] for x in chosen}
          for x in manifest:
              p=os.path.join(OUT,x['filename'])
              if x['filename'] not in chosen_names and os.path.exists(p): os.remove(p)
          manifest=chosen
          with open(os.path.join(OUT,'manifest.json'),'w',encoding='utf-8') as f:json.dump(manifest,f,ensure_ascii=False,indent=2)
          lines=['# 武汉凡谷（002194）公开券商公司研究报告','',f'收录数量：{len(manifest)}','']
          for i,x in enumerate(manifest,1):
              lines += [f'## {i}. {x["title"]}',f'- 券商：{x["broker"]}',f'- 日期：{x["date"]}',f'- 页数：{x["pages"]}',f'- 文件：{x["filename"]}',f'- SHA-256：{x["sha256"]}','']
          lines += ['说明：仅收录可公开直接获取、文件头为PDF且首页或前两页可核验“武汉凡谷/002194”的完整文件；未绕过登录、会员或验证码限制。']
          with open(os.path.join(OUT,'README.md'),'w',encoding='utf-8') as f:f.write('\n'.join(lines))
          zip_path='武汉凡谷_券商公司研究报告_公开版.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for fn in os.listdir(OUT):
                  if fn.endswith('.html') or fn=='eastmoney_api_response.json': continue
                  z.write(os.path.join(OUT,fn),arcname=fn)
          print('FINAL_COUNT',len(manifest),'ZIP',zip_path,os.path.getsize(zip_path))
          if not manifest:
              raise SystemExit('No verified public PDF downloaded')
          PY

      - name: Upload final ZIP and files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-broker-reports-20261022
          path: |
            武汉凡谷_券商公司研究报告_公开版.zip
            package/*.pdf
            package/README.md
            package/manifest.json
          retention-days: 7
          if-no-files-found: error
