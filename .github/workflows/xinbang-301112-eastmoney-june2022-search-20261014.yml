name: Target Eastmoney June 2022 search for Xinbang Intelligent

on:
  push:
    paths:
      - '.github/workflows/xinbang-301112-eastmoney-june2022-search-20261014.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Search June 2022 company reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
          needles=['信邦智能','广州信邦智能','301112']
          matches=[]; allrows=[]
          windows=[('2022-05-01','2022-07-31'),('2022-01-01','2022-12-31')]
          for begin,end in windows:
            for page in range(1,400):
              params={
                'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0',
                'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
              }
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,120))
              print('FETCH',begin,end,page,r.status_code,len(r.content),flush=True)
              if r.status_code!=200: break
              j=r.json(); batch=j.get('data') or []
              if page==1: print('META',json.dumps({k:j.get(k) for k in j if k!='data'},ensure_ascii=False),flush=True)
              for x in batch:
                y=dict(x); y['_window']=[begin,end]; y['_page']=page; allrows.append(y)
                blob=json.dumps(x,ensure_ascii=False)
                if any(n in blob for n in needles):
                  matches.append(y); print('MATCH',json.dumps(y,ensure_ascii=False),flush=True)
              if len(batch)<100: break
              time.sleep(.1)
            if matches: break
          uniq={}
          for x in matches:
            uniq[str(x.get('infoCode') or x.get('id') or json.dumps(x,sort_keys=True,ensure_ascii=False))]=x
          matches=list(uniq.values())
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          # save broker rows around IPO even if company name mismatch, to inspect titles
          brokers=[]
          for x in allrows:
            org=str(x.get('orgSName') or x.get('orgName') or '')
            title=str(x.get('title') or '')
            if org in ('申万宏源','华金证券') and any(k in title for k in ['新股','注册制','纵览','覆盖研究','信邦']):
              brokers.append(x)
          (out/'broker_candidates.json').write_text(json.dumps(brokers,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT',len(matches),'BROKER_CANDIDATES',len(brokers),'ALL',len(allrows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-eastmoney-june2022-search
          path: out
          retention-days: 7
