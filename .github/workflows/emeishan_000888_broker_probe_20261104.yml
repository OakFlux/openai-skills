name: probe-emeishan-000888-broker-links

on:
  push:
    branches:
      - tmp/emeishan-000888-broker-probe-20261104

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Probe report pages and APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/818061282486/index.phtml',
            'https://www.nxny.com/report/view_6165343.html',
            'https://www.nxny.com/report/view_5912846.html',
            'https://www.fxbaogao.com/detail/5184857',
          ]
          for u in urls:
            print('\n=== URL',u)
            try:
              r=s.get(u,timeout=(30,180),allow_redirects=True)
              print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,'CTYPE',r.headers.get('content-type'))
              print('HEAD',repr(r.text[:1000]))
              soup=BeautifulSoup(r.text,'html.parser')
              candidates=[]
              for tag in soup.find_all(['a','iframe','embed','object','script','source']):
                for attr in ['href','src','data','value']:
                  v=tag.get(attr)
                  if v and any(k in v.lower() for k in ['.pdf','download','attach','file','report']):
                    candidates.append((tag.name,attr,v))
              for m in re.findall(r'https?://[^\s\"\'<>]+',r.text):
                if any(k in m.lower() for k in ['.pdf','download','attach','file','report']):
                  candidates.append(('regex','url',m))
              seen=set()
              for item in candidates:
                if item[2] not in seen:
                  seen.add(item[2]); print('CAND',item)
            except Exception as e:
              print('ERROR',repr(e))

          base='https://reportapi.eastmoney.com/report/list'
          for qtype in ['0','1','2','3']:
            params={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':'2025-01-01','endTime':'2026-01-01','pageNo':'1','fields':'','qType':qtype,'orgCode':'','code':'000888','rcode':'','cb':'callback123'}
            r=s.get(base,params=params,timeout=(30,180))
            print('\nAPI',qtype,r.status_code,len(r.content),r.url)
            print('BODYHEAD',repr(r.text[:500]))
            text=r.text.strip(); m=re.search(r'^[^(]*\((.*)\)\s*;?\s*$',text,re.S)
            try:
              data=json.loads(m.group(1) if m else text)
              for rec in data.get('data') or []:
                print('REC',rec.get('publishDate'),rec.get('orgSName'),rec.get('title'),rec.get('infoCode'),rec.get('attachPages'),rec.get('encodeUrl'))
            except Exception as e:
              print('JSONERR',repr(e))
          PY
