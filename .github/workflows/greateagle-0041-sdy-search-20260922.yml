name: Search Sdyanbao for Great Eagle Holdings reports

on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-sdy-search-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Search public report index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          import requests

          out=Path('output')
          base='https://api.sdyanbao.com'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Content-Type':'application/json;charset=UTF-8',
            'Accept':'application/json, text/plain, */*',
            'Origin':'https://www.sdyanbao.com',
            'Referer':'https://www.sdyanbao.com/report',
            'Device':'1',
          })
          queries=['鹰君集团','鷹君集團','鹰君','鷹君','Great Eagle Holdings','Great Eagle','0041.HK','00041','00041.HK']
          summaries=[]
          candidates={}
          for only_title in (1,0):
            for idx,q in enumerate(queries,1):
              payload={
                'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,
                'page':1,'pageSize':100,'keyword':q,'pageCount':0,
                'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''
              }
              try:
                r=s.post(base+'/api/file/search',json=payload,timeout=(20,120),allow_redirects=True)
                print('SEARCH',only_title,q,r.status_code,len(r.content),r.text[:300],flush=True)
                rec={'query':q,'onlyTitle':only_title,'status':r.status_code,'headers':dict(r.headers)}
                try: data=r.json()
                except Exception:
                  data={'raw':r.text}
                rec['response']=data
                (out/f'search_{only_title}_{idx:02d}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                files=[]
                if isinstance(data,dict):
                  d=data.get('data')
                  if isinstance(d,dict): files=d.get('files') or d.get('list') or d.get('records') or []
                  elif isinstance(d,list): files=d
                if not isinstance(files,list): files=[]
                summaries.append({'query':q,'onlyTitle':only_title,'count':len(files),'status':r.status_code})
                for item in files:
                  if not isinstance(item,dict): continue
                  rid=item.get('id') or item.get('file_id') or item.get('uuid')
                  name=str(item.get('name') or item.get('title') or '')
                  org=item.get('organization')
                  orgname=org.get('name','') if isinstance(org,dict) else str(org or '')
                  text=(name+' '+orgname+' '+json.dumps(item,ensure_ascii=False)).lower()
                  if any(k.lower() in text for k in ['鹰君','鷹君','great eagle','00041','0041.hk']):
                    candidates[str(rid)]=item
              except Exception as e:
                print('ERROR',only_title,q,repr(e),flush=True)
                summaries.append({'query':q,'onlyTitle':only_title,'error':repr(e)})

          details=[]
          for rid,item in candidates.items():
            if not rid or rid=='None': continue
            try:
              r=s.post(base+'/api/file/detail',json={'id':rid},timeout=(20,120))
              print('DETAIL',rid,r.status_code,len(r.content),r.text[:500],flush=True)
              try: data=r.json()
              except Exception: data={'raw':r.text}
              details.append({'id':rid,'search_item':item,'detail_response':data})
            except Exception as e:
              details.append({'id':rid,'search_item':item,'error':repr(e)})
          (out/'summary.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'candidates.json').write_text(json.dumps(list(candidates.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CANDIDATES',json.dumps(list(candidates.values()),ensure_ascii=False,indent=2),flush=True)
          print('DETAILS',json.dumps(details,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-sdy-search
          path: output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
