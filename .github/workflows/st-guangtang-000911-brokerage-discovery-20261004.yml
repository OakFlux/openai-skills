name: Discover ST Guangtang 000911 brokerage reports 20261004

on:
  push:
    paths:
      - '.github/workflows/st-guangtang-000911-brokerage-discovery-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Eastmoney brokerage report API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,*/*;q=0.8',
          })

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          seen = set()
          for begin, end in [
              ('2008-01-01','2012-12-31'),
              ('2013-01-01','2016-12-31'),
              ('2017-01-01','2020-12-31'),
              ('2021-01-01','2023-12-31'),
              ('2024-01-01','2026-10-04'),
          ]:
              for page in range(1, 10):
                  params = {
                      'industryCode': '*',
                      'pageSize': '100',
                      'industry': '*',
                      'rating': '*',
                      'ratingchange': '*',
                      'beginTime': begin,
                      'endTime': end,
                      'pageNo': str(page),
                      'fields': '',
                      'qType': '0',
                      'orgCode': '',
                      'code': '000911',
                      'rcode': '',
                      'p': str(page),
                      'pageNum': str(page),
                      'pageNumber': str(page),
                      '_': str(int(time.time()*1000)),
                  }
                  response = session.get(endpoint, params=params, timeout=60)
                  print('QUERY', begin, end, 'PAGE', page, 'STATUS', response.status_code, 'BYTES', len(response.content), flush=True)
                  response.raise_for_status()
                  payload = response.json()
                  rows = payload.get('data', []) if isinstance(payload, dict) else []
                  print('ROW_COUNT', len(rows), flush=True)
                  if not rows:
                      break
                  for row in rows:
                      info = row.get('infoCode')
                      if not info or info in seen:
                          continue
                      seen.add(info)
                      compact = {k: row.get(k) for k in [
                          'title','stockName','stockCode','orgSName','publishDate','infoCode',
                          'attachPages','attachSize','researcher','column','emRatingName','encodeUrl'
                      ]}
                      print('REPORT_ROW', json.dumps(compact, ensure_ascii=False), flush=True)
                  if len(rows) < 100:
                      break
                  time.sleep(0.2)
          print('TOTAL_UNIQUE', len(seen), flush=True)
          PY
