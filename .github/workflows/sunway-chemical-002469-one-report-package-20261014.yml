name: Package verified Sunway Chemical brokerage deep report

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-one-report-package-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package report
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '三维化学_002469_券商深度报告精选_1份'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)
          PDF_NAME = '01_国信证券_2025-05-16_受益于新疆煤化工建设提速_工程与实业携手并进.pdf'
          PDF_PATH = OUT / PDF_NAME
          URLS = [
              'https://pdf.dfcfw.com/pdf/H3_AP202505161673828576_1.pdf',
              'https://pdf.dfcfw.com/pdf/H2_AP202505161673828576_1.pdf',
              'https://pdf.dfcfw.com/pdf/H4_AP202505161673828576_1.pdf',
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          errors = []
          source_url = None
          for url in URLS:
              for attempt in range(1, 4):
                  temp = PDF_PATH.with_suffix('.pdf.part')
                  temp.unlink(missing_ok=True)
                  try:
                      with session.get(url, stream=True, allow_redirects=True, timeout=(30, 900)) as response:
                          print('DOWNLOAD', url, 'attempt', attempt, 'status', response.status_code, 'final', response.url, flush=True)
                          response.raise_for_status()
                          with temp.open('wb') as fh:
                              for chunk in response.iter_content(chunk_size=1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                      size = temp.stat().st_size
                      with temp.open('rb') as fh:
                          header = fh.read(8)
                      if size < 1_000_000 or not header.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF response size={size}, header={header!r}')
                      temp.replace(PDF_PATH)
                      source_url = str(response.url)
                      break
                  except Exception as exc:
                      errors.append(f'{url} attempt {attempt}: {exc!r}')
                      temp.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              if source_url:
                  break
          if source_url is None:
              raise RuntimeError(f'download failed: {errors}')

          reader = PdfReader(str(PDF_PATH), strict=False)
          pages = len(reader.pages)
          if pages != 37:
              raise RuntimeError(f'unexpected page count: {pages}, expected 37')

          sample_parts = []
          for page_index in range(min(8, pages)):
              sample_parts.append(reader.pages[page_index].extract_text() or '')
          sample_text = re.sub(r'\s+', '', ''.join(sample_parts))
          required_terms = ['三维化学', '受益于新疆煤化工建设提速', '工程+实业', '国信证券']
          missing = [term for term in required_terms if re.sub(r'\s+', '', term) not in sample_text]
          if missing:
              raise RuntimeError(f'identity validation failed, missing terms: {missing}')

          qpdf = subprocess.run(
              ['qpdf', '--warning-exit-0', '--check', str(PDF_PATH)],
              capture_output=True,
              text=True,
          )
          if qpdf.returncode != 0:
              raise RuntimeError(f'qpdf validation failed: {qpdf.stderr[-2000:]}')

          render_root = OUT / 'first_page_render_check'
          render = subprocess.run(
              ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(PDF_PATH), str(render_root)],
              capture_output=True,
              text=True,
          )
          render_file = Path(str(render_root) + '.png')
          if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 10_000:
              raise RuntimeError(f'first-page render failed: {render.stderr[-1000:]}')
          render_size = render_file.stat().st_size
          render_file.unlink(missing_ok=True)

          data = PDF_PATH.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          record = {
              'filename': PDF_NAME,
              'company': '山东三维化学集团股份有限公司',
              'stock_code': '002469.SZ',
              'broker': '国信证券',
              'date': '2025-05-16',
              'title': '受益于新疆煤化工建设提速，“工程+实业”携手并进',
              'researcher': '任鹤、朱家琪',
              'rating': '增持',
              'report_type': '公司深度/首次覆盖类研究报告',
              'info_code': 'AP202505161673828576',
              'source_pdf_url': source_url,
              'pages': pages,
              'bytes': len(data),
              'sha256': digest,
              'first_page_render_bytes': render_size,
          }

          readme = [
              '山东三维化学集团股份有限公司（三维化学，002469.SZ）券商深度报告精选',
              '整理日期：2026-10-14',
              '',
              '本包收录1份能够从公开渠道直接下载、并完整核验的券商原始排版PDF。',
              '公开渠道还可检索到财通证券、国盛证券、长江证券等公司深度报告，但相关页面要求登录/VIP或仅提供逐页图片预览，未将其转换、拼接或以非原始文件形式补入本包。',
              '',
              '文件清单：',
              '1. 国信证券，2025-05-16，37页',
              '   标题：受益于新疆煤化工建设提速，“工程+实业”携手并进',
              '   分析师：任鹤、朱家琪；评级：增持',
              f'   文件：{PDF_NAME}',
              f'   PDF来源：{source_url}',
              f'   SHA-256：{digest}',
              '',
              '完整性检查：PDF文件头、文件大小、页数、公司与报告身份、qpdf结构、首页渲染、SHA-256和ZIP CRC。',
          ]
          (OUT / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps([record], ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(f'{digest}  {PDF_NAME}\n', encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 1:
                  raise RuntimeError(f'expected one PDF, found {len(pdfs)}')

          print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: sunway-chemical-002469-one-report-package-20261014
          path: 三维化学_002469_券商深度报告精选_1份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
