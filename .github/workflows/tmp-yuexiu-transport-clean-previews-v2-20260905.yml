name: Temporary clean Yuexiu Transport public previews v2
on:
  push:
    branches: [tmp-yuexiu-transport-clean-previews-20260905]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Build clean previews
        run: |
          python -m pip install --quiet requests pillow pypdf
          python - <<'PY'
          import hashlib,html,io,json,re,zipfile
          from pathlib import Path
          from urllib.parse import urlsplit,urlunsplit
          import requests
          from PIL import Image,ImageOps,ImageStat,ImageChops
          from pypdf import PdfReader
          R=[('4757676','2025-03-31','兴证国际证券','平临高速收购落地，保持稳健派息',4),('4734664','2025-03-17','东兴证券','越秀交通基建：平临高速将增厚25年业绩，收费权摊销略高于预期',6),('3834744','2023-08-09','国联证券','中期分红率53.8%，基本面长期向好',None)]
          out=Path('deliverable2');out.mkdir(exist_ok=True);work=Path('work2');work.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          def first(rid):
            detail=f'https://www.fxbaogao.com/detail/{rid}'
            t=html.unescape(s.get(detail,timeout=35).text).replace('\\/','/').replace('\\u0026','&')
            m=re.search(rf'https://public\.fxbaogao\.com/report-image/[^\"\'<>\\\s]+/{rid}-1\.png(?:\?[^\"\'<>\\\s]*)?',t,re.I)
            if not m: raise RuntimeError('no first '+rid)
            p=urlsplit(m.group(0));return urlunsplit((p.scheme,p.netloc,p.path,'','')),detail
          def get(u,ref):
            for x in [u,u+'?x-oss-process=image/format,webp']:
              try:
                r=s.get(x,timeout=35,headers={'Referer':ref}); im=Image.open(io.BytesIO(r.content));im.load()
                if r.status_code==200 and len(r.content)>3000 and im.width>=500:return r.content
              except: pass
          def clean(b):
            im=ImageOps.exif_transpose(Image.open(io.BytesIO(b)))
            if im.mode in ('RGBA','LA') or 'transparency' in im.info:
              rgba=im.convert('RGBA'); bg=Image.new('RGBA',rgba.size,(255,255,255,255)); bg.alpha_composite(rgba); rgb=bg.convert('RGB')
            else: rgb=im.convert('RGB')
            im.close(); th=rgb.resize((64,64)).convert('L');mean=ImageStat.Stat(th).mean[0];th.close()
            if mean<55: rgb=ImageChops.invert(rgb)
            return rgb
          M=[]
          for rid,date,broker,title,total in R:
            u,detail=first(rid);pre=re.sub(r'-1\.png$','',u);bs=[];seen=set()
            for i in range(1,8):
              b=get(f'{pre}-{i}.png',detail)
              if not b: break
              h=hashlib.sha256(b).hexdigest()
              if h in seen: break
              seen.add(h);bs.append(b);print('PAGE',rid,i,len(b))
            if len(bs)<2: raise RuntimeError(f'{rid} only {len(bs)}')
            ims=[clean(b) for b in bs]; safe=re.sub(r'[\\/:*?\"<>|]+','_',title); fn=f'{date}_{broker}_{safe}_公开预览版_前{len(ims)}页.pdf';p=work/fn
            ims[0].save(p,'PDF',save_all=True,append_images=ims[1:],resolution=160,quality=95,subsampling=0)
            for x in ims:x.close()
            n=len(PdfReader(str(p),strict=False).pages);data=p.read_bytes();M.append({'id':rid,'date':date,'broker':broker,'title':title,'file':fn,'public_preview_pages':n,'original_total_pages':total,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_page':detail,'status':'公开预览版，不是券商原始完整版PDF'})
          read=['越秀交通基建（01052.HK）券商研究报告公开预览资料包','','共3份券商单公司研究报告的公开预览PDF。','','重要说明：','1. 无需登录状态下，来源平台仅公开展示每份报告的前2页；完整原始PDF需平台授权或登录权限，本资料包不是完整版。','2. PDF由公开页面图像按原顺序合成，已将透明背景正确还原为白色，未改写页面内容。','3. 仅供个人研究学习，版权归原券商及作者所有，不构成投资建议。','','文件清单：']
          for i,x in enumerate(M,1): read.append(f"{i}. {x['broker']}｜{x['date']}｜{x['title']}｜公开前{x['public_preview_pages']}页"+(f"；原报告共{x['original_total_pages']}页" if x['original_total_pages'] else ''))
          (work/'README_重要说明.txt').write_text('\n'.join(read),encoding='utf-8');(work/'manifest.json').write_text(json.dumps({'company':'越秀交通基建有限公司','stock_code':'01052.HK','package_type':'public_preview','reports':M},ensure_ascii=False,indent=2),encoding='utf-8');(work/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['file']}" for x in M)+'\n',encoding='utf-8')
          z=out/'yuexiu_transport_broker_reports_public_previews_3.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as q:
            for x in M:q.write(work/x['file'],x['file'])
            for n in ['README_重要说明.txt','manifest.json','SHA256SUMS.txt']:q.write(work/n,n)
          with zipfile.ZipFile(z) as q: assert q.testzip() is None and len([n for n in q.namelist() if n.endswith('.pdf')])==3
          print('FINAL',z,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yuexiu-transport-clean-public-previews-v2
          path: deliverable2/yuexiu_transport_broker_reports_public_previews_3.zip
          retention-days: 1
          compression-level: 0
