name: chatgpt-temp-zhida-final-package-v2
on:
  push:
    branches:
      - chatgpt-temp-zhida-reports-20260914
    paths:
      - .github/workflows/chatgpt-temp-zhida-final-package-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download public previews, build PDFs and validate archive
        shell: bash
        run: |
          python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
          python <<'PY'
          import hashlib, io, json, re, time, zipfile
          from pathlib import Path
          import requests, img2pdf, pymupdf
          from PIL import Image, ImageStat
          from pypdf import PdfReader

          W=Path('zhida_v2_work'); ROOT=W/'挚达科技_02650_券商研究报告_3份'; PDF=ROOT/'PDF'; RAW=W/'raw'; QA=W/'qa'
          for d in (PDF,RAW,QA): d.mkdir(parents=True,exist_ok=True)
          reports=[
            {'institution':'国证国际','date':'2025-09-30','title':'挚达科技（2650.HK）IPO点评报告','kind':'公司IPO点评报告','id':5083214,'detail':'https://www.fxbaogao.com/detail/5083214','dates':['2025/09/30','2025/10/01','2025/09/29'],'original':None},
            {'institution':'中国光大证券国际','date':'2025-09-30','title':'新股预览：挚达科技','kind':'公司新股预览','id':5081845,'detail':'https://www.fxbaogao.com/detail/5081845','dates':['2025/09/30','2025/10/01','2025/09/29'],'original':None},
            {'institution':'国泰海通证券','date':'2025-10-14','title':'数字经济资本市场周概览：挚达科技港交所主板挂牌上市，广和通向港交所递交招股书','kind':'数字经济资本市场专题（含挚达科技独立章节）','id':5092300,'detail':'https://www.fxbaogao.com/detail/5092300','dates':['2025/10/14','2025/10/13','2025/10/12','2025/10/15'],'original':7},
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept':'image/*,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/'})
          logs=[]; manifest=[]
          def L(x): x=str(x); print(x,flush=True); logs.append(x)
          def safe(x): return re.sub(r'[\\/:*?"<>|\s]+','_',str(x)).strip('_')[:125]
          def fetch_image(url):
            err='unknown'
            for attempt in range(1,4):
              try:
                r=s.get(url,timeout=35,allow_redirects=True); L(f'GET {attempt} {r.status_code} {len(r.content)} {url}')
                if r.status_code==200 and len(r.content)>12000:
                  im=Image.open(io.BytesIO(r.content)); im.load()
                  if im.width>=650 and im.height>=850:
                    return {'data':r.content,'url':r.url,'width':im.width,'height':im.height}
                  err=f'bad dimensions {im.size}'
                else: err=f'HTTP {r.status_code}, {len(r.content)} bytes'
              except Exception as e: err=repr(e)
              time.sleep(.5*attempt)
            return None
          for ri,rep in enumerate(reports,1):
            template=None
            for d in rep['dates']:
              cand=f"https://public.fxbaogao.com/report-image/{d}/{rep['id']}-{{page}}.png"
              if fetch_image(cand.format(page=1)):
                template=cand; L(f'TEMPLATE {rep["id"]} {template}'); break
            if not template: raise RuntimeError(f'No public preview for {rep["id"]}')
            rdir=RAW/str(rep['id']); rdir.mkdir(exist_ok=True); jpgs=[];urls=[];hashes=[];dims=[]
            for pn in range(1,31):
              got=fetch_image(template.format(page=pn))
              if not got:
                L(f'END {rep["id"]} page={pn}'); break
              h=hashlib.sha256(got['data']).hexdigest()
              if h in hashes: raise RuntimeError(f'duplicate page {rep["id"]} {pn}')
              hashes.append(h); raw=rdir/f'{pn:03d}.png'; raw.write_bytes(got['data'])
              with Image.open(raw) as im:
                jpg=rdir/f'{pn:03d}.jpg'; im.convert('RGB').save(jpg,'JPEG',quality=94,optimize=False)
              jpgs.append(jpg); urls.append(got['url']); dims.append({'page':pn,'width':got['width'],'height':got['height']})
            pages=len(jpgs)
            if pages<1: raise RuntimeError(f'No pages {rep["id"]}')
            if rep['original'] and pages==rep['original']: status='完整公开版本'; complete=True
            elif rep['original']: status=f"公开展示{pages}页_原报告{rep['original']}页"; complete=False
            else: status=f'公开展示{pages}页'; complete=False
            fn=f"{rep['date']}_{safe(rep['institution'])}_挚达科技_{safe(rep['title'])}_{status}.pdf"; path=PDF/fn
            path.write_bytes(img2pdf.convert([str(x) for x in jpgs],layout_fun=img2pdf.get_fixed_dpi_layout_fun((150,150))))
            raw_pdf=path.read_bytes(); actual=len(PdfReader(str(path),strict=False).pages)
            if not raw_pdf.startswith(b'%PDF-') or actual!=pages: raise RuntimeError(f'PDF validation failed {fn}')
            doc=pymupdf.open(str(path)); checks=[];seen=set()
            for idx,tag in [(0,'first'),(actual//2,'middle'),(actual-1,'last')]:
              if idx in seen: continue
              seen.add(idx); pix=doc[idx].get_pixmap(matrix=pymupdf.Matrix(2,2),alpha=False); out=QA/f'{ri}_{tag}.png'; pix.save(str(out)); sd=ImageStat.Stat(Image.open(out).convert('L').resize((64,64))).stddev[0]
              if sd<1: raise RuntimeError(f'blank render {fn}')
              checks.append({'page':idx+1,'stddev':round(sd,4)})
            doc.close()
            rec={'date':rep['date'],'institution':rep['institution'],'title':rep['title'],'stock_code':'02650.HK','report_type':rep['kind'],'source_detail_url':rep['detail'],'public_image_template':template,'included_pages':pages,'known_original_pages':rep['original'],'is_complete':complete,'access_status':status,'filename':'PDF/'+fn,'size_bytes':len(raw_pdf),'sha256':hashlib.sha256(raw_pdf).hexdigest(),'page_dimensions':dims,'source_page_urls':urls,'render_checks':checks}
            manifest.append(rec); L('VALID '+json.dumps(rec,ensure_ascii=False))
          if len(manifest)!=3 or len({x['sha256'] for x in manifest})!=3: raise RuntimeError('manifest validation failed')
          lines=['# 挚达科技（02650.HK）券商研究报告资料包','','核对日期：2026-09-14','','收录两份挚达科技专项新股研究，以及一份含挚达科技独立章节的国泰海通专题。公开渠道未开放全部券商原始PDF，文件名与清单按实际取得页数标注。','']
          for i,x in enumerate(manifest,1): lines.append(f"{i}. {x['institution']}｜{x['date']}｜{x['title']}｜{x['included_pages']}页｜{x['access_status']}")
          lines += ['','PDF由公开展示高清逐页图片按原顺序合成；未登录或绕过付费权限。已检查重复页、PDF页数、首中尾页渲染和ZIP CRC。']
          (ROOT/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8');(ROOT/'文件说明.txt').write_text('\n'.join(x.replace('# ','') for x in lines)+'\n',encoding='utf-8');(ROOT/'manifest.json').write_text(json.dumps({'company':'上海挚达科技发展股份有限公司','stock_code':'02650.HK','checked_as_of':'2026-09-14','pdf_count':3,'files':manifest},ensure_ascii=False,indent=2),encoding='utf-8');(ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['filename']}" for x in manifest)+'\n',encoding='utf-8');(W/'run.log').write_text('\n'.join(logs)+'\n',encoding='utf-8')
          z=W/'挚达科技_02650_券商研究报告_3份.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): zz.write(p,arcname=str(ROOT.name/p.relative_to(ROOT)))
          with zipfile.ZipFile(z) as zz:
            if zz.testzip(): raise RuntimeError('ZIP CRC failure')
            if len([n for n in zz.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('ZIP PDF count')
          meta={'filename':z.name,'size_bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'pdf_count':3,'reports':manifest};(W/'zip_metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');print('FINAL '+json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Zhida-Technology-Broker-Reports-Final-V2
          path: |
            zhida_v2_work/挚达科技_02650_券商研究报告_3份.zip
            zhida_v2_work/zip_metadata.json
            zhida_v2_work/run.log
            zhida_v2_work/qa
          retention-days: 1
          compression-level: 0
