name: chatgpt-temp-lesso-public-index-20260908
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-lesso-public-index-20260908.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public index
        run: |
          mkdir -p lesso_index
          curl -L --fail-with-body -H 'content-type: application/json' -H 'origin: https://www.sdyanbao.com' -H 'referer: https://www.sdyanbao.com/report?keyword=China%20Lesso' --data '{"device":1,"hideTrader":0,"onlyTitle":0,"order":0,"page":1,"pageSize":50,"keyword":"中国联塑","pageCount":0,"dateRange":0,"startTime":"","endTime":"","typeIds":"","industryIds":""}' https://api.sdyanbao.com/api/file/search -o lesso_index/search.json
          python -m json.tool lesso_index/search.json > lesso_index/search_pretty.json || true
          cat lesso_index/search_pretty.json || cat lesso_index/search.json
      - uses: actions/upload-artifact@v4
        with:
          name: China-Lesso-public-index
          path: lesso_index
          retention-days: 1
