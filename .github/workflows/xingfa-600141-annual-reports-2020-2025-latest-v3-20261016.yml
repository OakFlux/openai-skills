name: Build Xingfa Group 600141 annual reports package v3 20261016

on:
  push:
    paths:
      - '.github/workflows/xingfa-600141-annual-reports-2020-2025-latest-v3-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Patch annual-report title variants
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/xingfa_600141_reports_package.py')
          text = path.read_text(encoding='utf-8')
          for year in range(2020, 2026):
              old = f'"variants": ["{year}年年度报告"]'
              new = f'"variants": ["{year}年年度报告", "{year}年度报告"]'
              if old not in text:
                  raise SystemExit(f'missing patch target: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build package
        run: python .github/scripts/xingfa_600141_reports_package.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xingfa-600141-annual-reports-2020-2025-latest-final-v3
          path: |
            兴发集团_600141_2020-2025年报及最新季报.zip
            ZIP_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
