name: Temporary Resolve Tianshun Deep Report Codes

on:
  push:
    branches:
      - tmp/tianshun-wind-reports-20260830
    paths:
      - .github/workflows/tmp-tianshun-calendar-report-codes.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query RPT_STOCKCALENDAR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,requests
          from pathlib import Path
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/stockcalendar/002531.html','Accept':'application/json,text/plain,*/*'})
          params={
            'reportName':'RPT_STOCKCALENDAR',
            'columns':'ALL',
            'filter':'(SECURITY_CODE="002531")',
            'pageNumber':'1',
            'pageSize':'5000',
            'sortTypes':'-1',
            'sortColumns':'NOTICE_DATE',
            'source':'WEB',
            'client':'WEB'
          }
          r=s.get('https://datacenter-web.eastmoney.com/api/data/v1/get',params=params,timeout=60);r.raise_for_status();payload=r.json()
          rows=((payload.get('result') or {}).get('data') or [])
          reports=[x for x in rows if x.get('EVENT_TYPE_CODE')=='020' or x.get('EVENT_TYPE')=='研报']
          targets=[]
          keys=['快意雄风海上来','收购长风切入海风赛道','深耕风塔十余载','将飞翼伏，以待东风','公司深度','深度报告']
          for x in reports:
            content=str(x.get('LEVEL1_CONTENT') or '')
            if any(k in content for k in keys) or str(x.get('NOTICE_DATE','')).startswith(('2023-02-09','2023-02-21','2023-02-22','2022-12-04')):
              targets.append(x)
          Path('out').mkdir(exist_ok=True)
          Path('out/tianshun_calendar_report_codes.json').write_text(json.dumps({'targets':targets,'reports':reports},ensure_ascii=False,indent=2),encoding='utf-8')
          print('TARGETS='+json.dumps(targets,ensure_ascii=False),flush=True)
          print('REPORT_COUNT='+str(len(reports)),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianshun-calendar-report-codes
          path: out/tianshun_calendar_report_codes.json
          retention-days: 3
