name: Retry Leo broker discovery with full filters

on:
  push:
    branches: [tmp-leo-broker-reports-20261016]
    paths: ['.github/workflows/tmp-leo-broker-discovery-fullparams-20261016.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public broker report index with full filters
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002131' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable4263982&industryCode=*&pageSize=100&industry=*&rating=*&ratingChange=*&beginTime=2000-01-01&endTime=2030-01-01&pageNo=1&fields=&qType=0&orgCode=&code=002131&rcode=' \
            -o reports.jsonp
          python3 - <<'PY'
          import json, re
          text=open('reports.jsonp',encoding='utf-8').read()
          payload=json.loads(re.sub(r'^datatable\d*\(|\)$','',text))
          rows=payload.get('data') or []
          print('HITS',payload.get('hits'),'SIZE',payload.get('size'),'ROWS',len(rows))
          rows.sort(key=lambda r:r.get('publishDate') or '',reverse=True)
          for r in rows:
              print('\t'.join([
                  str(r.get('publishDate',''))[:10],
                  str(r.get('orgSName') or r.get('orgName') or ''),
                  str(r.get('attachPages') or ''),
                  str(r.get('infoCode') or ''),
                  str(r.get('reportType') or r.get('column') or ''),
                  str(r.get('title') or ''),
              ]))
          PY
