name: Query Haitian International Eastmoney reports
on:
  push:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests
      - name: Query report API
        run: |
          python - <<'PY'
          import json,time,requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          for code in ['01882','1882','HK01882','01882.HK']:
            for qtype in ['0','1','2','3']:
              try:
                p={'pageSize':'100','beginTime':'2010-01-01','endTime':'2026-09-07','pageNo':'1','qType':qtype,'code':code,'_':str(int(time.time()*1000))}
                r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=60)
                print('\nQUERY',code,qtype,r.status_code,len(r.content),r.url)
                try:
                  o=r.json(); rows=o.get('data') or []; print('HITS',o.get('hits'),'ROWS',len(rows))
                  for x in rows:
                    print('ROW',json.dumps({k:x.get(k) for k in ['title','stockName','stockCode','orgSName','publishDate','infoCode','reportType','researcher']},ensure_ascii=False))
                except Exception as e: print(r.text[:500],repr(e))
              except Exception as e: print('ERR',code,qtype,repr(e))
          PY
