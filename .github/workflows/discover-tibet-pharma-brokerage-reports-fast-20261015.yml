name: Fast discovery Tibet Pharmaceutical reports

on:
  push:
    paths:
      - '.github/workflows/discover-tibet-pharma-brokerage-reports-fast-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query exact stock report index
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json,time,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/600211.html'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          all_rows=[]; seen=set()
          for begin,end in [('2010-01-01','2019-12-31'),('2020-01-01','2026-10-15')]:
            for qtype in ('0','1'):
              for page in range(1,6):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                        'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                        'orgCode':'','code':'600211','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                        '_':str(int(time.time()*1000))}
                r=s.get(endpoint,params=params,timeout=60)
                print('QUERY',begin,end,qtype,page,r.status_code,len(r.content),r.url,flush=True)
                r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                print('COUNT',len(rows),'HITS',payload.get('hits'),flush=True)
                if not rows: break
                for row in rows:
                  info=str(row.get('infoCode') or '')
                  if info and info not in seen:
                    seen.add(info); all_rows.append(row)
                if len(rows)<100: break
          print('TOTAL',len(all_rows),flush=True)
          for row in sorted(all_rows,key=lambda x:(int(x.get('attachPages') or 0),str(x.get('publishDate') or '')),reverse=True):
            print('REPORT',json.dumps({k:row.get(k) for k in ('title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column','reportType','ratingChangeName')},ensure_ascii=False),flush=True)
          PY