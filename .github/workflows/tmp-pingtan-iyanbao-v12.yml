name: Temporary Pingtan Development iyanbao discovery v12

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-iyanbao-v12.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Inspect iyanbao search and report download routes
        run: |
          mkdir -p out/pages out/scripts out/pdfs
          python - <<'PY'
          import hashlib, html, json, re, time
          from pathlib import Path
          from urllib.parse import quote, urlencode, urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          O=Path('out'); H=O/'pages'; J=O/'scripts'; P=O/'pdfs'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.iyanbao.com/'})
          logs=[]; records=[]; scripts=set(); candidates=set(); details=set(); pdfs=[]; hashes=set()
          def note(*a):x=' '.join(str(v) for v in a);print(x,flush=True);logs.append(x)
          def clean(x,n=100):return re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x or '')).strip(' ._')[:n] or 'report'
          def decode(r):
              for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030']:
                  if enc:
                      try:return r.content.decode(enc,'replace')
                      except:pass
              return r.content.decode('utf-8','replace')
          def save_pdf(content,url,meta=None):
              if len(content)<1500 or not content.lstrip().startswith(b'%PDF'):return False
              h=hashlib.sha256(content).hexdigest()
              if h in hashes:return True
              hashes.add(h); tmp=P/f'_tmp_{h[:12]}.pdf';tmp.write_bytes(content)
              try:
                  rd=PdfReader(str(tmp));pages=len(rd.pages);tx=''
                  for pg in rd.pages[:6]:
                      try:tx+='\n'+(pg.extract_text() or '')
                      except:pass
              except Exception as e:
                  note('BADPDF',url,repr(e));tmp.unlink(missing_ok=True);return False
              ident=any(k in tx for k in ['平潭发展','中福实业','福建中福','000592'])
              title=(meta or {}).get('title') or '平潭发展研报';date=(meta or {}).get('date') or '';org=(meta or {}).get('org') or '未知机构'
              fn=f'{date}_{clean(org,30)}_{clean(title)}_{pages}页.pdf'.strip('_')
              if (P/fn).exists():fn=f'{date}_{clean(org,30)}_{clean(title)}_{pages}页_{h[:6]}.pdf'.strip('_')
              tmp.rename(P/fn);pdfs.append({'file':fn,'url':url,'pages':pages,'bytes':len(content),'identity':ident,'sha256':h,'text_prefix':tx[:800],**(meta or {})})
              note('SAVEDPDF',fn,'IDENT',ident,url);return True
          def harvest(text,base):
              raw=html.unescape(text).replace('\\/','/')
              try:
                  soup=BeautifulSoup(text,'html.parser')
                  for tag in soup.find_all(True):
                      for a in ['href','src','data','value','action','data-url','data-href','data-file','data-pdf']:
                          v=tag.get(a)
                          if isinstance(v,str) and v.strip():
                              u=urljoin(base,v.strip());candidates.add(u)
                              if re.search(r'/detail/\d+',u):details.add(u)
                              if tag.name=='script' and a=='src':scripts.add(u)
              except:pass
              for v in re.findall(r'https?://[^\s"\'<>]+',raw,re.I):candidates.add(v.rstrip('),;'))
              for v in re.findall(r'["\']([^"\']+(?:\.pdf|download|file\.iyanbao|/detail/|search|api/)[^"\']*)["\']',raw,re.I):
                  u=urljoin(base,v);candidates.add(u)
                  if re.search(r'/detail/\d+',u):details.add(u)
          def get(u,tag):
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  note('GET',tag,r.status_code,len(r.content),r.headers.get('content-type'),r.url,'HIST',len(r.history))
                  if save_pdf(r.content,r.url):return r,None
                  t=decode(r);(H/f'{clean(tag,80)}.txt').write_text(t,encoding='utf-8',errors='ignore');harvest(t,r.url)
                  records.append({'tag':tag,'requested':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('Location')} for h in r.history],'prefix':t[:1800]})
                  return r,t
              except Exception as e:
                  note('ERR',tag,u,repr(e));records.append({'tag':tag,'requested':u,'error':repr(e)});return None,None

          # Establish cookies and inspect known public detail page.
          seed=['https://www.iyanbao.com/','https://www.iyanbao.com/company','https://www.iyanbao.com/detail/868187','https://www.iyanbao.com/robots.txt','https://www.iyanbao.com/sitemap.xml']
          for i,u in enumerate(seed):get(u,f'seed_{i}');time.sleep(.2)
          # Search routes inferred from common site implementations.
          terms=['000592','平潭发展','中福实业','福建中福','乘平潭开发东风','依托林业资产 分享平潭政策红利','扎根两岸家园 兑现业绩高成长']
          routes=[]
          for q in terms:
              eq=quote(q)
              routes += [
                f'https://www.iyanbao.com/search?keyword={eq}',f'https://www.iyanbao.com/search?keywords={eq}',f'https://www.iyanbao.com/search?q={eq}',f'https://www.iyanbao.com/search?key={eq}',
                f'https://www.iyanbao.com/search/{eq}',f'https://www.iyanbao.com/company?keyword={eq}',f'https://www.iyanbao.com/company?q={eq}',
                f'https://www.iyanbao.com/api/search?keyword={eq}',f'https://www.iyanbao.com/api/report/search?keyword={eq}',f'https://www.iyanbao.com/api/reports?keyword={eq}',
              ]
          for i,u in enumerate(routes):get(u,f'route_{i}');time.sleep(.1)
          # Download and inspect all site scripts found.
          for i,u in enumerate(list(scripts)[:120]):
              try:
                  r=s.get(u,timeout=60);note('SCRIPT',i,r.status_code,len(r.content),r.url)
                  t=decode(r);(J/f'script_{i}.js').write_text(t,encoding='utf-8',errors='ignore');harvest(t,r.url)
                  for pos in [m.start() for m in re.finditer(r'(?:search|download|file\.iyanbao|\.pdf|/api/|detail)',t,re.I)][:80]:
                      (J/f'contexts_{i}.txt').open('a',encoding='utf-8').write(re.sub(r'\s+',' ',t[max(0,pos-300):pos+700])+'\n---\n')
              except Exception as e:note('SCRIPTERR',i,u,repr(e))
          # Follow detail pages discovered from search results.
          note('DETAILS_DISCOVERED',len(details))
          for i,u in enumerate(list(details)[:250]):
              r,t=get(u,f'detail_{i}')
              if t and any(k in t for k in terms):
                  note('MATCHDETAIL',u)
              time.sleep(.08)
          # Follow direct file/download/API candidates. Restrict to target domains.
          queue=[]
          for u in candidates:
              low=u.lower()
              if len(u)>1500 or low.startswith(('javascript:','mailto:','data:')):continue
              if ('iyanbao.com' in low or 'gelonghui.com' in low) and any(k in low for k in ['.pdf','file.iyanbao','download','/api/','reportfile','attachment','preview','viewpdf']):queue.append(u)
          queue=list(dict.fromkeys(queue))[:500]
          note('CANDIDATES',len(candidates),'FOLLOW',len(queue))
          followed=[]
          for i,u in enumerate(queue):
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  followed.append({'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('Location')} for h in r.history]})
                  note('FOLLOW',i,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                  save_pdf(r.content,r.url)
              except Exception as e:
                  followed.append({'url':u,'error':repr(e)});note('FOLLOWERR',i,u,repr(e))
              time.sleep(.08)
          (O/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'scripts.json').write_text(json.dumps(sorted(scripts),ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'candidates.json').write_text(json.dumps(sorted(candidates),ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'details.json').write_text(json.dumps(sorted(details),ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'followed.json').write_text(json.dumps(followed,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          note('DONE','DETAILS',len(details),'PDFS',len(pdfs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-iyanbao-v12
          path: out/
          retention-days: 3
