name: chatgpt-temp-dazhong-public-reports-code
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-public-reports-code.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reports by stock code and package PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf pymupdf pillow
          python <<'PY'
          import hashlib,json,re,zipfile
          from pathlib import Path
          import requests,pymupdf
          from PIL import Image,ImageStat
          from pypdf import PdfReader
          W=Path('dazhong_code');R=W/'大众公用_600635_01635_券商深度报告';P=R/'PDF';Q=W/'qa';P.mkdir(parents=True,exist_ok=True);Q.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          logs=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          recs=[];seen=set()
          for code in ['600635','SH600635','600635.SH']:
            for pg in range(1,10):
              body={'pageSize':100,'pageNo':pg,'p':pg,'pageNum':pg,'pageNumber':pg,'beginTime':'2016-01-01','endTime':'2026-09-07','code':code,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'Content-Type':'application/json'},timeout=60)
              L(f'POST code={code} p={pg} HTTP={r.status_code} bytes={len(r.content)} text={r.text[:200]}')
              try:o=r.json()
              except:o={}
              x=o.get('data') or []
              if isinstance(x,dict):x=x.get('data') or x.get('list') or []
              if not isinstance(x,list):x=[]
              for a in x:
                txt=json.dumps(a,ensure_ascii=False)
                info=a.get('infoCode') or a.get('INFO_CODE')
                if info and info not in seen and ('大众公用' in txt or '600635' in txt):seen.add(info);recs.append(a);L('REC '+txt)
              total=int(o.get('TotalPage') or 1)
              if not x or pg>=total:break
          (W/'records.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          # Rank targeted company reports, newest first; first-coverage gets a bonus.
          def score(a):
            title=str(a.get('title') or a.get('TITLE') or '')
            dt=str(a.get('publishDate') or a.get('PUBLISH_DATE') or '')
            sc=0
            if any(k in title for k in ['首次覆盖','公用事业平稳发展','四大板块多元发展','创投增厚利润','全面布局','优质标的']):sc+=100
            if '大众公用' in title:sc+=20
            return (sc,dt)
          recs.sort(key=score,reverse=True)
          manifest=[]
          for a in recs:
            if len(manifest)>=3:break
            info=a.get('infoCode') or a.get('INFO_CODE');title=a.get('title') or a.get('TITLE') or '大众公用研究报告';org=a.get('orgSName') or a.get('orgName') or a.get('ORG_SNAME') or '券商';dt=str(a.get('publishDate') or a.get('PUBLISH_DATE') or '')[:10]
            data=None;url=None
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf',f'https://pdf.dfcfw.com/pdf/{info}_1.pdf']:
              r=s.get(u,headers={'Referer':'https://data.eastmoney.com/'},timeout=180,allow_redirects=True);L(f'PDF {info} HTTP={r.status_code} bytes={len(r.content)} {r.url}')
              if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>80000:data=r.content;url=r.url;break
            if not data:continue
            fn=re.sub(r'[\\/:*?"<>|]+','_',f'{dt}_{org}_大众公用_{title}')[:190]+'.pdf';p=P/fn;p.write_bytes(data)
            try:
              pc=len(PdfReader(str(p),strict=False).pages);doc=pymupdf.open(str(p));text=''.join(doc[i].get_text() for i in range(min(3,doc.page_count)))
              if pc<3 or ('大众公用' not in text and '600635' not in text and '01635' not in text):raise ValueError('validation')
              checks=[]
              for i,suf in [(0,'first'),(pc-1,'last')]:
                pix=doc[i].get_pixmap(matrix=pymupdf.Matrix(1.2,1.2),alpha=False);png=Q/(p.stem+'_'+suf+'.png');pix.save(str(png));sd=ImageStat.Stat(Image.open(png).convert('L').resize((64,64))).stddev[0]
                if sd<1:raise ValueError('blank')
                checks.append({'page':i+1,'stddev':round(sd,4)})
              doc.close()
            except Exception as e:L(f'REJECT {fn} {e!r}');p.unlink(missing_ok=True);continue
            manifest.append({'filename':fn,'title':title,'institution':org,'date':dt,'pages':pc,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_url':url,'info_code':info,'render_checks':checks})
          if len(manifest)<2:raise RuntimeError(f'Only {len(manifest)} PDFs; records={len(recs)}')
          (R/'文件说明.txt').write_text('大众公用（600635.SH / 01635.HK）券商研究报告\n\n'+'\n'.join(f"{i}. {x['filename']} | {x['pages']}页" for i,x in enumerate(manifest,1))+'\n',encoding='utf-8')
          (R/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8');(R/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  PDF/{x['filename']}" for x in manifest)+'\n',encoding='utf-8')
          z=W/f'大众公用_600635_01635_券商深度报告_{len(manifest)}份.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for f in R.rglob('*'):
              if f.is_file():zz.write(f,arcname=str(R.name/f.relative_to(R)))
          with zipfile.ZipFile(z) as zz:assert not zz.testzip()
          meta={'filename':z.name,'size_bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'reports':manifest};(W/'meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8');print('FINAL '+json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Public-Utilities-Reports-By-Code
          path: |
            dazhong_code/大众公用_600635_01635_券商深度报告_*.zip
            dazhong_code/meta.json
            dazhong_code/records.json
            dazhong_code/run.log
          retention-days: 1
          compression-level: 0
