name: Build Dadixiong 688077 disclosure package v2

on:
  push:
    branches:
      - tmp-dadixiong-688077-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='大地熊_688077_全部年报_招股说明书_最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/dadixiong_v2_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('大地熊_688077_全部年报_招股说明书_最新季报')
          s = requests.Session(); s.trust_env = False
          s.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8, backoff_factor=1,
              status_forcelist=[429,500,502,503,504], allowed_methods=['GET'], raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'})

          docs = [
            dict(order=1,file='01_大地熊_首次公开发行股票并在科创板上市招股说明书_2020-07-17.pdf',title='首次公开发行股票并在科创板上市招股说明书',kind='prospectus',year=2020,date='2020-07-17',bulletin_id='6445485',pages=422,detail='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=6445485&stockid=688077'),
            dict(order=2,file='02_大地熊_2020年年度报告.pdf',title='2020年年度报告',kind='annual',year=2020,date='2021-03-31',bulletin_id='7000734',pages=230,detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688077&id=7000734'),
            dict(order=3,file='03_大地熊_2021年年度报告.pdf',title='2021年年度报告',kind='annual',year=2021,date='2022-03-22',bulletin_id='7900713',pages=258,detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688077&id=7900713'),
            dict(order=4,file='04_大地熊_2022年年度报告.pdf',title='2022年年度报告',kind='annual',year=2022,date='2023-03-31',bulletin_id='8933736',pages=233,detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688077&id=8933736'),
            dict(order=5,file='05_大地熊_2023年年度报告_更新版.pdf',title='2023年年度报告（更新版）',kind='annual',year=2023,date='2024-07-18',bulletin_id='10334394',pages=259,detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688077&id=10334394'),
            dict(order=6,file='06_大地熊_2024年年度报告.pdf',title='2024年年度报告',kind='annual',year=2024,date='2025-03-29',bulletin_id='10828818',pages=272,detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688077&id=10828818'),
            dict(order=7,file='07_大地熊_2025年年度报告.pdf',title='2025年年度报告',kind='annual',year=2025,date='2026-03-28',bulletin_id='12030786',pages=236,detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688077&id=12030786'),
            dict(order=8,file='08_大地熊_2026年第一季度报告.pdf',title='2026年第一季度报告',kind='quarter',year=2026,date='2026-04-28',bulletin_id='12211121',pages=17,detail='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688077&id=12211121'),
          ]

          def urls(d):
              y=d['date'][:4]; m=str(int(d['date'][5:7])); m2=d['date'][5:7]; bid=d['bulletin_id']
              result=[]
              for md in (f'{y}-{m}',f'{y}-{m2}'):
                  for host in ('211.154.219.97:9494','211.154.219.97%3A9494'):
                      result.append(f'https://file.finance.sina.com.cn/{host}/MRGG/CNSESH_STOCK/{y}/{md}/{d["date"]}/{bid}.PDF')
              return list(dict.fromkeys(result))

          def matches(path,d):
              r=PdfReader(str(path),strict=False); text=''
              idxs=list(range(min(12,len(r.pages))))+[len(r.pages)-1]
              for i in dict.fromkeys(idxs):
                  try: text+='\n'+(r.pages[i].extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','',text)
              if '大地熊' not in compact and '安徽大地熊新材料股份有限公司' not in compact: return False
              if d['kind']=='prospectus': return '招股说明书' in compact and '首次公开发行股票' in compact
              if d['kind']=='annual': return f"{d['year']}年年度报告" in compact or f"{d['year']}年度报告" in compact
              return '第一季度报告' in compact and '2026' in compact

          records=[]
          for d in docs:
              last=None; response=None
              for attempt in range(8):
                  for url in urls(d):
                      try:
                          x=s.get(url,headers={'Referer':d['detail']},timeout=(30,360),allow_redirects=True)
                          if x.status_code==200 and x.content.startswith(b'%PDF-') and len(x.content)>80000:
                              response=x; break
                          last=RuntimeError(f'HTTP={x.status_code} bytes={len(x.content)} type={x.headers.get("content-type")}')
                      except Exception as e: last=e
                  if response is not None: break
                  time.sleep(min(2+attempt,8))
              if response is None: raise RuntimeError(f"download failed {d['title']}: {last!r}")
              p=out/d['file']; p.write_bytes(response.content)
              actual=len(PdfReader(str(p),strict=False).pages)
              if actual!=d['pages']: raise RuntimeError(f"{d['title']}: expected {d['pages']} pages, got {actual}")
              if not matches(p,d): raise RuntimeError(f"content mismatch: {d['title']}")
              sha=hashlib.sha256(response.content).hexdigest()
              records.append({**d,'source':response.url,'bytes':len(response.content),'sha256':sha})
              print('DOWNLOADED',d['title'],'pages=',actual,'bytes=',len(response.content),'sha256=',sha)

          lines=[
            '大地熊（688077）全部年报、招股说明书及最新季报资料包',
            '整理日期：2026-10-28','',
            '收录范围：',
            '1. 2020—2025年度报告全文，共6份；2023年度采用2024年7月18日披露的更新版。',
            '2. 2020年7月17日披露的首次公开发行股票并在科创板上市招股说明书正式发行版。',
            '3. 截至2026年10月28日最新已正式披露的季度报告为2026年第一季度报告。2026年第三季度报告预约于2026年10月29日披露，整理时尚未正式发布。',
            '4. 未收录年度报告摘要、半年度报告、招股意向书、申报稿或其他临时公告。','',
            '文件清单：'
          ]
          sums=[]; total_pages=0; total_bytes=0
          for r in records:
              total_pages += r['pages']; total_bytes += r['bytes']
              lines += [f"{r['order']}. {r['file']}",f"   文档：{r['title']}",f"   披露日期：{r['date']}",f"   页数：{r['pages']}页",f"   原始PDF：{r['source']}",f"   公告/索引页：{r['detail']}",f"   SHA-256：{r['sha256']}",'']
              sums.append(f"{r['sha256']}  {r['file']}")
          lines += [f'合计：8份PDF，{total_pages}页，{total_bytes}字节。','全部文件均为公开渠道直接下载的完整PDF。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e; qpdf --check "$pdf" >"$pdf.qpdf" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '大地熊|安徽大地熊新材料股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/dadixiong_v2_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/dadixiong_v2_test.zip "$PACKAGE"
          unzip -t /tmp/dadixiong_v2_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/dadixiong_v2_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f /tmp/dadixiong_v2_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dadixiong-688077-annual-reports-prospectus-latest-quarter-v2
          path: 大地熊_688077_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
