name: Build Jianshe Industry 002265 broker reports final 20261016

on:
  push:
    paths:
      - '.github/workflows/jianshe-industry-002265-broker-reports-final-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package broker reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='建设工业_002265_券商研究报告_完整PDF_2份'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'broker':'中航证券','date':'2026-09-09','analysts':'王菁菁、梁晨、张超','rating':'增持',
              'title':'2026年半年报点评：特品放量驱动营收+40%，Q2单季利润弹性释放',
              'info_codes':['AP202609091829174390','AP202609141829364007'],
              'terms':['建设工业','特品放量','Q2单季利润弹性释放'],
              'filename':'01_中航证券_建设工业_2026年半年报点评_特品放量驱动营收增长_2026-09-09.pdf'
            },
            {
              'broker':'太平洋证券','date':'2025-06-04','analysts':'马浩然','rating':'增持（首次覆盖）',
              'title':'主营业务保持稳定，“一核两翼”向新发展',
              'info_codes':['AP202506051685101820'],
              'terms':['建设工业','一核两翼','主营业务保持稳定'],
              'filename':'02_太平洋证券_建设工业_主营业务保持稳定一核两翼向新发展_2025-06-04.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download(codes):
            last=[]
            for code in codes:
              for prefix in ['H3','H2','H1','H4']:
                url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
                for attempt in range(5):
                  try:
                    r=s.get(url,timeout=(25,180),allow_redirects=True,headers={
                      'User-Agent':s.headers['User-Agent'],
                      'Referer':f'https://data.eastmoney.com/report/info/{code}.html',
                      'Accept':'application/pdf,*/*;q=0.8'
                    })
                    meta={'url':url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type','')}
                    last.append(meta)
                    if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000:
                      return r.content,code,url,last
                  except Exception as exc:
                    last.append({'url':url,'error':repr(exc)})
                  time.sleep(1+attempt)
            raise RuntimeError('download failed: '+json.dumps(last[-12:],ensure_ascii=False))

          manifest=[]
          for item in reports:
            data,code,url,attempts=download(item['info_codes'])
            dest=root/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<4:
              raise RuntimeError(f'too few pages: {dest.name} {pages}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(12,pages)])
            compact=re.sub(r'\s+','',text)
            if not any(x in compact for x in ['建设工业','002265','西仪股份']):
              raise RuntimeError(f'issuer mismatch: {dest.name}')
            matched=[t for t in item['terms'] if re.sub(r'\s+','',t) in compact]
            if len(matched)<1:
              raise RuntimeError(f'title keyword mismatch: {dest.name}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError(f'preview failed: {dest.name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **{k:v for k,v in item.items() if k!='info_codes'},
              'selected_info_code':code,
              'source_report_page':f'https://data.eastmoney.com/report/info/{code}.html',
              'pdf_url':url,
              'pages':pages,'bytes':len(data),'sha256':sha,
              'matched_terms':matched,
              'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商原始完整PDF',
              'validation':['PDF header','issuer identity','title keywords','page count','qpdf structure','first-page render'],
              'download_attempts':attempts
            })

          readme=[
            '建设工业集团（云南）股份有限公司（002265.SZ）券商研究报告完整PDF资料包',
            '整理日期：2026-10-16',
            '',
            '本包收录2份公开可直接取得的券商原始完整PDF。公开索引中未发现第三份同等质量的公司深度/覆盖报告，因此未使用行业周报、机构调研纪要或网页摘要凑数。',
            ''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",
              ''
            ]
          readme += [
            '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、标题关键词、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2:
              raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          Path('jianshe_industry_broker_reports.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: jianshe-industry-002265-broker-reports-final
          path: |
            建设工业_002265_券商研究报告_完整PDF_2份.zip
            jianshe_industry_broker_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
