name: Build Sidike 300806 broker deep reports

on:
  push:
    branches:
      - tmp-sidike-broker-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='斯迪克_300806_券商深度报告_3份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/sidike_broker_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('斯迪克_300806_券商深度报告_3份')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          candidates = [
              {
                  'broker': '国盛证券',
                  'date': '2025-02-21',
                  'title': '国产OCA光学胶龙头，前瞻布局产能迎来收获期',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202502211643362239_1.pdf',
                  'index': 'https://data.eastmoney.com/report/info/AP202502211643362239.html',
                  'min_pages': 25,
              },
              {
                  'broker': '财通证券',
                  'date': '2023-02-15',
                  'title': '胶&膜自制协同发展，多个领域顺利导入',
                  'url': 'https://bigdata-s3.wmcloud.com/researchreport/2023-02/abafa9b293f559f7bf89ccb72b2be28b.pdf',
                  'index': 'https://bigdata-s3.wmcloud.com/researchreport/2023-02/abafa9b293f559f7bf89ccb72b2be28b.pdf',
                  'min_pages': 20,
              },
              {
                  'broker': '开源证券',
                  'date': '2021-02-03',
                  'title': '国内OCA光学胶领跑者，打造胶×膜产品矩阵',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202102031458010151_1.pdf',
                  'index': 'https://data.eastmoney.com/report/info/AP202102031458010151.html',
                  'min_pages': 20,
              },
              {
                  'broker': '海通证券',
                  'date': '2021-07-23',
                  'title': '功能性涂层复合材料龙头，实施限制性股票激励发挥员工积极性',
                  'url': 'https://file.iyanbao.com/pdf/187db-c6922f54-e095-4ae1-acb2-51ac2abd07e5.pdf',
                  'index': 'https://file.iyanbao.com/pdf/187db-c6922f54-e095-4ae1-acb2-51ac2abd07e5.pdf',
                  'min_pages': 15,
              },
          ]

          def clean_filename(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '', value)
              value = re.sub(r'\s+', '', value)
              return value[:58]

          def inspect_pdf(path: Path, item: dict) -> tuple[bool, int, str]:
              try:
                  reader = PdfReader(str(path), strict=False)
                  pages = len(reader.pages)
                  if pages < item['min_pages']:
                      return False, pages, f'only {pages} pages'
                  indexes = list(range(min(12, pages)))
                  if pages > 12:
                      indexes.append(pages - 1)
                  text = ''
                  for index in dict.fromkeys(indexes):
                      try:
                          text += '\n' + (reader.pages[index].extract_text() or '')
                      except Exception:
                          pass
                  compact = re.sub(r'\s+', '', text)
                  if '斯迪克' not in compact and '江苏斯迪克新材料科技股份有限公司' not in compact:
                      return False, pages, 'company mismatch'
                  broker_key = item['broker'].replace('证券', '')
                  if broker_key not in compact:
                      return False, pages, 'broker mismatch'
                  return True, pages, ''
              except Exception as exc:
                  return False, 0, repr(exc)

          downloaded = []
          for item in candidates:
              last = None
              temp = out / '_temp.pdf'
              for attempt in range(6):
                  try:
                      response = session.get(
                          item['url'],
                          headers={'Referer': item['index']},
                          timeout=(30, 360),
                          allow_redirects=True,
                      )
                      data = response.content
                      if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 150_000:
                          raise RuntimeError(f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}')
                      temp.write_bytes(data)
                      ok, pages, reason = inspect_pdf(temp, item)
                      if not ok:
                          raise RuntimeError(reason)
                      sha = hashlib.sha256(data).hexdigest()
                      downloaded.append({
                          **item,
                          'source': response.url,
                          'data': data,
                          'pages': pages,
                          'bytes': len(data),
                          'sha256': sha,
                      })
                      print('DOWNLOADED', item['broker'], item['title'], 'pages=', pages, 'bytes=', len(data), 'sha256=', sha)
                      temp.unlink(missing_ok=True)
                      break
                  except Exception as exc:
                      last = exc
                      temp.unlink(missing_ok=True)
                      time.sleep(min(2 + attempt, 8))
              else:
                  print('DOWNLOAD FAILED', item['broker'], item['title'], repr(last))
              if len(downloaded) >= 3:
                  break

          if len(downloaded) < 2:
              raise RuntimeError(f'Only {len(downloaded)} complete reports could be downloaded')

          records = []
          for idx, item in enumerate(downloaded[:3], start=1):
              filename = f'{idx:02d}_{clean_filename(item["broker"])}_{clean_filename(item["title"])}_{item["date"]}.pdf'
              path = out / filename
              path.write_bytes(item['data'])
              records.append({k: v for k, v in item.items() if k != 'data'} | {'file': filename})

          lines = [
              '斯迪克（300806）券商深度报告资料包',
              '整理日期：2026-10-28',
              '',
              '收录原则：仅收录公开渠道可直接下载、经PDF结构、页数、公司名称和券商名称核验的完整原始报告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for idx, item in enumerate(records, start=1):
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f'{idx}. {item["broker"]}｜{item["title"]}',
                  f'   发布日期：{item["date"]}',
                  f'   页数：{item["pages"]}页',
                  f'   文件：{item["file"]}',
                  f'   原始PDF：{item["source"]}',
                  f'   研报索引：{item["index"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
              sums.append(f'{item["sha256"]}  {item["file"]}')
          lines += [
              f'合计：{len(records)}份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          pdf_count=$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)
          test "$pdf_count" -ge 2
          test "$pdf_count" -le 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 15
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '斯迪克|江苏斯迪克新材料科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/sidike_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/sidike_broker_test.zip "$PACKAGE"
          unzip -t /tmp/sidike_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/sidike_broker_test.zip | grep -c '\.pdf$')" -eq "$pdf_count"
          rm -f /tmp/sidike_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Sidike-300806-broker-deep-reports
          path: 斯迪克_300806_券商深度报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
