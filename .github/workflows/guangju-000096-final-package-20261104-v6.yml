name: Build Guangju Energy 000096 broker research package

on:
  push:
    branches:
      - tmp/guangju-000096-broker-reports-20261104-v1
    paths:
      - .github/workflows/guangju-000096-final-package-20261104-v6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          python -m pip install --quiet requests pypdf reportlab

      - name: Build and validate package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import BaseDocTemplate, Frame, PageTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak

          CODE = "000096"
          COMPANY = "广聚能源"
          FULL = "深圳市广聚能源股份有限公司"
          PREPARED = "2026-11-04"
          ROOT_NAME = "广聚能源_000096_券商深度研究资料_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          original = {
              "index": 1,
              "date": "2025-05-16",
              "broker": "华西证券",
              "analyst": "戚舒扬、金兵",
              "rating": "买入（首次覆盖）",
              "report_type": "公司深度研究/首次覆盖",
              "title": "综合能源供应商，外延内生踏上新征途",
              "document_form": "券商原始PDF",
              "source_url": "https://notice.10jqka.com.cn/api/original/337d1a292387ebc1.pdf",
              "detail_url": "https://news.10jqka.com.cn/field/sr/19700101/52417839.shtml",
              "filename": "01_20250516_华西证券_综合能源供应商外延内生踏上新征途_券商原始PDF.pdf",
          }

          summaries = [
              {
                  "index": 2,
                  "date": "2017-05-17",
                  "broker": "海通证券",
                  "analyst": "刘威",
                  "rating": "增持（首次覆盖）",
                  "report_type": "公司调研简报/首次覆盖",
                  "title": "受益于成品油定价机制，成品油盈利大幅提高",
                  "document_form": "公开研报摘要索引版（非券商原始PDF）",
                  "source_url": "https://www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId=548343534656",
                  "filename": "02_20170517_海通证券_受益于成品油定价机制成品油盈利大幅提高_公开摘要索引版_非原始PDF.pdf",
                  "summary": (
                      "报告从油品销售、仓储和投资收益等业务线评估公司。核心判断包括：成品油定价机制调整改善行业盈利，"
                      "公司加油站区位和自有仓储形成经营支撑，资本运作可能带来投资收益和估值弹性。公开摘要显示，报告给予增持评级并首次覆盖。"
                  ),
              },
              {
                  "index": 3,
                  "date": "2015-02-03",
                  "broker": "方正证券",
                  "analyst": "谢油送、韩振卿；联系人：栗铭波",
                  "rating": "推荐（上调评级）",
                  "report_type": "公司深度报告",
                  "title": "多重催化剂驱动公司价值重估",
                  "document_form": "公开研报摘要索引版（非券商原始PDF）",
                  "source_url": "https://www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId=476288751279",
                  "filename": "03_20150203_方正证券_多重催化剂驱动公司价值重估_公开摘要索引版_非原始PDF.pdf",
                  "summary": (
                      "报告认为油品销售与仓储业务构成稳定现金流，成品油定价改革、参股金融资产增值、并购重组及控股股东资本运作是主要催化因素。"
                      "公开信息显示，报告将评级由增持上调至推荐，并提示改革进度、油价波动和整合效果等风险。"
                  ),
              },
          ]

          def download_pdf(url: str) -> bytes:
              last = None
              for attempt in range(5):
                  try:
                      r = session.get(
                          url,
                          timeout=(30, 420),
                          allow_redirects=True,
                          headers={
                              "Referer": "https://news.10jqka.com.cn/",
                              "Accept": "application/pdf,*/*;q=0.8",
                          },
                      )
                      print("DOWNLOAD", r.status_code, len(r.content), r.url, r.headers.get("content-type"))
                      if r.status_code == 200 and r.content.startswith(b"%PDF-") and len(r.content) > 100_000:
                          return r.content
                      last = RuntimeError(f"invalid PDF response: status={r.status_code}, bytes={len(r.content)}, type={r.headers.get('content-type')}")
                  except Exception as exc:
                      last = exc
                  time.sleep(1 + attempt)
              raise RuntimeError(f"Original PDF download failed: {last}")

          body_font = "/usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf"
          title_font = "/usr/share/fonts/truetype/arphic-gkai00mp/gkai00mp.ttf"
          if not Path(body_font).exists() or not Path(title_font).exists():
              raise FileNotFoundError("CJK fonts not found")
          pdfmetrics.registerFont(TTFont("CJKBody", body_font))
          pdfmetrics.registerFont(TTFont("CJKTitle", title_font))

          styles = getSampleStyleSheet()
          title_style = ParagraphStyle(
              "TitleCJK", parent=styles["Title"], fontName="CJKTitle", fontSize=20, leading=29,
              alignment=TA_LEFT, textColor=colors.HexColor("#1f2937"), spaceAfter=12,
          )
          heading_style = ParagraphStyle(
              "HeadingCJK", parent=styles["Heading2"], fontName="CJKTitle", fontSize=13, leading=20,
              textColor=colors.HexColor("#374151"), spaceAfter=8,
          )
          body_style = ParagraphStyle(
              "BodyCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=10.5, leading=18,
              textColor=colors.HexColor("#222222"), spaceAfter=10,
          )
          small_style = ParagraphStyle(
              "SmallCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=8.5, leading=14,
              textColor=colors.HexColor("#555555"), spaceAfter=6,
          )
          warning_style = ParagraphStyle(
              "WarningCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=10.5, leading=18,
              textColor=colors.HexColor("#9b1c1c"), backColor=colors.HexColor("#fff4f4"),
              borderColor=colors.HexColor("#d99a9a"), borderWidth=0.8, borderPadding=8, spaceAfter=14,
          )

          PAGE_W, PAGE_H = A4
          def footer(canvas, doc):
              canvas.saveState()
              canvas.setFont("CJKBody", 8)
              canvas.setFillColor(colors.HexColor("#777777"))
              canvas.drawCentredString(PAGE_W / 2, 11 * mm, f"广聚能源（000096.SZ）公开研报摘要索引版  |  第 {doc.page} 页")
              canvas.restoreState()

          def build_summary_pdf(spec: dict, path: Path):
              doc = BaseDocTemplate(
                  str(path), pagesize=A4, leftMargin=20*mm, rightMargin=20*mm,
                  topMargin=20*mm, bottomMargin=20*mm, title=spec["title"], author="OpenAI",
              )
              frame = Frame(doc.leftMargin, doc.bottomMargin, doc.width, doc.height, id="normal")
              doc.addPageTemplates([PageTemplate(id="all", frames=[frame], onPage=footer)])
              meta = [
                  ["公司", f"{FULL}（{CODE}.SZ）"],
                  ["券商", spec["broker"]],
                  ["研究员", spec["analyst"]],
                  ["发布日期", spec["date"]],
                  ["评级", spec["rating"]],
                  ["报告类型", spec["report_type"]],
              ]
              table = Table(meta, colWidths=[30*mm, 120*mm])
              table.setStyle(TableStyle([
                  ("FONTNAME", (0,0), (-1,-1), "CJKBody"),
                  ("FONTSIZE", (0,0), (-1,-1), 10),
                  ("LEADING", (0,0), (-1,-1), 16),
                  ("BACKGROUND", (0,0), (0,-1), colors.HexColor("#f3f4f6")),
                  ("GRID", (0,0), (-1,-1), 0.5, colors.HexColor("#d1d5db")),
                  ("VALIGN", (0,0), (-1,-1), "TOP"),
                  ("LEFTPADDING", (0,0), (-1,-1), 7),
                  ("RIGHTPADDING", (0,0), (-1,-1), 7),
                  ("TOPPADDING", (0,0), (-1,-1), 6),
                  ("BOTTOMPADDING", (0,0), (-1,-1), 6),
              ]))
              story = [
                  Paragraph("公开研报摘要索引版 - 非券商原始PDF", warning_style),
                  Paragraph(html.escape(spec["title"]), title_style),
                  table,
                  Spacer(1, 10*mm),
                  Paragraph("文件性质", heading_style),
                  Paragraph(
                      "本文件仅用于识别、定位和概览对应券商研究报告。它不是券商发布的原始PDF，不包含原报告全文、图表、估值模型、风险提示页或原始版式。报告版权归原券商及作者所有。",
                      body_style,
                  ),
                  PageBreak(),
                  Paragraph("公开信息摘要", heading_style),
                  Paragraph(html.escape(spec["summary"]), body_style),
                  Spacer(1, 5*mm),
                  Paragraph("检索与使用说明", heading_style),
                  Paragraph(
                      "本次公开检索未获得可验证、可直接公开下载的对应券商原始PDF，因此没有绕过账户、会员或付费限制，也没有把网页正文重排后冒充原报告。该索引用于确认报告标题、券商、研究员、日期、评级和研究线索。",
                      body_style,
                  ),
                  Spacer(1, 5*mm),
                  Paragraph("公开来源", heading_style),
                  Paragraph(html.escape(spec["source_url"]), small_style),
                  Paragraph(f"整理日期：{PREPARED}", small_style),
              ]
              doc.build(story)

          manifest = []

          original_path = PDF_DIR / original["filename"]
          original_data = download_pdf(original["source_url"])
          original_path.write_bytes(original_data)
          original_reader = PdfReader(str(original_path), strict=False)
          original_pages = len(original_reader.pages)
          original_text = "\n".join((p.extract_text() or "") for p in original_reader.pages[:min(12, original_pages)])
          if original_pages < 20:
              raise RuntimeError(f"Original PDF page count unexpectedly low: {original_pages}")
          if not (COMPANY in original_text or FULL in original_text or CODE in original_text):
              raise RuntimeError("Original PDF issuer validation failed")
          if "华西" not in original_text or "综合能源" not in original_text:
              raise RuntimeError("Original PDF broker/title validation failed")
          manifest.append({
              **original,
              "actual_pages": original_pages,
              "bytes": len(original_data),
              "sha256": hashlib.sha256(original_data).hexdigest(),
          })

          for spec in summaries:
              path = PDF_DIR / spec["filename"]
              build_summary_pdf(spec, path)
              reader = PdfReader(str(path), strict=False)
              text = "\n".join((p.extract_text() or "") for p in reader.pages)
              required = [COMPANY, CODE, spec["broker"], "非券商原始PDF"]
              missing = [token for token in required if token not in text]
              if missing:
                  raise RuntimeError(f"Summary PDF validation failed for {path.name}: {missing}")
              data = path.read_bytes()
              manifest.append({
                  **spec,
                  "actual_pages": len(reader.pages),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          for item in manifest:
              path = PDF_DIR / item["filename"]
              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {path.name}: {check.stdout}")
              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {path.name}: {render.stdout}")
              item["preview_file"] = str(Path("首页预览") / preview.name)

          readme = [
              f"广聚能源（{CODE}.SZ）券商深度研究资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：1份券商原始PDF + 2份公开研报摘要索引版。",
              "公开渠道仅取得2025年华西证券报告的完整原始PDF；2017年海通证券和2015年方正证券报告未取得可直接公开下载的原始PDF，因此仅制作摘要索引版，并在文件名和首页显著标注。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for i, item in enumerate(manifest, 1):
              readme.extend([
                  f"{i}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；类型：{item['report_type']}；研究员：{item['analyst']}；发布日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   公开来源：{item.get('detail_url') or item.get('source_url')}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称/证券代码、券商与标题、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "未绕过登录、会员或付费限制。",
          ])
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "original_pdf_count": sum(x["document_form"] == "券商原始PDF" for x in manifest),
              "index_pdf_count": sum("摘要索引版" in x["document_form"] for x in manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "文件性质", "报告类型", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256", "公开来源"])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["document_form"], item["report_type"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"], item["actual_pages"], item["bytes"], item["sha256"], item.get("detail_url") or item.get("source_url"),
                  ])
          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("guangju_energy_000096_broker_research_materials_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": payload["original_pdf_count"],
              "index_pdf_count": payload["index_pdf_count"],
              "files": [{k: item[k] for k in ["filename", "document_form", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: guangju-energy-000096-broker-research-materials-3-20261104
          path: |
            guangju_energy_000096_broker_research_materials_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
