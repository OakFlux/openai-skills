name: Build complete Greentown China report PDFs

on:
  push:
    branches:
      - chatgpt-temp-greentown-final-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download every public report page and assemble complete PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pillow img2pdf pypdf
          python3 <<'PY'
          import hashlib
          import io
          import json
          import re
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT = Path('output')
          OUT.mkdir(exist_ok=True)
          CACHE = Path('pages')
          CACHE.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '申万宏源',
                  'date': '2025-08-18',
                  'title': '好房子引领者，理顺机制再出发',
                  'pages': 31,
                  'base': 'https://oss.sdyanbao.com/page/2025/8/18/1223571',
              },
              {
                  'broker': '华泰证券',
                  'date': '2025-01-20',
                  'title': '匠心独运，驭光而行',
                  'pages': 29,
                  'base': 'https://oss.sdyanbao.com/page/2025/1/20/1143859',
              },
              {
                  'broker': '开源证券',
                  'date': '2024-01-22',
                  'title': '自投代建双核驱动，品质龙头逆势攀升',
                  'pages': 25,
                  'base': 'https://oss.sdyanbao.com/page/2024/1/22/924183',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Referer': 'https://www.sdyanbao.com/',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          def clean(s):
              return re.sub(r'[\\/:*?"<>|]+', '_', s).replace(' ', '')

          manifest = []
          for idx, report in enumerate(reports, 1):
              report_dir = CACHE / f'{idx:02d}'
              report_dir.mkdir(exist_ok=True)
              image_paths = []
              dims = []
              for page_no in range(report['pages']):
                  url = f"{report['base']}/{page_no}.png"
                  r = session.get(url, timeout=90)
                  print('GET', url, r.status_code, len(r.content), r.headers.get('content-type'))
                  r.raise_for_status()
                  if len(r.content) < 20_000:
                      raise RuntimeError(f'Page image too small: {url}, {len(r.content)} bytes')
                  try:
                      image = Image.open(io.BytesIO(r.content))
                      image.verify()
                      image = Image.open(io.BytesIO(r.content))
                      dims.append(image.size)
                  except Exception as exc:
                      raise RuntimeError(f'Invalid page image {url}: {exc}')
                  path = report_dir / f'{page_no:03d}.png'
                  path.write_bytes(r.content)
                  image_paths.append(path)

              if len(image_paths) != report['pages']:
                  raise RuntimeError('Missing pages')
              if len(set(dims)) > 3:
                  print('WARNING varied page dimensions', set(dims))

              filename = f"{idx:02d}_{clean(report['broker'])}_{report['date'].replace('-', '')}_绿城中国_{clean(report['title'])}_完整版.pdf"
              pdf_path = OUT / filename
              with pdf_path.open('wb') as f:
                  f.write(img2pdf.convert([str(p) for p in image_paths]))

              reader = PdfReader(str(pdf_path))
              actual_pages = len(reader.pages)
              if actual_pages != report['pages']:
                  raise RuntimeError(f"Page mismatch for {filename}: {actual_pages} != {report['pages']}")
              data = pdf_path.read_bytes()
              if not data.startswith(b'%PDF-') or len(data) < 500_000:
                  raise RuntimeError(f'Invalid assembled PDF: {filename}')
              manifest.append({
                  **report,
                  'filename': filename,
                  'actual_pages': actual_pages,
                  'size_bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'source_type': 'public full-page images assembled losslessly into PDF',
              })

          listing = OUT / '报告清单.txt'
          lines = ['绿城中国（03900.HK）完整版券商深度报告清单', '']
          for i, item in enumerate(manifest, 1):
              lines += [
                  f"{i}. {item['broker']}｜{item['date']}｜{item['title']}",
                  f"   完整页数：{item['actual_pages']}页",
                  f"   文件：{item['filename']}",
                  f"   SHA-256：{item['sha256']}",
                  f"   公开逐页来源：{item['base']}/0.png 起，连续至第 {item['actual_pages']-1}.png",
                  '',
              ]
          listing.write_text('\n'.join(lines), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = OUT / 'Greentown_China_Complete_Reports_3_NEW.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for item in manifest:
                  zf.write(OUT / item['filename'], arcname=item['filename'])
              zf.write(listing, arcname=listing.name)
              zf.write(OUT / 'manifest.json', arcname='manifest.json')
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP integrity error: {bad}')
          print('FINAL', zip_path, zip_path.stat().st_size)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload complete PDF package
        uses: actions/upload-artifact@v4
        with:
          name: greentown-complete-reports-new
          path: |
            output/*.pdf
            output/*.zip
            output/报告清单.txt
            output/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
