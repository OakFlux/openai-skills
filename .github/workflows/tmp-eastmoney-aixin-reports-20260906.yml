name: Temporary Eastmoney Aixin report search

on:
  push:
    branches:
      - tmp-eastmoney-aixin-reports-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query report API and download matches
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io, json, math, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9',
            'Referer':'https://data.eastmoney.com/report/',
            'Origin':'https://data.eastmoney.com',
          })
          api='https://reportapi.eastmoney.com/report/list'
          ranges=[
            ('2026-04-27','2026-05-02'),
            ('2026-06-09','2026-06-14'),
            ('2026-07-23','2026-07-30'),
            ('2026-08-13','2026-08-18'),
          ]
          matches={}
          for begin,end in ranges:
            page=1; total_pages=1
            while page<=total_pages and page<=30:
              params={
                'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0',
                'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),
                'pageNumber':str(page),'client':'WEB','source':'WEB'
              }
              r=s.get(api,params=params,timeout=(20,90)); r.raise_for_status()
              obj=r.json(); batch=obj.get('data') or []
              if isinstance(batch,dict): batch=batch.get('data') or batch.get('list') or batch.get('records') or []
              hits=int(obj.get('hits') or obj.get('Hits') or obj.get('total') or 0)
              total_pages=max(1,math.ceil(hits/100))
              print('API',begin,end,page,'ROWS',len(batch),'HITS',hits,'PAGES',total_pages,flush=True)
              for rec in batch:
                title=str(rec.get('title') or rec.get('TITLE') or '')
                stock=str(rec.get('stockName') or rec.get('SECURITY_NAME_ABBR') or '')
                code=str(rec.get('stockCode') or rec.get('SECURITY_CODE') or '')
                joined=title+stock+code
                if '爱芯元智' in joined or code in {'00600','0600'}:
                  info=str(rec.get('infoCode') or rec.get('INFO_CODE') or '')
                  if info:
                    matches[info]=rec
                    print('MATCH',json.dumps({k:rec.get(k) for k in ['stockName','stockCode','title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName']},ensure_ascii=False),flush=True)
              if not batch: break
              page+=1; time.sleep(.15)
          results=[]
          for info,rec in matches.items():
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info}_1.pdf',
            ]
            row={'infoCode':info,'record':rec,'attempts':[]}
            for u in urls:
              try:
                rr=s.get(u,headers={'Referer':f'https://data.eastmoney.com/report/info/{info}.html','Accept':'application/pdf,*/*'},timeout=(20,180),allow_redirects=True)
                data=rr.content
                att={'url':u,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
                row['attempts'].append(att)
                print('PDFTRY',info,att,flush=True)
                if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                  pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                  path=out/f'{info}.pdf'; path.write_bytes(data)
                  row.update({'downloaded':path.name,'pages':pages,'bytes':len(data),'url':rr.url})
                  print('PDF_OK',info,pages,len(data),rr.url,flush=True)
                  break
              except Exception as e:
                row['attempts'].append({'url':u,'error':repr(e)})
                print('PDFERR',info,u,repr(e),flush=True)
            results.append(row)
          (out/'matches.json').write_text(json.dumps(list(matches.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL_MATCHES',len(matches),'DOWNLOADED',sum('downloaded' in x for x in results),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-aixin-report-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
