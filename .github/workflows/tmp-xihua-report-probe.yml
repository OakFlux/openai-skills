name: Temporary Xihua Technology broker report probe

on:
  push:
    branches: [tmp-xihua-report-probe-20260830]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public broker-report indexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests
          from pathlib import Path

          out = {'eastmoney': [], 'sdyanbao': [], 'tests': []}
          s = requests.Session()
          s.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'})

          # Eastmoney stock-report API
          body = {
              'pageSize': 100, 'pageNo': 1, 'p': 1, 'pageNum': 1, 'pageNumber': 1,
              'beginTime': '2025-01-01', 'endTime': '2026-08-30',
              'code': '603248', 'industryCode': '*', 'rating': None,
              'ratingChange': None, 'orgCode': None, 'rcode': ''
          }
          r = s.post('https://reportapi.eastmoney.com/report/list2', json=body,
                     headers={'Referer':'https://data.eastmoney.com/','Content-Type':'application/json','Accept':'application/json,text/plain,*/*'}, timeout=90)
          print('EASTMONEY', r.status_code, len(r.content), r.headers.get('content-type'))
          print('EASTMONEY_HEAD', r.text[:1000])
          r.raise_for_status()
          obj = r.json()
          for row in obj.get('data') or []:
              keep = {k: row.get(k) for k in [
                  'publishDate','orgSName','orgName','title','attachPages','attachSize',
                  'infoCode','encodeUrl','stockCode','stockName','reportType','ratingName',
                  'author','authorID','predictThisYearEps','predictNextYearEps'
              ]}
              out['eastmoney'].append(keep)
              print('EM_ROW', json.dumps(keep, ensure_ascii=False))
              info = row.get('infoCode')
              if info:
                  for prefix in ['H3','H2','H1']:
                      u = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                      try:
                          x = s.get(u, headers={'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'}, timeout=60, allow_redirects=True)
                          rec = {'source':'eastmoney','infoCode':info,'prefix':prefix,'url':x.url,'status':x.status_code,'bytes':len(x.content),'content_type':x.headers.get('content-type'),'head':x.content[:12].hex()}
                          out['tests'].append(rec)
                          print('PDF_TEST', json.dumps(rec, ensure_ascii=False))
                      except Exception as e:
                          print('PDF_ERR', info, prefix, repr(e))

          # Sdyanbao public search index
          sd = requests.Session()
          sd.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
              'Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'
          })
          queries = ['锡华科技', '603248', '江苏锡华新能源科技', '锡华科技 首次覆盖', '锡华科技 深度报告']
          seen = set()
          for q in queries:
              payload = {'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
              rr = sd.post('https://api.sdyanbao.com/api/file/search', json=payload, timeout=90)
              print('SD_SEARCH', q, rr.status_code, len(rr.content), rr.headers.get('content-type'))
              rr.raise_for_status()
              data = (rr.json().get('data') or {})
              print('SD_TOTAL', q, data.get('total'))
              for f in data.get('files') or []:
                  blob = ' '.join([str(f.get('name') or ''), str(f.get('content') or '')[:1000], str(f.get('stock') or '')])
                  if '锡华科技' not in blob and '603248' not in blob and '江苏锡华新能源科技' not in blob:
                      continue
                  fid = f.get('id')
                  if fid in seen:
                      continue
                  seen.add(fid)
                  keep = {k:f.get(k) for k in ['id','name','time_text','page_count','file_size','data_source','data_source_uuid','original_id','online_url','page_url','share_url','keyword','summary','content']}
                  keep['organization'] = (f.get('organization') or {}).get('name')
                  keep['stock'] = f.get('stock')
                  keep['researcher'] = f.get('researcher')
                  out['sdyanbao'].append(keep)
                  print('SD_ROW', json.dumps(keep, ensure_ascii=False))
                  # Test public download API without credentials only; record response.
                  try:
                      d = sd.post('https://api.sdyanbao.com/api/file/download', json={'id':fid}, timeout=60)
                      rec = {'source':'sdyanbao_download_api','id':fid,'status':d.status_code,'bytes':len(d.content),'content_type':d.headers.get('content-type'),'body':d.text[:500]}
                      out['tests'].append(rec)
                      print('SD_DOWNLOAD', json.dumps(rec, ensure_ascii=False))
                  except Exception as e:
                      print('SD_DOWNLOAD_ERR', fid, repr(e))
                  # If metadata exposes an AP code, test Eastmoney PDF mirrors.
                  uuid = str(f.get('data_source_uuid') or '')
                  for info in re.findall(r'AP\d+', uuid):
                      for prefix in ['H3','H2','H1']:
                          u = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                          try:
                              x = s.get(u, headers={'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'}, timeout=60, allow_redirects=True)
                              rec = {'source':'sdy_ap_mirror','id':fid,'infoCode':info,'prefix':prefix,'url':x.url,'status':x.status_code,'bytes':len(x.content),'content_type':x.headers.get('content-type'),'head':x.content[:12].hex()}
                              out['tests'].append(rec)
                              print('SD_AP_TEST', json.dumps(rec, ensure_ascii=False))
                          except Exception as e:
                              print('SD_AP_ERR', fid, info, prefix, repr(e))

          Path('xihua_probe.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload probe metadata
        uses: actions/upload-artifact@v4
        with:
          name: Xihua_Report_Probe
          path: xihua_probe.json
          if-no-files-found: error
          retention-days: 1
