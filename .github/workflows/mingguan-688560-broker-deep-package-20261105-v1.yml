name: Package Mingguan broker deep reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mingguan-688560-broker-deep-package-20261105-v1.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import pymupdf
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '明冠新材'
          FULL_NAME = '明冠新材料股份有限公司'
          CODE = '688560'
          CUTOFF = '2026-11-05'
          COMPACT = '20261105'
          ROOT_NAME = f'{COMPANY}_{CODE}_券商深度报告_精选3份_截至{COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          REPORT_DIR = ROOT / '报告PDF'
          PREVIEW_DIR = ROOT / '首页与末页预览'
          DIST = Path('dist')
          for directory in (REPORT_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '民生证券',
                  'date': '2022-05-03',
                  'title': '深度报告：戴得明冠，“膜”出新材',
                  'report_type': '公司深度报告/首次覆盖',
                  'rating': '推荐（首次）',
                  'authors': '邓永康、郭彦辰、李京波',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202205051563625664_1.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202205051563625664.html',
                  'minimum_pages': 28,
                  'title_tokens': ['戴得明冠', '出新材'],
              },
              {
                  'broker': '中泰证券',
                  'date': '2022-12-05',
                  'title': '光伏背板头部企业，全新产品放量驱动成长',
                  'report_type': '公司深度报告/首次覆盖',
                  'rating': '买入（首次覆盖）',
                  'authors': '曾彪、赵宇鹏',
                  'urls': [
                      'https://file.iyanbao.com/pdf/fa95a-9ab02d69-75cb-40c8-9cb6-fc8541197521.pdf',
                  ],
                  'source_page': 'https://www.fxbaogao.com/detail/3482636',
                  'minimum_pages': 20,
                  'title_tokens': ['光伏背板头部企业', '产品放量'],
              },
              {
                  'broker': '天风证券',
                  'date': '2023-01-03',
                  'title': '背板业务持续高增长，POE胶膜+铝塑膜注入新动力',
                  'report_type': '公司深度研究/首次覆盖',
                  'rating': '买入（首次覆盖）',
                  'authors': '孙潇雅、唐婕',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202301031581644417_1.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202301031581644417.html',
                  'minimum_pages': 18,
                  'title_tokens': ['背板业务持续高增长', '铝塑膜注入新动力'],
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=0.8,
              status_forcelist=(403, 408, 425, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}),
              raise_on_status=False,
          )
          adapter = HTTPAdapter(max_retries=retry)
          session.mount('https://', adapter)
          session.mount('http://', adapter)
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Accept': 'application/pdf,*/*;q=0.8',
          })

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def download(item: dict) -> tuple[bytes, str, str]:
              errors = []
              for url in item['urls']:
                  try:
                      response = session.get(
                          url,
                          headers={'Referer': item['source_page']},
                          timeout=240,
                          allow_redirects=True,
                      )
                      print('DOWNLOAD', item['broker'], response.status_code, len(response.content), response.url, response.headers.get('content-type'), flush=True)
                      if response.status_code == 200 and response.content.startswith(b'%PDF') and len(response.content) > 100_000:
                          return response.content, response.url, response.headers.get('content-type') or ''
                      errors.append(f'{url}: status={response.status_code}, bytes={len(response.content)}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              raise RuntimeError(f"下载失败：{item['broker']} {item['title']}；{' | '.join(errors)}")

          records = []
          for index, item in enumerate(reports, start=1):
              data, resolved_url, content_type = download(item)
              reader = PdfReader(io.BytesIO(data), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception:
                      pass
              page_count = len(reader.pages)
              if page_count < item['minimum_pages']:
                  raise RuntimeError(f"报告页数不足：{item['title']} pages={page_count}")

              probe_indices = sorted(set(list(range(min(10, page_count))) + [page_count - 1]))
              text_parts = []
              for page_index in probe_indices:
                  try:
                      text_parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception as exc:
                      print('TEXT_WARNING', item['broker'], page_index, repr(exc), flush=True)
              sample_text = re.sub(r'\s+', ' ', '\n'.join(text_parts)).strip()
              compact_text = re.sub(r'\s+', '', sample_text)
              if COMPANY not in compact_text and FULL_NAME not in compact_text and CODE not in compact_text:
                  raise RuntimeError(f"公司身份校验失败：{item['title']}")
              broker_key = item['broker'].replace('证券', '')
              if item['broker'] not in compact_text and broker_key not in compact_text:
                  raise RuntimeError(f"券商身份校验失败：{item['title']}")
              normalized = compact_text.replace('，', '').replace('“', '').replace('”', '').replace(' ', '')
              for token in item['title_tokens']:
                  norm_token = token.replace('，', '').replace('“', '').replace('”', '').replace(' ', '')
                  if norm_token not in normalized:
                      raise RuntimeError(f"标题校验失败：{item['title']} token={token}")

              safe_title = re.sub(r'[\\/:*?"<>|]+', '_', item['title']).strip(' ._')
              file_name = f"{index:02d}_{item['broker']}_{item['date']}_{safe_title}.pdf"
              path = REPORT_DIR / file_name
              path.write_bytes(data)

              document = pymupdf.open(path)
              if document.page_count != page_count:
                  raise RuntimeError(f'双解析器页数不一致：{file_name}')
              first = document.load_page(0).get_pixmap(matrix=pymupdf.Matrix(1.5, 1.5), alpha=False)
              last = document.load_page(document.page_count - 1).get_pixmap(matrix=pymupdf.Matrix(1.0, 1.0), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 400:
                  raise RuntimeError(f'页面渲染异常：{file_name}')
              first.save(PREVIEW_DIR / f'{Path(file_name).stem}_首页.png')
              last.save(PREVIEW_DIR / f'{Path(file_name).stem}_末页.png')
              document.close()

              record = {
                  'broker': item['broker'],
                  'date': item['date'],
                  'title': item['title'],
                  'report_type': item['report_type'],
                  'rating': item['rating'],
                  'authors': item['authors'],
                  'source_page': item['source_page'],
                  'resolved_url': resolved_url,
                  'file_name': file_name,
                  'page_count': page_count,
                  'file_size_bytes': path.stat().st_size,
                  'content_type': content_type,
                  'sha256': sha256(path),
                  'pdf_header_valid': True,
                  'company_identity_validated': True,
                  'broker_identity_validated': True,
                  'title_validated': True,
                  'dual_parser_page_count_validated': True,
                  'first_and_last_pages_rendered': True,
                  'first_pages_text_sample': sample_text[:2600],
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 3:
              raise RuntimeError(f'报告数量异常：{len(records)}')

          manifest = {
              'company_short_name': COMPANY,
              'company_full_name': FULL_NAME,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'selection_note': '精选3份可公开下载并完成完整性核验的券商原始公司深度或首次覆盖报告。',
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{record['sha256']}  报告PDF/{record['file_name']}\n" for record in records),
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）券商深度报告精选',
              '',
              f'- 截止日期：{CUTOFF}',
              f'- 原始完整PDF：{len(records)}份；合计页数：{sum(record["page_count"] for record in records)}页。',
              '- 选择口径：公司深度研究或首次覆盖报告；仅收录可公开下载并经公司、券商、标题及页数核验的原始PDF。',
              '- 校验项目：PDF文件头、公司与券商身份、标题、最低页数、双解析器页数、首末页渲染、SHA-256及ZIP CRC。',
              '',
              '## 文件清单',
              '',
          ]
          for number, record in enumerate(records, start=1):
              readme += [
                  f'{number}. `{record["file_name"]}`',
                  f'   - 机构：{record["broker"]}；日期：{record["date"]}',
                  f'   - 标题：{record["title"]}',
                  f'   - 类型：{record["report_type"]}；评级：{record["rating"]}',
                  f'   - 研究人员：{record["authors"]}',
                  f'   - 页数：{record["page_count"]}',
                  f'   - 原始PDF：{record["resolved_url"]}',
                  f'   - SHA-256：`{record["sha256"]}`',
              ]
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          cn_zip = DIST / f'{ROOT_NAME}.zip'
          en_zip = DIST / f'mingguan_new_material_688560_broker_deep_reports_3_{COMPACT}.zip'
          with zipfile.ZipFile(cn_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(cn_zip, en_zip)

          for zip_path in (cn_zip, en_zip):
              with zipfile.ZipFile(zip_path, 'r') as archive:
                  bad_member = archive.testzip()
                  if bad_member:
                      raise RuntimeError(f'ZIP CRC校验失败：{bad_member}')
                  pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdf_names) != 3:
                      raise RuntimeError(f'ZIP内PDF数量异常：{len(pdf_names)}')
              print('ZIP_VERIFIED', zip_path, zip_path.stat().st_size, sha256(zip_path), flush=True)

          print('FINAL_SUMMARY', json.dumps({
              'chinese_zip': str(cn_zip),
              'english_zip': str(en_zip),
              'zip_size_bytes': cn_zip.stat().st_size,
              'zip_sha256': sha256(cn_zip),
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'records': records,
          }, ensure_ascii=False), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mingguan-688560-broker-deep-reports-20261105-v1
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
