name: Probe archived Wuhan Fingu report PDF 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_wayback_probe_20261022.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Query web archives and candidate files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,re,html,urllib.parse,os
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'}
          targets=[
            'www.sgpjbg.com/baogao/16990.html',
            'bg.sgpjbg.com/baogao/16990.html',
            'www.sgpjbg.com/bgdown/16990.html',
            'bg.sgpjbg.com/bgdown/16990.html',
          ]
          all_urls=[];index=[]
          for target in targets:
            u='https://web.archive.org/cdx/search/cdx?url='+urllib.parse.quote(target,safe='')+'&output=json&filter=statuscode:200&fl=timestamp,original,statuscode,mimetype,digest&collapse=digest&from=2020&to=2026'
            try:
              r=s.get(u,headers=h,timeout=(20,90));print('CDX',target,r.status_code,len(r.content),r.url);open('out/cdx_'+re.sub(r'\W+','_',target)+'.txt','wb').write(r.content)
              data=r.json() if r.status_code==200 else []
            except Exception as e:print('CDXERR',target,repr(e));continue
            rows=data[1:] if data and isinstance(data,list) else []
            for row in rows[-10:]:
              ts,orig,status,mime,digest=row
              snap=f'https://web.archive.org/web/{ts}id_/{orig}'
              try:
                rr=s.get(snap,headers=h,timeout=(20,120),allow_redirects=True);text=rr.text
                print('SNAP',ts,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'))
                fn='out/snapshot_'+ts+'_'+re.sub(r'\W+','_',target)+'.html';open(fn,'w',encoding='utf-8',errors='replace').write(text)
                rec={'target':target,'timestamp':ts,'snapshot':snap,'status':rr.status_code,'bytes':len(rr.content),'final_url':rr.url};index.append(rec)
                soup=BeautifulSoup(text,'lxml')
                for tag in soup.find_all(True):
                  for a in ['href','src','data-src','data-url','data-file','data-pdf','content']:
                    v=tag.get(a)
                    if not v:continue
                    v=html.unescape(str(v)).replace('\\/','/')
                    cand=urllib.parse.urljoin(orig,v)
                    if any(k in cand.lower() for k in ['.pdf','download','bgdown','fileroot','16990']):all_urls.append(cand)
                for m in re.findall(r'https?://[^\s"\'<>]+',text):
                  m=html.unescape(m).replace('\\/','/')
                  if any(k in m.lower() for k in ['.pdf','download','bgdown','fileroot','16990']):all_urls.append(m)
              except Exception as e:print('SNAPERR',ts,orig,repr(e))
          all_urls=list(dict.fromkeys(all_urls));json.dump(all_urls,open('out/candidate_urls.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);json.dump(index,open('out/index.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('URLCOUNT',len(all_urls))
          for u in all_urls:print('URL',u)
          # Try direct and archived candidate URLs.
          results=[]
          for i,u in enumerate(all_urls[:300]):
            candidates=[u]
            if 'web.archive.org/web/' in u:
              candidates.append(re.sub(r'/web/\d+(?:id_)?/','/web/2id_/',u))
            for cu in candidates:
              try:
                r=s.get(cu,headers={**h,'Referer':'https://www.sgpjbg.com/baogao/16990.html'},timeout=(15,90),allow_redirects=True);data=r.content
                rec={'url':cu,'status':r.status_code,'bytes':len(data),'type':r.headers.get('content-type',''),'final_url':r.url,'magic':data[:20].hex()};results.append(rec);print('FETCH',json.dumps(rec,ensure_ascii=False))
                if data.startswith(b'%PDF') and len(data)>20000:
                  open(f'out/report_{i}.pdf','wb').write(data)
              except Exception as e:results.append({'url':cu,'error':repr(e)})
          json.dump(results,open('out/fetch_results.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuhan-fingu-wayback-probe
          path: out
          retention-days: 3
          if-no-files-found: error
