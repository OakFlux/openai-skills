name: Capture Wuhan Fingu report from public topic page 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_wayback_probe_20261022.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet selenium requests beautifulsoup4 lxml pypdf
      - name: Browse topic page and capture public download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/downloads out/screens out/json
          python - <<'PY'
          import os,json,time,re,hashlib,traceback,requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from pypdf import PdfReader

          OUT=os.path.abspath('out');DL=os.path.join(OUT,'downloads')
          topic='https://bg.sgpjbg.com/zhuanti/xintiandichanjituanbaogao.html'
          opts=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1920,4000','--lang=zh-CN','--ignore-certificate-errors','--disable-popup-blocking','--disable-blink-features=AutomationControlled']:
              opts.add_argument(a)
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36')
          opts.add_experimental_option('prefs',{'download.default_directory':DL,'download.prompt_for_download':False,'download.directory_upgrade':True,'plugins.always_open_pdf_externally':True,'safebrowsing.enabled':True})
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=opts);d.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':DL});d.set_page_load_timeout(80)
          print('OPEN',topic,flush=True);d.get(topic);time.sleep(10)
          print('TOPIC',d.current_url,d.title,flush=True)
          open('out/topic.html','w',encoding='utf-8',errors='replace').write(d.page_source)
          d.save_screenshot('out/screens/topic.png')
          links=[]
          for e in d.find_elements(By.CSS_SELECTOR,'a'):
              txt=(e.text or '').strip();href=e.get_attribute('href');outer=e.get_attribute('outerHTML')
              if href:links.append({'text':txt[:500],'href':href,'outer':outer[:1500]})
          json.dump(links,open('out/json/topic_links.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          targets=[x for x in links if ('武汉凡谷' in x['text'] or '16990' in x['href'] or '专注基站射频' in x['text'])]
          print('TARGET_LINKS',json.dumps(targets,ensure_ascii=False,indent=2),flush=True)
          candidates=[]
          perf=d.get_log('performance')
          for item in perf:
              try:
                  m=json.loads(item['message'])['message'];p=m.get('params',{});obj=p.get('request') or p.get('response') or {};u=obj.get('url')
                  if u and ('16990' in u or '.pdf' in u.lower() or 'fileroot' in u.lower()):candidates.append({'kind':'topic_network','url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')})
              except:pass
          for target in targets:
              href=target['href']
              try:
                  before=set(os.listdir(DL));old_handles=list(d.window_handles);old=d.current_url
                  print('NAV',href,flush=True);d.get(href);time.sleep(10)
                  print('AFTER_NAV',d.current_url,d.title,'newfiles',sorted(set(os.listdir(DL))-before),flush=True)
                  d.save_screenshot('out/screens/nav_'+str(len(candidates))+'.png')
                  src=d.page_source;open('out/nav_'+str(len(candidates))+'.html','w',encoding='utf-8',errors='replace').write(src)
                  for e in d.find_elements(By.CSS_SELECTOR,'a,button'):
                      txt=(e.text or '').strip();u=e.get_attribute('href') or e.get_attribute('data-url') or e.get_attribute('data-href')
                      if u and any(k in (txt+' '+u).lower() for k in ['下载','pdf','download','bgdown','fileroot','16990']):candidates.append({'kind':'nav_dom','url':u,'text':txt})
                  for item in d.get_log('performance'):
                      try:
                          m=json.loads(item['message'])['message'];p=m.get('params',{});obj=p.get('request') or p.get('response') or {};u=obj.get('url')
                          if u and any(k in u.lower() for k in ['16990','.pdf','download','fileroot']):candidates.append({'kind':'nav_network','url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')})
                      except:pass
                  d.get(topic);time.sleep(5)
              except Exception as e:print('NAVERR',href,repr(e),flush=True)
          cookies={c['name']:c['value'] for c in d.get_cookies()};d.quit()
          # Try all public candidate URLs with the topic-session cookies.
          ded=[];seen=set()
          for x in candidates:
              u=x.get('url')
              if not u or u.startswith(('javascript:','data:','blob:')):continue
              if u.startswith('//'):u='https:'+u
              if u.startswith('http://'):u='https://'+u[7:]
              x['url']=u
              if u not in seen:seen.add(u);ded.append(x)
          candidates=ded
          json.dump(candidates,open('out/json/candidates.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          s=requests.Session();s.trust_env=False;s.cookies.update(cookies)
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':topic,'Accept':'application/pdf,text/html,*/*'}
          results=[]
          for i,x in enumerate(candidates):
              u=x['url']
              try:
                  r=s.get(u,headers=h,timeout=(15,90),allow_redirects=True);data=r.content
                  rec={'url':u,'final_url':r.url,'status':r.status_code,'type':r.headers.get('content-type',''),'bytes':len(data),'magic':data[:20].hex()};results.append(rec);print('FETCH',json.dumps(rec,ensure_ascii=False),flush=True)
                  if data.startswith(b'%PDF') and len(data)>20000:
                      fn=f'report_{i}.pdf';open(os.path.join(DL,fn),'wb').write(data)
              except Exception as e:results.append({'url':u,'error':repr(e)})
          # Inspect any Chrome or requests downloads.
          files=[]
          for name in os.listdir(DL):
              p=os.path.join(DL,name)
              if os.path.isfile(p):
                  data=open(p,'rb').read();rec={'file':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'magic':data[:20].hex()}
                  if data.startswith(b'%PDF'):
                      try:rec['pages']=len(PdfReader(p,strict=False).pages)
                      except Exception as e:rec['pdf_error']=repr(e)
                  files.append(rec)
          json.dump(results,open('out/json/fetch_results.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump(files,open('out/json/downloaded_files.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('FILES',json.dumps(files,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuhan-fingu-topic-download-capture
          path: out
          retention-days: 7
          if-no-files-found: error
