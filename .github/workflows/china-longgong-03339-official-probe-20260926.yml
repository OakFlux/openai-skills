name: Probe China Longgong 03339 official reports page 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-03339-official-probe-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect official report pages and scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out = Path('probe')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          pages = [
              'https://www.lonking.cn/invest/periodic-reports.htm',
              'https://www.lonkinggroup.com/invest/periodic-reports.htm',
              'http://www.lonkinggroup.com/invest/periodic-reports.htm',
              'https://www.lonking.cn/invest/stock-exchange-report.htm',
          ]
          report = []
          all_scripts = []
          for i, url in enumerate(pages, 1):
              try:
                  r = s.get(url, timeout=(20, 120), allow_redirects=True)
                  print('\nPAGE', i, url, 'STATUS', r.status_code, 'FINAL', r.url, 'BYTES', len(r.content), 'TYPE', r.headers.get('content-type'), flush=True)
                  (out / f'page_{i:02d}.html').write_bytes(r.content)
                  text = r.text
                  soup = BeautifulSoup(text, 'lxml')
                  anchors=[]
                  for a in soup.find_all('a', href=True):
                      href=urljoin(r.url,a.get('href'))
                      label=' '.join(a.get_text(' ',strip=True).split())
                      anchors.append({'href':href,'label':label})
                      if any(k in (href+' '+label).lower() for k in ['pdf','report','annual','interim','年报','年報','中期','2026','2025','2024','2023','2022','2021','2020']):
                          print('ANCHOR', json.dumps({'href':href,'label':label},ensure_ascii=False),flush=True)
                  (out/f'anchors_{i:02d}.json').write_text(json.dumps(anchors,ensure_ascii=False,indent=2),encoding='utf-8')
                  for tag in soup.find_all('script',src=True):
                      src=urljoin(r.url,tag.get('src'))
                      all_scripts.append(src)
                      print('SCRIPT',src,flush=True)
                  # Print lines containing likely endpoints/data.
                  for n,line in enumerate(text.splitlines(),1):
                      low=line.lower()
                      if any(k in low for k in ['.pdf','ajax','api/','periodic','report','download','pageurl','channelid','dataurl','getlist','loadmore','2025','2026']):
                          print(f'LINE {i}:{n}:', line[:1000], flush=True)
                  report.append({'url':url,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'type':r.headers.get('content-type')})
              except Exception as exc:
                  print('PAGE_ERROR',url,repr(exc),flush=True)
                  report.append({'url':url,'error':repr(exc)})

          for j,src in enumerate(dict.fromkeys(all_scripts),1):
              try:
                  r=s.get(src,timeout=(20,120),allow_redirects=True)
                  print('\nSCRIPT_FETCH',j,src,r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
                  suffix='.js' if 'javascript' in (r.headers.get('content-type') or '').lower() or src.lower().endswith('.js') else '.txt'
                  (out/f'script_{j:02d}{suffix}').write_bytes(r.content)
                  text=r.text
                  for n,line in enumerate(text.splitlines(),1):
                      low=line.lower()
                      if any(k in low for k in ['ajax','periodic','report','download','.pdf','pageurl','getlist','loadmore','api/']):
                          print(f'SCRIPT_LINE {j}:{n}:',line[:1200],flush=True)
              except Exception as exc:
                  print('SCRIPT_ERROR',src,repr(exc),flush=True)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-03339-official-probe
          path: probe
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
