name: Build Hebang Biotechnology 603077 annual reports package 20261016

on:
  push:
    paths:
      - '.github/workflows/hebang-603077-annual-reports-2020-2025-latest-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '603077'
          COMPANY_SHORT = '和邦生物'
          COMPANY_FULL = '四川和邦生物科技股份有限公司'
          PACKAGE = '和邦生物_603077_2020-2025年报及最新定期报告'
          ZIP_NAME = PACKAGE + '.zip'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEW_DIR = ROOT / '首页预览'
          PREVIEW_DIR.mkdir(exist_ok=True)

          annual_specs = [
              {'variants':['2020年年度报告'], 'period':'2020', 'filename':'01_和邦生物_2020年年度报告.pdf', 'min_pages':80},
              {'variants':['2021年年度报告'], 'period':'2021', 'filename':'02_和邦生物_2021年年度报告.pdf', 'min_pages':80},
              {'variants':['2022年年度报告'], 'period':'2022', 'filename':'03_和邦生物_2022年年度报告.pdf', 'min_pages':80},
              {'variants':['2023年年度报告'], 'period':'2023', 'filename':'04_和邦生物_2023年年度报告.pdf', 'min_pages':80},
              {'variants':['2024年年度报告'], 'period':'2024', 'filename':'05_和邦生物_2024年年度报告.pdf', 'min_pages':80},
              {'variants':['2025年年度报告'], 'period':'2025', 'filename':'06_和邦生物_2025年年度报告.pdf', 'min_pages':80},
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows: list[dict[str, Any]] = []
          search_pages: list[dict[str, Any]] = []

          for page in range(1, 51):
              params = {
                  'sr':'-1', 'page_size':'100', 'page_index':str(page),
                  'ann_type':'A', 'client_source':'web', 'stock_list':STOCK_CODE,
                  'f_node':'0', 's_node':'0',
              }
              data = None
              last: Any = None
              for attempt in range(8):
                  try:
                      r = session.get(api, params=params, timeout=(20, 120))
                      last = {'status':r.status_code,'text':r.text[:300]}
                      if r.status_code == 200:
                          data = r.json()
                          break
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'Announcement API failed page {page}: {last}')
              rows = ((data.get('data') or {}).get('list') or [])
              search_pages.append({'page':page,'count':len(rows)})
              if not rows:
                  break
              all_rows.extend(rows)
              time.sleep(0.08)

          def compact(text: str) -> str:
              return re.sub(r'\s+', '', text or '')

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '')

          def date_value(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or '')

          bad_common = [
              '摘要','英文版','取消','问询','回复','审计报告','董事会','监事会',
              '更正公告','提示性公告','社会责任报告','环境、社会及管治报告',
              '可持续发展报告','独立董事述职报告','内部控制评价报告','财务决算报告',
              '年度报告说明会','年度报告网上说明会','募集资金','会计师事务所',
              '前期会计差错更正后的财务报表','财务报表及相关附注',
          ]

          def choose_report(variants: list[str], period: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              candidates: list[tuple[int, str, dict[str, Any], str]] = []
              for row in all_rows:
                  raw = str(row.get('title') or '')
                  title = compact(raw)
                  matched = next((key for key in variants if compact(key) in title), None)
                  if not matched or any(compact(x) in title for x in bad_common):
                      continue
                  score = 50
                  key = compact(matched)
                  if title.endswith(key): score += 35
                  if title == key: score += 20
                  if title.startswith(COMPANY_SHORT) or title.startswith(COMPANY_FULL): score += 15
                  if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score += 100
                  if any(x in title for x in ['取消版','已取消']): score -= 100
                  candidates.append((score, date_value(row), row, matched))
              candidates.sort(key=lambda x:(x[0],x[1]), reverse=True)
              if not candidates:
                  raise RuntimeError(f'Missing report: {variants}')
              log = [
                  {'period':period,'matched_variant':matched,'score':score,'date':date,'title':row.get('title'),'art_code':art_code(row)}
                  for score,date,row,matched in candidates[:20]
              ]
              return candidates[0][2], log

          def choose_latest_quarter() -> tuple[dict[str, Any], str, list[dict[str, Any]]]:
              desired = [
                  (['2026年第三季度报告','2026年三季度报告'], '2026Q3'),
                  (['2026年第一季度报告','2026年一季度报告'], '2026Q1'),
                  (['2025年第三季度报告','2025年三季度报告'], '2025Q3'),
                  (['2025年第一季度报告','2025年一季度报告'], '2025Q1'),
              ]
              combined: list[dict[str, Any]] = []
              for variants, period in desired:
                  try:
                      row, log = choose_report(variants, period)
                      combined.extend(log)
                      return row, period, combined
                  except RuntimeError:
                      continue
              raise RuntimeError('Missing latest quarterly report')

          def choose_latest_interim() -> tuple[dict[str, Any] | None, str | None, list[dict[str, Any]]]:
              desired = [
                  (['2026年半年度报告','2026年半年报'], '2026H1'),
                  (['2025年半年度报告','2025年半年报'], '2025H1'),
              ]
              combined: list[dict[str, Any]] = []
              for variants, period in desired:
                  try:
                      row, log = choose_report(variants, period)
                      combined.extend(log)
                      return row, period, combined
                  except RuntimeError:
                      continue
              return None, None, combined

          selected: list[dict[str, Any]] = []
          candidate_logs: dict[str, Any] = {}

          for spec in annual_specs:
              row, log = choose_report(spec['variants'], spec['period'])
              candidate_logs[f"{spec['period']}年年度报告"] = log
              selected.append({
                  'period':spec['period'], 'filename':spec['filename'],
                  'min_pages':spec['min_pages'], 'doc_type':'年度报告', 'row':row,
              })

          quarter_row, quarter_period, quarter_log = choose_latest_quarter()
          candidate_logs['最新季报'] = quarter_log
          selected.append({
              'period':quarter_period,
              'filename':f'07_和邦生物_{quarter_period}_最新季报.pdf',
              'min_pages':5, 'doc_type':'最新季报', 'row':quarter_row,
          })

          interim_row, interim_period, interim_log = choose_latest_interim()
          candidate_logs['最新半年度报告'] = interim_log
          if interim_row is not None:
              selected.append({
                  'period':interim_period,
                  'filename':f'08_和邦生物_{interim_period}_最新半年度报告.pdf',
                  'min_pages':30, 'doc_type':'半年度报告', 'row':interim_row,
              })

          def fetch_pdf(art: str, referer: str) -> tuple[bytes, dict[str, Any], str]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art}_1.pdf',
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(5):
                      try:
                          rr = session.get(url, timeout=(30, 420), allow_redirects=True, headers={
                              'User-Agent':session.headers['User-Agent'], 'Referer':referer,
                              'Accept':'application/pdf,*/*;q=0.8',
                          })
                          last = {'url':url,'status':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type',''),'bytes':len(rr.content)}
                          if rr.status_code == 200 and rr.content[:5] == b'%PDF-' and len(rr.content) > 30_000:
                              return rr.content, last, url
                      except Exception as exc:
                          last = {'url':url,'error':repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {art}: {last}')

          manifest: list[dict[str, Any]] = []
          for spec in selected:
              row = spec.pop('row')
              art = art_code(row)
              if not art:
                  raise RuntimeError(f'No art code for {spec["filename"]}')
              detail_page = f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html'
              data, download_meta, mirror_pdf = fetch_pdf(art, detail_page)
              dest = ROOT / spec['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {dest.name}: {pages} < {spec["min_pages"]}')

              extracted = ''
              for p in reader.pages[:min(15, pages)]:
                  try:
                      extracted += '\n' + (p.extract_text() or '')
                  except Exception:
                      pass
              identity_ok = any(x in extracted for x in ['和邦生物','603077','四川和邦生物科技'])
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')

              period_token = str(spec['period']).replace('Q1','').replace('Q3','').replace('H1','')
              if period_token not in extracted[:40000]:
                  raise RuntimeError(f'Report period check failed: {dest.name}')

              subprocess.run(
                  ['qpdf','--warning-exit-0','--check',str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run([
                  'pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview render failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **spec,
                  'announcement_title':row.get('title'),
                  'announcement_date':row.get('display_time'),
                  'art_code':art,
                  'announcement_detail_page':detail_page,
                  'mirror_pdf_url':mirror_pdf,
                  'official_sse_company_announcements':f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK_CODE}',
                  'actual_pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'identity_text_check':identity_ok,
                  'download_meta':download_meta,
                  'preview_file':str(Path('首页预览') / preview.name),
                  'validation':['PDF header','announcement-title match','issuer identity','report period','minimum page count','qpdf structure','first-page render'],
              })

          readme = [
              '四川和邦生物科技股份有限公司（603077.SH）2020-2025年年度报告及最新定期报告资料包',
              '整理日期：2026-10-16',
              '',
              '本包收录2020年至2025年完整年度报告，以及截至整理日最新已披露的独立季度报告。',
              '截至2026-10-16，2026年第三季度报告尚未披露，最新独立季度报告为2026年第一季度报告。',
              '为覆盖更近期的财务信息，另补充收录2026年半年度报告。',
              '所有文件均排除摘要、英文版、说明会公告及其他非报告全文。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   文件类型：{item['doc_type']}；公告标题：{item['announcement_title']}",
                  f"   公告日期：{item['announcement_date']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   公告页面：{item['announcement_detail_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '核验项目：PDF文件头、公告标题、公司名称/证券代码、报告期、最低页数、qpdf结构检查、首页渲染。',
              '来源说明：公告元数据来自公开公告索引；PDF全文由公开公告镜像获取，并与公告标题及公司身份逐一匹配。',
              '上交所公司公告索引：https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=603077',
          ]
          (ROOT / 'README_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps({
              'company':COMPANY_FULL,
              'stock_code':STOCK_CODE,
              'prepared_on':'2026-10-16',
              'announcement_search_pages':search_pages,
              'candidate_selection_logs':candidate_logs,
              'files':manifest,
          }, ensure_ascii=False, indent=2), encoding='utf-8')

          sums = []
          for item in manifest:
              sums.append(f"{item['sha256']}  {item['filename']}")
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')

          with zipfile.ZipFile(ZIP_NAME, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      zf.write(path, arcname=path.as_posix())

          zip_path = Path(ZIP_NAME)
          if not zip_path.exists() or zip_path.stat().st_size < 1_000_000:
              raise RuntimeError('Final ZIP was not created correctly')
          print(json.dumps({
              'zip':ZIP_NAME,
              'zip_bytes':zip_path.stat().st_size,
              'files':[{'name':x['filename'],'pages':x['actual_pages'],'sha256':x['sha256']} for x in manifest],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hebang-603077-2020-2025-annual-reports-latest-20261016
          path: 和邦生物_603077_2020-2025年报及最新定期报告.zip
          if-no-files-found: error
          retention-days: 7
