name: Discover Sdyanbao PDF and search APIs 20261012

on:
  push:
    paths:
      - '.github/workflows/sdyanbao-api-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect known report and site scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.sdyanbao.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=['https://www.sdyanbao.com/detail/954582','https://www.sdyanbao.com/detail/976333','https://www.sdyanbao.com/search?keyword=%E6%B1%87%E5%98%89%E6%97%B6%E4%BB%A3','https://www.sdyanbao.com/']
          scripts=set()
          for idx,url in enumerate(urls,1):
            try:
              r=s.get(url,timeout=(15,90),allow_redirects=True)
              print('PAGE',idx,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; soup=BeautifulSoup(text,'lxml')
              print('TITLE',idx,soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              links=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data-url','data-src','onclick'):
                  val=tag.get(attr)
                  if not val: continue
                  sv=str(val)
                  if attr in ('href','src','data-url','data-src'): sv=urllib.parse.urljoin(r.url,sv)
                  if tag.name=='script' and attr=='src': scripts.add(sv)
                  if any(k in sv.lower() for k in ('pdf','download','file','api','report','detail')) or '下载' in sv or '原文' in sv:
                    links.append({'tag':tag.name,'attr':attr,'value':sv,'text':' '.join(tag.get_text(' ',strip=True).split())[:200]})
              print('LINKS',idx,json.dumps(links[:500],ensure_ascii=False),flush=True)
              raw_urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',text)))
              interesting=[u.replace('\\/','/') for u in raw_urls if any(k in u.lower() for k in ('pdf','download','file','api','oss','report'))]
              print('URLS',idx,json.dumps(interesting[:500],ensure_ascii=False),flush=True)
              for pat in ('pdf','download','fileUrl','url','reportId','detail','api','954582','汇嘉时代'):
                snips=[]
                for m in list(re.finditer(pat,text,re.I))[:100]: snips.append(text[max(0,m.start()-350):min(len(text),m.end()+700)])
                if snips: print('SNIPS',idx,pat,json.dumps(snips[:50],ensure_ascii=False),flush=True)
            except Exception as e: print('PAGE_ERR',idx,url,repr(e),flush=True)
          for i,url in enumerate(sorted(scripts),1):
            try:
              r=s.get(url,timeout=(15,90)); text=r.text
              print('SCRIPT',i,r.status_code,len(r.content),url,flush=True)
              hits=[]
              for pat in ('pdf','download','fileUrl','search','detail','api','report'):
                for m in list(re.finditer(pat,text,re.I))[:100]: hits.append(text[max(0,m.start()-250):min(len(text),m.end()+500)])
              if hits: print('SCRIPT_HITS',url,json.dumps(hits[:100],ensure_ascii=False),flush=True)
            except Exception as e: print('SCRIPT_ERR',url,repr(e),flush=True)
          PY
