name: Build final public Jiangshun 001400 broker reports 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jiangshun-001400-public-broker-reports-final-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='001400'
          SHORT='江顺科技'
          FULL='江苏江顺精密科技集团股份有限公司'
          PACKAGE='江顺科技_001400_券商研究报告_公开完整PDF_2份'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'华金证券','date':'2025-04-13','title':'新股覆盖研究：江顺科技',
              'analysts':'李蕙','rating':'未评级（新股覆盖）','info':'AP202504131656008571',
              'expected_pages':10,'classification':'新股覆盖研究'
            },
            {
              'broker':'西南证券','date':'2025-09-02','title':'2025半年报点评：国内铝型材挤压模具龙头，海外市场布局值得期待',
              'analysts':'邰桂龙、周鑫雨','rating':'增持','info':'AP202509021738144259',
              'expected_pages':12,'classification':'公司研究/半年报专题'
            },
          ]

          s=requests.Session();s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def safe(x:str)->str:
            return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',x))[:110]

          manifest=[];total_pages=0
          for idx,rep in enumerate(reports,1):
            detail=f"https://data.eastmoney.com/report/info/{rep['info']}.html"
            data=None;source='';attempts=[]
            for prefix in ('H3','H2','H1','H4'):
              url=f"https://pdf.dfcfw.com/pdf/{prefix}_{rep['info']}_1.pdf"
              for attempt in range(6):
                try:
                  r=s.get(url,headers={'User-Agent':ua,'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'},timeout=(30,300),allow_redirects=True)
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:
                    data=r.content;source=url;break
                except Exception as exc:
                  attempts.append({'url':url,'attempt':attempt+1,'error':repr(exc)})
                time.sleep(1+attempt)
              if data:break
            if not data:raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

            filename=f"{idx:02d}_{safe(rep['broker'])}_江顺科技_{safe(rep['title'])}_{rep['date']}.pdf"
            dest=PDFDIR/filename;dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False);pages=len(reader.pages)
            if pages!=rep['expected_pages']:
              raise RuntimeError(f'Page mismatch {filename}: {pages} != {rep["expected_pages"]}')
            total_pages+=pages

            text=''
            for page in reader.pages[:min(12,pages)]:
              try:text+='\n'+(page.extract_text() or '')
              except Exception:pass
            compact=re.sub(r'\s+','',text)
            identity_hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
            broker_aliases={
              '华金证券':['华金证券','HUAJIN SECURITIES'],
              '西南证券':['西南证券','SOUTHWEST SECURITIES'],
            }.get(rep['broker'],[rep['broker']])
            broker_hits=[x for x in broker_aliases if re.sub(r'\s+','',x).lower() in compact.lower()]
            if len(compact)>500 and not identity_hits:raise RuntimeError(f'Issuer mismatch: {filename}')
            if len(compact)>500 and not broker_hits:raise RuntimeError(f'Broker mismatch: {filename}')

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:raise RuntimeError(f'Preview failed: {filename}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **rep,'filename':str(Path('原始PDF')/filename),'actual_pages':pages,
              'bytes':len(data),'sha256':sha,'source_report_page':detail,'source_pdf_url':source,
              'identity_hits':identity_hits,'broker_hits':broker_hits,
              'preview_file':str(Path('首页预览')/preview.name),'download_attempts':attempts,
              'validation':['PDF header','issuer identity','broker identity','exact page count','qpdf structure','first-page render']
            })

          readme=[
            '江苏江顺精密科技集团股份有限公司（001400.SZ）券商研究报告资料包',
            '整理日期：2026-10-28','',
            '本包收录2份公开可直接取得、并通过完整性核验的券商原始PDF。',
            '说明：公开检索到的中泰证券26页深度报告、申万宏源32页首次覆盖报告及国投证券22页首次覆盖报告，其完整PDF均需登录、积分或付费权限，因此未绕过访问限制，也未以网页摘要冒充原始报告。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",'']
          readme += [
            f'合计：{len(manifest)}份PDF，{total_pages}页。',
            '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、券商标识、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zcn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file():z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
            bad=z.testzip();pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2:raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')
          zen=Path('jiangshun_001400_public_broker_reports_2.zip');zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: jiangshun-001400-public-broker-reports-final
          path: |
            江顺科技_001400_券商研究报告_公开完整PDF_2份.zip
            jiangshun_001400_public_broker_reports_2.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
