name: Global date search for 2016 Huaying broker reports

on:
  push:
    paths:
      - '.triggers/huaying-2016-global-date-search-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Search Eastmoney global report API by narrow dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json,*/*','Referer':'https://data.eastmoney.com/report/','Content-Type':'application/json'})
          windows=[
            ('2016-05-27','2016-06-01'),
            ('2016-08-10','2016-08-17'),
          ]
          needles=['华映科技','000536','华丽转身','拐点将现','溢流玻璃','6代IGZO','IGZO+OLED','3D玻璃有望爆发']
          found=[]
          for begin,end in windows:
            for endpoint in ('https://reportapi.eastmoney.com/report/list','https://reportapi.eastmoney.com/report/list2'):
              for page in range(1,121):
                payload={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'code':'','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','rcode':'','qType':'0','fields':''}
                try:
                  if endpoint.endswith('list2'):
                    r=s.post(endpoint,json=payload,timeout=(15,90))
                  else:
                    r=s.get(endpoint,params=payload,timeout=(15,90),headers={'Referer':'https://data.eastmoney.com/report/'})
                  print('QUERY',begin,end,endpoint.split('/')[-1],page,r.status_code,len(r.content),flush=True)
                  if r.status_code!=200: break
                  j=r.json(); rows=j.get('data') or []
                  total=j.get('total') or j.get('hits') or j.get('count')
                  print('COUNT',len(rows),'TOTAL',total,flush=True)
                  for row in rows:
                    blob=json.dumps(row,ensure_ascii=False)
                    if any(n in blob for n in needles):
                      print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
                      found.append(row)
                  if len(rows)<100: break
                  time.sleep(.05)
                except Exception as e:
                  print('ERR',begin,end,endpoint,page,repr(e),flush=True); break
          print('FOUND_TOTAL',len(found),flush=True)
          print('FOUND_JSON',json.dumps(found,ensure_ascii=False),flush=True)
          PY
