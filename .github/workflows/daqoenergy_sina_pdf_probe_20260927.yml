name: Daqo Energy Sina Prospectus PDF Probe

on:
  push:
    branches:
      - chatgpt-daqoenergy-filings-20260927
    paths:
      - .github/workflows/daqoenergy_sina_pdf_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Probe likely PDF paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json
          from datetime import date, timedelta
          import requests
          from pypdf import PdfReader

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=688303&id=7385536'})
          start=date(2021,7,1); end=date(2021,7,22)
          bases=[
            'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/{y}/{ym}/{d}/7385536.PDF',
            'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/{y}/{ym}/{d}/7385536.PDF',
          ]
          day=start
          found=[]
          while day<=end:
            for template in bases:
              url=template.format(y=day.year,ym=f'{day.year}-{day.month}',d=day.isoformat())
              try:
                r=s.get(url,timeout=40,allow_redirects=True)
                head=repr(r.content[:16])
                print('TRY',day.isoformat(),r.status_code,len(r.content),r.url,r.headers.get('content-type'),head)
                if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100000:
                  reader=PdfReader(io.BytesIO(r.content))
                  rec={'url':url,'final_url':r.url,'bytes':len(r.content),'pages':len(reader.pages),'encrypted':reader.is_encrypted}
                  found.append(rec); print('FOUND',json.dumps(rec,ensure_ascii=False))
              except Exception as e: print('ERR',url,repr(e))
            day+=timedelta(days=1)
          print('ALL_FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          if not found: raise SystemExit('No prospectus PDF found')
          PY
