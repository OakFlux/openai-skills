name: Package Suotong 603612 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/suotong-603612-broker-deep-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY='索通发展'
          COMPANY_FULL='索通发展股份有限公司'
          STOCK_CODE='603612'
          AS_OF='2026-10-28'
          PACKAGE='索通发展_603612_券商深度与首次覆盖报告_完整版_3份_截至20261028'
          ROOT=Path(PACKAGE)
          PDF_DIR=ROOT/'PDF原文'
          PREVIEW_DIR=ROOT/'首页预览'
          PDF_DIR.mkdir(parents=True,exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'中邮证券','report_date':'2023-09-17',
              'title':'盈利恢复，预焙阳极龙头再启航',
              'analysts':'李帅华、王靖涵','rating':'买入（维持）',
              'report_type':'公司深度报告','min_pages':28,
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202309171599025886_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202309171599025886.html',
              'filename':'01_中邮证券_索通发展_盈利恢复，预焙阳极龙头再启航_2023-09-17.pdf'
            },
            {
              'broker':'浙商证券','report_date':'2022-09-30',
              'title':'国内独立预焙阳极龙头，拟收购欣源快速切入负极赛道',
              'analysts':'张雷；联系人：黄华栋、杨子伟','rating':'买入（首次覆盖）',
              'report_type':'公司深度报告','min_pages':36,
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202210071578931342_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202210071578931342.html',
              'filename':'02_浙商证券_索通发展_国内独立预焙阳极龙头，拟收购欣源快速切入负极赛道_2022-09-30.pdf'
            },
            {
              'broker':'开源证券','report_date':'2021-11-29',
              'title':'持续进击的预焙阳极龙头',
              'analysts':'赖福洋','rating':'买入（首次覆盖）',
              'report_type':'公司首次覆盖报告','min_pages':24,
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202111301531970124_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202111301531970124.html',
              'filename':'03_开源证券_索通发展_持续进击的预焙阳极龙头_2021-11-29.pdf'
            },
          ]

          session=requests.Session(); session.trust_env=False
          retry=Retry(total=8,connect=8,read=8,status=8,backoff_factor=1,
                      status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)
          session.mount('https://',HTTPAdapter(max_retries=retry))
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def compact(value: str) -> str:
              return re.sub(r'[\s，。、“”‘’：:；;（）()—－+&·]+','',str(value or '')).lower()

          manifest=[]; hashes=set()
          for spec in reports:
              data=None; meta={}
              for attempt in range(8):
                  try:
                      r=session.get(spec['url'],timeout=(30,480),allow_redirects=True,headers={
                        'User-Agent':ua,'Accept':'application/pdf,*/*;q=0.8','Referer':'https://data.eastmoney.com/report/'})
                      meta={'status':r.status_code,'final_url':r.url,
                            'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                      if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                          data=r.content; break
                  except Exception as exc:
                      meta={'error':repr(exc)}
                  time.sleep(1+attempt)
              if data is None:
                  raise RuntimeError(f"download failed {spec['title']}: {meta}")

              dest=PDF_DIR/spec['filename']
              dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f"too few pages {dest.name}: {pages} < {spec['min_pages']}")

              text=''
              ids=list(range(min(35,pages)))
              if pages>35:
                  ids += list(range(max(0,pages-3),pages))
              for i in dict.fromkeys(ids):
                  try: text += '\n' + (reader.pages[i].extract_text() or '')
                  except Exception: pass
              text_c=compact(text)
              if not any(compact(x) in text_c for x in [COMPANY,COMPANY_FULL,STOCK_CODE]):
                  raise RuntimeError(f'issuer identity mismatch: {dest.name}')
              broker_short=spec['broker'].replace('证券','')
              if compact(spec['broker']) not in text_c and compact(broker_short) not in text_c:
                  raise RuntimeError(f'broker identity mismatch: {dest.name}')
              title_tokens=[t for t in re.split(r'[，、“”+：:——]',spec['title']) if len(compact(t))>=4]
              title_hits=sum(compact(t) in text_c for t in title_tokens[:8])
              if title_hits < 1:
                  raise RuntimeError(f'title identity mismatch: {dest.name}, hits={title_hits}')

              sha=hashlib.sha256(data).hexdigest()
              if sha in hashes:
                  raise RuntimeError(f'duplicate report: {dest.name}')
              hashes.add(sha)

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,
                             stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              for page_num,suffix in [(1,'首页'),(pages,'末页')]:
                  prefix=PREVIEW_DIR/f'{dest.stem}_{suffix}'
                  subprocess.run(['pdftoppm','-f',str(page_num),'-l',str(page_num),'-singlefile','-png','-r','130',
                                  str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  preview=Path(str(prefix)+'.png')
                  if not preview.exists() or preview.stat().st_size<8000:
                      raise RuntimeError(f'preview failed: {dest.name} page={page_num}')

              manifest.append({**spec,'actual_pages':pages,'bytes':len(data),'sha256':sha,
                'download_meta':meta,'document_nature':'券商原始完整PDF',
                'validation':['PDF header','issuer identity','broker identity','title identity','minimum page count',
                              'qpdf structure','first-page render','last-page render','duplicate hash check']})

          readme=[
            '索通发展股份有限公司（603612.SH）券商深度与首次覆盖报告资料包',
            f'整理基准日：{AS_OF}','',
            '本包收录3份公开可直接取得并通过全文核验的券商原始完整PDF。',
            '筛选标准：优先公司深度、首次覆盖和长篇公司研究；排除年报、季报、事件点评和网页摘要。',''
          ]
          for i,m in enumerate(manifest,1):
              readme += [
                f"{i}. {m['broker']}：《{m['title']}》",
                f"   类型：{m['report_type']}；日期：{m['report_date']}；分析师：{m['analysts']}；评级：{m['rating']}",
                f"   完整页数：{m['actual_pages']}页；文件：PDF原文/{m['filename']}",
                f"   来源页面：{m['source_page']}",
                f"   SHA-256：{m['sha256']}",'']
          readme += [
            '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、券商身份、标题、页数下限、qpdf结构、首末页渲染、重复文件、ZIP CRC及SHA-256。'
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3:
                  raise RuntimeError(f'zip validation failed: bad={bad}, pdfs={len(pdfs)}')

          short=Path('suotong_603612_broker_deep_reports_3.zip')
          shutil.copy2(zip_path,short)
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'SHA256',hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: suotong-603612-broker-deep-reports-final-20261028
          path: |
            索通发展_603612_券商深度与首次覆盖报告_完整版_3份_截至20261028.zip
            suotong_603612_broker_deep_reports_3.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
