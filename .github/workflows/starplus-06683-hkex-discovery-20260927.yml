name: Discover Star Plus Legend 06683 HKEX filings 20260927

on:
  push:
    paths:
      - '.github/workflows/starplus-06683-hkex-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query HKEX title-search API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests

          BASE='https://www1.hkexnews.hk'
          SEARCH=BASE+'/search/titleSearchServlet.do'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept':'application/json,text/javascript,*/*;q=0.8',
              'Accept-Language':'en-US,en;q=0.9,zh-CN;q=0.8',
              'Referer':BASE+'/search/titlesearch.xhtml?lang=en',
          })

          def get_json(url, params=None):
              for i in range(5):
                  try:
                      r=s.get(url, params=params, timeout=(20,120))
                      print('GET',r.status_code,r.url,'bytes',len(r.content),flush=True)
                      r.raise_for_status(); return r.text
                  except Exception as e:
                      print('retry',i+1,repr(e),flush=True); time.sleep(2*(i+1))
              raise RuntimeError('failed '+url)

          raw=get_json(BASE+'/search/prefix.do', {'callback':'cb','lang':'EN','type':'A','name':'6683','market':'SEHK'})
          payload=json.loads(raw[raw.index('(')+1:raw.rindex(')')])
          infos=payload['stockInfo']
          print('PREFIX',json.dumps(infos,ensure_ascii=False),flush=True)
          sid=[x for x in infos if str(x.get('code','')).lstrip('0')=='6683'][0]['stockId']
          print('STOCK_ID',sid,flush=True)

          def search(label, **kwargs):
              params=dict(sortDir=0,sortByOptions='DateTime',category=0,market='SEHK',stockId=sid,
                          documentType=-1,fromDate=20150101,toDate=20991231,title='',searchType=1,
                          t1code=-2,t2Gcode=-2,t2code=-2,rowRange=500,lang='E')
              params.update(kwargs)
              raw=get_json(SEARCH,params)
              outer=json.loads(raw)
              res=outer.get('result',[])
              rows=json.loads(res) if isinstance(res,str) else res
              print('\n###',label,'COUNT',len(rows),flush=True)
              for row in rows:
                  print(json.dumps({k:row.get(k) for k in ['NEWS_ID','TITLE','DATE_TIME','FILE_LINK','FILE_TYPE','SHORT_TEXT']},ensure_ascii=False),flush=True)
              return rows

          all_sets={}
          all_sets['annual_en']=search('annual_en',t1code=40000,t2code=40100,lang='E')
          all_sets['interim_en']=search('interim_en',t1code=40000,t2code=40200,lang='E')
          for q in ['global offering','prospectus','listing document','interim results','interim report','quarterly']:
              all_sets['title_en_'+q.replace(' ','_')]=search('title_en_'+q,title=q,lang='E',fromDate=20230101,toDate=20261231)
          for q in ['全球發售','招股章程','中期業績','中期報告','季度']:
              all_sets['title_zh_'+q]=search('title_zh_'+q,title=q,lang='ZH',fromDate=20230101,toDate=20261231)
          all_sets['listing_window_en']=search('listing_window_en',lang='E',fromDate=20230601,toDate=20230731)
          all_sets['listing_window_zh']=search('listing_window_zh',lang='ZH',fromDate=20230601,toDate=20230731)
          all_sets['latest_window_en']=search('latest_window_en',lang='E',fromDate=20260801,toDate=20260927)
          all_sets['latest_window_zh']=search('latest_window_zh',lang='ZH',fromDate=20260801,toDate=20260927)

          Path('starplus_hkex_discovery.json').write_text(json.dumps({'stock_id':sid,'sets':all_sets},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload discovery JSON
        uses: actions/upload-artifact@v4
        with:
          name: starplus-06683-hkex-discovery
          path: starplus_hkex_discovery.json
          if-no-files-found: error
          retention-days: 7
