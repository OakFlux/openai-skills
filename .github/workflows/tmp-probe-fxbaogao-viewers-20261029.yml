name: Probe fxbaogao full report viewers and pages

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe viewer pages and report assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          from __future__ import annotations
          import html, json, re
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          specs=[
            {'id':'80303','detail':'https://www.fxbaogao.com/detail/80303'},
            {'id':'70124','detail':'https://www.fxbaogao.com/detail/70124'},
            {'id':'660072','detail':'https://www.fxbaogao.com/detail/660072'},
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
          })

          def get(u, **kw):
            return s.get(u, timeout=(25,180), allow_redirects=True, **kw)

          for sp in specs:
            doc=sp['id']; detail=sp['detail']; viewer=f'https://www.fxbaogao.com/view?id={doc}'
            print('\n\n################ DOC',doc,'################')
            for label,u in [('DETAIL',detail),('VIEWER',viewer)]:
              try:
                r=get(u)
                print('\n===',label,r.status_code,len(r.content),r.url,r.headers.get('content-type'),'===')
                text=r.text
                soup=BeautifulSoup(text,'html.parser')
                print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                # Print compact metadata and all asset-like URLs.
                for tag in soup.find_all(['meta','link']):
                  if tag.name=='meta' and (tag.get('name') or tag.get('property')):
                    key=tag.get('name') or tag.get('property'); val=tag.get('content','')
                    if any(k in key.lower() for k in ['title','description','keyword']): print('META',key,val)
                decoded=html.unescape(text).replace('\\/','/')
                patterns=[
                  r'https?://[^\s"\'<>]+',
                  r'[^\s"\'<>]*(?:report-image|report-pdf|report-file|download|pdf|pageCount|totalPage|page_count|total_page|docId|doc_id)[^\s"\'<>]*',
                ]
                for pat in patterns:
                  vals=[]
                  for m in re.findall(pat,decoded,flags=re.I):
                    if isinstance(m,tuple): m=''.join(m)
                    m=m.rstrip('),;]')
                    if m not in vals: vals.append(m)
                  for v in vals[:300]: print('MATCH',v)
                # Next data / script bodies can hold report metadata.
                nd=soup.find('script',id='__NEXT_DATA__')
                if nd: print('NEXT_DATA',nd.get_text()[:20000])
                for sc in soup.find_all('script'):
                  body=sc.get_text() or ''
                  if any(k in body for k in ['report-image', 'pageCount', 'totalPage', 'docId', 'fileUrl', 'pdfUrl']):
                    print('INLINE_SCRIPT',body[:20000])
              except Exception as e:
                print(label,'ERROR',repr(e))

            # Re-fetch detail, infer first image URL, then enumerate pages.
            try:
              r=get(detail); decoded=html.unescape(r.text).replace('\\/','/')
              hits=re.findall(r'https?://[^\s"\'<>]+/report-image/[^\s"\'<>]+?-1\.(?:png|jpg|jpeg)(?:\?[^\s"\'<>]*)?',decoded,flags=re.I)
              print('FIRST_IMAGE_HITS',hits)
              bases=[]
              for hit in hits:
                clean=hit.split('?')[0]
                base=re.sub(r'-1\.(png|jpg|jpeg)$','',clean,flags=re.I)
                ext=clean.rsplit('.',1)[-1]
                bases.append((base,ext))
              bases=list(dict.fromkeys(bases))
              for base,ext in bases:
                print('ENUM_BASE',base,ext)
                missing=0; ok=[]
                for n in range(1,101):
                  u=f'{base}-{n}.{ext}'
                  try:
                    x=get(u,headers={'Referer':detail})
                    good=(x.status_code==200 and len(x.content)>5000 and (x.headers.get('content-type','').startswith('image/') or x.content[:8] in [b'\x89PNG\r\n\x1a\n',b'\xff\xd8\xff\xe0\x00\x10JF']))
                    print('PAGE',n,'STATUS',x.status_code,'BYTES',len(x.content),'TYPE',x.headers.get('content-type'),'GOOD',good,'URL',x.url)
                    if good:
                      ok.append((n,len(x.content),x.url)); missing=0
                    else:
                      missing+=1
                      if missing>=3: break
                  except Exception as e:
                    print('PAGE',n,'ERROR',repr(e)); missing+=1
                    if missing>=3: break
                print('PAGE_SUMMARY',doc,'COUNT',len(ok),'PAGES',[n for n,_,_ in ok])
            except Exception as e:
              print('ENUM_ERROR',repr(e))

            # Probe likely original file paths from known first-image path.
            try:
              r=get(detail); decoded=html.unescape(r.text).replace('\\/','/')
              firsts=re.findall(r'https?://[^\s"\'<>]+/report-image/([^\s"\'<>]+?)-1\.(?:png|jpg|jpeg)',decoded,flags=re.I)
              paths=list(dict.fromkeys(firsts))
              for path in paths:
                date_path=path.rsplit('/',1)[0]; docid=path.rsplit('/',1)[-1]
                candidates=[]
                for host in ['https://public.fxbaogao.com','https://static.fxbaogao.com']:
                  for folder in ['report-pdf','report','report-file','report-download','pdf','files/report','report_pdf']:
                    candidates.append(f'{host}/{folder}/{date_path}/{docid}.pdf')
                for u in candidates:
                  try:
                    x=get(u,headers={'Referer':detail})
                    sig=x.content[:5]
                    if x.status_code==200 or len(x.content)>2000:
                      print('PDF_PROBE',x.status_code,len(x.content),x.headers.get('content-type'),sig,x.url)
                  except Exception as e: pass
            except Exception as e:
              print('PDF_PROBE_ERROR',repr(e))
          PY