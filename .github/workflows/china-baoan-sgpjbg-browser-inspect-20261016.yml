name: Inspect SGPJBG China Baoan report with browser impersonation

on:
  push:
    paths:
      - '.github/workflows/china-baoan-sgpjbg-browser-inspect-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install clients
        run: |
          python -m pip install --quiet curl_cffi beautifulsoup4 lxml
      - name: Fetch topic and inspect report links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          from curl_cffi import requests
          from bs4 import BeautifulSoup

          urls=[
            'https://www.sgpjbg.com.cn/zhuanti/teruisibaogao.html',
            'https://www.sgpjbg.com/zhuanti/teruisibaogao.html',
          ]
          needle='中国宝安：手握贝特瑞核心资产治理优化整装待发'
          sess=requests.Session(impersonate='chrome')
          for u in urls:
            print('\n===== FETCH',u,'=====',flush=True)
            try:
              r=sess.get(u,timeout=60,allow_redirects=True,headers={
                'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
                'Referer':'https://www.baidu.com/',
              })
              print('STATUS',r.status_code,'URL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
              text=r.text
              print('TEXT_START',text[:1000],flush=True)
              pos=text.find(needle)
              print('NEEDLE_POS',pos,flush=True)
              if pos>=0:
                print('CONTEXT',text[max(0,pos-10000):pos+20000],flush=True)
              soup=BeautifulSoup(text,'lxml')
              print('MATCHING_ELEMENTS',flush=True)
              for el in soup.find_all(string=lambda x: x and ('中国宝安' in x or '手握贝特瑞' in x)):
                node=el.parent
                for _ in range(5):
                  if node is None: break
                  print('NODE',node.name,dict(node.attrs),str(node)[:5000],flush=True)
                  node=node.parent
              print('ALL_CANDIDATE_ATTRS',flush=True)
              for tag in soup.find_all(True):
                blob=' '.join([tag.get_text(' ',strip=True),json.dumps(tag.attrs,ensure_ascii=False)])
                if '中国宝安' in blob or '手握贝特瑞' in blob:
                  print('TAG',tag.name,dict(tag.attrs),'TEXT',tag.get_text(' ',strip=True)[:1000],flush=True)
              for script in soup.find_all('script'):
                st=script.get_text('\n')
                if '中国宝安' in st or '手握贝特瑞' in st or ('download' in st.lower() and 'pdf' in st.lower()):
                  print('SCRIPT',st[:20000],flush=True)
            except Exception as e:
              print('ERROR',repr(e),flush=True)
          PY
