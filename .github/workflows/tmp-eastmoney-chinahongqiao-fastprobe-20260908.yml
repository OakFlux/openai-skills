name: Fast probe Eastmoney China Hongqiao reports
on:
  push:
    branches:
      - tmp-eastmoney-chinahongqiao-fastprobe-20260908
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query API
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, requests
          from pathlib import Path
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          for keyword in ['中国宏桥','01378']:
            params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2020-01-01','endTime':'2026-09-08','pageNo':'1','qType':'0','keyword':keyword}
            try:
              r=s.get(url,params=params,timeout=20)
              print('STATUS',keyword,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
              print('HEAD',r.text[:1000],flush=True)
              Path(f'output/{keyword}.txt').write_text(r.text,encoding='utf-8')
              try:
                d=r.json()
                rows=d.get('data') or []
                print('ROWS',keyword,len(rows),'TOTAL',d.get('TotalPage'),flush=True)
                for row in rows:
                  print('ROW',json.dumps({k:row.get(k) for k in ['infoCode','publishDate','orgSName','title','stockName','stockCode','emRatingName']},ensure_ascii=False),flush=True)
              except Exception as e:
                print('JSON_ERROR',keyword,repr(e),flush=True)
            except Exception as e:
              print('REQUEST_ERROR',keyword,repr(e),flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-fastprobe
          path: output/*
          retention-days: 1
