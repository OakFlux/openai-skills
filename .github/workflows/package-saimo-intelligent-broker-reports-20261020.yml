name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Probe public report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://stock.finance.sina.com.cn/',
          })

          list_urls = [
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz300466&t1=all',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=300466&t1=all',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz300466',
          ]

          report_links = []
          for url in list_urls:
              try:
                  response = session.get(url, timeout=(25, 120), allow_redirects=True)
                  response.encoding = 'gb18030'
                  print('\nLIST', url, response.status_code, response.url, len(response.content), flush=True)
                  soup = BeautifulSoup(response.text, 'html.parser')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
                  for link in soup.find_all('a', href=True):
                      label = ' '.join(link.get_text(' ', strip=True).split())
                      href = urljoin(response.url, link['href'])
                      if 'vReport_Show' in href and ('赛摩' in label or '300466' in label or '赛摩' in response.text):
                          print('REPORT_LINK', repr(label), href, flush=True)
                          report_links.append((label, href))
                  text = ' | '.join(soup.get_text('\n', strip=True).splitlines())
                  print('TEXT_HEAD', text[:5000], flush=True)
              except Exception as exc:
                  print('LIST_ERROR', url, repr(exc), flush=True)

          dedup = []
          seen = set()
          for label, href in report_links:
              if href not in seen:
                  seen.add(href)
                  dedup.append((label, href))

          print('\nREPORT_COUNT', len(dedup), flush=True)
          for label, href in dedup[:80]:
              try:
                  response = session.get(href, timeout=(25, 120), allow_redirects=True)
                  response.encoding = 'gb18030'
                  soup = BeautifulSoup(response.text, 'html.parser')
                  title = soup.title.get_text(' ', strip=True) if soup.title else label
                  page_text = ' | '.join(soup.get_text('\n', strip=True).splitlines())
                  print('\nREPORT_PAGE', repr(label), href, response.status_code, len(response.content), flush=True)
                  print('PAGE_TITLE', title, flush=True)
                  print('PAGE_TEXT', page_text[:3500], flush=True)
                  for tag in soup.find_all(['a', 'iframe', 'embed', 'object', 'script', 'link']):
                      text = ' '.join(tag.get_text(' ', strip=True).split())[:160]
                      for attr in ('href', 'src', 'data'):
                          value = tag.get(attr)
                          if not value:
                              continue
                          absolute = urljoin(response.url, value)
                          combined = (text + ' ' + absolute).lower()
                          if any(word in combined for word in ('pdf', '下载', '原文', '附件', 'attach', 'download', 'file')):
                              print('ATTACH', tag.name, attr, repr(text), absolute, flush=True)
                  for line in response.text.splitlines():
                      lower = line.lower()
                      if any(word in lower for word in ('.pdf', 'download', 'attachment', 'attach_url', 'file_url', 'report_url')):
                          print('RAW_LINE', ' '.join(line.split())[:2000], flush=True)
              except Exception as exc:
                  print('REPORT_ERROR', href, repr(exc), flush=True)
          PY
