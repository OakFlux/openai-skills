name: Package Saimo Intelligent broker research web archives

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Build archives
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, shutil, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          AS_OF = '2026-10-20'
          PACKAGE_NAME = '赛摩智能_300466.SZ_券商研究公开网页存档_3份'
          OUT = Path('artifact_out')
          PACKAGE = Path('saimo_public_research_archives') / PACKAGE_NAME
          OUT.mkdir(parents=True, exist_ok=True)
          PACKAGE.mkdir(parents=True, exist_ok=True)

          reports = [
              {'index': 1, 'title': '赛摩电气（300466）：5月28日上市首日定价报告', 'broker': '华泰证券', 'analyst': '赵杨', 'date': '2015-05-27', 'url': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/617430098847/index.phtml'},
              {'index': 2, 'title': '赛摩电气（300466）新股投资参考：预计公司上市初期压力位35元-40元', 'broker': '金融街证券', 'analyst': '赵砚泽', 'date': '2015-05-19', 'url': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/485343912478/index.phtml'},
              {'index': 3, 'title': '赛摩电气（300466）：5月19日推荐申购', 'broker': '华泰证券', 'analyst': '赵杨', 'date': '2015-05-18', 'url': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/617435354565/index.phtml'},
          ]

          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=6, connect=6, read=6, status=6, backoff_factor=1.0, status_forcelist=[429,500,502,503,504], allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})

          def safe(value: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', value).strip(' ._')[:110]

          def body_lines(page_html: str) -> list[str]:
              soup = BeautifulSoup(page_html, 'html.parser')
              for tag in soup(['script', 'style', 'noscript']):
                  tag.decompose()
              lines = [re.sub(r'\s+', ' ', x).strip() for x in soup.get_text('\n').splitlines()]
              lines = [x for x in lines if x]
              start = 0
              for i, line in enumerate(lines):
                  if line.startswith('日期：'):
                      start = i + 1
                      break
              end = len(lines)
              for i in range(start, len(lines)):
                  if lines[i].startswith(('数据推荐', '客户服务热线', '新浪简介', 'About Sina')):
                      end = i
                      break
              body = []
              for line in lines[start:end]:
                  if line in {'类别：公司','研究报告','公司研究','最新滚动','主力动向','个股评级','行业研究','投资策略','宏观研究','金麒麟研报'}:
                      continue
                  if line.startswith(('机构：','研究员：','日期：')) or len(line) <= 1:
                      continue
                  body.append(line)
              if len(''.join(body)) < 120:
                  raise RuntimeError(f'Extracted research text too short: {len("".join(body))}')
              return body

          manifest, sums = [], []
          for report in reports:
              response = session.get(report['url'], timeout=(30,180), allow_redirects=True)
              response.raise_for_status()
              response.encoding = 'gb18030'
              if '赛摩电气' not in response.text and '赛摩智能' not in response.text:
                  raise RuntimeError('Issuer identity missing from source page')
              paragraphs = body_lines(response.text)
              article = '\n'.join(f'<p>{html.escape(p)}</p>' for p in paragraphs)
              page = f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(report['title'])}</title><style>body{{max-width:900px;margin:36px auto;padding:0 28px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#222;line-height:1.8}}h1{{font-size:26px;line-height:1.35}}.meta{{color:#555;border-bottom:1px solid #ddd;padding-bottom:16px;margin-bottom:20px}}.notice{{background:#fff7e6;border:1px solid #e4bd73;padding:14px 16px;margin:18px 0 24px}}p{{text-align:justify;margin:0 0 13px}}.source{{margin-top:28px;padding-top:16px;border-top:1px solid #ddd;font-size:13px;color:#666;word-break:break-all}}</style></head><body><h1>{html.escape(report['title'])}</h1><div class="meta">机构：{report['broker']}　分析师：{report['analyst']}　日期：{report['date']}</div><div class="notice"><strong>存档说明：</strong>本文件是公开券商研究网页的离线文字存档，不是券商发布的原始PDF，也不应被视为长篇深度报告原件。公司当时简称为“赛摩电气”，现为“赛摩智能”。</div><article>{article}</article><div class="source">原始公开页面：{html.escape(report['url'])}<br>存档日期：{AS_OF}</div></body></html>'''
              filename = f'{report["index"]:02d}_{report["date"]}_{safe(report["broker"])}_{safe(report["title"])}_公开网页存档.html'
              path = PACKAGE / filename
              path.write_text(page, encoding='utf-8')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              sums.append(f'{digest}  {filename}')
              manifest.append({**report, 'file_name': filename, 'archive_type': 'public_research_webpage_archive', 'original_pdf_available': False, 'paragraph_count': len(paragraphs), 'sha256': digest})

          readme = f'''# 赛摩智能（300466.SZ）券商研究公开网页存档\n\n整理日期：{AS_OF}\n\n## 重要说明\n\n公开渠道未取得这些报告的原始券商PDF。资料包收录3份可公开核验的券商公司研究网页离线存档，格式为HTML，不是原始PDF，也不冒充15—30页长篇深度报告。\n\n三份材料均发布于2015年公司上市阶段，当时简称为“赛摩电气”；现简称为“赛摩智能”。材料属于上市定价、新股投资参考或申购研究，仅适合回溯上市初期卖方观点。\n\n## 文件清单\n\n1. 华泰证券：《赛摩电气（300466）：5月28日上市首日定价报告》，2015-05-27，赵杨。\n2. 金融街证券：《赛摩电气（300466）新股投资参考：预计公司上市初期压力位35元-40元》，2015-05-19，赵砚泽。\n3. 华泰证券：《赛摩电气（300466）：5月19日推荐申购》，2015-05-18，赵杨。\n\n每个HTML均注明原始公开页面。元数据和校验值见 `manifest.json`、`SHA256SUMS.txt`。\n'''
          (PACKAGE / 'README.md').write_text(readme, encoding='utf-8')
          (PACKAGE / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (PACKAGE / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')

          chinese_zip = OUT / f'{PACKAGE_NAME}.zip'
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(PACKAGE.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE_NAME}/{path.name}')
          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad = archive.testzip()
              html_count = sum(x.lower().endswith('.html') for x in archive.namelist())
              if bad or html_count != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, html_count={html_count}')
          english_zip = OUT / 'Saimo_Intelligent_300466_Public_Broker_Research_Web_Archives_3.zip'
          shutil.copy2(chinese_zip, english_zip)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, hashlib.sha256(chinese_zip.read_bytes()).hexdigest(), flush=True)
          print('BACKUP_ZIP', english_zip, english_zip.stat().st_size, hashlib.sha256(english_zip.read_bytes()).hexdigest(), flush=True)
          PY
