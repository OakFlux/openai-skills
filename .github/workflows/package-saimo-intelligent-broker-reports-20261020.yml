name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect anonymous token and search client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import re
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          s=requests.Session(); s.trust_env=False
          retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=1.0,
                      status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/155 Mobile Safari/537.36'})

          urls=[
              'https://m.fxbaogao.com/static/js/index.4ed7335b.js',
              'https://static.fxbaogao.com/pub/js/config/production.js',
              'https://static.fxbaogao.com/detail_source/js/app-v1.js',
          ]
          targets=[
              '/mofoun/user/user/token',
              '/mofoun/user/user/token/mobile',
              '/mofoun/report/searchReport/search',
              '/mofoun/report/searchReportData/searchList',
              '/mofoun/report/reportStock/search',
              'Authorization', 'accessToken', 'token:', 'baseURL', 'cuid', 'deviceId',
          ]
          for url in urls:
              try:
                  r=s.get(url,timeout=(20,120))
                  text=r.text
                  print('\nFILE',url,r.status_code,len(text),flush=True)
                  for target in targets:
                      pos=0; found=0
                      while True:
                          idx=text.find(target,pos)
                          if idx<0 or found>=8: break
                          start=max(0,idx-4000); end=min(len(text),idx+6500)
                          print('\nTARGET',target,'AT',idx,flush=True)
                          print('CONTEXT',' '.join(text[start:end].split())[:10500],flush=True)
                          pos=idx+len(target); found+=1
              except Exception as exc:
                  print('ERROR',url,repr(exc),flush=True)
          PY
