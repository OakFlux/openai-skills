name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Query report search pages and APIs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          s=requests.Session(); s.trust_env=False
          retry=Retry(total=8,connect=8,read=8,status=8,backoff_factor=1.2,
                      status_forcelist=[429,500,502,503,504],allowed_methods=['GET','POST'],raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry))
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Origin':'https://www.fxbaogao.com',
              'Referer':'https://www.fxbaogao.com/'
          })

          for keyword in ('赛摩电气','赛摩智能','300466'):
              url='https://www.fxbaogao.com/rp?keywords='+quote(keyword)+'&order=2&nop=-1'
              try:
                  r=s.get(url,timeout=(35,180),allow_redirects=True)
                  print('\nRP_PAGE',keyword,r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
                  links=[]
                  for a in soup.find_all('a',href=True):
                      text=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      if '/detail/' in href or '赛摩' in text or '300466' in text:
                          links.append((text,href))
                  print('LINK_COUNT',len(links),flush=True)
                  for text,href in links[:100]:
                      print('LINK',repr(text[:300]),href,flush=True)
                  next_data=soup.find('script',id='__NEXT_DATA__')
                  print('NEXT_DATA',next_data.get_text()[:20000] if next_data else 'NONE',flush=True)
                  page_text=' | '.join(soup.get_text('\n',strip=True).splitlines())
                  print('TEXT',page_text[:12000],flush=True)
              except Exception as e:
                  print('RP_ERROR',keyword,repr(e),flush=True)

          endpoints=[
              'https://api.fxbaogao.com/mofoun/report/searchReport/search',
              'https://api.fxbaogao.com/mofoun/report/searchReportData/searchList',
              'https://api.fxbaogao.com/mofoun/report/reportStock/search',
          ]
          payloads=[]
          for keyword in ('赛摩电气','赛摩智能','300466'):
              payloads.extend([
                  {'keywords':keyword,'pageNo':1,'pageSize':30,'order':2,'nop':-1},
                  {'keyword':keyword,'pageNo':1,'pageSize':30,'order':2,'nop':-1},
                  {'key':keyword,'pageNo':1,'pageSize':30,'order':2,'nop':-1},
                  {'query':keyword,'page':1,'size':30,'order':2,'nop':-1},
                  {'keywords':keyword,'page':1,'limit':30,'order':2,'nop':-1},
              ])
          for endpoint in endpoints:
              for i,payload in enumerate(payloads):
                  for method in ('GET','POST_JSON','POST_FORM'):
                      try:
                          if method=='GET':
                              r=s.get(endpoint,params=payload,timeout=(35,180))
                          elif method=='POST_JSON':
                              r=s.post(endpoint,json=payload,timeout=(35,180))
                          else:
                              r=s.post(endpoint,data=payload,timeout=(35,180))
                          text=r.text
                          print('\nAPI',endpoint,method,i,payload,r.status_code,len(r.content),r.headers.get('content-type'),flush=True)
                          print('BODY',text[:5000],flush=True)
                          if r.status_code==200 and any(k in text for k in ('赛摩电气','赛摩智能','300466')):
                              print('MATCH_RESPONSE',text[:30000],flush=True)
                      except Exception as e:
                          print('API_ERROR',endpoint,method,i,repr(e),flush=True)
          PY
