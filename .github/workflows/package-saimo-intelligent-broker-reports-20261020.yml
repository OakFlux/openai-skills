name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect report platform API routes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session=requests.Session(); session.trust_env=False
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          pages=[
              'https://www.fxbaogao.com/',
              'https://www.fxbaogao.com/detail/2892941',
              'https://www.fxbaogao.com/detail/5216302',
              'https://m.fxbaogao.com/',
          ]
          scripts=[]
          for page in pages:
              try:
                  r=session.get(page,timeout=(25,120),allow_redirects=True)
                  print('\nPAGE',page,r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  for tag in soup.find_all('script',src=True):
                      src=urljoin(r.url,tag['src'])
                      if src not in scripts:
                          scripts.append(src)
                          print('SCRIPT_SRC',src,flush=True)
                  for line in r.text.splitlines():
                      low=line.lower()
                      if any(k in low for k in ('api.fxbaogao.com','mofoun','__next_data__','search','keyword')):
                          print('PAGE_LINE',' '.join(line.split())[:3000],flush=True)
              except Exception as e:
                  print('PAGE_ERROR',page,repr(e),flush=True)

          print('\nSCRIPT_COUNT',len(scripts),flush=True)
          path_pattern=re.compile(r'["\']((?:https://api\.fxbaogao\.com)?/[A-Za-z0-9_./?=&{}:$-]{4,})["\']')
          api_paths=set()
          for idx,src in enumerate(scripts[:120],1):
              try:
                  r=session.get(src,timeout=(25,180))
                  text=r.text
                  print('\nJS',idx,r.status_code,len(r.content),src,flush=True)
                  if r.status_code!=200: continue
                  for m in re.finditer(r'(api\.fxbaogao\.com|/mofoun/|search|keyword|report|detail|download|pdf)',text,re.I):
                      start=max(0,m.start()-350); end=min(len(text),m.end()+700)
                      snippet=' '.join(text[start:end].split())
                      if any(k in snippet.lower() for k in ('mofoun','api.fxbaogao.com','report','search','keyword','download','pdf')):
                          print('SNIP',snippet[:1500],flush=True)
                          break
                  for match in path_pattern.findall(text):
                      low=match.lower()
                      if any(k in low for k in ('mofoun','search','report','detail','download','pdf','document','resource')):
                          api_paths.add(match)
              except Exception as e:
                  print('JS_ERROR',src,repr(e),flush=True)
          print('\nAPI_PATHS',len(api_paths),flush=True)
          for path in sorted(api_paths):
              print('PATH',path,flush=True)
          PY
