name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Probe historical report metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=5, connect=5, read=5, status=5, backoff_factor=1.0,
                        status_forcelist=[429,500,502,503,504], allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/'
          })

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          common = {
              'industryCode':'*', 'pageSize':'5000', 'industry':'*',
              'rating':'*', 'ratingChange':'*', 'pageNo':'1', 'fields':'',
              'orgCode':'', 'rcode':'', 'p':'1', 'pageNum':'1', 'pageNumber':'1'
          }

          tests = []
          for qtype in range(0, 6):
              for key in ('code', 'stockCode', 'securityCode'):
                  params = dict(common)
                  params.update({'beginTime':'2000-01-01','endTime':'2026-10-20','qType':str(qtype), key:'300466'})
                  tests.append((f'q{qtype}_{key}', params))

          for qtype in range(0, 6):
              params = dict(common)
              params.update({'beginTime':'2015-04-01','endTime':'2015-07-31','qType':str(qtype), 'code':''})
              tests.append((f'history_q{qtype}', params))

          for name, params in tests:
              try:
                  response = session.get(endpoint, params=params, timeout=(25,180))
                  print('\nTEST', name, response.status_code, len(response.content), response.url, flush=True)
                  response.raise_for_status()
                  payload = response.json()
                  data = payload.get('data') or []
                  print('COUNT', len(data), 'TOTAL', payload.get('TotalCount') or payload.get('total') or payload.get('count'), flush=True)
                  matches=[]
                  for row in data:
                      blob=json.dumps(row, ensure_ascii=False)
                      if '300466' in blob or '赛摩电气' in blob or '赛摩智能' in blob:
                          matches.append(row)
                  print('MATCHES', len(matches), flush=True)
                  for row in matches[:100]:
                      print('ROW', json.dumps(row, ensure_ascii=False), flush=True)
                  if not matches and len(data) <= 30:
                      for row in data[:10]:
                          print('SAMPLE', json.dumps(row, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('ERROR', name, repr(exc), flush=True)
          PY
