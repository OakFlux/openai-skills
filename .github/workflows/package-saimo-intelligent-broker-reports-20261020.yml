name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Probe report platforms and search engines
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          import re
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          platform_urls = [
              'https://www.fxbaogao.com/search?keyword=' + quote('赛摩电气'),
              'https://www.fxbaogao.com/search?q=' + quote('赛摩电气'),
              'https://www.fxbaogao.com/search?keyword=' + quote('赛摩智能'),
              'https://www.sgpjbg.com/search/?q=' + quote('赛摩电气'),
              'https://www.sgpjbg.com.cn/search/?q=' + quote('赛摩电气'),
              'https://www.hibor.com.cn/newweb/S.aspx?key=' + quote('赛摩电气'),
              'https://wap.hibor.com.cn/search?keyword=' + quote('赛摩电气'),
              'https://www.vzkoo.com/search?keyword=' + quote('赛摩电气'),
              'https://www.vzkoo.com/search/' + quote('赛摩电气'),
          ]

          for url in platform_urls:
              try:
                  r=s.get(url,timeout=(25,120),allow_redirects=True)
                  print('\nPLATFORM',url,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),flush=True)
                  print('CTYPE',r.headers.get('content-type'),flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
                  for a in soup.find_all('a',href=True):
                      text=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      blob=(text+' '+href).lower()
                      if any(k in blob for k in ('赛摩','300466','pdf','download','detail','report','baogao')):
                          print('LINK',repr(text[:200]),href,flush=True)
                  for script in soup.find_all('script'):
                      body=script.string or script.get_text(' ',strip=False)
                      if body and ('赛摩' in body or '300466' in body or '__NEXT_DATA__' in body or 'api' in body.lower()):
                          clean=' '.join(body.split())
                          print('SCRIPT',clean[:8000],flush=True)
                  text=' | '.join(soup.get_text('\n',strip=True).splitlines())
                  print('TEXT_HEAD',text[:6000],flush=True)
              except Exception as e:
                  print('PLATFORM_ERROR',url,repr(e),flush=True)

          queries=[
              '赛摩电气 300466 研报 PDF',
              '赛摩电气 5月28日 上市首日定价报告 PDF',
              '赛摩电气 新股投资参考 35元 40元 PDF',
              '赛摩电气 5月19日 推荐申购 PDF',
              '赛摩智能 券商 深度报告 PDF',
          ]
          engines=[
              ('baidu','https://www.baidu.com/s?wd='),
              ('sogou','https://www.sogou.com/web?query='),
              ('bing','https://www.bing.com/search?mkt=zh-CN&setlang=zh-hans&q='),
              ('so360','https://www.so.com/s?q='),
          ]
          for query in queries:
              for name,prefix in engines:
                  url=prefix+quote(query)
                  try:
                      r=s.get(url,timeout=(25,120),allow_redirects=True)
                      print('\nSEARCH',name,repr(query),r.status_code,r.url,len(r.content),flush=True)
                      soup=BeautifulSoup(r.text,'html.parser')
                      count=0
                      for a in soup.find_all('a',href=True):
                          text=' '.join(a.get_text(' ',strip=True).split())
                          href=urljoin(r.url,a['href'])
                          blob=(text+' '+href).lower()
                          if text and any(k in blob for k in ('赛摩','300466','pdf','研报','报告')):
                              print('RESULT',repr(text[:260]),href,flush=True)
                              count+=1
                              if count>=20: break
                  except Exception as e:
                      print('SEARCH_ERROR',name,repr(query),repr(e),flush=True)
          PY
