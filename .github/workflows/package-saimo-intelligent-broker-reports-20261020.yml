name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Query anonymous report APIs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import uuid
          import requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/155 Mobile Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Content-Type': 'application/json',
              'Origin': 'https://m.fxbaogao.com',
              'Referer': 'https://m.fxbaogao.com/',
              'USER-ID': '0',
              'user-Token': '0',
              'JWT-TOKEN': '',
              'CLIENT-TYPE': 'XCX',
              'CLIENT-TYPE-X': 'h5',
              'CLIENT-ID': str(uuid.uuid4()),
          })

          base = 'https://api.fxbaogao.com'
          endpoints = [
              '/mofoun/report/searchReport/searchNoAuth',
              '/mofoun/report/searchReportData/searchListNoAuth',
          ]
          payload_templates = [
              {'pageNum': 1, 'paragraphSize': 30, 'order': 2, 'nop': -1},
              {'page': 1, 'limit': 30, 'order': 2, 'nop': -1},
              {'pageNo': 1, 'pageSize': 30, 'order': 2, 'nop': -1},
              {'pageNum': 1, 'pageSize': 30, 'sort': 2, 'nop': -1},
          ]

          for keyword in ('赛摩电气', '赛摩智能', '300466'):
              for endpoint in endpoints:
                  for index, template in enumerate(payload_templates, start=1):
                      payload = dict(template)
                      payload['keywords'] = keyword
                      try:
                          response = session.post(base + endpoint, json=payload, timeout=(20, 90))
                          print('\nCALL', keyword, endpoint, index, payload, response.status_code, len(response.content), flush=True)
                          print('BODY', response.text[:60000], flush=True)
                      except Exception as exc:
                          print('ERROR', keyword, endpoint, index, repr(exc), flush=True)

          for key in ('赛摩电气', '赛摩智能', '300466'):
              try:
                  response = session.get(
                      base + '/mofoun/report/reportStock/search',
                      params={'key': key}, timeout=(20, 90),
                  )
                  print('\nSTOCK', key, response.status_code, len(response.content), flush=True)
                  print('BODY', response.text[:30000], flush=True)
              except Exception as exc:
                  print('STOCK_ERROR', key, repr(exc), flush=True)
          PY
