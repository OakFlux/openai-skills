name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Quick probe report search
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Origin':'https://www.fxbaogao.com',
              'Referer':'https://www.fxbaogao.com/'
          })

          for keyword in ('赛摩电气','赛摩智能','300466'):
              url='https://www.fxbaogao.com/rp?keywords='+quote(keyword)+'&order=2&nop=-1'
              try:
                  r=s.get(url,timeout=(12,40),allow_redirects=True)
                  print('\nRP',keyword,r.status_code,r.url,len(r.content),flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.find_all('a',href=True):
                      text=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      if '/detail/' in href or '赛摩' in text or '300466' in text:
                          print('LINK',repr(text[:300]),href,flush=True)
                  next_data=soup.find('script',id='__NEXT_DATA__')
                  print('NEXT',next_data.get_text()[:15000] if next_data else 'NONE',flush=True)
                  text=' | '.join(soup.get_text('\n',strip=True).splitlines())
                  print('TEXT',text[:15000],flush=True)
              except Exception as exc:
                  print('RP_ERROR',keyword,repr(exc),flush=True)

          attempts=[
              ('GET','https://api.fxbaogao.com/mofoun/report/searchReport/search',{'keywords':'赛摩电气','pageNo':1,'pageSize':30,'order':2,'nop':-1}),
              ('POST','https://api.fxbaogao.com/mofoun/report/searchReport/search',{'keywords':'赛摩电气','pageNo':1,'pageSize':30,'order':2,'nop':-1}),
              ('GET','https://api.fxbaogao.com/mofoun/report/searchReportData/searchList',{'keywords':'赛摩电气','pageNo':1,'pageSize':30,'order':2,'nop':-1}),
              ('POST','https://api.fxbaogao.com/mofoun/report/searchReportData/searchList',{'keywords':'赛摩电气','pageNo':1,'pageSize':30,'order':2,'nop':-1}),
              ('GET','https://api.fxbaogao.com/mofoun/report/reportStock/search',{'keyword':'赛摩电气'}),
              ('POST','https://api.fxbaogao.com/mofoun/report/reportStock/search',{'keyword':'赛摩电气'}),
          ]
          for method,url,payload in attempts:
              try:
                  if method=='GET':
                      r=s.get(url,params=payload,timeout=(12,40))
                  else:
                      r=s.post(url,json=payload,timeout=(12,40))
                  print('\nAPI',method,url,payload,r.status_code,len(r.content),r.headers.get('content-type'),flush=True)
                  print('BODY',r.text[:30000],flush=True)
              except Exception as exc:
                  print('API_ERROR',method,url,repr(exc),flush=True)
          PY
