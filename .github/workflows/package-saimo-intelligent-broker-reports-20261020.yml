name: Package Saimo Intelligent broker research reports

on:
  pull_request:
    paths:
      - 'tasks/saimo-intelligent-broker-reports-20261020.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect report search request schema
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          base='https://www.fxbaogao.com/'
          manifest_url=urljoin(base,'_next/static/VBQA2zp3BQNS4XoRG_wN5/_buildManifest.js')
          manifest=s.get(manifest_url,timeout=(25,120)).text
          print('MANIFEST_LEN',len(manifest),flush=True)
          for pattern in (r'"/rp":\[(.*?)\]',r'"/report":\[(.*?)\]',r'"/detail/\[docId\]":\[(.*?)\]'):
              m=re.search(pattern,manifest)
              print('MANIFEST_MATCH',pattern,m.group(0)[:3000] if m else 'NONE',flush=True)
          js_paths=sorted(set(re.findall(r'"(static/chunks/pages/(?:rp|report|detail/\[docId\])[^" ]+\.js)"',manifest)))
          print('ROUTE_JS',len(js_paths),js_paths,flush=True)
          endpoints=(
              '/mofoun/report/searchReport/search',
              '/mofoun/report/searchReportData/searchList',
              '/mofoun/report/searchReport/detail/anon',
              '/mofoun/report/report/report/preDownV2',
          )
          for path in js_paths:
              url=urljoin(base+'_next/',path)
              r=s.get(url,timeout=(25,180))
              text=r.text
              print('\nROUTE_FILE',r.status_code,len(text),url,flush=True)
              for endpoint in endpoints:
                  pos=0
                  while True:
                      idx=text.find(endpoint,pos)
                      if idx<0: break
                      start=max(0,idx-2500); end=min(len(text),idx+5000)
                      print('\nENDPOINT',endpoint,'AT',idx,flush=True)
                      print('CONTEXT',' '.join(text[start:end].split())[:7500],flush=True)
                      pos=idx+len(endpoint)
              for token in ('keywords:', 'pageNo:', 'pageSize:', 'order:', 'nop:', 'reportType:', 'searchReport'):
                  idx=text.find(token)
                  if idx>=0:
                      print('TOKEN',token,'CONTEXT',' '.join(text[max(0,idx-1200):idx+2500].split())[:3500],flush=True)
          PY
