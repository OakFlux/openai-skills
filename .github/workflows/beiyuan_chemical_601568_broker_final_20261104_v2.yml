name: package-beiyuan-chemical-601568-broker-reports-v2

on:
  push:
    branches:
      - tmp/beiyuan-chemical-601568-broker-final-20261104

permissions:
  contents: read

jobs:
  package-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml reportlab

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, html, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import PageBreak, Paragraph, SimpleDocTemplate, Spacer, Table, TableStyle

          COMPANY='北元化工'; OLD='北元集团'; FULL='陕西北元化工集团股份有限公司'; CODE='601568'; PREPARED='2026-11-04'
          ROOT_NAME='北元化工_601568_券商研究报告_2份'; ROOT=Path(ROOT_NAME); PDF_DIR=ROOT/'PDF文件'; PREVIEW_DIR=ROOT/'首页预览'
          PDF_DIR.mkdir(parents=True,exist_ok=True); PREVIEW_DIR.mkdir(parents=True,exist_ok=True)
          pdfmetrics.registerFont(TTFont('CJKBody','/usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf'))
          pdfmetrics.registerFont(TTFont('CJKTitle','/usr/share/fonts/truetype/arphic-gkai00mp/gkai00mp.ttf'))
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          specs=[
            {'sequence':1,'date':'2026-05-31','public_date':'2026-06-01','broker':'国泰海通证券','analyst':'刘威、沈唯、周志鹏','rating':'增持（首次覆盖）','report_type':'首次覆盖/公司研究','title':'依托资源优势，布局以PVC产品为核心的一体化产业链','document_form':'公开网页正文排版版（非券商原始PDF）','original_metadata_pages':5,'source_url':'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/833627200060/index.phtml','metadata_url':'https://www.nxny.com/author/25104_p1.html','filename':'01_20260531_国泰海通证券_北元化工首次覆盖_公开网页正文排版版_非原始PDF.pdf'},
            {'sequence':2,'date':'2021-06-01','broker':'海通证券','analyst':'刘威、邓勇、李智','rating':'优于大市（首次覆盖）','report_type':'首次覆盖/公司研究','title':'依托资源优势，布局以PVC产品为核心的一体化产业链','document_form':'券商原始PDF','source_url':'https://file.iyanbao.com/pdf/664af-9b578c96-b468-4e9f-9d6f-714a237b50c2.pdf','filename':'02_20210601_海通证券_北元集团首次覆盖_券商原始PDF.pdf'}]

          def fetch(url,minimum=1000,referer=None):
            last=None
            for attempt in range(5):
              try:
                headers={'Accept':'application/pdf,text/html,*/*;q=0.8'}
                if referer: headers['Referer']=referer
                r=s.get(url,headers=headers,timeout=(30,420),allow_redirects=True)
                print('DOWNLOAD',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                r.raise_for_status()
                if len(r.content)>=minimum: return r.content,r.url,r.headers.get('content-type','')
                last=RuntimeError('response too small')
              except Exception as e:
                last=e; print('DOWNLOAD_ERROR',attempt,repr(e)); time.sleep(attempt+1)
            raise RuntimeError(f'download failed: {url}: {last}')

          def clean(v):
            v=html.unescape(v or '').replace('\u3000',' ').replace('\xa0',' ')
            return re.sub(r'\s+',' ',v).strip()

          def extract_article(data):
            text=data.decode('gb18030',errors='replace')
            soup=BeautifulSoup(text,'lxml')
            for tag in soup(['script','style','noscript']): tag.decompose()
            heading=clean((soup.find('h1') or soup.title).get_text(' ',strip=True))
            creab=soup.select_one('.creab'); source_line=clean(creab.get_text(' ',strip=True)) if creab else ''
            containers=soup.select('.blk_container') or soup.select('.content')
            paragraphs=[]; seen=set()
            for container in containers:
              nodes=container.find_all(['p','h2','h3','h4','li'],recursive=True) or [container]
              for node in nodes:
                value=clean(node.get_text(' ',strip=True))
                if len(value)<2 or value in seen: continue
                if any(x in value for x in ['文本中涉及股票','新浪财经意见反馈留言板']): continue
                seen.add(value); paragraphs.append(value)
            joined=''.join(paragraphs)
            print('ARTICLE',heading,'PARAS',len(paragraphs),'CHARS',len(joined),'SOURCE',source_line)
            print('FIRST_PARAS',paragraphs[:8])
            if not paragraphs or len(joined)<700: raise RuntimeError(f'public text too short: {len(joined)}')
            if CODE not in heading and COMPANY not in heading and OLD not in heading: raise RuntimeError(f'wrong heading: {heading}')
            return heading,paragraphs,source_line,len(joined)

          def footer(c,doc):
            c.saveState(); c.setFont('CJKBody',8); c.setFillColor(colors.HexColor('#666666')); c.drawCentredString(A4[0]/2,10*mm,f'第 {doc.page} 页'); c.restoreState()

          def make_public_pdf(spec,data,path):
            heading,paras,source_line,char_count=extract_article(data)
            styles=getSampleStyleSheet()
            styles.add(ParagraphStyle(name='Flag',fontName='CJKTitle',fontSize=17,leading=24,alignment=TA_CENTER,textColor=colors.HexColor('#9b1c1c'),spaceAfter=14))
            styles.add(ParagraphStyle(name='TitleCN',fontName='CJKTitle',fontSize=18,leading=27,alignment=TA_CENTER,textColor=colors.HexColor('#1f2937'),spaceAfter=15))
            styles.add(ParagraphStyle(name='BodyCN',fontName='CJKBody',fontSize=10.5,leading=18,alignment=TA_LEFT,firstLineIndent=21,textColor=colors.HexColor('#202020'),spaceAfter=7))
            styles.add(ParagraphStyle(name='SectionCN',fontName='CJKTitle',fontSize=14,leading=21,alignment=TA_LEFT,textColor=colors.HexColor('#1f2937'),spaceBefore=8,spaceAfter=7))
            styles.add(ParagraphStyle(name='SmallCN',fontName='CJKBody',fontSize=8.5,leading=13,alignment=TA_LEFT,textColor=colors.HexColor('#555555'),spaceAfter=4))
            doc=SimpleDocTemplate(str(path),pagesize=A4,rightMargin=20*mm,leftMargin=20*mm,topMargin=18*mm,bottomMargin=18*mm,title=f'{COMPANY}：{spec["title"]}',author=spec['broker'],subject='公开网页正文排版版（非券商原始PDF）')
            story=[Paragraph('公开网页正文排版版（非券商原始PDF）',styles['Flag']),Paragraph(html.escape(heading),styles['TitleCN'])]
            meta=[['公司',f'{FULL}（{CODE}.SH；历史简称：{OLD}）'],['券商',spec['broker']],['研究员',spec['analyst']],['报告日期',f'{spec["date"]}（公开转载日期：{spec["public_date"]}）'],['评级',spec['rating']],['报告类型',spec['report_type']],['原报告页数元数据',f'{spec["original_metadata_pages"]}页']]
            table=Table(meta,colWidths=[34*mm,122*mm],hAlign='LEFT')
            table.setStyle(TableStyle([('FONTNAME',(0,0),(-1,-1),'CJKBody'),('FONTSIZE',(0,0),(-1,-1),10),('LEADING',(0,0),(-1,-1),15),('BACKGROUND',(0,0),(0,-1),colors.HexColor('#f2f4f7')),('GRID',(0,0),(-1,-1),0.4,colors.HexColor('#b7bdc6')),('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),6),('RIGHTPADDING',(0,0),(-1,-1),6),('TOPPADDING',(0,0),(-1,-1),5),('BOTTOMPADDING',(0,0),(-1,-1),5)]))
            story += [table,Spacer(1,8*mm),Paragraph('文件性质说明：本文件依据新浪财经公开展示的报告正文重新排版，不属于券商发布的原始PDF，也不保留原PDF的图表、估值表、原始版式、书签、元数据或附件。正文未作改写；版权归原券商及作者所有。',styles['BodyCN']),Spacer(1,4*mm),Paragraph('公开正文来源：'+html.escape(spec['source_url']),styles['SmallCN']),Paragraph('元数据交叉核验来源：'+html.escape(spec['metadata_url']),styles['SmallCN'])]
            if source_line: story.append(Paragraph('公开页面署名信息：'+html.escape(source_line),styles['SmallCN']))
            story += [PageBreak(),Paragraph('公开网页正文',styles['SectionCN'])]
            markers=('投资要点','核心观点','公司简介','盈利预测','风险提示','投资建议','公司概况','资源优势','一体化','估值','首次覆盖')
            for p in paras:
              compact=re.sub(r'\s+','',p); is_head=len(compact)<=34 and (compact.endswith('：') or compact.endswith(':') or any(compact.startswith(m) for m in markers))
              story.append(Paragraph(html.escape(p),styles['SectionCN'] if is_head else styles['BodyCN']))
            story += [Spacer(1,5*mm),Paragraph('说明：本排版版仅保存公开网页可见正文。原券商PDF中的图表、估值表、附录或特定版式可能未在公开网页中呈现。',styles['SmallCN'])]
            doc.build(story,onFirstPage=footer,onLaterPages=footer)
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages); check=''.join((p.extract_text() or '') for p in reader.pages)
            if COMPANY not in re.sub(r'\s+','',check) or CODE not in re.sub(r'\s+','',check): raise RuntimeError('generated issuer check failed')
            return pages,max(pages-1,1),char_count,source_line

          manifest=[]
          spec=specs[0]; html_data,html_url,html_type=fetch(spec['source_url'],20000); out=PDF_DIR/spec['filename']; pages,body_pages,char_count,source_line=make_public_pdf(spec,html_data,out); data=out.read_bytes()
          manifest.append({**spec,'actual_pages':pages,'report_body_pages':body_pages,'extracted_text_characters':char_count,'public_page署名':source_line,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'downloaded_source_url':html_url,'content_type':html_type})

          spec=specs[1]; pdf_data,pdf_url,pdf_type=fetch(spec['source_url'],100000); out=PDF_DIR/spec['filename']; out.write_bytes(pdf_data)
          if not pdf_data.startswith(b'%PDF-'): raise RuntimeError('2021 response is not PDF')
          reader=PdfReader(str(out),strict=False); pages=len(reader.pages); text=''.join((p.extract_text() or '') for p in reader.pages[:5]); compact=re.sub(r'\s+','',text)
          if pages!=4 or CODE not in compact or not any(n in compact for n in [COMPANY,OLD,FULL]): raise RuntimeError(f'2021 validation failed pages={pages}')
          manifest.append({**spec,'actual_pages':pages,'report_body_pages':pages,'bytes':len(pdf_data),'sha256':hashlib.sha256(pdf_data).hexdigest(),'downloaded_source_url':pdf_url,'content_type':pdf_type})

          for item in manifest:
            path=PDF_DIR/item['filename']; chk=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if chk.returncode!=0: raise RuntimeError(f'qpdf failed: {path.name}: {chk.stdout}')
            preview_page=2 if '非券商原始PDF' in item['document_form'] else 1; prefix=PREVIEW_DIR/path.stem
            rnd=subprocess.run(['pdftoppm','-f',str(preview_page),'-l',str(preview_page),'-png','-r','150','-singlefile',str(path),str(prefix)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            preview=Path(str(prefix)+'.png')
            if rnd.returncode!=0 or not preview.exists() or preview.stat().st_size<8000: raise RuntimeError(f'preview failed: {path.name}: {rnd.stdout}')
            item['preview_file']=str(Path('首页预览')/preview.name)

          readme=[f'{FULL}（{CODE}.SH）券商研究报告资料包',f'整理日期：{PREPARED}','','本包收录2份公司级首次覆盖研究材料：1份券商原始PDF，以及1份公开网页正文排版版。','2020年公开检索到的两份材料均为新股网下询价/申购建议报告，不属于公司深度研究，故未纳入。','','重要文件性质说明：','1. 2021年海通证券报告为券商原始PDF。','2. 2026年国泰海通证券报告的原始PDF未在可直接公开下载渠道取得；包内文件依据新浪财经公开正文排版，文件名和首页已明确标注“非券商原始PDF”。','3. 公开网页正文排版版可能不包含原报告中的图表、估值表、附件及原始版式，未绕过登录、会员或付费限制。','']
          for i,item in enumerate(manifest,1):
            source=item.get('downloaded_source_url') or item['source_url']
            readme += [f'{i}. {item["filename"]}',f'   文件性质：{item["document_form"]}',f'   类型：{item["report_type"]}；券商：{item["broker"]}；研究员：{item["analyst"]}',f'   日期：{item["date"]}；评级：{item["rating"]}',f'   标题：{item["title"]}',f'   PDF实际页数：{item["actual_pages"]}；正文页数：{item["report_body_pages"]}；文件大小：{item["bytes"]}字节',f'   公开来源：{source}',f'   SHA-256：{item["sha256"]}','']
          readme += ['核验项目：PDF文件头、公司名称与证券代码、报告标题、实际页数、qpdf结构、页面渲染、逐文件SHA-256及ZIP CRC。','报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。']
          (ROOT/'README_报告清单与文件性质说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          payload={'company':FULL,'current_short_name':COMPANY,'historical_short_name':OLD,'stock_code':CODE,'prepared_on':PREPARED,'report_count':2,'original_pdf_count':1,'public_text_pdf_count':1,'excluded_materials':['2020-09-24 国元证券《新股网下询价策略：北元集团、东鹏控股》','2020-09-22 东莞证券《新股网下申购询价建议报告：北元集团、澳弘电子》'],'files':manifest}
          (ROOT/'manifest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          with (ROOT/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f); w.writerow(['文件名','文件性质','报告类型','券商','研究员','日期','标题','评级','PDF页数','正文页数','字节数','SHA-256','公开来源'])
            for item in manifest:
              source=item.get('downloaded_source_url') or item['source_url']; w.writerow([item['filename'],item['document_form'],item['report_type'],item['broker'],item['analyst'],item['date'],item['title'],item['rating'],item['actual_pages'],item['report_body_pages'],item['bytes'],item['sha256'],source])
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f'{x["sha256"]}  PDF文件/{x["filename"]}' for x in manifest)+'\n',encoding='utf-8')

          zip_path=Path('beiyuan_chemical_601568_broker_research_reports_2.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=str(Path(ROOT_NAME)/p.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2: raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          result={'package':zip_path.name,'zip_bytes':zip_path.stat().st_size,'zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'report_count':2,'original_pdf_count':1,'public_text_pdf_count':1,'files':[{k:x[k] for k in ['filename','document_form','report_type','broker','analyst','date','title','rating','actual_pages','report_body_pages','bytes','sha256']} for x in manifest]}
          Path('result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'); print('PACKAGE_RESULT',json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: beiyuan-chemical-601568-broker-reports-2-v2-20261104
          path: |
            beiyuan_chemical_601568_broker_research_reports_2.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
