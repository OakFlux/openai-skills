name: Inspect public sources for full Huabao broker reports

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-source-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4 playwright pypdf
      - name: Inspect HTML, APIs, and browser network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect
          python - <<'PY'
          from __future__ import annotations
          import io,json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          out=Path('inspect')
          targets={
            'guotai_9fzt':'https://gmg.9fzt.com/report/HKSE/00336/829143780300.html',
            'guotai_fx':'https://www.fxbaogao.com/detail/5343581',
            'dongbei_vzkoo':'https://www.vzkoo.com/read/114271240774000112376d90ba3c.html',
            'dongbei_sgpjbg':'https://www.sgpjbg.com.cn/baogao/1297618.html',
            'guolian_sgpjbg':'https://www.sgpjbg.com.cn/baogao/1160562.html',
            'guolian_book118':'https://max.book118.com/html/2026/0319/8036074140010054.shtm',
          }
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          summary=[]
          for key,url in targets.items():
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              print('REQ',key,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              out.joinpath(f'{key}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              print('TITLE',key,title,flush=True)
              urls=[]
              for tag in soup.find_all(['a','img','iframe','embed','object','script','source','link']):
                for attr in ('href','src','data','content'):
                  v=tag.get(attr)
                  if not v: continue
                  full=urllib.parse.urljoin(r.url,v)
                  blob=(full+' '+str(tag.attrs)).lower()
                  if any(x in blob for x in ('pdf','download','report','document','file','image','page','preview','oss','upload','bookread','view.aspx','829143780300','5343581','1297618','1160562')):
                    urls.append({'tag':tag.name,'attr':attr,'url':full,'attrs':dict(tag.attrs)})
              raw=[]
              for pat in [r'https?://[^\"\'<>\\s]+',r'[\"\']([^\"\']*(?:\.pdf|\.png|\.jpg|\.jpeg|\.webp|download|report|document|file|page|preview|oss|upload|BookRead|View\.aspx)[^\"\']*)[\"\']']:
                for m in re.finditer(pat,r.text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=v.replace('\\u002F','/').replace('\\/','/')
                  if v not in raw: raw.append(v)
              out.joinpath(f'{key}_urls.json').write_text(json.dumps({'title':title,'structured':urls,'raw':raw},ensure_ascii=False,indent=2),encoding='utf-8')
              for x in urls[:300]: print('URL',key,json.dumps(x,ensure_ascii=False),flush=True)
              for v in raw[:400]: print('RAW',key,repr(v[:1000]),flush=True)
              summary.append({'key':key,'status':r.status_code,'bytes':len(r.content),'url':r.url,'title':title,'structured_urls':len(urls),'raw_urls':len(raw)})
            except Exception as e:
              print('REQ_FAIL',key,repr(e),flush=True); summary.append({'key':key,'error':repr(e)})
          out.joinpath('requests_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')

          # Eastmoney report API probes for HK code variants and all-company keywords.
          api='https://reportapi.eastmoney.com/report/list2'
          rows={}; attempts=[]
          for code in ('00336','0336','00336.HK','116.00336',''):
            for page in range(1,5):
              body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':'2018-01-01','endTime':'2026-09-07','code':code,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              try:
                rr=s.post(api,json=body,headers={'Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/'},timeout=(20,90))
                text=rr.text
                payload=rr.json()
                data=payload.get('data') or []
                attempts.append({'code':code,'page':page,'status':rr.status_code,'bytes':len(rr.content),'rows':len(data),'hits':payload.get('hits'),'TotalPage':payload.get('TotalPage')})
                print('EM_API',repr(code),page,rr.status_code,len(data),payload.get('hits'),payload.get('TotalPage'),flush=True)
                for x in data:
                  blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                  if any(t in blob for t in ('华宝国际','華寶國際','huabaointernational','00336','0336.hk','香精行业龙头','历尽千帆','轻装上阵')):
                    rows[str(x.get('infoCode') or x.get('encodeUrl') or len(rows))]=x
                if not data or page>=int(payload.get('TotalPage') or page): break
              except Exception as e:
                attempts.append({'code':code,'page':page,'error':repr(e)})
                print('EM_FAIL',repr(code),page,repr(e),flush=True); break
          candidates=[]
          for x in rows.values():
            rec=dict(x); info=str(x.get('infoCode') or '')
            probes=[]
            for prefix in ('H3','H2'):
              u=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
              try:
                rr=s.get(u,timeout=(20,120),allow_redirects=True)
                p={'url':u,'status':rr.status_code,'bytes':len(rr.content),'content_type':rr.headers.get('content-type')}
                if rr.status_code==200 and b'%PDF' in rr.content[:4096] and len(rr.content)>50000:
                  try:
                    reader=PdfReader(io.BytesIO(rr.content),strict=False); p['pages']=len(reader.pages); p['valid_pdf']=True
                    text=''.join((pg.extract_text() or '') for pg in reader.pages[:min(5,len(reader.pages))])
                    p['company_in_sample']=('华宝国际' in text or '華寶國際' in text or '00336' in text or '0336' in text)
                  except Exception as e: p['parse_error']=repr(e)
                probes.append(p); print('EM_PDF',json.dumps(p,ensure_ascii=False),flush=True)
              except Exception as e: probes.append({'url':u,'error':repr(e)}); print('EM_PDF_FAIL',u,repr(e),flush=True)
            rec['_pdf_probes']=probes; candidates.append(rec)
          out.joinpath('eastmoney_attempts.json').write_text(json.dumps(attempts,ensure_ascii=False,indent=2),encoding='utf-8')
          out.joinpath('eastmoney_candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          print('EM_CANDIDATES',json.dumps(candidates,ensure_ascii=False,indent=2),flush=True)
          PY
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path('inspect')
          targets={
            'guotai_9fzt':'https://gmg.9fzt.com/report/HKSE/00336/829143780300.html',
            'guotai_fx':'https://www.fxbaogao.com/detail/5343581',
            'dongbei_vzkoo':'https://www.vzkoo.com/read/114271240774000112376d90ba3c.html',
            'dongbei_sgpjbg':'https://www.sgpjbg.com.cn/baogao/1297618.html',
          }
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              ctx=await browser.new_context(locale='zh-CN',user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36')
              for key,url in targets.items():
                page=await ctx.new_page(); events=[]
                def on_resp(resp):
                  ct=(resp.headers.get('content-type') or '').lower(); u=resp.url.lower()
                  if any(x in ct for x in ('pdf','json','image')) or any(x in u for x in ('pdf','download','report','document','file','page','preview','oss','upload','api/','829143780300','5343581','1297618')):
                    events.append({'status':resp.status,'content_type':ct,'url':resp.url})
                page.on('response',on_resp)
                try:
                  resp=await page.goto(url,wait_until='domcontentloaded',timeout=120000)
                  await page.wait_for_timeout(10000)
                  print('PW',key,resp.status if resp else None,page.url,await page.title(),flush=True)
                  html=await page.content(); out.joinpath(f'{key}_pw.html').write_text(html,encoding='utf-8')
                  await page.screenshot(path=str(out/f'{key}.png'),full_page=True)
                  embeds=await page.locator('a,img,iframe,embed,object,source').evaluate_all("els=>els.map(e=>({tag:e.tagName,url:e.href||e.currentSrc||e.src||e.data||'',text:(e.innerText||'').trim(),alt:e.alt||'',outer:e.outerHTML.slice(0,900)})).filter(x=>/pdf|download|report|document|file|page|preview|oss|upload|查看|下载|完整|829143780300|5343581|1297618/i.test(x.url+' '+x.text+' '+x.alt+' '+x.outer)).slice(0,500)")
                  ded=[]; seen=set()
                  for e in events:
                    sig=(e['status'],e['content_type'],e['url'])
                    if sig not in seen: seen.add(sig); ded.append(e)
                  out.joinpath(f'{key}_network.json').write_text(json.dumps(ded,ensure_ascii=False,indent=2),encoding='utf-8')
                  out.joinpath(f'{key}_elements.json').write_text(json.dumps(embeds,ensure_ascii=False,indent=2),encoding='utf-8')
                  for e in ded[:500]: print('NET',key,json.dumps(e,ensure_ascii=False),flush=True)
                  for e in embeds[:300]: print('EL',key,json.dumps(e,ensure_ascii=False),flush=True)
                except Exception as e: print('PW_FAIL',key,repr(e),flush=True)
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-source-inspection
          path: inspect/
          retention-days: 3
          if-no-files-found: error
