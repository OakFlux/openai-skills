name: Inspect Hongmian 000523 broker reports 20261006

on:
  push:
    paths:
      - '.github/workflows/inspect-hongmian-000523-broker-reports-20261006.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query report metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
          })
          api = 'https://reportapi.eastmoney.com/report/list'

          def query(params):
              r = s.get(api, params=params, timeout=120)
              print('STATUS', r.status_code, len(r.content), r.url)
              r.raise_for_status()
              return r.json().get('data') or []

          # Direct company lookup under both report types.
          for qtype in ('0','1','2'):
              print('DIRECT QTYPE', qtype)
              for page in range(1, 8):
                  params = {
                      'industryCode':'*','pageSize':'100','industry':'*',
                      'rating':'*','ratingChange':'*','beginTime':'2008-01-01','endTime':'2026-10-06',
                      'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'000523','rcode':'',
                      'p':str(page),'pageNum':str(page),'pageNumber':str(page),
                  }
                  rows = query(params)
                  print('COUNT', len(rows))
                  for row in rows:
                      print('DIRECT_MATCH', json.dumps(row, ensure_ascii=False))
                  if len(rows) < 100:
                      break

          # Keyword lookup across all company reports; API may ignore keyword, so filter locally.
          keywords = ['红棉股份','广州浪奇','浪奇','红棉智汇','新仕诚','华糖食品','广氏菠萝啤']
          for keyword in keywords:
              print('KEYWORD', keyword)
              for qtype in ('0','1'):
                  for page in range(1, 16):
                      params = {
                          'industryCode':'*','pageSize':'100','industry':'*',
                          'rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2026-10-06',
                          'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'',
                          'keyword':keyword,'p':str(page),'pageNum':str(page),'pageNumber':str(page),
                      }
                      rows = query(params)
                      for row in rows:
                          blob = json.dumps(row, ensure_ascii=False)
                          if any(k in blob for k in keywords) or str(row.get('stockCode') or '') == '000523':
                              print('KEY_MATCH', keyword, json.dumps(row, ensure_ascii=False))
                      if len(rows) < 100:
                          break
          PY
