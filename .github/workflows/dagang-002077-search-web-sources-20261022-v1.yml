name: Search Dagang 002077 broker report sources 20261022

on:
  push:
    branches:
      - tmp/dagang-002077-broker-discovery-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search public web sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          import time
          from urllib.parse import quote_plus, urlparse, parse_qs

          import requests
          from bs4 import BeautifulSoup

          queries = [
              '大港股份 券商 深度报告',
              '大港股份 公司研究 报告 证券',
              '大港股份 首次覆盖 研报',
              '大港股份 002077 研报 PDF',
              '大港股份 半导体 公司深度 券商',
              '江苏大港股份 研究报告 券商',
              '002077 公司深度报告',
              '大港股份 研究员 证券 报告',
          ]
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def clean(text):
              return re.sub(r'\s+', ' ', text or '').strip()

          for q in queries:
              print('\n################ QUERY', q)
              engines = [
                  ('bing', f'https://www.bing.com/search?q={quote_plus(q)}&count=50&setlang=zh-hans'),
                  ('duckduckgo', f'https://html.duckduckgo.com/html/?q={quote_plus(q)}'),
                  ('sogou', f'https://www.sogou.com/web?query={quote_plus(q)}'),
                  ('baidu', f'https://www.baidu.com/s?wd={quote_plus(q)}&rn=50'),
              ]
              for engine, url in engines:
                  print('\n=== ENGINE', engine, url)
                  try:
                      r=s.get(url,timeout=(20,120),allow_redirects=True)
                      print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url)
                      enc=r.apparent_encoding or r.encoding or 'utf-8'
                      text=r.content.decode(enc,errors='replace')
                      soup=BeautifulSoup(text,'lxml')
                      results=[]
                      if engine=='bing':
                          for li in soup.select('li.b_algo'):
                              a=li.select_one('h2 a')
                              if a and a.get('href'):
                                  results.append({'title':clean(a.get_text(' ',strip=True)),'url':a['href'],'snippet':clean((li.select_one('.b_caption') or li).get_text(' ',strip=True))[:500]})
                      elif engine=='duckduckgo':
                          for a in soup.select('a.result__a'):
                              href=a.get('href','')
                              results.append({'title':clean(a.get_text(' ',strip=True)),'url':href})
                      elif engine=='sogou':
                          for h3 in soup.select('h3'):
                              a=h3.find('a',href=True)
                              if a:
                                  results.append({'title':clean(a.get_text(' ',strip=True)),'url':a['href']})
                      elif engine=='baidu':
                          for h3 in soup.select('h3'):
                              a=h3.find('a',href=True)
                              if a:
                                  results.append({'title':clean(a.get_text(' ',strip=True)),'url':a['href']})
                      print('RESULTS',json.dumps(results[:50],ensure_ascii=False,indent=2))
                  except Exception as exc:
                      print('ERROR',repr(exc))
                  time.sleep(0.2)
          PY
