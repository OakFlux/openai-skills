name: Inspect Sina Guomai report sources 20261014

on:
  push:
    paths:
      - '.triggers/guomai-sina-report-source-inspect-20261014.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch list and detail sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json,re,urllib.parse,hashlib
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('inspect'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://stock.finance.sina.com.cn/'})

          def decode(raw):
            for enc in ('gb18030','utf-8','gbk'):
              try:return raw.decode(enc)
              except Exception:pass
            return raw.decode('latin1','replace')

          details={
            '792635366781':'浙商_25年两大催化',
            '754559450135':'信达_首次覆盖',
          }
          list_urls=[]
          base='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml'
          for page in range(1,15):
            list_urls += [f'{base}?symbol=sz301052&t1=all&p={page}',f'{base}?symbol=sz301052&t1=all&page={page}']
          seen_hash=set()
          for i,url in enumerate(list_urls,1):
            try:
              r=s.get(url,timeout=(15,90),allow_redirects=True); text=decode(r.content); h=hashlib.sha256(r.content).hexdigest()
              print('LIST',i,r.status_code,len(r.content),h[:10],r.url,flush=True)
              if r.status_code!=200 or len(r.content)<500:continue
              if h in seen_hash: print('LIST_DUP',i,flush=True)
              seen_hash.add(h)
              (out/f'list_{i:02d}.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'lxml')
              for a in soup.find_all('a',href=True):
                href=urllib.parse.urljoin(r.url,a['href']); label=' '.join(a.get_text(' ',strip=True).split())
                m=re.search(r'/rptid/(\d+)',href)
                if m:
                  rid=m.group(1); details.setdefault(rid,label)
                  print('LIST_REPORT',rid,label,href,flush=True)
            except Exception as e: print('LIST_ERR',i,repr(e),flush=True)

          records=[]
          for rid,label in details.items():
            url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
            try:
              r=s.get(url,timeout=(15,90),allow_redirects=True); text=decode(r.content)
              print('DETAIL',rid,r.status_code,len(r.content),r.url,flush=True)
              (out/f'detail_{rid}.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'lxml')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              links=[]; urls=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data-url','data-src','onclick','action'):
                  val=tag.get(attr)
                  if not val:continue
                  sv=str(val)
                  if attr in ('href','src','data-url','data-src','action'):sv=urllib.parse.urljoin(r.url,sv)
                  if any(k in sv.lower() for k in ('pdf','download','attach','file','report','doc','rpt')) or '下载' in sv:
                    links.append({'tag':tag.name,'attr':attr,'value':sv,'text':' '.join(tag.get_text(' ',strip=True).split())[:200]})
                    if sv.startswith('http'):urls.append(sv)
              rawurls=[]
              for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                u=m.group(0).replace('\\/','/').rstrip(');,]}')
                if any(k in u.lower() for k in ('pdf','download','attach','file','report','doc','rpt')):rawurls.append(u)
              snips=[]
              for pat in ('pdf','download','下载','附件','file','report','rptid','href'):
                for m in list(re.finditer(pat,text,re.I))[:100]:snips.append(text[max(0,m.start()-220):min(len(text),m.end()+500)])
              rec={'rid':rid,'label':label,'url':r.url,'title':title,'links':links,'rawurls':list(dict.fromkeys(rawurls)),'snips':snips[:250]}
              records.append(rec)
              print('DETAIL_TITLE',rid,title,flush=True)
              print('DETAIL_LINKS',rid,json.dumps(links[:200],ensure_ascii=False),flush=True)
              print('DETAIL_RAWURLS',rid,json.dumps(rec['rawurls'][:200],ensure_ascii=False),flush=True)
              print('DETAIL_SNIPS',rid,json.dumps(snips[:80],ensure_ascii=False),flush=True)
            except Exception as e:print('DETAIL_ERR',rid,repr(e),flush=True)
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: guomai-sina-report-source-inspection
          path: inspect
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
