name: Discover Kaitian Gas 920010 all reports 20261005

on:
  push:
    paths:
      - '.github/workflows/kaitian-gas-920010-all-reports-discovery-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect public announcement pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def decode(resp):
              return resp.content.decode('gb18030', errors='replace')

          keywords = [
              '年度报告', '年报', '第一季度报告', '一季度报告',
              '半年度报告', '中期报告', '招股说明书', '公开发行说明书',
              '公开发行股票说明书', '向不特定合格投资者公开发行股票说明书',
              '公开发行股票并在精选层挂牌说明书', '发行说明书'
          ]

          for stockid in ['920010', '831010']:
              print('\n===== STOCKID', stockid, '=====', flush=True)
              urls = [
                  ('ANNUAL', f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{stockid}/page_type/ndbg.phtml'),
                  ('Q1', f'https://money.finance.sina.com.cn/corp/view/vCB_BulletinYi.php?page_type=yjdbg&stockid={stockid}&type=list'),
                  ('H1', f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinZhong/stockid/{stockid}/page_type/zqbg.phtml'),
              ]
              for tag, url in urls:
                  try:
                      r = s.get(url, timeout=60)
                      print('PAGE', stockid, tag, r.status_code, len(r.content), r.url, flush=True)
                      r.raise_for_status()
                      soup = BeautifulSoup(decode(r), 'lxml')
                      for a in soup.find_all('a', href=True):
                          label = re.sub(r'\s+', '', a.get_text(' ', strip=True))
                          if any(k in label for k in keywords):
                              print('LINK', stockid, tag, label, urljoin(r.url, a['href']), flush=True)
                  except Exception as exc:
                      print('PAGE_ERROR', stockid, tag, repr(exc), flush=True)

              seen = set()
              empty_streak = 0
              for page in range(1, 121):
                  url = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{stockid}.phtml?Page={page}'
                  try:
                      r = s.get(url, timeout=60)
                      r.raise_for_status()
                  except Exception as exc:
                      print('ALLPAGE_ERROR', stockid, page, repr(exc), flush=True)
                      continue
                  soup = BeautifulSoup(decode(r), 'lxml')
                  matches = []
                  for a in soup.find_all('a', href=True):
                      label = re.sub(r'\s+', '', a.get_text(' ', strip=True))
                      if any(k in label for k in keywords):
                          href = urljoin(r.url, a['href'])
                          key = (label, href)
                          if key not in seen:
                              seen.add(key)
                              matches.append(key)
                  if matches:
                      empty_streak = 0
                      print('ALLPAGE', stockid, page, 'BYTES', len(r.content), flush=True)
                      for label, href in matches:
                          print('ALLLINK', stockid, page, label, href, flush=True)
                  else:
                      empty_streak += 1
                  if page > 40 and empty_streak >= 15:
                      break
              print('TOTAL_MATCHES', stockid, len(seen), flush=True)
          PY
