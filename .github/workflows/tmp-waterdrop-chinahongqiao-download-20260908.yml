name: Inspect Waterdrop China Hongqiao PDF downloads
on:
  push:
    branches:
      - tmp-waterdrop-chinahongqiao-download-20260908
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet playwright requests beautifulsoup4 lxml pypdf
      - name: Inspect public report download controls
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          reports = {
              '886387': {
                  'broker': '西部证券',
                  'date': '2025-04-21',
                  'title': '中国宏桥（01378.HK）首次覆盖报告：高景气+一体化+高分红，电解铝龙头静待价值重估',
              },
              '892745': {
                  'broker': '华创证券',
                  'date': '2025-05-27',
                  'title': '中国宏桥（01378.HK）深度研究报告：全球电解铝龙头，一体化打造盈利护城河，高分红属性明显',
              },
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }
          s = requests.Session()
          s.headers.update(headers)
          all_results = {}
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          url_pat = re.compile(r'(\.pdf(?:$|[?&#])|download|downfile|fileurl|reporturl|document|attachment|oss|cos|cdn|api)', re.I)

          def validate_pdf(path: Path) -> dict:
              rec = {
                  'file': str(path),
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'header': path.read_bytes()[:8].decode('latin1', errors='replace'),
              }
              try:
                  reader = PdfReader(str(path))
                  pages = len(reader.pages)
                  sample_idx = sorted(set([0, min(1, pages-1), min(4, pages-1), max(0, pages//2), max(0, pages-2), pages-1]))
                  text = ''.join((reader.pages[i].extract_text() or '') for i in sample_idx)
                  rec.update({
                      'pages': pages,
                      'searchable_chars_sample': len(re.sub(r'\s+', '', text)),
                      'sample_text': ' '.join(text.split())[:6000],
                  })
              except Exception as exc:
                  rec['error'] = repr(exc)
              return rec

          # Static HTML inspection first.
          for rid, meta in reports.items():
              url = f'https://www.sdyanbao.com/detail/{rid}'
              rec = {'meta': meta, 'url': url, 'static': {}, 'browser': {}}
              try:
                  r = s.get(url, timeout=60, allow_redirects=True)
                  rec['static'] = {
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type',''),
                      'bytes': len(r.content),
                  }
                  Path(f'output/{rid}_static.html').write_bytes(r.content)
                  soup = BeautifulSoup(r.text, 'lxml')
                  elements = []
                  for tag in soup.find_all(['a','button','input','form','iframe','embed','object','script','link']):
                      item = {'tag': tag.name, 'text': ' '.join(tag.get_text(' ', strip=True).split())[:1000]}
                      for k, v in tag.attrs.items():
                          if k in {'href','src','onclick','action','id','name','class','value','type','download'} or k.startswith('data-'):
                              item[k] = v
                      if re.search(r'(立即下载|下载|pdf|report|file|document|attachment|detail|api)', json.dumps(item, ensure_ascii=False), re.I):
                          elements.append(item)
                  rec['static']['interesting_elements'] = elements
                  # Extract all URL-like tokens, including escaped JSON URLs.
                  text = r.text.replace('\\/', '/')
                  urls = sorted(set(re.findall(r'https?://[^\"\'<>\s\\]+', text)))
                  rec['static']['candidate_urls'] = [u for u in urls if url_pat.search(u)]
                  snippets = []
                  for m in re.finditer(r'.{0,500}(?:立即下载|download|\.pdf|fileUrl|reportUrl|attachment).{0,1200}', text, re.I|re.S):
                      snippets.append(' '.join(m.group(0).split())[:1800])
                  rec['static']['snippets'] = snippets[:80]
                  print('STATIC', rid, json.dumps(rec['static'], ensure_ascii=False)[:30000], flush=True)
              except Exception as exc:
                  rec['static']['error'] = repr(exc)
              all_results[rid] = rec

          # Browser/network inspection. Public clicks only; do not attempt login, membership or payment bypass.
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path=chrome, args=['--no-sandbox','--disable-dev-shm-usage'])
              context = browser.new_context(
                  user_agent=headers['User-Agent'],
                  locale='zh-CN',
                  viewport={'width': 1440, 'height': 1200},
                  accept_downloads=True,
              )
              for rid, meta in reports.items():
                  page = context.new_page()
                  reqs, resps, downloads, popups = [], [], [], []

                  def on_request(req, rid=rid):
                      if url_pat.search(req.url) or re.search(r'(sdyanbao|samorun)', req.url, re.I):
                          reqs.append({'url': req.url, 'method': req.method, 'resource_type': req.resource_type, 'post_data': req.post_data})

                  def on_response(resp, rid=rid):
                      try:
                          ct = resp.headers.get('content-type','')
                      except Exception:
                          ct = ''
                      if url_pat.search(resp.url) or 'pdf' in ct.lower() or re.search(r'(sdyanbao|samorun)', resp.url, re.I):
                          item = {'url': resp.url, 'status': resp.status, 'content_type': ct}
                          resps.append(item)
                          if 'pdf' in ct.lower() or resp.url.lower().split('?')[0].endswith('.pdf'):
                              try:
                                  body = resp.body()
                                  if body.startswith(b'%PDF') and len(body) > 20000:
                                      fn = Path(f'output/{rid}_network_{len(resps)}.pdf')
                                      fn.write_bytes(body)
                                      item['saved_as'] = str(fn)
                                      item['bytes'] = len(body)
                              except Exception as exc:
                                  item['save_error'] = repr(exc)

                  page.on('request', on_request)
                  page.on('response', on_response)
                  url = f'https://www.sdyanbao.com/detail/{rid}'
                  brec = {'requests': reqs, 'responses': resps, 'downloads': downloads, 'popups': popups}
                  try:
                      resp = page.goto(url, wait_until='domcontentloaded', timeout=120000)
                      try:
                          page.wait_for_load_state('networkidle', timeout=30000)
                      except PWTimeout:
                          pass
                      page.wait_for_timeout(2500)
                      brec['initial'] = {
                          'status': resp.status if resp else None,
                          'url': page.url,
                          'title': page.title(),
                          'body': ' '.join(page.locator('body').inner_text(timeout=15000).split())[:120000],
                      }
                      brec['elements'] = page.eval_on_selector_all(
                          'a,button,input,form,iframe,embed,object',
                          "els => els.map(e => ({tag:e.tagName,text:(e.innerText||e.textContent||'').trim(),href:e.href||'',src:e.src||'',onclick:e.getAttribute('onclick')||'',action:e.action||'',type:e.type||'',id:e.id||'',name:e.name||'',className:e.className||'',download:e.download||'',outer:e.outerHTML.slice(0,4000)}))"
                      )
                      brec['globals'] = page.evaluate("""() => {
                          const out = {};
                          for (const k of ['__NEXT_DATA__','__NUXT__','__INITIAL_STATE__','__APOLLO_STATE__']) {
                              try { if (window[k] !== undefined) out[k] = window[k]; } catch(e) {}
                          }
                          try { out.localStorage = {...localStorage}; } catch(e) {}
                          try { out.sessionStorage = {...sessionStorage}; } catch(e) {}
                          return out;
                      }""")
                      Path(f'output/{rid}_initial.html').write_text(page.content(), encoding='utf-8')
                      page.screenshot(path=f'output/{rid}_initial.png', full_page=True)
                      print('ELEMENTS', rid, json.dumps([x for x in brec['elements'] if re.search(r'(立即下载|下载|pdf|report|file|document)', json.dumps(x, ensure_ascii=False), re.I)], ensure_ascii=False)[:30000], flush=True)

                      # Click each visible download control once. Stop when a login/member/payment gate is encountered.
                      loc = page.get_by_text('立即下载', exact=True)
                      count = min(loc.count(), 6)
                      brec['download_control_count'] = count
                      for i in range(count):
                          item = {'index': i, 'before_url': page.url, 'before_pages': len(context.pages)}
                          try:
                              # Attempt download event first.
                              try:
                                  with page.expect_download(timeout=10000) as dinfo:
                                      loc.nth(i).click(force=True, timeout=10000)
                                  d = dinfo.value
                                  fn = Path('output') / f'{rid}_download_{i}_{d.suggested_filename}'
                                  d.save_as(str(fn))
                                  dl = {'url': d.url, 'suggested_filename': d.suggested_filename, 'saved_as': str(fn), 'bytes': fn.stat().st_size}
                                  downloads.append(dl)
                                  item['download'] = dl
                              except Exception as exc:
                                  item['download_wait_error'] = repr(exc)
                                  # If first click did not persist, trigger once normally.
                                  try:
                                      loc.nth(i).click(force=True, timeout=7000)
                                  except Exception as exc2:
                                      item['click_error'] = repr(exc2)
                              page.wait_for_timeout(3000)
                          except Exception as exc:
                              item['error'] = repr(exc)
                          item['after_url'] = page.url
                          item['after_pages'] = len(context.pages)
                          try:
                              item['after_body'] = ' '.join(page.locator('body').inner_text(timeout=5000).split())[:50000]
                          except Exception:
                              pass
                          # Inspect popups/new tabs.
                          for j, pg in enumerate(context.pages):
                              if pg is page:
                                  continue
                              try:
                                  pop = {'index': j, 'url': pg.url, 'title': pg.title(), 'body': ' '.join(pg.locator('body').inner_text(timeout=5000).split())[:50000]}
                                  popups.append(pop)
                                  Path(f'output/{rid}_popup_{i}_{j}.html').write_text(pg.content(), encoding='utf-8')
                                  pg.screenshot(path=f'output/{rid}_popup_{i}_{j}.png', full_page=True)
                              except Exception as exc:
                                  popups.append({'index': j, 'url': pg.url, 'error': repr(exc)})
                          brec.setdefault('clicks', []).append(item)
                          # Abort additional clicks if UI now clearly asks for account/payment.
                          gate_text = item.get('after_body','')
                          if re.search(r'(登录|注册|会员|付费|购买|扫码|微信)', gate_text) and page.url != url:
                              break
                      Path(f'output/{rid}_after.html').write_text(page.content(), encoding='utf-8')
                      page.screenshot(path=f'output/{rid}_after.png', full_page=True)
                  except Exception as exc:
                      brec['error'] = repr(exc)
                  all_results[rid]['browser'] = brec
                  page.close()
              browser.close()

          validations = []
          for path in sorted(Path('output').glob('*.pdf')):
              rec = validate_pdf(path)
              validations.append(rec)
              print('PDF_VALIDATION', json.dumps(rec, ensure_ascii=False), flush=True)
          all_results['validations'] = validations
          Path('output/result.json').write_text(json.dumps(all_results, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_RESULT', json.dumps(all_results, ensure_ascii=False)[:80000], flush=True)
          PY
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: waterdrop-chinahongqiao-download-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
