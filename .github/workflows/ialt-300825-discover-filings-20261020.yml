name: Discover IAT Auto filings 20261020
on:
  push:
    branches:
      - tmp/ialt-300825-all-filings-20261020
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney announcement API
        shell: bash
        run: |
          python - <<'PY'
          import json, requests

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://data.eastmoney.com/notices/stock/300825.html'
          })
          endpoint = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          rows_all = []
          for page in range(1, 31):
              params = {
                  'sr': '-1', 'page_size': '100', 'page_index': str(page),
                  'ann_type': 'A', 'client_source': 'web', 'stock_list': '300825',
                  'f_node': '0', 's_node': '0'
              }
              r = s.get(endpoint, params=params, timeout=30)
              print('PAGE', page, 'STATUS', r.status_code, 'LEN', len(r.content))
              r.raise_for_status()
              obj = r.json()
              rows = (obj.get('data') or {}).get('list') or []
              print('ROWS', len(rows))
              if not rows:
                  break
              rows_all.extend(rows)
              if len(rows) < 100:
                  break

          print('TOTAL', len(rows_all))
          keys = ('年度报告', '招股说明书', '第一季度报告', '一季度报告', '第三季度报告', '三季度报告')
          for rec in rows_all:
              title = (rec.get('title') or '').strip()
              if any(k in title for k in keys):
                  keep = {k: rec.get(k) for k in ('art_code','title','notice_date','display_time','attach_url','eiTime','codes','columns')}
                  print('CANDIDATE', json.dumps(keep, ensure_ascii=False, sort_keys=True))
          PY
