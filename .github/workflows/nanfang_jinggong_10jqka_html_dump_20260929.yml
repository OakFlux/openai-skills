name: South Precision 10jqka HTML Dump

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_10jqka_html_dump_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect page source
        shell: bash
        run: |
          python - <<'PY'
          import re,requests
          url='https://news.10jqka.com.cn/field/sr/20260119/55776103.shtml'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'},timeout=60)
          r.encoding=r.apparent_encoding or 'gb18030'
          text=r.text
          print('STATUS',r.status_code,'LEN',len(text),'ENC',r.encoding)
          print('FULL_HTML_BEGIN')
          print(text)
          print('FULL_HTML_END')
          print('RELEVANT_LINES')
          for i,line in enumerate(text.splitlines(),1):
            if re.search(r'pdf|original|report|rpt|YB|研报|原文|55776103|ajax|api',line,re.I):
              print(i,line[:3000])
          PY
