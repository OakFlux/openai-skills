name: Build Xiceceshi broker report package final

on:
  push:
    branches:
      - tmp-xiceceshi-broker-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='西测测试_301306_券商研究报告_3份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/xiceceshi_final_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('西测测试_301306_券商研究报告_3份')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.0,
              status_forcelist=[429,500,502,503,504],
              allowed_methods=['GET'], raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          reports = [
              {
                  'order':1,
                  'broker':'天风证券',
                  'date':'2023-04-10',
                  'title':'一站式第三方检测机构，错位竞争聚焦军用装备',
                  'type':'首次覆盖长篇报告',
                  'filename':'01_天风证券_一站式第三方检测机构错位竞争聚焦军用装备_2023-04-10.pdf',
                  'pages':31,
                  'url':'https://pdf.dfcfw.com/pdf/H3_AP202306061590456420_1.pdf',
                  'index':'https://data.eastmoney.com/report/info/AP202306061590456420.html',
              },
              {
                  'order':2,
                  'broker':'中航证券',
                  'date':'2022-09-02',
                  'title':'受益于军用武器装备快速发展，业绩稳步提升',
                  'type':'公司研究报告',
                  'filename':'02_中航证券_受益于军用武器装备快速发展业绩稳步提升_2022-09-02.pdf',
                  'pages':7,
                  'url':'https://pdf.dfcfw.com/pdf/H3_AP202209011577951464_1.pdf',
                  'index':'https://data.eastmoney.com/report/info/AP202209011577951464.html',
              },
              {
                  'order':3,
                  'broker':'中邮证券',
                  'date':'2025-05-20',
                  'title':'布局商业航天、商用飞机相关业务，业绩有望改善',
                  'type':'公司研究报告',
                  'filename':'03_中邮证券_布局商业航天商用飞机相关业务业绩有望改善_2025-05-20.pdf',
                  'pages':5,
                  'url':'https://pdf.dfcfw.com/pdf/H3_AP202505201676034124_1.pdf',
                  'index':'https://data.eastmoney.com/report/info/AP202505201676034124.html',
              },
          ]

          def fetch(report):
              last = None
              for attempt in range(8):
                  try:
                      r = session.get(
                          report['url'],
                          headers={'Referer':report['index']},
                          timeout=(30,360), allow_redirects=True,
                      )
                      data = r.content
                      if r.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 100000:
                          return r.url, data
                      last = RuntimeError(f'HTTP={r.status_code}, bytes={len(data)}, type={r.headers.get("content-type")}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(1 + attempt, 8))
              raise RuntimeError(f'download failed for {report["title"]}: {last!r}')

          records = []
          for report in reports:
              source, data = fetch(report)
              path = out / report['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != report['pages']:
                  raise RuntimeError(f'{path.name}: expected {report["pages"]} pages, got {pages}')
              idxs = list(range(min(12,pages)))
              if pages > 12:
                  idxs.append(pages-1)
              text = ''
              for idx in dict.fromkeys(idxs):
                  try:
                      text += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+','',text)
              if '西测测试' not in compact and '西安西测测试技术股份有限公司' not in compact:
                  raise RuntimeError(f'{path.name}: company name mismatch')
              broker_key = report['broker'].replace('证券','')
              if broker_key not in compact:
                  raise RuntimeError(f'{path.name}: broker name mismatch')
              sha = hashlib.sha256(data).hexdigest()
              records.append({**report,'source':source,'bytes':len(data),'sha256':sha})
              print('DOWNLOADED', report['broker'], report['title'], 'pages=',pages,'bytes=',len(data),'sha256=',sha)

          lines = [
              '西测测试（301306）券商研究报告资料包',
              '整理日期：2026-10-29',
              '',
              '版本说明：',
              '1. 三份文件均为公开渠道直接下载的券商原始完整PDF，没有使用网页摘要或重新排版版本。',
              '2. 天风证券报告为31页首次覆盖长篇报告。公开渠道可直接下载的其余西测测试报告多为5-7页公司研究报告，本包补充收录中航证券和中邮证券各一份，便于比较不同时间和研究主题。',
              '3. 未将需要登录、积分或会员权限的中信建投59页深度报告绕过限制下载。',
              '',
              '文件清单：',
          ]
          sums=[]; total_pages=0; total_bytes=0
          for item in records:
              total_pages += item['pages']; total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   类型：{item['type']}",
                  f"   发布日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   研报索引：{item['index']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f'合计：3份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out/'00_文件清单与版本说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '西测测试|西安西测测试技术股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/xiceceshi_final_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/xiceceshi_final_test.zip "$PACKAGE"
          unzip -t /tmp/xiceceshi_final_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/xiceceshi_final_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f /tmp/xiceceshi_final_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Xiceceshi-301306-broker-reports-3-final
          path: 西测测试_301306_券商研究报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
