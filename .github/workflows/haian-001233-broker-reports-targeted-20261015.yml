name: Targeted Haian Group broker report package 20261015

on:
  push:
    paths:
      - '.triggers/haian-001233-broker-reports-targeted-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          reports = [
              {
                  'date':'2025-11-10','broker':'华金证券',
                  'title':'新股覆盖研究：海安集团','classification':'新股覆盖研究',
                  'urls':['https://pdf.dfcfw.com/pdf/H3_AP202511091778242536_1.pdf','https://pdf.dfcfw.com/pdf/H2_AP202511091778242536_1.pdf'],
              },
              {
                  'date':'2026-01-08','broker':'山西证券',
                  'title':'巨胎龙头受益矿端景气度，深度绑定紫金矿业，持续开拓全球市场','classification':'公司专题研究报告',
                  'urls':['https://pdf.dfcfw.com/pdf/H3_AP202601081816850426_1.pdf','https://pdf.dfcfw.com/pdf/H2_AP202601081816850426_1.pdf'],
              },
              {
                  'date':'2026-09-03','broker':'中邮证券',
                  'title':'Q2环比高增，巨胎主业盈利韧性凸显','classification':'公司跟踪研究报告',
                  'urls':['https://pdf.dfcfw.com/pdf/H3_AP202609031828978638_1.pdf','https://pdf.dfcfw.com/pdf/H2_AP202609031828978638_1.pdf'],
              },
          ]

          root=Path('haian_targeted'); out=root/'final'; renders=root/'renders'; art=Path('artifact_out')
          for p in (out,renders,art): p.mkdir(parents=True,exist_ok=True)
          session=requests.Session(); session.trust_env=False
          session.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*','Accept-Language':'zh-CN,zh;q=0.9'})

          def safe(text): return re.sub(r'[\\/:*?"<>|]+','_',text).strip(' ._')[:120]
          manifest=[]; hashes=set()
          for index,report in enumerate(reports,1):
              filename=f'{index:02d}_{report["date"]}_{report["broker"]}_{safe(report["title"])}.pdf'
              path=out/filename; used=None; errors=[]
              for url in report['urls']:
                  for attempt in range(1,4):
                      try:
                          r=session.get(url,timeout=(15,90),allow_redirects=True)
                          print('DOWNLOAD',report['broker'],attempt,r.status_code,len(r.content),url,'FINAL',r.url,flush=True)
                          if r.status_code==200 and len(r.content)>90000 and r.content.startswith(b'%PDF-'):
                              path.write_bytes(r.content); used=url; break
                          errors.append(f'{url}: HTTP {r.status_code}, {len(r.content)} bytes')
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(attempt)
                  if used: break
              if not used: raise RuntimeError('Download failed: '+' | '.join(errors[-8:]))

              q=subprocess.run(['qpdf','--check',str(path)],capture_output=True,text=True)
              if q.returncode not in (0,3): raise RuntimeError(q.stderr[-1000:])
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              if pages<4: raise RuntimeError(f'Unexpected page count {pages}: {filename}')
              text=[]
              for pi in list(range(min(10,pages)))+list(range(max(0,pages-2),pages)):
                  try: text.append(reader.pages[pi].extract_text() or '')
                  except Exception: pass
              sample='\n'.join(text)
              if '海安集团' not in sample and '海安橡胶集团' not in sample and '001233' not in sample:
                  raise RuntimeError(f'Company identity failed: {filename}')
              if not any(term in sample for term in ['证券研究报告','公司研究','研究报告','投资评级','新股研究']):
                  raise RuntimeError(f'Research identity failed: {filename}')
              prefix=renders/f'cover_{index:02d}'
              rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','90',str(path),str(prefix)],capture_output=True,text=True)
              png=Path(str(prefix)+'.png')
              if rr.returncode!=0 or not png.exists() or png.stat().st_size<8000: raise RuntimeError('Cover render failed')
              data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError('Duplicate PDF')
              hashes.add(sha)
              item={**{k:v for k,v in report.items() if k!='urls'},'filename':filename,'pages':pages,'bytes':len(data),'sha256':sha,'source_url':used}
              manifest.append(item); print('VERIFIED',json.dumps(item,ensure_ascii=False),flush=True)

          readme=[
              '海安集团（001233.SZ）券商深度及公司研究报告精选','整理日期：2026-10-15','',
              '本压缩包收录3份公开可直接下载的完整券商研究PDF。',
              '其中华金证券报告为新股覆盖研究；山西证券和中邮证券报告用于补充上市后的业务逻辑与最新经营变化。',
              '未使用网页摘要、预览页或残缺文件替代完整原文。','',
              '文件清单：'
          ]
          for i,item in enumerate(manifest,1):
              readme += [
                  f'{i}. {item["filename"]}',f'   券商：{item["broker"]}',f'   类型：{item["classification"]}',
                  f'   标题：{item["title"]}',f'   日期：{item["date"]}；页数：{item["pages"]}；大小：{item["bytes"]} bytes',
                  f'   公开PDF：{item["source_url"]}',f'   SHA-256：{item["sha256"]}',''
              ]
          readme.append('完整性检查：已检查PDF文件头、公司名称或证券代码、研究报告属性、实际页数、qpdf结构、首页渲染、重复文件及ZIP CRC。')
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')

          zip_path=art/'海安集团_001233_券商深度及公司研究报告_3份.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for p in sorted(out.iterdir()): archive.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad=archive.testzip(); count=sum(1 for n in archive.namelist() if n.lower().endswith('.pdf'))
              if bad or count!=3: raise RuntimeError(f'ZIP validation failed: {bad}, {count}')
          print('SELECTED_FINAL',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: haian-001233-broker-reports-targeted
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
