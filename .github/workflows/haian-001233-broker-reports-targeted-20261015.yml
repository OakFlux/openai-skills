name: Targeted Haian Group broker report package 20261015

on:
  push:
    paths:
      - '.triggers/haian-001233-broker-reports-targeted-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          reports = [
              {
                  'date':'2026-06-19', 'broker':'西部证券',
                  'title':'矿山耗材受益矿端景气度，全球化布局持续深化',
                  'classification':'首次覆盖深度报告', 'expected_pages':23,
                  'required':False,
                  'urls':[
                      'https://dr.fxbaogao.com/report/2026/06/19/5485933.pdf',
                      'https://public.fxbaogao.com/report/2026/06/19/5485933.pdf',
                      'https://report.fxbaogao.com/report/2026/06/19/5485933.pdf',
                      'https://oss-buy.hufangde.com/report/2026/06/19/5485933.pdf',
                  ],
              },
              {
                  'date':'2025-11-10', 'broker':'华金证券',
                  'title':'新股覆盖研究：海安集团',
                  'classification':'新股覆盖研究', 'expected_pages':11,
                  'required':True,
                  'urls':[
                      'https://pdf.dfcfw.com/pdf/H3_AP202511091778242536_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP202511091778242536_1.pdf',
                  ],
              },
              {
                  'date':'2026-01-08', 'broker':'山西证券',
                  'title':'巨胎龙头受益矿端景气度，深度绑定紫金矿业，持续开拓全球市场',
                  'classification':'公司专题研究报告', 'expected_pages':5,
                  'required':True,
                  'urls':[
                      'https://pdf.dfcfw.com/pdf/H3_AP202601081816850426_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP202601081816850426_1.pdf',
                  ],
              },
          ]

          root=Path('haian_targeted'); out=root/'final'; renders=root/'renders'; art=Path('artifact_out')
          for p in (out,renders,art): p.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*','Accept-Language':'zh-CN,zh;q=0.9'})

          def safe(x): return re.sub(r'[\\/:*?"<>|]+','_',x).strip(' ._')[:120]
          manifest=[]; hashes=set()
          for idx,rec in enumerate(reports,1):
              path=out/f'{idx:02d}_{rec["date"]}_{rec["broker"]}_{safe(rec["title"])}.pdf'
              used=None; errors=[]
              for url in rec['urls']:
                  for attempt in range(1,4):
                      try:
                          referer='https://www.fxbaogao.com/' if 'fxbaogao' in url or 'hufangde' in url else 'https://data.eastmoney.com/report/'
                          r=s.get(url,timeout=(15,90),allow_redirects=True,headers={'Referer':referer})
                          print('DOWNLOAD',rec['broker'],attempt,r.status_code,len(r.content),url,'FINAL',r.url,flush=True)
                          if r.status_code==200 and len(r.content)>90000 and r.content.startswith(b'%PDF-'):
                              path.write_bytes(r.content); used=url; break
                          errors.append(f'{url}: HTTP {r.status_code}, {len(r.content)}')
                      except Exception as e:
                          errors.append(f'{url}: {e!r}')
                      time.sleep(attempt)
                  if used: break
              if not used:
                  print('SKIP',rec['broker'],rec['title'],' | '.join(errors[-8:]),flush=True)
                  path.unlink(missing_ok=True)
                  if rec['required']: raise RuntimeError(f'Required report download failed: {rec["title"]}')
                  continue

              q=subprocess.run(['qpdf','--check',str(path)],capture_output=True,text=True)
              if q.returncode not in (0,3): raise RuntimeError(q.stderr[-1000:])
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              parts=[]
              for pi in list(range(min(10,pages)))+list(range(max(0,pages-2),pages)):
                  try: parts.append(reader.pages[pi].extract_text() or '')
                  except Exception: pass
              sample='\n'.join(parts)
              if '海安集团' not in sample and '海安橡胶集团' not in sample and '001233' not in sample:
                  raise RuntimeError(f'Company validation failed: {rec["title"]}')
              if not any(x in sample for x in ['证券研究报告','公司研究','研究报告','投资评级','新股研究']):
                  raise RuntimeError(f'Research validation failed: {rec["title"]}')
              render_prefix=renders/f'cover_{idx:02d}'
              rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','90',str(path),str(render_prefix)],capture_output=True,text=True)
              png=Path(str(render_prefix)+'.png')
              if rr.returncode!=0 or not png.exists() or png.stat().st_size<8000: raise RuntimeError('cover render failed')
              data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError('duplicate report')
              hashes.add(sha)
              item={**{k:v for k,v in rec.items() if k not in ('urls','required')},'filename':path.name,'pages':pages,'bytes':len(data),'sha256':sha,'source_url':used}
              manifest.append(item); print('VERIFIED',json.dumps(item,ensure_ascii=False),flush=True)

          if len(manifest)<2: raise RuntimeError(f'Only {len(manifest)} reports packaged')
          # Renumber after optional report skips.
          pdfs=[]
          for i,item in enumerate(manifest,1):
              old=out/item['filename']
              newname=f'{i:02d}_{item["date"]}_{item["broker"]}_{safe(item["title"])}.pdf'
              new=out/newname
              if old!=new: old.rename(new)
              item['filename']=newname; pdfs.append(new)

          readme=[
              '海安集团（001233.SZ）券商深度及公司研究报告精选',
              '整理日期：2026-10-15','',
              f'本压缩包收录{len(manifest)}份公开可直接下载的完整券商研究PDF。',
              '优先收录首次覆盖、新股覆盖及公司专题研究；未使用网页摘要或预览页替代完整原文。','',
              '文件清单：'
          ]
          for i,item in enumerate(manifest,1):
              readme += [
                  f'{i}. {item["filename"]}',
                  f'   券商：{item["broker"]}',
                  f'   类型：{item["classification"]}',
                  f'   标题：{item["title"]}',
                  f'   日期：{item["date"]}；页数：{item["pages"]}；大小：{item["bytes"]} bytes',
                  f'   公开PDF：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',''
              ]
          readme.append('完整性检查：已检查PDF文件头、公司名称或证券代码、研究报告属性、页数、qpdf结构、首页渲染、重复文件及ZIP CRC。')
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')
          zip_path=art/f'海安集团_001233_券商深度及公司研究报告_{len(manifest)}份.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(out.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip(); count=sum(1 for n in z.namelist() if n.lower().endswith('.pdf'))
              if bad or count!=len(manifest): raise RuntimeError(f'ZIP validation failed: {bad}, {count}')
          print('SELECTED_FINAL',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: haian-001233-broker-reports-targeted
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
