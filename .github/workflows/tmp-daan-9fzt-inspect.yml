name: Temporary inspect Jiufang Daan Gene report data source

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-9fzt-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Inspect HTML, data blobs, scripts, and API routes
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls=[
            'https://www.9fzt.com/detail/sz_002030_10_684425869377.html',
            'https://www.9fzt.com/detail/sz_002030_10_648229670402.html',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          for url in urls:
            print('\n===== PAGE',url,'=====')
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
            except Exception as e: print('PAGE_ERROR',repr(e)); continue
            text=r.content.decode('utf-8','replace'); decoded=html.unescape(text).replace('\\/','/')
            soup=BeautifulSoup(text,'html.parser')
            print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'COOKIES',s.cookies.get_dict())
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
            # Print metadata and JSON script blocks.
            for tag in soup.find_all('script'):
              src=tag.get('src')
              content=tag.string or tag.get_text() or ''
              if src:
                print('SCRIPT_SRC',urljoin(r.url,src))
              if content.strip() and any(k.lower() in content.lower() for k in ['684425869377','648229670402','达安基因','pdf','report','研报','attachment','sourceurl']):
                print('INLINE_SCRIPT',content[:30000])
            for tag in soup.find_all(['meta','link']):
              attrs=dict(tag.attrs)
              blob=json.dumps(attrs,ensure_ascii=False).lower()
              if any(k in blob for k in ['report','pdf','684425869377','648229670402','og:','canonical']):
                print('META_LINK',tag.name,json.dumps(attrs,ensure_ascii=False))
            # Search raw contexts.
            needles=['684425869377','648229670402','__NEXT_DATA__','__NUXT__','window.__','reportId','report_id','articleId','sourceId','pdf','attachment','download','fileUrl','sourceUrl','研报','国海证券']
            for needle in needles:
              poss=[m.start() for m in re.finditer(re.escape(needle),decoded,re.I)]
              if poss:
                print('NEEDLE',needle,'COUNT',len(poss))
                for pos in poss[:30]: print('CONTEXT',re.sub(r'\s+',' ',decoded[max(0,pos-900):pos+2200])[:3500])
            # Fetch JS files and grep likely API routes.
            js_urls=[]
            for tag in soup.find_all('script',src=True):
              js_urls.append(urljoin(r.url,tag['src']))
            for js_url in js_urls[:80]:
              try:
                jr=s.get(js_url,timeout=60)
              except Exception as e: print('JS_ERROR',js_url,repr(e)); continue
              jtext=jr.content.decode('utf-8','replace')
              if not any(k.lower() in jtext.lower() for k in ['report','detail','pdf','attachment','research','研报','article']):
                continue
              print('\nJS_FILE',js_url,'STATUS',jr.status_code,'BYTES',len(jr.content))
              # endpoints and contextual snippets
              vals=[]
              patterns=[
                r'https?://[^"\'<>\s]+',
                r'["\'](/[^"\']*(?:report|detail|pdf|research|article|attachment|download)[^"\']*)["\']',
                r'["\']([^"\']*(?:report|detail|pdf|research|article|attachment|download)[^"\']*)["\']',
              ]
              for pat in patterns:
                for match in re.findall(pat,jtext,re.I):
                  value=match if isinstance(match,str) else ''.join(match)
                  if len(value)<500 and value not in vals: vals.append(value)
              print('JS_VALUES',json.dumps(vals[:500],ensure_ascii=False))
              for needle in ['reportId','report_id','pdf','attachment','sourceUrl','fileUrl','download','articleId','detail']:
                poss=[m.start() for m in re.finditer(re.escape(needle),jtext,re.I)]
                if poss:
                  print('JS_NEEDLE',needle,'COUNT',len(poss))
                  for pos in poss[:20]: print('JS_CONTEXT',re.sub(r'\s+',' ',jtext[max(0,pos-500):pos+1300])[:2200])
          PY
