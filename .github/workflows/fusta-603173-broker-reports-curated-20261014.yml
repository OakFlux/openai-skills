name: Build curated Fusta 603173 broker research 20261014

on:
  push:
    paths:
      - '.github/workflows/fusta-603173-broker-reports-curated-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, verify, and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          TODAY = '2026-10-14'
          CODE = '603173'
          COMPANY = '福斯达'
          FULL_COMPANY = '杭州福斯达深冷装备股份有限公司'
          PACKAGE = '福斯达_603173_券商深度及覆盖报告_3份_公开完整PDF'
          WORK = Path('fusta_curated_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL = WORK / 'final' / PACKAGE
          ART = Path('artifact_out')
          VERIFY = Path('verification_renders')
          for directory in (DOWNLOADS, FINAL, ART, VERIFY):
              directory.mkdir(parents=True, exist_ok=True)

          reports: list[dict[str, Any]] = [
              {
                  'broker': '西南证券',
                  'publish_date': '2023-09-03',
                  'title': '深冷行业领军企业，海外市场竞争力突出',
                  'info_code': 'AP202309031597465878',
                  'expected_pages': 14,
                  'document_type': '公司深度/首次覆盖性质的中报研究',
              },
              {
                  'broker': '华金证券',
                  'publish_date': '2022-12-30',
                  'title': '新股覆盖研究：福斯达',
                  'info_code': 'AP202212301581510313',
                  'expected_pages': 9,
                  'document_type': '新股覆盖研究',
              },
              {
                  'broker': '西南证券',
                  'publish_date': '2024-04-22',
                  'title': '海外业务增长强劲，公司盈利能力提升',
                  'info_code': 'AP202404221630954690',
                  'expected_pages': 6,
                  'document_type': '完整公司年度研究报告',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:108]

          def download(info_code: str, target: Path) -> str:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              last = ''
              for attempt in range(1, 5):
                  for url in urls:
                      try:
                          response = session.get(url, timeout=(30, 300), allow_redirects=True, headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://data.eastmoney.com/',
                              'Accept': 'application/pdf,*/*',
                          })
                          print('PDF', info_code, attempt, response.status_code, len(response.content), url, flush=True)
                          if response.status_code == 200 and len(response.content) > 100_000 and response.content.startswith(b'%PDF-'):
                              target.write_bytes(response.content)
                              return str(response.url)
                          last = f'{response.status_code}/{len(response.content)}'
                      except Exception as exc:
                          last = repr(exc)
                  time.sleep(attempt)
              raise RuntimeError(f'No complete PDF for {info_code}: {last}')

          records: list[dict[str, Any]] = []
          seen_hashes: set[str] = set()
          for index, report in enumerate(reports, 1):
              temp = DOWNLOADS / f"{report['info_code']}.pdf"
              source_url = download(report['info_code'], temp)
              reader = PdfReader(str(temp), strict=False)
              pages = len(reader.pages)
              if pages != int(report['expected_pages']):
                  raise RuntimeError(f"Page mismatch for {report['title']}: {pages} != {report['expected_pages']}")
              parts: list[str] = []
              for page_index in range(min(24, pages)):
                  try:
                      parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              text = '\n'.join(parts)
              if COMPANY not in text and FULL_COMPANY not in text and CODE not in text:
                  raise RuntimeError(f"Company identity not verified: {report['title']}")
              if report['broker'].replace('证券', '') not in text and report['broker'] not in text:
                  raise RuntimeError(f"Broker identity not verified: {report['title']}")
              if not any(mark in text for mark in ['证券研究报告', '公司研究', '新股研究', '投资评级', '研究报告']):
                  raise RuntimeError(f"Research identity not verified: {report['title']}")
              check = subprocess.run(['qpdf', '--check', str(temp)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f"qpdf failed: {report['title']}: {check.stderr[-800:]}")
              raw = temp.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f"Duplicate PDF: {report['title']}")
              seen_hashes.add(digest)
              filename = f"{index:02d}_{safe(report['publish_date'])}_{safe(report['broker'])}_{safe(report['title'])}.pdf"
              shutil.copy2(temp, FINAL / filename)
              record = {
                  'stock_code': CODE,
                  'stock_name': COMPANY,
                  'broker': report['broker'],
                  'publish_date': report['publish_date'],
                  'title': report['title'],
                  'info_code': report['info_code'],
                  'document_type': report['document_type'],
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': digest,
                  'source_url': source_url,
                  'filename': filename,
                  'text_searchable': True,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '福斯达（603173.SH；杭州福斯达深冷装备股份有限公司）券商深度及覆盖研究资料包',
              f'整理日期：{TODAY}',
              '',
              '收录口径：',
              '1. 收录3份福斯达公司专属、公开可直接下载且能够完成全文核验的原始PDF。',
              '2. 结构为1份14页公司深度研究、1份9页新股覆盖研究、1份6页完整公司年度研究。',
              '3. 未用同业报告、网页摘要、仅展示预览页、需登录付费下载的文件或重复事件短评补足数量。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme += [
                  f'{index}. {record["filename"]}',
                  f'   类型：{record["document_type"]}',
                  f'   券商：{record["broker"]}；日期：{record["publish_date"]}；页数：{record["pages"]}',
                  f'   标题：{record["title"]}',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查公司与券商身份、实际页数、PDF文件头、qpdf结构、重复文件及SHA-256；3份PDF首页均已渲染，最终ZIP已通过CRC测试。')

          (FINAL / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (FINAL / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records), encoding='utf-8')

          for index, record in enumerate(records, 1):
              source = FINAL / record['filename']
              prefix = VERIFY / f'{index:02d}'
              result = subprocess.run([
                  'pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(source), str(prefix)
              ], capture_output=True, text=True)
              if result.returncode != 0:
                  raise RuntimeError(f'Render failed for {source.name}: {result.stderr[-800:]}')

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(FINAL.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != len(records):
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)} vs {len(records)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: fusta-603173-broker-reports-curated-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: fusta-603173-broker-reports-curated-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
