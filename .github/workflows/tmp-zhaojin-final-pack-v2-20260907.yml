name: Build verified Zhaojin Mining broker report package v2
on:
  push:
    branches:
      - tmp-zhaojin-final-pack-v2-20260907
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/pages work/final work/renders
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, shutil, zipfile
          from pathlib import Path
          import img2pdf, pymupdf, requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          OUT=Path('output'); WORK=Path('work'); PAGES=WORK/'pages'; FINAL=WORK/'final'; RENDERS=WORK/'renders'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          records=[]

          image_paths=[]; hashes=set(); base='https://oss.sdyanbao.com/page/2025/8/4/1218250'
          for idx in range(29):
              url=f'{base}/{idx}.png'; r=s.get(url,headers={'Referer':base,'Accept':'image/*,*/*'},timeout=(20,120)); r.raise_for_status(); data=r.content
              if len(data)<15000: raise RuntimeError(f'Page {idx+1} too small: {len(data)}')
              digest=hashlib.sha256(data).hexdigest()
              if digest in hashes: raise RuntimeError(f'Duplicate page {idx+1}')
              hashes.add(digest)
              im=Image.open(io.BytesIO(data)); im.verify(); im=Image.open(io.BytesIO(data)); width,height=im.size; fmt=im.format; im.close()
              if width<1000 or height<700: raise RuntimeError(f'Unexpected page dimensions {idx+1}: {width}x{height}')
              path=PAGES/f'{idx:03d}.png'; path.write_bytes(data); image_paths.append(path)
              print('IMAGE_OK',idx+1,len(data),width,height,fmt,flush=True)
          if len(image_paths)!=29: raise RuntimeError('Missing 2025 pages')
          pdf25=FINAL/'2025-07-31_中邮证券_海域金矿投产有望显著增厚公司业绩.pdf'; pdf25.write_bytes(img2pdf.convert([str(p) for p in image_paths]))
          data25=pdf25.read_bytes(); pages25=len(PdfReader(io.BytesIO(data25),strict=False).pages)
          if pages25!=29: raise RuntimeError(f'2025 PDF pages={pages25}')
          records.append({'filename':pdf25.name,'path':str(pdf25),'broker':'中邮证券','date':'2025-07-31','title':'招金矿业（HK1818）深度报告：海域金矿投产有望显著增厚公司业绩','pages':pages25,'bytes':len(data25),'sha256':hashlib.sha256(data25).hexdigest(),'source':'https://oss.sdyanbao.com/page/2025/8/4/1218250','note':'公开原报告29页图像按原页序无删减合并为PDF'})

          url24='https://cdn.hangyan.co/document_reports/3466271943412417652/202409_zhaojinkuangyeshengqianli_zhaojinerlai.pdf'
          r=s.get(url24,headers={'Referer':'https://www.hangyan.co/reports/3466271943412417652','Accept':'application/pdf,*/*'},timeout=(30,180)); r.raise_for_status(); data24=r.content
          if not data24.lstrip().startswith(b'%PDF') or len(data24)<100000: raise RuntimeError('Invalid 2024 PDF')
          reader=PdfReader(io.BytesIO(data24),strict=False); pages24=len(reader.pages); text='\n'.join((p.extract_text() or '') for p in reader.pages[:3])
          if pages24!=30 or '招金矿业' not in text or '浙商' not in text: raise RuntimeError(f'2024 validation failed pages={pages24}')
          pdf24=FINAL/'2024-09-27_浙商证券_深聚潜力_招金而来.pdf'; pdf24.write_bytes(data24)
          records.append({'filename':pdf24.name,'path':str(pdf24),'broker':'浙商证券','date':'2024-09-27','title':'招金矿业（01818.HK）深度报告：深聚潜力，“招”金而来','pages':pages24,'bytes':len(data24),'sha256':hashlib.sha256(data24).hexdigest(),'source':'https://www.hangyan.co/reports/3466271943412417652','note':'公开下载的券商原始PDF'})

          cards=[]
          for rec in records:
              doc=pymupdf.open(rec['path']); pix=doc[0].get_pixmap(matrix=pymupdf.Matrix(1.2,1.2),alpha=False); rp=RENDERS/(Path(rec['filename']).stem+'.png'); pix.save(str(rp)); doc.close()
              im=Image.open(rp).convert('RGB'); im.thumbnail((620,820)); card=Image.new('RGB',(680,930),'white'); card.paste(im,((680-im.width)//2,20)); ImageDraw.Draw(card).text((20,875),f"{rec['broker']} | {rec['date']} | {rec['pages']} pages",fill='black'); cards.append(card); im.close()
          sheet=Image.new('RGB',(1360,930),'white'); sheet.paste(cards[0],(0,0)); sheet.paste(cards[1],(680,0)); sheet.save(OUT/'first_page_contact_sheet.jpg',quality=90)
          for c in cards:c.close()

          manifest=FINAL/'文件清单与校验值.csv'
          with manifest.open('w',encoding='utf-8-sig',newline='') as f:
              fields=['序号','券商','发布日期','报告标题','PDF页数','文件大小_字节','SHA256','公开来源','版本说明','文件名']; w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for i,x in enumerate(records,1): w.writerow({'序号':i,'券商':x['broker'],'发布日期':x['date'],'报告标题':x['title'],'PDF页数':x['pages'],'文件大小_字节':x['bytes'],'SHA256':x['sha256'],'公开来源':x['source'],'版本说明':x['note'],'文件名':x['filename']})
          readme=FINAL/'README.txt'; lines=['招金矿业（01818.HK）券商深度报告资料包','打包日期：2026-09-07','','收录2份完整公司深度报告。','已校验页数、可解析性、首页渲染及ZIP CRC。','']
          for i,x in enumerate(records,1): lines += [f"{i}. {x['broker']}｜{x['date']}｜{x['title']}｜{x['pages']}页",f"   版本：{x['note']}",f"   来源：{x['source']}"]
          readme.write_text('\n'.join(lines),encoding='utf-8')

          archive=OUT/'招金矿业_01818_券商深度报告_2份.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(FINAL.iterdir()):z.write(p,p.name)
          with zipfile.ZipFile(archive,'r') as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad is not None or len(pdfs)!=2:raise RuntimeError(f'ZIP failed {bad} {pdfs}')
          backup=OUT/'Zhaojin_Mining_01818_Broker_Deep_Reports_2.zip'; shutil.copy2(archive,backup)
          result={'ok':True,'archive':archive.name,'backup':backup.name,'archive_bytes':archive.stat().st_size,'zip_crc_ok':True,'records':records}
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'); print('PACKAGE_OK',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-broker-deep-reports-final-v2
          path: output/*
          retention-days: 1
          if-no-files-found: error
