name: Discover Quantgroup broker research reports 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-broker-report-discovery-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Search public web and report databases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlparse, parse_qs, unquote

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('quantgroup_report_discovery')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,application/json,*/*;q=0.8',
          })

          queries = [
              '量化派 02685 券商 深度报告 PDF',
              '量化派 02685 首次覆盖 研报',
              '量化派控股 公司研究 证券',
              '量化派 目标价 买入 券商',
              'Quantgroup 02685 equity research report pdf',
              '02685 HK broker report Quantgroup',
              '量化派 中金 研报',
              '量化派 中信证券 研报',
              '量化派 第一上海 研报',
              '量化派 国泰君安国际 研报',
              '量化派 招银国际 研报',
              '量化派 交银国际 研报',
              '量化派 华泰国际 研报',
          ]

          engine_urls = []
          for q in queries:
              qq = quote(q)
              engine_urls += [
                  ('bing', q, f'https://www.bing.com/search?q={qq}&count=50'),
                  ('duckduckgo', q, f'https://html.duckduckgo.com/html/?q={qq}'),
                  ('baidu', q, f'https://www.baidu.com/s?wd={qq}&rn=50'),
                  ('sogou', q, f'https://www.sogou.com/web?query={qq}&num=50'),
                  ('so360', q, f'https://www.so.com/s?q={qq}'),
                  ('jina_bing', q, f'https://r.jina.ai/http://www.bing.com/search?q={qq}&count=50'),
                  ('jina_google', q, f'https://r.jina.ai/http://www.google.com/search?q={qq}&num=50'),
              ]

          def normalize_link(href: str, base: str) -> str:
              href = html.unescape(href or '').strip()
              if not href or href.startswith(('javascript:', 'mailto:', '#')):
                  return ''
              u = urljoin(base, href)
              # DuckDuckGo redirect wrapper
              if 'duckduckgo.com/l/' in u:
                  qs = parse_qs(urlparse(u).query)
                  if qs.get('uddg'):
                      u = unquote(qs['uddg'][0])
              return u

          all_hits = []
          raw_index = []
          for idx, (engine, q, url) in enumerate(engine_urls, 1):
              try:
                  r = s.get(url, timeout=(20, 75), allow_redirects=True)
                  ctype = r.headers.get('content-type', '')
                  print('SEARCH', idx, engine, r.status_code, len(r.content), r.url, flush=True)
                  rawname = OUT / f'{idx:03d}_{engine}.txt'
                  rawname.write_bytes(r.content[:5_000_000])
                  text = r.text
                  soup = BeautifulSoup(text, 'lxml')
                  links = []
                  for a in soup.find_all('a'):
                      u = normalize_link(a.get('href', ''), r.url)
                      label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                      if u:
                          links.append({'url': u, 'text': label[:500]})
                  # Also pull bare URLs from Jina/plain text and script payloads.
                  for m in re.finditer(r'https?://[^\s\]<>"\')]+', text):
                      u = m.group(0).rstrip('.,;')
                      links.append({'url': u, 'text': ''})
                  dedup = {}
                  for x in links:
                      if x['url'] not in dedup or (not dedup[x['url']] and x['text']):
                          dedup[x['url']] = x['text']
                  record = {
                      'engine': engine, 'query': q, 'status': r.status_code,
                      'final_url': r.url, 'bytes': len(r.content), 'content_type': ctype,
                      'links': [{'url': u, 'text': t} for u, t in dedup.items()],
                  }
                  (OUT / f'{idx:03d}_{engine}.json').write_text(json.dumps(record, ensure_ascii=False, indent=2), encoding='utf-8')
                  raw_index.append({k: record[k] for k in ('engine','query','status','final_url','bytes','content_type')})
                  for u, t in dedup.items():
                      low = (u + ' ' + t).lower()
                      if any(k in low for k in ('量化派','quantgroup','02685','2685.hk','02685.hk')):
                          all_hits.append({'engine': engine, 'query': q, 'url': u, 'text': t})
              except Exception as e:
                  print('SEARCH_ERR', engine, q, repr(e), flush=True)
                  raw_index.append({'engine': engine, 'query': q, 'error': repr(e)})
              time.sleep(0.15)

          direct_urls = [
              # Eastmoney / public report APIs, several historical variants.
              'https://reportapi.eastmoney.com/report/list?pageSize=100&pageNo=1&qType=0&code=02685&beginTime=2025-01-01&endTime=2026-09-19',
              'https://reportapi.eastmoney.com/report/list?pageSize=100&pageNo=1&qType=0&code=HK02685&beginTime=2025-01-01&endTime=2026-09-19',
              'https://reportapi.eastmoney.com/report/list?pageSize=100&pageNo=1&qType=0&code=2685&beginTime=2025-01-01&endTime=2026-09-19',
              'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_HK_RESEARCHREPORT&pageNumber=1&pageSize=100&filter=(SECURITY_CODE%3D%2202685%22)',
              'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_HK_STOCK_REPORT&pageNumber=1&pageSize=100&filter=(SECURITY_CODE%3D%2202685%22)',
              'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_RESEARCHREPORT&pageNumber=1&pageSize=100&filter=(SECURITY_CODE%3D%2202685%22)',
              # Site search candidates.
              'https://www.fxbaogao.com/search?keyword=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://fxbaogao.com/search/?q=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://www.baogaobox.com/search?keyword=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://www.vzkoo.com/search?keyword=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://www.reportify.cn/search?q=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://www.fhyanbao.com/search?keyword=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://www.360why.com/search?q=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://www.nxny.com/search.html?keyword=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://www.hibor.com.cn/search?keyword=%E9%87%8F%E5%8C%96%E6%B4%BE',
              'https://stock.finance.sina.com.cn/hkstock/go.php/CompanyNotice/index/code/02685.phtml',
              'https://stockpage.10jqka.com.cn/HK02685/research/',
          ]
          direct_results=[]
          for j, url in enumerate(direct_urls, 1):
              try:
                  r=s.get(url,timeout=(20,90),allow_redirects=True)
                  print('DIRECT',j,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  fn=OUT/f'direct_{j:02d}_{urlparse(url).netloc.replace(".","_")}.txt'
                  fn.write_bytes(r.content[:8_000_000])
                  direct_results.append({'input':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type')})
                  text=r.text
                  soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all('a'):
                      u=normalize_link(a.get('href',''),r.url)
                      t=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                      low=(u+' '+t).lower()
                      if u and any(k in low for k in ('量化派','quantgroup','02685')):
                          all_hits.append({'engine':'direct','query':url,'url':u,'text':t[:500]})
                  for m in re.finditer(r'https?://[^\s\]<>"\')]+(?:\.pdf|\.PDF)(?:\?[^\s\]<>"\')]+)?',text):
                      all_hits.append({'engine':'direct','query':url,'url':m.group(0),'text':'bare_pdf'})
              except Exception as e:
                  print('DIRECT_ERR',url,repr(e),flush=True)
                  direct_results.append({'input':url,'error':repr(e)})

          # Deduplicate and rank hits likely to be research reports.
          seen={}
          for hit in all_hits:
              u=hit['url']
              if not u or u.startswith(('https://www.baidu.com/s','https://www.bing.com/search','https://www.google.com/search')):
                  continue
              key=u.split('#')[0]
              if key not in seen:
                  seen[key]=hit
          ranked=[]
          for hit in seen.values():
              low=(hit['url']+' '+hit.get('text','')).lower()
              score=0
              for k,w in [('pdf',8),('研报',6),('研究报告',8),('首次覆盖',8),('深度',7),('公司研究',7),('证券',3),('broker',4),('research',4),('量化派',4),('quantgroup',4),('02685',4)]:
                  if k in low: score+=w
              if any(host in low for host in ('fxbaogao','baogaobox','reportify','fhyanbao','vzkoo','hibor','pdf.dfcfw','mystockhk','dbs.com','research','report')):
                  score += 3
              hit=dict(hit); hit['score']=score
              ranked.append(hit)
          ranked.sort(key=lambda x:(-x['score'],x['url']))
          (OUT/'ranked_hits.json').write_text(json.dumps(ranked,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'search_index.json').write_text(json.dumps(raw_index,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'direct_results.json').write_text(json.dumps(direct_results,ensure_ascii=False,indent=2),encoding='utf-8')
          with (OUT/'ranked_hits.txt').open('w',encoding='utf-8') as f:
              for h in ranked:
                  f.write(f"SCORE={h['score']}\t{h.get('text','')}\t{h['url']}\tENGINE={h['engine']}\tQUERY={h['query']}\n")
          print('TOP_HITS_START')
          for h in ranked[:200]:
              print('HIT',h['score'],h.get('text','')[:300],h['url'],flush=True)
          print('TOP_HITS_END')
          PY

      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-broker-report-discovery-20260919
          path: quantgroup_report_discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
