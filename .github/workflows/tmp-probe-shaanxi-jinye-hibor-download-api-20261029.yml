name: Probe Shaanxi Jinye Hibor download API

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect page HTML and JavaScript
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for docid in ['137827','505559']:
            r=s.get(f'https://www.hibor.com.cn/docdetail_{docid}.html',timeout=(15,60),allow_redirects=True)
            r.encoding=r.apparent_encoding or 'utf-8'
            text=html.unescape(r.text).replace('\\/','/')
            print('\nDOC',docid,'URL',r.url,'LEN',len(text))
            for key in ['DownloadLayerDownload','DownloadLayer4','download-btn','docId','docid','fileId','fileid','data-','dcf57d','057af0']:
              start=0
              while True:
                i=text.lower().find(key.lower(),start)
                if i<0: break
                print('HTML_AROUND',key,repr(text[max(0,i-1200):min(len(text),i+2500)]))
                start=i+len(key)
                if start>i+10000: break
            soup=BeautifulSoup(text,'html.parser')
            for tag in soup.find_all(True):
              attrs=' '.join(f'{k}={v}' for k,v in tag.attrs.items())
              combined=(tag.get_text(' ',strip=True)+' '+attrs)
              if any(k in combined.lower() for k in ['download','docid','fileid','downfile','pdf']):
                print('TAG',tag.name,attrs,repr(tag.get_text(' ',strip=True)[:500]))
            scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]
            for js in scripts:
              if 'DocDetailNew' not in js and 'Layout' not in js: continue
              rr=s.get(js,timeout=(15,60)); body=rr.text
              print('JS',js,rr.status_code,len(body))
              for key in ['DownloadLayerDownload','DownloadLayer4','download-btn','ajax','/data/','api/']:
                start=0; n=0
                while True:
                  i=body.lower().find(key.lower(),start)
                  if i<0 or n>=10: break
                  print('JS_AROUND',key,body[max(0,i-2000):min(len(body),i+4000)])
                  start=i+len(key); n+=1
          PY
