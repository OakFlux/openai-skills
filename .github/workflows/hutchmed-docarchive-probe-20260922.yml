name: Probe HUTCHMED legacy document archive 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-docarchive-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Parse legacy presentations page
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, requests, urllib3
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pathlib import Path
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          s=requests.Session(); s.trust_env=False; s.verify=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36'})
          urls=[
            'https://www.hutch-med.com/wp-content/uploads/docArchive/presentations.htm',
            'https://www.hutch-med.com/wp-content/uploads/docArchive/financials.htm',
            'https://www.hutch-med.com/wp-content/uploads/docArchive/reports.htm',
          ]
          rows=[]
          for u in urls:
            try:
              r=s.get(u,timeout=60,verify=False)
              print('FETCH',u,r.status_code,len(r.content),r.headers.get('content-type'))
              if r.status_code!=200: continue
              enc=r.apparent_encoding or 'latin-1'
              text=r.content.decode(enc,errors='replace')
              soup=BeautifulSoup(text,'lxml')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                key=(label+' '+href).lower()
                if any(str(y) in key for y in range(2006,2012)) and any(k in key for k in ['annual','report','accounts','pdf']):
                  row={'page':u,'label':label,'href':href}
                  rows.append(row); print(json.dumps(row,ensure_ascii=False))
              Path('legacy_'+u.rsplit('/',1)[-1]).write_text(text,encoding='utf-8')
            except Exception as e:
              print('ERROR',u,repr(e))
          Path('legacy_links.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-docarchive-probe
          path: |
            legacy_links.json
            legacy_*.htm
          if-no-files-found: error
          retention-days: 7
