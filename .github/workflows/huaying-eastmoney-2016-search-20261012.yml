name: Search Eastmoney 2016 Huaying reports 20261012

on:
  push:
    paths:
      - '.triggers/huaying-eastmoney-2016-search-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query Eastmoney variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json,*/*','Referer':'https://data.eastmoney.com/report/'})
          variants=[]
          for endpoint in ('https://reportapi.eastmoney.com/report/list','https://reportapi.eastmoney.com/report/list2'):
            for qtype in ('0','1','2'):
              for code in ('000536','SZ000536','000536.SZ',''):
                variants.append((endpoint,qtype,code))
          for i,(ep,qtype,code) in enumerate(variants,1):
            common={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2016-01-01','endTime':'2016-12-31','code':code,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','rcode':'','qType':qtype,'fields':''}
            try:
              if ep.endswith('list2'):
                r=s.post(ep,json=common,timeout=60,headers={'Content-Type':'application/json','Referer':'https://data.eastmoney.com/report/'})
              else:
                r=s.get(ep,params=common,timeout=60)
              print('QUERY',i,ep,qtype,code,r.status_code,len(r.content),flush=True)
              if r.status_code!=200: continue
              j=r.json(); rows=j.get('data') or []
              print('COUNT',len(rows),'TOTAL',j.get('total') or j.get('hits'),flush=True)
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if '华映科技' in blob or '000536' in blob or '华丽转身' in blob or 'IGZO' in blob:
                  print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
            except Exception as e: print('ERR',i,repr(e),flush=True)
          PY
