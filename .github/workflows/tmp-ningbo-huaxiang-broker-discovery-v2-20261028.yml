name: Discover Ningbo Huaxiang broker reports v2

on:
  push:
    branches:
      - tmp-ningbo-huaxiang-broker-reports-20261028

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Search all Eastmoney reports around target dates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, re, requests

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api = 'https://reportapi.eastmoney.com/report/list'
          windows = [
              ('2025-06-20','2025-07-10'),
              ('2026-02-08','2026-02-18'),
              ('2026-05-23','2026-06-02'),
          ]
          for begin, end in windows:
              print('\nWINDOW', begin, end)
              page = 1
              while True:
                  params = {
                      'cb':'datatable4263982','industryCode':'*','pageSize':'100','industry':'*',
                      'rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,
                      'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'',
                  }
                  r = session.get(api, params=params, timeout=120)
                  r.raise_for_status()
                  text = r.text.strip()
                  m = re.match(r'^[^(]+\((.*)\)\s*;?$', text, re.S)
                  payload = json.loads(m.group(1) if m else text)
                  rows = payload.get('data') or []
                  hits = int(payload.get('hits') or 0)
                  for row in rows:
                      blob = ' '.join(str(row.get(k) or '') for k in ('title','stockName','stockCode','orgSName','orgName'))
                      if '宁波华翔' in blob or '002048' in blob:
                          print('MATCH', json.dumps(row, ensure_ascii=False, sort_keys=True))
                  if not rows or page >= math.ceil(hits / 100):
                      break
                  page += 1
          PY
