name: Search global Eastmoney reports for HJTime by date 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-global-eastmoney-date-search-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query exact report dates globally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,time
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,*/*'})
          dates=['2026-01-09','2026-02-09','2026-02-12','2026-02-13','2026-02-14']
          for date in dates:
            for page in range(1,12):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':date,'endTime':date,'pageNo':page,'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':page,'pageNum':page,'pageNumber':page}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(15,90)); print('QUERY',date,page,r.status_code,len(r.content),r.url,flush=True)
              if r.status_code!=200: break
              j=r.json(); rows=j.get('data') or []
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if any(k in blob for k in ['汇嘉时代','603101','新疆零售龙头','胖改','创新转型价值重估','新疆商业龙头','低空经济有望成为第二增长曲线']):
                  print('MATCH',date,page,json.dumps(row,ensure_ascii=False),flush=True)
              if len(rows)<100: break
              time.sleep(.4)
          PY
