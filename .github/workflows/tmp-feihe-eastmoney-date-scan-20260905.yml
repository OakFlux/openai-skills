name: Temporary China Feihe Eastmoney date scan

on:
  push:
    branches:
      - tmp-china-feihe-broker-reports-20260905

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan report API by date
        run: |
          python -m pip install requests
          cat > /tmp/scan.py <<'PY'
          import json
          import requests
          dates = [
            ('2025-05-18','2025-05-21'),
            ('2025-03-13','2025-03-16'),
            ('2022-02-22','2022-02-25'),
            ('2021-03-01','2021-03-04'),
            ('2022-06-23','2022-06-27'),
            ('2022-09-14','2022-09-18'),
            ('2022-12-27','2022-12-31')
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          for begin,end in dates:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1']:
              for page in range(1,6):
                params={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'*','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60); r.raise_for_status(); d=r.json(); rows=d.get('data') or []
                print('Q',qtype,'PAGE',page,'ROWS',len(rows),'TOTAL',d.get('hits'),d.get('TotalPage'))
                for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if '飞鹤' in blob or 'FEIHE' in blob.upper() or '06186' in blob or '6186.HK' in blob:
                    print('HIT',blob)
                if not rows or page >= int(d.get('TotalPage') or 1): break
          PY
          python /tmp/scan.py
