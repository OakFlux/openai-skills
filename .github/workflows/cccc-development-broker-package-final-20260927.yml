name: Package CCCC Development broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/cccc-development-broker-package-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '中交发展_000736_券商研究报告_2份'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_华泰证券_中交地产_背靠五商中交胸怀鸿鹄之志_2020-06-08_深度报告.pdf',
                  'title': '背靠五商中交，胸怀鸿鹄之志',
                  'date': '2020-06-08',
                  'type': '首次覆盖深度报告',
                  'url': 'https://crm.htsc.com.cn/doc/2020/10710101/141a4cbb-3dde-46e1-9209-2b7c5cec6804.pdf',
                  'min_pages': 24,
                  'title_terms': ['背靠五商中交', '胸怀鸿鹄之志'],
              },
              {
                  'filename': '02_华泰证券_中交地产_业绩持续上行并表贡献投资收益_2020-10-15_公司研究.pdf',
                  'title': '业绩持续上行，并表贡献投资收益',
                  'date': '2020-10-15',
                  'type': '公司研究/公告点评',
                  'url': 'https://crm.htsc.com.cn/doc/2020/10710203/6830a6e7-22d2-45f5-befe-d1dc59905d99.pdf',
                  'min_pages': 6,
                  'title_terms': ['业绩持续上行', '并表贡献投资收益'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://crm.htsc.com.cn/',
          })

          def download_pdf(url: str, dest: Path) -> str:
              errors = []
              for attempt in range(1, 5):
                  tmp = dest.with_suffix('.pdf.part')
                  try:
                      with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as r:
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, 'final', r.url, flush=True)
                          r.raise_for_status()
                          with tmp.open('wb') as fh:
                              for chunk in r.iter_content(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                          final_url = r.url
                      size = tmp.stat().st_size
                      with tmp.open('rb') as fh:
                          head = fh.read(8)
                      if size < 100_000 or not head.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF size={size}, head={head!r}')
                      tmp.replace(dest)
                      return final_url
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      tmp.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records = []
          seen_hashes = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['url'], dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              text = ''
              for page in reader.pages[:min(12, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '000736' not in compact or '中交地产' not in compact:
                  raise RuntimeError(f'company identity check failed for {dest.name}')
              if '华泰证券' not in compact and '华泰证券研究所' not in compact:
                  raise RuntimeError(f'broker identity check failed for {dest.name}')
              if not all(term in compact for term in doc['title_terms']):
                  raise RuntimeError(f'title check failed for {dest.name}')

              q = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {q.stderr[-1200:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              rec = {
                  'filename': dest.name,
                  'company_current_name': '中交城市发展控股集团股份有限公司（中交发展）',
                  'historical_name_in_report': '中交地产股份有限公司',
                  'stock_code': '000736.SZ',
                  'broker': '华泰证券',
                  'title': doc['title'],
                  'report_date': doc['date'],
                  'report_type': doc['type'],
                  'pages': pages,
                  'bytes': len(data),
                  'source': '华泰证券研究所官方PDF',
                  'source_url': final_url,
                  'sha256': sha,
              }
              records.append(rec)
              print('VALIDATED', json.dumps(rec, ensure_ascii=False), flush=True)

          readme = [
              '中交发展（000736.SZ，历史名称：中交地产）券商研究报告合集',
              '整理日期：2026-09-27',
              '',
              '收录说明：',
              '1. 第一份为26页首次覆盖深度报告，是本包的核心深度材料。',
              '2. 第二份为6页完整公司研究/公告点评，用于补充后续经营与估值跟踪。',
              '3. 公开端可匿名取得、文件完整且可核验的长篇深度报告数量有限；本包未使用网页摘要、仅有前几页的预览件或拼接材料凑数。',
              '4. 两份报告发布时公司名称均为“中交地产”，现证券简称为“中交发展”，证券代码000736.SZ未变。',
              '',
              '文件清单：',
          ]
          for i, r in enumerate(records, 1):
              readme.extend([
                  f"{i}. {r['broker']}｜{r['title']}",
                  f"   类型：{r['report_type']}；日期：{r['report_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MiB",
                  f"   文件：{r['filename']}",
                  f"   来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、证券代码、公司名称、券商名称、报告标题、实际页数、qpdf结构检查、重复哈希检查及SHA-256。')
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          if len(list(out.glob('*.pdf'))) != 2:
              raise RuntimeError('PDF count mismatch')
          print('FINAL_PACKAGE', PACKAGE, 'PDF_COUNT', 2, 'TOTAL_BYTES', sum(r['bytes'] for r in records), flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cccc-development-broker-reports-final
          path: 中交发展_000736_券商研究报告_2份/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
