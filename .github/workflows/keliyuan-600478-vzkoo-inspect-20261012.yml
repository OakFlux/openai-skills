name: Inspect Keliyuan public report page 20261012

on:
  push:
    paths:
      - '.github/workflows/keliyuan-600478-vzkoo-inspect-20261012.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect page metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.vzkoo.com/document/202212014497a29e6a1e872c64d009da.html'
          s=requests.Session(); s.trust_env=False
          r=s.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.vzkoo.com/'},timeout=60)
          print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,flush=True)
          text=r.text
          for pattern in [r'https?://[^\"\'<> ]+\.pdf[^\"\'<> ]*', r'https?://[^\"\'<> ]+', r'[^\"\']+\.pdf[^\"\']*']:
              vals=[]
              for m in re.findall(pattern,text,re.I):
                  if m not in vals: vals.append(m)
              print('PATTERN',pattern,'COUNT',len(vals),flush=True)
              for v in vals[:100]: print('URL',v,flush=True)
          soup=BeautifulSoup(text,'html.parser')
          print('TITLE',soup.title.string if soup.title else '',flush=True)
          for tag in soup.find_all(['script','meta','a']):
              val=tag.get('src') or tag.get('content') or tag.get('href')
              if val and ('pdf' in val.lower() or 'download' in val.lower() or 'document' in val.lower()):
                  print('TAG',tag.name,val,flush=True)
          print('HEAD',text[:20000],flush=True)
          PY
