name: Temporary search Microbell Yuexiu Transport reports

on:
  push:
    branches:
      - tmp-microbell-yuexiu-search-20260905

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search public report index
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          base='https://www.microbell.com/newweb/web/search?f=3x&gjz=%E8%B6%8A%E7%A7%80%E4%BA%A4%E9%80%9A%E5%9F%BA%E5%BB%BA&sjfw=3&ssfw=ybbt&ybfl1=all'
          seen=set(); rows=[]
          for idx in range(1,11):
              u=base+f'&index={idx}'
              r=s.get(u,timeout=30)
              print('PAGE',idx,r.status_code,len(r.content),r.url)
              soup=BeautifulSoup(r.text,'html.parser')
              count=0
              for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href']); title=' '.join(a.stripped_strings)
                  if 'repinfodetail_' in href and href not in seen:
                      seen.add(href); count+=1; row={'title':title,'url':href}; rows.append(row); print('REPORT',json.dumps(row,ensure_ascii=False))
              print('COUNT',idx,count)
              if count==0 and idx>1: break
          print('TOTAL',len(rows))
          PY
