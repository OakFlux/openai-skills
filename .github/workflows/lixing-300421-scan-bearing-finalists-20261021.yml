name: Scan Lixing bearing report finalists 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-scan-bearing-finalists-20261021.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests pymupdf
      - name: Scan finalist PDFs
        shell: bash
        run: |
          python - <<'PY'
          import requests,pymupdf,re,json,hashlib
          reports=[
            {'info':'AP202206291575511887','broker':'国信证券','date':'2022-06-29','title':'平价风电专题研究之五：风电轴承降本突围','meta_pages':49},
            {'info':'AP202208081577012040','broker':'信达证券','date':'2022-08-09','title':'风电轴承行业深度报告：风机部件国产最后一环，轴承企业百花齐放','meta_pages':50},
            {'info':'AP202301131581950496','broker':'国金证券','date':'2023-01-13','title':'风电轴承行业研究：风起初春，风电轴承步入国产化深水区','meta_pages':41},
            {'info':'AP202307311592910914','broker':'国金证券','date':'2023-07-31','title':'轴承行业研究：机械设备核心部件，机器人有望打开应用','meta_pages':52},
          ]
          aliases=['力星股份','江苏力星通用钢球股份有限公司','300421','力星钢球']
          s=requests.Session();s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
          out=[]
          for rep in reports:
            detail=f"https://data.eastmoney.com/report/info/{rep['info']}.html";data=None;url=''
            for h in ['H3','H2','H1','H4']:
              u=f"https://pdf.dfcfw.com/pdf/{h}_{rep['info']}_1.pdf"
              r=s.get(u,headers={'User-Agent':ua,'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'},timeout=(20,240))
              if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:data=r.content;url=u;break
            if not data:out.append({**rep,'error':'download failed'});continue
            doc=pymupdf.open(stream=data,filetype='pdf');hits=[];snips=[];occ=0
            for i in range(doc.page_count):
              text=doc.load_page(i).get_text('text') or '';compact=re.sub(r'\s+','',text);ph={}
              for a in aliases:
                n=compact.count(re.sub(r'\s+','',a))
                if n:
                  ph[a]=n;occ+=n
                  if len(snips)<30:
                    pos=text.find(a)
                    if pos>=0:snips.append({'page':i+1,'alias':a,'text':' '.join(text[max(0,pos-180):pos+len(a)+420].split())})
              if ph:hits.append({'page':i+1,'hits':ph})
            pages=doc.page_count;doc.close()
            score=len(hits)*300+occ*50+pages
            out.append({**rep,'pages':pages,'pdf_url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'hit_pages':hits,'occurrences':occ,'snippets':snips,'score':score})
            print('REPORT',rep['info'],'pages',pages,'hit_pages',len(hits),'occ',occ,'score',score)
          out.sort(key=lambda x:x.get('score',-1),reverse=True)
          print('RESULTS',json.dumps(out,ensure_ascii=False,indent=2))
          PY
