name: Target exact Dalipal reports in public index
on:
  push:
    branches:
      - chatgpt-dalipal-reports-20260907
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact titles and validate page sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, time, requests, hashlib
          from pathlib import Path
          from PIL import Image
          import io

          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          headers={'Content-Type':'application/json','Accept':'application/json,text/plain,*/*','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','device':'1','User-Agent':ua}
          api='https://api.sdyanbao.com/api/file/search'
          queries=[
            '达力普控股',
            '大步迈进国际化 把握海外景气周期',
            '中东生产基地将于年内开工',
            '能源装备高端制造企业 达力普控股',
            '价值兼具成长 专精特新 能源高端装备巨匠',
            '专业石油管及无缝钢管制造企业 达力普控股',
            'DALIPAL HLDG 1921',
          ]
          found={}; qlog=[]
          for q in queries:
            for only in (1,0):
              body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              try:
                r=s.post(api,json=body,headers=headers,timeout=(10,75)); r.raise_for_status(); j=r.json()
                rows=(j.get('data') or {}).get('files') or []; total=int((j.get('data') or {}).get('total') or 0)
                print('QUERY',repr(q),'ONLY',only,'ROWS',len(rows),'TOTAL',total,flush=True)
                qlog.append({'q':q,'only':only,'total':total,'rows':len(rows)})
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False).lower()
                  if any(t.lower() in blob for t in ['达力普控股','達力普控股','1921.hk','01921','dalipal']):
                    found[str(x.get('id'))]=x
                    print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
              except Exception as e:
                print('FAIL',repr(q),only,repr(e),flush=True); qlog.append({'q':q,'only':only,'error':repr(e)})
              time.sleep(.15)

          compact=[]; probes=[]
          for x in found.values():
            row={
              'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),
              'page_url':x.get('page_url'),'share_url':x.get('share_url'),'file_size':x.get('file_size'),
              'organization':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),
              'type':(x.get('type') or {}).get('name'),'stock':x.get('stock'),'data_source':x.get('data_source'),
              'data_source_uuid':x.get('data_source_uuid'),'original_id':x.get('original_id')
            }
            compact.append(row)
            base=row['page_url']
            n=int(row['page_count'] or 0)
            if base and n:
              test_indices=sorted(set([0,1,max(0,n//2),max(0,n-2),n-1,n]))
              for idx in test_indices:
                u=f'{base}/{idx}.png'
                try:
                  rr=s.get(u,headers={'User-Agent':ua,'Referer':'https://www.sdyanbao.com/'},timeout=(10,75),allow_redirects=True)
                  sig=rr.content[:16]; isimg=sig.startswith(b'\x89PNG') or sig.startswith(b'\xff\xd8\xff') or sig.startswith(b'RIFF')
                  dims=None
                  if rr.status_code==200 and isimg:
                    try: dims=Image.open(io.BytesIO(rr.content)).size
                    except Exception as e: dims='ERR:'+repr(e)
                  rec={'id':row['id'],'name':row['name'],'page_index':idx,'url':u,'status':rr.status_code,'bytes':len(rr.content),'is_image':isimg,'dims':dims,'sha256':hashlib.sha256(rr.content).hexdigest() if isimg else None}
                  probes.append(rec); print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
                except Exception as e:
                  rec={'id':row['id'],'name':row['name'],'page_index':idx,'url':u,'error':repr(e)}; probes.append(rec); print('PROBE_FAIL',json.dumps(rec,ensure_ascii=False),flush=True)

          compact.sort(key=lambda z:(z.get('date') or '',z.get('page_count') or 0),reverse=True)
          Path('out/results.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/query_log.json').write_text(json.dumps(qlog,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT_COUNT',len(compact),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dalipal-targeted-index-results
          path: out/
          retention-days: 3
          if-no-files-found: error
