name: package-rongtai-605133-filings-fixed

on:
  push:
    branches:
      - tmp/rongtai-605133-filings-20261105-v3

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = "江苏嵘泰工业股份有限公司"
          CODE = "605133"
          PREPARED = "2026-11-05"
          ROOT_NAME = "嵘泰股份_605133_所有年报_招股说明书及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  "sequence": 1,
                  "category": "年度报告",
                  "period": "2020年年度报告",
                  "announcement_date": "2021-04-28",
                  "filename": "01_2020年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-28/605133_20210428_6.pdf",
                      "http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-28/605133_20210428_6.pdf",
                      "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-28/7147580.PDF",
                  ],
                  "required_markers": ["2020年年度报告", "2020年度报告"],
              },
              {
                  "sequence": 2,
                  "category": "年度报告",
                  "period": "2021年年度报告",
                  "announcement_date": "2022-04-30",
                  "filename": "02_2021年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": ["https://static.cninfo.com.cn/finalpage/2022-04-30/1213272883.PDF"],
                  "required_markers": ["2021年年度报告", "2021年度报告"],
              },
              {
                  "sequence": 3,
                  "category": "年度报告",
                  "period": "2022年年度报告",
                  "announcement_date": "2023-04-06",
                  "filename": "03_2022年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": ["https://static.cninfo.com.cn/finalpage/2023-04-06/1216336225.PDF"],
                  "required_markers": ["2022年年度报告", "2022年度报告"],
              },
              {
                  "sequence": 4,
                  "category": "年度报告",
                  "period": "2023年年度报告",
                  "announcement_date": "2024-04-10",
                  "filename": "04_2023年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": ["https://static.cninfo.com.cn/finalpage/2024-04-10/1219553291.PDF"],
                  "required_markers": ["2023年年度报告", "2023年度报告"],
              },
              {
                  "sequence": 5,
                  "category": "年度报告",
                  "period": "2024年年度报告",
                  "announcement_date": "2025-04-19",
                  "filename": "05_2024年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": ["https://static.cninfo.com.cn/finalpage/2025-04-19/1223151206.PDF"],
                  "required_markers": ["2024年年度报告", "2024年度报告"],
              },
              {
                  "sequence": 6,
                  "category": "年度报告",
                  "period": "2025年年度报告",
                  "announcement_date": "2026-04-15",
                  "filename": "06_2025年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": ["https://static.cninfo.com.cn/finalpage/2026-04-15/1225101273.PDF"],
                  "required_markers": ["2025年年度报告", "2025年度报告"],
              },
              {
                  "sequence": 7,
                  "category": "招股说明书",
                  "period": "首次公开发行股票招股说明书（最终发行版）",
                  "announcement_date": "2021-02-02",
                  "filename": "07_首次公开发行股票招股说明书_最终发行版.pdf",
                  "minimum_pages": 250,
                  "urls": ["https://pdf.dfcfw.com/pdf/H2_AN202102021457271118_1.pdf"],
                  "required_markers": ["首次公开发行股票", "招股说明书"],
              },
              {
                  "sequence": 8,
                  "category": "季度报告",
                  "period": "2026年第三季度报告",
                  "announcement_date": "2026-10-30",
                  "filename": "08_2026年第三季度报告.pdf",
                  "minimum_pages": 5,
                  "urls": [
                      "https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/605133_20261030_DP4H.pdf",
                      "http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/605133_20261030_DP4H.pdf",
                      "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-30/12675896.PDF",
                  ],
                  "required_markers": ["2026年第三季度报告"],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def compact(value: str) -> str:
              return re.sub(r"\s+", "", value or "")

          def download(document: dict) -> tuple[bytes, str, str]:
              last = None
              variants = []
              for url in document["urls"]:
                  variants.extend([url, url + ("&download=1" if "?" in url else "?download=1")])
              for url in dict.fromkeys(variants):
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 300),
                              allow_redirects=True,
                              headers={"Accept": "application/pdf,*/*;q=0.8"},
                          )
                          print("DOWNLOAD", document["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          if response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                              return response.content, response.url, response.headers.get("content-type", "")
                          last = RuntimeError(f"Not PDF: {response.content[:60]!r}")
                      except Exception as exc:
                          last = exc
                          print("DOWNLOAD_ERROR", document["period"], attempt, url, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to download {document['period']}: {last}")

          manifest = []
          for document in documents:
              data, source_url, content_type = download(document)
              output = PDF_DIR / document["filename"]
              output.write_bytes(data)

              reader = PdfReader(str(output), strict=False)
              pages = len(reader.pages)
              if pages < document["minimum_pages"]:
                  raise RuntimeError(f"Document too short: {output.name}: {pages} pages")

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {output.name}: {qpdf.stdout}")

              text_run = subprocess.run(
                  ["pdftotext", "-f", "1", "-l", str(min(20, pages)), str(output), "-"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              text_compact = compact(text_run.stdout)
              issuer_hits = [m for m in [COMPANY, CODE, "嵘泰股份", "江苏嵘泰工业"] if compact(m) in text_compact]
              required_hits = [m for m in document["required_markers"] if compact(m) in text_compact]
              if not issuer_hits:
                  raise RuntimeError(f"Issuer validation failed for {output.name}")
              if not required_hits:
                  raise RuntimeError(f"Document type validation failed for {output.name}")

              prefix = PREVIEW_DIR / output.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 6_000:
                  raise RuntimeError(f"Preview rendering failed for {output.name}: {render.stdout}")

              item = {
                  **document,
                  "source_url": source_url,
                  "content_type": content_type,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "issuer_marker_hits": issuer_hits,
                  "document_marker_hits": required_hits,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(item)
              print("VALIDATED", item["period"], pages, item["sha256"])

          readme = [
              f"{COMPANY}（{CODE}.SH）全部年度报告、最终发行版招股说明书及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包包含上市后2020—2025年年度报告全文6份、2021年首次公开发行股票招股说明书最终发行版1份，以及截至整理日最新独立季度报告——2026年第三季度报告1份。",
              "已排除年度报告摘要、招股说明书摘要、招股意向书、申报稿、半年度报告和其他附件。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   类型：{item['category']}；文件：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、报告期间/文件类型、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_文件清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "document_count": len(manifest),
              "annual_report_count": 6,
              "prospectus_count": 1,
              "latest_quarter": "2026年第三季度报告",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "类型", "文件", "公告日期", "文件名", "页数", "字节数", "SHA-256", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["category"], item["period"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"], item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("rongtai_605133_all_annual_prospectus_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if bad is not None or len(pdfs) != 8:
                  raise RuntimeError(f"ZIP validation failed: bad={bad}, pdfs={len(pdfs)}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "document_count": len(manifest),
              "annual_report_count": 6,
              "prospectus_count": 1,
              "latest_quarter": "2026年第三季度报告",
              "files": [{k: x[k] for k in ["category", "period", "announcement_date", "pages", "bytes", "sha256", "source_url"]} for x in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rongtai-605133-filings-fixed-20261105
          path: |
            rongtai_605133_all_annual_prospectus_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
