name: Probe Dadongfang Yixiu report download

on:
  push:
    branches:
      - tmp-probe-dadongfang-yixiu-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe document page and links
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=['https://www.yixiuqixie.com/doc/6314.html','http://www.yixiuqixie.com/doc/6314.html']
          for u in urls:
            print('\nPAGE',u)
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url,'TYPE',r.headers.get('content-type'))
              r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
              text=html.unescape(r.text).replace('\\/','/')
              print('HEAD',text[:3000])
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title)
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a.get('href'))
                label=re.sub(r'\s+','',a.get_text(' ',strip=True))
                if any(k in href.lower() for k in ['download','file','pdf','attachment']) or any(k in label for k in ['下载','附件','PDF']):
                  print('LINK',label,href)
              for tag in soup.find_all(['script','iframe','embed','object']):
                attrs={k:v for k,v in tag.attrs.items() if k in ('src','data','value','href')}
                if attrs: print('TAG',tag.name,attrs)
              patterns=[r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',r'[^\s\"\'<>]+(?:download|down)[^\s\"\'<>]*',r'file[_-]?url[^\n]{0,300}',r'doc[_-]?id[^\n]{0,100}']
              for pat in patterns:
                for m in re.findall(pat,text,flags=re.I): print('MATCH',m)
            except Exception as e: print('ERROR',repr(e))
          PY
