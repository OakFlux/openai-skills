name: Discover Quantgroup 02685 broker reports 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-broker-discovery-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install discovery dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Search public web and report platforms
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from urllib.parse import quote, urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          queries = [
              '"量化派" 02685 券商 研报 PDF',
              '"量化派控股" 研究报告 PDF',
              '"量化派" "新股报告"',
              '"量化派" "新股研究"',
              '"2685.HK" research report PDF',
              '"Quantgroup Holding" research report pdf',
              '"量化派" 辉立 证券',
              '"量化派" 耀才 证券',
              '"量化派" 国泰君安 研究',
              '"量化派" 信诚 证券',
              '"量化派" 富途 研报',
              '"量化派" 中金 研究报告',
              '"量化派" 中信证券 报告',
              'site:fxbaogao.com 量化派',
              'site:hibor.com.cn 量化派',
              'site:sdyanbao.com 量化派',
              'site:pdf.dfcfw.com 量化派',
              'site:reportify.cn 量化派',
          ]

          def clean_url(href: str) -> str:
              href = html.unescape(href)
              if href.startswith('//'): href = 'https:' + href
              if 'bing.com/ck/a' in href:
                  try:
                      q = parse_qs(urlparse(href).query)
                      u = q.get('u', [''])[0]
                      if u.startswith('a1'):
                          import base64
                          raw = u[2:]
                          raw += '=' * (-len(raw)%4)
                          return base64.b64decode(raw).decode('utf-8','ignore')
                  except Exception:
                      pass
              if 'uddg=' in href:
                  try:
                      return unquote(parse_qs(urlparse(href).query)['uddg'][0])
                  except Exception: pass
              return href

          def search_engine(name, url_template, queries):
              print('\n===== SEARCH ENGINE', name, '=====')
              seen=set()
              for q in queries:
                  url=url_template.format(q=quote(q))
                  try:
                      r=s.get(url,timeout=40)
                      print('QUERY', q, 'STATUS', r.status_code, 'LEN', len(r.content), 'URL', r.url)
                      soup=BeautifulSoup(r.text,'lxml')
                      count=0
                      for a in soup.find_all('a', href=True):
                          href=clean_url(a['href'])
                          txt=' '.join(a.get_text(' ',strip=True).split())
                          low=(href+' '+txt).lower()
                          if not href.startswith('http'): continue
                          if any(x in low for x in ['量化派','quantgroup','02685','2685','fxbaogao','hibor','sdyanbao','pdf']):
                              if href not in seen:
                                  seen.add(href); count+=1
                                  print('RESULT', q, '|||', txt[:180], '|||', href[:1000])
                      print('MATCHES',count)
                  except Exception as e:
                      print('ERROR',q,repr(e))
                  time.sleep(1)

          search_engine('BING','https://www.bing.com/search?q={q}&count=50&setlang=zh-hans',queries)
          search_engine('DUCK','https://html.duckduckgo.com/html/?q={q}',queries)
          search_engine('BAIDU','https://www.baidu.com/s?wd={q}&rn=50',queries)

          candidates = [
              'https://www.fxbaogao.com/search?keyword='+quote('量化派'),
              'https://www.fxbaogao.com/search/'+quote('量化派'),
              'https://www.fxbaogao.com/search?query='+quote('量化派'),
              'https://www.fxbaogao.com/?keyword='+quote('量化派'),
              'https://www.hibor.com.cn/search?keyword='+quote('量化派'),
              'https://www.hibor.com.cn/search?key='+quote('量化派'),
              'https://www.hibor.com.cn/Search?keyword='+quote('量化派'),
              'https://m.hibor.com.cn/search?keyword='+quote('量化派'),
              'https://www.sdyanbao.com/search?keyword='+quote('量化派'),
              'https://www.sdyanbao.com/search?key='+quote('量化派'),
              'https://www.sdyanbao.com/search/'+quote('量化派'),
              'https://www.djyanbao.com/search?keyword='+quote('量化派'),
              'https://www.djyanbao.com/search?key='+quote('量化派'),
          ]
          print('\n===== PLATFORM CANDIDATES =====')
          for u in candidates:
              try:
                  r=s.get(u,timeout=40,allow_redirects=True)
                  text=' '.join(BeautifulSoup(r.text,'lxml').get_text(' ',strip=True).split())
                  print('PLATFORM',r.status_code,len(r.content),r.url,'HAS_Q',('量化派' in text),'TEXT',text[:500])
                  soup=BeautifulSoup(r.text,'lxml')
                  for a in soup.find_all('a',href=True):
                      txt=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      if '量化派' in txt or '02685' in txt or '2685' in txt or 'quantgroup' in href.lower():
                          print('PLINK',txt[:200],href[:800])
              except Exception as e: print('PERROR',u,repr(e))

          # Inspect report platform home/search scripts for API clues.
          for base in ['https://www.fxbaogao.com/','https://www.sdyanbao.com/','https://www.hibor.com.cn/','https://www.djyanbao.com/']:
              print('\n===== INSPECT',base,'=====')
              try:
                  r=s.get(base,timeout=40)
                  print('BASE',r.status_code,len(r.content),r.url)
                  soup=BeautifulSoup(r.text,'lxml')
                  scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')]
                  print('SCRIPTS',scripts[:30])
                  for js in scripts[:20]:
                      try:
                          rr=s.get(js,timeout=30)
                          if rr.status_code!=200: continue
                          body=rr.text
                          if any(k in body.lower() for k in ['search','keyword','api','report']):
                              print('JS',js,'LEN',len(body))
                              for pat in [r'https?://[^"\' ]+', r'/api/[^"\' ]+', r'/search[^"\' ]*', r'keyword[^,;}]{0,100}']:
                                  vals=re.findall(pat,body,re.I)
                                  if vals: print('PAT',pat,vals[:30])
                      except Exception as e: print('JSERR',js,repr(e))
              except Exception as e: print('BASEERR',base,repr(e))
          PY
