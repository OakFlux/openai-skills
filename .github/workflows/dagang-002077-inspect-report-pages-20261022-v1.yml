name: Inspect Dagang 002077 broker report pages 20261022

on:
  push:
    branches:
      - tmp/dagang-002077-broker-discovery-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report pages and links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          urls = [
              'https://m.yuncaijing.com/news/report_83223.html',
              'https://www.yuncaijing.com/news/report_83223.html',
              'https://m.yuncaijing.com/news/report_83219.html',
              'https://www.yuncaijing.com/news/report_83219.html',
              'https://m.yuncaijing.com/news/report_15845.html',
              'https://www.yuncaijing.com/news/report_15845.html',
              'https://m.yuncaijing.com/news/report_122749.html',
              'https://www.yuncaijing.com/news/report_122749.html',
              'https://m.yuncaijing.com/news/report_83220.html',
              'https://m.yuncaijing.com/news/report_83221.html',
              'https://m.yuncaijing.com/news/report_83222.html',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for url in urls:
              print('\n====================',url)
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'CTYPE',r.headers.get('content-type'))
                  enc=r.apparent_encoding or r.encoding or 'utf-8'
                  text=r.content.decode(enc,errors='replace')
                  soup=BeautifulSoup(text,'lxml')
                  title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  print('TITLE',title)
                  metas=[]
                  for m in soup.find_all('meta'):
                      d={k:m.get(k) for k in ['name','property','content','http-equiv'] if m.get(k)}
                      if d: metas.append(d)
                  print('METAS',json.dumps(metas[:100],ensure_ascii=False,indent=2))
                  links=[]
                  for tag in soup.find_all(True):
                      for attr in ['href','src','data-src','data-url','data-href','content']:
                          val=tag.get(attr)
                          if not val: continue
                          full=urljoin(r.url,val)
                          label=re.sub(r'\s+',' ',tag.get_text(' ',strip=True))[:240]
                          low=(full+' '+label).lower()
                          if any(k in low for k in ['.pdf','download','研报','报告','attach','file','research','report']):
                              links.append({'tag':tag.name,'attr':attr,'label':label,'url':full})
                  print('CANDIDATE_LINKS',json.dumps(links[:500],ensure_ascii=False,indent=2))
                  body=re.sub(r'\s+',' ',soup.get_text(' ',strip=True))
                  print('BODY',body[:15000])
                  print('SCRIPT_SNIPPETS')
                  for script in soup.find_all('script'):
                      raw=script.string or script.get_text(' ',strip=True)
                      if raw and any(k in raw.lower() for k in ['pdf','report','研报','券商','证券','author','org','researcher','download']):
                          print(raw[:8000])
              except Exception as exc:
                  print('ERROR',repr(exc))
          PY
