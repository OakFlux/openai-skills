name: Package Super Hi International broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/super-hi-broker-package-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '特海国际_09658_券商深度及研究报告_2份'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_浙商证券_特海国际_品质铸造品牌成就中餐出海第一名片_2023-04-16_深度报告.pdf',
                  'broker': '浙商证券',
                  'title': '品质铸造品牌，成就中餐出海第一名片',
                  'date': '2023-04-16',
                  'type': '公司深度报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202304171585491369_1.pdf',
                  'min_pages': 18,
                  'title_terms': ['品质铸造品牌', '中餐出海第一名片'],
                  'broker_terms': ['浙商证券'],
              },
              {
                  'filename': '02_海通国际_特海国际_让利策略致经营利润短期承压多元品牌助力新增长_2025-08-27_点评报告.pdf',
                  'broker': '海通国际',
                  'title': '让利策略致经营利润短期承压，多元品牌助力新增长',
                  'date': '2025-08-27',
                  'type': '公司点评报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202508281735801275_1.pdf',
                  'min_pages': 12,
                  'title_terms': ['让利策略', '多元品牌'],
                  'broker_terms': ['海通国际', 'HAITONG INTERNATIONAL'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download_pdf(url: str, dest: Path) -> str:
              errors = []
              for attempt in range(1, 5):
                  tmp = dest.with_suffix('.pdf.part')
                  try:
                      with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as response:
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, 'final', response.url, flush=True)
                          response.raise_for_status()
                          with tmp.open('wb') as fh:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                          final_url = response.url
                      size = tmp.stat().st_size
                      with tmp.open('rb') as fh:
                          head = fh.read(8)
                      if size < 100_000 or not head.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF size={size}, head={head!r}')
                      tmp.replace(dest)
                      return final_url
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      tmp.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records = []
          seen_hashes = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['url'], dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              text = ''
              for page in reader.pages[:min(14, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              company_ok = any(term in compact for term in ('特海国际', '特海國際', 'SuperHiInternational', 'SuperHi'))
              code_ok = any(term in compact for term in ('09658', '9658', 'HDL'))
              if not company_ok or not code_ok:
                  raise RuntimeError(f'company identity check failed for {dest.name}')
              if not any(term.replace(' ', '') in compact for term in doc['broker_terms']):
                  raise RuntimeError(f'broker identity check failed for {dest.name}')
              if not all(term.replace(' ', '') in compact for term in doc['title_terms']):
                  raise RuntimeError(f'title check failed for {dest.name}')

              qcheck = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if qcheck.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {qcheck.stderr[-1200:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)

              record = {
                  'filename': dest.name,
                  'company': '特海国际控股有限公司（09658.HK / NASDAQ: HDL）',
                  'broker': doc['broker'],
                  'title': doc['title'],
                  'report_date': doc['date'],
                  'report_type': doc['type'],
                  'pages': pages,
                  'bytes': len(data),
                  'source': '东方财富公开研报PDF镜像',
                  'source_url': final_url,
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '特海国际控股有限公司（09658.HK / NASDAQ: HDL）券商研究报告合集',
              '整理日期：2026-09-27',
              '',
              '收录说明：',
              '1. 第一份为18页浙商证券公司深度报告，是本包的核心深度材料。',
              '2. 第二份为12页海通国际完整公司点评报告，用于补充较新的经营、盈利和估值跟踪。',
              '3. 公开端可匿名取得且能够核验完整性的长篇深度报告数量有限；本包未使用网页摘要、只有前几页的预览件或无法核验的附件凑数。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['broker']}｜{record['title']}",
                  f"   类型：{record['report_type']}；日期：{record['report_date']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MiB",
                  f"   文件：{record['filename']}",
                  f"   来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司名称及证券代码、券商名称、报告标题、实际页数、qpdf结构检查、重复哈希检查及SHA-256。')

          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          if len(list(out.glob('*.pdf'))) != 2:
              raise RuntimeError('PDF count mismatch')
          print('FINAL_PACKAGE', PACKAGE, 'PDF_COUNT', len(records), 'TOTAL_BYTES', sum(r['bytes'] for r in records), flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: super-hi-broker-reports-final
          path: 特海国际_09658_券商深度及研究报告_2份/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
