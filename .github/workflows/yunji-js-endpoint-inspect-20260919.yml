name: Inspect Yunji public report JS endpoints 20260919

on:
  push:
    paths:
      - '.github/workflows/yunji-js-endpoint-inspect-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and inspect JavaScript and JSON endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          out=Path('endpoint-inspect'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          urls={
            'hangyan-js':'https://cdn.hangyan.co/assets/application-ec845e69.js',
            '9fzt-js':'https://gmg.9fzt.com/_next/static/chunks/pages/report/%5Bmarket%5D/%5Bsymbol%5D/%5Bid%5D-142396bae566cc0b.js',
            '9fzt-next-json-html':'https://gmg.9fzt.com/_next/data/IfPRq5OFqxCOvsMe-6uP1/report/HKSE/02670/829740237518.html.json',
            '9fzt-next-json-nohtml':'https://gmg.9fzt.com/_next/data/IfPRq5OFqxCOvsMe-6uP1/report/HKSE/02670/829740237518.json',
          }
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              print('\nRESPONSE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              (out/f'{name}.bin').write_bytes(r.content)
              text=r.text
              if name.endswith('js'):
                needles=['native-pdf','cacheKey','cache-key','pageNum','download','iframe','pdf','qingstor','hangyan-prod','s3','reportId','newsId','s3url','report/detail','research','api/']
                for needle in needles:
                  ms=list(re.finditer(re.escape(needle),text,re.I))
                  print('NEEDLE',name,needle,'COUNT',len(ms),flush=True)
                  for m in ms[:30]:
                    print('CTX',name,needle,repr(text[max(0,m.start()-800):m.start()+1800]),flush=True)
                # Print URL-like literals and paths likely relevant.
                strings=[]
                for pat in [r'https?://[^\"\'`\\\s]+',r'[\"\']([^\"\']*(?:pdf|report|download|cache|document|asset)[^\"\']*)[\"\']']:
                  for hit in re.findall(pat,text,re.I):
                    if isinstance(hit,tuple): hit=''.join(hit)
                    if hit and hit not in strings: strings.append(hit)
                for hit in strings[:500]: print('STRING',name,hit,flush=True)
              else:
                print('BODY',name,text[:20000],flush=True)
            except Exception as e:
              print('ERROR',name,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yunji-js-endpoint-inspect
          path: endpoint-inspect
          retention-days: 7
          if-no-files-found: error
