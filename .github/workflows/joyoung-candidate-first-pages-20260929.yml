name: Inspect Joyoung candidate report first pages 20260929

on:
  push:
    paths:
      - '.github/workflows/joyoung-candidate-first-pages-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow

      - name: Download first-page images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests, json, time
          from pathlib import Path
          from PIL import Image
          from io import BytesIO

          reports = {
              '737327_营收同比增速转正盈利能力承压': 'https://oss.sdyanbao.com/page/2024/4/18/974513/0.png',
              '840285_三季度业绩承压期待后续修复': 'https://oss.sdyanbao.com/page/2024/11/19/1119320/0.png',
              '377349_业绩低点已过看好经营改善到来': 'https://oss.sdyanbao.com/page/2023/4/3/471776/0.png',
              '361666_经营拐点将至': 'https://oss.sdyanbao.com/page/2023/3/8/448257/0.png',
          }
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://www.sdyanbao.com/'})
          manifest=[]
          for name,url in reports.items():
              last=None
              for attempt in range(5):
                  try:
                      r=s.get(url,timeout=(20,90))
                      last={'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type','')}
                      if r.status_code==200 and len(r.content)>10000:
                          with Image.open(BytesIO(r.content)) as im:
                              im.verify()
                          Path('out',name+'.png').write_bytes(r.content)
                          manifest.append({'name':name,'url':url,**last})
                          break
                  except Exception as e:
                      last={'error':repr(e)}
                  time.sleep(1+attempt)
              else:
                  manifest.append({'name':name,'url':url,'failed':last})
          Path('out/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
        env:
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: joyoung-candidate-first-pages
          path: out
          retention-days: 7
          if-no-files-found: error
