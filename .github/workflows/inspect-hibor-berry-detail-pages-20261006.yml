name: Inspect Hibor Berry detail pages

on:
  pull_request:
    paths:
      - 'tasks/inspect-hibor-berry-detail-pages-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and inspect detail pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls={
            'haitong':'https://sysbg.hibor.com.cn/data/b6836279f674f42f07de9d42efb68f4f.html',
            'changjiang':'https://sysbg.hibor.com.cn/data/6f55c864c513463af41bc24102216d00.html',
            'guoxin':'https://sysbg.hibor.com.cn/docdetail_2873987.html',
          }
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://sysbg.hibor.com.cn/'})
          out={}
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=(25,120),allow_redirects=True)
              print('PAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path(f'output/{name}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for tag in soup.find_all(['a','img','iframe','embed','object','form','input','script','button']):
                text=' '.join(tag.get_text(' ',strip=True).split())
                attrs={k:tag.get(k) for k in ('href','src','action','value','onclick','id','name','data','data-src','data-original','rel') if tag.get(k)}
                blob=(text+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in blob for k in ('pdf','download','原文','报告','image','page','viewer','file','docid','repinfo','scan','view')):
                  norm={k:(urljoin(r.url,v) if k in ('href','src','action','data','data-src','data-original') and isinstance(v,str) else v) for k,v in attrs.items()}
                  links.append({'tag':tag.name,'text':text[:500],'attrs':norm})
              rawurls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',r.text)))
              tokens=[]
              for m in re.finditer(r'.{0,300}(?:\.pdf|download|fileurl|filepath|docid|pageimage|original|报告原文|打开报告原文|viewer|repinfo).{0,600}',r.text,flags=re.I|re.S):
                tokens.append(re.sub(r'\s+',' ',m.group(0))[:1500])
              d={'source_url':url,'final_url':r.url,'status':r.status_code,'length':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links,'raw_urls':[u for u in rawurls if any(x in u.lower() for x in ('pdf','image','img','file','download','report','repinfo','scan','view'))][:1000], 'tokens':tokens[:300]}
              out[name]=d
              print('META',name,json.dumps(d,ensure_ascii=False)[:100000],flush=True)
            except Exception as e:
              out[name]={'source_url':url,'error':repr(e)};print('ERROR',name,repr(e),flush=True)
          Path('output/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hibor-berry-detail-inspection
          path: output/
          retention-days: 7
          if-no-files-found: error
