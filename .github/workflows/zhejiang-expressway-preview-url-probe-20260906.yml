name: Probe Zhejiang Expressway public preview URLs 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-preview-url-probe-20260906.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe exact public images
        shell: bash
        run: |
          set -u
          urls=(
            'https://oss.sdyanbao.com/page/2025/5/7/1192234/0.png'
            'https://oss.sdyanbao.com/page/2025/5/7/1192234/9.png'
            'https://public.fxbaogao.com/report-image/2026/04/09/5345667-1.png'
            'https://public.fxbaogao.com/report-image/2026/04/09/5345667-2.png'
            'https://public.fxbaogao.com/report-image/2026/06/25/5494602-1.png'
            'https://public.fxbaogao.com/report-image/2026/06/25/5494602-2.png'
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "=== $i $u ==="
            curl -L --connect-timeout 10 --max-time 25 -A 'Mozilla/5.0 Chrome/151 Safari/537.36' -e 'https://www.fxbaogao.com/' -D "headers_$i.txt" -o "file_$i.bin" -w 'http=%{http_code} bytes=%{size_download} type=%{content_type} final=%{url_effective}\n' "$u" || true
            file "file_$i.bin" || true
            head -c 16 "file_$i.bin" | xxd || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-preview-url-probe
          path: |
            headers_*.txt
            file_*.bin
          retention-days: 7
