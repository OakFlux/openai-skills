name: chatgpt-temp-avic-sdy-content-query
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-avic-sdy-content-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public full-text report index
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json
          import requests
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Content-Type':'application/json','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          queries=['港股唯一航空高科技产业集团','行稳致远迈向世界一流','航空高科技旗舰平台','产业整合助力企业发展','中航科工 首次覆盖']
          for keyword in queries:
            for only in [0,1]:
              body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':keyword,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              r=s.post('https://api.sdyanbao.com/api/file/search',json=body,timeout=90)
              print('QUERY',keyword,'onlyTitle',only,'HTTP',r.status_code,'bytes',len(r.content),flush=True)
              try:o=r.json()
              except Exception:o={}
              files=(o.get('data') or {}).get('files') or []
              print('COUNT',len(files),flush=True)
              for x in files[:50]:
                print('REC',json.dumps({k:x.get(k) for k in ['id','name','share_url','page_url','page_count','original_id','time_text','file_size','data_source_uuid','summary','organization','type','stock']},ensure_ascii=False),flush=True)
          PY
