name: Query 2021 Huabao International company deep report

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-2021-company-deep-query.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query exact report title
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          api='https://api.sdyanbao.com/api/file/search'
          phrases=['香精、薄片壁垒明显，新型烟草蓄势待发','香精 薄片壁垒明显 新型烟草蓄势待发','华宝国际深度报告 香精 薄片','华宝国际 浙商证券 2021']
          found={}
          for phrase in phrases:
            for only in (1,0):
              body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':phrase,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              req=urllib.request.Request(api,data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
              try:
                with urllib.request.urlopen(req,timeout=50) as r: payload=json.loads(r.read().decode())
                rows=(payload.get('data') or {}).get('files') or []
                print('QUERY',repr(phrase),only,'ROWS',len(rows),'TOTAL',(payload.get('data') or {}).get('total'),flush=True)
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False).replace(' ','')
                  if ('华宝国际' in blob or '00336' in blob) and ('薄片' in blob or '新型烟草' in blob or '香精' in blob):
                    found[str(x.get('id'))]=x
              except Exception as e: print('FAIL',repr(phrase),only,repr(e),flush=True)
          compact=[]
          for x in found.values():
            compact.append({'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),'page_url':x.get('page_url'),'share_url':x.get('share_url'),'organization':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),'type':(x.get('type') or {}).get('name'),'stock':x.get('stock'),'data_source':x.get('data_source'),'data_source_uuid':x.get('data_source_uuid')})
          print('RESULTS',json.dumps(compact,ensure_ascii=False,indent=2),flush=True)
          Path('out/results.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-2021-company-deep-query
          path: out/
          retention-days: 3
          if-no-files-found: error
