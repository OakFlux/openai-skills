name: Build Xingqi Eye Medicine 300573 broker deep reports 20261015

on:
  push:
    paths:
      - '.github/workflows/xingqi-300573-broker-deep-reports-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          package = '兴齐眼药_300573_券商深度报告_2份_公开完整PDF'
          root = Path('package_root')
          root.mkdir(exist_ok=True)
          previews = root / '首页预览'
          previews.mkdir(exist_ok=True)
          artifact_dir = Path('artifact_out')
          artifact_dir.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '东吴证券',
                  'date': '2022-06-16',
                  'analysts': '朱国广',
                  'rating': '买入（首次覆盖）',
                  'title': '兴齐眼药：眼科药物龙头，先发优势明显',
                  'info_code': 'AP202206161572470946',
                  'filename': '01_东吴证券_兴齐眼药_眼科药物龙头先发优势明显_2022-06-16.pdf',
                  'min_pages': 20,
                  'terms': ['兴齐眼药', '眼科药物龙头', '先发优势明显', '低浓度阿托品', '环孢素'],
              },
              {
                  'broker': '华安证券',
                  'date': '2022-03-06',
                  'analysts': '谭国超',
                  'rating': '买入（首次覆盖）',
                  'title': '创新眼药龙头崛起，重磅新品大放异彩',
                  'info_code': 'AP202203061550990005',
                  'filename': '02_华安证券_兴齐眼药_创新眼药龙头崛起重磅新品大放异彩_2022-03-06.pdf',
                  'min_pages': 20,
                  'terms': ['兴齐眼药', '创新眼药龙头', '重磅新品', '阿托品滴眼液', '环孢素滴眼液'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(info_code: str) -> tuple[bytes, str]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last = None
              for url in urls:
                  for attempt in range(1, 7):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 240),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': f'https://data.eastmoney.com/report/info/{info_code}.html',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                          }
                          if response.status_code == 200 and response.content.startswith(b'%PDF-') and len(response.content) > 100_000:
                              return response.content, str(response.url)
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          manifest = []
          for index, report in enumerate(reports, 1):
              data, resolved_url = download_pdf(report['info_code'])
              destination = root / report['filename']
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'Too few pages: {destination.name}: {pages}')

              extracted_parts = []
              for page in reader.pages[:min(15, pages)]:
                  try:
                      extracted_parts.append(page.extract_text() or '')
                  except Exception:
                      pass
              text = re.sub(r'\s+', '', '\n'.join(extracted_parts))
              if not any(token in text for token in ['兴齐眼药', '300573', '沈阳兴齐眼药']):
                  raise RuntimeError(f'Issuer identity check failed: {destination.name}')
              matched_terms = [term for term in report['terms'] if re.sub(r'\s+', '', term) in text]
              if len(matched_terms) < 2:
                  raise RuntimeError(f'Title/topic keyword check failed: {destination.name}: {matched_terms}')

              qpdf = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf check failed: {destination.name}: {qpdf.stdout[-1000:]}')

              first_prefix = previews / f'{index:02d}_first'
              last_prefix = previews / f'{index:02d}_last'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(first_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              subprocess.run(
                  ['pdftoppm', '-f', str(pages), '-l', str(pages), '-png', '-r', '100', '-singlefile', str(destination), str(last_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              first_png = Path(str(first_prefix) + '.png')
              last_png = Path(str(last_prefix) + '.png')
              if not first_png.exists() or first_png.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page render failed: {destination.name}')
              if not last_png.exists() or last_png.stat().st_size < 3_000:
                  raise RuntimeError(f'Last-page render failed: {destination.name}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **report,
                  'source_report_page': f"https://data.eastmoney.com/report/info/{report['info_code']}.html",
                  'pdf_url': resolved_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'matched_terms': matched_terms,
                  'document_nature': '券商原始完整PDF',
                  'validation': [
                      'PDF header', 'issuer identity', 'topic keywords', 'minimum page count',
                      'qpdf structure', 'first-page render', 'last-page render'
                  ],
              })
              print('VALIDATED', json.dumps(manifest[-1], ensure_ascii=False), flush=True)

          if len({item['sha256'] for item in manifest}) != len(manifest):
              raise RuntimeError('Duplicate PDF content detected')

          readme = [
              '沈阳兴齐眼药股份有限公司（300573.SZ）券商深度报告资料包',
              '整理日期：2026-10-15',
              '',
              '本包收录2份公开可完整取得、内容篇幅较长的兴齐眼药公司专属券商深度/首次覆盖报告。',
              '未使用同业报告、网页摘要、付费预览、缺页文件或短篇财报点评补足数量。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme.extend([
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；分析师：{item['analysts']}；评级：{item['rating']}",
                  f"   完整页数：{item['pages']}页；文件：{item['filename']}",
                  f"   来源页面：{item['source_report_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ])
          readme.extend([
              '报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、主题关键词、页数、qpdf结构、首页与末页渲染、ZIP CRC及SHA-256。',
          ])

          (root / '00_文件清单与筛选口径.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_path = artifact_dir / f'{package}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(root.iterdir()):
                  if path.is_file():
                      archive.write(path, arcname=path.name)
              for path in sorted(previews.iterdir()):
                  if path.is_file():
                      archive.write(path, arcname=str(Path('首页预览') / path.name))

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad_member = archive.testzip()
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_member or len(pdf_names) != 2:
                  raise RuntimeError(f'ZIP validation failed: bad={bad_member}, pdf_count={len(pdf_names)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xingqi-300573-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
