name: Temporary Greentown Eastmoney probe

on:
  push:
    branches:
      - task-artifacts-20260828-01

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe report API variants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 <<'PY'
          import json
          import requests
          from pathlib import Path

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/stock.jshtml'})
          url='https://reportapi.eastmoney.com/report/list'
          results=[]
          variants=[]
          for code in ['03900','3900','HK03900','3900.HK']:
              for qtype in ['0','1','2','3']:
                  variants.append((code,qtype))
          for code,qtype in variants:
              params={'code':code,'beginTime':'20200101','endTime':'20261231','qType':qtype,'pageSize':'5000','pageNo':'1','industryCode':'*','industry':'*','rating':'*','ratingChange':'*'}
              try:
                  r=s.get(url,params=params,timeout=60)
                  print('\nVARIANT',code,qtype,'status',r.status_code,'url',r.url)
                  print(r.text[:1000])
                  item={'code':code,'qType':qtype,'status':r.status_code,'url':r.url,'text':r.text[:10000]}
                  if r.status_code==200:
                      try:
                          data=r.json(); item['json']=data
                          rows=data.get('data') or []
                          print('rows',len(rows))
                          for row in rows[:100]: print(row.get('publishDate'),row.get('orgSName'),row.get('attachPages'),row.get('title'),row.get('infoCode'))
                      except Exception as e: print('json error',e)
                  results.append(item)
              except Exception as e:
                  print('ERROR',code,qtype,e); results.append({'code':code,'qType':qtype,'error':str(e)})
          (out/'eastmoney_probe.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: greentown-eastmoney-probe
          path: output/eastmoney_probe.json
          if-no-files-found: error
          retention-days: 1
