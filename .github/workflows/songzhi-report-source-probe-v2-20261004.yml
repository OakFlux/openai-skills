name: Probe Songzhi deep report source URLs v2 20261004

on:
  push:
    paths:
      - '.github/workflows/songzhi-report-source-probe-v2-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Probe report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          from urllib.parse import urljoin

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          pages = [
              'https://www.9fzt.com/detail/sz_002454_10_575560525768.html',
              'https://www.9fzt.com/detail/sz_002454_10_574852966244.html',
              'https://www.9fzt.com/detail/sz_002454_10_573563348274.html',
              'https://www.9fzt.com/detail/sz_002454_10_565000369212.html',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/575560525768/index.phtml',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/574852966244/index.phtml',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/573563348274/index.phtml',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/565000369212/index.phtml',
          ]

          for url in pages:
              response = session.get(url, timeout=60)
              print('\nPAGE', response.status_code, len(response.content), response.url, flush=True)
              print('CONTENT_TYPE', response.headers.get('content-type'), flush=True)
              encoding = response.apparent_encoding or 'utf-8'
              text = response.content.decode(encoding, errors='replace')
              for line in text.splitlines():
                  low = line.lower()
                  if any(key in low for key in ['.pdf', 'download', 'attach', 'rptid', 'report', '575560525768', '574852966244', '573563348274', '565000369212']):
                      print('LINE', line[:2000], flush=True)
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, flags=re.I):
                  print('SCRIPT', urljoin(response.url, src), flush=True)
              for href in re.findall(r'href=["\']([^"\']+)', text, flags=re.I):
                  if any(key in href.lower() for key in ['pdf', 'download', 'report', 'attach']):
                      print('HREF', urljoin(response.url, href), flush=True)
          PY
