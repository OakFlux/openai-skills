name: Discover Sun Art Retail 06808 report links 20260922

on:
  push:
    paths:
      - '.github/workflows/sunartretail-06808-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Discover official report links and probe candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
          })

          pages = [
              'https://www.sunartretail.com/en/ir/reports.php',
              'https://www.sunartretail.com/en/ir/prospectus.php',
              'https://www.irasia.com/listco/hk/sunartretail/annual/index.htm',
              'https://www.irasia.com/listco/hk/sunartretail/interim/index.htm',
              'https://www.irasia.com/listco/hk/sunartretail/listingdoc/index.htm',
          ]
          output = {'pages': [], 'probes': []}
          discovered = []
          for page in pages:
              try:
                  r = session.get(page, timeout=(20, 60), allow_redirects=True)
                  item = {'url': page, 'status': r.status_code, 'final_url': r.url, 'content_type': r.headers.get('content-type'), 'length': len(r.content), 'anchors': [], 'attrs': []}
                  soup = BeautifulSoup(r.content, 'lxml')
                  for a in soup.find_all('a'):
                      text = ' '.join(a.get_text(' ', strip=True).split())
                      href = a.get('href')
                      attrs = {k: v for k, v in a.attrs.items() if k not in ('class','style')}
                      parent_text = ' '.join((a.parent.get_text(' ', strip=True) if a.parent else '').split())[:500]
                      if href or text or any(k.startswith('data') or k == 'onclick' for k in attrs):
                          rec = {'text': text, 'href': urljoin(r.url, href) if href else None, 'raw_href': href, 'attrs': attrs, 'parent_text': parent_text}
                          item['anchors'].append(rec)
                          blob = json.dumps(rec, ensure_ascii=False)
                          if any(x.lower() in blob.lower() for x in ['annual report','interim report','global offering','supplemental prospectus','ar202','ir202','prospectus','sunartretail']):
                              discovered.append(rec)
                  for tag in soup.find_all(True):
                      attrs = {k: v for k, v in tag.attrs.items() if k.startswith('data') or k in ('onclick','src')}
                      if attrs:
                          blob = json.dumps(attrs, ensure_ascii=False)
                          if any(x in blob.lower() for x in ['pdf','annual','interim','prospect','ar202','ir202','irasia']):
                              item['attrs'].append({'tag': tag.name, 'attrs': attrs, 'text': ' '.join(tag.get_text(' ', strip=True).split())[:300]})
                  item['html_head'] = r.text[:3000]
                  output['pages'].append(item)
              except Exception as exc:
                  output['pages'].append({'url': page, 'error': repr(exc)})

          candidates = []
          for rec in discovered:
              for val in [rec.get('href'), rec.get('raw_href')]:
                  if val and isinstance(val, str):
                      candidates.append(val)
              for v in (rec.get('attrs') or {}).values():
                  if isinstance(v, str):
                      candidates.extend(re.findall(r'https?://[^\s\"\'<>]+', v))
          for year in [2025, 2024, 2023, 2022, 2021, 2020, 2019]:
              candidates += [
                  f'https://doc.irasia.com/listco/hk/sunartretail/annual/{year}/ar{year}.pdf',
                  f'https://doc.irasia.com/listco/hk/sunartretail/annual/{year}/annualreport.pdf',
              ]
          for year in [2026, 2025]:
              for name in ['intrep.pdf','ir.pdf','interim.pdf','interimreport.pdf']:
                  candidates.append(f'https://doc.irasia.com/listco/hk/sunartretail/interim/{year}/{name}')
          candidates += [
              'https://doc.irasia.com/listco/hk/sunartretail/listingdoc/l110704.pdf',
              'https://doc.irasia.com/listco/hk/sunartretail/listingdoc/l110718.pdf',
              'https://doc.irasia.com/listco/hk/sunartretail/listingdoc/prospectus.pdf',
              'https://doc.irasia.com/listco/hk/sunartretail/listingdoc/supplementalprospectus.pdf',
          ]

          normalized = []
          for url in candidates:
              if not isinstance(url, str):
                  continue
              url = url.replace('&amp;', '&')
              if url.startswith('//'):
                  url = 'https:' + url
              if url.startswith('/'):
                  url = urljoin('https://www.irasia.com/', url)
              if 'redirect.cgi?' in url:
                  q = parse_qs(urlparse(url).query)
                  if q.get('url'):
                      normalized.append(unquote(q['url'][0]))
              normalized.append(url)
          seen = set()
          normalized = [u for u in normalized if u.startswith('http') and not (u in seen or seen.add(u))]

          for url in normalized:
              rec = {'url': url}
              try:
                  headers = {'Range': 'bytes=0-65535', 'Accept': 'application/pdf,*/*;q=0.8'}
                  with session.get(url, headers=headers, timeout=(20, 60), allow_redirects=True, stream=True) as r:
                      chunk = next(r.iter_content(chunk_size=65536), b'')
                      rec.update({
                          'status': r.status_code,
                          'final_url': r.url,
                          'content_type': r.headers.get('content-type'),
                          'content_length': r.headers.get('content-length'),
                          'content_range': r.headers.get('content-range'),
                          'head_hex': chunk[:32].hex(),
                          'head_ascii': chunk[:200].decode('latin1', 'replace'),
                          'is_pdf': chunk.startswith(b'%PDF-'),
                      })
                      if not rec['is_pdf'] and chunk:
                          text = chunk.decode('utf-8', 'replace')
                          rec['html_excerpt'] = text[:3000]
                          rec['embedded_urls'] = re.findall(r'https?://[^\s\"\'<>]+', text)[:30]
              except Exception as exc:
                  rec['error'] = repr(exc)
              output['probes'].append(rec)

          Path('sunartretail_discovery.json').write_text(json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'page_count': len(output['pages']), 'probe_count': len(output['probes']), 'pdf_hits': [p for p in output['probes'] if p.get('is_pdf')]}, ensure_ascii=False, indent=2))
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: sunartretail-06808-discovery
          path: sunartretail_discovery.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
