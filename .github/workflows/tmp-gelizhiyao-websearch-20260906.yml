name: Temporary Ascletis public PDF web search

on:
  push:
    branches:
      - tmp-gelizhiyao-websearch-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search public indexes and probe candidate files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 pypdf
          python - <<'PY'
          from __future__ import annotations
          import io, json, re, time
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          out=Path('output'); out.mkdir(exist_ok=True)
          queries=[
            '"全新GLP-1减重不减肌，有潜力成为Best-in-Class" pdf',
            '"口服小分子率先破局，紧跟减重前沿" pdf',
            '"聚焦减重代谢产品差异化管线" pdf',
            '"歌礼制药-B" "首次覆盖" pdf',
            '"歌礼制药" "公司深度报告" pdf',
            '"歌礼制药" 东吴证券 2025 19页 pdf',
            '"歌礼制药" 东方证券 2025 首次覆盖 pdf',
          ]
          engines={
            'bing': lambda q: 'https://www.bing.com/search?q='+quote(q)+'&count=50',
            'duckduckgo': lambda q: 'https://html.duckduckgo.com/html/?q='+quote(q),
            'baidu': lambda q: 'https://www.baidu.com/s?wd='+quote(q)+'&rn=50',
            'sogou': lambda q: 'https://www.sogou.com/web?query='+quote(q)+'&num=50',
            'so360': lambda q: 'https://www.so.com/s?q='+quote(q),
          }
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          })
          search_results=[]; urls={}
          skip_hosts={'bing.com','www.bing.com','baidu.com','www.baidu.com','sogou.com','www.sogou.com','so.com','www.so.com','duckduckgo.com','html.duckduckgo.com'}
          for query in queries:
            for engine,builder in engines.items():
              url=builder(query)
              try:
                r=s.get(url,timeout=90,allow_redirects=True)
                soup=BeautifulSoup(r.text,'html.parser')
                found=[]
                for a in soup.find_all('a',href=True):
                  href=a.get('href') or ''
                  text=' '.join(a.get_text(' ',strip=True).split())
                  if href.startswith('//'): href='https:'+href
                  if href.startswith('/'): href=urljoin(r.url,href)
                  # Unwrap common DDG redirect.
                  if 'duckduckgo.com/l/?' in href:
                    qs=parse_qs(urlparse(href).query)
                    href=(qs.get('uddg') or [href])[0]
                  if not href.startswith('http'): continue
                  host=urlparse(href).netloc.lower()
                  if host in skip_hosts: continue
                  rec={'query':query,'engine':engine,'href':href,'text':text[:1000]}
                  found.append(rec)
                  urls.setdefault(href,rec)
                search_results.append({'query':query,'engine':engine,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'found':found})
                print('SEARCH',engine,query,r.status_code,len(r.content),'links',len(found),flush=True)
              except Exception as exc:
                search_results.append({'query':query,'engine':engine,'url':url,'error':repr(exc)})
                print('SEARCH_ERR',engine,query,repr(exc),flush=True)
              time.sleep(0.1)

          probes=[]
          for index,(url,meta) in enumerate(list(urls.items())[:1000],1):
            low=url.lower()
            text=(meta.get('text') or '').lower()
            likely=any(token in low or token in text for token in ['歌礼','ascletis','pdf','report','研报','报告','glp-1','asc30','01672'])
            if not likely: continue
            try:
              rr=s.get(url,timeout=(20,120),allow_redirects=True,headers={'Referer':'https://www.bing.com/','Accept':'application/pdf,text/html,*/*'})
              data=rr.content
              row={**meta,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
              if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                row['is_pdf']=True; row['pages']=pages
                filename=f'candidate_{len([x for x in probes if x.get("is_pdf")])+1}_{Path(urlparse(rr.url).path).name or "report.pdf"}'
                if not filename.lower().endswith('.pdf'): filename += '.pdf'
                filename=re.sub(r'[\\/:*?"<>|\r\n]+','_',filename)[:220]
                (out/filename).write_bytes(data)
                row['saved']=filename
                print('PDF_OK',pages,len(data),rr.url,flush=True)
              else:
                row['is_pdf']=False
                if 'html' in (rr.headers.get('content-type') or '').lower() or data.lstrip().startswith(b'<'):
                  html=data.decode(rr.encoding or 'utf-8','replace')
                  row['title']=BeautifulSoup(html,'html.parser').title.get_text(' ',strip=True) if BeautifulSoup(html,'html.parser').title else None
                  row['pdf_urls']=sorted(set(re.findall(r'https?://[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',html,re.I)))[:200]
              probes.append(row)
              print('PROBE',index,rr.status_code,len(data),rr.headers.get('content-type'),rr.url,flush=True)
            except Exception as exc:
              probes.append({**meta,'error':repr(exc)})
              print('PROBE_ERR',url,repr(exc),flush=True)

          # Probe any explicit PDF URLs found inside candidate HTML pages.
          inner_urls={}
          for row in probes:
            for url in row.get('pdf_urls') or []:
              inner_urls[url]=row
          inner=[]
          for url,parent in inner_urls.items():
            try:
              rr=s.get(url,timeout=(20,180),allow_redirects=True,headers={'Referer':parent.get('final_url') or parent.get('href') or 'https://www.bing.com/','Accept':'application/pdf,*/*'})
              data=rr.content
              item={'url':url,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
              if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                item['is_pdf']=True; item['pages']=pages
                filename=f'inner_{len(inner)+1}_{Path(urlparse(rr.url).path).name or "report.pdf"}'
                if not filename.lower().endswith('.pdf'): filename += '.pdf'
                filename=re.sub(r'[\\/:*?"<>|\r\n]+','_',filename)[:220]
                (out/filename).write_bytes(data); item['saved']=filename
                print('INNER_PDF_OK',pages,len(data),rr.url,flush=True)
              inner.append(item)
            except Exception as exc:
              inner.append({'url':url,'error':repr(exc)})

          (out/'search_results.json').write_text(json.dumps(search_results,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'inner.json').write_text(json.dumps(inner,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_URLS',len(urls),'PROBES',len(probes),'PDFS',sum(1 for x in probes+inner if x.get('is_pdf')),flush=True)
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: gelizhiyiao-public-websearch
          path: output/*
          retention-days: 1
          if-no-files-found: error
