name: Global Top Report Attachment Details

on:
  push:
    branches:
      - chatgpt-globaltop-reports-20260929
    paths:
      - .github/workflows/globaltop_report_details_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Inspect attachment metadata and PDF availability
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import io, json
          from urllib.parse import urlencode
          import requests
          from pypdf import PdfReader

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          params={'pageSize':'100','pageNo':'1','qType':'0','code':'002640','beginTime':'2010-01-01','endTime':'2026-09-29','fields':'','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':''}
          api='https://reportapi.eastmoney.com/report/list?'+urlencode(params)
          r=s.get(api,headers={'Referer':'https://data.eastmoney.com/report/002640.html'},timeout=60)
          r.raise_for_status()
          obj=r.json()
          rows=obj.get('data') or []
          if isinstance(rows,dict): rows=rows.get('data') or rows.get('list') or []
          result=[]
          for row in rows:
            info=str(row.get('infoCode') or '')
            rec={k:row.get(k) for k in ('infoCode','title','orgSName','orgName','publishDate','attachPages','attachSize','attachType','encodeUrl','researcher','emRatingName','reportType')}
            candidates=[]
            if row.get('encodeUrl'):
              u=str(row['encodeUrl'])
              if u.startswith('//'): u='https:'+u
              elif u.startswith('/'): u='https://data.eastmoney.com'+u
              candidates.append(u)
            if info:
              candidates += [
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{info}',
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.PDF',
              ]
            seen=[]
            for u in candidates:
              if u not in seen: seen.append(u)
            tests=[]
            for u in seen:
              try:
                rr=s.get(u,headers={'Referer':f'https://data.eastmoney.com/report/info/{info}.html'},timeout=90,allow_redirects=True)
                t={'url':u,'status':rr.status_code,'final_url':rr.url,'bytes':len(rr.content),'content_type':rr.headers.get('content-type'),'head':repr(rr.content[:12])}
                if rr.status_code==200 and rr.content.startswith(b'%PDF-'):
                  try:
                    reader=PdfReader(io.BytesIO(rr.content))
                    t['pdf_pages']=len(reader.pages); t['encrypted']=reader.is_encrypted
                  except Exception as exc: t['pdf_error']=repr(exc)
                tests.append(t)
                if t.get('pdf_pages'): break
              except Exception as exc:
                tests.append({'url':u,'error':repr(exc)})
            rec['tests']=tests
            result.append(rec)
          result.sort(key=lambda x:(int(x.get('attachPages') or 0),str(x.get('publishDate') or '')),reverse=True)
          with open('output/report_details.json','w',encoding='utf-8') as f: json.dump(result,f,ensure_ascii=False,indent=2)
          with open('output/report_details.txt','w',encoding='utf-8') as f:
            for i,x in enumerate(result,1):
              f.write(f"{i}. {x.get('publishDate')} | {x.get('orgSName')} | {x.get('title')} | API pages={x.get('attachPages')} size={x.get('attachSize')} | tests={x.get('tests')}\n")
          print(json.dumps([{'title':x.get('title'),'broker':x.get('orgSName'),'date':x.get('publishDate'),'attachPages':x.get('attachPages'),'pdf_pages':next((t.get('pdf_pages') for t in x['tests'] if t.get('pdf_pages')),None),'infoCode':x.get('infoCode')} for x in result],ensure_ascii=False,indent=2))
          PY

      - name: Upload report details
        uses: actions/upload-artifact@v4
        with:
          name: globaltop-report-details
          path: output/
          retention-days: 1
