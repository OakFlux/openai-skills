name: Check public report endpoints
on:
  push:
    branches:
      - tmp-vzkoo-feihe-inspect-20260905
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check unauthenticated public endpoints
        run: |
          python -m pip install requests beautifulsoup4
          cat > /tmp/check.py <<'PY'
          import json,hashlib
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          out=Path('check'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://www.sgpjbg.com/baogao/653776.html',
            'https://www.sgpjbg.com/bgdown/653776.html',
            'https://www.sgpjbg.com/bgdown/653776.html?dtype=0',
            'https://www.vzkoo.com/document/20250520e932068b8353e855f6b42f49.html?from=report',
            'https://www.hangyan.co/reports/2981880365326534329',
          ]
          rec=[]
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              ct=r.headers.get('content-type','')
              item={'url':u,'final':r.url,'status':r.status_code,'content_type':ct,'size':len(r.content),'history':[{'status':x.status_code,'url':x.url,'location':x.headers.get('location')} for x in r.history]}
              print('\nURL',u,'STATUS',r.status_code,'FINAL',r.url,'CT',ct,'SIZE',len(r.content),'HIST',item['history'])
              if r.content.lstrip().startswith(b'%PDF'):
                p=out/f'{i}.pdf'; p.write_bytes(r.content); item['sha256']=hashlib.sha256(r.content).hexdigest(); print('PDF',p,item['sha256'])
              else:
                p=out/f'{i}.html'; p.write_bytes(r.content)
                soup=BeautifulSoup(r.text,'html.parser')
                item['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                item['body_excerpt']=soup.get_text(' ',strip=True)[:3000]
                item['links']=[]
                for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href']); label=a.get_text(' ',strip=True)
                  if any(k in (href+' '+label).lower() for k in ['download','bgdown','pdf','报告','完整']):
                    item['links'].append({'label':label[:200],'href':href})
                print('TITLE',item['title'])
                print('BODY',item['body_excerpt'][:1000])
                for x in item['links'][:50]: print('LINK',x)
              rec.append(item)
            except Exception as e:
              print('ERROR',u,repr(e)); rec.append({'url':u,'error':repr(e)})
          (out/'result.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-report-endpoint-check
          path: check
          retention-days: 1
