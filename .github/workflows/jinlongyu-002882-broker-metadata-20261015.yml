name: Inspect Jinlongyu broker reports 20261015
on:
  push:
    paths:
      - '.triggers/jinlongyu-002882-broker-metadata-20261015.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query paginated public research metadata
        run: |
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
          ep='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          seen={}
          for page in range(1,31):
            body={'stockCodes':['002882'],'pageIndex':page,'pageSize':100,'order':1}
            r=s.post(ep,json=body,timeout=60,headers={'Content-Type':'application/json'})
            print('QUERY',page,r.status_code,len(r.content),r.text[:200],flush=True)
            if r.status_code!=200: break
            j=r.json(); rows=((j.get('data') or {}).get('dataList') or [])
            print('COUNT',page,len(rows),flush=True)
            if not rows: break
            for row in rows:
              did=str(row.get('docId') or '')
              if did: seen[did]=row
            if len(rows)<20: break
          print('TOTAL',len(seen),flush=True)
          for row in sorted(seen.values(),key=lambda x:int(x.get('pubTime') or 0),reverse=True):
            if row.get('docType')==1 or row.get('reportType')==11:
              print('BROKER_ROW',json.dumps(row,ensure_ascii=False),flush=True)
          PY
