name: Inspect Jinlongyu broker reports 20261015

on:
  push:
    paths:
      - '.triggers/jinlongyu-002882-broker-metadata-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Paginate public research metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json,*/*'})
          endpoint='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          queries=[
            {'stockCodes':['002882']},
            {'keywords':'金龙羽'},
            {'keywords':'金龙羽 固态电池'},
            {'keywords':'金龙羽 电线电缆'},
          ]
          seen={}
          for qi,base in enumerate(queries,1):
            for page in range(1,31):
              body={**base,'pageNum':page,'pageSize':100,'order':1}
              r=s.post(endpoint,json=body,timeout=(15,60),headers={'Content-Type':'application/json'})
              print('QUERY',qi,page,r.status_code,len(r.content),flush=True)
              if r.status_code!=200:
                break
              rows=((r.json().get('data') or {}).get('dataList') or [])
              print('COUNT',qi,page,len(rows),flush=True)
              if not rows:
                break
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if '002882' not in blob and '金龙羽' not in blob:
                  continue
                did=str(row.get('docId') or '')
                if did:
                  seen[did]=row
              if len(rows)<20:
                break
          print('TOTAL_UNIQUE',len(seen),flush=True)
          ordered=sorted(seen.values(),key=lambda x:(str(x.get('pubTimeStr') or ''),int(x.get('pageNum') or 0)),reverse=True)
          for row in ordered:
            if row.get('docType')==1 or row.get('reportType')==11:
              print('BROKER_ROW',json.dumps(row,ensure_ascii=False),flush=True)
          PY
