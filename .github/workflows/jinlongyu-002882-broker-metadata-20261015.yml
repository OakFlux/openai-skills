name: Inspect Jinlongyu broker reports 20261015

on:
  push:
    paths:
      - '.triggers/jinlongyu-002882-broker-metadata-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query public research metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,*/*'})
          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2026-10-15','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'002882','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(15,60))
          print('EM_GET',r.status_code,len(r.content),r.url,flush=True)
          if r.status_code==200:
            rows=r.json().get('data') or []
            print('EM_COUNT',len(rows),flush=True)
            for row in rows:
              print('EM_ROW',json.dumps(row,ensure_ascii=False),flush=True)

          fx='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          for i,body in enumerate([
            {'stockCodes':['002882'],'pageNum':1,'pageSize':100,'order':1},
            {'keywords':'金龙羽','pageNum':1,'pageSize':100,'order':1},
            {'keywords':'固态电池 金龙羽','pageNum':1,'pageSize':100,'order':1},
          ],1):
            r=s.post(fx,json=body,timeout=(15,60),headers={'Content-Type':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
            print('FX',i,r.status_code,len(r.content),flush=True)
            if r.status_code==200:
              rows=((r.json().get('data') or {}).get('dataList') or [])
              print('FX_COUNT',i,len(rows),flush=True)
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if '002882' in blob or '金龙羽' in blob:
                  print('FX_ROW',json.dumps(row,ensure_ascii=False),flush=True)
          PY
