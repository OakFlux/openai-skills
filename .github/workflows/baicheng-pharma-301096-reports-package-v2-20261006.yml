name: Build corrected Baicheng Pharma 301096 reports package 20261006

on:
  push:
    paths:
      - '.github/workflows/baicheng-pharma-301096-reports-package-v2-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Run corrected packaging script
        shell: bash
        run: |
          set -euo pipefail
          SRC='.github/workflows/baicheng-pharma-301096-reports-package-20261006.yml'
          awk 'BEGIN{f=0} /python - <<'\''PY'\''/{f=1;next} f && /^          PY$/{exit} f{sub(/^          /,""); print}' "$SRC" > /tmp/build_baicheng.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/build_baicheng.py')
          text = path.read_text(encoding='utf-8')

          old = "if ('第一季度报告' in title or '第三季度报告' in title) and not any(key in title for key in ['摘要', '英文版', '更正公告']):"
          new = "if any(key in title for key in ['第一季度报告', '第三季度报告', '一季度报告', '三季度报告', '第一季度报告全文', '第三季度报告全文']) and not any(key in title for key in ['摘要', '英文版', '更正公告']):"
          if old not in text:
              raise SystemExit('quarter selection pattern not found')
          text = text.replace(old, new, 1)

          old2 = "quarter = 3 if '第三季度报告' in title else 1"
          new2 = "quarter = 3 if ('第三季度报告' in title or '三季度报告' in title) else 1"
          if old2 not in text:
              raise SystemExit('quarter ranking pattern not found')
          text = text.replace(old2, new2, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python /tmp/build_baicheng.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: baicheng-pharma-301096-reports-final-corrected
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
