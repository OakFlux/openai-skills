name: Recover exact 51pdf Makeng report

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-51pdf-target-recovery-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Fetch exact detail and probe download endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import io, json, re, requests, socket
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse, quote
          from pypdf import PdfReader
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          detail='https://www.51pdf.cn/report/view_5953271.html'
          r=s.get(detail,timeout=60,allow_redirects=True)
          print('DETAIL',r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.cookies.get_dict(),flush=True)
          Path('out/detail.html').write_bytes(r.content)
          text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
          soup=BeautifulSoup(text,'html.parser')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
          tokens=[]; candidates=[]; scripts=[]
          for tag in soup.find_all(['a','script','iframe','embed','object','form','input','button']):
              attrs={k:tag.get(k) for k in ('href','src','data','action','onclick','value','name','id','class','type') if tag.get(k) is not None}
              label=' '.join(tag.get_text(' ',strip=True).split())[:500]
              for k in ('href','src','data','action'):
                  if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
              if tag.name=='script' and attrs.get('src'): scripts.append(attrs['src'])
              dump=json.dumps(attrs,ensure_ascii=False)
              raw=(label+' '+dump)
              if any(q in raw.lower() for q in ('download','downfile','rnd=','.pdf','file','5953271')):
                  print('TAG',tag.name,dump,label,flush=True)
              for m in re.finditer(r'''downfile\s*\(\s*["']([^"']+)["']''',raw,re.I): tokens.append(m.group(1))
              for k in ('href','src','data','action'):
                  v=attrs.get(k)
                  if v and any(q in v.lower() for q in ('.pdf','download','rnd=','downfile','file')): candidates.append(v)
          raw=text.replace('\\/','/')
          for pat in [
              r'''downfile\s*\(\s*["']([^"']+)["']''',
              r'''DownLoad\.aspx\?rnd=([^"'&<\s]+)''',
              r'''(?:rnd|fileid|reportid|docid|id)\s*[:=]\s*["']([^"']+)["']''',
              r'''(?:url|file|pdf|download)[A-Za-z_]*\s*[:=]\s*["']([^"']+)["']''',
          ]:
              for m in re.finditer(pat,raw,re.I):
                  print('TOKEN_MATCH',pat,m.group(1),flush=True); tokens.append(m.group(1))
          for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',raw,re.I):
              val=m.group(0).rstrip('),;]}')
              if val.startswith('//'): val='https:'+val
              full=urljoin(r.url,val)
              if any(q in full.lower() for q in ('.pdf','download.aspx','rnd=','downfile','file')): candidates.append(full)

          for i,url in enumerate(dict.fromkeys(scripts)):
              try:
                  rr=s.get(url,timeout=45,allow_redirects=True)
                  print('SCRIPT',i,rr.status_code,len(rr.content),rr.url,flush=True)
                  Path('out',f'script_{i}.js').write_bytes(rr.content)
                  st=rr.text.replace('\\/','/')
                  for m in re.finditer(r'''downfile\s*\(\s*["']([^"']+)["']''',st,re.I): tokens.append(m.group(1)); print('SCRIPT_TOKEN',m.group(1),flush=True)
                  for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',st,re.I):
                      val=m.group(0).rstrip('),;]}')
                      if val.startswith('//'): val='https:'+val
                      full=urljoin(rr.url,val)
                      if any(q in full.lower() for q in ('.pdf','download.aspx','rnd=','downfile','file')): candidates.append(full)
              except Exception as e: print('SCRIPT_ERROR',url,repr(e),flush=True)

          tokens=list(dict.fromkeys(tokens+['5953271','6451804','5612427']))
          candidates=list(dict.fromkeys(candidates))
          print('TOKENS',tokens,flush=True)
          print('CANDIDATES',json.dumps(candidates,ensure_ascii=False),flush=True)

          # Try normal endpoints plus known server IP with alternate Host headers.
          host_ips={'download.51pdf.com.cn':['221.236.23.35','222.211.91.146'],'www.51pdf.cn':['221.236.23.35'],'vip.nxny.com':['222.211.91.146']}
          for tok in tokens:
              endpoints=[]
              for host in ('download.51pdf.com.cn','www.51pdf.cn','vip.nxny.com'):
                  paths=[f'/DownLoad/DownLoad.aspx?rnd={quote(tok)}',f'/download/download.aspx?rnd={quote(tok)}',f'/report/download.aspx?id={quote(tok)}',f'/report/down_{quote(tok)}.html']
                  for p in paths:
                      endpoints += [(f'http://{host}{p}',host),(f'https://{host}{p}',host)]
                      for ip in host_ips.get(host,[]): endpoints += [(f'http://{ip}{p}',host),(f'https://{ip}{p}',host)]
              for url,logical_host in endpoints:
                  headers={'Referer':detail}
                  if re.match(r'https?://\d',url): headers['Host']=logical_host
                  try:
                      rr=s.get(url,headers=headers,cookies=r.cookies.get_dict(),timeout=45,allow_redirects=True,verify=False)
                      if rr.status_code==200 or len(rr.content)>1000:
                          print('PROBE',tok,url,'Host',logical_host,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),repr(rr.content[:40]),flush=True)
                      if rr.content.startswith(b'%PDF'):
                          rd=PdfReader(io.BytesIO(rr.content),strict=False); tx=''
                          for j in range(min(4,len(rd.pages))):
                              try:tx+=rd.pages[j].extract_text() or ''
                              except Exception:pass
                          print('PDF_OK',json.dumps({'token':tok,'url':url,'resolved':rr.url,'pages':len(rd.pages),'bytes':len(rr.content),'text':re.sub(r'\s+',' ',tx)[:1000]},ensure_ascii=False),flush=True)
                          Path('out/recovered_report.pdf').write_bytes(rr.content); raise SystemExit(0)
                  except SystemExit: raise
                  except Exception: pass
          # Direct parsed candidates.
          for url in candidates:
              if url.startswith(('javascript:','mailto:')):continue
              try:
                  rr=s.get(url,headers={'Referer':detail},cookies=r.cookies.get_dict(),timeout=45,allow_redirects=True,verify=False)
                  print('DIRECT',url,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),flush=True)
                  if rr.content.startswith(b'%PDF'):
                      rd=PdfReader(io.BytesIO(rr.content),strict=False); print('DIRECT_PDF_OK',len(rd.pages),flush=True); Path('out/recovered_report.pdf').write_bytes(rr.content); raise SystemExit(0)
              except SystemExit: raise
              except Exception: pass
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: makeng-601123-51pdf-target-recovery-20261104
          path: out/
          if-no-files-found: warn
          retention-days: 7
