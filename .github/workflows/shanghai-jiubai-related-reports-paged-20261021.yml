name: Paged lookup Shanghai Jiubai related reports

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-related-reports-paged-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests
      - name: Paginate exact report windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[('2022-04-29','2022-05-06'),('2022-05-27','2022-06-03')]
          terms=['上海稳步推进复工复产','上海线下商业即将全面恢复营业','上海本地商业股','本地商业股的修复机会','复工复产','恢复营业']
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1','2']:
              found=[];total=1
              for page in range(1,80):
                if page>total: break
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                payload=None
                for attempt in range(5):
                  try:
                    r=s.get(api,params=p,timeout=(20,120))
                    if r.status_code==200: payload=r.json(); break
                  except Exception as e: print('ERR',page,repr(e))
                  time.sleep(1+attempt)
                if payload is None: break
                total=min(int(payload.get('TotalPage') or 1),79)
                data=payload.get('data') or []
                if isinstance(data,dict):data=data.get('list') or data.get('data') or []
                print('PAGE',qtype,page,'COUNT',len(data),'TOTAL',total)
                if not data:break
                for row in data:
                  title=str(row.get('title') or '')
                  if any(t in title for t in terms):
                    found.append({k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
                if page>=total or len(data)<100:break
              print('FOUND',qtype,json.dumps(found,ensure_ascii=False,indent=2))
          PY
