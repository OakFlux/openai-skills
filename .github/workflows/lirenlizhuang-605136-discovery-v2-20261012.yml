name: Discover Lirenlizhuang reports
on:
  push:
    paths: ['.github/workflows/lirenlizhuang-605136-discovery-v2-20261012.yml']
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Find filings
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://np-anotice-stock.eastmoney.com/api/security/ann'
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'}
          found={}
          for page in range(1,16):
              q=urllib.parse.urlencode({'sr':'-1','page_size':'100','page_index':page,'ann_type':'A','client_source':'web','stock_list':'605136'})
              req=urllib.request.Request(base+'?'+q,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=json.load(r).get('data') or {}
              rows=data.get('list') or []
              print('PAGE',page,'COUNT',len(rows),'TOTAL',data.get('total_hits'),flush=True)
              for row in rows:
                  if row.get('art_code'):
                      found[row['art_code']]=row
              if len(rows)<100: break
          keys=('年度报告','招股说明书','招股意向书','季度报告','一季度报告','三季度报告','半年度报告')
          for row in sorted(found.values(),key=lambda x:str(x.get('notice_date') or '')):
              title=str(row.get('title') or '')
              if any(k in title for k in keys):
                  print('MATCH',json.dumps({'title':title,'art_code':row.get('art_code'),'notice_date':row.get('notice_date'),'columns':row.get('columns')},ensure_ascii=False),flush=True)
          PY
