name: Temporary Ruishu download probe

on:
  push:
    branches:
      - task-greentown-public-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect download action and JavaScript endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4 playwright
          python3 -m playwright install chromium >/dev/null 2>&1
          python3 <<'PY'
          import asyncio
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          OUT=Path('output_click'); OUT.mkdir(exist_ok=True)
          base='https://www.ruishubaogao.com'
          detail=base+'/report-detail/10770'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          html=s.get(detail,timeout=60).text
          soup=BeautifulSoup(html,'html.parser')
          scripts=[urljoin(detail,x.get('src')) for x in soup.find_all('script') if x.get('src')]
          print('scripts',scripts)
          endpoint_hits=[]
          for idx,u in enumerate(scripts):
              try:
                  r=s.get(u,timeout=60); print('js',idx,r.status_code,u,len(r.content))
                  p=OUT/f'js_{idx}.js'; p.write_bytes(r.content)
                  txt=r.text
                  hits=[]
                  for pat in [r'/api/[A-Za-z0-9_?&=./${}-]+',r'https?://[^"\' ]+',r'[^;]{0,150}(?:download|pdf|file)[^;]{0,300}']:
                      vals=[]
                      for m in re.finditer(pat,txt,re.I):
                          v=m.group(0)
                          if v not in vals: vals.append(v)
                      hits.extend(vals[:200])
                  relevant=[v for v in hits if any(k in v.lower() for k in ['api/','download','pdf','file','cos','report'])]
                  if relevant:
                      print('JS HITS',u)
                      for v in relevant[:200]: print(v[:1200])
                      endpoint_hits.append({'url':u,'hits':relevant})
              except Exception as e: print('js error',u,repr(e))
          (OUT/'js_hits.json').write_text(json.dumps(endpoint_hits,ensure_ascii=False,indent=2),encoding='utf-8')

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  context=await browser.new_context(accept_downloads=True,viewport={'width':1440,'height':1000})
                  page=await context.new_page()
                  events=[]
                  page.on('request',lambda req: events.append({'kind':'request','method':req.method,'url':req.url,'type':req.resource_type,'post_data':req.post_data}))
                  page.on('response',lambda resp: events.append({'kind':'response','status':resp.status,'url':resp.url,'content_type':resp.headers.get('content-type'),'headers':resp.headers}))
                  page.on('popup',lambda pop: print('POPUP EVENT',pop.url))
                  await page.goto(detail,wait_until='networkidle',timeout=90000)
                  print('loaded',page.url,await page.title())
                  btn=page.locator('button.action-download')
                  print('button count',await btn.count())
                  try:
                      async with page.expect_download(timeout=15000) as dl_info:
                          await btn.click()
                      dl=await dl_info.value
                      suggested=dl.suggested_filename
                      dest=OUT/suggested
                      await dl.save_as(str(dest))
                      print('DOWNLOAD',suggested,dest.stat().st_size,dl.url)
                  except Exception as e:
                      print('NO DOWNLOAD EVENT',repr(e))
                      try: await btn.click()
                      except Exception as e2: print('SECOND CLICK ERROR',repr(e2))
                  await page.wait_for_timeout(6000)
                  print('after click url',page.url)
                  body=await page.locator('body').inner_text()
                  print('BODY AFTER CLICK',body[:6000])
                  (OUT/'after_click.txt').write_text(body,encoding='utf-8')
                  (OUT/'after_click.html').write_text(await page.content(),encoding='utf-8')
                  await page.screenshot(path=str(OUT/'after_click.png'),full_page=True)
                  print('RELEVANT EVENTS')
                  for event in events:
                      u=event.get('url','')
                      if any(k in u.lower() for k in ['api','download','pdf','file','cos','report']): print(event)
                  (OUT/'events.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Upload click probe
        uses: actions/upload-artifact@v4
        with:
          name: ruishu-click-probe
          path: output_click/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
