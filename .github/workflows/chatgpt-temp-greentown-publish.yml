name: Publish temporary Greentown China report package

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-temp-greentown-reports-20260828

      - name: Wait for downloader workflow and retrieve artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: chatgpt-temp-greentown-reports-20260828
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import io
          import json
          import os
          import shutil
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'chatgpt-greentown-publisher',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          workflow_url = f'https://api.github.com/repos/{repo}/actions/workflows/chatgpt-temp-greentown-reports.yml/runs?branch={branch}&event=push&per_page=10'
          chosen = None
          for _ in range(90):
              data = get_json(workflow_url)
              runs = [r for r in data.get('workflow_runs', []) if r.get('name') == 'Temporary Greentown China broker report downloader']
              if runs:
                  runs.sort(key=lambda r: r.get('created_at', ''), reverse=True)
                  candidate = runs[0]
                  print('downloader run', candidate.get('id'), candidate.get('status'), candidate.get('conclusion'))
                  if candidate.get('status') == 'completed':
                      chosen = candidate
                      break
              time.sleep(10)
          if not chosen:
              raise RuntimeError('Timed out waiting for downloader workflow')

          artifacts_data = get_json(chosen['artifacts_url'])
          artifacts = [a for a in artifacts_data.get('artifacts', []) if a.get('name') == 'greentown-broker-deep-reports' and not a.get('expired')]
          if not artifacts:
              raise RuntimeError(f'No downloader artifact found; run conclusion={chosen.get("conclusion")}')
          artifact = artifacts[0]
          request = urllib.request.Request(artifact['archive_download_url'], headers=headers)
          with urllib.request.urlopen(request, timeout=180) as response:
              content = response.read()
          print('artifact bytes', len(content), 'run conclusion', chosen.get('conclusion'))

          staging = Path('deliverables')
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          with zipfile.ZipFile(io.BytesIO(content), 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'Artifact ZIP is corrupt: {bad}')
              archive.extractall(staging)

          # Normalize the package name so it has a predictable raw URL.
          inner_zips = sorted(staging.glob('绿城中国_券商深度报告_*份.zip'))
          if inner_zips:
              shutil.copy2(inner_zips[0], staging / '绿城中国_券商深度报告.zip')
          marker = {
              'downloader_run_id': chosen.get('id'),
              'downloader_status': chosen.get('status'),
              'downloader_conclusion': chosen.get('conclusion'),
              'artifact_id': artifact.get('id'),
              'files': sorted(str(p.relative_to(staging)) for p in staging.rglob('*') if p.is_file()),
          }
          (staging / 'publisher_status.json').write_text(json.dumps(marker, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(marker, ensure_ascii=False, indent=2))
          PY

      - name: Commit retrieved deliverables to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- deliverables
          if git diff --cached --quiet; then
            echo 'No deliverable changes to commit.'
            exit 0
          fi
          git commit -m 'Add temporary Greentown China report deliverables [skip ci]'
          git push origin HEAD:chatgpt-temp-greentown-reports-20260828
