name: Discover SGPJBG search results for Kaichuang International

on:
  push:
    paths:
      - '.github/workflows/kaichuang-sgpjbg-search-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect search forms and query likely endpoints
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from urllib.parse import quote, urlencode, urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for base in ['https://www.sgpjbg.com/','https://m.sgpjbg.com/','https://bg.sgpjbg.com/']:
            try:
              r=s.get(base,timeout=45,allow_redirects=True)
              print('\nHOME',base,r.status_code,len(r.content),r.url,flush=True)
              r.encoding=r.apparent_encoding or r.encoding
              soup=BeautifulSoup(r.text,'lxml')
              for form in soup.find_all('form'):
                fields=[]
                for inp in form.find_all(['input','select','textarea']):
                  fields.append({'tag':inp.name,'name':inp.get('name'),'type':inp.get('type'),'value':inp.get('value')})
                print('FORM',json.dumps({'action':urljoin(r.url,form.get('action') or ''),'method':form.get('method'),'id':form.get('id'),'class':form.get('class'),'fields':fields},ensure_ascii=False),flush=True)
              scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]
              for src in scripts:
                if any(k in src.lower() for k in ('search','main','common','index','app','js')):
                  try:
                    sr=s.get(src,timeout=45); st=sr.text
                    for term in ('search','keyword','搜索','query','/so','/s?','/search'):
                      poses=[m.start() for m in re.finditer(re.escape(term),st,re.I)]
                      if poses:
                        print('SCRIPT_TERM',src,term,len(poses),flush=True)
                        for p in poses[:8]: print('SCRIPT_CTX',re.sub(r'\s+',' ',st[max(0,p-700):p+1800])[:2500],flush=True)
                  except Exception as e: print('SCRIPT_ERROR',src,repr(e),flush=True)
            except Exception as e: print('HOME_ERROR',base,repr(e),flush=True)

          q='开创国际'
          candidates=[
            'https://www.sgpjbg.com/search.html?keyword='+quote(q),
            'https://www.sgpjbg.com/search.html?q='+quote(q),
            'https://www.sgpjbg.com/search?keyword='+quote(q),
            'https://www.sgpjbg.com/search?q='+quote(q),
            'https://www.sgpjbg.com/so/?q='+quote(q),
            'https://www.sgpjbg.com/s?wd='+quote(q),
            'https://www.sgpjbg.com/e/search/index.php?keyboard='+quote(q),
            'https://www.sgpjbg.com/e/search/index.php?keyword='+quote(q),
            'https://m.sgpjbg.com/search.html?keyword='+quote(q),
            'https://m.sgpjbg.com/search?q='+quote(q),
            'https://bg.sgpjbg.com/search.html?keyword='+quote(q),
          ]
          for url in candidates:
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              r.encoding=r.apparent_encoding or r.encoding
              text=r.text; soup=BeautifulSoup(text,'lxml')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              print('\nCANDIDATE',url,r.status_code,len(r.content),r.url,'TITLE',title,flush=True)
              count=0
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if '开创国际' in label or '600097' in label or '政策扶持' in label or '金枪鱼捕捞量' in label:
                  print('RESULT',json.dumps({'label':label,'href':href},ensure_ascii=False),flush=True); count+=1
              print('MATCH_COUNT',count,flush=True)
            except Exception as e: print('CANDIDATE_ERROR',url,repr(e),flush=True)
          PY
