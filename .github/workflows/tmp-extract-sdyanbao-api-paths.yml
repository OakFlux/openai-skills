name: Temporary Extract Exact Sdyanbao API Paths

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-extract-sdyanbao-api-paths.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract exact API path literals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://www.sdyanbao.com/detail/355422'})
          js_url='https://www.sdyanbao.com/_nuxt/a94fdf1.js'
          r=session.get(js_url,timeout=90); r.raise_for_status(); body=r.text.replace('\\/','/')
          print('JS_BYTES',len(r.content),'TAIL',body[-500:])

          patterns={
            'url_double': r'url\s*:\s*"([^"]+)"',
            'url_single': r"url\s*:\s*'([^']+)'",
            'axios_call_double': r'\.(?:get|post|put|delete|patch)\(\s*"([^"]+)"',
            'axios_call_single': r"\.(?:get|post|put|delete|patch)\(\s*'([^']+)'",
            'production_double': r'production\s*:\s*"([^"]+)"',
            'route_path_double': r'path\s*:\s*"([^"]+)"',
          }
          for name,pat in patterns.items():
            values=[]
            for value in re.findall(pat,body,re.I):
              if value not in values: values.append(value)
            print(name.upper()+'='+json.dumps(values,ensure_ascii=False))

          # Print concise context for every API-like URL literal.
          matches=[]
          for m in re.finditer(r'url\s*:\s*(["\'])(.*?)\1',body,re.I|re.S):
            value=m.group(2)
            if len(value)<300:
              matches.append({'value':value,'context':re.sub(r'\s+',' ',body[max(0,m.start()-180):m.end()+260])})
          print('URL_CONTEXTS='+json.dumps(matches,ensure_ascii=False))

          # Try source map declared in the JS tail and conventional map name.
          map_urls=[]
          for value in re.findall(r'sourceMappingURL=([^\s*]+)',body[-1000:]):
            map_urls.append(requests.compat.urljoin(js_url,value.strip()))
          map_urls.append(js_url+'.map')
          seen=set()
          for map_url in map_urls:
            if map_url in seen: continue
            seen.add(map_url)
            try:
              q=session.get(map_url,timeout=90)
              print('MAP_META='+json.dumps({'url':map_url,'status':q.status_code,'bytes':len(q.content),'type':q.headers.get('content-type'),'head':q.text[:200]},ensure_ascii=False))
              if q.status_code==200 and q.text.lstrip().startswith('{'):
                data=q.json()
                sources=data.get('sources') or []
                contents=data.get('sourcesContent') or []
                print('MAP_SOURCES='+json.dumps(sources[:300],ensure_ascii=False))
                for src,content in zip(sources,contents):
                  low=(src+' '+(content or '')).lower()
                  if any(k in low for k in ['api','report','detail','download','file']):
                    vals=[]
                    for pat in patterns.values():
                      vals.extend(re.findall(pat,content or '',re.I))
                    if vals:
                      print('MAP_SOURCE_ENDPOINTS='+json.dumps({'source':src,'values':list(dict.fromkeys(vals))},ensure_ascii=False))
            except Exception as exc:
              print('MAP_ERROR='+json.dumps({'url':map_url,'error':repr(exc)},ensure_ascii=False))
          PY
