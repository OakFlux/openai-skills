name: Probe public direct Ningbo Port report PDF 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-direct-probe-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: python -m pip install --quiet requests pypdf

      - name: Probe API and PDF variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('probe_out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept':'application/json,text/plain,application/pdf,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9',
              'Origin':'https://www.fxbaogao.com',
              'Referer':'https://www.fxbaogao.com/view?id=1422001',
          })
          did='1422001'
          api='https://api.fxbaogao.com'
          probes=[
              ('GET',f'{api}/mofoun/report/searchReportData/detail/anon?chartId={did}&needParas=0',None),
              ('GET',f'{api}/mofoun/report/searchReportData/detail/anon?chartId={did}&needParas=1',None),
              ('GET',f'{api}/mofoun/report/searchReportData/detail?chartId={did}&needParas=0',None),
              ('POST',f'{api}/mofoun/report/searchReport/detail',{'reportId':int(did)}),
              ('POST',f'{api}/mofoun/report/searchReport/detail',{'reportId':did}),
              ('POST',f'{api}/mofoun/report/searchReport/detail',{'docId':int(did)}),
              ('POST',f'{api}/mofoun/report/searchReport/detail',{'docId':did}),
              ('POST',f'{api}/mofoun/report/searchReport/detail',{'id':int(did)}),
              ('GET',f'{api}/mofoun/report/report/getReportPreviewImages?reportId={did}',None),
              ('GET',f'{api}/mofoun/report/readReport/readReport?reportId={did}',None),
              ('GET',f'{api}/mofoun/report/readReport/readReport?id={did}',None),
              ('GET',f'{api}/mofoun/report/searchReport/detail/catalog?reportId={did}',None),
              ('GET',f'{api}/mofoun/report/report/file/downloadReport?reportId={did}',None),
              ('GET',f'{api}/mofoun/report/report/report/preDownV2?reportId={did}',None),
              ('GET',f'{api}/mofoun/report/report/downloadReportByBean?reportId={did}',None),
          ]
          records=[]
          found_urls=set()
          for i,(method,url,body) in enumerate(probes,1):
              try:
                  r=s.request(method,url,json=body,timeout=(15,60),allow_redirects=True)
                  ctype=r.headers.get('content-type','')
                  rec={'i':i,'method':method,'url':url,'body':body,'status':r.status_code,'bytes':len(r.content),'content_type':ctype,'final_url':r.url,'headers':dict(r.headers)}
                  records.append(rec)
                  ext='pdf' if r.content.startswith(b'%PDF-') else 'json' if 'json' in ctype else 'txt'
                  (out/f'api_{i:02d}.{ext}').write_bytes(r.content)
                  print('API',json.dumps({k:rec[k] for k in ('i','method','status','bytes','content_type','final_url')},ensure_ascii=False),flush=True)
                  print('BODY',i,r.text[:8000] if not r.content.startswith(b'%PDF-') else '%PDF',flush=True)
                  if r.content.startswith(b'%PDF-') and len(r.content)>50000:
                      found_urls.add(r.url)
                  else:
                      text=r.text
                      for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                          u=m.group(0).replace('\\/','/').rstrip(');,]}')
                          if any(k in u.lower() for k in ('pdf','report','download','file','oss')):
                              found_urls.add(u)
                      try:
                          j=r.json()
                          def walk(v):
                              if isinstance(v,dict):
                                  for vv in v.values(): walk(vv)
                              elif isinstance(v,list):
                                  for vv in v: walk(vv)
                              elif isinstance(v,str) and (v.startswith('http') or 'report/' in v or 'report-cn/' in v or v.endswith('.pdf')):
                                  found_urls.add(v)
                          walk(j)
                      except Exception: pass
              except Exception as e:
                  print('API_ERR',i,method,url,repr(e),flush=True)

          variants=[]
          bases=['https://public.fxbaogao.com','https://report.fxbaogao.com','https://static.fxbaogao.com']
          paths=[]
          for prefix in ('report','report-cn','report-en'):
              for date in ('2019/08/31','2019/09/07'):
                  paths += [
                      f'/{prefix}/{date}/{did}.pdf',
                      f'/{prefix}/{date}/{did}-1.pdf',
                      f'/{prefix}/{date}/{did}_1.pdf',
                  ]
          for base in bases:
              for p in paths:
                  variants.append(base+p)
          for u in list(found_urls):
              if u.startswith('/'):
                  variants.append(api+u)
              elif u.startswith('http'):
                  variants.append(u)
          variants=list(dict.fromkeys(variants))
          pdfrecs=[]
          n=0
          for u in variants:
              try:
                  r=s.get(u,timeout=(12,45),allow_redirects=True)
                  rec={'url':u,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'prefix':r.content[:8].hex()}
                  print('FILE',json.dumps(rec,ensure_ascii=False),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                      n+=1
                      p=out/f'found_{n:02d}_{did}.pdf'; p.write_bytes(r.content)
                      reader=PdfReader(str(p),strict=False)
                      rec['pages']=len(reader.pages)
                      rec['saved']=p.name
                      pdfrecs.append(rec)
                      print('FOUND_PDF',json.dumps(rec,ensure_ascii=False),flush=True)
                      if n>=5: break
              except Exception as e:
                  print('FILE_ERR',u,repr(e),flush=True)
          (out/'api_records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'found_urls.txt').write_text('\n'.join(sorted(found_urls)),encoding='utf-8')
          (out/'pdf_records.json').write_text(json.dumps(pdfrecs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-fxbaogao-direct-probe
          path: probe_out
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
