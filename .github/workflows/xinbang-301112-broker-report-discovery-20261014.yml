name: Discover Xinbang Intelligent broker reports 20261014

on:
  push:
    paths:
      - '.github/workflows/xinbang-301112-broker-report-discovery-20261014.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Discover reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          CODE='301112'
          COMPANY='信邦智能'
          out=Path('discovery')
          out.mkdir()
          s=requests.Session()
          s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept':'application/json,text/plain,text/html,*/*',
          })

          def clean(v):
              return re.sub(r'\s+',' ',re.sub(r'<[^>]+>','',html.unescape(str(v or '')))).strip()

          rows=[]

          # Eastmoney company research API.
          for page in range(1, 16):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2018-01-01','endTime':'2026-10-14','pageNo':str(page),'fields':'',
                  'qType':'0','orgCode':'','code':CODE,'rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page),
              }
              try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,120),headers={'Referer':'https://data.eastmoney.com/report/'})
                  print('EM_LIST',page,r.status_code,len(r.content),r.url,flush=True)
                  if r.status_code!=200: break
                  j=r.json(); batch=j.get('data') or []
                  for x in batch:
                      blob=json.dumps(x,ensure_ascii=False)
                      if CODE in blob or COMPANY in blob:
                          y=dict(x); y['_source']='eastmoney_list'; rows.append(y)
                  if len(batch)<100: break
              except Exception as e:
                  print('EM_LIST_ERR',page,repr(e),flush=True); break

          # Eastmoney POST/list2 variant.
          for page in range(1, 16):
              body={
                  'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,
                  'beginTime':'2018-01-01','endTime':'2026-10-14','code':CODE,
                  'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''
              }
              try:
                  r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=(20,120),headers={'Content-Type':'application/json','Referer':'https://data.eastmoney.com/report/'})
                  print('EM_LIST2',page,r.status_code,len(r.content),flush=True)
                  if r.status_code!=200: break
                  j=r.json(); batch=j.get('data') or []
                  for x in batch:
                      blob=json.dumps(x,ensure_ascii=False)
                      if CODE in blob or COMPANY in blob:
                          y=dict(x); y['_source']='eastmoney_list2'; rows.append(y)
                  if len(batch)<100: break
              except Exception as e:
                  print('EM_LIST2_ERR',page,repr(e),flush=True); break

          # Fxbaogao anonymous metadata search.
          fx='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          bodies=[]
          for page in range(1, 16):
              bodies.append({'stockCodes':[CODE],'pageNum':page,'pageSize':100,'order':1})
          for q in [COMPANY, COMPANY+' 深度报告', COMPANY+' 首次覆盖', COMPANY+' 汽车智能制造', COMPANY+' 机器人', COMPANY+' 英迪芯微']:
              bodies.append({'keywords':q,'pageNum':1,'pageSize':100,'order':1})
          for i,body in enumerate(bodies,1):
              try:
                  r=s.post(fx,json=body,timeout=(20,120),headers={'Content-Type':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
                  print('FX',i,r.status_code,len(r.content),json.dumps(body,ensure_ascii=False),flush=True)
                  if r.status_code!=200: continue
                  j=r.json(); batch=((j.get('data') or {}).get('dataList') or [])
                  for x in batch:
                      blob=json.dumps(x,ensure_ascii=False)
                      if CODE in blob or COMPANY in blob:
                          y=dict(x); y['_source']='fxbaogao'; rows.append(y)
              except Exception as e:
                  print('FX_ERR',i,repr(e),flush=True)

          # Public Nxny stock index.
          try:
              r=s.get(f'https://www.nxny.com/stock/stock_{CODE}/',timeout=(20,90),headers={'Referer':'https://www.nxny.com/'})
              print('NXNY',r.status_code,len(r.content),r.url,flush=True)
              if r.status_code==200:
                  raw=r.content
                  for enc in ['utf-8','gb18030']:
                      try:
                          text=raw.decode(enc)
                          if COMPANY in text or CODE in text: break
                      except Exception: pass
                  soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all('a',href=True):
                      label=clean(a.get_text(' ',strip=True)); href=urllib.parse.urljoin(r.url,a['href'])
                      m=re.search(r'/report/view_(\d+)\.html',href)
                      if m and (COMPANY in label or CODE in label):
                          rows.append({'_source':'nxny','report_id':m.group(1),'title':label,'detail_url':href})
          except Exception as e:
              print('NXNY_ERR',repr(e),flush=True)

          # Public stock-report index at sgpjbg.com.
          for url in [
              f'https://www.sgpjbg.com/baogao/{CODE}.html',
              f'https://www.sgpjbg.com/stock/{CODE}/',
              f'https://www.sgpjbg.com/stock/{CODE}.html',
              'https://www.sgpjbg.com/search?keyword='+urllib.parse.quote(COMPANY),
          ]:
              try:
                  r=s.get(url,timeout=(20,90),headers={'Referer':'https://www.sgpjbg.com/'})
                  print('SGPJBG',r.status_code,len(r.content),r.url,flush=True)
                  if r.status_code!=200: continue
                  soup=BeautifulSoup(r.text,'lxml')
                  for a in soup.find_all('a',href=True):
                      label=clean(a.get_text(' ',strip=True)); href=urllib.parse.urljoin(r.url,a['href'])
                      if (COMPANY in label or CODE in label) and ('report' in href or 'baogao' in href):
                          rows.append({'_source':'sgpjbg','title':label,'detail_url':href})
              except Exception as e:
                  print('SGPJBG_ERR',url,repr(e),flush=True)

          # De-duplicate.
          unique={}
          for row in rows:
              title=clean(row.get('title') or row.get('reportTitle') or row.get('name') or '')
              key=(str(row.get('infoCode') or row.get('docId') or row.get('reportId') or row.get('id') or row.get('report_id') or row.get('detail_url') or ''),title)
              unique[key]=row
          rows=list(unique.values())
          (out/'all_metadata.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')

          concise=[]
          for row in rows:
              title=clean(row.get('title') or row.get('reportTitle') or row.get('name') or '')
              org=clean(row.get('orgSName') or row.get('orgName') or row.get('publishOrgName') or '')
              pages=row.get('attachPages') or row.get('pageNum') or row.get('pages')
              date=clean(row.get('publishDate') or row.get('pubTimeStr') or row.get('publishTime') or row.get('date') or '')
              item={
                  'source':row.get('_source'),'title':title,'org':org,'pages':pages,'date':date,
                  'infoCode':row.get('infoCode'),'docId':row.get('docId'),'pdfPath':row.get('pdfPath'),
                  'docType':row.get('docType'),'reportType':row.get('reportType'),'isDeep':row.get('isDeep'),
                  'isNotBroker':row.get('isNotBroker'),'detail_url':row.get('detail_url')
              }
              concise.append(item)
              print('CANDIDATE',json.dumps(item,ensure_ascii=False),flush=True)
          (out/'candidates.json').write_text(json.dumps(concise,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'candidates.txt').write_text('\n'.join(json.dumps(x,ensure_ascii=False) for x in concise),encoding='utf-8')
          print('TOTAL_METADATA',len(rows),flush=True)
          PY

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-broker-report-discovery
          path: discovery
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
