name: Query Xinbang broker-authored announcement metadata 20261014

on:
  push:
    paths:
      - '.github/workflows/xinbang-301112-broker-report-discovery-20261014.yml'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public announcement metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            'https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=100&page_index=1&ann_type=A&client_source=web&stock_list=301112&f_node=0&s_node=0' \
            -o out/announcements.json
          python -m json.tool out/announcements.json > out/announcements.pretty.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('out/announcements.json').read_text())
          rows=(data.get('data') or {}).get('list') or []
          keys=['证券股份有限公司','证券有限责任公司','保荐书','保荐总结','跟踪报告','核查意见','独立财务顾问','财务顾问报告','上市保荐','发行保荐','投资价值研究']
          matches=[]
          for x in rows:
              title=str(x.get('title') or '')
              if any(k in title for k in keys):
                  item={'art_code':x.get('art_code'),'title':title,'notice_date':x.get('notice_date'),'display_time':x.get('display_time'),'columns':x.get('columns'),'codes':x.get('codes')}
                  matches.append(item)
                  print('MATCH',json.dumps(item,ensure_ascii=False),flush=True)
          Path('out/broker_matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(rows),'MATCHES',len(matches),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-broker-announcement-metadata
          path: out
          retention-days: 7
