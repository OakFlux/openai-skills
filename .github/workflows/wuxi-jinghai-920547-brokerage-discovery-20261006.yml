name: Discover Wuxi Jinghai 920547 brokerage reports 20261006

on:
  push:
    paths:
      - '.github/workflows/wuxi-jinghai-920547-brokerage-discovery-20261006.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query public brokerage report metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import time
          import requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,*/*;q=0.8',
          })

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          periods = [
              ('2014-01-01', '2018-12-31'),
              ('2019-01-01', '2021-12-31'),
              ('2022-01-01', '2024-12-31'),
              ('2025-01-01', '2026-10-06'),
          ]
          seen = set()
          rows_all = []
          for stock_code in ['920547', '836547']:
              for begin, end in periods:
                  for page in range(1, 30):
                      params = {
                          'industryCode': '*',
                          'pageSize': '100',
                          'industry': '*',
                          'rating': '*',
                          'ratingchange': '*',
                          'beginTime': begin,
                          'endTime': end,
                          'pageNo': str(page),
                          'fields': '',
                          'qType': '0',
                          'orgCode': '',
                          'code': stock_code,
                          'rcode': '',
                          'p': str(page),
                          'pageNum': str(page),
                          'pageNumber': str(page),
                          '_': str(int(time.time() * 1000)),
                      }
                      response = session.get(endpoint, params=params, timeout=60)
                      print('QUERY', stock_code, begin, end, page, response.status_code, len(response.content), flush=True)
                      response.raise_for_status()
                      payload = response.json()
                      rows = payload.get('data', []) if isinstance(payload, dict) else []
                      print('COUNT', len(rows), flush=True)
                      if not rows:
                          break
                      for row in rows:
                          code = row.get('infoCode')
                          if not code or code in seen:
                              continue
                          seen.add(code)
                          rows_all.append(row)
                      if len(rows) < 100:
                          break

          print('TOTAL', len(rows_all), flush=True)
          for row in rows_all:
              compact = {key: row.get(key) for key in [
                  'title', 'stockName', 'stockCode', 'orgSName', 'publishDate',
                  'infoCode', 'attachPages', 'attachSize', 'researcher',
                  'column', 'emRatingName', 'encodeUrl'
              ]}
              print('REPORT_ROW', json.dumps(compact, ensure_ascii=False), flush=True)
          PY
