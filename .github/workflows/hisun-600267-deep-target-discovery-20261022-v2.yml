name: Inspect Hisun deep report sources 20261022

on:
  push:
    branches:
      - tmp/hisun-600267-deep-target-20261022-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect source pages and direct links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          urls=[
            'https://fxbaogao.com/detail/3913491',
            'https://www.fxbaogao.com/detail/3913491',
            'https://www.hibor.com.cn/repinfodetail_2775481.html',
          ]
          for url in urls:
            print('\n=== PAGE',url,'===')
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'))
              enc=r.apparent_encoding or r.encoding or 'utf-8'; text=r.content.decode(enc,errors='replace')
              print('HEAD',text[:500].replace('\n',' '))
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              items=[]
              for tag in soup.find_all(['a','link','script','iframe','source','object','embed'], href=True):
                href=urljoin(r.url,tag.get('href'))
                label=re.sub(r'\s+',' ',tag.get_text(' ',strip=True))[:200]
                if any(k in href.lower() for k in ['pdf','download','file','report','attach','doc']) or any(k in label.lower() for k in ['pdf','下载','原文','报告']):
                  items.append({'tag':tag.name,'label':label,'url':href})
              for tag in soup.find_all(['script','iframe','source','object','embed'], src=True):
                src=urljoin(r.url,tag.get('src'))
                if any(k in src.lower() for k in ['pdf','download','file','report','attach','doc']):
                  items.append({'tag':tag.name,'label':'','url':src})
              print('LINKS',json.dumps(items[:200],ensure_ascii=False,indent=2))
              patterns=[
                r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',
                r'[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',
                r'(?:download|downurl|pdfurl|fileurl|reporturl)[^\n]{0,300}',
              ]
              for pat in patterns:
                hits=re.findall(pat,text,re.I)
                print('PATTERN',pat,'COUNT',len(hits))
                print(json.dumps(hits[:100],ensure_ascii=False,indent=2))
              body_text=re.sub(r'\s+',' ',soup.get_text(' ',strip=True))
              for key in ['资产重估','35 页','下载报告','打开报告原文','pdf']:
                idx=body_text.lower().find(key.lower())
                if idx>=0: print('CONTEXT',key,body_text[max(0,idx-300):idx+700])
            except Exception as e:
              print('ERROR',repr(e))
          PY
