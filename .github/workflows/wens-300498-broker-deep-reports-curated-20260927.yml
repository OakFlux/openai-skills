name: Build curated Wens 300498 broker deep report package 20260927

on:
  push:
    paths:
      - '.github/workflows/wens-300498-broker-deep-reports-curated-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package selected reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE = '温氏股份_300498_券商深度报告_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          art = Path('artifact_out')
          art.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_2024-06-04_国金证券_猪周期景气上行_养殖龙头稳健成长.pdf',
                  'broker': '国金证券',
                  'title': '猪周期景气上行，养殖龙头稳健成长',
                  'date': '2024-06-04',
                  'pages_expected': 21,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202406041635367757_1.pdf',
                  'info_code': 'AP202406041635367757',
              },
              {
                  'filename': '02_2022-11-27_国信证券_畜禽养殖大型企业_有望受益猪鸡周期回暖.pdf',
                  'broker': '国信证券',
                  'title': '畜禽养殖大型企业，有望受益猪鸡周期回暖',
                  'date': '2022-11-27',
                  'pages_expected': 33,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202211271580604461_1.pdf',
                  'info_code': 'AP202211271580604461',
              },
              {
                  'filename': '03_2022-08-17_民生证券_深度报告_生猪养殖王者归来_猪鸡景气共振可期.pdf',
                  'broker': '民生证券',
                  'title': '深度报告：生猪养殖“王者归来”，猪、鸡景气共振可期',
                  'date': '2022-08-17',
                  'pages_expected': 24,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202208171577292182_1.pdf',
                  'info_code': 'AP202208171577292182',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          records = []
          seen = set()
          for doc in docs:
              dest = root / doc['filename']
              error = None
              for attempt in range(1, 5):
                  try:
                      r = session.get(doc['url'], timeout=(30, 240), allow_redirects=True)
                      print('DOWNLOAD', doc['filename'], attempt, r.status_code, len(r.content), r.url, flush=True)
                      r.raise_for_status()
                      if len(r.content) < 100000 or not r.content.startswith(b'%PDF-'):
                          raise RuntimeError('not a complete PDF')
                      dest.write_bytes(r.content)
                      break
                  except Exception as exc:
                      error = exc
                      time.sleep(attempt * 2)
              else:
                  raise RuntimeError(f'download failed for {doc["filename"]}: {error!r}')

              q = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {q.stderr[-1000:]}')
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < 18 or abs(pages - doc['pages_expected']) > 1:
                  raise RuntimeError(f'unexpected page count {pages} for {dest.name}')
              texts = []
              for page in reader.pages:
                  try:
                      texts.append(page.extract_text() or '')
                  except Exception:
                      texts.append('')
              compact = re.sub(r'\s+', '', '\n'.join(texts))
              if '温氏股份' not in compact and '300498' not in compact:
                  raise RuntimeError(f'company identity check failed for {dest.name}')
              broker_key = doc['broker'].replace('证券','')
              if broker_key not in compact and doc['broker'] not in compact:
                  raise RuntimeError(f'broker identity check failed for {dest.name}')
              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen:
                  raise RuntimeError(f'duplicate report detected: {dest.name}')
              seen.add(sha)
              record = {
                  'filename': dest.name,
                  'company': '温氏食品集团股份有限公司（温氏股份，300498.SZ）',
                  'broker': doc['broker'],
                  'title': doc['title'],
                  'report_date': doc['date'],
                  'pages': pages,
                  'bytes': len(data),
                  'source_url': doc['url'],
                  'info_code': doc['info_code'],
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '温氏股份（300498.SZ）券商深度报告合集',
              '整理日期：2026-09-27', '',
              '本包优先选择较新的、公开可直接下载的完整公司深度/长篇专题报告，三份报告来自不同券商。', '',
              '文件清单：',
          ]
          for i, r in enumerate(records, 1):
              readme += [
                  f'{i}. {r["broker"]}｜{r["title"]}',
                  f'   日期：{r["report_date"]}；页数：{r["pages"]}',
                  f'   文件：{r["filename"]}',
                  f'   来源：{r["source_url"]}',
                  f'   SHA-256：{r["sha256"]}', '',
              ]
          readme += ['完整性核验：PDF文件头、实际页数、qpdf结构、公司名称/证券代码、券商名称、重复哈希及SHA-256；ZIP已通过CRC测试。']
          (root / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records), encoding='utf-8')

          zip_path = art / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(root.iterdir()):
                  zf.write(p, arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as zf:
              if zf.testzip() is not None:
                  raise RuntimeError('ZIP CRC check failed')
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')
          print('FINAL_RECORDS', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: wens-300498-broker-deep-reports-curated-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
