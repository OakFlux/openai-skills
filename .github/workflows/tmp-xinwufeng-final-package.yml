name: Temporary Xinwufeng final annual report package

on:
  push:
    branches:
      - tmp/xinwufeng-annual-reports-20260830
    paths:
      - .github/workflows/tmp-xinwufeng-final-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF
      - name: Download, validate, and package official reports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests

          OUT = Path('xinwufeng_final')
          PDFDIR = OUT / 'pdfs'
          RENDERDIR = OUT / 'renders'
          for path in (OUT, PDFDIR, RENDERDIR):
              path.mkdir(parents=True, exist_ok=True)

          reports = [
              {'type':'annual','year':2020,'label':'2020年年度报告','announcement_date':'2021-03-16','adjunct':'finalpage/2021-03-16/1209385266.PDF'},
              {'type':'annual','year':2021,'label':'2021年年度报告','announcement_date':'2022-04-28','adjunct':'finalpage/2022-04-28/1213176458.PDF'},
              {'type':'annual','year':2022,'label':'2022年年度报告','announcement_date':'2023-04-25','adjunct':'finalpage/2023-04-25/1216564457.PDF'},
              {'type':'annual','year':2023,'label':'2023年年度报告','announcement_date':'2024-04-20','adjunct':'finalpage/2024-04-20/1219705303.PDF'},
              {'type':'annual','year':2024,'label':'2024年年度报告','announcement_date':'2025-03-29','adjunct':'finalpage/2025-03-29/1222950354.PDF'},
              {'type':'annual','year':2025,'label':'2025年年度报告','announcement_date':'2026-04-28','adjunct':'finalpage/2026-04-28/1225213952.PDF'},
              {'type':'interim','year':2025,'label':'2025年半年度报告','announcement_date':'2025-08-23','adjunct':'finalpage/2025-08-23/1224560034.PDF'},
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6',
          })
          logs = []
          records = []

          def note(*parts):
              line = ' '.join(str(x) for x in parts)
              print(line, flush=True)
              logs.append(line)

          for item in reports:
              data = None
              source_url = None
              for url in [
                  f"https://static.cninfo.com.cn/{item['adjunct']}",
                  f"http://static.cninfo.com.cn/{item['adjunct']}",
              ]:
                  try:
                      response = session.get(url, timeout=120, allow_redirects=True, headers={
                          'Referer':'https://www.cninfo.com.cn/',
                          'Accept':'application/pdf,*/*;q=0.8',
                      })
                      note('DOWNLOAD', item['year'], item['type'], response.status_code, len(response.content), response.headers.get('content-type'), response.url)
                      if response.status_code == 200 and response.content.lstrip().startswith(b'%PDF') and len(response.content) > 100_000:
                          data = response.content
                          source_url = response.url
                          break
                  except Exception as exc:
                      note('DOWNLOAD_ERROR', item['year'], item['type'], url, repr(exc))
              if data is None:
                  raise RuntimeError(f"Failed to download {item['label']}")

              filename = f"新五丰_{item['year']}年{'年度报告' if item['type'] == 'annual' else '半年度报告'}.pdf"
              path = PDFDIR / filename
              path.write_bytes(data)

              doc = pymupdf.open(str(path))
              pages = doc.page_count
              if pages < 25:
                  raise RuntimeError(f'{filename} unexpectedly short: {pages} pages')
              indices = sorted(set([0, 1, min(5, pages - 1), pages // 2, pages - 1]))
              text = '\n'.join(doc.load_page(index).get_text('text') for index in indices)
              compact = re.sub(r'\s+', '', text)
              if not any(key in compact for key in ['新五丰', '湖南新五丰股份有限公司', '600975']):
                  raise RuntimeError(f'Company identity check failed: {filename}')
              for label, index in [('first', 0), ('middle', pages // 2), ('last', pages - 1)]:
                  pix = doc.load_page(index).get_pixmap(matrix=pymupdf.Matrix(0.8, 0.8), alpha=False)
                  pix.save(str(RENDERDIR / f"{item['year']}_{item['type']}_{label}.png"))
              encrypted = bool(doc.is_encrypted)
              doc.close()

              record = {
                  'file': filename,
                  'type': item['type'],
                  'report_year': item['year'],
                  'title': item['label'],
                  'announcement_date': item['announcement_date'],
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'encrypted': encrypted,
                  'source_url': source_url,
              }
              records.append(record)
              note('VALIDATED', json.dumps(record, ensure_ascii=False))

          if len(records) != 7 or len({record['sha256'] for record in records}) != 7:
              raise RuntimeError('Final report count or duplicate-content check failed')

          records.sort(key=lambda record: (record['report_year'], 0 if record['type'] == 'annual' else 1))
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          readme = [
              '新五丰（600975.SH）2020—2025年年度报告及最新可得半年度报告',
              '',
              f'文件数量：{len(records)}份完整PDF',
              '来源：巨潮资讯网官方公告附件',
              '',
          ]
          for index, record in enumerate(records, 1):
              readme.append(f"{index}. {record['file']}｜公告日期：{record['announcement_date']}｜{record['pages']}页")
          readme += [
              '',
              '说明：截至2026年8月30日，巨潮资讯网尚未收录新五丰2026年半年度报告；最新完整半年报为2025年半年度报告。',
              '核验：已检查PDF文件头、实际页数、报告主体、加密状态及首页、中间页、末页渲染；ZIP完整性测试通过。',
              '版权归上市公司及公告发布平台所有，仅供研究参考。',
          ]
          (OUT / 'README.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(f"{record['sha256']}  {record['file']}" for record in records) + '\n', encoding='utf-8')
          (OUT / 'download_log.txt').write_text('\n'.join(logs), encoding='utf-8')

          zip_path = OUT / 'xinwufeng_reports_2020_2025_latest_H1.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(PDFDIR.glob('*.pdf')):
                  archive.write(path, path.name)
              for name in ['README.txt', 'manifest.json', 'SHA256SUMS.txt']:
                  archive.write(OUT / name, name)
          with zipfile.ZipFile(zip_path) as archive:
              if archive.testzip():
                  raise RuntimeError('ZIP integrity test failed')
              if len([name for name in archive.namelist() if name.lower().endswith('.pdf')]) != 7:
                  raise RuntimeError('ZIP PDF count failed')
          note('FINAL_ZIP', zip_path, zip_path.stat().st_size)
          print((OUT / 'README.txt').read_text(encoding='utf-8'))
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: xinwufeng-corrected-final-reports
          path: xinwufeng_final/
          retention-days: 3
          if-no-files-found: error
