name: Query current NEEQ endpoints for 400062 annual reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-current-neeq-query-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - name: Query current announcement endpoints
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import requests
          from typing import Any

          BASE='https://www.neeq.com.cn'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          s=requests.Session()
          s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9'})
          warm=s.get(BASE+'/disclosure/announcement.html',timeout=40)
          print('WARM',warm.status_code,warm.url,len(warm.content),s.cookies.get_dict())

          need=['companyCd','companyName','disclosureTitle','disclosurePostTitle','destFilePath','publishDate','xxfcbj','fileExt','xxzrlx','upDate']
          callbacks=['jQuery183009154627335424248_1770000000000','callback','jQuery']
          endpoints=['/disclosureInfoController/initDisclosureList.do','/disclosureInfoController/companyAnnouncement.do']
          company_values=['400062','二重5','国重装5','400062/二重5','400062/国重装5','']
          keyword_values=['','400062','二重5','二重重装','国重装5','国机重装','二重集团（德阳）重型装备股份有限公司','国机重型装备集团股份有限公司']
          xxf_values=['3','2','1','0','']

          def parse_jsonp(raw:str, callback:str)->Any:
              text=raw.strip().rstrip(';')
              prefixes=[callback+'(','null(','callback(','jQuery(']
              for prefix in prefixes:
                  if text.startswith(prefix) and text.endswith(')'):
                      text=text[len(prefix):-1]
                      break
              if not text.startswith(('{','[')) and '(' in text and text.endswith(')'):
                  text=text[text.find('(')+1:-1]
              return json.loads(text)

          def extract_rows(obj:Any)->list[dict]:
              rows=[]
              def walk(x:Any, path:str='root'):
                  if isinstance(x,dict):
                      # Direct disclosure record
                      if ('companyCd' in x and ('disclosureTitle' in x or 'destFilePath' in x)):
                          rows.append(x)
                      for k,v in x.items():
                          if k in ('disclosures','content','list') and isinstance(v,list):
                              for item in v:
                                  if isinstance(item,dict) and ('companyCd' in item or 'disclosureTitle' in item or 'destFilePath' in item):
                                      rows.append(item)
                                  else:
                                      walk(item,path+'.'+k)
                          elif isinstance(v,(dict,list)):
                              walk(v,path+'.'+k)
                  elif isinstance(x,list):
                      for item in x: walk(item,path+'[]')
              walk(obj)
              uniq=[]; seen=set()
              for r in rows:
                  key=(str(r.get('companyCd')),str(r.get('disclosureTitle')),str(r.get('publishDate')),str(r.get('destFilePath')))
                  if key not in seen:
                      seen.add(key); uniq.append(r)
              return uniq

          case_no=0
          for ep in endpoints:
              for company in company_values:
                  # Avoid a combinatorial explosion while covering company code, name and keyword routes.
                  kws=[''] if company else keyword_values
                  for kw in kws:
                      for xxf in xxf_values:
                          case_no+=1
                          cb=callbacks[0]
                          form=[
                              ('disclosureType[]',''),('disclosureSubtype[]',''),('page','0'),
                              ('companyCd',company),('isNewThree','1'),
                              ('startTime','2015-01-01'),('endTime','2020-06-30'),
                              ('keyword',kw),('hyType[]',''),('xxfcbj[]',xxf),
                          ]
                          if ep.endswith('companyAnnouncement.do'):
                              form.extend([('noticeType[]',''),('siteId','1')])
                          for f in need: form.append(('needFields[]',f))
                          headers={
                              'User-Agent':UA,
                              'Origin':BASE,
                              'Referer':BASE+'/disclosure/announcement.html',
                              'X-Requested-With':'XMLHttpRequest',
                              'Accept':'text/javascript, application/javascript, application/ecmascript, application/x-ecmascript, */*; q=0.01',
                              'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
                          }
                          try:
                              r=s.post(BASE+ep,params={'callback':cb,'_':'1770000000000'},data=form,headers=headers,timeout=45,allow_redirects=True)
                              raw=r.text
                              print('\nCASE',case_no,'EP',ep,'COMPANY',repr(company),'KW',repr(kw),'XXF',repr(xxf),'STATUS',r.status_code,'FINAL',r.url,'LEN',len(raw),'CTYPE',r.headers.get('content-type'))
                              print('HEAD',repr(raw[:500]))
                              try:
                                  obj=parse_jsonp(raw,cb)
                              except Exception as exc:
                                  print('PARSE_ERROR',repr(exc)); continue
                              print('TOP_TYPE',type(obj).__name__)
                              if isinstance(obj,dict): print('TOP_KEYS',sorted(obj.keys()))
                              elif isinstance(obj,list): print('TOP_LEN',len(obj),'FIRST_TYPE',type(obj[0]).__name__ if obj else None)
                              rows=extract_rows(obj)
                              print('EXTRACTED_ROWS',len(rows))
                              for rec in rows:
                                  blob=json.dumps(rec,ensure_ascii=False,sort_keys=True)
                                  if any(t in blob for t in ('400062','二重','国重装','国机重装','年度报告')):
                                      print('MATCH',blob)
                                  else:
                                      print('ROW',blob)
                          except Exception as exc:
                              print('REQUEST_ERROR',repr(exc))
          PY
