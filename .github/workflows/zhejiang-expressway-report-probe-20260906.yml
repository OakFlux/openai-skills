name: Probe public Zhejiang Expressway report downloads 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-report-probe-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Python packages
        run: |
          python -m pip install --quiet requests beautifulsoup4 playwright
      - name: Inspect public report pages and viewers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          python - <<'PY'
          import json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('probe')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          urls={
            'fx_detail_sw':'https://www.fxbaogao.com/detail/5345667',
            'fx_view_sw':'https://www.fxbaogao.com/view?id=5345667',
            'sd_detail_sws':'https://www.sdyanbao.com/detail/886575',
            'fx_search_sws':'https://www.fxbaogao.com/search?keyword=%E6%B5%99%E6%B1%9F%E6%B2%AA%E6%9D%AD%E7%94%AC%20%E5%8C%BA%E5%9F%9F%E7%BB%8F%E6%B5%8E%E8%B5%8B%E8%83%BD%E8%BD%A6%E6%B5%81%E9%87%8F%E9%95%BF%E6%9C%9F%E5%A2%9E%E9%95%BF',
          }
          summary=[]
          for key,u in urls.items():
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              p=out/f'{key}.html'; p.write_bytes(r.content)
              print('REQ',key,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',key,soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              links=[]
              for tag in soup.find_all(['a','iframe','embed','object','script','img','source']):
                for attr in ['href','src','data','content']:
                  v=tag.get(attr)
                  if not v: continue
                  full=urllib.parse.urljoin(r.url,v)
                  blob=(full+' '+str(tag.attrs)).lower()
                  if any(x in blob for x in ['pdf','report','view','download','oss','public.fxbaogao','file','document']):
                    links.append({'tag':tag.name,'attr':attr,'url':full,'attrs':dict(tag.attrs)})
              for x in links[:150]: print('LINK',key,json.dumps(x,ensure_ascii=False),flush=True)
              for pat in [r'https?://[^\"\'<>\\s]+',r'(?i)[\"\']([^\"\']*(?:pdf|download|report|document|oss)[^\"\']*)[\"\']']:
                vals=[]
                for m in re.finditer(pat,r.text):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if v not in vals: vals.append(v)
                for v in vals[:100]: print('RAW',key,repr(v[:700]),flush=True)
              summary.append({'key':key,'status':r.status_code,'url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type')})
            except Exception as e:
              print('REQERR',key,repr(e),flush=True); summary.append({'key':key,'error':repr(e)})
          (out/'requests_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          out=Path('probe')
          targets={
            'fx_view_sw':'https://www.fxbaogao.com/view?id=5345667',
            'fx_detail_sw':'https://www.fxbaogao.com/detail/5345667',
            'sd_detail_sws':'https://www.sdyanbao.com/detail/886575',
          }
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(channel='chrome',headless=True,args=['--disable-dev-shm-usage','--no-sandbox'])
              context=await browser.new_context(locale='zh-CN',user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36')
              for key,u in targets.items():
                page=await context.new_page(); events=[]
                def on_response(resp):
                  ct=(resp.headers.get('content-type') or '').lower(); url=resp.url
                  if any(x in ct for x in ['pdf','json','image']) or any(x in url.lower() for x in ['pdf','download','report','document','oss','api/','view']):
                    events.append({'status':resp.status,'content_type':ct,'url':url})
                page.on('response',on_response)
                try:
                  resp=await page.goto(u,wait_until='domcontentloaded',timeout=120000)
                  await page.wait_for_timeout(12000)
                  print('PW',key,resp.status if resp else None,page.url,await page.title(),flush=True)
                  html=await page.content(); (out/f'{key}_pw.html').write_text(html,encoding='utf-8')
                  await page.screenshot(path=str(out/f'{key}.png'),full_page=True)
                  frames=[f.url for f in page.frames]
                  embeds=await page.locator('iframe, embed, object').evaluate_all("els => els.map(e => ({tag:e.tagName,src:e.src||e.data||'',outer:e.outerHTML.slice(0,1000)}))")
                  anchors=await page.locator('a').evaluate_all("els => els.map(e => ({text:(e.innerText||'').trim(),href:e.href})).filter(x => /完整|下载|PDF|查看|报告/.test(x.text+x.href)).slice(0,100)")
                  state=await page.evaluate("() => ({href:location.href, cookies:document.cookie, local:{...localStorage}, session:{...sessionStorage}, globals:Object.keys(window).filter(k=>/pdf|report|file|download/i.test(k)).slice(0,100)})")
                  print('FRAMES',key,json.dumps(frames,ensure_ascii=False),flush=True)
                  print('EMBEDS',key,json.dumps(embeds,ensure_ascii=False),flush=True)
                  print('ANCHORS',key,json.dumps(anchors,ensure_ascii=False),flush=True)
                  print('STATE',key,json.dumps(state,ensure_ascii=False)[:10000],flush=True)
                  ded=[]; seen=set()
                  for e in events:
                    sig=(e['status'],e['content_type'],e['url'])
                    if sig not in seen: seen.add(sig); ded.append(e)
                  (out/f'{key}_network.json').write_text(json.dumps(ded,ensure_ascii=False,indent=2),encoding='utf-8')
                  for e in ded[:300]: print('NET',key,json.dumps(e,ensure_ascii=False),flush=True)
                except Exception as e:
                  print('PWERR',key,repr(e),flush=True)
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-report-probe
          path: probe/
          if-no-files-found: error
          retention-days: 7
