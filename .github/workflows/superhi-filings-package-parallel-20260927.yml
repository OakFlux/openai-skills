name: Build Super Hi filings package parallel 20260927
on:
  push:
    paths:
      - '.github/workflows/superhi-filings-package-parallel-20260927.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf playwright
          python -m playwright install chromium
      - name: Fetch package builder
        run: |
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/OakFlux/inference-sh-skills/main/scripts/build_superhi_filings_20260927.py -o scripts/build_superhi_filings_20260927.py
          curl -fsSL https://raw.githubusercontent.com/OakFlux/inference-sh-skills/main/scripts/run_superhi_filings_v7.py -o scripts/run_superhi_filings_v7.py
          curl -fsSL https://raw.githubusercontent.com/OakFlux/inference-sh-skills/main/scripts/run_superhi_filings_v8.py -o scripts/run_superhi_filings_v8.py
      - name: Build package
        run: python scripts/run_superhi_filings_v8.py
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: superhi-09658-hdl-filings-package-parallel
          path: 特海国际_09658_HDL_2022-2025全部年报_上市及招股文件_2026最新定期报告.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
