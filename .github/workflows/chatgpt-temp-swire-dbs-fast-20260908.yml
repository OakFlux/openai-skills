name: chatgpt-temp-swire-dbs-fast-20260908
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-swire-dbs-fast-20260908.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and package official PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf pymupdf pillow
          python <<'PY'
          import hashlib,json,re,time,zipfile
          from pathlib import Path
          import requests,pymupdf
          from PIL import Image,ImageStat
          from pypdf import PdfReader

          W=Path('swire_fast');ROOT=W/'太古地产_01972_券商研究报告';P=ROOT/'PDF';Q=W/'qa';P.mkdir(parents=True,exist_ok=True);Q.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://www.dbs.com.hk/treasures/aics/','Accept-Language':'en-US,en;q=0.9'})
          specs=[
            {'date':'2026-08-07','title':'Swire Properties — Company Guide','kind':'Company Guide / 公司深度覆盖','urls':['https://www.dbs.com.hk/content/article/pdf/000000_HK/1972_HK.pdf','https://www.dbs.com.sg/content/article/pdf/000000_HK/1972_HK.pdf']},
            {'date':'2026-08-07','title':'Result Analysis: Boosted by strong luxury residential sales','kind':'Result Analysis / 公司跟踪研究','urls':['https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2026/08/1972_HK_Equity_57_07082026.pdf','https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2026/08/1972_HK_Equity_48_07082026.pdf']},
            {'date':'2026-03-13','title':'Result Analysis: Core operations showing sequential improvement','kind':'Result Analysis / 公司跟踪研究','urls':['https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2026/03/1972_HK_Equity_57_13032026.pdf','https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2026/03/1972_HK_Equity_48_13032026.pdf']},
            {'date':'2026-02-16','title':'Core operations showing improving signs','kind':'Company Update / 公司跟踪研究','urls':['https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2026/02/1972_HK_Equity_57_16022026.pdf','https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2026/02/1972_HK_Equity_48_16022026.pdf']},
            {'date':'2025-08-08','title':'Decent asset disposal gains','kind':'Result Analysis / 公司跟踪研究','urls':['https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2025/08/1972_HK_Equity_57_08082025.pdf','https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2025/08/1972_HK_Equity_48_08082025.pdf']},
            {'date':'2025-08-01','title':'Monetising its Miami assets','kind':'Company Update / 公司跟踪研究','urls':['https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2025/08/1972_HK_Equity_57_01082025.pdf','https://www.dbs.com.sg/content/article/pdf/1972_HK_Equity/2025/08/1972_HK_Equity_57_01082025.pdf']},
            {'date':'2025-06-30','title':'Unlocking the value of Brickell City Centre shopping mall','kind':'Company Update / 公司跟踪研究','urls':['https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2025/06/1972_HK_Equity_57_30062025.pdf','https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2025/06/1972_HK_Equity_48_30062025.pdf']},
            {'date':'2025-03-14','title':'Continued share buyback to support share price','kind':'Result Analysis / 公司跟踪研究','urls':['https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2025/03/1972_HK_Equity_57_14032025.pdf','https://www.dbs.com.hk/content/article/pdf/1972_HK_Equity/2025/03/1972_HK_Equity_48_14032025.pdf']},
          ]
          logs=[];found=[];seen=set()
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          def safe(x):return re.sub(r'[\\/:*?"<>|]+','_',x)[:170]
          for si,sp in enumerate(specs):
            for u in sp['urls']:
              try:r=s.get(u,timeout=35,allow_redirects=True)
              except Exception as e:L(f'ERROR {u} {e!r}');continue
              L(f'GET {sp["date"]} {sp["title"]} HTTP={r.status_code} bytes={len(r.content)} type={r.headers.get("content-type")} final={r.url}')
              d=r.content
              if r.status_code!=200 or not d.startswith(b'%PDF-') or len(d)<30000:continue
              sha=hashlib.sha256(d).hexdigest()
              if sha in seen:continue
              tmp=W/f'tmp_{si}.pdf';tmp.write_bytes(d)
              try:
                pages=len(PdfReader(str(tmp),strict=False).pages);doc=pymupdf.open(str(tmp));text=''.join(doc[i].get_text() for i in range(min(5,pages)))
                if pages<2 or doc.page_count!=pages:raise ValueError('bad pages')
                if not any(k.lower() in text.lower() for k in ['swire properties','1972 hk','1972.hk','01972','太古地产','太古地產']):raise ValueError('wrong company')
                checks=[]
                for pn,suf in [(0,'first'),(pages//2,'middle'),(pages-1,'last')]:
                  pix=doc[pn].get_pixmap(matrix=pymupdf.Matrix(1.1,1.1),alpha=False);png=Q/f'{si}_{suf}.png';pix.save(str(png));sd=ImageStat.Stat(Image.open(png).convert('L').resize((64,64))).stddev[0]
                  if sd<1:raise ValueError('blank')
                  checks.append({'page':pn+1,'stddev':round(sd,4)})
                doc.close()
              except Exception as e:L(f'REJECT {u} {e!r}');tmp.unlink(missing_ok=True);continue
              fn=safe(f'{sp["date"]}_DBS_太古地产_{sp["title"]}')+'.pdf';dest=P/fn;tmp.replace(dest)
              rec={**sp,'institution':'DBS Bank / 星展银行','pages':pages,'filename':'PDF/'+fn,'size_bytes':len(d),'sha256':sha,'source_url':r.url,'render_checks':checks}
              found.append(rec);seen.add(sha);L('VALID '+json.dumps(rec,ensure_ascii=False));break

          # Prefer the company guide and newest two distinct updates.
          guides=[r for r in found if 'Company Guide' in r['kind']]
          updates=sorted([r for r in found if 'Company Guide' not in r['kind']],key=lambda x:x['date'],reverse=True)
          chosen=(guides[:1]+updates[:2])[:3]
          if len(chosen)<2:raise RuntimeError(f'Only {len(chosen)} usable official PDFs; all found={len(found)}')
          # Remove unchosen PDFs.
          keep={r['filename'].split('/',1)[1] for r in chosen}
          for f in P.glob('*.pdf'):
            if f.name not in keep:f.unlink()
          notes=['太古地产（01972.HK）券商研究报告资料包','整理日期：2026-09-08','','文件清单：']+[f'{i}. {r["date"]} | {r["institution"]} | {r["title"]} | {r["pages"]}页 | {r["kind"]}' for i,r in enumerate(chosen,1)]+['','说明：','1. 全部PDF来自星展银行官方网站，为完整文件。','2. Company Guide为公司完整覆盖报告，其余为公司业绩或重大事项跟踪研究。','3. 已核验PDF文件头、公司名称、实际页数，并渲染检查首、中、尾页。','4. 仅供研究参考，版权归星展银行及作者所有。']
          (ROOT/'文件说明.txt').write_text('\n'.join(notes)+'\n',encoding='utf-8');(ROOT/'manifest.json').write_text(json.dumps({'company':'太古地产有限公司','stock_code':'01972.HK','checked_as_of':'2026-09-08','report_count':len(chosen),'reports':chosen},ensure_ascii=False,indent=2),encoding='utf-8');(ROOT/'SHA256SUMS.txt').write_text('\n'.join(f'{r["sha256"]}  {r["filename"]}' for r in chosen)+'\n',encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          z=W/f'Swire_Properties_01972_Broker_Reports_{len(chosen)}.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for f in ROOT.rglob('*'):
              if f.is_file():zz.write(f,arcname=str(ROOT.name/f.relative_to(ROOT)))
          with zipfile.ZipFile(z) as zz:assert zz.testzip() is None;assert len([n for n in zz.namelist() if n.lower().endswith('.pdf')])==len(chosen)
          meta={'filename':z.name,'size_bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'report_count':len(chosen),'reports':chosen};(W/'zip_metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');print('FINAL '+json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Swire-Properties-Official-Reports-Fast
          path: |
            swire_fast/Swire_Properties_01972_Broker_Reports_*.zip
            swire_fast/zip_metadata.json
            swire_fast/run.log
          retention-days: 1
          compression-level: 0
