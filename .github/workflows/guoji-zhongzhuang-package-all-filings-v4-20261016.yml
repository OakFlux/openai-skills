name: Package Guoji Zhongzhuang complete filings v4 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-package-all-filings-v4-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Patch archival PDF validation
        run: python .github/scripts/patch_guoji_archival_pdf_validation_20261016.py
      - name: Patch NEEQ annual title matching
        run: python .github/scripts/patch_guoji_neeq_annual_title_20261016.py
      - name: Download validate and package filings
        run: python .github/scripts/guoji_zhongzhuang_package_20261016.py
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: guoji-zhongzhuang-601399-complete-filings-v4-20261016
          path: |
            国机重装_601399_上市以来全部年报_招股说明书及最新季报_截至20261016.zip
            guoji_zhongzhuang_601399_all_annual_reports_prospectus_latest_quarter_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
