name: Build verified Huabao International reports package
on:
  push:
    branches: [tmp-huabao-final-package-20260908]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow
      - name: Download, verify, and package official reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/reports work/renders
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import shutil
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('output')
          REPORT_DIR = Path('work/reports')
          RENDER_DIR = Path('work/renders')

          reports = [
              {
                  'seq': 1,
                  'type': '年度报告',
                  'year': 2020,
                  'release_date': '2021-04-08',
                  'title': '2020 ANNUAL REPORT / 2020年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0408/2021040801530.pdf',
                  'filename': '01_华宝国际_2020年年度报告.pdf',
              },
              {
                  'seq': 2,
                  'type': '年度报告',
                  'year': 2021,
                  'release_date': '2022-04-11',
                  'title': '2021 ANNUAL REPORT / 2021年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2022/0411/2022041100441.pdf',
                  'filename': '02_华宝国际_2021年年度报告.pdf',
              },
              {
                  'seq': 3,
                  'type': '年度报告',
                  'year': 2022,
                  'release_date': '2023-04-20',
                  'title': '2022 ANNUAL REPORT / 2022年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2023/0420/2023042001335.pdf',
                  'filename': '03_华宝国际_2022年年度报告.pdf',
              },
              {
                  'seq': 4,
                  'type': '年度报告',
                  'year': 2023,
                  'release_date': '2024-04-17',
                  'title': '2023 ANNUAL REPORT / 2023年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0417/2024041700243.pdf',
                  'filename': '04_华宝国际_2023年年度报告.pdf',
              },
              {
                  'seq': 5,
                  'type': '年度报告',
                  'year': 2024,
                  'release_date': '2025-04-16',
                  'title': '2024 ANNUAL REPORT / 2024年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0416/2025041600353.pdf',
                  'filename': '05_华宝国际_2024年年度报告.pdf',
              },
              {
                  'seq': 6,
                  'type': '年度报告',
                  'year': 2025,
                  'release_date': '2026-04-10',
                  'title': '2025 ANNUAL REPORT / 2025年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0410/2026041000338.pdf',
                  'filename': '06_华宝国际_2025年年度报告.pdf',
              },
              {
                  'seq': 7,
                  'type': '最新集团财务披露',
                  'year': 2026,
                  'release_date': '2026-08-26',
                  'title': 'ANNOUNCEMENT OF INTERIM RESULTS FOR THE SIX MONTHS ENDED 30 JUNE 2026',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0826/2026082601893.pdf',
                  'filename': '07_华宝国际_2026年中期业绩公告_最新集团财务披露.pdf',
              },
              {
                  'seq': 8,
                  'type': '最新完整中期报告补充',
                  'year': 2025,
                  'release_date': '2025-09-03',
                  'title': '2025 INTERIM REPORT / 2025中期報告',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0903/2025090300946.pdf',
                  'filename': '08_华宝国际_2025年中期报告_完整报告补充.pdf',
              },
          ]

          retry = Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=1.2,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=frozenset(['GET']),
          )
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          manifest = []
          render_paths = []

          for spec in reports:
              path = REPORT_DIR / spec['filename']
              last_error = None
              for attempt in range(1, 8):
                  try:
                      response = session.get(
                          spec['url'],
                          headers={'Accept': 'application/pdf,*/*'},
                          timeout=(45, 300),
                          stream=False,
                      )
                      print('DOWNLOAD', spec['seq'], attempt, response.status_code, len(response.content), spec['url'], flush=True)
                      response.raise_for_status()
                      data = response.content
                      if b'%PDF-' not in data[:2048]:
                          raise RuntimeError('Missing PDF signature')
                      if len(data) < 100_000:
                          raise RuntimeError(f'PDF unexpectedly small: {len(data)} bytes')

                      reader = PdfReader(io.BytesIO(data), strict=False)
                      page_count = len(reader.pages)
                      minimum_pages = 50 if spec['type'] == '年度报告' else 5
                      if page_count < minimum_pages:
                          raise RuntimeError(f'Page count too small: {page_count}')

                      sample_parts = []
                      sample_indices = list(range(min(8, page_count)))
                      if page_count > 8:
                          sample_indices.append(page_count - 1)
                      for index in sample_indices:
                          try:
                              sample_parts.append(reader.pages[index].extract_text() or '')
                          except Exception:
                              pass
                      sample = '\n'.join(sample_parts).upper()
                      if not any(marker in sample for marker in ['HUABAO INTERNATIONAL', '華寶國際', '华宝国际']):
                          raise RuntimeError('Company identity was not found in sampled pages')
                      if str(spec['year']) not in sample:
                          raise RuntimeError(f'Report year {spec["year"]} was not found in sampled pages')

                      path.write_bytes(data)
                      break
                  except Exception as exc:
                      last_error = exc
                      print('RETRY', spec['seq'], attempt, repr(exc), flush=True)
                      time.sleep(min(2 ** attempt, 20))
              else:
                  raise RuntimeError(f'Failed to obtain {spec["filename"]}: {last_error!r}')

              file_data = path.read_bytes()
              sha256 = hashlib.sha256(file_data).hexdigest()

              # Render the first page and a later page to confirm the PDF is visually usable.
              document = pymupdf.open(path)
              if document.page_count != page_count:
                  raise RuntimeError(f'Parser disagreement for {path.name}: {document.page_count} vs {page_count}')
              first = document[0].get_pixmap(matrix=pymupdf.Matrix(1.15, 1.15), alpha=False)
              first_render = RENDER_DIR / f'{spec["seq"]:02d}_first.png'
              first.save(str(first_render))
              later_index = min(document.page_count - 1, max(1, document.page_count // 2))
              later = document[later_index].get_pixmap(matrix=pymupdf.Matrix(0.6, 0.6), alpha=False)
              later_render = RENDER_DIR / f'{spec["seq"]:02d}_sample.png'
              later.save(str(later_render))
              document.close()
              render_paths.append(first_render)

              manifest.append({
                  '序号': spec['seq'],
                  '文件名': spec['filename'],
                  '报告类型': spec['type'],
                  '报告年度': spec['year'],
                  '港交所披露日期': spec['release_date'],
                  '港交所标题': spec['title'],
                  'PDF页数': page_count,
                  '文件大小_字节': len(file_data),
                  'SHA256': sha256,
                  '港交所原始来源': spec['url'],
              })
              print('VERIFIED', spec['filename'], page_count, len(file_data), sha256, flush=True)

          if len(manifest) != 8 or sum(1 for row in manifest if row['报告类型'] == '年度报告') != 6:
              raise RuntimeError(f'Unexpected manifest composition: {len(manifest)} files')

          manifest_path = REPORT_DIR / '文件清单与校验值.csv'
          with manifest_path.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest[0].keys()))
              writer.writeheader()
              writer.writerows(manifest)

          readme_lines = [
              '华宝国际控股有限公司（00336.HK）2020-2025年报及最新财务报告资料包',
              '打包日期：2026-09-08',
              '',
              '文件范围：',
              '1. 2020年至2025年年度报告，共6份；报告本身为中英双语。',
              '2. 2026年中期业绩公告：截至打包日最新的华宝国际集团层面财务披露。',
              '3. 2025年完整中期报告：在2026年完整中期报告尚未发布时作为最新完整中期报告补充。',
              '',
              '说明：华宝国际是香港上市公司，不按A股格式发布集团层面第一季度及第三季度报告。',
              '2026年4月披露的三个月财务指标属于上市子公司华宝香精，并非华宝国际集团季度报告，因此未作为集团季报收入。',
              '',
              '全部PDF均取自港交所披露易。已核验PDF文件头、可解析性、实际页数、公司名称、报告年度及抽样页面渲染。',
              '压缩包已完成ZIP CRC完整性测试；SHA-256见文件清单。',
              '',
          ]
          for row in manifest:
              readme_lines.extend([
                  f"{row['序号']}. {row['报告类型']}｜{row['报告年度']}｜披露日 {row['港交所披露日期']}｜{row['PDF页数']}页",
                  f"   文件：{row['文件名']}",
                  f"   来源：{row['港交所原始来源']}",
                  '',
              ])
          (REPORT_DIR / 'README.txt').write_text('\n'.join(readme_lines), encoding='utf-8')

          # First-page contact sheet for manual QA.
          cards = []
          for index, render_path in enumerate(render_paths, 1):
              with Image.open(render_path) as image:
                  rgb = image.convert('RGB')
                  rgb.thumbnail((380, 540))
                  card = Image.new('RGB', (420, 590), 'white')
                  card.paste(rgb, ((420 - rgb.width) // 2, 10))
                  ImageDraw.Draw(card).text((15, 555), f'{index:02d}', fill='black')
                  cards.append(card)
          columns = 4
          rows = (len(cards) + columns - 1) // columns
          sheet = Image.new('RGB', (420 * columns, 590 * rows), 'white')
          for index, card in enumerate(cards):
              sheet.paste(card, ((index % columns) * 420, (index // columns) * 590))
              card.close()
          sheet.save(OUT / 'first_page_contact_sheet.jpg', quality=90)
          sheet.close()

          archive = OUT / 'Huabao_International_00336_2020-2025_Annual_and_Latest_Reports.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as package:
              for path in sorted(REPORT_DIR.iterdir()):
                  package.write(path, arcname=path.name)

          with zipfile.ZipFile(archive, 'r') as package:
              bad = package.testzip()
              pdf_names = [name for name in package.namelist() if name.lower().endswith('.pdf')]
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failed at {bad}')
              if len(pdf_names) != 8:
                  raise RuntimeError(f'Expected 8 PDFs, found {len(pdf_names)}')

          result = {
              'ok': True,
              'archive': archive.name,
              'archive_bytes': archive.stat().st_size,
              'pdf_count': 8,
              'zip_crc_ok': True,
              'reports': manifest,
          }
          (OUT / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PACKAGE_OK', json.dumps(result, ensure_ascii=False), flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: huabao-international-verified-reports
          path: output/*
          retention-days: 1
          if-no-files-found: error
