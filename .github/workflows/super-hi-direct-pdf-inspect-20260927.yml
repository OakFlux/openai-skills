name: Inspect Super Hi direct research PDFs 20260927

on:
  push:
    paths:
      - '.github/workflows/super-hi-direct-pdf-inspect-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Inspect candidate PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          urls=[
            'https://pdf.dfcfw.com/pdf/H3_AP202508281735801275_1.pdf',
            'https://pdf.dfcfw.com/pdf/H3_AP202505071668720837_1.pdf',
            'https://pdf.dfcfw.com/pdf/H3_AP202409021639649646_1.pdf',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'})
          for i,u in enumerate(urls,1):
            p=Path(f'candidate_{i}.pdf')
            r=s.get(u,timeout=(30,180)); print('GET',i,r.status_code,len(r.content),r.url,flush=True); r.raise_for_status(); p.write_bytes(r.content)
            print('HEAD',p.read_bytes()[:8],flush=True)
            rd=PdfReader(str(p),strict=False); pages=len(rd.pages)
            text=''
            for pg in rd.pages[:min(12,pages)]:
              try: text+='\n'+(pg.extract_text() or '')
              except Exception as e: text+=f'\n[EXTRACT_ERR {e!r}]'
            compact=re.sub(r'\s+','',text)
            print('META',json.dumps({'index':i,'pages':pages,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'company_terms':[x for x in ['特海国际','特海國際','Super Hi International','SuperHi','09658','9658','HDL'] if x in compact]},ensure_ascii=False),flush=True)
            print('TEXT_BEGIN',i,flush=True)
            print(text[:12000],flush=True)
            print('TEXT_END',i,flush=True)
          PY
