name: Probe Qingsong Health 02661 filing links 20260919

on:
  push:
    paths:
      - '.github/workflows/qingsong-health-02661-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe official filing pages
        shell: bash
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
          })
          urls = [
              'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=1000282434',
              'https://ir.qingsonghealth.com/prospectus/index.html?lang=en',
              'https://ir.qingsonghealth.com/performance/index.html?lang=en',
              'https://ir.qingsonghealth.com/announcements/index.html?lang=en',
          ]
          for url in urls:
              print('\n=== URL', url, flush=True)
              try:
                  r = s.get(url, timeout=90, allow_redirects=True)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'TYPE', r.headers.get('content-type'), 'LEN', len(r.content), flush=True)
                  text = r.text
                  soup = BeautifulSoup(text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      label = ' '.join(a.get_text(' ', strip=True).split())
                      href = a.get('href')
                      hay = (label + ' ' + href).lower()
                      if any(k in hay for k in ['interim', 'annual report', 'global offering', 'prospectus', '.pdf', '2026']):
                          print('ANCHOR', repr(label), href, flush=True)
                  for m in sorted(set(re.findall(r'https?://[^\"\'<> ]+?\.pdf(?:\?[^\"\'<> ]*)?', text, re.I))):
                      print('PDFURL', m, flush=True)
                  print('TEXT_HEAD', text[:4000].replace('\n',' '), flush=True)
              except Exception as e:
                  print('ERROR', repr(e), flush=True)
          PY
