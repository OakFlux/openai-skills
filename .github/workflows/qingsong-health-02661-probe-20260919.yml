name: Probe Qingsong Health 02661 filing links 20260919

on:
  push:
    paths:
      - '.github/workflows/qingsong-health-02661-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Probe Chinese PDF variants and IR API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from io import BytesIO
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-HK,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          print('=== HKEX Chinese title-search variants ===')
          for lang in ['ZH','zh','TC','C']:
              url=f'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang={lang}&market=SEHK&stockId=1000282434'
              try:
                  r=s.get(url,timeout=60)
                  print('LANG',lang,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url)
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.find_all('a',href=True):
                      label=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      h=(label+' '+href).lower()
                      if any(k in h for k in ['annual report','interim report','global offering','年報','中期報告','全球發售','招股']):
                          print('TITLE',lang,repr(label),href)
              except Exception as e:
                  print('LANGERR',lang,repr(e))

          print('=== Inferred HKEX Chinese PDF variants ===')
          candidates = {
              'annual_c_1568':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041701568_c.pdf',
              'annual_c_1567':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041701567_c.pdf',
              'interim_c_1506':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401506_c.pdf',
              'interim_c_1505':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401505_c.pdf',
              'prospectus_c_0032':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1215/2025121500032_c.pdf',
              'prospectus_c_0031':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1215/2025121500031_c.pdf',
              'interim_results_c_1502':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401502_c.pdf',
          }
          for name,url in candidates.items():
              try:
                  with s.get(url,timeout=(20,180),stream=True,allow_redirects=True) as r:
                      first=b''
                      total=0
                      for chunk in r.iter_content(1024*1024):
                          if not chunk: continue
                          if not first: first=chunk[:16]
                          total += len(chunk)
                          if total > 12_000_000: break
                      print('PDFPROBE',name,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'CL',r.headers.get('content-length'),'READ',total,'HEAD',first,'FINAL',r.url)
              except Exception as e:
                  print('PDFERR',name,repr(e))

          print('=== IR JavaScript and API endpoints ===')
          for jsurl in [
              'https://ir.qingsonghealth.com/assets/js/ir-frontend.js',
              'https://ir.qingsonghealth.com/assets/ir/js/common.js',
              'https://ir.qingsonghealth.com/assets/ir/js/frontend/prospectus.js',
          ]:
              try:
                  r=s.get(jsurl,timeout=60)
                  print('JS',jsurl,r.status_code,len(r.content),r.headers.get('content-type'))
                  for line in r.text.splitlines():
                      if any(k in line.lower() for k in ['baseurl','client/prospectus','axios','api/']):
                          print('JSLINE',line[:800])
              except Exception as e:
                  print('JSERR',jsurl,repr(e))

          endpoints=[]
          for base in ['https://ir.qingsonghealth.com/','https://ir.qingsonghealth.com/api/','https://ir.qingsonghealth.com/index.php/']:
              for path in ['client/prospectus/list','ir/client/prospectus/list']:
                  for lang in ['en','zh-hk','zh-cn']:
                      endpoints.append((urljoin(base,path),lang))
          seen=set()
          for url,lang in endpoints:
              key=(url,lang)
              if key in seen: continue
              seen.add(key)
              try:
                  r=s.get(url,params={'lang':lang},headers={'X-Requested-With':'XMLHttpRequest'},timeout=60)
                  print('API',r.url,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'BODY',r.text[:2500].replace('\n',' '))
              except Exception as e:
                  print('APIERR',url,lang,repr(e))
          PY
