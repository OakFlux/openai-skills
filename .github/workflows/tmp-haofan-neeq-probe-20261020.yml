name: Probe Haofan NEEQ PDF URLs

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-neeq-probe-20261020.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe URLs
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            'http://www.neeq.com.cn/disclosure/2017/2017-05-09/1494315036_015624.pdf'
            'https://www.neeq.com.cn/disclosure/2017/2017-05-09/1494315036_015624.pdf'
            'http://www.neeq.com.cn/disclosure/2017/2017-04-05/1491377987_174187.pdf'
            'https://www.neeq.com.cn/disclosure/2017/2017-04-05/1491377987_174187.pdf'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            rm -f out.bin headers.txt
            curl --http1.1 -L --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -A 'Mozilla/5.0' -D headers.txt "$u" -o out.bin
            rc=$?
            echo "RC=$rc SIZE=$(stat -c%s out.bin 2>/dev/null || echo 0) PREFIX=$(head -c 16 out.bin 2>/dev/null | xxd -p || true)"
            cat headers.txt || true
          done
