name: Inspect Galaxy report article images

on:
  push:
    branches: [tmp-hegang-000709-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hegang-galaxy-images-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Print article image URLs
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          url='https://finance.sina.com.cn/stock/stockzmt/2025-04-16/doc-inetifie3675049.shtml'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req,timeout=120).read().decode('utf-8','ignore')
          print('HTML_BYTES',len(text))
          urls=[]
          for m in re.finditer(r'<img[^>]+(?:src|data-src)=["\']([^"\']+)',text,re.I):
              u=html.unescape(m.group(1))
              if u.startswith('//'): u='https:'+u
              if u.startswith('http') and u not in urls: urls.append(u)
          for i,u in enumerate(urls,1): print(i,u)
          PY
