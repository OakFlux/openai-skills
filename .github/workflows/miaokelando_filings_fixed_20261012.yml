name: Miaokelando Annual Reports and Latest Quarter Fixed

on:
  push:
    branches:
      - chatgpt-miaokelando-filings-20261012
    paths:
      - scripts/run_miaokelando_filings_fixed_20261012.py
      - .github/workflows/miaokelando_filings_fixed_20261012.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/run_miaokelando_filings_fixed_20261012.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload corrected package
        uses: actions/upload-artifact@v4
        with:
          name: miaokelando-filings-package-fixed
          path: |
            output/miaokelando_2020_2025_annual_reports_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
