name: chatgpt-temp-seg-js-inspect-20260908
on:
  push:
    branches: [chatgpt-temp-china-lesso-reports-20260908]
    paths: ['.github/workflows/chatgpt-temp-seg-js-inspect-20260908.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect JS bundles
        shell: bash
        run: |
          mkdir -p seg_js
          python <<'PY'
          import re,requests,json
          from pathlib import Path
          base='https://www.sustainabilityreports.com'
          paths=[
            '/_next/static/chunks/app/%5Bcompany%5D/%5Byear%5D/%5Breport%5D/page-61ae5cd133cf165c.js',
            '/_next/static/chunks/6206-8b7dbce39c573a3a.js',
            '/_next/static/chunks/2054-280202a8de59f306.js',
            '/_next/static/chunks/3087-a6936cd35ff0f916.js',
            '/_next/static/chunks/3020-32f1526a3a14a033.js',
            '/_next/static/chunks/5599-518d20d65e8a9788.js',
            '/_next/static/chunks/6965-55d6d63eb3add120.js',
            '/_next/static/chunks/9172-5ecb7dc69a1ca92b.js',
            '/_next/static/chunks/1356-eace4b7614bdb664.js',
            '/_next/static/chunks/2318-d6f8b60bd21a7818.js',
            '/_next/static/chunks/4018-507f2729c0f4ac21.js',
          ]
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          matches=[]
          tokens=['api/public/reports','/download','downloadUrl','fileUrl','pdfUrl','documentUrl','blob.core','srstorage','sr-cdn','reportId','signed','sas','thumbnailUrl','storageUrl','pdf']
          for i,p in enumerate(paths):
            u=base+p;r=s.get(u,timeout=60)
            print('FETCH',i,r.status_code,len(r.content),u,r.headers.get('content-type'),flush=True)
            fn=Path('seg_js')/f'{i:02d}.js';fn.write_bytes(r.content)
            text=r.text
            low=text.lower()
            for tok in tokens:
              pos=0;n=0
              while n<50:
                j=low.find(tok.lower(),pos)
                if j<0:break
                a=max(0,j-1500);b=min(len(text),j+3500)
                ctx=text[a:b]
                row={'file':str(fn),'token':tok,'pos':j,'context':ctx}
                matches.append(row)
                print('\nMATCH',i,tok,j,'\n',ctx[:5000],flush=True)
                pos=j+len(tok);n+=1
          Path('seg_js/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          # Probe plausible direct storage patterns for 2020.
          stems=['XHKG_2386_2020_AR1','XHKG_2386_2020_AR']
          hosts=['https://srstoragewe.blob.core.windows.net','https://sr-cdn-g6b0djh2egcydgaf.z01.azurefd.net']
          containers=['reports','report','documents','docs','pdf','pdfs','files','public','download','annual-reports','']
          suffixes=['.pdf','/XHKG_2386_2020_AR1.pdf','/download']
          for host in hosts:
            for cont in containers:
              for stem in stems:
                paths2=[]
                if cont: paths2 += [f'/{cont}/XHKG_2386/{stem}.pdf',f'/{cont}/{stem}.pdf']
                else: paths2 += [f'/XHKG_2386/{stem}.pdf',f'/{stem}.pdf']
                for pp in paths2:
                  u=host+pp
                  try:
                    rr=s.get(u,timeout=20,allow_redirects=True,stream=True)
                    ct=rr.headers.get('content-type','');cl=rr.headers.get('content-length','')
                    head=next(rr.iter_content(16),b'')
                    if rr.status_code not in (404,403) or head.startswith(b'%PDF'):
                      print('PROBE_HIT',rr.status_code,ct,cl,head,u,rr.url,flush=True)
                  except Exception as e: pass
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SEG-JS-inspection
          path: seg_js
          retention-days: 1
          compression-level: 6