name: Temporary Reportify download probe for Aixin reports

on:
  push:
    branches:
      - tmp-reportify-download-probe-aixin-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe APIs and download files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io
          import json
          import re
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Accept':'application/json,text/plain,*/*',
            'Origin':'https://reportify.cn',
            'Referer':'https://reportify.cn/',
          })
          ids=['1278761946887360512','1246890949045522432','1262379005902983168','1262413294237519872']
          base='https://api.reportify.cn'
          results={}
          for rid in ids:
            rec={}
            for suffix in ['', '/permissions', '/download', '/analysis']:
              url=f'{base}/reports/{rid}{suffix}'
              try:
                r=s.get(url,timeout=(20,90),allow_redirects=True)
                ct=r.headers.get('content-type','')
                body=r.content
                print('GET',rid,suffix or '/',r.status_code,len(body),ct,r.url,flush=True)
                item={'status':r.status_code,'bytes':len(body),'content_type':ct,'final_url':r.url,'headers':dict(r.headers)}
                try:
                  obj=r.json(); item['json']=obj
                  print('JSON',rid,suffix or '/',json.dumps(obj,ensure_ascii=False)[:5000],flush=True)
                except Exception:
                  item['text']=r.text[:10000]
                  print('TEXT',rid,suffix or '/',r.text[:2000],flush=True)
                rec[suffix or '/']=item
                (out/f'{rid}_{(suffix.strip("/") or "detail")}.json').write_text(json.dumps(item,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
                # Extract URLs and try them if download response exposed anything.
                if suffix=='/download':
                  candidates=[]
                  def walk(v):
                    if isinstance(v,dict):
                      for x in v.values(): walk(x)
                    elif isinstance(v,list):
                      for x in v: walk(x)
                    elif isinstance(v,str) and v.startswith(('http://','https://')):
                      candidates.append(v)
                  try: walk(r.json())
                  except Exception:
                    candidates += re.findall(r'https?://[^\s\"\'<>]+',r.text)
                  for ci,u in enumerate(dict.fromkeys(candidates)):
                    try:
                      rr=s.get(u,headers={'Referer':f'https://reportify.cn/reports/{rid}','Accept':'application/pdf,application/octet-stream,*/*'},timeout=(30,240),allow_redirects=True)
                      data=rr.content
                      print('CANDIDATE',rid,ci,rr.status_code,len(data),rr.headers.get('content-type'),rr.url,flush=True)
                      if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                        pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                        p=out/f'{rid}.pdf'; p.write_bytes(data)
                        rec['downloaded']={'url':u,'final_url':rr.url,'bytes':len(data),'pages':pages,'file':p.name}
                        print('PDF_OK',rid,pages,len(data),rr.url,flush=True)
                        break
                    except Exception as e:
                      print('CANDIDATE_ERROR',rid,ci,repr(e),flush=True)
              except Exception as e:
                rec[suffix or '/']={'error':repr(e)}
                print('GET_ERROR',rid,suffix or '/',repr(e),flush=True)
            results[rid]=rec
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: reportify-aixin-download-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
