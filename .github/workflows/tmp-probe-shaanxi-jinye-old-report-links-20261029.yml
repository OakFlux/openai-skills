name: Probe Shaanxi Jinye old report links

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Parse legacy report pages
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          pages=[
            ('P5W_2011','https://www.p5w.net/stock/lzft/gsyj/201105/t3592653.htm'),
            ('HIBOR_2011','https://p.hibor.com.cn/Archiver/201105.html'),
            ('HIBOR_2008','https://p.hibor.com.cn/archiver/200812.html'),
          ]
          targets=['陕西金叶','春风吹渭水','烟标行业整合']
          for label,u in pages:
            try:
              r=s.get(u,timeout=(15,60),allow_redirects=True)
              print('\nPAGE',label,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              enc=r.apparent_encoding or r.encoding or 'utf-8'; r.encoding=enc
              text=html.unescape(r.text).replace('\\/','/')
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title,'ENC',enc)
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a.get('href'))
                txt=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                parent=re.sub(r'\s+',' ',a.parent.get_text(' ',strip=True)) if a.parent else ''
                if any(t in txt or t in parent or t in href for t in targets) or '.pdf' in href.lower() or '附件' in txt or '下载' in txt:
                  print('LINK',repr(txt[:300]),href,'PARENT',repr(parent[:500]))
              for m in re.findall(r'https?://[^\s\"\'<>]+',text,flags=re.I):
                if '.pdf' in m.lower() or any(t in m for t in targets): print('RAWURL',m[:1000])
              for m in re.findall(r'[^\s\"\'<>]+\.pdf(?:\?[^\s\"\'<>]*)?',text,flags=re.I):
                print('PDFLIKE',urljoin(r.url,m)[:1000])
            except Exception as e: print('ERROR',label,repr(e))
          PY
