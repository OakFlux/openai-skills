name: Package final Juneyao Health broker reports

on:
  pull_request:
    paths:
      - 'tasks/juneyao-health-broker-final-20261004.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          AS_OF = '2026-10-04'
          ROOT = Path('work')
          PACKAGE_NAME = '均瑶健康_605388.SH_券商研究报告_3份'
          PACKAGE = ROOT / PACKAGE_NAME
          VERIFY = ROOT / 'verify'
          OUT = Path('artifact_out')
          for path in (PACKAGE, VERIFY, OUT):
              path.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'info_code': 'AP202311071609224233',
                  'broker': '西南证券',
                  'date': '2023-11-07',
                  'title': '成功整合润盈，发力益生菌第二曲线可期',
                  'type': '公司专题研究',
                  'analysts': '朱会振、夏霁',
                  'rating': '买入',
                  'expected_pages': 13,
                  'filename': '01_西南证券_2023-11-07_成功整合润盈_发力益生菌第二曲线可期.pdf',
              },
              {
                  'info_code': 'AP202301201582227806',
                  'broker': '华鑫证券',
                  'date': '2023-01-20',
                  'title': '公司动态研究报告：重整润盈生物，第二曲线增长可期',
                  'type': '公司动态研究',
                  'analysts': '孙山山',
                  'rating': '买入',
                  'expected_pages': 5,
                  'filename': '02_华鑫证券_2023-01-20_重整润盈生物_第二曲线增长可期.pdf',
              },
              {
                  'info_code': 'AP202408301639604276',
                  'broker': '西南证券',
                  'date': '2024-08-30',
                  'title': '2024年半年报点评：益生菌食品增速领先，回购彰显发展信心',
                  'type': '公司定期报告点评',
                  'analysts': '朱会振、夏霁',
                  'rating': '未标注',
                  'expected_pages': 6,
                  'filename': '03_西南证券_2024-08-30_益生菌食品增速领先_回购彰显发展信心.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=6, connect=6, read=6, status=6, backoff_factor=1.0,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          manifest = []
          for index, report in enumerate(reports, start=1):
              dest = PACKAGE / report['filename']
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_01.pdf',
              ]
              source_url = None
              last_error = None
              for url in urls:
                  try:
                      response = session.get(url, headers={'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'}, timeout=(30, 240))
                      print('DOWNLOAD', response.status_code, len(response.content), url, flush=True)
                      if response.status_code == 200 and len(response.content) > 80_000 and response.content.startswith(b'%PDF'):
                          dest.write_bytes(response.content)
                          source_url = url
                          break
                  except Exception as exc:
                      last_error = exc
              if source_url is None:
                  raise RuntimeError(f'Failed to download {report["title"]}: {last_error!r}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1000:]}')
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f'Page mismatch for {dest.name}: expected {report["expected_pages"]}, got {pages}')

              sample = []
              for page_no in range(min(pages, 5)):
                  try:
                      sample.append(reader.pages[page_no].extract_text() or '')
                  except Exception:
                      pass
              text = '\n'.join(sample)
              identity = ('均瑶健康' in text or '605388' in text or '湖北均瑶大健康' in text)
              research = any(term in text for term in ('证券研究报告', '公司研究', '投资评级', '分析师'))
              if not identity or not research:
                  raise RuntimeError(f'Identity/research validation failed for {dest.name}: identity={identity}, research={research}')

              for label, page_no in (('first', 1), ('last', pages)):
                  prefix = VERIFY / f'{index:02d}_{label}'
                  render = subprocess.run([
                      'pdftoppm', '-f', str(page_no), '-l', str(page_no), '-singlefile',
                      '-png', '-r', '80', str(dest), str(prefix)
                  ], capture_output=True, text=True)
                  image = Path(str(prefix) + '.png')
                  if render.returncode != 0 or not image.exists() or image.stat().st_size < 5000:
                      raise RuntimeError(f'Page render failed for {dest.name} page {page_no}')

              data = dest.read_bytes()
              item = dict(report)
              item.update({
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'source_url': source_url,
              })
              manifest.append(item)
              print('VALIDATED', json.dumps(item, ensure_ascii=False), flush=True)

          readme = [
              '均瑶健康（605388.SH）券商研究报告合集',
              f'整理日期：{AS_OF}',
              '',
              '公开券商覆盖说明：东方财富公开研报索引共检索到18份直接覆盖报告，其中仅1份达到10页以上；其余多数为4—6页公司更新。为满足2—3份资料需求，本包收录1份13页专题研究，以及2份主题较集中、内容完整的公司研究/点评报告。未使用行情快讯、网页摘要或无关行业材料凑数。',
              '',
              '文件清单：',
          ]
          for number, item in enumerate(manifest, start=1):
              readme.extend([
                  f'{number}. {item["filename"]}',
                  f'   券商：{item["broker"]}',
                  f'   标题：{item["title"]}',
                  f'   类型：{item["type"]}',
                  f'   日期：{item["date"]}；页数：{item["pages"]}',
                  f'   分析师：{item["analysts"]}；评级：{item["rating"]}',
                  f'   原始PDF：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ])
          readme.append('完整性校验：PDF文件头、实际页数、公司身份、券商研究标识、qpdf结构、首末页渲染、SHA-256和ZIP CRC均已检查。')
          (PACKAGE / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (PACKAGE / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (PACKAGE / 'SHA256SUMS.txt').write_text(''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest), encoding='utf-8')

          zip_path = OUT / f'{PACKAGE_NAME}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(PACKAGE.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE_NAME}/{path.name}')
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len(pdfs) != 3:
                  raise RuntimeError(f'Expected 3 PDFs in ZIP, found {len(pdfs)}')
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: juneyao-health-broker-final-artifact
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
