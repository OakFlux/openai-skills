name: Kebaier Filings Source Probe

on:
  push:
    branches:
      - chatgpt-kebaier-filings-20261004
    paths:
      - .github/workflows/kebaier_filings_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Probe report and prospectus pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          pages=[]
          for host in ('https://money.finance.sina.com.cn','https://vip.stock.finance.sina.com.cn'):
            for code in ('920066','873664'):
              for ptype in ('ndbg','yjdbg'):
                pages.append(f'{host}/corp/go.php/vCB_Bulletin/stockid/{code}/page_type/{ptype}.phtml')
              pages.append(f'{host}/corp/go.php/vISSUE_RaiseExplanation/stockid/{code}.phtml')
              pages.append(f'{host}/corp/go.php/vISSUE_NewStock/stockid/{code}.phtml')

          out=[]
          for url in pages:
            rec={'url':url}
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              r.encoding=r.apparent_encoding or 'utf-8'
              rec.update({'status':r.status_code,'bytes':len(r.content),'final_url':r.url,'encoding':r.encoding,'content_type':r.headers.get('content-type')})
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                text=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                blob=text+' '+href
                if any(k in blob for k in ('年度报告','季度报告','一季度报告','招股说明书','招股意向书','发行公告','vCB_AllBulletinDetail','RaiseExplanationDetail','.PDF','.pdf')):
                  links.append({'text':text,'href':href})
              rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              rec['links']=links
              rec['text_head']=' '.join(soup.get_text(' ',strip=True).split())[:1000]
              print('\nPAGE',json.dumps({k:rec[k] for k in rec if k!='links'},ensure_ascii=False))
              print('LINKS',json.dumps(links,ensure_ascii=False,indent=2))
            except Exception as e:
              rec['error']=repr(e)
              print('ERROR',url,repr(e))
            out.append(rec)
          open('output/probe.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: kebaier-filings-probe
          path: output/probe.json
          retention-days: 1
