name: Check HUTCHMED legacy annual/result PDFs 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-legacy-pre-pdf-check-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests pypdf
      - name: Download and inspect legacy files
        run: |
          python - <<'PY'
          import json, requests, urllib3
          from io import BytesIO
          from pathlib import Path
          from pypdf import PdfReader
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          paths={
            2006:'pre0703.pdf',2007:'pre0803.pdf',2008:'pre0903.pdf',
            2009:'pre1003.pdf',2010:'pre1103.pdf',2011:'pre1203.pdf'
          }
          bases=[
            'https://www.chi-med.com/cgi-bin/redirect.cgi?url=/eng/irinfo/presentations/',
            'https://www.hutch-med.com/wp-content/uploads/docArchive/presentations/',
            'https://www.hutch-med.com/wp-content/uploads/docArchive/irinfo/presentations/',
          ]
          s=requests.Session(); s.trust_env=False; s.verify=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36'})
          rows=[]
          for year,name in paths.items():
            best=None
            for base in bases:
              u=base+name
              try:
                r=s.get(u,timeout=90,verify=False,allow_redirects=True)
                row={'year':year,'requested':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'ct':r.headers.get('content-type'),'header':r.content[:8].decode('latin1','replace')}
                if r.status_code==200 and r.content.startswith(b'%PDF'):
                  reader=PdfReader(BytesIO(r.content)); row['pages']=len(reader.pages)
                  text=[]
                  for p in reader.pages[:8]:
                    try: text.append(p.extract_text() or '')
                    except: pass
                  row['text']=' '.join(' '.join(text).split())[:3000]
                  best=row; break
                rows.append(row)
              except Exception as e:
                rows.append({'year':year,'requested':u,'error':repr(e)})
            if best: rows.append(best)
          Path('legacy_pre_check.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-legacy-pre-pdf-check
          path: legacy_pre_check.json
          retention-days: 7
