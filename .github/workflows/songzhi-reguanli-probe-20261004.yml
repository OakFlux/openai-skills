name: Probe Reguanli Songzhi report files 20261004

on:
  push:
    paths:
      - '.github/workflows/songzhi-reguanli-probe-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe page and WordPress APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://www.reguanli.com/18386.html',
            'https://www.reguanli.com/wp-json/wp/v2/search?search=%E6%9D%BE%E8%8A%9D%E8%82%A1%E4%BB%BD&per_page=100',
            'https://www.reguanli.com/wp-json/wp/v2/posts?search=%E6%9D%BE%E8%8A%9D%E8%82%A1%E4%BB%BD&per_page=100&_embed=1',
            'https://www.reguanli.com/wp-json/wp/v2/media?search=%E6%9D%BE%E8%8A%9D%E8%82%A1%E4%BB%BD&per_page=100',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('\nURL',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.content.decode(r.apparent_encoding or 'utf-8','replace')
              print('HEAD',text[:1500].replace('\n',' '),flush=True)
              if 'json' in (r.headers.get('content-type') or ''):
                try:
                  obj=r.json()
                  print('JSON',json.dumps(obj,ensure_ascii=False)[:50000],flush=True)
                except Exception as e: print('JSONERR',repr(e),flush=True)
              for pat in [
                r'(?:src|href|data|data-src|data-url)=["\']([^"\']+)["\']',
                r'https?://[^\s"\'<>]+',
              ]:
                vals=[]
                for m in re.findall(pat,text,flags=re.I):
                  if isinstance(m,tuple): m=''.join(m)
                  m=urljoin(r.url,m)
                  if m not in vals and any(k in m.lower() for k in ['pdf','upload','download','18386','report','wp-content']): vals.append(m)
                for v in vals[:300]: print('LINK',v,flush=True)
              for line in text.splitlines():
                low=line.lower()
                if any(k in low for k in ['embedded pdf','.pdf','iframe','embed','download','file_name','file-url','pdfjs','documenturl']):
                  print('LINE',line[:5000],flush=True)
            except Exception as e:
              print('ERROR',url,repr(e),flush=True)
          PY
