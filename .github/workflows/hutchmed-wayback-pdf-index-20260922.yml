name: Index HUTCHMED legacy PDFs via Wayback 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-wayback-pdf-index-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query PDF index
        run: |
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 research archive'})
          params={
            'url':'www.chi-med.com/eng/irinfo/*',
            'output':'json',
            'filter':['statuscode:200','mimetype:application/pdf'],
            'fl':'timestamp,original,statuscode,mimetype,length,digest',
            'collapse':'urlkey',
            'from':'2006','to':'2013','limit':'5000'
          }
          r=s.get('https://web.archive.org/cdx/search/cdx',params=params,timeout=600)
          print('STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url)
          r.raise_for_status()
          rows=r.json()
          header=rows[0] if rows else []
          records=[dict(zip(header,x)) for x in rows[1:]] if rows else []
          cand=[]
          for x in records:
            u=x.get('original',''); low=u.lower()
            if any(k in low for k in ['annual','report','accounts','/ar','_ar','ar20','ar0','financial']):
              cand.append(x)
          Path('all_legacy_pdfs.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('candidate_legacy_pdfs.json').write_text(json.dumps(cand,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ALL',len(records),'CANDIDATES',len(cand))
          print(json.dumps(cand,ensure_ascii=False,indent=2)[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-wayback-pdf-index
          path: |
            all_legacy_pdfs.json
            candidate_legacy_pdfs.json
          if-no-files-found: error
          retention-days: 7
