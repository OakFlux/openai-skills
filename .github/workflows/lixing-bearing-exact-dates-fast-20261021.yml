name: Fast exact bearing dates for Lixing 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-bearing-exact-dates-fast-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests
      - name: Query exact dates
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          dates=['2022-02-28','2022-03-01','2022-06-28','2022-06-29','2022-08-08','2022-08-09','2022-10-21','2022-10-22','2023-01-11','2023-01-12','2023-01-13','2023-03-01']
          terms=['轴承','滚子','滚动体','钢球','陶瓷球']
          for d in dates:
            for qtype in ['0','1','2']:
              p={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':d,'endTime':d,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              r=s.get(api,params=p,timeout=(15,90))
              if r.status_code!=200:continue
              data=r.json().get('data') or []
              if isinstance(data,dict):data=data.get('list') or data.get('data') or []
              found=[]
              for row in data:
                title=str(row.get('title') or '')
                if any(t in title for t in terms):
                  found.append({k:row.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
              if found:print('DATE',d,'QTYPE',qtype,json.dumps(found,ensure_ascii=False,indent=2))
          PY
