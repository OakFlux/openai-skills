name: Probe Hibor report detail downloads v2 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-hibor-detail-probe-v2-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out = Path('zzmd_hibor_detail_probe_v2')
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.hibor.com.cn/'
          })
          urls = [
              'https://www.hibor.com.cn/docdetail_101288.html',
              'https://wap.hibor.com.cn/docdetail_101288.html',
              'http://www.hibor.com.cn/docdetail_101288.html',
              'http://wap.hibor.com.cn/docdetail_101288.html'
          ]
          all_assets = []
          pages = []
          for idx, url in enumerate(urls):
              try:
                  response = session.get(url, timeout=(20, 90), allow_redirects=True)
                  response.encoding = response.apparent_encoding or response.encoding or 'gb18030'
                  html = response.text
                  (out / f'page_{idx}.html').write_text(html, encoding='utf-8', errors='replace')
                  soup = BeautifulSoup(html, 'lxml')
                  title = soup.title.get_text(' ', strip=True) if soup.title else ''
                  meta = {
                      'requested': url,
                      'status': response.status_code,
                      'final_url': response.url,
                      'bytes': len(response.content),
                      'content_type': response.headers.get('content-type', ''),
                      'title': title
                  }
                  pages.append(meta)
                  print('PAGE', json.dumps(meta, ensure_ascii=False))
                  assets = []
                  for tag in soup.find_all(True):
                      for attr in ('href', 'src', 'data-src', 'data-url', 'data-href', 'action'):
                          value = tag.get(attr)
                          if not isinstance(value, str) or not value.strip():
                              continue
                          absolute = urllib.parse.urljoin(response.url, value.strip())
                          low = absolute.lower()
                          label = ' '.join(tag.get_text(' ', strip=True).split())[:200]
                          if ('101288' in absolute or any(k in low for k in ('pdf', 'download', 'attach', 'upload', 'preview', 'read', 'view', 'image', 'file', 'doc')) or any(k in label for k in ('报告原文', '点击浏览', '下载', 'PDF'))):
                              assets.append({'tag': tag.name, 'attr': attr, 'raw': value, 'url': absolute, 'text': label})
                  unique = []
                  seen = set()
                  for item in assets:
                      key = item['url']
                      if key in seen:
                          continue
                      seen.add(key)
                      unique.append(item)
                      all_assets.append({'page': response.url, **item})
                  (out / f'page_{idx}_assets.json').write_text(json.dumps(unique, ensure_ascii=False, indent=2), encoding='utf-8')
                  print('ASSETS', json.dumps(unique, ensure_ascii=False, indent=2)[:30000])
                  for needle in ('报告原文', '点击浏览', '下载', 'PDF', 'Image', '101288'):
                      if needle in html:
                          pos = html.find(needle)
                          print('SNIPPET', needle, html[max(0, pos-1000):pos+3000])
              except Exception as exc:
                  pages.append({'requested': url, 'error': repr(exc)})
                  print('ERROR', url, repr(exc))

          probes = []
          for index, item in enumerate(all_assets):
              url = item['url']
              low = url.lower()
              if not url.startswith(('http://', 'https://')):
                  continue
              if not ('101288' in url or any(k in low for k in ('pdf', 'download', 'attach', 'upload', 'preview', 'read', 'view', 'image', 'file', 'doc'))):
                  continue
              try:
                  response = session.get(url, timeout=(15, 60), allow_redirects=True, headers={
                      'User-Agent': session.headers['User-Agent'],
                      'Referer': item['page'],
                      'Accept': 'application/pdf,image/*,*/*;q=0.5'
                  })
                  rec = {
                      'url': url,
                      'status': response.status_code,
                      'final_url': response.url,
                      'bytes': len(response.content),
                      'content_type': response.headers.get('content-type', ''),
                      'first16_hex': response.content[:16].hex()
                  }
                  if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 10000:
                      name = f'asset_{index:03d}.pdf'
                      (out / name).write_bytes(response.content)
                      rec['saved'] = name
                  elif response.status_code == 200 and len(response.content) > 5000 and response.content[:3] == b'\xff\xd8\xff':
                      name = f'asset_{index:03d}.jpg'
                      (out / name).write_bytes(response.content)
                      rec['saved'] = name
                  elif response.status_code == 200 and len(response.content) > 5000 and response.content[:4] == b'\x89PNG':
                      name = f'asset_{index:03d}.png'
                      (out / name).write_bytes(response.content)
                      rec['saved'] = name
                  probes.append(rec)
                  print('PROBE', json.dumps(rec, ensure_ascii=False))
              except Exception as exc:
                  probes.append({'url': url, 'error': repr(exc)})
                  print('PROBE_ERROR', url, repr(exc))
          (out / 'pages.json').write_text(json.dumps(pages, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'all_assets.json').write_text(json.dumps(all_assets, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'probes.json').write_text(json.dumps(probes, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-hibor-detail-probe-v2-20261014
          path: zzmd_hibor_detail_probe_v2
          retention-days: 2
          if-no-files-found: error
