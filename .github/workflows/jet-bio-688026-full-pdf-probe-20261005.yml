name: Probe JET BIO broker full PDFs 20261005

on:
  push:
    paths:
      - '.github/workflows/jet-bio-688026-full-pdf-probe-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF parser
        run: python -m pip install --quiet requests pypdf
      - name: Probe endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          import json, requests, time
          from pypdf import PdfReader

          reports=[
            ('AP202509251750336282',27,'信达_2025'),
            ('AP202203281555559076',29,'东莞_2022'),
            ('AP202005131379670649',23,'万联_2020'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          results=[]
          for code,expected,label in reports:
            urls=[]
            for prefix in ('H3','H2','H4','H1'):
              urls.append(f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf')
            urls += [
              f'https://pdf.dfcfw.com/pdf/{code}.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{code}.pdf',
              f'https://data.eastmoney.com/report/zw_stock.jshtml?infocode={code}',
            ]
            for i,url in enumerate(urls):
              item={'code':code,'label':label,'expected_pages':expected,'url':url}
              try:
                r=s.get(url,timeout=(20,120),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,text/html,*/*;q=0.8'})
                item.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'head_hex':r.content[:16].hex()})
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>30000:
                  p=Path('out')/f'{label}_{i}.pdf'; p.write_bytes(r.content)
                  try:
                    pages=len(PdfReader(str(p),strict=False).pages)
                  except Exception as e:
                    pages=None; item['pdf_error']=repr(e)
                  item['pages']=pages; item['saved_file']=str(p)
                else:
                  (Path('out')/f'{label}_{i}.txt').write_bytes(r.content[:200000])
              except Exception as e:
                item['error']=repr(e)
              results.append(item)
              time.sleep(.1)
          Path('out/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jet-bio-688026-full-pdf-probe
          path: out
          retention-days: 7
          if-no-files-found: error
