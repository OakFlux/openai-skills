name: Save public 9fzt CR BMT pages
on:
  push:
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Download public report pages
        run: |
          mkdir -p out
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://gmg.9fzt.com/report/HKSE/01313/index.html' -o out/index.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://gmg.9fzt.com/report/HKSE/01313/780686457612.html' -o out/780686457612.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://gmg.9fzt.com/report/HKSE/01313/780086137443.html' -o out/780086137443.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://gmg.9fzt.com/report/HKSE/01313/795711580125.html' -o out/795711580125.html
          wc -c out/*
      - name: Upload pages
        uses: actions/upload-artifact@v4
        with:
          name: crbmt-9fzt-pages
          path: out
          retention-days: 1
          compression-level: 0
