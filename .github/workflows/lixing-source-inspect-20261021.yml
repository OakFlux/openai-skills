name: Inspect Lixing report source pages 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-source-inspect-20261021.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect source HTML for downloadable resources
        shell: bash
        run: |
          python - <<'PY'
          import re,json,html,requests,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://www.sgpjbg.com/bgdown/623279.html',
            'https://max.book118.com/html/2025/0409/8113063113007051.shtm',
            'https://www.fxbaogao.com/detail/4772943',
            'https://www.baogaobox.com/reports/250408000055028.html',
            'https://www.9fzt.com/detail/sz_300421_10_797446217041.html',
          ]
          for url in urls:
            print('\n===== URL',url)
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'CT',r.headers.get('content-type'))
              text=r.text
              print('PREFIX',text[:500].replace('\n',' '))
              # print lines likely holding file/download resource data
              for i,line in enumerate(text.splitlines(),1):
                low=line.lower()
                if any(k in low for k in ['.pdf','download','downurl','fileurl','pdfurl','sourceurl','oss','623279','4772943','8113063113007051']):
                  if len(line)<3000: print('LINE',i,line[:2800])
              soup=BeautifulSoup(text,'lxml')
              found=[]
              for tag in soup.find_all(True):
                for attr in ['href','src','data-src','data-url','data-file','data-pdf','content']:
                  v=tag.get(attr)
                  if not v:continue
                  v=html.unescape(str(v))
                  if any(k in v.lower() for k in ['pdf','download','down','623279','4772943','8113063113007051']):
                    found.append(urllib.parse.urljoin(r.url,v))
              for m in re.findall(r'https?://[^\s"\'<>]+',text):
                m=html.unescape(m)
                if any(k in m.lower() for k in ['pdf','download','down','623279','4772943','8113063113007051']):found.append(m)
              print('FOUND_URLS',json.dumps(list(dict.fromkeys(found))[:300],ensure_ascii=False,indent=2))
            except Exception as e:print('ERROR',repr(e))
          PY
