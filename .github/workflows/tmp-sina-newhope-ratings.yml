name: Temporary inspect Sina New Hope Service rating links

on:
  push:
    branches:
      - tmp/sina-newhope-ratings-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch rating page and linked reports
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re,urllib.parse,urllib3
          import requests
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*','Referer':'https://stock.finance.sina.com.cn/'})
          urls=['https://vip.stock.finance.sina.com.cn/hk/view/rating.php?symbol=03658','https://stock.finance.sina.com.cn/hkstock/quotes/03658.html']
          for url in urls:
            print('\nPAGE',url)
            r=S.get(url,timeout=35,verify=False,allow_redirects=True)
            print('STATUS',r.status_code,len(r.content),r.url,r.encoding,r.apparent_encoding)
            r.encoding=r.apparent_encoding or 'gb2312';html=r.text
            low=html.lower();pos=0
            while True:
              i=low.find('03658',pos)
              if i<0:break
              print('CTX',html[max(0,i-1200):i+2500].replace('\n',' ')[:3700]);pos=i+5
            soup=BeautifulSoup(html,'html.parser')
            for tr in soup.find_all('tr'):
              txt=' '.join(tr.get_text(' ',strip=True).split())
              if '新希望服务' in txt or '03658' in txt:
                print('ROW',txt)
                for a in tr.find_all('a',href=True):
                  full=urllib.parse.urljoin(r.url,a['href']);print('LINK',a.get_text(' ',strip=True),full)
                  try:
                    rr=S.get(full,timeout=30,verify=False,allow_redirects=True);rr.encoding=rr.apparent_encoding or rr.encoding
                    print('LINK_FETCH',rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'))
                    text=rr.text
                    print('LINK_HEAD',text[:1000].replace('\n',' '))
                    for pdf in sorted(set(re.findall(r'https?://[^\"\'<> ]+\.pdf(?:\?[^\"\'<> ]*)?',text,re.I))):print('PDF',pdf)
                  except Exception as e:print('LINK_ERR',e)
          PY
