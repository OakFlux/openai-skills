name: Temporary Ascletis Baogaobox probe

on:
  push:
    branches:
      - tmp-gelizhiyao-baogaobox-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect report pages and asset URLs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          urls={
            'dongwu':'https://www.baogaobox.com/reports/250402000054301.html',
            'dongfang':'https://www.baogaobox.com/reports/251229000088797.html',
            'dongwu_insight':'https://www.baogaobox.com/insights/250519000010254.html',
            'fx_dongwu':'https://www.fxbaogao.com/detail/4757488',
            'fx_dongfang':'https://www.fxbaogao.com/detail/5205547',
            'fx_xingzheng':'https://www.fxbaogao.com/detail/5048656',
          }
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          summary={}
          for name,url in urls.items():
            row={'requested':url}
            try:
              r=s.get(url,timeout=120,allow_redirects=True)
              row.update({'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type')})
              text=r.text
              (out/f'{name}.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'html.parser')
              row['title']=soup.title.get_text(' ',strip=True) if soup.title else None
              links=[]
              for tag in soup.find_all(True):
                for attr in ['href','src','data-src','data-url','data-file','data-download','data-pdf','content','value']:
                  value=tag.get(attr)
                  if isinstance(value,str) and value:
                    full=urljoin(r.url,value)
                    low=full.lower()
                    if any(k in low for k in ['pdf','download','report','document','file','attachment','oss','cdn','preview','image']):
                      links.append({'tag':tag.name,'attr':attr,'value':full,'text':' '.join(tag.get_text(' ',strip=True).split())[:500]})
              strings=[]
              patterns=[
                r'https?://[^"\'<>\s\\]+',
                r'["\']([^"\']*(?:\.pdf|download|attachment|report-image|documents/|files/)[^"\']*)["\']',
              ]
              for pat in patterns:
                for match in re.finditer(pat,text,re.I):
                  value=match.group(1) if match.lastindex else match.group(0)
                  if value not in strings: strings.append(value)
              row['links']=links[:2000]
              row['strings']=strings[:3000]
              row['body_head']=' '.join(soup.get_text(' ',strip=True).split())[:12000]
              print('PAGE',name,r.status_code,len(r.content),r.url,row['title'],flush=True)
              for item in links[:100]:
                print('LINK',name,json.dumps(item,ensure_ascii=False),flush=True)
              for value in strings[:100]:
                print('STRING',name,value,flush=True)
            except Exception as exc:
              row['error']=repr(exc); print('ERROR',name,repr(exc),flush=True)
            summary[name]=row
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: gelizhiyuo-baogaobox-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
