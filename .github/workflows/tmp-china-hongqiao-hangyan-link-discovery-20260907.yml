name: Discover China Hongqiao Hangyan report links
on:
  push:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Parse related report links from public chart pages
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urls=[
            'https://www.hangyan.co/charts/3388540536716527430',
            'https://www.hangyan.co/charts/3437492873023456866',
            'https://www.hangyan.co/charts/3369214044664759374',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for u in urls:
            r=s.get(u,timeout=60)
            print('\nPAGE',u,r.status_code,len(r.content),r.url)
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              href=urljoin(r.url,a['href'])
              text=a.get_text(' ',strip=True)
              if '/reports/' in href:
                print('REPORT_LINK',json.dumps({'text':text,'href':href},ensure_ascii=False))
            for m in sorted(set(re.findall(r'https?://www\.hangyan\.co/reports/\d+',r.text))):
              print('RAW_REPORT',m)
          PY
