name: Scan Eastmoney exact dates for Makeng Mining reports

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-eastmoney-exact-day-scan-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Scan exact dates and test PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,re,requests,time
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          api='https://reportapi.eastmoney.com/report/list'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=.5,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)))
          dates=['2026-08-18','2026-08-19','2026-08-28','2026-08-29','2026-10-23','2026-10-24']
          matches={}
          for date in dates:
            for qtype in ('0','1','2','3'):
              for page in range(1,81):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':date,'endTime':date,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(api,params=params,timeout=60); r.raise_for_status(); data=r.json(); rows=data.get('data') or []; hits=int(data.get('hits') or 0)
                  if page==1: print('META',date,qtype,'hits',hits,'rows',len(rows),flush=True)
                  for x in rows:
                    blob='|'.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName','author'))
                    if '马矿股份' in blob or '601123' in blob or '原矿产量将扩大一倍' in blob or '独立地采铁矿山企业' in blob:
                      info=str(x.get('infoCode') or '')
                      matches[info]=x
                      print('MATCH',date,qtype,page,json.dumps(x,ensure_ascii=False),flush=True)
                  if not rows or page*100>=hits: break
                  time.sleep(.05)
                except Exception as e: print('ERROR',date,qtype,page,repr(e),flush=True); break
          print('MATCH_COUNT',len(matches),flush=True)
          for info,x in matches.items():
            print('FINAL_MATCH',info,json.dumps(x,ensure_ascii=False),flush=True)
            for prefix in ('H3','H2'):
              for suffix in ('_1.pdf','_1.pdf?x=1'):
                url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}{suffix}'
                try:
                  r=s.get(url,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=60)
                  print('PDF_TEST',url,r.status_code,len(r.content),r.headers.get('content-type'),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF'):
                    rd=PdfReader(io.BytesIO(r.content),strict=False); tx=''
                    for i in range(min(4,len(rd.pages))):
                      try:tx+=rd.pages[i].extract_text() or ''
                      except Exception:pass
                    print('PDF_OK',json.dumps({'url':url,'pages':len(rd.pages),'bytes':len(r.content),'text':re.sub(r'\s+',' ',tx)[:1000]},ensure_ascii=False),flush=True)
                except Exception as e:print('PDF_ERROR',url,repr(e),flush=True)
          PY
