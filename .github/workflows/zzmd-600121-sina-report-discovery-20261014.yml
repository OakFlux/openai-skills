name: Discover historical Zhengzhou Coal reports from Sina 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-600121-sina-report-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch candidate historical report indexes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('zzmd_sina_discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          urls=[]
          bases=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml',
            'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml',
            'http://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml',
            'http://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml',
          ]
          symbols=['sh600121','600121']
          for base in bases:
            for symbol in symbols:
              for page in range(1,11):
                urls.append(base+'?'+urllib.parse.urlencode({'symbol':symbol,'t1':'all','p':page}))
          summaries=[]; links=[]
          for i,url in enumerate(urls):
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              enc=r.apparent_encoding or r.encoding or 'utf-8'
              r.encoding=enc
              text=r.text
              fn=out/f'{i:03d}_{urllib.parse.urlparse(url).netloc}_{urllib.parse.parse_qs(urllib.parse.urlparse(url).query).get("symbol",[""])[0]}_p{urllib.parse.parse_qs(urllib.parse.urlparse(url).query).get("p",[""])[0]}.html'
              fn.write_text(text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(text,'lxml')
              page_links=[]
              for a in soup.find_all('a',href=True):
                href=urllib.parse.urljoin(r.url,a['href'])
                label=' '.join(a.get_text(' ',strip=True).split())
                if 'vReport_Show' in href or 'rptid' in href or ('研报' in label and label):
                  rec={'source_url':url,'final_url':r.url,'href':href,'text':label}
                  page_links.append(rec); links.append(rec)
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              summary={'url':url,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'encoding':enc,'title':title,'report_links':len(page_links),'contains_company':('郑州煤电' in text),'contains_code':('600121' in text)}
              summaries.append(summary)
              print(json.dumps(summary,ensure_ascii=False))
            except Exception as exc:
              summaries.append({'url':url,'error':repr(exc)})
          # Deduplicate links
          dedup=[]; seen=set()
          for x in links:
            key=x['href']
            if key not in seen:
              seen.add(key); dedup.append(x)
          (out/'summaries.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'report_links.json').write_text(json.dumps(dedup,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'report_links.txt').write_text('\n'.join(f"{x['text']}\t{x['href']}" for x in dedup),encoding='utf-8')
          print('UNIQUE_LINKS',len(dedup))
          print((out/'report_links.txt').read_text(encoding='utf-8')[:20000])
          PY

      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-600121-sina-report-discovery-20261014
          path: zzmd_sina_discovery
          retention-days: 2
          if-no-files-found: error
