name: Aiko Solar Broker Report Probe

on:
  push:
    branches:
      - chatgpt-aiko-broker-reports-20261004
    paths:
      - .github/workflows/aiko_report_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Query Eastmoney stock report API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          url = 'https://reportapi.eastmoney.com/report/list2'
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          all_rows = []
          for page in range(1, 20):
              payload = {
                  'pageSize': 100,
                  'pageNo': page,
                  'p': page,
                  'pageNum': page,
                  'pageNumber': page,
                  'beginTime': '2017-01-01',
                  'endTime': '2026-10-04',
                  'code': '600732',
                  'industryCode': '*',
                  'rating': None,
                  'ratingChange': None,
                  'orgCode': None,
                  'rcode': '',
              }
              response = session.post(url, json=payload, headers={'Content-Type': 'application/json'}, timeout=90)
              print('API', page, response.status_code, len(response.content), response.url, response.headers.get('content-type'))
              response.raise_for_status()
              obj = response.json()
              rows = obj.get('data') or []
              print('PAGE_ROWS', len(rows), 'HITS', obj.get('hits'), 'TOTALPAGE', obj.get('TotalPage') or obj.get('totalPage'))
              for row in rows:
                  if str(row.get('stockCode') or '') == '600732' or '爱旭' in str(row.get('stockName') or ''):
                      print('ROW', json.dumps({
                          'infoCode': row.get('infoCode'),
                          'title': row.get('title'),
                          'orgSName': row.get('orgSName'),
                          'publishDate': row.get('publishDate'),
                          'stockName': row.get('stockName'),
                          'stockCode': row.get('stockCode'),
                          'attachPages': row.get('attachPages'),
                          'attachSize': row.get('attachSize'),
                          'emRatingName': row.get('emRatingName'),
                          'researcher': row.get('researcher'),
                      }, ensure_ascii=False))
                  all_rows.append(row)
              total_pages = obj.get('TotalPage') or obj.get('totalPage') or 1
              if page >= int(total_pages) or not rows:
                  break

          matches = [r for r in all_rows if str(r.get('stockCode') or '') == '600732' or '爱旭' in str(r.get('stockName') or '')]
          Path('output/aiko_reports.json').write_text(json.dumps(matches, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_MATCH_COUNT', len(matches))
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: aiko-report-probe
          path: output/aiko_reports.json
          retention-days: 1
