name: Capture public report search responses

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-browser-capture-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Capture public network responses
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              out = Path('out')
              out.mkdir()
              events = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(locale='zh-CN', viewport={'width': 1440, 'height': 1000})
                  page = await context.new_page()

                  async def record_request(req):
                      if 'api.fxbaogao.com' in req.url:
                          item = {'kind': 'request', 'method': req.method, 'url': req.url, 'post_data': req.post_data}
                          events.append(item)
                          print('REQUEST', json.dumps(item, ensure_ascii=False)[:20000])

                  async def record_response(resp):
                      if 'api.fxbaogao.com' in resp.url or 'report.fxbaogao.com' in resp.url:
                          item = {'kind': 'response', 'status': resp.status, 'url': resp.url}
                          try:
                              body = await resp.body()
                              item['body_len'] = len(body)
                              if len(body) < 2000000:
                                  item['body'] = body.decode('utf-8', errors='replace')
                          except Exception as exc:
                              item['error'] = repr(exc)
                          events.append(item)
                          print('RESPONSE', json.dumps(item, ensure_ascii=False)[:100000])

                  page.on('request', record_request)
                  page.on('response', record_response)
                  urls = [
                      'https://www.fxbaogao.com/report?keyword=%E6%A8%AA%E6%B2%B3%E7%B2%BE%E5%AF%86',
                      'https://www.fxbaogao.com/view?id=3760192',
                      'https://www.fxbaogao.com/pdf?id=3760192',
                  ]
                  for index, url in enumerate(urls):
                      try:
                          await page.goto(url, wait_until='domcontentloaded', timeout=90000)
                          await page.wait_for_timeout(8000)
                          print('PAGE', index, page.url, await page.title())
                          (out / f'page_{index}.html').write_text(await page.content(), encoding='utf-8')
                          await page.screenshot(path=str(out / f'page_{index}.png'), full_page=True)
                      except Exception as exc:
                          print('PAGE_ERROR', url, repr(exc))
                  (out / 'events.json').write_text(json.dumps(events, ensure_ascii=False, indent=2), encoding='utf-8')
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: henghe-300539-browser-capture-20261021
          path: out
          compression-level: 6
          retention-days: 7
