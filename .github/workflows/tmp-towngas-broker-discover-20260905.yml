name: Temporary Towngas Smart Energy broker research discovery

on:
  push:
    branches:
      - tmp-towngas-broker-reports-20260905

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          all_records = []
          api = 'https://reportapi.eastmoney.com/report/list'
          for code in ['01083','1083','HK1083','HK01083','001083']:
              for qtype in ['0','1','2']:
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*', 'beginTime': '2010-01-01',
                      'endTime': '2030-01-01', 'pageNo': '1', 'fields': '',
                      'qType': qtype, 'orgCode': '', 'code': code, 'rcode': '',
                      'p': '1', 'pageNum': '1', 'pageNumber': '1',
                  }
                  try:
                      r = session.get(api, params=params, headers={'Referer':'https://data.eastmoney.com/report/'}, timeout=60)
                      print('EASTMONEY', code, qtype, r.status_code, len(r.content), r.url, flush=True)
                      obj = r.json()
                      batch = obj.get('data') or obj.get('Data') or obj.get('result') or []
                      if isinstance(batch, dict):
                          batch = batch.get('data') or batch.get('list') or batch.get('records') or []
                      print('EASTMONEY_ROWS', code, qtype, len(batch), 'hits', obj.get('hits') or obj.get('Hits') or obj.get('total'), flush=True)
                      for rec in batch:
                          record = {'query_code':code,'query_qtype':qtype, **rec}
                          all_records.append(record)
                          print('EM_RECORD', json.dumps({k:rec.get(k) for k in ['publishDate','orgSName','title','infoCode','attachPages','attachSize','reportType','emRatingName','researcher','stockName','stockCode']}, ensure_ascii=False), flush=True)
                  except Exception as exc:
                      print('EASTMONEY_ERROR', code, qtype, repr(exc), flush=True)
          Path('eastmoney_records.json').write_text(json.dumps(all_records, ensure_ascii=False, indent=2), encoding='utf-8')

          pages = [
              'https://www.nxny.com/report/view_6244237.html',
              'https://www.hangyan.co/reports/3860972724125959389',
              'https://basic.10jqka.com.cn/HK1083/rating.html',
          ]
          page_dump = {}
          for url in pages:
              try:
                  r = session.get(url, timeout=60, allow_redirects=True)
                  print('PAGE', url, r.status_code, len(r.content), r.url, r.headers.get('content-type'), flush=True)
                  text = r.text
                  page_dump[url] = text
                  soup = BeautifulSoup(text, 'html.parser')
                  print('TITLE', url, soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
                  for tag in soup.find_all(['a','iframe','embed','source','link','script']):
                      for attr in ['href','src','data-url','data-src','file','url']:
                          value = tag.get(attr)
                          if not value:
                              continue
                          absolute = urljoin(r.url, value)
                          low = absolute.lower()
                          if any(key in low for key in ['.pdf','download','attachment','report','file','preview']):
                              print('LINK', url, attr, absolute, flush=True)
                  for pat in [r'https?://[^\s"\'<>]+', r'[^\s"\'<>]+\.pdf[^\s"\'<>]*']:
                      for match in re.findall(pat, text, flags=re.I):
                          low = match.lower()
                          if any(key in low for key in ['pdf','download','file','report']):
                              print('TEXT_URL', url, match[:500], flush=True)
                  for keyword in ['download','pdf','filePath','fileUrl','reportId','attachment','docUrl']:
                      idx = text.lower().find(keyword.lower())
                      if idx >= 0:
                          print('SNIPPET', url, keyword, text[max(0,idx-300):idx+800].replace('\n',' ')[:1200], flush=True)
              except Exception as exc:
                  print('PAGE_ERROR', url, repr(exc), flush=True)
          Path('page_dump.json').write_text(json.dumps(page_dump, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: towngas-broker-discovery
          path: |
            eastmoney_records.json
            page_dump.json
          retention-days: 1
          if-no-files-found: error
