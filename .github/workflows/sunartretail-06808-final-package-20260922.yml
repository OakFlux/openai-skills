name: Build Sun Art Retail 06808 annual prospectus interim package 20260922

on:
  push:
    paths:
      - '.github/workflows/sunartretail-06808-final-package-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official filings validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '高鑫零售_06808_2020-2025年报_招股说明书_最新中期报告_官方原件'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
              'Referer': 'https://www.irasia.com/listco/hk/sunartretail/',
          })

          docs = [
              {
                  'filename': '01_高鑫零售_06808_2019年年度报告_2020年发布.pdf',
                  'title': '2019 Annual Report（2020年发布）',
                  'period': '截至2019年12月31日止年度',
                  'publication_year': 2020,
                  'category': '年度报告',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/annual/2019/ar2019.pdf',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
                  'type_terms': ['annual report'],
              },
              {
                  'filename': '02_高鑫零售_06808_2020至2021年度报告_2021年发布.pdf',
                  'title': '2020/2021 Annual Report（2021年发布）',
                  'period': '截至2021年3月31日止十五个月',
                  'publication_year': 2021,
                  'category': '年度报告',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/annual/2021/ar2021.pdf',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
                  'type_terms': ['annual report'],
              },
              {
                  'filename': '03_高鑫零售_06808_2021至2022年度报告_2022年发布.pdf',
                  'title': '2021/2022 Annual Report（2022年发布）',
                  'period': '截至2022年3月31日止年度',
                  'publication_year': 2022,
                  'category': '年度报告',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/annual/2022/ar2022.pdf',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
                  'type_terms': ['annual report'],
              },
              {
                  'filename': '04_高鑫零售_06808_2022至2023年度报告_2023年发布.pdf',
                  'title': '2022/2023 Annual Report（2023年发布）',
                  'period': '截至2023年3月31日止年度',
                  'publication_year': 2023,
                  'category': '年度报告',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/annual/2023/ar2023.pdf',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
                  'type_terms': ['annual report'],
              },
              {
                  'filename': '05_高鑫零售_06808_2023至2024年度报告_2024年发布.pdf',
                  'title': '2023/2024 Annual Report（2024年发布）',
                  'period': '截至2024年3月31日止年度',
                  'publication_year': 2024,
                  'category': '年度报告',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/annual/2024/ar2024.pdf',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
                  'type_terms': ['annual report'],
              },
              {
                  'filename': '06_高鑫零售_06808_2024至2025年度报告_2025年发布.pdf',
                  'title': '2024/2025 Annual Report（2025年发布）',
                  'period': '截至2025年3月31日止年度',
                  'publication_year': 2025,
                  'category': '年度报告',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/annual/2025/ar2025.pdf',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
                  'type_terms': ['annual report'],
              },
              {
                  'filename': '07_高鑫零售_06808_招股章程_Global_Offering_2011-07-04.pdf',
                  'title': 'Global Offering / Prospectus',
                  'period': '2011年首次公开发行',
                  'publication_year': 2011,
                  'category': '招股章程',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/listingdoc/l110704.pdf',
                  'min_bytes': 2_000_000,
                  'min_pages': 300,
                  'type_terms': ['global offering', 'prospectus'],
              },
              {
                  'filename': '08_高鑫零售_06808_补充招股章程_2011-07-18.pdf',
                  'title': 'Supplemental Prospectus',
                  'period': '2011年首次公开发行补充文件',
                  'publication_year': 2011,
                  'category': '补充招股章程',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/listingdoc/l110718.pdf',
                  'min_bytes': 100_000,
                  'min_pages': 5,
                  'type_terms': ['supplemental prospectus', 'prospectus'],
              },
              {
                  'filename': '09_高鑫零售_06808_2025至2026中期报告_最新财务报告.pdf',
                  'title': '2025/2026 Interim Report',
                  'period': '截至2025年9月30日止六个月',
                  'publication_year': 2025,
                  'category': '最新中期报告',
                  'url': 'https://doc.irasia.com/listco/hk/sunartretail/interim/2025/intrep.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 50,
                  'type_terms': ['interim report'],
              },
          ]

          def download_pdf(url: str, dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              candidates = [url]
              if url.startswith('https://doc.irasia.com/'):
                  candidates.append(url.replace('https://doc.irasia.com/', 'http://doc.irasia.com/'))
              for candidate in candidates:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(candidate, timeout=(30, 300), allow_redirects=True, stream=True) as response:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, candidate, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          head = tmp.read_bytes()[:8]
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{candidate} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def extract_sample(reader: PdfReader) -> str:
              pages = len(reader.pages)
              indices = list(range(min(25, pages)))
              if pages > 30:
                  indices += list(range(max(0, pages - 5), pages))
              text_parts: list[str] = []
              for index in dict.fromkeys(indices):
                  try:
                      text_parts.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              return '\n'.join(text_parts)

          records: list[dict] = []
          seen_hashes: set[str] = set()
          identity_terms = ['sun art retail', '高鑫零售', '高鑫零售有限公司', '6808', '06808']

          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['url'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages} < {doc["min_pages"]}')

              sample = extract_sample(reader)
              sample_lower = sample.lower()
              if not any(term.lower() in sample_lower for term in identity_terms):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              if not any(term.lower() in sample_lower for term in doc['type_terms']):
                  raise RuntimeError(f'document type could not be verified in {dest.name}; expected {doc["type_terms"]}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)

              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'publication_year': doc['publication_year'],
                  'category': doc['category'],
                  'source': '高鑫零售投资者关系页面 / irasia 官方文档服务器',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 9:
              raise RuntimeError(f'document count mismatch: {len(records)}')
          if sum(r['category'] == '年度报告' for r in records) != 6:
              raise RuntimeError('annual report count mismatch')

          readme = [
              '高鑫零售有限公司（06808.HK）2020—2025年发布的年度报告、招股章程及最新中期报告',
              '整理日期：2026-09-22',
              '',
              '一、收录范围',
              '1. 年度报告共6份，按报告发布年份覆盖2020—2025年。',
              '2. 原始招股章程（Global Offering）及补充招股章程各1份。',
              '3. 最新一期定期财务报告为2025/2026中期报告，共1份。',
              '',
              '二、年度报告年份说明',
              '高鑫零售曾将财政年度结算日由12月31日改为3月31日，因此官方报告标签并非简单的自然年度。',
              '本包按“报告发布年份”整理：2020年发布2019年年度报告；2021年发布2020/2021年度报告（覆盖截至2021年3月31日止十五个月）；此后依次为2021/2022、2022/2023、2023/2024及2024/2025年度报告。',
              '因此，文件名同时保留官方财年标签和发布年份，避免误把过渡财年的报告遗漏或重复。',
              '',
              '三、关于“最新季报”',
              '高鑫零售现行官方定期报告栏目未发布独立季度报告，港股主体以年度报告和中期报告为主要定期财务报告。',
              '本包以截至2025年9月30日止六个月的2025/2026中期报告作为最新一期财务报告。',
              '',
              '四、文件清单',
          ]
          for i, record in enumerate(records, 1):
              readme.extend([
                  f"{i}. {record['title']}",
                  f"   类别：{record['category']}；期间：{record['period']}",
                  f"   文件：{record['filename']}",
                  f"   页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          readme.extend([
              '五、完整性核验',
              '所有PDF均完成文件头、公司身份、文档类型、页数、qpdf结构、重复文件、SHA-256及ZIP CRC检查。',
          ])

          (out / '00_文件清单与年份说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{record['sha256']}  {record['filename']}\n" for record in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 9:
                  raise RuntimeError(f'PDF count mismatch in ZIP: {len(pdfs)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: sunartretail-06808-annual-prospectus-interim-final
          path: 高鑫零售_06808_2020-2025年报_招股说明书_最新中期报告_官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
