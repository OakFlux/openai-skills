name: Discover archived Zhengzhou Coal reports in Hibor 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-600121-hibor-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch Hibor archive months and locate reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          months=['201704','201707','201312','201012','201103','201108']
          hosts=['https://wt.hibor.com.cn','https://www.hibor.com.cn','https://sysbg.hibor.com.cn','http://wt.hibor.com.cn','http://www.hibor.com.cn','http://sysbg.hibor.com.cn']
          out=Path('zzmd_hibor_discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          summaries=[]; matches=[]
          needles=['郑州煤电','郑煤','低估值+国改预期','原有业务难以维系','成长遇瓶颈','扭亏为盈']
          for host in hosts:
            for month in months:
              url=f'{host}/archiver_houtai/{month}.html'
              try:
                r=s.get(url,timeout=(20,90),allow_redirects=True)
                enc=r.apparent_encoding or r.encoding or 'gb18030'; r.encoding=enc
                html=r.text
                summary={'url':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'title':'','matches':0}
                soup=BeautifulSoup(html,'lxml')
                summary['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                page_matches=[]
                for a in soup.find_all('a',href=True):
                  text=' '.join(a.get_text(' ',strip=True).split())
                  href=urllib.parse.urljoin(r.url,a['href'])
                  if any(n in text for n in needles):
                    rec={'month':month,'source_url':url,'final_url':r.url,'text':text,'href':href}
                    page_matches.append(rec); matches.append(rec)
                if not page_matches:
                  # capture nearby raw lines, even if links were not parsed
                  for n in needles:
                    if n in html:
                      idx=html.find(n)
                      page_matches.append({'month':month,'source_url':url,'needle':n,'raw':html[max(0,idx-500):idx+1000]})
                summary['matches']=len(page_matches); summaries.append(summary)
                if page_matches:
                  (out/f'{re.sub(r"[^A-Za-z0-9]+","_",host)}_{month}.html').write_text(html,encoding='utf-8',errors='replace')
                  print('MATCH',json.dumps(page_matches,ensure_ascii=False,indent=2)[:20000])
                else:
                  print('NO',json.dumps(summary,ensure_ascii=False))
              except Exception as exc:
                summaries.append({'url':url,'error':repr(exc)})
          # dedupe
          unique=[]; seen=set()
          for x in matches:
            key=(x.get('text'),x.get('href'))
            if key not in seen:
              seen.add(key); unique.append(x)
          (out/'summaries.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matches.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matches.txt').write_text('\n'.join(f"{x.get('month')}\t{x.get('text')}\t{x.get('href')}" for x in unique),encoding='utf-8')
          print('UNIQUE',len(unique))
          print((out/'matches.txt').read_text(encoding='utf-8'))
          PY

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-600121-hibor-discovery-20261014
          path: zzmd_hibor_discovery
          retention-days: 2
          if-no-files-found: error
