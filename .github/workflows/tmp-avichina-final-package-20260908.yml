name: Build verified AviChina 2020-2025 reports package
on:
  push:
    branches: [tmp-avichina-final-package-20260908]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow
      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/reports work/renders
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import re
          import shutil
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('output')
          REPORT_DIR = Path('work/reports')
          RENDER_DIR = Path('work/renders')
          OUT.mkdir(parents=True, exist_ok=True)
          REPORT_DIR.mkdir(parents=True, exist_ok=True)
          RENDER_DIR.mkdir(parents=True, exist_ok=True)

          retry = Retry(
              total=7,
              connect=7,
              read=7,
              status=7,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=frozenset(['GET']),
          )
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'seq': 1,
                  'year': 2020,
                  'kind': '年度报告',
                  'display': '2020年年度报告',
                  'filename': '01_AviChina_2020_Annual_Report.pdf',
                  'min_pages': 180,
                  'urls': [
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/0cfe9-2026-03-09.pdf?ref=U3RvY2tBbmFseXNpcw=='),
                  ],
              },
              {
                  'seq': 2,
                  'year': 2021,
                  'kind': '年度报告',
                  'display': '2021年年度报告',
                  'filename': '02_AviChina_2021_Annual_Report.pdf',
                  'min_pages': 300,
                  'urls': [
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/727ad-2025-12-05-09-01-31.pdf?ref=U3RvY2tBbmFseXNpcw=='),
                  ],
              },
              {
                  'seq': 3,
                  'year': 2022,
                  'kind': '年度报告',
                  'display': '2022年年度报告',
                  'filename': '03_AviChina_2022_Annual_Report.pdf',
                  'min_pages': 230,
                  'urls': [
                      ('中航科工官网', 'https://www.avichina.com/upload/resources/file/2025/01/06/169565.pdf'),
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/bf706-2025-12-05-09-00-23.pdf?ref=U3RvY2tBbmFseXNpcw=='),
                  ],
              },
              {
                  'seq': 4,
                  'year': 2023,
                  'kind': '年度报告',
                  'display': '2023年年度报告',
                  'filename': '04_AviChina_2023_Annual_Report.pdf',
                  'min_pages': 280,
                  'urls': [
                      ('中航科工官网', 'https://www.avichina.com/upload/resources/file/2025/01/06/169567.pdf'),
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/4a62a-2025-12-05-09-23-10.pdf?ref=U3RvY2tBbmFseXNpcw=='),
                  ],
              },
              {
                  'seq': 5,
                  'year': 2024,
                  'kind': '年度报告',
                  'display': '2024年年度报告',
                  'filename': '05_AviChina_2024_Annual_Report.pdf',
                  'min_pages': 260,
                  'urls': [
                      ('中航科工官网', 'https://www.avichina.com/upload/resources/file/2025/11/12/180991.pdf'),
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/6c962-2025-04-24-08-00-48.pdf?ref=U3RvY2tBbmFseXNpcw=='),
                  ],
              },
              {
                  'seq': 6,
                  'year': 2025,
                  'kind': '年度报告',
                  'display': '2025年年度报告',
                  'filename': '06_AviChina_2025_Annual_Report.pdf',
                  'min_pages': 240,
                  'urls': [
                      ('中航科工官网', 'https://www.avichina.com/upload/resources/file/2026/04/22/KA3KE23YQM6DSPN0EQ3DEQN2KQ5A.pdf'),
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/49cc6-2026-04-22-08-56-19.pdf?ref=U0E='),
                  ],
              },
              {
                  'seq': 7,
                  'year': 2026,
                  'kind': '最新集团财务披露',
                  'display': '2026年中期业绩公告',
                  'filename': '07_AviChina_2026_Interim_Results_Announcement.pdf',
                  'min_pages': 20,
                  'urls': [
                      ('港交所披露易', 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0826/2026082601119.pdf'),
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/5710708f9e903f56acc755b56b4a2053-2026-08-26-11-09-49.pdf?ref=U0E='),
                  ],
              },
              {
                  'seq': 8,
                  'year': 2025,
                  'kind': '最新完整中期报告补充',
                  'display': '2025年中期报告（完整报告补充）',
                  'filename': '08_AviChina_2025_Interim_Report_Supplement.pdf',
                  'min_pages': 70,
                  'urls': [
                      ('中航科工官网', 'https://www.avichina.com/upload/resources/file/2025/09/24/179239.pdf'),
                      ('Quartr官方披露镜像', 'https://files.quartr.com/reports/5e172-2025-12-05-09-18-00.pdf?ref=U3RvY2tBbmFseXNpcw=='),
                  ],
              },
          ]

          def compact(value: str) -> str:
              return re.sub(r'\s+', '', value or '').upper()

          def text_sample(data: bytes, pages_to_read: int = 12) -> tuple[int, str]:
              reader = PdfReader(io.BytesIO(data), strict=False)
              page_count = len(reader.pages)
              parts = []
              for page in reader.pages[:min(page_count, pages_to_read)]:
                  try:
                      parts.append(page.extract_text() or '')
                  except Exception:
                      pass
              if len(''.join(parts)) < 100:
                  try:
                      doc = pymupdf.open(stream=data, filetype='pdf')
                      for index in range(min(len(doc), pages_to_read)):
                          parts.append(doc[index].get_text('text') or '')
                      doc.close()
                  except Exception:
                      pass
              return page_count, '\n'.join(parts)

          def validate_identity(spec: dict, pages: int, sample: str) -> None:
              if pages < spec['min_pages']:
                  raise RuntimeError(f'PDF appears incomplete: {pages} pages < {spec["min_pages"]}')
              normalized = compact(sample)
              company_ok = any(token in normalized for token in [
                  'AVICHINAINDUSTRY&TECHNOLOGY',
                  'AVICHINAINDUSTRYANDTECHNOLOGY',
                  '中国航空科技工业股份有限公司',
                  '中國航空科技工業股份有限公司',
              ])
              stock_ok = '2357' in normalized
              year_ok = str(spec['year']) in normalized or {
                  2020: '二零二零', 2021: '二零二一', 2022: '二零二二',
                  2023: '二零二三', 2024: '二零二四', 2025: '二零二五',
                  2026: '二零二六',
              }[spec['year']] in sample
              if not company_ok:
                  raise RuntimeError('Company identity was not found in the first pages')
              if not stock_ok:
                  raise RuntimeError('Stock code 2357 was not found in the first pages')
              if not year_ok:
                  raise RuntimeError(f'Report year {spec["year"]} was not found in the first pages')
              if spec['kind'] == '年度报告':
                  if not any(token in normalized for token in ['ANNUALREPORT', '年度报告', '年度報告', '年報']):
                      raise RuntimeError('Annual-report marker was not found')
              if spec['seq'] == 7:
                  if not any(token in normalized for token in ['INTERIMRESULTS', '中期业绩', '中期業績']):
                      raise RuntimeError('Interim-results marker was not found')
              if spec['seq'] == 8:
                  if not any(token in normalized for token in ['INTERIMREPORT', '中期报告', '中期報告']):
                      raise RuntimeError('Interim-report marker was not found')

          manifest = []
          render_paths = []
          audit = []

          for spec in reports:
              destination = REPORT_DIR / spec['filename']
              accepted = None
              errors = []
              for source_name, url in spec['urls']:
                  for attempt in range(1, 5):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Referer': 'https://www.avichina.com/',
                              },
                              timeout=(30, 300),
                              allow_redirects=True,
                          )
                          print('DOWNLOAD', spec['seq'], source_name, attempt, response.status_code, len(response.content), response.url, flush=True)
                          response.raise_for_status()
                          data = response.content
                          if b'%PDF-' not in data[:2048] or len(data) < 50_000:
                              raise RuntimeError(f'Invalid PDF payload ({len(data)} bytes)')
                          pages, sample = text_sample(data)
                          validate_identity(spec, pages, sample)
                          destination.write_bytes(data)
                          accepted = {
                              'source_name': source_name,
                              'requested_url': url,
                              'final_url': response.url,
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': hashlib.sha256(data).hexdigest(),
                          }
                          break
                      except Exception as exc:
                          errors.append({'source': source_name, 'url': url, 'attempt': attempt, 'error': repr(exc)})
                          print('RETRY', spec['seq'], source_name, attempt, repr(exc), flush=True)
                          time.sleep(min(2 ** attempt, 12))
                  if accepted:
                      break
              audit.append({'spec': spec, 'accepted': accepted, 'errors': errors})
              if not accepted:
                  raise RuntimeError(f'Unable to obtain a verified copy of {spec["display"]}: {errors}')

              document = pymupdf.open(destination)
              first_pix = document[0].get_pixmap(matrix=pymupdf.Matrix(1.25, 1.25), alpha=False)
              first_render = RENDER_DIR / f'{spec["seq"]:02d}_first.png'
              first_pix.save(str(first_render))
              last_pix = document[-1].get_pixmap(matrix=pymupdf.Matrix(0.75, 0.75), alpha=False)
              last_render = RENDER_DIR / f'{spec["seq"]:02d}_last.png'
              last_pix.save(str(last_render))
              document.close()
              render_paths.append(first_render)

              manifest.append({
                  '序号': spec['seq'],
                  '文件名': destination.name,
                  '报告类型': spec['kind'],
                  '报告说明': spec['display'],
                  '报告年度': spec['year'],
                  'PDF页数': accepted['pages'],
                  '文件大小_字节': accepted['bytes'],
                  'SHA256': accepted['sha256'],
                  '下载来源类型': accepted['source_name'],
                  '实际下载地址': accepted['final_url'],
              })
              print('VERIFIED', destination.name, accepted['pages'], accepted['bytes'], accepted['sha256'], flush=True)

          annual_years = [row['报告年度'] for row in manifest if row['报告类型'] == '年度报告']
          if annual_years != [2020, 2021, 2022, 2023, 2024, 2025]:
              raise RuntimeError(f'Annual coverage mismatch: {annual_years}')
          if len(manifest) != 8:
              raise RuntimeError(f'Expected eight PDFs, got {len(manifest)}')

          manifest_path = REPORT_DIR / '文件清单与校验值.csv'
          with manifest_path.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest[0].keys()))
              writer.writeheader()
              writer.writerows(manifest)

          readme_lines = [
              '中国航空科技工业股份有限公司（中航科工，02357.HK）',
              '2020—2025年年度报告及最新集团财务披露资料包',
              '打包日期：2026-09-08',
              '',
              '收录内容：',
              '1. 2020年至2025年完整年度报告，共6份。',
              '2. 2026年中期业绩公告，作为截至打包日最新的集团层面财务披露。',
              '3. 2025年完整中期报告，作为最新已发布完整中期报告的补充。',
              '',
              '说明：中航科工为香港上市公司，不按A股格式发布集团一季报和三季报。',
              '本资料包只收录中航科工集团报告，未混入中航光电、中航机载、中直股份、洪都航空等A股子公司季度或年度报告。',
              '2020年和2021年报告采用Quartr保存的官方披露镜像；其余优先采用中航科工官网或港交所披露易原文件。',
              '全部PDF均已检查文件头、可解析性、公司名称、股票代码、报告年度、实际页数、首页与末页渲染；ZIP已完成CRC测试。',
              '',
          ]
          for row in manifest:
              readme_lines.extend([
                  f"{row['序号']}. {row['报告说明']}｜{row['PDF页数']}页｜{row['下载来源类型']}",
                  f"   文件：{row['文件名']}",
              ])
          (REPORT_DIR / 'README.txt').write_text('\n'.join(readme_lines), encoding='utf-8')

          cards = []
          for index, render_path in enumerate(render_paths, 1):
              with Image.open(render_path) as image:
                  rgb = image.convert('RGB')
                  rgb.thumbnail((420, 590))
                  card = Image.new('RGB', (460, 650), 'white')
                  card.paste(rgb, ((460 - rgb.width) // 2, 10))
                  draw = ImageDraw.Draw(card)
                  draw.text((15, 615), f'{index:02d}', fill='black')
                  cards.append(card)
          columns = 4
          rows = (len(cards) + columns - 1) // columns
          sheet = Image.new('RGB', (460 * columns, 650 * rows), 'white')
          for index, card in enumerate(cards):
              sheet.paste(card, ((index % columns) * 460, (index // columns) * 650))
              card.close()
          sheet.save(OUT / 'first_page_contact_sheet.jpg', quality=90)
          sheet.close()

          archive = OUT / 'AviChina_02357_2020-2025_Annual_and_Latest_Reports.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as bundle:
              for path in sorted(REPORT_DIR.iterdir()):
                  bundle.write(path, arcname=path.name)
          with zipfile.ZipFile(archive, 'r') as bundle:
              bad = bundle.testzip()
              pdf_names = [name for name in bundle.namelist() if name.lower().endswith('.pdf')]
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failed at {bad}')
              if len(pdf_names) != 8:
                  raise RuntimeError(f'ZIP contains {len(pdf_names)} PDFs instead of 8')

          chinese_archive = OUT / '中航科工_02357_2020-2025年报及最新财务报告.zip'
          shutil.copy2(archive, chinese_archive)
          (OUT / 'download_audit.json').write_text(json.dumps(audit, ensure_ascii=False, indent=2), encoding='utf-8')
          result = {
              'ok': True,
              'archive': archive.name,
              'chinese_archive': chinese_archive.name,
              'archive_bytes': archive.stat().st_size,
              'pdf_count': 8,
              'zip_crc_ok': True,
              'reports': manifest,
          }
          (OUT / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PACKAGE_OK', json.dumps(result, ensure_ascii=False), flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: avichina-verified-reports-package
          path: output/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
