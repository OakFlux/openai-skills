name: Build corrected CaiDie Industry broker research package 20261005

on:
  push:
    paths:
      - '.github/workflows/caidie-industry-603073-broker-reports-package-v2-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download public previews, build PDFs and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from io import BytesIO
          from pathlib import Path
          from typing import Any

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '彩蝶实业_603073_券商公司覆盖及相关新股研究_公开预览版_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          previews = root / '首页预览'
          previews.mkdir(exist_ok=True)
          work = Path('_work_caidie_v2')
          work.mkdir(exist_ok=True)

          reports = [
              {
                  'id': 349995,
                  'broker': '华金证券',
                  'date': '2023-02-06',
                  'title': '彩蝶实业（603073.SH）：新股覆盖研究',
                  'analysts': '李蕙',
                  'category': '直接公司覆盖报告',
                  'relevance': '直接针对彩蝶实业的公司覆盖报告。',
                  'filename': '01_华金证券_彩蝶实业_新股覆盖研究_公开页面完整10页_2023-02-06.pdf',
              },
              {
                  'id': 363074,
                  'broker': '国海证券',
                  'date': '2023-03-10',
                  'title': '中小盘新股研究月报：新股研究——建议关注派瑞特气、日联科技、南芯科技、美利信',
                  'analysts': '杨阳、罗琨',
                  'category': '相关新股专题研究',
                  'relevance': '报告首页投资要点列示彩蝶实业（603073.SH），用于补充上市阶段的新股研究背景。',
                  'filename': '02_国海证券_中小盘新股研究月报_含彩蝶实业研究信息_公开预览前10页_2023-03-10.pdf',
              },
              {
                  'id': 398960,
                  'broker': '华安证券',
                  'date': '2023-04-17',
                  'title': '首批注册制主板新股上市首日表现亮眼——“打新定期跟踪”系列之一百二十一',
                  'analysts': '严佳炜、钱静闲、吴正宇、骆昱杉',
                  'category': '相关新股跟踪研究',
                  'relevance': '公开全文检索显示，报告的近期新股实际打新表现表列入彩蝶实业（603073.SH）。',
                  'filename': '03_华安证券_首批注册制主板新股上市首日表现亮眼_含彩蝶实业_公开预览前10页_2023-04-17.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url: str, payload: dict[str, Any]) -> dict[str, Any]:
              last: Any = None
              for attempt in range(7):
                  try:
                      r = session.post(url, json=payload, timeout=(20,120))
                      last = {'status':r.status_code,'text':r.text[:500]}
                      if r.status_code == 200:
                          return r.json()
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'POST failed {url}: {last}')

          def fetch_image(url: str) -> bytes:
              last: Any = None
              headers = {
                  'Referer':'https://www.sdyanbao.com/',
                  'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
              }
              for attempt in range(7):
                  try:
                      r = session.get(url, headers=headers, timeout=(20,120), allow_redirects=True)
                      last = {'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')}
                      if r.status_code == 200 and len(r.content) > 12_000:
                          with Image.open(BytesIO(r.content)) as im:
                              im.verify()
                          return r.content
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Image failed {url}: {last}')

          manifest: list[dict[str, Any]] = []
          for index, report in enumerate(reports, 1):
              response = post_json('https://api.sdyanbao.com/api/file/detail', {'id':report['id']})
              detail = response.get('data') if isinstance(response,dict) else None
              if not isinstance(detail,dict):
                  raise RuntimeError(f'Invalid detail response for {report["id"]}: {response}')
              page_url = str(detail.get('page_url') or '').rstrip('/')
              total_pages = int(detail.get('page_count') or 0)
              if not page_url or total_pages <= 0:
                  raise RuntimeError(f'Invalid page metadata for {report["id"]}')
              public_pages = min(10,total_pages)
              report_work = work / str(report['id'])
              report_work.mkdir(exist_ok=True)
              page_files: list[Path] = []
              for page_no in range(public_pages):
                  raw = fetch_image(f'{page_url}/{page_no}.png')
                  source = report_work / f'{page_no:02d}_src.png'
                  source.write_bytes(raw)
                  with Image.open(source) as im:
                      rgba = im.convert('RGBA')
                      canvas = Image.new('RGBA',rgba.size,(255,255,255,255))
                      canvas.alpha_composite(rgba)
                      rgb = canvas.convert('RGB')
                      output_image = report_work / f'{page_no:02d}.jpg'
                      rgb.save(output_image,'JPEG',quality=95,subsampling=0)
                      page_files.append(output_image)

              pdf_path = root / report['filename']
              images = [Image.open(p).convert('RGB') for p in page_files]
              try:
                  images[0].save(pdf_path,save_all=True,append_images=images[1:],resolution=150.0,quality=95)
              finally:
                  for im in images:
                      im.close()

              reader = PdfReader(str(pdf_path),strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != public_pages:
                  raise RuntimeError(f'Page mismatch {pdf_path.name}: {actual_pages} != {public_pages}')
              subprocess.run(['qpdf','--check',str(pdf_path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix = previews / pdf_path.stem
              subprocess.run(
                  ['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(pdf_path),str(prefix)],
                  check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview render failed: {pdf_path.name}')
              sha = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              document_nature = (
                  '公开页面完整10页；非券商原始附件'
                  if total_pages == public_pages
                  else f'原报告{total_pages}页；本PDF为公开预览前{public_pages}页，非券商原始完整附件'
              )
              manifest.append({
                  **report,
                  'source_name':detail.get('name'),
                  'source_page':f'https://www.sdyanbao.com/detail/{report["id"]}',
                  'page_image_base':page_url,
                  'original_total_pages':total_pages,
                  'public_pages_in_pdf':public_pages,
                  'pdf_file':pdf_path.name,
                  'actual_pdf_pages':actual_pages,
                  'bytes':pdf_path.stat().st_size,
                  'sha256':sha,
                  'preview_file':str(Path('首页预览')/preview.name),
                  'document_nature':document_nature,
                  'validation':['public-page image integrity','white-background compositing','PDF page count','qpdf structure','first-page render'],
              })

          readme = [
              '彩蝶实业（603073.SH）券商公司覆盖及相关新股研究公开资料包',
              '整理日期：2026-10-05',
              '',
              '检索结论：公开个股研报索引中仅发现1份直接针对彩蝶实业的券商公司覆盖报告，即华金证券2023年新股覆盖研究。',
              '为提供2-3份可用资料，本包另收录2份明确包含彩蝶实业上市或打新信息的券商新股专题报告。相关报告已在文件名及清单中明确标注，未冒充彩蝶实业单独深度报告。',
              '本包未绕过账户、会员、付费或数据库访问限制；文件均为公开页面或公开预览页转换的PDF。',
              '',
          ]
          for i,item in enumerate(manifest,1):
              readme += [
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   类型：{item['category']}；日期：{item['date']}；分析师：{item['analysts']}",
                  f"   关联说明：{item['relevance']}",
                  f"   原报告：{item['original_total_pages']}页；本PDF：{item['public_pages_in_pdf']}页",
                  f"   资料性质：{item['document_nature']}",
                  f"   来源页面：{item['source_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '报告版权归原券商和作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：公开页面身份、图片完整性、PDF页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['pdf_file']}\n" for item in manifest),encoding='utf-8')

          zip_path = Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path,arcname=f'{PACKAGE}/{path.relative_to(root)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs)!=3:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          short_path=Path('caidie_reports.zip')
          short_path.write_bytes(zip_path.read_bytes())
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'SHA256',zip_sha)
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: caidie-industry-603073-broker-research-package-v2-final
          path: |
            彩蝶实业_603073_券商公司覆盖及相关新股研究_公开预览版_3份.zip
            caidie_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
