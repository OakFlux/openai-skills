name: Probe Guangju report document pages

on:
  push:
    branches:
      - tmp/guangju-000096-broker-reports-20261104-v1
    paths:
      - .github/workflows/guangju-000096-document-sites-probe-20261104-v4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect public pages and embedded file links
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages = [
            "https://www.vzkoo.com/document/202505190f7fc09b1e5fab5fa5f2269a.html",
            "https://max.book118.com/html/2025/0519/8075127143007066.shtm",
            "https://news.10jqka.com.cn/field/sr/19700101/52417839.shtml",
            "https://www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId=800916178208&content=%E5%B9%BF%E8%81%9A%E8%83%BD%E6%BA%90(000096)%EF%BC%9A%E7%BB%BC%E5%90%88%E8%83%BD%E6%BA%90%E4%BE%9B%E5%BA%94%E5%95%86%20%E5%A4%96%E5%BB%B6%E5%86%85%E7%94%9F%E8%B8%8F%E4%B8%8A%E6%96%B0%E5%BE%81%E9%80%94",
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept-Language":"zh-CN,zh;q=0.9,en;q=0.8"})
          for page in pages:
            print("\n================ PAGE",page,"================")
            try:
              r=s.get(page,timeout=(25,180),allow_redirects=True)
              print("STATUS",r.status_code,"FINAL",r.url,"BYTES",len(r.content),"TYPE",r.headers.get("content-type"))
              enc=r.apparent_encoding or r.encoding or "utf-8"
              text=r.content.decode(enc,errors="replace")
              soup=BeautifulSoup(text,"lxml")
              print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
              visible=" ".join(soup.get_text(" ",strip=True).split())
              print("VISIBLE_HEAD",visible[:2500])
              found=[]
              for tag in soup.find_all(True):
                for attr in ["href","src","data-url","data-src","data-href","data-file","data-pdf","content"]:
                  v=tag.get(attr)
                  if not v: continue
                  full=urljoin(r.url,html.unescape(str(v)).replace("\\/","/"))
                  if any(k in full.lower() for k in [".pdf","download","document","preview","file","oss","cos","report"]):
                    found.append((tag.name,attr,full))
              regexes=[
                r'https?://[^\s\"\'<>\\]+?\.pdf(?:\?[^\s\"\'<>\\]*)?',
                r'https?:\\?/\\?/[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                r'[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
              ]
              for pattern in regexes:
                for m in re.findall(pattern,text,flags=re.I):
                  full=urljoin(r.url,html.unescape(m).replace("\\/","/"))
                  found.append(("regex","pdf",full))
              unique=[]
              for x in found:
                if x[2] not in [z[2] for z in unique]: unique.append(x)
              for x in unique[:200]: print("CANDIDATE",x)
              for pat in ["pdfUrl","fileUrl","downloadUrl","previewUrl","oss","cos","documentId","docId","8075127143007066","202505190f7fc09b1e5fab5fa5f2269a","52417839","800916178208"]:
                for m in list(re.finditer(pat,text,re.I))[:5]:
                  print("AROUND",pat,text[max(0,m.start()-500):m.start()+1800].replace("\n"," "))
            except Exception as exc:
              print("PAGE_ERROR",repr(exc))
          PY
