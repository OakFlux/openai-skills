name: Build final Zhaojin Mining broker report archive
on:
  push:
    branches:
      - tmp-zhaojin-final-v3-20260907
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
      - name: Download, validate, and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/pages work/final work/renders
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, shutil, time, zipfile
          from pathlib import Path
          import img2pdf, pymupdf, requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          OUT=Path('output'); WORK=Path('work'); PAGES=WORK/'pages'; FINAL=WORK/'final'; RENDERS=WORK/'renders'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          records=[]

          def fetch(url, *, referer, accept):
              last=None
              for attempt in range(4):
                  try:
                      r=s.get(url,headers={'Referer':referer,'Accept':accept},timeout=(20,180))
                      r.raise_for_status()
                      return r.content
                  except Exception as exc:
                      last=exc
                      time.sleep(1.5*(attempt+1))
              raise last

          # 第一上海15页完整首发报告（公开原报告逐页图像）。
          base='https://oss.sdyanbao.com/page/2024/7/2/1030510'; paths=[]; hashes=set()
          for idx in range(15):
              url=f'{base}/{idx}.png'; data=fetch(url,referer=base,accept='image/*,*/*')
              if len(data)<15000: raise RuntimeError(f'First Shanghai page {idx+1} too small: {len(data)}')
              digest=hashlib.sha256(data).hexdigest()
              if digest in hashes: raise RuntimeError(f'First Shanghai duplicate page {idx+1}')
              hashes.add(digest)
              im=Image.open(io.BytesIO(data)); im.verify(); im=Image.open(io.BytesIO(data)); width,height=im.size; fmt=im.format; im.close()
              if width<800 or height<650: raise RuntimeError(f'First Shanghai bad dimensions {idx+1}: {width}x{height}')
              p=PAGES/f'firstshanghai_{idx:03d}.png'; p.write_bytes(data); paths.append(p)
              print('FIRSTSHANGHAI_PAGE_OK',idx+1,len(data),width,height,fmt,flush=True)
          pdf1=FINAL/'2024-06-21_第一上海_黄金行业优质高成长公司_增长潜力巨大.pdf'; pdf1.write_bytes(img2pdf.convert([str(p) for p in paths]))
          data1=pdf1.read_bytes(); pages1=len(PdfReader(io.BytesIO(data1),strict=False).pages)
          if pages1!=15: raise RuntimeError(f'First Shanghai PDF pages={pages1}')
          records.append({'filename':pdf1.name,'path':str(pdf1),'broker':'第一上海证券','date':'2024-06-21','title':'招金矿业（1818.HK）首发报告：黄金行业优质高成长公司，增长潜力巨大','pages':pages1,'bytes':len(data1),'sha256':hashlib.sha256(data1).hexdigest(),'source':'https://oss.sdyanbao.com/page/2024/7/2/1030510','note':'公开原报告15页图像按原页序无删减合并为PDF'})

          # 浙商证券30页公司深度原始PDF。
          page_url='https://www.hangyan.co/reports/3466271943412417652'
          direct='https://cdn.hangyan.co/document_reports/3466271943412417652/202409_zhaojinkuangyeshengqianli_zhaojinerlai.pdf'
          data2=fetch(direct,referer=page_url,accept='application/pdf,*/*')
          if not data2.lstrip().startswith(b'%PDF') or len(data2)<100000: raise RuntimeError('Invalid Zheshang PDF')
          reader=PdfReader(io.BytesIO(data2),strict=False); pages2=len(reader.pages); text='\n'.join((p.extract_text() or '') for p in reader.pages[:3])
          if pages2!=30 or '招金矿业' not in text or '浙商' not in text: raise RuntimeError(f'Zheshang identity failed pages={pages2}')
          pdf2=FINAL/'2024-09-27_浙商证券_深聚潜力_招金而来.pdf'; pdf2.write_bytes(data2)
          records.append({'filename':pdf2.name,'path':str(pdf2),'broker':'浙商证券','date':'2024-09-27','title':'招金矿业（01818.HK）深度报告：深聚潜力，“招”金而来','pages':pages2,'bytes':len(data2),'sha256':hashlib.sha256(data2).hexdigest(),'source':page_url,'note':'公开下载的券商原始PDF'})

          # 首页渲染质检图。
          cards=[]
          for rec in records:
              doc=pymupdf.open(rec['path']); pix=doc[0].get_pixmap(matrix=pymupdf.Matrix(1.2,1.2),alpha=False); rp=RENDERS/(Path(rec['filename']).stem+'.png'); pix.save(str(rp)); doc.close()
              im=Image.open(rp).convert('RGB'); im.thumbnail((620,820)); card=Image.new('RGB',(680,930),'white'); card.paste(im,((680-im.width)//2,20)); ImageDraw.Draw(card).text((20,875),f"{rec['broker']} | {rec['date']} | {rec['pages']} pages",fill='black'); cards.append(card); im.close()
          sheet=Image.new('RGB',(1360,930),'white'); sheet.paste(cards[0],(0,0)); sheet.paste(cards[1],(680,0)); sheet.save(OUT/'first_page_contact_sheet.jpg',quality=90)
          for c in cards:c.close()

          manifest=FINAL/'文件清单与校验值.csv'
          fields=['序号','券商','发布日期','报告标题','PDF页数','文件大小_字节','SHA256','公开来源','版本说明','文件名']
          with manifest.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for i,x in enumerate(records,1): w.writerow({'序号':i,'券商':x['broker'],'发布日期':x['date'],'报告标题':x['title'],'PDF页数':x['pages'],'文件大小_字节':x['bytes'],'SHA256':x['sha256'],'公开来源':x['source'],'版本说明':x['note'],'文件名':x['filename']})
          readme=FINAL/'README.txt'; lines=['招金矿业（01818.HK）券商深度及首发报告资料包','打包日期：2026-09-07','','收录2份完整公司级研究报告。','已检查PDF文件头、可解析性、实际页数、公司身份及首页渲染；ZIP已完成CRC校验。','']
          for i,x in enumerate(records,1): lines += [f"{i}. {x['broker']}｜{x['date']}｜{x['title']}｜{x['pages']}页",f"   版本：{x['note']}",f"   来源：{x['source']}"]
          readme.write_text('\n'.join(lines),encoding='utf-8')

          archive=OUT/'招金矿业_01818_券商深度报告_2份.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(FINAL.iterdir()): z.write(p,p.name)
          with zipfile.ZipFile(archive,'r') as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad is not None or len(pdfs)!=2: raise RuntimeError(f'ZIP failed: {bad}, {pdfs}')
          backup=OUT/'Zhaojin_Mining_01818_Broker_Reports_2.zip'; shutil.copy2(archive,backup)
          result={'ok':True,'archive':archive.name,'backup':backup.name,'archive_bytes':archive.stat().st_size,'zip_crc_ok':True,'records':records}
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'); print('PACKAGE_OK',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-broker-reports-final
          path: output/*
          retention-days: 1
          if-no-files-found: error
