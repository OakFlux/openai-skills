name: Retrieve complete First Shanghai Zhaojin report
on:
  push:
    branches:
      - tmp-zhaojin-final-v3-20260907
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
      - name: Retrieve and validate report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output pages
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, time
          from pathlib import Path
          import img2pdf, pymupdf, requests
          from PIL import Image
          from pypdf import PdfReader

          out=Path('output'); pages_dir=Path('pages')
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          session=requests.Session(); session.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          base='https://oss.sdyanbao.com/page/2024/7/2/1030510'
          paths=[]; hashes=set(); metadata=[]
          for idx in range(15):
              url=f'{base}/{idx}.png'; last=None
              for attempt in range(4):
                  try:
                      response=session.get(url,headers={'Referer':base,'Accept':'image/*,*/*'},timeout=(20,120))
                      response.raise_for_status(); data=response.content; break
                  except Exception as exc:
                      last=exc; time.sleep(1.5*(attempt+1))
              else:
                  raise last
              if len(data)<15000: raise RuntimeError(f'Page {idx+1} too small: {len(data)}')
              digest=hashlib.sha256(data).hexdigest()
              if digest in hashes: raise RuntimeError(f'Duplicate page {idx+1}')
              hashes.add(digest)
              image=Image.open(io.BytesIO(data)); image.verify(); image=Image.open(io.BytesIO(data)); width,height=image.size; fmt=image.format; image.close()
              if width<800 or height<650: raise RuntimeError(f'Bad dimensions page {idx+1}: {width}x{height}')
              path=pages_dir/f'{idx:03d}.png'; path.write_bytes(data); paths.append(path)
              metadata.append({'page':idx+1,'bytes':len(data),'width':width,'height':height,'sha256':digest})
              print('PAGE_OK',idx+1,len(data),width,height,flush=True)

          pdf=out/'2024-06-21_第一上海_黄金行业优质高成长公司_增长潜力巨大.pdf'
          pdf.write_bytes(img2pdf.convert([str(p) for p in paths]))
          data=pdf.read_bytes(); parsed=len(PdfReader(io.BytesIO(data),strict=False).pages)
          if parsed!=15: raise RuntimeError(f'PDF page count mismatch: {parsed}')
          doc=pymupdf.open(str(pdf)); pix=doc[0].get_pixmap(matrix=pymupdf.Matrix(1.5,1.5),alpha=False); pix.save(str(out/'first_page.png')); doc.close()
          result={'ok':True,'file':pdf.name,'bytes':len(data),'pages':parsed,'sha256':hashlib.sha256(data).hexdigest(),'source':base,'page_metadata':metadata}
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('REPORT_OK',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-firstshanghai-report
          path: output/*
          retention-days: 1
          if-no-files-found: error
