name: Galaxis Broker Public Preview Package

on:
  push:
    branches:
      - chatgpt-galaxis-broker-20260922
    paths:
      - .github/workflows/galaxis_broker_preview_final_20260922.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow pypdf

      - name: Build verified public-preview package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cat > /tmp/build_preview.py <<'PY'
          import hashlib, io, json, re, time, zipfile
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader

          OUT=Path('output')
          S=requests.Session()
          S.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          REPORTS=[
            {
              'id':'5491473','institution':'国泰海通证券','date':'2026-06-23',
              'title':'首次覆盖：自研筑牢技术壁垒，场内物流机器人龙头乘风扩容',
              'known_total_pages':15,
              'filename':'01_国泰海通证券_凯乐士科技首次覆盖_2026-06-23_公开预览版.pdf',
              'summary':[
                '公司具备多向穿梭车、自主移动机器人和输送分拣机器人三条核心产品线，软硬件自研比例较高。',
                '报告关注智能场内物流渗透率提升、订单储备与规模效应，以及海外市场扩张。',
                '原报告给予增持评级，并采用PS相对估值。',
              ],
            },
            {
              'id':'5693196','institution':'国联民生证券','date':'2026-09-12',
              'title':'首次覆盖报告：产品矩阵持续完善，海外业务驱动盈利拐点',
              'known_total_pages':None,
              'filename':'02_国联民生证券_凯乐士科技首次覆盖_2026-09-12_公开预览版.pdf',
              'summary':[
                '报告从存取、搬运、分拣全流程产品矩阵及WMS、WCS、RCS自研软件能力切入。',
                '核心逻辑包括场内物流智能化升级、VNA AMR低渗透率和海外项目增长。',
                '报告重点讨论收入扩张、毛利率改善与盈利拐点。',
              ],
            },
            {
              'id':'5669575','institution':'信达证券','date':'2026-09-03',
              'title':'凯乐士科技：订单储备充足，加速拓展海外市场',
              'known_total_pages':None,
              'filename':'03_信达证券_凯乐士科技_订单储备充足加速拓展海外市场_2026-09-03_公开预览版.pdf',
              'summary':[
                '报告跟踪2026年中期业绩，关注机器人及系统业务的较快增长。',
                '截至2026年6月末，公司待交付机器人及系统金额约22亿元，其中海外项目约7.1亿元。',
                '报告同时讨论费用管控、海外区域拓展及后续盈利改善。',
              ],
            },
          ]

          def get(url, referer=None, timeout=50):
            last=None
            for attempt in range(4):
              try:
                h={'Referer':referer} if referer else {}
                r=S.get(url,headers=h,timeout=timeout,allow_redirects=True)
                if r.status_code==200: return r
                last=RuntimeError(f'HTTP {r.status_code}')
              except Exception as e: last=e
              time.sleep(2**attempt)
            raise RuntimeError(f'Failed {url}: {last}')

          def strip_query(url):
            p=urlsplit(url)
            return urlunsplit((p.scheme,p.netloc,p.path,'',''))

          def find_page1(html,base,rid):
            soup=BeautifulSoup(html,'html.parser')
            candidates=[]
            for tag in soup.find_all(True):
              for attr in ('src','data-src','data-original','href','content'):
                v=tag.get(attr)
                if isinstance(v,str) and 'report-image' in v and f'{rid}-1.' in v:
                  candidates.append(urljoin(base,v))
            candidates += re.findall(rf'https?://[^\"\'<>\s]+/report-image/[^\"\'<>\s]+/{rid}-1\.(?:png|jpg|jpeg|webp)(?:\?[^\"\'<>\s]*)?',html,re.I)
            if not candidates: raise RuntimeError(f'No public preview image for {rid}')
            candidates.sort(key=lambda u:('x-oss-process' in u,len(u)))
            return candidates[0]

          def fetch_image(url,referer):
            variants=[strip_query(url),url,strip_query(url)+'?x-oss-process=image/format,webp']
            seen=set()
            for u in variants:
              if u in seen: continue
              seen.add(u)
              try: r=S.get(u,headers={'Referer':referer},timeout=40,allow_redirects=True)
              except Exception: continue
              if r.status_code!=200 or len(r.content)<10000: continue
              try:
                im=Image.open(io.BytesIO(r.content)); im.load()
              except Exception: continue
              if im.width<500 or im.height<650:
                im.close(); continue
              return u,r.content,im
            return None

          def declared_pages(html):
            vals=[]
            for pat in [r'(?:共|总计|总页数|页数)\s*[:：]?\s*(\d{1,3})\s*页',r'(?:pageCount|totalPages|totalPage|fCount)\s*[=:]\s*["\']?(\d{1,3})',r'"(?:pageCount|totalPages|totalPage|fCount)"\s*:\s*(\d{1,3})']:
              vals += [int(x) for x in re.findall(pat,html,re.I)]
            vals=[v for v in vals if 1<=v<=200]
            return max(vals) if vals else None

          manifest=[]; pdfs=[]
          for spec in REPORTS:
            rid=spec['id']; detail=f'https://www.fxbaogao.com/detail/{rid}'
            r=get(detail); html=r.text
            p1=find_page1(html,r.url,rid); clean=strip_query(p1)
            m=re.search(rf'^(.*{rid}-)1\.(png|jpg|jpeg|webp)$',clean,re.I)
            if not m: raise RuntimeError(f'Unexpected page URL: {p1}')
            prefix,ext=m.group(1),m.group(2)
            pages=[]; records=[]
            # Only collect consecutively available, no-login public preview pages.
            for n in range(1,11):
              result=fetch_image(f'{prefix}{n}.{ext}',detail)
              if result is None: break
              used,data,im=result
              rgba=im.convert('RGBA'); bg=Image.new('RGBA',rgba.size,(255,255,255,255)); bg.alpha_composite(rgba); rgb=bg.convert('RGB')
              pages.append(rgb.copy())
              records.append({'page':n,'url':used,'bytes':len(data),'width':im.width,'height':im.height,'sha256':hashlib.sha256(data).hexdigest()})
              im.close(); rgba.close(); bg.close(); rgb.close()
            if not pages: raise RuntimeError(f'No usable public pages for {rid}')
            path=OUT/spec['filename']
            pages[0].save(path,'PDF',resolution=150.0,save_all=True,append_images=pages[1:])
            for im in pages: im.close()
            reader=PdfReader(str(path))
            if reader.is_encrypted or len(reader.pages)!=len(records): raise RuntimeError(f'PDF validation failed {rid}')
            rec={
              **spec,
              'source_page':detail,
              'declared_total_pages':spec['known_total_pages'] or declared_pages(html),
              'public_preview_pages':len(records),
              'pdf_bytes':path.stat().st_size,
              'pdf_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
              'page_records':records,
              'completeness':'公开预览版；仅包含来源网站免登录公开展示的连续页面，不是完整原版。',
            }
            manifest.append(rec); pdfs.append(path)
            print('VALIDATED',json.dumps({k:rec[k] for k in ['id','institution','title','declared_total_pages','public_preview_pages','pdf_bytes','pdf_sha256']},ensure_ascii=False))

          lines=['凯乐士科技（02729.HK）券商研究报告资料包','',
                 '重要说明：本压缩包为公开预览版，不是完整原版。来源平台完整PDF需登录或具备相应权限；本资料包未绕过任何访问限制。','',
                 '包含文件：']
          for i,r in enumerate(manifest,1):
            total=f"，原报告标示{r['declared_total_pages']}页" if r['declared_total_pages'] else ''
            lines.append(f"{i}. {r['institution']}：《{r['title']}》，{r['date']}{total}；收录免登录公开预览{r['public_preview_pages']}页。")
            for x in r['summary']: lines.append('   - '+x)
          lines += ['', '技术说明：','- 各PDF由来源平台公开预览图像按原顺序合成，未改写、补写、裁剪或重排正文。','- 压缩包附逐页来源URL、文件大小及SHA-256校验值。','- 仅供个人研究与学习使用，请遵守原报告版权和免责声明。']
          (OUT/'资料说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (OUT/'文件清单及校验值.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          zpath=OUT/'凯乐士科技_券商深度报告_公开预览版_3份.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in pdfs: z.write(p,p.name)
            z.write(OUT/'资料说明.txt','资料说明.txt')
            z.write(OUT/'文件清单及校验值.json','文件清单及校验值.json')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failed: '+bad)
          summary={'zip':zpath.name,'zip_bytes':zpath.stat().st_size,'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'reports':[{k:r[k] for k in ['id','institution','title','date','declared_total_pages','public_preview_pages','pdf_bytes','pdf_sha256']} for r in manifest]}
          (OUT/'BUILD_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL',json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/build_preview.py
          ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: galaxis-broker-public-preview-package
          path: |
            output/凯乐士科技_券商深度报告_公开预览版_3份.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
