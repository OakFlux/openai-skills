name: Temporary Persist SGPJBG Search for Mengtai

on:
  push:
    branches: [tmp/fetch-mengtai-reports-20260830]
    paths: [.github/workflows/tmp-search-sgpjbg-mengtai-persist.yml]

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-mengtai-reports-20260830
          fetch-depth: 0
      - name: Search site
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import quote,urljoin
          from bs4 import BeautifulSoup
          base='https://www.sgpjbg.com/'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':base})
          urls=['search.html','Search.html?cd=1']
          for k in ['keyword','key','q','query','search','searchword','word','wd','title','k']:
            urls.append(f'search.html?{k}={quote("蒙泰高新")}')
          results=[]
          for rel in urls:
            u=urljoin(base,rel)
            try:
              r=s.get(u,timeout=45,allow_redirects=True)
              text=html.unescape(r.text);soup=BeautifulSoup(text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                t=' '.join(a.stripped_strings);href=urljoin(r.url,a['href'])
                if any(x in (t+' '+href) for x in ['蒙泰高新','300876','丙纶景气','丙纶长丝行业领跑者','双基地强势进军碳纤维']):links.append({'text':t,'href':href})
              forms=[]
              for f in soup.find_all('form'):
                forms.append({'action':urljoin(r.url,f.get('action') or ''),'method':f.get('method'),'inputs':[{'name':i.get('name'),'value':i.get('value'),'placeholder':i.get('placeholder'),'type':i.get('type')} for i in f.find_all(['input','textarea','select'])]})
              visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S);visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S);visible=re.sub(r'<[^>]+>',' ',visible);visible=re.sub(r'\s+',' ',visible).strip()
              results.append({'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links,'forms':forms,'visible_head':visible[:3000]})
            except Exception as e:results.append({'url':u,'error':repr(e)})
          Path('discoveries').mkdir(exist_ok=True)
          Path('discoveries/mengtai_sgpjbg_search.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps([{'url':x.get('url'),'status':x.get('status'),'links':x.get('links'),'forms':x.get('forms')} for x in results],ensure_ascii=False))
          PY
      - name: Commit results
        shell: bash
        run: |
          git config user.name 'OpenAI Report Discovery'
          git config user.email 'actions@users.noreply.github.com'
          git add discoveries/mengtai_sgpjbg_search.json
          git commit -m 'chore: persist SGPJBG Mengtai search results' || exit 0
          git pull --rebase origin tmp/fetch-mengtai-reports-20260830
          git push origin HEAD:tmp/fetch-mengtai-reports-20260830
