name: Build Extreme Vision 06636 filings package 20260922

on:
  push:
    paths:
      - '.github/workflows/extreme-vision-06636-filings-package-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Install PDF and parsing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf pillow

      - name: Discover official filings, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '极视角_06636_招股说明书_2025年报_2026中期业绩'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,application/pdf;q=0.8,*/*;q=0.7',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.hkexnews.hk/',
          })

          def fetch_html(url: str) -> str:
              errors: list[str] = []
              for attempt in range(1, 6):
                  try:
                      r = session.get(url, timeout=(30, 180), allow_redirects=True)
                      print('TITLE_PAGE', attempt, r.status_code, len(r.content), r.url, r.headers.get('content-type'), flush=True)
                      r.raise_for_status()
                      text = r.text
                      if '06636' not in text or len(text) < 20000:
                          raise RuntimeError(f'unexpected title page, bytes={len(r.content)}')
                      return text
                  except Exception as exc:
                      errors.append(repr(exc))
                      time.sleep(attempt * 2)
              raise RuntimeError(f'failed to fetch title page {url}: {errors}')

          def parse_title_page(lang: str) -> list[dict]:
              url = (
                  'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&documentType=-1'
                  f'&from=20260101&lang={lang}&market=SEHK&searchType=0&stockId=1000297160'
                  '&t1code=-2&t2Gcode=-2&t2code=-2&to=20260922'
              )
              html = fetch_html(url)
              Path(f'title-page-{lang}.html').write_text(html, encoding='utf-8')
              soup = BeautifulSoup(html, 'html.parser')
              rows: list[dict] = []
              for a in soup.find_all('a', href=True):
                  href = a.get('href', '').strip()
                  if '.pdf' not in href.lower():
                      continue
                  tr = a.find_parent('tr')
                  context = tr.get_text(' ', strip=True) if tr else a.parent.get_text(' ', strip=True)
                  item = {
                      'lang': lang,
                      'title': a.get_text(' ', strip=True),
                      'context': re.sub(r'\s+', ' ', context),
                      'url': urljoin(url, href),
                  }
                  rows.append(item)
                  print('PDF_LINK', json.dumps(item, ensure_ascii=False), flush=True)
              if not rows:
                  raise RuntimeError(f'no PDF links parsed for lang={lang}')
              return rows

          en_rows = parse_title_page('EN')
          zh_rows = parse_title_page('ZH')

          def norm(value: str) -> str:
              return re.sub(r'[\s\-—–_：:（）()／/,.，。\[\]]+', '', value).lower()

          def choose(rows: list[dict], predicate, label: str) -> dict:
              matches = [r for r in rows if predicate(r, norm(r['title']), norm(r['context']))]
              print('MATCHES', label, json.dumps(matches, ensure_ascii=False, indent=2), flush=True)
              if len(matches) != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {len(matches)}')
              return matches[0]

          def disclosure_date(row: dict) -> str:
              m = re.search(r'(\d{2})/(\d{2})/(\d{4})', row['context'])
              if not m:
                  raise RuntimeError(f'cannot parse disclosure date: {row}')
              day, month, year = m.groups()
              return f'{year}-{month}-{day}'

          en_prospectus = choose(
              en_rows,
              lambda r, t, c: t == 'globaloffering' and 'listingdocuments' in c and 'offerforsubscription' in c,
              'English final prospectus',
          )
          zh_prospectus = choose(
              zh_rows,
              lambda r, t, c: t == '全球發售' and '上市文件' in r['context'] and '發售以供認購' in r['context'],
              'Chinese final prospectus',
          )
          en_annual = choose(
              en_rows,
              lambda r, t, c: t in ('annualreport2025', '2025annualreport') and 'annualreport' in c and 'financialstatements' in c,
              'English 2025 annual report',
          )
          zh_annual = choose(
              zh_rows,
              lambda r, t, c: t in ('2025年報', '2025年度報告', '2025年年度報告') and ('年報' in r['context'] or '年度報告' in r['context']) and '財務報表' in r['context'],
              'Chinese 2025 annual report',
          )

          def choose_latest_stage(rows: list[dict], lang: str) -> tuple[dict, str]:
              if lang == 'EN':
                  full = [r for r in rows if 'interim/half-yearreport' in r['context'].lower() and 'interimreport' in norm(r['title'])]
                  if len(full) == 1:
                      return full[0], 'interim_report'
                  announcements = [
                      r for r in rows
                      if 'interimresults' in norm(r['title'])
                      and 'sixmonthsendedjune30,2026'.replace(',', '') in norm(r['title']).replace(',', '')
                  ]
              else:
                  full = [r for r in rows if ('中期/半年度報告' in r['context'] or '中期報告' in r['context']) and '中期報告' in r['title']]
                  if len(full) == 1:
                      return full[0], 'interim_report'
                  announcements = [
                      r for r in rows
                      if '2026年6月30日' in r['title']
                      and '中期業績' in r['title']
                  ]
              print('STAGE_FULL', lang, json.dumps(full, ensure_ascii=False, indent=2), flush=True)
              print('STAGE_ANNOUNCEMENTS', lang, json.dumps(announcements, ensure_ascii=False, indent=2), flush=True)
              if len(announcements) != 1:
                  raise RuntimeError(f'{lang} latest stage document: expected one result, found {len(announcements)}')
              return announcements[0], 'interim_results'

          en_stage, en_stage_type = choose_latest_stage(en_rows, 'EN')
          zh_stage, zh_stage_type = choose_latest_stage(zh_rows, 'ZH')
          if en_stage_type != zh_stage_type:
              raise RuntimeError(f'language document type mismatch: {en_stage_type} vs {zh_stage_type}')
          stage_type = en_stage_type
          stage_date = disclosure_date(en_stage)

          if stage_type == 'interim_report':
              zh_stage_filename = f'05_极视角_06636_2026年中期报告_中文版_{stage_date}.pdf'
              en_stage_filename = f'06_Extreme_Vision_06636_2026_Interim_Report_English_{stage_date}.pdf'
              zh_stage_title = '极视角2026年中期报告（中文版）'
              en_stage_title = 'Extreme Vision 2026 Interim Report (English)'
              stage_min_bytes = 1_000_000
              stage_min_pages = 40
          else:
              zh_stage_filename = f'05_极视角_06636_2026年中期业绩公告_中文版_{stage_date}.pdf'
              en_stage_filename = f'06_Extreme_Vision_06636_2026_Interim_Results_English_{stage_date}.pdf'
              zh_stage_title = '截至2026年6月30日止六个月中期业绩公告（中文版）'
              en_stage_title = 'Interim Results Announcement for the Six Months Ended June 30, 2026 (English)'
              stage_min_bytes = 100_000
              stage_min_pages = 15

          selections = [
              {
                  'filename': '01_极视角_06636_最终招股说明书_中文版_2026-03-20.pdf',
                  'title': '极视角最终招股说明书（中文版）',
                  'date': disclosure_date(zh_prospectus),
                  'type': 'prospectus',
                  'url': zh_prospectus['url'],
                  'min_bytes': 5_000_000,
                  'min_pages': 400,
              },
              {
                  'filename': '02_Extreme_Vision_06636_Final_Prospectus_English_2026-03-20.pdf',
                  'title': 'Extreme Vision final prospectus (English)',
                  'date': disclosure_date(en_prospectus),
                  'type': 'prospectus',
                  'url': en_prospectus['url'],
                  'min_bytes': 5_000_000,
                  'min_pages': 400,
              },
              {
                  'filename': '03_极视角_06636_2025年年度报告_中文版_2026-04-30.pdf',
                  'title': '极视角2025年年度报告（中文版）',
                  'date': disclosure_date(zh_annual),
                  'type': 'annual_report',
                  'url': zh_annual['url'],
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': '04_Extreme_Vision_06636_2025_Annual_Report_English_2026-04-30.pdf',
                  'title': 'Extreme Vision 2025 Annual Report (English)',
                  'date': disclosure_date(en_annual),
                  'type': 'annual_report',
                  'url': en_annual['url'],
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': zh_stage_filename,
                  'title': zh_stage_title,
                  'date': disclosure_date(zh_stage),
                  'type': stage_type,
                  'url': zh_stage['url'],
                  'min_bytes': stage_min_bytes,
                  'min_pages': stage_min_pages,
              },
              {
                  'filename': en_stage_filename,
                  'title': en_stage_title,
                  'date': disclosure_date(en_stage),
                  'type': stage_type,
                  'url': en_stage['url'],
                  'min_bytes': stage_min_bytes,
                  'min_pages': stage_min_pages,
              },
          ]

          def url_variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(url: str, dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for candidate in url_variants(url):
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(candidate, timeout=(30, 600), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, attempt, r.status_code, candidate, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response size={size} head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{candidate} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def render_check(pdf_path: Path, pages: int) -> list[int]:
              sample_pages = sorted(set([1, max(1, pages // 2), pages]))
              with tempfile.TemporaryDirectory(prefix='render-check-') as td:
                  temp_dir = Path(td)
                  for page_no in sample_pages:
                      prefix = temp_dir / f'p{page_no}'
                      run = subprocess.run(
                          ['pdftoppm', '-f', str(page_no), '-l', str(page_no), '-singlefile', '-r', '72', '-png', str(pdf_path), str(prefix)],
                          capture_output=True,
                          text=True,
                          timeout=240,
                      )
                      if run.returncode != 0:
                          raise RuntimeError(f'pdftoppm failed: {pdf_path.name} page {page_no}: {run.stderr[-1500:]}')
                      image_path = prefix.with_suffix('.png')
                      if not image_path.exists() or image_path.stat().st_size < 3000:
                          raise RuntimeError(f'rendered image missing or too small: {pdf_path.name} page {page_no}')
                      with Image.open(image_path) as image:
                          image.verify()
                      with Image.open(image_path) as image:
                          width, height = image.size
                      if width < 300 or height < 300:
                          raise RuntimeError(f'render dimensions too small: {width}x{height}')
              return sample_pages

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for item in selections:
              dest = out / item['filename']
              final_url = download_pdf(item['url'], dest, item['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              if reader.is_encrypted:
                  raise RuntimeError(f'encrypted PDF not accepted: {dest.name}')
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(30, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              lower = sample_text.lower()
              identity_ok = any(term.lower() in lower for term in ('06636', '6636', 'extreme vision', '極視角', '极视角', '山東極視角', '山东极视角'))
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified: {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')

              rendered_pages = render_check(dest, pages)
              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': item['filename'],
                  'title': item['title'],
                  'document_type': item['type'],
                  'disclosure_date': item['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'render_checked_pages': rendered_pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          stage_note = (
              '截至2026年9月22日，港交所已披露完整《2026年中期报告》，本包将其作为最新完整阶段性财务报告收录。'
              if stage_type == 'interim_report'
              else '截至2026年9月22日，港交所尚未披露完整《2026年中期报告》；最新阶段性财务披露为2026年8月26日发布的截至2026年6月30日止六个月中期业绩公告。本包按其真实文件类型收录，不将其误标为完整中期报告或季度报告。'
          )

          readme = [
              '山东极视角科技股份有限公司（Extreme Vision，06636.HK）港股披露文件资料包',
              '整理日期：2026-09-22',
              '',
              '收录范围：最终招股说明书、上市后全部完整年度报告，以及截至整理日最新阶段性财务报告。',
              '公司于2026年3月30日在香港联交所主板上市，因此截至2026年9月22日，上市后完整年度报告只有2025年年度报告。上市前历史财务资料已载于最终招股说明书。',
              '香港主板公司通常不按A股口径强制发布第一、第三季度报告。' + stage_note,
              '最终招股说明书、2025年年度报告及最新阶段性财务文件均收录中英文港交所官方PDF原件。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   抽样渲染核验页：{', '.join(str(x) for x in rec['render_checked_pages'])}",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司及证券代码身份、实际页数、非加密状态、qpdf结构检查、首/中/末页抽样渲染、文件去重、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与披露口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in zf.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 6:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: extreme-vision-06636-filings-final
          path: 极视角_06636_招股说明书_2025年报_2026中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
