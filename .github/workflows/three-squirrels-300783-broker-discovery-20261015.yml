name: Build Three Squirrels 300783 broker deep reports 20261015

on:
  push:
    paths:
      - '.github/workflows/three-squirrels-300783-broker-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package full reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package = '三只松鼠_300783_券商深度报告_完整版_3份'
          root = Path(package)
          root.mkdir(exist_ok=True)
          preview_dir = Path('_preview_validation')
          preview_dir.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '东兴证券',
                  'date': '2024-05-27',
                  'analysts': '孟斯硕、王洁婷',
                  'rating': '买入',
                  'title': '企业改革成效凸显，业绩拐点出现',
                  'info_code': 'AP202405271634706770',
                  'expected_pages': 31,
                  'min_pages': 25,
                  'terms': ['三只松鼠', '企业改革', '业绩拐点'],
                  'filename': '01_东兴证券_三只松鼠_企业改革成效凸显业绩拐点出现_2024-05-27_31页.pdf',
              },
              {
                  'broker': '民生证券',
                  'date': '2024-05-13',
                  'analysts': '王言海、张玲玉',
                  'rating': '买入',
                  'title': '首次覆盖报告：战略转型焕新篇，轻舟已过万重山',
                  'info_code': 'AP202405131632991872',
                  'expected_pages': 31,
                  'min_pages': 25,
                  'terms': ['三只松鼠', '战略转型', '轻舟已过万重山'],
                  'filename': '02_民生证券_三只松鼠_战略转型焕新篇轻舟已过万重山_2024-05-13_31页.pdf',
              },
              {
                  'broker': '信达证券',
                  'date': '2024-03-07',
                  'analysts': '马铮、程丽丽',
                  'rating': '买入',
                  'title': '公司深度报告：高端性价比战略，供应链重构升级',
                  'info_code': 'AP202403071625966122',
                  'expected_pages': 26,
                  'min_pages': 20,
                  'terms': ['三只松鼠', '高端性价比', '供应链重构'],
                  'filename': '03_信达证券_三只松鼠_高端性价比战略供应链重构升级_2024-03-07_26页.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(info_code: str) -> tuple[bytes, str, dict]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last = None
              for url in urls:
                  for attempt in range(7):
                      try:
                          response = session.get(
                              url,
                              timeout=(25, 240),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 100_000:
                              return response.content, url, last
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          manifest = []
          for index, report in enumerate(reports, 1):
              pdf_bytes, pdf_url, download_meta = download_pdf(report['info_code'])
              destination = root / report['filename']
              destination.write_bytes(pdf_bytes)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'too few pages: {destination.name}: {pages} < {report["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(15, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', extracted)
              if not any(term in compact for term in ['三只松鼠', '300783', '三只松鼠股份有限公司']):
                  raise RuntimeError(f'issuer identity check failed: {destination.name}')
              matched_terms = [term for term in report['terms'] if re.sub(r'\s+', '', term) in compact]

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = preview_dir / f'{index:02d}'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'first-page render failed: {destination.name}')

              sha256 = hashlib.sha256(pdf_bytes).hexdigest()
              manifest.append({
                  **report,
                  'actual_pages': pages,
                  'bytes': len(pdf_bytes),
                  'sha256': sha256,
                  'source_report_page': f'https://data.eastmoney.com/report/info/{report["info_code"]}.html',
                  'pdf_url': pdf_url,
                  'download_meta': download_meta,
                  'matched_terms': matched_terms,
                  'document_nature': '券商原始完整PDF',
                  'validation': [
                      'PDF header', 'issuer identity', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              })

          readme = [
              '三只松鼠股份有限公司（300783.SZ）券商深度报告完整版资料包',
              '整理日期：2026-10-15',
              '',
              '本包收录3份公开可直接取得的券商原始完整PDF，均为公司深度或首次覆盖报告，不以短篇业绩点评凑数。',
              '优先选择2024年围绕高端性价比、供应链重构、战略转型和经营拐点的较新长篇报告。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f'{index}. {item["broker"]}：《{item["title"]}》',
                  f'   日期：{item["date"]}；分析师：{item["analysts"]}；评级：{item["rating"]}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_report_page"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme += [
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(package + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file_path in sorted(root.rglob('*')):
                  if file_path.is_file():
                      archive.write(file_path, arcname=f'{package}/{file_path.relative_to(root)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              pdf_files = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_file or len(pdf_files) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad_file}, pdf_count={len(pdf_files)}')

          alias_path = Path('three_squirrels_broker_deep_reports_3_full.zip')
          alias_path.write_bytes(zip_path.read_bytes())
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha256)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: three-squirrels-300783-broker-deep-reports-full-3
          path: |
            三只松鼠_300783_券商深度报告_完整版_3份.zip
            three_squirrels_broker_deep_reports_3_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
