name: Temporary Zhongchuang Zhilin broker report package v2

on:
  push:
    branches:
      - tmp/zhongchuang-broker-reports-20260902-v2
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests Pillow PyMuPDF img2pdf
      - name: Download, validate and package reports
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          reports = [
              {
                  'id': '5118074',
                  'date': '2025-10-29',
                  'org': '东方财富证券',
                  'title': '煤机业务稳健增长，汽零转型打开新空间',
                  'pages': 39,
                  'detail': 'https://www.fxbaogao.com/detail/5118074',
              },
              {
                  'id': '4501093',
                  'date': '2024-09-12',
                  'org': '中原证券',
                  'title': '公司深度分析：中报快速增长，煤机、汽车零部件双轮驱动',
                  'pages': 22,
                  'detail': 'https://www.fxbaogao.com/detail/4501093',
              },
          ]

          root = Path('zhongchuang_reports')
          pdf_dir = root / 'PDF'
          img_root = root / 'page_images'
          render_dir = root / 'renders'
          for directory in (root, pdf_dir, img_root, render_dir):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          retry = Retry(
              total=5,
              connect=5,
              read=5,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def validate_pdf(path: Path, expected_pages: int) -> None:
              if path.read_bytes()[:5] != b'%PDF-':
                  raise RuntimeError(f'Invalid PDF header: {path}')
              if path.stat().st_size < 100_000:
                  raise RuntimeError(f'PDF unexpectedly small: {path}')
              doc = pymupdf.open(str(path))
              try:
                  if doc.is_encrypted:
                      raise RuntimeError(f'Encrypted PDF: {path}')
                  if doc.page_count != expected_pages:
                      raise RuntimeError(f'Page count mismatch: {path} {doc.page_count} != {expected_pages}')
                  for page_index in sorted({0, expected_pages // 2, expected_pages - 1}):
                      pix = doc.load_page(page_index).get_pixmap(matrix=pymupdf.Matrix(0.45, 0.45), alpha=False)
                      if pix.width < 200 or pix.height < 250:
                          raise RuntimeError(f'Render check failed: {path} page {page_index + 1}')
              finally:
                  doc.close()

          metadata = []
          renders = []
          for report_index, report in enumerate(reports, 1):
              year, month, day = report['date'].split('-')
              page_dir = img_root / report['id']
              page_dir.mkdir(parents=True, exist_ok=True)
              page_paths = []
              page_hashes = set()

              for page_no in range(1, report['pages'] + 1):
                  base = f"https://public.fxbaogao.com/report-image/{year}/{month}/{day}/{report['id']}-{page_no}.png"
                  candidates = [
                      base,
                      base + '?x-oss-process=image/format,png',
                      base + '?x-oss-process=image/format,webp',
                  ]
                  data = None
                  final_url = None
                  for attempt in range(4):
                      for url in candidates:
                          try:
                              response = session.get(
                                  url,
                                  headers={
                                      'Referer': report['detail'],
                                      'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                                  },
                                  timeout=70,
                                  allow_redirects=True,
                              )
                              ctype = (response.headers.get('content-type') or '').lower()
                              print('PAGE_GET', report['id'], page_no, attempt, response.status_code, len(response.content), ctype, response.url, flush=True)
                              if response.status_code == 200 and len(response.content) > 8_000 and ctype.startswith('image/'):
                                  with Image.open(io.BytesIO(response.content)) as probe:
                                      probe.load()
                                      if probe.width >= 700 and probe.height >= 900:
                                          data = response.content
                                          final_url = response.url
                                          break
                          except Exception as exc:
                              print('PAGE_ERROR', report['id'], page_no, attempt, repr(exc), flush=True)
                      if data is not None:
                          break
                      time.sleep(1.0 + attempt)

                  if data is None:
                      raise RuntimeError(f"Missing page {page_no}/{report['pages']} for report {report['id']}")

                  digest = hashlib.sha256(data).hexdigest()
                  if digest in page_hashes:
                      raise RuntimeError(f"Duplicate page image for report {report['id']} at page {page_no}")
                  page_hashes.add(digest)

                  with Image.open(io.BytesIO(data)) as source_image:
                      source_image.load()
                      image = source_image.convert('RGB')
                      page_path = page_dir / f'{page_no:03d}.png'
                      image.save(page_path, 'PNG', optimize=True)
                      page_paths.append(page_path)
                      print('PAGE_OK', report['id'], page_no, image.size, final_url, flush=True)

              pdf_name = f"{report_index:02d}_{report['date']}_{report['org']}_中创智领（原郑煤机）_{report['title']}.pdf"
              pdf_path = pdf_dir / pdf_name
              layout = img2pdf.get_layout_fun((img2pdf.mm_to_pt(210), img2pdf.mm_to_pt(297)))
              pdf_path.write_bytes(img2pdf.convert([str(path) for path in page_paths], layout_fun=layout))
              validate_pdf(pdf_path, report['pages'])

              doc = pymupdf.open(str(pdf_path))
              try:
                  for label, page_index in [('首页', 0), ('中间页', report['pages'] // 2), ('末页', report['pages'] - 1)]:
                      pix = doc.load_page(page_index).get_pixmap(matrix=pymupdf.Matrix(0.55, 0.55), alpha=False)
                      render_path = render_dir / f"{report['id']}_{label}.png"
                      pix.save(str(render_path))
                      renders.append((f"{report_index}-{label}", render_path))
              finally:
                  doc.close()

              item = {
                  '序号': report_index,
                  '日期': report['date'],
                  '机构': report['org'],
                  '标题': report['title'],
                  '页数': report['pages'],
                  '文件名': pdf_name,
                  '文件大小': pdf_path.stat().st_size,
                  'SHA256': sha256(pdf_path),
                  '来源页面': report['detail'],
                  '制作说明': '公开展示的原始报告页图按页码顺序合成为PDF',
              }
              metadata.append(item)
              print('REPORT_OK', json.dumps(item, ensure_ascii=False), flush=True)

          thumbs = []
          for label, render_path in renders:
              with Image.open(render_path) as source:
                  image = source.convert('RGB')
                  image.thumbnail((300, 390))
                  canvas = Image.new('RGB', (320, 435), 'white')
                  canvas.paste(image, ((320 - image.width) // 2, 8))
                  ImageDraw.Draw(canvas).text((10, 410), label, fill='black')
                  thumbs.append(canvas)
          contact_sheet = Image.new('RGB', (960, 870), 'white')
          for i, thumb in enumerate(thumbs):
              contact_sheet.paste(thumb, ((i % 3) * 320, (i // 3) * 435))
          contact_sheet.save(root / 'PDF抽样渲染校验.jpg', quality=90)

          readme = [
              '中创智领（601717，原郑煤机）券商深度报告资料包',
              '',
              '报告数量：2份',
              '合计页数：61页',
              '',
              f"1. {reports[0]['date']}｜{reports[0]['org']}｜{reports[0]['title']}｜39页",
              f"2. {reports[1]['date']}｜{reports[1]['org']}｜{reports[1]['title']}｜22页",
              '',
              '两份PDF均已检查文件头、文件大小、加密状态和页数，并抽样渲染首页、中间页、末页。',
              'PDF由公开展示的原始报告页图按页码顺序合成，内容与公开页面保持一致。',
              '报告版权归发布机构、作者及相关权利人所有，仅供个人研究参考，不构成投资建议。',
          ]
          (root / '报告清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / '报告元数据.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'PDF_SHA256.txt').write_text('\n'.join(f"{item['SHA256']}  {item['文件名']}" for item in metadata) + '\n', encoding='utf-8')

          zip_path = root / '中创智领_券商深度报告_2份_重新打包.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for pdf_path in sorted(pdf_dir.glob('*.pdf')):
                  archive.write(pdf_path, pdf_path.name)
              for extra in ('报告清单与说明.txt', '报告元数据.json', 'PDF_SHA256.txt'):
                  archive.write(root / extra, extra)

          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise RuntimeError(f'ZIP integrity failure: {bad_file}')
              pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_members) != 2:
                  raise RuntimeError(f'ZIP expected 2 PDFs, found {len(pdf_members)}')

          zip_hash = sha256(zip_path)
          (root / 'ZIP_SHA256.txt').write_text(f'{zip_hash}  {zip_path.name}\n', encoding='utf-8')
          print((root / '报告清单与说明.txt').read_text(encoding='utf-8'), flush=True)
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, zip_hash, flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: zhongchuang-zhilin-broker-reports-v2
          path: zhongchuang_reports/
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
