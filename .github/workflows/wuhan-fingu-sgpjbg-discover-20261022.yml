name: Discover Wuhan Fingu reports on SGPJBG 20261022

on:
  push:
    paths:
      - '.github/workflows/wuhan-fingu-sgpjbg-discover-20261022.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect report listing and source pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          urls=['https://www.sgpjbg.com/zhuanti/hefanyiyaobaogao.html','https://bg.sgpjbg.com/zhuanti/xintiandichanjituanbaogao.html','https://www.sgpjbg.com/baogao/16990.html','https://www.sgpjbg.com/bgdown/16990.html','https://bg.sgpjbg.com/baogao/16990.html','https://bg.sgpjbg.com/bgdown/16990.html']
          for url in urls:
            print('\n===== PAGE',url)
            try:
              r=s.get(url,headers=h,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'CT',r.headers.get('content-type'),'FINAL',r.url)
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urllib.parse.urljoin(r.url,a['href'])
                parent=' '.join(a.parent.get_text(' ',strip=True).split()) if a.parent else ''
                context=' '.join((a.parent.parent.get_text(' ',strip=True) if a.parent and a.parent.parent else parent).split())
                if '武汉凡谷' in label or '武汉凡谷' in context or '16990' in href or '2025-04-14' in context:
                  print('ANCHOR',json.dumps({'label':label,'href':href,'parent':parent[:800],'context':context[:1800]},ensure_ascii=False))
              for i,line in enumerate(text.splitlines(),1):
                if any(k in line for k in ['武汉凡谷','2025-04-14','16990','file.sgpjbg','fileroot','.pdf','downloadUrl','downUrl']):
                  if len(line)<12000:print('LINE',i,line[:11800])
              urls_found=[]
              for m in re.findall(r'https?://[^\s"\'<>]+',text):
                m=html.unescape(m)
                if any(k in m.lower() for k in ['16990','file.sgpjbg','fileroot','.pdf','download']):urls_found.append(m)
              print('URLS',json.dumps(list(dict.fromkeys(urls_found))[:300],ensure_ascii=False,indent=2))
            except Exception as e:print('ERROR',repr(e))
          PY
