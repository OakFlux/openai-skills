name: Fast probe Great Eagle 0041 report platforms 20260922

on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-platform-fastprobe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe platform search pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, html, json, re
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin
          import requests

          out=Path('probe'); out.mkdir()
          queries=['鹰君集团','鹰君 0041','Great Eagle Holdings','0041.HK']
          templates=[
            ('fx1','https://www.fxbaogao.com/search?keyword={q}'),
            ('fx2','https://www.fxbaogao.com/search?q={q}'),
            ('box1','https://www.baogaobox.com/search?keyword={q}'),
            ('box2','https://www.baogaobox.com/search?q={q}'),
            ('fh1','https://www.fhyanbao.com/search?keyword={q}'),
            ('fh2','https://www.fhyanbao.com/search?q={q}'),
            ('vz1','https://www.vzkoo.com/search?keyword={q}'),
            ('bing','https://www.bing.com/search?q={q}&count=50'),
            ('baidu','https://www.baidu.com/s?wd={q}&rn=50'),
          ]
          jobs=[]
          for qi,q in enumerate(queries):
            for name,t in templates:
              jobs.append((qi,q,name,t.format(q=quote_plus(q))))

          def one(x):
            qi,q,name,url=x
            s=requests.Session(); s.trust_env=False
            s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
            try:
              r=s.get(url,timeout=(10,25),allow_redirects=True)
              text=r.text
              fn=out/f'{qi}_{name}.html'; fn.write_bytes(r.content)
              urls=set()
              for pat in [r'https?://[^\s"\'<>]+',r'(?:href|src)=["\']([^"\']+)["\']']:
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v).replace('\\/','/')
                  if len(v)<2000: urls.add(urljoin(r.url,v))
              ids=sorted(set(re.findall(r'(?:detail/|rpview/|reports?/|reportId["\':= ]+)(\d{5,})',text,re.I)))
              hits=[]
              for line in text.splitlines():
                if any(k.lower() in line.lower() for k in ['鹰君','Great Eagle','0041.HK','00041','fxbaogao.com/detail','baogaobox.com/reports','fhyanbao.com/rpview']):
                  z=re.sub(r'\s+',' ',line).strip()
                  if z and len(z)<5000: hits.append(z)
              return {'query':q,'site':name,'url':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'ids':ids,'hits':hits[:100],'urls':[u for u in sorted(urls) if any(k in u.lower() for k in ['detail','report','rpview','pdf','download','research'])][:500]}
            except Exception as e:
              return {'query':q,'site':name,'url':url,'error':repr(e)}

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
            rows=list(ex.map(one,jobs))
          (out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          for r in rows:
            print('RESULT',r.get('query'),r.get('site'),r.get('status'),r.get('bytes'),'IDS',r.get('ids'),'HITS',len(r.get('hits',[])),'URLS',len(r.get('urls',[])),flush=True)
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-platform-fastprobe
          path: probe
          retention-days: 7
          if-no-files-found: error
