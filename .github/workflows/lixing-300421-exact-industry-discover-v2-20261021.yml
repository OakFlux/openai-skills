name: Find exact bearing reports for Lixing 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-exact-industry-discover-v2-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests
      - name: Query all report categories on exact windows
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[('2022-05-31','2022-06-02'),('2023-02-28','2023-03-02'),('2024-03-07','2024-03-10')]
          terms=['轴承','滚子','滚动体','国产化','风电','机器人']
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1','2']:
              found=[];total=1
              for page in range(1,121):
                if page>total:break
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                payload=None
                for attempt in range(5):
                  try:
                    r=s.get(api,params=p,timeout=(20,120))
                    if r.status_code==200:payload=r.json();break
                  except Exception as e:print('ERR',begin,qtype,page,repr(e))
                  time.sleep(1+attempt)
                if payload is None:break
                total=min(int(payload.get('TotalPage') or 1),120)
                data=payload.get('data') or []
                if isinstance(data,dict):data=data.get('list') or data.get('data') or []
                if not data:break
                for row in data:
                  title=str(row.get('title') or '')
                  if any(t in title for t in terms):
                    found.append({k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
                if page>=total or len(data)<100:break
              print('QTYPE',qtype,'FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          PY
