name: Wireless Media Broker Research Package

on:
  push:
    branches:
      - chatgpt-wireless-media-broker-reports-20261012
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow
      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports output/renders
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          OUT = Path('output')
          REPORTS = OUT / 'reports'
          RENDERS = OUT / 'renders'

          items = [
              {
                  'filename': '01_华金证券_无线传媒_新股覆盖研究_2024-09-06.pdf',
                  'title': '新股覆盖研究：无线传媒',
                  'document_type': '券商新股覆盖研究报告（严格意义上的券商研报）',
                  'broker': '华金证券',
                  'broker_tokens': ['华金证券', '华金'],
                  'analyst': '李蕙',
                  'date': '2024-09-06',
                  'info_code': 'AP202409061639768416',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202409061639768416_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202409061639768416.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202409061639768416.html',
                  'strict_research_report': True,
              },
              {
                  'filename': '02_中信建投证券_无线传媒_首次公开发行股票发行保荐书_最终版_2024-09-05.pdf',
                  'title': '中信建投证券股份有限公司关于公司首次公开发行股票并在创业板上市的发行保荐书',
                  'document_type': '券商投行保荐尽调文件（不是卖方研究报告）',
                  'broker': '中信建投证券',
                  'broker_tokens': ['中信建投证券', '中信建投'],
                  'analyst': '不适用（保荐机构文件）',
                  'date': '2024-09-05',
                  'info_code': 'AN202409051639741119',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H2_AN202409051639741119_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AN202409051639741119.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/notices/detail/301551/AN202409051639741119.html',
                  'strict_research_report': False,
              },
              {
                  'filename': '03_中信建投证券_无线传媒_首次公开发行股票上市保荐书_最终版_2024-09-25.pdf',
                  'title': '中信建投证券股份有限公司关于公司首次公开发行股票并在创业板上市的上市保荐书',
                  'document_type': '券商投行保荐尽调文件（不是卖方研究报告）',
                  'broker': '中信建投证券',
                  'broker_tokens': ['中信建投证券', '中信建投'],
                  'analyst': '不适用（保荐机构文件）',
                  'date': '2024-09-25',
                  'info_code': 'AN202409241640011100',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H2_AN202409241640011100_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AN202409241640011100.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/notices/detail/301551/AN202409241640011100.html',
                  'strict_research_report': False,
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def fetch_pdf(urls):
              errors = []
              for url in urls:
                  for attempt in range(5):
                      try:
                          r = session.get(url, timeout=240, allow_redirects=True)
                          print('FETCH', r.status_code, len(r.content), r.url, r.headers.get('content-type'))
                          if r.status_code == 200 and r.content.startswith(b'%PDF-'):
                              return r, url
                          errors.append(f'{url}: HTTP {r.status_code}, head={r.content[:32]!r}')
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(min(10, 2 ** attempt))
              raise RuntimeError('All candidate URLs failed: ' + ' | '.join(errors[-10:]))

          manifest = []
          render_paths = []
          for item in items:
              response, source_url = fetch_pdf(item['urls'])
              data = response.content
              if len(data) < 100_000:
                  raise RuntimeError(f"Suspiciously small PDF: {item['title']} ({len(data)} bytes)")
              path = REPORTS / item['filename']
              path.write_bytes(data)

              reader = PdfReader(str(path))
              if reader.is_encrypted and not reader.decrypt(''):
                  raise RuntimeError(f'Password-protected PDF: {path.name}')
              pages = len(reader.pages)
              if pages < 5:
                  raise RuntimeError(f'Unexpectedly short PDF: {path.name}, {pages} pages')

              doc = pymupdf.open(str(path))
              text = ''.join(doc[i].get_text('text') for i in range(min(10, doc.page_count)))
              normalized = re.sub(r'\s+', '', text)
              if '无线传媒' not in normalized and '河北广电无线传媒' not in normalized and '301551' not in normalized:
                  raise RuntimeError(f'Company identity check failed: {path.name}')
              if not any(token in normalized for token in item['broker_tokens']):
                  raise RuntimeError(f'Broker identity check failed: {path.name}')

              for label, index in [('first', 0), ('last', doc.page_count - 1)]:
                  pix = doc[index].get_pixmap(matrix=pymupdf.Matrix(1.3, 1.3), alpha=False)
                  render_path = RENDERS / f'{path.stem}_{label}.png'
                  pix.save(str(render_path))
                  render_paths.append(render_path)
              doc.close()

              record = {
                  'filename': path.name,
                  'title': item['title'],
                  'document_type': item['document_type'],
                  'broker': item['broker'],
                  'analyst': item['analyst'],
                  'date': item['date'],
                  'identifier': item['info_code'],
                  'source_page': item['source_page'],
                  'source_url': source_url,
                  'final_url': response.url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'encrypted': reader.is_encrypted,
                  'strict_research_report': item['strict_research_report'],
              }
              manifest.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          thumbs = []
          for image_path in render_paths:
              image = Image.open(image_path).convert('RGB')
              image.thumbnail((420, 580))
              canvas = Image.new('RGB', (440, 630), 'white')
              canvas.paste(image, ((440 - image.width) // 2, 8))
              ImageDraw.Draw(canvas).text((10, 605), image_path.stem[:58], fill='black')
              thumbs.append(canvas)
              image.close()
          cols = 2
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 440, rows * 630), 'white')
          for idx, canvas in enumerate(thumbs):
              sheet.paste(canvas, ((idx % cols) * 440, (idx // cols) * 630))
              canvas.close()
          sheet.save(RENDERS / 'contact_sheet.jpg', 'JPEG', quality=90)
          sheet.close()

          readme = [
              '无线传媒（301551.SZ）券商研究及保荐尽调资料包',
              '',
              '重要说明：公开研报库仅检索到1份严格意义上的无线传媒券商研究报告，即华金证券的新股覆盖研究。',
              '为避免将网页摘要、AI生成内容或同一文件重复版本冒充研报，另附2份中信建投证券原始保荐尽调文件。',
              '第2、3份由证券公司出具，内容涉及发行人业务、财务、风险和上市合规，但属于投行保荐文件，不属于卖方研究报告。',
              '',
              '文件清单：',
          ]
          for r in manifest:
              readme.append(f"- {r['filename']} | {r['document_type']} | {r['date']} | {r['pages']}页 | {r['bytes']}字节")
          readme += [
              '',
              '核验项目：PDF文件头、实际页数、公司名称/证券代码、出具机构、加密状态、首页与末页渲染。',
              '压缩包已执行ZIP CRC完整性检测。',
              '资料仅供个人研究与学习使用，请遵守原始文件版权及免责声明。',
          ]
          (REPORTS / '00_资料说明.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (REPORTS / '00_文件清单及校验值.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (REPORTS / '00_SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['filename']}" for r in manifest) + '\n', encoding='utf-8')

          zip_path = OUT / 'wireless_media_broker_research_and_sponsor_materials_3.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted(REPORTS.iterdir(), key=lambda p: p.name):
                  zf.write(p, arcname=p.name)
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')

          summary = {
              'zip_filename': zip_path.name,
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'document_count': len(manifest),
              'strict_research_report_count': sum(1 for r in manifest if r['strict_research_report']),
              'total_pages': sum(r['pages'] for r in manifest),
              'documents': manifest,
          }
          (OUT / 'BUILD_SUMMARY.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_SUMMARY', json.dumps({k: summary[k] for k in ('zip_filename','zip_bytes','zip_sha256','document_count','strict_research_report_count','total_pages')}, ensure_ascii=False))
          PY
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: wireless-media-broker-research-package
          path: |
            output/wireless_media_broker_research_and_sponsor_materials_3.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
