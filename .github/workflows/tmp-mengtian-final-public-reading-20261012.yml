name: Package Mengtian Public Reading Reports Final

on:
  push:
    branches:
      - tmp-mengtian-603216-broker-reports-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow pymupdf pypdf

      - name: Download page images, build PDFs, verify and package
        shell: bash
        run: |
          cat > /tmp/package_mengtian_reports.py <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import zipfile
          from dataclasses import dataclass
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT = Path('output')
          FINAL = OUT / 'final'
          IMAGES = OUT / 'images'
          RENDERS = OUT / 'renders'
          for p in (OUT, FINAL, IMAGES, RENDERS):
              p.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          @dataclass
          class Spec:
              slug: str
              root: str
              referer: str
              institution: str
              date: str
              title: str
              analysts: str
              pages: int
              filename: str
              source_page: str

          specs = [
              Spec(
                  slug='tianfeng_20220119',
                  root='https://file.sgpjbg.com/fileroot_temp1/2022-1/21/491c4d7b-b8ac-4745-b532-ec44622e21a7/491c4d7b-b8ac-4745-b532-ec44622e21a7',
                  referer='https://m.sgpjbg.com/baogao/59821.html',
                  institution='天风证券',
                  date='2022-01-19',
                  title='从木门到全屋木作，上市后进入新发展阶段',
                  analysts='范张翔、尉鹏洁',
                  pages=20,
                  filename='01_天风证券_2022-01-19_从木门到全屋木作_上市后进入新发展阶段_公开阅读版.pdf',
                  source_page='https://www.sgpjbg.com/baogao/59821.html',
              ),
              Spec(
                  slug='cms_20211212',
                  root='https://file.sgpjbg.com/fileroot_temp1/2021-12/13/1e36a52c-b28a-42c3-8ee2-17a139411d64/1e36a52c-b28a-42c3-8ee2-17a139411d64',
                  referer='https://m.sgpjbg.com/baogao/57012.html',
                  institution='招商证券',
                  date='2021-12-12',
                  title='新股分析：木门行业领军企业，产品渠道拓展未来成长可期',
                  analysts='赵中平、李宏鹏',
                  pages=20,
                  filename='02_招商证券_2021-12-12_新股分析_木门行业领军企业_产品渠道拓展未来成长可期_公开阅读版.pdf',
                  source_page='https://www.sgpjbg.com/baogao/57012.html',
              ),
          ]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          manifest = []
          for spec in specs:
              image_dir = IMAGES / spec.slug
              image_dir.mkdir(parents=True, exist_ok=True)
              page_rows = []
              seen_hashes = set()
              for page_no in range(1, spec.pages + 1):
                  url = f'{spec.root}{page_no}.gif'
                  r = session.get(url, headers={'Referer': spec.referer}, timeout=60)
                  r.raise_for_status()
                  data = r.content
                  if len(data) < 20_000:
                      raise RuntimeError(f'{spec.slug} page {page_no}: image too small ({len(data)} bytes)')
                  with Image.open(io.BytesIO(data)) as img:
                      img.load()
                      width, height = img.size
                      if width < 700 or height < 900 or height <= width:
                          raise RuntimeError(f'{spec.slug} page {page_no}: unexpected dimensions {width}x{height}')
                      rgb = img.convert('RGB')
                      png_path = image_dir / f'{page_no:02d}.png'
                      rgb.save(png_path, format='PNG', optimize=True)
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in seen_hashes:
                      raise RuntimeError(f'{spec.slug} page {page_no}: duplicate page image')
                  seen_hashes.add(digest)
                  page_rows.append({
                      'page': page_no,
                      'source_url': url,
                      'width': width,
                      'height': height,
                      'source_bytes': len(data),
                      'source_sha256': digest,
                      'local_png': str(png_path),
                  })
                  print(f'{spec.slug} page {page_no}: {width}x{height}, {len(data)} bytes')

              pdf_path = FINAL / spec.filename
              doc = pymupdf.open()
              for row in page_rows:
                  png_path = Path(row['local_png'])
                  with Image.open(png_path) as img:
                      w, h = img.size
                  page_h = 842.0
                  page_w = page_h * w / h
                  page = doc.new_page(width=page_w, height=page_h)
                  page.insert_image(page.rect, filename=str(png_path), keep_proportion=True)
              doc.save(pdf_path, garbage=4, deflate=True)
              doc.close()

              reader = PdfReader(str(pdf_path), strict=False)
              pdf_pages = len(reader.pages)
              if pdf_pages != spec.pages:
                  raise RuntimeError(f'{spec.slug}: expected {spec.pages} PDF pages, got {pdf_pages}')

              render_dir = RENDERS / spec.slug
              render_dir.mkdir(parents=True, exist_ok=True)
              check_doc = pymupdf.open(pdf_path)
              for pageno in sorted(set([0, pdf_pages // 2, pdf_pages - 1])):
                  pix = check_doc.load_page(pageno).get_pixmap(matrix=pymupdf.Matrix(1.15, 1.15), alpha=False)
                  render = render_dir / f'page-{pageno + 1:03d}.png'
                  pix.save(render)
                  if render.stat().st_size < 20_000:
                      raise RuntimeError(f'{spec.slug}: suspicious render page {pageno + 1}')
              check_doc.close()

              manifest.append({
                  'filename': spec.filename,
                  'company': '梦天家居',
                  'stock_code': '603216',
                  'institution': spec.institution,
                  'date': spec.date,
                  'title': spec.title,
                  'analysts': spec.analysts,
                  'pages': pdf_pages,
                  'format': '公开阅读版PDF（公开在线阅读页逐页合并）',
                  'version_note': '非券商原始PDF文件容器；逐页图像按原顺序合并，未改写页面内容。',
                  'source_page': spec.source_page,
                  'page_sources': [x['source_url'] for x in page_rows],
                  'size_bytes': pdf_path.stat().st_size,
                  'sha256': sha256(pdf_path),
              })

          (FINAL / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{x['sha256']}  {x['filename']}" for x in manifest) + '\n', encoding='utf-8'
          )
          readme = [
              '# 梦天家居（603216）券商研究报告公开阅读版',
              '',
              '本包包含2份券商长篇公司研究报告，共40页。',
              '',
              '版本说明：公开来源未提供无需登录即可下载的券商原始PDF附件。本包使用公开在线阅读页提供的逐页图像，按原始页序合并为PDF阅读版。页面内容未改写，但该文件不应标注为券商原始PDF。',
              '',
          ]
          for idx, x in enumerate(manifest, 1):
              readme += [
                  f"## {idx}. {x['institution']}｜{x['date']}｜{x['title']}",
                  f"- 分析师：{x['analysts']}",
                  f"- 页数：{x['pages']}",
                  f"- 文件：`{x['filename']}`",
                  f"- 公开来源页面：{x['source_page']}",
                  f"- SHA-256：`{x['sha256']}`",
                  '',
              ]
          readme += [
              '## 校验记录',
              '',
              '- 两份报告均成功取得1—20页，未发现重复页。',
              '- 已验证生成PDF均为20页。',
              '- 已渲染抽查每份PDF的首页、中间页和末页。',
              '- ZIP已通过完整解压与CRC检测。',
          ]
          (FINAL / 'README_文件清单与版本说明.md').write_text('\n'.join(readme), encoding='utf-8')

          zip_cn = OUT / '梦天家居_603216_券商研究报告_公开阅读版_2份_20261012.zip'
          zip_en = OUT / 'Mengtian_Home_603216_Broker_Research_Public_Reading_PDFs_2_20261012.zip'
          for zp in (zip_cn, zip_en):
              with zipfile.ZipFile(zp, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
                  for path in sorted(FINAL.iterdir()):
                      zf.write(path, arcname=path.name)
              with zipfile.ZipFile(zp) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')

          summary = {
              'report_count': len(manifest),
              'total_pages': sum(x['pages'] for x in manifest),
              'reports': manifest,
              'zip_cn': str(zip_cn),
              'zip_cn_size': zip_cn.stat().st_size,
              'zip_cn_sha256': sha256(zip_cn),
              'zip_en': str(zip_en),
              'zip_en_size': zip_en.stat().st_size,
              'zip_en_sha256': sha256(zip_en),
          }
          (OUT / 'package_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/package_mengtian_reports.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Mengtian-603216-Broker-Public-Reading-Reports
          path: |
            output/*.zip
            output/package_summary.json
            output/renders/**/*.png
          if-no-files-found: error
          retention-days: 3
