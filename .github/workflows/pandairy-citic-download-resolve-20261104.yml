name: Resolve CITIC Pandairy report download

on:
  push:
    paths:
      - '.github/workflows/pandairy-citic-download-resolve-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve download
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/baogao/28394.html'})
          urls=['https://www.sgpjbg.com/baogao/28394.html','https://www.sgpjbg.com/bgdown/28394.html']
          for url in urls:
            r=s.get(url,timeout=60,allow_redirects=True)
            print('FETCH',url,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'CT',r.headers.get('content-type'),'HISTORY',[(x.status_code,x.url,x.headers.get('location')) for x in r.history],flush=True)
            print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False),flush=True)
            if r.content.startswith(b'%PDF'):
              print('FOUND_PDF',r.url,len(r.content),flush=True)
              continue
            text=r.text
            soup=BeautifulSoup(text,'html.parser')
            for tag in soup.find_all(['a','iframe','embed','object','form','input','script']):
              blob=' '.join([tag.get_text(' ',strip=True)]+[str(v) for v in tag.attrs.values()])
              if any(k in blob.lower() for k in ('pdf','download','bgdown','file.sgpjbg','fileroot','28394')):
                print('TAG',tag.name,json.dumps({'attrs':dict(tag.attrs),'text':tag.get_text(' ',strip=True)[:500]},ensure_ascii=False),flush=True)
            links=[]
            for pat in [r'https?://[^\"\'<> ]+\.pdf[^\"\'<> ]*',r'https?://file\.sgpjbg\.com/[^\"\'<> ]+',r'/[^\"\'<> ]+\.pdf[^\"\'<> ]*',r'/[^\"\'<> ]*(?:download|bgdown)[^\"\'<> ]*']:
              links += re.findall(pat,html.unescape(text),re.I)
            print('LINKS',json.dumps(list(dict.fromkeys(urljoin(r.url,x) for x in links))[:100],ensure_ascii=False),flush=True)
            idx=max(text.find('熊猫乳品'),text.find('深耕炼乳'),text.find('download'))
            if idx>=0: print('CONTEXT',text[max(0,idx-3000):idx+6000],flush=True)
          PY
