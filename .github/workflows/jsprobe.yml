name: Temporary FX viewer JavaScript probe
on:
  push:
    branches: [tmp-towngas-jsprobe-20260905]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe JS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import re
          import requests
          from pathlib import Path
          base='https://www.fxbaogao.com'
          urls=[
            base+'/_fxbg/2609031714/js/vendors~app-pages-fxbg-main-js.dabdfdee4aa31d0d4b4a.chunk.js',
            base+'/_fxbg/2609031714/js/app-pages-fxbg-main-js.71ff9d5297a4e28fc829.chunk.js',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/131','Referer':base+'/view?id=5316216'})
          for n,u in enumerate(urls):
            r=s.get(u,timeout=45); print('FETCH',u,r.status_code,len(r.content),flush=True); r.raise_for_status(); t=r.text; Path(f'chunk{n}.js').write_text(t,encoding='utf-8')
            for kw in ['report-image','totalPage','pageCount','downloadUrl','pdfUrl','documentUrl','/api/','reportId','view?id','pages','preview','oss']:
              ps=[m.start() for m in re.finditer(re.escape(kw),t,re.I)]
              print('KEY',kw,len(ps),flush=True)
              for p in ps[:50]: print('CTX',kw,t[max(0,p-1200):p+3000],flush=True)
            for pat in [r'https?://[^"\'`\\\s]+',r'["\'](/[^"\']*(?:api|report|view|pdf|image|page|download)[^"\']*)["\']']:
              for m in re.findall(pat,t,re.I):
                if isinstance(m,tuple):m=m[0]
                if len(m)<800: print('MATCH',m,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fx-jsprobe
          path: chunk*.js
          retention-days: 1
