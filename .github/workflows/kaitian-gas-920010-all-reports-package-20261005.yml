name: Build Kaitian Gas 920010 all reports package 20261005

on:
  push:
    paths:
      - '.github/workflows/kaitian-gas-920010-all-reports-package-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf

      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          PACKAGE = '凯添燃气_920010_所有年报_公开发行说明书及2026最新季报与半年报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          detail_base = 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920010&id='
          money_base = 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920010&id='

          tasks = [
              {
                  'filename': '01_凯添燃气_公开发行说明书_精选层发行上市招股文件.pdf',
                  'title': '凯添燃气公开发行说明书（精选层发行上市招股文件）',
                  'type': '公开发行说明书',
                  'period': '向不特定合格投资者公开发行',
                  'detail_url': detail_base + '6441940',
                  'min_pages': 250,
                  'min_bytes': 2_000_000,
              },
              {
                  'filename': '02_银川天佳能源科技股份有限公司_2014年年度报告.pdf',
                  'title': '银川天佳能源科技股份有限公司2014年年度报告',
                  'type': '年度报告',
                  'period': '2014年度',
                  'detail_url': detail_base + '1721269',
                  'min_pages': 30,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '03_天佳科技_2015年年度报告.pdf',
                  'title': '天佳科技2015年年度报告',
                  'type': '年度报告',
                  'period': '2015年度',
                  'detail_url': detail_base + '2281878',
                  'min_pages': 30,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '04_天佳科技_2016年年度报告.pdf',
                  'title': '天佳科技2016年年度报告',
                  'type': '年度报告',
                  'period': '2016年度',
                  'detail_url': detail_base + '3297685',
                  'min_pages': 30,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '05_凯添燃气_2017年年度报告_后续完整披露版.pdf',
                  'title': '凯添燃气2017年年度报告（后续完整披露版）',
                  'type': '年度报告',
                  'period': '2017年度',
                  'detail_url': detail_base + '6029195',
                  'min_pages': 30,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '06_凯添燃气_2018年年度报告_后续完整披露版.pdf',
                  'title': '凯添燃气2018年年度报告（后续完整披露版）',
                  'type': '年度报告',
                  'period': '2018年度',
                  'detail_url': detail_base + '6028889',
                  'min_pages': 30,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '07_凯添燃气_2019年年度报告.pdf',
                  'title': '凯添燃气2019年年度报告',
                  'type': '年度报告',
                  'period': '2019年度',
                  'detail_url': detail_base + '6028839',
                  'min_pages': 30,
                  'min_bytes': 300_000,
              },
              {
                  'filename': '08_凯添燃气_2020年年度报告.pdf',
                  'title': '凯添燃气2020年年度报告',
                  'type': '年度报告',
                  'period': '2020年度',
                  'detail_url': detail_base + '7116886',
                  'min_pages': 50,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '09_凯添燃气_2021年年度报告.pdf',
                  'title': '凯添燃气2021年年度报告',
                  'type': '年度报告',
                  'period': '2021年度',
                  'detail_url': detail_base + '8009151',
                  'min_pages': 50,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '10_凯添燃气_2022年年度报告_更正后完整版本.pdf',
                  'title': '凯添燃气2022年年度报告（更正后完整版本）',
                  'type': '年度报告',
                  'period': '2022年度',
                  'detail_url': detail_base + '9521294',
                  'min_pages': 50,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '11_凯添燃气_2023年年度报告.pdf',
                  'title': '凯添燃气2023年年度报告',
                  'type': '年度报告',
                  'period': '2023年度',
                  'detail_url': detail_base + '10045354',
                  'min_pages': 50,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '12_凯添燃气_2024年年度报告.pdf',
                  'title': '凯添燃气2024年年度报告',
                  'type': '年度报告',
                  'period': '2024年度',
                  'detail_url': detail_base + '10944849',
                  'min_pages': 50,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '13_凯添燃气_2025年年度报告.pdf',
                  'title': '凯添燃气2025年年度报告',
                  'type': '年度报告',
                  'period': '2025年度',
                  'detail_url': detail_base + '12249307',
                  'min_pages': 50,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '14_凯添燃气_2026年第一季度报告.pdf',
                  'title': '凯添燃气2026年第一季度报告',
                  'type': '季度报告',
                  'period': '2026年第一季度',
                  'detail_url': money_base + '12249329',
                  'min_pages': 5,
                  'min_bytes': 80_000,
              },
              {
                  'filename': '15_凯添燃气_2026年半年度报告.pdf',
                  'title': '凯添燃气2026年半年度报告',
                  'type': '半年度报告',
                  'period': '2026年半年度',
                  'detail_url': detail_base + '12512960',
                  'min_pages': 40,
                  'min_bytes': 400_000,
              },
          ]

          def get_soup(url: str) -> BeautifulSoup:
              errors = []
              for attempt in range(1, 5):
                  try:
                      response = session.get(url, timeout=(30, 180), allow_redirects=True)
                      print('DETAIL', response.status_code, url, 'final', response.url, flush=True)
                      response.raise_for_status()
                      return BeautifulSoup(response.content.decode('gb18030', errors='replace'), 'lxml')
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      time.sleep(attempt * 2)
              raise RuntimeError(f'failed to fetch detail page {url}: {errors}')

          def extract_pdf_url(detail_url: str) -> str:
              soup = get_soup(detail_url)
              candidates = []
              for anchor in soup.find_all('a', href=True):
                  label = ''.join(anchor.get_text(' ', strip=True).split())
                  absolute = urljoin(detail_url, anchor['href'])
                  if '下载公告' in label:
                      candidates.insert(0, absolute)
                  elif '.pdf' in absolute.lower() and (
                      'file.finance.sina.com.cn' in absolute
                      or 'neeq.com.cn' in absolute
                      or 'neeq.cn' in absolute
                      or 'bse.cn' in absolute
                  ):
                      candidates.append(absolute)
              if not candidates:
                  raise RuntimeError(f'PDF link not found on detail page: {detail_url}')
              return candidates[0]

          def download_pdf(url: str, destination: Path, min_bytes: int) -> str:
              variants = [url]
              if '%3A' in url:
                  variants.append(url.replace('%3A', ':'))
              if url.startswith('http://www.neeq.com.cn/'):
                  variants.extend([
                      url.replace('http://www.neeq.com.cn/', 'https://www.neeq.com.cn/'),
                      url.replace('http://www.neeq.com.cn/', 'http://www.neeq.cn/'),
                      url.replace('http://www.neeq.com.cn/', 'https://www.neeq.cn/'),
                  ])
              variants = list(dict.fromkeys(variants))
              errors = []
              for candidate in variants:
                  for attempt in range(1, 5):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          referer = 'https://vip.stock.finance.sina.com.cn/' if 'sina.com.cn' in candidate else 'https://www.neeq.com.cn/'
                          with session.get(
                              candidate,
                              headers={
                                  'Referer': referer,
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 900),
                              allow_redirects=True,
                              stream=True,
                          ) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, candidate, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = temp.stat().st_size
                          with temp.open('rb') as fh:
                              header = fh.read(8)
                          if size < min_bytes or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF: size={size}, header={header!r}')
                          temp.replace(destination)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{candidate} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {destination.name}: {errors}')

          records = []
          hashes = set()

          for task in tasks:
              pdf_url = extract_pdf_url(task['detail_url'])
              destination = OUT / task['filename']
              final_url = download_pdf(pdf_url, destination, task['min_bytes'])

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < task['min_pages']:
                  raise RuntimeError(f'page count too small for {destination.name}: {pages}')

              check = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  capture_output=True,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f'qpdf validation failed for {destination.name}: {check.stderr[-2000:]}')

              render_root = OUT / (destination.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(destination), str(render_root)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed for {destination.name}: {render.stderr[-1000:]}')
              render_size = render_file.stat().st_size
              render_file.unlink(missing_ok=True)

              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              hashes.add(digest)

              record = {
                  'filename': destination.name,
                  'title': task['title'],
                  'type': task['type'],
                  'period': task['period'],
                  'detail_url': task['detail_url'],
                  'source_pdf_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '宁夏凯添燃气发展股份有限公司（现证券代码：920010.BJ；原证券代码：831010）所有年度报告、公开发行说明书及2026年最新定期报告',
              '整理日期：2026-10-05',
              '',
              '收录范围：2014—2025年全部可获取完整年度报告、2020年向不特定合格投资者公开发行股票并在精选层挂牌的最终公开发行说明书、2026年第一季度报告，以及截至整理日更近期的2026年半年度报告。',
              '名称说明：公司历史年度报告中曾使用“银川天佳能源科技股份有限公司”和“天佳科技”等名称，均属于同一上市主体的历史披露。',
              '版本说明：2017年、2018年年度报告采用后续重新披露的完整版本；2022年年度报告采用更正后的完整版本。公开发行说明书采用最终发行版，不重复收录申报稿、审议稿和报会稿。',
              '来源：全国股转系统、北京证券交易所及新浪财经公司公告文件服务器。',
              '全部PDF均完成文件头、文件大小、页数、qpdf结构、首页渲染、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['title']}",
                  f"   文件：{record['filename']}",
                  f"   类型：{record['type']}；报告期：{record['period']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   公告页：{record['detail_url']}",
                  f"   PDF来源：{record['source_pdf_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 15:
                  raise RuntimeError(f'expected 15 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: kaitian-gas-920010-all-reports-package-20261005
          path: 凯添燃气_920010_所有年报_公开发行说明书及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
