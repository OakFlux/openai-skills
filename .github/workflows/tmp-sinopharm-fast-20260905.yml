name: Build fast Sinopharm broker report package

on:
  push:
    branches:
      - tmp-sinopharm-fast-20260905

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download reports and create ZIP
        run: |
          python -m pip install --quiet requests beautifulsoup4 cryptography pillow pypdf
          mkdir -p deliverable
          cat > /tmp/build_fast.py <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import re
          import time
          import zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          from cryptography.hazmat.primitives.padding import PKCS7
          from PIL import Image
          from pypdf import PdfReader

          out = Path('deliverable')
          work = out / 'package'
          work.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36', 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'})

          def fetch(url, referer=None, attempts=5):
              headers = {'Referer': referer} if referer else None
              last = None
              for attempt in range(attempts):
                  try:
                      response = session.get(url, headers=headers, timeout=(15, 45), allow_redirects=True)
                      if response.status_code == 200:
                          return response
                      last = RuntimeError(f'HTTP {response.status_code}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 ** attempt, 10))
              raise RuntimeError(f'failed {url}: {last}')

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def image_to_rgb(data, label):
              image = Image.open(io.BytesIO(data))
              image.load()
              if image.width < 500 or image.height < 700:
                  raise RuntimeError(f'{label}: bad size {image.size}')
              rgba = image.convert('RGBA')
              rgb = Image.new('RGB', rgba.size, 'white')
              rgb.paste(rgba, mask=rgba.getchannel('A'))
              image.close()
              rgba.close()
              return rgb

          def make_preview(source_page, image_urls, output_path):
              pages = []
              for index, url in enumerate(image_urls, start=1):
                  response = fetch(url, referer=source_page)
                  if len(response.content) < 1000:
                      raise RuntimeError(f'page {index} too small')
                  pages.append(image_to_rgb(response.content, f'page {index}'))
              pages[0].save(output_path, 'PDF', save_all=True, append_images=pages[1:], resolution=150.0, quality=95, subsampling=0)
              for page in pages:
                  page.close()
              count = len(PdfReader(str(output_path), strict=False).pages)
              if count != len(image_urls):
                  raise RuntimeError('preview page count mismatch')
              return count

          manifest = []

          hangyan_page = 'https://www.hangyan.co/reports/3097844454174754770'
          page_html = fetch(hangyan_page).text
          node = BeautifulSoup(page_html, 'html.parser').select_one('[data-controller~="native-pdf"]')
          if node is None:
              raise RuntimeError('native-pdf element missing')
          token = node.get('data-native-pdf-cache-key-value')
          original_filename = node.get('data-native-pdf-filename-value') or ''
          if not token:
              raise RuntimeError('public PDF token missing')

          encoded = token.replace('-', '+').replace('_', '/')
          encoded += '=' * ((4 - len(encoded) % 4) % 4)
          payload = base64.b64decode(encoded)
          iv = payload[:16]
          ciphertext = payload[16:]
          public_pdf_url = None
          now = int(time.time())
          for offset in range(-8, 9):
              bucket = math.floor((now + offset * 120) / 120)
              key = ('cv_' + str(bucket) + 'zIDfwokaoIUFlw')[:32].ljust(32, '0').encode()
              try:
                  decryptor = Cipher(algorithms.AES(key), modes.CBC(iv)).decryptor()
                  padded = decryptor.update(ciphertext) + decryptor.finalize()
                  unpadder = PKCS7(128).unpadder()
                  plain = unpadder.update(padded) + unpadder.finalize()
                  candidate = plain.decode('utf-8')
                  if candidate.startswith('http'):
                      public_pdf_url = candidate
                      break
              except Exception:
                  pass
          if public_pdf_url is None:
              raise RuntimeError('could not decrypt public PDF URL')

          full_data = fetch(public_pdf_url, referer=hangyan_page, attempts=4).content
          if not full_data.lstrip().startswith(b'%PDF') or len(full_data) < 50000:
              raise RuntimeError('invalid original PDF')
          full_name = '2023-05-07_兴证国际证券_创新转型逐步加速，龙头地位不断巩固_完整版.pdf'
          full_path = work / full_name
          full_path.write_bytes(full_data)
          full_reader = PdfReader(str(full_path), strict=False)
          full_pages = len(full_reader.pages)
          identity = re.sub(r'\s+', '', ' '.join((page.extract_text() or '') for page in full_reader.pages[:5])).lower()
          if full_pages < 2 or not any(key in identity for key in ('国药控股', '01099', '1099.hk', 'sinopharm')):
              raise RuntimeError('original PDF identity check failed')
          manifest.append({'company': '国药控股股份有限公司', 'stock_code': '01099.HK', 'broker': '兴证国际证券', 'report_date': '2023-05-07', 'title': '创新转型逐步加速，龙头地位不断巩固', 'file': full_name, 'original_filename': original_filename, 'pages': full_pages, 'size_bytes': len(full_data), 'sha256': digest(full_data), 'source_page': hangyan_page, 'access_type': '公开页面下载按钮返回的原始完整PDF'})

          cinda_page = 'https://www.fxbaogao.com/detail/5177796'
          cinda_urls = [f'https://public.fxbaogao.com/report-image/2025/12/05/5177796-{index}.png?x-oss-process=image/format,webp' for index in (1, 2)]
          cinda_name = '2025-12-05_信达证券_医药流通龙头行稳致远，高股息与经营质量优化或助力估值提升_公开预览2页.pdf'
          cinda_path = work / cinda_name
          cinda_pages = make_preview(cinda_page, cinda_urls, cinda_path)
          cinda_data = cinda_path.read_bytes()
          manifest.append({'company': '国药控股股份有限公司', 'stock_code': '01099.HK', 'broker': '信达证券', 'report_date': '2025-12-05', 'title': '医药流通龙头行稳致远，“高股息&经营质量优化”或助力估值提升', 'file': cinda_name, 'reported_full_length_pages': 27, 'pages_included': cinda_pages, 'size_bytes': len(cinda_data), 'sha256': digest(cinda_data), 'source_page': cinda_page, 'access_type': '来源页面公开的2页预览；未收录需下载权限的其余页面'})

          first_page = 'https://www.fxbaogao.com/detail/5080292'
          first_urls = [f'https://public.fxbaogao.com/report-image/2025/09/29/5080292-{index}.png?x-oss-process=image/format,webp' for index in (1, 2)]
          first_name = '2025-09-26_第一上海证券_毛利率仍在下降，效率提升导致净利润率下降趋缓_公开预览2页.pdf'
          first_path = work / first_name
          first_pages = make_preview(first_page, first_urls, first_path)
          first_data = first_path.read_bytes()
          manifest.append({'company': '国药控股股份有限公司', 'stock_code': '01099.HK', 'broker': '第一上海证券', 'report_date': '2025-09-26', 'source_page_date': '2025-09-29', 'title': '毛利率仍在下降，效率提升导致净利润率下降趋缓', 'file': first_name, 'pages_included': first_pages, 'size_bytes': len(first_data), 'sha256': digest(first_data), 'source_page': first_page, 'access_type': '来源页面公开的2页预览；未绕过登录或下载权限'})

          manifest_path = work / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          readme = [
              '国药控股（01099.HK）券商研究报告资料包',
              '',
              '1. 兴证国际证券，2023-05-07，《创新转型逐步加速，龙头地位不断巩固》：公开原始完整PDF。',
              '2. 信达证券，2025-12-05，《医药流通龙头行稳致远，“高股息&经营质量优化”或助力估值提升》：2页公开预览，完整报告标注为27页。',
              '3. 第一上海证券，2025-09-26，《毛利率仍在下降，效率提升导致净利润率下降趋缓》：2页公开预览。',
              '',
              '所有文件均来自无需登录即可访问的公开页面或公开预览资源。预览文件已在文件名和清单中明确标注，未绕过登录、付费或其他访问限制。',
          ]
          (work / 'README_来源说明.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          checksum_lines = [f"{item['sha256']}  {item['file']}" for item in manifest]
          checksum_lines.append(f"{digest(manifest_path.read_bytes())}  manifest.json")
          (work / 'SHA256SUMS.txt').write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8')

          zip_path = out / 'guoyao_konggu_broker_reports.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(work.iterdir(), key=lambda item: item.name):
                  archive.write(path, path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              assert archive.testzip() is None
          print('PACKAGE', zip_path.stat().st_size, digest(zip_path.read_bytes()))
          for item in manifest:
              print('REPORT', item['broker'], item['report_date'], item.get('pages', item.get('pages_included')), item['sha256'])
          PY
          python /tmp/build_fast.py
      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: sinopharm-broker-reports-fast
          path: deliverable/guoyao_konggu_broker_reports.zip
          retention-days: 1
          compression-level: 0
