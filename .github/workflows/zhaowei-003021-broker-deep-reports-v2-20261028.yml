name: Build verified Zhaowei 003021 broker deep reports v2 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zhaowei-003021-broker-deep-reports-v2-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='003021'; SHORT='兆威机电'; FULL='深圳市兆威机电股份有限公司'
          PACKAGE='兆威机电_003021_券商深度报告_2份'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'国金证券','date':'2026-01-14','title':'深耕微驱动廿载，乘具身东风启新程',
              'analysts':'陈传红、冉婷','rating':'买入（首次）','classification':'公司深度研究/首次覆盖',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202601151817032172_1.pdf','info_code':'AP202601151817032172','min_pages':20,
              'broker_aliases':['国金证券','SINOLINK SECURITIES']
            },
            {
              'broker':'东吴证券','date':'2025-02-12','title':'微型传动领域龙头企业，布局灵巧手电机打开成长空间',
              'analysts':'周尔双、钱尧天','rating':'公司深度研究','classification':'公司深度研究',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202502121643014502_1.pdf','info_code':'AP202502121643014502','min_pages':20,
              'broker_aliases':['东吴证券','SOOCHOW SECURITIES']
            },
          ]

          session=requests.Session(); session.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          def safe(v:str)->str: return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',v))[:110]

          manifest=[]
          for idx,rep in enumerate(reports,1):
            attempts=[]; data=None
            for attempt in range(7):
              try:
                r=session.get(rep['url'],headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'},timeout=(30,360),allow_redirects=True)
                attempts.append({'url':rep['url'],'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:
                  data=r.content; break
              except Exception as exc: attempts.append({'url':rep['url'],'attempt':attempt+1,'error':repr(exc)})
              time.sleep(1+attempt)
            if not data: raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

            fn=f"{idx:02d}_{safe(rep['broker'])}_兆威机电_{safe(rep['title'])}_{rep['date']}.pdf"
            dest=PDFDIR/fn; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<rep['min_pages']: raise RuntimeError(f'Unexpectedly short PDF {fn}: {pages}')

            text=''
            for p in reader.pages[:min(30,pages)]:
              try: text+='\n'+(p.extract_text() or '')
              except Exception: pass
            compact=re.sub(r'\s+','',text)
            identity_hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
            broker_hits=[x for x in rep['broker_aliases'] if re.sub(r'\s+','',x).lower() in compact.lower()]
            if len(compact)>500 and not identity_hits: raise RuntimeError(f'Issuer mismatch: {fn}')
            if len(compact)>500 and not broker_hits: raise RuntimeError(f'Broker mismatch: {fn}')

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError(f'Preview failed: {fn}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **{k:v for k,v in rep.items() if k not in ('broker_aliases','min_pages')},
              'actual_pages':pages,'filename':str(Path('原始PDF')/fn),'bytes':len(data),'sha256':sha,
              'identity_hits':identity_hits,'broker_hits':broker_hits,'preview_file':str(Path('首页预览')/preview.name),
              'download_attempts':attempts,'validation':['PDF header','issuer identity','broker identity','page count','qpdf structure','first-page render']
            })

          total_pages=sum(x['actual_pages'] for x in manifest)
          readme=['深圳市兆威机电股份有限公司（003021.SZ）券商深度研究报告资料包','整理日期：2026-10-28','',
                  '本包收录2份公开可直接取得并通过完整性核验的券商原始PDF。','筛选口径：公司深度或首次覆盖，不使用普通财报点评凑数。','']
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级/类型：{x['rating']}",
                       f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",f"   来源PDF：{x['url']}",f"   SHA-256：{x['sha256']}",'']
          readme += [f'合计：{len(manifest)}份PDF，{total_pages}页。','报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
                     '核验项目：PDF文件头、公司名称/证券代码、券商标识、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zcn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2: raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)}')
          zen=Path('zhaowei_003021_broker_deep_reports.zip'); zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: zhaowei-003021-broker-deep-reports-v2-final
          path: |
            兆威机电_003021_券商深度报告_2份.zip
            zhaowei_003021_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
