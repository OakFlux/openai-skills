name: Discover AUX Electric reports on fxbaogao 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-fxbaogao-discovery-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch pages and assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('fx_discovery'); OUT.mkdir(exist_ok=True)
          targets=[
            'https://www.fxbaogao.com/detail/5454573',
            'https://www.fxbaogao.com/detail/5463740',
            'https://www.fxbaogao.com/detail/5357558',
            'https://www.fxbaogao.com/detail/5353793',
            'https://finance.sina.com.cn/wm/2026-06-01/doc-inhzwckz2640125.shtml',
            'https://finance.sina.com.cn/wm/2026-06-08/doc-iniarzfu8894112.shtml',
            'https://finance.sina.com.cn/wm/2026-05-28/doc-inhzkwsy0352911.shtml',
          ]
          sess=requests.Session(); sess.trust_env=False
          sess.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
          for i,url in enumerate(targets,1):
            rec={'input_url':url}
            try:
              r=sess.get(url,timeout=(30,180),allow_redirects=True)
              rec.update(status=r.status_code,final_url=r.url,content_type=r.headers.get('content-type'),bytes=len(r.content),headers=dict(r.headers))
              ext='html'; (OUT/f'{i:02d}_page.{ext}').write_bytes(r.content)
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              assets=[]; imgs=[]; scripts=[]
              attrs=('href','src','data-src','data-original','data-lazy','data-url','content')
              for tag in soup.find_all(True):
                for a in attrs:
                  v=tag.get(a)
                  if not v: continue
                  if isinstance(v,list): continue
                  v=html.unescape(str(v)).replace('\\/','/')
                  if v.startswith(('data:','javascript:','#')): continue
                  av=urljoin(r.url,v)
                  assets.append(av)
                  if tag.name in ('img','source') or re.search(r'\.(?:png|jpe?g|webp)(?:\?|$)',av,re.I): imgs.append(av)
                  if tag.name=='script' and a=='src': scripts.append(av)
              cands=set(assets)
              pats=[r'https?://[^\s"\'<>]+',r'["\']([^"\']*(?:pdf|download|file|report|attachment|source|oss|cos|cdn|preview)[^"\']*)["\']',r'(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|sourceUrl|source_url|reportUrl|url)\s*[:=]\s*["\']([^"\']+)["\']']
              for pat in pats:
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v).replace('\\/','/')
                  if len(v)<2000: cands.add(urljoin(r.url,v))
              rec['assets']=sorted(set(assets)); rec['images']=sorted(set(imgs)); rec['scripts']=sorted(set(scripts)); rec['candidates']=sorted(cands)
              interesting=[]
              for ln in text.splitlines():
                l=ln.lower()
                if any(k in l for k in ('pdf','download','下载','report','file','source','oss','cos','cdn','preview','attachment','__next_data__','nuxt')):
                  s=re.sub(r'\s+',' ',ln).strip()
                  if 0<len(s)<6000: interesting.append(s)
              rec['interesting_lines']=interesting[:1000]
              # fetch scripts and first 100 images to inspect URLs/status/content type
              imgmeta=[]
              for j,iu in enumerate(sorted(set(imgs))[:100]):
                try:
                  ir=sess.get(iu,timeout=(20,90),allow_redirects=True,stream=True)
                  head=next(ir.iter_content(8192),b'')
                  imgmeta.append({'url':iu,'status':ir.status_code,'final':ir.url,'type':ir.headers.get('content-type'),'length':ir.headers.get('content-length'),'head_hex':head[:16].hex()})
                except Exception as e: imgmeta.append({'url':iu,'error':repr(e)})
              rec['image_meta']=imgmeta
              for j,su in enumerate(sorted(set(scripts))[:40]):
                try:
                  sr=sess.get(su,timeout=(20,120),allow_redirects=True)
                  if sr.status_code==200 and len(sr.content)<10_000_000:
                    (OUT/f'{i:02d}_script_{j:02d}.js').write_bytes(sr.content)
                except Exception as e: pass
              (OUT/f'{i:02d}_result.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
              print('OK',i,r.status_code,len(r.content),rec['title'],'imgs',len(imgs),'scripts',len(scripts),flush=True)
            except Exception as e:
              rec['error']=repr(e); (OUT/f'{i:02d}_result.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8'); print('ERR',url,repr(e),flush=True)
          PY
          grep -RInE "https?[^[:space:]\"']+\.pdf|pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|sourceUrl|source_url|attachment|reportFile|original" fx_discovery > fx_discovery/grep_hits.txt || true
          find fx_discovery -type f -printf '%f %s bytes\n' | sort > fx_discovery/file_sizes.txt
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: aux-electric-fxbaogao-discovery
          path: fx_discovery
          retention-days: 7
          if-no-files-found: error
