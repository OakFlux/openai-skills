name: Inspect Futu Huaying report article links

on:
  push:
    paths:
      - '.triggers/huaying-futu-links-inspect-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch Futu page and extract report links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=['https://www.futunn.com/hk/stock/000536-SZ/institutional-ratings','https://www.futunn.com/stock/000536-SZ/institutional-ratings','https://news.futunn.com/stock/000536-SZ/institutional-ratings']
          for u in urls:
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('FETCH',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; print('PREFIX',text[:1000],flush=True)
              soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split()); href=urllib.parse.urljoin(r.url,a['href'])
                if any(k in (label+href) for k in ['华映科技','華映科技','000536','IGZO','3D玻璃','拐点将现','拐點將現']): print('LINK',json.dumps({'text':label,'href':href},ensure_ascii=False),flush=True)
              for pat in ['华映科技','華映科技','000536','IGZO','3D玻璃','拐点将现','拐點將現','institutional']:
                hits=[]
                for m in list(re.finditer(pat,text,re.I))[:80]: hits.append(text[max(0,m.start()-500):min(len(text),m.end()+1000)])
                if hits: print('SNIPS',pat,json.dumps(hits[:30],ensure_ascii=False),flush=True)
              for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                x=html.unescape(m.group(0)).replace('\\/','/').rstrip(');,]}')
                if any(k.lower() in x.lower() for k in ['futunn.com/post','000536','institutional']): print('URL',x[:1000],flush=True)
            except Exception as e: print('ERR',u,repr(e),flush=True)
          PY
