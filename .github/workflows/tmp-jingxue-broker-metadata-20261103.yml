name: Probe Jingxue broker metadata sources

on:
  push:
    branches:
      - tmp-jingxue-broker-metadata-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe public report pages
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://app.finance.ifeng.com/report/search.php?code=301010&yb_search_type=stock',
            'https://apphqweb.compass.cn/F10/SZHQ301010_d_16.html',
            'https://apphqweb.compass.cn/F10/SZHQ301010_d_15.html',
            'https://stock.quote.stockstar.com/corp/rating_301010.shtml',
            'https://basic.10jqka.com.cn/301010/',
            'https://basic.10jqka.com.cn/301010/worth.html',
            'https://doctor.10jqka.com.cn/301010/',
          ]
          for u in urls:
            print('\n==========',u,'==========')
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url,'TYPE',r.headers.get('content-type'))
              enc=r.apparent_encoding or r.encoding or 'utf-8'; r.encoding=enc
              text=html.unescape(r.text).replace('\\/','/')
              print('ENC',enc,'TITLE',BeautifulSoup(text,'html.parser').title)
              compact=re.sub(r'\s+',' ',text)
              for keyword in ['晶雪节能','301010','东北证券','研究报告','研报','评级','2023-04-25','0.54','0.76']:
                print('COUNT',keyword,compact.count(keyword))
              # Print context windows around key matches.
              for pat in ['东北证券','2023-04-25','晶雪节能','研究报告','研报']:
                pos=0; emitted=0
                while emitted<8:
                  i=compact.find(pat,pos)
                  if i<0: break
                  print('CTX',pat,compact[max(0,i-500):i+1000])
                  pos=i+len(pat); emitted+=1
              soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all('a',href=True):
                label=re.sub(r'\s+','',a.get_text(' ',strip=True))
                href=urljoin(r.url,a.get('href'))
                if any(k in label for k in ['晶雪节能','研报','报告','评级','东北证券']) or any(k in href for k in ['report','Report','yb','research','rating','pdf','PDF']):
                  print('LINK',label,href)
              # Search scripts and raw HTML for endpoints/JSON records.
              pats=[
                r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                r'[^\s\"\'<>]{0,120}东北证券[^\s\"\'<>]{0,500}',
                r'[^\s\"\'<>]{0,120}2023-04-25[^\s\"\'<>]{0,500}',
                r'(?:api|ajax|report|research|rating)[^\s\"\'<>]{0,300}',
              ]
              for pat in pats:
                found=re.findall(pat,text,flags=re.I)
                for m in found[:30]: print('MATCH',m)
            except Exception as e:
              print('ERROR',repr(e))
          PY
