name: Search Greentown China broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-03900-report-search-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query public report API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests, json
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          queries=['绿城中国','绿城中国 首次覆盖','绿城中国 深度','高确定性土储 高品质定位','稳健经营 品质标杆']
          out={}
          for q in queries:
              payload={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=(20,60))
                  out[q]={'status':r.status_code,'text':r.text}
              except Exception as e:
                  out[q]={'error':repr(e)}
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:300000])
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: greentown-03900-report-search
          path: out
          retention-days: 7
          if-no-files-found: error
