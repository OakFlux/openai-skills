name: Temporary sgpjbg browser probe

on:
  push:
    branches:
      - tmp/china-everbright-sgpjbg-browser-probe-20260831

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet selenium beautifulsoup4 lxml requests
      - name: Locate report page and inspect resources
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, shutil, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          OUT=Path('out'); OUT.mkdir()
          topic='https://www.sgpjbg.com/zhuanti/beikeguangdabaogao.html'
          phrases=['资负共振','锚定科创','拐点已现','中国光大控股']
          result={'topic':{},'search':{},'details':[]}

          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1600,2000')
          options.add_argument('--disable-gpu')
          options.add_argument('--lang=zh-CN')
          options.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=options)
          try:
              driver.get(topic)
              WebDriverWait(driver,30).until(lambda d: len(d.page_source)>1000)
              time.sleep(3)
              source=driver.page_source
              (OUT/'topic.html').write_text(source,encoding='utf-8')
              driver.save_screenshot(str(OUT/'topic.png'))
              soup=BeautifulSoup(source,'lxml')
              links=[]
              for a in soup.find_all('a',href=True):
                  text=a.get_text(' ',strip=True)
                  href=urllib.parse.urljoin(driver.current_url,a['href'])
                  blob=(text+' '+href).replace(' ','')
                  if any(p in blob for p in phrases):
                      links.append({'text':text,'url':href,'outer':str(a)[:4000]})
              contexts=[]
              for phrase in phrases:
                  for m in list(re.finditer(re.escape(phrase),source))[:10]:
                      contexts.append({'phrase':phrase,'pos':m.start(),'context':source[max(0,m.start()-3000):m.start()+7000]})
              bgdowns=[]
              for m in re.finditer(r'(?:https?://www\.sgpjbg\.com)?/bgdown/\d+\.html',source):
                  url=urllib.parse.urljoin(driver.current_url,m.group(0))
                  ctx=source[max(0,m.start()-1800):m.end()+2500]
                  if any(p in ctx for p in phrases):
                      bgdowns.append({'url':url,'context':ctx})
              # Also inspect live matching elements and href properties.
              live=[]
              for phrase in phrases:
                  for elem in driver.find_elements(By.XPATH,f"//*[contains(normalize-space(.),'{phrase}')]")[:30]:
                      try:
                          live.append({'phrase':phrase,'tag':elem.tag_name,'text':elem.text[:500],'href':elem.get_attribute('href'),'outer':(elem.get_attribute('outerHTML') or '')[:5000]})
                      except Exception:
                          pass
              result['topic']={'url':driver.current_url,'title':driver.title,'source_len':len(source),'links':links,'bgdowns':bgdowns,'contexts':contexts,'live':live,'browser_log':driver.get_log('browser')}
              print('TOPIC_SUMMARY',json.dumps({'url':driver.current_url,'title':driver.title,'source_len':len(source),'links':links,'bgdowns':bgdowns,'live':live[:20]},ensure_ascii=False),flush=True)
          finally:
              driver.quit()

          # Search engines sometimes expose the exact individual URL even when the site blocks requests.
          sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          queries=[
              'site:sgpjbg.com/bgdown 资负共振 锚定科创 拐点已现',
              'site:sgpjbg.com/bgdown 中国光大控股 0165.HK 250903',
              '"中国光大控股（0165.HK）-港股公司首次覆盖报告"',
          ]
          search_hits=[]
          for q in queries:
              for engine,url in [
                  ('bing','https://www.bing.com/search?q='+urllib.parse.quote(q)),
                  ('duckduckgo','https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)),
              ]:
                  try:
                      r=sess.get(url,timeout=60); r.encoding=r.apparent_encoding or r.encoding
                      (OUT/f'{engine}_{len(search_hits)}.html').write_text(r.text,encoding='utf-8')
                      urls=[]
                      for x in re.findall(r'https?://[^\"\'<>\\s]+',r.text):
                          x=x.replace('&amp;','&')
                          if 'sgpjbg.com' in x and ('bgdown' in x or 'zhuanti' in x): urls.append(x)
                      ss=BeautifulSoup(r.text,'lxml')
                      for a in ss.find_all('a',href=True):
                          href=a['href']
                          if 'sgpjbg.com' in href: urls.append(href)
                      item={'query':q,'engine':engine,'status':r.status_code,'len':len(r.text),'urls':list(dict.fromkeys(urls))[:100]}
                      search_hits.append(item); print('SEARCH',json.dumps(item,ensure_ascii=False),flush=True)
                  except Exception as exc:
                      search_hits.append({'query':q,'engine':engine,'error':repr(exc)})
          result['search']=search_hits

          # Fetch every candidate individual page in a browser and inspect text/resources.
          candidates=[]
          for item in result.get('topic',{}).get('links',[]): candidates.append(item['url'])
          for item in result.get('topic',{}).get('bgdowns',[]): candidates.append(item['url'])
          for item in search_hits:
              candidates.extend(item.get('urls') or [])
          clean=[]
          for u in candidates:
              if '/bgdown/' in u and u not in clean: clean.append(u)
          driver=webdriver.Chrome(options=options)
          try:
              for idx,u in enumerate(clean[:20]):
                  try:
                      driver.get(u); WebDriverWait(driver,25).until(lambda d: len(d.page_source)>800); time.sleep(2)
                      source=driver.page_source; soup=BeautifulSoup(source,'lxml'); text=soup.get_text('\n',strip=True)
                      (OUT/f'detail_{idx}.html').write_text(source,encoding='utf-8')
                      driver.save_screenshot(str(OUT/f'detail_{idx}.png'))
                      resources=[]
                      for tag in soup.find_all(True):
                          for attr in ['href','src','data-src','data','action','value','onclick']:
                              v=tag.get(attr)
                              if not v: continue
                              full=urllib.parse.urljoin(driver.current_url,str(v))
                              if any(k in str(v).lower() for k in ['pdf','download','file','oss','cdn','upload','report','bgdown']):
                                  resources.append({'tag':tag.name,'attr':attr,'value':str(v),'url':full,'text':tag.get_text(' ',strip=True)[:100],'attrs':dict(tag.attrs)})
                      raw_urls=[x for x in sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',source))) if any(k in x.lower() for k in ['pdf','download','file','oss','cdn','upload','report'])]
                      page_markers=re.findall(r'(?<!\d)(\d{1,3})\s*/\s*23(?!\d)',text)
                      detail={'url':driver.current_url,'title':driver.title,'source_len':len(source),'text_len':len(text),'contains_title':all(x in text for x in ['资负共振','拐点已现']),'page_markers':page_markers,'resources':resources[:500],'raw_urls':raw_urls[:500],'text_start':text[:4000],'text_end':text[-8000:]}
                      result['details'].append(detail); print('DETAIL_SUMMARY',json.dumps({k:detail[k] for k in ['url','title','source_len','text_len','contains_title','page_markers','resources','raw_urls']},ensure_ascii=False),flush=True)
                  except Exception as exc:
                      result['details'].append({'url':u,'error':repr(exc)}); print('DETAIL_ERROR',u,repr(exc),flush=True)
          finally:
              driver.quit()

          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: sgpjbg-browser-probe
          path: out/
          retention-days: 3
          if-no-files-found: error