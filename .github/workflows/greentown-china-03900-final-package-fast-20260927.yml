name: Build Greentown China 03900 report package fast 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-china-03900-final-package-fast-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Python validators
        run: python -m pip install --quiet requests pypdf
      - name: Concurrent download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, time, zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='绿城中国_03900_2020-2025年报_2026最新中期报告_官方原件'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          docs=[
            (1,2020,'年度报告','https://doc.irasia.com/listco/hk/greentownchina/annual/2020/car2020.pdf'),
            (2,2021,'年度报告','https://doc.irasia.com/listco/hk/greentownchina/annual/2021/car2021.pdf'),
            (3,2022,'年度报告','https://doc.irasia.com/listco/hk/greentownchina/annual/2022/car2022.pdf'),
            (4,2023,'年度报告','https://doc.irasia.com/listco/hk/greentownchina/annual/2023/car2023.pdf'),
            (5,2024,'年度报告','https://doc.irasia.com/listco/hk/greentownchina/annual/2024/car2024.pdf'),
            (6,2025,'年度报告','https://doc.irasia.com/listco/hk/greentownchina/annual/2025/car2025.pdf'),
            (7,2026,'最新中期报告','https://doc.irasia.com/listco/hk/greentownchina/interim/2026/intrepc.pdf'),
          ]
          def filename(i,y,cat):
            if cat=='年度报告': return f'{i:02d}_绿城中国_03900_{y}年年度报告.pdf'
            return f'{i:02d}_绿城中国_03900_{y}年中期报告_官网最新定期报告.pdf'
          def fetch(doc):
            i,y,cat,url=doc; dest=out/filename(i,y,cat)
            s=requests.Session(); s.trust_env=False
            s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152','Accept':'application/pdf,*/*;q=0.8','Referer':'https://www.greentownchina.com/tc/ir/reports.php'})
            errors=[]
            for candidate in [url,url.replace('https://','http://')]:
              for attempt in range(1,4):
                part=dest.with_suffix('.pdf.part')
                try:
                  with s.get(candidate,timeout=(20,240),stream=True,allow_redirects=True) as r:
                    print('GET',y,cat,r.status_code,r.url,flush=True); r.raise_for_status()
                    with part.open('wb') as f:
                      for chunk in r.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                  if part.stat().st_size<300000 or part.read_bytes()[:5]!=b'%PDF-': raise RuntimeError('invalid PDF')
                  part.replace(dest)
                  return doc,dest,str(r.url)
                except Exception as e:
                  errors.append(repr(e)); part.unlink(missing_ok=True); time.sleep(attempt)
            raise RuntimeError(f'{y} download failed {errors}')
          downloads=[]
          with ThreadPoolExecutor(max_workers=4) as ex:
            futs=[ex.submit(fetch,d) for d in docs]
            for f in as_completed(futs): downloads.append(f.result())
          downloads.sort(key=lambda x:x[0][0])
          records=[]; seen=set()
          for doc,dest,final_url in downloads:
            i,y,cat,url=doc
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            min_pages=100 if cat=='年度报告' else 40
            if pages<min_pages: raise RuntimeError(f'{dest.name} too few pages {pages}')
            sample=''
            for p in reader.pages[:min(5,pages)]:
              try: sample+='\n'+(p.extract_text() or '')
              except Exception: pass
            low=sample.lower()
            if not any(x in low for x in ['greentown china','綠城中國','绿城中国','03900','3900']):
              print('WARN identity text not extracted for',dest.name,flush=True)
            data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in seen: raise RuntimeError('duplicate PDF '+dest.name)
            seen.add(sha)
            rec={'filename':dest.name,'title':f'绿城中国{y}年'+('年度报告' if cat=='年度报告' else '中期报告'),'report_year':y,'category':cat,'source_url':final_url,'pages':pages,'bytes':len(data),'sha256':sha}
            records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)
          readme=['绿城中国控股有限公司（03900.HK）2020—2025年年度报告及2026年最新中期报告','整理日期：2026-09-27','','收录：2020—2025年完整年报6份；2026年中期报告1份，共7份官方PDF。','','说明：绿城中国官网未提供独立季度报告，因此以2026年中期报告作为最新一期定期财务报告。','','文件清单：']
          for n,r in enumerate(records,1):
            readme += [f"{n}. {r['title']}（{r['pages']}页，{r['bytes']/1048576:.2f} MB）",f"   文件：{r['filename']}",f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          readme += ['完整性核验：PDF文件头、实际页数、公司官方来源、重复文件、逐文件SHA-256及ZIP CRC。']
          (out/'00_文件清单与范围说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')
          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_STORED,allowZip64=True) as a:
            for p in sorted(out.iterdir()): a.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(z) as a:
            bad=a.testzip(); assert not bad,bad
            assert len([n for n in a.namelist() if n.endswith('.pdf')])==7
          print('FINAL_ZIP',z,z.stat().st_size,'SHA256',hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-03900-annual-interim-final-fast
          path: 绿城中国_03900_2020-2025年报_2026最新中期报告_官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
