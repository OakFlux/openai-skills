name: Inspect RoboSense HKEX API
on:
  push:
    branches:
      - tmp-robosense-api-discovery-20260914
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query title search endpoint
        run: |
          set -euo pipefail
          mkdir -p output
          python -m pip install --quiet httpx
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx

          endpoint='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          common={
            'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK',
            'stockId':'1000211551','documentType':'-1','fromDate':'20230101','toDate':'20260914',
            'title':'','searchType':'1','t1code':'40000','t2Gcode':'-2','rowRange':'2000','lang':'EN'
          }
          all_items=[]
          diagnostics=[]
          with httpx.Client(http2=True, timeout=60, follow_redirects=True, headers={
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000211551'
          }) as client:
            for code in ['-2','40100','40200','40300','40400','40500']:
              params={**common,'t2code':code}
              r=client.get(endpoint,params=params)
              rec={'code':code,'status':r.status_code,'url':str(r.url),'content_type':r.headers.get('content-type'),'length':len(r.content),'head':r.text[:1000]}
              try:
                outer=r.json()
                rec['outer_type']=type(outer).__name__
                if isinstance(outer,dict) and 'result' in outer:
                  result=outer['result']
                  inner=json.loads(result) if isinstance(result,str) else result
                else:
                  inner=outer
                rec['inner_type']=type(inner).__name__
                if isinstance(inner,dict):
                  rec['inner_keys']=list(inner.keys())[:30]
                  candidate=inner.get('result') or inner.get('records') or inner.get('data') or inner.get('items') or inner
                else:
                  candidate=inner
                if isinstance(candidate,list):
                  rec['count']=len(candidate)
                  for item in candidate:
                    if isinstance(item,dict):
                      item=dict(item);item['_query_t2code']=code;all_items.append(item)
                elif isinstance(candidate,dict):
                  lists=[v for v in candidate.values() if isinstance(v,list)]
                  rec['nested_list_counts']=[len(v) for v in lists]
                  for lst in lists:
                    for item in lst:
                      if isinstance(item,dict):
                        item=dict(item);item['_query_t2code']=code;all_items.append(item)
              except Exception as e:
                rec['parse_error']=repr(e)
              diagnostics.append(rec)

          # dedupe
          unique=[];seen=set()
          for item in all_items:
            key=(str(item.get('TITLE') or item.get('title')),str(item.get('FILE_LINK') or item.get('fileLink') or item.get('url')))
            if key in seen: continue
            seen.add(key);unique.append(item)

          Path('output/diagnostics.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/records.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_COUNT',len(unique))
          for item in unique:
            blob=' '.join(str(item.get(k,'')) for k in ['TITLE','title','FILE_LINK','fileLink','FILE_INFO','DATE_TIME'])
            if any(x in blob.upper() for x in ['ANNUAL REPORT','PROSPECTUS','GLOBAL OFFERING','FIRST QUARTER OF 2026','INTERIM RESULTS ANNOUNCEMENT']):
              print('MATCH',json.dumps(item,ensure_ascii=False))
          PY
      - name: Upload diagnostic files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robosense-hkex-api-discovery
          path: output/*
          retention-days: 1
          if-no-files-found: warn
