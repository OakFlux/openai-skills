name: Probe SGPJBG Yousheng report download 20260929

on:
  push:
    paths:
      - '.github/workflows/yousheng-603418-sgpjbg-download-probe-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Probe page scripts and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          from html import unescape
          from urllib.parse import urljoin

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.sgpjbg.com/baogao/1269661.html',
          })

          page = s.get('https://www.sgpjbg.com/baogao/1269661.html', timeout=(15,60))
          print('PAGE', page.status_code, len(page.content), page.url, flush=True)
          page.raise_for_status()
          text = page.text

          for keyword in ['1269661', '184928', 'bgdown', 'download', 'DownLoad', 'FileUpload', 'fileroot', '.pdf', 'filepath', 'filePath', 'bookurl', 'docurl', 'reporturl']:
              positions = [m.start() for m in re.finditer(re.escape(keyword), text, re.I)]
              print('KEYWORD', keyword, 'COUNT', len(positions), flush=True)
              for pos in positions[-8:]:
                  snippet = unescape(text[max(0,pos-450):pos+900]).replace('\n',' ')
                  print('SNIPPET', keyword, snippet, flush=True)

          endpoints = [
              'https://www.sgpjbg.com/bgdown/1269661.html',
              'https://www.sgpjbg.com/bgdown/1269661.html?dtype=0',
              'https://www.sgpjbg.com/bgdown/1269661.html?dtype=184928',
              'https://m.sgpjbg.com/bgdown/1269661.html',
              'https://m.sgpjbg.com/bgdown/1269661.html?dtype=0',
          ]
          for url in endpoints:
              for follow in [False, True]:
                  try:
                      r = s.get(url, timeout=(15,60), allow_redirects=follow, stream=True)
                      head = next(r.iter_content(256), b'')
                      print('PROBE', url, 'FOLLOW', follow, 'STATUS', r.status_code, 'FINAL', r.url, 'LOC', r.headers.get('location'), 'CTYPE', r.headers.get('content-type'), 'CLEN', r.headers.get('content-length'), 'HEAD', repr(head[:100]), flush=True)
                      r.close()
                  except Exception as e:
                      print('ERROR', url, follow, repr(e), flush=True)
          PY
