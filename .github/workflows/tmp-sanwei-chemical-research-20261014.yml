name: Build Sanwei Chemical broker report package 20261014

on:
  push:
    branches:
      - tmp-sanwei-chemical-research-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Download and validate broker reports
        env:
          PYTHONUTF8: "1"
        run: python tmp/sanwei_chemical_broker_reports_20261014.py

      - name: Upload final ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanwei-Chemical-002469-broker-deep-reports
          path: sanwei_chemical_broker_reports/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
