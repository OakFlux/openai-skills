name: Download Huaxin Nanfang Precision PDF

on:
  push:
    branches:
      - chatgpt-nanfang-precision-reports-20261004
    paths:
      - .github/workflows/download_huaxin_nanfang_pdf_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Resolve current public viewer URL and download PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import html, json, re, subprocess
          from pathlib import Path
          import requests

          page='https://www.hangyan.co/reports/3492847056811197936'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          r=s.get(page,timeout=90,allow_redirects=True)
          r.raise_for_status()
          text=r.text
          patterns=[
              r'data-native-pdf-cache-key-value="([^"]+)"',
              r'data-pdf-master-cache-key-value="([^"]+)"',
              r'cache-key-value="([^"]+)"',
          ]
          cache=None
          for p in patterns:
              m=re.search(p,text,re.I)
              if m:
                  cache=html.unescape(m.group(1)); break
          if not cache:
              raise RuntimeError('No public viewer cache key found')
          print('CACHE_LEN',len(cache), 'HEAD',cache[:24])
          Path('output/cache.txt').write_text(cache,encoding='utf-8')

          js=r'''
          const crypto = require('crypto').webcrypto;
          const cache = process.argv[2];
          const prefix='cv_', suffix='zIDfwokaoIUFlw', windowSec=120;
          function keyFor(ts){
            const bucket=Math.floor(ts/windowSec).toString();
            return (prefix+bucket+suffix).slice(0,32).padStart(32,'0');
          }
          async function dec(token,key){
            try{
              let b64=token.replace(/-/g,'+').replace(/_/g,'/');
              b64=b64.padEnd(b64.length+(4-b64.length%4)%4,'=');
              const all=Buffer.from(b64,'base64');
              const iv=all.subarray(0,16), data=all.subarray(16);
              const keyBytes=Buffer.alloc(32); Buffer.from(key).subarray(0,32).copy(keyBytes);
              const k=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-CBC'},false,['decrypt']);
              const out=await crypto.subtle.decrypt({name:'AES-CBC',iv},k,data);
              return Buffer.from(out).toString('utf8');
            }catch(e){return null}
          }
          (async()=>{
            const now=Math.floor(Date.now()/1000);
            for(let r=-2;r<=2;r++){
              const key=keyFor(now+r*windowSec);
              const value=await dec(cache,key);
              if(value && /^https?:\/\//.test(value)){
                process.stdout.write(value); return;
              }
            }
            process.exit(2);
          })();
          '''
          Path('output/resolve.js').write_text(js,encoding='utf-8')
          result=subprocess.run(['node','output/resolve.js',cache],capture_output=True,text=True,check=True)
          url=result.stdout.strip()
          print('RESOLVED_URL',url)
          Path('output/resolved_url.txt').write_text(url,encoding='utf-8')

          rr=s.get(url,headers={'Referer':page,'Accept':'application/pdf,*/*'},timeout=180,allow_redirects=True)
          print('PDF_FETCH',rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'))
          rr.raise_for_status()
          if not rr.content.startswith(b'%PDF'):
              raise RuntimeError(f'Not PDF: {rr.content[:80]!r}')
          out=Path('output/huaxin_nanfang_precision_2024.pdf')
          out.write_bytes(rr.content)
          from pypdf import PdfReader
          reader=PdfReader(str(out))
          print('PDF_PAGES',len(reader.pages),'ENCRYPTED',reader.is_encrypted)
          meta={'source_page':page,'resolved_url':url,'final_url':rr.url,'bytes':len(rr.content),'pages':len(reader.pages)}
          Path('output/metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: huaxin-nanfang-precision-pdf
          path: |
            output/huaxin_nanfang_precision_2024.pdf
            output/metadata.json
          retention-days: 1
