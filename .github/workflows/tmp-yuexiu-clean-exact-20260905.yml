name: Build clean Yuexiu report public previews exact
on:
  push:
    branches: [tmp-yuexiu-clean-exact-20260905]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build clean PDFs and ZIP
        run: |
          python -m pip install --quiet requests pillow pypdf
          python - <<'PY'
          import hashlib,io,json,re,zipfile
          from pathlib import Path
          import requests
          from PIL import Image,ImageOps
          from pypdf import PdfReader

          reps=[
            {'date':'2025-03-31','broker':'兴证国际证券','title':'平临高速收购落地，保持稳健派息','base':'https://public.fxbaogao.com/report-image/2025/03/31/4757676','source':'https://www.fxbaogao.com/detail/4757676','total':4},
            {'date':'2025-03-17','broker':'东兴证券','title':'越秀交通基建：平临高速将增厚25年业绩，收费权摊销略高于预期','base':'https://public.fxbaogao.com/report-image/2025/03/17/4734664','source':'https://www.fxbaogao.com/detail/4734664','total':6},
            {'date':'2023-08-09','broker':'国联证券','title':'中期分红率53.8%，基本面长期向好','base':'https://public.fxbaogao.com/report-image/2023/08/09/3834744','source':'https://www.fxbaogao.com/detail/3834744','total':None},
          ]
          out=Path('out');out.mkdir(exist_ok=True); work=Path('work');work.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          manifest=[]
          for r in reps:
            ims=[]
            for n in (1,2):
              u=f"{r['base']}-{n}.png?x-oss-process=image/format,webp"
              q=s.get(u,timeout=25,headers={'Referer':r['source']});q.raise_for_status()
              im=ImageOps.exif_transpose(Image.open(io.BytesIO(q.content)))
              if im.mode in ('RGBA','LA') or 'transparency' in im.info:
                rgba=im.convert('RGBA'); bg=Image.new('RGBA',rgba.size,(255,255,255,255));bg.alpha_composite(rgba);rgb=bg.convert('RGB')
              else: rgb=im.convert('RGB')
              im.close();ims.append(rgb)
            safe=re.sub(r'[\\/:*?"<>|]+','_',r['title'])
            fn=f"{r['date']}_{r['broker']}_{safe}_公开预览版_前2页.pdf";p=work/fn
            ims[0].save(p,'PDF',save_all=True,append_images=ims[1:],resolution=160,quality=95,subsampling=0)
            for x in ims:x.close()
            pages=len(PdfReader(str(p),strict=False).pages);data=p.read_bytes();manifest.append({**r,'file':fn,'public_preview_pages':pages,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'status':'公开预览版，不是券商原始完整版PDF'})
          read=['越秀交通基建（01052.HK）券商研究报告公开预览资料包','','共3份券商单公司研究报告公开预览PDF。','','重要说明：','1. 来源平台在无需登录状态下仅公开展示每份报告前2页；完整原始PDF需要平台授权或登录权限，本资料包不是完整版。','2. PDF由公开展示页按原顺序合成，透明背景已正确还原为白色，未改写页面内容。','3. 仅供个人研究学习，版权归原券商及作者所有，不构成投资建议。','','文件清单：']
          for i,x in enumerate(manifest,1): read.append(f"{i}. {x['broker']}｜{x['date']}｜{x['title']}｜公开前2页"+(f"；原报告共{x['total']}页" if x['total'] else ''))
          (work/'README_重要说明.txt').write_text('\n'.join(read),encoding='utf-8');(work/'manifest.json').write_text(json.dumps({'company':'越秀交通基建有限公司','stock_code':'01052.HK','package_type':'public_preview','reports':manifest},ensure_ascii=False,indent=2),encoding='utf-8');(work/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['file']}" for x in manifest)+'\n',encoding='utf-8')
          z=out/'yuexiu_transport_broker_reports_public_previews_3.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as q:
            for x in manifest:q.write(work/x['file'],x['file'])
            for n in ['README_重要说明.txt','manifest.json','SHA256SUMS.txt']:q.write(work/n,n)
          with zipfile.ZipFile(z) as q: assert q.testzip() is None and len([n for n in q.namelist() if n.endswith('.pdf')])==3
          print('FINAL',z,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yuexiu-transport-clean-exact
          path: out/yuexiu_transport_broker_reports_public_previews_3.zip
          retention-days: 1
          compression-level: 0
