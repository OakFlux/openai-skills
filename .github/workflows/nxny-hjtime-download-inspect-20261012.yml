name: Inspect Nxny HJTime download endpoints 20261012

on:
  push:
    paths:
      - '.github/workflows/nxny-hjtime-download-inspect-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect report pages and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          from bs4 import BeautifulSoup
          pages={
              '6218779':'https://www.nxny.com/report/view_6218779.html',
              '6215721':'https://www.nxny.com/report/view_6215721.html',
              '6192890':'https://www.nxny.com/report/view_6192890.html',
              '6080394':'https://www.nxny.com/report/view_6080394.html',
              '5469759':'https://www.nxny.com/report/view_5469759.html',
          }
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.nxny.com/stock/stock_603101/','Accept-Language':'zh-CN,zh;q=0.9','Accept':'text/html,application/javascript,application/json,*/*'})
          scripts=set()
          for rid,url in pages.items():
              try:
                  r=s.get(url,timeout=(15,60),allow_redirects=True)
                  print('PAGE',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  text=r.text; soup=BeautifulSoup(text,'lxml')
                  links=[]; forms=[]
                  for tag in soup.find_all(True):
                      for attr in ('href','src','onclick','data-url','data-src','action','value'):
                          val=tag.get(attr)
                          if not val: continue
                          sv=str(val)
                          if attr in ('href','src','data-url','data-src','action'): sv=urllib.parse.urljoin(r.url,sv)
                          if tag.name=='script' and attr=='src': scripts.add(sv)
                          if any(k in sv.lower() for k in ('download','pdf','file','report','login','view','get')) or rid in sv:
                              links.append({'tag':tag.name,'attr':attr,'value':sv,'text':' '.join(tag.get_text(' ',strip=True).split())[:300]})
                  for form in soup.find_all('form'):
                      forms.append({'action':urllib.parse.urljoin(r.url,form.get('action') or ''),'method':form.get('method'),'html':str(form)[:4000]})
                  print('LINKS',rid,json.dumps(links[:500],ensure_ascii=False),flush=True)
                  print('FORMS',rid,json.dumps(forms,ensure_ascii=False),flush=True)
                  raw_urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',text)))
                  interesting=[u.replace('\\/','/') for u in raw_urls if any(k in u.lower() for k in ('pdf','download','file','report','login','get'))]
                  print('URLS',rid,json.dumps(interesting[:500],ensure_ascii=False),flush=True)
                  for pat in ('download','下载','pdf','file','reportid','report_id','view_','member','login','6215721','6192890','6080394','5469759'):
                      snips=[]
                      for m in list(re.finditer(pat,text,re.I))[:100]: snips.append(text[max(0,m.start()-500):min(len(text),m.end()+1000)])
                      if snips: print('SNIPS',rid,pat,json.dumps(snips[:100],ensure_ascii=False),flush=True)
              except Exception as e: print('PAGE_ERR',rid,url,repr(e),flush=True)
          for i,url in enumerate(sorted(scripts),1):
              try:
                  r=s.get(url,timeout=(15,60),allow_redirects=True); text=r.text
                  print('SCRIPT',i,r.status_code,len(r.content),url,flush=True)
                  hits=[]
                  for pat in ('download','pdf','file','report','login','member','ajax','getfile'):
                      for m in list(re.finditer(pat,text,re.I))[:150]: hits.append(text[max(0,m.start()-300):min(len(text),m.end()+700)])
                  if hits: print('SCRIPT_HITS',url,json.dumps(hits[:200],ensure_ascii=False),flush=True)
              except Exception as e: print('SCRIPT_ERR',url,repr(e),flush=True)
          PY
