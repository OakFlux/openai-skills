name: Scrape public 9fzt CR BMT report index
on:
  push:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch public report index and detail pages
        run: |
          mkdir -p out/details
          python - <<'PY'
          import json
          import re
          import requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          out=Path('out')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          index='https://gmg.9fzt.com/report/HKSE/01313/index.html'
          r=s.get(index,timeout=60)
          print('INDEX',r.status_code,len(r.content),r.url)
          (out/'index.html').write_text(r.text,encoding='utf-8')
          soup=BeautifulSoup(r.text,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
              href=urljoin(r.url,a['href'])
              if re.search(r'/report/HKSE/01313/\d+\.html$',href):
                  links.append(href)
          for m in re.findall(r'https?://[^"\'<>\s]+/report/HKSE/01313/\d+\.html',r.text):
              links.append(m)
          for m in re.findall(r'/report/HKSE/01313/\d+\.html',r.text):
              links.append(urljoin(r.url,m))
          links=list(dict.fromkeys(links))
          print('LINK_COUNT',len(links))
          records=[]
          for href in links[:200]:
              try:
                  d=s.get(href,timeout=60)
                  print('DETAIL',href,d.status_code,len(d.content))
                  if d.status_code!=200: continue
                  name=href.rsplit('/',1)[-1]
                  (out/'details'/name).write_text(d.text,encoding='utf-8')
                  ds=BeautifulSoup(d.text,'html.parser')
                  title=ds.title.get_text(' ',strip=True) if ds.title else ''
                  next_data=ds.find('script',id='__NEXT_DATA__')
                  parsed={}
                  if next_data:
                      try:
                          parsed=json.loads(next_data.string or next_data.get_text())
                      except Exception:
                          parsed={}
                  detail=parsed.get('props',{}).get('pageProps',{}).get('detail',{}) if parsed else {}
                  records.append({'url':href,'title':title,'orgName':detail.get('orgName'),'report_title':detail.get('title'),'s3url':detail.get('s3url'),'publishDate':detail.get('publishDate'),'abstract_len':len(detail.get('abstract') or '')})
              except Exception as exc:
                  records.append({'url':href,'error':repr(exc)})
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(records,ensure_ascii=False,indent=2))
          PY
      - name: Upload scraped pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crbmt-9fzt-index-data
          path: out
          retention-days: 1
          compression-level: 0
