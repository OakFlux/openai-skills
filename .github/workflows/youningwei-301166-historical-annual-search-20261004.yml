name: Search Youningwei 301166 historical annual reports 20261004

on:
  push:
    paths:
      - '.github/workflows/youningwei-301166-historical-annual-search-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search all bulletin pages for historical annual reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          seen=set()
          for page in range(1,81):
            url=f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/301166.phtml?Page={page}'
            r=s.get(url,timeout=60); r.raise_for_status()
            soup=BeautifulSoup(r.content.decode('gb18030',errors='replace'),'lxml')
            matches=[]
            for a in soup.find_all('a',href=True):
              label=re.sub(r'\s+','',a.get_text(' ',strip=True))
              if re.search(r'20(1[0-9]|20)年年度报告',label) and '摘要' not in label and '披露' not in label and '问询' not in label:
                href=urljoin(r.url,a['href'])
                key=(label,href)
                if key not in seen:
                  seen.add(key); matches.append(key)
            if matches:
              print('PAGE',page,'BYTES',len(r.content),flush=True)
              for label,href in matches:
                print('ANNUAL',label,href,flush=True)
            if page>35 and len(r.content)<30000:
              break
          print('TOTAL',len(seen),flush=True)
          PY
