name: ZJLD Parse Only

on:
  push:
    branches:
      - chatgpt-zjld-broker-20260922
    paths:
      - .github/workflows/zjld_parse_only.yml

permissions:
  contents: read
  actions: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Parse source pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/parse.py <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          O=Path('out'); s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          pages={
          'sgp_citic':'https://www.sgpjbg.com/baogao/112813.html',
          'sgp_fangzheng':'https://www.sgpjbg.com/bgdown/1275610.html',
          'sgp_label':'https://www.sgpjbg.com/labels/yidukejiesgbaogao.html',
          'fh_tianfeng':'https://www.fhyanbao.com/rpview/1471805',
          'max_huachuang':'https://max.book118.com/html/2023/0720/8101062076005112.shtm',
          'max_zheshang':'https://max.book118.com/html/2025/0627/8134130125007103.shtm',
          'fx_xingzheng':'https://www.fxbaogao.com/detail/3892918',
          'sdy_fangzheng':'https://www.sdyanbao.com/detail/933412',
          'sina_fangzheng':'https://finance.sina.com.cn/stock/stockzmt/2023-08-19/doc-imzhtzvx4541365.shtml',
          'sohu_dongwu':'https://www.sohu.com/a/843240162_121123903'}
          summary={}
          for name,url in pages.items():
            try:
              r=s.get(url,timeout=10,allow_redirects=True); print('FETCH',name,r.status_code,len(r.content),r.url)
              (O/(name+'.html')).write_bytes(r.content)
              text=r.text; soup=BeautifulSoup(text,'lxml')
              urls=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data-src','data-url','data-file','data-download','content','value'):
                  v=tag.get(attr)
                  if isinstance(v,str) and v.strip():
                    u=urljoin(r.url,v.strip())
                    if any(k in u.lower() for k in ['.pdf','download','down','file','preview','report','attachment','oss','image']): urls.append({'tag':tag.name,'attr':attr,'url':u,'text':tag.get_text(' ',strip=True)[:150]})
              for m in re.finditer(r'https?://[^\"\'<>\s]+',text,re.I):
                u=m.group(0)
                if any(k in u.lower() for k in ['.pdf','download','down','file','preview','report','attachment','oss','image']): urls.append({'tag':'regex','attr':'','url':u,'text':''})
              ded=[]; seen=set()
              for x in urls:
                if x['url'] not in seen: seen.add(x['url']); ded.append(x)
              contexts=[]
              for pat in ['pdf','download','fileurl','downurl','preview','report-image','oss','112813','1275610','1471805','3892918','933412','8101062076005112','8134130125007103']:
                for m in list(re.finditer(pat,text,re.I))[:50]: contexts.append({'pat':pat,'ctx':text[max(0,m.start()-700):m.end()+1300]})
              rec={'status':r.status_code,'final':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '','urls':ded,'contexts':contexts}
              summary[name]=rec
              (O/(name+'.json')).write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
              print('PARSED',name,len(ded))
            except Exception as e:
              summary[name]={'error':repr(e)}; print('ERR',name,repr(e))
          (O/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/parse.py
          find out -maxdepth 1 -type f -printf '%f %s\n' | sort
      - name: Upload parsed sources
        uses: actions/upload-artifact@v4
        with:
          name: zjld-parsed-sources
          path: out
          retention-days: 1
