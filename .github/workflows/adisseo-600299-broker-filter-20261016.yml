name: Filter Adisseo 600299 broker report candidates 20261016

on:
  push:
    paths:
      - '.github/workflows/adisseo-600299-broker-filter-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query and filter research reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          from typing import Any
          import requests

          out=Path('adisseo_candidates'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=600299',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def parse_payload(text: str) -> Any:
              text=text.strip()
              try: return json.loads(text)
              except Exception: pass
              m=re.search(r'^[^(]*\((.*)\)\s*;?$', text, re.S)
              if m:
                  try: return json.loads(m.group(1))
                  except Exception: pass
              return None

          def extract_rows(payload: Any) -> list[dict[str, Any]]:
              rows=[]
              if isinstance(payload,list):
                  rows=[x for x in payload if isinstance(x,dict)]
              elif isinstance(payload,dict):
                  stack=[payload]
                  seen_ids=set()
                  while stack:
                      cur=stack.pop()
                      if id(cur) in seen_ids: continue
                      seen_ids.add(id(cur))
                      for key,val in cur.items():
                          if isinstance(val,list):
                              if val and all(isinstance(x,dict) for x in val):
                                  if any(any(k in x for k in ['infoCode','title','stockCode','orgSName']) for x in val):
                                      rows.extend(val)
                                  else:
                                      stack.extend(val)
                          elif isinstance(val,dict): stack.append(val)
              return rows

          endpoint='https://reportapi.eastmoney.com/report/list'
          all_rows=[]; seen=set(); logs=[]
          cases=[]
          for qtype in ['0','1','2']:
              cases.append((qtype,'2010-01-01','2026-10-16'))
              cases.append((qtype,'2019-01-01','2026-10-16'))
          for qtype,begin,end in cases:
              for page in range(1,61):
                  params={
                      'pageSize':'100','pageNo':str(page),'p':str(page),'pageNum':str(page),'pageNumber':str(page),
                      'qType':qtype,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*',
                      'fields':'','orgCode':'','author':'','stockCode':'600299','rcode':'',
                      'beginTime':begin,'endTime':end,
                  }
                  payload=None; last=None
                  for attempt in range(6):
                      try:
                          r=s.get(endpoint,params=params,timeout=(20,120))
                          last={'qType':qtype,'begin':begin,'page':page,'status':r.status_code,'url':r.url,'bytes':len(r.content),'prefix':r.text[:200]}
                          if r.status_code==200:
                              payload=parse_payload(r.text)
                              if payload is not None: break
                      except Exception as exc:
                          last={'qType':qtype,'begin':begin,'page':page,'error':repr(exc)}
                      time.sleep(1+attempt)
                  logs.append(last)
                  if payload is None: break
                  rows=extract_rows(payload)
                  if not rows: break
                  new_count=0
                  for row in rows:
                      code=str(row.get('infoCode') or row.get('info_code') or row.get('reportCode') or row.get('rcode') or '')
                      key=code or json.dumps(row,ensure_ascii=False,sort_keys=True)
                      if key in seen: continue
                      seen.add(key); all_rows.append(row); new_count+=1
                  if len(rows)<100 or new_count==0: break
                  time.sleep(0.05)

          def row_text(row: dict[str,Any]) -> str:
              return ' '.join(str(v) for v in row.values() if isinstance(v,(str,int,float)))
          targets=['安迪苏','蛋氨酸拐点','VA高景气','蛋氨酸销售增长强劲','运营效率提升显著','首次覆盖','双支柱','泉州固体蛋氨酸','蛋氨酸、特种产品齐头并进','地缘冲突引发蛋氨酸']
          filtered=[]
          for row in all_rows:
              text=row_text(row)
              if ('600299' in text or '安迪苏' in text) and any(t in text for t in targets):
                  filtered.append(row)

          # Keep all issuer rows separately so title matching can be reviewed.
          issuer_rows=[r for r in all_rows if ('600299' in row_text(r) or '安迪苏' in row_text(r))]
          (out/'filtered.json').write_text(json.dumps(filtered,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'issuer_rows.json').write_text(json.dumps(issuer_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'request_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'summary.txt').write_text(f'all_rows={len(all_rows)}\nissuer_rows={len(issuer_rows)}\nfiltered={len(filtered)}\n',encoding='utf-8')
          print((out/'summary.txt').read_text())
          print(json.dumps(filtered,ensure_ascii=False,indent=2)[:30000])
          PY

      - name: Upload candidate files
        uses: actions/upload-artifact@v4
        with:
          name: adisseo-600299-broker-candidates
          path: adisseo_candidates
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
