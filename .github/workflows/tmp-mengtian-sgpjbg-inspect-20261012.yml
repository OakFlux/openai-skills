name: Inspect SGPJBG Mengtian Reports

on:
  push:
    branches:
      - tmp-mengtian-603216-broker-reports-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect SGPJBG pages
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests,pathlib
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://www.sgpjbg.com/labels/yiliaoguanlifazhanjieduan.html',
            'https://www.sgpjbg.com/labels/aifazhanjieduan.html',
            'https://www.sgpjbg.com/labels/mumenxingye.html',
            'https://www.sgpjbg.com/labels/mumenchanye.html',
            'https://www.sgpjbg.com/zhuanti/mengjinyuanhuangbaogao.html',
          ]
          records=[]
          targets=('梦天家居','从木门到全屋木作','木门行业领军企业','品类矩阵持续完善')
          for u in urls:
            try:
              r=s.get(u,timeout=45); r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'; html=r.text
              print('\nPAGE',u,r.status_code,len(r.content),r.encoding)
              soup=BeautifulSoup(html,'html.parser')
              for a in soup.find_all('a',href=True):
                txt=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(u,a['href'])
                if any(t in txt for t in targets) or any(t in href for t in targets):
                  rec={'source':u,'text':txt,'href':href,'attrs':dict(a.attrs)}; records.append(rec); print('MATCH',json.dumps(rec,ensure_ascii=False))
              for line in html.splitlines():
                if any(t in line for t in targets): print('LINE',line[:3000])
            except Exception as e: print('ERR',u,repr(e))
          # inspect all unique candidate pages
          cand=[]
          for rec in records:
            h=rec['href']
            if h not in cand: cand.append(h)
          details=[]
          for u in cand:
            try:
              r=s.get(u,timeout=45); r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'; html=r.text
              soup=BeautifulSoup(html,'html.parser')
              d={'url':u,'status':r.status_code,'len':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'all_urls':[], 'interesting_lines':[]}
              allurls=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data','data-src','data-original','file','url'):
                  v=tag.get(attr)
                  if isinstance(v,str): allurls.append(urljoin(u,v))
              allurls += re.findall(r'https?://[^\"\'<>\s]+',html)
              d['all_urls']=sorted(set(x for x in allurls if any(k in x.lower() for k in ('pdf','download','down','attach','upload','file','image','img','baogao','bgdown'))))[:1000]
              d['interesting_lines']=[ln.strip()[:3000] for ln in html.splitlines() if any(k in ln.lower() for k in ('pdf','download','bgdown','attach','swiper','pageimg','viewimg','imgurl','fileurl','reporturl'))][:200]
              details.append(d)
              print('\nDETAIL',json.dumps(d,ensure_ascii=False)[:30000])
            except Exception as e: print('DETAILERR',u,repr(e))
          pathlib.Path('inspect-output').mkdir(exist_ok=True)
          pathlib.Path('inspect-output/records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('inspect-output/details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Mengtian-SGPJBG-Inspection
          path: inspect-output/*
          retention-days: 3
