name: Inspect Hongfucheng report download links

on:
  push:
    branches: [tmp-hongfucheng-broker-reports-20261028]
    paths: ['.github/workflows/tmp-hongfucheng-report-link-discovery-20261028.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect report pages and candidate PDF URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, requests
          from urllib.parse import urljoin
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/8/rptid/846066662705/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/842451772007/index.phtml',
            'https://www.vzkoo.com/document/1202198429850001d848ae44166e.html',
            'https://m.vzkoo.com/document/11640589727900012c76cc9443ec.html',
            'https://max.book118.com/html/2026/0916/8143077010010127.shtm',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          pdf_re=re.compile(r'''(?:https?:)?//[^\s"'<>\\]+?\.pdf(?:\?[^\s"'<>\\]*)?''',re.I)
          for url in urls:
            print('\n=== PAGE',url,'===')
            try:
              r=s.get(url,timeout=(25,180),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content))
              text=r.content.decode(r.encoding or 'utf-8',errors='replace')
              if text.count('\ufffd')>100:
                text=r.content.decode('gb18030',errors='replace')
              found=[]
              for m in pdf_re.finditer(text):
                token=html.unescape(m.group(0))
                if token.startswith('//'): token='https:'+token
                found.append(token)
              for m in re.finditer(r'''(?:href|src|url|file|downloadUrl|pdfUrl)["'\s:=]+(["']?)([^"'\s<>]+)\1''',text,re.I):
                token=html.unescape(m.group(2))
                if any(k in token.lower() for k in ('.pdf','download','attachment','file')):
                  found.append(urljoin(r.url,token))
              seen=set()
              for token in found:
                if token not in seen:
                  seen.add(token); print('CANDIDATE',token[:1200])
              for key in ('pdf','download','attachment','source','report'):
                pos=text.lower().find(key)
                if pos>=0:
                  print('FRAGMENT',key,text[max(0,pos-300):pos+1200].replace('\n',' ')[:1500])
            except Exception as exc:
              print('ERROR',repr(exc))
          PY
