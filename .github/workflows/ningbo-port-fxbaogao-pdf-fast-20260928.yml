name: Fast direct PDF check for Ningbo Port 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-pdf-fast-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check direct public PDF paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path
          out=Path('fast_out'); out.mkdir()
          urls=[]
          for prefix in ('report','report-cn','report-en'):
            for date in ('2019/08/31','2019/09/07'):
              urls.append(f'https://public.fxbaogao.com/{prefix}/{date}/1422001.pdf')
          rec=[]
          for i,u in enumerate(urls,1):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/view?id=1422001','Accept':'application/pdf,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=15) as r:
                data=r.read()
                info={'url':u,'status':r.status,'final_url':r.geturl(),'bytes':len(data),'content_type':r.headers.get('content-type'),'prefix':data[:8].hex()}
                print(json.dumps(info,ensure_ascii=False),flush=True)
                rec.append(info)
                if data.startswith(b'%PDF-') and len(data)>50000:
                  (out/f'found_{i:02d}_1422001.pdf').write_bytes(data)
            except Exception as e:
              info={'url':u,'error':repr(e)}
              print(json.dumps(info,ensure_ascii=False),flush=True)
              rec.append(info)
          (out/'records.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-fxbaogao-pdf-fast
          path: fast_out
          retention-days: 7
          if-no-files-found: error
