name: Temporary Kaisheng FXBaogao PDF viewer chunk

on:
  push:
    branches:
      - tmp-kaisheng-fxjs-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch PDF viewer chunk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' 'https://www.fxbaogao.com/_fxbg/2609031714/js/40.11e3efe83f5c0ba9ed08.chunk.js' -o output/pdf-viewer-chunk.js
          wc -c output/pdf-viewer-chunk.js
      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-fxbaogao-pdf-viewer-chunk
          path: output/*
          retention-days: 1
          if-no-files-found: error
