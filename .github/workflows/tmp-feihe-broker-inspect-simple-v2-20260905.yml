name: Temporary China Feihe broker report page inspection v2

on:
  push:
    branches:
      - tmp-china-feihe-broker-reports-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public pages
        run: |
          python -m pip install requests beautifulsoup4
          cat > /tmp/crawl_report_pages.py <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          targets = [
            'https://www.vzkoo.com/read/2025052158605bc9835d09ab12231ec5.html',
            'https://www.vzkoo.com/document/20250520e932068b8353e855f6b42f49.html?from=report',
            'https://www.vzkoo.com/read/202503171e873ada0142abe6d7c0d7c3.html',
            'https://www.fxbaogao.com/detail/4846989',
            'https://www.sgpjbg.com/baogao/61545.html'
          ]
          out = Path('inspection_v2')
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          records = []
          for idx, url in enumerate(targets, 1):
            try:
              response = session.get(url, timeout=60, allow_redirects=True)
              text = response.text
              (out / f'page_{idx}.html').write_text(text, encoding='utf-8')
              soup = BeautifulSoup(text, 'html.parser')
              links = []
              for tag in soup.find_all(['a','script','iframe','embed','source']):
                for attr in ('href','src','data-src','data-url','data-file'):
                  value = tag.get(attr)
                  if value:
                    links.append(urljoin(response.url, value))
              strings = re.findall(r'https?://[^"\'<>\\s]+', text)
              candidates = sorted(set(x.rstrip('),;]') for x in links + strings if any(k in x.lower() for k in ['.pdf','download','document','file','cdn','report'])))
              record = {
                'requested_url': url,
                'final_url': response.url,
                'status': response.status_code,
                'content_type': response.headers.get('content-type'),
                'title': soup.title.get_text(' ', strip=True) if soup.title else '',
                'content_length': len(response.content),
                'candidates': candidates
              }
              records.append(record)
              print('\nPAGE', idx, record['status'], record['title'], record['final_url'])
              for candidate in candidates:
                print('CANDIDATE', candidate)
            except Exception as exc:
              records.append({'requested_url': url, 'error': repr(exc)})
              print('ERROR', url, repr(exc))
          (out / 'inspection.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python /tmp/crawl_report_pages.py

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: feihe-broker-page-inspection-v2
          path: inspection_v2
          retention-days: 1
