name: Probe Zhaojin report pages

on:
  push:
    branches:
      - tmp-zhaojin-page-probe-20260907

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow
      - name: Probe candidate reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import io, json
          from pathlib import Path
          import requests
          from PIL import Image
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          candidates = [
              ('2025-08-04 中邮证券', 'https://oss.sdyanbao.com/page/2025/8/4/1218250', 29),
              ('2025-07-14 华泰证券', 'https://oss.sdyanbao.com/page/2025/7/14/1212889', 28),
              ('2024-07-02 第一上海', 'https://oss.sdyanbao.com/page/2024/7/2/1030510', 15),
              ('2023-11-17 广发证券', 'https://oss.sdyanbao.com/page/2023/11/17/891576', 28),
              ('2023-04-01 民生证券', 'https://oss.sdyanbao.com/page/2023/4/1/470740', 13),
              ('2023-03-26 兴业证券', 'https://oss.sdyanbao.com/page/2023/3/26/461536', 6),
          ]

          retry = Retry(total=4, connect=4, read=4, status=4, backoff_factor=0.8,
                        status_forcelist=[429,500,502,503,504], allowed_methods=frozenset(['GET']))
          s = requests.Session()
          s.mount('https://', HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})

          results=[]
          for label, base, expected in candidates:
              pages=[]
              for i in range(expected+2):
                  url=f'{base}/{i}.png'
                  r=s.get(url, headers={'Referer':base,'Accept':'image/png,image/*,*/*;q=0.8'}, timeout=(20,120))
                  rec={'index':i,'status':r.status_code,'bytes':len(r.content)}
                  if r.status_code==200:
                      try:
                          with Image.open(io.BytesIO(r.content)) as im:
                              rec['size']=list(im.size); rec['format']=im.format
                      except Exception as exc:
                          rec['image_error']=repr(exc)
                  pages.append(rec)
                  if r.status_code==404:
                      break
              contiguous=0
              for rec in pages:
                  if rec['index']==contiguous and rec['status']==200 and 'image_error' not in rec:
                      contiguous += 1
                  else:
                      break
              out={'label':label,'base':base,'expected_pages':expected,'contiguous_available':contiguous,'complete':contiguous>=expected,'pages':pages}
              results.append(out)
              print('PROBE_RESULT', json.dumps({k:out[k] for k in ['label','expected_pages','contiguous_available','complete']}, ensure_ascii=False), flush=True)

          Path('output/result.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-page-probe
          path: output/result.json
          retention-days: 1
          if-no-files-found: error
