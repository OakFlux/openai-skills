name: Package selected Kent 301591 research reports 20261020

on:
  push:
    branches:
      - tmp/kent-301591-selected-reports-20261020-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF and CJK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml weasyprint

      - name: Download create validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          CODE = "301591"
          SHORT = "肯特股份"
          FULL = "南京肯特复合材料股份有限公司"
          PREPARED = "2026-10-20"
          PACKAGE = "肯特股份_301591_券商研究报告_2份"
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36"
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": UA,
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def validate_and_preview(path: Path, min_pages: int, identity_tokens: list[str], period_tokens: list[str]) -> tuple[int, str]:
              if path.read_bytes()[:5] != b"%PDF-":
                  raise RuntimeError(f"Invalid PDF header: {path.name}")
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < min_pages:
                  raise RuntimeError(f"Too few pages for {path.name}: {pages} < {min_pages}")
              text = ""
              for page in reader.pages[:min(35, pages)]:
                  try:
                      text += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              if not any(token in text for token in identity_tokens):
                  raise RuntimeError(f"Issuer identity check failed: {path.name}")
              if period_tokens and not all(token in text for token in period_tokens):
                  raise RuntimeError(f"Document metadata check failed for {path.name}: {period_tokens}")
              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW / path.stem
              subprocess.run(
                  [
                      "pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140",
                      "-singlefile", str(path), str(prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              png = Path(str(prefix) + ".png")
              if not png.exists() or png.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview render failed: {path.name}")
              return pages, text

          def download_original_pdf(info_code: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf",
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  "User-Agent": UA,
                                  "Referer": f"https://data.eastmoney.com/report/info/{info_code}.html",
                                  "Accept": "application/pdf,*/*;q=0.8",
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          last = {
                              "url": url,
                              "status": response.status_code,
                              "content_type": response.headers.get("content-type", ""),
                              "bytes": len(response.content),
                              "final_url": response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b"%PDF-" and len(response.content) > 50_000:
                              return response.content, url, last
                      except Exception as exc:
                          last = {"url": url, "error": repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed for {info_code}: {last}")

          records: list[dict[str, Any]] = []

          # 1) Publicly downloadable original PDF: HuaJin Securities new-stock coverage report.
          huajin_info_code = "AP202402011620033334"
          huajin_data, huajin_pdf_url, huajin_download_meta = download_original_pdf(huajin_info_code)
          huajin_path = ROOT / "01_20240201_华金证券_新股覆盖研究_肯特股份_原始PDF.pdf"
          huajin_path.write_bytes(huajin_data)
          huajin_pages, _ = validate_and_preview(
              huajin_path,
              min_pages=10,
              identity_tokens=[SHORT, FULL, CODE, "南京肯特"],
              period_tokens=["肯特股份"],
          )
          records.append({
              "filename": huajin_path.name,
              "document_form": "券商原始PDF",
              "broker": "华金证券",
              "authors": "李蕙",
              "date": "2024-02-01",
              "title": "新股覆盖研究：肯特股份",
              "actual_pages": huajin_pages,
              "bytes": huajin_path.stat().st_size,
              "sha256": sha256_file(huajin_path),
              "source_page": f"https://data.eastmoney.com/report/info/{huajin_info_code}.html",
              "pdf_url": huajin_pdf_url,
              "download_meta": huajin_download_meta,
              "note": "公开聚合渠道提供的券商原始PDF。",
          })

          # 2) The ZheShang report is publicly readable in full text, but its original PDF is not directly downloadable.
          #    Create a transparent print-layout copy of the publicly displayed full text; do not label it as an original PDF.
          source_url = "https://www.9fzt.com/detail/sz_301591_10_754040529033.html"
          source_response = session.get(source_url, timeout=(30, 180), allow_redirects=True)
          source_response.raise_for_status()
          source_response.encoding = source_response.apparent_encoding or "utf-8"
          soup = BeautifulSoup(source_response.text, "lxml")
          title_node = soup.select_one(".title-header")
          body_node = soup.select_one(".detail-article-content")
          broker_node = soup.select_one(".date-type")
          date_node = soup.select_one(".date-time")
          if title_node is None or body_node is None:
              raise RuntimeError("Public full-text page structure changed; title/body not found")

          title = re.sub(r"\s+", " ", title_node.get_text(" ", strip=True))
          broker = re.sub(r"\s+", " ", broker_node.get_text(" ", strip=True)) if broker_node else "浙商证券股份有限公司"
          report_date = re.sub(r"\s+", " ", date_node.get_text(" ", strip=True)) if date_node else "2023-11-23"
          for tag in body_node.find_all(["script", "style", "iframe", "form", "button"]):
              tag.decompose()
          body_html = str(body_node)
          body_text = re.sub(r"\s+", " ", body_node.get_text(" ", strip=True))
          if "肯特股份" not in title + body_text or len(body_text) < 1_500:
              raise RuntimeError("Public full-text page did not contain sufficient Kent report content")

          clean_html = f"""<!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <title>{html.escape(title)}</title>
            <style>
              @page {{
                size: A4;
                margin: 18mm 17mm 20mm 17mm;
                @bottom-center {{
                  content: "公开网页全文整理版 - 第 " counter(page) " 页 / " counter(pages) " 页";
                  font-size: 8.5pt;
                  color: #666;
                }}
              }}
              body {{
                font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif;
                font-size: 10.5pt;
                line-height: 1.75;
                color: #222;
                word-break: break-word;
              }}
              h1 {{ font-size: 20pt; line-height: 1.35; margin: 0 0 12pt 0; }}
              .meta {{ font-size: 10pt; color: #444; border-bottom: 1px solid #bbb; padding-bottom: 10pt; margin-bottom: 14pt; }}
              .notice {{
                border: 1.5px solid #a33;
                background: #fff7f3;
                padding: 10pt 12pt;
                margin: 8pt 0 16pt 0;
                font-size: 10pt;
                line-height: 1.55;
              }}
              .source {{ font-size: 8.5pt; color: #666; margin-top: 6pt; word-break: break-all; }}
              .detail-article-content p {{ margin: 0 0 9pt 0; text-align: justify; }}
              .detail-article-content h2, .detail-article-content h3 {{ margin-top: 14pt; }}
              a {{ color: #333; text-decoration: none; }}
            </style>
          </head>
          <body>
            <h1>{html.escape(title)}</h1>
            <div class="meta">
              机构：{html.escape(broker)}<br>
              研究员：黄宇宸、黄海童、芦家宁<br>
              发布日期：{html.escape(report_date)}
            </div>
            <div class="notice">
              <strong>文件性质说明：</strong>本文件依据公开网页所展示的报告全文整理并打印为PDF，
              <strong>不是浙商证券发布的原始PDF</strong>。原始报告的封面、图表、排版和页码可能未被公开网页保留。
              本整理版用于便于离线阅读，报告著作权归原券商及作者所有。
              <div class="source">公开全文来源：{html.escape(source_url)}</div>
            </div>
            {body_html}
          </body>
          </html>"""

          zheshang_path = ROOT / "02_20231123_浙商证券_新股报告_高性能工程塑料零部件领先企业_公开网页全文整理版_非原始PDF.pdf"
          HTML(string=clean_html, base_url=source_url).write_pdf(str(zheshang_path))
          zheshang_pages, _ = validate_and_preview(
              zheshang_path,
              min_pages=3,
              identity_tokens=[SHORT, FULL, CODE, "南京肯特", "肯特复合材料"],
              period_tokens=["浙商证券", "2023-11-23"],
          )
          records.append({
              "filename": zheshang_path.name,
              "document_form": "公开网页全文整理版（非券商原始PDF）",
              "broker": "浙商证券",
              "authors": "黄宇宸、黄海童、芦家宁",
              "date": "2023-11-23",
              "title": "肯特股份新股报告：高性能工程塑料零部件领先企业",
              "actual_pages": zheshang_pages,
              "bytes": zheshang_path.stat().st_size,
              "sha256": sha256_file(zheshang_path),
              "source_page": source_url,
              "original_report_metadata_page": "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/754040529033/index.phtml",
              "note": "公开网页全文转为便于离线阅读的PDF；不是券商原始PDF，可能不含原始图表与版式。",
          })

          readme = [
              f"肯特股份（{CODE}.SZ）券商研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本资料包共收录2份公司研究资料。由于肯特股份上市时间较短，公开渠道可直接下载的完整券商原始PDF较少。",
              "为避免将网页内容冒充原始研报，文件性质已在文件名、PDF首页、清单和manifest中明确区分。",
              "",
          ]
          for index, item in enumerate(records, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；研究员：{item['authors']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['source_page']}",
                  f"   SHA-256：{item['sha256']}",
                  f"   说明：{item['note']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、报告标题与日期、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          manifest = {
              "company": SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(records),
              "files": records,
          }
          (ROOT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  "文件名", "文件性质", "券商", "研究员", "发布日期", "标题", "页数", "字节数",
                  "SHA-256", "来源页面", "说明",
              ])
              for item in records:
                  writer.writerow([
                      item["filename"], item["document_form"], item["broker"], item["authors"], item["date"],
                      item["title"], item["actual_pages"], item["bytes"], item["sha256"], item["source_page"], item["note"],
                  ])
          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['filename']}" for item in records) + "\n",
              encoding="utf-8",
          )

          zip_path = Path(PACKAGE + ".zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": sha256_file(zip_path),
              "report_count": len(records),
              "files": [
                  {
                      "name": item["filename"],
                      "document_form": item["document_form"],
                      "broker": item["broker"],
                      "date": item["date"],
                      "pages": item["actual_pages"],
                      "bytes": item["bytes"],
                      "sha256": item["sha256"],
                      "title": item["title"],
                  }
                  for item in records
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: kent-301591-selected-research-reports-20261020
          path: 肯特股份_301591_券商研究报告_2份.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
