name: inspect-fengbei-603334-10jqka-js

on:
  push:
    branches:
      - tmp/fengbei-603334-broker-inspect-20261106-v1

permissions:
  contents: read

jobs:
  inspect-js:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch scripts and probe public endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://news.10jqka.com.cn/field/sr/20260824/59403093.shtml'})
          urls=[
            'https://s.thsi.cn/js/report/ybcpatch.js',
            'http://s.thsi.cn/js/report/ybcpatch.js',
            'https://s.thsi.cn/js/report/client/topShare.js',
            'http://s.thsi.cn/js/report/client/topShare.js',
            'https://s.thsi.cn/js/report/client/reward.js',
            'http://s.thsi.cn/js/report/client/reward.js',
            'https://news.10jqka.com.cn/field/sr/20260824/59403093.shtml',
            'http://news.10jqka.com.cn/field/sr/19700101/59403093.shtml',
          ]
          all_text=''
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=(30,180),allow_redirects=True)
              print('FETCH',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              (out/f'{i:02d}.bin').write_bytes(r.content)
              text=''
              for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030']:
                if not enc: continue
                try:
                  t=r.content.decode(enc,errors='ignore')
                  if len(t)>len(text): text=t
                except Exception: pass
              (out/f'{i:02d}.txt').write_text(text,encoding='utf-8')
              all_text+='\n/*SOURCE '+u+'*/\n'+text
            except Exception as e:
              print('ERROR',i,u,repr(e))
          (out/'all.txt').write_text(all_text,encoding='utf-8')
          patterns=[
            r'https?://[^\"\'<>\s]+',
            r'//[^\"\'<>\s]+',
            r'[A-Za-z0-9_./?=&%+-]+(?:pdf|report|research|yanbao|attach|download)[A-Za-z0-9_./?=&%+-]*',
          ]
          hits=[]
          for pat in patterns:
            for m in re.findall(pat,all_text,flags=re.I):
              if any(k in m.lower() for k in ['pdf','report','research','yanbao','attach','download','59403093','pdfurl']): hits.append(m)
          hits=list(dict.fromkeys(hits))
          (out/'candidate_strings.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          for line in all_text.splitlines():
            low=line.lower()
            if any(k in low for k in ['pdfurl','59403093','原文','report','attach','download','iframe','yboriginal']):
              print('LINE',line[:2000])
          print('CANDIDATES',json.dumps(hits[:300],ensure_ascii=False,indent=2))

          # Probe common public endpoints inferred from old 10jqka report pages.
          endpoints=[
            'https://news.10jqka.com.cn/field/sr/pdf/59403093.pdf',
            'https://news.10jqka.com.cn/field/sr/attachment/59403093.pdf',
            'https://news.10jqka.com.cn/field/sr/download/59403093.pdf',
            'https://news.10jqka.com.cn/field/sr/59403093.pdf',
            'https://news.10jqka.com.cn/field/sr/20260824/59403093.pdf',
            'https://news.10jqka.com.cn/field/sr/20260824/59403093.PDF',
            'https://news.10jqka.com.cn/field/sr/20260824/59403093_1.pdf',
            'https://news.10jqka.com.cn/field/sr/20260824/59403093_attach.pdf',
            'https://news.10jqka.com.cn/field/sr/20260824/59403093_download.pdf',
            'https://news.10jqka.com.cn/field/sr/19700101/59403093.pdf',
          ]
          probes=[]
          for u in endpoints:
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True,headers={'Accept':'application/pdf,*/*;q=0.8','Referer':'https://news.10jqka.com.cn/field/sr/20260824/59403093.shtml'})
              rec={'url':u,'status':r.status_code,'bytes':len(r.content),'final':r.url,'type':r.headers.get('content-type'),'prefix':r.content[:10].hex()}
              probes.append(rec); print('PROBE',json.dumps(rec,ensure_ascii=False))
              if r.status_code==200 and r.content.startswith(b'%PDF-'):
                (out/'found.pdf').write_bytes(r.content)
            except Exception as e:
              probes.append({'url':u,'error':repr(e)})
          (out/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: fengbei-603334-10jqka-js-inspection
          path: out
          if-no-files-found: error
          retention-days: 7
