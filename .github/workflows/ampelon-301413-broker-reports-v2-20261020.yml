name: Package three Ampelon deep broker reports

on:
  push:
    paths:
      - '.github/workflows/ampelon-301413-broker-reports-v2-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validators
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, verify and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import fitz, requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          company='安培龙'; code='301413'; cutoff='2026-10-20'; cut='20261020'
          root_name=f'{company}_{code}_券商深度报告_3份_截至{cut}'
          root=Path('work')/root_name; pdf_dir=root/'券商深度报告'; previews=root/'首页预览'; dist=Path('dist')
          for d in (pdf_dir,previews,dist): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {'broker':'山西证券','date':'2025-07-30','title':'温度、压力及氧传感器夯实基础，力传感器开辟机器人应用新场景','authors':'叶中正、冯瑞、谷茜、刘斌','rating':'增持','info':'AP202507301718308817','expected_pages':31},
            {'broker':'东吴证券','date':'2025-03-05','title':'国产传感器龙头，平台化技术构筑新增长极','authors':'周尔双、钱尧天','rating':'增持','info':'AP202503051644069311','expected_pages':19},
            {'broker':'华安证券','date':'2023-12-27','title':'陶瓷传感器隐形冠军，布局MEMS传感器进军智能制造','authors':'张帆','rating':'买入','info':'AP202312261614922887','expected_pages':34},
          ]

          session=requests.Session()
          retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=1.0,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          session.mount('https://',HTTPAdapter(max_retries=retry))
          session.headers.update({'User-Agent':'Mozilla/5.0 AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'})

          records=[]
          for item in reports:
            url=f"https://pdf.dfcfw.com/pdf/H3_{item['info']}_1.pdf"
            filename=f"{item['date']}_{item['broker']}_{company}_{item['title']}.pdf"
            dest=pdf_dir/filename
            r=session.get(url,timeout=180)
            print('DOWNLOAD',r.status_code,len(r.content),url,r.headers.get('content-type'))
            r.raise_for_status()
            if len(r.content)<100000 or not r.content.startswith(b'%PDF'):
              raise RuntimeError(f"无效PDF: {url}, size={len(r.content)}, head={r.content[:20]!r}")
            dest.write_bytes(r.content)

            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages!=item['expected_pages']:
              raise RuntimeError(f"页数不符: {dest.name}: {pages} != {item['expected_pages']}")
            doc=fitz.open(dest)
            if doc.page_count!=pages:
              raise RuntimeError(f"双解析器页数不一致: {dest.name}: {pages}/{doc.page_count}")
            first=doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
            last=doc.load_page(doc.page_count-1).get_pixmap(matrix=fitz.Matrix(.8,.8),alpha=False)
            if min(first.width,first.height,last.width,last.height)<100:
              raise RuntimeError(f"页面渲染异常: {dest.name}")
            first.save(previews/f'{dest.stem}.png')
            probe=''.join(doc.load_page(i).get_text('text') for i in range(min(3,doc.page_count)))
            doc.close()
            if company not in probe and code not in probe:
              raise RuntimeError(f"首页文本未识别到公司名或代码: {dest.name}")

            rec={**item,'source_url':url,'detail_url':f"https://data.eastmoney.com/report/zw_stock.jshtml?infocode={item['info']}",'relative_path':str(dest.relative_to(root)).replace(os.sep,'/'),'file_size_bytes':dest.stat().st_size,'page_count':pages,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'pdf_header_valid':True,'first_page_rendered':True,'last_page_rendered':True}
            records.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False))

          manifest={'company':company,'stock_code':code,'cutoff_date':cutoff,'document_count':3,'selection_policy':'选择公开可下载的长篇公司深度或首次覆盖报告，排除3-7页普通业绩点评。','documents':records,'generated_at_utc':datetime.now(timezone.utc).isoformat()}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records)+'\n',encoding='utf-8')
          lines=[f'# {company}（{code}）券商深度报告包','',f'- 截止日期：{cutoff}','- 共3份，分别为34页、31页和19页。','- 来源：东方财富公开券商研报PDF接口。','- 校验：PDF文件头、双解析器页数、首末页渲染、SHA-256、ZIP CRC。','- 版权归原券商及作者所有，仅供个人研究参考，不构成投资建议。','','## 文件清单','']
          for i,r in enumerate(records,1):
            lines += [f"{i}. `{r['relative_path']}`",f"   - 券商：{r['broker']}",f"   - 日期：{r['date']}",f"   - 标题：{r['title']}",f"   - 作者：{r['authors']}；评级：{r['rating']}",f"   - 页数：{r['page_count']}；大小：{r['file_size_bytes']:,} 字节",f"   - 来源：{r['source_url']}",f"   - SHA-256：`{r['sha256']}`"]
          (root/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          final_cn=dist/f'{root_name}.zip'; final_ascii=dist/f'ampelon_301413_broker_deep_reports_3_{cut}.zip'
          with zipfile.ZipFile(final_cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,str(p.relative_to(root.parent)).replace(os.sep,'/'))
          shutil.copy2(final_cn,final_ascii)
          for p in (final_cn,final_ascii):
            with zipfile.ZipFile(p) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3: raise RuntimeError(f'ZIP校验失败: {p}, bad={bad}, pdfs={len(pdfs)}')
            print('ZIP_VERIFIED',p,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          print('FINAL_JSON',json.dumps({'document_count':3,'reports':[{k:r[k] for k in ('broker','date','title','page_count')} for r in records],'chinese_zip':str(final_cn),'size':final_cn.stat().st_size,'sha256':hashlib.sha256(final_cn.read_bytes()).hexdigest()},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ampelon-301413-broker-deep-reports-v2-20261020
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
