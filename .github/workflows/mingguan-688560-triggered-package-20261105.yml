name: Triggered Mingguan filing package

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/mingguan-688560-20261105.txt'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Download, verify and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, os, re, shutil, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import requests, pymupdf
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY='明冠新材'; FULL='明冠新材料股份有限公司'; CODE='688560'
          CUTOFF='2026-11-05'; COMPACT='20261105'
          ROOT_NAME=f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{COMPACT}'
          ROOT=Path('work')/ROOT_NAME; PDF_DIR=ROOT/'报告PDF'; PREVIEW=ROOT/'首页与末页预览'; DIST=Path('dist')
          for d in (PDF_DIR,PREVIEW,DIST): d.mkdir(parents=True,exist_ok=True)

          docs=[
            dict(kind='招股说明书',period='2020-12-18',title='首次公开发行股票并在科创板上市招股说明书',label='首次公开发行股票并在科创板上市招股说明书_最终正式版',source='新浪财经公开披露镜像（对应上交所最终正式版）',source_page='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=6792775&stockid=688560',urls=['http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2020/2020-12/2020-12-18/6792775.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2020/2020-12/2020-12-18/6792775.PDF'],minp=250,tokens=['首次公开发行股票','招股说明书']),
            dict(kind='年度报告',year=2020,period='2020年',title='2020年年度报告',label='2020年年度报告',source='新浪财经/东方财富公开披露镜像',source_page='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7096917&stockid=688560',urls=['http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-04/2021-04-23/7096917.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-04/2021-04-23/7096917.PDF','https://pdf.dfcfw.com/pdf/H2_AN202104221487076841_1.pdf'],minp=80,tokens=['2020年年度报告']),
            dict(kind='年度报告',year=2021,period='2021年',title='2021年年度报告',label='2021年年度报告',source='巨潮资讯网',source_page='https://static.cninfo.com.cn/finalpage/2022-04-27/1213148529.PDF',urls=['https://static.cninfo.com.cn/finalpage/2022-04-27/1213148529.PDF'],minp=80,tokens=['2021年年度报告']),
            dict(kind='年度报告',year=2022,period='2022年',title='2022年年度报告（更正后）',label='2022年年度报告_更正后',source='巨潮资讯网',source_page='https://static.cninfo.com.cn/finalpage/2023-05-31/1216945287.PDF',urls=['https://static.cninfo.com.cn/finalpage/2023-05-31/1216945287.PDF'],minp=80,tokens=['2022年年度报告'],corrected=True),
            dict(kind='年度报告',year=2023,period='2023年',title='2023年年度报告（更正后）',label='2023年年度报告_更正后',source='巨潮资讯网',source_page='https://static.cninfo.com.cn/finalpage/2024-08-27/1220987129.PDF',urls=['https://static.cninfo.com.cn/finalpage/2024-08-27/1220987129.PDF'],minp=80,tokens=['2023年年度报告'],corrected=True),
            dict(kind='年度报告',year=2024,period='2024年',title='2024年年度报告',label='2024年年度报告',source='巨潮资讯网',source_page='https://static.cninfo.com.cn/finalpage/2025-04-29/1223391991.PDF',urls=['https://static.cninfo.com.cn/finalpage/2025-04-29/1223391991.PDF'],minp=80,tokens=['2024年年度报告']),
            dict(kind='年度报告',year=2025,period='2025年',title='2025年年度报告',label='2025年年度报告',source='巨潮资讯网',source_page='https://static.cninfo.com.cn/finalpage/2026-04-28/1225220129.PDF',urls=['https://static.cninfo.com.cn/finalpage/2026-04-28/1225220129.PDF'],minp=80,tokens=['2025年年度报告']),
            dict(kind='第三季度报告',period='2026年第三季度',title='2026年第三季度报告',label='2026年第三季度报告',source='上海证券交易所；新浪财经公开披露镜像备用',source_page='https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=688560',urls=['https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-29/688560_20261029_97XF.pdf','http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-29/688560_20261029_97XF.pdf','http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-29/12671452.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-29/12671452.PDF'],minp=5,tokens=['2026年第三季度报告',CODE]),
          ]

          s=requests.Session(); retry=Retry(total=7,connect=7,read=7,status=7,backoff_factor=.8,status_forcelist=(403,408,425,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          a=HTTPAdapter(max_retries=retry); s.mount('https://',a); s.mount('http://',a)
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9','Accept':'application/pdf,*/*;q=0.8'})

          def digest(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
            return h.hexdigest()

          def get_pdf(d):
            errs=[]
            for u in d['urls']:
              try:
                r=s.get(u,headers={'Referer':d['source_page']},timeout=300,allow_redirects=True)
                print('DOWNLOAD',d['period'],r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                if r.status_code==200 and r.content.startswith(b'%PDF') and len(r.content)>50000: return r.content,r.url,r.headers.get('content-type') or ''
                errs.append(f'{u}: {r.status_code}/{len(r.content)}')
              except Exception as e: errs.append(f'{u}: {e!r}')
            raise RuntimeError('下载失败 '+d['title']+' | '+' | '.join(errs))

          records=[]
          for i,d in enumerate(docs,1):
            data,url,ctype=get_pdf(d); reader=PdfReader(io.BytesIO(data),strict=False)
            if reader.is_encrypted:
              try: reader.decrypt('')
              except Exception: pass
            pages=len(reader.pages)
            if pages<d['minp']: raise RuntimeError(f'页数异常 {d["title"]}: {pages}')
            texts=[]
            for p in sorted(set(list(range(min(20,pages)))+[pages-1])):
              try: texts.append(reader.pages[p].extract_text() or '')
              except Exception as e: print('TEXT_WARNING',d['title'],p,repr(e),flush=True)
            sample=re.sub(r'\s+',' ','\n'.join(texts)).strip(); compact=re.sub(r'\s+','',sample)
            if FULL not in compact and COMPANY not in compact and CODE not in compact: raise RuntimeError('公司身份校验失败 '+d['title'])
            if not all(t in compact for t in d['tokens']): raise RuntimeError('报告身份校验失败 '+d['title'])
            fn=f'{i:02d}_{COMPANY}_{CODE}_{d["label"]}.pdf'; p=PDF_DIR/fn; p.write_bytes(data)
            doc=pymupdf.open(p)
            if doc.page_count!=pages: raise RuntimeError('双解析器页数不一致 '+fn)
            first=doc.load_page(0).get_pixmap(matrix=pymupdf.Matrix(1.5,1.5),alpha=False); last=doc.load_page(doc.page_count-1).get_pixmap(matrix=pymupdf.Matrix(1,1),alpha=False)
            first.save(PREVIEW/f'{p.stem}_首页.png'); last.save(PREVIEW/f'{p.stem}_末页.png'); doc.close()
            rec={k:v for k,v in d.items() if k not in ('urls','minp','tokens')}; rec.update(resolved_url=url,content_type=ctype,file_name=fn,page_count=pages,file_size_bytes=p.stat().st_size,sha256=digest(p),pdf_header_valid=True,company_and_report_identity_validated=True,dual_parser_page_count_validated=True,first_and_last_pages_rendered=True,text_sample=sample[:1000]); records.append(rec)
            print('VERIFIED',json.dumps(rec,ensure_ascii=False),flush=True)

          if len(records)!=8: raise RuntimeError(f'文件数异常 {len(records)}')
          years=[r.get('year') for r in records if r['kind']=='年度报告']
          if years!=[2020,2021,2022,2023,2024,2025]: raise RuntimeError(f'年报年份异常 {years}')
          manifest={'company_short_name':COMPANY,'company_full_name':FULL,'stock_code':CODE,'listing_date':'2020-12-24','cutoff_date':CUTOFF,'annual_report_scope':'2020-2025年度（上市以来全部年度报告）','prospectus':'2020-12-18最终正式发行版','latest_quarterly_report':'2026年第三季度报告（披露日期2026-10-29）','selection_policy':'年报采用完整全文；2022、2023年度采用后续更正后版本。','document_count':len(records),'total_pages':sum(r['page_count'] for r in records),'documents':records,'generated_at_utc':datetime.now(timezone.utc).isoformat()}
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=[f'# {COMPANY}（{CODE}）上市以来全部年报、招股说明书及最新季报','',f'- 截止日期：{CUTOFF}','- 上市日期：2020-12-24。','- 年度报告：2020—2025年度，共6份。','- 2022年、2023年年度报告采用公司后续披露的“更正后”完整版本。','- 招股说明书：2020-12-18最终正式发行版。','- 最新季报：2026年第三季度报告，披露日期为2026-10-29。','- 未收录摘要、单独审计报告、ESG报告、提示性公告及重复文件。','','## 文件清单','']
          for n,r in enumerate(records,1): lines += [f'{n}. `{r["file_name"]}`',f'   - 标题：{r["title"]}',f'   - 页数：{r["page_count"]}',f'   - 来源：{r["source"]}',f'   - 原始地址：{r["resolved_url"]}',f'   - SHA-256：`{r["sha256"]}`']
          (ROOT/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8'); (ROOT/'文件清单.txt').write_text('\n'.join(r['file_name'] for r in records)+'\n',encoding='utf-8'); (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  报告PDF/{r["file_name"]}\n' for r in records),encoding='utf-8')
          cn=DIST/f'{ROOT_NAME}.zip'; en=DIST/f'mingguan_new_material_688560_all_annual_reports_prospectus_latest_quarter_{COMPACT}.zip'
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,str(p.relative_to(ROOT.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for zp in (cn,en):
            with zipfile.ZipFile(zp) as z:
              bad=z.testzip(); pdfs=[x for x in z.namelist() if x.lower().endswith('.pdf')]
              if bad or len(pdfs)!=8: raise RuntimeError(f'ZIP校验失败 {bad} {len(pdfs)}')
            print('ZIP_VERIFIED',zp,zp.stat().st_size,digest(zp),flush=True)
          print('FINAL_SUMMARY',json.dumps({'chinese_zip':str(cn),'english_zip':str(en),'zip_size_bytes':cn.stat().st_size,'zip_sha256':digest(cn),'document_count':len(records),'total_pages':sum(r['page_count'] for r in records),'records':[{'file_name':r['file_name'],'title':r['title'],'page_count':r['page_count'],'sha256':r['sha256']} for r in records]},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mingguan-688560-triggered-package-20261105
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
