name: Build United Laboratories broker report public-preview PDFs 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-broker-reports-public-preview-final-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow img2pdf pypdf

      - name: Build report preview PDFs and ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, subprocess, time, zipfile
          from pathlib import Path
          import img2pdf, requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE='联邦制药_03933_券商深度报告_公开预览版_3份'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          preview_dir=root/'首页预览'; preview_dir.mkdir(exist_ok=True)
          work=Path('_work_pages'); work.mkdir(exist_ok=True)

          reports=[
            {
              'order':1,'broker':'东吴证券','title':'联邦制药（03933.HK）：创新突破，三靶点战略联姻诺和诺德',
              'date':'2025-07-12','full_pages':25,'public_pages':15,'rating':'买入','analysts':['朱国广','冉胜男'],
              'base':'https://oss.sdyanbao.com/page/2025/7/24/1215139','source':'https://www.sdyanbao.com/detail/902006',
              'filename':'01_东吴证券_联邦制药_创新突破三靶点战略联姻诺和诺德_2025-07-12_公开预览15页.pdf'
            },
            {
              'order':2,'broker':'招商证券','title':'联邦制药（03933.HK）：创新药初结硕果，后续管线丰富，主业拓增长新曲线',
              'date':'2025-09-16','full_pages':29,'public_pages':15,'rating':'强烈推荐','analysts':['梁广楷','许菲菲','侯彪'],
              'base':'https://oss.sdyanbao.com/page/2025/9/22/1248844','source':'https://www.sdyanbao.com/detail/920346',
              'filename':'02_招商证券_联邦制药_创新药初结硕果后续管线丰富主业拓增长新曲线_2025-09-16_公开预览15页.pdf'
            },
            {
              'order':3,'broker':'中泰证券','title':'联邦制药（3933.HK）：抗生素龙头跻身创新，GLP-1三靶携手MNC引领增长',
              'date':'2025-09-18','full_pages':36,'public_pages':15,'rating':'买入','analysts':['祝嘉琦'],
              'base':'https://oss.sdyanbao.com/page/2025/9/22/1248847','source':'https://www.sdyanbao.com/detail/920349',
              'filename':'03_中泰证券_联邦制药_抗生素龙头跻身创新_GLP-1三靶携手MNC引领增长_2025-09-18_公开预览15页.pdf'
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://www.sdyanbao.com/'})

          def fetch(url):
            last=None
            for n in range(5):
              try:
                r=s.get(url,timeout=(20,120),allow_redirects=True)
                last={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                if r.status_code==200 and len(r.content)>20000:
                  im=Image.open(io.BytesIO(r.content)); im.load()
                  if im.width>=700 and im.height>=900:return r.content,last
              except Exception as e:last={'error':repr(e)}
              time.sleep(1+n)
            raise RuntimeError(f'Unable to fetch {url}: {last}')

          manifest=[]; sums=[]
          for rep in reports:
            d=work/f"{rep['order']:02d}"; d.mkdir(parents=True,exist_ok=True)
            images=[]; page_meta=[]; seen=set()
            for idx in range(rep['public_pages']):
              url=f"{rep['base']}/{idx}.png"; raw,dl=fetch(url)
              im=Image.open(io.BytesIO(raw)).convert('RGB')
              out=d/f'{idx+1:03d}.jpg'
              im.save(out,'JPEG',quality=94,optimize=True,subsampling=0)
              h=hashlib.sha256(out.read_bytes()).hexdigest()
              if h in seen:raise RuntimeError(f'Duplicate page in {rep["broker"]}: {idx+1}')
              seen.add(h);images.append(str(out))
              page_meta.append({'page':idx+1,'source_url':url,'width':im.width,'height':im.height,'bytes':out.stat().st_size,'sha256':h,'download':dl})
            pdf=root/rep['filename']
            pdf.write_bytes(img2pdf.convert(images,rotation=img2pdf.Rotation.ifvalid))
            reader=PdfReader(str(pdf),strict=False); pages=len(reader.pages)
            if pages!=rep['public_pages']:raise RuntimeError(f'Page count mismatch: {pdf}')
            subprocess.run(['qpdf','--check',str(pdf)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            pref=preview_dir/pdf.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(pdf),str(pref)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prev=Path(str(pref)+'.png')
            if not prev.exists() or prev.stat().st_size<20000:raise RuntimeError(f'Render failed: {pdf}')
            data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest(); sums.append((sha,pdf.name))
            manifest.append({**rep,'actual_pdf_pages':pages,'pdf_file':pdf.name,'pdf_bytes':len(data),'pdf_sha256':sha,'preview_file':str(prev.relative_to(root)),'page_records':page_meta,'format_note':'Image-only PDF assembled from the platform public preview pages. It is not the broker-originated full searchable PDF.'})

          notes=[
            '联邦制药（03933.HK）券商深度报告资料包',
            '整理日期：2026-09-22','',
            '重要说明：本包收录的是研报平台无需登录即可访问的公开预览页，并合成为PDF。',
            '三份长报告的原始全文分别为25页、29页和36页；平台公开展示每份报告前15页，原始PDF下载需登录或授权。',
            '本次没有绕过登录或付费限制，因此文件名已明确标注“公开预览15页”，不得视为券商原始完整版。',
            'PDF为图像型文件，默认不含可检索文字层。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            notes += [f"{i}. {m['broker']}：《{m['title']}》",f"   日期：{m['date']}；评级：{m['rating']}；分析师：{'、'.join(m['analysts'])}",f"   原报告：{m['full_pages']}页；本包公开预览：{m['actual_pdf_pages']}页",f"   来源页：{m['source']}",f"   文件：{m['pdf_file']}",f"   SHA-256：{m['pdf_sha256']}",'']
          notes += ['核验：逐页图片可解码、图像尺寸、重复页哈希、PDF页数、qpdf结构、首页渲染、ZIP CRC。','报告观点和评级均对应发布日期，不构成当前投资建议。']
          (root/'00_文件清单与重要说明.txt').write_text('\n'.join(notes),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{h}  {n}\n' for h,n in sums),encoding='utf-8')

          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as f:
            for p in sorted(root.rglob('*')):
              if p.is_file():f.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(z) as f:
            bad=f.testzip()
            if bad:raise RuntimeError('ZIP CRC failure: '+bad)
            if len([n for n in f.namelist() if n.lower().endswith('.pdf')])!=3:raise RuntimeError('PDF count mismatch')
          print('FINAL_ZIP',z.name,z.stat().st_size,'SHA256',hashlib.sha256(z.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-broker-reports-public-preview-final
          path: 联邦制药_03933_券商深度报告_公开预览版_3份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
