name: Probe AUX Electric public report previews 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-fhyanbao-preview-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe public preview endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, requests, hashlib

          out=Path('probe'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www.fhyanbao.com/',
            'Origin':'https://www.fhyanbao.com',
          })
          for rid in [1917676,1649994]:
            u=f'https://api.fhyanbao.com/api/report/preview/{rid}?resize=0'
            try:
              r=s.get(u,timeout=(30,180),allow_redirects=True)
              body=r.content
              ext='bin'
              ct=(r.headers.get('content-type') or '').lower()
              if body.startswith(b'%PDF-'): ext='pdf'
              elif 'json' in ct or body[:1] in (b'{',b'['): ext='json'
              elif body.startswith(b'\x89PNG'): ext='png'
              elif body.startswith(b'\xff\xd8'): ext='jpg'
              (out/f'{rid}_body.{ext}').write_bytes(body)
              meta={
                'id':rid,'input_url':u,'status':r.status_code,'final_url':r.url,
                'headers':dict(r.headers),'bytes':len(body),'first_200_hex':body[:200].hex(),
                'sha256':hashlib.sha256(body).hexdigest(),'detected_ext':ext,
              }
              if ext=='json':
                try: meta['json']=r.json()
                except Exception as e: meta['json_error']=repr(e); meta['text_head']=r.text[:5000]
              (out/f'{rid}_meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps(meta,ensure_ascii=False,indent=2),flush=True)
            except Exception as e:
              (out/f'{rid}_error.txt').write_text(repr(e),encoding='utf-8')
              print(rid,repr(e),flush=True)
          PY

      - name: Upload probe bundle
        uses: actions/upload-artifact@v4
        with:
          name: aux-electric-fhyanbao-preview-probe
          path: probe
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
