name: Discover Greentown China broker report PDF sources 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-china-broker-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml feedparser

      - name: Inspect report pages and public indexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, quote
          import requests, feedparser
          from bs4 import BeautifulSoup

          OUT = Path('greentown_broker_discovery')
          OUT.mkdir(exist_ok=True)
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'text/html,application/xhtml+xml,application/json,text/javascript,*/*;q=0.8',
          })

          targets = [
              'https://www.nxny.com/report/view_6289224.html',
              'https://www.nxny.com/report/view_6258379.html',
              'https://www.nxny.com/report/view_6461042.html',
              'https://www.sgpjbg.com/baogao/1236034.html',
              'https://www.fxbaogao.com/detail/5341002',
              'https://www.51pdf.cn/report_hk_p201/',
              'https://1c9u.com/zhishiku/%E7%83%AD%E9%97%A8%E4%BC%81%E4%B8%9A%E7%A0%94%E6%8A%A5',
          ]

          records=[]
          for i,u in enumerate(targets,1):
              try:
                  r=s.get(u,timeout=(20,90),allow_redirects=True,headers={'Referer':'https://www.baidu.com/'})
                  print('GET',i,r.status_code,len(r.content),u,'=>',r.url,flush=True)
                  (OUT/f'{i:02d}_page.bin').write_bytes(r.content)
                  txt=r.text
                  soup=BeautifulSoup(txt,'lxml')
                  title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  links=[]; scripts=[]
                  for tag in soup.find_all(['a','script','iframe','embed','object','source','link','video']):
                      for attr in ('href','src','data','data-src','data-url','download-url','file','url'):
                          v=tag.get(attr)
                          if v:
                              au=urljoin(r.url,html.unescape(v))
                              links.append(au)
                              if tag.name=='script' and attr=='src': scripts.append(au)
                  pats=[
                      r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                      r'["\']([^"\']*(?:download|down|file|pdf|report|resource|attachment|preview)[^"\']*)["\']',
                      r'(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|resourceUrl|reportUrl|filePath|file_path|url)\s*[:=]\s*["\']([^"\']+)["\']',
                  ]
                  cand=set(links)
                  for pat in pats:
                      for m in re.finditer(pat,txt,re.I):
                          v=m.group(1) if m.lastindex else m.group(0)
                          v=html.unescape(v).replace('\\/','/')
                          cand.add(urljoin(r.url,v))
                  interesting=[]
                  for line in txt.splitlines():
                      low=line.lower()
                      if any(k in low for k in ('pdf','download','下载','fileid','reportid','attachment','resource','preview','token','oss','cos','cdn','6289224','6258379','6461042','1236034','5341002')):
                          cl=re.sub(r'\s+',' ',line).strip()
                          if cl and len(cl)<5000: interesting.append(cl)
                  rec={'input':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'type':r.headers.get('content-type'),'title':title,'links':sorted(set(links)),'scripts':sorted(set(scripts)),'candidates':sorted(cand),'interesting':interesting[:1200]}
                  records.append(rec)
                  (OUT/f'{i:02d}_result.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                  for j,su in enumerate(sorted(set(scripts))[:35]):
                      try:
                          sr=s.get(su,timeout=(15,60),allow_redirects=True,headers={'Referer':r.url})
                          if sr.status_code==200 and len(sr.content)<15_000_000:
                              (OUT/f'{i:02d}_script_{j:02d}.js').write_bytes(sr.content)
                      except Exception as e:
                          print('SCRIPT_ERR',su,repr(e),flush=True)
              except Exception as e:
                  rec={'input':u,'error':repr(e)}; records.append(rec)
                  (OUT/f'{i:02d}_error.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                  print('ERR',u,repr(e),flush=True)

          # Eastmoney research-report API probes.
          API='https://reportapi.eastmoney.com/report/list'
          api_out={'queries':[],'matches':[],'errors':[]}
          def parse(r):
              try: return r.json()
              except Exception:
                  t=r.text.strip(); m=re.search(r'^[^(]*\((.*)\)\s*;?$',t,re.S)
                  return json.loads(m.group(1)) if m else {'raw':t[:10000]}
          codes=['03900','3900','HK03900','03900.HK','116.03900','绿城中国','綠城中國','Greentown China']
          for code in codes:
              try:
                  p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2024-01-01','endTime':'2026-09-27','pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
                  rr=s.get(API,params=p,timeout=(20,90),headers={'Referer':'https://data.eastmoney.com/','Accept':'application/json,text/javascript,*/*;q=0.01'})
                  data=parse(rr); api_out['queries'].append({'code':code,'status':rr.status_code,'url':rr.url,'data':data})
                  rows=(data.get('data') or []) if isinstance(data,dict) else []
                  for row in rows:
                      tx=json.dumps(row,ensure_ascii=False)
                      if any(k in tx.lower() for k in ('绿城中国','綠城中國','greentown china','03900','3900.hk')):
                          api_out['matches'].append(row)
              except Exception as e: api_out['errors'].append({'code':code,'error':repr(e)})
              time.sleep(.3)
          (OUT/'eastmoney.json').write_text(json.dumps(api_out,ensure_ascii=False,indent=2),encoding='utf-8')

          # Bing RSS exact-title searches.
          queries=[
              '"绿城中国" "用品质铸就" pdf',
              '"绿城中国" "利润阶段性承压" pdf',
              '"绿城中国" "首次覆盖" pdf',
              '"Greentown China" "3900 HK" pdf research',
              'site:pdf.dfcfw.com 绿城中国 03900',
              'site:51pdf.cn 绿城中国 260506',
          ]
          rss=[]
          for q in queries:
              try:
                  u='https://www.bing.com/search?format=rss&q='+quote(q)
                  rr=s.get(u,timeout=(15,60))
                  feed=feedparser.loads(rr.content)
                  ent=[{'title':e.get('title'),'link':e.get('link'),'summary':e.get('summary')} for e in feed.entries]
                  rss.append({'query':q,'status':rr.status_code,'entries':ent})
              except Exception as e: rss.append({'query':q,'error':repr(e)})
          (OUT/'bing_rss.json').write_text(json.dumps(rss,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'all_records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          grep -RInE "https?[^[:space:]\"']+\.pdf|downloadUrl|download_url|pdfUrl|pdf_url|fileUrl|file_url|filePath|reportId|fileId|attachment|resourceUrl" greentown_broker_discovery > greentown_broker_discovery/grep_hits.txt || true
          find greentown_broker_discovery -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > greentown_broker_discovery/file_sizes.txt

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-broker-discovery
          path: greentown_broker_discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
