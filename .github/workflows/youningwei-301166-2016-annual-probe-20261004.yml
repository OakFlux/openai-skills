name: Inspect Youningwei 301166 2016 annual report versions 20261004

on:
  push:
    paths:
      - '.github/workflows/youningwei-301166-2016-annual-probe-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report versions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf
          python - <<'PY'
          import re, tempfile, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pypdf import PdfReader
          ids=['3252149','3261688','3360079','3389037']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for rid in ids:
            detail=f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301166&id={rid}'
            r=s.get(detail,timeout=60); r.raise_for_status()
            soup=BeautifulSoup(r.content.decode('gb18030',errors='replace'),'lxml')
            title=soup.title.get_text(' ',strip=True) if soup.title else ''
            body=re.sub(r'\s+',' ',soup.get_text(' ',strip=True))
            print('\nRID',rid,'TITLE',title,flush=True)
            print('BODY_HEAD',body[:600],flush=True)
            pdf=None
            for a in soup.find_all('a',href=True):
              label=''.join(a.get_text(' ',strip=True).split())
              u=urljoin(detail,a['href'])
              if '下载公告' in label or ('file.finance.sina.com.cn' in u and '.pdf' in u.lower()):
                pdf=u; break
            print('PDF',pdf,flush=True)
            if not pdf: continue
            rr=s.get(pdf,headers={'Referer':'https://vip.stock.finance.sina.com.cn/'},timeout=(30,300)); rr.raise_for_status()
            p=Path(tempfile.gettempdir())/f'{rid}.pdf'; p.write_bytes(rr.content)
            print('BYTES',p.stat().st_size,'PAGES',len(PdfReader(str(p),strict=False).pages),'SHA',__import__('hashlib').sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
