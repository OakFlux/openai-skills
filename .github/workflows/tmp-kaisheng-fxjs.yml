name: Temporary Kaisheng FXBaogao viewer JavaScript

on:
  push:
    branches:
      - tmp-kaisheng-fxjs-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch viewer JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          base='https://www.fxbaogao.com/_fxbg/2609031714/js'
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' "$base/runtime.f87a2ed9ca0214da6c96.js" -o output/runtime.js
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' "$base/vendors~app-pages-fxbg-main-js.dabdfdee4aa31d0d4b4a.chunk.js" -o output/vendors.js
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' "$base/app-pages-fxbg-main-js.71ff9d5297a4e28fc829.chunk.js" -o output/app.js
          wc -c output/*
      - name: Upload JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-fxbaogao-viewer-javascript
          path: output/*
          retention-days: 1
          if-no-files-found: error
