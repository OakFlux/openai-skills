name: Probe Qingsong Health broker report sources 20260919

on:
  push:
    paths:
      - '.github/workflows/qingsong-health-broker-report-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Probe report pages and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          pages=[
              'https://www.hkstarlightgroup.com/news/id-99.html',
              'https://www.fxbaogao.com/detail/5188870',
              'https://www.fxbaogao.com/detail/5319486',
              'https://www.hibor.com.cn/repinfodetail_4771524.html',
              'https://wap.hibor.com.cn/repinfodetail_4771524.html',
          ]
          for url in pages:
              print('\n=== PAGE',url,flush=True)
              try:
                  r=s.get(url,timeout=90,allow_redirects=True)
                  print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),flush=True)
                  text=r.text
                  soup=BeautifulSoup(text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
                  for tag in soup.find_all(['a','iframe','embed','object','script','link']):
                      for attr in ['href','src','data','data-url','download','content']:
                          v=tag.get(attr)
                          if not v: continue
                          full=urljoin(r.url,v)
                          hay=(full+' '+tag.get_text(' ',strip=True)).lower()
                          if any(k in hay for k in ['.pdf','download','report','file','oss','attachment','preview']):
                              print('LINK',tag.name,attr,repr(tag.get_text(' ',strip=True)[:180]),full,flush=True)
                  for pat in [
                      r'https?://[^\"\'<> ]+?\.pdf(?:\?[^\"\'<> ]*)?',
                      r'https?://[^\"\'<> ]+?(?:download|attachment|report|file)[^\"\'<> ]*',
                      r'[/A-Za-z0-9_.-]+\.pdf(?:\?[^\"\'<> ]*)?',
                  ]:
                      for m in sorted(set(re.findall(pat,text,re.I))):
                          print('REGEX',urljoin(r.url,m),flush=True)
                  for line in text.splitlines():
                      low=line.lower()
                      if any(k in low for k in ['5188870','5319486','pdfurl','downloadurl','fileurl','reporturl','oss','attachment']):
                          print('LINE',line[:1500],flush=True)
                  print('HEAD',text[:5000].replace('\n',' '),flush=True)
              except Exception as e:
                  print('ERROR',repr(e),flush=True)

          candidates=[
              'https://www.hkstarlightgroup.com/uploadfile/files/202603/20260326201045SnohP.pdf',
          ]
          print('\n=== DIRECT FILE PROBES ===',flush=True)
          for url in candidates:
              try:
                  with s.get(url,timeout=(30,180),stream=True,allow_redirects=True) as r:
                      first=b''; total=0
                      for chunk in r.iter_content(1024*1024):
                          if not chunk: continue
                          if not first: first=chunk[:16]
                          total+=len(chunk)
                          if total>20_000_000: break
                      print('FILE',url,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'CL',r.headers.get('content-length'),'READ',total,'HEAD',first,'FINAL',r.url,flush=True)
              except Exception as e:
                  print('FILEERR',url,repr(e),flush=True)
          PY
