name: Inspect Hangyan public PDF endpoint
on:
  push:
    branches:
      - chatgpt-dalipal-reports-20260907
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch application script and inspect native PDF controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          u='https://cdn.hangyan.co/assets/application-ec845e69.js'
          r=s.get(u,headers={'User-Agent':ua,'Referer':'https://www.hangyan.co/'},timeout=(15,120)); print('JS',r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True); r.raise_for_status()
          Path('out/application.js').write_bytes(r.content)
          text=r.text
          terms=['native-pdf','cacheKey','cache-key','cloud-download','download','filenameValue','pageNumValue','pdf','reports/','s3','qingstor']
          for term in terms:
            print('\nTERM',term,flush=True)
            poss=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
            print('COUNT',len(poss),flush=True)
            for pos in poss[:50]: print(text[max(0,pos-1800):pos+3500],flush=True)
          # Fetch report page and collect attributes and all same-origin endpoints in source.
          page='https://www.hangyan.co/reports/2773386358276752690'
          rr=s.get(page,headers={'User-Agent':ua},timeout=(15,120)); print('PAGE',rr.status_code,len(rr.content),rr.url,flush=True); rr.raise_for_status()
          Path('out/report.html').write_bytes(rr.content)
          for pat in [r'data-native-pdf-[^=]+="([^"]*)"',r'https?://[^\s"\'<>]+',r'/[^\s"\'<>]+']:
            vals=re.findall(pat,rr.text)
            print('PATTERN',pat,'COUNT',len(vals),flush=True)
            for v in vals[:300]:
              if isinstance(v,tuple): v=' '.join(v)
              if any(k in str(v).lower() for k in ['pdf','report','download','cache','file','s3','qingstor']): print('VAL',v,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-pdf-endpoint-inspection
          path: out/
          retention-days: 3
          if-no-files-found: error
