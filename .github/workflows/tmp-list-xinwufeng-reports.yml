name: Temporary List New Wellful Report Metadata

on:
  push:
    branches:
      - tmp/fetch-xinwufeng-reports-20260830
    paths:
      - .github/workflows/tmp-list-xinwufeng-reports.yml

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,urllib.parse,urllib.request
          params={
            'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*',
            'beginTime':'2004-01-01','endTime':'2026-08-30','pageNo':'1','fields':'','qType':'0',
            'orgCode':'','author':'','code':'600975','rcode':'','p':'1','pageNum':'1','pageNumber':'1',
            '_':str(int(time.time()*1000))}
          url='https://reportapi.eastmoney.com/report/list?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/plain,*/*'})
          with urllib.request.urlopen(req,timeout=45) as resp: payload=json.loads(resp.read().decode('utf-8-sig'))
          data=payload.get('data'); rows=[]
          if isinstance(data,list): rows=data
          elif isinstance(data,dict):
            for k in ('dataList','list','rows'):
              if isinstance(data.get(k),list): rows=data[k];break
          if not rows and isinstance(payload.get('result'),dict):
            for k in ('data','dataList','list','rows'):
              if isinstance(payload['result'].get(k),list):rows=payload['result'][k];break
          print('ROW_COUNT='+str(len(rows)))
          for r in sorted(rows,key=lambda x:str(x.get('publishDate') or ''),reverse=True):
            out={k:r.get(k) for k in ('infoCode','publishDate','orgSName','orgName','title','emRatingName','ratingName','author')}
            print('ROW_JSON='+json.dumps(out,ensure_ascii=False))
          PY
