name: Inspect Energy Environment report page

on:
  push:
    branches: [tmp-jienenghuanjing-broker-reports-20261016]
    paths: ['.github/workflows/tmp-jienenghuanjing-51pdf-inspect-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect public report page
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            'https://www.51pdf.cn/report/view_5773591.html' -D headers.txt -o page.html || true
          echo '===== HEADERS ====='
          sed -n '1,100p' headers.txt || true
          echo '===== PAGE SIZE ====='
          wc -c page.html || true
          echo '===== URL/PDF/API CANDIDATES ====='
          python3 - <<'PY'
          import html, pathlib, re
          p = pathlib.Path('page.html')
          if not p.exists():
              print('NO PAGE')
              raise SystemExit
          raw = p.read_bytes()
          for enc in ('utf-8','gb18030','gbk'):
              try:
                  text = raw.decode(enc)
                  break
              except UnicodeDecodeError:
                  pass
          else:
              text = raw.decode('utf-8', errors='replace')
          text = html.unescape(text)
          pats = [
              r'https?://[^\s"\'<>]+',
              r'//[^\s"\'<>]+',
              r'[^\s"\'<>]{0,160}\.pdf(?:\?[^\s"\'<>]*)?',
          ]
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen and any(k in s.lower() for k in ('pdf','download','file','report','oss','api','view','5773591')):
                      seen.add(s)
                      print(s[:1200])
          print('===== KEY LINES =====')
          for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in ('pdf','download','fileurl','reporturl','oss','5773591','垃圾发电新星','首次覆盖')):
                  line=re.sub(r'\s+',' ',line).strip()
                  if line:
                      print(line[:2500])
          PY
