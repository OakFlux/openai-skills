name: Diagnose HKEX query for Yixin filings 20260926

on:
  push:
    paths:
      - '.github/workflows/yixin-hkex-query-diagnostic-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query HKEX and save raw responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,traceback
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=166831'})
          endpoint='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          variants=[]
          for lang in ('zh','EN'):
            for t1,t2 in (('-2','-2'),('40000','40100')):
              params={'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'166831','documentType':'-1','fromDate':'20200101','toDate':'20260926','title':'','searchType':'1','t1code':t1,'t2Gcode':'-2','t2code':t2,'rowRange':'2000','lang':lang}
              rec={'lang':lang,'t1':t1,'t2':t2,'params':params}
              try:
                r=s.get(endpoint,params=params,headers={'Accept':'application/json,text/plain,*/*'},timeout=(30,120))
                rec.update({'status':r.status_code,'url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'text_head':r.text[:1000]})
                name=f'{lang}_{t1}_{t2}'.replace('-','m')
                Path(f'out/{name}.txt').write_text(r.text,encoding='utf-8',errors='replace')
                try:
                  obj=r.json(); rec['json_type']=type(obj).__name__; rec['json_keys']=list(obj.keys()) if isinstance(obj,dict) else None
                  Path(f'out/{name}.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
                except Exception as e: rec['json_error']=repr(e)
              except Exception as e:
                rec['error']=repr(e); rec['traceback']=traceback.format_exc()
              variants.append(rec)
          Path('out/summary.json').write_text(json.dumps(variants,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(variants,ensure_ascii=False,indent=2))
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: yixin-hkex-query-diagnostic
          path: out
          retention-days: 7
          if-no-files-found: error
