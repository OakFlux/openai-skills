name: Probe CCCC Development report source pages 20260927

on:
  push:
    paths:
      - '.github/workflows/cccc-development-report-source-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Inspect public report pages and links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          pages=[
            'https://www.sgpjbg.com.cn/baogao/5510.html',
            'https://www.nxny.com/report/view_4385119.html',
            'https://www.nxny.com/report/view_4635109.html',
            'https://www.nxny.com/report/view_5112685.html',
            'https://www.gubit.cn/report/000736/202104160011.html',
            'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=sz000736&orgname=&industry=&title=&t1=all',
          ]
          for u in pages:
            print('\n=== PAGE',u,'===',flush=True)
            try:
              r=s.get(u,timeout=(25,90),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),flush=True)
              print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False)[:2000],flush=True)
              text=r.text
              print('TEXT_HEAD',text[:5000],flush=True)
              for pat in [
                r'https?://[^"\'<> ]+\.pdf[^"\'<> ]*',
                r'https?://[^"\'<> ]+',
                r'(?:href|src|data-url|data-file|data-src|value)=["\']([^"\']+)["\']',
                r'["\']([^"\']*(?:download|pdf|file)[^"\']*)["\']',
              ]:
                vals=[]
                for m in re.findall(pat,text,re.I):
                  v=m if isinstance(m,str) else m[0]
                  if v not in vals: vals.append(v)
                if vals: print('PATTERN',pat,'VALUES',vals[:100],flush=True)
              # Fetch scripts from same page and inspect endpoint clues.
              scripts=[]
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
                su=urljoin(r.url,src)
                if su not in scripts: scripts.append(su)
              for su in scripts[:30]:
                try:
                  rr=s.get(su,timeout=(20,60))
                  if rr.status_code!=200 or len(rr.content)>4000000: continue
                  st=rr.text
                  matches=[]
                  for pat in [r'https?://[^"\'<> ]+',r'/[^"\'<> ]*(?:download|pdf|file)[^"\'<> ]*']:
                    for x in re.findall(pat,st,re.I):
                      if x not in matches: matches.append(x)
                  if matches: print('SCRIPT_MATCH',su,matches[:100],flush=True)
                except Exception as e: print('SCRIPT_ERR',su,repr(e),flush=True)
            except Exception as e:
              print('PAGE_ERR',repr(e),flush=True)
          PY
