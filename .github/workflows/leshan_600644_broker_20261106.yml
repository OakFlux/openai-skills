name: package-leshan-600644-broker-reports

on:
  push:
    branches:
      - tmp/leshan-600644-broker-20261106-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import urllib.parse
          import warnings
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          warnings.filterwarnings("ignore", message="Unverified HTTPS request")

          COMPANY = "乐山电力股份有限公司"
          SHORT_NAME = "乐山电力"
          CODE = "600644"
          PREPARED = "2026-11-06"
          ROOT_NAME = "乐山电力_600644_券商研究报告"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          required_reports = [
              {
                  "date": "2022-08-15",
                  "broker": "川财证券",
                  "analyst": "贺潇翔宇",
                  "rating": "报告首页未明确标注",
                  "report_type": "公司深度报告",
                  "title": "民生领域品牌价值愈发彰显",
                  "filename": "01_20220815_川财证券_民生领域品牌价值愈发彰显_公司深度报告.pdf",
                  "minimum_pages": 12,
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP202208171577310540_1.pdf?1660768062000.pdf=",
                      "https://pdf.dfcfw.com/pdf/H3_AP202208171577310540_1.pdf",
                  ],
                  "markers": ["乐山电力", "600644", "民生领域品牌价值愈发彰显", "贺潇翔宇"],
              },
              {
                  "date": "2011-08-05",
                  "broker": "民生证券",
                  "analyst": "王力",
                  "rating": "谨慎推荐（首次评级）",
                  "report_type": "公司研究/中报点评",
                  "title": "多晶硅业务高速成长，投资收益利润丰厚",
                  "filename": "02_20110805_民生证券_多晶硅业务高速成长投资收益利润丰厚_公司研究中报点评.pdf",
                  "minimum_pages": 2,
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP201203070005018101_1.pdf?1373303314000.pdf=",
                      "https://pdf.dfcfw.com/pdf/H3_AP201203070005018101_1.pdf",
                  ],
                  "markers": ["乐山电力", "600644", "多晶硅业务高速成长", "王力"],
              },
          ]

          optional_guoyuan = {
              "date": "2009-01-14",
              "broker": "国元证券",
              "analyst": "常格非",
              "rating": "推荐",
              "report_type": "公司研究",
              "title": "资产注入预期完善产业链驱动公司快速发展",
              "filename": "03_20090114_国元证券_资产注入预期完善产业链驱动公司快速发展_公司研究.pdf",
              "minimum_pages": 4,
              "markers": ["乐山电力", "600644", "资产注入", "常格非"],
              "page_urls": [
                  "https://www.p5w.net/stock/lzft/gsyj/200901/t2117136.htm",
                  "http://www.p5w.net/stock/lzft/gsyj/200901/t2117136.htm",
              ],
          }

          def compact(value: str) -> str:
              return re.sub(r"\s+", "", value or "")

          def download_pdf_urls(urls: list[str], referer: str = "https://data.eastmoney.com/") -> tuple[bytes, str, str]:
              last_error: Exception | None = None
              expanded: list[str] = []
              for url in urls:
                  expanded.extend([url, url + ("&download=1" if "?" in url else "?download=1")])
              for url in dict.fromkeys(expanded):
                  for verify in (True, False):
                      for attempt in range(3):
                          try:
                              response = session.get(
                                  url,
                                  timeout=(30, 480),
                                  allow_redirects=True,
                                  verify=verify,
                                  headers={"Accept": "application/pdf,*/*;q=0.8", "Referer": referer},
                              )
                              print("DOWNLOAD", response.status_code, len(response.content), response.url, response.headers.get("content-type"), "verify", verify)
                              response.raise_for_status()
                              if response.content.startswith(b"%PDF-") and len(response.content) > 80_000:
                                  return response.content, response.url, response.headers.get("content-type", "")
                              last_error = RuntimeError(f"Not a valid PDF response: {response.content[:80]!r}")
                          except Exception as exc:
                              last_error = exc
                              print("DOWNLOAD_ERROR", attempt, url, "verify", verify, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed: {last_error}")

          def discover_guoyuan_pdf() -> tuple[list[str], str]:
              links: list[str] = []
              page_used = ""
              for page_url in optional_guoyuan["page_urls"]:
                  for verify in (True, False):
                      try:
                          response = session.get(page_url, timeout=(30, 180), allow_redirects=True, verify=verify)
                          print("P5W_PAGE", response.status_code, len(response.content), response.url, response.headers.get("content-type"), "verify", verify)
                          if response.status_code != 200 or len(response.content) < 500:
                              continue
                          page_used = response.url
                          encodings = [response.encoding, response.apparent_encoding, "utf-8", "gb18030"]
                          texts = []
                          for enc in encodings:
                              if not enc:
                                  continue
                              try:
                                  texts.append(response.content.decode(enc, errors="ignore"))
                              except Exception:
                                  pass
                          for text in texts:
                              soup = BeautifulSoup(text, "html.parser")
                              for tag in soup.find_all(["a", "iframe", "embed", "object"]):
                                  for attr in ("href", "src", "data"):
                                      value = tag.get(attr)
                                      if value:
                                          value = html.unescape(value).strip()
                                          if ".pdf" in value.lower() or "download" in value.lower():
                                              links.append(urllib.parse.urljoin(response.url, value))
                              patterns = [
                                  r"https?://[^\"'<>\s]+?\.pdf(?:\?[^\"'<>\s]*)?",
                                  r"(?:\.\./|/)?[^\"'<>\s]+?\.pdf(?:\?[^\"'<>\s]*)?",
                                  r"P0\d{14,}\.pdf",
                              ]
                              for pattern in patterns:
                                  for match in re.findall(pattern, text, flags=re.IGNORECASE):
                                      links.append(urllib.parse.urljoin(response.url, html.unescape(match)))
                          if links:
                              break
                      except Exception as exc:
                          print("P5W_PAGE_ERROR", page_url, "verify", verify, repr(exc))
                  if links:
                      break
              cleaned = []
              for link in links:
                  link = link.replace("&amp;", "&").replace(" ", "%20")
                  if link.lower().startswith(("http://", "https://")):
                      cleaned.append(link)
              cleaned = list(dict.fromkeys(cleaned))
              print("P5W_CANDIDATES", json.dumps(cleaned, ensure_ascii=False, indent=2))
              return cleaned, page_used

          def validate_and_store(report: dict, data: bytes, final_url: str, content_type: str, sequence: int) -> dict:
              filename = report["filename"]
              if not filename.startswith(f"{sequence:02d}_"):
                  filename = re.sub(r"^\d{2}_", f"{sequence:02d}_", filename)
              output = PDF_DIR / filename
              output.write_bytes(data)
              with output.open("rb") as handle:
                  if handle.read(5) != b"%PDF-":
                      raise RuntimeError(f"Invalid PDF header: {output.name}")

              reader = PdfReader(str(output), strict=False)
              pages = len(reader.pages)
              if pages < report["minimum_pages"]:
                  raise RuntimeError(f"Report unexpectedly short: {output.name}: {pages} pages")

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {output.name}: {qpdf.stdout}")

              text_run = subprocess.run(
                  ["pdftotext", "-f", "1", "-l", str(min(12, pages)), str(output), "-"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              text_compact = compact(text_run.stdout)
              marker_hits = [marker for marker in report["markers"] if compact(marker) in text_compact]
              if len(marker_hits) < 2:
                  raise RuntimeError(f"Issuer/title validation failed for {output.name}: hits={marker_hits}")

              prefix = PREVIEW_DIR / output.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 6_000:
                  raise RuntimeError(f"Preview rendering failed for {output.name}: {render.stdout}")

              record = {
                  "sequence": sequence,
                  "broker": report["broker"],
                  "date": report["date"],
                  "analyst": report["analyst"],
                  "rating": report["rating"],
                  "report_type": report["report_type"],
                  "title": report["title"],
                  "filename": filename,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": final_url,
                  "content_type": content_type,
                  "marker_hits": marker_hits,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              print("VALIDATED", json.dumps(record, ensure_ascii=False))
              return record

          manifest: list[dict] = []
          failures: list[dict] = []

          for report in required_reports:
              data, final_url, content_type = download_pdf_urls(report["urls"])
              manifest.append(validate_and_store(report, data, final_url, content_type, len(manifest) + 1))

          # Try to add the 2009 Guoyuan Securities company research attachment.
          try:
              candidates, page_used = discover_guoyuan_pdf()
              if not candidates:
                  raise RuntimeError("No PDF attachment link discovered on the P5W page")
              data, final_url, content_type = download_pdf_urls(candidates, referer=page_used or optional_guoyuan["page_urls"][0])
              manifest.append(validate_and_store(optional_guoyuan, data, final_url, content_type, len(manifest) + 1))
          except Exception as exc:
              failures.append({
                  "broker": optional_guoyuan["broker"],
                  "date": optional_guoyuan["date"],
                  "title": optional_guoyuan["title"],
                  "error": repr(exc),
              })
              print("OPTIONAL_GUOYUAN_FAILED", repr(exc))

          if len(manifest) < 2:
              raise RuntimeError(f"Expected at least 2 valid reports, got {len(manifest)}")

          readme = [
              f"{COMPANY}（{CODE}.SH）券商研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              f"本包收录{len(manifest)}份可公开下载并验证的券商原始PDF。",
              "其中2022年川财证券报告为明确标注的公司深度报告；其余为历史公司研究或中报点评，用于补充公司在多晶硅业务阶段及资产整合阶段的研究视角。",
              "由于该公司公开可下载的长篇券商覆盖较少，本包未使用网页摘要、索引页或重新排版文件补数。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   券商：{item['broker']}；研究员：{item['analyst']}",
                  f"   日期：{item['date']}；评级：{item['rating']}",
                  f"   类型：{item['report_type']}",
                  f"   标题：{item['title']}",
                  f"   页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   公开来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          if failures:
              readme.append("未纳入的候选报告：")
              for failure in failures:
                  readme.append(f"   {failure['broker']} {failure['date']}《{failure['title']}》；原因：{failure['error']}")
              readme.append("")
          readme.extend([
              "核验项目：PDF文件头、公司名称/证券代码、报告标题、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": manifest,
              "candidate_failures": failures,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "券商", "日期", "研究员", "评级", "类型", "标题", "文件名", "页数", "字节数", "SHA-256", "公开来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["broker"], item["date"], item["analyst"], item["rating"],
                      item["report_type"], item["title"], item["filename"], item["pages"], item["bytes"],
                      item["sha256"], item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("leshan_600644_broker_research_reports.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              previews = [name for name in archive.namelist() if name.lower().endswith(".png")]
              if bad is not None or len(pdf_names) != len(manifest) or len(previews) != len(manifest):
                  raise RuntimeError(f"ZIP validation failed: bad={bad}, pdfs={len(pdf_names)}, previews={len(previews)}, expected={len(manifest)}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": [{k: item[k] for k in ["broker", "date", "analyst", "rating", "report_type", "title", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
              "candidate_failures": failures,
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: leshan-600644-broker-research-reports-20261106
          path: |
            leshan_600644_broker_research_reports.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
