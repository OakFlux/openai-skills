name: Search web engines for historical Guoji Zhongzhuang annual report PDFs 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-search-engines-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Query multiple public search endpoints
        run: |
          python -m pip install --quiet beautifulsoup4 lxml
          python - <<'PY'
          import html, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote, urlparse, parse_qs, unquote
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          queries=[]
          for y in range(2015,2020):
            names=['二重重装','二重集团（德阳）重型装备股份有限公司'] if y<=2017 else ['国机重装','国机重型装备集团股份有限公司','国重装5']
            for n in names:
              queries.append(f'"{n}" "{y}年年度报告" PDF')
            queries.append(f'400062 {y} 年度报告 pdf')
          def emit(engine,q,url,title=''):
            print('RESULT',engine,'QUERY',repr(q),'URL',url,'TITLE',repr(title))
          for q in queries:
            print('\n=== QUERY',repr(q),'===')
            # Bing normal and RSS
            for suffix in ['', '&format=rss']:
              try:
                u='https://www.bing.com/search?q='+quote(q)+'&count=30'+suffix
                r=s.get(u,timeout=30); print('BING',r.status_code,len(r.content),r.url)
                soup=BeautifulSoup(r.text,'lxml')
                if suffix:
                  for item in soup.find_all('item'):
                    link=item.find('link'); title=item.find('title')
                    if link: emit('bing-rss',q,link.get_text(strip=True),title.get_text(' ',strip=True) if title else '')
                else:
                  for li in soup.select('li.b_algo'):
                    a=li.find('a',href=True)
                    if a: emit('bing',q,a['href'],a.get_text(' ',strip=True))
              except Exception as e: print('BINGERR',repr(e))
            # DuckDuckGo lite/html
            for base in ['https://html.duckduckgo.com/html/?q=','https://lite.duckduckgo.com/lite/?q=']:
              try:
                r=s.get(base+quote(q),timeout=30); print('DDG',r.status_code,len(r.content),r.url)
                soup=BeautifulSoup(r.text,'lxml')
                for a in soup.find_all('a',href=True):
                  h=a['href']; t=a.get_text(' ',strip=True)
                  if 'uddg=' in h:
                    try: h=unquote(parse_qs(urlparse(h).query).get('uddg',[''])[0])
                    except: pass
                  if h.startswith('http'): emit('ddg',q,h,t)
              except Exception as e: print('DDGERR',repr(e))
            # Baidu
            try:
              r=s.get('https://www.baidu.com/s?wd='+quote(q)+'&rn=30',timeout=30); print('BAIDU',r.status_code,len(r.content),r.url)
              soup=BeautifulSoup(r.text,'lxml')
              for a in soup.select('h3 a[href], a.c-title-text[href]'):
                emit('baidu',q,a.get('href'),a.get_text(' ',strip=True))
            except Exception as e: print('BAIDUERR',repr(e))
            # Sogou
            try:
              r=s.get('https://www.sogou.com/web?query='+quote(q),timeout=30); print('SOGOU',r.status_code,len(r.content),r.url)
              soup=BeautifulSoup(r.text,'lxml')
              for a in soup.select('h3 a[href], a.vrTitle[href]'):
                emit('sogou',q,a.get('href'),a.get_text(' ',strip=True))
            except Exception as e: print('SOGOUERR',repr(e))
          PY
