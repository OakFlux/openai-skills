name: probe-donghu-sina-correct-original-urls-v9

on:
  push:
    branches:
      - tmp/donghu-hightech-page-probe-20261104-v7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe correct original endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          ids=['809626291650','799312999325','783807473270','778455237265','773494636310','752237217885','741426132431']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for rid in ids:
            u=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/url'
            try:
              r=s.get(u,timeout=(10,45),allow_redirects=True,headers={'Referer':f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml','Accept':'application/pdf,text/html,*/*;q=0.8'})
              print('RESULT',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type'),[(h.status_code,h.url,h.headers.get('location')) for h in r.history],r.content[:20])
              if not r.content.startswith(b'%PDF-'):
                t=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
                print('HEAD',rid,re.sub(r'\s+',' ',t[:2000]))
            except Exception as e:
              print('ERROR',rid,repr(e))
          PY
