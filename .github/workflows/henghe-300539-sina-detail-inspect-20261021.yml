name: Inspect Henghe Sina report detail pages

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-sina-detail-inspect-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect report pages
        run: |
          python - <<'PY'
          import html, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://stock.finance.sina.com.cn/'})
          rptids=['831828143682','820241551050','813458614844','810508380302','810142260265','801085564174','763337834029','751674345226','740567795901','548839599653','524851845385']
          for rid in rptids:
            url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\n\n===== REPORT',rid,'STATUS',r.status_code,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),'URL',r.url)
              r.raise_for_status()
              enc=r.apparent_encoding or 'gb18030'; r.encoding=enc
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              print('ENC',enc,'TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(['a','iframe','embed','object','link','script','source']):
                attrs={k:tag.get(k) for k in ('href','src','data','type','download') if tag.get(k)}
                label=' '.join(tag.get_text(' ',strip=True).split())[:300]
                joined=json.dumps(attrs,ensure_ascii=False)
                if any(k in (label+joined).lower() for k in ['pdf','下载','原文','附件','file','report','rptid','paper']):
                  for k in ('href','src','data'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('TAG',tag.name,json.dumps({'text':label,'attrs':attrs},ensure_ascii=False))
              patterns=[r'https?://[^\"\'<>\s]+',r'[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r'(?:file|pdf|download|attach|url|source)[A-Za-z_]*\s*[:=]\s*[\"\']([^\"\']+)[\"\']']
              for pat in patterns:
                vals=[]
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v)
                  if any(k in v.lower() for k in ['pdf','download','report','file','attach','rptid','paper']): vals.append(v)
                for v in dict.fromkeys(vals): print('REGEX',v[:2000])
              plain=' '.join(soup.get_text(' ',strip=True).split())
              print('PLAIN_HEAD',plain[:3000])
              for key in ['下载','原文','PDF','报告全文','附件']:
                pos=plain.find(key)
                if pos>=0: print('PLAIN_MATCH',key,plain[max(0,pos-500):pos+1500])
            except Exception as e:
              print('ERROR',rid,repr(e))
          PY
