name: Scan historical China Communications Construction broker reports
on:
  push:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests
      - name: Query public Eastmoney report API
        run: |
          python - <<'PY'
          import json,time,requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/601800.html'})
          allrows=[]
          for page in range(1,10):
              params={'pageSize':'100','beginTime':'2010-01-01','endTime':'2026-09-07','pageNo':str(page),'qType':'0','code':'601800','_':str(int(time.time()*1000))}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=90)
              print('PAGE',page,r.status_code,len(r.content))
              obj=r.json(); rows=obj.get('data') or []
              allrows.extend(rows)
              if not rows or page>=int(obj.get('TotalPage') or 1): break
          print('TOTAL',len(allrows))
          for row in allrows:
              print('ROW',json.dumps({k:row.get(k) for k in ['title','orgSName','publishDate','infoCode','reportType','researcher']},ensure_ascii=False))
          print('LIKELY_DEEP')
          for row in allrows:
              t=str(row.get('title') or '')
              if any(x in t for x in ['首次覆盖','深度','价值重估','龙头','全产业链','海外布局']):
                  print('DEEP',json.dumps({k:row.get(k) for k in ['title','orgSName','publishDate','infoCode','reportType','researcher']},ensure_ascii=False))
          PY
