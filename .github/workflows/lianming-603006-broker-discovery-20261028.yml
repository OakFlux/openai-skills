name: Discover Lianming 603006 broker reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lianming-603006-broker-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          rows=[]
          for page in range(1,10):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
                  'ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31',
                  'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'603006',
                  'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
              }
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,120))
              r.raise_for_status(); data=r.json(); batch=data.get('data') or []
              print('PAGE',page,'HITS',data.get('hits'),'ROWS',len(batch))
              if not batch: break
              rows.extend(batch)
              if len(batch)<100: break
          seen=set(); out=[]
          for row in rows:
              code=str(row.get('infoCode') or '')
              if not code or code in seen: continue
              seen.add(code)
              item={k:row.get(k) for k in [
                  'title','stockName','stockCode','orgName','orgSName','publishDate','infoCode',
                  'attachPages','attachSize','emRatingName','sRatingName','researcher','column','reportType'
              ]}
              out.append(item)
          out.sort(key=lambda x:(int(x.get('attachPages') or 0),str(x.get('publishDate') or '')),reverse=True)
          print('TOTAL',len(out))
          for x in out:
              print('REPORT_JSON',json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY
