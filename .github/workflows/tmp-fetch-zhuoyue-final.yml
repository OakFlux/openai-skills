name: Temporary Fetch Zhuoyue New Energy Filings

on:
  push:
    branches:
      - tmp/fetch-zhuoyue-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote

          import requests

          STOCK_ID = '688196'
          ROOT = Path('zhuoyue_package')
          PDF_DIR = ROOT / '01_年度报告及半年度报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://vip.stock.finance.sina.com.cn/',
          })

          def decode(response):
              raw = response.content
              for encoding in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      continue
              return raw.decode('utf-8', errors='ignore')

          def visible_text(fragment):
              fragment = re.sub(r'<script\b[^>]*>.*?</script>', ' ', fragment, flags=re.I | re.S)
              fragment = re.sub(r'<style\b[^>]*>.*?</style>', ' ', fragment, flags=re.I | re.S)
              fragment = re.sub(r'<[^>]+>', ' ', fragment)
              return re.sub(r'\s+', ' ', html.unescape(fragment)).strip()

          def fetch_html(url):
              response = session.get(url, timeout=60)
              response.raise_for_status()
              return html.unescape(decode(response)).replace('\\/', '/')

          def parse_report_anchors(page_html):
              results = []
              for match in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', page_html, flags=re.I | re.S):
                  href = match.group(1)
                  title = visible_text(match.group(2))
                  id_match = re.search(r'(?:[?&]|%3F|%26)id(?:=|%3D)(\d+)', href, flags=re.I)
                  if not id_match:
                      id_match = re.search(r'id/(\d+)', href, flags=re.I)
                  if id_match:
                      results.append({'title': title, 'id': id_match.group(1), 'href': href})
              return results

          annual_page = fetch_html(
              f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK_ID}/page_type/ndbg.phtml'
          )
          annual_anchors = parse_report_anchors(annual_page)

          selected = []
          for year in range(2020, 2026):
              candidates = [
                  row for row in annual_anchors
                  if f'{year}年年度报告' in row['title'] and '摘要' not in row['title']
              ]
              if not candidates:
                  raise RuntimeError(f'No annual report anchor found for {year}; anchors={annual_anchors}')
              # Listing is newest-first. This also prioritizes later corrected/revised versions.
              chosen = candidates[0]
              selected.append({
                  'kind': 'annual_report',
                  'year': year,
                  'label': chosen['title'].replace('：', '_').replace(':', '_'),
                  'bulletin_id': chosen['id'],
                  'filename': f'{year - 2019:02d}_卓越新能_{year}年年度报告' + (
                      '_修订或更正版.pdf' if any(term in chosen['title'] for term in ['修订', '更正']) else '.pdf'
                  ),
                  'required_title': f'{year}年年度报告',
                  'min_pages': 60,
              })

          all_page = fetch_html(
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK_ID}.phtml'
          )
          all_anchors = parse_report_anchors(all_page)
          half_candidates = [
              row for row in all_anchors
              if '2026年半年度报告' in row['title'] and '摘要' not in row['title']
          ]
          if not half_candidates:
              # Fallback to the dedicated interim-report page.
              interim_page = fetch_html(
                  f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK_ID}/page_type/zqbg.phtml'
              )
              half_candidates = [
                  row for row in parse_report_anchors(interim_page)
                  if '2026年半年度报告' in row['title'] and '摘要' not in row['title']
              ]
          if not half_candidates:
              raise RuntimeError(f'No 2026 half-year report anchor found; anchors={all_anchors}')

          half = half_candidates[0]
          selected.append({
              'kind': 'half_year_report',
              'year': 2026,
              'label': half['title'].replace('：', '_').replace(':', '_'),
              'bulletin_id': half['id'],
              'filename': '07_卓越新能_2026年半年度报告.pdf',
              'required_title': '2026年半年度报告',
              'min_pages': 40,
          })

          def detail_url(bulletin_id):
              return f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid={STOCK_ID}'

          def extract_pdf_urls(detail_html):
              urls = []
              for url in re.findall(r'https?://[^\s"\'<>]+?\.PDF', detail_html, flags=re.I):
                  url = unquote(url)
                  if url not in urls:
                      urls.append(url)
              return urls

          def looks_like_pdf(raw):
              return len(raw) > 100_000 and raw.lstrip().startswith(b'%PDF') and b'%%EOF' in raw[-16384:]

          def download_pdf(item):
              detail = detail_url(item['bulletin_id'])
              detail_html = fetch_html(detail)
              pdf_urls = extract_pdf_urls(detail_html)
              if not pdf_urls:
                  raise RuntimeError(f'No PDF URL on {detail}')
              errors = []
              for url in pdf_urls:
                  for attempt in range(1, 4):
                      try:
                          print(f'GET {item["label"]} attempt={attempt}: {url}')
                          with session.get(url, timeout=150, allow_redirects=True, stream=True) as response:
                              response.raise_for_status()
                              data = bytearray()
                              for chunk in response.iter_content(chunk_size=1024 * 256):
                                  if chunk:
                                      data.extend(chunk)
                              raw = bytes(data)
                              content_type = response.headers.get('content-type')
                          if not looks_like_pdf(raw):
                              raise RuntimeError(
                                  f'not a complete PDF: type={content_type}, bytes={len(raw)}, head={raw[:20]!r}'
                              )
                          path = PDF_DIR / item['filename']
                          path.write_bytes(raw)
                          date_match = re.search(r'/(\d{4}-\d{2}-\d{2})/', url)
                          item['disclosure_date'] = date_match.group(1) if date_match else None
                          item['detail_url'] = detail
                          item['source_url'] = url
                          return path
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f'Unable to download {item["label"]}:\n' + '\n'.join(errors))

          def page_count(path):
              result = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', result.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_text(path, first, last):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as handle:
                  output = Path(handle.name)
              try:
                  result = subprocess.run(
                      ['pdftotext', '-f', str(first), '-l', str(last), '-enc', 'UTF-8', str(path), str(output)],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0:
                      return ''
                  return output.read_text(encoding='utf-8', errors='ignore')
              finally:
                  output.unlink(missing_ok=True)

          manifest = []
          sha_lines = []
          for item in selected:
              path = download_pdf(item)
              raw = path.read_bytes()
              pages = page_count(path)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short document: {item["label"]} has {pages} pages')

              first_text = extract_text(path, 1, min(30, pages))
              compact = re.sub(r'\s+', '', first_text)
              identity_ok = any(term in compact for term in ['卓越新能', '龙岩卓越新能源股份有限公司', '688196'])
              title_ok = item['required_title'] in compact
              if not identity_ok or not title_ok:
                  raise RuntimeError(
                      f'Identity/title check failed for {item["label"]}: identity={identity_ok}, title={title_ok}'
                  )

              sha = hashlib.sha256(raw).hexdigest()
              rel = str(path.relative_to(ROOT))
              record = {
                  'document_type': item['kind'],
                  'title': item['label'],
                  'report_year': item['year'],
                  'disclosure_date': item['disclosure_date'],
                  'file': rel,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'bulletin_id': item['bulletin_id'],
                  'detail_url': item['detail_url'],
                  'source_url': item['source_url'],
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': identity_ok,
                  'title_text_matched': title_ok,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {rel}')
              print(f'VERIFIED {item["label"]}: pages={pages}, bytes={len(raw)}')

          expected_years = [2020, 2021, 2022, 2023, 2024, 2025, 2026]
          if [record['report_year'] for record in manifest] != expected_years:
              raise RuntimeError(f'Unexpected year sequence: {[record["report_year"] for record in manifest]}')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '龙岩卓越新能源股份有限公司（卓越新能，688196）公开披露文件包',
              '',
              '内容范围：2020—2025年完整年度报告，以及截至2026年8月30日最新披露的2026年半年度报告。',
              '若年度报告列表存在修订版或更正版，本包按公告列表顺序优先采用后续版本。',
              '',
              '校验项目：PDF文件头与EOF、pdfinfo可解析页数、公司名称/证券代码、报告年度与标题、SHA-256、ZIP CRC。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f'- {record["title"]}',
                  f'  报告年度：{record["report_year"]}',
                  f'  披露日期：{record["disclosure_date"]}',
                  f'  文件：{record["file"]}',
                  f'  页数：{record["pages"]}',
                  f'  大小：{record["bytes"]} bytes',
                  f'  SHA256：{record["sha256"]}',
                  f'  公告详情：{record["detail_url"]}',
                  f'  PDF来源：{record["source_url"]}',
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '卓越新能_688196_2020-2025年报_2026年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: zhuoyue-new-energy-filings-final
          path: 卓越新能_688196_2020-2025年报_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
