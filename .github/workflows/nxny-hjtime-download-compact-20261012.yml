name: Compact inspect Nxny HJTime download controls 20261012

on:
  push:
    paths:
      - '.github/workflows/nxny-hjtime-download-compact-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Print only relevant download controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          from bs4 import BeautifulSoup
          ids=['6218779','6215721','6192890','6080394','5469759']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.nxny.com/stock/stock_603101/','Accept-Language':'zh-CN,zh;q=0.9'})
          scripts=set()
          for rid in ids:
            url=f'https://www.nxny.com/report/view_{rid}.html'
            r=s.get(url,timeout=(15,60),allow_redirects=True)
            print('PAGE',rid,r.status_code,len(r.content),r.url,flush=True)
            soup=BeautifulSoup(r.text,'lxml')
            relevant=[]
            for tag in soup.find_all(True):
              attrs={k:str(v) for k,v in tag.attrs.items()}
              text=' '.join(tag.get_text(' ',strip=True).split())
              blob=(tag.name+' '+text+' '+json.dumps(attrs,ensure_ascii=False)).lower()
              if any(k in blob for k in ('下载','download','pdf','file','login','登录','会员','无限制')):
                relevant.append({'tag':tag.name,'text':text[:300],'attrs':attrs})
              if tag.name=='script' and tag.get('src'):
                scripts.add(urllib.parse.urljoin(r.url,tag['src']))
            print('CONTROLS',rid,json.dumps(relevant[:120],ensure_ascii=False),flush=True)
            # Print short literal strings around IDs/download only.
            for pattern in [rid,'download','pdf','下载','getfile','fileurl','login']:
              out=[]
              for m in list(re.finditer(pattern,r.text,re.I))[:20]:
                out.append(r.text[max(0,m.start()-180):min(len(r.text),m.end()+300)].replace('\n',' '))
              if out: print('HTML_SNIP',rid,pattern,json.dumps(out,ensure_ascii=False),flush=True)
          for url in sorted(scripts):
            r=s.get(url,timeout=(15,60)); text=r.text
            hits=[]
            for pattern in ('download','pdf','getfile','fileurl','report/view','login','member'):
              for m in list(re.finditer(pattern,text,re.I))[:30]:
                hits.append(text[max(0,m.start()-180):min(len(text),m.end()+320)])
            if hits:
              print('SCRIPT_HITS',url,json.dumps(list(dict.fromkeys(hits))[:80],ensure_ascii=False),flush=True)
          PY
