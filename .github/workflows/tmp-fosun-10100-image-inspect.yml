name: Temporary Fosun 10100 article image inspection

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-10100-image-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 Pillow
      - name: Download and inspect report images
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, json, re
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageOps

          out=Path('fosun_10100_inspection'); imgdir=out/'images'; out.mkdir(); imgdir.mkdir()
          url='https://www.10100.com/article/31874150'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Referer':url})
          r=s.get(url,timeout=60); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          urls=[]
          for img in soup.find_all('img'):
            src=img.get('src') or img.get('data-src')
            if src and 'cdn.10100.com/content/' in src and src not in urls:
              urls.append(src)
          records=[]
          thumbs=[]
          for i,src in enumerate(urls,1):
            rr=s.get(src,timeout=45); rr.raise_for_status()
            data=rr.content
            path=imgdir/f'{i:03d}.png'; path.write_bytes(data)
            with Image.open(io.BytesIO(data)) as im:
              im.load(); rgb=im.convert('RGB'); w,h=rgb.size
              rec={'index':i,'url':src,'bytes':len(data),'width':w,'height':h,'format':im.format,'sha256':hashlib.sha256(data).hexdigest()}
              # OCR-free visual signals.
              rec['aspect']=round(w/h,4) if h else None
              rec['likely_page']=bool(h>w and h>=900 and w>=600)
              records.append(rec)
              thumb=ImageOps.contain(rgb,(260,360))
              canvas=Image.new('RGB',(280,400),'white')
              canvas.paste(thumb,((280-thumb.width)//2,20))
              draw=ImageDraw.Draw(canvas); draw.text((10,375),f'{i}: {w}x{h}',fill='black')
              thumbs.append(canvas)
            print('IMAGE',json.dumps(rec,ensure_ascii=False))
          cols=4; rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*280,rows*400),'white')
          for idx,thumb in enumerate(thumbs): sheet.paste(thumb,((idx%cols)*280,(idx//cols)*400))
          sheet.save(out/'contact_sheet.jpg',quality=88)
          (out/'images.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(records),'LIKELY_PAGES',sum(x['likely_page'] for x in records))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fosun-10100-image-inspection
          path: fosun_10100_inspection/
          retention-days: 1
          if-no-files-found: error
