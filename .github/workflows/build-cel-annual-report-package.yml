name: Build verified CEL annual report package

on:
  push:
    branches:
      - tmp/cel-final-package-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf
      - name: Download, validate, render and package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out/pdfs out/renders
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests, pymupdf
          from pypdf import PdfReader
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          OUT=Path('out'); PDFDIR=OUT/'pdfs'; RENDER=OUT/'renders'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          session=requests.Session(); session.headers.update({'User-Agent':UA,'Accept':'application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})

          reports=[
            {'period':'2020年年度报告','year':'2020','filename':'中国光大控股_2020年年度报告.pdf','min_pages':120,'candidates':[
              'https://www.everbright.com/sites/default/files/results-announcements/C_Annual%20Report_0.pdf',
              'https://www.everbright.com/sites/default/files/results-announcements/C_Annual%20Report.pdf',
            ]},
            {'period':'2021年年度报告','year':'2021','filename':'中国光大控股_2021年年度报告.pdf','min_pages':120,'candidates':[
              'https://www.everbright.com/sites/default/files/results-announcements/C%20Annual%20Report.pdf',
            ]},
            {'period':'2022年年度报告','year':'2022','filename':'中国光大控股_2022年年度报告.pdf','min_pages':120,'candidates':[
              'https://www.everbright.com/sites/default/files/results-announcements/cw0165_Annual%20Report.pdf',
            ]},
            {'period':'2023年年度报告','year':'2023','filename':'中国光大控股_2023年年度报告.pdf','min_pages':120,'candidates':[
              'https://www.everbright.com/sites/default/files/results-announcements/CW001651-AR23.pdf',
            ]},
            {'period':'2024年年度报告','year':'2024','filename':'中国光大控股_2024年年度报告.pdf','min_pages':120,'candidates':[
              'https://www.everbright.com/sites/default/files/results-announcements/CW00165-AR24.pdf',
              'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0415/2025041500754.pdf',
            ]},
            {'period':'2025年年度报告','year':'2025','filename':'中国光大控股_2025年年度报告.pdf','min_pages':120,'candidates':[
              'https://www.everbright.com/sites/default/files/results-announcements/C%20Annual%20Report_0.pdf',
              'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0416/2026041601914.pdf',
            ]},
            {'period':'2026年中期业绩公告','year':'2026','filename':'中国光大控股_2026年中期业绩公告.pdf','min_pages':20,'candidates':[
              'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0827/2026082701530_c.pdf',
              'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0827/2026082701529.pdf',
            ]},
          ]

          def norm(s:str)->str:
              return re.sub(r'\s+','',s).lower()

          records=[]
          for item in reports:
              data=None; source=None; attempts=[]
              for url in item['candidates']:
                  try:
                      r=session.get(url,timeout=(15,120),allow_redirects=True,verify=False,headers={'Referer':'https://www.everbright.com/' if 'everbright.com' in url else 'https://www1.hkexnews.hk/'})
                      attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'final_url':r.url})
                      if r.status_code==200 and len(r.content)>100000 and r.content.lstrip().startswith(b'%PDF'):
                          data=r.content; source=r.url; break
                  except Exception as e:
                      attempts.append({'url':url,'error':repr(e)})
              if data is None:
                  raise RuntimeError(f"Failed to download {item['period']}: {attempts}")
              path=PDFDIR/item['filename']; path.write_bytes(data)
              reader=PdfReader(str(path),strict=False)
              pages=len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f"{item['period']}: only {pages} pages")
              encrypted=reader.is_encrypted
              if encrypted:
                  try: reader.decrypt('')
                  except Exception: pass

              doc=pymupdf.open(str(path))
              sample_indices=sorted(set(list(range(min(20,pages)))+[pages//2,pages-1]))
              text='\n'.join(doc.load_page(i).get_text('text') for i in sample_indices)
              compact=norm(text)
              metadata=' '.join(str(v or '') for v in [reader.metadata.title if reader.metadata else '', reader.metadata.subject if reader.metadata else ''])
              meta_compact=norm(metadata)
              company_ok=('中國光大控股' in text or '中国光大控股' in text or 'chinaeverbrightlimited' in compact or 'chinaebltd' in compact or 'chinaeverbrightlimited' in meta_compact)
              year_ok=item['year'] in text or item['year'] in compact or item['year'] in metadata
              if not company_ok:
                  raise RuntimeError(f"{item['period']}: company identity not found in sampled text or metadata")
              if not year_ok:
                  raise RuntimeError(f"{item['period']}: expected year {item['year']} not found in sampled text or metadata")
              if item['year']=='2026':
                  period_ok=('中期業績' in text or '中期业绩' in text or ('interimresults' in compact and '30june2026' in compact))
                  if not period_ok:
                      raise RuntimeError(f"{item['period']}: interim report type not found")
              else:
                  period_ok=('年度報告' in text or '年度报告' in text or 'annualreport' in compact or 'annualreport' in meta_compact)

              for label,idx in [('first',0),('middle',pages//2),('last',pages-1)]:
                  page=doc.load_page(idx)
                  pix=page.get_pixmap(matrix=pymupdf.Matrix(1.25,1.25),alpha=False)
                  pix.save(str(RENDER/f"{item['year']}_{label}.png"))
              doc.close()
              digest=hashlib.sha256(data).hexdigest()
              records.append({
                  'period':item['period'],'filename':item['filename'],'pages':pages,'bytes':len(data),
                  'sha256':digest,'source_url':source,'encrypted':bool(encrypted),
                  'company_check':company_ok,'year_check':year_ok,'report_type_text_check':period_ok,
                  'download_attempts':attempts,
              })
              print('VERIFIED',json.dumps(records[-1],ensure_ascii=False),flush=True)

          total_pages=sum(r['pages'] for r in records)
          readme=[
            '中国光大控股有限公司（香港交易所股份代号：00165）财务报告包','',
            '范围：2020-2025年完整年度报告，以及目前最新正式财务披露——2026年中期业绩公告。','',
            '说明：香港上市公司通常不按A股口径披露一季报/三季报；截至2026年8月31日，中国光大控股最新正式财务披露为2026年8月27日发布的2026年中期业绩公告，因此以其作为“最新季报口径”文件。','',
            f'PDF数量：{len(records)}份',f'合计页数：{total_pages}页','',
          ]
          for i,r in enumerate(records,1):
              readme.append(f"{i}. {r['period']}｜{r['pages']}页｜{r['filename']}")
          readme += ['',
            '来源：年度报告来自中国光大控股官方网站投资者关系附件；2026年中期业绩公告来自港交所披露易官方PDF。',
            '校验：PDF文件头、可解析性、实际页数、公司名称和报告年份；并渲染检查每份PDF的首页、中间页和末页。',
            '压缩包另附来源链接、逐文件SHA-256和机器可读校验清单。',
            '文件仅供研究参考，版权归原发布机构及相关权利人所有。']
          (OUT/'README_来源与校验.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'来源链接.txt').write_text('\n'.join(f"{r['period']}\n{r['source_url']}\n" for r in records),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['filename']}" for r in records)+'\n',encoding='utf-8')
          (OUT/'verification.json').write_text(json.dumps({'company':'中国光大控股有限公司','stock_code':'00165','records':records,'total_pages':total_pages},ensure_ascii=False,indent=2),encoding='utf-8')

          zip_path=OUT/'中国光大控股_2020-2025年报及2026年中期业绩公告.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,allowZip64=True) as z:
              for p in sorted(PDFDIR.glob('*.pdf')): z.write(p,p.name)
              for name in ['README_来源与校验.txt','来源链接.txt','SHA256SUMS.txt','verification.json']:
                  z.write(OUT/name,name)
          with zipfile.ZipFile(zip_path) as z:
              if z.testzip() is not None: raise RuntimeError('ZIP CRC validation failed')
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=7: raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs, expected 7')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          summary={'zip':zip_path.name,'zip_bytes':zip_path.stat().st_size,'zip_sha256':zip_sha,'total_pages':total_pages,'records':records}
          (OUT/'package_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PACKAGE_SUMMARY',json.dumps(summary,ensure_ascii=False),flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: cel-2020-2025-annual-reports-and-2026-interim
          path: |
            out/中国光大控股_2020-2025年报及2026年中期业绩公告.zip
            out/package_summary.json
            out/README_来源与校验.txt
            out/SHA256SUMS.txt
            out/renders/*.png
          if-no-files-found: error
          retention-days: 7