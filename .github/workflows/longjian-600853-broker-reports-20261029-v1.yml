name: Package Longjian 600853 broker deep reports

on:
  push:
    branches:
      - tmp/longjian-broker-reports-20261029-v1
    paths:
      - .github/workflows/longjian-600853-broker-reports-20261029-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = "600853"
          SHORT = "龙建股份"
          FULL = "龙建路桥股份有限公司"
          PREPARED = "2026-10-29"
          ROOT_NAME = "龙建股份_600853_券商深度报告_2份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF原件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "date": "2018-07-04",
                  "broker": "天风证券",
                  "analyst": "唐笑、岳恒宇；联系人：肖文劲、陈航杰",
                  "rating": "买入（维持评级）",
                  "report_type": "公司深度研究",
                  "title": "乘风破浪推进省外布局，非公开发行提振公司实力",
                  "info_code": "AP201807041162723188",
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP201807041162723188_1.pdf",
                  "expected_pages": 24,
              },
              {
                  "date": "2017-04-11",
                  "broker": "天风证券",
                  "analyst": "唐笑",
                  "rating": "买入（首次评级）",
                  "report_type": "首次覆盖报告",
                  "title": "订单营收超额完成目标，PPP项目落地加快",
                  "info_code": "AP201704140506787543",
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP201704140506787543_1.pdf",
                  "expected_pages": None,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer": "https://data.eastmoney.com/report/600853.html",
              "Accept": "application/pdf,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text)
              return re.sub(r"\s+", " ", text).strip(" ._")[:170]

          manifest = []
          for idx, spec in enumerate(reports, 1):
              data = None
              used_url = None
              attempts = []
              urls = [
                  spec["url"],
                  spec["url"].replace("/H3_", "/H2_"),
                  spec["url"].replace("/H3_", "/H1_"),
              ]
              for url in urls:
                  for attempt in range(5):
                      try:
                          response = session.get(url, timeout=(30, 420), allow_redirects=True)
                          rec = {
                              "url": url,
                              "status": response.status_code,
                              "bytes": len(response.content),
                              "content_type": response.headers.get("content-type", ""),
                              "magic": response.content[:8].hex(),
                              "final_url": response.url,
                          }
                          attempts.append(rec)
                          print("PDF_REQUEST", json.dumps(rec, ensure_ascii=False))
                          if response.status_code == 200 and response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                              data = response.content
                              used_url = response.url
                              break
                      except Exception as exc:
                          attempts.append({"url": url, "error": repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"Could not download {spec['title']}: {attempts}")

              filename = safe_name(
                  f"{idx:02d}_{spec['date'].replace('-', '')}_{spec['broker']}_{spec['title']}.pdf"
              )
              pdf_path = PDF_DIR / filename
              pdf_path.write_bytes(data)

              reader = PdfReader(str(pdf_path), strict=False)
              pages = len(reader.pages)
              if pages < 8:
                  raise RuntimeError(f"Report too short for deep/coverage report: {filename}, pages={pages}")
              if spec["expected_pages"] is not None and pages != spec["expected_pages"]:
                  raise RuntimeError(
                      f"Unexpected page count for {filename}: {pages}, expected {spec['expected_pages']}"
                  )

              text_parts = []
              for page in reader.pages[: min(15, pages)]:
                  try:
                      text_parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              sample_text = "\n".join(text_parts)
              if not any(token in sample_text for token in [SHORT, FULL, CODE]):
                  raise RuntimeError(f"Issuer validation failed for {filename}")
              title_tokens = [x for x in re.split(r"[，、：；。“”\s]+", spec["title"]) if len(x) >= 4]
              if title_tokens and not any(token in sample_text for token in title_tokens[:5]):
                  raise RuntimeError(f"Title validation failed for {filename}")
              if spec["broker"] not in sample_text and "天风证券研究所" not in sample_text:
                  raise RuntimeError(f"Broker validation failed for {filename}")

              q = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(pdf_path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if q.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {filename}: {q.stdout}")

              prefix = PREVIEW_DIR / pdf_path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(pdf_path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")

              manifest.append({
                  **spec,
                  "filename": filename,
                  "actual_pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "pdf_url": used_url,
                  "detail_url": f"https://data.eastmoney.com/report/info/{spec['info_code']}.html",
                  "preview_file": str(Path("首页预览") / preview.name),
                  "download_attempts": attempts,
              })

          readme = [
              f"龙建股份（{CODE}.SH）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录2份公开可直接下载的券商原始PDF：1份公司深度研究和1份首次覆盖报告。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   券商：{item['broker']}；报告类型：{item['report_type']}；研究员：{item['analyst']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   评级：{item['rating']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['detail_url']}",
                  f"   原始PDF：{item['pdf_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、报告标题、券商标识、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "未使用网页摘要替代券商原始PDF。",
          ]
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "all_files_are_original_broker_pdfs": True,
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as f:
              writer = csv.writer(f)
              writer.writerow(["文件名", "报告类型", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256", "来源页面", "PDF地址"])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["report_type"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"],
                      item["actual_pages"], item["bytes"], item["sha256"], item["detail_url"], item["pdf_url"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF原件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("longjian_600853_broker_deep_reports_2.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      z.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as z:
              bad = z.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "files": [{k: item[k] for k in ["filename", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256", "detail_url", "pdf_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: longjian-600853-broker-deep-reports-2-20261029
          path: |
            longjian_600853_broker_deep_reports_2.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
