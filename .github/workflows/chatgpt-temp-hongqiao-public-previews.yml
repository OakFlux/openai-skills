name: chatgpt-temp-hongqiao-public-previews
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-hongqiao-public-previews.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download openly displayed preview pages and build PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pillow pypdf pymupdf
          python <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader
          import fitz

          W=Path('hongqiao_public_previews');P=W/'PDF';R=W/'renders';P.mkdir(parents=True,exist_ok=True);R.mkdir(parents=True,exist_ok=True)
          reports=[
            {
              'key':'west_2025','institution':'西部证券','report_date':'2025-04-21','public_upload_date':'2025-05-07',
              'title':'中国宏桥首次覆盖报告：高景气+一体化+高分红，电解铝龙头静待价值重估',
              'original_pages':27,'included_pages':10,'page_base':'https://oss.sdyanbao.com/page/2025/5/7/1191962',
              'source_page':'https://www.sdyanbao.com/detail/886387',
              'filename':'2025-04-21_西部证券_中国宏桥_首次覆盖_公开预览前10页.pdf'
            },
            {
              'key':'huachuang_2025','institution':'华创证券','report_date':'2025-05-27','public_upload_date':'2025-06-03',
              'title':'中国宏桥深度研究报告：全球电解铝龙头，一体化打造盈利护城河，高分红属性明显',
              'original_pages':28,'included_pages':10,'page_base':'https://oss.sdyanbao.com/page/2025/6/3/1200934',
              'source_page':'https://www.sdyanbao.com/detail/892745',
              'filename':'2025-05-27_华创证券_中国宏桥_深度研究_公开预览前10页.pdf'
            },
            {
              'key':'eastmoney_2025','institution':'东方财富证券','report_date':'2025-08-05','public_upload_date':'2025-08-12',
              'title':'中国宏桥深度研究：产业升级顺势而为，前瞻布局穿越周期',
              'original_pages':38,'included_pages':10,'page_base':'https://oss.sdyanbao.com/page/2025/8/12/1220739',
              'source_page':'https://www.sdyanbao.com/detail/904914',
              'filename':'2025-08-05_东方财富证券_中国宏桥_深度研究_公开预览前10页.pdf'
            },
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://www.sdyanbao.com/'})
          manifest=[]
          for rec in reports:
            imgdir=W/rec['key'];imgdir.mkdir(exist_ok=True);imgs=[]
            for i in range(rec['included_pages']):
              url=f"{rec['page_base']}/{i}.png";r=s.get(url,timeout=120)
              print('PAGE',rec['key'],i,r.status_code,len(r.content),r.headers.get('content-type'),url,flush=True)
              if r.status_code!=200 or not r.content.startswith(b'\x89PNG') or len(r.content)<10000:raise RuntimeError(f'bad page {rec["key"]} {i}')
              f=imgdir/f'{i:02d}.png';f.write_bytes(r.content);im=Image.open(f).convert('RGB');imgs.append(im.copy());im.close()
            out=P/rec['filename'];imgs[0].save(out,save_all=True,append_images=imgs[1:],resolution=144.0)
            for im in imgs:im.close()
            rd=PdfReader(str(out),strict=False);pages=len(rd.pages)
            if pages!=rec['included_pages']:raise RuntimeError(f'page mismatch {out} {pages}')
            doc=fitz.open(str(out));checks=[]
            for idx,tag in [(0,'first'),(pages//2,'middle'),(pages-1,'last')]:
              pix=doc[idx].get_pixmap(matrix=fitz.Matrix(0.5,0.5),alpha=False);png=R/f"{rec['key']}_{tag}.png";pix.save(str(png));checks.append({'page':idx+1,'render_bytes':png.stat().st_size})
              if png.stat().st_size<10000:raise RuntimeError(f'bad render {out} {idx}')
            doc.close()
            item={**rec,'pdf_pages':pages,'size_bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'render_checks':checks,'status':'公开预览（仅含来源页面明确公开展示的前10页；不是原始完整版）'}
            manifest.append(item);print('VERIFIED',json.dumps(item,ensure_ascii=False),flush=True)
          readme=['# 中国宏桥（01378.HK）券商深度报告公开预览资料包','',
            '本资料包包含三份券商深度报告的公开预览版，每份仅收录研报平台明确公开展示的前10页。',
            '原始完整版下载入口要求登录；本资料包未绕过登录、会员或其他访问限制。','',
            '| 报告日期 | 券商 | 报告题目 | 原报告页数 | 本包页数 |','|---|---|---|---:|---:|']
          for x in manifest:readme.append(f"| {x['report_date']} | {x['institution']} | {x['title']} | {x['original_pages']} | {x['included_pages']} |")
          readme+=['','每份文件名均标明“公开预览前10页”。来源及校验值见 manifest.json 与 SHA256SUMS.txt。']
          (W/'README.md').write_text('\n'.join(readme)+'\n',encoding='utf-8');(W/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8');(W/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  PDF/{x['filename']}" for x in manifest)+'\n',encoding='utf-8')
          z=Path('China_Hongqiao_01378_Public_Preview_Reports_3.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for f in sorted(W.rglob('*')):
              if f.is_file() and R not in f.parents and not any(part in [x['key'] for x in reports] for part in f.parts):zz.write(f,f.relative_to(W.parent))
          with zipfile.ZipFile(z) as zz:
            if zz.testzip():raise RuntimeError('zip corrupt')
          meta={'archive':z.name,'archive_bytes':z.stat().st_size,'archive_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'reports':manifest}
          Path('preview_meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');print('FINAL',json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: China-Hongqiao-Public-Preview-Reports
          path: |
            China_Hongqiao_01378_Public_Preview_Reports_3.zip
            preview_meta.json
            hongqiao_public_previews/PDF
            hongqiao_public_previews/manifest.json
            hongqiao_public_previews/README.md
            hongqiao_public_previews/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
