name: Build ST Guangtang 000911 public archive ZIP 20261004

on:
  push:
    paths:
      - '.github/workflows/st-guangtang-000911-public-archive-package-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests beautifulsoup4 lxml reportlab pypdf

      - name: Fetch public pages and build transparent archive PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.platypus import (
              BaseDocTemplate,
              Frame,
              PageTemplate,
              Paragraph,
              Spacer,
              Table,
              TableStyle,
              PageBreak,
          )

          PACKAGE = 'ST广糖_000911_历史券商深度报告公开摘要归档_3份'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'index': 1,
                  'rid': '514910001977',
                  'broker_display': '长江证券股份有限公司',
                  'analysts': '陈佳',
                  'date': '2016-04-25',
                  'title': '南宁糖业（000911）深度报告：糖价上涨中最纯正的受益标的',
              },
              {
                  'index': 2,
                  'rid': '513245298881',
                  'broker_display': '国泰海通证券股份有限公司（新浪页面当前显示）',
                  'analysts': '王乾、钱浩',
                  'date': '2016-04-06',
                  'title': '南宁糖业（000911）深度研究：受益糖价上行，并购、改革值得期待',
              },
              {
                  'index': 3,
                  'rid': '486053137402',
                  'broker_display': '国投证券股份有限公司（新浪页面当前显示）',
                  'analysts': '吴立、刘哲铭',
                  'date': '2015-05-27',
                  'title': '南宁糖业（000911）深度分析：糖价向上，业绩拐点已现',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          pdfmetrics.registerFont(UnicodeCIDFont('STSong-Light'))
          FONT = 'STSong-Light'

          styles = getSampleStyleSheet()
          title_style = ParagraphStyle(
              'CnTitle', parent=styles['Title'], fontName=FONT, fontSize=18,
              leading=25, alignment=TA_CENTER, textColor=colors.HexColor('#14213D'),
              spaceAfter=10 * mm, wordWrap='CJK',
          )
          subtitle_style = ParagraphStyle(
              'CnSubtitle', parent=styles['Heading2'], fontName=FONT, fontSize=12.5,
              leading=18, alignment=TA_CENTER, textColor=colors.HexColor('#9C2A2A'),
              spaceAfter=6 * mm, wordWrap='CJK',
          )
          heading_style = ParagraphStyle(
              'CnHeading', parent=styles['Heading2'], fontName=FONT, fontSize=13,
              leading=19, textColor=colors.HexColor('#14213D'), spaceBefore=4 * mm,
              spaceAfter=2.5 * mm, wordWrap='CJK',
          )
          body_style = ParagraphStyle(
              'CnBody', parent=styles['BodyText'], fontName=FONT, fontSize=10.5,
              leading=18, alignment=TA_LEFT, firstLineIndent=2 * 10.5,
              spaceAfter=3.5 * mm, wordWrap='CJK',
          )
          note_style = ParagraphStyle(
              'CnNote', parent=styles['BodyText'], fontName=FONT, fontSize=9,
              leading=15, textColor=colors.HexColor('#555555'), spaceAfter=2 * mm,
              wordWrap='CJK',
          )
          meta_style = ParagraphStyle(
              'CnMeta', parent=styles['BodyText'], fontName=FONT, fontSize=9.5,
              leading=15, textColor=colors.HexColor('#202020'), wordWrap='CJK',
          )

          def safe(s: str) -> str:
              return html.escape(s, quote=True).replace('\n', '<br/>')

          def split_paragraphs(text: str) -> list[str]:
              text = text.replace('\u3000', ' ').replace('\xa0', ' ')
              text = re.sub(r'[ \t]+', ' ', text)
              text = re.sub(r'\n\s*\n+', '\n', text)
              parts = [p.strip() for p in text.split('\n') if p.strip()]
              if len(parts) <= 2:
                  # The archive page often stores the summary as one block. Split at likely headings.
                  markers = [
                      '报告要点', '投资要点', '行业层面', '糖价进入上涨周期',
                      '南宁糖业:', '受益糖价上行', '供给持续收缩', '行业进入并购窗口期',
                      '剥离亏损资产', '资金充足', '参与土地流转', '投资建议', '风险提示',
                      '给予南宁糖业', '横向比较', '纵向比较',
                  ]
                  block = parts[0] if parts else text.strip()
                  for marker in markers:
                      block = block.replace(marker, '\n' + marker)
                  parts = [p.strip() for p in block.split('\n') if p.strip()]
              # Keep reasonable paragraph lengths for CJK layout.
              out: list[str] = []
              for part in parts:
                  while len(part) > 520:
                      cut = max(part.rfind('。', 0, 500), part.rfind('；', 0, 500))
                      if cut < 180:
                          cut = 500
                      else:
                          cut += 1
                      out.append(part[:cut].strip())
                      part = part[cut:].strip()
                  if part:
                      out.append(part)
              return out

          def header_footer(canvas, doc):
              canvas.saveState()
              canvas.setFont(FONT, 8.5)
              canvas.setFillColor(colors.HexColor('#6B7280'))
              canvas.drawString(18 * mm, 12 * mm, 'ST广糖（000911.SZ）历史券商研究资料 · 公开摘要归档版')
              canvas.drawRightString(192 * mm, 12 * mm, f'第 {doc.page} 页')
              canvas.restoreState()

          def create_pdf(path: Path, report: dict, page_title: str, broker: str, analyst: str, date: str, body_text: str, source_url: str):
              doc = BaseDocTemplate(
                  str(path), pagesize=A4,
                  leftMargin=20 * mm, rightMargin=20 * mm,
                  topMargin=18 * mm, bottomMargin=20 * mm,
                  title=page_title,
                  author=broker,
                  subject='公开网页摘要归档，非券商原始排版全文',
              )
              frame = Frame(doc.leftMargin, doc.bottomMargin, doc.width, doc.height, id='normal')
              doc.addPageTemplates([PageTemplate(id='archive', frames=frame, onPage=header_footer)])

              story = [
                  Paragraph(safe(page_title), title_style),
                  Paragraph('公开摘要归档版（非券商原始排版 PDF）', subtitle_style),
              ]

              meta = [
                  ['证券代码', '000911.SZ'],
                  ['报告机构', broker],
                  ['研究员', analyst],
                  ['报告日期', date],
                  ['归档来源', '新浪财经研究报告公开页面'],
              ]
              table = Table(meta, colWidths=[28 * mm, 132 * mm], hAlign='LEFT')
              table.setStyle(TableStyle([
                  ('FONTNAME', (0, 0), (-1, -1), FONT),
                  ('FONTSIZE', (0, 0), (-1, -1), 9.5),
                  ('LEADING', (0, 0), (-1, -1), 15),
                  ('BACKGROUND', (0, 0), (0, -1), colors.HexColor('#EEF2F7')),
                  ('TEXTCOLOR', (0, 0), (0, -1), colors.HexColor('#14213D')),
                  ('GRID', (0, 0), (-1, -1), 0.35, colors.HexColor('#CBD5E1')),
                  ('VALIGN', (0, 0), (-1, -1), 'TOP'),
                  ('LEFTPADDING', (0, 0), (-1, -1), 7),
                  ('RIGHTPADDING', (0, 0), (-1, -1), 7),
                  ('TOPPADDING', (0, 0), (-1, -1), 6),
                  ('BOTTOMPADDING', (0, 0), (-1, -1), 6),
              ]))
              story.extend([
                  table,
                  Spacer(1, 6 * mm),
                  Paragraph(
                      '版本说明：券商原始排版全文目前没有可公开、免登录直接下载的稳定入口。'
                      '本文件仅归档公开网页展示的报告摘要与投资要点，未绕过会员或付费权限，'
                      '不应被误认为券商原始全文。', note_style),
                  Paragraph('公开摘要与要点', heading_style),
              ])

              for para in split_paragraphs(body_text):
                  story.append(Paragraph(safe(para), body_style))

              story.extend([
                  Spacer(1, 4 * mm),
                  Paragraph('来源与校验', heading_style),
                  Paragraph('公开页面：' + safe(source_url), note_style),
                  Paragraph('归档日期：2026-10-04。材料仅供研究参考，不构成投资建议。', note_style),
              ])
              doc.build(story)

          records = []
          for report in reports:
              source_url = f"https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{report['rid']}/index.phtml"
              response = session.get(source_url, timeout=60)
              print('FETCH', report['rid'], response.status_code, len(response.content), source_url, flush=True)
              response.raise_for_status()
              text = response.content.decode('gb18030', errors='replace')
              soup = BeautifulSoup(text, 'lxml')

              h1 = soup.select_one('h1')
              page_title = re.sub(r'\s+', ' ', h1.get_text(' ', strip=True)) if h1 else report['title']
              content_node = soup.select_one('div.blk_container')
              if not content_node:
                  raise RuntimeError(f"public summary block missing for {report['rid']}")
              body_text = content_node.get_text('\n', strip=True)
              body_text = re.sub(r'\r', '', body_text)
              if len(re.sub(r'\s+', '', body_text)) < 450:
                  raise RuntimeError(f"public summary unexpectedly short for {report['rid']}: {len(body_text)}")

              content_all = soup.select_one('div.content')
              content_text = re.sub(r'\s+', ' ', content_all.get_text(' ', strip=True)) if content_all else ''
              broker_m = re.search(r'机构：\s*(.*?)\s*研究员：', content_text)
              analyst_m = re.search(r'研究员：\s*(.*?)\s*日期：', content_text)
              date_m = re.search(r'日期：\s*(20\d{2}-\d{2}-\d{2})', content_text)
              broker = broker_m.group(1).strip() if broker_m else report['broker_display']
              analyst = analyst_m.group(1).strip() if analyst_m else report['analysts']
              date = date_m.group(1) if date_m else report['date']

              clean_title = re.sub(r'[\\/:*?"<>|]+', '_', page_title)
              filename = f"{report['index']:02d}_{date}_{broker.split('股份')[0]}_{clean_title[:45]}_公开摘要归档版.pdf"
              pdf_path = OUT / filename
              create_pdf(pdf_path, report, page_title, broker, analyst, date, body_text, source_url)

              check = subprocess.run(['qpdf', '--warning-exit-0', '--check', str(pdf_path)], capture_output=True, text=True)
              if check.returncode != 0:
                  raise RuntimeError(f'qpdf validation failed for {filename}: {check.stderr[-1500:]}')
              pages = len(PdfReader(str(pdf_path), strict=False).pages)
              if pages < 1 or pages > 10:
                  raise RuntimeError(f'unexpected page count for {filename}: {pages}')
              render_root = OUT / (pdf_path.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(pdf_path), str(render_root)],
                  capture_output=True, text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed for {filename}: {render.stderr[-1000:]}')
              render_size = render_file.stat().st_size
              render_file.unlink(missing_ok=True)

              data = pdf_path.read_bytes()
              record = {
                  'filename': filename,
                  'title': page_title,
                  'broker_as_displayed': broker,
                  'analysts': analyst,
                  'date': date,
                  'source_url': source_url,
                  'source_report_id': report['rid'],
                  'archive_type': '公开摘要归档版，非券商原始排版全文',
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)
              time.sleep(0.2)

          readme = [
              'ST广糖（000911.SZ；历史名称：南宁糖业）历史券商深度报告公开摘要归档',
              '整理日期：2026-10-04',
              '',
              '重要说明：',
              '1. 本包中的3份PDF不是券商原始排版全文，而是依据新浪财经仍公开展示的报告摘要和投资要点制作的归档版。',
              '2. 已检索到2021年中泰证券19页深度报告《改革风劲涅槃重生，糖价助力亟待飞扬》，但公开页面要求会员权限，故未绕过权限下载或收入本包。',
              '3. 对历史券商名称，新浪页面可能按机构现名统一显示；PDF和manifest保留页面当前显示方式。',
              '4. 全部归档PDF均标明版本性质、来源页面和报告ID，不冒充券商原始文件。',
              '',
              '收录清单：',
          ]
          for i, r in enumerate(records, 1):
              readme.extend([
                  f"{i}. {r['title']}",
                  f"   机构：{r['broker_as_displayed']}；研究员：{r['analysts']}；日期：{r['date']}；归档PDF页数：{r['pages']}",
                  f"   文件：{r['filename']}",
                  f"   来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ])

          (OUT / '00_版本说明与报告清单.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'expected 3 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: st-guangtang-000911-public-deep-report-archive-20261004
          path: ST广糖_000911_历史券商深度报告公开摘要归档_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
