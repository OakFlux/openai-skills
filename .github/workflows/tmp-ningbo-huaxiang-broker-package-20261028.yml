name: Build Ningbo Huaxiang broker research package

on:
  push:
    branches:
      - tmp-ningbo-huaxiang-broker-reports-20261028

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 trafilatura weasyprint pypdf

      - name: Download, render, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='宁波华翔_002048_券商研究资料_3份'
          mkdir -p "$PACKAGE" /tmp/nbhx_broker_check

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path

          import requests
          import trafilatura
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from weasyprint import HTML

          OUT = Path('宁波华翔_002048_券商研究资料_3份')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8, backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=6, pool_maxsize=6))
          session.headers.update({
              'User-Agent': UA,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def fetch(url: str, *, accept: str = '*/*', referer: str | None = None) -> requests.Response:
              last = None
              for attempt in range(8):
                  try:
                      headers = {'Accept': accept}
                      if referer:
                          headers['Referer'] = referer
                      response = session.get(url, headers=headers, timeout=(30, 360), allow_redirects=True)
                      if response.status_code == 200:
                          return response
                      last = RuntimeError(f'HTTP {response.status_code}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 + attempt, 10))
              raise RuntimeError(f'fetch failed: {url}; last={last!r}')

          def decode_response(response: requests.Response) -> str:
              raw = response.content
              ctype = (response.headers.get('content-type') or '').lower()
              encodings = []
              if any(key in ctype for key in ('gbk', 'gb2312', 'gb18030')):
                  encodings.append('gb18030')
              encodings.extend([response.encoding, response.apparent_encoding, 'utf-8', 'gb18030'])
              seen = set()
              best = None
              for encoding in encodings:
                  if not encoding or encoding in seen:
                      continue
                  seen.add(encoding)
                  try:
                      text = raw.decode(encoding)
                  except Exception:
                      continue
                  score = text.count('\ufffd')
                  if best is None or score < best[0]:
                      best = (score, text)
              return best[1] if best else raw.decode('utf-8', errors='replace')

          def clean_public_text(text: str, title: str, required: list[str]) -> str:
              text = text.replace('\u3000', ' ').replace('\xa0', ' ')
              text = re.sub(r'\r\n?', '\n', text)
              text = re.sub(r'[ \t]+', ' ', text)
              lines = []
              seen_short = set()
              noise_exact = {
                  '首页', '登录', '注册', '下载', '立即下载', '返回顶部', '举报',
                  '下载报告请先登录', '新会员请先注册', '相关报告', '免责声明',
              }
              for raw in text.splitlines():
                  line = raw.strip(' \t|-')
                  if not line or line in noise_exact:
                      continue
                  if any(marker in line for marker in ('下载权限：', '下载报告请先', '获取积分', 'VIP会员')):
                      continue
                  if len(line) <= 30:
                      if line in seen_short:
                          continue
                      seen_short.add(line)
                  lines.append(line)
              result = '\n'.join(lines).strip()
              positions = [result.find(key) for key in [title, '核心结论', '报告亮点', '宁波华翔是中国领先'] if result.find(key) >= 0]
              if positions:
                  start = min(positions)
                  result = result[start:]
              for stop in ('更多报告', '相关推荐', '版权声明', '网站地图'):
                  pos = result.find(stop)
                  if pos > 1000:
                      result = result[:pos]
              if len(result) < 900 or not all(key in result for key in required):
                  raise RuntimeError(f'insufficient public text: chars={len(result)} required={required}')
              return result

          def extract_public_page(url: str, title: str, required: list[str]) -> tuple[str, str]:
              response = fetch(url, accept='text/html,application/xhtml+xml,*/*;q=0.8', referer='https://www.baidu.com/')
              source_html = decode_response(response)
              extracted = trafilatura.extract(
                  source_html,
                  include_comments=False,
                  include_tables=True,
                  favor_recall=True,
                  output_format='txt',
              ) or ''
              try:
                  return clean_public_text(extracted, title, required), response.url
              except Exception:
                  soup = BeautifulSoup(source_html, 'html.parser')
                  for tag in soup(['script', 'style', 'noscript', 'svg', 'nav', 'footer', 'form', 'iframe']):
                      tag.decompose()
                  fallback = soup.get_text('\n', strip=True)
                  return clean_public_text(fallback, title, required), response.url

          def split_blocks(text: str) -> list[str]:
              chunks = re.split(r'\n\s*\n', text)
              if len(chunks) < 3:
                  chunks = text.split('\n')
              output = []
              for chunk in chunks:
                  chunk = chunk.strip()
                  if not chunk:
                      continue
                  if len(chunk) <= 700:
                      output.append(chunk)
                      continue
                  buffer = ''
                  for part in re.split(r'(?<=[。！？；])', chunk):
                      if len(buffer) + len(part) > 620 and buffer:
                          output.append(buffer.strip())
                          buffer = part
                      else:
                          buffer += part
                  if buffer.strip():
                      output.append(buffer.strip())
              return output

          def render_digest(
              filename: str,
              title: str,
              broker: str,
              analysts: str,
              date: str,
              original_pages: int,
              source: str,
              text: str,
          ) -> int:
              body = []
              for block in split_blocks(text):
                  escaped = html.escape(block).replace('\n', '<br>')
                  if re.match(r'^(核心|报告|主要逻辑|投资|盈利|风险|公司|一[、.]|二[、.]|三[、.]|四[、.]|\d+(?:\.\d+)*[、. ])', block):
                      body.append(f'<h2>{escaped}</h2>')
                  else:
                      body.append(f'<p>{escaped}</p>')
              document = f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
              @page {{ size:A4; margin:17mm 16mm 19mm; @bottom-center {{ content:counter(page); font-size:9pt; color:#666; }} }}
              body {{ font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif; color:#111; font-size:10.3pt; line-height:1.68; }}
              h1 {{ font-size:18pt; line-height:1.38; margin:0 0 7mm; }}
              h2 {{ font-size:12.7pt; line-height:1.45; margin:5.5mm 0 2.5mm; page-break-after:avoid; }}
              .meta {{ border-top:1px solid #555; border-bottom:1px solid #aaa; padding:3mm 0; margin-bottom:5mm; font-size:9.2pt; line-height:1.65; }}
              .notice {{ background:#f2f2f2; border-left:3px solid #777; padding:3.5mm 4mm; margin-bottom:6mm; font-size:9pt; }}
              p {{ margin:0 0 3.8mm; text-align:justify; orphans:3; widows:3; }}
              .source {{ border-top:1px solid #bbb; padding-top:4mm; word-break:break-all; font-size:8.5pt; color:#555; margin-top:8mm; }}
              </style></head><body>
              <h1>{html.escape(title)}</h1>
              <div class="meta">券商：{html.escape(broker)}<br>分析师：{html.escape(analysts)}<br>发布日期：{date}<br>原始报告公开索引页数：{original_pages}页<br>本文件版本：公开精读版</div>
              <div class="notice"><strong>版本说明：</strong>原始报告附件在公开平台需要登录、积分或会员权限。本文件仅依据无需登录即可访问的公开报告介绍与核心观点页面排版生成，不是券商原始附件PDF，不包含原报告的全部图表、附录和版式。</div>
              {''.join(body)}
              <div class="source">公开页面来源：{html.escape(source)}<br>资料仅供研究参考，不构成投资建议。</div>
              </body></html>'''
              path = OUT / filename
              HTML(string=document, base_url=source).write_pdf(path)
              pages = len(PdfReader(str(path), strict=False).pages)
              if pages < 2:
                  raise RuntimeError(f'digest too short: {filename}, pages={pages}')
              print('DIGEST', filename, pages, path.stat().st_size)
              return pages

          records = []

          # 1) Publicly downloadable original PDF: Sinolink Securities.
          original_url = 'https://pdf.dfcfw.com/pdf/H3_AP202506271698458026_1.pdf'
          response = fetch(
              original_url,
              accept='application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              referer='https://data.eastmoney.com/report/info/AP202506271698458026.html',
          )
          if not response.content.startswith(b'%PDF-') or len(response.content) < 100_000:
              raise RuntimeError(f'original file is not a valid PDF: {len(response.content)}')
          original_name = '01_国金证券_剥离欧洲轻装行布局机器人启新篇_原始PDF_2025-06-26.pdf'
          original_path = OUT / original_name
          original_path.write_bytes(response.content)
          original_pages = len(PdfReader(str(original_path), strict=False).pages)
          if original_pages != 33:
              raise RuntimeError(f'Unexpected original page count: {original_pages}')
          records.append({
              'order': 1,
              'file': original_name,
              'broker': '国金证券',
              'date': '2025-06-26',
              'title': '剥离欧洲轻装行，布局机器人启新篇',
              'file_status': '券商原始完整PDF',
              'original_report_pages': 33,
              'current_file_pages': original_pages,
              'source': response.url,
              'info_page': 'https://data.eastmoney.com/report/info/AP202506271698458026.html',
          })
          print('ORIGINAL', original_name, original_pages, len(response.content), response.url)

          # 2) Zhongtai Securities: public digest of the locked 28-page deep report.
          zt_title = '革故鼎新稳根基，从汽车零部件到机器人全栈供应商'
          zt_text, zt_source = extract_public_page(
              'https://www.nxny.com/report/view_6304571.html',
              zt_title,
              ['宁波华翔', '机器人'],
          )
          zt_name = '02_中泰证券_革故鼎新稳根基从汽车零部件到机器人全栈供应商_公开精读版_2026-05-28.pdf'
          zt_pages = render_digest(
              zt_name, zt_title, '中泰证券', '何俊艺、袁泽生', '2026-05-28', 28,
              zt_source, zt_text,
          )
          records.append({
              'order': 2,
              'file': zt_name,
              'broker': '中泰证券',
              'date': '2026-05-28',
              'title': zt_title,
              'file_status': '公开精读版，非券商原始附件',
              'original_report_pages': 28,
              'current_file_pages': zt_pages,
              'source': zt_source,
          })

          # 3) Western Securities: public digest of the locked 30-page initiation report.
          xb_title = '全面拥抱人形机器人产业，全球PEEK龙头潜力初显'
          xb_text, xb_source = extract_public_page(
              'https://www.nxny.com/report/view_6219478.html',
              xb_title,
              ['宁波华翔', 'PEEK'],
          )
          xb_name = '03_西部证券_全面拥抱人形机器人产业全球PEEK龙头潜力初显_公开精读版_2026-02-13.pdf'
          xb_pages = render_digest(
              xb_name, xb_title, '西部证券', '齐天翔、张磊', '2026-02-13', 30,
              xb_source, xb_text,
          )
          records.append({
              'order': 3,
              'file': xb_name,
              'broker': '西部证券',
              'date': '2026-02-13',
              'title': xb_title,
              'file_status': '公开精读版，非券商原始附件',
              'original_report_pages': 30,
              'current_file_pages': xb_pages,
              'source': xb_source,
          })

          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 70000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 2
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '宁波华翔电子股份有限公司|宁波华翔' "$pdf.txt"
            case "$(basename "$pdf")" in
              01_*) grep -Eq '国金证券' "$pdf.txt" ;;
              02_*) grep -Eq '中泰证券' "$pdf.txt" ;;
              03_*) grep -Eq '西部证券' "$pdf.txt" ;;
            esac
            rm -f "$pdf.txt"
            stem="/tmp/nbhx_broker_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          test "$(pdfinfo "$PACKAGE/01_国金证券_剥离欧洲轻装行布局机器人启新篇_原始PDF_2025-06-26.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 33

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          folder = Path('宁波华翔_002048_券商研究资料_3份')
          records = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          records.sort(key=lambda item: item['order'])
          lines = [
              '宁波华翔（002048）券商研究资料包',
              '整理日期：2026-10-28',
              '',
              '重要版本说明：',
              '1. 国金证券《剥离欧洲轻装行，布局机器人启新篇》为公开渠道直接下载的券商原始完整PDF，共33页。',
              '2. 中泰证券28页深度覆盖报告、西部证券30页首次覆盖报告的原始附件在公开平台需要登录、积分或会员权限；本包未绕过访问控制。',
              '3. 后两份文件依据无需登录即可访问的公开报告介绍与核心观点页面排版生成，已在文件名及首页标注“公开精读版”，不等同于原始券商PDF，原报告图表和附录可能缺失。',
              '4. 资料仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for record in records:
              path = folder / record['file']
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              total_pages += int(record['current_file_pages'])
              total_bytes += len(data)
              lines += [
                  f'- {path.name}',
                  f"  券商：{record['broker']}；发布日期：{record['date']}",
                  f"  标题：{record['title']}",
                  f"  文件性质：{record['file_status']}",
                  f"  原报告公开索引页数：{record['original_report_pages']}；当前文件页数：{record['current_file_pages']}",
                  f"  公开来源：{record['source']}",
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {path.name}')
          lines += [
              '',
              f'当前3份PDF合计页数：{total_pages}页。',
              f'当前PDF合计大小：{total_bytes}字节。',
              '全部文件均已通过PDF文件头、文件大小、结构完整性、公司名称、券商名称、实际页数及首末页渲染检查。',
          ]
          (folder / '00_文件清单与版本说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Ningbo-Huaxiang-002048-broker-research-package-3
          path: 宁波华翔_002048_券商研究资料_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
