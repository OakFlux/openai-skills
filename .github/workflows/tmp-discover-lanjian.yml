name: Temporary Discover Lanjian Filing IDs

on:
  push:
    branches:
      - tmp/fetch-lanjian-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover Sina filing IDs and PDF links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          from urllib.parse import unquote

          import requests

          stock = '301348'
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })

          def decode(response):
              raw = response.content
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='ignore')

          pages = [
              f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{stock}/page_type/ndbg.phtml',
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{stock}.phtml',
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/{stock}.phtml',
          ]

          ids = []
          for page in pages:
              response = session.get(page, timeout=45)
              response.raise_for_status()
              text = html.unescape(decode(response)).replace('\\/', '/')
              print('PAGE', page, 'BYTES', len(response.content))
              for match in re.finditer(r'<a\b[^>]*href=[\"\']([^\"\']+)[\"\'][^>]*>(.*?)</a>', text, flags=re.I | re.S):
                  href = match.group(1)
                  visible = re.sub(r'<[^>]+>', ' ', match.group(2))
                  visible = re.sub(r'\s+', ' ', html.unescape(visible)).strip()
                  if not any(term in visible for term in ['年度报告', '半年度报告', '招股说明书', '招股意向书']):
                      continue
                  id_match = re.search(r'(?:[?&]|%3F|%26)id(?:=|%3D)(\d+)', href, flags=re.I)
                  if not id_match:
                      id_match = re.search(r'id/(\d+)', href, flags=re.I)
                  print('ANCHOR', visible, 'HREF', href, 'ID', id_match.group(1) if id_match else 'NONE')
                  if id_match and id_match.group(1) not in ids:
                      ids.append(id_match.group(1))
              for match in re.findall(r'https?://[^\s\"\'<>]+?\.PDF', text, flags=re.I):
                  print('DIRECT_PDF', unquote(match))

          for bulletin_id in ids:
              detail = f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid={stock}'
              response = session.get(detail, timeout=45)
              response.raise_for_status()
              text = html.unescape(decode(response)).replace('\\/', '/')
              visible = re.sub(r'<[^>]+>', ' ', text)
              visible = re.sub(r'\s+', ' ', visible).strip()
              pdfs = []
              for url in re.findall(r'https?://[^\s\"\'<>]+?\.PDF', text, flags=re.I):
                  url = unquote(url)
                  if url not in pdfs:
                      pdfs.append(url)
              print('DETAIL', bulletin_id, 'TITLE_HEAD', visible[:240], 'PDFS', pdfs)
          PY
