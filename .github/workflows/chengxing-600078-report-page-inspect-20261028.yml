name: Inspect Chengxing report page metadata

on:
  push:
    paths:
      - '.github/workflows/chengxing-600078-report-page-inspect-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - run: |
          python - <<'PY'
          import re, json, requests
          from bs4 import BeautifulSoup
          urls=[
            'https://news.10jqka.com.cn/field/sr/20260206/56153303.shtml',
            'https://news.10jqka.com.cn/field/sr/20141016/3611947.shtml',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://stockpage.10jqka.com.cn/600078/'})
          for url in urls:
            r=s.get(url,timeout=60); raw=r.content
            text=raw.decode('gb18030','replace')
            print('\n=== URL',url,'STATUS',r.status_code,'LEN',len(raw),'===')
            soup=BeautifulSoup(text,'lxml')
            plain='\n'.join(x.strip() for x in soup.get_text('\n').splitlines() if x.strip())
            print('PLAIN_START\n',plain[:12000],'\nPLAIN_END')
            for pat in [
              r'var\s+([A-Za-z_$][\w$]*)\s*=\s*([\"\'])(.*?)\2\s*;',
              r'window\.([A-Za-z_$][\w$]*)\s*=\s*([\"\'])(.*?)\2\s*;',
            ]:
              for m in re.finditer(pat,text,re.S):
                name=m.group(1); val=m.group(3)
                if name.lower() in ('title','content','pdfurl','source','author','org','institution','researcher','rating','date','time') or any(k in val for k in ('澄星','磷化工','证券','研究','评级','PDF','pdf')):
                  print('VAR',name,repr(val[:12000]))
            for keyword in ('机构','研究员','分析师','评级','来源','发布日期','报告日期','证券','作者','太平洋','安信','澄星','pdfUrl'):
              print('\nKEYWORD',keyword)
              pos=0; count=0
              while True:
                pos=text.find(keyword,pos)
                if pos<0 or count>=20: break
                print(text[max(0,pos-300):pos+700].replace('\n',' ')[:1200])
                pos+=len(keyword); count+=1
          PY
