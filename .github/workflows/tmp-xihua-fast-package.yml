name: Temporary Xihua fast official filing package

on:
  push:
    branches: [tmp-xihua-official-filings-20260830]
    paths: [.github/workflows/tmp-xihua-fast-package.yml]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare tools
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Download and package verified filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          targets = [
              {
                  'key':'prospectus','title':'锡华科技首次公开发行股票并在主板上市招股说明书',
                  'filename':'01_锡华科技_首次公开发行股票并在主板上市招股说明书_20251218.pdf',
                  'date':'2025-12-18','min_pages':300,'category':'招股说明书'
              },
              {
                  'key':'annual','title':'2025年年度报告',
                  'filename':'02_锡华科技_2025年年度报告_20260423.pdf',
                  'date':'2026-04-23','min_pages':150,'category':'年度报告',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2026-04-23/1225146334.PDF'
              },
              {
                  'key':'q1','title':'2026年第一季度报告',
                  'filename':'03_锡华科技_2026年第一季度报告_20260423.pdf',
                  'date':'2026-04-23','min_pages':8,'category':'最新季度报告',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2026-04-23/1225146332.PDF'
              },
              {
                  'key':'half','title':'江苏锡华新能源科技股份有限公司2026年半年度报告',
                  'alt_title':'2026年半年度报告',
                  'filename':'04_锡华科技_2026年半年度报告_20260826_补充.pdf',
                  'date':'2026-08-26','min_pages':120,'category':'补充-最新定期报告',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2026-08-26/1225506154.PDF'
              },
          ]

          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':'https://data.eastmoney.com/notices/stock/603248.html',
              'Accept':'application/json,text/plain,*/*'
          })
          r=s.get('https://np-anotice-stock.eastmoney.com/api/security/ann',params={
              'sr':'-1','page_size':'100','page_index':'1','ann_type':'A','client_source':'web','stock_list':'603248','f_node':'0','s_node':'0'
          },timeout=60)
          print('ANN_API',r.status_code,len(r.content),r.headers.get('content-type'),r.url)
          r.raise_for_status(); rows=((r.json().get('data') or {}).get('list') or [])
          print('ANN_ROWS',len(rows))

          def clean(value):
              return re.sub('<[^>]+>','',str(value or '')).strip()

          for row in rows:
              print('ANN_ROW',row.get('art_code'),clean(row.get('title')),row.get('notice_date'))

          output=Path('锡华科技_官方披露文件'); output.mkdir(exist_ok=True)
          manifest=[]
          for target in targets:
              row_match=None
              for row in rows:
                  title=clean(row.get('title'))
                  if '摘要' in title or '提示性公告' in title:
                      continue
                  wanted=[target['title']]
                  if target.get('alt_title'): wanted.append(target['alt_title'])
                  if any(title==w or (w in title and len(title) <= len(w)+20) for w in wanted):
                      row_match=row; break
              print('MATCH',target['key'],json.dumps(row_match,ensure_ascii=False) if row_match else None)

              urls=[]
              if row_match and row_match.get('art_code'):
                  art=row_match['art_code']
                  urls += [
                      f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H1_{art}_1.pdf',
                  ]
              if target.get('cninfo'): urls.append(target['cninfo'])

              content=None; used=None; attempts=[]
              for u in urls:
                  try:
                      x=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=90,allow_redirects=True)
                      attempts.append({'url':u,'status':x.status_code,'bytes':len(x.content),'type':x.headers.get('content-type'),'head':x.content[:12].hex()})
                      print('PDF_TEST',target['key'],u,x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:20]),x.url)
                      if x.status_code==200 and x.content.startswith(b'%PDF-') and len(x.content)>100000:
                          content=x.content; used=x.url; break
                  except Exception as e:
                      attempts.append({'url':u,'error':repr(e)}); print('PDF_ERR',target['key'],u,repr(e))
              if content is None:
                  raise RuntimeError(f"No valid full PDF for {target['title']}; attempts={attempts}")

              path=output/target['filename']; path.write_bytes(content)
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              if pages < target['min_pages']:
                  raise RuntimeError(f"Page count too small for {target['title']}: {pages}")
              text=''
              for pg in reader.pages[:min(10,pages)]:
                  try:text += pg.extract_text() or ''
                  except Exception:pass
              compact=re.sub(r'\s+','',text)
              if '锡华' not in compact:
                  raise RuntimeError(f"Company identity failed for {target['title']}")
              if target['key']!='prospectus' and '603248' not in compact:
                  raise RuntimeError(f"Stock code identity failed for {target['title']}")
              sha=hashlib.sha256(content).hexdigest()
              item={**target,'pages':pages,'bytes':len(content),'sha256':sha,'source_url':used,'art_code':row_match.get('art_code') if row_match else None,'validation':'PDF header, page count, company identity, stock code where applicable, text extraction'}
              item.pop('cninfo',None); item.pop('alt_title',None)
              manifest.append(item)
              print('VALID',json.dumps(item,ensure_ascii=False))

          readme=[
              '锡华科技（603248）官方披露文件包','',
              '收录正式全文，不含摘要版或提示性公告。','',
              '上市以来全部年度报告目前只有2025年年度报告。',
              '最新季度报告为2026年第一季度报告。',
              '另补充收录2026年半年度报告，因为它是截至2026-08-30最新的定期报告。',''
          ]
          for i,m in enumerate(manifest,1):
              readme += [f"{i}. {m['category']}｜{m['date']}｜{m['pages']}页",f"   标题：{m['title']}",f"   文件：{m['filename']}",f"   来源：{m['source_url']}",f"   SHA-256：{m['sha256']}",'']
          readme += ['4份PDF均通过文件头、页数、公司名称/代码和文本可解析性检查；ZIP完整性测试通过。']
          (output/'README_文件清单与核验信息.txt').write_text('\n'.join(readme),encoding='utf-8')
          (output/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          with (output/'SHA256SUMS.txt').open('w',encoding='utf-8') as f:
              for m in manifest:f.write(f"{m['sha256']}  {m['filename']}\n")

          for zip_path in [Path('xihua_technology_official_filings.zip'),Path('锡华科技_所有年报_招股说明书_最新季报.zip')]:
              with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for p in sorted(output.iterdir()):z.write(p,arcname=f'{output.name}/{p.name}')
              with zipfile.ZipFile(zip_path) as z:
                  bad=z.testzip()
                  if bad:raise RuntimeError(f'ZIP failure {zip_path}: {bad}')
              print('ZIP_OK',zip_path,zip_path.stat().st_size)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Xihua_Official_Filings_Final
          path: |
            xihua_technology_official_filings.zip
            锡华科技_所有年报_招股说明书_最新季报.zip
            锡华科技_官方披露文件/*.pdf
            锡华科技_官方披露文件/*.txt
            锡华科技_官方披露文件/manifest.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
