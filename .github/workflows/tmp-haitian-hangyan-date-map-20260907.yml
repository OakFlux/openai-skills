name: Map Hangyan report listing dates for Haitian International
on:
  push:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Sample listing dates and exact titles
        run: |
          python - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          pages=[150,200,250,300,350,400,450,500,550,600,650,700,750,800,850,900,950,1000,1050,1100,1150,1200,1250,1300,1350,1400,1450]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          terms=['升级扩产双轮驱动','制造业产能再分布','注塑机全球龙头架海擎天']
          for p in pages:
              r=s.get('https://www.hangyan.co/reports',params={'page':p},timeout=60)
              soup=BeautifulSoup(r.text,'html.parser')
              cards=[]
              for a in soup.select('a[data-controller="protected-link"]'):
                  box=a.find_parent('div',class_=lambda c:c and 'box' in c.split())
                  meta=box.get_text(' ',strip=True) if box else a.get_text(' ',strip=True)
                  title=a.get_text(' ',strip=True)
                  if ' | 202' in meta:
                      cards.append({'title':title,'meta':meta})
                  if any(t in title for t in terms):
                      print('MATCH',json.dumps({'page':p,'title':title,'meta':meta,'token':a.get('data-protected-link-token-value','')},ensure_ascii=False))
              print('PAGE',p,'STATUS',r.status_code,'COUNT',len(cards),'FIRST',json.dumps(cards[:1],ensure_ascii=False),'LAST',json.dumps(cards[-1:],ensure_ascii=False))
          PY
