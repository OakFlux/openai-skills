name: Unisound Official Filings Package

on:
  push:
    branches:
      - chatgpt-unisound-filings-20260927
    paths:
      - .github/workflows/unisound_filings_20260927.yml
      - scripts/build_unisound_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf

      - name: Download, validate, and package official filings
        run: python scripts/build_unisound_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: unisound-official-filings-package
          path: |
            output/云知声_全部年报_招股说明书_最新定期财报.zip
            output/BUILD_SUMMARY.json
            output/verification/*.png
          retention-days: 1
