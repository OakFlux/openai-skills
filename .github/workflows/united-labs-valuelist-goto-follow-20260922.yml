name: Follow ValueList report download redirect 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-valuelist-goto-follow-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  follow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright requests
          python -m playwright install --with-deps chromium
      - name: Follow direct download anchor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/follow.py <<'PY'
          from __future__ import annotations
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright, TimeoutError as PWTimeout

          OUT=Path('out')
          START='https://www.valuelist.cn/775361.html'

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(viewport={'width':1440,'height':1100},locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',accept_downloads=True)
              page=await ctx.new_page(); net=[]
              async def on_response(r):
                item={'url':r.url,'status':r.status,'type':r.request.resource_type,'method':r.request.method,'location':r.headers.get('location',''),'content_type':r.headers.get('content-type','')}
                if any(k in r.url.lower() for k in ('goto','download','pdf','file','yanzheng','ajax','api')) or r.status in (301,302,303,307,308,401,403):
                  try:
                    body=await r.body();item['body_bytes']=len(body)
                    try:item['body_text']=body.decode('utf-8','replace')[:200000]
                    except:item['body_hex']=body[:1000].hex()
                  except Exception as e:item['body_error']=repr(e)
                net.append(item)
              page.on('response',on_response)
              rec={}
              try:
                resp=await page.goto(START,wait_until='domcontentloaded',timeout=90000)
                rec['start_status']=resp.status if resp else None
                await page.wait_for_timeout(8000)
                a=page.locator('a[href*="/goto?down="]').first
                rec['anchor_count']=await page.locator('a[href*="/goto?down="]').count()
                rec['anchor_href']=await a.get_attribute('href') if rec['anchor_count'] else None
                rec['cookies_before']=await ctx.cookies()
                if rec['anchor_href']:
                  href=rec['anchor_href']
                  # Path A: direct navigation in same session, allows observing redirects and final body.
                  try:
                    async with page.expect_download(timeout=15000) as di:
                      await page.goto(href,wait_until='domcontentloaded',timeout=90000)
                    dl=await di.value; dest=OUT/(dl.suggested_filename or 'download.bin');await dl.save_as(str(dest));rec['goto_download']={'file':dest.name,'url':dl.url,'bytes':dest.stat().st_size,'failure':await dl.failure()}
                  except PWTimeout:
                    rec['goto_final_url']=page.url
                    rec['goto_title']=await page.title()
                    rec['goto_body']=(await page.locator('body').inner_text())[:100000]
                    (OUT/'goto_final.html').write_text(await page.content(),encoding='utf-8')
                  except Exception as e:rec['goto_error']=repr(e)

                  # Path B: new clean page in same context and raw request via browser APIRequestContext cookies.
                  try:
                    req=ctx.request
                    rr=await req.get(href,timeout=90000,max_redirects=20,headers={'Referer':START})
                    body=await rr.body()
                    rec['api_request']={'status':rr.status,'url':rr.url,'headers':await rr.all_headers(),'bytes':len(body),'prefix':body[:20].hex()}
                    if body[:5]==b'%PDF-':(OUT/'api_request.pdf').write_bytes(body)
                    else:(OUT/'api_request_body.bin').write_bytes(body)
                  except Exception as e:rec['api_request_error']=repr(e)
                rec['cookies_after']=await ctx.cookies()
                await page.screenshot(path=str(OUT/'final.png'),full_page=True)
              except Exception as e:rec['error']=repr(e)
              rec['network']=net
              (OUT/'result.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/follow.py
          python - <<'PY'
          from pathlib import Path
          import json
          print(Path('out/result.json').read_text())
          PY
          find out -type f -printf '%P %s bytes\n' | sort > out/file_sizes.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-valuelist-goto-follow
          path: out
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
