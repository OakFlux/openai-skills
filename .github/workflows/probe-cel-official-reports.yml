name: Probe CEL official report links

on:
  push:
    branches:
      - tmp/cel-annual-reports-2020-2025-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Probe pages and HKEX endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse, requests
          from bs4 import BeautifulSoup
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          urls=[
            'https://www.everbright.com/cn/investor-relations/results-announcements',
            'https://www.everbright.com/en/investor-relations/results-announcements',
            'https://www.everbright.com/cn/results-announcements/2025-annual-report',
            'https://www.everbright.com/en/results-announcements/2025-annual-report',
            'https://www.everbright.com/cn/news/%E5%85%89%E5%A4%A7%E6%8E%A7%E8%82%A1%E5%85%AC%E5%B8%832026%E5%B9%B4%E4%B8%AD%E6%9C%9F%E4%B8%9A%E7%BB%A9',
            'https://www.everbright.com/en/node/13761',
          ]
          for u in urls:
            try:
              r=s.get(u,timeout=40,allow_redirects=True)
              print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print(r.text[:500].replace('\n',' '),flush=True)
              soup=BeautifulSoup(r.text,'lxml')
              links=[]
              for tag,attr in [('a','href'),('iframe','src'),('embed','src'),('object','data'),('source','src')]:
                for x in soup.find_all(tag):
                  v=x.get(attr)
                  if v: links.append(urllib.parse.urljoin(r.url,v))
              for v in re.findall(r'https?://[^"\'<>\\s]+',r.text): links.append(v.replace('\\/','/'))
              for v in dict.fromkeys(links):
                if '.pdf' in v.lower() or '/docs/' in v.lower() or 'annual' in v.lower() or 'interim' in v.lower() or '2026' in v.lower():
                  print('LINK',v[:1000],flush=True)
            except Exception as e:
              print('PAGEERR',u,repr(e),flush=True)

          endpoints=[
            ('https://www1.hkexnews.hk/search/titleSearchServlet.do','post'),
            ('https://www1.hkexnews.hk/search/titleSearchServlet.do','get'),
            ('https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en','get'),
            ('https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=zh','get'),
          ]
          params={
            'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'165',
            'documentType':'-1','fromDate':'01/01/2020','toDate':'31/08/2026','title':'',
            'searchType':'1','t1code':'40000','t2Gcode':'-2','t2code':'-2','rowRange':'1000','lang':'en'
          }
          for ep,method in endpoints:
            try:
              if method=='post': r=s.post(ep,data=params,timeout=50,headers={'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en','Origin':'https://www1.hkexnews.hk'})
              else: r=s.get(ep,params=params if 'Servlet' in ep else None,timeout=50,headers={'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en'})
              print('HKEX',method,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print(r.text[:3000].replace('\n',' '),flush=True)
              for v in re.findall(r'(?:https?://[^"\'<>\\s]+|/listedco/listconews/[^"\'<>\\s]+\.pdf)',r.text,re.I):
                print('HKEXPDF',urllib.parse.urljoin(r.url,v),flush=True)
            except Exception as e:
              print('HKEXERR',ep,method,repr(e),flush=True)
          PY