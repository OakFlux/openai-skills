name: Probe CEL official report links

on:
  push:
    branches:
      - tmp/cel-annual-reports-2020-2025-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Inspect official company pages
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.parse, warnings, requests
          from bs4 import BeautifulSoup
          from urllib3.exceptions import InsecureRequestWarning
          warnings.simplefilter('ignore', InsecureRequestWarning)
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          seeds=[
            'https://www.everbright.com/cn/investor-relations/results-announcements',
            'https://www.everbright.com/en/investor-relations/results-announcements',
            'https://www.everbright.com/cn/news/%E5%85%89%E5%A4%A7%E6%8E%A7%E8%82%A1%E5%85%AC%E5%B8%832026%E5%B9%B4%E4%B8%AD%E6%9C%9F%E4%B8%9A%E7%BB%A9',
            'https://www.everbright.com/en/node/13761',
            'https://www.everbright.com/en/results-announcements/2025-annual-report',
            'https://www.everbright.com/en/results-announcements/2024-annual-report',
            'https://www.everbright.com/en/results-announcements/2023-annual-report',
            'https://www.everbright.com/en/results-announcements/2022-annual-report',
            'https://www.everbright.com/en/results-announcements/2021-annual-report',
            'https://www.everbright.com/en/results-announcements/2020-annual-report',
          ]
          seen=set(); queue=list(seeds)
          def interesting(text,url=''):
            b=(text+' '+url).lower()
            return any(x in b for x in ['2020','2021','2022','2023','2024','2025','2026','annual','interim','年报','中期','年度報告','中期報告','.pdf','/docs/'])
          for depth in range(3):
            nextq=[]
            for u in queue:
              if u in seen: continue
              seen.add(u)
              try:
                r=s.get(u,timeout=45,allow_redirects=True,verify=False)
                ctype=(r.headers.get('content-type') or '').lower()
                print('FETCH',depth,r.status_code,len(r.content),ctype,r.url,flush=True)
                if r.content[:4]==b'%PDF' or 'application/pdf' in ctype:
                  print('OFFICIAL_PDF',r.url,flush=True)
                  continue
                if 'html' not in ctype and not r.text.lstrip().startswith('<'):
                  continue
                soup=BeautifulSoup(r.text,'lxml')
                for tag,attr in [('a','href'),('iframe','src'),('embed','src'),('object','data'),('source','src')]:
                  for x in soup.find_all(tag):
                    v=x.get(attr)
                    if not v: continue
                    full=urllib.parse.urljoin(r.url,v)
                    txt=' '.join(x.get_text(' ',strip=True).split())
                    if interesting(txt,full):
                      print('ELEMENT',tag,repr(txt[:250]),full,flush=True)
                      if full.startswith('http') and ('everbright.com' in full or '.pdf' in full.lower()): nextq.append(full)
                for m in re.findall(r'(?:https?:)?//[^"\'<>\\s]+|/(?:sites|files|docs)/[^"\'<>\\s]+',r.text,re.I):
                  full=urllib.parse.urljoin(r.url,m.replace('\\/','/'))
                  if interesting('',full):
                    print('REGEX_LINK',full[:1000],flush=True)
                    if full.startswith('http') and ('everbright.com' in full or '.pdf' in full.lower()): nextq.append(full)
                # Print short snippets around report labels to expose JS data attributes.
                plain=str(soup)
                for pat in ['2025年报','2024年报','2023年报','2022年报','2021年年报','2020年年报','2025 Annual Report','2026年中期','2026 Interim']:
                  i=plain.find(pat)
                  if i>=0: print('SNIPPET',pat,plain[max(0,i-700):i+900].replace('\n',' ')[:1800],flush=True)
              except Exception as e:
                print('ERROR',u,repr(e),flush=True)
            queue=list(dict.fromkeys(nextq))
          print('TOTAL_URLS',len(seen),flush=True)
          PY