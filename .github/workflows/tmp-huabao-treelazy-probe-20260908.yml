name: Probe Huabao filing links without browser
on:
  push:
    branches: [tmp-huabao-treelazy-probe-20260908]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          mkdir -p output
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          urls=['https://treelazy.com/stock-en/hk/00336/conference','https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=612']
          out=[]
          for u in urls:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'},timeout=90)
              soup=BeautifulSoup(r.text,'lxml')
              links=[]
              for a in soup.find_all('a',href=True):
                  text=' '.join(a.get_text(' ',strip=True).split())
                  href=a.get('href')
                  hay=(text+' '+href).lower()
                  if any(x in hay for x in ['interim results for the six months ended 30 june 2026','2025 interim report','20260826','20250903','.pdf']):
                      links.append({'text':text,'href':href})
              scripts=[]
              for sc in soup.find_all('script'):
                  txt=sc.string or sc.get_text() or ''
                  if any(x in txt.lower() for x in ['00336','20260826','interim results for the six months ended 30 june 2026']):
                      scripts.append(txt[:500000])
              pdfs=sorted(set(re.findall(r'https?://[^"\'<>\s\\]+?\.pdf(?:\?[^"\'<>\s\\]*)?',r.text.replace('\\/','/'),re.I)))
              rec={'url':u,'status':r.status_code,'bytes':len(r.content),'links':links,'pdfs':pdfs,'scripts':scripts}
              out.append(rec)
              print('URL',u,r.status_code,len(r.content),'LINKS',json.dumps(links,ensure_ascii=False)[:20000],'PDFS',pdfs[:50],flush=True)
              Path('output/'+('treelazy.html' if 'treelazy' in u else 'hkex.html')).write_text(r.text,encoding='utf-8')
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-treelazy-probe
          path: output/*
          retention-days: 1
