name: Build Dafeng broker deep-report package

on:
  push:
    branches: [tmp-dafeng-broker-reports-20261028]
    paths: ['.github/workflows/tmp-dafeng-broker-package-20261028.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='大丰实业_603081_券商深度报告_3份'
          mkdir -p "$PACKAGE" /tmp/dafeng_broker_check

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('大丰实业_603081_券商深度报告_3份')
          reports = [
              {
                  'order': 1,
                  'broker': '浙商证券',
                  'date': '2023-02-07',
                  'title': '舞台机械龙头，切入文创+运营打造文体旅平台公司',
                  'filename': '01_浙商证券_舞台机械龙头切入文创运营打造文体旅平台公司_2023-02-07.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202302081582890996_1.pdf',
                  'referer': 'https://data.eastmoney.com/report/info/AP202302081582890996.html',
                  'expected_pages': 41,
              },
              {
                  'order': 2,
                  'broker': '财通证券',
                  'date': '2023-12-21',
                  'title': '“文体旅”产业延伸，转型运营再出发',
                  'filename': '02_财通证券_文体旅产业延伸转型运营再出发_2023-12-21.pdf',
                  'url': 'https://file.iyanbao.com/pdf/24d84-24a77d31-3660-48ae-8b16-02e61f817a72.pdf',
                  'referer': 'https://file.iyanbao.com/',
                  'expected_pages': 38,
              },
              {
                  'order': 3,
                  'broker': '中邮证券',
                  'date': '2023-02-08',
                  'title': '乘疫后复苏东风，开启大丰2.0时代',
                  'filename': '03_中邮证券_乘疫后复苏东风开启大丰2.0时代_2023-02-08.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202302081582908410_1.pdf?1675890911000.pdf=',
                  'referer': 'https://data.eastmoney.com/report/',
                  'expected_pages': 23,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=4, pool_maxsize=4))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          for report in reports:
              last = None
              for attempt in range(8):
                  try:
                      response = session.get(
                          report['url'],
                          headers={'Referer': report['referer']},
                          timeout=(30, 360),
                          allow_redirects=True,
                      )
                      if response.status_code != 200:
                          raise RuntimeError(f'HTTP {response.status_code}')
                      data = response.content
                      if not data.startswith(b'%PDF-') or len(data) < 100_000:
                          raise RuntimeError(
                              f'invalid PDF: bytes={len(data)}, type={response.headers.get("content-type")}'
                          )
                      path = out / report['filename']
                      path.write_bytes(data)
                      pages = len(PdfReader(str(path), strict=False).pages)
                      if pages != report['expected_pages']:
                          raise RuntimeError(
                              f'page mismatch: expected={report["expected_pages"]}, actual={pages}'
                          )
                      report['pages'] = pages
                      report['bytes'] = len(data)
                      report['final_url'] = response.url
                      print('SAVED', path.name, 'pages=', pages, 'bytes=', len(data), 'url=', response.url)
                      break
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 + attempt, 10))
              else:
                  raise RuntimeError(f'failed to download {report["title"]}: {last!r}')

          (out / '_metadata.json').write_text(
              json.dumps(reports, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000

            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 20

            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '浙江大丰实业股份有限公司|大丰实业' "$pdf.txt"
            case "$(basename "$pdf")" in
              01_*) grep -Eq '浙商证券' "$pdf.txt" ;;
              02_*) grep -Eq '财通证券' "$pdf.txt" ;;
              03_*) grep -Eq '中邮证券' "$pdf.txt" ;;
            esac
            rm -f "$pdf.txt"

            stem="/tmp/dafeng_broker_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          folder = Path('大丰实业_603081_券商深度报告_3份')
          reports = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          reports.sort(key=lambda x: x['order'])

          lines = [
              '大丰实业（603081）券商深度报告资料包',
              '整理日期：2026-10-28',
              '',
              '收录说明：',
              '1. 本包收录3份公开渠道可直接下载的券商原始完整PDF。',
              '2. 优先选择公司深度报告或首次覆盖报告，未混入网页摘要、重新排版版本或普通短篇业绩点评。',
              '3. 资料仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for report in reports:
              path = folder / report['filename']
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              total_pages += report['pages']
              total_bytes += len(data)
              lines += [
                  f'- {path.name}',
                  f"  券商：{report['broker']}；发布日期：{report['date']}；页数：{report['pages']}",
                  f"  标题：{report['title']}",
                  '  文件性质：券商原始完整PDF',
                  f"  PDF来源：{report['final_url']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {path.name}')

          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、精确页数、正文公司名称、券商名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Dafeng-603081-broker-deep-reports-3
          path: 大丰实业_603081_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
