name: Build HJTime 603101 broker deep report package via list2 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-eastmoney-list2-package-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf Pillow

      - name: Query list2, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from PIL import Image

          CODE='603101'
          COMPANY='汇嘉时代'
          FULL='新疆汇嘉时代百货股份有限公司'
          TODAY='2026-10-12'
          work=Path('work'); raw=work/'raw'; final=work/'final'; renders=work/'renders'; art=Path('artifact_out')
          for p in (raw,final,renders,art): p.mkdir(parents=True,exist_ok=True)
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept':'application/json,text/plain,application/pdf,*/*',
              'Referer':'https://data.eastmoney.com/report/',
          })

          all_rows=[]
          for page in range(1,6):
              body={'pageSize':100,'pageNo':page,'beginTime':'2010-01-01','endTime':TODAY,'code':CODE}
              r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=(20,120))
              print('LIST2',page,r.status_code,len(r.content),r.url,flush=True)
              print('LIST2_BODY',page,r.text[:4000],flush=True)
              r.raise_for_status()
              j=r.json(); rows=j.get('data') or []
              all_rows.extend(rows)
              if len(rows)<100: break
              time.sleep(1)
          unique={str(r.get('infoCode') or r.get('id') or json.dumps(r,ensure_ascii=False)):r for r in all_rows}
          rows=list(unique.values())
          (work/'list2_metadata.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ROW_COUNT',len(rows),flush=True)
          for row in rows:
              print('META',json.dumps({k:row.get(k) for k in ('infoCode','title','orgSName','publishDate','attachPages','attachSize','encodeUrl','stockName','stockCode')},ensure_ascii=False),flush=True)

          def clean(x):
              return re.sub(r'\s+','',re.sub(r'<[^>]+>','',str(x or '')).replace('：',':').replace('（','(').replace('）',')')).lower()
          def safe(x,n=110):
              return re.sub(r'[\\/:*?"<>|]+','_',str(x)).strip(' ._')[:n] or 'report'
          deep_terms=['深度','首次覆盖','公司研究','新股','新疆零售龙头','商业龙头','零售龙头','低空经济','胖改','价值重估','业态提质','创新转型']
          shallow=['点评','季报','年报','中报','半年报','业绩预告','业绩快报','公告点评','简评','事件点评']
          def score(row):
              title=clean(row.get('title')); pages=int(row.get('attachPages') or 0); v=0
              if '深度' in title: v+=100
              if '首次覆盖' in title: v+=95
              if '公司研究' in title: v+=40
              if '新股' in title: v+=25
              for t in deep_terms:
                  if clean(t) in title: v+=10
              for t in shallow:
                  if clean(t) in title: v-=30
              if pages>=40:v+=55
              elif pages>=30:v+=48
              elif pages>=20:v+=38
              elif pages>=15:v+=28
              elif pages>=10:v+=18
              elif pages>=8:v+=8
              else:v-=100
              date=str(row.get('publishDate') or '')
              try: year=int(date[:4])
              except: year=0
              v+=max(0,min(14,year-2012))
              return v
          ranked=sorted(rows,key=lambda r:(score(r),int(r.get('attachPages') or 0),str(r.get('publishDate') or '')),reverse=True)
          candidates=[r for r in ranked if int(r.get('attachPages') or 0)>=8][:30]
          print('CANDIDATES',flush=True)
          for row in candidates:
              print(json.dumps({'score':score(row),'infoCode':row.get('infoCode'),'title':row.get('title'),'broker':row.get('orgSName'),'date':row.get('publishDate'),'pages':row.get('attachPages'),'encodeUrl':row.get('encodeUrl')},ensure_ascii=False),flush=True)

          def get_pdf(row,target):
              info=str(row.get('infoCode') or '')
              urls=[]
              for key in ('pdfUrl','attachUrl','url'):
                  val=row.get(key)
                  if isinstance(val,str) and '.pdf' in val.lower(): urls.append(val)
              urls += [
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_01.pdf',
              ]
              for url in dict.fromkeys(urls):
                  try:
                      rr=s.get(url,timeout=(20,180),allow_redirects=True)
                      print('PDF_GET',info,rr.status_code,len(rr.content),url,'FINAL',rr.url,flush=True)
                      if rr.status_code==200 and len(rr.content)>80000 and rr.content.startswith(b'%PDF-'):
                          target.write_bytes(rr.content); return str(rr.url)
                  except Exception as e: print('PDF_ERR',info,url,repr(e),flush=True)
              raise RuntimeError('No valid PDF '+info)

          valid=[]; seen=set()
          for idx,row in enumerate(candidates,1):
              info=str(row.get('infoCode') or '')
              if not info: continue
              title=str(row.get('title') or info).strip(); broker=str(row.get('orgSName') or row.get('orgName') or '未知券商').strip(); date=str(row.get('publishDate') or '')[:10]
              tmp=raw/f'{idx:02d}_{info}.pdf'
              try:
                  source=get_pdf(row,tmp)
                  reader=PdfReader(str(tmp),strict=False); pages=len(reader.pages)
                  if pages<8: raise RuntimeError(f'too short {pages}')
                  parts=[]
                  inds=list(range(min(20,pages)))
                  if pages>22: inds += list(range(max(0,pages-4),pages))
                  for pno in dict.fromkeys(inds):
                      try: parts.append(reader.pages[pno].extract_text() or '')
                      except: pass
                  sample='\n'.join(parts)
                  if CODE not in sample and COMPANY not in sample and FULL not in sample: raise RuntimeError('identity check failed')
                  q=subprocess.run(['qpdf','--check',str(tmp)],capture_output=True,text=True)
                  if q.returncode not in (0,3): raise RuntimeError(q.stderr[-1000:])
                  data=tmp.read_bytes(); sha=hashlib.sha256(data).hexdigest()
                  if sha in seen: raise RuntimeError('duplicate')
                  seen.add(sha)
                  # Render first and last page to verify appearance.
                  rdir=renders/info; rdir.mkdir(parents=True,exist_ok=True)
                  for pno,label in ((1,'first'),(pages,'last')):
                      pref=rdir/label
                      proc=subprocess.run(['pdftoppm','-f',str(pno),'-l',str(pno),'-singlefile','-png','-r','100',str(tmp),str(pref)],capture_output=True,text=True)
                      if proc.returncode!=0: raise RuntimeError('render failed '+proc.stderr[-500:])
                      img=Path(str(pref)+'.png')
                      if not img.exists() or img.stat().st_size<10000: raise RuntimeError('render empty')
                      with Image.open(img) as im:
                          w,h=im.size
                          if w<500 or h<700: raise RuntimeError(f'render too small {w}x{h}')
                  rec={'tmp':tmp,'info_code':info,'title':title,'broker':broker,'publish_date':date,'pages':pages,'bytes':len(data),'sha256':sha,'source_url':source,'score':score(row)}
                  valid.append(rec)
                  print('VALID',json.dumps({k:rec[k] for k in ('broker','title','publish_date','pages','score')},ensure_ascii=False),flush=True)
              except Exception as e:
                  print('FAIL',info,title,repr(e),flush=True); tmp.unlink(missing_ok=True)
          if len(valid)<2: raise RuntimeError(f'Only {len(valid)} validated reports')
          valid.sort(key=lambda r:(r['score'],r['pages'],r['publish_date']),reverse=True)
          selected=[]; brokers=set()
          for r in valid:
              if r['broker'] in brokers: continue
              selected.append(r); brokers.add(r['broker'])
              if len(selected)==3: break
          if len(selected)<3:
              for r in valid:
                  if r not in selected: selected.append(r)
                  if len(selected)==3: break
          selected=selected[:3]
          package=f'汇嘉时代_603101_券商深度报告_{len(selected)}份'
          for i,r in enumerate(selected,1):
              filename=f'{i:02d}_{safe(r["publish_date"])}_{safe(r["broker"])}_{safe(r["title"])}.pdf'
              shutil.copy2(r['tmp'],final/filename); r['filename']=filename; r.pop('tmp',None)
          readme=[f'{FULL}（{CODE}.SH，证券简称：{COMPANY}）券商深度报告合集',f'整理日期：{TODAY}','','筛选标准：优先完整公司深度、首次覆盖或较长公司研究，排除数页季报/年报点评；尽量选择不同券商。','','文件清单：']
          for i,r in enumerate(selected,1):
              readme += [f'{i}. {r["filename"]}',f'   券商：{r["broker"]}',f'   标题：{r["title"]}',f'   日期：{r["publish_date"]}；页数：{r["pages"]}',f'   来源：{r["source_url"]}',f'   SHA-256：{r["sha256"]}','']
          readme.append('完整性检查：已验证PDF文件头、公司名称/证券代码、实际页数、qpdf结构、重复文件、首尾页渲染及SHA-256；ZIP已完成CRC测试。')
          (final/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (final/'manifest.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          (final/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in selected),encoding='utf-8')
          zip_path=art/f'{package}.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(final.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip()
              if bad: raise RuntimeError('ZIP CRC '+bad)
              if sum(1 for n in z.namelist() if n.lower().endswith('.pdf'))!=len(selected): raise RuntimeError('PDF count mismatch')
          print('FINAL_RECORDS',json.dumps(selected,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hjtime-603101-broker-deep-reports-list2-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
