name: Temporary FX viewer HTML probe
on:
  push:
    branches: [tmp-towngas-fxprobe2-20260905]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re,json
          import requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/detail/5316216'})
          for u in ['https://www.fxbaogao.com/detail/5316216','https://www.fxbaogao.com/view?id=5316216']:
            try:
              r=s.get(u,timeout=(10,20),allow_redirects=True); print('FETCH',u,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True); Path(('detail' if 'detail' in u else 'view')+'.html').write_text(r.text,encoding='utf-8')
              soup=BeautifulSoup(r.text,'html.parser')
              for t in soup.find_all(['img','script','iframe','a','source','embed']):
                for a in ['src','href','data-src','data-url','file']:
                  v=t.get(a)
                  if v and re.search(r'5316216|report-image|\.pdf|download|preview|page',v,re.I): print('LINK',t.name,a,v,flush=True)
              for kw in ['report-image','5316216','totalPage','pageCount','pdfUrl','downloadUrl','oss']:
                for m in list(re.finditer(kw,r.text,re.I))[:50]: print('CTX',kw,r.text[max(0,m.start()-600):m.start()+1500].replace('\n',' ')[:2100],flush=True)
            except Exception as e: print('ERROR',u,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fxprobe2
          path: '*.html'
          retention-days: 1
