name: Temporary Goke Micro Sdyanbao metadata query

on:
  push:
    branches: [tmp-goke-sdy-metadata-20260830]

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public search API
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'})
          queries=['编解码芯片领军者，AI布局逐步完善','AI赋能视显SoC基本盘','行业复苏与产品迭代共振','四大业务齐发力，自研NPU赋能算力升级','长期深耕视频编解码芯片']
          rows=[]; seen=set()
          for q in queries:
              payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':50,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
              r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=60); print('QUERY',q,r.status_code,len(r.content)); r.raise_for_status()
              data=(r.json().get('data') or {}); print('TOTAL',data.get('total'))
              for f in data.get('files') or []:
                  blob=' '.join([str(f.get('name') or ''),str(f.get('stock') or ''),str(f.get('content') or '')[:500]])
                  if '国科微' not in blob and '300672' not in blob: continue
                  if f.get('id') in seen: continue
                  seen.add(f.get('id')); rows.append(f); print('ROW_FULL',json.dumps(f,ensure_ascii=False))
          open('sdy_rows.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: Goke_Micro_Sdy_Metadata
          path: sdy_rows.json
          if-no-files-found: error
          retention-days: 1
