name: Query Eastmoney Pandairy reports
on:
  push:
    paths: ['.github/workflows/pandairy-eastmoney-report-api-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          python - <<'PY'
          import json,re,requests
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockcode=300898','Accept':'application/json,text/plain,*/*'})
          bases=[
            'https://reportapi.eastmoney.com/report/list',
            'https://reportapi.eastmoney.com/report/list2',
          ]
          params={'pageSize':'100','pageNo':'1','qType':'0','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','beginTime':'2020-10-01','endTime':'2026-11-04','fields':'','stockCode':'300898'}
          for base in bases:
            for extra in ({},{'cb':'datatable123456'},{'orgCode':''}):
              p={**params,**extra}
              try:
                r=s.get(base,params=p,timeout=90,allow_redirects=True)
                print('FETCH',r.url,r.status_code,len(r.content),r.headers.get('content-type'),flush=True)
                print('HEAD',r.text[:1000],flush=True)
                text=r.text
                if text.startswith('datatable'):
                  text=text[text.find('(')+1:text.rfind(')')]
                try:
                  data=json.loads(text)
                  print('JSON_KEYS',list(data) if isinstance(data,dict) else type(data).__name__,flush=True)
                  print('JSON',json.dumps(data,ensure_ascii=False)[:30000],flush=True)
                except Exception as e: print('JSONERR',repr(e),flush=True)
              except Exception as e: print('ERR',base,repr(e),flush=True)
          PY
