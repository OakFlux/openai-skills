name: Discover Chengdu Huawei Sina report links 0204 a7c9

on:
  push:
    branches:
      - tmp/chengdu-huawei-688709-sina-discovery-20261016-0204-a7c9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report pages and APIs
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          targets = [
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/760467727171/index.phtml',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh688709&t1=all',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=688709&t1=all',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh688709',
          ]
          for u in targets:
              print('\n### TARGET', u)
              try:
                  r = s.get(u, timeout=(20,120), allow_redirects=True)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'TYPE', r.headers.get('content-type'), 'BYTES', len(r.content))
                  text = None
                  used = None
                  for enc in [r.encoding, r.apparent_encoding, 'gb18030', 'utf-8']:
                      if not enc:
                          continue
                      try:
                          t = r.content.decode(enc)
                          if '<html' in t.lower() or 'vReport' in t or '成都华微' in t:
                              text, used = t, enc
                              break
                      except Exception:
                          pass
                  if text is None:
                      text = r.content.decode('gb18030', errors='replace')
                      used = 'gb18030-replace'
                  print('ENC', used, 'HAS_COMPANY', '成都华微' in text)
                  soup = BeautifulSoup(text, 'lxml')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')
                  entries = []
                  for tag in soup.find_all(['a','link','script','iframe','form','embed','object']):
                      for attr in ('href','src','action','data'):
                          v = tag.get(attr)
                          if v:
                              full = urljoin(r.url, v)
                              label = tag.get_text(' ', strip=True)[:160]
                              low = (full + ' ' + label).lower()
                              if any(k in low for k in ['pdf','download','down','report','rptid','688709','成都华微']):
                                  entries.append({'tag':tag.name,'attr':attr,'url':full,'label':label})
                  print('LINKS', json.dumps(entries[:400], ensure_ascii=False, indent=2))
                  patterns = {
                      'pdf_urls': r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                      'rptids': r'rptid[/=](\d{6,})',
                      'download_paths': r'[^\s\"\'<>]*(?:download|down)[^\s\"\'<>]*',
                  }
                  for name, pat in patterns.items():
                      vals = sorted(set(re.findall(pat, text, flags=re.I)))
                      print(name, json.dumps(vals[:300], ensure_ascii=False, indent=2))
                  for key in ['760467727171','成都华微','华泰证券','招商证券','特种集成电路小巨人','特种芯片国产化']:
                      p = text.find(key)
                      if p >= 0:
                          print('SNIP', key, re.sub(r'\s+',' ',text[max(0,p-500):p+1500]))
              except Exception as e:
                  print('ERROR', repr(e))

          api = 'https://reportapi.eastmoney.com/report/list'
          for qtype in ['0','1','2','3']:
              params = {
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2018-01-01','endTime':'2030-12-31','pageNo':'1','fields':'',
                  'qType':qtype,'orgCode':'','code':'688709','rcode':'','p':'1','pageNum':'1','pageNumber':'1'
              }
              try:
                  r = s.get(api, params=params, timeout=(20,120))
                  data = r.json()
                  batch = data.get('data') or []
                  if isinstance(batch, dict):
                      batch = batch.get('list') or batch.get('data') or []
                  out=[]
                  for x in batch if isinstance(batch,list) else []:
                      out.append({k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','stockCode','stockName']})
                  print('\n### EASTMONEY', qtype, 'STATUS', r.status_code, 'HITS', data.get('hits'))
                  print(json.dumps(out, ensure_ascii=False, indent=2, default=str))
              except Exception as e:
                  print('EASTMONEY_ERROR', qtype, repr(e))
          PY
