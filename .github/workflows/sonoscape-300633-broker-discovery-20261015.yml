name: Build Sonoscape 300633 broker deep reports 20261015

on:
  push:
    paths:
      - '.github/workflows/sonoscape-300633-broker-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package full reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '开立医疗_300633_券商深度报告_完整版_3份'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          VALIDATION_PREVIEWS = Path('_validation_previews')
          VALIDATION_PREVIEWS.mkdir(exist_ok=True)

          REPORTS = [
              {
                  'broker': '信达证券',
                  'date': '2026-04-22',
                  'analysts': '唐爱金',
                  'rating': '买入',
                  'title': '公司深度报告：高端机型产品助盈利修复，新业务渐入收获期',
                  'info_code': 'AP202604221821459251',
                  'expected_pages': 39,
                  'min_pages': 30,
                  'terms': ['开立医疗', '高端机型', '盈利修复', '新业务'],
                  'filename': '01_信达证券_开立医疗_高端机型产品助盈利修复新业务渐入收获期_2026-04-22_39页.pdf',
              },
              {
                  'broker': '上海证券',
                  'date': '2025-03-03',
                  'analysts': '尤靖宜',
                  'rating': '增持',
                  'title': '深度报告：“硬核”创新频出，多元化战略成型',
                  'info_code': 'AP202503031644007826',
                  'expected_pages': 23,
                  'min_pages': 18,
                  'terms': ['开立医疗', '硬核', '创新', '多元化战略'],
                  'filename': '02_上海证券_开立医疗_硬核创新频出多元化战略成型_2025-03-03_23页.pdf',
              },
              {
                  'broker': '国信证券',
                  'date': '2024-07-18',
                  'analysts': '张佳博',
                  'rating': '增持',
                  'title': '超声和软镜行业领军者，多产线布局厚积薄发',
                  'info_code': 'AP202407181638027095',
                  'expected_pages': 52,
                  'min_pages': 45,
                  'terms': ['开立医疗', '超声', '软镜', '多产线'],
                  'filename': '03_国信证券_开立医疗_超声和软镜行业领军者多产线布局厚积薄发_2024-07-18_52页.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(info_code: str) -> tuple[bytes, str, dict]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last = {}
              for url in urls:
                  for attempt in range(7):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 300),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          if (
                              response.status_code == 200
                              and response.content[:5] == b'%PDF-'
                              and len(response.content) > 100_000
                          ):
                              return response.content, url, last
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          manifest = []
          for index, report in enumerate(REPORTS, 1):
              data, pdf_url, download_meta = download_pdf(report['info_code'])
              destination = ROOT / report['filename']
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(
                      f'too few pages: {destination.name}: {pages} < {report["min_pages"]}'
                  )

              extracted = ''
              for page in reader.pages[: min(15, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', extracted)
              if not any(term in compact for term in ['开立医疗', '300633', '深圳开立生物医疗']):
                  raise RuntimeError(f'issuer identity check failed: {destination.name}')
              matched_terms = [
                  term for term in report['terms']
                  if re.sub(r'\s+', '', term) in compact
              ]
              if len(matched_terms) < 2:
                  raise RuntimeError(
                      f'title keyword check failed: {destination.name}; matched={matched_terms}'
                  )

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = VALIDATION_PREVIEWS / f'{index:02d}'
              subprocess.run(
                  [
                      'pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125',
                      '-singlefile', str(destination), str(preview_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'first-page render failed: {destination.name}')

              sha256 = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **report,
                  'actual_pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'source_report_page': (
                      f'https://data.eastmoney.com/report/info/{report["info_code"]}.html'
                  ),
                  'pdf_url': pdf_url,
                  'download_meta': download_meta,
                  'matched_terms': matched_terms,
                  'document_nature': '券商原始完整PDF',
                  'validation': [
                      'PDF header',
                      'issuer identity',
                      'title keywords',
                      'page count',
                      'qpdf structure',
                      'first-page render',
                  ],
              })

          readme = [
              '深圳开立生物医疗科技股份有限公司（300633.SZ）券商深度报告完整版资料包',
              '整理日期：2026-10-15',
              '',
              '本包收录3份公开可直接取得的券商原始完整PDF，均为公司深度或长篇专题报告。',
              '优先选择2024—2026年较新的深度报告，不以短篇业绩点评凑数。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f'{index}. {item["broker"]}：《{item["title"]}》',
                  (
                      f'   日期：{item["date"]}；分析师：{item["analysts"]}；'
                      f'评级：{item["rating"]}'
                  ),
                  (
                      f'   完整页数：{item["actual_pages"]}页；'
                      f'文件：{item["filename"]}'
                  ),
                  f'   来源页面：{item["source_report_page"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme += [
              '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              (
                  '核验项目：PDF文件头、公司名称/证券代码、标题关键词、页数、'
                  'qpdf结构、首页渲染、ZIP CRC及SHA-256。'
              ),
          ]
          (ROOT / '00_文件清单与说明.txt').write_text(
              '\n'.join(readme), encoding='utf-8'
          )
          (ROOT / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(
                  f'{item["sha256"]}  {item["filename"]}\n'
                  for item in manifest
              ),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(
              zip_path,
              'w',
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=6,
              allowZip64=True,
          ) as archive:
              for file_path in sorted(ROOT.rglob('*')):
                  if file_path.is_file():
                      archive.write(
                          file_path,
                          arcname=f'{PACKAGE}/{file_path.relative_to(ROOT)}',
                      )

          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              pdf_files = [
                  name for name in archive.namelist()
                  if name.lower().endswith('.pdf')
              ]
              if bad_file or len(pdf_files) != 3:
                  raise RuntimeError(
                      f'ZIP validation failed: bad={bad_file}, pdf_count={len(pdf_files)}'
                  )

          alias_path = Path('sonoscape_broker_deep_reports_3_full.zip')
          alias_path.write_bytes(zip_path.read_bytes())
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print(
              'FINAL_ZIP', zip_path, zip_path.stat().st_size,
              'SHA256', zip_sha256
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: sonoscape-300633-broker-deep-reports-full-3
          path: |
            开立医疗_300633_券商深度报告_完整版_3份.zip
            sonoscape_broker_deep_reports_3_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
