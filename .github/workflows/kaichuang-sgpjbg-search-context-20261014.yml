name: Extract Kaichuang International search contexts from SGPJBG

on:
  push:
    paths:
      - '.github/workflows/kaichuang-sgpjbg-search-context-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and extract result links
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html,json,re
          from pathlib import Path
          from urllib.parse import quote,urljoin
          import requests
          from bs4 import BeautifulSoup

          urls=[
            'https://www.sgpjbg.com/search.html?q='+quote('开创国际'),
            'https://www.sgpjbg.com/search.html?q='+quote('600097'),
            'https://www.sgpjbg.com/search.html?q='+quote('近看政策扶持 远看产业延伸'),
            'https://www.sgpjbg.com/search.html?q='+quote('金枪鱼捕捞量增长带动盈利持续上升'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          out=Path('sgpjbg_search'); out.mkdir(exist_ok=True)
          for idx,url in enumerate(urls,1):
            r=s.get(url,timeout=60,allow_redirects=True); r.raise_for_status()
            r.encoding=r.apparent_encoding or r.encoding
            text=r.text; (out/f'page_{idx}.html').write_text(text,encoding='utf-8')
            print('\nPAGE',idx,url,r.status_code,len(r.content),r.url,flush=True)
            soup=BeautifulSoup(text,'lxml')
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
            for term in ('开创国际','600097','近看政策','金枪鱼捕捞量','baogao/','bgdown/','report','searchResult','resultList'):
              poses=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
              print('TERM',term,'COUNT',len(poses),flush=True)
              for p in poses[:50]:
                ctx=re.sub(r'\s+',' ',html.unescape(text[max(0,p-700):p+1800]))
                print('CTX',ctx[:2500],flush=True)
            links=[]
            for a in soup.find_all('a',href=True):
              label=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              low=(label+' '+href).lower()
              if any(k in low for k in ('开创国际','600097','政策扶持','金枪鱼捕捞量')):
                links.append({'label':label,'href':href})
            print('LINKS',json.dumps(links[:100],ensure_ascii=False),flush=True)
          PY
      - name: Upload search pages
        uses: actions/upload-artifact@v4
        with:
          name: kaichuang-sgpjbg-search-pages-20261014
          path: sgpjbg_search
          retention-days: 7
