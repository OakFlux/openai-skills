name: chatgpt-temp-china-hongqiao-code-query
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-china-hongqiao-code-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test stock-code filters
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import requests,json,time
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          def parse(t):
            try:return json.loads(t)
            except:
              a=t.find('{');b=t.rfind('}');return json.loads(t[a:b+1])
          for code in ['01378','1378','1378.HK','HK1378','001378','116.01378','128.01378']:
            p={'cb':'showData','industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2015-01-01','endTime':'2026-09-08','pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','code':code,'_':int(time.time()*1000)}
            r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=60);o=parse(r.text);x=o.get('data') or []
            print('CODE',code,'HTTP',r.status_code,'HITS',o.get('hits'),'TOTAL',o.get('TotalPage'),'ROWS',len(x),flush=True)
            for a in x[:8]: print('ROW',code,json.dumps(a,ensure_ascii=False),flush=True)
          PY
