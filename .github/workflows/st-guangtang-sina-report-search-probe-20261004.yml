name: Probe Sina reports for ST Guangtang 20261004

on:
  push:
    paths:
      - '.github/workflows/st-guangtang-sina-report-search-probe-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Sina report search endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from urllib.parse import quote

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=000911',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?stockcode=000911',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?code=000911',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?keyword='+quote('南宁糖业'),
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?q='+quote('南宁糖业'),
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?name='+quote('南宁糖业'),
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/company/index.phtml',
          ]
          for u in urls:
            r=s.get(u,timeout=60,allow_redirects=True)
            print('\nURL',u,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),flush=True)
            enc=r.apparent_encoding or 'gb18030'
            try: text=r.content.decode(enc,errors='replace')
            except: text=r.text
            for m in re.finditer(r'<form[^>]*>.*?</form>',text,re.I|re.S):
              block=m.group(0)
              if 'vReport' in block or 'search' in block:
                print('FORM',re.sub(r'\s+',' ',block)[:5000],flush=True)
            for line in text.splitlines():
              if any(k in line for k in ['南宁糖业','000911','vReport_Show']):
                print('MATCH',line[:3000],flush=True)
          PY
