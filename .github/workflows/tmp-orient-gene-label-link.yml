name: Temporary Resolve 2022 Orient Gene SGPJBG Page

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-label-link.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse label page through Jina Reader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          targets=['https://r.jina.ai/http://bg.sgpjbg.com/labels/jingdongfangayewu.html','https://r.jina.ai/https://bg.sgpjbg.com/labels/jingdongfangayewu.html']
          result=[]
          for u in targets:
            try:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Accept':'text/plain,*/*'},timeout=100);text=r.text
              links=[]
              for label,url in re.findall(r'\[([^\]]+)\]\((https?://[^)]+)\)',text):
                if '东方生物' in label or '新生代国际化IVD龙头' in label:links.append({'label':label,'url':url})
              snippets=[]
              for needle in ['东方生物','新生代国际化IVD龙头','20220313','23页']:
                for m in list(re.finditer(re.escape(needle),text,re.I))[:30]:snippets.append({'needle':needle,'text':re.sub(r'\s+',' ',text[max(0,m.start()-800):m.start()+2500])})
              result.append({'url':u,'status':r.status_code,'bytes':len(r.content),'links':links,'snippets':snippets,'text_head':text[:2000]})
            except Exception as e:result.append({'url':u,'error':repr(e)})
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_2022_label_link.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT='+json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-2022-label-link
          path: out/orient_gene_2022_label_link.json
          if-no-files-found: error
          retention-days: 3
