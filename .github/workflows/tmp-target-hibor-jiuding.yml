name: Temporary Extract Jiuding Hibor Archive Links

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract matching archive links and report assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import requests
          from urllib.parse import urljoin, unquote

          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9',
              'Referer':'https://p.hibor.com.cn/',
          })

          def decode(r):
              for enc in ('gb18030','gbk','utf-8'):
                  try: return r.content.decode(enc)
                  except UnicodeDecodeError: pass
              return r.content.decode('utf-8',errors='ignore')

          months=['200712','200906','200907','201012','201105','201511']
          matches=[]
          for month in months:
              for base in ['https://p.hibor.com.cn/archiver/{m}.html','https://www.hibor.com.cn/archiver_houtai/{m}.html']:
                  url=base.format(m=month)
                  try:
                      r=s.get(url,timeout=60,allow_redirects=True)
                      if r.status_code!=200: continue
                      text=html.unescape(decode(r)).replace('\\/','/')
                      for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,flags=re.I|re.S):
                          href=urljoin(r.url,m.group(1))
                          title=re.sub(r'<[^>]+>',' ',m.group(2))
                          title=re.sub(r'\s+',' ',html.unescape(title)).strip()
                          if any(k in title for k in ['九鼎新材','002201','正威新材']):
                              row={'month':month,'archive':r.url,'title':title,'href':href}
                              if row not in matches: matches.append(row)
                  except Exception as exc:
                      print('ARCHIVE_ERROR',month,url,repr(exc))

          print('MATCHES_JSON',json.dumps(matches,ensure_ascii=False))
          for row in matches:
              try:
                  r=s.get(row['href'],timeout=60,allow_redirects=True)
                  text=html.unescape(decode(r)).replace('\\/','/')
                  visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
                  visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
                  visible=re.sub(r'<[^>]+>',' ',visible)
                  visible=re.sub(r'\s+',' ',visible).strip()
                  assets=[]
                  for pat in [
                      r'https?://[^\s"\'<>]+',
                      r'(?:href|src|action)=["\']([^"\']+)["\']',
                      r'["\']([^"\']*(?:download|down|file|attach|pdf|doc|original|source)[^"\']*)["\']',
                  ]:
                      for val in re.findall(pat,text,flags=re.I):
                          if isinstance(val,tuple): val=val[0]
                          u=urljoin(r.url,html.unescape(unquote(val)))
                          if any(k in u.lower() for k in ['.pdf','.doc','download','down','file','attach','getreport','viewpdf','readpdf','original','source']):
                              if u not in assets: assets.append(u)
                  probes=[]
                  for u in assets:
                      try:
                          rr=s.get(u,timeout=30,allow_redirects=True,stream=True)
                          head=next(rr.iter_content(chunk_size=64),b'')
                          probes.append({'url':u,'final':rr.url,'status':rr.status_code,'type':rr.headers.get('content-type'),'length':rr.headers.get('content-length'),'head':head[:12].hex()})
                          rr.close()
                      except Exception as exc:
                          probes.append({'url':u,'error':repr(exc)})
                  print('REPORT_JSON',json.dumps({'row':row,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'visible_head':visible[:600],'assets':assets,'probes':probes},ensure_ascii=False))
              except Exception as exc:
                  print('REPORT_ERROR',json.dumps({'row':row,'error':repr(exc)},ensure_ascii=False))
          PY
