name: Inspect public Huabao deep report reader
on:
  push:
    branches: [chatgpt-huabao-international-reports-20260907]
    paths: ['.github/workflows/chatgpt-huabao-sgpjbg-html.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect public page source
        run: |
          mkdir -p result
          python - <<'PY'
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          url='https://www.sgpjbg.com.cn/baogao/1160562.html'
          s=requests.Session(); s.trust_env=False
          r=s.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=(20,90))
          print('HTTP',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
          Path('result/page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser'); links=[]
          for tag in soup.find_all(['img','a','iframe','embed','object','script','source']):
            for attr in ('src','href','data'):
              v=tag.get(attr)
              if v:
                u=urllib.parse.urljoin(r.url,v)
                if any(k in u.lower() for k in ('1160562','pdf','page','image','preview','upload','file','doc')):
                  links.append({'tag':tag.name,'attr':attr,'url':u})
          raw=[]
          for pat in [r'https?://[^\"\'<>\\s]+',r'[\"\']([^\"\']*(?:1160562|\.pdf|\.png|\.jpg|page|preview|upload)[^\"\']*)[\"\']']:
            for m in re.finditer(pat,r.text,re.I):
              v=m.group(1) if m.lastindex else m.group(0)
              if v not in raw: raw.append(v)
          data={'links':links,'raw':raw}
          Path('result/urls.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('LINKS',json.dumps(links[:300],ensure_ascii=False),flush=True)
          print('RAW',json.dumps(raw[:500],ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-sgpjbg-html
          path: result/
          retention-days: 3
