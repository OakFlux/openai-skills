name: Search public mirrors for Kaichuang International brokerage PDFs

on:
  push:
    paths:
      - '.github/workflows/kaichuang-international-web-search-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Search exact report titles across public search engines
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html, json, re, time
          from urllib.parse import quote, urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          queries = [
              '"开创国际" "近看政策扶持 远看产业延伸" pdf',
              '"开创国际" "金枪鱼捕捞量增长带动盈利持续上升" pdf',
              '"开创国际" "主业萧条依旧 期待业务转型" pdf',
              '"开创国际" "金枪鱼价格低迷 政府补贴贡献主要业绩" pdf',
              '"开创国际" 宏源证券 深度报告 2013 pdf',
              '600097 券商研报 pdf',
          ]
          engines = {
              'bing': lambda q: 'https://www.bing.com/search?q=' + quote(q),
              'baidu': lambda q: 'https://www.baidu.com/s?wd=' + quote(q),
              'sogou': lambda q: 'https://www.sogou.com/web?query=' + quote(q),
              'so360': lambda q: 'https://www.so.com/s?q=' + quote(q),
          }
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def clean_link(href, base):
              if not href: return None
              href = html.unescape(href)
              if href.startswith('//'): href = 'https:' + href
              if href.startswith('/'): href = urljoin(base, href)
              if href.startswith('javascript:') or href.startswith('#'): return None
              # unwrap common redirect query parameters
              try:
                  u = urlparse(href)
                  qs = parse_qs(u.query)
                  for key in ('url','target','u','q'):
                      if key in qs and qs[key]:
                          cand = unquote(qs[key][0])
                          if cand.startswith('http'): href = cand
              except Exception: pass
              return href if href.startswith('http') else None

          seen = set()
          for q in queries:
              print('\n### QUERY', q, flush=True)
              for name, build in engines.items():
                  url = build(q)
                  try:
                      r = s.get(url, timeout=45, allow_redirects=True)
                      print('ENGINE', name, r.status_code, len(r.content), r.url, r.headers.get('content-type'), flush=True)
                      text = r.text
                      soup = BeautifulSoup(text, 'lxml')
                      count = 0
                      for a in soup.find_all('a', href=True):
                          href = clean_link(a.get('href'), r.url)
                          title = ' '.join(a.get_text(' ', strip=True).split())
                          if not href or not title or len(title) < 3: continue
                          host = urlparse(href).netloc.lower()
                          if any(x in host for x in ('bing.com','baidu.com','sogou.com','so.com','microsoft.com')): continue
                          key=(href,title)
                          if key in seen: continue
                          low=(href+' '+title).lower()
                          if any(term in low for term in ('开创国际','600097','近看政策','金枪鱼','主业萧条','产业延伸','宏源证券','华鑫证券','pdf','研报','报告')):
                              seen.add(key); count += 1
                              print('RESULT', name, json.dumps({'title':title[:300],'url':href}, ensure_ascii=False), flush=True)
                              if count >= 30: break
                  except Exception as e:
                      print('ENGINE_ERROR', name, repr(e), flush=True)
                  time.sleep(1)
          PY
