name: Build Jingxue 301010 disclosure package

on:
  push:
    branches:
      - tmp-jingxue-301010-reports-20261103

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='晶雪节能_301010_全部年报_招股说明书_最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/jingxue_render

          python3 - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('晶雪节能_301010_全部年报_招股说明书_最新季报')
          ANN_API = 'https://np-anotice-stock.eastmoney.com/api/security/ann'

          def new_session() -> requests.Session:
              session = requests.Session()
              session.trust_env = False
              retry = Retry(
                  total=6,
                  connect=6,
                  read=6,
                  status=6,
                  backoff_factor=0.9,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET'],
                  raise_on_status=False,
              )
              session.mount('https://', HTTPAdapter(max_retries=retry))
              session.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              })
              return session

          # Retrieve the public announcement index and select exact full-report titles.
          session = new_session()
          rows: list[dict] = []
          for page in range(1, 13):
              response = session.get(
                  ANN_API,
                  params={
                      'sr': '-1',
                      'page_size': '100',
                      'page_index': str(page),
                      'ann_type': 'A',
                      'client_source': 'web',
                      'stock_list': '301010',
                  },
                  headers={'Referer': 'https://data.eastmoney.com/'},
                  timeout=(20, 120),
              )
              response.raise_for_status()
              page_rows = ((response.json().get('data') or {}).get('list') or [])
              if not page_rows:
                  break
              rows.extend(page_rows)
              print('ANNOUNCEMENT_PAGE', page, 'ROWS', len(page_rows))
              if len(page_rows) < 100:
                  break

          if not rows:
              raise RuntimeError('No announcement records returned for stock 301010')

          def title_of(row: dict) -> str:
              return re.sub(r'\s+', '', str(row.get('title') or row.get('title_ch') or ''))

          def date_of(row: dict) -> str:
              raw = str(row.get('display_time') or row.get('notice_date') or row.get('noticeDate') or '')
              return raw[:10]

          def select_exact(suffixes: list[str], excluded: tuple[str, ...]) -> dict:
              candidates = []
              for row in rows:
                  title = title_of(row)
                  if any(term in title for term in excluded):
                      continue
                  if any(title.endswith(suffix) for suffix in suffixes):
                      candidates.append(row)
              candidates.sort(key=lambda row: date_of(row), reverse=True)
              if not candidates:
                  raise RuntimeError(f'No exact announcement found for {suffixes!r}')
              return candidates[0]

          docs: list[dict] = [
              {
                  'order': 1,
                  'kind': 'prospectus',
                  'year': 2021,
                  'title': '首次公开发行股票并在创业板上市招股说明书',
                  'date': '2021-06-11',
                  'filename': '01_晶雪节能_首次公开发行股票并在创业板上市招股说明书_2021-06-11.pdf',
                  'min_pages': 300,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2021-06-11/1210217780.PDF',
                      'https://reportdocs.static.szse.cn/UpFiles/rasinfodisc/RAS_000176848698DE3FEE125E25873CCD3F.pdf',
                  ],
                  'art_code': '',
              },
          ]

          for order, year in enumerate(range(2021, 2026), start=2):
              row = select_exact(
                  [f'{year}年年度报告'],
                  ('摘要', '英文版', '问询', '回复', '提示性公告', '专项说明', '更正', '取消'),
              )
              art_code = str(row.get('art_code') or row.get('artCode') or '')
              if not art_code:
                  raise RuntimeError(f'{year} annual report has no art_code')
              docs.append({
                  'order': order,
                  'kind': 'annual',
                  'year': year,
                  'title': f'{year}年年度报告',
                  'date': date_of(row),
                  'filename': f'{order:02d}_晶雪节能_{year}年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.PDF',
                      f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.PDF',
                  ],
                  'art_code': art_code,
              })
              print('SELECT_ANNUAL', year, art_code, title_of(row), date_of(row))

          q3_row = select_exact(
              ['2026年第三季度报告', '2026年三季度报告'],
              ('提示性公告', '摘要', '问询', '回复', '专项说明'),
          )
          q3_art = str(q3_row.get('art_code') or q3_row.get('artCode') or '')
          if not q3_art:
              raise RuntimeError('2026 Q3 report has no art_code')
          docs.append({
              'order': 7,
              'kind': 'quarter',
              'year': 2026,
              'title': '2026年第三季度报告',
              'date': date_of(q3_row),
              'filename': '07_晶雪节能_2026年第三季度报告.pdf',
              'min_pages': 5,
              'urls': [
                  f'https://pdf.dfcfw.com/pdf/H2_{q3_art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{q3_art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{q3_art}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H3_{q3_art}_1.PDF',
                  'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-30/12678664.PDF',
              ],
              'art_code': q3_art,
          })
          print('SELECT_Q3', q3_art, title_of(q3_row), date_of(q3_row))

          def sample_text(reader: PdfReader) -> str:
              page_count = len(reader.pages)
              indexes = list(range(min(22, page_count)))
              if page_count > 22:
                  indexes.append(page_count - 1)
              chunks = []
              for idx in dict.fromkeys(indexes):
                  try:
                      chunks.append(reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              return re.sub(r'\s+', '', '\n'.join(chunks))

          def validate_pdf(path: Path, doc: dict) -> int:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < int(doc['min_pages']):
                  raise RuntimeError(f'page count below minimum: {pages}')
              compact = sample_text(reader)
              if '晶雪节能' not in compact and '江苏晶雪节能科技股份有限公司' not in compact:
                  raise RuntimeError('company name mismatch')
              if doc['kind'] == 'prospectus':
                  if '首次公开发行股票' not in compact or '招股说明书' not in compact:
                      raise RuntimeError('prospectus title mismatch')
              elif doc['kind'] == 'annual':
                  year = str(doc['year'])
                  if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                      raise RuntimeError('annual report title mismatch')
                  if '年度报告摘要' in compact[:1200]:
                      raise RuntimeError('annual-report summary received instead of full report')
              else:
                  if ('第三季度报告' not in compact and '三季度报告' not in compact) or '2026' not in compact:
                      raise RuntimeError('quarterly report title mismatch')
              return pages

          def download_one(doc: dict) -> dict:
              session = new_session()
              destination = OUT / doc['filename']
              last = None
              for url in list(dict.fromkeys(doc['urls'])):
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/' if 'dfcfw.com' in url else 'https://www.cninfo.com.cn/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 300),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(
                                  f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          pages = validate_pdf(destination, doc)
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', doc['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return {
                              **doc,
                              'pages': pages,
                              'bytes': len(data),
                              'source': response.url,
                              'sha256': sha,
                          }
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', doc['title'], url, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f'Could not download {doc["title"]}: {last!r}')

          records: list[dict] = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as executor:
              futures = [executor.submit(download_one, doc) for doc in docs]
              for future in concurrent.futures.as_completed(futures):
                  records.append(future.result())
          records.sort(key=lambda item: item['order'])

          lines = [
              '晶雪节能（301010）全部年度报告、招股说明书及最新季报资料包',
              '整理日期：2026-11-03',
              '',
              '收录范围：',
              '1. 公司于2021年6月18日在深交所创业板上市；上市公司口径的全部年度报告为2021-2025年度，共5份。',
              '2. 收录2021年6月11日披露的首次公开发行股票并在创业板上市招股说明书正式发行版。',
              '3. 最新季报为2026年10月30日披露的2026年第三季度报告。',
              '4. 未收录年度报告摘要、半年度报告、招股意向书、申报稿、注册稿或提示性公告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['filename']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   公告编号：{item['art_code'] or '1210217780'}",
                  f"   原始PDF：{item['source']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f'合计：7份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '晶雪节能|江苏晶雪节能科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/jingxue_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/jingxue_test.zip "$PACKAGE"
          unzip -t /tmp/jingxue_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/jingxue_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/jingxue_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Jingxue-301010-all-annual-reports-prospectus-latest-quarter
          path: 晶雪节能_301010_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
