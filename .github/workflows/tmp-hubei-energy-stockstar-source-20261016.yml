name: Inspect Hubei Energy Stockstar report page

on:
  push:
    branches: [tmp-hubei-energy-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hubei-energy-stockstar-source-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch and inspect source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            'https://stock.stockstar.com/JC2025121700034644.shtml' -o raw.html
          iconv -f GB18030 -t UTF-8 raw.html > page.html || cp raw.html page.html
          echo '===== href/src/action attributes ====='
          grep -Eio '(href|src|action)=["'"'][^"'"']+["'"']' page.html | sed -n '1,400p'
          echo '===== report/attachment/download/pdf/file context ====='
          grep -Ein -C 3 'pdf|附件|下载|attachment|download|file|研报|report|JC2025121700034644' page.html | sed -n '1,800p'
          echo '===== script names ====='
          grep -Eio '<script[^>]+src=["'"'][^"'"']+["'"']' page.html | sed -n '1,200p'
