name: Yaojie Report Probe

on:
  push:
    branches:
      - chatgpt-yaojie-reports-20260914

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Probe report sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/pages
          cat > /tmp/probe.py <<'PY'
          import json, re, time
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('probe')
          PAGES = OUT / 'pages'
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          records=[]
          links=[]

          def safe_name(x):
              return re.sub(r'[^A-Za-z0-9._-]+','_',x)[:140]

          def fetch(url, tag, method='get', **kwargs):
              try:
                  r=s.request(method,url,timeout=50,allow_redirects=True,**kwargs)
                  ctype=r.headers.get('content-type','')
                  rec={'tag':tag,'url':url,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'content_type':ctype}
                  records.append(rec)
                  print('FETCH',json.dumps(rec,ensure_ascii=False))
                  ext='.html' if ('html' in ctype or r.text.lstrip().startswith('<')) else '.bin'
                  p=PAGES/(safe_name(tag)+ext)
                  p.write_bytes(r.content)
                  if ext=='.html':
                      parse_html(r.text,r.url,tag)
                  return r
              except Exception as e:
                  rec={'tag':tag,'url':url,'error':repr(e)};records.append(rec);print('ERR',json.dumps(rec,ensure_ascii=False));return None

          def unwrap_search_link(href):
              if not href: return None
              if href.startswith('//'): href='https:'+href
              if href.startswith('/'): return None
              if 'bing.com/ck/a' in href or 'google.com/url' in href:
                  q=parse_qs(urlparse(href).query)
                  for k in ('u','url','q'):
                      if k in q and q[k]:
                          v=q[k][0]
                          if v.startswith('a1'):
                              import base64
                              try: v=base64.b64decode(v[2:]+'===').decode('utf-8','ignore')
                              except Exception: pass
                          if v.startswith('http'): return v
              return href if href.startswith('http') else None

          def parse_html(text, base, tag):
              soup=BeautifulSoup(text,'lxml')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              print('TITLE',tag,repr(title))
              for a in soup.find_all('a',href=True):
                  href=unwrap_search_link(urljoin(base,a['href']))
                  if href:
                      txt=a.get_text(' ',strip=True)
                      links.append({'source':tag,'url':href,'text':txt[:300]})
              for el in soup.find_all(True):
                  for attr in ('src','data-src','data-original','content','value'):
                      v=el.get(attr)
                      if isinstance(v,str) and (v.startswith('http') or v.startswith('//') or v.startswith('/')):
                          links.append({'source':tag,'url':urljoin(base,v),'text':f'{el.name}:{attr}'})
              # Save focused contexts.
              contexts=[]
              for pat in ['药捷安康','藥捷安康','02617','4899187','download','pdf','image','page','report','api','__NEXT_DATA__']:
                  for m in list(re.finditer(pat,text,re.I))[:50]:
                      contexts.append({'pattern':pat,'context':text[max(0,m.start()-700):m.end()+1200]})
              (PAGES/(safe_name(tag)+'_contexts.json')).write_text(json.dumps(contexts,ensure_ascii=False,indent=2),encoding='utf-8')
              nd=soup.find('script',id='__NEXT_DATA__')
              if nd and nd.string:
                  (PAGES/(safe_name(tag)+'_next_data.json')).write_text(nd.string,encoding='utf-8')

          direct={
            'fx_detail_4899187':'https://www.fxbaogao.com/detail/4899187',
            'fx_search_keyword':'https://www.fxbaogao.com/search?keyword='+quote('药捷安康'),
            'fx_search_q':'https://www.fxbaogao.com/search?q='+quote('药捷安康'),
            'fx_home_q':'https://www.fxbaogao.com/?q='+quote('药捷安康'),
            'sg_search_1':'https://www.sgpjbg.com/Search.html?q='+quote('药捷安康'),
            'sg_search_2':'https://www.sgpjbg.com/search.html?q='+quote('药捷安康'),
            'sg_search_3':'https://www.sgpjbg.com/yanbaokulist.html?q='+quote('药捷安康'),
            'reportify_search':'https://www.reportify.cn/search?q='+quote('药捷安康'),
            'reportify_search2':'https://reportify.cn/search?keyword='+quote('药捷安康'),
          }
          for tag,u in direct.items():
              fetch(u,tag)

          queries=[
            '"药捷安康" 研报 PDF',
            '"药捷安康-B" 券商 研报',
            '"藥捷安康" 新股報告 PDF',
            'site:fxbaogao.com/detail 药捷安康',
            'site:sgpjbg.com/baogao 药捷安康',
            'site:sgpjbg.com/bgdown 药捷安康',
            'site:pdf.dfcfw.com 药捷安康',
            'site:reportify.cn 药捷安康 研报',
            '"02617.HK" "证券研究报告"',
            '"02617" "新股报告"',
            '"Tinengotinib" "research report" broker',
          ]
          for i,q in enumerate(queries):
              fetch('https://www.bing.com/search?q='+quote(q),f'bing_{i}')
              fetch('https://html.duckduckgo.com/html/?q='+quote(q),f'ddg_{i}',method='post',data={'q':q})
              time.sleep(.2)

          # Fetch promising discovered links.
          uniq=[]; seen=set()
          for x in links:
              u=x['url']
              if u in seen: continue
              seen.add(u); uniq.append(x)
          promising=[]
          for x in uniq:
              u=(x['url'] or '').lower(); t=(x.get('text') or '').lower()
              if any(k in u for k in ['fxbaogao.com/detail','sgpjbg.com/baogao','sgpjbg.com/bgdown','pdf.dfcfw.com','reportify.cn/report','research','report']) and any(k in (u+t) for k in ['药捷安康','%e8%8d%af%e6%8d%b7%e5%ae%89%e5%ba%b7','02617','yaojie','transhera','transthera','tinengotinib']):
                  promising.append(x)
          (OUT/'all_links.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'promising_links.json').write_text(json.dumps(promising,ensure_ascii=False,indent=2),encoding='utf-8')
          for i,x in enumerate(promising[:40]):
              fetch(x['url'],f'promising_{i}')

          (OUT/'fetch_records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY records',len(records),'links',len(uniq),'promising',len(promising))
          PY
          python /tmp/probe.py

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: yaojie-report-probe
          path: probe
          retention-days: 1
