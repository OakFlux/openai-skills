name: chatgpt-temp-xintian-eastmoney-focused
on:
  push:
    branches: [chatgpt-temp-xintian-green-reports-20260906]
    paths: ['.github/workflows/chatgpt-temp-xintian-eastmoney-focused.yml']
permissions:
  contents: read
jobs:
  search-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query exact publication windows and download PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python <<'PY'
          import requests,json,re,time,hashlib,zipfile
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('focused'); pdfdir=root/'PDF'; pdfdir.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/json, text/plain, */*'})
          api='https://reportapi.eastmoney.com/report/list2'
          windows=[
            ('2025-03-14','2025-03-21'),
            ('2025-05-22','2025-05-30'),
            ('2025-08-03','2025-08-10'),
            ('2026-05-28','2026-06-05'),
          ]
          matches=[]; seen=set(); logs=[]
          def L(x): x=str(x); print(x); logs.append(x)
          for start,end in windows:
            for page in range(1,30):
              body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':start,'endTime':end,'code':'','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              r=s.post(api,json=body,headers={'Content-Type':'application/json'},timeout=45)
              L(f'POST {start}..{end} p{page}: {r.status_code} {len(r.content)}')
              if not r.ok: break
              obj=r.json(); rows=obj.get('data') or []
              if isinstance(rows,dict): rows=rows.get('data') or rows.get('list') or []
              if not isinstance(rows,list): rows=[]
              L(f' rows={len(rows)} hits={obj.get("hits")} TotalPage={obj.get("TotalPage")}')
              for x in rows:
                txt=json.dumps(x,ensure_ascii=False)
                if any(k in txt for k in ['新天绿能','新天绿色能源','600956','00956']):
                  key=x.get('infoCode') or txt
                  if key not in seen:
                    seen.add(key); matches.append(x); L('MATCH '+txt)
              total=int(obj.get('TotalPage') or 1)
              if not rows or page>=total: break
              time.sleep(.25)
          (root/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          L(f'MATCHES {len(matches)}')
          downloaded=[]
          for x in matches:
            info=x.get('infoCode') or x.get('INFO_CODE')
            if not info: continue
            title=x.get('title') or '新天绿能研报'; org=x.get('orgSName') or x.get('orgName') or '券商'; dt=str(x.get('publishDate') or '')[:10]
            for url in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf',f'https://pdf.dfcfw.com/pdf/{info}_1.pdf']:
              rr=s.get(url,headers={'Referer':'https://data.eastmoney.com/'},timeout=90,allow_redirects=True)
              L(f'GET {info}: {rr.status_code} {len(rr.content)} {rr.headers.get("content-type")} {url}')
              if rr.status_code==200 and len(rr.content)>50000 and rr.content.startswith(b'%PDF-'):
                fn=re.sub(r'[\\/:*?"<>|]+','_',f'{dt}_{org}_新天绿能_{title}')[:180]+'.pdf'
                p=pdfdir/fn; p.write_bytes(rr.content)
                try: pages=len(PdfReader(str(p)).pages)
                except Exception as e: L(f'BADPDF {e!r}'); p.unlink(missing_ok=True); continue
                sha=hashlib.sha256(rr.content).hexdigest()
                downloaded.append({'filename':fn,'title':title,'org':org,'date':dt,'pages':pages,'size':len(rr.content),'sha256':sha,'url':rr.url,'infoCode':info})
                L(f'VALID {fn}: {pages} pages')
                break
          (root/'downloaded.json').write_text(json.dumps(downloaded,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          if downloaded:
            with zipfile.ZipFile(root/'downloaded_pdfs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for x in downloaded: z.write(pdfdir/x['filename'],arcname=x['filename'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Xintian-Eastmoney-Focused-Results
          path: focused
          retention-days: 1
          compression-level: 6
