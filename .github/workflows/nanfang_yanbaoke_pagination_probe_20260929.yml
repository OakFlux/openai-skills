name: South Precision Yanbaoke Pagination Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_yanbaoke_pagination_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Enumerate bearing tag pages and locate South Precision reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          bases=[
            'https://www.yanbaoke.com/tag/%E8%BD%B4%E6%89%BF',
            'https://www.yanbaoke.com/tag/%E8%BD%B4%E6%89%BF?page={page}',
            'https://www.yanbaoke.com/tag/%E8%BD%B4%E6%89%BF/{page}',
          ]
          terms=['南方精工','南方轴承','国内滚针轴承民企龙头','新能源汽车注入新活力','进军飞机轮胎再制造','工艺延伸促成长','轴承+芯片','轴承＋芯片','积极开拓市场']
          results=[]; visited=set()
          for page in range(1,7):
            urls=[]
            if page==1: urls.append(bases[0])
            urls.extend([bases[1].format(page=page),bases[2].format(page=page)])
            for url in urls:
              if url in visited: continue
              visited.add(url)
              try:
                r=session.get(url,timeout=60,allow_redirects=True)
                text=r.content.decode('utf-8','replace')
                print('\nPAGE_FETCH',page,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                Path(f'output/page_{page}_{len(results)}.html').write_text(text,encoding='utf-8')
                soup=BeautifulSoup(text,'html.parser')
                print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                report_links=[]
                for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(r.url,a['href'])
                  if '/info/' in href:
                    report_links.append({'text':label,'href':href})
                  blob=label+' '+href
                  if any(term in blob for term in terms):
                    item={'page':page,'source_url':r.url,'text':label,'href':href}
                    if item not in results: results.append(item)
                    print('MATCH_LINK',json.dumps(item,ensure_ascii=False))
                print('INFO_LINK_COUNT',len(report_links))
                for item in report_links:
                  if any(term in item['text'] for term in terms):
                    print('MATCH_INFO',json.dumps(item,ensure_ascii=False))
                for i,line in enumerate(text.splitlines(),1):
                  if any(term in line for term in terms):
                    print('MATCH_LINE',i,line[:12000])
                # stop alternate path checks when the requested page clearly loaded
                if f'第 {page} /' in text or f'第{page}/' in text:
                  break
              except Exception as exc:
                print('FETCH_ERR',page,url,repr(exc))
          Path('output/matches.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\nALL_MATCHES',json.dumps(results,ensure_ascii=False,indent=2))
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-yanbaoke-pagination-probe
          path: output/
          retention-days: 1
