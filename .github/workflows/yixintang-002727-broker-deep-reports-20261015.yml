name: Build Yixintang 002727 broker deep reports 20261015

on:
  push:
    paths:
      - '.github/workflows/yixintang-002727-broker-deep-reports-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package = '一心堂_002727_券商深度报告_完整版_3份'
          root = Path(package)
          root.mkdir(exist_ok=True)
          tmp_preview = Path('_preview_validation')
          tmp_preview.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '国金证券',
                  'date': '2022-03-21',
                  'analysts': '袁维',
                  'rating': '买入',
                  'title': '一心堂：立足西南，辐射全国',
                  'info_code': 'AP202203211554018436',
                  'expected_pages': 19,
                  'min_pages': 15,
                  'terms': ['一心堂', '立足西南', '辐射全国'],
                  'filename': '01_国金证券_一心堂_立足西南辐射全国_2022-03-21_19页.pdf',
              },
              {
                  'broker': '国元证券',
                  'date': '2019-07-25',
                  'analysts': '金红',
                  'rating': '买入',
                  'title': '一心堂公司研究报告：相看两不厌，论道一心堂',
                  'info_code': 'AP201907251341395775',
                  'expected_pages': 44,
                  'min_pages': 35,
                  'terms': ['一心堂', '相看两不厌', '论道一心堂'],
                  'filename': '02_国元证券_一心堂_相看两不厌论道一心堂_2019-07-25_44页.pdf',
              },
              {
                  'broker': '太平洋证券',
                  'date': '2018-08-15',
                  'analysts': '杜佐远、蔡明子',
                  'rating': '买入',
                  'title': '深度报告——《品牌药店》公司篇之一心堂：少区域高密度，收获期成长',
                  'info_code': 'AP201808151178798332',
                  'expected_pages': 41,
                  'min_pages': 35,
                  'terms': ['一心堂', '少区域高密度', '收获期成长'],
                  'filename': '03_太平洋证券_一心堂_少区域高密度收获期成长_2018-08-15_41页.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(info_code: str) -> tuple[bytes, str]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              ]
              last = None
              for url in urls:
                  for attempt in range(7):
                      try:
                          r = session.get(
                              url,
                              timeout=(25, 240),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url': url,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          }
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 100_000:
                              return r.content, url
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          manifest = []
          for idx, report in enumerate(reports, 1):
              data, pdf_url = download_pdf(report['info_code'])
              dest = root / report['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'too few pages: {dest.name}: {pages} < {report["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(15, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', extracted)
              if not any(term in compact for term in ['一心堂', '002727', '云南鸿翔一心堂']):
                  raise RuntimeError(f'issuer identity check failed: {dest.name}')
              matched_terms = [term for term in report['terms'] if re.sub(r'\s+', '', term) in compact]
              if not matched_terms:
                  raise RuntimeError(f'title keyword check failed: {dest.name}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = tmp_preview / f'{idx:02d}'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'first-page render failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **report,
                  'actual_pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'source_report_page': f'https://data.eastmoney.com/report/info/{report["info_code"]}.html',
                  'pdf_url': pdf_url,
                  'matched_terms': matched_terms,
                  'document_nature': '券商原始完整PDF',
                  'validation': [
                      'PDF header', 'issuer identity', 'title keywords', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              })

          readme = [
              '一心堂药业集团股份有限公司（002727.SZ）券商深度报告完整版资料包',
              '整理日期：2026-10-15',
              '',
              '本包收录3份公开可直接取得的券商原始完整PDF，均为公司深度/长篇公司研究报告，不以短篇业绩点评凑数。',
              '筛选时优先保留较新的长篇报告，并补充两份页数较多、研究框架完整的经典深度报告。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f'{i}. {item["broker"]}：《{item["title"]}》',
                  f'   日期：{item["date"]}；分析师：{item["analysts"]}；评级：{item["rating"]}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_report_page"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme += [
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、标题关键词、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(package + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      zf.write(p, arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              pdfs = [name for name in zf.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          alias = Path('yixintang_broker_deep_reports_3_full.zip')
          alias.write_bytes(zip_path.read_bytes())
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: yixintang-002727-broker-deep-reports-full-3
          path: |
            一心堂_002727_券商深度报告_完整版_3份.zip
            yixintang_broker_deep_reports_3_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
