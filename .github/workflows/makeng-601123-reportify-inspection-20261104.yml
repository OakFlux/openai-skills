name: Inspect Reportify Makeng Mining report

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-reportify-inspection-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Inspect page, APIs, and candidate files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import io, json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, quote
          from pypdf import PdfReader

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          urls=[
            'https://reportify.cn/reports?page=3&report_region=&report_types=9',
            'https://reportify.cn/reports?keyword='+quote('马矿股份'),
            'https://reportify.cn/search?keyword='+quote('马矿股份'),
          ]
          scripts=[]; candidates=[]; report_links=[]
          for idx,url in enumerate(urls):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nPAGE',idx,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path('out',f'page_{idx}.html').write_bytes(r.content)
              text=r.text; soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              if '马矿股份' in text: print('CONTAINS_TARGET',idx,flush=True)
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                full=urljoin(r.url,a['href'])
                if '马矿股份' in label or '新股精要' in label:
                  print('TARGET_LINK',json.dumps({'label':label,'url':full},ensure_ascii=False),flush=True); report_links.append(full)
                if '/reports/' in full and full.rstrip('/').split('/')[-1].isdigit(): report_links.append(full)
              for script in soup.find_all('script',src=True): scripts.append(urljoin(r.url,script['src']))
              raw=text.replace('\\/','/')
              for pat in [
                r'"(?:id|report_id|reportId)"\s*:\s*"?([0-9]{6,})"?',
                r'/(?:reports|report)/([0-9]{6,})',
                r'https?://[^\s"\'<>]+',
              ]:
                for m in re.finditer(pat,raw,re.I):
                  val=m.group(1) if m.lastindex else m.group(0)
                  if val.isdigit():
                    if '马矿股份' in raw[max(0,m.start()-2000):m.end()+2000]: print('NEAR_TARGET_ID',val,flush=True)
                  else:
                    if any(k in val.lower() for k in ('.pdf','download','file','report')): candidates.append(val)
            except Exception as e: print('PAGE_ERROR',url,repr(e),flush=True)

          for idx,url in enumerate(dict.fromkeys(scripts)):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('SCRIPT',idx,r.status_code,len(r.content),url,flush=True)
              Path('out',f'script_{idx}.js').write_bytes(r.content)
              text=r.text.replace('\\/','/')
              if any(k in text for k in ('马矿股份','report_id','pdf_url','download_url','original_url')): print('SCRIPT_RELEVANT',idx,flush=True)
              for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',text,re.I):
                val=m.group(0).rstrip('),;]}')
                if val.startswith('//'):val='https:'+val
                full=urljoin(r.url,val)
                if any(k in full.lower() for k in ('.pdf','download','api/reports','report/detail','report/file','original')): candidates.append(full)
            except Exception as e: print('SCRIPT_ERROR',url,repr(e),flush=True)

          # Try plausible public API queries.
          api_urls=[
            'https://reportify.cn/api/reports?keyword='+quote('马矿股份'),
            'https://reportify.cn/api/v1/reports?keyword='+quote('马矿股份'),
            'https://reportify.cn/api/search?keyword='+quote('马矿股份'),
            'https://reportify.cn/api/reports/search?keyword='+quote('马矿股份'),
            'https://reportify.cn/api/reports?page=3&report_types=9',
          ]
          for idx,url in enumerate(api_urls):
            try:
              r=s.get(url,headers={'Referer':'https://reportify.cn/reports'},timeout=45,allow_redirects=True)
              print('API',idx,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.text[:1000],flush=True)
              Path('out',f'api_{idx}.txt').write_bytes(r.content)
              if '马矿股份' in r.text:
                for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/(?:reports|report)/[0-9]+''',r.text.replace('\\/','/'),re.I):
                  val=m.group(0).rstrip('),;]}')
                  if val.startswith('//'):val='https:'+val
                  full=urljoin(r.url,val)
                  print('API_TARGET_CANDIDATE',full,flush=True); candidates.append(full); report_links.append(full)
            except Exception as e:print('API_ERROR',url,repr(e),flush=True)

          for url in list(dict.fromkeys(report_links))[:100]:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nREPORT_PAGE',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; Path('out','report_'+re.sub(r'\D','',url)[-20:]+'.html').write_bytes(r.content)
              if '马矿股份' not in text and '新股精要' not in text: continue
              soup=BeautifulSoup(text,'html.parser'); print('REPORT_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              raw=text.replace('\\/','/')
              for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',raw,re.I):
                val=m.group(0).rstrip('),;]}')
                if val.startswith('//'):val='https:'+val
                full=urljoin(r.url,val)
                if any(k in full.lower() for k in ('.pdf','download','file','original','attachment')):
                  print('REPORT_CANDIDATE',full,flush=True); candidates.append(full)
            except Exception as e:print('REPORT_PAGE_ERROR',url,repr(e),flush=True)

          seen=set()
          for url in candidates:
            if not url or url in seen or url.startswith(('javascript:','mailto:')):continue
            seen.add(url)
            try:
              r=s.get(url,headers={'Referer':'https://reportify.cn/reports'},timeout=45,allow_redirects=True)
              print('TEST',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              if r.content.startswith(b'%PDF'):
                rd=PdfReader(io.BytesIO(r.content),strict=False); tx=''
                for j in range(min(3,len(rd.pages))):
                  try:tx+=rd.pages[j].extract_text() or ''
                  except Exception:pass
                print('PDF_OK',json.dumps({'url':url,'resolved':r.url,'pages':len(rd.pages),'bytes':len(r.content),'text':re.sub(r'\s+',' ',tx)[:800]},ensure_ascii=False),flush=True)
                Path('out','reportify_recovered.pdf').write_bytes(r.content)
            except Exception as e:print('TEST_ERROR',url,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-601123-reportify-inspection-20261104
          path: out/
          if-no-files-found: error
          retention-days: 7
