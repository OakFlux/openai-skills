name: Knight Dairy Broker Report Probe

on:
  push:
    branches:
      - chatgpt-knight-dairy-broker-reports-20261004
    paths:
      - .github/workflows/knight_dairy_broker_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Query Eastmoney report API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/stock.jshtml',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          url='https://reportapi.eastmoney.com/report/list2'
          all_rows=[]
          for code in ('920786','832786'):
            for page in range(1,20):
              payload={
                'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,
                'beginTime':'2015-01-01','endTime':'2026-10-04','code':code,
                'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':'',
              }
              r=session.post(url,json=payload,headers={'Content-Type':'application/json'},timeout=90)
              print('API',code,page,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              r.raise_for_status()
              obj=r.json()
              rows=obj.get('data') or []
              print('PAGE_ROWS',len(rows),'HITS',obj.get('hits'),'TOTALPAGE',obj.get('TotalPage') or obj.get('totalPage'))
              for row in rows:
                if str(row.get('stockCode') or '') in ('920786','832786') or '骑士乳业' in str(row.get('stockName') or ''):
                  rec={
                    'infoCode':row.get('infoCode'),'title':row.get('title'),'orgSName':row.get('orgSName'),
                    'publishDate':row.get('publishDate'),'stockName':row.get('stockName'),'stockCode':row.get('stockCode'),
                    'attachPages':row.get('attachPages'),'attachSize':row.get('attachSize'),
                    'emRatingName':row.get('emRatingName'),'researcher':row.get('researcher'),
                  }
                  print('ROW',json.dumps(rec,ensure_ascii=False))
                  all_rows.append(row)
              total_pages=obj.get('TotalPage') or obj.get('totalPage') or 1
              if page>=int(total_pages) or not rows:
                break
          dedup={}
          for row in all_rows:
            key=str(row.get('infoCode') or '')
            if key: dedup[key]=row
          records=list(dedup.values())
          records.sort(key=lambda r:str(r.get('publishDate') or ''),reverse=True)
          Path('output/knight_dairy_reports.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_MATCH_COUNT',len(records))
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: knight-dairy-broker-report-probe
          path: output/knight_dairy_reports.json
          retention-days: 1
