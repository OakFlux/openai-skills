name: Probe secondary public sources for Pacific Basin reports 20260908

on:
  push:
    paths:
      - '.github/workflows/pacific-basin-secondary-sources-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch pages and candidate PDFs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf
          python - <<'PY'
          import json,re,html,hashlib
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          out=Path('probe'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages={
            'baogaobox':'https://www.baogaobox.com/reports/260202000092742.html',
            'hibor':'https://www.hibor.net/data/f1afc5289c4c2310025ded855b017b7d.html',
            'cy_mmm':'https://www.cy-mmm.com/doc-7a04cf61158b5597085177513f6a8ecf.html',
            'nxny_stock':'https://www.nxny.com/stock/stock_02343/',
            'nxny_huachuang':'https://www.nxny.com/report/view_6445965.html',
            'futunn_changjiang':'https://news.futunn.com/post/68228653/pacific-basin-shipping-02343-hk-steady-progress-for-the-long',
          }
          for name,url in pages.items():
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('\nPAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              (out/f'{name}.bin').write_bytes(r.content)
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')]
              links=[urljoin(r.url,x.get('href')) for x in soup.find_all('a') if x.get('href')]
              imgs=[urljoin(r.url,x.get('src')) for x in soup.find_all('img') if x.get('src')]
              raw=re.findall(r'(?:https?:)?\\?/\\?/[^\"\'<>\\s]+',text)
              raw=[html.unescape(('https:'+x if x.startswith('//') else x).replace('\\/','/')) for x in raw]
              hits=sorted(set(scripts+links+imgs+raw))
              for h in hits:
                low=h.lower()
                if any(k in low for k in ['.pdf','download','preview','report','file','attachment','oss','image','img','static','api']):
                  print('HIT',name,h[:2000])
              # Search text for likely identifiers and embedded data.
              for pat in ['pdf','download','fileurl','file_url','attachment','preview','reportid','report_id','pagecount','pages','260202000092742','f1afc5289c4c2310025ded855b017b7d','7a04cf61158b5597085177513f6a8ecf']:
                pos=0; count=0
                while True:
                  i=text.lower().find(pat.lower(),pos)
                  if i<0 or count>=10: break
                  print('CTX',name,pat,i,repr(text[max(0,i-300):min(len(text),i+700)]))
                  pos=i+len(pat); count+=1
              # Fetch reasonable JS files and search for endpoint strings.
              for i,js in enumerate(scripts[:30]):
                try:
                  rr=s.get(js,timeout=60)
                  if rr.status_code==200 and 0<len(rr.content)<12_000_000:
                    jp=out/f'{name}_script_{i}.js'; jp.write_bytes(rr.content)
                    jt=rr.text
                    if any(k in jt.lower() for k in ['pdf','download','report','preview','attachment']):
                      print('JS',name,i,js,len(rr.content))
                      for m in re.finditer(r'[^\"\']{0,120}(?:pdf|download|preview|attachment|report)[^\"\']{0,400}',jt,re.I):
                        x=m.group(0)
                        if any(z in x.lower() for z in ['http','api','url','path','src','href']): print('JSHIT',name,repr(x[:1000]))
                except Exception as e: print('JSERR',name,js,repr(e))
            except Exception as e: print('PAGEERR',name,repr(e))

          pdfs={
            'gtjai_20180228':'https://www.gtjai.com/UploadFiles/gtja_Report/2018/02/%E5%9B%BD%E6%B3%B0%E5%90%9B%E5%AE%89%E5%9B%BD%E9%99%85-%E5%A4%AA%E5%B9%B3%E6%B4%8B%E8%88%AA%E8%BF%90%20(2343%20HK)%20%E2%80%93%20%E8%A1%8C%E4%B8%9A%E5%A4%8D%E8%8F%8F%E4%B8%AD%E5%A4%84%E4%BA%8E%E7%BB%9D%E4%BD%B3%E4%BD%8D%E7%BD%AE_20180228.pdf',
            'deutsche_201807':'https://img3.gelonghui.com/pdf201807/pdf20180731140034904.pdf',
          }
          for name,url in pdfs.items():
            try:
              r=s.get(url,timeout=(30,240),allow_redirects=True)
              p=out/f'{name}.pdf'; p.write_bytes(r.content)
              print('\nPDF',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.content[:16])
              if r.content.startswith(b'%PDF-'):
                reader=PdfReader(str(p),strict=False)
                print('PDFPAGES',name,len(reader.pages),'SHA',hashlib.sha256(r.content).hexdigest())
                for ix in sorted(set([0,max(0,len(reader.pages)//2),len(reader.pages)-1])):
                  try: print('PDFTEXT',name,ix+1,repr((reader.pages[ix].extract_text() or '')[:1500]))
                  except Exception as e: print('PDFTEXTERR',name,ix+1,repr(e))
            except Exception as e: print('PDFERR',name,repr(e))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pacific-basin-secondary-sources
          path: probe/
          retention-days: 7
          if-no-files-found: error
