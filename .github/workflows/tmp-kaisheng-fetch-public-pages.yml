name: Temporary Kaisheng fetch public report pages

on:
  push:
    branches:
      - tmp-kaisheng-probe-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' 'https://www.sdyanbao.com/detail/767990' -o pages/sdyanbao.html || true
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' 'https://www.sgpjbg.com/baogao/81275.html' -o pages/sgpjbg_81275.html || true
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' 'https://bg.sgpjbg.com/bgdown/81275.html' -o pages/sgpjbg_down_81275.html || true
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' 'https://www.fxbaogao.com/view?id=4329722' -o pages/fxbaogao_view.html || true
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' 'https://www.fxbaogao.com/detail/4329722' -o pages/fxbaogao_detail.html || true
          wc -c pages/* || true
      - name: Upload pages
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-public-pages
          path: pages/*
          retention-days: 1
          if-no-files-found: warn
