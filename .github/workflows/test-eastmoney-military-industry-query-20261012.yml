name: Test Eastmoney military industry report query 20261012
on:
  push:
    paths:
      - '.github/workflows/test-eastmoney-military-industry-query-20261012.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query
        run: |
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          tests=[
            {'industryCode':'*','industry':'国防军工'},
            {'industryCode':'1232','industry':'*'},
            {'industryCode':'*','industry':'*'},
          ]
          for t in tests:
            p={**t,'pageSize':'20','rating':'*','ratingChange':'*','beginTime':'2021-07-01','endTime':'2026-10-12','pageNo':'1','fields':'','qType':'1','orgCode':'','rcode':''}
            r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=60)
            print('\nTEST',t,'STATUS',r.status_code,'URL',r.url)
            d=r.json(); print('HITS',d.get('hits'),'ROWS',len(d.get('data') or []))
            for x in (d.get('data') or [])[:20]: print(json.dumps({'title':x.get('title'),'date':x.get('publishDate'),'industryCode':x.get('industryCode'),'industryName':x.get('industryName'),'infoCode':x.get('infoCode'),'pages':x.get('attachPages')},ensure_ascii=False))
          PY
