name: Temporary Fetch Jinmei Technology Filings

on:
  push:
    branches:
      - tmp/fetch-jinmei-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests

          STOCK_ID = '600844'
          ROOT = Path('jinmei_package')
          PDF_DIR = ROOT / '01_年度报告及半年度报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://vip.stock.finance.sina.com.cn/',
          })

          def decode_response(response):
              raw = response.content
              for encoding in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      continue
              return raw.decode('utf-8', errors='ignore')

          def clean_visible(text):
              text = re.sub(r'<script\b[^>]*>.*?</script>', ' ', text, flags=re.I | re.S)
              text = re.sub(r'<style\b[^>]*>.*?</style>', ' ', text, flags=re.I | re.S)
              text = re.sub(r'<[^>]+>', ' ', text)
              return re.sub(r'\s+', ' ', html.unescape(text)).strip()

          def extract_id(href):
              href = html.unescape(unquote(href))
              for pattern in [r'(?:[?&])id=(\d+)', r'/id/(\d+)', r'(?:%3F|%26)id(?:=|%3D)(\d+)']:
                  match = re.search(pattern, href, flags=re.I)
                  if match:
                      return match.group(1)
              return None

          def collect_report_anchors(page_url):
              response = session.get(page_url, timeout=60)
              response.raise_for_status()
              page_html = html.unescape(decode_response(response)).replace('\\/', '/')
              anchors = []
              for match in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', page_html, flags=re.I | re.S):
                  href = match.group(1)
                  visible = clean_visible(match.group(2))
                  bulletin_id = extract_id(href)
                  if bulletin_id:
                      anchors.append({'title': visible, 'id': bulletin_id, 'href': href})
              return anchors

          annual_page = f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK_ID}/page_type/ndbg.phtml'
          all_page = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK_ID}.phtml'
          anchors = collect_report_anchors(annual_page) + collect_report_anchors(all_page)

          def choose_annual(year):
              candidates = []
              for anchor in anchors:
                  title = anchor['title']
                  if year not in title or '年度报告' not in title or '半年度报告' in title or '摘要' in title:
                      continue
                  candidates.append(anchor)
              if not candidates:
                  raise RuntimeError(f'No full annual report anchor found for {year}')
              # Prefer revised/corrected/full-text versions when present; otherwise keep page order.
              candidates.sort(key=lambda item: (
                  0 if any(term in item['title'] for term in ['修订', '更正', '全文']) else 1,
                  anchors.index(item),
              ))
              return candidates[0]

          def choose_latest_half_year():
              candidates = []
              for anchor in anchors:
                  title = anchor['title']
                  match = re.search(r'(20\d{2})年半年度报告', title)
                  if not match or '摘要' in title:
                      continue
                  candidates.append((int(match.group(1)), anchor))
              if not candidates:
                  raise RuntimeError('No full half-year report anchor found')
              candidates.sort(key=lambda pair: pair[0], reverse=True)
              return candidates[0][1]

          documents = []
          for index, year in enumerate(['2020', '2021', '2022', '2023', '2024', '2025'], start=1):
              anchor = choose_annual(year)
              documents.append({
                  'kind': 'annual_report',
                  'year': year,
                  'label': anchor['title'],
                  'detail_id': anchor['id'],
                  'filename': f'{index:02d}_金煤科技_原丹化科技_{year}年年度报告.pdf',
                  'min_pages': 80,
              })

          half_anchor = choose_latest_half_year()
          half_year_match = re.search(r'(20\d{2})年半年度报告', half_anchor['title'])
          half_year = half_year_match.group(1)
          documents.append({
              'kind': 'half_year_report',
              'year': half_year,
              'label': half_anchor['title'],
              'detail_id': half_anchor['id'],
              'filename': f'07_金煤科技_{half_year}年半年度报告.pdf',
              'min_pages': 50,
          })

          print('SELECTED DOCUMENTS:')
          for item in documents:
              print(item)

          def detail_url(bulletin_id):
              return f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid={STOCK_ID}'

          def extract_pdf_urls(detail_html, base_url):
              text = html.unescape(detail_html).replace('\\/', '/')
              urls = []
              patterns = [
                  r'https?://file\.finance\.sina\.com\.cn/[^\s"\'<>]+?\.PDF',
                  r'(?:href|src)=["\']([^"\']+?\.PDF)["\']',
              ]
              for pattern in patterns:
                  for match in re.findall(pattern, text, flags=re.I):
                      value = match if isinstance(match, str) else match[0]
                      url = unquote(urljoin(base_url, value))
                      if url not in urls:
                          urls.append(url)
              return urls

          def looks_like_pdf(raw):
              return len(raw) > 100_000 and raw.lstrip().startswith(b'%PDF') and b'%%EOF' in raw[-16384:]

          def download_document(item):
              detail = detail_url(item['detail_id'])
              response = session.get(detail, timeout=60)
              response.raise_for_status()
              detail_html = decode_response(response)
              pdf_urls = extract_pdf_urls(detail_html, detail)
              if not pdf_urls:
                  raise RuntimeError(f'No PDF URL found on detail page: {detail}')

              errors = []
              for pdf_url in pdf_urls:
                  for attempt in range(1, 4):
                      try:
                          print(f'GET {item["label"]} attempt={attempt}: {pdf_url}')
                          with session.get(pdf_url, timeout=150, allow_redirects=True, stream=True) as pdf_response:
                              pdf_response.raise_for_status()
                              data = bytearray()
                              for chunk in pdf_response.iter_content(chunk_size=1024 * 256):
                                  if chunk:
                                      data.extend(chunk)
                              raw = bytes(data)
                              status = pdf_response.status_code
                              content_type = pdf_response.headers.get('content-type')
                          if not looks_like_pdf(raw):
                              raise RuntimeError(
                                  f'not a complete PDF: status={status}, type={content_type}, '
                                  f'bytes={len(raw)}, head={raw[:20]!r}'
                              )
                          path = PDF_DIR / item['filename']
                          path.write_bytes(raw)
                          item['detail_url'] = detail
                          item['source_url'] = pdf_url
                          return path
                      except Exception as exc:
                          errors.append(f'{pdf_url} attempt {attempt}: {exc}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f'Unable to download {item["label"]}:\n' + '\n'.join(errors))

          def pdf_page_count(path):
              completed = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', completed.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_text(path, first, last):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as temp:
                  output = Path(temp.name)
              try:
                  completed = subprocess.run(
                      ['pdftotext', '-f', str(first), '-l', str(last), '-enc', 'UTF-8', str(path), str(output)],
                      capture_output=True,
                      text=True,
                  )
                  if completed.returncode != 0:
                      return ''
                  return output.read_text(encoding='utf-8', errors='ignore')
              finally:
                  output.unlink(missing_ok=True)

          manifest = []
          sha_lines = []
          for item in documents:
              path = download_document(item)
              raw = path.read_bytes()
              pages = pdf_page_count(path)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short document: {item["label"]} has {pages} pages')

              first_text = extract_text(path, 1, min(30, pages))
              normalized = re.sub(r'\s+', '', first_text)
              identity_ok = any(term in normalized for term in [
                  '金煤科技', '丹化科技', '丹化化工科技股份有限公司',
                  '内蒙古金煤化工科技股份有限公司', STOCK_ID,
              ])
              year_ok = item['year'] in normalized
              type_term = '半年度报告' if item['kind'] == 'half_year_report' else '年度报告'
              title_ok = type_term in normalized
              if not identity_ok or not year_ok or not title_ok:
                  raise RuntimeError(
                      f'Identity/title check failed for {item["label"]}: '
                      f'identity={identity_ok}, year={year_ok}, title={title_ok}'
                  )

              sha = hashlib.sha256(raw).hexdigest()
              rel = str(path.relative_to(ROOT))
              record = {
                  'document_type': item['kind'],
                  'title': item['label'],
                  'report_year': item['year'],
                  'file': rel,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'detail_url': item['detail_url'],
                  'source_url': item['source_url'],
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': identity_ok,
                  'year_text_matched': year_ok,
                  'title_text_matched': title_ok,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {rel}')
              print(f'VERIFIED {item["label"]}: pages={pages}, bytes={len(raw)}')

          if [record['report_year'] for record in manifest[:6]] != ['2020', '2021', '2022', '2023', '2024', '2025']:
              raise RuntimeError('Annual report sequence validation failed')
          if int(manifest[-1]['report_year']) < 2026:
              raise RuntimeError('Latest half-year report is unexpectedly earlier than 2026')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '内蒙古金煤化工科技股份有限公司（金煤科技，600844）公开披露文件包',
              '',
              '内容范围：',
              '1. 2020—2025年六份完整年度报告；',
              f'2. 截至2026年8月30日最新完整半年度报告：{manifest[-1]["report_year"]}年半年度报告。',
              '',
              '名称说明：公司证券简称于2025年8月7日由“丹化科技”变更为“金煤科技”，证券代码600844不变。',
              '因此2020—2024年年度报告以“丹化科技”名义披露，2025年年度报告及最新半年报以“金煤科技”名义披露。',
              '',
              '校验项目：PDF文件头与EOF、pdfinfo可解析页数、公司名称/证券代码、报告年份与类型、SHA-256、ZIP CRC。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f'- {record["title"]}',
                  f'  文件：{record["file"]}',
                  f'  页数：{record["pages"]}',
                  f'  大小：{record["bytes"]} bytes',
                  f'  SHA256：{record["sha256"]}',
                  f'  公告详情：{record["detail_url"]}',
                  f'  PDF来源：{record["source_url"]}',
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = f'金煤科技_600844_2020-2025年报_{manifest[-1]["report_year"]}年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: jinmei-technology-filings-final
          path: 金煤科技_600844_2020-2025年报_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
