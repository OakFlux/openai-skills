name: Discover Jindawei broker report IDs

on:
  push:
    branches: [tmp-jindawei-broker-reports-20261015]
    paths: ['.github/workflows/tmp-jindawei-broker-discovery-20261015.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney public report index
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002626' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&beginTime=2019-01-01&endTime=2026-10-15&qType=0&code=002626&industryCode=*&orgCode=&author=&fields=' \
            -o reports.jsonp
          wc -c reports.jsonp
          head -c 60000 reports.jsonp
