name: Inspect exact Huabao 2021 report row

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-2021-exact-row.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Print exact query rows
        run: |
          python - <<'PY'
          import json, urllib.request
          body={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':20,'keyword':'香精、薄片壁垒明显，新型烟草蓄势待发','pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
          req=urllib.request.Request('https://api.sdyanbao.com/api/file/search',data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as r: payload=json.loads(r.read().decode())
          print(json.dumps((payload.get('data') or {}).get('files') or [],ensure_ascii=False,indent=2),flush=True)
          PY
