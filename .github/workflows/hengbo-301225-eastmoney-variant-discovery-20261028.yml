name: Discover Hengbo Eastmoney report IDs 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-eastmoney-variant-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Discover report IDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,re,urllib.parse,html
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept':'application/json,text/plain,*/*','Referer':'https://data.eastmoney.com/report/301225.html'})
          api='https://reportapi.eastmoney.com/report/list'
          variants=[
            {'code':'301225','qType':'0'},
            {'code':'301225.SZ','qType':'0'},
            {'stockCode':'301225','qType':'0'},
            {'stockCode':'301225.SZ','qType':'0'},
            {'secuCode':'301225.SZ','qType':'0'},
            {'code':'301225','qType':'1'},
            {'keyword':'恒勃股份','qType':'0'},
            {'stockName':'恒勃股份','qType':'0'},
            {'code':'301225','orgCode':'*','qType':'0'},
          ]
          base={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':'2023-01-01','endTime':'2026-10-28','pageNo':'1','fields':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          for i,v in enumerate(variants,1):
            p={**base,**v}
            print('\n=== VARIANT',i,json.dumps(v,ensure_ascii=False),'===')
            try:
              r=s.get(api,params=p,timeout=(15,60))
              print('STATUS',r.status_code,'URL',r.url,'LEN',len(r.content),'HEAD',repr(r.text[:200]))
              obj=r.json()
              rows=obj.get('data') or []
              if isinstance(rows,dict): rows=rows.get('list') or rows.get('data') or []
              print('COUNT',len(rows),'HITS',obj.get('hits'),'PAGES',obj.get('TotalPage') or obj.get('totalPage'))
              for x in rows[:200]:
                title=str(x.get('title') or '')
                if '恒勃' in title or str(x.get('stockCode') or '') in ('301225','301225.SZ') or str(x.get('stockName') or '')=='恒勃股份':
                  print('ROW',json.dumps({k:x.get(k) for k in ['publishDate','attachPages','orgSName','title','infoCode','stockCode','stockName','emRatingName']},ensure_ascii=False))
            except Exception as e: print('ERROR',repr(e))

          pages=['https://data.eastmoney.com/stockcalendar/301225.html','https://data.eastmoney.com/report/301225.html','https://emweb.eastmoney.com/PC_HSF10/ResearchReport/Index?code=SZ301225&type=web']
          for u in pages:
            print('\n=== PAGE',u,'===')
            try:
              r=s.get(u,timeout=(15,60))
              print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url)
              t=r.text
              for pat in [r'AP\d{18}',r'AP\d+',r'恒勃股份.{0,250}',r'进气系统.{0,250}',r'PEEK.{0,250}']:
                vals=[]
                for m in re.finditer(pat,t,re.I|re.S):
                  val=m.group(0).replace('\n',' ')[:500]
                  if val not in vals: vals.append(val)
                print('PAT',pat,'COUNT',len(vals))
                for val in vals[:100]: print('MATCH',val)
              links=[]
              for m in re.findall(r'https?://[^"\'<>\s]+|href=["\']([^"\']+)["\']',t,re.I):
                x=m if isinstance(m,str) else m[0]
                x=html.unescape(x).replace('\\/','/')
                if 'report' in x.lower() or 'AP20' in x: links.append(urllib.parse.urljoin(r.url,x))
              print('LINKS',json.dumps(list(dict.fromkeys(links))[:200],ensure_ascii=False))
            except Exception as e: print('ERROR',repr(e))
          PY
