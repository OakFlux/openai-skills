name: Inspect Zhengzhou Coal historical report pages 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-600121-sina-report-pages-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and extract report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          candidates = [
              ('546419851121','深度报告_低估值加国改预期'),
              ('441813292256','深度研究_原有业务难以维系'),
              ('344601121984','调研报告_成长遇瓶颈静候资产注入'),
              ('367501407296','调研简报_发展遇瓶颈关注战略转变'),
              ('352299996311','调研_关注集团资产注入与资源整合'),
              ('553862300176','调研简报_扭亏为盈估值有望修复'),
          ]
          out=Path('zzmd_report_pages'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh600121&t1=all&p=1',
          })
          summaries=[]
          for rptid, slug in candidates:
              urls=[
                f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rptid}/index.phtml',
                f'http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rptid}/index.phtml',
              ]
              last=None; html=None; final=None; status=None
              for url in urls:
                try:
                  r=s.get(url,timeout=(20,90),allow_redirects=True)
                  last={'url':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'ct':r.headers.get('content-type')}
                  if r.status_code==200 and len(r.content)>5000:
                    enc=r.apparent_encoding or r.encoding or 'gb18030'
                    r.encoding=enc
                    html=r.text; final=r.url; status=r.status_code; break
                except Exception as exc:
                  last={'url':url,'error':repr(exc)}
              if html is None:
                summaries.append({'rptid':rptid,'slug':slug,'error':last}); continue
              (out/f'{rptid}_{slug}.html').write_text(html,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(html,'lxml')
              # remove scripts/styles for clean text
              clean=BeautifulSoup(html,'lxml')
              for tag in clean(['script','style','noscript']): tag.decompose()
              text='\n'.join(line.strip() for line in clean.get_text('\n').splitlines() if line.strip())
              (out/f'{rptid}_{slug}.txt').write_text(text,encoding='utf-8')
              links=[]
              for a in soup.find_all('a',href=True):
                href=urllib.parse.urljoin(final,a['href'])
                label=' '.join(a.get_text(' ',strip=True).split())
                if any(k in href.lower() for k in ['pdf','download','attach','report']) or any(k in label for k in ['下载','PDF','原文']):
                  links.append({'text':label,'href':href})
              meta={}
              for key in ['title','author','description','keywords']:
                if key=='title':
                  meta[key]=soup.title.get_text(' ',strip=True) if soup.title else ''
                else:
                  tag=soup.find('meta',attrs={'name':key}) or soup.find('meta',attrs={'property':key})
                  meta[key]=tag.get('content','') if tag else ''
              summary={
                'rptid':rptid,'slug':slug,'status':status,'final_url':final,
                'html_chars':len(html),'text_chars':len(text),'meta':meta,
                'candidate_links':links[:50],
                'has_company':'郑州煤电' in text or '*ST郑煤' in text,
                'sample_text':text[:5000],
              }
              summaries.append(summary)
              print('\n===',rptid,slug,'===')
              print(json.dumps(summary,ensure_ascii=False,indent=2)[:12000])
          (out/'summaries.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload extracted pages
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-600121-sina-report-pages-20261014
          path: zzmd_report_pages
          retention-days: 2
          if-no-files-found: error
