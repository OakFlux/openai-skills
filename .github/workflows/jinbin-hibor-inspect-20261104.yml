name: Inspect Hibor Jinbin report page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jinbin-hibor-inspect-20261104.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import html,json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          u='https://www.hibor.com.cn/docdetail_100915.html'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':'https://www.hibor.com.cn/'})
          r=s.get(u,timeout=120);print('FETCH',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          t=html.unescape(r.text);soup=BeautifulSoup(t,'html.parser');out=[]
          for tag in soup.find_all(True):
            for a in ('href','src','data-src','data-url','value','onclick','action','content'):
              v=tag.get(a)
              if v and any(k in str(v).lower() for k in ('pdf','download','down','attach','file','100915','read','view')):
                out.append({'tag':tag.name,'attr':a,'value':urljoin(r.url,str(v)),'text':tag.get_text(' ',strip=True)[:120]})
          print('FOUND',json.dumps(out,ensure_ascii=False,indent=2))
          for k in ('100915','download','attach','pdf','浏览报告原文'):
            i=t.lower().find(k.lower())
            if i>=0: print('CONTEXT',k,t[max(0,i-1500):i+3500])
          PY
