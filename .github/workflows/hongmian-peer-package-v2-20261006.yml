name: Run Hongmian peer package v4

on:
  push:
    paths:
      - '.github/workflows/hongmian-peer-package-v2-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Extract patch and run package builder
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='.github/workflows/hongmian-000523-peer-deep-reports-20261006.yml'
          sed -n "/python - <<'PY'/,/^          PY$/p" "$SOURCE" | sed '1d;$d;s/^          //' > /tmp/build_hongmian_peer.py
          python - <<'PATCH'
          from pathlib import Path
          path = Path('/tmp/build_hongmian_peer.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("'code': '300947'", "'code': '600848'")
          text = text.replace("'name': '德必集团'", "'name': '上海临港'")
          text = text.replace(
              '文创产业园区运营与城市更新业务，可对标红棉股份旗下新仕诚的T.I.T创意园等园区运营板块',
              '产业园区招商运营、企业服务和产业投资平台，可对标红棉股份旗下新仕诚的T.I.T创意园等园区运营板块',
          )
          text = text.replace(
              "['文创园区', '园区运营', '城市更新', '轻资产', '首次覆盖', '深度']",
              "['园区运营', '产业园', '招商', '企业服务', '首次覆盖', '深度']",
          )
          path.write_text(text, encoding='utf-8')
          PATCH
          python -m py_compile /tmp/build_hongmian_peer.py
          python /tmp/build_hongmian_peer.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hongmian-000523-peer-deep-reports-final-v4
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: hongmian-000523-peer-deep-reports-renders-v4
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
