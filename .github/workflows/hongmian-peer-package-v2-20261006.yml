name: Run Hongmian peer package v2

on:
  push:
    paths:
      - '.github/workflows/hongmian-peer-package-v2-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Extract and run package builder
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='.github/workflows/hongmian-000523-peer-deep-reports-20261006.yml'
          sed -n "/python - <<'PY'/,/^          PY$/p" "$SOURCE" | sed '1d;$d;s/^          //' > /tmp/build_hongmian_peer.py
          python -m py_compile /tmp/build_hongmian_peer.py
          python /tmp/build_hongmian_peer.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hongmian-000523-peer-deep-reports-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: hongmian-000523-peer-deep-reports-renders-v2
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
