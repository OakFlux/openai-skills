name: Greentown Sina report index probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-final-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Extract Greentown broker report links from Sina HK pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('sina')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9',
          })

          urls = [
              'https://stock.finance.sina.com.cn/hkstock/news/03900.html',
              'https://stock.finance.sina.com.cn/hkstock/news/03900.html?type=report',
              'https://stock.finance.sina.com.cn/hkstock/go.php/CompanyNews/page/1/stockid/03900.phtml',
              'https://stock.finance.sina.com.cn/hkstock/go.php/CompanyNews/page/2/stockid/03900.phtml',
              'https://stock.finance.sina.com.cn/hkstock/go.php/CompanyNews/page/3/stockid/03900.phtml',
              'https://stock.finance.sina.com.cn/hkstock/go.php/CompanyNews/page/4/stockid/03900.phtml',
              'https://stock.finance.sina.com.cn/hkstock/go.php/CompanyNews/page/5/stockid/03900.phtml',
          ]
          pages = []
          all_links = []
          for idx, url in enumerate(urls):
              try:
                  r = s.get(url, timeout=35, allow_redirects=True)
                  raw = r.content
                  encodings = [r.encoding, r.apparent_encoding, 'gb18030', 'gbk', 'utf-8']
                  text = None
                  for enc in encodings:
                      if not enc: continue
                      try:
                          candidate = raw.decode(enc)
                          if '绿城中国' in candidate or '<html' in candidate.lower():
                              text = candidate
                              break
                      except Exception:
                          pass
                  if text is None:
                      text = raw.decode('utf-8', errors='replace')
                  (OUT / f'page_{idx}.html').write_text(text, encoding='utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'html.parser')
                  links = []
                  for a in soup.select('a[href]'):
                      href = urllib.parse.urljoin(r.url, a.get('href'))
                      label = ' '.join(a.get_text(' ', strip=True).split())
                      title = a.get('title') or ''
                      hay = label + ' ' + title + ' ' + href
                      if any(k in hay for k in ['绿城中国', '3900.HK', '03900.HK', 'vReport_Show', '研报']):
                          item = {'url': href, 'text': label, 'title': title}
                          links.append(item)
                          all_links.append(item)
                  rec = {'source': url, 'status': r.status_code, 'final': r.url,
                         'encoding': r.encoding, 'apparent': r.apparent_encoding,
                         'length': len(raw), 'title': soup.title.get_text(' ', strip=True) if soup.title else '',
                         'links': links}
                  pages.append(rec)
                  print('\nPAGE', json.dumps(rec, ensure_ascii=False, indent=2)[:100000])
              except Exception as exc:
                  pages.append({'source': url, 'error': repr(exc)})
          (OUT / 'pages.json').write_text(json.dumps(pages, ensure_ascii=False, indent=2), encoding='utf-8')

          # Deduplicate report-like links and fetch them.
          uniq = []
          seen = set()
          for item in all_links:
              key = item['url']
              if key not in seen:
                  seen.add(key)
                  uniq.append(item)
          (OUT / 'links.json').write_text(json.dumps(uniq, ensure_ascii=False, indent=2), encoding='utf-8')

          reports = []
          for idx, item in enumerate(uniq):
              url = item['url']
              if not any(k in url for k in ['vReport_Show', 'vCB_', '/go.php/', 'report']):
                  continue
              try:
                  r = s.get(url, timeout=35, allow_redirects=True)
                  raw = r.content
                  text = None
                  for enc in [r.encoding, r.apparent_encoding, 'gb18030', 'gbk', 'utf-8']:
                      if not enc: continue
                      try:
                          candidate = raw.decode(enc)
                          if '<html' in candidate.lower():
                              text = candidate
                              break
                      except Exception: pass
                  if text is None: text = raw.decode('utf-8', errors='replace')
                  (OUT / f'report_{idx}.html').write_text(text, encoding='utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'html.parser')
                  raw_urls = sorted(set(re.findall(r'https?://[^\s"\'<>\\]+', text)))
                  found = [u.rstrip('),.;') for u in raw_urls if any(k in u.lower() for k in ['.pdf', 'pdf.dfcfw', 'download', 'rptid'])]
                  for a in soup.select('a[href],iframe[src],embed[src],object[data],script[src]'):
                      target = a.get('href') or a.get('src') or a.get('data')
                      if target:
                          target = urllib.parse.urljoin(r.url, target)
                          if any(k in target.lower() for k in ['.pdf', 'pdf.dfcfw', 'download', 'vreport']):
                              found.append(target)
                  rec = {'source_link': item, 'status': r.status_code, 'final': r.url,
                         'length': len(raw), 'title': soup.title.get_text(' ', strip=True) if soup.title else '',
                         'text_excerpt': ' '.join(soup.get_text(' ', strip=True).split())[:6000],
                         'found': sorted(set(found))}
                  reports.append(rec)
                  print('\nREPORT', json.dumps(rec, ensure_ascii=False, indent=2)[:50000])
              except Exception as exc:
                  reports.append({'source_link': item, 'error': repr(exc)})
          (OUT / 'reports.json').write_text(json.dumps(reports, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greentown-sina-report-index
          path: sina/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
