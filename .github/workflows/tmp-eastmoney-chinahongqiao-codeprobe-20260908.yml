name: Probe Eastmoney China Hongqiao by code
on:
  push:
    branches:
      - tmp-eastmoney-chinahongqiao-codeprobe-20260908
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Query exact codes and validate PDFs
        run: |
          set -euo pipefail
          mkdir -p output/pdfs
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          api='https://reportapi.eastmoney.com/report/list'
          allrows={}
          for code in ['01378','1378','HK01378','116.01378']:
            params={
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
              'beginTime':'2020-01-01','endTime':'2026-09-08','pageNo':'1','fields':'','qType':'0',
              'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
            }
            try:
              r=s.get(api,params=params,timeout=30)
              print('STATUS',code,r.status_code,r.url,len(r.content),flush=True)
              d=r.json()
              Path(f'output/{re.sub(r"[^A-Za-z0-9]+","_",code)}.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
              rows=d.get('data') or []
              print('ROWS',code,len(rows),'TOTAL',d.get('TotalPage'),'HITS',d.get('hits'),flush=True)
              for row in rows:
                info=row.get('infoCode')
                if info: allrows[info]=row
                print('ROW',json.dumps({k:row.get(k) for k in ['infoCode','publishDate','orgSName','title','stockName','stockCode','emRatingName','reportType']},ensure_ascii=False),flush=True)
            except Exception as e:
              print('ERROR',code,repr(e),flush=True)

          validations=[]
          for info,row in allrows.items():
            url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            rec={k:row.get(k) for k in ['infoCode','publishDate','orgSName','title','stockName','stockCode','emRatingName','reportType']}
            rec['url']=url
            try:
              r=s.get(url,timeout=90)
              rec.update({'status':r.status_code,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'header':r.content[:8].decode('latin1','replace')})
              if r.status_code==200 and r.content.startswith(b'%PDF'):
                p=Path('output/pdfs')/f'{info}.pdf'
                p.write_bytes(r.content)
                reader=PdfReader(str(p))
                text=''.join((pg.extract_text() or '') for pg in reader.pages[:5])
                rec.update({'pages':len(reader.pages),'text_chars_first5':len(text.strip()),'first_text':' '.join(text.split())[:2000],'sha256':hashlib.sha256(r.content).hexdigest()})
            except Exception as e:
              rec['error']=repr(e)
            validations.append(rec)
            print('PDF',json.dumps(rec,ensure_ascii=False),flush=True)
          Path('output/validations.json').write_text(json.dumps(validations,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-chinahongqiao-codeprobe
          path: output/*
          retention-days: 1
