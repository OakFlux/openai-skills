name: Temporary Discover New Wellful Brokerage Reports

on:
  push:
    branches:
      - tmp/fetch-xinwufeng-reports-20260830
    paths:
      - .github/workflows/tmp-discover-xinwufeng-reports.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PDF reader
        run: python -m pip install --quiet pypdf requests

      - name: Query Eastmoney and validate report PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          API = 'https://reportapi.eastmoney.com/report/list'
          CODE = '600975'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/plain,*/*',
          }
          params = {
              'industryCode': '*',
              'pageSize': '500',
              'industry': '*',
              'rating': '*',
              'ratingChange': '*',
              'beginTime': '2004-01-01',
              'endTime': '2026-08-30',
              'pageNo': '1',
              'fields': '',
              'qType': '0',
              'orgCode': '',
              'author': '',
              'code': CODE,
              'rcode': '',
              'p': '1',
              'pageNum': '1',
              'pageNumber': '1',
              '_': str(int(time.time() * 1000)),
          }
          s = requests.Session(); s.headers.update(HEADERS)
          r = s.get(API, params=params, timeout=60)
          print('API_STATUS', r.status_code, r.url)
          print('API_BYTES', len(r.content), 'HEAD', r.text[:200].replace('\n',' '))
          r.raise_for_status()
          payload = r.json()
          data = payload.get('data')
          rows = []
          if isinstance(data, list): rows = data
          elif isinstance(data, dict):
              for k in ('dataList','list','rows'):
                  if isinstance(data.get(k), list): rows = data[k]; break
          if not rows and isinstance(payload.get('result'), dict):
              for k in ('data','dataList','list','rows'):
                  if isinstance(payload['result'].get(k), list): rows = payload['result'][k]; break
          print('ROW_COUNT', len(rows))
          outdir = Path('inventory_pdfs'); outdir.mkdir(exist_ok=True)
          inventory=[]
          for idx,row in enumerate(rows,1):
              info = str(row.get('infoCode') or '').strip()
              title = str(row.get('title') or '').strip()
              org = str(row.get('orgSName') or row.get('orgName') or '').strip()
              date = str(row.get('publishDate') or '')[:10]
              if not info: continue
              url = f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              item={'infoCode':info,'date':date,'org':org,'title':title,'url':url,'pages':None,'bytes':None,'ok':False,'error':None}
              try:
                  pr = s.get(url, headers={**HEADERS,'Accept':'application/pdf,*/*'}, timeout=90)
                  item['http_status']=pr.status_code
                  item['content_type']=pr.headers.get('content-type','')
                  item['bytes']=len(pr.content)
                  if pr.status_code != 200 or len(pr.content) < 10000 or not pr.content.startswith(b'%PDF'):
                      raise RuntimeError(f'not-pdf status={pr.status_code} bytes={len(pr.content)} type={pr.headers.get("content-type")}')
                  p = outdir / f'{idx:03d}_{info}.pdf'; p.write_bytes(pr.content)
                  reader = PdfReader(str(p), strict=False)
                  item['pages']=len(reader.pages)
                  item['ok']=True
              except Exception as e:
                  item['error']=repr(e)
              inventory.append(item)
              print('REPORT_JSON='+json.dumps(item,ensure_ascii=False))
              time.sleep(0.25)
          inventory.sort(key=lambda x: (x.get('date') or '', x.get('pages') or 0), reverse=True)
          Path('xinwufeng_report_inventory.json').write_text(json.dumps(inventory,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['# 新五丰（600975）公开券商研报清单','','| 日期 | 券商 | 页数 | 标题 | infoCode | 状态 |','|---|---:|---:|---|---|---|']
          for x in inventory:
              lines.append(f"| {x.get('date','')} | {x.get('org','')} | {x.get('pages') or ''} | {x.get('title','').replace('|','/')} | {x.get('infoCode','')} | {'OK' if x.get('ok') else x.get('error','FAIL')} |")
          Path('xinwufeng_report_inventory.md').write_text('\n'.join(lines),encoding='utf-8')
          print('\nCANDIDATES_15P_PLUS')
          for x in inventory:
              if x.get('ok') and (x.get('pages') or 0) >= 15:
                  print(json.dumps(x,ensure_ascii=False))
          PY

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: xinwufeng-report-inventory
          path: |
            xinwufeng_report_inventory.json
            xinwufeng_report_inventory.md
          if-no-files-found: error
          retention-days: 3
