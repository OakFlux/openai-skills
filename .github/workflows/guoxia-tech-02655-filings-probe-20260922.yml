name: Probe Guoxia Technology 02655 filing URLs 20260922

on:
  push:
    paths:
      - '.github/workflows/guoxia-tech-02655-filings-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Probe official HKEX filing links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-HK,zh;q=0.9,en;q=0.8',
          })
          base = 'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000284598'
          keys = ('annual report', 'interim report', 'interim results', 'global offering', '年報', '中期報告', '中期業績', '全球發售')
          for lang in ('EN', 'ZH'):
              url = base + '&lang=' + lang
              r = s.get(url, timeout=90, allow_redirects=True)
              print('\n===', lang, 'STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content), flush=True)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, 'html.parser')
              for a in soup.find_all('a', href=True):
                  label = ' '.join(a.get_text(' ', strip=True).split())
                  href = urljoin(r.url, a['href'])
                  hay = (label + ' ' + href).lower()
                  if any(k.lower() in hay for k in keys):
                      print('DOC', lang, repr(label), href, flush=True)
          PY
