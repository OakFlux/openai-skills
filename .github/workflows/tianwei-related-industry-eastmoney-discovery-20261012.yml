name: Discover Tianwei related industry reports on Eastmoney 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-related-industry-eastmoney-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query industry report API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, requests, time
          from pathlib import Path

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
          windows=[
            ('2022-05-01','2022-05-10',['2021Q4','2022Q1','军工确定性投资价值凸现','板块持续高景气']),
            ('2024-12-01','2024-12-20',['否极泰来','圆满收官']),
          ]
          allout=[]
          for begin,end,terms in windows:
            rows=[]
            for page in range(1,31):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'1','orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,90))
              r.raise_for_status(); data=r.json(); batch=data.get('data') or []
              print('WINDOW',begin,end,'PAGE',page,'HITS',data.get('hits'),'ROWS',len(batch))
              if not batch: break
              rows.extend(batch)
              if len(batch)<100: break
              time.sleep(.08)
            matches=[]
            for x in rows:
              title=str(x.get('title') or '')
              if any(t in title for t in terms):
                matches.append(x)
            allout.append({'begin':begin,'end':end,'terms':terms,'total_rows':len(rows),'matches':matches})
            print('MATCHES',begin,end)
            for x in matches: print(json.dumps(x,ensure_ascii=False))
          Path('out/results.json').write_text(json.dumps(allout,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianwei-related-industry-eastmoney-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
