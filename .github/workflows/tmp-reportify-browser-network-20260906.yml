name: Temporary Reportify viewer inspection
on:
  push:
    branches:
      - tmp-reportify-browser-network-20260906
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Record network resources
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          records=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1200})
              def collect(response):
                  records.append({'url':response.url,'status':response.status,'type':response.request.resource_type,'content_type':response.headers.get('content-type','')})
              page.on('response',collect)
              page.goto('https://reportify.cn/reports/1278761946887360512',wait_until='domcontentloaded',timeout=120000)
              page.wait_for_timeout(15000)
              for i in range(12):
                  page.mouse.wheel(0,1000)
                  page.wait_for_timeout(500)
              Path('output/responses.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('output/page.html').write_text(page.content(),encoding='utf-8')
              page.screenshot(path='output/page.png',full_page=True)
              print('TITLE',page.title())
              print('URL',page.url)
              print('RESPONSES',len(records))
              for record in records:
                  value=(record['url']+' '+record['content_type']).lower()
                  if any(key in value for key in ['report','document','pdf','image','page','file','json']):
                      print(json.dumps(record,ensure_ascii=False))
              browser.close()
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: reportify-viewer-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
