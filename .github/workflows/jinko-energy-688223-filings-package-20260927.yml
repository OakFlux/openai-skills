name: Build JinkoSolar 688223 filings package 20260927

on:
  push:
    paths:
      - '.github/workflows/jinko-energy-688223-filings-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          PACKAGE = '晶科能源_688223_全部年报_招股说明书及最新季报'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)

          annual_specs = [
              {'key':'2021年年度报告','period':'2021','filename':'01_晶科能源_2021年年度报告.pdf','min_pages':80},
              {'key':'2022年年度报告','period':'2022','filename':'02_晶科能源_2022年年度报告.pdf','min_pages':80},
              {'key':'2023年年度报告','period':'2023','filename':'03_晶科能源_2023年年度报告.pdf','min_pages':80},
              {'key':'2024年年度报告','period':'2024','filename':'04_晶科能源_2024年年度报告.pdf','min_pages':80},
              {'key':'2025年年度报告','period':'2025','filename':'05_晶科能源_2025年年度报告.pdf','min_pages':80},
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer':'https://data.eastmoney.com/notices/stock/688223.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows: list[dict[str, Any]] = []
          search_pages = []

          for page in range(1, 41):
              params = {
                  'sr':'-1',
                  'page_size':'100',
                  'page_index':str(page),
                  'ann_type':'A',
                  'client_source':'web',
                  'stock_list':'688223',
                  'f_node':'0',
                  's_node':'0',
              }
              last = None
              data = None
              for attempt in range(6):
                  try:
                      r = session.get(api, params=params, timeout=(20, 120))
                      last = {'status':r.status_code,'text':r.text[:300]}
                      if r.status_code == 200:
                          data = r.json()
                          break
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'Announcement API failed page {page}: {last}')
              rows = ((data.get('data') or {}).get('list') or [])
              search_pages.append({'page':page,'count':len(rows)})
              if not rows:
                  break
              all_rows.extend(rows)
              # Once we have passed the listing period, there is no need to scan older filings.
              dates = [str(r.get('display_time') or '') for r in rows]
              if page >= 8 and any(d.startswith('2020') or d.startswith('2019') for d in dates):
                  break
              time.sleep(0.12)

          def compact(s: str) -> str:
              return re.sub(r'\s+', '', s or '')

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '')

          def date_value(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or '')

          bad_common = ['摘要','英文版','取消','问询','回复','审计报告','董事会','监事会','更正公告','提示性公告','社会责任报告','环境、社会及管治报告','可持续发展报告']

          def choose_annual(key: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              candidates = []
              for row in all_rows:
                  title = compact(str(row.get('title') or ''))
                  if key not in title or any(x in title for x in bad_common):
                      continue
                  score = 50
                  if title.endswith(key): score += 30
                  if title.startswith('晶科能源') or title.startswith('晶科能源股份有限公司'): score += 15
                  if '修订' in title: score += 2
                  candidates.append((score, date_value(row), row))
              candidates.sort(key=lambda x:(x[0], x[1]), reverse=True)
              if not candidates:
                  raise RuntimeError(f'Missing annual report: {key}')
              log = [{'score':s,'date':d,'title':r.get('title'),'art_code':art_code(r)} for s,d,r in candidates[:10]]
              return candidates[0][2], log

          def choose_prospectus() -> tuple[dict[str, Any], list[dict[str, Any]]]:
              candidates = []
              for row in all_rows:
                  title = compact(str(row.get('title') or ''))
                  if '招股说明书' not in title:
                      continue
                  if any(x in title for x in ['摘要','问询','回复','落实函','审核中心意见','保荐工作报告','法律意见书','财务报表']):
                      continue
                  score = 40
                  if '首次公开发行股票并在科创板上市招股说明书' in title: score += 40
                  if title.endswith('招股说明书'): score += 35
                  if '注册稿' in title: score += 25
                  if '上会稿' in title: score -= 15
                  if '申报稿' in title: score -= 25
                  if title.startswith('晶科能源') or title.startswith('晶科能源股份有限公司'): score += 10
                  candidates.append((score, date_value(row), row))
              candidates.sort(key=lambda x:(x[0], x[1]), reverse=True)
              if not candidates:
                  raise RuntimeError('Missing prospectus')
              log = [{'score':s,'date':d,'title':r.get('title'),'art_code':art_code(r)} for s,d,r in candidates[:15]]
              return candidates[0][2], log

          def choose_latest_quarter() -> tuple[dict[str, Any], str, list[dict[str, Any]]]:
              desired = [
                  ('2026年第三季度报告','2026Q3'),
                  ('2026年第一季度报告','2026Q1'),
                  ('2025年第三季度报告','2025Q3'),
                  ('2025年第一季度报告','2025Q1'),
              ]
              log = []
              for key, period in desired:
                  candidates = []
                  for row in all_rows:
                      title = compact(str(row.get('title') or ''))
                      if key not in title or any(x in title for x in bad_common):
                          continue
                      score = 50
                      if title.endswith(key): score += 25
                      if title.startswith('晶科能源') or title.startswith('晶科能源股份有限公司'): score += 10
                      candidates.append((score, date_value(row), row))
                  candidates.sort(key=lambda x:(x[0], x[1]), reverse=True)
                  log.extend([{'period':period,'score':s,'date':d,'title':r.get('title'),'art_code':art_code(r)} for s,d,r in candidates[:5]])
                  if candidates:
                      return candidates[0][2], period, log
              raise RuntimeError('Missing quarterly report')

          def choose_latest_interim() -> tuple[dict[str, Any] | None, str | None, list[dict[str, Any]]]:
              desired = [('2026年半年度报告','2026H1'),('2025年半年度报告','2025H1')]
              log = []
              for key, period in desired:
                  candidates = []
                  for row in all_rows:
                      title = compact(str(row.get('title') or ''))
                      if key not in title or any(x in title for x in bad_common):
                          continue
                      score = 50
                      if title.endswith(key): score += 25
                      if title.startswith('晶科能源') or title.startswith('晶科能源股份有限公司'): score += 10
                      candidates.append((score, date_value(row), row))
                  candidates.sort(key=lambda x:(x[0], x[1]), reverse=True)
                  log.extend([{'period':period,'score':s,'date':d,'title':r.get('title'),'art_code':art_code(r)} for s,d,r in candidates[:5]])
                  if candidates:
                      return candidates[0][2], period, log
              return None, None, log

          selected: list[dict[str, Any]] = []
          candidate_logs: dict[str, Any] = {}

          for spec in annual_specs:
              row, log = choose_annual(spec['key'])
              candidate_logs[spec['key']] = log
              selected.append({**spec,'doc_type':'年度报告','row':row})

          prospectus_row, prospectus_log = choose_prospectus()
          candidate_logs['招股说明书'] = prospectus_log
          selected.append({
              'key':'首次公开发行股票并在科创板上市招股说明书',
              'period':'IPO',
              'filename':'06_晶科能源_首次公开发行股票并在科创板上市招股说明书.pdf',
              'min_pages':300,
              'doc_type':'招股说明书',
              'row':prospectus_row,
          })

          quarter_row, quarter_period, quarter_log = choose_latest_quarter()
          candidate_logs['最新季报'] = quarter_log
          selected.append({
              'key':compact(str(quarter_row.get('title') or '')),
              'period':quarter_period,
              'filename':f'07_晶科能源_{quarter_period}_最新季报.pdf',
              'min_pages':5,
              'doc_type':'最新季报',
              'row':quarter_row,
          })

          interim_row, interim_period, interim_log = choose_latest_interim()
          candidate_logs['最新半年度报告'] = interim_log
          if interim_row is not None:
              selected.append({
                  'key':compact(str(interim_row.get('title') or '')),
                  'period':interim_period,
                  'filename':f'08_晶科能源_{interim_period}_最新阶段性报告.pdf',
                  'min_pages':20,
                  'doc_type':'半年度报告',
                  'row':interim_row,
              })

          def fetch_pdf(url: str, referer: str) -> tuple[bytes, dict[str, Any]]:
              last: dict[str, Any] = {}
              for attempt in range(7):
                  try:
                      rr = session.get(url, timeout=(30, 360), allow_redirects=True, headers={
                          'User-Agent':session.headers['User-Agent'],
                          'Referer':referer,
                          'Accept':'application/pdf,*/*;q=0.8',
                      })
                      last = {'status':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type',''),'bytes':len(rr.content)}
                      if rr.status_code == 200 and rr.content[:5] == b'%PDF-' and len(rr.content) > 40_000:
                          return rr.content, last
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(2 + attempt)
              raise RuntimeError(f'PDF download failed {url}: {last}')

          manifest = []
          for spec in selected:
              row = spec.pop('row')
              art = art_code(row)
              if not art:
                  raise RuntimeError(f'No art code for {spec["filename"]}')
              detail_page = f'https://data.eastmoney.com/notices/detail/688223/{art}.html'
              mirror = f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf'
              data, download_meta = fetch_pdf(mirror, detail_page)
              dest = root / spec['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {dest.name}: {pages} < {spec["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(8, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              identity_ok = ('晶科能源' in extracted) or ('688223' in extracted) or ('JINKO' in extracted.upper())
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')

              subprocess.run(['qpdf','--check',str(dest)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = preview_dir / dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview render failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **spec,
                  'announcement_title':row.get('title'),
                  'announcement_date':row.get('display_time'),
                  'art_code':art,
                  'announcement_detail_page':detail_page,
                  'mirror_pdf_url':mirror,
                  'official_sse_index':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=688223',
                  'actual_pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'identity_text_check':identity_ok,
                  'download_meta':download_meta,
                  'preview_file':str(Path('首页预览') / preview.name),
                  'validation':['PDF header','announcement-title match','issuer identity','minimum page count','qpdf structure','first-page render'],
              })

          readme = [
              '晶科能源股份有限公司（688223.SH）全部年报、招股说明书及最新季报资料包',
              '整理日期：2026-09-27',
              '',
              '文件范围：上市后全部完整年度报告（2021-2025）、首次公开发行股票并在科创板上市招股说明书、最新季度报告，以及最新完整半年度报告。',
              '',
              '上市时间说明：晶科能源于2022年1月在上海证券交易所科创板上市，因此上市公司独立年度报告从2021年年度报告开始；更早历史财务资料载于招股说明书。',
              '',
              '来源说明：公告标题与披露记录通过公开公告索引匹配；PDF文件从可访问的公告镜像下载，并与公告代码逐一绑定。上交所公告索引地址已写入manifest.json。',
              '完整性核验：PDF文件头、公告标题、发行人身份、最低页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
              '',
          ]
          for i, r in enumerate(manifest, 1):
              readme += [
                  f"{i}. {r['doc_type']}：{r['announcement_title']}（{r['actual_pages']}页）",
                  f"   公告日期：{r['announcement_date']}",
                  f"   公告详情：{r['announcement_detail_page']}",
                  f"   PDF镜像：{r['mirror_pdf_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += [
              '说明：截至2026年9月27日，2026年第三季度报告尚未进入常规披露期，因此最新季度报告为已披露的2026年第一季度报告；本包同时收录2026年半年度报告作为最新完整阶段性财务文件。',
          ]

          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps({'search_pages':search_pages,'candidate_logs':candidate_logs,'reports':manifest}, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in manifest), encoding='utf-8')

          zpath = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) < 7:
                  raise RuntimeError(f'Unexpected PDF count: {len(pdfs)}')

          print('FINAL_ZIP', zpath, zpath.stat().st_size, hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jinko-energy-688223-all-annual-reports-prospectus-and-latest-quarter
          path: 晶科能源_688223_全部年报_招股说明书及最新季报.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
