name: Probe Book118 preview API for Lixing report

on:
  push:
    paths:
      - '.github/workflows/lixing-book118-probe-20261021.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect HTML scripts and preview endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          from bs4 import BeautifulSoup
          url='https://max.book118.com/html/2025/0409/8113063113007051.shtm'
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://max.book118.com/'}
          r=s.get(url,headers=h,timeout=(20,120));print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          text=r.text
          for key in ['aid','docId','docid','viewToken','preview','NewView','pageCount','page_count','totalPage','total_page','8113063113007051','readConfig','fileId','fileid','mid','viewid','bookId','download']:
            print('\n###KEY',key)
            for m in list(re.finditer(key,text,re.I))[:30]:
              print('CTX',text[max(0,m.start()-350):m.end()+900].replace('\n',' ')[:1400])
          soup=BeautifulSoup(text,'lxml')
          scripts=[]
          for sc in soup.find_all('script'):
            src=sc.get('src')
            if src:scripts.append(urllib.parse.urljoin(r.url,src))
          print('\nSCRIPTS',json.dumps(scripts,ensure_ascii=False,indent=2))
          for su in scripts:
            if any(k in su.lower() for k in ['view','detail','preview','doc','html','main','book','common']):
              try:
                x=s.get(su,headers=h,timeout=(15,60));print('\nSCRIPT',su,x.status_code,len(x.content))
                st=x.text
                for pat in ['NewView','preview','pageCount','page_count','getPage','pageUrl','ajax','aid','docId','image','imgUrl','viewToken','/index.php']:
                  hits=list(re.finditer(pat,st,re.I))
                  if hits:
                    print('PAT',pat,'COUNT',len(hits))
                    for m in hits[:10]:print('JSCTX',st[max(0,m.start()-300):m.end()+700].replace('\n',' ')[:1100])
              except Exception as e:print('SCRIPTERR',su,repr(e))
          # Generic endpoint probes with candidate ids extracted from HTML.
          ids=sorted(set(re.findall(r'(?:aid|docId|docid|fileId|fileid|id)["\'\s:=]+([0-9]{3,20})',text,re.I)))
          ids += ['8113063113007051']
          ids=list(dict.fromkeys(ids))
          print('IDS',ids)
          endpoints=[]
          for ident in ids[:20]:
            endpoints += [
              f'https://max.book118.com/index.php?g=Home&m=NewView&a=index&aid={ident}',
              f'https://max.book118.com/index.php?g=Home&m=NewView&a=preview&aid={ident}',
              f'https://max.book118.com/index.php?g=Home&m=NewView&a=getPage&aid={ident}',
              f'https://max.book118.com/index.php?g=Home&m=NewView&a=ajax&aid={ident}',
              f'https://max.book118.com/index.php?g=Home&m=NewView&a=index&id={ident}',
            ]
          for ep in endpoints[:100]:
            try:
              q=s.get(ep,headers={**h,'X-Requested-With':'XMLHttpRequest'},timeout=(10,30))
              if q.status_code!=404 or len(q.content)>2000:
                print('EP',q.status_code,len(q.content),q.headers.get('content-type'),ep,q.text[:1200].replace('\n',' '))
            except Exception as e:pass
          PY
