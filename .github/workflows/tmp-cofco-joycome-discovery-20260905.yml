name: Temporary COFCO Joycome broker report discovery

on:
  push:
    branches:
      - tmp-cofco-joycome-broker-reports-20260905

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover report sources and candidate PDFs
        run: |
          python -m pip install requests beautifulsoup4 lxml pypdf
          cat > /tmp/discover.py <<'PY'
          from __future__ import annotations
          import base64, html, io, json, re, time
          from pathlib import Path
          from urllib.parse import parse_qs, quote, unquote, urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          out=Path('discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Referer':'https://data.eastmoney.com/report/'
          })

          target_titles=[
            '背靠中粮稳健前行，养殖产能稳步扩张',
            '养殖规模持续扩张，品牌肉放量提升盈利能力',
            '成本管控优异的全产业链弹性标的',
            '头均盈利位列行业一梯队，品牌猪肉业务未来可期',
          ]
          rows=[]; seen=set()
          endpoint='https://reportapi.eastmoney.com/report/list'
          codes=['01610','1610','HK01610','01610.HK','*']
          windows=[('2018-01-01','2021-12-31'),('2022-01-01','2024-12-31'),('2025-01-01','2026-09-05')]
          for code in codes:
            for qtype in ['0','1']:
              for begin,end in windows:
                for page in range(1,8):
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':code,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),'_':str(int(time.time()*1000))}
                  try:
                    r=s.get(endpoint,params=params,timeout=45); d=r.json()
                  except Exception as e:
                    print('APIERR',code,qtype,begin,end,page,repr(e)); break
                  data=d.get('data') or []
                  print('API',code,qtype,begin,end,page,'ROWS',len(data),'HITS',d.get('hits'),'TP',d.get('TotalPage'))
                  for row in data:
                    blob=json.dumps(row,ensure_ascii=False)
                    if code!='*' or '中粮家佳康' in blob or '中糧家佳康' in blob or 'COFCO Joycome' in blob or '01610' in blob:
                      key=str(row.get('infoCode') or blob[:200])
                      if key not in seen:
                        seen.add(key); rows.append(row); print('ROW',blob)
                  tp=int(d.get('TotalPage') or 1)
                  if not data or page>=tp: break
          (out/'eastmoney_rows.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('EASTMONEY_UNIQUE',len(rows))

          pages=[
            'https://www.sgpjbg.com/baogao/112694.html',
            'https://www.sgpjbg.com/baogao/76453.html',
            'https://www.sgpjbg.com/labels/zhongliangjiajiakangshehuizerenbaogao.html',
            'https://www.hangyan.co/reports/3016669493662320255',
            'https://www.hangyan.co/reports/2529951243569203048',
            'https://www.fxbaogao.com/detail/3202477',
          ]
          discovered={}
          def add(u,src):
            u=html.unescape((u or '').strip())
            if u.startswith('//'): u='https:'+u
            if u.startswith('http'): discovered.setdefault(u,src)
          for u in pages:
            try:
              r=s.get(u,timeout=45,allow_redirects=True)
              print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              stem=re.sub(r'[^A-Za-z0-9]+','_',urlparse(u).path).strip('_')[-100:] or 'index'
              (out/f'{stem}.html').write_bytes(r.content)
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              for tag in soup.find_all(True):
                for attr in ['href','src','data-src','data-url','data-pdf','data-file','content']:
                  v=tag.get(attr)
                  if isinstance(v,str):
                    full=urljoin(r.url,v)
                    if any(k in (v+' '+full).lower() for k in ['.pdf','download','down/','/down','fileurl','pdfurl','baogao/']): add(full,'html:'+r.url)
              for m in re.findall(r'https?:\\?/\\?/[A-Za-z0-9%_./?=&:+~-]+',text):
                m=m.replace('\\/','/')
                if any(k in m.lower() for k in ['.pdf','download','down','file']): add(m,'regex:'+r.url)
              for title in target_titles:
                if title[:8] in text: print('TITLE_FOUND_ON_PAGE',title,r.url)
            except Exception as e:
              print('PAGEERR',u,repr(e))

          queries=[
            '"背靠中粮稳健前行" 中粮家佳康 pdf',
            '"养殖规模持续扩张，品牌肉放量提升盈利能力" pdf',
            '"成本管控优异的全产业链弹性标的" pdf',
            '"头均盈利位列行业一梯队" pdf',
            'site:pdf.dfcfw.com 中粮家佳康',
            'site:pdf.dfcfw.com "COFCO Joycome"',
          ]
          def decode_bing(href):
            try:
              qs=parse_qs(urlparse(href).query); v=qs.get('u',[''])[0]
              if v.startswith('a1'):
                return base64.b64decode(v[2:]+'===').decode('utf-8','ignore')
            except Exception: pass
            return href
          for q in queries:
            for eng,base in [('bing','https://www.bing.com/search?q='),('duck','https://html.duckduckgo.com/html/?q=')]:
              try:
                r=s.get(base+quote(q),timeout=45)
                print('SEARCH',eng,r.status_code,len(r.content),q)
                soup=BeautifulSoup(r.text,'lxml')
                for a in soup.find_all('a',href=True):
                  href=a['href']
                  if 'bing.com/ck/a' in href: href=decode_bing(href)
                  if href.startswith('/l/?'): href=urljoin('https://duckduckgo.com',href)
                  if 'duckduckgo.com/l/?' in href:
                    qs=parse_qs(urlparse(href).query); href=unquote(qs.get('uddg',[href])[0])
                  txt=' '.join(a.stripped_strings)
                  if href.startswith('http') and any(k in (href+' '+txt).lower() for k in ['pdf','中粮家佳康','cofco','01610']): add(href,f'{eng}:{q}')
              except Exception as e: print('SEARCHERR',eng,q,repr(e))

          # Eastmoney rows -> deterministic PDF URLs
          for row in rows:
            info=str(row.get('infoCode') or '')
            if info:
              ino=info[2:] if info.upper().startswith('AP') else info
              add(f'https://pdf.dfcfw.com/pdf/H3_AP{ino}_1.pdf','eastmoney:'+str(row.get('title')))

          print('DISCOVERED_URLS',len(discovered))
          (out/'urls.json').write_text(json.dumps(discovered,ensure_ascii=False,indent=2),encoding='utf-8')
          valid=[]
          for i,(u,src) in enumerate(list(discovered.items())[:1000],1):
            try:
              rr=s.get(u,timeout=60,allow_redirects=True)
              data=rr.content
              ctype=rr.headers.get('content-type','')
              if data.lstrip().startswith(b'%PDF') and len(data)>20000:
                try:
                  reader=PdfReader(io.BytesIO(data),strict=False); n=len(reader.pages)
                  text=' '.join((p.extract_text() or '') for p in reader.pages[:5]); text=re.sub(r'\s+',' ',text)
                except Exception as e: n=-1; text=''; print('PARSEERR',repr(e))
                item={'url':rr.url,'source':src,'size':len(data),'pages':n,'text_head':text[:4000]}
                valid.append(item)
                (out/f'candidate_{len(valid):03d}.pdf').write_bytes(data)
                print('VALIDPDF',n,len(data),rr.url,text[:400])
              elif any(k in u.lower() for k in ['download','down','pdf']):
                print('NOTPDF',rr.status_code,len(data),ctype,rr.url)
            except Exception as e:
              if i<100: print('FETCHERR',u,repr(e))
          (out/'valid.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2),encoding='utf-8')
          print('VALID_COUNT',len(valid))
          PY
          python /tmp/discover.py

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: cofco-joycome-broker-discovery
          path: discovery
          retention-days: 1
          compression-level: 6
