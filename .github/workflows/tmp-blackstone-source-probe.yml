name: Temporary Blackstone report source probe

on:
  push:
    branches:
      - tmp/blackstone-broker-reports-20260829
    paths:
      - .github/workflows/tmp-blackstone-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 Pillow
      - name: Probe page images and report viewers
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, io, json, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          reports=[
              {'name':'western','count':31,'base':'https://oss.sdyanbao.com/page/2023/7/20/573950','fx':'3798566'},
              {'name':'orient','count':49,'base':'https://oss.sdyanbao.com/page/2022/6/12/306626','fx':None},
              {'name':'guosen','count':24,'base':'https://oss.sdyanbao.com/page/2022/8/23/341839','fx':'3333199'},
              {'name':'xingye','count':33,'base':'https://oss.sdyanbao.com/page/2022/3/22/264929','fx':'3086430'},
              {'name':'cicc','count':45,'base':'https://oss.sdyanbao.com/page/2020/12/12/144454','fx':None},
          ]
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com'}

          def fetch_image(url):
              try:
                  r=requests.get(url,headers=headers,timeout=20)
                  valid=False; dims=None; fmt=None
                  if r.status_code==200 and len(r.content)>5000:
                      try:
                          with Image.open(io.BytesIO(r.content)) as im:
                              im.load(); dims=im.size; fmt=im.format
                              valid=dims[0]>=500 and dims[1]>=500
                      except Exception:
                          pass
                  return {'url':url,'status':r.status_code,'bytes':len(r.content),'valid':valid,'dims':dims,'format':fmt,'type':r.headers.get('content-type')}
              except Exception as exc:
                  return {'url':url,'error':repr(exc),'valid':False}

          for rep in reports:
              print('\n===== IMAGE PROBE',rep['name'],'=====')
              # Probe every index for PNG and boundary variants/extensions.
              with ThreadPoolExecutor(max_workers=12) as ex:
                  futs={ex.submit(fetch_image,f"{rep['base']}/{i}.png"):i for i in range(rep['count'])}
                  results=[]
                  for fut in as_completed(futs):
                      rec=fut.result(); rec['index']=futs[fut]; results.append(rec)
              results.sort(key=lambda x:x['index'])
              valid=[r['index'] for r in results if r.get('valid')]
              print('PNG_SUMMARY',json.dumps({'expected':rep['count'],'valid_count':len(valid),'valid_indices':valid,'first_invalid':[r for r in results if not r.get('valid')][:5]},ensure_ascii=False))
              boundary=sorted(set([0,1,14,15,16,rep['count']-2,rep['count']-1,rep['count'],rep['count']+1]))
              for i in boundary:
                  for ext in ['jpg','jpeg','webp','png']:
                      rec=fetch_image(f"{rep['base']}/{i}.{ext}")
                      if rec.get('valid') or i in [14,15,16,rep['count']-1]:
                          print('BOUNDARY',rep['name'],i,ext,json.dumps(rec,ensure_ascii=False))

              if not rep.get('fx'): continue
              print('\n===== FXBAOGAO',rep['name'],'=====')
              s=requests.Session(); s.headers.update({'User-Agent':headers['User-Agent'],'Accept-Language':'zh-CN,zh;q=0.9'})
              urls=[f"https://www.fxbaogao.com/detail/{rep['fx']}",f"https://www.fxbaogao.com/view?id={rep['fx']}"]
              for url in urls:
                  try:
                      r=s.get(url,timeout=60,allow_redirects=True)
                      print('PAGE',url,'status',r.status_code,'final',r.url,'bytes',len(r.content),'type',r.headers.get('content-type'),'cookies',s.cookies.get_dict())
                      text=r.text; soup=BeautifulSoup(text,'html.parser')
                      print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
                      links=[]
                      for tag in soup.find_all(['a','img','iframe','embed','object','script','source','link']):
                          for attr in ['href','src','data','content']:
                              value=tag.get(attr)
                              if not value: continue
                              absolute=urljoin(r.url,value)
                              blob=absolute.lower()
                              if any(k in blob for k in ['pdf','download','viewer','view','file','report','oss','img','image','page']):
                                  links.append(absolute)
                      decoded=html.unescape(text).replace('\\/','/')
                      links.extend(re.findall(r'https?://[^"\'<>\s]+(?:\.pdf|\.png|\.jpg|\.jpeg|\.webp|download|viewer|report|file)[^"\'<>\s]*',decoded,re.I))
                      print('LINKS',json.dumps(sorted(set(links))[:300],ensure_ascii=False))
                      for needle in ['pdf','download','fileUrl','file_url','reportUrl','report_url','view?id','pageList','images','oss']:
                          poss=[m.start() for m in re.finditer(re.escape(needle),decoded,re.I)]
                          if poss:
                              print('NEEDLE',needle,'COUNT',len(poss))
                              for pos in poss[:10]:
                                  print('CONTEXT',re.sub(r'\s+',' ',decoded[max(0,pos-500):pos+1200])[:1800])
                  except Exception as exc:
                      print('PAGE_ERROR',url,repr(exc))
          PY
