name: Probe Kerry report page ranges
on:
  push:
    branches: [chatgpt-kerry-report-images-20260906]
    paths: ['.github/workflows/probe-kerry-page-ranges.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_kerry_page_ranges.py
      - uses: actions/upload-artifact@v4
        with:
          name: kerry-page-ranges
          path: kerry-page-ranges.json
          if-no-files-found: error
          retention-days: 1
