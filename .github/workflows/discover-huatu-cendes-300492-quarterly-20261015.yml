name: Discover Huatu Cendes 2026 quarterly report

on:
  push:
    paths:
      - '.github/workflows/discover-huatu-cendes-300492-quarterly-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query announcement index
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/notices/stock/300492.html'})
          for page in range(1,8):
              r=s.get('https://np-anotice-stock.eastmoney.com/api/security/ann',params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':'300492'},timeout=90)
              r.raise_for_status(); rows=(r.json().get('data') or {}).get('list') or []
              print('PAGE',page,'ROWS',len(rows),flush=True)
              for row in rows:
                  title=str(row.get('title') or '')
                  date=str(row.get('notice_date') or row.get('display_time') or '')
                  if date.startswith('2026') and any(k in title for k in ('季度','季报','年度报告','半年度报告')):
                      print('MATCH',json.dumps({k:row.get(k) for k in row.keys()},ensure_ascii=False),flush=True)
              if not rows: break
          PY
