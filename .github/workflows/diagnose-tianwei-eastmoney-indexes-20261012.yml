name: Diagnose Tianwei Eastmoney report indexes

on:
  pull_request:
    paths:
      - 'tasks/tianwei-eastmoney-diagnostic-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report indexes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, pathlib, requests, time
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out=pathlib.Path('eastmoney_diag'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=4,connect=4,read=4,status=4,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET','POST'],raise_on_status=False)))

          def scan(label, rows):
            matches=[]
            for row in rows:
              blob=json.dumps(row,ensure_ascii=False)
              if any(x in blob for x in ['天微电子','688511','军用灭火防爆系统龙头','下游景气度传导助力业绩腾飞','王泽宇','杨英杰']):
                matches.append(row)
                print('MATCH',label,json.dumps(row,ensure_ascii=False))
            return matches

          all_matches=[]
          cases=[
            ('list2_exact_all',{'pageSize':500,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2000-01-01','endTime':'2026-10-12','code':'688511','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}),
            ('list2_wild_202406',{'pageSize':5000,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2024-06-01','endTime':'2024-07-15','code':'*','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}),
            ('list2_wild_202107',{'pageSize':5000,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2021-06-01','endTime':'2021-10-01','code':'*','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}),
          ]
          for label,body in cases:
            r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'Content-Type':'application/json'},timeout=(20,120))
            print('RESPONSE',label,r.status_code,len(r.content),r.headers.get('content-type'),repr(r.text[:300]))
            (out/f'{label}.txt').write_text(r.text,encoding='utf-8',errors='ignore')
            try:
              data=r.json(); rows=data.get('data') or []
              print('ROWS',label,len(rows),'HITS',data.get('hits'),'PAGES',data.get('TotalPage') or data.get('totalPage'))
              all_matches.extend(scan(label,rows))
            except Exception as e: print('JSON_ERROR',label,repr(e))

          for qtype in ['0','1']:
            for label,code,beg,end in [
              ('exact','688511','2000-01-01','2026-10-12'),
              ('wild202406','', '2024-06-01','2024-07-15'),
              ('wild202107','', '2021-06-01','2021-10-01'),
            ]:
              params={'industryCode':'*','pageSize':'5000','industry':'*','rating':'*','ratingChange':'*','beginTime':beg,'endTime':end,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              if code: params['code']=code
              lab=f'list_q{qtype}_{label}'
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,120))
              print('RESPONSE',lab,r.status_code,len(r.content),r.url,repr(r.text[:300]))
              (out/f'{lab}.txt').write_text(r.text,encoding='utf-8',errors='ignore')
              try:
                data=r.json(); rows=data.get('data') or []
                print('ROWS',lab,len(rows),'HITS',data.get('hits'),'PAGES',data.get('TotalPage') or data.get('totalPage'))
                all_matches.extend(scan(lab,rows))
              except Exception as e: print('JSON_ERROR',lab,repr(e))

          uniq={}
          for row in all_matches:
            key=str(row.get('infoCode') or row.get('encodeUrl') or json.dumps(row,sort_keys=True,ensure_ascii=False))
            uniq[key]=row
          matches=list(uniq.values())
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          for row in matches:
            info=str(row.get('infoCode') or '')
            if not info: continue
            for prefix in ['H3','H2']:
              for suff in ['_1.pdf','_01.pdf']:
                u=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}{suff}'
                rr=s.get(u,headers={'Accept':'application/pdf,*/*;q=0.8'},timeout=(20,120))
                print('PDF_TEST',info,rr.status_code,len(rr.content),u,repr(rr.content[:10]))
                if rr.status_code==200 and rr.content.startswith(b'%PDF') and len(rr.content)>70000:
                  (out/f'{info}.pdf').write_bytes(rr.content)
                  print('PDF_FOUND',info,len(rr.content),u)
                  break
              else: continue
              break
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-eastmoney-diagnostics
          path: eastmoney_diag/
          if-no-files-found: error
          retention-days: 2
