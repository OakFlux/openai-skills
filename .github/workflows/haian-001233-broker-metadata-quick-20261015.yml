name: Package Haian Group broker reports direct

on:
  push:
    paths:
      - '.triggers/haian-001233-broker-metadata-quick-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          reports = [
              {
                  'date': '2025-11-10',
                  'broker': '华金证券',
                  'title': '新股覆盖研究：海安集团',
                  'classification': '新股覆盖研究',
                  'info_code': 'AP202511091778242536',
              },
              {
                  'date': '2026-01-08',
                  'broker': '山西证券',
                  'title': '巨胎龙头受益矿端景气度，深度绑定紫金矿业，持续开拓全球市场',
                  'classification': '公司专题研究报告',
                  'info_code': 'AP202601081816850426',
              },
              {
                  'date': '2026-09-03',
                  'broker': '中邮证券',
                  'title': 'Q2环比高增，巨胎主业盈利韧性凸显',
                  'classification': '公司跟踪研究报告',
                  'info_code': 'AP202609031828978638',
              },
          ]

          out = Path('final')
          renders = Path('renders')
          artifact = Path('artifact_out')
          for directory in (out, renders, artifact):
              directory.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept': 'application/pdf,*/*',
          })

          def safe(text):
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:110]

          manifest = []
          hashes = set()
          for index, report in enumerate(reports, 1):
              filename = f'{index:02d}_{report["date"]}_{report["broker"]}_{safe(report["title"])}.pdf'
              path = out / filename
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{report["info_code"]}_1.pdf',
              ]
              used_url = None
              errors = []
              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          response = session.get(url, timeout=(15, 90), allow_redirects=True)
                          print('DOWNLOAD', report['broker'], attempt, response.status_code, len(response.content), url, flush=True)
                          if response.status_code == 200 and len(response.content) > 90000 and response.content.startswith(b'%PDF-'):
                              path.write_bytes(response.content)
                              used_url = url
                              break
                          errors.append(f'{url}: HTTP {response.status_code}, {len(response.content)} bytes')
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(attempt)
                  if used_url:
                      break
              if not used_url:
                  raise RuntimeError('Download failed: ' + ' | '.join(errors[-8:]))

              qpdf = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(qpdf.stderr[-1000:])
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 4:
                  raise RuntimeError(f'Unexpected page count: {pages}')
              parts = []
              for page_index in range(min(10, pages)):
                  try:
                      parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              sample = '\n'.join(parts)
              if not any(term in sample for term in ('海安集团', '海安橡胶集团', '001233')):
                  raise RuntimeError('Company identity check failed')
              if not any(term in sample for term in ('证券研究报告', '公司研究', '研究报告', '投资评级', '新股研究')):
                  raise RuntimeError('Research report check failed')

              render_prefix = renders / f'cover_{index:02d}'
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '80', str(path), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              png_path = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not png_path.exists() or png_path.stat().st_size < 5000:
                  raise RuntimeError('Cover render failed')

              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in hashes:
                  raise RuntimeError('Duplicate PDF')
              hashes.add(sha256)
              item = {
                  'filename': filename,
                  'date': report['date'],
                  'broker': report['broker'],
                  'title': report['title'],
                  'classification': report['classification'],
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'source_url': used_url,
              }
              manifest.append(item)
              print('VERIFIED', json.dumps(item, ensure_ascii=False), flush=True)

          readme = [
              '海安集团（001233.SZ）券商深度及公司研究报告精选',
              '整理日期：2026-10-15',
              '',
              '本压缩包收录3份公开可直接下载的完整券商研究PDF。',
              '华金证券报告为新股覆盖研究；山西证券和中邮证券报告补充上市后的业务逻辑与最新经营变化。',
              '未使用网页摘要、预览页或残缺文件替代完整原文。',
              '',
              '文件清单：',
          ]
          for number, item in enumerate(manifest, 1):
              readme.extend([
                  f'{number}. {item["filename"]}',
                  f'   券商：{item["broker"]}',
                  f'   类型：{item["classification"]}',
                  f'   标题：{item["title"]}',
                  f'   日期：{item["date"]}；页数：{item["pages"]}；大小：{item["bytes"]} bytes',
                  f'   公开PDF：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ])
          readme.append('完整性检查：已检查PDF文件头、公司名称或证券代码、研究报告属性、实际页数、qpdf结构、首页渲染、重复文件及ZIP CRC。')

          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = artifact / '海安集团_001233_券商深度及公司研究报告_3份.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdf_count = sum(1 for name in archive.namelist() if name.lower().endswith('.pdf'))
              if bad or pdf_count != 3:
                  raise RuntimeError(f'ZIP validation failed: {bad}, {pdf_count}')

          print('FINAL_MANIFEST', json.dumps(manifest, ensure_ascii=False), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: haian-001233-broker-reports-direct
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
