name: Quick discover Haian Group broker metadata 20261015

on:
  push:
    paths:
      - '.triggers/haian-001233-broker-metadata-quick-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Query public research APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,*/*'})
          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2025-01-01','endTime':'2026-10-15','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'001233','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(15,60))
          print('EM_GET',r.status_code,len(r.content),r.url,flush=True)
          if r.status_code==200:
            rows=r.json().get('data') or []
            print('EM_COUNT',len(rows),flush=True)
            for x in rows: print('EM_ROW',json.dumps(x,ensure_ascii=False),flush=True)
          body={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2025-01-01','endTime':'2026-10-15','code':'001233','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
          r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=(15,60),headers={'Content-Type':'application/json'})
          print('EM_POST',r.status_code,len(r.content),flush=True)
          if r.status_code==200:
            rows=r.json().get('data') or []
            print('EM2_COUNT',len(rows),flush=True)
            for x in rows: print('EM2_ROW',json.dumps(x,ensure_ascii=False),flush=True)
          fx='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          for i,b in enumerate([
            {'stockCodes':['001233'],'pageNum':1,'pageSize':100,'order':1},
            {'keywords':'海安集团','pageNum':1,'pageSize':100,'order':1},
          ],1):
            r=s.post(fx,json=b,timeout=(15,60),headers={'Content-Type':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
            print('FX',i,r.status_code,len(r.content),flush=True)
            if r.status_code==200:
              rows=((r.json().get('data') or {}).get('dataList') or [])
              print('FX_COUNT',i,len(rows),flush=True)
              for x in rows:
                blob=json.dumps(x,ensure_ascii=False)
                if '001233' in blob or '海安集团' in blob or '海安橡胶' in blob:
                  print('FX_ROW',json.dumps(x,ensure_ascii=False),flush=True)
          PY
