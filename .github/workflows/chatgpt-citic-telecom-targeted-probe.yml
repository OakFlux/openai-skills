name: Probe exact CITIC Telecom broker report sources

on:
  push:
    branches:
      - chatgpt-citic-telecom-pdfbuild-20260908b
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf
      - name: Probe sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/html out/files
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import io, json, re, urllib.parse, time, hashlib
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path('out')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          queries=[
            '"Deutsche Bank-CITIC Telecom(1883.HK)Catching the Express-150611"',
            '"CITIC Telecom" "Catching the Express"',
            '"中信国际电讯集团有限公司" "港股推介" "150305"',
            '"中信国际电讯" "升至买入评级" "3.2元"',
            '"中信国际电讯" "德意志银行" 研报',
            '"1883.HK" "Deutsche Bank" report',
          ]
          records=[]; targets=[]
          for qi,q in enumerate(queries,1):
            url='https://www.so.com/s?q='+urllib.parse.quote(q)+'&pn=1'
            try:
              r=s.get(url,timeout=(15,90),allow_redirects=True)
              r.raise_for_status()
              (OUT/'html'/f'search_{qi}.html').write_text(r.text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(r.text,'lxml')
              hits=[]
              for a in soup.find_all('a',href=True):
                txt=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                href=urllib.parse.urljoin(r.url,a['href'])
                blob=(txt+' '+href).lower()
                if any(k in blob for k in ['中信国际电讯','中信國際電訊','citic telecom','1883.hk','1883_hk','港股推介','catching the express']):
                  hits.append({'text':txt[:500],'href':href})
              print('\nSEARCH',q,'hits',len(hits),flush=True)
              for h in hits:
                print('HIT',json.dumps(h,ensure_ascii=False),flush=True)
                if '/link?' in h['href'] or not urllib.parse.urlparse(h['href']).netloc.endswith('so.com'):
                  targets.append(h)
              records.append({'query':q,'url':url,'status':r.status_code,'hits':hits})
            except Exception as e:
              records.append({'query':q,'url':url,'error':repr(e)})
              print('SEARCH_FAIL',q,repr(e),flush=True)

          # Add exact redirect URLs observed in public search results.
          exact=[
            ('deutsche_catching','https://www.so.com/link?m=ukpYHN4SyYMDzjuEIKe0x3KujRgaTC0bEJq0UmkLn%2BXUa3mMYC0uvxTlfY%2BvFuIXMh5s0dkqQSPqFJJbdLlgriFqWZ9PEg2Q7jVYS8dOC%2BTOVb3DjuTdNdNetWUQ95VPyIX69Q%2BMdV%2BaD%2FjnRdcUZ2M2ROGQQCqQKzCg5q%2Br0OEtfVpw%2FXRzi5uKnoWfp7K6svr%2B2rQ%3D%3D'),
            ('zhifu_20150305','https://www.so.com/link?m=uStmmO3Psv4lZIMbhKjFzZKgdS80AnnCaFYvfq67b324p9bRmX0gmelYq6%2FEoyN%2B4mhUaQtkRAwf1Z47YxxxfMjPi6OS2r%2FzPqyIThsiUzeNSwFI3aw09%2FxOdHP4UykNJa7j8iEhsg2BX3N002P1utjTAO8HOFLLMpt6mOO6IVvU6BHpfVA2SpzovGyBYqWRDIyUZSqd1KTHRk%2FwdK9rvkp%2FZaMeNFgdz'),
            ('deutsche_upgrade','https://www.so.com/link?m=zWKYOQFoJhYVl2bbkWCBvKI3rOCTjDVRZquJlT6uQM3VLgXfyawHlr6q%2B2fA2Zl%2F%2FcVurebeCjBzh6KeKAb523XyfBkLPjwlGY0gnPaK%2FhbkLrPIx3thIWkGkEDWjGn6sQfkhGWI8%2Fc2OFRzlBiF2oIeNxBcS49QH%2BrEKlD63ZCdG75ALdyJ5Jcv3EEizgCAVyl7RY0JS2k0DYVkvR9PeIz%2BO7x6U%2FkQJ8%2BrxFP4I1c66g7DD%2Fl8IMvbIqUSqG3SV'),
          ]
          resolved=[]; seen=set()
          for idx,(label,u) in enumerate(exact+[(f'found_{i}',x['href']) for i,x in enumerate(targets[:80],1)],1):
            if u in seen: continue
            seen.add(u)
            try:
              rr=s.get(u,timeout=(15,120),allow_redirects=True)
              ctype=rr.headers.get('content-type','')
              body=rr.content
              print('\nRESOLVE',label,rr.status_code,len(body),rr.url,ctype,flush=True)
              rec={'label':label,'source':u,'status':rr.status_code,'final_url':rr.url,'bytes':len(body),'ctype':ctype,'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in rr.history]}
              if b'%PDF' in body[:4096] and len(body)>20000:
                fn=f'{label}.pdf'; (OUT/'files'/fn).write_bytes(body)
                try: pages=len(PdfReader(io.BytesIO(body),strict=False).pages)
                except Exception as e: pages=None; rec['pdf_error']=repr(e)
                rec.update({'is_pdf':True,'file':fn,'pages':pages,'sha256':hashlib.sha256(body).hexdigest()})
              else:
                text=body.decode(rr.encoding or 'utf-8',errors='replace')
                (OUT/'html'/f'{label}.html').write_text(text,encoding='utf-8',errors='replace')
                soup=BeautifulSoup(text,'lxml')
                rec['title']=re.sub(r'\s+',' ',soup.title.get_text(' ',strip=True)) if soup.title else ''
                links=[]
                for tag in soup.find_all(['a','img','iframe','embed','object','source'],limit=5000):
                  for attr in ('href','src','data','data-src','data-url','file'):
                    v=tag.get(attr)
                    if not v: continue
                    if isinstance(v,list): v=' '.join(v)
                    au=urllib.parse.urljoin(rr.url,str(v))
                    low=au.lower()
                    if any(k in low for k in ['.pdf','download','docdetail','report','page','preview','image','img','attachment','file']):
                      links.append({'tag':tag.name,'attr':attr,'url':au,'text':re.sub(r'\s+',' ',tag.get_text(' ',strip=True))[:300]})
                # Raw URLs and useful IDs.
                for m in re.finditer(r'https?://[^\s"\'<>\\]+',text):
                  au=m.group(0).rstrip('),;]')
                  if any(k in au.lower() for k in ['.pdf','download','preview','report','page','img','image']): links.append({'tag':'raw','attr':'raw','url':au,'text':''})
                rec['links']=list({x['url']:x for x in links}.values())[:1000]
                rec['ids']=list(dict.fromkeys(re.findall(r'(?i)(?:docid|reportid|report_id|fileid|file_id|id)["\'\s:=]+([A-Za-z0-9_-]{4,})',text)))[:200]
                for lk in rec['links'][:100]: print('LINK',json.dumps(lk,ensure_ascii=False),flush=True)
              resolved.append(rec)
            except Exception as e:
              print('RESOLVE_FAIL',label,u,repr(e),flush=True)
              resolved.append({'label':label,'source':u,'error':repr(e)})

          # DBS exact pages and current PDF paths.
          dbs_pages={
            'company_guide':'https://www.dbs.com.sg/treasures/aics/templatedata/article/equity/data/en/DBSV/012014/1883_HK.xml',
            'h1_26':'https://www.dbs.com.sg/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/082026/1883_HK_08142026.xml',
            'fy25':'https://www.dbs.com.sg/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/032026/1883_HK_03172026.xml',
            'h1_25':'https://www.dbs.com.sg/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/082025/1883_HK_08192025.xml',
            'fy24':'https://www.dbs.com.sg/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/032025/1883_HK_03132025.xml',
          }
          dbs=[]
          for label,page_url in dbs_pages.items():
            try:
              r=s.get(page_url,timeout=(15,120),allow_redirects=True); r.raise_for_status(); text=r.text
              (OUT/'html'/f'dbs_{label}.html').write_text(text,encoding='utf-8',errors='replace')
              paths=[]
              for pat in [r'(?i)(?:ReportPdfPath|ReportPDFPath|ArticlePDFPath)[^/]{0,200}(/content/article/pdf/[^"\'<>,\\]+\.pdf)',r'(/content/article/pdf/[^"\'<>,\\]+\.pdf)']:
                paths.extend(re.findall(pat,text))
              paths=list(dict.fromkeys(x.replace('\\/','/') for x in paths))
              print('\nDBS_PAGE',label,r.status_code,len(r.content),r.url,'paths',paths,flush=True)
              attempts=[]
              for path in paths:
                for host in ['https://www.dbs.com.sg','https://www.dbs.com.hk']:
                  urls=[
                    host+path,
                    host+'/wrapperapi/generic/download-pdf?pdf_path='+urllib.parse.quote(path,safe=''),
                    host+'/wrapperapi/generic/download-pdf?pdfpath='+urllib.parse.quote(path,safe=''),
                    host+'/treasures/aics/pdfController.page?pdfpath='+urllib.parse.quote(path,safe=''),
                  ]
                  for u in urls:
                    try:
                      x=s.get(u,headers={'User-Agent':s.headers['User-Agent'],'Referer':page_url,'Accept':'application/pdf,*/*'},timeout=(15,120),allow_redirects=True)
                      ispdf=b'%PDF' in x.content[:4096] and len(x.content)>20000
                      a={'url':u,'status':x.status_code,'final_url':x.url,'bytes':len(x.content),'ctype':x.headers.get('content-type'),'is_pdf':ispdf}
                      attempts.append(a); print('DBS_ATTEMPT',json.dumps(a,ensure_ascii=False),flush=True)
                      if ispdf:
                        fn=f'dbs_{label}_{Path(path).name}'; (OUT/'files'/fn).write_bytes(x.content)
                        a['file']=fn; a['pages']=len(PdfReader(io.BytesIO(x.content),strict=False).pages); a['sha256']=hashlib.sha256(x.content).hexdigest()
                    except Exception as e:
                      attempts.append({'url':u,'error':repr(e)})
              dbs.append({'label':label,'page_url':page_url,'final_url':r.url,'paths':paths,'attempts':attempts})
            except Exception as e:
              dbs.append({'label':label,'page_url':page_url,'error':repr(e)})
              print('DBS_FAIL',label,repr(e),flush=True)

          (OUT/'probe.json').write_text(json.dumps({'searches':records,'resolved':resolved,'dbs':dbs},ensure_ascii=False,indent=2),encoding='utf-8')
          print('\nVALID_FILES')
          for p in sorted((OUT/'files').glob('*')): print(p,p.stat().st_size)
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: citic-telecom-targeted-probe
          path: out/
          retention-days: 3
          if-no-files-found: error
