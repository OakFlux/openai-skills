name: Temporary Package Ruifeng Brokerage Deep Reports

on:
  push:
    branches:
      - tmp/fetch-ruifeng-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests

          ROOT = Path('ruifeng_research_package')
          PDF_DIR = ROOT / '01_券商深度报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'date': '2025-06-14',
                  'broker': '华鑫证券',
                  'analysts': '张伟保、覃前',
                  'title': '公司深度报告：国内润滑油添加剂龙头企业，技术突破与国产替代驱动公司成长',
                  'info_code': 'AP202506141690938060',
                  'expected_pages': 30,
                  'filename': '01_华鑫证券_2025-06-14_国内润滑油添加剂龙头企业_技术突破与国产替代驱动公司成长.pdf',
              },
              {
                  'date': '2024-05-08',
                  'broker': '山西证券',
                  'analysts': '李旋坤、程俊杰',
                  'title': '润滑油添加剂龙头，进口替代打开成长空间',
                  'info_code': 'AP202405081632652666',
                  'expected_pages': 41,
                  'filename': '02_山西证券_2024-05-08_润滑油添加剂龙头_进口替代打开成长空间.pdf',
              },
              {
                  'date': '2024-02-22',
                  'broker': '华安证券',
                  'analysts': '王强峰',
                  'title': '润滑油添加剂新星崛起，国产替代加速产能扩张',
                  'info_code': 'AP202402211622525246',
                  'expected_pages': 28,
                  'filename': '03_华安证券_2024-02-22_润滑油添加剂新星崛起_国产替代加速产能扩张.pdf',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,*/*',
              'Referer': 'https://data.eastmoney.com/',
          })

          def normalize(text):
              return re.sub(r'\s+', '', text or '').replace('：', ':').replace('，', ',')

          def page_count(path):
              completed = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', completed.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Cannot parse page count for {path}')
              return int(match.group(1))

          def extract_text(path, first_page, last_page):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as temporary:
                  output = Path(temporary.name)
              try:
                  completed = subprocess.run(
                      ['pdftotext', '-f', str(first_page), '-l', str(last_page), '-enc', 'UTF-8', str(path), str(output)],
                      capture_output=True,
                      text=True,
                  )
                  if completed.returncode != 0 or not output.exists():
                      return ''
                  return output.read_text(encoding='utf-8', errors='ignore')
              finally:
                  output.unlink(missing_ok=True)

          manifest = []
          sha_lines = []

          for report in reports:
              url = f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_1.pdf'
              path = PDF_DIR / report['filename']
              errors = []
              for attempt in range(1, 4):
                  try:
                      print(f'GET {report["broker"]} {report["date"]} attempt={attempt}: {url}')
                      with session.get(url, timeout=120, allow_redirects=True, stream=True) as response:
                          response.raise_for_status()
                          data = bytearray()
                          for chunk in response.iter_content(chunk_size=1024 * 256):
                              if chunk:
                                  data.extend(chunk)
                          raw = bytes(data)
                          content_type = response.headers.get('content-type')
                      if len(raw) < 500_000 or not raw.lstrip().startswith(b'%PDF'):
                          raise RuntimeError(f'not a substantial PDF: type={content_type}, bytes={len(raw)}, head={raw[:16]!r}')
                      path.write_bytes(raw)
                      break
                  except Exception as exc:
                      errors.append(str(exc))
                      time.sleep(attempt * 2)
              else:
                  raise RuntimeError(f'Unable to download {report["title"]}: {errors}')

              pages = page_count(path)
              if pages != report['expected_pages']:
                  raise RuntimeError(f'Page count mismatch for {report["title"]}: expected={report["expected_pages"]}, actual={pages}')

              first_text = extract_text(path, 1, min(10, pages))
              middle_page = max(1, pages // 2)
              last_text = extract_text(path, middle_page, middle_page) + '\n' + extract_text(path, pages, pages)
              combined = normalize(first_text + '\n' + last_text)

              company_ok = ('瑞丰新材' in combined) or ('300910' in combined) or ('新乡市瑞丰新材料股份有限公司' in combined)
              broker_ok = report['broker'] in combined
              year_ok = report['date'][:4] in combined
              title_terms = [term for term in re.split(r'[：:,，、\s]+', report['title']) if len(term) >= 4]
              title_ok = sum(term in combined for term in title_terms) >= max(2, len(title_terms) // 2)
              if not all([company_ok, broker_ok, year_ok, title_ok]):
                  raise RuntimeError(
                      f'Validation failed for {report["title"]}: '
                      f'company={company_ok}, broker={broker_ok}, year={year_ok}, title={title_ok}'
                  )

              raw = path.read_bytes()
              sha = hashlib.sha256(raw).hexdigest()
              relative = str(path.relative_to(ROOT))
              record = {
                  'broker': report['broker'],
                  'date': report['date'],
                  'analysts': report['analysts'],
                  'title': report['title'],
                  'info_code': report['info_code'],
                  'file': relative,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'source_url': url,
                  'detail_url': f'https://data.eastmoney.com/report/info/{report["info_code"]}.html',
                  'pdf_header_valid': True,
                  'company_identity_matched': company_ok,
                  'broker_matched': broker_ok,
                  'year_matched': year_ok,
                  'title_matched': title_ok,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {relative}')
              print(f'VERIFIED {report["broker"]} {report["date"]}: pages={pages}, bytes={len(raw)}')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '瑞丰新材（300910）券商深度报告完整PDF包',
              '',
              '筛选口径：优先选择近年、页数较完整、明确属于公司深度或系统性覆盖的报告；不以数页业绩点评凑数。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f'- {record["broker"]}｜{record["date"]}｜{record["title"]}',
                  f'  分析师：{record["analysts"]}',
                  f'  页数：{record["pages"]}',
                  f'  文件：{record["file"]}',
                  f'  SHA256：{record["sha256"]}',
                  f'  报告详情：{record["detail_url"]}',
                  f'  PDF来源：{record["source_url"]}',
              ])
          readme.extend([
              '',
              '校验项目：PDF文件头、可解析页数、瑞丰新材/证券代码、券商名称、报告年份与标题、SHA-256、ZIP CRC。',
          ])
          (ROOT / 'README_报告清单及校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '瑞丰新材_300910_券商深度报告_3份_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: ruifeng-brokerage-deep-reports
          path: 瑞丰新材_300910_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
