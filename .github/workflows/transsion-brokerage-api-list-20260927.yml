name: List Transsion brokerage report metadata 20260927

on:
  push:
    paths:
      - '.github/workflows/transsion-brokerage-api-list-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Eastmoney report API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':'2019-01-01','endTime':'2026-09-27','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'688036','rcode':'','p':'1','pageNum':'1','pageNumber':'1','_':str(int(time.time()*1000))}
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
          print('STATUS',r.status_code,'URL',r.url,'BYTES',len(r.content),flush=True)
          print(r.text,flush=True)
          r.raise_for_status()
          PY
