name: Probe global report API for Xinjiang Joinworld deep reports

on:
  push:
    paths:
      - '.github/workflows/xinjiang-joinworld-global-report-api-probe-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query narrow date windows and probe PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          from __future__ import annotations

          import json
          from io import BytesIO
          import requests
          from pypdf import PdfReader

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          windows = [
              ('2022-08-18','2022-08-26'),
              ('2023-07-28','2023-08-05'),
              ('2025-09-24','2025-10-02'),
          ]
          needles = [
              '全国领先的高纯铝龙头',
              '被低估的电极箔一体化龙头',
              '铝电子材料一体化完备',
              '多业务领跑行业',
              '新疆众和',
          ]
          found = {}
          api = 'https://reportapi.eastmoney.com/report/list'
          for begin, end in windows:
              for page in range(1, 30):
                  params = {
                      'industryCode':'*','pageSize':'5000','industry':'*',
                      'rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,
                      'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'',
                      'p':str(page),'pageNum':str(page),'pageNumber':str(page),
                  }
                  response = session.get(api, params=params, timeout=(25,180))
                  print('API', begin, end, page, response.status_code, len(response.content), response.url, flush=True)
                  response.raise_for_status()
                  payload = response.json()
                  batch = payload.get('data') or []
                  print('COUNT', len(batch), flush=True)
                  for row in batch:
                      blob = json.dumps(row, ensure_ascii=False)
                      if any(needle in blob for needle in needles):
                          key = str(row.get('infoCode') or row.get('id') or blob)
                          found[key] = row
                          print('MATCH', json.dumps(row, ensure_ascii=False), flush=True)
                  if len(batch) < 5000:
                      break

          print('FOUND_COUNT', len(found), flush=True)
          for info, row in found.items():
              print('FOUND_SUMMARY', json.dumps({k:row.get(k) for k in ('infoCode','title','orgSName','publishDate','attachPages','author','emRatingName','stockName','stockCode')}, ensure_ascii=False), flush=True)
              if not info.startswith('AP'):
                  continue
              for prefix in ('H3','H2','H1','H4'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  try:
                      r = session.get(url, timeout=(30,240), headers={'Accept':'application/pdf,*/*;q=0.8'})
                      valid = r.status_code == 200 and r.content.startswith(b'%PDF') and len(r.content) > 50000
                      pages = None
                      if valid:
                          pages = len(PdfReader(BytesIO(r.content), strict=False).pages)
                      print('PDF_PROBE', info, prefix, r.status_code, len(r.content), valid, pages, url, flush=True)
                      if valid:
                          break
                  except Exception as exc:
                      print('PDF_ERROR', info, prefix, repr(exc), flush=True)
          PY
