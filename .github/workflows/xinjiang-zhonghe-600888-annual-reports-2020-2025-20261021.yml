name: Build Xinjiang Zhonghe 600888 annual reports package 20261021

on:
  push:
    paths:
      - '.github/workflows/xinjiang-zhonghe-600888-annual-reports-2020-2025-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          STOCK_CODE = '600888'
          COMPANY_SHORT = '新疆众和'
          COMPANY_FULL = '新疆众和股份有限公司'
          PACKAGE_CN = '新疆众和_600888.SH_2020-2025年报及最新季报'
          PACKAGE_EN = 'Xinjiang_Zhonghe_600888_2020-2025_Annual_Reports_Latest_Quarter'
          AS_OF = '2026-10-21'

          ROOT = Path(PACKAGE_CN)
          VERIFY = Path('verify')
          OUTPUT = Path('artifact_out')
          for path in (ROOT, VERIFY, OUTPUT):
              path.mkdir(parents=True, exist_ok=True)

          annual_specs = [
              {'variants':['2020年年度报告'], 'period':'2020', 'filename':'01_新疆众和_2020年年度报告.pdf', 'min_pages':100},
              {'variants':['2021年年度报告'], 'period':'2021', 'filename':'02_新疆众和_2021年年度报告.pdf', 'min_pages':100},
              {'variants':['2022年年度报告'], 'period':'2022', 'filename':'03_新疆众和_2022年年度报告.pdf', 'min_pages':100},
              {'variants':['2023年年度报告'], 'period':'2023', 'filename':'04_新疆众和_2023年年度报告.pdf', 'min_pages':100},
              {'variants':['2024年年度报告'], 'period':'2024', 'filename':'05_新疆众和_2024年年度报告.pdf', 'min_pages':100},
              {'variants':['2025年年度报告'], 'period':'2025', 'filename':'06_新疆众和_2025年年度报告.pdf', 'min_pages':100},
          ]

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=7, connect=7, read=7, status=7,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows: list[dict[str, Any]] = []
          search_pages: list[dict[str, Any]] = []
          for page in range(1, 61):
              params = {
                  'sr':'-1', 'page_size':'100', 'page_index':str(page),
                  'ann_type':'A', 'client_source':'web', 'stock_list':STOCK_CODE,
                  'f_node':'0', 's_node':'0',
              }
              data = None
              last: Any = None
              for attempt in range(8):
                  try:
                      response = session.get(api, params=params, timeout=(20, 120))
                      last = {'status':response.status_code, 'text':response.text[:300]}
                      if response.status_code == 200:
                          data = response.json()
                          break
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'Announcement API failed page {page}: {last}')
              rows = ((data.get('data') or {}).get('list') or [])
              search_pages.append({'page':page, 'count':len(rows)})
              if not rows:
                  break
              all_rows.extend(rows)
              time.sleep(0.08)

          def compact(text: str) -> str:
              return re.sub(r'\s+', '', text or '')

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '')

          def date_value(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or row.get('notice_date') or '')

          bad_common = [
              '摘要','英文版','取消','问询','回复','审计报告','董事会','监事会',
              '更正公告','提示性公告','社会责任报告','环境、社会及管治报告',
              '可持续发展报告','独立董事述职报告','内部控制评价报告','财务决算报告',
              '年度报告说明会','年度报告网上说明会','募集资金','会计师事务所',
              '前期会计差错更正后的财务报表','财务报表及相关附注','财务报告',
          ]

          def choose_report(variants: list[str], period: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              candidates: list[tuple[int, str, dict[str, Any], str]] = []
              for row in all_rows:
                  raw_title = str(row.get('title') or '')
                  title = compact(raw_title)
                  matched = next((key for key in variants if compact(key) in title), None)
                  if not matched or any(compact(x) in title for x in bad_common):
                      continue
                  score = 50
                  key = compact(matched)
                  if title.endswith(key): score += 35
                  if title == key: score += 20
                  if title.startswith(COMPANY_SHORT) or title.startswith(COMPANY_FULL): score += 15
                  if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score += 100
                  if any(x in title for x in ['取消版','已取消']): score -= 100
                  candidates.append((score, date_value(row), row, matched))
              candidates.sort(key=lambda item:(item[0], item[1]), reverse=True)
              if not candidates:
                  raise RuntimeError(f'Missing report: {variants}')
              log = [
                  {'period':period, 'matched_variant':matched, 'score':score, 'date':date,
                   'title':row.get('title'), 'art_code':art_code(row)}
                  for score, date, row, matched in candidates[:20]
              ]
              return candidates[0][2], log

          def choose_latest_quarter() -> tuple[dict[str, Any], str, str, list[dict[str, Any]]]:
              desired = [
                  (['2026年第三季度报告','2026年三季度报告'], '2026Q3', '2026年第三季度报告'),
                  (['2026年第一季度报告','2026年一季度报告'], '2026Q1', '2026年第一季度报告'),
                  (['2025年第三季度报告','2025年三季度报告'], '2025Q3', '2025年第三季度报告'),
                  (['2025年第一季度报告','2025年一季度报告'], '2025Q1', '2025年第一季度报告'),
              ]
              combined: list[dict[str, Any]] = []
              for variants, period, label in desired:
                  try:
                      row, log = choose_report(variants, period)
                      combined.extend(log)
                      return row, period, label, combined
                  except RuntimeError:
                      continue
              raise RuntimeError('Missing latest quarterly report')

          selected: list[dict[str, Any]] = []
          candidate_logs: dict[str, Any] = {}
          for spec in annual_specs:
              row, log = choose_report(spec['variants'], spec['period'])
              candidate_logs[f"{spec['period']}年年度报告"] = log
              selected.append({
                  'period':spec['period'], 'filename':spec['filename'],
                  'min_pages':spec['min_pages'], 'doc_type':'年度报告', 'row':row,
              })

          quarter_row, quarter_period, quarter_label, quarter_log = choose_latest_quarter()
          candidate_logs['最新季报'] = quarter_log
          selected.append({
              'period':quarter_period,
              'filename':f'07_新疆众和_{quarter_label}.pdf',
              'min_pages':5, 'doc_type':'最新季报', 'row':quarter_row,
          })

          def fetch_pdf(art: str, referer: str) -> tuple[bytes, dict[str, Any], str]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art}_1.pdf',
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(5):
                      try:
                          response = session.get(
                              url, timeout=(30, 420), allow_redirects=True,
                              headers={
                                  'User-Agent':session.headers['User-Agent'], 'Referer':referer,
                                  'Accept':'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url':url, 'status':response.status_code, 'final_url':response.url,
                              'content_type':response.headers.get('content-type',''), 'bytes':len(response.content),
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 30_000:
                              return response.content, last, url
                      except Exception as exc:
                          last = {'url':url, 'error':repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {art}: {last}')

          manifest: list[dict[str, Any]] = []
          seen_hashes: set[str] = set()
          for spec in selected:
              row = spec.pop('row')
              art = art_code(row)
              if not art:
                  raise RuntimeError(f'No art code for {spec["filename"]}')
              detail_page = f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html'
              data, download_meta, mirror_pdf = fetch_pdf(art, detail_page)
              dest = ROOT / spec['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {dest.name}: {pages} < {spec["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(20, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              identity_ok = any(text in extracted for text in [COMPANY_SHORT, COMPANY_FULL, STOCK_CODE])
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')

              subprocess.run(
                  ['qpdf','--warning-exit-0','--check',str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              for page_number, suffix in ((1, 'first'), (pages, 'last')):
                  prefix = VERIFY / f'{dest.stem}_{suffix}'
                  subprocess.run([
                      'pdftoppm','-f',str(page_number),'-l',str(page_number),'-png','-r','95',
                      '-singlefile',str(dest),str(prefix)
                  ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  preview = Path(str(prefix) + '.png')
                  if not preview.exists() or preview.stat().st_size < 8_000:
                      raise RuntimeError(f'Preview render failed: {dest.name}, page {page_number}')

              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              manifest.append({
                  **spec,
                  'announcement_title':row.get('title'),
                  'announcement_date':date_value(row),
                  'art_code':art,
                  'announcement_detail_page':detail_page,
                  'mirror_pdf_url':mirror_pdf,
                  'official_cninfo_index':f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK_CODE}',
                  'official_sse_profile':f'https://www.sse.com.cn/assortment/stock/list/info/company/index.shtml?COMPANY_CODE={STOCK_CODE}',
                  'actual_pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'identity_text_check':identity_ok,
                  'download_meta':download_meta,
                  'validation':['PDF header','announcement-title match','issuer identity','minimum page count','qpdf structure','first-page render','last-page render','duplicate hash check'],
              })

          latest = manifest[-1]
          readme = [
              '新疆众和股份有限公司（600888.SH）2020—2025年年度报告及最新季度报告资料包',
              f'整理日期：{AS_OF}',
              '',
              '本包收录2020年至2025年全部完整年度报告，以及截至整理日可检索到的最新独立季度报告。',
              f"最新季报：{latest['announcement_title']}，公告日期：{latest['announcement_date']}。",
              '若同一年度存在更正后、修订版或更新后版本，优先选用最新修订文件。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件类型：{item['doc_type']}；公告标题：{item['announcement_title']}",
                  f"   公告日期：{item['announcement_date']}；实际页数：{item['actual_pages']}页",
                  f"   公告页面：{item['announcement_detail_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '来源说明：PDF由公开公告镜像下载，并与证券代码、公告标题和报告年份逐一匹配；包内保留公告页面及官方信息披露索引。',
              '核验项目：PDF文件头、公告标题、公司名称/证券代码、实际页数、qpdf结构、首末页渲染、重复文件、ZIP CRC和SHA-256。',
          ]

          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_selection_log.json').write_text(json.dumps(candidate_logs, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'announcement_search_log.json').write_text(
              json.dumps({'pages':search_pages, 'rows_scanned':len(all_rows)}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest), encoding='utf-8'
          )

          cn_zip = OUTPUT / f'{PACKAGE_CN}.zip'
          with zipfile.ZipFile(cn_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{PACKAGE_CN}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(cn_zip, 'r') as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != 7 or len(manifest) != 7:
                  raise RuntimeError(f'PDF count mismatch: zip={len(pdfs)}, manifest={len(manifest)}')

          en_zip = OUTPUT / f'{PACKAGE_EN}.zip'
          shutil.copy2(cn_zip, en_zip)
          print('FINAL_ZIP', cn_zip, cn_zip.stat().st_size, 'SHA256', hashlib.sha256(cn_zip.read_bytes()).hexdigest())
          print('BACKUP_ZIP', en_zip, en_zip.stat().st_size, 'SHA256', hashlib.sha256(en_zip.read_bytes()).hexdigest())
          print('LATEST_QUARTER', latest['announcement_title'], latest['announcement_date'])
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: xinjiang-zhonghe-600888-annual-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
