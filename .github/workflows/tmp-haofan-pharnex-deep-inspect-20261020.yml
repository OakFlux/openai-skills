name: Inspect Pharnex page state and scripts

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-pharnex-deep-inspect-20261020.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect HTML state and detail JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          UA='Mozilla/5.0'
          urls={
            'page':'https://www.pharnexcloud.com/data/qynb_cbdc86e5f466e793c1e7cebab37e0a52.html',
            'script':'https://www-buffer.pharnexcloud.com/assets/js/dongcha/qynb/detail.js?v=202511061',
            'api':'https://www-buffer.pharnexcloud.com/assets/js/common/APIconfig.js?v=202511061',
            'datareq':'https://www-buffer.pharnexcloud.com/assets/js/common/request/data.js?v=202511061',
          }
          for name,url in urls.items():
            print('\n===== '+name+' '+url+' =====')
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read()
            text=raw.decode('utf-8','ignore')
            print('LEN',len(text))
            if name=='page':
              patterns=['下载报告','报告附件','attachment','download','file_url','fileUrl','pdf_url','pdfUrl','qynb_','cbdc86e5','301393','2018年报','2018-12-31','yry-data','149431','149137']
            else:
              patterns=['download','attachment','file','pdf','qynb','annual','report','detail','API','api']
            for p in patterns:
              print('\n-- FIND',p,'--')
              for m in list(re.finditer(re.escape(p),text,re.I))[:20]:
                a=max(0,m.start()-600); b=min(len(text),m.end()+1200)
                print(text[a:b].replace('\n',' ')[:2000])
            if name=='page':
              print('\n-- INPUTS --')
              for m in re.finditer(r'<(?:input|meta)[^>]+>',text,re.I):
                s=m.group(0)
                if any(k in s.lower() for k in ('id=','name=','content=','value=')):
                  print(s[:1500])
          PY
