name: Create final Loongson brokerage deep-report package

on:
  push:
    paths:
      - '.github/workflows/package-loongson-brokerage-deep-reports-final-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Download, validate, and package three long reports
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests

          PACKAGE = '龙芯中科_688047_券商深度报告精选_3份'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / 'PDF文件'
          VERIFY_DIR = ROOT / '验证记录'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          VERIFY_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'info_code':'AP202511221785855983',
                  'broker':'东海证券',
                  'date':'2025-11-22',
                  'title':'公司深度报告：自主指令系统筑牢信创根基，高性价比优势拥抱开放市场',
                  'researcher':'方霁',
                  'rating':'买入（首次）',
                  'report_type':'公司深度报告',
                  'expected_pages':38,
              },
              {
                  'info_code':'AP202405171633699400',
                  'broker':'国信证券',
                  'date':'2024-05-17',
                  'title':'国产处理器领军企业，2023年收入及利润短期承压',
                  'researcher':'胡剑、胡慧、周靖翔、叶子',
                  'rating':'增持（首次）',
                  'report_type':'长篇公司研究报告',
                  'expected_pages':32,
              },
              {
                  'info_code':'AP202207081575981781',
                  'broker':'山西证券',
                  'date':'2022-07-08',
                  'title':'自主可控程度最高的国产CPU，新品放量在即，看好市占率提升',
                  'researcher':'叶中正、杨晶晶',
                  'rating':'增持（首次）',
                  'report_type':'长篇首次覆盖类公司研究报告',
                  'expected_pages':33,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text):
              return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',text)).strip('._ ')[:90]

          def download(info_code, page_url, target):
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              ]
              attempts=[]
              for url in urls:
                  for attempt in range(1,4):
                      try:
                          r=session.get(url,headers={
                              'User-Agent':session.headers['User-Agent'],
                              'Referer':page_url,
                              'Accept':'application/pdf,*/*;q=0.8',
                          },timeout=240,allow_redirects=True)
                          meta={'requested_url':url,'final_url':r.url,'status':r.status_code,
                                'content_type':r.headers.get('content-type'),'bytes':len(r.content),'attempt':attempt}
                          attempts.append(meta)
                          if r.status_code==200 and r.content.startswith(b'%PDF') and len(r.content)>100000:
                              target.write_bytes(r.content)
                              return r.url,attempts
                      except Exception as exc:
                          attempts.append({'requested_url':url,'attempt':attempt,'error':repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError('download failed: '+json.dumps(attempts,ensure_ascii=False))

          records=[]
          seen=set()
          for index,report in enumerate(reports,1):
              page_url=f'https://data.eastmoney.com/report/info/{report["info_code"]}.html'
              filename=f'{index:02d}_{report["broker"]}_{report["date"]}_{safe(report["title"])}.pdf'
              path=PDF_DIR/filename
              source_url,attempts=download(report['info_code'],page_url,path)
              data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in seen: raise RuntimeError('duplicate PDF '+filename)
              seen.add(sha)

              q=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],capture_output=True,text=True)
              if q.returncode!=0: raise RuntimeError('qpdf failed '+filename+'\n'+q.stderr[-2000:])
              info=subprocess.run(['pdfinfo',str(path)],capture_output=True,text=True)
              if info.returncode!=0: raise RuntimeError('pdfinfo failed '+filename)
              m=re.search(r'^Pages:\s+(\d+)',info.stdout,re.M)
              if not m: raise RuntimeError('page count unavailable '+filename)
              pages=int(m.group(1))
              if pages!=report['expected_pages']:
                  raise RuntimeError(f'page count mismatch {filename}: {pages} != {report["expected_pages"]}')

              txt=VERIFY_DIR/(report['info_code']+'_前10页.txt')
              t=subprocess.run(['pdftotext','-f','1','-l',str(min(10,pages)),'-layout',str(path),str(txt)],capture_output=True,text=True)
              if t.returncode!=0: raise RuntimeError('pdftotext failed '+filename+'\n'+t.stderr[-1000:])
              text=txt.read_text(encoding='utf-8',errors='replace')
              compact=re.sub(r'\s+','',text)
              if '龙芯中科' not in compact and '688047' not in compact:
                  raise RuntimeError('company identity check failed '+filename)
              tokens=[x for x in re.split(r'[：，、“”\s]+',report['title']) if len(x)>=4]
              if not any(re.sub(r'\s+','',token) in compact for token in tokens[:10]):
                  raise RuntimeError('title identity check failed '+filename)
              if report['broker'].replace('证券','') not in compact and report['broker'] not in compact:
                  raise RuntimeError('broker identity check failed '+filename)

              prefix=VERIFY_DIR/(report['info_code']+'_首页')
              render=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(path),str(prefix)],capture_output=True,text=True)
              png=Path(str(prefix)+'.png')
              if render.returncode!=0 or not png.exists() or png.stat().st_size<8000:
                  raise RuntimeError('first-page render failed '+filename)
              render_bytes=png.stat().st_size
              png.unlink()

              record={**report,
                  'filename':'PDF文件/'+filename,
                  'public_page':page_url,
                  'source_pdf_url':source_url,
                  'pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'first_page_render_bytes':render_bytes,
                  'download_attempts':attempts,
              }
              records.append(record)
              print('VALIDATED',json.dumps(record,ensure_ascii=False),flush=True)

          readme=[
              '龙芯中科（688047.SH）券商深度报告精选3份',
              '整理日期：2026-10-15','',
              '本包收录3份可从公开渠道直接获取并完成核验的券商原始排版PDF。',
              '选择标准：优先公司深度、首次覆盖或篇幅较长的公司研究报告，并兼顾发布时间与机构多样性；未使用短篇业绩点评或网页打印版补足数量。','',
              '文件清单：'
          ]
          for i,r in enumerate(records,1):
              readme += [
                  f'{i}. {r["broker"]}，{r["date"]}，{r["pages"]}页',
                  f'   标题：{r["title"]}',
                  f'   分析师：{r["researcher"]}',
                  f'   评级：{r["rating"]}',
                  f'   类型：{r["report_type"]}',
                  f'   文件：{r["filename"]}',
                  f'   公开研报页面：{r["public_page"]}',
                  f'   原始PDF来源：{r["source_pdf_url"]}',
                  f'   SHA-256：{r["sha256"]}',''
              ]
          (ROOT/'00_报告清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for f in sorted(ROOT.rglob('*')):
                  if f.is_file(): z.write(f,arcname=f'{PACKAGE}/{f.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3: raise RuntimeError(f'ZIP check failed bad={bad} pdfs={len(pdfs)}')
          print('FINAL_PACKAGE',json.dumps({'filename':zip_path.name,'bytes':zip_path.stat().st_size,
                'sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'pdf_count':3,
                'reports':[{k:r[k] for k in ('broker','date','title','pages','info_code')} for r in records]},ensure_ascii=False),flush=True)
          PY

      - name: Upload completed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: loongson-688047-brokerage-deep-reports-final-20261015
          path: 龙芯中科_688047_券商深度报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0