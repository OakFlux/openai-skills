name: Inspect SGPJBG indexes for Henghe report ID

on:
  push:
    paths:
      - '.github/workflows/sgpjbg-henghe-link-discovery-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Inspect pages and sitemaps
        run: |
          python - <<'PY'
          import gzip, io, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Connection':'close',
          })
          urls=[
            'https://bg.sgpjbg.com/zhuanti/xinnengyuanjiegoujianbaogao.html',
            'https://bg.sgpjbg.com/zhuanti/jingmizhizaochanyebaogao.html',
            'https://bg.sgpjbg.com/zhuanti/henghejingmibaogao.html',
            'https://www.sgpjbg.com/zhuanti/xinnengyuanjiegoujianbaogao.html',
            'https://bg.sgpjbg.com/bgdown/643723.html',
            'https://bg.sgpjbg.com/sitemap.xml',
            'https://bg.sgpjbg.com/sitemap_index.xml',
            'https://www.sgpjbg.com/sitemap.xml',
            'https://www.sgpjbg.com/sitemap_index.xml',
            'https://bg.sgpjbg.com/robots.txt',
            'https://www.sgpjbg.com/robots.txt',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nURL',url,'STATUS',r.status_code,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),'FINAL',r.url)
              print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False))
              if r.status_code!=200: continue
              data=r.content
              if data[:2]==b'\x1f\x8b': data=gzip.GzipFile(fileobj=io.BytesIO(data)).read()
              text=data.decode(r.apparent_encoding or 'utf-8',errors='replace')
              if 'xml' in str(r.headers.get('content-type','')).lower() or url.endswith('.xml'):
                for m in re.finditer(r'<loc>(.*?)</loc>',text,re.I|re.S):
                  loc=m.group(1).strip()
                  if any(k in loc for k in ('300539','henghe','bgdown','sitemap')): print('XML_LOC',loc)
                print('XML_HEAD',text[:5000])
                continue
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if any(k in label for k in ('横河精密','优质精密制造企业','新能源汽车结构件','下载PDF','立即下载')) or 'bgdown' in href:
                  print('LINK',json.dumps({'label':label[:500],'href':href},ensure_ascii=False))
              for tag in soup.find_all(['script','iframe','embed','object','form','input','button']):
                attrs={k:tag.get(k) for k in ('src','href','action','data','value','name','id','class','type') if tag.get(k) is not None}
                raw=(tag.get_text(' ',strip=True)+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in raw for k in ('download','pdf','search','bgdown','api','file','docid')):
                  for k in ('src','href','action','data'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('TAG',tag.name,json.dumps(attrs,ensure_ascii=False)[:2000])
              for pat in [r'https?://[^\"\'<>\s]+',r'/bgdown/\d+\.html',r'(?:docid|id|reportid|aid|bid)\s*[:=]\s*[\"\']?(\d+)',r'(?:download|pdf|file|url)[A-Za-z_]*\s*[:=]\s*[\"\']([^\"\']+)[\"\']']:
                vals=[]
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if any(k in v.lower() for k in ('bgdown','pdf','download','api','file','300539','henghe')) or (v.isdigit() and len(v)>=5): vals.append(v)
                for v in list(dict.fromkeys(vals))[:200]: print('REGEX',v[:2000])
            except Exception as e:
              print('ERROR',url,repr(e))
          PY
