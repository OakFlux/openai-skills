name: Inspect Air China Cargo broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/air-china-cargo-report-inspect-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Query Eastmoney report API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time
          import requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/plain,*/*',
          })
          url = 'https://reportapi.eastmoney.com/report/list'
          variants = [
              {'code':'001391'},
              {'codes':'001391'},
              {'stockCode':'001391'},
          ]
          for idx, extra in enumerate(variants, 1):
              params = {
                  'cb': f'datatable{idx}123456',
                  'industryCode': '*',
                  'pageSize': '100',
                  'industry': '*',
                  'rating': '*',
                  'ratingChange': '*',
                  'beginTime': '2023-01-01',
                  'endTime': '2026-09-27',
                  'pageNo': '1',
                  'fields': '',
                  'qType': '0',
                  'orgCode': '',
                  'rcode': '',
                  '_': str(int(time.time()*1000)),
              }
              params.update(extra)
              r = s.get(url, params=params, timeout=(20,90))
              print('\n=== VARIANT', idx, extra, '===', flush=True)
              print('STATUS', r.status_code, 'URL', r.url, 'LEN', len(r.content), 'CTYPE', r.headers.get('content-type'), flush=True)
              print('HEAD', r.text[:500], flush=True)
              r.raise_for_status()
              text = r.text.strip()
              m = re.match(r'^[^(]+\((.*)\)\s*;?$', text, re.S)
              payload = json.loads(m.group(1) if m else text)
              print('HITS', payload.get('hits'), 'SIZE', payload.get('size'), 'TOTALPAGE', payload.get('TotalPage'), flush=True)
              data = payload.get('data') or []
              for rec in data:
                  if rec.get('stockCode') == '001391' or rec.get('stockName') == '国货航' or '国货航' in str(rec):
                      print('MATCH', json.dumps(rec, ensure_ascii=False, sort_keys=True), flush=True)
          PY
