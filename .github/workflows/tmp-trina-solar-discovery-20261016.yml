name: Discover Trina Solar filings

on:
  push:
    branches: [tmp-trina-solar-688599-reports-20261016]
    paths: ['.github/workflows/tmp-trina-solar-discovery-20261016.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect filing index pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          pages={
            'annual':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/688599/page_type/ndbg.phtml',
            'quarter':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/688599/page_type/yjdbg.phtml',
            'prospectus':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/688599/page_type/zgsms.phtml',
            'all':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletin.php?stockid=688599',
          }
          pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          for name,url in pages.items():
            print('\n===== '+name+' '+url+' =====')
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            try:
              raw=urllib.request.urlopen(req,timeout=120).read()
            except Exception as e:
              print('ERROR',repr(e)); continue
            for enc in ('utf-8','gb18030','gbk'):
              try:
                text=raw.decode(enc); break
              except UnicodeDecodeError: pass
            else: text=raw.decode('utf-8',errors='replace')
            print('BYTES',len(raw))
            count=0
            for m in pat.finditer(text):
              label=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
              label=re.sub(r'\s+','',label)
              href=urllib.parse.urljoin(url,html.unescape(m.group(1)))
              if any(k in label for k in ('年度报告','季度报告','一季度报告','三季度报告','招股说明书','上市公告书','下载公告')):
                print(label,'\t',href)
                count+=1
            print('MATCHES',count)
          PY
