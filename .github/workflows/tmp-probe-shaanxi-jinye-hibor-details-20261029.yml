name: Probe Shaanxi Jinye Hibor detail pages

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect detail pages and candidate downloads
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse, parse_qs

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=['http://www.hibor.com.cn/docdetail_137827.html','http://www.hibor.com.cn/docdetail_505559.html','https://www.hibor.com.cn/docdetail_137827.html','https://www.hibor.com.cn/docdetail_505559.html']
          for u in urls:
            try:
              r=s.get(u,timeout=(15,60),allow_redirects=True)
              print('\nPAGE',u,'=>',r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.history)
              enc=r.apparent_encoding or r.encoding or 'utf-8'; r.encoding=enc
              text=html.unescape(r.text).replace('\\/','/')
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title,'ENC',enc)
              for form in soup.find_all('form'):
                print('FORM',form.get('method'),urljoin(r.url,form.get('action') or ''),[(x.get('name'),x.get('value')) for x in form.find_all(['input','button'])])
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a.get('href'))
                txt=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                if any(k in (txt+href).lower() for k in ['pdf','download','down','附件','下载','报告','docfile','fileid','docid']):
                  print('LINK',repr(txt[:300]),href)
              for sc in soup.find_all('script'):
                src=sc.get('src')
                if src: print('SCRIPT_SRC',urljoin(r.url,src))
                body=sc.get_text('\n',strip=True)
                if any(k in body.lower() for k in ['download','docid','fileid','pdf','downfile']): print('SCRIPT_BODY',body[:8000])
              patterns=[
                r'https?://[^\s\"\'<>]+',
                r'[^\s\"\'<>]+\.(?:pdf|rar|zip|doc|docx)(?:\?[^\s\"\'<>]*)?',
                r'(?:download|down|file)[^\s\"\'<>]{0,300}',
              ]
              for pat in patterns:
                for m in re.findall(pat,text,flags=re.I):
                  val=m if isinstance(m,str) else ''.join(m)
                  if any(k in val.lower() for k in ['pdf','download','down','docid','fileid','137827','505559']): print('RAW',val[:1500])
            except Exception as e: print('ERROR',u,repr(e))

          # Probe common historical download endpoints conservatively, without credentials.
          candidates=[]
          ids=['137827','505559']
          templates=[
            'https://www.hibor.com.cn/Download.aspx?id={id}',
            'https://www.hibor.com.cn/download.aspx?id={id}',
            'https://www.hibor.com.cn/DownloadFile.aspx?id={id}',
            'https://www.hibor.com.cn/downfile.aspx?id={id}',
            'https://www.hibor.com.cn/docdownload_{id}.html',
            'http://www.hibor.com.cn/Download.aspx?id={id}',
            'http://www.hibor.com.cn/download.aspx?id={id}',
          ]
          for i in ids:
            for t in templates: candidates.append(t.format(id=i))
          for u in candidates:
            try:
              r=s.get(u,timeout=(10,40),allow_redirects=True,headers={'Referer':f'https://www.hibor.com.cn/docdetail_{u.split("=")[-1].split(".")[0]}.html'})
              sig=r.content[:8]
              print('PROBE',u,'=>',r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.headers.get('content-disposition'),sig)
            except Exception as e: print('PROBE_ERROR',u,repr(e))
          PY
