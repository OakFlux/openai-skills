name: Probe Qingsong Health fxbaogao viewer assets 20260919

on:
  push:
    paths:
      - '.github/workflows/qingsong-health-fxbaogao-view-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Probe viewer and assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://www.fxbaogao.com/'})
          for rid,date in [('5188870','2025/12/15'),('5319486','2026/03/23')]:
            print('\n====== RID',rid,'======',flush=True)
            for url in [f'https://www.fxbaogao.com/view?id={rid}',f'https://www.fxbaogao.com/detail/{rid}']:
              try:
                r=s.get(url,timeout=(10,30),allow_redirects=True)
                print('PAGE',url,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
                text=r.text
                soup=BeautifulSoup(text,'html.parser')
                for tag in soup.find_all(['script','link','img','iframe','embed','object','a']):
                  for attr in ('src','href','data','data-src','data-url','content'):
                    v=tag.get(attr)
                    if not v: continue
                    full=urljoin(r.url,v)
                    hay=full.lower()
                    if any(k in hay for k in ('report-image','pdf','viewer','view','detail','api','download','.js')):
                      print('ASSET',tag.name,attr,full,flush=True)
                for line in text.splitlines():
                  low=line.lower()
                  if any(k in low for k in ('report-image','pagecount','page_count','totalpage','total_page','pdfurl','pdf_url','downloadurl','download_url','reportid','report_id','5188870','5319486')):
                    print('LINE',line[:3000],flush=True)
                print('TEXTHEAD',text[:6000].replace('\n',' '),flush=True)
              except Exception as e: print('PAGEERR',url,repr(e),flush=True)

            print('--- sequential image probes ---',flush=True)
            for ext in ['png','jpg','jpeg','webp']:
              statuses=[]
              for i in range(1,31):
                u=f'https://public.fxbaogao.com/report-image/{date}/{rid}-{i}.{ext}'
                try:
                  r=s.get(u,timeout=(5,12),stream=True,allow_redirects=True)
                  head=next(r.iter_content(32),b'')
                  ok=r.status_code==200 and (head.startswith(b'\x89PNG') or head.startswith(b'\xff\xd8') or head.startswith(b'RIFF'))
                  if ok:
                    statuses.append((i,r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),head[:12]))
                  elif i<=3:
                    print('IMGFAIL',ext,i,r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),head[:30],flush=True)
                except Exception as e:
                  if i<=3: print('IMGERR',ext,i,repr(e),flush=True)
              if statuses: print('IMAGES',ext,statuses,flush=True)

          # Inspect likely JS bundles from detail page
          r=s.get('https://www.fxbaogao.com/detail/5188870',timeout=(10,30))
          soup=BeautifulSoup(r.text,'html.parser')
          for tag in soup.find_all('script',src=True):
            u=urljoin(r.url,tag['src'])
            try:
              x=s.get(u,timeout=(10,30))
              if x.status_code!=200: continue
              tx=x.text
              hits=[]
              for key in ['report-image','/view','download','pdfUrl','pageCount','totalPage','reportId']:
                if key.lower() in tx.lower(): hits.append(key)
              if hits:
                print('JSBUNDLE',u,'LEN',len(x.content),'HITS',hits,flush=True)
                for m in re.finditer(r'.{0,400}(?:report-image|pdfUrl|pageCount|totalPage|download).{0,600}',tx,re.I|re.S):
                  print('JSCTX',m.group(0)[:1600].replace('\n',' '),flush=True)
            except Exception as e: print('JSERR',u,repr(e),flush=True)
          PY
