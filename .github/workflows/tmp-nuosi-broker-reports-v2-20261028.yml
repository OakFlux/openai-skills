name: Build Nuosi 301333 broker reports v2

on:
  push:
    branches:
      - tmp-nuosi-broker-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          PKG='诺思格_301333_券商深度报告_3份'
          mkdir -p "$PKG" /tmp/render_nuosi_broker
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, time
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out=Path('诺思格_301333_券商深度报告_3份')
          s=requests.Session(); s.trust_env=False
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=8,connect=8,read=8,status=8,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'})
          docs=[
            dict(order=1,broker='东吴证券',date='2023-05-10',title='新药研发不缺biotech，但缺优质临床CRO',file='01_东吴证券_新药研发不缺biotech但缺优质临床CRO_2023-05-10.pdf',min_pages=15,info='https://data.eastmoney.com/report/info/AP202305101586449244.html',urls=['https://pdf.dfcfw.com/pdf/H301_AP202305101586449244_1.pdf','https://pdf.dfcfw.com/pdf/H3_AP202305101586449244_1.pdf']),
            dict(order=2,broker='开源证券',date='2023-05-31',title='深耕临床CRO业务，全方位服务药物临床开发',file='02_开源证券_深耕临床CRO业务全方位服务药物临床开发_2023-05-31.pdf',min_pages=20,info='https://data.eastmoney.com/report/info/AP202306011587450211.html',urls=['https://pdf.dfcfw.com/pdf/H301_AP202306011587450211_1.pdf','https://pdf.dfcfw.com/pdf/H3_AP202306011587450211_1.pdf']),
            dict(order=3,broker='太平洋证券',date='2024-08-02',title='聚焦临床CRO领域，一站式赋能临床研发',file='03_太平洋证券_聚焦临床CRO领域一站式赋能临床研发_2024-08-02.pdf',min_pages=20,info='https://data.eastmoney.com/report/info/AP202408051639136485.html',urls=['https://pdf.dfcfw.com/pdf/H3_AP202408051639136485_1.pdf','https://pdf.dfcfw.com/pdf/H301_AP202408051639136485_1.pdf']),
          ]
          records=[]
          for d in docs:
              last=None; r=None
              for attempt in range(8):
                  for url in d['urls']:
                      try:
                          x=s.get(url,headers={'Referer':d['info']},timeout=(30,360),allow_redirects=True)
                          if x.status_code==200 and x.content.startswith(b'%PDF-') and len(x.content)>150000:
                              r=x; break
                          last=RuntimeError(f'HTTP={x.status_code}, bytes={len(x.content)}')
                      except Exception as e: last=e
                  if r is not None: break
                  time.sleep(min(2+attempt,10))
              if r is None: raise RuntimeError(f"download failed {d['title']}: {last!r}")
              p=out/d['file']; p.write_bytes(r.content)
              reader=PdfReader(str(p),strict=False); pages=len(reader.pages)
              if pages<d['min_pages']: raise RuntimeError(f'{p.name}: {pages} pages')
              text=''
              idxs=list(range(min(10,pages)))+[pages-1]
              for i in dict.fromkeys(idxs):
                  try: text+='\n'+(reader.pages[i].extract_text() or '')
                  except Exception: pass
              compact=''.join(text.split())
              if '诺思格' not in compact: raise RuntimeError(f'{p.name}: company mismatch')
              broker_key=d['broker'].replace('证券','')
              if broker_key not in compact: raise RuntimeError(f'{p.name}: broker mismatch')
              sha=hashlib.sha256(r.content).hexdigest()
              records.append({**d,'pages':pages,'bytes':len(r.content),'source':r.url,'sha256':sha})
              print('DOWNLOADED',p.name,'pages=',pages,'bytes=',len(r.content),'sha256=',sha)
          lines=['诺思格（301333）券商深度报告资料包','整理日期：2026-10-28','','三份文件均为公开渠道直接下载的券商原始完整PDF。','']
          sums=[]; total_pages=0; total_bytes=0
          for x in records:
              total_pages+=x['pages']; total_bytes+=x['bytes']
              lines += [f"{x['order']}. {x['broker']}｜{x['title']}",f"   日期：{x['date']}；页数：{x['pages']}页",f"   文件：{x['file']}",f"   原始PDF：{x['source']}",f"   索引：{x['info']}",f"   SHA-256：{x['sha256']}",'']
              sums.append(f"{x['sha256']}  {x['file']}")
          lines += [f'合计：3份PDF，{total_pages}页，{total_bytes}字节。','资料仅供研究参考，不构成投资建议。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PKG" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PKG"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e; qpdf --check "$pdf" >"$pdf.qpdf" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf"; exit "$rc"; fi
            rm -f "$pdf.qpdf"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 15
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '诺思格' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/render_nuosi_broker/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PKG/_metadata.json"
          zip -q -r -6 /tmp/nuosi_broker_v2_test.zip "$PKG"
          unzip -t /tmp/nuosi_broker_v2_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/nuosi_broker_v2_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f /tmp/nuosi_broker_v2_test.zip
          ls -lh "$PKG"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Nuosi-301333-broker-deep-reports-3-v2
          path: 诺思格_301333_券商深度报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
