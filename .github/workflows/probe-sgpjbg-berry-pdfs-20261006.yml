name: Probe SGPJBG Berry PDF files

on:
  pull_request:
    paths:
      - 'tasks/probe-sgpjbg-berry-pdfs-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe report pages and source-file candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 pypdf
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          ids=['887730','20299','4277']
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/'})
          result={}
          for bid in ids:
            page=f'https://www.sgpjbg.com/baogao/{bid}.html'
            r=s.get(page,timeout=(25,120));print('PAGE',bid,r.status_code,len(r.content),r.url,flush=True);r.raise_for_status()
            Path(f'output/{bid}.html').write_bytes(r.content)
            soup=BeautifulSoup(r.text,'html.parser')
            title=(soup.find('h1').get_text(' ',strip=True) if soup.find('h1') else soup.title.get_text(' ',strip=True) if soup.title else '')
            form_text=' '.join((soup.find('form').get_text(' ',strip=True) if soup.find('form') else '').split())[:1500]
            dp=soup.find('input',id='dp')
            dpval=dp.get('value') if dp else None
            candidates=[]
            if dpval:
              for suffix in ('','.pdf','.PDF','/index.pdf','_1.pdf'):
                candidates.append(dpval+suffix)
            # Also collect likely source paths embedded in HTML.
            for u in re.findall(r'https?://[^\s"\'<>]+',r.text):
              if 'file.sgpjbg.com' in u and any(x in u.lower() for x in ('fileroot','.pdf')):
                candidates.append(u.rstrip(');,\"\''))
            seen=[];probes=[]
            for u in candidates:
              if u in seen: continue
              seen.append(u)
              try:
                rr=s.get(u,headers={'Referer':page,'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},timeout=(20,120),allow_redirects=True)
                head=rr.content[:20]
                rec={'url':u,'status':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type'),'length':len(rr.content),'head':repr(head)}
                if rr.status_code==200 and rr.content.startswith(b'%PDF') and len(rr.content)>70000:
                  p=Path(f'output/{bid}_{len(probes)}.pdf');p.write_bytes(rr.content)
                  try: rec['pages']=len(PdfReader(str(p),strict=False).pages)
                  except Exception as e: rec['pdf_error']=repr(e)
                probes.append(rec)
                print('PROBE',bid,json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e:
                rec={'url':u,'error':repr(e)};probes.append(rec);print('PROBE_ERROR',bid,json.dumps(rec,ensure_ascii=False),flush=True)
            result[bid]={'page':page,'title':title,'form_text':form_text,'dp':dpval,'probes':probes}
            print('META',bid,json.dumps(result[bid],ensure_ascii=False)[:30000],flush=True)
          Path('output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sgpjbg-berry-pdf-probe
          path: output/
          retention-days: 7
          if-no-files-found: error
