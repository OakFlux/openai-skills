name: Discover sewing equipment peer broker reports for ST Biaozhun 20261020

on:
  push:
    paths:
      - '.github/workflows/st-biaozhun-600302-peer-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Query peer report metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery_out
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          companies=[
              ('603337', {'杰克股份','杰克科技'}),
              ('600843', {'上工申贝'}),
              ('603025', {'大豪科技'}),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9'})
          url='https://reportapi.eastmoney.com/report/list'
          all_out={}; lines=[]
          for code,names in companies:
              rows_all=[]; seen=set()
              for page in range(1,21):
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2026-10-20','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  obj=None; last=None
                  for attempt in range(1,7):
                      try:
                          r=s.get(url,params=params,timeout=(20,120)); last={'status':r.status_code,'bytes':len(r.content),'head':r.text[:120]}
                          if r.status_code==200:
                              t=r.text.strip()
                              if t.startswith('{'): obj=json.loads(t)
                              else:
                                  a=t.find('('); b=t.rfind(')')
                                  if a>=0 and b>a: obj=json.loads(t[a+1:b])
                              if obj is not None: break
                      except Exception as e: last={'error':repr(e)}
                      time.sleep(attempt)
                  if obj is None: raise RuntimeError(f'{code} page {page} failed {last}')
                  rows=obj.get('data') or []
                  if isinstance(rows,dict): rows=rows.get('list') or rows.get('data') or []
                  if not rows: break
                  for row in rows:
                      ic=str(row.get('infoCode') or '')
                      key=ic or json.dumps(row,ensure_ascii=False,sort_keys=True)
                      if key in seen: continue
                      seen.add(key)
                      stock_code=str(row.get('stockCode') or '')
                      stock_name=str(row.get('stockName') or '')
                      if stock_code==code or stock_name in names:
                          rows_all.append(row)
                  if len(rows)<100: break
                  time.sleep(0.2)
              rows_all.sort(key=lambda r:(int(r.get('attachPages') or 0),str(r.get('publishDate') or '')),reverse=True)
              all_out[code]=rows_all
              lines.append(f'### {code} TOTAL={len(rows_all)}')
              for r in rows_all:
                  lines.append('\t'.join([str(r.get('publishDate') or '')[:10],str(r.get('attachPages') or ''),str(r.get('orgSName') or ''),str(r.get('stockName') or ''),str(r.get('title') or ''),str(r.get('infoCode') or ''),str(r.get('emRatingName') or '')]))
          Path('discovery_out/peer_report_metadata.json').write_text(json.dumps(all_out,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery_out/peer_report_index.tsv').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:300]))
          PY
      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: st-biaozhun-600302-peer-broker-discovery-20261020
          path: discovery_out/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
