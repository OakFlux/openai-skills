name: Build Quanyangquan 600189 broker deep reports 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quanyangquan-600189-broker-deep-reports-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import math
          import re
          import subprocess
          import time
          import zipfile
          from datetime import datetime
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '600189'
          SHORT = '泉阳泉'
          FULL = '吉林泉阳泉股份有限公司'
          PACKAGE = '泉阳泉_600189_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for directory in (ROOT, PDFDIR, PREV):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          session.headers.update({
              'User-Agent': ua,
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:110]

          def parse_json_or_jsonp(text: str) -> dict:
              text = text.strip().lstrip('\ufeff')
              if text.startswith('{'):
                  return json.loads(text)
              match = re.search(r'^[^(]+\((.*)\)\s*;?\s*$', text, re.S)
              if not match:
                  raise ValueError(f'Unexpected API payload prefix: {text[:160]!r}')
              return json.loads(match.group(1))

          # Eastmoney public stock research-report API.
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          all_rows = []
          for page_no in range(1, 6):
              params = {
                  'industryCode': '*',
                  'pageSize': '100',
                  'industry': '*',
                  'rating': '*',
                  'ratingChange': '*',
                  'beginTime': '2017-01-01',
                  'endTime': '2026-11-04',
                  'pageNo': str(page_no),
                  'fields': '',
                  'qType': '0',
                  'orgCode': '',
                  'rcode': '',
                  'code': CODE,
                  'cb': f'datatable600189{page_no}',
                  '_': str(int(time.time() * 1000)),
              }
              response = session.get(endpoint, params=params, timeout=(30, 180))
              print('REPORT_API', page_no, response.status_code, len(response.content), response.url)
              response.raise_for_status()
              payload = parse_json_or_jsonp(response.text)
              rows = payload.get('data') or []
              all_rows.extend(rows)
              hits = int(payload.get('hits') or len(all_rows))
              if not rows or len(all_rows) >= hits or len(rows) < 100:
                  break

          if not all_rows:
              raise RuntimeError('Eastmoney report API returned no records for 600189')

          api_snapshot = []
          for row in all_rows:
              api_snapshot.append({
                  'title': row.get('title'),
                  'broker': row.get('orgSName') or row.get('orgName'),
                  'publishDate': row.get('publishDate'),
                  'infoCode': row.get('infoCode') or row.get('infocode'),
                  'authors': row.get('researcher') or row.get('author'),
                  'rating': row.get('emRatingName') or row.get('ratingName'),
              })
          (ROOT / 'report_api_results.json').write_text(
              json.dumps(api_snapshot, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('REPORT_API_COUNT', len(api_snapshot))
          print('REPORT_API_TITLES', json.dumps(api_snapshot[:60], ensure_ascii=False))

          targets = [
              {
                  'key': 'dongwu_20260625',
                  'title_fragments': ['白山松水有活泉'],
                  'broker_fragments': ['东吴证券'],
                  'classification': '公司深度研究',
                  'min_pages': 25,
              },
              {
                  'key': 'changjiang_20260223',
                  'title_fragments': ['长白之泉如沐春阳'],
                  'broker_fragments': ['长江证券'],
                  'classification': '公司深度报告／首次覆盖',
                  'min_pages': 15,
              },
              {
                  'key': 'zhongtai_20260112',
                  'title_fragments': [
                      '中国矿泉水第一股全国化带来放量空间',
                      '如何看待公司中长期成长空间',
                  ],
                  'broker_fragments': ['中泰证券'],
                  'classification': '公司专题研究',
                  'min_pages': 8,
              },
          ]

          def row_date(row: dict) -> datetime:
              value = str(row.get('publishDate') or '')[:10]
              try:
                  return datetime.strptime(value, '%Y-%m-%d')
              except Exception:
                  return datetime(1900, 1, 1)

          selected_rows = []
          used_codes = set()
          for target in targets:
              matches = []
              for row in all_rows:
                  title = normalize(str(row.get('title') or ''))
                  broker = normalize(str(row.get('orgSName') or row.get('orgName') or ''))
                  info_code = str(row.get('infoCode') or row.get('infocode') or '').strip()
                  if not info_code:
                      continue
                  title_ok = any(normalize(fragment) in title for fragment in target['title_fragments'])
                  broker_ok = any(normalize(fragment) in broker for fragment in target['broker_fragments'])
                  if title_ok and broker_ok:
                      matches.append(row)
              matches.sort(key=row_date, reverse=True)
              if not matches:
                  raise RuntimeError(f'Could not find target report in API: {target}')
              chosen = next(
                  (row for row in matches if str(row.get('infoCode') or row.get('infocode')) not in used_codes),
                  None,
              )
              if chosen is None:
                  raise RuntimeError(f'All API matches were duplicates: {target}')
              info_code = str(chosen.get('infoCode') or chosen.get('infocode'))
              used_codes.add(info_code)
              selected_rows.append((target, chosen))
              print('SELECTED_META', target['key'], json.dumps({
                  'title': chosen.get('title'),
                  'broker': chosen.get('orgSName') or chosen.get('orgName'),
                  'publishDate': chosen.get('publishDate'),
                  'infoCode': info_code,
              }, ensure_ascii=False))

          identities = (SHORT, FULL, CODE, '吉林泉阳泉股份', '吉林森工')
          manifest = []

          for index, (target, row) in enumerate(selected_rows, 1):
              title = str(row.get('title') or '').strip()
              broker = str(row.get('orgSName') or row.get('orgName') or '').strip()
              date = str(row.get('publishDate') or '')[:10]
              authors = str(row.get('researcher') or row.get('author') or '').strip()
              rating = str(row.get('emRatingName') or row.get('ratingName') or '').strip()
              info_code = str(row.get('infoCode') or row.get('infocode')).strip()
              source_page = f'https://data.eastmoney.com/report/info/{info_code}.html'
              pdf_urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf?download=1',
              ]

              data = None
              source_url = ''
              attempts = []
              for pdf_url in pdf_urls:
                  for attempt in range(5):
                      try:
                          response = session.get(
                              pdf_url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': pdf_url,
                              'attempt': attempt + 1,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          })
                          if (
                              response.status_code == 200
                              and response.content[:5] == b'%PDF-'
                              and len(response.content) > 80000
                          ):
                              data = response.content
                              source_url = pdf_url
                              break
                          if response.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({
                              'url': pdf_url,
                              'attempt': attempt + 1,
                              'error': repr(exc),
                          })
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f'PDF download failed for {title}: {attempts}')

              filename = f'{index:02d}_{safe(broker)}_泉阳泉_{safe(title)}_{date}.pdf'
              destination = PDFDIR / filename
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < target['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              extracted = ''
              for page in reader.pages[:min(60, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(extracted)
              identity_hits = [identity for identity in identities if normalize(identity) in compact]
              broker_hits = [fragment for fragment in target['broker_fragments'] if normalize(fragment) in compact]
              title_hits = [fragment for fragment in target['title_fragments'] if normalize(fragment) in compact]
              # The API metadata is the primary identity source. Extracted text provides an independent check where encoding permits.
              if len(compact) > 1200 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch in {filename}')
              if len(compact) > 1200 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch in {filename}')
              if len(compact) > 1200 and not title_hits:
                  raise RuntimeError(f'Title mismatch in {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREV / destination.stem
              subprocess.run(
                  [
                      'pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125',
                      '-singlefile', str(destination), str(preview_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'First-page preview failed for {filename}')

              sha256 = hashlib.sha256(data).hexdigest()
              record = {
                  'broker': broker,
                  'date': date,
                  'title': title,
                  'classification': target['classification'],
                  'authors': authors,
                  'rating': rating,
                  'infoCode': info_code,
                  'source_page': source_page,
                  'source_url': source_url,
                  'candidate_urls': pdf_urls,
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha256,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hits': title_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'Eastmoney report metadata', 'issuer identity where extractable',
                      'broker/title where extractable', 'page count', 'qpdf structure',
                      'first-page render',
                  ],
              }
              manifest.append(record)
              print('VERIFIED', broker, title, pages, len(data), sha256, source_url)

          total_pages = sum(item['actual_pages'] for item in manifest)
          readme = [
              '吉林泉阳泉股份有限公司（600189.SH）券商深度研究报告资料包',
              '整理日期：2026-11-04', '',
              '本包收录3份公开可直接取得并完成完整性核验的券商原始PDF。',
              '筛选口径：公司深度、首次覆盖或围绕公司中长期成长空间的系统性研究；不使用普通财报点评、行业周报或网页摘要。', '',
          ]
          for position, item in enumerate(manifest, 1):
              readme += [
                  f'{position}. {item["broker"]}：《{item["title"]}》',
                  f'   类型：{item["classification"]}；日期：{item["date"]}',
                  f'   分析师：{item["authors"] or "原PDF详见首页"}；评级：{item["rating"] or "原PDF详见首页"}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_page"]}',
                  f'   PDF来源：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、研报元数据、公司/证券代码、券商与标题文本、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(
              chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True
          ) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')

          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad_member = archive.testzip()
              pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_member or len(pdf_members) != len(manifest):
                  raise RuntimeError(
                      f'ZIP validation failed: bad={bad_member}, pdf_count={len(pdf_members)}, manifest={len(manifest)}'
                  )

          english_zip = Path('quanyangquan_600189_broker_deep_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          final_sha = hashlib.sha256(chinese_zip.read_bytes()).hexdigest()
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', final_sha)
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: quanyangquan-600189-broker-deep-reports-final
          path: |
            泉阳泉_600189_券商深度报告_3份.zip
            quanyangquan_600189_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
