name: chatgpt-temp-dazhong-jg-exact-scan
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-jg-exact-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan narrow date windows for exact report records
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json,re,time
          from pathlib import Path
          import requests
          W=Path('dazhong_jg_exact');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          targets=[
            {'key':'2023_ne','begin':'2023-07-10','end':'2023-07-21','terms':['创投增厚利润','业绩大幅扭亏','大众公用']},
            {'key':'2022_dec_ne','begin':'2022-12-20','end':'2023-01-05','terms':['四大板块多元发展','城燃事业乘势增长','大众公用']},
            {'key':'2022_apr_ne','begin':'2022-04-08','end':'2022-04-22','terms':['公用事业平稳发展','金融创投多领域布局','大众公用']},
            {'key':'2018_cmbi','begin':'2018-04-05','end':'2018-04-20','terms':['积极寻找投资机遇','大众公用']},
            {'key':'2017_anxin','begin':'2017-04-24','end':'2017-05-12','terms':['华璨基金迈出第一步','优质标的展现实力','大众公用']},
            {'key':'2017_xy','begin':'2017-08-23','end':'2017-09-08','terms':['投资收益减少','净利润大幅下滑','大众公用']},
            {'key':'2016_anxin','begin':'2016-11-25','end':'2016-12-15','terms':['公用事业全面布局','金融创投硕果累累','大众公用']},
          ]
          logs=[];matches=[];stats=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          def parse(t):
            try:return json.loads(t)
            except:
              a=t.find('{');b=t.rfind('}')
              try:return json.loads(t[a:b+1]) if a>=0 and b>a else {}
              except:return {}
          def norm(x):return re.sub(r'[\s:：,，。()（）“”"\-—_]+','',str(x or '')).lower()
          for target in targets:
            found=[]
            for endpoint in ['jg','list']:
              for q in range(0,7):
                page=1
                while page<=300:
                  p={'cb':'showData','pageSize':100,'pageNo':page,'qType':q,'beginTime':target['begin'],'endTime':target['end'],'industryCode':'*','industry':'*','rating':'*','ratingchange':'*','ratingChange':'*','fields':'','orgCode':'','rcode':'','_':int(time.time()*1000)}
                  try:
                    r=s.get(f'https://reportapi.eastmoney.com/report/{endpoint}',params=p,timeout=60)
                    o=parse(r.text);rows=o.get('data') or []
                    if isinstance(rows,dict):rows=rows.get('data') or rows.get('list') or []
                    if not isinstance(rows,list):rows=[]
                    total=int(o.get('TotalPage') or 0)
                    if page==1:L(f"START {target['key']} {endpoint} q={q} rows={len(rows)} total={total} hits={o.get('hits')}")
                    for rec in rows:
                      txt=json.dumps(rec,ensure_ascii=False)
                      ntxt=norm(txt)
                      term_hits=sum(1 for t in target['terms'] if norm(t) in ntxt)
                      # exact report-title phrases are enough; company may be absent in generic index object
                      if term_hits>=max(1,len(target['terms'])-1):
                        hit={'target':target,'endpoint':endpoint,'qtype':q,'page':page,'term_hits':term_hits,'record':rec}
                        found.append(hit);matches.append(hit);L('MATCH '+json.dumps(hit,ensure_ascii=False))
                    if not rows or page>=total:break
                    page+=1
                    time.sleep(.02)
                  except Exception as e:
                    L(f"ERROR {target['key']} {endpoint} q={q} p={page} {e!r}");break
            stats.append({'target':target,'match_count':len(found)})
            L('TARGET_DONE '+target['key']+' matches='+str(len(found)))
          W.joinpath('matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          W.joinpath('stats.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
          W.joinpath('run.log').write_text('\n'.join(logs),encoding='utf-8')
          print('FINAL '+json.dumps({'matches':len(matches),'stats':stats},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Exact-Eastmoney-Index-Matches
          path: dazhong_jg_exact
          retention-days: 1
          compression-level: 6
