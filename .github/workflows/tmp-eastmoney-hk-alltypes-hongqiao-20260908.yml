name: Scan Eastmoney all report types for China Hongqiao
on:
  push:
    branches:
      - tmp-eastmoney-hk-alltypes-hongqiao-20260908
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests pypdf
      - name: Scan report APIs and validate PDFs
        run: |
          set -euo pipefail
          mkdir -p output/pdfs output/raw
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,re,time
          from datetime import date,timedelta
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          endpoints=['https://reportapi.eastmoney.com/report/list','https://reportapi.eastmoney.com/report/dg','https://reportapi.eastmoney.com/report/jg']
          anchors=['2024-01-22','2024-06-11','2024-06-13','2025-04-21','2025-05-27','2025-08-05','2026-04-25','2026-08-07']
          dates=[]
          for a in anchors:
            d=date.fromisoformat(a)
            dates.extend((d+timedelta(days=i)).isoformat() for i in range(-2,3))
          dates=sorted(set(dates))
          pat=re.compile(r'中国宏桥|中國宏橋|China\s+Hongqiao|01378|1378\.HK|产业升级顺势而为|全产业链铸就成本护城河|高景气.{0,5}一体化.{0,5}高分红|全球电解铝龙头|铝材料领军企业|成本企稳.{0,5}铝行业高景气',re.I)
          hits={};calls=[]
          def parse_json(r):
            try:return r.json()
            except:
              t=r.text.strip();m=re.search(r'^[^(]*\((.*)\)\s*;?$',t,re.S)
              return json.loads(m.group(1)) if m else {}
          for ep in endpoints:
            for day in dates:
              for qt in range(0,13):
                for page in range(1,6):
                  params={'cb':'','pageNo':page,'pageSize':500,'beginTime':day,'endTime':day,'qType':qt,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','author':'','code':'','rcode':'','fields':'','p':page,'pageNum':page,'pageNumber':page,'_':int(time.time()*1000)}
                  try:
                    r=s.get(ep,params=params,timeout=25);d=parse_json(r);rows=d.get('data') or d.get('result') or []
                    if isinstance(rows,dict):rows=rows.get('data') or rows.get('list') or []
                    if not isinstance(rows,list):rows=[]
                    total=int(d.get('TotalPage') or d.get('totalPage') or 1)
                    calls.append({'endpoint':ep.rsplit('/',1)[-1],'date':day,'qType':qt,'page':page,'status':r.status_code,'rows':len(rows),'total':total,'bytes':len(r.content)})
                    for row in rows:
                      blob=json.dumps(row,ensure_ascii=False)
                      if pat.search(blob):
                        info=str(row.get('infoCode') or row.get('infocode') or row.get('INFO_CODE') or '')
                        key=info or hashlib.sha256(blob.encode()).hexdigest()
                        hits[key]=row;print('HIT',ep,day,qt,json.dumps(row,ensure_ascii=False),flush=True)
                    if not rows or page>=total:break
                  except Exception as e:
                    calls.append({'endpoint':ep,'date':day,'qType':qt,'page':page,'error':repr(e)});break
          Path('output/calls.json').write_text(json.dumps(calls,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          vals=[]
          for key,row in hits.items():
            info=str(row.get('infoCode') or row.get('infocode') or row.get('INFO_CODE') or '')
            rec={'row':row,'infoCode':info}
            if info:
              for tpl in ['https://pdf.dfcfw.com/pdf/H3_{x}_1.pdf','https://pdf.dfcfw.com/pdf/H3_{x}_1.pdf?{ts}.pdf','https://pdf.dfcfw.com/pdf/H2_{x}_1.pdf']:
                u=tpl.format(x=info,ts=int(time.time()*1000))
                try:
                  r=s.get(u,timeout=60);data=r.content;att={'url':u,'status':r.status_code,'ct':r.headers.get('content-type',''),'bytes':len(data),'header':data[:8].decode('latin1','replace')};rec.setdefault('attempts',[]).append(att)
                  if data.startswith(b'%PDF') and len(data)>20000:
                    p=Path('output/pdfs')/f'{info}.pdf';p.write_bytes(data);rd=PdfReader(str(p));n=len(rd.pages);idx=sorted(set([0,min(1,n-1),min(4,n-1),n-1]));text=' '.join((rd.pages[i].extract_text() or '') for i in idx)
                    rec.update(file=str(p),pages=n,sample=' '.join(text.split())[:8000],sha256=hashlib.sha256(data).hexdigest());break
                except Exception as e:rec.setdefault('attempts',[]).append({'url':u,'error':repr(e)})
            vals.append(rec);print('VAL',json.dumps({k:rec.get(k) for k in ['infoCode','pages','file','sample']},ensure_ascii=False),flush=True)
          Path('output/validations.json').write_text(json.dumps(vals,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL_HITS',len(hits),'PDFS',len(list(Path('output/pdfs').glob('*.pdf'))),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eastmoney-hongqiao-alltypes
          path: output/*
          retention-days: 1
          if-no-files-found: error
