name: Probe Ascletis reports fast
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/probe-ascletis-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_ascletis_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: ascletis-fast-probe-20260906
          path: |
            ascletis_fast_results.json
            ascletis_fast/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
