name: Build Kangzhong 688607 disclosure package

on:
  push:
    branches:
      - tmp-kangzhong-688607-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='康众科技_688607_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE" /tmp/kangzhong_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('康众科技_688607_全部年报_招股说明书_最新季报')
          s = requests.Session()
          s.trust_env = False
          s.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8, backoff_factor=1,
              status_forcelist=[429,500,502,503,504], allowed_methods=['GET'], raise_on_status=False)))
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9',
          })

          docs = [
              dict(order=1, file='01_康众科技_首次公开发行股票并在科创板上市招股说明书_2021-01-27.pdf',
                   title='首次公开发行股票并在科创板上市招股说明书', date='2021-01-27', kind='prospectus', min_pages=300,
                   urls=[
                       'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-1/2021-01-27/6872758.PDF',
                       'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-1/2021-01-27/6872758.PDF',
                       'https://static.cninfo.com.cn/finalpage/2021-01-27/1209195030.PDF',
                   ], ref='https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?id=6872758&stockid=688607'),
              dict(order=2, file='02_康众科技_2020年年度报告.pdf', title='2020年年度报告', date='2021-04-20', kind='annual', year=2020, min_pages=100,
                   urls=['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-20/7072183.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-20/7072183.PDF'], ref='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7072183&stockid=688607'),
              dict(order=3, file='03_康众科技_2021年年度报告.pdf', title='2021年年度报告', date='2022-04-29', kind='annual', year=2021, min_pages=100,
                   urls=['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-29/8145945.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-29/8145945.PDF'], ref='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8145945&stockid=688607'),
              dict(order=4, file='04_康众科技_2022年年度报告_更新版.pdf', title='2022年年度报告（更新版）', date='2023-06-21', kind='annual', year=2022, min_pages=100,
                   urls=['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-6/2023-06-21/9303595.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-6/2023-06-21/9303595.PDF'], ref='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9303595&stockid=688607'),
              dict(order=5, file='05_康众科技_2023年年度报告.pdf', title='2023年年度报告', date='2024-04-20', kind='annual', year=2023, min_pages=100,
                   urls=['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-20/10011776.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-20/10011776.PDF'], ref='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10011776&stockid=688607'),
              dict(order=6, file='06_康众科技_2024年年度报告.pdf', title='2024年年度报告', date='2025-04-26', kind='annual', year=2024, min_pages=100,
                   urls=['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-26/10987522.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-26/10987522.PDF'], ref='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10987522&stockid=688607'),
              dict(order=7, file='07_康众科技_2025年年度报告.pdf', title='2025年年度报告', date='2026-04-25', kind='annual', year=2025, min_pages=100,
                   urls=['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-25/12196402.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-25/12196402.PDF'], ref='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12196402&stockid=688607'),
              dict(order=8, file='08_康众科技_2026年第一季度报告.pdf', title='2026年第一季度报告', date='2026-04-25', kind='quarter', year=2026, min_pages=8,
                   urls=['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-25/12196367.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-25/12196367.PDF','https://static.cninfo.com.cn/finalpage/2026-04-25/1225194136.PDF'], ref='https://static.cninfo.com.cn/finalpage/2026-04-25/1225194136.PDF'),
          ]

          def download(doc):
              last = None
              for attempt in range(8):
                  for url in doc['urls']:
                      try:
                          r = s.get(url, headers={'Referer':doc['ref']}, timeout=(30,360), allow_redirects=True)
                          data = r.content
                          if r.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 80000:
                              return r.url, data
                          last = RuntimeError(f'HTTP={r.status_code} bytes={len(data)} type={r.headers.get("content-type")}')
                      except Exception as e:
                          last = e
                  time.sleep(min(2+attempt,10))
              raise RuntimeError(f"download failed {doc['title']}: {last!r}")

          records=[]
          for d in docs:
              source, data = download(d)
              p = out/d['file']
              p.write_bytes(data)
              reader = PdfReader(str(p), strict=False)
              pages = len(reader.pages)
              if pages < d['min_pages']:
                  raise RuntimeError(f"{d['title']} page count {pages} below {d['min_pages']}")
              text=''
              idxs=list(range(min(12,pages)))+[pages-1]
              for i in dict.fromkeys(idxs):
                  try: text += '\n'+(reader.pages[i].extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','',text)
              if '康众' not in compact:
                  raise RuntimeError(f"company mismatch: {d['title']}")
              if d['kind']=='prospectus' and '招股说明书' not in compact:
                  raise RuntimeError('prospectus title mismatch')
              if d['kind']=='annual':
                  y=str(d['year'])
                  if f'{y}年年度报告' not in compact and f'{y}年度报告' not in compact:
                      raise RuntimeError(f"annual title mismatch: {d['title']}")
              if d['kind']=='quarter' and '第一季度报告' not in compact:
                  raise RuntimeError('quarter title mismatch')
              sha=hashlib.sha256(data).hexdigest()
              records.append({**d,'source':source,'pages':pages,'bytes':len(data),'sha256':sha})
              print('DOWNLOADED', p.name, 'pages=', pages, 'bytes=', len(data), 'sha256=', sha)

          lines=[
              '康众科技（688607，原证券简称：康众医疗）年报、招股说明书及最新季报资料包',
              '整理日期：2026-10-28','',
              '收录范围：',
              '1. 2020—2025年度报告全文，共6份；2022年度采用2023年6月21日披露的更新版。',
              '2. 2021年1月27日披露的首次公开发行股票并在科创板上市招股说明书正式发行版。',
              '3. 截至2026年10月28日最新已披露季度报告为2026年第一季度报告。',
              '4. 2026年第三季度报告计划于2026年10月29日披露，整理时尚未正式发布。',
              '5. 未收录年度报告摘要、半年度报告、招股意向书或申报稿。','',
              '文件清单：'
          ]
          sums=[]; total_pages=0; total_bytes=0
          for x in records:
              lines += [f"{x['order']}. {x['file']}",f"   文档：{x['title']}",f"   披露日期：{x['date']}",f"   页数：{x['pages']}页",f"   原始PDF：{x['source']}",f"   公告/索引页：{x['ref']}",f"   SHA-256：{x['sha256']}",'']
              sums.append(f"{x['sha256']}  {x['file']}")
              total_pages += x['pages']; total_bytes += x['bytes']
          lines += [f'合计：8份PDF，{total_pages}页，{total_bytes}字节。','全部文件均为公开渠道直接下载的完整PDF。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e; qpdf --check "$pdf" >"$pdf.qpdf" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 8
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '康众' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/kangzhong_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/kangzhong_test.zip "$PACKAGE"
          unzip -t /tmp/kangzhong_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/kangzhong_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f /tmp/kangzhong_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Kangzhong-688607-annual-reports-prospectus-latest-quarter
          path: 康众科技_688607_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
