name: Temporary Package Zhongcao Fragrances Brokerage Deep Reports

on:
  push:
    branches:
      - tmp/fetch-zhongcao-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests

          ROOT = Path('zhongcao_research_package')
          PDF_DIR = ROOT / '01_券商深度报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '东吴证券',
                  'date': '2026-02-13',
                  'title': '新型凉味剂国内领先，募投产能垂直整合夯实优势',
                  'info_code': 'AP202602131819917260',
                  'expected_pages': 20,
                  'researcher': '朱洁羽、余慧勇、易申申、武阿兰、陈哲晓',
                  'rating': '增持',
                  'filename': '01_东吴证券_2026-02-13_新型凉味剂国内领先_募投产能垂直整合夯实优势.pdf',
              },
              {
                  'broker': '开源证券',
                  'date': '2025-09-16',
                  'title': '北交所首次覆盖报告：领跑凉味剂优质赛道，一体化布局开启香精香料新成长',
                  'info_code': 'AP202509161744835814',
                  'expected_pages': 35,
                  'researcher': '诸海滨',
                  'rating': '增持',
                  'filename': '02_开源证券_2025-09-16_首次覆盖_领跑凉味剂优质赛道_一体化布局开启新成长.pdf',
              },
              {
                  'broker': '西南证券',
                  'date': '2024-09-13',
                  'title': 'WS系列凉味剂主要供应商，募投项目再助产能突破',
                  'info_code': 'AP202409131639863220',
                  'expected_pages': 18,
                  'researcher': '刘言',
                  'rating': '未标注',
                  'filename': '03_西南证券_2024-09-13_WS系列凉味剂主要供应商_募投项目再助产能突破.pdf',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/pdf,*/*;q=0.8',
          })

          def normalize(text):
              return re.sub(r'[\s：:，,。；;、（）()\-—_]+', '', text or '').lower()

          def pdf_page_count(path):
              completed = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', completed.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_text(path):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as temporary:
                  output = Path(temporary.name)
              try:
                  completed = subprocess.run(
                      ['pdftotext', '-enc', 'UTF-8', str(path), str(output)],
                      capture_output=True,
                      text=True,
                  )
                  if completed.returncode != 0:
                      raise RuntimeError(f'pdftotext failed for {path}: {completed.stderr}')
                  return output.read_text(encoding='utf-8', errors='ignore')
              finally:
                  output.unlink(missing_ok=True)

          manifest = []
          sha_lines = []
          for report in reports:
              url = f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_1.pdf'
              destination = PDF_DIR / report['filename']
              errors = []
              for attempt in range(1, 4):
                  try:
                      print(f'GET attempt={attempt} {url}')
                      with session.get(url, timeout=120, allow_redirects=True, stream=True) as response:
                          response.raise_for_status()
                          data = bytearray()
                          for chunk in response.iter_content(chunk_size=1024 * 256):
                              if chunk:
                                  data.extend(chunk)
                          raw = bytes(data)
                      if len(raw) < 200_000 or not raw.lstrip().startswith(b'%PDF'):
                          raise RuntimeError(f'not a substantial PDF: bytes={len(raw)}, head={raw[:16]!r}')
                      destination.write_bytes(raw)
                      break
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc}')
                      time.sleep(attempt * 2)
              else:
                  raise RuntimeError(f'Unable to download {report["title"]}: ' + '; '.join(errors))

              raw = destination.read_bytes()
              pages = pdf_page_count(destination)
              if pages != report['expected_pages']:
                  raise RuntimeError(
                      f'Unexpected page count for {report["title"]}: expected={report["expected_pages"]}, actual={pages}'
                  )

              text = extract_text(destination)
              compact = normalize(text)
              company_ok = any(normalize(term) in compact for term in [
                  '中草香料', '安徽中草香料股份有限公司', '920016', '870800'
              ])
              broker_ok = normalize(report['broker']) in compact
              year_ok = report['date'][:4] in compact
              title_tokens = [token for token in re.split(r'[：:，,。；;、\s]+', report['title']) if len(token) >= 4]
              title_hits = sum(1 for token in title_tokens if normalize(token) in compact)
              title_ok = title_hits >= max(1, min(2, len(title_tokens)))
              if not all([company_ok, broker_ok, year_ok, title_ok]):
                  raise RuntimeError(
                      f'Text validation failed for {report["title"]}: '
                      f'company={company_ok}, broker={broker_ok}, year={year_ok}, title={title_ok}, hits={title_hits}'
                  )

              sha = hashlib.sha256(raw).hexdigest()
              relative = str(destination.relative_to(ROOT))
              record = {
                  **report,
                  'file': relative,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'source_url': url,
                  'detail_url': f'https://data.eastmoney.com/report/info/{report["info_code"]}.html',
                  'pdf_header_valid': True,
                  'company_identity_matched': company_ok,
                  'broker_matched': broker_ok,
                  'year_matched': year_ok,
                  'title_matched': title_ok,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {relative}')
              print(f'VERIFIED {report["broker"]} {report["date"]}: pages={pages}, bytes={len(raw)}')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '中草香料（920016）券商深度报告公开PDF整理包',
              '',
              '筛选原则：优先选择篇幅完整、具有公司/行业深度分析属性的公开报告，排除3—4页的业绩点评与信息更新。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f'- {record["broker"]}｜{record["date"]}｜{record["title"]}',
                  f'  分析师：{record["researcher"]}',
                  f'  评级：{record["rating"]}',
                  f'  页数：{record["pages"]}',
                  f'  文件：{record["file"]}',
                  f'  SHA256：{record["sha256"]}',
                  f'  研报详情：{record["detail_url"]}',
                  f'  PDF来源：{record["source_url"]}',
              ])
          readme.extend([
              '',
              '校验项目：ZIP CRC、PDF文件头、pdfinfo页数、公司名称/证券代码、券商名称、年份、标题关键词、逐份SHA-256。',
          ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '中草香料_920016_券商深度报告_3份_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: zhongcao-fragrances-brokerage-deep-reports
          path: 中草香料_920016_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
