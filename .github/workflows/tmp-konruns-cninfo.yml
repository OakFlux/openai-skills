name: Temporary Konruns CNINFO package

on:
  push:
    branches: [tmp-konruns-cninfo-20260826]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Build package
        shell: bash
        run: |
          cat > /tmp/build.py <<'PY'
          import hashlib, html, re, time, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from pypdf import PdfReader

          code='603590'; org='9900034526'
          api='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          referer=f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={code}&orgId={org}'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':referer,'Origin':'https://www.cninfo.com.cn','X-Requested-With':'XMLHttpRequest'})
          rows=[]; seen=set()
          for page in range(1,10):
              d={'stock':f'{code},{org}','tabName':'fulltext','pageSize':'100','pageNum':str(page),'column':'sse','category':'category_ndbg_szsh;category_bndbg_szsh','plate':'sh','seDate':'2020-01-01~2026-08-26','searchkey':'','secid':'','sortName':'','sortType':'','isHLtitle':'true'}
              r=s.post(api,data=d,timeout=60); r.raise_for_status(); data=r.json(); batch=data.get('announcements') or []
              print('PAGE',page,len(batch))
              for x in batch:
                  k=str(x.get('announcementId') or x.get('adjunctUrl'))
                  if k and k not in seen:
                      seen.add(k); x['_title']=' '.join(re.sub(r'<[^>]+>','',html.unescape(str(x.get('announcementTitle') or ''))).split()); rows.append(x)
              if len(batch)<100: break
          def c(t): return re.sub(r'\s+','',t).replace('（','(').replace('）',')')
          def ts(x):
              try:return int(x.get('announcementTime') or 0)
              except:return 0
          def rev(t): return int(any(z in t for z in ['修正','修订','更正','更新']))
          annual={}
          for y in range(2020,2026):
              cand=[x for x in rows if f'{y}年年度报告' in c(x['_title']) and not any(z in c(x['_title']) for z in ['摘要','关于','审计','董事会','回复','提示性公告'])]
              if not cand: raise RuntimeError(f'missing annual {y}')
              annual[y]=max(cand,key=lambda x:(rev(x['_title']),ts(x)))
              print('SELECT',y,annual[y]['_title'],annual[y].get('adjunctUrl'))
          hc=[x for x in rows if '2026年半年度报告' in c(x['_title']) and not any(z in c(x['_title']) for z in ['摘要','关于','审计','董事会','提示性公告'])]
          if not hc: raise RuntimeError('missing 2026 half year')
          half=max(hc,key=lambda x:(rev(x['_title']),ts(x)))
          out=Path('dist'); folder=out/'康辰药业_603590_2020-2025年报_2026年半年报'; folder.mkdir(parents=True,exist_ok=True)
          sel=[(f'康辰药业_603590_{y}年年度报告.pdf',annual[y],'年度报告') for y in range(2020,2026)]+[('康辰药业_603590_2026年半年度报告.pdf',half,'半年度报告')]
          manifest=['北京康辰药业股份有限公司（603590.SH）','2020—2025年年度报告全文及2026年半年度报告全文','2023年采用修正版；全部排除摘要。','']
          for fn,x,kind in sel:
              adj=str(x.get('adjunctUrl') or '').lstrip('/'); p=folder/fn; ok=None; errs=[]
              for base in ['https://static.cninfo.com.cn/','http://static.cninfo.com.cn/']:
                  url=urljoin(base,adj)
                  try:
                      rr=s.get(url,headers={'Referer':referer,'Accept':'application/pdf,*/*'},timeout=240); rr.raise_for_status(); raw=rr.content
                      if len(raw)<80000 or not raw.startswith(b'%PDF-'): raise RuntimeError(f'not pdf {len(raw)}')
                      p.write_bytes(raw); pages=len(PdfReader(str(p),strict=False).pages)
                      if pages < (60 if kind=='年度报告' else 20): raise RuntimeError(f'short {pages}')
                      ok=(url,len(raw),pages,hashlib.sha256(raw).hexdigest()); break
                  except Exception as e:
                      p.unlink(missing_ok=True); errs.append(f'{url}: {e}')
              if not ok: raise RuntimeError('; '.join(errs))
              url,size,pages,digest=ok; print('OK',fn,pages,size); manifest += [fn,f'  标题：{x["_title"]}',f'  页数：{pages}',f'  SHA-256：{digest}',f'  来源：{url}','']
          (folder/'资料清单与官方来源.txt').write_text('\n'.join(manifest),encoding='utf-8')
          z=out/'康辰药业_603590_2020-2025年报_2026年半年报.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as a:
              for p in sorted(folder.iterdir()): a.write(p,p.name)
          with zipfile.ZipFile(z) as a:
              if a.testzip(): raise RuntimeError('zip failure')
              if len([n for n in a.namelist() if n.lower().endswith('.pdf')])!=7: raise RuntimeError('pdf count')
          print('FINAL',z,z.stat().st_size)
          PY
          python /tmp/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: konruns-final-zip
          path: dist/康辰药业_603590_2020-2025年报_2026年半年报.zip
          if-no-files-found: error
          retention-days: 1
