name: Build Tianwei Electronics 688511 public research package v2 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-electronics-688511-public-research-package-v2-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf beautifulsoup4 lxml reportlab

      - name: Build public research package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader, PdfWriter
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.platypus import Paragraph, SimpleDocTemplate, Spacer, Table, TableStyle

          PACKAGE = '天微电子_688511_券商深度及相关军工行业研究_公开资料_3份'
          ROOT = Path(PACKAGE)
          PREVIEWS = ROOT / '首页预览'
          SOURCES = ROOT / '来源记录'
          WORK = Path('_work_tianwei_v2')
          for p in (ROOT, PREVIEWS, SOURCES, WORK):
              p.mkdir(exist_ok=True)

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def fetch(url: str, referer: str | None = None, minimum: int = 1, accept: str = '*/*') -> requests.Response:
              last = None
              headers = {'User-Agent': s.headers['User-Agent'], 'Accept': accept}
              if referer:
                  headers['Referer'] = referer
              for attempt in range(5):
                  try:
                      r = s.get(url, headers=headers, timeout=(20, 90), allow_redirects=True)
                      last = (r.status_code, len(r.content), r.headers.get('content-type'), r.url)
                      if r.status_code == 200 and len(r.content) >= minimum:
                          return r
                  except Exception as exc:
                      last = repr(exc)
                  time.sleep(1 + attempt)
              raise RuntimeError(f'fetch failed: {url}; {last}')

          def image_to_jpeg(raw: bytes, output: Path) -> tuple[int, int]:
              with Image.open(BytesIO(raw)) as image:
                  image.load()
                  rgba = image.convert('RGBA')
                  canvas = Image.new('RGBA', rgba.size, (255, 255, 255, 255))
                  canvas.alpha_composite(rgba)
                  rgb = canvas.convert('RGB')
                  rgb.save(output, 'JPEG', quality=95, subsampling=0)
                  return rgb.size

          def validate_pdf(path: Path, minimum_pages: int) -> dict:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < minimum_pages:
                  raise RuntimeError(f'too few PDF pages: {path.name}: {pages}')
              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(path)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREVIEWS / path.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(path), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'preview render failed: {path.name}')
              return {
                  'pages': pages,
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'preview_file': str(Path('首页预览') / preview.name),
              }

          pdfmetrics.registerFont(UnicodeCIDFont('STSong-Light'))
          styles = getSampleStyleSheet()
          title_style = ParagraphStyle(
              'TitleCN', parent=styles['Title'], fontName='STSong-Light',
              fontSize=16, leading=23, alignment=TA_CENTER, spaceAfter=10, wordWrap='CJK',
          )
          body_style = ParagraphStyle(
              'BodyCN', parent=styles['BodyText'], fontName='STSong-Light',
              fontSize=10.5, leading=17, alignment=TA_LEFT, spaceAfter=8, wordWrap='CJK',
          )
          notice_style = ParagraphStyle(
              'NoticeCN', parent=body_style, fontSize=9.5, leading=15,
              borderColor=colors.HexColor('#BBBBBB'), borderWidth=0.7,
              borderPadding=7, backColor=colors.HexColor('#F4F4F4'),
          )
          meta_style = ParagraphStyle(
              'MetaCN', parent=body_style, fontSize=9.5, leading=15,
          )

          def esc(value: str) -> str:
              return html.escape(value or '', quote=True)

          def build_direct_report() -> dict:
              detail_url = 'https://www.baogaobox.com/reports/240622000020971.html'
              login_url = 'https://www.baogaobox.com/e/member/login/loginjs_report.php?id=20971'
              cover_url = 'https://zy.baogaobox.com/file/p/2024/06-24/imguh6a1626h5plhqkyt9xid00020971.webp'

              page = fetch(detail_url, 'https://www.baogaobox.com/', 10_000, 'text/html,*/*')
              page_text = page.content.decode(page.encoding or 'utf-8', 'replace')
              (SOURCES / '01_天风证券_来源页面.html').write_text(page_text, encoding='utf-8')
              login = fetch(login_url, detail_url, 50, 'text/javascript,text/html,*/*')
              login_text = login.content.decode(login.encoding or 'utf-8', 'replace')
              (SOURCES / '01_天风证券_访问状态说明.txt').write_text(login_text, encoding='utf-8')

              cover = fetch(cover_url, detail_url, 20_000, 'image/avif,image/webp,image/png,image/jpeg,*/*;q=0.8')
              cover_jpg = WORK / 'tianwei_cover.jpg'
              width, height = image_to_jpeg(cover.content, cover_jpg)
              if width < 500 or height < 700:
                  raise RuntimeError(f'cover unexpectedly small: {width}x{height}')
              cover_pdf = WORK / 'tianwei_cover.pdf'
              with Image.open(cover_jpg) as image:
                  image.convert('RGB').save(cover_pdf, 'PDF', resolution=150.0)

              notice_pdf = WORK / 'tianwei_notice.pdf'
              doc = SimpleDocTemplate(
                  str(notice_pdf), pagesize=A4,
                  leftMargin=19*mm, rightMargin=19*mm, topMargin=18*mm, bottomMargin=18*mm,
                  title='天微电子券商深度报告公开来源说明', author='资料整理',
              )
              story = [
                  Paragraph('天微电子（688511）券商深度报告公开来源说明', title_style),
                  Paragraph(
                      '文件性质说明：第一页为公开研报页面展示的报告封面。原报告共18页；公开页面的访问状态信息显示，其余17页需要注册账户后取得。本文件不是券商原始完整PDF，也未绕过任何登录、会员或下载权限。',
                      notice_style,
                  ),
                  Spacer(1, 5*mm),
              ]
              metadata = [
                  ('报告标题', '天微电子（688511）：军用灭火防爆系统龙头，下游景气度传导助力业绩腾飞'),
                  ('研究机构', '天风证券'),
                  ('发布日期', '2024-06-22'),
                  ('研究员', '王泽宇、杨英杰'),
                  ('原报告页数', '18页'),
                  ('公开可取得内容', '报告封面1页及公开元数据'),
                  ('来源页面', detail_url),
              ]
              table = Table(
                  [[Paragraph(esc(a), meta_style), Paragraph(esc(b), meta_style)] for a, b in metadata],
                  colWidths=[33*mm, 118*mm], hAlign='LEFT',
              )
              table.setStyle(TableStyle([
                  ('FONTNAME', (0,0), (-1,-1), 'STSong-Light'),
                  ('VALIGN', (0,0), (-1,-1), 'TOP'),
                  ('GRID', (0,0), (-1,-1), 0.35, colors.HexColor('#CCCCCC')),
                  ('BACKGROUND', (0,0), (0,-1), colors.HexColor('#F2F2F2')),
                  ('LEFTPADDING', (0,0), (-1,-1), 6),
                  ('RIGHTPADDING', (0,0), (-1,-1), 6),
                  ('TOPPADDING', (0,0), (-1,-1), 5),
                  ('BOTTOMPADDING', (0,0), (-1,-1), 5),
              ]))
              story.append(table)
              story.append(Spacer(1, 7*mm))
              story.append(Paragraph(
                  '公开检索仅发现这一份直接针对天微电子的公司深度报告。资料包另外收录两份明确包含天微电子数据或同业比较的军工行业专题报告，并标注为“相关行业研究”。',
                  body_style,
              ))
              story.append(Paragraph('报告观点及版权归原券商和研究员所有，仅供研究参考，不构成投资建议。', body_style))
              doc.build(story)

              output = ROOT / '01_天风证券_天微电子_军用灭火防爆系统龙头_公开封面与来源说明_原报告18页.pdf'
              writer = PdfWriter()
              for src in (cover_pdf, notice_pdf):
                  reader = PdfReader(str(src), strict=False)
                  for page_obj in reader.pages:
                      writer.add_page(page_obj)
              with output.open('wb') as stream:
                  writer.write(stream)
              info = validate_pdf(output, 2)
              return {
                  'order': 1,
                  'broker': '天风证券',
                  'date': '2024-06-22',
                  'analysts': '王泽宇、杨英杰',
                  'title': '天微电子（688511）：军用灭火防爆系统龙头，下游景气度传导助力业绩腾飞',
                  'file': output.name,
                  'original_pages': 18,
                  'public_report_pages': 1,
                  'document_nature': '直接公司深度报告的公开封面与来源说明；非完整原始PDF',
                  'source_page': detail_url,
                  'access_status': login_text.strip(),
                  **info,
              }

          def find_image_pattern(page_text: str, detail_id: int, page_url: str) -> tuple[str, str]:
              soup = BeautifulSoup(page_text, 'lxml')
              values: list[str] = []
              for tag in soup.find_all(True):
                  for attr in ('src', 'data-src', 'data-original', 'data-url', 'href'):
                      value = tag.get(attr)
                      if isinstance(value, str) and value.strip():
                          values.append(urljoin(page_url, value.strip()))
              values.extend(re.findall(r'https?://[^\s"\'<>]+', page_text))
              for raw in values:
                  value = html.unescape(raw).replace('\\/', '/').split('?')[0]
                  for separator in ('-', '_'):
                      match = re.match(rf'(.+/){detail_id}{separator}1\.(png|jpg|jpeg|webp)$', value, re.I)
                      if match:
                          return match.group(1) + str(detail_id) + separator, match.group(2).lower()
              raise RuntimeError(f'cannot locate preview images for detail {detail_id}')

          def fetch_preview_image(url: str, referer: str) -> bytes | None:
              try:
                  r = s.get(
                      url,
                      headers={
                          'User-Agent': s.headers['User-Agent'],
                          'Referer': referer,
                          'Accept': 'image/avif,image/webp,image/apng,image/png,image/jpeg,*/*;q=0.8',
                      },
                      timeout=(15, 40), allow_redirects=True,
                  )
                  if r.status_code == 200 and len(r.content) >= 5_000:
                      with Image.open(BytesIO(r.content)) as image:
                          image.verify()
                      return r.content
              except Exception:
                  return None
              return None

          def build_related_report(detail_id: int, order: int, broker: str, date: str, title: str, filename: str, relation: str) -> dict:
              detail_url = f'https://www.fxbaogao.com/detail/{detail_id}'
              page = fetch(detail_url, 'https://www.fxbaogao.com/', 10_000, 'text/html,*/*')
              page_text = page.content.decode(page.encoding or 'utf-8', 'replace')
              source_name = f'{order:02d}_fxbaogao_{detail_id}.html'
              (SOURCES / source_name).write_text(page_text, encoding='utf-8')
              prefix, extension = find_image_pattern(page_text, detail_id, page.url)

              report_work = WORK / f'fx_{detail_id}'
              report_work.mkdir(exist_ok=True)
              image_paths: list[Path] = []
              page_records: list[dict] = []
              seen: set[str] = set()
              for page_no in range(1, 21):
                  url = f'{prefix}{page_no}.{extension}'
                  raw = fetch_preview_image(url, detail_url)
                  if raw is None:
                      break
                  digest = hashlib.sha256(raw).hexdigest()
                  if digest in seen:
                      break
                  seen.add(digest)
                  jpg = report_work / f'{page_no:03d}.jpg'
                  width, height = image_to_jpeg(raw, jpg)
                  if width < 700 or height < 850:
                      jpg.unlink(missing_ok=True)
                      break
                  image_paths.append(jpg)
                  page_records.append({
                      'page': page_no, 'url': url, 'width': width, 'height': height,
                      'bytes': len(raw), 'sha256': digest,
                  })
                  time.sleep(0.05)
              if not image_paths:
                  raise RuntimeError(f'no public preview pages for detail {detail_id}')

              output = ROOT / filename
              opened = [Image.open(path).convert('RGB') for path in image_paths]
              try:
                  opened[0].save(output, save_all=True, append_images=opened[1:], resolution=150.0, quality=95)
              finally:
                  for image in opened:
                      image.close()
              info = validate_pdf(output, len(image_paths))
              return {
                  'order': order,
                  'broker': broker,
                  'date': date,
                  'title': title,
                  'file': output.name,
                  'document_nature': '相关军工行业专题研究的公开预览页整理版；非完整原始PDF，非天微电子单独公司深度报告',
                  'relation_to_tianwei': relation,
                  'source_page': detail_url,
                  'source_html_file': str(Path('来源记录') / source_name),
                  'public_preview_pages': len(image_paths),
                  'page_records': page_records,
                  **info,
              }

          manifest = [
              build_direct_report(),
              build_related_report(
                  3160614, 2, '中泰证券', '2022-05-05',
                  '国防军工行业军工板块2021Q4与2022Q1业绩专题报告：板块持续高景气，军工确定性投资价值凸现',
                  '02_中泰证券_军工板块2021Q4及2022Q1业绩专题_含天微电子_公开预览版.pdf',
                  '报告的军工板块个股业绩及估值表中列有688511.SH天微电子。',
              ),
              build_related_report(
                  4623838, 3, '中原证券', '2024-12-11',
                  '国防军工行业专题研究：否极泰来，圆满收官',
                  '03_中原证券_国防军工行业专题研究_含天微电子_公开预览版.pdf',
                  '报告的2024年军工上市公司行情回顾中明确列有688511.SH天微电子。',
              ),
          ]

          readme = [
              '天微电子（688511.SH）券商深度及相关军工行业研究公开资料包',
              '整理日期：2026-10-12',
              '',
              '公开检索仅找到1份直接针对天微电子的券商公司深度报告，即天风证券2024年报告。原报告共18页，但公开入口只展示封面，访问状态信息显示其余17页需要注册账户后取得。本包未绕过任何登录、会员或下载权限。',
              '',
              '另收录2份明确包含天微电子数据或同业比较的军工行业专题报告。两份文件均为公开预览页整理版，且不是天微电子单独公司深度报告。',
              '',
          ]
          for item in manifest:
              readme += [
                  f"{item['order']}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；文件性质：{item['document_nature']}",
                  f"   本包文件：{item['file']}；PDF页数：{item['pages']}页",
                  f"   来源页面：{item['source_page']}",
              ]
              if item.get('relation_to_tianwei'):
                  readme.append(f"   与天微电子的关系：{item['relation_to_tianwei']}")
              readme += [f"   SHA-256：{item['sha256']}", '']
          readme += [
              '包内附来源网页、报告首页预览、manifest.json和SHA256SUMS.txt。',
              '核验项目：来源页面、图像尺寸及去重、PDF页数、qpdf结构、首页渲染、ZIP CRC和SHA-256。',
              '报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['file']}\n" for item in manifest), encoding='utf-8'
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{PACKAGE}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}')
          short = Path('tianwei_research_reports.zip')
          short.write_bytes(zip_path.read_bytes())
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-electronics-688511-public-research-package-v2-final
          path: |
            天微电子_688511_券商深度及相关军工行业研究_公开资料_3份.zip
            tianwei_research_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
