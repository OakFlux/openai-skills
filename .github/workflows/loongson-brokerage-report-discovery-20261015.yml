name: Discover Loongson brokerage research reports

on:
  push:
    paths:
      - '.github/workflows/loongson-brokerage-report-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query Eastmoney research-report API
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time, requests
          from pathlib import Path

          OUT = Path('loongson_brokerage_discovery')
          OUT.mkdir(exist_ok=True)
          CODE = '688047'
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/688047.html',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          windows = [
              ('2022-06-15', '2022-08-05'),
              ('2022-11-01', '2023-01-15'),
              ('2023-01-16', '2024-12-31'),
              ('2025-01-01', '2026-10-15'),
          ]
          found = []
          seen = set()
          raw = []
          for begin, end in windows:
              for mode in ('code', 'blank'):
                  for page in range(1, 31):
                      params = {
                          'industryCode': '*',
                          'pageSize': '100',
                          'industry': '*',
                          'rating': '*',
                          'ratingchange': '*',
                          'beginTime': begin,
                          'endTime': end,
                          'pageNo': str(page),
                          'fields': '',
                          'qType': '0',
                          'orgCode': '',
                          'code': CODE if mode == 'code' else '',
                          'rcode': '',
                          'p': str(page),
                          'pageNum': str(page),
                          'pageNumber': str(page),
                          '_': str(int(time.time() * 1000)),
                      }
                      response = session.get(endpoint, params=params, timeout=90)
                      print('QUERY', begin, end, mode, page, response.status_code, len(response.content), response.url, flush=True)
                      response.raise_for_status()
                      payload = response.json() or {}
                      rows = payload.get('data') or []
                      raw.append({'begin': begin, 'end': end, 'mode': mode, 'page': page, 'hits': payload.get('hits'), 'rows': rows})
                      print('ROWS', len(rows), 'HITS', payload.get('hits'), flush=True)
                      if not rows:
                          break
                      for row in rows:
                          stock_code = str(row.get('stockCode') or '')
                          stock_name = str(row.get('stockName') or '')
                          title = str(row.get('title') or '')
                          if stock_code == CODE or '龙芯中科' in stock_name or ('龙芯中科' in title and CODE in title):
                              info_code = str(row.get('infoCode') or '')
                              key = info_code or (title, str(row.get('publishDate') or ''), str(row.get('orgSName') or ''))
                              if key not in seen:
                                  seen.add(key)
                                  found.append(row)
                                  print('FOUND', json.dumps(row, ensure_ascii=False), flush=True)
                      if len(rows) < 100:
                          break
          found.sort(key=lambda x: str(x.get('publishDate') or ''))
          OUT.joinpath('found_reports.json').write_text(json.dumps(found, ensure_ascii=False, indent=2), encoding='utf-8')
          OUT.joinpath('raw_queries.json').write_text(json.dumps(raw, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_FOUND', len(found), flush=True)
          for row in found:
              summary = {key: row.get(key) for key in (
                  'title','stockName','stockCode','orgSName','orgName','publishDate','infoCode',
                  'attachPages','attachSize','researcher','emRatingName','ratingName','column','reportType'
              )}
              print('SUMMARY', json.dumps(summary, ensure_ascii=False), flush=True)
          PY
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: loongson-brokerage-report-discovery-20261015
          path: loongson_brokerage_discovery
          retention-days: 7
          compression-level: 6