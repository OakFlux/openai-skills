name: Build Lirenlizhuang 605136 brokerage deep reports package 20261012

on:
  push:
    paths:
      - '.github/workflows/lirenlizhuang-605136-brokerage-deep-reports-package-20261012.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='丽人丽妆_605136_券商深度报告精选_3份'
          OUT=Path(PACKAGE); OUT.mkdir(exist_ok=True)
          S=requests.Session(); S.trust_env=False
          S.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          reports=[
            {'filename':'01_国金证券_2020-12-24_深度报告_资深化妆品代运营龙头.pdf','broker':'国金证券','date':'2020-12-24','title':'资深化妆品代运营龙头','authors':'李婕、罗晓婷','rating':'买入','code':'AP202012241443382848','pages':43,'min_bytes':2000000},
            {'filename':'02_国元证券_2020-11-22_首次覆盖_数据赋能行业_电商加美妆尽享行业红利.pdf','broker':'国元证券','date':'2020-11-22','title':'公司首次覆盖报告：数据赋能行业，电商+美妆尽享行业红利','authors':'李典','rating':'增持','code':'AP202011221431811157','pages':31,'min_bytes':2000000},
            {'filename':'03_华安证券_2022-10-11_首次覆盖_头部美妆服务商_深耕与拓展并进.pdf','broker':'华安证券','date':'2022-10-11','title':'头部美妆服务商，深耕与拓展并进','authors':'王洪岩','rating':'买入','code':'AP202210111579063645','pages':29,'min_bytes':600000},
          ]

          def candidates(code):
            return [f'https://pdf.dfcfw.com/pdf/{p}_{code}_1.{ext}' for p in ('H3','H2','H4') for ext in ('pdf','PDF')]

          def download(r,path):
            errors=[]
            for url in candidates(r['code']):
              for attempt in range(1,4):
                tmp=path.with_suffix('.pdf.part'); tmp.unlink(missing_ok=True)
                try:
                  with S.get(url,headers={'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*'},stream=True,timeout=(30,600)) as resp:
                    print('DOWNLOAD',path.name,resp.status_code,url,flush=True); resp.raise_for_status()
                    with tmp.open('wb') as f:
                      for chunk in resp.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                  if tmp.stat().st_size<r['min_bytes'] or tmp.read_bytes()[:5]!=b'%PDF-': raise RuntimeError('invalid PDF')
                  tmp.replace(path); return url
                except Exception as e:
                  errors.append(repr(e)); tmp.unlink(missing_ok=True); time.sleep(attempt)
            raise RuntimeError(f'download failed {path.name}: {errors[-6:]}')

          records=[]; hashes=set()
          for r in reports:
            path=OUT/r['filename']; source=download(r,path)
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
            if pages!=r['pages']: raise RuntimeError(f'{path.name}: pages={pages}, expected={r["pages"]}')
            check=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],capture_output=True,text=True)
            if check.returncode: raise RuntimeError(check.stderr[-1500:])
            root=OUT/(path.stem+'_check')
            render=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','96',str(path),str(root)],capture_output=True,text=True)
            png=Path(str(root)+'.png')
            if render.returncode or not png.exists() or png.stat().st_size<8000: raise RuntimeError(f'render failed {path.name}')
            render_bytes=png.stat().st_size; png.unlink()
            data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in hashes: raise RuntimeError('duplicate PDF')
            hashes.add(sha)
            rec={**r,'source_pdf_url':source,'detail_url':f'https://data.eastmoney.com/report/info/{r["code"]}.html','bytes':len(data),'sha256':sha,'first_page_render_bytes':render_bytes}
            records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          lines=['上海丽人丽妆化妆品股份有限公司（605136.SH）券商深度报告精选','整理日期：2026-10-12','','筛选说明：收录三份券商原始排版完整PDF，覆盖三家不同券商及不同研究阶段；均为29页以上的首次覆盖或公司深度报告。未使用短篇业绩点评补足数量。','来源：东方财富研究报告公开文件服务器。','全部PDF已完成文件头、文件大小、页数、qpdf结构、首页渲染、SHA-256与ZIP CRC检查。','','文件清单：']
          for i,r in enumerate(records,1):
            lines += [f"{i}. {r['broker']}，{r['date']}，{r['pages']}页",f"   标题：{r['title']}",f"   分析师：{r['authors']}；评级：{r['rating']}",f"   文件：{r['filename']}",f"   信息代码：{r['code']}",f"   SHA-256：{r['sha256']}",'']
          (OUT/'00_报告清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as a:
            for p in sorted(OUT.iterdir()): a.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(z) as a:
            if a.testzip(): raise RuntimeError('ZIP CRC failure')
            if len([n for n in a.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('PDF count mismatch')
          print('FINAL_ZIP',z.name,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: lirenlizhuang-605136-brokerage-deep-reports-20261012
          path: 丽人丽妆_605136_券商深度报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
