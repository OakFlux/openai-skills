name: Build Yishitong 688733 all filings corrected 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yishitong-688733-all-filings-20261028-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='688733'
          SHORT='壹石通'
          FULL='安徽壹石通材料科技股份有限公司'
          PACKAGE='壹石通_688733_全部年报_招股说明书_最新季报'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          sina='https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK'
          items=[
            {'label':'2021年年度报告','filename':'01_2021年年度报告.pdf','min_pages':220,
             'urls':[f'{sina}/2022/2022-3/2022-03-25/7913605.PDF']},
            {'label':'2022年年度报告','filename':'02_2022年年度报告.pdf','min_pages':250,
             'urls':[f'{sina}/2023/2023-3/2023-03-30/8929160.PDF']},
            {'label':'2023年年度报告（更新版）','filename':'03_2023年年度报告_更新版.pdf','min_pages':260,
             'urls':[f'{sina}/2024/2024-5/2024-05-27/10240424.PDF']},
            {'label':'2024年年度报告','filename':'04_2024年年度报告.pdf','min_pages':250,
             'urls':[
               'https://static.cninfo.com.cn/finalpage/2025-04-18/1223128509.PDF',
               'https://stockn.xueqiu.com/SH688733/202504171657989069.pdf',
               'https://www.100est.com/res/financial-report/r2024/SH688733_202504171657989069.pdf'
             ]},
            {'label':'2025年年度报告','filename':'05_2025年年度报告.pdf','min_pages':170,
             'urls':[
               'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-17/688733_20260417_W6XA.pdf',
               f'{sina}/2026/2026-4/2026-04-17/12099645.PDF'
             ]},
            {'label':'首次公开发行股票并在科创板上市招股说明书','filename':'06_首次公开发行股票并在科创板上市招股说明书.pdf','min_pages':350,
             'urls':[f'{sina}/2021/2021-8/2021-08-12/7430126.PDF']},
            {'label':'2026年第一季度报告','filename':'07_2026年第一季度报告.pdf','min_pages':5,
             'urls':[
               'https://static.cninfo.com.cn/finalpage/2026-04-30/1225257658.PDF',
               'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-30/688733_20260430_7NAX.pdf',
               f'{sina}/2026/2026-4/2026-04-30/12278290.PDF'
             ]},
          ]

          session=requests.Session(); session.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          manifest=[]
          for item in items:
            data=None; source=''; attempts=[]
            for url in item['urls']:
              for attempt in range(3):
                try:
                  if 'sina.com.cn' in url:
                    referer='https://vip.stock.finance.sina.com.cn/'
                  elif 'sse.com.cn' in url:
                    referer='https://www.sse.com.cn/'
                  elif 'xueqiu.com' in url:
                    referer='https://xueqiu.com/'
                  elif '100est.com' in url:
                    referer='https://www.100est.com/'
                  else:
                    referer='https://www.cninfo.com.cn/'
                  r=session.get(url,headers={
                    'User-Agent':ua,'Referer':referer,
                    'Accept':'application/pdf,*/*;q=0.8',
                    'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
                  },timeout=(30,360),allow_redirects=True)
                  attempts.append({'url':url,'attempt':attempt+1,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000:
                    data=r.content; source=url; break
                  if r.status_code in (400,401,403,404,410):
                    break
                except Exception as exc:
                  attempts.append({'url':url,'attempt':attempt+1,'error':repr(exc)})
                time.sleep(1+attempt)
              if data: break
            if not data:
              raise RuntimeError(f"Download failed {item['label']}: {attempts}")

            dest=PDFDIR/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<item['min_pages']:
              raise RuntimeError(f"Unexpectedly short PDF {item['label']}: {pages} pages")

            text=''
            for page in reader.pages[:min(40,pages)]:
              try: text+='\n'+(page.extract_text() or '')
              except Exception: pass
            compact=re.sub(r'\s+','',text)
            identity_hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
            if len(compact)>500 and not identity_hits:
              raise RuntimeError(f"Issuer mismatch {item['label']}")

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<8000:
              raise RuntimeError(f"Preview failed {item['label']}")

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'label':item['label'],'filename':str(Path('原始PDF')/item['filename']),
              'source_url':source,'pages':pages,'bytes':len(data),'sha256':sha,
              'identity_hits':identity_hits,'preview_file':str(Path('首页预览')/preview.name),
              'download_attempts':attempts,
              'validation':['PDF header','issuer identity','page count','qpdf structure','first-page render']
            })

          total_pages=sum(x['pages'] for x in manifest)
          readme=[
            '安徽壹石通材料科技股份有限公司（688733.SH）公开披露文件资料包',
            '整理日期：2026-10-28','',
            '收录范围：公司上市后全部年度报告全文（2021—2025年）、首次公开发行股票并在科创板上市招股说明书全文，以及截至整理日最新已披露的独立季度报告。',
            '2023年年度报告采用公司后续披露的更新版。',
            '公司2026年第三季度报告预约披露日为2026年10月30日，截至2026年10月28日尚未披露，因此最新季报采用2026年第一季度报告。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['label']}",
              f"   页数：{x['pages']}页；文件：{x['filename']}",
              f"   来源：{x['source_url']}",
              f"   SHA-256：{x['sha256']}",''
            ]
          readme += [
            f'合计：{len(manifest)}份PDF，{total_pages}页。',
            '已核验PDF文件头、公司名称/证券代码、实际页数、文档结构、首页渲染、ZIP CRC和SHA-256。'
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zcn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=len(manifest):
              raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')
          zen=Path('yishitong_688733_all_annual_reports_prospectus_latest_quarter.zip')
          zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: yishitong-688733-all-filings-corrected
          path: |
            壹石通_688733_全部年报_招股说明书_最新季报.zip
            yishitong_688733_all_annual_reports_prospectus_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
