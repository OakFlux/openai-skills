name: Inspect Fxbaogao viewer JavaScript API routes 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and grep viewer JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          cat > /tmp/js_probe.py <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          base='https://www.fxbaogao.com/view?id=2745967'
          urls=[
            'https://static.fxbaogao.com/pub/js/config/production.js',
            'https://www.fxbaogao.com/_fxbg/2610141742/js/runtime.4eb28314ecb0c4a7c50c.js',
            'https://www.fxbaogao.com/_fxbg/2610141742/js/antd-table.efc2d913db806c205059.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2610141742/js/vendors~app-pages-fxbg-main-js.f7b12df6cb87e7f5ac48.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2610141742/js/app-pages-fxbg-main-js.fd6234d1ab18d90a303e.chunk.js',
            'https://static.fxbaogao.com/detail_source/js/app-v1.js',
          ]
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':base})
          out=[]
          for idx,u in enumerate(urls):
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
              p=Path(f'asset_{idx}.js');p.write_text(text,encoding='utf-8')
              patterns={
                'urls':r'https?://[^\s\"\'<>]+',
                'api_paths':r'[\"\'](/[^\"\']*(?:api|report|pdf|document|download|view|file)[^\"\']*)[\"\']',
                'all_paths':r'[\"\'](/[^\"\']{1,180})[\"\']',
                'keywords':r'.{0,180}(?:pdf|download|reportId|docId|report-image|fileUrl|sourceUrl|originalUrl|viewDocument|documentUrl|oss|preview).{0,300}',
              }
              matches={}
              for name,pat in patterns.items():
                vals=[]
                for m in re.finditer(pat,text,re.I|re.S):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=' '.join(v.split())
                  if v not in vals: vals.append(v)
                  if len(vals)>=500: break
                matches[name]=vals
              rec={'url':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'matches':matches}
              out.append(rec)
              print('\nASSET',idx,r.status_code,len(r.content),r.url)
              for name in ['urls','api_paths','keywords']:
                print(name,json.dumps(matches[name][:300],ensure_ascii=False))
            except Exception as e:
              out.append({'url':u,'error':repr(e)})
              print('ERROR',u,repr(e))
          Path('fxbaogao_js_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd /tmp
          python js_probe.py
          cp fxbaogao_js_probe.json "$GITHUB_WORKSPACE/"
          cp asset_*.js "$GITHUB_WORKSPACE/"
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-js-api-probe
          path: |
            fxbaogao_js_probe.json
            asset_*.js
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
