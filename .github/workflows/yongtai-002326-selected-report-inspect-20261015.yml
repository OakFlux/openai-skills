name: Probe Eastmoney historical Yongtai broker reports by date window 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query historical date windows and parameter variants
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          cat > /tmp/eastmoney_history_probe.py <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import requests

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          session = requests.Session(); session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/stock.jshtml?code=002326',
              'Accept':'application/json,text/javascript,*/*;q=0.01',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          windows = [
              ('2021','2021-01-01','2021-12-31'),
              ('2022','2022-01-01','2022-12-31'),
              ('2023','2023-01-01','2023-12-31'),
              ('2019_2020','2019-01-01','2020-12-31'),
              ('all','2000-01-01','2099-12-31'),
          ]
          codes = ['002326','SZ002326','sz002326']
          qtypes = ['0','1']
          page_sizes = ['50','500','5000']
          outputs=[]
          seen_requests=set()
          for label,begin,end in windows:
              for code in codes:
                  for qtype in qtypes:
                      for page_size in page_sizes:
                          params={
                              'industryCode':'*','pageSize':page_size,'industry':'*','rating':'*','ratingChange':'*',
                              'beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':qtype,
                              'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1',
                          }
                          key=tuple(sorted(params.items()))
                          if key in seen_requests: continue
                          seen_requests.add(key)
                          try:
                              r=session.get(endpoint,params=params,timeout=(20,120))
                              rec={'label':label,'code_param':code,'qType':qtype,'pageSize':page_size,'status':r.status_code,'url':r.url,'bytes':len(r.content)}
                              if r.status_code==200:
                                  try:
                                      data=r.json(); rows=data.get('data') or []
                                      compact=[]
                                      for x in rows:
                                          compact.append({
                                              'infoCode':x.get('infoCode'),'publishDate':x.get('publishDate'),'orgSName':x.get('orgSName'),
                                              'researcher':x.get('researcher') or x.get('author'),'title':x.get('title'),
                                              'stockCode':x.get('stockCode'),'stockName':x.get('stockName'),
                                              'pdf':f"https://pdf.dfcfw.com/pdf/H3_{x.get('infoCode')}_1.pdf" if x.get('infoCode') else None,
                                          })
                                      rec.update({'TotalPage':data.get('TotalPage'),'TotalCount':data.get('TotalCount'),'currentYear':data.get('currentYear'),'rows':compact})
                                  except Exception as e:
                                      rec['json_error']=repr(e);rec['text']=r.text[:1000]
                              else:
                                  rec['text']=r.text[:1000]
                              outputs.append(rec)
                              hits=[x for x in rec.get('rows',[]) if any(k in (x.get('title') or '') for k in ['含氟精细化学品','六氟、VC','产业链一体化','新工艺助力'])]
                              if rec.get('rows') or hits:
                                  print('\nQUERY',label,code,qtype,page_size,'STATUS',r.status_code,'COUNT',len(rec.get('rows',[])),'TOTAL',rec.get('TotalCount'))
                                  print(json.dumps(rec.get('rows',[]),ensure_ascii=False,indent=2)[:50000])
                              time.sleep(0.05)
                          except Exception as e:
                              outputs.append({'label':label,'code_param':code,'qType':qtype,'pageSize':page_size,'error':repr(e)})
                              print('ERROR',label,code,qtype,page_size,repr(e))
          Path('eastmoney_yongtai_historical_probe.json').write_text(json.dumps(outputs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd /tmp
          python eastmoney_history_probe.py
          cp eastmoney_yongtai_historical_probe.json "$GITHUB_WORKSPACE/"
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-yongtai-historical-probe
          path: eastmoney_yongtai_historical_probe.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
