name: Inspect Yongtai Fxbaogao viewers and images 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect viewer pages and image sequences
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml pillow
          cat > /tmp/fxbaogao_probe.py <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO

          reports = [
              {'key':'guolian_20220929','id':'3393203','date':'2022/09/29','expected_pages':27,'title':'构建产业链一体化，打造业绩新曲线'},
              {'key':'guosheng_20210712','id':'2745967','date':'2021/07/12','expected_pages':18,'title':'从含氟精细化学品出发，抢攻锂电池电解液材料制高点'},
              {'key':'zhongtai_20210615','id':'2714314','date':'2021/06/15','expected_pages':15,'title':'氟化工龙头，六氟、VC高弹性品种'},
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          out=[]
          for item in reports:
              rec={**item,'pages':[],'pages_checked':[],'html':[]}
              for kind,url in [
                  ('detail',f"https://www.fxbaogao.com/detail/{item['id']}"),
                  ('view',f"https://www.fxbaogao.com/view?id={item['id']}"),
              ]:
                  try:
                      r=s.get(url,timeout=(20,120),allow_redirects=True)
                      raw=r.content; enc=r.apparent_encoding or r.encoding or 'utf-8'; text=raw.decode(enc,errors='replace')
                      Path(f"{item['key']}_{kind}.html").write_text(text,encoding='utf-8')
                      soup=BeautifulSoup(text,'lxml')
                      links=[{'text':' '.join(a.get_text(' ',strip=True).split()),'href':urljoin(r.url,a.get('href'))} for a in soup.find_all('a',href=True)]
                      imgs=[urljoin(r.url,x.get('src')) for x in soup.find_all('img',src=True)]
                      scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]
                      hits=[]
                      for pat in [r'https?://[^\s\"\'<>]+',r'AP\d{15,}',r'[^\"\']+\.pdf[^\"\']*',r'report-image[^\"\']+']:
                          hits.extend(re.findall(pat,text,re.I))
                      rec['html'].append({'kind':kind,'status':r.status_code,'final_url':r.url,'bytes':len(raw),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'links':links[:300],'images':imgs[:300],'scripts':scripts[:300],'hits':list(dict.fromkeys(hits))[:500]})
                      print('\nHTML',item['key'],kind,r.status_code,r.url,len(raw),rec['html'][-1]['title'])
                      print('IMAGES',json.dumps(imgs[:100],ensure_ascii=False))
                      print('HITS',json.dumps(rec['html'][-1]['hits'][:200],ensure_ascii=False))
                  except Exception as e:
                      rec['html'].append({'kind':kind,'url':url,'error':repr(e)})
                      print('HTML ERROR',item['key'],kind,repr(e))

              base=f"https://public.fxbaogao.com/report-image/{item['date']}/{item['id']}"
              misses=0
              for n in range(1,item['expected_pages']+6):
                  urls=[f'{base}-{n}.png',f'{base}-{n}.jpg',f'{base}-{n}.jpeg']
                  got=None
                  for u in urls:
                      try:
                          rr=s.get(u,timeout=(20,120),allow_redirects=True,headers={'Referer':f"https://www.fxbaogao.com/view?id={item['id']}"})
                          meta={'url':u,'status':rr.status_code,'ctype':rr.headers.get('content-type'),'bytes':len(rr.content),'final':rr.url}
                          if rr.status_code==200 and len(rr.content)>5000:
                              try:
                                  im=Image.open(BytesIO(rr.content)); meta['format']=im.format; meta['size']=im.size
                                  got=(u,rr.content,meta); break
                              except Exception as e:
                                  meta['image_error']=repr(e)
                          rec['pages_checked'].append(meta)
                      except Exception as e:
                          rec['pages_checked'].append({'url':u,'error':repr(e)})
                  if got:
                      u,data,meta=got
                      ext=(meta.get('format') or 'PNG').lower().replace('jpeg','jpg')
                      p=Path(f"{item['key']}_page_{n:03d}.{ext}"); p.write_bytes(data)
                      rec['pages'].append({**meta,'local':p.name,'page':n})
                      misses=0
                      print('PAGE OK',item['key'],n,meta)
                  else:
                      misses+=1
                      print('PAGE MISS',item['key'],n)
                      if n>item['expected_pages'] and misses>=2: break
              out.append(rec)
          Path('fxbaogao_yongtai_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd /tmp
          python fxbaogao_probe.py
          cp fxbaogao_yongtai_probe.json "$GITHUB_WORKSPACE/"
          cp *.html "$GITHUB_WORKSPACE/" || true
          cp *_page_* "$GITHUB_WORKSPACE/" || true
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-fxbaogao-viewer-probe
          path: |
            fxbaogao_yongtai_probe.json
            *.html
            *_page_*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
