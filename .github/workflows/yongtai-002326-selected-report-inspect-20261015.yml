name: Package Yongtai Technology 002326 broker deep reports 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          PACKAGE = '永太科技_002326_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          VALIDATION = ROOT / '抽样页校验'
          VALIDATION.mkdir(exist_ok=True)

          REPORTS = [
              {
                  'seq': 1,
                  'broker': '国联证券',
                  'date': '2022-09-29',
                  'title': '构建产业链一体化，打造业绩新曲线',
                  'analyst': '贺朝晖',
                  'rating': '增持（首次评级）',
                  'ap_code': 'AP202209291578773236',
                  'expected_pages': 27,
                  'expected_bytes': 1010287,
                  'filename': '01_国联证券_构建产业链一体化_打造业绩新曲线_20220929.pdf',
                  'title_terms': ['构建产业链一体化', '打造业绩新曲线'],
              },
              {
                  'seq': 2,
                  'broker': '国盛证券',
                  'date': '2021-07-12',
                  'title': '从含氟精细化学品出发，抢攻锂电池电解液材料制高点',
                  'analyst': '王席鑫、王磊、郑震湘、杨义韬',
                  'rating': '买入（首次覆盖）',
                  'ap_code': 'AP202107121503339193',
                  'expected_pages': 18,
                  'expected_bytes': 1754808,
                  'filename': '02_国盛证券_从含氟精细化学品出发_抢攻锂电池电解液材料制高点_20210712.pdf',
                  'title_terms': ['含氟精细化学品', '锂电池电解液材料'],
              },
              {
                  'seq': 3,
                  'broker': '中泰证券',
                  'date': '2021-06-15',
                  'title': '氟化工龙头，六氟、VC高弹性品种',
                  'analyst': '苏晨、陈传红',
                  'rating': '买入',
                  'ap_code': 'AP202106151498032996',
                  'expected_pages': 15,
                  'expected_bytes': 1510675,
                  'filename': '03_中泰证券_氟化工龙头_六氟VC高弹性品种_20210615.pdf',
                  'title_terms': ['氟化工龙头', 'VC'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(ap_code: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{ap_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{ap_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{ap_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{ap_code}_1.pdf',
              ]
              referers = [
                  f'https://data.eastmoney.com/report/zw_stock.jshtml?infocode={ap_code}',
                  'https://data.eastmoney.com/report/',
              ]
              attempts: list[dict[str, Any]] = []
              for url in urls:
                  for referer in referers:
                      for attempt in range(4):
                          try:
                              r = session.get(
                                  url,
                                  headers={'Referer': referer},
                                  timeout=(25, 300),
                                  allow_redirects=True,
                              )
                              meta = {
                                  'requested_url': url,
                                  'referer': referer,
                                  'status': r.status_code,
                                  'final_url': r.url,
                                  'content_type': r.headers.get('content-type', ''),
                                  'bytes': len(r.content),
                              }
                              attempts.append(meta)
                              if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 100_000:
                                  return r.content, url, {'successful': meta, 'attempts': attempts}
                          except Exception as exc:
                              attempts.append({'requested_url': url, 'referer': referer, 'error': repr(exc)})
                          time.sleep(1 + attempt)
              raise RuntimeError(f'Unable to download {ap_code}: {attempts[-8:]}')

          manifest: list[dict[str, Any]] = []
          for report in REPORTS:
              data, source_url, download_log = download_pdf(report['ap_code'])
              dest = ROOT / report['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f'Page count mismatch for {dest.name}: {pages} != {report["expected_pages"]}')

              text_parts: list[str] = []
              for page in reader.pages[:min(8, pages)]:
                  try:
                      text_parts.append(page.extract_text() or '')
                  except Exception:
                      pass
              text = '\n'.join(text_parts).replace(' ', '')
              issuer_ok = ('永太科技' in text) or ('002326' in text)
              broker_ok = report['broker'] in text
              title_hits = sum(term.replace(' ', '') in text for term in report['title_terms'])
              if not issuer_ok:
                  raise RuntimeError(f'Issuer identity not found in {dest.name}')
              if not broker_ok:
                  raise RuntimeError(f'Broker identity not found in {dest.name}')
              if title_hits < 1:
                  raise RuntimeError(f'Report title terms not found in {dest.name}')

              qpdf = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )

              sample_pages = sorted(set([1, max(1, (pages + 1) // 2), pages]))
              rendered: list[str] = []
              for page_no in sample_pages:
                  prefix = VALIDATION / f'{report["seq"]:02d}_{report["broker"]}_第{page_no}页'
                  subprocess.run(
                      ['pdftoppm', '-f', str(page_no), '-l', str(page_no), '-png', '-r', '120', '-singlefile', str(dest), str(prefix)],
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  png = Path(str(prefix) + '.png')
                  if not png.exists() or png.stat().st_size < 10_000:
                      raise RuntimeError(f'Page render failed: {dest.name} page {page_no}')
                  rendered.append(str(Path('抽样页校验') / png.name))

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{k: v for k, v in report.items() if k not in {'title_terms'}},
                  'source_pdf_url': source_url,
                  'eastmoney_detail_page': f'https://data.eastmoney.com/report/zw_stock.jshtml?infocode={report["ap_code"]}',
                  'actual_pages': pages,
                  'actual_bytes': len(data),
                  'sha256': sha,
                  'issuer_check': issuer_ok,
                  'broker_check': broker_ok,
                  'title_term_hits': title_hits,
                  'qpdf_output': qpdf.stdout.strip(),
                  'rendered_sample_pages': rendered,
                  'download_log': download_log,
              })

          readme = [
              '浙江永太科技股份有限公司（002326.SZ）券商深度报告资料包',
              '整理日期：2026-10-15',
              '',
              '本资料包收录3份公开可访问的券商公司深度/首次覆盖报告PDF原件。',
              '报告由东方财富公开研报PDF镜像取得，未重新排版、裁切或改写。',
              '',
          ]
          for item in manifest:
              readme += [
                  f"{item['seq']}. {item['broker']}｜{item['title']}",
                  f"   日期：{item['date']}；分析师：{item['analyst']}；评级：{item['rating']}",
                  f"   文件：{item['filename']}；页数：{item['actual_pages']}；大小：{item['actual_bytes']}字节",
                  f"   来源标识：{item['ap_code']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '核验说明：逐份检查PDF文件头、公司名称/证券代码、券商名称、标题关键词、实际页数和qpdf结构；另渲染首页、中间页和末页进行可读性抽样。',
              '版权归报告发布机构及作者所有，本资料仅供研究使用，不构成投资建议。',
          ]
          (ROOT / 'README_报告清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          with (ROOT / 'manifest.csv').open('w', newline='', encoding='utf-8-sig') as f:
              w = csv.writer(f)
              w.writerow(['序号','券商','报告日期','报告标题','分析师','评级','文件名','页数','字节数','SHA-256','来源标识','PDF地址'])
              for item in manifest:
                  w.writerow([
                      item['seq'], item['broker'], item['date'], item['title'], item['analyst'], item['rating'],
                      item['filename'], item['actual_pages'], item['actual_bytes'], item['sha256'], item['ap_code'], item['source_pdf_url'],
                  ])
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{item['sha256']}  {item['filename']}" for item in manifest) + '\n',
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      zf.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')

          print(json.dumps({
              'zip': str(zip_path),
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'reports': [
                  {'filename': x['filename'], 'broker': x['broker'], 'pages': x['actual_pages'], 'bytes': x['actual_bytes'], 'sha256': x['sha256']}
                  for x in manifest
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-broker-deep-reports-3-20261015
          path: 永太科技_002326_券商深度报告_3份.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
