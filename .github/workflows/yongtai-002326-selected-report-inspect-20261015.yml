name: Inspect public Yongtai report mirror pages 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and inspect report mirror pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          cat > /tmp/report_mirror_probe.py <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          targets = [
              ("sdyanbao_guolian", "https://www.sdyanbao.com/detail/296135"),
              ("fxbaogao_guosheng", "https://www.fxbaogao.com/detail/2745967"),
              ("sgpjbg_guosheng", "https://www.sgpjbg.com.cn/bgdown/45064.html"),
          ]
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })
          results = []
          for label, url in targets:
              try:
                  response = session.get(url, timeout=(20, 120), allow_redirects=True)
                  raw = response.content
                  encoding = response.apparent_encoding or response.encoding or "utf-8"
                  text = raw.decode(encoding, errors="replace")
                  Path(label + ".html").write_text(text, encoding="utf-8")
                  soup = BeautifulSoup(text, "lxml")
                  links = []
                  for anchor in soup.find_all("a", href=True):
                      links.append({
                          "text": " ".join(anchor.get_text(" ", strip=True).split()),
                          "href": urljoin(response.url, anchor.get("href")),
                          "onclick": anchor.get("onclick"),
                          "class": anchor.get("class"),
                      })
                  scripts = []
                  for script in soup.find_all("script"):
                      scripts.append({
                          "src": urljoin(response.url, script.get("src")) if script.get("src") else None,
                          "body": script.get_text("\n", strip=True)[:20000],
                      })
                  forms = []
                  for form in soup.find_all("form"):
                      forms.append({
                          "action": urljoin(response.url, form.get("action", "")),
                          "method": form.get("method"),
                          "html": str(form)[:10000],
                      })
                  visible = "\n".join(line.strip() for line in soup.get_text("\n").splitlines() if line.strip())
                  filtered = []
                  for link in links:
                      probe = (link["href"] + " " + link["text"] + " " + str(link["onclick"])).lower()
                      if any(key in probe for key in ["pdf", "download", "down", "file", "报告", "下载", "完整"]):
                          filtered.append(link)
                  relevant_scripts = []
                  for script in scripts:
                      probe = ((script.get("src") or "") + " " + script.get("body", "")).lower()
                      if any(key in probe for key in ["pdf", "download", "down", "file", "api", "report"]):
                          relevant_scripts.append(script)
                  result = {
                      "label": label,
                      "input_url": url,
                      "status": response.status_code,
                      "final_url": response.url,
                      "content_type": response.headers.get("content-type"),
                      "bytes": len(raw),
                      "title": soup.title.get_text(" ", strip=True) if soup.title else None,
                      "visible": visible[:15000],
                      "filtered_links": filtered,
                      "all_links": links,
                      "forms": forms,
                      "relevant_scripts": relevant_scripts,
                      "all_scripts": scripts,
                  }
                  results.append(result)
                  print("TARGET", label, "STATUS", response.status_code, "FINAL", response.url, "BYTES", len(raw))
                  print("TITLE", result["title"])
                  print("VISIBLE", visible[:5000])
                  print("FILTERED_LINKS", json.dumps(filtered, ensure_ascii=False))
                  print("FORMS", json.dumps(forms, ensure_ascii=False))
                  print("RELEVANT_SCRIPTS", json.dumps(relevant_scripts, ensure_ascii=False))
              except Exception as exc:
                  results.append({"label": label, "input_url": url, "error": repr(exc)})
                  print("ERROR", label, repr(exc))
          Path("yongtai_report_mirror_inspection.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          cd /tmp
          python report_mirror_probe.py
          cp yongtai_report_mirror_inspection.json "$GITHUB_WORKSPACE/"
          cp *.html "$GITHUB_WORKSPACE/"
      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-report-mirror-inspection
          path: |
            yongtai_report_mirror_inspection.json
            *.html
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
