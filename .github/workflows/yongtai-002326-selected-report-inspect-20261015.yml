name: Probe public Fxbaogao viewers with browser network capture 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Capture viewer network traffic
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import asyncio
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          TARGETS = [
              ('guolian_3393203', 'https://www.fxbaogao.com/view?id=3393203'),
              ('guosheng_2745967', 'https://www.fxbaogao.com/view?id=2745967'),
              ('zhongtai_2714314', 'https://www.fxbaogao.com/view?id=2714314'),
          ]

          async def main():
              results=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
                  context=await browser.new_context(
                      viewport={'width':1440,'height':1000},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36',
                      locale='zh-CN',
                  )
                  for label,url in TARGETS:
                      page=await context.new_page()
                      responses=[]
                      requests=[]
                      console=[]
                      page.on('console', lambda msg, c=console: c.append({'type':msg.type,'text':msg.text}))
                      def on_request(req):
                          u=req.url
                          if any(k in u.lower() for k in ['pdf','report','document','preview','image','api','file','readreport']):
                              requests.append({'url':u,'method':req.method,'resource_type':req.resource_type,'post_data':req.post_data})
                      async def on_response(resp):
                          u=resp.url
                          try:
                              ct=(await resp.all_headers()).get('content-type','')
                          except Exception:
                              ct=''
                          if any(k in u.lower() for k in ['pdf','report','document','preview','image','api','file','readreport']) or any(k in ct.lower() for k in ['pdf','json','image']):
                              rec={'url':u,'status':resp.status,'content_type':ct,'resource_type':resp.request.resource_type}
                              try:
                                  headers=await resp.all_headers()
                                  rec['content_length']=headers.get('content-length')
                                  rec['content_disposition']=headers.get('content-disposition')
                              except Exception:
                                  pass
                              responses.append(rec)
                      page.on('request',on_request)
                      page.on('response',on_response)
                      error=None
                      try:
                          await page.goto(url,wait_until='domcontentloaded',timeout=120000)
                          await page.wait_for_timeout(20000)
                          await page.screenshot(path=f'{label}.png',full_page=True)
                          html=await page.content()
                          Path(f'{label}.html').write_text(html,encoding='utf-8')
                          frames=[]
                          for f in page.frames:
                              frames.append({'name':f.name,'url':f.url})
                          dom=await page.evaluate('''() => ({
                            title: document.title,
                            url: location.href,
                            bodyText: document.body ? document.body.innerText.slice(0,20000) : '',
                            iframes: Array.from(document.querySelectorAll('iframe')).map(x=>({src:x.src,id:x.id,name:x.name})),
                            images: Array.from(document.images).map(x=>x.src).filter(Boolean).slice(0,1000),
                            anchors: Array.from(document.querySelectorAll('a')).map(x=>({text:(x.innerText||'').trim(),href:x.href})).filter(x=>x.href).slice(0,1000),
                            localStorage: Object.fromEntries(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)])),
                            sessionStorage: Object.fromEntries(Object.keys(sessionStorage).map(k=>[k,sessionStorage.getItem(k)]))
                          })''')
                          cookies=await context.cookies()
                      except Exception as exc:
                          error=repr(exc); frames=[]; dom={}; cookies=[]
                      rec={'label':label,'input_url':url,'error':error,'frames':frames,'dom':dom,'cookies':cookies,'requests':requests,'responses':responses,'console':console}
                      results.append(rec)
                      print('\nTARGET',label,'ERROR',error)
                      print('FRAMES',json.dumps(frames,ensure_ascii=False,indent=2))
                      print('DOM',json.dumps(dom,ensure_ascii=False,indent=2)[:50000])
                      print('REQUESTS',json.dumps(requests,ensure_ascii=False,indent=2)[:100000])
                      print('RESPONSES',json.dumps(responses,ensure_ascii=False,indent=2)[:100000])
                      await page.close()
                  await browser.close()
              Path('fxbaogao_browser_probe.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          asyncio.run(main())
          PY
          cd /tmp
          python probe.py
          cp fxbaogao_browser_probe.json "$GITHUB_WORKSPACE/"
          cp *.html *.png "$GITHUB_WORKSPACE/" || true

      - name: Upload browser probe
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-browser-probe
          path: |
            fxbaogao_browser_probe.json
            *.html
            *.png
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
