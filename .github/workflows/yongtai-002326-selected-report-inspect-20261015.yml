name: Inspect Yongtai nxny report pages 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and inspect nxny report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          cat > /tmp/inspect.py <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          report_ids = ["5082611", "4704283", "4682955", "4205536"]
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36",
              "Referer": "https://www.nxny.com/stock/stock_002326/",
          })
          results = []
          for report_id in report_ids:
              url = "https://www.nxny.com/report/view_" + report_id + ".html"
              response = session.get(url, timeout=(20, 90), allow_redirects=True)
              raw = response.content
              encoding = response.apparent_encoding or "utf-8"
              text = raw.decode(encoding, errors="replace")
              Path("nxny_" + report_id + ".html").write_text(text, encoding="utf-8")
              soup = BeautifulSoup(text, "lxml")
              links = []
              for anchor in soup.find_all("a", href=True):
                  links.append({
                      "text": " ".join(anchor.get_text(" ", strip=True).split()),
                      "href": urljoin(response.url, anchor.get("href")),
                  })
              scripts = []
              for script in soup.find_all("script"):
                  scripts.append({
                      "src": urljoin(response.url, script.get("src")) if script.get("src") else None,
                      "body": script.get_text("\n", strip=True)[:12000],
                  })
              forms = []
              for form in soup.find_all("form"):
                  forms.append({
                      "action": urljoin(response.url, form.get("action", "")),
                      "method": form.get("method"),
                      "html": str(form)[:5000],
                  })
              visible = "\n".join(line.strip() for line in soup.get_text("\n").splitlines() if line.strip())
              result = {
                  "report_id": report_id,
                  "status": response.status_code,
                  "final_url": response.url,
                  "bytes": len(raw),
                  "title": soup.title.get_text(" ", strip=True) if soup.title else None,
                  "visible": visible[:10000],
                  "links": links,
                  "scripts": scripts,
                  "forms": forms,
                  "html_contains_pdf": ".pdf" in text.lower(),
                  "html_contains_download": "download" in text.lower(),
              }
              results.append(result)
              print("REPORT", report_id, "STATUS", response.status_code, "BYTES", len(raw))
              print("TITLE", result["title"])
              print("VISIBLE", visible[:4000])
              print("LINKS", json.dumps(links, ensure_ascii=False))
              print("FORMS", json.dumps(forms, ensure_ascii=False))
              print("SCRIPTS", json.dumps(scripts, ensure_ascii=False))
          Path("yongtai_nxny_inspection.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          python /tmp/inspect.py
      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-nxny-report-inspection
          path: |
            yongtai_nxny_inspection.json
            nxny_*.html
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
