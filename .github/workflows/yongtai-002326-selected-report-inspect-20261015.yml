name: Inspect Fxbaogao PDF viewer route chunks 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download PDF viewer route chunks and extract API usage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          cat > /tmp/chunk_probe.py <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          import requests

          URLS = {
              "chunk40_view": "https://www.fxbaogao.com/_fxbg/2610141742/js/40.3e6ab8c547af2192c545.chunk.js",
              "chunk15_compat": "https://www.fxbaogao.com/_fxbg/2610141742/js/15.c64c70f93fa3c6a82491.chunk.js",
              "chunk59_pdf": "https://www.fxbaogao.com/_fxbg/2610141742/js/59.03273104e144099cc82e.chunk.js",
              "chunk0_common": "https://www.fxbaogao.com/_fxbg/2610141742/js/common.0e0bc74c3741c410fee2.chunk.js",
              "chunk1_icons": "https://www.fxbaogao.com/_fxbg/2610141742/js/fx-icons.592964feecae691e9bbb.chunk.js",
          }
          s = requests.Session(); s.trust_env = False
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://www.fxbaogao.com/view?id=2745967"})
          out = []
          for label, url in URLS.items():
              try:
                  r = s.get(url, timeout=(20,120), allow_redirects=True)
                  text = r.content.decode(r.apparent_encoding or "utf-8", errors="replace")
                  path = Path(label + ".js"); path.write_text(text, encoding="utf-8")
                  patterns = [
                      r'.{0,1000}readReport.{0,1500}',
                      r'.{0,1000}searchReport/detail.{0,1500}',
                      r'.{0,1000}pdfPath.{0,1500}',
                      r'.{0,1000}reportId.{0,1500}',
                      r'.{0,1000}docId.{0,1500}',
                      r'.{0,1000}getReportPreviewImages.{0,1500}',
                      r'.{0,1000}downloadReport.{0,1500}',
                      r'.{0,1000}preDownV2.{0,1500}',
                      r'.{0,1000}urlPdf.{0,1500}',
                      r'.{0,1000}searchJson.{0,1500}',
                  ]
                  matches = []
                  for pat in patterns:
                      for m in re.finditer(pat, text, re.I|re.S):
                          v = " ".join(m.group(0).split())
                          if v not in matches:
                              matches.append(v)
                          if len(matches) >= 300:
                              break
                  urls = []
                  for m in re.finditer(r'https?://[^\s\"\'<>]+', text):
                      if m.group(0) not in urls:
                          urls.append(m.group(0))
                  rec = {"label":label,"url":url,"status":r.status_code,"bytes":len(r.content),"matches":matches,"urls":urls}
                  out.append(rec)
                  print("\nCHUNK",label,"STATUS",r.status_code,"BYTES",len(r.content))
                  print("MATCHES",json.dumps(matches,ensure_ascii=False)[:100000])
              except Exception as exc:
                  out.append({"label":label,"url":url,"error":repr(exc)})
                  print("ERROR",label,repr(exc))
          Path("fxbaogao_pdf_route_chunks.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          cd /tmp
          python chunk_probe.py
          cp fxbaogao_pdf_route_chunks.json "$GITHUB_WORKSPACE/"
          cp *.js "$GITHUB_WORKSPACE/"
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-pdf-route-chunks
          path: |
            fxbaogao_pdf_route_chunks.json
            *.js
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
