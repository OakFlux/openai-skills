name: Inspect Yongtai 002326 selected Sina reports 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and inspect selected report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ids=['679405923438','677666426354','676861468404','625759584362','738146730794','717802745195']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Referer':'https://stock.finance.sina.com.cn/'})
          out=[]
          for rid in ids:
            url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
            r=s.get(url,timeout=(20,90),allow_redirects=True)
            raw=r.content
            text=raw.decode('gb18030',errors='replace')
            p=Path(f'sina_{rid}.html'); p.write_text(text,encoding='utf-8')
            soup=BeautifulSoup(text,'lxml')
            title=soup.title.get_text(' ',strip=True) if soup.title else ''
            visible='\n'.join(x.strip() for x in soup.get_text('\n').splitlines() if x.strip())
            links=[]
            for a in soup.find_all('a',href=True):
              links.append({'text':' '.join(a.get_text(' ',strip=True).split()),'href':urljoin(r.url,a['href'])})
            urls=sorted(set(re.findall(r'https?://[^\s\"\'<>]+',text)))
            pdfs=[u for u in urls if '.pdf' in u.lower() or 'pdf' in u.lower()]
            meta={
              'rid':rid,'url':url,'status':r.status_code,'bytes':len(raw),'title_tag':title,
              'visible_head':visible[:5000],
              'links':[x for x in links if any(k in (x['href']+' '+x['text']).lower() for k in ['pdf','down','download','report','研报','报告'])][:200],
              'pdf_like_urls':pdfs[:200],
              'keywords':{k:([m.start() for m in re.finditer(k,text,re.I)][:20]) for k in ['pdf','download','rptid','report','研报','报告']}
            }
            out.append(meta)
            print('\nRID',rid,'STATUS',r.status_code,'BYTES',len(raw),'TITLE',title)
            print(visible[:2500])
            print('PDFLIKE',json.dumps(pdfs[:50],ensure_ascii=False))
            print('FILTERED LINKS',json.dumps(meta['links'][:50],ensure_ascii=False))
          Path('yongtai_selected_sina_report_inspection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-selected-sina-report-inspection
          path: |
            yongtai_selected_sina_report_inspection.json
            sina_*.html
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
