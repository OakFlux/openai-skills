name: Download Fxbaogao PDF viewer chunks efficiently 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download route chunks and compact keyword contexts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          cat > /tmp/chunk_download.py <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import requests

          URLS = {
              "chunk40_view": "https://www.fxbaogao.com/_fxbg/2610141742/js/40.3e6ab8c547af2192c545.chunk.js",
              "chunk15_compat": "https://www.fxbaogao.com/_fxbg/2610141742/js/15.c64c70f93fa3c6a82491.chunk.js",
              "chunk59_pdf": "https://www.fxbaogao.com/_fxbg/2610141742/js/59.03273104e144099cc82e.chunk.js",
              "chunk0_common": "https://www.fxbaogao.com/_fxbg/2610141742/js/common.0e0bc74c3741c410fee2.chunk.js",
              "chunk1_icons": "https://www.fxbaogao.com/_fxbg/2610141742/js/fx-icons.592964feecae691e9bbb.chunk.js",
          }
          KEYWORDS = [
              "readReport", "searchReport/detail", "pdfPath", "reportId", "docId",
              "getReportPreviewImages", "downloadReport", "preDownV2", "urlPdf",
              "searchJson", "report-image", "originPdfName", "getUrlAfterPay",
          ]
          s = requests.Session(); s.trust_env = False
          s.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://www.fxbaogao.com/view?id=2745967"})
          summary = []
          for label, url in URLS.items():
              try:
                  r = s.get(url, timeout=(20,120), allow_redirects=True)
                  text = r.content.decode(r.apparent_encoding or "utf-8", errors="replace")
                  Path(label + ".js").write_text(text, encoding="utf-8")
                  contexts = []
                  lower = text.lower()
                  for keyword in KEYWORDS:
                      key = keyword.lower()
                      start = 0
                      seen = 0
                      while seen < 40:
                          idx = lower.find(key, start)
                          if idx < 0:
                              break
                          left = max(0, idx - 900)
                          right = min(len(text), idx + len(keyword) + 1600)
                          snippet = " ".join(text[left:right].split())
                          contexts.append({"keyword":keyword,"index":idx,"context":snippet})
                          seen += 1
                          start = idx + len(key)
                  rec = {"label":label,"url":url,"status":r.status_code,"bytes":len(r.content),"contexts":contexts}
                  summary.append(rec)
                  print("CHUNK",label,"STATUS",r.status_code,"BYTES",len(r.content),"CONTEXTS",len(contexts))
                  for item in contexts[:100]:
                      print(item["keyword"], item["index"], item["context"][:4000])
              except Exception as exc:
                  summary.append({"label":label,"url":url,"error":repr(exc)})
                  print("ERROR",label,repr(exc))
          Path("fxbaogao_pdf_route_chunks_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          cd /tmp
          python chunk_download.py
          cp fxbaogao_pdf_route_chunks_summary.json "$GITHUB_WORKSPACE/"
          cp *.js "$GITHUB_WORKSPACE/"
      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-pdf-viewer-chunks
          path: |
            fxbaogao_pdf_route_chunks_summary.json
            *.js
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
