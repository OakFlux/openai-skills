name: Inspect Sdyanbao public search APIs for Yongtai reports 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download Nuxt assets and extract API/search contexts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          cat > /tmp/sdyanbao_js_probe.py <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          import requests

          base='https://www.sdyanbao.com'
          assets=['/_nuxt/0bec462.js','/_nuxt/7ff3a18.js','/_nuxt/359ac1f.js','/_nuxt/a94fdf1.js']
          keywords=['baseURL','api','search','detail','download','report','data_source_uuid','original_id','keyword','oss.sdyanbao','page_url','file_url','pdf']
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/detail/296135'})
          out=[]
          for idx,path in enumerate(assets):
              url=base+path
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
                  dest=Path(f'asset_{idx}.js');dest.write_text(text,encoding='utf-8')
                  contexts=[];lower=text.lower()
                  for kw in keywords:
                      key=kw.lower();start=0;seen=0
                      while seen<100:
                          pos=lower.find(key,start)
                          if pos<0:break
                          snippet=' '.join(text[max(0,pos-700):min(len(text),pos+len(kw)+1300)].split())
                          contexts.append({'keyword':kw,'index':pos,'context':snippet})
                          start=pos+len(key);seen+=1
                  urls=[]
                  for m in re.finditer(r'https?://[^\s\"\'<>]+',text):
                      u=m.group(0)
                      if u not in urls:urls.append(u)
                  paths=[]
                  for m in re.finditer(r'[\"\'](/[^\"\']{1,180})[\"\']',text):
                      p=m.group(1)
                      if any(k in p.lower() for k in ['api','search','detail','download','report']):
                          if p not in paths:paths.append(p)
                  rec={'asset':path,'status':r.status_code,'bytes':len(r.content),'urls':urls,'paths':paths,'contexts':contexts}
                  out.append(rec)
                  print('\nASSET',path,'STATUS',r.status_code,'BYTES',len(r.content))
                  print('URLS',json.dumps(urls,ensure_ascii=False)[:50000])
                  print('PATHS',json.dumps(paths,ensure_ascii=False)[:50000])
                  for c in contexts[:200]:print(c['keyword'],c['index'],c['context'][:3500])
              except Exception as e:
                  out.append({'asset':path,'error':repr(e)})
                  print('ERROR',path,repr(e))
          Path('sdyanbao_js_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          cd /tmp
          python sdyanbao_js_probe.py
          cp sdyanbao_js_probe.json "$GITHUB_WORKSPACE/"
          cp asset_*.js "$GITHUB_WORKSPACE/"
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-js-search-api-probe
          path: |
            sdyanbao_js_probe.json
            asset_*.js
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
