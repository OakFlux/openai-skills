name: Probe public Fxbaogao report APIs for Yongtai reports 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe report metadata and public file endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          cat > /tmp/fxbaogao_api_probe.py <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from typing import Any
          import requests

          REPORTS = [
              {"id": "3393203", "key": "guolian_20220929"},
              {"id": "2745967", "key": "guosheng_20210712"},
              {"id": "2714314", "key": "zhongtai_20210615"},
          ]
          BASE = "https://api.fxbaogao.com"
          ENDPOINTS = [
              ("GET", "/mofoun/report/readReport/readReport", "params"),
              ("GET", "/mofoun/report/searchReport/detail", "params"),
              ("GET", "/mofoun/report/report/getReportPreviewImages", "params"),
              ("GET", "/mofoun/report/searchReport/detail/catalog", "params"),
              ("GET", "/mofoun/report/report/downloadReportByBean", "params"),
              ("GET", "/mofoun/report/report/file/downloadReport", "params"),
              ("GET", "/mofoun/report/report/report/preDownV2", "params"),
              ("GET", "/mofoun/report/report/report/getUrlAfterPay", "params"),
              ("POST", "/mofoun/report/readReport/readReport", "json"),
              ("POST", "/mofoun/report/searchReport/detail", "json"),
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Origin": "https://www.fxbaogao.com",
          })

          def parse_response(r: requests.Response) -> dict[str, Any]:
              record: dict[str, Any] = {
                  "status": r.status_code,
                  "final_url": r.url,
                  "content_type": r.headers.get("content-type"),
                  "content_length": r.headers.get("content-length"),
                  "location": r.headers.get("location"),
                  "bytes": len(r.content),
                  "headers": {k: v for k, v in r.headers.items() if k.lower() in {
                      "content-type", "content-length", "location", "content-disposition", "set-cookie", "x-cache", "server"
                  }},
              }
              if r.content[:5] == b"%PDF-":
                  record["is_pdf"] = True
                  record["body_head_hex"] = r.content[:32].hex()
                  return record
              try:
                  obj = r.json()
                  record["json"] = obj
              except Exception:
                  record["text"] = r.text[:12000]
              return record

          output: list[dict[str, Any]] = []
          for report in REPORTS:
              rid = report["id"]
              referer = f"https://www.fxbaogao.com/view?id={rid}"
              entry: dict[str, Any] = {**report, "requests": []}
              for method, path, mode in ENDPOINTS:
                  url = BASE + path
                  kwargs: dict[str, Any] = {
                      "timeout": (20, 120),
                      "allow_redirects": False,
                      "headers": {"Referer": referer},
                  }
                  payload = {"reportId": rid}
                  if path.endswith("getUrlAfterPay"):
                      payload = {"reportId": rid}
                  if mode == "params":
                      kwargs["params"] = payload
                  elif mode == "json":
                      kwargs["json"] = payload
                  try:
                      response = session.request(method, url, **kwargs)
                      rec = {
                          "method": method,
                          "path": path,
                          "mode": mode,
                          **parse_response(response),
                      }
                      entry["requests"].append(rec)
                      print("\nREPORT", rid, method, path, "STATUS", response.status_code, "BYTES", len(response.content), "CTYPE", response.headers.get("content-type"))
                      if "json" in rec:
                          print(json.dumps(rec["json"], ensure_ascii=False, indent=2)[:30000])
                      else:
                          print(rec.get("text", "")[:12000])
                  except Exception as exc:
                      rec = {"method": method, "path": path, "mode": mode, "error": repr(exc)}
                      entry["requests"].append(rec)
                      print("ERROR", rid, method, path, repr(exc))
              output.append(entry)

          Path("fxbaogao_yongtai_api_probe.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
          cd /tmp
          python fxbaogao_api_probe.py
          cp fxbaogao_yongtai_api_probe.json "$GITHUB_WORKSPACE/"

      - name: Upload API probe output
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-yongtai-api-probe
          path: fxbaogao_yongtai_api_probe.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
