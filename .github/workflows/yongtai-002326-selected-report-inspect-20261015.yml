name: Search Sdyanbao for Yongtai deep reports and source codes 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-selected-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query public search and detail APIs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          cat > /tmp/sdyanbao_search.py <<'PY'
          from __future__ import annotations
          import json
          import time
          from pathlib import Path
          from typing import Any
          import requests

          API = 'https://api.sdyanbao.com'
          QUERIES = [
              '永太科技',
              '构建产业链一体化，打造业绩新曲线',
              '从含氟精细化学品出发，抢攻锂电池电解液材料制高点',
              '氟化工龙头，六氟、VC高弹性品种',
              '六氟磷酸锂新工艺助力公司弯道超车',
          ]
          TARGET_PHRASES = ['永太科技','含氟精细化学品','六氟','VC','产业链一体化','弯道超车']

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Content-Type':'application/json;charset=UTF-8',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/report',
          })

          def request_json(method: str, path: str, *, data: dict[str, Any] | None = None) -> dict[str, Any]:
              last: Any = None
              for attempt in range(6):
                  try:
                      r = session.request(method, API + path, json=data, timeout=(20,120), allow_redirects=True)
                      rec: dict[str, Any] = {
                          'request': {'method':method,'path':path,'data':data},
                          'status_code':r.status_code,
                          'final_url':r.url,
                          'content_type':r.headers.get('content-type'),
                          'bytes':len(r.content),
                      }
                      try:
                          rec['response'] = r.json()
                      except Exception:
                          rec['text'] = r.text[:20000]
                      return rec
                  except Exception as exc:
                      last = repr(exc)
                      time.sleep(1 + attempt)
              return {'request':{'method':method,'path':path,'data':data},'error':last}

          output: dict[str, Any] = {'searches':[], 'details':[]}
          ids: set[int] = set()
          for query in QUERIES:
              for only_title in [1,0]:
                  payload = {
                      'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,
                      'page':1,'pageSize':100,'keyword':query,'pageCount':0,
                      'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'',
                  }
                  rec = request_json('POST','/api/file/search',data=payload)
                  rec['query'] = query
                  rec['onlyTitle'] = only_title
                  output['searches'].append(rec)
                  print('\nSEARCH',query,'ONLY_TITLE',only_title,'HTTP',rec.get('status_code'))
                  response = rec.get('response')
                  print(json.dumps(response,ensure_ascii=False,indent=2)[:100000] if response is not None else rec.get('text',''))
                  if isinstance(response,dict):
                      data = response.get('data')
                      if isinstance(data,dict):
                          rows = data.get('files') or data.get('items') or data.get('data') or []
                          if isinstance(rows,list):
                              for row in rows:
                                  if isinstance(row,dict) and row.get('id') is not None:
                                      title = str(row.get('name') or row.get('title') or '')
                                      if query == '永太科技' or any(p in title for p in TARGET_PHRASES):
                                          try: ids.add(int(row['id']))
                                          except Exception: pass
                  time.sleep(0.15)

          # Include known public detail IDs to ensure complete metadata retrieval.
          ids.update([296135,3393203,2745967,2714314])
          for file_id in sorted(ids):
              rec = request_json('POST','/api/file/detail',data={'id':file_id})
              rec['file_id'] = file_id
              output['details'].append(rec)
              print('\nDETAIL',file_id,'HTTP',rec.get('status_code'))
              response = rec.get('response')
              print(json.dumps(response,ensure_ascii=False,indent=2)[:100000] if response is not None else rec.get('text',''))
              time.sleep(0.1)

          Path('sdyanbao_yongtai_search_results.json').write_text(
              json.dumps(output,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          PY
          cd /tmp
          python sdyanbao_search.py
          cp sdyanbao_yongtai_search_results.json "$GITHUB_WORKSPACE/"

      - name: Upload search output
        uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-yongtai-search-results
          path: sdyanbao_yongtai_search_results.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
