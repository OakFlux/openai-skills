name: Probe Shaanxi Jinye report API parameters

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect API params and query variants
        shell: bash
        run: |
          python3 -m pip install --quiet requests
          python3 - <<'PY'
          import itertools, json, re, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/000812.html'})
          js='https://data.eastmoney.com/newstatic/js/report/singlestock.js'
          r=s.get(js,timeout=(10,60)); print('JS',r.status_code,len(r.content),r.url)
          text=r.text
          for needle in ['report/list','qType','beginTime','orgCode','ratingChange','stockCode']:
              print('\nNEEDLE',needle)
              start=0
              count=0
              while True:
                  i=text.find(needle,start)
                  if i<0 or count>=8: break
                  print(text[max(0,i-1500):min(len(text),i+2500)])
                  start=i+len(needle); count+=1

          base='https://reportapi.eastmoney.com/report/list'
          codes=['000812','SZ000812','000812.SZ','812','']
          qtypes=['0','1','2','3']
          fields=['','*']
          for code,qtype,field in itertools.product(codes,qtypes,fields):
              params={'pageSize':'100','pageNo':'1','fields':field,'qType':qtype,'orgCode':'','code':code,'industryCode':'*','industry':'*','rating':'','ratingChange':'','beginTime':'2000-01-01','endTime':'2026-10-29','pageNum':'1'}
              try:
                  x=s.get(base,params=params,timeout=(10,40))
                  body=x.text
                  m=re.search(r'\{.*\}',body,re.S)
                  obj=json.loads(m.group(0)) if m else {}
                  hits=obj.get('hits')
                  if hits or x.status_code!=200:
                      print('RESULT',x.status_code,'code',code,'qType',qtype,'fields',repr(field),'hits',hits,'size',obj.get('size'),'url',x.url)
                      print(body[:5000])
              except Exception as e: print('ERR',code,qtype,field,repr(e))
          PY
