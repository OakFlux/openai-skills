name: Temporary fxbaogao viewer network probe

on:
  push:
    branches:
      - tmp/china-everbright-fxbaogao-view-20260831

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml selenium
      - name: Inspect viewer HTML and browser network
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json,re,shutil,time,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          OUT=Path('out');OUT.mkdir()
          urls=['https://www.fxbaogao.com/view?id=5040903','https://www.fxbaogao.com/view/5040903','https://www.fxbaogao.com/view?id=5370196']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Referer':'https://www.fxbaogao.com/detail/5040903','Accept-Language':'zh-CN,zh;q=0.9'})
          result={'static':[],'browser':[]}
          for idx,u in enumerate(urls):
            try:
              r=s.get(u,timeout=45,allow_redirects=True);r.encoding=r.apparent_encoding or r.encoding
              html=r.text;soup=BeautifulSoup(html,'lxml');text=soup.get_text('\n',strip=True)
              scripts=[]
              for sc in soup.find_all('script'):
                src=sc.get('src');val=sc.string or sc.get_text('',strip=False)
                scripts.append({'src':urllib.parse.urljoin(r.url,src) if src else None,'len':len(val),'inline':val[:3000] if val and any(k in val.lower() for k in ['5040903','pdf','report','page','download','api']) else ''})
              resources=[]
              for tag in soup.find_all(True):
                for attr in ['href','src','data-src','data','value','action','onclick']:
                  v=tag.get(attr)
                  if not v: continue
                  if any(k in str(v).lower() for k in ['5040903','pdf','report','page','download','api','image','file']):
                    resources.append({'tag':tag.name,'attr':attr,'value':str(v),'full':urllib.parse.urljoin(r.url,str(v)),'text':tag.get_text(' ',strip=True)[:100],'attrs':dict(tag.attrs)})
              item={'requested':u,'url':r.url,'status':r.status_code,'html_len':len(html),'text_len':len(text),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'scripts':scripts,'resources':resources[:500],'raw_urls':[x for x in sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',html))) if any(k in x.lower() for k in ['pdf','report','page','download','api','image','file'])][:500],'text_start':text[:3000],'text_end':text[-5000:]}
              result['static'].append(item);(OUT/f'static_{idx}.html').write_text(html,encoding='utf-8');print('STATIC',json.dumps(item,ensure_ascii=False),flush=True)
            except Exception as exc:
              result['static'].append({'requested':u,'error':repr(exc)});print('STATIC_ERROR',u,repr(exc),flush=True)

          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage');opts.add_argument('--window-size=1500,1800');opts.add_argument('--disable-gpu');opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
            for idx,u in enumerate(urls[:2]):
              try:
                driver.get(u);WebDriverWait(driver,30).until(lambda d:len(d.page_source)>500);time.sleep(5)
                source=driver.page_source;soup=BeautifulSoup(source,'lxml');text=soup.get_text('\n',strip=True);driver.save_screenshot(str(OUT/f'browser_{idx}.png'));(OUT/f'browser_{idx}.html').write_text(source,encoding='utf-8')
                reqs=[]
                for entry in driver.get_log('performance'):
                  try:
                    msg=json.loads(entry['message'])['message'];method=msg.get('method');params=msg.get('params') or {}
                    if method=='Network.requestWillBeSent':
                      req=params.get('request') or {};url=req.get('url') or ''
                      if any(k in url.lower() for k in ['5040903','pdf','report','page','download','api','image','file']):reqs.append({'kind':'request','method':req.get('method'),'url':url,'postData':req.get('postData')})
                    elif method=='Network.responseReceived':
                      resp=params.get('response') or {};url=resp.get('url') or ''
                      if any(k in url.lower() for k in ['5040903','pdf','report','page','download','api','image','file']):reqs.append({'kind':'response','status':resp.get('status'),'mime':resp.get('mimeType'),'url':url})
                  except Exception:pass
                resources=[]
                for tag in soup.find_all(True):
                  for attr in ['href','src','data-src','data','value','action','onclick']:
                    v=tag.get(attr)
                    if v and any(k in str(v).lower() for k in ['5040903','pdf','report','page','download','api','image','file']):resources.append({'tag':tag.name,'attr':attr,'value':str(v),'full':urllib.parse.urljoin(driver.current_url,str(v)),'text':tag.get_text(' ',strip=True)[:100],'attrs':dict(tag.attrs)})
                item={'requested':u,'url':driver.current_url,'title':driver.title,'source_len':len(source),'text_len':len(text),'resources':resources[:700],'network':reqs[:1000],'browser_log':driver.get_log('browser'),'text_start':text[:3000],'text_end':text[-5000:]}
                result['browser'].append(item);print('BROWSER',json.dumps(item,ensure_ascii=False),flush=True)
              except Exception as exc:
                result['browser'].append({'requested':u,'error':repr(exc)});print('BROWSER_ERROR',u,repr(exc),flush=True)
          finally:driver.quit()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload viewer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-view-network
          path: out/
          retention-days: 3
          if-no-files-found: error