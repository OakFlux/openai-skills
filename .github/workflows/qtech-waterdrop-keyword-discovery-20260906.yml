name: Discover complete Q Technology reports via public API 20260906

on:
  push:
    paths:
      - '.github/workflows/qtech-waterdrop-keyword-discovery-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query report search API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://api.sdyanbao.com/api/file/search'
          keywords=['丘钛科技','安卓光学升规','手机光学驱动利润弹性','AI助力手机行业回暖','车载 IoT高速成长','高端光学模组收益弹性高','光学稳步扩张 安卓升规']
          allrows={}
          for keyword in keywords:
            for only_title in (1,0):
              for page in range(1,4):
                body={'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,'page':page,'pageSize':100,'keyword':keyword,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
                data=json.dumps(body,ensure_ascii=False).encode('utf-8')
                req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
                try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                    payload=json.loads(r.read().decode('utf-8'))
                except Exception as e:
                  print('FAIL',keyword,only_title,page,repr(e),flush=True); break
                rows=(payload.get('data') or {}).get('files') or []
                total=int((payload.get('data') or {}).get('total') or 0)
                print('QUERY',keyword,'TITLE',only_title,'PAGE',page,'ROWS',len(rows),'TOTAL',total,flush=True)
                for x in rows:
                  text=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                  if any(t in text for t in ('丘钛科技','丘鈦科技','qtechnology','1478.hk','01478')):
                    allrows[str(x.get('id'))]=x
                if not rows or page*100>=total: break
          compact=[]
          for x in allrows.values():
            compact.append({
              'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'pages':x.get('page_count'),
              'page_url':x.get('page_url'),'share_url':x.get('share_url'),'data_source':x.get('data_source'),
              'uuid':x.get('data_source_uuid'),'type':(x.get('type') or {}).get('name'),
              'org':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),
              'stock':x.get('stock')
            })
          compact.sort(key=lambda z:(z.get('date') or '',z.get('pages') or 0),reverse=True)
          print('RESULTS',json.dumps(compact,ensure_ascii=False,indent=2),flush=True)
          PY
