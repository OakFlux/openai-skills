name: Temporary Fast Inspect SGPJBG Mengtai HTML

on:
  push:
    branches: [tmp/fetch-mengtai-reports-20260830]
    paths: [.github/workflows/tmp-sgpjbg-static-fast-mengtai.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: tmp/fetch-mengtai-reports-20260830, fetch-depth: 0}
      - name: Extract static clues
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin
          url='https://www.sgpjbg.com/baogao/141130.html'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36'},timeout=60);r.raise_for_status()
          text=html.unescape(r.text).replace('\\/','/')
          urls=[]
          for v in re.findall(r'(?:https?:)?//[^"\'<>\s]+|["\'](/[^"\']+)["\']',text,re.I):
            if isinstance(v,tuple):v=v[0]
            if not v:continue
            u=urljoin(r.url,v)
            if any(k in u.lower() for k in ['pdf','down','download','file','attach','preview','image','img','page','api','141130']):
              if u not in urls:urls.append(u)
          snippets=[]
          for needle in ['141130','pdf','download','down','file','attach','preview','pagecount','pageCount','reportId','baogaoId','docId','fileId','readUrl','viewUrl','原文','下载']:
            for m in list(re.finditer(needle,text,re.I))[:30]:
              snippets.append({'needle':needle,'text':re.sub(r'\s+',' ',text[max(0,m.start()-700):m.start()+2000])})
          scripts=[urljoin(r.url,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)]
          result={'url':url,'status':r.status_code,'bytes':len(r.content),'urls':urls[:500],'scripts':scripts,'snippets':snippets[:300]}
          Path('discoveries').mkdir(exist_ok=True)
          Path('discoveries/mengtai_sgpjbg_static.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'urls':len(urls),'scripts':len(scripts),'snippets':len(snippets)},ensure_ascii=False))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'OpenAI Report Discovery'
          git config user.email 'actions@users.noreply.github.com'
          git add discoveries/mengtai_sgpjbg_static.json
          git commit -m 'chore: persist SGPJBG Mengtai HTML clues' || exit 0
          git push origin HEAD:tmp/fetch-mengtai-reports-20260830
