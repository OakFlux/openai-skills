name: Retry NEEQ archive with cookie prewarm and real page parameters 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-cookie-search-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Search historical annual reports
        run: |
          python - <<'PY'
          import json, requests, time
          from urllib.parse import urlencode

          s=requests.Session()
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9','Connection':'keep-alive'})
          warm_urls=[
            'https://www.neeq.com.cn/disclosure/announcement.html',
            'https://www.neeq.com.cn/disclosure/examine.html',
            'https://www.neeq.com.cn/'
          ]
          for u in warm_urls:
            try:
              r=s.get(u,timeout=30,allow_redirects=True)
              print('WARM',u,r.status_code,r.url,len(r.content),'COOKIES',s.cookies.get_dict())
            except Exception as e: print('WARM_ERR',u,repr(e))
          endpoints=[
            'https://www.neeq.com.cn/disclosureInfoController/infoResult.do',
            'http://www.neeq.com.cn/disclosureInfoController/infoResult.do',
          ]
          keywords=[
            '二重','国重装','400062',
            '二重集团（德阳）重型装备股份有限公司',
            '国机重型装备集团股份有限公司',
            '2015年年度报告','2016年年度报告','2017年年度报告','2018年年度报告','2019年年度报告',
            '二重重装2015年年度报告','二重重装2016年年度报告','二重重装2017年年度报告',
            '国机重装2018年年度报告','国机重装2019年年度报告'
          ]
          for endpoint in endpoints:
            for dtype in ['9','5']:
              for kw in keywords:
                for page in ['0','1']:
                  form={
                    'flag':'1','disclosureType':dtype,'page':page,'companyCd':'','isNewThree':'0',
                    'startTime':'2015-01-01','endTime':'2020-06-30','keyword':kw,
                    'sortfield':'xxssdq','sorttype':'asc','xxfcbj':'1'
                  }
                  callback='jQuery183009154627335424248_1463152016217'
                  headers={
                    'User-Agent':ua,'Referer':'https://www.neeq.com.cn/disclosure/examine.html',
                    'Origin':'https://www.neeq.com.cn','X-Requested-With':'XMLHttpRequest',
                    'Accept':'text/javascript, application/javascript, application/ecmascript, application/x-ecmascript, */*; q=0.01',
                    'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'
                  }
                  try:
                    r=s.post(endpoint,params={'callback':callback,'_':'1770000000000'},data=form,headers=headers,timeout=40,allow_redirects=True)
                    raw=r.text.strip()
                    clean=raw
                    if clean.startswith(callback+'(') and clean.endswith(')'): clean=clean[len(callback)+1:-1]
                    elif clean.startswith('null(') and clean.endswith(')'): clean=clean[5:-1]
                    else: clean=clean.rstrip(';')
                    try: obj=json.loads(clean)
                    except Exception:
                      if '验证码' in raw or '访问' in raw or r.status_code!=200:
                        print('BAD',endpoint,dtype,page,kw,r.status_code,len(raw),repr(raw[:300]))
                      continue
                    blocks=obj if isinstance(obj,list) else [obj]
                    rows=[]
                    for b in blocks:
                      if isinstance(b,dict): rows += ((b.get('listInfo') or {}).get('content') or [])
                    if rows:
                      print('\nFOUND',endpoint,'DTYPE',dtype,'PAGE',page,'KW',repr(kw),'ROWS',len(rows),'COOKIES',s.cookies.get_dict())
                      for rec in rows: print('ROW',json.dumps(rec,ensure_ascii=False,sort_keys=True))
                  except Exception as exc:
                    print('ERR',endpoint,dtype,page,repr(kw),repr(exc))
                  time.sleep(.05)
          PY
