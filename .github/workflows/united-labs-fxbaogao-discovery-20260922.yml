name: Discover United Laboratories reports on FXBaogao 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-fxbaogao-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Inspect report viewer and download assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright, TimeoutError as PWTimeout
          OUT=Path('out')
          TARGETS={'zhongtai':'https://www.fxbaogao.com/detail/5070275','dongwu_update':'https://www.fxbaogao.com/detail/5052346','kysec':'https://www.fxbaogao.com/detail/4972116'}
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(viewport={'width':1440,'height':1200},locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',accept_downloads=True)
              for name,url in TARGETS.items():
                page=await ctx.new_page();net=[];apis=[]
                async def on_response(r):
                  it={'status':r.status,'url':r.url,'type':r.request.resource_type,'content_type':r.headers.get('content-type','')}
                  net.append(it)
                  if r.request.resource_type in ('xhr','fetch') or any(k in r.url.lower() for k in ('pdf','download','file','report','preview','oss','cos')):
                    try:
                      body=await r.body();it['body_bytes']=len(body)
                      if len(body)<2_000_000:
                        try:it['body_text']=body.decode('utf-8','replace')[:1_000_000]
                        except:it['body_hex']=body[:1000].hex()
                    except Exception as e:it['body_error']=repr(e)
                    apis.append(it)
                page.on('response',on_response)
                rec={'input':url}
                try:
                  resp=await page.goto(url,wait_until='domcontentloaded',timeout=90000);rec['status']=resp.status if resp else None
                  await page.wait_for_timeout(12000)
                  rec['final']=page.url;rec['title']=await page.title();rec['body']=(await page.locator('body').inner_text())[:150000]
                  rec['links']=await page.locator('a').evaluate_all("els=>els.map(e=>({href:e.href,text:(e.innerText||e.textContent||'').trim(),onclick:e.getAttribute('onclick')||'',download:e.download||''})).filter(x=>x.href||x.onclick)")
                  rec['images']=await page.locator('img').evaluate_all("els=>els.map(e=>({src:e.currentSrc||e.src,alt:e.alt||'',w:e.naturalWidth,h:e.naturalHeight})).filter(x=>x.src)")
                  rec['frames']=[{'url':f.url,'name':f.name} for f in page.frames]
                  rec['scripts']=await page.locator('script').evaluate_all("els=>els.map(e=>({src:e.src||'',text:(e.textContent||'').slice(0,100000)}))")
                  (OUT/f'{name}.html').write_text(await page.content(),encoding='utf-8')
                  await page.screenshot(path=str(OUT/f'{name}.png'),full_page=True)
                  # click download-like controls
                  clicks=[]
                  loc=page.get_by_text(re.compile('下载|获取完整报告|查看完整报告'))
                  for i in range(min(await loc.count(),8)):
                    el=loc.nth(i)
                    try:
                      if not await el.is_visible():continue
                      cr={'i':i,'text':(await el.inner_text())[:200]}
                      try:
                        async with page.expect_download(timeout=8000) as di:await el.click(timeout=15000)
                        dl=await di.value;dest=OUT/f'{name}_{dl.suggested_filename}';await dl.save_as(str(dest));cr.update({'file':dest.name,'url':dl.url,'bytes':dest.stat().st_size,'failure':await dl.failure()})
                      except PWTimeout:
                        await page.wait_for_timeout(3000);cr.update({'after':page.url,'tail':(await page.locator('body').inner_text())[-6000:]})
                      clicks.append(cr)
                    except Exception as e:clicks.append({'i':i,'error':repr(e)})
                  rec['clicks']=clicks
                except Exception as e:rec['error']=repr(e)
                rec['network']=net;rec['apis']=apis
                (OUT/f'{name}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                await page.close()
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
          grep -RInE 'https?[^[:space:]"'\''<>]+\.pdf|pdfUrl|fileUrl|downloadUrl|reportUrl|oss|cos|preview|pageCount|totalPage' out > out/grep_hits.txt || true
          find out -type f -printf '%P %s bytes\n' | sort > out/file_sizes.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-fxbaogao-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
