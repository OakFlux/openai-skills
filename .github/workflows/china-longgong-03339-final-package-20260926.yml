name: Build China Longgong 03339 annual and latest interim package 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-03339-final-package-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official reports validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from pypdf import PdfReader

          PACKAGE = '中国龙工_03339_2020-2025年报_最新中期报告_官方原件'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.lonking.cn/invest/periodic-reports.htm',
          })

          docs = [
              {
                  'filename': '01_中国龙工_03339_2020年年度报告.pdf',
                  'title': '中国龙工2020年年度报告',
                  'year': 2020,
                  'category': '年度报告',
                  'disclosure_date': '2021-04-28',
                  'path': '/files/202104/20210428102237192.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 90,
              },
              {
                  'filename': '02_中国龙工_03339_2021年年度报告.pdf',
                  'title': '中国龙工2021年年度报告',
                  'year': 2021,
                  'category': '年度报告',
                  'disclosure_date': '2022-04-26',
                  'path': '/upload/file/2022/04/29/f5716fe7855a4838b1eb8874b821f7a8.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 90,
              },
              {
                  'filename': '03_中国龙工_03339_2022年年度报告.pdf',
                  'title': '中国龙工2022年年度报告',
                  'year': 2022,
                  'category': '年度报告',
                  'disclosure_date': '2023-04-27',
                  'path': '/upload/file/2023/04/27/8599a77327064e9eaef8d393babad2f3.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 90,
              },
              {
                  'filename': '04_中国龙工_03339_2023年年度报告.pdf',
                  'title': '中国龙工2023年年度报告',
                  'year': 2023,
                  'category': '年度报告',
                  'disclosure_date': '2024-04-26',
                  'path': '/upload/file/2024/04/26/9f15f94c19bd429092c5e7ba0f7a20d9.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 90,
              },
              {
                  'filename': '05_中国龙工_03339_2024年年度报告.pdf',
                  'title': '中国龙工2024年年度报告',
                  'year': 2024,
                  'category': '年度报告',
                  'disclosure_date': '2025-05-07',
                  'path': '/upload/file/2025/05/07/f6fe21995ceb4424999063c482b45918.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 90,
              },
              {
                  'filename': '06_中国龙工_03339_2025年年度报告.pdf',
                  'title': '中国龙工2025年年度报告',
                  'year': 2025,
                  'category': '年度报告',
                  'disclosure_date': '2026-05-06',
                  'path': '/upload/file/2026/05/06/9e6af258e18f44a28f0eb11ab7183f75.pdf',
                  'min_bytes': 500_000,
                  'min_pages': 90,
              },
              {
                  'filename': '07_中国龙工_03339_2025年中期报告_官网最新中报.pdf',
                  'title': '中国龙工2025年中期报告',
                  'year': 2025,
                  'category': '最新中期报告',
                  'disclosure_date': '2025-10-07',
                  'path': '/upload/file/2025/10/07/7a791cb0539248b58e4e2b6cb825e1b9.pdf',
                  'min_bytes': 300_000,
                  'min_pages': 40,
              },
          ]

          def source_candidates(path: str, title: str) -> list[str]:
              raw = 'https://www.lonking.cn' + path
              endpoint = (
                  'https://www.lonking.cn/core/control/common/down.jsp?filename='
                  + quote(path, safe='/') + '&title=' + quote(title)
              )
              return [raw, endpoint]

          def download_pdf(doc: dict, dest: Path) -> str:
              errors: list[str] = []
              for url in source_candidates(doc['path'], doc['title']):
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as response:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < doc['min_bytes'] or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def extract_sample(reader: PdfReader) -> str:
              page_count = len(reader.pages)
              indices = list(range(min(30, page_count)))
              if page_count > 35:
                  indices += list(range(max(0, page_count - 5), page_count))
              parts: list[str] = []
              for index in dict.fromkeys(indices):
                  try:
                      parts.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              return '\n'.join(parts)

          records: list[dict] = []
          seen_hashes: set[str] = set()
          identity_terms = ['china longgong', '中國龍工', '中国龙工', 'lonking holdings', '03339', '3339']

          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc, dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages} < {doc["min_pages"]}')

              sample = extract_sample(reader).lower()
              if not any(term.lower() in sample for term in identity_terms):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              if doc['category'] == '年度报告' and not any(term in sample for term in ['annual report', '年度報告', '年度报告', '年報', '年报']):
                  raise RuntimeError(f'annual-report identity could not be verified in {dest.name}')
              if doc['category'] == '最新中期报告' and not any(term in sample for term in ['interim report', '中期報告', '中期报告', '中報', '中报']):
                  raise RuntimeError(f'interim-report identity could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)

              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'report_year': doc['year'],
                  'category': doc['category'],
                  'disclosure_date': doc['disclosure_date'],
                  'source': '中国龙工官网定期报告栏目',
                  'source_url': final_url,
                  'official_file_path': doc['path'],
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 7:
              raise RuntimeError(f'document count mismatch: {len(records)}')
          if sum(r['category'] == '年度报告' for r in records) != 6:
              raise RuntimeError('annual report count mismatch')
          if {r['report_year'] for r in records if r['category'] == '年度报告'} != set(range(2020, 2026)):
              raise RuntimeError('annual report year coverage mismatch')

          readme = [
              '中国龙工控股有限公司（03339.HK）2020—2025年年度报告及官网最新中期报告',
              '整理日期：2026-09-26',
              '',
              '一、收录范围',
              '1. 2020、2021、2022、2023、2024、2025年完整年度报告，共6份。',
              '2. 中国龙工官网“定期报告”栏目当前列出的最新中期报告：2025年中期报告，共1份。',
              '3. 共收录7份官方PDF原件。',
              '',
              '二、关于“最新季报”',
              '中国龙工作为香港上市公司，官方定期报告栏目未发布独立季度报告，主要发布年度报告和中期报告。',
              '截至2026年9月26日，官网该栏目列出的最新完整中期报告为2025年中期报告；本包以该报告替代“最新季报”。',
              '2025年年度报告已于2026年5月发布，并已作为2020—2025年报范围的一部分收录。',
              '',
              '三、官方来源',
              '报告索引：https://www.lonking.cn/invest/periodic-reports.htm',
              '',
              '四、文件清单',
          ]
          for i, record in enumerate(records, 1):
              readme.extend([
                  f"{i}. {record['title']}",
                  f"   类别：{record['category']}；披露日期：{record['disclosure_date']}",
                  f"   文件：{record['filename']}",
                  f"   页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          readme.extend([
              '五、完整性核验',
              '所有PDF均完成文件头、公司身份、报告类型、页数、qpdf结构、重复文件、SHA-256及ZIP CRC检查。',
          ])

          (out / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 7:
                  raise RuntimeError(f'PDF count mismatch in ZIP: {len(pdfs)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-03339-annual-interim-final
          path: 中国龙工_03339_2020-2025年报_最新中期报告_官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
