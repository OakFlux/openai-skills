name: Build corrected Wanlin Logistics 603117 report package

on:
  push:
    paths:
      - '.github/workflows/wanlin-logistics-603117-reports-corrected-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, verify, and package complete reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '万林物流'
          FULL_NAME = '江苏万林现代物流股份有限公司'
          CODE = '603117'
          CUTOFF = '2026-11-04'
          COMPACT = '20261104'
          ROOT_NAME = f'{COMPANY}_{CODE}_2020-2025年报及最新季报_截至{COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          PDF_DIR = ROOT / 'PDF文件'
          PREVIEW_DIR = ROOT / '首页与末页预览'
          DIST = Path('dist')
          for directory in (PDF_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  'file_name': '01_2020年年度报告.pdf',
                  'type': '年度报告', 'year': 2020,
                  'title': '万林物流2020年年度报告全文',
                  'announcement_date': '2021-04-29',
                  'source_url': 'https://pdf.dfcfw.com/pdf/H2_AN202104281488463082_1.pdf',
                  'source_note': '公开原始PDF镜像；用于替换巨潮中仅9页的同名非完整条目',
                  'minimum_pages': 150,
              },
              {
                  'file_name': '02_2021年年度报告_修订稿.pdf',
                  'type': '年度报告', 'year': 2021,
                  'title': '江苏万林现代物流股份有限公司2021年年度报告（修订稿）',
                  'announcement_date': '2022-05-12',
                  'source_url': 'https://static.cninfo.com.cn/finalpage/2022-05-12/1213324297.PDF',
                  'source_note': '巨潮资讯网修订稿',
                  'minimum_pages': 150,
              },
              {
                  'file_name': '03_2022年年度报告_修订稿.pdf',
                  'type': '年度报告', 'year': 2022,
                  'title': '万林物流2022年年度报告（修订稿）',
                  'announcement_date': '2023-05-05',
                  'source_url': 'https://static.cninfo.com.cn/finalpage/2023-05-05/1216747770.PDF',
                  'source_note': '巨潮资讯网修订稿',
                  'minimum_pages': 150,
              },
              {
                  'file_name': '04_2023年年度报告_修订版.pdf',
                  'type': '年度报告', 'year': 2023,
                  'title': '江苏万林现代物流股份有限公司2023年年度报告（修订版）',
                  'announcement_date': '2024-07-13',
                  'source_url': 'https://static.cninfo.com.cn/finalpage/2024-07-13/1220628129.PDF',
                  'source_note': '巨潮资讯网修订版',
                  'minimum_pages': 150,
              },
              {
                  'file_name': '05_2024年年度报告.pdf',
                  'type': '年度报告', 'year': 2024,
                  'title': '江苏万林现代物流股份有限公司2024年年度报告',
                  'announcement_date': '2025-04-29',
                  'source_url': 'https://static.cninfo.com.cn/finalpage/2025-04-29/1223385182.PDF',
                  'source_note': '巨潮资讯网正式年报',
                  'minimum_pages': 150,
              },
              {
                  'file_name': '06_2025年年度报告.pdf',
                  'type': '年度报告', 'year': 2025,
                  'title': '江苏万林现代物流股份有限公司2025年年度报告',
                  'announcement_date': '2026-04-28',
                  'source_url': 'https://static.cninfo.com.cn/finalpage/2026-04-28/1225214396.PDF',
                  'source_note': '巨潮资讯网正式年报',
                  'minimum_pages': 150,
              },
              {
                  'file_name': '07_2026年第三季度报告.pdf',
                  'type': '最新季度报告', 'year': 2026,
                  'title': '江苏万林现代物流股份有限公司2026年第三季度报告',
                  'announcement_date': '2026-10-30',
                  'source_url': 'https://static.cninfo.com.cn/finalpage/2026-10-30/1225644717.PDF',
                  'source_note': '巨潮资讯网最新季度报告',
                  'minimum_pages': 5,
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6, connect=6, read=6, status=6,
              backoff_factor=0.8,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}),
              raise_on_status=False,
          )
          adapter = HTTPAdapter(max_retries=retry)
          session.mount('https://', adapter)
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Accept': 'application/pdf,*/*;q=0.8',
          })

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          records = []
          for item in documents:
              response = session.get(
                  item['source_url'],
                  headers={'Referer': 'https://www.cninfo.com.cn/' if 'cninfo.com.cn' in item['source_url'] else 'https://data.eastmoney.com/'},
                  timeout=300,
                  allow_redirects=True,
              )
              print('DOWNLOAD', item['file_name'], response.status_code, len(response.content), response.url, response.headers.get('content-type'), flush=True)
              response.raise_for_status()
              data = response.content
              if not data.startswith(b'%PDF') or len(data) < 20_000:
                  raise RuntimeError(f"PDF内容异常: {item['file_name']}, bytes={len(data)}")

              path = PDF_DIR / item['file_name']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              if reader.is_encrypted:
                  reader.decrypt('')
              pages = len(reader.pages)
              if pages < item['minimum_pages']:
                  raise RuntimeError(f"报告页数不足，可能非完整文件: {item['file_name']}, pages={pages}")

              text_parts = []
              for page_index in sorted(set([0, min(1, pages - 1), min(2, pages - 1), pages - 1])):
                  try:
                      text_parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              sample_text = re.sub(r'\s+', ' ', '\n'.join(text_parts)).strip()
              compact_text = re.sub(r'\s+', '', sample_text)
              if FULL_NAME not in compact_text and COMPANY not in compact_text and CODE not in compact_text:
                  raise RuntimeError(f"公司身份校验失败: {item['file_name']}")
              if item['type'] == '年度报告' and f"{item['year']}年年度报告" not in compact_text:
                  raise RuntimeError(f"报告年份校验失败: {item['file_name']}")
              if item['type'] == '最新季度报告' and '2026年第三季度报告' not in compact_text and '2026年三季度报告' not in compact_text:
                  raise RuntimeError('最新季度报告文本校验失败')

              document = fitz.open(path)
              if document.page_count != pages:
                  raise RuntimeError(f"双解析器页数不一致: {item['file_name']}")
              first = document.load_page(0).get_pixmap(matrix=fitz.Matrix(1.25, 1.25), alpha=False)
              last = document.load_page(document.page_count - 1).get_pixmap(matrix=fitz.Matrix(1.0, 1.0), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 400:
                  raise RuntimeError(f"页面渲染异常: {item['file_name']}")
              first.save(PREVIEW_DIR / f"{path.stem}_首页.png")
              last.save(PREVIEW_DIR / f"{path.stem}_末页.png")
              document.close()

              record = {
                  **item,
                  'resolved_url': response.url,
                  'page_count': pages,
                  'file_size_bytes': path.stat().st_size,
                  'sha256': sha256(path),
                  'pdf_header_valid': True,
                  'company_identity_validated': True,
                  'report_identity_validated': True,
                  'dual_parser_page_count_validated': True,
                  'first_and_last_pages_rendered': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          manifest = {
              'company_short_name': COMPANY,
              'company_full_name': FULL_NAME,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'scope': '2020-2025年完整年度报告及截至截止日最新季度报告（2026年第三季度报告）；2021-2023年采用修订版本。',
              'quality_note': '2020年报告采用完整原始PDF镜像，已排除巨潮中仅9页的同名非完整条目。',
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{record['sha256']}  PDF文件/{record['file_name']}\n" for record in records),
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）2020-2025年报及最新季报',
              '',
              f'- 公司全称：{FULL_NAME}',
              f'- 截止日期：{CUTOFF}',
              '- 文件范围：2020-2025年完整年度报告、2026年第三季度报告。',
              '- 版本口径：2021、2022、2023年采用后续披露的修订版本。',
              '- 质量说明：已排除巨潮中仅9页的2020年同名非完整条目，改收录完整年报原始PDF镜像。',
              f'- PDF数量：{len(records)}份；合计页数：{sum(record["page_count"] for record in records)}页。',
              '- 校验：PDF文件头、公司及报告身份、最低页数、双解析器页数、首末页渲染、SHA-256和ZIP CRC。',
              '',
              '## 文件清单',
              '',
          ]
          for number, record in enumerate(records, 1):
              readme += [
                  f'{number}. `{record["file_name"]}`',
                  f'   - 公告标题：{record["title"]}',
                  f'   - 公告日期：{record["announcement_date"]}',
                  f'   - 页数：{record["page_count"]}',
                  f'   - 来源说明：{record["source_note"]}',
                  f'   - 来源：{record["resolved_url"]}',
                  f'   - SHA-256：`{record["sha256"]}`',
              ]
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          cn_zip = DIST / f'{ROOT_NAME}.zip'
          en_zip = DIST / f'wanlin_logistics_603117_2020_2025_annual_latest_quarter_{COMPACT}.zip'
          with zipfile.ZipFile(cn_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(cn_zip, en_zip)

          for zip_path in (cn_zip, en_zip):
              with zipfile.ZipFile(zip_path) as archive:
                  bad_member = archive.testzip()
                  if bad_member:
                      raise RuntimeError(f'ZIP CRC校验失败: {bad_member}')
                  pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdf_names) != 7:
                      raise RuntimeError(f'ZIP内PDF数量异常: {len(pdf_names)}')
              print('ZIP_VERIFIED', zip_path, zip_path.stat().st_size, sha256(zip_path), flush=True)

          print('FINAL_SUMMARY', json.dumps({
              'chinese_zip': str(cn_zip),
              'english_zip': str(en_zip),
              'zip_size_bytes': cn_zip.stat().st_size,
              'zip_sha256': sha256(cn_zip),
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'records': records,
          }, ensure_ascii=False), flush=True)
          PY

      - name: Upload corrected final ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: wanlin-logistics-603117-reports-corrected-final-20261104
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
