name: Temporary Fosun fast catalogue inspection

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-fast-sd.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF
      - name: Inspect exact public catalogue records and PDF codes
        run: |
          python - <<'PY'
          import json, re, time
          import requests, pymupdf

          queries = [
              '瘦身健体再出发 科技创新 全球化布局驱动成长',
              '多领域布局的家庭消费综合产业集团 创新与全球化驱动未来发展',
              '聚焦主业资产优化 公司估值存在改善空间',
              '瘦身调整聚焦主业 创新协同提供增量',
              '瘦身健体 全球布局 综合航母',
              '消费旗舰三十年乘风破浪 聚焦主业再扬帆',
              '复星国际 00656',
          ]
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          seen=set()
          for query in queries:
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/search',json={'page':1,'pageSize':100,'keyword':query},timeout=30)
                  files=(r.json().get('data') or {}).get('files') or []
                  print('QUERY',query,'COUNT',len(files))
              except Exception as e:
                  print('QUERY_ERROR',query,repr(e)); continue
              for row in files:
                  name=str(row.get('name') or '')
                  if '复星国际' not in name and '00656' not in name and '0656' not in name:
                      continue
                  rid=row.get('id')
                  if rid in seen: continue
                  seen.add(rid)
                  try:
                      d=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=30).json()
                      detail=d.get('data') if d.get('status')==1 else {}
                  except Exception as e:
                      detail={}; print('DETAIL_ERROR',rid,repr(e))
                  item={
                      'id':rid,'name':name,'page_count':row.get('page_count'),
                      'time_text':detail.get('time_text'),'organization':(detail.get('organization') or {}).get('name'),
                      'data_source_uuid':detail.get('data_source_uuid') or row.get('data_source_uuid'),
                      'original_id':detail.get('original_id') or row.get('original_id'),
                      'page_url':detail.get('page_url') or row.get('page_url'),
                      'online_url':detail.get('online_url') or row.get('online_url'),
                      'size':detail.get('size'),'stock':detail.get('stock'),
                  }
                  print('CATALOGUE',json.dumps(item,ensure_ascii=False))
                  code=str(item.get('data_source_uuid') or '')
                  if not code.startswith('AP'): continue
                  urls=[f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{int(time.time()*1000)}.pdf=']
                  for url in urls:
                      try:
                          p=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=45)
                          rec={'url':url,'status':p.status_code,'bytes':len(p.content),'magic':p.content[:8].hex()}
                          if p.content.startswith(b'%PDF') and len(p.content)>50000:
                              doc=pymupdf.open(stream=p.content,filetype='pdf')
                              rec['pages']=doc.page_count
                              rec['first_text']=re.sub(r'\s+',' ',doc.load_page(0).get_text('text')).strip()[:1800]
                              rec['last_text']=re.sub(r'\s+',' ',doc.load_page(doc.page_count-1).get_text('text')).strip()[:700]
                              doc.close()
                          print('PDF',json.dumps(rec,ensure_ascii=False))
                          if rec.get('pages'): break
                      except Exception as e: print('PDF_ERROR',url,repr(e))
          PY
