name: Probe Jingxue Stockstar research page

on:
  push:
    branches:
      - tmp-jingxue-broker-stockstar-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch research listing and linked articles
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          start='https://news.stockstar.com/info/dstock_301010_c3491.shtml'
          r=s.get(start,timeout=(20,90),allow_redirects=True)
          print('LIST',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          r.encoding=r.apparent_encoding or 'gb18030'
          text=html.unescape(r.text).replace('\\/','/')
          soup=BeautifulSoup(text,'html.parser')
          print('TITLE',soup.title)
          links=[]
          for a in soup.find_all('a',href=True):
              label=re.sub(r'\s+','',a.get_text(' ',strip=True))
              href=urljoin(r.url,a.get('href'))
              if label and (any(k in label for k in ['晶雪节能','东北证券','研报','报告','增持']) or '301010' in href):
                  print('LIST_LINK',label,href)
                  if href.startswith('http') and href not in links: links.append(href)
          compact=re.sub(r'\s+',' ',text)
          for pat in ['东北证券','2023-04-25','晶雪节能','增持']:
              pos=0
              while True:
                  i=compact.find(pat,pos)
                  if i<0: break
                  print('LIST_CTX',pat,compact[max(0,i-600):i+1400])
                  pos=i+len(pat)
                  if pos>i+len(pat)+1: break
          print('LINK_COUNT',len(links))
          for u in links[:30]:
              print('\nARTICLE',u)
              try:
                  q=s.get(u,timeout=(20,90),allow_redirects=True)
                  q.encoding=q.apparent_encoding or q.encoding or 'gb18030'
                  body=html.unescape(q.text).replace('\\/','/')
                  bs=BeautifulSoup(body,'html.parser')
                  print('STATUS',q.status_code,len(q.content),q.url,'TITLE',bs.title)
                  plain=re.sub(r'\s+',' ',bs.get_text(' ',strip=True))
                  if any(k in plain for k in ['晶雪节能','东北证券','301010']):
                      print('TEXT',plain[:10000])
                  for a in bs.find_all('a',href=True):
                      label=re.sub(r'\s+','',a.get_text(' ',strip=True))
                      href=urljoin(q.url,a.get('href'))
                      if '.pdf' in href.lower() or any(k in label for k in ['原文','下载','研报','报告']):
                          print('ARTICLE_LINK',label,href)
                  for m in re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',body,flags=re.I):
                      print('PDF_MATCH',m)
              except Exception as e:
                  print('ARTICLE_ERROR',repr(e))
          PY
