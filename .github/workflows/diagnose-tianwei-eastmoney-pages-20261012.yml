name: Diagnose Tianwei Eastmoney paginated indexes

on:
  pull_request:
    paths:
      - 'tasks/tianwei-eastmoney-pages-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Scan all relevant Eastmoney pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, pathlib, requests, time
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out=pathlib.Path('eastmoney_pages'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET','POST'],raise_on_status=False)))

          terms=['天微电子','688511','军用灭火防爆系统龙头','下游景气度传导助力业绩腾飞','王泽宇','杨英杰']
          matches=[]
          windows=[
            ('202406','2024-06-01','2024-07-15'),
            ('202107','2021-06-01','2021-10-01'),
            ('202208','2022-01-01','2022-12-31'),
            ('2023','2023-01-01','2023-12-31'),
            ('2025','2025-01-01','2025-12-31'),
            ('2026','2026-01-01','2026-10-12'),
          ]
          for label,beg,end in windows:
            page=1
            while True:
              body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':beg,'endTime':end,'code':'*','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'Content-Type':'application/json'},timeout=(20,120))
              r.raise_for_status(); data=r.json(); rows=data.get('data') or []
              total=int(data.get('TotalPage') or data.get('totalPage') or 0)
              print('PAGE',label,page,'ROWS',len(rows),'TOTAL',total,'HITS',data.get('hits'),flush=True)
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if any(term in blob for term in terms):
                  row['_window']=label; row['_page']=page
                  matches.append(row)
                  print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
              if not rows or page>=total: break
              page+=1; time.sleep(0.05)

          uniq={}
          for row in matches:
            key=str(row.get('infoCode') or row.get('encodeUrl') or json.dumps(row,sort_keys=True,ensure_ascii=False))
            uniq[key]=row
          matches=list(uniq.values())
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_MATCHES',len(matches),flush=True)
          for row in matches:
            info=str(row.get('infoCode') or '')
            if not info: continue
            for prefix in ['H3','H2']:
              for suffix in ['_1.pdf','_01.pdf']:
                url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}{suffix}'
                rr=s.get(url,headers={'Accept':'application/pdf,*/*;q=0.8'},timeout=(20,180))
                print('PDF_TEST',info,rr.status_code,len(rr.content),url,repr(rr.content[:8]),flush=True)
                if rr.status_code==200 and rr.content.startswith(b'%PDF') and len(rr.content)>70000:
                  (out/f'{info}.pdf').write_bytes(rr.content)
                  print('PDF_FOUND',info,len(rr.content),url,flush=True)
                  break
              else: continue
              break
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-eastmoney-pages
          path: eastmoney_pages/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
