name: Inspect Yanbaoke public API for Xinjiang Joinworld reports

on:
  push:
    paths:
      - '.github/workflows/yanbaoke-api-inspect-xinjiang-joinworld-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Inspect site HTML bundles and APIs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import html
          import re
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
              'https://www.yanbaoke.com/',
              'https://www.yanbaoke.com/info/LH3DopYqQoy5sBEpdbRehM',
              'https://www.yanbaoke.com/search?keyword='+quote('新疆众和'),
              'https://www.yanbaoke.com/search?q='+quote('新疆众和'),
          ]
          scripts=set()
          for url in urls:
              try:
                  r=s.get(url,timeout=(25,150),allow_redirects=True)
                  print('\n===== PAGE',url,r.status_code,r.url,len(r.content),r.headers.get('content-type'),'=====',flush=True)
                  text=r.text
                  soup=BeautifulSoup(text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
                  for tag in soup.find_all(['a','script','link','iframe','button']):
                      label=' '.join(tag.get_text(' ',strip=True).split())[:180]
                      for attr in ('href','src','data-url','onclick','value'):
                          val=tag.get(attr)
                          if not val: continue
                          val=html.unescape(str(val)).replace('\\/','/')
                          absolute=urljoin(r.url,val) if not val.lower().startswith('javascript:') else val
                          if tag.name=='script' and attr=='src': scripts.add(absolute)
                          combined=(label+' '+absolute).lower()
                          if any(k in combined for k in ('pdf','download','api','search','file','report','info','query')) or '下载' in label:
                              print('TAG',tag.name,attr,repr(label),absolute[:1800],flush=True)
                  for line in text.splitlines():
                      low=line.lower()
                      if any(k in low for k in ('pdf','download','file_url','api/','search','新疆众和')):
                          print('LINE',' '.join(line.split())[:4000],flush=True)
                  print('TEXT_HEAD',' | '.join(soup.get_text('\n',strip=True).splitlines())[:2500],flush=True)
              except Exception as exc:
                  print('PAGE_ERROR',url,repr(exc),flush=True)

          print('SCRIPT_COUNT',len(scripts),flush=True)
          for src in sorted(scripts):
              try:
                  r=s.get(src,timeout=(25,180))
                  print('\n===== SCRIPT',src,r.status_code,len(r.content),'=====',flush=True)
                  if r.status_code!=200: continue
                  text=r.text
                  keys=('download','fileUrl','file_url','pdf','search','keyword','/api/','report','document','export')
                  for key in keys:
                      if key.lower() in text.lower(): print('HAS',key,flush=True)
                  seen=set()
                  for match in re.finditer(r'(?i)(download|file_?url|pdf|/api/|search|keyword|report|document|export)',text):
                      start=max(0,match.start()-600); end=min(len(text),match.end()+1800)
                      snippet=' '.join(text[start:end].split())
                      if snippet in seen: continue
                      seen.add(snippet)
                      print('WINDOW',snippet[:3000],flush=True)
                      if len(seen)>=80: break
                  for endpoint in sorted(set(re.findall(r'https?://[^\"\'<>\\\s]+',text))):
                      if any(k in endpoint.lower() for k in ('api','pdf','download','file','report','oss','cos','cdn')):
                          print('ENDPOINT',endpoint[:1600],flush=True)
              except Exception as exc:
                  print('SCRIPT_ERROR',src,repr(exc),flush=True)
          PY
