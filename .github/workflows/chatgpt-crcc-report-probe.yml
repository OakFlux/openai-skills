name: Probe public China Railway Construction broker reports

on:
  push:
    branches:
      - chatgpt-temp-crcc-broker-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Query Eastmoney report API and inspect likely deep reports
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import csv, io, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          OUT = Path('probe_output')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Origin': 'https://data.eastmoney.com',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml?stockcode=601186',
          })
          api = 'https://reportapi.eastmoney.com/report/list2'
          rows = []
          for page in range(1, 21):
              body = {
                  'pageSize': 100, 'pageNo': page, 'p': page, 'pageNum': page, 'pageNumber': page,
                  'beginTime': '2008-01-01', 'endTime': '2026-09-06',
                  'code': '601186', 'industryCode': '*', 'rating': None,
                  'ratingChange': None, 'orgCode': None, 'rcode': ''
              }
              r = s.post(api, json=body, timeout=60)
              print('API', page, r.status_code, r.headers.get('content-type'), len(r.content))
              print(r.text[:500] if page == 1 else '')
              r.raise_for_status()
              data = r.json()
              page_rows = data.get('data') or []
              print('ROWS', page, len(page_rows), 'HITS', data.get('hits'), 'TOTALPAGE', data.get('TotalPage'))
              rows.extend(page_rows)
              if not page_rows or page >= int(data.get('TotalPage') or page):
                  break
              time.sleep(0.4)

          dedup = {}
          for row in rows:
              key = row.get('infoCode') or row.get('encodeUrl') or json.dumps(row, ensure_ascii=False, sort_keys=True)
              dedup[key] = row
          rows = list(dedup.values())
          rows.sort(key=lambda x: str(x.get('publishDate') or ''), reverse=True)
          (OUT/'all_rows.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')

          fields = ['publishDate','orgSName','title','infoCode','attachPages','attachSize','ratingName','stockName','stockCode','industryName']
          with (OUT/'all_rows.csv').open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
              w.writeheader(); w.writerows(rows)

          deep_terms = ('深度','首次覆盖','首次评级','专题','价值','系列','战略','再造','一体化','国际化','龙头','低估','重估','投资价值')
          likely = []
          for row in rows:
              title = str(row.get('title') or '')
              date = str(row.get('publishDate') or '')[:10]
              pages_meta = row.get('attachPages')
              try: pages_meta_num = int(pages_meta or 0)
              except Exception: pages_meta_num = 0
              if any(term in title for term in deep_terms) or pages_meta_num >= 10:
                  likely.append(row)
              print('ROW', date, '|', row.get('orgSName'), '|', title, '|', row.get('infoCode'), '| pages=', pages_meta, '| size=', row.get('attachSize'))

          inspect_rows = []
          seen = set()
          for row in likely + rows:
              info = str(row.get('infoCode') or '')
              if not info or info in seen:
                  continue
              seen.add(info)
              title = str(row.get('title') or '')
              date = str(row.get('publishDate') or '')[:10]
              if date and date < '2015-01-01' and not any(t in title for t in deep_terms):
                  continue
              # Probe likely items first, plus only titles with deep terms thereafter.
              if row not in likely and not any(t in title for t in deep_terms):
                  continue
              result = dict(row)
              errors = []
              for prefix in ('H3','H2'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  try:
                      rr = s.get(url, timeout=90, allow_redirects=True)
                      rr.raise_for_status()
                      content = rr.content
                      if len(content) < 30000 or b'%PDF' not in content[:4096]:
                          raise RuntimeError(f'invalid response bytes={len(content)} type={rr.headers.get("content-type")}')
                      reader = PdfReader(io.BytesIO(content), strict=False)
                      pages = len(reader.pages)
                      sample = ''.join((p.extract_text() or '') for p in reader.pages[:min(5,pages)])
                      compact = re.sub(r'\s+','',sample)
                      result.update({'pdf_url':url,'pdf_bytes':len(content),'pdf_pages':pages,'sample_prefix':sample[:1500],
                                     'company_in_sample': ('中国铁建' in compact or '中國鐵建' in compact or '601186' in compact or '1186' in compact)})
                      print('PDF', date, '|', row.get('orgSName'), '|', title, '| pages=', pages, '| bytes=', len(content), '| company=', result['company_in_sample'], '|', info)
                      break
                  except Exception as e:
                      errors.append(f'{url}: {e}')
              if 'pdf_pages' not in result:
                  result['pdf_errors'] = errors
                  print('PDF_FAIL', info, '|', ' | '.join(errors)[:1000])
              inspect_rows.append(result)
              if len(inspect_rows) >= 120:
                  break

          (OUT/'inspected.json').write_text(json.dumps(inspect_rows, ensure_ascii=False, indent=2), encoding='utf-8')
          print('SUMMARY total_rows=',len(rows),'likely=',len(likely),'inspected=',len(inspect_rows))
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: CRCC_Broker_Report_Probe
          path: probe_output
          retention-days: 2
          if-no-files-found: error
