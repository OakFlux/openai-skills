name: Build China Railway Construction broker deep-report package

on:
  push:
    branches:
      - chatgpt-temp-crcc-broker-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Download, validate, and package full PDFs
        shell: bash
        run: |
          cat > /tmp/build.py <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, re, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          OUT = Path('output')
          PDF_DIR = OUT / 'reports'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'institution': '民生证券',
                  'date': '2024-03-08',
                  'title': '首次覆盖报告：新签合同额稳步增长，估值有望迎来修复',
                  'info_code': 'AP202403081626037083',
                  'expected_pages': 18,
                  'filename': '01_民生证券_中国铁建首次覆盖_新签合同额稳步增长估值有望迎来修复_2024-03-08.pdf',
              },
              {
                  'order': 2,
                  'institution': '东吴证券',
                  'date': '2023-05-26',
                  'title': '“投建营”一体化发展，新兴产业加快拓展',
                  'info_code': 'AP202305261587291374',
                  'expected_pages': 32,
                  'filename': '02_东吴证券_中国铁建深度_投建营一体化发展新兴产业加快拓展_2023-05-26.pdf',
              },
              {
                  'order': 3,
                  'institution': '国信证券',
                  'date': '2023-03-09',
                  'title': '基建综合“国家队”，价值重估可期',
                  'info_code': 'AP202303091584146858',
                  'expected_pages': 34,
                  'filename': '03_国信证券_中国铁建深度_基建综合国家队价值重估可期_2023-03-09.pdf',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml?stockcode=601186',
          })

          def download_pdf(info_code: str) -> tuple[bytes, str]:
              errors = []
              for prefix in ('H3', 'H2'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info_code}_1.pdf'
                  for attempt in range(4):
                      try:
                          response = session.get(url, timeout=150, allow_redirects=True)
                          response.raise_for_status()
                          data = response.content
                          if len(data) < 100_000 or b'%PDF' not in data[:4096]:
                              raise RuntimeError(
                                  f'invalid PDF response: bytes={len(data)}, content-type={response.headers.get("content-type")}'
                              )
                          return data, url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt + 1}: {exc}')
                          time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(' | '.join(errors))

          manifest_rows = []
          hashes = set()
          for item in reports:
              data, source_url = download_pdf(item['info_code'])
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in hashes:
                  raise RuntimeError(f'duplicate PDF content detected: {item["filename"]}')
              hashes.add(sha256)

              reader = PdfReader(io.BytesIO(data), strict=False)
              if reader.is_encrypted:
                  raise RuntimeError(f'encrypted PDF: {item["filename"]}')
              pages = len(reader.pages)
              if pages != item['expected_pages']:
                  raise RuntimeError(
                      f'page-count mismatch for {item["filename"]}: expected {item["expected_pages"]}, got {pages}'
                  )

              page_texts = []
              for page in reader.pages:
                  try:
                      page_texts.append(page.extract_text() or '')
                  except Exception:
                      page_texts.append('')
              full_text = '\n'.join(page_texts)
              compact = re.sub(r'\s+', '', full_text)
              opening = re.sub(r'\s+', '', ''.join(page_texts[:4]))
              company_mentions = compact.count('中国铁建') + compact.count('中國鐵建')
              ticker_mentions = compact.count('601186') + compact.count('01186')
              institution_root = item['institution'].replace('证券', '')
              if company_mentions < 5 and ticker_mentions < 3:
                  raise RuntimeError(
                      f'insufficient China Railway Construction coverage in {item["filename"]}: '
                      f'company={company_mentions}, ticker={ticker_mentions}'
                  )
              if item['institution'] not in opening and institution_root not in opening:
                  raise RuntimeError(f'institution validation failed: {item["filename"]}')

              path = PDF_DIR / item['filename']
              path.write_bytes(data)
              manifest_rows.append({
                  '序号': item['order'],
                  '文件名': item['filename'],
                  '券商': item['institution'],
                  '报告标题': item['title'],
                  '发布日期': item['date'],
                  '页数': pages,
                  '文件大小（字节）': len(data),
                  '正文“中国铁建”提及次数': company_mentions,
                  '正文股票代码提及次数': ticker_mentions,
                  '公开PDF来源': source_url,
                  'InfoCode': item['info_code'],
                  'SHA-256': sha256,
              })
              print(
                  'VERIFIED', item['filename'], '| pages=', pages, '| bytes=', len(data),
                  '| company_mentions=', company_mentions, '| ticker_mentions=', ticker_mentions,
                  '| sha256=', sha256
              )

          manifest = OUT / '文件清单与校验值.csv'
          with manifest.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=list(manifest_rows[0].keys()))
              writer.writeheader()
              writer.writerows(manifest_rows)

          readme = OUT / '说明.txt'
          readme.write_text(
              '中国铁建（601186.SH / 01186.HK）券商深度研究报告合集\n\n'
              '本压缩包收录3份公开可直接下载的完整PDF，均为公司首次覆盖或较长篇幅的公司深度研究，'
              '未使用3-6页财报点评、摘要、网页预览或需会员登录的残缺版本。\n\n'
              '1. 民生证券，2024-03-08，18页，首次覆盖报告。\n'
              '2. 东吴证券，2023-05-26，32页，公司深度研究。\n'
              '3. 国信证券，2023-03-09，34页，公司深度研究。\n\n'
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。\n',
              encoding='utf-8'
          )

          zip_path = OUT / 'China_Railway_Construction_Broker_Deep_Reports_3.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for pdf in sorted(PDF_DIR.glob('*.pdf')):
                  zf.write(pdf, arcname=pdf.name)
              zf.write(manifest, arcname=manifest.name)
              zf.write(readme, arcname=readme.name)

          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP integrity failure at {bad}')
              names = zf.namelist()
              if sum(name.lower().endswith('.pdf') for name in names) != 3:
                  raise RuntimeError(f'expected 3 PDFs, archive contains: {names}')

          print('PACKAGE_READY=', zip_path)
          print('PACKAGE_BYTES=', zip_path.stat().st_size)
          print('PACKAGE_SHA256=', hashlib.sha256(zip_path.read_bytes()).hexdigest())
          PY
          python /tmp/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: China_Railway_Construction_Broker_Deep_Reports_3
          path: output/China_Railway_Construction_Broker_Deep_Reports_3.zip
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
