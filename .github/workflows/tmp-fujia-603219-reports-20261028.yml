name: Build Fujia 603219 reports package

on:
  push:
    branches:
      - tmp-fujia-603219-reports-20261028

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download and validate disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='富佳股份_603219_年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE" /tmp/fujia_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('富佳股份_603219_年报_招股说明书_最新季报')
          session = requests.Session()
          retry = Retry(
              total=7, connect=7, read=7, status=7, backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          targets = [
              {
                  'order': 0,
                  'filename': '00_富佳股份_首次公开发行股票招股说明书_2021-11-10.pdf',
                  'label': '首次公开发行股票招股说明书',
                  'type': 'prospectus',
                  'date': '2021-11-10',
                  'min_pages': 300,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?id=7648532&stockid=603219',
                  'fallbacks': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-11/2021-11-10/7648532.PDF',
                      'https://qccdata.qichacha.com/ReportData/PDF/098138e1bcfd59d7a216da853f935fbc.pdf',
                  ],
              },
              {
                  'order': 1,
                  'filename': '01_富佳股份_2021年年度报告.pdf',
                  'label': '2021年年度报告',
                  'type': 'annual',
                  'year': 2021,
                  'date': '2022-04-21',
                  'min_pages': 70,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8022948&stockid=603219',
                  'fallbacks': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-21/8022948.PDF'],
              },
              {
                  'order': 2,
                  'filename': '02_富佳股份_2022年年度报告.pdf',
                  'label': '2022年年度报告',
                  'type': 'annual',
                  'year': 2022,
                  'date': '2023-03-22',
                  'min_pages': 70,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8901389&stockid=603219',
                  'fallbacks': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-22/8901389.PDF'],
              },
              {
                  'order': 3,
                  'filename': '03_富佳股份_2023年年度报告.pdf',
                  'label': '2023年年度报告',
                  'type': 'annual',
                  'year': 2023,
                  'date': '2024-04-27',
                  'min_pages': 70,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10127859&stockid=603219',
                  'fallbacks': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-27/10127859.PDF'],
              },
              {
                  'order': 4,
                  'filename': '04_富佳股份_2024年年度报告.pdf',
                  'label': '2024年年度报告',
                  'type': 'annual',
                  'year': 2024,
                  'date': '2025-04-26',
                  'min_pages': 70,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10992633&stockid=603219',
                  'fallbacks': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-26/10992633.PDF'],
              },
              {
                  'order': 5,
                  'filename': '05_富佳股份_2025年年度报告.pdf',
                  'label': '2025年年度报告',
                  'type': 'annual',
                  'year': 2025,
                  'date': '2026-03-21',
                  'min_pages': 70,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12008471&stockid=603219',
                  'fallbacks': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-3/2026-03-21/12008471.PDF'],
              },
              {
                  'order': 6,
                  'filename': '06_富佳股份_2026年第三季度报告.pdf',
                  'label': '2026年第三季度报告',
                  'type': 'quarter',
                  'year': 2026,
                  'date': '2026-10-28',
                  'min_pages': 8,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12664265&stockid=603219',
                  'fallbacks': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-28/12664265.PDF'],
              },
          ]

          def clean_title(value: str) -> str:
              value = BeautifulSoup(value or '', 'html.parser').get_text(' ', strip=True)
              return re.sub(r'\s+', '', value)

          def query_sse() -> list[dict]:
              endpoint = 'https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
              headers = {
                  'Referer': 'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=603219',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
                  'X-Requested-With': 'XMLHttpRequest',
              }
              records: list[dict] = []
              try:
                  for page_no in range(1, 8):
                      params = {
                          'isPagination': 'true',
                          'productId': '603219',
                          'keyWord': '',
                          'securityType': '0101,120100,020100,020200,120200',
                          'reportType2': '',
                          'reportType': 'ALL',
                          'beginDate': '2020-01-01',
                          'endDate': '2026-10-28',
                          'pageHelp.pageSize': '100',
                          'pageHelp.pageNo': str(page_no),
                          'pageHelp.beginPage': str(page_no),
                          'pageHelp.endPage': str(page_no + 4),
                          '_': str(int(time.time() * 1000)),
                      }
                      response = session.get(endpoint, headers=headers, params=params, timeout=(30, 120))
                      if response.status_code != 200:
                          raise RuntimeError(f'SSE HTTP {response.status_code}')
                      payload = response.json()
                      page_help = payload.get('pageHelp') or {}
                      data = page_help.get('data') or payload.get('result') or payload.get('data') or []
                      if not isinstance(data, list) or not data:
                          break
                      records.extend(data)
                      if len(data) < 100:
                          break
                  print(f'SSE announcements discovered: {len(records)}')
              except Exception as exc:
                  print(f'SSE discovery unavailable, using disclosure mirrors: {exc!r}')
                  return []
              return records

          sse_records = query_sse()

          def record_title(record: dict) -> str:
              for key in ('TITLE', 'title', 'BULLETIN_TITLE', 'bulletinTitle'):
                  if record.get(key):
                      return clean_title(str(record[key]))
              return ''

          def record_url(record: dict) -> str | None:
              for key in ('URL', 'url', 'BULLETIN_URL', 'bulletinUrl', 'docURL'):
                  if record.get(key):
                      return urljoin('https://www.sse.com.cn', str(record[key]))
              return None

          def match_sse(target: dict) -> str | None:
              candidates: list[tuple[str, str]] = []
              for record in sse_records:
                  title = record_title(record)
                  url = record_url(record)
                  if not title or not url:
                      continue
                  ok = False
                  if target['type'] == 'annual':
                      ok = f"{target['year']}年年度报告" in title and '摘要' not in title and '持续督导' not in title
                  elif target['type'] == 'quarter':
                      ok = '2026年第三季度报告' in title and '摘要' not in title
                  elif target['type'] == 'prospectus':
                      ok = '首次公开发行股票招股说明书' in title and not any(x in title for x in ('摘要', '申报稿', '意向书', '附录'))
                  if ok:
                      candidates.append((title, url))
              if candidates:
                  print('SSE match:', target['label'], candidates[0][0], candidates[0][1])
                  return candidates[0][1]
              return None

          def detail_pdf_urls(detail_url: str) -> list[str]:
              urls: list[str] = []
              try:
                  response = session.get(detail_url, timeout=(30, 120))
                  if response.status_code != 200:
                      return []
                  text = html.unescape(response.text)
                  soup = BeautifulSoup(text, 'html.parser')
                  for anchor in soup.find_all('a', href=True):
                      href = html.unescape(anchor.get('href', '')).strip()
                      if '.pdf' in href.lower():
                          urls.append(urljoin(detail_url, href))
                  for found in re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?', text, flags=re.I):
                      urls.append(html.unescape(found))
              except Exception as exc:
                  print('Detail-page extraction failed:', detail_url, repr(exc))
              unique: list[str] = []
              seen = set()
              for url in urls:
                  if url not in seen:
                      seen.add(url)
                      unique.append(url)
              return unique

          def download_pdf(target: dict) -> tuple[str, int, int, str]:
              candidates: list[str] = []
              official = match_sse(target)
              if official:
                  candidates.append(official)
              candidates.extend(detail_pdf_urls(target['detail']))
              candidates.extend(target['fallbacks'])

              deduped: list[str] = []
              seen = set()
              for candidate in candidates:
                  candidate = candidate.replace('http://', 'https://', 1) if candidate.startswith('http://') else candidate
                  if candidate not in seen:
                      seen.add(candidate)
                      deduped.append(candidate)

              last_error: Exception | None = None
              destination = OUT / target['filename']
              for url in deduped:
                  try:
                      print('TRY', target['label'], url)
                      response = session.get(
                          url,
                          headers={
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              'Referer': target['detail'],
                          },
                          timeout=(30, 360),
                          allow_redirects=True,
                      )
                      data = response.content
                      if response.status_code != 200:
                          raise RuntimeError(f'HTTP {response.status_code}')
                      if not data.startswith(b'%PDF-'):
                          raise RuntimeError(f'not PDF, bytes={len(data)}, type={response.headers.get("content-type")}')
                      if len(data) < 80_000:
                          raise RuntimeError(f'PDF unexpectedly small: {len(data)} bytes')
                      destination.write_bytes(data)
                      reader = PdfReader(str(destination), strict=False)
                      pages = len(reader.pages)
                      if pages < int(target['min_pages']):
                          raise RuntimeError(f'page count {pages} below minimum {target["min_pages"]}')
                      sha = hashlib.sha256(data).hexdigest()
                      print('DOWNLOADED', destination.name, 'pages=', pages, 'bytes=', len(data), 'source=', response.url)
                      return response.url, pages, len(data), sha
                  except Exception as exc:
                      last_error = exc
                      destination.unlink(missing_ok=True)
                      print('FAILED', target['label'], url, repr(exc))
              raise RuntimeError(f'Could not download {target["label"]}: {last_error!r}')

          results = []
          for target in targets:
              source, pages, size, sha = download_pdf(target)
              results.append({
                  'order': target['order'],
                  'file': target['filename'],
                  'document': target['label'],
                  'published': target['date'],
                  'pages': pages,
                  'bytes': size,
                  'sha256': sha,
                  'source': source,
                  'announcement_page': target['detail'],
              })

          results.sort(key=lambda item: item['order'])
          lines = [
              '富佳股份（603219）年报、招股说明书及最新季报资料包',
              '整理日期：2026-10-28',
              '',
              '收录范围：',
              '1. 上市以来全部年度报告全文：2021—2025年，共5份。',
              '2. 首次公开发行股票招股说明书全文：2021年11月10日披露，共1份。',
              '3. 截至2026年10月28日最新季度报告：2026年第三季度报告，共1份。',
              '4. 未收录年度报告摘要、季度报告之外的半年度报告、持续督导报告或招股说明书摘要。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in results:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines.extend([
                  f"- {item['file']}",
                  f"  文件：{item['document']}；披露日期：{item['published']}；页数：{item['pages']}；大小：{item['bytes']}字节",
                  f"  来源：{item['source']}",
                  f"  公告信息页：{item['announcement_page']}",
                  f"  SHA-256：{item['sha256']}",
              ])
              sums.append(f"{item['sha256']}  {item['file']}")
          lines.extend([
              '',
              f'PDF数量：{len(results)}份。',
              f'合计页数：{total_pages}页。',
              f'PDF合计大小：{total_bytes}字节。',
              '资料仅用于研究与存档。',
          ])
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -type f -iname '*.pdf' | wc -l)" -eq 7

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2); print $2}')
            test -n "$pages" && test "$pages" -ge 8
            text_file="/tmp/$(basename "$pdf").txt"
            pdftotext -f 1 -l 8 "$pdf" "$text_file" 2>/dev/null || true
            if ! grep -Eq '富佳|Fujia|FURJA' "$text_file"; then
              echo "Warning: company name not extracted from first pages of $(basename "$pdf"); continuing after structural validation."
            fi
            stem="/tmp/fujia_render/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            rm -f "$text_file"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('富佳股份_603219_年报_招股说明书_最新季报')
          rows = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          assert len(rows) == 7
          annuals = [row for row in rows if '年度报告' in row['document']]
          assert [row['document'] for row in annuals] == [f'{year}年年度报告' for year in range(2021, 2026)]
          assert any(row['document'] == '首次公开发行股票招股说明书' and row['pages'] >= 300 for row in rows)
          assert any(row['document'] == '2026年第三季度报告' and row['published'] == '2026-10-28' for row in rows)
          (folder / '_metadata.json').unlink()
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -ci '\.pdf$')" -eq 7
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Fujia-603219-annual-reports-prospectus-latest-quarterly-report
          path: 富佳股份_603219_年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
