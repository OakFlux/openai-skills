name: Discover public Zhejiang Expressway broker PDFs 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-public-pdf-discovery-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Discover public report records and PDF URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery
          python - <<'PY'
          import html, json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('discovery')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8'})

          def req(label, method, url, **kwargs):
            try:
              r=s.request(method,url,timeout=(20,120),allow_redirects=True,**kwargs)
              print('REQ',label,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',label)
              (out/f'{safe}.bin').write_bytes(r.content)
              (out/f'{safe}.meta.json').write_text(json.dumps({'status':r.status_code,'url':r.url,'headers':dict(r.headers),'bytes':len(r.content)},ensure_ascii=False,indent=2),encoding='utf-8')
              return r
            except Exception as e:
              print('REQERR',label,repr(e),flush=True); return None

          # Eastmoney public broker-report API, test common HK code forms and query types.
          api='https://reportapi.eastmoney.com/report/list'
          params_base={'pageSize':'100','pageNo':'1','fields':'','qType':'0','orgCode':'','author':'','beginTime':'2020-01-01','endTime':'2026-09-06','p':'1','pageNum':'1','pageNumber':'1'}
          all_items=[]
          for code in ['00576','0576','576','HK00576','HK0576']:
            for qtype in ['0','1','2']:
              p={**params_base,'stockCode':code,'qType':qtype}
              r=req(f'eastmoney_{code}_{qtype}','GET',api,params=p)
              if not r: continue
              txt=r.text.strip()
              txt=re.sub(r'^[^(]*\(','',txt); txt=re.sub(r'\)\s*;?\s*$','',txt)
              try:
                data=json.loads(txt)
                print('EMJSON',code,qtype,json.dumps(data,ensure_ascii=False)[:8000],flush=True)
                items=(data.get('data') or data.get('result') or data.get('list') or []) if isinstance(data,dict) else []
                if isinstance(items,dict): items=items.get('data') or items.get('list') or []
                for it in items or []:
                  if isinstance(it,dict) and ('沪杭甬' in json.dumps(it,ensure_ascii=False) or str(it.get('stockCode','')) in ['00576','0576','576']):
                    all_items.append(it)
              except Exception as e: print('EMJSONERR',code,qtype,repr(e),txt[:1000],flush=True)
          (out/'eastmoney_matching_items.json').write_text(json.dumps(all_items,ensure_ascii=False,indent=2),encoding='utf-8')

          # Eastmoney search/suggest services.
          suggest_urls=[
            ('em_suggest_14','https://searchapi.eastmoney.com/api/suggest/get',{'input':'浙江沪杭甬','type':'14','token':'D43BF722C8E33BDC906FB84D85E326E8'}),
            ('em_suggest_all','https://searchapi.eastmoney.com/api/suggest/get',{'input':'浙江沪杭甬','type':'0','token':'D43BF722C8E33BDC906FB84D85E326E8'}),
          ]
          for label,url,p in suggest_urls: req(label,'GET',url,params=p)

          # Search engines for exact report titles and direct PDF hosts.
          queries=[
            '"浙江沪杭甬" 研报 filetype:pdf',
            '"浙江沪杭甬" 券商 PDF',
            '"区域经济赋能车流量长期增长"',
            '"改扩建重塑资产久期"',
            '"路网扩张提效 双业协同进阶"',
            '"浙江沪杭甬" "首次覆盖"',
            '"浙江沪杭甬" site:pdf.dfcfw.com',
            '"浙江沪杭甬" site:swsc.com.cn',
            '"浙江沪杭甬" site:swsresearch.com',
            '"浙江沪杭甬" site:tpyzq.com',
            '"浙江沪杭甬" site:stock.finance.sina.com.cn/stock/go.php/vReport_Show',
          ]
          engines={
            'bing':lambda q:('https://www.bing.com/search',{'q':q,'count':'50','setlang':'zh-Hans'}),
            'baidu':lambda q:('https://www.baidu.com/s',{'wd':q,'rn':'50'}),
            'sogou':lambda q:('https://www.sogou.com/web',{'query':q,'num':'50'}),
            'so':lambda q:('https://www.so.com/s',{'q':q,'pn':'1'}),
            'google':lambda q:('https://www.google.com/search',{'q':q,'num':'50','hl':'zh-CN'}),
          }
          links=[]
          for qi,q in enumerate(queries):
            for ename,fn in engines.items():
              url,p=fn(q)
              r=req(f'search_{qi:02d}_{ename}','GET',url,params=p)
              if not r or r.status_code!=200: continue
              soup=BeautifulSoup(r.text,'lxml')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              print('SEARCHTITLE',qi,ename,repr(title),flush=True)
              for a in soup.find_all('a',href=True):
                href=html.unescape(a['href']); text=' '.join(a.get_text(' ',strip=True).split())
                if href.startswith('/url?') or href.startswith('/link?'):
                  qs=urllib.parse.parse_qs(urllib.parse.urlparse(href).query)
                  href=(qs.get('q') or qs.get('url') or qs.get('target') or [href])[0]
                if href.startswith('http'):
                  rec={'query':q,'engine':ename,'text':text[:500],'url':href}
                  blob=(text+' '+href).lower()
                  if any(k in blob for k in ['沪杭甬','00576','0576','pdf','研报','report','dfcfw','swsresearch','swsc','tpyzq']):
                    links.append(rec); print('RESULT',json.dumps(rec,ensure_ascii=False),flush=True)
              time.sleep(0.25)
          # Deduplicate links.
          ded=[]; seen=set()
          for x in links:
            key=x['url']
            if key not in seen: seen.add(key); ded.append(x)
          (out/'search_results.json').write_text(json.dumps(ded,ensure_ascii=False,indent=2),encoding='utf-8')

          # Probe likely direct URLs found in results only; never authenticate or bypass restrictions.
          candidates=[]
          for x in ded:
            u=x['url']
            if any(host in u for host in ['pdf.dfcfw.com','swsresearch.com','swsc.com.cn','tpyzq.com','stock.finance.sina.com.cn','fxbaogao.com','sdyanbao.com','nxny.com']):
              candidates.append(u)
          for i,u in enumerate(candidates[:150]):
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True,headers={'Referer':'https://www.bing.com/','Range':'bytes=0-65535'})
              sig=r.content[:16]
              print('PROBE',i,r.status_code,r.url,r.headers.get('content-type'),len(r.content),sig,flush=True)
              if sig.startswith(b'%PDF-'):
                (out/f'candidate_{i:03d}.pdf.part').write_bytes(r.content)
                (out/f'candidate_{i:03d}.json').write_text(json.dumps({'source':u,'final':r.url,'headers':dict(r.headers)},ensure_ascii=False,indent=2),encoding='utf-8')
            except Exception as e: print('PROBEERR',i,u,repr(e),flush=True)
          PY
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-public-pdf-discovery
          path: discovery/
          if-no-files-found: error
          retention-days: 7
