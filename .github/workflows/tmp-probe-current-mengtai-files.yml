name: Temporary Probe Current Mengtai File Records

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-probe-current-mengtai-files.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Establish exact-title searches and probe detail/static URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          API='https://api.sdyanbao.com'
          queries=['丙纶长丝行业领跑者 双基地强势进军碳纤维','丙纶景气触底 布局碳纤维打开新增量']
          out=Path('current_probe');out.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
            'Referer':'https://www.sdyanbao.com/report','Origin':'https://www.sdyanbao.com',
            'Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*',
            'Device':'1','X-Token':'',
          })
          targets={}
          for query in queries:
            payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':100,'keyword':query,'opFrom':1}
            r=s.post(API+'/api/file/search',json=payload,timeout=90);r.raise_for_status();data=r.json()
            files=((data.get('data') or {}).get('files') or [])
            print('FILES='+json.dumps({'query':query,'files':[{k:x.get(k) for k in ('id','name','page_count','file_size','size','original_id','data_source','data_source_uuid','organization','page_url','online_url','share_url')} for x in files]},ensure_ascii=False))
            for x in files:
              blob=json.dumps(x,ensure_ascii=False)
              if ('蒙泰高新' in blob or '300876' in blob) and ('丙纶' in blob or '碳纤维' in blob):
                targets[str(x.get('id'))]=x
          print('TARGET_IDS='+json.dumps(list(targets),ensure_ascii=False))

          def isp(raw):return len(raw)>20000 and raw.lstrip().startswith(b'%PDF')
          def rec(label,r):
            info={'label':label,'url':r.request.url,'final':r.url,'status':r.status_code,'type':r.headers.get('content-type'),'disposition':r.headers.get('content-disposition'),'bytes':len(r.content),'head':r.content[:20].hex(),'pdf':isp(r.content)}
            print('RESP='+json.dumps(info,ensure_ascii=False));return info

          saved=[]
          for rid,item in targets.items():
            d=s.post(API+'/api/file/detail',json={'id':rid,'opFrom':1},timeout=90);rec(rid+':detail',d)
            try:payload=d.json()
            except Exception:payload={}
            (out/f'{rid}_detail.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
            detail=payload.get('data') if isinstance(payload,dict) else None
            if not isinstance(detail,dict):
              print('DETAIL_FAIL='+json.dumps({'id':rid,'payload':payload},ensure_ascii=False));continue
            print('DETAIL_FIELDS='+json.dumps({'id':rid,**{k:detail.get(k) for k in ('name','page_count','size','file_size','author','organization','online_url','page_url','oss_name','page_dir','image_name','downloadName','is_unlock','is_download','original_id')}},ensure_ascii=False))
            candidates=[]
            for base in [detail.get('online_url'),detail.get('page_url'),detail.get('share_url'),urljoin('https://static.sdyanbao.com/',str(detail.get('oss_name') or '')),urljoin('https://oss.sdyanbao.com/',str(detail.get('oss_name') or ''))]:
              if base:
                for u in [base,base+'.pdf',base+'?download=1',base+'?attname=1']:
                  if u not in candidates:candidates.append(u)
            discovered=[]
            for i,u in enumerate(candidates,1):
              try:
                q=s.get(u,headers={'Accept':'application/pdf,text/html,application/json,*/*','Referer':f'https://www.sdyanbao.com/detail/{rid}'},timeout=150,allow_redirects=True);info=rec(f'{rid}:c{i}',q)
                if info['pdf']:
                  p=out/f'{rid}_candidate_{i}.pdf';p.write_bytes(q.content);saved.append({'id':rid,'path':str(p),'source':q.url,'name':detail.get('name')})
                else:
                  ct=(q.headers.get('content-type') or '').lower()
                  if 'text' in ct or 'json' in ct or q.content[:1] in (b'<',b'{',b'['):
                    text=html.unescape(q.content.decode('utf-8','ignore')).replace('\\/','/')
                    (out/f'{rid}_candidate_{i}.txt').write_text(text[:1000000],encoding='utf-8')
                    for pat in [r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',r'https?://(?:static|oss)\.sdyanbao\.com/[^"\'<>\s]+',r'(?:src|href|url|file|pdfUrl|downloadUrl)\s*[:=]\s*["\']([^"\']+)["\']']:
                      for v in re.findall(pat,text,re.I):
                        if isinstance(v,tuple):v=v[0]
                        v=urljoin(q.url,v)
                        if v not in discovered:discovered.append(v)
              except Exception as e:print('CERR='+json.dumps({'id':rid,'url':u,'err':repr(e)},ensure_ascii=False))
            print('DISCOVERED='+json.dumps({'id':rid,'urls':discovered[:100]},ensure_ascii=False))
            for i,u in enumerate(discovered[:50],1):
              try:
                q=s.get(u,timeout=150,allow_redirects=True);info=rec(f'{rid}:d{i}',q)
                if info['pdf']:
                  p=out/f'{rid}_discovered_{i}.pdf';p.write_bytes(q.content);saved.append({'id':rid,'path':str(p),'source':q.url,'name':detail.get('name')})
              except Exception as e:print('DERR='+json.dumps({'id':rid,'url':u,'err':repr(e)},ensure_ascii=False))
            for i,body in enumerate([{'id':rid},{'id':rid,'opFrom':1},{'id':rid,'device':1,'opFrom':1},{'id':rid,'beike':0,'opFrom':1}],1):
              q=s.post(API+'/api/file/download',json=body,timeout=90);info=rec(f'{rid}:download{i}',q)
              try:print('DOWNLOAD_JSON='+json.dumps({'id':rid,'req':body,'body':q.json()},ensure_ascii=False))
              except Exception:pass
              if info['pdf']:
                p=out/f'{rid}_download_{i}.pdf';p.write_bytes(q.content);saved.append({'id':rid,'path':str(p),'source':q.url,'name':detail.get('name')})
          print('SAVED='+json.dumps(saved,ensure_ascii=False));(out/'saved.json').write_text(json.dumps(saved,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: mengtai-current-file-probe
          path: current_probe
          retention-days: 2
          if-no-files-found: error
