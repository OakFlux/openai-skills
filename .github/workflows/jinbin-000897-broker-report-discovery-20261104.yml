name: Discover Jinbin Development broker reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jinbin-000897-broker-report-discovery-20261104.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Query and validate candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,re
          from datetime import date
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          code='000897'
          s=requests.Session()
          retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=0.8,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry));s.mount('http://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9','Referer':f'https://data.eastmoney.com/report/stock.jshtml?stockcode={code}'})
          base='https://reportapi.eastmoney.com/report/list'
          p={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2026-11-04','pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          r=s.get(base,params=p,timeout=120)
          print('API',r.status_code,len(r.content),r.url,flush=True)
          r.raise_for_status();d=r.json();rows=d.get('data') or []
          print('META',json.dumps({'hits':d.get('hits'),'size':d.get('size'),'TotalPage':d.get('TotalPage')},ensure_ascii=False),flush=True)
          print('ROWS_META',json.dumps([{k:x.get(k) for k in ['title','orgSName','orgName','publishDate','infoCode','researcher','emRatingName','attachPages','attachSize','reportType','encodeUrl']} for x in rows],ensure_ascii=False,indent=2),flush=True)
          results=[]
          for x in rows:
            info=str(x.get('infoCode') or '')
            if not info.startswith('AP'): continue
            urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/{info}_1.pdf']
            outcome={'title':x.get('title'),'org':x.get('orgSName') or x.get('orgName'),'date':x.get('publishDate'),'infoCode':info,'researcher':x.get('researcher'),'rating':x.get('emRatingName'),'api_pages':x.get('attachPages'),'attempts':[]}
            for u in urls:
              try:
                q=s.get(u,headers={'Referer':f'https://data.eastmoney.com/report/info/{info}.html','Accept':'application/pdf,*/*;q=0.8'},timeout=120)
                rec={'url':u,'status':q.status_code,'bytes':len(q.content),'ctype':q.headers.get('content-type')}
                if q.status_code==200 and q.content.startswith(b'%PDF') and len(q.content)>30000:
                  try:
                    rd=PdfReader(io.BytesIO(q.content),strict=False);rec['pages']=len(rd.pages)
                    txt=' '.join((rd.pages[i].extract_text() or '') for i in sorted(set([0,min(1,len(rd.pages)-1),len(rd.pages)-1])))
                    rec['identity']=('津滨发展' in re.sub(r'\s+','',txt) or '000897' in re.sub(r'\s+','',txt))
                    rec['sample']=re.sub(r'\s+',' ',txt)[:900]
                  except Exception as e: rec['parse_error']=repr(e)
                outcome['attempts'].append(rec)
                if rec.get('identity') and rec.get('pages',0)>=4: break
              except Exception as e: outcome['attempts'].append({'url':u,'error':repr(e)})
            results.append(outcome)
          print('VALIDATION',json.dumps(results,ensure_ascii=False,indent=2),flush=True)
          PY
