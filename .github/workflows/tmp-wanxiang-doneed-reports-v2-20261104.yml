name: Build complete Wanxiang Doneed 600371 reports package

on:
  push:
    branches:
      - tmp-wanxiang-doneed-reports-20261104

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf beautifulsoup4

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='万向德农_600371_2020-2025年报及最新季报'
          rm -rf "$PACKAGE" /tmp/wanxiang_doneed_render
          mkdir -p "$PACKAGE" /tmp/wanxiang_doneed_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('万向德农_600371_2020-2025年报及最新季报')
          TODAY = '2026-11-04'
          YEARS = range(2020, 2026)

          def make_session() -> requests.Session:
              s = requests.Session()
              s.trust_env = False
              retry = Retry(
                  total=7, connect=7, read=7, status=7, backoff_factor=1.0,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET', 'POST'], raise_on_status=False,
              )
              adapter = HTTPAdapter(max_retries=retry)
              s.mount('https://', adapter)
              s.mount('http://', adapter)
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              })
              return s

          def clean_title(value: str) -> str:
              return re.sub(r'\s+', '', BeautifulSoup(html.unescape(value or ''), 'html.parser').get_text('', strip=True))

          def disclosure_date(row: dict[str, Any]) -> str:
              adjunct = str(row.get('adjunctUrl') or '')
              match = re.search(r'finalpage/(\d{4}-\d{2}-\d{2})/', adjunct)
              return match.group(1) if match else ''

          def query_all() -> list[dict[str, Any]]:
              s = make_session()
              endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              headers = {
                  'Referer': 'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search',
                  'Origin': 'https://www.cninfo.com.cn',
                  'X-Requested-With': 'XMLHttpRequest',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              }
              rows: list[dict[str, Any]] = []
              page = 1
              while page <= 25:
                  payload = {
                      'pageNum': str(page), 'pageSize': '30', 'column': 'sse',
                      'tabName': 'fulltext', 'plate': 'sh',
                      'stock': '600371,gssh0600371', 'searchkey': '', 'secid': '',
                      'category': '', 'trade': '', 'seDate': f'2021-01-01~{TODAY}',
                      'sortName': '', 'sortType': '', 'isHLtitle': 'true',
                  }
                  r = s.post(endpoint, data=payload, headers=headers, timeout=(30, 150))
                  print('CNINFO_PAGE', page, 'HTTP', r.status_code, 'bytes', len(r.content))
                  r.raise_for_status()
                  obj = r.json()
                  batch = obj.get('announcements') or []
                  rows.extend(batch)
                  print('CNINFO_BATCH', len(batch), 'TOTAL', obj.get('totalAnnouncement'), 'HAS_MORE', obj.get('hasMore'))
                  if not batch or not obj.get('hasMore'):
                      break
                  page += 1
              dedup: dict[str, dict[str, Any]] = {}
              for row in rows:
                  key = str(row.get('announcementId') or row.get('adjunctUrl') or '')
                  if key:
                      dedup[key] = row
              result = list(dedup.values())
              result.sort(key=lambda x: int(x.get('announcementTime') or 0), reverse=True)
              print('CNINFO_UNIQUE_ROWS', len(result))
              return result

          def select(rows: list[dict[str, Any]]) -> list[dict[str, Any]]:
              chosen: list[dict[str, Any]] = []
              exclusions = ['摘要', '英文版', '社会责任', 'ESG', '内部控制', '提示性公告', '监管工作函', '回复公告', '审计报告']
              for year in YEARS:
                  marker = f'{year}年年度报告'
                  candidates = []
                  for row in rows:
                      title = clean_title(str(row.get('announcementTitle') or ''))
                      adjunct = str(row.get('adjunctUrl') or '')
                      if marker in title and adjunct.lower().endswith('.pdf') and not any(x in title for x in exclusions):
                          if '关于' in title and not title.endswith(marker) and not title.endswith(marker + '（修订版）'):
                              continue
                          candidates.append(row)
                  if not candidates:
                      raise RuntimeError(f'Missing full annual report for {year}')
                  candidates.sort(
                      key=lambda row: (
                          1 if '修订' in clean_title(str(row.get('announcementTitle') or '')) else 0,
                          int(row.get('announcementTime') or 0),
                      ), reverse=True,
                  )
                  row = candidates[0]
                  print('SELECT_ANNUAL', year, clean_title(str(row.get('announcementTitle') or '')), row.get('adjunctUrl'))
                  chosen.append({
                      'kind': 'annual', 'year': year, 'period': marker,
                      'filename': f'万向德农_600371_{year}年年度报告_全文.pdf', 'row': row,
                  })

              quarter_candidates = []
              for row in rows:
                  title = clean_title(str(row.get('announcementTitle') or ''))
                  adjunct = str(row.get('adjunctUrl') or '')
                  match = re.search(r'(20\d{2})年(第一|第三)季度报告', title)
                  if not match or not adjunct.lower().endswith('.pdf'):
                      continue
                  if any(x in title for x in ['摘要', '提示性公告', '更正', '取消']):
                      continue
                  quarter_candidates.append((int(row.get('announcementTime') or 0), row, match.group(0)))
              if not quarter_candidates:
                  raise RuntimeError('Missing formal quarterly report')
              quarter_candidates.sort(key=lambda x: x[0], reverse=True)
              _, qrow, period = quarter_candidates[0]
              print('SELECT_QUARTER', period, clean_title(str(qrow.get('announcementTitle') or '')), qrow.get('adjunctUrl'))
              chosen.append({
                  'kind': 'quarter', 'year': int(period[:4]), 'period': period,
                  'filename': f'万向德农_600371_{period}_全文.pdf', 'row': qrow,
              })
              return chosen

          def download(item: dict[str, Any]) -> dict[str, Any]:
              row = item['row']
              adjunct = str(row.get('adjunctUrl') or '').lstrip('/')
              urls = [f'https://static.cninfo.com.cn/{adjunct}', f'http://static.cninfo.com.cn/{adjunct}']
              s = make_session()
              response = None
              data = b''
              failures = []
              for url in urls:
                  try:
                      r = s.get(url, headers={'Referer': 'https://www.cninfo.com.cn/'}, timeout=(30, 240), allow_redirects=True)
                      print('DOWNLOAD', item['period'], r.status_code, len(r.content), r.headers.get('content-type'), r.url)
                      if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 100_000:
                          response, data = r, r.content
                          break
                      failures.append(f'{url}: HTTP {r.status_code}, bytes={len(r.content)}')
                  except Exception as exc:
                      failures.append(f'{url}: {exc!r}')
              if response is None:
                  raise RuntimeError(f"Unable to download {item['period']}: {'; '.join(failures)}")

              path = OUT / item['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if item['kind'] == 'annual' and pages < 60:
                  raise RuntimeError(f'{path.name}: only {pages} pages, likely not full annual report')
              if item['kind'] == 'quarter' and pages < 5:
                  raise RuntimeError(f'{path.name}: only {pages} pages, likely incomplete')

              sample_indexes = list(range(min(8, pages)))
              if pages > 8:
                  sample_indexes.extend(range(max(8, pages - 3), pages))
              sample = ''.join((reader.pages[i].extract_text() or '') for i in sample_indexes)
              compact = re.sub(r'\s+', '', sample)
              if '万向德农' not in compact or '600371' not in compact:
                  raise RuntimeError(f'{path.name}: company identity not found')
              if item['period'] not in compact:
                  raise RuntimeError(f"{path.name}: report period '{item['period']}' not found")
              first_page = re.sub(r'\s+', '', reader.pages[0].extract_text() or '')
              if item['kind'] == 'annual' and '摘要' in first_page:
                  raise RuntimeError(f'{path.name}: summary detected')

              sha = hashlib.sha256(data).hexdigest()
              return {
                  'filename': path.name,
                  'kind': item['kind'],
                  'period': item['period'],
                  'title': clean_title(str(row.get('announcementTitle') or '')),
                  'disclosure_date': disclosure_date(row),
                  'pages': pages,
                  'bytes': len(data),
                  'source_url': response.url,
                  'announcement_id': str(row.get('announcementId') or ''),
                  'sha256': sha,
              }

          rows = query_all()
          items = select(rows)
          if len(items) != 7:
              raise RuntimeError(f'Expected 7 reports, got {len(items)}')
          records = [download(item) for item in items]
          records.sort(key=lambda x: (0 if x['kind'] == 'annual' else 1, x['period']))

          lines = [
              '万向德农（600371）2020—2025年年度报告及最新季度报告',
              f'整理日期：{TODAY}', '',
              '收录口径：',
              '1. 收录2020—2025年度正式年度报告全文，共6份；不含年度报告摘要。',
              '2. 最新季度报告按正式公告披露日期确定。',
              '3. 所有PDF均来自巨潮资讯公告附件，并核验公司名称、证券代码、报告期、PDF结构、页数及首末页渲染。',
              '', '文件清单：',
          ]
          sums = []
          for index, rec in enumerate(records, 1):
              lines.extend([
                  f"{index}. {rec['filename']}",
                  f"   公告标题：{rec['title']}",
                  f"   披露日期：{rec['disclosure_date']}",
                  f"   页数：{rec['pages']}页",
                  f"   文件大小：{rec['bytes']}字节",
                  f"   来源：{rec['source_url']}",
                  f"   公告ID：{rec['announcement_id']}",
                  f"   SHA-256：{rec['sha256']}", '',
              ])
              sums.append(f"{rec['sha256']}  {rec['filename']}")
          lines.extend([
              f"合计：{len(records)}份PDF，{sum(x['pages'] for x in records)}页，{sum(x['bytes'] for x in records)}字节。",
              '资料仅用于信息查阅，不构成投资建议。',
          ])
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l 8 "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -q '万向德农' "$pdf.txt"
            grep -q '600371' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/wanxiang_doneed_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/wanxiang_doneed_test.zip "$PACKAGE"
          unzip -t /tmp/wanxiang_doneed_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/wanxiang_doneed_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/wanxiang_doneed_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Wanxiang-Doneed-600371-annual-2020-2025-latest-quarter-v2
          path: 万向德农_600371_2020-2025年报及最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
