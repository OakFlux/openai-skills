name: Fast scan Eastmoney for Henghe reports

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-eastmoney-fast-scan-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Scan exact publication dates
        run: |
          python - <<'PY'
          import json, requests, time
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          api='https://reportapi.eastmoney.com/report/list'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=4,backoff_factor=.5,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}))))
          windows=[('2023-06-19','2023-06-21'),('2017-05-22','2017-05-24'),('2016-08-17','2016-08-19'),('2024-03-08','2024-03-10')]
          found={}
          for begin,end in windows:
            page=1
            while page<=20:
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(api,params=params,timeout=45); r.raise_for_status(); data=r.json(); rows=data.get('data') or []; hits=int(data.get('hits') or 0)
              print('META',begin,end,page,'hits',hits,'rows',len(rows))
              for x in rows:
                blob='|'.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName'))
                if '横河' in blob or '300539' in blob:
                  info=str(x.get('infoCode') or '')
                  found[info]=x
                  print('MATCH',json.dumps(x,ensure_ascii=False))
              if not rows or page*100>=hits: break
              page+=1; time.sleep(.1)
          print('FOUND',len(found))
          for info,x in found.items():
            print('FINAL',info,json.dumps(x,ensure_ascii=False))
            print('PDF',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf')
          PY
