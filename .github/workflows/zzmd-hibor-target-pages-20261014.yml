name: Fetch target Hibor Zhengzhou Coal pages 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-hibor-target-pages-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch target report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          ids = ['2072487', '2137777', '2133283', '1191797', '420954', '101288']
          hosts = ['https://www.hibor.com.cn', 'https://wt.hibor.com.cn', 'https://sysbg.hibor.com.cn', 'https://wap.hibor.com.cn']
          out = Path('zzmd_hibor_target_pages')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.hibor.com.cn/'
          })
          summaries = []
          for did in ids:
              for host in hosts:
                  url = f'{host}/docdetail_{did}.html'
                  try:
                      r = s.get(url, timeout=(15, 45), allow_redirects=True)
                      r.encoding = r.apparent_encoding or r.encoding or 'gb18030'
                      html = r.text
                      hostkey = urllib.parse.urlparse(host).netloc.replace('.', '_')
                      name = f'{did}_{hostkey}'
                      (out / f'{name}.html').write_text(html, encoding='utf-8', errors='replace')
                      soup = BeautifulSoup(html, 'lxml')
                      assets = []
                      for tag in soup.find_all(True):
                          for attr in ('href','src','data-src','data-url','data-href','action','onclick'):
                              val = tag.get(attr)
                              if not isinstance(val, str) or not val.strip():
                                  continue
                              absolute = urllib.parse.urljoin(r.url, val.strip())
                              label = ' '.join(tag.get_text(' ', strip=True).split())[:200]
                              if did in absolute or any(k in absolute.lower() for k in ('pdf','download','attach','upload','preview','read','view','image','file')) or any(k in label for k in ('报告原文','点击浏览','下载','PDF')):
                                  assets.append({'tag':tag.name,'attr':attr,'raw':val,'url':absolute,'text':label})
                      seen = set(); unique = []
                      for x in assets:
                          if x['url'] not in seen:
                              seen.add(x['url']); unique.append(x)
                      (out / f'{name}_assets.json').write_text(json.dumps(unique, ensure_ascii=False, indent=2), encoding='utf-8')
                      clean = BeautifulSoup(html, 'lxml')
                      for tag in clean(['script','style','noscript']):
                          tag.decompose()
                      text = '\n'.join(x.strip() for x in clean.get_text('\n').splitlines() if x.strip())
                      (out / f'{name}.txt').write_text(text, encoding='utf-8')
                      rec = {
                          'id':did,'host':host,'requested':url,'status':r.status_code,'final':r.url,
                          'bytes':len(r.content),'content_type':r.headers.get('content-type',''),
                          'title':soup.title.get_text(' ',strip=True) if soup.title else '',
                          'text_chars':len(text),'assets':len(unique),
                          'sample':text[:2000]
                      }
                      summaries.append(rec)
                      print(json.dumps(rec, ensure_ascii=False))
                  except Exception as exc:
                      rec = {'id':did,'host':host,'requested':url,'error':repr(exc)}
                      summaries.append(rec)
                      print(json.dumps(rec, ensure_ascii=False))
          (out / 'summaries.json').write_text(json.dumps(summaries, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload target pages
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-hibor-target-pages-20261014
          path: zzmd_hibor_target_pages
          retention-days: 2
          if-no-files-found: error
