name: Temporary Sinopec Oilfield Service broker report package

on:
  push:
    branches:
      - tmp/sinopec-oilfield-broker-reports-20260908
    paths:
      - .github/workflows/tmp-sinopec-oilfield-broker-reports-20260908.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF

      - name: Download, validate, and package reports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests

          root = Path("sinopec_oilfield_service_package")
          package = root / "中石化油服_券商深度报告_2份"
          package.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "index": 1,
                  "broker": "中银证券",
                  "date": "2018-01-09",
                  "title": "油服业务受益油价反弹、页岩气开发，油田环保、管线运维等提供新增长点",
                  "pages": 28,
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP201801091075621589_1.pdf",
                  "filename": "01_中银证券_油服业务受益油价反弹页岩气开发_2018-01-09_28页.pdf",
              },
              {
                  "index": 2,
                  "broker": "川财证券",
                  "date": "2019-09-06",
                  "title": "石化油服深度报告：保障国内能源安全确保中长期发展",
                  "pages": 38,
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP201909061349605156_1.pdf",
                  "filename": "02_川财证券_保障国内能源安全确保中长期发展_2019-09-06_38页.pdf",
              },
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
          })

          def download(url: str) -> bytes:
              last_error = None
              for attempt in range(1, 7):
                  try:
                      response = session.get(
                          url,
                          timeout=120,
                          headers={
                              "Referer": "https://data.eastmoney.com/",
                              "Accept": "application/pdf,*/*;q=0.8",
                          },
                      )
                      response.raise_for_status()
                      data = response.content
                      if len(data) < 50_000:
                          raise RuntimeError(f"payload too small: {len(data)} bytes")
                      if not data.startswith(b"%PDF"):
                          raise RuntimeError(f"unexpected header: {data[:20]!r}")
                      return data
                  except Exception as exc:
                      last_error = exc
                      time.sleep(min(attempt * 2, 10))
              raise RuntimeError(f"download failed for {url}: {last_error!r}")

          manifest = []
          for report in reports:
              data = download(report["url"])
              out = package / report["filename"]
              out.write_bytes(data)

              doc = pymupdf.open(stream=data, filetype="pdf")
              page_count = doc.page_count
              encrypted = bool(doc.needs_pass)
              sample_pages = sorted(set([0, max(0, page_count // 2), page_count - 1]))
              sample_text_chars = 0
              for page_index in sample_pages:
                  sample_text_chars += len("".join(doc.load_page(page_index).get_text("text").split()))
              doc.close()

              if page_count != report["pages"]:
                  raise RuntimeError(
                      f'page-count mismatch for {report["filename"]}: '
                      f'{page_count} != {report["pages"]}'
                  )
              if encrypted:
                  raise RuntimeError(f'encrypted PDF: {report["filename"]}')

              sha256 = hashlib.sha256(data).hexdigest()
              item = {
                  **report,
                  "size_bytes": len(data),
                  "sha256": sha256,
                  "validated_page_count": page_count,
                  "sample_text_chars": sample_text_chars,
                  "format": "券商公开原始PDF",
              }
              manifest.append(item)
              print("VALID", json.dumps(item, ensure_ascii=False))

          readme_lines = [
              "中石化油服（600871.SH / 01033.HK）券商深度报告，共2份",
              "",
              "本压缩包直接包含2份完整PDF，不含网页快捷方式、下载脚本或中转页面。",
              "两份文件均为公开可直接获取的券商原始PDF，并已校验PDF文件头、页数和ZIP完整性。",
              "",
          ]
          for item in manifest:
              readme_lines.extend([
                  f'{item["index"]}. {item["broker"]}｜{item["date"]}｜{item["pages"]}页',
                  f'   {item["title"]}',
                  f'   文件：{item["filename"]}',
                  f'   SHA-256：{item["sha256"]}',
                  "",
              ])

          (package / "README_CN.txt").write_text(
              "\n".join(readme_lines), encoding="utf-8"
          )
          (package / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          (package / "SHA256SUMS.txt").write_text(
              "\n".join(f'{x["sha256"]}  {x["filename"]}' for x in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = root / "中石化油服_券商深度报告_2份.zip"
          with zipfile.ZipFile(
              zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6
          ) as archive:
              for file in sorted(package.iterdir()):
                  archive.write(file, arcname=file.name)

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
              pdf_count = sum(
                  name.lower().endswith(".pdf") for name in archive.namelist()
              )
              if pdf_count != 2:
                  raise RuntimeError(
                      f"ZIP contains {pdf_count} PDFs instead of 2"
                  )

          summary = {
              "zip_filename": zip_path.name,
              "zip_size_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "reports": manifest,
          }
          (root / "build_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("SUMMARY", json.dumps(summary, ensure_ascii=False))
          PY

      - name: Upload completed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sinopec-oilfield-service-broker-reports
          path: sinopec_oilfield_service_package/中石化油服_券商深度报告_2份.zip
          retention-days: 1
          if-no-files-found: error

      - name: Upload validation summary
        uses: actions/upload-artifact@v4
        with:
          name: sinopec-oilfield-service-broker-reports-verification
          path: sinopec_oilfield_service_package/build_summary.json
          retention-days: 1
          if-no-files-found: error
