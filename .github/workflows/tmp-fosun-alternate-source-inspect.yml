name: Temporary Fosun alternate source inspection

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-alternate-source-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 PyMuPDF
      - name: Inspect public pages and downloadable resources
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests, pymupdf
          from bs4 import BeautifulSoup

          out=Path('fosun_alt_sources'); out.mkdir()
          pages=[
            ('vzkoo_fangzheng','https://www.vzkoo.com/read/202403267dbdb4ccff42426bf1fb1fb6.html'),
            ('hangyan_dongwu','https://www.hangyan.co/reports/3039439294692328482'),
            ('10100_zheshang','https://www.10100.com/article/31874150'),
            ('book118_fangzheng','https://max.book118.com/html/2024/0418/5034043032011143.shtm'),
          ]
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
          }
          for key,url in pages:
            print('\n===== PAGE',key,url,'=====')
            s=requests.Session(); s.headers.update(headers)
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url,'COOKIES',s.cookies.get_dict())
              text=r.text
              (out/f'{key}.html').write_text(text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
              candidates=[]
              for tag in soup.find_all(['a','iframe','embed','object','script','img','source','form','input','button']):
                attrs={k:tag.get(k) for k in ['href','src','data','action','value','onclick','id','name','type','class','data-src','data-url','data-id','data-file','data-pdf'] if tag.get(k) is not None}
                label=tag.get_text(' ',strip=True)[:200]
                blob=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(x in blob for x in ['.pdf','download','下载','report','file','document','read','preview','oss','cos','cdn']):
                  print('TAG',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False)[:3000])
                for attr in ['href','src','data','data-src','data-url','data-file','data-pdf']:
                  value=tag.get(attr)
                  if value:
                    absolute=urljoin(r.url,value)
                    if any(x in absolute.lower() for x in ['.pdf','download','report','file','document','preview','oss','cos']):
                      candidates.append(absolute)
              decoded=html.unescape(text).replace('\\/','/')
              patterns=[
                r'https?://[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',
                r'https?://[^"\'<>\s]+(?:download|file|report|document|preview)[^"\'<>\s]*',
                r'[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',
                r'(?i)(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|reportUrl|report_url|ossUrl|url)\s*[:=]\s*["\']([^"\']+)',
              ]
              for pat in patterns:
                matches=re.findall(pat,decoded,re.I)
                for match in matches:
                  value=match if isinstance(match,str) else next((x for x in match if x), '')
                  if value:
                    candidates.append(urljoin(r.url,value))
              candidates=sorted(set(candidates))
              print('CANDIDATES',len(candidates))
              for c in candidates[:200]: print('CANDIDATE',c[:2000])

              # Try only directly exposed candidate URLs; no auth or token bypass.
              for idx,c in enumerate(candidates[:80]):
                if c.startswith('javascript:'): continue
                try:
                  rr=s.get(c,headers={'Referer':r.url,**headers},timeout=35,allow_redirects=True)
                  rec={'url':c,'status':rr.status_code,'bytes':len(rr.content),'type':rr.headers.get('content-type'),'final':rr.url,'disp':rr.headers.get('content-disposition'),'magic':rr.content[:10].hex()}
                  if rr.content.startswith(b'%PDF') and len(rr.content)>50000:
                    doc=pymupdf.open(stream=rr.content,filetype='pdf'); rec['pages']=doc.page_count; rec['first']=re.sub(r'\s+',' ',doc.load_page(0).get_text('text')).strip()[:1200]; rec['last']=re.sub(r'\s+',' ',doc.load_page(doc.page_count-1).get_text('text')).strip()[:500]; doc.close()
                    pdf=out/f'{key}_candidate_{idx}.pdf'; pdf.write_bytes(rr.content); rec['saved']=pdf.name
                  print('FETCH',json.dumps(rec,ensure_ascii=False))
                except Exception as e: print('FETCH_ERROR',c,repr(e))
            except Exception as e:
              print('PAGE_ERROR',key,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fosun-alternate-source-inspection
          path: fosun_alt_sources/
          retention-days: 1
          if-no-files-found: error
