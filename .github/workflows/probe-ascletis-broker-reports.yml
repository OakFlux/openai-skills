name: Probe Ascletis Pharma broker reports

on:
  push:
    branches:
      - chatgpt-ascletis-one-20260906
    paths:
      - '.github/workflows/probe-ascletis-broker-reports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_ascletis_broker_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: ascletis-broker-report-probe
          path: ascletis_probe_results.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
