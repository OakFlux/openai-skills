name: Inspect RoboSense HKEX API v2
on:
  push:
    branches:
      - tmp-robosense-api-discovery-v2-20260914
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query title search endpoint
        run: |
          set -euo pipefail
          mkdir -p output
          python -m pip install --quiet 'httpx[http2]'
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx

          endpoint='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          params={
            'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK',
            'stockId':'1000211551','documentType':'-1','fromDate':'20230101','toDate':'20260914',
            'title':'','searchType':'1','t1code':'40000','t2Gcode':'-2','t2code':'-2',
            'rowRange':'2000','lang':'EN'
          }
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000211551'
          }
          with httpx.Client(http2=True, timeout=60, follow_redirects=True, headers=headers) as client:
            r=client.get(endpoint,params=params)
          Path('output/raw.txt').write_bytes(r.content)
          print('STATUS',r.status_code,'CONTENT_TYPE',r.headers.get('content-type'),'LENGTH',len(r.content),'URL',r.url)
          r.raise_for_status()
          outer=r.json()
          Path('output/outer.json').write_text(json.dumps(outer,ensure_ascii=False,indent=2),encoding='utf-8')
          if isinstance(outer,dict) and 'result' in outer:
            inner=json.loads(outer['result']) if isinstance(outer['result'],str) else outer['result']
          else:
            inner=outer
          Path('output/inner.json').write_text(json.dumps(inner,ensure_ascii=False,indent=2),encoding='utf-8')
          print('OUTER_TYPE',type(outer).__name__,'INNER_TYPE',type(inner).__name__)
          if isinstance(inner,dict):
            print('INNER_KEYS',list(inner.keys()))
            for k,v in inner.items():
              print('KEY',k,'TYPE',type(v).__name__,'LEN',len(v) if hasattr(v,'__len__') else None)
          items=[]
          if isinstance(inner,list): items=inner
          elif isinstance(inner,dict):
            for value in inner.values():
              if isinstance(value,list) and value and isinstance(value[0],dict): items.extend(value)
          print('ITEM_COUNT',len(items))
          for item in items:
            blob=json.dumps(item,ensure_ascii=False)
            if any(t in blob.upper() for t in ['ANNUAL REPORT','PROSPECTUS','GLOBAL OFFERING','FIRST QUARTER OF 2026','INTERIM RESULTS ANNOUNCEMENT']):
              print('MATCH',blob)
          PY
      - name: Upload diagnostic files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robosense-hkex-api-discovery-v2
          path: output/*
          retention-days: 1
          if-no-files-found: warn
