name: Fast probe AUX Electric report sources 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-fxbaogao-fastprobe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pathlib import Path
          out=Path('fastprobe');out.mkdir()
          urls=[
           'https://www.fxbaogao.com/detail/5454573',
           'https://www.fxbaogao.com/detail/5463740',
           'https://www.fxbaogao.com/detail/5357558',
           'https://www.fxbaogao.com/detail/5353793',
           'https://finance.sina.com.cn/wm/2026-06-01/doc-inhzwckz2640125.shtml',
           'https://finance.sina.com.cn/wm/2026-06-08/doc-iniarzfu8894112.shtml'
          ]
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for i,u in enumerate(urls,1):
           try:
            r=s.get(u,timeout=(15,45),allow_redirects=True)
            text=r.text
            (out/f'{i:02d}.html').write_bytes(r.content)
            soup=BeautifulSoup(text,'lxml')
            arr=[]
            for tag in soup.find_all(True):
             for a in ('src','href','data-src','data-original','content'):
              v=tag.get(a)
              if v and isinstance(v,str):
               v=html.unescape(v).replace('\\/','/')
               if not v.startswith(('data:','javascript:','#')): arr.append(urljoin(r.url,v))
            for m in re.finditer(r'https?://[^\s"\'<>]+',text): arr.append(html.unescape(m.group(0)).replace('\\/','/'))
            rec={'url':u,'status':r.status_code,'final':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'bytes':len(r.content),'urls':sorted(set(x for x in arr if len(x)<2000))}
            (out/f'{i:02d}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
            print(i,r.status_code,len(r.content),rec['title'])
           except Exception as e:
            (out/f'{i:02d}.json').write_text(json.dumps({'url':u,'error':repr(e)},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "\.pdf|download|sourceUrl|fileUrl|pdfUrl|oss|cos|cdn|preview|attachment|original|image" fastprobe > fastprobe/grep.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: aux-electric-fastprobe
          path: fastprobe
          retention-days: 7
          if-no-files-found: error
