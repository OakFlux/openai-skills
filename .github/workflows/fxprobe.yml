name: Temporary FXBaogao full report viewer inspection
on:
  push:
    branches: [tmp-towngas-fxprobe-20260905]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect viewer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 selenium
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          urls=['https://www.fxbaogao.com/detail/5316216','https://www.fxbaogao.com/view?id=5316216']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://www.fxbaogao.com/detail/5316216'})
          for url in urls:
              try:
                  r=s.get(url,timeout=60,allow_redirects=True)
                  print('REQUEST',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  Path('requests_'+re.sub(r'[^a-zA-Z0-9]+','_',url)+'.html').write_text(r.text,encoding='utf-8')
                  soup=BeautifulSoup(r.text,'html.parser')
                  for tag in soup.find_all(['img','script','iframe','a','source','embed']):
                      for attr in ['src','href','data-src','data-url','file']:
                          v=tag.get(attr)
                          if v and re.search(r'image|pdf|report|view|download|5316216',v,re.I): print('REQ_LINK',tag.name,attr,v,flush=True)
                  for kw in ['5316216','report-image','pageNum','totalPage','pdf','download','view']:
                      for m in list(re.finditer(kw,r.text,re.I))[:20]: print('REQ_CTX',kw,r.text[max(0,m.start()-500):m.start()+1200].replace('\n',' ')[:1700],flush=True)
              except Exception as e: print('REQUEST_ERROR',url,repr(e),flush=True)

          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1600,1200'); opts.add_argument('--disable-gpu')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
              driver.get('https://www.fxbaogao.com/detail/5316216'); time.sleep(3)
              print('DETAIL_BROWSER',driver.current_url,driver.title,len(driver.page_source),flush=True)
              driver.get('https://www.fxbaogao.com/view?id=5316216'); time.sleep(5)
              for j in range(20):
                  driver.execute_script('window.scrollTo(0, document.body.scrollHeight * arguments[0] / 20);',j+1); time.sleep(.5)
              source=driver.page_source
              Path('browser_view.html').write_text(source,encoding='utf-8')
              print('VIEW_BROWSER',driver.current_url,driver.title,len(source),driver.execute_script('return document.body.scrollHeight'),flush=True)
              driver.save_screenshot('viewer.png')
              elems=driver.find_elements(By.CSS_SELECTOR,'img,iframe,embed,source,a')
              data=[]
              for e in elems:
                  rec={'tag':e.tag_name,'src':e.get_attribute('src'),'href':e.get_attribute('href'),'data_src':e.get_attribute('data-src'),'data_url':e.get_attribute('data-url'),'text':e.text[:200]}
                  if any(rec.get(k) and re.search(r'image|pdf|report|view|download|5316216',str(rec[k]),re.I) for k in ['src','href','data_src','data_url']):
                      data.append(rec); print('DOM',json.dumps(rec,ensure_ascii=False),flush=True)
              Path('dom.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
              logs=[]
              for item in driver.get_log('performance'):
                  try:
                      msg=json.loads(item['message'])['message']
                      if msg['method'] in ('Network.responseReceived','Network.requestWillBeSent'):
                          p=msg['params']; obj=p.get('response') or p.get('request') or {}; u=obj.get('url','')
                          if re.search(r'fxbaogao|report-image|\.pdf|5316216|document|preview',u,re.I):
                              rec={'method':msg['method'],'url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')}; logs.append(rec); print('NET',json.dumps(rec,ensure_ascii=False),flush=True)
                  except Exception: pass
              Path('network.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
              for entry in driver.get_log('browser'): print('BROWSER_LOG',entry,flush=True)
          finally:
              driver.quit()
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-viewer-inspection
          path: |
            *.html
            *.json
            viewer.png
          retention-days: 1
          if-no-files-found: error
