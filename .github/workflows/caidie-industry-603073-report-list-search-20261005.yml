name: Search CaiDie Industry report lists 20261005

on:
  push:
    paths:
      - '.github/workflows/caidie-industry-603073-report-list-search-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Query Eastmoney and Sina report lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          eastmoney_results = []
          endpoints = [
              'https://reportapi.eastmoney.com/report/list',
              'https://reportapi.eastmoney.com/report/list2',
          ]
          param_variants = [
              {
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2020-01-01','endTime':'2030-12-31','pageNo':'1','fields':'','qType':'0',
                  'orgCode':'','code':'603073','rcode':'','p':'1','pageNum':'1','pageNumber':'1'
              },
              {
                  'pageSize':'100','pageNo':'1','code':'603073','qType':'0',
                  'beginTime':'2020-01-01','endTime':'2030-12-31'
              },
          ]
          for endpoint in endpoints:
              for params in param_variants:
                  for method in ('get','post'):
                      key = f'{endpoint.rsplit("/",1)[-1]}_{method}_{len(eastmoney_results)}'
                      try:
                          if method == 'get':
                              r = session.get(endpoint, params=params, headers={'Referer':'https://data.eastmoney.com/report/'}, timeout=(20,90))
                          else:
                              r = session.post(endpoint, params=params, data=params, headers={'Referer':'https://data.eastmoney.com/report/'}, timeout=(20,90))
                          parsed = None
                          try:
                              parsed = r.json()
                          except Exception:
                              m = re.search(r'^[^(]*\((.*)\)\s*;?$', r.text, re.S)
                              if m:
                                  try: parsed = json.loads(m.group(1))
                                  except Exception: pass
                          eastmoney_results.append({
                              'key':key,'status':r.status_code,'url':r.url,
                              'content_type':r.headers.get('content-type'),
                              'text':r.text[:500000],'json':parsed,
                          })
                      except Exception as exc:
                          eastmoney_results.append({'key':key,'error':repr(exc)})
                      time.sleep(.15)

          sina_pages = []
          for symbol in ('sh603073','603073'):
              for p in range(1, 8):
                  url = f'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol={symbol}&t1=all&p={p}'
                  try:
                      r = session.get(url, headers={'Referer':'https://finance.sina.com.cn/'}, timeout=(20,90))
                      raw = r.content
                      text = raw.decode('gb18030','replace')
                      soup = BeautifulSoup(text, 'lxml')
                      links = []
                      for a in soup.find_all('a', href=True):
                          href = a.get('href') or ''
                          label = ' '.join(a.get_text(' ', strip=True).split())
                          if 'vReport_Show' in href or 'rptid' in href:
                              links.append({'label':label,'href':href})
                      sina_pages.append({
                          'symbol':symbol,'page':p,'status':r.status_code,'url':r.url,
                          'bytes':len(raw),'title':soup.title.get_text(' ',strip=True) if soup.title else '',
                          'links':links,'html':text[:500000],
                      })
                  except Exception as exc:
                      sina_pages.append({'symbol':symbol,'page':p,'url':url,'error':repr(exc)})
                  time.sleep(.12)

          Path('out/eastmoney.json').write_text(json.dumps(eastmoney_results,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/sina.json').write_text(json.dumps(sina_pages,ensure_ascii=False,indent=2),encoding='utf-8')

          print('=== EASTMONEY ===')
          for item in eastmoney_results:
              print('\n',item.get('key'), item.get('status'), item.get('url'), item.get('error'))
              j=item.get('json')
              if isinstance(j,dict):
                  print('keys',list(j.keys())[:30])
                  data=j.get('data')
                  if isinstance(data,list): rows=data
                  elif isinstance(data,dict): rows=data.get('data') or data.get('list') or data.get('items') or data.get('rows') or []
                  else: rows=[]
                  print('rows',len(rows) if isinstance(rows,list) else type(rows).__name__)
                  if isinstance(rows,list):
                      for row in rows[:100]: print(json.dumps(row,ensure_ascii=False))
              else:
                  print((item.get('text') or '')[:3000])

          print('\n=== SINA ===')
          unique={}
          for page in sina_pages:
              for link in page.get('links',[]):
                  unique[link['href']]=link
          for href,link in unique.items(): print(link['label'], href)
          print('unique links',len(unique))
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: caidie-industry-603073-report-list-search
          path: out
          retention-days: 7
          if-no-files-found: error
