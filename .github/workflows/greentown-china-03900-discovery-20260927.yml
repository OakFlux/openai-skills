name: Discover Greentown China 03900 report links 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-china-03900-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch official report pages and extract links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('greentown_discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          years=range(2020,2027)
          all_results=[]
          for year in years:
            url=f'https://www.greentownchina.com/tc/ir/reports.php?year={year}'
            r=s.get(url,timeout=(30,180),allow_redirects=True)
            print('PAGE',year,r.status_code,len(r.content),r.url,flush=True)
            (out/f'{year}.html').write_bytes(r.content)
            text=r.text
            soup=BeautifulSoup(text,'lxml')
            candidates=set()
            for tag in soup.find_all(True):
              for attr in ('href','src','data','data-src','data-url','onclick'):
                v=tag.get(attr)
                if not v: continue
                v=html.unescape(str(v)).replace('\\/','/')
                if attr=='onclick':
                  for m in re.finditer(r"['\"]([^'\"]+\.(?:pdf|PDF)(?:\?[^'\"]*)?)['\"]",v):
                    candidates.add(urljoin(r.url,m.group(1)))
                else:
                  candidates.add(urljoin(r.url,v))
            for pat in [
              r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
              r'["\']([^"\']+?\.pdf(?:\?[^"\']*)?)["\']',
              r'(?:href|src|data-url|url)\s*[:=]\s*["\']([^"\']+)["\']',
            ]:
              for m in re.finditer(pat,text,re.I):
                v=m.group(1) if m.lastindex else m.group(0)
                candidates.add(urljoin(r.url,html.unescape(v).replace('\\/','/')))
            interesting=[]
            for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in ('pdf','年報','年报','中期報告','中期报告','annual report','interim report')):
                st=re.sub(r'\s+',' ',line).strip()
                if st and len(st)<4000: interesting.append(st)
            rec={'year':year,'page_url':r.url,'status':r.status_code,'title':soup.title.get_text(' ',strip=True) if soup.title else '',
                 'candidates':sorted(candidates),'interesting_lines':interesting[:300]}
            (out/f'{year}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
            all_results.append(rec)
            time.sleep(.3)
          (out/'all_results.json').write_text(json.dumps(all_results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "\.pdf|annual report|interim report|年報|中期報告|年报|中期报告" greentown_discovery > greentown_discovery/grep_hits.txt || true
          find greentown_discovery -type f -printf '%f %s bytes\n' | sort > greentown_discovery/file_sizes.txt
      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-03900-discovery
          path: greentown_discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
