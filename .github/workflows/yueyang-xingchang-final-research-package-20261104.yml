name: Build verified Yueyang Xingchang research package 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-final-research-package-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow img2pdf

      - name: Download reconstruct validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          CODE = '000819'
          SHORT = '岳阳兴长'
          PACKAGE = '岳阳兴长_000819_券商深度研究资料_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / 'PDF报告'
          PREV = ROOT / '页面预览'
          IMGDIR = ROOT / '_page_images_work'
          for d in (ROOT, PDFDIR, PREV, IMGDIR):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def download_pdf(urls: list[str], destination: Path, min_pages: int, identity_tokens: list[str], title_tokens: list[str], broker_tokens: list[str]) -> dict:
              attempts = []
              accepted = None
              for url in urls:
                  for attempt in range(4):
                      try:
                          referer = 'https://data.eastmoney.com/report/'
                          if 'iyanbao.com' in url:
                              referer = 'https://www.iyanbao.com/'
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 420), allow_redirects=True,
                          )
                          record = {
                              'url': url, 'attempt': attempt + 1,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          attempts.append(record)
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 80000:
                              reader = PdfReader(io.BytesIO(response.content), strict=False)
                              pages = len(reader.pages)
                              if pages < min_pages:
                                  record['validation_error'] = f'only {pages} pages'
                                  break
                              text = ''
                              for page in reader.pages[:min(50, pages)]:
                                  try:
                                      text += '\n' + (page.extract_text() or '')
                                  except Exception:
                                      pass
                              compact = normalize(text)
                              identity_hits = [x for x in identity_tokens if normalize(x) in compact]
                              title_hits = [x for x in title_tokens if normalize(x) in compact]
                              broker_hits = [x for x in broker_tokens if normalize(x) in compact]
                              if len(compact) > 600 and not identity_hits:
                                  record['validation_error'] = 'issuer mismatch'
                                  break
                              if len(compact) > 600 and not title_hits:
                                  record['validation_error'] = 'title mismatch'
                                  break
                              if len(compact) > 600 and not broker_hits:
                                  record['validation_error'] = 'broker mismatch'
                                  break
                              accepted = {
                                  'data': response.content,
                                  'source_url': url,
                                  'pages': pages,
                                  'identity_hits': identity_hits,
                                  'title_hits': title_hits,
                                  'broker_hits': broker_hits,
                              }
                              break
                          if response.status_code in (400,401,403,404,410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if accepted is not None:
                      break
              if accepted is None:
                  raise RuntimeError(f'PDF download/validation failed for {destination.name}: {attempts}')
              destination.write_bytes(accepted['data'])
              subprocess.run(['qpdf','--warning-exit-0','--check',str(destination)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              return {**accepted, 'attempts': attempts, 'sha256': hashlib.sha256(accepted['data']).hexdigest(), 'bytes': len(accepted['data'])}

          manifest = []

          # Report 1: reconstruct the complete 24-page public full-page preview into one image-based PDF.
          deep_title = '炼化精细化工龙头，短期重点关注特种聚丙烯'
          deep_pdf = PDFDIR / '01_国联证券_岳阳兴长_炼化精细化工龙头短期重点关注特种聚丙烯_2022-10-31_公开页面合成版.pdf'
          image_files = []
          image_records = []
          for page_no in range(1, 25):
              candidates = [
                  f'https://public.fxbaogao.com/report-image/2022/11/01/3433347-{page_no}.png',
                  f'https://public.fxbaogao.com/report-image/2022/11/01/3433347-{page_no}.png?x-oss-process=image/format,png',
                  f'https://public.fxbaogao.com/report-image/2022/11/01/3433347-{page_no}.png?x-oss-process=image/format,webp',
              ]
              accepted = None
              attempts = []
              for url in candidates:
                  try:
                      response = session.get(
                          url,
                          headers={
                              'User-Agent': ua,
                              'Referer': 'https://www.fxbaogao.com/detail/3433347',
                              'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                          },
                          timeout=(30, 300), allow_redirects=True,
                      )
                      attempt = {'url':url,'status':response.status_code,'bytes':len(response.content),'type':response.headers.get('content-type',''),'final_url':response.url}
                      attempts.append(attempt)
                      if response.status_code == 200 and len(response.content) > 25000:
                          try:
                              image = Image.open(io.BytesIO(response.content))
                              image.load()
                              width, height = image.size
                              attempt.update({'format':image.format,'width':width,'height':height})
                              if width < 800 or height < 1000:
                                  attempt['validation_error'] = 'image resolution too small'
                                  continue
                              accepted = (image.convert('RGB'), url, width, height, len(response.content))
                              break
                          except Exception as exc:
                              attempt['image_error'] = repr(exc)
                  except Exception as exc:
                      attempts.append({'url':url,'error':repr(exc)})
              if accepted is None:
                  raise RuntimeError(f'Could not retrieve full-resolution page {page_no}: {attempts}')
              image, source_url, width, height, source_bytes = accepted
              image_path = IMGDIR / f'deep_{page_no:02d}.jpg'
              image.save(image_path, 'JPEG', quality=95, optimize=True, progressive=False)
              image_files.append(str(image_path))
              image_records.append({'page':page_no,'source_url':source_url,'source_bytes':source_bytes,'width':width,'height':height,'attempts':attempts,'jpg_bytes':image_path.stat().st_size})
              print('PAGE_IMAGE_VERIFIED', page_no, width, height, source_bytes, source_url)

          deep_pdf.write_bytes(img2pdf.convert(image_files))
          deep_reader = PdfReader(str(deep_pdf), strict=False)
          if len(deep_reader.pages) != 24:
              raise RuntimeError(f'Deep report reconstructed page count mismatch: {len(deep_reader.pages)}')
          subprocess.run(['qpdf','--warning-exit-0','--check',str(deep_pdf)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          deep_sha = hashlib.sha256(deep_pdf.read_bytes()).hexdigest()
          manifest.append({
              'broker': '国联证券',
              'date': '2022-10-31',
              'title': deep_title,
              'classification': '公司深度研究／首次覆盖',
              'analyst': '柴沁虎',
              'rating': '买入（首次）',
              'file_nature': '由公开可访问的24张完整页面图像按原页序合成为图像型PDF；不是券商原始PDF文件',
              'source_page': 'https://www.fxbaogao.com/detail/3433347',
              'source_image_pattern': 'https://public.fxbaogao.com/report-image/2022/11/01/3433347-{page}.png',
              'filename': str(Path('PDF报告') / deep_pdf.name),
              'actual_pages': 24,
              'bytes': deep_pdf.stat().st_size,
              'sha256': deep_sha,
              'page_images': image_records,
              'validation': ['24/24 public full-page images','minimum page resolution','PDF page count','qpdf structure','first and last page rendering'],
          })

          # Report 2: complete original first-coverage PDF.
          report2_pdf = PDFDIR / '02_中邮证券_岳阳兴长_业绩符合预期高端聚烯烃项目明年投产_2022-09-18.pdf'
          report2 = download_pdf(
              ['https://pdf.dfcfw.com/pdf/H3_AP202209181578487364_1.pdf'],
              report2_pdf, 5,
              ['岳阳兴长','000819'],
              ['业绩符合预期','高端聚烯烃项目明年投产'],
              ['中邮证券'],
          )
          manifest.append({
              'broker':'中邮证券','date':'2022-09-18','title':'业绩符合预期，高端聚烯烃项目明年投产',
              'classification':'公司首次覆盖报告','analyst':'钟浩','rating':'买入',
              'file_nature':'券商原始完整PDF','source_page':'https://data.eastmoney.com/report/info/AP202209181578487364.html',
              'source_url':report2['source_url'],'filename':str(Path('PDF报告')/report2_pdf.name),
              'actual_pages':report2['pages'],'bytes':report2['bytes'],'sha256':report2['sha256'],
              'identity_hits':report2['identity_hits'],'title_hits':report2['title_hits'],'broker_hits':report2['broker_hits'],
              'download_attempts':report2['attempts'],
              'validation':['PDF header','issuer identity','broker identity','report title','page count','qpdf structure','first-page rendering'],
          })

          # Report 3: complete original follow-up PDF, useful for project commissioning and catalyst updates.
          report3_pdf = PDFDIR / '03_国联证券_岳阳兴长_惠州项目即将投产茂金属催化剂平台持续成长_2023-06-25.pdf'
          report3 = download_pdf(
              ['https://file.iyanbao.com/pdf/e0e5c-18eefe2a-5daa-4a7e-90d5-97ed2704e72a.pdf'],
              report3_pdf, 3,
              ['岳阳兴长','000819'],
              ['惠州项目即将投产','茂金属催化剂平台持续成长'],
              ['国联证券'],
          )
          manifest.append({
              'broker':'国联证券','date':'2023-06-25','title':'惠州项目即将投产，茂金属催化剂平台持续成长',
              'classification':'公司跟踪研究报告','analyst':'柴沁虎','rating':'买入（维持）',
              'file_nature':'券商原始完整PDF','source_page':'https://www.fxbaogao.com/detail/4093448',
              'source_url':report3['source_url'],'filename':str(Path('PDF报告')/report3_pdf.name),
              'actual_pages':report3['pages'],'bytes':report3['bytes'],'sha256':report3['sha256'],
              'identity_hits':report3['identity_hits'],'title_hits':report3['title_hits'],'broker_hits':report3['broker_hits'],
              'download_attempts':report3['attempts'],
              'validation':['PDF header','issuer identity','broker identity','report title','page count','qpdf structure','first-page rendering'],
          })

          # Render previews: every report first page; deep report also last page.
          for item in manifest:
              pdf_path = ROOT / item['filename']
              prefix = PREV / pdf_path.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(pdf_path),str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              first_preview = Path(str(prefix)+'.png')
              if not first_preview.exists() or first_preview.stat().st_size < 8000:
                  raise RuntimeError(f'First-page render failed: {pdf_path.name}')
              item['first_page_preview'] = str(Path('页面预览')/first_preview.name)
              if item['actual_pages'] == 24:
                  last_prefix = PREV / (pdf_path.stem + '_末页')
                  subprocess.run(['pdftoppm','-f','24','-l','24','-png','-r','125','-singlefile',str(pdf_path),str(last_prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  last_preview = Path(str(last_prefix)+'.png')
                  if not last_preview.exists() or last_preview.stat().st_size < 8000:
                      raise RuntimeError('Deep-report last-page render failed')
                  item['last_page_preview'] = str(Path('页面预览')/last_preview.name)

          # Remove working page images from deliverable.
          for path in IMGDIR.glob('*'):
              path.unlink()
          IMGDIR.rmdir()

          total_pages = sum(int(item['actual_pages']) for item in manifest)
          readme = [
              '岳阳兴长石化股份有限公司（000819.SZ）券商研究资料包',
              '整理日期：2026-11-04', '',
              '收录结构：1份24页公司深度研究＋1份首次覆盖报告＋1份后续跟踪报告。',
              '第一份深度报告的原始PDF直链未在公开页面提供；本包使用报告平台公开可访问的24张完整页面图像，按原页序无裁剪合成为图像型PDF。其余两份为券商原始完整PDF。',
              '未使用网页摘要、行业周报或无关报告凑数。', '',
          ]
          for index, item in enumerate(manifest,1):
              readme += [
                  f'{index}. {item["broker"]}：《{item["title"]}》',
                  f'   日期：{item["date"]}；类型：{item["classification"]}',
                  f'   分析师：{item["analyst"]}；评级：{item["rating"]}',
                  f'   文件性质：{item["file_nature"]}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_page"]}',
                  f'   SHA-256：{item["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：页面数量、页面分辨率、PDF文件头、公司/证券代码、券商与标题文本、实际页数、qpdf结构、首页/末页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),encoding='utf-8')

          chinese_zip = Path(PACKAGE+'.zip')
          with zipfile.ZipFile(chinese_zip,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path,arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip,'r') as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          english_zip = Path('yueyang_xingchang_000819_broker_research_package.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          final_sha = hashlib.sha256(chinese_zip.read_bytes()).hexdigest()
          print('FINAL_ZIP',chinese_zip,chinese_zip.stat().st_size,'SHA256',final_sha)
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: yueyang-xingchang-000819-final-research-package
          path: |
            岳阳兴长_000819_券商深度研究资料_3份.zip
            yueyang_xingchang_000819_broker_research_package.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
