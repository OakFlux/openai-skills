name: Discover SolaX broker report metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solax-688717-eastmoney-report-discovery-20261105.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
              'Origin': 'https://data.eastmoney.com',
              'Referer': 'https://data.eastmoney.com/report/688717.html',
          })
          payload = {
              'pageSize': 100,
              'pageNo': 1,
              'p': 1,
              'pageNum': 1,
              'pageNumber': 1,
              'beginTime': '2024-01-01',
              'endTime': '2026-11-05',
              'code': '688717',
              'industryCode': '*',
              'rating': None,
              'ratingChange': None,
              'orgCode': None,
              'rcode': '',
          }
          r = s.post('https://reportapi.eastmoney.com/report/list2', json=payload, timeout=60)
          print('STATUS', r.status_code, 'BYTES', len(r.content), 'CTYPE', r.headers.get('content-type'), flush=True)
          print('HEAD', r.text[:1000], flush=True)
          r.raise_for_status()
          data = r.json()
          print('TOP_KEYS', list(data.keys()), flush=True)
          rows = data.get('data') or data.get('Data') or data.get('result') or []
          if isinstance(rows, dict):
              rows = rows.get('data') or rows.get('list') or rows.get('items') or []
          print('ROW_COUNT', len(rows), flush=True)
          keep_keys = [
              'infoCode','encodeUrl','title','orgSName','orgName','publishDate','researcher','researcherName',
              'emRatingName','ratingName','ratingChange','attachUrl','pdfUrl','url','stockCode','stockName','column',
              'industryName','count','pageCount','reportType','reportTypeName'
          ]
          out = []
          for row in rows:
              rec = {k: row.get(k) for k in keep_keys if k in row}
              rec['_all_keys'] = sorted(row.keys())
              out.append(rec)
          print('REPORTS_JSON', json.dumps(out, ensure_ascii=False, indent=2), flush=True)
          open('solax_reports.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solax-688717-eastmoney-report-metadata-20261105
          path: solax_reports.json
          if-no-files-found: error
          retention-days: 3
