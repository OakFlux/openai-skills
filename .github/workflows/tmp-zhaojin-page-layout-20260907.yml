name: Inspect Zhaojin report page layout
on:
  push:
    branches:
      - tmp-zhaojin-page-layout-20260907
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download sample page images
        run: |
          mkdir -p output
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://oss.sdyanbao.com/page/2025/8/4/1218250' -o output/page_00.png 'https://oss.sdyanbao.com/page/2025/8/4/1218250/0.png'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://oss.sdyanbao.com/page/2025/8/4/1218250' -o output/page_01.png 'https://oss.sdyanbao.com/page/2025/8/4/1218250/1.png'
      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-page-layout
          path: output/*
          retention-days: 1
