name: Fast query archived Kaichuang report assets

on:
  push:
    paths:
      - '.github/workflows/kaichuang-fast-archive-cdx-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - name: Query focused CDX patterns
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36'})
          patterns=['*.hibor.com.cn/*178938*','*.hibor.com.cn/*210263*','*.hibor.com.cn/*211839*','*/*600097*.pdf']
          for p in patterns:
            for filters in [
              ['statuscode:200','mimetype:application/pdf'],
              ['statuscode:200'],
            ]:
              try:
                r=s.get('https://web.archive.org/cdx/search/cdx',params={'url':p,'output':'json','fl':'timestamp,original,mimetype,statuscode,digest,length','filter':filters,'collapse':'urlkey','limit':'500'},timeout=35)
                print('\nQUERY',p,filters,r.status_code,len(r.content),r.url,flush=True)
                print(r.text[:200000],flush=True)
              except Exception as e: print('ERROR',p,filters,repr(e),flush=True)
          PY
