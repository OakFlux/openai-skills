name: Xujiahui deep report search 20260927
on:
  push:
    paths:
      - '.github/workflows/xujiahui-deep-search-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Search
        run: |
          mkdir -p out
          python - <<'PY'
          import requests
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          p={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':'徐家汇 深度','pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
          r=s.post('https://api.sdyanbao.com/api/file/search',json=p,timeout=60)
          Path('out/result.json').write_text(r.text,encoding='utf-8')
          print(r.status_code)
          print(r.text[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xujiahui-deep-search
          path: out
          retention-days: 7
