name: Temporary Hangyan protected link inspection

on:
  push:
    branches:
      - tmp-hangyan-protected-link-20260906

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch application bundle and inspect protected-link controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from pathlib import Path
          url='https://cdn.hangyan.co/assets/application-ec845e69.js'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.hangyan.co/'},timeout=90)
          print('STATUS',r.status_code,'BYTES',len(r.content),'CTYPE',r.headers.get('content-type'),flush=True)
          r.raise_for_status()
          text=r.text
          Path('application.js').write_text(text,encoding='utf-8')
          for term in ['protected-link','protectedLink','tokenValue','protected_link','native-pdf','cache-key']:
              print('\n=== TERM',term,'COUNT',text.count(term),'===',flush=True)
              start=0
              for idx in range(30):
                  pos=text.find(term,start)
                  if pos<0: break
                  print(text[max(0,pos-1200):min(len(text),pos+2500)],flush=True)
                  start=pos+len(term)
          # Print candidate relative endpoint literals nearby.
          patterns=[r'["\']([^"\']*(?:protected|redirect|resolve|token|links?)[^"\']*)["\']']
          found=set()
          for pat in patterns:
              for m in re.finditer(pat,text,re.I):
                  val=m.group(1)
                  if len(val)<500:
                      found.add(val)
          print('\n=== CANDIDATE_STRINGS ===',flush=True)
          for val in sorted(found):
              print(val,flush=True)
          PY
      - name: Upload JS
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-protected-link-js
          path: application.js
          retention-days: 1
          if-no-files-found: error
