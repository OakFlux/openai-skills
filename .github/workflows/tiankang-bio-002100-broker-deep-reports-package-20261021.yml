name: Package Tiankang Bio 002100 broker deep reports 20261021

on:
  push:
    paths:
      - '.github/workflows/tiankang-bio-002100-broker-deep-reports-package-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='天康生物'
          FULL='天康生物股份有限公司'
          CODE='002100'
          TODAY='2026-10-21'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART):
              d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'broker':'民生证券','date':'2022-06-30',
              'title':'深度报告：积极扩展疆外业务，饲料、养殖、动保全方位发展',
              'info_code':'AP202206301575681498','expected_pages':30,
              'filename':'01_2022-06-30_民生证券_深度报告_积极扩展疆外业务_饲料养殖动保全方位发展.pdf'
            },
            {
              'order':2,'broker':'华安证券','date':'2022-06-30',
              'title':'生猪出栏量快速增长，产业链协同助力发展',
              'info_code':'AP202206301575633524','expected_pages':32,
              'filename':'02_2022-06-30_华安证券_生猪出栏量快速增长_产业链协同助力发展.pdf'
            },
            {
              'order':3,'broker':'太平洋证券','date':'2020-03-02',
              'title':'天康生物深度报告：背靠蓝海，优势铸就，厚积薄发',
              'info_code':'AP202003021375733888','expected_pages':15,
              'filename':'03_2020-03-02_太平洋证券_天康生物深度报告_背靠蓝海_优势铸就_厚积薄发.pdf'
            },
          ]

          candidate_metadata=[
            {'publishDate':'2022-06-30','attachPages':32,'orgSName':'华安证券','title':'生猪出栏量快速增长，产业链协同助力发展','infoCode':'AP202206301575633524','rating':'买入','selected':True},
            {'publishDate':'2022-06-30','attachPages':30,'orgSName':'民生证券','title':'深度报告：积极扩展疆外业务，饲料、养殖、动保全方位发展','infoCode':'AP202206301575681498','rating':'买入','selected':True},
            {'publishDate':'2022-03-11','attachPages':25,'orgSName':'华安证券','title':'积极调整养殖业务，生猪出栏稳步增长','infoCode':'AP202203111551897206','rating':'买入','selected':False},
            {'publishDate':'2020-10-29','attachPages':17,'orgSName':'华鑫证券','title':'乘行业转型之风，养殖板块加速布局','infoCode':'AP202010291424611072','rating':'买入','selected':False},
            {'publishDate':'2020-03-02','attachPages':15,'orgSName':'太平洋证券','title':'天康生物深度报告：背靠蓝海，优势铸就，厚积薄发','infoCode':'AP202003021375733888','rating':'买入','selected':True},
            {'publishDate':'2019-12-31','attachPages':23,'orgSName':'太平洋证券','title':'天康生物：养殖黑马，兼具天时地利人和，非瘟防控优势突出','infoCode':'AP201912311373134031','rating':'买入','selected':False},
            {'publishDate':'2019-03-22','attachPages':28,'orgSName':'太平洋证券','title':'天康生物：市值明显低估，养殖业务具爆发性','infoCode':'AP201903221308691099','rating':'买入','selected':False},
            {'publishDate':'2020-04-29','attachPages':12,'orgSName':'开源证券','title':'公司首次覆盖报告：全产业链布局的区域养殖龙头，2020年起加速扩张','infoCode':'AP202004291378978935','rating':'买入','selected':False},
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/002100.html',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf'
            ]
            last={}
            for u in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(u,timeout=(30,420),allow_redirects=True)
                  last={'requested_url':u,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                    return r.content,str(r.url),last
                except Exception as e:
                  last={'requested_url':u,'error':repr(e)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,source_url,download_meta=download_pdf(item['info_code'])
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<12:
              raise RuntimeError(f'Too few pages: {dest.name} = {pages}')
            if abs(pages-item['expected_pages'])>2:
              raise RuntimeError(f'Unexpected page count: {dest.name} actual={pages} expected={item["expected_pages"]}')

            txt=RENDER/f'{item["order"]:02d}_full.txt'
            subprocess.run(['pdftotext',str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            text=txt.read_text(encoding='utf-8',errors='ignore')
            identity_ok=any(x in text for x in [COMPANY,FULL,CODE,'天康生物股份'])
            broker_ok=item['broker'] in text or item['broker'].replace('证券','') in text
            theme_hits={k:(k in text) for k in ['生猪','养殖','饲料','动保','疫苗']}
            theme_ok=sum(theme_hits.values())>=3
            if not identity_ok:
              raise RuntimeError(f'Issuer identity check failed: {dest.name}')
            if not broker_ok:
              raise RuntimeError(f'Broker identity check failed: {dest.name}')
            if not theme_ok:
              raise RuntimeError(f'Business-theme check failed: {dest.name}: {theme_hits}')

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0:
              raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'
            last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8_000:
              raise RuntimeError(f'First-page render failed: {dest.name}')
            if not last_png.exists() or last_png.stat().st_size<3_000:
              raise RuntimeError(f'Last-page render failed: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'stock_code':CODE,'stock_name':COMPANY,'company_full_name':FULL,
              'broker':item['broker'],'publish_date':item['date'],'title':item['title'],
              'info_code':item['info_code'],'pages':pages,'bytes':len(data),'sha256':sha,
              'source_url':source_url,'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
              'filename':item['filename'],'identity_check':identity_ok,'broker_check':broker_ok,
              'business_theme_hits':theme_hits,
              'validation':['PDF header','company identity','broker identity','business themes','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })

          if len(manifest)!=3 or len({x['sha256'] for x in manifest})!=3:
            raise RuntimeError('Report count or duplicate check failed')

          readme=[
            '天康生物（002100.SZ；天康生物股份有限公司）券商深度报告资料包',
            f'整理日期：{TODAY}','',
            '收录数量：3份，均为天康生物公司专属、公开可完整下载的长篇券商研究报告。',
            '筛选口径：优先公司深度和系统性研究，覆盖饲料、生猪养殖、动物疫苗及产业链协同；兼顾券商来源差异。',
            '未使用短篇财报点评、行业报告、网页摘要、缺页预览或非券商材料补足数量。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   PDF来源：{m["source_url"]}',
              f'   研报页面：{m["report_page"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、主营业务关键词、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
            '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'天康生物长篇研报候选清单.json').write_text(json.dumps(candidate_metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'天康生物_002100_券商深度报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()):
              z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad:
              raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3:
              raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: tiankang-bio-002100-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
