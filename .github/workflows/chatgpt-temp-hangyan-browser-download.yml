name: chatgpt-temp-hangyan-browser-download
on:
  push:
    branches: [chatgpt-temp-xintian-green-reports-20260906]
    paths: ['.github/workflows/chatgpt-temp-hangyan-browser-download.yml']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Use the page's public download control
        shell: bash
        run: |
          python -m pip install --quiet playwright pypdf
          python <<'PY'
          import asyncio, os, json
          from pathlib import Path
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          out=Path('hangyan_download'); out.mkdir(exist_ok=True)
          async def main():
            async with async_playwright() as p:
              exe=next((x for x in ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'] if os.path.exists(x)),None)
              browser=await p.chromium.launch(headless=True,executable_path=exe,args=['--no-sandbox','--disable-dev-shm-usage'])
              page=await browser.new_page(accept_downloads=True,locale='zh-CN')
              await page.goto('https://www.hangyan.co/reports/3590661410012529871',wait_until='domcontentloaded',timeout=90000)
              await page.wait_for_timeout(25000)
              await page.screenshot(path=str(out/'viewer.png'),full_page=True)
              iframe=page.locator('iframe[data-native-pdf-target="iframe"]')
              print('iframe src',await iframe.get_attribute('src') if await iframe.count() else None)
              btn=page.locator('button.pdf-action')
              print('button count',await btn.count())
              async with page.expect_download(timeout=45000) as info:
                await btn.click()
              download=await info.value
              dest=out/download.suggested_filename
              await download.save_as(str(dest))
              print('saved',dest,dest.stat().st_size)
              await browser.close()
          asyncio.run(main())
          pdfs=list(out.glob('*.pdf'))
          result=[]
          for p in pdfs:
            result.append({'name':p.name,'size':p.stat().st_size,'pages':len(PdfReader(str(p)).pages)})
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(result)
          if not result: raise RuntimeError('No PDF downloaded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Hangyan-Public-Report-PDF
          path: hangyan_download
          retention-days: 1
          compression-level: 0
