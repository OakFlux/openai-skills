name: Read Ascletis public report pages
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/read-ascletis-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/read_ascletis_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: ascletis-page-reader
          path: page_*.html
          if-no-files-found: error
          retention-days: 1
