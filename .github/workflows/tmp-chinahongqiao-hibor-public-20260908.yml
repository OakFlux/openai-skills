name: Inspect public Hibor China Hongqiao report access
on:
  push:
    branches:
      - tmp-chinahongqiao-hibor-public-20260908
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Playwright binding
        run: python -m pip install --quiet playwright
      - name: Inspect anonymous disclaimer flow
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import hashlib, json, re, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          url='https://wap.hibor.com.cn/repinfodetail_4073301.html'
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          rec={'requests':[],'responses':[],'downloads':[],'actions':[]}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',locale='zh-CN',accept_downloads=True,viewport={'width':1440,'height':1100})
            page=ctx.new_page()
            def on_request(req):
              if re.search(r'pdf|download|report|repinfo|file|attachment|api|oss|cdn|read',req.url,re.I):
                rec['requests'].append({'url':req.url,'method':req.method,'post_data':req.post_data,'type':req.resource_type})
            def on_response(resp):
              try: ct=resp.headers.get('content-type','')
              except: ct=''
              if re.search(r'pdf|download|report|repinfo|file|attachment|api|oss|cdn|read',resp.url,re.I) or 'pdf' in ct.lower():
                item={'url':resp.url,'status':resp.status,'content_type':ct}
                rec['responses'].append(item)
                if 'json' in ct.lower():
                  try: item['body']=resp.text()[:200000]
                  except Exception as e: item['body_error']=repr(e)
            page.on('request',on_request)
            page.on('response',on_response)
            try:
              r=page.goto(url,wait_until='domcontentloaded',timeout=100000)
              try: page.wait_for_load_state('networkidle',timeout=25000)
              except PWTimeout: pass
              page.wait_for_timeout(2000)
              rec['status']=r.status if r else None
              rec['title']=page.title()
              rec['final_url']=page.url
              rec['body_before']=' '.join(page.locator('body').inner_text(timeout=15000).split())[:100000]
              rec['inputs_before']=page.eval_on_selector_all('input',"els=>els.map(e=>({type:e.type,id:e.id,name:e.name,value:e.value,checked:e.checked,outer:e.outerHTML}))")
              rec['links_before']=page.eval_on_selector_all('a',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),href:e.href,onclick:e.getAttribute('onclick')||'',target:e.target||'',outer:e.outerHTML}))")
              rec['buttons_before']=page.eval_on_selector_all('button',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),onclick:e.getAttribute('onclick')||'',outer:e.outerHTML}))")
              Path('output/before.html').write_text(page.content(),encoding='utf-8')
              page.screenshot(path='output/before.png',full_page=True)

              # Accept only the publicly displayed disclaimer checkbox.
              boxes=page.locator('input[type=checkbox]')
              rec['checkbox_count']=boxes.count()
              if boxes.count():
                try:
                  boxes.first.check(force=True,timeout=5000)
                  rec['actions'].append({'action':'check_disclaimer','ok':True})
                except Exception as e:
                  rec['actions'].append({'action':'check_disclaimer','ok':False,'error':repr(e)})

              # Try report-original controls exactly as an anonymous browser user.
              for text in ['打开报告原文','下载报告']:
                loc=page.get_by_text(text,exact=True)
                rec['actions'].append({'action':'locate','text':text,'count':loc.count()})
                if not loc.count(): continue
                before_url=page.url
                try:
                  with page.expect_download(timeout=8000) as di:
                    loc.first.click(timeout=8000,force=True)
                  d=di.value
                  target=Path('output')/d.suggested_filename
                  d.save_as(str(target))
                  data=target.read_bytes()
                  rec['downloads'].append({'text':text,'file':str(target),'url':d.url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'magic':data[:8].hex()})
                except Exception as e:
                  rec['actions'].append({'action':'click','text':text,'error':repr(e),'url_before':before_url,'url_after':page.url})
                  try: page.wait_for_timeout(2500)
                  except: pass
                  # Record any popup/window opened by target=_blank is handled by examining pages.
                  rec['open_pages']=[{'url':pg.url,'title':pg.title()} for pg in ctx.pages]
                  if len(ctx.pages)>1:
                    for idx,pg in enumerate(ctx.pages[1:],1):
                      try:
                        pg.wait_for_load_state('domcontentloaded',timeout=15000)
                      except: pass
                      try:
                        rec.setdefault('popup_bodies',[]).append({'idx':idx,'url':pg.url,'title':pg.title(),'body':' '.join(pg.locator('body').inner_text(timeout=10000).split())[:50000]})
                        Path(f'output/popup_{idx}.html').write_text(pg.content(),encoding='utf-8')
                        pg.screenshot(path=f'output/popup_{idx}.png',full_page=True)
                      except Exception as pe:
                        rec.setdefault('popup_errors',[]).append({'idx':idx,'error':repr(pe),'url':pg.url})
              rec['body_after']=' '.join(page.locator('body').inner_text(timeout=15000).split())[:100000]
              rec['links_after']=page.eval_on_selector_all('a',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),href:e.href,onclick:e.getAttribute('onclick')||'',target:e.target||'',outer:e.outerHTML}))")
              Path('output/after.html').write_text(page.content(),encoding='utf-8')
              page.screenshot(path='output/after.png',full_page=True)
            except Exception as e:
              rec['error']=repr(e)
            browser.close()
          print(json.dumps({'downloads':rec.get('downloads'),'actions':rec.get('actions'),'requests':rec.get('requests')[-50:],'responses':rec.get('responses')[-50:],'open_pages':rec.get('open_pages')},ensure_ascii=False),flush=True)
          Path('output/result.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-hibor-public-inspection
          path: output/*
          retention-days: 1
