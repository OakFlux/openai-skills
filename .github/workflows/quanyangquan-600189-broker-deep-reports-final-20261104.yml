name: Package Quanyangquan 600189 verified deep reports 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quanyangquan-600189-broker-deep-reports-final-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '600189'
          SHORT = '泉阳泉'
          FULL = '吉林泉阳泉股份有限公司'
          PACKAGE = '泉阳泉_600189_券商深度报告_2份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for directory in (ROOT, PDFDIR, PREV):
              directory.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '东吴证券',
                  'date': '2026-06-25',
                  'title': '白山松水有活泉',
                  'classification': '公司深度研究／首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '苏铖、郭晓东',
                  'min_pages': 30,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202606251823843141_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202606251823843141_1.pdf?download=1',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202606251823843141.html',
                  'broker_aliases': ['东吴证券', '东吴证券研究所'],
                  'title_tokens': ['白山松水有活泉'],
                  'identity_tokens': ['泉阳泉', '600189'],
              },
              {
                  'broker': '华泰证券',
                  'date': '2017-08-17',
                  'title': '困境反转泉阳泉，天然又甘甜',
                  'classification': '公司研究／首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '贺琪、王楠',
                  'min_pages': 14,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201708170806572772_01.pdf',
                      'https://crm.htsc.com.cn/doc/2017/10710101/ec7eebeb-9946-4430-84ba-5c2dc050e351.pdf',
                  ],
                  'source_page': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/556292647538/index.phtml',
                  'broker_aliases': ['华泰证券', 'HUATAI SECURITIES'],
                  'title_tokens': ['困境反转泉阳泉', '天然又甘甜'],
                  'identity_tokens': ['吉林森工', '泉阳泉', '600189'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          user_agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:110]

          manifest = []
          for index, report in enumerate(reports, 1):
              data = None
              source_url = ''
              attempts = []
              for url in report['urls']:
                  for attempt in range(5):
                      try:
                          if 'dfcfw.com' in url:
                              referer = 'https://data.eastmoney.com/report/'
                          elif 'htsc.com.cn' in url:
                              referer = 'https://crm.htsc.com.cn/'
                          else:
                              referer = 'https://www.eastmoney.com/'
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': user_agent,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url,
                              'attempt': attempt + 1,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          })
                          if (
                              response.status_code == 200
                              and response.content[:5] == b'%PDF-'
                              and len(response.content) > 80000
                          ):
                              data = response.content
                              source_url = url
                              break
                          if response.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({
                              'url': url,
                              'attempt': attempt + 1,
                              'error': repr(exc),
                          })
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f'Download failed for {report["title"]}: {attempts}')

              filename = f'{index:02d}_{safe(report["broker"])}_泉阳泉_{safe(report["title"])}_{report["date"]}.pdf'
              destination = PDFDIR / filename
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              extracted = ''
              for page in reader.pages[:min(60, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(extracted)
              identity_hits = [token for token in report['identity_tokens'] if normalize(token) in compact]
              broker_hits = [token for token in report['broker_aliases'] if normalize(token) in compact]
              title_hits = [token for token in report['title_tokens'] if normalize(token) in compact]
              if len(compact) > 1000 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch in {filename}')
              if len(compact) > 1000 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch in {filename}')
              if len(compact) > 1000 and not title_hits:
                  raise RuntimeError(f'Title mismatch in {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREV / destination.stem
              subprocess.run(
                  [
                      'pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125',
                      '-singlefile', str(destination), str(preview_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed for {filename}')

              sha256 = hashlib.sha256(data).hexdigest()
              record = {
                  **{key: value for key, value in report.items() if key not in ('urls', 'min_pages', 'broker_aliases', 'title_tokens', 'identity_tokens')},
                  'source_url': source_url,
                  'candidate_urls': report['urls'],
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha256,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hits': title_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'broker identity', 'report title',
                      'page count', 'qpdf structure', 'first-page render',
                  ],
              }
              manifest.append(record)
              print('VERIFIED', report['broker'], report['title'], pages, len(data), sha256, source_url)

          total_pages = sum(item['actual_pages'] for item in manifest)
          readme = [
              '吉林泉阳泉股份有限公司（600189.SH）券商深度研究报告资料包',
              '整理日期：2026-11-04', '',
              '本包收录2份公开可直接取得、且完成完整性核验的券商原始PDF。',
              '筛选口径：公司深度或首次覆盖；未使用普通财报点评、行业周报和网页摘要凑数。',
              '2017年报告发布时证券简称为“吉林森工”，与现“泉阳泉”为同一上市公司，证券代码均为600189。', '',
          ]
          for position, item in enumerate(manifest, 1):
              readme += [
                  f'{position}. {item["broker"]}：《{item["title"]}》',
                  f'   类型：{item["classification"]}；日期：{item["date"]}',
                  f'   分析师：{item["analysts"]}；评级：{item["rating"]}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_page"]}',
                  f'   PDF来源：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(
              chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True
          ) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')

          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad_member = archive.testzip()
              pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_member or len(pdf_members) != len(manifest):
                  raise RuntimeError(
                      f'ZIP validation failed: bad={bad_member}, pdf_count={len(pdf_members)}, manifest={len(manifest)}'
                  )

          english_zip = Path('quanyangquan_600189_broker_deep_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          final_sha = hashlib.sha256(chinese_zip.read_bytes()).hexdigest()
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', final_sha)
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: quanyangquan-600189-verified-deep-reports-final
          path: |
            泉阳泉_600189_券商深度报告_2份.zip
            quanyangquan_600189_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
