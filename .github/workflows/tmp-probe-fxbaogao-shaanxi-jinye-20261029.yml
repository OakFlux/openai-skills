name: Probe fxbaogao Shaanxi Jinye report downloads

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe pages and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import re, html
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          })
          pages=['https://www.fxbaogao.com/detail/80303','https://www.fxbaogao.com/detail/70124']
          scripts=[]
          for u in pages:
            print('\n=== PAGE',u,'===')
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'URL',r.url,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content))
              print('HEADERS',dict(r.headers))
              text=r.text
              print('BODY_HEAD',text[:12000])
              soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all(['a','iframe','embed','object','source'],href=True):
                print('LINK',a.name,a.get_text(' ',strip=True)[:100],urljoin(r.url,a.get('href')))
              for tag in soup.find_all(['iframe','embed','source'],src=True):
                print('SRC',tag.name,urljoin(r.url,tag.get('src')))
              for sc in soup.find_all('script',src=True):
                su=urljoin(r.url,sc.get('src')); scripts.append(su); print('SCRIPT',su)
              for pat in [r'https?://[^\s"\'<>]+', r'[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?', r'[^\s"\'<>]*(?:download|report|file|pdf|document)[^\s"\'<>]*']:
                vals=[]
                for m in re.findall(pat,html.unescape(text),flags=re.I):
                  if isinstance(m,tuple): m=''.join(m)
                  if m not in vals: vals.append(m)
                for v in vals[:100]: print('MATCH',pat,v)
            except Exception as e:
              print('PAGE_ERROR',repr(e))
          print('\n=== SCRIPTS ===')
          seen=set()
          for su in scripts:
            if su in seen: continue
            seen.add(su)
            try:
              r=s.get(su,timeout=(20,120),allow_redirects=True)
              print('\nSCRIPT_FETCH',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              t=r.text
              for needle in ['download','pdf','report','detail','document','fileUrl','file_url','oss','cos','cdn','api']:
                if needle.lower() in t.lower(): print('HAS',needle)
              for pat in [r'https?://[^\s"\'<>]+', r'[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?', r'[^\s"\'<>]*(?:download|report|file|pdf|document)[^\s"\'<>]*']:
                vals=[]
                for m in re.findall(pat,t,flags=re.I):
                  if isinstance(m,tuple): m=''.join(m)
                  if m not in vals: vals.append(m)
                for v in vals[:100]: print('SCRIPT_MATCH',pat,v)
            except Exception as e:
              print('SCRIPT_ERROR',repr(e))
          PY