name: Find NEEQ two-network and delisted announcement page 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-find-delisted-page-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Parse NEEQ site navigation and linked scripts
        run: |
          python -m pip install --quiet beautifulsoup4 lxml
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          seeds=[
            'https://www.neeq.com.cn/disclosure/announcement.html',
            'https://www.neeq.com.cn/disclosure/overview_information.html',
            'https://www.neeq.com.cn/index.html',
          ]
          found=[]
          for seed in seeds:
            r=s.get(seed,timeout=40); print('\nPAGE',seed,r.status_code,r.url,len(r.content))
            soup=BeautifulSoup(r.content,'lxml')
            for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              if any(k in text for k in ('两网','退市','代办股份')) or any(k in href.lower() for k in ('delist','twonet','two_net','oldcompany','old_company')):
                print('NAV',repr(text),href)
                found.append(href)
          for u in list(dict.fromkeys(found)):
            try:
              r=s.get(u,timeout=40); print('\nTARGET',u,r.status_code,r.url,len(r.content))
              soup=BeautifulSoup(r.content,'lxml')
              for tag in soup.find_all('script'):
                src=tag.get('src')
                if src:
                  su=urljoin(r.url,src); print('SCRIPT',su)
                  rr=s.get(su,timeout=40); txt=rr.text
                  for pat in ('disclosureInfoController','initDisclosureList','companyAnnouncement','infoResult','retired','delist'):
                    if pat in txt:
                      print('MATCH_SCRIPT',su,'PAT',pat,'LEN',len(txt))
                      p=txt.find(pat); print('CTX',repr(txt[max(0,p-1000):p+2500]))
            except Exception as exc: print('ERR',u,repr(exc))
          PY
