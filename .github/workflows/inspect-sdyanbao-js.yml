name: Inspect Waterdrop report JavaScript
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/inspect-sdyanbao-js.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/inspect_sdyanbao_js.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-js-inspect
          path: |
            sdyanbao_js_summary.json
            sdyanbao_js/
          if-no-files-found: error
          retention-days: 1
