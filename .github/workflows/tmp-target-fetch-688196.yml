name: Temporary targeted Zhuoyue New Energy deep report fetch

on:
  push:
    branches:
      - tmp-target-688196-20260830

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare tools
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf

      - name: Download and validate two deep reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          reports = [
              {
                  "broker": "开源证券",
                  "date": "2025-06-09",
                  "title": "公司首次覆盖报告：生物柴油龙头朝百万产能进发，减碳背景下成长可期",
                  "info_code": "AP202506091687661170",
                  "filename": "01_Kaiyuan_Securities_20250609_Zhuoyue_New_Energy.pdf",
              },
              {
                  "broker": "信达证券",
                  "date": "2025-08-14",
                  "title": "公司深度报告：生物柴油龙头，双碳背景下的绿色能源先锋",
                  "info_code": "AP202508141727182573",
                  "filename": "02_Cinda_Securities_20250814_Zhuoyue_New_Energy.pdf",
              },
          ]
          out = Path("reports")
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Referer": "https://data.eastmoney.com/report/",
              "Accept": "application/pdf,*/*",
          })
          manifest = []
          for item in reports:
              url = f"https://pdf.dfcfw.com/pdf/H3_{item['info_code']}_1.pdf"
              r = s.get(url, timeout=90, allow_redirects=True)
              print("DOWNLOAD", item["info_code"], r.status_code, len(r.content), r.headers.get("content-type"))
              r.raise_for_status()
              if not r.content.startswith(b"%PDF-") or len(r.content) < 100000:
                  raise RuntimeError(f"Invalid PDF response for {item['info_code']}")
              path = out / item["filename"]
              path.write_bytes(r.content)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 12:
                  raise RuntimeError(f"Report too short: {item['info_code']} has {pages} pages")
              text = ""
              for page in reader.pages[:min(4, pages)]:
                  try:
                      text += page.extract_text() or ""
                  except Exception:
                      pass
              normalized = re.sub(r"\s+", "", text)
              identity_ok = "卓越新能" in normalized or "688196" in normalized
              if not identity_ok:
                  raise RuntimeError(f"Company identity check failed for {item['info_code']}")
              manifest.append({
                  **item,
                  "pages": pages,
                  "bytes": len(r.content),
                  "pdf_url": url,
                  "sha256": hashlib.sha256(r.content).hexdigest(),
              })

          readme = [
              "卓越新能（688196）券商深度报告下载包",
              "",
              "以下文件均为公开PDF原文件，已核验文件头、实际页数、公司名称/证券代码和SHA-256。",
              "",
          ]
          for i, m in enumerate(manifest, 1):
              readme += [
                  f"{i}. {m['broker']}｜{m['date']}｜{m['pages']}页",
                  f"   {m['title']}",
                  f"   SHA-256：{m['sha256']}",
                  "",
              ]
          (out / "README_报告清单.txt").write_text("\n".join(readme), encoding="utf-8")
          (out / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")

          package = Path("Zhuoyue_New_Energy_Deep_Reports_2.zip")
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted(out.iterdir()):
                  zf.write(p, arcname=p.name)
          with zipfile.ZipFile(package, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
          print("FINAL", package, package.stat().st_size)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Zhuoyue_New_Energy_Deep_Reports_2
          path: Zhuoyue_New_Energy_Deep_Reports_2.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
