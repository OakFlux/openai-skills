name: Fetch China Longgong 03339 report loader module 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-03339-report-js-probe-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download report module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p module
          python - <<'PY'
          import requests
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          urls=[
            'https://www.lonking.cn/resources/web/js/report.js',
            'https://www.lonkinggroup.com/resources/web/js/report.js',
            'http://www.lonkinggroup.com/resources/web/js/report.js',
          ]
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('FETCH',u,r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
              Path(f'module/report_{i}.js').write_bytes(r.content)
              print(r.text[:30000],flush=True)
            except Exception as e:
              print('ERROR',u,repr(e),flush=True)
          PY
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-03339-report-js
          path: module
          retention-days: 7
          if-no-files-found: error
