name: Build Tianwei Electronics 688511 public research package v4 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-electronics-688511-public-research-package-v4-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf beautifulsoup4 lxml

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, subprocess, zipfile
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE='天微电子_688511_券商深度及相关军工行业研究_公开资料_3份'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREV=ROOT/'首页预览'; PREV.mkdir(exist_ok=True)
          SRC=ROOT/'来源记录'; SRC.mkdir(exist_ok=True)
          WORK=Path('_work_tianwei_v4'); WORK.mkdir(exist_ok=True)

          s=requests.Session(); s.trust_env=False
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          def one_get(url,referer=None,accept='*/*',timeout=25):
            headers={'User-Agent':UA,'Accept':accept,'Accept-Language':'zh-CN,zh;q=0.9'}
            if referer: headers['Referer']=referer
            r=s.get(url,headers=headers,timeout=(12,timeout),allow_redirects=True)
            if r.status_code!=200: raise RuntimeError(f'HTTP {r.status_code}: {url}')
            return r

          def to_jpg(raw,dest):
            with Image.open(BytesIO(raw)) as im:
              im.load(); rgba=im.convert('RGBA')
              bg=Image.new('RGBA',rgba.size,(255,255,255,255)); bg.alpha_composite(rgba)
              rgb=bg.convert('RGB'); rgb.save(dest,'JPEG',quality=95,subsampling=0)
              return rgb.size

          def pdf_from_jpg(jpg,dest):
            with Image.open(jpg) as im: im.convert('RGB').save(dest,'PDF',resolution=150.0)

          def validate(dest):
            pages=len(PdfReader(str(dest),strict=False).pages)
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if pages<1 or not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('validation failed: '+dest.name)
            return {'pages':pages,'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'preview_file':str(Path('首页预览')/preview.name)}

          manifest=[]

          # Direct company report. Public source exposes the cover; remaining pages require registration.
          direct_page='https://www.baogaobox.com/reports/240622000020971.html'
          cover_url='https://zy.baogaobox.com/file/p/2024/06-24/imguh6a1626h5plhqkyt9xid00020971.webp'
          login_url='https://www.baogaobox.com/e/member/login/loginjs_report.php?id=20971'
          cover=one_get(cover_url,direct_page,'image/avif,image/webp,image/png,image/jpeg,*/*;q=0.8',25)
          if len(cover.content)<20000: raise RuntimeError('direct cover too small')
          jpg=WORK/'direct.jpg'; w,h=to_jpg(cover.content,jpg)
          if w<500 or h<700: raise RuntimeError('direct cover dimensions too small')
          login=one_get(login_url,direct_page,'text/javascript,text/html,*/*',20)
          login_text=login.content.decode(login.encoding or 'utf-8','replace')
          (SRC/'01_天风证券_访问状态说明.txt').write_text(login_text,encoding='utf-8')
          dest=ROOT/'01_天风证券_天微电子_军用灭火防爆系统龙头_公开封面_原报告18页.pdf'
          pdf_from_jpg(jpg,dest)
          manifest.append({'order':1,'broker':'天风证券','date':'2024-06-22','analysts':'王泽宇、杨英杰','title':'天微电子（688511）：军用灭火防爆系统龙头，下游景气度传导助力业绩腾飞','file':dest.name,'original_pages':18,'public_preview_pages':1,'document_nature':'直接公司深度报告的公开封面；非完整原始PDF','source_page':direct_page,'access_status':login_text.strip(),**validate(dest)})

          def find_first_image(text,detail_id,base):
            soup=BeautifulSoup(text,'lxml'); vals=[]
            for tag in soup.find_all(True):
              for attr in ('src','data-src','data-original','data-url','href'):
                value=tag.get(attr)
                if isinstance(value,str) and value.strip(): vals.append(urljoin(base,value.strip()))
            vals.extend(re.findall(r'https?://[^\s"\'<>]+',text))
            for raw in vals:
              value=html.unescape(raw).replace('\\/','/').split('?')[0]
              if re.search(rf'{detail_id}[-_]1\.(?:png|jpg|jpeg|webp)$',value,re.I): return value
            raise RuntimeError(f'first image not found for {detail_id}')

          def related(detail_id,order,broker,date,title,filename,relation):
            page_url=f'https://www.fxbaogao.com/detail/{detail_id}'
            page=one_get(page_url,'https://www.fxbaogao.com/','text/html,*/*',25)
            text=page.content.decode(page.encoding or 'utf-8','replace')
            source_name=f'{order:02d}_fxbaogao_{detail_id}.html'; (SRC/source_name).write_text(text,encoding='utf-8')
            image_url=find_first_image(text,detail_id,page.url)
            image=one_get(image_url,page_url,'image/avif,image/webp,image/png,image/jpeg,*/*;q=0.8',25)
            if len(image.content)<5000: raise RuntimeError('preview too small')
            jpg=WORK/f'{detail_id}.jpg'; w,h=to_jpg(image.content,jpg)
            if w<700 or h<850: raise RuntimeError('preview dimensions too small')
            dest=ROOT/filename; pdf_from_jpg(jpg,dest)
            return {'order':order,'broker':broker,'date':date,'title':title,'file':dest.name,'document_nature':'相关军工行业专题研究的公开首屏预览；非完整原始PDF，非天微电子单独公司深度报告','relation_to_tianwei':relation,'source_page':page_url,'source_html_file':str(Path('来源记录')/source_name),'public_preview_pages':1,'preview_image_url':image_url,**validate(dest)}

          manifest.append(related(3160614,2,'中泰证券','2022-05-05','国防军工行业军工板块2021Q4与2022Q1业绩专题报告：板块持续高景气，军工确定性投资价值凸现','02_中泰证券_军工板块2021Q4及2022Q1业绩专题_含天微电子_公开首屏预览.pdf','报告的军工板块个股业绩及估值表中列有688511.SH天微电子。'))
          manifest.append(related(4623838,3,'中原证券','2024-12-11','国防军工行业专题研究：否极泰来，圆满收官','03_中原证券_国防军工行业专题研究_含天微电子_公开首屏预览.pdf','报告的2024年军工上市公司行情回顾中明确列有688511.SH天微电子。'))

          readme=['天微电子（688511.SH）券商深度及相关军工行业研究公开资料包','整理日期：2026-10-12','','公开检索仅找到1份直接针对天微电子的券商公司深度报告，即天风证券2024年报告。原报告共18页，公开入口只展示封面，访问状态信息显示其余17页需要注册账户后取得。本包未绕过任何登录、会员或下载权限。','','另外收录2份明确包含天微电子数据或同业比较的军工行业专题报告。两份文件均为公开首屏预览，且不是天微电子单独公司深度报告。','']
          for x in manifest:
            readme += [f"{x['order']}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；文件性质：{x['document_nature']}",f"   本包文件：{x['file']}；PDF页数：{x['pages']}页",f"   来源页面：{x['source_page']}"]
            if x.get('relation_to_tianwei'): readme.append(f"   与天微电子的关系：{x['relation_to_tianwei']}")
            readme += [f"   SHA-256：{x['sha256']}",'']
          readme += ['包内附来源网页、首页预览、manifest.json和SHA256SUMS.txt。','核验项目：来源页面、图像尺寸、PDF页数、qpdf结构、首页渲染、ZIP CRC和SHA-256。','报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['file']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3: raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          Path('tianwei_research_reports.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-electronics-688511-public-research-package-v4-final
          path: |
            天微电子_688511_券商深度及相关军工行业研究_公开资料_3份.zip
            tianwei_research_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
