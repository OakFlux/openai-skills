name: Probe Ascletis public page images
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/probe-fx-page-images-ascletis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_fx_page_images_ascletis.py
      - uses: actions/upload-artifact@v4
        with:
          name: ascletis-fx-page-probe
          path: ascletis_fx_page_probe.json
          if-no-files-found: error
          retention-days: 1
