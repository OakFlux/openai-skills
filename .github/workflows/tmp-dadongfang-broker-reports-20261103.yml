name: Build Dadongfang 600327 broker deep reports

on:
  push:
    branches:
      - tmp-dadongfang-broker-reports-20261103

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='大东方_600327_券商深度报告'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/dadongfang_broker_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('大东方_600327_券商深度报告')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=7,
              connect=7,
              read=7,
              status=7,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          reports = [
              {
                  'order': 1,
                  'broker': '华安证券',
                  'date': '2022-04-17',
                  'title': '夯实存量挖掘增量，零售+医疗双轮驱动',
                  'filename': '01_华安证券_夯实存量挖掘增量零售医疗双轮驱动_2022-04-17.pdf',
                  'min_pages': 30,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202204181559970208_1.pdf?1650280142000.pdf=',
                      'https://pdf.dfcfw.com/pdf/H3_AP202204181559970208_1.pdf',
                  ],
                  'info': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/705026070819/index.phtml',
              },
              {
                  'order': 2,
                  'broker': '浙商证券',
                  'date': '2024-02-23',
                  'title': '向宽而行，打造连锁儿科生态圈',
                  'filename': '02_浙商证券_向宽而行打造连锁儿科生态圈_2024-02-23.pdf',
                  'min_pages': 20,
                  'urls': [
                      'https://aigc.idigital.com.cn/djyanbao/%E3%80%90%E6%B5%99%E5%95%86%E8%AF%81%E5%88%B8%E3%80%91%E5%A4%A7%E4%B8%9C%E6%96%B9%EF%BC%88600327%EF%BC%89%E9%A6%96%E6%AC%A1%E8%A6%86%E7%9B%96%E6%8A%A5%E5%91%8A%EF%BC%9A%E5%90%91%E5%AE%BD%E8%80%8C%E8%A1%8C%EF%BC%8C%E6%89%93%E9%80%A0%E8%BF%9E%E9%94%81%E5%84%BF%E7%A7%91%E7%94%9F%E6%80%81%E5%9C%88-2024-02-26.pdf',
                  ],
                  'info': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/762257628514/index.phtml',
              },
              {
                  'order': 3,
                  'broker': '中泰证券',
                  'date': '2024-06-27',
                  'title': '无锡零售巨头发力儿科医疗，第二成长曲线逐步兑现',
                  'filename': '03_中泰证券_无锡零售巨头发力儿科医疗第二成长曲线逐步兑现_2024-06-27.pdf',
                  'min_pages': 25,
                  'urls': [
                      'https://file.iyanbao.com/pdf/a38f0-9706dcd8-f162-4ef1-add2-2a33f360b73c.pdf',
                      'https://aigc.idigital.com.cn/djyanbao/%E3%80%90%E4%B8%AD%E6%B3%B0%E8%AF%81%E5%88%B8%E3%80%91%E5%A4%A7%E4%B8%9C%E6%96%B9%E9%A6%96%E6%AC%A1%E8%A6%86%E7%9B%96%EF%BC%9A%E6%97%A0%E9%94%A1%E9%9B%B6%E5%94%AE%E5%B7%A8%E5%A4%B4%E5%8F%91%E5%8A%9B%E5%84%BF%E7%A7%91%E5%8C%BB%E7%96%97%EF%BC%8C%E7%AC%AC%E4%BA%8C%E6%88%90%E9%95%BF%E6%9B%B2%E7%BA%BF%E9%80%90%E6%AD%A5%E5%85%91%E7%8E%B0-2024-06-27.pdf',
                  ],
                  'info': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?industry=&orgname=&symbol=600327&t1=all&title=',
              },
          ]

          def inspect(path: Path, report: dict) -> tuple[int, str]:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'page count {pages} below minimum {report["min_pages"]}')
              text = ''
              for index in range(pages):
                  try:
                      text += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '大东方' not in compact and '600327' not in compact:
                  raise RuntimeError('company name or stock code not found')
              broker_key = report['broker'].replace('股份有限公司', '').replace('证券', '')
              if report['broker'] not in compact and broker_key not in compact:
                  raise RuntimeError('broker name not found')
              return pages, compact

          def download(report: dict) -> dict:
              last = None
              destination = out / report['filename']
              for url in report['urls']:
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              headers={'Referer': report['info']},
                              timeout=(30, 300),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 100_000:
                              raise RuntimeError(
                                  f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          pages, _ = inspect(destination, report)
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', report['broker'], report['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return {**report, 'pages': pages, 'bytes': len(data), 'source': response.url, 'sha256': sha}
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', report['broker'], url, repr(exc))
                          time.sleep(min(1 + attempt, 4))
              raise RuntimeError(f'Could not download {report["broker"]} report: {last!r}')

          records = []
          failures = []
          for report in reports:
              try:
                  records.append(download(report))
              except Exception as exc:
                  failures.append({'broker': report['broker'], 'title': report['title'], 'error': repr(exc)})
                  print('REPORT_SKIPPED', report['broker'], repr(exc))

          if len(records) < 2:
              raise RuntimeError(f'Only {len(records)} validated reports; at least 2 required. Failures={failures!r}')

          records.sort(key=lambda item: item['order'])
          lines = [
              '大东方（600327）券商深度报告资料包',
              '整理日期：2026-11-03',
              '',
              '收录原则：仅保留可公开直接下载并通过结构、页数、公司名称和券商名称核验的完整PDF。',
              f'本包共收录{len(records)}份报告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for index, item in enumerate(records, start=1):
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{index}. {item['broker']}｜{item['title']}",
                  f"   报告日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   信息页：{item['info']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          if failures:
              lines += ['未纳入的候选：']
              for item in failures:
                  lines.append(f"- {item['broker']}｜{item['title']}：公开附件下载或校验未通过。")
              lines.append('')
          lines += [
              f'合计：{len(records)}份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps({'records': records, 'failures': failures}, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          pdf_count=$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)
          test "$pdf_count" -ge 2
          test "$pdf_count" -le 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 20
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '大东方|600327' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/dadongfang_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/dadongfang_broker_test.zip "$PACKAGE"
          unzip -t /tmp/dadongfang_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/dadongfang_broker_test.zip | grep -c '\.pdf$')" -ge 2
          rm -f /tmp/dadongfang_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dadongfang-600327-broker-deep-reports
          path: 大东方_600327_券商深度报告/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
