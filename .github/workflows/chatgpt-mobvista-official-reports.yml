name: Download and verify Mobvista official reports
on:
  push:
    branches:
      - chatgpt-mobvista-reports-20260907
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PDF verification dependencies
        run: |
          python -m pip install --quiet requests pypdf pymupdf

      - name: Download official HKEX PDFs, verify, and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/pdfs deliverable
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import time
          import zipfile
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader

          REPORTS = [
              {
                  "year": "2020",
                  "kind": "年度报告",
                  "filename": "01_汇量科技_2020年年度报告.pdf",
                  "path": "/listedco/listconews/sehk/2021/0428/2021042801549.pdf",
                  "filing_date": "2021-04-28",
              },
              {
                  "year": "2021",
                  "kind": "年度报告",
                  "filename": "02_汇量科技_2021年年度报告.pdf",
                  "path": "/listedco/listconews/sehk/2022/0428/2022042801258.pdf",
                  "filing_date": "2022-04-28",
              },
              {
                  "year": "2022",
                  "kind": "年度报告",
                  "filename": "03_汇量科技_2022年年度报告.pdf",
                  "path": "/listedco/listconews/sehk/2023/0428/2023042801039.pdf",
                  "filing_date": "2023-04-28",
              },
              {
                  "year": "2023",
                  "kind": "年度报告",
                  "filename": "04_汇量科技_2023年年度报告.pdf",
                  "path": "/listedco/listconews/sehk/2024/0415/2024041501488.pdf",
                  "filing_date": "2024-04-15",
              },
              {
                  "year": "2024",
                  "kind": "年度报告",
                  "filename": "05_汇量科技_2024年年度报告.pdf",
                  "path": "/listedco/listconews/sehk/2025/0429/2025042902664.pdf",
                  "filing_date": "2025-04-29",
              },
              {
                  "year": "2025",
                  "kind": "年度报告",
                  "filename": "06_汇量科技_2025年年度报告.pdf",
                  "path": "/listedco/listconews/sehk/2026/0429/2026042905634.pdf",
                  "filing_date": "2026-04-29",
              },
              {
                  "year": "2026Q1",
                  "kind": "季度业绩公告",
                  "filename": "07_汇量科技_2026年第一季度业绩公告.pdf",
                  "path": "/listedco/listconews/sehk/2026/0531/2026053100023.pdf",
                  "filing_date": "2026-05-31",
              },
          ]

          HOSTS = [
              "https://www1.hkexnews.hk",
              "https://www.hkexnews.hk",
          ]
          OUT = Path("work/pdfs")
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/152.0.0.0 Safari/537.36"
          )

          session = requests.Session()
          session.headers.update(
              {
                  "User-Agent": USER_AGENT,
                  "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
                  "Referer": "https://www1.hkexnews.hk/",
              }
          )

          def download_report(item: dict[str, str]) -> tuple[bytes, str]:
              errors: list[str] = []
              for host in HOSTS:
                  url = host + item["path"]
                  for attempt in range(1, 5):
                      try:
                          print(f"DOWNLOAD {item['filename']} host={host} attempt={attempt}", flush=True)
                          response = session.get(url, timeout=(20, 300), allow_redirects=True)
                          print(
                              "RESPONSE",
                              response.status_code,
                              len(response.content),
                              response.url,
                              response.headers.get("content-type"),
                              flush=True,
                          )
                          response.raise_for_status()
                          data = response.content
                          if b"%PDF" not in data[:4096]:
                              raise RuntimeError("response does not begin with a PDF signature")
                          if len(data) < 100_000:
                              raise RuntimeError(f"PDF unexpectedly small: {len(data)} bytes")
                          return data, response.url
                      except Exception as exc:
                          errors.append(f"{url} attempt {attempt}: {exc!r}")
                          time.sleep(attempt * 2)
              raise RuntimeError("All HKEX download attempts failed:\n" + "\n".join(errors))

          manifest: list[dict[str, object]] = []
          for item in REPORTS:
              data, final_url = download_report(item)
              reader = PdfReader(io.BytesIO(data), strict=False)
              if reader.is_encrypted:
                  result = reader.decrypt("")
                  if result == 0:
                      raise RuntimeError(f"Encrypted PDF cannot be opened: {item['filename']}")
              page_count = len(reader.pages)
              if page_count < 5:
                  raise RuntimeError(f"Too few pages ({page_count}): {item['filename']}")

              # Render first and last pages to ensure the page content is readable by a second engine.
              doc = fitz.open(stream=data, filetype="pdf")
              if doc.page_count != page_count:
                  raise RuntimeError(
                      f"Page-count mismatch for {item['filename']}: pypdf={page_count}, fitz={doc.page_count}"
                  )
              for page_no in sorted(set([0, doc.page_count - 1])):
                  pix = doc.load_page(page_no).get_pixmap(matrix=fitz.Matrix(1.0, 1.0), alpha=False)
                  if pix.width < 400 or pix.height < 500 or len(pix.samples) < 100_000:
                      raise RuntimeError(
                          f"Render check failed for {item['filename']} page {page_no + 1}"
                      )
              doc.close()

              output_path = OUT / item["filename"]
              output_path.write_bytes(data)
              digest = hashlib.sha256(data).hexdigest()
              record = {
                  **item,
                  "source_url": final_url,
                  "bytes": len(data),
                  "pages": page_count,
                  "sha256": digest,
              }
              manifest.append(record)
              print(
                  "VERIFIED",
                  json.dumps(
                      {
                          "filename": item["filename"],
                          "pages": page_count,
                          "bytes": len(data),
                          "sha256": digest,
                      },
                      ensure_ascii=False,
                  ),
                  flush=True,
              )

          total_pages = sum(int(x["pages"]) for x in manifest)
          total_bytes = sum(int(x["bytes"]) for x in manifest)
          readme_lines = [
              "汇量科技（Mobvista Inc.，港股代码：01860）财务报告资料包",
              "",
              "内容：2020—2025年年度报告，以及截至2026年3月31日止三个月的最新正式季度业绩公告。",
              "来源：香港交易所披露易（HKEXnews）公开文件。",
              "说明：港股年报以英文版为主，文件均为港交所原始PDF，未进行内容修改。",
              "",
              f"文件总数：{len(manifest)}",
              f"合计页数：{total_pages}",
              f"PDF总大小：{total_bytes / 1024 / 1024:.2f} MB",
              "",
              "文件清单：",
          ]
          for idx, record in enumerate(manifest, 1):
              readme_lines.extend(
                  [
                      f"{idx}. {record['filename']}",
                      f"   类型：{record['kind']}",
                      f"   财务期间：{record['year']}",
                      f"   港交所披露日期：{record['filing_date']}",
                      f"   页数：{record['pages']}",
                      f"   文件大小：{int(record['bytes']) / 1024 / 1024:.2f} MB",
                      f"   SHA-256：{record['sha256']}",
                      f"   来源：{record['source_url']}",
                      "",
                  ]
              )
          readme_lines.extend(
              [
                  "口径说明：",
                  "- ‘最新季报’采用公司于2026年5月31日披露的2026年第一季度业绩公告。",
                  "- 公司另于2026年8月24日披露2026年中期业绩公告，但中期报告属于半年度披露，并非季度报告，因此未替代本资料包中的季度公告。",
              ]
          )
          readme = "\n".join(readme_lines) + "\n"
          (OUT / "00_文件清单与说明.txt").write_text(readme, encoding="utf-8")
          (OUT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          final_zip = Path("deliverable/汇量科技_01860_2020-2025年报及最新季报.zip")
          with zipfile.ZipFile(final_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(OUT.iterdir(), key=lambda p: p.name):
                  zf.write(path, arcname=path.name)

          # Re-open the archive and test all entries.
          with zipfile.ZipFile(final_zip, "r") as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f"Corrupt ZIP member: {bad}")
              names = zf.namelist()
              pdf_names = [name for name in names if name.lower().endswith(".pdf")]
              if len(pdf_names) != len(REPORTS):
                  raise RuntimeError(f"ZIP PDF count mismatch: {len(pdf_names)}")

          print(
              "PACKAGE_READY",
              final_zip,
              final_zip.stat().st_size,
              hashlib.sha256(final_zip.read_bytes()).hexdigest(),
              flush=True,
          )
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mobvista-2020-2025-annual-and-latest-quarter
          path: deliverable/汇量科技_01860_2020-2025年报及最新季报.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
