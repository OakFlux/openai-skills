name: Probe Wuhan Fingu report API variants 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_api_probe_20261022.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install --quiet requests
      - name: Probe query variants
        run: |
          python - <<'PY'
          import requests, json, itertools
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'}
          base={'industryCode':'*','pageSize':'20','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2026-10-22','pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          variants=[
            ('code_plain',{'code':'002194'}),
            ('code_suffix',{'code':'002194.SZ'}),
            ('code_szprefix',{'code':'SZ002194'}),
            ('code_lowerprefix',{'code':'sz002194'}),
            ('code_dotprefix',{'code':'sz.002194'}),
            ('code_marketnum',{'code':'0.002194'}),
            ('stockCode_plain',{'stockCode':'002194'}),
            ('both_plain',{'code':'002194','stockCode':'002194'}),
            ('keyword_name',{'keyword':'武汉凡谷'}),
            ('keyword_code',{'keyword':'002194'}),
            ('code_name',{'code':'武汉凡谷'}),
            ('code_plain_current_window',{'code':'002194','beginTime':'2019-01-01','endTime':'2021-12-31'}),
            ('code_moutai_control',{'code':'600519'}),
            ('keyword_moutai_control',{'keyword':'贵州茅台'}),
          ]
          for name,extra in variants:
              p=dict(base);p.update(extra)
              try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=p,headers=h,timeout=30)
                  o=r.json(); rows=o.get('data') or []
                  print('\nVARIANT',name,'STATUS',r.status_code,'HITS',o.get('hits'),'URL',r.url)
                  for x in rows[:5]: print('ROW',x.get('stockCode'),x.get('stockName'),x.get('publishDate'),x.get('orgSName'),x.get('title'),x.get('infoCode'))
              except Exception as e: print('\nVARIANT',name,'ERROR',repr(e))
          PY
