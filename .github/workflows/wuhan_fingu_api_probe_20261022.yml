name: Package Wuhan Fingu reports by historical title 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_api_probe_20261022.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests pypdf
      - name: Find exact titles and package PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          import os,re,json,hashlib,zipfile,datetime,time
          import requests
          from pypdf import PdfReader
          OUT='out'; PDFDIR=OUT+'/pdfs'
          s=requests.Session();s.trust_env=False
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'*/*'}
          title_keys=[
              '专注基站射频三十年',
              'Q3业绩增长提速',
              '克服疫情影响，盈利能力大幅提升',
              '新周期开启，营收结构和盈利能力同步改善',
              '三季度盈利能力改善，业绩符合预期',
          ]
          dates=[]
          for start,end in [('2019-10-23','2019-10-30'),('2020-08-09','2020-08-13'),('2020-11-02','2020-11-05')]:
              d=datetime.date.fromisoformat(start);stop=datetime.date.fromisoformat(end)
              while d<stop:dates.append(d.isoformat());d+=datetime.timedelta(days=1)
          matches=[];candidate_titles=[]
          for day in dates:
              for page in range(1,20):
                  p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':day,'endTime':day,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  try:r=s.get('https://reportapi.eastmoney.com/report/list',params=p,headers=H,timeout=(15,45));obj=r.json()
                  except Exception as e:print('LISTERR',day,page,repr(e));break
                  rows=obj.get('data') or []
                  print('DAYPAGE',day,page,'hits',obj.get('hits'),'rows',len(rows),'total',obj.get('TotalPage'))
                  for row in rows:
                      title=str(row.get('title') or '')
                      if any(fragment in title for fragment in ['基站','滤波器','盈利能力','业绩增长提速','新周期开启']):
                          candidate_titles.append({'day':day,'stockCode':row.get('stockCode'),'stockName':row.get('stockName'),'org':row.get('orgSName'),'title':title,'infoCode':row.get('infoCode')})
                      if any(k in title for k in title_keys):
                          print('TITLE_MATCH',json.dumps(row,ensure_ascii=False));matches.append(row)
                  if page>=int(obj.get('TotalPage') or 0) or not rows:break
                  time.sleep(.15)
          with open(OUT+'/candidate_titles.json','w',encoding='utf-8') as f:json.dump(candidate_titles,f,ensure_ascii=False,indent=2)
          uniq=[];seen=set()
          for row in matches:
              key=row.get('infoCode') or (row.get('title'),row.get('publishDate'),row.get('orgSName'))
              if key in seen:continue
              seen.add(key);uniq.append(row)
          matches=uniq
          print('MATCHED_TOTAL',len(matches))
          with open(OUT+'/matched_records.json','w',encoding='utf-8') as f:json.dump(matches,f,ensure_ascii=False,indent=2)
          def safe(v):return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+',' ',v).strip())[:150]
          manifest=[]
          for row in matches:
              info=str(row.get('infoCode') or '')
              if not info:continue
              url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              try:r=s.get(url,headers=H,timeout=(15,60),allow_redirects=True);data=r.content
              except Exception as e:print('PDFERR',url,repr(e));continue
              print('PDFGET',r.status_code,len(data),r.headers.get('content-type',''),url)
              if not data.startswith(b'%PDF') or len(data)<20000:continue
              date=str(row.get('publishDate') or '')[:10];broker=str(row.get('orgSName') or '未知券商');title=str(row.get('title') or info)
              filename=safe(f'{date}_{broker}_{title}')+'.pdf';path=PDFDIR+'/'+filename
              open(path,'wb').write(data)
              try:
                  reader=PdfReader(path);pages=len(reader.pages)
                  text='\n'.join((reader.pages[i].extract_text() or '') for i in range(min(4,pages)))[:24000]
              except Exception as e:print('PARSEERR',filename,repr(e));os.remove(path);continue
              verified=('武汉凡谷' in text or '002194' in text or '武漢凡谷' in text)
              print('VERIFY',filename,verified,text[:300].replace('\n',' '))
              if not verified:os.remove(path);continue
              rec={'filename':filename,'date':date,'broker':broker,'title':title,'info_code':info,'pages':pages,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_url':url,'stock_code':row.get('stockCode'),'stock_name':row.get('stockName'),'rating':row.get('emRatingName'),'researcher':row.get('researcher') or row.get('author')}
              manifest.append(rec);print('VERIFIED',json.dumps(rec,ensure_ascii=False))
          manifest.sort(key=lambda x:(x['pages'],x['date']),reverse=True)
          json.dump(manifest,open(OUT+'/manifest.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          md=['# 武汉凡谷（002194）公开券商报告','',f'完整PDF数量：{len(manifest)}','']
          for i,x in enumerate(manifest,1):md += [f'## {i}. {x["title"]}',f'- 券商：{x["broker"]}',f'- 日期：{x["date"]}',f'- 页数：{x["pages"]}',f'- 文件：{x["filename"]}',f'- SHA-256：{x["sha256"]}','']
          md += ['验证：PDF文件头正常，可解析页数，正文前四页出现“武汉凡谷”或“002194”。','来源：公开研报索引及其公开PDF附件。']
          open(OUT+'/README.md','w',encoding='utf-8').write('\n'.join(md))
          zname='武汉凡谷_券商报告_公开验证全集.zip'
          with zipfile.ZipFile(zname,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(OUT+'/README.md','README.md');z.write(OUT+'/manifest.json','manifest.json')
              for x in manifest:z.write(PDFDIR+'/'+x['filename'],x['filename'])
          print('FINAL',len(manifest),os.path.getsize(zname))
          if not manifest:raise SystemExit('No verified reports found')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-title-match-20261022
          path: |
            武汉凡谷_券商报告_公开验证全集.zip
            out
          retention-days: 7
          if-no-files-found: error
