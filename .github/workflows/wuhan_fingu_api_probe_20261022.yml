name: Inspect Wuhan Fingu report pages with Chrome 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_api_probe_20261022.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Python dependencies
        run: python -m pip install --quiet selenium requests beautifulsoup4 lxml pypdf pillow img2pdf

      - name: Inspect report pages and capture downloads
        shell: bash
        run: |
          set -u
          mkdir -p out/downloads out/pages out/screenshots out/network out/candidates
          google-chrome --version || chromium --version || true
          python - <<'PY'
          import os, re, json, time, html, hashlib, urllib.parse, traceback, shutil
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          ROOT=os.getcwd()
          OUT=os.path.join(ROOT,'out')
          DL=os.path.join(OUT,'downloads')
          os.makedirs(DL,exist_ok=True)
          pages=[
            ('sgpjbg_report_bg','https://bg.sgpjbg.com/baogao/16990.html'),
            ('sgpjbg_download_bg','https://bg.sgpjbg.com/bgdown/16990.html'),
            ('sgpjbg_report_www','https://www.sgpjbg.com/baogao/16990.html'),
            ('sgpjbg_download_www','https://www.sgpjbg.com/bgdown/16990.html'),
            ('fxbaogao_guoxin','https://www.fxbaogao.com/detail/1785728'),
            ('jfzt_haitong','https://www.9fzt.com/detail/sz_002194_10_650430884853.html'),
          ]
          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--disable-blink-features=AutomationControlled')
          opts.add_argument('--window-size=1920,2400')
          opts.add_argument('--lang=zh-CN')
          opts.add_argument('--ignore-certificate-errors')
          opts.add_argument('--allow-running-insecure-content')
          opts.add_argument('--disable-popup-blocking')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0 Safari/537.36')
          prefs={
            'download.default_directory':DL,
            'download.prompt_for_download':False,
            'download.directory_upgrade':True,
            'plugins.always_open_pdf_externally':True,
            'safebrowsing.enabled':True,
          }
          opts.add_experimental_option('prefs',prefs)
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          driver.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':DL})
          driver.set_page_load_timeout(90)
          driver.set_script_timeout(60)

          all_candidates=[]
          summaries=[]
          def sanitize(name):return re.sub(r'[^A-Za-z0-9._-]+','_',name)[:120]
          def extract_urls(text,base):
            vals=[]
            for m in re.findall(r'https?://[^\s"\'<>\\]+',text): vals.append(html.unescape(m))
            for m in re.findall(r'["\']([^"\']*(?:\.pdf(?:\?[^"\']*)?|download|downfile|bgdown|fileUrl|pdfUrl|16990)[^"\']*)["\']',text,re.I):
              try: vals.append(urllib.parse.urljoin(base,html.unescape(m)))
              except: pass
            out=[]
            for u in vals:
              u=u.replace('\\/','/').replace('\\u002F','/')
              if u.startswith('//'):u='https:'+u
              if u.startswith('http://'):u='https://'+u[7:]
              if u.startswith('https://') and u not in out:out.append(u)
            return out

          for name,url in pages:
            rec={'name':name,'requested_url':url}
            try:
              print('\nOPEN',name,url,flush=True)
              driver.get(url)
              time.sleep(8)
              rec.update({'current_url':driver.current_url,'title':driver.title})
              print('LOADED',driver.current_url,driver.title,flush=True)
              source=driver.page_source
              open(os.path.join(OUT,'pages',name+'.html'),'w',encoding='utf-8',errors='replace').write(source)
              try:driver.save_screenshot(os.path.join(OUT,'screenshots',name+'.png'))
              except Exception as e:rec['screenshot_error']=repr(e)

              tags=[]
              for selector,attr in [('a','href'),('iframe','src'),('embed','src'),('object','data'),('img','src'),('script','src'),('link','href'),('video','src'),('source','src')]:
                try:
                  for el in driver.find_elements(By.CSS_SELECTOR,selector):
                    v=el.get_attribute(attr)
                    if v:tags.append({'tag':selector,'attr':attr,'url':v,'text':(el.text or '')[:500]})
                except Exception:pass
              open(os.path.join(OUT,'candidates',name+'_dom.json'),'w',encoding='utf-8').write(json.dumps(tags,ensure_ascii=False,indent=2))
              for x in tags:
                u=x.get('url','')
                if any(k in u.lower() for k in ['pdf','download','down','file','16990','report','baogao']):all_candidates.append({'page':name,'kind':'dom','url':u,'text':x.get('text','')})
              for u in extract_urls(source,driver.current_url):all_candidates.append({'page':name,'kind':'source','url':u})

              logs=[]
              try:
                perf=driver.get_log('performance')
                for item in perf:
                  try:
                    msg=json.loads(item['message'])['message']
                    method=msg.get('method','');params=msg.get('params',{})
                    if method in ('Network.requestWillBeSent','Network.responseReceived'):
                      obj=params.get('request') or params.get('response') or {}
                      u=obj.get('url')
                      if u:
                        entry={'method':method,'url':u,'mimeType':obj.get('mimeType'),'status':obj.get('status')}
                        logs.append(entry)
                        if any(k in u.lower() for k in ['pdf','download','down','file','16990','report','baogao']):all_candidates.append({'page':name,'kind':'network',**entry})
                  except Exception:pass
              except Exception as e:rec['performance_error']=repr(e)
              open(os.path.join(OUT,'network',name+'.json'),'w',encoding='utf-8').write(json.dumps(logs,ensure_ascii=False,indent=2))

              clickable=[]
              xpath="//*[self::a or self::button or @role='button'][contains(normalize-space(.),'下载') or contains(normalize-space(.),'完整报告') or contains(normalize-space(.),'查看') or contains(normalize-space(.),'PDF')]"
              try:clickable=driver.find_elements(By.XPATH,xpath)
              except Exception:clickable=[]
              print('CLICKABLES',len(clickable),flush=True)
              for idx,el in enumerate(clickable[:12]):
                try:
                  txt=(el.text or '').strip();href=el.get_attribute('href');print('CLICK',idx,txt,href,flush=True)
                  before=set(os.listdir(DL));old_handles=list(driver.window_handles);old_url=driver.current_url
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'});",el);time.sleep(1)
                  try:el.click()
                  except Exception:driver.execute_script('arguments[0].click();',el)
                  time.sleep(7)
                  new_handles=[h for h in driver.window_handles if h not in old_handles]
                  if new_handles:
                    driver.switch_to.window(new_handles[-1]);time.sleep(4)
                  new_url=driver.current_url
                  all_candidates.append({'page':name,'kind':'clicked','url':new_url,'text':txt,'href':href})
                  print('AFTER_CLICK',new_url,'FILES',sorted(set(os.listdir(DL))-before),flush=True)
                  try:driver.save_screenshot(os.path.join(OUT,'screenshots',f'{name}_click_{idx}.png'))
                  except:pass
                  if new_handles:
                    driver.close();driver.switch_to.window(old_handles[0])
                  elif new_url!=old_url:
                    driver.back();time.sleep(4)
                except Exception as e:
                  print('CLICKERR',idx,repr(e),flush=True)
              rec['dom_tags']=len(tags);rec['network_events']=len(logs);rec['clickables']=len(clickable)
            except Exception as e:
              rec['error']=repr(e);rec['traceback']=traceback.format_exc();print('PAGEERR',name,repr(e),flush=True)
            summaries.append(rec)

          # Use browser cookies to test all candidate URLs through requests.
          cookies={c['name']:c['value'] for c in driver.get_cookies()}
          driver.quit()
          ded=[];seen=set()
          for x in all_candidates:
            u=x.get('url')
            if not u or u.startswith(('data:','blob:','javascript:')):continue
            if u not in seen:seen.add(u);ded.append(x)
          all_candidates=ded
          open(os.path.join(OUT,'all_candidates.json'),'w',encoding='utf-8').write(json.dumps(all_candidates,ensure_ascii=False,indent=2))
          open(os.path.join(OUT,'summary.json'),'w',encoding='utf-8').write(json.dumps(summaries,ensure_ascii=False,indent=2))
          print('CANDIDATES',len(all_candidates),flush=True)
          rs=requests.Session();rs.trust_env=False;rs.cookies.update(cookies)
          RH={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0 Safari/537.36','Accept':'*/*','Referer':'https://www.sgpjbg.com/baogao/16990.html'}
          results=[]
          for i,x in enumerate(all_candidates[:300]):
            u=x['url']
            if not any(k in u.lower() for k in ['.pdf','download','down','file','16990','report','baogao']):continue
            try:
              r=rs.get(u,headers=RH,timeout=(10,45),allow_redirects=True)
              data=r.content
              rr={'url':u,'final_url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type',''),'size':len(data),'magic':data[:20].hex()}
              results.append(rr);print('FETCH',json.dumps(rr,ensure_ascii=False),flush=True)
              if data.startswith(b'%PDF') and len(data)>20000:
                sha=hashlib.sha256(data).hexdigest();fn=f'candidate_{i}_{sha[:12]}.pdf';open(os.path.join(DL,fn),'wb').write(data);print('PDF_SAVED',fn,flush=True)
              elif len(data)>20000 and ('image/' in r.headers.get('content-type','')):
                ext='.jpg' if 'jpeg' in r.headers.get('content-type','') else '.png';open(os.path.join(DL,f'candidate_{i}{ext}'),'wb').write(data)
            except Exception as e:results.append({'url':u,'error':repr(e)});print('FETCHERR',u,repr(e),flush=True)
          open(os.path.join(OUT,'fetch_results.json'),'w',encoding='utf-8').write(json.dumps(results,ensure_ascii=False,indent=2))
          print('DOWNLOADED_FILES',os.listdir(DL),flush=True)
          PY

      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuhan-fingu-browser-inspection-20261022
          path: out
          retention-days: 7
          if-no-files-found: warn
