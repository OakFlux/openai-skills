name: Build Zhongjing 003026 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zhongjing-003026-broker-deep-reports-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = '003026'
          SHORT = '中晶科技'
          FULL = '浙江中晶科技股份有限公司'
          PACKAGE = '中晶科技_003026_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / '原始PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          for d in (ROOT, PDF_DIR, PREVIEW_DIR):
              d.mkdir(parents=True, exist_ok=True)

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': f'https://data.eastmoney.com/report/stock.jshtml?stockCode={CODE}',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          API = 'https://reportapi.eastmoney.com/report/list'
          request_log: list[dict[str, Any]] = []

          def fetch_page(params: dict[str, str]) -> dict[str, Any]:
              last: dict[str, Any] = {}
              for attempt in range(7):
                  try:
                      r = s.get(API, params=params, timeout=(20, 120))
                      last = {
                          'url': r.url, 'status': r.status_code, 'bytes': len(r.content),
                          'content_type': r.headers.get('content-type', ''), 'prefix': r.text[:160],
                      }
                      request_log.append(last)
                      if r.status_code == 200:
                          return r.json()
                  except Exception as exc:
                      last = {'url': API, 'error': repr(exc), 'attempt': attempt + 1, 'params': params}
                      request_log.append(last)
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Report API failed: {last}')

          def rows_from(payload: dict[str, Any]) -> list[dict[str, Any]]:
              rows = payload.get('data') or []
              if isinstance(rows, dict):
                  rows = rows.get('list') or rows.get('data') or []
              return [x for x in rows if isinstance(x, dict)] if isinstance(rows, list) else []

          all_rows: list[dict[str, Any]] = []
          seen: set[str] = set()

          # Primary issuer query.
          for page in range(1, 11):
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2017-01-01', 'endTime': '2026-10-28',
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'author': '', 'code': CODE, 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              payload = fetch_page(params)
              rows = rows_from(payload)
              for row in rows:
                  key = str(row.get('infoCode') or '') or json.dumps(row, ensure_ascii=False, sort_keys=True)
                  if key not in seen:
                      seen.add(key); all_rows.append(row)
              total_pages = int(payload.get('TotalPage') or payload.get('totalPage') or 0)
              if not rows or (total_pages and page >= total_pages) or len(rows) < 100:
                  break
              time.sleep(0.3)

          # Date-window fallback to recover reports omitted by the issuer index.
          for begin, end in [('2022-03-16','2022-03-20'), ('2022-02-09','2022-02-13'), ('2021-08-24','2021-08-28')]:
              for page in range(1, 12):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*',
                      'beginTime': begin, 'endTime': end,
                      'pageNo': str(page), 'fields': '', 'qType': '0',
                      'orgCode': '', 'author': '', 'code': '', 'rcode': '',
                      'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                  }
                  payload = fetch_page(params)
                  rows = rows_from(payload)
                  for row in rows:
                      title = str(row.get('title') or '')
                      if str(row.get('stockCode') or '') != CODE and SHORT not in title:
                          continue
                      key = str(row.get('infoCode') or '') or json.dumps(row, ensure_ascii=False, sort_keys=True)
                      if key not in seen:
                          seen.add(key); all_rows.append(row)
                  total_pages = int(payload.get('TotalPage') or payload.get('totalPage') or 0)
                  if not rows or (total_pages and page >= total_pages) or len(rows) < 100:
                      break
                  time.sleep(0.2)

          def norm(text: Any) -> str:
              return re.sub(r'\s+', '', str(text or ''))

          def pages_meta(row: dict[str, Any]) -> int:
              try:
                  return int(float(row.get('attachPages') or 0))
              except Exception:
                  return 0

          print('ALL_CANDIDATES')
          for row in sorted(all_rows, key=lambda x: str(x.get('publishDate') or ''), reverse=True):
              print(json.dumps({
                  'infoCode': row.get('infoCode'), 'stockCode': row.get('stockCode'),
                  'stockName': row.get('stockName'), 'orgSName': row.get('orgSName'),
                  'publishDate': row.get('publishDate'), 'attachPages': row.get('attachPages'),
                  'title': row.get('title'), 'researcher': row.get('researcher'),
                  'rating': row.get('emRatingName') or row.get('sRatingName'),
              }, ensure_ascii=False))

          target_specs = [
              {
                  'label': '中泰证券公司深度',
                  'title_fragment': '中小尺寸硅片领先厂商',
                  'fallback': {
                      'infoCode': '', 'orgSName': '中泰证券', 'publishDate': '2022-03-17',
                      'title': '中小尺寸硅片领先厂商，产业链一体化成长空间广阔',
                      'researcher': '王芳、杨旭', 'emRatingName': '买入', 'attachPages': 19,
                  },
                  'min_pages': 15,
              },
              {
                  'label': '开源证券首次覆盖',
                  'title_fragment': '国产硅片龙头',
                  'fallback': {
                      'infoCode': 'AP202202111546341099', 'orgSName': '开源证券', 'publishDate': '2022-02-10',
                      'title': '公司首次覆盖报告：国产硅片龙头，前景可期',
                      'researcher': '刘翔、罗通', 'emRatingName': '买入', 'attachPages': 18,
                  },
                  'min_pages': 15,
              },
              {
                  'label': '国信证券首次评级',
                  'title_fragment': '深耕小尺寸半导体硅片',
                  'fallback': {
                      'infoCode': 'AP202108261512499224', 'orgSName': '国信证券', 'publishDate': '2021-08-25',
                      'title': '动态点评：深耕小尺寸半导体硅片，盈利能力突出',
                      'researcher': '胡剑、胡慧、许亮、唐泓翼', 'emRatingName': '增持', 'attachPages': 9,
                  },
                  'min_pages': 8,
              },
          ]

          selected: list[dict[str, Any]] = []
          for spec in target_specs:
              matches = []
              frag = norm(spec['title_fragment'])
              for row in all_rows:
                  if frag in norm(row.get('title')) and (str(row.get('stockCode') or '') in ('', CODE) or SHORT in str(row.get('stockName') or '')):
                      matches.append(row)
              if matches:
                  matches.sort(key=lambda r: (pages_meta(r), str(r.get('publishDate') or '')), reverse=True)
                  chosen = dict(matches[0])
              else:
                  chosen = dict(spec['fallback'])
              chosen['_label'] = spec['label']
              chosen['_min_pages'] = spec['min_pages']
              selected.append(chosen)

          def safe(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              return re.sub(r'\s+', '', text)[:100]

          def download_pdf(row: dict[str, Any]) -> tuple[bytes, str, list[dict[str, Any]]]:
              info = str(row.get('infoCode') or '')
              title = str(row.get('title') or '')
              attempts: list[dict[str, Any]] = []
              candidates: list[str] = []
              if info:
                  candidates.extend([f'https://pdf.dfcfw.com/pdf/{p}_{info}_1.pdf' for p in ('H3','H2','H1','H4')])
              # Public mirrors only as a fallback for the Zhongtai report if the index omits infoCode.
              if '中小尺寸硅片领先厂商' in title:
                  candidates.extend([
                      'https://pdf.dfcfw.com/pdf/H3_AP202203181552059395_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202203181552059395_1.PDF',
                  ])
              for url in list(dict.fromkeys(candidates)):
                  for attempt in range(5):
                      try:
                          r = s.get(url, headers={
                              'User-Agent': s.headers['User-Agent'],
                              'Referer': f'https://data.eastmoney.com/report/stock.jshtml?stockCode={CODE}',
                              'Accept': 'application/pdf,*/*;q=0.8',
                          }, timeout=(30, 360), allow_redirects=True)
                          meta = {'url': url, 'status': r.status_code, 'bytes': len(r.content), 'content_type': r.headers.get('content-type',''), 'final_url': r.url}
                          attempts.append(meta)
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 80_000:
                              return r.content, url, attempts
                      except Exception as exc:
                          attempts.append({'url': url, 'error': repr(exc)})
                      time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed for {title}: {attempts[-20:]}")

          manifest: list[dict[str, Any]] = []
          for idx, row in enumerate(selected, 1):
              data, source_url, attempts = download_pdf(row)
              broker = str(row.get('orgSName') or row.get('orgName') or '券商')
              title = str(row.get('title') or '')
              date = str(row.get('publishDate') or '')[:10]
              filename = f"{idx:02d}_{safe(broker)}_中晶科技_{safe(title)}_{date}.pdf"
              dest = PDF_DIR / filename
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages < int(row['_min_pages']):
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {actual_pages} pages')

              text = ''
              for page in reader.pages[:min(15, actual_pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = norm(text)
              identity_hits = [x for x in (SHORT, FULL, CODE) if norm(x) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer identity mismatch for {filename}')

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview render failed for {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'label': row['_label'], 'broker': broker, 'title': title, 'date': date,
                  'analysts': row.get('researcher') or row.get('author'),
                  'rating': row.get('emRatingName') or row.get('sRatingName'),
                  'metadata_pages': pages_meta(row), 'actual_pages': actual_pages,
                  'filename': str(Path('原始PDF') / filename), 'bytes': len(data),
                  'sha256': sha, 'info_code': row.get('infoCode'),
                  'source_url': source_url, 'identity_hits': identity_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': ['PDF header','issuer identity','page count','qpdf structure','first-page render'],
              })

          readme = [
              '浙江中晶科技股份有限公司（003026.SZ）券商深度研究报告资料包',
              '整理日期：2026-10-28','',
              '本包收录3份公开可直接取得的券商原始完整PDF。优先选择公司深度、首次覆盖或首次评级的较长报告。',''
          ]
          for i,x in enumerate(manifest,1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   来源：{x['source_url']}",
                  f"   SHA-256：{x['sha256']}",'',
              ]
          readme += [
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT/'candidate_records.json').write_text(json.dumps(all_rows, ensure_ascii=False, indent=2, default=str), encoding='utf-8')
          (ROOT/'request_log.json').write_text(json.dumps(request_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest), encoding='utf-8')

          zip_cn = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_cn) as z:
              bad = z.testzip(); pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          zip_en = Path('zhongjing_003026_broker_deep_reports.zip')
          zip_en.write_bytes(zip_cn.read_bytes())
          print('FINAL_ZIP', zip_cn, zip_cn.stat().st_size, 'SHA256', hashlib.sha256(zip_cn.read_bytes()).hexdigest())
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: zhongjing-003026-broker-deep-reports-final
          path: |
            中晶科技_003026_券商深度报告_3份.zip
            zhongjing_003026_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
