name: Build Lirenlizhuang 605136 all reports package 20261012

on:
  push:
    paths: ['.github/workflows/lirenlizhuang-605136-all-reports-package-20261012.yml']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf
      - name: Download and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='丽人丽妆_605136_所有年报_招股说明书及2026最新季报与半年报'
          OUT=Path(PACKAGE); OUT.mkdir(exist_ok=True)
          S=requests.Session(); S.trust_env=False
          S.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          tasks=[
            ('01_丽人丽妆_首次公开发行股票招股说明书.pdf','首次公开发行股票招股说明书','招股说明书','首次公开发行股票并上市','AN202009161413139475','2020-09-16',250,2000000),
            ('02_丽人丽妆_2020年年度报告.pdf','2020年年度报告','年度报告','2020年度','AN202103171472932274','2021-03-18',80,700000),
            ('03_丽人丽妆_2021年年度报告.pdf','2021年年度报告','年度报告','2021年度','AN202203021550164022','2022-03-03',80,700000),
            ('04_丽人丽妆_2022年年度报告.pdf','2022年年度报告','年度报告','2022年度','AN202303301584712162','2023-03-31',80,700000),
            ('05_丽人丽妆_2023年年度报告.pdf','2023年年度报告','年度报告','2023年度','AN202403281628444446','2024-03-29',80,700000),
            ('06_丽人丽妆_2024年年度报告.pdf','2024年年度报告','年度报告','2024年度','AN202503271648266970','2025-03-28',80,700000),
            ('07_丽人丽妆_2025年年度报告.pdf','2025年年度报告','年度报告','2025年度','AN202603271820817964','2026-03-28',80,700000),
            ('08_丽人丽妆_2026年第一季度报告.pdf','2026年第一季度报告','季度报告','2026年第一季度','AN202604271821619376','2026-04-28',5,80000),
            ('09_丽人丽妆_2026年半年度报告.pdf','2026年半年度报告','半年度报告','2026年半年度','AN202608131827939852','2026-08-14',50,400000),
          ]

          def urls(code):
            return [f'https://pdf.dfcfw.com/pdf/{p}_{code}_1.{ext}' for p in ('H2','H3','H4') for ext in ('pdf','PDF')]
          def get(code,path,min_bytes):
            errors=[]
            for u in urls(code):
              for attempt in range(1,4):
                tmp=path.with_suffix('.pdf.part'); tmp.unlink(missing_ok=True)
                try:
                  with S.get(u,headers={'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},stream=True,timeout=(30,600)) as r:
                    print('DOWNLOAD',path.name,r.status_code,u,flush=True); r.raise_for_status()
                    with tmp.open('wb') as f:
                      for chunk in r.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                  if tmp.stat().st_size<min_bytes or not tmp.read_bytes()[:5]==b'%PDF-': raise RuntimeError('invalid PDF')
                  tmp.replace(path); return u
                except Exception as e:
                  errors.append(str(e)); tmp.unlink(missing_ok=True); time.sleep(attempt)
            raise RuntimeError(f'download failed {path.name}: {errors[-5:]}')

          records=[]; hashes=set()
          for fn,title,typ,period,code,date,min_pages,min_bytes in tasks:
            path=OUT/fn; source=get(code,path,min_bytes)
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
            if pages<min_pages: raise RuntimeError(f'{fn}: only {pages} pages')
            chk=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],capture_output=True,text=True)
            if chk.returncode: raise RuntimeError(chk.stderr[-1000:])
            root=OUT/(path.stem+'_check')
            rnd=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','72',str(path),str(root)],capture_output=True,text=True)
            png=Path(str(root)+'.png')
            if rnd.returncode or not png.exists() or png.stat().st_size<5000: raise RuntimeError(f'render failed {fn}')
            png.unlink()
            data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in hashes: raise RuntimeError('duplicate PDF'); hashes.add(sha)
            rec={'filename':fn,'title':title,'type':typ,'period':period,'announcement_date':date,'art_code':code,'pages':pages,'bytes':len(data),'sha256':sha,'source_pdf_url':source}
            records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          lines=['上海丽人丽妆化妆品股份有限公司（605136.SH）全部上市后年度报告、最终版招股说明书及2026年最新定期报告','整理日期：2026-10-12','','收录范围：2020—2025年完整年度报告、2020年首次公开发行股票招股说明书最终版、2026年第一季度报告，以及时间更近的2026年半年度报告。','未收录年报摘要、招股意向书及招股说明书申报稿等重复阶段稿。','来源：上海证券交易所公告文件的公开镜像。','全部PDF已完成文件头、页数、qpdf结构、首页渲染、SHA-256与ZIP CRC检查。','','文件清单：']
          for i,r in enumerate(records,1):
            lines += [f"{i}. {r['title']}（{r['pages']}页，{r['announcement_date']}）",f"   文件：{r['filename']}",f"   公告代码：{r['art_code']}",f"   SHA-256：{r['sha256']}",'']
          (OUT/'00_文件清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')
          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as a:
            for p in sorted(OUT.iterdir()): a.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(z) as a:
            if a.testzip(): raise RuntimeError('ZIP CRC failure')
            if len([n for n in a.namelist() if n.lower().endswith('.pdf')])!=9: raise RuntimeError('PDF count mismatch')
          print('FINAL_ZIP',z.name,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: lirenlizhuang-605136-all-reports-20261012
          path: 丽人丽妆_605136_所有年报_招股说明书及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
