name: List JinkoSolar Energy brokerage report metadata 20260927

on:
  push:
    paths:
      - '.github/workflows/jinkosolar-688223-brokerage-api-list-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Eastmoney report API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,*/*;q=0.8',
          })
          params = {
              'industryCode': '*',
              'pageSize': '100',
              'industry': '*',
              'rating': '*',
              'ratingchange': '*',
              'beginTime': '2019-01-01',
              'endTime': '2026-09-27',
              'pageNo': '1',
              'fields': '',
              'qType': '0',
              'orgCode': '',
              'code': '688223',
              'rcode': '',
              'p': '1',
              'pageNum': '1',
              'pageNumber': '1',
              '_': str(int(time.time() * 1000)),
          }
          r = s.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=60)
          print('STATUS', r.status_code, 'URL', r.url, 'BYTES', len(r.content), flush=True)
          r.raise_for_status()
          payload = r.json()
          rows = payload.get('data', []) if isinstance(payload, dict) else []
          print('ROW_COUNT', len(rows), flush=True)
          for row in rows:
              print('REPORT_ROW', json.dumps({
                  'title': row.get('title'),
                  'orgSName': row.get('orgSName'),
                  'publishDate': row.get('publishDate'),
                  'infoCode': row.get('infoCode'),
                  'attachPages': row.get('attachPages'),
                  'attachSize': row.get('attachSize'),
                  'researcher': row.get('researcher'),
                  'column': row.get('column'),
                  'emRatingName': row.get('emRatingName'),
                  'encodeUrl': row.get('encodeUrl'),
              }, ensure_ascii=False), flush=True)
          PY
