name: Inspect public full-report viewer for Huabao reports

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-fxbaogao-view-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch viewer and inspect URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          ids=['5343581','5367228','5666169']
          allout={}
          for docid in ids:
              u=f'https://www.fxbaogao.com/view?id={docid}'
              try:
                  r=s.get(u,timeout=(10,60),allow_redirects=True)
                  print('FETCH',docid,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  Path(f'out/{docid}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'html.parser')
                  links=[]
                  for tag in soup.find_all(['a','img','iframe','embed','object','script','source','link']):
                      for attr in ('href','src','data'):
                          v=tag.get(attr)
                          if not v: continue
                          full=urllib.parse.urljoin(r.url,v)
                          if any(k in (full+' '+str(tag.attrs)).lower() for k in ('pdf','report','image','page','oss','file','download','viewer','view')):
                              links.append({'tag':tag.name,'attr':attr,'url':full,'attrs':dict(tag.attrs)})
                  raw=[]
                  for pat in [r'https?://[^\"\'<>\\s]+',r'[\"\']([^\"\']*(?:\.pdf|\.png|\.jpg|\.jpeg|\.webp|report-image|download|page|oss|file|viewer|view)[^\"\']*)[\"\']']:
                      for m in re.finditer(pat,r.text,re.I):
                          v=m.group(1) if m.lastindex else m.group(0)
                          v=v.replace('\\u002F','/').replace('\\/','/')
                          if v not in raw: raw.append(v)
                  text=soup.get_text(' ',strip=True)
                  allout[docid]={'status':r.status_code,'url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links,'raw':raw,'text_prefix':text[:5000]}
                  print('RESULT',docid,json.dumps({'title':allout[docid]['title'],'links':links[:120],'raw':raw[:200],'text':text[:1000]},ensure_ascii=False),flush=True)
              except Exception as e:
                  print('FAIL',docid,repr(e),flush=True); allout[docid]={'error':repr(e)}
          Path('out/results.json').write_text(json.dumps(allout,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-fxbaogao-view-probe
          path: out/
          retention-days: 3
          if-no-files-found: error
