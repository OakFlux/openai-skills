name: Build Fujia 603219 disclosure package v2

on:
  push:
    branches:
      - tmp-fujia-603219-reports-20261028

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '富佳股份_603219_年报_招股说明书_最新季报' /tmp/fujia_check
          python3 - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('富佳股份_603219_年报_招股说明书_最新季报')
          session = requests.Session()
          retry = Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          docs = [
              {
                  'file': '00_富佳股份_首次公开发行股票招股说明书_2021-11-10.pdf',
                  'name': '首次公开发行股票招股说明书',
                  'date': '2021-11-10',
                  'min_pages': 300,
                  'referer': 'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?id=7648532&stockid=603219',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-11/2021-11-10/7648532.PDF',
                      'https://qccdata.qichacha.com/ReportData/PDF/098138e1bcfd59d7a216da853f935fbc.pdf',
                  ],
              },
              {
                  'file': '01_富佳股份_2021年年度报告.pdf',
                  'name': '2021年年度报告',
                  'date': '2022-04-21',
                  'min_pages': 70,
                  'referer': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8022948&stockid=603219',
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-21/8022948.PDF'],
              },
              {
                  'file': '02_富佳股份_2022年年度报告.pdf',
                  'name': '2022年年度报告',
                  'date': '2023-03-22',
                  'min_pages': 70,
                  'referer': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8901389&stockid=603219',
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-22/8901389.PDF'],
              },
              {
                  'file': '03_富佳股份_2023年年度报告.pdf',
                  'name': '2023年年度报告',
                  'date': '2024-04-27',
                  'min_pages': 70,
                  'referer': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10127859&stockid=603219',
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-27/10127859.PDF'],
              },
              {
                  'file': '04_富佳股份_2024年年度报告.pdf',
                  'name': '2024年年度报告',
                  'date': '2025-04-26',
                  'min_pages': 70,
                  'referer': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10992633&stockid=603219',
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-26/10992633.PDF'],
              },
              {
                  'file': '05_富佳股份_2025年年度报告.pdf',
                  'name': '2025年年度报告',
                  'date': '2026-03-21',
                  'min_pages': 70,
                  'referer': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12008471&stockid=603219',
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-3/2026-03-21/12008471.PDF'],
              },
              {
                  'file': '06_富佳股份_2026年第三季度报告.pdf',
                  'name': '2026年第三季度报告',
                  'date': '2026-10-28',
                  'min_pages': 8,
                  'referer': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12664265&stockid=603219',
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-28/12664265.PDF'],
              },
          ]

          def download(doc):
              destination = out / doc['file']
              last_error = None
              for url in doc['urls']:
                  for attempt in range(1, 5):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'Referer': doc['referer'],
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200:
                              raise RuntimeError(f'HTTP {response.status_code}')
                          if not data.startswith(b'%PDF-'):
                              raise RuntimeError(f'not a PDF, bytes={len(data)}')
                          if len(data) < 80000:
                              raise RuntimeError(f'file too small, bytes={len(data)}')
                          destination.write_bytes(data)
                          pages = len(PdfReader(str(destination), strict=False).pages)
                          if pages < doc['min_pages']:
                              raise RuntimeError(f'page count {pages} below minimum {doc["min_pages"]}')
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', doc['file'], 'pages=', pages, 'bytes=', len(data), 'url=', response.url)
                          return {
                              'file': doc['file'],
                              'document': doc['name'],
                              'published': doc['date'],
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': sha,
                              'source': response.url,
                              'announcement_page': doc['referer'],
                          }
                      except Exception as exc:
                          last_error = exc
                          destination.unlink(missing_ok=True)
                          print('RETRY', doc['name'], 'attempt=', attempt, 'url=', url, 'error=', repr(exc))
                          time.sleep(attempt * 2)
              raise RuntimeError(f'Failed to download {doc["name"]}: {last_error!r}')

          results = [download(doc) for doc in docs]
          lines = [
              '富佳股份（603219）年报、招股说明书及最新季报资料包',
              '整理日期：2026-10-28',
              '',
              '收录范围：',
              '1. 上市以来全部年度报告全文：2021—2025年，共5份。',
              '2. 首次公开发行股票招股说明书全文：2021年11月10日披露，共1份。',
              '3. 截至2026年10月28日最新季度报告：2026年第三季度报告，共1份。',
              '4. 未收录年度报告摘要、持续督导报告、招股说明书摘要或半年度报告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in results:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines.extend([
                  f"- {item['file']}",
                  f"  文件：{item['document']}；披露日期：{item['published']}；页数：{item['pages']}；大小：{item['bytes']}字节",
                  f"  PDF来源：{item['source']}",
                  f"  公告信息页：{item['announcement_page']}",
                  f"  SHA-256：{item['sha256']}",
              ])
              sums.append(f"{item['sha256']}  {item['file']}")
          lines.extend([
              '',
              f'PDF数量：{len(results)}份。',
              f'合计页数：{total_pages}页。',
              f'PDF合计大小：{total_bytes}字节。',
              '资料仅用于研究与存档。',
          ])
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          PACKAGE='富佳股份_603219_年报_招股说明书_最新季报'
          test "$(find "$PACKAGE" -maxdepth 1 -type f -iname '*.pdf' | wc -l)" -eq 7
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2); print $2}')
            test -n "$pages" && test "$pages" -ge 8
            pdftotext -f 1 -l 8 "$pdf" "/tmp/$(basename "$pdf").txt" 2>/dev/null || true
            stem="/tmp/fujia_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('富佳股份_603219_年报_招股说明书_最新季报')
          rows = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          assert len(rows) == 7
          assert [row['document'] for row in rows[1:6]] == [f'{year}年年度报告' for year in range(2021, 2026)]
          assert rows[0]['document'] == '首次公开发行股票招股说明书'
          assert rows[0]['pages'] >= 300
          assert rows[6]['document'] == '2026年第三季度报告'
          assert rows[6]['published'] == '2026-10-28'
          (folder / '_metadata.json').unlink()
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -ci '\.pdf$')" -eq 7
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Fujia-603219-annual-reports-prospectus-latest-quarterly-report-v2
          path: 富佳股份_603219_年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
