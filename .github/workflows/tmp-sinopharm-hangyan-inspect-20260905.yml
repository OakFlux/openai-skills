name: Inspect public Sinopharm report assets

on:
  push:
    branches:
      - tmp-sinopharm-hangyan-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect pages and scripts
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/inspect.py <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls=[
            'https://www.hangyan.co/reports/3097844454174754770',
            'https://www.sdyanbao.com/detail/938808',
            'https://www.firstshanghai.com.hk/zh-hans/research',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for u in urls:
              print('\n===== URL',u,'=====')
              try:
                  r=s.get(u,timeout=(20,80),allow_redirects=True,verify=False)
                  print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
                  txt=r.text
                  soup=BeautifulSoup(txt,'html.parser')
                  for tag in soup.find_all(['a','img','script','iframe','source','link']):
                      vals=[]
                      for a in ['href','src','data-src','data-url','data-file','download']:
                          v=tag.get(a)
                          if v: vals.append(urljoin(r.url,v))
                      for v in vals:
                          if any(k in v.lower() for k in ['pdf','download','report','api','oss','file','static','_next']):
                              print('ASSET',v)
                  pats=[
                    r'https?://[^\"\'<>\\ ]+\.pdf(?:\?[^\"\'<>\\ ]*)?',
                    r'https?://[^\"\'<>\\ ]+(?:oss|cdn|file|report|download)[^\"\'<>\\ ]+',
                    r'/(?:api|download|file|report)[^\"\'<>\\ ]+',
                  ]
                  for pat in pats:
                      for m in list(dict.fromkeys(re.findall(pat,txt,re.I)))[:200]: print('MATCH',m[:1000])
                  keys=['pdf','download','file_url','fileUrl','report_url','reportUrl','attachment','original_id','data_source_uuid','preview','images','pages','3097844454174754770','938808']
                  for key in keys:
                      print('\n--CONTEXT',key,'--')
                      start=0; count=0
                      low=txt.lower(); kl=key.lower()
                      while True:
                          i=low.find(kl,start)
                          if i<0 or count>=20: break
                          print(txt[max(0,i-300):min(len(txt),i+700)].replace('\n',' ')[:1000])
                          start=i+len(kl); count+=1
                  # fetch script assets and grep them for endpoint patterns
                  scripts=[]
                  for tag in soup.find_all('script'):
                      src=tag.get('src')
                      if src: scripts.append(urljoin(r.url,src))
                  for su in scripts[:50]:
                      try:
                          sr=s.get(su,timeout=(15,60),verify=False)
                          st=sr.text
                          if any(k in st for k in ['download','file_url','reportUrl','original_id','data_source_uuid']):
                              print('\nSCRIPT',su,'LEN',len(st))
                              for key in ['download','file_url','reportUrl','original_id','data_source_uuid']:
                                  pos=st.find(key)
                                  if pos>=0: print('SCRIPTCTX',key,st[max(0,pos-500):pos+1500][:2000])
                      except Exception as e: print('SCRIPTERR',su,repr(e))
              except Exception as e:
                  print('ERROR',repr(e))
          PY
          PYTHONWARNINGS=ignore python /tmp/inspect.py
