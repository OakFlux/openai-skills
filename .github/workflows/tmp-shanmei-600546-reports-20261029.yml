name: Build Shanmei International 600546 reports package

on:
  push:
    branches:
      - tmp-shanmei-600546-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='山煤国际_600546_2020-2025年报及最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/shanmei_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('山煤国际_600546_2020-2025年报及最新季报')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          documents = [
              {
                  'order': 1,
                  'kind': 'annual',
                  'year': 2020,
                  'title': '2020年年度报告',
                  'date': '2021-04-10',
                  'file': '01_山煤国际_2020年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-10/7030293.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-10/7030293.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7030293&stockid=600546',
              },
              {
                  'order': 2,
                  'kind': 'annual',
                  'year': 2021,
                  'title': '2021年年度报告（修订稿）',
                  'date': '2022-06-28',
                  'file': '02_山煤国际_2021年年度报告_修订稿.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-6/2022-06-28/8322442.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-6/2022-06-28/8322442.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8322442&stockid=600546',
              },
              {
                  'order': 3,
                  'kind': 'annual',
                  'year': 2022,
                  'title': '2022年年度报告',
                  'date': '2023-03-28',
                  'file': '03_山煤国际_2022年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-28/8917033.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-28/8917033.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8917033&stockid=600546',
              },
              {
                  'order': 4,
                  'kind': 'annual',
                  'year': 2023,
                  'title': '2023年年度报告',
                  'date': '2024-03-30',
                  'file': '04_山煤国际_2023年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-30/9924965.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-30/9924965.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9924965&stockid=600546',
              },
              {
                  'order': 5,
                  'kind': 'annual',
                  'year': 2024,
                  'title': '2024年年度报告',
                  'date': '2025-04-29',
                  'file': '05_山煤国际_2024年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-29/600546_20250429_UT02.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-29/11051550.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-29/11051550.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=11051550&stockid=600546',
              },
              {
                  'order': 6,
                  'kind': 'annual',
                  'year': 2025,
                  'title': '2025年年度报告',
                  'date': '2026-04-24',
                  'file': '06_山煤国际_2025年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://stockmc.xueqiu.com/202604/600546_20260424_XZIB.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-24/12169526.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-24/12169526.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12169526&stockid=600546',
              },
              {
                  'order': 7,
                  'kind': 'quarter',
                  'year': 2026,
                  'title': '2026年第一季度报告',
                  'date': '2026-04-24',
                  'file': '07_山煤国际_2026年第一季度报告.pdf',
                  'min_pages': 5,
                  'urls': [
                      'https://stockmc.xueqiu.com/202604/600546_20260424_T4QT.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-24/12169509.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-24/12169509.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12169509&stockid=600546',
              },
          ]

          def inspect(path: Path, document: dict) -> tuple[int, str]:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < int(document['min_pages']):
                  raise RuntimeError(f'page count below minimum: {pages}')
              indexes = list(range(min(18, pages)))
              if pages > 18:
                  indexes.append(pages - 1)
              text = ''
              for index in dict.fromkeys(indexes):
                  try:
                      text += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '山煤国际' not in compact and '山煤国际能源集团股份有限公司' not in compact:
                  raise RuntimeError('company name mismatch')
              if document['kind'] == 'annual':
                  year = str(document['year'])
                  if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                      raise RuntimeError('annual report title mismatch')
              else:
                  if '第一季度报告' not in compact or str(document['year']) not in compact:
                      raise RuntimeError('quarterly report title mismatch')
              return pages, compact

          def download(document: dict) -> dict:
              destination = out / document['file']
              last = None
              for url in document['urls']:
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              headers={'Referer': document['index']},
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(
                                  f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          pages, _ = inspect(destination, document)
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', document['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return {
                              **document,
                              'pages': pages,
                              'bytes': len(data),
                              'source': response.url,
                              'sha256': sha,
                          }
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', document['title'], url, repr(exc))
                          time.sleep(min(1 + attempt, 3))
              raise RuntimeError(f'Could not download {document["title"]}: {last!r}')

          records = [download(document) for document in documents]
          records.sort(key=lambda item: item['order'])

          lines = [
              '山煤国际（600546）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：',
              '1. 2020-2025年度报告全文，共6份，不含年度报告摘要。',
              '2. 2021年度采用2022年6月28日披露的年度报告修订稿。',
              '3. 截至2026年10月29日，公司2026年第三季度报告计划于2026年10月31日披露，尚未正式发布；因此本包收录2026年第一季度报告作为当前最新已披露季报。',
              '4. 未将2026年半年度报告作为季度报告替代。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['file']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   原始PDF：{item['source']}",
                  f"   公告/索引页：{item['index']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['file']}")
          lines += [
              f'合计：7份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件均已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '山煤国际|山煤国际能源集团股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/shanmei_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/shanmei_test.zip "$PACKAGE"
          unzip -t /tmp/shanmei_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/shanmei_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/shanmei_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Shanmei-600546-2020-2025-annual-reports-latest-quarter
          path: 山煤国际_600546_2020-2025年报及最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
