name: Inspect Hibor NewContent API

on:
  pull_request:
    paths:
      - 'tasks/inspect-hibor-newcontent-api-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch bundle and probe NewContent endpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          import requests

          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://sysbg.hibor.com.cn/data/b6836279f674f42f07de9d42efb68f4f.html','X-Requested-With':'XMLHttpRequest'})
          js_url='https://sysbg.hibor.com.cn/hiborweb/DocDetailNew/js?v=JhJG5MdT9wDoAQX8-xy-bc9qho_6DU5Ailv07PYCEEg1'
          r=s.get(js_url,timeout=(25,120));print('JS',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True);r.raise_for_status();Path('output/docdetailnew.js').write_bytes(r.content)
          text=r.text
          for pat in ('NewContent','newContentUrl','ncid','ajax','fetch','post','getJSON','wrap','data_loading'):
            print('\nPATTERN',pat,flush=True)
            for m in list(re.finditer(pat,text,re.I))[:20]:
              print(re.sub(r'\s+',' ',text[max(0,m.start()-500):m.end()+1000])[:2500],flush=True)
          probes=[]
          base='https://sysbg.hibor.com.cn/hiborweb/DocDetail/NewContent'
          ncids={
            'haitong':'049bf5e6-5f63-4e47-bbf0-40b7197f88d4',
            'changjiang':'67e7eaa6-e837-4eab-8a86-4f788be44abc',
          }
          for name,ncid in ncids.items():
            variants=[
              ('GET',{'ncid':ncid},None),
              ('GET',{'id':ncid},None),
              ('POST',None,{'ncid':ncid}),
              ('POST',None,{'id':ncid}),
              ('POST',None,{'ncid':ncid,'displayLoginLayer':'true'}),
            ]
            for idx,(method,params,data) in enumerate(variants):
              try:
                rr=s.request(method,base,params=params,data=data,timeout=(25,120),allow_redirects=True)
                rec={'name':name,'method':method,'params':params,'data':data,'status':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type'),'length':len(rr.content),'head':rr.text[:500]}
                Path(f'output/{name}_{idx}.bin').write_bytes(rr.content)
                probes.append(rec);print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e:
                rec={'name':name,'method':method,'params':params,'data':data,'error':repr(e)};probes.append(rec);print('PROBE_ERROR',json.dumps(rec,ensure_ascii=False),flush=True)
          Path('output/probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hibor-newcontent-api-inspection
          path: output/
          retention-days: 7
          if-no-files-found: error
