name: Build Furui Medical 300049 filings 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/furui-medical-300049-filings-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '300049'
          SHORT_CURRENT = '福瑞医科'
          SHORT_OLD = '福瑞股份'
          FULL = '内蒙古福瑞医疗科技股份有限公司'
          PACKAGE = '福瑞医科_300049_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          items = [
              {
                  'label': '2020年年度报告', 'kind': 'annual', 'year': 2020,
                  'required': '2020年年度报告', 'min_pages': 100,
                  'announcement_date': '2021-04-28',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2021-04-28/1209830704.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-28/7158291.PDF',
                  ],
              },
              {
                  'label': '2021年年度报告', 'kind': 'annual', 'year': 2021,
                  'required': '2021年年度报告', 'min_pages': 100,
                  'announcement_date': '2022-04-28',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2022-04-28/1213160393.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2022/2022-4/2022-04-28/8106867.PDF',
                  ],
              },
              {
                  'label': '2022年年度报告', 'kind': 'annual', 'year': 2022,
                  'required': '2022年年度报告', 'min_pages': 100,
                  'announcement_date': '2023-04-27',
                  'urls': [
                      'https://disc.static.szse.cn/disc/disk03/finalpage/2023-04-26/d277f677-26f8-4630-a45b-8632c40bbef9.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-27/9106700.PDF',
                  ],
              },
              {
                  'label': '2023年年度报告', 'kind': 'annual', 'year': 2023,
                  'required': '2023年年度报告', 'min_pages': 100,
                  'announcement_date': '2024-04-29',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2024-04-29/1219866709.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-29/10138473.PDF',
                  ],
              },
              {
                  'label': '2024年年度报告', 'kind': 'annual', 'year': 2024,
                  'required': '2024年年度报告', 'min_pages': 100,
                  'announcement_date': '2025-04-22',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2025-04-22/1223187199.PDF',
                      'https://www.fu-rui.com/uploads/upload/files/20250516/d288de73293f9b47f71fa8f29b542f96.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-22/10921011.PDF',
                  ],
              },
              {
                  'label': '2025年年度报告', 'kind': 'annual', 'year': 2025,
                  'required': '2025年年度报告', 'min_pages': 100,
                  'announcement_date': '2026-03-25',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-03-25/1225027182.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-3/2026-03-25/12014772.PDF',
                  ],
              },
              {
                  'label': '2026年第三季度报告', 'kind': 'quarter', 'year': 2026,
                  'required': '2026年第三季度报告', 'min_pages': 5,
                  'announcement_date': '2026-10-30',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-10-30/1225638772.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-30/12674857.PDF',
                  ],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          manifest = []
          for idx, item in enumerate(items, 1):
              data = None
              source_url = ''
              attempts = []
              for url in item['urls']:
                  for attempt in range(5):
                      try:
                          if 'cninfo.com.cn' in url or 'szse.cn' in url:
                              referer = 'https://www.cninfo.com.cn/'
                          elif 'fu-rui.com' in url:
                              referer = 'https://www.fu-rui.com/investor-relations'
                          else:
                              referer = 'https://vip.stock.finance.sina.com.cn/'
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url, 'attempt': attempt + 1,
                              'status': r.status_code, 'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f'Download failed for {item["label"]}: {attempts}')

              filename = f'{idx:02d}_福瑞医科_{item["label"]}.pdf'
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(60, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identities = (SHORT_CURRENT, SHORT_OLD, FULL, CODE, '福瑞医疗科技')
              identity_hits = [x for x in identities if normalize(x) in compact]
              required_hit = normalize(item['required']) in compact
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')
              if len(compact) > 500 and not required_hit:
                  raise RuntimeError(f'Report title mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'label': item['label'], 'kind': item['kind'], 'report_year': item['year'],
                  'announcement_date': item['announcement_date'],
                  'source_url': source_url, 'candidate_urls': item['urls'],
                  'filename': str(Path('原始PDF') / filename),
                  'pages': pages, 'bytes': len(data), 'sha256': sha,
                  'identity_hits': identity_hits, 'required_title_hit': required_hit,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'report title', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              })
              print('VERIFIED', item['label'], pages, len(data), sha, source_url)

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '内蒙古福瑞医疗科技股份有限公司（300049.SZ）年度报告及最新季度报告资料包',
              '整理日期：2026-11-04', '',
              '收录范围：2020—2025年年度报告全文，以及截至整理日最新披露的2026年第三季度报告。',
              '公司于2025年12月将证券简称由“福瑞股份”变更为“福瑞医科”，证券代码保持300049不变。',
              '不收录年度报告摘要、半年度报告、单独审计附件或普通公告页面。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["label"]}',
                  f'   页数：{x["pages"]}页；文件：{x["filename"]}',
                  f'   披露日期：{x["announcement_date"]}',
                  f'   来源：{x["source_url"]}',
                  f'   SHA-256：{x["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '核验项目：PDF文件头、公司名称/证券代码、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('furui_medical_300049_2020_2025_annual_reports_latest_quarter.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: furui-medical-300049-filings-final
          path: |
            福瑞医科_300049_2020-2025年报及最新季报.zip
            furui_medical_300049_2020_2025_annual_reports_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
