name: Fast inspect Huabao report source URLs
on:
  push:
    branches: [chatgpt-huabao-international-reports-20260907]
    paths: ['.github/workflows/chatgpt-huabao-fast-source.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch and parse source pages
        run: |
          mkdir -p out
          python - <<'PY'
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False; s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          targets={
           'nine':'https://gmg.9fzt.com/report/HKSE/00336/829143780300.html',
           'future':'https://www.vzkoo.com/read/114271240774000112376d90ba3c.html',
           'sg31':'https://www.sgpjbg.com.cn/baogao/1297618.html',
           'fx':'https://www.fxbaogao.com/detail/5343581'
          }
          allout={}
          for key,u in targets.items():
            try:
              r=s.get(u,timeout=(8,25),allow_redirects=True)
              print('FETCH',key,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path(f'out/{key}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for tag in soup.find_all(['a','img','iframe','embed','object','script','source','link']):
                for attr in ('href','src','data'):
                  v=tag.get(attr)
                  if not v: continue
                  full=urllib.parse.urljoin(r.url,v)
                  if any(x in (full+' '+str(tag.attrs)).lower() for x in ('pdf','download','report','file','document','page','image','preview','oss','upload','read','view')):
                    links.append({'tag':tag.name,'attr':attr,'url':full,'attrs':dict(tag.attrs)})
              raw=[]
              for pat in [r'https?://[^\"\'<>\\s]+',r'[\"\']([^\"\']*(?:\.pdf|\.png|\.jpg|\.jpeg|\.webp|download|report|file|document|page|image|preview|oss|upload|read|view)[^\"\']*)[\"\']']:
                for m in re.finditer(pat,r.text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=v.replace('\\u002F','/').replace('\\/','/')
                  if v not in raw: raw.append(v)
              allout[key]={'status':r.status_code,'url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links,'raw':raw}
              print('RESULT',key,json.dumps({'title':allout[key]['title'],'links':links[:200],'raw':raw[:400]},ensure_ascii=False),flush=True)
            except Exception as e:
              print('FAIL',key,repr(e),flush=True); allout[key]={'error':repr(e)}
          Path('out/results.json').write_text(json.dumps(allout,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-fast-source
          path: out/
          retention-days: 3
