name: Discover Kent 301591 broker reports 20261020

on:
  push:
    branches:
      - tmp/kent-301591-report-discovery-20261020-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query report API variants
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          codes=['301591','A17295','SZ301591','sz301591','肯特股份','南京肯特复合材料股份有限公司','']
          extras=[{}, {'keyword':'肯特股份'}, {'title':'肯特股份'}, {'search':'肯特股份'}, {'stockName':'肯特股份'}, {'name':'肯特股份'}]
          seen=set()
          for code in codes:
              for extra in extras:
                  params={
                    'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                    'beginTime':'2017-01-01','endTime':'2030-12-31','pageNo':'1','fields':'',
                    'qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
                  }
                  params.update(extra)
                  try:
                      r=s.get(api,params=params,timeout=(20,120))
                      d=r.json(); batch=d.get('data') or []
                      if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
                      out=[]
                      for x in batch if isinstance(batch,list) else []:
                          blob=(str(x.get('title') or '')+' '+str(x.get('stockName') or '')+' '+str(x.get('stockCode') or ''))
                          if ('肯特' in blob or 'A17295' in blob or code in ['301591','A17295','SZ301591','sz301591']):
                              obj={k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','stockCode','stockName','researcher']}
                              key=json.dumps(obj,ensure_ascii=False,sort_keys=True,default=str)
                              if key not in seen:
                                  seen.add(key); out.append(obj)
                      if out:
                          print('\nQUERY',json.dumps({'code':code,'extra':extra,'hits':d.get('hits')},ensure_ascii=False))
                          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))
                  except Exception as e:
                      print('ERROR',code,extra,repr(e))
                  time.sleep(.12)
          PY
