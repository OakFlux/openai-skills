name: Fast search Sdyanbao for Great Eagle
on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-sdy-fast-20260922.yml'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          mkdir output
          python - <<'PY'
          import concurrent.futures,json
          from pathlib import Path
          import requests
          qs=['鹰君集团','鹰君','鷹君','Great Eagle','00041']
          def call(arg):
            q,only=arg
            s=requests.Session(); s.trust_env=False
            s.headers.update({'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Accept':'application/json','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report','Device':'1'})
            body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
            try:
              r=s.post('https://api.sdyanbao.com/api/file/search',json=body,timeout=(10,25))
              return {'q':q,'only':only,'status':r.status_code,'text':r.text}
            except Exception as e:return {'q':q,'only':only,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            rows=list(ex.map(call,[(q,o) for q in qs for o in (0,1)]))
          parsed=[]
          ids={}
          for i,row in enumerate(rows):
            try:d=json.loads(row.get('text',''))
            except:d={'raw':row.get('text','')}
            row['data']=d; row.pop('text',None); parsed.append(row)
            dd=d.get('data') if isinstance(d,dict) else None
            fs=dd.get('files',[]) if isinstance(dd,dict) else []
            for x in fs:
              blob=json.dumps(x,ensure_ascii=False).lower()
              if any(k in blob for k in ['鹰君','鷹君','great eagle','00041']): ids[str(x.get('id'))]=x
          Path('output/search.json').write_text(json.dumps(parsed,ensure_ascii=False,indent=2),encoding='utf-8')
          details=[]
          for rid,x in ids.items():
            try:
              s=requests.Session(); s.trust_env=False
              s.headers.update({'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Device':'1','Referer':'https://www.sdyanbao.com/'})
              r=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=(10,25))
              details.append({'id':rid,'item':x,'status':r.status_code,'response':r.json()})
            except Exception as e:details.append({'id':rid,'item':x,'error':repr(e)})
          Path('output/details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'ids':ids,'details':details},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-sdy-fast
          path: output
          retention-days: 7
