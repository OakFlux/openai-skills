name: Inspect selected ST Guangtang deep report pages 20261004

on:
  push:
    paths:
      - '.github/workflows/st-guangtang-selected-report-pages-probe-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect selected Sina report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup

          ids = ['514910001977','513245298881','486053137402','455715446093']
          s = requests.Session(); s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          for rid in ids:
              url = f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
              r = s.get(url, timeout=60)
              print('\n===', rid, 'STATUS', r.status_code, 'BYTES', len(r.content), 'FINAL', r.url, '===', flush=True)
              r.raise_for_status()
              text = r.content.decode('gb18030', errors='replace')
              soup = BeautifulSoup(text, 'lxml')
              print('HTML_TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)

              # Print likely metadata blocks.
              for selector in ['h1','h2','.title','.report-title','.content','.blk_container','.main','body']:
                  node = soup.select_one(selector)
                  if node:
                      val = re.sub(r'\s+', ' ', node.get_text(' ', strip=True))
                      print('SELECTOR', selector, 'TEXT_HEAD', val[:1200], flush=True)

              # Extract labeled metadata and article text candidates.
              body_text = re.sub(r'\s+', ' ', soup.get_text(' ', strip=True))
              for label in ['机构：','研究员：','报告日期：','评级：','撰写日期：','报告类型：']:
                  idx = body_text.find(label)
                  if idx >= 0:
                      print('META', body_text[idx:idx+300], flush=True)

              candidates=[]
              for sel in ['#content','div.content','div.report-content','div.blk_container','div.main_content','div#container','td.t_content','div.article']:
                  for node in soup.select(sel):
                      val = re.sub(r'\s+', ' ', node.get_text('\n', strip=True))
                      if len(val) > 300:
                          candidates.append((sel, len(val), val[:2000]))
              candidates.sort(key=lambda x:x[1], reverse=True)
              print('CANDIDATES', json.dumps(candidates[:5], ensure_ascii=False), flush=True)

              # Any downloadable files / PDFs.
              seen=set()
              for tag in soup.find_all(['a','iframe','embed','object','script']):
                  for attr in ['href','src','data']:
                      u = tag.get(attr)
                      if not u or u in seen: continue
                      seen.add(u)
                      low=u.lower()
                      if any(k in low for k in ['.pdf','download','attach','reportfile','rptid']):
                          print('LINK', attr, u, flush=True)
          PY
