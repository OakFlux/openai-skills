name: Discover CMBI August Haizhi Technology report 20260922

on:
  push:
    paths:
      - '.github/workflows/cmbi-haizhi-august-report-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install parsers
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Scan CMBI article IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json,html,time
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept-Language':'en-US,en;q=0.9,zh-CN;q=0.8'})
          matches=[]
          for aid in range(13460,13545):
            for lang in ('en','cn'):
              u=f'https://www.cmbi.com.hk/article/{aid}.html?lang={lang}'
              try:
                r=s.get(u,timeout=(10,30),allow_redirects=True)
                if r.status_code!=200: continue
                text=r.content.decode('utf-8','replace'); soup=BeautifulSoup(text,'lxml')
                title=(soup.find('h1') or soup.find('h2') or soup.title)
                ttl=title.get_text(' ',strip=True) if title else ''
                body=soup.get_text(' ',strip=True)
                if any(k.lower() in (ttl+' '+body).lower() for k in ('haizhi','海致科技','2706 hk','02706')):
                  pdfs=[]
                  for tag in soup.find_all(['a','iframe','embed','object']):
                    v=tag.get('href') or tag.get('src') or tag.get('data')
                    if v:
                      h=urljoin(u,html.unescape(v))
                      if '.pdf' in h.lower() or '/upload/' in h.lower(): pdfs.append(h)
                  for m in re.finditer(r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',text,re.I): pdfs.append(html.unescape(m.group(0)).replace('\\/','/'))
                  rec={'id':aid,'lang':lang,'url':u,'title':ttl,'pdfs':sorted(set(pdfs)),'status':r.status_code}
                  matches.append(rec)
                  Path(f'out/article_{aid}_{lang}.html').write_text(text,encoding='utf-8')
                time.sleep(.03)
              except Exception:
                pass
          verified=[]
          for rec in matches:
            for p in rec['pdfs']:
              try:
                r=s.get(p,timeout=(20,120),allow_redirects=True)
                item={**rec,'pdf_url':p,'pdf_status':r.status_code,'pdf_final':r.url,'bytes':len(r.content),'is_pdf':r.content[:5]==b'%PDF-'}
                verified.append(item)
                if item['is_pdf']:
                  Path(f"out/{rec['id']}_{rec['lang']}.pdf").write_bytes(r.content)
              except Exception as e: verified.append({**rec,'pdf_url':p,'error':repr(e)})
          Path('out/result.json').write_text(json.dumps({'matches':matches,'verified':verified},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'matches':matches,'verified':verified},ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cmbi-haizhi-august-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
