name: Temporary Fast Resolve Melco Report IDs

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-fast-melco-report-ids.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query exact Eastmoney date windows and public index pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html, json, re, time
          from pathlib import Path
          import requests

          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9'})
          dates=['2024-08-16','2025-04-28','2025-05-09','2025-08-01','2025-11-08','2026-04-20']
          results=[]
          def is_melco(x):
            b=json.dumps(x,ensure_ascii=False).lower()
            return any(k.lower() in b for k in ['新濠国际发展','新濠國際發展','melco international','00200.hk','"00200"'])
          for date in dates:
            for q in ['0','1','2','3','4']:
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':date,'endTime':date,'pageNo':'1','fields':'','qType':q,'orgCode':'','author':'','code':'','rcode':'','_':str(int(time.time()*1000))}
              for attempt in range(3):
                try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=30)
                  item={'mode':'get','date':date,'q':q,'status':r.status_code,'url':r.url,'bytes':len(r.content),'head':r.text[:300]}
                  if r.ok:
                    try:
                      payload=r.json(); rows=payload.get('data') or []
                      item['row_count']=len(rows); item['matches']=[x for x in rows if is_melco(x)]
                    except Exception as e:item['json_error']=repr(e)
                  results.append(item);break
                except Exception as e:
                  if attempt==2:results.append({'mode':'get','date':date,'q':q,'error':repr(e)})
                  time.sleep(1+attempt)
            payload={'industryCode':'*','pageSize':500,'industry':'*','rating':'*','ratingChange':'*','beginTime':date,'endTime':date,'pageNo':1,'fields':'','qType':0,'orgCode':'','author':'','code':'','rcode':''}
            for mode in ['json','form']:
              try:
                kw={'json':payload} if mode=='json' else {'data':payload}
                r=s.post('https://reportapi.eastmoney.com/report/list2',timeout=30,**kw)
                item={'mode':'list2_'+mode,'date':date,'status':r.status_code,'url':r.url,'bytes':len(r.content),'head':r.text[:500]}
                if r.ok:
                  try:
                    obj=r.json(); rows=[]
                    if isinstance(obj.get('data'),list):rows=obj['data']
                    elif isinstance(obj.get('data'),dict):
                      for k in ['dataList','list','rows']:
                        if isinstance(obj['data'].get(k),list):rows=obj['data'][k];break
                    item['row_count']=len(rows); item['matches']=[x for x in rows if is_melco(x)]
                  except Exception as e:item['json_error']=repr(e)
                results.append(item)
              except Exception as e:results.append({'mode':'list2_'+mode,'date':date,'error':repr(e)})
          pages=['https://www.360why.com/bg/0b1188000059015.html','https://www.360why.com/bg/c2ab29000082458.html','https://finance.sina.com.cn/tob/2024-08-16/doc-incivrqz7354878.shtml']
          page_results=[]
          for u in pages:
            try:
              r=s.get(u,timeout=30); text=html.unescape(r.text).replace('\\/','/')
              patterns={
                'info_codes':sorted(set(re.findall(r'AP20\d{16,}',text))),
                'pdf_urls':sorted(set(re.findall(r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',text,re.I))),
                'all_asset_urls':[x for x in sorted(set(re.findall(r'https?://[^"\'<>\s]+',text))) if any(k in x.lower() for k in ['pdf','download','oss','file','attach'])][:300]
              }
              snippets=[]
              for needle in ['AP20','pdf.dfcfw','新濠国际','华泰证券','东吴证券','download','fileUrl']:
                for m in list(re.finditer(re.escape(needle),text,re.I))[:30]:snippets.append(re.sub(r'\s+',' ',text[max(0,m.start()-500):m.start()+1800]))
              page_results.append({'url':u,'status':r.status_code,'bytes':len(r.content),**patterns,'snippets':snippets[:100]})
            except Exception as e:page_results.append({'url':u,'error':repr(e)})
          out={'api_results':results,'page_results':page_results}
          Path('out').mkdir(exist_ok=True)
          Path('out/melco_fast_ids.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          matches=[]
          for x in results:matches+=x.get('matches',[])
          print('MATCHES='+json.dumps(matches,ensure_ascii=False),flush=True)
          print('PAGE_CODES='+json.dumps([{'url':x.get('url'),'info_codes':x.get('info_codes'),'pdf_urls':x.get('pdf_urls')} for x in page_results],ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: melco-fast-report-ids
          path: out/melco_fast_ids.json
          retention-days: 3
