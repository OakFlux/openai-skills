name: Resolve Yuheng Report Links From Calendar

on:
  push:
    branches:
      - tmp-yuheng-002437-broker-reports-20261004

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - name: Query stock calendar and related APIs
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, re
          from pathlib import Path
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/stockcalendar/002437.html'})
          out=Path('calendar_probe'); out.mkdir(exist_ok=True)
          base='https://datacenter-web.eastmoney.com/api/data/v1/get'
          variants=[
            {'reportName':'RPT_STOCKCALENDAR','columns':'ALL','filter':'(SECURITY_CODE="002437")','pageSize':'500','pageNumber':'1','sortColumns':'TRADE_DATE','sortTypes':'-1','source':'WEB','client':'WEB'},
            {'reportName':'RPT_STOCKCALENDAR','columns':'ALL','filter':'(SECURITY_CODE="002437")','pageSize':'500','pageNumber':'1','sortColumns':'START_DATE','sortTypes':'-1','source':'WEB','client':'WEB'},
            {'reportName':'RPT_STOCKCALENDAR','columns':'ALL','filter':'(SECURITY_CODE="002437")','pageSize':'500','pageNumber':'1','source':'WEB','client':'WEB'},
          ]
          results=[]
          for i,p in enumerate(variants):
            try:
              r=s.get(base,params=p,timeout=40)
              rec={'variant':i,'url':r.url,'status':r.status_code,'ctype':r.headers.get('content-type'),'text_head':r.text[:500]}
              try: rec['json']=r.json()
              except Exception: pass
              results.append(rec)
            except Exception as e: results.append({'variant':i,'error':repr(e)})
          (out/'calendar_raw.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          matches=[]
          def walk(o,path='$'):
            if isinstance(o,dict):
              blob=' '.join(str(v) for v in o.values() if isinstance(v,(str,int,float)))
              if any(k in blob for k in ('双核心业务筑牢基本盘','产品管线丰富，业绩逐渐回暖','2025-12-11','2024-12-30','2024-12-29','誉衡药业')):
                matches.append({'path':path,'record':o})
              for k,v in o.items(): walk(v,path+'.'+str(k))
            elif isinstance(o,list):
              for j,v in enumerate(o): walk(v,path+f'[{j}]')
          for rec in results:
            if 'json' in rec: walk(rec['json'])
          # deduplicate records
          seen=set(); unique=[]
          for x in matches:
            key=json.dumps(x['record'],ensure_ascii=False,sort_keys=True,default=str)
            if key not in seen:
              seen.add(key); unique.append(x)
          (out/'calendar_matches.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT',len(unique))
          for x in unique[:100]: print(json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Yuheng-Stockcalendar-Report-Links
          path: calendar_probe/*.json
          retention-days: 3
