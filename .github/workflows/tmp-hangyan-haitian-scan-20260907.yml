name: Scan Hangyan for Haitian International reports
on:
  push:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Scan listing pages
        run: |
          python - <<'PY'
          import concurrent.futures,json,requests
          from bs4 import BeautifulSoup
          pages=list(range(650,1051))
          terms=('海天国际','全球注塑机龙头','制造业产能再分布','升级扩产双轮驱动')
          def fetch(n):
            try:
              r=requests.get('https://www.hangyan.co/reports',params={'page':n},headers={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'},timeout=45)
              if r.status_code!=200: return n,[],f'HTTP {r.status_code}'
              soup=BeautifulSoup(r.text,'html.parser'); hits=[]
              for a in soup.select('a[data-controller="protected-link"]'):
                title=a.get_text(' ',strip=True)
                if any(t in title for t in terms):
                  box=a.find_parent('div',class_=lambda c:c and 'box' in c.split())
                  meta=box.get_text(' ',strip=True) if box else title
                  hits.append({'page':n,'title':title,'meta':meta,'token':a.get('data-protected-link-token-value','')})
              return n,hits,None
            except Exception as e: return n,[],repr(e)
          allhits=[]; errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for n,hits,err in pool.map(fetch,pages):
              if hits:
                allhits.extend(hits); print('HIT',json.dumps(hits,ensure_ascii=False))
              if err: errors.append((n,err))
          print('TOTAL',len(allhits),'ERRORS',len(errors),errors[:20])
          print(json.dumps(allhits,ensure_ascii=False,indent=2))
          if not allhits: raise SystemExit('No Haitian International reports found')
          PY
