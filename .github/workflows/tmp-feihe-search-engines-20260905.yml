name: Temporary China Feihe public PDF search

on:
  push:
    branches:
      - tmp-china-feihe-broker-reports-20260905

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search public indexes
        run: |
          python -m pip install requests beautifulsoup4 lxml
          cat > /tmp/search_pdfs.py <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from urllib.parse import quote, parse_qs, urlparse, unquote
          import requests
          from bs4 import BeautifulSoup

          queries = [
            '"千帆过尽，鹤鸣九皋" pdf',
            '"经营反转周期正展开" pdf',
            '"品质引领高端驱动，优质资产价值重塑" pdf',
            '"进击的国产奶粉龙头，护城河持续加深" pdf',
            '"龙头地位稳固，经营拐点已现" 中国飞鹤 pdf',
            '"市场整合的主要受益者" 中国飞鹤 pdf',
            '"需求复苏、困境反转，我国奶粉龙头再起航" pdf',
            '中国飞鹤 06186 深度研究报告 pdf',
            'China Feihe 6186 equity research pdf',
            'site:pdf.dfcfw.com 中国飞鹤',
            'site:dwzq.com.cn 中国飞鹤 06186',
            'site:research.bocomgroup.com 中国飞鹤',
            'site:htisec.com China Feihe 6186 report',
            'site:cmschina.com.hk China Feihe 6186 research',
            'site:china-inv.cn China Feihe research pdf',
          ]
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })
          out=[]

          def clean_url(u):
            u=html.unescape(u)
            if u.startswith('//'): u='https:'+u
            if 'bing.com/ck/a' in u:
              q=parse_qs(urlparse(u).query)
              if 'u' in q:
                v=q['u'][0]
                if v.startswith('a1'):
                  import base64
                  try: u=base64.b64decode(v[2:]+'===').decode('utf-8','ignore')
                  except: pass
            if u.startswith('/url?'):
              q=parse_qs(urlparse(u).query); u=q.get('q',[u])[0]
            return unquote(u)

          for q in queries:
            print('\n### QUERY',q)
            record={'query':q,'results':[]}
            engines=[
              ('bing','https://www.bing.com/search?q='+quote(q)+'&count=50'),
              ('duck','https://html.duckduckgo.com/html/?q='+quote(q)),
              ('baidu','https://www.baidu.com/s?wd='+quote(q)+'&rn=50'),
              ('sogou','https://www.sogou.com/web?query='+quote(q)+'&num=50'),
            ]
            for eng,url in engines:
              try:
                r=s.get(url,timeout=45,allow_redirects=True)
                print('ENGINE',eng,r.status_code,len(r.content),r.url)
                soup=BeautifulSoup(r.text,'lxml')
                found=[]
                for a in soup.find_all('a',href=True):
                  href=clean_url(a['href'])
                  text=' '.join(a.get_text(' ',strip=True).split())
                  if not href.startswith('http'): continue
                  if any(x in href for x in ['bing.com/search','duckduckgo.com','baidu.com/s?','sogou.com/web']): continue
                  blob=(href+' '+text).lower()
                  if any(k in blob for k in ['飞鹤','feihe','06186','6186','千帆过尽','经营反转','品质引领','奶粉龙头','困境反转','pdf','report']):
                    item={'engine':eng,'url':href,'text':text[:300]}
                    if item not in found: found.append(item)
                for item in found[:100]:
                  record['results'].append(item); print('RESULT',eng,item['text'][:160],item['url'])
              except Exception as exc:
                print('ENGINE_ERROR',eng,repr(exc))
              time.sleep(0.5)
            out.append(record)
          open('search-results.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          python /tmp/search_pdfs.py

      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: feihe-public-pdf-search-results
          path: search-results.json
          retention-days: 1
