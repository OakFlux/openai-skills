name: Package Rendu Bio Public Broker Report

on:
  push:
    branches:
      - tmp-rendu-688193-broker-reports-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pypdf pymupdf

      - name: Download, verify and package report
        shell: bash
        run: |
          cat > /tmp/package_rendu_report.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import pymupdf
          import requests
          from pypdf import PdfReader

          STOCK = "688193"
          COMPANY = "仁度生物"
          OUT = Path("output")
          FINAL = OUT / "final"
          RENDERS = OUT / "renders"
          for p in (OUT, FINAL, RENDERS):
              p.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
              "Accept": "application/json,text/plain,text/html,application/pdf,*/*",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Referer": "https://data.eastmoney.com/report/",
          })

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          params = {
              "industryCode": "*", "pageSize": "100", "industry": "*",
              "rating": "*", "ratingChange": "*", "beginTime": "2018-01-01",
              "endTime": "2030-12-31", "pageNo": "1", "fields": "",
              "qType": "0", "orgCode": "", "code": STOCK, "rcode": "",
              "p": "1", "pageNum": "1", "pageNumber": "1",
          }
          r = session.get("https://reportapi.eastmoney.com/report/list", params=params, timeout=60)
          r.raise_for_status()
          rows = (r.json() or {}).get("data") or []
          if not rows:
              raise RuntimeError("No broker report metadata found")
          row = rows[0]
          title = str(row.get("title") or "新股专题覆盖：仁度生物（2022年第18期）").strip()
          org = str(row.get("orgSName") or row.get("orgName") or "华金证券").strip()
          date = str(row.get("publishDate") or row.get("publishTime") or "2022-03-11")[:10]
          analyst = str(row.get("researcher") or row.get("researcherName") or "").strip()
          info_code = str(row.get("infoCode") or row.get("encodeUrl") or "").strip()
          if not info_code:
              raise RuntimeError("Missing infoCode")

          filename = "01_华金证券_2022-03-11_新股专题覆盖_仁度生物_2022年第18期.pdf"
          pdf_path = FINAL / filename
          urls = [
              f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
              f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
              f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf?download=1",
          ]
          used_url = None
          last_error = None
          for url in urls:
              for attempt in range(3):
                  try:
                      with session.get(url, timeout=90, stream=True, allow_redirects=True) as resp:
                          resp.raise_for_status()
                          with pdf_path.open("wb") as f:
                              for chunk in resp.iter_content(1024 * 256):
                                  if chunk:
                                      f.write(chunk)
                      if pdf_path.stat().st_size < 50_000:
                          raise RuntimeError(f"file too small: {pdf_path.stat().st_size}")
                      with pdf_path.open("rb") as f:
                          if f.read(5) != b"%PDF-":
                              raise RuntimeError("not PDF")
                      used_url = url
                      break
                  except Exception as exc:
                      last_error = exc
                      pdf_path.unlink(missing_ok=True)
                      time.sleep(1 + attempt)
              if used_url:
                  break
          if not used_url:
              raise RuntimeError(f"Download failed: {last_error}")

          reader = PdfReader(str(pdf_path), strict=False)
          pages = len(reader.pages)
          if pages < 3:
              raise RuntimeError(f"Unexpected page count: {pages}")
          doc = pymupdf.open(pdf_path)
          if doc.page_count != pages:
              raise RuntimeError("Page count mismatch")
          text = ""
          for idx in range(min(9, pages)):
              text += "\n" + doc.load_page(idx).get_text("text")
          compact = re.sub(r"\s+", "", text)
          if COMPANY not in compact and STOCK not in compact:
              raise RuntimeError("Company identity not found")
          render_dir = RENDERS / "report"
          render_dir.mkdir(parents=True, exist_ok=True)
          for idx in sorted(set([0, pages // 2, pages - 1])):
              pix = doc.load_page(idx).get_pixmap(matrix=pymupdf.Matrix(1.0, 1.0), alpha=False)
              png = render_dir / f"page-{idx + 1:03d}.png"
              pix.save(png)
              if png.stat().st_size < 4_000:
                  raise RuntimeError(f"Suspicious render page {idx + 1}")
          doc.close()

          pdf_sha = sha256(pdf_path)
          record = {
              "filename": filename,
              "company": COMPANY,
              "stock_code": STOCK,
              "title": title,
              "institution": org,
              "analyst": analyst,
              "date": date,
              "type": "新股专题覆盖报告",
              "pages": pages,
              "size_bytes": pdf_path.stat().st_size,
              "info_code": info_code,
              "download_url": used_url,
              "sha256": pdf_sha,
          }
          readme = f'''# 仁度生物（688193）券商研究报告原始PDF

整理时间：{datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}

## 收录文件

- 机构：{org}
- 日期：{date}
- 标题：{title}
- 类型：新股专题覆盖报告
- 页数：{pages}
- 文件：`{filename}`
- SHA-256：`{pdf_sha}`

## 检索说明

公开个股研报数据库中可直接下载并核验的仁度生物券商公司报告仅此1份。未使用行业周报、媒体文章、公司公告、招股说明书或重新排版材料补足为2-3份。
'''
          (FINAL / "README_文件清单与检索说明.md").write_text(readme, encoding="utf-8")
          (FINAL / "manifest.json").write_text(json.dumps([record], ensure_ascii=False, indent=2), encoding="utf-8")
          (FINAL / "SHA256SUMS.txt").write_text(f"{pdf_sha}  {filename}\n", encoding="utf-8")

          zip_cn = OUT / "仁度生物_688193_券商研究报告_原始PDF_1份_20261006.zip"
          zip_en = OUT / "Rendu_Bio_688193_Broker_Research_Original_PDF_1_20261006.zip"
          for zp in (zip_cn, zip_en):
              with zipfile.ZipFile(zp, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
                  for p in sorted(FINAL.iterdir()):
                      zf.write(p, arcname=p.name)
              with zipfile.ZipFile(zp) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f"ZIP CRC failure: {bad}")

          summary = {
              "report_count": 1,
              "report": record,
              "zip_cn": str(zip_cn),
              "zip_cn_size": zip_cn.stat().st_size,
              "zip_cn_sha256": sha256(zip_cn),
              "zip_en": str(zip_en),
              "zip_en_size": zip_en.stat().st_size,
              "zip_en_sha256": sha256(zip_en),
          }
          (OUT / "package_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/package_rendu_report.py

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Rendu-688193-Public-Broker-Report
          path: |
            output/*.zip
            output/package_summary.json
          if-no-files-found: error
          retention-days: 3
