name: Package Rendu Bio Broker Reports

on:
  push:
    branches:
      - tmp-rendu-688193-broker-reports-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pypdf pymupdf beautifulsoup4

      - name: Discover, download, verify and package reports
        shell: bash
        run: |
          cat > /tmp/build_rendu_reports.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any
          from urllib.parse import urljoin

          import pymupdf
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          STOCK = "688193"
          COMPANY = "仁度生物"
          FULL_COMPANY = "上海仁度生物科技股份有限公司"
          ALIASES = (COMPANY, FULL_COMPANY, STOCK)

          OUT = Path("output")
          CAND = OUT / "candidates"
          SELECTED = OUT / "selected"
          RENDERS = OUT / "renders"
          for p in (OUT, CAND, SELECTED, RENDERS):
              p.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
              "Accept": "application/json,text/plain,text/html,application/pdf,*/*",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Referer": "https://data.eastmoney.com/report/",
          })

          logs: list[str] = []
          def log(msg: str) -> None:
              print(msg, flush=True)
              logs.append(msg)

          def safe_name(value: str, limit: int = 110) -> str:
              value = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", value or "")
              value = re.sub(r"\s+", "_", value).strip(" ._")
              return (value or "report")[:limit]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def parse_json_response(resp: requests.Response):
              text = resp.text.strip()
              try:
                  return resp.json()
              except Exception:
                  match = re.search(r"^[^(]*\((.*)\)\s*;?$", text, re.S)
                  if not match:
                      raise
                  return json.loads(match.group(1))

          def query_eastmoney() -> list[dict[str, Any]]:
              rows: list[dict[str, Any]] = []
              endpoint = "https://reportapi.eastmoney.com/report/list"
              for qtype in ("0", "1"):
                  for page in range(1, 11):
                      params = {
                          "industryCode": "*",
                          "pageSize": "100",
                          "industry": "*",
                          "rating": "*",
                          "ratingChange": "*",
                          "beginTime": "2018-01-01",
                          "endTime": "2030-12-31",
                          "pageNo": str(page),
                          "fields": "",
                          "qType": qtype,
                          "orgCode": "",
                          "code": STOCK,
                          "rcode": "",
                          "p": str(page),
                          "pageNum": str(page),
                          "pageNumber": str(page),
                      }
                      try:
                          r = session.get(endpoint, params=params, timeout=60)
                          r.raise_for_status()
                          data = parse_json_response(r)
                      except Exception as exc:
                          log(f"GET API qType={qtype} page={page} failed: {exc}")
                          break
                      page_rows = (data or {}).get("data") or (data or {}).get("result") or []
                      if isinstance(page_rows, str):
                          try:
                              page_rows = json.loads(page_rows)
                          except Exception:
                              page_rows = []
                      if not page_rows:
                          break
                      rows.extend(page_rows)
                      log(f"GET API qType={qtype} page={page}: {len(page_rows)} rows")
                      if len(page_rows) < 100:
                          break
                      time.sleep(0.2)

              endpoint2 = "https://reportapi.eastmoney.com/report/list2"
              for qtype in ("0", "1"):
                  for page in range(1, 11):
                      payload = {
                          "pageSize": 100,
                          "pageNo": page,
                          "p": page,
                          "pageNum": page,
                          "pageNumber": page,
                          "beginTime": "2018-01-01",
                          "endTime": "2030-12-31",
                          "code": STOCK,
                          "industryCode": "*",
                          "rating": None,
                          "ratingChange": None,
                          "orgCode": None,
                          "rcode": "",
                          "qType": qtype,
                      }
                      data = None
                      errors = []
                      for mode in ("json", "form"):
                          try:
                              if mode == "json":
                                  r = session.post(endpoint2, json=payload, timeout=60)
                              else:
                                  r = session.post(endpoint2, data=payload, timeout=60)
                              r.raise_for_status()
                              data = parse_json_response(r)
                              if isinstance(data, dict):
                                  break
                          except Exception as exc:
                              errors.append(f"{mode}:{exc}")
                      if not isinstance(data, dict):
                          log(f"POST API qType={qtype} page={page} failed: {errors}")
                          break
                      page_rows = data.get("data") or data.get("result") or []
                      if isinstance(page_rows, str):
                          try:
                              page_rows = json.loads(page_rows)
                          except Exception:
                              page_rows = []
                      if not page_rows:
                          break
                      rows.extend(page_rows)
                      log(f"POST API qType={qtype} page={page}: {len(page_rows)} rows")
                      if len(page_rows) < 100:
                          break
                      time.sleep(0.2)

              dedup: dict[str, dict[str, Any]] = {}
              for row in rows:
                  key = str(row.get("infoCode") or row.get("encodeUrl") or row.get("title") or "")
                  if key:
                      dedup[key] = row
              result = list(dedup.values())
              (OUT / "eastmoney_metadata.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              log(f"Eastmoney unique records: {len(result)}")
              return result

          def scrape_sina() -> list[dict[str, Any]]:
              records: list[dict[str, Any]] = []
              for symbol in ("sh688193", "688193"):
                  for page in range(1, 11):
                      url = (
                          "https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/"
                          f"index.phtml?symbol={symbol}&t1=all&p={page}"
                      )
                      try:
                          r = session.get(url, timeout=45)
                          r.raise_for_status()
                          r.encoding = r.apparent_encoding or "gb18030"
                          soup = BeautifulSoup(r.text, "html.parser")
                      except Exception as exc:
                          log(f"Sina list {symbol} page {page} failed: {exc}")
                          break
                      found = 0
                      for a in soup.find_all("a", href=True):
                          href = urljoin(url, a["href"])
                          title = " ".join(a.get_text(" ", strip=True).split())
                          if "vReport_Show" not in href:
                              continue
                          match = re.search(r"/rptid/(\d+)/", href)
                          if not match:
                              continue
                          records.append({"rptid": match.group(1), "title": title, "detail_url": href})
                          found += 1
                      if found == 0:
                          break
              dedup = {item["rptid"]: item for item in records}
              result = list(dedup.values())
              (OUT / "sina_index.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              log(f"Sina unique records: {len(result)}")
              return result

          def normalize_record(row: dict[str, Any]) -> dict[str, Any]:
              return {
                  "title": str(row.get("title") or row.get("reportTitle") or "").strip(),
                  "org": str(row.get("orgSName") or row.get("orgName") or row.get("orgNameCn") or "").strip(),
                  "date": str(row.get("publishDate") or row.get("publishTime") or "").strip()[:10],
                  "analyst": str(row.get("researcher") or row.get("researcherName") or row.get("author") or "").strip(),
                  "info_code": str(row.get("infoCode") or row.get("encodeUrl") or "").strip(),
                  "pages_meta": int(row.get("attachPages") or row.get("pageCount") or 0),
              }

          def pdf_urls(rec: dict[str, Any], row: dict[str, Any]) -> list[str]:
              urls: list[str] = []
              for value in row.values():
                  if isinstance(value, str) and value.startswith(("http://", "https://")) and ".pdf" in value.lower():
                      urls.append(value)
              code = rec["info_code"]
              if code:
                  urls.extend([
                      f"https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf",
                      f"https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf",
                      f"https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?download=1",
                      f"https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf?download=1",
                  ])
              return list(dict.fromkeys(urls))

          def download_pdf(urls: list[str], destination: Path) -> str | None:
              for url in urls:
                  for attempt in range(3):
                      try:
                          with session.get(url, timeout=90, stream=True, allow_redirects=True) as r:
                              r.raise_for_status()
                              with destination.open("wb") as f:
                                  for chunk in r.iter_content(1024 * 256):
                                      if chunk:
                                          f.write(chunk)
                          if destination.stat().st_size < 50_000:
                              raise RuntimeError(f"file too small: {destination.stat().st_size}")
                          with destination.open("rb") as f:
                              if f.read(5) != b"%PDF-":
                                  raise RuntimeError("not a PDF")
                          return url
                      except Exception as exc:
                          destination.unlink(missing_ok=True)
                          if attempt == 2:
                              log(f"Download failed {url}: {exc}")
                          time.sleep(1 + attempt)
              return None

          def validate(path: Path) -> tuple[bool, int, str]:
              try:
                  reader = PdfReader(str(path), strict=False)
                  pages = len(reader.pages)
                  if pages < 3:
                      return False, pages, "too few pages"
                  doc = pymupdf.open(path)
                  if doc.page_count != pages:
                      return False, pages, "page count mismatch"
                  text = ""
                  for idx in range(min(12, pages)):
                      try:
                          text += "\n" + doc.load_page(idx).get_text("text")
                      except Exception:
                          pass
                  compact = re.sub(r"\s+", "", text)
                  if not any(alias in compact for alias in ALIASES):
                      return False, pages, "company identity not found"
                  render_dir = RENDERS / path.stem
                  render_dir.mkdir(parents=True, exist_ok=True)
                  for idx in sorted(set([0, pages // 2, pages - 1])):
                      pix = doc.load_page(idx).get_pixmap(matrix=pymupdf.Matrix(1.0, 1.0), alpha=False)
                      out = render_dir / f"page-{idx + 1:03d}.png"
                      pix.save(out)
                      if out.stat().st_size < 4_000:
                          return False, pages, f"render too small page {idx + 1}"
                  doc.close()
                  return True, pages, ""
              except Exception as exc:
                  return False, 0, f"{type(exc).__name__}: {exc}"

          def score(rec: dict[str, Any]) -> float:
              title = rec.get("title", "")
              pages = int(rec.get("pages", rec.get("pages_meta", 0)) or 0)
              date = rec.get("date", "")
              s = min(pages, 70) * 3.0
              if "公司深度" in title: s += 700
              if "深度报告" in title or "深度研究" in title: s += 650
              if "首次覆盖" in title: s += 600
              if "投资价值" in title: s += 500
              if "新股" in title and pages >= 10: s += 250
              if "公司研究" in title: s += 180
              if "调研报告" in title: s += 120
              if any(word in title for word in ("点评", "快报", "季报", "年报")) and pages <= 8:
                  s -= 250
              if date.startswith(("2026", "2025", "2024")): s += 35
              elif date.startswith(("2023", "2022")): s += 25
              return s

          metadata = query_eastmoney()
          sina = scrape_sina()
          downloaded: list[dict[str, Any]] = []

          for row in metadata:
              rec = normalize_record(row)
              if not rec["title"] or not rec["info_code"]:
                  continue
              title_blob = f"{rec['title']} {rec.get('org', '')}"
              if COMPANY not in title_blob and FULL_COMPANY not in title_blob:
                  # Eastmoney records are filtered by code, so keep rows even when title omits company name.
                  pass
              destination = CAND / f"{safe_name(rec['info_code'])}.pdf"
              used = download_pdf(pdf_urls(rec, row), destination)
              if not used:
                  continue
              ok, pages, reason = validate(destination)
              if not ok:
                  log(f"Rejected {rec['info_code']} {rec['title']}: {reason}")
                  destination.unlink(missing_ok=True)
                  continue
              rec.update({
                  "pages": pages,
                  "size_bytes": destination.stat().st_size,
                  "sha256": sha256(destination),
                  "download_url": used,
                  "path": str(destination),
                  "source": "东方财富研报数据库",
              })
              downloaded.append(rec)
              log(f"Accepted {rec['date']} {rec['org']} {rec['title']} [{pages}p]")

          # Inspect Sina detail pages for historical PDFs not present in Eastmoney.
          for item in sina:
              title = item.get("title") or ""
              if COMPANY not in title and STOCK not in title and not any(k in title for k in ("深度", "首次覆盖", "新股")):
                  continue
              try:
                  r = session.get(item["detail_url"], timeout=45)
                  r.raise_for_status()
                  r.encoding = r.apparent_encoding or "gb18030"
                  html = r.text
                  candidates = re.findall(r"https?://[^\"'<>\s]+\.pdf(?:\?[^\"'<>\s]*)?", html, re.I)
                  soup = BeautifulSoup(html, "html.parser")
                  for a in soup.find_all("a", href=True):
                      href = urljoin(item["detail_url"], a["href"])
                      if ".pdf" in href.lower():
                          candidates.append(href)
                  for j, url in enumerate(dict.fromkeys(candidates)):
                      destination = CAND / f"sina_{item['rptid']}_{j}.pdf"
                      used = download_pdf([url], destination)
                      if not used:
                          continue
                      ok, pages, reason = validate(destination)
                      if not ok:
                          destination.unlink(missing_ok=True)
                          continue
                      rec = {
                          "title": title or f"仁度生物研究报告 {item['rptid']}",
                          "org": "新浪研报页所列机构",
                          "date": "",
                          "analyst": "",
                          "info_code": f"SINA-{item['rptid']}",
                          "pages_meta": pages,
                          "pages": pages,
                          "size_bytes": destination.stat().st_size,
                          "sha256": sha256(destination),
                          "download_url": used,
                          "path": str(destination),
                          "source": "新浪财经研报页",
                      }
                      downloaded.append(rec)
                      log(f"Accepted Sina {title} [{pages}p]")
                      break
              except Exception as exc:
                  log(f"Sina detail failed {item.get('detail_url')}: {exc}")

          # Dedupe exact files and report metadata.
          unique: list[dict[str, Any]] = []
          seen_sha: set[str] = set()
          seen_key: set[tuple[str, str, str]] = set()
          for rec in downloaded:
              key = (rec.get("date", ""), rec.get("org", ""), rec.get("title", ""))
              if rec["sha256"] in seen_sha or key in seen_key:
                  continue
              seen_sha.add(rec["sha256"])
              seen_key.add(key)
              unique.append(rec)
          downloaded = unique
          downloaded.sort(key=score, reverse=True)
          (OUT / "downloaded_candidates.json").write_text(
              json.dumps(downloaded, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          selected: list[dict[str, Any]] = []
          # First pass: substantive company reports.
          for rec in downloaded:
              title = rec.get("title", "")
              pages = int(rec.get("pages", 0))
              if pages >= 12 or any(k in title for k in ("深度", "首次覆盖", "投资价值", "新股")):
                  selected.append(rec)
              if len(selected) >= 3:
                  break
          # Second pass: valid company reports if fewer than requested.
          for rec in downloaded:
              if len(selected) >= 3:
                  break
              if rec not in selected:
                  selected.append(rec)

          if len(selected) < 2:
              raise RuntimeError(f"Only {len(selected)} valid broker reports found; metadata={len(metadata)}, downloaded={len(downloaded)}")

          selected = selected[:3]
          manifest: list[dict[str, Any]] = []
          readme = [
              "# 仁度生物（688193）券商研究报告原始PDF",
              "",
              f"整理时间：{datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}",
              f"报告数量：{len(selected)}",
              "",
              "筛选原则：优先收录公司深度、首次覆盖、投资价值或长篇新股研究报告。",
              "所有文件均为公开渠道直接下载的原始PDF；未用网页摘要、公司公告或重新排版文件补足数量。",
              "",
          ]

          for idx, rec in enumerate(selected, 1):
              filename = (
                  f"{idx:02d}_{safe_name(rec.get('org') or '券商', 28)}_"
                  f"{safe_name(rec.get('date') or '日期待核', 12)}_"
                  f"{safe_name(rec.get('title') or '仁度生物研究报告', 90)}.pdf"
              )
              src = Path(rec["path"])
              dst = SELECTED / filename
              dst.write_bytes(src.read_bytes())
              item = {k: v for k, v in rec.items() if k != "path"}
              item["package_filename"] = filename
              item["sha256"] = sha256(dst)
              item["size_bytes"] = dst.stat().st_size
              manifest.append(item)
              readme += [
                  f"## {idx}. {rec.get('title')}",
                  f"- 机构：{rec.get('org') or '待核'}",
                  f"- 日期：{rec.get('date') or '待核'}",
                  f"- 页数：{rec.get('pages')}",
                  f"- 文件：`{filename}`",
                  f"- 原始PDF：{rec.get('download_url')}",
                  f"- SHA-256：`{item['sha256']}`",
                  "",
              ]

          (SELECTED / "README_文件清单与来源.md").write_text("\n".join(readme), encoding="utf-8")
          (SELECTED / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          (SELECTED / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['package_filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_cn = OUT / f"仁度生物_688193_券商深度报告_原始PDF_{len(manifest)}份_20261006.zip"
          zip_en = OUT / f"Rendu_Bio_688193_Broker_Deep_Reports_Original_PDFs_{len(manifest)}_20261006.zip"
          for zp in (zip_cn, zip_en):
              with zipfile.ZipFile(zp, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
                  for path in sorted(SELECTED.iterdir()):
                      zf.write(path, arcname=path.name)
              with zipfile.ZipFile(zp) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f"ZIP CRC failure: {bad}")
              log(f"Created {zp.name}: {zp.stat().st_size} bytes; SHA256={sha256(zp)}")

          summary = {
              "company": COMPANY,
              "stock_code": STOCK,
              "report_count": len(manifest),
              "reports": manifest,
              "zip_cn": str(zip_cn),
              "zip_cn_size": zip_cn.stat().st_size,
              "zip_cn_sha256": sha256(zip_cn),
              "zip_en": str(zip_en),
              "zip_en_size": zip_en.stat().st_size,
              "zip_en_sha256": sha256(zip_en),
              "eastmoney_metadata_count": len(metadata),
              "downloaded_candidate_count": len(downloaded),
          }
          (OUT / "package_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT / "run.log").write_text("\n".join(logs), encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/build_rendu_reports.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Rendu-688193-Broker-Deep-Reports
          path: |
            output/*.zip
            output/package_summary.json
            output/run.log
            output/eastmoney_metadata.json
            output/downloaded_candidates.json
            output/sina_index.json
          if-no-files-found: error
          retention-days: 3
