name: Kebaier SGPJBG Probe

on:
  push:
    branches:
      - chatgpt-kebaier-broker-reports-20261004
    paths:
      - .github/workflows/kebaier_sgpjbg_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Probe topic and search pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://www.sgpjbg.com/zhuanti/beikeruanjianbaogao.html',
            'https://www.sgpjbg.com/search.html?q=%E7%A7%91%E6%8B%9C%E5%B0%94',
            'https://www.sgpjbg.com/search?keyword=%E7%A7%91%E6%8B%9C%E5%B0%94',
          ]
          all_matches=[]
          for url in urls:
              try:
                  r=s.get(url,timeout=60,allow_redirects=True)
                  r.encoding=r.apparent_encoding or 'utf-8'
                  print('PAGE',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.encoding)
                  Path=None
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.find_all('a',href=True):
                      text=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      blob=text+' '+href
                      if '科拜尔' in blob or '178' in href or '241021' in blob:
                          rec={'source':url,'text':text,'href':href}
                          all_matches.append(rec)
                          print('MATCH',json.dumps(rec,ensure_ascii=False))
                  for m in re.finditer(r'科拜尔',r.text):
                      print('SNIP',r.text[max(0,m.start()-1000):m.start()+2000])
              except Exception as e:
                  print('ERROR',url,repr(e))
          open('output/matches.json','w',encoding='utf-8').write(json.dumps(all_matches,ensure_ascii=False,indent=2))
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: kebaier-sgpjbg-probe
          path: output/matches.json
          retention-days: 1
