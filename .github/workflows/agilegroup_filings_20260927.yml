name: Agile Group Official Filings Package

on:
  push:
    branches:
      - chatgpt-agilegroup-filings-20260927
    paths:
      - .github/workflows/agilegroup_filings_20260927.yml
      - scripts/build_agilegroup_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_agilegroup_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: agilegroup-official-filings-package
          path: |
            output/雅居乐集团_2020-2025年报_2026年中期报告.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
