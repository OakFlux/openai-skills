name: Fast discovery for Huabao International broker reports

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-international-fast-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query report API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fast_discovery
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          api='https://api.sdyanbao.com/api/file/search'
          keywords=['华宝国际','华宝国际 00336','国泰海通 华宝国际','信达证券 华宝国际','国联民生 华宝国际']
          found={}
          logs=[]
          for kw in keywords:
            for only_title in (1,0):
              for page in (1,2):
                body={'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,'page':page,'pageSize':100,'keyword':kw,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
                req=urllib.request.Request(api,data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
                try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                    payload=json.loads(r.read().decode())
                  rows=(payload.get('data') or {}).get('files') or []
                  total=int((payload.get('data') or {}).get('total') or 0)
                  logs.append({'keyword':kw,'only_title':only_title,'page':page,'rows':len(rows),'total':total})
                  print('QUERY',kw,only_title,page,len(rows),total,flush=True)
                except Exception as e:
                  logs.append({'keyword':kw,'only_title':only_title,'page':page,'error':repr(e)})
                  print('FAIL',kw,only_title,page,repr(e),flush=True)
                  continue
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                  if any(t in blob for t in ('华宝国际','華寶國際','huabaointernational','00336.hk','00336')):
                    found[str(x.get('id'))]=x
                if not rows or page*100>=total: break
          out=[]
          for x in found.values():
            out.append({'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),'page_url':x.get('page_url'),'share_url':x.get('share_url'),'organization':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),'type':(x.get('type') or {}).get('name'),'stock':x.get('stock'),'data_source':x.get('data_source'),'data_source_uuid':x.get('data_source_uuid')})
          out.sort(key=lambda x:(x.get('date') or '',x.get('page_count') or 0),reverse=True)
          Path('fast_discovery/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('fast_discovery/query_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULTS',json.dumps(out,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-international-fast-discovery
          path: fast_discovery/
          retention-days: 3
