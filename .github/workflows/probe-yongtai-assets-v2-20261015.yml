name: Probe Yongtai report assets v2

on:
  pull_request:
    paths:
      - 'tasks/yongtai-002326-report-assets-v2.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.parse, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/','Accept':'text/html,application/json,image/avif,image/webp,image/png,image/jpeg,*/*'})
          ids=['3393203','2870690','3880235']
          for did in ids:
            r=s.get(f'https://www.fxbaogao.com/detail/{did}',timeout=60)
            print('DETAIL',did,r.status_code,len(r.content),r.url,flush=True)
            text=r.text
            for pat in ['report-image','coverPrefix','pdfPath','pageNum',did,'preview','imageUrl','imgUrl']:
              hits=[]
              for m in list(re.finditer(pat,text,re.I))[:50]: hits.append(text[max(0,m.start()-300):min(len(text),m.end()+700)])
              if hits: print('HITS',did,pat,json.dumps(hits,ensure_ascii=False),flush=True)
            scripts=[]
            for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)',text,re.I): scripts.append(urllib.parse.urljoin(r.url,m.group(1)))
            print('SCRIPTS',did,json.dumps(list(dict.fromkeys(scripts)),ensure_ascii=False),flush=True)
            for su in list(dict.fromkeys(scripts)):
              try:
                sr=s.get(su,timeout=60)
                if sr.status_code!=200: continue
                st=sr.text; sh=[]
                for pat in ['report-image','coverPrefix','preview','imageUrl','imgUrl','pdfPath']:
                  for m in list(re.finditer(pat,st,re.I))[:20]: sh.append(st[max(0,m.start()-220):min(len(st),m.end()+500)])
                if sh: print('SCRIPT_HITS',did,su,json.dumps(sh,ensure_ascii=False),flush=True)
              except Exception: pass

          ep='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          bodies=[{'keywords':'构建产业链一体化 打造业绩新曲线','pageNum':1,'pageSize':20,'order':1},{'stockCodes':['002326'],'pageNum':1,'pageSize':100,'order':1}]
          for body in bodies:
            rr=s.post(ep,json=body,headers={'Content-Type':'application/json','Origin':'https://www.fxbaogao.com'},timeout=60)
            print('API',rr.status_code,len(rr.content),rr.text[:300],flush=True)
            if rr.status_code==200:
              try:
                rows=((rr.json().get('data') or {}).get('dataList') or [])
                for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if '永太科技' in blob or any(x in blob for x in ids): print('ROW',blob,flush=True)
              except Exception as e: print('API_ERR',repr(e),flush=True)

          prefix='report-image/2022/09/29/3393203'
          bases=['https://public.fxbaogao.com/','https://dr.fxbaogao.com/','https://report.fxbaogao.com/','https://oss-buy.hufangde.com/','https://static.fxbaogao.com/']
          suffixes=[]
          for n in [0,1,2,3,4,10,20,30]:
            suffixes += [f'/{n}.jpg',f'/{n}.jpeg',f'/{n}.png',f'/{n}.webp',f'-{n}.jpg',f'-{n}.png',f'_{n}.jpg',f'_{n}.png',f'/{n:03d}.jpg',f'/{n:03d}.png',f'/{n}',f'-{n}']
          for base in bases:
            for suf in suffixes:
              u=base+prefix+suf
              try:
                rr=s.get(u,timeout=(6,15),allow_redirects=True); ct=rr.headers.get('content-type','')
                if rr.status_code==200 or len(rr.content)>1000: print('PROBE',rr.status_code,len(rr.content),ct,u,'FINAL',rr.url,'PFX',rr.content[:12].hex(),flush=True)
              except Exception: pass
          PY
