name: Fast Mingguan package rerun v3

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/mingguan-package-rerun-v3-20261105.txt'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Run patched package script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import textwrap

          path = Path('.github/workflows/mingguan-688560-triggered-package-20261105.yml')
          text = path.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          script = textwrap.dedent(text[start:end])
          script = script.replace(
              '/2021/2021-04/2021-04-23/',
              '/2021/2021-4/2021-04-23/',
          )
          old_q3 = "urls=['https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-29/688560_20261029_97XF.pdf','http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-29/688560_20261029_97XF.pdf','http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-29/12671452.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-29/12671452.PDF']"
          new_q3 = "urls=['http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-29/12671452.PDF','https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-29/12671452.PDF','https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-29/688560_20261029_97XF.pdf','http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-29/688560_20261029_97XF.pdf']"
          script = script.replace(old_q3, new_q3)
          script = script.replace(
              'Retry(total=7,connect=7,read=7,status=7,',
              'Retry(total=2,connect=2,read=2,status=2,',
          )
          script = script.replace('timeout=300,allow_redirects=True', 'timeout=90,allow_redirects=True')
          Path('/tmp/mingguan_package.py').write_text(script, encoding='utf-8')
          subprocess.run([sys.executable, '/tmp/mingguan_package.py'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mingguan-688560-final-package-v3-20261105
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
