name: Package ST Xiwang 000639 broker deep reports 20261020

on:
  push:
    branches:
      - tmp/st-xiwang-000639-broker-package-20261020-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = "000639"
          CURRENT_SHORT = "ST西王"
          REPORT_SHORT = "西王食品"
          FULL = "西王食品股份有限公司"
          PREPARED = "2026-10-20"
          ROOT_NAME = "ST西王_000639_券商深度报告_2份"
          OUTPUT_ZIP = "st_xiwang_000639_broker_deep_reports_2.zip"
          ROOT = Path(ROOT_NAME)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          reports = [
              {
                  "info_code": "AP201902181297566184",
                  "broker": "新时代证券",
                  "date": "2019-02-18",
                  "authors": "孙金钜、任浪",
                  "title": "中小盘首次覆盖报告：运动保健新龙头，大健康航母扬帆起航",
                  "rating": "买入",
                  "metadata_pages": 21,
                  "filename": "01_20190218_新时代证券_首次覆盖_运动保健新龙头大健康航母扬帆起航.pdf",
                  "min_pages": 18,
              },
              {
                  "info_code": "AP201708300838026240",
                  "broker": "中投证券",
                  "date": "2017-08-30",
                  "authors": "张镭、刘思远",
                  "title": "进军大健康领域，新业务打开成长空间",
                  "rating": "买入",
                  "metadata_pages": 13,
                  "filename": "02_20170830_中投证券_进军大健康领域新业务打开成长空间.pdf",
                  "min_pages": 10,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def download_pdf(info_code: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf",
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  "User-Agent": session.headers["User-Agent"],
                                  "Referer": f"https://data.eastmoney.com/report/info/{info_code}.html",
                                  "Accept": "application/pdf,*/*;q=0.8",
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          last = {
                              "url": url,
                              "status": response.status_code,
                              "content_type": response.headers.get("content-type", ""),
                              "bytes": len(response.content),
                              "final_url": response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b"%PDF-" and len(response.content) > 80_000:
                              return response.content, url, last
                      except Exception as exc:
                          last = {"url": url, "error": repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed for {info_code}: {last}")

          manifest: list[dict[str, Any]] = []
          identity_tokens = [REPORT_SHORT, FULL, CODE, "西王"]

          for spec in reports:
              data, pdf_url, download_meta = download_pdf(spec["info_code"])
              path = ROOT / spec["filename"]
              path.write_bytes(data)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < spec["min_pages"]:
                  raise RuntimeError(f"Too few pages for {path.name}: {pages} < {spec['min_pages']}")
              if abs(pages - spec["metadata_pages"]) > 2:
                  raise RuntimeError(f"Page count differs materially for {path.name}: actual={pages}, metadata={spec['metadata_pages']}")

              text = ""
              for page in reader.pages[:min(35, pages)]:
                  try:
                      text += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              compact_text = re.sub(r"\s+", "", text)
              if not any(re.sub(r"\s+", "", token) in compact_text for token in identity_tokens):
                  raise RuntimeError(f"Issuer identity check failed for {path.name}")
              if spec["date"][:4] not in text and spec["date"][:4] not in spec["title"]:
                  # Publication year is not always printed on the report's first pages; metadata page remains the source.
                  pass

              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEW / path.stem
              subprocess.run(
                  [
                      "pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "130",
                      "-singlefile", str(path), str(preview_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(preview_prefix) + ".png")
              if not preview_file.exists() or preview_file.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview rendering failed for {path.name}")

              manifest.append({
                  **spec,
                  "document_form": "券商原始PDF",
                  "actual_pages": pages,
                  "bytes": path.stat().st_size,
                  "sha256": sha256_file(path),
                  "source_page": f"https://data.eastmoney.com/report/info/{spec['info_code']}.html",
                  "pdf_url": pdf_url,
                  "download_meta": download_meta,
                  "preview_file": str(Path("首页预览") / preview_file.name),
              })

          readme = [
              f"ST西王 / 西王食品（{CODE}.SZ）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录2份公开渠道可直接取得的券商原始PDF，优先选择首次覆盖或篇幅较完整的公司研究报告。",
              "由于公司近年券商覆盖较少，本次选取的报告发布时间集中在2017—2019年，适合用于梳理其食用油与运动营养双主业历史逻辑；不代表当前投资结论。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；研究员：{item['authors']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   评级：{item['rating']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['source_page']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company_current_short_name": CURRENT_SHORT,
              "company_report_name": REPORT_SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  "文件名", "文件性质", "券商", "研究员", "发布日期", "标题", "评级",
                  "页数", "字节数", "SHA-256", "来源页面", "PDF地址",
              ])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["document_form"], item["broker"], item["authors"],
                      item["date"], item["title"], item["rating"], item["actual_pages"], item["bytes"],
                      item["sha256"], item["source_page"], item["pdf_url"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path(OUTPUT_ZIP)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": sha256_file(zip_path),
              "report_count": len(manifest),
              "files": [
                  {
                      "name": item["filename"],
                      "broker": item["broker"],
                      "date": item["date"],
                      "title": item["title"],
                      "pages": item["actual_pages"],
                      "bytes": item["bytes"],
                      "sha256": item["sha256"],
                  }
                  for item in manifest
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: st-xiwang-000639-broker-deep-reports-20261020
          path: st_xiwang_000639_broker_deep_reports_2.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
