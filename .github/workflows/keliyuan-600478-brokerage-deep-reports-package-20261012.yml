name: Build Keliyuan 600478 brokerage deep reports package 20261012

on:
  push:
    paths:
      - '.github/workflows/keliyuan-600478-brokerage-deep-reports-package-20261012.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '科力远_600478_券商深度报告精选_2份'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'filename': '01_东亚前海证券_2022-11-18_首次覆盖报告_转型锂电赛道_开启成长新征程.pdf',
                  'broker': '东亚前海证券',
                  'date': '2022-11-18',
                  'title': '转型锂电赛道、开启成长新征程',
                  'authors': '李子卓',
                  'rating': '增持',
                  'classification': '公司首次覆盖报告',
                  'info_code': 'AP202211181580379991',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202211181580379991_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP202211181580379991_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H4_AP202211181580379991_1.pdf',
                  ],
                  'expected_pages': 29,
                  'min_pages': 27,
                  'min_bytes': 3_000_000,
                  'required_terms': ['科力远', '转型锂电赛道'],
              },
              {
                  'filename': '02_宏源证券_2013-10-15_公司深度报告_专心做电池_承载中国梦.pdf',
                  'broker': '宏源证券',
                  'date': '2013-10-15',
                  'title': '专心做电池，承载中国梦',
                  'authors': '王凤华、邓锐',
                  'rating': '买入',
                  'classification': '公司深度报告',
                  'info_code': 'AP201310160004507943',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201310160004507943_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP201310160004507943_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H4_AP201310160004507943_1.pdf',
                  ],
                  'expected_pages': 26,
                  'min_pages': 24,
                  'min_bytes': 1_000_000,
                  'required_terms': ['科力远', '专心做电池'],
              },
          ]

          def download(report: dict, destination: Path) -> str:
              errors: list[str] = []
              for url in report['urls']:
                  for attempt in range(1, 4):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 600),
                          ) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = temp.stat().st_size
                          with temp.open('rb') as fh:
                              header = fh.read(8)
                          if size < report['min_bytes'] or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, header={header!r}')
                          temp.replace(destination)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f"download failed for {destination.name}: {errors}")

          records: list[dict] = []
          hashes: set[str] = set()

          for report in reports:
              destination = OUT / report['filename']
              source_url = download(report, destination)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'page count too small for {destination.name}: {pages}')
              if abs(pages - report['expected_pages']) > 2:
                  raise RuntimeError(f'unexpected page count for {destination.name}: {pages}, expected around {report["expected_pages"]}')

              first_page_text = ''
              try:
                  first_page_text = (reader.pages[0].extract_text() or '').replace('\x00', ' ')
              except Exception:
                  first_page_text = ''
              compact_text = ''.join(first_page_text.split())
              missing_terms = [term for term in report['required_terms'] if ''.join(term.split()) not in compact_text]
              if missing_terms:
                  raise RuntimeError(f'first page identity check failed for {destination.name}: missing {missing_terms}')
              print('FIRST_PAGE_TEXT', destination.name, first_page_text[:1800].replace('\n', ' | '), flush=True)

              qpdf = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  capture_output=True,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf validation failed for {destination.name}: {qpdf.stderr[-2000:]}')

              render_root = OUT / (destination.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(destination), str(render_root)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed for {destination.name}: {render.stderr[-1000:]}')
              render_size = render_file.stat().st_size
              render_file.unlink(missing_ok=True)

              data = destination.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              hashes.add(sha256)

              record = {
                  'filename': destination.name,
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'rating': report['rating'],
                  'classification': report['classification'],
                  'info_code': report['info_code'],
                  'detail_url': f"https://data.eastmoney.com/report/info/{report['info_code']}.html",
                  'source_pdf_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '湖南科力远新能源股份有限公司（科力远，600478.SH）券商深度报告精选',
              '整理日期：2026-10-12',
              '',
              '筛选说明：公开渠道中能够直接下载并完整核验的科力远长篇公司深度报告数量有限。本包收录一份2022年锂电转型首次覆盖报告和一份2013年镍氢动力电池公司深度报告，均为券商原始排版完整PDF；未使用短篇业绩点评或网页摘要补足数量。',
              '来源：东方财富研究报告公开文件服务器。',
              '全部PDF均完成文件头、文件大小、页数、首页文本身份核验、qpdf结构、首页渲染、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['broker']}，{record['date']}，{record['pages']}页",
                  f"   类型：{record['classification']}",
                  f"   标题：{record['title']}",
                  f"   分析师：{record['authors']}；评级：{record['rating']}",
                  f"   文件：{record['filename']}",
                  f"   PDF来源：{record['source_pdf_url']}",
                  f"   信息代码：{record['info_code']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'expected 2 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: keliyuan-600478-brokerage-deep-reports-20261012
          path: 科力远_600478_券商深度报告精选_2份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
