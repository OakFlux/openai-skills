name: Query Jingcheng keyword reports 20261020 v6

on:
  push:
    paths:
      - '.github/workflows/jingcheng-keyword-reports-20261020-v6.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests
      - name: Query keyword endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          for kw in ['京城股份','京城机电股份','北京京城机电股份有限公司','储氢瓶','氢气瓶']:
            for qt in ['0','1','2']:
              for page in range(1,6):
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2026-10-20','pageNo':str(page),'fields':'','qType':qt,'orgCode':'','author':'','code':'','rcode':'','keyword':kw,'p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                r=s.get(endpoint,params=p,timeout=60)
                print('QUERY',kw,qt,page,r.status_code,len(r.content),r.url)
                if r.status_code!=200:
                  print('ERR',r.text[:500]);break
                payload=r.json(); data=payload.get('data') or []
                if isinstance(data,dict): data=data.get('list') or data.get('data') or []
                print('COUNT',len(data) if isinstance(data,list) else 'NONLIST')
                if not isinstance(data,list) or not data: break
                for row in data:
                  print('ROW',json.dumps({k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName','industryCode']},ensure_ascii=False))
                if len(data)<100: break
          PY
