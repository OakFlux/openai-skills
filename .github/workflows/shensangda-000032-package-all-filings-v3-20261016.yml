name: Package Deep Sanda 000032 all filings v3 20261016
on:
  push:
    paths:
      - '.github/workflows/shensangda-000032-package-all-filings-v3-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Enable legacy announcement attachments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/shensangda_package_20261016.py')
          t = p.read_text(encoding='utf-8')
          old_tuple = 'for x in (3, 2, 1, 4)'
          new_tuple = 'for x in (22, 3, 2, 1, 4)'
          if old_tuple not in t:
              raise SystemExit('legacy tuple patch target not found')
          t = t.replace(old_tuple, new_tuple, 1)
          old_spec = '"art_code": art_code(prospectus_row), "folder": PROSPECTUS_DIR,'
          new_spec = '"art_code": art_code(prospectus_row), "urls": ["https://pdf.dfcfw.com/pdf/H22_AN201202240003353422_1.pdf?1671023552000.pdf"], "folder": PROSPECTUS_DIR,'
          if old_spec not in t:
              raise SystemExit('prospectus patch target not found')
          p.write_text(t.replace(old_spec, new_spec, 1), encoding='utf-8')
          PY
      - name: Build verified archive
        run: python .github/scripts/shensangda_package_20261016.py
      - uses: actions/upload-artifact@v4
        with:
          name: shensangda-000032-all-filings-v3-20261016
          path: |
            深桑达A_000032_上市以来年报_招股说明书及最新季报_截至20261016.zip
            shensangda_000032_all_annual_reports_prospectus_latest_quarter_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
