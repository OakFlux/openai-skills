name: Temporary Pingtan Development exact archive recovery v7

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-wayback-exact-v7.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Probe exact Sina routes and archived captures
        run: |
          mkdir -p out/pages out/pdfs
          python - <<'PY'
          import hashlib, html, json, re, time, zipfile
          from pathlib import Path
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          O=Path('out'); H=O/'pages'; P=O/'pdfs'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          reports=[
            ('440149918114','2013-12-12','国海证券','中福实业(000592)深度报告：乘平潭开发东风 2014年进入增长快车道'),
            ('376416689327','2011-12-05','中信建投证券','中福实业(000592)调研深度：主业稳健发展 借力平潭特区'),
            ('375349674203','2011-11-23','宏源证券','中福实业(000592)：依托林业资产 分享平潭政策红利'),
            ('459957262560','2014-07-29','海通证券','平潭发展(000592)调研报告：受益平潭实验区的两市唯一投资标的'),
            ('458824274591','2014-07-16','宏源证券','平潭发展(000592)：建设两岸家园 共享自由港繁荣'),
            ('448703281041','2014-03-21','国泰君安证券','中福实业(000592)“X+1”主题推荐系列报告：扎根两岸家园 兑现业绩高成长'),
            ('412188889452','2013-01-22','宏源证券','中福实业(000592)调研报告：平潭全面建设助力公司业绩反转'),
          ]
          logs=[]; probes=[]; captures=[]; pdfs=[]; seen_hash=set(); visited=set()
          def note(*a):
            x=' '.join(str(v) for v in a); print(x,flush=True); logs.append(x)
          def decode(r):
            for enc in [r.apparent_encoding,r.encoding,'gb18030','utf-8']:
              if not enc:continue
              try:return r.content.decode(enc,'replace')
              except:pass
            return r.content.decode('utf-8','replace')
          def clean(x,n=100):return re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x or '')).strip(' ._')[:n] or 'report'
          def save_pdf(content,meta,url):
            if len(content)<1500 or not content.lstrip().startswith(b'%PDF'):return False
            h=hashlib.sha256(content).hexdigest()
            if h in seen_hash:return True
            seen_hash.add(h); tmp=P/f'_tmp_{h[:12]}.pdf';tmp.write_bytes(content)
            try:
              rd=PdfReader(str(tmp));pages=len(rd.pages);text=''
              for pg in rd.pages[:8]:
                try:text+='\n'+(pg.extract_text() or '')
                except:pass
            except Exception as e:
              note('BADPDF',url,repr(e));tmp.unlink(missing_ok=True);return False
            identity=any(k in text for k in ['平潭发展','中福实业','福建中福','000592'])
            fn=f"{meta['date']}_{clean(meta['org'],35)}_{clean(meta['title'],95)}_{pages}页.pdf"
            dst=P/fn
            if dst.exists():dst=P/f'{h[:8]}_{fn}'
            tmp.rename(dst)
            pdfs.append({'file':dst.name,'pages':pages,'bytes':len(content),'sha256':h,'identity':identity,'url':url,'text_prefix':text[:1200],**meta})
            note('SAVED',dst.name,'IDENTITY',identity,url);return True
          def extract_links(text,base):
            raw=html.unescape(text).replace('\\/','/')
            links=set(re.findall(r'https?://[^\s"\'<>]+',raw,re.I))
            soup=BeautifulSoup(text,'html.parser')
            for tag in soup.find_all(True):
              for attr in ['href','src','data','value','action','data-url','data-href','data-src','file','fileurl','pdfurl']:
                v=tag.get(attr)
                if isinstance(v,str) and v.strip():links.add(urljoin(base,v.strip()))
            for pat in [
              r'(?:location(?:\.href)?|url|pdfurl|fileurl|downloadurl|sourceurl|reporturl)\s*[:=]\s*["\']([^"\']+)',
              r'["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']']:
              for v in re.findall(pat,raw,re.I):links.add(urljoin(base,v))
            return [html.unescape(x).rstrip('),;') for x in links]

          # Live exact routes: inspect redirects without following, then with following.
          for rid,date,org,title in reports:
            meta={'rid':rid,'date':date,'org':org,'title':title}
            bases=['https://stock.finance.sina.com.cn','https://vip.stock.finance.sina.com.cn','http://stock.finance.sina.com.cn','http://vip.stock.finance.sina.com.cn']
            paths=[]
            for kind in ['search','lastest','company']:
              paths += [
                f'/stock/go.php/vReport_Show/kind/{kind}/rptid/{rid}/index.phtml',
                f'/stock/go.php/vReport_Show/kind/{kind}/rptid/{rid}/url',
                f'/stock/go.php/vReport_Show/kind/{kind}/rptid/{rid}/index.phtml/url',
                f'/q/go.php/vReport_Show/kind/{kind}/rptid/{rid}/index.phtml',
                f'/q/go.php/vReport_Show/kind/{kind}/rptid/{rid}/url',
                f'/q/go.php/vReport_Show/kind/{kind}/rptid/{rid}/index.phtml/url',
              ]
            for u in [b+p for b in bases for p in paths]:
              if u in visited:continue
              visited.add(u)
              try:
                r=s.get(u,timeout=35,allow_redirects=False,headers={'Referer':f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'})
                text='%PDF' if r.content.lstrip().startswith(b'%PDF') else decode(r)
                probes.append({'rid':rid,'requested':u,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'location':r.headers.get('Location'),'prefix':text[:1200]})
                note('LIVE',rid,r.status_code,len(r.content),r.headers.get('content-type'),r.headers.get('Location'),u)
                if save_pdf(r.content,meta,u):continue
                loc=r.headers.get('Location')
                if loc:
                  q=urljoin(u,loc)
                  try:
                    rr=s.get(q,timeout=60,allow_redirects=True,headers={'Referer':u});note('LIVE_FOLLOW',rid,rr.status_code,len(rr.content),rr.url);save_pdf(rr.content,meta,rr.url)
                  except Exception as e:note('LIVE_FOLLOW_ERR',rid,q,repr(e))
              except Exception as e:note('LIVE_ERR',rid,u,repr(e))

          # Internet Archive CDX for exact page, redirect route and wildcard report id.
          for rid,date,org,title in reports:
            meta={'rid':rid,'date':date,'org':org,'title':title}
            patterns=[
              f'stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/*/rptid/{rid}/*',
              f'vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/*/rptid/{rid}/*',
              f'vip.stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/*/rptid/{rid}/*',
              f'*sina.com.cn*{rid}*',
            ]
            rows=[]
            for pat in patterns:
              cdx='https://web.archive.org/cdx/search/cdx?url='+quote(pat,safe='')+'&output=json&fl=timestamp,original,mimetype,statuscode,digest,length,redirect&filter=statuscode:200&collapse=digest&from=2010&to=2026&limit=1000'
              try:
                r=s.get(cdx,timeout=60);note('CDX',rid,r.status_code,len(r.content),pat)
                data=r.json()
                if isinstance(data,list) and len(data)>1:rows.extend(data[1:])
              except Exception as e:note('CDX_ERR',rid,pat,repr(e))
            # Dedupe and prioritize PDFs and /url routes.
            uniq=[];seen=set()
            for row in rows:
              if len(row)<4:continue
              k=(row[0],row[1])
              if k in seen:continue
              seen.add(k);uniq.append(row)
            uniq.sort(key=lambda r:(0 if ('pdf' in str(r[2]).lower() or '.pdf' in str(r[1]).lower() or str(r[1]).lower().endswith('/url')) else 1,r[0]))
            captures.append({'rid':rid,'rows':uniq})
            note('CAPTURES',rid,len(uniq))
            for j,row in enumerate(uniq[:200]):
              ts,orig,mime,status=row[:4]
              urls=[f'https://web.archive.org/web/{ts}id_/{orig}',f'https://web.archive.org/web/{ts}if_/{orig}']
              for au in urls:
                try:
                  q=s.get(au,timeout=75,allow_redirects=True);note('ARCH',rid,q.status_code,len(q.content),q.headers.get('content-type'),q.url)
                  if save_pdf(q.content,meta,q.url):break
                  text=decode(q)
                  if len(text)>100:
                    (H/f'{rid}_{ts}_{j}.html').write_text(text[:1000000],encoding='utf-8',errors='ignore')
                    for link in extract_links(text,orig):
                      low=link.lower()
                      if not any(k in low for k in ['.pdf','download','attach','file','report','rpt']):continue
                      for fu in [f'https://web.archive.org/web/{ts}id_/{link}',link]:
                        try:
                          z=s.get(fu,timeout=75,allow_redirects=True,headers={'Referer':q.url});note('ARCH_LINK',rid,z.status_code,len(z.content),z.url)
                          if save_pdf(z.content,meta,z.url):break
                        except Exception as e:note('ARCH_LINK_ERR',rid,fu,repr(e))
                except Exception as e:note('ARCH_ERR',rid,au,repr(e))
              if len([x for x in pdfs if x['rid']==rid])>=1:break

          (O/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'captures.json').write_text(json.dumps(captures,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          with zipfile.ZipFile(O/'平潭发展_历史研报原始PDF恢复包.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in P.glob('*.pdf'):z.write(f,f.name)
            z.write(O/'pdfs.json','pdfs.json')
          note('DONE','PDFS',len(pdfs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-exact-archive-recovery-v7
          path: out/
          if-no-files-found: error
          retention-days: 3
