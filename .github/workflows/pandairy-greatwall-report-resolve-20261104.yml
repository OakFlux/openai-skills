name: Resolve Great Wall Pandairy report
on:
  push:
    paths: ['.github/workflows/pandairy-greatwall-report-resolve-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect report page
        run: |
          python - <<'PY'
          import html,json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          urls=['https://www.fxbaogao.com/detail/3119953','https://www.fxbaogao.com/api/report/detail/3119953','https://www.fxbaogao.com/report/3119953']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/'})
          for u in urls:
            try:
              r=s.get(u,timeout=90,allow_redirects=True)
              print('FETCH',u,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False),flush=True)
              if r.content.startswith(b'%PDF'):
                print('FOUND_PDF',r.url,len(r.content),flush=True);continue
              text=r.text
              print('HEAD',text[:1000],flush=True)
              soup=BeautifulSoup(text,'html.parser')
              for tag in soup.find_all(['a','iframe','embed','object','script','link','input','meta']):
                blob=' '.join([tag.get_text(' ',strip=True)]+[str(v) for v in tag.attrs.values()])
                if any(k in blob.lower() for k in ('pdf','download','file','3119953','报告')):
                  print('TAG',tag.name,json.dumps({'attrs':dict(tag.attrs),'text':tag.get_text(' ',strip=True)[:300]},ensure_ascii=False),flush=True)
              links=[]
              for pat in [r'https?://[^\"\'<> ]+\.pdf[^\"\'<> ]*',r'https?://[^\"\'<> ]+(?:download|file)[^\"\'<> ]*',r'/[^\"\'<> ]+\.pdf[^\"\'<> ]*',r'/[^\"\'<> ]+(?:download|file)[^\"\'<> ]*']:
                links += re.findall(pat,html.unescape(text),re.I)
              print('LINKS',json.dumps(list(dict.fromkeys(urljoin(r.url,x.rstrip(');,]')) for x in links))[:200],ensure_ascii=False),flush=True)
              idx=max(text.find('受益乳业长期发展'),text.find('熊猫乳品'),text.find('3119953'))
              if idx>=0: print('CONTEXT',text[max(0,idx-4000):idx+8000],flush=True)
            except Exception as e: print('ERR',u,repr(e),flush=True)
          PY
