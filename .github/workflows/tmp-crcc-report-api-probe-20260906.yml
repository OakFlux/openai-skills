name: Probe CRCC Eastmoney report API

on:
  push:
    branches:
      - tmp-crcc-report-api-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query report API
        shell: bash
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import requests

          url = 'https://reportapi.eastmoney.com/report/list'
          params = {
              'industryCode': '*',
              'pageSize': '100',
              'industry': '*',
              'rating': '*',
              'ratingChange': '*',
              'beginTime': '2018-01-01',
              'endTime': '2030-01-01',
              'pageNo': '1',
              'fields': '',
              'qType': '0',
              'orgCode': '',
              'code': '601186',
              'rcode': '',
              'p': '1',
              'pageNum': '1',
              'pageNumber': '1',
          }
          headers = {
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/plain,*/*',
          }
          r = requests.get(url, params=params, headers=headers, timeout=60)
          print('STATUS', r.status_code, r.url, r.headers.get('content-type'), len(r.content))
          print('HEAD', r.text[:500])
          data = r.json()
          print('TOP_KEYS', list(data) if isinstance(data, dict) else type(data))
          records = data.get('data') or data.get('result', {}).get('data') or []
          print('RECORDS', len(records))
          for rec in records:
              print(json.dumps({
                  'publishDate': rec.get('publishDate'),
                  'orgSName': rec.get('orgSName'),
                  'title': rec.get('title'),
                  'infoCode': rec.get('infoCode'),
                  'attachPages': rec.get('attachPages'),
                  'attachSize': rec.get('attachSize'),
                  'reportType': rec.get('reportType'),
                  'emRatingName': rec.get('emRatingName'),
              }, ensure_ascii=False))
          PY
