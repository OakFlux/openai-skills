name: chatgpt-temp-dazhong-public-reports-fast
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-public-reports-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query exact report dates and package full PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf pymupdf pillow
          python <<'PY'
          import hashlib,json,re,time,zipfile
          from pathlib import Path
          import requests,pymupdf
          from PIL import Image,ImageStat
          from pypdf import PdfReader
          W=Path('dazhong_fast');R=W/'大众公用_600635_券商深度报告';P=R/'PDF';Q=W/'qa';P.mkdir(parents=True,exist_ok=True);Q.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          logs=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          def parse(t):
            try:return json.loads(t)
            except:pass
            a=t.find('{');b=t.rfind('}')
            try:return json.loads(t[a:b+1]) if a>=0 and b>a else {}
            except:return {}
          def rows(o):
            x=o.get('data') or []
            if isinstance(x,dict):x=x.get('data') or x.get('list') or []
            return x if isinstance(x,list) else []
          def n(x):return re.sub(r'[\s:：,，。()（）“”"\-—_]+','',str(x or '')).lower()
          targets=[
            ('2023-07-13','2023-07-20','创投增厚利润业绩大幅扭亏'),
            ('2022-12-23','2022-12-31','四大板块多元发展城燃事业乘势增长'),
            ('2022-04-11','2022-04-20','公用事业平稳发展金融创投多领域布局'),
            ('2017-08-25','2017-09-12','投资收益减少导致净利润大幅下滑'),
            ('2017-04-25','2017-05-10','华璨基金迈出第一步优质标的展现实力'),
            ('2016-11-28','2016-12-12','公用事业全面布局金融创投硕果累累')]
          hits=[];seen=set()
          for begin,end,target in targets:
            for q in [0,1,2]:
              for pg in range(1,20):
                p={'cb':'jQuery1124','pageSize':100,'pageNo':pg,'qType':q,'beginTime':begin,'endTime':end,'fields':'','orgCode':'','author':'','industryCode':'*','industry':'*','rating':'','ratingChange':'','rcode':'','_':int(time.time()*1000)}
                rr=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=45);o=parse(rr.text);rs=rows(o)
                L(f'{begin} q={q} p={pg} HTTP={rr.status_code} rows={len(rs)} total={o.get("TotalPage")}')
                for rec in rs:
                  title=rec.get('title') or '';stock=rec.get('stockName') or ''
                  txt=n(title+' '+stock);nt=n(target)
                  if ('大众公用' in txt or '600635' in json.dumps(rec,ensure_ascii=False)) and (nt in txt or nt[:12] in txt):
                    info=rec.get('infoCode')
                    if info and info not in seen:seen.add(info);hits.append(rec);L('HIT '+json.dumps(rec,ensure_ascii=False))
                total=int(o.get('TotalPage') or 1)
                if not rs or pg>=total:break
          (W/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          # sort newest first but ensure 2022 first-coverage remains eligible
          hits.sort(key=lambda r:str(r.get('publishDate') or ''),reverse=True)
          manifest=[]
          for rec in hits:
            if len(manifest)>=3:break
            info=rec.get('infoCode');title=rec.get('title') or '大众公用研究报告';org=rec.get('orgSName') or rec.get('orgName') or '券商';dt=str(rec.get('publishDate') or '')[:10]
            data=None;url=None
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf']:
              x=s.get(u,headers={'Referer':'https://data.eastmoney.com/'},timeout=180,allow_redirects=True);L(f'PDF {info} HTTP={x.status_code} bytes={len(x.content)} {x.url}')
              if x.status_code==200 and x.content.startswith(b'%PDF-') and len(x.content)>80000:data=x.content;url=x.url;break
            if not data:continue
            fn=re.sub(r'[\\/:*?"<>|]+','_',f'{dt}_{org}_大众公用_{title}')[:190]+'.pdf';fp=P/fn;fp.write_bytes(data)
            try:
              pc=len(PdfReader(str(fp),strict=False).pages)
              if pc<3:raise ValueError(pc)
              doc=pymupdf.open(str(fp));text=''.join(doc[i].get_text() for i in range(min(3,doc.page_count)))
              if '大众公用' not in text and '600635' not in text and '01635' not in text:raise ValueError('identity')
              checks=[]
              for i,suf in [(0,'first'),(pc-1,'last')]:
                pix=doc[i].get_pixmap(matrix=pymupdf.Matrix(1.2,1.2),alpha=False);png=Q/(fp.stem+'_'+suf+'.png');pix.save(str(png));sd=ImageStat.Stat(Image.open(png).convert('L').resize((64,64))).stddev[0]
                if sd<1:raise ValueError('blank');checks.append({'page':i+1,'stddev':sd})
              doc.close()
            except Exception as e:L(f'REJECT {fn} {e!r}');fp.unlink(missing_ok=True);continue
            manifest.append({'filename':fn,'title':title,'institution':org,'date':dt,'pages':pc,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_url':url,'info_code':info,'render_checks':checks})
          if len(manifest)<2:raise RuntimeError(f'Only {len(manifest)} valid PDFs from {len(hits)} hits')
          (R/'文件说明.txt').write_text('大众公用券商深度报告\n\n'+'\n'.join(f"{i}. {x['filename']} | {x['pages']}页" for i,x in enumerate(manifest,1))+'\n',encoding='utf-8')
          (R/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (R/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  PDF/{x['filename']}" for x in manifest)+'\n',encoding='utf-8')
          z=W/f'大众公用_600635_01635_券商深度报告_{len(manifest)}份.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for f in R.rglob('*'):
              if f.is_file():zz.write(f,arcname=str(R.name/f.relative_to(R)))
          with zipfile.ZipFile(z) as zz:
            bad=zz.testzip();assert not bad;assert len([x for x in zz.namelist() if x.endswith('.pdf')])==len(manifest)
          meta={'filename':z.name,'size_bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'reports':manifest}
          (W/'meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          print('FINAL '+json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Public-Utilities-Brokerage-Reports-Fast
          path: |
            dazhong_fast/大众公用_600635_01635_券商深度报告_*.zip
            dazhong_fast/meta.json
            dazhong_fast/hits.json
            dazhong_fast/run.log
          retention-days: 1
          compression-level: 0
