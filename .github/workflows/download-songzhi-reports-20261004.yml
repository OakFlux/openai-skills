name: Download Songzhi broker research reports

on:
  push:
    paths:
      - '.github/workflows/download-songzhi-reports-20261004.yml'
  workflow_dispatch:

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download reports and build package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile

          root = pathlib.Path('dist')
          package = root / '松芝股份_002454_券商研究报告_2份'
          package.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'filename': '01_太平洋证券_2021-03-28_公司研究报告.pdf',
                  'title': '20年业绩维持稳定，21年看好客车行业复苏机会',
                  'broker': '太平洋证券',
                  'date': '2021-03-28',
                  'type': '公司研究报告',
                  'analysts': '白宇、赵水平',
                  'rating': '买入（维持）',
                  'pages': 5,
                  'info_url': 'https://data.eastmoney.com/report/info/AP202103291477991755.html',
                  'pdf_url': 'https://pdf.dfcfw.com/pdf/H3_AP202103291477991755_1.pdf',
              },
              {
                  'filename': '02_太平洋证券_2023-11-01_2023Q3点评.pdf',
                  'title': '松芝股份2023Q3点评：新能源车客户多点布局，商转乘放量进行时',
                  'broker': '太平洋证券',
                  'date': '2023-11-01',
                  'type': '公司点评报告',
                  'analysts': '文姬',
                  'rating': '买入（维持）',
                  'pages': 5,
                  'info_url': 'https://data.eastmoney.com/report/info/AP202311021607920831.html',
                  'pdf_url': 'https://pdf.dfcfw.com/pdf/H3_AP202311021607920831_1.pdf',
              },
          ]

          def download(url: str, dest: pathlib.Path) -> None:
              last_error = None
              for attempt in range(1, 5):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36',
                              'Referer': 'https://data.eastmoney.com/',
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read()
                      if not data.startswith(b'%PDF'):
                          raise RuntimeError(f'not a PDF; first bytes={data[:20]!r}')
                      if len(data) < 50_000:
                          raise RuntimeError(f'PDF unexpectedly small: {len(data)} bytes')
                      dest.write_bytes(data)
                      return
                  except Exception as exc:
                      last_error = exc
                      time.sleep(attempt * 2)
              raise RuntimeError(f'failed to download {url}: {last_error}')

          manifest = []
          sha_lines = []
          for report in reports:
              path = package / report['filename']
              download(report['pdf_url'], path)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              size = path.stat().st_size
              item = dict(report)
              item.update({'sha256': digest, 'bytes': size})
              manifest.append(item)
              sha_lines.append(f"{digest}  {report['filename']}")

          readme = '''# 松芝股份（002454.SZ）券商研究报告\n\n本资料包收录 2 份可公开获取的完整公司研究 PDF。由于松芝股份公开券商覆盖较少，本包不使用网页摘要、行情快讯或无关行业报告凑数。两份材料均为 5 页公司研究/点评报告，并非 20—40 页的长篇首次覆盖报告。\n\n## 文件清单\n\n1. 太平洋证券，2021-03-28，《20年业绩维持稳定，21年看好客车行业复苏机会》；公司研究报告；分析师：白宇、赵水平；评级：买入（维持）。\n2. 太平洋证券，2023-11-01，《松芝股份2023Q3点评：新能源车客户多点布局，商转乘放量进行时》；公司点评报告；分析师：文姬；评级：买入（维持）。\n\n## 来源与完整性\n\n每份报告的详情页、原始 PDF 地址、文件大小和 SHA-256 校验值见 `manifest.json`；校验值另见 `SHA256SUMS.txt`。材料仅供研究参考，不构成投资建议。\n'''
          (package / 'README.md').write_text(readme, encoding='utf-8')
          (package / 'manifest.json').write_text(
              json.dumps({'company': '松芝股份', 'ticker': '002454.SZ', 'reports': manifest}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          (package / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          zip_path = root / '松芝股份_002454_券商研究报告_2份.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(package.rglob('*')):
                  if path.is_file():
                      zf.write(path, arcname=f'{package.name}/{path.relative_to(package)}')

          print(json.dumps({'zip': str(zip_path), 'reports': manifest}, ensure_ascii=False, indent=2))
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: songzhi-broker-research-artifact
          path: dist/
          if-no-files-found: error
          retention-days: 7
