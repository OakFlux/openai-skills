name: Inspect Chengxing archive PDF links

on:
  push:
    paths:
      - '.github/workflows/chengxing-600078-pdf-link-inspection-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Inspect pages, scripts, API calls and candidate files
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          s=requests.Session()
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=.7,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})

          targets=[
            'https://www.hibor.com.cn/docdetail_96264.html',
            'https://www.fxbaogao.com/detail/1492879',
            'https://www.fxbaogao.com/view?id=1492879',
            'https://www.fxbaogao.com/report/1492879',
          ]
          script_urls=set()
          for url in targets:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\n=== PAGE',url,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,'CTYPE',r.headers.get('content-type'),'===')
              print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False))
              if r.status_code!=200: continue
              enc=r.apparent_encoding or 'utf-8'
              text=r.content.decode(enc,'replace')
              soup=BeautifulSoup(text,'lxml')
              print('ENC',enc,'TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(['a','script','iframe','embed','object','form','input','button']):
                attrs={k:tag.get(k) for k in ('href','src','data','action','value','name','id','class','type','onclick') if tag.get(k) is not None}
                label=' '.join(tag.get_text(' ',strip=True).split())
                blob=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if tag.name=='script' and attrs.get('src'):
                  script_urls.add(urljoin(r.url,attrs['src']))
                if any(k in blob for k in ('pdf','download','下载','原文','view','doc','report','file','attach','api','1492879','96264')):
                  for k in ('href','src','data','action'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('TAG',tag.name,json.dumps({'label':label[:1000],'attrs':attrs},ensure_ascii=False)[:5000])
              patterns=[
                r'https?://[^\"\'<>\s]+',
                r'(?:pdf|file|download|doc|report|attach|url|src|path|view)[A-Za-z0-9_]*\s*[:=]\s*[\"\']([^\"\']+)[\"\']',
                r'/[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',
                r'/[^\"\'<>\s]*(?:download|view|report|doc)[^\"\'<>\s]*',
              ]
              seen=[]
              for pat in patterns:
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  low=v.lower()
                  if any(k in low for k in ('pdf','download','view','report','doc','file','attach','api','1492879','96264')):
                    if v not in seen: seen.append(v)
              for v in seen[:300]: print('REGEX',v[:3000])
            except Exception as e: print('PAGE_ERROR',url,repr(e))

          print('\nSCRIPT_COUNT',len(script_urls))
          for i,url in enumerate(sorted(script_urls)):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\n=== SCRIPT',i,r.status_code,len(r.content),url,r.url,r.headers.get('content-type'),'===')
              if r.status_code!=200 or len(r.content)>3_000_000: continue
              text=r.content.decode(r.apparent_encoding or 'utf-8','replace')
              hits=[]
              for pat in [
                r'https?://[^\"\'<>\s]+',
                r'(?:pdf|file|download|doc|report|attach|url|src|path|view|api)[A-Za-z0-9_]*\s*[:=]\s*[\"\']([^\"\']+)[\"\']',
                r'/[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',
              ]:
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if any(k in v.lower() for k in ('pdf','download','report','doc','file','attach','api','view')) and v not in hits: hits.append(v)
              for v in hits[:150]: print('SCRIPT_HIT',v[:3000])
            except Exception as e: print('SCRIPT_ERROR',url,repr(e))

          # Probe common archive URL patterns.
          candidates=[
            'https://www.fxbaogao.com/pdf?id=1492879',
            'https://www.fxbaogao.com/download?id=1492879',
            'https://www.fxbaogao.com/api/download?id=1492879',
            'https://www.fxbaogao.com/api/report/download/1492879',
            'https://www.fxbaogao.com/report/download/1492879',
            'https://www.hibor.com.cn/download.aspx?id=96264',
            'https://www.hibor.com.cn/Download/DownloadFile.aspx?id=96264',
            'https://www.hibor.com.cn/DocDownload.aspx?DocID=96264',
            'https://www.hibor.com.cn/docdownload_96264.html',
          ]
          for url in candidates:
            try:
              r=s.get(url,timeout=30,allow_redirects=False)
              print('PROBE',r.status_code,len(r.content),url,'LOC',r.headers.get('location'),'CTYPE',r.headers.get('content-type'),'HEAD',repr(r.content[:24]))
            except Exception as e: print('PROBE_ERROR',url,repr(e))
          PY
