name: Temporary recover historical Goke Micro public PDFs

on:
  push:
    branches: [tmp-goke-old-ap-20260830]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf
      - name: Query public metadata and download surviving original PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          queries = [
            '国科微 存储控制芯片潜力巨大 多领域布局空间广阔',
            '国科微 广播电视与智能监控芯片主流厂商 提前布局固态存储与物联网',
            '国科微 主业高速增长 SSD主控芯片稀缺标的',
            '国科微 技术积累雄厚 固态存储控制器芯片发展迅速',
            '国科微 三季报大超预期 业绩长期增长拐点确立',
          ]
          api='https://api.sdyanbao.com/api/file/search'
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
            'Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'})
          rows=[]; seen=set()
          for q in queries:
            payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
            r=s.post(api,json=payload,timeout=60); print('SEARCH',q,r.status_code,len(r.content)); r.raise_for_status()
            data=(r.json().get('data') or {}); print('TOTAL',data.get('total'))
            for f in data.get('files') or []:
              blob=' '.join([str(f.get('name') or ''),str(f.get('stock') or ''),str(f.get('content') or '')[:800]])
              if '国科微' not in blob and '300672' not in blob: continue
              if f.get('id') in seen: continue
              seen.add(f.get('id')); rows.append(f)
              print('ROW',json.dumps({k:f.get(k) for k in ['id','name','time_text','page_count','file_size','data_source','data_source_uuid','original_id','page_url','share_url']},ensure_ascii=False))

          out=Path('out'); out.mkdir(exist_ok=True)
          found=[]
          for f in rows:
            uuid=str(f.get('data_source_uuid') or '')
            aps=re.findall(r'AP\d+',uuid)
            for ap in aps:
              for prefix in ['H3','H2','H1']:
                url=f'https://pdf.dfcfw.com/pdf/{prefix}_{ap}_1.pdf'
                r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=90,allow_redirects=True)
                print('TEST',f.get('name'),prefix,ap,r.status_code,len(r.content),r.headers.get('content-type'),repr(r.content[:50]))
                if r.status_code!=200 or not r.content.startswith(b'%PDF-') or len(r.content)<100000: continue
                path=out/f"{len(found)+1:02d}_{ap}.pdf"; path.write_bytes(r.content)
                reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
                text=''
                for pg in reader.pages[:min(5,pages)]:
                  try:text += pg.extract_text() or ''
                  except Exception:pass
                compact=re.sub(r'\s+','',text)
                if '国科微' not in compact and '300672' not in compact:
                  path.unlink(); continue
                found.append({'name':f.get('name'),'date':f.get('time_text'),'metadata_pages':f.get('page_count'),'pages':pages,'ap':ap,'url':r.url,'path':str(path),'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
                print('FOUND',json.dumps(found[-1],ensure_ascii=False))
                break
          Path('results.json').write_text(json.dumps({'rows':[{'id':f.get('id'),'name':f.get('name'),'date':f.get('time_text'),'pages':f.get('page_count'),'data_source_uuid':f.get('data_source_uuid')} for f in rows],'found':found},ensure_ascii=False,indent=2),encoding='utf-8')
          if found:
            with zipfile.ZipFile('Goke_Micro_Historical_Public_PDFs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for item in found: z.write(item['path'],arcname=Path(item['path']).name)
              z.write('results.json')
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Goke_Micro_Historical_AP_Recovery
          path: |
            results.json
            out/*.pdf
            Goke_Micro_Historical_Public_PDFs.zip
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
