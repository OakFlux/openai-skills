name: Build SIASUN Robot 300024 brokerage reports ZIP 20260928

on:
  push:
    paths:
      - '.github/workflows/siasun-300024-brokerage-reports-package-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download reports, validate and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '机器人_300024_券商深度及公司研究报告精选_3份'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'filename': '01_长城国瑞证券_2017-07-05_国产工业机器人龙头_新签订单大幅增长.pdf',
                  'broker': '长城国瑞证券',
                  'date': '2017-07-05',
                  'title': '国产工业机器人龙头，新签订单大幅增长',
                  'authors': '黄文忠',
                  'info_code': 'AP201707050693499011',
                  'expected_pages': 23,
                  'min_pages': 20,
                  'min_bytes': 500_000,
                  'fallback_urls': [
                      'https://img3.gelonghui.com/pdf201707/pdf20170706173839187.pdf',
                  ],
                  'type': '完整公司深度报告',
              },
              {
                  'filename': '02_中银证券_2023-08-29_半导体装备规模化效应显现_自研机器人核心零部件带来增量利润.pdf',
                  'broker': '中银证券',
                  'date': '2023-08-29',
                  'title': '半导体装备规模化效应显现，自研机器人核心零部件带来增量利润',
                  'authors': '苏凌瑶、茅珈恺、陶波',
                  'info_code': 'AP202308291596600026',
                  'expected_pages': 5,
                  'min_pages': 4,
                  'min_bytes': 200_000,
                  'fallback_urls': [],
                  'type': '重点公司研究报告',
              },
              {
                  'filename': '03_华金证券_2019-03-18_物流与交通业务发力_进军半导体提升自动化集成天花板.pdf',
                  'broker': '华金证券',
                  'date': '2019-03-18',
                  'title': '物流与交通业务发力，进军半导体提升自动化集成天花板',
                  'authors': '范益民',
                  'info_code': 'AP201903181306727324',
                  'expected_pages': 6,
                  'min_pages': 5,
                  'min_bytes': 300_000,
                  'fallback_urls': [],
                  'type': '重点公司研究报告',
              },
          ]

          def candidate_urls(report: dict) -> list[str]:
              code = report['info_code']
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{code}_1.PDF',
              ]
              urls.extend(report.get('fallback_urls', []))
              return list(dict.fromkeys(urls))

          def validate_pdf(path: Path, report: dict) -> tuple[int, str]:
              size = path.stat().st_size
              if size < report['min_bytes']:
                  raise RuntimeError(f'file too small: {size} < {report["min_bytes"]}')
              with path.open('rb') as fh:
                  header = fh.read(8)
              if not header.startswith(b'%PDF-'):
                  raise RuntimeError(f'invalid PDF header: {header!r}')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'page count too small: {pages} < {report["min_pages"]}')
              if abs(pages - report['expected_pages']) > 3:
                  raise RuntimeError(f'unexpected page count: {pages}, expected about {report["expected_pages"]}')

              check = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(path)],
                  capture_output=True,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f'qpdf check failed: {check.stderr[-1600:]}')

              render_root = path.parent / (path.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(path), str(render_root)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed: {render.stderr[-1000:]}')
              note = f'first_page_png_bytes={render_file.stat().st_size}'
              render_file.unlink(missing_ok=True)
              return pages, note

          def download_report(report: dict, destination: Path) -> tuple[str, int, str]:
              errors: list[str] = []
              for url in candidate_urls(report):
                  for attempt in range(1, 4):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          referer = 'https://data.eastmoney.com/' if 'dfcfw.com' in url else 'https://www.gelonghui.com/'
                          with session.get(
                              url,
                              headers={
                                  'Referer': referer,
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 420),
                          ) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          pages, render_note = validate_pdf(temp, report)
                          temp.replace(destination)
                          return str(response.url), pages, render_note
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {destination.name}: {errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()

          for report in reports:
              destination = OUT / report['filename']
              source_url, pages, render_note = download_report(report, destination)
              data = destination.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              seen_hashes.add(sha256)

              record = {
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'report_type': report['type'],
                  'info_code': report['info_code'],
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'render_check': render_note,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '沈阳新松机器人自动化股份有限公司（300024.SZ，证券简称：机器人）券商研究报告精选',
              '整理日期：2026-09-28',
              '',
              '说明：公开可直接获取的长篇公司深度报告较少。本包收录1份完整23页公司深度报告，并补充2份具有代表性的重点公司研究报告，覆盖工业机器人、半导体装备、核心零部件、物流与交通自动化等主题。',
              '资料来源：东方财富研究报告公开文件服务器；2017年报告另设置格隆汇公开PDF镜像作为备用来源。',
              '完整性检查：PDF文件头、文件大小、页数、qpdf结构、首页渲染、SHA-256及ZIP CRC。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['broker']}，{record['date']}，{record['report_type']}",
                  f"   标题：{record['title']}",
                  f"   作者：{record['authors']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   文件：{record['filename']}",
                  f"   来源：{record['source_url']}",
                  f"   信息代码：{record['info_code']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{record['sha256']}  {record['filename']}\n" for record in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise RuntimeError('ZIP CRC failure: ' + bad_file)
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 3:
                  raise RuntimeError(f'expected 3 PDFs, found {len(pdf_names)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: siasun-300024-brokerage-reports-20260928
          path: 机器人_300024_券商深度及公司研究报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
