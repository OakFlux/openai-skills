name: Probe Yongtai report image assets

on:
  pull_request:
    paths:
      - 'tasks/yongtai-002326-report-image-probe-20261015.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Probe report metadata and image assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/','Accept':'text/html,application/json,image/avif,image/webp,image/png,image/jpeg,*/*'})
          ids=['3393203','2870690','3880235']
          for did in ids:
              url=f'https://www.fxbaogao.com/detail/{did}'
              r=s.get(url,timeout=60)
              print('DETAIL',did,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text
              for pat in ['report-image','coverPrefix','pdfPath','pageNum','3393203','2870690','3880235','preview','imageUrl','imgUrl']:
                  snippets=[]
                  for m in list(re.finditer(pat,text,re.I))[:30]: snippets.append(text[max(0,m.start()-250):min(len(text),m.end()+500)])
                  if snippets: print('SNIPS',did,pat,json.dumps(snippets,ensure_ascii=False),flush=True)
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for tag in soup.find_all(True):
                  for attr in ('src','href','data-src','data-url'):
                      v=tag.get(attr)
                      if v:
                          u=urllib.parse.urljoin(r.url,str(v))
                          if any(k in u.lower() for k in ('image','report','preview','cover','pdf')):
                              links.append(u)
              print('LINKS',did,json.dumps(list(dict.fromkeys(links))[:300],ensure_ascii=False),flush=True)

          # query search API for exact metadata
          ep='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          for body in [
              {'keywords':'构建产业链一体化 打造业绩新曲线','pageNum':1,'pageSize':20,'order':1},
              {'keywords':'永太科技','pageNum':1,'pageSize':100,'order':1},
              {'stockCodes':['002326'],'pageNum':1,'pageSize':100,'order':1},
          ]:
              rr=s.post(ep,json=body,headers={'Content-Type':'application/json','Origin':'https://www.fxbaogao.com'},timeout=60)
              print('API',rr.status_code,len(rr.content),json.dumps(body,ensure_ascii=False),rr.text[:200],flush=True)
              if rr.status_code==200:
                  try:
                      j=rr.json(); rows=((j.get('data') or {}).get('dataList') or [])
                      for row in rows:
                          blob=json.dumps(row,ensure_ascii=False)
                          if any(x in blob for x in ids) or '永太科技' in blob or '构建产业链一体化' in blob:
                              print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
                  except Exception as e: print('API_PARSE_ERR',repr(e),flush=True)

          # Probe common image path variants for the deep report.
          prefix='report-image/2022/09/29/3393203'
          bases=['https://public.fxbaogao.com/','https://dr.fxbaogao.com/','https://report.fxbaogao.com/','https://oss-buy.hufangde.com/','https://static.fxbaogao.com/']
          suffixes=[]
          for n in [0,1,2,3,10,20]:
              suffixes += [f'/{n}.jpg',f'/{n}.jpeg',f'/{n}.png',f'/{n}.webp',f'-{n}.jpg',f'-{n}.png',f'_{n}.jpg',f'_{n}.png',f'/{n:03d}.jpg',f'/{n:03d}.png']
          for base in bases:
              for suf in suffixes:
                  u=base+prefix+suf
                  try:
                      rr=s.get(u,timeout=(8,20),allow_redirects=True)
                      ctype=rr.headers.get('content-type','')
                      if rr.status_code==200 or len(rr.content)>1000:
                          print('PROBE',rr.status_code,len(rr.content),ctype,u,'FINAL',rr.url,'PREFIX',rr.content[:12].hex(),flush=True)
                  except Exception as e:
                      pass
          PY
