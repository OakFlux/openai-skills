name: Package validated Loongson official reports v2

on:
  push:
    paths:
      - '.github/workflows/package-loongson-official-reports-v2-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Download, validate, and package official filings
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests

          AS_OF = '2026-10-15'
          COMPANY = '龙芯中科'
          CODE = '688047'
          PACKAGE = f'{COMPANY}_{CODE}_所有年报_招股说明书_最新季报_{AS_OF.replace("-", "")}'
          ROOT = Path(PACKAGE)
          DOCS = ROOT / 'PDF文件'
          VERIFY = ROOT / '验证记录'
          DOCS.mkdir(parents=True, exist_ok=True)
          VERIFY.mkdir(parents=True, exist_ok=True)

          docs: list[dict[str, Any]] = [
              {
                  'kind': '招股说明书',
                  'title': '龙芯中科首次公开发行股票并在科创板上市招股说明书',
                  'disclosure_date': '2022-06-21',
                  'report_year': None,
                  'filename': '01_龙芯中科_首次公开发行股票并在科创板上市招股说明书.pdf',
                  'sse_relative_url': '/disclosure/listedinfo/announcement/c/new/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
                  'cninfo_url': 'https://static.cninfo.com.cn/finalpage/2022-06-21/1213762762.PDF',
                  'eastmoney_art_code': 'AN202206201573510808',
              },
              {
                  'kind': '年度报告',
                  'title': '龙芯中科2022年年度报告',
                  'disclosure_date': '2023-04-26',
                  'report_year': 2022,
                  'filename': '02_龙芯中科_2022年年度报告.pdf',
                  'sse_relative_url': '/disclosure/listedinfo/announcement/c/new/2023-04-26/688047_20230426_QB77.pdf',
                  'cninfo_url': 'https://static.cninfo.com.cn/finalpage/2023-04-26/1216596471.PDF',
              },
              {
                  'kind': '年度报告',
                  'title': '龙芯中科2023年年度报告',
                  'disclosure_date': '2024-04-27',
                  'report_year': 2023,
                  'filename': '03_龙芯中科_2023年年度报告.pdf',
                  'sse_relative_url': '/disclosure/listedinfo/announcement/c/new/2024-04-27/688047_20240427_S07G.pdf',
                  'cninfo_url': 'https://static.cninfo.com.cn/finalpage/2024-04-27/1219882942.PDF',
              },
              {
                  'kind': '年度报告',
                  'title': '龙芯中科2024年年度报告',
                  'disclosure_date': '2025-04-29',
                  'report_year': 2024,
                  'filename': '04_龙芯中科_2024年年度报告.pdf',
                  'sse_relative_url': '/disclosure/listedinfo/announcement/c/new/2025-04-29/688047_20250429_YWG5.pdf',
                  'cninfo_url': 'https://static.cninfo.com.cn/finalpage/2025-04-29/1223391254.PDF',
              },
              {
                  'kind': '年度报告',
                  'title': '龙芯中科2025年年度报告',
                  'disclosure_date': '2026-04-29',
                  'report_year': 2025,
                  'filename': '05_龙芯中科_2025年年度报告.pdf',
                  'sse_relative_url': '/disclosure/listedinfo/announcement/c/new/2026-04-29/688047_20260429_EN5Q.pdf',
                  'cninfo_url': 'https://static.cninfo.com.cn/finalpage/2026-04-29/1225234886.PDF',
              },
              {
                  'kind': '最新季报',
                  'title': '龙芯中科2026年第一季度报告',
                  'disclosure_date': '2026-04-29',
                  'report_year': 2026,
                  'filename': '06_龙芯中科_2026年第一季度报告_最新季报.pdf',
                  'sse_relative_url': '/disclosure/listedinfo/announcement/c/new/2026-04-29/688047_20260429_G5UF.pdf',
                  'cninfo_url': 'https://static.cninfo.com.cn/finalpage/2026-04-29/1225234957.PDF',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          # Cross-check target titles against the current official Shanghai Stock Exchange disclosure API.
          sse_api = 'https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          base_params = {
              'isPagination': 'true',
              'productId': CODE,
              'keyWord': '',
              'securityType': '0101,120100,020100,020200,120200',
              'reportType': 'ALL',
              'beginDate': '2020-01-01',
              'endDate': AS_OF,
              'pageHelp.pageSize': '200',
              'pageHelp.pageNo': '1',
              'pageHelp.beginPage': '1',
              'pageHelp.endPage': '5',
              'pageHelp.cacheSize': '1',
          }

          def fetch_sse_rows(params: dict[str, str]) -> list[dict[str, Any]]:
              response = session.get(
                  sse_api,
                  params=params,
                  headers={
                      'Referer': f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={CODE}',
                      'User-Agent': session.headers['User-Agent'],
                  },
                  timeout=90,
              )
              response.raise_for_status()
              data = response.json()
              rows = data.get('result') or data.get('data') or data.get('pageHelp', {}).get('data') or []
              if isinstance(rows, dict):
                  rows = rows.get('data') or rows.get('list') or []
              if not isinstance(rows, list):
                  raise RuntimeError('Unexpected SSE API response structure')
              return [row for row in rows if isinstance(row, dict)]

          periodic_params = dict(base_params)
          periodic_params['reportType2'] = 'DQBG'
          prospectus_params = dict(base_params)
          prospectus_params.pop('reportType', None)
          prospectus_params['keyWord'] = '招股说明书'
          periodic_rows = fetch_sse_rows(periodic_params)
          prospectus_rows = fetch_sse_rows(prospectus_params)
          sse_rows = periodic_rows + prospectus_rows
          (VERIFY / 'SSE_官方元数据快照.json').write_text(json.dumps(sse_rows, ensure_ascii=False, indent=2), encoding='utf-8')

          official_by_title: dict[str, dict[str, Any]] = {}
          for row in sse_rows:
              title = str(row.get('TITLE') or '')
              if title:
                  old = official_by_title.get(title)
                  if old is None or str(row.get('SSEDATE') or '') >= str(old.get('SSEDATE') or ''):
                      official_by_title[title] = row

          missing_titles = [doc['title'] for doc in docs if doc['title'] not in official_by_title]
          if missing_titles:
              raise RuntimeError(f'Target titles missing from current SSE official API: {missing_titles}')

          annual_years = [doc['report_year'] for doc in docs if doc['kind'] == '年度报告']
          if annual_years != [2022, 2023, 2024, 2025]:
              raise RuntimeError(f'Unexpected annual report years: {annual_years}')

          current_quarters = [
              row for row in periodic_rows
              if str(row.get('BULLETIN_TYPE') or '') in {'第一季度季报', '第三季度季报'}
              and re.fullmatch(r'龙芯中科20\d{2}年第[一三]季度报告', str(row.get('TITLE') or ''))
          ]
          latest_current_quarter = max(current_quarters, key=lambda row: (str(row.get('SSEDATE') or ''), str(row.get('TITLE') or '')))
          if str(latest_current_quarter.get('TITLE') or '') != '龙芯中科2026年第一季度报告':
              raise RuntimeError(f'Latest quarterly report changed: {latest_current_quarter}')

          def candidate_urls(doc: dict[str, Any]) -> list[tuple[str, str]]:
              sse_path = str(doc['sse_relative_url'])
              cninfo = str(doc['cninfo_url'])
              urls = [
                  ('巨潮资讯官方静态文件', cninfo),
                  ('巨潮资讯官方静态文件HTTP', cninfo.replace('https://', 'http://', 1)),
                  ('上交所官方静态文件', 'https://static.sse.com.cn' + sse_path),
                  ('上交所官方网站', 'https://www.sse.com.cn' + sse_path),
              ]
              art_code = doc.get('eastmoney_art_code')
              if art_code:
                  urls.append(('东方财富公告镜像', f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf'))
              return urls

          def download_pdf(doc: dict[str, Any], destination: Path) -> tuple[str, str, dict[str, Any]]:
              attempts: list[dict[str, Any]] = []
              for source_name, url in candidate_urls(doc):
                  for attempt in range(1, 4):
                      headers = {
                          'User-Agent': session.headers['User-Agent'],
                          'Accept': 'application/pdf,text/html;q=0.8,*/*;q=0.5',
                          'Referer': 'https://www.cninfo.com.cn/' if 'cninfo' in url else f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={CODE}',
                      }
                      try:
                          response = session.get(url, headers=headers, timeout=240, allow_redirects=True)
                          content = response.content
                          meta = {
                              'source_name': source_name,
                              'requested_url': url,
                              'final_url': response.url,
                              'status': response.status_code,
                              'content_type': response.headers.get('content-type'),
                              'bytes': len(content),
                              'attempt': attempt,
                          }
                          attempts.append(meta)
                          if response.status_code == 200 and content.startswith(b'%PDF') and len(content) > 50_000:
                              destination.write_bytes(content)
                              meta['all_attempts'] = attempts
                              return source_name, response.url, meta
                      except Exception as exc:
                          attempts.append({'source_name': source_name, 'requested_url': url, 'attempt': attempt, 'error': repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError(f'Failed to download {doc["title"]}: {attempts}')

          records: list[dict[str, Any]] = []
          hashes: set[str] = set()

          for doc in docs:
              destination = DOCS / str(doc['filename'])
              source_name, source_url, download_meta = download_pdf(doc, destination)
              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError(f'Duplicate PDF content: {destination.name}')
              hashes.add(digest)

              qpdf = subprocess.run(['qpdf', '--warning-exit-0', '--check', str(destination)], capture_output=True, text=True)
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf failed for {destination.name}: {qpdf.stderr[-3000:]}')

              pdfinfo = subprocess.run(['pdfinfo', str(destination)], capture_output=True, text=True)
              if pdfinfo.returncode != 0:
                  raise RuntimeError(f'pdfinfo failed for {destination.name}: {pdfinfo.stderr[-2000:]}')
              match = re.search(r'^Pages:\s+(\d+)', pdfinfo.stdout, re.M)
              if not match:
                  raise RuntimeError(f'Could not parse page count for {destination.name}')
              pages = int(match.group(1))
              if pages < 1:
                  raise RuntimeError(f'No pages in {destination.name}')

              text_path = VERIFY / (destination.stem + '_前12页.txt')
              last_page = min(pages, 12)
              text_run = subprocess.run(['pdftotext', '-f', '1', '-l', str(last_page), '-layout', str(destination), str(text_path)], capture_output=True, text=True)
              if text_run.returncode != 0:
                  raise RuntimeError(f'pdftotext failed for {destination.name}: {text_run.stderr[-2000:]}')
              extracted = text_path.read_text(encoding='utf-8', errors='replace')
              compact = re.sub(r'\s+', '', extracted)
              if '龙芯中科' not in compact and '688047' not in compact:
                  raise RuntimeError(f'Company identity check failed for {destination.name}')
              if doc['kind'] == '招股说明书' and '招股说明书' not in compact:
                  raise RuntimeError(f'Prospectus identity check failed for {destination.name}')
              if doc['kind'] == '年度报告':
                  year = str(doc['report_year'])
                  if year not in compact or '年度报告' not in compact:
                      raise RuntimeError(f'Annual report identity check failed for {destination.name}')
              if doc['kind'] == '最新季报' and ('第一季度报告' not in compact and '季度报告' not in compact):
                  raise RuntimeError(f'Quarterly report identity check failed for {destination.name}')

              render_prefix = VERIFY / (destination.stem + '_首页')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(destination), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page rendering failed for {destination.name}: {render.stderr[-1500:]}')
              render_bytes = render_file.stat().st_size
              render_file.unlink()

              official_row = official_by_title[doc['title']]
              official_sse_url = 'https://www.sse.com.cn' + str(official_row.get('URL') or doc['sse_relative_url'])
              record = {
                  'filename': f'PDF文件/{destination.name}',
                  'document_type': doc['kind'],
                  'title': doc['title'],
                  'report_year': doc['report_year'],
                  'disclosure_date': doc['disclosure_date'],
                  'official_sse_metadata_url': official_sse_url,
                  'download_source_name': source_name,
                  'download_source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_bytes,
                  'extracted_text_chars_first_12_pages': len(extracted),
                  'download_attempts': download_meta.get('all_attempts', []),
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '龙芯中科（688047.SH）全部年报、招股说明书及最新季报',
              f'整理日期：{AS_OF}',
              '',
              '本压缩包共收录6份完整PDF：',
              '1. 最终版首次公开发行股票并在科创板上市招股说明书；',
              '2. 上市后全部完整年度报告：2022、2023、2024、2025年；',
              '3. 截至整理日最新正式季度报告：2026年第一季度报告。',
              '',
              '年度报告只收录全文，不收录摘要。2026年第三季度报告截至整理日尚未披露，因此最新正式季报为2026年第一季度报告；2026年半年度报告不按“季报”计入。',
              '文件标题与披露日期已通过上海证券交易所官方公告接口核验。PDF优先从巨潮资讯官方静态披露文件下载，并保留上交所官方元数据链接、下载来源、页数和SHA-256校验值。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, start=1):
              readme.extend([
                  f'{index}. {record["title"]}',
                  f'   文件：{record["filename"]}',
                  f'   披露日期：{record["disclosure_date"]}',
                  f'   页数：{record["pages"]}',
                  f'   下载来源：{record["download_source_name"]}',
                  f'   下载地址：{record["download_source_url"]}',
                  f'   上交所元数据地址：{record["official_sse_metadata_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])

          (ROOT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{PACKAGE}/{path.relative_to(ROOT)}')

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              pdf_entries = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC test failed at {bad}')
              if len(pdf_entries) != 6:
                  raise RuntimeError(f'Expected 6 PDFs in ZIP, found {len(pdf_entries)}')

          final = {
              'filename': zip_path.name,
              'bytes': zip_path.stat().st_size,
              'sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'pdf_count': 6,
              'annual_years': annual_years,
              'latest_quarter': '龙芯中科2026年第一季度报告',
          }
          print('FINAL_PACKAGE', json.dumps(final, ensure_ascii=False), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: loongson-688047-official-reports-final-20261015
          path: 龙芯中科_688047_所有年报_招股说明书_最新季报_20261015.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0