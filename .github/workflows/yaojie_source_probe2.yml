name: Yaojie Source Probe 2

on:
  push:
    branches:
      - chatgpt-yaojie-reports-20260914
    paths:
      - .github/workflows/yaojie_source_probe2.yml

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/inspect.py <<'PY'
          import json, re, hashlib, base64
          from pathlib import Path
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup

          O=Path('out')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          rows=[]

          def get(url, name, referer=None):
              try:
                  h={'Referer':referer} if referer else {}
                  r=s.get(url,timeout=60,allow_redirects=True,headers=h)
                  ct=r.headers.get('content-type','')
                  row={'name':name,'url':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'ct':ct,'head':repr(r.content[:24]),'sha256':hashlib.sha256(r.content).hexdigest()}
                  rows.append(row); print('GET',json.dumps(row,ensure_ascii=False))
                  ext='.html' if ('html' in ct or r.content.lstrip().startswith(b'<')) else '.bin'
                  (O/(name+ext)).write_bytes(r.content)
                  return r
              except Exception as e:
                  row={'name':name,'url':url,'error':repr(e)};rows.append(row);print('ERR',json.dumps(row,ensure_ascii=False));return None

          urls={
            'fx_view_guoyuan':'https://www.fxbaogao.com/view?id=4899187',
            'fx_view_everbright':'https://www.fxbaogao.com/view?id=4899567',
            'fx_m_view_guoyuan':'https://m.fxbaogao.com/view?id=4899187',
            'fx_m_view_everbright':'https://m.fxbaogao.com/view?id=4899567',
            'nxny_5992556':'https://www.nxny.com/report/view_5992556.html',
            'fh_guoyuan':'https://www.fhyanbao.com/rpview/1651802',
            'guoyuan_reports':'https://www.gyzq.com.hk/report.aspx',
            'guoyuan_home':'https://www.gyzq.com.hk/',
            'ctsec_home':'https://www.ctsec.com.hk/',
            'ctsec_search1':'https://www.ctsec.com.hk/Search.aspx?keyword='+quote('药捷安康'),
            'ctsec_search2':'https://www.ctsec.com.hk/News/?keyword='+quote('药捷安康'),
            'eb_research':'https://www.ebshkfg.com/tc/research-overview',
            'eb_research2':'https://www.ebshk.com/tc/research-overview',
          }
          res={}
          for n,u in urls.items(): res[n]=get(u,n)

          # Extract all potentially useful urls and contexts.
          for n,r in res.items():
              if not r or 'html' not in r.headers.get('content-type','') and not r.content.lstrip().startswith(b'<'): continue
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              data={'title':title,'forms':[],'links':[],'assets':[],'contexts':[]}
              for form in soup.find_all('form'):
                  data['forms'].append({'action':urljoin(r.url,form.get('action','')),'method':form.get('method'),'inputs':[{'name':i.get('name'),'id':i.get('id'),'type':i.get('type'),'value':(i.get('value') or '')[:500]} for i in form.find_all('input')]})
              for a in soup.find_all('a',href=True):
                  u=urljoin(r.url,a['href']); t=a.get_text(' ',strip=True)
                  if any(k in (u+t).lower() for k in ['药捷安康','藥捷安康','02617','download','down','pdf','report','research']): data['links'].append({'url':u,'text':t[:300]})
              for tag in soup.find_all(True):
                  for attr in ('src','href','data-src','data-original','content','value'):
                      v=tag.get(attr)
                      if isinstance(v,str) and (v.startswith('http') or v.startswith('/') or v.startswith('//')):
                          u=urljoin(r.url,v)
                          if any(k in u.lower() for k in ['pdf','download','report-image','4899187','4899567','5992556','02617']): data['assets'].append({'tag':tag.name,'attr':attr,'url':u})
              for pat in ['药捷安康','藥捷安康','02617','4899187','4899567','5992556','pdf','download','downurl','fileurl','report-image','__VIEWSTATE','iframe','api']:
                  for m in list(re.finditer(pat,text,re.I))[:100]: data['contexts'].append({'pat':pat,'ctx':text[max(0,m.start()-1000):m.end()+1800]})
              (O/(n+'_parsed.json')).write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
              print('PARSED',n,'title',repr(title),'forms',len(data['forms']),'links',len(data['links']),'assets',len(data['assets']))

          # Probe explicit page image patterns for existence only.
          for rid,date,maxp in [('4899187','2025/06/13',8),('4899567','2025/06/13',8)]:
              for i in range(1,maxp+1):
                  for suffix in ['', '?x-oss-process=image/format,webp']:
                      u=f'https://public.fxbaogao.com/report-image/{date}/{rid}-{i}.png{suffix}'
                      get(u,f'fximg_{rid}_{i}_{"raw" if not suffix else "webp"}',referer=f'https://www.fxbaogao.com/detail/{rid}')

          # Probe likely nxny download routes; no credentials or access-control bypass.
          nxbase='https://www.nxny.com'
          candidates=[
            '/report/down_5992556.html','/report/download_5992556.html','/report/down/5992556.html',
            '/report/download/5992556.html','/report/down?id=5992556','/report/download?id=5992556',
            '/download/report/5992556','/report/view_5992556.pdf','/report/5992556.pdf',
            '/report/download.aspx?id=5992556','/download.aspx?id=5992556','/report/down.aspx?id=5992556'
          ]
          for j,p in enumerate(candidates): get(nxbase+p,f'nx_candidate_{j}',referer=nxbase+'/report/view_5992556.html')

          (O/'records.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/inspect.py

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: yaojie-source-probe2
          path: out
          retention-days: 1
