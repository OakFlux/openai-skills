name: Build Leo Group broker-report package

on:
  push:
    branches: [tmp-leo-broker-reports-20261016]
    paths: ['.github/workflows/tmp-leo-broker-package-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='利欧股份_券商公司研究报告_2份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002131' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 8 "$out" "$out.txt" 2>/dev/null
            grep -Eq '利欧集团股份有限公司|利欧股份' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202011041426387666_1.pdf' \
            "$PACKAGE/01_西南证券_三驾马车齐头并进未来发展值得期待_公司报告_2020-11-04.pdf" \
            15

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202305031586215688_1.pdf' \
            "$PACKAGE/02_东吴证券_外围环境逐步复苏AI技术引领业务升级_业绩点评_2023-05-03.pdf" \
            3

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('利欧股份_券商公司研究报告_2份')
          meta = {
              '01_西南证券_三驾马车齐头并进未来发展值得期待_公司报告_2020-11-04.pdf': {
                  'broker': '西南证券',
                  'title': '三驾马车齐头并进，未来发展值得期待',
                  'date': '2020-11-04',
                  'type': '公司研究报告（长篇）',
                  'index': 'AP202011041426387666',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202011041426387666_1.pdf',
              },
              '02_东吴证券_外围环境逐步复苏AI技术引领业务升级_业绩点评_2023-05-03.pdf': {
                  'broker': '东吴证券',
                  'title': '2022年及2023Q1业绩点评：外围环境逐步复苏，AI技术引领业务升级',
                  'date': '2023-05-03',
                  'type': '业绩点评报告',
                  'index': 'AP202305031586215688',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202305031586215688_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 2:
              raise SystemExit(f'Expected 2 PDFs, found {len(pdfs)}')

          lines = [
              '利欧股份（002131）券商公司研究报告资料包',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 公开渠道中可直接下载、能够独立校验的利欧股份原始券商PDF较少。',
              '2. 本包收录1份18页长篇公司研究报告，并补充1份较新的完整券商业绩点评，以满足2份资料需求。',
              '3. 已检索到2017年安信证券深度报告及2023年安信证券、兴业证券首次覆盖报告，但完整PDF下载要求登录或未提供可校验公开附件，故未将网页摘要或自行重建文件混入本包。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')

          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 2
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Leo-Group-002131-broker-research-reports-2
          path: 利欧股份_券商公司研究报告_2份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
