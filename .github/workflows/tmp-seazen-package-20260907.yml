name: Temporary Seazen Group broker report package
on:
  push:
    branches:
      - tmp-seazen-broker-reports-20260907
    paths:
      - .github/workflows/tmp-seazen-package-20260907.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-seazen-broker-reports-20260907
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml pillow pypdf
      - name: Discover, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, re, time, unicodedata, zipfile
          from collections import deque
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import quote, unquote, urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageFile
          from pypdf import PdfReader

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          ROOT=Path('generated/seazen'); ROOT.mkdir(parents=True,exist_ok=True)
          WORK=Path('/tmp/seazen'); WORK.mkdir(parents=True,exist_ok=True)
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Accept':'text/html,application/xhtml+xml,application/pdf,image/avif,image/webp,image/*,*/*;q=0.8'})
          target_exact=['新城发展','新城发展控股','seazen group','future land development holdings','01030.hk','01030']
          target_weak=['新城发展集团','新城发展(01030','新城发展（01030']
          exclude_title=['新城控股','601155']
          deep_markers=['深度','首次覆盖','公司研究','价值重估','商业地产','吾悦广场','双轮驱动','商业运营','投资价值','成长逻辑','initiating','initiation']
          broker_terms=['中信证券','中信建投','华泰证券','国泰君安','海通证券','招商证券','兴业证券','国金证券','天风证券','东方证券','光大证券','申万宏源','中金公司','国元国际','交银国际','招银国际','第一上海','国泰海通','东吴证券','西南证券','开源证券','民生证券','华创证券','安信证券','广发证券','银河证券','中银国际','国信证券','中泰证券','方正证券','德邦证券','平安证券','华西证券','克而瑞证券','浦银国际','建银国际','工银国际','兴证国际','国泰君安国际','海通国际','国信证券香港','农银国际','申万宏源香港']
          logs=[]; candidate_pages={}; sdy=[]; accepted=[]; rejected=[]
          def log(*args):
              line=' '.join(str(x) for x in args); logs.append(line); print(line,flush=True)
          def norm(x): return re.sub(r'\s+','',str(x or '')).lower()
          def target_in(text):
              n=norm(text)
              return any(norm(t) in n for t in target_exact+target_weak)
          def title_is_wrong(text):
              n=norm(text)
              return ('新城控股' in n or '601155' in n) and not ('新城发展' in n or '01030' in n or 'seazengroup' in n)
          def safe(x):
              x=unicodedata.normalize('NFKC',str(x)); x=re.sub(r'[\\/:*?"<>|\r\n]+','_',x); x=re.sub(r'\s+',' ',x).strip(' ._'); return x[:160]
          def unwrap(u):
              try:
                  p=urlparse(u); q=parse_qs(p.query)
                  for key in ['uddg','url','target']:
                      if key in q and q[key]: return unquote(q[key][0])
              except: pass
              return u
          def add_page(u,label='',source=''):
              if not u: return
              u=unwrap(str(u).replace('&amp;','&').replace('\\/','/'))
              if u.startswith('//'): u='https:'+u
              if not u.startswith(('http://','https://')): return
              if len(u)>1800: return
              candidate_pages.setdefault(u,{'url':u,'label':label[:1000],'source':source})

          # Public index metadata; often supplies exact report titles, page counts, and source IDs.
          try:
              ss=requests.Session(); ss.headers.update({'User-Agent':UA,'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report','Content-Type':'application/json;charset=UTF-8','Accept':'application/json, text/plain, */*'})
              for kw in ['新城发展','新城发展控股','01030','1030.HK','Seazen Group','Future Land Development']:
                  for page in range(1,15):
                      body={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':page,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','keyword':kw}
                      r=ss.post('https://api.sdyanbao.com/api/file/search',json=body,timeout=90)
                      obj=r.json(); files=(obj.get('data') or {}).get('files') or []
                      log('SD',kw,page,len(files),(obj.get('data') or {}).get('total'))
                      if not files: break
                      for f in files:
                          searchable=' '.join(str(f.get(k) or '') for k in ['name','content'])+' '+json.dumps(f.get('stock') or {},ensure_ascii=False)
                          if not target_in(searchable) or title_is_wrong(searchable): continue
                          rec={k:f.get(k) for k in f.keys() if k not in ['content']}; rec['keyword']=kw
                          sdy.append(rec); log('SD_MATCH',str(f.get('name')),f.get('page_count'),f.get('organization'),f.get('original_id'),f.get('data_source'))
                          for k in ['online_url','page_url','share_url','url','download_url','source_url']:
                              add_page(f.get(k),str(f.get('name') or ''),'sdyanbao')
                          oid=str(f.get('original_id') or '')
                          source=norm(f.get('data_source'))
                          if oid.isdigit() and ('发现报告' in source or 'fxbaogao' in source): add_page('https://www.fxbaogao.com/detail/'+oid,str(f.get('name') or ''),'sdyanbao_original_id')
                      if len(files)<100: break
          except Exception as e: log('SD_ERR',repr(e))

          # Search the public report catalogue directly.
          direct=[]
          for base in ['https://www.fxbaogao.com/search','https://www.fxbaogao.com/search.html']:
              for key in ['keywords','keyword','q','search']:
                  for kw in ['新城发展','新城发展控股','01030']:
                      for page in range(1,8): direct.append(f'{base}?{key}={quote(kw)}&page={page}')
          direct += ['https://www.hangyan.co/reports?q='+quote(x) for x in ['新城发展','新城发展控股','01030']]
          direct += ['https://reportify.cn/search?q='+quote(x) for x in ['新城发展','新城发展控股']]
          for u in direct:
              try:
                  r=s.get(u,timeout=45,allow_redirects=True); text=r.text.replace('\\/','/'); soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a.get('href')); label=' '.join(a.get_text(' ',strip=True).split()); parent=a.find_parent(['article','li','section','div']); context=' '.join(parent.get_text(' ',strip=True).split())[:1800] if parent else label
                      if target_in(label+' '+context) and not title_is_wrong(label+' '+context): add_page(href,label+' '+context,'direct_catalogue')
                  for m in re.findall(r'https?://[^"\'<>\s]+/detail/\d+',text): add_page(m,'','direct_catalogue_regex')
                  for rid in re.findall(r'(?:fxbaogao\.com/detail/|/detail/)(\d+)',text): add_page('https://www.fxbaogao.com/detail/'+rid,'','direct_catalogue_id')
              except Exception as e: log('DIRECT_ERR',u,repr(e))

          # General web search. Multiple engines are used because coverage differs.
          queries=[
            '"新城发展" 券商 深度报告 PDF','"新城发展控股" 深度报告','"新城发展" 首次覆盖 研报','"新城发展" 公司深度报告','"01030.HK" research report PDF','"Seazen Group" equity research PDF','"Future Land Development" equity research report PDF',
            'site:fxbaogao.com/detail "新城发展"','site:fxbaogao.com/detail "新城发展控股"','site:reportify.cn/reports "新城发展"','site:hangyan.co/reports "新城发展"','site:sgpjbg.com "新城发展" 研报','"新城发展" 吾悦广场 深度 报告','"新城发展" 商业运营 券商 报告'
          ]
          engines=[lambda q:'https://www.bing.com/search?q='+quote(q)+'&count=50',lambda q:'https://html.duckduckgo.com/html/?q='+quote(q),lambda q:'https://www.sogou.com/web?query='+quote(q)+'&num=50',lambda q:'https://www.baidu.com/s?wd='+quote(q)+'&rn=50',lambda q:'https://www.so.com/s?q='+quote(q)]
          for q in queries:
              for build in engines:
                  u=build(q)
                  try:
                      r=s.get(u,timeout=40,allow_redirects=True); soup=BeautifulSoup(r.text,'lxml')
                      for a in soup.find_all('a',href=True):
                          href=unwrap(urljoin(r.url,a.get('href'))); label=' '.join(a.get_text(' ',strip=True).split())
                          hay=label+' '+href
                          if target_in(hay) or any(x in href.lower() for x in ['fxbaogao.com/detail/','reportify.cn/reports/','hangyan.co/reports/','sgpjbg.com','vzkoo.com/document/']): add_page(href,label,'search:'+q)
                  except Exception as e: log('SEARCH_ERR',q,repr(e))

          # Exact-title searches from index metadata.
          titles=[]
          for f in sdy:
              t=str(f.get('name') or '').strip()
              if t and t not in titles: titles.append(t)
          for t in titles[:80]:
              for u in ['https://www.bing.com/search?q='+quote('"'+t[:110]+'" PDF'),'https://www.so.com/s?q='+quote('"'+t[:110]+'" PDF')]:
                  try:
                      r=s.get(u,timeout=40); soup=BeautifulSoup(r.text,'lxml')
                      for a in soup.find_all('a',href=True):
                          href=unwrap(urljoin(r.url,a.get('href'))); label=' '.join(a.get_text(' ',strip=True).split())
                          if any(x in href.lower() for x in ['fxbaogao.com/detail/','reportify.cn/reports/','hangyan.co/reports/','.pdf']): add_page(href,label,'exact_title')
                  except: pass

          # Visit candidates and collect direct PDFs / FXBaoGao detail IDs.
          fx_ids={}; pdf_urls={}; reportify_pages=[]; probes=[]
          queue=deque(candidate_pages.values()); seen=set()
          while queue and len(seen)<900:
              meta=queue.popleft(); u=meta['url']
              if u in seen: continue
              seen.add(u)
              m=re.search(r'fxbaogao\.com/detail/(\d+)',u)
              if m: fx_ids.setdefault(m.group(1),meta)
              if re.search(r'\.pdf(?:$|[?#])',u,re.I): pdf_urls.setdefault(u,meta)
              try:
                  r=s.get(u,timeout=(15,60),allow_redirects=True,headers={'Referer':meta.get('source') or 'https://www.bing.com/'}); data=r.content; ct=(r.headers.get('content-type') or '').lower()
                  row={**meta,'status':r.status_code,'bytes':len(data),'final_url':r.url,'content_type':ct}
                  if data[:5]==b'%PDF-': pdf_urls.setdefault(r.url,meta); row['pdf']=True; probes.append(row); continue
                  if not ('html' in ct or data.lstrip().startswith(b'<')): probes.append(row); continue
                  text=r.text.replace('\\/','/').replace('&amp;','&'); soup=BeautifulSoup(text,'lxml'); title=soup.title.get_text(' ',strip=True) if soup.title else ''; h1=' '.join((soup.find('h1').get_text(' ',strip=True) if soup.find('h1') else '').split()); body=' '.join(soup.get_text(' ',strip=True).split())[:20000]
                  row.update({'title':title,'h1':h1,'body_head':body})
                  for rid in re.findall(r'(?:fxbaogao\.com/detail/|/detail/)(\d+)',text): fx_ids.setdefault(rid,{'url':'https://www.fxbaogao.com/detail/'+rid,'label':title+' '+h1,'source':r.url})
                  for pu in re.findall(r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',text,re.I): pdf_urls.setdefault(pu,{'url':pu,'label':title+' '+h1,'source':r.url})
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a.get('href')); label=' '.join(a.get_text(' ',strip=True).split()); hay=label+' '+href
                      if (target_in(hay) or any(x in href.lower() for x in ['fxbaogao.com/detail/','reportify.cn/reports/'])) and href not in seen: queue.append({'url':href,'label':label,'source':r.url})
                  if 'reportify.cn/reports/' in r.url: reportify_pages.append(row)
                  probes.append(row)
              except Exception as e: probes.append({**meta,'error':repr(e)})

          def pdf_meta(data):
              reader=PdfReader(io.BytesIO(data),strict=False); texts=[]
              for i in range(min(len(reader.pages),5)):
                  try:texts.append(reader.pages[i].extract_text() or '')
                  except:texts.append('')
              return len(reader.pages),'\n'.join(texts)
          def detect_broker(text,label):
              joined=text+' '+label
              for b in broker_terms:
                  if b in joined:return b
              m=re.search(r'([\u4e00-\u9fff]{2,12}(?:证券|国际))',joined); return m.group(1) if m else '券商研究'
          def detect_date(text,label):
              joined=label+' '+text[:6000]
              for pat in [r'(20\d{2})[年./-](\d{1,2})[月./-](\d{1,2})日?',r'(20\d{2})(\d{2})(\d{2})']:
                  m=re.search(pat,joined)
                  if m:
                      try:return f'{int(m.group(1)):04d}-{int(m.group(2)):02d}-{int(m.group(3)):02d}'
                      except:pass
              return '日期不详'
          def accept_pdf(data,source,label,title_hint=''):
              if len(data)<80000 or data[:5]!=b'%PDF-': return False
              sha=hashlib.sha256(data).hexdigest()
              if any(x['sha256']==sha for x in accepted): return True
              try:pages,text=pdf_meta(data)
              except Exception as e: rejected.append({'source':source,'reason':'parse','error':repr(e)}); return False
              combined=title_hint+' '+label+' '+text[:20000]
              if not target_in(combined) or title_is_wrong(combined): rejected.append({'source':source,'reason':'wrong_target','pages':pages,'title':title_hint}); return False
              if pages<8: rejected.append({'source':source,'reason':'too_short','pages':pages,'title':title_hint}); return False
              if any(x in norm(combined) for x in ['年度报告','中期报告','招股说明书','全球发售','环境社会及管治报告']): rejected.append({'source':source,'reason':'corporate_filing','pages':pages}); return False
              broker=detect_broker(text,label); date=detect_date(text,label); title=(title_hint or label or '新城发展公司研究报告').strip()[:100]
              fname=safe(f'{date}_{broker}_{title}_{pages}页')+'.pdf'; path=WORK/fname; n=2
              while path.exists(): path=WORK/(safe(fname[:-4]+f'_{n}')+'.pdf'); n+=1
              path.write_bytes(data); accepted.append({'path':str(path),'filename':path.name,'title':title,'broker':broker,'date':date,'pages':pages,'bytes':len(data),'sha256':sha,'source':source,'score':pages+(30 if any(x in title for x in deep_markers) else 0)}); log('ACCEPT_PDF',path.name,pages,source); return True

          for u,meta in list(pdf_urls.items()):
              try:
                  r=s.get(u,timeout=(20,180),allow_redirects=True,headers={'Referer':meta.get('source') or 'https://www.bing.com/','Accept':'application/pdf,*/*'}); accept_pdf(r.content,r.url,meta.get('label',''))
              except Exception as e: rejected.append({'source':u,'reason':'fetch_error','error':repr(e)})

          # FXBaoGao exposes public original-page images. Reassemble them in original order.
          for rid,meta in list(fx_ids.items()):
              if len(accepted)>=8: break
              detail='https://www.fxbaogao.com/detail/'+rid
              try:
                  r=s.get(detail,timeout=60); text=r.text.replace('\\/','/'); soup=BeautifulSoup(text,'lxml'); page_title=soup.title.get_text(' ',strip=True) if soup.title else ''; h1=' '.join((soup.find('h1').get_text(' ',strip=True) if soup.find('h1') else '').split()); body=' '.join(soup.get_text(' ',strip=True).split())[:20000]; combined=page_title+' '+h1+' '+body+' '+meta.get('label','')
                  if not target_in(combined) or title_is_wrong(combined): continue
                  # Reject non-company titles unless target appears prominently.
                  title=h1 or page_title
                  if not target_in(title+' '+meta.get('label','')): continue
                  urls=re.findall(r'https?://public\.fxbaogao\.com/report-image/[^"\'<>\s]+?/'+re.escape(rid)+r'-1\.png(?:\?[^"\'<>\s]*)?',text,re.I)
                  if urls: cover=urls[0].split('?')[0]
                  else:
                      dm=re.search(r'(20\d{2})[-年/](\d{1,2})[-月/](\d{1,2})',combined)
                      if not dm: continue
                      y,m,d=map(int,dm.groups()); cover=f'https://public.fxbaogao.com/report-image/{y:04d}/{m:02d}/{d:02d}/{rid}-1.png'
                  pattern=re.sub(r'-1\.png$','-{n}.png',cover); images=[]; misses=0; page_dir=WORK/('img_'+rid); page_dir.mkdir(exist_ok=True)
                  for n in range(1,121):
                      u=pattern.format(n=n)
                      rr=s.get(u,headers={'Referer':detail,'Accept':'image/*,*/*'},timeout=(15,90)); data=rr.content; valid=rr.status_code==200 and len(data)>5000
                      if valid:
                          try:
                              im=Image.open(io.BytesIO(data)); im.verify(); im=Image.open(io.BytesIO(data)); valid=im.width>=500 and im.height>=500
                          except:valid=False
                      if valid:
                          p=page_dir/f'{n:03d}.png'; p.write_bytes(data); images.append(p); misses=0
                      else:
                          misses+=1
                          if images and misses>=3: break
                  if len(images)<8: rejected.append({'source':detail,'reason':'fx_too_short','pages':len(images),'title':title}); continue
                  opened=[]
                  for p in images:
                      im=Image.open(p)
                      if im.mode in ('RGBA','LA'):
                          bg=Image.new('RGB',im.size,'white'); bg.paste(im,mask=im.getchannel('A')); im=bg
                      else: im=im.convert('RGB')
                      opened.append(im)
                  temp=WORK/(safe(f'{rid}_{title}')+'.pdf'); opened[0].save(temp,'PDF',resolution=150,save_all=True,append_images=opened[1:],quality=95)
                  for im in opened:im.close()
                  data=temp.read_bytes(); pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                  # Broker/date from detail text, title from H1.
                  broker='券商研究'
                  for b in broker_terms:
                      if b in combined: broker=b; break
                  date=detect_date('',combined); sha=hashlib.sha256(data).hexdigest(); fname=safe(f'{date}_{broker}_{title}_{pages}页')+'.pdf'; dest=WORK/fname; temp.replace(dest)
                  accepted.append({'path':str(dest),'filename':dest.name,'title':title[:100],'broker':broker,'date':date,'pages':pages,'bytes':len(data),'sha256':sha,'source':detail,'score':pages+(30 if any(x in title for x in deep_markers) else 0)}); log('ACCEPT_FX',rid,dest.name,pages)
              except Exception as e: rejected.append({'source':detail,'reason':'fx_error','error':repr(e)})

          # Rank by depth and page count; diversify brokers, then keep 2-3.
          accepted.sort(key=lambda x:(x['score'],x['date']),reverse=True)
          chosen=[]; brokers=set()
          for x in accepted:
              if len(chosen)>=3:break
              if x['broker'] not in brokers or len(chosen)<2:
                  chosen.append(x); brokers.add(x['broker'])
          if len(chosen)<2:
              for x in accepted:
                  if x not in chosen:chosen.append(x)
                  if len(chosen)>=3:break

          status={'target':'新城发展控股有限公司 / Seazen Group Limited / 01030.HK','candidate_page_count':len(candidate_pages),'sdy_matches':sdy,'fx_ids':list(fx_ids.keys()),'pdf_urls':list(pdf_urls.keys()),'accepted':accepted,'chosen':chosen,'rejected':rejected,'probes':probes[:1500]}
          (ROOT/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'search_log.txt').write_text('\n'.join(logs),encoding='utf-8')
          if len(chosen)>=2:
              final=WORK/'final'; final.mkdir(exist_ok=True)
              rows=[]
              for i,x in enumerate(chosen[:3],1):
                  dst=final/(f'{i:02d}_'+x['filename']); dst.write_bytes(Path(x['path']).read_bytes()); rows.append({**x,'filename':dst.name})
              with (final/'文件清单与校验值.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.writer(f); w.writerow(['序号','文件名','券商','发布日期','报告标题','PDF页数','文件大小（字节）','SHA-256','公开来源'])
                  for i,x in enumerate(rows,1):w.writerow([i,x['filename'],x['broker'],x['date'],x['title'],x['pages'],x['bytes'],x['sha256'],x['source']])
              readme=['新城发展控股有限公司（Seazen Group Limited，01030.HK）券商深度报告资料包','生成日期：2026-09-07','',f'收录完整PDF：{len(rows)}份。','筛选规则：报告标题或正文明确对应新城发展/01030.HK；排除A股新城控股（601155）、年报、公告、招股说明书以及少于8页的短评。','对于公开来源仅提供逐页原报告图像的文件，按原始页序合并为PDF；未绕过登录、付费墙或其他访问控制。','']
              for i,x in enumerate(rows,1):readme += [f'{i}. {x["broker"]}｜{x["date"]}｜{x["title"]}｜{x["pages"]}页',f'   来源：{x["source"]}']
              (final/'README.txt').write_text('\n'.join(readme),encoding='utf-8')
              archive=ROOT/f'新城发展_01030_券商深度报告_{len(rows)}份.zip'
              with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(final.iterdir()):z.write(p,p.name)
              with zipfile.ZipFile(archive,'r') as z:
                  bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
                  if bad is not None or len(pdfs)!=len(rows):raise RuntimeError(f'ZIP validation failed bad={bad} pdfs={pdfs}')
              result={'ok':True,'archive':archive.name,'archive_bytes':archive.stat().st_size,'report_count':len(rows),'zip_crc_ok':True,'reports':rows}
          else:
              result={'ok':False,'report_count':len(chosen),'message':'Fewer than two substantial public broker reports could be retrieved.','accepted':accepted}
          (ROOT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - name: Commit generated package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Report Packager"
          git config user.email "actions@users.noreply.github.com"
          git add generated/seazen
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Seazen Group broker report package [skip ci]"
          git push origin HEAD:tmp-seazen-broker-reports-20260907
      - name: Upload package and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: seazen-broker-report-package
          path: generated/seazen/*
          retention-days: 1
          if-no-files-found: error
