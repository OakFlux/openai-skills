name: Inspect China Hongqiao Vzkoo document access
on:
  push:
    branches:
      - tmp-chinahongqiao-vzkoo-inspect-20260908
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Playwright binding
        run: python -m pip install --quiet playwright
      - name: Inspect documents
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import hashlib, json, re, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          docs={
            'kaiyuan':'https://www.vzkoo.com/document/20240613685119ace79295e90edc0069.html?from=report',
            'huachuang':'https://www.vzkoo.com/document/202505284d706ccf964f075580f58225.html?from=report'
          }
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          result={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',locale='zh-CN',accept_downloads=True)
            for label,url in docs.items():
              page=ctx.new_page()
              rec={'requests':[],'responses':[],'downloads':[],'clicks':[],'json':[]}
              def on_request(req,rec=rec):
                if re.search(r'pdf|download|file|document|report|api|oss|cdn',req.url,re.I):
                  rec['requests'].append({'url':req.url,'method':req.method,'post_data':req.post_data,'type':req.resource_type})
              def on_response(resp,rec=rec):
                try: ct=resp.headers.get('content-type','')
                except: ct=''
                if re.search(r'pdf|download|file|document|report|api|oss|cdn',resp.url,re.I) or 'pdf' in ct.lower():
                  rec['responses'].append({'url':resp.url,'status':resp.status,'content_type':ct})
                  if 'json' in ct.lower() and len(rec['json'])<30:
                    try:
                      txt=resp.text()
                      rec['json'].append({'url':resp.url,'text':txt[:300000]})
                    except Exception as e:
                      rec['json'].append({'url':resp.url,'error':repr(e)})
              page.on('request',on_request)
              page.on('response',on_response)
              try:
                r=page.goto(url,wait_until='domcontentloaded',timeout=90000)
                try: page.wait_for_load_state('networkidle',timeout=30000)
                except PWTimeout: pass
                page.wait_for_timeout(3000)
                rec['status']=r.status if r else None
                rec['final_url']=page.url
                rec['title']=page.title()
                rec['body']=' '.join(page.locator('body').inner_text(timeout=15000).split())[:100000]
                rec['links']=page.eval_on_selector_all('a',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),href:e.href,title:e.title||'',download:e.download||''}))")
                rec['buttons']=page.eval_on_selector_all('button',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),title:e.title||'',disabled:e.disabled}))")
                Path(f'output/{label}.html').write_text(page.content(),encoding='utf-8')
                page.screenshot(path=f'output/{label}.png',full_page=True)
                for text in ['下载文档','立即下载','下载报告','下载PDF','免费下载','下载']:
                  loc=page.get_by_text(text,exact=False)
                  if not loc.count(): continue
                  try:
                    with page.expect_download(timeout=8000) as di:
                      loc.first.click(timeout=8000,force=True)
                    d=di.value
                    target=Path('output')/f'{label}_{d.suggested_filename}'
                    d.save_as(str(target))
                    data=target.read_bytes()
                    rec['downloads'].append({'text':text,'file':str(target),'url':d.url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'magic':data[:8].hex()})
                    break
                  except Exception as e:
                    rec['clicks'].append({'text':text,'error':repr(e),'url_after':page.url})
                    try: page.wait_for_timeout(1200)
                    except: pass
                rec['after_url']=page.url
                try: rec['after_body']=' '.join(page.locator('body').inner_text().split())[:30000]
                except: pass
              except Exception as e:
                rec['error']=repr(e)
              result[label]=rec
              print('DOC',label,json.dumps({'downloads':rec.get('downloads'),'clicks':rec.get('clicks'),'requests':rec.get('requests')[-50:],'responses':rec.get('responses')[-50:]},ensure_ascii=False),flush=True)
              page.close()
            browser.close()
          Path('output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-vzkoo-inspection
          path: output/*
          retention-days: 1
