name: Map Hangyan pages around target CR BMT dates
on:
  push:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Sample listing dates
        run: |
          python - <<'PY'
          import json,time,requests
          from bs4 import BeautifulSoup
          pages=[430,460,500,540,570,600,1580,1600,1620,1640,1660]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for page in pages:
              r=s.get('https://www.hangyan.co/reports',params={'page':page},timeout=60)
              soup=BeautifulSoup(r.text,'html.parser')
              cards=[]
              for a in soup.select('a[data-controller="protected-link"]'):
                  box=a.find_parent('div',class_=lambda c:c and 'box' in c.split())
                  meta=box.get_text(' ',strip=True) if box else a.get_text(' ',strip=True)
                  if ' | 202' in meta:
                      cards.append({'title':a.get_text(' ',strip=True),'meta':meta})
              print('\nPAGE',page,'STATUS',r.status_code,'COUNT',len(cards))
              print('FIRST',json.dumps(cards[:2],ensure_ascii=False))
              print('LAST',json.dumps(cards[-2:],ensure_ascii=False))
              for c in cards:
                  if '华润建材科技' in c['title'] or '华润水泥' in c['title']:
                      print('MATCH',json.dumps(c,ensure_ascii=False))
              time.sleep(2)
          PY
