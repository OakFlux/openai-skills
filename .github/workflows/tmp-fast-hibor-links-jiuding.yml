name: Temporary Fast Extract Jiuding Hibor Links

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact report links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,requests,json
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36'})
          def dec(r):
              for e in ('gb18030','gbk','utf-8'):
                  try:return r.content.decode(e)
                  except:pass
              return r.content.decode('utf-8','ignore')
          out=[]
          for month in ['200712','200906','200907','201012','201105','201511']:
              url=f'https://p.hibor.com.cn/archiver/{month}.html'
              r=s.get(url,timeout=40); print('FETCH',month,r.status_code,len(r.content))
              if r.status_code!=200:continue
              text=html.unescape(dec(r))
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  title=re.sub(r'<[^>]+>',' ',m.group(2));title=re.sub(r'\s+',' ',html.unescape(title)).strip()
                  if '九鼎新材' in title or '002201' in title or '正威新材' in title:
                      out.append({'month':month,'title':title,'url':urljoin(r.url,m.group(1))})
          print('RESULT='+json.dumps(out,ensure_ascii=False))
          PY
