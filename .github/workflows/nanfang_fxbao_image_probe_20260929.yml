name: South Precision FXBaogao Image Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_fxbao_image_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow beautifulsoup4

      - name: Probe public page images and site metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import io, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from PIL import Image
          from bs4 import BeautifulSoup

          doc_id = '76452'
          dates = ['2016/08/02','2016/08/03','2016/08/01','2016/08/04']
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          page_url=f'https://www.fxbaogao.com/detail/{doc_id}'
          r=session.get(page_url,timeout=60,allow_redirects=True)
          print('DETAIL',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          Path('output/detail.html').write_bytes(r.content)
          r.encoding=r.apparent_encoding or 'utf-8'
          html=r.text
          print('TITLE',BeautifulSoup(html,'html.parser').title)
          for i,line in enumerate(html.splitlines(),1):
            if re.search(r'report-image|76452|datePublished|page|view\?id|docId|image',line,re.I):
              print('LINE',i,line[:5000])

          # inspect scripts that may expose page count or API routes
          soup=BeautifulSoup(html,'html.parser')
          for tag in soup.find_all('script',src=True):
            u=urljoin(r.url,tag['src'])
            try:
              rr=session.get(u,headers={'Referer':page_url},timeout=60)
              rr.encoding=rr.apparent_encoding or 'utf-8'
              text=rr.text
              if re.search(r'report-image|docId|pageCount|pageNum|/view|mofoun|detail',text,re.I):
                print('SCRIPT',u,rr.status_code,len(rr.content))
                for j,line in enumerate(text.splitlines(),1):
                  if re.search(r'report-image|docId|pageCount|pageNum|/view|mofoun|detail',line,re.I):
                    print('JSLINE',j,line[:6000])
            except Exception as e: print('SCRIPT_ERR',u,repr(e))

          results=[]
          for date_path in dates:
            consecutive_misses=0
            for page in range(1,61):
              candidates=[
                f'https://public.fxbaogao.com/report-image/{date_path}/{doc_id}-{page}.png',
                f'https://public.fxbaogao.com/report-image/{date_path}/{doc_id}-{page}.png?x-oss-process=image/format,webp',
              ]
              found=False
              for u in candidates:
                try:
                  rr=session.get(u,headers={'Referer':page_url},timeout=45,allow_redirects=True)
                  ctype=rr.headers.get('content-type','')
                  ok=rr.status_code==200 and len(rr.content)>1000 and ('image' in ctype or rr.content[:8].startswith(b'\x89PNG') or rr.content[:4] in (b'RIFF',b'\xff\xd8\xff\xe0',b'\xff\xd8\xff\xe1'))
                  print('IMG',date_path,page,rr.status_code,len(rr.content),ctype,ok,u)
                  if ok:
                    im=Image.open(io.BytesIO(rr.content)); im.verify()
                    results.append({'date_path':date_path,'page':page,'url':u,'bytes':len(rr.content),'format':im.format,'size':im.size})
                    found=True
                    break
                except Exception as e: print('IMG_ERR',date_path,page,u,repr(e))
              if found:
                consecutive_misses=0
              else:
                consecutive_misses+=1
                if page>=3 and consecutive_misses>=4:
                  break
          Path('output/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULTS',json.dumps(results,ensure_ascii=False,indent=2))
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-fxbao-image-probe
          path: output/
          retention-days: 1
