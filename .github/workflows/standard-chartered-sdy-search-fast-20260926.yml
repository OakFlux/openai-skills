name: Fast search Standard Chartered reports 20260926
on:
  push:
    paths:
      - '.github/workflows/standard-chartered-sdy-search-fast-20260926.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query public report API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json
          from pathlib import Path
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          payload={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':'渣打集团','pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
          try:
            r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=(10,20))
            out={'status':r.status_code,'headers':dict(r.headers),'text':r.text}
          except Exception as e:
            out={'error':repr(e)}
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:100000])
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: standard-chartered-sdy-search-fast
          path: out
          retention-days: 7
          if-no-files-found: error
