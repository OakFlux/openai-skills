name: Temporary Seazen deep source inspection
on:
  push:
    branches:
      - tmp-seazen-broker-reports-20260907
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml playwright pypdf pillow
          python -m playwright install --with-deps chromium
      - name: Inspect sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/downloads
          python - <<'PY'
          from __future__ import annotations
          import io, json, re, time
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          out=Path('output'); dl=out/'downloads'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Accept':'text/html,application/xhtml+xml,application/pdf,image/avif,image/webp,image/apng,*/*;q=0.8'})
          targets={
            'vzkoo':'https://www.vzkoo.com/read/202509107ba393e9b743196d76e59843.html',
            'baogaobox':'https://www.baogaobox.com/insights/251223000024079.html',
            'ifxh':'https://www.ifxh.com/2723.html',
            'sgp_first':'https://www.sgpjbg.com/baogao/1102356.html',
            'sgp_second':'https://www.sgpjbg.com/baogao/996548.html',
            'sgp_third':'https://www.sgpjbg.com/baogao/902742.html',
            'fx_first':'https://www.fxbaogao.com/detail/5253520',
          }
          result={'requests':{},'browser':{},'search':[],'downloads':[]}

          def summarize_html(name,url):
              row={'url':url}
              try:
                  r=s.get(url,timeout=90,allow_redirects=True)
                  row.update({'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type')})
                  (out/f'{name}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'lxml')
                  row['title']=soup.title.get_text(' ',strip=True) if soup.title else None
                  body=' '.join(soup.get_text(' ',strip=True).split())
                  row['body_head']=body[:30000]
                  items=[]
                  for tag in soup.find_all(True):
                      for attr in ['href','src','data-src','data-original','data-url','data-file','data-pdf','data-download','content','value']:
                          v=tag.get(attr)
                          if not isinstance(v,str) or not v.strip(): continue
                          a=urljoin(r.url,v.strip())
                          low=a.lower()
                          txt=' '.join(tag.get_text(' ',strip=True).split())[:500]
                          if any(k in low or k in txt.lower() for k in ['.pdf','download','report-image','file','oss','cos','cdn','preview','viewer','原文','下载']):
                              items.append({'tag':tag.name,'attr':attr,'value':v,'url':a,'text':txt})
                  decoded=r.text.replace('\\/','/').replace('&amp;','&')
                  for u in re.findall(r'https?://[^"\'<>\s\\]+',decoded,re.I):
                      low=u.lower()
                      if any(k in low for k in ['.pdf','download','report-image','file','oss','cos','cdn','preview','viewer']):
                          items.append({'tag':'regex','attr':'text','value':u,'url':u,'text':''})
                  uniq=[]; seen=set()
                  for x in items:
                      key=x['url']
                      if key in seen: continue
                      seen.add(key); uniq.append(x)
                  row['candidates']=uniq[:2500]
                  row['scripts']=[urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]
                  print('REQ',name,r.status_code,len(r.content),r.url,'CANDS',len(uniq),flush=True)
                  for x in uniq[:150]: print('CAND',name,json.dumps(x,ensure_ascii=False),flush=True)
              except Exception as e:
                  row['error']=repr(e); print('REQ_ERR',name,repr(e),flush=True)
              return row

          for name,url in targets.items(): result['requests'][name]=summarize_html(name,url)

          queries=[
            '"新城发展(01030.HK)" "云销雨霁，彩彻区明" PDF',
            '"新城发展" "商业精耕红利凸显，开发减损债患渐消" PDF',
            '"新城发展" "不止于开发，从平衡到引领" PDF',
            '"新城发展" 广发证券 250904 35页 PDF',
            '"新城发展" 东北证券 251221 30页 PDF',
          ]
          engines={
            'bing':lambda q:'https://www.bing.com/search?q='+quote(q)+'&count=50',
            'baidu':lambda q:'https://www.baidu.com/s?wd='+quote(q)+'&rn=50',
            'sogou':lambda q:'https://www.sogou.com/web?query='+quote(q)+'&num=50',
            'so360':lambda q:'https://www.so.com/s?q='+quote(q),
          }
          search_links={}
          for q in queries:
              for en,builder in engines.items():
                  u=builder(q); row={'query':q,'engine':en,'url':u}
                  try:
                      r=s.get(u,timeout=90,allow_redirects=True)
                      soup=BeautifulSoup(r.text,'lxml'); found=[]
                      for a in soup.find_all('a',href=True):
                          href=a.get('href') or ''; txt=' '.join(a.get_text(' ',strip=True).split())
                          if href.startswith('//'): href='https:'+href
                          if href.startswith('/'): href=urljoin(r.url,href)
                          if not href.startswith('http'): continue
                          low=(href+' '+txt).lower()
                          if any(k in low for k in ['新城发展','seazen','1030','01030','云销雨霁','商业精耕','不止于开发','pdf','报告','研报']):
                              item={'href':href,'text':txt}; found.append(item); search_links.setdefault(href,{'query':q,'engine':en,'text':txt})
                      row.update({'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'found':found[:500]})
                      print('SEARCH',en,q,r.status_code,len(found),flush=True)
                      for x in found[:100]: print('SEARCH_LINK',en,json.dumps(x,ensure_ascii=False),flush=True)
                  except Exception as e: row['error']=repr(e); print('SEARCH_ERR',en,q,repr(e),flush=True)
                  result['search'].append(row)

          # Browser inspection and public download attempts.
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled'])
              for name,url in targets.items():
                  ctx=browser.new_context(viewport={'width':1440,'height':1200},locale='zh-CN',accept_downloads=True,user_agent=ua,extra_http_headers={'Accept-Language':'zh-CN,zh;q=0.9'})
                  ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined});")
                  page=ctx.new_page(); reqs=[]; resps=[]; row={'url':url}
                  page.on('request',lambda x:reqs.append({'url':x.url,'method':x.method,'type':x.resource_type}) if any(k in x.url.lower() for k in ['.pdf','download','file','report','api','ajax','oss','cos']) else None)
                  page.on('response',lambda x:resps.append({'url':x.url,'status':x.status,'content_type':x.headers.get('content-type')}) if any(k in x.url.lower() for k in ['.pdf','download','file','report','api','ajax','oss','cos']) else None)
                  try:
                      rr=page.goto(url,wait_until='domcontentloaded',timeout=120000)
                      try: page.wait_for_load_state('networkidle',timeout=25000)
                      except PWTimeout: pass
                      page.wait_for_timeout(5000)
                      row.update({'status':rr.status if rr else None,'final_url':page.url,'title':page.title(),'body':' '.join(page.locator('body').inner_text().split())[:40000]})
                      anchors=page.eval_on_selector_all('a','els=>els.map(e=>({href:e.href,text:(e.innerText||e.textContent||"").trim(),html:e.outerHTML}))')
                      row['anchors']=[a for a in anchors if any(k in ((a.get('href') or '')+' '+(a.get('text') or '')).lower() for k in ['download','下载','.pdf','原文','报告'])][:1000]
                      imgs=page.eval_on_selector_all('img','els=>els.map(e=>({src:e.currentSrc||e.src,alt:e.alt,width:e.naturalWidth,height:e.naturalHeight}))')
                      row['images']=[i for i in imgs if (i.get('width') or 0)>=500 or any(k in (i.get('src') or '').lower() for k in ['report','pdf','read','article'])][:2000]
                      (out/f'{name}_browser.html').write_text(page.content(),encoding='utf-8')
                      page.screenshot(path=str(out/f'{name}.png'),full_page=False)
                      selectors=['a:has-text("下载")','button:has-text("下载")','a:has-text("阅读原文")','a:has-text("查看原文")','a[href$=".pdf"]','a[href*="download"]']
                      clicks=[]
                      for sel in selectors:
                          loc=page.locator(sel)
                          for i in range(min(loc.count(),10)):
                              it=loc.nth(i)
                              try:
                                  if not it.is_visible(): continue
                                  c={'selector':sel,'index':i,'href':it.get_attribute('href'),'text':it.inner_text(),'html':it.evaluate('e=>e.outerHTML')}
                                  try:
                                      with page.expect_download(timeout=12000) as pending: it.click(timeout=8000)
                                      down=pending.value; path=dl/(name+'_'+re.sub(r'[^A-Za-z0-9._-]+','_',down.suggested_filename))
                                      down.save_as(str(path)); c['download']={'name':down.suggested_filename,'path':str(path),'bytes':path.stat().st_size}
                                  except Exception as de:
                                      c['click_error']=repr(de); page.wait_for_timeout(1500); c['after_url']=page.url
                                  clicks.append(c)
                              except Exception as ce: clicks.append({'selector':sel,'index':i,'error':repr(ce)})
                      row['clicks']=clicks; row['requests']=reqs[-3000:]; row['responses']=resps[-3000:]
                      print('BROWSER',name,row.get('status'),row.get('title'),'ANCHORS',len(row['anchors']),'IMGS',len(row['images']),'CLICKS',len(clicks),flush=True)
                      for x in row['anchors'][:100]: print('ANCHOR',name,json.dumps(x,ensure_ascii=False),flush=True)
                      for x in row['images'][:100]: print('IMAGE',name,json.dumps(x,ensure_ascii=False),flush=True)
                      for x in clicks[:50]: print('CLICK',name,json.dumps(x,ensure_ascii=False),flush=True)
                  except Exception as e:
                      row['error']=repr(e); print('BROWSER_ERR',name,repr(e),flush=True)
                  result['browser'][name]=row
                  ctx.close()
              browser.close()

          # Probe search result URLs likely to be direct PDFs or report pages.
          probes=[]
          for i,(u,meta) in enumerate(list(search_links.items())[:500],1):
              if not any(k in (u+' '+meta.get('text','')).lower() for k in ['新城发展','seazen','01030','1030','pdf','研报','报告']): continue
              try:
                  r=s.get(u,timeout=(20,120),allow_redirects=True,headers={'Referer':'https://www.bing.com/','Accept':'application/pdf,text/html,*/*'})
                  data=r.content; row={**meta,'url':u,'status':r.status_code,'final_url':r.url,'bytes':len(data),'content_type':r.headers.get('content-type')}
                  if b'%PDF-' in data[:1024] and len(data)>50000:
                      row['pages']=len(PdfReader(io.BytesIO(data),strict=False).pages)
                      path=dl/f'search_{i}.pdf'; path.write_bytes(data); row['saved']=str(path)
                  probes.append(row)
                  print('PROBE',i,r.status_code,len(data),r.url,row.get('pages'),flush=True)
              except Exception as e: probes.append({**meta,'url':u,'error':repr(e)}); print('PROBE_ERR',u,repr(e),flush=True)
          result['probes']=probes
          (out/'inspection.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: seazen-deep-source-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
