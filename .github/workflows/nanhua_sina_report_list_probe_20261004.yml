name: Nanhua Sina Report History Probe

on:
  push:
    branches:
      - chatgpt-nanhua-biological-broker-reports-20261004
    paths:
      - .github/workflows/nanhua_sina_report_list_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Query Sina research-report pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz000504&t1=all',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=000504&t1=all',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz000504',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=000504',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?searchword=%E8%B5%9B%E8%BF%AA%E4%BC%A0%E5%AA%92',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?searchword=%E5%8D%97%E5%8D%8E%E7%94%9F%E7%89%A9',
          ]
          all_links=[]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              r.encoding=r.apparent_encoding or 'gb18030'
              print('\nPAGE',url,r.status_code,len(r.content),r.url,r.encoding,r.headers.get('content-type'))
              print(r.text[:3000])
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                text=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if 'vReport_Show' in href or 'rptid' in href or '赛迪传媒' in text or '南华生物' in text or '000504' in text:
                  rec={'source':url,'text':text,'href':href}
                  links.append(rec); all_links.append(rec)
              print('LINKS',json.dumps(links,ensure_ascii=False,indent=2))
            except Exception as e:
              print('ERROR',url,repr(e))
          # Dedup
          dedup=[]; seen=set()
          for rec in all_links:
            key=(rec['text'],rec['href'])
            if key not in seen:
              seen.add(key); dedup.append(rec)
          open('output/report_links.json','w',encoding='utf-8').write(json.dumps(dedup,ensure_ascii=False,indent=2))
          print('FINAL_LINK_COUNT',len(dedup))
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: nanhua-sina-report-history-probe
          path: output/report_links.json
          retention-days: 1
