name: Build Zhenyu 300953 disclosure package

on:
  push:
    branches:
      - tmp-zhenyu-300953-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='震裕科技_300953_全部年报_招股说明书_最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/zhenyu_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import parse_qs, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('震裕科技_300953_全部年报_招股说明书_最新季报')
          STOCK = '300953'

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def compact_text(value: str) -> str:
              return re.sub(r'\s+', '', BeautifulSoup(value or '', 'html.parser').get_text(' ', strip=True))

          def fetch_html(url: str) -> tuple[str, str]:
              r = session.get(url, timeout=(30, 180), allow_redirects=True)
              if r.status_code != 200:
                  raise RuntimeError(f'HTTP {r.status_code} for {url}')
              r.encoding = r.apparent_encoding or r.encoding or 'gb18030'
              return r.url, r.text

          def extract_pdf_urls_from_page(page_url: str) -> list[str]:
              urls: list[str] = []
              try:
                  final_url, text = fetch_html(page_url)
                  decoded = html.unescape(text)
                  soup = BeautifulSoup(decoded, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = html.unescape(a.get('href', '')).strip().replace('\\/', '/')
                      label = compact_text(a.get_text(' ', strip=True))
                      if '.pdf' in href.lower() or '下载公告' in label or '查看PDF' in label or 'PDF原文' in label:
                          urls.append(urljoin(final_url, href))
                  patterns = [
                      r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                      r'https?:\\/\\/[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                  ]
                  for pattern in patterns:
                      for match in re.findall(pattern, decoded, flags=re.I):
                          urls.append(html.unescape(match).replace('\\/', '/'))
              except Exception as exc:
                  print('PAGE PDF EXTRACTION FAILED', page_url, repr(exc))
              normalized = []
              seen = set()
              for url in urls:
                  if url.startswith('//'):
                      url = 'https:' + url
                  if url.startswith('http://'):
                      url = 'https://' + url[7:]
                  if url not in seen:
                      seen.add(url)
                      normalized.append(url)
              return normalized

          def extract_id(url: str) -> str | None:
              query = parse_qs(urlparse(url).query)
              values = query.get('id') or query.get('ID')
              return values[0] if values else None

          def sina_pdf_urls(bulletin_id: str, date: str) -> list[str]:
              year = date[:4]
              month = str(int(date[5:7]))
              month2 = date[5:7]
              result = []
              for market in ('CNSESZ_STOCK', 'CNSESH_STOCK'):
                  for month_dir in (f'{year}-{month}', f'{year}-{month2}'):
                      for host in ('211.154.219.97:9494', '211.154.219.97%3A9494'):
                          result.append(
                              f'https://file.finance.sina.com.cn/{host}/MRGG/{market}/{year}/{month_dir}/{date}/{bulletin_id}.PDF'
                          )
              return list(dict.fromkeys(result))

          def discover_latest_quarter() -> tuple[str, str | None, list[str]]:
              list_pages = [
                  f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/sjdbg.phtml',
                  f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/sjdbg.phtml',
                  f'https://money.finance.sina.com.cn/corp/view/vCB_Bulletin.php?page_type=sjdbg&stockid={STOCK}&type=list',
                  f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_Bulletin.php/page_type/sjdbg.phtml?stockid={STOCK}',
                  f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK}.phtml',
                  f'https://money.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK}.phtml',
              ]
              details: list[str] = []
              for page in list_pages:
                  try:
                      final_url, text = fetch_html(page)
                      soup = BeautifulSoup(text, 'html.parser')
                      for a in soup.find_all('a', href=True):
                          title = compact_text(a.get_text(' ', strip=True))
                          if ('2026年第三季度报告' in title or '2026年三季度报告' in title) and '提示性公告' not in title:
                              details.append(urljoin(final_url, html.unescape(a.get('href', '')).strip()))
                  except Exception as exc:
                      print('QUARTER LIST FAILED', page, repr(exc))
              details = list(dict.fromkeys(details))
              candidates: list[str] = []
              bulletin_id = None
              detail = details[0] if details else 'https://www.cfi.net.cn/p20261028003026.html'
              for detail_url in details:
                  bulletin_id = extract_id(detail_url) or bulletin_id
                  candidates.extend(extract_pdf_urls_from_page(detail_url))
              if bulletin_id:
                  candidates.extend(sina_pdf_urls(bulletin_id, '2026-10-28'))
              # Public mirrors that may expose the original attachment.
              for page in [
                  'https://www.cfi.net.cn/p20261028003026.html',
                  'https://s.askci.com/stock/financialreport/300953/financefile/',
              ]:
                  candidates.extend(extract_pdf_urls_from_page(page))
              return detail, bulletin_id, list(dict.fromkeys(candidates))

          quarter_detail, quarter_id, quarter_urls = discover_latest_quarter()
          print('QUARTER DETAIL', quarter_detail, 'ID=', quarter_id, 'CANDIDATES=', len(quarter_urls))

          annual_direct = {
              2020: 'https://static.cninfo.com.cn/finalpage/2021-04-24/1209789949.PDF',
              2021: 'https://disc.static.szse.cn/disc/disk03/finalpage/2022-04-02/a6246f3c-0468-48d7-9951-972b56149b79.PDF',
              2022: 'https://disc.static.szse.cn/disc/disk03/finalpage/2023-03-31/5babf6d7-d7cd-4b73-99b5-1b0bfbce8577.PDF',
              2023: 'https://disc.static.szse.cn/disc/disk03/finalpage/2024-04-19/5c665327-15e6-415a-b50a-1b0856521aa0.PDF',
              2024: 'https://disc.static.szse.cn/disc/disk03/finalpage/2025-04-21/88374ffa-0cc7-4a1d-b514-d6b18617ffb5.PDF',
              2025: 'https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-23/7ad61fbf-a95f-4079-9f8f-f78b5dea2779.PDF',
          }
          annual_dates = {
              2020: '2021-04-24',
              2021: '2022-04-02',
              2022: '2023-04-01',
              2023: '2024-04-22',
              2024: '2025-04-22',
              2025: '2026-04-23',
          }

          documents = [
              {
                  'order': 1,
                  'kind': 'prospectus',
                  'year': 2021,
                  'title': '首次公开发行股票并在创业板上市招股说明书',
                  'date': '2021-03-15',
                  'file': '01_震裕科技_首次公开发行股票并在创业板上市招股说明书_2021-03-15.pdf',
                  'min_pages': 150,
                  'detail': 'https://data.eastmoney.com/notices/detail/300953/AN202103141471873785.html',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H2_AN202103141471873785_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AN202103141471873785_1.pdf',
                  ],
              },
          ]
          for idx, year in enumerate(range(2020, 2026), start=2):
              documents.append({
                  'order': idx,
                  'kind': 'annual',
                  'year': year,
                  'title': f'{year}年年度报告',
                  'date': annual_dates[year],
                  'file': f'{idx:02d}_震裕科技_{year}年年度报告.pdf',
                  'min_pages': 100,
                  'detail': f'https://money.finance.sina.com.cn/corp/view/vCB_Bulletin.php?page_type=ndbg&stockid={STOCK}&type=list',
                  'urls': [annual_direct[year]],
              })
          documents.append({
              'order': 8,
              'kind': 'quarter',
              'year': 2026,
              'title': '2026年第三季度报告',
              'date': '2026-10-28',
              'file': '08_震裕科技_2026年第三季度报告.pdf',
              'min_pages': 5,
              'detail': quarter_detail,
              'urls': quarter_urls,
          })

          def inspect(path: Path, doc: dict) -> tuple[bool, int, str]:
              try:
                  reader = PdfReader(str(path), strict=False)
                  pages = len(reader.pages)
                  if pages < int(doc['min_pages']):
                      return False, pages, f'page count below minimum: {pages}'
                  indexes = list(range(min(18, pages)))
                  if pages > 18:
                      indexes.append(pages - 1)
                  text = ''
                  for index in dict.fromkeys(indexes):
                      try:
                          text += '\n' + (reader.pages[index].extract_text() or '')
                      except Exception:
                          pass
                  compact = re.sub(r'\s+', '', text)
                  if '震裕科技' not in compact and '宁波震裕科技股份有限公司' not in compact:
                      return False, pages, 'company mismatch'
                  if doc['kind'] == 'prospectus':
                      if '招股说明书' not in compact or '首次公开发行股票' not in compact:
                          return False, pages, 'prospectus title mismatch'
                  elif doc['kind'] == 'annual':
                      year = str(doc['year'])
                      if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                          return False, pages, 'annual title mismatch'
                  else:
                      if ('第三季度报告' not in compact and '三季度报告' not in compact) or '2026' not in compact:
                          return False, pages, 'quarter title mismatch'
                  return True, pages, ''
              except Exception as exc:
                  return False, 0, repr(exc)

          def download(doc: dict) -> dict:
              destination = OUT / doc['file']
              candidates = list(doc.get('urls', []))
              candidates.extend(extract_pdf_urls_from_page(doc['detail']))
              candidates = list(dict.fromkeys(candidates))
              if not candidates:
                  raise RuntimeError(f'No PDF candidates for {doc["title"]}')
              last = None
              for url in candidates:
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'Referer': doc['detail'],
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(
                                  f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          ok, pages, reason = inspect(destination, doc)
                          if not ok:
                              raise RuntimeError(reason)
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', doc['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return {
                              **doc,
                              'pages': pages,
                              'bytes': len(data),
                              'source': response.url,
                              'sha256': sha,
                          }
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', doc['title'], url, repr(exc))
                          time.sleep(min(1 + attempt, 3))
              raise RuntimeError(f'Could not download {doc["title"]}: {last!r}')

          records = [download(doc) for doc in documents]
          records.sort(key=lambda item: item['order'])

          lines = [
              '震裕科技（300953）全部年报、招股说明书及最新季报资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：',
              '1. 2020—2025年度报告全文，共6份，不含年度报告摘要。',
              '2. 2021年3月15日披露的首次公开发行股票并在创业板上市招股说明书正式发行版。',
              '3. 截至2026年10月29日，最新已披露季度报告为2026年第三季度报告，披露日期为2026年10月28日。',
              '4. 未收录半年度报告、招股意向书、申报稿、年报摘要或其他临时公告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['file']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   原始PDF：{item['source']}",
                  f"   公告/索引页：{item['detail']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['file']}")
          lines += [
              f'合计：8份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件均已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '震裕科技|宁波震裕科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/zhenyu_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/zhenyu_test.zip "$PACKAGE"
          unzip -t /tmp/zhenyu_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/zhenyu_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f /tmp/zhenyu_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Zhenyu-300953-all-annual-reports-prospectus-latest-quarter
          path: 震裕科技_300953_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
