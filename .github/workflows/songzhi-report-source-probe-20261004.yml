name: Probe Songzhi deep report source URLs 20261004

on:
  push:
    paths:
      - '.github/workflows/songzhi-report-source-probe-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Probe report pages and candidate files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, json, requests
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          pages=[
            'https://www.9fzt.com/detail/sz_002454_10_575560525768.html',
            'https://www.9fzt.com/detail/sz_002454_10_574852966244.html',
            'https://www.9fzt.com/detail/sz_002454_10_573563348274.html',
            'https://www.9fzt.com/detail/sz_002454_10_565000369212.html',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/575560525768/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/574852966244/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/573563348274/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/565000369212/index.phtml',
          ]
          for url in pages:
            r=s.get(url,timeout=60)
            print('\nPAGE',r.status_code,len(r.content),r.url,flush=True)
            print('CONTENT_TYPE',r.headers.get('content-type'),flush=True)
            text=r.content.decode(r.apparent_encoding or 'utf-8','replace')
            for pat in [r'https?://[^\"\'<>\s]+', r'[^\"\'<>\s]{0,120}\.pdf[^\"\'<>\s]{0,120}', r'[^\"\'<>\s]{0,120}(?:download|attach|file|report|rptid)[^\"\'<>\s]{0,120}']:
              vals=[]
              for m in re.findall(pat,text,flags=re.I):
                if isinstance(m,tuple): m=''.join(m)
                if m not in vals: vals.append(m)
              for v in vals[:100]: print('MATCH',v,flush=True)
            scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,flags=re.I)
            for src in scripts:
              print('SCRIPT',urljoin(r.url,src),flush=True)
            print('HEAD',text[:2000].replace('\n',' '),flush=True)
          PY
