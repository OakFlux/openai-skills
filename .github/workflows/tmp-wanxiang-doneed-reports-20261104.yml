name: Build Wanxiang Doneed 600371 reports package

on:
  push:
    branches:
      - tmp-wanxiang-doneed-reports-20261104

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf beautifulsoup4

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='万向德农_600371_2020-2025年报及最新季报'
          rm -rf "$PACKAGE" /tmp/wanxiang_doneed_render
          mkdir -p "$PACKAGE" /tmp/wanxiang_doneed_render

          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('万向德农_600371_2020-2025年报及最新季报')
          TODAY = '2026-11-04'
          YEARS = list(range(2020, 2026))

          def session() -> requests.Session:
              s = requests.Session()
              s.trust_env = False
              retry = Retry(
                  total=7,
                  connect=7,
                  read=7,
                  status=7,
                  backoff_factor=1.0,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET', 'POST'],
                  raise_on_status=False,
              )
              adapter = HTTPAdapter(max_retries=retry)
              s.mount('https://', adapter)
              s.mount('http://', adapter)
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              })
              return s

          def strip_html(value: str) -> str:
              value = html.unescape(value or '')
              value = BeautifulSoup(value, 'html.parser').get_text('', strip=True)
              return re.sub(r'\s+', '', value)

          def query_cninfo() -> list[dict[str, Any]]:
              s = session()
              url = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              headers = {
                  'Referer': 'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search',
                  'Origin': 'https://www.cninfo.com.cn',
                  'X-Requested-With': 'XMLHttpRequest',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              }
              all_rows: list[dict[str, Any]] = []
              page = 1
              while page <= 10:
                  payload = {
                      'pageNum': str(page),
                      'pageSize': '100',
                      'column': 'sse',
                      'tabName': 'fulltext',
                      'plate': 'sh',
                      'stock': '600371,gssh0600371',
                      'searchkey': '',
                      'secid': '',
                      'category': '',
                      'trade': '',
                      'seDate': f'2021-01-01~{TODAY}',
                      'sortName': '',
                      'sortType': '',
                      'isHLtitle': 'true',
                  }
                  r = s.post(url, data=payload, headers=headers, timeout=(30, 150))
                  print('CNINFO_QUERY', page, r.status_code, len(r.content), r.headers.get('content-type'))
                  if r.status_code != 200:
                      raise RuntimeError(f'CNINFO query failed: HTTP {r.status_code}')
                  data = r.json()
                  rows = data.get('announcements') or []
                  print('CNINFO_ROWS', page, len(rows), 'total=', data.get('totalAnnouncement'))
                  all_rows.extend(rows)
                  if not data.get('hasMore') or not rows:
                      break
                  page += 1
              dedup: dict[str, dict[str, Any]] = {}
              for row in all_rows:
                  key = str(row.get('announcementId') or row.get('adjunctUrl') or '')
                  if key:
                      dedup[key] = row
              rows = list(dedup.values())
              rows.sort(key=lambda x: int(x.get('announcementTime') or 0), reverse=True)
              for row in rows:
                  print('ANN', row.get('announcementId'), dt.datetime.fromtimestamp((row.get('announcementTime') or 0)/1000).date() if row.get('announcementTime') else '', strip_html(str(row.get('announcementTitle') or '')), row.get('adjunctUrl'))
              return rows

          def select_reports(rows: list[dict[str, Any]]) -> list[dict[str, Any]]:
              selected: list[dict[str, Any]] = []
              exclude_terms = ['摘要', '英文版', '社会责任', 'ESG', '内部控制', '提示性公告', '监管工作函', '回复公告', '审计报告']
              for year in YEARS:
                  candidates = []
                  marker = f'{year}年年度报告'
                  for row in rows:
                      title = strip_html(str(row.get('announcementTitle') or ''))
                      if marker not in title:
                          continue
                      if any(term in title for term in exclude_terms):
                          continue
                      if '关于' in title and marker not in title[-18:]:
                          continue
                      adjunct = str(row.get('adjunctUrl') or '')
                      if not adjunct.lower().endswith('.pdf'):
                          continue
                      candidates.append(row)
                  if not candidates:
                      raise RuntimeError(f'No full annual report found for {year}')
                  candidates.sort(key=lambda x: (1 if '修订' in strip_html(str(x.get('announcementTitle') or '')) else 0, int(x.get('announcementTime') or 0)), reverse=True)
                  chosen = candidates[0]
                  selected.append({
                      'kind': 'annual',
                      'year': year,
                      'period': f'{year}年年度报告',
                      'filename': f'万向德农_600371_{year}年年度报告_全文.pdf',
                      'row': chosen,
                  })

              quarter_candidates = []
              for row in rows:
                  title = strip_html(str(row.get('announcementTitle') or ''))
                  if '季度报告' not in title:
                      continue
                  if any(term in title for term in ['摘要', '提示性公告', '更正', '取消']):
                      continue
                  adjunct = str(row.get('adjunctUrl') or '')
                  if not adjunct.lower().endswith('.pdf'):
                      continue
                  m = re.search(r'(20\d{2})年(第一|第三)季度报告', title)
                  if not m:
                      continue
                  quarter_candidates.append((int(row.get('announcementTime') or 0), row, m.group(0)))
              if not quarter_candidates:
                  raise RuntimeError('No formal quarterly report found')
              quarter_candidates.sort(key=lambda x: x[0], reverse=True)
              _, qrow, qperiod = quarter_candidates[0]
              selected.append({
                  'kind': 'quarter',
                  'year': int(qperiod[:4]),
                  'period': qperiod,
                  'filename': f'万向德农_600371_{qperiod}_全文.pdf',
                  'row': qrow,
              })
              return selected

          def download_one(item: dict[str, Any]) -> dict[str, Any]:
              row = item['row']
              adjunct = str(row.get('adjunctUrl') or '').lstrip('/')
              urls = [
                  f'https://static.cninfo.com.cn/{adjunct}',
                  f'http://static.cninfo.com.cn/{adjunct}',
              ]
              s = session()
              response = None
              data = b''
              errors = []
              for url in urls:
                  try:
                      r = s.get(url, headers={'Referer': 'https://www.cninfo.com.cn/'}, timeout=(30, 240), allow_redirects=True)
                      print('DOWNLOAD_ATTEMPT', item['period'], url, r.status_code, len(r.content), r.headers.get('content-type'), r.url)
                      if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 100_000:
                          response = r
                          data = r.content
                          break
                      errors.append(f'{url}: HTTP {r.status_code}, bytes={len(r.content)}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              if response is None:
                  raise RuntimeError(f"Download failed for {item['period']}: {'; '.join(errors)}")

              path = OUT / item['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if item['kind'] == 'annual' and pages < 60:
                  raise RuntimeError(f'{path.name}: suspiciously short annual report ({pages} pages)')
              if item['kind'] == 'quarter' and pages < 5:
                  raise RuntimeError(f'{path.name}: suspiciously short quarter report ({pages} pages)')

              probe_pages = list(range(min(8, pages)))
              if pages > 8:
                  probe_pages.extend(range(max(8, pages - 3), pages))
              text = ''.join((reader.pages[i].extract_text() or '') for i in probe_pages)
              compact = re.sub(r'\s+', '', text)
              if '万向德农' not in compact or '600371' not in compact:
                  raise RuntimeError(f'{path.name}: company name/code not found in sampled pages')
              if item['kind'] == 'annual':
                  if f"{item['year']}年年度报告" not in compact:
                      raise RuntimeError(f'{path.name}: annual-report title/year not found')
                  first = re.sub(r'\s+', '', reader.pages[0].extract_text() or '')
                  if '摘要' in first:
                      raise RuntimeError(f'{path.name}: annual-report summary detected')
              else:
                  if item['period'] not in compact:
                      raise RuntimeError(f"{path.name}: quarterly period '{item['period']}' not found")

              announcement_ms = int(row.get('announcementTime') or 0)
              disclosure_date = dt.datetime.fromtimestamp(announcement_ms / 1000, tz=dt.timezone.utc).date().isoformat() if announcement_ms else ''
              sha = hashlib.sha256(data).hexdigest()
              return {
                  'filename': path.name,
                  'kind': item['kind'],
                  'period': item['period'],
                  'title': strip_html(str(row.get('announcementTitle') or '')),
                  'disclosure_date': disclosure_date,
                  'pages': pages,
                  'bytes': len(data),
                  'source_url': response.url,
                  'announcement_id': str(row.get('announcementId') or ''),
                  'sha256': sha,
              }

          rows = query_cninfo()
          reports = select_reports(rows)
          if len(reports) != 7:
              raise RuntimeError(f'Expected 7 reports, selected {len(reports)}')
          print('SELECTED_REPORTS')
          for item in reports:
              row = item['row']
              print(item['period'], strip_html(str(row.get('announcementTitle') or '')), row.get('adjunctUrl'))

          records = []
          for item in reports:
              records.append(download_one(item))

          records.sort(key=lambda x: (0 if x['kind'] == 'annual' else 1, x['period']))
          total_pages = sum(x['pages'] for x in records)
          total_bytes = sum(x['bytes'] for x in records)
          lines = [
              '万向德农（600371）2020—2025年年度报告及最新季度报告',
              f'整理日期：{TODAY}',
              '',
              '收录口径：',
              '1. 年度报告收录2020—2025年度正式全文，共6份；排除年度报告摘要、英文版及其他非全文公告。',
              '2. 最新季度报告按公告披露时间确定，收录截至整理日最新正式季度报告。',
              '3. 文件来源为巨潮资讯正式公告附件；均已核验公司名称、证券代码、报告期、PDF结构、实际页数及首末页渲染。',
              '',
              '文件清单：',
          ]
          sums = []
          for i, rec in enumerate(records, 1):
              lines += [
                  f"{i}. {rec['filename']}",
                  f"   公告标题：{rec['title']}",
                  f"   披露日期：{rec['disclosure_date']}",
                  f"   页数：{rec['pages']}页",
                  f"   文件大小：{rec['bytes']}字节",
                  f"   来源：{rec['source_url']}",
                  f"   公告ID：{rec['announcement_id']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ]
              sums.append(f"{rec['sha256']}  {rec['filename']}")
          lines += [
              f'合计：{len(records)}份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅用于信息查阅，不构成投资建议。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000

            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l 8 "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -q '万向德农' "$pdf.txt"
            grep -q '600371' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/wanxiang_doneed_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/wanxiang_doneed_test.zip "$PACKAGE"
          unzip -t /tmp/wanxiang_doneed_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/wanxiang_doneed_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/wanxiang_doneed_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Wanxiang-Doneed-600371-annual-2020-2025-latest-quarter
          path: 万向德农_600371_2020-2025年报及最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
