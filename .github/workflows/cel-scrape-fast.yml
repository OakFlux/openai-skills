name: Scrape CEL official report pages fast

on:
  push:
    branches:
      - tmp/cel-report-scrape-fast-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Scrape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/html
          python - <<'PY'
          import json,re,urllib.parse,warnings,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib3.exceptions import InsecureRequestWarning
          warnings.simplefilter('ignore',InsecureRequestWarning)
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          s=requests.Session();s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages=[]
          for lang in ['cn','en','zh']:
            pages.append((f'{lang}_results',f'https://www.everbright.com/{lang}/investor-relations/results-announcements'))
            for y in range(2020,2026):
              pages.append((f'{lang}_{y}_annual',f'https://www.everbright.com/{lang}/results-announcements/{y}-annual-report'))
          pages += [
            ('cn_2026_interim_news','https://www.everbright.com/cn/news/%E5%85%89%E5%A4%A7%E6%8E%A7%E8%82%A1%E5%85%AC%E5%B8%832026%E5%B9%B4%E4%B8%AD%E6%9C%9F%E4%B8%9A%E7%BB%A9'),
            ('en_2026_interim_node','https://www.everbright.com/en/node/13761'),
            ('zh_2026_interim_node','https://www.everbright.com/zh/node/13760'),
          ]
          results=[]
          for name,u in pages:
            try:
              r=s.get(u,timeout=(8,18),verify=False,allow_redirects=True)
              print('FETCH',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path(f'out/html/{name}.html').write_bytes(r.content)
              links=[]
              soup=BeautifulSoup(r.content,'lxml')
              for tag,attr in [('a','href'),('iframe','src'),('embed','src'),('object','data'),('source','src'),('img','src')]:
                for x in soup.find_all(tag):
                  v=x.get(attr)
                  if not v:continue
                  full=urllib.parse.urljoin(r.url,v)
                  txt=' '.join(x.get_text(' ',strip=True).split())
                  if '.pdf' in full.lower() or '/docs/' in full.lower() or 'annual' in full.lower() or 'interim' in full.lower() or '年报' in txt or '中期' in txt or 'report' in txt.lower():
                    links.append({'tag':tag,'text':txt[:300],'url':full})
              for v in re.findall(r'(?:https?:)?//[^"\'<>\\s]+|/(?:sites|files|docs)/[^"\'<>\\s]+',r.text,re.I):
                full=urllib.parse.urljoin(r.url,v.replace('\\/','/'))
                if '.pdf' in full.lower() or '/docs/' in full.lower():links.append({'tag':'regex','text':'','url':full})
              uniq=[];seen=set()
              for x in links:
                if x['url'] in seen:continue
                seen.add(x['url']);uniq.append(x)
              for x in uniq: print('LINK',name,json.dumps(x,ensure_ascii=False),flush=True)
              results.append({'name':name,'request_url':u,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'links':uniq})
            except Exception as e:
              print('ERROR',name,repr(e),flush=True);results.append({'name':name,'request_url':u,'error':repr(e)})
          Path('out/manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cel-page-scrape
          path: out
          retention-days: 3