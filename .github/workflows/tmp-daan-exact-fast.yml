name: Temporary Daan Gene exact fast search

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-exact-fast.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Exact lookup
        run: |
          python - <<'PY'
          import json, requests
          queries=[
            '上半年业绩超预期 公司发展迎里程碑拐点',
            '三季度业绩超预期 产能扩建有望延续新冠优势',
            '后疫情时代新冠筛查从严 下半年业绩持续受益',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          ids=[]
          for q in queries:
            try:
              r=s.post('https://api.sdyanbao.com/api/file/search',json={'page':1,'pageSize':20,'keyword':q},timeout=30); r.raise_for_status(); rows=(r.json().get('data') or {}).get('files') or []
            except Exception as e:
              print('ERROR',q,repr(e)); continue
            print('QUERY',q,'COUNT',len(rows))
            for row in rows:
              print('ROW',json.dumps({k:row.get(k) for k in ['id','name','page_count','time_text','data_source_uuid','original_id','page_url']},ensure_ascii=False))
              ids.append(row.get('id'))
          for rid in sorted(set(x for x in ids if x)):
            try:
              d=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=30).json(); detail=(d.get('data') or {}) if d.get('status')==1 else {}
              print('DETAIL',json.dumps({'id':rid,'name':detail.get('name'),'page_count':detail.get('page_count'),'time_text':detail.get('time_text'),'organization':(detail.get('organization') or {}).get('name') if isinstance(detail.get('organization'),dict) else detail.get('organization'),'data_source_uuid':detail.get('data_source_uuid'),'original_id':detail.get('original_id'),'page_url':detail.get('page_url'),'file_size':detail.get('file_size'),'content_prefix':str(detail.get('content') or '')[:800]},ensure_ascii=False))
            except Exception as e: print('DETAIL_ERROR',rid,repr(e))
          PY
