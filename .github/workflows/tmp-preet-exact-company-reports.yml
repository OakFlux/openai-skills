name: Temporary Preet exact company research package

on:
  push:
    branches:
      - tmp/preet-broker-reports-20260830
    paths:
      - .github/workflows/tmp-preet-exact-company-reports.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF Pillow
      - name: Download, validate, and package selected company reports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw

          reports = [
              {
                  'date': '2023-07-21',
                  'org': '开源证券',
                  'title': '公司深度报告：钠锂共举，拥抱储能大时代',
                  'code': 'AP202307211592545151',
              },
              {
                  'date': '2022-09-26',
                  'org': '开源证券',
                  'title': '公司首次覆盖报告：改性塑料主业扎实，重码储能打造新增长曲线',
                  'code': 'AP202209261578680319',
              },
              {
                  'date': '2020-01-02',
                  'org': '国金证券',
                  'title': '改性塑料迎来拐点，攻关5G新材料LCP',
                  'code': 'AP202001021373339114',
              },
          ]

          OUT = Path('preet_exact')
          PDFDIR = OUT / 'pdfs'
          RENDERDIR = OUT / 'renders'
          for path in (OUT, PDFDIR, RENDERDIR):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })
          records = []
          render_entries = []

          def clean(value, limit=100):
              text = re.sub(r'[\\/:*?"<>|\r\n]+', '_', str(value or '')).strip(' ._')
              return (text or 'report')[:limit]

          for meta in reports:
              data = None
              source_url = None
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{meta['code']}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H3_{meta['code']}.pdf",
              ]
              for url in urls:
                  response = session.get(
                      url,
                      timeout=90,
                      allow_redirects=True,
                      headers={'Referer': 'https://data.eastmoney.com/', 'Accept': 'application/pdf,*/*;q=0.8'},
                  )
                  print('DOWNLOAD', response.status_code, len(response.content), response.headers.get('content-type'), response.url, flush=True)
                  if response.status_code == 200 and len(response.content) > 50_000 and response.content.lstrip().startswith(b'%PDF'):
                      data = response.content
                      source_url = response.url
                      break
              if data is None:
                  raise RuntimeError(f"Failed to download {meta['title']}")

              digest = hashlib.sha256(data).hexdigest()
              temp = PDFDIR / f'_tmp_{digest[:12]}.pdf'
              temp.write_bytes(data)
              doc = pymupdf.open(str(temp))
              pages = doc.page_count
              if pages < 12:
                  raise RuntimeError(f"Unexpectedly short report: {meta['title']} ({pages} pages)")
              sample_indices = sorted(set([0, 1, min(5, pages - 1), pages // 2, pages - 1]))
              text = '\n'.join(doc.load_page(index).get_text('text') for index in sample_indices)
              compact = re.sub(r'\s+', '', text)
              if not any(key in compact for key in ['普利特', '002324', '上海普利特复合材料股份有限公司']):
                  raise RuntimeError(f"Company identity validation failed: {meta['title']}")
              stem = clean(meta['title'], 55)
              for label, index in [('first', 0), ('middle', pages // 2), ('last', pages - 1)]:
                  pix = doc.load_page(index).get_pixmap(matrix=pymupdf.Matrix(0.8, 0.8), alpha=False)
                  render_path = RENDERDIR / f'{stem}_{label}.png'
                  pix.save(str(render_path))
                  render_entries.append((f'{stem}-{label}', render_path))
              encrypted = bool(doc.is_encrypted)
              doc.close()

              filename = f"{meta['date']}_{meta['org']}_{clean(meta['title'], 90)}_{pages}页_原始PDF.pdf"
              final = PDFDIR / filename
              final.unlink(missing_ok=True)
              temp.rename(final)
              records.append({
                  **meta,
                  'file': filename,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'encrypted': encrypted,
                  'source_url': source_url,
              })
              print('VALIDATED', json.dumps(records[-1], ensure_ascii=False), flush=True)

          if len(records) != 3 or len({item['sha256'] for item in records}) != 3:
              raise RuntimeError('Report count or duplicate check failed')

          thumbnails = []
          for label, image_path in render_entries:
              with Image.open(image_path) as image:
                  image = image.convert('RGB')
                  image.thumbnail((280, 365))
                  canvas = Image.new('RGB', (300, 405), 'white')
                  canvas.paste(image, ((300 - image.width) // 2, 10))
                  ImageDraw.Draw(canvas).text((8, 382), label[:48], fill='black')
                  thumbnails.append(canvas)
          columns = 3
          rows = (len(thumbnails) + columns - 1) // columns
          sheet = Image.new('RGB', (columns * 300, rows * 405), 'white')
          for index, thumbnail in enumerate(thumbnails):
              sheet.paste(thumbnail, ((index % columns) * 300, (index // columns) * 405))
          sheet.save(OUT / 'contact_sheet.jpg', quality=88)

          (OUT / 'selected_reports.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          readme = [
              '普利特（002324.SZ）券商深度报告下载包',
              '',
              '完整原始PDF数量：3份',
              '',
          ]
          for index, item in enumerate(records, 1):
              readme.append(f"{index}. {item['date']}｜{item['org']}｜{item['title']}｜{item['pages']}页")
          readme += [
              '',
              '三份均以普利特为主要研究主体，属于公司深度、首次覆盖或系统性公司研究；未收录行业周报、短篇财报点评、网页摘要或缺页预览。',
              '已核验PDF文件头、公司名称及证券代码、实际页数和加密状态，并检查首页、中间页与末页；ZIP完整性测试通过。',
              '版权归原发布机构及作者所有，仅供研究参考。',
          ]
          (OUT / 'README.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(f"{item['sha256']}  {item['file']}" for item in records) + '\n', encoding='utf-8')

          zip_path = OUT / 'preet_company_deep_reports_3.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(PDFDIR.glob('*.pdf')):
                  archive.write(path, path.name)
              for name in ['README.txt', 'selected_reports.json', 'SHA256SUMS.txt']:
                  archive.write(OUT / name, name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              if len([name for name in archive.namelist() if name.lower().endswith('.pdf')]) != 3:
                  raise RuntimeError('ZIP PDF count failed')
          print((OUT / 'README.txt').read_text(encoding='utf-8'))
          print('FINAL_ZIP', zip_path.stat().st_size, flush=True)
          PY
      - name: Upload corrected package
        uses: actions/upload-artifact@v4
        with:
          name: preet-exact-company-reports
          path: preet_exact/
          retention-days: 3
          if-no-files-found: error
