name: Build Ningbo Port final report package v2 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-final-report-package-v2-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pillow img2pdf pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, shutil, subprocess, time, zipfile
          from pathlib import Path
          import img2pdf, requests
          from PIL import Image
          from pypdf import PdfReader, PdfWriter

          work=Path('work'); raw=work/'raw'; images=work/'images'; final=work/'final'; out=Path('artifact_out')
          for p in (raw,images,final,out): p.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Accept':'application/pdf,image/*,*/*;q=0.8'})

          def get(url,target,referer,min_bytes):
              err=None
              for n in range(1,4):
                  try:
                      r=s.get(url,headers={'Referer':referer},timeout=(20,120),allow_redirects=True)
                      print('GET',n,r.status_code,len(r.content),r.headers.get('content-type'),url,flush=True)
                      if r.status_code==200 and len(r.content)>=min_bytes:
                          target.write_bytes(r.content)
                          return {'source_url':url,'final_url':r.url,'content_type':r.headers.get('content-type')}
                      err=RuntimeError(f'HTTP {r.status_code}; {len(r.content)} bytes')
                  except Exception as e: err=e
                  time.sleep(n)
              raise RuntimeError(f'{url}: {err!r}')

          def check_pdf(path,expected=None):
              data=path.read_bytes()
              if not data.startswith(b'%PDF-'): raise RuntimeError(f'Not PDF: {path}')
              pages=len(PdfReader(str(path),strict=False).pages)
              if expected and pages!=expected: raise RuntimeError(f'Page mismatch {pages}!={expected}: {path}')
              q=subprocess.run(['qpdf','--check',str(path)],capture_output=True,text=True)
              if q.returncode not in (0,3): raise RuntimeError(q.stderr[-1000:])
              return {'pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}

          def metadata_copy(src,dst,title,author):
              rd=PdfReader(str(src),strict=False); wr=PdfWriter()
              for pg in rd.pages: wr.add_page(pg)
              wr.add_metadata({'/Title':title,'/Author':author,'/Subject':'宁波港（601018）券商研究报告','/Creator':'公开高清页图按原序无损合成'})
              with dst.open('wb') as f: wr.write(f)

          records=[]
          originals=[
              {'filename':'01_2026-09-01_西南证券_首次覆盖_打造世界级港口集群.pdf','date':'2026-09-01','broker':'西南证券','authors':['胡光怿','杨蕊'],'title':'2026年半年报点评：打造世界级港口集群，主营业务利润稳健','url':'https://pdf.dfcfw.com/pdf/H3_AP202609011828891233_1.pdf','page':'https://data.eastmoney.com/report/info/AP202609011828891233.html','expected':12,'format':'原始PDF'},
              {'filename':'04_2023-11-07_太平洋证券_首次覆盖_收购大榭码头贡献第三季度业绩.pdf','date':'2023-11-07','broker':'太平洋证券','authors':['程志峰'],'title':'2023年Q3点评，收购大榭码头，贡献第三季度业绩','url':'https://pdf.dfcfw.com/pdf/H3_AP202311071609246534_1.pdf','page':'https://data.eastmoney.com/report/info/AP202311071609246534.html','expected':4,'format':'原始PDF（短篇首次覆盖）'},
          ]
          for i,spec in enumerate(originals):
              p=raw/f'original_{i}.pdf'
              try:
                  net=get(spec['url'],p,spec['page'],30000)
                  val=check_pdf(p,spec['expected'])
                  shutil.copy2(p,final/spec['filename'])
                  records.append({**spec,**net,**val,'source_page':spec['page']})
              except Exception as e: print('ORIGINAL_ERR',spec['filename'],repr(e),flush=True)

          deep_specs=[
              {'filename':'02_2017-10-10_安信证券_公司深度分析_非凡大港斩获殊勋茂绩.pdf','date':'2017-10-10','date_path':'2017/10/10','doc':'118940','broker':'安信证券','authors':['胡光怿'],'title':'宁波港公司深度分析：非凡大港斩获殊勋茂绩，多重政策催发上行量能','pages':21},
              {'filename':'03_2013-02-04_中泰证券_守正出奇的综合港口物流运营商.pdf','date':'2013-02-04','date_path':'2013/02/04','doc':'1690672','broker':'中泰证券','authors':['李周'],'title':'守正出奇的综合港口物流运营商','pages':17},
              {'filename':'05_2010-09-15_国金证券_腹地资源与水深优势成就国际综合大港.pdf','date':'2010-09-15','date_path':'2010/09/15','doc':'1608827','broker':'国金证券','authors':['李光华'],'title':'腹地资源＋水深优势成就国际综合大港','pages':29},
          ]
          compiled=[]
          for spec in deep_specs:
              d=images/spec['doc']; d.mkdir(parents=True,exist_ok=True)
              files=[]; ok=True
              for n in range(1,spec['pages']+1):
                  u=f"https://public.fxbaogao.com/report-image/{spec['date_path']}/{spec['doc']}-{n}.png"
                  p=d/f'{n:03d}.png'
                  try:
                      get(u,p,f"https://www.fxbaogao.com/view?id={spec['doc']}",8000)
                      with Image.open(p) as im: im.verify()
                      files.append(p)
                  except Exception as e:
                      print('IMAGE_ERR',spec['doc'],n,repr(e),flush=True); ok=False; break
              if not ok or len(files)!=spec['pages']: continue
              tmp=raw/f"{spec['doc']}_tmp.pdf"; dst=final/spec['filename']
              tmp.write_bytes(img2pdf.convert([str(p) for p in files]))
              metadata_copy(tmp,dst,spec['title'],spec['broker'])
              val=check_pdf(dst,spec['pages'])
              rec={**spec,**val,'format':'公开高清页面无损合成PDF（内容完整，非券商原始PDF容器）','source_page':f"https://www.fxbaogao.com/view?id={spec['doc']}",'source_image_pattern':f"https://public.fxbaogao.com/report-image/{spec['date_path']}/{spec['doc']}-PAGE.png"}
              records.append(rec); compiled.append(rec)
              print('COMPILED',json.dumps(rec,ensure_ascii=False),flush=True)
              if len(compiled)>=2: break

          current=[r for r in records if r['date']=='2026-09-01']
          deep=[r for r in records if '页面无损合成' in r.get('format','')]
          deep.sort(key=lambda r:r['pages'],reverse=True)
          short=[r for r in records if r not in current and r not in deep]
          selected=(current+deep+short)[:3]
          if len(selected)<2: raise RuntimeError(f'Only {len(selected)} reports obtained')
          keep={r['filename'] for r in selected}
          for p in final.glob('*.pdf'):
              if p.name not in keep: p.unlink()

          lines=['宁波港（601018.SH，宁波舟山港股份有限公司）券商研究报告精选','整理日期：2026-09-28','','筛选原则：优先公司深度、首次覆盖和长篇专题；排除财报正文与网页摘要。','格式说明：原始PDF保持公开源文件；高清页面合成PDF由同一公开报告的全部高清页图按原页序无损合成，内容完整，但PDF容器并非券商原文件。','','文件清单：']
          for i,r in enumerate(selected,1):
              lines += [f'{i}. {r["filename"]}',f'   券商：{r["broker"]}；日期：{r["date"]}；页数：{r["pages"]}',f'   标题：{r["title"]}',f'   格式：{r["format"]}',f'   来源页：{r["source_page"]}',f'   SHA-256：{r["sha256"]}','']
          lines.append('完整性核验：已检查PDF文件头、实际页数、qpdf结构、首末页、SHA-256与ZIP CRC。')
          (final/'00_文件清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (final/'manifest.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          (final/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in selected),encoding='utf-8')

          package=f'宁波港_601018_券商深度报告_{len(selected)}份'
          zpath=out/f'{package}.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(final.iterdir()): z.write(p,arcname=f'{package}/{p.name}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len(pdfs)!=len(selected): raise RuntimeError('ZIP PDF count mismatch')
          print('SELECTED',json.dumps(selected,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-broker-deep-reports-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
