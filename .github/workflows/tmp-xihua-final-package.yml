name: Temporary Xihua Technology final broker report package

on:
  push:
    branches: [tmp-xihua-final-package-20260830]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare validation tools
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf
      - name: Download validate and package public original PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          info_code = 'AP202512071795796064'
          url = f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf'
          out = Path('package')
          out.mkdir(exist_ok=True)
          pdf_name = '01_Huajin_Securities_20251207_Xihua_Technology_New_Stock_Coverage_11p.pdf'
          pdf_path = out / pdf_name

          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/pdf,*/*'
          })
          r = s.get(url, timeout=120, allow_redirects=True)
          print('DOWNLOAD', r.status_code, len(r.content), r.headers.get('content-type'), r.url)
          r.raise_for_status()
          if not r.content.startswith(b'%PDF-') or len(r.content) < 100000:
              raise RuntimeError('Downloaded object is not a valid full PDF')
          pdf_path.write_bytes(r.content)

          reader = PdfReader(str(pdf_path), strict=False)
          pages = len(reader.pages)
          if pages != 11:
              raise RuntimeError(f'Unexpected page count: {pages}, expected 11')
          text = ''
          for pg in reader.pages[:min(6, pages)]:
              try:
                  text += pg.extract_text() or ''
              except Exception:
                  pass
          compact = re.sub(r'\s+', '', text)
          if '锡华科技' not in compact or '603248' not in compact:
              raise RuntimeError('Company identity check failed')

          sha256 = hashlib.sha256(r.content).hexdigest()
          manifest = {
              'company': '江苏锡华新能源科技股份有限公司',
              'stock_name': '锡华科技',
              'stock_code': '603248',
              'broker': '华金证券',
              'analyst': '李蕙',
              'report_date': '2025-12-07',
              'title': '新股覆盖研究：锡华科技',
              'pages': pages,
              'bytes': len(r.content),
              'source_url': r.url,
              'info_code': info_code,
              'sha256': sha256,
              'validation': ['PDF header', 'page count', 'company name', 'stock code', 'text extractability', 'ZIP integrity']
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          readme = f'''锡华科技（603248）券商研报下载包

已收录：1份公开可获取的完整原始PDF

1. 华金证券｜2025-12-07｜11页
   标题：新股覆盖研究：锡华科技
   分析师：李蕙
   文件：{pdf_name}
   SHA-256：{sha256}

核验项目：PDF文件头、实际页数、公司名称、证券代码、文本可解析性、ZIP完整性。

检索说明：截至2026-08-30，东方财富个股研报索引与水滴研报公开索引均仅检出上述同一份公司级券商研究报告。未使用招股书、发行公告、公司年报或自动生成资讯凑数。
'''
          (out / 'README_报告清单.txt').write_text(readme, encoding='utf-8')

          zip_path = Path('Xihua_Technology_Broker_Report_Public_1.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(out.iterdir()):
                  z.write(p, arcname=p.name)
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              print('ZIP_CONTENTS', z.namelist())
          print('FINAL', zip_path, zip_path.stat().st_size)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False))
          PY
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Xihua_Technology_Broker_Report_Public_1
          path: |
            Xihua_Technology_Broker_Report_Public_1.zip
            package/*.pdf
            package/README_报告清单.txt
            package/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
