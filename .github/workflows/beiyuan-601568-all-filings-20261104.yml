name: Build Beiyuan 601568 all filings 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beiyuan-601568-all-filings-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '601568'
          CURRENT = '北元化工'
          OLD = '北元集团'
          FULL = '陕西北元化工集团股份有限公司'
          PACKAGE = '北元化工_601568_全部年报_招股说明书_最新季报'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          items = [
              {
                  'label': '2020年年度报告', 'kind': 'annual', 'year': 2020,
                  'required_tokens': ['2020年年度报告'], 'min_pages': 150,
                  'announcement_date': '2021-04-20',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-20/7064294.PDF',
                  ],
              },
              {
                  'label': '2021年年度报告', 'kind': 'annual', 'year': 2021,
                  'required_tokens': ['2021年年度报告'], 'min_pages': 150,
                  'announcement_date': '2022-04-20',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-20/8011567.PDF',
                  ],
              },
              {
                  'label': '2022年年度报告', 'kind': 'annual', 'year': 2022,
                  'required_tokens': ['2022年年度报告'], 'min_pages': 150,
                  'announcement_date': '2023-04-19',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-19/9007738.PDF',
                      'https://static.stockstar.com/announcement/stock/2023-04-19/1216456496.PDF',
                  ],
              },
              {
                  'label': '2023年年度报告', 'kind': 'annual', 'year': 2023,
                  'required_tokens': ['2023年年度报告'], 'min_pages': 150,
                  'announcement_date': '2024-04-19',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-19/9994340.PDF',
                      'https://notice.10jqka.com.cn/api/pdf/a448ae75e5648f37.pdf',
                  ],
              },
              {
                  'label': '2024年年度报告', 'kind': 'annual', 'year': 2024,
                  'required_tokens': ['2024年年度报告'], 'min_pages': 150,
                  'announcement_date': '2025-04-24',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-24/10943028.PDF',
                  ],
              },
              {
                  'label': '2025年年度报告', 'kind': 'annual', 'year': 2025,
                  'required_tokens': ['2025年年度报告'], 'min_pages': 150,
                  'announcement_date': '2026-04-23',
                  'urls': [
                      'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-23/601568_20260423_ILLR.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-23/12139909.PDF',
                  ],
              },
              {
                  'label': '首次公开发行股票招股说明书', 'kind': 'prospectus', 'year': 2020,
                  'required_tokens': ['首次公开发行股票招股说明书'], 'min_pages': 700,
                  'announcement_date': '2020-09-29',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2020/2020-9/2020-09-29/6636571.PDF',
                  ],
              },
              {
                  'label': '2026年第三季度报告', 'kind': 'quarter', 'year': 2026,
                  'required_tokens': ['2026年第三季度报告'], 'min_pages': 5,
                  'announcement_date': '2026-10-30',
                  'urls': [
                      'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/601568_20261030_P6XB.pdf',
                      'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/601568_20261030_EIC2.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-30/12675673.PDF',
                  ],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          manifest = []
          identities = (CURRENT, OLD, FULL, CODE, '北元化工集团', 'BEIYUAN GROUP')

          for idx, item in enumerate(items, 1):
              data = None
              source_url = ''
              attempts = []
              for url in item['urls']:
                  for attempt in range(5):
                      try:
                          if 'sina.com.cn' in url:
                              referer = 'https://money.finance.sina.com.cn/'
                          elif 'sse.com.cn' in url:
                              referer = 'https://www.sse.com.cn/'
                          elif '10jqka.com.cn' in url:
                              referer = 'https://notice.10jqka.com.cn/'
                          elif 'stockstar.com' in url:
                              referer = 'https://stock.stockstar.com/'
                          else:
                              referer = 'https://www.cninfo.com.cn/'
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url, 'attempt': attempt + 1,
                              'status': r.status_code, 'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f'Download failed for {item["label"]}: {attempts}')

              filename = f'{idx:02d}_北元化工_{item["label"]}.pdf'
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(80, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in identities if normalize(x) in compact]
              title_hits = [x for x in item['required_tokens'] if normalize(x) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')
              if len(compact) > 500 and not title_hits:
                  raise RuntimeError(f'Report title mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              record = {
                  'label': item['label'],
                  'kind': item['kind'],
                  'report_year': item['year'],
                  'announcement_date': item['announcement_date'],
                  'source_url': source_url,
                  'candidate_urls': item['urls'],
                  'filename': str(Path('原始PDF') / filename),
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'title_hits': title_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'report title', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              }
              manifest.append(record)
              print('VERIFIED', record['label'], record['pages'], record['bytes'], record['sha256'], record['source_url'])

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '陕西北元化工集团股份有限公司（601568.SH）公开披露文件资料包',
              '整理日期：2026-11-04', '',
              '收录范围：上市后全部年度报告全文（2020—2025年）、首次公开发行股票招股说明书最终发行版，以及截至整理日最新披露的2026年第三季度报告。',
              '公司证券简称自2026年5月13日起由“北元集团”变更为“北元化工”，证券代码601568保持不变；历史报告中的旧简称属于正常情况。',
              '不收录年度报告摘要、招股说明书摘要、招股意向书、申报稿、半年度报告或普通公告页面。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["label"]}',
                  f'   页数：{x["pages"]}页；文件：{x["filename"]}',
                  f'   披露日期：{x["announcement_date"]}',
                  f'   来源：{x["source_url"]}',
                  f'   SHA-256：{x["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '核验项目：PDF文件头、公司名称/证券代码、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('beiyuan_601568_all_annual_reports_prospectus_latest_quarter.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: beiyuan-601568-all-filings-final
          path: |
            北元化工_601568_全部年报_招股说明书_最新季报.zip
            beiyuan_601568_all_annual_reports_prospectus_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
