name: Probe Longxi Microbell Page Images

on:
  push:
    branches:
      - tmp-longxi-600592-broker-reports-20261004

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests pillow
      - name: Probe page image naming patterns
        shell: bash
        run: |
          python - <<'PY'
          import io, hashlib, requests
          from PIL import Image
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.microbell.com/'})
          base_prefix='https://huibobjb.hibor.com.cn/CheckMd5File/img/2025/7/'
          stem='202507202237559702'
          urls=[]
          # sequential integer suffix around the known file
          n=int(stem)
          for delta in range(-10,101):
              urls.append(f'{base_prefix}{n+delta}.gif')
          # common page-index patterns
          for i in range(1,60):
              urls += [
                f'{base_prefix}{stem}_{i}.gif',
                f'{base_prefix}{stem}-{i}.gif',
                f'{base_prefix}{stem}{i}.gif',
                f'{base_prefix}{stem}_{i:02d}.gif',
                f'{base_prefix}{stem}-{i:02d}.gif',
              ]
          seen=set()
          hits=[]
          for u in urls:
              if u in seen: continue
              seen.add(u)
              try:
                  r=s.get(u,timeout=12)
                  if r.status_code==200 and len(r.content)>5000 and r.content[:3]==b'GIF':
                      try:
                          im=Image.open(io.BytesIO(r.content))
                          dim=im.size
                      except Exception as e:
                          dim=('ERR',str(e))
                      h=hashlib.sha256(r.content).hexdigest()[:16]
                      hits.append((u,len(r.content),dim,h))
                      print('HIT',u,len(r.content),dim,h)
              except Exception:
                  pass
          print('TOTAL_HITS',len(hits))
          PY
