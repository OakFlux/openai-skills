name: Probe NESC search API for Jingxue

on:
  push:
    branches:
      - tmp-nesc-search-api-probe-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect search page and scripts
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          u='https://www.nesc.cn/main/home/search/index.shtml'
          r=s.get(u,timeout=(20,90));r.encoding=r.apparent_encoding or 'utf-8'
          text=html.unescape(r.text).replace('\\/','/')
          print('PAGE',r.status_code,len(r.content),r.url,r.encoding)
          print(text[:15000])
          soup=BeautifulSoup(text,'html.parser')
          scripts=[]
          for tag in soup.find_all('script',src=True):
              src=urljoin(r.url,tag.get('src'))
              if src not in scripts: scripts.append(src)
          print('SCRIPTS',scripts)
          for src in scripts:
              if any(k in src.lower() for k in ['search','main','common','index','site']):
                  try:
                      q=s.get(src,timeout=(20,90));q.encoding=q.apparent_encoding or q.encoding or 'utf-8'
                      body=html.unescape(q.text).replace('\\/','/')
                      print('\nSCRIPT',src,q.status_code,len(q.content))
                      for pat in ['search','keyword','content','ajax','api','query']:
                          pos=0;n=0
                          while n<20:
                              i=body.lower().find(pat.lower(),pos)
                              if i<0: break
                              print('CTX',pat,body[max(0,i-600):i+1600])
                              pos=i+len(pat);n+=1
                  except Exception as e: print('SCRIPT_ERROR',src,repr(e))
          # Try common GET/POST parameter names.
          candidates=[
            ('GET',u,{'keyword':'晶雪节能'}),('GET',u,{'searchContent':'晶雪节能'}),('GET',u,{'q':'晶雪节能'}),
            ('POST',u,{'keyword':'晶雪节能'}),('POST',u,{'searchContent':'晶雪节能'}),
            ('GET','https://www.nesc.cn/main/home/search/search.shtml',{'keyword':'晶雪节能'}),
            ('POST','https://www.nesc.cn/main/home/search/search.shtml',{'keyword':'晶雪节能'}),
          ]
          for method,url,data in candidates:
              try:
                  z=s.request(method,url,params=data if method=='GET' else None,data=data if method=='POST' else None,timeout=(20,90),allow_redirects=True)
                  z.encoding=z.apparent_encoding or z.encoding or 'utf-8'
                  compact=re.sub(r'\s+',' ',html.unescape(z.text))
                  print('\nTRY',method,z.url,z.status_code,len(z.content),'COUNT',compact.count('晶雪节能'))
                  if '晶雪节能' in compact:
                      i=compact.find('晶雪节能');print(compact[max(0,i-1000):i+3000])
              except Exception as e: print('TRY_ERROR',method,url,repr(e))
          PY
