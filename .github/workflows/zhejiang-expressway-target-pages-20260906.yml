name: Inspect target pages for Zhejiang Expressway reports 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-target-pages-20260906.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch public report landing pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages
          python - <<'PY'
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          out=Path('pages')
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls={
            'sgpjbg':'https://www.sgpjbg.com/baogao/630574.html',
            'microbell':'http://www.microbell.com/repinfodetail_4082796.html',
            'huiyun':'http://www.huiyunyan.com/doc-18f0ef4ece1f6dc54468701b47d04a01.html',
            'wenku360':'https://wenku.so.com/d/f9b7c25f61dd8af1841819564e3db787?src=ob_zz_juhe360wenku'
          }
          records=[]
          for key,u in urls.items():
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('REQ',key,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
              (out/f'{key}.html').write_bytes(r.content)
              rec={'key':key,'url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'bytes':len(r.content)};records.append(rec)
              soup=BeautifulSoup(r.text,'html.parser');print('TITLE',key,soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for tag in soup.find_all(['a','iframe','embed','object','script','img','source','input']):
                for attr in ['href','src','data','value']:
                  v=tag.get(attr)
                  if not v:continue
                  full=urllib.parse.urljoin(r.url,str(v)); blob=(full+' '+tag.get_text(' ',strip=True)+' '+str(tag.attrs)).lower()
                  if any(x in blob for x in ['.pdf','download','file','report','preview','viewer','read','doc']):
                    print('LINK',key,tag.name,attr,full,flush=True)
              for m in re.finditer(r'(?i).{0,200}(?:\.pdf|download|fileurl|file_url|reporturl|preview|viewer|oss).{0,600}',r.text):
                print('HIT',key,repr(m.group(0)[:900]),flush=True)
            except Exception as e:print('ERR',key,repr(e),flush=True)
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
        env:
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-target-pages
          path: pages/
          retention-days: 7
