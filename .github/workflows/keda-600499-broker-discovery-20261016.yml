name: Discover KEDA 600499 broker deep reports 20261016

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keda-600499-broker-discovery-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney broker report index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          import requests

          STOCK='600499'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          rows=[]
          for page in range(1,10):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
                  'ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31',
                  'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':STOCK,
                  'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
              }
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,120))
              r.raise_for_status(); data=r.json(); batch=data.get('data') or []
              print('PAGE',page,'HITS',data.get('hits'),'ROWS',len(batch))
              if not batch: break
              rows.extend(batch)
              if len(batch)<100: break
              time.sleep(.1)

          deep_words=['深度','首次覆盖','公司深度','投资价值','专题研究','陶机','非洲建材','锂电材料','蓝科锂业','海外','全球化','成长','龙头','双轮驱动','战略转型']
          short_words=['点评','快报','季报','半年报','年报点评','业绩预告','业绩快报','事件点评','更新报告','跟踪报告']
          seen=set(); out=[]
          for row in rows:
              code=str(row.get('infoCode') or '')
              if not code or code in seen: continue
              seen.add(code)
              title=str(row.get('title') or '')
              pages=int(row.get('attachPages') or 0)
              score=pages
              score += sum(18 for w in deep_words if w in title)
              score -= sum(20 for w in short_words if w in title)
              if pages>=20: score += 20
              if pages>=30: score += 20
              if pages>=40: score += 10
              item={
                  'title':title,'stockName':row.get('stockName'),'stockCode':row.get('stockCode'),
                  'orgName':row.get('orgName'),'orgSName':row.get('orgSName'),'publishDate':row.get('publishDate'),
                  'infoCode':code,'attachPages':pages,'attachSize':row.get('attachSize'),
                  'rating':row.get('emRatingName') or row.get('sRatingName'),'researcher':row.get('researcher'),
                  'column':row.get('column'),'reportType':row.get('reportType'),'deepScore':score,
              }
              url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'
              item['pdf_url']=url
              try:
                  rr=s.get(url,timeout=(20,180),allow_redirects=True,headers={
                      'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/report/',
                      'Accept':'application/pdf,*/*;q=0.8'
                  })
                  item.update({'pdf_status':rr.status_code,'pdf_bytes':len(rr.content),'pdf_head':rr.content[:5].decode('latin1','replace')})
              except Exception as exc:
                  item['pdf_error']=repr(exc)
              out.append(item)
          out.sort(key=lambda x:(x.get('deepScore') or 0,str(x.get('publishDate') or '')),reverse=True)
          print('TOTAL',len(out))
          for x in out[:80]:
              print('REPORT_JSON',json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY
