name: Temporary Qiule Seed broker report collection

on:
  push:
    branches:
      - tmp/qiule-seed-reports-20260829
    paths:
      - .github/workflows/tmp-qiule-seed-reports.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 Pillow PyMuPDF img2pdf
      - name: Discover, download, validate, and package reports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import fitz
          import img2pdf
          import requests
          from PIL import Image

          OUT = Path('qiule_output')
          PDFDIR = OUT / 'pdfs'
          IMGDIR = OUT / 'images'
          RENDERDIR = OUT / 'renders'
          for p in (OUT, PDFDIR, IMGDIR, RENDERDIR):
              p.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })
          logs: list[str] = []
          candidates: list[dict] = []
          downloaded: list[dict] = []

          def note(*parts):
              text = ' '.join(str(x) for x in parts)
              print(text, flush=True)
              logs.append(text)

          def clean(text: object, limit: int = 100) -> str:
              value = re.sub(r'[\\/:*?"<>|\r\n]+', '_', str(text or '')).strip(' ._')
              return (value or 'report')[:limit]

          def company_match(text: str) -> bool:
              compact = re.sub(r'\s+', '', text or '')
              return ('秋乐种业' in compact) or ('831087' in compact) or ('920087' in compact)

          def add_candidate(item: dict):
              title = str(item.get('title') or item.get('name') or '')
              if not company_match(title + ' ' + str(item.get('stock') or '')):
                  return
              key = (
                  item.get('data_source_uuid') or item.get('infoCode') or '',
                  title,
                  str(item.get('date') or item.get('time_text') or '')[:10],
              )
              if any(x.get('_key') == key for x in candidates):
                  return
              item['_key'] = key
              candidates.append(item)
              note('CANDIDATE', json.dumps(item, ensure_ascii=False)[:1500])

          # 1) Public SDYanbao catalogue and detail records.
          sd = requests.Session()
          sd.headers.update({
              'User-Agent': session.headers['User-Agent'],
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/',
          })
          queries = [
              '秋乐种业',
              '831087',
              '乘政策东风 做科技强企',
              '国内玉米种业领军者业绩短期承压',
              '业绩短期承压 静待行业拐点',
              '减值影响拖累业绩 市场竞争激烈',
              '区域龙头优势突出 市占率稳步提升',
          ]
          for query in queries:
              for page in range(1, 5):
                  try:
                      response = sd.post(
                          'https://api.sdyanbao.com/api/file/search',
                          json={'page': page, 'pageSize': 100, 'keyword': query},
                          timeout=45,
                      )
                      response.raise_for_status()
                      payload = response.json()
                      rows = (payload.get('data') or {}).get('files') or []
                      note('SD_SEARCH', query, page, len(rows))
                  except Exception as exc:
                      note('SD_SEARCH_ERROR', query, page, repr(exc))
                      break
                  if not rows:
                      break
                  for row in rows:
                      name = str(row.get('name') or '')
                      if not company_match(name + ' ' + json.dumps(row, ensure_ascii=False)):
                          continue
                      detail = {}
                      try:
                          r2 = sd.post('https://api.sdyanbao.com/api/file/detail', json={'id': row.get('id')}, timeout=45)
                          obj = r2.json()
                          if obj.get('status') == 1:
                              detail = obj.get('data') or {}
                      except Exception as exc:
                          note('SD_DETAIL_ERROR', row.get('id'), repr(exc))
                      org = ((detail.get('organization') or {}).get('name')
                             or ((row.get('organization') or {}).get('name'))
                             or '')
                      add_candidate({
                          'source': 'sdyanbao',
                          'id': row.get('id'),
                          'title': detail.get('name') or name,
                          'org': org,
                          'date': (detail.get('time_text') or row.get('time_text') or '')[:10],
                          'page_count': detail.get('page_count') or row.get('page_count'),
                          'page_url': detail.get('page_url') or row.get('page_url'),
                          'online_url': detail.get('online_url') or row.get('online_url'),
                          'data_source_uuid': detail.get('data_source_uuid') or row.get('data_source_uuid'),
                          'original_id': detail.get('original_id') or row.get('original_id'),
                          'stock': detail.get('stock') or row.get('stock'),
                          'file_size': detail.get('file_size') or row.get('file_size'),
                      })
                  if len(rows) < 100:
                      break

          # 2) Eastmoney public catalogue by exact stock code and recent date range.
          for endpoint in ['https://reportapi.eastmoney.com/report/list', 'https://reportapi.eastmoney.com/report/list2']:
              try:
                  if endpoint.endswith('list2'):
                      response = session.post(endpoint, json={
                          'beginTime': '2022-01-01', 'endTime': '2026-08-29',
                          'industryCode': '*', 'ratingChange': '*', 'rating': '*',
                          'orgCode': '*', 'code': '831087', 'rcode': '',
                          'pageSize': 100, 'pageNo': 1, 'p': 1, 'pageNum': 1,
                          'pageNumber': 1, 'qType': 0,
                      }, timeout=60, headers={'Content-Type': 'application/json', 'Origin': 'https://data.eastmoney.com', 'Referer': 'https://data.eastmoney.com/report/stock.jshtml'})
                  else:
                      response = session.get(endpoint, params={
                          'industryCode': '*', 'pageSize': 100, 'industry': '*',
                          'rating': '*', 'ratingChange': '*', 'beginTime': '2022-01-01',
                          'endTime': '2026-08-29', 'pageNo': 1, 'fields': '',
                          'qType': 0, 'orgCode': '', 'code': '831087', 'rcode': '',
                          'p': 1, 'pageNum': 1, 'pageNumber': 1,
                      }, timeout=60, headers={'Referer': 'https://data.eastmoney.com/'})
                  response.raise_for_status()
                  obj = response.json()
                  rows = obj.get('data') or []
                  note('EM_SEARCH', endpoint, len(rows))
                  for row in rows:
                      blob = json.dumps(row, ensure_ascii=False)
                      if not company_match(blob):
                          continue
                      add_candidate({
                          'source': 'eastmoney',
                          'title': row.get('title'),
                          'org': row.get('orgSName') or row.get('orgName'),
                          'date': str(row.get('publishDate') or '')[:10],
                          'page_count': row.get('attachPages'),
                          'infoCode': row.get('infoCode'),
                          'data_source_uuid': row.get('infoCode'),
                          'stock': {'code': row.get('stockCode'), 'name': row.get('stockName')},
                      })
              except Exception as exc:
                  note('EM_SEARCH_ERROR', endpoint, repr(exc))

          # 3) Explicit public full-page source for the 2024 Zhongyuan deep report.
          add_candidate({
              'source': 'fxbaogao',
              'title': '公司深度分析：乘政策东风，做科技强企',
              'org': '中原证券',
              'date': '2024-12-24',
              'page_count': 25,
              'fx_id': '4642889',
              'stock': {'code': '831087', 'name': '秋乐种业'},
          })

          (OUT / 'candidates.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2), encoding='utf-8')

          def validate_pdf_bytes(data: bytes, meta: dict, source_url: str, image_compiled: bool = False) -> bool:
              if len(data) < 15_000 or not data.lstrip().startswith(b'%PDF'):
                  return False
              digest = hashlib.sha256(data).hexdigest()
              if any(x['sha256'] == digest for x in downloaded):
                  return True
              temp = PDFDIR / f'_tmp_{digest[:12]}.pdf'
              temp.write_bytes(data)
              try:
                  doc = fitz.open(str(temp))
                  if doc.page_count < 3:
                      raise ValueError('fewer than 3 pages')
                  sample_indices = sorted(set([0, min(1, doc.page_count - 1), doc.page_count // 2, doc.page_count - 1]))
                  text = ''
                  for idx in sample_indices:
                      text += '\n' + doc.load_page(idx).get_text('text')
                  identity = company_match(text)
                  # Image-only PDFs may not have extractable text. Validate page images and metadata then.
                  if not identity and not image_compiled:
                      raise ValueError('company identity not found in sampled text')
                  first_pix = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
                  last_pix = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
                  render_stem = clean(meta.get('title'), 55)
                  first_pix.save(str(RENDERDIR / f'{render_stem}_first.png'))
                  last_pix.save(str(RENDERDIR / f'{render_stem}_last.png'))
                  pages = doc.page_count
                  doc.close()
              except Exception as exc:
                  note('PDF_VALIDATE_ERROR', source_url, repr(exc))
                  temp.unlink(missing_ok=True)
                  return False
              title = str(meta.get('title') or '秋乐种业研报')
              org = str(meta.get('org') or '未知机构')
              date = str(meta.get('date') or '')[:10] or '日期未知'
              suffix = '_公开完整页面合成版' if image_compiled else '_原始PDF'
              filename = f'{date}_{clean(org, 35)}_{clean(title, 95)}_{pages}页{suffix}.pdf'
              final = PDFDIR / filename
              final.unlink(missing_ok=True)
              temp.rename(final)
              downloaded.append({
                  'file': filename,
                  'title': title,
                  'org': org,
                  'date': date,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'source': meta.get('source'),
                  'source_url': source_url,
                  'image_compiled': image_compiled,
                  'identity_verified': identity or image_compiled,
              })
              note('PDF_SAVED', filename, len(data), source_url)
              return True

          def get_bytes(url: str, referer: str | None = None, timeout: int = 90):
              headers = {'Accept': 'application/pdf,image/*,*/*;q=0.8'}
              if referer:
                  headers['Referer'] = referer
              response = session.get(url, timeout=timeout, allow_redirects=True, headers=headers)
              note('GET', response.status_code, len(response.content), response.headers.get('content-type'), response.url)
              return response

          def compile_images(image_paths: list[Path], out_path: Path) -> bytes | None:
              if len(image_paths) < 3:
                  return None
              try:
                  # Normalize all pages as RGB PNG before conversion.
                  normalized = []
                  for idx, path in enumerate(image_paths):
                      with Image.open(path) as im:
                          im.load()
                          if im.width < 650 or im.height < 650:
                              raise ValueError(f'image too small: {path} {im.size}')
                          rgb = im.convert('RGB')
                          np = path.with_name(f'norm_{idx:03d}.jpg')
                          rgb.save(np, 'JPEG', quality=94, optimize=True)
                          normalized.append(np)
                  data = img2pdf.convert([str(p) for p in normalized])
                  out_path.write_bytes(data)
                  return data
              except Exception as exc:
                  note('IMAGE_COMPILE_ERROR', repr(exc))
                  return None

          # Sort candidates: deep report first, then recent reports and longer reports.
          def score(c):
              title = str(c.get('title') or '')
              is_deep = 1 if any(k in title for k in ['深度', '乘政策东风', '领军者']) else 0
              year = int((str(c.get('date') or '0000')[:4] or '0') if str(c.get('date') or '')[:4].isdigit() else 0)
              pages = int(c.get('page_count') or 0)
              return (is_deep, year, pages)

          for meta in sorted(candidates, key=score, reverse=True):
              if len(downloaded) >= 5:
                  break
              title = str(meta.get('title') or '')
              saved = False

              # Try original Eastmoney PDF whenever an AP/info code exists.
              code = str(meta.get('data_source_uuid') or meta.get('infoCode') or '')
              if code.startswith('AP'):
                  for url in [
                      f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{code}.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{int(time.time() * 1000)}.pdf=',
                  ]:
                      try:
                          r = get_bytes(url, 'https://data.eastmoney.com/')
                          if r.status_code == 200 and validate_pdf_bytes(r.content, meta, r.url, False):
                              saved = True
                              break
                      except Exception as exc:
                          note('ORIGINAL_PDF_ERROR', title, url, repr(exc))
              if saved:
                  continue

              # Try online/direct URLs from catalogue details.
              for field in ['online_url', 'original_url', 'download_url']:
                  url = meta.get(field)
                  if not url:
                      continue
                  try:
                      r = get_bytes(str(url), 'https://www.sdyanbao.com/')
                      if r.status_code == 200 and validate_pdf_bytes(r.content, meta, r.url, False):
                          saved = True
                          break
                  except Exception as exc:
                      note('DIRECT_URL_ERROR', title, url, repr(exc))
              if saved:
                  continue

              # Compile all SDYanbao public page images.
              page_url = str(meta.get('page_url') or '')
              page_count = int(meta.get('page_count') or 0)
              if page_url and page_count >= 3:
                  report_img_dir = IMGDIR / f"sd_{clean(meta.get('id') or code or title, 60)}"
                  report_img_dir.mkdir(parents=True, exist_ok=True)
                  image_paths = []
                  for idx in range(page_count):
                      ok = False
                      for ext in ['png', 'jpg', 'jpeg', 'webp']:
                          url = f"{page_url.rstrip('/')}/{idx}.{ext}"
                          try:
                              r = get_bytes(url, 'https://www.sdyanbao.com/', 45)
                              if r.status_code != 200 or len(r.content) < 8_000:
                                  continue
                              with Image.open(io.BytesIO(r.content)) as im:
                                  im.load()
                                  if im.width < 650 or im.height < 650:
                                      continue
                              path = report_img_dir / f'{idx:03d}.{ext}'
                              path.write_bytes(r.content)
                              image_paths.append(path)
                              ok = True
                              break
                          except Exception:
                              continue
                      if not ok:
                          note('SD_PAGE_MISSING', title, idx, page_count)
                          image_paths = []
                          break
                  if len(image_paths) == page_count:
                      temp_pdf = report_img_dir / 'compiled.pdf'
                      data = compile_images(image_paths, temp_pdf)
                      if data and validate_pdf_bytes(data, meta, page_url, True):
                          saved = True
              if saved:
                  continue

              # Compile FXBaogao's complete public image sequence for the deep report.
              fx_id = meta.get('fx_id')
              if fx_id:
                  report_img_dir = IMGDIR / f'fx_{fx_id}'
                  report_img_dir.mkdir(parents=True, exist_ok=True)
                  image_paths = []
                  # Date path follows report date.
                  date = str(meta.get('date'))
                  y, m, d = date.split('-')
                  expected = int(meta.get('page_count') or 25)
                  for page_no in range(1, expected + 1):
                      ok = False
                      for ext in ['png', 'jpg', 'webp']:
                          url = f'https://public.fxbaogao.com/report-image/{y}/{m}/{d}/{fx_id}-{page_no}.{ext}'
                          try:
                              r = get_bytes(url, 'https://www.fxbaogao.com/', 45)
                              if r.status_code != 200 or len(r.content) < 8_000:
                                  continue
                              with Image.open(io.BytesIO(r.content)) as im:
                                  im.load()
                                  if im.width < 650 or im.height < 650:
                                      continue
                              path = report_img_dir / f'{page_no:03d}.{ext}'
                              path.write_bytes(r.content)
                              image_paths.append(path)
                              ok = True
                              break
                          except Exception:
                              continue
                      if not ok:
                          note('FX_PAGE_MISSING', title, page_no, expected)
                          image_paths = []
                          break
                  if len(image_paths) == expected:
                      temp_pdf = report_img_dir / 'compiled.pdf'
                      data = compile_images(image_paths, temp_pdf)
                      if data and validate_pdf_bytes(data, meta, f'https://www.fxbaogao.com/detail/{fx_id}', True):
                          saved = True

          # Remove duplicates by normalized title; select 3 with one long deep report and recent updates.
          def norm_title(text: str) -> str:
              return re.sub(r'[\W_]+', '', text, flags=re.UNICODE).lower()

          unique = []
          seen_titles = set()
          for item in sorted(downloaded, key=lambda x: (
              1 if x['pages'] >= 15 or '深度' in x['title'] or '乘政策东风' in x['title'] else 0,
              x['date'], x['pages'], 0 if x['image_compiled'] else 1
          ), reverse=True):
              key = norm_title(item['title'])
              if key in seen_titles:
                  continue
              seen_titles.add(key)
              unique.append(item)

          selected = []
          # Ensure the long deep report is included when available.
          deep = next((x for x in unique if x['pages'] >= 15 or '深度' in x['title'] or '乘政策东风' in x['title']), None)
          if deep:
              selected.append(deep)
          for item in unique:
              if item in selected:
                  continue
              # Prefer recent years and, where possible, distinct brokers.
              if len(selected) >= 3:
                  break
              selected.append(item)
          selected = selected[:3]

          keep_files = {x['file'] for x in selected}
          for path in PDFDIR.glob('*.pdf'):
              if path.name not in keep_files:
                  path.unlink()

          (OUT / 'selected_reports.json').write_text(json.dumps(selected, ensure_ascii=False, indent=2), encoding='utf-8')
          readme = [
              '秋乐种业（831087.BJ）券商研究报告下载包',
              '',
              f'完整PDF数量：{len(selected)}份',
              '',
          ]
          for i, item in enumerate(selected, 1):
              version = '公开完整页面合成版' if item['image_compiled'] else '公开原始PDF'
              readme.append(f"{i}. {item['date']}｜{item['org']}｜{item['title']}｜{item['pages']}页｜{version}")
          readme.extend([
              '',
              '说明：仅收录可完整取得并通过页数、主体、首尾页渲染检查的文件；未收录登录后下载、摘要页或缺页预览。',
              '版权归原发布机构及作者所有，仅供研究参考。',
          ])
          (OUT / 'README.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'download_log.txt').write_text('\n'.join(logs), encoding='utf-8')

          checksum_lines = []
          for item in selected:
              checksum_lines.append(f"{item['sha256']}  {item['file']}")
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(checksum_lines) + ('\n' if checksum_lines else ''), encoding='utf-8')

          zip_path = OUT / 'qiule_seed_broker_reports.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(PDFDIR.glob('*.pdf')):
                  zf.write(path, path.name)
              for name in ['README.txt', 'selected_reports.json', 'SHA256SUMS.txt']:
                  zf.write(OUT / name, name)

          # Final ZIP test.
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              pdf_names = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdf_names) < 2:
                  raise RuntimeError(f'Only {len(pdf_names)} valid reports were packaged')
          note('FINAL', 'REPORTS', len(selected), 'ZIP_BYTES', zip_path.stat().st_size)
          print((OUT / 'README.txt').read_text(encoding='utf-8'))
          PY
      - name: Upload report package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiule-seed-broker-reports
          path: qiule_output/
          retention-days: 3
          if-no-files-found: error
