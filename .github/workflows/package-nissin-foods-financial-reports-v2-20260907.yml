name: Package Nissin Foods financial reports v2 20260907

on:
  push:
    branches:
      - chatgpt-nissin-foods-financial-reports-20260907
    paths:
      - '.github/workflows/package-nissin-foods-financial-reports-v2-20260907.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -o pipefail
          python scripts/package_nissin_foods_financial_reports_v2_20260907.py 2>&1 | tee nissin_foods_packaging_v2.log
      - name: Upload final report package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nissin-foods-2020-2025-annual-quarterly-and-latest-reports-v2
          path: |
            dist_nissin_foods_20260907/*.zip
            dist_nissin_foods_20260907/PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nissin-foods-report-packaging-v2-diagnostics
          path: |
            nissin_foods_packaging_v2.log
            _work_nissin_foods_20260907/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
