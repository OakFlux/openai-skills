name: Package China Cinda Phillip reports

on:
  push:
    branches:
      - chatgpt-china-cinda-broker-reports-20260906
    paths:
      - '.github/workflows/package-china-cinda-phillip-reports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Download, validate and package reports
        run: python scripts/package_china_cinda_phillip_reports.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: china-cinda-phillip-reports-20260906
          path: |
            China_Cinda_Reports.zip
            China_Cinda_Broker_Reports.zip
            PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
