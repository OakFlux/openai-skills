name: Build Standard Chartered reports package v2 20260926

on:
  push:
    paths:
      - '.github/workflows/standard-chartered-02888-annual-reports-v2-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download official PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests, urllib3
          from pypdf import PdfReader

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          PACKAGE='渣打集团_02888_2020-2025年报及最新阶段性财务报告'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          preview_dir=root/'首页预览'; preview_dir.mkdir(exist_ok=True)

          docs=[
            {'year':2020,'kind':'年度报告','date':'2021-02-25','filename':'01_渣打集团_2020年年度报告_官方英文版.pdf','url':'https://www.sc.com/en/uploads/sites/66/content/docs/SCB_AR2020.pdf','source_page':'https://www.sc.com/en/investors/financial-results/annual-report-archive/'},
            {'year':2021,'kind':'年度报告','date':'2022-02-17','filename':'02_渣打集团_2021年年度报告_官方英文版.pdf','url':'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2021-report.pdf','source_page':'https://www.sc.com/en/investors/financial-results/annual-report-archive/'},
            {'year':2022,'kind':'年度报告','date':'2023-02-16','filename':'03_渣打集团_2022年年度报告_官方英文版.pdf','url':'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2022-report.pdf','source_page':'https://www.sc.com/en/investors/financial-results/annual-report-archive/'},
            {'year':2023,'kind':'年度报告','date':'2024-02-23','filename':'04_渣打集团_2023年年度报告_官方英文版.pdf','url':'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2023-report.pdf','source_page':'https://www.sc.com/en/investors/financial-results/annual-report-archive/'},
            {'year':2024,'kind':'年度报告','date':'2025-02-21','filename':'05_渣打集团_2024年年度报告_官方英文版.pdf','url':'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2024-report.pdf','source_page':'https://www.sc.com/en/investors/financial-results/annual-report-archive/'},
            {'year':2025,'kind':'年度报告','date':'2026-02-24','filename':'06_渣打集团_2025年年度报告_官方英文版.pdf','url':'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-2025-annual-report.pdf','source_page':'https://www.sc.com/en/investors/financial-results/annual-report-archive/'},
            {'year':2026,'kind':'中期报告（含2026年第二季度及上半年业绩）','date':'2026-07-29','filename':'07_渣打集团_2026年中期报告_含第二季度及上半年业绩_官方英文版.pdf','url':'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-hy-2026-report.pdf','source_page':'https://www.sc.com/en/investors/financial-results/half-year/'},
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept':'application/pdf,*/*;q=0.8','Referer':'https://www.sc.com/en/investors/financial-results/'})

          def fetch(url):
            last=None
            for attempt in range(5):
              for verify in (True,False):
                try:
                  print('GET',url,'attempt',attempt+1,'verify',verify,flush=True)
                  r=s.get(url,timeout=(30,300),allow_redirects=True,verify=verify)
                  last={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'tls_verified':verify}
                  print('RESPONSE',last,flush=True)
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>300000:
                    return r.content,last
                except Exception as e:
                  last={'error':repr(e),'tls_verified':verify}; print('ERROR',last,flush=True)
              time.sleep(2+attempt)
            raise RuntimeError(f'download failed {url}: {last}')

          manifest=[]
          for d in docs:
            print('PROCESS',d['filename'],flush=True)
            data,dl=fetch(d['url'])
            dest=root/d['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            print('PAGES',pages,flush=True)
            if pages<100 and d['year']<=2025:
              raise RuntimeError(f'annual report too short: {dest.name} {pages}')
            if pages<50 and d['year']==2026:
              raise RuntimeError(f'interim report too short: {dest.name} {pages}')
            # Text extraction is informative only; official URL, PDF structure and rendering are authoritative checks.
            sample=''
            for i in range(min(12,pages)):
              try: sample += '\n'+(reader.pages[i].extract_text() or '')
              except Exception: pass
            identity_found='standard chartered' in sample.lower()
            year_found=str(d['year']) in sample
            print('TEXT_CHECK',identity_found,year_found,flush=True)
            subprocess.run(['qpdf','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=preview_dir/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','100','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('render failed '+dest.name)
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**d,'pages':pages,'bytes':len(data),'sha256':sha,'download':dl,'text_identity_check':identity_found,'text_year_check':year_found,'preview_file':str(Path('首页预览')/preview.name),'validation':['official sc.com PDF URL','PDF signature','page count','qpdf structure','first-page rendering']})

          lines=['渣打集团（Standard Chartered PLC；港交所代码：02888）2020-2025年报及最新阶段性财务报告','整理日期：2026-09-26','',
                 '本包收录渣打集团官网公开发布的PDF原件：2020-2025年度报告，以及2026年中期报告。',
                 '2026年中期报告披露截至2026年6月30日止第二季度及上半年业绩，是整理日可获得的最新完整阶段性财务报告。','', '文件清单：']
          for i,x in enumerate(manifest,1):
            lines += [f"{i}. {x['filename']}",f"   类型：{x['kind']}；发布日期：{x['date']}；页数：{x['pages']}页",f"   官方来源页面：{x['source_page']}",f"   官方PDF：{x['url']}",f"   SHA-256：{x['sha256']}",'']
          lines += ['说明：集团年度报告由渣打集团以英文发布，本包保留官方英文原件。','核验：PDF文件头、实际页数、qpdf结构、首页渲染、SHA-256及ZIP CRC。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failed: '+bad)
            pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if len(pdfs)!=7: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP',zpath.name,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest(),flush=True)
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: standard-chartered-02888-annual-reports-v2-final
          path: 渣打集团_02888_2020-2025年报及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
