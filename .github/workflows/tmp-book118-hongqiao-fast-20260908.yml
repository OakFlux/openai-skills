name: Fast probe public China Hongqiao Book118 PDFs
on:
  push:
    branches:
      - tmp-book118-hongqiao-fast-20260908
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf
      - name: Probe public PDFs
        run: |
          set -euo pipefail
          mkdir -p output/pdfs
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          pages={
          'guosheng':('https://max.book118.com/html/2024/0122/8075026052006030.shtm','2024-01-22','国盛证券','铝材料领军企业，产品高端化电解铝高景气开启新征程',39),
          'xibu1':('https://max.book118.com/html/2025/0421/5340102234012140.shtm','2025-04-21','西部证券','高景气+一体化+高分红，电解铝龙头静待价值重估',27),
          'xibu2':('https://max.book118.com/html/2025/0423/7061153036010064.shtm','2025-04-21','西部证券','高景气+一体化+高分红，电解铝龙头静待价值重估',27),
          'dongwu':('https://max.book118.com/html/2026/0808/5214112110013303.shtm','2026-08-07','东吴证券','全产业链铸就成本护城河，高股息引领价值重估',28)}
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          out={}
          for key,(page,date,broker,title,expect) in pages.items():
            rec={'page':page,'candidates':[]}
            try:
              r=s.get(page,timeout=45); txt=r.text.replace('\\/','/'); rec.update(status=r.status_code,bytes=len(r.content),final_url=r.url)
              Path(f'output/{key}.html').write_text(txt,encoding='utf-8')
              soup=BeautifulSoup(txt,'lxml'); c=[]
              for a in soup.find_all('a',href=True):
                u=urljoin(r.url,a['href']); label=' '.join(a.get_text(' ',strip=True).split())
                if re.search(r'try_down|\.pdf(?:$|\?)|down(?:load|file)',u,re.I) or '试下载' in label: c.append((u,label))
              for m in re.finditer(r'(?:https?://[^\"\'<>\s]+|/try_down/[^\"\'<>\s]+)\.pdf(?:\?[^\"\'<>\s]*)?',txt,re.I): c.append((urljoin(r.url,m.group(0)),'regex'))
              seen=set()
              for i,(u,label) in enumerate(c):
                if u in seen: continue
                seen.add(u)
                x={'requested_url':u,'label':label}
                try:
                  q=s.get(u,headers={'Referer':r.url},timeout=90,allow_redirects=True); data=q.content
                  x.update(status=q.status_code,final_url=q.url,content_type=q.headers.get('content-type',''),bytes=len(data),header=data[:8].decode('latin1','replace'))
                  if data.startswith(b'%PDF'):
                    tmp=Path(f'output/{key}_{i}.pdf');tmp.write_bytes(data)
                    rd=PdfReader(str(tmp));n=len(rd.pages); ids=sorted(set([0,min(1,n-1),min(4,n-1),max(0,n//2),n-1])); text=' '.join((' '.join((rd.pages[j].extract_text() or '').split()) for j in ids))
                    x.update(pages=n,sample=text[:6000],mentions=bool(re.search(r'中国宏桥|01378|1378\.HK',text,re.I)),full=n>=expect-1,sha256=hashlib.sha256(data).hexdigest())
                    if x['mentions'] and x['full']:
                      safe=re.sub(r'[\\/:*?"<>|]','_',title)
                      dest=Path('output/pdfs')/f'{date}_{broker}_中国宏桥_{safe}.pdf';dest.write_bytes(data);x['saved_as']=str(dest)
                    tmp.unlink(missing_ok=True)
                except Exception as e:x['error']=repr(e)
                rec['candidates'].append(x);print('CAND',key,json.dumps(x,ensure_ascii=False),flush=True)
            except Exception as e:rec['error']=repr(e)
            out[key]=rec
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PDFS',[str(x) for x in Path('output/pdfs').glob('*.pdf')],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: book118-hongqiao-fast
          path: output/*
          retention-days: 1
          if-no-files-found: error
