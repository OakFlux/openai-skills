name: Search public mirrors for Zhengzhou Coal broker reports 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-600121-public-mirror-search-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Search multiple public engines
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('zzmd_public_mirror_search'); out.mkdir(exist_ok=True)
          queries=[
            '"低估值+国改预期，股票提升空间大"',
            '"低估值 国改预期 股票提升空间大" 郑州煤电',
            '"招商证券-*ST郑煤-600121-低估值+国改预期"',
            '"原有业务难以维系 资产置换避免亏损"',
            '"海通证券-郑州煤电-600121-深度研究"',
            '"扭亏为盈，估值有望持续修复" 郑煤',
            '"招商证券-*ST郑煤-600121-扭亏为盈"',
            '"成长遇瓶颈 静候资产注入" 郑州煤电',
            '"郑州煤电" 600121 券商 深度 pdf',
            '"郑州煤电" 600121 研报 pdf 招商 海通',
            '2072487 pdf', '1191797 pdf', '2133283 pdf',
          ]
          engines={
            'bing': lambda q: 'https://www.bing.com/search?'+urllib.parse.urlencode({'q':q,'count':'50','setlang':'zh-Hans'}),
            'duck': lambda q: 'https://html.duckduckgo.com/html/?'+urllib.parse.urlencode({'q':q}),
            'baidu': lambda q: 'https://www.baidu.com/s?'+urllib.parse.urlencode({'wd':q,'rn':'50'}),
            'sogou': lambda q: 'https://www.sogou.com/web?'+urllib.parse.urlencode({'query':q,'num':'50'}),
            'so360': lambda q: 'https://www.so.com/s?'+urllib.parse.urlencode({'q':q}),
          }
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          records=[]
          for qi,q in enumerate(queries):
            for eng,builder in engines.items():
              url=builder(q)
              try:
                r=s.get(url,timeout=(20,90),allow_redirects=True)
                r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                html=r.text
                (out/f'{qi:02d}_{eng}.html').write_text(html,encoding='utf-8',errors='replace')
                soup=BeautifulSoup(html,'lxml')
                links=[]
                for a in soup.find_all('a',href=True):
                  href=a.get('href','').strip(); text=' '.join(a.get_text(' ',strip=True).split())
                  if not href: continue
                  if eng=='duck' and href.startswith('//duckduckgo.com/l/?'):
                    qs=urllib.parse.parse_qs(urllib.parse.urlparse('https:'+href).query); href=(qs.get('uddg') or [href])[0]
                  if eng=='bing' and href.startswith('/ck/a'):
                    href=urllib.parse.urljoin(r.url,href)
                  absolute=urllib.parse.urljoin(r.url,href)
                  low=absolute.lower()
                  if absolute.startswith(('javascript:','mailto:','#')): continue
                  if any(x in low for x in ['600121','2072487','1191797','2133283','.pdf','hibor','sina','sohu','mbalib','nxny','dfcfw','eastmoney','report','research','yanbao','wenku','docin','sgpjbg','vzkoo','wukong','199it']) or any(k in text for k in ['郑州煤电','郑煤','低估值','资产置换','扭亏为盈','静候资产注入']):
                    links.append({'text':text[:500],'url':absolute})
                seen=set(); unique=[]
                for x in links:
                  if x['url'] not in seen:
                    seen.add(x['url']); unique.append(x)
                rec={'query':q,'engine':eng,'requested':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '','links':unique[:200]}
                records.append(rec)
                print('\nQUERY',q,'ENGINE',eng,'STATUS',r.status_code,'LINKS',len(unique))
                for x in unique[:50]: print(x['text'],'\t',x['url'])
              except Exception as exc:
                records.append({'query':q,'engine':eng,'requested':url,'error':repr(exc)})
                print('ERROR',q,eng,repr(exc))
              time.sleep(.5)
          (out/'results.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          flat=[]; seen=set()
          for rec in records:
            for x in rec.get('links',[]):
              key=x['url']
              if key in seen: continue
              seen.add(key); flat.append({'query':rec['query'],'engine':rec['engine'],**x})
          (out/'flat_links.json').write_text(json.dumps(flat,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'flat_links.tsv').write_text('\n'.join(f"{x['query']}\t{x['engine']}\t{x['text']}\t{x['url']}" for x in flat),encoding='utf-8')
          print('TOTAL_UNIQUE_LINKS',len(flat))
          PY

      - name: Upload search output
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-600121-public-mirror-search-20261014
          path: zzmd_public_mirror_search
          retention-days: 2
          if-no-files-found: error
