name: Direct package Mingyue Lens broker reports 20261020

on:
  push:
    branches:
      - tmp/mingyue-lens-301101-broker-reports-20261020
    paths:
      - .github/workflows/mingyue-lens-301101-broker-reports-direct-package-20261020.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build validated report folder
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          root = Path('明月镜片_301101_券商深度报告_完整版3份_截至20261020')
          preview_dir = root / '首页预览'
          root.mkdir(parents=True, exist_ok=True)
          preview_dir.mkdir(exist_ok=True)

          reports = [
              {
                  'date': '2023-12-29', 'broker': '民生证券',
                  'analysts': '刘文正、解慧新、杨颖', 'rating': '买入',
                  'title': '深度报告：常规镜片隐形冠军，近视防控业务快速放量，国产镜片龙头未来可期',
                  'info_code': 'AP202312291615479426', 'expected_pages': 37,
                  'filename': '2023-12-29_民生证券_深度报告_常规镜片隐形冠军_近视防控业务快速放量.pdf',
                  'type': '公司深度报告',
              },
              {
                  'date': '2022-02-14', 'broker': '东吴证券',
                  'analysts': '吴劲草、张潇、谭志千', 'rating': '买入',
                  'title': '国内镜片龙头厂商，技术&规模优势明显，近视防控镜前景广阔',
                  'info_code': 'AP202202141546980461', 'expected_pages': 31,
                  'filename': '2022-02-14_东吴证券_国内镜片龙头厂商_技术及规模优势明显_近视防控镜前景广阔.pdf',
                  'type': '公司深度报告',
              },
              {
                  'date': '2022-03-14', 'broker': '国金证券',
                  'analysts': '袁维', 'rating': '增持',
                  'title': '国产镜片领先品牌，离焦镜有望快速放量',
                  'info_code': 'AP202203141552559201', 'expected_pages': 30,
                  'filename': '2022-03-14_国金证券_国产镜片领先品牌_离焦镜有望快速放量.pdf',
                  'type': '公司深度报告',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/301101.html',
              'Accept': 'application/pdf,text/html;q=0.9,*/*;q=0.8',
          })

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def download(item, target):
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H3_{item["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{item["info_code"]}_1.pdf',
              ]
              traces = []
              for url in candidates:
                  for attempt in range(1, 4):
                      try:
                          response = session.get(url, timeout=120, allow_redirects=True)
                          data = response.content
                          traces.append({'url': url, 'status': response.status_code, 'bytes': len(data)})
                          if response.status_code == 200 and data.startswith(b'%PDF') and len(data) > 100000:
                              target.write_bytes(data)
                              return url, traces
                      except Exception as exc:
                          traces.append({'url': url, 'error': repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError(f'Unable to download {item["info_code"]}: {traces}')

          manifest = []
          for item in reports:
              target = root / item['filename']
              source_url, traces = download(item, target)
              q = subprocess.run(
                  ['qpdf', '--check', str(target)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  text=True, errors='replace',
              )
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {target}: {q.returncode}\n{q.stdout}')
              pages = len(PdfReader(str(target)).pages)
              if pages != item['expected_pages']:
                  raise RuntimeError(f'Unexpected pages for {target}: {pages}')

              txt = target.with_suffix('.txt')
              subprocess.run(['pdftotext', '-f', '1', '-l', '8', str(target), str(txt)], check=True)
              text = txt.read_text(encoding='utf-8', errors='replace')
              txt.unlink(missing_ok=True)
              hits = [x for x in ['明月镜片', '明月镜片股份有限公司', '301101', item['broker']] if x in text]
              if not any(x in text for x in ['明月镜片', '明月镜片股份有限公司', '301101']):
                  raise RuntimeError(f'Company identity missing: {target}')
              if item['broker'] not in text:
                  raise RuntimeError(f'Broker identity missing: {target}')

              preview_stem = preview_dir / target.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(target), str(preview_stem)],
                  check=True,
              )
              preview = preview_stem.with_suffix('.png')
              if not preview.exists() or preview.stat().st_size < 10000:
                  raise RuntimeError(f'Preview render failed: {target}')

              entry = dict(item)
              entry.update({
                  'source_page': f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': target.stat().st_size,
                  'sha256': sha256(target),
                  'identity_hits': hits,
                  'qpdf_status': q.returncode,
                  'download_attempts': traces,
              })
              manifest.append(entry)
              print('VERIFIED', json.dumps(entry, ensure_ascii=False, sort_keys=True))

          readme = [
              '# 明月镜片（301101）券商深度报告', '',
              '整理日期：2026-10-20', '',
              '本包收录3份公开可下载的券商公司深度报告原始PDF。', '',
              '## 报告清单', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["broker"]}｜{x["date"]}｜{x["pages"]}页｜{x["rating"]}',
                  f'   - {x["title"]}',
                  f'   - 分析师：{x["analysts"]}',
                  f'   - 文件：{x["filename"]}',
                  f'   - SHA-256：{x["sha256"]}', '',
              ]
          readme += [
              '## 校验说明', '',
              '- 已检查PDF结构、实际页数、公司名称、证券代码、研究机构及首页渲染。',
              '- 研报内容仅代表原研究机构观点，仅供资料研究，不构成投资建议。',
          ]
          (root / 'README.md').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              '\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in manifest) + '\n',
              encoding='utf-8',
          )

          pdfs = list(root.glob('*.pdf'))
          if len(pdfs) != 3:
              raise RuntimeError(f'Unexpected PDF count: {len(pdfs)}')
          print('DIRECT_PACKAGE_COUNTS', json.dumps({'reports': 3, 'pages': sum(x['pages'] for x in manifest)}, ensure_ascii=False))
          PY

      - name: Upload direct package
        uses: actions/upload-artifact@v4
        with:
          name: mingyue-lens-301101-broker-deep-reports-direct-20261020
          path: 明月镜片_301101_券商深度报告_完整版3份_截至20261020
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
