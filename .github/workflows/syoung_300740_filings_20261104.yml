name: package-syoung-300740-filings

on:
  push:
    branches:
      - tmp/syoung-300740-filings-20261104-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = "水羊股份"
          FULL_NAME = "水羊集团股份有限公司"
          CODE = "300740"
          PREPARED = "2026-11-04"
          ROOT_NAME = "水羊股份_300740_2020-2025年报及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          cninfo_2020_candidates = [
              f"https://static.cninfo.com.cn/finalpage/2021-04-26/{identifier}.PDF"
              for identifier in range(1209792680, 1209792735)
          ]

          reports = [
              {
                  "sequence": 1,
                  "period": "2020年年度报告",
                  "kind": "annual",
                  "announcement_date": "2021-04-26",
                  "minimum_pages": 100,
                  "urls": [
                      "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-26/7118487.PDF",
                      "https://www.syounggroup.com/gonggao/dingqi/%E6%B0%B4%E7%BE%8A%E8%82%A1%E4%BB%BD%202020%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A.pdf",
                      "https://oss.syounggroup.com/static/file/official-web/syounggroup/%E6%B0%B4%E7%BE%8A%E8%82%A1%E4%BB%BD%202020%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A-20210426.pdf",
                      *cninfo_2020_candidates,
                  ],
              },
              {
                  "sequence": 2,
                  "period": "2021年年度报告",
                  "kind": "annual",
                  "announcement_date": "2022-04-28",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2022-04-28/1213167765.PDF",
                      "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2022/2022-4/2022-04-28/8119792.PDF",
                  ],
              },
              {
                  "sequence": 3,
                  "period": "2022年年度报告",
                  "kind": "annual",
                  "announcement_date": "2023-04-28",
                  "minimum_pages": 100,
                  "urls": [
                      "https://disc.static.szse.cn/disc/disk03/finalpage/2023-04-27/6da86c02-6431-458b-8b47-c5b53c02833c.PDF",
                      "https://oss.syounggroup.com/static/file/official-web/syounggroup/%E6%B0%B4%E7%BE%8A%E8%82%A1%E4%BB%BD%202022%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A-20230428.pdf",
                      "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-28/9151073.PDF",
                  ],
              },
              {
                  "sequence": 4,
                  "period": "2023年年度报告",
                  "kind": "annual",
                  "announcement_date": "2024-04-24",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2024-04-24/1219771180.PDF",
                      "https://oss.syounggroup.com/static/file/official-web/syounggroup/%E6%B0%B4%E7%BE%8A%E8%82%A1%E4%BB%BD%202023%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A-2024-04-24.pdf",
                      "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-24/10045730.PDF",
                  ],
              },
              {
                  "sequence": 5,
                  "period": "2024年年度报告",
                  "kind": "annual",
                  "announcement_date": "2025-04-29",
                  "minimum_pages": 100,
                  "urls": [
                      "https://disc.static.szse.cn/disc/disk03/finalpage/2025-04-29/6d8620c8-61e8-4e78-be99-8327a6b54fcf.PDF",
                      "https://oss.syounggroup.com/static/file/official-web/syounggroup/%E6%B0%B4%E7%BE%8A%E8%82%A1%E4%BB%BD%202025-04-29%20%202024%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A%2C%E6%B0%B4%E7%BE%8A%E8%82%A1%E4%BB%BD%202025-04-29%20%202024%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A.PDF",
                  ],
              },
              {
                  "sequence": 6,
                  "period": "2025年年度报告",
                  "kind": "annual",
                  "announcement_date": "2026-04-24",
                  "minimum_pages": 100,
                  "urls": [
                      "https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-24/73ea8e61-f35d-4a6b-ab3b-c41db7fbfa4c.PDF",
                      "https://www.syounggroup.com/gonggao/dingqi/%E6%B0%B4%E7%BE%8A%E8%82%A1%E4%BB%BD%202025%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A.pdf",
                      "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-24/12167626.PDF",
                  ],
              },
              {
                  "sequence": 7,
                  "period": "2026年第三季度报告",
                  "kind": "quarter",
                  "announcement_date": "2026-10-30",
                  "minimum_pages": 5,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2026-10-30/1225642054.PDF",
                      "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-30/12678800.PDF",
                  ],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          accepted_names = [CODE, COMPANY, FULL_NAME, "御家汇", "SYoung Group"]

          def compact_text(reader: PdfReader) -> str:
              indices = list(range(min(12, len(reader.pages))))
              if len(reader.pages) > 12:
                  indices.extend(range(max(12, len(reader.pages) - 2), len(reader.pages)))
              text = "\n".join((reader.pages[i].extract_text() or "") for i in sorted(set(indices)))
              return re.sub(r"\s+", "", text)

          def fetch_valid_pdf(report: dict) -> tuple[bytes, str, str, int]:
              last_error = None
              for url in report["urls"]:
                  for attempt in range(2):
                      try:
                          response = session.get(
                              url,
                              timeout=(20, 240),
                              allow_redirects=True,
                              headers={
                                  "Accept": "application/pdf,*/*;q=0.8",
                                  "Referer": "https://www.cninfo.com.cn/",
                              },
                          )
                          print("DOWNLOAD", report["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          if response.status_code != 200:
                              last_error = RuntimeError(f"HTTP {response.status_code}")
                              break
                          if not response.content.startswith(b"%PDF-") or len(response.content) < 50_000:
                              last_error = RuntimeError(f"Not PDF: {response.content[:30]!r}")
                              break

                          temp = Path("candidate.pdf")
                          temp.write_bytes(response.content)
                          reader = PdfReader(str(temp), strict=False)
                          pages = len(reader.pages)
                          compact = compact_text(reader)
                          if pages < report["minimum_pages"]:
                              last_error = RuntimeError(f"Too short: {pages} pages")
                              break
                          if not any(name.replace(" ", "") in compact for name in accepted_names):
                              last_error = RuntimeError("Issuer validation failed")
                              break
                          if report["period"].replace(" ", "") not in compact:
                              last_error = RuntimeError("Period validation failed")
                              break
                          return response.content, response.url, response.headers.get("content-type", ""), pages
                      except Exception as exc:
                          last_error = exc
                          print("DOWNLOAD_ERROR", report["period"], url, attempt, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to obtain {report['period']}: {last_error}")

          manifest = []
          for report in reports:
              data, source_url, content_type, pages = fetch_valid_pdf(report)
              filename = f"{report['sequence']:02d}_{report['period']}.pdf"
              path = PDF_DIR / filename
              path.write_bytes(data)

              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {filename}: {check.stdout}")

              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "120", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")

              item = {
                  "sequence": report["sequence"],
                  "period": report["period"],
                  "kind": report["kind"],
                  "announcement_date": report["announcement_date"],
                  "filename": filename,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": source_url,
                  "content_type": content_type,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(item)
              print("VALIDATED", item["period"], item["pages"], item["bytes"], item["sha256"])

          readme = [
              f"{FULL_NAME}（{CODE}.SZ）2020—2025年年度报告及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：",
              "- 2020—2025年年度报告全文，共6份。",
              "- 截至整理日已披露的最新独立季度报告：2026年第三季度报告，共1份。",
              "",
              "已排除年度报告摘要、半年度报告、审计附件、提示性公告及其他非正文文件。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   报告期间：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、报告期间、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "file_count": len(manifest),
              "annual_report_count": sum(item["kind"] == "annual" for item in manifest),
              "latest_quarter": manifest[-1]["period"],
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "报告期间", "类型", "公告日期", "文件名", "页数", "字节数", "SHA-256", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["period"], item["kind"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"],
                      item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("syoung_300740_2020_2025_annual_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 7:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 7")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "file_count": len(manifest),
              "annual_report_count": 6,
              "latest_quarter": manifest[-1]["period"],
              "files": [{
                  key: item[key]
                  for key in ["period", "announcement_date", "pages", "bytes", "sha256", "source_url"]
              } for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: syoung-300740-filings-20261104
          path: |
            syoung_300740_2020_2025_annual_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
