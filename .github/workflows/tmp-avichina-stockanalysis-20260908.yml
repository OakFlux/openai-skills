name: Extract AviChina filing links from StockAnalysis
on:
  push:
    branches: [tmp-avichina-stockanalysis-20260908]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Extract filing links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          url='https://stockanalysis.com/filings/HKG-2357/'
          result={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              ctx=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',locale='en-US')
              page=ctx.new_page()
              resp=page.goto(url,wait_until='domcontentloaded',timeout=120000)
              try: page.wait_for_load_state('networkidle',timeout=30000)
              except PWTimeout: pass
              page.wait_for_timeout(3000)
              links=page.eval_on_selector_all('a','els=>els.map(e=>({text:(e.innerText||e.textContent||"").trim(),href:e.href,title:e.title||""}))')
              result={'status':resp.status if resp else None,'url':page.url,'title':page.title(),'body':' '.join(page.locator('body').inner_text().split())[:100000],'links':links}
              for x in links:
                  t=x['text'].lower()
                  if ('h2 2021' in t or 'h2 2020' in t or 'annual report' in t) and x['href']:
                      print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
              Path('output/page.html').write_text(page.content(),encoding='utf-8')
              page.screenshot(path='output/page.png',full_page=True)
              browser.close()
          Path('output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avichina-stockanalysis-links
          path: output/*
          retention-days: 1
          if-no-files-found: error
