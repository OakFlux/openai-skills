name: Query NEEQ annual reports by company name 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-targeted-v2-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query old disclosure endpoint
        run: |
          python - <<'PY'
          import json, requests
          endpoint='https://www.neeq.com.cn/disclosureInfoController/infoResult.do'
          headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/x-www-form-urlencoded','Accept':'text/plain'}
          cases=[
            ('','二重集团（德阳）重型装备股份有限公司'),
            ('','国机重型装备集团股份有限公司'),
            ('','二重5'),
            ('','国重装5'),
            ('二重5','年度报告'),
            ('国重装5','年度报告'),
            ('400062/二重5','年度报告'),
            ('400062/国重装5','年度报告'),
          ]
          for company,keyword in cases:
            form={'disclosureType':'5','page':'1','companyCd':company,'isNewThree':'0','startTime':'2015-01-01','endTime':'2020-06-30','keyword':keyword,'xxfcbj':'1'}
            r=requests.post(endpoint,data=form,headers=headers,timeout=40)
            raw=r.text.strip()
            print('\nCASE',repr(company),repr(keyword),'STATUS',r.status_code,'LEN',len(raw))
            clean=raw[5:-1] if raw.startswith('null(') and raw.endswith(')') else raw.rstrip(';')
            try: obj=json.loads(clean)
            except Exception as exc:
              print('PARSE_ERROR',repr(exc),repr(raw[:1000])); continue
            print('JSON',json.dumps(obj,ensure_ascii=False)[:12000])
          PY
