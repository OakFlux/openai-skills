name: Wireless Media IPO Document Probe

on:
  push:
    branches:
      - chatgpt-wireless-media-broker-reports-20261012
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Query announcement API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/notices/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          rows_all = []
          for page in range(1, 20):
              params = {
                  'sr': '-1',
                  'page_size': '100',
                  'page_index': str(page),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': '301551',
              }
              r = s.get(api, params=params, timeout=90)
              print('API', page, r.status_code, len(r.content), r.url)
              r.raise_for_status()
              obj = r.json()
              data = obj.get('data') or {}
              rows = data.get('list') or []
              total = int(data.get('total_hits') or 0)
              print('PAGE', page, 'ROWS', len(rows), 'TOTAL', total)
              rows_all.extend(rows)
              if not rows or len(rows_all) >= total:
                  break

          keywords = ('保荐书', '保荐工作报告', '发行保荐', '上市保荐', '投资价值研究', '主承销商', '保荐人')
          matches = []
          for row in rows_all:
              title = str(row.get('title') or row.get('title_ch') or '')
              if any(k in title for k in keywords):
                  rec = {
                      'title': title,
                      'art_code': row.get('art_code'),
                      'notice_date': row.get('notice_date'),
                      'columns': row.get('columns'),
                  }
                  print('MATCH', json.dumps(rec, ensure_ascii=False))
                  matches.append(row)
          Path('output/wireless_media_ipo_docs.json').write_text(
              json.dumps(matches, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('FINAL_MATCH_COUNT', len(matches))
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: wireless-media-ipo-doc-probe
          path: output/wireless_media_ipo_docs.json
          retention-days: 1
