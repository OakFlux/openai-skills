name: Inspect Sdyanbao public download API

on:
  push:
    paths:
      - '.github/workflows/sdyanbao-download-api-inspect-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect HTML and Nuxt bundles
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.sdyanbao.com/detail/922882'})
          url='https://www.sdyanbao.com/detail/922882'
          r=s.get(url,timeout=(25,150)); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[]
          for tag in soup.find_all('script',src=True):
              src=urljoin(r.url,tag['src'])
              scripts.append(src)
              print('SCRIPT_SRC',src,flush=True)
          print('SCRIPT_COUNT',len(scripts),flush=True)
          patterns=('download','online_url','page_url','original_id','file_url','pdf_url','unlock','detail','report','api','token','vip')
          for src in scripts:
              try:
                  rr=s.get(src,timeout=(25,150)); print('\nBUNDLE',src,rr.status_code,len(rr.content),flush=True)
                  if rr.status_code!=200: continue
                  text=rr.text
                  for pattern in patterns:
                      if pattern.lower() in text.lower():
                          print('HAS',pattern,flush=True)
                  # Print compact windows around likely API/download tokens.
                  for match in re.finditer(r'(?i)(download|online_url|file_url|pdf_url|original_id|unlock|page_url|\/api\/|axios|\$get|\$post)',text):
                      start=max(0,match.start()-500); end=min(len(text),match.end()+1200)
                      snippet=' '.join(text[start:end].split())
                      print('WINDOW',snippet[:2200],flush=True)
                  for endpoint in sorted(set(re.findall(r'https?://[^\"\'<>\\\s]+',text))):
                      low=endpoint.lower()
                      if any(k in low for k in ('download','api','pdf','file','sdyanbao','oss')):
                          print('ENDPOINT',endpoint[:1200],flush=True)
              except Exception as exc:
                  print('BUNDLE_ERROR',src,repr(exc),flush=True)
          PY
