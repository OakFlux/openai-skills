name: Build Haofan Bio broker deep-report package

on:
  push:
    branches: [tmp-haofan-bio-broker-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-bio-broker-package-20261020.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='昊帆生物_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 7 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=301393' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 15 "$out" "$out.txt" 2>/dev/null
            grep -Eq '苏州昊帆生物股份有限公司|昊帆生物' "$out.txt"
            rm -f "$out.txt"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.render" >/dev/null 2>&1
            test -s "$out.render.png"
            rm -f "$out.render.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202401111617258862_1.pdf' \
            "$PACKAGE/01_东莞证券_国内多肽合成试剂龙头企业_深度报告_2024-01-11.pdf" \
            20

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202307211592522306_1.pdf' \
            "$PACKAGE/02_开源证券_多肽合成试剂行业龙头自有产能落地赋能长期发展_首次覆盖_2023-07-21.pdf" \
            33

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202307101592128918_1.pdf' \
            "$PACKAGE/03_东吴证券_多肽合成试剂细分龙头多重因素助力公司提速发展_2023-07-10.pdf" \
            23

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('昊帆生物_券商深度报告_3份')
          meta = {
              '01_东莞证券_国内多肽合成试剂龙头企业_深度报告_2024-01-11.pdf': {
                  'broker': '东莞证券',
                  'date': '2024-01-11',
                  'title': '深度报告：国内多肽合成试剂龙头企业',
                  'index': 'AP202401111617258862',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202401111617258862_1.pdf',
              },
              '02_开源证券_多肽合成试剂行业龙头自有产能落地赋能长期发展_首次覆盖_2023-07-21.pdf': {
                  'broker': '开源证券',
                  'date': '2023-07-21',
                  'title': '公司首次覆盖报告：多肽合成试剂行业龙头，自有产能落地赋能长期发展',
                  'index': 'AP202307211592522306',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202307211592522306_1.pdf',
              },
              '03_东吴证券_多肽合成试剂细分龙头多重因素助力公司提速发展_2023-07-10.pdf': {
                  'broker': '东吴证券',
                  'date': '2023-07-10',
                  'title': '多肽合成试剂细分龙头，多重因素助力公司提速发展',
                  'index': 'AP202307101592128918',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202307101592128918_1.pdf',
              },
          }
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '昊帆生物（301393）券商深度报告资料包',
              '整理日期：2026-10-20',
              '',
              '收录原则：',
              '1. 收录长篇公司深度、首次覆盖或系统性公司研究报告。',
              '2. 排除财报点评、季报点评、网页摘要和非券商材料。',
              '3. 三份文件均为公开渠道可直接下载的券商原始PDF。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  PDF来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、页数、正文公司名称及首页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Haofan-Bio-301393-broker-deep-reports-3
          path: 昊帆生物_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
