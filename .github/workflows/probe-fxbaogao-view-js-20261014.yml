name: Probe Fxbaogao viewer APIs

on:
  pull_request:
    paths:
      - 'tasks/probe-fxbaogao-view-js-20261014.trigger'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch viewer scripts and inspect endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests,pathlib
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'})
          out=pathlib.Path('out'); out.mkdir()
          urls=[
            'https://static.fxbaogao.com/pub/js/config/production.js',
            'https://www.fxbaogao.com/_fxbg/2610131816/js/runtime.63c1261c72087296e4cb.js',
            'https://www.fxbaogao.com/_fxbg/2610131816/js/antd-table.efc2d913db806c205059.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2610131816/js/vendors~app-pages-fxbg-main-js.153dbf505adafefa97e9.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2610131816/js/app-pages-fxbg-main-js.7dcddcdd08ec3b0abd00.chunk.js',
            'https://api.fxbaogao.com/mofoun/common/bizSwitch/forDomainSwitch',
            'https://wx.hufangde.com/view?id=4736599',
          ]
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('FETCH',i,r.status_code,len(r.content),r.url,flush=True)
              out.joinpath(f'{i}.txt').write_bytes(r.content)
              t=r.text
              strings=[]
              for pat in [r'https?://[^\"\'<> ]+',r'/[A-Za-z0-9_?&=./-]*(?:api|pdf|view|download|report|document|doc)[A-Za-z0-9_?&=./-]*',r'[A-Za-z0-9_?&=./-]*(?:report-image|pdfUrl|fileUrl|downloadUrl|docId|reportId|pageCount|totalPage)[A-Za-z0-9_?&=./-]*']:
                for m in re.findall(pat,t,re.I):
                  if isinstance(m,tuple): m=''.join(m)
                  strings.append(m[:1200])
              vals=[]
              for x in strings:
                if any(k in x.lower() for k in ('api','pdf','view','download','report','document','doc','image','page')): vals.append(x)
              print('HITS',i,json.dumps(list(dict.fromkeys(vals))[:1000],ensure_ascii=False,indent=2),flush=True)
            except Exception as e:
              print('ERROR',i,u,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-view-js-probe
          path: out/
          retention-days: 3
