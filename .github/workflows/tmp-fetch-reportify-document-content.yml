name: Temporary Fetch Reportify Document Content

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-fetch-reportify-document-content.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query public analysis, space and document-content endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json,time
          from pathlib import Path
          import requests

          reports=[
            {'id':'1118968060607336448','pages':15,'title':'澳门总GGR恢复超行业，市场份额和EM增长'},
            {'id':'1052271542572027904','pages':4,'title':'2024年三季报业绩点评，业绩符合预期，日均运营费用维持稳定'},
            {'id':'962339654089314304','pages':4,'title':'2023年四季报点评：受到赢率偏低及减值费用的影响，业绩略低于预期'},
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://reportify.cn/','Origin':'https://reportify.cn','Accept':'application/json,text/plain,*/*','Content-Type':'application/json'})
          result=[]
          for report in reports:
            rid=report['id']; rec={**report,'gets':{},'chunks':[]}
            for suffix in ['space','analysis']:
              u=f'https://api.reportify.cn/reports/{rid}/{suffix}'
              try:
                r=s.get(u,timeout=45);item={'url':u,'status':r.status_code,'type':r.headers.get('content-type'),'bytes':len(r.content),'text':r.text[:500000]}
                try:item['json']=r.json()
                except Exception:pass
                rec['gets'][suffix]=item
              except Exception as e:rec['gets'][suffix]={'url':u,'error':repr(e)}
            # Query a generous range; endpoint returns errors/empty beyond available chunks.
            empty_streak=0
            for i in range(0,180):
              payload={'chunk_index':i,'report_id':rid,'document_version':None}
              try:
                r=s.post('https://api.reportify.cn/reports/query-document-content',json=payload,timeout=30)
                item={'chunk_index':i,'status':r.status_code,'type':r.headers.get('content-type'),'bytes':len(r.content),'text':r.text[:100000]}
                try:
                  obj=r.json();item['json']=obj
                  content=''
                  if isinstance(obj,dict):
                    content=str(obj.get('content') or (obj.get('data') or {}).get('content') if isinstance(obj.get('data'),dict) else '')
                    metadata=obj.get('metadata') or ((obj.get('data') or {}).get('metadata') if isinstance(obj.get('data'),dict) else None)
                    item['content_len']=len(content);item['metadata']=metadata
                  if r.status_code==200 and (item.get('content_len',0)>0 or item.get('metadata')): empty_streak=0
                  else: empty_streak+=1
                except Exception:
                  empty_streak+=1
                rec['chunks'].append(item)
                if i>20 and empty_streak>=20:break
              except Exception as e:
                rec['chunks'].append({'chunk_index':i,'error':repr(e)});empty_streak+=1
                if i>20 and empty_streak>=20:break
              time.sleep(.03)
            result.append(rec)
            good=[x for x in rec['chunks'] if x.get('status')==200 and (x.get('content_len',0)>0 or x.get('metadata'))]
            print('REPORT='+json.dumps({'id':rid,'space_status':rec['gets'].get('space',{}).get('status'),'analysis_status':rec['gets'].get('analysis',{}).get('status'),'good_chunks':len(good),'sample':good[:5]},ensure_ascii=False),flush=True)
          Path('out').mkdir(exist_ok=True);Path('out/reportify_document_content.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reportify-melco-document-content
          path: out/reportify_document_content.json
          retention-days: 3
