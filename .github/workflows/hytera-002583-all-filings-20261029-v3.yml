name: Build final Hytera 002583 annual reports and latest quarter 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hytera-002583-all-filings-20261029-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE='002583'
          ORG_ID='9900019838'
          SHORT='海能达'
          FULL='海能达通信股份有限公司'
          PACKAGE='海能达_002583_2020-2025年报及最新季报'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          session=requests.Session(); session.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          common={'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}

          def clean_title(v:str)->str:
              v=html.unescape(v or '')
              v=re.sub(r'<[^>]+>','',v)
              return re.sub(r'\s+','',v)

          def find_q3_url()->tuple[str,dict]:
              endpoint='https://www.cninfo.com.cn/new/hisAnnouncement/query'
              headers={**common,'Referer':f'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search&code={CODE}','X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Accept':'application/json, text/javascript, */*; q=0.01'}
              try: session.get('https://www.cninfo.com.cn/new/index',headers=common,timeout=(20,60))
              except Exception: pass
              data={'pageNum':'1','pageSize':'30','column':'szse','tabName':'fulltext','plate':'sz','stock':f'{CODE},{ORG_ID}','searchkey':'','secid':'','category':'','trade':'','seDate':'2026-10-28~2026-10-29','sortName':'','sortType':'','isHLtitle':'true'}
              r=session.post(endpoint,headers=headers,data=data,timeout=(30,120)); r.raise_for_status()
              obj=r.json(); anns=obj.get('announcements') or []
              print('Q3_QUERY',r.status_code,len(anns),obj.get('totalAnnouncement'))
              candidates=[]
              for a in anns:
                  title=clean_title(a.get('announcementTitle',''))
                  if ('2026年三季度报告' in title or '2026年第三季度报告' in title) and '摘要' not in title:
                      candidates.append((int(a.get('announcementTime') or 0),a,title))
              if not candidates:
                  raise RuntimeError('Q3 report not found: '+repr([clean_title(a.get('announcementTitle','')) for a in anns]))
              candidates.sort(key=lambda x:x[0],reverse=True)
              a=candidates[0][1]; a['_clean_title']=candidates[0][2]
              adjunct=(a.get('adjunctUrl') or '').lstrip('/')
              if not adjunct: raise RuntimeError('Q3 adjunctUrl missing')
              return 'https://static.cninfo.com.cn/'+adjunct,a

          q3_url,q3_meta=find_q3_url()

          items=[
            {'label':'2020年年度报告（更新后）','kind':'annual','urls':['https://static.cninfo.com.cn/finalpage/2021-05-14/1209971169.PDF']},
            {'label':'2021年年度报告','kind':'annual','urls':['https://www.hytera.com/iwov-resources/hytera/12_investors/regular_notice/cn_hytera_2021_annual_report_20220408.PDF','https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-08/7964538.PDF']},
            {'label':'2022年年度报告','kind':'annual','urls':['https://www.hytera.com/iwov-resources/hytera/12_investors/regular_notice/annual_report_2022_2023_4_1.pdf','https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-01/8948662.PDF']},
            {'label':'2023年年度报告','kind':'annual','urls':['https://static.cninfo.com.cn/finalpage/2024-04-30/1219922364.PDF']},
            {'label':'2024年年度报告','kind':'annual','urls':['https://static.cninfo.com.cn/finalpage/2025-04-29/1223378490.PDF']},
            {'label':'2025年年度报告','kind':'annual','urls':['https://static.cninfo.com.cn/finalpage/2026-04-08/1225083403.PDF']},
            {'label':'2026年第三季度报告','kind':'quarter','urls':[q3_url],'announcement_title':q3_meta.get('_clean_title'),'announcement_id':q3_meta.get('announcementId'),'announcement_time':q3_meta.get('announcementTime')},
          ]

          manifest=[]
          for idx,item in enumerate(items,1):
              data=None; source=''; attempts=[]
              for url in item['urls']:
                  for attempt in range(4):
                      try:
                          if 'hytera.com' in url: referer='https://www.hytera.com/cn/investor-relations/regular-notice.html'
                          elif 'sina.com.cn' in url: referer='https://vip.stock.finance.sina.com.cn/'
                          else: referer='https://www.cninfo.com.cn/'
                          r=session.get(url,headers={**common,'Referer':referer,'Accept':'application/pdf,*/*;q=0.8'},timeout=(30,360),allow_redirects=True)
                          attempts.append({'url':url,'attempt':attempt+1,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                          if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000:
                              data=r.content; source=url; break
                          if r.status_code in (400,401,403,404,410): break
                      except Exception as exc:
                          attempts.append({'url':url,'attempt':attempt+1,'error':repr(exc)})
                      time.sleep(1+attempt)
                  if data is not None: break
              if data is None: raise RuntimeError(f'Download failed {item["label"]}: {attempts}')

              fn=f'{idx:02d}_海能达_{item["label"]}.pdf'
              dest=PDFDIR/fn; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              minimum=100 if item['kind']=='annual' else 5
              if pages<minimum: raise RuntimeError(f'Unexpectedly short PDF {fn}: {pages}')

              text=''
              for page in reader.pages[:min(35,pages)]:
                  try: text+='\n'+(page.extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','',text)
              identity_hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
              if len(compact)>500 and not identity_hits: raise RuntimeError(f'Issuer mismatch {fn}')

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREV/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<8000: raise RuntimeError(f'Preview failed {fn}')

              sha=hashlib.sha256(data).hexdigest()
              manifest.append({**{k:v for k,v in item.items() if k!='urls'},'source_url':source,'candidate_urls':item['urls'],'filename':str(Path('原始PDF')/fn),'pages':pages,'bytes':len(data),'sha256':sha,'identity_hits':identity_hits,'preview_file':str(Path('首页预览')/preview.name),'download_attempts':attempts,'validation':['PDF header','issuer identity','page count','qpdf structure','first-page render']})
              print('VERIFIED',item['label'],pages,len(data),sha,source)

          total_pages=sum(x['pages'] for x in manifest)
          readme=['海能达通信股份有限公司（002583.SZ）年度报告及最新季度报告资料包','整理日期：2026-10-29','','收录范围：2020—2025年年度报告全文，以及截至整理日最新披露的2026年第三季度报告。','2020年年度报告采用后续披露的更新后版本；不收录年度报告摘要、董事会工作报告或单独审计附件。','']
          for i,x in enumerate(manifest,1):
              readme += [f'{i}. {x["label"]}',f'   页数：{x["pages"]}页；文件：{x["filename"]}',f'   来源：{x["source_url"]}',f'   SHA-256：{x["sha256"]}','']
          readme += [f'合计：{len(manifest)}份PDF，{total_pages}页。','核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与来源.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')

          zcn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=len(manifest): raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)}')
          zen=Path('hytera_002583_2020_2025_annual_reports_latest_quarter.zip'); zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hytera-002583-all-filings-final-v3
          path: |
            海能达_002583_2020-2025年报及最新季报.zip
            hytera_002583_2020_2025_annual_reports_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
