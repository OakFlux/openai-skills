name: Discover fxbaogao search API and routes 20260922

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-search-api-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch manifests and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fxapi
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'})
          base='https://www.fxbaogao.com'
          urls=[
            base+'/',
            base+'/_next/static/4v2wc3lv5hFJIfxOm6UmQ/_buildManifest.js',
            base+'/_next/static/chunks/pages/_app-ab8fc8c1cb35a42d.js',
            base+'/_next/static/chunks/commons-9a61e8b92787faa8.js',
            base+'/_next/static/chunks/running-2a645445193df95d.js',
            base+'/_next/static/chunks/vendors-ad3816dc426fe487.js',
            'https://static.fxbaogao.com/pub/js/config/production.js',
          ]
          fetched=[]
          for i,u in enumerate(urls):
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              p=Path('fxapi')/f'{i:02d}.txt'; p.write_bytes(r.content)
              fetched.append({'url':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'type':r.headers.get('content-type')})
              print('GET',r.status_code,len(r.content),u,flush=True)
            except Exception as e:
              fetched.append({'url':u,'error':repr(e)})
          # Extract every Next.js script from the home page and fetch modest files.
          home=(Path('fxapi')/'00.txt').read_text(encoding='utf-8',errors='ignore')
          scripts=sorted(set(re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',home,re.I)))
          for j,src in enumerate(scripts):
            u=urljoin(base,src)
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              if r.status_code==200 and len(r.content)<20_000_000:
                (Path('fxapi')/f'script_{j:02d}.js').write_bytes(r.content)
                fetched.append({'url':u,'status':r.status_code,'bytes':len(r.content),'file':f'script_{j:02d}.js'})
            except Exception as e: pass
          (Path('fxapi')/'fetched.json').write_text(json.dumps(fetched,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "api\.fxbaogao|mofoun|/search|search[A-Za-z/]|keyword|report/list|report/search|detail/|reportId|queryReport|fullText|esSearch" fxapi > fxapi/grep_hits.txt || true
          grep -RhoE "https?://[^\"'[:space:]]+" fxapi | sort -u > fxapi/urls.txt || true
          find fxapi -type f -printf '%f %s bytes\n' | sort > fxapi/file_sizes.txt
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-search-api-discovery
          path: fxapi
          retention-days: 7
          if-no-files-found: error
