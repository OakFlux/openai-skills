name: Search Eastmoney globally for United Laboratories reports 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-eastmoney-global-search-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Query broad date windows and download exact matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs out/previews
          python - <<'PY'
          from __future__ import annotations
          import requests, json, re, hashlib, subprocess, time
          from pathlib import Path
          from pypdf import PdfReader

          OUT=Path('out'); PDF=OUT/'pdfs'; PREV=OUT/'previews'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          windows=[('2025-07-08','2025-07-16'),('2025-07-24','2025-08-02'),('2025-09-10','2025-09-22')]
          allrows=[]; calls=[]
          for begin,end in windows:
            for page in range(1,25):
              params={
                'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0',
                'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
              }
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(30,120))
                text=r.text.strip(); m=re.match(r'^[\w$]+\((.*)\)\s*;?$',text,re.S)
                if m:text=m.group(1)
                d=json.loads(text)
                rows=d.get('data') or (d.get('result') or {}).get('data') or []
                if isinstance(rows,dict):rows=rows.get('data') or rows.get('list') or []
                if not isinstance(rows,list):rows=[]
                calls.append({'begin':begin,'end':end,'page':page,'status':r.status_code,'bytes':len(r.content),'rows':len(rows),'url':r.url})
                allrows.extend(rows)
                if len(rows)<500:break
              except Exception as e:
                calls.append({'begin':begin,'end':end,'page':page,'error':repr(e)});break
          (OUT/'calls.json').write_text(json.dumps(calls,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'all_rows.json').write_text(json.dumps(allrows,ensure_ascii=False,indent=2),encoding='utf-8')

          def blob(row):return json.dumps(row,ensure_ascii=False)
          matched=[]
          for r in allrows:
            b=blob(r)
            if any(k in b for k in ('联邦制药','03933','3933.HK','03933.HK','The United Laboratories','UNITED LABORATORIES')):
              matched.append(r)
          # also exact title phrase fallback
          phrases=['创新突破，三靶点战略联姻诺和诺德','创新药初结硕果','抗生素龙头企业，掘金动保及代谢领域','抗生素龙头跻身创新']
          for r in allrows:
            b=blob(r)
            if any(p in b for p in phrases) and r not in matched:matched.append(r)
          # dedupe
          uniq={}
          for r in matched:
            info=r.get('infoCode') or r.get('infocode') or r.get('INFOCODE') or r.get('info_code')
            uniq[str(info or blob(r))]=r
          matched=list(uniq.values())
          (OUT/'matched_records.json').write_text(json.dumps(matched,ensure_ascii=False,indent=2),encoding='utf-8')

          vals=[]
          for r in matched:
            info=r.get('infoCode') or r.get('infocode') or r.get('INFOCODE') or r.get('info_code')
            if not info:continue
            title=str(r.get('title') or r.get('reportName') or r.get('TITLE') or 'report')
            org=str(r.get('orgSName') or r.get('orgName') or r.get('ORG_SNAME') or 'broker')
            date=str(r.get('publishDate') or r.get('publishDateStr') or r.get('PUBLISHDATE') or '')[:10]
            urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time())}']
            data=None; used=None; status=[]
            for u in urls:
              try:
                rr=s.get(u,timeout=(30,180),allow_redirects=True)
                status.append({'url':u,'status':rr.status_code,'final':rr.url,'bytes':len(rr.content),'type':rr.headers.get('content-type','')})
                if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>30000:
                  data=rr.content;used=rr.url;break
              except Exception as e:status.append({'url':u,'error':repr(e)})
            if data is None:
              vals.append({'record':r,'download_attempts':status});continue
            safe=re.sub(r'[^0-9A-Za-z\u4e00-\u9fff._-]+','_',f'{date}_{org}_{title}')[:180]
            f=PDF/(safe+'.pdf');f.write_bytes(data)
            try:
              reader=PdfReader(str(f),strict=False);pages=len(reader.pages);first=(reader.pages[0].extract_text() or '')
              subprocess.run(['qpdf','--check',str(f)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(f),str(PREV/f.stem)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              vals.append({'file':f.name,'url':used,'pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'first_text':first[:2000],'record':r,'download_attempts':status})
            except Exception as e:vals.append({'file':f.name,'url':used,'error':repr(e),'record':r})
          (OUT/'validation.json').write_text(json.dumps(vals,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'call_count':len(calls),'row_count':len(allrows),'matched':matched,'validation':vals},ensure_ascii=False,indent=2))
          PY
          find out -type f -printf '%P %s bytes\n' | sort > out/file_sizes.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-eastmoney-global-search
          path: out
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
