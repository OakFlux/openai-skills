name: Build Kangxi 688653 broker reports 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kangxi-688653-broker-reports-20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '688653'
          SHORT = '康希通信'
          FULL = '格兰康希通信科技（上海）股份有限公司'
          PACKAGE = '康希通信_688653_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '东方财富证券',
                  'date': '2024-07-10',
                  'title': 'Wi-Fi FEM国内领先企业，2024有望迎WIFI7发展元年',
                  'classification': '公司深度研究报告',
                  'rating': '增持（首次）',
                  'analysts': '马行川；联系人：刘琦',
                  'urls': [
                      'https://reportify-1252068037.cos.ap-beijing.myqcloud.com/media/production/s_fac5e4e5_fac5e4e586db1cb1cb354653675ca4ee.pdf',
                      'https://duplik-1252068037.cos.ap-beijing.myqcloud.com/duplik/447460783945158/520072899438150/bf977852162a4e529436557c239411b3447460783945158.pdf',
                  ],
                  'source_page': 'https://www.scribd.com/document/929101832/',
                  'min_pages': 25,
                  'broker_aliases': ['东方财富证券', 'Eastmoney Securities', '东方财富证券研究所'],
                  'title_token': 'Wi-FiFEM国内领先企业',
              },
              {
                  'broker': '中邮证券',
                  'date': '2025-03-19',
                  'title': 'WIFI 7 PA加速起量，智能控制模块下游整合',
                  'classification': '公司首次覆盖报告',
                  'rating': '买入（首次）',
                  'analysts': '吴文吉',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202503191644725797_1.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202503191644725797.html',
                  'min_pages': 8,
                  'broker_aliases': ['中邮证券', 'CHINA POST SECURITIES'],
                  'title_token': 'WIFI7PA加速起量',
              },
              {
                  'broker': '华金证券',
                  'date': '2023-11-01',
                  'title': '新股覆盖研究：康希通信',
                  'classification': '新股覆盖研究',
                  'rating': '未评级',
                  'analysts': '李蕙',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202311011607624966_1.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202311011607624966.html',
                  'min_pages': 8,
                  'broker_aliases': ['华金证券', 'HUAJIN SECURITIES'],
                  'title_token': '新股覆盖研究康希通信',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:120]

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          manifest = []
          for idx, rep in enumerate(reports, 1):
              attempts = []
              data = None
              source_url = ''
              for url in rep['urls']:
                  for attempt in range(6):
                      try:
                          if 'dfcfw.com' in url:
                              referer = 'https://data.eastmoney.com/report/'
                          elif 'myqcloud.com' in url:
                              referer = 'https://reportify.cn/'
                          else:
                              referer = 'https://www.eastmoney.com/'
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'attempt': attempt + 1,
                              'url': url,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 80000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'attempt': attempt + 1, 'url': url, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

              filename = f"{idx:02d}_{safe(rep['broker'])}_康希通信_{safe(rep['title'])}_{rep['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < rep['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(40, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in (SHORT, FULL, CODE, '格兰康希') if normalize(x) in compact]
              broker_hits = [x for x in rep['broker_aliases'] if normalize(x) in compact]
              title_hit = normalize(rep['title_token']) in compact
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')
              if len(compact) > 500 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch: {filename}')
              if len(compact) > 500 and not title_hit:
                  raise RuntimeError(f'Title mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{k: v for k, v in rep.items() if k not in ('broker_aliases', 'min_pages', 'title_token')},
                  'source_url': source_url,
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hit': title_hit,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'broker identity', 'report title',
                      'page count', 'qpdf structure', 'first-page render'
                  ],
              })
              print('VERIFIED', rep['broker'], rep['title'], pages, len(data), sha, source_url)

          total_pages = sum(x['actual_pages'] for x in manifest)
          readme = [
              '格兰康希通信科技（上海）股份有限公司（688653.SH）券商研究报告资料包',
              '整理日期：2026-10-29',
              '',
              '本包收录3份公开可直接取得并通过完整性核验的券商原始PDF。',
              '筛选口径：优先公司深度和首次覆盖报告，并补充一份新股覆盖研究；不使用行业周报、普通公告或网页摘要凑数。',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   来源页面：{x['source_page']}",
                  f"   实际下载源：{x['source_url']}",
                  f"   SHA-256：{x['sha256']}",
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('kangxi_688653_broker_research_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: kangxi-688653-broker-reports-final
          path: |
            康希通信_688653_券商深度报告_3份.zip
            kangxi_688653_broker_research_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
