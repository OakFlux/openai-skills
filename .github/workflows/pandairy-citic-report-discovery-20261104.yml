name: Discover CITIC Pandairy research report

on:
  push:
    paths:
      - '.github/workflows/pandairy-citic-report-discovery-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Discover report URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          starts=[
            'https://www.sgpjbg.com/labels/xiongmaozhaiquan.html',
            'https://www.sgpjbg.com/labels/xiongmaozhaitedian.html',
            'https://www.fxbaogao.com/q/2406195452812496',
          ]
          needles=['深耕炼乳','全力拓展固乳机会市场','熊猫乳品-投资价值分析报告']
          candidates=[]
          for url in starts:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('FETCH',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text
              low=text.lower()
              for needle in needles:
                idx=text.find(needle)
                print('NEEDLE',needle,idx,flush=True)
                if idx>=0:
                  print('CONTEXT',text[max(0,idx-1000):idx+1800],flush=True)
              soup=BeautifulSoup(text,'html.parser')
              for tag in soup.find_all(['a','iframe','embed','script']):
                vals=[]
                for attr in ('href','src','data-url','data-src','data-href','onclick'):
                  v=tag.get(attr)
                  if v: vals.append(str(v))
                visible=tag.get_text(' ',strip=True)
                joined=' '.join(vals+[visible])
                if any(n in joined for n in needles) or '熊猫乳品' in joined:
                  print('MATCH_TAG',tag.name,json.dumps({'attrs':dict(tag.attrs),'text':visible[:500]},ensure_ascii=False),flush=True)
                  for v in vals:
                    for m in re.findall(r'https?://[^\"\'<> ]+|/[^\"\'<> ]+',html.unescape(v)):
                      candidates.append(urljoin(r.url,m))
              for m in re.findall(r'https?://[^\"\'<> ]+|/[A-Za-z0-9_./?=&%-]+',html.unescape(text)):
                if any(x in m.lower() for x in ('bgdown','download','pdf','report','detail')):
                  candidates.append(urljoin(r.url,m))
            except Exception as e:
              print('FETCH_ERR',url,repr(e),flush=True)
          uniq=[]
          for u in candidates:
            u=u.replace('&amp;','&').rstrip(');,')
            if u not in uniq: uniq.append(u)
          print('CANDIDATES',json.dumps(uniq[:300],ensure_ascii=False,indent=2),flush=True)
          for url in uniq[:120]:
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              ct=(r.headers.get('content-type') or '').lower()
              print('FOLLOW',url,r.status_code,len(r.content),r.url,ct,flush=True)
              if r.content.startswith(b'%PDF'):
                print('FOUND_PDF',r.url,len(r.content),flush=True)
                continue
              text=r.text
              if any(n in text for n in needles) or '熊猫乳品' in text:
                print('FOLLOW_MATCH_CONTEXT',text[:12000],flush=True)
              links=re.findall(r'https?://[^\"\'<> ]+\.pdf[^\"\'<> ]*|/[^\"\'<> ]+\.pdf[^\"\'<> ]*',html.unescape(text),re.I)
              if links:
                print('PDF_LINKS',json.dumps([urljoin(r.url,x) for x in links],ensure_ascii=False),flush=True)
            except Exception as e:
              print('FOLLOW_ERR',url,repr(e),flush=True)
          PY
