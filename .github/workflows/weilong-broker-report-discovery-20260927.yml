name: Discover Weilong Delicious broker report PDF sources 20260927

on:
  push:
    paths:
      - '.github/workflows/weilong-broker-report-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Search and inspect public pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('weilong_discovery'); OUT.mkdir(exist_ok=True)
          session = requests.Session(); session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          queries = [
              '"卫龙美味" "魔芋十年磨剑迎爆发" pdf',
              '"卫龙美味" "辣味休闲食品龙头" pdf',
              '"卫龙美味" "全能选手，乘风而起" pdf',
              '"卫龙美味" "小辣条造就大玩家" pdf',
              'site:pdf.dfcfw.com 卫龙美味 国海证券',
              'site:pdf.dfcfw.com 卫龙美味 国信证券',
              'site:pdf.dfcfw.com 09985 卫龙美味 深度',
          ]
          search_urls=[]
          for q in queries:
              enc=urllib.parse.quote(q)
              search_urls += [
                  f'https://www.bing.com/search?q={enc}&count=50',
                  f'https://www.baidu.com/s?wd={enc}&rn=50',
                  f'https://www.so.com/s?q={enc}',
              ]

          targets = search_urls + [
              'https://www.baogaobox.com/reports/250626000065338.html',
              'https://www.baogaobox.com/reports/250422000056654.html',
              'https://www.baogaobox.com/reports/250318000008758.html',
              'https://www.vzkoo.com/question/1761728539694779',
              'https://www.fxbaogao.com/q/2511226017912869',
              'https://www.fxbaogao.com/q/2508255388457691',
              'https://finance.sina.com.cn/stock/relnews/hk/2025-02-27/doc-inemxrkc7795747.shtml',
          ]

          all_urls=set(); records=[]
          url_pat=re.compile(r'https?://[^\s"\'<>\\]+')
          for i,u in enumerate(targets,1):
              rec={'input_url':u}
              try:
                  r=session.get(u,timeout=(20,90),allow_redirects=True)
                  rec.update(status=r.status_code, final_url=r.url, content_type=r.headers.get('content-type'), bytes=len(r.content))
                  (OUT/f'{i:03d}.html').write_bytes(r.content)
                  text=r.text
                  soup=BeautifulSoup(text,'lxml')
                  rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                  found=set()
                  for tag in soup.find_all(True):
                      for attr in ('href','src','data-src','data-url','data-original','content'):
                          v=tag.get(attr)
                          if not v or not isinstance(v,str): continue
                          v=html.unescape(v).replace('\\/','/')
                          if v.startswith(('javascript:','data:','#')): continue
                          found.add(urllib.parse.urljoin(r.url,v))
                  for m in url_pat.finditer(text):
                      found.add(html.unescape(m.group(0)).replace('\\/','/'))
                  # Decode common Bing/Baidu redirect query parameters.
                  extra=set()
                  for v in found:
                      try:
                          p=urllib.parse.urlparse(v); qs=urllib.parse.parse_qs(p.query)
                          for key in ('url','u','target','r','wd'):
                              for x in qs.get(key,[]):
                                  x=urllib.parse.unquote(x)
                                  if x.startswith('http'): extra.add(x)
                      except Exception: pass
                  found |= extra
                  interesting=sorted(x for x in found if any(k in x.lower() for k in ('pdf','dfcfw','fxbaogao','baogaobox','vzkoo','hibor','yanbao','report','research','download')))
                  rec['interesting_urls']=interesting[:2000]
                  all_urls.update(interesting)
                  snippets=[]
                  for line in text.splitlines():
                      ll=line.lower()
                      if any(k in ll for k in ('卫龙','weilong','09985','9985','pdf.dfcfw','魔芋十年','辣味休闲','全能选手')):
                          s=re.sub(r'\s+',' ',line).strip()
                          if s and len(s)<5000: snippets.append(s)
                  rec['snippets']=snippets[:500]
              except Exception as e:
                  rec['error']=repr(e)
              records.append(rec)
              (OUT/f'{i:03d}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
              print(i,rec.get('status'),rec.get('title',''),len(rec.get('interesting_urls',[])),rec.get('error',''),flush=True)

          (OUT/'all_interesting_urls.txt').write_text('\n'.join(sorted(all_urls)),encoding='utf-8')
          (OUT/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "pdf\.dfcfw\.com|\.pdf([?\"']|$)|魔芋十年|辣味休闲食品龙头|全能选手|小辣条造就大玩家" weilong_discovery > weilong_discovery/grep_hits.txt || true
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: weilong-broker-report-discovery-20260927
          path: weilong_discovery
          retention-days: 7
          if-no-files-found: error
