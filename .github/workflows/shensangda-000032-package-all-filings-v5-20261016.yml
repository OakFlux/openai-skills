name: Package Deep Sanda 000032 all filings v5 20261016
on:
  push:
    paths:
      - '.github/workflows/shensangda-000032-package-all-filings-v5-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Enable exact attachment discovery
        run: python .github/scripts/patch_shensangda_fast_20261016.py
      - name: Build verified archive
        run: python .github/scripts/shensangda_package_20261016.py
      - uses: actions/upload-artifact@v4
        with:
          name: shensangda-000032-all-filings-v5-20261016
          path: |
            深桑达A_000032_上市以来年报_招股说明书及最新季报_截至20261016.zip
            shensangda_000032_all_annual_reports_prospectus_latest_quarter_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
