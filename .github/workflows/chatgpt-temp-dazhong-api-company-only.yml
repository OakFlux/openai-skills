name: chatgpt-temp-dazhong-api-company-only
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-api-company-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find company records in monthly windows
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json,time
          from pathlib import Path
          import requests
          W=Path('dazhong_company_records');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          found=[];logs=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          def parse(t):
            try:return json.loads(t)
            except:
              a=t.find('{');b=t.rfind('}')
              try:return json.loads(t[a:b+1]) if a>=0 and b>a else {}
              except:return {}
          for begin,end in [('2023-07-01','2023-07-31'),('2022-12-01','2022-12-31'),('2022-04-01','2022-04-30')]:
            for q in [0,1,2]:
              for pg in range(1,30):
                p={'cb':'jQuery1124','pageSize':100,'pageNo':pg,'qType':q,'beginTime':begin,'endTime':end,'fields':'','orgCode':'','author':'','industryCode':'*','industry':'*','rating':'','ratingChange':'','rcode':'','_':int(time.time()*1000)}
                r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=45);o=parse(r.text);x=o.get('data') or []
                if isinstance(x,dict):x=x.get('data') or x.get('list') or []
                if not isinstance(x,list):x=[]
                for rec in x:
                  txt=json.dumps(rec,ensure_ascii=False)
                  if '大众公用' in txt or '600635' in txt or '01635' in txt:
                    found.append(rec);L('FOUND '+txt)
                total=int(o.get('TotalPage') or 1)
                if not x or pg>=total:break
          (W/'found.json').write_text(json.dumps(found,ensure_ascii=False,indent=2),encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8');print('FINAL '+str(len(found)),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Company-Records
          path: dazhong_company_records
          retention-days: 1
          compression-level: 6
