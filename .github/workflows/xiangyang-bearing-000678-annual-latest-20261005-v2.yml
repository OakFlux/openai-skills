name: Build Xiangyang Bearing 000678 annual latest 20261005 v2

on:
  push:
    paths:
      - '.github/workflows/xiangyang-bearing-000678-annual-latest-20261005-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Extract patch and run package script
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='.github/workflows/xiangyang-bearing-000678-annual-latest-20261005.yml'
          sed -n "/python - <<'PY'/,/^          PY$/p" "$SOURCE" | sed '1d;$d;s/^          //' > /tmp/xiangyang_pkg.py
          python - <<'PATCH'
          from pathlib import Path
          import re

          path = Path('/tmp/xiangyang_pkg.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"payload = get_json\('https://www\.cninfo\.com\.cn/new/data/szse_stock\.json'\)\n"
              r"stock_candidates: list\[str\] = \[\]\n.*?"
              r"print\('STOCK_CANDIDATES', stock_candidates, flush=True\)\n",
              re.S,
          )
          replacement = """stock_candidates = [
              f'{CODE},gssz0000678',
              f'{CODE},9900000678',
              CODE,
          ]
          print('STOCK_CANDIDATES', stock_candidates, flush=True)
          """
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Stock-list patch failed: {count}')
          path.write_text(text, encoding='utf-8')
          PATCH
          python -m py_compile /tmp/xiangyang_pkg.py
          python /tmp/xiangyang_pkg.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xiangyang-bearing-000678-annual-latest-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: xiangyang-bearing-000678-verification-renders-v2
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
