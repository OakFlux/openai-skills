name: Package corrected Longjian 600853 filings

on:
  push:
    branches:
      - tmp/longjian-600853-filings-20261029-v1
    paths:
      - .github/workflows/longjian-600853-filings-corrected-20261029-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = "600853"
          SHORT = "龙建股份"
          FULL = "龙建路桥股份有限公司"
          PREPARED = "2026-10-29"
          ROOT_NAME = "龙建股份_600853_2020-2025年报及最新季报"
          PACKAGE_NAME = "longjian_600853_2020_2025_annual_latest_quarter_corrected.zip"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF原件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          specs = [
              {
                  "kind": "annual",
                  "period": "2020年年度报告",
                  "announcement_title": "龙建股份2020年年度报告",
                  "disclosure_date": "2021-03-31",
                  "url": "https://static.cninfo.com.cn/finalpage/2021-03-31/1209484595.PDF",
                  "expected_pages": 248,
              },
              {
                  "kind": "annual",
                  "period": "2021年年度报告",
                  "announcement_title": "龙建股份2021年年度报告全文",
                  "disclosure_date": "2022-03-31",
                  "url": "https://static.cninfo.com.cn/finalpage/2022-03-31/1212745061.PDF",
                  "expected_pages": 256,
              },
              {
                  "kind": "annual",
                  "period": "2022年年度报告",
                  "announcement_title": "龙建股份2022年年度报告全文（修订版）",
                  "disclosure_date": "2023-12-13",
                  "url": "https://static.cninfo.com.cn/finalpage/2023-12-13/1218594797.PDF",
                  "expected_pages": 238,
              },
              {
                  "kind": "annual",
                  "period": "2023年年度报告",
                  "announcement_title": "龙建股份2023年年度报告全文",
                  "disclosure_date": "2024-04-20",
                  "url": "https://static.cninfo.com.cn/finalpage/2024-04-20/1219698527.PDF",
                  "expected_pages": 322,
              },
              {
                  "kind": "annual",
                  "period": "2024年年度报告",
                  "announcement_title": "龙建股份2024年年度报告全文",
                  "disclosure_date": "2025-03-29",
                  "url": "https://static.cninfo.com.cn/finalpage/2025-03-29/1222948260.PDF",
                  "expected_pages": 304,
              },
              {
                  "kind": "annual",
                  "period": "2025年年度报告",
                  "announcement_title": "龙建股份2025年年度报告",
                  "disclosure_date": "2026-04-25",
                  "url": "https://static.cninfo.com.cn/finalpage/2026-04-25/1225178170.PDF",
                  "expected_pages": 261,
              },
              {
                  "kind": "quarter",
                  "period": "2026年第三季度报告",
                  "announcement_title": "龙建股份2026第三季度报告",
                  "disclosure_date": "2026-10-28",
                  "url": "https://static.cninfo.com.cn/finalpage/2026-10-28/1225629938.PDF",
                  "expected_pages": None,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer": "https://www.cninfo.com.cn/",
              "Accept": "application/pdf,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def download(url: str) -> tuple[bytes, str, list[dict]]:
              candidates = [url]
              if url.startswith("https://"):
                  candidates.append("http://" + url[len("https://"):])
              attempts = []
              for candidate in candidates:
                  for attempt in range(5):
                      try:
                          response = session.get(candidate, timeout=(30, 420), allow_redirects=True)
                          record = {
                              "url": candidate,
                              "status": response.status_code,
                              "bytes": len(response.content),
                              "content_type": response.headers.get("content-type", ""),
                              "magic": response.content[:8].hex(),
                              "final_url": response.url,
                          }
                          attempts.append(record)
                          print("PDF_REQUEST", json.dumps(record, ensure_ascii=False))
                          if response.status_code == 200 and response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                              return response.content, response.url, attempts
                      except Exception as exc:
                          attempts.append({"url": candidate, "error": repr(exc)})
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Download failed for {url}: {attempts}")

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text)
              return re.sub(r"\s+", " ", text).strip(" ._")[:150]

          manifest = []
          for index, spec in enumerate(specs, 1):
              content, used_url, attempts = download(spec["url"])
              filename = safe_name(f"{index:02d}_{SHORT}_{spec['period']}.pdf")
              path = PDF_DIR / filename
              path.write_bytes(content)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages <= 0:
                  raise RuntimeError(f"Invalid page count for {filename}")
              if spec["expected_pages"] is not None and pages != spec["expected_pages"]:
                  raise RuntimeError(f"Unexpected page count for {filename}: {pages} != {spec['expected_pages']}")

              text_parts = []
              for page in reader.pages[: min(20, pages)]:
                  try:
                      text_parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              sample_text = "\n".join(text_parts)
              if not any(token in sample_text for token in [SHORT, FULL, CODE]):
                  raise RuntimeError(f"Issuer validation failed for {filename}")
              year = spec["period"][:4]
              if year not in sample_text:
                  print("WARN_YEAR_NOT_FOUND", filename, year)

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {filename}: {qpdf.stdout}")

              preview_prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "120", "-singlefile", str(path), str(preview_prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(preview_prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")

              manifest.append({
                  "filename": filename,
                  "kind": spec["kind"],
                  "period": spec["period"],
                  "announcement_title": spec["announcement_title"],
                  "disclosure_date": spec["disclosure_date"],
                  "source_url": used_url,
                  "pages": pages,
                  "bytes": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "preview_file": str(Path("首页预览") / preview.name),
                  "download_attempts": attempts,
              })

          if len(manifest) != 7 or manifest[-1]["period"] != "2026年第三季度报告":
              raise RuntimeError("Final manifest does not contain the required seven filings with 2026 Q3 last")

          payload = {
              "company": SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "latest_quarter": "2026年第三季度报告",
              "source_platform": "巨潮资讯网（法定信息披露平台）",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "报告期间", "公告标题", "公告日期", "页数", "字节数", "SHA-256", "官方PDF来源"])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["period"], item["announcement_title"], item["disclosure_date"],
                      item["pages"], item["bytes"], item["sha256"], item["source_url"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF原件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          readme = [
              f"{SHORT}（{CODE}.SH）2020-2025年年度报告及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "来源：巨潮资讯网法定信息披露文件原始PDF",
              "",
              "本包共收录7份PDF：2020-2025年年度报告6份，以及2026年第三季度报告1份。",
              "2022年年度报告采用后续披露的修订版。",
              "",
          ]
          for i, item in enumerate(manifest, 1):
              readme.extend([
                  f"{i}. {item['filename']}",
                  f"   公告标题：{item['announcement_title']}",
                  f"   公告日期：{item['disclosure_date']}；实际页数：{item['pages']}页；大小：{item['bytes']}字节",
                  f"   官方PDF：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称/证券代码、报告期间、实际页数、qpdf结构检查、首页渲染、逐文件SHA-256、ZIP CRC。",
              "说明：同一年度如存在修订版或更新版，优先收录后续披露的完整版本。",
          ])
          (ROOT / "README_文件清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          zip_path = Path(PACKAGE_NAME)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "file_count": len(manifest),
              "latest_quarter": "2026年第三季度报告",
              "files": [{k: item[k] for k in ["filename", "period", "announcement_title", "disclosure_date", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: longjian-600853-filings-corrected-20261029
          path: |
            longjian_600853_2020_2025_annual_latest_quarter_corrected.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
