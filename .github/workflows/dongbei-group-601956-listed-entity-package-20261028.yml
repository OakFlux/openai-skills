name: Package Dongbei Group listed-entity filings

on:
  push:
    paths:
      - '.github/workflows/dongbei-group-601956-listed-entity-package-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, validate and package PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import time
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '东贝集团'
          FULL_COMPANY = '湖北东贝机电集团股份有限公司'
          CODE = '601956'
          CUTOFF = '2026-10-28'
          CUT = '20261028'
          ROOT_NAME = f'{COMPANY}_{CODE}_上市以来全部年报_上市文件及最新季报_截至{CUT}'
          ROOT = Path('work') / ROOT_NAME
          DIST = Path('dist')
          D_LIST = ROOT / '00_上市与发行文件'
          D_ANNUAL = ROOT / '01_年度报告_2020-2025'
          D_QUARTER = ROOT / '02_最新季度报告'
          D_PREVIEW = ROOT / '首页预览'
          for d in (D_LIST, D_ANNUAL, D_QUARTER, D_PREVIEW, DIST):
              d.mkdir(parents=True, exist_ok=True)

          docs: list[dict[str, Any]] = [
              {
                  'document_type': 'merger_report',
                  'period': '2020-listing-transaction',
                  'title': '湖北东贝机电集团股份有限公司换股吸收合并黄石东贝电器股份有限公司暨关联交易报告书（修订稿）',
                  'announcement_date': '2020-09-30',
                  'file_name': '2020_东贝集团_换股吸收合并东贝B股暨关联交易报告书_修订稿.pdf',
                  'directory': D_LIST,
                  'source_platform': '上海证券交易所',
                  'urls': [
                      'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/2020-09-30/900956_20200930_2.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AN202009291418214963_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AN202009291418214963_1.pdf',
                  ],
              },
              {
                  'document_type': 'listing_announcement',
                  'period': '2020-listing-announcement',
                  'title': '湖北东贝机电集团股份有限公司换股吸收合并黄石东贝电器股份有限公司上市公告书',
                  'announcement_date': '2020-12-24',
                  'file_name': '2020_东贝集团_换股吸收合并东贝B股上市公告书.pdf',
                  'directory': D_LIST,
                  'source_platform': '上市公司公告镜像（东方财富）',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H2_AN202012231443179054_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AN202012231443179054_1.pdf',
                  ],
              },
          ]

          annuals = [
              (2020, 'AN202103151472147118', '2021-03-16'),
              (2021, 'AN202204191560262782', '2022-04-20'),
              (2022, 'AN202303241584542754', '2023-03-25'),
              (2023, 'AN202404031629710888', '2024-04-04'),
              (2024, 'AN202504101654173528', '2025-04-11'),
              (2025, 'AN202604171821298763', '2026-04-18'),
          ]
          for year, art, date in annuals:
              docs.append({
                  'document_type': 'annual_report',
                  'period': str(year),
                  'title': f'东贝集团{year}年年度报告',
                  'announcement_date': date,
                  'file_name': f'{year}_东贝集团_{year}年年度报告.pdf',
                  'directory': D_ANNUAL,
                  'source_platform': '上市公司公告镜像（东方财富）',
                  'urls': [
                      f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                  ],
              })

          docs.append({
              'document_type': 'quarterly_report',
              'period': '2026Q3',
              'title': '东贝集团2026年第三季度报告',
              'announcement_date': '2026-10-24',
              'file_name': '2026Q3_东贝集团_2026年第三季度报告.pdf',
              'directory': D_QUARTER,
              'source_platform': '上市公司公告镜像（东方财富）',
              'urls': [
                  'https://pdf.dfcfw.com/pdf/H2_AN202610231830844053_1.pdf',
                  'https://pdf.dfcfw.com/pdf/H3_AN202610231830844053_1.pdf',
              ],
          })

          def make_session() -> requests.Session:
              s = requests.Session()
              retry = Retry(
                  total=5,
                  connect=5,
                  read=4,
                  status=5,
                  backoff_factor=1.0,
                  status_forcelist=(403, 408, 429, 500, 502, 503, 504),
                  allowed_methods=frozenset({'GET'}),
                  raise_on_status=False,
              )
              s.mount('https://', HTTPAdapter(max_retries=retry))
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              })
              return s

          S = make_session()

          def safe_name(v: str) -> str:
              v = re.sub(r'[\\/:*?"<>|]', '_', v)
              v = re.sub(r'\s+', '', v)
              return re.sub(r'_+', '_', v).strip('_. ')

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def download(item: dict[str, Any], dest: Path) -> str:
              errors: list[str] = []
              for url in item['urls']:
                  for attempt in range(1, 3):
                      try:
                          with S.get(
                              url,
                              headers={
                                  'Referer': 'https://www.sse.com.cn/' if 'sse.com.cn' in url else 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(20, 180),
                              stream=True,
                          ) as r:
                              print('DOWNLOAD', attempt, r.status_code, r.headers.get('content-length'), url)
                              if r.status_code != 200:
                                  errors.append(f'{url}: HTTP {r.status_code}')
                                  continue
                              tmp = dest.with_suffix('.part')
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024 * 1024):
                                      if chunk:
                                          f.write(chunk)
                              size = tmp.stat().st_size
                              with tmp.open('rb') as f:
                                  header = f.read(4)
                              if size < 20_000 or header != b'%PDF':
                                  errors.append(f'{url}: invalid PDF size={size}, header={header!r}')
                                  tmp.unlink(missing_ok=True)
                                  continue
                              tmp.replace(dest)
                              return url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(0.8)
              raise RuntimeError(f"无法下载完整PDF：{item['title']}; errors={errors}")

          records: list[dict[str, Any]] = []
          total_pages = 0
          for item in docs:
              dest = item['directory'] / safe_name(item['file_name'])
              used_url = download(item, dest)

              reader = PdfReader(str(dest), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception as exc:
                      raise RuntimeError(f'PDF加密且无法打开：{dest}: {exc}')
              pages = len(reader.pages)
              if pages < 2:
                  raise RuntimeError(f'PDF页数异常：{dest}: {pages}')

              doc = fitz.open(dest)
              if doc.page_count != pages:
                  raise RuntimeError(f'双解析器页数不一致：{dest}: pypdf={pages}, fitz={doc.page_count}')
              first = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(0.9, 0.9), alpha=False)
              last = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.6, 0.6), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 80:
                  raise RuntimeError(f'PDF页面渲染异常：{dest}')
              first.save(D_PREVIEW / f'{dest.stem}.png')

              probe = ''
              for pageno in range(min(6, doc.page_count)):
                  try:
                      probe += doc.load_page(pageno).get_text('text')
                  except Exception:
                      pass
              doc.close()
              company_text_ok = any(k in probe for k in (COMPANY, FULL_COMPANY, CODE, '东贝'))
              if not company_text_ok:
                  print('WARNING_TEXT_PROBE', dest.name)

              rec = {
                  'document_type': item['document_type'],
                  'period': item['period'],
                  'title': item['title'],
                  'announcement_date': item['announcement_date'],
                  'source_platform': item['source_platform'],
                  'source_url': used_url,
                  'relative_path': str(dest.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': dest.name,
                  'file_size_bytes': dest.stat().st_size,
                  'page_count': pages,
                  'sha256': sha256_file(dest),
                  'pdf_header_valid': True,
                  'company_text_probe': company_text_ok,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
              }
              records.append(rec)
              total_pages += pages
              print('VERIFIED', json.dumps(rec, ensure_ascii=False))

          annual_years = sorted(int(r['period']) for r in records if r['document_type'] == 'annual_report')
          if annual_years != list(range(2020, 2026)):
              raise RuntimeError(f'年度报告年份不完整：{annual_years}')
          if len(records) != 9:
              raise RuntimeError(f'PDF数量异常：{len(records)} != 9')

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'listing_date': '2020-12-25',
              'cutoff_date': CUTOFF,
              'annual_report_years': annual_years,
              'latest_quarter': '2026Q3',
              'document_count': len(records),
              'total_pages': total_pages,
              'prospectus_note': '东贝集团通过换股吸收合并东贝B股上市，并非传统首次公开发行。可检索公告中不存在传统IPO招股说明书，因此本包收录最终换股吸收合并报告书及上市公告书作为对应的正式上市文件。',
              'selection_policy': {
                  'annual_reports': '收录东贝集团现上市主体自上市以来2020—2025年全部年度报告全文，排除摘要、问询回复、持续督导报告及单独审计文件。',
                  'listing_documents': '收录最终换股吸收合并暨关联交易报告书（修订稿）和上市公告书，不把其他文件冒充招股说明书。',
                  'latest_quarter': '收录截至2026-10-28最新正式披露的2026年第三季度报告。',
              },
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）上市以来官方披露文件包', '',
              f'- 截止日期：{CUTOFF}',
              '- 上市日期：2020-12-25。',
              '- 年度报告：2020—2025年，共6份完整年度报告。',
              '- 最新正式季报：2026年第三季度报告。',
              '- 上市文件：最终换股吸收合并暨关联交易报告书（修订稿）、上市公告书。',
              f'- PDF总数：{len(records)}份；合计页数：{total_pages}页。', '',
              '## 招股说明书说明', '',
              '- 东贝集团601956通过换股吸收合并东贝B股上市，并非传统首次公开发行。',
              '- 因此没有传统IPO招股说明书。本包收录最终换股吸收合并报告书和上市公告书作为对应的正式上市文件，没有使用其他文件冒充招股说明书。', '',
              '## 文件清单', '',
          ]
          for i, r in enumerate(records, 1):
              readme += [
                  f"{i}. `{r['relative_path']}`",
                  f"   - 标题：{r['title']}",
                  f"   - 披露日期：{r['announcement_date']}；页数：{r['page_count']}；大小：{r['file_size_bytes']:,}字节",
                  f"   - 来源：{r['source_platform']}；{r['source_url']}",
                  f"   - SHA-256：`{r['sha256']}`",
              ]
          readme += ['', '## 校验', '', '- 每份PDF已完成文件头、双解析器页数、首末页渲染及SHA-256校验。', '- ZIP已完成CRC完整性检测。']
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          final_cn = DIST / f'{ROOT_NAME}.zip'
          final_en = DIST / f'dongbei_group_601956_all_annual_reports_listing_docs_latest_quarter_{CUT}.zip'
          for path in (final_cn, final_en):
              path.unlink(missing_ok=True)
          with zipfile.ZipFile(final_cn, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      zf.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(final_cn, final_en)

          for path in (final_cn, final_en):
              with zipfile.ZipFile(path) as zf:
                  bad = zf.testzip()
                  pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if bad or len(pdfs) != len(records):
                      raise RuntimeError(f'ZIP校验失败：{path}; bad={bad}; pdfs={len(pdfs)}; expected={len(records)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256_file(path))

          print('FINAL_JSON', json.dumps({
              'document_count': len(records),
              'annual_report_count': 6,
              'annual_years': annual_years,
              'listing_document_count': 2,
              'latest_quarter': '2026Q3',
              'total_pages': total_pages,
              'chinese_zip': str(final_cn),
              'english_zip': str(final_en),
              'chinese_zip_size': final_cn.stat().st_size,
              'chinese_zip_sha256': sha256_file(final_cn),
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongbei-group-601956-listed-entity-filings-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
