name: Capture QuantGroup report HTML v2 20260920

on:
  push:
    paths:
      - '.github/workflows/quantgroup-report-html-fast-v2-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Python packages
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Capture pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          python - <<'PY'
          import requests, json, re, html
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pathlib import Path
          urls={
            'microbell':'https://www.microbell.com/repinfodetail_5329571.html',
            'fxbaogao':'https://www.fxbaogao.com/detail/5553065'
          }
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for k,u in urls.items():
            rec={'input':u}
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              Path(f'out/{k}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.content,'lxml')
              rec.update(status=r.status_code,url=r.url,headers=dict(r.headers),title=soup.title.get_text(' ',strip=True) if soup.title else '')
              rec['links']=[{'text':a.get_text(' ',strip=True),'href':urljoin(r.url,a['href']),'attrs':dict(a.attrs)} for a in soup.find_all('a',href=True)]
              rec['scripts']=[{'src':urljoin(r.url,x.get('src')) if x.get('src') else None,'text':(x.string or x.get_text())[:50000]} for x in soup.find_all('script')]
              rec['images']=[]
              for im in soup.find_all('img'):
                src=im.get('src') or im.get('data-src') or im.get('data-original')
                if src: rec['images'].append({'src':urljoin(r.url,src),'attrs':dict(im.attrs)})
              rec['regex_urls']=sorted(set(html.unescape(x).replace('\\/','/') for x in re.findall(r'https?://[^\s"\'<>]+',r.text)))
            except Exception as e:
              rec['error']=repr(e)
            Path(f'out/{k}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quantgroup-report-html-fast-v2
          path: out
          retention-days: 7
