name: Search Sina reports for ST Guangtang exact 20261004

on:
  push:
    paths:
      - '.github/workflows/st-guangtang-sina-search-exact-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact stock report results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from html import unescape
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          base='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=2&symbol=000911'
          for page in range(1,11):
              url=base+f'&p={page}'
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nPAGE',page,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,flush=True)
              r.raise_for_status()
              text=r.content.decode('gb18030',errors='replace')
              found=[]
              for m in re.finditer(r'<a[^>]+title="([^"]+)"[^>]+href="([^"]*vReport_Show[^"]+)"',text,re.I):
                  title=unescape(m.group(1)); href=urljoin(r.url,m.group(2))
                  found.append((title,href))
              for title,href in found:
                  print('REPORT',title,'URL',href,flush=True)
              print('COUNT',len(found),flush=True)
              if not found:
                  break
          PY
