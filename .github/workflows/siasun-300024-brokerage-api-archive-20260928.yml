name: List archived SIASUN Robot brokerage reports 20260928

on:
  push:
    paths:
      - '.github/workflows/siasun-300024-brokerage-api-archive-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query archived Eastmoney reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/json,*/*'})
          for start,end in [('2009-01-01','2013-12-31'),('2014-01-01','2017-12-31')]:
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':start,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','code':'300024','rcode':'','p':'1','pageNum':'1','pageNumber':'1','_':str(int(time.time()*1000))}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
              print('RANGE',start,end,'STATUS',r.status_code,'BYTES',len(r.content),flush=True)
              r.raise_for_status(); payload=r.json(); rows=payload.get('data',[]) if isinstance(payload,dict) else []
              print('ROW_COUNT',len(rows),flush=True)
              for row in rows:
                  print('REPORT_ROW',json.dumps({k:row.get(k) for k in ['title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','column','emRatingName','encodeUrl']},ensure_ascii=False),flush=True)
          PY
