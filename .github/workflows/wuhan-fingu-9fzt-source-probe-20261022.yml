name: Probe 9FZT Wuhan Fingu report source 20261022

on:
  push:
    paths:
      - '.github/workflows/wuhan-fingu-9fzt-source-probe-20261022.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect page, scripts and API calls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          url='https://www.9fzt.com/detail/sz_002194_10_650430884853.html'
          r=s.get(url,headers=h,timeout=(20,120),allow_redirects=True)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          text=r.text
          keys=['650430884853','002194','pdf','download','fileurl','file_url','sourceurl','source_url','attachment','attach','report','研报','海通','iframe','contentId','articleId','docId','originUrl','originalUrl']
          for i,line in enumerate(text.splitlines(),1):
            low=line.lower()
            if any(k.lower() in low for k in keys):
              if len(line)<18000:print('LINE',i,line[:17500])
          soup=BeautifulSoup(text,'lxml')
          scripts=[];urls=[]
          for tag in soup.find_all(True):
            for attr in ['href','src','data-src','data-url','data-file','data-pdf','content']:
              v=tag.get(attr)
              if not v:continue
              u=urllib.parse.urljoin(r.url,html.unescape(str(v)))
              if tag.name=='script' and attr=='src':scripts.append(u)
              if any(k in u.lower() for k in ['pdf','download','report','650430884853','002194','detail']):urls.append(u)
          for m in re.findall(r'https?://[^\s"\'<>]+',text):
            m=html.unescape(m)
            if any(k in m.lower() for k in ['pdf','download','report','650430884853','002194']):urls.append(m)
          print('URLS',json.dumps(list(dict.fromkeys(urls))[:500],ensure_ascii=False,indent=2))
          print('SCRIPTS',json.dumps(scripts,ensure_ascii=False,indent=2))
          for su in scripts:
            if any(k in su.lower() for k in ['detail','article','research','report','main','chunk','app']):
              try:
                x=s.get(su,headers=h,timeout=(15,90));st=x.text
                print('\nSCRIPT',su,x.status_code,len(x.content))
                for pat in ['650430884853','fileUrl','file_url','pdf','download','report','sourceUrl','originUrl','attachment','detailApi','articleId']:
                  hits=list(re.finditer(pat,st,re.I))
                  if hits:
                    print('PAT',pat,'COUNT',len(hits))
                    for m in hits[:20]:print('CTX',st[max(0,m.start()-350):m.end()+900].replace('\n',' ')[:1400])
              except Exception as e:print('SCRIPTERR',su,repr(e))
          PY
