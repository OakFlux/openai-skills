name: Build Robot 300024 broker deep report package 20260928

on:
  push:
    paths:
      - '.github/workflows/robot-300024-broker-deep-reports-20260928.yml'
      - 'scripts/robot_300024_broker_reports_20260928.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Build package
        run: python scripts/robot_300024_broker_reports_20260928.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: robot-300024-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
