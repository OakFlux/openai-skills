name: Build Shangneng 300827 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shangneng-300827-broker-deep-reports-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = '300827'
          SHORT = '上能电气'
          FULL = '上能电气股份有限公司'
          ROOT_NAME = '上能电气_300827_券商深度报告'
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / '原始PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          for directory in (ROOT, PDF_DIR, PREVIEW_DIR):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': f'https://data.eastmoney.com/report/stock.jshtml?stockCode={CODE}',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/json,text/plain,*/*',
          })

          API = 'https://reportapi.eastmoney.com/report/list'
          request_log: list[dict[str, Any]] = []

          def fetch_page(page: int) -> dict[str, Any]:
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2022-01-01', 'endTime': '2026-10-28',
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'author': '', 'code': CODE, 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              last: dict[str, Any] = {}
              for attempt in range(7):
                  try:
                      response = session.get(API, params=params, timeout=(20, 120))
                      last = {
                          'url': response.url, 'status': response.status_code,
                          'bytes': len(response.content),
                          'content_type': response.headers.get('content-type', ''),
                          'prefix': response.text[:200],
                      }
                      request_log.append(last)
                      if response.status_code == 200:
                          return response.json()
                  except Exception as exc:
                      last = {'url': API, 'params': params, 'attempt': attempt + 1, 'error': repr(exc)}
                      request_log.append(last)
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Report API failed: {last}')

          def rows_from(payload: dict[str, Any]) -> list[dict[str, Any]]:
              rows = payload.get('data') or []
              if isinstance(rows, dict):
                  rows = rows.get('list') or rows.get('data') or []
              return [row for row in rows if isinstance(row, dict)] if isinstance(rows, list) else []

          rows: list[dict[str, Any]] = []
          seen: set[str] = set()
          for page in range(1, 11):
              payload = fetch_page(page)
              current = rows_from(payload)
              for row in current:
                  key = str(row.get('infoCode') or '') or json.dumps(row, ensure_ascii=False, sort_keys=True)
                  if key not in seen:
                      seen.add(key)
                      rows.append(row)
              total_pages = int(payload.get('TotalPage') or payload.get('totalPage') or 0)
              if not current or (total_pages and page >= total_pages) or len(current) < 100:
                  break
              time.sleep(0.2)

          fallback_rows = [
              {
                  'infoCode': 'AP202410291640563338',
                  'stockCode': CODE, 'stockName': SHORT,
                  'orgSName': '华安证券', 'publishDate': '2024-10-28 00:00:00.000',
                  'attachPages': 34,
                  'title': '集中式光储领军企业，向中高ROE市场进阶',
                  'researcher': '张志邦,王雲昊', 'emRatingName': '买入',
              },
              {
                  'infoCode': 'AP202411191640954479',
                  'stockCode': CODE, 'stockName': SHORT,
                  'orgSName': '东吴证券', 'publishDate': '2024-11-19 00:00:00.000',
                  'attachPages': 29,
                  'title': '国内逆变业务压舱，海外光储厚积薄发',
                  'researcher': '曾朵红,郭亚男', 'emRatingName': '买入',
              },
          ]
          for row in fallback_rows:
              key = row['infoCode']
              if key not in seen:
                  seen.add(key)
                  rows.append(row)

          def page_count_meta(row: dict[str, Any]) -> int:
              try:
                  return int(float(row.get('attachPages') or 0))
              except Exception:
                  return 0

          def date_text(row: dict[str, Any]) -> str:
              return str(row.get('publishDate') or '')[:10]

          def norm(value: Any) -> str:
              return re.sub(r'\s+', '', str(value or ''))

          preferred = ['首次覆盖', '公司首次覆盖', '公司深度', '深度研究', '集中式光储领军企业', '国内逆变业务压舱', '储能拓扑创新先驱', '深度布局海外市场']
          excluded = ['点评', '季报', '年报', '中报', '半年报', '周报', '日报', '快报', '调研', '纪要']
          candidates: list[dict[str, Any]] = []
          for row in rows:
              code = str(row.get('stockCode') or '')
              name = str(row.get('stockName') or '')
              title = str(row.get('title') or '')
              broker = str(row.get('orgSName') or row.get('orgName') or '')
              info = str(row.get('infoCode') or '')
              pages = page_count_meta(row)
              if code not in ('', CODE) and SHORT not in name:
                  continue
              if not info or not broker or pages < 15:
                  continue
              if any(word in title for word in excluded):
                  continue
              score = pages * 10
              compact = norm(title)
              for phrase in preferred:
                  if norm(phrase) in compact:
                      score += 240
              if '首次' in title:
                  score += 120
              if '深度' in title:
                  score += 100
              if date_text(row) >= '2026-01-01':
                  score += 45
              elif date_text(row) >= '2024-01-01':
                  score += 25
              candidates.append({**row, '_score': score})

          candidates.sort(key=lambda row: (int(row['_score']), page_count_meta(row), date_text(row)), reverse=True)
          print('CANDIDATES')
          for row in candidates:
              print(json.dumps({
                  'infoCode': row.get('infoCode'), 'broker': row.get('orgSName'),
                  'date': date_text(row), 'pages': page_count_meta(row),
                  'title': row.get('title'), 'score': row.get('_score'),
              }, ensure_ascii=False))

          def download_pdf(row: dict[str, Any]) -> tuple[bytes, str, list[dict[str, Any]]]:
              info = str(row.get('infoCode') or '')
              detail = f'https://data.eastmoney.com/report/info/{info}.html'
              attempts: list[dict[str, Any]] = []
              for prefix in ('H3', 'H2', 'H1', 'H4'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': detail,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=(30, 360), allow_redirects=True,
                          )
                          attempts.append({
                              'url': url, 'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          })
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 100_000:
                              return response.content, url, attempts
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed: {row.get("title")}: {attempts[-20:]}')

          def safe_name(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              return re.sub(r'\s+', '', value)[:105]

          broker_alias_map = {
              '国泰海通证券': ['国泰海通证券', '国泰海通'],
              '国泰君安证券': ['国泰君安证券', '国泰君安'],
              '华安证券': ['华安证券', 'HUAAN SECURITIES'],
              '东吴证券': ['东吴证券', '东吴证券研究所'],
          }

          manifest: list[dict[str, Any]] = []
          used_brokers: set[str] = set()
          errors: list[dict[str, Any]] = []
          for row in candidates:
              if len(manifest) >= 3:
                  break
              broker = str(row.get('orgSName') or row.get('orgName') or '')
              if broker in used_brokers:
                  continue
              try:
                  data, source_url, attempts = download_pdf(row)
                  temp = PDF_DIR / f'_temp_{row.get("infoCode")}.pdf'
                  temp.write_bytes(data)
                  reader = PdfReader(str(temp), strict=False)
                  pages = len(reader.pages)
                  if pages < 15:
                      raise RuntimeError(f'Unexpectedly short PDF: {pages} pages')
                  text = ''
                  for page in reader.pages[:min(20, pages)]:
                      try:
                          text += '\n' + (page.extract_text() or '')
                      except Exception:
                          pass
                  compact = norm(text)
                  identity_hits = [value for value in (SHORT, FULL, CODE) if norm(value) in compact]
                  if len(compact) > 500 and not identity_hits:
                      raise RuntimeError('Issuer identity mismatch')
                  aliases = broker_alias_map.get(broker, [broker])
                  broker_hits = [alias for alias in aliases if norm(alias).lower() in compact.lower()]
                  if len(compact) > 500 and not broker_hits:
                      raise RuntimeError(f'Broker identity mismatch; aliases={aliases}')

                  title = str(row.get('title') or '')
                  date = date_text(row)
                  filename = f'{len(manifest)+1:02d}_{safe_name(broker)}_上能电气_{safe_name(title)}_{date}.pdf'
                  destination = PDF_DIR / filename
                  temp.replace(destination)
                  subprocess.run(['qpdf', '--warning-exit-0', '--check', str(destination)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  preview_prefix = PREVIEW_DIR / destination.stem
                  subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  preview = Path(str(preview_prefix) + '.png')
                  if not preview.exists() or preview.stat().st_size < 10_000:
                      raise RuntimeError('First-page render failed')
                  sha = hashlib.sha256(data).hexdigest()
                  manifest.append({
                      'broker': broker,
                      'date': date,
                      'title': title,
                      'analysts': row.get('researcher') or row.get('author'),
                      'rating': row.get('emRatingName') or row.get('sRatingName'),
                      'metadata_pages': page_count_meta(row),
                      'actual_pages': pages,
                      'filename': str(Path('原始PDF') / filename),
                      'bytes': len(data),
                      'sha256': sha,
                      'info_code': row.get('infoCode'),
                      'source_report_page': f'https://data.eastmoney.com/report/info/{row.get("infoCode")}.html',
                      'source_pdf_url': source_url,
                      'identity_hits': identity_hits,
                      'broker_hits': broker_hits,
                      'preview_file': str(Path('首页预览') / preview.name),
                      'selection_score': row.get('_score'),
                      'download_attempts': attempts,
                      'validation': ['PDF header', 'issuer identity', 'broker identity', 'page count', 'qpdf structure', 'first-page render'],
                  })
                  used_brokers.add(broker)
              except Exception as exc:
                  errors.append({
                      'broker': broker, 'title': row.get('title'),
                      'info_code': row.get('infoCode'), 'error': repr(exc),
                  })
                  temp = PDF_DIR / f'_temp_{row.get("infoCode")}.pdf'
                  if temp.exists():
                      temp.unlink()

          if len(manifest) < 2:
              raise RuntimeError('Fewer than two verified reports: ' + json.dumps(errors, ensure_ascii=False))

          total_pages = sum(int(item['actual_pages']) for item in manifest)
          readme = [
              '上能电气股份有限公司（300827.SZ）券商深度研究报告资料包',
              '整理日期：2026-10-28',
              '',
              f'本包收录{len(manifest)}份公开可直接取得并通过完整性核验的券商原始PDF。',
              '筛选口径：优先公司首次覆盖、公司深度和较完整研究报告，并尽量选择不同券商；未使用普通财报点评凑数。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；分析师：{item['analysts']}；评级：{item['rating']}",
                  f"   完整页数：{item['actual_pages']}页；文件：{item['filename']}",
                  f"   来源页面：{item['source_report_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_ranking.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2, default=str), encoding='utf-8')
          (ROOT / 'download_errors.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'request_log.json').write_text(json.dumps(request_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest), encoding='utf-8')

          zip_cn = Path(f'上能电气_300827_券商深度报告_{len(manifest)}份.zip')
          with zipfile.ZipFile(zip_cn, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_cn) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}, manifest={len(manifest)}')
          zip_en = Path('shangneng_300827_broker_deep_reports.zip')
          zip_en.write_bytes(zip_cn.read_bytes())
          print('FINAL_ZIP', zip_cn, zip_cn.stat().st_size, 'SHA256', hashlib.sha256(zip_cn.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          print('ERRORS', json.dumps(errors, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: shangneng-300827-broker-deep-reports-final
          path: |
            上能电气_300827_券商深度报告_*.zip
            shangneng_300827_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
