name: Temporary China Feihe public report discovery

on:
  push:
    branches:
      - tmp-china-feihe-broker-reports-20260905

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public report search and view pages
        run: |
          python -m pip install requests beautifulsoup4
          cat > /tmp/discover_report_pages.py <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'
          })
          out = Path('discovery')
          out.mkdir(exist_ok=True)
          urls = [
              'https://www.fxbaogao.com/rp?keywords=%E4%B8%AD%E5%9B%BD%E9%A3%9E%E9%B9%A4&order=2&nop=-1',
              'https://www.fxbaogao.com/view?id=4846989',
              'https://static.fxbaogao.com/detail_source/js/app-v1.js',
              'https://public.fxbaogao.com/report-image/2025/05/19/4846989-1.png',
              'https://public.fxbaogao.com/report-image/2025/05/19/4846989-2.png',
              'https://public.fxbaogao.com/report-image/2025/05/19/4846989-27.png',
          ]
          records = []
          for idx, url in enumerate(urls, 1):
              try:
                  r = session.get(url, timeout=90, allow_redirects=True)
                  ct = r.headers.get('content-type','')
                  print('\nURL', url)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'CT', ct, 'BYTES', len(r.content))
                  suffix = '.bin'
                  if 'html' in ct: suffix = '.html'
                  elif 'javascript' in ct or url.endswith('.js'): suffix = '.js'
                  elif 'image' in ct: suffix = '.img'
                  (out / f'fetch_{idx}{suffix}').write_bytes(r.content)
                  rec = {'url': url, 'final_url': r.url, 'status': r.status_code, 'content_type': ct, 'size': len(r.content)}
                  if 'html' in ct or 'javascript' in ct or url.endswith('.js'):
                      text = r.text
                      rec['title'] = ''
                      if 'html' in ct:
                          soup = BeautifulSoup(text, 'html.parser')
                          rec['title'] = soup.title.get_text(' ',strip=True) if soup.title else ''
                          print('TITLE', rec['title'])
                          links = []
                          for a in soup.find_all('a', href=True):
                              href = urljoin(r.url, a['href'])
                              label = a.get_text(' ',strip=True)
                              if ('飞鹤' in label or '飞鹤' in href or '/detail/' in href or '/view?' in href):
                                  links.append({'label': label[:160], 'href': href})
                          rec['links'] = links
                          for item in links[:200]: print('LINK', item['label'], item['href'])
                      for line in text.splitlines():
                          if any(k in line for k in ['report-image','/detail/','/view?id','keywords','search-submit']):
                              print('MATCH', line[:1000])
                      rec['report_ids'] = sorted(set(re.findall(r'/detail/(\d+)', text)))
                      rec['image_urls'] = sorted(set(re.findall(r'https?://[^"\'<>\s]+report-image[^"\'<>\s]+', text)))[:500]
                  records.append(rec)
              except Exception as exc:
                  print('ERROR', repr(exc))
                  records.append({'url':url,'error':repr(exc)})
          (out/'records.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python /tmp/discover_report_pages.py

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: feihe-public-report-discovery
          path: discovery
          retention-days: 1
