name: Build complete Haofan Bio report package

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-package-v2-20261020.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='昊帆生物_301393_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE"

          python3 - <<'PY'
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          outdir = Path('昊帆生物_301393_全部年报_招股说明书_最新季报')
          session = requests.Session()
          session.headers.update({
              'User-Agent': UA,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Accept-Encoding': 'gzip, deflate, br',
          })

          records = [
              {
                  'order': 1,
                  'category': '年度报告',
                  'period': '2016年度',
                  'detail_title': '昊帆生物：2016年年度报告（采用2017年5月9日后续披露版本）',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=3389063',
                  'filename': '01_昊帆生物_2016年年度报告_后续披露版.pdf',
                  'min_pages': 10,
              },
              {
                  'order': 2,
                  'category': '年度报告',
                  'period': '2017年度',
                  'detail_title': '昊帆生物：2017年年度报告',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=4215080',
                  'filename': '02_昊帆生物_2017年年度报告.pdf',
                  'min_pages': 20,
              },
              {
                  'order': 3,
                  'category': '年度报告',
                  'period': '2018年度',
                  'detail_title': '昊帆生物：2018年年度报告',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=5157316',
                  'filename': '03_昊帆生物_2018年年度报告.pdf',
                  'min_pages': 20,
              },
              {
                  'order': 4,
                  'category': '招股说明书',
                  'period': '首次公开发行并在创业板上市',
                  'detail_title': '昊帆生物：首次公开发行股票并在创业板上市招股说明书',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=301393&id=9337216',
                  'filename': '04_昊帆生物_首次公开发行股票并在创业板上市招股说明书.pdf',
                  'min_pages': 100,
              },
              {
                  'order': 5,
                  'category': '年度报告',
                  'period': '2023年度',
                  'detail_title': '昊帆生物：2023年年度报告',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=9947191',
                  'filename': '05_昊帆生物_2023年年度报告.pdf',
                  'min_pages': 50,
              },
              {
                  'order': 6,
                  'category': '年度报告',
                  'period': '2024年度',
                  'detail_title': '昊帆生物：2024年年度报告',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=10862097',
                  'filename': '06_昊帆生物_2024年年度报告.pdf',
                  'min_pages': 50,
              },
              {
                  'order': 7,
                  'category': '年度报告',
                  'period': '2025年度',
                  'detail_title': '昊帆生物：2025年年度报告',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=12100428',
                  'filename': '07_昊帆生物_2025年年度报告.pdf',
                  'min_pages': 50,
              },
              {
                  'order': 8,
                  'category': '最新季报',
                  'period': '2026年第一季度',
                  'detail_title': '昊帆生物：2026年一季度报告',
                  'detail_url': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=12156987',
                  'filename': '08_昊帆生物_2026年第一季度报告_最新季报.pdf',
                  'min_pages': 5,
              },
          ]

          anchor_pattern = re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''', re.I | re.S)
          pdf_pattern = re.compile(r'''https?://[^\s"'<>]+?\.pdf(?:\?[^\s"'<>]*)?''', re.I)

          def request_bytes(url, referer=None, expect_pdf=False):
              headers = {
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,text/html;q=0.8,*/*;q=0.7',
                  'Sec-Fetch-Site': 'same-origin',
                  'Sec-Fetch-Mode': 'navigate',
                  'Sec-Fetch-Dest': 'document',
                  'Upgrade-Insecure-Requests': '1',
              }
              if referer:
                  headers['Referer'] = referer
              last = None
              for attempt in range(8):
                  try:
                      r = session.get(url, headers=headers, timeout=300, allow_redirects=True)
                      r.raise_for_status()
                      if expect_pdf and not r.content.startswith(b'%PDF-'):
                          raise RuntimeError(f'Expected PDF but got {r.status_code} {r.headers.get("content-type")} prefix={r.content[:50]!r}')
                      return r.content, r.url, dict(r.headers)
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt)
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          # NEEQ's WAF permits legacy disclosure PDFs after a browser-like session is established.
          for warm_url in ('https://www.neeq.com.cn/', 'https://www.neeq.com.cn/disclosure/'):
              try:
                  session.get(warm_url, timeout=60, allow_redirects=True)
              except Exception:
                  pass

          def decode_page(raw):
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='replace')

          def extract_pdf_url(detail_url):
              raw, final_url, _ = request_bytes(detail_url)
              text = decode_page(raw)
              candidates = []
              for match in anchor_pattern.finditer(text):
                  href = html.unescape(match.group(1).strip())
                  label = re.sub(r'<[^>]+>', '', match.group(2))
                  label = html.unescape(re.sub(r'\s+', '', label))
                  full = unquote(urljoin(final_url, href))
                  if '.pdf' in full.lower() or '下载公告' in label or '公告原文' in label:
                      candidates.append((0 if '下载公告' in label else 1, 0 if '.pdf' in full.lower() else 1, label, full))
              for match in pdf_pattern.finditer(text):
                  full = unquote(html.unescape(match.group(0)))
                  candidates.append((2, 0, '页面内PDF地址', full))
              candidates.sort(key=lambda item: (item[0], item[1], len(item[3])))
              seen = set()
              errors = []
              for _, _, label, url in candidates:
                  if url in seen:
                      continue
                  seen.add(url)
                  try:
                      data, resolved, headers = request_bytes(url, final_url, expect_pdf=True)
                  except Exception as exc:
                      errors.append(f'{url}: {exc}')
                      continue
                  if len(data) > 50000:
                      return resolved, data, label
              raise RuntimeError(f'Could not locate a valid PDF on {detail_url}; candidates/errors={errors[:8]}')

          for record in records:
              resolved, data, link_label = extract_pdf_url(record['detail_url'])
              path = outdir / record['filename']
              path.write_bytes(data)
              record['pdf_url'] = resolved
              record['bytes'] = len(data)
              record['download_link_label'] = link_label
              print(f"Saved {path} ({len(data)} bytes) from {resolved}")

          (outdir / '_download_metadata.json').write_text(
              json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge 5

            pdftotext -f 1 -l 40 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '昊帆生物|昊帆生物科技|苏州昊帆' "$pdf.txt"
            rm -f "$pdf.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$pdf.render" >/dev/null 2>&1
            test -s "$pdf.render.png"
            rm -f "$pdf.render.png"
            echo "Validated: $(basename "$pdf") ($pages pages, $(stat -c%s "$pdf") bytes)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          folder = Path('昊帆生物_301393_全部年报_招股说明书_最新季报')
          metadata = json.loads((folder / '_download_metadata.json').read_text(encoding='utf-8'))
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 8:
              raise SystemExit(f'Expected 8 PDFs, found {len(pdfs)}')

          by_name = {item['filename']: item for item in metadata}
          lines = [
              '苏州昊帆生物股份有限公司（昊帆生物，301393）',
              '全部公开年度报告、正式招股说明书及最新季报',
              '整理日期：2026-10-20',
              '',
              '收录说明：',
              '1. 收录公司在新三板挂牌期间公开披露的2016—2018年度报告，以及创业板上市后公开披露的2023—2025年度报告，共6份。',
              '2. 2016年年度报告存在两次同名披露，本包采用2017年5月9日披露的后续版本。',
              '3. 公司于2019年7月10日在全国股转系统终止挂牌，至2023年7月12日在创业板上市；2019—2022年度没有以公众公司身份单独披露的年度报告，相关经审计历史财务信息已纳入正式招股说明书。',
              '4. 招股说明书采用正式发行版《首次公开发行股票并在创业板上市招股说明书》，未用招股意向书或申报稿替代。',
              '5. 截至2026年10月20日，正式三季报目录尚未列出2026年第三季度报告，故最新已披露季报为2026年第一季度报告。',
              '6. 2026年半年度报告不属于季度报告，未用其替代“最新季报”。',
              '7. 文件均为公开披露的原始PDF，仅供研究参考。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = by_name[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              if pages < int(item['min_pages']):
                  raise SystemExit(f"{pdf.name}: expected at least {item['min_pages']} pages, found {pages}")
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  类型：{item['category']}；报告期：{item['period']}；页数：{pages}；大小：{len(data)}字节",
                  f"  标题：{item['detail_title']}",
                  f"  PDF来源：{item['pdf_url']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、页数、正文公司名称及首页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_download_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Haofan-Bio-301393-all-annual-prospectus-latest-quarter-complete
          path: 昊帆生物_301393_全部年报_招股说明书_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
