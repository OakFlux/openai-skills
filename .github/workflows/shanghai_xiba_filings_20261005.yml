name: Shanghai Xiba Annual Reports and Latest Quarter

on:
  push:
    branches:
      - chatgpt-shanghai-xiba-filings-20261005
    paths:
      - scripts/build_shanghai_xiba_filings_20261005.py
      - .github/workflows/shanghai_xiba_filings_20261005.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_shanghai_xiba_filings_20261005.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-xiba-filings-package
          path: |
            output/shanghai_xiba_2020_2025_annual_reports_and_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
