name: Build Nanshan Aluminium International public broker research package 20260919

on:
  push:
    paths:
      - '.github/workflows/nanshan-aluminium-international-broker-reports-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install browser and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet playwright pypdf beautifulsoup4 lxml requests
          python -m playwright install --with-deps chromium

      - name: Render public research pages, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import asyncio
          import hashlib
          import json
          import re
          import subprocess
          import zipfile
          from datetime import date
          from pathlib import Path
          from urllib.parse import urljoin

          from playwright.async_api import async_playwright
          from pypdf import PdfReader

          PACKAGE = '南山铝业国际_02610_券商深度报告_公开资料版_3份'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_华创证券_南山铝业国际_东南亚氧化铝龙头_电解铝筑第二成长曲线_公开资料版_2026-06-25.pdf',
                  'broker': '华创证券',
                  'title': '南山铝业国际（02610.HK）深度研究报告：东南亚氧化铝龙头，电解铝筑第二成长曲线',
                  'report_date': '2026-06-25',
                  'original_pages': 25,
                  'analysts': '刘岗、李梦娇',
                  'rating': '推荐（首次）',
                  'source_url': 'https://www.360why.com/enterprise/260706000010654.html',
                  'reference_url': 'https://www.360why.com/bg/b16bfd000109088.html',
                  'source_name': '周知报告公开研报解读页',
              },
              {
                  'filename': '02_申万宏源_南山铝业国际_东南亚领先氧化铝制造商_电解铝项目打开成长空间_公开资料版_2026-06-29.pdf',
                  'broker': '申万宏源',
                  'title': '南山铝业国际（02610.HK）：东南亚领先氧化铝制造商，电解铝项目打开成长空间',
                  'report_date': '2026-06-29',
                  'original_pages': 23,
                  'analysts': '公开页面未完整列示',
                  'rating': '增持（首次）',
                  'source_url': 'https://www.360why.com/enterprise/260702000010607.html',
                  'reference_url': 'https://www.360why.com/bg/fbbc26000109602.html',
                  'source_name': '周知报告公开研报解读页',
              },
              {
                  'filename': '03_华泰证券_南山铝业国际_兼具稳定现金流与高成长性_公开资料版_2026-02-10.pdf',
                  'broker': '华泰证券',
                  'title': '南山铝业国际（02610.HK）：兼具稳定现金流与高成长性',
                  'report_date': '2026-02-10',
                  'original_pages': 22,
                  'analysts': '公开页面未完整列示',
                  'rating': '买入（首次覆盖）',
                  'source_url': 'https://www.baogaobox.com/insights/260211000025523.html',
                  'reference_url': 'https://www.baogaobox.com/reports/260211000093899.html',
                  'source_name': '远瞻慧库公开研报解读页',
              },
          ]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          async def wait_images(page):
              await page.evaluate("""
                  async () => {
                    const imgs = Array.from(document.images);
                    await Promise.all(imgs.map(img => {
                      if (img.complete) return Promise.resolve();
                      return new Promise(resolve => {
                        img.addEventListener('load', resolve, {once:true});
                        img.addEventListener('error', resolve, {once:true});
                        setTimeout(resolve, 8000);
                      });
                    }));
                  }
              """)

          async def render_doc(browser, doc):
              context = await browser.new_context(
                  viewport={'width': 1440, 'height': 1200},
                  locale='zh-CN',
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36',
              )
              page = await context.new_page()
              await page.goto(doc['source_url'], wait_until='domcontentloaded', timeout=120000)
              try:
                  await page.wait_for_load_state('networkidle', timeout=30000)
              except Exception:
                  pass
              # Trigger lazy loading.
              await page.evaluate("""
                  async () => {
                    const step = 900;
                    for (let y = 0; y < document.body.scrollHeight; y += step) {
                      window.scrollTo(0, y);
                      await new Promise(r => setTimeout(r, 120));
                    }
                    window.scrollTo(0, 0);
                  }
              """)
              await wait_images(page)

              article = await page.evaluate("""
                  () => {
                    const abs = (u) => {
                      try { return new URL(u, location.href).href; } catch { return u || ''; }
                    };
                    const scoreNode = (el) => {
                      const text = (el.innerText || '').trim();
                      const p = el.querySelectorAll('p').length;
                      const h = el.querySelectorAll('h1,h2,h3,h4').length;
                      const img = el.querySelectorAll('img').length;
                      const links = el.querySelectorAll('a').length;
                      return text.length + p * 80 + h * 180 + img * 220 - links * 8;
                    };
                    const h1 = document.querySelector('h1');
                    const candidates = [];
                    const preferred = [
                      'article', 'main', '.article-content', '.article_detail', '.article-detail',
                      '.detail-content', '.detail_content', '.content-detail', '.content_detail',
                      '.news-content', '.insight-content', '.post-content', '.entry-content',
                      '.article', '.detail', '.content'
                    ];
                    preferred.forEach(sel => document.querySelectorAll(sel).forEach(el => candidates.push(el)));
                    if (h1) {
                      let el = h1;
                      while (el && el !== document.body) {
                        const len = (el.innerText || '').trim().length;
                        if (len > 2500) candidates.push(el);
                        el = el.parentElement;
                      }
                    }
                    candidates.push(document.body);
                    const unique = Array.from(new Set(candidates)).filter(Boolean);
                    const viable = unique.filter(el => (el.innerText || '').includes('南山铝业国际') && (el.innerText || '').trim().length > 2500);
                    viable.sort((a,b) => scoreNode(b) - scoreNode(a));
                    const chosen = viable[0] || document.body;
                    const clone = chosen.cloneNode(true);

                    clone.querySelectorAll('script,style,noscript,iframe,video,audio,canvas,form,button,input,textarea,select,nav,header,footer,aside').forEach(x => x.remove());
                    clone.querySelectorAll('[style]').forEach(x => {
                      const s = x.getAttribute('style') || '';
                      if (/position\s*:\s*(fixed|sticky)/i.test(s)) x.remove();
                    });
                    clone.querySelectorAll('img').forEach(img => {
                      const src = img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-original') || img.getAttribute('data-lazy-src') || '';
                      img.setAttribute('src', abs(src));
                      img.removeAttribute('srcset');
                      img.removeAttribute('loading');
                      img.style.maxWidth = '100%';
                      img.style.height = 'auto';
                      img.style.pageBreakInside = 'avoid';
                    });
                    clone.querySelectorAll('a').forEach(a => {
                      a.setAttribute('href', abs(a.getAttribute('href') || ''));
                      a.style.color = 'inherit';
                      a.style.textDecoration = 'none';
                    });

                    const stopWords = ['相关报告', '相关文章', '热门标签', '热门报告', '热门洞察', '版权说明', '版权声明', '问题反馈', '分享到', '搜索报告'];
                    const nodes = Array.from(clone.querySelectorAll('h2,h3,h4,div,p'));
                    for (const n of nodes) {
                      const t = (n.innerText || '').trim().replace(/\s+/g, ' ');
                      if (stopWords.some(w => t === w || t.startsWith(w + ' '))) {
                        let cur = n;
                        while (cur) {
                          const next = cur.nextSibling;
                          cur.remove();
                          cur = next;
                        }
                        break;
                      }
                    }
                    return {html: clone.innerHTML, sourceTitle: document.title};
                  }
              """)

              cover = f"""
                <section class='cover'>
                  <div class='kicker'>券商深度报告公开资料整理版</div>
                  <h1>{doc['title']}</h1>
                  <div class='meta'>
                    <p><b>研究机构：</b>{doc['broker']}</p>
                    <p><b>报告日期：</b>{doc['report_date']}</p>
                    <p><b>原报告页数：</b>{doc['original_pages']}页</p>
                    <p><b>研究员：</b>{doc['analysts']}</p>
                    <p><b>评级：</b>{doc['rating']}</p>
                  </div>
                  <div class='notice'>本文件依据可公开访问的研报解读或预览页面排版生成，用于资料检索与学习。它不是券商原始PDF，也未绕过登录、付费或下载权限。</div>
                  <div class='source'>公开内容来源：{doc['source_name']}<br>{doc['source_url']}<br><br>原报告索引页：<br>{doc['reference_url']}</div>
                </section>
              """
              standalone = f"""<!doctype html>
              <html lang='zh-CN'><head><meta charset='utf-8'><base href='{doc['source_url']}'>
              <style>
                @page {{ size: A4; margin: 16mm 15mm 18mm; }}
                * {{ box-sizing: border-box; }}
                body {{ font-family: 'Noto Sans CJK SC','Noto Serif CJK SC','Microsoft YaHei',sans-serif; color:#111; line-height:1.72; font-size:10.5pt; margin:0 auto; max-width:178mm; }}
                .cover {{ min-height:250mm; padding:24mm 10mm 10mm; page-break-after:always; display:flex; flex-direction:column; justify-content:flex-start; }}
                .cover .kicker {{ font-size:11pt; letter-spacing:.08em; margin-bottom:20mm; }}
                .cover h1 {{ font-size:24pt; line-height:1.35; margin:0 0 18mm; font-weight:700; }}
                .cover .meta {{ border-top:1px solid #777; border-bottom:1px solid #777; padding:6mm 0; margin-bottom:12mm; }}
                .cover .meta p {{ margin:2mm 0; }}
                .cover .notice {{ font-size:9.5pt; line-height:1.65; padding:5mm; border:1px solid #aaa; margin-bottom:12mm; }}
                .cover .source {{ font-size:8.5pt; line-height:1.55; overflow-wrap:anywhere; margin-top:auto; }}
                article {{ width:100%; }}
                h1 {{ font-size:20pt; line-height:1.35; margin:0 0 8mm; }}
                h2 {{ font-size:16pt; line-height:1.45; margin:9mm 0 4mm; page-break-after:avoid; }}
                h3 {{ font-size:13pt; line-height:1.45; margin:7mm 0 3mm; page-break-after:avoid; }}
                h4 {{ font-size:11.5pt; line-height:1.45; margin:6mm 0 2mm; page-break-after:avoid; }}
                p {{ margin:0 0 3.5mm; text-align:justify; orphans:3; widows:3; }}
                img {{ display:block; max-width:100% !important; height:auto !important; margin:5mm auto; page-break-inside:avoid; }}
                table {{ width:100%; border-collapse:collapse; margin:5mm 0; font-size:9pt; page-break-inside:avoid; }}
                th,td {{ border:1px solid #999; padding:2mm; vertical-align:top; }}
                ul,ol {{ padding-left:7mm; }}
                li {{ margin-bottom:2mm; }}
                .ad,.ads,.advertisement,.share,.sidebar,.qrcode,.qr-code,.fixed,.sticky,.breadcrumb,.breadcrumbs {{ display:none !important; }}
              </style></head>
              <body>{cover}<article>{article['html']}</article></body></html>"""

              clean = await context.new_page()
              await clean.set_content(standalone, wait_until='domcontentloaded', timeout=120000)
              try:
                  await clean.wait_for_load_state('networkidle', timeout=30000)
              except Exception:
                  pass
              await wait_images(clean)
              dest = out / doc['filename']
              await clean.pdf(
                  path=str(dest), format='A4', print_background=True,
                  display_header_footer=True,
                  header_template='<div></div>',
                  footer_template="<div style='font-size:8px;width:100%;text-align:center;color:#666'><span class='pageNumber'></span> / <span class='totalPages'></span></div>",
                  margin={'top':'16mm','right':'15mm','bottom':'18mm','left':'15mm'},
              )
              await context.close()
              return dest, article['sourceTitle']

          async def main():
              records = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--disable-dev-shm-usage','--no-sandbox'])
                  for doc in docs:
                      dest, source_title = await render_doc(browser, doc)
                      reader = PdfReader(str(dest), strict=False)
                      pages = len(reader.pages)
                      if pages < 4:
                          raise RuntimeError(f'PDF too short for {dest.name}: {pages} pages')
                      sample = ''
                      for page in reader.pages[:min(8, pages)]:
                          try:
                              sample += '\n' + (page.extract_text() or '')
                          except Exception:
                              pass
                      if '南山铝业国际' not in sample or doc['broker'] not in sample:
                          raise RuntimeError(f'identity validation failed for {dest.name}')
                      check = subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
                      if check.returncode not in (0,3):
                          raise RuntimeError(f'qpdf failed for {dest.name}: {check.stderr[-1200:]}')
                      preview = out / (dest.stem + '_首页预览.png')
                      subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(dest),str(preview.with_suffix(''))],check=True)
                      rec = {
                          'filename': doc['filename'],
                          'broker': doc['broker'],
                          'title': doc['title'],
                          'report_date': doc['report_date'],
                          'original_report_pages': doc['original_pages'],
                          'compiled_pdf_pages': pages,
                          'source_name': doc['source_name'],
                          'source_url': doc['source_url'],
                          'reference_url': doc['reference_url'],
                          'source_page_title': source_title,
                          'bytes': dest.stat().st_size,
                          'sha256': sha256(dest),
                          'format_note': '公开研报解读/预览页面排版版，非券商原始PDF',
                      }
                      records.append(rec)
                      print('VALIDATED', json.dumps(rec, ensure_ascii=False), flush=True)
                  await browser.close()

              readme = [
                  '南山铝业国际控股有限公司（02610.HK）券商深度报告公开资料包',
                  f'整理日期：{date.today().isoformat()}',
                  '',
                  '收录3份与南山铝业国际直接相关的券商深度研究：华创证券、申万宏源、华泰证券。',
                  '重要说明：相关平台对券商原始PDF设置登录、会员或下载权限。本包没有绕过访问控制，收录的是公开可访问研报解读或预览页面的清洁排版PDF，文件封面明确标注“公开资料版”。',
                  '',
                  '文件清单：',
              ]
              for i, r in enumerate(records, 1):
                  readme.extend([
                      f"{i}. {r['broker']}：{r['title']}",
                      f"   报告日期：{r['report_date']}；原报告标示页数：{r['original_report_pages']}页；本包PDF：{r['compiled_pdf_pages']}页",
                      f"   文件：{r['filename']}",
                      f"   公开内容来源：{r['source_url']}",
                      f"   原报告索引：{r['reference_url']}",
                      f"   SHA-256：{r['sha256']}",
                      '',
                  ])
              readme.extend([
                  '核验项目：公司与券商身份、PDF页数、PDF结构、首页渲染、ZIP CRC和SHA-256。',
                  '首页预览PNG仅用于快速核对文件身份；如不需要可自行删除。',
              ])
              (out / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
              (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
              (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

              zip_path = Path(PACKAGE + '.zip')
              with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
                  for path in sorted(out.iterdir()):
                      zf.write(path, arcname=f'{PACKAGE}/{path.name}')
              with zipfile.ZipFile(zip_path) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError('ZIP CRC failure: ' + bad)
                  pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if len(pdfs) != 3:
                      raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
              print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', sha256(zip_path), flush=True)

          asyncio.run(main())
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: nanshan-aluminium-international-broker-reports-final
          path: 南山铝业国际_02610_券商深度报告_公开资料版_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
