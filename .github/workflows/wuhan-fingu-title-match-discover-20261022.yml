name: Match Wuhan Fingu report titles 20261022

on:
  push:
    paths:
      - '.github/workflows/wuhan-fingu-title-match-discover-20261022.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests
      - name: Search exact report title phrases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[('2019-10-23','2019-10-29'),('2020-08-08','2020-08-12'),('2020-11-01','2020-11-05')]
          phrases=['专注基站射频三十年','5G滤波器再塑发展新天地','Q3业绩增长提速','克服疫情影响','三季度盈利能力改善','新周期开启','营收结构和盈利能力同步改善']
          found=[]
          for begin,end in windows:
            for qtype in ['0','1','2']:
              total=1
              for page in range(1,80):
                if page>total:break
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                payload=None
                for attempt in range(4):
                  try:
                    r=s.get(api,params=p,timeout=(15,90))
                    if r.status_code==200:payload=r.json();break
                  except Exception as e:print('ERR',repr(e))
                  time.sleep(1+attempt)
                if payload is None:break
                total=min(int(payload.get('TotalPage') or 1),79)
                data=payload.get('data') or []
                if isinstance(data,dict):data=data.get('list') or data.get('data') or []
                for row in data:
                  title=str(row.get('title') or '')
                  if any(p in title for p in phrases):
                    item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']}
                    item['qType']=qtype
                    found.append(item);print('MATCH',json.dumps(item,ensure_ascii=False))
                if page>=total or len(data)<100:break
          print('ALL',json.dumps(found,ensure_ascii=False,indent=2))
          PY
