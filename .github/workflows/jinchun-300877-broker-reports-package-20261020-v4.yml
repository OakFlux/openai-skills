name: Package Jinchun 300877 broker research reports 20261020

on:
  push:
    branches:
      - tmp/jinchun-300877-broker-reports-package-20261020-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF and CJK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          CODE = "300877"
          SHORT = "金春股份"
          FULL = "安徽金春无纺布股份有限公司"
          PREPARED = "2026-10-20"
          PACKAGE = "金春股份_300877_券商深度研究报告_2份"
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)
          VERIFY = ROOT / "渲染核验"
          VERIFY.mkdir(exist_ok=True)

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36"
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": UA,
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          reports = [
              {
                  "index": 1,
                  "source_url": "https://www.9fzt.com/detail/sz_300877_10_659779551713.html",
                  "fallback_title": "金春股份：非织造优质新秀，产能优势凸显，拓展热风超纤扩大竞争优势",
                  "fallback_broker": "天风证券股份有限公司",
                  "fallback_date": "2020-11-27",
                  "authors": "公开网页未标注",
                  "original_report_pages": 18,
                  "filename": "01_20201127_天风证券_非织造优质新秀_公开网页全文整理版_非券商原始PDF.pdf",
              },
              {
                  "index": 2,
                  "source_url": "https://www.9fzt.com/detail/sz_300877_10_666205438566.html",
                  "fallback_title": "金春股份：水刺无纺布龙头，优势显著需求旺盛",
                  "fallback_broker": "中信证券股份有限公司",
                  "fallback_date": "2021-02-09",
                  "authors": "公开网页未标注",
                  "original_report_pages": 25,
                  "filename": "02_20210209_中信证券_水刺无纺布龙头_公开网页全文整理版_非券商原始PDF.pdf",
              },
          ]

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def fetch_html(url: str) -> requests.Response:
              last: Any = None
              for attempt in range(8):
                  try:
                      response = session.get(url, timeout=(25, 180), allow_redirects=True)
                      last = {
                          "status": response.status_code,
                          "bytes": len(response.content),
                          "content_type": response.headers.get("content-type", ""),
                          "final_url": response.url,
                      }
                      if response.status_code == 200 and len(response.content) > 10_000:
                          return response
                  except Exception as exc:
                      last = {"error": repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f"Failed to fetch {url}: {last}")

          def extract_report(spec: dict[str, Any]) -> dict[str, Any]:
              response = fetch_html(spec["source_url"])
              response.encoding = response.apparent_encoding or response.encoding or "utf-8"
              soup = BeautifulSoup(response.text, "lxml")

              title_node = soup.select_one(".title-header") or soup.select_one("h1")
              body_node = soup.select_one(".detail-article-content") or soup.select_one(".blk_container")
              broker_node = soup.select_one(".date-type")
              date_node = soup.select_one(".date-time")

              if title_node is None or body_node is None:
                  raise RuntimeError(f"Page structure changed for {spec['source_url']}")

              title = re.sub(r"\s+", " ", title_node.get_text(" ", strip=True)) or spec["fallback_title"]
              broker = re.sub(r"\s+", " ", broker_node.get_text(" ", strip=True)) if broker_node else spec["fallback_broker"]
              report_date = re.sub(r"\s+", " ", date_node.get_text(" ", strip=True)) if date_node else spec["fallback_date"]

              for tag in body_node.find_all(["script", "style", "iframe", "form", "button", "noscript"]):
                  tag.decompose()
              for tag in body_node.find_all(True):
                  for attr in ["style", "class", "id", "onclick", "data-v", "width", "height"]:
                      tag.attrs.pop(attr, None)

              body_text = re.sub(r"\s+", " ", body_node.get_text(" ", strip=True))
              if SHORT not in (title + " " + body_text) or len(body_text) < 900:
                  raise RuntimeError(
                      f"Insufficient report text for {spec['source_url']}: chars={len(body_text)}"
                  )

              body_html = str(body_node)
              source_hash = hashlib.sha256(response.content).hexdigest()
              source_snapshot = ROOT / f"来源快照_{spec['index']:02d}.html"
              source_snapshot.write_text(response.text, encoding="utf-8")

              doc = f"""<!doctype html>
              <html lang="zh-CN">
              <head>
                <meta charset="utf-8">
                <title>{html.escape(title)}</title>
                <style>
                  @page {{
                    size: A4;
                    margin: 17mm 17mm 19mm 17mm;
                    @bottom-center {{
                      content: "公开网页全文整理版 - 第 " counter(page) " 页 / " counter(pages) " 页";
                      font-size: 8.5pt;
                      color: #666;
                    }}
                  }}
                  body {{
                    font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif;
                    font-size: 10.4pt;
                    line-height: 1.72;
                    color: #222;
                    word-break: break-word;
                  }}
                  h1 {{
                    font-size: 19pt;
                    line-height: 1.38;
                    margin: 0 0 12pt 0;
                    font-weight: 700;
                  }}
                  .meta {{
                    font-size: 10pt;
                    line-height: 1.65;
                    color: #444;
                    border-bottom: 1px solid #aaa;
                    padding-bottom: 9pt;
                    margin-bottom: 13pt;
                  }}
                  .notice {{
                    border: 1.5px solid #8c3131;
                    background: #fff8f4;
                    padding: 10pt 12pt;
                    margin: 8pt 0 16pt 0;
                    font-size: 9.7pt;
                    line-height: 1.6;
                  }}
                  .notice strong {{ color: #781f1f; }}
                  .source {{
                    font-size: 8.3pt;
                    color: #666;
                    margin-top: 7pt;
                    word-break: break-all;
                  }}
                  .detail-article-content p, .blk_container p {{
                    margin: 0 0 9pt 0;
                    text-align: justify;
                  }}
                  p {{ margin: 0 0 9pt 0; text-align: justify; }}
                  br {{ line-height: 1.3; }}
                  a {{ color: #222; text-decoration: none; }}
                </style>
              </head>
              <body>
                <h1>{html.escape(title)}</h1>
                <div class="meta">
                  券商：{html.escape(broker)}<br>
                  发布日期：{html.escape(report_date)}<br>
                  对应原始报告公开信息页数：{spec['original_report_pages']}页
                </div>
                <div class="notice">
                  <strong>文件性质说明：</strong>本文件依据公开网页所展示的券商研究报告正文整理并打印为PDF，
                  <strong>不是券商发布的原始PDF</strong>。原始报告中的封面、图表、排版、页码、研究员签名及部分附录可能未被公开网页保留。
                  文件名、首页、清单和manifest均已明确标注文件性质；报告著作权归原券商及作者所有。
                  <div class="source">公开正文来源：{html.escape(spec['source_url'])}</div>
                </div>
                {body_html}
              </body>
              </html>"""

              pdf_path = ROOT / spec["filename"]
              HTML(string=doc, base_url=spec["source_url"]).write_pdf(str(pdf_path))

              if pdf_path.read_bytes()[:5] != b"%PDF-":
                  raise RuntimeError(f"Invalid PDF header: {pdf_path.name}")
              reader = PdfReader(str(pdf_path), strict=False)
              pages = len(reader.pages)
              if pages < 2:
                  raise RuntimeError(f"Unexpectedly short PDF: {pdf_path.name}, pages={pages}")

              extracted = ""
              for page in reader.pages:
                  try:
                      extracted += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              required = [SHORT, broker[:2], report_date[:4], "非券商发布的原始PDF"]
              missing = [token for token in required if token not in extracted]
              if missing:
                  raise RuntimeError(f"PDF text validation failed {pdf_path.name}: missing={missing}")

              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(pdf_path)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )

              render_prefix = VERIFY / pdf_path.stem
              subprocess.run(
                  [
                      "pdftoppm", "-png", "-r", "150", str(pdf_path), str(render_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              rendered = sorted(VERIFY.glob(pdf_path.stem + "-*.png"))
              if len(rendered) != pages:
                  raise RuntimeError(
                      f"Rendered page count mismatch for {pdf_path.name}: {len(rendered)} != {pages}"
                  )
              if any(path.stat().st_size < 5_000 for path in rendered):
                  raise RuntimeError(f"A rendered page is unexpectedly small: {pdf_path.name}")

              first_preview = PREVIEW / (pdf_path.stem + ".png")
              first_preview.write_bytes(rendered[0].read_bytes())

              return {
                  "filename": pdf_path.name,
                  "document_form": "公开网页全文整理版（非券商原始PDF）",
                  "broker": broker,
                  "authors": spec["authors"],
                  "date": report_date,
                  "title": title,
                  "source_url": spec["source_url"],
                  "source_final_url": response.url,
                  "source_html_bytes": len(response.content),
                  "source_html_sha256": source_hash,
                  "source_snapshot": source_snapshot.name,
                  "original_report_pages_public_metadata": spec["original_report_pages"],
                  "offline_pdf_pages": pages,
                  "bytes": pdf_path.stat().st_size,
                  "sha256": sha256_file(pdf_path),
                  "preview_file": str(Path("首页预览") / first_preview.name),
                  "note": "公开网页正文离线排版版；不是券商原始PDF，可能不含原报告图表、封面和版式。",
              }

          manifest: list[dict[str, Any]] = []
          for spec in reports:
              manifest.append(extract_report(spec))

          readme = [
              f"金春股份（{CODE}.SZ）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录2份首次覆盖/公司深度研究资料。公开渠道未提供可直接下载的券商原始PDF，",
              "因此包内PDF由公开网页展示的报告正文制作成离线阅读版。为避免误认，文件名、PDF首页、",
              "清单、CSV和JSON均明确标注“非券商原始PDF”。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   原始报告公开信息页数：{item['original_report_pages_public_metadata']}页；离线整理版：{item['offline_pdf_pages']}页",
                  f"   来源页面：{item['source_url']}",
                  f"   PDF SHA-256：{item['sha256']}",
                  f"   说明：{item['note']}",
                  "",
              ]
          readme += [
              "核验项目：网页正文长度、PDF文件头、文本内容、qpdf结构、全页渲染、首页预览、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  "文件名", "文件性质", "券商", "发布日期", "标题", "原始报告公开页数",
                  "离线整理版页数", "字节数", "SHA-256", "来源页面", "说明",
              ])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["document_form"], item["broker"], item["date"],
                      item["title"], item["original_report_pages_public_metadata"],
                      item["offline_pdf_pages"], item["bytes"], item["sha256"],
                      item["source_url"], item["note"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path(PACKAGE + ".zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": sha256_file(zip_path),
              "report_count": len(manifest),
              "files": [
                  {
                      "name": item["filename"],
                      "broker": item["broker"],
                      "date": item["date"],
                      "title": item["title"],
                      "offline_pages": item["offline_pdf_pages"],
                      "original_public_pages": item["original_report_pages_public_metadata"],
                      "bytes": item["bytes"],
                      "sha256": item["sha256"],
                  }
                  for item in manifest
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: jinchun-300877-broker-research-reports-20261020-v4
          path: 金春股份_300877_券商深度研究报告_2份.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
