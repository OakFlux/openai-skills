name: Build curated Wuhan Fingu deep research package 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_final_curated_20261022.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pymupdf pypdf

      - name: Download validate and package two substantive reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests, pymupdf
          from pypdf import PdfReader

          PACKAGE='武汉凡谷_002194_深度研究报告_2份'
          ROOT=Path(PACKAGE)
          PDFDIR=ROOT/'原始PDF'
          PREVDIR=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREVDIR):d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'info_code':'AP201908201344656651',
              'institution':'国信证券',
              'date':'2019-08-20',
              'title':'5G核心器件基站滤波器行业专题：爆发前夜，关注主设备商的核心供应商机会',
              'analysts':'程成',
              'classification':'券商行业深度报告；设有武汉凡谷独立重点推荐与公司分析章节',
              'expected_pages':51,
            },
            {
              'info_code':'AP202009211415445984',
              'institution':'头豹研究院',
              'date':'2020-09-21',
              'title':'通信系列深度研究：2019年中国基站滤波器天线行业市场研究',
              'analysts':'公开元数据未列示',
              'classification':'第三方行业深度研究补充；正文多页分析武汉凡谷（非券商报告）',
              'expected_pages':32,
            },
          ]
          aliases=['武汉凡谷','武汉凡谷电子技术股份有限公司','002194','武漢凡谷']
          s=requests.Session();s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def safe(text:str)->str:
              return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+',' ',text).strip())[:115]

          manifest=[]
          for idx,item in enumerate(reports,1):
              info=item['info_code']
              detail=f'https://data.eastmoney.com/report/info/{info}.html'
              data=None;pdf_url='';attempts=[]
              for prefix in ['H3','H2','H1','H4']:
                  url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  try:
                      r=s.get(url,headers={'User-Agent':ua,'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'},timeout=(20,240),allow_redirects=True)
                      attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')})
                      if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:
                          data=r.content;pdf_url=url;break
                  except Exception as exc:
                      attempts.append({'url':url,'error':repr(exc)})
              if not data:raise RuntimeError(f'Download failed for {info}: {attempts}')

              filename=f"{idx:02d}_{safe(item['institution'])}_武汉凡谷深度研究_{safe(item['title'])}_{item['date']}.pdf"
              dest=PDFDIR/filename;dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False);pages=len(reader.pages)
              if pages!=item['expected_pages']:
                  raise RuntimeError(f'Page mismatch {filename}: {pages} != {item["expected_pages"]}')

              doc=pymupdf.open(str(dest));hit_pages=[];occurrences=0;snippets=[]
              for pno in range(doc.page_count):
                  text=doc.load_page(pno).get_text('text') or ''
                  compact=re.sub(r'\s+','',text);hits={}
                  for alias in aliases:
                      n=compact.count(re.sub(r'\s+','',alias))
                      if n:
                          hits[alias]=n;occurrences+=n
                          if len(snippets)<24:
                              pos=text.find(alias)
                              if pos>=0:
                                  snippets.append({'page':pno+1,'alias':alias,'text':' '.join(text[max(0,pos-180):pos+len(alias)+420].split())})
                  if hits:hit_pages.append({'page':pno+1,'hits':hits})
              pix=doc.load_page(0).get_pixmap(matrix=pymupdf.Matrix(1.5,1.5),alpha=False)
              preview=PREVDIR/(dest.stem+'.png');pix.save(str(preview));doc.close()
              if not preview.exists() or preview.stat().st_size<8000:raise RuntimeError('Preview failed '+filename)

              if idx==1 and (len(hit_pages)<10 or occurrences<20):
                  raise RuntimeError(f'Insufficient company coverage in broker report: hit_pages={len(hit_pages)} occurrences={occurrences}')
              if idx==2 and (len(hit_pages)<3 or occurrences<5):
                  raise RuntimeError(f'Insufficient company coverage in supplemental report: hit_pages={len(hit_pages)} occurrences={occurrences}')

              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  **item,
                  'filename':str(Path('原始PDF')/filename),
                  'pages':pages,
                  'size_bytes':len(data),
                  'sha256':sha,
                  'company_hit_pages':hit_pages,
                  'company_occurrences':occurrences,
                  'company_snippets':snippets,
                  'source_report_page':detail,
                  'pdf_url':pdf_url,
                  'preview_file':str(Path('首页预览')/preview.name),
                  'download_attempts':attempts,
                  'validation':['PDF header','exact page count','PyMuPDF full-text company scan','first-page render'],
              })

          lines=[
              '武汉凡谷（002194.SZ）深度研究资料包',
              '整理日期：2026-10-22','',
              '本包收录2份公开可直接取得的原始完整PDF。',
              '其中第1份为国信证券券商行业深度报告，含武汉凡谷独立重点推荐及多页公司分析；第2份为头豹研究院行业深度研究补充，不属于券商报告。',
              '公开渠道中海通证券21页首次覆盖报告可查到题名与摘要，但完整PDF需要登录/会员权限，故未将网页摘要冒充原始PDF收录。',''
          ]
          for i,x in enumerate(manifest,1):
              pages='、'.join(str(v['page']) for v in x['company_hit_pages'])
              lines += [
                  f"{i}. {x['institution']}：《{x['title']}》",
                  f"   类型：{x['classification']}",
                  f"   日期：{x['date']}；分析师：{x['analysts']}；完整页数：{x['pages']}页",
                  f"   武汉凡谷/002194全文命中：{x['company_occurrences']}次；命中页：{pages}",
                  f"   文件：{x['filename']}",
                  f"   来源页面：{x['source_report_page']}",
                  f"   SHA-256：{x['sha256']}",'',
              ]
          lines += [
              '报告内容及版权归原机构与作者所有，仅供研究参考，不构成投资建议。',
              '已核验PDF文件头、实际页数、全文公司名称/证券代码命中、首页渲染、ZIP CRC及SHA-256。'
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          english=Path('wuhan_fingu_002194_deep_research_reports.zip')
          chinese=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(english,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(english) as z:
              bad=z.testzip();pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=2:raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}')
          chinese.write_bytes(english.read_bytes())
          print('FINAL_ZIP',english,english.stat().st_size,'SHA256',hashlib.sha256(english.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-curated-deep-research-final
          path: |
            wuhan_fingu_002194_deep_research_reports.zip
            武汉凡谷_002194_深度研究报告_2份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
