name: Build Xiangyang Bearing peer deep reports 20261005

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xiangyang-bearing-peer-deep-reports-20261005.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          TODAY = '2026-10-05'
          TARGET = '襄阳轴承（000678.SZ）'
          WORK = Path('xiangyang_bearing_peer_reports_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL_ROOT = WORK / 'final'
          ART = Path('artifact_out')
          for d in (DOWNLOADS, FINAL_ROOT, ART):
              d.mkdir(parents=True, exist_ok=True)

          peers = [
              {
                  'code': '002708', 'name': '光洋股份',
                  'reason': '汽车精密轴承与轮毂轴承同业，兼具机器人增量逻辑',
                  'preferred': ['聚焦汽车精密轴承', '汽车轴承小巨人', '轴承龙头', '公司深度', '首次覆盖'],
              },
              {
                  'code': '300652', 'name': '雷迪克',
                  'reason': '汽车轴承前装与售后市场直接可比，产品结构相近',
                  'preferred': ['汽车轴承基本盘稳健', '前装与售后并举', '汽车轴承发展趋势', '专精特新', '深度', '首次覆盖'],
              },
              {
                  'code': '300695', 'name': '兆丰股份',
                  'reason': '轮毂轴承龙头，可用于客户结构、盈利能力和智能化布局对标',
                  'preferred': ['轮毂轴承主业稳健', '轮毂轴承', '具身智能', '深度', '首次覆盖'],
              },
              {
                  'code': '300984', 'name': '金沃股份',
                  'reason': '轴承套圈与精密零部件企业，可补充高端化和机器人赛道对标',
                  'preferred': ['轴承盈利向暖', '绝缘套圈', '精密丝杠', '深度', '首次覆盖'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,application/pdf,*/*;q=0.01',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:105]

          def api_rows(code: str) -> list[dict]:
              out = []
              for page in range(1, 8):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*',
                      'beginTime': '2017-01-01', 'endTime': TODAY,
                      'pageNo': str(page), 'fields': '', 'qType': '0',
                      'orgCode': '', 'code': code, 'rcode': '',
                      'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                  }
                  last = None
                  for attempt in range(1, 5):
                      try:
                          r = session.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=(25, 150))
                          print('API', code, page, attempt, r.status_code, len(r.content), flush=True)
                          r.raise_for_status()
                          batch = r.json().get('data') or []
                          out.extend(batch)
                          last = None
                          break
                      except Exception as exc:
                          last = exc
                          time.sleep(attempt * 2)
                  if last:
                      raise RuntimeError(f'API failed {code} page {page}: {last!r}')
                  if len(batch) < 100:
                      break
              unique = {}
              for row in out:
                  key = str(row.get('infoCode') or json.dumps(row, ensure_ascii=False, sort_keys=True))
                  unique[key] = row
              return list(unique.values())

          def download_report(info_code: str, target: Path) -> str:
              variants = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              last = None
              for url in variants:
                  try:
                      r = session.get(url, timeout=(30, 240), allow_redirects=True)
                      print('PDF', info_code, r.status_code, len(r.content), url, flush=True)
                      if r.status_code == 200 and len(r.content) > 100_000 and r.content.startswith(b'%PDF-'):
                          target.write_bytes(r.content)
                          return str(r.url)
                  except Exception as exc:
                      last = exc
              raise RuntimeError(f'No valid PDF for {info_code}: {last!r}')

          all_metadata = {}
          peer_candidates = []
          for peer in peers:
              rows = api_rows(peer['code'])
              all_metadata[peer['code']] = rows
              print('METADATA', peer['code'], peer['name'], len(rows), flush=True)
              scored = []
              for row in rows:
                  title = str(row.get('title') or '').strip()
                  info_code = str(row.get('infoCode') or '')
                  if not title or not info_code:
                      continue
                  pages_meta = int(row.get('attachPages') or 0)
                  date = str(row.get('publishDate') or '')[:10]
                  year = int(date[:4]) if re.match(r'20\d{2}', date) else 0
                  explicit = any(k in title for k in ['深度', '首次覆盖', '首次', '公司研究报告', 'A股公司深度报告'])
                  pref_hits = sum(1 for k in peer['preferred'] if k in title)
                  shallow = any(k in title for k in ['季报点评', '年报点评', '中报点评', '事件点评', '快报点评', '业绩预告'])
                  score = pref_hits * 30 + int(explicit) * 45 + min(pages_meta, 60) + max(0, year - 2020) * 4 - int(shallow) * 80
                  scored.append((score, pages_meta, date, row))
              scored.sort(key=lambda x: (x[0], x[1], x[2]), reverse=True)

              validated = None
              for _, pages_meta, _, row in scored[:30]:
                  title = str(row.get('title') or '').strip()
                  info_code = str(row.get('infoCode') or '')
                  temp = DOWNLOADS / f'{peer["code"]}_{info_code}.pdf'
                  try:
                      source_url = download_report(info_code, temp)
                      reader = PdfReader(str(temp), strict=False)
                      pages = len(reader.pages)
                      indices = list(range(min(24, pages)))
                      if pages > 28:
                          indices.extend(range(max(0, pages - 3), pages))
                      text_parts = []
                      for i in dict.fromkeys(indices):
                          try:
                              text_parts.append(reader.pages[i].extract_text() or '')
                          except Exception:
                              pass
                      sample = '\n'.join(text_parts)
                      low = sample.lower()
                      identity = peer['name'] in sample or peer['code'] in sample
                      research = any(x in sample for x in ['证券研究报告', '公司研究', '深度研究', '投资评级', '首次覆盖']) or 'equity research' in low
                      if not identity or not research or pages < 18:
                          print('REJECT', peer['name'], title, pages, identity, research, flush=True)
                          temp.unlink(missing_ok=True)
                          continue
                      check = subprocess.run(['qpdf', '--check', str(temp)], capture_output=True, text=True)
                      if check.returncode not in (0, 3):
                          raise RuntimeError(check.stderr[-800:])
                      raw = temp.read_bytes()
                      validated = {
                          'peer_code': peer['code'],
                          'peer_name': peer['name'],
                          'relevance_to_target': peer['reason'],
                          'title': title,
                          'broker': str(row.get('orgSName') or row.get('orgName') or '未知券商'),
                          'publish_date': str(row.get('publishDate') or '')[:10],
                          'pages': pages,
                          'bytes': len(raw),
                          'sha256': hashlib.sha256(raw).hexdigest(),
                          'source_url': source_url,
                          'info_code': info_code,
                          'file': str(temp),
                      }
                      print('VALIDATED', json.dumps(validated, ensure_ascii=False), flush=True)
                      break
                  except Exception as exc:
                      print('PROBE_ERR', peer['name'], title, repr(exc), flush=True)
                      temp.unlink(missing_ok=True)
              if validated:
                  peer_candidates.append(validated)

          if len(peer_candidates) < 3:
              raise RuntimeError(f'Only {len(peer_candidates)} validated peer deep reports found')

          # Preserve preferred order: 光洋股份、雷迪克、兆丰股份；金沃股份为备选。
          order = {'002708': 1, '300652': 2, '300695': 3, '300984': 4}
          peer_candidates.sort(key=lambda x: order.get(x['peer_code'], 99))
          selected = peer_candidates[:3]

          package = '襄阳轴承_000678_相关券商深度报告_3份_汽车轴承同业对标'
          final_dir = FINAL_ROOT / package
          final_dir.mkdir(parents=True, exist_ok=True)
          manifest = []
          for idx, record in enumerate(selected, 1):
              filename = f'{idx:02d}_{safe(record["publish_date"])}_{safe(record["broker"])}_{safe(record["peer_name"])}_{safe(record["title"])}.pdf'
              shutil.copy2(record['file'], final_dir / filename)
              item = {k: v for k, v in record.items() if k != 'file'}
              item['filename'] = filename
              manifest.append(item)

          readme = [
              f'{TARGET}相关券商深度报告——汽车轴承同业对标材料',
              '整理日期：2026-10-05',
              '',
              '重要口径说明：',
              '1. 经东方财富个股研报接口、公开网页及历史研报索引交叉检索，未发现可公开直接下载且可核验的襄阳轴承公司专属深度报告或首次覆盖报告。',
              '2. 为避免用季报点评、媒体文章或非券商材料凑数，本包改收录3份与襄阳轴承主营业务最接近的汽车轴承同业券商深度报告。',
              '3. 这些报告用于行业、产品、客户、盈利能力、国产替代与机器人增量逻辑的横向对标，不应视为券商对襄阳轴承本身的评级或盈利预测。',
              '',
              '文件清单：',
          ]
          for i, r in enumerate(manifest, 1):
              readme += [
                  f'{i}. {r["filename"]}',
                  f'   对标公司：{r["peer_name"]}（{r["peer_code"]}）',
                  f'   券商：{r["broker"]}',
                  f'   标题：{r["title"]}',
                  f'   日期：{r["publish_date"]}；页数：{r["pages"]}',
                  f'   与襄阳轴承的相关性：{r["relevance_to_target"]}',
                  f'   来源：{r["source_url"]}',
                  f'   SHA-256：{r["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查PDF文件头、对标公司身份、券商研究标识、实际页数、qpdf结构、重复文件及SHA-256；最终ZIP已通过CRC测试。')
          (final_dir / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (final_dir / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (final_dir / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in manifest), encoding='utf-8')
          (final_dir / '检索元数据.json').write_text(json.dumps(all_metadata, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = ART / f'{package}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(final_dir.iterdir()):
                  z.write(p, arcname=f'{package}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != 3:
                  raise RuntimeError(f'Expected 3 PDFs, got {len(pdfs)}')
          print('SELECTED_FINAL', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xiangyang-bearing-000678-peer-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
