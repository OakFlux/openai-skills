name: Build Nuosi 301333 disclosure package

on:
  push:
    branches:
      - tmp-nuosi-301333-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='诺思格_301333_年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE" /tmp/nuosi_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('诺思格_301333_年报_招股说明书_最新季报')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=1.1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          documents = [
              {
                  'order': 1,
                  'filename': '01_诺思格_首次公开发行股票并在创业板上市招股说明书_2022-07-20.pdf',
                  'label': '首次公开发行股票并在创业板上市招股说明书',
                  'date': '2022-07-20',
                  'type': 'prospectus',
                  'min_pages': 300,
                  'detail': None,
                  'id': None,
              },
              {
                  'order': 2,
                  'filename': '02_诺思格_2022年年度报告.pdf',
                  'label': '2022年年度报告',
                  'date': '2023-04-25',
                  'type': 'annual',
                  'year': 2022,
                  'min_pages': 100,
                  'id': '9053904',
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9053904&stockid=301333',
              },
              {
                  'order': 3,
                  'filename': '03_诺思格_2023年年度报告.pdf',
                  'label': '2023年年度报告',
                  'date': '2024-04-22',
                  'type': 'annual',
                  'year': 2023,
                  'min_pages': 100,
                  'id': '10017139',
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10017139&stockid=301333',
              },
              {
                  'order': 4,
                  'filename': '04_诺思格_2024年年度报告.pdf',
                  'label': '2024年年度报告',
                  'date': '2025-03-28',
                  'type': 'annual',
                  'year': 2024,
                  'min_pages': 100,
                  'id': '10813876',
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10813876&stockid=301333',
              },
              {
                  'order': 5,
                  'filename': '05_诺思格_2025年年度报告.pdf',
                  'label': '2025年年度报告',
                  'date': '2026-03-28',
                  'type': 'annual',
                  'year': 2025,
                  'min_pages': 100,
                  'id': '12031823',
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12031823&stockid=301333',
              },
              {
                  'order': 6,
                  'filename': '06_诺思格_2026年第三季度报告.pdf',
                  'label': '2026年第三季度报告',
                  'date': '2026-10-27',
                  'type': 'quarter',
                  'year': 2026,
                  'min_pages': 8,
                  'id': '12660085',
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12660085&stockid=301333',
              },
          ]

          def decode_response(response: requests.Response) -> str:
              response.encoding = response.apparent_encoding or response.encoding or 'gb18030'
              return response.text

          def discover_prospectus_detail() -> str:
              list_urls = [
                  'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/301333.phtml',
                  'https://money.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/301333.phtml',
              ]
              last = None
              for list_url in list_urls:
                  try:
                      response = session.get(list_url, timeout=(30, 120))
                      if response.status_code != 200:
                          raise RuntimeError(f'HTTP {response.status_code}')
                      text = decode_response(response)
                      soup = BeautifulSoup(text, 'html.parser')
                      matches = []
                      for anchor in soup.find_all('a', href=True):
                          title = re.sub(r'\s+', '', anchor.get_text(' ', strip=True))
                          href = html.unescape(anchor.get('href', '')).strip()
                          if '首次公开发行股票并在创业板上市招股说明书' in title:
                              matches.append(urljoin(list_url, href))
                      if matches:
                          print('PROSPECTUS DETAIL', matches[0])
                          return matches[0]
                      found = re.findall(
                          r'href=[\"\']([^\"\']*RaiseExplanationDetail[^\"\']*)[\"\'][^>]*>[^<]*首次公开发行股票并在创业板上市招股说明书',
                          text,
                          flags=re.I,
                      )
                      if found:
                          detail = urljoin(list_url, html.unescape(found[0]))
                          print('PROSPECTUS DETAIL REGEX', detail)
                          return detail
                      last = RuntimeError('exact prospectus link not found')
                  except Exception as exc:
                      last = exc
              raise RuntimeError(f'Could not discover prospectus detail page: {last!r}')

          documents[0]['detail'] = discover_prospectus_detail()

          def extract_pdf_urls(detail_url: str) -> list[str]:
              urls: list[str] = []
              try:
                  response = session.get(detail_url, timeout=(30, 150), allow_redirects=True)
                  if response.status_code != 200:
                      raise RuntimeError(f'HTTP {response.status_code}')
                  text = html.unescape(decode_response(response))
                  soup = BeautifulSoup(text, 'html.parser')
                  for anchor in soup.find_all('a', href=True):
                      href = html.unescape(anchor.get('href', '')).strip()
                      if '.pdf' in href.lower():
                          urls.append(urljoin(detail_url, href))
                  patterns = [
                      r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                      r'https?:\\/\\/[^\s\"\'<>]+?\.pdf(?:\\/|\?[^\s\"\'<>]*)?',
                  ]
                  for pattern in patterns:
                      for found in re.findall(pattern, text, flags=re.I):
                          found = found.replace('\\/', '/')
                          urls.append(html.unescape(found))
                  # Sina sometimes stores the PDF URL in JS variables without the .pdf text being lowercase-normalized.
                  for found in re.findall(r'(?:url|downloadUrl|fileUrl)\s*[:=]\s*[\"\']([^\"\']+)[\"\']', text, flags=re.I):
                      found = html.unescape(found).replace('\\/', '/')
                      if '.pdf' in found.lower():
                          urls.append(urljoin(detail_url, found))
              except Exception as exc:
                  print('DETAIL EXTRACTION FAILED', detail_url, repr(exc))

              unique: list[str] = []
              seen = set()
              for url in urls:
                  if url.startswith('//'):
                      url = 'https:' + url
                  if url.startswith('http://'):
                      url = 'https://' + url[len('http://'):]
                  if url not in seen:
                      seen.add(url)
                      unique.append(url)
              print('DETAIL PDF CANDIDATES', detail_url, len(unique))
              for candidate in unique[:10]:
                  print('  CANDIDATE', candidate)
              return unique

          def sina_fallbacks(doc: dict) -> list[str]:
              if not doc.get('id'):
                  return []
              year = doc['date'][:4]
              month = str(int(doc['date'][5:7]))
              month2 = doc['date'][5:7]
              date = doc['date']
              bulletin_id = doc['id']
              paths = []
              for market_dir in ('CNSESZ_STOCK', 'CNSESH_STOCK'):
                  for month_dir in (f'{year}-{month}', f'{year}-{month2}'):
                      base = f'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/{market_dir}/{year}/{month_dir}/{date}/{bulletin_id}.PDF'
                      paths.append(base)
                      paths.append(base.replace('211.154.219.97:9494', '211.154.219.97%3A9494'))
              return paths

          def is_expected_text(path: Path, doc: dict) -> bool:
              text = ''
              try:
                  reader = PdfReader(str(path), strict=False)
                  sample_indexes = list(range(min(8, len(reader.pages))))
                  if len(reader.pages) > 8:
                      sample_indexes.append(len(reader.pages) - 1)
                  for idx in sample_indexes:
                      try:
                          text += '\n' + (reader.pages[idx].extract_text() or '')
                      except Exception:
                          pass
              except Exception:
                  return False
              compact = re.sub(r'\s+', '', text)
              company_ok = ('诺思格（北京）医药科技股份有限公司' in compact or '诺思格(北京)医药科技股份有限公司' in compact or '诺思格' in compact)
              if not company_ok:
                  return False
              if doc['type'] == 'prospectus':
                  return '招股说明书' in compact and ('首次公开发行股票' in compact or '创业板上市' in compact)
              if doc['type'] == 'annual':
                  return f"{doc['year']}年年度报告" in compact or f"{doc['year']}年度报告" in compact
              if doc['type'] == 'quarter':
                  return '2026年第三季度报告' in compact or '2026年三季度报告' in compact
              return True

          def download_document(doc: dict) -> dict:
              candidates = extract_pdf_urls(doc['detail'])
              candidates.extend(sina_fallbacks(doc))
              deduped = []
              seen = set()
              for candidate in candidates:
                  if candidate not in seen:
                      seen.add(candidate)
                      deduped.append(candidate)

              destination = OUT / doc['filename']
              last_error = None
              for candidate in deduped:
                  for attempt in range(2):
                      try:
                          print('TRY', doc['label'], candidate)
                          response = session.get(
                              candidate,
                              headers={
                                  'Referer': doc['detail'],
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200:
                              raise RuntimeError(f'HTTP {response.status_code}')
                          if not data.startswith(b'%PDF-'):
                              raise RuntimeError(f'not PDF: bytes={len(data)} type={response.headers.get("content-type")}')
                          if len(data) < 80_000:
                              raise RuntimeError(f'PDF too small: {len(data)} bytes')
                          destination.write_bytes(data)
                          pages = len(PdfReader(str(destination), strict=False).pages)
                          if pages < int(doc['min_pages']):
                              raise RuntimeError(f'page count {pages} below minimum {doc["min_pages"]}')
                          if not is_expected_text(destination, doc):
                              raise RuntimeError('PDF text does not match the expected company/document title')
                          sha = hashlib.sha256(data).hexdigest()
                          result = {
                              'order': doc['order'],
                              'file': doc['filename'],
                              'document': doc['label'],
                              'published': doc['date'],
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': sha,
                              'source': response.url,
                              'announcement_page': doc['detail'],
                          }
                          print('DOWNLOADED', destination.name, 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return result
                      except Exception as exc:
                          last_error = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', doc['label'], candidate, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f'Could not download {doc["label"]}: {last_error!r}')

          results = [download_document(doc) for doc in documents]
          results.sort(key=lambda item: item['order'])

          lines = [
              '诺思格（301333）年度报告、招股说明书及最新季报资料包',
              '整理日期：2026-10-28',
              '',
              '收录范围：',
              '1. 上市以来全部年度报告全文：2022年、2023年、2024年、2025年，共4份。',
              '2. 2022年7月20日披露的首次公开发行股票并在创业板上市招股说明书正式发行版，共1份。',
              '3. 截至2026年10月28日最新已披露季度报告：2026年第三季度报告，共1份。',
              '4. 公司于2022年8月上市，因此不存在上市公司口径的2020年或2021年年度报告；相关历史财务资料已包含在招股说明书中。',
              '5. 未收录年度报告摘要、半年度报告、季度报告以外的临时公告，也未用财务报告单行文件替代年度报告全文。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in results:
              lines += [
                  f"- {item['file']}",
                  f"  文件：{item['document']}",
                  f"  披露日期：{item['published']}",
                  f"  页数：{item['pages']}页",
                  f"  原始PDF：{item['source']}",
                  f"  公告/索引页：{item['announcement_page']}",
                  f"  SHA-256：{item['sha256']}",
              ]
              sums.append(f"{item['sha256']}  {item['file']}")
              total_pages += item['pages']
              total_bytes += item['bytes']
          lines += [
              '',
              f'合计：6份PDF，{total_pages}页，{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数和正文公司名称/文档标题检查；首末页另行完成渲染检查。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 6

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 8
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '诺思格（北京）医药科技股份有限公司|诺思格\(北京\)医药科技股份有限公司|诺思格' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/nuosi_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/nuosi_package_test.zip "$PACKAGE"
          unzip -t /tmp/nuosi_package_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/nuosi_package_test.zip | grep -c '\.pdf$')" -eq 6
          rm -f /tmp/nuosi_package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Nuosi-301333-annual-reports-prospectus-latest-quarter
          path: 诺思格_301333_年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
