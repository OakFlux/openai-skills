name: Capture Hubei Energy public report viewer HTML

on:
  push:
    branches: [tmp-hubei-energy-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hubei-energy-viewer-html-20261016.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download public viewer HTML
        run: |
          mkdir -p capture
          curl --http1.1 -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            'https://www.fxbaogao.com/view?id=5191475' -o capture/view.html
          wc -c capture/view.html
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: hubei-energy-public-viewer-html
          path: capture/view.html
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
