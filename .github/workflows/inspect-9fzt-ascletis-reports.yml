name: Inspect public Ascletis report pages
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/inspect-9fzt-ascletis-reports.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/inspect_9fzt_ascletis_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: ascletis-9fzt-probe
          path: |
            ascletis_9fzt_probe.json
            ascletis_9fzt_probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
