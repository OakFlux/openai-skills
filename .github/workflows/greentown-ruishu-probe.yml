name: Greentown Ruishu public PDF probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-yanbaoke-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect public report pages and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import html
          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          OUT=Path('ruishu'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          pages=[
            'https://www.ruishubaogao.com/report-detail/9255',
            'https://www.ruishubaogao.com/report-detail/10770',
            'https://www.ruishubaogao.com/search?q=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
            'https://www.ruishubaogao.com/reports?search=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
            'https://www.ruishubaogao.com/?q=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
          ]
          page_results=[]; scripts=[]
          for idx,url in enumerate(pages):
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              text=r.text
              (OUT/f'page_{idx}.html').write_text(text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(text,'html.parser')
              srcs=[urllib.parse.urljoin(r.url,x.get('src')) for x in soup.select('script[src]') if x.get('src')]
              scripts+=srcs
              links=[]
              for x in soup.select('a[href],button,iframe[src],embed[src],object[data]'):
                u=x.get('href') or x.get('src') or x.get('data') or ''
                label=' '.join(x.get_text(' ',strip=True).split())
                if u: u=urllib.parse.urljoin(r.url,u)
                if any(k in (u+' '+label).lower() for k in ['pdf','download','报告','report','绿城']): links.append({'label':label,'url':u,'html':str(x)[:1000]})
              inline=[]
              for sc in soup.select('script:not([src])'):
                t=sc.get_text('\n',strip=False)
                if any(k.lower() in t.lower() for k in ['__next_data__','pdf','download','report','api','绿城']): inline.append(t[:300000])
              raw=sorted(set(re.findall(r'https?://[^\s"\'<>\\]+',html.unescape(text))))
              rec={'url':url,'status':r.status_code,'final':r.url,'ctype':r.headers.get('content-type'),'length':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'scripts':srcs,'links':links,'inline':inline,'raw':[u for u in raw if any(k in u.lower() for k in ['pdf','download','report','api'])]}
              page_results.append(rec)
              print('\nPAGE',json.dumps(rec,ensure_ascii=False,indent=2)[:150000])
            except Exception as exc:
              page_results.append({'url':url,'error':repr(exc)}); print('PAGE ERROR',url,repr(exc))
          (OUT/'pages.json').write_text(json.dumps(page_results,ensure_ascii=False,indent=2),encoding='utf-8')

          js_results=[]
          queue=list(dict.fromkeys(scripts)); fetched=set()
          while queue and len(fetched)<120:
            url=queue.pop(0)
            if url in fetched: continue
            fetched.add(url)
            try:
              r=s.get(url,timeout=45)
              if r.status_code!=200 or len(r.content)>20_000_000: continue
              text=r.text
              name=urllib.parse.urlparse(url).path.rsplit('/',1)[-1] or f'js_{len(fetched)}.js'
              (OUT/name).write_text(text,encoding='utf-8',errors='replace')
              for rel in re.findall(r'["\']([^"\']+?\.js)["\']',text):
                if rel.startswith('http'): child=rel
                elif rel.startswith('/') or rel.startswith('./') or rel.startswith('../'): child=urllib.parse.urljoin(url,rel)
                else: continue
                if 'ruishubaogao.com' in child and child not in fetched and child not in queue: queue.append(child)
              low=text.lower(); snippets=[]
              for key in ['download','pdf','report-detail','reportdetail','api/','baseurl','fileurl','file_url','document_url','storage','supabase','s3','oss']:
                pos=0
                while True:
                  pos=low.find(key,pos)
                  if pos<0: break
                  snippets.append(text[max(0,pos-1800):min(len(text),pos+6500)])
                  pos+=len(key)
                  if len(snippets)>=100: break
                if len(snippets)>=100: break
              urls=sorted(set(re.findall(r'https?://[^\s"\'<>\\]+',html.unescape(text))))
              urls=[u.rstrip('),.;') for u in urls if any(k in u.lower() for k in ['pdf','download','api','report','storage','supabase','s3','oss'])]
              if snippets or urls:
                rec={'url':url,'length':len(r.content),'snippets':snippets,'urls':urls}; js_results.append(rec)
                print('\nJS',url,len(r.content),json.dumps({'urls':urls,'snippets':snippets[:12]},ensure_ascii=False,indent=2)[:150000])
            except Exception as exc: print('JS ERROR',url,repr(exc))
          (OUT/'js_results.json').write_text(json.dumps(js_results,ensure_ascii=False,indent=2),encoding='utf-8')

          # Probe common public endpoints conservatively (no auth bypass).
          probes=[]
          bases=['https://www.ruishubaogao.com','https://api.ruishubaogao.com']
          paths=[
            '/api/reports/9255','/api/report/9255','/api/reports/9255/download','/api/report/9255/download',
            '/api/reports?search=绿城中国','/api/report/search?q=绿城中国','/api/search?q=绿城中国',
            '/api/reports/10770','/api/reports/10770/download','/download/9255','/report-download/9255',
          ]
          for base in bases:
            for path in paths:
              try:
                u=base+path
                r=s.get(u,timeout=25,allow_redirects=True,headers={'Range':'bytes=0-4095','User-Agent':s.headers['User-Agent']})
                ctype=r.headers.get('content-type',''); body=r.content[:4096]
                rec={'url':u,'status':r.status_code,'final':r.url,'ctype':ctype,'length':len(r.content),'headers':dict(r.headers),'sig':repr(body[:80]),'text':body.decode('utf-8',errors='replace')[:3000]}
                probes.append(rec)
                if r.status_code not in [404,405] or body.startswith(b'%PDF-'): print('PROBE',json.dumps(rec,ensure_ascii=False)[:20000])
              except Exception as exc: probes.append({'url':base+path,'error':repr(exc)})
          (OUT/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greentown-ruishu-probe
          path: ruishu/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
