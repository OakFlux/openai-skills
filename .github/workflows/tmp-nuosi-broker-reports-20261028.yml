name: Build Nuosi 301333 broker deep reports

on:
  push:
    branches:
      - tmp-nuosi-broker-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='诺思格_301333_券商深度报告_3份'
          mkdir -p "$PACKAGE" /tmp/nuosi_broker_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('诺思格_301333_券商深度报告_3份')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          reports = [
              {
                  'order': 1,
                  'broker': '东吴证券',
                  'date': '2023-05-10',
                  'title': '新药研发不缺biotech，但缺优质临床CRO',
                  'filename': '01_东吴证券_新药研发不缺biotech但缺优质临床CRO_2023-05-10.pdf',
                  'min_pages': 20,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H301_AP202305101586449244_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202305101586449244_1.pdf',
                  ],
                  'info': 'https://data.eastmoney.com/report/info/AP202305101586449244.html',
              },
              {
                  'order': 2,
                  'broker': '开源证券',
                  'date': '2023-05-31',
                  'title': '深耕临床CRO业务，全方位服务药物临床开发',
                  'filename': '02_开源证券_深耕临床CRO业务全方位服务药物临床开发_2023-05-31.pdf',
                  'min_pages': 20,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H301_AP202306011587450211_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202306011587450211_1.pdf',
                  ],
                  'info': 'https://data.eastmoney.com/report/info/AP202306011587450211.html',
              },
              {
                  'order': 3,
                  'broker': '太平洋证券',
                  'date': '2024-08-02',
                  'title': '聚焦临床CRO领域，一站式赋能临床研发',
                  'filename': '03_太平洋证券_聚焦临床CRO领域一站式赋能临床研发_2024-08-02.pdf',
                  'min_pages': 20,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202408051639136485_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H301_AP202408051639136485_1.pdf',
                  ],
                  'info': 'https://data.eastmoney.com/report/info/AP202408051639136485.html',
              },
          ]

          def download(report: dict) -> tuple[str, bytes]:
              last = None
              for attempt in range(8):
                  for url in report['urls']:
                      try:
                          response = session.get(
                              url,
                              headers={'Referer': report['info']},
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 150_000:
                              return response.url, data
                          last = RuntimeError(
                              f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                          )
                      except Exception as exc:
                          last = exc
                  time.sleep(min(2 + attempt, 10))
              raise RuntimeError(f'Failed to download {report["title"]}: {last!r}')

          records = []
          for report in reports:
              source, data = download(report)
              path = out / report['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'{path.name}: only {pages} pages')
              sample = ''
              indexes = list(range(min(8, pages)))
              if pages > 8:
                  indexes.append(pages - 1)
              for idx in indexes:
                  try:
                      sample += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              compact = ''.join(sample.split())
              if '诺思格' not in compact:
                  raise RuntimeError(f'{path.name}: company name not found')
              if report['broker'].replace('证券', '') not in compact and report['broker'] not in compact:
                  raise RuntimeError(f'{path.name}: broker name not found')
              sha = hashlib.sha256(data).hexdigest()
              records.append({
                  **report,
                  'source': source,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              })
              print('DOWNLOADED', path.name, 'pages=', pages, 'bytes=', len(data), 'source=', source, 'sha256=', sha)

          manifest = [
              '诺思格（301333）券商深度报告资料包',
              '整理日期：2026-10-28',
              '',
              '收录原则：仅收录可公开直接下载、且经结构和正文核验的券商原始完整PDF；未使用网页摘要、预览版或重新排版文件。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              manifest += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   发布日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   研报索引：{item['info']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          manifest += [
              f'三份PDF合计：{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(manifest))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 20
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '诺思格|诺思格（北京）医药科技股份有限公司|诺思格\(北京\)医药科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/nuosi_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/nuosi_broker_test.zip "$PACKAGE"
          unzip -t /tmp/nuosi_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/nuosi_broker_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f /tmp/nuosi_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Nuosi-301333-broker-deep-reports-3
          path: 诺思格_301333_券商深度报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
