name: Build verified public Weilong broker research package 20260927

on:
  push:
    paths:
      - '.github/workflows/weilong-public-broker-reports-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          package_name = '卫龙美味_09985.HK_券商深度报告_3份'
          out = Path(package_name)
          out.mkdir(exist_ok=True)
          preview_dir = Path('previews')
          preview_dir.mkdir(exist_ok=True)

          reports = [
              {
                  'filename': '01_天风证券_卫龙美味_小辣条造就大玩家_黄金赛道的稀缺性龙头_2021-05-21.pdf',
                  'broker': '天风证券',
                  'title': '卫龙美味：小辣条造就大玩家，黄金赛道的稀缺性龙头',
                  'date': '2021-05-21',
                  'type': '卫龙美味公司深度研究',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202105211493069853_1.pdf',
                  'expected_pages': 37,
                  'identity_terms': ['卫龙美味', '天风证券', '小辣条造就大玩家'],
                  'preview_page': 1,
              },
              {
                  'filename': '02_中泰证券_休闲零食行业深度_品类视角理解中式零食发展_卫龙美味重点研究_2024-10-24.pdf',
                  'broker': '中泰证券',
                  'title': '品类视角理解中式零食发展：为什么是魔芋和鹌鹑蛋？',
                  'date': '2024-10-24',
                  'type': '休闲零食行业深度研究（含卫龙美味重点研究）',
                  'url': 'https://file.iyanbao.com/pdf/ba100-c696575a-aa58-4bb9-8266-e5efa5ea0b4b.pdf',
                  'expected_pages': 20,
                  'identity_terms': ['中泰证券', '为什么是魔芋和鹌鹑蛋', '卫龙美味'],
                  'preview_page': 11,
              },
              {
                  'filename': '03_开源证券_魔芋行业主题深度_卫龙美味独立章节_2025-01-15.pdf',
                  'broker': '开源证券',
                  'title': '魔芋热潮：健康食品新宠，晶球与零食潜力逐渐释放',
                  'date': '2025-01-15',
                  'type': '魔芋行业主题深度研究（含卫龙美味独立章节）',
                  'url': 'https://file.iyanbao.com/pdf/3775a-173aca8e-ca30-4886-9610-3884a951ef6f.pdf',
                  'expected_pages': 26,
                  'identity_terms': ['开源证券', '魔芋热潮', '卫龙美味'],
                  'preview_page': 19,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          manifest = []
          for index, report in enumerate(reports, 1):
              dest = out / report['filename']
              response = session.get(report['url'], timeout=(30, 240), allow_redirects=True)
              response.raise_for_status()
              data = response.content
              if not data.startswith(b'%PDF'):
                  raise RuntimeError(f"Not a PDF: {report['url']} ({response.headers.get('content-type')})")
              if len(data) < 100_000:
                  raise RuntimeError(f"PDF too small: {report['url']} ({len(data)} bytes)")
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f"Page count mismatch for {dest.name}: {pages} != {report['expected_pages']}")

              qpdf = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f"qpdf failed for {dest.name}: {qpdf.stderr[-2000:]}")

              txt_path = dest.with_suffix('.txt')
              subprocess.run(['pdftotext', '-layout', str(dest), str(txt_path)], check=True)
              text = txt_path.read_text(encoding='utf-8', errors='ignore')
              txt_path.unlink(missing_ok=True)
              missing = [term for term in report['identity_terms'] if term not in text]
              if missing:
                  raise RuntimeError(f"Identity terms missing from {dest.name}: {missing}")

              preview_prefix = preview_dir / f'{index:02d}_{report["broker"]}'
              subprocess.run([
                  'pdftoppm', '-f', str(report['preview_page']), '-l', str(report['preview_page']),
                  '-singlefile', '-png', '-r', '130', str(dest), str(preview_prefix)
              ], check=True, capture_output=True)
              preview = preview_prefix.with_suffix('.png')
              if not preview.exists() or preview.stat().st_size < 20_000:
                  raise RuntimeError(f"Preview render failed for {dest.name}")

              sha256 = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'title': report['title'],
                  'date': report['date'],
                  'report_type': report['type'],
                  'pages': pages,
                  'bytes': len(data),
                  'source_url': report['url'],
                  'sha256': sha256,
              })
              print('VALIDATED', json.dumps(manifest[-1], ensure_ascii=False), flush=True)

          readme = [
              '卫龙美味（09985.HK）券商深度研究资料包',
              '整理日期：2026-09-27',
              '',
              '资料构成说明：',
              '1. 本包包含 1 份卫龙美味公司深度研究，以及 2 份与卫龙核心增长品类直接相关的行业深度研究。',
              '2. 中泰证券报告重点研究魔芋零食品类，明确分析卫龙在该品类的龙头地位。',
              '3. 开源证券报告设有“卫龙美味”独立章节，覆盖经营表现、蔬菜制品和魔芋产品。',
              '4. 三份文件均为公开可直接访问的原始 PDF，不含下载器、网页摘要或跳转脚本。',
              '',
              '核验项目：PDF 文件头、页数、公司与机构身份文本、qpdf 结构、指定页面渲染、ZIP CRC、SHA-256。',
              '',
              '文件清单：',
          ]
          for i, item in enumerate(manifest, 1):
              readme.extend([
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   类型：{item['report_type']}",
                  f"   日期：{item['date']}；页数：{item['pages']}；大小：{item['bytes'] / 1048576:.2f} MB",
                  f"   文件：{item['filename']}",
                  f"   来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ])
          (out / '00_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(f'{package_name}.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{package_name}/{path.name}')
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              members = archive.namelist()
              pdf_count = sum(name.lower().endswith('.pdf') for name in members)
              if pdf_count != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count}')

          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final package and verification previews
        uses: actions/upload-artifact@v4
        with:
          name: weilong-09985-public-broker-reports-package-20260927
          path: |
            卫龙美味_09985.HK_券商深度报告_3份.zip
            previews/*.png
          retention-days: 7
          if-no-files-found: error
