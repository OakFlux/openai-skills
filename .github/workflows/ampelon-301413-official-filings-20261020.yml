name: Package Ampelon 301413 official filings

on:
  push:
    paths:
      - '.github/workflows/ampelon-301413-official-filings-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf pymupdf

      - name: Discover, download, verify and package official PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import re
          import shutil
          import sys
          import time
          import zipfile
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from typing import Any

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE = "301413"
          COMPANY = "安培龙"
          FULL_COMPANY = "深圳安培龙科技股份有限公司"
          CUTOFF = "2026-10-20"
          CUTOFF_COMPACT = "20261020"
          BASE_STATIC = "https://static.cninfo.com.cn/"
          API = "https://www.cninfo.com.cn/new/hisAnnouncement/query"
          ROOT_NAME = f"{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{CUTOFF_COMPACT}"
          ROOT = Path("work") / ROOT_NAME
          DIST = Path("dist")
          DIST.mkdir(parents=True, exist_ok=True)
          (ROOT / "00_招股说明书").mkdir(parents=True, exist_ok=True)
          (ROOT / "01_年度报告").mkdir(parents=True, exist_ok=True)
          (ROOT / "02_最新季度报告").mkdir(parents=True, exist_ok=True)
          (ROOT / "首页预览").mkdir(parents=True, exist_ok=True)

          def session() -> requests.Session:
              s = requests.Session()
              retry = Retry(
                  total=5,
                  connect=5,
                  read=5,
                  status=5,
                  backoff_factor=1.2,
                  status_forcelist=(403, 408, 429, 500, 502, 503, 504),
                  allowed_methods=frozenset({"GET", "POST"}),
                  raise_on_status=False,
              )
              s.mount("https://", HTTPAdapter(max_retries=retry))
              s.headers.update({
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
                  "Connection": "keep-alive",
                  "X-Requested-With": "XMLHttpRequest",
                  "Referer": f"https://www.cninfo.com.cn/new/disclosure/stock?stockCode={CODE}",
              })
              return s

          S = session()

          def get_json(url: str, **kwargs: Any) -> Any:
              r = S.get(url, timeout=60, **kwargs)
              print("GET", r.status_code, len(r.content), r.url)
              r.raise_for_status()
              return r.json()

          def clean_title(value: str) -> str:
              value = html.unescape(value or "")
              value = re.sub(r"<[^>]+>", "", value)
              value = value.replace(" ", " ").replace("\u3000", " ")
              return re.sub(r"\s+", "", value).strip()

          def find_org_id() -> str:
              attempts = []
              urls = [
                  "https://www.cninfo.com.cn/new/data/szse_stock.json",
                  f"https://www.cninfo.com.cn/new/information/topSearch/query?keyWord={CODE}&maxNum=20",
                  f"https://www.cninfo.com.cn/new/information/topSearch/query?keyWord={COMPANY}&maxNum=20",
              ]
              for url in urls:
                  try:
                      data = get_json(url)
                      attempts.append({"url": url, "data_type": type(data).__name__})
                      items = []
                      if isinstance(data, dict):
                          for key in ("stockList", "data", "result", "records"):
                              val = data.get(key)
                              if isinstance(val, list):
                                  items.extend(val)
                          if not items:
                              items = [data]
                      elif isinstance(data, list):
                          items = data
                      for item in items:
                          if not isinstance(item, dict):
                              continue
                          code = str(item.get("code") or item.get("stockCode") or item.get("secCode") or "")
                          name = str(item.get("zwjc") or item.get("name") or item.get("secName") or "")
                          org = str(item.get("orgId") or item.get("orgid") or item.get("org_id") or "")
                          if (code == CODE or COMPANY in name) and org:
                              print("Resolved orgId:", org, item)
                              return org
                  except Exception as exc:
                      print("ORG LOOKUP ERROR", url, repr(exc))
              print("Org lookup attempts:", json.dumps(attempts, ensure_ascii=False))
              return ""

          ORG_ID = find_org_id()
          stock_values = []
          if ORG_ID:
              stock_values.append(f"{CODE},{ORG_ID}")
          stock_values.append(CODE)

          def query_announcements(stock_value: str) -> list[dict[str, Any]]:
              all_rows: list[dict[str, Any]] = []
              page = 1
              total = None
              while page <= 50:
                  payload = {
                      "pageNum": str(page),
                      "pageSize": "100",
                      "column": "szse",
                      "tabName": "fulltext",
                      "plate": "sz",
                      "stock": stock_value,
                      "searchkey": "",
                      "secid": "",
                      "category": "",
                      "trade": "",
                      "seDate": f"2021-01-01~{CUTOFF}",
                      "sortName": "time",
                      "sortType": "desc",
                      "isHLtitle": "true",
                  }
                  r = S.post(API, data=payload, timeout=90)
                  print("POST", page, stock_value, r.status_code, len(r.content), r.url)
                  if r.status_code != 200:
                      print(r.text[:500])
                      r.raise_for_status()
                  data = r.json()
                  rows = data.get("announcements") or []
                  if total is None:
                      total = int(data.get("totalAnnouncement") or data.get("totalRecordNum") or 0)
                      print("TOTAL", total)
                  if not rows:
                      break
                  all_rows.extend(rows)
                  print("PAGE", page, "ROWS", len(rows), "ACC", len(all_rows))
                  if total and len(all_rows) >= total:
                      break
                  page += 1
                  time.sleep(0.25)
              return all_rows

          announcements: list[dict[str, Any]] = []
          for stock_value in stock_values:
              try:
                  announcements = query_announcements(stock_value)
                  if announcements:
                      break
              except Exception as exc:
                  print("QUERY ERROR", stock_value, repr(exc))

          if not announcements:
              raise RuntimeError("巨潮资讯公告接口未返回安培龙公告，无法可靠打包。")

          # Normalize and deduplicate.
          normalized: list[dict[str, Any]] = []
          seen = set()
          for row in announcements:
              url = str(row.get("adjunctUrl") or "").lstrip("/")
              title = clean_title(str(row.get("announcementTitle") or ""))
              if not url or not title:
                  continue
              key = (title, url)
              if key in seen:
                  continue
              seen.add(key)
              ts = int(row.get("announcementTime") or 0)
              date = datetime.fromtimestamp(ts / 1000, tz=timezone(timedelta(hours=8))).strftime("%Y-%m-%d") if ts else ""
              normalized.append({
                  "title": title,
                  "url_path": url,
                  "source_url": BASE_STATIC + url,
                  "announcement_time": ts,
                  "announcement_date": date,
                  "announcement_id": row.get("announcementId"),
                  "sec_code": row.get("secCode") or CODE,
                  "sec_name": row.get("secName") or COMPANY,
                  "raw": row,
              })

          print("NORMALIZED", len(normalized))
          for x in normalized:
              if any(k in x["title"] for k in ("年度报告", "季度报告", "一季度报告", "招股说明书")):
                  print("CANDIDATE", x["announcement_date"], x["title"], x["url_path"])

          # Annual reports: full text only, no summaries, notices or audit-only documents.
          annual_candidates: dict[int, list[dict[str, Any]]] = {}
          for x in normalized:
              m = re.search(r"(20\d{2})年年度报告", x["title"])
              if not m:
                  continue
              title = x["title"]
              if any(k in title for k in ("摘要", "更正公告", "提示性公告", "取消", "审计报告", "审核报告", "独立意见", "董事会", "监事会", "问询函", "说明")):
                  continue
              year = int(m.group(1))
              annual_candidates.setdefault(year, []).append(x)

          def annual_rank(x: dict[str, Any]) -> tuple[int, int, int]:
              t = x["title"]
              revision = 2 if any(k in t for k in ("修订", "更新", "更正后", "补充后")) else 1
              exact = 2 if re.fullmatch(r"20\d{2}年年度报告(?:（[^）]+）)?", t) else 1
              return (revision, exact, int(x["announcement_time"]))

          annual_selected: list[dict[str, Any]] = []
          for year in sorted(annual_candidates):
              if year < 2023:
                  continue
              chosen = max(annual_candidates[year], key=annual_rank)
              chosen = dict(chosen)
              chosen["report_year"] = year
              chosen["doc_type"] = "annual_report"
              annual_selected.append(chosen)

          # Final IPO prospectus only; reject filing/registration/hearing drafts and summaries.
          prospectus_candidates = []
          for x in normalized:
              t = x["title"]
              if "首次公开发行股票" not in t or "招股说明书" not in t:
                  continue
              if any(k in t for k in ("摘要", "申报稿", "注册稿", "上会稿", "预披露", "问询", "回复", "提示性公告", "法律意见", "保荐书")):
                  continue
              prospectus_candidates.append(x)

          if not prospectus_candidates:
              # A narrow fallback for issuers whose final document title carries an innocuous parenthetical suffix.
              for x in normalized:
                  t = x["title"]
                  if "首次公开发行股票并在创业板上市招股说明书" in t and not any(k in t for k in ("摘要", "申报稿", "注册稿", "上会稿", "问询", "回复")):
                      prospectus_candidates.append(x)

          def prospectus_rank(x: dict[str, Any]) -> tuple[int, int, int]:
              t = x["title"]
              exact_phrase = 3 if "首次公开发行股票并在创业板上市招股说明书" in t else 1
              plain = 2 if "（" not in t else 1
              return (exact_phrase, plain, int(x["announcement_time"]))

          prospectus_selected = max(prospectus_candidates, key=prospectus_rank) if prospectus_candidates else None
          if prospectus_selected:
              prospectus_selected = dict(prospectus_selected)
              prospectus_selected["doc_type"] = "prospectus"

          # Latest true quarterly report (Q1 or Q3); do not substitute a half-year report while a quarterly report exists.
          quarter_candidates = []
          for x in normalized:
              t = x["title"]
              m = re.search(r"(20\d{2})年(第一|第三)季度报告", t)
              if not m:
                  m2 = re.search(r"(20\d{2})年([一三])季度报告", t)
                  if m2:
                      m = m2
              if not m:
                  continue
              if any(k in t for k in ("摘要", "更正公告", "提示性公告", "问询", "说明")):
                  continue
              year = int(m.group(1))
              qtoken = m.group(2)
              quarter = 3 if qtoken in ("第三", "三") else 1
              y = dict(x)
              y["report_year"] = year
              y["quarter"] = quarter
              y["doc_type"] = "quarterly_report"
              quarter_candidates.append(y)

          latest_quarter = max(quarter_candidates, key=lambda x: (x["report_year"], x["quarter"], int(x["announcement_time"]))) if quarter_candidates else None

          selected: list[dict[str, Any]] = []
          if prospectus_selected:
              selected.append(prospectus_selected)
          selected.extend(annual_selected)
          if latest_quarter:
              selected.append(latest_quarter)

          if not prospectus_selected:
              raise RuntimeError("未找到最终正式版IPO招股说明书。")
          if not annual_selected:
              raise RuntimeError("未找到任何正式年度报告。")
          if not latest_quarter:
              raise RuntimeError("未找到正式季度报告。")

          print("SELECTED DOCUMENTS")
          for x in selected:
              print(json.dumps({k: x.get(k) for k in ("doc_type", "report_year", "quarter", "announcement_date", "title", "source_url")}, ensure_ascii=False))

          def safe_filename(name: str) -> str:
              name = re.sub(r"[\\/:*?\"<>|]", "_", name)
              return re.sub(r"_+", "_", name).strip("_. ")

          def download_pdf(item: dict[str, Any], dest: Path) -> None:
              url = item["source_url"]
              headers = {
                  "Referer": "https://www.cninfo.com.cn/",
                  "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.8",
              }
              r = S.get(url, headers=headers, timeout=180)
              print("DOWNLOAD", r.status_code, len(r.content), url)
              r.raise_for_status()
              if len(r.content) < 80_000 or not r.content.startswith(b"%PDF"):
                  raise RuntimeError(f"下载内容不是完整PDF: {url}; size={len(r.content)} head={r.content[:20]!r}")
              dest.write_bytes(r.content)

          records = []
          for item in selected:
              dtype = item["doc_type"]
              if dtype == "prospectus":
                  year = item["announcement_date"][:4] or "2023"
                  filename = f"{year}_{COMPANY}_首次公开发行股票并在创业板上市招股说明书.pdf"
                  dest = ROOT / "00_招股说明书" / filename
                  period = "IPO"
              elif dtype == "annual_report":
                  year = int(item["report_year"])
                  suffix = ""
                  if any(k in item["title"] for k in ("修订", "更新", "更正后", "补充后")):
                      suffix = "_修订或更新版"
                  filename = f"{year}_{COMPANY}_{year}年年度报告{suffix}.pdf"
                  dest = ROOT / "01_年度报告" / filename
                  period = str(year)
              else:
                  year = int(item["report_year"])
                  quarter = int(item["quarter"])
                  qcn = "第一季度" if quarter == 1 else "第三季度"
                  filename = f"{year}Q{quarter}_{COMPANY}_{year}年{qcn}报告.pdf"
                  dest = ROOT / "02_最新季度报告" / filename
                  period = f"{year}Q{quarter}"

              filename = safe_filename(filename)
              dest = dest.with_name(filename)
              download_pdf(item, dest)

              # Structural validation with two independent readers plus first/last-page rendering.
              reader = PdfReader(str(dest), strict=False)
              page_count = len(reader.pages)
              if page_count < 2:
                  raise RuntimeError(f"PDF页数异常: {dest} -> {page_count}")
              if reader.is_encrypted:
                  try:
                      reader.decrypt("")
                  except Exception as exc:
                      raise RuntimeError(f"PDF加密且无法打开: {dest}: {exc}")

              doc = fitz.open(dest)
              if doc.page_count != page_count:
                  raise RuntimeError(f"PDF解析器页数不一致: {dest}: pypdf={page_count}, fitz={doc.page_count}")
              first_pix = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_pix = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if first_pix.width < 100 or first_pix.height < 100 or last_pix.width < 100 or last_pix.height < 100:
                  raise RuntimeError(f"PDF页面渲染异常: {dest}")
              preview_path = ROOT / "首页预览" / (dest.stem + ".png")
              first_pix.save(preview_path)

              text_probe = ""
              for p in range(min(5, doc.page_count)):
                  try:
                      text_probe += doc.load_page(p).get_text("text")
                  except Exception:
                      pass
              doc.close()
              if COMPANY not in text_probe and FULL_COMPANY not in text_probe and CODE not in text_probe:
                  print("WARNING: first five pages did not yield company/code text:", dest)

              digest = hashlib.sha256(dest.read_bytes()).hexdigest()
              record = {
                  "document_type": dtype,
                  "period": period,
                  "announcement_title": item["title"],
                  "announcement_date": item["announcement_date"],
                  "source_url": item["source_url"],
                  "relative_path": str(dest.relative_to(ROOT)).replace(os.sep, "/"),
                  "file_name": dest.name,
                  "file_size_bytes": dest.stat().st_size,
                  "page_count": page_count,
                  "sha256": digest,
                  "pdf_header_valid": True,
                  "first_page_rendered": True,
                  "last_page_rendered": True,
              }
              records.append(record)
              print("VERIFIED", json.dumps(record, ensure_ascii=False))

          # Ensure annual years are contiguous from first listed-year report through 2025.
          annual_years = sorted(int(r["period"]) for r in records if r["document_type"] == "annual_report")
          expected = list(range(min(annual_years), max(annual_years) + 1))
          if annual_years != expected:
              raise RuntimeError(f"年度报告年份不连续: actual={annual_years}, expected={expected}")

          manifest = {
              "company": COMPANY,
              "full_company_name": FULL_COMPANY,
              "stock_code": CODE,
              "market": "深圳证券交易所创业板",
              "cutoff_date": CUTOFF,
              "selection_policy": {
                  "annual_reports": "收录上市以来全部正式年度报告全文；排除摘要、审计报告单行文件及更正提示公告；同一年度优先后续修订/更新全文。",
                  "prospectus": "仅收录最终正式发布的首次公开发行股票并在创业板上市招股说明书；排除申报稿、注册稿、上会稿、摘要及提示性公告。",
                  "latest_quarterly_report": "在第一季度报告和第三季度报告中按报告期选择截至截止日最新一期；不把半年度报告误标为季度报告。",
              },
              "annual_report_years": annual_years,
              "latest_quarter": latest_quarter and f"{latest_quarter['report_year']}Q{latest_quarter['quarter']}",
              "documents": records,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")

          checksum_lines = [f"{r['sha256']}  {r['relative_path']}" for r in records]
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")

          readme_lines = [
              f"# {COMPANY}（{CODE}）官方披露文件包",
              "",
              f"- 截止日期：{CUTOFF}",
              "- 来源：巨潮资讯网（中国证监会指定信息披露网站）官方原始 PDF。",
              "- PDF 均保持原始文件内容，未合并、改写或重新排版。",
              "- 已排除年度报告摘要、招股说明书申报稿/注册稿/上会稿、提示性公告及重复文件。",
              "- 已完成 PDF 文件头、双解析器页数、首末页渲染、SHA-256 与 ZIP CRC 校验。",
              "",
              "## 文件清单",
              "",
          ]
          for i, r in enumerate(records, 1):
              readme_lines += [
                  f"{i}. `{r['relative_path']}`",
                  f"   - 披露标题：{r['announcement_title']}",
                  f"   - 披露日期：{r['announcement_date']}",
                  f"   - 页数：{r['page_count']}；文件大小：{r['file_size_bytes']:,} 字节",
                  f"   - 官方来源：{r['source_url']}",
                  f"   - SHA-256：`{r['sha256']}`",
              ]
          readme_lines += [
              "",
              "## 目录说明",
              "",
              "- `00_招股说明书`：最终正式版 IPO 招股说明书。",
              "- `01_年度报告`：上市以来全部年度报告全文。",
              "- `02_最新季度报告`：截至截止日最新已披露的第一或第三季度报告。",
              "- `首页预览`：仅用于人工核验封面，不替代原 PDF。",
              "- `manifest.json`、`SHA256SUMS.txt`：来源与完整性校验信息。",
          ]
          (ROOT / "README.md").write_text("\n".join(readme_lines) + "\n", encoding="utf-8")

          final_cn = DIST / f"{ROOT_NAME}.zip"
          final_ascii = DIST / f"ampelon_301413_all_annual_reports_prospectus_latest_quarter_{CUTOFF_COMPACT}.zip"
          for path in (final_cn, final_ascii):
              if path.exists():
                  path.unlink()

          with zipfile.ZipFile(final_cn, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      arc = str(path.relative_to(ROOT.parent)).replace(os.sep, "/")
                      zf.write(path, arc)
          shutil.copy2(final_cn, final_ascii)

          for path in (final_cn, final_ascii):
              with zipfile.ZipFile(path, "r") as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise RuntimeError(f"ZIP CRC校验失败: {path}: {bad}")
                  names = zf.namelist()
                  pdfs = [n for n in names if n.lower().endswith(".pdf")]
                  if len(pdfs) != len(records):
                      raise RuntimeError(f"ZIP内PDF数量不一致: {path}: {len(pdfs)} vs {len(records)}")
              print("ZIP VERIFIED", path, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())

          print("FINAL_JSON", json.dumps({
              "root_name": ROOT_NAME,
              "annual_years": annual_years,
              "latest_quarter": manifest["latest_quarter"],
              "document_count": len(records),
              "chinese_zip": str(final_cn),
              "ascii_zip": str(final_ascii),
              "chinese_zip_size": final_cn.stat().st_size,
              "chinese_zip_sha256": hashlib.sha256(final_cn.read_bytes()).hexdigest(),
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ampelon-301413-official-filings-20261020
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
