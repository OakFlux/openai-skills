name: Package Ampelon 301413 official filings

on:
  push:
    paths:
      - '.github/workflows/ampelon-301413-official-filings-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Discover, download, verify and package official PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import re
          import shutil
          import time
          import zipfile
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from typing import Any

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE = '301413'
          COMPANY = '安培龙'
          FULL_COMPANY = '深圳安培龙科技股份有限公司'
          ORG_ID = '9900047312'
          CUTOFF = '2026-10-20'
          CUTOFF_COMPACT = '20261020'
          API = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
          STATIC = 'https://static.cninfo.com.cn/'
          ROOT_NAME = f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          DIST = Path('dist')
          for d in ('00_招股说明书', '01_年度报告', '02_最新季度报告', '首页预览'):
              (ROOT / d).mkdir(parents=True, exist_ok=True)
          DIST.mkdir(parents=True, exist_ok=True)

          def make_session() -> requests.Session:
              s = requests.Session()
              retry = Retry(
                  total=5, connect=5, read=5, status=5, backoff_factor=1.0,
                  status_forcelist=(403, 408, 429, 500, 502, 503, 504),
                  allowed_methods=frozenset({'GET', 'POST'}), raise_on_status=False,
              )
              s.mount('https://', HTTPAdapter(max_retries=retry))
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
                  'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                  'Origin': 'https://www.cninfo.com.cn',
                  'Referer': f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={CODE}',
                  'X-Requested-With': 'XMLHttpRequest',
              })
              return s

          S = make_session()

          def clean_title(value: str) -> str:
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', '', value)
              value = value.replace('\u3000', ' ').replace(' ', ' ')
              return re.sub(r'\s+', '', value).strip()

          def query(label: str, searchkey: str = '', category: str = '', date_range: str = '') -> list[dict[str, Any]]:
              payload = {
                  'pageNum': 1,
                  'pageSize': 30,
                  'column': 'szse',
                  'tabName': 'fulltext',
                  'plate': 'sz',
                  'stock': f'{CODE},{ORG_ID}',
                  'searchkey': searchkey,
                  'secid': '',
                  'category': category,
                  'trade': '',
                  'seDate': date_range,
                  'sortName': '',
                  'sortType': '',
                  'isHLtitle': 'true',
              }
              r = S.post(API, data=payload, timeout=90)
              print('QUERY', label, r.status_code, len(r.content), payload)
              r.raise_for_status()
              data = r.json()
              rows = data.get('announcements') or []
              print('RESULT', label, 'count=', len(rows), 'total=', data.get('totalAnnouncement'), 'pages=', data.get('totalpages'))
              for row in rows:
                  print('TITLE', label, clean_title(str(row.get('announcementTitle') or '')), row.get('adjunctUrl'))
              return rows

          rows: list[dict[str, Any]] = []
          tasks = [
              ('listing_window', '', '', '2023-12-08~2023-12-20'),
              ('prospectus_exact', '首次公开发行股票并在创业板上市招股说明书', '', '2023-01-01~2024-01-31'),
              ('prospectus_general', '招股说明书', '', '2023-01-01~2024-01-31'),
              ('annual_category', '', 'category_ndbg_szsh', '2024-01-01~2026-10-20'),
              ('annual_2023', '2023年年度报告', '', '2024-04-01~2024-05-31'),
              ('annual_2024', '2024年年度报告', '', '2025-04-01~2025-05-31'),
              ('annual_2025', '2025年年度报告', '', '2026-04-01~2026-05-31'),
              ('q1_category', '', 'category_yjdbg_szsh', '2024-01-01~2026-10-20'),
              ('q3_category', '', 'category_sjdbg_szsh', '2024-01-01~2026-10-20'),
              ('q1_search', '第一季度报告', '', '2024-01-01~2026-10-20'),
              ('q3_search', '第三季度报告', '', '2024-01-01~2026-10-20'),
          ]
          for args in tasks:
              try:
                  rows.extend(query(*args))
              except Exception as exc:
                  print('QUERY_ERROR', args[0], repr(exc))
              time.sleep(0.3)

          normalized: list[dict[str, Any]] = []
          seen = set()
          for row in rows:
              path = str(row.get('adjunctUrl') or '').lstrip('/')
              title = clean_title(str(row.get('announcementTitle') or ''))
              if not path or not title:
                  continue
              key = (title, path)
              if key in seen:
                  continue
              seen.add(key)
              ts = int(row.get('announcementTime') or 0)
              date = datetime.fromtimestamp(ts / 1000, tz=timezone(timedelta(hours=8))).strftime('%Y-%m-%d') if ts else ''
              normalized.append({
                  'title': title,
                  'url_path': path,
                  'source_url': STATIC + path,
                  'announcement_time': ts,
                  'announcement_date': date,
              })

          print('UNIQUE_CANDIDATES', len(normalized))
          for x in sorted(normalized, key=lambda z: z['announcement_time'], reverse=True):
              print('CANDIDATE', x['announcement_date'], x['title'], x['url_path'])

          annual_by_year: dict[int, list[dict[str, Any]]] = {}
          for x in normalized:
              m = re.search(r'(20\d{2})年年度报告', x['title'])
              if not m:
                  continue
              if any(k in x['title'] for k in ('摘要', '更正公告', '提示性公告', '审计报告', '审核报告', '问询函', '说明')):
                  continue
              annual_by_year.setdefault(int(m.group(1)), []).append(x)

          def annual_rank(x: dict[str, Any]) -> tuple[int, int, int]:
              t = x['title']
              revision = 2 if any(k in t for k in ('修订', '更新', '更正后', '补充后')) else 1
              exact = 2 if re.fullmatch(r'20\d{2}年年度报告(?:（[^）]+）)?', t) else 1
              return revision, exact, int(x['announcement_time'])

          annual_selected: list[dict[str, Any]] = []
          for year in (2023, 2024, 2025):
              candidates = annual_by_year.get(year) or []
              if not candidates:
                  raise RuntimeError(f'未找到{year}年年度报告全文。')
              item = dict(max(candidates, key=annual_rank))
              item.update(doc_type='annual_report', report_year=year)
              annual_selected.append(item)

          prospectus_candidates: list[dict[str, Any]] = []
          for x in normalized:
              t = x['title']
              if '首次公开发行股票' not in t or '招股说明书' not in t:
                  continue
              if any(k in t for k in ('摘要', '申报稿', '注册稿', '上会稿', '预披露', '问询', '回复', '提示性公告', '法律意见', '保荐书')):
                  continue
              prospectus_candidates.append(x)
          if not prospectus_candidates:
              raise RuntimeError('未找到最终正式版IPO招股说明书。')
          prospectus = dict(max(prospectus_candidates, key=lambda x: int(x['announcement_time'])))
          prospectus['doc_type'] = 'prospectus'

          quarter_candidates: list[dict[str, Any]] = []
          for x in normalized:
              t = x['title']
              m = re.search(r'(20\d{2})年(第一|第三|一|三)季度报告', t)
              if not m or any(k in t for k in ('摘要', '更正公告', '提示性公告', '问询', '说明')):
                  continue
              q = 3 if m.group(2) in ('第三', '三') else 1
              item = dict(x)
              item.update(doc_type='quarterly_report', report_year=int(m.group(1)), quarter=q)
              quarter_candidates.append(item)
          if not quarter_candidates:
              raise RuntimeError('未找到正式第一季度或第三季度报告。')
          latest_quarter = max(quarter_candidates, key=lambda x: (x['report_year'], x['quarter'], int(x['announcement_time'])))

          selected = [prospectus, *annual_selected, latest_quarter]
          print('SELECTED')
          for item in selected:
              print(json.dumps(item, ensure_ascii=False))

          def safe_name(name: str) -> str:
              return re.sub(r'_+', '_', re.sub(r'[\\/:*?"<>|]', '_', name)).strip('_. ')

          def download(item: dict[str, Any], dest: Path) -> None:
              r = S.get(item['source_url'], headers={
                  'Referer': 'https://www.cninfo.com.cn/',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              }, timeout=180)
              print('DOWNLOAD', r.status_code, len(r.content), item['source_url'])
              r.raise_for_status()
              if len(r.content) < 50_000 or not r.content.startswith(b'%PDF'):
                  raise RuntimeError(f"下载内容不是完整PDF: {item['source_url']} size={len(r.content)} head={r.content[:20]!r}")
              dest.write_bytes(r.content)

          records: list[dict[str, Any]] = []
          for item in selected:
              if item['doc_type'] == 'prospectus':
                  filename = '2023_安培龙_首次公开发行股票并在创业板上市招股说明书.pdf'
                  dest = ROOT / '00_招股说明书' / filename
                  period = 'IPO'
              elif item['doc_type'] == 'annual_report':
                  year = int(item['report_year'])
                  suffix = '_修订或更新版' if any(k in item['title'] for k in ('修订', '更新', '更正后', '补充后')) else ''
                  filename = f'{year}_安培龙_{year}年年度报告{suffix}.pdf'
                  dest = ROOT / '01_年度报告' / filename
                  period = str(year)
              else:
                  year = int(item['report_year'])
                  q = int(item['quarter'])
                  qcn = '第一季度' if q == 1 else '第三季度'
                  filename = f'{year}Q{q}_安培龙_{year}年{qcn}报告.pdf'
                  dest = ROOT / '02_最新季度报告' / filename
                  period = f'{year}Q{q}'
              dest = dest.with_name(safe_name(dest.name))
              download(item, dest)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < 2:
                  raise RuntimeError(f'PDF页数异常: {dest} -> {pages}')
              doc = fitz.open(dest)
              if doc.page_count != pages:
                  raise RuntimeError(f'解析器页数不一致: {dest}: {pages} vs {doc.page_count}')
              first = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.4, 1.4), alpha=False)
              last = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 100:
                  raise RuntimeError(f'PDF页面渲染异常: {dest}')
              first.save(ROOT / '首页预览' / f'{dest.stem}.png')
              doc.close()

              record = {
                  'document_type': item['doc_type'],
                  'period': period,
                  'announcement_title': item['title'],
                  'announcement_date': item['announcement_date'],
                  'source_url': item['source_url'],
                  'relative_path': str(dest.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': dest.name,
                  'file_size_bytes': dest.stat().st_size,
                  'page_count': pages,
                  'sha256': hashlib.sha256(dest.read_bytes()).hexdigest(),
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          annual_years = sorted(int(r['period']) for r in records if r['document_type'] == 'annual_report')
          if annual_years != [2023, 2024, 2025]:
              raise RuntimeError(f'年度报告年份不完整: {annual_years}')

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'market': '深圳证券交易所创业板',
              'cutoff_date': CUTOFF,
              'annual_report_years': annual_years,
              'latest_quarter': f"{latest_quarter['report_year']}Q{latest_quarter['quarter']}",
              'document_count': len(records),
              'documents': records,
              'selection_policy': {
                  'annual_reports': '收录上市以来全部正式年度报告全文，排除摘要、提示性公告和单独审计文件。',
                  'prospectus': '收录最终正式IPO招股说明书，排除申报稿、注册稿、上会稿和摘要。',
                  'latest_quarterly_report': '在第一季度报告与第三季度报告中按报告期选择截至截止日最新一期。',
              },
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records) + '\n', encoding='utf-8')

          readme = [
              f'# {COMPANY}（{CODE}）官方披露文件包', '',
              f'- 截止日期：{CUTOFF}',
              '- 来源：巨潮资讯网官方原始 PDF。',
              '- 收录：最终正式版IPO招股说明书、上市以来全部年度报告全文、截至截止日最新季度报告。',
              '- 排除：年报摘要、招股说明书申报稿/注册稿/上会稿、提示性公告及重复文件。',
              '- 校验：PDF文件头、双解析器页数、首末页渲染、SHA-256、ZIP CRC。', '',
              '## 文件清单', '',
          ]
          for i, r in enumerate(records, 1):
              readme.extend([
                  f"{i}. `{r['relative_path']}`",
                  f"   - 披露标题：{r['announcement_title']}",
                  f"   - 披露日期：{r['announcement_date']}",
                  f"   - 页数：{r['page_count']}；大小：{r['file_size_bytes']:,} 字节",
                  f"   - 官方来源：{r['source_url']}",
                  f"   - SHA-256：`{r['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          final_cn = DIST / f'{ROOT_NAME}.zip'
          final_ascii = DIST / f'ampelon_301413_all_annual_reports_prospectus_latest_quarter_{CUTOFF_COMPACT}.zip'
          for p in (final_cn, final_ascii):
              if p.exists():
                  p.unlink()
          with zipfile.ZipFile(final_cn, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      zf.write(p, str(p.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(final_cn, final_ascii)
          for p in (final_cn, final_ascii):
              with zipfile.ZipFile(p) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC校验失败: {bad}')
                  pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if len(pdfs) != len(records):
                      raise RuntimeError(f'ZIP内PDF数量不一致: {len(pdfs)} vs {len(records)}')
              print('ZIP_VERIFIED', p, p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())

          print('FINAL_JSON', json.dumps({
              'annual_years': annual_years,
              'latest_quarter': manifest['latest_quarter'],
              'document_count': len(records),
              'chinese_zip': str(final_cn),
              'chinese_zip_size': final_cn.stat().st_size,
              'chinese_zip_sha256': hashlib.sha256(final_cn.read_bytes()).hexdigest(),
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ampelon-301413-official-filings-20261020
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
