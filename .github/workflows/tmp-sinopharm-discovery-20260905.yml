name: Discover public Sinopharm report sources

on:
  push:
    branches:
      - tmp-sinopharm-reports-20260905

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public report pages and assets
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/discover.py <<'PY'
          import json, re, time
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = [
            'https://www.fxbaogao.com/detail/5177796',
            'https://www.fxbaogao.com/detail/5080292',
            'https://www.fxbaogao.com/detail/4294178',
            'https://www.sdyanbao.com/detail/938808',
            'https://www.nxny.com/report/view_6167870.html',
            'https://wap.hibor.com.cn/repinfodetail_5022937.html',
            'https://www.firstshanghai.com.hk/zh-hans/research',
            'https://www.mystockhk.com/ResearchReport.aspx',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          def get(url, **kw):
              last=None
              for i in range(4):
                  try:
                      r=s.get(url,timeout=(15,60),allow_redirects=True,**kw)
                      return r
                  except Exception as e:
                      last=e; time.sleep(2*(i+1))
              raise last
          for u in urls:
              print('\n===URL===',u)
              try:
                  r=get(u)
                  print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
                  txt=r.text
                  print('HEAD',txt[:500].replace('\n',' ')[:500])
                  soup=BeautifulSoup(txt,'html.parser')
                  links=[]
                  for tag in soup.find_all(['a','img','script','iframe','source']):
                      for a in ['href','src','data-src','data-url','data-file','download']:
                          v=tag.get(a)
                          if v:
                              vv=urljoin(r.url,v)
                              if any(k in vv.lower() for k in ['pdf','download','report-image','attachment','file','view?id','api']):
                                  links.append(vv)
                  for x in list(dict.fromkeys(links))[:100]: print('LINK',x)
                  for pat in [r'https?://[^\"\'<> ]+\.pdf[^\"\'<> ]*', r'https?://[^\"\'<> ]+report-image[^\"\'<> ]+', r'[^\"\']*(?:download|pdf|file)[^\"\']*']:
                      ms=re.findall(pat,txt,re.I)
                      for x in list(dict.fromkeys(ms))[:50]: print('MATCH',x[:500])
              except Exception as e:
                  print('ERROR',repr(e))

          # Probe FX public images for selected report IDs. This checks only unauthenticated public assets.
          probes=[
            ('5177796','2025/12/05',range(1,29)),
            ('5080292','2025/09/29',range(1,10)),
            ('4294178','2024/05/02',range(1,12)),
          ]
          for rid,date,pages in probes:
              print('\n===PROBE FX===',rid,date)
              misses=0
              for i in pages:
                  u=f'https://public.fxbaogao.com/report-image/{date}/{rid}-{i}.png?x-oss-process=image/format,webp'
                  try:
                      r=get(u,headers={'Referer':f'https://www.fxbaogao.com/detail/{rid}'})
                      print('PAGE',i,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'FINAL',r.url)
                      if r.status_code!=200 or len(r.content)<1000: misses+=1
                  except Exception as e:
                      print('PAGE',i,'ERROR',repr(e)); misses+=1
                  if misses>=3: break
          PY
          python /tmp/discover.py
