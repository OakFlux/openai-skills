name: Scan CNINFO Deep Sanda annual reports
on:
  push:
    paths: ['.github/workflows/shensangda-000032-cninfo-annual-scan-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.cninfo.com.cn/new/commonUrl?url=disclosure/list/notice','X-Requested-With':'XMLHttpRequest'})
          u='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          all=[]
          for p in range(1,20):
              data={'pageNum':str(p),'pageSize':'30','column':'szse','tabName':'fulltext','plate':'sz','stock':'000032,gssz0000032','searchkey':'','secid':'','category':'category_ndbg_szsh','trade':'','seDate':'1990-01-01~2007-12-31','sortName':'','sortType':'','isHLtitle':'true'}
              r=s.post(u,data=data,timeout=90); print('PAGE',p,'STATUS',r.status_code,'BYTES',len(r.content)); r.raise_for_status()
              j=r.json(); rows=j.get('announcements') or []; all+=rows
              if not j.get('hasMore'): break
          print('COUNT',len(all))
          for x in all:
              print(x.get('announcementTime'),'|',x.get('announcementTitle'),'|',x.get('adjunctUrl'),'|',x.get('announcementId'))
          open('cninfo.json','w',encoding='utf-8').write(json.dumps(all,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shensangda-cninfo-scan
          path: cninfo.json
