name: Fast exact-date probe Jiangshun reports 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jiangshun-exact-date-report-probe-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet requests
      - name: Probe exact dates
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          dates=['2025-04-13','2025-09-02','2025-09-22','2025-09-23','2026-06-22','2026-06-23','2026-08-28','2026-08-29','2026-09-02','2026-10-18','2026-10-21']
          terms=['江顺科技','铝型材挤压模具','3D打印','海外市场星辰大海','主业筑牢基本盘','新兴领域打开第二曲线','国内铝型材领军企业']
          found=[]
          for d in dates:
            for qtype in ['0','1','2']:
              p={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':d,'endTime':d,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              try:
                r=s.get(api,params=p,timeout=(15,90));o=r.json();rows=o.get('data') or []
                if isinstance(rows,dict):rows=rows.get('list') or rows.get('data') or []
                print('DATE',d,'QTYPE',qtype,'STATUS',r.status_code,'HITS',o.get('hits'),'ROWS',len(rows),'TOTAL',o.get('TotalPage'))
                for row in rows:
                  title=str(row.get('title') or '');code=str(row.get('stockCode') or '');name=str(row.get('stockName') or '')
                  if code=='001400' or '江顺科技' in name or any(t in title for t in terms):
                    item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','author','emRatingName','sRatingName','stockCode','stockName','industryName']}
                    print('MATCH',json.dumps(item,ensure_ascii=False));found.append(item)
              except Exception as e:print('ERR',d,qtype,repr(e))
          print('FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          PY
