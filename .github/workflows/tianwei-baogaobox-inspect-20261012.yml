name: Inspect Tianwei Electronics Baogaobox report assets 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-baogaobox-inspect-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4 requests
      - name: Inspect report page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          url='https://www.baogaobox.com/reports/240622000020971.html'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(url,timeout=(20,90),allow_redirects=True)
          r.raise_for_status()
          text=r.text
          Path('out/page.html').write_text(text,encoding='utf-8')
          soup=BeautifulSoup(text,'html.parser')
          links=[]
          for tag in soup.find_all(True):
            for attr in ('href','src','data-src','data-original','data-url','content'):
              v=tag.get(attr)
              if isinstance(v,str) and v.strip():
                links.append({'tag':tag.name,'attr':attr,'raw':v,'absolute':urljoin(r.url,v)})
          regex_urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',text)))
          interesting=[x for x in links if any(k in (x['raw']+' '+x['absolute']).lower() for k in ['pdf','download','file','report','20971','240622','img','webp','png','jpg','api'])]
          scripts=[]
          for tag in soup.find_all('script'):
            scripts.append({'src':tag.get('src'),'text':(tag.string or tag.get_text() or '')[:200000]})
          data={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'headers':dict(r.headers),'interesting_links':interesting,'regex_urls':regex_urls,'scripts':scripts}
          Path('out/inspection.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url)
          print('INTERESTING')
          for x in interesting: print(json.dumps(x,ensure_ascii=False))
          print('REGEX URLS')
          for x in regex_urls: print(x)
          print('TEXT MATCHES')
          for pat in ['20971','240622000020971','pdf','download','zy.baogaobox.com','api']:
            print('\nPATTERN',pat)
            for m in re.finditer(pat,text,re.I):
              a=max(0,m.start()-300); b=min(len(text),m.end()+500)
              print(text[a:b].replace('\n',' ')[:1000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianwei-baogaobox-inspection
          path: out
          retention-days: 7
          if-no-files-found: error
