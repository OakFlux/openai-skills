name: Inspect sdyanbao Wynn Macau download implementation

on:
  push:
    branches:
      - chatgpt-temp-wynn-sdy-fast-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch page and bundles
        shell: bash
        run: |
          cat > /tmp/x.py <<'PY'
          import re, urllib.parse, requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for did in ['888721','856304']:
              u=f'https://www.sdyanbao.com/detail/{did}'
              r=s.get(u,timeout=30)
              print('PAGE',did,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
              print('COOKIES',s.cookies.get_dict(),flush=True)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for tag in soup.find_all(True):
                  attrs={k:(' '.join(v) if isinstance(v,list) else str(v)) for k,v in tag.attrs.items()}
                  txt=' '.join(tag.get_text(' ',strip=True).split())[:300]
                  blob=(txt+' '+str(attrs)).lower()
                  if any(k in blob for k in ['立即下载','download','pdf','fileurl','file_url','reporturl','report_url']):
                      print('DOM',did,tag.name,repr(txt),attrs,flush=True)
              for sc in soup.find_all('script'):
                  if sc.get('src'):
                      jsu=urllib.parse.urljoin(r.url,sc['src'])
                      jr=s.get(jsu,timeout=30)
                      print('SCRIPT',did,jr.status_code,len(jr.content),jsu,flush=True)
                      body=jr.text
                  else:
                      body=sc.get_text() or ''
                  if not body: continue
                  for m in re.finditer(r'(?i)(download|fileurl|file_url|reporturl|report_url|pdf|/api/)',body):
                      a=max(0,m.start()-350); b=min(len(body),m.start()+1000)
                      print('HIT',did,repr(body[a:b]),flush=True)
                  urls=re.findall(r'https?:(?:\\/\\/|//)[^\"\'<>\s]+',body)
                  for x in urls:
                      x=x.replace('\\/','/')
                      if any(k in x.lower() for k in ['download','pdf','file','report']): print('URL',did,x,flush=True)
          PY
          python /tmp/x.py
