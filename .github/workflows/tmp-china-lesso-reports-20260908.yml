name: Build China Lesso 2020-2025 annual reports archive
on:
  push:
    branches:
      - tmp-china-lesso-reports-20260908
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf pymupdf pillow
      - name: Download, verify and package official reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/reports work/renders
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import re
          import shutil
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import pymupdf
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('output')
          REPORT_DIR = Path('work/reports')
          RENDER_DIR = Path('work/renders')
          OUT.mkdir(parents=True, exist_ok=True)
          REPORT_DIR.mkdir(parents=True, exist_ok=True)
          RENDER_DIR.mkdir(parents=True, exist_ok=True)

          retry = Retry(
              total=7,
              connect=7,
              read=7,
              status=7,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=frozenset(['GET']),
          )
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7',
          })

          annuals = [
              {
                  'year': 2020,
                  'url': 'https://en.lesso.com/upfile/2021/04/2021042600226%20Annual%20Report%202020.pdf',
              },
              {
                  'year': 2021,
                  'url': 'https://en.lesso.com/upfile/2022/06/2022042500493.pdf',
              },
              {
                  'year': 2022,
                  'url': 'https://en.lesso.com/upfile/2023/04/2023041800323%20Annual%20Report%202022.pdf',
              },
              {
                  'year': 2023,
                  'url': 'https://en.lesso.com/upfile/corporate_regulation/Annual%20Report%202023-2024042900651.pdf',
              },
              {
                  'year': 2024,
                  'url': 'https://en.lesso.com/uploads/20250429/712d4a7ffa2ae7ba0b67911ddac04c2c.pdf',
              },
              {
                  'year': 2025,
                  'url': 'https://en.lesso.com/uploads/20260430/8ffc80639445d463c25f346c73decb61.pdf',
              },
          ]

          def norm(text: str) -> str:
              return re.sub(r'\s+', ' ', text or '').strip()

          def locate_2026_interim_results() -> str:
              targets = [
                  'https://en.lesso.com/investor-relations.html?search_year=2026',
                  'https://en.lesso.com/investor-relations.html',
                  'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=49040',
                  'https://treelazy.com/stock-en/hk/02128/conference',
              ]
              exact = 'INTERIM RESULTS ANNOUNCEMENT FOR THE SIX MONTHS ENDED 30 JUNE 2026'
              candidates = []
              audit = []
              for page_url in targets:
                  try:
                      response = session.get(page_url, timeout=(30, 180), allow_redirects=True)
                      audit.append({'url': page_url, 'status': response.status_code, 'bytes': len(response.content)})
                      response.raise_for_status()
                      soup = BeautifulSoup(response.text, 'lxml')
                      for anchor in soup.find_all('a', href=True):
                          label = norm(anchor.get_text(' ', strip=True)).upper()
                          href = urljoin(response.url, anchor.get('href'))
                          hay = f'{label} {href}'.upper()
                          if exact in label or (
                              'INTERIM RESULTS' in hay
                              and '30 JUNE 2026' in hay
                              and href.lower().endswith('.pdf')
                          ):
                              candidates.append({'url': href, 'label': label, 'source': page_url})
                  except Exception as exc:
                      audit.append({'url': page_url, 'error': repr(exc)})
              (OUT / 'latest_link_search_audit.json').write_text(
                  json.dumps({'audit': audit, 'candidates': candidates}, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )
              for candidate in candidates:
                  url = candidate['url']
                  if 'hkexnews.hk' in url and url.lower().endswith('.pdf'):
                      return url
              for candidate in candidates:
                  if candidate['url'].lower().endswith('.pdf'):
                      return candidate['url']
              raise RuntimeError(f'Could not locate the official 2026 interim-results PDF. Candidates: {candidates}')

          latest_2026_url = locate_2026_interim_results()
          reports = []
          for annual in annuals:
              reports.append({
                  'kind': 'Annual Report',
                  'year': annual['year'],
                  'filename': f'China_Lesso_{annual["year"]}_Annual_Report.pdf',
                  'url': annual['url'],
                  'expected_tokens': ['CHINA LESSO', str(annual['year'])],
              })
          reports.extend([
              {
                  'kind': 'Latest Group Financial Disclosure',
                  'year': 2026,
                  'filename': 'China_Lesso_2026_Interim_Results_Announcement.pdf',
                  'url': latest_2026_url,
                  'expected_tokens': ['CHINA LESSO', 'INTERIM RESULTS', '2026'],
              },
              {
                  'kind': 'Latest Complete Interim Report Supplement',
                  'year': 2025,
                  'filename': 'China_Lesso_2025_Interim_Report_Supplement.pdf',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0929/2025092901326.pdf',
                  'expected_tokens': ['CHINA LESSO', 'INTERIM REPORT', '2025'],
              },
          ])

          manifest = []
          first_page_files = []

          def download_and_verify(spec: dict, seq: int) -> None:
              url = spec['url']
              path = REPORT_DIR / spec['filename']
              last_error = None
              for attempt in range(1, 8):
                  try:
                      response = session.get(
                          url,
                          headers={
                              'Accept': 'application/pdf,*/*;q=0.8',
                              'Referer': 'https://en.lesso.com/',
                          },
                          timeout=(30, 300),
                          allow_redirects=True,
                      )
                      print('DOWNLOAD', seq, attempt, response.status_code, len(response.content), response.url, flush=True)
                      response.raise_for_status()
                      data = response.content
                      if b'%PDF-' not in data[:2048] or len(data) < 40_000:
                          raise RuntimeError(f'Invalid PDF payload: {len(data)} bytes')
                      reader = PdfReader(io.BytesIO(data), strict=False)
                      pages = len(reader.pages)
                      if pages < 3:
                          raise RuntimeError(f'Unexpectedly short PDF: {pages} pages')
                      sample_parts = []
                      for page in reader.pages[:8]:
                          try:
                              sample_parts.append(page.extract_text() or '')
                          except Exception:
                              pass
                      sample = norm('\n'.join(sample_parts)).upper()
                      for token in spec['expected_tokens']:
                          if token.upper() not in sample:
                              raise RuntimeError(f'Identity token not found in first pages: {token!r}')
                      path.write_bytes(data)

                      doc = pymupdf.open(path)
                      pix = doc[0].get_pixmap(matrix=pymupdf.Matrix(1.15, 1.15), alpha=False)
                      render_path = RENDER_DIR / f'{seq:02d}_{path.stem}.png'
                      pix.save(str(render_path))
                      doc.close()
                      first_page_files.append(str(render_path))

                      manifest.append({
                          'No.': seq,
                          'File name': path.name,
                          'Report type': spec['kind'],
                          'Report year': spec['year'],
                          'PDF pages': pages,
                          'File size (bytes)': len(data),
                          'SHA-256': hashlib.sha256(data).hexdigest(),
                          'Official source': response.url,
                      })
                      print('VERIFIED', path.name, pages, len(data), flush=True)
                      return
                  except Exception as exc:
                      last_error = exc
                      print('RETRY', seq, attempt, repr(exc), flush=True)
                      time.sleep(min(2 ** attempt, 20))
              raise RuntimeError(f'Failed to download/verify {spec["filename"]}: {last_error!r}')

          for sequence, spec in enumerate(reports, 1):
              download_and_verify(spec, sequence)

          if len(manifest) != 8:
              raise RuntimeError(f'Expected 8 PDFs, verified {len(manifest)}')
          annual_years = sorted(int(row['Report year']) for row in manifest if row['Report type'] == 'Annual Report')
          if annual_years != [2020, 2021, 2022, 2023, 2024, 2025]:
              raise RuntimeError(f'Annual report coverage mismatch: {annual_years}')

          manifest_csv = REPORT_DIR / 'File_Manifest_and_SHA256.csv'
          with manifest_csv.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest[0].keys()))
              writer.writeheader()
              writer.writerows(manifest)

          readme = REPORT_DIR / 'README.txt'
          lines = [
              'China Lesso Group Holdings Limited (02128.HK)',
              '2020-2025 Annual Reports and Latest Periodic Financial Disclosure',
              'Package date: 2026-09-08',
              '',
              'Contents:',
              '1. Complete annual reports for financial years 2020 through 2025 (six PDFs).',
              '2. Interim Results Announcement for the six months ended 30 June 2026, released on 28 August 2026.',
              '3. Interim Report 2025 as the latest complete interim-report supplement, because the full 2026 interim report had not yet been posted when this package was prepared.',
              '',
              'China Lesso is listed in Hong Kong and does not ordinarily publish standalone Q1/Q3 group reports. The latest group-level interim disclosure is used instead of an A-share-style quarterly report.',
              'All PDFs are official company-IR or HKEXnews originals. PDF headers, parseability, page counts, company/report identity, SHA-256 hashes and ZIP CRC were checked.',
              '',
          ]
          for row in manifest:
              lines.append(f"{row['No.']}. {row['File name']} | {row['PDF pages']} pages | {row['Official source']}")
          readme.write_text('\n'.join(lines), encoding='utf-8')

          internal_zip = OUT / 'China_Lesso_02128_2020-2025_Annual_and_Latest_Reports.zip'
          with zipfile.ZipFile(internal_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(REPORT_DIR.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(internal_zip, 'r') as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failed at {bad}')
              if len(pdfs) != 8:
                  raise RuntimeError(f'Unexpected PDF count in ZIP: {len(pdfs)}')

          chinese_copy = OUT / '中国联塑_02128_2020-2025年报及最新财务报告.zip'
          shutil.copy2(internal_zip, chinese_copy)

          result = {
              'ok': True,
              'archive': internal_zip.name,
              'chinese_archive': chinese_copy.name,
              'archive_bytes': internal_zip.stat().st_size,
              'pdf_count': 8,
              'zip_crc_ok': True,
              'latest_2026_url': latest_2026_url,
              'reports': manifest,
          }
          (OUT / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PACKAGE_OK', json.dumps(result, ensure_ascii=False), flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: china-lesso-verified-reports
          path: output/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
