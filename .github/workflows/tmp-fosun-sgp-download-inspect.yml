name: Temporary Fosun SGP download form inspection

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-sgp-download-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Inspect pages, forms, scripts, and download endpoint
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ids=[181674,157577,187200]
          for rid in ids:
              print('\n===== REPORT',rid,'=====')
              s=requests.Session()
              s.headers.update({
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
                  'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
              })
              for url in [f'https://www.sgpjbg.com/baogao/{rid}.html',f'https://www.sgpjbg.com/bgdown/{rid}.html']:
                  try:
                      r=s.get(url,timeout=60,allow_redirects=True)
                      text=r.text
                      print('PAGE',url,'status',r.status_code,'bytes',len(r.content),'final',r.url,'cookies',s.cookies.get_dict())
                      soup=BeautifulSoup(text,'html.parser')
                      print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
                      for form in soup.find_all('form'):
                          rec={'action':form.get('action'),'method':form.get('method'),'id':form.get('id'),'name':form.get('name')}
                          inputs=[]
                          for inp in form.find_all(['input','button','select']):
                              inputs.append({k:inp.get(k) for k in ['tag','type','name','id','value','onclick','formaction'] if inp.get(k) is not None})
                          print('FORM',json.dumps(rec,ensure_ascii=False),json.dumps(inputs[:100],ensure_ascii=False))
                      for tag in soup.find_all(['a','button','input','script','iframe','embed','object']):
                          attrs={k:tag.get(k) for k in ['href','src','data','action','value','onclick','id','name','type','class'] if tag.get(k) is not None}
                          label=tag.get_text(' ',strip=True)[:300]
                          blob=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                          if any(x in blob for x in ['download','bookdownload','bgdown','下载','pdf','reportid','baogaoid','dtype','187200','181674','157577']):
                              print('TAG',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False)[:4000])
                      decoded=html.unescape(text).replace('\\/','/')
                      patterns=[
                          r'BookDownLoad[^"\'<>\s)]*',
                          r'(?:ReportID|reportid|BaogaoID|baogaoid|fileid|FileID|bookid|BookID|dtype)\s*[:=]\s*["\']?[^,;\s"\']+',
                          r'https?://[^"\'<>\s]+(?:\.pdf|download|BookDownLoad|bgdown)[^"\'<>\s]*',
                          r'[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',
                          r'__VIEWSTATE[^"\'<>\s]*',
                      ]
                      for pat in patterns:
                          found=[]
                          for match in re.findall(pat,decoded,re.I):
                              value=match if isinstance(match,str) else ' '.join(match)
                              if value not in found: found.append(value)
                          print('PATTERN',pat,'COUNT',len(found))
                          for value in found[:100]: print('MATCH',value[:2000])
                      # print context around BookDownLoad and report id
                      for needle in ['BookDownLoad.aspx',str(rid),'dtype=','download']:
                          positions=[m.start() for m in re.finditer(re.escape(needle),decoded,re.I)]
                          print('CONTEXT_NEEDLE',needle,'COUNT',len(positions))
                          for pos in positions[:20]:
                              print('CONTEXT',re.sub(r'\s+',' ',decoded[max(0,pos-800):pos+1600])[:3000])
                  except Exception as e:
                      print('PAGE_ERROR',url,repr(e))

              endpoint='https://www.sgpjbg.com/FlexPaper/BookDownLoad.aspx'
              # Probe common GET and POST parameter names while preserving cookies.
              params_list=[
                  {'id':rid},{'ID':rid},{'reportid':rid},{'ReportID':rid},{'baogaoid':rid},{'BaogaoID':rid},{'bookid':rid},{'BookID':rid},
                  {'id':rid,'dtype':0},{'ReportID':rid,'dtype':0},{'fileid':rid,'dtype':0},
              ]
              for params in params_list:
                  for method in ['GET','POST']:
                      try:
                          if method=='GET': rr=s.get(endpoint,params=params,timeout=45,allow_redirects=False,headers={'Referer':f'https://www.sgpjbg.com/bgdown/{rid}.html'})
                          else: rr=s.post(endpoint,data=params,timeout=45,allow_redirects=False,headers={'Referer':f'https://www.sgpjbg.com/bgdown/{rid}.html'})
                          print('PROBE',method,json.dumps(params,ensure_ascii=False),'status',rr.status_code,'bytes',len(rr.content),'type',rr.headers.get('content-type'),'loc',rr.headers.get('location'),'disp',rr.headers.get('content-disposition'),'magic',rr.content[:12].hex(),'text',rr.text[:300].replace('\n',' '))
                      except Exception as e:
                          print('PROBE_ERROR',method,params,repr(e))
          PY
