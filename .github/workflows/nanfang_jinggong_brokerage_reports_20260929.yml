name: South Precision Brokerage Reports Package

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_brokerage_reports_20260929.yml
      - scripts/build_nanfang_jinggong_brokerage_reports.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Fix Eastmoney pagination parameters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_nanfang_jinggong_brokerage_reports.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"pageSize": "200",', '"pageSize": "5000",')
          old = '        "orgCode": "",\n    }'
          new = '        "orgCode": "",\n        "rcode": "",\n        "p": "1",\n        "pageNum": "1",\n        "pageNumber": "1",\n    }'
          if old not in text:
              raise RuntimeError('Expected query parameter block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Download validate and package reports
        run: python scripts/build_nanfang_jinggong_brokerage_reports.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-jinggong-brokerage-reports-package
          path: |
            output/nanfang_jinggong_brokerage_reports.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
