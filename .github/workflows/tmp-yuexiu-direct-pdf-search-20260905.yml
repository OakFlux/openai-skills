name: Temporary Yuexiu Transport direct PDF search

on:
  push:
    branches:
      - tmp-yuexiu-direct-pdf-search-20260905

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search public web for directly accessible PDFs
        run: |
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          cat > /tmp/search_yuexiu.py <<'PY'
          import base64, html, json, re, time
          from pathlib import Path
          from urllib.parse import parse_qs, quote, unquote, urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          out=Path('output')
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })
          queries=[
            '"越秀交通基建" filetype:pdf',
            '"越秀交通基建" "首次覆盖" pdf',
            '"越秀交通基建" "公司深度" pdf',
            '"平临高速收购落地，保持稳健派息" pdf',
            '"平临高速将增厚25年业绩" pdf',
            '"中期分红率53.8%" pdf 越秀交通基建',
            '"001052.HK" pdf 研报',
            '"01052.HK" pdf 研报',
            '"越秀交通基建" "西南证券" 2026 pdf',
            'site:pdf.dfcfw.com/pdf "越秀交通基建"',
            'site:dxzq.net.cn "越秀交通基建" pdf',
            'site:xyzq.com.cn "越秀交通基建" pdf',
            'site:glsc.com.cn "越秀交通基建" pdf',
            'site:swsc.com.cn "越秀交通基建" pdf'
          ]

          def decode_bing(href):
              try:
                  qs=parse_qs(urlparse(href).query)
                  v=qs.get('u',[''])[0]
                  if v.startswith('a1'):
                      raw=v[2:]
                      raw += '='*((4-len(raw)%4)%4)
                      return base64.b64decode(raw).decode('utf-8','ignore')
              except Exception:
                  pass
              return href

          results=[]
          for qi,q in enumerate(queries,1):
              for engine,base in [
                  ('bing','https://www.bing.com/search?q='),
                  ('bingcn','https://cn.bing.com/search?q='),
                  ('duck','https://html.duckduckgo.com/html/?q=')
              ]:
                  try:
                      r=s.get(base+quote(q),timeout=35,allow_redirects=True)
                      print('SEARCH',qi,engine,r.status_code,len(r.content),q)
                      (out/f'{qi:02d}_{engine}.html').write_bytes(r.content)
                      soup=BeautifulSoup(r.text,'html.parser')
                      for a in soup.find_all('a',href=True):
                          href=a['href']; title=' '.join(a.stripped_strings)
                          if 'bing.com/ck/a' in href: href=decode_bing(href)
                          if href.startswith('/l/?') or 'duckduckgo.com/l/?' in href:
                              full=urljoin('https://duckduckgo.com',href)
                              href=unquote(parse_qs(urlparse(full).query).get('uddg',[href])[0])
                          if not href.startswith('http'): continue
                          low=(href+' '+title).lower()
                          if any(k in low for k in ['越秀交通','yuexiu','01052','001052','pdf.dfcfw','hangyan','fxbaogao','swsc','dxzq','xyzq','glsc']) or '.pdf' in low:
                              item={'query':q,'engine':engine,'title':title[:300],'url':html.unescape(href)}
                              if item not in results:
                                  results.append(item)
                                  print('RESULT',json.dumps(item,ensure_ascii=False))
                  except Exception as e:
                      print('ERR',qi,engine,repr(e))
              time.sleep(0.3)
          # Probe result URLs that look like PDF or direct assets.
          probes=[]
          seen=set()
          for item in results:
              u=item['url']
              if u in seen: continue
              seen.add(u)
              if not any(x in u.lower() for x in ['.pdf','pdf.dfcfw.com','download','report','research','upload','file']): continue
              try:
                  rr=s.get(u,timeout=35,allow_redirects=True,stream=True)
                  head=rr.raw.read(16)
                  probes.append({'url':u,'status':rr.status_code,'final':rr.url,'content_type':rr.headers.get('content-type'),'content_length':rr.headers.get('content-length'),'pdf_magic':head.lstrip().startswith(b'%PDF')})
                  print('PROBE',json.dumps(probes[-1],ensure_ascii=False))
              except Exception as e:
                  probes.append({'url':u,'error':repr(e)})
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL_RESULTS',len(results),'TOTAL_PROBES',len(probes))
          PY
          python /tmp/search_yuexiu.py

      - name: Upload search output
        uses: actions/upload-artifact@v4
        with:
          name: yuexiu-direct-pdf-search
          path: output
          retention-days: 1
