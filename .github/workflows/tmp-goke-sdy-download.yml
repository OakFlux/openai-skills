name: Temporary Goke Micro Sdyanbao public download probe

on:
  push:
    branches:
      - tmp-goke-sdy-download-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pypdf
      - name: Inspect public metadata and exposed download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          queries = [
            '国科微 编解码芯片领军者 AI布局逐步完善',
            '国科微 AI赋能视显SoC基本盘',
            '国科微 行业复苏与产品迭代共振',
            '国科微 四大业务齐发力',
            '国科微 长期深耕视频编解码芯片',
          ]
          api='https://api.sdyanbao.com/api/file/search'
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
            'Accept':'application/json,text/plain,*/*','Content-Type':'application/json;charset=UTF-8'})
          rows=[]; seen=set()
          for q in queries:
            payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
            r=s.post(api,json=payload,timeout=90); print('SEARCH',q,r.status_code,len(r.content)); r.raise_for_status()
            data=(r.json().get('data') or {}); print('TOTAL',data.get('total'))
            for f in data.get('files') or []:
              blob=' '.join([str(f.get('name') or ''),str(f.get('content') or '')[:1000],str(f.get('stock') or '')])
              if ('国科微' not in blob and '300672' not in blob): continue
              if f.get('id') in seen: continue
              seen.add(f.get('id')); rows.append(f)
              print('ROW',json.dumps(f,ensure_ascii=False)[:20000])

          # Inspect exact detail pages and all literal public endpoints/URLs exposed by HTML or JS.
          explicit=[]
          for f in rows:
            fid=f.get('id'); detail=f'https://www.sdyanbao.com/detail/{fid}'
            r=s.get(detail,timeout=90,allow_redirects=True,headers={'Accept':'text/html,*/*'})
            print('\nDETAIL',fid,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            html=r.text; soup=BeautifulSoup(html,'html.parser')
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
            for tag in soup.find_all(['a','button','iframe','embed','object','source','script']):
              blob=str(tag)
              if any(k in blob.lower() for k in ['download','.pdf','file_url','fileurl','share_url','page_url','下载']):
                attrs={k:v for k,v in tag.attrs.items() if k in ['href','src','data','data-url','data-href','onclick','id','class']}
                print('TAG',json.dumps({'tag':tag.name,'text':tag.get_text(' ',strip=True)[:300],'attrs':attrs},ensure_ascii=False)[:6000])
                for val in attrs.values():
                  if isinstance(val,list): val=' '.join(map(str,val))
                  for u in re.findall(r'https?://[^\s\"\'<>]+|/[A-Za-z0-9_./?=&%:+-]+',str(val)):
                    full=urllib.parse.urljoin(r.url,u.strip('\\\"\'(),;'))
                    if full not in explicit: explicit.append(full)
            # include URL-like metadata fields returned publicly by search API
            for k,v in f.items():
              if isinstance(v,str) and (v.startswith('http') or any(x in k.lower() for x in ['url','file','download','share','page'])):
                print('META_URL',k,v)
                if v.startswith('http') and v not in explicit: explicit.append(v)
            for sc in soup.find_all('script',src=True):
              jsurl=urllib.parse.urljoin(r.url,sc['src'])
              try:
                jr=s.get(jsurl,timeout=45); js=jr.text
                if any(k in js.lower() for k in ['download','fileurl','file_url','/api/file','page_url']):
                  print('SCRIPT',jsurl,jr.status_code,len(jr.content))
                  for needle in ['download','fileUrl','file_url','/api/file','page_url']:
                    for m in list(re.finditer(re.escape(needle),js,re.I))[:15]:
                      p=m.start(); print('CTX',needle,js[max(0,p-600):p+1800].replace('\n',' ')[:2400])
                  for u in re.findall(r'https?://[^\s\"\'<>]+|/[A-Za-z0-9_./?=&%:+-]*(?:download|file)[A-Za-z0-9_./?=&%:+-]*',js,re.I):
                    full=urllib.parse.urljoin(r.url,u.strip('\\\"\'(),;'))
                    if full not in explicit: explicit.append(full)
              except Exception as e: print('SCRIPT_ERR',jsurl,repr(e))

          # Try only literal public URLs exposed above. Also test a small set of documented API routes using returned IDs.
          tests=list(explicit)
          for f in rows:
            fid=f.get('id'); oid=f.get('original_id'); uuid=f.get('data_source_uuid')
            for u in [
              f'https://api.sdyanbao.com/api/file/download?id={fid}',
              f'https://api.sdyanbao.com/api/file/{fid}/download',
              f'https://api.sdyanbao.com/api/file/download/{fid}',
              f'https://www.sdyanbao.com/api/file/download?id={fid}',
            ]:
              if u not in tests: tests.append(u)
          out=Path('out'); out.mkdir(exist_ok=True); found=[]
          for u in tests:
            if any(x in u.lower() for x in ['login','register','vip','recharge','pay']): continue
            try:
              r=s.get(u,timeout=90,allow_redirects=True,headers={'Referer':'https://www.sdyanbao.com/'})
              print('TEST',u,r.status_code,len(r.content),r.headers.get('content-type'),r.url,r.content[:12])
              if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100000:
                p=out/f'report_{len(found)+1}.pdf'; p.write_bytes(r.content)
                rd=PdfReader(str(p),strict=False); pages=len(rd.pages); txt=''
                for pg in rd.pages[:min(5,pages)]:
                  try: txt += pg.extract_text() or ''
                  except Exception: pass
                if '国科微' not in re.sub(r'\s+','',txt) and '300672' not in re.sub(r'\s+','',txt): p.unlink(); continue
                found.append({'path':str(p),'url':r.url,'pages':pages,'bytes':len(r.content)})
                print('FOUND',json.dumps(found[-1],ensure_ascii=False))
            except Exception as e: print('TEST_ERR',u,repr(e))
          Path('probe.json').write_text(json.dumps({'rows':rows,'explicit':explicit,'found':found},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Goke_Micro_Sdy_Probe
          path: |
            probe.json
            out/*.pdf
          if-no-files-found: warn
          retention-days: 1
