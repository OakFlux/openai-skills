name: Package Longjian 600853 broker deep reports v2

on:
  push:
    branches:
      - tmp/longjian-broker-reports-20261029-v1
    paths:
      - .github/workflows/longjian-600853-broker-reports-20261029-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE = "600853"
          COMPANY = "龙建股份"
          FULL = "龙建路桥股份有限公司"
          ROOT_NAME = "龙建股份_600853_券商深度报告_2份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF原件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "date":"2018-07-04","broker":"天风证券","analyst":"唐笑、岳恒宇；联系人：肖文劲、陈航杰",
                  "rating":"买入（维持评级）","report_type":"公司深度研究",
                  "title":"乘风破浪推进省外布局，非公开发行提振公司实力",
                  "info_code":"AP201807041162723188","url":"https://pdf.dfcfw.com/pdf/H3_AP201807041162723188_1.pdf",
                  "expected_pages":24
              },
              {
                  "date":"2017-04-11","broker":"天风证券","analyst":"唐笑",
                  "rating":"买入（首次评级）","report_type":"首次覆盖报告",
                  "title":"订单营收超额完成目标，PPP项目落地加快",
                  "info_code":"AP201704140506787543","url":"https://pdf.dfcfw.com/pdf/H3_AP201704140506787543_1.pdf",
                  "expected_pages":4
              }
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer":"https://data.eastmoney.com/report/600853.html",
              "Accept":"application/pdf,*/*;q=0.8",
              "Accept-Language":"zh-CN,zh;q=0.9,en;q=0.8"
          })

          def safe_name(text):
              return re.sub(r"\s+"," ",re.sub(r'[\\/:*?"<>|\r\n\t]+','_',text)).strip(" ._")[:170]

          manifest=[]
          for idx,spec in enumerate(reports,1):
              data=None; used_url=None; attempts=[]
              for url in [spec["url"],spec["url"].replace("/H3_","/H2_"),spec["url"].replace("/H3_","/H1_")]:
                  for attempt in range(5):
                      try:
                          r=session.get(url,timeout=(30,420),allow_redirects=True)
                          rec={"url":url,"status":r.status_code,"bytes":len(r.content),"content_type":r.headers.get("content-type",""),"magic":r.content[:8].hex(),"final_url":r.url}
                          attempts.append(rec); print("PDF_REQUEST",json.dumps(rec,ensure_ascii=False))
                          if r.status_code==200 and r.content.startswith(b"%PDF-") and len(r.content)>50000:
                              data=r.content; used_url=r.url; break
                      except Exception as exc:
                          attempts.append({"url":url,"error":repr(exc)})
                      time.sleep(1+attempt)
                  if data is not None: break
              if data is None:
                  raise RuntimeError(f"download failed: {spec['title']} {attempts}")

              filename=safe_name(f"{idx:02d}_{spec['date'].replace('-','')}_{spec['broker']}_{spec['title']}.pdf")
              path=PDF_DIR/filename
              path.write_bytes(data)
              reader=PdfReader(str(path),strict=False)
              pages=len(reader.pages)
              if pages!=spec["expected_pages"]:
                  raise RuntimeError(f"page count mismatch {filename}: {pages} != {spec['expected_pages']}")

              text=""
              for page in reader.pages[:min(15,pages)]:
                  try: text += "\n" + (page.extract_text() or "")
                  except Exception: pass
              if not any(x in text for x in [COMPANY,FULL,CODE]):
                  raise RuntimeError(f"issuer validation failed: {filename}")
              if "天风证券" not in text and "天风证券研究所" not in text:
                  raise RuntimeError(f"broker validation failed: {filename}")

              q=subprocess.run(["qpdf","--warning-exit-0","--check",str(path)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              if q.returncode!=0: raise RuntimeError(q.stdout)
              prefix=PREVIEW_DIR/path.stem
              p=subprocess.run(["pdftoppm","-f","1","-l","1","-png","-r","140","-singlefile",str(path),str(prefix)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              preview=Path(str(prefix)+".png")
              if p.returncode!=0 or not preview.exists() or preview.stat().st_size<5000:
                  raise RuntimeError(f"preview failed: {filename} {p.stdout}")

              manifest.append({**spec,"filename":filename,"actual_pages":pages,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"pdf_url":used_url,"detail_url":f"https://data.eastmoney.com/report/info/{spec['info_code']}.html","preview_file":str(Path("首页预览")/preview.name),"download_attempts":attempts})

          readme=[f"龙建股份（{CODE}.SH）券商深度研究报告资料包","整理日期：2026-10-29","","本包收录2份公开可直接下载的券商原始PDF：1份24页公司深度研究，以及1份4页首次覆盖报告。","报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",""]
          for i,x in enumerate(manifest,1):
              readme += [f"{i}. {x['filename']}",f"   券商：{x['broker']}；报告类型：{x['report_type']}；研究员：{x['analyst']}；发布日期：{x['date']}",f"   标题：{x['title']}",f"   评级：{x['rating']}；实际页数：{x['actual_pages']}页；文件大小：{x['bytes']}字节",f"   来源页面：{x['detail_url']}",f"   原始PDF：{x['pdf_url']}",f"   SHA-256：{x['sha256']}",""]
          readme += ["核验项目：PDF文件头、公司名称/证券代码、券商标识、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。","未使用网页摘要或重排文件替代券商原始PDF。"]
          (ROOT/"README_报告清单与核验说明.txt").write_text("\n".join(readme),encoding="utf-8")
          (ROOT/"manifest.json").write_text(json.dumps({"company":COMPANY,"full_company_name":FULL,"stock_code":CODE,"prepared_on":"2026-10-29","report_count":2,"all_files_are_original_broker_pdfs":True,"files":manifest},ensure_ascii=False,indent=2),encoding="utf-8")
          with (ROOT/"manifest.csv").open("w",newline="",encoding="utf-8-sig") as f:
              w=csv.writer(f); w.writerow(["文件名","报告类型","券商","研究员","发布日期","标题","评级","页数","字节数","SHA-256","来源页面","PDF地址"])
              for x in manifest: w.writerow([x["filename"],x["report_type"],x["broker"],x["analyst"],x["date"],x["title"],x["rating"],x["actual_pages"],x["bytes"],x["sha256"],x["detail_url"],x["pdf_url"]])
          (ROOT/"SHA256SUMS.txt").write_text("\n".join(f"{x['sha256']}  PDF原件/{x['filename']}" for x in manifest)+"\n",encoding="utf-8")

          zip_path=Path("longjian_600853_broker_deep_reports_2.zip")
          with zipfile.ZipFile(zip_path,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file(): z.write(path,arcname=str(Path(ROOT_NAME)/path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path,"r") as z:
              bad=z.testzip()
              if bad is not None: raise RuntimeError(f"ZIP CRC failed: {bad}")

          result={"package":zip_path.name,"zip_bytes":zip_path.stat().st_size,"zip_sha256":hashlib.sha256(zip_path.read_bytes()).hexdigest(),"report_count":2,"files":[{k:x[k] for k in ["filename","report_type","broker","analyst","date","title","rating","actual_pages","bytes","sha256","detail_url","pdf_url"]} for x in manifest]}
          Path("result.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PACKAGE_RESULT",json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: longjian-600853-broker-deep-reports-2-20261029-v2
          path: |
            longjian_600853_broker_deep_reports_2.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
