name: Package Rihai Intelligent 002313 broker deep reports 20261020

on:
  push:
    paths:
      - '.github/workflows/rihai-002313-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          package_name = '日海智能_002313_券商深度报告_完整版_2份'
          root = Path(package_name)
          root.mkdir(exist_ok=True)
          previews = Path('_preview_validation')
          previews.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '广证恒生证券研究所',
                  'date': '2018-12-21',
                  'analysts': '包冬青',
                  'rating': '买入',
                  'title': '深度报告：物联网“云+端+解决方案”布局，构建产业链竞争力',
                  'info_code': 'AP201812211275592487',
                  'expected_pages': 25,
                  'min_pages': 20,
                  'title_terms': ['物联网', '云+端', '解决方案', '产业链竞争力'],
                  'filename': '01_广证恒生_日海智能_物联网云端解决方案布局_2018-12-21_25页.pdf',
              },
              {
                  'broker': '西南证券',
                  'date': '2018-08-28',
                  'analysts': '刘言',
                  'rating': '买入',
                  'title': '传统业务稳健发展，物联网即将快速放量',
                  'info_code': 'AP201808281183930141',
                  'expected_pages': 12,
                  'min_pages': 10,
                  'title_terms': ['传统业务', '物联网', '快速放量'],
                  'filename': '02_西南证券_日海智能_传统业务稳健物联网快速放量_2018-08-28_12页.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(info_code: str) -> tuple[bytes, str]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last = None
              for url in urls:
                  for attempt in range(7):
                      try:
                          response = session.get(
                              url,
                              timeout=(25, 240),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 100_000:
                              return response.content, url
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          manifest = []
          for index, report in enumerate(reports, start=1):
              pdf_bytes, pdf_url = download_pdf(report['info_code'])
              destination = root / report['filename']
              destination.write_bytes(pdf_bytes)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'Too few pages for {destination.name}: {pages} < {report["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(18, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', extracted)
              if not any(term in compact for term in ['日海智能', '日海通讯', '002313']):
                  raise RuntimeError(f'Issuer identity check failed: {destination.name}')

              matched_title_terms = [
                  term for term in report['title_terms']
                  if re.sub(r'\s+', '', term) in compact
              ]
              if not matched_title_terms:
                  raise RuntimeError(f'Title keyword check failed: {destination.name}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )

              preview_prefix = previews / f'{index:02d}'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(preview_prefix) + '.png')
              if not preview_file.exists() or preview_file.stat().st_size < 10_000:
                  raise RuntimeError(f'First-page render failed: {destination.name}')

              sha256 = hashlib.sha256(pdf_bytes).hexdigest()
              manifest.append({
                  **report,
                  'actual_pages': pages,
                  'bytes': len(pdf_bytes),
                  'sha256': sha256,
                  'source_report_page': f'https://data.eastmoney.com/report/info/{report["info_code"]}.html',
                  'pdf_url': pdf_url,
                  'matched_title_terms': matched_title_terms,
                  'document_nature': '券商原始完整PDF',
                  'validation': [
                      'PDF header',
                      'issuer identity',
                      'title keywords',
                      'page count',
                      'qpdf structure',
                      'first-page render',
                  ],
              })

          readme = [
              '日海智能科技股份有限公司（002313.SZ）券商深度报告完整版资料包',
              '整理日期：2026-10-20',
              '',
              '本包收录公开渠道可直接取得并完成结构校验的2份券商原始完整PDF。',
              '公开研报索引共检索到8份公司报告，其中仅这2份达到相对完整的公司研究篇幅；其余多为4-6页事件或业绩点评，未用于凑数。',
              '',
          ]
          for index, item in enumerate(manifest, start=1):
              readme += [
                  f'{index}. {item["broker"]}：《{item["title"]}》',
                  f'   日期：{item["date"]}；分析师：{item["analysts"]}；评级：{item["rating"]}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_report_page"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme += [
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、标题关键词、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]

          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(package_name + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file_path in sorted(root.rglob('*')):
                  if file_path.is_file():
                      archive.write(file_path, arcname=f'{package_name}/{file_path.relative_to(root)}')

          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              pdf_files = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_file or len(pdf_files) != 2:
                  raise RuntimeError(f'ZIP validation failed: bad={bad_file}, pdf_count={len(pdf_files)}')

          alias_path = Path('rihai_intelligent_002313_broker_deep_reports_2_full.zip')
          alias_path.write_bytes(zip_path.read_bytes())
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha256)
          print('TOTAL_PAGES', sum(item['actual_pages'] for item in manifest))
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: rihai-002313-broker-deep-reports-full-2
          path: |
            日海智能_002313_券商深度报告_完整版_2份.zip
            rihai_intelligent_002313_broker_deep_reports_2_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
