name: Temporary fxbaogao API inspect

on:
  push:
    branches:
      - tmp/china-everbright-fxbaogao-api-inspect-20260831

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Inspect public API responses and JS endpoint strings
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json,re,urllib.parse
          from pathlib import Path
          import requests

          OUT=Path('out');OUT.mkdir()
          s=requests.Session();s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6',
            'Origin':'https://www.fxbaogao.com',
            'Referer':'https://www.fxbaogao.com/view?id=5040903',
          })
          api='https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId=5040903'
          r=s.get(api,timeout=45);print('PREVIEW',r.status_code,len(r.content),r.headers.get('content-type'),r.text[:20000],flush=True);(OUT/'preview_response.txt').write_bytes(r.content)

          scripts=[
            'https://www.fxbaogao.com/_fxbg/2608241759/js/app-pages-fxbg-main-js.bf8665a4a5f068d0e1c6.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2608241759/js/vendors~app-pages-fxbg-main-js.3eae845a5829f4e6f26c.chunk.js',
          ]
          all_paths=[]
          for i,u in enumerate(scripts):
            rr=s.get(u,timeout=90);text=rr.text;(OUT/f'js_{i}.js').write_text(text,encoding='utf-8',errors='replace');print('JS',i,rr.status_code,len(rr.content),rr.headers.get('content-type'),flush=True)
            paths=sorted(set(re.findall(r'''["']([^"']*(?:/mofoun/|getReport|report/report|download|Download|pdf|PDF|preview|Preview|fullText|content|Content|ocr|OCR)[^"']*)["']''',text)))
            print('PATHS',i,json.dumps(paths[:2000],ensure_ascii=False),flush=True)
            all_paths.extend(paths)
            low=text.lower()
            for kw in ['getreportpreviewimages','downloadreport','reportdownload','getreportdetail','getreportinfo','getreportcontent','fulltext','ocr','pdfurl','fileurl','sourceurl']:
              start=0;count=0
              while True:
                pos=low.find(kw,start)
                if pos<0 or count>=30:break
                print('CTX',i,kw,repr(text[max(0,pos-700):pos+1400]),flush=True)
                start=pos+len(kw);count+=1

          candidates=[]
          for p in all_paths:
            if not p.startswith('/'):continue
            if '/mofoun/' not in p:continue
            if any(x in p for x in ['${','{','}']):continue
            if p not in candidates:candidates.append(p)
          for p in candidates:
            if not any(k in p.lower() for k in ['report','download','pdf','preview','content']):continue
            urls=[]
            if '?' in p:
              urls.append('https://api.fxbaogao.com'+p)
            else:
              for suffix in ['?reportId=5040903','?id=5040903','/5040903']:
                urls.append('https://api.fxbaogao.com'+p+suffix)
            for u in urls[:3]:
              try:
                pr=s.get(u,timeout=15,allow_redirects=False)
                body=pr.content[:1000]
                if pr.status_code not in [404] or len(pr.content)>200:
                  print('PROBE',pr.status_code,len(pr.content),pr.headers.get('content-type'),pr.headers.get('location'),u,repr(body[:300]),flush=True)
              except Exception:pass
          PY
      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-api-inspect
          path: out/
          retention-days: 3
          if-no-files-found: error