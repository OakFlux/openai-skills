name: Discover Leo Group broker deep reports

on:
  push:
    branches: [tmp-leo-broker-reports-20261016]
    paths: ['.github/workflows/tmp-leo-broker-discovery-20261016.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query complete public broker report index
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002131' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=500&pageNo=1&beginTime=2010-01-01&endTime=2026-10-16&qType=0&code=002131&industryCode=*&orgCode=&author=&fields=' \
            -o reports.jsonp
          python3 - <<'PY'
          import json, re
          text = open('reports.jsonp', encoding='utf-8').read()
          payload = json.loads(re.sub(r'^datatable\(|\)$', '', text))
          rows = payload.get('data') or []
          print('TOTAL', len(rows))
          rows.sort(key=lambda r: r.get('publishDate') or '', reverse=True)
          for r in rows:
              print('\t'.join([
                  str(r.get('publishDate',''))[:10],
                  str(r.get('orgSName') or r.get('orgName') or ''),
                  str(r.get('attachPages') or ''),
                  str(r.get('infoCode') or ''),
                  str(r.get('column') or ''),
                  str(r.get('title') or ''),
              ]))
          PY
