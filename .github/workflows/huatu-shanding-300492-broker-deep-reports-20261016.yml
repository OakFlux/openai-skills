name: Package Huatu Shanding 300492 broker deep reports 20261016

on:
  push:
    paths:
      - '.github/workflows/huatu-shanding-300492-broker-deep-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any
          import requests
          from pypdf import PdfReader

          STOCK_CODE='300492'
          COMPANY='华图山鼎'
          AS_OF='2026-10-16'
          TARGET=3
          PACKAGE='华图山鼎_300492_券商深度报告_完整版_3份_截至20261016'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREVIEWS=ROOT/'首页预览'; PREVIEWS.mkdir(exist_ok=True)
          CACHE=Path('work/candidates'); CACHE.mkdir(parents=True,exist_ok=True)

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':f'https://data.eastmoney.com/report/{STOCK_CODE}.html',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Accept':'application/json,text/plain,*/*'
          })

          def compact(x: Any)->str:
            return re.sub(r'\s+','',str(x or ''))

          rows=[]; page_log=[]
          for page in range(1,11):
            params={
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
              'beginTime':'2023-01-01','endTime':AS_OF,'pageNo':str(page),'fields':'','qType':'0',
              'orgCode':'','code':STOCK_CODE,'rcode':'','p':str(page),'pageNum':str(page),
              'pageNumber':str(page),'_':str(int(time.time()*1000))
            }
            r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,90))
            r.raise_for_status(); payload=r.json(); batch=payload.get('data') or []
            page_log.append({'page':page,'count':len(batch),'hits':payload.get('hits')})
            rows.extend(x for x in batch if isinstance(x,dict))
            if len(batch)<100: break

          if not rows:
            raise RuntimeError('未检索到华图山鼎券商研报')

          positive={'首次覆盖':1800,'深度':1600,'公司研究':700,'专题':500,'教育':250,'公考':250,'培训':200,'龙头':180,'转型':120}
          negative={'点评':-500,'季报':-450,'年报':-350,'中报':-350,'业绩预告':-450,'事件':-350,'快报':-450,'更新报告':-180}
          normalized=[]; seen=set()
          for row in rows:
            info=str(row.get('infoCode') or '').strip(); title=str(row.get('title') or '').strip()
            if not info or not title or info in seen: continue
            seen.add(info)
            pages=int(row.get('attachPages') or 0)
            date=str(row.get('publishDate') or '')[:10]
            broker=str(row.get('orgSName') or row.get('orgName') or '未知券商')
            analysts=str(row.get('researcher') or '')
            rating=str(row.get('emRatingName') or '')
            score=pages*55
            tc=compact(title)
            for k,v in positive.items():
              if k in tc: score+=v
            for k,v in negative.items():
              if k in tc: score+=v
            try:
              age=(dt.date.fromisoformat(AS_OF)-dt.date.fromisoformat(date)).days
              score+=max(0,500-age//4)
            except Exception: pass
            normalized.append({'info_code':info,'title':title,'date':date,'broker':broker,'analysts':analysts,'rating':rating,'pages_hint':pages,'score':score})
          normalized.sort(key=lambda x:(x['score'],x['pages_hint'],x['date']),reverse=True)
          Path('work/all_report_metadata.json').write_text(json.dumps(normalized,ensure_ascii=False,indent=2),encoding='utf-8')

          def download_pdf(info: str):
            urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H1_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H4_{info}_1.pdf']
            last={}
            for url in urls:
              for attempt in range(5):
                try:
                  r=s.get(url,timeout=(30,300),allow_redirects=True,headers={
                    'User-Agent':s.headers['User-Agent'],
                    'Referer':f'https://data.eastmoney.com/report/info/{info}.html',
                    'Accept':'application/pdf,*/*;q=0.8'
                  })
                  last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                    return r.content,url,last
                except Exception as e:
                  last={'url':url,'error':repr(e)}
                time.sleep(1+attempt)
            raise RuntimeError(f'PDF下载失败 {info}: {last}')

          candidates=[]; attempts=[]
          for meta in normalized[:35]:
            if len(candidates)>=10: break
            try:
              data,pdf_url,dlmeta=download_pdf(meta['info_code'])
              path=CACHE/f"{meta['info_code']}.pdf"; path.write_bytes(data)
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              if pages<8: raise RuntimeError(f'页数过少:{pages}')
              text=''
              for p in reader.pages[:min(18,pages)]:
                try: text+='\n'+(p.extract_text() or '')
                except Exception: pass
              if len(compact(text))<150:
                txt=path.with_suffix('.txt')
                subprocess.run(['pdftotext','-f','1','-l',str(min(18,pages)),str(path),str(txt)],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                if txt.exists(): text+='\n'+txt.read_text(encoding='utf-8',errors='ignore')
              tc=compact(text)
              identity=[x for x in ['华图山鼎','300492','华图教育','山鼎设计'] if compact(x) in tc]
              if not identity: raise RuntimeError('正文未检出公司身份关键词')
              subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              depth=0; titlec=compact(meta['title'])
              if any(k in titlec for k in ['首次覆盖','深度','公司研究']): depth+=1200
              if pages>=35: depth+=900
              elif pages>=25: depth+=650
              elif pages>=15: depth+=350
              if any(k in titlec for k in ['点评','季报','年报','中报','业绩预告']): depth-=500
              item={**meta,'actual_pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'pdf_url':pdf_url,'download_meta':dlmeta,'identity_terms':identity,'final_score':meta['score']+pages*35+depth,'temp_path':str(path)}
              candidates.append(item); attempts.append({'status':'accepted',**item})
            except Exception as e:
              attempts.append({'status':'rejected',**meta,'reason':repr(e)})

          if len(candidates)<2:
            raise RuntimeError(f'仅找到{len(candidates)}份通过核验的完整研报')
          candidates.sort(key=lambda x:(x['final_score'],x['actual_pages'],x['date']),reverse=True)

          selected=[]; used_brokers=set(); used_titles=set()
          for item in candidates:
            key=re.sub(r'[^\u4e00-\u9fffA-Za-z0-9]','',item['title'])
            if key in used_titles or item['broker'] in used_brokers: continue
            if item['actual_pages']<12: continue
            selected.append(item); used_titles.add(key); used_brokers.add(item['broker'])
            if len(selected)>=TARGET: break
          if len(selected)<TARGET:
            for item in candidates:
              key=re.sub(r'[^\u4e00-\u9fffA-Za-z0-9]','',item['title'])
              if item in selected or key in used_titles: continue
              selected.append(item); used_titles.add(key)
              if len(selected)>=TARGET: break
          selected=selected[:TARGET]
          if len(selected)<2: raise RuntimeError('最终筛选不足2份')

          def safe(s:str,n:int=54)->str:
            s=re.sub(r'[\\/:*?"<>|\r\n]+','_',s).strip(' ._')
            return s[:n].rstrip(' ._') or '未命名报告'

          manifest=[]
          for i,item in enumerate(selected,1):
            filename=f"{i:02d}_{safe(item['broker'],16)}_{item['date'].replace('-','')}_{safe(item['title'])}_完整版.pdf"
            dest=ROOT/filename; dest.write_bytes(Path(item['temp_path']).read_bytes())
            prefix=PREVIEWS/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<8000: raise RuntimeError(f'首页预览失败:{filename}')
            out={k:v for k,v in item.items() if k!='temp_path'}
            out.update({'filename':filename,'source_report_page':f"https://data.eastmoney.com/report/info/{item['info_code']}.html",'preview_file':str(Path('首页预览')/preview.name),'document_nature':'券商原始完整PDF'})
            manifest.append(out)

          readme=['华图山鼎设计股份有限公司（300492.SZ）券商深度报告完整版资料包',f'整理日期：{AS_OF}','',f'本包收录{len(manifest)}份公开可直接取得的券商原始完整PDF。筛选优先级：长篇深度/首次覆盖、近期、不同券商。','']
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；分析师：{x['analysts'] or '未标注'}；评级：{x['rating'] or '未标注'}",f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",f"   来源页面：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['报告内容与版权归原券商及作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、公司身份、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'筛选与下载日志.json').write_text(json.dumps({'api_pages':page_log,'records':len(rows),'attempts':attempts},ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=len(manifest): raise RuntimeError(f'ZIP核验失败 bad={bad} pdfs={len(pdfs)} expected={len(manifest)}')
          alias=Path('huatu_shanding_300492_broker_deep_reports_full_20261016.zip'); alias.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('SELECTED_REPORTS',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: huatu-shanding-300492-broker-deep-reports-20261016
          path: |
            华图山鼎_300492_券商深度报告_完整版_3份_截至20261016.zip
            huatu_shanding_300492_broker_deep_reports_full_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
