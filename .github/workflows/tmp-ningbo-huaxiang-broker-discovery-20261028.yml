name: Discover Ningbo Huaxiang broker reports

on:
  push:
    branches:
      - tmp-ningbo-huaxiang-broker-reports-20261028

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney public report index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, re, requests

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002048',
          })
          url = 'https://reportapi.eastmoney.com/report/list'
          rows_all = []
          page = 1
          while True:
              params = {
                  'cb': 'datatable4263982',
                  'industryCode': '*',
                  'pageSize': '100',
                  'industry': '*',
                  'rating': '*',
                  'ratingChange': '*',
                  'beginTime': '2018-01-01',
                  'endTime': '2026-10-28',
                  'pageNo': str(page),
                  'fields': '',
                  'qType': '0',
                  'orgCode': '',
                  'code': '002048',
                  'rcode': '',
              }
              r = s.get(url, params=params, timeout=120)
              r.raise_for_status()
              text = r.text.strip()
              m = re.match(r'^[^(]+\((.*)\)\s*;?$', text, re.S)
              payload = json.loads(m.group(1) if m else text)
              rows = payload.get('data') or []
              hits = int(payload.get('hits') or 0)
              rows_all.extend(rows)
              if not rows or page >= math.ceil(hits / 100):
                  break
              page += 1

          print('TOTAL', len(rows_all))
          rows_all.sort(key=lambda x: (x.get('publishDate') or '', x.get('attachPages') or 0), reverse=True)
          for row in rows_all:
              print('\t'.join([
                  str(row.get('publishDate') or '')[:10],
                  str(row.get('attachPages') or ''),
                  str(row.get('orgSName') or row.get('orgName') or ''),
                  str(row.get('infoCode') or ''),
                  str(row.get('ratingName') or row.get('emRatingName') or ''),
                  str(row.get('researcher') or ''),
                  str(row.get('title') or ''),
              ]))
          PY
