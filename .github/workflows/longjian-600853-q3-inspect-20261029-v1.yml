name: Inspect Longjian 600853 Q3 report source

on:
  push:
    branches:
      - tmp/longjian-600853-filings-20261029-v1
    paths:
      - .github/workflows/longjian-600853-q3-inspect-20261029-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect CNINFO and public announcement pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re, time
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          results = {'cninfo_queries': [], 'pages': []}
          stock = '600853,gssh0600853'
          api_urls = [
              'https://www.cninfo.com.cn/new/hisAnnouncement/query',
              'http://www.cninfo.com.cn/new/hisAnnouncement/query',
          ]
          variants = [
              {'column':'szse','plate':'','category':'category_sjdbg_szsh','searchkey':'','seDate':'2026-10-25~2026-10-29'},
              {'column':'sse','plate':'','category':'category_sjdbg_szsh','searchkey':'','seDate':'2026-10-25~2026-10-29'},
              {'column':'','plate':'sh','category':'category_sjdbg_szsh','searchkey':'','seDate':'2026-10-25~2026-10-29'},
              {'column':'szse','plate':'','category':'','searchkey':'2026年第三季度报告','seDate':'2026-10-25~2026-10-29'},
              {'column':'sse','plate':'','category':'','searchkey':'2026年第三季度报告','seDate':'2026-10-25~2026-10-29'},
              {'column':'szse','plate':'','category':'','searchkey':'龙建股份2026第三季度报告','seDate':'2026-10-25~2026-10-29'},
              {'column':'szse','plate':'','category':'','searchkey':'龙建路桥股份有限公司2026年第三季度报告','seDate':'2026-10-25~2026-10-29'},
          ]
          for variant in variants:
              payload = {
                  'pageNum':'1','pageSize':'30','column':variant['column'],'tabName':'fulltext',
                  'plate':variant['plate'],'stock':stock,'searchkey':variant['searchkey'],'secid':'',
                  'category':variant['category'],'trade':'','seDate':variant['seDate'],
                  'sortName':'','sortType':'','isHLtitle':'true',
              }
              rec = {'variant': variant, 'attempts': []}
              for url in api_urls:
                  try:
                      r = s.post(url, data=payload, timeout=(20,180), headers={
                          'User-Agent':s.headers['User-Agent'],
                          'Referer':'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search',
                          'Origin':'https://www.cninfo.com.cn',
                          'X-Requested-With':'XMLHttpRequest',
                      })
                      rec['attempts'].append({'url':url,'status':r.status_code,'bytes':len(r.content),'text':r.text[:300]})
                      if r.status_code == 200:
                          data = r.json()
                          rec['total'] = data.get('totalAnnouncement')
                          rec['announcements'] = data.get('announcements') or []
                          break
                  except Exception as exc:
                      rec['attempts'].append({'url':url,'error':repr(exc)})
              results['cninfo_queries'].append(rec)
              print('CNINFO', json.dumps(rec, ensure_ascii=False)[:30000])
              time.sleep(0.5)

          pages = [
              'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12665801&stockid=600853',
              'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12665801&stockid=600853',
              'https://www.cfi.net.cn/p20261027002015.html',
              'https://money.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/600853.phtml',
          ]
          for idx, url in enumerate(pages, 1):
              rec = {'url':url}
              try:
                  r = s.get(url, timeout=(20,180), allow_redirects=True)
                  raw = r.content
                  encs = [r.encoding, r.apparent_encoding, 'utf-8', 'gb18030', 'gbk', 'latin1']
                  decoded = []
                  for enc in encs:
                      if not enc: continue
                      try:
                          text = raw.decode(enc, errors='replace')
                          score = sum(k in text for k in ['龙建股份','第三季度报告','下载公告','600853'])
                          decoded.append((score, enc, text))
                      except Exception:
                          pass
                  decoded.sort(key=lambda x:x[0], reverse=True)
                  score, enc, text = decoded[0]
                  soup = BeautifulSoup(text, 'lxml')
                  rec.update(status=r.status_code, final_url=r.url, bytes=len(raw), content_type=r.headers.get('content-type',''), encoding=enc, score=score, title=soup.title.get_text(' ',strip=True) if soup.title else '')
                  links=[]
                  for a in soup.find_all('a', href=True):
                      href=urljoin(r.url,a.get('href'))
                      label=a.get_text(' ',strip=True)
                      blob=(label+' '+href).lower()
                      if any(k in blob for k in ['pdf','下载','download','attachment','file','bulletin']):
                          links.append({'text':label,'href':href})
                  rec['links']=links[:300]
                  patterns=[
                      r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                      r'https?://[^\s"\'<>]*(?:download|down|attachment|file|bulletin)[^\s"\'<>]*',
                      r'(?:adjunctUrl|pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url)\s*[:=]\s*["\']?[^,"\'<>\s}]+' ,
                      r'finalpage/20\d{2}-\d{2}-\d{2}/\d+\.PDF',
                  ]
                  raws=[]
                  for pat in patterns:
                      for m in re.findall(pat,text,re.I):
                          if isinstance(m,tuple): m=''.join(m)
                          if m not in raws: raws.append(m)
                  rec['raw_candidates']=raws[:500]
                  snippets=[]
                  for term in ['下载公告','第三季度报告','12665801','PDF','adjunctUrl','download']:
                      pos=text.find(term)
                      if pos>=0:
                          snippets.append({'term':term,'snippet':text[max(0,pos-1500):pos+4000]})
                  rec['snippets']=snippets[:20]
                  Path('out').joinpath(f'page_{idx}.html').write_text(text,encoding='utf-8')
              except Exception as exc:
                  rec['error']=repr(exc)
              results['pages'].append(rec)
              print('PAGE', json.dumps(rec, ensure_ascii=False)[:50000])
              time.sleep(0.5)

          Path('out/result.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: longjian-600853-q3-source-inspection-20261029
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
