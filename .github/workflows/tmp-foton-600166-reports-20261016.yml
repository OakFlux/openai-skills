name: Build Foton Motor financial-report package

on:
  push:
    branches: [tmp-foton-600166-reports-20261016]
    paths: ['.github/workflows/tmp-foton-600166-reports-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Discover, download and validate reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='福田汽车_600166_2020-2025年报及最新季报'
          mkdir -p "$PACKAGE"

          python3 - <<'PY'
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          ANNUAL = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/600166/page_type/ndbg.phtml'
          Q1 = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinYi/stockid/600166/page_type/yjdbg.phtml'
          Q3 = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/600166/page_type/sjdbg.phtml'
          outdir = Path('福田汽车_600166_2020-2025年报及最新季报')

          def fetch(url, referer=None):
              headers = {
                  'User-Agent': UA,
                  'Accept': 'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8',
              }
              if referer:
                  headers['Referer'] = referer
              last = None
              for attempt in range(7):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=240) as response:
                          return response.read(), response.geturl(), dict(response.headers)
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt)
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          def decode_page(raw):
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='replace')

          anchor_pattern = re.compile(
              r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',
              re.I | re.S,
          )

          def anchors(page_url):
              raw, final_url, _ = fetch(page_url)
              text = decode_page(raw)
              items = []
              for match in anchor_pattern.finditer(text):
                  href = html.unescape(match.group(1).strip())
                  label = re.sub(r'<[^>]+>', '', match.group(2))
                  label = html.unescape(re.sub(r'\s+', '', label))
                  items.append((label, urllib.parse.urljoin(final_url, href)))
              return items

          annual_links = anchors(ANNUAL)
          q1_links = anchors(Q1)
          q3_links = anchors(Q3)
          records = []

          revision_words = ('修订版', '修订稿', '更新后', '更正后', '更新版', '修订', '更正')
          for index, year in enumerate(range(2020, 2026), start=1):
              candidates = [
                  (label, url) for label, url in annual_links
                  if f'{year}年年度报告' in label
                  and '摘要' not in label
                  and '英文' not in label
              ]
              if not candidates:
                  raise SystemExit(f'Could not find {year} annual report detail link')
              candidates.sort(
                  key=lambda item: (
                      0 if any(word in item[0] for word in revision_words) else 1,
                      len(item[0]),
                  )
              )
              label, detail_url = candidates[0]
              revised = any(word in label for word in revision_words)
              suffix = '_修订或更正版' if revised else ''
              records.append({
                  'order': index,
                  'category': '年度报告',
                  'period': f'{year}年度',
                  'detail_title': label,
                  'detail_url': detail_url,
                  'filename': f'{index:02d}_福田汽车_{year}年年度报告{suffix}.pdf',
              })

          def choose_latest_quarter():
              q3_candidates = [
                  (label, url) for label, url in q3_links
                  if '2026年' in label
                  and ('第三季度报告' in label or '三季度报告' in label)
                  and '摘要' not in label
              ]
              if q3_candidates:
                  q3_candidates.sort(
                      key=lambda item: (
                          0 if any(word in item[0] for word in revision_words) else 1,
                          len(item[0]),
                      )
                  )
                  label, url = q3_candidates[0]
                  revised = any(word in label for word in revision_words)
                  suffix = '_修订或更正版' if revised else ''
                  return label, url, '2026年第三季度', f'07_福田汽车_2026年第三季度报告{suffix}_最新季报.pdf'

              q1_candidates = [
                  (label, url) for label, url in q1_links
                  if '2026年' in label
                  and ('第一季度报告' in label or '一季度报告' in label)
                  and '摘要' not in label
              ]
              if not q1_candidates:
                  raise SystemExit('Could not find a 2026 quarterly report')
              q1_candidates.sort(
                  key=lambda item: (
                      0 if any(word in item[0] for word in revision_words) else 1,
                      len(item[0]),
                  )
              )
              label, url = q1_candidates[0]
              revised = any(word in label for word in revision_words)
              suffix = '_修订或更正版' if revised else ''
              return label, url, '2026年第一季度', f'07_福田汽车_2026年第一季度报告{suffix}_最新季报.pdf'

          quarter_label, quarter_detail_url, quarter_period, quarter_filename = choose_latest_quarter()
          records.append({
              'order': 7,
              'category': '最新季报',
              'period': quarter_period,
              'detail_title': quarter_label,
              'detail_url': quarter_detail_url,
              'filename': quarter_filename,
          })

          def extract_pdf_url(detail_url):
              detail_links = anchors(detail_url)
              downloads = [
                  (label, url) for label, url in detail_links
                  if '下载公告' in label or '.pdf' in url.lower()
              ]
              if not downloads:
                  raise RuntimeError(f'Could not find PDF link on detail page: {detail_url}')
              downloads.sort(key=lambda item: 0 if '下载公告' in item[0] else 1)
              return urllib.parse.unquote(downloads[0][1])

          for record in records:
              pdf_url = extract_pdf_url(record['detail_url'])
              raw, final_url, _ = fetch(pdf_url, record['detail_url'])
              if not raw.startswith(b'%PDF-'):
                  raise SystemExit(f'Not a PDF: {pdf_url}; prefix={raw[:80]!r}')
              if len(raw) < 50000:
                  raise SystemExit(f'PDF too small: {pdf_url}; bytes={len(raw)}')
              path = outdir / record['filename']
              path.write_bytes(raw)
              record['pdf_url'] = final_url
              record['bytes'] = len(raw)
              print(f"Saved {path} ({len(raw)} bytes) from {final_url}")

          (outdir / '_download_metadata.json').write_text(
              json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge 5

            pdftotext -f 1 -l 12 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '北汽福田汽车股份有限公司|福田汽车|FOTON' "$pdf.txt"
            rm -f "$pdf.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$pdf.render" >/dev/null 2>&1
            test -s "$pdf.render.png"
            rm -f "$pdf.render.png"

            echo "Validated: $(basename "$pdf") ($pages pages, $(stat -c%s "$pdf") bytes)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          folder = Path('福田汽车_600166_2020-2025年报及最新季报')
          metadata = json.loads((folder / '_download_metadata.json').read_text(encoding='utf-8'))
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 7:
              raise SystemExit(f'Expected 7 PDFs, found {len(pdfs)}')

          by_name = {item['filename']: item for item in metadata}
          latest_quarter = next(item for item in metadata if item['category'] == '最新季报')
          lines = [
              '北汽福田汽车股份有限公司（福田汽车，600166）',
              '2020—2025年年度报告及最新季报',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 收录2020—2025年度报告全文，共6份；如存在修订或更正版本，优先采用后续版本。',
              f"2. 截至2026-10-16，最新已披露季度报告为{latest_quarter['detail_title']}。",
              '3. 2026年半年度报告不属于季度报告，未将其替代为“最新季报”。',
              '4. PDF来自公开披露公告附件镜像，正文所载指定披露平台为上海证券交易所。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = by_name[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  类型：{item['category']}；报告期：{item['period']}；页数：{pages}；大小：{len(data)}字节",
                  f"  公告标题：{item['detail_title']}",
                  f"  PDF来源：{item['pdf_url']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、页数、正文公司名称及首页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_download_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Foton-Motor-600166-2020-2025-annual-and-latest-quarter
          path: 福田汽车_600166_2020-2025年报及最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
