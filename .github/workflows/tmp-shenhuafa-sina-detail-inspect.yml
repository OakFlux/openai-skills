name: Inspect Shenhuafa Sina Report Pages

on:
  push:
    branches:
      - tmp-shenhuafa-000020-broker-reports-20260929

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pages and archives
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/545414326060/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/648179160012/index.phtml'
          ]
          for u in urls:
            print('\nPAGE',u)
            r=s.get(u,timeout=30); print('status',r.status_code,'len',len(r.content),'ctype',r.headers.get('content-type'))
            r.encoding=r.apparent_encoding or 'gb18030'; html=r.text
            print('encoding',r.encoding)
            print('PDF/attachment-like strings:')
            strings=set(re.findall(r'https?://[^\"\'<>\s]+',html))
            for x in sorted(strings):
              if any(k in x.lower() for k in ('pdf','download','attach','report','file')):
                print(x[:500])
            soup=BeautifulSoup(html,'html.parser')
            print('Links:')
            for a in soup.find_all('a',href=True):
              t=' '.join(a.get_text(' ',strip=True).split())
              h=a['href']
              if any(k in (t+' '+h).lower() for k in ('pdf','下载','download','附件','原文')):
                print(t,'=>',h)
            for line in html.splitlines():
              if any(k in line.lower() for k in ('pdf','download','attach','fileurl','reporturl')):
                print('LINE',line[:1000])
            cdx='https://web.archive.org/cdx/search/cdx'
            params={'url':u,'output':'json','fl':'timestamp,original,statuscode,mimetype,digest','filter':'statuscode:200','collapse':'digest'}
            try:
              c=s.get(cdx,params=params,timeout=30); print('CDX',c.status_code,c.text[:4000])
            except Exception as e: print('CDX ERROR',e)
          PY
