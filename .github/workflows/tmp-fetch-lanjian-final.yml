name: Temporary Fetch Lanjian Filings Final

on:
  push:
    branches:
      - tmp/fetch-lanjian-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests

          ROOT = Path('lanjian_package')
          PDF_DIR = ROOT / '01_招股说明书及定期报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  'kind': 'prospectus',
                  'title': '首次公开发行股票并在创业板上市招股说明书',
                  'date': '2023-08-03',
                  'filename': '01_蓝箭电子_首次公开发行股票并在创业板上市招股说明书.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2023/2023-8/2023-08-03/9385264.PDF',
                  'min_pages': 250,
                  'year': '2023',
                  'title_terms': ['招股说明书'],
                  'forbidden_terms': ['招股意向书', '申报稿'],
              },
              {
                  'kind': 'annual_report',
                  'title': '2023年年度报告',
                  'date': '2024-04-23',
                  'filename': '02_蓝箭电子_2023年年度报告.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-23/10030890.PDF',
                  'min_pages': 100,
                  'year': '2023',
                  'title_terms': ['2023年年度报告'],
                  'forbidden_terms': [],
              },
              {
                  'kind': 'annual_report',
                  'title': '2024年年度报告',
                  'date': '2025-04-29',
                  'filename': '03_蓝箭电子_2024年年度报告.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-29/11047082.PDF',
                  'min_pages': 100,
                  'year': '2024',
                  'title_terms': ['2024年年度报告'],
                  'forbidden_terms': [],
              },
              {
                  'kind': 'annual_report',
                  'title': '2025年年度报告',
                  'date': '2026-04-28',
                  'filename': '04_蓝箭电子_2025年年度报告.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-28/12221765.PDF',
                  'min_pages': 100,
                  'year': '2025',
                  'title_terms': ['2025年年度报告'],
                  'forbidden_terms': [],
              },
              {
                  'kind': 'half_year_report',
                  'title': '2026年半年度报告',
                  'date': '2026-08-27',
                  'filename': '05_蓝箭电子_2026年半年度报告.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-8/2026-08-27/12553525.PDF',
                  'min_pages': 60,
                  'year': '2026',
                  'title_terms': ['2026年半年度报告'],
                  'forbidden_terms': ['摘要'],
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://vip.stock.finance.sina.com.cn/',
          })

          def looks_like_pdf(raw):
              return len(raw) > 100_000 and raw.lstrip().startswith(b'%PDF') and b'%%EOF' in raw[-16384:]

          def download(item, path):
              errors = []
              urls = [item['url']]
              if item['url'].startswith('http://'):
                  urls.append('https://' + item['url'][7:])
              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          print(f"GET {item['title']} attempt={attempt}: {url}")
                          with session.get(url, timeout=150, allow_redirects=True, stream=True) as response:
                              response.raise_for_status()
                              data = bytearray()
                              for chunk in response.iter_content(chunk_size=1024 * 256):
                                  if chunk:
                                      data.extend(chunk)
                              raw = bytes(data)
                              content_type = response.headers.get('content-type')
                          if not looks_like_pdf(raw):
                              raise RuntimeError(
                                  f'not a complete PDF: type={content_type}, bytes={len(raw)}, head={raw[:20]!r}'
                              )
                          path.write_bytes(raw)
                          return url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f"Unable to download {item['title']}:\n" + '\n'.join(errors))

          def page_count(path):
              result = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', result.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count: {path}')
              return int(match.group(1))

          def extract_text(path, pages):
              parts = []
              with tempfile.TemporaryDirectory() as tmp:
                  tmp_dir = Path(tmp)
                  for page in pages:
                      output = tmp_dir / f'p{page}.txt'
                      result = subprocess.run(
                          ['pdftotext', '-f', str(page), '-l', str(page), '-enc', 'UTF-8', str(path), str(output)],
                          capture_output=True,
                          text=True,
                      )
                      if result.returncode == 0 and output.exists():
                          parts.append(output.read_text(encoding='utf-8', errors='ignore'))
              return '\n'.join(parts)

          def compact(text):
              return re.sub(r'\s+', '', text)

          manifest = []
          sha_lines = []
          for item in documents:
              path = PDF_DIR / item['filename']
              source_url = download(item, path)
              raw = path.read_bytes()
              pages = page_count(path)
              if pages < item['min_pages']:
                  raise RuntimeError(f"Unexpectedly short {item['title']}: {pages} pages")

              sample_pages = sorted(set([1, min(2, pages), min(5, pages), max(1, pages // 2), pages]))
              text = extract_text(path, sample_pages)
              compact_text = compact(text)
              if not ('蓝箭电子' in compact_text or '佛山市蓝箭电子股份有限公司' in compact_text or '301348' in compact_text):
                  expanded = extract_text(path, list(range(1, min(30, pages) + 1)))
                  compact_text = compact(expanded)
              identity_ok = ('蓝箭电子' in compact_text or '佛山市蓝箭电子股份有限公司' in compact_text or '301348' in compact_text)
              title_ok = any(term in compact_text for term in item['title_terms'])
              forbidden_present = [term for term in item['forbidden_terms'] if term in compact_text[:50000]]
              if not identity_ok or not title_ok or forbidden_present:
                  raise RuntimeError(
                      f"Identity/title check failed for {item['title']}: identity={identity_ok}, "
                      f"title={title_ok}, forbidden={forbidden_present}"
                  )

              sha = hashlib.sha256(raw).hexdigest()
              rel = str(path.relative_to(ROOT))
              record = {
                  'document_type': item['kind'],
                  'title': item['title'],
                  'disclosure_date': item['date'],
                  'file': rel,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'source_url': source_url,
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': identity_ok,
                  'title_text_matched': title_ok,
                  'sampled_pages': sample_pages,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {rel}')
              print(f"VERIFIED {item['title']}: pages={pages}, bytes={len(raw)}")

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '佛山市蓝箭电子股份有限公司（蓝箭电子，301348）公开披露文件包',
              '',
              '内容范围：',
              '1. 2023年8月3日披露的正式《首次公开发行股票并在创业板上市招股说明书》；',
              '2. 上市以来全部独立年度报告：2023年、2024年、2025年年度报告；',
              '3. 截至2026年8月30日最新披露的2026年半年度报告。',
              '',
              '说明：公司于2023年8月10日在深圳证券交易所创业板上市，因此不存在独立披露的上市公司2020—2022年年度报告。',
              '上市前历史财务数据已包含在正式招股说明书中。',
              '',
              '校验项目：PDF文件头与EOF、pdfinfo可解析页数、公司名称和报告标题文字层、SHA-256、ZIP CRC。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f"- {record['title']}",
                  f"  披露日期：{record['disclosure_date']}",
                  f"  文件：{record['file']}",
                  f"  页数：{record['pages']}",
                  f"  大小：{record['bytes']} bytes",
                  f"  SHA256：{record['sha256']}",
                  f"  PDF来源：{record['source_url']}",
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '蓝箭电子_301348_全部年报_招股说明书_2026年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: lanjian-electronics-filings-final
          path: 蓝箭电子_301348_全部年报_招股说明书_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
