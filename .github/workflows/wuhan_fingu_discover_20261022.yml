name: Wuhan Fingu report discovery 20261022

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf

      - name: Discover report metadata and public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw out/pdfs
          python - <<'PY'
          import os, re, json, html, time, hashlib, urllib.parse
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT='out'
          RAW=os.path.join(OUT,'raw')
          PDFS=os.path.join(OUT,'pdfs')
          os.makedirs(RAW, exist_ok=True); os.makedirs(PDFS, exist_ok=True)
          s=requests.Session(); s.trust_env=False
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0 Safari/537.36'
          base_headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Accept':'*/*'}
          index=[]

          def safe_name(name):
              return re.sub(r'[^A-Za-z0-9._-]+','_',name)[:180]

          def save_text(name, text):
              path=os.path.join(RAW,safe_name(name))
              with open(path,'w',encoding='utf-8',errors='replace') as f:f.write(text)
              return path

          def get(name,url,headers=None,allow=True,timeout=(20,120)):
              h=dict(base_headers); h.update(headers or {})
              try:
                  r=s.get(url,headers=h,timeout=timeout,allow_redirects=allow)
                  ct=r.headers.get('content-type','')
                  rec={'name':name,'url':url,'final_url':r.url,'status':r.status_code,'length':len(r.content),'content_type':ct,'headers':dict(r.headers)}
                  index.append(rec)
                  print('GET',name,r.status_code,len(r.content),ct,r.url)
                  ext='.bin'
                  if 'json' in ct: ext='.json'
                  elif 'html' in ct or r.text.lstrip().startswith('<'): ext='.html'
                  elif 'text' in ct: ext='.txt'
                  with open(os.path.join(RAW,safe_name(name)+ext),'wb') as f:f.write(r.content)
                  return r
              except Exception as e:
                  rec={'name':name,'url':url,'error':repr(e)}; index.append(rec); print('ERR',name,repr(e)); return None

          east_urls=[
            'https://reportapi.eastmoney.com/report/list?pageSize=100&beginTime=2000-01-01&endTime=2026-10-22&stockCode=002194&pageNo=1&qType=0',
            'https://reportapi.eastmoney.com/report/list?cb=datatable4195737&pageSize=100&beginTime=2000-01-01&endTime=2026-10-22&stockCode=002194&pageNo=1&qType=0',
            'https://reportapi.eastmoney.com/report/list?cb=datatable4195737&pageSize=100&beginTime=2000-01-01&endTime=2026-10-22&stockCode=002194&pageNo=1&qType=0&orgCode=&author=&rcode=',
          ]
          east_res=[]
          for i,u in enumerate(east_urls):
              r=get(f'eastmoney_{i}',u,{'Referer':'https://data.eastmoney.com/report/002194.html'})
              if r: east_res.append(r)

          dc='https://datacenter-web.eastmoney.com/api/data/v1/get?sortColumns=REPORT_DATE&sortTypes=-1&pageSize=100&pageNumber=1&reportName=RPT_RES_REPORT_NT&columns=ALL&filter=(SECURITY_CODE%3D%22002194%22)'
          get('eastmoney_datacenter',dc,{'Referer':'https://data.eastmoney.com/'})

          sg_urls=[
            'https://bg.sgpjbg.com/baogao/16990.html',
            'https://bg.sgpjbg.com/bgdown/16990.html',
            'https://bg.sgpjbg.com/search.html?keyword=%E6%AD%A6%E6%B1%89%E5%87%A1%E8%B0%B7',
            'https://bg.sgpjbg.com/zhuanti/xintiandichanjituanbaogao.html',
          ]
          sg_res=[]
          for i,u in enumerate(sg_urls):
              r=get(f'sgpjbg_{i}',u,{'Referer':'https://bg.sgpjbg.com/'})
              if r: sg_res.append(r)

          other_urls=[
            'https://www.9fzt.com/detail/sz_002194_10_650430884853.html',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=all&t2=all&q=002194',
            'https://money.finance.sina.com.cn/corp/go.php/vReport_List/stockid/002194.phtml',
            'https://www.baidu.com/s?wd=%22%E6%AD%A6%E6%B1%89%E5%87%A1%E8%B0%B7%22+%22%E8%AF%81%E5%88%B8%E7%A0%94%E7%A9%B6%E6%8A%A5%E5%91%8A%22+pdf',
            'https://www.bing.com/search?q=%22%E6%AD%A6%E6%B1%89%E5%87%A1%E8%B0%B7%22+%22%E8%AF%81%E5%88%B8%E7%A0%94%E7%A9%B6%E6%8A%A5%E5%91%8A%22+pdf',
          ]
          other_res=[]
          for i,u in enumerate(other_urls):
              r=get(f'other_{i}',u)
              if r: other_res.append(r)

          # Parse Eastmoney JSON/JSONP responses.
          records=[]
          for r in east_res:
              txt=r.text.strip()
              m=re.match(r'^[^(]+\((.*)\)\s*;?$',txt,re.S)
              if m: txt=m.group(1)
              try:
                  obj=json.loads(txt)
              except Exception as e:
                  print('JSON parse failed',r.url,repr(e),txt[:200]); continue
              candidates=[]
              if isinstance(obj,dict):
                  for k in ('data','result','list'):
                      v=obj.get(k)
                      if isinstance(v,list): candidates=v
                      elif isinstance(v,dict):
                          for k2 in ('data','list'):
                              if isinstance(v.get(k2),list): candidates=v[k2]
              if not candidates and isinstance(obj,list): candidates=obj
              for row in candidates:
                  if isinstance(row,dict): records.append(row)
          # Deduplicate by infoCode/title/date.
          uniq=[]; seen=set()
          for row in records:
              key=(str(row.get('infoCode') or row.get('INFO_CODE') or row.get('artCode') or ''),str(row.get('title') or row.get('TITLE') or ''),str(row.get('publishDate') or row.get('REPORT_DATE') or ''))
              if key in seen: continue
              seen.add(key); uniq.append(row)
          records=uniq
          with open(os.path.join(OUT,'eastmoney_records.json'),'w',encoding='utf-8') as f:json.dump(records,f,ensure_ascii=False,indent=2)
          print('EASTMONEY RECORDS',len(records))
          for row in records:
              print('REC',json.dumps({k:row.get(k) for k in ['title','stockName','stockCode','orgSName','publishDate','infoCode','emRatingName','author']},ensure_ascii=False))

          # Collect candidate URLs from metadata and HTML.
          urls=[]
          def add_url(u,source=''):
              if not u or not isinstance(u,str): return
              u=html.unescape(u.strip().strip('"\''))
              if u.startswith('//'): u='https:'+u
              if u.startswith('/') and source: u=urllib.parse.urljoin(source,u)
              if u.startswith('http://'): u='https://'+u[7:]
              if u.startswith('https://'): urls.append(u)

          def walk(o):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if isinstance(v,str) and ('url' in k.lower() or '.pdf' in v.lower()): add_url(v)
                      walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(records)
          for row in records:
              code=str(row.get('infoCode') or row.get('INFO_CODE') or row.get('artCode') or '').strip()
              if code:
                  if not code.startswith('AP') and code.isdigit(): code='AP'+code
                  for host in ['https://pdf.dfcfw.com/pdf','https://pdf.dfcfw.com/pdf/H3']:
                      pass
                  for pat in [
                    f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                    f'https://pdf.dfcfw.com/pdf/H3_{code}_1.PDF',
                    f'https://pdf.dfcfw.com/pdf/H3{code}_1.pdf',
                    f'https://pdf.dfcfw.com/pdf/H3{code}_1.PDF',
                    f'https://pdf.dfcfw.com/pdf/{code}_1.pdf',
                  ]: add_url(pat)
          for r in sg_res+other_res:
              txt=r.text
              soup=BeautifulSoup(txt,'lxml')
              for tag in soup.find_all(True):
                  for attr in ['href','src','data-src','data-url','data-file','data-pdf','content']:
                      v=tag.get(attr)
                      if v: add_url(str(v),r.url)
              for m in re.findall(r'https?://[^\s"\'<>]+',txt): add_url(m,r.url)
              for m in re.findall(r'["\']([^"\']*(?:\.pdf|download|bgdown|16990)[^"\']*)["\']',txt,re.I): add_url(m,r.url)
          urls=list(dict.fromkeys(urls))
          with open(os.path.join(OUT,'candidate_urls.txt'),'w',encoding='utf-8') as f:f.write('\n'.join(urls))
          print('CANDIDATE URLS',len(urls))
          for u in urls[:500]: print('URL',u)

          # Download publicly accessible PDFs, with priority to Wuhan Fingu and known report ID.
          prioritized=[]
          for u in urls:
              score=0
              lu=u.lower()
              if '.pdf' in lu: score+=5
              if 'dfcfw' in lu: score+=5
              if '16990' in lu: score+=5
              if '002194' in lu: score+=3
              prioritized.append((score,u))
          prioritized.sort(key=lambda x:-x[0])
          downloaded=[]
          for score,u in prioritized[:300]:
              try:
                  rr=s.get(u,headers={**base_headers,'Referer':'https://data.eastmoney.com/report/002194.html'},timeout=(15,90),allow_redirects=True,stream=True)
                  data=rr.raw.read(12*1024*1024,decode_content=True)
                  ct=rr.headers.get('content-type','')
                  if data.startswith(b'%PDF'):
                      sha=hashlib.sha256(data).hexdigest()
                      if any(x['sha256']==sha for x in downloaded): continue
                      bn=safe_name(os.path.basename(urllib.parse.urlsplit(rr.url).path) or f'report_{len(downloaded)+1}.pdf')
                      if not bn.lower().endswith('.pdf'): bn+= '.pdf'
                      p=os.path.join(PDFS,bn)
                      with open(p,'wb') as f:f.write(data)
                      try:
                          reader=PdfReader(p); pages=len(reader.pages)
                          first=(reader.pages[0].extract_text() or '')[:2500]
                      except Exception as e:
                          pages=None; first='PDF_READ_ERROR '+repr(e)
                      rec={'url':u,'final_url':rr.url,'status':rr.status_code,'content_type':ct,'size':len(data),'sha256':sha,'file':bn,'pages':pages,'first_text':first}
                      downloaded.append(rec); print('PDF',json.dumps(rec,ensure_ascii=False))
                  elif '16990' in u or '.pdf' in u.lower():
                      print('NOTPDF',rr.status_code,len(data),ct,rr.url,data[:80])
              except Exception as e: print('PDFERR',u,repr(e))
          with open(os.path.join(OUT,'downloaded_pdfs.json'),'w',encoding='utf-8') as f:json.dump(downloaded,f,ensure_ascii=False,indent=2)
          with open(os.path.join(OUT,'request_index.json'),'w',encoding='utf-8') as f:json.dump(index,f,ensure_ascii=False,indent=2)
          print('DOWNLOADED',len(downloaded))
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-discovery-20261022
          path: out
          retention-days: 3
          if-no-files-found: error
