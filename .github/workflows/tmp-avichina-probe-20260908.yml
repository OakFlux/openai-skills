name: Probe AviChina annual and interim report links
on:
  push:
    branches:
      - tmp-avichina-probe-20260908
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages = [
              'https://treelazy.com/stock-en/hk/02357/conference',
              'https://treelazy.com/stock/hk/02357/conference',
              'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=1000010208',
              'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=zh&market=SEHK&stockId=1000010208',
          ]
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          results=[]
          for page_url in pages:
              rec={'page_url':page_url}
              try:
                  r=session.get(page_url,timeout=90,allow_redirects=True)
                  rec.update({'status':r.status_code,'final_url':r.url,'bytes':len(r.content)})
                  soup=BeautifulSoup(r.text,'lxml')
                  rows=[]
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a.get('href'))
                      if not href.lower().endswith('.pdf'):
                          continue
                      contexts=[]
                      for parent_name in ['tr','li','article']:
                          parent=a.find_parent(parent_name)
                          if parent:
                              contexts.append(' '.join(parent.get_text(' ',strip=True).split()))
                      parent=a.parent
                      for _ in range(4):
                          if parent:
                              txt=' '.join(parent.get_text(' ',strip=True).split())
                              if txt: contexts.append(txt)
                              parent=parent.parent
                      context=max(contexts,key=len) if contexts else ' '.join(a.get_text(' ',strip=True).split())
                      rows.append({'href':href,'anchor':' '.join(a.get_text(' ',strip=True).split()),'context':context[:2000]})
                  rec['pdf_rows']=rows
                  rec['matches']=[x for x in rows if any(k in (x['context']+' '+x['href']).lower() for k in [
                      'annual report','interim report','interim results','年度报告','年度報告','年报','年報','中期报告','中期報告','中期业绩','中期業績','2020','2021','2022','2023','2024','2025','2026'
                  ])]
                  print('PAGE',page_url,r.status_code,len(rows),'pdfs',len(rec['matches']),'matches',flush=True)
                  for item in rec['matches']:
                      print('MATCH',json.dumps(item,ensure_ascii=False),flush=True)
                  Path('output/'+re.sub(r'[^A-Za-z0-9]+','_',page_url)[-120:]+'.html').write_text(r.text,encoding='utf-8')
              except Exception as exc:
                  rec['error']=repr(exc)
                  print('ERR',page_url,repr(exc),flush=True)
              results.append(rec)
          Path('output/result.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: avichina-report-link-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
