name: Build Top Yunnong 301556 disclosure package v2

on:
  push:
    branches:
      - tmp-top-yunnong-301556-reports-20261104

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package official disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='托普云农_301556_全部年报_招股说明书_最新季报'
          rm -rf "$PACKAGE" /tmp/top_yunnong_render
          mkdir -p "$PACKAGE" /tmp/top_yunnong_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('托普云农_301556_全部年报_招股说明书_最新季报')
          company = '浙江托普云农科技股份有限公司'
          code = '301556'
          docs = [
              {
                  'order': 1,
                  'kind': 'prospectus',
                  'title': '首次公开发行股票并在创业板上市招股说明书',
                  'date': '2024-10-14',
                  'filename': '01_托普云农_首次公开发行股票并在创业板上市招股说明书_正式版.pdf',
                  'url': 'https://static.cninfo.com.cn/finalpage/2024-10-14/1221368038.PDF',
                  'min_pages': 300,
              },
              {
                  'order': 2,
                  'kind': 'annual',
                  'year': 2024,
                  'title': '2024年年度报告',
                  'date': '2025-04-21',
                  'filename': '02_托普云农_2024年年度报告_全文.pdf',
                  'url': 'https://static.cninfo.com.cn/finalpage/2025-04-21/1223155786.PDF',
                  'min_pages': 80,
              },
              {
                  'order': 3,
                  'kind': 'annual',
                  'year': 2025,
                  'title': '2025年年度报告',
                  'date': '2026-04-27',
                  'filename': '03_托普云农_2025年年度报告_全文.pdf',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-04-27/1225190687.PDF',
                  'min_pages': 80,
              },
              {
                  'order': 4,
                  'kind': 'quarter',
                  'year': 2026,
                  'title': '2026年第三季度报告',
                  'date': '2026-10-26',
                  'filename': '04_托普云农_2026年第三季度报告_全文.pdf',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-10-26/1225618029.PDF',
                  'min_pages': 5,
              },
          ]

          def make_session() -> requests.Session:
              s = requests.Session()
              s.trust_env = False
              retry = Retry(
                  total=8, connect=8, read=8, status=8, backoff_factor=1.0,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET'], raise_on_status=False,
              )
              s.mount('https://', HTTPAdapter(max_retries=retry))
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              })
              return s

          def extract_sample(reader: PdfReader, limit: int = 20) -> str:
              pages = len(reader.pages)
              indices = list(range(min(limit, pages)))
              if pages > limit:
                  indices.extend(range(max(limit, pages - 3), pages))
              chunks = []
              for index in dict.fromkeys(indices):
                  try:
                      chunks.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              return re.sub(r'\s+', '', '\n'.join(chunks))

          records = []
          for doc in docs:
              s = make_session()
              r = s.get(doc['url'], headers={'Referer': 'https://www.cninfo.com.cn/'}, timeout=(30, 300), allow_redirects=True)
              data = r.content
              print('DOWNLOAD', doc['title'], r.status_code, len(data), r.headers.get('content-type'), r.url)
              if r.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 100_000:
                  raise RuntimeError(f"{doc['title']}: HTTP={r.status_code}, bytes={len(data)}, type={r.headers.get('content-type')}")

              path = out / doc['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f"{doc['title']}: only {pages} pages, expected at least {doc['min_pages']}")

              compact = extract_sample(reader)
              if '托普云农' not in compact and company not in compact:
                  raise RuntimeError(f"{doc['title']}: company name not found")
              first = re.sub(r'\s+', '', reader.pages[0].extract_text() or '')

              if doc['kind'] == 'prospectus':
                  if '首次公开发行股票并在创业板上市招股说明书' not in compact:
                      raise RuntimeError('Formal prospectus title not found')
                  if any(term in first for term in ['招股意向书', '申报稿', '注册稿', '上会稿']):
                      raise RuntimeError('Non-final prospectus version detected')
              elif doc['kind'] == 'annual':
                  if doc['title'] not in compact:
                      raise RuntimeError(f"{doc['title']}: report title not found")
                  if '摘要' in first:
                      raise RuntimeError(f"{doc['title']}: summary detected")
                  if code not in compact:
                      raise RuntimeError(f"{doc['title']}: stock code not found")
              else:
                  if doc['title'] not in compact:
                      raise RuntimeError(f"{doc['title']}: report title not found")
                  if code not in compact:
                      raise RuntimeError(f"{doc['title']}: stock code not found")

              sha = hashlib.sha256(data).hexdigest()
              records.append({
                  **doc,
                  'pages': pages,
                  'bytes': len(data),
                  'source': r.url,
                  'sha256': sha,
              })
              print('VALIDATED_TEXT', path.name, 'pages=', pages, 'sha256=', sha)

          records.sort(key=lambda item: item['order'])
          lines = [
              '托普云农（301556）全部年度报告、招股说明书及最新季度报告资料包',
              '整理日期：2026-11-04', '',
              '收录说明：',
              '1. 托普云农于2024年10月17日在深交所创业板上市，上市后已披露的全部年度报告为2024年度报告和2025年度报告。',
              '2. 招股说明书采用2024年10月14日签署并披露的首次公开发行股票并在创业板上市正式发行版。',
              '3. 截至2026年11月4日，最新正式季度报告为2026年10月26日披露的2026年第三季度报告。',
              '4. 全部文件均直接下载自巨潮资讯正式公告附件，不含年度报告摘要、招股意向书、申报稿、注册稿或上会稿。',
              '', '文件清单：',
          ]
          sums = []
          for item in records:
              lines += [
                  f"{item['order']}. {item['filename']}",
                  f"   文档：{item['title']}",
                  f"   披露/签署日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件大小：{item['bytes']}字节",
                  f"   原始PDF：{item['source']}",
                  f"   SHA-256：{item['sha256']}", '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f"合计：4份PDF，其中招股说明书1份、年度报告2份、最新季度报告1份；共{sum(x['pages'] for x in records)}页，{sum(x['bytes'] for x in records)}字节。",
              '全部PDF均已核验公司名称、证券代码（适用文件）、报告期、实际页数、PDF结构及首末页渲染。',
              '资料仅用于信息查阅，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 4
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l 20 "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '托普云农|浙江托普云农科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/top_yunnong_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/top_yunnong_test.zip "$PACKAGE"
          unzip -t /tmp/top_yunnong_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/top_yunnong_test.zip | grep -c '\.pdf$')" -eq 4
          rm -f /tmp/top_yunnong_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Top-Yunnong-301556-all-annual-reports-prospectus-latest-quarter-v2
          path: 托普云农_301556_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
