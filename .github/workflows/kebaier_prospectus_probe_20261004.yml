name: Kebaier Prospectus PDF Probe

on:
  push:
    branches:
      - chatgpt-kebaier-filings-20261004
    paths:
      - .github/workflows/kebaier_prospectus_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Inspect detail page and candidate PDF paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import io, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          page='https://money.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=920066&id=10532533'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          r=s.get(page,timeout=60,allow_redirects=True)
          r.encoding=r.apparent_encoding or 'gb18030'
          print('DETAIL',r.status_code,len(r.content),r.url,r.encoding,r.headers.get('content-type'))
          open('output/detail.html','wb').write(r.content)
          print('HTML_BEGIN\n',r.text,'\nHTML_END')
          soup=BeautifulSoup(r.text,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
              links.append({'text':' '.join(a.get_text(' ',strip=True).split()),'href':urljoin(r.url,a['href'])})
          print('LINKS',json.dumps(links,ensure_ascii=False,indent=2))
          for pat in ('PDF','pdf','file.finance','10532533','招股说明书','download','iframe','src='):
              for m in re.finditer(re.escape(pat),r.text,re.I):
                  print('SNIP',pat,r.text[max(0,m.start()-500):m.end()+1000])

          candidates=[]
          for scheme in ('http','https'):
              for market in ('CNSEBJ_STOCK','SBGG','CNSESZ_STOCK','CNSESH_STOCK'):
                  candidates.append(f'{scheme}://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/{market}/2024/2024-10/2024-10-18/10532533.PDF')
          # Common alternate month formatting and nearby publication dates.
          for day in ('2024-10-17','2024-10-18','2024-10-21','2024-10-22'):
              for market in ('CNSEBJ_STOCK','SBGG'):
                  candidates.append(f'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/{market}/2024/2024-10/{day}/10532533.PDF')
          seen=set()
          found=[]
          for u in candidates:
              if u in seen: continue
              seen.add(u)
              try:
                  rr=s.get(u,headers={'Referer':page,'Accept':'application/pdf,*/*'},timeout=90,allow_redirects=True)
                  rec={'url':u,'status':rr.status_code,'bytes':len(rr.content),'final':rr.url,'ctype':rr.headers.get('content-type'),'head':repr(rr.content[:20])}
                  if rr.ok and rr.content.startswith(b'%PDF'):
                      reader=PdfReader(io.BytesIO(rr.content))
                      rec.update({'is_pdf':True,'pages':len(reader.pages),'encrypted':reader.is_encrypted})
                      open('output/found.pdf','wb').write(rr.content)
                      found.append(rec)
                  print('TRY',json.dumps(rec,ensure_ascii=False))
              except Exception as e:
                  print('ERR',u,repr(e))
          open('output/result.json','w',encoding='utf-8').write(json.dumps({'links':links,'found':found},ensure_ascii=False,indent=2))
          if not found:
              raise SystemExit('No prospectus PDF found')
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kebaier-prospectus-probe
          path: output/
          retention-days: 1
