name: Temporary China Feihe rendered report discovery

on:
  push:
    branches:
      - tmp-china-feihe-broker-reports-20260905

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser
        run: |
          python -m pip install playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Inspect rendered public pages
        run: |
          cat > /tmp/rendered_discovery.py <<'PY'
          import json, re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import requests

          out = Path('rendered_discovery')
          out.mkdir(exist_ok=True)
          pages = [
              ('search', 'https://www.fxbaogao.com/rp?keywords=%E4%B8%AD%E5%9B%BD%E9%A3%9E%E9%B9%A4&order=2&nop=-1'),
              ('view', 'https://www.fxbaogao.com/view?id=4846989'),
          ]
          result = {}
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              context = browser.new_context(
                  viewport={'width': 1440, 'height': 1800},
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36',
                  locale='zh-CN'
              )
              for name, url in pages:
                  page = context.new_page()
                  network = []
                  def on_response(resp):
                      u = resp.url
                      ct = (resp.headers.get('content-type') or '').lower()
                      if any(k in u.lower() for k in ['api','report','search','detail','view','image','pdf']) or 'json' in ct:
                          network.append({'url':u,'status':resp.status,'content_type':ct})
                  page.on('response', on_response)
                  try:
                      page.goto(url, wait_until='domcontentloaded', timeout=120000)
                      page.wait_for_timeout(12000)
                      html = page.content()
                      (out/f'{name}.html').write_text(html, encoding='utf-8')
                      anchors = page.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||a.textContent||'').trim(), href:a.href||''}))")
                      images = page.locator('img').evaluate_all("els => els.map(i => ({src:i.currentSrc||i.src||'', alt:i.alt||'', width:i.naturalWidth||0, height:i.naturalHeight||0}))")
                      body_text = page.locator('body').inner_text()
                      (out/f'{name}.txt').write_text(body_text, encoding='utf-8')
                      result[name] = {
                          'url': page.url,
                          'title': page.title(),
                          'anchors': [a for a in anchors if ('飞鹤' in a.get('text','') or '/detail/' in a.get('href','') or '/view?' in a.get('href',''))],
                          'images': [i for i in images if ('report-image' in i.get('src','') or '4846989' in i.get('src',''))],
                          'network': network,
                          'body_excerpt': body_text[:15000]
                      }
                      print('\nPAGE', name, page.url, page.title())
                      for a in result[name]['anchors'][:300]: print('ANCHOR', a)
                      for i in result[name]['images'][:300]: print('IMAGE', i)
                      for n in network[:500]: print('NET', n)
                  except Exception as exc:
                      result[name] = {'error':repr(exc),'network':network}
                      print('ERROR', name, repr(exc))
                  page.close()
              browser.close()

          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0'
          statuses = []
          for pageno in range(1, 41):
              url = f'https://public.fxbaogao.com/report-image/2025/05/19/4846989-{pageno}.png'
              r = session.get(url, timeout=30)
              statuses.append({'page':pageno,'status':r.status_code,'content_type':r.headers.get('content-type',''),'size':len(r.content)})
              print('IMAGE_STATUS', pageno, r.status_code, r.headers.get('content-type'), len(r.content))
          result['image_statuses'] = statuses
          (out/'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python /tmp/rendered_discovery.py

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: feihe-rendered-public-report-discovery
          path: rendered_discovery
          retention-days: 1
