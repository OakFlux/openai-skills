name: Package Hisun 600267 broker research reports 20261022

on:
  push:
    branches:
      - tmp/hisun-600267-broker-package-20261022-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = "600267"
          SHORT = "海正药业"
          FULL = "浙江海正药业股份有限公司"
          PREPARED = "2026-10-22"
          ROOT_NAME = "海正药业_600267_券商公司研究报告_3份"
          OUTPUT_ZIP = "hisun_600267_broker_reports.zip"
          ROOT = Path(ROOT_NAME)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          reports = [
              {
                  "info_code": "AP202205231567313209",
                  "broker": "中银证券",
                  "date": "2022-05-23",
                  "authors": "邓周宇",
                  "title": "与旺实生物达成战略合作协议并受托生产新冠口服药VV116",
                  "rating": "增持",
                  "metadata_pages": 11,
                  "min_pages": 8,
                  "filename": "01_20220523_中银证券_受托生产新冠口服药VV116.pdf",
              },
              {
                  "info_code": "AP201901151284795828",
                  "broker": "太平洋证券",
                  "date": "2019-01-15",
                  "authors": "杜佐远、王斌",
                  "title": "生物药+小分子创新药步入收获期",
                  "rating": "买入",
                  "metadata_pages": 10,
                  "min_pages": 8,
                  "filename": "02_20190115_太平洋证券_生物药与小分子创新药步入收获期.pdf",
              },
              {
                  "info_code": "AP201908231344985545",
                  "broker": "西南证券",
                  "date": "2019-08-23",
                  "authors": "朱国广、陈铁林、陈进",
                  "title": "2019年半年报点评：基本面逐步向好，多个重磅产品即将获批",
                  "rating": "增持",
                  "metadata_pages": 11,
                  "min_pages": 8,
                  "filename": "03_20190823_西南证券_基本面逐步向好多个重磅产品即将获批.pdf",
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def download_pdf(info_code: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf",
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  "User-Agent": session.headers["User-Agent"],
                                  "Referer": f"https://data.eastmoney.com/report/info/{info_code}.html",
                                  "Accept": "application/pdf,*/*;q=0.8",
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          last = {
                              "url": url,
                              "status": response.status_code,
                              "content_type": response.headers.get("content-type", ""),
                              "bytes": len(response.content),
                              "final_url": response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b"%PDF-" and len(response.content) > 80_000:
                              return response.content, url, last
                      except Exception as exc:
                          last = {"url": url, "error": repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed for {info_code}: {last}")

          manifest: list[dict[str, Any]] = []
          identity_tokens = [SHORT, FULL, CODE, "海正药业股份"]

          for spec in reports:
              data, pdf_url, download_meta = download_pdf(spec["info_code"])
              path = ROOT / spec["filename"]
              path.write_bytes(data)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < spec["min_pages"]:
                  raise RuntimeError(f"Too few pages for {path.name}: {pages} < {spec['min_pages']}")
              if abs(pages - spec["metadata_pages"]) > 2:
                  raise RuntimeError(
                      f"Page count differs materially for {path.name}: actual={pages}, metadata={spec['metadata_pages']}"
                  )

              text = ""
              for page in reader.pages[:min(40, pages)]:
                  try:
                      text += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              compact_text = re.sub(r"\s+", "", text)
              if not any(re.sub(r"\s+", "", token) in compact_text for token in identity_tokens):
                  raise RuntimeError(f"Issuer identity check failed for {path.name}")

              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEW / path.stem
              subprocess.run(
                  [
                      "pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "130",
                      "-singlefile", str(path), str(preview_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(preview_prefix) + ".png")
              if not preview_file.exists() or preview_file.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview rendering failed for {path.name}")

              manifest.append({
                  **spec,
                  "document_form": "券商原始PDF",
                  "actual_pages": pages,
                  "bytes": path.stat().st_size,
                  "sha256": sha256_file(path),
                  "source_page": f"https://data.eastmoney.com/report/info/{spec['info_code']}.html",
                  "pdf_url": pdf_url,
                  "download_meta": download_meta,
                  "preview_file": str(Path("首页预览") / preview_file.name),
              })

          readme = [
              f"海正药业（{CODE}.SH）券商公司研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录3份公开渠道可直接取得并通过结构核验的券商原始PDF。",
              "优先选择篇幅相对完整、研究主题清晰且来自不同券商的公司研究资料；普通短篇财报快评未优先收录。",
              "",
              "检索说明：另检索到西部证券2023年35页首次覆盖报告《资产重估、困境反转，盈利能力稳步提升》，",
              "但公开页面的原始PDF下载需要登录或授权，因此未绕过访问限制，也未用网页摘要冒充原始PDF。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；研究员：{item['authors']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   评级：{item['rating']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['source_page']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、元数据页数匹配、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "excluded_gated_report": {
                  "broker": "西部证券",
                  "date": "2023-09-27",
                  "title": "首次覆盖报告：资产重估、困境反转，盈利能力稳步提升",
                  "pages": 35,
                  "reason": "公开来源要求登录或授权下载原始PDF，未绕过访问限制",
              },
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  "文件名", "文件性质", "券商", "研究员", "发布日期", "标题", "评级",
                  "页数", "字节数", "SHA-256", "来源页面", "PDF地址",
              ])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["document_form"], item["broker"], item["authors"],
                      item["date"], item["title"], item["rating"], item["actual_pages"],
                      item["bytes"], item["sha256"], item["source_page"], item["pdf_url"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path(OUTPUT_ZIP)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": sha256_file(zip_path),
              "report_count": len(manifest),
              "files": [
                  {
                      "name": item["filename"],
                      "broker": item["broker"],
                      "date": item["date"],
                      "title": item["title"],
                      "pages": item["actual_pages"],
                      "bytes": item["bytes"],
                      "sha256": item["sha256"],
                  }
                  for item in manifest
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hisun-600267-broker-reports-20261022
          path: hisun_600267_broker_reports.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
