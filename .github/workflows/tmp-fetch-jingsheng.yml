name: Temporary Fetch Jingsheng Filings

on:
  push:
    branches:
      - tmp/fetch-jingsheng-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests

          STOCK_ID = '688478'
          ROOT = Path('jingsheng_package')
          PDF_DIR = ROOT / '01_招股说明书及定期报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })

          documents = [
              {
                  'kind': 'annual_report',
                  'label': '2023年年度报告',
                  'date': '2024-04-30',
                  'filename': '02_晶升股份_2023年年度报告.pdf',
                  'min_pages': 100,
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-30/10158356.PDF'],
                  'required_any': ['晶升股份', '南京晶升装备股份有限公司', '688478'],
                  'required_title': '2023年年度报告',
              },
              {
                  'kind': 'annual_report',
                  'label': '2024年年度报告',
                  'date': '2025-04-29',
                  'filename': '03_晶升股份_2024年年度报告.pdf',
                  'min_pages': 100,
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-29/11044369.PDF'],
                  'required_any': ['晶升股份', '南京晶升装备股份有限公司', '688478'],
                  'required_title': '2024年年度报告',
              },
              {
                  'kind': 'annual_report',
                  'label': '2025年年度报告',
                  'date': '2026-04-30',
                  'filename': '04_晶升股份_2025年年度报告.pdf',
                  'min_pages': 100,
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-30/12283344.PDF'],
                  'required_any': ['晶升股份', '南京晶升装备股份有限公司', '688478'],
                  'required_title': '2025年年度报告',
              },
              {
                  'kind': 'half_year_report',
                  'label': '2026年半年度报告',
                  'date': '2026-08-28',
                  'filename': '05_晶升股份_2026年半年度报告.pdf',
                  'min_pages': 50,
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-28/12563011.PDF'],
                  'required_any': ['晶升股份', '南京晶升装备股份有限公司', '688478'],
                  'required_title': '2026年半年度报告',
              },
          ]

          def decode_response(response):
              raw = response.content
              for encoding in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      continue
              return raw.decode('utf-8', errors='ignore')

          def normalize_pdf_url(value):
              value = html.unescape(unquote(str(value))).replace('\\/', '/').strip()
              if value.startswith('//'):
                  return 'https:' + value
              if value.startswith('http://') or value.startswith('https://'):
                  return value
              if value.startswith('/'):
                  return 'https://static.sse.com.cn' + value
              return urljoin('https://static.sse.com.cn/', value)

          def collect_strings(value):
              if isinstance(value, dict):
                  for child in value.values():
                      yield from collect_strings(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from collect_strings(child)
              elif isinstance(value, str):
                  yield value

          def candidate_pdf_urls_from_json(value):
              urls = []
              def walk(node):
                  if isinstance(node, dict):
                      blob = json.dumps(node, ensure_ascii=False)
                      exact = (
                          '招股说明书' in blob
                          and '招股意向书' not in blob
                          and '申报稿' not in blob
                          and '摘要' not in blob
                          and ('晶升' in blob or STOCK_ID in blob)
                      )
                      if exact:
                          for string in collect_strings(node):
                              if '.pdf' in string.lower():
                                  for match in re.findall(r'(?:https?:)?//[^\s\"\'<>]+?\.pdf|/[^\s\"\'<>]+?\.pdf', string, flags=re.I):
                                      url = normalize_pdf_url(match)
                                      if url not in urls:
                                          urls.append(url)
                      for child in node.values():
                          walk(child)
                  elif isinstance(node, list):
                      for child in node:
                          walk(child)
              walk(value)
              return urls

          def query_sse_for_prospectus():
              endpoint = 'https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
              attempts = [
                  {'keyWord': '招股说明书', 'reportType2': 'LSGG', 'reportType': 'ALL'},
                  {'keyWord': '招股说明书', 'reportType2': '', 'reportType': 'ALL'},
                  {'keyWord': '', 'reportType2': 'LSGG', 'reportType': 'FXSSGG'},
                  {'keyWord': '', 'reportType2': 'LSGG', 'reportType': 'ALL'},
              ]
              found = []
              for index, extra in enumerate(attempts, start=1):
                  callback = f'jsonpCallback688478{index}'
                  params = {
                      'jsonCallBack': callback,
                      'isPagination': 'true',
                      'productId': STOCK_ID,
                      'securityType': '0101,120100,020100,020200,120200',
                      'beginDate': '2023-04-01',
                      'endDate': '2023-04-30',
                      'pageHelp.pageSize': '100',
                      'pageHelp.pageCount': '50',
                      'pageHelp.pageNo': '1',
                      'pageHelp.beginPage': '1',
                      'pageHelp.cacheSize': '1',
                      'pageHelp.endPage': '5',
                      **extra,
                  }
                  response = session.get(
                      endpoint,
                      params=params,
                      headers={'Referer': 'https://www.sse.com.cn/disclosure/listedinfo/announcement/'},
                      timeout=60,
                  )
                  response.raise_for_status()
                  text = decode_response(response)
                  first = text.find('{')
                  last = text.rfind('}')
                  if first < 0 or last <= first:
                      print(f'SSE attempt {index}: no JSON object, bytes={len(response.content)}', file=sys.stderr)
                      continue
                  try:
                      payload = json.loads(text[first:last + 1])
                  except Exception as exc:
                      print(f'SSE attempt {index}: JSON parse failure {exc}', file=sys.stderr)
                      continue
                  urls = candidate_pdf_urls_from_json(payload)
                  print(f'SSE attempt {index}: prospectus PDF candidates={urls}')
                  for url in urls:
                      if url not in found:
                          found.append(url)
              return found

          def candidate_urls_from_sina_issue_page():
              listing = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/{STOCK_ID}.phtml'
              response = session.get(listing, headers={'Referer': 'https://vip.stock.finance.sina.com.cn/'}, timeout=60)
              response.raise_for_status()
              text = html.unescape(decode_response(response)).replace('\\/', '/')
              urls = []
              for match in re.findall(r'https?://[^\s\"\'<>]+?\.PDF', text, flags=re.I):
                  url = normalize_pdf_url(match)
                  if url not in urls:
                      urls.append(url)
              ids = []
              for pattern in [r'(?:[?&]|%3F|%26)id(?:=|%3D)(\d{6,10})', r'vCB_AllBulletinDetail\.php[^\"\'<>]*?(\d{6,10})']:
                  for match in re.findall(pattern, text, flags=re.I):
                      if match not in ids:
                          ids.append(match)
              print(f'Sina issue listing: bytes={len(response.content)}, IDs={ids}, direct PDFs={urls}')
              for bulletin_id in ids:
                  detail = f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid={STOCK_ID}'
                  try:
                      detail_response = session.get(detail, headers={'Referer': listing}, timeout=60)
                      detail_response.raise_for_status()
                      detail_text = html.unescape(decode_response(detail_response)).replace('\\/', '/')
                  except Exception as exc:
                      print(f'Sina detail {bulletin_id} failed: {exc}', file=sys.stderr)
                      continue
                  visible = re.sub(r'<[^>]+>', ' ', detail_text)
                  visible = re.sub(r'\s+', ' ', visible)
                  if (
                      '招股说明书' in visible
                      and '招股意向书' not in visible[:3000]
                      and '申报稿' not in visible[:3000]
                      and '摘要' not in visible[:3000]
                  ):
                      for match in re.findall(r'https?://[^\s\"\'<>]+?\.PDF', detail_text, flags=re.I):
                          url = normalize_pdf_url(match)
                          if url not in urls:
                              urls.append(url)
              return urls

          def looks_like_pdf(raw):
              return len(raw) > 100_000 and raw.lstrip().startswith(b'%PDF') and b'%%EOF' in raw[-16384:]

          def get_pdf(url):
              with session.get(url, headers={'Referer': 'https://www.sse.com.cn/'}, timeout=150, allow_redirects=True, stream=True) as response:
                  response.raise_for_status()
                  chunks = bytearray()
                  for chunk in response.iter_content(chunk_size=1024 * 256):
                      if chunk:
                          chunks.extend(chunk)
                  raw = bytes(chunks)
                  if not looks_like_pdf(raw):
                      raise RuntimeError(f'not a complete PDF: type={response.headers.get("content-type")}, bytes={len(raw)}, head={raw[:20]!r}')
                  return raw

          def pdf_page_count(path):
              completed = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', completed.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_page_range_text(path, first, last):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as temp:
                  output = Path(temp.name)
              try:
                  completed = subprocess.run(
                      ['pdftotext', '-f', str(first), '-l', str(last), '-enc', 'UTF-8', str(path), str(output)],
                      capture_output=True,
                      text=True,
                  )
                  if completed.returncode != 0:
                      return ''
                  return output.read_text(encoding='utf-8', errors='ignore')
              finally:
                  output.unlink(missing_ok=True)

          prospectus_candidates = query_sse_for_prospectus()
          for url in candidate_urls_from_sina_issue_page():
              if url not in prospectus_candidates:
                  prospectus_candidates.append(url)
          print(f'All prospectus candidates: {prospectus_candidates}')

          prospectus_item = {
              'kind': 'prospectus',
              'label': '首次公开发行股票并在科创板上市招股说明书',
              'date': '2023-04-17',
              'filename': '01_晶升股份_首次公开发行股票并在科创板上市招股说明书.pdf',
              'min_pages': 250,
              'required_any': ['南京晶升装备股份有限公司', '晶升股份', '688478'],
              'required_title': '招股说明书',
          }
          prospectus_path = PDF_DIR / prospectus_item['filename']
          prospectus_errors = []
          for candidate in prospectus_candidates:
              try:
                  raw = get_pdf(candidate)
                  prospectus_path.write_bytes(raw)
                  pages = pdf_page_count(prospectus_path)
                  first_text = extract_page_range_text(prospectus_path, 1, min(25, pages))
                  if pages < prospectus_item['min_pages']:
                      raise RuntimeError(f'only {pages} pages')
                  if not any(term in first_text for term in prospectus_item['required_any']):
                      raise RuntimeError('company identity not found')
                  if '招股说明书' not in first_text:
                      raise RuntimeError('prospectus title not found')
                  if '招股意向书' in first_text[:10000] or '申报稿' in first_text[:10000]:
                      raise RuntimeError('candidate is an intention/application draft rather than the final prospectus')
                  prospectus_item['urls'] = [candidate]
                  print(f'FINAL PROSPECTUS SELECTED: {candidate}, pages={pages}')
                  break
              except Exception as exc:
                  prospectus_errors.append(f'{candidate}: {exc}')
                  prospectus_path.unlink(missing_ok=True)
          if not prospectus_path.exists():
              raise RuntimeError('Unable to obtain the final prospectus:\n' + '\n'.join(prospectus_errors))

          documents.insert(0, prospectus_item)

          def download_regular(item):
              path = PDF_DIR / item['filename']
              errors = []
              for url in item['urls']:
                  for attempt in range(1, 4):
                      try:
                          print(f'GET {item["label"]} attempt={attempt}: {url}')
                          path.write_bytes(get_pdf(url))
                          return path, url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f'Unable to download {item["label"]}:\n' + '\n'.join(errors))

          manifest = []
          sha_lines = []
          for item in documents:
              path = PDF_DIR / item['filename']
              source_url = item['urls'][0]
              if item['kind'] != 'prospectus':
                  path, source_url = download_regular(item)
              raw = path.read_bytes()
              pages = pdf_page_count(path)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short document: {item["label"]} has {pages} pages')
              first_text = extract_page_range_text(path, 1, min(25, pages))
              identity_ok = any(term in first_text for term in item['required_any'])
              title_ok = item['required_title'] in first_text
              if not identity_ok or not title_ok:
                  raise RuntimeError(f'Identity/title check failed for {item["label"]}: identity={identity_ok}, title={title_ok}')
              sha = hashlib.sha256(raw).hexdigest()
              rel = str(path.relative_to(ROOT))
              record = {
                  'document_type': item['kind'],
                  'title': item['label'],
                  'disclosure_date': item['date'],
                  'file': rel,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'source_url': source_url,
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': identity_ok,
                  'title_text_matched': title_ok,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {rel}')
              print(f'VERIFIED {item["label"]}: pages={pages}, bytes={len(raw)}')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '南京晶升装备股份有限公司（晶升股份，688478）公开披露文件包',
              '',
              '内容范围：',
              '1. 2023年4月17日正式披露的首次公开发行股票并在科创板上市招股说明书；',
              '2. 上市以来全部独立年度报告：2023年、2024年、2025年年度报告；',
              '3. 截至2026年8月29日最新披露的2026年半年度报告。',
              '',
              '说明：公司于2023年4月24日在科创板上市，因此不存在单独披露的上市公司2022年年度报告。',
              '公司2020—2022年度经审计历史财务数据已包含在正式招股说明书中。',
              '',
              '校验项目：PDF文件头与EOF、pdfinfo可解析页数、公司名称和标题文字层、SHA-256、ZIP CRC。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f'- {record["title"]}',
                  f'  披露日期：{record["disclosure_date"]}',
                  f'  文件：{record["file"]}',
                  f'  页数：{record["pages"]}',
                  f'  大小：{record["bytes"]} bytes',
                  f'  SHA256：{record["sha256"]}',
                  f'  PDF来源：{record["source_url"]}',
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '晶升股份_688478_全部年报_招股说明书_2026年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: jingsheng-equipment-filings
          path: 晶升股份_688478_全部年报_招股说明书_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
