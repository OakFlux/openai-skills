name: Download public Ningbo Port research PDFs 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-public-report-download-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install validators
        run: python -m pip install --quiet requests pypdf
      - name: Download and validate public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('public_reports'); out.mkdir()
          reports=[
            ('2017_安信证券_宁波港公司深度分析_非凡大港斩获殊勋茂绩.pdf','https://dr.fxbaogao.com/report/2017/10/10/118940.pdf'),
            ('2013_中泰证券_守正出奇的综合港口物流运营商.pdf','https://dr.fxbaogao.com/report/2013/02/04/1690672.pdf'),
            ('2010_国金证券_腹地资源水深优势成就国际综合大港.pdf','https://dr.fxbaogao.com/report/2010/09/15/1608827.pdf'),
          ]
          session=requests.Session()
          session.trust_env=False
          session.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/','Accept':'application/pdf,*/*'})
          records=[]
          for name,url in reports:
              rec={'filename':name,'source_url':url}
              try:
                  r=session.get(url,timeout=(20,120),allow_redirects=True)
                  rec.update({'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'final_url':r.url,'prefix':r.content[:8].hex()})
                  print(json.dumps(rec,ensure_ascii=False),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                      path=out/name
                      path.write_bytes(r.content)
                      rec['pages']=len(PdfReader(str(path),strict=False).pages)
                      rec['sha256']=hashlib.sha256(r.content).hexdigest()
                      print('SAVED',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as exc:
                  rec['error']=repr(exc)
                  print('ERROR',json.dumps(rec,ensure_ascii=False),flush=True)
              records.append(rec)
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-public-research-pdfs
          path: public_reports
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
