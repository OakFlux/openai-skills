name: Build Fulin Precision broker deep report previews 20260928

on:
  push:
    paths:
      - '.github/workflows/fulin-precision-300432-broker-deep-reports-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Discover public previews, build PDFs and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from datetime import datetime
          from io import BytesIO
          from pathlib import Path
          from typing import Any

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '富临精工_300432_券商深度报告_公开预览版'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)
          work = Path('_fulin_report_work')
          work.mkdir(exist_ok=True)

          queries = [
              '富临精工',
              '300432',
              '富临精工 深度报告',
              '富临精工 首次覆盖',
              '富临精工 公司深度',
              '富临精工 高压密铁锂',
              '富临精工 机器人业务',
              '富临精工 汽零 铁锂 机器人',
              '富临精工 高压实磷酸铁锂',
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url: str, payload: dict[str, Any]) -> dict[str, Any]:
              last = None
              for attempt in range(6):
                  try:
                      r = session.post(url, json=payload, timeout=(20, 120))
                      last = {'status':r.status_code,'text':r.text[:500]}
                      if r.status_code == 200:
                          return r.json()
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'POST failed {url}: {last}')

          def collect_records(obj: Any) -> list[dict[str, Any]]:
              out: list[dict[str, Any]] = []
              def walk(x: Any) -> None:
                  if isinstance(x, dict):
                      if isinstance(x.get('id'), int) and isinstance(x.get('name'), str):
                          out.append(x)
                      for v in x.values():
                          walk(v)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v)
              walk(obj)
              return list({int(r['id']):r for r in out}.values())

          search_log: dict[str, Any] = {}
          record_pool: dict[int, dict[str, Any]] = {}
          for q in queries:
              payload = {
                  'device':1,'hideTrader':0,'onlyTitle':1,'order':0,
                  'page':1,'pageSize':100,'keyword':q,'pageCount':0,
                  'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'',
              }
              try:
                  data = post_json('https://api.sdyanbao.com/api/file/search', payload)
                  search_log[q] = data
                  for r in collect_records(data):
                      record_pool[int(r['id'])] = r
              except Exception as exc:
                  search_log[q] = {'error':repr(exc)}

          def norm(s: str) -> str:
              return re.sub(r'[\s（）()：:，,。；;、·—\-_/&＋+“”"‘’]+','',s or '').lower()

          def parse_date(rec: dict[str, Any]) -> str:
              raw = str(rec.get('time_text') or rec.get('publish_time') or rec.get('created_at') or '')
              m = re.search(r'(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})', raw)
              if m:
                  return f'{int(m.group(1)):04d}-{int(m.group(2)):02d}-{int(m.group(3)):02d}'
              m = re.search(r'(20\d{2})(\d{2})(\d{2})', raw)
              if m:
                  return f'{m.group(1)}-{m.group(2)}-{m.group(3)}'
              return ''

          def score(rec: dict[str, Any]) -> tuple[int, str, int]:
              name = str(rec.get('name') or '')
              n = norm(name)
              pages = int(rec.get('page_count') or 0)
              s = 0
              if '富临精工' in name or '300432' in name:
                  s += 40
              positives = [
                  ('首次覆盖',38),('深度报告',36),('公司深度',36),('深度研究',34),
                  ('研究报告',20),('深度',18),('机器人业务新征程',16),
                  ('高压密铁锂领军者',16),('汽零+铁锂',12),('汽零铁锂',12),
              ]
              for term, weight in positives:
                  if norm(term) in n:
                      s += weight
              negatives = [
                  ('年报点评',-38),('中报点评',-38),('半年报点评',-38),
                  ('一季报点评',-38),('三季报点评',-38),('季报点评',-35),
                  ('事件点评',-28),('业绩点评',-28),('公告点评',-28),
                  ('跟踪报告',-16),('快报点评',-28),('点评报告',-25),
              ]
              for term, weight in negatives:
                  if norm(term) in n:
                      s += weight
              if pages >= 30: s += 20
              elif pages >= 20: s += 16
              elif pages >= 15: s += 12
              elif pages >= 10: s += 7
              elif pages and pages <= 5: s -= 20
              date = parse_date(rec)
              if date:
                  try:
                      year = int(date[:4])
                      s += max(0, year - 2020)
                  except Exception:
                      pass
              return (s, date, pages)

          ranked = sorted(record_pool.values(), key=score, reverse=True)
          candidate_log = [
              {'id':r.get('id'),'name':r.get('name'),'page_count':r.get('page_count'),'time_text':r.get('time_text'),'score':score(r)[0]}
              for r in ranked[:80]
          ]

          chosen = []
          used_titles = set()
          used_brokers = set()
          for rec in ranked:
              if len(chosen) >= 3:
                  break
              name = str(rec.get('name') or '')
              if not ('富临精工' in name or '300432' in name):
                  continue
              sc, _, _ = score(rec)
              if sc < 55:
                  continue
              if any(x in name for x in ('年报点评','中报点评','半年报点评','一季报点评','三季报点评','季报点评','事件点评','业绩点评','公告点评')):
                  continue
              try:
                  detail = post_json('https://api.sdyanbao.com/api/file/detail', {'id':int(rec['id'])})
              except Exception:
                  continue
              data = detail.get('data') if isinstance(detail, dict) else None
              if not isinstance(data, dict) or not data.get('page_url') or not data.get('page_count'):
                  continue
              total_pages = int(data.get('page_count') or 0)
              if total_pages < 8:
                  continue
              source_name = str(data.get('name') or name)
              title_key = norm(source_name)
              if title_key in used_titles:
                  continue
              broker = source_name.split('-',1)[0].strip() if '-' in source_name else ''
              if broker and broker in used_brokers and len(chosen) < 2:
                  continue
              chosen.append((rec, data))
              used_titles.add(title_key)
              if broker:
                  used_brokers.add(broker)

          if len(chosen) < 2:
              # Fallback: allow report updates with at least 10 pages, still avoiding quarterly reviews.
              for rec in ranked:
                  if len(chosen) >= 3:
                      break
                  name = str(rec.get('name') or '')
                  if not ('富临精工' in name or '300432' in name):
                      continue
                  if int(rec['id']) in {int(x[0]['id']) for x in chosen}:
                      continue
                  if any(x in name for x in ('年报点评','中报点评','半年报点评','一季报点评','三季报点评','季报点评')):
                      continue
                  try:
                      detail = post_json('https://api.sdyanbao.com/api/file/detail', {'id':int(rec['id'])})
                      data = detail.get('data') if isinstance(detail, dict) else None
                      if not isinstance(data, dict) or not data.get('page_url') or int(data.get('page_count') or 0) < 8:
                          continue
                      chosen.append((rec,data))
                  except Exception:
                      continue

          if len(chosen) < 2:
              raise RuntimeError(f'Only {len(chosen)} suitable public previews found; need at least 2')

          def fetch_image(url: str) -> bytes:
              last = None
              for attempt in range(6):
                  try:
                      r = session.get(url, timeout=(20,120), allow_redirects=True, headers={
                          'User-Agent':session.headers['User-Agent'],
                          'Referer':'https://www.sdyanbao.com/',
                          'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                      })
                      last = {'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type','')}
                      if r.status_code == 200 and len(r.content) > 10000:
                          with Image.open(BytesIO(r.content)) as im:
                              im.verify()
                          return r.content
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Image download failed {url}: {last}')

          def safe_name(text: str, limit: int = 80) -> str:
              text = re.sub(r'[\\/:*?"<>|]+','_',text)
              text = re.sub(r'\s+',' ',text).strip()
              return text[:limit]

          manifest = []
          for idx, (rec, data) in enumerate(chosen[:3], 1):
              source_name = str(data.get('name') or rec.get('name') or '')
              total_pages = int(data['page_count'])
              preview_pages = min(10, total_pages)
              base = str(data['page_url']).rstrip('/')
              report_id = int(data.get('id') or rec['id'])
              report_date = parse_date({**rec, **data}) or parse_date(rec) or '日期不详'
              broker = source_name.split('-',1)[0].strip() if '-' in source_name else '券商'
              title = source_name.split('-',1)[1].strip() if '-' in source_name else source_name
              wdir = work / f'r{idx}'
              wdir.mkdir(exist_ok=True)
              page_files = []
              for pno in range(preview_pages):
                  raw = fetch_image(f'{base}/{pno}.png')
                  src = wdir / f'{pno:02d}_src.png'
                  src.write_bytes(raw)
                  with Image.open(src) as im:
                      rgba = im.convert('RGBA')
                      white = Image.new('RGBA', rgba.size, (255,255,255,255))
                      white.alpha_composite(rgba)
                      rgb = white.convert('RGB')
                      out = wdir / f'{pno:02d}.jpg'
                      rgb.save(out, 'JPEG', quality=95, subsampling=0)
                      page_files.append(out)

              pdf_name = f'{idx:02d}_{safe_name(broker,20)}_富临精工_{safe_name(title,58)}_公开预览前{preview_pages}页_{report_date}.pdf'
              pdf_path = root / pdf_name
              imgs = [Image.open(p).convert('RGB') for p in page_files]
              try:
                  imgs[0].save(pdf_path, save_all=True, append_images=imgs[1:], resolution=150.0, quality=95)
              finally:
                  for im in imgs:
                      im.close()

              reader = PdfReader(str(pdf_path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != preview_pages:
                  raise RuntimeError(f'PDF page mismatch {pdf_name}: {actual_pages} vs {preview_pages}')
              subprocess.run(['qpdf','--check',str(pdf_path)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = preview_dir / pdf_path.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(pdf_path),str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              cover = Path(str(prefix)+'.png')
              if not cover.exists() or cover.stat().st_size < 10000:
                  raise RuntimeError(f'Cover render failed: {pdf_name}')
              sha = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              manifest.append({
                  'source_report_id':report_id,
                  'source_record_name':source_name,
                  'broker':broker,
                  'title':title,
                  'date':report_date,
                  'source_detail_page':f'https://www.sdyanbao.com/detail/{report_id}',
                  'page_image_base':base,
                  'original_total_pages':total_pages,
                  'public_preview_pages':preview_pages,
                  'pdf_file':pdf_name,
                  'actual_pdf_pages':actual_pages,
                  'bytes':pdf_path.stat().st_size,
                  'sha256':sha,
                  'cover_preview':str(Path('首页预览')/cover.name),
                  'document_nature':'公开预览原页；非券商原始完整PDF',
                  'validation':['all preview images downloaded','image integrity','white-background compositing','PDF page count','qpdf structure','cover render'],
              })

          readme = [
              '富临精工（300432.SZ）券商深度报告公开预览资料包',
              '整理日期：2026-09-28',
              '',
              f'本包收录{len(manifest)}份券商公司深度、首次覆盖或较完整公司研究报告的公开预览原页。',
              '完整原始PDF在相关研报平台需要账户或下载权限；本包未绕过登录、会员或付费限制，因此所有PDF均明确标注为“公开预览版”。',
              '',
          ]
          for i,r in enumerate(manifest,1):
              readme += [
                  f"{i}. {r['broker']}：《{r['title']}》",
                  f"   日期：{r['date']}；原报告：{r['original_total_pages']}页；本PDF：公开预览前{r['public_preview_pages']}页",
                  f"   来源页面：{r['source_detail_page']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += [
              '报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：预览图片完整性、白底校正、PDF页数、PDF结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'search_candidates.json').write_text(json.dumps(candidate_log,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'search_api_results.json').write_text(json.dumps(search_log,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['pdf_file']}\n" for r in manifest),encoding='utf-8')

          zpath = Path(PACKAGE + f'_{len(manifest)}份.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=len(manifest):
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)} vs {len(manifest)}')
          english = Path(f'Fulin_Precision_300432_Broker_Deep_Reports_Public_Previews_{len(manifest)}.zip')
          english.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: fulin-precision-300432-broker-deep-reports-public-previews-final
          path: |
            富临精工_300432_券商深度报告_公开预览版_*.zip
            Fulin_Precision_300432_Broker_Deep_Reports_Public_Previews_*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
