name: Probe China Longgong 03339 report data endpoint 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-03339-doc-endpoint-probe-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query official report data endpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('endpoint'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'text/html, */*; q=0.01',
            'X-Requested-With':'XMLHttpRequest',
            'Referer':'https://www.lonking.cn/invest/periodic-reports.htm',
          })
          hosts=['https://www.lonking.cn','https://www.lonkinggroup.com','http://www.lonkinggroup.com']
          channels=['121']
          records=[]
          for hi,host in enumerate(hosts,1):
            for channel in channels:
              url=host+'/ext/ajax_doc.jsp'
              for method in ['post','get']:
                try:
                  kwargs={'data':{'flag':'doc','channelId':channel}} if method=='post' else {'params':{'flag':'doc','channelId':channel}}
                  r=getattr(s,method)(url,timeout=(20,120),allow_redirects=True,**kwargs)
                  print('REQUEST',method,url,r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
                  name=f'{hi}_{channel}_{method}.html'
                  (out/name).write_bytes(r.content)
                  print(r.text[:50000],flush=True)
                  soup=BeautifulSoup(r.text,'lxml')
                  links=[]
                  for a in soup.find_all('a',href=True):
                    item={'href':urljoin(r.url,a.get('href')),'label':' '.join(a.get_text(' ',strip=True).split())}
                    links.append(item); print('LINK',json.dumps(item,ensure_ascii=False),flush=True)
                  (out/f'{hi}_{channel}_{method}_links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
                  records.append({'host':host,'channel':channel,'method':method,'status':r.status_code,'final':r.url,'bytes':len(r.content),'links':len(links)})
                except Exception as e:
                  print('ERROR',method,url,repr(e),flush=True)
                  records.append({'host':host,'channel':channel,'method':method,'error':repr(e)})
              try:
                r=s.get(url,params={'flag':'count','channelId':channel},timeout=(20,120),allow_redirects=True)
                print('COUNT',host,channel,r.status_code,r.url,len(r.content),repr(r.text[:1000]),flush=True)
                (out/f'{hi}_{channel}_count.txt').write_bytes(r.content)
              except Exception as e: print('COUNT_ERROR',host,channel,repr(e),flush=True)
          (out/'summary.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload endpoint output
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-03339-doc-endpoint
          path: endpoint
          retention-days: 7
          if-no-files-found: error
