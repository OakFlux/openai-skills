name: Temporary Hangyan Aixin report search
on:
  push:
    branches:
      - tmp-hangyan-aixin-search-20260906
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Search catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          queries=['爱芯元智','乘端侧及边缘AI浪潮','踏智驾及边缘AI之浪','高端启新，智驱全球','AI终端平台公司']
          results={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled'])
              context=browser.new_context(viewport={'width':1440,'height':1200},locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined});")
              for query in queries:
                  page=context.new_page()
                  records=[]
                  page.on('response',lambda response,records=records: records.append({'url':response.url,'status':response.status,'type':response.request.resource_type,'content_type':response.headers.get('content-type','')}))
                  try:
                      page.goto('https://www.hangyan.co/reports',wait_until='domcontentloaded',timeout=120000)
                      page.wait_for_timeout(6000)
                      inputs=page.locator('input')
                      print('QUERY',query,'INPUTS',inputs.count(),flush=True)
                      candidates=[]
                      for idx in range(inputs.count()):
                          el=inputs.nth(idx)
                          candidates.append({'idx':idx,'type':el.get_attribute('type'),'placeholder':el.get_attribute('placeholder'),'name':el.get_attribute('name'),'aria':el.get_attribute('aria-label')})
                      print('INPUT_META',json.dumps(candidates,ensure_ascii=False),flush=True)
                      target=None
                      for idx,item in enumerate(candidates):
                          joined=' '.join(str(item.get(k) or '') for k in item).lower()
                          if any(k in joined for k in ['搜索','search','关键词','报告']):
                              target=inputs.nth(idx); break
                      if target is None and inputs.count(): target=inputs.first
                      if target is not None:
                          target.fill(query,timeout=20000)
                          target.press('Enter')
                          page.wait_for_timeout(8000)
                      # Load more/scroll to expose results.
                      for _ in range(10):
                          page.mouse.wheel(0,900)
                          page.wait_for_timeout(350)
                      links=page.locator('a').evaluate_all("els => els.map(e => ({text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,500),href:e.href||'',title:e.title||''})).filter(x=>x.href)")
                      matches=[]
                      for link in links:
                          text=(link.get('text') or '')+' '+(link.get('title') or '')+' '+(link.get('href') or '')
                          if '/reports/' in link.get('href','') and (query.replace('，','')[:4] in text.replace('，','') or '爱芯元智' in text):
                              if link not in matches: matches.append(link)
                      body=page.locator('body').inner_text(timeout=30000)
                      Path(f'output/{len(results)}_{query[:8]}_body.txt').write_text(body,encoding='utf-8')
                      Path(f'output/{len(results)}_{query[:8]}_links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
                      Path(f'output/{len(results)}_{query[:8]}_responses.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
                      page.screenshot(path=f'output/{len(results)}_{query[:8]}.png',full_page=True)
                      results[query]={'url':page.url,'title':page.title(),'matches':matches,'body_head':body[:4000],'inputs':candidates}
                      print('RESULT_URL',page.url,'MATCH_COUNT',len(matches),flush=True)
                      for match in matches: print('MATCH',json.dumps(match,ensure_ascii=False),flush=True)
                      for record in records:
                          joined=(record['url']+' '+record['content_type']).lower()
                          if any(k in joined for k in ['search','report','api','query']): print('RESOURCE',json.dumps(record,ensure_ascii=False),flush=True)
                  except Exception as exc:
                      results[query]={'error':repr(exc)}
                      print('ERROR',query,repr(exc),flush=True)
                  finally:
                      page.close()
              browser.close()
          Path('output/summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-aixin-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
