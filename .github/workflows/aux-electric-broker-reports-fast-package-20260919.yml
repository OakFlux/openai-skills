name: Build fast AUX Electric broker reports package 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-broker-reports-fast-package-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf img2pdf

      - name: Assemble reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, subprocess, time, zipfile
          from pathlib import Path
          import requests, img2pdf
          from PIL import Image
          from pypdf import PdfReader

          package='奥克斯电气_02580_券商深度报告_3份'
          out=Path(package); out.mkdir()
          tmp=Path('_pages'); tmp.mkdir()
          items=[
            dict(priority=1,broker='财通证券',title='奥克斯电气（02580）：网批重构渠道效率，掘金新兴市场空调红利',date='2026-05-29',path='2026/05/31',id='5454573',expected=27,base='01_财通证券_奥克斯电气_网批重构渠道效率掘金新兴市场空调红利_2026-05-29'),
            dict(priority=2,broker='国盛证券',title='奥克斯电气（02580.HK）：内外兼修，渠道运作高效',date='2026-04-16',path='2026/04/16',id='5357558',expected=None,base='02_国盛证券_奥克斯电气_内外兼修渠道运作高效_2026-04-16'),
            dict(priority=3,broker='华西证券',title='奥克斯电气（02580）：加码AI空调，推进全球化布局',date='2026-06-04',path='2026/06/04',id='5463740',expected=None,base='03_华西证券_奥克斯电气_加码AI空调推进全球化布局_2026-06-04'),
            dict(priority=4,broker='国联民生证券',title='奥克斯电气（2580.HK）动态跟踪：经营静待复苏，股息率颇具吸引力',date='2026-04-15',path='2026/04/15',id='5353793',expected=None,base='04_国联民生证券_奥克斯电气_经营静待复苏股息率颇具吸引力_2026-04-15'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'image/avif,image/webp,image/*,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def fetch(item,n):
            raw=f"https://public.fxbaogao.com/report-image/{item['path']}/{item['id']}-{n}.png"
            urls=[raw+'?x-oss-process=image/format,webp',raw]
            hdr={'Referer':f"https://www.fxbaogao.com/detail/{item['id']}"}
            for u in urls:
              for a in range(1,3):
                try:
                  r=s.get(u,headers=hdr,timeout=(15,75),allow_redirects=True)
                  ct=(r.headers.get('content-type') or '').lower()
                  print('FETCH',item['id'],n,a,r.status_code,ct,len(r.content),flush=True)
                  if r.status_code in (403,429,500,502,503,504): time.sleep(a); continue
                  if r.status_code!=200 or not ct.startswith('image/') or len(r.content)<15000: break
                  with Image.open(io.BytesIO(r.content)) as im:
                    im.load(); w,h=im.size
                    if w<700 or h<900: break
                  return r.content,u
                except Exception as e:
                  print('ERR',item['id'],n,repr(e),flush=True); time.sleep(a)
            return None

          made=[]
          for item in items:
            pdir=tmp/item['id']; pdir.mkdir()
            pages=[]; urls=[]; hashes=set(); misses=0
            for n in range(1,61):
              got=fetch(item,n)
              if not got:
                misses+=1
                if n==1 or misses>=2: break
                continue
              misses=0; data,u=got
              hh=hashlib.sha256(data).hexdigest()
              if hh in hashes: break
              hashes.add(hh)
              with Image.open(io.BytesIO(data)) as im:
                rgb=im.convert('RGB')
                fn=pdir/f'{n:03d}.jpg'
                rgb.save(fn,'JPEG',quality=95,subsampling=0,progressive=False,optimize=False,dpi=(150,150))
              pages.append(fn); urls.append(u)
            count=len(pages); print('COUNT',item['id'],count,flush=True)
            if count<8: continue
            if item['expected'] and count!=item['expected']:
              raise RuntimeError(f"{item['id']} expected {item['expected']} pages, got {count}")
            pdf=out/f"{item['base']}_{count}页.pdf"
            with pdf.open('wb') as f: f.write(img2pdf.convert([str(x) for x in pages]))
            reader=PdfReader(str(pdf),strict=False)
            if len(reader.pages)!=count: raise RuntimeError('page mismatch '+str(pdf))
            q=subprocess.run(['qpdf','--check',str(pdf)],capture_output=True,text=True)
            if q.returncode not in (0,3): raise RuntimeError(q.stderr[-1500:])
            prev=tmp/f"cover_{item['id']}"
            r=subprocess.run(['pdftoppm','-f','1','-singlefile','-r','90','-png',str(pdf),str(prev)],capture_output=True,text=True)
            if r.returncode or not prev.with_suffix('.png').exists(): raise RuntimeError('render failed '+str(pdf))
            b=pdf.read_bytes()
            made.append({
              'priority':item['priority'],'broker':item['broker'],'title':item['title'],'date':item['date'],
              'filename':pdf.name,'page_count':count,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),
              'source_detail_url':f"https://www.fxbaogao.com/detail/{item['id']}",
              'source_image_pattern':f"https://public.fxbaogao.com/report-image/{item['path']}/{item['id']}-{{page}}.png",
              'assembly_note':'由公开可访问的逐页报告原图按原页序合成为完整PDF；未绕过登录、付费或访问控制。'
            })
          if len(made)<3: raise RuntimeError(f'only {len(made)} reports assembled')
          chosen=sorted(made,key=lambda x:x['priority'])[:3]
          keep={x['filename'] for x in chosen}
          for p in out.glob('*.pdf'):
            if p.name not in keep: p.unlink()
          for x in chosen: x.pop('priority',None)
          lines=['奥克斯电气股份有限公司（02580.HK）券商深度报告','整理日期：2026-09-19','','收录3份券商公司研究/首次覆盖报告。','这些PDF由公开报告页面的逐页原图按原页序合成，不是证券公司官网下载的矢量原始PDF；未绕过登录、付费或访问控制。','文件已检查图片解码、页序、PDF页数、qpdf结构及首页渲染。','','文件清单：']
          for i,x in enumerate(chosen,1):
            lines += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；页数：{x['page_count']}；文件：{x['filename']}",f"   来源页面：{x['source_detail_url']}",f"   SHA-256：{x['sha256']}",'']
          lines += ['使用说明：仅供个人研究与资料查阅，版权归原作者及发布机构所有。','如需带可复制文字层的原始文件，应以证券公司官网或授权数据库版本为准。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(chosen,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in chosen),encoding='utf-8')
          zp=Path(package+'.zip')
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(out.iterdir()): z.write(p,arcname=f'{package}/{p.name}')
          with zipfile.ZipFile(zp) as z:
            if z.testzip(): raise RuntimeError('zip crc failure')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('zip pdf count')
          print('FINAL',json.dumps(chosen,ensure_ascii=False,indent=2),flush=True)
          print('ZIP',zp.stat().st_size,hashlib.sha256(zp.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aux-electric-02580-broker-reports-final-fast
          path: 奥克斯电气_02580_券商深度报告_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
