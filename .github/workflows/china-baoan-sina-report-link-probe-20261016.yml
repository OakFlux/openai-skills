name: Probe Sina China Baoan report download links
on:
  push:
    paths:
      - '.github/workflows/china-baoan-sina-report-link-probe-20261016.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python - <<'PY'
          import re, requests
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/349169055092/index.phtml',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://stock.finance.sina.com.cn/'})
          for u in urls:
            r=s.get(u,timeout=60)
            print('STATUS',r.status_code,'URL',r.url,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content))
            raw=r.content
            for enc in ['utf-8','gb18030','gbk']:
              try:
                text=raw.decode(enc)
                print('ENCODING',enc)
                break
              except Exception:
                pass
            else:
              text=raw.decode('utf-8','replace')
            print('HTML_START',text[:8000])
            links=[]
            for m in re.finditer(r'''(?:href|src)=["']([^"']+)["']''',text,re.I):
              v=m.group(1)
              if any(k in v.lower() for k in ['pdf','download','report','rptid','file']): links.append(v)
            print('CANDIDATE_LINKS')
            for x in links: print(x)
          PY
