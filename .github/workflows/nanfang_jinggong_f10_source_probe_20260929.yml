name: South Precision F10 Source Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_f10_source_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Inspect F10 source and linked resources
        shell: bash
        run: |
          python - <<'PY'
          import re,requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          url='https://webf10.gw.com.cn/SZ/B16/SZ002553_B16.html'
          r=s.get(url,timeout=60); r.encoding=r.apparent_encoding or 'gb18030'
          print('PAGE',r.status_code,len(r.content),r.url,r.encoding)
          text=r.text
          for i,line in enumerate(text.splitlines(),1):
            if re.search(r'2022-10-13|2021-12-13|2026-01-16|2024-11-01|新能源汽车注入|芯片研发|国内滚针|report|research|研报|002553|AP\d+',line,re.I):
              print('LINE',i,line[:5000])
          soup=BeautifulSoup(text,'html.parser')
          resources=[]
          for tag in soup.find_all(['script','iframe'],src=True): resources.append(urljoin(r.url,tag.get('src')))
          for tag in soup.find_all('link',href=True): resources.append(urljoin(r.url,tag.get('href')))
          print('RESOURCES',resources)
          for res in resources:
            if not re.search(r'\.js(?:\?|$)|B16|002553',res,re.I): continue
            try:
              rr=s.get(res,headers={'Referer':url},timeout=60); rr.encoding=rr.apparent_encoding or 'utf-8'
              print('\nRESOURCE',res,rr.status_code,len(rr.content))
              for i,line in enumerate(rr.text.splitlines(),1):
                if re.search(r'2022-10-13|2021-12-13|2026-01-16|2024-11-01|新能源汽车注入|芯片研发|国内滚针|report|research|研报|AP\d+',line,re.I):
                  print('RLINE',i,line[:5000])
            except Exception as e: print('ERR',res,repr(e))
          PY
