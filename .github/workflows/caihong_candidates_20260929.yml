name: Caihong Display Research Candidates

on:
  push:
    branches:
      - chatgpt-caihong-reports-20260929
    paths:
      - .github/workflows/caihong_candidates_20260929.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Query and probe research reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, os, re, hashlib
          from datetime import datetime
          from urllib.parse import urlencode
          import requests
          from pypdf import PdfReader

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          params = {
              'pageSize': '200', 'pageNo': '1', 'qType': '0', 'code': '600707',
              'beginTime': '2010-01-01', 'endTime': '2026-09-29', 'fields': '',
              'industryCode': '*', 'industry': '*', 'rating': '*',
              'ratingChange': '*', 'orgCode': ''
          }
          api = 'https://reportapi.eastmoney.com/report/list?' + urlencode(params)
          r = session.get(api, headers={'Referer': 'https://data.eastmoney.com/report/600707.html'}, timeout=60)
          r.raise_for_status()
          obj = r.json()
          rows = obj.get('data') or []
          print('API_HITS', obj.get('hits'), 'ROWS', len(rows))

          def score(d):
              title = d.get('title') or ''
              pages = int(d.get('attachPages') or 0)
              date = (d.get('publishDate') or '')[:10]
              year = int(date[:4]) if re.match(r'^\d{4}', date) else 0
              s = pages * 4
              for kw, pts in [('首次覆盖', 80), ('深度', 70), ('公司深度', 90), ('价值重估', 45), ('国产替代', 30), ('成长曲线', 25), ('行业拐点', 20)]:
                  if kw in title:
                      s += pts
              if pages >= 15: s += 50
              elif pages >= 10: s += 25
              if year >= 2024: s += 45
              elif year >= 2021: s += 25
              elif year >= 2018: s += 10
              return s

          candidates = []
          for d in rows:
              item = {
                  'date': (d.get('publishDate') or '')[:10],
                  'broker': d.get('orgSName') or d.get('orgName') or '',
                  'title': d.get('title') or '',
                  'authors': d.get('researcher') or '',
                  'rating': d.get('emRatingName') or d.get('sRatingName') or '',
                  'pages_api': int(d.get('attachPages') or 0),
                  'size_kb_api': int(d.get('attachSize') or 0),
                  'column': d.get('column') or '',
                  'info_code': d.get('infoCode') or '',
                  'score': score(d),
              }
              candidates.append(item)

          candidates.sort(key=lambda x: (x['score'], x['date']), reverse=True)
          print('\nRANKED_CANDIDATES')
          for i, x in enumerate(candidates, 1):
              print(f"{i:02d} score={x['score']:3d} date={x['date']} pages={x['pages_api']:2d} broker={x['broker']} title={x['title']} info={x['info_code']}")

          probes = []
          for x in candidates[:30]:
              code = x['info_code']
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}.pdf',
              ]
              result = dict(x)
              result.update({'ok': False, 'pdf_url': '', 'bytes': 0, 'pages_actual': 0, 'sha256': '', 'error': ''})
              for url in urls:
                  try:
                      rr = session.get(url, headers={'Referer': 'https://data.eastmoney.com/'}, timeout=60)
                      ctype = rr.headers.get('content-type', '')
                      if rr.status_code == 200 and rr.content.startswith(b'%PDF'):
                          path = os.path.join('output', code + '.pdf')
                          with open(path, 'wb') as f:
                              f.write(rr.content)
                          try:
                              reader = PdfReader(path)
                              pages = len(reader.pages)
                          except Exception as e:
                              pages = 0
                          result.update({
                              'ok': True, 'pdf_url': url, 'bytes': len(rr.content),
                              'pages_actual': pages,
                              'sha256': hashlib.sha256(rr.content).hexdigest(),
                          })
                          break
                      result['error'] = f'{rr.status_code} {ctype} {len(rr.content)} bytes'
                  except Exception as e:
                      result['error'] = repr(e)
              probes.append(result)
              print('PROBE', json.dumps(result, ensure_ascii=False))

          with open('output/all_reports.json', 'w', encoding='utf-8') as f:
              json.dump(candidates, f, ensure_ascii=False, indent=2)
          with open('output/probed_candidates.json', 'w', encoding='utf-8') as f:
              json.dump(probes, f, ensure_ascii=False, indent=2)
          PY

      - name: Upload candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: caihong-research-candidates
          path: |
            output/all_reports.json
            output/probed_candidates.json
          retention-days: 1
