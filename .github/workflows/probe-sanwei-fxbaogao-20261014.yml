name: Probe Sanwei public report sources

on:
  pull_request:
    paths:
      - 'tasks/probe-sanwei-fxbaogao-20261014.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe report pages and assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests, pathlib
          from urllib.parse import urljoin

          urls = [
            'https://fxbaogao.com/detail/4736599',
            'https://www.fxbaogao.com/detail/4790436',
            'https://www.fxbaogao.com/detail/4665308',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/796925480199/index.phtml',
          ]
          out = pathlib.Path('probe_out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for i,url in enumerate(urls,1):
              try:
                  r=s.get(url,timeout=(20,90),allow_redirects=True)
                  print('FETCH',i,r.status_code,len(r.content),r.url,flush=True)
                  (out/f'{i}.html').write_bytes(r.content)
                  text=r.text
                  pats=[r'https?://[^\"\'<> ]+',r'[^\"\'<> ]+\.pdf[^\"\'<> ]*',r'/api/[^\"\'<> ]+',r'download[^\"\'<> ]*',r'file[^\"\'<> ]*']
                  hits=[]
                  for pat in pats:
                      for m in re.findall(pat,text,re.I):
                          if isinstance(m,tuple): m=''.join(m)
                          if any(k in m.lower() for k in ('pdf','download','api','report','file','attachment','oss','cdn')):
                              hits.append(m[:1000])
                  print('HITS',i,json.dumps(list(dict.fromkeys(hits))[:300],ensure_ascii=False,indent=2),flush=True)
                  scripts=re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',text,re.I)
                  print('SCRIPTS',i,json.dumps(scripts,ensure_ascii=False),flush=True)
                  for j,src in enumerate(scripts[:30],1):
                      full=urljoin(r.url,src)
                      try:
                          sr=s.get(full,timeout=(15,60))
                          print('SCRIPT',i,j,sr.status_code,len(sr.content),full,flush=True)
                          (out/f'{i}_script_{j}.js').write_bytes(sr.content)
                          js_hits=[]
                          for pat in (r'https?://[^\"\'<> ]+',r'/api/[^\"\'<> ]+',r'[^\"\'<> ]+\.pdf[^\"\'<> ]*',r'download[^\"\'<> ]*'):
                              for m in re.findall(pat,sr.text,re.I):
                                  if any(k in m.lower() for k in ('pdf','download','api','report','file','oss','cdn')):
                                      js_hits.append(m[:1000])
                          if js_hits: print('SCRIPT_HITS',i,j,json.dumps(list(dict.fromkeys(js_hits))[:200],ensure_ascii=False,indent=2),flush=True)
                      except Exception as e:
                          print('SCRIPT_ERROR',i,j,repr(e),flush=True)
              except Exception as e:
                  print('FETCH_ERROR',i,url,repr(e),flush=True)
          PY
      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: sanwei-source-probe
          path: probe_out/
          retention-days: 3
