name: Inspect public China Hongqiao report sources
on:
  push:
    branches:
      - tmp-chinahongqiao-public-pdf-sources-20260908
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch public pages
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          pages = {
            'west_sdyanbao': 'https://www.sdyanbao.com/detail/886387',
            'huachuang_sdyanbao': 'https://www.sdyanbao.com/detail/892745',
            'huachuang_vzkoo': 'https://www.vzkoo.com/document/202505284d706ccf964f075580f58225.html?from=report',
            'kaiyuan_vzkoo': 'https://www.vzkoo.com/document/20240613685119ace79295e90edc0069.html?from=report',
            'west_hibor': 'https://wap.hibor.com.cn/repinfodetail_4073301.html'
          }
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          result={}
          for name,url in pages.items():
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              text=r.text
              Path(f'output/{name}.html').write_text(text,encoding='utf-8')
              urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',text)))
              hits=[u for u in urls if re.search(r'pdf|download|file|document|oss|cdn',u,re.I)]
              result[name]={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'hits':hits}
              print(name,r.status_code,r.url)
              for u in hits[:100]: print('HIT',u)
            except Exception as e:
              result[name]={'error':repr(e)}
          Path('output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-public-source-pages
          path: output/*
          retention-days: 1
