name: Temporary Fosun 2025 report inspection

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-2025-report-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 Pillow PyMuPDF
      - name: Inspect exact report and all public pages
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, io, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests, pymupdf
          from bs4 import BeautifulSoup
          from PIL import Image

          out=Path('fosun_2025_inspection'); pages=out/'pages'; out.mkdir(); pages.mkdir()
          title='核心产业稳健经营，RWA生态布局稳步推进'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          # SDYanbao exact search.
          sd=requests.Session(); sd.headers.update({'User-Agent':s.headers['User-Agent'],'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          for query in [title, f'复星国际 {title}', '复星国际 2025 RWA']:
            try:
              r=sd.post('https://api.sdyanbao.com/api/file/search',json={'page':1,'pageSize':100,'keyword':query},timeout=45)
              files=(r.json().get('data') or {}).get('files') or []
              print('SD_QUERY',query,'COUNT',len(files))
              for row in files:
                name=str(row.get('name') or '')
                if '复星国际' not in name and title[:8] not in name: continue
                detail={}
                try:
                  d=sd.post('https://api.sdyanbao.com/api/file/detail',json={'id':row.get('id')},timeout=45).json()
                  if d.get('status')==1: detail=d.get('data') or {}
                except Exception as e: print('SD_DETAIL_ERROR',repr(e))
                rec={'id':row.get('id'),'name':name,'page_count':row.get('page_count'),'time_text':detail.get('time_text'),'organization':(detail.get('organization') or {}).get('name'),'data_source_uuid':detail.get('data_source_uuid') or row.get('data_source_uuid'),'page_url':detail.get('page_url') or row.get('page_url'),'original_id':detail.get('original_id') or row.get('original_id'),'content_prefix':str(detail.get('content') or '')[:2200]}
                print('SD_MATCH',json.dumps(rec,ensure_ascii=False))
            except Exception as e: print('SD_ERROR',query,repr(e))

          # Eastmoney tight date search, no reliance on code filter.
          endpoint='https://reportapi.eastmoney.com/report/list'
          em=[]
          for qtype in ['0','1','2','3']:
            for code_filter in ['00656','']:
              for page in range(1,10):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2025-08-25','endTime':'2025-09-12','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':code_filter,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(endpoint,params=params,headers={'Referer':'https://data.eastmoney.com/'},timeout=60); r.raise_for_status(); rows=r.json().get('data') or []
                except Exception as e: print('EM_ERROR',qtype,code_filter,page,repr(e)); break
                for row in rows:
                  blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode'])
                  if '复星国际' not in blob and '00656' not in blob and 'RWA' not in blob.upper() and '核心产业稳健经营' not in blob: continue
                  rec={'publishDate':(row.get('publishDate') or '')[:10],'title':row.get('title'),'orgSName':row.get('orgSName'),'researcher':row.get('researcher'),'infoCode':row.get('infoCode'),'attachPages':row.get('attachPages'),'attachSize':row.get('attachSize'),'reportType':row.get('reportType'),'stockName':row.get('stockName'),'stockCode':row.get('stockCode')}
                  if rec not in em: em.append(rec); print('EM_MATCH',json.dumps(rec,ensure_ascii=False))
                if len(rows)<100: break

          # SGP report page id 900669; five-page report should be entirely inside the intended free preview.
          rid=900669
          url=f'https://www.sgpjbg.com/baogao/{rid}.html'
          r=s.get(url,timeout=60); print('SGP_PAGE',r.status_code,len(r.content),r.url)
          text=r.text; soup=BeautifulSoup(text,'html.parser')
          print('SGP_TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
          decoded=html.unescape(text).replace('\\/','/')
          dp=None; fcount=None; free_limit=None
          inp=soup.find('input',id='dp')
          if inp: dp=inp.get('value')
          m=re.search(r'var\s+fCount\s*=\s*(\d+)',decoded); fcount=int(m.group(1)) if m else None
          m=re.search(r'ForceFreepage\s*=\s*parseInt\(["\'](\d+)',decoded); free_limit=int(m.group(1)) if m else None
          print('SGP_META',json.dumps({'dp':dp,'fcount':fcount,'free_limit':free_limit},ensure_ascii=False))
          print('SGP_CONTEXT',re.sub(r'\s+',' ',decoded[:9000])[:9000])

          # Load viewer script to derive URL pattern.
          scripts=[]
          for tag in soup.find_all('script',src=True):
            scripts.append(urljoin(r.url,tag['src']))
          for js_url in scripts:
            if 'view-mini' not in js_url.lower(): continue
            js=s.get(js_url,timeout=60).text
            print('VIEWER_SCRIPT',js_url,'BYTES',len(js))
            for needle in ['_Addpage','fileroot','dp','GetPage','jpg','png','gif','svg']:
              positions=[m.start() for m in re.finditer(re.escape(needle),js,re.I)]
              if positions:
                print('JS_NEEDLE',needle,len(positions))
                for pos in positions[:12]: print('JS_CONTEXT',re.sub(r'\s+',' ',js[max(0,pos-500):pos+1500])[:2500])

          # Try common public viewer page file patterns only within declared five free pages.
          if dp and fcount and fcount<=15:
            candidates=[]
            for page_num in range(1,fcount+1):
              stems=[str(page_num),f'{page_num:02d}',f'{page_num:03d}',f'page{page_num}',f'page_{page_num}',f'p{page_num}']
              suffixes=['.jpg','.jpeg','.png','.gif','.webp','.svg']
              for stem in stems:
                for suffix in suffixes:
                  candidates.append((page_num,f'{dp}/{stem}{suffix}'))
            found={}
            for page_num,c in candidates:
              if page_num in found: continue
              try:
                rr=s.get(c,headers={'Referer':url},timeout=12)
                if rr.status_code!=200 or len(rr.content)<10000: continue
                try:
                  with Image.open(io.BytesIO(rr.content)) as im:
                    im.load(); w,h=im.size
                    if w<600 or h<600: continue
                    fmt=im.format
                except Exception: continue
                path=pages/f'{page_num:02d}.{fmt.lower() if fmt else "img"}'; path.write_bytes(rr.content)
                found[page_num]={'url':c,'bytes':len(rr.content),'width':w,'height':h,'format':fmt,'file':path.name}
                print('PAGE_FOUND',json.dumps({'page':page_num,**found[page_num]},ensure_ascii=False))
              except Exception: pass
            print('FOUND_COUNT',len(found),json.dumps(found,ensure_ascii=False))

          # Probe any direct Eastmoney original from matched AP codes.
          for rec in em:
            code=rec.get('infoCode')
            if not code: continue
            for pdfurl in [f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{int(time.time()*1000)}.pdf=']:
              try:
                rr=s.get(pdfurl,headers={'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=60)
                result={'url':pdfurl,'status':rr.status_code,'bytes':len(rr.content),'magic':rr.content[:8].hex()}
                if rr.content.startswith(b'%PDF') and len(rr.content)>50000:
                  doc=pymupdf.open(stream=rr.content,filetype='pdf'); result['pages']=doc.page_count; result['first_text']=re.sub(r'\s+',' ',doc.load_page(0).get_text('text')).strip()[:2000]; result['last_text']=re.sub(r'\s+',' ',doc.load_page(doc.page_count-1).get_text('text')).strip()[:800]; doc.close(); (out/f'{code}.pdf').write_bytes(rr.content)
                print('PDF_PROBE',json.dumps(result,ensure_ascii=False))
                if result.get('pages'): break
              except Exception as e: print('PDF_ERROR',pdfurl,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fosun-2025-report-inspection
          path: fosun_2025_inspection/
          retention-days: 1
          if-no-files-found: error
