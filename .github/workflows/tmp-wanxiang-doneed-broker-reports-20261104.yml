name: Build Wanxiang Doneed broker reports package

on:
  push:
    branches:
      - tmp-wanxiang-doneed-broker-reports-20261104

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='万向德农_600371_券商深度报告_2份'
          rm -rf "$PACKAGE" /tmp/wanxiang_doneed_broker_render
          mkdir -p "$PACKAGE" /tmp/wanxiang_doneed_broker_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('万向德农_600371_券商深度报告_2份')
          reports = [
              {
                  'order': 1,
                  'broker': '华西证券',
                  'date': '2020-09-26',
                  'title': '玉米种业有望回暖，静待公司利润释放',
                  'filename': '01_华西证券_玉米种业有望回暖静待公司利润释放_2020-09-26.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202009271417706797_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202009271417706797.html',
                  'min_pages': 18,
                  'broker_terms': ['华西证券'],
                  'title_terms': ['玉米种业有望回暖', '静待公司利润释放'],
              },
              {
                  'order': 2,
                  'broker': '信达证券',
                  'date': '2012-08-23',
                  'title': '公司经营效果开始显现，后期业绩值得期待',
                  'filename': '02_信达证券_公司经营效果开始显现后期业绩值得期待_2012-08-23.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201208260005462072_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP201208260005462072.html',
                  'min_pages': 14,
                  'broker_terms': ['信达证券', 'CINDASECURITIES'],
                  'title_terms': ['公司经营效果开始显现', '后期业绩值得期待'],
              },
          ]

          def make_session() -> requests.Session:
              s = requests.Session()
              s.trust_env = False
              s.mount('https://', HTTPAdapter(max_retries=Retry(
                  total=7, connect=7, read=7, status=7, backoff_factor=1.0,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET'], raise_on_status=False,
              )))
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              })
              return s

          def compact_text(reader: PdfReader) -> str:
              chunks = []
              for page in reader.pages:
                  try:
                      chunks.append(page.extract_text() or '')
                  except Exception:
                      pass
              return re.sub(r'\s+', '', '\n'.join(chunks))

          records = []
          for report in reports:
              s = make_session()
              response = s.get(
                  report['url'],
                  headers={'Referer': report['info']},
                  timeout=(30, 240),
                  allow_redirects=True,
              )
              data = response.content
              print('DOWNLOAD', report['broker'], response.status_code, len(data), response.headers.get('content-type'), response.url)
              if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 200_000:
                  raise RuntimeError(
                      f"{report['broker']}: HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get('content-type')}"
                  )

              path = out / report['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'{path.name}: only {pages} pages')
              compact = compact_text(reader)
              if '万向德农' not in compact or '600371' not in compact:
                  raise RuntimeError(f'{path.name}: company identity not found')
              if not any(term.replace(' ', '') in compact for term in report['broker_terms']):
                  raise RuntimeError(f'{path.name}: broker identity not found')
              for term in report['title_terms']:
                  if term.replace(' ', '') not in compact:
                      raise RuntimeError(f'{path.name}: title marker not found: {term}')
              if '公司深度研究报告' not in compact and '万向德农深度报告' not in compact and '公司研究——投价报告' not in compact:
                  raise RuntimeError(f'{path.name}: deep-report marker not found')

              sha = hashlib.sha256(data).hexdigest()
              records.append({
                  **report,
                  'pages': pages,
                  'bytes': len(data),
                  'source': response.url,
                  'sha256': sha,
              })
              print('VALIDATED_TEXT', path.name, 'pages=', pages, 'sha256=', sha)

          records.sort(key=lambda x: x['order'])
          lines = [
              '万向德农（600371）券商深度报告资料包',
              '整理日期：2026-11-04',
              '',
              '收录说明：',
              '1. 本包收录公开渠道可直接取得并完整验证的2份万向德农公司深度报告。',
              '2. 未使用网页摘要、截图、AI生成报告、调研纪要或短篇财报点评补足数量。',
              '3. 两份PDF均核验公司名称、股票代码、券商名称、深度报告标识、实际页数、PDF结构及首末页渲染。',
              '',
              '文件清单：',
          ]
          sums = []
          for item in records:
              lines += [
                  f"{item['order']}. {item['broker']}｜《{item['title']}》",
                  f"   报告日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   信息页：{item['info']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f"合计：{len(records)}份PDF，{sum(x['pages'] for x in records)}页，{sum(x['bytes'] for x in records)}字节。",
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 200000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 14
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -q '万向德农' "$pdf.txt"
            grep -q '600371' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/wanxiang_doneed_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/wanxiang_doneed_broker_test.zip "$PACKAGE"
          unzip -t /tmp/wanxiang_doneed_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/wanxiang_doneed_broker_test.zip | grep -c '\.pdf$')" -eq 2
          rm -f /tmp/wanxiang_doneed_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Wanxiang-Doneed-600371-broker-deep-reports-2
          path: 万向德农_600371_券商深度报告_2份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
