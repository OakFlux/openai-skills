name: Build Hegang broker research report package

on:
  push:
    branches: [tmp-hegang-000709-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hegang-broker-package-final-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF and rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk python3-pip
          python3 -m pip install --quiet --upgrade requests beautifulsoup4 lxml trafilatura weasyprint

      - name: Create public full-text report PDFs
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='河钢股份_券商研究报告_3份_公开全文版'
          mkdir -p "$PACKAGE" work/assets

          cat > work/build_reports.py <<'PY'
          from __future__ import annotations

          import hashlib
          import html as html_lib
          import json
          import mimetypes
          import re
          import sys
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          import trafilatura
          from bs4 import BeautifulSoup, Tag
          from weasyprint import HTML

          UA = (
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
              'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          )
          ROOT = Path.cwd()
          PACKAGE = ROOT / '河钢股份_券商研究报告_3份_公开全文版'
          WORK = ROOT / 'work'
          ASSETS = WORK / 'assets'
          SESSION = requests.Session()
          SESSION.headers.update({'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5'})

          reports = [
              {
                  'filename': '01_银河证券_钢铁向材料升级盈利能力行业领先_首次覆盖_公开全文版_2025-04-14.pdf',
                  'title': '河钢股份：“钢铁向材料”升级，盈利能力行业领先',
                  'broker': '中国银河证券',
                  'analyst': '赵良毕',
                  'date': '2025-04-14',
                  'type': '首次覆盖 / 公司深度',
                  'source_url': 'https://finance.sina.com.cn/stock/stockzmt/2025-04-16/doc-inetifie3675049.shtml',
                  'article': True,
                  'expected_terms': ['河钢股份', '钢铁向材料', '赵良毕'],
              },
              {
                  'filename': '02_国泰海通证券_产销量持续增长2025Q1净利率回升_公司研究_公开全文版_2025-05-11.pdf',
                  'title': '河钢股份：产销量持续增长，2025Q1净利率回升',
                  'broker': '国泰海通证券',
                  'analyst': '李鹏飞 / 魏雨迪 / 王宏玉',
                  'date': '2025-05-11',
                  'type': '公司更新报告',
                  'source_url': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/800316839728/index.phtml',
                  'article': False,
                  'expected_terms': ['河钢股份', '产销量持续增长', '净利率回升'],
              },
              {
                  'filename': '03_中金公司_穿越周期谷底材料转型重塑成长空间_公司研究_公开全文版_2026-04-30.pdf',
                  'title': '河钢股份：穿越周期谷底，材料转型重塑成长空间',
                  'broker': '中国国际金融股份有限公司',
                  'analyst': '张树玮 / 陈彦',
                  'date': '2026-04-30',
                  'type': '公司研究报告',
                  'source_url': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/830853874814/index.phtml',
                  'article': False,
                  'expected_terms': ['河钢股份', '穿越周期谷底', '材料转型'],
              },
          ]

          def fetch(url: str, referer: str | None = None) -> tuple[bytes, str]:
              headers = {'Referer': referer} if referer else {}
              last: Exception | None = None
              for attempt in range(6):
                  try:
                      response = SESSION.get(url, headers=headers, timeout=120, allow_redirects=True)
                      response.raise_for_status()
                      return response.content, response.url
                  except Exception as exc:  # noqa: BLE001
                      last = exc
                      time.sleep(2 + attempt)
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          def decode_html(raw: bytes) -> str:
              # Sina legacy pages may declare gb2312/gbk; modern articles are UTF-8.
              head = raw[:5000].decode('ascii', errors='ignore').lower()
              declared = re.search(r'charset\s*=\s*["\']?([a-z0-9_-]+)', head)
              encodings: list[str] = []
              if declared:
                  enc = declared.group(1)
                  if enc in ('gb2312', 'gbk'):
                      encodings.append('gb18030')
                  encodings.append(enc)
              encodings += ['utf-8', 'gb18030', 'gbk']
              for enc in encodings:
                  try:
                      return raw.decode(enc)
                  except (UnicodeDecodeError, LookupError):
                      continue
              return raw.decode('utf-8', errors='replace')

          def clean_soup(soup: BeautifulSoup) -> None:
              for node in soup.select(
                  'script, style, noscript, iframe, form, nav, footer, header, '
                  '.comment, .comments, .recommend, .related, .share, .toolbar, '
                  '.ad, .ads, [class*="advert"], [id*="advert"], [class*="sidebar"], '
                  '[class*="sider"], [id*="sidebar"], [id*="sider"]'
              ):
                  node.decompose()

          def largest_content_block(soup: BeautifulSoup, expected_terms: list[str]) -> Tag:
              preferred_selectors = [
                  '#artibody', '#article', '.article-body', '.article-content',
                  '.article-content-left', '.content', '.content_area', '.main-content',
                  '.blk_container', '.report-content', '.main', '#main',
              ]
              candidates: list[Tag] = []
              for selector in preferred_selectors:
                  candidates.extend([x for x in soup.select(selector) if isinstance(x, Tag)])
              candidates.extend([x for x in soup.find_all(['article', 'section', 'div', 'td']) if isinstance(x, Tag)])

              def score(tag: Tag) -> float:
                  text = re.sub(r'\s+', ' ', tag.get_text(' ', strip=True))
                  length = len(text)
                  if length < 300:
                      return -1
                  term_bonus = sum(2000 for term in expected_terms if term in text)
                  paragraph_bonus = len(tag.find_all(['p', 'h2', 'h3'])) * 15
                  image_bonus = len(tag.find_all('img')) * 60
                  nav_penalty = sum(text.count(word) for word in ('首页', '行情', '自选股', '导航', '登录')) * 50
                  # Penalize giant page wrappers; prefer dense blocks.
                  child_penalty = len(tag.find_all(recursive=False)) * 0.2
                  return length + term_bonus + paragraph_bonus + image_bonus - nav_penalty - child_penalty

              scored = [(score(tag), tag) for tag in candidates]
              scored = [item for item in scored if item[0] > 0]
              if not scored:
                  body = soup.body
                  if not isinstance(body, Tag):
                      raise RuntimeError('No usable HTML body found')
                  return body
              scored.sort(key=lambda item: item[0], reverse=True)
              return scored[0][1]

          def absolutize_and_localize_images(fragment: Tag, source_url: str, prefix: str) -> None:
              for index, image in enumerate(list(fragment.find_all('img')), start=1):
                  src = image.get('data-src') or image.get('src') or image.get('data-original')
                  if not src:
                      image.decompose()
                      continue
                  absolute = urljoin(source_url, html_lib.unescape(src))
                  low = absolute.lower()
                  if any(token in low for token in ('beacon.', 'qrcode', 'logo', 'avatar', 'thumb_default', 'sinafinance_app')):
                      image.decompose()
                      continue
                  try:
                      raw, final_url = fetch(absolute, source_url)
                  except Exception:
                      image.decompose()
                      continue
                  content_type = ''
                  ext = Path(urlparse(final_url).path).suffix.lower()
                  if ext not in ('.jpg', '.jpeg', '.png', '.webp', '.gif'):
                      ext = mimetypes.guess_extension(content_type) or '.img'
                  if len(raw) < 5000:
                      image.decompose()
                      continue
                  local = ASSETS / f'{prefix}_{index:02d}{ext}'
                  local.write_bytes(raw)
                  image['src'] = local.resolve().as_uri()
                  for attr in ('data-src', 'data-original', 'srcset', 'style', 'width', 'height'):
                      image.attrs.pop(attr, None)
                  image['class'] = list(set((image.get('class') or []) + ['report-image']))

          def normalize_fragment(fragment: Tag) -> str:
              # Remove empty visual remnants and standardize headings/paragraphs.
              for node in list(fragment.find_all(['span', 'div'])):
                  if not node.get_text(' ', strip=True) and not node.find('img'):
                      node.decompose()
              for anchor in fragment.find_all('a'):
                  anchor.unwrap()
              for table in fragment.find_all('table'):
                  table['class'] = list(set((table.get('class') or []) + ['report-table']))
              return str(fragment)

          def extract_main_html(raw: bytes, source_url: str, report: dict, prefix: str) -> str:
              text = decode_html(raw)
              soup = BeautifulSoup(text, 'lxml')
              clean_soup(soup)

              # Prefer explicit publisher article body for the Galaxy deep report.
              fragment: Tag | None = None
              if report['article']:
                  for selector in ('#artibody', '.article', '.article-body', '.article-content'):
                      candidate = soup.select_one(selector)
                      if isinstance(candidate, Tag) and len(candidate.get_text(' ', strip=True)) > 1000:
                          fragment = candidate
                          break

              if fragment is None:
                  # Trafilatura often isolates the report text on legacy pages.
                  extracted = trafilatura.extract(
                      text,
                      include_comments=False,
                      include_tables=True,
                      include_images=True,
                      output_format='html',
                      url=source_url,
                  )
                  if extracted and len(BeautifulSoup(extracted, 'lxml').get_text(' ', strip=True)) > 700:
                      extracted_soup = BeautifulSoup(extracted, 'lxml')
                      fragment_candidate = extracted_soup.body or extracted_soup
                      if isinstance(fragment_candidate, Tag):
                          fragment = fragment_candidate

              if fragment is None:
                  fragment = largest_content_block(soup, report['expected_terms'])

              # Copy into an isolated soup before mutating the page tree.
              isolated = BeautifulSoup(str(fragment), 'lxml')
              isolated_fragment = isolated.body or isolated
              if not isinstance(isolated_fragment, Tag):
                  raise RuntimeError('Could not isolate report content')
              clean_soup(isolated)
              absolutize_and_localize_images(isolated_fragment, source_url, prefix)
              content_text = re.sub(r'\s+', ' ', isolated_fragment.get_text(' ', strip=True))
              if len(content_text) < 500:
                  raise RuntimeError(f'Extracted report text is too short: {len(content_text)}')
              if '河钢股份' not in content_text:
                  raise RuntimeError('Extracted content does not mention 河钢股份')
              return normalize_fragment(isolated_fragment)

          CSS = r'''
          @page {
            size: A4;
            margin: 18mm 16mm 18mm 16mm;
            @bottom-center {
              content: "公开全文页导出版  |  第 " counter(page) " 页";
              font-size: 8.5pt;
              color: #666;
            }
          }
          html, body {
            font-family: "Noto Sans CJK SC", "Noto Serif CJK SC", sans-serif;
            font-size: 10.5pt;
            line-height: 1.72;
            color: #111;
          }
          body { margin: 0; }
          .cover {
            page-break-after: always;
            min-height: 245mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
          }
          .cover h1 {
            font-size: 23pt;
            line-height: 1.35;
            margin: 0 0 18mm 0;
            font-weight: 700;
          }
          .meta {
            border-top: 1.5pt solid #222;
            border-bottom: 1pt solid #aaa;
            padding: 8mm 0;
            font-size: 11pt;
          }
          .meta p { margin: 2mm 0; }
          .notice {
            margin-top: 14mm;
            padding: 5mm;
            background: #f1f1f1;
            border-left: 3pt solid #777;
            font-size: 9.5pt;
            line-height: 1.55;
          }
          .source { word-break: break-all; font-size: 8.5pt; color: #555; }
          .report-body h1 { font-size: 20pt; line-height: 1.35; }
          .report-body h2 { font-size: 15pt; margin-top: 9mm; border-bottom: 0.6pt solid #aaa; padding-bottom: 2mm; }
          .report-body h3 { font-size: 12.5pt; margin-top: 6mm; }
          .report-body p { margin: 3mm 0; text-align: justify; }
          .report-body br { line-height: 1.3; }
          .report-image {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 5mm auto;
            page-break-inside: avoid;
          }
          .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 8.5pt;
            page-break-inside: avoid;
          }
          .report-table td, .report-table th { border: 0.5pt solid #aaa; padding: 1.5mm; }
          img { max-width: 100%; height: auto; }
          a { color: inherit; text-decoration: none; }
          '''

          metadata: list[dict] = []
          for idx, report in enumerate(reports, start=1):
              raw, final_url = fetch(report['source_url'])
              main_html = extract_main_html(raw, final_url, report, f'r{idx}')
              cover = f'''
              <section class="cover">
                <h1>{html_lib.escape(report['title'])}</h1>
                <div class="meta">
                  <p><strong>机构：</strong>{html_lib.escape(report['broker'])}</p>
                  <p><strong>研究员：</strong>{html_lib.escape(report['analyst'])}</p>
                  <p><strong>报告日期：</strong>{html_lib.escape(report['date'])}</p>
                  <p><strong>报告类型：</strong>{html_lib.escape(report['type'])}</p>
                </div>
                <div class="notice">
                  本文件根据机构公开发布的全文网页整理并导出为PDF，正文与公开页面保持一致；
                  它不是券商客户端中的原始附件PDF，不包含未公开的附录或底稿。仅供研究参考，不构成投资建议。
                </div>
                <p class="source"><strong>公开来源：</strong>{html_lib.escape(final_url)}</p>
              </section>
              '''
              document = f'''<!doctype html>
              <html lang="zh-CN"><head><meta charset="utf-8"><title>{html_lib.escape(report['title'])}</title>
              <style>{CSS}</style></head><body>{cover}<main class="report-body">{main_html}</main></body></html>'''
              html_path = WORK / f'report_{idx}.html'
              html_path.write_text(document, encoding='utf-8')
              output = PACKAGE / report['filename']
              HTML(string=document, base_url=str(WORK)).write_pdf(str(output))
              if not output.exists() or output.stat().st_size < 50000:
                  raise RuntimeError(f'Generated PDF is unexpectedly small: {output}')
              report_meta = dict(report)
              report_meta['resolved_source_url'] = final_url
              report_meta['bytes'] = output.stat().st_size
              metadata.append(report_meta)
              print(f'Generated {output} ({output.stat().st_size} bytes)')

          (PACKAGE / '_metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          python3 work/build_reports.py

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge 2
            pdftotext "$pdf" "$pdf.txt"
            grep -q '河钢股份' "$pdf.txt"
            grep -q '公开全文页导出版' "$pdf.txt"
            rm -f "$pdf.txt"
            pdftoppm -f 1 -l 1 -singlefile -png -r 120 "$pdf" "$pdf.render" >/dev/null 2>&1
            test -s "$pdf.render.png"
            rm -f "$pdf.render.png"
            echo "Validated: $(basename "$pdf") ($pages pages, $(stat -c%s "$pdf") bytes)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          folder = Path('河钢股份_券商研究报告_3份_公开全文版')
          metadata = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')
          by_name = {item['filename']: item for item in metadata}
          lines = [
              '河钢股份（000709）券商研究报告资料包',
              '整理日期：2026-10-16',
              '',
              '重要说明：',
              '1. 公开渠道未能取得这三份报告的券商客户端原始附件PDF。',
              '2. 本包根据机构公开发布的完整全文网页整理并导出为PDF，正文内容来自公开页面。',
              '3. 第一份为明确的首次覆盖/公司深度报告；第二、三份为较新的完整公司研究/更新报告。',
              '4. 文件名均标注“公开全文版”，避免与券商原始附件混淆。',
              '5. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = by_name[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(['pdfinfo', str(pdf)], text=True, errors='replace')
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  机构：{item['broker']}；研究员：{item['analyst']}；日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开来源：{item['resolved_source_url']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、PDF结构、页数、正文关键词和首页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Hegang-000709-broker-research-reports-public-fulltext-3
          path: 河钢股份_券商研究报告_3份_公开全文版/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
