name: Package two official Quantgroup broker reports 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-two-official-broker-reports-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '量化派_02685_券商研究报告_2份_截至2026-09-19'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)
          render_root = Path('_renders')
          render_root.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          docs = [
              {
                  'filename': '01_国投证券国际_量化派_2685HK_IPO点评_2025-11-19.pdf',
                  'broker': '国投证券国际（国证国际）',
                  'title': '量化派（2685.HK）IPO点评',
                  'date': '2025-11-19',
                  'type': 'IPO研究报告',
                  'source_page': 'https://www.sdicsi.com.hk/cn/research-report/tag/2685hk-ipo',
                  'urls': [
                      'https://www.sdicsi.com.hk/backend/storage/app/media/ResearchReports/IPOReports/2685-20251119.pdf',
                      'https://www.sdicsi.com.hk/backend/storage/app/media/ResearchReports/IPOReports/2685-20251119.PDF',
                  ],
                  'min_bytes': 80_000,
                  'min_pages': 1,
                  'identity_terms': ['量化派', 'Quantgroup', '2685', '02685'],
                  'broker_terms': ['国投证券', '國投證券', '国证国际', '國證國際', 'SDIC'],
              },
              {
                  'filename': '02_华安证券香港_量化派_02685HK_IPO报告_2025-11-20.pdf',
                  'broker': '华安证券（香港）',
                  'title': '量化派控股有限公司（02685.HK）IPO报告',
                  'date': '2025-11-20',
                  'type': 'IPO研究报告',
                  'source_page': 'https://www.hasc.com.hk/',
                  'urls': [
                      'https://api.hasc.com.hk/uploads/02685_HK_4281dc2d69.pdf',
                  ],
                  'min_bytes': 100_000,
                  'min_pages': 5,
                  'identity_terms': ['量化派', 'Quantgroup', '2685', '02685'],
                  'broker_terms': ['华安证券', '華安證券', 'Huaan', 'HASC'],
              },
          ]

          def download(doc: dict, dest: Path) -> str:
              errors: list[str] = []
              for url in doc['urls']:
                  for attempt in range(1, 5):
                      try:
                          r = session.get(
                              url,
                              headers={'Referer': doc['source_page']},
                              timeout=(25, 240),
                              allow_redirects=True,
                          )
                          data = r.content
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code,
                                'final', r.url, 'type', r.headers.get('content-type'), 'bytes', len(data), flush=True)
                          r.raise_for_status()
                          if len(data) < doc['min_bytes'] or not data.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: bytes={len(data)}, head={data[:32]!r}')
                          dest.write_bytes(data)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for i, doc in enumerate(docs, 1):
              dest = out / doc['filename']
              final_url = download(doc, dest)
              data = dest.read_bytes()

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_indices = sorted(set(list(range(min(pages, 12))) + ([pages - 1] if pages else [])))
              text = ''
              for idx in sample_indices:
                  try:
                      text += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              low = text.lower()
              if not any(term.lower() in low for term in doc['identity_terms']):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              broker_verified = any(term.lower() in low for term in doc['broker_terms'])

              q = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {q.stderr[-2000:]}')

              render_dir = render_root / f'{i:02d}'
              render_dir.mkdir(exist_ok=True)
              p = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(dest), str(render_dir / 'page1')],
                  capture_output=True,
                  text=True,
              )
              rendered = render_dir / 'page1.png'
              if p.returncode != 0 or not rendered.exists() or rendered.stat().st_size < 10_000:
                  raise RuntimeError(f'first-page render failed for {dest.name}: {p.stderr[-2000:]}')

              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)

              rec = {
                  'filename': doc['filename'],
                  'broker': doc['broker'],
                  'title': doc['title'],
                  'publication_date': doc['date'],
                  'report_type': doc['type'],
                  'source_page': doc['source_page'],
                  'download_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'company_identity_verified': True,
                  'broker_identity_verified_from_text': broker_verified,
                  'qpdf_check': 'passed',
                  'first_page_render': 'passed',
              }
              records.append(rec)
              print('VALIDATED', json.dumps(rec, ensure_ascii=False), flush=True)

          readme = [
              '量化派控股有限公司（02685.HK）券商研究报告',
              '整理日期：2026-09-19',
              '',
              '本压缩包实际包含2份可公开下载并完成完整性核验的券商PDF原件。',
              '量化派上市时间较短，公开可直接下载的长篇首次覆盖报告很少；已检索到的部分长篇覆盖报告需要登录、积分或付费，因此未绕过访问限制，也未用网页摘要或预览图片替代。',
              '本包收录2份券商在上市阶段发布的公司研究/IPO报告。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['broker']}：《{rec['title']}》",
                  f"   类型：{rec['report_type']}；发布日期：{rec['publication_date']}",
                  f"   文件：{rec['filename']}",
                  f"   页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源页面：{rec['source_page']}",
                  f"   PDF地址：{rec['download_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.extend([
              '完整性核验：PDF文件头、公司身份、实际页数、qpdf结构检查、首屏渲染、重复哈希、ZIP CRC和SHA-256。',
              '说明：报告观点、评级和估值均属于相应券商及作者，不代表整理者意见。',
          ])
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(
              ''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-02685-two-official-broker-reports-20260919
          path: 量化派_02685_券商研究报告_2份_截至2026-09-19.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
