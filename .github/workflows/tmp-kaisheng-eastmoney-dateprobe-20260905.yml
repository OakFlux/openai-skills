name: Temporary Kaisheng Eastmoney date probe

on:
  push:
    branches:
      - tmp-kaisheng-eastmoney-dateprobe-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query reports by date
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io, json
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('out'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9',
            'Referer':'https://data.eastmoney.com/report/','Origin':'https://data.eastmoney.com'
          })
          api='https://reportapi.eastmoney.com/report/list'
          ranges=[
            ('2024-05-30','2024-06-02'),
            ('2023-08-03','2023-08-06'),
            ('2022-06-25','2022-07-03'),
            ('2022-05-24','2022-05-30'),
            ('2022-03-20','2022-03-24'),
          ]
          wanted=[]; allrecs=[]
          for begin,end in ranges:
            for page in range(1,21):
              params={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0',
                      'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),
                      'pageNumber':str(page),'client':'WEB','source':'WEB'}
              r=s.get(api,params=params,timeout=90); print('API',begin,end,page,r.status_code,len(r.content),flush=True)
              try: obj=r.json()
              except Exception as e: print('JSONERR',repr(e),r.text[:300]); break
              batch=obj.get('data') or []
              if isinstance(batch,dict): batch=batch.get('data') or batch.get('list') or batch.get('records') or []
              print('ROWS',len(batch),'HITS',obj.get('hits') or obj.get('total'),flush=True)
              if not batch: break
              allrecs.extend(batch)
              for rec in batch:
                title=str(rec.get('title') or '')
                stock=str(rec.get('stockName') or '')
                code=str(rec.get('stockCode') or '')
                if code=='600876' or '凯盛新能' in stock+title or '洛阳玻璃' in stock+title:
                  wanted.append(rec)
                  print('WANTED',json.dumps({k:rec.get(k) for k in ['stockName','stockCode','title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher']},ensure_ascii=False),flush=True)
              hits=obj.get('hits') or obj.get('total') or 0
              if len(batch)<500: break
          # dedupe wanted
          uniq={str(r.get('infoCode')):r for r in wanted if r.get('infoCode')}
          wanted=list(uniq.values())
          results=[]
          for rec in wanted:
            info=rec['infoCode']; u=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            try:
              rr=s.get(u,headers={'Referer':f'https://data.eastmoney.com/report/info/600876/{info}.html','Accept':'application/pdf,*/*'},timeout=(20,180),allow_redirects=True)
              row={'record':rec,'url':u,'status':rr.status_code,'bytes':len(rr.content),'content_type':rr.headers.get('content-type')}
              if rr.status_code==200 and b'%PDF-' in rr.content[:1024] and len(rr.content)>50000:
                row['pages']=len(PdfReader(io.BytesIO(rr.content),strict=False).pages)
                (out/f'{info}.pdf').write_bytes(rr.content)
                row['saved']=f'{info}.pdf'
                print('PDF_OK',info,row['pages'],len(rr.content),rec.get('orgSName'),rec.get('title'),flush=True)
              else: print('PDF_BAD',info,row,flush=True)
            except Exception as e:
              row={'record':rec,'url':u,'error':repr(e)}; print('PDF_ERR',info,repr(e),flush=True)
            results.append(row)
          (out/'wanted.json').write_text(json.dumps(wanted,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('WANTED_COUNT',len(wanted),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-eastmoney-dateprobe
          path: out/*
          retention-days: 1
          if-no-files-found: error
