name: Fast inspect United Laboratories Sdyanbao pages 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-sdyanbao-fast-inspect-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch pages and extract download metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json,html
          from pathlib import Path
          from urllib.parse import urljoin
          urls={'902006':'https://www.sdyanbao.com/detail/902006','920346':'https://www.sdyanbao.com/detail/920346'}
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          result={}
          for rid,u in urls.items():
            try:
              r=s.get(u,timeout=(15,45),allow_redirects=True)
              text=r.content.decode('utf-8','replace')
              Path(f'out/{rid}.html').write_text(text,encoding='utf-8')
              lines=[]
              for n,line in enumerate(text.splitlines(),1):
                low=line.lower()
                if any(k in low for k in ('download','下载','pdf','fileurl','file_url','reporturl','report_url','preview','oss','cos','api/')):
                  lines.append({'line':n,'text':re.sub(r'\s+',' ',line.strip())[:5000]})
              urls_found=[]
              for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                v=html.unescape(m.group(0)).replace('\\/','/')
                if any(k in v.lower() for k in ('pdf','download','file','report','preview','oss','cos','api')):
                  urls_found.append(v)
              rel=[]
              for pat in [r'["\']([^"\']*(?:download|pdf|file|report|preview|api)[^"\']*)["\']',r'(?:fileUrl|pdfUrl|downloadUrl|reportUrl|url)\s*[:=]\s*["\']([^"\']+)["\']']:
                for m in re.finditer(pat,text,re.I):
                  v=html.unescape(m.group(1)).replace('\\/','/')
                  rel.append(urljoin(r.url,v))
              result[rid]={'status':r.status_code,'final':r.url,'bytes':len(r.content),'headers':dict(r.headers),'interesting_lines':lines[:1000],'urls':sorted(set(urls_found+rel))[:2000]}
            except Exception as e:
              result[rid]={'error':repr(e)}
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-sdyanbao-fast-inspect
          path: out
          retention-days: 7
          if-no-files-found: error
