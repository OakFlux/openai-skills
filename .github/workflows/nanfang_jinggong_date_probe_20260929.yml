name: South Precision Archived Report Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_date_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Eastmoney archive by report dates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          import requests

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml'})
          windows=[
            ('2026-01-14','2026-01-21'),
            ('2024-10-29','2024-11-04'),
            ('2022-10-11','2022-10-15'),
            ('2021-12-11','2021-12-15'),
          ]
          for begin,end in windows:
            params={'industryCode':'*','pageSize':'5000','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
            url='https://reportapi.eastmoney.com/report/list?'+urlencode(params)
            r=s.get(url,timeout=90)
            print('\nWINDOW',begin,end,r.status_code,len(r.content),r.url)
            obj=r.json()
            rows=obj.get('data') or []
            print('HITS',obj.get('hits'),'ROWS',len(rows),'TOTALPAGE',obj.get('TotalPage'))
            for row in rows:
              code=str(row.get('stockCode') or '')
              name=str(row.get('stockName') or '')
              title=str(row.get('title') or '')
              if code=='002553' or '南方精工' in name or '南方轴承' in name or '南方精工' in title or '南方轴承' in title:
                keep={k:row.get(k) for k in ['publishDate','stockCode','stockName','title','orgSName','orgName','researcher','emRatingName','sRatingName','attachPages','attachSize','infoCode','column']}
                print('MATCH',json.dumps(keep,ensure_ascii=False))
          PY
