name: South Precision Archived Report Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_date_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Eastmoney archive by report dates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          import requests

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml'})
          windows=[
            ('2026-01-14','2026-01-21'),
            ('2024-10-29','2024-11-04'),
            ('2022-10-11','2022-10-15'),
            ('2021-12-11','2021-12-15'),
          ]
          terms=['002553','南方精工','南方轴承','滚针轴承','轴承+芯片','轴承＋芯片','工艺延伸促成长','新能源汽车注入新活力','积极开拓市场']
          matches=[]
          for begin,end in windows:
            base={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'fields':'','qType':'0','orgCode':'','rcode':''}
            first=dict(base, pageNo='1', p='1', pageNum='1', pageNumber='1')
            r=s.get('https://reportapi.eastmoney.com/report/list',params=first,timeout=90)
            obj=r.json()
            total=int(obj.get('TotalPage') or 1)
            print('\nWINDOW',begin,end,'HITS',obj.get('hits'),'TOTALPAGE',total)
            for page in range(1,total+1):
              params=dict(base,pageNo=str(page),p=str(page),pageNum=str(page),pageNumber=str(page))
              if page==1:
                page_obj=obj
              else:
                rr=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=90)
                page_obj=rr.json()
              rows=page_obj.get('data') or []
              print('PAGE',page,'ROWS',len(rows))
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if any(term in blob for term in terms):
                  keep={k:row.get(k) for k in ['publishDate','stockCode','stockName','title','orgSName','orgName','researcher','emRatingName','sRatingName','attachPages','attachSize','infoCode','column','encodeUrl']}
                  print('MATCH',json.dumps(keep,ensure_ascii=False))
                  matches.append(keep)
          print('\nALL_MATCHES',json.dumps(matches,ensure_ascii=False,indent=2))
          PY
