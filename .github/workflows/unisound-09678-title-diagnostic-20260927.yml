name: Diagnose Yunzhisheng 09678 HKEX title links 20260927

on:
  push:
    paths:
      - '.github/workflows/unisound-09678-title-diagnostic-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture all English and Chinese title links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/diag.py <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          BASE='https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000262960'
          OUT=Path('out')

          async def one(lang):
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(viewport={'width':1600,'height':1200},locale='zh-CN' if lang=='ZH' else 'en-US',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36')
              page=await ctx.new_page()
              url=BASE+'&lang='+lang
              responses=[]
              page.on('response',lambda r: responses.append({'status':r.status,'url':r.url,'type':r.request.resource_type,'content_type':r.headers.get('content-type','')}))
              await page.goto(url,wait_until='domcontentloaded',timeout=120000)
              await page.wait_for_timeout(5000)
              history=[]
              for i in range(12):
                count=await page.locator('a[href*="/listedco/listconews/sehk/"]').count()
                body=(await page.locator('body').inner_text())
                history.append({'iteration':i,'count':count,'has_load_more':('LOAD MORE' in body or '載入更多' in body or '加载更多' in body),'showing_tail':body[-500:]})
                clicked=await page.evaluate('''() => {
                  const els=[...document.querySelectorAll('button,a,div,span')];
                  const matches=els.filter(x => {
                    const t=(x.innerText||'').trim().toUpperCase();
                    return (t==='LOAD MORE'||t.includes('載入更多')||t.includes('加载更多')) && x.offsetParent!==null;
                  });
                  if(matches.length){matches[matches.length-1].click();return {clicked:true,tag:matches[matches.length-1].tagName,cls:matches[matches.length-1].className};}
                  window.scrollTo(0,document.body.scrollHeight);return {clicked:false};
                }''')
                history[-1]['click']=clicked
                await page.wait_for_timeout(2200)
                if i>=3 and history[-1]['count']==history[-2]['count']==history[-3]['count'] and not clicked.get('clicked'):
                  break
              recs=await page.locator('a[href*="/listedco/listconews/sehk/"]').evaluate_all('''els => els.map(e => {
                let p=e; let c=(e.innerText||'').replace(/\s+/g,' ').trim();
                for(let i=0;i<9&&p;i++,p=p.parentElement){
                  const t=(p.innerText||'').replace(/\s+/g,' ').trim();
                  if(t.length>=c.length&&t.length<1800)c=t;
                  if(/\d{2}\/\d{2}\/\d{4}/.test(t)||/\d{4}[年\/-]\d{1,2}[月\/-]\d{1,2}/.test(t))break;
                }
                return {text:(e.innerText||'').replace(/\s+/g,' ').trim(),context:c,href:e.href};
              })''')
              body=await page.locator('body').inner_text()
              data={'lang':lang,'url':url,'final_url':page.url,'title':await page.title(),'history':history,'records':recs,'body':body,'responses':responses}
              (OUT/f'{lang}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
              (OUT/f'{lang}.html').write_text(await page.content(),encoding='utf-8')
              await page.screenshot(path=str(OUT/f'{lang}.png'),full_page=True)
              print(lang,'records',len(recs))
              for r in recs:
                x=(r['text']+' '+r['context']).upper()
                if any(k in x for k in ['ANNUAL REPORT','GLOBAL OFFERING','PROSPECTUS','INTERIM RESULTS','年度報告','全球發售','招股','中期業績']):
                  print(lang,json.dumps(r,ensure_ascii=False))
              await browser.close()
          async def main():
            for lang in ('EN','ZH'):
              await one(lang)
          asyncio.run(main())
          PY
          python /tmp/diag.py
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: unisound-09678-title-diagnostic
          path: out
          retention-days: 7
          if-no-files-found: error
