name: Temporary Johnson Electric broker report discovery

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-johnson-electric-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public report indexes and test PDF endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re, requests

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept':'application/json,text/plain,*/*','Referer':'https://data.eastmoney.com/report/'})
          variants=['00179','0179','179','00179.HK','0179.HK','HK00179','HK0179']
          all_rows={}
          for code in variants:
              for endpoint in ['https://reportapi.eastmoney.com/report/list2','https://reportapi.eastmoney.com/report/list']:
                  try:
                      if endpoint.endswith('list2'):
                          body={'pageSize':300,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2018-01-01','endTime':'2026-08-31','code':code,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
                          r=s.post(endpoint,json=body,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Content-Type':'application/json','Accept':'application/json,text/plain,*/*'},timeout=90)
                      else:
                          params={'pageNo':'1','pageSize':'300','code':code,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','beginTime':'2018-01-01','endTime':'2026-08-31','fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
                          r=s.get(endpoint,params=params,timeout=90)
                      print('\nEM_API',endpoint,code,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                      print('HEAD',repr(r.text[:200]))
                      if r.status_code!=200: continue
                      obj=r.json(); rows=obj.get('data') or []
                      print('ROWS',len(rows),'HITS',obj.get('hits'),'PAGES',obj.get('TotalPage'))
                      for row in rows:
                          info=row.get('infoCode'); key=info or str((row.get('title'),row.get('publishDate'),row.get('orgSName')))
                          all_rows[key]=row
                          print('EM_ROW',json.dumps({'code_query':code,'date':str(row.get('publishDate') or '')[:10],'broker':row.get('orgSName') or row.get('orgName'),'title':row.get('title'),'pages':row.get('attachPages'),'infoCode':info,'rating':row.get('emRatingName') or row.get('sRatingName'),'researcher':row.get('researcher'),'stockCode':row.get('stockCode'),'stockName':row.get('stockName')},ensure_ascii=False))
                          if info:
                              for pre in ['H3','H2','H1']:
                                  u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                                  try:
                                      x=requests.get(u,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*','Range':'bytes=0-4095'},timeout=60,allow_redirects=True)
                                      print('EM_PDF',info,pre,x.status_code,len(x.content),x.headers.get('content-type'),x.headers.get('content-range'),repr(x.content[:20]),x.url)
                                  except Exception as e: print('EM_PDF_ERR',info,pre,repr(e))
                  except Exception as e:
                      print('EM_ERR',endpoint,code,repr(e))

          # Search public report metadata mirrors. These often expose the Eastmoney AP id even when code lookup fails.
          sd=requests.Session(); sd.headers.update({'User-Agent':ua,'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'})
          queries=[
              '德昌电机控股','00179','0179.HK','Johnson Electric Holdings',
              '有内生优势的人形机器人供应链公司',
              'AIDC液冷+机器人开启成长新曲线',
              'AIDC服务器冷却泵业务商业化落地',
              '传统主业稳健，新兴业务推进',
          ]
          seen=set(); matches=[]
          for q in queries:
              for page in range(1,8):
                  payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':page,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
                  try:
                      r=sd.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=90)
                      print('\nSD_QUERY',q,page,r.status_code,len(r.content),r.headers.get('content-type'))
                      r.raise_for_status(); data=(r.json().get('data') or {}); files=data.get('files') or []
                      print('SD_TOTAL',data.get('total'),'COUNT',len(files))
                      for f in files:
                          fid=f.get('id')
                          if fid in seen: continue
                          seen.add(fid)
                          name=str(f.get('name') or ''); stock=f.get('stock') or {}; content=str(f.get('content') or '')[:3000]
                          blob=' '.join([name,str(stock.get('name') or ''),str(stock.get('code') or ''),content])
                          if not any(k in blob for k in ['德昌电机控股','00179','0179.HK','Johnson Electric']):
                              continue
                          row={'id':fid,'name':name,'date':f.get('time_text'),'pages':f.get('page_count'),'size':f.get('file_size'),'type':(f.get('type') or {}).get('name'),'organization':(f.get('organization') or {}).get('name'),'stock':stock,'uuid':f.get('data_source_uuid'),'data_source':f.get('data_source'),'original_id':f.get('original_id'),'online_url':f.get('online_url'),'page_url':f.get('page_url'),'share_url':f.get('share_url'),'summary':str(f.get('summary') or '')[:800]}
                          matches.append(row); print('SD_MATCH',json.dumps(row,ensure_ascii=False))
                          uuid=str(f.get('data_source_uuid') or '')
                          for info in re.findall(r'AP\d+',uuid):
                              for pre in ['H3','H2','H1']:
                                  u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                                  try:
                                      x=requests.get(u,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*','Range':'bytes=0-4095'},timeout=60,allow_redirects=True)
                                      print('SD_AP_TEST',info,pre,x.status_code,len(x.content),x.headers.get('content-type'),x.headers.get('content-range'),repr(x.content[:20]),x.url)
                                  except Exception as e: print('SD_AP_ERR',info,pre,repr(e))
                      if not files or page*100>=int(data.get('total') or 0): break
                  except Exception as e: print('SD_ERR',q,page,repr(e))

          # Inspect known public report index pages for hidden direct PDF links.
          pages=[
              'https://www.sgpjbg.com/bgdown/936436.html',
              'https://www.nxny.com/report/view_6213589.html',
              'https://www.nxny.com/report/view_6150596.html',
              'https://finance.sina.com.cn/stock/hkstock/hkgg/2026-03-05/doc-inhpwzrv6655471.shtml',
          ]
          for url in pages:
              try:
                  r=requests.get(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*'},timeout=90,allow_redirects=True)
                  print('\nPAGE',url,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                  for pat in [r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',r'https?://[^\s"\'<>]+(?:download|attachment|file|oss|cdn)[^\s"\'<>]*']:
                      for m in sorted(set(re.findall(pat,r.text,re.I))): print('PAGE_ASSET',m[:2000])
                  for needle in ['有内生优势的人形机器人供应链公司','AIDC液冷','德昌电机控股','00179','0179.HK','pdf','download']:
                      for hit in list(re.finditer(re.escape(needle),r.text,re.I))[:10]:
                          p=hit.start(); print('PAGE_CTX',needle,re.sub(r'\s+',' ',r.text[max(0,p-400):p+1300])[:1700])
              except Exception as e: print('PAGE_ERR',url,repr(e))

          print('\nSUMMARY_EM_ROWS',len(all_rows))
          print('SUMMARY_SD_MATCHES',len(matches))
          print(json.dumps(matches,ensure_ascii=False,indent=2))
          PY
