name: Build Great Eagle 00041 annual reports and latest interim package 20260922

on:
  push:
    paths:
      - '.github/workflows/great-eagle-00041-filings-package-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf

      - name: Download, validate and package official filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          PACKAGE = '鹰君集团_00041_2020-2025年报及最新阶段性财务报告'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,text/html;q=0.8,*/*;q=0.7',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Cache-Control': 'no-cache',
          })

          def uniq(values):
              return list(dict.fromkeys(v for v in values if v))

          def host_variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              if 'www.greateagle.com.hk' in url:
                  vals.append(url.replace('www.greateagle.com.hk', 'greateagle.com.hk'))
              return uniq(vals)

          def get_html(url: str) -> tuple[str, str]:
              r = session.get(url, timeout=(30, 120), allow_redirects=True)
              print('HTML', r.status_code, url, '->', r.url, 'bytes', len(r.content), flush=True)
              r.raise_for_status()
              return r.text, str(r.url)

          def discover_hkex_link(text_options: list[str]) -> list[str]:
              urls = []
              search_urls = [
                  'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=61',
                  'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=ZH&market=SEHK&stockId=61',
              ]
              for search_url in search_urls:
                  try:
                      html, final = get_html(search_url)
                  except Exception as exc:
                      print('HKEX_SEARCH_ERROR', repr(exc), flush=True)
                      continue
                  soup = BeautifulSoup(html, 'lxml')
                  for a in soup.find_all('a', href=True):
                      label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True)).lower()
                      if any(opt.lower() in label for opt in text_options):
                          u = urljoin(final, a['href'])
                          if '.pdf' in u.lower() or 'listedco/listconews' in u.lower():
                              urls.extend(host_variants(u))
                  # Regex fallback for pages whose anchor text is rendered oddly.
                  for opt in text_options:
                      pat = re.compile(r'href=["\']([^"\']+\.pdf[^"\']*)["\'][^>]*>.*?' + re.escape(opt), re.I | re.S)
                      for m in pat.finditer(html):
                          urls.extend(host_variants(urljoin(final, m.group(1))))
              print('HKEX_DISCOVERY', text_options, uniq(urls), flush=True)
              return uniq(urls)

          def discover_financialfilings_original() -> list[str]:
              page = 'https://financialfilings.com/filings/great-eagle-holdings-limited/interim-quarterly-report/2026/57614125/'
              urls = []
              try:
                  html, final = get_html(page)
                  soup = BeautifulSoup(html, 'lxml')
                  for a in soup.find_all('a', href=True):
                      label = a.get_text(' ', strip=True).lower()
                      href = urljoin(final, a['href'])
                      if href.lower().endswith('.pdf') or ('original' in label and 'pdf' in href.lower()):
                          urls.append(href)
                  for m in re.finditer(r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?', html, re.I):
                      urls.append(m.group(0))
              except Exception as exc:
                  print('FINANCIALFILINGS_DISCOVERY_ERROR', repr(exc), flush=True)
              print('FINANCIALFILINGS_DISCOVERY', uniq(urls), flush=True)
              return uniq(urls)

          discovered = {
              '2024_annual': discover_hkex_link(['Annual Report 2024', '2024 Annual Report', '2024 年報', '2024年報']),
              '2026_interim_full': discover_hkex_link(['Interim Report 2026', '2026 Interim Report', '2026 中期報告', '2026年中期報告']),
              '2026_interim_announcement': discover_hkex_link(['2026 Interim Results Announcement', '2026 中期業績公布', '2026年中期業績公布']),
          }

          docs = [
              {
                  'filename': '01_鹰君集团_00041_2020年年度报告_官方原件.pdf',
                  'title': '鹰君集团2020年年度报告',
                  'period': '2020年度',
                  'urls': host_variants('https://www.greateagle.com.hk/storage/photos/shares/finance-reports/c-GE-2020-AR.pdf'),
                  'min_bytes': 2_000_000, 'min_pages': 240,
              },
              {
                  'filename': '02_鹰君集团_00041_2021年年度报告_官方原件.pdf',
                  'title': '鹰君集团2021年年度报告',
                  'period': '2021年度',
                  'urls': host_variants('https://www.greateagle.com.hk/storage/photos/shares/regular-disclosure/c_2021%20Annual%20Report-GE.pdf'),
                  'min_bytes': 2_000_000, 'min_pages': 240,
              },
              {
                  'filename': '03_鹰君集团_00041_2022年年度报告_官方原件.pdf',
                  'title': '鹰君集团2022年年度报告',
                  'period': '2022年度',
                  'urls': host_variants('https://www.greateagle.com.hk/storage/photos/shares/finance-reports/c_00041_2022%20Annual%20Report%20%28Company%27s%20website%29.pdf'),
                  'min_bytes': 2_000_000, 'min_pages': 240,
              },
              {
                  'filename': '04_鹰君集团_00041_2023年年度报告_官方原件.pdf',
                  'title': '鹰君集团2023年年度报告',
                  'period': '2023年度',
                  'urls': host_variants('https://www.greateagle.com.hk/storage/photos/shares/finance-reports/c0041_240306_ar.pdf'),
                  'min_bytes': 2_000_000, 'min_pages': 190,
              },
              {
                  'filename': '05_鹰君集团_00041_2024年年度报告_官方原件.pdf',
                  'title': '鹰君集团2024年年度报告',
                  'period': '2024年度',
                  'urls': uniq(
                      host_variants('https://www.greateagle.com.hk/storage/photos/shares/finance-reports/c0041_Annual%20Report%202024.pdf')
                      + discovered['2024_annual']
                  ),
                  'min_bytes': 2_000_000, 'min_pages': 180,
              },
              {
                  'filename': '06_鹰君集团_00041_2025年年度报告_官方原件.pdf',
                  'title': '鹰君集团2025年年度报告',
                  'period': '2025年度',
                  'urls': uniq(
                      host_variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0331/2026033102681.pdf')
                      + host_variants('https://www.greateagle.com.hk/storage/photos/shares/finance-reports/C41_AR%20%28For%20Website%29.pdf')
                  ),
                  'min_bytes': 5_000_000, 'min_pages': 180,
              },
          ]

          if discovered['2026_interim_full']:
              docs.append({
                  'filename': '07_鹰君集团_00041_2026年中期报告_最新完整阶段性报告.pdf',
                  'title': '鹰君集团2026年中期报告',
                  'period': '截至2026年6月30日止六个月',
                  'urls': discovered['2026_interim_full'],
                  'min_bytes': 500_000, 'min_pages': 70,
              })
          else:
              docs.extend([
                  {
                      'filename': '07_鹰君集团_00041_2025年中期报告_最新已发布完整中期报告.pdf',
                      'title': '鹰君集团2025年中期报告',
                      'period': '截至2025年6月30日止六个月',
                      'urls': uniq(
                          host_variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0925/2025092501024.pdf')
                          + host_variants('https://www.greateagle.com.hk/storage/photos/shares/finance-reports/cw_00041IR-20250922.pdf')
                      ),
                      'min_bytes': 500_000, 'min_pages': 80,
                  },
                  {
                      'filename': '08_鹰君集团_00041_2026年中期业绩公告_最新财务披露.pdf',
                      'title': '鹰君集团2026年中期业绩公告',
                      'period': '截至2026年6月30日止六个月',
                      'urls': uniq(discovered['2026_interim_announcement'] + discover_financialfilings_original()),
                      'min_bytes': 150_000, 'min_pages': 20,
                  },
              ])

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors = []
              if not urls:
                  raise RuntimeError(f'No candidate URLs for {dest.name}')
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          headers = {'Referer': 'https://www.greateagle.com.hk/'}
                          if 'hkexnews.hk' in url:
                              headers['Referer'] = 'https://www1.hkexnews.hk/'
                          with session.get(url, headers=headers, timeout=(30, 360), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          head = tmp.read_bytes()[:8]
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'Download failed for {dest.name}: {errors}')

          records = []
          seen = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'Page count too small for {dest.name}: {pages}')

              sample = ''
              sample_indexes = list(range(min(18, pages)))
              if pages > 30:
                  sample_indexes += [pages // 2, pages - 1]
              for idx in sorted(set(sample_indexes)):
                  try:
                      sample += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              low = sample.lower()
              identity_ok = any(term.lower() in low for term in ('great eagle', '鷹君', '鹰君', 'stock code 41', '股份代號 41', '股份代号 41'))
              if not identity_ok:
                  raise RuntimeError(f'Company identity could not be verified in {dest.name}')

              q = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {q.stderr[-1500:]}')
              preview = out / (dest.stem + '_首页预览')
              p = subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '80', str(dest), str(preview)], capture_output=True, text=True)
              if p.returncode != 0 or not preview.with_suffix('.png').exists():
                  raise RuntimeError(f'First-page render failed for {dest.name}: {p.stderr[-1000:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen:
                  raise RuntimeError(f'Duplicate PDF detected: {dest.name}')
              seen.add(sha)
              rec = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'source': '鹰君集团官方网站 / 香港交易所披露易',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(rec)
              print('VALIDATED', json.dumps(rec, ensure_ascii=False), flush=True)

          readme = [
              '鹰君集团有限公司（00041.HK）年度报告及最新阶段性财务报告',
              '整理日期：2026-09-22',
              '',
              '收录范围：2020年至2025年全部年度报告，以及截至整理日可取得的最新阶段性财务报告。',
              '香港主板上市公司通常不按A股口径强制发布第一季度和第三季度报告。',
          ]
          if any('2026年中期报告' in r['title'] for r in records):
              readme.append('本包已收录2026年中期报告，作为最新阶段性财务报告。')
          else:
              readme.append('截至整理日，港交所已披露2026年中期业绩公告，但尚未检索到2026年完整中期报告；因此同时收录2025年完整中期报告及2026年中期业绩公告。')
          readme.extend(['', '文件清单：'])
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   报告期：{rec['period']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司身份、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。')
          (out / '00_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) < 7:
                  raise RuntimeError(f'PDF count too small: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: great-eagle-00041-filings-final
          path: 鹰君集团_00041_2020-2025年报及最新阶段性财务报告.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
