name: Build Yunji 02670 HK filings package 20260919

on:
  push:
    paths:
      - '.github/workflows/yunji-02670-hk-filings-package-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow

      - name: Download official filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '云迹_02670_港股_招股说明书_2025年报_2026中期业绩'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          def variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 420), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def render_sample_pages(pdf: Path, page_count: int) -> list[int]:
              sample_pages = sorted(set([1, max(1, page_count // 2), page_count]))
              with tempfile.TemporaryDirectory(prefix='pdf-render-') as td:
                  temp_dir = Path(td)
                  for page_no in sample_pages:
                      prefix = temp_dir / f'{pdf.stem}-p{page_no}'
                      run = subprocess.run(
                          [
                              'pdftoppm', '-f', str(page_no), '-l', str(page_no),
                              '-singlefile', '-r', '72', '-png', str(pdf), str(prefix)
                          ],
                          capture_output=True,
                          text=True,
                          timeout=180,
                      )
                      if run.returncode != 0:
                          raise RuntimeError(f'pdftoppm failed for {pdf.name} page {page_no}: {run.stderr[-1500:]}')
                      image_path = prefix.with_suffix('.png')
                      if not image_path.exists() or image_path.stat().st_size < 3000:
                          raise RuntimeError(f'render output missing or too small: {pdf.name} page {page_no}')
                      with Image.open(image_path) as image:
                          image.verify()
                      with Image.open(image_path) as image:
                          width, height = image.size
                      if width < 300 or height < 300:
                          raise RuntimeError(f'render dimensions too small: {pdf.name} page {page_no} {width}x{height}')
              return sample_pages

          docs = [
              {
                  'filename': '01_云迹_02670_招股说明书_中文版_2025-10-08.pdf',
                  'title': '云迹最终招股说明书（中文版）',
                  'date': '2025-10-08',
                  'urls': variants('https://www.hkexnews.hk/listedco/listconews/sehk/2025/1008/2025100800004_c.pdf'),
                  'min_bytes': 5_000_000,
                  'min_pages': 600,
              },
              {
                  'filename': '02_Yunji_02670_Prospectus_English_2025-10-08.pdf',
                  'title': 'Beijing Yunji Technology Final Prospectus (English)',
                  'date': '2025-10-08',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1008/2025100800003.pdf'),
                  'min_bytes': 5_000_000,
                  'min_pages': 600,
              },
              {
                  'filename': '03_云迹_02670_2025年年度报告_中文版_2026-04-29.pdf',
                  'title': '云迹2025年年度报告（中文版）',
                  'date': '2026-04-29',
                  'urls': variants('https://www.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042906273_c.pdf'),
                  'min_bytes': 3_000_000,
                  'min_pages': 180,
              },
              {
                  'filename': '04_Yunji_02670_2025_Annual_Report_English_2026-04-29.pdf',
                  'title': 'Beijing Yunji Technology 2025 Annual Report (English)',
                  'date': '2026-04-29',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042906272.pdf'),
                  'min_bytes': 3_000_000,
                  'min_pages': 180,
              },
              {
                  'filename': '05_云迹_02670_2026年中期业绩公告_中文版_2026-08-20.pdf',
                  'title': '截至2026年6月30日止六个月中期业绩公告（中文版）',
                  'date': '2026-08-20',
                  'urls': variants('https://www.hkexnews.hk/listedco/listconews/sehk/2026/0820/2026082001580_c.pdf'),
                  'min_bytes': 100_000,
                  'min_pages': 30,
              },
              {
                  'filename': '06_Yunji_02670_2026_Interim_Results_English_2026-08-20.pdf',
                  'title': 'Interim Results Announcement for the Six Months Ended June 30, 2026 (English)',
                  'date': '2026-08-20',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0820/2026082001579.pdf'),
                  'min_bytes': 100_000,
                  'min_pages': 30,
              },
          ]

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              if reader.is_encrypted:
                  raise RuntimeError(f'encrypted PDF not accepted: {dest.name}')
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(25, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              lower = sample_text.lower()
              identity_ok = any(term in lower for term in ('2670', 'beijing yunji', 'yunji technology', '北京雲迹', '北京云迹'))
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              rendered_pages = render_sample_pages(dest, pages)
              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'disclosure_date': doc['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'render_checked_pages': rendered_pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '北京云迹科技股份有限公司（02670.HK，简称“云迹”）港股披露文件',
              '整理日期：2026-09-19',
              '',
              '收录范围：最终招股说明书、上市后全部完整年度报告，以及截至整理日最新阶段性财务披露。',
              '云迹于2025-10-16在香港联交所主板上市，因此截至2026-09-19，上市后的完整年度报告只有2025年年度报告；上市前历史财务资料已载于最终招股说明书。',
              '香港主板公司通常不按A股口径强制发布第一、第三季度报告。截至2026-09-19，港交所披露页尚未出现完整《2026年中期报告》；最新财务披露为2026-08-20发布的截至2026年6月30日止六个月中期业绩公告。本包将其作为“最新季报/阶段性财务报告”收录，并明确保留原文件类型，不将其误标为完整中期报告。',
              '最终招股说明书、2025年年度报告和2026年中期业绩公告均收录中英文官方PDF原件。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   抽样渲染核验页：{', '.join(str(x) for x in rec['render_checked_pages'])}",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司/证券代码身份、实际页数、非加密状态、qpdf结构检查、首/中/末页抽样渲染、文件去重、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 6:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: yunji-02670-hk-filings-final
          path: 云迹_02670_港股_招股说明书_2025年报_2026中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
