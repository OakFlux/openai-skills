name: Query exact older Huabao International deep reports

on:
  push:
    branches: [chatgpt-huabao-international-reports-20260907]
    paths: ['.github/workflows/chatgpt-huabao-exact-older-reports.yml']

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Query exact report titles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          api='https://api.sdyanbao.com/api/file/search'
          phrases=[
            '乘新型烟草之风，打造全球高壁垒供应商',
            '乘新型烟草之风 打造全球高壁垒供应商',
            '香精、薄片壁垒明显，新型烟草蓄势待发',
            '香精 薄片壁垒明显 新型烟草蓄势待发',
            '借力爆珠与烟草薄片，烟用香精香料龙头再起飞',
            '借力爆珠与烟草薄片 烟用香精香料龙头再起飞',
            '味觉生态圈持续拓张，烟草全链条扬帆起航',
            '味觉生态圈持续拓张 烟草全链条扬帆起航',
            '轻装上阵、全面出海，盈利拐点与价值重估起点',
            '历尽千帆，涅槃重生'
          ]
          found={}; logs=[]
          for phrase in phrases:
            for only in (1,0):
              body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':phrase,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              req=urllib.request.Request(api,data=json.dumps(body,ensure_ascii=False).encode('utf-8'),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
              try:
                with urllib.request.urlopen(req,timeout=25) as r:
                  payload=json.loads(r.read().decode('utf-8'))
                rows=(payload.get('data') or {}).get('files') or []
                total=int((payload.get('data') or {}).get('total') or 0)
                logs.append({'phrase':phrase,'onlyTitle':only,'rows':len(rows),'total':total})
                print('QUERY',repr(phrase),'ONLY',only,'ROWS',len(rows),'TOTAL',total,flush=True)
              except Exception as e:
                logs.append({'phrase':phrase,'onlyTitle':only,'error':repr(e)})
                print('FAIL',repr(phrase),only,repr(e),flush=True)
                continue
              for x in rows:
                title=str(x.get('name') or '')
                blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                if any(k in title for k in ('乘新型烟草','香精、薄片壁垒','借力爆珠','味觉生态圈','轻装上阵','历尽千帆')) or any(k in blob for k in ('华宝国际','華寶國際','00336.hk','0336.hk')):
                  found[str(x.get('id'))]=x
          compact=[]
          for x in found.values():
            compact.append({
              'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),
              'page_url':x.get('page_url'),'share_url':x.get('share_url'),'data_source':x.get('data_source'),
              'data_source_uuid':x.get('data_source_uuid'),'type':(x.get('type') or {}).get('name'),
              'organization':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),
              'stock':x.get('stock')
            })
          compact.sort(key=lambda x:(x.get('date') or '',int(x.get('page_count') or 0)),reverse=True)
          Path('output/results.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/query_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULTS',json.dumps(compact,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-exact-older-results
          path: output/
          retention-days: 3
