name: package-donghu-hightech-600133-broker-reports-v4

on:
  push:
    branches:
      - tmp/donghu-hightech-600133-broker-reports-20261104-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Query stock-report API and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = "600133"
          COMPANY = "东湖高新"
          FULL_NAME = "武汉东湖高新集团股份有限公司"
          PREPARED = "2026-11-04"
          ROOT_NAME = "东湖高新_600133_券商研究报告_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer": "https://data.eastmoney.com/",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })
          API = "https://reportapi.eastmoney.com/report/list2"

          def decode_response(response: requests.Response) -> dict:
              text = response.text.strip().lstrip("\ufeff")
              try:
                  return response.json()
              except Exception:
                  left, right = text.find("("), text.rfind(")")
                  if left >= 0 and right > left:
                      return json.loads(text[left + 1:right])
                  return json.loads(text)

          def fetch_rows() -> list[dict]:
              bodies = []
              for begin, end in [("2017-01-01", "2026-11-04"), ("2000-01-01", "2030-01-01")]:
                  base = {
                      "pageSize": 100,
                      "pageNo": 1,
                      "p": 1,
                      "pageNum": 1,
                      "pageNumber": 1,
                      "beginTime": begin,
                      "endTime": end,
                      "code": CODE,
                      "industryCode": "*",
                      "rating": None,
                      "ratingChange": None,
                      "orgCode": None,
                      "rcode": "",
                  }
                  bodies.extend([
                      dict(base),
                      {**base, "qType": "1"},
                      {**base, "qType": "0"},
                  ])
              for body in bodies:
                  response = session.post(API, json=body, headers={"Content-Type": "application/json", "Accept": "application/json, text/plain, */*"}, timeout=(30, 180))
                  print("POST", response.status_code, len(response.content), json.dumps(body, ensure_ascii=False))
                  print("RESPONSE_HEAD", response.text[:1000])
                  response.raise_for_status()
                  payload = decode_response(response)
                  print("KEYS", sorted(payload.keys()), "HITS", payload.get("hits"), "SIZE", payload.get("size"), "TOTALPAGE", payload.get("TotalPage"))
                  rows = payload.get("data") or []
                  if isinstance(rows, dict):
                      rows = rows.get("data") or rows.get("list") or rows.get("items") or []
                  if isinstance(rows, list) and rows:
                      print("SAMPLE", json.dumps(rows[0], ensure_ascii=False)[:5000])
                      return rows
              return []

          rows = fetch_rows()
          print("ROW_COUNT", len(rows))
          if not rows:
              raise RuntimeError("Eastmoney /report/list2 returned no stock reports")

          def first(row: dict, *keys: str) -> str:
              for key in keys:
                  value = row.get(key)
                  if value is not None and str(value).strip():
                      return str(value).strip()
              return ""

          def norm(text: str) -> str:
              return re.sub(r"[\s：:，,。.!！?？、·—\-（）()]+", "", text or "")

          priorities = [
              "置出工程业务轻装再出发",
              "调整发展战略发力数字科技",
              "财务费用拖累盈利能力数科业务布局继续推进",
              "业务调整毛利率改善积极拓展数科领域",
              "资产减值略有承压工程业务置出持续推进",
              "数科业务布局成效初显投资损失拖累Q1业绩",
              "业务调整收入降速新兴产业加速布局",
          ]

          candidates = []
          for row in rows:
              candidate = {
                  "infoCode": first(row, "infoCode", "infocode", "reportId"),
                  "title": first(row, "title", "reportTitle"),
                  "date": first(row, "publishDate", "publishTime", "date")[:10],
                  "broker": first(row, "orgSName", "orgName", "orgNameCn", "org"),
                  "analyst": first(row, "researcher", "author", "researcherName"),
                  "rating": first(row, "emRatingName", "rating", "ratingName"),
                  "pages_meta": first(row, "attachPages", "pageCount", "pages"),
                  "raw": row,
              }
              candidate["matched_priority"] = next((p for p in priorities if p in norm(candidate["title"])), "")
              candidates.append(candidate)
              print("CANDIDATE", json.dumps(candidate, ensure_ascii=False, default=str)[:4000])

          matching = [item for item in candidates if item["infoCode"] and item["matched_priority"]]
          if len(matching) < 2:
              matching = [item for item in candidates if item["infoCode"]]
          print("MATCHING_COUNT", len(matching))

          def download_pdf(info_code: str) -> tuple[bytes, str]:
              errors = []
              for prefix in ["H3", "H2", "H1", "H4"]:
                  url = f"https://pdf.dfcfw.com/pdf/{prefix}_{info_code}_1.pdf"
                  try:
                      response = session.get(url, timeout=(30, 360), allow_redirects=True, headers={"Referer": "https://data.eastmoney.com/", "Accept": "application/pdf,*/*;q=0.8"})
                      print("PDF", response.status_code, len(response.content), response.headers.get("content-type"), url)
                      if response.status_code == 200 and response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                          return response.content, url
                      errors.append(f"{url}: status={response.status_code}, bytes={len(response.content)}")
                  except Exception as exc:
                      errors.append(f"{url}: {exc!r}")
              raise RuntimeError(" | ".join(errors))

          downloaded = []
          temp_dir = Path("_stock_report_pdfs")
          temp_dir.mkdir(exist_ok=True)
          for candidate in matching:
              try:
                  data, source_url = download_pdf(candidate["infoCode"])
              except Exception as exc:
                  print("SKIP", candidate["infoCode"], repr(exc))
                  continue
              path = temp_dir / f"{candidate['infoCode']}.pdf"
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              text_parts = []
              for page in reader.pages[: min(8, pages)]:
                  try:
                      text_parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              compact = norm("\n".join(text_parts))
              issuer_match = CODE in compact or COMPANY in compact or FULL_NAME in compact
              downloaded.append({
                  **{k: v for k, v in candidate.items() if k != "raw"},
                  "temp_path": str(path),
                  "source_url": source_url,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "issuer_match": issuer_match,
              })
              print("DOWNLOADED", pages, issuer_match, json.dumps(downloaded[-1], ensure_ascii=False))

          if len(downloaded) < 2:
              raise RuntimeError(f"Only {len(downloaded)} original PDFs were downloaded")

          by_priority = {}
          for item in downloaded:
              if item["matched_priority"]:
                  by_priority.setdefault(item["matched_priority"], item)
          selected = []
          for priority in priorities:
              item = by_priority.get(priority)
              if item and item not in selected:
                  selected.append(item)
              if len(selected) == 3:
                  break
          if len(selected) < 3:
              for item in sorted(downloaded, key=lambda x: (x["date"], x["pages"]), reverse=True):
                  if item not in selected:
                      selected.append(item)
                  if len(selected) == 3:
                      break

          def safe_name(text: str, limit: int = 88) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text).strip(" ._")
              return text[:limit] or "report"

          manifest = []
          for idx, item in enumerate(selected, 1):
              filename = f"{idx:02d}_{safe_name(item['date'])}_{safe_name(item['broker'] or '未知机构')}_{safe_name(item['title'])}_{item['infoCode']}.pdf"
              output = PDF_DIR / filename
              output.write_bytes(Path(item["temp_path"]).read_bytes())
              check = subprocess.run(["qpdf", "--warning-exit-0", "--check", str(output)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {filename}: {check.stdout}")
              preview_prefix = PREVIEW_DIR / output.stem
              render = subprocess.run(["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output), str(preview_prefix)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              preview = Path(str(preview_prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")
              if item["matched_priority"] == "置出工程业务轻装再出发":
                  report_type = "首次覆盖/公司研究"
              elif item["matched_priority"] == "调整发展战略发力数字科技":
                  report_type = "战略转型专题/公司点评"
              elif item["date"] >= "2025-01-01":
                  report_type = "最新经营跟踪/公司点评"
              else:
                  report_type = "公司研究/跟踪报告"
              clean = {k: v for k, v in item.items() if k != "temp_path"}
              clean.update({"filename": filename, "report_type": report_type, "preview_file": str(Path("首页预览") / preview.name)})
              manifest.append(clean)

          readme = [
              f"{FULL_NAME}（{CODE}.SH）券商研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              f"本包收录{len(manifest)}份可公开下载并核验的券商原始PDF。",
              "筛选优先级为首次覆盖、战略转型专题及较新的经营跟踪。东湖高新公开长篇深度覆盖较少，故部分文件属于公司点评，但均为券商原始PDF。",
              "未使用网页摘要或二次排版文件补数。",
              "",
          ]
          for idx, item in enumerate(manifest, 1):
              readme.extend([
                  f"{idx}. {item['filename']}",
                  f"   类型：{item['report_type']}；券商：{item['broker']}；研究员：{item['analyst']}",
                  f"   日期：{item['date']}；评级：{item['rating']}；页数：{item['pages']}",
                  f"   标题：{item['title']}",
                  f"   原始来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、标题与元数据、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")
          (ROOT / "manifest.json").write_text(json.dumps({"company": FULL_NAME, "stock_code": CODE, "prepared_on": PREPARED, "report_count": len(manifest), "files": manifest}, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "报告类型", "券商", "研究员", "日期", "标题", "评级", "页数", "字节数", "SHA-256", "原始PDF来源"])
              for item in manifest:
                  writer.writerow([item["filename"], item["report_type"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"], item["pages"], item["bytes"], item["sha256"], item["source_url"]])
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n", encoding="utf-8")

          zip_path = Path("donghu_hightech_600133_broker_reports_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdfs = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdfs) != len(manifest):
                  raise RuntimeError(f"ZIP PDF count mismatch: {len(pdfs)} vs {len(manifest)}")
          result = {"package": zip_path.name, "zip_bytes": zip_path.stat().st_size, "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(), "report_count": len(manifest), "files": [{k: item[k] for k in ["filename", "report_type", "broker", "analyst", "date", "title", "rating", "pages", "bytes", "sha256", "source_url"]} for item in manifest]}
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: donghu-hightech-600133-broker-reports-v4-20261104
          path: |
            donghu_hightech_600133_broker_reports_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
