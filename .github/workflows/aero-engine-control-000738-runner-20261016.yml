name: Build Aero Engine Control 000738 filings package 20261016

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aero-engine-control-000738-runner-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Adapt the validated filing packager and run it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, textwrap

          source = Path('.github/workflows/keda-600499-filings-package-20261016.yml').read_text(encoding='utf-8')
          begin = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("\n          PY\n", begin)
          script = textwrap.dedent(source[begin:end])

          replacements = [
              ("COMPANY_FULL = '科达制造股份有限公司'", "COMPANY_FULL = '中国航发动力控制股份有限公司'"),
              ("COMPANY_SHORT = '科达制造'", "COMPANY_SHORT = '航发控制'"),
              ("COMPANY_ALIASES = ['科达制造', '科达制造股份有限公司', '科达洁能', '广东科达洁能股份有限公司', '600499']",
               "COMPANY_ALIASES = ['航发控制', '中国航发动力控制股份有限公司', '中国航发动力控制', '中航动控', '000738']"),
              ("STOCK_CODE = '600499'", "STOCK_CODE = '000738'"),
              ('科达制造_600499_2020-2025年报及最新季报_截至20261016', '航发控制_000738_2020-2025年报及最新季报_截至20261016'),
              ('科达制造_', '航发控制_'),
              ('科达制造股份有限公司（600499.SH）', '中国航发动力控制股份有限公司（000738.SZ）'),
              ("'official_sse_disclosure_index':f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK_CODE}',",
               "'official_cninfo_index':f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK_CODE}',"),
              ('keda_600499_reports_20261016.zip', 'aero_engine_control_000738_reports_20261016.zip'),
          ]
          for old, new in replacements:
              if old not in script:
                  raise RuntimeError(f'missing replacement anchor: {old}')
              script = script.replace(old, new)

          Path('run_aero_engine_control_package.py').write_text(script, encoding='utf-8')
          subprocess.run([sys.executable, 'run_aero_engine_control_package.py'], check=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: aero-engine-control-000738-reports-final-20261016
          path: |
            航发控制_000738_2020-2025年报及最新季报_截至20261016.zip
            aero_engine_control_000738_reports_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
