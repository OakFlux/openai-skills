name: Package final ST Xiwang 000639 broker reports 20261020

on:
  push:
    branches:
      - tmp/st-xiwang-000639-broker-package-20261020-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, html, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          CODE='000639'; CURRENT='ST西王'; REPORT='西王食品'; FULL='西王食品股份有限公司'
          ROOT=Path('ST西王_000639_券商研究报告_2份'); ROOT.mkdir(exist_ok=True)
          PREVIEW=ROOT/'首页预览'; PREVIEW.mkdir(exist_ok=True)
          OUT=Path('st_xiwang_000639_broker_reports_2.zip')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          def validate(path,min_pages,tokens):
              if path.read_bytes()[:5]!=b'%PDF-': raise RuntimeError('invalid PDF '+path.name)
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              if pages<min_pages: raise RuntimeError(f'too few pages {path.name}: {pages}')
              text=''
              for page in reader.pages[:min(40,pages)]:
                  try: text+='\n'+(page.extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','',text)
              missing=[x for x in tokens if re.sub(r'\s+','',x) not in compact]
              if missing: raise RuntimeError(f'missing text {path.name}: {missing}')
              subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREVIEW/path.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','130','-singlefile',str(path),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              png=Path(str(prefix)+'.png')
              if not png.exists() or png.stat().st_size<5000: raise RuntimeError('preview failed '+path.name)
              return pages,png

          def get_original(info):
              last={}
              for host in ['H3','H2','H1','H4']:
                  url=f'https://pdf.dfcfw.com/pdf/{host}_{info}_1.pdf'
                  for attempt in range(4):
                      try:
                          r=s.get(url,headers={'User-Agent':s.headers['User-Agent'],'Referer':f'https://data.eastmoney.com/report/info/{info}.html','Accept':'application/pdf,*/*;q=0.8'},timeout=(20,180),allow_redirects=True)
                          last={'url':url,'status':r.status_code,'bytes':len(r.content)}
                          if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000: return r.content,url,last
                      except Exception as e: last={'url':url,'error':repr(e)}
                      time.sleep(1+attempt)
              raise RuntimeError('original PDF download failed '+json.dumps(last,ensure_ascii=False))

          rows=[]
          info='AP201902181297566184'
          data,pdf_url,dlmeta=get_original(info)
          p1=ROOT/'01_20190217_新时代证券_首次覆盖_运动保健新龙头大健康航母扬帆起航_原始PDF.pdf'
          p1.write_bytes(data)
          pages1,png1=validate(p1,18,[REPORT,CODE,'运动保健'])
          rows.append({'filename':p1.name,'document_form':'券商原始PDF','broker':'新时代证券','authors':'孙金钜、任浪','date':'2019-02-17','title':'中小盘首次覆盖报告：运动保健新龙头，大健康航母扬帆起航','actual_pages':pages1,'bytes':p1.stat().st_size,'sha256':sha(p1),'source_page':f'https://data.eastmoney.com/report/info/{info}.html','pdf_url':pdf_url,'download_meta':dlmeta,'preview_file':str(Path('首页预览')/png1.name),'note':'公开证券研报聚合渠道提供的券商原始PDF。'})

          urls=['https://www.9fzt.com/detail/sz_000639_10_611762809718.html','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/611762809718/index.phtml']
          chosen=None; failures=[]
          for url in urls:
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  if r.status_code!=200 or len(r.content)<10000:
                      failures.append({'url':url,'status':r.status_code,'bytes':len(r.content)}); continue
                  r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                  soup=BeautifulSoup(r.text,'lxml')
                  title_node=soup.select_one('.title-header') or soup.select_one('h1')
                  body=soup.select_one('.detail-article-content') or soup.select_one('.blk_container')
                  broker_node=soup.select_one('.date-type'); date_node=soup.select_one('.date-time')
                  if title_node is None or body is None:
                      failures.append({'url':url,'reason':'missing body'}); continue
                  for tag in body.find_all(['script','style','iframe','form','button','noscript']): tag.decompose()
                  for tag in body.find_all(True):
                      for attr in ['style','class','id','onclick','width','height']: tag.attrs.pop(attr,None)
                  title=re.sub(r'\s+',' ',title_node.get_text(' ',strip=True))
                  broker=re.sub(r'\s+',' ',broker_node.get_text(' ',strip=True)) if broker_node else '中信建投证券'
                  date=re.sub(r'\s+',' ',date_node.get_text(' ',strip=True)) if date_node else '2019-05-21'
                  body_text=re.sub(r'\s+',' ',body.get_text(' ',strip=True))
                  if REPORT in title+' '+body_text and len(body_text)>=600:
                      chosen=(r,title,broker,date,body); break
                  failures.append({'url':url,'chars':len(body_text)})
              except Exception as e:
                  failures.append({'url':url,'error':repr(e)})
          if chosen is None: raise RuntimeError('no usable report page '+json.dumps(failures,ensure_ascii=False))
          r,title,broker,date,body=chosen
          doc=f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>{html.escape(title)}</title><style>
          @page {{ size:A4; margin:17mm 17mm 19mm 17mm; @bottom-center {{ content:"公开网页正文整理版 - 第 " counter(page) " 页 / " counter(pages) " 页"; font-size:8.5pt; color:#666; }} }}
          body {{ font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif; font-size:10.4pt; line-height:1.72; color:#222; word-break:break-word; }} h1 {{ font-size:19pt; line-height:1.38; margin:0 0 12pt; }}
          .meta {{ font-size:10pt; color:#444; border-bottom:1px solid #aaa; padding-bottom:9pt; margin-bottom:13pt; line-height:1.65; }}
          .notice {{ border:1.5px solid #8c3131; background:#fff8f4; padding:10pt 12pt; margin:8pt 0 16pt; font-size:9.7pt; line-height:1.6; }} .notice strong {{ color:#781f1f; }}
          .source {{ font-size:8.3pt; color:#666; margin-top:7pt; word-break:break-all; }} p {{ margin:0 0 9pt; text-align:justify; }} a {{ color:#222; text-decoration:none; }}
          </style></head><body><h1>{html.escape(title)}</h1><div class="meta">券商：{html.escape(broker)}<br>研究员：花小伟、孙金琦<br>发布日期：{html.escape(date)}</div>
          <div class="notice"><strong>文件性质说明：</strong>本文件依据公开网页展示的券商研报正文整理并打印为PDF，<strong>不是券商发布的原始PDF</strong>。原报告封面、图表、原始页码、研究员签名及部分附录可能未被网页保留。<div class="source">公开正文来源：{html.escape(r.url)}</div></div>{str(body)}</body></html>'''
          p2=ROOT/'02_20190521_中信建投证券_食用油运动保健双业并进大健康龙头起航_公开网页正文整理版_非原始PDF.pdf'
          HTML(string=doc,base_url=r.url).write_pdf(str(p2))
          pages2,png2=validate(p2,1,[REPORT,'2019','中信'])
          rows.append({'filename':p2.name,'document_form':'公开网页正文整理版（非券商原始PDF）','broker':broker,'authors':'花小伟、孙金琦','date':date,'title':title,'actual_pages':pages2,'bytes':p2.stat().st_size,'sha256':sha(p2),'source_page':r.url,'preview_file':str(Path('首页预览')/png2.name),'note':'公开网页正文离线排版版；不是券商原始PDF，可能不含原报告图表、封面和原始版式。'})

          lines=[f'ST西王 / 西王食品（{CODE}.SZ）券商研究报告资料包','整理日期：2026-10-20','',
                 '本包收录2份公司深度/首次覆盖研究资料：1份券商原始PDF，1份公开网页正文离线整理版。',
                 '公司近年券商覆盖较少，所选报告集中于2019年，主要用于梳理当时的食用油与运动营养双主业逻辑，不代表当前投资判断。',
                 '网页整理版已在文件名、PDF首页和清单中明确标注“非券商原始PDF”。','']
          for i,x in enumerate(rows,1):
              lines += [f'{i}. {x["filename"]}',f'   文件性质：{x["document_form"]}',f'   券商：{x["broker"]}；研究员：{x["authors"]}；发布日期：{x["date"]}',f'   标题：{x["title"]}',f'   实际页数：{x["actual_pages"]}页；文件大小：{x["bytes"]}字节',f'   来源页面：{x["source_page"]}',f'   SHA-256：{x["sha256"]}',f'   说明：{x["note"]}','']
          lines += ['核验项目：PDF文件头、公司名称/证券代码、PDF结构、实际页数、首页渲染、逐文件SHA-256及ZIP CRC。','报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。']
          (ROOT/'README_报告清单与文件性质说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps({'company_current_short_name':CURRENT,'company_report_name':REPORT,'full_company_name':FULL,'stock_code':CODE,'prepared_on':'2026-10-20','report_count':len(rows),'files':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          with (ROOT/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['文件名','文件性质','券商','研究员','发布日期','标题','页数','字节数','SHA-256','来源页面','说明'])
              for x in rows: w.writerow([x['filename'],x['document_form'],x['broker'],x['authors'],x['date'],x['title'],x['actual_pages'],x['bytes'],x['sha256'],x['source_page'],x['note']])
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in rows)+'\n',encoding='utf-8')

          with zipfile.ZipFile(OUT,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file(): z.write(path,arcname=str(path))
          with zipfile.ZipFile(OUT,'r') as z:
              bad=z.testzip()
              if bad is not None: raise RuntimeError('ZIP CRC failed '+bad)
          print(json.dumps({'package':str(OUT),'zip_bytes':OUT.stat().st_size,'zip_sha256':sha(OUT),'report_count':len(rows),'files':[{'name':x['filename'],'form':x['document_form'],'broker':x['broker'],'date':x['date'],'title':x['title'],'pages':x['actual_pages'],'bytes':x['bytes'],'sha256':x['sha256']} for x in rows]},ensure_ascii=False,indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: st-xiwang-000639-broker-reports-final-20261020
          path: st_xiwang_000639_broker_reports_2.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
