name: Probe iYanbao public Greentown report sources

on:
  push:
    branches:
      - chatgpt-temp-greentown-iyanbao-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect public pages, scripts and report APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import html
          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('probe')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          pages = [
              'https://www.iyanbao.com/',
              'https://www.iyanbao.com/detail/773250',
              'https://www.iyanbao.com/detail/867977',
              'https://www.iyanbao.com/search?keyword=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
              'https://www.iyanbao.com/search/%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
              'https://www.iyanbao.com/?keyword=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
              'https://www.iyanbao.com/company?keyword=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
          ]
          page_records = []
          scripts = []
          key_terms = ['pdf', 'file.iyanbao', 'download', 'report', 'search', 'detail', 'api', '773250', '867977', '绿城中国']
          for idx, url in enumerate(pages):
              try:
                  r = session.get(url, timeout=45, allow_redirects=True)
                  text = r.text
                  (OUT / f'page_{idx}.html').write_text(text, encoding='utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'html.parser')
                  script_urls = [urllib.parse.urljoin(r.url, s.get('src')) for s in soup.select('script[src]') if s.get('src')]
                  scripts.extend(script_urls)
                  links = []
                  for tag in soup.select('a[href],iframe[src],embed[src],object[data],img[src]'):
                      target = tag.get('href') or tag.get('src') or tag.get('data')
                      if target:
                          target = urllib.parse.urljoin(r.url, target)
                          label = ' '.join(tag.get_text(' ', strip=True).split())
                          if any(k.lower() in (target + ' ' + label).lower() for k in key_terms):
                              links.append({'tag': tag.name, 'text': label, 'url': target})
                  inline = []
                  for sc in soup.select('script:not([src])'):
                      t = sc.get_text(' ', strip=False)
                      if any(k.lower() in t.lower() for k in key_terms):
                          inline.append(t[:200000])
                  raw_urls = sorted(set(re.findall(r'https?://[^\s"\'<>\\]+', html.unescape(text))))
                  rec = {
                      'source': url, 'status': r.status_code, 'final': r.url,
                      'ctype': r.headers.get('content-type'), 'length': len(r.content),
                      'title': soup.title.get_text(' ', strip=True) if soup.title else '',
                      'scripts': script_urls, 'links': links[:500], 'inline': inline[:100],
                      'raw_urls': [u.rstrip('),.;') for u in raw_urls if any(k.lower() in u.lower() for k in key_terms)][:1000],
                  }
                  page_records.append(rec)
                  print('\nPAGE', json.dumps(rec, ensure_ascii=False, indent=2)[:120000])
              except Exception as exc:
                  page_records.append({'source': url, 'error': repr(exc)})
                  print('PAGE_ERROR', url, repr(exc))
          (OUT / 'pages.json').write_text(json.dumps(page_records, ensure_ascii=False, indent=2), encoding='utf-8')

          js_records = []
          for idx, url in enumerate(list(dict.fromkeys(scripts))):
              try:
                  r = session.get(url, timeout=45)
                  if r.status_code != 200 or len(r.content) > 15_000_000:
                      continue
                  text = r.text
                  (OUT / f'js_{idx}.js').write_text(text, encoding='utf-8', errors='replace')
                  snippets = []
                  low = text.lower()
                  for key in ['file.iyanbao.com', '.pdf', 'download', '/api/', 'axios', 'reportdetail', 'report/detail', 'searchreport', 'report/search', 'fullreport', 'pdfurl', 'fileurl', 'detail/']:
                      pos = 0
                      while True:
                          pos = low.find(key.lower(), pos)
                          if pos < 0:
                              break
                          snippets.append(text[max(0,pos-1800):min(len(text),pos+6000)])
                          pos += len(key)
                          if len(snippets) >= 150:
                              break
                      if len(snippets) >= 150:
                          break
                  if snippets:
                      rec = {'url': url, 'status': r.status_code, 'length': len(r.content), 'snippets': snippets}
                      js_records.append(rec)
                      print('\nJS', url, len(r.content), '\n', '\n---\n'.join(snippets[:25])[:120000])
              except Exception as exc:
                  print('JS_ERROR', url, repr(exc))
          (OUT / 'js_records.json').write_text(json.dumps(js_records, ensure_ascii=False, indent=2), encoding='utf-8')

          # Probe plausible public JSON endpoints conservatively.
          endpoint_templates = [
              'https://www.iyanbao.com/api/detail/{id}',
              'https://www.iyanbao.com/api/report/{id}',
              'https://www.iyanbao.com/api/report/detail/{id}',
              'https://www.iyanbao.com/api/reports/{id}',
              'https://api.iyanbao.com/detail/{id}',
              'https://api.iyanbao.com/report/{id}',
              'https://api.iyanbao.com/report/detail/{id}',
              'https://www.iyanbao.com/detail/{id}.json',
          ]
          probes = []
          for report_id in ['773250', '867977']:
              for template in endpoint_templates:
                  url = template.format(id=report_id)
                  try:
                      r = session.get(url, timeout=25, headers={'Accept':'application/json,text/plain,*/*'})
                      rec = {'url': url, 'status': r.status_code, 'ctype': r.headers.get('content-type'), 'length': len(r.content), 'text': r.text[:10000]}
                      probes.append(rec)
                      print('PROBE', json.dumps(rec, ensure_ascii=False)[:15000])
                  except Exception as exc:
                      probes.append({'url':url, 'error':repr(exc)})
          (OUT / 'probes.json').write_text(json.dumps(probes, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: iyanbao-greentown-probe
          path: probe/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
