name: Probe China Baoan report API compact dates
on:
  push:
    paths:
      - '.github/workflows/china-baoan-000009-reportapi-compact-date-probe-20261016.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python - <<'PY'
          import requests
          p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'20170101','endTime':'20300101','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'000009','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          r=requests.get('https://reportapi.eastmoney.com/report/list',params=p,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'},timeout=60)
          print(r.status_code,r.url)
          print(r.text[:30000])
          PY
