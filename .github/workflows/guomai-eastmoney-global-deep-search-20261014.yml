name: Global search Eastmoney Guomai deep reports 20261014

on:
  push:
    paths:
      - '.triggers/guomai-eastmoney-global-deep-search-20261014.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Search narrow report-date windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json,*/*','Referer':'https://data.eastmoney.com/report/','Content-Type':'application/json'})
          windows=[
            ('2025-02-09','2025-02-15'),
            ('2025-09-10','2025-09-17'),
            ('2023-11-25','2023-12-02'),
            ('2023-03-27','2023-04-06'),
            ('2022-03-25','2022-04-05'),
          ]
          needles=['果麦文化','301052','AI校对王','三国的星空','互联网出版企业','出版+互联网','价值和美','优质图书供给基础']
          found=[]
          for begin,end in windows:
            for endpoint in ('https://reportapi.eastmoney.com/report/list','https://reportapi.eastmoney.com/report/list2'):
              for code in ('*',''):
                for page in range(1,101):
                  payload={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'code':code,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','rcode':'','qType':'0','fields':''}
                  try:
                    if endpoint.endswith('list2'):
                      r=s.post(endpoint,json=payload,timeout=(15,90))
                    else:
                      r=s.get(endpoint,params=payload,timeout=(15,90),headers={'Referer':'https://data.eastmoney.com/report/'})
                    print('QUERY',begin,end,endpoint.rsplit('/',1)[-1],repr(code),page,r.status_code,len(r.content),flush=True)
                    if r.status_code!=200: break
                    j=r.json(); rows=j.get('data') or []
                    total=j.get('total') or j.get('hits') or j.get('count')
                    print('COUNT',len(rows),'TOTAL',total,flush=True)
                    for row in rows:
                      blob=json.dumps(row,ensure_ascii=False)
                      if any(n in blob for n in needles):
                        print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
                        found.append(row)
                    if len(rows)<100: break
                    time.sleep(.03)
                  except Exception as e:
                    print('ERR',begin,end,endpoint,repr(code),page,repr(e),flush=True); break
          print('FOUND_TOTAL',len(found),flush=True)
          print('FOUND_JSON',json.dumps(found,ensure_ascii=False),flush=True)
          PY
