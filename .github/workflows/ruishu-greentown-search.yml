name: Search Ruishu Greentown reports

on:
  push:
    branches:
      - chatgpt-temp-ruishu-search-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public search and metadata endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          import requests

          OUT=Path('out'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.ruishubaogao.com/'})
          base='https://www.ruishubaogao.com'
          terms=['绿城中国','03900','3900.HK','融合央企基因','品质标杆房企','自投代建双核驱动','匠心独运 驭光而行']
          params_names=['q','keyword','query','search','keywords','key','term','wd','title']
          records=[]; hits=[]
          for endpoint in ['/api/search','/api/report/list']:
            for pname in params_names:
              for term in terms:
                q={pname:term,'page':1,'page_size':100,'pageSize':100,'limit':100}
                try:
                  r=s.get(base+endpoint,params=q,timeout=25)
                  try:data=r.json()
                  except Exception:data={'raw':r.text[:1000]}
                  text=json.dumps(data,ensure_ascii=False)
                  match='绿城中国' in text or '03900' in text or '3900.HK' in text
                  rec={'endpoint':endpoint,'param':pname,'term':term,'status':r.status_code,'url':r.url,'length':len(r.content),'match':match,'data':data if match else None}
                  records.append(rec)
                  if match:
                    hits.append(rec)
                    print('\nHIT',json.dumps(rec,ensure_ascii=False,indent=2)[:100000])
                except Exception as exc:
                  records.append({'endpoint':endpoint,'param':pname,'term':term,'error':repr(exc)})
          (OUT/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')

          # Collect unique report ids from matching responses.
          ids=set()
          def walk(v):
            if isinstance(v,dict):
              title=str(v.get('title') or '')
              if ('绿城中国' in title or '03900' in title or '3900.HK' in title) and v.get('id') is not None:
                ids.add(str(v['id']))
              for x in v.values(): walk(x)
            elif isinstance(v,list):
              for x in v: walk(x)
          for h in hits: walk(h.get('data'))
          print('IDS',sorted(ids))

          meta=[]
          for rid in sorted(ids):
            for endpoint, method, params in [
              ('/api/report/detail','GET',{'id':rid}),
              ('/api/report/downloads','GET',{'id':rid}),
              ('/api/report/download','GET',{'id':rid}),
            ]:
              try:
                r=s.get(base+endpoint,params=params,timeout=30,allow_redirects=True)
                ctype=r.headers.get('content-type','')
                body=r.content
                try:data=r.json()
                except Exception:data={'signature':repr(body[:100]),'text':body[:3000].decode('utf-8',errors='replace')}
                rec={'id':rid,'endpoint':endpoint,'status':r.status_code,'final':r.url,'ctype':ctype,'length':len(body),'headers':dict(r.headers),'data':data}
                meta.append(rec)
                print('\nMETA',json.dumps(rec,ensure_ascii=False,indent=2)[:100000])
              except Exception as exc:
                meta.append({'id':rid,'endpoint':endpoint,'error':repr(exc)})
          (OUT/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ruishu-greentown-search
          path: out/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
