name: Diagnose anonymous FXBaogao viewers for Zenergy reports 20260922

on:
  push:
    paths:
      - '.github/workflows/zenergy-fxbaogao-view-diagnostic-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Inspect anonymous report viewers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          IDS=['5265282','5326583','5355063','5058370']
          OUT=Path('out')

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  ctx=await browser.new_context(
                      viewport={'width':1440,'height':1200},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                      locale='zh-CN'
                  )
                  for rid in IDS:
                      page=await ctx.new_page()
                      net=[]; console=[]
                      page.on('response', lambda r, net=net: net.append({'status':r.status,'url':r.url,'type':r.request.resource_type,'content_type':r.headers.get('content-type','')}))
                      page.on('console', lambda m, console=console: console.append({'type':m.type,'text':m.text}))
                      rec={'id':rid,'input_url':f'https://www.fxbaogao.com/view?id={rid}'}
                      try:
                          resp=await page.goto(rec['input_url'], wait_until='domcontentloaded', timeout=90000)
                          rec['status']=resp.status if resp else None
                          await page.wait_for_timeout(12000)
                          rec['final_url']=page.url
                          rec['title']=await page.title()
                          rec['body_text']=(await page.locator('body').inner_text())[:100000]
                          rec['html']=(await page.content())[:500000]
                          rec['frames']=[{'url':f.url,'name':f.name} for f in page.frames]
                          rec['images']=await page.locator('img').evaluate_all("els => els.map(e => ({src:e.currentSrc||e.src, alt:e.alt, w:e.naturalWidth, h:e.naturalHeight})).filter(x=>x.src)")
                          rec['embeds']=await page.locator('iframe,embed,object').evaluate_all("els => els.map(e => ({tag:e.tagName, src:e.src||e.data||'', type:e.type||''}))")
                          rec['links']=await page.locator('a').evaluate_all("els => els.map(e => ({href:e.href,text:(e.innerText||'').trim()})).filter(x=>x.href)")
                          rec['cookies']=await ctx.cookies()
                          await page.screenshot(path=str(OUT/f'{rid}.png'),full_page=True)
                          (OUT/f'{rid}.html').write_text(await page.content(),encoding='utf-8')
                      except Exception as e:
                          rec['error']=repr(e)
                          try: await page.screenshot(path=str(OUT/f'{rid}_error.png'),full_page=True)
                          except: pass
                      rec['network']=net
                      rec['console']=console
                      (OUT/f'{rid}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
          grep -RInE 'pdf|report-image|viewer|download|登录|免费|完整报告|pageCount|totalPage|oss' out > out/grep_hits.txt || true
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > out/file_sizes.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: zenergy-fxbaogao-view-diagnostic
          path: out
          retention-days: 7
          if-no-files-found: error
