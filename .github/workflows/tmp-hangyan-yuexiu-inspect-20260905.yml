name: Temporary inspect Hangyan public PDF controller

on:
  push:
    branches:
      - tmp-hangyan-yuexiu-inspect-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect public report page and controller assets
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          url='https://www.hangyan.co/reports/3601231225693407004'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(url,timeout=45)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          raw=html.unescape(r.text).replace('\\/','/')
          soup=BeautifulSoup(raw,'html.parser')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
          for el in soup.select('[data-controller*="native-pdf"]'):
              print('NATIVE_ELEMENT',str(el)[:8000])
          for script in soup.find_all('script'):
              src=script.get('src')
              text=script.get_text(' ',strip=True)
              if src:
                  print('SCRIPT',urljoin(r.url,src))
              if any(k in text.lower() for k in ['native-pdf','pdf','cache-key','active_storage']):
                  print('INLINE_SCRIPT',text[:10000])
          for link in soup.find_all('link',href=True):
              href=urljoin(r.url,link['href'])
              if any(k in href.lower() for k in ['js','asset','pdf','controller']): print('LINK',href)
          urls=set(re.findall(r'https?://[^\"\'<>\\\s]+',raw))
          for u in sorted(urls):
              if any(k in u.lower() for k in ['pdf','blob','download','storage','cdn.hangyan','active']): print('RAWURL',u)

          assets=[]
          for script in soup.find_all('script',src=True): assets.append(urljoin(r.url,script['src']))
          # importmap references often contain controller module paths.
          for m in re.findall(r'"([^" ]*(?:native[-_]pdf|application)[^" ]*\.js)"',raw,re.I): assets.append(urljoin(r.url,m))
          seen=set()
          for a in assets:
              if a in seen: continue
              seen.add(a)
              try:
                  rr=s.get(a,timeout=45)
                  txt=rr.text
                  print('ASSET_FETCH',rr.status_code,len(rr.content),a)
                  if any(k in txt.lower() for k in ['native-pdf','cache-key','download','active_storage','pdf']):
                      print('ASSET_MATCH_BEGIN',a)
                      for key in ['native-pdf','cache-key','download','active_storage','pdf','fetch(','axios','blob']:
                          for mm in list(re.finditer(re.escape(key),txt,re.I))[:8]:
                              print('SNIP',key,txt[max(0,mm.start()-500):mm.start()+1800].replace('\n',' ')[:2300])
                      print('ASSET_MATCH_END')
              except Exception as e: print('ASSET_ERR',a,repr(e))
          PY
