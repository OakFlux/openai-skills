name: Temporary inspect Hangyan public PDF controller

on:
  push:
    branches:
      - tmp-hangyan-yuexiu-inspect-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public report page with requests and Chrome
        run: |
          python -m pip install --quiet requests beautifulsoup4 selenium
          mkdir -p output/downloads
          python - <<'PY'
          import html, json, os, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          url='https://www.hangyan.co/reports/3601231225693407004'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':url})
          r=s.get(url,timeout=30)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          raw=html.unescape(r.text).replace('\\/','/')
          Path('output/page.html').write_text(raw,encoding='utf-8')
          soup=BeautifulSoup(raw,'html.parser')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
          for el in soup.select('[data-controller*="native-pdf"]'):
              print('NATIVE_ELEMENT',str(el)[:8000])
          app='https://cdn.hangyan.co/assets/application-ec845e69.js'
          for a in [app,app.replace('cdn.hangyan.co','www.hangyan.co')]:
              try:
                  rr=s.get(a,timeout=30,headers={'Referer':url,'Origin':'https://www.hangyan.co','User-Agent':s.headers['User-Agent'],'Accept':'*/*','Sec-Fetch-Site':'same-site','Sec-Fetch-Mode':'cors','Sec-Fetch-Dest':'script'})
                  print('APP_FETCH',rr.status_code,len(rr.content),a,rr.headers.get('content-type'))
                  Path('output/'+('app_cdn.js' if 'cdn.' in a else 'app_www.js')).write_bytes(rr.content)
                  txt=rr.text
                  for key in ['native-pdf','cacheKey','cache-key','download','fetch(','iframe','pdf']:
                      for m in list(re.finditer(re.escape(key),txt,re.I))[:12]:
                          print('APP_SNIP',key,txt[max(0,m.start()-800):m.start()+2500].replace('\n',' ')[:3300])
              except Exception as e: print('APP_ERR',a,repr(e))
          PY
          google-chrome --version || chromium --version || chromium-browser --version || true
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          page='https://www.hangyan.co/reports/3601231225693407004'
          download_dir=str(Path('output/downloads').resolve())
          opts=webdriver.ChromeOptions()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1600,1200')
          opts.add_experimental_option('prefs',{'download.default_directory':download_dir,'download.prompt_for_download':False,'download.directory_upgrade':True,'plugins.always_open_pdf_externally':True,'safebrowsing.enabled':True})
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          driver=webdriver.Chrome(options=opts)
          try:
              driver.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':download_dir})
              driver.get(page)
              WebDriverWait(driver,30).until(EC.presence_of_element_located((By.CSS_SELECTOR,'[data-controller~="native-pdf"]')))
              time.sleep(8)
              print('CURRENT',driver.current_url,'TITLE',driver.title)
              print('IFRAMES',driver.execute_script("return Array.from(document.querySelectorAll('iframe')).map(x=>x.src)"))
              print('NATIVE',driver.execute_script("let x=document.querySelector('[data-controller~=native-pdf]'); return x?{cache:x.dataset.nativePdfCacheKeyValue,filename:x.dataset.nativePdfFilenameValue,page:x.dataset.nativePdfPageNumValue}:null"))
              try:
                  btn=driver.find_element(By.CSS_SELECTOR,'[data-action*="native-pdf#download"]')
                  driver.execute_script('arguments[0].click()',btn)
                  print('CLICKED_DOWNLOAD')
              except Exception as e: print('CLICK_ERR',repr(e))
              for _ in range(20):
                  time.sleep(1)
                  files=list(Path(download_dir).glob('*'))
                  if files and not any(f.name.endswith('.crdownload') for f in files): break
              print('DOWNLOAD_FILES',[(f.name,f.stat().st_size) for f in Path(download_dir).glob('*')])
              logs=driver.get_log('performance')
              seen=set()
              for entry in logs:
                  try:
                      msg=json.loads(entry['message'])['message']
                      if msg['method'] in ['Network.requestWillBeSent','Network.responseReceived']:
                          obj=msg['params'].get('request') or msg['params'].get('response') or {}
                          u=obj.get('url','')
                          if u and u not in seen and any(k in u.lower() for k in ['pdf','download','blob','cache','storage','report']):
                              seen.add(u); print('NET',msg['method'],obj.get('status'),obj.get('mimeType'),u)
                  except Exception: pass
              print('BROWSER_LOGS',driver.get_log('browser'))
              Path('output/final_source.html').write_text(driver.page_source,encoding='utf-8')
          finally:
              driver.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-yuexiu-inspection
          path: output
          retention-days: 1
