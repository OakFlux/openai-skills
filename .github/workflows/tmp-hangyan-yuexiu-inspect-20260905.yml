name: Temporary inspect Hangyan public PDF controller

on:
  push:
    branches:
      - tmp-hangyan-yuexiu-inspect-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public report page and browser network
        shell: bash
        run: |
          set +e
          python -m pip install --quiet requests beautifulsoup4 selenium
          mkdir -p output/downloads
          python - <<'PY' > output/requests_log.txt 2>&1
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          page='https://www.hangyan.co/reports/3601231225693407004'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          r=s.get(page,timeout=40)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          raw=html.unescape(r.text).replace('\\/','/')
          Path('output/page.html').write_text(raw,encoding='utf-8')
          soup=BeautifulSoup(raw,'html.parser')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
          for el in soup.select('[data-controller*="native-pdf"]'):
              print('NATIVE_ELEMENT',str(el)[:12000])
          assets=[]
          for tag in soup.find_all(['script','link']):
              u=tag.get('src') or tag.get('href')
              if u:
                  full=urljoin(r.url,u)
                  if full.endswith('.js') or 'controller' in full or 'application' in full:
                      assets.append(full)
          for idx,u in enumerate(dict.fromkeys(assets)):
              try:
                  rr=s.get(u,timeout=35,headers={'Referer':page,'Origin':'https://www.hangyan.co','Accept':'*/*','Sec-Fetch-Site':'same-site','Sec-Fetch-Mode':'cors','Sec-Fetch-Dest':'script','User-Agent':s.headers['User-Agent']})
                  print('ASSET',idx,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'))
                  fn=Path('output')/f'asset_{idx:02d}.bin'; fn.write_bytes(rr.content)
                  txt=rr.text
                  if any(k in txt.lower() for k in ['native-pdf','cachekey','cache-key','download','application/pdf']):
                      (Path('output')/f'asset_{idx:02d}.js').write_text(txt,encoding='utf-8')
                      for key in ['native-pdf','cacheKey','cache-key','download','fetch(','pdf']:
                          for m in list(re.finditer(re.escape(key),txt,re.I))[:20]:
                              print('SNIP',key,txt[max(0,m.start()-700):m.start()+2200].replace('\n',' ')[:2900])
              except Exception as e:
                  print('ASSET_ERR',idx,u,repr(e))
          PY

          curl -L --compressed -c output/cookies.txt -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' 'https://www.hangyan.co/reports/3601231225693407004' -o output/curl_page.html -D output/curl_page_headers.txt
          ASSET='https://cdn.hangyan.co/assets/controllers/native_pdf_controller-99785a4f.js'
          curl -L --compressed -b output/cookies.txt -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' -H 'Referer: https://www.hangyan.co/reports/3601231225693407004' -H 'Origin: https://www.hangyan.co' -H 'Sec-Fetch-Site: same-site' -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Dest: script' "$ASSET" -o output/controller.js -D output/controller_headers.txt
          wc -c output/controller.js output/curl_page.html >> output/curl_sizes.txt

          (google-chrome --version || chromium --version || chromium-browser --version) > output/chrome_version.txt 2>&1
          python - <<'PY' > output/chrome_log.txt 2>&1
          import json, time, traceback
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          page='https://www.hangyan.co/reports/3601231225693407004'
          download_dir=str(Path('output/downloads').resolve())
          opts=webdriver.ChromeOptions()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1600,1200','--ignore-certificate-errors']:
              opts.add_argument(arg)
          opts.add_experimental_option('prefs',{'download.default_directory':download_dir,'download.prompt_for_download':False,'download.directory_upgrade':True,'plugins.always_open_pdf_externally':True,'safebrowsing.enabled':True})
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          driver=None
          try:
              driver=webdriver.Chrome(options=opts)
              driver.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':download_dir})
              driver.get(page)
              WebDriverWait(driver,35).until(EC.presence_of_element_located((By.CSS_SELECTOR,'[data-controller~="native-pdf"]')))
              time.sleep(10)
              print('CURRENT',driver.current_url,'TITLE',driver.title)
              print('NATIVE',driver.execute_script("let x=document.querySelector('[data-controller~=native-pdf]'); return x?Object.assign({},x.dataset):null"))
              print('SCRIPTS',driver.execute_script("return Array.from(document.scripts).map(x=>x.src).filter(Boolean)"))
              try:
                  btn=driver.find_element(By.CSS_SELECTOR,'[data-action*="native-pdf#download"]')
                  driver.execute_script('arguments[0].click()',btn)
                  print('CLICKED')
              except Exception as e:
                  print('CLICK_ERR',repr(e))
              for _ in range(25):
                  time.sleep(1)
                  fs=list(Path(download_dir).glob('*'))
                  if fs and not any(f.name.endswith('.crdownload') for f in fs): break
              print('FILES',[(f.name,f.stat().st_size) for f in Path(download_dir).glob('*')])
              logs=driver.get_log('performance')
              rows=[]
              for entry in logs:
                  try:
                      msg=json.loads(entry['message'])['message']
                      if msg['method'] not in ['Network.requestWillBeSent','Network.responseReceived']: continue
                      obj=msg['params'].get('request') or msg['params'].get('response') or {}
                      u=obj.get('url','')
                      if u and any(k in u.lower() for k in ['pdf','download','blob','cache','storage','report','native_pdf']):
                          row={'method':msg['method'],'status':obj.get('status'),'mime':obj.get('mimeType'),'url':u}
                          if row not in rows: rows.append(row); print('NET',row)
                  except Exception:
                      pass
              Path('output/network.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('output/final_source.html').write_text(driver.page_source,encoding='utf-8')
              print('BROWSER',driver.get_log('browser'))
          except Exception:
              traceback.print_exc()
          finally:
              if driver:
                  try: driver.quit()
                  except Exception: pass
          PY
          exit 0

      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-yuexiu-inspection-v3
          path: output
          retention-days: 1
