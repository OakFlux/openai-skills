name: Probe target Pacific Basin report pages and download endpoints 20260908

on:
  push:
    paths:
      - '.github/workflows/pacific-basin-nxny-target-probe-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Probe report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re,html,json
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup
          out=Path('probe'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          ids=['6208818','6207762']
          for rid in ids:
            url=f'https://www.nxny.com/report/view_{rid}.html'
            r=s.get(url,timeout=60)
            print('\nREPORT',rid,r.status_code,len(r.content),r.url,r.encoding,r.apparent_encoding)
            p=out/f'{rid}.html'; p.write_bytes(r.content)
            text=r.content.decode('gb18030',errors='replace') if b'charset=gb' in r.content.lower() or r.apparent_encoding.lower().startswith('gb') else r.text
            (out/f'{rid}.utf8.html').write_text(text,encoding='utf-8')
            for pat in ['downfile','DownLoad','rnd','onclick','download','pdf','vip.nxny','6208818','6207762','reportid','fileid','hid','guid']:
              pos=0; n=0
              while True:
                i=text.lower().find(pat.lower(),pos)
                if i<0 or n>=30: break
                print('CTX',rid,pat,i,repr(text[max(0,i-500):min(len(text),i+1200)]))
                pos=i+len(pat); n+=1
            # extract downfile args and candidate urls
            print('DOWNCALLS',rid,re.findall(r'downfile\s*\(([^)]{1,500})\)',text,re.I))
            urls=[]
            soup=BeautifulSoup(text,'html.parser')
            for tag in soup.find_all(True):
              for attr in ['href','src','onclick','action','value']:
                v=tag.get(attr)
                if v and any(k in str(v).lower() for k in ['download','downfile','pdf','rnd','report','file']): urls.append((tag.name,attr,str(v)))
            print('ATTRS',rid,json.dumps(urls,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pacific-basin-nxny-target-probe
          path: probe/
          retention-days: 7
          if-no-files-found: error
