name: Knight Dairy Broker Research Package

on:
  push:
    branches:
      - chatgpt-knight-dairy-broker-reports-20261004
    paths:
      - .github/workflows/knight_dairy_broker_package_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports output/renders
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          OUT=Path('output')
          REPORTS=OUT/'reports'
          RENDERS=OUT/'renders'

          reports=[
            {
              'filename':'01_开源证券_骑士乳业_北交所首次覆盖_牧乳农糖循环经济模式_2023-12-12.pdf',
              'info_code':'AP202312121613742923',
              'title':'北交所首次覆盖报告：牧、乳、农、糖循环经济模式，长期供应蒙牛生鲜乳',
              'broker':'开源证券','date':'2023-12-12','analyst':'诸海滨','rating':'增持','expected_pages':33,
              'type':'首次覆盖深度报告',
            },
            {
              'filename':'02_开源证券_骑士乳业_北交所新股申购_内蒙农牧业龙头_2023-09-27.pdf',
              'info_code':'AP202309271600013799',
              'title':'北交所新股申购报告：骑士乳业：内蒙农牧业龙头，营收10年稳增',
              'broker':'开源证券','date':'2023-09-27','analyst':'诸海滨','rating':'未标注','expected_pages':30,
              'type':'新股申购深度报告',
            },
            {
              'filename':'03_国信证券_骑士乳业_2026中报点评_乳业稳健糖业扭亏_2026-09-08.pdf',
              'info_code':'AP202609081829114292',
              'title':'2026中报点评：乳业经营稳健，糖业扭亏为盈，H1扣非归母净利润同比增长约70%',
              'broker':'国信证券','date':'2026-09-08','analyst':'鲁家瑞、李瑞楠、江海航','rating':'增持','expected_pages':13,
              'type':'中报深度跟踪报告',
            },
          ]

          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/stock.jshtml',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def fetch(url):
            last=None
            for attempt in range(5):
              try:
                r=session.get(url,timeout=180,allow_redirects=True)
                print('FETCH',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                if r.status_code==200 and r.content.startswith(b'%PDF-'):
                  return r
                last=RuntimeError(f'HTTP {r.status_code}; head={r.content[:32]!r}')
              except Exception as exc:
                last=exc
              time.sleep(min(10,2**attempt))
            raise RuntimeError(f'Failed {url}: {last}')

          manifest=[]
          render_paths=[]
          for item in reports:
            candidates=[
              f'https://pdf.dfcfw.com/pdf/H3_{item["info_code"]}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{item["info_code"]}.pdf',
            ]
            response=None
            used_url=None
            errors=[]
            for url in candidates:
              try:
                response=fetch(url); used_url=url; break
              except Exception as exc:
                errors.append({'url':url,'error':repr(exc)})
            if response is None:
              raise RuntimeError(f'All URLs failed for {item["title"]}: {errors}')
            data=response.content
            if len(data)<100000:
              raise RuntimeError(f'PDF too small: {item["title"]}, {len(data)} bytes')
            path=REPORTS/item['filename']
            path.write_bytes(data)

            reader=PdfReader(str(path))
            if reader.is_encrypted and not reader.decrypt(''):
              raise RuntimeError(f'Password-protected PDF: {path.name}')
            pages=len(reader.pages)
            if pages!=item['expected_pages']:
              raise RuntimeError(f'Page mismatch: {path.name}: {pages} != {item["expected_pages"]}')

            doc=pymupdf.open(str(path))
            text=''.join(doc[i].get_text('text') for i in range(min(6,doc.page_count)))
            normalized=re.sub(r'\s+','',text)
            if '骑士乳业' not in normalized and '920786' not in normalized and '832786' not in normalized:
              raise RuntimeError(f'Company identity check failed: {path.name}')
            broker_tokens=[item['broker'],item['broker'].replace('证券','')]
            if not any(token and token in normalized for token in broker_tokens):
              raise RuntimeError(f'Broker check failed: {path.name}')

            for label,index in [('first',0),('last',doc.page_count-1)]:
              pix=doc[index].get_pixmap(matrix=pymupdf.Matrix(1.3,1.3),alpha=False)
              render=RENDERS/f'{path.stem}_{label}.png'
              pix.save(str(render))
              render_paths.append(render)
            doc.close()

            record={
              'filename':path.name,'title':item['title'],'report_type':item['type'],
              'broker':item['broker'],'date':item['date'],'analyst':item['analyst'],'rating':item['rating'],
              'info_code':item['info_code'],
              'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
              'source_url':used_url,'final_url':response.url,'pages':pages,'bytes':len(data),
              'sha256':hashlib.sha256(data).hexdigest(),'encrypted':reader.is_encrypted,
            }
            manifest.append(record)
            print('VERIFIED',json.dumps(record,ensure_ascii=False))

          thumbs=[]
          for image_path in render_paths:
            image=Image.open(image_path).convert('RGB')
            image.thumbnail((420,580))
            canvas=Image.new('RGB',(440,630),'white')
            canvas.paste(image,((440-image.width)//2,8))
            ImageDraw.Draw(canvas).text((10,605),image_path.stem[:58],fill='black')
            thumbs.append(canvas)
            image.close()
          cols=2
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*440,rows*630),'white')
          for idx,canvas in enumerate(thumbs):
            sheet.paste(canvas,((idx%cols)*440,(idx//cols)*630))
            canvas.close()
          contact=RENDERS/'contact_sheet.jpg'
          sheet.save(contact,'JPEG',quality=90)
          sheet.close()

          readme=[
            '骑士乳业（920786.BJ，原证券代码832786）券商深度研究报告资料包','',
            '本资料包包含3份公开可直接取得的完整券商原始PDF，不含网页摘要、预览版或重新排版版本。',
            '筛选原则：优先选取篇幅较长的首次覆盖、新股申购深度报告，并补充一份最新的较完整跟踪报告。','',
            '文件清单：',
          ]
          for record in manifest:
            readme.append(f"- {record['filename']} | {record['broker']} | {record['date']} | {record['pages']}页 | {record['rating']} | 分析师：{record['analyst']}")
          readme += [
            '',
            '核验：已检查PDF文件头、实际页数、公司名称、券商名称及加密状态，并渲染每份报告首页与末页。',
            '压缩包已执行ZIP CRC完整性测试。',
            '文件仅供个人研究与学习使用，请遵守原始报告版权与免责声明。',
          ]
          (REPORTS/'00_资料说明.txt').write_text('\n'.join(readme)+'\n',encoding='utf-8')
          (REPORTS/'00_文件清单及校验值.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (REPORTS/'00_SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['filename']}" for r in manifest)+'\n',encoding='utf-8')

          zip_path=OUT/'knight_dairy_broker_deep_reports_3.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for path in sorted(REPORTS.iterdir(),key=lambda p:p.name):
              z.write(path,arcname=path.name)
          with zipfile.ZipFile(zip_path) as z:
            bad=z.testzip()
            if bad:
              raise RuntimeError(f'ZIP CRC failure: {bad}')
          summary={
            'zip_filename':zip_path.name,'zip_bytes':zip_path.stat().st_size,
            'zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),
            'report_count':len(manifest),'total_pages':sum(r['pages'] for r in manifest),'reports':manifest,
          }
          (OUT/'BUILD_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_SUMMARY',json.dumps({k:summary[k] for k in ('zip_filename','zip_bytes','zip_sha256','report_count','total_pages')},ensure_ascii=False))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: knight-dairy-broker-deep-reports-package
          path: |
            output/knight_dairy_broker_deep_reports_3.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
