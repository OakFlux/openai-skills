name: Temporary FXBaoGao sequential page probe for Aixin

on:
  push:
    branches:
      - tmp-fx-sequential-probe-aixin-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe page image sequences
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests Pillow
          python - <<'PY'
          import io, json
          from pathlib import Path
          import requests
          from PIL import Image

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9',
            'Accept':'image/avif,image/webp,image/png,image/*,*/*;q=0.8',
          })
          reports={
            'bocom_5480083': {'id':'5480083','date':'2026/06/15','test_pages':[1,2,3,4,10,20,32,33,34]},
            'guotai_5472548': {'id':'5472548','date':'2026/06/11','test_pages':[1,2,3,4,6,7,8]},
            'guosheng_update_5605896': {'id':'5605896','date':'2026/08/15','test_pages':[1,2,3,4,5,6]},
          }
          results={}
          for key,info in reports.items():
            checks=[]
            for page in info['test_pages']:
              urls=[
                f"https://public.fxbaogao.com/report-image/{info['date']}/{info['id']}-{page}.png",
                f"https://public.fxbaogao.com/report-image/{info['date']}/{info['id']}-{page}.jpg",
              ]
              success=None
              attempts=[]
              for u in urls:
                try:
                  r=s.get(u,headers={'Referer':f"https://www.fxbaogao.com/view?id={info['id']}"},timeout=(20,90),allow_redirects=True)
                  data=r.content
                  row={'url':u,'status':r.status_code,'bytes':len(data),'content_type':r.headers.get('content-type'),'final_url':r.url}
                  if r.status_code==200 and len(data)>1000:
                    try:
                      im=Image.open(io.BytesIO(data)); im.load()
                      row.update({'width':im.width,'height':im.height,'format':im.format})
                      if im.width>=500 and im.height>=700:
                        success=row
                        (out/f'{key}_{page:03d}.{(im.format or "png").lower()}').write_bytes(data)
                    except Exception as e: row['image_error']=repr(e)
                  attempts.append(row)
                  print('TRY',key,page,json.dumps(row,ensure_ascii=False),flush=True)
                  if success: break
                except Exception as e:
                  attempts.append({'url':u,'error':repr(e)})
                  print('ERR',key,page,u,repr(e),flush=True)
              checks.append({'page':page,'success':success,'attempts':attempts})
            results[key]=checks
          (out/'sequential_probe.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: fx-sequential-aixin-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
