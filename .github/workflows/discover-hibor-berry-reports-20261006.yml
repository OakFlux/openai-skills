name: Discover Hibor Berry Genomics reports

on:
  pull_request:
    paths:
      - 'tasks/discover-hibor-berry-reports-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search Hibor archives and report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          months=['202004','202007','202009','202508']
          archive_templates=[
            'https://fxgroup.hibor.com.cn/archiver/{m}.html',
            'https://sysbg.hibor.com.cn/archiver_houtai/{m}.html',
            'https://www.hibor.com.cn/archiver/{m}.html',
          ]
          keywords=['贝瑞基因','基因测序行业的领头羊','肿瘤早筛','解码生命经纬']
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.hibor.com.cn/'})
          results=[];pages=[]
          for m in months:
            for tpl in archive_templates:
              u=tpl.format(m=m)
              try:
                r=s.get(u,timeout=(25,120),allow_redirects=True)
                print('ARCHIVE',m,r.status_code,len(r.content),r.url,flush=True)
                if r.status_code!=200 or len(r.content)<1000: continue
                Path(f'output/{m}_{len(pages)}.html').write_bytes(r.content)
                pages.append({'month':m,'url':u,'final':r.url,'status':r.status_code,'length':len(r.content)})
                soup=BeautifulSoup(r.text,'html.parser')
                for a in soup.find_all('a',href=True):
                  text=' '.join(a.get_text(' ',strip=True).split())
                  if any(k in text for k in keywords):
                    link=urljoin(r.url,a['href'])
                    rec={'month':m,'archive':r.url,'text':text,'url':link}
                    if rec not in results: results.append(rec)
                    print('MATCH',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e: print('ARCHIVE_ERROR',u,repr(e),flush=True)
          # Fetch all matched detail pages and inspect original-report links / image endpoints.
          details=[]
          for i,rec in enumerate(results):
            try:
              r=s.get(rec['url'],timeout=(25,120),allow_redirects=True)
              print('DETAIL',i,r.status_code,len(r.content),r.url,flush=True)
              Path(f'output/detail_{i}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for tag in soup.find_all(['a','img','iframe','form','input','script']):
                text=' '.join(tag.get_text(' ',strip=True).split())
                attrs={k:tag.get(k) for k in ('href','src','action','value','onclick','id','name','data-src','data-original') if tag.get(k)}
                blob=(text+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in blob for k in ('pdf','download','原文','报告','image','page','viewer','file')):
                  norm={k:(urljoin(r.url,v) if k in ('href','src','action','data-src','data-original') and isinstance(v,str) else v) for k,v in attrs.items()}
                  links.append({'tag':tag.name,'text':text[:300],'attrs':norm})
              rawurls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',r.text)))
              d={**rec,'final_url':r.url,'status':r.status_code,'length':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links,'raw_urls':[u for u in rawurls if any(x in u.lower() for x in ('pdf','image','img','file','download','report','repinfo'))][:500]}
              details.append(d)
              print('DETAILMETA',json.dumps(d,ensure_ascii=False)[:50000],flush=True)
            except Exception as e:
              details.append({**rec,'error':repr(e)});print('DETAIL_ERROR',rec['url'],repr(e),flush=True)
          Path('output/results.json').write_text(json.dumps({'archives':pages,'matches':results,'details':details},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hibor-berry-report-discovery
          path: output/
          retention-days: 7
          if-no-files-found: error
