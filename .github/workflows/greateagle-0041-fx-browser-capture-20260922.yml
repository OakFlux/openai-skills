name: Capture FXBaogao Great Eagle search traffic

on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-fx-browser-capture-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Search and capture network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cat > /tmp/capture.py <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path('output')
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(
                viewport={'width':1440,'height':1100},
                locale='zh-CN',
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
              )
              page=await ctx.new_page()
              records=[]
              async def on_response(resp):
                req=resp.request
                u=resp.url
                if ('api.fxbaogao.com' in u or '/mofoun/' in u or req.resource_type in ('xhr','fetch')):
                  item={'url':u,'status':resp.status,'method':req.method,'resource_type':req.resource_type,'post_data':req.post_data}
                  try:item['request_headers']=await req.all_headers()
                  except:pass
                  try:item['response_headers']=await resp.all_headers()
                  except:pass
                  try:
                    body=await resp.body()
                    item['body_bytes']=len(body)
                    if len(body)<=5_000_000:
                      try:item['body_text']=body.decode('utf-8')
                      except:item['body_hex']=body[:1000].hex()
                  except Exception as e:item['body_error']=repr(e)
                  records.append(item)
              page.on('response',on_response)
              await page.goto('https://www.fxbaogao.com/',wait_until='domcontentloaded',timeout=120000)
              await page.wait_for_timeout(5000)
              await page.screenshot(path=str(OUT/'home.png'),full_page=True)
              (OUT/'home.html').write_text(await page.content(),encoding='utf-8')
              print('TITLE',await page.title(),'URL',page.url,flush=True)
              inputs=page.locator('input')
              print('INPUT_COUNT',await inputs.count(),flush=True)
              for i in range(await inputs.count()):
                try:
                  el=inputs.nth(i)
                  print('INPUT',i,await el.get_attribute('placeholder'),await el.get_attribute('class'),flush=True)
                except:pass
              target=None
              for sel in ['input[placeholder*="关键词"]','input[placeholder*="股票"]','input[type="search"]','input']:
                loc=page.locator(sel)
                if await loc.count():
                  for i in range(await loc.count()):
                    if await loc.nth(i).is_visible(): target=loc.nth(i); break
                if target: break
              if not target: raise RuntimeError('No visible search input')
              await target.click()
              await target.fill('鹰君')
              await page.wait_for_timeout(4000)
              await page.screenshot(path=str(OUT/'typed.png'),full_page=True)
              (OUT/'typed.html').write_text(await page.content(),encoding='utf-8')
              print('TYPED URL',page.url,flush=True)
              # Click suggestion containing both company name and stock code when available.
              clicked=False
              for text in ['00041 鹰君','鹰君','00041']:
                loc=page.get_by_text(text,exact=False)
                for i in range(min(await loc.count(),10)):
                  try:
                    if await loc.nth(i).is_visible():
                      print('CLICK',text,i,await loc.nth(i).inner_text(),flush=True)
                      await loc.nth(i).click()
                      clicked=True
                      break
                  except Exception as e: print('CLICK_ERR',repr(e),flush=True)
                if clicked: break
              if not clicked:
                await target.press('Enter')
              await page.wait_for_timeout(8000)
              print('AFTER URL',page.url,'TITLE',await page.title(),flush=True)
              await page.screenshot(path=str(OUT/'results.png'),full_page=True)
              (OUT/'results.html').write_text(await page.content(),encoding='utf-8')
              (OUT/'network.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
              print('NETWORK_COUNT',len(records),flush=True)
              for x in records:
                if any(k in x.get('url','') for k in ['searchReport','facet','reportStock','article']):
                  print('REC',json.dumps({k:x.get(k) for k in ['url','status','method','post_data','body_text']},ensure_ascii=False)[:20000],flush=True)
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/capture.py
          grep -RInE '鹰君|00041|searchReport|facet|reportStock|docId|reportId' output > output/hits.txt || true
          find output -type f -printf '%f %s bytes\n' | sort > output/sizes.txt

      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-fx-browser-capture
          path: output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
