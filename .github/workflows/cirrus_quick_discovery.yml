name: Cirrus Quick Discovery

on:
  push:
    branches:
      - chatgpt-cirrus-fast-20260915
    paths:
      - .github/workflows/cirrus_quick_discovery.yml

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover report identifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/discover.py <<'PY'
          import requests,re,json
          from pathlib import Path
          from datetime import datetime,timedelta
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/html,*/*'})
          O=Path('out'); rec={}
          pages={
            'dongwu':'https://www.fxbaogao.com/detail/5338338',
            'xibu':'https://www.fxbaogao.com/detail/5048168',
            'huachuang':'https://www.fxbaogao.com/detail/5023910',
          }
          for name,u in pages.items():
            r=S.get(u,timeout=30); t=r.text
            vals={
              'status':r.status_code,'bytes':len(r.content),'title':re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)[:3],
              'ap_codes':sorted(set(re.findall(r'AP\d{12,}',t))),
              'pdf_urls':sorted(set(re.findall(r'https?[^\"\'<> ]+\.pdf[^\"\'<> ]*',t,re.I)))[:100],
              'dfcfw_urls':sorted(set(re.findall(r'https?[^\"\'<> ]*dfcfw[^\"\'<> ]+',t,re.I)))[:100],
              'contexts':[]
            }
            for pat in ['AP20','pdf.dfcfw','infoCode','infocode','encodeUrl','download','5338338','5048168']:
              for m in list(re.finditer(pat,t,re.I))[:10]: vals['contexts'].append(t[max(0,m.start()-500):m.end()+1000])
            rec['fx_'+name]=vals
            (O/f'{name}.html').write_text(t,encoding='utf-8',errors='ignore')
            print('FX',name,json.dumps(vals,ensure_ascii=False)[:8000])

          api='https://reportapi.eastmoney.com/report/list'
          target_dates=['2026-04-07','2025-09-03','2025-08-20','2025-04-17','2025-06-27']
          frags=['全球私人航空领航者','人群渗透提升','被低估的空中奢侈品','被低估的全球通航飞机制造龙头','全球领先的私航飞机制造商','西锐']
          for day in target_dates:
            end=(datetime.strptime(day,'%Y-%m-%d')+timedelta(days=1)).strftime('%Y-%m-%d')
            params={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':day,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
            r=S.get(api,params=params,timeout=30); obj=r.json(); rows=obj.get('data') or []
            matches=[x for x in rows if any(f in str(x.get('title') or '') or f in str(x.get('stockName') or '') for f in frags)]
            info={'status':r.status_code,'bytes':len(r.content),'hits':obj.get('hits'),'TotalPage':obj.get('TotalPage') or obj.get('totalPage'),'rows':len(rows),'matches':matches,'first_rows':rows[:3]}
            rec['api_'+day]=info
            print('API',day,json.dumps(info,ensure_ascii=False)[:16000])

          list2='https://reportapi.eastmoney.com/report/list2'
          for code in ['02507','2507','HK02507','116.02507','02507.HK','西锐']:
            body={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2024-01-01','endTime':'2030-12-31','code':code,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
            r=S.post(list2,json=body,timeout=30,headers={'Content-Type':'application/json'});
            try: obj=r.json()
            except: obj={'raw':r.text[:2000]}
            info={'status':r.status_code,'bytes':len(r.content),'response':obj}
            rec['list2_'+code]=info
            print('LIST2',code,json.dumps(info,ensure_ascii=False)[:12000])
          (O/'discovery.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/discover.py

      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirrus-quick-discovery
          path: out
          retention-days: 1
