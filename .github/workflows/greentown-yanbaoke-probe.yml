name: Greentown Yanbaoke public source probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-final-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect public frontend and report APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import html
          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('probe')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          pages = [
              'https://pc.yanbaoke.cn/',
              'https://pc.yanbaoke.cn/info/jCqJbch8QenqBNK6iVBP9L',
              'https://pc.yanbaoke.cn/hot/today',
          ]
          page_results = []
          scripts = []
          for idx, url in enumerate(pages):
              try:
                  r = s.get(url, timeout=45, allow_redirects=True)
                  print('PAGE', url, r.status_code, r.url, len(r.content), r.headers.get('content-type'))
                  text = r.text
                  (OUT / f'page_{idx}.html').write_text(text, encoding='utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'html.parser')
                  srcs = [urllib.parse.urljoin(r.url, x.get('src')) for x in soup.select('script[src]') if x.get('src')]
                  scripts += srcs
                  hrefs = []
                  for x in soup.select('a[href],link[href],iframe[src]'):
                      v = x.get('href') or x.get('src')
                      if v:
                          hrefs.append(urllib.parse.urljoin(r.url, v))
                  inline = []
                  for sc in soup.select('script:not([src])'):
                      t = sc.get_text('\n', strip=False)
                      if any(k.lower() in t.lower() for k in ['api', 'search', 'download', 'pdf', 'keyword', '__next_data__', '__nuxt__']):
                          inline.append(t[:200000])
                  rec = {
                      'url': url, 'status': r.status_code, 'final': r.url,
                      'title': soup.title.get_text(' ', strip=True) if soup.title else '',
                      'scripts': srcs, 'links': hrefs[:500], 'inline': inline,
                  }
                  page_results.append(rec)
                  print(json.dumps(rec, ensure_ascii=False, indent=2)[:100000])
              except Exception as exc:
                  page_results.append({'url': url, 'error': repr(exc)})
                  print('PAGE ERROR', url, repr(exc))
          (OUT / 'pages.json').write_text(json.dumps(page_results, ensure_ascii=False, indent=2), encoding='utf-8')

          keywords = [
              'download', 'search', 'keyword', 'pdf', '/api/', 'axios', 'baseURL', 'baseurl',
              'report', 'getInfo', 'getDetail', 'fileUrl', 'file_url', 'downloadUrl',
              'download_url', 'oss', 'cos.', 'minio', '绿城中国'
          ]
          js_results = []
          for idx, url in enumerate(list(dict.fromkeys(scripts))[:80]):
              try:
                  r = s.get(url, timeout=45)
                  if r.status_code != 200 or len(r.content) > 15_000_000:
                      continue
                  text = r.text
                  (OUT / f'js_{idx}.js').write_text(text, encoding='utf-8', errors='replace')
                  low = text.lower()
                  snippets = []
                  for key in keywords:
                      pos = 0
                      while True:
                          pos = low.find(key.lower(), pos)
                          if pos < 0:
                              break
                          snippets.append(text[max(0, pos-1500):min(len(text), pos+5000)])
                          pos += max(1, len(key))
                          if len(snippets) >= 100:
                              break
                      if len(snippets) >= 100:
                          break
                  raw_urls = sorted(set(re.findall(r'https?://[^\s"\'<>\\]+', html.unescape(text))))
                  interesting_urls = [u.rstrip('),.;') for u in raw_urls if any(k in u.lower() for k in ['api', 'pdf', 'download', 'oss', 'yanbaoke'])]
                  if snippets or interesting_urls:
                      rec = {'url': url, 'length': len(r.content), 'snippets': snippets, 'urls': interesting_urls}
                      js_results.append(rec)
                      print('\nJS', url, len(r.content))
                      print(json.dumps({'urls': interesting_urls, 'snippets': snippets[:20]}, ensure_ascii=False, indent=2)[:120000])
              except Exception as exc:
                  print('JS ERROR', url, repr(exc))
          (OUT / 'js_results.json').write_text(json.dumps(js_results, ensure_ascii=False, indent=2), encoding='utf-8')

          # Probe obvious public paths and query conventions. These are ordinary unauthenticated reads only.
          probes = []
          bases = ['https://pc.yanbaoke.cn', 'https://api.yanbaoke.cn', 'https://www.yanbaoke.cn']
          paths = [
              '/api/search', '/api/report/search', '/api/info/search', '/api/v1/search',
              '/api/reports', '/api/report/list', '/api/info/list', '/api/index/search',
              '/search', '/report/search', '/v1/search', '/api/search/report',
          ]
          querysets = [
              {'keyword':'绿城中国'}, {'q':'绿城中国'}, {'key':'绿城中国'},
              {'keywords':'绿城中国'}, {'search':'绿城中国'}, {'page':1,'pageSize':50,'keyword':'绿城中国'},
          ]
          for base in bases:
              for path in paths:
                  for q in querysets:
                      try:
                          r = s.get(base + path, params=q, timeout=15, allow_redirects=True)
                          ctype = r.headers.get('content-type', '')
                          body = r.text[:10000] if ('text' in ctype or 'json' in ctype or not ctype) else repr(r.content[:100])
                          if r.status_code not in [404, 405] or '绿城' in body or 'report' in body.lower():
                              rec = {'method':'GET','url':r.url,'status':r.status_code,'ctype':ctype,'length':len(r.content),'body':body}
                              probes.append(rec)
                              print('PROBE', json.dumps(rec, ensure_ascii=False)[:20000])
                      except Exception:
                          pass
          (OUT / 'probes.json').write_text(json.dumps(probes, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greentown-yanbaoke-probe
          path: probe/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
