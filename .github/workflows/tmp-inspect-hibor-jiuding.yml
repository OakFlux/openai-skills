name: Temporary Inspect Hibor Jiuding Research Archive

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Search archives and inspect report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import requests
          from urllib.parse import urljoin, unquote

          session = requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer':'https://www.hibor.com.cn/',
          })

          def decode(resp):
              raw=resp.content
              for enc in ('utf-8','gb18030','gbk'):
                  try: return raw.decode(enc)
                  except UnicodeDecodeError: pass
              return raw.decode('utf-8',errors='ignore')

          months=['200712','200906','200907','201012','201511']
          bases=[
              'https://www.hibor.com.cn/archiver_houtai/{m}.html',
              'https://p.hibor.com.cn/archiver_houtai/{m}.html',
              'https://www.hibor.com.cn/Archiver/{m}.html',
              'https://p.hibor.com.cn/Archiver/{m}.html',
              'https://www.hibor.com.cn/archiver/{m}.html',
              'https://p.hibor.com.cn/archiver/{m}.html',
          ]
          candidates=[]
          for m in months:
              for template in bases:
                  url=template.format(m=m)
                  try:
                      r=session.get(url,timeout=60,allow_redirects=True)
                      print('ARCHIVE',url,'->',r.url,r.status_code,len(r.content),r.headers.get('content-type'))
                      if r.status_code!=200 or len(r.content)<1000: continue
                      text=html.unescape(decode(r)).replace('\\/','/')
                      if '九鼎新材' not in text and '002201' not in text and '正威新材' not in text: continue
                      for mm in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,flags=re.I|re.S):
                          href=urljoin(r.url,mm.group(1))
                          title=re.sub(r'<[^>]+>',' ',mm.group(2))
                          title=re.sub(r'\s+',' ',html.unescape(title)).strip()
                          if any(k in title for k in ['九鼎新材','002201','正威新材']):
                              row=(m,title,href)
                              if row not in candidates:
                                  candidates.append(row)
                                  print('CANDIDATE',row)
                  except Exception as exc:
                      print('ARCHIVE_ERR',url,repr(exc))

          print('TOTAL_CANDIDATES',len(candidates))
          # Also inspect likely Hibor site search endpoints.
          search_urls=[
              'https://www.hibor.com.cn/elitelist_1.html?keyword=%E4%B9%9D%E9%BC%8E%E6%96%B0%E6%9D%90',
              'https://www.hibor.com.cn/search?keyword=%E4%B9%9D%E9%BC%8E%E6%96%B0%E6%9D%90',
              'https://www.hibor.com.cn/web/search?keyword=%E4%B9%9D%E9%BC%8E%E6%96%B0%E6%9D%90',
          ]
          for url in search_urls:
              try:
                  r=session.get(url,timeout=60,allow_redirects=True)
                  text=html.unescape(decode(r)).replace('\\/','/')
                  print('SEARCH',url,'->',r.url,r.status_code,len(r.content),'HAS',('九鼎新材' in text))
                  for mm in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,flags=re.I|re.S):
                      href=urljoin(r.url,mm.group(1))
                      title=re.sub(r'<[^>]+>',' ',mm.group(2)); title=re.sub(r'\s+',' ',html.unescape(title)).strip()
                      if any(k in title for k in ['九鼎新材','002201','正威新材']):
                          row=('search',title,href)
                          if row not in candidates: candidates.append(row); print('CANDIDATE',row)
              except Exception as exc: print('SEARCH_ERR',url,repr(exc))

          # Inspect each candidate report page for file endpoints and metadata.
          for origin,title,url in candidates:
              try:
                  r=session.get(url,timeout=60,allow_redirects=True)
                  text=html.unescape(decode(r)).replace('\\/','/')
                  print('\nREPORT',origin,title,url,'->',r.url,r.status_code,len(r.content))
                  visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
                  visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
                  visible=re.sub(r'<[^>]+>',' ',visible); visible=re.sub(r'\s+',' ',visible).strip()
                  print('VISIBLE_HEAD',visible[:900])
                  assets=[]
                  patterns=[
                      r'https?://[^\s"\'<>]+',
                      r'(?:href|src|action)=["\']([^"\']+)["\']',
                      r'["\']([^"\']*(?:download|down|file|attach|pdf|doc)[^"\']*)["\']',
                  ]
                  for pat in patterns:
                      for val in re.findall(pat,text,flags=re.I):
                          if isinstance(val,tuple): val=val[0]
                          u=urljoin(r.url,html.unescape(unquote(val)))
                          if any(k in u.lower() for k in ['.pdf','.doc','download','down','file','attach','getreport','viewpdf','readpdf']):
                              if u not in assets: assets.append(u)
                  for u in assets[:100]: print('ASSET',u)
                  for needle in ['pdfurl','downloadurl','downurl','fileurl','sourceurl','docurl','reportid','docid','aid','articleid']:
                      for pos in [m.start() for m in re.finditer(needle,text,flags=re.I)][:10]:
                          print('SNIP',needle,re.sub(r'\s+',' ',text[max(0,pos-350):pos+650]))
              except Exception as exc: print('REPORT_ERR',url,repr(exc))
          PY
