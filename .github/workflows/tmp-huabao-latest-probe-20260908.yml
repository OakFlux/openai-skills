name: Probe Huabao latest HKEX report links
on:
  push:
    branches: [tmp-huabao-latest-probe-20260908]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright requests beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
      - name: Extract current report links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          targets = [
              'ANNOUNCEMENT OF INTERIM RESULTS FOR THE SIX MONTHS ENDED 30 JUNE 2026',
              '2025 INTERIM REPORT',
          ]
          out = {'requests': [], 'browser': [], 'treelazy': []}
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'

          for url in [
              'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=612',
              'https://treelazy.com/stock-en/hk/00336/conference',
          ]:
              try:
                  r = requests.get(url, headers={'User-Agent': ua}, timeout=90)
                  row = {'url': url, 'status': r.status_code, 'bytes': len(r.content)}
                  soup = BeautifulSoup(r.text, 'lxml')
                  row['links'] = [
                      {'text': ' '.join(a.get_text(' ', strip=True).split()), 'href': a.get('href')}
                      for a in soup.find_all('a', href=True)
                      if any(t.lower() in (' '.join(a.get_text(' ', strip=True).split()) + ' ' + a.get('href','')).lower() for t in targets)
                      or ('2026' in (' '.join(a.get_text(' ', strip=True).split())) and 'interim' in (' '.join(a.get_text(' ', strip=True).split())).lower())
                  ]
                  row['pdf_urls'] = sorted(set(re.findall(r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?', r.text, re.I)))
                  out['requests'].append(row)
              except Exception as e:
                  out['requests'].append({'url': url, 'error': repr(e)})

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage'])
              ctx = browser.new_context(user_agent=ua, locale='en-US', viewport={'width': 1600, 'height': 1200})
              page = ctx.new_page()
              responses = []
              def on_response(resp):
                  if any(k in resp.url.lower() for k in ['titlesearchservlet', 'search', 'conference', 'filing']):
                      rec = {'url': resp.url, 'status': resp.status, 'content_type': resp.headers.get('content-type','')}
                      try:
                          if 'json' in rec['content_type'] or 'text' in rec['content_type']:
                              rec['body'] = resp.text()[:1000000]
                      except Exception as e:
                          rec['error'] = repr(e)
                      responses.append(rec)
              page.on('response', on_response)
              for url in [
                  'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=612',
                  'https://treelazy.com/stock-en/hk/00336/conference',
              ]:
                  row = {'url': url}
                  try:
                      resp = page.goto(url, wait_until='domcontentloaded', timeout=120000)
                      try: page.wait_for_load_state('networkidle', timeout=45000)
                      except PWTimeout: pass
                      page.wait_for_timeout(7000)
                      row['status'] = resp.status if resp else None
                      row['title'] = page.title()
                      row['body'] = ' '.join(page.locator('body').inner_text().split())[:300000]
                      row['links'] = page.eval_on_selector_all('a[href]', '''els => els.map(a => ({text:(a.innerText||a.textContent||'').trim(), href:a.href, html:a.outerHTML}))''')
                      row['matching_links'] = [a for a in row['links'] if any(t.lower() in (a.get('text','')+' '+a.get('href','')).lower() for t in targets) or ('2026' in a.get('text','') and 'interim' in a.get('text','').lower())]
                      page.screenshot(path='output/'+('hkex.png' if 'hkexnews' in url else 'treelazy.png'), full_page=True)
                  except Exception as e:
                      row['error'] = repr(e)
                  out['browser'].append(row)
              out['browser_responses'] = responses
              browser.close()

          Path('output/result.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          for section in ['requests','browser']:
              for row in out[section]:
                  print(section.upper(), row.get('url'), row.get('status'), row.get('matching_links', row.get('links')), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-latest-link-probe
          path: output/*
          retention-days: 1
