name: Temporary FXBaogao search for Aixin Yuanzhi reports

on:
  push:
    branches:
      - tmp-fxbaogao-search-aixin-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search and inspect result pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          })
          queries=[
            '爱芯元智',
            '踏智驾及边缘AI之浪',
            '高端启新 智驱全球',
            'AI终端平台公司 智能汽车打开增量空间',
          ]
          results={}
          for q in queries:
            url='https://www.fxbaogao.com/rp?keywords='+quote(q)+'&order=2&nop=-1'
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              print('SEARCH',q,r.status_code,len(r.content),r.url,flush=True)
              r.raise_for_status()
              safe=re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+','_',q)[:60]
              (out/f'{safe}.html').write_text(r.text,encoding='utf-8',errors='ignore')
              soup=BeautifulSoup(r.text,'lxml')
              candidates=[]
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a['href'])
                text=' '.join(a.get_text(' ',strip=True).split())
                if '/detail/' in href or '/view?id=' in href:
                  candidates.append({'href':href,'text':text,'title':a.get('title') or ''})
              # regex for detail ids near text in SSR html
              for m in re.finditer(r'(?:href=|\"href\":)[\"\']?/?(?:detail/|view\?id=)(\d+)',r.text):
                candidates.append({'href':'https://www.fxbaogao.com/detail/'+m.group(1),'text':'','title':''})
              dedup=[]; seen=set()
              for c in candidates:
                key=c['href']
                if key in seen: continue
                seen.add(key); dedup.append(c)
              results[q]={'url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'candidates':dedup}
              print('CANDIDATES',q,len(dedup),flush=True)
              for c in dedup[:100]: print('CANDIDATE',q,json.dumps(c,ensure_ascii=False),flush=True)
            except Exception as e:
              results[q]={'url':url,'error':repr(e)}
              print('ERROR',q,repr(e),flush=True)
          (out/'search_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload search output
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-aixin-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
