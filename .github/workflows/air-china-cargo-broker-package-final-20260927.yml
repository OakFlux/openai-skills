name: Package Air China Cargo broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/air-china-cargo-broker-package-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '国货航_001391_券商深度报告及专项研究_2份'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_华金证券_国货航_新股专题覆盖报告_2024-12-11.pdf',
                  'broker': '华金证券',
                  'title': '新股专题覆盖报告（国货航）—2024年第91期',
                  'date': '2024-12-11',
                  'type': '国货航公司专项研究／新股覆盖报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202412121641280501_1.pdf',
                  'min_pages': 10,
                  'broker_terms': ['华金证券'],
                  'title_terms': ['国货航', '新股覆盖研究'],
                  'target_terms': ['国货航', '001391'],
                  'target_min_count': 8,
                  'scope_note': '公司专项研究，全文围绕国货航的业务、财务、行业、公司亮点、募投项目、可比公司与风险展开。',
              },
              {
                  'filename': '02_信达证券_交通运输2025年度策略之出海篇_含国货航重点公司分析_2024-12-31.pdf',
                  'broker': '信达证券',
                  'title': '国际供应链需求看空间，贸易运输需求看结构',
                  'date': '2024-12-31',
                  'type': '交通运输行业深度报告／国货航行业补充',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202412311641489562_1.pdf',
                  'min_pages': 42,
                  'broker_terms': ['信达证券'],
                  'title_terms': ['国际供应链需求看空间', '贸易运输需求看结构'],
                  'target_terms': ['国货航'],
                  'target_min_count': 3,
                  'scope_note': '行业深度补充，报告设有国际空运物流及“重点公司：东航物流和国货航”专节，用于分析跨境电商需求、空运供需、运价与国货航受益逻辑。',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download_pdf(url: str, dest: Path) -> str:
              errors = []
              for attempt in range(1, 5):
                  tmp = dest.with_suffix('.pdf.part')
                  try:
                      with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as response:
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, 'final', response.url, flush=True)
                          response.raise_for_status()
                          with tmp.open('wb') as fh:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                          final_url = response.url
                      size = tmp.stat().st_size
                      with tmp.open('rb') as fh:
                          head = fh.read(8)
                      if size < 100_000 or not head.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF size={size}, head={head!r}')
                      tmp.replace(dest)
                      return final_url
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      tmp.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records = []
          seen_hashes = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['url'], dest)

              qcheck = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if qcheck.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {qcheck.stderr[-1500:]}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              page_texts = []
              for page in reader.pages:
                  try:
                      page_texts.append(page.extract_text() or '')
                  except Exception as exc:
                      page_texts.append(f'[EXTRACTION_ERROR {exc!r}]')
              full_text = '\n'.join(page_texts)
              compact = re.sub(r'\s+', '', full_text)

              if not any(term.replace(' ', '') in compact for term in doc['broker_terms']):
                  raise RuntimeError(f'broker identity check failed for {dest.name}')
              if not all(term.replace(' ', '') in compact for term in doc['title_terms']):
                  raise RuntimeError(f'title check failed for {dest.name}')

              target_pages = []
              target_count = 0
              for page_no, text in enumerate(page_texts, 1):
                  compact_page = re.sub(r'\s+', '', text)
                  page_hits = sum(compact_page.count(term.replace(' ', '')) for term in doc['target_terms'])
                  if page_hits:
                      target_pages.append(page_no)
                      target_count += page_hits
              if target_count < doc['target_min_count']:
                  raise RuntimeError(f'target-company relevance check failed for {dest.name}: count={target_count}, pages={target_pages}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)

              record = {
                  'filename': dest.name,
                  'company': '中国国际货运航空股份有限公司（国货航，001391.SZ）',
                  'broker': doc['broker'],
                  'title': doc['title'],
                  'report_date': doc['date'],
                  'report_type': doc['type'],
                  'scope_note': doc['scope_note'],
                  'pages': pages,
                  'target_term_hits': target_count,
                  'target_related_pages': target_pages,
                  'bytes': len(data),
                  'source': '公开研报PDF镜像',
                  'source_url': final_url,
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '中国国际货运航空股份有限公司（国货航，001391.SZ）券商研究报告合集',
              '整理日期：2026-09-27',
              '',
              '收录口径与说明：',
              '1. 仅收录能够匿名公开下载、取得完整PDF并完成结构与正文核验的文件。',
              '2. 第一份为国货航公司专项研究；第二份为42页交通运输行业深度报告，内含国货航重点公司专节。',
              '3. 公开渠道虽能检索到浙商证券2025-12-31发布的27页国货航首次覆盖深度报告，但目前公开页面仅提供摘要或需会员下载，因此未绕过权限、未用残缺预览件凑数。',
              '4. 两份PDF均保留原始文件，不作删页、拼接或内容重制。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              related_pages = '、'.join(map(str, record['target_related_pages']))
              readme.extend([
                  f"{index}. {record['broker']}｜{record['title']}",
                  f"   类型：{record['report_type']}",
                  f"   日期：{record['report_date']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MiB",
                  f"   国货航相关页码（PDF页序）：{related_pages}；关键词命中：{record['target_term_hits']}次",
                  f"   说明：{record['scope_note']}",
                  f"   文件：{record['filename']}",
                  f"   原始来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          readme.extend([
              '完整性核验项目：PDF文件头、实际页数、qpdf结构检查、券商名称、报告标题、目标公司相关性、重复哈希检查及SHA-256。',
              '用途说明：仅供个人研究与学习参考，请以报告原文的免责声明和风险提示为准。',
          ])

          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          if len(list(out.glob('*.pdf'))) != 2:
              raise RuntimeError('PDF count mismatch')
          print('FINAL_PACKAGE', PACKAGE, 'PDF_COUNT', len(records), 'TOTAL_BYTES', sum(r['bytes'] for r in records), flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: air-china-cargo-broker-reports-final
          path: 国货航_001391_券商深度报告及专项研究_2份/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
