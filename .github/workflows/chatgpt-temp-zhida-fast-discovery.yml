name: chatgpt-temp-zhida-fast-discovery
on:
  push:
    branches:
      - chatgpt-temp-zhida-reports-20260914
    paths:
      - .github/workflows/chatgpt-temp-zhida-fast-discovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Focused search
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json
          import requests
          from pathlib import Path
          out=Path('zhida_fast_discovery');out.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Content-Type':'application/json','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          rows=[]
          for q in ['挚达科技','02650','家用充电桩 挚达科技']:
            for only in [1,0]:
              payload={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=60)
              obj=r.json();files=((obj.get('data') or {}).get('files') or [])
              print('QUERY',q,only,r.status_code,len(files),flush=True)
              for x in files:
                blob=json.dumps(x,ensure_ascii=False)
                if '挚达科技' in blob or '摯達科技' in blob or '02650' in blob or '2650.HK' in blob:
                  rec={'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'organization':(x.get('organization') or {}).get('name'),'type':(x.get('type') or {}).get('name'),'page_count':x.get('page_count'),'page_url':x.get('page_url'),'share_url':x.get('share_url'),'summary':x.get('summary'),'content':(x.get('content') or '')[:1000],'content_array':x.get('content_array')}
                  if rec not in rows:rows.append(rec);print('MATCH '+json.dumps(rec,ensure_ascii=False),flush=True)
          (out/'matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Zhida-Fast-Discovery
          path: zhida_fast_discovery
          retention-days: 1
