name: Map public report pages to dates
on:
  push:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests
      - name: Sample dates in public report pages
        run: |
          python - <<'PY'
          import re
          import requests
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          page_numbers=[1,2,10,50,100,200,400,800,1200,1600,2000,2200,2300]
          for number in page_numbers:
              response=session.get('https://www.hangyan.co/reports',params={'page':number},timeout=60)
              text=response.text
              dates=[]
              for match in re.finditer(r'(?<!\d)(20\d{6})(?!\d)',text):
                  value=match.group(1)
                  if value not in dates: dates.append(value)
              print('PAGE',number,'STATUS',response.status_code,'SIZE',len(response.content),'DATES',dates[:8],dates[-8:])
              for match in re.finditer(r'(?<!\d)(20\d{6})(?!\d)',text):
                  print('SAMPLE',text[max(0,match.start()-120):match.end()+180].replace('\n',' ')[:350])
                  break
          PY
