name: Build final Daqin Railway 601006 reports package 20260927

on:
  push:
    paths:
      - '.github/workflows/daqin-601006-eastmoney-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE = '大秦铁路_601006_2020-2025年报及最新季报'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)

          specs = [
            {'key':'2020年年度报告','type':'年度报告','period':'2020','filename':'01_大秦铁路_2020年年度报告.pdf','min_pages':80,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-29/601006_20210429_18.pdf'},
            {'key':'2021年年度报告','type':'年度报告','period':'2021','filename':'02_大秦铁路_2021年年度报告.pdf','min_pages':80,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2022-04-28/601006_20220428_2_YLGcJEoy.pdf'},
            {'key':'2022年年度报告','type':'年度报告','period':'2022','filename':'03_大秦铁路_2022年年度报告.pdf','min_pages':80,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-04-27/601006_20230427_JDLK.pdf'},
            {'key':'2023年年度报告','type':'年度报告','period':'2023','filename':'04_大秦铁路_2023年年度报告.pdf','min_pages':80,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2024-04-27/601006_20240427_I78R.pdf'},
            {'key':'2024年年度报告','type':'年度报告','period':'2024','filename':'05_大秦铁路_2024年年度报告.pdf','min_pages':80,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-30/601006_20250430_F8WB.pdf'},
            {'key':'2025年年度报告','type':'年度报告','period':'2025','filename':'06_大秦铁路_2025年年度报告.pdf','min_pages':80,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-30/601006_20260430_VFZD.pdf'},
            {'key':'2026年第一季度报告','type':'第一季度报告','period':'2026Q1','filename':'07_大秦铁路_2026年第一季度报告_最新季报.pdf','min_pages':5,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-30/601006_20260430_SOQY.pdf'},
            {'key':'2026年半年度报告','type':'半年度报告','period':'2026H1','filename':'08_大秦铁路_2026年半年度报告_最新阶段性报告.pdf','min_pages':20,
             'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-08-21/601006_20260821_8I2N.pdf'},
          ]

          session = requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://data.eastmoney.com/notices/stock/601006.html',
            'Accept':'application/json,text/plain,*/*',
          })

          api='https://np-anotice-stock.eastmoney.com/api/security/ann'
          found = {}
          search_pages = []
          for page in range(1, 31):
              params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':'601006','f_node':'0','s_node':'0'}
              r=session.get(api,params=params,timeout=(20,90))
              if r.status_code != 200:
                  raise RuntimeError(f'Announcement API failed page {page}: {r.status_code}')
              data=r.json()
              rows=((data.get('data') or {}).get('list') or [])
              search_pages.append({'page':page,'count':len(rows)})
              if not rows:
                  break
              for row in rows:
                  title=str(row.get('title') or '')
                  if '摘要' in title:
                      continue
                  for spec in specs:
                      if spec['key'] in title and spec['key'] not in found:
                          found[spec['key']] = row
              if len(found) == len(specs):
                  break
              time.sleep(0.15)

          missing=[s['key'] for s in specs if s['key'] not in found]
          if missing:
              raise RuntimeError('Missing reports from announcement index: '+', '.join(missing))

          manifest=[]
          for spec in specs:
              row=found[spec['key']]
              art=str(row.get('art_code') or row.get('artCode') or '')
              if not art:
                  raise RuntimeError(f'No art_code for {spec["key"]}')
              mirror=f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf'
              last=None
              data=None
              for attempt in range(5):
                  try:
                      rr=session.get(mirror,timeout=(30,240),allow_redirects=True,headers={
                          'User-Agent':session.headers['User-Agent'],
                          'Referer':'https://data.eastmoney.com/notices/detail/601006/'+art+'.html',
                          'Accept':'application/pdf,*/*;q=0.8',
                      })
                      last={'status':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type',''),'bytes':len(rr.content)}
                      if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>50_000:
                          data=rr.content; break
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(1+attempt)
              if data is None:
                  raise RuntimeError(f'PDF download failed {spec["key"]}: {last}')

              dest=root/spec['filename']; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {dest.name}: {pages}')
              subprocess.run(['qpdf','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=preview_dir/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10_000:
                  raise RuntimeError(f'Preview failed {dest.name}')
              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                **spec,
                'announcement_title':row.get('title'),
                'announcement_date':row.get('display_time'),
                'art_code':art,
                'mirror_pdf_url':mirror,
                'official_sse_source_url':spec['sse'],
                'actual_pages':pages,
                'bytes':len(data),
                'sha256':sha,
                'preview_file':str(Path('首页预览')/preview.name),
                'validation':['PDF header','minimum page count','qpdf structure','first-page render'],
              })

          readme=[
            '大秦铁路股份有限公司（601006.SH）2020-2025年报及最新季报资料包',
            '整理日期：2026-09-27',
            '',
            '文件范围：2020-2025年度报告（6份）、2026年第一季度报告（最新季报）、2026年半年度报告（最新完整阶段性报告）。',
            '',
            '来源说明：报告名称与官方披露路径已通过上海证券交易所公告索引核实。由于上交所静态文件服务器对自动下载设置机器人验证，本包PDF字节从东方财富公告镜像下载；文件均为对应公告的完整PDF，并完成结构、页数和首页渲染检查。',
            '',
          ]
          for i,r in enumerate(manifest,1):
              readme += [
                f"{i}. {r['key']}（{r['actual_pages']}页）",
                f"   公告标题：{r['announcement_title']}",
                f"   公告时间：{r['announcement_date']}",
                f"   上交所官方披露路径：{r['official_sse_source_url']}",
                f"   可访问PDF镜像：{r['mirror_pdf_url']}",
                f"   SHA-256：{r['sha256']}",
                '',
              ]
          readme += ['压缩包已通过ZIP CRC完整性测试。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps({'search_pages':search_pages,'reports':manifest},ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=8: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daqin-601006-2020-2025-annual-reports-and-latest-quarter-final
          path: 大秦铁路_601006_2020-2025年报及最新季报.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
