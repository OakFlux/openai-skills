name: Build Gogo 301510 broker deep reports final 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gogo-301510-broker-reports-final-20261028-2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='301510'; SHORT='固高科技'; FULL='固高科技股份有限公司'
          ROOT_NAME='固高科技_301510_券商深度报告'; ROOT=Path(ROOT_NAME); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV):d.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s.headers.update({'User-Agent':ua,'Referer':f'https://data.eastmoney.com/report/stock.jshtml?stockCode={CODE}','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          api='https://reportapi.eastmoney.com/report/list';request_log=[]

          rows=[];seen=set()
          for page in range(1,11):
            params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2023-01-01','endTime':'2026-10-28','pageNo':str(page),'fields':'','qType':'0','orgCode':'','author':'','code':CODE,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
            payload=None;last={}
            for attempt in range(7):
              try:
                r=s.get(api,params=params,timeout=(20,120));last={'url':r.url,'status':r.status_code,'bytes':len(r.content),'prefix':r.text[:200]};request_log.append(last)
                if r.status_code==200:payload=r.json();break
              except Exception as exc:last={'attempt':attempt+1,'error':repr(exc)};request_log.append(last)
              time.sleep(1+attempt)
            if payload is None:break
            current=payload.get('data') or []
            if isinstance(current,dict):current=current.get('list') or current.get('data') or []
            if not isinstance(current,list):current=[]
            for row in current:
              if not isinstance(row,dict):continue
              key=str(row.get('infoCode') or '') or json.dumps(row,ensure_ascii=False,sort_keys=True)
              if key not in seen:seen.add(key);rows.append(row)
            total=int(payload.get('TotalPage') or payload.get('totalPage') or 0)
            if not current or (total and page>=total) or len(current)<100:break

          fallback=[
            {'infoCode':'AP202307261592661720','stockCode':CODE,'stockName':SHORT,'orgSName':'中信建投','publishDate':'2023-07-26 00:00:00.000','attachPages':87,'title':'运动控制领先厂商，助力高端装备产业国产化','researcher':'吕娟','emRatingName':'首次公开发行股票投资价值研究'},
            {'infoCode':'AP202307261592667340','stockCode':CODE,'stockName':SHORT,'orgSName':'华金证券','publishDate':'2023-07-26 00:00:00.000','attachPages':13,'title':'新股覆盖研究：固高科技','researcher':'李蕙','emRatingName':'新股覆盖'},
          ]
          for row in fallback:
            if row['infoCode'] not in seen:seen.add(row['infoCode']);rows.append(row)

          def pages_meta(row):
            try:return int(float(row.get('attachPages') or 0))
            except:return 0
          def date_text(row):return str(row.get('publishDate') or '')[:10]
          def norm(v):return re.sub(r'\s+','',str(v or ''))
          preferred=['二十余年专注于运动控制','AI智能化时代迎来新发展机遇','运动控制领先厂商','助力高端装备产业国产化','新股覆盖研究','首次覆盖','公司深度','深度报告','投资价值研究']
          excluded=['点评','季报','年报','中报','半年报','周报','日报','快报','调研','纪要']
          candidates=[]
          for row in rows:
            code=str(row.get('stockCode') or '');name=str(row.get('stockName') or '');title=str(row.get('title') or '');broker=str(row.get('orgSName') or row.get('orgName') or '');info=str(row.get('infoCode') or '');pages=pages_meta(row)
            if code not in ('',CODE) and SHORT not in name:continue
            if not info or not broker or pages<10 or any(x in title for x in excluded):continue
            score=pages*10+sum(250 for p in preferred if norm(p) in norm(title))+(120 if '首次' in title else 0)+(100 if '深度' in title else 0)+(35 if date_text(row)>='2025-01-01' else 0)
            candidates.append({**row,'_score':score})
          candidates.sort(key=lambda r:(int(r['_score']),pages_meta(r),date_text(r)),reverse=True)
          print('CANDIDATES')
          for row in candidates:print(json.dumps({'infoCode':row.get('infoCode'),'broker':row.get('orgSName'),'date':date_text(row),'pages':pages_meta(row),'title':row.get('title'),'score':row.get('_score')},ensure_ascii=False))

          def download(row):
            info=str(row.get('infoCode') or '');detail=f'https://data.eastmoney.com/report/info/{info}.html';attempts=[]
            for prefix in ('H3','H2','H1','H4'):
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
              for attempt in range(6):
                try:
                  r=s.get(url,headers={'User-Agent':ua,'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'},timeout=(30,360),allow_redirects=True)
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:return r.content,url,attempts
                except Exception as exc:attempts.append({'url':url,'attempt':attempt+1,'error':repr(exc)})
                time.sleep(1+attempt)
            raise RuntimeError('download failed')

          def safe(v):return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',v))[:105]
          aliases={'中信建投':['中信建投','中信建投证券','CHINA SECURITIES'],'华金证券':['华金证券','HUAJIN SECURITIES'],'海通证券':['海通证券','HAITONG SECURITIES'],'国泰海通':['国泰海通','GUOTAI HAITONG']}
          manifest=[];used=set();errors=[]
          for row in candidates:
            if len(manifest)>=3:break
            broker=str(row.get('orgSName') or row.get('orgName') or '')
            if broker in used:continue
            temp=None
            try:
              data,src,attempts=download(row);temp=PDFDIR/f'_tmp_{row.get("infoCode")}.pdf';temp.write_bytes(data)
              reader=PdfReader(str(temp),strict=False);pages=len(reader.pages)
              if pages<10:raise RuntimeError(f'short pdf {pages}')
              text=''
              for p in reader.pages[:min(30,pages)]:
                try:text+='\n'+(p.extract_text() or '')
                except:pass
              compact=norm(text);id_hits=[x for x in (SHORT,FULL,CODE) if norm(x) in compact];broker_names=aliases.get(broker,[broker]);broker_hits=[x for x in broker_names if norm(x).lower() in compact.lower()]
              if len(compact)>500 and not id_hits:raise RuntimeError('issuer mismatch')
              if len(compact)>500 and not broker_hits:raise RuntimeError('broker mismatch')
              title=str(row.get('title') or '');date=date_text(row);fn=f'{len(manifest)+1:02d}_{safe(broker)}_固高科技_{safe(title)}_{date}.pdf';dest=PDFDIR/fn;temp.replace(dest)
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREV/dest.stem;subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000:raise RuntimeError('preview failed')
              sha=hashlib.sha256(data).hexdigest()
              manifest.append({'broker':broker,'date':date,'title':title,'analysts':row.get('researcher') or row.get('author'),'rating':row.get('emRatingName') or row.get('sRatingName'),'metadata_pages':pages_meta(row),'actual_pages':pages,'filename':str(Path('原始PDF')/fn),'bytes':len(data),'sha256':sha,'info_code':row.get('infoCode'),'source_report_page':f'https://data.eastmoney.com/report/info/{row.get("infoCode")}.html','source_pdf_url':src,'identity_hits':id_hits,'broker_hits':broker_hits,'preview_file':str(Path('首页预览')/preview.name),'selection_score':row.get('_score'),'download_attempts':attempts,'validation':['PDF header','issuer identity','broker identity','page count','qpdf structure','first-page render']});used.add(broker)
            except Exception as exc:
              errors.append({'broker':broker,'title':row.get('title'),'info_code':row.get('infoCode'),'error':repr(exc)})
              if temp and temp.exists():temp.unlink()
          if len(manifest)<2:raise RuntimeError('fewer than two verified reports '+json.dumps(errors,ensure_ascii=False))

          total_pages=sum(x['actual_pages'] for x in manifest)
          readme=['固高科技股份有限公司（301510.SZ）券商深度研究报告资料包','整理日期：2026-10-28','',f'本包收录{len(manifest)}份公开可直接取得并通过完整性核验的券商原始PDF。','筛选口径：优先公司深度、首次覆盖、新股覆盖和投资价值研究，并尽量选择不同券商；未使用普通财报点评凑数。','']
          for i,x in enumerate(manifest,1):readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；分析师：{x['analysts']}；评级/类型：{x['rating']}",f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",f"   来源页面：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          readme += [f'合计：{len(manifest)}份PDF，{total_pages}页。','报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、公司名称/证券代码、券商标识、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'candidate_ranking.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          (ROOT/'download_errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'request_log.json').write_text(json.dumps(request_log,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')
          zcn=Path(f'固高科技_301510_券商深度报告_{len(manifest)}份.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file():z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
            bad=z.testzip();pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=len(manifest):raise RuntimeError(f'zip failed {bad} {len(pdfs)}')
          zen=Path('gogo_301510_broker_deep_reports.zip');zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('ERRORS',json.dumps(errors,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: gogo-301510-broker-deep-reports-final
          path: |
            固高科技_301510_券商深度报告_*.zip
            gogo_301510_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
