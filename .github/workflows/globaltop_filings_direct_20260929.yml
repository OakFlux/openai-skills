name: Global Top Direct Filings Archive

on:
  push:
    branches:
      - chatgpt-globaltop-filings-20260929
    paths:
      - .github/workflows/globaltop_filings_direct_20260929.yml
      - scripts/build_globaltop_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_globaltop_filings.py

      - name: Upload reports directly
        uses: actions/upload-artifact@v4
        with:
          name: globaltop-direct-filings-archive
          path: |
            output/00_资料说明.txt
            output/00_文件清单及校验值.json
            output/01_跨境通_2020年年度报告.pdf
            output/02_跨境通_2021年年度报告.pdf
            output/03_跨境通_2022年年度报告.pdf
            output/04_跨境通_2023年年度报告.pdf
            output/05_跨境通_2024年年度报告.pdf
            output/06_跨境通_2025年年度报告.pdf
            output/07_跨境通_2026年第一季度报告_最新季报.pdf
          retention-days: 1
          compression-level: 9
