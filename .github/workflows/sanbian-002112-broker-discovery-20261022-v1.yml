name: Discover Sanbian 002112 broker reports 20261022

on:
  push:
    branches:
      - tmp/sanbian-002112-broker-discovery-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time
          import requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://reportapi.eastmoney.com/report/list'
          rows = []
          for qtype in ['0', '1', '2']:
              for page in range(1, 20):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*', 'beginTime': '2010-01-01',
                      'endTime': '2030-12-31', 'pageNo': str(page), 'fields': '',
                      'qType': qtype, 'orgCode': '', 'code': '002112', 'rcode': '',
                      'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                  }
                  response = s.get(api, params=params, timeout=(20, 120))
                  print('API_STATUS', qtype, page, response.status_code, len(response.content), response.url)
                  data = response.json()
                  batch = data.get('data') or []
                  if isinstance(batch, dict):
                      batch = batch.get('list') or batch.get('data') or []
                  print('QTYPE', qtype, 'PAGE', page, 'HITS', data.get('hits'), 'COUNT', len(batch) if isinstance(batch, list) else 'bad')
                  if not isinstance(batch, list) or not batch:
                      break
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
                  time.sleep(0.1)

          seen = set()
          output = []
          keys = [
              'infoCode', 'title', 'orgSName', 'orgCode', 'publishDate',
              'attachPages', 'stockCode', 'stockName', 'researcher',
              'emRatingName', 'ratingChange', 'indvInduName',
          ]
          for row in rows:
              code = str(row.get('infoCode') or row.get('info_code') or '')
              if not code or code in seen:
                  continue
              seen.add(code)
              output.append({key: row.get(key) for key in keys})

          print('RESULT_COUNT', len(output))
          print(json.dumps(output, ensure_ascii=False, indent=2, default=str))
          PY
