name: Package Dongbei Group 601956 official filings fast

on:
  push:
    paths:
      - '.github/workflows/dongbei-601956-official-filings-fast-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Package official PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, os, re, shutil, zipfile
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from typing import Any
          import fitz, requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE='601956'; OLD='900956'; COMPANY='东贝集团'; FULL='湖北东贝机电集团股份有限公司'; PRE='黄石东贝电器股份有限公司'
          CUTOFF='2026-10-28'; CUT='20261028'
          ROOT_NAME=f'{COMPANY}_{CODE}_上市以来全部年报_上市核心文件及最新季报_截至{CUT}'
          ROOT=Path('work')/ROOT_NAME; DIST=Path('dist')
          LISTING=ROOT/'00_上市核心文件（替代常规招股说明书）'; ANNUAL=ROOT/'01_年度报告'; QUARTER=ROOT/'02_最新季度报告'; PREVIEW=ROOT/'首页预览'
          for d in (LISTING,ANNUAL,QUARTER,PREVIEW,DIST): d.mkdir(parents=True,exist_ok=True)

          s=requests.Session()
          retry=Retry(total=3,connect=3,read=3,status=3,backoff_factor=.6,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET','POST'}),raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})

          def clean(v):
            v=html.unescape(str(v or '')); v=re.sub(r'<[^>]+>','',v); return re.sub(r'\s+','',v.replace('\u3000',' ')).strip()

          def resolve(code):
            for url in ('https://www.cninfo.com.cn/new/data/sse_stock.json',f'https://www.cninfo.com.cn/new/information/topSearch/query?keyWord={code}&maxNum=20'):
              try:
                r=s.get(url,headers={'Referer':'https://www.cninfo.com.cn/'},timeout=30); print('ORG',code,r.status_code,len(r.content),url)
                if r.status_code!=200: continue
                data=r.json(); items=[]
                if isinstance(data,dict):
                  for k in ('stockList','data','result','records'):
                    if isinstance(data.get(k),list): items.extend(data[k])
                elif isinstance(data,list): items=data
                for x in items:
                  if isinstance(x,dict) and str(x.get('code') or x.get('stockCode') or x.get('secCode') or '')==code:
                    org=str(x.get('orgId') or x.get('orgid') or '')
                    if org: print('ORG_OK',code,org); return org
              except Exception as e: print('ORG_ERR',code,repr(e))
            return ''

          org=resolve(CODE); oldorg=resolve(OLD)

          def query(code='',orgid='',searchkey='',category='',dates=''):
            stock=f'{code},{orgid}' if code and orgid else code
            payload={'pageNum':'1','pageSize':'30','column':'sse','tabName':'fulltext','plate':'sh','stock':stock,'searchkey':searchkey,'secid':'','category':category,'trade':'','seDate':dates,'sortName':'','sortType':'','isHLtitle':'true'}
            headers={'Referer':'https://www.cninfo.com.cn/new/disclosure/stock','Origin':'https://www.cninfo.com.cn','X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Accept':'application/json,text/plain,*/*'}
            try:
              r=s.post('https://www.cninfo.com.cn/new/hisAnnouncement/query',data=payload,headers=headers,timeout=45); print('QUERY',stock,category,searchkey,dates,r.status_code,len(r.content)); r.raise_for_status(); data=r.json(); out=[]
              for row in data.get('announcements') or []:
                title=clean(row.get('announcementTitle')); path=str(row.get('adjunctUrl') or '').lstrip('/')
                if not title or not path: continue
                ts=int(row.get('announcementTime') or 0); date=datetime.fromtimestamp(ts/1000,tz=timezone(timedelta(hours=8))).strftime('%Y-%m-%d') if ts else ''
                item={'title':title,'source_url':'https://static.cninfo.com.cn/'+path,'announcement_date':date,'announcement_time':ts,'source':'CNINFO'}; out.append(item); print('ROW',json.dumps(item,ensure_ascii=False))
              return out
            except Exception as e: print('QUERY_ERR',stock,searchkey,category,repr(e)); return []

          rows=[]
          rows += query(CODE,org,category='category_ndbg_szsh',dates='2021-01-01~2026-10-28')
          for y in range(2020,2026): rows += query(CODE,org,searchkey=f'{y}年年度报告',dates=f'{y+1}-01-01~{y+1}-06-30')
          rows += query(CODE,org,searchkey='2026年第三季度报告',dates='2026-10-20~2026-10-28')
          rows += query(CODE,org,category='category_sjdbg_szsh',dates='2026-10-20~2026-10-28')
          rows += query(CODE,org,searchkey='上市公告书',dates='2020-12-01~2020-12-31')
          rows += query(OLD,oldorg,searchkey='上市公告书',dates='2020-12-01~2020-12-31')
          rows += query('', '', searchkey='东贝集团换股吸收合并东贝B股上市公告书',dates='2020-12-20~2020-12-31')
          rows += query(OLD,oldorg,searchkey='换股吸收合并',dates='2020-06-01~2020-10-31')
          rows += query('', '', searchkey='湖北东贝机电集团股份有限公司换股吸收合并黄石东贝电器股份有限公司',dates='2020-06-01~2020-12-31')
          rows += [
            {'title':'湖北东贝机电集团股份有限公司换股吸收合并黄石东贝电器股份有限公司暨关联交易报告书（修订稿）','source_url':'https://static.cninfo.com.cn/finalpage/2020-09-30/1208514501.PDF','announcement_date':'2020-09-30','announcement_time':1601395200000,'source':'CNINFO_OFFICIAL_FALLBACK'},
            {'title':'湖北东贝机电集团股份有限公司2026年第三季度报告','source_url':'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-24/601956_20261024_L6BB.pdf','announcement_date':'2026-10-24','announcement_time':1792771200000,'source':'SSE_OFFICIAL_FALLBACK'},
          ]
          dedup={}
          for x in rows:
            t=clean(x.get('title')); u=str(x.get('source_url') or '')
            if t and u: x=dict(x); x['title']=t; dedup[(t,u)]=x
          rows=list(dedup.values()); print('TOTAL',len(rows))

          def annual_rank(x):
            t=x['title']; return (2 if any(k in t for k in ('修订','更新','更正后','补充后')) else 1,2 if re.search(r'20\d{2}年年度报告(?:（[^）]+）)?$',t) else 1,str(x.get('announcement_date') or ''))
          annuals=[]
          for y in range(2020,2026):
            c=[x for x in rows if re.search(fr'{y}年年度报告',x['title']) and not any(k in x['title'] for k in ('摘要','英文版','更正公告','提示性公告','审计报告','问询函','回复'))]
            if not c: raise RuntimeError(f'缺少{y}年完整年度报告')
            z=dict(max(c,key=annual_rank)); z.update(doc_type='annual_report',report_year=y); annuals.append(z)
          q=[x for x in rows if re.search(r'2026年(?:第三|三)季度报告',x['title']) and not any(k in x['title'] for k in ('摘要','更正公告','提示性公告'))]
          if not q: raise RuntimeError('缺少2026年第三季度报告')
          quarter=dict(max(q,key=lambda x:str(x.get('announcement_date') or ''))); quarter.update(doc_type='quarterly_report',report_year=2026,quarter=3)
          m=[x for x in rows if '换股吸收合并黄石东贝电器股份有限公司暨关联交易报告书' in x['title'] and not any(k in x['title'] for k in ('摘要','反馈意见回复','提示性公告'))]
          if not m: raise RuntimeError('缺少换股吸收合并报告书')
          merger=dict(max(m,key=lambda x:(2 if '修订稿' in x['title'] else 1,str(x.get('announcement_date') or '')))); merger['doc_type']='merger_report'
          l=[x for x in rows if '上市公告书' in x['title'] and ('东贝' in x['title'] or '换股吸收合并' in x['title']) and '摘要' not in x['title']]
          if not l:
            print('ALL_TITLES_FOR_LISTING_DEBUG')
            for x in rows: print(x['title'],x['source_url'])
            raise RuntimeError('缺少换股吸收合并上市公告书')
          listing=dict(max(l,key=lambda x:str(x.get('announcement_date') or ''))); listing['doc_type']='listing_notice'
          selected=[merger,listing,*annuals,quarter]
          for x in selected: print('SELECTED',json.dumps(x,ensure_ascii=False))

          def safe(v): return re.sub(r'_+','_',re.sub(r'[\\/:*?"<>|]','_',re.sub(r'\s+','',v))).strip('_. ')
          def download(url,dest):
            r=s.get(url,headers={'Referer':'https://www.cninfo.com.cn/','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},timeout=180,allow_redirects=True); print('GETPDF',r.status_code,len(r.content),url,r.url,r.headers.get('content-type')); r.raise_for_status()
            if len(r.content)<50000 or not r.content.startswith(b'%PDF'): raise RuntimeError(f'无效PDF {url}: {len(r.content)} {r.content[:20]!r}')
            dest.write_bytes(r.content)

          recs=[]
          for x in selected:
            typ=x['doc_type']
            if typ=='merger_report': dest=LISTING/'2020_东贝集团_换股吸收合并东贝B股暨关联交易报告书_修订稿.pdf'; period='2020上市文件'
            elif typ=='listing_notice': dest=LISTING/'2020_东贝集团_换股吸收合并东贝B股上市公告书.pdf'; period='2020上市文件'
            elif typ=='annual_report': y=x['report_year']; suffix='_修订或更新版' if any(k in x['title'] for k in ('修订','更新','更正后','补充后')) else ''; dest=ANNUAL/f'{y}_东贝集团_{y}年年度报告{suffix}.pdf'; period=str(y)
            else: dest=QUARTER/'2026Q3_东贝集团_2026年第三季度报告.pdf'; period='2026Q3'
            dest=dest.with_name(safe(dest.name)); download(x['source_url'],dest)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<2: raise RuntimeError(f'页数异常 {dest}: {pages}')
            doc=fitz.open(dest)
            if doc.page_count!=pages: raise RuntimeError(f'页数解析不一致 {dest}: {pages}/{doc.page_count}')
            first=doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.4,1.4),alpha=False); last=doc.load_page(doc.page_count-1).get_pixmap(matrix=fitz.Matrix(.8,.8),alpha=False)
            if min(first.width,first.height,last.width,last.height)<100: raise RuntimeError(f'渲染失败 {dest}')
            first.save(PREVIEW/f'{dest.stem}.png'); doc.close()
            rec={'document_type':typ,'period':period,'announcement_title':x['title'],'announcement_date':x.get('announcement_date') or '','source_url':x['source_url'],'relative_path':str(dest.relative_to(ROOT)).replace(os.sep,'/'),'file_name':dest.name,'file_size_bytes':dest.stat().st_size,'page_count':pages,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest()}
            recs.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False))
          years=sorted(int(r['period']) for r in recs if r['document_type']=='annual_report')
          if years!=[2020,2021,2022,2023,2024,2025] or len(recs)!=9: raise RuntimeError(f'文件集合异常 years={years}, count={len(recs)}')
          manifest={'company':COMPANY,'full_company_name':FULL,'stock_code':CODE,'predecessor_company':PRE,'predecessor_stock_code':OLD,'cutoff_date':CUTOFF,'annual_report_years':years,'latest_quarter':'2026Q3','document_count':len(recs),'listing_document_note':'公司通过换股吸收合并东贝B股上市，不存在常规最终版IPO招股说明书；以正式交易报告书（修订稿）和上市公告书作为上市核心文件。','documents':recs,'generated_at_utc':datetime.now(timezone.utc).isoformat()}
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in recs)+'\n',encoding='utf-8')
          lines=[f'# {COMPANY}（{CODE}）官方披露文件包','',f'- 截止日期：{CUTOFF}','- 年度报告：2020—2025年完整年度报告，共6份。','- 最新季度报告：2026年第三季度报告。','- 上市核心文件：换股吸收合并暨关联交易报告书（修订稿）及上市公告书。','- 说明：公司通过换股吸收合并东贝B股上市，不存在常规最终版IPO招股说明书。','- 来源：上海证券交易所、巨潮资讯网官方原始PDF。','- 已完成PDF结构、页数、首末页渲染、SHA-256及ZIP CRC校验。','','## 文件清单','']
          for i,r in enumerate(recs,1): lines += [f"{i}. `{r['relative_path']}`",f"   - 标题：{r['announcement_title']}",f"   - 日期：{r['announcement_date']}",f"   - 页数：{r['page_count']}；大小：{r['file_size_bytes']:,} 字节",f"   - 来源：{r['source_url']}",f"   - SHA-256：`{r['sha256']}`"]
          (ROOT/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          cn=DIST/f'{ROOT_NAME}.zip'; en=DIST/f'dongbei_group_601956_all_annual_reports_listing_documents_latest_quarter_{CUT}.zip'
          for p in (cn,en):
            if p.exists(): p.unlink()
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,str(p.relative_to(ROOT.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for p in (cn,en):
            with zipfile.ZipFile(p) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=9: raise RuntimeError(f'ZIP校验失败 {p}: {bad}, pdfs={len(pdfs)}')
          print('FINAL_JSON',json.dumps({'document_count':9,'annual_years':years,'latest_quarter':'2026Q3','chinese_zip':str(cn),'english_zip':str(en),'size':cn.stat().st_size,'sha256':hashlib.sha256(cn.read_bytes()).hexdigest(),'documents':[{k:r[k] for k in ('document_type','period','file_name','page_count')} for r in recs]},ensure_ascii=False))
          PY
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongbei-601956-official-filings-fast-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
