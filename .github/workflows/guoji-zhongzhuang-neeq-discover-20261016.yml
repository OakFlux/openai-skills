name: Discover Guoji Zhongzhuang NEEQ annual reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-discover-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query NEEQ disclosure archive
        run: |
          python - <<'PY'
          import json, re, requests
          from urllib.parse import urljoin

          urls=[
            'https://www.neeq.com.cn/disclosureInfoController/infoResult.do',
            'http://www.neeq.com.cn/disclosureInfoController/infoResult.do',
          ]
          headers={
            'User-Agent':'Mozilla/5.0',
            'Referer':'https://www.neeq.com.cn/disclosure/examine.html',
            'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
            'Accept':'*/*',
            'X-Requested-With':'XMLHttpRequest',
          }
          variants=[]
          for dtype in ['1','5','9']:
            for isnew in ['0','1','']:
              for page in ['0','1']:
                variants.append({
                  'disclosureType':dtype,'page':page,'companyCd':'400062',
                  'isNewThree':isnew,'startTime':'2015-01-01','endTime':'2020-12-31',
                  'keyword':'年度报告','xxfcbj':'1'
                })
          for endpoint in urls:
            print('\nENDPOINT',endpoint)
            for i,form in enumerate(variants,1):
              try:
                r=requests.post(endpoint,data=form,headers=headers,timeout=40,allow_redirects=True)
                text=r.text
                print('TRY',i,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(text),'FORM',form)
                print('HEAD',repr(text[:300]))
                if r.status_code!=200 or len(text)<10: continue
                clean=text.strip()
                # remove callback wrapper and trailing semicolon
                if clean.startswith('null('): clean=clean[5:-1]
                elif clean.startswith('jQuery') and '(' in clean: clean=clean[clean.find('(')+1:clean.rfind(')')]
                elif clean.endswith(';'): clean=clean[:-1]
                try:
                  obj=json.loads(clean)
                except Exception as exc:
                  print('JSONERR',repr(exc)); continue
                print('PARSED_TYPE',type(obj).__name__)
                blocks=obj if isinstance(obj,list) else [obj]
                for block in blocks:
                  if not isinstance(block,dict): continue
                  li=block.get('listInfo') or block.get('data') or block
                  rows=(li.get('content') if isinstance(li,dict) else None) or (li.get('list') if isinstance(li,dict) else None) or []
                  print('ROWS',len(rows))
                  for rec in rows:
                    title=str(rec.get('disclosureTitle') or rec.get('title') or rec.get('xxzrlx') or '')
                    if '年度报告' in title or '年报' in title:
                      print('HIT',json.dumps(rec,ensure_ascii=False,sort_keys=True))
              except Exception as exc:
                print('ERROR',i,repr(exc))
          PY
