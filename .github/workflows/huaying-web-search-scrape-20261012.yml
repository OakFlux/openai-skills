name: Scrape search engines for Huaying deep report PDFs 20261012

on:
  push:
    paths:
      - '.triggers/huaying-web-search-scrape-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Search Bing Baidu Sogou and inspect URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, urllib.parse, re, json, html
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          queries=[
            '"华丽转身，拐点将现" 华映科技',
            '"华丽转身,拐点将现" 华映科技',
            '"溢流玻璃和6代IGZO" 华映科技',
            '"打开新成长空间" 华映科技 财富证券',
            '"IGZO+OLED紧跟巨头步伐" 华映科技',
            '"3D玻璃有望爆发" 华映科技 方正证券',
            '华映科技 000536 深度报告 2016 pdf',
          ]
          engines=[
            ('bing','https://www.bing.com/search?q={q}&count=50'),
            ('baidu','https://www.baidu.com/s?wd={q}&rn=50'),
            ('sogou','https://www.sogou.com/web?query={q}&num=50'),
            ('so360','https://www.so.com/s?q={q}&pn=1'),
          ]
          for q in queries:
            for name,tpl in engines:
              u=tpl.format(q=urllib.parse.quote(q))
              try:
                r=s.get(u,timeout=(15,60),allow_redirects=True)
                print('SEARCH',name,q,r.status_code,len(r.content),r.url,flush=True)
                if r.status_code!=200 or len(r.content)<500: continue
                text=r.text; soup=BeautifulSoup(text,'lxml'); results=[]
                for a in soup.find_all('a',href=True):
                  href=a['href']; label=' '.join(a.get_text(' ',strip=True).split())
                  if href.startswith('//'): href='https:'+href
                  if href.startswith('/') and name=='bing': href=urllib.parse.urljoin(r.url,href)
                  # Extract redirect target query params when available.
                  try:
                    pu=urllib.parse.urlparse(href); qs=urllib.parse.parse_qs(pu.query)
                    for k in ('url','u','target','rurl'):
                      if k in qs and qs[k]: href=qs[k][0]
                  except Exception: pass
                  blob=(href+' '+label).lower()
                  if any(k in blob for k in ['华映','000536','igzo','拐点将现','3d玻璃','pdf','研报','report']):
                    results.append({'text':label[:300],'href':href})
                # Raw absolute URLs too.
                for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                  href=html.unescape(m.group(0)).replace('\\/','/').rstrip(');,]}')
                  blob=href.lower()
                  if any(k in blob for k in ['000536','pdf','report','研报']): results.append({'text':'RAW','href':href[:1000]})
                uniq=[]; seen=set()
                for x in results:
                  key=x['href']
                  if key not in seen:
                    seen.add(key); uniq.append(x)
                print('RESULTS',name,q,json.dumps(uniq[:120],ensure_ascii=False),flush=True)
              except Exception as e: print('ERR',name,q,repr(e),flush=True)
          PY
