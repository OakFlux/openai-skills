name: Oppein Annual Reports and Latest Quarter

on:
  push:
    branches:
      - chatgpt-oppein-filings-20261006
    paths:
      - scripts/build_oppein_filings_20261006.py
      - .github/workflows/oppein_filings_20261006.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_oppein_filings_20261006.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: oppein-filings-package
          path: |
            output/oppein_2020_2025_annual_reports_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
