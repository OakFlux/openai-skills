name: Build Haiyangwang broker deep-report package

on:
  push:
    branches: [tmp-haiyangwang-broker-reports-20261022]
    paths: ['.github/workflows/tmp-haiyangwang-broker-package-20261022.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='海洋王_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local expected_pages="$3"
            local broker_pattern="$4"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 7 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002724' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -eq "$expected_pages"

            pdftotext -f 1 -l "$pages" "$out" "$out.txt" 2>/dev/null
            grep -Eq '海洋王照明科技股份有限公司|海洋王' "$out.txt"
            grep -Eq "$broker_pattern" "$out.txt"
            rm -f "$out.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$out" "$out.last" >/dev/null 2>&1
            test -s "$out.first.png" && test -s "$out.last.png"
            rm -f "$out.first.png" "$out.last.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202203211553974454_1.pdf' \
            "$PACKAGE/01_太平洋证券_产品升级与智能布局市场潜力可观_深度报告_2022-03-21.pdf" \
            23 \
            '太平洋证券|太平洋'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201909111355225512_1.pdf' \
            "$PACKAGE/02_民生证券_国内特种照明领军企业差异化发展典范_深度报告_2019-09-11.pdf" \
            22 \
            '民生证券|MINSHENG SECURITIES|民生'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201908291345289107_1.pdf' \
            "$PACKAGE/03_上海证券_产业景气持续上行互联网加打开空间_深度报告_2019-08-29.pdf" \
            20 \
            '上海证券|SHANGHAI SECURITIES'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('海洋王_券商深度报告_3份')
          meta = {
              '01_太平洋证券_产品升级与智能布局市场潜力可观_深度报告_2022-03-21.pdf': {
                  'broker': '太平洋证券',
                  'date': '2022-03-21',
                  'title': '产品升级与智能布局，市场潜力可观',
                  'type': '公司深度报告',
                  'index': 'AP202203211553974454',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202203211553974454_1.pdf',
              },
              '02_民生证券_国内特种照明领军企业差异化发展典范_深度报告_2019-09-11.pdf': {
                  'broker': '民生证券',
                  'date': '2019-09-11',
                  'title': '国内特种照明领军企业，差异化发展典范',
                  'type': '公司深度报告',
                  'index': 'AP201909111355225512',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201909111355225512_1.pdf',
              },
              '03_上海证券_产业景气持续上行互联网加打开空间_深度报告_2019-08-29.pdf': {
                  'broker': '上海证券',
                  'date': '2019-08-29',
                  'title': '产业景气持续上行，“互联网+”打开空间',
                  'type': '公司深度报告',
                  'index': 'AP201908291345289107',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201908291345289107_1.pdf',
              },
          }
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '海洋王（002724）券商深度报告资料包',
              '整理日期：2026-10-22',
              '',
              '收录原则：',
              '1. 收录公开可直接下载的长篇公司深度或系统性公司研究报告。',
              '2. 排除短篇财报点评、事件点评、网页摘要和非券商材料。',
              '3. 三份文件均为券商原始PDF，页数分别为23页、22页和20页。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  PDF来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、精确页数、正文公司名称、券商名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Haiyangwang-002724-broker-deep-reports-3
          path: 海洋王_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
