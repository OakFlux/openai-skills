name: Find Loongson final prospectus mirror

on:
  push:
    paths:
      - '.github/workflows/find-loongson-final-prospectus-mirror-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query Eastmoney Sina CFI and public search indexes
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, traceback
          from pathlib import Path
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup

          out=Path('loongson_prospectus_mirror'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          exact='龙芯中科首次公开发行股票并在科创板上市招股说明书'

          def save(name,r):
            out.joinpath(name+'.body').write_bytes(r.content)
            out.joinpath(name+'.meta.json').write_text(json.dumps({'status':r.status_code,'url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'history':[{'status':h.status_code,'url':h.url} for h in r.history]},ensure_ascii=False,indent=2),encoding='utf-8')

          # Eastmoney announcement API, paging until 2022.
          east_rows=[]
          for page in range(1,11):
            params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':'688047'}
            try:
              r=s.get('https://np-anotice-stock.eastmoney.com/api/security/ann',params=params,headers={'Referer':'https://data.eastmoney.com/notices/stock/688047.html','User-Agent':s.headers['User-Agent']},timeout=30)
              save(f'eastmoney_api_{page}',r)
              print('EAST',page,r.status_code,len(r.content),r.url,flush=True)
              data=r.json()
              rows=((data.get('data') or {}).get('list') or data.get('list') or []) if isinstance(data,dict) else []
              if not rows: break
              east_rows.extend(rows)
              for row in rows:
                title=str(row.get('title') or row.get('announcement_title') or row.get('notice_title') or '')
                if exact in title or ('招股说明书' in title and '龙芯中科' in title):
                  print('EAST_MATCH',json.dumps(row,ensure_ascii=False),flush=True)
              dates=[str(x.get('notice_date') or x.get('announcement_date') or x.get('display_time') or '') for x in rows]
              if any(d.startswith('2022') for d in dates):
                pass
            except Exception as e: print('EAST_ERROR',page,repr(e),flush=True)
          out.joinpath('east_rows.json').write_text(json.dumps(east_rows,ensure_ascii=False,indent=2),encoding='utf-8')

          # Sina prospectus listing and detail links.
          for i,u in enumerate([
            'https://money.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688047.phtml',
            'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688047.phtml',
            'http://money.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688047.phtml',
          ],1):
            try:
              r=s.get(u,timeout=30); save(f'sina_{i}',r)
              enc=r.apparent_encoding or 'gb18030'; text=r.content.decode(enc,'replace'); soup=BeautifulSoup(text,'lxml')
              print('SINA',i,r.status_code,len(r.content),r.url,'ENC',enc,flush=True)
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
                if '招股说明书' in label or '2022-06-21' in label or 'RaiseExplanation' in href:
                  print('SINA_LINK',json.dumps({'label':label,'href':href},ensure_ascii=False),flush=True)
            except Exception as e: print('SINA_ERROR',i,repr(e),flush=True)

          # CFI announcement index.
          for i,u in enumerate([
            'https://quoteimg.cfi.cn/cbgg/157232/688047.html',
            'http://quoteimg.cfi.cn/cbgg/157232/688047.html',
          ],1):
            try:
              r=s.get(u,timeout=30); save(f'cfi_{i}',r)
              enc=r.apparent_encoding or 'gb18030'; text=r.content.decode(enc,'replace'); soup=BeautifulSoup(text,'lxml')
              print('CFI',i,r.status_code,len(r.content),r.url,'ENC',enc,flush=True)
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
                if '招股说明书' in label or '688047' in href or '.pdf' in href.lower():
                  print('CFI_LINK',json.dumps({'label':label,'href':href},ensure_ascii=False),flush=True)
            except Exception as e: print('CFI_ERROR',i,repr(e),flush=True)

          # Search engines for exact title and direct PDF URLs.
          queries=[f'"{exact}" pdf',f'"688047_20220621_1_Et2DxLXX.pdf"',f'"{exact}" 下载']
          for qi,q in enumerate(queries,1):
            for engine,url,params in [
              ('bing','https://www.bing.com/search',{'q':q,'count':'50'}),
              ('so360','https://www.so.com/s',{'q':q}),
            ]:
              try:
                r=s.get(url,params=params,timeout=30); save(f'{engine}_{qi}',r)
                text=r.content.decode(r.apparent_encoding or 'utf-8','replace'); soup=BeautifulSoup(text,'lxml')
                print('SEARCH',engine,qi,r.status_code,len(r.content),r.url,flush=True)
                for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
                  joined=label+' '+href
                  if ('龙芯中科' in joined and '招股' in joined) or '.pdf' in href.lower() or 'Et2DxLXX' in href:
                    print('SEARCH_LINK',engine,qi,json.dumps({'label':label[:500],'href':href},ensure_ascii=False),flush=True)
              except Exception as e: print('SEARCH_ERROR',engine,qi,repr(e),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: loongson-final-prospectus-mirror-search-20261015
          path: loongson_prospectus_mirror
          retention-days: 7
          compression-level: 6