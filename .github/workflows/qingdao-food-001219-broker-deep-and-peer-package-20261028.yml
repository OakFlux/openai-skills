name: Package Qingdao Food 001219 broker deep and peer reports 20261028

on:
  push:
    paths:
      - '.github/workflows/qingdao-food-001219-broker-deep-and-peer-package-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          TODAY='2026-10-28'
          CODE='001219'
          COMPANY='青岛食品'
          FULL='青岛食品股份有限公司'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART):
              d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'category':'青岛食品公司专属深度报告','broker':'民生证券','date':'2021-10-25',
              'title':'深度报告：青食饼干深耕区域70年，全国扩张正当时',
              'source_url':'https://pdf.dfcfw.com/pdf/H3_AP202110251524861475_1.pdf',
              'report_page':'https://data.eastmoney.com/report/info/AP202110251524861475.html',
              'expected_pages':27,
              'identity_tokens':['青岛食品','001219','青食'],
              'broker_tokens':['民生证券','民生证券研究院'],
              'theme_tokens':['钙奶饼干','全国扩张','渠道','产能'],
              'filename':'01_2021-10-25_民生证券_青岛食品深度_青食饼干深耕区域70年_全国扩张正当时.pdf'
            },
            {
              'order':2,'category':'高度相关行业深度报告','broker':'中泰证券','date':'2024-08-12',
              'title':'休闲零食行业深度报告：解码小零食的大单品之路——从奥利奥说起',
              'source_url':'https://zsxdxw.com/static/upload/file/20241031/1730357601100561.pdf',
              'report_page':'https://zsxdxw.com/static/upload/file/20241031/1730357601100561.pdf',
              'expected_pages':26,
              'identity_tokens':['休闲零食','奥利奥','大单品'],
              'broker_tokens':['中泰证券','zts.com.cn','S074'],
              'theme_tokens':['饼干','品牌','渠道','产品设计'],
              'filename':'02_2024-08-12_中泰证券_休闲零食行业深度_解码小零食的大单品之路_从奥利奥说起.pdf'
            },
            {
              'order':3,'category':'高度相关烘焙同业深度报告','broker':'东兴证券','date':'2020-05-15',
              'title':'桃李面包：重剑无锋，全国化扩张稳步推进',
              'source_url':'https://pdf.dfcfw.com/pdf/H3_AP202005181379879440_1.pdf',
              'report_page':'https://data.eastmoney.com/report/info/AP202005181379879440.html',
              'expected_pages':32,
              'identity_tokens':['桃李面包','603866'],
              'broker_tokens':['东兴证券','DONGXING SECURITIES'],
              'theme_tokens':['烘焙','全国化','渠道','产能'],
              'filename':'03_2020-05-15_东兴证券_桃李面包深度_重剑无锋_全国化扩张稳步推进.pdf'
            },
          ]

          candidates=[
            {'stock_code':'001219','stock_name':'青岛食品','publish_date':'2021-10-25','pages':27,'broker':'民生证券','title':'深度报告：青食饼干深耕区域70年，全国扩张正当时','info_code':'AP202110251524861475','selected':True,'category':'公司专属深度'},
            {'stock_code':'001219','stock_name':'青岛食品','publish_date':'2021-09-24','pages':3,'broker':'国元证券','title':'青岛食品新股网下询价策略','info_code':'AP202109241518253784','selected':False,'reason':'仅3页的新股询价策略，不属于公司深度报告'},
            {'publish_date':'2024-08-12','pages':26,'broker':'中泰证券','title':'休闲零食行业深度报告：解码小零食的大单品之路——从奥利奥说起','selected':True,'category':'行业补充'},
            {'publish_date':'2020-05-15','pages':32,'broker':'东兴证券','title':'桃李面包：重剑无锋，全国化扩张稳步推进','selected':True,'category':'同业补充'},
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept':'application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download(item):
            last={}
            urls=[item['source_url']]
            if 'pdf.dfcfw.com' in item['source_url']:
              base=item['source_url']
              for old,new in [('H3_','H2_'),('H3_','H1_'),('H3_','H4_')]:
                u=base.replace(old,new)
                if u not in urls: urls.append(u)
            for url in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(url,headers={'User-Agent':session.headers['User-Agent'],'Referer':item['report_page'],'Accept':'application/pdf,*/*;q=0.8'},timeout=(30,420),allow_redirects=True)
                  last={'requested_url':url,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100000:
                    return r.content,str(r.url),last
                except Exception as exc:
                  last={'requested_url':url,'error':repr(exc)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed: {item["title"]}: {last}')

          manifest=[]
          for item in reports:
            data,resolved_url,download_meta=download(item)
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<12 or abs(pages-item['expected_pages'])>2:
              raise RuntimeError(f'Unexpected page count: {dest.name}: actual={pages}, expected={item["expected_pages"]}')

            txt=RENDER/f'{item["order"]:02d}_full.txt'
            subprocess.run(['pdftotext',str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            text=txt.read_text(encoding='utf-8',errors='ignore')
            identity_ok=any(token in text for token in item['identity_tokens'])
            broker_ok=any(token in text for token in item['broker_tokens'])
            theme_hits={token:(token in text) for token in item['theme_tokens']}
            theme_ok=sum(theme_hits.values())>=2
            if not identity_ok: raise RuntimeError(f'Identity/theme subject check failed: {dest.name}')
            if not broker_ok: raise RuntimeError(f'Broker check failed: {dest.name}')
            if not theme_ok: raise RuntimeError(f'Relevance check failed: {dest.name}: {theme_hits}')

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0: raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'
            last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8000: raise RuntimeError(f'First-page render failed: {dest.name}')
            if not last_png.exists() or last_png.stat().st_size<3000: raise RuntimeError(f'Last-page render failed: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'category':item['category'],'broker':item['broker'],'publish_date':item['date'],'title':item['title'],
              'pages':pages,'bytes':len(data),'sha256':sha,'source_url':resolved_url,'report_page':item['report_page'],
              'filename':item['filename'],'identity_check':identity_ok,'broker_check':broker_ok,'relevance_hits':theme_hits,
              'validation':['PDF header','subject identity','broker identity','relevance keywords','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })

          if len(manifest)!=3 or len({m['sha256'] for m in manifest})!=3:
            raise RuntimeError('Report count or duplicate check failed')

          readme=[
            '青岛食品（001219.SZ）券商深度及行业对标报告资料包',
            f'整理日期：{TODAY}','',
            '重要说明：公开券商研报数据库中仅检索到1份青岛食品公司专属长篇深度报告。为满足2—3份资料需求，本包另补充1份与饼干大单品高度相关的休闲零食行业深度报告，以及1份全国化烘焙龙头同业深度报告。',
            '补充报告仅用于行业、品牌、渠道、产能和全国化扩张逻辑对照，不代表券商对青岛食品本身的评级或盈利预测。',
            '已排除3页的新股网下询价策略、网页摘要、缺页预览、非券商材料及短篇业绩点评。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   分类：{m["category"]}',
              f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   PDF来源：{m["source_url"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '核验说明：每份PDF均已检查文件头、研究主体、券商身份、相关主题关键词、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
            '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'青岛食品研报检索与补充候选清单.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'青岛食品_001219_券商深度及行业对标报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha,flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: qingdao-food-001219-broker-deep-and-peer-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
