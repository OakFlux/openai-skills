name: Temporary Inspect Sina Jiuding Reports

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect Sina report list and report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import requests
          from urllib.parse import urljoin

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://stock.finance.sina.com.cn/',
          })

          def decode(response):
              raw = response.content
              for enc in ('gb18030', 'gbk', 'utf-8'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='ignore')

          list_url = 'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz002201&t1=all'
          r = session.get(list_url, timeout=60)
          r.raise_for_status()
          text = html.unescape(decode(r)).replace('\\/', '/')
          print('LIST_BYTES', len(r.content))

          links = []
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, flags=re.I | re.S):
              href = urljoin(list_url, m.group(1))
              title = re.sub(r'<[^>]+>', ' ', m.group(2))
              title = re.sub(r'\s+', ' ', html.unescape(title)).strip()
              if 'vReport_Show' in href:
                  rpt = re.search(r'/rptid/(\d+)/', href)
                  links.append((title, href, rpt.group(1) if rpt else ''))

          for title, href, rptid in links:
              print('REPORT_LINK', rptid, title, href)

          targets = [
              item for item in links
              if any(k in item[0] for k in ['调研深度报告', '多维拓展积极迈进', '新股研究报告', '新股询价定价分析', '新股分析：玻纤深加工行业龙头'])
          ]
          print('TARGETS', len(targets))

          for title, href, rptid in targets:
              rr = session.get(href, timeout=60)
              rr.raise_for_status()
              page = html.unescape(decode(rr)).replace('\\/', '/')
              visible = re.sub(r'<script\b[^>]*>.*?</script>', ' ', page, flags=re.I | re.S)
              visible = re.sub(r'<style\b[^>]*>.*?</style>', ' ', visible, flags=re.I | re.S)
              visible = re.sub(r'<[^>]+>', ' ', visible)
              visible = re.sub(r'\s+', ' ', visible).strip()
              print('\nTARGET', rptid, title, 'BYTES', len(rr.content), 'VISIBLE', len(visible))
              print('VISIBLE_HEAD', visible[:1000])
              urls = []
              for pattern in [
                  r'https?://[^\s"\'<>]+',
                  r'(?:href|src)=["\']([^"\']+)["\']',
              ]:
                  for value in re.findall(pattern, page, flags=re.I):
                      if isinstance(value, tuple):
                          value = value[0]
                      u = urljoin(href, value)
                      if any(k in u.lower() for k in ['.pdf', '.doc', 'download', 'down', 'file', 'attach']):
                          if u not in urls:
                              urls.append(u)
              print('ASSET_URLS', urls[:50])
          PY
