name: Run Jishi Media broker research package 20261012

on:
  push:
    paths:
      - '.github/workflows/jishi-media-broker-research-run-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Extract and run package builder
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='.github/workflows/jishi-media-broker-research-package-20261012.yml'
          sed -n "/python - <<'PY'/,/^          PY$/p" "$SOURCE" | sed '1d;$d;s/^          //' > /tmp/build_jishi_media_reports.py
          python -m py_compile /tmp/build_jishi_media_reports.py
          python /tmp/build_jishi_media_reports.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: jishi-media-601929-broker-research-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: jishi-media-601929-broker-research-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
