name: List COSL relevant HKEX records 20260922
on:
  push:
    paths:
      - '.github/workflows/cosl-hkex-relevant-records-20260922.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: List relevant records
        run: |
          python - <<'PY'
          import requests,json,re,html
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=4651&lang=EN'})
          base='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          for lang in ('E','zh'):
              p={'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'4651','documentType':'-1','fromDate':'19990401','toDate':'20260922','title':'','searchType':'0','t1code':'-2','t2Gcode':'-2','t2code':'-2','rowRange':'2500','lang':lang}
              d=s.get(base,params=p,timeout=180).json(); rows=json.loads(d['result'])
              print('\n===LANG',lang,'COUNT',len(rows),flush=True)
              groups={'ANNUAL':[],'PROSPECTUS':[],'LATEST_PERIODIC':[]}
              for x in rows:
                  title=html.unescape(x.get('TITLE','')).strip()
                  long=html.unescape(x.get('LONG_TEXT','')).strip()
                  short=html.unescape(x.get('SHORT_TEXT','')).strip()
                  hay=(title+' '+long+' '+short).lower()
                  year=int(x.get('DATE_TIME','00/00/0000')[6:10]) if len(x.get('DATE_TIME',''))>=10 else 0
                  is_annual = ('annual report' in title.lower() or '年報' in title or '年度報告' in title) and not any(k in hay for k in ('results','業績','summary','摘要','environmental','social','esg','sustainability','可持續','社会责任','社會責任'))
                  is_prosp = any(k in hay for k in ('prospectus','global offering','listing document','招股','全球發售','上市文件','首次公开发行','首次公開發行'))
                  is_periodic = (year>=2025 and any(k in hay for k in ('quarterly report','季度報告','interim report','中期報告','半年度報告','half-year report')) and not any(k in hay for k in ('results announcement','業績公告','results','业绩','業績')))
                  if is_annual: groups['ANNUAL'].append(x)
                  if is_prosp: groups['PROSPECTUS'].append(x)
                  if is_periodic: groups['LATEST_PERIODIC'].append(x)
              for g,items in groups.items():
                  print('\n--',g,len(items),flush=True)
                  for x in items:
                      print(json.dumps({k:x.get(k) for k in ('DATE_TIME','TITLE','LONG_TEXT','FILE_TYPE','FILE_INFO','FILE_LINK','DOD_WEB_PATH','NEWS_ID')},ensure_ascii=False,separators=(',',':')),flush=True)
          PY