name: Probe ranged recovery of HUTCHMED legacy PDF

on:
  push:
    paths:
      - '.github/workflows/hutchmed-wayback-range-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Test ranges
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://web.archive.org/web/20081120205305id_/http://www.chi-med.com/eng/irinfo/reports/2006ar/01.pdf'
          for SPEC in '0-65535' '65536-131071' '131072-196607' '900000-965535'; do
            SAFE=${SPEC//-/_}
            curl --location --fail --silent --show-error --http1.1 --ignore-content-length \
              --range "$SPEC" --dump-header "headers_${SAFE}.txt" --output "chunk_${SAFE}.bin" "$URL" || true
            echo "=== $SPEC ==="
            cat "headers_${SAFE}.txt" || true
            wc -c "chunk_${SAFE}.bin" || true
            head -c 16 "chunk_${SAFE}.bin" | xxd || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-wayback-range-probe
          path: |
            headers_*.txt
            chunk_*.bin
          if-no-files-found: warn
          retention-days: 7
