name: Inspect public CR BMT report links
on:
  push:
    branches: [tmp-cr-bmt-sgpjbg-probe-20260906]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public page links
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://www.sgpjbg.com/labels/huarunjiancaikejiesgbaogao.html'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
          print('STATUS',r.status_code,'SIZE',len(r.content),'FINAL',r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          for a in soup.find_all('a',href=True):
              text=a.get_text(' ',strip=True)
              href=urljoin(r.url,a['href'])
              if '华润建材科技' in text or '250510' in text or '240919' in text:
                  print('LINK',text,'|',href)
          PY
