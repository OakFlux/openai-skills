name: Build Tudatong 02665 broker report package 20260926

on:
  push:
    paths:
      - '.github/workflows/tudatong-02665-broker-reports-package-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download public report preview pages and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, time, zipfile, subprocess
          from io import BytesIO
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '图达通_02665_券商深度报告_公开预览版_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)
          work = Path('_work')
          work.mkdir(exist_ok=True)

          reports = [
              {
                  'report_id': '5371458',
                  'broker': '国盛证券',
                  'title': '图达通：聚焦激光雷达双路线布局，车端爆发及多元场景打开成长空间',
                  'date': '2026-04-23',
                  'analysts': '丁逸朦、刘晓恬',
                  'rating': '买入（首次）',
                  'original_pages': 21,
                  'source_page': 'https://www.fxbaogao.com/detail/5371458',
                  'filename': '01_国盛证券_图达通_聚焦激光雷达双路线布局车端爆发及多元场景打开成长空间_公开预览版_2026-04-23.pdf',
              },
              {
                  'report_id': '5511320',
                  'broker': '西部证券',
                  'title': '图达通：聚焦1550&905nm路线，车端拓客及多元应用驱动增长',
                  'date': '2026-06-29',
                  'analysts': '齐天翔',
                  'rating': '买入（首次）',
                  'original_pages': 22,
                  'source_page': 'https://www.fxbaogao.com/detail/5511320',
                  'filename': '02_西部证券_图达通_聚焦1550及905nm路线车端拓客及多元应用驱动增长_公开预览版_2026-06-29.pdf',
              },
              {
                  'report_id': '5701990',
                  'broker': '西部证券',
                  'title': '图达通2026年中报跟踪点评：26H1亏损同比收窄，全年销量维持200%增速指引',
                  'date': '2026-09-15',
                  'analysts': '齐天翔',
                  'rating': '买入（维持）',
                  'original_pages': 3,
                  'source_page': 'https://www.fxbaogao.com/detail/5701990',
                  'filename': '03_西部证券_图达通_2026年中报跟踪点评_公开预览版_2026-09-15.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.fxbaogao.com/',
          })

          def get_json(url: str) -> dict:
              last = None
              for attempt in range(5):
                  try:
                      r = session.get(url, timeout=(20, 90), allow_redirects=True)
                      last = (r.status_code, len(r.content), r.headers.get('content-type'))
                      if r.status_code == 200:
                          return r.json()
                  except Exception as exc:
                      last = repr(exc)
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Failed JSON {url}: {last}')

          def get_image(url: str) -> bytes:
              last = None
              for attempt in range(5):
                  try:
                      r = session.get(url, timeout=(20, 90), allow_redirects=True)
                      last = (r.status_code, len(r.content), r.headers.get('content-type'))
                      if r.status_code == 200 and len(r.content) > 20_000:
                          with Image.open(BytesIO(r.content)) as im:
                              im.verify()
                          return r.content
                  except Exception as exc:
                      last = repr(exc)
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Failed image {url}: {last}')

          manifest = []
          for idx, rec in enumerate(reports, 1):
              api = f"https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId={rec['report_id']}"
              payload = get_json(api)
              rel_urls = payload.get('data') or []
              if not rel_urls:
                  raise RuntimeError(f"No public preview pages returned for report {rec['report_id']}: {payload}")

              wdir = work / rec['report_id']
              wdir.mkdir(exist_ok=True)
              image_paths = []
              full_urls = []
              for page_no, rel in enumerate(rel_urls, 1):
                  url = rel if str(rel).startswith('http') else 'https://public.fxbaogao.com/' + str(rel).lstrip('/')
                  data = get_image(url)
                  ip = wdir / f'{page_no:02d}.png'
                  ip.write_bytes(data)
                  with Image.open(ip) as im:
                      im.verify()
                  image_paths.append(ip)
                  full_urls.append(url)

              out_pdf = root / rec['filename']
              opened = []
              try:
                  for ip in image_paths:
                      opened.append(Image.open(ip).convert('RGB'))
                  opened[0].save(out_pdf, save_all=True, append_images=opened[1:], resolution=150.0, quality=95)
              finally:
                  for im in opened:
                      im.close()

              reader = PdfReader(str(out_pdf), strict=False)
              page_count = len(reader.pages)
              if page_count != len(image_paths):
                  raise RuntimeError(f'PDF page mismatch for {out_pdf.name}: {page_count} vs {len(image_paths)}')
              subprocess.run(['qpdf', '--check', str(out_pdf)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)

              render_prefix = preview_dir / out_pdf.stem
              subprocess.run([
                  'pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '130', '-singlefile',
                  str(out_pdf), str(render_prefix)
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              rendered = Path(str(render_prefix) + '.png')
              if not rendered.exists() or rendered.stat().st_size < 20_000:
                  raise RuntimeError(f'Render verification failed for {out_pdf.name}')

              sha = hashlib.sha256(out_pdf.read_bytes()).hexdigest()
              manifest.append({
                  **rec,
                  'public_preview_pages': len(image_paths),
                  'preview_image_urls': full_urls,
                  'pdf_file': out_pdf.name,
                  'actual_pdf_pages': page_count,
                  'bytes': out_pdf.stat().st_size,
                  'sha256': sha,
                  'first_page_render': str(Path('首页预览') / rendered.name),
                  'validation': ['public preview API', 'image integrity', 'PDF page count', 'qpdf structure', 'first-page render'],
              })

          lines = [
              '图达通（02665.HK）券商深度报告公开预览资料包',
              '整理日期：2026-09-26',
              '',
              '本包收录2份公司首次覆盖深度报告及1份最新中报跟踪点评。',
              '报告平台公开接口仅提供部分预览原页；完整券商PDF需登录或具备相应访问权限。',
              '本包没有绕过登录、会员或付费限制，所有PDF文件名均明确标注“公开预览版”。',
              '',
              '文件清单：',
          ]
          for i, item in enumerate(manifest, 1):
              lines += [
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；评级：{item['rating']}；分析师：{item['analysts']}",
                  f"   原报告：{item['original_pages']}页；本PDF：{item['public_preview_pages']}页公开原始预览页面",
                  f"   来源页面：{item['source_page']}",
                  f"   PDF文件：{item['pdf_file']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          lines += [
              '版权及使用说明：报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '完整性检查：预览接口返回、图片完整性、PDF页数、qpdf结构、首页渲染和ZIP CRC。',
          ]
          (root / '00_文件清单与说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['pdf_file']}\n" for item in manifest),
              encoding='utf-8'
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      zf.write(p, arcname=f'{PACKAGE}/{p.relative_to(root)}')

          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'Expected 3 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tudatong-02665-broker-reports-public-preview-final
          path: 图达通_02665_券商深度报告_公开预览版_3份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
