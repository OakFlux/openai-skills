name: Export SGPJBG assets for Sanwei reports 20261014

on:
  push:
    branches:
      - tmp-sanwei-chemical-research-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - env:
          PYTHONUTF8: "1"
        run: python tmp/export_sgpjbg_assets_20261014.py
      - uses: actions/upload-artifact@v4
        with:
          name: sgpjbg-sanwei-viewer-assets
          path: sgpjbg_assets/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
