name: Probe Sina PDF links for Jiangshun reports 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jiangshun-sina-pdf-probe-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect Sina pages and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          from bs4 import BeautifulSoup

          ids=['835535580194','845882738979']
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://finance.sina.com.cn/'}
          all_urls=[]
          for rid in ids:
            urls=[
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/{rid}/index.phtml',
              f'http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/{rid}/index.phtml',
              f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/company/rptid/{rid}/index.phtml',
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml',
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Down/kind/company/rptid/{rid}/index.phtml',
              f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Down/kind/company/rptid/{rid}/index.phtml',
            ]
            for u in urls:
              print('\nPAGE',u)
              try:
                r=s.get(u,headers=h,timeout=(20,120),allow_redirects=True)
                print('STATUS',r.status_code,'LEN',len(r.content),'CT',r.headers.get('content-type'),'FINAL',r.url,'ENC',r.encoding,'APPARENT',r.apparent_encoding)
                # Try common encodings and pick the one containing expected Chinese text.
                decodings=[]
                for enc in [r.encoding,r.apparent_encoding,'gb18030','gbk','utf-8']:
                  if not enc or enc in [x[0] for x in decodings]:continue
                  try:decodings.append((enc,r.content.decode(enc,errors='replace')))
                  except Exception:pass
                text=max(decodings,key=lambda x:(('江顺科技' in x[1])*1000+('研报' in x[1])*100+len(x[1])))[1] if decodings else r.text
                print('TEXT_PREFIX',repr(text[:500]))
                soup=BeautifulSoup(text,'lxml')
                links=[]
                for tag in soup.find_all(True):
                  for attr in ['href','src','data-src','data-url','data-file','data-pdf','content','action']:
                    v=tag.get(attr)
                    if v:
                      x=urllib.parse.urljoin(r.url,html.unescape(str(v)))
                      links.append({'tag':tag.name,'attr':attr,'url':x,'text':tag.get_text(' ',strip=True)[:200]})
                for m in re.findall(r'https?://[^\s"\'<>]+',text):
                  links.append({'tag':'regex','attr':'url','url':html.unescape(m),'text':''})
                for m in re.findall(r'["\']([^"\']*(?:\.pdf(?:\?[^"\']*)?|download|vReport_Down|rptid|file\.finance)[^"\']*)["\']',text,re.I):
                  links.append({'tag':'regex2','attr':'candidate','url':urllib.parse.urljoin(r.url,html.unescape(m)),'text':''})
                uniq=[];seen=set()
                for x in links:
                  key=x['url']
                  if key not in seen:seen.add(key);uniq.append(x)
                interesting=[x for x in uniq if any(k in x['url'].lower() for k in ['.pdf','download','vreport_down','rptid','file.finance','report']) or any(k in x['text'] for k in ['下载','PDF','原文','报告'])]
                print('INTERESTING',json.dumps(interesting[:500],ensure_ascii=False,indent=2))
                for x in interesting:all_urls.append(x['url'])
                for i,line in enumerate(text.splitlines(),1):
                  low=line.lower()
                  if any(k in low for k in ['.pdf','download','vreport_down','file.finance','rptid','原文','下载']):
                    if len(line)<10000:print('LINE',i,line[:9500])
              except Exception as e:print('PAGEERR',repr(e))

          print('\nFETCH_CANDIDATES')
          seen=set()
          for u in all_urls:
            if u in seen:continue
            seen.add(u)
            if not any(k in u.lower() for k in ['.pdf','download','vreport_down','file.finance']):continue
            try:
              r=s.get(u,headers=h,timeout=(15,90),allow_redirects=True)
              print('FETCH',r.status_code,len(r.content),r.headers.get('content-type'),r.url,repr(r.content[:32]),u)
            except Exception as e:print('FETCHERR',u,repr(e))
          PY
