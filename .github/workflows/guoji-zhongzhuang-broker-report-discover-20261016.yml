name: Discover Guoji Zhongzhuang broker research reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-broker-report-discover-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query Eastmoney report API and inspect public report pages
        run: |
          python - <<'PY'
          import json, re, requests
          from urllib.parse import urljoin
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          params={
            'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
            'beginTime':'2017-01-01','endTime':'2026-10-16','pageNo':'1','fields':'','qType':'0',
            'orgCode':'','code':'601399','rcode':'','p':'1','pageNum':'1','pageNumber':'1',
          }
          for endpoint in ['https://reportapi.eastmoney.com/report/list','https://reportapi.eastmoney.com/report/list2']:
            try:
              r=s.get(endpoint,params=params,timeout=40)
              print('\nENDPOINT',endpoint,'STATUS',r.status_code,'URL',r.url,'LEN',len(r.content))
              raw=r.text.strip()
              print('HEAD',repr(raw[:300]))
              if raw.startswith('datatable') and '(' in raw:
                raw=raw[raw.find('(')+1:raw.rfind(')')]
              obj=json.loads(raw)
              data=obj.get('data') or []
              print('HITS',obj.get('hits'),'SIZE',obj.get('size'),'COUNT',len(data))
              for i,rec in enumerate(data):
                keep={k:rec.get(k) for k in ['infoCode','title','orgSName','orgName','researcher','publishDate','emRatingName','ratingName','attachPages','attachSize','reportType','stockCode','stockName','indvInduName']}
                print('REPORT',i,json.dumps(keep,ensure_ascii=False,sort_keys=True))
            except Exception as e:
              print('API_ERR',endpoint,repr(e))

          pages=[
            'https://www.sdyanbao.com/detail/939613',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/810211900971/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh601399',
          ]
          for u in pages:
            try:
              r=s.get(u,timeout=40,allow_redirects=True)
              print('\nPAGE',u,r.status_code,r.url,len(r.content),r.headers.get('content-type'))
              text=r.content.decode(r.encoding or 'utf-8',errors='replace')
              for m in re.finditer(r'''(?:href|src)=["']([^"']+)["']''',text,re.I):
                href=urljoin(r.url,m.group(1))
                low=href.lower()
                if any(x in low for x in ['.pdf','download','down','report']) or '939613' in low or '810211900971' in low:
                  print('LINK',href)
              for pat in ['pdf.dfcfw.com','infoCode','download','pdfUrl','report_url','reportUrl']:
                pos=0
                while True:
                  pos=text.find(pat,pos)
                  if pos<0: break
                  print('CTX',pat,repr(text[max(0,pos-400):pos+900]))
                  pos += len(pat)
            except Exception as e:
              print('PAGE_ERR',u,repr(e))
          PY
