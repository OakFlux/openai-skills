name: Temporary Daan Gene public PDF metasearch

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-metasearch.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Search multiple engines and inspect result URLs
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from urllib.parse import quote_plus, unquote, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup

          queries=[
            '"分子诊断行业待爆发，龙头达安笑傲江湖"',
            '"分子诊断行业待爆发" "达安基因"',
            '"达安基因" "上半年业绩超预期，公司发展迎里程碑拐点"',
            '"达安基因" "后疫情时代新冠筛查从严，下半年业绩持续受益"',
            '"达安基因" "三季度业绩超预期，产能扩建有望延续新冠优势"',
            '"达安基因" filetype:pdf 2020 国海证券',
            '"达安基因" filetype:pdf 2016 深度报告',
          ]
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'}
          s=requests.Session(); s.headers.update(headers)
          endpoints=[
            ('bing',lambda q:f'https://www.bing.com/search?q={quote_plus(q)}&count=50&setlang=zh-hans'),
            ('baidu',lambda q:f'https://www.baidu.com/s?wd={quote_plus(q)}&rn=50'),
            ('duckduckgo',lambda q:f'https://html.duckduckgo.com/html/?q={quote_plus(q)}'),
            ('sogou',lambda q:f'https://www.sogou.com/web?query={quote_plus(q)}&num=50'),
            ('360',lambda q:f'https://www.so.com/s?q={quote_plus(q)}'),
          ]
          all_links=[]
          for q in queries:
            print('\n### QUERY',q)
            for engine,make_url in endpoints:
              url=make_url(q)
              try:
                r=s.get(url,timeout=45,allow_redirects=True)
              except Exception as e:
                print('ENGINE_ERROR',engine,repr(e)); continue
              print('ENGINE',engine,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'))
              text=r.content.decode(r.encoding or 'utf-8','replace')
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                href=html.unescape(a['href'])
                label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))[:500]
                actual=href
                if engine=='duckduckgo' and 'uddg=' in href:
                  try: actual=unquote(parse_qs(urlparse(href).query).get('uddg',[''])[0])
                  except Exception: pass
                # Bing redirects can have u=a1...; keep both URL and label.
                if actual.startswith('http'):
                  blob=(actual+' '+label).lower()
                  if any(k in blob for k in ['达安','002030','分子诊断行业待爆发','里程碑拐点','后疫情时代新冠筛查','产能扩建','pdf','nxny','yanbao','report','fxbaogao','sgpjbg','hibor','microbell','51pdf','ulapia']):
                    rec={'query':q,'engine':engine,'label':label,'href':actual}
                    if rec not in links: links.append(rec)
              # Regex URL fallback.
              decoded=html.unescape(text).replace('\\/','/')
              for raw in re.findall(r'https?://[^"\'<>\s]+',decoded,re.I):
                if any(k in raw.lower() for k in ['pdf','yanbao','report','nxny','fxbaogao','sgpjbg','hibor','51pdf','ulapia','microbell']):
                  rec={'query':q,'engine':engine,'label':'regex','href':raw[:2000]}
                  if rec not in links: links.append(rec)
              print('RESULTS',json.dumps(links[:100],ensure_ascii=False))
              all_links.extend(links)
              time.sleep(.5)
          unique=[]; seen=set()
          for rec in all_links:
            key=rec['href']
            if key not in seen:
              seen.add(key); unique.append(rec)
          print('\nUNIQUE_ALL',json.dumps(unique,ensure_ascii=False))
          PY
