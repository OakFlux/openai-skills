name: Probe JST broker report public preview pages in browser 20260922

on:
  push:
    paths:
      - '.github/workflows/jst-broker-browser-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Capture pages and network URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser_probe
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          targets = [
            ('huatai_sgpj_preview','https://m.sgpjbg.com/baogao/1237915.html'),
            ('huatai_vzkoo_doc','https://www.vzkoo.com/document/4668826669253922816.html'),
            ('shenwan_vzkoo_read','https://www.vzkoo.com/read/4657606406113857536.html'),
            ('guangfa_box','https://www.baogaobox.com/insights/251219000023964.html'),
          ]

          async def main():
            async with async_playwright() as p:
              browser = await p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled','--no-sandbox'])
              context = await browser.new_context(
                viewport={'width':1440,'height':1000},
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                locale='zh-CN',
              )
              for key,url in targets:
                page=await context.new_page()
                net=[]
                page.on('response', lambda resp, net=net: net.append({'url':resp.url,'status':resp.status,'type':resp.request.resource_type,'content_type':resp.headers.get('content-type','')}))
                rec={'key':key,'url':url}
                try:
                  resp=await page.goto(url,wait_until='domcontentloaded',timeout=90000)
                  rec['status']=resp.status if resp else None
                  await page.wait_for_timeout(5000)
                  # dismiss common overlays
                  for sel in ['text=关闭','text=我知道了','.close','.layui-layer-close','.modal-close','button:has-text("关闭")']:
                    try:
                      loc=page.locator(sel).first
                      if await loc.count(): await loc.click(timeout=1000)
                    except: pass
                  for _ in range(20):
                    await page.mouse.wheel(0,2500)
                    await page.wait_for_timeout(250)
                  await page.wait_for_timeout(2000)
                  rec['final_url']=page.url
                  rec['title']=await page.title()
                  rec['text']=(await page.locator('body').inner_text())[:200000]
                  rec['images']=await page.eval_on_selector_all('img','els=>els.map(e=>({src:e.currentSrc||e.src,ds:e.getAttribute("data-src"),orig:e.getAttribute("data-original"),alt:e.alt,width:e.naturalWidth,height:e.naturalHeight})).filter(x=>x.src||x.ds||x.orig)')
                  rec['links']=await page.eval_on_selector_all('a','els=>els.map(e=>({href:e.href,text:(e.innerText||"").trim()})).filter(x=>x.href)')
                  rec['html']=await page.content()
                  (Path('browser_probe')/f'{key}.html').write_text(rec['html'],encoding='utf-8')
                  (Path('browser_probe')/f'{key}.txt').write_text(rec['text'],encoding='utf-8')
                  await page.screenshot(path=str(Path('browser_probe')/f'{key}.png'),full_page=True)
                except Exception as e:
                  rec['error']=repr(e)
                  try:
                    rec['final_url']=page.url
                    rec['title']=await page.title()
                    rec['text']=(await page.locator('body').inner_text())[:100000]
                    await page.screenshot(path=str(Path('browser_probe')/f'{key}_error.png'),full_page=True)
                  except: pass
                rec['network']=net
                (Path('browser_probe')/f'{key}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
          grep -RInE "https?[^[:space:]\"']+\.(pdf|png|jpg|jpeg|webp)|download|preview|pageimage|fileupload|1237915|4668826669253922816" browser_probe/*.json browser_probe/*.html > browser_probe/grep_hits.txt || true

      - name: Upload browser probe
        uses: actions/upload-artifact@v4
        with:
          name: jst-broker-browser-probe
          path: browser_probe
          if-no-files-found: error
          retention-days: 7
