name: Probe HJTime 360why full report pages 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-360why-full-pages-probe-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install image tools
        run: python -m pip install --quiet requests Pillow
      - name: Probe page images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,concurrent.futures
          from PIL import Image
          from io import BytesIO
          stem='https://zy.360why.com/file/p/2026/01-11/img816jr8lprzem6nyjl3xid00090262'
          variants=[]
          for i in range(0,25):
            for ext in ('webp','png','jpg','jpeg'):
              variants.append((i,f'{stem}-{i}.{ext}'))
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.360why.com/','Accept':'image/avif,image/webp,image/png,image/*,*/*'}
          def probe(item):
            i,u=item
            try:
              r=requests.get(u,headers=headers,timeout=(5,20),allow_redirects=True)
              rec={'page_index':i,'url':u,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'prefix':r.content[:12].hex(),'final':r.url}
              if r.status_code==200 and len(r.content)>5000:
                try:
                  im=Image.open(BytesIO(r.content)); rec['size']=im.size; rec['format']=im.format
                except Exception as e: rec['image_error']=repr(e)
              return rec
            except Exception as e: return {'page_index':i,'url':u,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
            for rec in ex.map(probe,variants):
              if rec.get('status')==200 or rec.get('error'):
                print(json.dumps(rec,ensure_ascii=False),flush=True)
          PY
