name: Build Shangneng 300827 all filings 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shangneng-300827-all-filings-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          CODE = '300827'
          SHORT = '上能电气'
          FULL = '上能电气股份有限公司'
          TODAY = '2026-10-28'
          PACKAGE = '上能电气_300827_全部年报_招股说明书_最新季报'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / '原始PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          for directory in (ROOT, PDF_DIR, PREVIEW_DIR):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/json,text/plain,*/*',
              'Referer': 'https://www.cninfo.com.cn/new/disclosure/stock?stockCode=300827',
              'Origin': 'https://www.cninfo.com.cn',
              'X-Requested-With': 'XMLHttpRequest',
          })

          request_log: list[dict[str, Any]] = []

          def clean_title(value: Any) -> str:
              text = html.unescape(str(value or ''))
              text = BeautifulSoup(text, 'lxml').get_text(' ', strip=True)
              return re.sub(r'\s+', '', text)

          def get_json(url: str) -> Any:
              last: dict[str, Any] = {}
              for attempt in range(7):
                  try:
                      response = session.get(url, timeout=(20, 120))
                      last = {
                          'method': 'GET', 'url': response.url, 'status': response.status_code,
                          'bytes': len(response.content), 'content_type': response.headers.get('content-type', ''),
                      }
                      request_log.append(last)
                      if response.status_code == 200:
                          return response.json()
                  except Exception as exc:
                      last = {'method': 'GET', 'url': url, 'attempt': attempt + 1, 'error': repr(exc)}
                      request_log.append(last)
                  time.sleep(1 + attempt)
              raise RuntimeError(f'GET JSON failed: {last}')

          def post_query(stock: str, category: str, se_date: str, searchkey: str = '') -> list[dict[str, Any]]:
              endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              collected: list[dict[str, Any]] = []
              seen_local: set[str] = set()
              for page in range(1, 6):
                  data = {
                      'pageNum': str(page), 'pageSize': '100', 'column': 'szse',
                      'tabName': 'fulltext', 'plate': 'sz', 'stock': stock,
                      'searchkey': searchkey, 'secid': '', 'category': category,
                      'trade': '', 'seDate': se_date, 'sortName': 'time',
                      'sortType': 'desc', 'isHLtitle': 'true',
                  }
                  payload = None
                  last: dict[str, Any] = {}
                  for attempt in range(7):
                      try:
                          response = session.post(endpoint, data=data, timeout=(20, 120))
                          last = {
                              'method': 'POST', 'url': response.url, 'status': response.status_code,
                              'bytes': len(response.content), 'content_type': response.headers.get('content-type', ''),
                              'data': data,
                          }
                          request_log.append(last)
                          if response.status_code == 200:
                              payload = response.json()
                              break
                      except Exception as exc:
                          last = {'method': 'POST', 'url': endpoint, 'data': data, 'attempt': attempt + 1, 'error': repr(exc)}
                          request_log.append(last)
                      time.sleep(1 + attempt)
                  if payload is None:
                      raise RuntimeError(f'CNInfo query failed: {last}')
                  rows = payload.get('announcements') or payload.get('announcementList') or []
                  if not isinstance(rows, list):
                      rows = []
                  added = 0
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      key = str(row.get('announcementId') or '') + '|' + str(row.get('adjunctUrl') or '')
                      if key not in seen_local:
                          seen_local.add(key)
                          collected.append(row)
                          added += 1
                  total_pages = int(payload.get('totalpages') or payload.get('totalPages') or 0)
                  has_more = bool(payload.get('hasMore'))
                  print('QUERY', category, se_date, searchkey, 'page', page, 'rows', len(rows), 'added', added, 'total_pages', total_pages, 'has_more', has_more)
                  if not rows or (total_pages and page >= total_pages) or (not total_pages and not has_more) or added == 0:
                      break
                  time.sleep(0.25)
              return collected

          def walk_find(obj: Any) -> list[dict[str, Any]]:
              found: list[dict[str, Any]] = []
              if isinstance(obj, dict):
                  values = [str(obj.get(key) or '') for key in ('code', 'secCode', 'stockCode', 'zqdm', 'symbol')]
                  if CODE in values:
                      found.append(obj)
                  for value in obj.values():
                      found.extend(walk_find(value))
              elif isinstance(obj, list):
                  for value in obj:
                      found.extend(walk_find(value))
              return found

          mapping = get_json('https://www.cninfo.com.cn/new/data/szse_stock.json')
          mapping_matches = walk_find(mapping)
          org_id = ''
          for item in mapping_matches:
              for key in ('orgId', 'orgid', 'organizationId', 'companyId'):
                  if item.get(key):
                      org_id = str(item[key])
                      break
              if org_id:
                  break
          if not org_id:
              raise RuntimeError(f'Could not resolve CNInfo orgId for {CODE}: {mapping_matches[:3]}')
          stock_value = f'{CODE},{org_id}'
          print('ORG_ID', org_id, 'STOCK_VALUE', stock_value)

          def ann_time(row: dict[str, Any]) -> int:
              value = row.get('announcementTime') or row.get('announcementDate') or 0
              try:
                  return int(value)
              except Exception:
                  digits = re.sub(r'\D', '', str(value))
                  return int(digits[:14] or 0)

          def title_of(row: dict[str, Any]) -> str:
              return clean_title(row.get('announcementTitle') or row.get('title') or '')

          def adjunct_of(row: dict[str, Any]) -> str:
              return str(row.get('adjunctUrl') or row.get('url') or '').strip()

          def issuer_ok(row: dict[str, Any]) -> bool:
              code = str(row.get('secCode') or row.get('stockCode') or '')
              name = clean_title(row.get('secName') or row.get('stockName') or '')
              title = title_of(row)
              return code in ('', CODE) and (not name or SHORT in name or FULL in name or SHORT in title)

          annual_selected: list[tuple[str, dict[str, Any]]] = []
          annual_candidates_log: dict[str, list[dict[str, Any]]] = {}
          excluded = ['摘要', '审计报告', '内部控制', '董事会工作报告', '监事会工作报告', '问询', '回复', '说明会', '提示性公告', '取消']

          # 上能电气2020年上市；2019年年度报告为上市后首次披露年报。
          for report_year in range(2019, 2026):
              disclosure_year = report_year + 1
              se_date = f'{disclosure_year}-01-01~{disclosure_year}-07-31'
              rows = post_query(stock_value, 'category_ndbg_szsh', se_date)
              if not rows:
                  rows = post_query(stock_value, '', se_date, f'{report_year}年年度报告')
              candidates: list[tuple[int, int, dict[str, Any]]] = []
              logged: list[dict[str, Any]] = []
              target = f'{report_year}年年度报告'
              for row in rows:
                  if not issuer_ok(row):
                      continue
                  title = title_of(row)
                  logged.append({'title': title, 'time': ann_time(row), 'url': adjunct_of(row)})
                  if target not in title:
                      continue
                  if any(word in title for word in excluded):
                      continue
                  if '更正公告' in title or ('关于' in title and target in title):
                      continue
                  score = 100
                  if re.search(rf'(^|[:：]){report_year}年年度报告(全文)?$', title):
                      score += 100
                  if any(word in title for word in ['更新后', '修订版', '更正后']):
                      score += 40
                  if '全文' in title:
                      score += 10
                  candidates.append((score, ann_time(row), row))
              annual_candidates_log[str(report_year)] = logged
              if not candidates:
                  raise RuntimeError(f'Missing full annual report for {report_year}: {logged}')
              candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
              annual_selected.append((f'{report_year}年年度报告', candidates[0][2]))

          quarter_rows = post_query(stock_value, 'category_sjdbg_szsh', '2026-09-01~2026-10-28')
          if not quarter_rows:
              quarter_rows = post_query(stock_value, '', '2026-09-01~2026-10-28', '2026年三季度报告')
          quarter_candidates: list[tuple[int, int, dict[str, Any]]] = []
          quarter_log = []
          for row in quarter_rows:
              if not issuer_ok(row):
                  continue
              title = title_of(row)
              quarter_log.append({'title': title, 'time': ann_time(row), 'url': adjunct_of(row)})
              if not any(target in title for target in ['2026年三季度报告', '2026年第三季度报告']):
                  continue
              if any(word in title for word in ['摘要', '更正公告', '关于']):
                  continue
              score = 100 + (20 if any(word in title for word in ['更新后', '修订版', '更正后']) else 0)
              quarter_candidates.append((score, ann_time(row), row))
          if not quarter_candidates:
              raise RuntimeError(f'Missing latest quarterly report: {quarter_log}')
          quarter_candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
          latest_quarter = ('2026年第三季度报告', quarter_candidates[0][2])

          # 2020-03-27披露的首次公开发行最终招股说明书。
          prospectus = {
              'announcementTitle': '首次公开发行股票并在创业板上市招股说明书',
              'announcementTime': 1585267200000,
              'adjunctUrl': 'https://disc.static.szse.cn/disc/disk02/finalpage/2020-03-27/7076d41c-9e07-41dd-aede-2b0ddb437d1e.PDF',
              'secCode': CODE,
              'secName': SHORT,
          }

          selections = annual_selected + [('首次公开发行股票并在创业板上市招股说明书', prospectus), latest_quarter]
          if len(selections) != 9:
              raise RuntimeError(f'Unexpected selection count: {len(selections)}')

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              return re.sub(r'\s+', '', text)[:120]

          manifest: list[dict[str, Any]] = []
          total_pages = 0
          for index, (label, row) in enumerate(selections, 1):
              title = title_of(row)
              adjunct = adjunct_of(row)
              if not adjunct:
                  raise RuntimeError(f'No PDF URL for {label}: {title}')
              if adjunct.startswith('//'):
                  pdf_url = 'https:' + adjunct
              elif adjunct.startswith('http://') or adjunct.startswith('https://'):
                  pdf_url = adjunct.replace('http://', 'https://', 1)
              else:
                  pdf_url = 'https://static.cninfo.com.cn/' + adjunct.lstrip('/')

              data = None
              attempts: list[dict[str, Any]] = []
              for attempt in range(7):
                  try:
                      response = session.get(
                          pdf_url,
                          headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://www.cninfo.com.cn/',
                              'Accept': 'application/pdf,*/*;q=0.8',
                          },
                          timeout=(30, 360),
                          allow_redirects=True,
                      )
                      meta = {
                          'url': pdf_url, 'status': response.status_code,
                          'bytes': len(response.content), 'content_type': response.headers.get('content-type', ''),
                          'final_url': response.url,
                      }
                      attempts.append(meta)
                      if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 50_000:
                          data = response.content
                          break
                  except Exception as exc:
                      attempts.append({'url': pdf_url, 'attempt': attempt + 1, 'error': repr(exc)})
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'PDF download failed for {label}: {attempts}')

              filename = f'{index:02d}_{safe_name(label)}.pdf'
              destination = PDF_DIR / filename
              destination.write_bytes(data)
              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              minimum_pages = 5
              if '年度报告' in label:
                  minimum_pages = 80
              elif '招股说明书' in label:
                  minimum_pages = 200
              if pages < minimum_pages:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')
              total_pages += pages

              text = ''
              for page in reader.pages[:min(12, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              identity_hits = [value for value in (SHORT, FULL, CODE) if re.sub(r'\s+', '', value) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer identity mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEW_DIR / destination.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '110', '-singlefile', str(destination), str(preview_prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page render failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'label': label,
                  'announcement_title': title,
                  'announcement_time': ann_time(row),
                  'filename': str(Path('原始PDF') / filename),
                  'source_url': pdf_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': ['PDF header', 'issuer identity', 'page count', 'qpdf structure', 'first-page render'],
              })

          readme = [
              '上能电气股份有限公司（300827.SZ）定期报告与发行文件资料包',
              '整理日期：2026-10-28',
              '',
              '收录范围：公司上市后披露的2019—2025年全部年度报告全文、首次公开发行股票并在创业板上市招股说明书全文，以及截至整理日最新披露的2026年第三季度报告。',
              '如同一年度存在修订版、更新后或更正后全文，本包优先采用后续披露版本。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['label']}",
                  f"   公告标题：{item['announcement_title']}",
                  f"   页数：{item['pages']}页；文件：{item['filename']}",
                  f"   来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '全部PDF均为公开信息披露原始附件。',
              '已核验PDF文件头、公司名称/证券代码、实际页数、文档结构、首页渲染、ZIP CRC和SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'annual_candidate_records.json').write_text(json.dumps(annual_candidates_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'quarter_candidate_records.json').write_text(json.dumps(quarter_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'request_log.json').write_text(json.dumps(request_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_cn = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_cn, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_cn) as archive:
              bad = archive.testzip()
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdf_names) != 9:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdf_names)}')

          zip_en = Path('shangneng_300827_all_annual_reports_prospectus_latest_quarter.zip')
          zip_en.write_bytes(zip_cn.read_bytes())
          zip_sha = hashlib.sha256(zip_cn.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_cn, zip_cn.stat().st_size, 'SHA256', zip_sha)
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: shangneng-300827-all-filings-final
          path: |
            上能电气_300827_全部年报_招股说明书_最新季报.zip
            shangneng_300827_all_annual_reports_prospectus_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
