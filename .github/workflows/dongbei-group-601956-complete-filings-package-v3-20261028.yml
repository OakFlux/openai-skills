name: Package Dongbei Group complete filings v3

on:
  push:
    paths:
      - '.github/workflows/dongbei-group-601956-complete-filings-package-v3-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Build verified package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import time
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any
          from urllib.parse import urlsplit, urlunsplit

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '东贝集团'
          FULL_COMPANY = '湖北东贝机电集团股份有限公司'
          CURRENT_CODE = '601956'
          PREDECESSOR_CODE = '900956'
          CUTOFF = '2026-10-28'
          CUT = '20261028'
          REPO = os.environ.get('GITHUB_REPOSITORY', 'OakFlux/openai-skills')
          TOKEN = os.environ.get('GH_TOKEN', '')
          DISCOVERY_JOB_ID = 122579751663

          ROOT_NAME = f'{COMPANY}_{CURRENT_CODE}_上市沿革全部年报_上市文件及最新季报_截至{CUT}'
          ROOT = Path('work') / ROOT_NAME
          DIST = Path('dist')
          D_LIST = ROOT / '00_上市与发行文件'
          D_OLD = ROOT / '01_前身东贝B股年度报告_1999-2019'
          D_NEW = ROOT / '02_东贝集团年度报告_2020-2025'
          D_Q = ROOT / '03_最新季度报告'
          D_PREVIEW = ROOT / '首页预览'
          for d in (D_LIST, D_OLD, D_NEW, D_Q, D_PREVIEW, DIST):
              d.mkdir(parents=True, exist_ok=True)

          EM_API = 'https://np-anotice-stock.eastmoney.com/api/security/ann'

          def make_session() -> requests.Session:
              s = requests.Session()
              retry = Retry(
                  total=3,
                  connect=3,
                  read=2,
                  status=3,
                  backoff_factor=0.8,
                  status_forcelist=(408, 429, 500, 502, 503, 504),
                  allowed_methods=frozenset({'GET'}),
                  raise_on_status=False,
              )
              s.mount('https://', HTTPAdapter(max_retries=retry))
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              })
              return s

          S = make_session()

          def clean(v: object) -> str:
              return re.sub(r'\s+', '', str(v or '')).strip()

          def safe_name(v: str) -> str:
              v = re.sub(r'[\\/:*?"<>|]', '_', v)
              v = re.sub(r'\s+', '', v)
              return re.sub(r'_+', '_', v).strip('_. ')

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          # Parse the successful historical SSE discovery job log. This avoids
          # repeatedly hitting the SSE query endpoint, which intermittently
          # returns 403 to hosted runners even though the official PDF links work.
          log_url = f'https://api.github.com/repos/{REPO}/actions/jobs/{DISCOVERY_JOB_ID}/logs'
          log_headers = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          lr = requests.get(log_url, headers=log_headers, timeout=(20, 90), allow_redirects=True)
          print('DISCOVERY_LOG', lr.status_code, len(lr.content), lr.url, lr.headers.get('content-type'))
          lr.raise_for_status()
          log_text = lr.content.decode('utf-8-sig', errors='replace')

          old_meta: list[dict[str, str]] = []
          for line in log_text.splitlines():
              marker = 'MATCH '
              pos = line.find(marker)
              if pos < 0:
                  continue
              try:
                  obj = json.loads(line[pos + len(marker):].strip())
              except Exception:
                  continue
              title = clean(obj.get('title'))
              path = str(obj.get('path') or '')
              date = str(obj.get('date') or '')
              if title and path:
                  old_meta.append({'title': title, 'path': path, 'date': date})
          old_meta = list({(x['title'], x['path'], x['date']): x for x in old_meta}.values())
          print('PARSED_OLD_METADATA', len(old_meta))

          full_by_year: dict[int, list[dict[str, str]]] = {}
          summary_by_year: dict[int, list[dict[str, str]]] = {}
          for x in old_meta:
              m = re.search(r'(19\d{2}|20\d{2})年年度报告', x['title'])
              if not m:
                  continue
              year = int(m.group(1))
              if not 1999 <= year <= 2019:
                  continue
              title = x['title']
              if any(k in title for k in ('英文版', '关于', '说明', '更正公告', '问询', '回复')):
                  continue
              if '摘要' in title:
                  summary_by_year.setdefault(year, []).append(x)
              else:
                  full_by_year.setdefault(year, []).append(x)

          def rank_doc(x: dict[str, str]) -> tuple[int, int, str]:
              title = x['title']
              revision = 2 if any(k in title for k in ('修订版', '更新版', '更正后', '补充后')) else 1
              exact = 2 if re.search(r'年度报告(?:（修订版）)?$', title) else 1
              return revision, exact, x['date']

          old_selected: list[dict[str, Any]] = []
          summary_only_years: list[int] = []
          for year in range(1999, 2020):
              full_choices = full_by_year.get(year) or []
              summary_choices = summary_by_year.get(year) or []
              if full_choices:
                  x = dict(max(full_choices, key=rank_doc))
                  dtype = 'predecessor_annual_report'
                  is_summary = False
              elif summary_choices:
                  x = dict(max(summary_choices, key=rank_doc))
                  dtype = 'predecessor_annual_report_summary'
                  is_summary = True
                  summary_only_years.append(year)
              else:
                  raise RuntimeError(f'缓存的上交所档案中既无{year}年年报全文，也无官方年报摘要。')
              path = x['path'] if x['path'].startswith('/') else '/' + x['path']
              x.update({
                  'document_type': dtype,
                  'period': str(year),
                  'report_year': year,
                  'is_summary': is_summary,
                  'announcement_date': x['date'],
                  'source_platform': '上海证券交易所',
                  'urls': [
                      'https://static.sse.com.cn' + path,
                      'https://www.sse.com.cn' + path,
                  ],
              })
              old_selected.append(x)
          print('OLD_YEARS', [x['report_year'] for x in old_selected])
          print('SUMMARY_ONLY_YEARS', summary_only_years)

          def em_query(code: str) -> list[dict[str, Any]]:
              rows: list[dict[str, Any]] = []
              for page in range(1, 30):
                  params = {
                      'sr': '-1',
                      'page_size': '100',
                      'page_index': str(page),
                      'ann_type': 'A',
                      'client_source': 'web',
                      'stock_list': code,
                  }
                  r = S.get(
                      EM_API,
                      params=params,
                      headers={'Referer': 'https://data.eastmoney.com/notices/', 'Accept': 'application/json,text/plain,*/*'},
                      timeout=(20, 60),
                  )
                  print('EM_QUERY', page, r.status_code, len(r.content))
                  r.raise_for_status()
                  data = r.json().get('data') or {}
                  part = data.get('list') or []
                  if not part:
                      break
                  rows.extend(part)
                  total = int(data.get('total_hits') or 0)
                  if total and len(rows) >= total:
                      break
              return list({str(x.get('art_code')): x for x in rows if x.get('art_code')}.values())

          def em_urls(art: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
              ]

          em_rows = em_query(CURRENT_CODE)
          current_by_year: dict[int, list[dict[str, str]]] = {}
          quarter_candidates: list[dict[str, Any]] = []
          listing_candidates: list[dict[str, str]] = []
          for row in em_rows:
              title = clean(row.get('title'))
              art = str(row.get('art_code') or '')
              date = str(row.get('notice_date') or row.get('display_time') or '')[:10]
              m = re.search(r'(20\d{2})年年度报告', title)
              if m and not any(k in title for k in ('摘要', '持续督导', '问询', '回复', '审计报告')):
                  year = int(m.group(1))
                  if 2020 <= year <= 2025:
                      current_by_year.setdefault(year, []).append({'title': title, 'art': art, 'date': date})
              qm = re.search(r'(20\d{2})年(第一|第三|一|三)季度报告', title)
              if qm and not any(k in title for k in ('摘要', '更正公告', '提示性公告')):
                  q = 3 if qm.group(2) in ('第三', '三') else 1
                  quarter_candidates.append({'title': title, 'art': art, 'date': date, 'year': int(qm.group(1)), 'quarter': q})
              if '换股吸收合并' in title and '上市公告书' in title:
                  listing_candidates.append({'title': title, 'art': art, 'date': date})

          current_selected: list[dict[str, Any]] = []
          for year in range(2020, 2026):
              choices = current_by_year.get(year) or []
              if not choices:
                  raise RuntimeError(f'未找到东贝集团{year}年年度报告全文。')
              x = dict(max(choices, key=lambda z: (2 if any(k in z['title'] for k in ('修订', '更新', '更正后')) else 1, z['date'])))
              x.update({
                  'document_type': 'current_annual_report',
                  'period': str(year),
                  'report_year': year,
                  'announcement_date': x['date'],
                  'source_platform': '上市公司公告镜像（东方财富）',
                  'urls': em_urls(x['art']),
              })
              current_selected.append(x)

          if not quarter_candidates:
              raise RuntimeError('未找到东贝集团正式季度报告。')
          latest_q = max(quarter_candidates, key=lambda z: (z['year'], z['quarter'], z['date']))
          latest_q.update({
              'document_type': 'quarterly_report',
              'period': f"{latest_q['year']}Q{latest_q['quarter']}",
              'announcement_date': latest_q['date'],
              'source_platform': '上市公司公告镜像（东方财富）',
              'urls': em_urls(latest_q['art']),
          })

          if listing_candidates:
              listing_item = dict(max(listing_candidates, key=lambda z: z['date']))
          else:
              listing_item = {
                  'title': '东贝集团换股吸收合并东贝B股上市公告书',
                  'art': 'AN202012231443179054',
                  'date': '2020-12-24',
              }
          listing_item.update({
              'document_type': 'listing_announcement',
              'period': '2020-listing-announcement',
              'announcement_date': listing_item['date'],
              'source_platform': '上市公司公告镜像（东方财富）',
              'urls': em_urls(listing_item['art']),
          })

          merger_report = {
              'title': '湖北东贝机电集团股份有限公司换股吸收合并黄石东贝电器股份有限公司暨关联交易报告书（修订稿）',
              'document_type': 'merger_report',
              'period': '2020-listing-transaction',
              'announcement_date': '2020-09-30',
              'source_platform': '上海证券交易所',
              'urls': [
                  'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/2020-09-30/900956_20200930_2.pdf',
                  'https://pdf.dfcfw.com/pdf/H2_AN202009291418214963_1.pdf',
              ],
          }

          items = [merger_report, listing_item, *old_selected, *current_selected, latest_q]

          def candidate_urls(urls: list[str]) -> list[str]:
              out: list[str] = []
              for url in urls:
                  out.append(url)
                  parts = urlsplit(url)
                  if parts.netloc == 'static.sse.com.cn':
                      out.append(urlunsplit((parts.scheme, 'www.sse.com.cn', parts.path, parts.query, parts.fragment)))
              return list(dict.fromkeys(out))

          def download(item: dict[str, Any], dest: Path) -> str:
              errors: list[str] = []
              for url in candidate_urls(list(item['urls'])):
                  for attempt in range(1, 3):
                      try:
                          with S.get(
                              url,
                              headers={
                                  'Referer': 'https://www.sse.com.cn/' if 'sse.com.cn' in url else 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(20, 75),
                              stream=True,
                          ) as r:
                              print('DOWNLOAD', attempt, r.status_code, url, r.headers.get('content-type'), r.headers.get('content-length'))
                              if r.status_code != 200:
                                  errors.append(f'{url}: HTTP {r.status_code}')
                                  continue
                              tmp = dest.with_suffix('.part')
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024 * 1024):
                                      if chunk:
                                          f.write(chunk)
                              if tmp.stat().st_size < 8_000:
                                  errors.append(f'{url}: too small {tmp.stat().st_size}')
                                  tmp.unlink(missing_ok=True)
                                  continue
                              with tmp.open('rb') as f:
                                  if f.read(4) != b'%PDF':
                                      errors.append(f'{url}: invalid header')
                                      tmp.unlink(missing_ok=True)
                                      continue
                              tmp.replace(dest)
                              return url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(0.5)
              raise RuntimeError(f"无法下载完整PDF：{item['title']}; errors={errors}")

          records: list[dict[str, Any]] = []
          total_pages = 0
          for item in items:
              dtype = item['document_type']
              if dtype == 'merger_report':
                  dest = D_LIST / '2020_东贝集团_换股吸收合并东贝B股暨关联交易报告书_修订稿.pdf'
              elif dtype == 'listing_announcement':
                  dest = D_LIST / '2020_东贝集团_换股吸收合并东贝B股上市公告书.pdf'
              elif dtype == 'predecessor_annual_report':
                  year = int(item['report_year'])
                  dest = D_OLD / f'{year}_东贝B股_{year}年年度报告.pdf'
              elif dtype == 'predecessor_annual_report_summary':
                  year = int(item['report_year'])
                  dest = D_OLD / f'{year}_东贝B股_{year}年年度报告摘要_官方存档.pdf'
              elif dtype == 'current_annual_report':
                  year = int(item['report_year'])
                  dest = D_NEW / f'{year}_东贝集团_{year}年年度报告.pdf'
              elif dtype == 'quarterly_report':
                  qcn = '第一季度' if int(latest_q['quarter']) == 1 else '第三季度'
                  dest = D_Q / f"{latest_q['year']}Q{latest_q['quarter']}_东贝集团_{latest_q['year']}年{qcn}报告.pdf"
              else:
                  raise RuntimeError(dtype)
              dest = dest.with_name(safe_name(dest.name))
              used_url = download(item, dest)

              reader = PdfReader(str(dest), strict=False)
              if reader.is_encrypted:
                  reader.decrypt('')
              pages = len(reader.pages)
              if pages < 1:
                  raise RuntimeError(f'PDF页数异常: {dest}: {pages}')
              doc = fitz.open(dest)
              if doc.page_count != pages:
                  raise RuntimeError(f'双解析器页数不一致: {dest}: pypdf={pages}, fitz={doc.page_count}')
              first = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(0.7, 0.7), alpha=False)
              last = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.55, 0.55), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 60:
                  raise RuntimeError(f'页面渲染异常: {dest}')
              first.save(D_PREVIEW / f'{dest.stem}.png')
              doc.close()

              rec = {
                  'document_type': dtype,
                  'period': item['period'],
                  'title': item['title'],
                  'announcement_date': item['announcement_date'],
                  'source_platform': item['source_platform'],
                  'source_url': used_url,
                  'relative_path': str(dest.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_size_bytes': dest.stat().st_size,
                  'page_count': pages,
                  'sha256': sha256_file(dest),
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
              }
              records.append(rec)
              total_pages += pages
              print('VERIFIED', json.dumps(rec, ensure_ascii=False))

          old_periods = sorted(int(r['period']) for r in records if r['document_type'] in ('predecessor_annual_report', 'predecessor_annual_report_summary'))
          new_periods = sorted(int(r['period']) for r in records if r['document_type'] == 'current_annual_report')
          if old_periods != list(range(1999, 2020)) or new_periods != list(range(2020, 2026)):
              raise RuntimeError(f'年度覆盖不完整: old={old_periods}, new={new_periods}')

          full_annual_count = sum(1 for r in records if r['document_type'] in ('predecessor_annual_report', 'current_annual_report'))
          summary_count = sum(1 for r in records if r['document_type'] == 'predecessor_annual_report_summary')
          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'current_stock_code': CURRENT_CODE,
              'predecessor_stock_code': PREDECESSOR_CODE,
              'cutoff_date': CUTOFF,
              'annual_period_years': list(range(1999, 2026)),
              'full_annual_report_count': full_annual_count,
              'official_summary_count': summary_count,
              'summary_only_years': summary_only_years,
              'latest_quarter': latest_q['period'],
              'document_count': len(records),
              'total_pages': total_pages,
              'prospectus_note': '东贝集团601956于2020年通过换股吸收合并东贝B股上市，并非传统IPO；可检索官方电子档案未取得传统招股说明书。本包收录最终换股吸收合并报告书和上市公告书作为对应的正式上市文件。',
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records) + '\n', encoding='utf-8')

          readme = [
              f'# {COMPANY}（{CURRENT_CODE}）上市沿革官方披露文件包', '',
              f'- 截止日期：{CUTOFF}',
              '- 年度覆盖：前身东贝B股1999—2019年、东贝集团2020—2025年，共27个年度。',
              f'- 完整年度报告：{full_annual_count}份；仅有官方存档摘要的年度：{summary_count}份（{summary_only_years or "无"}）。',
              f"- 最新正式季报：{latest_q['period']}。",
              f'- PDF总数：{len(records)}份；合计页数：{total_pages}页。', '',
              '## 招股说明书说明', '',
              '- 东贝集团601956于2020年通过换股吸收合并东贝B股上市，并非传统首次公开发行。',
              '- 可检索官方电子档案未取得传统IPO招股说明书，因此本包收录最终换股吸收合并暨关联交易报告书（修订稿）及上市公告书；没有把其他文件冒充招股说明书。', '',
              '## 历史年报说明', '',
          ]
          if summary_only_years:
              readme.append(f'- 上交所电子档案中，{summary_only_years}年度未检索到完整年报PDF，仅提供官方年度报告摘要；文件名已明确标注“官方存档摘要”。')
          else:
              readme.append('- 1999—2025年度均取得完整年度报告PDF。')
          readme += ['', '## 文件清单', '']
          for i, r in enumerate(records, 1):
              readme += [
                  f"{i}. `{r['relative_path']}`",
                  f"   - 标题：{r['title']}",
                  f"   - 披露日期：{r['announcement_date']}；页数：{r['page_count']}；大小：{r['file_size_bytes']:,}字节",
                  f"   - 来源：{r['source_platform']}；{r['source_url']}",
                  f"   - SHA-256：`{r['sha256']}`",
              ]
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          final_cn = DIST / f'{ROOT_NAME}.zip'
          final_en = DIST / f'dongbei_group_601956_all_annual_reports_listing_docs_latest_quarter_{CUT}.zip'
          for path in (final_cn, final_en):
              path.unlink(missing_ok=True)
          with zipfile.ZipFile(final_cn, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      zf.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(final_cn, final_en)

          for path in (final_cn, final_en):
              with zipfile.ZipFile(path) as zf:
                  bad = zf.testzip()
                  pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if bad or len(pdfs) != len(records):
                      raise RuntimeError(f'ZIP校验失败: {path}, bad={bad}, pdfs={len(pdfs)}, expected={len(records)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256_file(path))

          print('FINAL_JSON', json.dumps({
              'document_count': len(records),
              'annual_period_count': 27,
              'full_annual_report_count': full_annual_count,
              'official_summary_count': summary_count,
              'summary_only_years': summary_only_years,
              'latest_quarter': latest_q['period'],
