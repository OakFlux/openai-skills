name: Build Zenergy broker research report package 20260922

on:
  push:
    paths:
      - '.github/workflows/zenergy-broker-reports-final-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download official broker PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          import urllib3
          from pypdf import PdfReader

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          PACKAGE = '正力新能_03677_券商深度报告_官方完整版_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          render_dir = root / '首页预览'
          render_dir.mkdir(exist_ok=True)

          reports = [
            {
              'order': 1,
              'broker_cn': '招银国际',
              'broker_en': 'CMB International Global Markets',
              'title': 'Zenergy (3677 HK) - Minimal legacy burden, operational efficiency, improving client mix to drive sales, profit',
              'title_cn': '正力新能：轻装上阵、运营提效与客户结构改善驱动销售及利润增长',
              'report_type': '首次覆盖 / Company Initiation',
              'date': '2025-09-12',
              'analysts': ['Ji SHI, CFA', 'Wenjing DOU, CFA', 'Austin Liang'],
              'rating': 'BUY（首次覆盖）',
              'target_price': 'HK$18.00',
              'expected_pages': 26,
              'pdf_url': 'https://hk-official.cmbi.info/upload/bcdc3295-2385-4664-9e48-66a208f06db6.pdf',
              'source_page': 'https://www.cmbi.com.hk/article/12065.html?lang=en',
              'filename': '01_招银国际_正力新能_首次覆盖_Minimal_legacy_burden_operational_efficiency_2025-09-12_26页.pdf',
            },
            {
              'order': 2,
              'broker_cn': '辉立证券（香港）',
              'broker_en': 'Phillip Securities (Hong Kong) / PhillipCapital',
              'title': 'Zenergy (3677 HK) - Lightly equipped, diverse growth',
              'title_cn': '正力新能：轻装上阵，多元增长',
              'report_type': '首次覆盖 / Initiation',
              'date': '2026-06-24',
              'analysts': ['Zhang Jing'],
              'rating': 'BUY（首次覆盖）',
              'target_price': 'HK$9.00',
              'expected_pages': 6,
              'pdf_url': 'https://research.cyberquote.com.hk/page/htm/kc/researchnews/img/260624e.pdf',
              'source_page': 'https://research.poems.com.hk/page/Phillip/kc/researchnews/e_index.asp',
              'filename': '02_辉立证券_正力新能_首次覆盖_Lightly_equipped_diverse_growth_2026-06-24_6页.pdf',
            },
            {
              'order': 3,
              'broker_cn': '招银国际',
              'broker_en': 'CMB International Global Markets',
              'title': 'Zenergy (3677 HK) - 1H26 a mixed bag; margin recovery from 2H26',
              'title_cn': '正力新能：2026年上半年表现分化，利润率自下半年修复',
              'report_type': '公司更新 / Company Update',
              'date': '2026-09-01',
              'analysts': ['Ji SHI, CFA', 'Wenjing DOU, CFA', 'Austin Liang'],
              'rating': 'BUY（维持）',
              'target_price': 'HK$11.50',
              'expected_pages': 5,
              'pdf_url': 'https://hk-official.cmbi.info/upload/8e628846-a50f-4a19-a1eb-26bee0679740.pdf',
              'source_page': 'https://www.cmbi.com.hk/article/13552.html?lang=en',
              'filename': '03_招银国际_正力新能_2026中期更新_1H26_a_mixed_bag_margin_recovery_from_2H26_2026-09-01_5页.pdf',
            },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
            'Accept': 'application/pdf,text/html;q=0.9,*/*;q=0.8',
            'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer': 'https://www.google.com/',
          })

          def fetch_pdf(url: str) -> tuple[bytes, dict]:
              last = None
              for attempt in range(5):
                  for verify in (True, False):
                      try:
                          r = session.get(url, timeout=(30,180), allow_redirects=True, verify=verify)
                          last = {'status': r.status_code, 'final_url': r.url, 'content_type': r.headers.get('content-type',''), 'bytes': len(r.content), 'verify_tls': verify}
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 30_000:
                              return r.content, last
                      except Exception as exc:
                          last = {'error': repr(exc), 'verify_tls': verify}
                  time.sleep(2 + attempt)
              raise RuntimeError(f'Failed to fetch PDF {url}: {last}')

          manifest = []
          for rec in reports:
              data, dl = fetch_pdf(rec['pdf_url'])
              dest = root / rec['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages != rec['expected_pages']:
                  raise RuntimeError(f"Page mismatch {dest.name}: expected {rec['expected_pages']}, got {pages}")
              first_text = (reader.pages[0].extract_text() or '')
              if 'Zenergy' not in first_text or '3677' not in first_text:
                  raise RuntimeError(f'Identity check failed: {dest.name}')
              subprocess.run(['qpdf','--check',str(dest)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)

              stem = dest.stem
              preview_prefix = render_dir / stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','130','-singlefile',str(dest),str(preview_prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(preview_prefix)+'.png')
              if not preview.exists() or preview.stat().st_size < 20_000:
                  raise RuntimeError(f'Preview render failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              row = dict(rec)
              row.update({
                'actual_pages': pages,
                'bytes': len(data),
                'sha256': sha,
                'download': dl,
                'pdf_file': dest.name,
                'preview_file': str(Path('首页预览') / preview.name),
                'validation': ['PDF header', 'issuer/ticker identity', 'page count', 'qpdf structure', 'first-page render'],
              })
              manifest.append(row)

          # Text README
          lines = [
            '正力新能（03677.HK）券商深度报告资料包',
            '整理日期：2026-09-22',
            '',
            '本包收录3份券商官网或券商官方研究站点公开提供的完整原始PDF，未绕过登录、会员或付费权限。',
            '两份为首次覆盖/深度报告，一份为最新公司更新，兼顾完整公司框架与最新经营变化。',
            '',
            '文件清单：',
          ]
          for i, r in enumerate(manifest, 1):
              lines += [
                f"{i}. {r['broker_cn']}：《{r['title']}》",
                f"   中文释义：{r['title_cn']}",
                f"   日期：{r['date']}；类型：{r['report_type']}；页数：{r['actual_pages']}页",
                f"   分析师：{'、'.join(r['analysts'])}；评级：{r['rating']}；目标价：{r['target_price']}",
                f"   PDF文件：{r['pdf_file']}",
                f"   券商官方页面：{r['source_page']}",
                f"   官方PDF：{r['pdf_url']}",
                f"   SHA-256：{r['sha256']}",
                '',
              ]
          lines += [
            '说明：报告观点、估值、评级及目标价均对应各报告发布日期，不代表当前投资建议。',
            '完整性核验：PDF文件头、公司及股票代码、实际页数、qpdf结构、首页渲染、ZIP CRC和SHA-256。',
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['pdf_file']}\n" for r in manifest), encoding='utf-8')

          zpath = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p, arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=3: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          digest=hashlib.sha256(zpath.read_bytes()).hexdigest()
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',digest)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: zenergy-broker-reports-official-full-final
          path: 正力新能_03677_券商深度报告_官方完整版_3份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
