name: Query China Hongqiao reports on Eastmoney
on:
  push:
    branches:
      - tmp-chinahongqiao-eastmoney-20260908
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install report client
        run: python -m pip install --quiet report-cli
      - name: Query stock reports
        run: |
          set -euo pipefail
          mkdir -p output
          for code in 01378 1378 HK01378 01378.HK; do
            echo "===== $code =====" | tee "output/query_${code//./_}.txt"
            report q -t stock -c "$code" -s 100 --begin 2024-01-01 --end 2026-09-08 2>&1 | tee -a "output/query_${code//./_}.txt" || true
          done
      - name: Upload query output
        uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-eastmoney-query
          path: output/*
          retention-days: 1
