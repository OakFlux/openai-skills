name: Discover JST Group broker report public previews 20260922

on:
  push:
    paths:
      - '.github/workflows/jst-broker-report-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect public report pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages = [
            ('guangfa_nxny','https://www.nxny.com/report/view_6177257.html'),
            ('guangfa_box','https://www.baogaobox.com/insights/251219000023964.html'),
            ('shenwan_vzkoo','https://www.vzkoo.com/read/4657606406113857536.html'),
            ('shenwan_360','https://www.360why.com/enterprise/260419000009509.html'),
            ('huatai_nxny','https://www.nxny.com/report/view_6292412.html'),
            ('huatai_vzkoo','https://www.vzkoo.com/document/4668826669253922816.html'),
            ('huatai_sgpj','https://www.sgpjbg.com/baogao/1237915.html'),
            ('huatai_sgpj_mobile','https://m.sgpjbg.com/bgdown/1237915.html'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          allrec=[]
          for key,url in pages:
            rec={'key':key,'url':url}
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              rec.update(status=r.status_code,final_url=r.url,content_type=r.headers.get('content-type'),bytes=len(r.content))
              raw=r.content
              (Path('discovery')/f'{key}.html').write_bytes(raw)
              text=raw.decode('utf-8','replace')
              soup=BeautifulSoup(text,'lxml')
              rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              urls=set()
              for tag in soup.find_all(True):
                for attr in ('src','href','data-src','data-original','data-url','data-lazy-src','poster','content'):
                  val=tag.get(attr)
                  if isinstance(val,str) and val.strip():
                    urls.add(urljoin(r.url,html.unescape(val.strip())))
                srcset=tag.get('srcset')
                if isinstance(srcset,str):
                  for part in srcset.split(','):
                    val=part.strip().split(' ')[0]
                    if val: urls.add(urljoin(r.url,html.unescape(val)))
              # regex URLs and likely JSON fields
              pats=[
                r'https?://[^\s"\'<>]+',
                r'["\']((?:/|https?:)[^"\']*(?:\.pdf|\.png|\.jpe?g|\.webp|download|preview|page|file|document)[^"\']*)["\']',
                r'(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|previewUrl|preview_url|imgUrl|imageUrl|url)\s*[:=]\s*["\']([^"\']+)["\']'
              ]
              for pat in pats:
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v).replace('\\/','/')
                  urls.add(urljoin(r.url,v))
              rec['urls']=sorted(urls)
              interesting=[]
              for ln in text.splitlines():
                low=ln.lower()
                if any(k in low for k in ('pdf','preview','page','image','download','document','reportid','fileid','oss','cos','cdn','1237915','4668826669253922816')):
                  x=re.sub(r'\s+',' ',ln).strip()
                  if x and len(x)<4000: interesting.append(x)
              rec['interesting']=interesting[:1000]
              # save scripts separately
              for i,tag in enumerate(soup.find_all('script')):
                if tag.get('src'): continue
                body=tag.get_text() or ''
                if body.strip():
                  (Path('discovery')/f'{key}_inline_{i:03d}.js').write_text(body,encoding='utf-8')
            except Exception as e:
              rec['error']=repr(e)
            (Path('discovery')/f'{key}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
            allrec.append(rec)
            time.sleep(1)
          (Path('discovery')/'all.json').write_text(json.dumps(allrec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "https?[^[:space:]\"']+\.(pdf|png|jpg|jpeg|webp)|pdfUrl|downloadUrl|previewUrl|fileUrl|reportId|fileId|pageUrl" discovery > discovery/grep_hits.txt || true
          find discovery -maxdepth 1 -type f -printf '%f %s\n' | sort > discovery/file_sizes.txt

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: jst-broker-report-discovery
          path: discovery
          if-no-files-found: error
          retention-days: 7
