name: Build Ningbo Huaxiang broker research package v3

on:
  push:
    branches:
      - tmp-ningbo-huaxiang-broker-reports-20261028

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests weasyprint pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='宁波华翔_002048_券商研究资料_3份'
          mkdir -p "$PACKAGE" /tmp/nbhx_check

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from weasyprint import HTML

          out = Path('宁波华翔_002048_券商研究资料_3份')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=8, connect=8, read=8, status=8, backoff_factor=1,
                        status_forcelist=[429,500,502,503,504],
                        allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def download_pdf(url: str, referer: str) -> requests.Response:
              last = None
              for attempt in range(8):
                  try:
                      r = session.get(url, headers={
                          'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                          'Referer':referer,
                      }, timeout=(30,360), allow_redirects=True)
                      if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 100000:
                          return r
                      last = RuntimeError(f'HTTP={r.status_code}, bytes={len(r.content)}, type={r.headers.get("content-type")}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 + attempt, 10))
              raise RuntimeError(f'download failed: {last!r}')

          def make_digest(filename: str, title: str, broker: str, analysts: str,
                          date: str, indexed_pages: int, source: str,
                          sections: list[tuple[str,str]]) -> int:
              body = ''.join(f'<h2>{html.escape(h)}</h2><p>{html.escape(p)}</p>' for h,p in sections)
              doc = f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
              @page {{ size:A4; margin:17mm 16mm 19mm; @bottom-center {{ content:counter(page); font-size:9pt; color:#666; }} }}
              body {{ font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif; font-size:10.5pt; line-height:1.72; color:#111; }}
              h1 {{ font-size:18pt; line-height:1.4; margin:0 0 7mm; }}
              h2 {{ font-size:13pt; line-height:1.45; margin:6mm 0 2.5mm; page-break-after:avoid; }}
              p {{ margin:0 0 4mm; text-align:justify; orphans:3; widows:3; }}
              .meta {{ border-top:1px solid #555; border-bottom:1px solid #aaa; padding:3mm 0; margin-bottom:5mm; font-size:9.3pt; line-height:1.65; }}
              .notice {{ background:#f2f2f2; border-left:3px solid #777; padding:3.5mm 4mm; margin-bottom:6mm; font-size:9pt; }}
              .source {{ border-top:1px solid #bbb; padding-top:4mm; margin-top:7mm; word-break:break-all; font-size:8.5pt; color:#555; }}
              </style></head><body>
              <h1>{html.escape(title)}</h1>
              <div class="meta">公司：宁波华翔（002048）<br>券商：{html.escape(broker)}<br>分析师：{html.escape(analysts)}<br>发布日期：{date}<br>原报告公开索引页数：{indexed_pages}页<br>当前文件：公开摘要精读版</div>
              <div class="notice"><strong>版本说明：</strong>原始附件在公开平台需要登录、积分或会员权限。本文件仅依据无需登录即可查看的报告介绍、核心结论及公开索引信息归纳生成，不是券商原始PDF，不包含原报告完整图表、附录和逐页正文。</div>
              {body}
              <div class="source">公开信息页：{html.escape(source)}<br>资料仅供研究参考，不构成投资建议。</div>
              </body></html>'''
              path = out / filename
              HTML(string=doc, base_url=source).write_pdf(path)
              pages = len(PdfReader(str(path), strict=False).pages)
              if pages < 2:
                  raise RuntimeError(f'digest too short: {filename}, pages={pages}')
              print('DIGEST', filename, 'pages=', pages, 'bytes=', path.stat().st_size)
              return pages

          records = []

          # 1. Publicly downloadable original 33-page Sinolink Securities PDF.
          original_url = 'https://pdf.dfcfw.com/pdf/H3_AP202506271698458026_1.pdf'
          info_url = 'https://data.eastmoney.com/report/info/AP202506271698458026.html'
          r = download_pdf(original_url, info_url)
          original_name = '01_国金证券_宁波华翔首次覆盖深度报告_原始PDF_2025-06-26.pdf'
          original_path = out / original_name
          original_path.write_bytes(r.content)
          original_pages = len(PdfReader(str(original_path), strict=False).pages)
          if original_pages != 33:
              raise RuntimeError(f'Unexpected original page count: {original_pages}')
          records.append({
              'order':1, 'file':original_name, 'broker':'国金证券', 'date':'2025-06-26',
              'title':'宁波华翔首次覆盖深度报告', 'status':'券商原始完整PDF',
              'indexed_pages':33, 'current_pages':original_pages, 'source':r.url,
          })
          print('ORIGINAL', original_name, 'pages=', original_pages, 'bytes=', len(r.content), 'url=', r.url)

          zt_title = '革故鼎新稳根基，从汽车零部件到机器人全栈供应商'
          zt_source = 'https://www.nxny.com/report/view_6304571.html'
          zt_sections = [
              ('报告定位与核心判断','中泰证券将宁波华翔视为正在完成资产质量修复、客户结构升级并培育第二增长曲线的全球化汽车零部件企业。公开摘要同时讨论传统汽车内外饰、金属件和电子件业务，以及机器人整机装配、关节模组和PEEK轻量化材料。报告认为，欧洲亏损资产退出后，利润表可读性和资源配置效率有望改善，汽车主业修复与机器人业务进展可能共同推动估值重构。'),
              ('海外业务调整与盈利修复','公司在2025年完成欧洲主要亏损主体剥离，处置事项对当期归母利润形成一次性影响，但持续经营负担随之下降。北美业务经营性亏损已有收窄迹象，东南亚基地保持相对稳定。报告更关注剥离后的正常化盈利能力，并把2026年一季度利润率变化视为经营修复的早期观察指标；海外改善速度、汇率以及客户需求仍是重要不确定因素。'),
              ('汽车主业的客户与产品逻辑','公司汽车业务覆盖内饰件、外饰件、金属结构件和电子件。报告认为，公司一方面依靠大众、宝马、奔驰等客户维持制造与质量基础，另一方面持续提高比亚迪、奇瑞、吉利、赛力斯、小米和理想等自主品牌客户占比。智能座舱配置升级、轻量化需求和大总成供货能力有助于提升单车价值量，新建产能则需要依靠已获定点项目逐步释放。'),
              ('机器人与PEEK材料增长曲线','与智元机器人的合作被视为公司从汽车零部件向机器人硬件平台延伸的重要抓手。公司利用精密制造、系统集成、供应链管理和规模化装配经验切入整机及关节模组生产，并布局PEEK材料一体化产能。机器人交付规模、产线爬坡、PEEK成本控制和终端应用验证是该业务兑现的关键变量，现阶段仍需观察客户订单和量产节奏。'),
              ('预测框架与风险','公开摘要以汽车主业修复、机器人放量及PEEK材料降本作为2026—2028年的主要增长驱动。估值结论对新业务进展和利润恢复速度较为敏感。主要风险包括汽车销量与客户项目不及预期、产品降价和原材料成本上升、海外经营改善慢于预期、机器人及PEEK产业化节奏不及预期，以及公开行业数据更新滞后。'),
          ]
          zt_name = '02_中泰证券_革故鼎新稳根基从汽车零部件到机器人全栈供应商_公开摘要精读版_2026-05-28.pdf'
          zt_pages = make_digest(zt_name, zt_title, '中泰证券', '何俊艺、袁泽生', '2026-05-28', 28, zt_source, zt_sections)
          records.append({'order':2,'file':zt_name,'broker':'中泰证券','date':'2026-05-28','title':zt_title,'status':'公开摘要精读版，非券商原始附件','indexed_pages':28,'current_pages':zt_pages,'source':zt_source})

          xb_title = '全面拥抱人形机器人产业，全球PEEK龙头潜力初显'
          xb_source = 'https://www.nxny.com/report/view_6219478.html'
          xb_sections = [
              ('首次覆盖的研究主线','西部证券的首次覆盖报告围绕合资品牌销量变化、传统零部件业务的持续成长来源，以及机器人和PEEK材料能否形成新利润中心展开。公开摘要的总体判断是，欧洲亏损资产退出后公司盈利能力有望回到更正常水平，自主品牌客户扩张可部分对冲合资客户需求波动，智能底盘、机器人和新材料布局则提供中长期成长弹性。'),
              ('欧洲业务剥离后的经营质量','公司过去的欧洲业务长期承受较高成本和亏损压力，对合并利润形成拖累。报告认为，相关资产剥离后，短期处置损失与收入出表会扰动财务数据，但后续利润质量和管理效率有望改善。判断修复是否成立，需要结合国内业务毛利率、北美业务减亏、经营现金流和扣非利润变化，不能只观察一次性归母利润增速。'),
              ('自主品牌与智能底盘布局','公司正在提高自主品牌项目占比，以降低对单一合资客户周期的依赖。除传统内外饰和金属件外，报告重点关注智能底盘等汽车智能化产品。公司能否借助现有整车客户关系、制造体系和本地化服务能力实现国产替代，将决定汽车业务未来的产品升级幅度和单车价值量。'),
              ('机器人合作与PEEK产业化','报告把人形机器人视为公司最具弹性的新增量。公司与智元机器人在合资平台、整机装配、供应链协同、应用场景、产业投资和海外拓展等方面合作，并规划PEEK材料产能。汽车制造积累可迁移到机器人装配和零部件生产，但新业务的竞争壁垒最终仍取决于良率、成本、交付规模、材料认证及稳定客户订单。'),
              ('估值方法与风险提示','公开摘要采用预期利润和目标市盈率进行估值，并给予首次覆盖判断。该估值对欧洲业务退出后的利润恢复、智能底盘进展和机器人业务放量较为敏感。主要风险包括汽车行业景气度下降、海外业务改善不及预期、新业务拓展慢于计划、PEEK产能利用率不足、客户集中度以及公开行业数据更新不及时。'),
          ]
          xb_name = '03_西部证券_全面拥抱人形机器人产业全球PEEK龙头潜力初显_公开摘要精读版_2026-02-13.pdf'
          xb_pages = make_digest(xb_name, xb_title, '西部证券', '齐天翔、张磊', '2026-02-13', 30, xb_source, xb_sections)
          records.append({'order':3,'file':xb_name,'broker':'西部证券','date':'2026-02-13','title':xb_title,'status':'公开摘要精读版，非券商原始附件','indexed_pages':30,'current_pages':xb_pages,'source':xb_source})

          lines = [
              '宁波华翔（002048）券商研究资料包',
              '整理日期：2026-10-28', '',
              '重要版本说明：',
              '1. 国金证券报告为公开渠道直接下载的券商原始完整PDF，共33页。',
              '2. 中泰证券28页深度覆盖报告、西部证券30页首次覆盖报告的原始附件需要登录、积分或会员权限；本包未绕过访问控制。',
              '3. 后两份文件根据公开报告介绍与核心观点归纳，属于公开摘要精读版，不是券商原始PDF，未包含原报告完整图表、附录和逐页正文。',
              '4. 资料仅供研究参考，不构成投资建议。', '', '文件清单：',
          ]
          sums = []
          total_pages = total_bytes = 0
          for rec in records:
              path = out / rec['file']
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              total_pages += rec['current_pages']; total_bytes += len(data)
              lines += [
                  f"- {path.name}",
                  f"  券商：{rec['broker']}；发布日期：{rec['date']}",
                  f"  标题：{rec['title']}",
                  f"  文件性质：{rec['status']}",
                  f"  原报告公开索引页数：{rec['indexed_pages']}；当前文件页数：{rec['current_pages']}",
                  f"  公开来源：{rec['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {path.name}')
          lines += ['', f'当前3份PDF合计页数：{total_pages}页。', f'当前PDF合计大小：{total_bytes}字节。', '全部文件均已通过PDF文件头、文件大小、结构完整性、实际页数及首末页渲染检查。']
          (out/'00_文件清单与版本说明.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n', encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 70000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 2
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '宁波华翔电子股份有限公司|宁波华翔' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/nbhx_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          test "$(pdfinfo "$PACKAGE/01_国金证券_宁波华翔首次覆盖深度报告_原始PDF_2025-06-26.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 33

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Ningbo-Huaxiang-002048-broker-research-package-3-v3
          path: 宁波华翔_002048_券商研究资料_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
