name: Ningbo Port Official Filings Package

on:
  push:
    branches:
      - chatgpt-ningboport-filings-20260927
    paths:
      - .github/workflows/ningboport_filings_20260927.yml
      - scripts/build_ningboport_sina_fallback.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pillow

      - name: Fix list-item matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_ningboport_sina_fallback.py')
          text = path.read_text(encoding='utf-8')
          old = '        blob = f"{rec[\'text\']} {rec[\'context\']}"\n'
          new = '        blob = rec[\'text\']\n'
          if old not in text:
              raise RuntimeError('Expected list-matching line was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Download, validate, and package reports
        run: python scripts/build_ningboport_sina_fallback.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: ningboport-official-filings-package
          path: |
            output/宁波港_2020-2025年报_2026年第一季度报告.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
