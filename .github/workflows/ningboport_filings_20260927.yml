name: Ningbo Port Official Filings Package

on:
  push:
    branches:
      - chatgpt-ningboport-filings-20260927
    paths:
      - .github/workflows/ningboport_filings_20260927.yml
      - scripts/build_ningboport_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Add SSE challenge-cookie support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_ningboport_filings.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from urllib.parse import urljoin\n',
              'from urllib.parse import urljoin, urlsplit\n',
          )
          old = '''def request(url: str, *, params=None, timeout: int = 120):
    last = None
    for attempt in range(5):
        try:
            response = SESSION.get(url, params=params, timeout=timeout, allow_redirects=True)
            print("FETCH", response.status_code, len(response.content), response.url)
            if response.status_code == 200:
                return response
            last = RuntimeError(f"HTTP {response.status_code}: {response.url}")
        except Exception as exc:
            last = exc
        time.sleep(min(12, 2**attempt))
    raise RuntimeError(f"Failed to fetch {url}: {last}")
'''
          new = '''ACW_POSITIONS = [
    15, 35, 29, 24, 33, 16, 1, 38, 10, 9, 19, 31, 40, 27, 22, 23,
    25, 13, 6, 11, 39, 18, 20, 8, 14, 21, 32, 26, 2, 30, 7, 4, 17,
    5, 3, 28, 34, 37, 12, 36,
]
ACW_MASK = "3000176000856006061501533003690027800375"


def calc_acw_sc_v2(html: str):
    match = re.search(r"arg1=['\\\"]([0-9A-Fa-f]+)['\\\"]", html)
    if not match:
        return None
    arg1 = match.group(1)
    if len(arg1) < max(ACW_POSITIONS):
        return None
    reordered = ''.join(arg1[position - 1] for position in ACW_POSITIONS)
    output = []
    for index in range(0, min(len(reordered), len(ACW_MASK)), 2):
        output.append(f"{int(reordered[index:index+2], 16) ^ int(ACW_MASK[index:index+2], 16):02x}")
    return ''.join(output)


def request(url: str, *, params=None, timeout: int = 120):
    last = None
    for attempt in range(5):
        try:
            response = SESSION.get(url, params=params, timeout=timeout, allow_redirects=True)
            print("FETCH", response.status_code, len(response.content), response.url)
            if response.status_code == 200:
                body = response.content
                if body.startswith(b"%PDF-"):
                    return response
                content_type = response.headers.get('content-type', '').lower()
                if 'html' in content_type or body.lstrip().startswith(b'<'):
                    cookie_value = calc_acw_sc_v2(response.text)
                    if cookie_value:
                        host = urlsplit(response.url).hostname or 'static.sse.com.cn'
                        SESSION.cookies.set('acw_sc__v2', cookie_value, domain=host, path='/')
                        SESSION.cookies.set('acw_sc__v2', cookie_value, domain='.sse.com.cn', path='/')
                        retry = SESSION.get(
                            response.url,
                            headers={'Referer': response.url},
                            timeout=timeout,
                            allow_redirects=True,
                        )
                        print("FETCH_AFTER_ACW", retry.status_code, len(retry.content), retry.url)
                        if retry.status_code == 200:
                            return retry
                return response
            last = RuntimeError(f"HTTP {response.status_code}: {response.url}")
        except Exception as exc:
            last = exc
        time.sleep(min(12, 2**attempt))
    raise RuntimeError(f"Failed to fetch {url}: {last}")
'''
          if old not in text:
              raise RuntimeError('Expected request function block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Download, validate, and package official filings
        run: python scripts/build_ningboport_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: ningboport-official-filings-package
          path: |
            output/宁波港_2020-2025年报_2026年第一季度报告.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
