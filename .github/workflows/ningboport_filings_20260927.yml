name: Ningbo Port Official Filings Package

on:
  push:
    branches:
      - chatgpt-ningboport-filings-20260927
    paths:
      - .github/workflows/ningboport_filings_20260927.yml
      - scripts/build_ningboport_filings.py
      - scripts/run_ningboport_with_acw.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, and package official filings
        run: python scripts/run_ningboport_with_acw.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: ningboport-official-filings-package
          path: |
            output/宁波港_2020-2025年报_2026年第一季度报告.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
