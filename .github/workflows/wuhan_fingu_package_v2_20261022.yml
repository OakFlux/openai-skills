name: Inspect KXJSKT report endpoints 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_package_v2_20261022.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet selenium requests beautifulsoup4 lxml
      - name: Inspect page and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/scripts
          python - <<'PY'
          import json, os, time, re, requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          target='https://www.kxjskt.com/wap/news/index.html'
          o=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1920,3000','--lang=zh-CN','--ignore-certificate-errors']:
              o.add_argument(a)
          o.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36')
          o.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=o); d.set_page_load_timeout(60)
          d.get(target); time.sleep(10)
          print('PAGE',d.current_url,d.title,flush=True)
          source=d.page_source
          open('out/page.html','w',encoding='utf-8').write(source)
          d.save_screenshot('out/page.png')
          items=[]
          for sel,attr in [('a','href'),('script','src'),('link','href'),('img','src'),('iframe','src')]:
              for e in d.find_elements(By.CSS_SELECTOR,sel):
                  v=e.get_attribute(attr)
                  if v:
                      items.append({'tag':sel,'url':v,'text':(e.text or '')[:500],'outer':e.get_attribute('outerHTML')[:1200]})
          json.dump(items,open('out/dom.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          net=[]
          for item in d.get_log('performance'):
              try:
                  m=json.loads(item['message'])['message']; method=m.get('method'); p=m.get('params',{}); obj=p.get('request') or p.get('response') or {}; u=obj.get('url')
                  if u: net.append({'method':method,'url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')})
              except Exception:
                  pass
          json.dump(net,open('out/network.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          cookies={c['name']:c['value'] for c in d.get_cookies()}; d.quit()
          print('DOM_COUNT',len(items),'NET_COUNT',len(net),flush=True)
          for x in net:
              if any(k in x['url'].lower() for k in ['api','json','pdf','report','download','news']):
                  print('NET',json.dumps(x,ensure_ascii=False),flush=True)
          for x in items:
              blob=(x.get('url','')+' '+x.get('text','')).lower()
              if any(k in blob for k in ['api','pdf','report','download','研报']):
                  print('DOM',json.dumps(x,ensure_ascii=False),flush=True)

          s=requests.Session(); s.trust_env=False; s.cookies.update(cookies)
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':target}
          scripts=[x['url'] for x in items if x['tag']=='script']
          script_index=[]
          for i,u in enumerate(scripts):
              try:
                  r=s.get(u,headers=h,timeout=(15,60)); text=r.text
                  open(f'out/scripts/{i}.js','w',encoding='utf-8',errors='replace').write(text)
                  hits=[p for p in ['fetch(', 'axios', '/api/', '.pdf', 'download', 'report', 'stockCode', 'search'] if p.lower() in text.lower()]
                  rec={'index':i,'url':u,'status':r.status_code,'bytes':len(r.content),'hits':hits}
                  script_index.append(rec); print('SCRIPT',json.dumps(rec,ensure_ascii=False),flush=True)
                  for line in text.splitlines():
                      low=line.lower()
                      if any(p in low for p in ['/api/','.pdf','download','stockcode','reportapi','search']):
                          print('JS_LINE',i,line[:3000],flush=True)
              except Exception as e:
                  script_index.append({'index':i,'url':u,'error':repr(e)})
          json.dump(script_index,open('out/script_index.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kxjskt-wuhan-fingu-inspection
          path: out
          retention-days: 3
          if-no-files-found: error
