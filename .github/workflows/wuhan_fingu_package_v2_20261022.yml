name: Lean browser inspection Wuhan Fingu 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_package_v2_20261022.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - run: python -m pip install --quiet selenium requests beautifulsoup4 lxml
      - name: Capture pages and resource URLs
        shell: bash
        run: |
          set -u
          mkdir -p out/pages out/screens out/json out/downloads
          python - <<'PY'
          import os,json,time,re,html,urllib.parse,traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          OUT=os.path.abspath('out');DL=os.path.join(OUT,'downloads')
          targets=[
            ('sg_report','https://www.sgpjbg.com/baogao/16990.html'),
            ('sg_down','https://www.sgpjbg.com/bgdown/16990.html'),
            ('fx_guoxin','https://www.fxbaogao.com/detail/1785728'),
            ('jf_haitong','https://www.9fzt.com/detail/sz_002194_10_650430884853.html'),
          ]
          o=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1920,3000','--lang=zh-CN','--ignore-certificate-errors','--disable-popup-blocking','--disable-blink-features=AutomationControlled']:
            o.add_argument(a)
          o.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36')
          o.add_experimental_option('prefs',{'download.default_directory':DL,'download.prompt_for_download':False,'plugins.always_open_pdf_externally':True})
          o.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=o);d.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':DL});d.set_page_load_timeout(55)
          summary=[]
          for name,url in targets:
            rec={'name':name,'requested':url}
            try:
              print('OPEN',name,url,flush=True);d.get(url);time.sleep(7)
              rec.update(current=d.current_url,title=d.title)
              src=d.page_source
              open(f'out/pages/{name}.html','w',encoding='utf-8',errors='replace').write(src)
              d.save_screenshot(f'out/screens/{name}.png')
              dom=[]
              for sel,attr in [('a','href'),('img','src'),('iframe','src'),('embed','src'),('object','data'),('script','src'),('link','href')]:
                for e in d.find_elements(By.CSS_SELECTOR,sel):
                  v=e.get_attribute(attr)
                  if v:dom.append({'tag':sel,'attr':attr,'url':v,'text':(e.text or '')[:300],'class':e.get_attribute('class')})
              json.dump(dom,open(f'out/json/{name}_dom.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
              perf=[]
              for item in d.get_log('performance'):
                try:
                  m=json.loads(item['message'])['message'];method=m.get('method');p=m.get('params',{});obj=p.get('request') or p.get('response') or {};u=obj.get('url')
                  if u:perf.append({'method':method,'url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')})
                except:pass
              json.dump(perf,open(f'out/json/{name}_network.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
              rec['dom_count']=len(dom);rec['network_count']=len(perf)
              # Record candidate controls, but do not click login/paywall controls.
              controls=[]
              for e in d.find_elements(By.XPATH,"//*[self::a or self::button or @role='button']"):
                txt=(e.text or '').strip();href=e.get_attribute('href')
                if any(k in txt for k in ['下载','完整报告','查看报告','免费查看','PDF']):controls.append({'text':txt[:300],'href':href,'outer':e.get_attribute('outerHTML')[:1500]})
              json.dump(controls,open(f'out/json/{name}_controls.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
              print('DONE',name,d.current_url,d.title,'dom',len(dom),'net',len(perf),'controls',len(controls),flush=True)
            except Exception as e:
              rec['error']=repr(e);rec['traceback']=traceback.format_exc();print('ERR',name,repr(e),flush=True)
            summary.append(rec)
          json.dump(summary,open('out/summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          d.quit()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuhan-fingu-lean-browser-inspection
          path: out
          retention-days: 7
          if-no-files-found: error
