name: Build corrected Wuhan Fingu report archive 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_package_v2_20261022.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Download and validate Wuhan Fingu reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          import os, re, json, hashlib, zipfile
          import requests
          from pypdf import PdfReader

          OUT='out'; PDFDIR=os.path.join(OUT,'pdfs')
          s=requests.Session(); s.trust_env=False
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/002194.html','Accept':'*/*'}
          params={
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
              'beginTime':'2000-01-01','endTime':'2030-01-01','pageNo':'1','fields':'','qType':'0',
              'orgCode':'','code':'002194','rcode':'','p':'1','pageNum':'1','pageNumber':'1'
          }
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,headers=headers,timeout=(15,60))
          print('LIST',r.status_code,len(r.content),r.url,r.text[:200])
          r.raise_for_status(); obj=r.json(); rows=obj.get('data') or []
          print('HITS',obj.get('hits'),'ROWS',len(rows))
          with open(os.path.join(OUT,'api_response.json'),'w',encoding='utf-8') as f: json.dump(obj,f,ensure_ascii=False,indent=2)

          def getv(row,*keys):
              for k in keys:
                  v=row.get(k)
                  if v not in (None,''): return str(v)
              return ''
          def safe(sv):
              sv=re.sub(r'[\\/:*?"<>|]+','_',sv); sv=re.sub(r'\s+',' ',sv).strip()
              return sv[:150]

          manifest=[]
          for row in rows:
              stock=getv(row,'stockCode','SECURITY_CODE')
              name=getv(row,'stockName','SECURITY_NAME_ABBR')
              title=getv(row,'title','TITLE')
              org=getv(row,'orgSName','ORG_SNAME')
              date=getv(row,'publishDate','REPORT_DATE')[:10]
              code=getv(row,'infoCode','INFO_CODE')
              print('ROW',date,stock,name,org,title,code,'attachPages=',row.get('attachPages'))
              if stock != '002194' and name != '武汉凡谷':
                  print('SKIP_WRONG_COMPANY'); continue
              if not code: continue
              url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'
              try:
                  rr=s.get(url,headers=headers,timeout=(15,60),allow_redirects=True)
                  data=rr.content
              except Exception as e:
                  print('DOWNLOAD_ERROR',url,repr(e)); continue
              print('PDF_GET',rr.status_code,len(data),rr.headers.get('content-type',''),rr.url)
              if not data.startswith(b'%PDF') or len(data)<20000: continue
              fn=safe(f'{date}_{org}_{title}')+'.pdf'
              path=os.path.join(PDFDIR,fn)
              with open(path,'wb') as f:f.write(data)
              try:
                  reader=PdfReader(path); pages=len(reader.pages)
                  text='\n'.join((reader.pages[i].extract_text() or '') for i in range(min(3,pages)))[:12000]
              except Exception as e:
                  print('PDF_PARSE_ERROR',repr(e)); os.remove(path); continue
              verified=('武汉凡谷' in text or '002194' in text or '武漢凡谷' in text)
              if not verified:
                  print('VERIFY_FAILED',fn,text[:300]); os.remove(path); continue
              rec={
                  'filename':fn,'date':date,'broker':org,'title':title,'stock_code':stock,'stock_name':name,
                  'info_code':code,'pages':pages,'attach_pages':row.get('attachPages'),'size_bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),'source_url':url,'rating':row.get('emRatingName'),
                  'rating_change':row.get('ratingChangeName'),'researcher':row.get('researcher') or row.get('author')
              }
              manifest.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False))

          manifest.sort(key=lambda x:(x['date'],x['pages']),reverse=True)
          with open(os.path.join(OUT,'manifest_all.json'),'w',encoding='utf-8') as f: json.dump(manifest,f,ensure_ascii=False,indent=2)
          lines=['# 武汉凡谷（002194）公开券商公司研究报告','',f'已验证完整PDF：{len(manifest)}份','']
          for i,x in enumerate(manifest,1):
              lines += [f'## {i}. {x["title"]}',f'- 券商：{x["broker"]}',f'- 日期：{x["date"]}',f'- 页数：{x["pages"]}',f'- 文件：{x["filename"]}',f'- SHA-256：{x["sha256"]}','']
          lines += ['验证标准：文件头为PDF；可正常解析页数；前三页可识别“武汉凡谷”或证券代码“002194”。','来源为东方财富公开研报接口与公开PDF附件，不涉及登录、付费墙或验证码绕过。']
          with open(os.path.join(OUT,'README.md'),'w',encoding='utf-8') as f:f.write('\n'.join(lines))
          zipname='武汉凡谷_券商研究报告_全部公开可验证文件.zip'
          with zipfile.ZipFile(zipname,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(os.path.join(OUT,'manifest_all.json'),'manifest_all.json')
              z.write(os.path.join(OUT,'README.md'),'README.md')
              for x in manifest:z.write(os.path.join(PDFDIR,x['filename']),x['filename'])
          print('FINAL',len(manifest),zipname,os.path.getsize(zipname))
          if not manifest: raise SystemExit('No verified Wuhan Fingu PDF found')
          PY

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-reports-v2-20261022
          path: |
            武汉凡谷_券商研究报告_全部公开可验证文件.zip
            out
          retention-days: 7
          if-no-files-found: error
