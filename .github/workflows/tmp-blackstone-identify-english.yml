name: Temporary identify English Blackstone research note

on:
  push:
    branches:
      - tmp/blackstone-broker-reports-20260829
    paths:
      - .github/workflows/tmp-blackstone-identify-english.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests Pillow
      - name: Inspect full extracted text and first page image
        run: |
          python - <<'PY'
          import io, json, re
          from pathlib import Path
          import requests
          from PIL import Image

          out=Path('english_note_check'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          d=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':267064},timeout=60).json()
          detail=(d.get('data') or {}) if d.get('status')==1 else {}
          content=str(detail.get('content') or '')
          print('DETAIL_KEYS',sorted(detail.keys()))
          print('META',json.dumps({k:detail.get(k) for k in ['name','time_text','page_count','file_size','page_url','data_source_uuid','original_id','online_url']},ensure_ascii=False))
          print('CONTENT_LENGTH',len(content))
          print('CONTENT_HEAD',content[:12000])
          print('CONTENT_TAIL',content[-12000:])
          institutions=['Goldman Sachs','Morgan Stanley','J.P. Morgan','JPMorgan','Bank of America','BofA','Barclays','UBS','Credit Suisse','Citigroup','Citi','Wells Fargo','Jefferies','Deutsche Bank','Evercore','Keefe Bruyette','KBW','Piper Sandler','RBC Capital Markets','Oppenheimer','William Blair']
          print('INSTITUTION_HITS',json.dumps({x:len(re.findall(re.escape(x),content,re.I)) for x in institutions if re.search(re.escape(x),content,re.I)},ensure_ascii=False))
          for pat in [r'Analyst[^\n]{0,300}',r'[A-Z][a-z]+\s+[A-Z][a-z]+\s*\|\s*[^\n]{0,150}',r'Equity Research[^\n]{0,300}',r'Investment Research[^\n]{0,300}',r'Disclosures?[^\n]{0,500}',r'Copyright[^\n]{0,500}']:
              matches=re.findall(pat,content,re.I)
              print('PATTERN',pat,'COUNT',len(matches))
              for m in matches[:20]: print('MATCH',m)
          (out/'full_content.txt').write_text(content,encoding='utf-8')
          base=detail.get('page_url') or 'https://oss.sdyanbao.com/page/2022/8/4/331972'
          for idx in [0,1,11]:
              r=s.get(f'{base}/{idx}.png',timeout=60)
              print('IMAGE',idx,r.status_code,len(r.content),r.headers.get('content-type'))
              if r.status_code==200 and len(r.content)>10000:
                  with Image.open(io.BytesIO(r.content)) as im:
                      im.load(); print('DIMS',idx,im.size,im.format)
                      im.save(out/f'page_{idx+1}.png')
          PY
      - name: Upload check
        uses: actions/upload-artifact@v4
        with:
          name: blackstone-english-note-check
          path: english_note_check/
          retention-days: 1
          if-no-files-found: error
