name: Probe public Hengbo report download links

on:
  push:
    paths:
      - '.github/workflows/hengbo-probe-public-report-links-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect public report pages and assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import html
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls = [
              'https://www.fxbaogao.com/detail/5464623',
              'https://www.fxbaogao.com/view?id=5464623',
              'https://www.fxbaogao.com/detail/5106156',
              'https://www.fxbaogao.com/view?id=5106156',
              'https://www.fhyanbao.com/rpview/1920166',
          ]

          discovered_scripts = []
          for url in urls:
              try:
                  response = session.get(url, timeout=(25, 180), allow_redirects=True)
                  print('\n=== PAGE ===', url, response.status_code, response.url, len(response.content), response.headers.get('content-type'), flush=True)
                  text = response.text
                  soup = BeautifulSoup(text, 'html.parser')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
                  for tag in soup.find_all(['a','img','script','iframe','embed','object','source','link']):
                      label = ' '.join(tag.get_text(' ', strip=True).split())[:160]
                      for attr in ('href','src','data','content'):
                          value = tag.get(attr)
                          if not value:
                              continue
                          absolute = urljoin(response.url, value)
                          combined = (label + ' ' + absolute).lower()
                          if tag.name == 'script' and attr == 'src':
                              discovered_scripts.append(absolute)
                          if any(word in combined for word in (
                              '.pdf','download','down','file','report','preview','view','attachment',
                              'image','page','api','oss','cos','static','cdn','original'
                          )):
                              print('TAG', tag.name, attr, repr(label), absolute, flush=True)
                  for line in text.splitlines():
                      low = line.lower()
                      if any(word in low for word in (
                          '.pdf','download','reporturl','fileurl','pdfurl','attachment',
                          'previewurl','pages','pagecount','oss','cos','cdn','api/'
                      )):
                          print('LINE', ' '.join(html.unescape(line).split())[:4000], flush=True)
                  for match in re.findall(r'https?://[^\"\'<>\s]+', text):
                      clean = html.unescape(match).replace('\\/','/')
                      if any(word in clean.lower() for word in ('.pdf','download','file','report','preview','oss','cos','cdn')):
                          print('RAWURL', clean[:2000], flush=True)
              except Exception as exc:
                  print('PAGE_ERROR', url, repr(exc), flush=True)

          seen = set()
          for script_url in discovered_scripts:
              if script_url in seen:
                  continue
              seen.add(script_url)
              try:
                  response = session.get(script_url, timeout=(25, 180))
                  print('\n=== SCRIPT ===', script_url, response.status_code, len(response.content), flush=True)
                  if response.status_code != 200 or len(response.content) > 12_000_000:
                      continue
                  text = response.text
                  keywords = ['download','pdf','report','detail','view','file','preview','attachment']
                  for keyword in keywords:
                      positions = [m.start() for m in re.finditer(keyword, text, re.I)]
                      for position in positions[:15]:
                          start = max(0, position - 350)
                          end = min(len(text), position + 700)
                          print('SNIP', keyword, ' '.join(text[start:end].split())[:1200], flush=True)
              except Exception as exc:
                  print('SCRIPT_ERROR', script_url, repr(exc), flush=True)
          PY
