name: Package Guanglian Aviation 300900 broker deep reports

on:
  push:
    paths:
      - '.github/workflows/guanglian-300900-broker-deep-reports-20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '广联航空'
          FULL_COMPANY = '广联航空工业股份有限公司'
          CODE = '300900'
          CUTOFF = '2026-10-29'
          CUTOFF_COMPACT = '20261029'
          ROOT_NAME = f'{COMPANY}_{CODE}_券商深度报告_精选2份_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          REPORT_DIR = ROOT / '报告PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          DIST = Path('dist')
          for directory in (REPORT_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          REPORTS = [
              {
                  'filename': '01_民生证券_2023-12-07_首次覆盖_航空航天制造全产业链布局_内生外延拓宽成长边界.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202312061613500749_1.pdf',
                  'referer': 'https://data.eastmoney.com/report/info/AP202312061613500749.html',
                  'broker': '民生证券',
                  'date': '2023-12-07',
                  'title': '航空航天制造全产业链布局，“内生+外延”拓宽成长边界',
                  'authors': '尹会伟、孔厚融、赵博轩、冯鑫',
                  'rating': '推荐（首次）',
                  'report_type': '首次覆盖报告',
                  'expected_pages': 24,
              },
              {
                  'filename': '02_东莞证券_2022-12-28_深度报告_积极布局航空产业链_未来成长可期.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202212281581432136_1.pdf',
                  'referer': 'https://data.eastmoney.com/report/info/AP202212281581432136.html',
                  'broker': '东莞证券',
                  'date': '2022-12-28',
                  'title': '积极布局航空产业链，未来成长可期',
                  'authors': '吕子炜',
                  'rating': '谨慎推荐（首次）',
                  'report_type': '公司深度报告',
                  'expected_pages': 26,
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=1.0,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}),
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          def safe_name(value: str) -> str:
              return re.sub(r'_+', '_', re.sub(r'[\\/:*?"<>|]', '_', value)).strip('_. ')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          records = []
          for report in REPORTS:
              response = session.get(
                  report['url'],
                  headers={'Referer': report['referer']},
                  timeout=240,
                  allow_redirects=True,
              )
              print('DOWNLOAD', response.status_code, len(response.content), report['url'], '->', response.url)
              response.raise_for_status()
              if len(response.content) < 100_000 or not response.content.startswith(b'%PDF'):
                  raise RuntimeError(f"Not a complete PDF: {report['url']} size={len(response.content)} head={response.content[:20]!r}")

              destination = REPORT_DIR / safe_name(report['filename'])
              destination.write_bytes(response.content)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception as exc:
                      raise RuntimeError(f'Encrypted PDF cannot be opened: {destination}: {exc}')
              page_count = len(reader.pages)
              if page_count != report['expected_pages']:
                  raise RuntimeError(f"Unexpected page count for {destination}: expected={report['expected_pages']} actual={page_count}")

              pdf = fitz.open(destination)
              if pdf.page_count != page_count:
                  raise RuntimeError(f'PDF parser page mismatch: {destination}: pypdf={page_count}, fitz={pdf.page_count}')
              first_pixmap = pdf.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_pixmap = pdf.load_page(pdf.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first_pixmap.width, first_pixmap.height, last_pixmap.width, last_pixmap.height) < 100:
                  raise RuntimeError(f'PDF render validation failed: {destination}')
              first_pixmap.save(PREVIEW_DIR / f'{destination.stem}.png')

              probe = ''
              for page_index in range(min(10, pdf.page_count)):
                  try:
                      probe += pdf.load_page(page_index).get_text('text')
                  except Exception:
                      pass
              pdf.close()
              compact = re.sub(r'\s+', '', probe)
              if COMPANY not in compact and FULL_COMPANY not in compact and CODE not in compact:
                  raise RuntimeError(f'Company identity not found in PDF: {destination}')
              broker_key = report['broker'].replace('证券', '')
              if broker_key not in compact and report['broker'] not in compact:
                  raise RuntimeError(f'Broker identity not found in PDF: {destination}')

              first_page_text = ''
              try:
                  first_page_text = reader.pages[0].extract_text() or ''
              except Exception:
                  pass

              record = {
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'rating': report['rating'],
                  'report_type': report['report_type'],
                  'source_url': report['url'],
                  'resolved_url': response.url,
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': sha256(destination),
                  'first_page_text_excerpt': re.sub(r'\s+', ' ', first_page_text).strip()[:1800],
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
                  'broker_identity_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'selection_note': '收录两份公开可完整取得、篇幅较长的首次覆盖或公司深度报告。',
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）券商深度报告精选',
              '',
              f'- 截止日期：{CUTOFF}',
              '- 共2份公开可完整取得的首次覆盖或公司深度报告。',
              '- 所有PDF均保留原始内容，未合并、删页或重排。',
              '- 已完成PDF文件头、双解析器页数、公司与券商身份、首末页渲染、SHA-256及ZIP CRC校验。',
              '',
              '## 文件清单',
              '',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 机构：{record['broker']}；日期：{record['date']}；类型：{record['report_type']}",
                  f"   - 标题：{record['title']}",
                  f"   - 分析师：{record['authors']}；评级：{record['rating']}",
                  f"   - 页数：{record['page_count']}；文件大小：{record['file_size_bytes']:,}字节",
                  f"   - 来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'guanglian_aviation_300900_broker_deep_reports_2_{CUTOFF_COMPACT}.zip'
          for path in (chinese_zip, english_zip):
              if path.exists():
                  path.unlink()

          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad_member = archive.testzip()
                  if bad_member:
                      raise RuntimeError(f'ZIP CRC failure: {path}: {bad_member}')
                  pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdf_members) != 2:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {path}: {len(pdf_members)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256(path))

          print('FINAL_JSON', json.dumps({
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': sha256(chinese_zip),
              'records': records,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: guanglian-300900-broker-deep-reports-20261029
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
