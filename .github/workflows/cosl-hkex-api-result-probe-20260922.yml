name: Inspect COSL HKEX API result 20260922
on:
  push:
    paths:
      - '.github/workflows/cosl-hkex-api-result-probe-20260922.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect result
        run: |
          python - <<'PY'
          import requests, json
          s=requests.Session(); s.trust_env=False; s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=4651&lang=EN'})
          p={'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'4651','documentType':'-1','fromDate':'19990401','toDate':'20260922','title':'','searchType':'0','t1code':'-2','t2Gcode':'-2','t2code':'-2','rowRange':'2500','lang':'E'}
          d=s.get('https://www1.hkexnews.hk/search/titleSearchServlet.do',params=p,timeout=180).json()
          v=d['result']; print('TYPE',type(v).__name__); print('LEN',len(v) if hasattr(v,'__len__') else None); print('SNIP',repr(v)[:10000])
          if isinstance(v,str):
              try:
                  x=json.loads(v); print('PARSED_TYPE',type(x).__name__,'PARSED_LEN',len(x)); print('PARSED_FIRST',json.dumps(x[0],ensure_ascii=False)[:4000])
              except Exception as e: print('JSON_PARSE_ERR',repr(e))
          elif isinstance(v,dict):
              print('DICT_KEYS',list(v)[:30]);
              for k,z in v.items(): print('K',k,'TYPE',type(z).__name__,'SNIP',repr(z)[:1000])
          PY