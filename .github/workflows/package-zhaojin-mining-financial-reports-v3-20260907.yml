name: Package Zhaojin Mining financial reports v3 20260907

on:
  push:
    branches:
      - chatgpt-zhaojin-mining-financial-reports-20260907
    paths:
      - '.github/workflows/package-zhaojin-mining-financial-reports-v3-20260907.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download, strictly validate, and package reports
        shell: bash
        run: |
          set -o pipefail
          python scripts/package_zhaojin_mining_financial_reports_v3_20260907.py 2>&1 | tee zhaojin_mining_packaging_v3.log
      - name: Upload final report package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-mining-2020-2025-annual-and-latest-reports-v3
          path: |
            dist_zhaojin_mining_20260907/*.zip
            dist_zhaojin_mining_20260907/PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-mining-report-packaging-v3-diagnostics
          path: |
            zhaojin_mining_packaging_v3.log
            _work_zhaojin_mining_20260907/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
