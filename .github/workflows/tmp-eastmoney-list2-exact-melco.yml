name: Temporary Exact Eastmoney List2 Melco Query

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-eastmoney-list2-exact-melco.yml

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Query list2 exactly and validate public attachments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io,json,re,time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          OUT=Path('out'); PDFDIR=OUT/'pdfs';PDFDIR.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*','Content-Type':'application/json'})
          codes=['00200','0200','200','HK00200','HK0200','00200.HK','116.00200','116.HK00200','100.00200']
          windows=[('2010-01-01','2026-08-31'),('2024-01-01','2026-08-31')]
          results=[]; matches=[]
          def rows_from(obj):
            if isinstance(obj,list):return obj
            if not isinstance(obj,dict):return []
            d=obj.get('data')
            if isinstance(d,list):return d
            if isinstance(d,dict):
              for k in ['data','dataList','list','rows']:
                if isinstance(d.get(k),list):return d[k]
            r=obj.get('result')
            if isinstance(r,dict):
              for k in ['data','dataList','list','rows']:
                if isinstance(r.get(k),list):return r[k]
            return []
          def is_target(row):
            b=json.dumps(row,ensure_ascii=False).lower()
            return any(k in b for k in ['新濠国际发展','新濠國際發展','melco international']) or str(row.get('stockCode') or row.get('code') or '') in ['00200','0200','HK00200','00200.HK','200']
          for code in codes:
            for begin,end in windows:
              for page in range(1,5):
                payload={
                  'pageSize':500,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,
                  'beginTime':begin,'endTime':end,'code':code,'industryCode':'*',
                  'rating':None,'ratingChange':None,'orgCode':None,'rcode':''
                }
                item={'code':code,'begin':begin,'end':end,'page':page,'payload':payload}
                for attempt in range(1,4):
                  try:
                    r=s.post('https://reportapi.eastmoney.com/report/list2',json=payload,timeout=50)
                    item.update({'status':r.status_code,'url':r.url,'type':r.headers.get('content-type'),'bytes':len(r.content),'head':r.text[:1000]})
                    r.raise_for_status();obj=r.json();rows=rows_from(obj);item['rows']=len(rows);item['hits']=obj.get('hits') if isinstance(obj,dict) else None;item['matches']=[x for x in rows if is_target(x)]
                    results.append(item)
                    for row in item['matches']:
                      key=json.dumps(row,sort_keys=True,ensure_ascii=False)
                      if not any(json.dumps(x,sort_keys=True,ensure_ascii=False)==key for x in matches):matches.append(row)
                    if not rows or len(rows)<500:page=99
                    break
                  except Exception as e:
                    if attempt==3: item['error']=repr(e);results.append(item)
                    time.sleep(attempt)
                if item.get('rows',0)<500:break
          # Also exact-date global list2 requests with code='*' and code=''.
          dates=['2024-08-16','2024-11-06','2025-05-09','2025-08-01','2025-08-04','2025-11-08','2026-04-20']
          for date in dates:
            for code in ['*','']:
              payload={'pageSize':500,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':date,'endTime':date,'code':code,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              try:
                r=s.post('https://reportapi.eastmoney.com/report/list2',json=payload,timeout=50);obj=r.json();rows=rows_from(obj)
                item={'mode':'global','date':date,'code':code,'status':r.status_code,'bytes':len(r.content),'rows':len(rows),'hits':obj.get('hits') if isinstance(obj,dict) else None,'matches':[x for x in rows if is_target(x)],'head':r.text[:1000]}
                results.append(item)
                for row in item['matches']:
                  key=json.dumps(row,sort_keys=True,ensure_ascii=False)
                  if not any(json.dumps(x,sort_keys=True,ensure_ascii=False)==key for x in matches):matches.append(row)
              except Exception as e:results.append({'mode':'global','date':date,'code':code,'error':repr(e)})
          validated=[]
          for row in matches:
            info=str(row.get('infoCode') or row.get('INFO_CODE') or row.get('infocode') or row.get('encodeUrl') or '')
            title=str(row.get('title') or row.get('TITLE') or '')
            broker=str(row.get('orgSName') or row.get('orgName') or '')
            date=str(row.get('publishDate') or row.get('date') or '')[:10]
            urls=[]
            for k in ['attachUrl','pdfUrl','downloadUrl','fileUrl','url']:
              v=row.get(k)
              if isinstance(v,str) and '.pdf' in v.lower():urls.append(('https:'+v) if v.startswith('//') else v.replace('http://','https://',1))
            if info:urls += [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time()*1000)}.pdf']
            rec={'row':row,'infoCode':info,'title':title,'broker':broker,'date':date,'attempts':[],'ok':False}
            for u in dict.fromkeys(urls):
              try:
                r=s.get(u,timeout=80,allow_redirects=True,headers={'Referer':'https://data.eastmoney.com/'});a={'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'head':r.content[:8].hex()}
                if r.status_code==200 and r.content.lstrip().startswith(b'%PDF') and len(r.content)>20000:
                  reader=PdfReader(io.BytesIO(r.content),strict=False);a['pages']=len(reader.pages);first=''
                  try:first=' '.join((reader.pages[0].extract_text() or '').split())[:3000]
                  except Exception:pass
                  a['first']=first;fn=re.sub(r'[^0-9A-Za-z\u4e00-\u9fff._-]+','_',f'{date}_{broker}_{title}_{info}.pdf')[:180];path=PDFDIR/fn;path.write_bytes(r.content)
                  rec.update({'ok':True,'pages':len(reader.pages),'bytes':len(r.content),'pdf_url':r.url,'saved':str(path),'first':first});rec['attempts'].append(a);break
                rec['attempts'].append(a)
              except Exception as e:rec['attempts'].append({'url':u,'error':repr(e)})
            validated.append(rec)
          out={'results':results,'matches':matches,'validated':validated}
          (OUT/'eastmoney_list2_exact.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCHES='+json.dumps(matches,ensure_ascii=False),flush=True)
          print('VALIDATED='+json.dumps([{'infoCode':x['infoCode'],'date':x['date'],'broker':x['broker'],'title':x['title'],'pages':x.get('pages'),'url':x.get('pdf_url')} for x in validated if x.get('ok')],ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eastmoney-list2-exact-melco
          path: out
          retention-days: 3
