name: Probe Shaanxi Jinye archived broker PDF

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Wayback and validate archived PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 - <<'PY'
          import io, json, re, requests
          from pypdf import PdfReader
          from urllib.parse import quote

          targets=[
            'http://www.p5w.net/stock/lzft/gsyj/200908/P020090811538624751351.pdf',
            'https://www.p5w.net/stock/lzft/gsyj/200908/P020090811538624751351.pdf',
            'http://www.hibor.com.cn/docdetail_137827.html',
            'http://www.hibor.com.cn/docdetail_505559.html',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          for target in targets:
            print('\nTARGET',target)
            params={
              'url':target,
              'output':'json',
              'fl':'timestamp,original,mimetype,statuscode,digest,length',
              'filter':['statuscode:200'],
              'collapse':'digest',
              'limit':'50',
            }
            try:
              r=s.get('https://web.archive.org/cdx/search/cdx',params=params,timeout=(20,120))
              print('CDX',r.status_code,len(r.content),r.url,r.text[:2000])
              if not r.ok: continue
              rows=r.json()
              if not rows or len(rows)<2: continue
              hdr=rows[0]
              for row in rows[1:]:
                item=dict(zip(hdr,row))
                ts=item['timestamp']; orig=item['original']; mime=item.get('mimetype','')
                snap=f'https://web.archive.org/web/{ts}id_/{orig}'
                try:
                  x=s.get(snap,timeout=(30,180),allow_redirects=True)
                  data=x.content
                  print('SNAP',ts,mime,x.status_code,len(data),x.url,x.headers.get('content-type'),data[:8])
                  if data.startswith(b'%PDF-'):
                    try:
                      reader=PdfReader(io.BytesIO(data),strict=False)
                      pages=len(reader.pages)
                      text=''.join((p.extract_text() or '') for p in reader.pages)
                      compact=re.sub(r'\s+','',text)
                      print('PDF_OK pages=',pages,'company=',('陕西金叶' in compact or '000812' in compact),'text_chars=',len(compact))
                      open('/tmp/archived_report.pdf','wb').write(data)
                    except Exception as e:
                      print('PDF_PARSE_ERROR',repr(e))
                except Exception as e:
                  print('SNAP_ERROR',repr(e))
            except Exception as e:
              print('CDX_ERROR',repr(e))
          PY
