name: Build corrected Yuexiu report previews

on:
  push:
    branches:
      - tmp-yuexiu-preview-white-20260905

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Build white-background PDF previews
        run: |
          python -m pip install --quiet requests pillow pypdf
          mkdir -p output
          cat > /tmp/build_previews.py <<'PY'
          import hashlib, io, json, zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          reports=[
            {'id':'4734664','date':'2025-03-17','broker':'东兴证券','title':'越秀交通基建：平临高速将增厚25年业绩，收费权摊销略高于预期','base':'https://public.fxbaogao.com/report-image/2025/03/17/4734664'},
            {'id':'3834744','date':'2023-08-09','broker':'国联证券','title':'中期分红率53.8%，基本面长期向好','base':'https://public.fxbaogao.com/report-image/2023/08/09/3834744'},
          ]
          out=Path('output')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          manifest=[]
          for r in reports:
              pages=[]
              for i in [1,2]:
                  u=f"{r['base']}-{i}.png?x-oss-process=image/format,webp"
                  rr=s.get(u,timeout=40,headers={'Referer':f"https://www.fxbaogao.com/detail/{r['id']}"})
                  rr.raise_for_status()
                  im=Image.open(io.BytesIO(rr.content)); im.load()
                  rgba=im.convert('RGBA')
                  bg=Image.new('RGB',rgba.size,'white')
                  bg.paste(rgba,mask=rgba.getchannel('A'))
                  pages.append(bg)
                  print('PAGE',r['id'],i,im.mode,rgba.size,len(rr.content))
              safe=r['title'].replace('/','_').replace(':','：')
              fn=f"{r['date']}_{r['broker']}_{safe}_公开预览.pdf"
              p=out/fn
              pages[0].save(p,'PDF',save_all=True,append_images=pages[1:],resolution=150.0,quality=95,subsampling=0)
              for im in pages: im.close()
              n=len(PdfReader(str(p),strict=False).pages)
              if n!=2: raise RuntimeError('page count mismatch')
              data=p.read_bytes()
              manifest.append({'file':fn,'id':r['id'],'broker':r['broker'],'date':r['date'],'title':r['title'],'pages':n,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_page':f"https://www.fxbaogao.com/detail/{r['id']}",'type':'public two-page preview'})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          zpath=out/'yuexiu_fixed_previews.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
              for x in manifest: z.write(out/x['file'],x['file'])
              z.write(out/'manifest.json','manifest.json')
          with zipfile.ZipFile(zpath) as z: assert z.testzip() is None
          print('ZIP',zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          PY
          python /tmp/build_previews.py
      - name: Upload corrected previews
        uses: actions/upload-artifact@v4
        with:
          name: yuexiu-fixed-previews
          path: output/yuexiu_fixed_previews.zip
          retention-days: 1
          compression-level: 0
