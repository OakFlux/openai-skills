name: Probe Lixing 300421 report APIs 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-report-api-probe-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe Eastmoney and Sina report endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://reportapi.eastmoney.com/report/list'
          base = {
              'industryCode': '*',
              'pageSize': '100',
              'industry': '*',
              'rating': '*',
              'ratingChange': '*',
              'pageNo': '1',
              'fields': '',
              'orgCode': '',
              'rcode': '',
              'p': '1',
              'pageNum': '1',
              'pageNumber': '1',
          }
          variants = []
          for code_key in ['code', 'stockCode', 'symbol', 'secCode']:
              for code_value in ['300421', 'SZ300421', '300421.SZ', 'sz300421']:
                  for qtype in ['0', '1', '2', '']:
                      for include_dates in [True, False]:
                          params = dict(base)
                          params[code_key] = code_value
                          if qtype != '':
                              params['qType'] = qtype
                          if include_dates:
                              params['beginTime'] = '2014-01-01'
                              params['endTime'] = '2026-10-21'
                          variants.append((code_key, code_value, qtype, include_dates, params))

          seen_shapes = set()
          for idx, (code_key, code_value, qtype, include_dates, params) in enumerate(variants, 1):
              try:
                  r = s.get(api, params=params, timeout=(15, 45), headers={'Referer': 'https://data.eastmoney.com/report/300421.html'})
                  text = r.text
                  summary = {'i': idx, 'status': r.status_code, 'url': r.url, 'len': len(r.content)}
                  if r.status_code == 200:
                      try:
                          data = r.json()
                          rows = data.get('data') or []
                          if isinstance(rows, dict):
                              rows = rows.get('list') or rows.get('data') or []
                          summary.update({'hits': data.get('hits'), 'size': data.get('size'), 'rows': len(rows) if isinstance(rows, list) else str(type(rows))})
                          if isinstance(rows, list) and rows:
                              print('SUCCESS', json.dumps(summary, ensure_ascii=False))
                              for row in rows[:20]:
                                  print('ROW', json.dumps(row, ensure_ascii=False))
                              break
                          key = (data.get('hits'), data.get('size'), str(type(rows)), len(rows) if isinstance(rows, list) else None)
                          if key not in seen_shapes:
                              seen_shapes.add(key)
                              print('SHAPE', json.dumps(summary, ensure_ascii=False))
                      except Exception as exc:
                          print('JSON_ERROR', json.dumps(summary, ensure_ascii=False), repr(exc), text[:300])
                  else:
                      print('HTTP_ERROR', json.dumps(summary, ensure_ascii=False), text[:300])
              except Exception as exc:
                  print('REQUEST_ERROR', idx, code_key, code_value, qtype, include_dates, repr(exc))
          else:
              print('NO_VARIANT_RETURNED_ROWS')

          pages = [
              'https://data.eastmoney.com/report/300421.html',
              'https://data.eastmoney.com/report/stock.jshtml?stockcode=300421',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=300421',
              'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=300421',
          ]
          for url in pages:
              print('\nPAGE', url)
              try:
                  r = s.get(url, timeout=(20, 60), allow_redirects=True)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content), 'CT', r.headers.get('content-type'))
                  text = r.content.decode(r.apparent_encoding or 'utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'lxml')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')
                  for a in soup.find_all('a', href=True):
                      label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                      href = urljoin(r.url, a.get('href'))
                      blob = label + ' ' + href
                      if any(k in blob for k in ['力星股份', '300421', 'vReport_Show', 'report/info', '精密滚动体', '陶瓷球']):
                          print('LINK', label[:300], href)
                  for pattern in [r'AP\d{18}', r'rptid[/=](\d+)', r'精密滚动体.{0,300}', r'reportapi[^\"\']+']:
                      found = re.findall(pattern, text, flags=re.S)
                      print('PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:30])
                  scripts = [urljoin(r.url, tag.get('src')) for tag in soup.find_all('script', src=True)]
                  for script in scripts:
                      if any(k in script.lower() for k in ['report', 'stock']):
                          print('SCRIPT', script)
              except Exception as exc:
                  print('PAGE_ERROR', repr(exc))
          PY
