name: Build Fujian Cement reports from ordered viewer pages 20260929

on:
  push:
    paths:
      - '.github/workflows/fujian-cement-viewer-pages-final-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - report_id: '4582'
            filename: '01_长江证券_封闭市场的小而美_2020-02-10.pdf'
            title: '福建水泥（600802）：封闭市场的小而美'
            institution: '长江证券'
            publish_date: '2020-02-10'
            page_count: '22'
            base_url: 'https://file.sgpjbg.com/fileroot1/2020-7/30/4f0ca4f1-e4a5-4924-89d8-3a793ae88646/4f0ca4f1-e4a5-4924-89d8-3a793ae88646'
          - report_id: '4580'
            filename: '02_天风证券_首次覆盖_高弹性低估值关注预期差_2020-02-05.pdf'
            title: '福建水泥（600802）首次覆盖：高弹性低估值，关注预期差'
            institution: '天风证券'
            publish_date: '2020-02-05'
            page_count: '19'
            base_url: 'https://file.sgpjbg.com/fileroot1/2020-7/30/e9fb8cb9-7cb4-4181-a151-54756c0513d3/e9fb8cb9-7cb4-4181-a151-54756c0513d3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPORT_ID: ${{ matrix.report_id }}
      OUTPUT_FILENAME: ${{ matrix.filename }}
      REPORT_TITLE: ${{ matrix.title }}
      INSTITUTION: ${{ matrix.institution }}
      PUBLISH_DATE: ${{ matrix.publish_date }}
      PAGE_COUNT: ${{ matrix.page_count }}
      BASE_URL: ${{ matrix.base_url }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow img2pdf

      - name: Download ordered pages and create PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, subprocess, time
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          rid=os.environ['REPORT_ID']
          filename=os.environ['OUTPUT_FILENAME']
          title=os.environ['REPORT_TITLE']
          institution=os.environ['INSTITUTION']
          publish_date=os.environ['PUBLISH_DATE']
          page_count=int(os.environ['PAGE_COUNT'])
          base=os.environ['BASE_URL']
          source_page=f'https://www.sgpjbg.com/baogao/{rid}.html'
          pages_dir=Path('pages'); pages_dir.mkdir(exist_ok=True)
          output=Path('output'); output.mkdir(exist_ok=True)

          session=requests.Session(); session.trust_env=False
          retry=Retry(total=8,connect=8,read=8,status=8,backoff_factor=1,
                      status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)
          session.mount('https://',HTTPAdapter(max_retries=retry,pool_connections=8,pool_maxsize=8))
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept-Encoding':'identity',
              'Referer':source_page,
              'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          normalized=[]
          dimensions=[]
          source_urls=[]
          for page in range(1,page_count+1):
              candidates=[f'{base}{page}.gif',f'{base}/{page}.gif',f'{base}{page}.png',f'{base}/{page}.png']
              downloaded=None
              errors=[]
              for url in candidates:
                  for attempt in range(1,7):
                      try:
                          r=session.get(url,timeout=(30,180),allow_redirects=True)
                          print('PAGE_GET',rid,page,attempt,r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
                          if r.status_code!=200 or len(r.content)<5000:
                              errors.append(f'{url}: HTTP {r.status_code}, {len(r.content)} bytes')
                              time.sleep(attempt*0.5)
                              continue
                          raw=pages_dir/f'{page:03d}.raw'
                          raw.write_bytes(r.content)
                          try:
                              with Image.open(raw) as im:
                                  im.load()
                                  width,height=im.size
                                  if width<500 or height<650:
                                      raise RuntimeError(f'image too small {width}x{height}')
                                  target=pages_dir/f'{page:03d}.png'
                                  if im.mode not in ('RGB','L'):
                                      im=im.convert('RGB')
                                  im.save(target,'PNG',optimize=True)
                                  dimensions.append((width,height))
                                  normalized.append(str(target))
                                  source_urls.append(url)
                                  downloaded=target
                                  print('PAGE_VALID',rid,page,width,height,target.stat().st_size,url,flush=True)
                                  break
                          except Exception as exc:
                              errors.append(f'{url}: {exc!r}')
                              raw.unlink(missing_ok=True)
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(attempt*0.5)
                  if downloaded is not None:
                      break
              if downloaded is None:
                  raise RuntimeError(f'Page {page} failed: {errors[-20:]}')

          if len(normalized)!=page_count or len(set(source_urls))!=page_count:
              raise RuntimeError('Incomplete or duplicate page source list')
          # Viewer pages for one report should share a stable portrait aspect ratio.
          ratios=[w/h for w,h in dimensions]
          if max(ratios)-min(ratios)>0.08:
              raise RuntimeError(f'Inconsistent page aspect ratios: {dimensions}')

          pdf=output/filename
          pdf.write_bytes(img2pdf.convert(normalized))
          data=pdf.read_bytes()
          if not data.startswith(b'%PDF-'): raise RuntimeError('Output not PDF')
          check=subprocess.run(['qpdf','--check',str(pdf)],capture_output=True,text=True)
          if check.returncode not in (0,3): raise RuntimeError(check.stderr[-2000:])
          pages=len(PdfReader(str(pdf),strict=False).pages)
          if pages!=page_count: raise RuntimeError(f'Page count {pages} != {page_count}')
          render_base=Path('page1')
          render=subprocess.run(['pdftoppm','-f','1','-l','1','-singlefile','-png','-r','120',str(pdf),str(render_base)],capture_output=True,text=True)
          first=Path('page1.png')
          if render.returncode or not first.exists() or first.stat().st_size<10000:
              raise RuntimeError('First-page render failed')
          digest=hashlib.sha256(data).hexdigest()
          meta={
              'report_id':rid,'filename':filename,'title':title,'institution':institution,
              'publish_date':publish_date,'pages':pages,'bytes':len(data),'sha256':digest,
              'source_page':source_page,'viewer_base_url':base,'page_source_urls':source_urls,
              'acquisition':'ordered_viewer_pages_recombined','page_dimensions':dimensions,
          }
          (output/f'{rid}.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (output/f'{rid}_page1.png').write_bytes(first.read_bytes())
          print('VALIDATED',json.dumps(meta,ensure_ascii=False),flush=True)
          PY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: fujian-cement-ordered-report-${{ matrix.report_id }}
          path: output
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install verifier
        run: python -m pip install --quiet pypdf
      - name: Download report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fujian-cement-ordered-report-*
          path: downloads
          merge-multiple: true
      - name: Package reports
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('downloads')
          pdfs=sorted(root.glob('*.pdf'))
          metas=sorted(root.glob('*.json'))
          if len(pdfs)!=2 or len(metas)!=2: raise RuntimeError(f'pdfs={pdfs}, metas={metas}')
          records=[json.loads(p.read_text(encoding='utf-8')) for p in metas]
          package=Path('福建水泥_600802.SH_券商深度报告_2份'); package.mkdir(exist_ok=True)
          for pdf in pdfs:
              record=next(r for r in records if r['filename']==pdf.name)
              if len(PdfReader(str(pdf),strict=False).pages)!=record['pages']:
                  raise RuntimeError(f'Page mismatch: {pdf}')
              data=pdf.read_bytes()
              if hashlib.sha256(data).hexdigest()!=record['sha256']:
                  raise RuntimeError(f'Hash mismatch: {pdf}')
              (package/pdf.name).write_bytes(data)
          readme=['福建水泥（600802.SH）券商深度研究报告精选（2份）','整理与核验日期：2026-09-29','','收录口径：仅完整公司深度/首次覆盖报告；未以3—5页业绩点评凑数。','PDF由报告站在线阅读器的有序原始页面（按第1页至末页）重组，未改变页面内容。','报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。','','文件清单：']
          for i,r in enumerate(sorted(records,key=lambda x:x['publish_date'],reverse=True),1):
              readme += [f'{i}. {r["title"]}',f'   机构：{r["institution"]}；发布日期：{r["publish_date"]}',f'   文件：{r["filename"]}；页数：{r["pages"]}；大小：{r["bytes"]/1048576:.2f} MB',f'   来源页：{r["source_page"]}',f'   SHA-256：{r["sha256"]}','']
          (package/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (package/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (package/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')
          out=Path('福建水泥_600802.SH_券商深度报告_2份.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as archive:
              for path in sorted(package.iterdir()): archive.write(path,arcname=path.name)
          with zipfile.ZipFile(out) as archive:
              bad=archive.testzip(); pdf_count=sum(n.lower().endswith('.pdf') for n in archive.namelist())
              if bad or pdf_count!=2: raise RuntimeError(f'ZIP bad={bad}, pdf_count={pdf_count}')
          print('FINAL_ZIP',out.stat().st_size,hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fujian-cement-ordered-pages-final-20260929
          path: 福建水泥_600802.SH_券商深度报告_2份.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
