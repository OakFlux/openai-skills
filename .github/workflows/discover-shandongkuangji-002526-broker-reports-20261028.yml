name: Discover Shandong Mining Machinery 002526 broker reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-shandongkuangji-002526-broker-reports-20261028.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Query Eastmoney report index
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          url='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          for page in range(1,10):
              params={
                'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':'2010-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'',
                'qType':'0','orgCode':'','code':'002526','rcode':'','p':str(page),
                'pageNum':str(page),'pageNumber':str(page)
              }
              r=s.get(url,params=params,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'},timeout=120)
              print('PAGE',page,'STATUS',r.status_code,'URL',r.url,flush=True)
              r.raise_for_status()
              obj=r.json(); rows=obj.get('data') or []
              print('HITS',obj.get('hits'),'ROWS',len(rows),flush=True)
              all_rows.extend(rows)
              if len(rows)<100: break
          seen=set(); out=[]
          for row in all_rows:
              code=str(row.get('infoCode') or '')
              if not code or code in seen: continue
              seen.add(code)
              out.append({k:row.get(k) for k in ['title','orgSName','orgName','publishDate','researcher','emRatingName','sRatingName','attachPages','infoCode']})
          out.sort(key=lambda x:(int(x.get('attachPages') or 0),str(x.get('publishDate') or '')),reverse=True)
          print('REPORT_COUNT',len(out),flush=True)
          print('REPORTS_JSON',json.dumps(out,ensure_ascii=False,indent=2),flush=True)
          PY
