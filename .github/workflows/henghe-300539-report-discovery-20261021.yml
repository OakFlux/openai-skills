name: Discover Henghe Precision research report sources

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-report-discovery-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect public indexes
        run: |
          python - <<'PY'
          import re, html, json, requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          urls=[
            'https://gg.cfi.cn/ybyl/20364/300539.html',
            'https://quote.cfi.cn/quote20364_300539.html',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz300539&t1=all',
            'https://data.eastmoney.com/report/300539.html',
            'https://www.9fzt.com/detail/sz_300539_10_813458614844.html',
            'https://news.10jqka.com.cn/field/sr/20251228/55456455.shtml',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\n===URL===',url,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'))
              if r.status_code!=200: continue
              r.encoding=r.apparent_encoding or r.encoding
              text=r.text
              mtitle=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              print('TITLE',mtitle.group(1)[:300] if mtitle else '')
              soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if any(k in label for k in ['横河','研报','无人机','三箭齐发','新能源汽车','MT成立','精密','原文']) or any(k in href.lower() for k in ['report','ybyl','vreport','pdf','300539']):
                  print('LINK',json.dumps({'text':label[:300],'href':href},ensure_ascii=False))
              for m in re.finditer(r'(?i)(https?://[^\"\'<>\s]+(?:pdf|PDF)[^\"\'<>\s]*)',text):
                print('PDFLIKE',html.unescape(m.group(1))[:1000])
              print('TEXT_MATCHES')
              plain=' '.join(soup.get_text(' ',strip=True).split())
              for keyword in ['全球无人机新秀崛起','冉冉升起无人机新星','与MT成立新加坡合资公司','三季报基本符合预期','横河精密']:
                p=plain.find(keyword)
                if p>=0: print(keyword,plain[max(0,p-300):p+800])
            except Exception as e:
              print('ERROR',url,repr(e))
          PY
