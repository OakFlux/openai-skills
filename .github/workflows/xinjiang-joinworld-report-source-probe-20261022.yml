name: Probe Xinjiang Joinworld deep report sources

on:
  push:
    paths:
      - '.github/workflows/xinjiang-joinworld-report-source-probe-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect public report pages and download links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls = [
              'https://www.vzkoo.com/read/202308035a2ef4b2897a87ce3c2b1345.html',
              'https://www.vzkoo.com/document/20230802064eead7d7b839e476f3978b.html?from=report',
              'https://www.fxbaogao.com/detail/3822867',
              'https://www.fxbaogao.com/view?id=3822867',
              'https://www.sdyanbao.com/detail/922882',
              'https://www.sgpjbg.com.cn/bgdown/925460.html',
              'https://www.nxny.com/report/view_5362861.html',
          ]

          keywords = ('pdf','download','down','file','attachment','attach','document','preview','oss','cos','cdn','report')
          for url in urls:
              try:
                  response = session.get(url, timeout=(25, 150), allow_redirects=True)
                  response.encoding = response.apparent_encoding
                  text = response.text
                  print('\n===== URL', url, 'STATUS', response.status_code, 'FINAL', response.url, 'LEN', len(response.content), 'ENC', response.encoding, '=====', flush=True)
                  print('CONTENT_TYPE', response.headers.get('content-type'), flush=True)
                  soup = BeautifulSoup(text, 'html.parser')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)

                  for tag in soup.find_all(['a','iframe','embed','object','script','link','source','video','button']):
                      label = ' '.join(tag.get_text(' ', strip=True).split())[:180]
                      for attr in ('href','src','data','data-src','data-url','data-href','onclick','value'):
                          value = tag.get(attr)
                          if not value:
                              continue
                          value = html.unescape(str(value)).replace('\\/','/')
                          absolute = urljoin(response.url, value) if not value.lower().startswith('javascript:') else value
                          combined = (label + ' ' + absolute).lower()
                          if any(word in combined for word in keywords) or any(word in label for word in ('下载','原文','完整报告','查看报告')):
                              print('TAG', tag.name, attr, repr(label), absolute[:1500], flush=True)

                  patterns = [
                      r'https?://[^\"\'<>\s]+',
                      r'[\"\']([^\"\']*(?:pdf|download|file|attachment|attach|document|preview|oss|cos|cdn)[^\"\']*)[\"\']',
                  ]
                  seen = set()
                  for pattern in patterns:
                      for match in re.findall(pattern, text, flags=re.I):
                          value = match if isinstance(match, str) else match[0]
                          value = html.unescape(value).replace('\\/','/')
                          if len(value) < 5 or value in seen:
                              continue
                          seen.add(value)
                          low = value.lower()
                          if any(word in low for word in keywords):
                              print('RAW', value[:1800], flush=True)

                  for script in soup.find_all('script'):
                      body = script.string or script.get_text(' ', strip=False)
                      if not body:
                          continue
                      low = body.lower()
                      if any(word in low for word in keywords) or '922882' in body or '3822867' in body or '5362861' in body:
                          compact = ' '.join(body.split())
                          print('SCRIPT', compact[:6000], flush=True)

                  print('TEXT_HEAD', ' | '.join(soup.get_text('\n', strip=True).splitlines())[:2500], flush=True)
              except Exception as exc:
                  print('ERROR', url, repr(exc), flush=True)
          PY
