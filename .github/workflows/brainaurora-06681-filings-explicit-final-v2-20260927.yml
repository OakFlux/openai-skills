name: Build robust final BrainAurora 06681 filings package 20260927

on:
  push:
    paths:
      - '.github/workflows/brainaurora-06681-filings-explicit-final-v2-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download and package official HKEX PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='脑动极光_06681_全部年报_招股说明书及最新阶段性财务报告'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)

          docs=[
            ('01_脑动极光_2024年年度报告_中文版.pdf','2024年年度报告中文版','中文','annual_report',2024,'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0428/2025042804406_c.pdf',80),
            ('01_BrainAurora_2024_Annual_Report_English.pdf','BrainAurora 2024 Annual Report','English','annual_report',2024,'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0428/2025042804405.pdf',80),
            ('02_脑动极光_2025年年度报告_中文版.pdf','2025年年度报告中文版','中文','annual_report',2025,'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0428/2026042801063_c.pdf',80),
            ('02_BrainAurora_2025_Annual_Report_English.pdf','BrainAurora 2025 Annual Report','English','annual_report',2025,'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0428/2026042801062.pdf',80),
            ('03_脑动极光_最终招股章程_全球发售_中文版.pdf','最终招股章程中文版（全球发售）','中文','prospectus',2024,'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/1230/2024123000046_c.pdf',300),
            ('03_BrainAurora_Final_Prospectus_Global_Offering_English.pdf','Final Prospectus / Global Offering','English','prospectus',2024,'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/1230/2024123000045.pdf',300),
            ('04_脑动极光_2026年中期业绩公告_中文版.pdf','2026年中期业绩公告中文版','中文','latest_interim_results',2026,'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082803855_c.pdf',5),
            ('04_BrainAurora_2026_Interim_Results_Announcement_English.pdf','2026 Interim Results Announcement','English','latest_interim_results',2026,'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082803854.pdf',5),
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/pdf,*/*;q=0.8','Referer':'https://www1.hkexnews.hk/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def fetch(url):
            last=None
            for attempt in range(8):
              try:
                r=s.get(url,timeout=(30,300),allow_redirects=True)
                last={'status':r.status_code,'final_url':r.url,'type':r.headers.get('content-type'),'bytes':len(r.content)}
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>20000:
                  return r.content,last
              except Exception as e:
                last={'error':repr(e)}
              time.sleep(2+attempt)
            raise RuntimeError(f'failed to download {url}: {last}')

          manifest=[]
          for filename,label,language,kind,year,url,min_pages in docs:
            data,download=fetch(url)
            dest=root/filename; dest.write_bytes(data)
            pages=None; parse_error=None; text_snippet=''
            try:
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              for p in reader.pages[:2]:
                try: text_snippet += ' '+(p.extract_text() or '')
                except Exception: pass
            except Exception as e:
              parse_error=repr(e)
            if pages is None or pages<min_pages:
              raise RuntimeError(f'page-count validation failed for {filename}: pages={pages}, error={parse_error}')
            qpdf=subprocess.run(['qpdf','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'label':label,'language':language,'kind':kind,'year':year,'pdf_file':filename,'source_url':url,
              'pages':pages,'bytes':len(data),'sha256':sha,'download':download,
              'qpdf_return_code':qpdf.returncode,'qpdf_output':qpdf.stdout[-2000:],
              'first_pages_text_snippet':text_snippet[:1000],
              'validation':['PDF header','page count','SHA-256','ZIP CRC']
            })

          lines=[
            '脑动极光医疗科技有限公司（06681.HK）全部年报、招股说明书及最新阶段性财务报告',
            '整理日期：2026-09-27','',
            '本包收录港交所官方PDF原件，中文及英文版本均已保留。',
            '脑动极光于2025年1月8日在港交所上市；截至整理日，已发布的完整年度报告为2024年和2025年。',
            '截至整理日，港交所尚未发布2026年完整中期报告；本包以2026年8月28日发布的中期业绩公告作为最新阶段性财务披露。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            lines += [f"{i}. {m['label']}（{m['pages']}页）",f"   文件：{m['pdf_file']}",f"   港交所来源：{m['source_url']}",f"   SHA-256：{m['sha256']}",'']
          lines += ['“最新季报”按港股披露习惯对应最近一期中期报告或中期业绩公告，并非A股口径第一季度/第三季度报告。','全部PDF均已核验文件头和实际页数；压缩包已执行CRC完整性检查。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  {m['pdf_file']}\n" for m in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failure: '+bad)
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=8: raise RuntimeError('ZIP PDF count is not 8')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: brainaurora-06681-filings-explicit-final-v2
          path: 脑动极光_06681_全部年报_招股说明书及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
