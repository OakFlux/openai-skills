name: Probe original URLs for selected Jinyao reports 20260929

on:
  push:
    paths:
      - '.github/workflows/jinyao-600488-sina-url-probe-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe report URL endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests

          ids=['737100241751','569347040128','413022474773','375790000280']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'http://stock.finance.sina.com.cn/'})
          for rptid in ids:
              url=f'http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rptid}/url'
              for follow in [False, True]:
                  try:
                      r=s.get(url,timeout=(15,60),allow_redirects=follow,stream=True)
                      head=next(r.iter_content(64),b'')
                      print('PROBE',rptid,'FOLLOW',follow,'STATUS',r.status_code,'URL',url,'FINAL',r.url,'LOCATION',r.headers.get('location'),'CTYPE',r.headers.get('content-type'),'CLEN',r.headers.get('content-length'),'HEAD',repr(head),flush=True)
                      r.close()
                  except Exception as e:
                      print('ERROR',rptid,'FOLLOW',follow,repr(e),flush=True)
          PY
