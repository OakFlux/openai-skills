name: Inspect RoboSense prospectus source
on:
  push:
    branches:
      - tmp-robosense-prospectus-inspect-20260914
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect public page and image sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session();s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          result={}
          for page_url in ['https://www.fxbaogao.com/detail/4078546','https://www.fxbaogao.com/view?id=4078546']:
              try:
                  r=s.get(page_url,timeout=60,allow_redirects=True)
                  text=r.text.replace('\\/','/')
                  Path('output/page_'+str(len(result))+'.html').write_text(text,encoding='utf-8')
                  matches=[]
                  for pattern in ['4078546','report-image','pageCount','page_count','totalPage','total_page','.pdf','download']:
                      for m in re.finditer(re.escape(pattern),text,re.I):
                          matches.append(text[max(0,m.start()-200):m.end()+400])
                  result[page_url]={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'matches':matches[:100]}
              except Exception as exc:
                  result[page_url]={'error':repr(exc)}

          tests=[]
          test_urls=[
              'https://public.fxbaogao.com/report/2023/12/27/4078546.pdf',
              'https://public.fxbaogao.com/report-pdf/2023/12/27/4078546.pdf',
              'https://public.fxbaogao.com/report-file/2023/12/27/4078546.pdf',
              'https://public.fxbaogao.com/report-image/2023/12/27/4078546-1.png',
              'https://public.fxbaogao.com/report-image/2023/12/27/4078546-500.png',
              'https://public.fxbaogao.com/report-image/2023/12/27/4078546-800.png'
          ]
          for url in test_urls:
              try:
                  r=s.get(url,timeout=45,allow_redirects=True,stream=True)
                  first=next(r.iter_content(2048),b'')
                  tests.append({'url':url,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'content_length':r.headers.get('content-length'),'first_bytes':first[:12].hex()})
              except Exception as exc:
                  tests.append({'url':url,'error':repr(exc)})
          result['tests']=tests
          Path('output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: robosense-prospectus-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
