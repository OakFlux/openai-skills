name: Temporary Hibor Johnson Electric inspection

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-hibor-johnson-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare libraries
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Inspect report detail, forms, scripts and common endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests, urllib.parse
          from bs4 import BeautifulSoup

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/json,application/pdf,*/*;q=0.8'})
          rid='4644159'
          pages=[
              f'https://www.hibor.com.cn/repinfodetail_{rid}.html',
              f'https://wap.hibor.com.cn/repinfodetail_{rid}.html',
              f'https://p.hibor.com.cn/repinfodetail_{rid}.html',
          ]
          scripts=[]
          for url in pages:
              try:
                  r=s.get(url,timeout=90,allow_redirects=True)
                  print('\nPAGE',url,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                  print('COOKIES',s.cookies.get_dict())
                  text=r.text
                  print('HEAD',text[:2500])
                  soup=BeautifulSoup(text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                  for form in soup.find_all('form'):
                      print('FORM',json.dumps({'action':urllib.parse.urljoin(r.url,form.get('action') or ''),'method':form.get('method'),'id':form.get('id'),'class':form.get('class'),'inputs':[{'name':x.get('name'),'value':x.get('value'),'type':x.get('type')} for x in form.find_all('input')[:50]]},ensure_ascii=False))
                  for tag in soup.find_all(['a','button','input','iframe','embed','object','source','img']):
                      blob=str(tag).lower()
                      if any(k in blob for k in ['download','下载','原文','pdf','fulltext','reportfile','docdown','repdown','readreport']):
                          attrs={k:v for k,v in tag.attrs.items() if k in ['href','src','data','data-src','onclick','id','class','name','value']}
                          print('TAG',json.dumps({'tag':tag.name,'text':tag.get_text(' ',strip=True)[:400],'attrs':attrs},ensure_ascii=False))
                  for pat in [
                      r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                      r'https?://[^\s"\'<>]+(?:download|down|file|attachment|pdf|show|view)[^\s"\'<>]*',
                      r'[/A-Za-z0-9_.?=&%:-]*(?:download|down|file|attachment|pdf|show|view)[/A-Za-z0-9_.?=&%:-]*',
                      rf'[/A-Za-z0-9_.?=&%:-]*{rid}[/A-Za-z0-9_.?=&%:-]*',
                  ]:
                      for m in sorted(set(re.findall(pat,text,re.I))):
                          if len(m)>3: print('MATCH',m[:3000])
                  for tag in soup.find_all('script',src=True):
                      scripts.append(urllib.parse.urljoin(r.url,tag['src']))
              except Exception as e: print('PAGE_ERR',url,repr(e))

          for jsurl in sorted(set(scripts)):
              try:
                  r=s.get(jsurl,timeout=60)
                  text=r.text
                  if any(k in text.lower() for k in ['download','pdf','repinfodetail','reportfile','docdown','readreport']) or rid in text:
                      print('\nSCRIPT',jsurl,r.status_code,len(r.content))
                      for needle in ['download','pdf','repinfodetail','reportfile','docdown','readreport',rid]:
                          for h in list(re.finditer(re.escape(needle),text,re.I))[:20]:
                              p=h.start(); print('SCRIPT_CTX',needle,text[max(0,p-1000):p+3500][:4500])
              except Exception as e: print('SCRIPT_ERR',jsurl,repr(e))

          endpoints=[
              f'https://www.hibor.com.cn/download.aspx?id={rid}',
              f'https://www.hibor.com.cn/Download.aspx?id={rid}',
              f'https://www.hibor.com.cn/down.aspx?id={rid}',
              f'https://www.hibor.com.cn/repdown_{rid}.html',
              f'https://www.hibor.com.cn/repinfodown_{rid}.html',
              f'https://www.hibor.com.cn/docdownload_{rid}.html',
              f'https://www.hibor.com.cn/download/{rid}',
              f'https://www.hibor.com.cn/api/report/{rid}/download',
              f'https://www.hibor.com.cn/api/report/download?id={rid}',
              f'https://p.hibor.com.cn/download.aspx?id={rid}',
              f'https://p.hibor.com.cn/repdown_{rid}.html',
              f'https://wap.hibor.com.cn/download.aspx?id={rid}',
              f'https://wap.hibor.com.cn/repdown_{rid}.html',
          ]
          for url in endpoints:
              try:
                  r=s.get(url,headers={'Referer':f'https://www.hibor.com.cn/repinfodetail_{rid}.html'},timeout=60,allow_redirects=False)
                  print('\nTEST',url,r.status_code,len(r.content),r.headers.get('content-type'),'LOC',r.headers.get('location'),'HEAD',repr(r.content[:100]))
              except Exception as e: print('TEST_ERR',url,repr(e))
          PY
