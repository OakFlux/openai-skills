name: Build Baoming 002992 broker deep package 20261103

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baoming-002992-broker-deep-package-20261103.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '002992'
          SHORT = '宝明科技'
          FULL = '深圳市宝明科技股份有限公司'
          PACKAGE = '宝明科技_002992_券商深度研究资料_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '中航证券',
                  'date': '2022-08-31',
                  'title': 'PET铜箔进展顺利，看好2023上半年产能落地',
                  'classification': '宝明科技公司跟踪报告',
                  'company_focus': '公司专属报告',
                  'analysts': '刘牧野',
                  'rating': '买入（维持）',
                  'urls': ['https://pdf.dfcfw.com/pdf/H3_AP202208311577893215_1.pdf'],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202208311577893215.html',
                  'min_pages': 4,
                  'broker_aliases': ['中航证券', 'AVIC Securities'],
                  'title_token': 'PET铜箔进展顺利',
              },
              {
                  'broker': '东方财富证券',
                  'date': '2022-12-02',
                  'title': '复合集流体专题之二：玩家群雄逐鹿，工艺百花齐放',
                  'classification': '电气设备行业专题研究',
                  'company_focus': '长篇行业深度，含宝明科技专章及专利、工艺、产能分析',
                  'analysts': '周旭辉；联系人：李京波、郭娜',
                  'rating': '强于大市（维持）',
                  'urls': ['https://file.iyanbao.com/pdf/b7994-b47111ae-2e36-4e40-89fe-567d1524edc0.pdf'],
                  'source_page': 'https://file.iyanbao.com/pdf/b7994-b47111ae-2e36-4e40-89fe-567d1524edc0.pdf',
                  'min_pages': 38,
                  'broker_aliases': ['东方财富证券', '东方财富证券研究所'],
                  'title_token': '复合集流体专题之二玩家群雄逐鹿',
              },
              {
                  'broker': '浙商证券',
                  'date': '2023-07-04',
                  'title': '复合铜箔产业化进程提速，23年有望成为量产突破元年',
                  'classification': '复合铜箔行业深度报告',
                  'company_focus': '长篇行业深度，第5.1节为宝明科技公司专章',
                  'analysts': '张雷、黄华栋；研究助理：杨子伟',
                  'rating': '看好（维持）',
                  'urls': ['https://pdf.dfcfw.com/pdf/H3_AP202307041592027379_1.pdf'],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202307041592027379.html',
                  'min_pages': 40,
                  'broker_aliases': ['浙商证券', 'ZHESHANG SECURITIES'],
                  'title_token': '复合铜箔产业化进程提速',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:120]

          manifest = []
          for idx, rep in enumerate(reports, 1):
              data = None
              source_url = ''
              attempts = []
              for url in rep['urls']:
                  for attempt in range(6):
                      try:
                          if 'dfcfw.com' in url:
                              referer = 'https://data.eastmoney.com/report/'
                          elif 'iyanbao.com' in url:
                              referer = 'https://www.iyanbao.com/'
                          else:
                              referer = 'https://www.eastmoney.com/'
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'attempt': attempt + 1,
                              'url': url,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 80000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'attempt': attempt + 1, 'url': url, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

              filename = f"{idx:02d}_{safe(rep['broker'])}_宝明科技_{safe(rep['title'])}_{rep['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < rep['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(60, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in (SHORT, FULL, CODE, '宝明科技股份') if normalize(x) in compact]
              broker_hits = [x for x in rep['broker_aliases'] if normalize(x) in compact]
              title_hit = normalize(rep['title_token']) in compact
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer/company-section mismatch: {filename}')
              if len(compact) > 500 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch: {filename}')
              if len(compact) > 500 and not title_hit:
                  raise RuntimeError(f'Title mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{k: v for k, v in rep.items() if k not in ('urls', 'min_pages', 'broker_aliases', 'title_token')},
                  'source_url': source_url,
                  'candidate_urls': rep['urls'],
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hit': title_hit,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'company/company-section identity', 'broker identity',
                      'report title', 'page count', 'qpdf structure', 'first-page render'
                  ],
              })
              print('VERIFIED', rep['broker'], rep['title'], pages, len(data), sha, source_url)

          total_pages = sum(x['actual_pages'] for x in manifest)
          readme = [
              '深圳市宝明科技股份有限公司（002992.SZ）券商深度研究资料包',
              '整理日期：2026-11-03',
              '',
              '公开渠道未发现2—3份可直接下载的长篇宝明科技公司深度报告。为避免用短评凑数，本包采用以下结构：',
              '1份宝明科技公司专属券商报告；2份复合铜箔长篇行业深度报告，均设有宝明科技专章或系统分析。',
              '未使用普通网页摘要、公司公告或非券商文章替代原始PDF。',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   与宝明科技关系：{x['company_focus']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   来源页面：{x['source_page']}",
                  f"   SHA-256：{x['sha256']}",
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司/公司专章、券商标识、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('baoming_002992_broker_deep_research_package.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: baoming-002992-broker-deep-final
          path: |
            宝明科技_002992_券商深度研究资料_3份.zip
            baoming_002992_broker_deep_research_package.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
# trigger 2
