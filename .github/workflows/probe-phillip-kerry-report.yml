name: Probe Phillip Kerry report
on:
  push:
    branches: [chatgpt-kerry-report-images-20260906]
    paths: ['.github/workflows/probe-phillip-kerry-report.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_phillip_kerry_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: phillip-kerry-report-probe
          path: |
            phillip-kerry-probe.json
            phillip-kerry-page.html
            phillip-kerry-*.pdf
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
