name: Query Eastmoney Pandairy by code
on:
  push:
    paths: ['.github/workflows/pandairy-eastmoney-code-query-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          python - <<'PY'
          import json,requests
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockcode=300898'})
          base='https://reportapi.eastmoney.com/report/list'
          for code in ('300898','300898.SZ','SZ300898'):
            p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2020-10-01','endTime':'2026-11-04','pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
            r=s.get(base,params=p,timeout=90)
            print('FETCH',code,r.status_code,len(r.content),r.url,flush=True)
            try:d=r.json()
            except Exception as e: print('ERR',repr(e),r.text[:1000],flush=True);continue
            print('META',json.dumps({'hits':d.get('hits'),'size':d.get('size'),'TotalPage':d.get('TotalPage')},ensure_ascii=False),flush=True)
            rows=d.get('data') or []
            print('ROWS',json.dumps(rows,ensure_ascii=False,indent=2),flush=True)
          PY
