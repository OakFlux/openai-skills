name: Build AVIC Xian 000768 broker deep report package 20260927

on:
  push:
    paths:
      - '.github/workflows/avic-xian-000768-broker-deep-reports-20260927.yml'
      - 'scripts/avic_xian_000768_broker_reports_20260927.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf
      - name: Discover download validate and package
        run: python scripts/avic_xian_000768_broker_reports_20260927.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: avic-xian-000768-broker-deep-reports-final
          path: artifact_out/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
