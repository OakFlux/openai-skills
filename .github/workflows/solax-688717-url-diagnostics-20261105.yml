name: Diagnose SolaX official PDF URLs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solax-688717-url-diagnostics-20261105.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check URLs
        shell: bash
        run: |
          set +e
          urls=(
            'https://static.cninfo.com.cn/finalpage/2023-12-28/1218746774.PDF'
            'https://static.cninfo.com.cn/finalpage/2024-04-22/1219728866.PDF'
            'https://static.cninfo.com.cn/finalpage/2025-04-29/1223392162.PDF'
            'https://static.cninfo.com.cn/finalpage/2026-04-29/1225242242.PDF'
            'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-31/688717_20261031_NDEU.pdf'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl -L --connect-timeout 10 --max-time 25 -A 'Mozilla/5.0 Chrome/155' -e 'https://www.sse.com.cn/' -r 0-1023 -D - -o /tmp/chunk.bin "$u"
            rc=$?
            echo "CURL_RC=$rc SIZE=$(wc -c </tmp/chunk.bin 2>/dev/null || echo 0)"
            xxd -l 16 /tmp/chunk.bin 2>/dev/null || true
          done
