name: Temporary Fetch StarPower Filings Final

on:
  push:
    branches:
      - tmp/fetch-starpower-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ensure PDF tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, validate, and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests

          ROOT = Path('starpower_package')
          PDF_DIR = ROOT / '01_年度报告及半年度报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          docs = [
              ('annual_report', '2020年年度报告', '2021-04-09', '01_斯达半导_2020年年度报告.pdf', 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-09/7024543.PDF', 80, '2020年年度报告'),
              ('annual_report', '2021年年度报告', '2022-04-09', '02_斯达半导_2021年年度报告.pdf', 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-09/7967278.PDF', 80, '2021年年度报告'),
              ('annual_report', '2022年年度报告（修订版）', '2023-04-11', '03_斯达半导_2022年年度报告_修订版.pdf', 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-11/8967453.PDF', 80, '2022年年度报告'),
              ('annual_report', '2023年年度报告', '2024-04-08', '04_斯达半导_2023年年度报告.pdf', 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-08/9944234.PDF', 80, '2023年年度报告'),
              ('annual_report', '2024年年度报告', '2025-04-26', '05_斯达半导_2024年年度报告.pdf', 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-26/11001927.PDF', 80, '2024年年度报告'),
              ('annual_report', '2025年年度报告', '2026-04-30', '06_斯达半导_2025年年度报告.pdf', 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-30/12285727.PDF', 80, '2025年年度报告'),
              ('half_year_report', '2026年半年度报告', '2026-08-25', '07_斯达半导_2026年半年度报告.pdf', 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-25/12525003.PDF', 50, '2026年半年度报告'),
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Referer': 'https://vip.stock.finance.sina.com.cn/',
          })

          def secure_variant(url):
              return url.replace(
                  'http://file.finance.sina.com.cn/211.154.219.97:9494/',
                  'https://file.finance.sina.com.cn/211.154.219.97%3A9494/'
              )

          def download(url):
              errors = []
              for candidate in [url, secure_variant(url)]:
                  for attempt in range(1, 4):
                      try:
                          print(f'GET attempt={attempt}: {candidate}')
                          with session.get(candidate, timeout=90, allow_redirects=True, stream=True) as response:
                              response.raise_for_status()
                              data = bytearray()
                              for chunk in response.iter_content(chunk_size=1024 * 256):
                                  if chunk:
                                      data.extend(chunk)
                              raw = bytes(data)
                          if len(raw) < 100_000 or not raw.lstrip().startswith(b'%PDF') or b'%%EOF' not in raw[-16384:]:
                              raise RuntimeError(f'invalid PDF bytes={len(raw)}, head={raw[:20]!r}')
                          return raw, candidate
                      except Exception as exc:
                          errors.append(f'{candidate} attempt {attempt}: {exc}')
                          time.sleep(attempt)
              raise RuntimeError('\n'.join(errors))

          def page_count(path):
              result = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', result.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Cannot parse page count: {path}')
              return int(match.group(1))

          def extract_text(path, pages):
              texts = []
              with tempfile.TemporaryDirectory() as temp_dir:
                  temp_dir = Path(temp_dir)
                  for page in pages:
                      output = temp_dir / f'{page}.txt'
                      result = subprocess.run(
                          ['pdftotext', '-f', str(page), '-l', str(page), '-enc', 'UTF-8', str(path), str(output)],
                          capture_output=True,
                          text=True,
                      )
                      if result.returncode == 0 and output.exists():
                          texts.append(output.read_text(encoding='utf-8', errors='ignore'))
              return '\n'.join(texts)

          def compact(value):
              return re.sub(r'\s+', '', value).replace('（', '(').replace('）', ')')

          manifest = []
          sha_lines = []

          for kind, title, disclosure_date, filename, url, min_pages, title_term in docs:
              raw, source_url = download(url)
              path = PDF_DIR / filename
              path.write_bytes(raw)
              pages = page_count(path)
              if pages < min_pages:
                  raise RuntimeError(f'{title} unexpectedly short: {pages} pages')

              sample_pages = sorted(set([1, min(5, pages), min(20, pages), max(1, pages // 2), pages]))
              text = compact(extract_text(path, sample_pages))
              identity_ok = any(term in text for term in ['斯达半导体股份有限公司', '斯达半导', '603290', 'StarPowerSemiconductor'])
              title_ok = compact(title_term) in text
              if not identity_ok or not title_ok:
                  expanded = compact(extract_text(path, list(range(1, min(35, pages) + 1))))
                  identity_ok = any(term in expanded for term in ['斯达半导体股份有限公司', '斯达半导', '603290', 'StarPowerSemiconductor'])
                  title_ok = compact(title_term) in expanded
              if not identity_ok or not title_ok:
                  raise RuntimeError(f'{title} identity/title check failed: identity={identity_ok}, title={title_ok}')

              digest = hashlib.sha256(raw).hexdigest()
              rel = str(path.relative_to(ROOT))
              manifest.append({
                  'document_type': kind,
                  'title': title,
                  'disclosure_date': disclosure_date,
                  'file': rel,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': digest,
                  'source': '新浪财经公开披露镜像（原公告PDF）',
                  'source_url': source_url,
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': identity_ok,
                  'title_text_matched': title_ok,
                  'sampled_pages': sample_pages,
              })
              sha_lines.append(f'{digest}  {rel}')
              print(f'VERIFIED {title}: pages={pages}, bytes={len(raw)}')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '斯达半导体股份有限公司（斯达半导，603290）公开披露文件包',
              '',
              '内容：2020—2025年六份完整年度报告，以及截至2026年8月30日最新披露的2026年半年度报告。',
              '其中2022年度报告采用2023年4月11日披露的修订版。',
              '',
              '校验：PDF文件头及EOF、可解析页数、公司名称/证券代码、报告标题、逐份SHA-256、ZIP CRC。',
              '',
              '文件清单：',
          ]
          for item in manifest:
              readme.extend([
                  f'- {item["title"]}',
                  f'  披露日期：{item["disclosure_date"]}',
                  f'  页数：{item["pages"]}',
                  f'  文件：{item["file"]}',
                  f'  SHA256：{item["sha256"]}',
                  f'  来源：{item["source_url"]}',
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '斯达半导_603290_2020-2025年报_2026年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: starpower-filings-final
          path: 斯达半导_603290_2020-2025年报_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
