name: Package Hongxun Technology 603015 broker reports

on:
  push:
    paths:
      - '.github/workflows/hongxun-603015-broker-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '弘讯科技'
          FULL_COMPANY = '宁波弘讯科技股份有限公司'
          CODE = '603015'
          CUTOFF = '2026-10-28'
          CUTOFF_COMPACT = '20261028'
          ROOT_NAME = f'{COMPANY}_{CODE}_券商深度报告_精选3份_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          REPORT_DIR = ROOT / '报告PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          DIST = Path('dist')
          for directory in (REPORT_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          REPORTS = [
              {
                  'filename': '01_浙商证券_2018-06-05_首次覆盖_被忽视的工业4.0的践行者.pdf',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201806061153223149_1.pdf?1601214537000.pdf=',
                      'https://stock.tianyancha.com/ResearchReport/eastmoney/badc4f3f3a01895be5a6cc42270ad496.pdf',
                  ],
                  'broker': '浙商证券',
                  'date': '2018-06-05',
                  'title': '被忽视的工业4.0的践行者',
                  'authors': '李锋',
                  'rating': '买入',
                  'report_type': '公司深度/首次覆盖',
              },
              {
                  'filename': '02_天风证券_2018-05-03_首次覆盖_注塑机控制系统龙头迎来高增长全面布局工业4.0.pdf',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201805041137112016_1.pdf',
                  ],
                  'broker': '天风证券',
                  'date': '2018-05-03',
                  'title': '注塑机控制系统龙头迎来高增长，全面布局工业4.0、巩固优势地位',
                  'authors': '',
                  'rating': '买入（首次）',
                  'report_type': '公司深度/首次覆盖',
              },
              {
                  'filename': '03_西南证券_2015-05-18_首次覆盖_基本面优质的工业4.0明确标的.pdf',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201505190009664904_1.pdf?1432033084000.pdf=',
                  ],
                  'broker': '西南证券',
                  'date': '2015-05-18',
                  'title': '基本面优质的工业4.0明确标的',
                  'authors': '',
                  'rating': '买入（首次）',
                  'report_type': '公司深度/首次覆盖',
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6, connect=6, read=6, status=6, backoff_factor=1.0,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}), raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://data.eastmoney.com/report/',
          })

          def safe_name(value: str) -> str:
              return re.sub(r'_+', '_', re.sub(r'[\\/:*?"<>|]', '_', value)).strip('_. ')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          records = []
          for report in REPORTS:
              response = None
              used_url = None
              errors = []
              for url in report['urls']:
                  try:
                      candidate = session.get(url, timeout=180, allow_redirects=True)
                      print('DOWNLOAD', candidate.status_code, len(candidate.content), url, '->', candidate.url)
                      if candidate.status_code == 200 and len(candidate.content) >= 80_000 and candidate.content.startswith(b'%PDF'):
                          response = candidate
                          used_url = url
                          break
                      errors.append(f'{url}: status={candidate.status_code}, size={len(candidate.content)}, head={candidate.content[:12]!r}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              if response is None:
                  raise RuntimeError('No valid PDF for ' + report['title'] + ': ' + ' | '.join(errors))

              destination = REPORT_DIR / safe_name(report['filename'])
              destination.write_bytes(response.content)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception as exc:
                      raise RuntimeError(f'Encrypted PDF cannot be opened: {destination}: {exc}')
              page_count = len(reader.pages)
              if page_count < 2:
                  raise RuntimeError(f'Abnormal page count: {destination}: {page_count}')

              doc = fitz.open(destination)
              if doc.page_count != page_count:
                  raise RuntimeError(f'Parser page mismatch: {destination}: pypdf={page_count}, fitz={doc.page_count}')
              first_pix = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_pix = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first_pix.width, first_pix.height, last_pix.width, last_pix.height) < 100:
                  raise RuntimeError(f'Render validation failed: {destination}')
              first_pix.save(PREVIEW_DIR / f'{destination.stem}.png')

              text = ''
              for page_index in range(min(8, doc.page_count)):
                  try:
                      text += doc.load_page(page_index).get_text('text')
                  except Exception:
                      pass
              doc.close()
              compact = re.sub(r'\s+', '', text)
              if COMPANY not in compact and CODE not in compact and FULL_COMPANY not in compact:
                  raise RuntimeError(f'Company identity not found in PDF: {destination}')
              broker_key = report['broker'].replace('证券', '')
              if broker_key not in compact and report['broker'] not in compact:
                  raise RuntimeError(f'Broker identity not found in PDF: {destination}')

              # Capture the first-page text so the final package can be audited without OCR.
              first_page_text = ''
              try:
                  first_page_text = reader.pages[0].extract_text() or ''
              except Exception:
                  pass

              record = {
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'rating': report['rating'],
                  'report_type': report['report_type'],
                  'source_url': used_url,
                  'resolved_url': response.url,
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': sha256(destination),
                  'first_page_text_excerpt': re.sub(r'\s+', ' ', first_page_text).strip()[:1500],
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
                  'broker_identity_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'document_count': len(records),
              'selection_note': '公开可完整取得的公司研究报告主要集中于2015至2018年。本包优先选择篇幅较长的首次覆盖或公司深度报告。',
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）券商深度报告精选', '',
              f'- 截止日期：{CUTOFF}',
              '- 共3份公开可完整取得的公司深度/首次覆盖报告。',
              '- 所有PDF均保留原始内容，未合并、删页或重排。',
              '- 已完成PDF文件头、双解析器页数、公司与券商身份、首末页渲染、SHA-256及ZIP CRC校验。', '',
              '## 文件清单', '',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 机构：{record['broker']}；日期：{record['date']}；类型：{record['report_type']}",
                  f"   - 标题：{record['title']}",
                  f"   - 分析师：{record['authors'] or '见报告首页'}；评级：{record['rating']}",
                  f"   - 页数：{record['page_count']}；文件大小：{record['file_size_bytes']:,}字节",
                  f"   - 来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'hongxun_technology_603015_broker_deep_reports_3_{CUTOFF_COMPACT}.zip'
          for path in (chinese_zip, english_zip):
              if path.exists():
                  path.unlink()
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {path}: {bad}')
                  pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdfs) != 3:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {path}: {len(pdfs)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256(path))

          print('FINAL_JSON', json.dumps({
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': sha256(chinese_zip),
              'records': records,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongxun-603015-broker-reports-package-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
