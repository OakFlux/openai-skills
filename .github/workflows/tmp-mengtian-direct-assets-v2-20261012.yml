name: Test Mengtian Direct Assets V2

on:
  push:
    branches:
      - tmp-mengtian-603216-broker-reports-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests pillow pypdf
      - name: Test asset URLs
        shell: bash
        run: |
          python - <<'PY'
          import io,json,pathlib,requests
          from PIL import Image,ImageSequence
          from pypdf import PdfReader
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Accept':'*/*'})
          specs=[
            {'id':'59821','referer':'https://www.sgpjbg.com/baogao/59821.html','root':'https://file.sgpjbg.com/fileroot_temp1/2022-1/21/491c4d7b-b8ac-4745-b532-ec44622e21a7/491c4d7b-b8ac-4745-b532-ec44622e21a7','gif':'https://file.sgpjbg.com/fileroot_temp1/2022-1/21/491c4d7b-b8ac-4745-b532-ec44622e21a7/ab5c5c8bf19a40f28b16bb60bb3c3f79.gif'},
            {'id':'57012','referer':'https://www.sgpjbg.com/baogao/57012.html','root':'https://file.sgpjbg.com/fileroot_temp1/2021-12/13/1e36a52c-b28a-42c3-8ee2-17a139411d64/1e36a52c-b28a-42c3-8ee2-17a139411d64','gif':'https://file.sgpjbg.com/fileroot_temp1/2021-12/13/1e36a52c-b28a-42c3-8ee2-17a139411d64/3842101d79a14fb6b8b88e409f66d39b.gif'},
          ]
          out=pathlib.Path('asset-v2'); out.mkdir(exist_ok=True)
          rows=[]
          for spec in specs:
            root=spec['root']
            urls=[root,spec['gif']]
            for tail in ('.pdf','.PDF','.ppt','.pptx','.zip','/file.pdf','/report.pdf','/source.pdf','/index.pdf','/download.pdf','?download=1','?dtype=0'):
              urls.append(root+tail)
            urls += [f"https://www.sgpjbg.com/bgdown/{spec['id']}.html",f"https://www.sgpjbg.com/bgdown/{spec['id']}.html?dtype=0",f"https://m.sgpjbg.com/baogao/{spec['id']}.html"]
            for i,u in enumerate(dict.fromkeys(urls)):
              rec={'report_id':spec['id'],'url':u}
              try:
                r=s.get(u,headers={'Referer':spec['referer']},timeout=60,allow_redirects=True)
                data=r.content
                rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'content_disposition':r.headers.get('content-disposition'),'length':len(data),'first32':data[:32].hex()})
                path=out/f"{spec['id']}_{i:03d}.bin"; path.write_bytes(data); rec['local_name']=path.name
                if data.startswith(b'%PDF-'):
                  try: rec['pdf_pages']=len(PdfReader(io.BytesIO(data)).pages)
                  except Exception as e: rec['pdf_error']=repr(e)
                try:
                  im=Image.open(io.BytesIO(data)); rec['image_format']=im.format; rec['image_size']=list(im.size); rec['image_frames']=getattr(im,'n_frames',1)
                  rec['frames']=[{'i':j,'size':list(fr.size),'mode':fr.mode} for j,fr in enumerate(ImageSequence.Iterator(im)) if j<30]
                except Exception as e: rec['image_error']=repr(e)
              except Exception as e:
                rec['error']=repr(e)
              rows.append(rec); print(json.dumps(rec,ensure_ascii=False))
          (out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mengtian-Direct-Assets-V2
          path: asset-v2/*
          retention-days: 3
