name: Hangyan Native PDF Controller Probe

on:
  push:
    branches:
      - chatgpt-nanfang-precision-reports-20261004
    paths:
      - .github/workflows/hangyan_native_pdf_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Hangyan JavaScript and PDF endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, re, requests
          from urllib.parse import urljoin, quote

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          report_url='https://www.hangyan.co/reports/3492847056811197936'
          cache_key='Pm3HZU-De1Al3bHhgDSeh4m_k_0DBhufW5i9EPO1DLH7dnsMARvE2mtr9I3Y4IZyz4WY6zrOLIcwOZQMhp6eqyhh-HQo3sY6rR7Yk--KSPnVoq7sKJ4SUkRGaL7ZeOvgra6pykLHp23nhlapvdx6J2YuahlOMrn-fW9Q9a6tWNI='
          app='https://cdn.hangyan.co/assets/application-ec845e69.js'
          r=s.get(app,headers={'Referer':report_url},timeout=90)
          print('APP',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          text=r.text
          open('output/application.js','wb').write(r.content)
          patterns=['native-pdf','native_pdf','cacheKey','cache_key','cache-key','filenameValue','pageNumValue','iframeTarget','download()','Content-Disposition','application/pdf']
          snippets=[]
          for p in patterns:
              for m in re.finditer(re.escape(p),text,re.I):
                  sn=text[max(0,m.start()-2500):min(len(text),m.end()+5000)]
                  if sn not in snippets: snippets.append(sn)
          print('SNIP_COUNT',len(snippets))
          for i,sn in enumerate(snippets[:100]):
              print('\n---SNIP',i,'---\n',sn)
          open('output/snippets.txt','w',encoding='utf-8').write('\n\n---SNIP---\n\n'.join(snippets))

          endpoint_strings=sorted(set(re.findall(r'["\']([^"\']*(?:pdf|PDF|download|native)[^"\']*)["\']',text)))
          print('ENDPOINT_STRINGS',json.dumps(endpoint_strings[:1000],ensure_ascii=False,indent=2))
          result={'endpoint_strings':endpoint_strings,'probes':[]}

          candidates=[
              '/native_pdf', '/native-pdf', '/pdf', '/download',
              '/reports/3492847056811197936/pdf',
              '/reports/3492847056811197936/download',
              '/reports/3492847056811197936/native_pdf',
              '/reports/3492847056811197936/native-pdf',
              '/pdfs/'+quote(cache_key,safe=''),
              '/native_pdfs/'+quote(cache_key,safe=''),
              '/native-pdfs/'+quote(cache_key,safe=''),
          ]
          # Add endpoint-like strings extracted from the bundle.
          for value in endpoint_strings:
              if value.startswith('/') and len(value)<300:
                  candidates.append(value)
          seen=set()
          for path in candidates:
              if path in seen: continue
              seen.add(path)
              url=urljoin(report_url,path)
              for method in ('GET','POST'):
                  rec={'method':method,'url':url}
                  try:
                      kwargs={'headers':{'Referer':report_url,'Accept':'application/pdf,application/json,text/html,*/*'},'timeout':60,'allow_redirects':True}
                      if method=='GET':
                          rr=s.get(url,params={'cache_key':cache_key,'cacheKey':cache_key,'key':cache_key},**kwargs)
                      else:
                          rr=s.post(url,data={'cache_key':cache_key,'cacheKey':cache_key,'key':cache_key},**kwargs)
                      rec.update({'status':rr.status_code,'bytes':len(rr.content),'ctype':rr.headers.get('content-type'),'final':rr.url,'head':repr(rr.content[:80]),'is_pdf':rr.content.startswith(b'%PDF')})
                      if rec['is_pdf']:
                          open('output/found.pdf','wb').write(rr.content)
                      print('PROBE',json.dumps(rec,ensure_ascii=False))
                  except Exception as e:
                      rec['error']=repr(e)
                  result['probes'].append(rec)
          open('output/result.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-native-pdf-probe
          path: output/
          retention-days: 1
