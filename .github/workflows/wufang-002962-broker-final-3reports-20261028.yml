name: Package Wufang 002962 final broker research reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wufang-002962-broker-final-3reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='五方光电'; COMPANY_FULL='湖北五方光电股份有限公司'; STOCK_CODE='002962'
          AS_OF='2026-10-28'
          PACKAGE='五方光电_002962_券商深度与新股研究报告_完整版_3份_截至20261028'
          ROOT=Path(PACKAGE); PDF_DIR=ROOT/'PDF原文'; PREVIEW_DIR=ROOT/'首页预览'
          PDF_DIR.mkdir(parents=True,exist_ok=True); PREVIEW_DIR.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'国金证券','report_date':'2019-09-24','title':'摄像头创新不止，滤光片高景气持续',
              'analysts':'樊志远；联系人：鲁洋洋、邓小路','rating':'买入（首次评级）','report_type':'公司深度研究',
              'expected_pages':21,'url':'https://pdf.dfcfw.com/pdf/H3_AP201909251367534136_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP201909251367534136.html',
              'filename':'01_国金证券_五方光电_摄像头创新不止，滤光片高景气持续_2019-09-24.pdf'
            },
            {
              'broker':'华鑫证券','report_date':'2019-08-27','title':'新股询价报告：五方光电',
              'analysts':'于芳','rating':'未评级（新股询价）','report_type':'公司新股询价报告',
              'expected_pages':3,'url':'https://pdf.dfcfw.com/pdf/H3_AP201908271345170228_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP201908271345170228.html',
              'filename':'02_华鑫证券_五方光电_新股询价报告_2019-08-27.pdf'
            },
            {
              'broker':'新时代证券','report_date':'2019-09-01','title':'次新股说：本批科博达值得重点追踪（2019批次31、32）——中小盘IPO专题',
              'analysts':'孙金钜、任浪','rating':'未评级（IPO专题）','report_type':'中小盘IPO专题（含五方光电专门数据与分析）',
              'expected_pages':14,'url':'https://pdf.dfcfw.com/pdf/H3_AP201909021345499374_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP201909021345499374.html',
              'filename':'03_新时代证券_含五方光电_中小盘IPO专题_2019-09-01.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          manifest=[]
          for spec in reports:
            data=None; meta={}
            for attempt in range(8):
              try:
                r=s.get(spec['url'],timeout=(30,480),allow_redirects=True,headers={'User-Agent':ua,'Accept':'application/pdf,*/*;q=0.8','Referer':'https://data.eastmoney.com/report/'})
                meta={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000:
                  data=r.content; break
              except Exception as exc: meta={'error':repr(exc)}
              time.sleep(1+attempt)
            if data is None: raise RuntimeError(f"download failed {spec['title']}: {meta}")
            dest=PDF_DIR/spec['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages!=spec['expected_pages']: raise RuntimeError(f"page mismatch {dest.name}: {pages} != {spec['expected_pages']}")
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(20,pages)])
            compact=re.sub(r'\s+','',text)
            if not any(k in compact for k in [COMPANY,COMPANY_FULL,STOCK_CODE]): raise RuntimeError(f'issuer mismatch: {dest.name}')
            if spec['broker'] not in compact and spec['broker'].replace('证券','') not in compact: raise RuntimeError(f'broker mismatch: {dest.name}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREVIEW_DIR/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError(f'preview failed: {dest.name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**spec,'actual_pages':pages,'bytes':len(data),'sha256':sha,'download_meta':meta,'preview_file':str(Path('首页预览')/preview.name),'validation':['PDF header','issuer identity','broker identity','exact page count','qpdf structure','first-page render']})

          readme=[
            '湖北五方光电股份有限公司（002962.SZ）券商研究资料包',f'整理基准日：{AS_OF}','',
            '收录说明：严格意义上的公司深度报告共1份；另补充公司新股询价报告1份和覆盖五方光电的中小盘IPO专题1份。三份均为券商原始完整PDF，类型已逐一标注；未使用行业报告、其他公司报告或网页摘要凑数。',''
          ]
          for i,m in enumerate(manifest,1):
            readme += [f"{i}. {m['broker']}：《{m['title']}》",f"   类型：{m['report_type']}；日期：{m['report_date']}；分析师：{m['analysts']}；评级：{m['rating']}",f"   完整页数：{m['actual_pages']}页；文件：PDF原文/{m['filename']}",f"   来源：{m['source_page']}",f"   SHA-256：{m['sha256']}",'']
          readme += ['报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、公司名称/证券代码、券商身份、准确页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3: raise RuntimeError(f'zip validation failed: bad={bad}, pdfs={len(pdfs)}')
          short=Path('wufang_002962_broker_research_reports_3.zip'); short.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: wufang-002962-final-broker-reports-20261028
          path: |
            五方光电_002962_券商深度与新股研究报告_完整版_3份_截至20261028.zip
            wufang_002962_broker_research_reports_3.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
