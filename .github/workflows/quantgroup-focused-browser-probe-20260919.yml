name: Focused browser probe Quantgroup reports 20260919
on:
  push:
    paths:
      - '.github/workflows/quantgroup-focused-browser-probe-20260919.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install
        run: python -m pip install --quiet selenium requests
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,time,os,base64
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.common.exceptions import TimeoutException
          out=Path('focused_probe'); out.mkdir(exist_ok=True)
          pages=[('microbell','https://www.microbell.com/repinfodetail_5329571.html'),('fxbaogao','https://www.fxbaogao.com/detail/5553065')]
          op=Options(); op.add_argument('--headless=new'); op.add_argument('--no-sandbox'); op.add_argument('--disable-dev-shm-usage'); op.add_argument('--window-size=1400,1800'); op.add_argument('--disable-gpu')
          op.page_load_strategy='eager'
          op.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=op); d.set_page_load_timeout(25); d.set_script_timeout(15)
          d.execute_cdp_cmd('Network.enable',{})
          records=[]
          for idx,(name,url) in enumerate(pages,1):
            rec={'name':name,'input':url,'links':[],'network':[],'clicks':[],'errors':[]}
            try:
              try:d.get(url)
              except TimeoutException: print('PAGE_TIMEOUT',name,flush=True)
              time.sleep(6)
              rec['final']=d.current_url; rec['title']=d.title; src=d.page_source
              (out/f'{idx}_{name}.html').write_text(src,encoding='utf-8'); d.save_screenshot(str(out/f'{idx}_{name}.png'))
              print('PAGE',name,d.title,d.current_url,len(src),flush=True)
              for el in d.find_elements(By.XPATH,'//*'):
                try:
                  tag=el.tag_name; txt=(el.text or '').strip(); href=el.get_attribute('href') or ''; outer=el.get_attribute('outerHTML') or ''
                  low=(txt+' '+href+' '+outer).lower()
                  if any(k in low for k in ('下载报告','打开报告原文','download','\.pdf','pdfurl','fileurl','reportid','preview')):
                    item={'tag':tag,'text':txt[:300],'href':href,'outer':outer[:2000]}
                    rec['links'].append(item); print('DOM',json.dumps(item,ensure_ascii=False)[:3000],flush=True)
                except Exception: pass
              # Gather initial performance log
              def collect(label):
                logs=d.get_log('performance')
                for z in logs:
                  try:
                    m=json.loads(z['message'])['message']
                    if m['method'] in ('Network.responseReceived','Network.requestWillBeSent'):
                      p=m['params']; obj=p.get('response') or p.get('request') or {}; u=obj.get('url',''); typ=p.get('type',''); mime=obj.get('mimeType',''); st=obj.get('status')
                      low=(u+' '+mime).lower()
                      if any(k in low for k in ('pdf','download','report','file','preview','attachment','repinfo','5329571','5553065','api')):
                        item={'label':label,'method':m['method'],'url':u,'type':typ,'mime':mime,'status':st,'requestId':p.get('requestId')}; rec['network'].append(item); print('NET',json.dumps(item,ensure_ascii=False),flush=True)
                  except Exception: pass
              collect('initial')
              # click visible exact report buttons using fresh element each time
              xpaths=["//*[contains(normalize-space(.),'打开报告原文')]","//*[contains(normalize-space(.),'下载报告')]","//a[contains(@href,'.pdf')]","//*[contains(translate(normalize-space(.),'DOWNLOAD','download'),'download')]"]
              for xp in xpaths:
                try:
                  els=d.find_elements(By.XPATH,xp)
                  for pos in range(min(len(els),2)):
                    try:
                      el=els[pos]
                      if not el.is_displayed(): continue
                      before=d.current_url; outer=el.get_attribute('outerHTML') or ''; txt=(el.text or '').strip()
                      print('CLICK',name,txt[:100],outer[:1200],flush=True)
                      d.execute_script("arguments[0].scrollIntoView({block:'center'});",el); time.sleep(.5)
                      d.execute_script('arguments[0].click();',el); time.sleep(4)
                      after=d.current_url; rec['clicks'].append({'text':txt,'outer':outer[:3000],'before':before,'after':after}); print('CLICK_AFTER',after,flush=True); collect('afterclick')
                      if after!=before:
                        try:d.back(); time.sleep(3)
                        except:pass
                    except Exception as e: rec['errors'].append('click '+repr(e))
                except Exception as e: rec['errors'].append('xpath '+repr(e))
              # regex interesting URLs/keys
              vals=set()
              pats=[r'https?://[^\s"\'<>]+',r'(?:pdfUrl|pdf_url|fileUrl|file_url|downloadUrl|download_url|reportUrl|report_url|previewUrl|preview_url)\s*[:=]\s*["\']([^"\']+)',r'["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']']
              for pat in pats:
                for m in re.finditer(pat,src,re.I): vals.add((m.group(1) if m.lastindex else m.group(0)).replace('\\/','/'))
              rec['regex']=sorted(v for v in vals if any(k in v.lower() for k in ('pdf','download','report','file','preview','5329571','5553065')))
              for v in rec['regex']: print('REGEX',v[:2500],flush=True)
            except Exception as e: rec['errors'].append(repr(e)); print('ERR',name,repr(e),flush=True)
            (out/f'{idx}_{name}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8'); records.append(rec)
          d.quit(); (out/'all.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-focused-browser-probe-20260919
          path: focused_probe
          retention-days: 7
          compression-level: 6
