name: Inspect Longxi Microbell Report

on:
  push:
    branches:
      - tmp-longxi-600592-broker-reports-20261004

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect report page and assets
        shell: bash
        run: |
          python - <<'PY'
          import re, json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          page='https://www.microbell.com/repinfodetail_4299127.html'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36','Referer':'https://www.microbell.com/'})
          r=s.get(page,timeout=45)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          r.encoding=r.apparent_encoding or 'utf-8'
          text=r.text
          open('/tmp/page.html','w',encoding='utf-8').write(text)
          soup=BeautifulSoup(text,'html.parser')
          print('TITLE', soup.title.get_text(' ',strip=True) if soup.title else '')
          print('\nFORMS')
          for f in soup.find_all('form'):
              print('FORM',f.get('id'),f.get('name'),f.get('method'),urljoin(page,f.get('action') or ''))
              for inp in f.find_all(['input','button']):
                  print('  ',inp.name,inp.get('type'),inp.get('name'),inp.get('id'),inp.get('value'),inp.get('onclick'))
          print('\nSCRIPTS')
          for sc in soup.find_all('script'):
              src=sc.get('src')
              if src:
                  print('SRC',urljoin(page,src))
              body=sc.get_text('\n',strip=False)
              if any(k in body.lower() for k in ('download','checkmd5','report','repinfo','pdf','4299127','login')):
                  print('INLINE',body[:6000])
          print('\nLINKS')
          for a in soup.find_all('a',href=True):
              href=urljoin(page,a['href'])
              txt=' '.join(a.get_text(' ',strip=True).split())
              blob=' '.join([txt,href,a.get('onclick') or '',a.get('id') or '', ' '.join(a.get('class') or [])])
              if any(k in blob.lower() for k in ('download','下载','原文','pdf','checkmd5','report','repinfo')):
                  print(txt,'=>',href,'onclick=',a.get('onclick'),'id=',a.get('id'),'class=',a.get('class'))
          print('\nALL INTERESTING HTML LINES')
          for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in ('download','checkmd5','4299127','pdf','reporturl','fileurl','repinfoid','repinfo')):
                  print(line[:2500])

          # Fetch all script files and inspect for download endpoints.
          for sc in soup.find_all('script',src=True):
              u=urljoin(page,sc['src'])
              try:
                  q=s.get(u,timeout=30)
                  q.encoding=q.apparent_encoding or 'utf-8'
                  body=q.text
                  if any(k in body.lower() for k in ('download','checkmd5','pdf','repinfo','report')):
                      print('\nSCRIPT_BODY',u,'status',q.status_code,'len',len(body))
                      for line in body.splitlines():
                          if any(k in line.lower() for k in ('download','checkmd5','pdf','repinfo','report')):
                              print(line[:2500])
              except Exception as e:
                  print('SCRIPT_ERR',u,e)

          # Probe known preview asset and likely neighboring resources.
          asset='https://huibobjb.hibor.com.cn/CheckMd5File/img/2025/7/202507202237559702.gif'
          candidates=[
              asset,
              asset.replace('/img/','/pdf/').replace('.gif','.pdf'),
              asset.replace('/img/','/file/').replace('.gif','.pdf'),
              asset.replace('.gif','.pdf'),
              'https://huibobjb.hibor.com.cn/CheckMd5File/pdf/2025/7/202507202237559702.pdf',
              'https://huibobjb.hibor.com.cn/CheckMd5File/2025/7/202507202237559702.pdf',
          ]
          for u in candidates:
              try:
                  q=s.get(u,timeout=30,allow_redirects=True)
                  print('PROBE',u,'=>',q.status_code,len(q.content),q.url,q.headers.get('content-type'),q.headers.get('content-disposition'),q.content[:8])
              except Exception as e:
                  print('PROBE_ERR',u,e)
          PY
