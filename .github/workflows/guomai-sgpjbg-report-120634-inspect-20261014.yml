name: Inspect public Guomai report page 120634
on:
  push:
    paths:
      - '.triggers/guomai-sgpjbg-report-120634-inspect-20261014.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect page assets
        run: |
          python - <<'PY'
          import requests,re,json,urllib.parse
          from pathlib import Path
          out=Path('inspect'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.sgpjbg.com/'})
          urls=['https://www.sgpjbg.com/baogao/120634.html','https://www.sgpjbg.com/bgdown/120634.html']
          candidates=set()
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              print('PAGE',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; (out/f'page_{i}.html').write_text(text,encoding='utf-8',errors='replace')
              for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                x=m.group(0).replace('\\/','/').rstrip(');,]}')
                if any(k in x.lower() for k in ('pdf','download','file','preview','attach','120634')): candidates.add(x)
              for m in re.finditer(r'["\']([^"\']+)["\']',text):
                x=m.group(1)
                if any(k in x.lower() for k in ('pdf','download','file','preview','attach','120634')):
                  candidates.add(urllib.parse.urljoin(r.url,x))
              for pat in ('pdf','download','file','preview','120634'):
                for m in list(re.finditer(pat,text,re.I))[:80]:
                  print('SNIP',i,pat,text[max(0,m.start()-200):min(len(text),m.end()+400)].replace('\n',' ')[:700],flush=True)
            except Exception as e: print('PAGE_ERR',u,repr(e),flush=True)
          print('CANDIDATES',json.dumps(sorted(candidates),ensure_ascii=False),flush=True)
          for j,u in enumerate(sorted(candidates),1):
            if len(u)>1000 or any(t in u for t in ('${','javascript:')): continue
            try:
              r=s.get(u,timeout=45,allow_redirects=True)
              rec={'url':u,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'final':r.url,'prefix':r.content[:8].hex()}
              print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
              if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                (out/f'found_{j:03d}.pdf').write_bytes(r.content)
            except Exception as e: print('PROBE_ERR',u,repr(e),flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: guomai-sgpjbg-report-120634-inspection
          path: inspect
          retention-days: 7
          if-no-files-found: error
