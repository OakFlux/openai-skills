name: Build Juneyao Airlines broker deep-report package

on:
  push:
    branches: [tmp-juneyao-broker-reports-20261016-v2]
    paths: ['.github/workflows/tmp-juneyao-broker-package-20261016-v2.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='吉祥航空_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=603885' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 8 "$out" "$out.txt" 2>/dev/null
            grep -Eq '吉祥航空|上海吉祥航空股份有限公司' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202407161637969487_1.pdf' \
            "$PACKAGE/01_信达证券_民营航空巨头国内外航线稳步发展_2024-07-16.pdf" \
            25

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202310251603470956_1.pdf' \
            "$PACKAGE/02_申港证券_复苏加速民营航企龙头重回正轨_2023-10-25.pdf" \
            18

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202304021585025574_1.pdf' \
            "$PACKAGE/03_华金证券_供求错配周期中的强阿尔法_2023-04-03.pdf" \
            30

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('吉祥航空_券商深度报告_3份')
          meta = {
              '01_信达证券_民营航空巨头国内外航线稳步发展_2024-07-16.pdf': {
                  'broker': '信达证券',
                  'title': '公司深度报告：民营航空巨头，国内外航线稳步发展',
                  'date': '2024-07-16',
                  'index': 'AP202407161637969487',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202407161637969487_1.pdf',
              },
              '02_申港证券_复苏加速民营航企龙头重回正轨_2023-10-25.pdf': {
                  'broker': '申港证券',
                  'title': '首次覆盖报告：复苏加速，民营航企龙头重回正轨',
                  'date': '2023-10-25',
                  'index': 'AP202310251603470956',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202310251603470956_1.pdf',
              },
              '03_华金证券_供求错配周期中的强阿尔法_2023-04-03.pdf': {
                  'broker': '华金证券',
                  'title': '深度报告：供求错配周期中的强阿尔法',
                  'date': '2023-04-03',
                  'index': 'AP202304021585025574',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202304021585025574_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '吉祥航空（603885）券商公司深度报告',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 收录公开可下载的完整公司深度或首次覆盖报告3份。',
              '2. 已排除篇幅较短的月度经营、业绩快报及定期报告点评。',
              '3. 三份报告覆盖航线网络、国际化恢复、供需周期及民营航司经营弹性等核心议题。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Juneyao-Airlines-broker-deep-reports-3
          path: 吉祥航空_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
