name: Probe SGPJBG Yueyang Xingchang report 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-probe-sgpjbg-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Find report page and asset URLs
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          labels=[
            'https://www.sgpjbg.com/labels/toumingjubingxixingye.html',
            'https://www.sgpjbg.com/labels/jubingxippgongjiqingkuang.html',
            'https://www.sgpjbg.com/labels/jingxihuagongxingyegaikuang.html',
          ]
          report_urls=[]
          for url in labels:
            r=s.get(url,timeout=(30,180),allow_redirects=True)
            print('LABEL',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            text=r.text
            soup=BeautifulSoup(text,'html.parser')
            for a in soup.find_all('a',href=True):
              label=' '.join(a.get_text(' ',strip=True).split())
              title=a.get('title') or ''
              combined=label+' '+title
              if '岳阳兴长' in combined and '炼化精细化工龙头' in combined:
                absolute=urljoin(url,a['href'])
                print('MATCH_ANCHOR',json.dumps({'text':label,'title':title,'href':a['href'],'absolute':absolute},ensure_ascii=False))
                report_urls.append(absolute)
          report_urls=list(dict.fromkeys(report_urls))
          print('REPORT_URLS',json.dumps(report_urls,ensure_ascii=False))
          for url in report_urls:
            r=s.get(url,timeout=(30,180),allow_redirects=True)
            print('\nREPORT',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            text=r.text
            soup=BeautifulSoup(text,'html.parser')
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
            # print relevant metadata and hidden inputs
            for tag in soup.find_all(['meta','input','a','iframe','embed','object','script']):
              attrs={k:str(v) for k,v in tag.attrs.items()}
              serialized=json.dumps(attrs,ensure_ascii=False)
              body=tag.get_text(' ',strip=True)[:300]
              low=(serialized+' '+body).lower()
              if any(token in low for token in ('pdf','fileupload','fileroot','bgdown','download','doctype','docurl','filepath','viewfile','bookid')):
                print('TAG',tag.name,serialized,body)
            urls=[]
            patterns=[
              r'https?://[^\"\'<>\s]+',
              r'[/A-Za-z0-9_.?=&%-]+(?:\.pdf|bgdown|download|fileroot|fileupload)[/A-Za-z0-9_.?=&%-]*',
            ]
            for pattern in patterns:
              urls.extend(re.findall(pattern,text,re.I))
            uniq=[]
            for u in urls:
              u=html.unescape(u)
              if u not in uniq and any(t in u.lower() for t in ('pdf','file','download','bgdown','sgpjbg')):
                uniq.append(u)
            print('URL_HITS',json.dumps(uniq[:500],ensure_ascii=False))
            # contexts around likely variables
            for needle in ['fileroot','FileUpload','bgdown','pdfurl','PdfUrl','filePath','FilePath','docurl','DocUrl','BookID','bookid','DownLoad','download']:
              pos=0; shown=0
              while True:
                idx=text.find(needle,pos)
                if idx<0 or shown>=20: break
                print('CTX',needle,text[max(0,idx-500):idx+1200].replace('\n',' ')[:1800])
                pos=idx+len(needle); shown+=1
            # probe direct download endpoint
            m=re.search(r'/baogao/(\d+)\.html',r.url)
            if m:
              rid=m.group(1)
              for durl in [f'https://www.sgpjbg.com/bgdown/{rid}.html',f'https://www.sgpjbg.com/bgdown/{rid}.html?dtype=0']:
                dr=s.get(durl,timeout=(30,180),allow_redirects=True)
                print('DOWNLOAD_PROBE',durl,dr.status_code,len(dr.content),dr.url,dr.headers.get('content-type'),dr.content[:16].hex())
          PY
