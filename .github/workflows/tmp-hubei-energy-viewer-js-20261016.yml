name: Capture Hubei Energy public report viewer scripts

on:
  push:
    branches: [tmp-hubei-energy-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hubei-energy-viewer-js-20261016.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download public viewer scripts
        run: |
          set -euo pipefail
          mkdir -p capture
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          urls=(
            'https://static.fxbaogao.com/pub/js/config/production.js'
            'https://www.fxbaogao.com/_fxbg/2610141742/js/runtime.4eb28314ecb0c4a7c50c.js'
            'https://www.fxbaogao.com/_fxbg/2610141742/js/vendors~app-pages-fxbg-main-js.f7b12df6cb87e7f5ac48.chunk.js'
            'https://www.fxbaogao.com/_fxbg/2610141742/js/app-pages-fxbg-main-js.fd6234d1ab18d90a303e.chunk.js'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            curl --http1.1 -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A "$UA" "$url" -o "capture/$i.js"
            echo "$url" > "capture/$i.url.txt"
            wc -c "capture/$i.js"
          done
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: hubei-energy-public-viewer-js
          path: capture/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
