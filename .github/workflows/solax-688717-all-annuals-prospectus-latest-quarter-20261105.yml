name: Package SolaX filings annuals prospectus latest quarter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solax-688717-all-annuals-prospectus-latest-quarter-20261105.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import io
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import pymupdf
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '艾罗能源'
          FULL_NAME = '浙江艾罗网络能源技术股份有限公司'
          CODE = '688717'
          CUTOFF = '2026-11-05'
          COMPACT = '20261105'
          PACKAGE_NAME = f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{COMPACT}'
          ROOT = Path('work') / PACKAGE_NAME
          PDF_DIR = ROOT / '报告PDF'
          PREVIEW_DIR = ROOT / '首页与末页预览'
          DIST = Path('dist')
          for directory in (PDF_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          retry = Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=0.8,
              status_forcelist=(403, 408, 425, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET', 'POST'}),
              raise_on_status=False,
          )
          adapter = HTTPAdapter(max_retries=retry)
          session.mount('https://', adapter)
          session.mount('http://', adapter)
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def clean_title(value: str) -> str:
              value = re.sub(r'<[^>]+>', '', value or '')
              return re.sub(r'\s+', '', html.unescape(value))

          def query_cninfo(*, date_range: str, category: str = '', searchkey: str = '') -> list[dict]:
              endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              headers = {
                  'Referer': f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={CODE}',
                  'X-Requested-With': 'XMLHttpRequest',
                  'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              }
              all_rows: list[dict] = []
              attempts = [
                  (CODE, searchkey),
                  ('', searchkey or COMPANY),
                  (CODE, searchkey or COMPANY),
              ]
              for stock_value, key in attempts:
                  data = {
                      'pageNum': '1',
                      'pageSize': '100',
                      'column': 'sse',
                      'tabName': 'fulltext',
                      'plate': 'sh',
                      'stock': stock_value,
                      'searchkey': key,
                      'secid': '',
                      'category': category,
                      'trade': '',
                      'seDate': date_range,
                      'sortName': 'time',
                      'sortType': 'desc',
                      'isHLtitle': 'true',
                  }
                  response = session.post(endpoint, headers=headers, data=data, timeout=120)
                  print('CNINFO_QUERY', response.status_code, len(response.content), stock_value, category, key, flush=True)
                  if response.status_code != 200:
                      continue
                  try:
                      payload = response.json()
                  except Exception as exc:
                      print('CNINFO_JSON_ERROR', repr(exc), response.text[:500], flush=True)
                      continue
                  rows = payload.get('announcements') or []
                  print('CNINFO_ROWS', len(rows), flush=True)
                  all_rows.extend(rows)
                  if rows and any(str(row.get('secCode', '')).strip() == CODE for row in rows):
                      break
              dedup: dict[str, dict] = {}
              for row in all_rows:
                  if str(row.get('secCode', '')).strip() != CODE:
                      continue
                  key = str(row.get('announcementId') or row.get('adjunctUrl') or row.get('announcementTitle'))
                  dedup[key] = row
              return list(dedup.values())

          def announcement_url(row: dict) -> str:
              adjunct = str(row.get('adjunctUrl') or '').strip()
              if adjunct.startswith(('http://', 'https://')):
                  return adjunct
              if not adjunct:
                  raise ValueError('announcement has no adjunctUrl')
              return urljoin('https://static.cninfo.com.cn/', adjunct.lstrip('/'))

          annual_rows = query_cninfo(
              date_range='2024-01-01~2026-11-05',
              category='category_ndbg_szsh;',
          )
          if not annual_rows:
              annual_rows = query_cninfo(
                  date_range='2024-01-01~2026-11-05',
                  searchkey='年度报告',
              )
          print('ANNUAL_ROWS', json.dumps([
              {
                  'title': clean_title(str(row.get('announcementTitle') or '')),
                  'time': row.get('announcementTime'),
                  'url': row.get('adjunctUrl'),
              }
              for row in annual_rows
          ], ensure_ascii=False, indent=2), flush=True)

          filings: list[dict] = []
          for year in (2023, 2024, 2025):
              target = f'{year}年年度报告'
              candidates = []
              for row in annual_rows:
                  title = clean_title(str(row.get('announcementTitle') or ''))
                  if target not in title:
                      continue
                  if any(blocked in title for blocked in ('摘要', '英文版', '审计报告', '财务决算报告', '更正公告', '提示性公告', 'ESG', '环境、社会')):
                      continue
                  corrected = any(marker in title for marker in ('更正后', '修订后', '更新后', '修订版'))
                  timestamp = int(row.get('announcementTime') or 0)
                  candidates.append((corrected, timestamp, row, title))
              if not candidates:
                  raise RuntimeError(f'未找到{target}完整全文')
              candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
              corrected, _, selected, title = candidates[0]
              filings.append({
                  'order_group': 2,
                  'year': year,
                  'period': f'{year}年',
                  'report_type': '年度报告',
                  'announcement_title': title,
                  'url': announcement_url(selected),
                  'source': '巨潮资讯网',
                  'corrected': bool(corrected),
                  'announcement_time': selected.get('announcementTime'),
              })

          quarter_rows = query_cninfo(
              date_range='2026-10-01~2026-11-05',
              searchkey='2026年第三季度报告',
          )
          print('QUARTER_ROWS', json.dumps([
              {
                  'title': clean_title(str(row.get('announcementTitle') or '')),
                  'time': row.get('announcementTime'),
                  'url': row.get('adjunctUrl'),
              }
              for row in quarter_rows
          ], ensure_ascii=False, indent=2), flush=True)
          quarter_candidates = []
          for row in quarter_rows:
              title = clean_title(str(row.get('announcementTitle') or ''))
              if '2026年第三季度报告' not in title:
                  continue
              if any(blocked in title for blocked in ('摘要', '提示性公告', '业绩说明会')):
                  continue
              quarter_candidates.append((int(row.get('announcementTime') or 0), row, title))
          if not quarter_candidates:
              raise RuntimeError('未找到2026年第三季度报告完整全文')
          quarter_candidates.sort(key=lambda item: item[0], reverse=True)
          _, quarter_row, quarter_title = quarter_candidates[0]

          prospectus = {
              'order_group': 1,
              'year': 2023,
              'period': '2023年12月28日',
              'report_type': '招股说明书',
              'announcement_title': '首次公开发行股票并在科创板上市招股说明书',
              'url': 'https://static.cninfo.com.cn/finalpage/2023-12-28/1218746774.PDF',
              'source': '巨潮资讯网（最终正式发行版）',
              'corrected': False,
              'announcement_time': int(datetime(2023, 12, 28, tzinfo=timezone.utc).timestamp() * 1000),
          }
          filings.insert(0, prospectus)
          filings.append({
              'order_group': 3,
              'year': 2026,
              'period': '2026年第三季度',
              'report_type': '第三季度报告',
              'announcement_title': quarter_title,
              'url': announcement_url(quarter_row),
              'source': '巨潮资讯网',
              'corrected': False,
              'announcement_time': quarter_row.get('announcementTime'),
          })

          def download_pdf(item: dict) -> tuple[bytes, str, str]:
              candidates = [item['url']]
              if 'static.cninfo.com.cn/' in item['url']:
                  candidates.append(item['url'].replace('https://static.cninfo.com.cn/', 'http://static.cninfo.com.cn/'))
              last_error = None
              for candidate in dict.fromkeys(candidates):
                  try:
                      response = session.get(
                          candidate,
                          headers={
                              'Referer': 'https://www.cninfo.com.cn/',
                              'Accept': 'application/pdf,*/*;q=0.8',
                          },
                          timeout=300,
                          allow_redirects=True,
                      )
                      print('DOWNLOAD', item['report_type'], item['period'], response.status_code, len(response.content), response.url, response.headers.get('content-type'), flush=True)
                      if response.status_code == 200 and response.content.startswith(b'%PDF') and len(response.content) > 50_000:
                          return response.content, response.url, response.headers.get('content-type') or ''
                      last_error = RuntimeError(f'bad response {response.status_code}, bytes={len(response.content)}, url={response.url}')
                  except Exception as exc:
                      print('DOWNLOAD_ERROR', item['period'], candidate, repr(exc), flush=True)
                      last_error = exc
              raise RuntimeError(f"下载失败：{item['report_type']} {item['period']} {last_error}")

          records = []
          for index, item in enumerate(filings, start=1):
              data, resolved_url, content_type = download_pdf(item)
              reader = PdfReader(io.BytesIO(data), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception:
                      pass
              page_count = len(reader.pages)
              minimum_pages = {
                  '招股说明书': 250,
                  '年度报告': 100,
                  '第三季度报告': 5,
              }[item['report_type']]
              if page_count < minimum_pages:
                  raise RuntimeError(f"页数异常：{item['report_type']} {item['period']} pages={page_count}")

              probe_indices = sorted(set(list(range(min(15, page_count))) + [page_count - 1]))
              text_parts = []
              for page_index in probe_indices:
                  try:
                      text_parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception as exc:
                      print('TEXT_EXTRACT_WARNING', item['period'], page_index, repr(exc), flush=True)
              sample_text = re.sub(r'\s+', ' ', '\n'.join(text_parts)).strip()
              compact_text = re.sub(r'\s+', '', sample_text)
              if FULL_NAME not in compact_text and COMPANY not in compact_text:
                  raise RuntimeError(f"公司身份校验失败：{item['report_type']} {item['period']}")
              if item['report_type'] == '招股说明书':
                  expected_tokens = ('首次公开发行股票', '招股说明书')
              elif item['report_type'] == '年度报告':
                  expected_tokens = (f"{item['year']}年年度报告",)
              else:
                  expected_tokens = ('2026年第三季度报告',)
              if not all(token in compact_text for token in expected_tokens):
                  raise RuntimeError(f"报告类型或报告期校验失败：{item['report_type']} {item['period']}")
              if item['report_type'] == '第三季度报告' and CODE not in compact_text:
                  raise RuntimeError('最新季报证券代码校验失败')

              suffix = '_更正后' if item.get('corrected') else ''
              if item['report_type'] == '招股说明书':
                  label = '首次公开发行股票并在科创板上市招股说明书_最终正式版'
              elif item['report_type'] == '年度报告':
                  label = f"{item['year']}年年度报告{suffix}"
              else:
                  label = '2026年第三季度报告'
              file_name = f"{index:02d}_{COMPANY}_{CODE}_{label}.pdf"
              path = PDF_DIR / file_name
              path.write_bytes(data)

              document = pymupdf.open(path)
              if document.page_count != page_count:
                  raise RuntimeError(f"双解析器页数不一致：{file_name} pypdf={page_count}, pymupdf={document.page_count}")
              first = document.load_page(0).get_pixmap(matrix=pymupdf.Matrix(1.5, 1.5), alpha=False)
              last = document.load_page(document.page_count - 1).get_pixmap(matrix=pymupdf.Matrix(1.0, 1.0), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 400:
                  raise RuntimeError(f"页面渲染异常：{file_name}")
              first.save(PREVIEW_DIR / f'{Path(file_name).stem}_首页.png')
              last.save(PREVIEW_DIR / f'{Path(file_name).stem}_末页.png')
              document.close()

              record = {
                  **item,
                  'file_name': file_name,
                  'resolved_url': resolved_url,
                  'content_type': content_type,
                  'page_count': page_count,
                  'file_size_bytes': path.stat().st_size,
                  'sha256': sha256(path),
                  'pdf_header_valid': True,
                  'company_identity_validated': True,
                  'report_period_validated': True,
                  'dual_parser_page_count_validated': True,
                  'first_and_last_pages_rendered': True,
                  'text_sample': sample_text[:1000],
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 5:
              raise RuntimeError(f'文件数量异常：{len(records)}')
          annual_years = [r['year'] for r in records if r['report_type'] == '年度报告']
          if annual_years != [2023, 2024, 2025]:
              raise RuntimeError(f'年度报告年份异常：{annual_years}')

          manifest = {
              'company_short_name': COMPANY,
              'company_full_name': FULL_NAME,
              'stock_code': CODE,
              'listing_date': '2024-01-03',
              'requested_scope': '上市以来全部年度报告、最终正式版招股说明书及截至2026-11-05最新季度报告',
              'annual_report_scope': '2023-2025年度（公司于2024-01-03上市）',
              'latest_quarterly_report': '2026年第三季度报告（披露日期2026-10-31）',
              'selection_policy': '年报采用完整全文，排除摘要、审计报告、ESG报告和提示性公告；招股说明书采用2023-12-28最终正式发行版。',
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          readme = [
              f'# {COMPANY}（{CODE}）全部年报、招股说明书及最新季报',
              '',
              f'- 截止日期：{CUTOFF}',
              '- 上市日期：2024-01-03。',
              '- 上市以来年度报告：2023、2024、2025年度，共3份。',
              '- 招股说明书：2023-12-28最终正式发行版。',
              '- 最新季报：2026年第三季度报告，披露日期为2026-10-31。',
              '- 排除：年报摘要、审计报告、ESG报告、提示性公告及重复文件。',
              '- 校验：PDF文件头、公司与报告身份、双解析器页数、首末页渲染、SHA-256及ZIP CRC。',
              '',
              '## 文件清单',
              '',
          ]
          for number, record in enumerate(records, start=1):
              readme += [
                  f'{number}. `{record["file_name"]}`',
                  f'   - 公告标题：{record["announcement_title"]}',
                  f'   - 页数：{record["page_count"]}',
                  f'   - 来源：{record["resolved_url"]}',
                  f'   - SHA-256：`{record["sha256"]}`',
              ]
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (ROOT / '文件清单.txt').write_text('\n'.join(record['file_name'] for record in records) + '\n', encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{record['sha256']}  报告PDF/{record['file_name']}\n" for record in records),
              encoding='utf-8',
          )

          cn_zip = DIST / f'{PACKAGE_NAME}.zip'
          en_zip = DIST / f'solax_power_688717_all_annual_reports_prospectus_latest_quarter_{COMPACT}.zip'
          with zipfile.ZipFile(cn_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(cn_zip, en_zip)

          for zip_path in (cn_zip, en_zip):
              with zipfile.ZipFile(zip_path, 'r') as archive:
                  bad_member = archive.testzip()
                  if bad_member:
                      raise RuntimeError(f'ZIP CRC校验失败：{bad_member}')
                  pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdf_names) != 5:
                      raise RuntimeError(f'ZIP内PDF数量异常：{len(pdf_names)}')
              print('ZIP_VERIFIED', zip_path, zip_path.stat().st_size, sha256(zip_path), flush=True)

          print('FINAL_SUMMARY', json.dumps({
              'chinese_zip': str(cn_zip),
              'english_zip': str(en_zip),
              'zip_size_bytes': cn_zip.stat().st_size,
              'zip_sha256': sha256(cn_zip),
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'records': [
                  {
                      'file_name': record['file_name'],
                      'announcement_title': record['announcement_title'],
                      'page_count': record['page_count'],
                      'resolved_url': record['resolved_url'],
                      'sha256': record['sha256'],
                  }
                  for record in records
              ],
          }, ensure_ascii=False), flush=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: solax-688717-all-annuals-prospectus-latest-quarter-20261105
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
