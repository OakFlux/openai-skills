name: Nanfang Precision Reader Interface Probe

on:
  push:
    branches:
      - chatgpt-nanfang-precision-reports-20261004
    paths:
      - .github/workflows/nanfang_precision_reader_interface_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Inspect reader pages and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          import re
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          targets = [
              ('fx_detail_2016','https://www.fxbaogao.com/detail/76452'),
              ('fx_view_2016','https://www.fxbaogao.com/view?id=76452'),
              ('hangyan_2024','https://www.hangyan.co/reports/3492847056811197936'),
              ('sina_2026','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/822148019858/index.phtml'),
              ('sina_2022','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/718998434579/index.phtml'),
              ('sina_2016_guojin','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/523524453420/index.phtml'),
              ('sina_2016_guotou','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/524057227848/index.phtml'),
          ]
          output = {'pages': [], 'scripts': []}

          def decode(r):
              for enc in ('utf-8','gb18030',r.apparent_encoding):
                  if not enc: continue
                  try: return r.content.decode(enc)
                  except Exception: pass
              return r.text

          def snippets(text, patterns, max_total=80):
              out=[]
              for pattern in patterns:
                  for m in re.finditer(pattern,text,re.I):
                      sn=re.sub(r'\s+',' ',text[max(0,m.start()-900):min(len(text),m.end()+1600)])[:3000]
                      if sn not in out: out.append(sn)
                      if len(out)>=max_total: return out
              return out

          script_urls=[]
          for name,url in targets:
              rec={'name':name,'url':url}
              try:
                  r=s.get(url,timeout=90,allow_redirects=True)
                  text=decode(r)
                  rec.update({'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'final':r.url})
                  soup=BeautifulSoup(text,'html.parser')
                  rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                  scripts=[]
                  for tag in soup.find_all('script',src=True):
                      src=urljoin(r.url,tag['src'])
                      scripts.append(src)
                      if src not in script_urls: script_urls.append(src)
                  rec['scripts']=scripts
                  attrs=[]
                  for tag in soup.find_all(True):
                      hit={}
                      for key,value in tag.attrs.items():
                          sval=' '.join(value) if isinstance(value,list) else str(value)
                          if any(term in key.lower() or term in sval.lower() for term in (
                              'pdf','native-pdf','cache-key','download','report-image','filename','document'
                          )):
                              hit[key]=sval
                      if hit:
                          attrs.append({'tag':tag.name,'attrs':hit})
                  rec['interesting_attrs']=attrs[:500]
                  rec['raw_urls']=sorted(set(
                      x.replace('\\/','/') for x in re.findall(r'https?:(?:\\/\\/|//)[^\"\'<>\s]+',text)
                      if any(term in x.lower() for term in ('pdf','report-image','download','native','document','file'))
                  ))[:500]
                  rec['relative_candidates']=sorted(set(re.findall(
                      r'[\"\']([^\"\']*(?:pdf|download|native-pdf|document|report-image)[^\"\']*)[\"\']',text,re.I
                  )))[:500]
                  rec['snippets']=snippets(text,[
                      r'native-pdf',r'cache-key',r'cache_key',r'pdfUrl',r'pdf_url',r'fileUrl',r'download',
                      r'report-image',r'76452',r'3492847056811197936',r'822148019858',r'718998434579',
                      r'523524453420',r'524057227848'
                  ])
                  print('PAGE',json.dumps(rec,ensure_ascii=False))
              except Exception as exc:
                  rec['error']=repr(exc)
                  print('PAGE_ERROR',name,repr(exc))
              output['pages'].append(rec)

          # Fetch first-party JS bundles and inspect endpoint strings.
          for index,url in enumerate(script_urls[:120],1):
              if not any(host in url for host in ('hangyan.co','fxbaogao.com')):
                  continue
              rec={'url':url}
              try:
                  r=s.get(url,timeout=90,allow_redirects=True)
                  text=decode(r)
                  rec.update({'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'final':r.url})
                  rec['snippets']=snippets(text,[
                      r'native-pdf',r'cacheKey',r'cache_key',r'download',r'pdfUrl',r'pdf_url',
                      r'/reports/',r'/api/',r'report-image',r'docId',r'view\?id',r'oss'
                  ],max_total=120)
                  if rec['snippets']:
                      print('SCRIPT_HIT',json.dumps(rec,ensure_ascii=False))
                      output['scripts'].append(rec)
              except Exception as exc:
                  rec['error']=repr(exc)
                  output['scripts'].append(rec)

          with open('output/reader_probe.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          PY

      - name: Upload probe data
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-precision-reader-interface-probe
          path: output/reader_probe.json
          retention-days: 1
