name: Temporary Jina source probe for Aixin reports

on:
  push:
    branches:
      - tmp-jina-aixin-source-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch mirrored pages and extract assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, re
          from pathlib import Path
          import requests

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/plain,text/markdown,*/*'})
          targets={
            'vzkoo':'https://r.jina.ai/http://www.vzkoo.com/document/1126926038310001149384a3edee.html',
            'vzkoo_https':'https://r.jina.ai/https://www.vzkoo.com/document/1126926038310001149384a3edee.html',
            'book118':'https://r.jina.ai/http://max.book118.com/html/2026/0616/8121016032010102.shtm',
            'fx_bocom':'https://r.jina.ai/http://www.fxbaogao.com/detail/5480083',
          }
          results={}
          for key,u in targets.items():
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('FETCH',key,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text
              (out/f'{key}.txt').write_text(text,encoding='utf-8',errors='ignore')
              urls=re.findall(r'https?://[^\s\)\]\"\'<>]+',text)
              urls=list(dict.fromkeys(x.rstrip('.,;') for x in urls))
              assets=[x for x in urls if any(tok in x.lower() for tok in ['cdn','image','jpg','jpeg','png','webp','pdf','download','file','document','preview','book118','vzkoo'])]
              results[key]={'status':r.status_code,'bytes':len(r.content),'final_url':r.url,'assets':assets,'head':text[:10000]}
              print('ASSETS',key,len(assets),flush=True)
              for x in assets[:300]: print('ASSET',key,x[:1000],flush=True)
            except Exception as e:
              results[key]={'error':repr(e),'url':u}
              print('ERROR',key,repr(e),flush=True)
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: jina-aixin-source-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
