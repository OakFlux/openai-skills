name: Fetch alternate sources for Makeng report

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-alt-domain-source-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Fetch and inspect alternate domains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import io, json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pypdf import PdfReader

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          urls=[
            'https://www.51pdf.cn/report_xg_p7/',
            'https://www1.nxny.com/report/view_6451804.html',
            'https://www2.nxny.com/report/view_6451804.html',
            'https://www3.nxny.com/report/view_6451804.html',
            'https://www4.nxny.com/report/view_6451804.html',
            'https://nxny.com/report/view_6451804.html',
          ]
          target_detail=None; candidates=[]; scripts=[]
          for i,url in enumerate(urls):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nPAGE',i,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path('out',f'page_{i}.bin').write_bytes(r.content)
              try:text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
              except Exception:text=r.text
              Path('out',f'page_{i}.html').write_text(text,encoding='utf-8',errors='ignore')
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                full=urljoin(r.url,a['href'])
                if '马矿股份' in label or '新股精要' in label or '6451804' in full:
                  print('TARGET_LINK',json.dumps({'label':label,'url':full},ensure_ascii=False),flush=True)
                  if '51pdf.cn/report/view_' in full and '马矿股份' in label: target_detail=full
                if any(k in full.lower() for k in ('.pdf','download','down','file')):
                  candidates.append((r.url,full,label))
              for tag in soup.find_all(['script','iframe','embed','object','form','input','button']):
                attrs={k:tag.get(k) for k in ('src','href','data','action','onclick','value','name','id','class','type') if tag.get(k) is not None}
                label=' '.join(tag.get_text(' ',strip=True).split())
                for k in ('src','href','data','action'):
                  if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                raw=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if tag.name=='script' and attrs.get('src'): scripts.append(attrs['src'])
                if any(k in raw for k in ('download','downfile','pdf','file','会员','rnd=')):
                  print('TAG',tag.name,json.dumps(attrs,ensure_ascii=False),label,flush=True)
                  for k in ('src','href','data','action'):
                    if attrs.get(k): candidates.append((r.url,attrs[k],label))
              raw=text.replace('\\/','/')
              for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',raw,re.I):
                val=m.group(0).rstrip('),;]}')
                if val.startswith('//'): val='https:'+val
                full=urljoin(r.url,val)
                if any(k in full.lower() for k in ('.pdf','download','downfile','download.aspx','rnd=','fileurl')):
                  print('RAW',full,flush=True); candidates.append((r.url,full,''))
            except Exception as e: print('PAGE_ERROR',url,repr(e),flush=True)

          if target_detail:
            try:
              r=s.get(target_detail,timeout=60,allow_redirects=True)
              print('\nTARGET_DETAIL',target_detail,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path('out','target_51pdf.html').write_bytes(r.content)
              text=r.text; soup=BeautifulSoup(text,'html.parser')
              print('TARGET_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for tag in soup.find_all(['a','script','iframe','embed','object','form','input','button']):
                attrs={k:tag.get(k) for k in ('src','href','data','action','onclick','value','name','id','class','type') if tag.get(k) is not None}
                label=' '.join(tag.get_text(' ',strip=True).split())
                for k in ('src','href','data','action'):
                  if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                raw=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if tag.name=='script' and attrs.get('src'): scripts.append(attrs['src'])
                if any(k in raw for k in ('download','downfile','pdf','file','会员','rnd=')):
                  print('TARGET_TAG',tag.name,json.dumps(attrs,ensure_ascii=False),label,flush=True)
                  for k in ('src','href','data','action'):
                    if attrs.get(k): candidates.append((r.url,attrs[k],label))
              for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',text.replace('\\/','/'),re.I):
                val=m.group(0).rstrip('),;]}')
                if val.startswith('//'):val='https:'+val
                full=urljoin(r.url,val)
                if any(k in full.lower() for k in ('.pdf','download','downfile','download.aspx','rnd=','fileurl')):
                  print('TARGET_RAW',full,flush=True); candidates.append((r.url,full,''))
            except Exception as e: print('TARGET_ERROR',repr(e),flush=True)

          for j,url in enumerate(dict.fromkeys(scripts)):
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              print('SCRIPT',j,url,r.status_code,len(r.content),r.url,flush=True)
              Path('out',f'script_{j}.js').write_bytes(r.content)
              text=r.text.replace('\\/','/')
              for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',text,re.I):
                val=m.group(0).rstrip('),;]}')
                if val.startswith('//'):val='https:'+val
                full=urljoin(r.url,val)
                if any(k in full.lower() for k in ('pdf','download','downfile','file','rnd=')):
                  print('SCRIPT_RAW',full,flush=True); candidates.append((url,full,''))
            except Exception as e:print('SCRIPT_ERROR',url,repr(e),flush=True)

          seen=set()
          for referer,url,label in candidates:
            if not url or url in seen or url.startswith(('javascript:','mailto:')):continue
            seen.add(url)
            try:
              r=s.get(url,headers={'Referer':referer},timeout=45,allow_redirects=True)
              print('TEST',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),repr(r.content[:50]),flush=True)
              if r.content.startswith(b'%PDF'):
                rd=PdfReader(io.BytesIO(r.content),strict=False)
                tx=''
                for n in range(min(3,len(rd.pages))):
                  try:tx+=rd.pages[n].extract_text() or ''
                  except Exception:pass
                print('PDF_OK',json.dumps({'url':url,'resolved':r.url,'pages':len(rd.pages),'bytes':len(r.content),'text':re.sub(r'\s+',' ',tx)[:500]},ensure_ascii=False),flush=True)
            except Exception as e:print('TEST_ERROR',url,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-601123-alt-domain-source-20261104
          path: out/
          if-no-files-found: error
          retention-days: 7
