name: Probe Shaanxi Jinye broker reports

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe report sources
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          print('--- EASTMONEY REPORT API ---')
          endpoints=[
            'https://reportapi.eastmoney.com/report/list?pageSize=100&pageNo=1&fields=&qType=0&orgCode=&code=000812&industryCode=*&industry=*&rating=&ratingChange=&beginTime=2000-01-01&endTime=2026-10-29&pageNum=1',
            'https://reportapi.eastmoney.com/report/list?cb=datatable123&pageSize=100&pageNo=1&fields=&qType=0&orgCode=&code=000812&industryCode=*&industry=*&rating=&ratingChange=&beginTime=2000-01-01&endTime=2026-10-29&pageNum=1',
            'https://reportapi.eastmoney.com/report/list?code=000812&qType=0&pageSize=100&pageNo=1',
          ]
          for u in endpoints:
            try:
              r=s.get(u,headers={'Referer':'https://data.eastmoney.com/report/000812.html'},timeout=(10,40),allow_redirects=True)
              print('\nAPI',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              print(r.text[:15000])
            except Exception as e: print('API ERROR',repr(e))

          print('\n--- EASTMONEY PAGE AND SCRIPTS ---')
          try:
            u='https://data.eastmoney.com/report/000812.html'
            r=s.get(u,timeout=(10,40)); print('PAGE',r.status_code,len(r.content),r.url)
            r.encoding=r.apparent_encoding or 'utf-8'; text=r.text
            print('REPORTAPI IN PAGE', 'reportapi' in text.lower())
            soup=BeautifulSoup(text,'html.parser')
            for script in soup.find_all('script',src=True):
              src=urljoin(r.url,script.get('src'))
              if any(x in src.lower() for x in ('report','stock','datacenter','main')):
                try:
                  rr=s.get(src,timeout=(10,40)); body=rr.text
                  if 'reportapi' in body.lower() or '/report/list' in body.lower():
                    print('SCRIPT_MATCH',src,'status',rr.status_code,'len',len(body))
                    for m in re.findall(r'https?://[^\s\"\']+report[^\s\"\']+',body,flags=re.I): print('URL',m[:500])
                    for line in body.splitlines():
                      if 'reportapi' in line.lower() or '/report/list' in line.lower(): print('LINE',line[:2000])
                except Exception as e: print('SCRIPT ERROR',src,repr(e))
          except Exception as e: print('PAGE ERROR',repr(e))

          print('\n--- HIBOR SEARCH ---')
          searches=[
            'https://www.hibor.com.cn/search?key=%E9%99%95%E8%A5%BF%E9%87%91%E5%8F%B6',
            'https://www.hibor.com.cn/search.aspx?key=%E9%99%95%E8%A5%BF%E9%87%91%E5%8F%B6',
            'https://www.hibor.com.cn/Search.aspx?key=%E9%99%95%E8%A5%BF%E9%87%91%E5%8F%B6',
          ]
          for u in searches:
            try:
              r=s.get(u,timeout=(10,40),allow_redirects=True); print('\nHIBOR',r.status_code,len(r.content),r.url)
              r.encoding=r.apparent_encoding or 'utf-8'; body=re.sub(r'\s+',' ',r.text)
              for pat in ['陕西金叶','烟标行业整合','春风吹渭水']:
                if pat in body: print('FOUND',pat)
              print(body[:3000])
            except Exception as e: print('HIBOR ERROR',repr(e))
          PY
