name: Package Jinlongyu broker reports 20261015

on:
  push:
    paths:
      - '.triggers/jinlongyu-002882-financial-reports-package-20261015.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          reports = [
              {'date':'2017-06-04','broker':'华鑫证券','title':'新股询价报告：金龙羽','classification':'新股询价公司研究报告','info_code':'AP201706040624478853','expected_pages':3},
              {'date':'2017-06-02','broker':'东莞证券','title':'新股网下申购询价建议报告（金龙羽）','classification':'新股网下申购询价研究报告','info_code':'AP201706020618757250','expected_pages':2},
          ]
          out=Path('jinlongyu_broker_package'); renders=Path('render_checks'); art=Path('artifact_out')
          for d in (out,renders,art): d.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*','Accept-Language':'zh-CN,zh;q=0.9'})

          def safe(x): return re.sub(r'[\\/:*?"<>|]+','_',x).strip(' ._')[:125]
          def fetch_pdf(rep,target):
              code=rep['info_code']; errors=[]
              urls=[f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}_01.pdf',f'https://pdf.dfcfw.com/pdf/H2_{code}_01.pdf']
              for url in urls:
                  for attempt in range(1,5):
                      try:
                          r=s.get(url,timeout=(20,180),allow_redirects=True)
                          print('DOWNLOAD',rep['title'],attempt,r.status_code,len(r.content),url,'FINAL',r.url,flush=True)
                          if r.status_code==200 and len(r.content)>50000 and r.content.startswith(b'%PDF-'):
                              target.write_bytes(r.content); return url
                          errors.append(f'{url}: HTTP {r.status_code}, {len(r.content)}')
                      except Exception as e: errors.append(f'{url}: {e!r}')
                      time.sleep(attempt)
              raise RuntimeError('Download failed: '+' | '.join(errors[-16:]))

          manifest=[]; hashes=set()
          for i,rep in enumerate(reports,1):
              filename=f'{i:02d}_{rep["date"]}_{rep["broker"]}_{safe(rep["title"])}.pdf'
              path=out/filename; source=fetch_pdf(rep,path)
              q=subprocess.run(['qpdf','--check',str(path)],capture_output=True,text=True)
              print('QPDF',filename,q.returncode,q.stdout[-800:],q.stderr[-800:],flush=True)
              if q.returncode not in (0,3): raise RuntimeError(q.stderr[-800:])
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              if pages<2 or abs(pages-rep['expected_pages'])>1: raise RuntimeError(f'Unexpected pages {pages} for {filename}')
              text=[]
              for p in reader.pages[:min(5,pages)]:
                  try: text.append(p.extract_text() or '')
                  except Exception: pass
              sample='\n'.join(text)
              if '金龙羽' not in sample and '002882' not in sample: raise RuntimeError('Company identity check failed')
              if not any(k in sample for k in ('询价','新股','申购','证券研究报告')): raise RuntimeError('Research identity check failed')
              prefix=renders/f'cover_{i:02d}'
              rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','100',str(path),str(prefix)],capture_output=True,text=True)
              png=Path(str(prefix)+'.png')
              if rr.returncode!=0 or not png.exists() or png.stat().st_size<8000: raise RuntimeError('Cover render failed')
              data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError('Duplicate PDF')
              hashes.add(sha)
              item={**rep,'filename':filename,'pages':pages,'bytes':len(data),'sha256':sha,'source_url':source}
              manifest.append(item); print('VERIFIED',json.dumps(item,ensure_ascii=False),flush=True)

          readme=[
              '金龙羽集团股份有限公司（金龙羽，002882.SZ）券商公司研究报告合集',
              '整理日期：2026-10-15','',
              '本压缩包收录2份公开渠道可直接下载、内容完整并完成结构核验的公司专项券商报告。',
              '两份均为上市前的新股询价/申购研究，属于公司专项研究，但篇幅较短，不应误称为长篇公司深度报告。',
              '公开匿名渠道未检索到可直接下载的金龙羽长篇首次覆盖或公司深度PDF，因此未用网页摘要、行业文章、预览页或拼接文件凑数。','',
              '文件清单：'
          ]
          for n,item in enumerate(manifest,1):
              readme += [f'{n}. {item["filename"]}',f'   券商：{item["broker"]}',f'   类型：{item["classification"]}',f'   标题：{item["title"]}',f'   日期：{item["date"]}；页数：{item["pages"]}；大小：{item["bytes"]} bytes',f'   公开PDF：{item["source_url"]}',f'   SHA-256：{item["sha256"]}','']
          readme.append('完整性检查：已检查PDF文件头、公司名称或证券代码、研究报告属性、实际页数、qpdf结构、首页渲染、重复文件及ZIP CRC。')
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')
          zp=art/'金龙羽_002882_券商公司研究报告_2份_公开完整版.zip'
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(out.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zp) as z:
              bad=z.testzip(); count=sum(1 for n in z.namelist() if n.lower().endswith('.pdf'))
              if bad or count!=2: raise RuntimeError(f'ZIP validation failed: {bad}, {count}')
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False),flush=True)
          print('FINAL_ZIP',zp.name,zp.stat().st_size,hashlib.sha256(zp.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: jinlongyu-002882-broker-reports
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
