name: Inspect FXBaogao public report viewer

on:
  push:
    branches:
      - tmp-yuexiu-fxbaogao-browser-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect viewer with Chrome
        run: |
          python -m pip install --quiet selenium requests beautifulsoup4
          mkdir -p output/downloads
          python - <<'PY'
          import json, time, traceback
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          ids=['4757676','4734664','3834744']
          out=Path('output'); dl=(out/'downloads').resolve()
          opts=webdriver.ChromeOptions()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1600,1400','--ignore-certificate-errors']:
              opts.add_argument(a)
          opts.add_experimental_option('prefs',{'download.default_directory':str(dl),'download.prompt_for_download':False,'download.directory_upgrade':True,'plugins.always_open_pdf_externally':True,'safebrowsing.enabled':True})
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          opts.page_load_strategy='eager'
          driver=webdriver.Chrome(options=opts)
          driver.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':str(dl)})
          summary={}
          try:
              for rid in ids:
                  print('\n===== RID',rid,'=====')
                  info={'rid':rid}
                  detail=f'https://www.fxbaogao.com/detail/{rid}'
                  driver.get(detail); time.sleep(6)
                  info['detail_url']=driver.current_url; info['detail_title']=driver.title
                  print('DETAIL',driver.current_url,driver.title)
                  anchors=driver.execute_script("return Array.from(document.querySelectorAll('a')).map(a=>({text:(a.innerText||'').trim(),href:a.href})).filter(x=>x.href)")
                  rel=[x for x in anchors if any(k in (x['href']+' '+x['text']).lower() for k in ['view','pdf','download','完整报告','查看报告'])]
                  print('ANCHORS',json.dumps(rel[:100],ensure_ascii=False))
                  (out/f'{rid}_detail.html').write_text(driver.page_source,encoding='utf-8')
                  driver.save_screenshot(str(out/f'{rid}_detail.png'))

                  candidates=[f'https://www.fxbaogao.com/view?id={rid}',f'https://www.fxbaogao.com/pdf?id={rid}']
                  views=[]
                  for ci,u in enumerate(candidates):
                      try:
                          driver.get(u); time.sleep(15)
                          cur=driver.current_url
                          title=driver.title
                          print('VIEW',ci,cur,title)
                          src=driver.page_source
                          (out/f'{rid}_view_{ci}.html').write_text(src,encoding='utf-8')
                          driver.save_screenshot(str(out/f'{rid}_view_{ci}.png'))
                          resources=driver.execute_script("return performance.getEntriesByType('resource').map(e=>e.name)")
                          interesting=[x for x in resources if any(k in x.lower() for k in ['pdf','report-image','download','file','oss','blob','view','page','api'])]
                          print('RESOURCES',json.dumps(interesting[:500],ensure_ascii=False))
                          dom=driver.execute_script("return Array.from(document.querySelectorAll('iframe,img,embed,object,a,button')).map(e=>({tag:e.tagName,src:e.src||'',href:e.href||'',data:e.data||'',text:(e.innerText||e.alt||'').trim()})).filter(x=>x.src||x.href||x.data||x.text)")
                          domrel=[x for x in dom if any(k in json.dumps(x,ensure_ascii=False).lower() for k in ['pdf','report','download','完整','查看','file','blob'])]
                          print('DOM',json.dumps(domrel[:300],ensure_ascii=False))
                          views.append({'requested':u,'current':cur,'title':title,'resources':interesting,'dom':domrel})
                          # Click public viewer/download buttons only; do not interact with login/payment controls.
                          for selector in ['a[href*="download"]','button[class*="download"]','[class*="download"]','a[href*="pdf"]']:
                              try:
                                  elems=driver.find_elements(By.CSS_SELECTOR,selector)
                                  for el in elems[:5]:
                                      text=(el.text or '').strip()
                                      href=el.get_attribute('href')
                                      if '登录' in text or '会员' in text or '充值' in text: continue
                                      print('CLICK_CAND',selector,text,href)
                                      driver.execute_script('arguments[0].click()',el); time.sleep(3)
                              except Exception as e:
                                  pass
                      except Exception as e:
                          print('VIEW_ERR',u,repr(e)); traceback.print_exc()
                  time.sleep(5)
                  files=[(p.name,p.stat().st_size) for p in dl.glob('*')]
                  print('FILES',files)
                  logs=[]
                  for entry in driver.get_log('performance'):
                      try:
                          msg=json.loads(entry['message'])['message']
                          if msg['method'] not in ['Network.requestWillBeSent','Network.responseReceived']: continue
                          obj=msg['params'].get('request') or msg['params'].get('response') or {}
                          url=obj.get('url','')
                          if url and any(k in url.lower() for k in ['pdf','report-image','download','file','oss','blob','api','view']):
                              row={'method':msg['method'],'status':obj.get('status'),'mime':obj.get('mimeType'),'url':url}
                              if row not in logs: logs.append(row)
                      except Exception: pass
                  print('NET',json.dumps(logs[:1000],ensure_ascii=False))
                  info['views']=views; info['network']=logs; info['files']=files
                  summary[rid]=info
              (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
              print('BROWSER_LOG',driver.get_log('browser'))
          finally:
              driver.quit()
          PY
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuexiu-fxbaogao-viewer-inspection
          path: output
          retention-days: 1
