name: Inspect Sohu Jinyao report archive source 20260929

on:
  push:
    paths:
      - '.github/workflows/jinyao-600488-sohu-source-discovery-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch and inspect Sohu report page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, re
          from html import unescape
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://q.stock.sohu.com/'})
          urls=[
            'https://q.stock.sohu.com/jlp/res/listresv2.up?query.secCode=600488',
            'https://q.stock.sohu.com/jlp/res/listresv2.up?query.secCode=600488&pageNum=2',
          ]
          for url in urls:
            r=s.get(url,timeout=30)
            print('URL',url,'STATUS',r.status_code,'BYTES',len(r.content),'ENC',r.apparent_encoding,flush=True)
            text=r.content.decode(r.apparent_encoding or 'gb18030',errors='replace')
            for needle in ['2018-01-16','2015-03-24','2014-11-04','2014-11-03','2014-10-20']:
              pos=text.find(needle)
              if pos>=0:
                print('\nSNIPPET',needle,unescape(text[max(0,pos-2500):pos+2500]),flush=True)
            for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
              href=urljoin(r.url,unescape(m.group(1)))
              title=unescape(re.sub(r'<[^>]+>','',m.group(2)))
              title=re.sub(r'\s+',' ',title).strip()
              if '600488' in href or any(x in title for x in ['天药股份','津药药业']):
                print('LINK',title,href,flush=True)
          PY
