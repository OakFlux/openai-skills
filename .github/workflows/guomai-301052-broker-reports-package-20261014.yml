name: Package Guomai Culture broker reports 20261014

on:
  push:
    paths:
      - '.triggers/guomai-301052-broker-reports-package-20261014.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          reports = [
              {
                  'date': '2023-11-28',
                  'broker': '信达证券',
                  'title': '首次覆盖报告：“出版+互联网”模式跑通，AI校对有望打开多领域成长空间',
                  'classification': '首次覆盖深度报告',
                  'info_code': 'AP202311281612497780',
              },
              {
                  'date': '2023-09-14',
                  'broker': '信达证券',
                  'title': '商业模式得到验证，同安徽新华发行开展渠道、AI产品深度合作',
                  'classification': '公司跟踪研究报告',
                  'info_code': 'AP202309141598477348',
              },
              {
                  'date': '2023-04-03',
                  'broker': '华鑫证券',
                  'title': '公司事件点评报告：迎新技术，图书企业如何赋能主业？',
                  'classification': '公司专题研究报告',
                  'info_code': 'AP202304011585019473',
              },
          ]

          work = Path('guomai_broker_package')
          work.mkdir(exist_ok=True)
          artifact = Path('artifact_out')
          artifact.mkdir(exist_ok=True)
          render_dir = Path('render_check')
          render_dir.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept': 'application/pdf,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:125]

          def download_report(report: dict, target: Path) -> str:
              code = report['info_code']
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_01.pdf',
              ]
              errors = []
              for url in candidates:
                  for attempt in range(1, 5):
                      try:
                          response = session.get(url, timeout=(20, 180), allow_redirects=True)
                          print('DOWNLOAD', report['title'], attempt, response.status_code, len(response.content), url, 'FINAL', response.url, flush=True)
                          if response.status_code == 200 and len(response.content) > 100_000 and response.content.startswith(b'%PDF-'):
                              target.write_bytes(response.content)
                              return url
                          errors.append(f'{url}: HTTP {response.status_code}, {len(response.content)} bytes')
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(attempt)
              raise RuntimeError('Download failed: ' + ' | '.join(errors[-16:]))

          manifest = []
          seen_hashes = set()
          for index, report in enumerate(reports, 1):
              filename = f'{index:02d}_{report["date"]}_{report["broker"]}_{safe(report["title"])}.pdf'
              path = work / filename
              source_url = download_report(report, path)

              qpdf = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              print('QPDF', filename, qpdf.returncode, qpdf.stdout[-800:], qpdf.stderr[-800:], flush=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {filename}: {qpdf.stderr[-800:]}')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 4:
                  raise RuntimeError(f'Unexpected page count for {filename}: {pages}')
              parts = []
              for page in reader.pages[:min(8, pages)]:
                  try:
                      parts.append(page.extract_text() or '')
                  except Exception:
                      pass
              sample = '\n'.join(parts)
              if '果麦文化' not in sample and '301052' not in sample:
                  raise RuntimeError(f'Company validation failed for {filename}')
              if not any(term in sample for term in ['证券研究报告', '公司研究', '研究报告', '投资评级']):
                  raise RuntimeError(f'Research-report validation failed for {filename}')

              render_prefix = render_dir / f'page_{index:02d}'
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(path), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              rendered = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not rendered.exists() or rendered.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page render failed for {filename}: {render.stderr[-800:]}')

              data = path.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in seen_hashes:
                  raise RuntimeError(f'Duplicate report: {filename}')
              seen_hashes.add(sha256)
              item = {
                  **report,
                  'filename': filename,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'source_url': source_url,
              }
              manifest.append(item)
              print('VERIFIED', json.dumps(item, ensure_ascii=False), flush=True)

          readme = [
              '果麦文化（301052.SZ）券商深度及公司研究报告精选',
              '整理日期：2026-10-14',
              '',
              '本压缩包收录3份公开、完整且可直接核验的券商公司研究PDF。',
              '其中第1份为25页首次覆盖深度报告；第2、3份为完整公司跟踪/专题研究，用于补充AI产品、渠道合作及新技术赋能等后续变化。',
              '公开渠道另可检索到浙商证券17页、长江证券24页及兴业证券27页的长篇报告，但完整原文需要登录、会员或动态授权，未使用网页摘要、预览页或拼接文件替代。',
              '',
              '文件清单：',
          ]
          for number, item in enumerate(manifest, 1):
              readme.extend([
                  f'{number}. {item["filename"]}',
                  f'   券商：{item["broker"]}',
                  f'   类型：{item["classification"]}',
                  f'   标题：{item["title"]}',
                  f'   日期：{item["date"]}；页数：{item["pages"]}；大小：{item["bytes"]} bytes',
                  f'   公开PDF：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ])
          readme.append('完整性检查：已检查PDF文件头、公司名称/证券代码、研究报告属性、实际页数、qpdf结构、首页渲染、重复文件及ZIP CRC。')

          (work / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (work / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (work / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = artifact / '果麦文化_301052_券商深度及公司研究报告_3份.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(work.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdf_count = sum(1 for name in archive.namelist() if name.lower().endswith('.pdf'))
              if pdf_count != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count}')

          zip_hash = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, zip_hash, flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: guomai-301052-broker-reports
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
