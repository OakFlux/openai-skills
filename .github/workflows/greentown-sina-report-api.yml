name: Greentown Sina report API probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-final-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Sina report-detail JS and call metadata APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          import requests

          OUT = Path('sina-api')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Referer':'https://stock.finance.sina.com.cn/hkstock/news/03900.html',
          })

          js_urls = [
              'https://n.sinaimg.cn/finance/hk/report/stockReportDetail.js?ts=3.99',
              'http://n.sinaimg.cn/finance/hk/report/stockReportDetail.js?ts=3.99',
          ]
          js_text = ''
          for url in js_urls:
              try:
                  r = s.get(url, timeout=30)
                  print('JS', url, r.status_code, len(r.content), r.url)
                  if r.status_code == 200 and len(r.content) > len(js_text):
                      js_text = r.text
              except Exception as exc:
                  print('JS ERROR', url, repr(exc))
          (OUT/'stockReportDetail.js').write_text(js_text, encoding='utf-8', errors='replace')

          patterns = [
              r'https?://[^\s"\'<>]+',
              r'[/A-Za-z0-9_.-]*(?:api|report|detail|hk)[/A-Za-z0-9_.?=&-]*',
          ]
          matches = []
          for pattern in patterns:
              matches.extend(re.findall(pattern, js_text, flags=re.I))
          matches = sorted(set(x for x in matches if any(k in x.lower() for k in ['api','report','detail','finance.sina'])))
          print('MATCHES', json.dumps(matches, ensure_ascii=False, indent=2)[:100000])
          (OUT/'matches.json').write_text(json.dumps(matches, ensure_ascii=False, indent=2), encoding='utf-8')

          # Save keyword-centred snippets.
          snippets = []
          low = js_text.lower()
          for key in ['reportid','axios','ajax','json','api','pdf','download','detail']:
              pos = 0
              while True:
                  pos = low.find(key.lower(), pos)
                  if pos < 0: break
                  snippets.append(js_text[max(0,pos-1200):min(len(js_text),pos+3500)])
                  pos += len(key)
                  if len(snippets) >= 100: break
              if len(snippets) >= 100: break
          (OUT/'snippets.txt').write_text('\n\n---\n\n'.join(snippets), encoding='utf-8')
          print('SNIPPETS\n', '\n\n---\n\n'.join(snippets[:20])[:100000])

          report_ids = ['841236720416','841219615755','841229994401','841136512766','841135613114','841160638243']
          # Candidate APIs inferred from old/new Sina conventions; harmless public GET probes.
          templates = [
              'https://stock.finance.sina.com.cn/hkstock/api/jsonp.php/var%20data=/HK_StockService.getReportDetail?reportid={id}',
              'https://stock.finance.sina.com.cn/hkstock/api/jsonp.php/var%20data=/HK_StockService.getReport?reportid={id}',
              'https://stock.finance.sina.com.cn/hkstock/api/jsonp.php/var%20data=/HK_StockService.getReportById?reportid={id}',
              'https://stock.finance.sina.com.cn/hkstock/api/jsonp.php/var%20data=/HK_StockService.getResearchReport?reportid={id}',
              'https://quotes.sina.cn/hk/api/jsonp.php/var%20data=/HK_StockService.getReportDetail?reportid={id}',
              'https://stock.finance.sina.com.cn/hkstock/api/openapi.php/HK_StockService.getReportDetail?reportid={id}',
              'https://stock.finance.sina.com.cn/hkstock/view/hk_report_data.php?reportid={id}',
          ]
          probes = []
          for rid in report_ids:
              for template in templates:
                  url = template.format(id=rid)
                  try:
                      r = s.get(url, timeout=25, allow_redirects=True)
                      rec = {'reportid': rid, 'url': url, 'status': r.status_code, 'final': r.url,
                             'ctype': r.headers.get('content-type'), 'length': len(r.content),
                             'text': r.text[:20000]}
                      probes.append(rec)
                      if r.status_code == 200 and len(r.content) > 100:
                          print('\nPROBE', json.dumps(rec, ensure_ascii=False, indent=2)[:30000])
                  except Exception as exc:
                      probes.append({'reportid': rid, 'url': url, 'error': repr(exc)})
          (OUT/'probes.json').write_text(json.dumps(probes, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greentown-sina-report-api
          path: sina-api/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
