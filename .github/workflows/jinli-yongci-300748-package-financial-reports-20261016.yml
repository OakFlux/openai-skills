name: Package Jinli Yongci financial reports 20261016
on:
  push:
    paths:
      - '.github/workflows/jinli-yongci-300748-package-financial-reports-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: |
          python - <<'PY'
          import hashlib, json, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          root = Path('金力永磁_300748_2020-2025年报及最新季报_截至20261016')
          annual_dir = root / '01_年度报告'
          quarter_dir = root / '02_最新季度报告'
          preview_dir = root / '首页预览'
          for d in (annual_dir, quarter_dir, preview_dir):
              d.mkdir(parents=True, exist_ok=True)

          docs = [
              {
                  'kind':'annual','period':'2020','art_code':'AN202203301556065864',
                  'title':'金力永磁:2020年年度报告(更新后)',
                  'notice_date':'2022-03-31',
                  'filename':'2020_金力永磁_2020年年度报告_更新后.pdf',
                  'folder':annual_dir,
              },
              {
                  'kind':'annual','period':'2021','art_code':'AN202203301556065951',
                  'title':'金力永磁:2021年年度报告',
                  'notice_date':'2022-03-31',
                  'filename':'2021_金力永磁_2021年年度报告.pdf',
                  'folder':annual_dir,
              },
              {
                  'kind':'annual','period':'2022','art_code':'AN202303301584702882',
                  'title':'金力永磁:2022年年度报告',
                  'notice_date':'2023-03-31',
                  'filename':'2022_金力永磁_2022年年度报告.pdf',
                  'folder':annual_dir,
              },
              {
                  'kind':'annual','period':'2023','art_code':'AN202403281628449054',
                  'title':'金力永磁:2023年年度报告',
                  'notice_date':'2024-03-29',
                  'filename':'2023_金力永磁_2023年年度报告.pdf',
                  'folder':annual_dir,
              },
              {
                  'kind':'annual','period':'2024','art_code':'AN202503281648783653',
                  'title':'金力永磁:2024年年度报告',
                  'notice_date':'2025-03-29',
                  'filename':'2024_金力永磁_2024年年度报告.pdf',
                  'folder':annual_dir,
              },
              {
                  'kind':'annual','period':'2025','art_code':'AN202603251820745357',
                  'title':'金力永磁:2025年年度报告',
                  'notice_date':'2026-03-26',
                  'filename':'2025_金力永磁_2025年年度报告.pdf',
                  'folder':annual_dir,
              },
              {
                  'kind':'quarter','period':'2026Q1','art_code':'AN202604281821680946',
                  'title':'金力永磁:2026年一季度报告',
                  'notice_date':'2026-04-29',
                  'filename':'2026Q1_金力永磁_2026年一季度报告.pdf',
                  'folder':quarter_dir,
              },
          ]

          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/notices/stock/300748.html',
              'Accept':'application/pdf,text/html;q=0.9,*/*;q=0.8',
          })

          def sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()

          def download_pdf(item, target):
              code=item['art_code']
              candidates=[
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
              ]
              last=[]
              for url in candidates:
                  for attempt in range(1,4):
                      try:
                          r=s.get(url,timeout=90,allow_redirects=True)
                          data=r.content
                          last.append((url,r.status_code,len(data),repr(data[:20])))
                          if r.status_code==200 and data.startswith(b'%PDF') and len(data)>50000:
                              target.write_bytes(data)
                              return url
                      except Exception as exc:
                          last.append((url,'ERR',0,repr(exc)))
                      time.sleep(attempt)
              raise RuntimeError(f'Could not download valid PDF for {item}: {last}')

          manifest=[]
          for item in docs:
              target=item['folder']/item['filename']
              source_url=download_pdf(item,target)

              q=subprocess.run(['qpdf','--check',str(target)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace')
              if q.returncode not in (0,3):
                  raise RuntimeError(f'qpdf failed for {target}: {q.returncode}\n{q.stdout}')

              reader=PdfReader(str(target))
              pages=len(reader.pages)
              if pages < (20 if item['kind']=='annual' else 3):
                  raise RuntimeError(f'Unexpectedly short report {target}: {pages} pages')

              txt=target.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(8,pages)),str(target),str(txt)],check=True)
              text=txt.read_text(encoding='utf-8',errors='replace')
              txt.unlink(missing_ok=True)
              identity_hits=[x for x in ['金力永磁','江西金力永磁科技股份有限公司','300748'] if x in text]
              if not identity_hits:
                  raise RuntimeError(f'Company identity not found in first pages of {target}')
              if item['period'][:4] not in text:
                  raise RuntimeError(f'Report period {item["period"]} not found in first pages of {target}')

              preview_stem=preview_dir/target.stem
              subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(target),str(preview_stem)],check=True)
              png=preview_stem.with_suffix('.png')
              if not png.exists() or png.stat().st_size<10000:
                  raise RuntimeError(f'First-page render failed for {target}')

              entry={k:v for k,v in item.items() if k!='folder'}
              entry.update({
                  'source_page':f'https://data.eastmoney.com/notices/detail/300748/{item["art_code"]}.html',
                  'source_url':source_url,
                  'pages':pages,
                  'bytes':target.stat().st_size,
                  'sha256':sha256(target),
                  'identity_hits':identity_hits,
                  'qpdf_status':q.returncode,
                  'qpdf_output':q.stdout.strip()[:2000],
              })
              manifest.append(entry)
              print('VERIFIED',json.dumps(entry,ensure_ascii=False,sort_keys=True))

          annual_periods=[x['period'] for x in manifest if x['kind']=='annual']
          if annual_periods != ['2020','2021','2022','2023','2024','2025']:
              raise RuntimeError(f'Annual report coverage mismatch: {annual_periods}')
          if [x['period'] for x in manifest if x['kind']=='quarter'] != ['2026Q1']:
              raise RuntimeError('Latest quarterly report mismatch')

          readme=[
              '# 金力永磁（300748）2020-2025年年度报告及最新季度报告',
              '',
              '整理日期：2026-10-16',
              '',
              '## 收录范围',
              '',
              '- 2020-2025年完整年度报告，共6份。',
              '- 截至2026-10-16可取得的最新独立季度报告：2026年第一季度报告，共1份。',
              '- 2020年年度报告采用公司后续披露的“更新后”版本。',
              '- 未将年度报告摘要、半年度报告、业绩预告或提示性公告冒充完整年报或季度报告。',
              '',
              '## 文件清单',
              '',
          ]
          for i,x in enumerate(manifest,1):
              readme += [
                  f'{i}. {x["title"]}',
                  f'   - 文件：{x["filename"]}',
                  f'   - 公告日期：{x["notice_date"]}',
                  f'   - 页数：{x["pages"]}',
                  f'   - SHA-256：`{x["sha256"]}`',
                  f'   - 公告页：{x["source_page"]}',
                  '',
              ]
          readme += [
              '## 校验说明',
              '',
              '- 每份PDF均检查文件头、PDF结构、页数、公司身份、报告期及首页渲染。',
              '- 压缩包创建后执行CRC完整性测试。',
          ]
          (root/'README.md').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text('\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in manifest)+'\n',encoding='utf-8')

          cn_zip=Path('金力永磁_300748_2020-2025年报及最新季报_截至20261016.zip')
          en_zip=Path('jinli_yongci_300748_2020_2025_annual_latest_quarter_20261016.zip')
          for zpath in (cn_zip,en_zip):
              with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p,p.as_posix())
              with zipfile.ZipFile(zpath) as zf:
                  bad=zf.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')
                  pdf_names=[n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if len(pdf_names)!=7:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {len(pdf_names)}')
              print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',sha256(zpath))
          print('COUNTS',json.dumps({'annual':6,'quarter':1,'pdfs':7,'pages':sum(x['pages'] for x in manifest)},ensure_ascii=False))
          PY
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: jinli-yongci-300748-financial-reports-20261016
          path: |
            金力永磁_300748_2020-2025年报及最新季报_截至20261016.zip
            jinli_yongci_300748_2020_2025_annual_latest_quarter_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
