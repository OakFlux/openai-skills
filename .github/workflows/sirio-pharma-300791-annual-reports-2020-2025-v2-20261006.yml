name: Build Sirio Pharma 300791 annual reports package v2 20261006

on:
  push:
    paths:
      - '.github/workflows/sirio-pharma-300791-annual-reports-2020-2025-v2-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Run corrected packaging script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          src = Path('.github/workflows/sirio-pharma-300791-annual-reports-2020-2025-20261006.yml').read_text(encoding='utf-8')
          begin = "          python - <<'PY'\n"
          start = src.index(begin) + len(begin)
          end = src.index("\n          PY\n", start)
          script = textwrap.dedent(src[start:end])
          script = script.replace(
              "if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score += 20",
              "if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score += 100",
          )
          Path('/tmp/sirio_package.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/sirio_package.py
      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: sirio-pharma-300791-annual-reports-v2-final
          path: |
            仙乐健康_300791_2020-2025年报及最新季报.zip
            sirio_health_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
