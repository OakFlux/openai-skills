name: Temporary Aixin exact report query

on:
  push:
    branches:
      - tmp-aixin-exact-report-query-20260906

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact reports and endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          out = Path('output')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/report',
              'Content-Type':'application/json;charset=UTF-8',
              'Accept':'application/json, text/plain, */*',
              'Accept-Language':'zh-CN,zh;q=0.9',
          })
          base = 'https://api.sdyanbao.com'
          queries = [
              '踏智驾及边缘AI之浪，启高端芯片之航',
              '高端启新，智驱全球',
              'AI终端平台公司，智能汽车打开增量空间',
              '中报超预期，边缘AI、智能车驱动未来成长',
              '爱芯元智 0600',
          ]
          results = []
          for q in queries:
              body = {'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':1,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','keyword':q}
              r=s.post(base+'/api/file/search',json=body,timeout=90)
              print('SEARCH',q,r.status_code,len(r.content),r.text[:120],flush=True)
              r.raise_for_status()
              obj=r.json(); files=((obj.get('data') or {}).get('files') or [])
              for f in files:
                  title=str(f.get('name') or '')
                  org=(f.get('organization') or {}).get('name') if isinstance(f.get('organization'),dict) else None
                  stock=f.get('stock') or {}
                  joined=''.join([title,str(org or ''),str(stock.get('name') or ''),str(stock.get('code') or ''),str(f.get('content') or '')[:2000]])
                  if any(k in joined for k in ['踏智驾及边缘AI之浪','高端启新，智驱全球','AI终端平台公司','中报超预期，边缘AI','爱芯元智']):
                      rec={k:f.get(k) for k in ['id','name','page_count','size','time_text','create_time','original_id','page_url','share_url','file_size','status','online_url','qrcode','hash','data_source','data_source_uuid']}
                      rec['organization']=f.get('organization'); rec['type']=f.get('type'); rec['stock']=f.get('stock'); rec['query']=q
                      print('MATCH',json.dumps(rec,ensure_ascii=False),flush=True)
                      file_id=f.get('id')
                      detail=None
                      try:
                          dr=s.post(base+'/api/file/detail',json={'id':file_id},timeout=90)
                          detail={'status':dr.status_code,'text':dr.text[:20000]}
                          print('DETAIL',file_id,dr.status_code,len(dr.content),dr.text[:250],flush=True)
                      except Exception as e:
                          detail={'error':repr(e)}
                      downloads=[]
                      variants=[{'id':file_id},{'id':file_id,'device':1},{'file_id':file_id},{'fileId':file_id},{'id':file_id,'type':1}]
                      for payload in variants:
                          try:
                              rr=s.post(base+'/api/file/download',json=payload,timeout=90,allow_redirects=False)
                              row={'payload':payload,'status':rr.status_code,'headers':dict(rr.headers),'text':rr.text[:5000]}
                              print('DOWNLOAD',file_id,json.dumps(payload,ensure_ascii=False),rr.status_code,len(rr.content),rr.text[:250],flush=True)
                          except Exception as e:
                              row={'payload':payload,'error':repr(e)}
                          downloads.append(row)
                      rec['detail']=detail; rec['download_attempts']=downloads
                      results.append(rec)
          # dedupe by id
          dedup={str(x.get('id')):x for x in results}
          final=list(dedup.values())
          (out/'exact_results.json').write_text(json.dumps(final,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_COUNT',len(final),flush=True)
          PY
      - name: Upload exact query results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-exact-report-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
