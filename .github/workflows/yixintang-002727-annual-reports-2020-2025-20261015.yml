name: Build Yixintang 002727 annual reports package 20261015

on:
  push:
    paths:
      - '.github/workflows/yixintang-002727-annual-reports-2020-2025-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '002727'
          COMPANY = '一心堂'
          PACKAGE_DIR = Path('一心堂_002727_2020-2025年报及2026年最新定期报告')
          PACKAGE_DIR.mkdir(exist_ok=True)
          ZIP_NAME = '一心堂_002727_2020-2025年报及2026年一季报和半年报.zip'
          ASCII_ALIAS = 'Yixintang_002727_2020-2025_Annual_Reports_2026Q1_H1.zip'

          reports = [
              {
                  'order': 1,
                  'period': '2020年年度报告',
                  'filename': '01_一心堂_2020年年度报告.pdf',
                  'title_variants': ['2020年年度报告'],
                  'min_pages': 220,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2021/2021-3/2021-03-16/6948151.PDF',
                  ],
              },
              {
                  'order': 2,
                  'period': '2021年年度报告',
                  'filename': '02_一心堂_2021年年度报告.pdf',
                  'title_variants': ['2021年年度报告'],
                  'min_pages': 250,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2022-03-30/1212724946.PDF',
                  ],
              },
              {
                  'order': 3,
                  'period': '2022年年度报告',
                  'filename': '03_一心堂_2022年年度报告.pdf',
                  'title_variants': ['2022年年度报告'],
                  'min_pages': 210,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2023-04-21/1216487652.PDF',
                  ],
              },
              {
                  'order': 4,
                  'period': '2023年年度报告',
                  'filename': '04_一心堂_2023年年度报告.pdf',
                  'title_variants': ['2023年年度报告'],
                  'min_pages': 230,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2024-04-27/1219856991.PDF',
                  ],
              },
              {
                  'order': 5,
                  'period': '2024年年度报告',
                  'filename': '05_一心堂_2024年年度报告.pdf',
                  'title_variants': ['2024年年度报告'],
                  'min_pages': 230,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2025-04-28/1223303832.PDF',
                  ],
              },
              {
                  'order': 6,
                  'period': '2025年年度报告',
                  'filename': '06_一心堂_2025年年度报告.pdf',
                  'title_variants': ['2025年年度报告'],
                  'min_pages': 200,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-04-29/1225226967.pdf',
                  ],
              },
              {
                  'order': 7,
                  'period': '2026年第一季度报告（最新独立季报）',
                  'filename': '07_一心堂_2026年第一季度报告_最新季报.pdf',
                  'title_variants': ['2026年第一季度报告', '2026年一季度报告'],
                  'min_pages': 8,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-04-29/1225223365.PDF',
                  ],
              },
              {
                  'order': 8,
                  'period': '2026年半年度报告（最新定期报告）',
                  'filename': '08_一心堂_2026年半年度报告_最新定期报告.pdf',
                  'title_variants': ['2026年半年度报告', '2026年半年报'],
                  'min_pages': 160,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-08-27/1225509343.PDF',
                      'https://www.cnpharm.com/upload/resources/file/2026/08/27/194018.pdf',
                  ],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          def compact(value: str) -> str:
              return re.sub(r'\s+', '', value or '')

          def is_pdf(data: bytes) -> bool:
              return len(data) > 30_000 and data.lstrip().startswith(b'%PDF-') and b'%%EOF' in data[-16384:]

          announcement_rows: list[dict[str, Any]] | None = None

          def load_announcements() -> list[dict[str, Any]]:
              global announcement_rows
              if announcement_rows is not None:
                  return announcement_rows
              api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
              rows: list[dict[str, Any]] = []
              headers = {
                  'User-Agent': session.headers['User-Agent'],
                  'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
                  'Accept': 'application/json,text/plain,*/*',
              }
              for page in range(1, 41):
                  params = {
                      'sr': '-1', 'page_size': '100', 'page_index': str(page),
                      'ann_type': 'A', 'client_source': 'web', 'stock_list': STOCK_CODE,
                      'f_node': '0', 's_node': '0',
                  }
                  last_error: Any = None
                  payload = None
                  for attempt in range(6):
                      try:
                          response = session.get(api, params=params, headers=headers, timeout=(20, 120))
                          if response.status_code == 200:
                              payload = response.json()
                              break
                          last_error = f'HTTP {response.status_code}: {response.text[:200]}'
                      except Exception as exc:
                          last_error = repr(exc)
                      time.sleep(1 + attempt)
                  if payload is None:
                      raise RuntimeError(f'Eastmoney announcement API failed on page {page}: {last_error}')
                  page_rows = ((payload.get('data') or {}).get('list') or [])
                  if not page_rows:
                      break
                  rows.extend(page_rows)
              announcement_rows = rows
              return rows

          def eastmoney_fallback(spec: dict[str, Any]) -> tuple[bytes, str, str]:
              candidates: list[tuple[int, str, dict[str, Any]]] = []
              for row in load_announcements():
                  raw_title = str(row.get('title') or '')
                  title = compact(raw_title)
                  if not any(compact(v) in title for v in spec['title_variants']):
                      continue
                  if any(compact(x) in title for x in ['摘要', '英文版', '审计报告', '更正公告', '取消版']):
                      continue
                  score = 100
                  if '一心堂' in title: score += 20
                  if any(title.endswith(compact(v)) for v in spec['title_variants']): score += 20
                  if any(x in title for x in ['修订版', '更正后', '更新后']): score += 30
                  date = str(row.get('display_time') or '')
                  candidates.append((score, date, row))
              candidates.sort(key=lambda x: (x[0], x[1]), reverse=True)
              if not candidates:
                  raise RuntimeError(f'No Eastmoney fallback announcement found: {spec["period"]}')
              row = candidates[0][2]
              art = str(row.get('art_code') or row.get('artCode') or '')
              if not art:
                  raise RuntimeError(f'Missing art code: {spec["period"]}')
              detail = f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html'
              for prefix in ['H2', 'H3', 'H1', 'H4']:
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{art}_1.pdf'
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': detail,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          if response.status_code == 200 and is_pdf(response.content):
                              return response.content, url, str(row.get('title') or '')
                      except Exception:
                          pass
                      time.sleep(1 + attempt)
              raise RuntimeError(f'Eastmoney PDF mirror failed: {spec["period"]}, art={art}')

          def download_report(spec: dict[str, Any]) -> tuple[bytes, str, str]:
              last: Any = None
              for url in spec['urls']:
                  for attempt in range(6):
                      try:
                          response = session.get(url, timeout=(30, 420), allow_redirects=True)
                          last = {
                              'url': url,
                              'status': response.status_code,
                              'final_url': response.url,
                              'content_type': response.headers.get('content-type', ''),
                              'bytes': len(response.content),
                          }
                          if response.status_code == 200 and is_pdf(response.content):
                              return response.content, url, spec['period']
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              print('Direct sources failed; switching to Eastmoney fallback:', spec['period'], last, flush=True)
              return eastmoney_fallback(spec)

          manifest: list[dict[str, Any]] = []
          total_pages = 0

          for spec in reports:
              data, source_url, source_title = download_report(spec)
              destination = PACKAGE_DIR / spec['filename']
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages: {destination.name}: {pages} < {spec["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(15, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              normalized = compact(extracted)
              if '一心堂' not in normalized and STOCK_CODE not in normalized:
                  raise RuntimeError(f'Issuer identity check failed: {destination.name}')
              if not any(compact(v) in normalized for v in spec['title_variants']):
                  raise RuntimeError(f'Report-period check failed: {destination.name}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = Path('/tmp') / f'yxt_{spec["order"]:02d}'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '110', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page render validation failed: {destination.name}')

              sha256 = hashlib.sha256(data).hexdigest()
              total_pages += pages
              manifest.append({
                  'order': spec['order'],
                  'filename': spec['filename'],
                  'period': spec['period'],
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'source_url': source_url,
                  'source_title': source_title,
                  'validation': 'PDF header; EOF; issuer; report period; page count; qpdf; first-page render',
              })
              print(f'Validated {destination.name}: {pages} pages, {len(data)} bytes, {sha256}', flush=True)

          readme_lines = [
              '一心堂药业集团股份有限公司（002727.SZ）定期报告资料包',
              '整理与核验日期：2026-10-15',
              '',
              '收录范围：',
              '1. 2020—2025年完整年度报告，共6份；',
              '2. 2026年第一季度报告：截至整理日最新的独立季度报告；',
              '3. 2026年半年度报告：截至整理日最新的定期报告，作为最新阶段性财务资料一并收录。',
              '',
              f'文件总数：{len(manifest)}份PDF；合计页数：{total_pages}页。',
              '年度报告均为全文，未使用“年度报告摘要”替代。',
              '',
              '核验项目：PDF文件头和结束标记、公司名称/证券代码、报告期、最低页数、qpdf结构检查、首页渲染。',
              '',
              '文件清单：',
          ]
          for item in manifest:
              readme_lines.extend([
                  f"{item['order']}. {item['filename']}",
                  f"   报告期：{item['period']}；页数：{item['pages']}；大小：{item['bytes']} bytes",
                  f"   SHA-256：{item['sha256']}",
                  f"   来源：{item['source_url']}",
                  '',
              ])
          (PACKAGE_DIR / '00_文件说明与校验清单.txt').write_text('\n'.join(readme_lines), encoding='utf-8')
          (PACKAGE_DIR / '00_来源与校验清单.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          with (PACKAGE_DIR / '00_来源与校验清单.csv').open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest[0].keys()))
              writer.writeheader()
              writer.writerows(manifest)

          with zipfile.ZipFile(ZIP_NAME, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(PACKAGE_DIR.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(path))

          with zipfile.ZipFile(ZIP_NAME, 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC validation failed: {bad}')
              expected = len(manifest) + 3
              if len(archive.infolist()) != expected:
                  raise RuntimeError(f'ZIP entry count mismatch: {len(archive.infolist())} != {expected}')

          shutil.copyfile(ZIP_NAME, ASCII_ALIAS)
          zip_sha = hashlib.sha256(Path(ZIP_NAME).read_bytes()).hexdigest()
          print('FINAL_ZIP', ZIP_NAME, Path(ZIP_NAME).stat().st_size, 'SHA256', zip_sha, flush=True)
          print('TOTAL_PDF_PAGES', total_pages, flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yixintang-002727-reports-20261015
          path: |
            一心堂_002727_2020-2025年报及2026年一季报和半年报.zip
            Yixintang_002727_2020-2025_Annual_Reports_2026Q1_H1.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
