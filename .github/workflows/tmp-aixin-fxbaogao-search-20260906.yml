name: Temporary Aixin Fxbaogao search

on:
  push:
    branches:
      - tmp-aixin-fxbaogao-search-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search and inspect
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 pillow
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          import io

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          search_urls=[]
          for kw in ['爱芯元智','00600','0600.HK']:
            enc=quote(kw)
            for nop in [-1,1,2,3,4,5]:
              search_urls.append(f'https://www.fxbaogao.com/rp?keywords={enc}&order=2&nop={nop}')
          reports={}
          search_meta=[]
          for u in search_urls:
            try:
              r=s.get(u,timeout=90,allow_redirects=True)
              print('SEARCH',r.status_code,len(r.content),r.url,flush=True)
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              found=[]
              for a in soup.select('a[href*="/detail/"]'):
                href=urljoin(r.url,a.get('href'))
                title=a.get_text(' ',strip=True)
                parent=a.parent.get_text(' ',strip=True) if a.parent else title
                if '爱芯元智' in (title+parent) or any(x in (title+parent) for x in ['踏智驾及边缘AI之浪','高端启新，智驱全球','AI终端平台公司，智能汽车打开增量空间','中报超预期，边缘AI、智能车驱动未来成长']):
                  m=re.search(r'/detail/(\d+)',href)
                  if m:
                    reports[m.group(1)]={'id':m.group(1),'href':href,'search_text':parent[:1000]}
                    found.append({'id':m.group(1),'href':href,'text':parent[:500]})
              search_meta.append({'url':u,'status':r.status_code,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'found':found})
            except Exception as e:
              search_meta.append({'url':u,'error':repr(e)})
          # Seed known public report pages.
          for rid in ['5472548','5605896','5252285','5248517','5248522','5597388']:
            reports.setdefault(rid,{'id':rid,'href':f'https://www.fxbaogao.com/detail/{rid}','search_text':'seed'})
          results=[]
          for rid,base in reports.items():
            row=dict(base)
            try:
              r=s.get(base['href'],timeout=90,allow_redirects=True)
              row.update({'status':r.status_code,'bytes':len(r.content),'final_url':r.url})
              soup=BeautifulSoup(r.text,'html.parser')
              row['page_title']=soup.title.get_text(' ',strip=True) if soup.title else None
              h1=soup.find(['h1','h2'])
              row['heading']=h1.get_text(' ',strip=True) if h1 else None
              text=soup.get_text(' ',strip=True)
              row['contains_aixin']='爱芯元智' in text
              # Extract first public report page image and infer pattern.
              image_urls=[]
              for img in soup.find_all('img'):
                src=img.get('src') or img.get('data-src')
                if src and 'report-image/' in src:
                  image_urls.append(urljoin(r.url,src))
              row['image_urls']=image_urls
              if image_urls:
                first=image_urls[0].split('?')[0]
                m=re.match(r'(.*/)(\d+)-(\d+)\.(png|jpg|jpeg|webp)$',first,re.I)
                if m:
                  prefix=m.group(1); file_id=m.group(2); ext=m.group(4)
                  pages=[]
                  misses=0
                  for page_no in range(1,101):
                    candidate=f'{prefix}{file_id}-{page_no}.{ext}'
                    try:
                      rr=s.get(candidate,timeout=45,allow_redirects=True)
                      data=rr.content
                      ok=rr.status_code==200 and len(data)>15000
                      dims=None
                      if ok:
                        try:
                          im=Image.open(io.BytesIO(data)); im.load(); dims=[im.width,im.height]
                          ok=im.width>500 and im.height>700
                        except Exception:
                          ok=False
                      pages.append({'page':page_no,'url':candidate,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'ok':ok,'dims':dims})
                      print('PAGE',rid,page_no,rr.status_code,len(data),ok,dims,flush=True)
                      if ok:
                        misses=0
                      else:
                        misses+=1
                        if page_no>1 and misses>=2: break
                    except Exception as e:
                      pages.append({'page':page_no,'url':candidate,'error':repr(e),'ok':False})
                      misses+=1
                      if page_no>1 and misses>=2: break
                    time.sleep(0.05)
                  row['public_pages']=pages
                  row['public_page_count']=sum(1 for x in pages if x.get('ok'))
            except Exception as e:
              row['error']=repr(e)
            results.append(row)
            print('REPORT',json.dumps({k:row.get(k) for k in ['id','page_title','heading','contains_aixin','image_urls','public_page_count','error']},ensure_ascii=False),flush=True)
          (out/'search_meta.json').write_text(json.dumps(search_meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'reports.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('REPORT_COUNT',len(results),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-fxbaogao-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
