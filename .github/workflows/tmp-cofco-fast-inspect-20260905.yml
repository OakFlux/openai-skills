name: Temporary COFCO Joycome report page inspection

on:
  push:
    branches:
      - tmp-cofco-joycome-fast-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect report pages and APIs
        run: |
          python -m pip install requests beautifulsoup4 lxml
          cat > /tmp/inspect.py <<'PY'
          import base64, html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          out=Path('inspect'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=['https://www.sgpjbg.com/baogao/112694.html','https://www.sgpjbg.com/baogao/76453.html','https://www.sgpjbg.com/labels/zhongliangjiajiakangshehuizerenbaogao.html','https://www.hangyan.co/reports/3016669493662320255','https://www.hangyan.co/reports/2529951243569203048','https://www.fxbaogao.com/detail/3202477']
          report=[]
          for idx,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=35,allow_redirects=True)
              print('\nURL',u,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'CT',r.headers.get('content-type'))
              (out/f'page_{idx}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'lxml')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              print('TITLE',title)
              entries=[]
              for tag in soup.find_all(True):
                attrs={}
                for a,v in tag.attrs.items():
                  if isinstance(v,list): v=' '.join(map(str,v))
                  if isinstance(v,str) and any(k in (a+' '+v).lower() for k in ['href','src','url','file','pdf','down','image','img','report']):
                    attrs[a]=v
                if attrs:
                  text=' '.join(tag.get_text(' ',strip=True).split())[:200]
                  blob=json.dumps(attrs,ensure_ascii=False)
                  if any(k in (blob+' '+text).lower() for k in ['.pdf','download','立即下载','down','viewer','page','image','img','112694','76453','中粮家佳康']):
                    entries.append({'tag':tag.name,'attrs':attrs,'text':text})
              report.append({'url':u,'status':r.status_code,'final':r.url,'title':title,'entries':entries[:1000]})
              for e in entries[:300]: print('ENTRY',json.dumps(e,ensure_ascii=False))
              # all absolute URL-like strings, including escaped JSON
              raw=r.text.replace('\\/','/')
              found=[]
              for m in re.findall(r'(?:https?:)?//[^\"\'<>\\\s]+',raw):
                if m.startswith('//'): m='https:'+m
                if any(k in m.lower() for k in ['pdf','download','down','upload','img','image','file','viewer','baogao']): found.append(html.unescape(m))
              for m in sorted(set(found))[:500]: print('RAWURL',m)
            except Exception as e:
              print('ERR',u,repr(e)); report.append({'url':u,'error':repr(e)})

          # Eastmoney exact-code probes; print only matching rows.
          endpoint='https://reportapi.eastmoney.com/report/list'
          matches=[]
          for code in ['01610','1610','HK01610']:
            for qtype in ['0','1']:
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2018-01-01','endTime':'2026-09-05','pageNo':'1','fields':'','qType':qtype,'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              try:
                r=s.get(endpoint,params=params,timeout=40); d=r.json(); rows=d.get('data') or []
                print('EASTMONEY',code,qtype,'ROWS',len(rows),'HITS',d.get('hits'),'TP',d.get('TotalPage'))
                for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if '中粮家佳康' in blob or 'COFCO' in blob.upper() or code!='01610':
                    print('EMROW',blob); matches.append(row)
              except Exception as e: print('EMERR',code,qtype,repr(e))
          (out/'inspection.json').write_text(json.dumps({'pages':report,'eastmoney':matches},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/inspect.py

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: cofco-joycome-page-inspection
          path: inspect
          retention-days: 1
