name: Probe Ascletis broker reports

on:
  push:
    branches:
      - chatgpt-ascletis-broker-reports-20260906
    paths:
      - '.github/workflows/probe-ascletis-reports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_ascletis_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: ascletis-report-probe-20260906
          path: |
            ascletis_probe_results.json
            ascletis_probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
