name: Build Huaheng Bio 688639 annual prospectus latest 20261004 v2

on:
  push:
    paths:
      - '.github/workflows/huahengbio-688639-annual-prospectus-latest-20261004-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Extract patch and run package script
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='.github/workflows/huahengbio-688639-annual-prospectus-latest-20261004.yml'
          sed -n "/python - <<'PY'/,/^          PY$/p" "$SOURCE" | sed '1d;$d;s/^          //' > /tmp/huahengbio_pkg.py
          python - <<'PATCH'
          from pathlib import Path
          path = Path('/tmp/huahengbio_pkg.py')
          text = path.read_text(encoding='utf-8')
          needle = "        # Additional IPO-keyword query.\n"
          insert = """        # Narrow IPO-date pulls are needed because final issue documents may sit outside the normal company-announcement index.\n        for date_range in ('2021-04-15~2021-04-17', '2021-03-30~2021-04-01'):\n            first = post_query(stock_value, '', '', date_range, 1, 100)\n            local.extend(first.get('announcements') or [])\n\n        # Additional IPO-keyword query.\n"""
          if needle not in text:
              raise SystemExit('Patch anchor not found')
          text = text.replace(needle, insert, 1)
          path.write_text(text, encoding='utf-8')
          PATCH
          python -m py_compile /tmp/huahengbio_pkg.py
          python /tmp/huahengbio_pkg.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: huahengbio-688639-annual-prospectus-latest-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: huahengbio-688639-verification-renders-v2
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
