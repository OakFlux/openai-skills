name: Inspect Reguanli Songzhi page only 20261004

on:
  push:
    paths:
      - '.github/workflows/songzhi-reguanli-pageonly-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect page source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --max-time 30 --retry 1 -A 'Mozilla/5.0' -o page.html 'https://www.reguanli.com/18386.html' || true
          wc -c page.html || true
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          p=Path('page.html')
          if not p.exists():
              print('NO_PAGE'); raise SystemExit
          b=p.read_bytes(); print('HEADBYTES',b[:100])
          for enc in ('utf-8','gb18030','latin1'):
              try: text=b.decode(enc); print('ENC',enc); break
              except: pass
          for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in ['.pdf','iframe','embed','download','documenturl','pdfjs','wp-content','file_name','file-url']):
                  print('LINE',line[:5000])
          for pat in [r'(?:src|href|data|data-src|data-url)=["\']([^"\']+)',r'https?://[^\s"\'<>]+']:
              vals=[]
              for m in re.findall(pat,text,re.I):
                  u=urljoin('https://www.reguanli.com/18386.html',m)
                  if u not in vals and any(k in u.lower() for k in ['pdf','upload','download','18386','wp-content']): vals.append(u)
              for u in vals: print('LINK',u)
          PY
