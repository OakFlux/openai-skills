name: Build verified Pandairy filing package

on:
  push:
    paths:
      - '.github/workflows/pandairy-300898-filings-final-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, shutil, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import fitz, requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          company='熊猫乳品'; full='熊猫乳品集团股份有限公司'; code='300898'
          cutoff='2026-11-04'; compact='20261104'
          root_name=f'{company}_{code}_上市以来全部年报_招股说明书及最新季报_截至{compact}'
          root=Path('work')/root_name; pdf_dir=root/'PDF文件'; preview=root/'首页与末页预览'; dist=Path('dist')
          for p in (pdf_dir,preview,dist): p.mkdir(parents=True,exist_ok=True)

          docs=[
            {'file':'01_首次公开发行股票并在创业板上市招股说明书.pdf','type':'招股说明书','year':2020,'date':'2020-10-13','min':250,'url':'https://static.cninfo.com.cn/finalpage/2020-10-13/1208539100.PDF'},
            {'file':'02_2020年年度报告.pdf','type':'年度报告','year':2020,'date':'2021-04-16','min':120,'url':'https://static.cninfo.com.cn/finalpage/2021-04-16/1209702341.PDF'},
            {'file':'03_2021年年度报告.pdf','type':'年度报告','year':2021,'date':'2022-04-18','min':120,'url':'https://static.cninfo.com.cn/finalpage/2022-04-18/1212940608.PDF'},
            {'file':'04_2022年年度报告.pdf','type':'年度报告','year':2022,'date':'2023-04-20','min':120,'url':'https://static.cninfo.com.cn/finalpage/2023-04-20/1216478038.PDF'},
            {'file':'05_2023年年度报告.pdf','type':'年度报告','year':2023,'date':'2024-04-25','min':120,'url':'https://static.cninfo.com.cn/finalpage/2024-04-25/1219793925.PDF'},
            {'file':'06_2024年年度报告.pdf','type':'年度报告','year':2024,'date':'2025-04-18','min':120,'url':'https://static.cninfo.com.cn/finalpage/2025-04-18/1223125165.PDF'},
            {'file':'07_2025年年度报告.pdf','type':'年度报告','year':2025,'date':'2026-04-17','min':120,'url':'https://static.cninfo.com.cn/finalpage/2026-04-17/1225112203.PDF'},
            {'file':'08_2026年第三季度报告.pdf','type':'最新季度报告','year':2026,'date':'2026-10-28','min':5,'url':'https://static.cninfo.com.cn/finalpage/2026-10-28/1225627870.PDF'},
          ]

          session=requests.Session()
          retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=.8,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          session.mount('https://',HTTPAdapter(max_retries=retry))
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.cninfo.com.cn/','Accept':'application/pdf,*/*;q=0.8'})

          def sha(path):
            h=hashlib.sha256()
            with path.open('rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
            return h.hexdigest()

          records=[]
          for item in docs:
            r=session.get(item['url'],timeout=300,allow_redirects=True)
            print('DOWNLOAD',item['file'],r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
            r.raise_for_status(); data=r.content
            if not data.startswith(b'%PDF') or len(data)<20000: raise RuntimeError(f"PDF内容异常: {item['file']}")
            path=pdf_dir/item['file']; path.write_bytes(data)
            reader=PdfReader(str(path),strict=False)
            if reader.is_encrypted: reader.decrypt('')
            pages=len(reader.pages)
            if pages<item['min']: raise RuntimeError(f"页数不足: {item['file']} pages={pages}")
            sample=''
            for idx in sorted(set([0,min(1,pages-1),min(2,pages-1),pages-1])):
              try: sample+=reader.pages[idx].extract_text() or ''
              except Exception: pass
            text=re.sub(r'\s+','',sample)
            if full not in text and company not in text and code not in text: raise RuntimeError(f"公司身份校验失败: {item['file']}")
            if item['type']=='年度报告' and f"{item['year']}年年度报告" not in text: raise RuntimeError(f"年份校验失败: {item['file']}")
            if item['type']=='招股说明书' and '招股说明书' not in text: raise RuntimeError('招股说明书校验失败')
            if item['type']=='最新季度报告' and '2026年三季度报告' not in text and '2026年第三季度报告' not in text: raise RuntimeError('季报校验失败')
            doc=fitz.open(path)
            if doc.page_count!=pages: raise RuntimeError(f"双解析器页数不一致: {item['file']}")
            first=doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
            last=doc.load_page(doc.page_count-1).get_pixmap(matrix=fitz.Matrix(1.0,1.0),alpha=False)
            if min(first.width,first.height,last.width,last.height)<400: raise RuntimeError(f"渲染异常: {item['file']}")
            first.save(preview/f"{path.stem}_首页.png"); last.save(preview/f"{path.stem}_末页.png"); doc.close()
            rec={**item,'resolved_url':r.url,'page_count':pages,'file_size_bytes':path.stat().st_size,'sha256':sha(path),'pdf_header_valid':True,'company_identity_validated':True,'report_identity_validated':True,'dual_parser_page_count_validated':True,'first_and_last_pages_rendered':True}
            records.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False),flush=True)

          if len(records)!=8 or sum(x['type']=='年度报告' for x in records)!=6: raise RuntimeError('文件构成异常')
          manifest={'company_short_name':company,'company_full_name':full,'stock_code':code,'listing_date':'2020-10-16','cutoff_date':cutoff,'scope':'上市以来2020-2025年完整年度报告、最终正式版招股说明书及2026年第三季度报告。','document_count':len(records),'total_pages':sum(x['page_count'] for x in records),'documents':records,'generated_at_utc':datetime.now(timezone.utc).isoformat()}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  PDF文件/{x['file']}\n" for x in records),encoding='utf-8')
          readme=[f'# {company}（{code}）全部年报、招股说明书及最新季报','',f'- 公司全称：{full}',f'- 截止日期：{cutoff}','- 上市日期：2020-10-16。','- 文件范围：2020-2025年完整年度报告、2020年最终正式版招股说明书、2026年第三季度报告。',f'- PDF数量：{len(records)}份；合计页数：{sum(x["page_count"] for x in records)}页。','- 来源：巨潮资讯网法定信息披露原始PDF。','- 校验：PDF文件头、公司与报告身份、最低页数、双解析器页数、首末页渲染、SHA-256和ZIP CRC。','','## 文件清单','']
          for i,x in enumerate(records,1): readme += [f'{i}. `{x["file"]}`',f'   - 类型：{x["type"]}；公告日期：{x["date"]}',f'   - 页数：{x["page_count"]}',f'   - 来源：{x["resolved_url"]}',f'   - SHA-256：`{x["sha256"]}`']
          (root/'README.md').write_text('\n'.join(readme)+'\n',encoding='utf-8')

          cn=dist/f'{root_name}.zip'; en=dist/f'pandairy_300898_all_annual_reports_prospectus_latest_quarter_{compact}.zip'
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,str(p.relative_to(root.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for zp in (cn,en):
            with zipfile.ZipFile(zp) as z:
              bad=z.testzip()
              if bad: raise RuntimeError(f'ZIP CRC校验失败: {bad}')
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=8: raise RuntimeError('ZIP内PDF数量异常')
            print('ZIP_VERIFIED',zp,zp.stat().st_size,sha(zp),flush=True)
          print('FINAL_SUMMARY',json.dumps({'chinese_zip':str(cn),'english_zip':str(en),'zip_size_bytes':cn.stat().st_size,'zip_sha256':sha(cn),'document_count':len(records),'total_pages':sum(x['page_count'] for x in records),'records':records},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pandairy-300898-filings-final-20261104
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
