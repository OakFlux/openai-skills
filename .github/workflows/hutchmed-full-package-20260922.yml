name: Build verified HUTCHMED filings package 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-full-package-20260922.yml'
      - '.github/scripts/hutchmed_package_20260922.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tooling
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests urllib3 pypdf weasyprint beautifulsoup4 lxml
          echo "Chrome candidates:"
          command -v google-chrome || true
          command -v chromium || true
          command -v chromium-browser || true

      - name: Patch legacy Wayback downloader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/hutchmed_package_20260922.py')
          text = path.read_text(encoding='utf-8')

          marker = '\n\ndef pdf_info(path: Path) -> tuple[int, str]:\n'
          helper = r'''


def fetch_wayback(url: str) -> bytes:
    """Download archived binaries while ignoring incorrect Content-Length headers."""
    temp_path = TEMP / ("wayback_" + hashlib.sha256(url.encode("utf-8")).hexdigest()[:20] + ".bin")
    cmd = [
        "curl",
        "--location",
        "--fail",
        "--silent",
        "--show-error",
        "--retry", "4",
        "--retry-all-errors",
        "--connect-timeout", "30",
        "--max-time", "300",
        "--http1.1",
        "--ignore-content-length",
        "--output", str(temp_path),
        url,
    ]
    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.returncode != 0:
        raise RuntimeError(f"curl failed ({proc.returncode}): {proc.stderr[-1200:]}")
    data = temp_path.read_bytes()
    if len(data) < 100:
        raise RuntimeError(f"archived response too small: {len(data)} bytes")
    return data
'''
          if 'def fetch_wayback(' not in text:
              if marker not in text:
                  raise SystemExit('Insertion marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = '''        for candidate in (current, archived):
            try:
                candidate_data = fetch(candidate)
'''
          new = '''        for candidate in (archived,):
            try:
                candidate_data = fetch_wayback(candidate)
'''
          if old not in text:
              raise SystemExit('Legacy loop marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Patched legacy Wayback download path')
          PY

      - name: Build and validate package
        shell: bash
        run: |
          python .github/scripts/hutchmed_package_20260922.py
          unzip -t HUTCHMED_All_Annual_Reports_Prospectuses_Latest_Periodic_Report_2026-09-22.zip
          sha256sum HUTCHMED_All_Annual_Reports_Prospectuses_Latest_Periodic_Report_2026-09-22.zip
          cat package_summary.json

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: HUTCHMED-complete-reports-package-20260922
          path: |
            HUTCHMED_All_Annual_Reports_Prospectuses_Latest_Periodic_Report_2026-09-22.zip
            package_summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
