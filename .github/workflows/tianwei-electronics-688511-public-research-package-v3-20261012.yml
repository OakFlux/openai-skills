name: Build Tianwei Electronics 688511 public research package v3 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-electronics-688511-public-research-package-v3-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf beautifulsoup4 lxml

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, subprocess, time, zipfile
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE='天微电子_688511_券商深度及相关军工行业研究_公开资料_3份'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREV=ROOT/'首页预览'; PREV.mkdir(exist_ok=True)
          SRC=ROOT/'来源记录'; SRC.mkdir(exist_ok=True)
          WORK=Path('_work_tianwei_v3'); WORK.mkdir(exist_ok=True)

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def get(url,referer=None,minimum=1,accept='*/*'):
            headers={'User-Agent':s.headers['User-Agent'],'Accept':accept}
            if referer: headers['Referer']=referer
            last=None
            for attempt in range(4):
              try:
                r=s.get(url,headers=headers,timeout=(15,45),allow_redirects=True)
                last=(r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                if r.status_code==200 and len(r.content)>=minimum: return r
              except Exception as e: last=repr(e)
              time.sleep(1+attempt)
            raise RuntimeError(f'fetch failed {url}: {last}')

          def as_jpeg(raw,path):
            with Image.open(BytesIO(raw)) as im:
              im.load(); rgba=im.convert('RGBA')
              bg=Image.new('RGBA',rgba.size,(255,255,255,255)); bg.alpha_composite(rgba)
              rgb=bg.convert('RGB'); rgb.save(path,'JPEG',quality=95,subsampling=0)
              return rgb.size

          def make_pdf(jpgs,dest):
            ims=[Image.open(p).convert('RGB') for p in jpgs]
            try: ims[0].save(dest,save_all=True,append_images=ims[1:],resolution=150.0,quality=95)
            finally:
              for im in ims: im.close()

          def validate(dest):
            pages=len(PdfReader(str(dest),strict=False).pages)
            if pages<1: raise RuntimeError('empty PDF: '+dest.name)
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('preview failed: '+dest.name)
            return {'pages':pages,'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'preview_file':str(Path('首页预览')/preview.name)}

          manifest=[]

          # Direct company report: only the publicly displayed cover is obtainable without registration.
          direct_page='https://www.baogaobox.com/reports/240622000020971.html'
          login_url='https://www.baogaobox.com/e/member/login/loginjs_report.php?id=20971'
          cover_url='https://zy.baogaobox.com/file/p/2024/06-24/imguh6a1626h5plhqkyt9xid00020971.webp'
          page=get(direct_page,'https://www.baogaobox.com/',10000,'text/html,*/*')
          page_text=page.content.decode(page.encoding or 'utf-8','replace')
          (SRC/'01_天风证券_来源页面.html').write_text(page_text,encoding='utf-8')
          login=get(login_url,direct_page,50,'text/javascript,text/html,*/*')
          login_text=login.content.decode(login.encoding or 'utf-8','replace')
          (SRC/'01_天风证券_访问状态说明.txt').write_text(login_text,encoding='utf-8')
          cover=get(cover_url,direct_page,20000,'image/avif,image/webp,image/png,image/jpeg,*/*;q=0.8')
          cover_jpg=WORK/'direct_cover.jpg'; width,height=as_jpeg(cover.content,cover_jpg)
          if width<500 or height<700: raise RuntimeError('small direct cover')
          direct_pdf=ROOT/'01_天风证券_天微电子_军用灭火防爆系统龙头_公开封面_原报告18页.pdf'
          make_pdf([cover_jpg],direct_pdf)
          manifest.append({
            'order':1,'broker':'天风证券','date':'2024-06-22','analysts':'王泽宇、杨英杰',
            'title':'天微电子（688511）：军用灭火防爆系统龙头，下游景气度传导助力业绩腾飞',
            'file':direct_pdf.name,'original_pages':18,'public_preview_pages':1,
            'document_nature':'直接公司深度报告的公开封面；非完整原始PDF',
            'source_page':direct_page,'access_status':login_text.strip(),**validate(direct_pdf)
          })

          def find_pattern(text,detail_id,base_url):
            soup=BeautifulSoup(text,'lxml'); vals=[]
            for tag in soup.find_all(True):
              for attr in ('src','data-src','data-original','data-url','href'):
                v=tag.get(attr)
                if isinstance(v,str) and v.strip(): vals.append(urljoin(base_url,v.strip()))
            vals.extend(re.findall(r'https?://[^\s"\'<>]+',text))
            for raw in vals:
              value=html.unescape(raw).replace('\\/','/').split('?')[0]
              for sep in ('-','_'):
                m=re.match(rf'(.+/){detail_id}{sep}1\.(png|jpg|jpeg|webp)$',value,re.I)
                if m: return m.group(1)+str(detail_id)+sep,m.group(2).lower()
            raise RuntimeError(f'preview image pattern missing for {detail_id}')

          def public_preview(detail_id,order,broker,date,title,filename,relation):
            detail=f'https://www.fxbaogao.com/detail/{detail_id}'
            r=get(detail,'https://www.fxbaogao.com/',10000,'text/html,*/*')
            text=r.content.decode(r.encoding or 'utf-8','replace')
            src_name=f'{order:02d}_fxbaogao_{detail_id}.html'; (SRC/src_name).write_text(text,encoding='utf-8')
            prefix,ext=find_pattern(text,detail_id,r.url)
            jpgs=[]; records=[]; seen=set(); work=WORK/f'fx_{detail_id}'; work.mkdir(exist_ok=True)
            # Public pages observed on this source are limited previews. Fetch at most the first two.
            for page_no in (1,2):
              url=f'{prefix}{page_no}.{ext}'
              try:
                rr=s.get(url,headers={'User-Agent':s.headers['User-Agent'],'Referer':detail,'Accept':'image/avif,image/webp,image/png,image/jpeg,*/*;q=0.8'},timeout=(12,25),allow_redirects=True)
                if rr.status_code!=200 or len(rr.content)<5000: break
                digest=hashlib.sha256(rr.content).hexdigest()
                if digest in seen: break
                seen.add(digest)
                jpg=work/f'{page_no:02d}.jpg'; w,h=as_jpeg(rr.content,jpg)
                if w<700 or h<850: jpg.unlink(missing_ok=True); break
                jpgs.append(jpg); records.append({'page':page_no,'url':url,'width':w,'height':h,'bytes':len(rr.content),'sha256':digest})
              except Exception: break
            if not jpgs: raise RuntimeError(f'no public preview pages for {detail_id}')
            dest=ROOT/filename; make_pdf(jpgs,dest)
            return {
              'order':order,'broker':broker,'date':date,'title':title,'file':dest.name,
              'document_nature':'相关军工行业专题研究的公开预览页；非完整原始PDF，非天微电子单独公司深度报告',
              'relation_to_tianwei':relation,'source_page':detail,'source_html_file':str(Path('来源记录')/src_name),
              'public_preview_pages':len(jpgs),'page_records':records,**validate(dest)
            }

          manifest.append(public_preview(
            3160614,2,'中泰证券','2022-05-05',
            '国防军工行业军工板块2021Q4与2022Q1业绩专题报告：板块持续高景气，军工确定性投资价值凸现',
            '02_中泰证券_军工板块2021Q4及2022Q1业绩专题_含天微电子_公开预览版.pdf',
            '报告的军工板块个股业绩及估值表中列有688511.SH天微电子。'
          ))
          manifest.append(public_preview(
            4623838,3,'中原证券','2024-12-11',
            '国防军工行业专题研究：否极泰来，圆满收官',
            '03_中原证券_国防军工行业专题研究_含天微电子_公开预览版.pdf',
            '报告的2024年军工上市公司行情回顾中明确列有688511.SH天微电子。'
          ))

          readme=[
            '天微电子（688511.SH）券商深度及相关军工行业研究公开资料包','整理日期：2026-10-12','',
            '公开检索仅找到1份直接针对天微电子的券商公司深度报告，即天风证券2024年报告。原报告共18页，公开入口只展示封面，访问状态信息显示其余17页需要注册账户后取得。本包未绕过任何登录、会员或下载权限。','',
            '另外收录2份明确包含天微电子数据或同业比较的军工行业专题报告。两份文件均为公开预览页，且不是天微电子单独公司深度报告。',''
          ]
          for x in manifest:
            readme += [f"{x['order']}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；文件性质：{x['document_nature']}",f"   本包文件：{x['file']}；PDF页数：{x['pages']}页",f"   来源页面：{x['source_page']}"]
            if x.get('relation_to_tianwei'): readme.append(f"   与天微电子的关系：{x['relation_to_tianwei']}")
            readme += [f"   SHA-256：{x['sha256']}",'']
          readme += ['包内附来源网页、首页预览、manifest.json和SHA256SUMS.txt。','核验项目：来源页面、图像尺寸、PDF页数、qpdf结构、首页渲染、ZIP CRC和SHA-256。','报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['file']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3: raise RuntimeError(f'zip validation failed: bad={bad}, pdfs={len(pdfs)}')
          Path('tianwei_research_reports.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-electronics-688511-public-research-package-v3-final
          path: |
            天微电子_688511_券商深度及相关军工行业研究_公开资料_3份.zip
            tianwei_research_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
