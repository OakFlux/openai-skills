name: Temporary Fast Validate Mengtai Jyanbao PDFs

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-mengtai-jyanbao-fast.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate candidates concurrently
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet httpx pypdf
          python - <<'PY'
          import asyncio, hashlib, io, json, re
          from pathlib import Path
          import httpx
          from pypdf import PdfReader

          urls=[
            'https://report-strapi-data.jyanbao.com/pdf/46da3fe5-31fd-42cb-aba5-c86a20bf16d6.pdf',
            'https://report-strapi-data.jyanbao.com/pdf/b07a9e74-85c0-41ac-b329-d7fcf1687c68.pdf',
            'https://report-strapi-data.jyanbao.com/newspdf/4bc0d72a-4372-4a6f-8ea6-b39f59075c55.pdf',
            'https://report-strapi-data.jyanbao.com/newspdf/2efb1834-3429-48e5-9b90-8498e8d22263.pdf',
            'https://report-strapi-data.jyanbao.com/newspdf/2edd6579-b72f-4cff-b70b-caad7635faec.pdf',
          ]
          out=Path('mengtai_jyanbao_fast');out.mkdir(exist_ok=True)
          saved=[]
          async def one(client,i,url):
            try:
              r=await client.get(url,follow_redirects=True,timeout=30)
              info={'i':i,'url':url,'final':str(r.url),'status':r.status_code,'type':r.headers.get('content-type'),'bytes':len(r.content),'head':r.content[:16].hex()}
              print('RESP='+json.dumps(info,ensure_ascii=False),flush=True)
              if r.status_code==200 and len(r.content)>20000 and r.content.lstrip().startswith(b'%PDF'):
                reader=PdfReader(io.BytesIO(r.content),strict=False);pages=len(reader.pages)
                texts=[]
                for p in sorted(set([0,min(1,pages-1),pages//2,pages-1])):
                  try:texts.append(reader.pages[p].extract_text() or '')
                  except:pass
                text='\n'.join(texts); compact=re.sub(r'\s+','',text)
                item={**info,'pages':pages,'identity':('蒙泰高新' in compact or '300876' in compact),'broker':next((b for b in ['东北证券','海通证券','海通国际'] if b in compact),''),'title_hints':[x for x in ['丙纶长丝行业领跑者','双基地强势进军碳纤维','丙纶景气触底','布局碳纤维打开新增量','国内丙纶长丝龙头','募投扩产助力成长','丙纶长丝业绩增长','发行可转债'] if x in compact],'sha256':hashlib.sha256(r.content).hexdigest(),'text_head':text[:800]}
                print('PDF='+json.dumps(item,ensure_ascii=False),flush=True)
                if item['identity']:
                  path=out/f'{i:02d}.pdf';path.write_bytes(r.content);item['path']=str(path);saved.append(item)
            except Exception as e:print('ERR='+json.dumps({'i':i,'url':url,'error':repr(e)},ensure_ascii=False),flush=True)
          async def main():
            async with httpx.AsyncClient(headers={'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://www.jyanbao.com/','Accept':'application/pdf,*/*'},limits=httpx.Limits(max_connections=10)) as client:
              await asyncio.gather(*(one(client,i,u) for i,u in enumerate(urls,1)))
            (out/'saved.json').write_text(json.dumps(saved,ensure_ascii=False,indent=2),encoding='utf-8')
            print('SAVED='+json.dumps(saved,ensure_ascii=False),flush=True)
            if not saved:raise RuntimeError('No valid Mengtai PDFs among Jyanbao candidates')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mengtai-jyanbao-valid-pdfs
          path: mengtai_jyanbao_fast
          retention-days: 3
          if-no-files-found: error
