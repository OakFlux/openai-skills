name: Temporary Build Melco Public Research Page PDF Bundle V3

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-build-melco-public-pages-bundle-v3.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Python dependencies
        run: python -m pip install --quiet selenium pypdf pymupdf pillow

      - name: Print, render-check and package public report records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import fitz
          from PIL import Image, ImageStat
          from pypdf import PdfReader
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          reports = [
              {'seq':1,'report_id':'1118968060607336448','broker':'华泰证券','date':'2025-05-09','title':'澳门总GGR恢复超行业，市场份额和EM增长','url':'https://reportify.cn/reports/1118968060607336448','original_pages_indexed':15},
              {'seq':2,'report_id':'1052271542572027904','broker':'东吴证券国际','date':'2024-11-08','title':'2024年三季报业绩点评：业绩符合预期，日均运营费用维持稳定','url':'https://reportify.cn/reports/1052271542572027904','original_pages_indexed':4},
              {'seq':3,'report_id':'962339654089314304','broker':'东吴证券国际','date':'2024-03-05','title':'2023年四季报点评：受到赢率偏低及减值费用的影响，业绩略低于预期','url':'https://reportify.cn/reports/962339654089314304','original_pages_indexed':4},
          ]

          root=Path('melco_public_bundle');pdf_dir=root/'公开页面PDF';preview_dir=root/'抽样预览'
          pdf_dir.mkdir(parents=True,exist_ok=True);preview_dir.mkdir(parents=True,exist_ok=True)

          chrome=next((x for x in ['/opt/google/chrome/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'] if Path(x).exists()),None)
          driver_path=next((x for x in ['/usr/local/share/chromedriver-linux64/chromedriver','/usr/local/bin/chromedriver','/usr/bin/chromedriver'] if Path(x).exists()),None)
          if not chrome:raise RuntimeError('No Chrome binary found')
          opts=Options();opts.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1200','--lang=zh-CN','--remote-debugging-pipe','--disable-notifications']:opts.add_argument(a)
          driver=webdriver.Chrome(service=Service(driver_path) if driver_path else Service(),options=opts)
          manifest=[]
          try:
            for report in reports:
              driver.get(report['url']);time.sleep(8)
              current_url=driver.current_url;page_title=driver.title or '';source=driver.page_source or ''
              if report['report_id'] not in current_url and report['report_id'] not in source:raise RuntimeError('Report ID not found after navigation: '+report['report_id'])
              for y in range(0,18000,700):driver.execute_script(f'window.scrollTo(0,{y});');time.sleep(.10)
              driver.execute_script('window.scrollTo(0,0)');time.sleep(1)
              metadata={'company':'新濠国际发展有限公司（00200.HK）','broker':report['broker'],'date':report['date'],'title':report['title'],'source':report['url'],'indexed_pages':report['original_pages_indexed'],'page_title':page_title}
              driver.execute_script('''
                const m=arguments[0], w=document.createElement('section');
                w.id='verified-report-metadata-cover';
                w.style.cssText='box-sizing:border-box;width:100%;min-height:760px;padding:72px 70px 45px;background:#fff;color:#111;font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;page-break-after:always;';
                const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                w.innerHTML='<div style="font-size:15px;color:#555;margin-bottom:60px">公开研究资料存档｜已核对报告记录</div>'+
                  '<div style="font-size:28px;font-weight:700;line-height:1.45;margin-bottom:32px">'+esc(m.title)+'</div>'+
                  '<div style="font-size:20px;line-height:2;border-top:1px solid #bbb;border-bottom:1px solid #bbb;padding:24px 0;margin-bottom:36px">'+
                  '<div><b>公司：</b>'+esc(m.company)+'</div><div><b>券商：</b>'+esc(m.broker)+'</div><div><b>报告日期：</b>'+esc(m.date)+'</div><div><b>公开索引标注原报告页数：</b>'+esc(m.indexed_pages)+' 页</div></div>'+
                  '<div style="font-size:14px;line-height:1.75;color:#333;background:#fff5d8;border:1px solid #c49a33;padding:18px 20px;margin-bottom:24px">本PDF由公开可访问的研究报告详情页打印生成，仅作资料索引与公开页面存档；不是券商原始版式PDF。原始全文受到版权、登录或账户权限限制时，本文件不绕过相关访问控制。</div>'+
                  '<div style="font-size:12px;line-height:1.8;color:#666;word-break:break-all"><b>公开来源页：</b>'+esc(m.source)+'<br/><b>网页标题：</b>'+esc(m.page_title||'未返回')+'</div>';
                document.body.insertBefore(w,document.body.firstChild);
                document.querySelectorAll('header,nav,[class*="cookie"],[class*="Cookie"],[class*="floating"],[class*="Floating"]').forEach(el=>{try{el.style.position='static'}catch(e){}});
              ''',metadata);time.sleep(1)
              pr=driver.execute_cdp_cmd('Page.printToPDF',{'landscape':False,'displayHeaderFooter':True,'printBackground':True,'paperWidth':8.27,'paperHeight':11.69,'marginTop':.45,'marginBottom':.55,'marginLeft':.35,'marginRight':.35,'headerTemplate':'<div style="font-size:8px;width:100%;text-align:center;color:#777">新濠国际发展（00200.HK）券商研究公开页面存档</div>','footerTemplate':'<div style="font-size:8px;width:100%;text-align:center;color:#777"><span class="pageNumber"></span> / <span class="totalPages"></span></div>'})
              raw=base64.b64decode(pr['data'])
              if not raw.startswith(b'%PDF') or len(raw)<40000:raise RuntimeError(f'Invalid PDF {report["report_id"]}, bytes={len(raw)}')
              safe=re.sub(r'[\\/:*?"<>|，。；：、（）()【】《》\s]+','_',report['title']).strip('_')[:80]
              filename=f"{report['seq']:02d}_{report['broker']}_新濠国际发展_{safe}_{report['date']}_公开页面版.pdf";path=pdf_dir/filename;path.write_bytes(raw)
              reader=PdfReader(str(path),strict=False);pages=len(reader.pages)
              if pages<2:raise RuntimeError(f'Insufficient PDF pages: {filename} pages={pages}')
              doc=fitz.open(path);pix=doc[0].get_pixmap(matrix=fitz.Matrix(1.0,1.0),alpha=False);png=pix.tobytes('png');doc.close()
              preview=preview_dir/f'{report["seq"]:02d}_首页.png';preview.write_bytes(png)
              im=Image.open(io.BytesIO(png)).convert('L').resize((220,300));stat=ImageStat.Stat(im);mean=stat.mean[0];std=stat.stddev[0]
              # White empty pages have a mean near 255 and very low standard deviation.
              if mean>252 and std<4:raise RuntimeError(f'Rendered cover appears blank: {filename}, mean={mean}, std={std}')
              manifest.append({**report,'web_page_title':page_title,'final_url':current_url,'file':str(path.relative_to(root)),'printed_pdf_pages':pages,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'cover_render_mean_gray':mean,'cover_render_stddev':std,'metadata_cover_render_verified':True,'copy_type':'公开研究报告详情页打印存档，非券商原始版式PDF'})
              print('VERIFIED='+json.dumps(manifest[-1],ensure_ascii=False),flush=True)
          finally:driver.quit()

          readme=['新濠国际发展（00200.HK）券商研究报告公开页面资料包','','本包为重新生成并通过ZIP、PDF页数和首页渲染校验后的可下载文件。','包内共3份PDF，每份首页标明公司、券商、日期、报告题目、公开索引页数和来源页面。','这些PDF是公开报告详情页的打印存档，不是券商原始版式PDF；未绕过登录、付费或版权访问限制。','','文件清单：']
          for x in manifest:readme += [f"{x['seq']}. {x['broker']}｜{x['date']}｜{x['title']}",f"   公开索引标注原报告页数：{x['original_pages_indexed']}页",f"   公开页面打印PDF页数：{x['printed_pdf_pages']}页",f"   文件：{x['file']}",f"   SHA-256：{x['sha256']}",f"   来源：{x['url']}"]
          (root/'README_说明与校验.txt').write_text('\n'.join(readme)+'\n',encoding='utf-8');(root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          zip_name='新濠国际发展_00200_HK_券商研究报告_3份_公开页面PDF_重新生成.zip'
          with zipfile.ZipFile(zip_name,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file():z.write(p,arcname=str(Path(root.name)/p.relative_to(root)))
          with zipfile.ZipFile(zip_name,'r') as z:
            bad=z.testzip();pdf_count=len([x for x in z.namelist() if x.lower().endswith('.pdf')]);preview_count=len([x for x in z.namelist() if x.lower().endswith('.png')])
            if bad:raise RuntimeError('ZIP CRC failure: '+bad)
            if pdf_count!=3 or preview_count!=3:raise RuntimeError(f'Unexpected ZIP contents pdf={pdf_count}, preview={preview_count}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}',flush=True)
          PY

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: melco-public-research-pages-bundle-v3
          path: 新濠国际发展_00200_HK_券商研究报告_3份_公开页面PDF_重新生成.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
