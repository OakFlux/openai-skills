name: Inspect Tudatong 02665 research report viewers 20260926

on:
  push:
    paths:
      - '.github/workflows/tudatong-02665-report-viewer-diagnostic-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Capture viewer network and page metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          TARGETS = [
              ('5371458','https://www.fxbaogao.com/view?id=5371458'),
              ('5511320','https://www.fxbaogao.com/view?id=5511320'),
              ('6483077','https://www3.nxny.com/report/view_6483077.html'),
          ]
          OUT = Path('out')

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  ctx = await browser.new_context(
                      viewport={'width': 1440, 'height': 1200},
                      locale='zh-CN',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
                  )
                  for rid, url in TARGETS:
                      page = await ctx.new_page()
                      network=[]; console=[]
                      async def on_response(resp):
                          req=resp.request
                          item={'status':resp.status,'url':resp.url,'type':req.resource_type,'content_type':resp.headers.get('content-type','')}
                          if req.resource_type in ('xhr','fetch'):
                              item['method']=req.method; item['post_data']=req.post_data
                              try:
                                  body=await resp.body()
                                  item['body_bytes']=len(body)
                                  ctype=item['content_type'].lower()
                                  if ('json' in ctype or 'text' in ctype or 'javascript' in ctype) and len(body)<2_000_000:
                                      item['body_text']=body.decode('utf-8','replace')[:1_000_000]
                              except Exception as e:
                                  item['body_error']=repr(e)
                          network.append(item)
                      page.on('response', on_response)
                      page.on('console', lambda m, console=console: console.append({'type':m.type,'text':m.text}))
                      rec={'id':rid,'input_url':url}
                      try:
                          resp=await page.goto(url,wait_until='domcontentloaded',timeout=120000)
                          rec['status']=resp.status if resp else None
                          await page.wait_for_timeout(15000)
                          rec['final_url']=page.url
                          rec['title']=await page.title()
                          rec['body_text']=(await page.locator('body').inner_text())[:200000]
                          rec['html']=(await page.content())[:1_000_000]
                          rec['frames']=[{'url':f.url,'name':f.name} for f in page.frames]
                          rec['images']=await page.locator('img').evaluate_all("els => els.map(e => ({src:e.currentSrc||e.src, alt:e.alt, w:e.naturalWidth, h:e.naturalHeight})).filter(x=>x.src)")
                          rec['embeds']=await page.locator('iframe,embed,object,canvas').evaluate_all("els => els.map(e => ({tag:e.tagName, src:e.src||e.data||'', type:e.type||'', w:e.width||e.clientWidth||0, h:e.height||e.clientHeight||0}))")
                          rec['links']=await page.locator('a').evaluate_all("els => els.map(e => ({href:e.href,text:(e.innerText||'').trim()})).filter(x=>x.href)")
                          await page.screenshot(path=str(OUT/f'{rid}.png'),full_page=True)
                          (OUT/f'{rid}.html').write_text(await page.content(),encoding='utf-8')
                      except Exception as e:
                          rec['error']=repr(e)
                          try: await page.screenshot(path=str(OUT/f'{rid}_error.png'),full_page=True)
                          except Exception: pass
                      rec['network']=network
                      rec['console']=console
                      (OUT/f'{rid}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
          grep -RInE 'pdf|pageCount|totalPage|preview|report-image|download|oss|cos|\.png|\.jpg|\.webp|登录|完整报告' out > out/grep_hits.txt || true
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > out/file_sizes.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tudatong-02665-report-viewer-diagnostic
          path: out
          retention-days: 7
          if-no-files-found: error
