name: chatgpt-temp-avic-sdy-query
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-avic-sdy-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public report-search API
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json
          from pathlib import Path
          import requests
          W=Path('avic_sdy_query');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Content-Type':'application/json','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report?keyword=%E4%B8%AD%E8%88%AA%E7%A7%91%E5%B7%A5'})
          queries=['中航科工','航空高质量引领平台','航空高科技旗舰平台','港股唯一航空高科技产业集团','业绩稳健增长 专业化整合加速']
          all_out={}
          for keyword in queries:
            body={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':50,'keyword':keyword,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
            r=s.post('https://api.sdyanbao.com/api/file/search',json=body,timeout=90)
            print('QUERY',keyword,'HTTP',r.status_code,'bytes',len(r.content),'type',r.headers.get('content-type'),flush=True)
            print('BODY',r.text[:50000],flush=True)
            try:o=r.json()
            except Exception:o={'raw':r.text}
            all_out[keyword]=o
          W.joinpath('results.json').write_text(json.dumps(all_out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AVIC-China-Sdyanbao-Search-Results
          path: avic_sdy_query/results.json
          retention-days: 1
          compression-level: 6
