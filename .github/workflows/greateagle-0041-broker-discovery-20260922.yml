name: Discover Great Eagle Holdings 0041 broker reports 20260922

on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-broker-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Search public web and report platforms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup

          out=Path('greateagle_discovery'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Cache-Control':'no-cache',
          })

          queries=[
            '鹰君集团 券商 研报 PDF',
            '鹰君集团 深度报告 0041',
            '鹰君 0041.HK 公司研究',
            '鹰君集团 目标价 证券 研究报告',
            'Great Eagle Holdings equity research report PDF',
            'Great Eagle Holdings 0041 target price broker report',
            'Great Eagle Holdings company update PDF analyst',
            'site:fxbaogao.com/detail 鹰君集团',
            'site:fxbaogao.com/detail 鹰君 0041',
            'site:baogaobox.com/reports 鹰君集团',
            'site:fhyanbao.com/rpview 鹰君集团',
            'site:pdf.dfcfw.com 鹰君集团',
            'site:dbs.com Great Eagle Holdings research PDF',
            'site:uobkayhian.com Great Eagle Holdings research PDF',
            'site:researchwise.dbsvresearch.com Great Eagle Holdings',
            'site:irasia.com Great Eagle analyst report',
          ]
          engines=[
            ('bing','https://www.bing.com/search?q={q}&count=50'),
            ('duck','https://html.duckduckgo.com/html/?q={q}'),
            ('baidu','https://www.baidu.com/s?wd={q}&rn=50'),
            ('sogou','https://www.sogou.com/web?query={q}&num=50'),
          ]
          all_rows=[]
          urlset=set()
          for qi,q in enumerate(queries,1):
            for engine,fmt in engines:
              url=fmt.format(q=quote_plus(q))
              rec={'query':q,'engine':engine,'url':url}
              try:
                r=s.get(url,timeout=(20,90),allow_redirects=True)
                rec.update(status=r.status_code,final=r.url,bytes=len(r.content),type=r.headers.get('content-type'))
                fn=out/f'{qi:02d}_{engine}.html'; fn.write_bytes(r.content)
                soup=BeautifulSoup(r.text,'lxml')
                rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                links=[]
                for a in soup.find_all('a',href=True):
                  href=html.unescape(a['href'])
                  text=' '.join(a.get_text(' ',strip=True).split())
                  # Unwrap common redirect parameters
                  cand=href
                  if href.startswith('//'): cand='https:'+href
                  elif href.startswith('/'):
                    cand=urljoin(r.url,href)
                  for key in ('uddg','url','target','u'):
                    try:
                      vals=parse_qs(urlparse(cand).query).get(key)
                      if vals and vals[0].startswith('http'): cand=vals[0]
                    except Exception: pass
                  if cand.startswith('http'):
                    links.append({'text':text[:300],'url':cand})
                    urlset.add(cand)
                rec['links']=links[:500]
                all_rows.append(rec)
                print('SEARCH',qi,engine,r.status_code,len(r.content),rec['title'][:120],'links',len(links),flush=True)
              except Exception as e:
                rec['error']=repr(e); all_rows.append(rec); print('ERR',qi,engine,repr(e),flush=True)
              time.sleep(.4)

          direct=[
            'https://www.fxbaogao.com/search?keyword='+quote_plus('鹰君集团'),
            'https://www.fxbaogao.com/search?keyword='+quote_plus('鹰君'),
            'https://www.fxbaogao.com/search?keyword='+quote_plus('Great Eagle'),
            'https://www.baogaobox.com/search?keyword='+quote_plus('鹰君集团'),
            'https://www.fhyanbao.com/search?keyword='+quote_plus('鹰君集团'),
            'https://www.fhyanbao.com/search?q='+quote_plus('鹰君集团'),
            'https://www.vzkoo.com/search?keyword='+quote_plus('鹰君集团'),
          ]
          direct_rows=[]
          for i,url in enumerate(direct,1):
            rec={'url':url}
            try:
              r=s.get(url,timeout=(20,100),allow_redirects=True)
              rec.update(status=r.status_code,final=r.url,bytes=len(r.content),type=r.headers.get('content-type'))
              (out/f'direct_{i:02d}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'lxml')
              rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              links=[]
              for a in soup.find_all('a',href=True):
                u=urljoin(r.url,html.unescape(a['href']))
                t=' '.join(a.get_text(' ',strip=True).split())
                links.append({'text':t[:400],'url':u}); urlset.add(u)
              rec['links']=links[:1000]
              # expose likely IDs and API routes
              rec['ids']=sorted(set(re.findall(r'(?:detail/|rpview/|report[s]?/|reportId["\':= ]+)(\d{5,})',r.text,re.I)))
              rec['api_strings']=sorted(set(re.findall(r'["\']([^"\']*(?:api|search|report|detail)[^"\']*)["\']',r.text,re.I)))[:1000]
              print('DIRECT',i,r.status_code,len(r.content),rec['title'][:150],'ids',rec['ids'][:20],flush=True)
            except Exception as e:
              rec['error']=repr(e); print('DIRECT_ERR',i,repr(e),flush=True)
            direct_rows.append(rec)

          # Keep only externally interesting URLs in a compact file.
          interesting=[]
          keys=('fxbaogao','baogaobox','fhyanbao','vzkoo','dfcfw','eastmoney','pdf','research','report','dbs','uob','cimb','daiwa','hsbc','cicc','citic','guotai','haitong','bocom','great eagle','greateagle')
          for u in sorted(urlset):
            low=u.lower()
            if any(k in low for k in keys): interesting.append(u)
          (out/'search_results.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'direct_results.json').write_text(json.dumps(direct_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'interesting_urls.txt').write_text('\n'.join(interesting),encoding='utf-8')
          print('INTERESTING_URLS',len(interesting),flush=True)
          PY

          grep -RInE "鹰君|Great Eagle|0041|fxbaogao.com/detail|baogaobox.com/reports|fhyanbao.com/rpview|https?[^[:space:]\"']+\.pdf" greateagle_discovery > greateagle_discovery/grep_hits.txt || true
          find greateagle_discovery -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > greateagle_discovery/file_sizes.txt

      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-broker-discovery
          path: greateagle_discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
