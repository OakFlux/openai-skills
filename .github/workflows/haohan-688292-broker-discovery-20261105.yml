name: Discover Haohan Data broker research PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/haohan-688292-broker-discovery-20261105.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, html, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9'})

          params=dict(
              industryCode='*',pageSize='100',industry='*',rating='*',ratingChange='*',
              beginTime='2022-01-01',endTime='2026-11-05',pageNo='1',fields='',qType='0',
              orgCode='',code='688292',rcode='',p='1',pageNum='1',pageNumber='1'
          )
          for base in ['https://reportapi.eastmoney.com/report/list','http://reportapi.eastmoney.com/report/list']:
              for cb in [None,'callback']:
                  p=params.copy()
                  if cb: p['cb']=cb
                  try:
                      r=s.get(base,params=p,headers={'Referer':'https://data.eastmoney.com/report/stock.jshtml?stockcode=688292'},timeout=60)
                      print('\n===REPORTAPI===',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                      print(r.text[:30000],flush=True)
                  except Exception as e:
                      print('REPORTAPI_ERROR',base,cb,repr(e),flush=True)

          pages=[
              'https://www.fxbaogao.com/detail/4029342',
              'https://www.fxbaogao.com/detail/5226558',
              'https://www.vzkoo.com/document/2025120344b964934bbf0fa107955dba.html?from=report',
              'https://www.vzkoo.com/read/20251205f34de42cfd7c5a19d977b051.html',
              'https://www.sgpjbg.com/bgdown/146856.html',
          ]
          for u in pages:
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                  t=html.unescape(r.text)
                  print('\n===PAGE===',u,r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.encoding,flush=True)
                  soup=BeautifulSoup(t,'html.parser')
                  found=[]
                  for tag in soup.find_all(True):
                      for a in ('href','src','data-src','data-url','content','onclick','value'):
                          v=tag.get(a)
                          if not v: continue
                          vv=str(v)
                          if any(k in vv.lower() for k in ('.pdf','download','file.','iyanbao','dfcfw','4029342','5226558','146856','2025120344')):
                              found.append({'tag':tag.name,'attr':a,'value':urljoin(r.url,vv),'text':tag.get_text(' ',strip=True)[:120]})
                  print('FOUND',json.dumps(found[:300],ensure_ascii=False,indent=2),flush=True)
                  regexes=[
                      r'https?://[^\s\"\'<>]+\.pdf(?:\?[^\s\"\'<>]*)?',
                      r'https?://[^\s\"\'<>]+(?:iyanbao|dfcfw|fxbaogao|vzkoo|sgpjbg)[^\s\"\'<>]*',
                      r'AP\d{18}',
                      r'[0-9a-f]{5,}-[0-9a-f-]{20,}\.pdf',
                  ]
                  for pat in regexes:
                      vals=sorted(set(re.findall(pat,t,re.I)))
                      if vals: print('REGEX',pat,json.dumps(vals[:300],ensure_ascii=False,indent=2),flush=True)
              except Exception as e:
                  print('PAGE_ERROR',u,repr(e),flush=True)
          PY
