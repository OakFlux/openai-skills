name: Probe Kaitian Gas historical report URLs 20261005

on:
  push:
    paths:
      - '.github/workflows/kaitian-gas-old-report-url-probe-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect old detail pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import re, html
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          ids = ['1721269','2281878','3297685','6029195','6028889','6028839']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for rid in ids:
              url=f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920010&id={rid}'
              r=s.get(url,timeout=60); print('\nRID',rid,'STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url,flush=True); r.raise_for_status()
              raw=r.content.decode('gb18030',errors='replace')
              soup=BeautifulSoup(raw,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              print('TEXT_HEAD',re.sub(r'\s+',' ',soup.get_text(' ',strip=True))[:1000],flush=True)
              for a in soup.find_all('a',href=True):
                  label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                  print('ANCHOR',repr(label),repr(urljoin(r.url,a['href'])),flush=True)
              decoded=html.unescape(raw)
              urls=sorted(set(re.findall(r'https?://[^\s\"\'<>]+',decoded,re.I)))
              for u in urls:
                  if any(k in u.lower() for k in ['pdf','download','disclosure','attachment','file.finance','neeq','bse']):
                      print('RAWURL',u[:1000],flush=True)
              for line in decoded.splitlines():
                  low=line.lower()
                  if any(k in low for k in ['pdf','下载公告','公告原文','attachment','disclosure']):
                      print('LINE',line.strip()[:2000],flush=True)
          PY
