name: Search public mirrors for Zhejiang Expressway reports 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-mirror-search-20260906.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Search and inspect matching public pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          mkdir -p mirror_search
          python - <<'PY'
          import html,json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          out=Path('mirror_search')
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          queries=['"区域经济赋能车流量长期增长"','"路网扩张提效 双业协同进阶"','"2025年报点评 稳健分红 H+A正在推进中"']
          records=[]
          for qi,q in enumerate(queries):
            r=s.get('https://www.so.com/s',params={'q':q,'pn':'1'},timeout=(15,90))
            print('SEARCH',qi,r.status_code,r.url,len(r.content),flush=True)
            (out/f'search_{qi}.html').write_bytes(r.content)
            soup=BeautifulSoup(r.text,'lxml')
            chosen=[]
            for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split()); href=html.unescape(a['href'])
              blob=text+' '+href
              if any(k in blob for k in ['三个皮匠','迈博汇金','慧云研','浙江沪杭甬','沪杭甬']):
                full=urllib.parse.urljoin(r.url,href)
                if full.startswith('http'):
                  chosen.append((text,full)); print('RESULT',qi,repr(text),full,flush=True)
            seen=set()
            for ri,(text,u) in enumerate(chosen[:30]):
              if u in seen:continue
              seen.add(u)
              try:
                rr=s.get(u,headers={'Referer':r.url},timeout=(15,120),allow_redirects=True)
                print('RESOLVE',qi,ri,rr.status_code,rr.url,rr.headers.get('content-type'),len(rr.content),flush=True)
                key=f'q{qi}_r{ri}'
                (out/f'{key}.html').write_bytes(rr.content)
                rec={'query':q,'text':text,'search_url':u,'final_url':rr.url,'status':rr.status_code,'content_type':rr.headers.get('content-type'),'bytes':len(rr.content)}
                records.append(rec)
                ss=BeautifulSoup(rr.text,'lxml')
                print('TITLE',key,ss.title.get_text(' ',strip=True) if ss.title else '',flush=True)
                for tag in ss.find_all(['a','iframe','embed','object','script','img','source']):
                  for attr in ['href','src','data']:
                    v=tag.get(attr)
                    if not v:continue
                    full=urllib.parse.urljoin(rr.url,v)
                    blob2=(full+' '+tag.get_text(' ',strip=True)+' '+str(tag.attrs)).lower()
                    if any(x in blob2 for x in ['.pdf','download','fileurl','file_url','report','oss','preview','viewer']):
                      print('LINK',key,tag.name,attr,full,flush=True)
                for m in re.finditer(r'(?i).{0,180}(?:\.pdf|download|fileurl|file_url|oss|preview|viewer).{0,500}',rr.text):
                  print('HIT',key,repr(m.group(0)[:700]),flush=True)
              except Exception as e:print('RESOLVEERR',qi,ri,repr(e),flush=True)
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-mirror-search
          path: mirror_search/
          retention-days: 7
