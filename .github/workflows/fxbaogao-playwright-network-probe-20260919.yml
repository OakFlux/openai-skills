name: Probe FXBaogao viewer network 20260919

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-playwright-network-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Capture viewer traffic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fxpw/bodies
          python - <<'PY'
          from __future__ import annotations
          import asyncio, hashlib, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path('fxpw')
          interesting_hosts=('api.fxbaogao.com','report.fxbaogao.com','dr.fxbaogao.com','public.fxbaogao.com','static.fxbaogao.com')

          async def main():
              records=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  context=await browser.new_context(
                      viewport={'width':1440,'height':1000},
                      locale='zh-CN',
                      user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                      accept_downloads=True,
                  )
                  page=await context.new_page()

                  async def on_response(resp):
                      try:
                          req=resp.request
                          url=resp.url
                          ctype=(resp.headers.get('content-type') or '').lower()
                          rec={
                              'url':url,'status':resp.status,'content_type':ctype,
                              'method':req.method,'resource_type':req.resource_type,
                              'request_headers':{k:v for k,v in req.headers.items() if k.lower() in ('content-type','x-fp','x-bot','referer','origin','user-id','user-token','authorization')},
                              'post_data':req.post_data,
                              'response_headers':{k:v for k,v in resp.headers.items() if k.lower() in ('content-type','content-length','content-disposition','location','access-control-allow-origin')},
                          }
                          keep=any(h in url for h in interesting_hosts) or any(x in ctype for x in ('application/json','application/pdf','image/')) or '.pdf' in url.lower() or 'report' in url.lower()
                          if keep:
                              try:
                                  body=await resp.body()
                                  rec['body_bytes']=len(body)
                                  rec['sha256']=hashlib.sha256(body).hexdigest()
                                  if len(body)<=5_000_000:
                                      if any(x in ctype for x in ('json','text','javascript','xml','html')):
                                          ext='.txt'
                                      elif 'pdf' in ctype or body.startswith(b'%PDF'):
                                          ext='.pdf'
                                      elif 'png' in ctype or body.startswith(b'\x89PNG'):
                                          ext='.png'
                                      elif 'jpeg' in ctype or body.startswith(b'\xff\xd8'):
                                          ext='.jpg'
                                      elif 'webp' in ctype or body[8:12]==b'WEBP':
                                          ext='.webp'
                                      else:
                                          ext='.bin'
                                      idx=len(records)
                                      fn=OUT/'bodies'/f'{idx:04d}{ext}'
                                      fn.write_bytes(body)
                                      rec['body_file']=str(fn)
                                      if ext=='.txt':
                                          rec['body_text_preview']=body[:12000].decode('utf-8','replace')
                              except Exception as e:
                                  rec['body_error']=repr(e)
                              records.append(rec)
                      except Exception as e:
                          records.append({'handler_error':repr(e)})

                  page.on('response',on_response)
                  url='https://www.fxbaogao.com/view?id=5454573'
                  try:
                      await page.goto(url,wait_until='domcontentloaded',timeout=120_000)
                      await page.wait_for_timeout(30_000)
                      # scroll through the page to trigger lazy report requests
                      for _ in range(10):
                          await page.mouse.wheel(0,1800)
                          await page.wait_for_timeout(1200)
                      await page.wait_for_timeout(10_000)
                  except Exception as e:
                      records.append({'navigation_error':repr(e)})
                  await page.screenshot(path=str(OUT/'screenshot.png'),full_page=True)
                  (OUT/'dom.html').write_text(await page.content(),encoding='utf-8')
                  (OUT/'title.txt').write_text(await page.title(),encoding='utf-8')
                  (OUT/'current_url.txt').write_text(page.url,encoding='utf-8')
                  (OUT/'cookies.json').write_text(json.dumps(await context.cookies(),ensure_ascii=False,indent=2),encoding='utf-8')
                  await browser.close()
              (OUT/'network.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
              print('CURRENT_URL', (OUT/'current_url.txt').read_text(), flush=True)
              print('TITLE', (OUT/'title.txt').read_text(), flush=True)
              for r in records:
                  if isinstance(r,dict) and ('api.fxbaogao.com' in r.get('url','') or 'report.fxbaogao.com' in r.get('url','') or 'dr.fxbaogao.com' in r.get('url','') or 'public.fxbaogao.com' in r.get('url','') or 'application/pdf' in r.get('content_type','')):
                      print('NET',json.dumps(r,ensure_ascii=False)[:5000],flush=True)

          asyncio.run(main())
          PY

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-playwright-network-probe
          path: fxpw
          retention-days: 7
          if-no-files-found: warn
