name: Quick test Ledong report PDF paths

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet requests pypdf
      - name: Test exact public paths
        run: |
          python - <<'PY'
          import io, hashlib, json
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          out=Path('quick'); out.mkdir()
          data={'5593366':'2026/08/10','5608254':'2026/08/16','5637842':'2026/08/25','5646471':'2026/08/26'}
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/'})
          results=[]
          for rid,date in data.items():
              for root in ['report','report-cn','report-en']:
                  u=f'https://public.fxbaogao.com/{root}/{date}/{rid}.pdf'
                  try:
                      r=s.get(u,timeout=15,allow_redirects=True)
                      ispdf=b'%PDF' in r.content[:4096] and len(r.content)>20000
                      print(rid,root,r.status_code,r.headers.get('content-type'),len(r.content),ispdf,r.url,repr(r.content[:20]))
                      results.append({'id':rid,'root':root,'url':u,'final':r.url,'status':r.status_code,'type':r.headers.get('content-type'),'bytes':len(r.content),'pdf':ispdf})
                      if ispdf:
                          p=out/f'{rid}.pdf'; p.write_bytes(r.content)
                          print('FOUND',rid,len(PdfReader(io.BytesIO(r.content),strict=False).pages),hashlib.sha256(r.content).hexdigest())
                          break
                  except Exception as e:
                      print('ERR',rid,root,repr(e)); results.append({'id':rid,'root':root,'url':u,'error':repr(e)})
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_Quick_PDF_Test
          path: quick
          retention-days: 1
          if-no-files-found: error
