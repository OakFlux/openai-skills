name: Build Standard Chartered 2020-2025 annual reports package 20260926

on:
  push:
    paths:
      - '.github/workflows/standard-chartered-02888-annual-reports-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download official PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          import urllib3
          from pypdf import PdfReader

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          PACKAGE = '渣打集团_02888_2020-2025年报及最新阶段性财务报告'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)

          docs = [
              {
                  'year': 2020,
                  'kind': '年度报告',
                  'date': '2021-02-25',
                  'filename': '01_渣打集团_2020年年度报告_官方英文版.pdf',
                  'url': 'https://www.sc.com/en/uploads/sites/66/content/docs/SCB_AR2020.pdf',
                  'source_page': 'https://www.sc.com/en/investors/financial-results/annual-report-archive/',
              },
              {
                  'year': 2021,
                  'kind': '年度报告',
                  'date': '2022-02-17',
                  'filename': '02_渣打集团_2021年年度报告_官方英文版.pdf',
                  'url': 'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2021-report.pdf',
                  'source_page': 'https://www.sc.com/en/investors/financial-results/annual-report-archive/',
              },
              {
                  'year': 2022,
                  'kind': '年度报告',
                  'date': '2023-02-16',
                  'filename': '03_渣打集团_2022年年度报告_官方英文版.pdf',
                  'url': 'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2022-report.pdf',
                  'source_page': 'https://www.sc.com/en/investors/financial-results/annual-report-archive/',
              },
              {
                  'year': 2023,
                  'kind': '年度报告',
                  'date': '2024-02-23',
                  'filename': '04_渣打集团_2023年年度报告_官方英文版.pdf',
                  'url': 'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2023-report.pdf',
                  'source_page': 'https://www.sc.com/en/investors/financial-results/annual-report-archive/',
              },
              {
                  'year': 2024,
                  'kind': '年度报告',
                  'date': '2025-02-21',
                  'filename': '05_渣打集团_2024年年度报告_官方英文版.pdf',
                  'url': 'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2024-report.pdf',
                  'source_page': 'https://www.sc.com/en/investors/financial-results/annual-report-archive/',
              },
              {
                  'year': 2025,
                  'kind': '年度报告',
                  'date': '2026-02-24',
                  'filename': '06_渣打集团_2025年年度报告_官方英文版.pdf',
                  'url': 'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-2025-annual-report.pdf',
                  'source_page': 'https://www.sc.com/en/investors/financial-results/annual-report-archive/',
              },
              {
                  'year': 2026,
                  'kind': '中期报告（含2026年第二季度及上半年业绩）',
                  'date': '2026-07-29',
                  'filename': '07_渣打集团_2026年中期报告_含第二季度及上半年业绩_官方英文版.pdf',
                  'url': 'https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-hy-2026-report.pdf',
                  'source_page': 'https://www.sc.com/en/investors/financial-results/half-year/',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'en-GB,en;q=0.9,zh-CN;q=0.8',
              'Referer': 'https://www.sc.com/en/investors/financial-results/',
          })

          def download_pdf(url: str) -> tuple[bytes, dict]:
              last = None
              for attempt in range(6):
                  for verify in (True, False):
                      try:
                          r = session.get(url, timeout=(30, 300), allow_redirects=True, verify=verify)
                          last = {
                              'status': r.status_code,
                              'final_url': r.url,
                              'content_type': r.headers.get('content-type', ''),
                              'content_length_header': r.headers.get('content-length'),
                              'bytes': len(r.content),
                              'tls_verified': verify,
                          }
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 500_000:
                              return r.content, last
                      except Exception as exc:
                          last = {'error': repr(exc), 'tls_verified': verify}
                  time.sleep(2 + attempt * 2)
              raise RuntimeError(f'Unable to download {url}: {last}')

          manifest = []
          for doc in docs:
              data, dl = download_pdf(doc['url'])
              dest = root / doc['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < 20:
                  raise RuntimeError(f'Unexpectedly short PDF: {dest.name}, {pages} pages')

              sample_text = ''
              for i in range(min(8, pages)):
                  try:
                      sample_text += '\n' + (reader.pages[i].extract_text() or '')
                  except Exception:
                      pass
              sample_lower = sample_text.lower()
              if 'standard chartered' not in sample_lower:
                  raise RuntimeError(f'Company identity check failed: {dest.name}')
              if doc['kind'] == '年度报告' and str(doc['year']) not in sample_text:
                  raise RuntimeError(f'Year identity check failed: {dest.name}')
              if doc['year'] == 2026 and 'half year report 2026' not in sample_lower:
                  raise RuntimeError(f'Half-year report identity check failed: {dest.name}')

              subprocess.run(
                  ['qpdf', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )

              preview_prefix = preview_dir / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '110', '-singlefile', str(dest), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(preview_prefix) + '.png')
              if not preview_file.exists() or preview_file.stat().st_size < 20_000:
                  raise RuntimeError(f'Preview rendering failed: {dest.name}')

              sha256 = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **doc,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'download': dl,
                  'preview_file': str(Path('首页预览') / preview_file.name),
                  'validation': [
                      'PDF file signature',
                      'company identity',
                      'report year/type identity',
                      'page count',
                      'qpdf structure check',
                      'first-page rendering',
                  ],
              })

          lines = [
              '渣打集团（Standard Chartered PLC；港交所代码：02888）2020-2025年报及最新阶段性财务报告',
              '整理日期：2026-09-26',
              '',
              '本资料包收录渣打集团官方网站公开发布的PDF原件：2020-2025年度报告，以及截至2026年6月30日的2026年中期报告。',
              '2026年中期报告同时披露2026年第二季度及上半年业绩，是整理日可获得的最新完整阶段性财务报告。',
              '',
              '文件清单：',
          ]
          for i, item in enumerate(manifest, 1):
              lines.extend([
                  f"{i}. {item['filename']}",
                  f"   类型：{item['kind']}",
                  f"   发布日期：{item['date']}；页数：{item['pages']}页；文件大小：{item['bytes']}字节",
                  f"   官方来源页面：{item['source_page']}",
                  f"   官方PDF：{item['url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ])
          lines.extend([
              '说明：渣打集团以英文发布集团年度报告，本包保留官方英文PDF原件。',
              '核验项目：PDF文件头、公司名称、年度/报告类型、实际页数、PDF结构、首页渲染与ZIP CRC。',
          ])
          (root / '00_文件清单与说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      zf.write(path, arcname=f'{PACKAGE}/{path.relative_to(root)}')

          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC check failed: {bad}')
              pdfs = [name for name in zf.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 7:
                  raise RuntimeError(f'Expected 7 PDFs, found {len(pdfs)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name)
          print('SIZE_BYTES', zip_path.stat().st_size)
          print('SHA256', zip_sha)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: standard-chartered-02888-annual-reports-final
          path: 渣打集团_02888_2020-2025年报及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
