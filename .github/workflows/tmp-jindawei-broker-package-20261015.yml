name: Package Jindawei broker deep reports

on:
  push:
    branches: [tmp-jindawei-broker-reports-20261015]
    paths: ['.github/workflows/tmp-jindawei-broker-package-20261015.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='金达威_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            echo "Downloading $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002626' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"
            qpdf --check "$out" >/dev/null
            pages=$(pdfinfo "$out" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge 10
            pdftotext -f 1 -l 3 "$out" "$out.txt"
            grep -q '金达威' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $out ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202512261808455099_1.pdf' \
            "$PACKAGE/01_东吴证券_披云开雾障踏雪至山巅_2025-12-26_24页.pdf"

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202003301377178903_1.pdf' \
            "$PACKAGE/02_东吴证券_经营拐点隐现平台价值凸显_2020-03-30_24页.pdf"

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202003091376029477_1.pdf' \
            "$PACKAGE/03_长城证券_价格逐步回归辅酶Q10的价格及弹性_2020-03-04_20页.pdf"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          folder = Path('金达威_券商深度报告_3份')
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          meta = [
              ('01', '东吴证券', '披云开雾障，踏雪至山巅', '2025-12-26', 'AP202512261808455099'),
              ('02', '东吴证券', '经营拐点隐现，平台价值凸显', '2020-03-30', 'AP202003301377178903'),
              ('03', '长城证券', '价格逐步回归—辅酶Q10的价格及弹性', '2020-03-04', 'AP202003091376029477'),
          ]
          lines = [
              '金达威（002626）券商公司深度报告',
              '整理日期：2026-10-15',
              '',
              '收录范围：公开可下载的完整公司深度/首次覆盖报告，共3份。',
              'PDF为公开研究报告镜像原件，仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          for p, (_, broker, title, date, code) in zip(pdfs, meta):
              data = p.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(['pdfinfo', str(p)], text=True, errors='replace')
              pages = next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:'))
              lines += [
                  f'- {p.name}',
                  f'  券商：{broker}；发布日期：{date}；页数：{pages}；公开索引编号：{code}',
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {p.name}')
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          zip -q -r -6 "$PACKAGE.zip" "$PACKAGE"
          unzip -t "$PACKAGE.zip" >/dev/null
          test "$(unzip -Z1 "$PACKAGE.zip" | grep -c '\.pdf$')" -eq 3
          sha256sum "$PACKAGE.zip"
          du -h "$PACKAGE.zip"

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Jindawei-broker-deep-reports-3
          path: 金达威_券商深度报告_3份.zip
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
