name: Search Ziliaoting for Seazen report posts
on:
  push:
    branches:
      - tmp-ziliaoting-wpsearch-20260907
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search public pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          mkdir -p output
          python - <<'PY'
          import base64, html, json, re
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup
          out=Path('output')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          result={'searches':[],'posts':[]}
          urls=[
            'https://www.ziliaoting.com/?s='+quote('新城发展'),
            'https://www.ziliaoting.com/wp-json/wp/v2/search?search='+quote('新城发展')+'&per_page=100',
            'https://www.ziliaoting.com/wp-json/wp/v2/posts?search='+quote('新城发展')+'&per_page=100&_fields=id,date,link,title,content',
            'https://www.ziliaoting.com/wp-json/wp/v2/posts/65594?_fields=id,date,link,title,content',
          ]
          post_ids={65594}
          for url in urls:
            row={'url':url}
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              row.update({'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'text':r.text[:500000]})
              (out/f'response_{len(result["searches"])+1}.txt').write_text(r.text,encoding='utf-8',errors='replace')
              try:
                obj=r.json(); row['json']=obj
                if isinstance(obj,list):
                  for item in obj:
                    if isinstance(item,dict) and item.get('id'): post_ids.add(int(item['id']))
                elif isinstance(obj,dict) and obj.get('id'): post_ids.add(int(obj['id']))
              except Exception:
                soup=BeautifulSoup(r.text,'lxml'); links=[]
                for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href']); text=' '.join(a.get_text(' ',strip=True).split())
                  if re.search(r'/\d+\.html',href) and '新城发展' in (text+' '+(a.get('title') or '')):
                    links.append({'href':href,'text':text,'title':a.get('title')})
                    m=re.search(r'/(\d+)\.html',href)
                    if m: post_ids.add(int(m.group(1)))
                row['links']=links
              print('SEARCH',url,r.status_code,'POST_IDS',sorted(post_ids),flush=True)
            except Exception as e: row['error']=repr(e)
            result['searches'].append(row)
          for pid in sorted(post_ids):
            url=f'https://www.ziliaoting.com/wp-json/wp/v2/posts/{pid}?_fields=id,date,link,title,content'
            row={'id':pid,'url':url}
            try:
              r=s.get(url,timeout=90); row.update({'status':r.status_code,'bytes':len(r.content)})
              if r.status_code==200:
                obj=r.json(); rendered=(obj.get('content') or {}).get('rendered',''); soup=BeautifulSoup(rendered,'lxml')
                title=html.unescape(BeautifulSoup((obj.get('title') or {}).get('rendered',''),'lxml').get_text(' ',strip=True))
                links=[]
                for a in soup.find_all('a',href=True):
                  href=urljoin(obj.get('link') or url,a['href']); rec={'href':href,'text':' '.join(a.get_text(' ',strip=True).split())}
                  token=(parse_qs(urlparse(href).query).get('golink') or [None])[0]
                  if token:
                    try:
                      raw=unquote(token); raw += '='*((4-len(raw)%4)%4); rec['decoded']=base64.b64decode(raw).decode('utf-8','replace')
                    except Exception as e: rec['decode_error']=repr(e)
                  links.append(rec)
                row.update({'title':title,'date':obj.get('date'),'link':obj.get('link'),'links':links,'content_text':' '.join(soup.get_text(' ',strip=True).split())[:30000]})
                print('POST',pid,title,flush=True)
                for link in links:
                  if link.get('decoded'): print('DECODED',pid,link['decoded'],flush=True)
            except Exception as e: row['error']=repr(e)
            result['posts'].append(row)
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: ziliaoting-seazen-search-lite
          path: output/*
          retention-days: 1
          if-no-files-found: error
