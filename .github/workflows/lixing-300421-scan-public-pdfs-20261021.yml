name: Scan public broker PDFs for Lixing coverage 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-scan-public-pdfs-20261021.yml'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: python -m pip install --quiet requests pymupdf
      - name: Download and scan candidate PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,time,requests,pymupdf
          candidates=[
            {'info':'AP202307311592910914','broker':'国金证券','date':'2023-07-31','title':'轴承行业研究：机械设备核心部件，机器人有望打开应用','meta_pages':52},
            {'info':'AP202308021593151040','broker':'华安证券','date':'2023-08-02','title':'电力设备：人形机器人产业前景广阔，看好核心零部件','meta_pages':40},
            {'info':'AP202403151626861714','broker':'东吴证券','date':'2024-03-15','title':'人形机器人行业跟踪报告：国内外人形机器人催化不断，如何把握2024年板块投资机会？','meta_pages':50},
            {'info':'AP202403141626722049','broker':'国金证券','date':'2024-03-14','title':'机器人新技术专题（三）：冷锻工艺极限精度C3，兼具高效率低成本优势','meta_pages':15},
            {'info':'AP202403141626701682','broker':'中邮证券','date':'2024-03-14','title':'机械设备深度报告：丝杠及设备—高价值量的核心传动部件','meta_pages':29},
            {'info':'AP202403171626954067','broker':'东吴证券','date':'2024-03-17','title':'机械设备行业跟踪周报：推荐产业化加速的人形机器人板块','meta_pages':23},
            {'info':'AP202403181626962205','broker':'太平洋证券','date':'2024-03-18','title':'机械行业周报：Figure实现OpenAI对机器人赋能，人形机器人进展再提速','meta_pages':18},
            {'info':'AP202302261583811014','broker':'开源证券','date':'2023-02-27','title':'基础化工行业周报：氮化硅陶瓷轴承球性能优异，风电与新能源汽车领域需求强劲','meta_pages':14},
            {'info':'AP202403171626953985','broker':'国金证券','date':'2024-03-17','title':'机械行业周报：关注设备更新、机器人、工程机械','meta_pages':16},
            {'info':'AP202403191627212694','broker':'华龙证券','date':'2024-03-19','title':'机械行业周报：人形机器人产业化提速，持续关注催化落地进展','meta_pages':15},
          ]
          aliases=['力星股份','江苏力星通用钢球股份有限公司','300421','力星钢球']
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          out=[]
          for item in candidates:
            data=None;pdfurl='';attempts=[]
            detail=f"https://data.eastmoney.com/report/info/{item['info']}.html"
            for h in ['H3','H2','H1','H4']:
              u=f"https://pdf.dfcfw.com/pdf/{h}_{item['info']}_1.pdf"
              try:
                r=s.get(u,headers={'User-Agent':s.headers['User-Agent'],'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'},timeout=(20,240),allow_redirects=True)
                attempts.append({'url':u,'status':r.status_code,'bytes':len(r.content),'ct':r.headers.get('content-type','')})
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:
                  data=r.content;pdfurl=u;break
              except Exception as e:attempts.append({'url':u,'error':repr(e)})
            if not data:
              out.append({**item,'downloaded':False,'attempts':attempts});continue
            doc=pymupdf.open(stream=data,filetype='pdf')
            pagehits=[];snips=[];occ=0
            for pno in range(doc.page_count):
              text=doc.load_page(pno).get_text('text') or ''
              compact=re.sub(r'\s+','',text);hits={}
              for a in aliases:
                n=compact.count(re.sub(r'\s+','',a))
                if n:
                  hits[a]=n;occ+=n
                  if len(snips)<20:
                    pos=text.find(a)
                    if pos>=0:snips.append({'page':pno+1,'alias':a,'text':' '.join(text[max(0,pos-180):pos+len(a)+360].split())})
              if hits:pagehits.append({'page':pno+1,'hits':hits})
            pages=doc.page_count;doc.close()
            score=len(pagehits)*300+occ*50+pages
            title=item['title']
            if '深度' in title or '行业研究' in title:score+=250
            if '周报' in title:score-=180
            out.append({**item,'downloaded':True,'actual_pages':pages,'pdf_url':pdfurl,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'pagehits':pagehits,'occurrences':occ,'snippets':snips,'score':score,'attempts':attempts})
            print('SCANNED',item['info'],'pages',pages,'hit_pages',len(pagehits),'occ',occ,'score',score)
          out.sort(key=lambda x:x.get('score',-999),reverse=True)
          print('SCAN_RESULTS',json.dumps(out,ensure_ascii=False,indent=2))
          PY
