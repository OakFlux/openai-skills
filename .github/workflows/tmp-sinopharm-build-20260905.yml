name: Build Sinopharm broker report package

on:
  push:
    branches:
      - tmp-sinopharm-build-20260905

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download public reports and build package
        run: |
          python -m pip install --quiet requests beautifulsoup4 cryptography pillow pypdf
          mkdir -p deliverable
          cat > /tmp/build_sinopharm_reports.py <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          from cryptography.hazmat.primitives.padding import PKCS7
          from PIL import Image
          from pypdf import PdfReader

          OUT = Path('deliverable')
          WORK = OUT / 'package'
          WORK.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def get_with_retry(url, *, referer=None, timeout=(20, 90), attempts=6):
              headers = {'Referer': referer} if referer else None
              last_error = None
              for attempt in range(attempts):
                  try:
                      response = session.get(url, headers=headers, timeout=timeout, allow_redirects=True)
                      if response.status_code == 200:
                          return response
                      last_error = RuntimeError(f'HTTP {response.status_code} for {url}')
                  except Exception as exc:
                      last_error = exc
                  time.sleep(min(2 ** attempt, 12))
              raise RuntimeError(f'failed to download {url}: {last_error}')

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def pdf_page_count(path):
              return len(PdfReader(str(path), strict=False).pages)

          def image_response_to_rgb(response, label):
              if len(response.content) < 1000:
                  raise RuntimeError(f'{label}: image response too small ({len(response.content)} bytes)')
              image = Image.open(io.BytesIO(response.content))
              image.load()
              if image.width < 500 or image.height < 700:
                  raise RuntimeError(f'{label}: unexpected image size {image.size}')
              rgba = image.convert('RGBA')
              background = Image.new('RGB', rgba.size, 'white')
              background.paste(rgba, mask=rgba.getchannel('A'))
              image.close()
              rgba.close()
              return background

          def save_image_pages_as_pdf(pages, path):
              if not pages:
                  raise RuntimeError('no pages supplied')
              pages[0].save(
                  path,
                  'PDF',
                  save_all=True,
                  append_images=pages[1:],
                  resolution=150.0,
                  quality=95,
                  subsampling=0,
              )
              for page in pages:
                  page.close()
              if pdf_page_count(path) == 0:
                  raise RuntimeError(f'empty PDF generated: {path}')

          manifest = []

          # 1) Xingzheng International: public original PDF returned by the report page's client-side download button.
          hangyan_page = 'https://www.hangyan.co/reports/3097844454174754770'
          page_response = get_with_retry(hangyan_page)
          soup = BeautifulSoup(page_response.text, 'html.parser')
          element = soup.select_one('[data-controller~="native-pdf"]')
          if element is None:
              raise RuntimeError('Hangyan native-pdf element not found')
          token = element.get('data-native-pdf-cache-key-value')
          original_filename = element.get('data-native-pdf-filename-value') or ''
          if not token:
              raise RuntimeError('Hangyan public PDF token not found')

          def decrypt_public_pdf_url(encrypted_token):
              encoded = encrypted_token.replace('-', '+').replace('_', '/')
              encoded += '=' * ((4 - len(encoded) % 4) % 4)
              payload = base64.b64decode(encoded)
              if len(payload) <= 16:
                  raise RuntimeError('invalid encrypted PDF token')
              iv, ciphertext = payload[:16], payload[16:]
              current_time = int(time.time())
              for offset in range(-8, 9):
                  bucket = math.floor((current_time + offset * 120) / 120)
                  key_text = ('cv_' + str(bucket) + 'zIDfwokaoIUFlw')[:32].ljust(32, '0')
                  try:
                      decryptor = Cipher(algorithms.AES(key_text.encode()), modes.CBC(iv)).decryptor()
                      padded = decryptor.update(ciphertext) + decryptor.finalize()
                      unpadder = PKCS7(128).unpadder()
                      plaintext = unpadder.update(padded) + unpadder.finalize()
                      url = plaintext.decode('utf-8')
                      if url.startswith('https://') or url.startswith('http://'):
                          return url
                  except Exception:
                      continue
              raise RuntimeError('could not decrypt Hangyan temporary public PDF URL')

          hangyan_pdf_url = decrypt_public_pdf_url(token)
          hangyan_pdf_response = get_with_retry(hangyan_pdf_url, referer=hangyan_page, attempts=4)
          hangyan_data = hangyan_pdf_response.content
          if not hangyan_data.lstrip().startswith(b'%PDF') or len(hangyan_data) < 50000:
              raise RuntimeError(f'Hangyan response is not a valid PDF ({len(hangyan_data)} bytes)')
          hangyan_name = '2023-05-07_兴证国际证券_创新转型逐步加速，龙头地位不断巩固_完整版.pdf'
          hangyan_path = WORK / hangyan_name
          hangyan_path.write_bytes(hangyan_data)
          hangyan_reader = PdfReader(str(hangyan_path), strict=False)
          hangyan_pages = len(hangyan_reader.pages)
          if hangyan_pages < 2:
              raise RuntimeError(f'unexpected Hangyan PDF page count: {hangyan_pages}')
          first_text = ' '.join((page.extract_text() or '') for page in hangyan_reader.pages[:5])
          compact_text = re.sub(r'\s+', '', first_text).lower()
          if not any(key in compact_text for key in ('国药控股', '01099', '1099.hk', 'sinopharm')):
              raise RuntimeError('Sinopharm name/code not found in Hangyan PDF')
          manifest.append({
              'company': '国药控股股份有限公司',
              'stock_code': '01099.HK',
              'broker': '兴证国际证券',
              'report_date': '2023-05-07',
              'title': '创新转型逐步加速，龙头地位不断巩固',
              'file': hangyan_name,
              'original_filename': original_filename,
              'pages': hangyan_pages,
              'size_bytes': len(hangyan_data),
              'sha256': sha256_bytes(hangyan_data),
              'source_page': hangyan_page,
              'access_type': '公开页面下载按钮返回的原始完整PDF',
          })

          # 2) Cinda Securities 27-page deep report: first ten pages explicitly exposed by the source page as public preview.
          cinda_page = 'https://www.sdyanbao.com/detail/938808'
          cinda_base = 'https://oss.sdyanbao.com/page/2025/12/18/1277012'
          cinda_images = []
          for index in range(10):
              url = f'{cinda_base}/{index}.png'
              response = get_with_retry(url, referer=cinda_page)
              cinda_images.append(image_response_to_rgb(response, f'Cinda page {index + 1}'))
          cinda_name = '2025-12-05_信达证券_医药流通龙头行稳致远，高股息与经营质量优化或助力估值提升_公开预览10页.pdf'
          cinda_path = WORK / cinda_name
          save_image_pages_as_pdf(cinda_images, cinda_path)
          cinda_pages = pdf_page_count(cinda_path)
          if cinda_pages != 10:
              raise RuntimeError(f'Cinda preview page count mismatch: {cinda_pages}')
          cinda_data = cinda_path.read_bytes()
          manifest.append({
              'company': '国药控股股份有限公司',
              'stock_code': '01099.HK',
              'broker': '信达证券',
              'report_date': '2025-12-05',
              'title': '医药流通龙头行稳致远，“高股息&经营质量优化”或助力估值提升',
              'file': cinda_name,
              'reported_full_length_pages': 27,
              'pages_included': cinda_pages,
              'size_bytes': len(cinda_data),
              'sha256': sha256_bytes(cinda_data),
              'source_page': cinda_page,
              'access_type': '来源页面明确公开的前10页预览；未收录需下载权限的其余页面',
          })

          # 3) First Shanghai update report: two public preview pages exposed by the source page.
          firstshanghai_page = 'https://www.fxbaogao.com/detail/5080292'
          firstshanghai_base = 'https://public.fxbaogao.com/report-image/2025/09/29/5080292'
          firstshanghai_images = []
          for index in (1, 2):
              url = f'{firstshanghai_base}-{index}.png?x-oss-process=image/format,webp'
              response = get_with_retry(url, referer=firstshanghai_page)
              firstshanghai_images.append(image_response_to_rgb(response, f'First Shanghai page {index}'))
          firstshanghai_name = '2025-09-26_第一上海证券_毛利率仍在下降，效率提升导致净利润率下降趋缓_公开预览2页.pdf'
          firstshanghai_path = WORK / firstshanghai_name
          save_image_pages_as_pdf(firstshanghai_images, firstshanghai_path)
          firstshanghai_pages = pdf_page_count(firstshanghai_path)
          if firstshanghai_pages != 2:
              raise RuntimeError(f'First Shanghai preview page count mismatch: {firstshanghai_pages}')
          firstshanghai_data = firstshanghai_path.read_bytes()
          manifest.append({
              'company': '国药控股股份有限公司',
              'stock_code': '01099.HK',
              'broker': '第一上海证券',
              'report_date': '2025-09-26',
              'source_page_date': '2025-09-29',
              'title': '毛利率仍在下降，效率提升导致净利润率下降趋缓',
              'file': firstshanghai_name,
              'pages_included': firstshanghai_pages,
              'size_bytes': len(firstshanghai_data),
              'sha256': sha256_bytes(firstshanghai_data),
              'source_page': firstshanghai_page,
              'access_type': '来源页面公开的2页预览；未绕过登录或下载权限',
          })

          manifest_path = WORK / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          readme = '''国药控股（01099.HK）券商研究报告资料包

本资料包共收录3份：
1. 兴证国际证券，2023-05-07，《创新转型逐步加速，龙头地位不断巩固》：公开页面下载按钮返回的原始完整PDF。
2. 信达证券，2025-12-05，《医药流通龙头行稳致远，“高股息&经营质量优化”或助力估值提升》：报告全篇标注为27页，来源页面明确只公开前10页预览，本包收录该10页预览。
3. 第一上海证券，2025-09-26，《毛利率仍在下降，效率提升导致净利润率下降趋缓》：来源页面公开的2页预览。

所有文件均取自无需登录即可访问的公开页面或公开预览资源。对于未公开完整PDF的报告，文件名和清单均已明确标注“公开预览”，未绕过登录、付费或其他访问限制。

manifest.json 包含每个文件的页数、文件大小、SHA-256及来源页面。
'''
          (WORK / 'README_来源说明.txt').write_text(readme, encoding='utf-8')

          checksum_lines = []
          for item in manifest:
              checksum_lines.append(f"{item['sha256']}  {item['file']}")
          checksum_lines.append(f"{sha256_bytes(manifest_path.read_bytes())}  manifest.json")
          (WORK / 'SHA256SUMS.txt').write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8')

          zip_path = OUT / 'guoyao_konggu_broker_reports.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(WORK.iterdir(), key=lambda p: p.name):
                  archive.write(path, path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              if archive.testzip() is not None:
                  raise RuntimeError('ZIP integrity test failed')

          print('PACKAGE', zip_path, zip_path.stat().st_size, sha256_bytes(zip_path.read_bytes()))
          for item in manifest:
              print('REPORT', item['broker'], item['report_date'], item.get('pages', item.get('pages_included')), item['sha256'], item['file'])
          PY
          python /tmp/build_sinopharm_reports.py

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: sinopharm-broker-reports
          path: deliverable/guoyao_konggu_broker_reports.zip
          retention-days: 1
          compression-level: 0
