name: Probe targeted China Chemical 601117 deep research reports 20260927

on:
  push:
    paths:
      - '.github/workflows/china-chemical-601117-targeted-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Download and inspect targeted reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p china_chemical_targeted
          python - <<'PY'
          import hashlib,json,re,time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          out=Path('china_chemical_targeted')
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'})
          items=[
            ('AP202304181585535431','2023-04-18','国信证券','化学工程稳发展，实业版图迎新机'),
            ('AP202109201517457916','2021-09-21','东吴证券','工程建设业务基石坚固，新材料项目之矛成长空间大'),
            ('AP202108301513324231','2021-08-31','华安证券','碳中和解决方案提供商'),
            ('AP202106281500486913','2021-06-28','东吴证券','化学工程龙头发力高端新材料项目值得期待'),
            ('AP202106271500341122','2021-06-27','华安证券','尼龙66东风已来，中国化学乘势而上'),
            ('AP201807251170052637','2018-07-25','太平洋证券','业绩向上拐点确认，化学工程龙头扬帆远航'),
            ('AP201801181079082345','2018-01-18','新时代证券','传统主业景气上行，转型基建及环保空间巨大'),
            ('AP202110311526144108','2021-10-31','华安证券','厚积薄发，进军天然碱和磷化工大有可为'),
          ]
          def safe(x):return re.sub(r'[\\/:*?"<>|]+','_',x)
          results=[]
          for info,date,broker,title in items:
            urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf']
            data=None;used=None;errors=[]
            for u in urls:
              try:
                r=s.get(u,timeout=(25,120),allow_redirects=True);print('GET',info,r.status_code,len(r.content),u,'FINAL',r.url,flush=True)
                if r.status_code==200 and len(r.content)>100000 and r.content.startswith(b'%PDF-'):
                  data=r.content;used=r.url;break
              except Exception as e:errors.append(repr(e))
            if data is None:
              results.append({'info_code':info,'date':date,'broker':broker,'title':title,'error':'download_failed','errors':errors});continue
            fn=f'{date}_{safe(broker)}_{safe(title)}.pdf';p=out/fn;p.write_bytes(data)
            try:
              reader=PdfReader(str(p),strict=False);pages=len(reader.pages);parts=[]
              for i in range(min(10,pages)):
                try:parts.append(reader.pages[i].extract_text() or '')
                except Exception:pass
              text='\n'.join(parts);low=text.lower()
              identity=('中国化学' in text or '中国化学工程' in text or '601117' in text or 'china national chemical engineering' in low)
              research=any(k in text for k in ['证券研究报告','公司研究','深度研究','首次覆盖']) or 'equity research' in low
              rec={'filename':fn,'info_code':info,'date':date,'broker':broker,'title':title,'source_url':used,'pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'identity_verified':identity,'research_markers':research,'sample':text[:7000]}
              results.append(rec);print('RESULT',json.dumps({k:rec[k] for k in ['date','broker','title','pages','identity_verified','research_markers','source_url']},ensure_ascii=False),flush=True)
              if not identity:p.unlink(missing_ok=True)
            except Exception as e:
              p.unlink(missing_ok=True);results.append({'info_code':info,'date':date,'broker':broker,'title':title,'error':repr(e)})
            time.sleep(.2)
          results.sort(key=lambda x:(x.get('identity_verified',False),x.get('pages',0),x.get('date','')),reverse=True)
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'results.txt').write_text('\n'.join(f"{x.get('date')} | {x.get('broker')} | {x.get('pages','?')}页 | {x.get('title')} | {x.get('source_url','')} | {x.get('error','')}" for x in results),encoding='utf-8')
          print('FINAL',json.dumps([{k:x.get(k) for k in ['filename','date','broker','title','pages','source_url','identity_verified','research_markers','error']} for x in results],ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload targeted probe
        uses: actions/upload-artifact@v4
        with:
          name: china-chemical-601117-targeted-probe
          path: china_chemical_targeted
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
