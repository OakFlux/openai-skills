name: Kebaier Official Filings Package V2

on:
  push:
    branches:
      - chatgpt-kebaier-filings-20261004
    paths:
      - .github/workflows/kebaier_filings_package_v2_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pillow

      - name: Download, validate, render, and package filings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports output/renders
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import pymupdf
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          COMPANY = '合肥科拜尔新材料股份有限公司'
          SHORT = '科拜尔'
          CODE = '920066'
          OLD_CODE = '873664'
          AS_OF = '2026-10-04'
          OUT = Path('output/reports')
          RENDERS = Path('output/renders')

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'filename': '科拜尔_2022年年度报告.pdf',
                  'category': '2022年年度报告（最新修订披露版本）',
                  'year': 2022,
                  'kind': 'annual',
                  'expected_pages': 156,
                  'source_detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920066&id=9740877',
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2023/2023-12/2023-12-26/9740877.PDF',
              },
              {
                  'filename': '科拜尔_2023年年度报告.pdf',
                  'category': '2023年年度报告',
                  'year': 2023,
                  'kind': 'annual',
                  'expected_pages': 159,
                  'source_detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920066&id=9865113',
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2024/2024-3/2024-03-11/9865113.PDF',
              },
              {
                  'filename': '科拜尔_2024年年度报告.pdf',
                  'category': '2024年年度报告',
                  'year': 2024,
                  'kind': 'annual',
                  'expected_pages': 159,
                  'source_detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920066&id=10883120',
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSEBJ_STOCK/2025/2025-4/2025-04-16/10883120.PDF',
              },
              {
                  'filename': '科拜尔_2025年年度报告.pdf',
                  'category': '2025年年度报告',
                  'year': 2025,
                  'kind': 'annual',
                  'expected_pages': 178,
                  'source_detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920066&id=12157616',
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSEBJ_STOCK/2026/2026-4/2026-04-23/12157616.PDF',
              },
              {
                  'filename': '科拜尔_向不特定合格投资者公开发行股票并在北京证券交易所上市招股说明书_最终发行版_2024-10-18.pdf',
                  'category': '最终发行版招股说明书',
                  'year': 2024,
                  'kind': 'prospectus',
                  'expected_pages': 300,
                  'source_detail': 'https://money.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=920066&id=10532533',
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSEBJ_STOCK/2024/2024-10/2024-10-18/10532533.PDF',
              },
              {
                  'filename': '科拜尔_2026年第一季度报告_最新季报.pdf',
                  'category': f'2026年第一季度报告（截至{AS_OF}最新正式季报）',
                  'year': 2026,
                  'kind': 'q1',
                  'expected_pages': None,
                  'source_detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=920066&id=12260401',
                  'url': None,
              },
          ]

          def normalize(value):
              return re.sub(r'\s+', '', html.unescape(value or ''))

          def fetch(url, *, referer=None, timeout=240):
              last = None
              for attempt in range(5):
                  try:
                      headers = {'Accept': 'application/pdf,*/*'}
                      if referer:
                          headers['Referer'] = referer
                      r = session.get(url, headers=headers, timeout=timeout, allow_redirects=True)
                      print('FETCH', attempt + 1, r.status_code, len(r.content), r.url, r.headers.get('content-type'))
                      if r.ok:
                          return r
                      last = RuntimeError(f'HTTP {r.status_code}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(12, 2 ** attempt))
              raise RuntimeError(f'Unable to fetch {url}: {last!r}')

          def resolve_attachment(detail_url):
              r = fetch(detail_url, referer='https://money.finance.sina.com.cn/', timeout=90)
              r.encoding = r.apparent_encoding or 'gb18030'
              soup = BeautifulSoup(r.text, 'html.parser')
              candidates = []
              for a in soup.find_all('a', href=True):
                  text = normalize(a.get_text(' ', strip=True))
                  href = urljoin(r.url, a['href'])
                  if '下载公告' in text or ('FILE.FINANCE.SINA.COM.CN' in href.upper() and '.PDF' in href.upper()):
                      candidates.append(href)
              candidates.extend(re.findall(r'https?://file\.finance\.sina\.com\.cn/[^\"\'<>\s]+\.PDF', r.text, re.I))
              seen = set()
              dedup = []
              for candidate in candidates:
                  candidate = html.unescape(candidate)
                  if candidate not in seen:
                      seen.add(candidate)
                      dedup.append(candidate)
              if not dedup:
                  raise RuntimeError(f'No PDF attachment link found: {detail_url}')
              dedup.sort(key=lambda value: (not value.upper().endswith('.PDF'), len(value)))
              print('ATTACHMENT', detail_url, dedup[0])
              return dedup[0]

          def first_pages_text(path, pages, limit=8):
              reader = PdfReader(str(path))
              if reader.is_encrypted and not reader.decrypt(''):
                  raise RuntimeError(f'Password-protected PDF: {path.name}')
              chunks = []
              for index in range(min(limit, pages)):
                  try:
                      chunks.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              text = ' '.join(chunks)
              if len(text.strip()) < 100:
                  doc = pymupdf.open(str(path))
                  text = ' '.join(doc[index].get_text('text') for index in range(min(limit, doc.page_count)))
                  doc.close()
              return normalize(text)

          def validate(path, item):
              data = path.read_bytes()
              if not data.startswith(b'%PDF-'):
                  raise RuntimeError(f'Invalid PDF header: {path.name}')
              reader = PdfReader(str(path))
              encrypted = reader.is_encrypted
              if encrypted and not reader.decrypt(''):
                  raise RuntimeError(f'Encrypted PDF: {path.name}')
              pages = len(reader.pages)
              if item['expected_pages'] is not None and pages != item['expected_pages']:
                  raise RuntimeError(f'Page count mismatch for {path.name}: {pages} != {item["expected_pages"]}')
              if item['kind'] == 'annual' and pages < 100:
                  raise RuntimeError(f'Annual report too short: {path.name}, {pages} pages')
              if item['kind'] == 'prospectus' and pages < 250:
                  raise RuntimeError(f'Prospectus too short: {path.name}, {pages} pages')
              if item['kind'] == 'q1' and pages < 5:
                  raise RuntimeError(f'Quarterly report too short: {path.name}, {pages} pages')

              text = first_pages_text(path, pages)
              upper = text.upper()
              if not any(normalize(token).upper() in upper for token in (COMPANY, SHORT, 'HEFEI KEBAIER NEW MATERIAL')):
                  raise RuntimeError(f'Company identity validation failed: {path.name}')
              if str(item['year']) not in text:
                  raise RuntimeError(f'Report year validation failed: {path.name}')
              if item['kind'] == 'annual':
                  if '年度报告' not in text and 'ANNUALREPORT' not in upper:
                      raise RuntimeError(f'Annual report type validation failed: {path.name}')
              elif item['kind'] == 'q1':
                  if not any(term in text for term in ('第一季度报告', '一季度报告')):
                      raise RuntimeError(f'Quarterly report type validation failed: {path.name}')
              else:
                  if '招股说明书' not in text and 'PROSPECTUS' not in upper:
                      raise RuntimeError(f'Prospectus type validation failed: {path.name}')
                  cover_text = normalize(' '.join((reader.pages[i].extract_text() or '') for i in range(min(3, pages))))
                  if '申报稿' in cover_text:
                      raise RuntimeError(f'Filing draft detected instead of final prospectus: {path.name}')
              return pages, encrypted, hashlib.sha256(data).hexdigest(), len(data)

          manifest = []
          render_paths = []
          for item in reports:
              if item['url'] is None:
                  item['url'] = resolve_attachment(item['source_detail'])
              path = OUT / item['filename']
              r = fetch(item['url'], referer=item['source_detail'])
              if not r.content.startswith(b'%PDF-') or len(r.content) < 50_000:
                  raise RuntimeError(f'Not a usable PDF for {item["filename"]}: {r.content[:80]!r}')
              path.write_bytes(r.content)
              pages, encrypted, digest, byte_count = validate(path, item)

              doc = pymupdf.open(str(path))
              pix = doc[0].get_pixmap(matrix=pymupdf.Matrix(1.25, 1.25), alpha=False)
              render_path = RENDERS / f'{path.stem}_page1.png'
              pix.save(str(render_path))
              doc.close()
              render_paths.append(render_path)

              record = {
                  'filename': path.name,
                  'category': item['category'],
                  'report_year': item['year'],
                  'document_type': item['kind'],
                  'source_detail': item['source_detail'],
                  'download_url': item['url'],
                  'final_url': r.url,
                  'pages': pages,
                  'bytes': byte_count,
                  'sha256': digest,
                  'encrypted': encrypted,
                  'first_page_render': render_path.name,
              }
              manifest.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          thumbs = []
          for render_path in render_paths:
              image = Image.open(render_path).convert('RGB')
              image.thumbnail((450, 610))
              canvas = Image.new('RGB', (470, 660), 'white')
              canvas.paste(image, ((470 - image.width) // 2, 8))
              ImageDraw.Draw(canvas).text((10, 635), render_path.stem[:60], fill='black')
              thumbs.append(canvas)
              image.close()
          cols = 2
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 470, rows * 660), 'white')
          for index, canvas in enumerate(thumbs):
              sheet.paste(canvas, ((index % cols) * 470, (index // cols) * 660))
              canvas.close()
          contact_sheet = RENDERS / 'contact_sheet.jpg'
          sheet.save(contact_sheet, 'JPEG', quality=90)
          sheet.close()

          readme = [
              f'{COMPANY}（证券简称：{SHORT}；北交所代码：{CODE}；原新三板代码：{OLD_CODE}）披露文件资料包',
              '',
              '文件范围：',
              '1. 公司挂牌以来发布的全部正式年度报告：2022年至2025年，共4份。',
              '2. 2024年10月18日最终发行版《向不特定合格投资者公开发行股票并在北京证券交易所上市招股说明书》，不含申报稿。',
              f'3. 2026年第一季度报告，为截至{AS_OF}最新标题明确为“季度报告”的正式文件。',
              '',
              '口径说明：',
              '- 2022年年度报告存在多次同名披露，本包收录公告ID 9740877对应的最新可核验版本。',
              '- 公司已披露2026年半年度报告，但半年度报告不属于标题明确的季度报告；截至2026年10月4日，2026年第三季度报告尚未披露。',
              '- PDF附件取自新浪财经保存的上市公司公告原始附件镜像，并按公司名称、年份、文件类型和页数逐份核验。',
              '',
              '校验项目：PDF文件头、实际页数、加密状态、公司名称、报告年份、文件类型、首页渲染，以及ZIP CRC完整性。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.append(f"- {record['filename']} | {record['pages']}页 | {record['bytes']}字节 | SHA-256 {record['sha256']}")
          (OUT / '00_资料说明.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (OUT / '00_文件清单及校验值.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / '00_SHA256SUMS.txt').write_text('\n'.join(f"{record['sha256']}  {record['filename']}" for record in manifest) + '\n', encoding='utf-8')

          zip_path = Path('output/kebaier_all_annual_reports_prospectus_latest_quarter.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=8) as archive:
              for file_path in sorted(OUT.iterdir(), key=lambda value: value.name):
                  archive.write(file_path, arcname=file_path.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise RuntimeError(f'ZIP CRC failure: {bad_file}')

          summary = {
              'zip_filename': zip_path.name,
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'pdf_count': len(manifest),
              'total_pages': sum(record['pages'] for record in manifest),
              'reports': manifest,
          }
          Path('output/BUILD_SUMMARY.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_SUMMARY', json.dumps({key: summary[key] for key in ('zip_filename', 'zip_bytes', 'zip_sha256', 'pdf_count', 'total_pages')}, ensure_ascii=False))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kebaier-official-filings-v2
          path: |
            output/kebaier_all_annual_reports_prospectus_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
