name: Discover Joyoung broker deep reports 20260929

on:
  push:
    paths:
      - '.github/workflows/joyoung-002242-broker-report-discovery-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query public research-report index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          from typing import Any
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Origin':'https://www.sdyanbao.com',
            'Referer':'https://www.sdyanbao.com/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url: str, payload: dict[str, Any]) -> dict[str, Any]:
            last=None
            for attempt in range(7):
              try:
                r=s.post(url,json=payload,timeout=(20,120))
                last={'status':r.status_code,'text':r.text[:500]}
                if r.status_code==200:
                  return r.json()
              except Exception as exc:
                last={'error':repr(exc)}
              time.sleep(1+attempt)
            raise RuntimeError((url,last))

          def collect_records(obj: Any) -> list[dict[str, Any]]:
            found=[]
            def walk(x: Any):
              if isinstance(x,dict):
                if isinstance(x.get('id'),int) and isinstance(x.get('name'),str):
                  found.append(x)
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(obj)
            return list({r['id']:r for r in found}.values())

          queries=[
            '九阳股份','002242','九阳股份 深度报告','九阳股份 首次覆盖','九阳股份 公司深度',
            '经营拐点将至','把握产品红利 构建品牌壁垒','厨小电23年回暖可期','SharkNinja 九阳股份'
          ]
          raw={}; records={}
          for q in queries:
            payload={
              'device':1,'hideTrader':0,'onlyTitle':1,'order':0,
              'page':1,'pageSize':100,'keyword':q,'pageCount':0,
              'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''
            }
            try:
              data=post_json('https://api.sdyanbao.com/api/file/search',payload)
              raw[q]=data
              for r in collect_records(data): records[r['id']]=r
            except Exception as exc:
              raw[q]={'error':repr(exc)}
            time.sleep(.15)

          details=[]
          for rid,r in sorted(records.items(), reverse=True):
            try:
              d=post_json('https://api.sdyanbao.com/api/file/detail',{'id':rid})
              data=d.get('data') if isinstance(d,dict) else None
              details.append({'record':r,'detail':data,'raw_detail':None if isinstance(data,dict) else d})
            except Exception as exc:
              details.append({'record':r,'error':repr(exc)})
            time.sleep(.08)

          summary=[]
          for x in details:
            r=x.get('record') or {}; d=x.get('detail') or {}
            summary.append({
              'id':r.get('id'),'name':r.get('name'),'time_text':r.get('time_text'),
              'record_page_count':r.get('page_count'),'record_type':(r.get('type') or {}).get('name') if isinstance(r.get('type'),dict) else r.get('type'),
              'detail_name':d.get('name'),'detail_page_count':d.get('page_count'),'page_url':d.get('page_url'),
              'data_source':d.get('data_source'),'publish_time':d.get('publish_time'),
              'file_size':d.get('file_size'),'original_id':d.get('original_id'),
            })
          summary.sort(key=lambda x:((x.get('publish_time') or x.get('time_text') or ''), x.get('id') or 0), reverse=True)
          Path('out/search_raw.json').write_text(json.dumps(raw,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: joyoung-002242-broker-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
