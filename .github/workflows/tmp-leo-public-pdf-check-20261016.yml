name: Check public Leo deep-report PDF path

on:
  push:
    branches: [tmp-leo-broker-reports-20261016]
    paths: ['.github/workflows/tmp-leo-public-pdf-check-20261016.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check public PDF
        shell: bash
        run: |
          set -euo pipefail
          url='https://report.fxbaogao.com/report/2017/01/22/91485.pdf'
          curl --http1.1 -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0' -e 'https://www.fxbaogao.com/detail/91485' \
            "$url" -o candidate.bin
          echo "BYTES=$(stat -c%s candidate.bin)"
          echo -n 'PREFIX='; head -c 12 candidate.bin | xxd -p
          file candidate.bin
          test "$(head -c 5 candidate.bin)" = '%PDF-'
