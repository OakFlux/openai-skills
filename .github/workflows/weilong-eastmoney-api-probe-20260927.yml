name: Probe Eastmoney API for Weilong reports 20260927

on:
  push:
    paths:
      - '.github/workflows/weilong-eastmoney-api-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests
      - name: Probe API parameter variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,itertools
          from pathlib import Path
          import requests
          API='https://reportapi.eastmoney.com/report/list'
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/javascript,*/*;q=0.01'})
          variants=[]
          for qtype in ('0','1'):
            for key,val in [('code','09985'),('code','9985'),('code','09985.HK'),('rcode','09985'),('rcode','9985')]:
              variants.append((qtype,key,val))
          results=[]
          for i,(qtype,key,val) in enumerate(variants,1):
            p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2020-01-01','endTime':'2026-09-27','pageNo':'1','qType':qtype,'orgCode':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
            p[key]=val
            try:
              r=s.get(API,params=p,timeout=(20,120)); t=r.text.strip()
              try:d=r.json()
              except Exception:
                m=re.search(r'^[^(]*\((.*)\)\s*;?$',t,re.S);d=json.loads(m.group(1)) if m else {'raw':t[:1000]}
              data=d.get('data') or []
              rec={'qType':qtype,'key':key,'value':val,'status':r.status_code,'bytes':len(r.content),'hits':d.get('hits'),'totalPage':d.get('TotalPage') or d.get('totalPage'),'count':len(data),'data':data[:100]}
            except Exception as e:
              rec={'qType':qtype,'key':key,'value':val,'error':repr(e)}
            results.append(rec);print(json.dumps({k:v for k,v in rec.items() if k!='data'},ensure_ascii=False),flush=True)
          Path('out/probe.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weilong-eastmoney-api-probe-20260927
          path: out
          retention-days: 7
          if-no-files-found: error
