name: Inspect exact date bearing reports 20261005
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-bearing-exact-dates-20261005.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query exact dates
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2025-06-08','2025-06-10'),
            ('2022-05-31','2022-06-02'),
            ('2022-02-27','2022-03-01'),
            ('2022-10-11','2022-10-13'),
            ('2022-10-20','2022-10-22'),
            ('2022-11-16','2022-11-18'),
          ]
          for begin,end in windows:
            print('WINDOW',begin,end)
            for page in range(1,20):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'1','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(api,params=params,timeout=120); r.raise_for_status()
              rows=r.json().get('data') or []
              print('PAGE',page,'COUNT',len(rows))
              for row in rows:
                title=str(row.get('title') or '')
                if any(k in title for k in ['轴承','雷迪克']):
                  print('MATCH',json.dumps(row,ensure_ascii=False))
              if len(rows)<100:
                break
          PY
