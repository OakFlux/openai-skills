name: Build XCMG 000425 broker research PDF package 20260927

on:
  push:
    paths:
      - '.github/workflows/xcmg-000425-broker-reports-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet pypdf requests pillow

      - name: Download original PDFs, validate and assemble package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT=Path('徐工机械_000425.SZ_券商深度报告_3份')
          OUT.mkdir(exist_ok=True)
          PRE=Path('verification_previews'); PRE.mkdir(exist_ok=True)

          reports=[
            {
              'filename':'01_东吴证券_徐工机械_中国工程机械龙头_矿机成套打开第二增长曲线_2026-02-27.pdf',
              'broker':'东吴证券','date':'2026-02-27','pages':41,
              'title':'中国工程机械龙头，矿机成套打开第二增长曲线',
              'infoCode':'AP202602271820106646',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202602271820106646_1.pdf',
              'terms':['徐工机械','东吴证券','矿机'],
            },
            {
              'filename':'02_诚通证券_徐工机械_徐开四海业_工铸重器魂_2025-07-14.pdf',
              'broker':'诚通证券','date':'2025-07-14','pages':46,
              'title':'优质国资/央企深度推荐系列（四）：徐开四海业，工铸重器魂',
              'infoCode':'AP202507141708768697',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202507141708768697_1.pdf',
              'terms':['徐工机械','诚通证券','徐开四海'],
            },
            {
              'filename':'03_开源证券_徐工机械_国之重器打造中国名片_巨擘智造提速换挡_2025-03-10.pdf',
              'broker':'开源证券','date':'2025-03-10','pages':37,
              'title':'公司首次覆盖报告：国之重器打造“中国名片”，巨擘智造“提速换挡”',
              'infoCode':'AP202503101644232304',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202503101644232304_1.pdf',
              'terms':['徐工机械','开源证券','国之重器'],
            },
          ]

          sess=requests.Session(); sess.trust_env=False
          sess.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Referer':'https://data.eastmoney.com/',
            'Accept':'application/pdf,*/*;q=0.8',
          })

          records=[]
          for idx,rpt in enumerate(reports,1):
            dest=OUT/rpt['filename']
            resp=sess.get(rpt['url'],timeout=(30,240),allow_redirects=True)
            print('GET',resp.status_code,len(resp.content),resp.url,flush=True)
            resp.raise_for_status()
            data=resp.content
            if not data.startswith(b'%PDF-'):
              raise RuntimeError(f"not a PDF: {rpt['url']} head={data[:32]!r}")
            if len(data)<300_000:
              raise RuntimeError(f"PDF unexpectedly small: {len(data)} bytes")
            dest.write_bytes(data)

            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages != rpt['pages']:
              raise RuntimeError(f"page count mismatch for {dest.name}: got {pages}, expected {rpt['pages']}")
            sample=''
            for pg in reader.pages[:min(15,pages)]:
              try: sample += '\n' + (pg.extract_text() or '')
              except Exception: pass
            compact=re.sub(r'\s+','',sample)
            missing=[]
            for term in rpt['terms']:
              if re.sub(r'\s+','',term) not in compact:
                missing.append(term)
            if missing:
              raise RuntimeError(f"identity terms missing in {dest.name}: {missing}")

            q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
            if q.returncode not in (0,3):
              raise RuntimeError(f"qpdf check failed for {dest.name}: {q.stderr[-1500:]}")

            prefix=PRE/f'{idx:02d}'
            subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(dest),str(prefix)],check=True,capture_output=True)
            png=Path(str(prefix)+'.png')
            with Image.open(png) as im:
              extrema=im.convert('L').getextrema()
              if im.width<500 or im.height<500 or extrema is None or extrema[0]>250:
                raise RuntimeError(f"rendered first page looks invalid for {dest.name}: size={im.size} extrema={extrema}")
              dims=[im.width,im.height]

            rec={
              'filename':dest.name,'broker':rpt['broker'],'title':rpt['title'],'date':rpt['date'],
              'infoCode':rpt['infoCode'],'source_url':rpt['url'],'pages':pages,'bytes':len(data),
              'sha256':hashlib.sha256(data).hexdigest(),'qpdf_status':q.returncode,
              'preview_dimensions':dims,
            }
            records.append(rec)
            print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          readme=[
            '徐工机械（000425.SZ）券商深度报告资料包',
            '整理日期：2026-09-27',
            '',
            '本压缩包直接包含三份券商原始PDF，不含下载器、网页摘要或跳转脚本。',
            '筛选标准：公司深度/首次覆盖/长篇公司研究；优先近年报告；三份均为不同券商。',
            '',
            '文件清单：',
          ]
          for i,r in enumerate(records,1):
            readme.extend([
              f"{i}. {r['broker']}：《{r['title']}》",
              f"   日期：{r['date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",
              f"   文件：{r['filename']}",
              f"   原始来源：{r['source_url']}",
              f"   SHA-256：{r['sha256']}",
              '',
            ])
          readme.extend([
            '完整性核验：PDF文件头、文件大小、实际页数、公司/机构/标题关键词、qpdf结构检查、首页渲染检查、SHA-256。',
            '资料仅供研究参考，不构成投资建议。',
          ])
          (OUT/'00_文件清单与核验说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['filename']}" for r in records)+'\n',encoding='utf-8')

          zip_path=Path('徐工机械_000425.SZ_券商深度报告_3份.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(OUT.iterdir()):
              z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path) as z:
            bad=z.testzip()
            if bad: raise RuntimeError(f'ZIP CRC failed at {bad}')
            names=z.namelist()
            pdfs=[n for n in names if n.lower().endswith('.pdf')]
            if len(pdfs)!=3: raise RuntimeError(f'ZIP must contain 3 PDFs, got {pdfs}')
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,hashlib.sha256(zip_path.read_bytes()).hexdigest())
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xcmg-000425-broker-reports-3pack-20260927
          path: 徐工机械_000425.SZ_券商深度报告_3份.zip
          retention-days: 7
          if-no-files-found: error
