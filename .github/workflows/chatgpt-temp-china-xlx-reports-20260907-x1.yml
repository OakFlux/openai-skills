name: Temporary China XLX report package

on:
  push:
    branches:
      - chatgpt-temp-china-xlx-reports-20260907-x1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate reports
        run: |
          python -m pip install --quiet 'httpx[http2]' beautifulsoup4 pypdf pymupdf
          sed -i 's/label="2026年中期业绩公告"; minp=8/label="2026年中期业绩公告"; minp=2/' tools/package_china_xlx_20260907.py
          sed -i 's/"盈利預告","盈利预告","PROFITALERT","BOARDMEETING"/"盈利預告","盈利预告","盈喜","PROFITALERT","BOARDMEETING"/' tools/package_china_xlx_20260907.py
          python tools/package_china_xlx_20260907.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: china-xlx-report-package-corrected
          path: package_files/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
