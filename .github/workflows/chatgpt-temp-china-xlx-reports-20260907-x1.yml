name: Temporary China XLX report package

on:
  push:
    branches:
      - chatgpt-temp-china-xlx-reports-20260907-x1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate reports
        run: |
          python -m pip install --quiet 'httpx[http2]' beautifulsoup4 pypdf pymupdf
          python tools/package_china_xlx_20260907.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: china-xlx-report-package
          path: package_files/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
