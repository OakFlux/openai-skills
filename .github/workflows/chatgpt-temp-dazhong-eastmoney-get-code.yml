name: chatgpt-temp-dazhong-eastmoney-get-code
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-eastmoney-get-code.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query stock-specific report records and download full PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf pymupdf pillow
          python <<'PY'
          import hashlib,json,re,time,zipfile
          from pathlib import Path
          import requests,pymupdf
          from PIL import Image,ImageStat
          from pypdf import PdfReader
          W=Path('dazhong_em_get_code');R=W/'大众公用_600635_01635_券商深度报告';P=R/'PDF';Q=W/'qa';P.mkdir(parents=True,exist_ok=True);Q.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/600635.html','Accept':'application/json,text/javascript,*/*'})
          logs=[];records=[];seen=set()
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          def parse(t):
            try:return json.loads(t)
            except:
              a=t.find('{');b=t.rfind('}')
              try:return json.loads(t[a:b+1]) if a>=0 and b>a else {}
              except:return {}
          for code in ['600635','01635','600635.SH','SH600635']:
            for endpoint in ['list','jg']:
              for q in range(0,8):
                for pg in range(1,20):
                  params={'cb':'jQuery1124','pageSize':100,'pageNo':pg,'qType':q,'code':code,
                    'beginTime':'2016-01-01','endTime':'2026-09-07','fields':'','orgCode':'','author':'',
                    'industryCode':'*','industry':'*','rating':'','ratingChange':'','rcode':'','_':int(time.time()*1000)}
                  r=s.get(f'https://reportapi.eastmoney.com/report/{endpoint}',params=params,timeout=60);o=parse(r.text);x=o.get('data') or []
                  if isinstance(x,dict):x=x.get('data') or x.get('list') or []
                  if not isinstance(x,list):x=[]
                  L(f'GET {endpoint} code={code} q={q} p={pg} HTTP={r.status_code} rows={len(x)} total={o.get("TotalPage")} hits={o.get("hits")}')
                  for rec in x:
                    info=rec.get('infoCode') or rec.get('INFO_CODE');txt=json.dumps(rec,ensure_ascii=False)
                    if info and info not in seen and ('大众公用' in txt or '600635' in txt or '01635' in txt):seen.add(info);records.append(rec);L('RECORD '+txt)
                  total=int(o.get('TotalPage') or 1)
                  if not x or pg>=total:break
          (W/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          targets=['创投增厚利润','四大板块多元发展','公用事业平稳发展','投资收益减少','华璨基金迈出第一步','积极寻找投资机遇','公用事业全面布局']
          def rank(a):
            title=str(a.get('title') or a.get('TITLE') or '');dt=str(a.get('publishDate') or a.get('PUBLISH_DATE') or '')
            return (max([100-i for i,t in enumerate(targets) if t in title] or [0]),dt)
          records.sort(key=rank,reverse=True)
          manifest=[]
          for a in records:
            if len(manifest)>=3:break
            title=a.get('title') or a.get('TITLE') or '大众公用研究报告'
            if not any(t in title for t in targets):continue
            info=a.get('infoCode') or a.get('INFO_CODE');org=a.get('orgSName') or a.get('orgName') or a.get('ORG_SNAME') or '券商';dt=str(a.get('publishDate') or a.get('PUBLISH_DATE') or '')[:10]
            data=None;url=None
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf',f'https://pdf.dfcfw.com/pdf/{info}_1.pdf']:
              rr=s.get(u,headers={'Referer':'https://data.eastmoney.com/'},timeout=180,allow_redirects=True);L(f'PDF {info} HTTP={rr.status_code} bytes={len(rr.content)} final={rr.url}')
              if rr.status_code==200 and rr.content.startswith(b'%PDF-') and len(rr.content)>80000:data=rr.content;url=rr.url;break
            if not data:continue
            fn=re.sub(r'[\\/:*?"<>|]+','_',f'{dt}_{org}_大众公用_{title}')[:190]+'.pdf';p=P/fn;p.write_bytes(data)
            pc=len(PdfReader(str(p),strict=False).pages);doc=pymupdf.open(str(p));text=''.join(doc[i].get_text() for i in range(min(3,doc.page_count)))
            if pc<3 or ('大众公用' not in text and '600635' not in text and '01635' not in text):p.unlink(missing_ok=True);doc.close();continue
            checks=[]
            for i,suf in [(0,'first'),(pc-1,'last')]:
              pix=doc[i].get_pixmap(matrix=pymupdf.Matrix(1.2,1.2),alpha=False);png=Q/(p.stem+'_'+suf+'.png');pix.save(str(png));sd=ImageStat.Stat(Image.open(png).convert('L').resize((64,64))).stddev[0];checks.append({'page':i+1,'stddev':round(sd,4)})
            doc.close();manifest.append({'filename':fn,'title':title,'institution':org,'date':dt,'pages':pc,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_url':url,'info_code':info,'render_checks':checks});L('VALID '+json.dumps(manifest[-1],ensure_ascii=False))
          if len(manifest)<2:raise RuntimeError(f'Only {len(manifest)} full PDFs from {len(records)} records')
          (R/'文件说明.txt').write_text('大众公用券商深度报告\n\n'+'\n'.join(f"{i}. {x['filename']} | {x['pages']}页" for i,x in enumerate(manifest,1))+'\n',encoding='utf-8');(R/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8');(R/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  PDF/{x['filename']}" for x in manifest)+'\n',encoding='utf-8')
          z=W/f'大众公用_600635_01635_券商深度报告_{len(manifest)}份.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for f in R.rglob('*'):
              if f.is_file():zz.write(f,arcname=str(R.name/f.relative_to(R)))
          with zipfile.ZipFile(z) as zz:assert not zz.testzip()
          meta={'filename':z.name,'size_bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'reports':manifest};(W/'meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8');print('FINAL '+json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Eastmoney-GET-Code-Reports
          path: |
            dazhong_em_get_code/大众公用_600635_01635_券商深度报告_*.zip
            dazhong_em_get_code/meta.json
            dazhong_em_get_code/records.json
            dazhong_em_get_code/run.log
          retention-days: 1
          compression-level: 0
