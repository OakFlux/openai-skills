name: Temporary targeted Hibor report probe

on:
  push:
    branches:
      - tmp/china-everbright-hibor-targeted-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,requests,urllib.parse
          from bs4 import BeautifulSoup
          u='https://www.hibor.com.cn/repinfodetail_5073681.html'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Referer':'https://www.hibor.com.cn/'})
          r=s.get(u,timeout=40); r.encoding=r.apparent_encoding or 'utf-8'; h=r.text
          soup=BeautifulSoup(h,'lxml')
          print('STATUS',r.status_code,len(h),flush=True)
          print('FORMS',flush=True)
          for tag in soup.find_all(['form','input','button','a','div','span','img']):
            attrs=dict(tag.attrs)
            text=tag.get_text(' ',strip=True)
            blob=(text+' '+json.dumps(attrs,ensure_ascii=False)).lower()
            if any(x in blob for x in ['下载报告','打开报告原文','点击浏览报告原文','5073633','5073681','202604222229109838','checkmd5','pdf','original','download','docid','did']):
              print('NODE',tag.name,'TEXT',repr(text[:180]),'ATTRS',json.dumps(attrs,ensure_ascii=False),flush=True)
          print('HIDDEN_INPUTS',flush=True)
          for tag in soup.find_all('input'):
            print(json.dumps(dict(tag.attrs),ensure_ascii=False),flush=True)
          print('ONCLICK_REGEX',flush=True)
          for m in re.finditer(r'onclick\s*=\s*(["\'])(.*?)\1',h,re.I|re.S):
            val=m.group(2)
            if any(x in val.lower() for x in ['down','pdf','doc','report','open','view','507']):
              print(repr(val),flush=True)
          print('DATA_ATTR_REGEX',flush=True)
          for m in re.finditer(r'\b(data-[\w-]+|id|name|value|href|src)\s*=\s*(["\'])(.*?)\2',h,re.I|re.S):
            key,val=m.group(1),m.group(3)
            if any(x in val.lower() for x in ['5073633','5073681','202604222229109838','checkmd5','download','pdf','report']):
              print(key,repr(val),flush=True)
          for tag in soup.find_all('script',src=True):
            jsu=urllib.parse.urljoin(u,tag['src'])
            if 'DocDetailNew' not in jsu:
              continue
            jr=s.get(jsu,timeout=40); jr.encoding=jr.apparent_encoding or 'utf-8'; js=jr.text
            print('JS_URL',jsu,'STATUS',jr.status_code,'LEN',len(js),flush=True)
            for patt in ['download','pdf','checkmd5','openoriginal','showoriginal','reportoriginal','docid','downloaddoc','original']:
              poss=[m.start() for m in re.finditer(patt,js,re.I)]
              print('PATT',patt,len(poss),flush=True)
              for pos in poss[:20]:
                print('SNIP',repr(js[max(0,pos-600):pos+1600]),flush=True)
          PY
