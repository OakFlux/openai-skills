name: Build final HJTime 603101 broker deep reports 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-broker-curated-final-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='603101'
          COMPANY='汇嘉时代'
          FULL='新疆汇嘉时代百货股份有限公司'
          REPORTS=[
              {
                  'doc_id':'5271496',
                  'pdf_path':'report/2026/02/12/5271496.pdf',
                  'broker':'广发证券',
                  'date':'2026-02-12',
                  'title':'新疆零售龙头行稳致远，胖改驱动业态提质',
                  'expected_pages':29,
              },
              {
                  'doc_id':'5261391',
                  'pdf_path':'report/2026/02/09/5261391.pdf',
                  'broker':'国盛证券',
                  'date':'2026-02-09',
                  'title':'首次覆盖报告：新疆零售龙头，创新转型价值重估',
                  'expected_pages':16,
              },
          ]
          HOSTS=[
              'https://dr.fxbaogao.com/',
              'https://public.fxbaogao.com/',
              'https://report.fxbaogao.com/',
              'https://oss-buy.hufangde.com/',
              'https://api.fxbaogao.com/',
          ]

          work=Path('work'); raw=work/'raw'; final=work/'final'; art=Path('artifact_out')
          for p in (raw,final,art): p.mkdir(parents=True,exist_ok=True)
          session=requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept':'application/pdf,*/*',
              'Origin':'https://www.fxbaogao.com',
              'Referer':'https://www.fxbaogao.com/',
          })

          def safe(value, limit=110):
              return re.sub(r'[\\/:*?"<>|]+','_',str(value)).strip(' ._')[:limit]

          records=[]; seen=set()
          for idx,spec in enumerate(REPORTS,1):
              data=None; source=None
              for host in HOSTS:
                  url=host+spec['pdf_path']
                  try:
                      r=session.get(url,timeout=(20,120),allow_redirects=True)
                      print('PDF_PROBE',spec['doc_id'],r.status_code,len(r.content),r.headers.get('content-type'),url,'FINAL',r.url,flush=True)
                      if r.status_code==200 and len(r.content)>100000 and r.content.startswith(b'%PDF-'):
                          data=r.content; source=str(r.url); break
                  except Exception as exc:
                      print('PDF_PROBE_ERR',spec['doc_id'],url,repr(exc),flush=True)
              if data is None:
                  raise RuntimeError('No valid public PDF for '+spec['doc_id'])
              tmp=raw/f'{idx:02d}_{spec["doc_id"]}.pdf'; tmp.write_bytes(data)
              reader=PdfReader(str(tmp),strict=False); pages=len(reader.pages)
              if pages<10:
                  raise RuntimeError(f'Unexpectedly short report {spec["doc_id"]}: {pages} pages')
              if abs(pages-spec['expected_pages'])>1:
                  raise RuntimeError(f'Page count mismatch {spec["doc_id"]}: expected {spec["expected_pages"]}, got {pages}')
              parts=[]
              indices=list(range(min(18,pages)))
              if pages>20: indices+=list(range(max(0,pages-4),pages))
              for pno in dict.fromkeys(indices):
                  try: parts.append(reader.pages[pno].extract_text() or '')
                  except Exception: pass
              sample='\n'.join(parts)
              if CODE not in sample and COMPANY not in sample and FULL not in sample:
                  raise RuntimeError('Company identity check failed: '+spec['title'])
              q=subprocess.run(['qpdf','--check',str(tmp)],capture_output=True,text=True)
              if q.returncode not in (0,3):
                  raise RuntimeError('qpdf failed: '+q.stderr[-1000:])
              sha=hashlib.sha256(data).hexdigest()
              if sha in seen: raise RuntimeError('Duplicate PDF')
              seen.add(sha)
              filename=f'{idx:02d}_{spec["date"]}_{safe(spec["broker"])}_{safe(spec["title"])}.pdf'
              shutil.copy2(tmp,final/filename)
              records.append({
                  'filename':filename,
                  'broker':spec['broker'],
                  'title':spec['title'],
                  'publish_date':spec['date'],
                  'pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'source_url':source,
                  'doc_id':spec['doc_id'],
                  'pdf_path':spec['pdf_path'],
              })

          readme=[
              f'{FULL}（{CODE}.SH，证券简称：{COMPANY}）券商深度报告合集',
              '整理日期：2026-10-12','',
              '筛选说明：公开渠道目前可直接获取并完整核验的长篇公司深度/首次覆盖报告共2份。未使用3—5页的业绩点评或公告简评凑数。','',
              '文件清单：'
          ]
          for i,r in enumerate(records,1):
              readme += [
                  f'{i}. {r["filename"]}',
                  f'   券商：{r["broker"]}',
                  f'   标题：{r["title"]}',
                  f'   日期：{r["publish_date"]}；页数：{r["pages"]}',
                  f'   来源：{r["source_url"]}',
                  f'   SHA-256：{r["sha256"]}',''
              ]
          readme.append('完整性检查：已验证PDF文件头、公司名称/证券代码、实际页数、qpdf结构、重复文件及SHA-256；ZIP已完成CRC测试。')
          (final/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (final/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (final/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')

          package='汇嘉时代_603101_券商深度报告_2份'
          zip_path=art/f'{package}.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(final.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              if sum(1 for n in z.namelist() if n.lower().endswith('.pdf'))!=2:
                  raise RuntimeError('PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_RECORDS',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha,flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hjtime-603101-broker-deep-reports-curated
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
