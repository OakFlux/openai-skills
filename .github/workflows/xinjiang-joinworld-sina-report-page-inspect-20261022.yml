name: Inspect Sina Xinjiang Joinworld report pages

on:
  push:
    paths:
      - '.github/workflows/xinjiang-joinworld-sina-report-page-inspect-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch and inspect report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import html
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://stock.finance.sina.com.cn/'})
          reports={
              '714521776750':'浙商2022全国领先的高纯铝龙头',
              '744220476107':'东方2023被低估的电极箔一体化龙头',
              '812305320242':'申万宏源2025铝电子材料一体化完备',
              '589107117155':'申万宏源2018首次覆盖',
              '681408374910':'中泰2021全球领先的高纯铝基新材料企业',
              '709475827542':'东亚前海2022首次覆盖',
          }
          for rid,label in reports.items():
              url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
              try:
                  r=s.get(url,timeout=(25,150),allow_redirects=True)
                  raw=r.content
                  for enc in ('gb18030','utf-8','gbk'):
                      try:
                          text=raw.decode(enc)
                          if '新疆众和' in text or '研究报告' in text:
                              break
                      except Exception:
                          continue
                  else:
                      text=raw.decode('utf-8','replace')
                  print('\n===== REPORT',rid,label,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(raw),'=====',flush=True)
                  soup=BeautifulSoup(text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
                  for tag in soup.find_all(['a','iframe','embed','object','script','link','source']):
                      label_text=' '.join(tag.get_text(' ',strip=True).split())[:180]
                      for attr in ('href','src','data','value','onclick'):
                          val=tag.get(attr)
                          if not val: continue
                          val=html.unescape(str(val)).replace('\\/','/')
                          absolute=urljoin(r.url,val) if not val.lower().startswith('javascript:') else val
                          combined=(label_text+' '+absolute).lower()
                          if any(k in combined for k in ('pdf','download','attach','attachment','file','doc','report','source','original','rptid')) or any(k in label_text for k in ('下载','原文','附件','完整')):
                              print('TAG',tag.name,attr,repr(label_text),absolute[:1800],flush=True)
                  for line in text.splitlines():
                      low=line.lower()
                      if any(k in low for k in ('.pdf','download','attach','attachment','file_url','pdf_url','report_url','source_url','rptid')):
                          print('LINE',' '.join(line.split())[:3000],flush=True)
                  for pattern in [r'https?://[^\"\'<>\s]+',r'[\"\']([^\"\']*(?:pdf|download|attach|attachment|file|report|source)[^\"\']*)[\"\']']:
                      seen=set()
                      for match in re.findall(pattern,text,re.I):
                          val=match if isinstance(match,str) else match[0]
                          val=html.unescape(val).replace('\\/','/')
                          if len(val)<5 or val in seen: continue
                          seen.add(val)
                          if any(k in val.lower() for k in ('pdf','download','attach','attachment','file','report','source')):
                              print('RAW',val[:1800],flush=True)
                  main=' | '.join(soup.get_text('\n',strip=True).splitlines())
                  print('TEXT_HEAD',main[:5000],flush=True)
              except Exception as exc:
                  print('ERROR',rid,label,repr(exc),flush=True)
          PY
