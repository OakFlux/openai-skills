name: Discover Haofan Bio report links

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-discovery-20261020.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect annual, prospectus and quarterly pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          pages={
            'ANNUAL':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/301393/page_type/ndbg.phtml',
            'PROSPECTUS':'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/301393.phtml',
            'Q1':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinYi/stockid/301393/page_type/yjdbg.phtml',
            'Q3':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/301393/page_type/sjdbg.phtml',
          }
          pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)

          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*;q=0.8'})
            with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read(); final=r.geturl()
            for enc in ('utf-8','gb18030','gbk'):
              try:
                return raw.decode(enc),final
              except UnicodeDecodeError:
                pass
            return raw.decode('utf-8','replace'),final

          for name,url in pages.items():
            print('\n===== '+name+' =====')
            text,final=fetch(url)
            print('FINAL',final,'BYTES',len(text))
            for m in pat.finditer(text):
              href=html.unescape(m.group(1).strip())
              label=re.sub(r'<[^>]+>','',m.group(2))
              label=html.unescape(re.sub(r'\s+','',label))
              full=urllib.parse.urljoin(final,href)
              if name=='ANNUAL' and ('年度报告' in label or '年年度报告' in label):
                print(label,'\t',full)
              elif name=='PROSPECTUS' and ('招股' in label or '发行' in label or '说明书' in label):
                print(label,'\t',full)
              elif name in ('Q1','Q3') and ('季度报告' in label or '季报' in label):
                print(label,'\t',full)
          PY
