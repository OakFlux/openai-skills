name: Find Hegang reports by date windows

on:
  push:
    branches: [tmp-hegang-000709-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hegang-broker-date-windows-20261016.yml']

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query report index around known dates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse
          windows=[
            ('2025-04-12','2025-04-17'),
            ('2012-08-28','2012-09-03'),
            ('2012-05-06','2012-05-12'),
            ('2012-04-24','2012-04-30'),
            ('2011-11-08','2011-11-14'),
            ('2010-01-20','2010-02-05'),
          ]
          for begin,end in windows:
            print('\n===== WINDOW',begin,end,'=====')
            for page in range(1,8):
              params={
                'cb':'datatable1','industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':''
              }
              url='https://reportapi.eastmoney.com/report/list?'+urllib.parse.urlencode(params,safe='*')
              out=subprocess.check_output([
                'curl','--http1.1','-fsSL','--retry','4','--retry-all-errors','-A','Mozilla/5.0',
                '-e','https://data.eastmoney.com/report/',url
              ],text=True)
              data=json.loads(re.sub(r'^datatable\d*\(|\)$','',out))
              rows=data.get('data') or []
              if page==1: print('HITS',data.get('hits'),'SIZE',data.get('size'))
              for x in rows:
                code=str(x.get('stockCode') or '')
                name=str(x.get('stockName') or '')
                title=str(x.get('title') or '')
                if code=='000709' or '河钢股份' in name or '河北钢铁' in name or '河钢股份' in title or '河北钢铁' in title:
                  print('\t'.join([
                    str(x.get('publishDate',''))[:10],
                    str(x.get('orgSName') or x.get('orgName') or ''),
                    str(x.get('attachPages') or ''),
                    str(x.get('infoCode') or ''),
                    code,name,title,
                  ]))
              if not rows or len(rows)<500: break
          PY
