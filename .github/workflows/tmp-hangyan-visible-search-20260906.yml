name: Temporary Hangyan visible Aixin search
on:
  push:
    branches:
      - tmp-hangyan-visible-search-20260906
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Chromium
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Search visible catalogue input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          queries=[
              '爱芯元智',
              '乘端侧及边缘AI浪潮',
              '踏智驾及边缘AI之浪',
              'AI推理芯片平台型公司',
              'AI终端平台公司',
          ]
          results={}
          all_network=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled'])
              context=browser.new_context(viewport={'width':1440,'height':1000},locale='zh-CN',timezone_id='Asia/Shanghai',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
              context.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined});")
              for idx,query in enumerate(queries):
                  page=context.new_page()
                  network=[]
                  page.on('response',lambda response,network=network: network.append({'url':response.url,'status':response.status,'type':response.request.resource_type,'content_type':response.headers.get('content-type','')}))
                  page.goto('https://www.hangyan.co/reports',wait_until='domcontentloaded',timeout=120000)
                  page.wait_for_timeout(7000)
                  visible=page.locator('input:visible')
                  print('\nQUERY',query,'VISIBLE_INPUTS',visible.count(),flush=True)
                  for j in range(visible.count()):
                      el=visible.nth(j)
                      print('INPUT',j,el.get_attribute('id'),el.get_attribute('class'),el.get_attribute('placeholder'),flush=True)
                  if not visible.count():
                      raise RuntimeError('No visible search input')
                  target=visible.last
                  target.click(timeout=20000)
                  target.fill(query,timeout=20000)
                  page.wait_for_timeout(5000)
                  # Capture autocomplete panel before pressing Enter.
                  anchors_before=page.locator('a:visible').evaluate_all("els => els.map(e=>({text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,800),href:e.href||'',title:e.title||'',cls:e.className||''})).filter(x=>x.href)")
                  options=page.locator('[role=option]:visible').evaluate_all("els => els.map(e=>({text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,800),html:e.outerHTML.slice(0,3000)}))")
                  print('OPTIONS',len(options),'ANCHORS_BEFORE',len(anchors_before),flush=True)
                  for item in anchors_before:
                      joined=(item.get('text') or '')+' '+(item.get('title') or '')
                      if '/reports/' in item.get('href','') or '爱芯元智' in joined:
                          print('SUGGESTION_LINK',json.dumps(item,ensure_ascii=False),flush=True)
                  for item in options:
                      print('OPTION',json.dumps(item,ensure_ascii=False),flush=True)
                  try:
                      target.press('Enter')
                      page.wait_for_timeout(8000)
                  except Exception as exc:
                      print('ENTER_ERROR',repr(exc),flush=True)
                  anchors_after=page.locator('a:visible').evaluate_all("els => els.map(e=>({text:(e.innerText||e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,800),href:e.href||'',title:e.title||'',cls:e.className||''})).filter(x=>x.href)")
                  matches=[]
                  for item in anchors_before+anchors_after:
                      joined=(item.get('text') or '')+' '+(item.get('title') or '')+' '+(item.get('href') or '')
                      if '/reports/' in item.get('href','') and ('爱芯元智' in joined or query[:5] in joined):
                          if item not in matches: matches.append(item)
                  body=page.locator('body').inner_text(timeout=30000)
                  Path(f'output/{idx}_body.txt').write_text(body,encoding='utf-8')
                  Path(f'output/{idx}_before.json').write_text(json.dumps(anchors_before,ensure_ascii=False,indent=2),encoding='utf-8')
                  Path(f'output/{idx}_after.json').write_text(json.dumps(anchors_after,ensure_ascii=False,indent=2),encoding='utf-8')
                  Path(f'output/{idx}_options.json').write_text(json.dumps(options,ensure_ascii=False,indent=2),encoding='utf-8')
                  Path(f'output/{idx}_network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
                  page.screenshot(path=f'output/{idx}.png',full_page=True)
                  results[query]={'url':page.url,'title':page.title(),'matches':matches,'body_head':body[:5000]}
                  print('FINAL_URL',page.url,'MATCHES',len(matches),flush=True)
                  for match in matches: print('MATCH',json.dumps(match,ensure_ascii=False),flush=True)
                  for rec in network:
                      low=rec['url'].lower()
                      if any(key in low for key in ['algolia','search','query','reports']): print('NETWORK',json.dumps(rec,ensure_ascii=False),flush=True)
                  all_network.extend(network)
                  page.close()
              browser.close()
          Path('output/summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-visible-search-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
