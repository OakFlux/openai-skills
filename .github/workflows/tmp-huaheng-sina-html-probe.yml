name: Temporary Huaheng Sina prospectus HTML probe

on:
  push:
    branches:
      - tmp/huaheng-biotech-filings-20260830
    paths:
      - .github/workflows/tmp-huaheng-sina-html-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          urls=[
            'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7052638&stockid=688639',
            'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?id=7052638&stockid=688639',
          ]
          for u in urls:
            try:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'},timeout=90)
              print('FETCH',r.status_code,len(r.content),r.encoding,r.apparent_encoding,r.url)
              r.encoding=r.apparent_encoding or 'utf-8'
              html=r.text
              print('CONTAINS', '首次公开发行股票并在科创板上市' in html, '1-1-411' in html, html.count('安徽华恒生物科技股份有限公司'))
              soup=BeautifulSoup(html,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
              for selector in ['#content','div#content','div.content','div.tagmain','div#tagmain','div#content_wrap','div#container','pre','body']:
                nodes=soup.select(selector)
                if nodes:
                  text=nodes[0].get_text('\n',strip=True)
                  print('SELECTOR',selector,'NODES',len(nodes),'TEXTLEN',len(text),'START',repr(text[:500]))
              print('BODYTEXT',len(soup.get_text('\n',strip=True)))
              for tag in soup.find_all(['div','td','pre']):
                text=tag.get_text('',strip=True)
                if '安徽华恒生物科技股份有限公司' in text and len(text)>100000:
                  print('LARGE_NODE',tag.name,tag.get('id'),tag.get('class'),len(text),repr(text[:300]))
                  break
            except Exception as e:
              print('ERROR',repr(e))
          PY
