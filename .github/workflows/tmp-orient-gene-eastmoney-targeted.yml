name: Temporary Targeted Eastmoney Search for Orient Gene

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-eastmoney-targeted.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query one-day report windows with retries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet curl_cffi
          python - <<'PY'
          import json,time
          from pathlib import Path
          from curl_cffi import requests

          dates=['2020-01-13','2020-09-21','2020-09-22','2020-11-09','2021-08-05','2022-03-14']
          needles=['东方生物','东方基因','POCT龙头呼之欲出','新生代国际化IVD龙头','深耕POCT国际市场','深耕POCT领域','深耕国际市场的POCT全产业链企业']
          all_rows=[];matches=[];diag=[]
          headers={'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'}
          for date in dates:
            for page in range(1,8):
              params={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':date,'endTime':date,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','author':'','code':'','rcode':'','_':str(int(time.time()*1000))}
              response=None;error=''
              for attempt in range(1,5):
                try:
                  response=requests.get('https://reportapi.eastmoney.com/report/list',params=params,headers=headers,impersonate='chrome',timeout=60)
                  if response.status_code==200:break
                  error=f'status={response.status_code}'
                except Exception as e:error=repr(e)
                time.sleep(attempt)
              if response is None or response.status_code!=200:
                diag.append({'date':date,'page':page,'error':error});break
              try:payload=response.json()
              except Exception as e:
                diag.append({'date':date,'page':page,'status':response.status_code,'bytes':len(response.content),'error':'json '+repr(e),'head':response.text[:500]});break
              rows=payload.get('data') or []
              diag.append({'date':date,'page':page,'status':response.status_code,'rows':len(rows),'hits':payload.get('hits'),'size':payload.get('size')})
              all_rows.extend(rows)
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if any(n in blob for n in needles):
                  matches.append(row)
              if len(rows)<500:break
          # Deduplicate by infoCode/title/date.
          dedup=[];seen=set()
          for row in matches:
            key=(row.get('infoCode'),row.get('title'),row.get('publishDate'))
            if key not in seen:seen.add(key);dedup.append(row)
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_eastmoney_targeted.json').write_text(json.dumps({'matches':dedup,'diagnostics':diag},ensure_ascii=False,indent=2),encoding='utf-8')
          slim=[]
          for x in dedup:
            slim.append({k:x.get(k) for k in ['infoCode','publishDate','orgSName','orgName','title','researcher','ratingName','attachPages','attachSize','encodeUrl','stockName','stockCode'] if k in x})
          print('MATCHES='+json.dumps(slim,ensure_ascii=False),flush=True)
          print('DIAGNOSTICS='+json.dumps(diag,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-eastmoney-targeted
          path: out/orient_gene_eastmoney_targeted.json
          if-no-files-found: error
          retention-days: 3
