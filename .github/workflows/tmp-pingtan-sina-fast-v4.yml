name: Temporary Pingtan Development Sina fast inspect v4

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-sina-fast-v4.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect exact URLs
        run: |
          mkdir -p out
          python - <<'PY'
          import html,json,re,time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          O=Path('out'); s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          ids=['559561704577','525439760486','499793777917','494407883475','472329343360']
          rec=[]; links=[]
          for rid in ids:
            urls=[
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',
              f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/url',
              f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',
              f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/search/rptid/{rid}/url',
              f'http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',
              f'http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/url',
            ]
            for j,u in enumerate(urls):
              try:
                r=s.get(u,timeout=30,allow_redirects=False,headers={'Referer':urls[0]})
                enc=r.apparent_encoding or r.encoding or 'utf-8'; text=r.content.decode(enc,'replace') if not r.content.lstrip().startswith(b'%PDF') else '%PDF'
                item={'rid':rid,'url':u,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'location':r.headers.get('Location'),'encoding':enc,'prefix':text[:5000]}
                rec.append(item); print('RESP',rid,j,r.status_code,len(r.content),r.headers.get('content-type'),r.headers.get('Location'))
                if text!='%PDF':
                  (O/f'{rid}_{j}.html').write_text(text,encoding='utf-8',errors='ignore')
                  raw=html.unescape(text).replace('\\/','/')
                  soup=BeautifulSoup(text,'html.parser')
                  for a in soup.find_all(True):
                    for attr in ['href','src','data','value','action']:
                      v=a.get(attr)
                      if isinstance(v,str) and v.strip():
                        v=urljoin(u,v.strip())
                        if any(k in v.lower() for k in ['pdf','download','attach','file','url','report','rpt']):links.append({'rid':rid,'from':u,'url':v,'text':' '.join(a.stripped_strings)[:300]})
                  for v in re.findall(r'https?://[^\s"\'<>]+',raw,re.I):
                    if any(k in v.lower() for k in ['pdf','download','attach','file','report','rpt']):links.append({'rid':rid,'from':u,'url':v.rstrip('),;'),'text':'regex'})
              except Exception as e:
                rec.append({'rid':rid,'url':u,'error':repr(e)}); print('ERR',rid,u,repr(e))
              time.sleep(.2)
          # dedupe links
          out=[]; seen=set()
          for x in links:
            k=x['url']
            if k in seen:continue
            seen.add(k);out.append(x);print('LINK',x['rid'],x['text'],x['url'])
          (O/'responses.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'links.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DONE',len(rec),len(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-sina-fast-v4
          path: out/
          retention-days: 3
