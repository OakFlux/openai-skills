name: Temporary Kaisheng Eastmoney broader search

on:
  push:
    branches:
      - tmp-kaisheng-eastmoney-search2-20260905

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, time
          import urllib.parse, urllib.request
          from pathlib import Path

          BASE='https://reportapi.eastmoney.com/report/list'
          HEADERS={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'}

          def fetch(params):
              url=BASE+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=HEADERS)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode('utf-8','replace'))

          hits=[]
          base_params={
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
              'fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'
          }

          for code in ['600876','600876.SH','SH600876','01108','1108','HK01108','HK1108']:
              params={**base_params,'beginTime':'2020-01-01','endTime':'2026-12-31','pageNo':'1','code':code}
              try:
                  obj=fetch(params); rows=obj.get('data') or []
                  print('CODE',code,'hits',obj.get('hits'),'rows',len(rows),flush=True)
                  for row in rows:
                      title=(row.get('title') or '')
                      stock=(row.get('stockName') or '')
                      if '凯盛' in stock or '洛阳玻璃' in stock or '凯盛' in title or '洛阳玻璃' in title:
                          rec={'source':'code:'+code,**row}; hits.append(rec)
                          print('MATCH',json.dumps({k:row.get(k) for k in ['publishDate','orgSName','title','infoCode','attachPages','attachSize','stockName','stockCode']},ensure_ascii=False),flush=True)
              except Exception as e: print('CODE_ERROR',code,repr(e),flush=True)

          windows=[
              ('2024-05-25','2024-06-05'),
              ('2023-07-01','2023-08-10'),
              ('2022-06-25','2022-07-05'),
              ('2022-03-15','2022-04-10'),
          ]
          for begin,end in windows:
              for page in range(1,21):
                  params={**base_params,'beginTime':begin,'endTime':end,'pageNo':str(page),'pageNum':str(page),'pageNumber':str(page),'code':''}
                  try:
                      obj=fetch(params); rows=obj.get('data') or []
                  except Exception as e:
                      print('WINDOW_ERROR',begin,end,page,repr(e),flush=True); break
                  if page==1: print('WINDOW',begin,end,'hits',obj.get('hits'),'totalpage',obj.get('TotalPage'),flush=True)
                  if not rows: break
                  for row in rows:
                      title=row.get('title') or ''; stock=row.get('stockName') or ''
                      blob=(title+' '+stock).lower()
                      if any(term in blob for term in ['凯盛新能','洛阳玻璃','供需边际改善','薄膜电池打造新增长极','光伏玻璃新力量','转型新能源材料平台','聚焦光伏玻璃领域']):
                          rec={'source':f'window:{begin}:{end}:p{page}',**row}; hits.append(rec)
                          print('MATCH',json.dumps({k:row.get(k) for k in ['publishDate','orgSName','title','infoCode','attachPages','attachSize','stockName','stockCode']},ensure_ascii=False),flush=True)
                  total=int(obj.get('TotalPage') or 0)
                  if total and page>=total: break
                  time.sleep(.15)

          unique={}
          for row in hits:
              unique[row.get('infoCode') or json.dumps(row,sort_keys=True,ensure_ascii=False)]=row
          Path('output/matches.json').write_text(json.dumps(list(unique.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_MATCHES',len(unique),flush=True)
          PY
      - name: Upload matches
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-eastmoney-broader-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
