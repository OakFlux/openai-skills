name: Inspect Eastmoney single-stock report API contract

on:
  push:
    paths:
      - '.github/workflows/shuangxiang-eastmoney-js-inspect-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch JavaScript and probe API variants
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          from pathlib import Path
          import json, re, requests, traceback
          out=Path('eastmoney_js_inspect'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/002395.html'})
          url='https://data.eastmoney.com/newstatic/js/report/singlestock.js'
          try:
              r=s.get(url,timeout=90); r.raise_for_status(); out.joinpath('singlestock.js').write_bytes(r.content)
          except Exception as e:
              out.joinpath('singlestock_error.txt').write_text(traceback.format_exc(),encoding='utf-8')
          variants=[]
          # Parameter variants inferred from current Eastmoney client contracts.
          for qtype in ['0','1','2']:
            for codekey in ['code','stockCode','stockcode','securityCode']:
              params={'pageSize':'100','beginTime':'2009-01-01','endTime':'2026-10-14','pageNo':'1','qType':qtype,codekey:'002395'}
              variants.append((f'{qtype}_{codekey}',params))
          # Try URL route/code and market variants.
          for val in ['002395','SZ002395','0.002395']:
            variants.append((f'code_{val.replace(".","_")}',{'pageSize':'100','beginTime':'2009-01-01','endTime':'2026-10-14','pageNo':'1','qType':'0','code':val}))
          for name,params in variants:
            try:
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
              out.joinpath(f'{name}.body').write_bytes(r.content)
              out.joinpath(f'{name}.meta.json').write_text(json.dumps({'status':r.status_code,'url':r.url,'headers':dict(r.headers)},ensure_ascii=False,indent=2),encoding='utf-8')
            except Exception:
              out.joinpath(f'{name}.error.txt').write_text(traceback.format_exc(),encoding='utf-8')
          PY
      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: shuangxiang-eastmoney-js-inspect-20261014
          path: eastmoney_js_inspect
          retention-days: 7