name: South Precision Sina Research Search Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_sina_search_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Inspect and query Sina report search
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          base='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(base,timeout=60); r.encoding=r.apparent_encoding or 'gb18030'
          print('BASE',r.status_code,len(r.content),r.url,r.encoding)
          soup=BeautifulSoup(r.text,'html.parser')
          for form in soup.find_all('form'):
            print('FORM',json.dumps({'action':urljoin(r.url,form.get('action') or ''),'method':form.get('method'),'html':str(form)[:12000]},ensure_ascii=False))
          for tag in soup.find_all(['input','select','option']):
            if tag.name=='input': print('INPUT',tag.get('name'),tag.get('type'),tag.get('value'))
            elif tag.name=='select': print('SELECT',tag.get('name'),tag.get('id'))
          for i,line in enumerate(r.text.splitlines(),1):
            if re.search(r'<form|<input|<select|股票|标题|发布日期|search|keyword|symbol|stock',line,re.I):
              print('LINE',i,line[:4000])

          # Trial query variants inferred from common Sina report parameters.
          trials=[
            {'t1':'2','symbol':'002553'},
            {'t1':'2','stockcode':'002553'},
            {'t1':'2','code':'002553'},
            {'t1':'2','searchkey':'002553'},
            {'t1':'5','title':'新能源汽车注入新活力'},
            {'t1':'5','keyword':'新能源汽车注入新活力'},
            {'t1':'5','searchkey':'新能源汽车注入新活力'},
            {'t1':'4','analysts':'周旭辉'},
          ]
          for params in trials:
            rr=s.get(base,params=params,timeout=60); rr.encoding=rr.apparent_encoding or 'gb18030'
            text=rr.text
            links=[]
            ss=BeautifulSoup(text,'html.parser')
            for a in ss.find_all('a',href=True):
              href=urljoin(rr.url,a['href']); title=' '.join(a.get_text(' ',strip=True).split())
              if 'vReport_Show' in href or '南方精工' in title or '南方轴承' in title or '新能源汽车注入' in title or '芯片研发取进展' in title:
                links.append({'text':title,'url':href})
            print('\nTRIAL',params,'STATUS',rr.status_code,'LEN',len(rr.content),'URL',rr.url)
            print('LINKS',json.dumps(links,ensure_ascii=False,indent=2))
            for i,line in enumerate(text.splitlines(),1):
              if re.search(r'南方精工|南方轴承|新能源汽车注入|芯片研发取进展|002553|822148019858|rptid',line,re.I):
                print('HITLINE',i,line[:5000])
          PY
