name: Probe archival proxies for legacy Haofan reports

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-proxy-probe-20261020.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe Jina and Wayback
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import requests, urllib.parse, json
          original='http://www.neeq.com.cn/disclosure/2017/2017-05-09/1494315036_015624.pdf'
          urls=[
            'https://r.jina.ai/http://www.neeq.com.cn/disclosure/2017/2017-05-09/1494315036_015624.pdf',
            'https://r.jina.ai/https://www.neeq.com.cn/disclosure/2017/2017-05-09/1494315036_015624.pdf',
            'https://web.archive.org/cdx/search/cdx?url='+urllib.parse.quote(original,safe='')+'&output=json&filter=statuscode:200&collapse=digest',
            'https://arquivo.pt/wayback/cdx?url='+urllib.parse.quote(original,safe='')+'&output=json',
            'https://arquivo.pt/textsearch?versionHistory='+urllib.parse.quote(original,safe=''),
          ]
          h={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          for u in urls:
            print('\n====',u,'====')
            try:
              r=requests.get(u,headers=h,timeout=180,allow_redirects=True)
              print('STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'),'URL',r.url,'PREFIX',r.content[:80])
              print(r.text[:3000] if 'text' in (r.headers.get('content-type') or '') or len(r.content)<10000 else '')
            except Exception as e:
              print('ERR',repr(e))
          PY
