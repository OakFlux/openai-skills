name: Discover Loongson official disclosures

on:
  push:
    paths:
      - '.github/workflows/loongson-disclosure-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query SSE official disclosure APIs
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, re, traceback
          from pathlib import Path
          import requests

          out=Path('loongson_discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=688047',
            'Accept':'application/json,text/javascript,*/*;q=0.01',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          api='https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          base={
            'isPagination':'true',
            'productId':'688047',
            'keyWord':'',
            'securityType':'0101,120100,020100,020200,120200',
            'reportType':'ALL',
            'beginDate':'2020-01-01',
            'endDate':'2026-10-15',
            'pageHelp.pageSize':'200',
            'pageHelp.pageNo':'1',
            'pageHelp.beginPage':'1',
            'pageHelp.endPage':'5',
            'pageHelp.cacheSize':'1',
          }
          variants=[]
          for report_type2 in ['DQBG','LSGG','ALL','']:
            p=base.copy()
            if report_type2: p['reportType2']=report_type2
            variants.append((f'reportType2_{report_type2 or "none"}',p))
          for keyword in ['招股说明书','年度报告','季度报告','第一季度报告','第三季度报告']:
            p=base.copy(); p['keyWord']=keyword; p.pop('reportType',None)
            variants.append((f'keyword_{keyword}',p))

          all_rows=[]
          for name,params in variants:
            try:
              r=s.get(api,params=params,timeout=90)
              meta={'name':name,'status':r.status_code,'url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content)}
              out.joinpath(name+'.meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
              out.joinpath(name+'.body').write_bytes(r.content)
              print('FETCH',json.dumps(meta,ensure_ascii=False),flush=True)
              text=r.text
              try: data=r.json()
              except Exception:
                m=re.search(r'^[^(]*\((.*)\)\s*;?\s*$',text,re.S)
                data=json.loads(m.group(1)) if m else None
              if isinstance(data,dict):
                rows=data.get('result') or data.get('data') or data.get('pageHelp',{}).get('data') or []
                if isinstance(rows,dict): rows=rows.get('data') or rows.get('list') or []
                print('ROWS',name,len(rows),flush=True)
                for row in rows:
                  if isinstance(row,dict):
                    row2=dict(row); row2['_variant']=name; all_rows.append(row2)
            except Exception as e:
              print('ERROR',name,repr(e),flush=True)
              out.joinpath(name+'.error.txt').write_text(traceback.format_exc(),encoding='utf-8')

          # De-duplicate by URL/title/date and print likely target documents.
          unique=[]; seen=set()
          for row in all_rows:
            title=str(row.get('TITLE') or row.get('title') or row.get('bulletinTitle') or row.get('BULLETIN_TITLE') or '')
            url=str(row.get('URL') or row.get('url') or row.get('bulletinUrl') or row.get('BULLETIN_URL') or '')
            date=str(row.get('SSEDATE') or row.get('sseDate') or row.get('date') or row.get('publishDate') or '')
            key=(title,url,date)
            if key in seen: continue
            seen.add(key); unique.append(row)
          out.joinpath('all_unique_rows.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_TOTAL',len(unique),flush=True)
          pats=['年度报告','招股说明书','季度报告','第一季度报告','第三季度报告']
          for row in unique:
            title=str(row.get('TITLE') or row.get('title') or row.get('bulletinTitle') or row.get('BULLETIN_TITLE') or '')
            if any(p in title for p in pats):
              print('TARGET',json.dumps(row,ensure_ascii=False),flush=True)
          PY
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: loongson-disclosure-discovery-20261015
          path: loongson_discovery
          retention-days: 7
          compression-level: 6