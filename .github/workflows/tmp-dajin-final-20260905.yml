name: Build final Dajin broker report package

on:
  push:
    branches:
      - tmp-dajin-final-20260905

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download, verify, and package reports
        run: |
          python -m pip install --quiet requests pypdf pillow
          mkdir -p deliverable/package
          cat > /tmp/build_dajin_final.py <<'PY'
          import hashlib, io, json, re, time, zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT=Path('deliverable')
          WORK=OUT/'package'
          WORK.mkdir(parents=True,exist_ok=True)
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def fetch(url,referer=None,attempts=6):
              last=None
              for i in range(attempts):
                  try:
                      h={'Referer':referer} if referer else None
                      r=s.get(url,headers=h,timeout=(20,100),allow_redirects=True)
                      if r.status_code==200: return r
                      last=RuntimeError(f'HTTP {r.status_code}')
                  except Exception as e: last=e
                  time.sleep(min(2**i,10))
              raise RuntimeError(f'fetch failed {url}: {last}')

          def sha(data): return hashlib.sha256(data).hexdigest()

          def validate_pdf_bytes(data,min_pages):
              if not data.lstrip().startswith(b'%PDF') or len(data)<30000:
                  raise RuntimeError(f'invalid PDF bytes: {len(data)}')
              tmp=WORK/'_validate.pdf'; tmp.write_bytes(data)
              pages=len(PdfReader(str(tmp),strict=False).pages)
              tmp.unlink()
              if pages<min_pages: raise RuntimeError(f'only {pages} pages')
              return pages

          manifest=[]
          reports=[
              {
                'source':'https://data.eastmoney.com/report/info/AP202605281822933159.html',
                'pdf':'https://pdf.dfcfw.com/pdf/H3_AP202605281822933159_1.pdf',
                'broker':'国金证券','date':'2026-05-27','title':'一体化布局有序落地，全产业链服务出海加速',
                'file':'2026-05-27_国金证券_一体化布局有序落地，全产业链服务出海加速_完整原始PDF.pdf','min_pages':10,
              },
              {
                'source':'https://data.eastmoney.com/report/info/AP202509181745845865.html',
                'pdf':'https://pdf.dfcfw.com/pdf/H3_AP202509181745845865_1.pdf',
                'broker':'中航证券','date':'2025-09-18','title':'“两海”战略先行者，海外潜能快速释放',
                'file':'2025-09-18_中航证券_两海战略先行者，海外潜能快速释放_完整原始PDF.pdf','min_pages':5,
              },
          ]
          for x in reports:
              source_html=fetch(x['source']).text
              if '大金重工' not in source_html or '002487' not in source_html:
                  raise RuntimeError(f"unexpected source page: {x['broker']}")
              data=fetch(x['pdf'],x['source']).content
              pages=validate_pdf_bytes(data,x['min_pages'])
              path=WORK/x['file']; path.write_bytes(data)
              manifest.append({'company':'大金重工股份有限公司','stock_code':'002487.SZ','broker':x['broker'],'report_date':x['date'],'title':x['title'],'file':x['file'],'pages':pages,'size_bytes':len(data),'sha256':sha(data),'source_page':x['source'],'source_pdf':x['pdf'],'access_type':'公开研报页面对应的完整原始PDF'})
              print('FULL_OK',x['broker'],pages,len(data),sha(data))

          detail='https://www.sdyanbao.com/detail/869917'
          html=fetch(detail).text
          if not all(k in html for k in ['大金重工','002487','国盛证券']):
              raise RuntimeError('unexpected 国盛证券 detail page')
          m=re.search(r'page_url:"([^"]+)"',html)
          if not m: raise RuntimeError('page_url missing')
          base=m.group(1).replace('\\u002F','/').replace('\\/','/')
          cm=re.search(r'page_count:(\d+)',html)
          full_pages=int(cm.group(1)) if cm else None
          count=min(10,full_pages or 10)
          images=[]
          for i in range(count):
              r=fetch(f'{base}/{i}.png',detail)
              im=Image.open(io.BytesIO(r.content)); im.load()
              if im.width<500 or im.height<700: raise RuntimeError(f'bad preview image {i+1}: {im.size}')
              rgba=im.convert('RGBA'); bg=Image.new('RGB',rgba.size,'white'); bg.paste(rgba,mask=rgba.getchannel('A'))
              im.close(); rgba.close(); images.append(bg)
          name='2025-04-11_国盛证券_海风塔桩出海龙头，迎来量利齐升时刻_公开预览10页.pdf'
          p=WORK/name
          images[0].save(p,'PDF',save_all=True,append_images=images[1:],resolution=150.0,quality=95,subsampling=0)
          for im in images: im.close()
          pdata=p.read_bytes(); pcount=len(PdfReader(str(p),strict=False).pages)
          if pcount!=count: raise RuntimeError(f'preview page mismatch {pcount}/{count}')
          manifest.append({'company':'大金重工股份有限公司','stock_code':'002487.SZ','broker':'国盛证券','report_date':'2025-04-11','title':'海风塔&桩出海龙头，迎来量利齐升时刻','file':name,'reported_full_length_pages':full_pages,'pages_included':pcount,'size_bytes':len(pdata),'sha256':sha(pdata),'source_page':detail,'access_type':'来源页面公开展示的前10页预览；未收录需下载权限的其余页面'})
          print('PREVIEW_OK',pcount,full_pages,len(pdata),sha(pdata))

          manifest_path=WORK/'manifest.json'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          readme=['大金重工（002487.SZ）券商深度报告资料包','','共3份：2份完整原始PDF，1份公开预览10页。','完整报告与预览已在文件名及manifest.json中明确标注。','']
          for i,x in enumerate(manifest,1):
              pages=x.get('pages',x.get('pages_included'))
              readme.append(f"{i}. {x['broker']}｜{x['report_date']}｜{x['title']}｜收录{pages}页｜{x['access_type']}")
          readme += ['', '来源、页数、大小和校验值见manifest.json及SHA256SUMS.txt。']
          (WORK/'README_来源说明.txt').write_text('\n'.join(readme)+'\n',encoding='utf-8')
          sums=[f"{x['sha256']}  {x['file']}" for x in manifest]
          sums.append(f"{sha(manifest_path.read_bytes())}  manifest.json")
          (WORK/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')

          zpath=OUT/'dajin_broker_reports.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(WORK.iterdir(),key=lambda q:q.name): z.write(f,f.name)
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad: raise RuntimeError(f'bad ZIP member: {bad}')
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=3: raise RuntimeError(f'expected 3 PDFs, got {len(pdfs)}')
          print('PACKAGE_OK',zpath.stat().st_size,sha(zpath.read_bytes()))
          PY
          python /tmp/build_dajin_final.py

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dajin-broker-reports-final
          path: deliverable/dajin_broker_reports.zip
          retention-days: 1
          compression-level: 0
