name: Rerun Mingguan broker deep package v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mingguan-688560-broker-deep-package-rerun-20261105-v2.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Run patched package script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import textwrap

          source = Path('.github/workflows/mingguan-688560-broker-deep-package-20261105-v1.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          script = textwrap.dedent(text[start:end])
          script = script.replace("'minimum_pages': 18,", "'minimum_pages': 15,")
          Path('/tmp/mingguan_broker_package.py').write_text(script, encoding='utf-8')
          subprocess.run([sys.executable, '/tmp/mingguan_broker_package.py'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mingguan-688560-broker-deep-reports-20261105-v2
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
