name: Discover Shidai Wanheng broker research 20261004

on:
  push:
    paths:
      - '.github/workflows/shidai-wanheng-broker-discovery-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Query report databases and search pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          terms = ['时代万恒', '辽宁时代万恒', '600241', '九夷能源', '九夷锂能']
          s = requests.Session(); s.trust_env = False
          retry = Retry(total=4, connect=4, read=4, status=4, backoff_factor=0.8,
                        status_forcelist=[429,500,502,503,504], allowed_methods=['GET','POST'], raise_on_status=False)
          s.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept-Encoding':'identity',
          })

          print('=== EASTMONEY REPORT API ===', flush=True)
          for code in ['600241','sh600241']:
              for qtype in ['0','1']:
                  params={
                      'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':'1990-01-01','endTime':'2030-12-31','pageNo':'1','fields':'','qType':qtype,
                      'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
                  }
                  try:
                      r=s.get('https://reportapi.eastmoney.com/report/list',params=params,headers={'Referer':f'https://data.eastmoney.com/report/stock.jshtml?stockcode={code}'},timeout=(30,120))
                      print('EM_HTTP',code,qtype,r.status_code,len(r.content),r.url,flush=True)
                      if r.status_code==200:
                          d=r.json(); rows=d.get('data') or d.get('Data') or d.get('list') or []
                          if isinstance(rows,dict): rows=rows.get('list') or rows.get('data') or []
                          print('EM_COUNT',code,qtype,len(rows),flush=True)
                          for x in rows:
                              rec={k:x.get(k) for k in x.keys()}
                              print('EM_ROW',json.dumps(rec,ensure_ascii=False,default=str),flush=True)
                  except Exception as exc:
                      print('EM_ERROR',code,qtype,repr(exc),flush=True)

          def inspect(url: str, label: str, method='get', data=None):
              try:
                  if method=='post':
                      r=s.post(url,data=data,timeout=(30,120),allow_redirects=True)
                  else:
                      r=s.get(url,timeout=(30,120),allow_redirects=True)
                  print('PAGE',label,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  text=r.text
                  soup=BeautifulSoup(text,'lxml')
                  title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  print('TITLE',label,title[:800],flush=True)
                  for form in soup.find_all('form'):
                      print('FORM',label,form.get('action'),form.get('method'),[(i.get('name'),i.get('value'),i.get('placeholder')) for i in form.find_all(['input','select'])][:30],flush=True)
                  seen=set()
                  for a in soup.find_all('a',href=True):
                      txt=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      blob=(txt+' '+href)
                      if any(t.lower() in blob.lower() for t in terms) or any(k in blob.lower() for k in ['report','yanbao','baogao','研报','pdf']):
                          key=(txt,href)
                          if key not in seen:
                              seen.add(key); print('LINK',label,txt[:800],href[:1500],flush=True)
                  for line in text.splitlines():
                      if any(t in line for t in terms):
                          print('LINE',label,line[:5000],flush=True)
              except Exception as exc:
                  print('PAGE_ERROR',label,repr(exc),flush=True)

          print('=== SGPJBG HOME/SEARCH ===', flush=True)
          inspect('https://www.sgpjbg.com/','sg-home')
          sg_urls=[
              'https://www.sgpjbg.com/search.html?keyword='+quote('时代万恒'),
              'https://www.sgpjbg.com/search?keyword='+quote('时代万恒'),
              'https://www.sgpjbg.com/search.aspx?key='+quote('时代万恒'),
              'https://www.sgpjbg.com/labels/shidaiwanheng.html',
              'https://www.sgpjbg.com/zhuanti/shidaiwanheng.html',
              'https://www.sgpjbg.com/labels/600241.html',
              'https://www.sgpjbg.com/zhuanti/600241.html',
          ]
          for i,u in enumerate(sg_urls,1): inspect(u,f'sg-{i}')

          print('=== SEARCH ENGINES ===', flush=True)
          queries=[
              '"时代万恒" 研报 PDF',
              '"时代万恒" 深度报告',
              '"600241" 券商 研报',
              'site:sgpjbg.com "时代万恒"',
              'site:yanbaoke.com "时代万恒"',
              'site:pdf.dfcfw.com "600241"',
              'site:news.futunn.com "时代万恒" 研报',
              '"九夷能源" 研报',
          ]
          for qi,q in enumerate(queries,1):
              inspect('https://www.baidu.com/s?wd='+quote(q),f'baidu-{qi}')
              inspect('https://cn.bing.com/search?q='+quote(q),f'bing-{qi}')
              inspect('https://html.duckduckgo.com/html/?q='+quote(q),f'ddg-{qi}')

          print('=== OTHER REPORT SITES ===', flush=True)
          other_urls=[
              'https://www.yanbaoke.com/search?keyword='+quote('时代万恒'),
              'https://www.yanbaoke.com/search.html?keyword='+quote('时代万恒'),
              'https://www.yanbaoke.com/?s='+quote('时代万恒'),
              'https://www.iyanbao.com/search?keyword='+quote('时代万恒'),
              'https://www.iyanbao.com/?s='+quote('时代万恒'),
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh600241&t1=all',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=600241&t1=all',
              'https://field.10jqka.com.cn/600241/yb/',
              'https://stockpage.10jqka.com.cn/600241/field/',
              'https://basic.10jqka.com.cn/600241/worth.html',
              'https://stock.stockstar.com/report/600241.shtml',
              'https://stockpage.10jqka.com.cn/600241/analyst/',
              'https://data.eastmoney.com/report/600241.html',
          ]
          for i,u in enumerate(other_urls,1): inspect(u,f'other-{i}')
          PY
