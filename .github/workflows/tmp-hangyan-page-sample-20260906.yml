name: Sample public Hangyan report pages
on:
  push:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests
      - name: Read filename dates
        run: |
          python - <<'PY'
          import re
          import requests
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          pages=[1,2,10,50,100,200,400,800,1200,1600,2000,2200,2300]
          for number in pages:
              response=session.get('https://www.hangyan.co/reports',params={'page':number},timeout=60,allow_redirects=False)
              print('\nPAGE',number,'STATUS',response.status_code,'LOCATION',response.headers.get('location'),'SIZE',len(response.content))
              if response.status_code != 200:
                  continue
              text=response.text
              dates=[]
              for match in re.finditer(r'(?<!\d)(20\d{6})(?!\d)',text):
                  value=match.group(1)
                  if value not in dates:
                      dates.append(value)
              print('DATES_FIRST',dates[:10])
              print('DATES_LAST',dates[-10:])
              matches=list(re.finditer(r'(?<!\d)(20\d{6})(?!\d)',text))
              if matches:
                  m=matches[0]
                  print('SAMPLE',text[max(0,m.start()-200):m.end()+300].replace('\n',' ')[:600])
          PY
