name: Sample public Hangyan report pages
on:
  push:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Read page dates
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          pages=[1,2,10,50,100,200,400,800,1200,1600,2400,3200,4800,6400,8000]
          for number in pages:
              response=session.get('https://www.hangyan.co/reports',params={'page':number},timeout=60,allow_redirects=False)
              print('\nPAGE',number,'STATUS',response.status_code,'LOCATION',response.headers.get('location'),'SIZE',len(response.content))
              if response.status_code != 200:
                  continue
              soup=BeautifulSoup(response.text,'html.parser')
              entries=[]
              for card in soup.select('article'):
                  text=card.get_text(' ',strip=True)
                  dates=re.findall(r'20\d{2}-\d{2}-\d{2}',text)
                  if dates:
                      entries.append((dates[0],text[:220]))
              print('ENTRIES',len(entries))
              print('FIRST',entries[:2])
              print('LAST',entries[-2:])
          PY
