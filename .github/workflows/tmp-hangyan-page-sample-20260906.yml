name: Scan public Hangyan listings for CR BMT reports
on:
  push:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Scan relevant public listing pages
        run: |
          python - <<'PY'
          import concurrent.futures
          import re
          import requests
          from bs4 import BeautifulSoup

          pages=list(range(730,831))+list(range(1050,1211))
          keywords=('华润建材科技','华润水泥控股','01313.HK','01313.hk','1313.HK','1313HK')

          def fetch(number):
              try:
                  r=requests.get('https://www.hangyan.co/reports',params={'page':number},headers={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'},timeout=45)
                  if r.status_code != 200:
                      return number,[],f'HTTP {r.status_code}'
                  soup=BeautifulSoup(r.text,'html.parser')
                  hits=[]
                  for card in soup.select('[data-controller="protected-link"]'):
                      text=card.get_text(' ',strip=True)
                      if any(k in text for k in keywords):
                          token=card.get('data-protected-link-token-value','')
                          link=card.find('a')
                          hits.append({'page':number,'text':text[:1500],'token':token,'href':link.get('href') if link else None})
                  if not hits and any(k in r.text for k in keywords):
                      hits.append({'page':number,'text':'RAW_MATCH','token':'','href':''})
                  return number,hits,None
              except Exception as e:
                  return number,[],repr(e)

          all_hits=[]; errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as executor:
              for number,hits,error in executor.map(fetch,pages):
                  if hits:
                      all_hits.extend(hits)
                      print('PAGE_HIT',number,hits)
                  if error:
                      errors.append((number,error))
          print('TOTAL_HITS',len(all_hits))
          print('ERROR_COUNT',len(errors),'ERROR_SAMPLE',errors[:20])
          if not all_hits:
              raise SystemExit('No public listing matches found')
          PY
