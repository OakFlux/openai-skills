name: ZJLD SGP Scripts

on:
  push:
    branches:
      - chatgpt-zjld-broker-20260922
    paths:
      - .github/workflows/zjld_sgp_scripts.yml

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch scripts and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          O=Path('out')
          urls={
            'view2.js':'https://cache.sgpjbg.com/master/view/view2.js',
            'view-mini-fz.js':'https://cache.sgpjbg.com/Master/view/view-mini-fz.js',
            'encoder.js':'https://cache.sgpjbg.com/css/view/encoder.js',
          }
          for rid in ['116652','128486','144022','177723','112813']:
            urls[f'detail_{rid}.html']=f'https://www.sgpjbg.com/baogao/{rid}.html'
            urls[f'view_{rid}.html']=f'https://www.sgpjbg.com/sgpjbg/View.aspx?id={rid}'
          summary={}
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=20,allow_redirects=True)
              (O/name).write_bytes(r.content)
              rec={'url':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'ct':r.headers.get('content-type','')}
              if name.startswith('detail_'):
                t=r.text; soup=BeautifulSoup(t,'html.parser')
                rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                for key in ['DocID','mtp','fCount','defaultShowPage','ForceFreepage','mhi','mhls','mfvs','url_root','zw','zh']:
                  pats=[rf'var\s+{re.escape(key)}\s*=\s*([^;]+);',rf'{re.escape(key)}\s*=\s*([^;]+);']
                  for pat in pats:
                    m=re.search(pat,t,re.I)
                    if m: rec[key]=m.group(1).strip(); break
                m=re.search(r'<iframe[^>]+src=["\']([^"\']*BookRead[^"\']+)["\']',t,re.I)
                if m: rec['bookread']=m.group(1)
              summary[name]=rec
              print(name,json.dumps(rec,ensure_ascii=False))
            except Exception as e:
              summary[name]={'url':url,'error':repr(e)}; print(name,repr(e))
          (O/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RniE 'Addpage|pageurl|imgurl|GetPage|viewimage|Viewer|mhi|mhls|mfvs|DocID|ashx|ajax|\.jpg|\.png|\.webp' out/view2.js out/view-mini-fz.js out/encoder.js | head -500 > out/grep.txt || true
          find out -maxdepth 1 -type f -printf '%f %s\n' | sort
      - name: Upload scripts
        uses: actions/upload-artifact@v4
        with:
          name: zjld-sgp-scripts
          path: out
          retention-days: 1
