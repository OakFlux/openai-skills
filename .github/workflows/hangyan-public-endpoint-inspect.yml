name: Inspect Hangyan public report endpoints
on:
  push:
    branches:
      - tmp-vzkoo-feihe-inspect-20260905
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect public app bundle
        run: |
          python -m pip install requests
          cat > /tmp/inspect.py <<'PY'
          import json,re
          from pathlib import Path
          import requests
          out=Path('hangyan'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.hangyan.co/reports/2981880365326534329'})
          urls=['https://cdn.hangyan.co/assets/application-ec845e69.js','https://www.hangyan.co/reports/2981880365326534329']
          result=[]
          for i,u in enumerate(urls):
            r=s.get(u,timeout=60); print('GET',u,r.status_code,r.headers.get('content-type'),len(r.content)); r.raise_for_status()
            (out/f'{i}.bin').write_bytes(r.content)
            text=r.text
            hits=[]
            for pat in [r'.{0,300}pdf.{0,500}',r'.{0,300}report.{0,500}',r'.{0,300}document.{0,500}',r'.{0,300}download.{0,500}',r'.{0,300}attachment.{0,500}',r'.{0,300}/api/.{0,500}',r'.{0,300}2981880365326534329.{0,500}']:
              for m in re.finditer(pat,text,re.I|re.S):
                h=m.group(0)
                if h not in hits: hits.append(h)
            urls_found=sorted(set(re.findall(r'https?://[^"\'<>\\s]+',text)))
            result.append({'url':u,'hits':hits[:1000],'urls':[x for x in urls_found if any(k in x.lower() for k in ['pdf','api','report','file','document','download','cdn'])][:1000]})
            print('HITS',len(hits),'URLS',len(urls_found))
            for h in hits[:100]: print('HIT',h[:1000].replace('\n',' '))
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-public-endpoint-inspection
          path: hangyan
          retention-days: 1
