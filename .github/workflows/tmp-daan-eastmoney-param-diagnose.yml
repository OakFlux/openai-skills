name: Temporary Daan Gene Eastmoney parameter diagnosis

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-eastmoney-param-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Diagnose query variants
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          variants=[
            {'name':'code_q0','qType':'0','code':'002030'},
            {'name':'code_q1','qType':'1','code':'002030'},
            {'name':'stockCode_q0','qType':'0','stockCode':'002030'},
            {'name':'rcode_q0','qType':'0','rcode':'002030'},
            {'name':'code_star_q0','qType':'0','code':'002030.SZ'},
            {'name':'keyword_q0','qType':'0','keyword':'达安基因'},
            {'name':'name_q0','qType':'0','name':'达安基因'},
            {'name':'code_only','code':'002030'},
          ]
          base={'industryCode':'*','pageSize':'50','industry':'*','rating':'*','ratingChange':'*','beginTime':'2020-07-01','endTime':'2020-12-31','pageNo':'1','fields':'','orgCode':'','p':'1','pageNum':'1','pageNumber':'1'}
          for v in variants:
            name=v.pop('name'); params={**base,**v}
            try:
              r=s.get(endpoint,params=params,timeout=45); print('\nVARIANT',name,'URL',r.url,'STATUS',r.status_code,'BYTES',len(r.content)); r.raise_for_status(); payload=r.json()
            except Exception as e: print('ERROR',repr(e)); continue
            print('PAYLOAD_KEYS',payload.keys())
            print('TOTAL',payload.get('total'),'HITS',payload.get('hits'),'SIZE',payload.get('size'),'CURRENT_PAGE',payload.get('currentPage'))
            rows=payload.get('data') or []
            print('ROWS',len(rows))
            for row in rows[:10]:
              print('ROW',json.dumps({k:row.get(k) for k in ['title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','reportType']},ensure_ascii=False))
            exact=[]
            for row in rows:
              blob=' '.join(map(str,[row.get('title'),row.get('stockName'),row.get('stockCode')]))
              if '达安基因' in blob or '002030' in blob: exact.append({k:row.get(k) for k in ['title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','reportType']})
            print('EXACT',json.dumps(exact,ensure_ascii=False))
          PY
