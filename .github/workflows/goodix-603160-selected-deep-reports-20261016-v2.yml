name: Package selected Goodix 603160 deep reports 20261016

on:
  push:
    branches:
      - tmp/goodix-603160-broker-reports-20261016-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package selected reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = "603160"
          SHORT = "汇顶科技"
          FULL = "深圳市汇顶科技股份有限公司"
          PREPARED = "2026-10-16"
          PACKAGE = "汇顶科技_603160_券商深度报告_3份"
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          reports = [
              {
                  "info_code": "AP202501061641827717",
                  "date": "2025-01-06",
                  "org": "民生证券",
                  "title": "深度报告：新品突破汇势能，毛竹长成攀新顶",
                  "min_pages": 25,
              },
              {
                  "info_code": "AP202007071390051945",
                  "date": "2020-07-07",
                  "org": "华安证券",
                  "title": "大国雄心·半导体深度报告（五）：全球指纹识别龙头，布局IoT领域",
                  "min_pages": 24,
              },
              {
                  "info_code": "AP201901111284070527",
                  "date": "2019-01-11",
                  "org": "粤开证券",
                  "title": "联讯电子公司深度：创新研发确立先发优势，屏下光学指纹助力业绩增长",
                  "min_pages": 35,
              },
          ]

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36"
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": UA,
              "Referer": "https://data.eastmoney.com/report/",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def safe_name(text: str) -> str:
              text = re.sub(r"[\\/:*?\"<>|]+", "_", text)
              text = re.sub(r"\s+", " ", text).strip(" ._")
              return text[:118]

          def download_pdf(info_code: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf",
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(5):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  "User-Agent": UA,
                                  "Referer": f"https://data.eastmoney.com/report/info/{info_code}.html",
                                  "Accept": "application/pdf,*/*;q=0.8",
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          last = {
                              "url": url,
                              "status": response.status_code,
                              "content_type": response.headers.get("content-type", ""),
                              "bytes": len(response.content),
                              "final_url": response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b"%PDF-" and len(response.content) > 50_000:
                              return response.content, url, last
                      except Exception as exc:
                          last = {"url": url, "error": repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed for {info_code}: {last}")

          accepted: list[dict[str, Any]] = []
          for index, report in enumerate(reports, 1):
              data, pdf_url, download_meta = download_pdf(report["info_code"])
              filename = safe_name(
                  f"{index:02d}_{report['date'].replace('-', '')}_{report['org']}_{report['title']}.pdf"
              )
              path = ROOT / filename
              path.write_bytes(data)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report["min_pages"]:
                  raise RuntimeError(f"Too few pages for {filename}: {pages} < {report['min_pages']}")
              text = ""
              for page in reader.pages[:min(30, pages)]:
                  try:
                      text += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              issuer_ok = (
                  SHORT in text or FULL in text or CODE in text
                  or "深圳市汇顶科技" in text or "Goodix" in text or "GOODIX" in text
              )
              if not issuer_ok:
                  raise RuntimeError(f"Issuer identity check failed for {filename}")
              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEW / path.stem
              subprocess.run(
                  [
                      "pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "120",
                      "-singlefile", str(path), str(preview_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(preview_prefix) + ".png")
              if not preview_file.exists() or preview_file.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview render failed for {filename}")
              accepted.append({
                  **report,
                  "filename": filename,
                  "actual_pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "pdf_url": pdf_url,
                  "detail_url": f"https://data.eastmoney.com/report/info/{report['info_code']}.html",
                  "download_meta": download_meta,
                  "preview_file": str(Path("首页预览") / preview_file.name),
              })

          readme = [
              f"汇顶科技（{CODE}.SH）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包精选3份篇幅较完整的汇顶科技公司深度研究报告，不收录摘要版或常规财报点评。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for index, item in enumerate(accepted, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   券商：{item['org']}；发布日期：{item['date']}；实际页数：{item['actual_pages']}页",
                  f"   标题：{item['title']}",
                  f"   来源页面：{item['detail_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、汇顶科技/证券代码匹配、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "说明：东方财富研报中心为公开聚合来源；如报告后续被来源方撤回，应以原券商发布规则为准。",
          ]
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          manifest = {
              "company": SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(accepted),
              "selection_method": "three substantive company deep reports; exclude abstracts and earnings-commentary reports",
              "files": accepted,
          }
          (ROOT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  "文件名", "券商", "发布日期", "标题", "页数", "字节数", "SHA-256", "来源页面", "PDF地址"
              ])
              for item in accepted:
                  writer.writerow([
                      item["filename"], item["org"], item["date"], item["title"],
                      item["actual_pages"], item["bytes"], item["sha256"], item["detail_url"], item["pdf_url"],
                  ])
          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['filename']}" for item in accepted) + "\n",
              encoding="utf-8",
          )

          zip_path = Path(PACKAGE + ".zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(accepted),
              "files": [
                  {
                      "name": item["filename"],
                      "broker": item["org"],
                      "date": item["date"],
                      "pages": item["actual_pages"],
                      "bytes": item["bytes"],
                      "sha256": item["sha256"],
                      "title": item["title"],
                  }
                  for item in accepted
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: goodix-603160-selected-deep-reports-20261016
          path: 汇顶科技_603160_券商深度报告_3份.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
