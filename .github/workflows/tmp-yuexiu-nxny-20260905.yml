name: Inspect NXNY Yuexiu Transport report archive

on:
  push:
    branches:
      - tmp-yuexiu-nxny-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect report archive and linked pages
        run: |
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import html,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          root='https://www.nxny.com/stock/stock_01052/'
          r=s.get(root,timeout=45,allow_redirects=True)
          print('ROOT',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          raw=html.unescape(r.text).replace('\\/','/')
          Path('output/root.html').write_text(raw,encoding='utf-8')
          soup=BeautifulSoup(raw,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
              href=urljoin(r.url,a['href']); text=' '.join(a.stripped_strings)
              blob=(text+' '+href).lower()
              if any(k in blob for k in ['越秀交通','260109','西南证券','研报','report','download','pdf','1052']):
                  item={'text':text[:1000],'href':href}
                  if item not in links: links.append(item); print('LINK',json.dumps(item,ensure_ascii=False))
          for needle in ['260109','控股里程不断超','西南证券','越秀交通基建','页数','下载']:
              for m in list(re.finditer(re.escape(needle),raw,re.I))[:40]:
                  print('SNIP',needle,raw[max(0,m.start()-1200):m.start()+3200].replace('\n',' ')[:4400])
          # Follow all distinct likely report/detail links from the page.
          followed=[]
          for i,item in enumerate(links[:100]):
              u=item['href']
              if u==root or u.startswith('javascript:') or u.startswith('mailto:'): continue
              try:
                  rr=s.get(u,timeout=35,allow_redirects=True,headers={'Referer':root})
                  ct=rr.headers.get('content-type','')
                  print('FOLLOW',i,rr.status_code,len(rr.content),rr.url,ct)
                  entry={'url':u,'final':rr.url,'status':rr.status_code,'bytes':len(rr.content),'content_type':ct}
                  if rr.content.lstrip().startswith(b'%PDF'):
                      fn=f'output/direct_{i:03d}.pdf'; Path(fn).write_bytes(rr.content); entry['file']=fn
                      print('DIRECT_PDF',fn)
                  else:
                      text=html.unescape(rr.text).replace('\\/','/')
                      Path(f'output/follow_{i:03d}.html').write_text(text,encoding='utf-8')
                      ss=BeautifulSoup(text,'html.parser')
                      assets=[]
                      for tag in ss.find_all(True):
                          for attr in ['href','src','data-url','data-href','data-file','data-pdf','content']:
                              v=tag.get(attr)
                              if isinstance(v,str):
                                  full=urljoin(rr.url,v)
                                  if any(k in (full+' '+v).lower() for k in ['.pdf','download','file','report','yanbao']):
                                      assets.append(full)
                      entry['assets']=list(dict.fromkeys(assets))[:200]
                      for x in entry['assets']: print('ASSET',x)
                      for needle in ['260109','控股里程不断超','西南证券','pdf','download']:
                          for m in list(re.finditer(re.escape(needle),text,re.I))[:20]:
                              print('FOLLOW_SNIP',needle,text[max(0,m.start()-700):m.start()+2200].replace('\n',' ')[:2900])
                  followed.append(entry)
              except Exception as e:
                  print('FOLLOW_ERR',u,repr(e))
          Path('output/links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/followed.json').write_text(json.dumps(followed,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuexiu-nxny-inspection
          path: output
          retention-days: 1
