name: Discover Wuhan Fingu 002194 broker reports 20261022

on:
  push:
    paths:
      - '.github/workflows/wuhan-fingu-002194-broker-discover-20261022.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests
      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=002194'})
          api='https://reportapi.eastmoney.com/report/list'
          allrows=[];seen=set()
          for qtype in ['0','1','2']:
            page=1
            while page<=30:
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2007-01-01','endTime':'2026-10-22','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'002194','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              payload=None
              for attempt in range(5):
                try:
                  r=s.get(api,params=p,timeout=(20,120))
                  if r.status_code==200:
                    payload=r.json();break
                except Exception as e: print('ERR',qtype,page,repr(e))
                time.sleep(1+attempt)
              if payload is None:break
              data=payload.get('data') or []
              if isinstance(data,dict):data=data.get('list') or data.get('data') or []
              print('PAGE',qtype,page,'COUNT',len(data),'HITS',payload.get('hits'),'TOTALPAGE',payload.get('TotalPage'))
              if not data:break
              for row in data:
                info=str(row.get('infoCode') or '')
                key=(qtype,info)
                if key in seen:continue
                seen.add(key)
                item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName','predictNextTwoYearEps','predictNextTwoYearPe']}
                item['qType']=qtype
                allrows.append(item)
              total=int(payload.get('TotalPage') or 1)
              if page>=total or len(data)<100:break
              page+=1
          print('ALL_ROWS',json.dumps(allrows,ensure_ascii=False,indent=2))
          print('LONG_ROWS',json.dumps([x for x in allrows if int(float(x.get('attachPages') or 0))>=10],ensure_ascii=False,indent=2))
          PY
