name: Temporary Towngas compact broker reports package
on:
  push:
    branches: [tmp-towngas-final2-20260905]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf pymupdf pillow img2pdf
          python - <<'PY'
          import csv, hashlib, io, re, zipfile
          from pathlib import Path
          import img2pdf, pymupdf, requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          root=Path.cwd(); reports=root/'reports'; output=root/'output'; pages_dir=root/'pages'; qa=root/'qa'
          for d in (reports,output,pages_dir,qa): d.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/detail/5316216'})

          page_rows=[]; paths=[]; seen=set()
          for i in range(1,17):
              base=f'https://public.fxbaogao.com/report-image/2026/03/23/5316216-{i}.png'
              urls=[
                  base+'?x-oss-process=image/crop,x_0,y_0,w_1980,h_2800/resize,p_60',
                  base+'?x-oss-process=image/resize,p_60',
                  base+'?x-oss-process=image/resize,w_1400',
              ]
              last=[]; raw=None; final=None; ctype=''
              for url in urls:
                  try:
                      r=s.get(url,timeout=(15,30),allow_redirects=True)
                      if r.status_code!=200 or len(r.content)<25000: raise RuntimeError(f'{r.status_code} {len(r.content)} {r.headers.get("content-type")}')
                      im=Image.open(io.BytesIO(r.content)); im.load()
                      if im.width<800 or im.height<1000: raise RuntimeError(f'dim {im.width}x{im.height}')
                      raw=r.content; final=r.url; ctype=r.headers.get('content-type',''); break
                  except Exception as e: last.append(f'{url}: {e}')
              if raw is None: raise RuntimeError(f'page {i} failed: {last}')
              im=Image.open(io.BytesIO(raw)); digest=hashlib.sha256(raw).hexdigest()
              if digest in seen: raise RuntimeError(f'duplicate page {i}')
              seen.add(digest); path=pages_dir/f'{i:02d}.png'; path.write_bytes(raw); paths.append(path)
              page_rows.append({'页码':i,'像素宽度':im.width,'像素高度':im.height,'文件大小（字节）':len(raw),'SHA256':digest,'公开页面图像来源':final})
              print(f'PAGE_OK {i} {im.width}x{im.height} {len(raw)} {final}',flush=True)

          sw=reports/'01_西南证券_港华智慧能源_智慧能源聚合服务商龙头发展前景广阔_20260323_16页.pdf'
          sw.write_bytes(img2pdf.convert([str(p) for p in paths])); swraw=sw.read_bytes()
          if len(PdfReader(io.BytesIO(swraw),strict=False).pages)!=16: raise RuntimeError('SW PDF page mismatch')

          xurl='https://cdn.hangyan.co/documents/05/058863d8b194ffb7b8411c26a610cf12d6c8408bb2fd3dfa9cde7b8e3c6cd56f.pdf'
          xr=requests.get(xurl,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://www.hangyan.co/reports/3860972724125959389'},timeout=(20,90))
          if xr.status_code!=200 or b'%PDF-' not in xr.content[:1024] or len(xr.content)<80000: raise RuntimeError(f'Xingzheng download failed {xr.status_code} {len(xr.content)} {xr.headers.get("content-type")}')
          xraw=xr.content; xp=len(PdfReader(io.BytesIO(xraw),strict=False).pages)
          if xp<3: raise RuntimeError(f'Xingzheng pages {xp}')
          xd=pymupdf.open(stream=xraw,filetype='pdf'); text=''.join(xd.load_page(i).get_text() for i in range(min(2,len(xd)))); xd.close()
          if not any(k in re.sub(r'\s+','',text).lower() for k in ['港华智慧能源','港華智慧能源','01083.hk','1083.hk']): raise RuntimeError('Xingzheng identity mismatch')
          xf=reports/f'02_兴证国际证券_港华智慧能源_售气价差增长派息维持稳定_20260325_{xp}页.pdf'; xf.write_bytes(xraw)

          rows=[
            {'文件名':sw.name,'券商':'西南证券','发布日期':'2026-03-23','报告标题':'2025年年报点评：智慧能源聚合服务商龙头，发展前景广阔','PDF页数':16,'文件大小（字节）':len(swraw),'SHA256':hashlib.sha256(swraw).hexdigest(),'研报信息页':'https://www.fxbaogao.com/detail/5316216','来源说明':'公开展示的16张原报告页面图像按页序合并；逐页来源与校验值见附表'},
            {'文件名':xf.name,'券商':'兴证国际证券','发布日期':'2026-03-25','报告标题':'售气价差增长，派息维持稳定','PDF页数':xp,'文件大小（字节）':len(xraw),'SHA256':hashlib.sha256(xraw).hexdigest(),'研报信息页':'https://www.hangyan.co/reports/3860972724125959389','来源说明':xurl},
          ]
          mf=reports/'文件清单与校验值.csv'
          with mf.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          pm=reports/'西南证券逐页来源与校验值.csv'
          with pm.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(page_rows[0])); w.writeheader(); w.writerows(page_rows)
          rd=reports/'README.txt'; rd.write_text(
              f'港华智慧能源有限公司（01083.HK，原称港华燃气）券商研究报告资料包\n\n'
              f'1. 西南证券，2026-03-23，16页：《2025年年报点评：智慧能源聚合服务商龙头，发展前景广阔》；\n'
              f'2. 兴证国际证券，2026-03-25，{xp}页：《售气价差增长，派息维持稳定》。\n\n'
              '说明：兴证国际报告为原始PDF；西南证券原始下载入口要求登录，本资料包使用报告详情页公开展示的16张原报告页面图像，按原页序合并成完整PDF，未以摘要代替正文。逐页来源、尺寸及SHA-256见附表。\n'
              '校验：两份PDF均已检查文件头、可解析性和实际页数；西南证券逐页检查尺寸及重复页；兴证国际检查前两页公司名称；ZIP已执行CRC完整性测试。\n'
              '提示：研报中的预测、目标价和评级均对应发布时点。\n',encoding='utf-8')

          covers=[]
          for label,p in [('Southwest Securities 2026 (16 pages)',sw),(f'Industrial Securities Intl 2026 ({xp} pages)',xf)]:
              d=pymupdf.open(str(p)); pix=d[0].get_pixmap(matrix=pymupdf.Matrix(1.1,1.1),alpha=False); cp=qa/(p.stem+'.png'); pix.save(cp); d.close(); covers.append((label,cp))
          W,H=430,610; sheet=Image.new('RGB',(W*2,H),'white')
          for j,(label,cp) in enumerate(covers):
              im=Image.open(cp).convert('RGB'); im.thumbnail((W-30,H-80)); can=Image.new('RGB',(W,H),'white'); can.paste(im,((W-im.width)//2,10)); ImageDraw.Draw(can).text((15,H-55),label,fill='black'); sheet.paste(can,(j*W,0))
          sheet.save(output/'港华智慧能源_券商深度报告_首页核验图.jpg',quality=92)

          z=output/'港华智慧能源_01083_券商深度报告_2份.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as a:
              for p in sorted(reports.iterdir(),key=lambda p:p.name): a.write(p,p.name)
          with zipfile.ZipFile(z) as a:
              if a.testzip(): raise RuntimeError('ZIP CRC failure')
              if sum(n.lower().endswith('.pdf') for n in a.namelist())!=2: raise RuntimeError('PDF count mismatch')
          (output/'文件清单与校验值.csv').write_bytes(mf.read_bytes()); (output/'README.txt').write_bytes(rd.read_bytes())
          print(f'ARCHIVE_READY={z}',flush=True); print(f'ARCHIVE_SIZE={z.stat().st_size}',flush=True); print(f'XINGZHENG_PAGES={xp}',flush=True)
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: towngas-final2-archive
          path: output/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
