name: Build streamlined Seyond 02665 filings package 20260922

on:
  push:
    paths:
      - '.github/workflows/seyond-02665-filings-package-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          PACKAGE='图达通_02665_全部年报_上市文件及最新中期业绩'
          root=Path(PACKAGE)
          dirs={
            'annual':root/'01_年度报告',
            'despac':root/'02_上市文件_招股说明书等',
            'phip':root/'02_上市文件_招股说明书等',
            'application':root/'02_上市文件_招股说明书等',
            'latest':root/'03_最新阶段性财务报告',
          }
          for d in set(dirs.values()): d.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          page_urls=[]
          for host in ('www1.hkexnews.hk','www.hkexnews.hk'):
            for lang in ('EN','ZH','TC'):
              page_urls.append((lang,f'https://{host}/search/titlesearch.xhtml?category=0&lang={lang}&market=SEHK&stockId=1000281906'))
          found=[]; page_log=[]
          for lang,u in page_urls:
            try:
              r=s.get(u,timeout=(20,60),allow_redirects=True)
              page_log.append({'url':u,'status':r.status_code,'bytes':len(r.content)})
              if r.status_code!=200: continue
              text=r.content.decode('utf-8',errors='replace')
              soup=BeautifulSoup(text,'lxml')
              for a in soup.find_all('a',href=True):
                title=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if '.pdf' not in href.lower(): continue
                kind=None
                if re.search(r'annual report|年度報告|年度报告|年報|年报',title,re.I) and '2025' in title: kind='annual'
                elif re.search(r'interim results announcement|interim report|中期業績|中期业绩|中期報告|中期报告',title,re.I) and ('2026' in title or 'june 30, 2026' in title.lower() or '30 june 2026' in title.lower()): kind='latest'
                elif re.search(r'de-spac transaction circular|de-spac circular|交易通函|上市文件',title,re.I): kind='despac'
                elif re.search(r'phip|post hearing information pack|聆訊後資料集|聆讯后资料集',title,re.I): kind='phip'
                elif re.search(r'application proof|申請版本|申请版本',title,re.I): kind='application'
                if kind: found.append({'kind':kind,'title':title,'url':href,'lang':lang,'index':u})
            except Exception as e: page_log.append({'url':u,'error':repr(e)})

          found += [
            {'kind':'annual','title':'2025 Annual Report','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0427/2026042700628.pdf','lang':'EN','index':page_urls[0][1]},
            {'kind':'despac','title':'Republished De-SPAC Transaction Circular - final listing document','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1210/2025121000303.pdf','lang':'EN','index':page_urls[0][1]},
            {'kind':'phip','title':'PHIP - Post Hearing Information Pack','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1210/sehk25111200016.pdf','lang':'EN','index':page_urls[0][1]},
            {'kind':'application','title':'Application Proof - first submission','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1210/sehk25082600106.pdf','lang':'EN','index':page_urls[0][1]},
          ]
          uniq={}
          for x in found:
            x['url']=x['url'].replace('www.hkexnews.hk','www1.hkexnews.hk')
            uniq.setdefault(x['url'],x)
          found=list(uniq.values())
          print('DISCOVERED',json.dumps(found,ensure_ascii=False,indent=2),flush=True)

          def dl(url,dest):
            errs=[]
            variants=[url]
            if 'www1.hkexnews.hk' in url: variants.append(url.replace('www1.hkexnews.hk','www.hkexnews.hk'))
            for u in variants:
              for n in range(1,4):
                try:
                  with s.get(u,timeout=(20,180),stream=True,allow_redirects=True,headers={'Referer':'https://www1.hkexnews.hk/'}) as r:
                    print('GET',r.status_code,u,'->',r.url,flush=True); r.raise_for_status()
                    with dest.open('wb') as f:
                      for c in r.iter_content(1024*1024):
                        if c:f.write(c)
                  if dest.stat().st_size<30000 or dest.read_bytes()[:5]!=b'%PDF-': raise RuntimeError('not pdf')
                  return r.url
                except Exception as e:
                  errs.append(repr(e)); dest.unlink(missing_ok=True); time.sleep(n)
            raise RuntimeError(str(errs))

          names={
            'annual':('01_图达通_02665_2025年年度报告','2026-04-27'),
            'despac':('01_图达通_02665_De-SPAC交易通函暨最终上市文件','2025-12-10'),
            'phip':('02_图达通_02665_PHIP聆讯后资料集','2025-11-12'),
            'application':('03_图达通_02665_上市申请版本','2025-08-26'),
            'latest':('01_图达通_02665_2026年中期业绩公告','2026-08-20'),
          }
          recs=[]; fails=[]; hashes=set(); counters={}
          for i,x in enumerate(found,1):
            tmp=Path(f'tmp_{i}.pdf')
            try:
              final=dl(x['url'],tmp)
              reader=PdfReader(str(tmp),strict=False); pages=len(reader.pages)
              sample=''
              for p in reader.pages[:min(10,pages)]:
                try: sample+='\n'+(p.extract_text() or '')
                except: pass
              low=sample.lower()
              if not any(k in low for k in ('seyond','圖達通','图达通','02665','2665')): raise RuntimeError('wrong company')
              if x['kind'] in ('despac','phip','application') and pages<300: raise RuntimeError(f'listing document too short {pages}')
              if x['kind']=='annual' and not re.search(r'annual report|年度報告|年度报告',sample,re.I): raise RuntimeError('wrong annual report')
              if x['kind']=='latest' and not re.search(r'interim|中期',sample,re.I): raise RuntimeError('wrong interim filing')
              q=subprocess.run(['qpdf','--check',str(tmp)],capture_output=True,text=True)
              if q.returncode not in (0,3): raise RuntimeError('qpdf failed')
              sha=hashlib.sha256(tmp.read_bytes()).hexdigest()
              if sha in hashes: tmp.unlink(); continue
              hashes.add(sha)
              langlabel={'EN':'英文版','ZH':'中文版','TC':'中文版'}.get(x['lang'],x['lang'])
              base,date=names[x['kind']]
              counters[(x['kind'],langlabel)]=counters.get((x['kind'],langlabel),0)+1
              suffix='' if counters[(x['kind'],langlabel)]==1 else f'_{counters[(x["kind"],langlabel)]}'
              dest=dirs[x['kind']]/f'{base}_{langlabel}_{date}{suffix}.pdf'
              tmp.replace(dest)
              prev=dest.with_name(dest.stem+'_首页预览')
              subprocess.run(['pdftoppm','-f','1','-singlefile','-r','110','-png',str(dest),str(prev)],check=True)
              rec={'category':x['kind'],'title':x['title'],'language':x['lang'],'filename':str(dest.relative_to(root)),'source_url':final,'source_index':x['index'],'pages':pages,'bytes':dest.stat().st_size,'sha256':sha}
              recs.append(rec); print('OK',json.dumps(rec,ensure_ascii=False),flush=True)
            except Exception as e:
              tmp.unlink(missing_ok=True); fails.append({'item':x,'error':repr(e)}); print('FAIL',json.dumps(fails[-1],ensure_ascii=False),flush=True)
          kinds={r['category'] for r in recs}
          if not {'annual','despac','latest'}.issubset(kinds): raise RuntimeError(f'incomplete kinds={kinds} failures={fails}')
          recs.sort(key=lambda x:x['filename'])
          lines=[
            '图达通（Seyond Holdings Ltd.，02665.HK）官方披露文件包','整理日期：2026-09-22','',
            '公司于2025-12-10通过De-SPAC交易在香港联交所上市，因此上市后完整年度报告目前只有2025年年度报告。',
            '该上市方式没有传统IPO全球发售招股章程；最终De-SPAC交易通函明确同时构成图达通的上市文件，本包将其作为招股说明书等效文件。',
            '同时保留成功取得的PHIP及上市申请版本，便于核查上市前历史财务资料。',
            '香港主板公司通常不按A股口径发布第一、第三季度财报。截至整理日，最新完整财务披露为截至2026-06-30止六个月中期业绩公告。','', '文件清单：'
          ]
          labels={'annual':'年度报告','despac':'最终上市文件','phip':'PHIP','application':'上市申请版本','latest':'最新中期财务披露'}
          for n,r in enumerate(recs,1):
            lines += [f"{n}. {labels[r['category']]}：{r['title']}",f"   文件：{r['filename']}",f"   语言：{r['language']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          lines += ['核验：PDF文件头、公司身份、文件类型、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (root/'00_文件清单与核验说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'discovery_log.json').write_text(json.dumps({'pages':page_log,'failures':fails},ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in recs),encoding='utf-8')
          zp=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=str(Path(PACKAGE)/p.relative_to(root)))
          with zipfile.ZipFile(zp) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad: raise RuntimeError('bad zip '+bad)
            if len(pdfs)<3: raise RuntimeError('too few pdfs')
          print('FINAL_ZIP',zp,zp.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',hashlib.sha256(zp.read_bytes()).hexdigest(),flush=True)
          print('FINAL_MANIFEST',json.dumps(recs,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: seyond-02665-filings-final-v2
          path: 图达通_02665_全部年报_上市文件及最新中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
