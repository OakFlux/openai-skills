name: Inspect Yiyi SZSE API 20261004

on:
  push:
    paths:
      - '.github/workflows/inspect-yiyi-szse-api-20261004.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Shenzhen Exchange announcement API
        run: |
          python - <<'PY'
          import requests,json,time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.szse.cn/disclosure/listed/notice/index.html','Origin':'https://www.szse.cn','Content-Type':'application/json'})
          urls=['https://www.szse.cn/api/disc/announcement/annList','https://www.szse.cn/api/disc/announcement/annList?random=0.123456']
          bodies=[]
          for channel in [['listedNotice_disc'],['fixed_disc'],[],None]:
            for keyword in ['招股说明书','首次公开发行股票招股说明书','依依股份']:
              b={'seDate':['2021-04-29','2021-05-01'],'pageSize':100,'pageNum':1,'stock':['001206'],'keyword':keyword}
              if channel is not None: b['channelCode']=channel
              bodies.append(b)
          for url in urls:
            for body in bodies:
              try:
                r=s.post(url,json=body,timeout=120)
                print('\nREQ',url,body,'STATUS',r.status_code,'LEN',len(r.content),'CT',r.headers.get('content-type'))
                print(r.text[:5000])
              except Exception as e: print('ERR',url,body,repr(e))
          PY
