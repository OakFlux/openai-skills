name: Temporary Fast Inspect SGPJBG Reader Output

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-sgpjbg-reader-fast.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Jina Reader pages and extract asset clues
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          result=[]
          for rid in ['4488','22455','19538']:
            u=f'https://r.jina.ai/http://www.sgpjbg.com/baogao/{rid}.html'
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Accept':'text/plain,*/*'},timeout=100)
            text=r.text
            urls=[]
            for x in re.findall(r'https?://[^\s\)\]<>"\']+',text,re.I):
              if any(k in x.lower() for k in ['file.sgpjbg','fileroot','cache.sgpjbg','bgdown','baogao','pdf','gif','png','jpg','webp']):
                if x not in urls:urls.append(x)
            snippets=[]
            for needle in ['Image 1','/31','/35','/22','fileroot','file.sgpjbg','bgdown','download','PDF','页数','大小','国盛证券','东兴证券']:
              for m in list(re.finditer(re.escape(needle),text,re.I))[:20]:
                snippets.append({'needle':needle,'text':re.sub(r'\s+',' ',text[max(0,m.start()-800):m.start()+3000])})
            item={'id':rid,'status':r.status_code,'bytes':len(r.content),'urls':urls,'snippets':snippets,'text':text}
            result.append(item)
            print('ITEM='+json.dumps({'id':rid,'status':r.status_code,'bytes':len(r.content),'urls':urls[:100],'snippets':snippets[:20]},ensure_ascii=False),flush=True)
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_sgpjbg_reader_fast.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-sgpjbg-reader-fast
          path: out/orient_gene_sgpjbg_reader_fast.json
          if-no-files-found: error
          retention-days: 3
