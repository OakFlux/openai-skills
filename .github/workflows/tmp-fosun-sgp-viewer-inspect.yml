name: Temporary Fosun SGP viewer asset inspection

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-sgp-viewer-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Inspect public viewer configuration and scripts
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ids=[181674,157577,115446,50869]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          scripts=set()
          reports=[]
          for rid in ids:
            url=f'https://bg.sgpjbg.com/baogao/{rid}.html'
            try:
              r=s.get(url,timeout=60); r.raise_for_status(); text=r.text; soup=BeautifulSoup(text,'html.parser')
              rec={'id':rid,'status':r.status_code,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else None}
              for tag in soup.find_all('script',src=True): scripts.add(urljoin(r.url,tag['src']))
              decoded=html.unescape(text).replace('\\/','/')
              # Print viewer-related snippets only.
              snippets=[]
              for needle in ['Viewer._Addpage','Addpage','pagecount','pageCount','PageCount','dp=','dp =','fileroot','view-mini','freepage','freePage','vip','VIP','preview']:
                for m in list(re.finditer(re.escape(needle),decoded,re.I))[:12]:
                  snip=re.sub(r'\s+',' ',decoded[max(0,m.start()-500):m.start()+1200])
                  if snip not in snippets: snippets.append(snip)
              rec['snippets']=snippets[:40]
              # Extract likely variables and file URLs.
              rec['urls']=sorted(set(re.findall(r'https?://[^"\'<>\s]+',decoded,re.I)))
              rec['fileroot_urls']=[u for u in rec['urls'] if 'fileroot' in u or 'file.sgpjbg.com' in u]
              vars_found={}
              for name in ['dp','pagecount','pageCount','PageCount','totalPage','totalPages','freePage','freepage','isVip','isVIP','vip']:
                vals=re.findall(rf'(?i)(?:var\s+)?{re.escape(name)}\s*[:=]\s*["\']?([^,;\n"\']+)',decoded)
                if vals: vars_found[name]=vals[:20]
              rec['vars']=vars_found
              reports.append(rec)
              print('REPORT',json.dumps(rec,ensure_ascii=False)[:30000])
            except Exception as e: print('REPORT_ERROR',rid,repr(e))

          print('\nSCRIPTS',len(scripts))
          for script in sorted(scripts):
            if not any(x in script.lower() for x in ['view','flex','pdf','reader','mini','paper']): continue
            try:
              rr=s.get(script,timeout=60); print('\nSCRIPT',script,'STATUS',rr.status_code,'BYTES',len(rr.content))
              body=rr.text
              for needle in ['_Addpage','Addpage','dp','fileroot','pagecount','jpg','png','svg','swf','json','freepage','vip']:
                positions=[m.start() for m in re.finditer(re.escape(needle),body,re.I)]
                if positions:
                  print('NEEDLE',needle,'COUNT',len(positions))
                  for pos in positions[:10]: print('JS_CONTEXT',re.sub(r'\s+',' ',body[max(0,pos-500):pos+1200])[:2500])
            except Exception as e: print('SCRIPT_ERROR',script,repr(e))
          PY
