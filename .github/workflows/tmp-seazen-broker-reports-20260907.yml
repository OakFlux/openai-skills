name: Temporary Seazen Group broker report search
on:
  push:
    branches:
      - tmp-seazen-broker-reports-20260907
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search public report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json,re,time
          from pathlib import Path
          from urllib.parse import quote,urljoin,urlparse,parse_qs,unquote
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('output'); OUT.mkdir(exist_ok=True)
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Accept':'text/html,application/xhtml+xml,application/json,*/*'})
          company_terms=['新城发展','新城发展控股','01030','1030.hk','seazen group','future land development']
          records=[]; links={}; logs=[]
          def log(*args):
              line=' '.join(str(x) for x in args); logs.append(line); print(line,flush=True)
          def unwrap(href):
              if not href: return ''
              try:
                  p=urlparse(href); q=parse_qs(p.query)
                  if 'uddg' in q: return unquote(q['uddg'][0])
                  if 'url' in q and any(x in p.netloc for x in ['bing.com','sogou.com']): return unquote(q['url'][0])
              except Exception: pass
              return href
          def add_link(url,text='',source=''):
              if not url: return
              url=unwrap(url)
              if url.startswith('//'): url='https:'+url
              if not url.startswith(('http://','https://')): return
              low=(url+' '+text).lower()
              if any(x in low for x in ['新城发展','01030','seazen','future land','fxbaogao','reportify','hangyan.co/reports','sgpjbg','vzkoo','yanbao','dfcfw','pdf']):
                  links.setdefault(url,{'url':url,'text':text[:1000],'source':source})

          # 1) Public report index API
          try:
              ss=requests.Session(); ss.headers.update({'User-Agent':UA,'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report','Content-Type':'application/json;charset=UTF-8','Accept':'application/json, text/plain, */*'})
              endpoint='https://api.sdyanbao.com/api/file/search'
              for kw in ['新城发展','新城发展控股','01030','1030.HK','Seazen Group','Future Land Development']:
                  for page in range(1,10):
                      body={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':page,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','keyword':kw}
                      r=ss.post(endpoint,json=body,timeout=90)
                      obj=r.json(); files=(obj.get('data') or {}).get('files') or []
                      log('SD_PAGE',kw,page,r.status_code,len(files),(obj.get('data') or {}).get('total'))
                      if not files: break
                      for f in files:
                          searchable=' '.join(str(f.get(k) or '') for k in ['name','content'])+' '+json.dumps(f.get('stock') or {},ensure_ascii=False)+' '+json.dumps(f.get('organization') or {},ensure_ascii=False)
                          if not any(t.lower() in searchable.lower() for t in company_terms): continue
                          rec={k:f.get(k) for k in ['id','name','page_count','size','time_text','create_time','original_id','page_url','share_url','file_size','status','online_url','hash','data_source','data_source_uuid','download_url','url','source_url']}
                          rec['organization']=f.get('organization'); rec['stock']=f.get('stock'); rec['type']=f.get('type'); rec['keyword']=kw
                          records.append(rec); log('SD_MATCH',json.dumps(rec,ensure_ascii=False))
                          for k in ['page_url','share_url','online_url','download_url','url','source_url']:
                              add_link(f.get(k),str(f.get('name') or ''),'sdyanbao')
                      if len(files)<100: break
          except Exception as e: log('SD_ERR',repr(e))

          # 2) Direct site searches / public catalogues
          direct_urls=[
              'https://www.hangyan.co/reports?q='+quote('新城发展'),
              'https://www.hangyan.co/reports?q='+quote('新城发展控股'),
              'https://www.fxbaogao.com/search?keywords='+quote('新城发展'),
              'https://www.fxbaogao.com/search?keyword='+quote('新城发展'),
              'https://www.fxbaogao.com/search?q='+quote('新城发展'),
              'https://reportify.cn/search?q='+quote('新城发展'),
              'https://www.sgpjbg.com/search.html?q='+quote('新城发展'),
          ]
          for u in direct_urls:
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  soup=BeautifulSoup(r.text,'lxml'); title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  body=' '.join(soup.get_text(' ',strip=True).split())[:80000]
                  log('DIRECT',r.status_code,len(r.content),r.url,title)
                  hits=[]
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a.get('href')); text=' '.join(a.get_text(' ',strip=True).split())
                      context=''
                      parent=a.find_parent(['article','li','section','div'])
                      if parent: context=' '.join(parent.get_text(' ',strip=True).split())[:2000]
                      hay=(text+' '+context).lower()
                      if any(t.lower() in hay for t in company_terms):
                          rec={'url':href,'text':text,'context':context,'source':r.url}; hits.append(rec); add_link(href,text+' '+context,'direct')
                  log('DIRECT_HITS',r.url,len(hits))
                  records.append({'direct_url':u,'final_url':r.url,'status':r.status_code,'title':title,'hits':hits,'body_head':body[:15000]})
              except Exception as e: log('DIRECT_ERR',u,repr(e))

          # 3) General search engines, exact and broad queries
          queries=[
              '"新城发展" 券商 深度报告 PDF',
              '"新城发展控股" 券商 研究报告 PDF',
              '"新城发展" 首次覆盖 报告',
              '"新城发展" 公司深度报告',
              '"01030.HK" equity research report PDF',
              '"Seazen Group" equity research PDF',
              '"Future Land Development" research report PDF',
              'site:fxbaogao.com/detail "新城发展"',
              'site:reportify.cn/reports "新城发展"',
              'site:hangyan.co/reports "新城发展"',
              'site:data.eastmoney.com/report/info "新城发展"',
              '"新城发展" filetype:pdf 券商',
          ]
          engines={
              'bing':lambda q:'https://www.bing.com/search?q='+quote(q)+'&count=50',
              'duck':lambda q:'https://html.duckduckgo.com/html/?q='+quote(q),
              'sogou':lambda q:'https://www.sogou.com/web?query='+quote(q)+'&num=50',
              'baidu':lambda q:'https://www.baidu.com/s?wd='+quote(q)+'&rn=50',
              'so360':lambda q:'https://www.so.com/s?q='+quote(q),
          }
          search_dump=[]
          for q in queries:
              for en,builder in engines.items():
                  u=builder(q)
                  try:
                      r=s.get(u,timeout=45,allow_redirects=True)
                      soup=BeautifulSoup(r.text,'lxml'); found=[]
                      for a in soup.find_all('a',href=True):
                          href=a.get('href') or ''; text=' '.join(a.get_text(' ',strip=True).split())
                          if href.startswith('/'): href=urljoin(r.url,href)
                          href=unwrap(href)
                          if not href.startswith('http'): continue
                          low=(href+' '+text).lower()
                          if any(t.lower() in low for t in company_terms) or any(x in low for x in ['fxbaogao','reportify','hangyan','sgpjbg','vzkoo','yanbao','pdf.dfcfw']):
                              found.append({'url':href,'text':text}); add_link(href,text,f'{en}:{q}')
                      search_dump.append({'engine':en,'query':q,'status':r.status_code,'bytes':len(r.content),'final_url':r.url,'found':found})
                      log('SEARCH',en,q,r.status_code,len(r.content),'FOUND',len(found))
                  except Exception as e:
                      search_dump.append({'engine':en,'query':q,'url':u,'error':repr(e)}); log('SEARCH_ERR',en,q,repr(e))
                  time.sleep(0.08)

          # 4) Visit likely candidate pages, extract metadata and public file/page-image URLs
          probes=[]
          for i,(u,meta) in enumerate(list(links.items())[:500],1):
              try:
                  r=s.get(u,timeout=(15,75),allow_redirects=True,headers={'Referer':'https://www.bing.com/','Accept':'text/html,application/pdf,*/*'})
                  data=r.content; ct=(r.headers.get('content-type') or '').lower()
                  row={**meta,'status':r.status_code,'bytes':len(data),'content_type':ct,'final_url':r.url}
                  if data[:5]==b'%PDF-':
                      row['is_pdf']=True
                  elif 'html' in ct or data.lstrip().startswith(b'<'):
                      text=r.text.replace('\\/','/').replace('&amp;','&'); soup=BeautifulSoup(text,'lxml')
                      row['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                      row['h1']=' '.join((soup.find('h1').get_text(' ',strip=True) if soup.find('h1') else '').split())
                      row['body_head']=' '.join(soup.get_text(' ',strip=True).split())[:15000]
                      found_urls=[]
                      for pattern in [r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',r'https?://[^"\'<>\s]+?/report-image/[^"\'<>\s]+?\.png(?:\?[^"\'<>\s]*)?']:
                          found_urls += re.findall(pattern,text,re.I)
                      row['file_urls']=list(dict.fromkeys(found_urls))[:100]
                      for fu in row['file_urls']: add_link(fu,row.get('title',''),'probe')
                  probes.append(row); log('PROBE',i,r.status_code,len(data),ct,r.url,row.get('title','')[:100])
              except Exception as e: probes.append({**meta,'error':repr(e)}); log('PROBE_ERR',u,repr(e))

          (OUT/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'search_dump.json').write_text(json.dumps(search_dump,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'candidate_links.json').write_text(json.dumps(list(links.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'search_log.txt').write_text('\n'.join(logs),encoding='utf-8')
          log('FINAL_COUNTS','records',len(records),'links',len(links),'probes',len(probes))
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: seazen-broker-report-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
