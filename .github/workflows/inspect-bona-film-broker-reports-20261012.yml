name: Inspect Bona Film broker reports 20261012

on:
  push:
    paths:
      - '.github/workflows/inspect-bona-film-broker-reports-20261012.yml'
  workflow_dispatch:

# trigger metadata inspection
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query report metadata
        run: |
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          api='https://reportapi.eastmoney.com/report/list'
          for qtype in ['0','1','2']:
              print('QTYPE',qtype)
              for page in range(1,8):
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2008-01-01','endTime':'2026-10-12','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'001330','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  r=s.get(api,params=params,timeout=120)
                  print('STATUS',page,r.status_code,len(r.content)); r.raise_for_status()
                  rows=r.json().get('data') or []
                  print('COUNT',len(rows))
                  for row in rows:
                      print('ROW',json.dumps(row,ensure_ascii=False))
                  if len(rows)<100: break
                  time.sleep(1)
          PY
