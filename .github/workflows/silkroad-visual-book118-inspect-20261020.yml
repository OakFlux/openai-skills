name: Inspect Silkroad Visual Book118 preview 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-book118-inspect-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml playwright
          python -m playwright install chromium

      - name: Inspect page and browser network
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import html
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          URLS = [
              'https://max.book118.com/html/2017/0516/107124143.shtm',
              'https://m.book118.com/html/2017/0516/107124143.shtm',
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          for url in URLS:
              print('\n\n######## REQUESTS', url)
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
                  print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CT',r.headers.get('content-type'))
                  soup=BeautifulSoup(text,'lxml')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                  print('TEXT',re.sub(r'\s+',' ',soup.get_text(' ',strip=True))[:5000])
                  print('HTML_HEAD',repr(text[:10000]))
                  print('HTML_TAIL',repr(text[-20000:]))
                  assets=[]
                  for tag in soup.find_all(['img','script','iframe','embed','object','a','link']):
                      for attr in ['src','href','data','data-src','data-original','value']:
                          val=tag.get(attr)
                          if val:
                              target=urljoin(r.url,html.unescape(str(val)))
                              blob=target.lower()
                              if any(k in blob for k in ['view-cache','book118','preview','image','page','png','jpg','webp','pdf','api']):
                                  assets.append({'tag':tag.name,'attr':attr,'url':target[:2000]})
                  print('ASSETS',json.dumps(assets[:500],ensure_ascii=False))
                  patterns=[
                      r'https?://[^\s\"\'<>]+?\.(?:png|jpe?g|webp|pdf)(?:\?[^\s\"\'<>]*)?',
                      r'view-cache[^\n]{0,1000}',
                      r'preview[^\n]{0,1500}',
                      r'page[^\n]{0,1000}',
                      r'project[_-]?id[^\n]{0,500}',
                      r'doc[_-]?id[^\n]{0,500}',
                      r'107124143[^\n]{0,1000}',
                  ]
                  for pat in patterns:
                      found=re.findall(pat,text,flags=re.I|re.S)
                      print('PATTERN',pat,'COUNT',len(found),'SAMPLE',found[:100])
              except Exception as exc:
                  print('REQUEST_ERROR',repr(exc))

          async def browser_probe():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  context=await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
                      locale='zh-CN',
                      viewport={'width':1440,'height':1000},
                  )
                  for start in URLS:
                      page=await context.new_page()
                      requests_log=[]
                      responses=[]
                      def on_request(req):
                          try:
                              blob=req.url.lower()
                              if any(k in blob for k in ['view-cache','book118','preview','image','page','png','jpg','webp','pdf','api']):
                                  requests_log.append({'method':req.method,'url':req.url,'type':req.resource_type,'post_data':req.post_data})
                          except Exception:
                              pass
                      async def on_resp(resp):
                          try:
                              ct=(resp.headers.get('content-type') or '').lower()
                              blob=(resp.url+' '+ct).lower()
                              if any(k in blob for k in ['view-cache','book118','preview','image','page','png','jpg','webp','pdf','api']):
                                  item={'status':resp.status,'url':resp.url,'ct':ct}
                                  if resp.status==200 and ('json' in ct or 'text' in ct or 'javascript' in ct):
                                      try:item['body']=(await resp.text())[:50000]
                                      except Exception as exc:item['body_error']=repr(exc)
                                  responses.append(item)
                          except Exception:
                              pass
                      page.on('request',on_request)
                      page.on('response',lambda resp:asyncio.create_task(on_resp(resp)))
                      print('\n\n######## BROWSER',start)
                      try:
                          await page.goto(start,wait_until='domcontentloaded',timeout=60000)
                      except Exception as exc:
                          print('GOTO_ERROR',repr(exc),page.url)
                      await page.wait_for_timeout(10000)
                      # Scroll to trigger lazy loading.
                      for _ in range(15):
                          try:await page.mouse.wheel(0,2500)
                          except Exception:pass
                          await page.wait_for_timeout(500)
                      print('FINAL',page.url,'TITLE',await page.title())
                      try:print('BODY',re.sub(r'\s+',' ',(await page.locator('body').inner_text())[:10000]))
                      except Exception as exc:print('BODY_ERROR',repr(exc))
                      try:
                          imgs=await page.locator('img').evaluate_all("els=>els.map(x=>({src:x.src,dataSrc:x.getAttribute('data-src'),dataOriginal:x.getAttribute('data-original'),alt:x.alt,width:x.naturalWidth,height:x.naturalHeight})).filter(x=>x.src||x.dataSrc||x.dataOriginal)")
                      except Exception as exc:
                          imgs=[];print('IMG_ERROR',repr(exc))
                      print('IMAGES',json.dumps(imgs[:500],ensure_ascii=False))
                      print('REQUESTS_LOG',json.dumps(requests_log[:1000],ensure_ascii=False))
                      print('RESPONSES',json.dumps(responses[:1000],ensure_ascii=False))
                      await page.close()
                  await browser.close()
          asyncio.run(browser_probe())
          PY
