name: Build Sunway Chemical related broker research 20261014

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-related-research-package-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          from typing import Any
          import requests
          from pypdf import PdfReader

          TODAY='2026-10-14'; CODE='002469'; COMPANY='三维化学'; FULL_COMPANY='山东三维化学集团股份有限公司'
          PACKAGE='三维化学_002469_券商研究资料_1份公司深度_2份化工工程同业深度'
          WORK=Path('sunway_related_work'); DOWNLOADS=WORK/'downloads'; FINAL=WORK/'final'/PACKAGE
          ART=Path('artifact_out'); VERIFY=Path('verification_renders')
          for d in (DOWNLOADS,FINAL,ART,VERIFY): d.mkdir(parents=True,exist_ok=True)

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def safe(text): return re.sub(r'[\\/:*?"<>|]+','_',text).strip(' ._')[:105]
          def qcheck(path):
              r=subprocess.run(['qpdf','--check',str(path)],capture_output=True,text=True)
              if r.returncode not in (0,3): raise RuntimeError(r.stderr[-800:])
          def read_pdf(path,max_pages=45):
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages); parts=[]
              idx=list(range(min(max_pages,pages)))
              if pages>50: idx.extend(range(max(0,pages-5),pages))
              for i in dict.fromkeys(idx):
                  try: parts.append(reader.pages[i].extract_text() or '')
                  except Exception: pass
              return pages,'\n'.join(parts)
          def download(urls,target):
              last=''
              for attempt in range(1,5):
                  for url in urls:
                      try:
                          r=s.get(url,timeout=(30,420),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'})
                          print('PDF',target.name,attempt,r.status_code,len(r.content),url,flush=True)
                          if r.status_code==200 and len(r.content)>100000 and r.content.startswith(b'%PDF-'):
                              target.write_bytes(r.content); return str(r.url)
                          last=f'{r.status_code}/{len(r.content)}'
                      except Exception as e: last=repr(e)
                  time.sleep(attempt)
              raise RuntimeError(f'No complete PDF for {target.name}: {last}')

          # Direct company deep report: public original PDF, 37 pages.
          direct_info='AP202505161673828576'
          direct_path=DOWNLOADS/f'{direct_info}.pdf'
          direct_source=download([
              f'https://pdf.dfcfw.com/pdf/H3_{direct_info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{direct_info}_01.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{direct_info}_1.pdf',
          ],direct_path)
          pages,text=read_pdf(direct_path)
          if pages<30 or not (COMPANY in text or FULL_COMPANY in text or CODE in text): raise RuntimeError('Direct report validation failed')
          if not any(x in text for x in ['证券研究报告','公司研究','首次覆盖','深度报告','投资评级']): raise RuntimeError('Direct research identity failed')
          qcheck(direct_path)
          direct_record={
              'stock_code':CODE,'stock_name':COMPANY,'broker':'国信证券','publish_date':'2025-05-16',
              'title':'受益于新疆煤化工建设提速，“工程+实业”携手并进',
              'document_type':'三维化学公司专属长篇深度/首次覆盖报告','pages':pages,'bytes':direct_path.stat().st_size,
              'sha256':sha(direct_path),'source_url':direct_source,'pdf_path':str(direct_path),'peer_report':False,
          }
          print('DIRECT_VALIDATED',json.dumps(direct_record,ensure_ascii=False),flush=True)

          report_api='https://reportapi.eastmoney.com/report/list'
          specs=[
              {'code':'603698','name':'航天工程','weight':180,'relation':'煤气化核心技术及新疆煤化工工程业务，与三维化学工程板块的煤化工景气逻辑高度相关。'},
              {'code':'002140','name':'东华科技','weight':170,'relation':'化工工程设计与EPC总承包龙头，可比较订单获取、项目执行及化工新材料转型。'},
              {'code':'601117','name':'中国化学','weight':145,'relation':'大型化工工程承包商，可用于比较行业景气、海外订单及EPC商业模式。'},
              {'code':'603637','name':'镇海股份','weight':140,'relation':'石化工程设计及总承包企业，与三维化学传统工程技术服务业务较为接近。'},
          ]
          candidates=[]; metadata={}
          deep_terms=['深度','首次覆盖','公司研究','煤化工','气化','化工工程','工程设计','EPC','新疆','新材料']
          short_terms=['季报点评','年报点评','中报点评','事件点评','信息更新','业绩预告','业绩快报','跟踪报告']
          for spec in specs:
              rows=[]
              for page in range(1,4):
                  r=s.get(report_api,params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2018-01-01','endTime':TODAY,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':spec['code'],'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)},timeout=(25,180))
                  print('REPORT_API',spec['code'],page,r.status_code,len(r.content),flush=True); r.raise_for_status(); batch=r.json().get('data') or []; rows.extend(batch)
                  if len(batch)<100: break
              metadata[spec['code']]=rows
              for row in rows:
                  title=str(row.get('title') or '').strip(); info=str(row.get('infoCode') or '').strip(); pages_meta=int(row.get('attachPages') or 0)
                  if not title or not info or pages_meta<18: continue
                  if any(t in title for t in short_terms): continue
                  score=spec['weight']+pages_meta*3+(190 if any(t in title for t in deep_terms) else 0)+(50 if str(row.get('publishDate') or '')[:10]>='2024-01-01' else 0)
                  candidates.append((score,row,spec))

          candidates.sort(key=lambda x:x[0],reverse=True); peers=[]; used_companies=set(); used_hashes={direct_record['sha256']}
          for score,row,spec in candidates:
              if len(peers)>=2: break
              if spec['name'] in used_companies: continue
              info=str(row.get('infoCode') or ''); target=DOWNLOADS/f'{info}.pdf'
              try:
                  source_url=download([f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf'],target)
                  pgs,txt=read_pdf(target)
                  if pgs<18 or (spec['name'] not in txt and spec['code'] not in txt): raise RuntimeError('peer identity/length')
                  if not any(m in txt for m in ['证券研究报告','公司研究','首次覆盖','深度报告','投资评级','研究报告']): raise RuntimeError('research identity')
                  qcheck(target); digest=sha(target)
                  if digest in used_hashes: raise RuntimeError('duplicate')
                  used_hashes.add(digest); used_companies.add(spec['name'])
                  rec={'stock_code':spec['code'],'stock_name':spec['name'],'broker':str(row.get('orgSName') or row.get('orgName') or '未知券商'),'publish_date':str(row.get('publishDate') or '')[:10],'title':str(row.get('title') or '').strip(),'document_type':'煤化工/化工工程同业长篇深度或首次覆盖报告','relation_to_sunway':spec['relation'],'pages':pgs,'bytes':target.stat().st_size,'sha256':digest,'source_url':source_url,'pdf_path':str(target),'peer_report':True,'selection_score':score}
                  peers.append(rec); print('PEER_VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e:
                  print('PEER_REJECT',spec['name'],row.get('title'),repr(e),flush=True); target.unlink(missing_ok=True)
          if len(peers)<2: raise RuntimeError(f'Only {len(peers)} peer deep reports validated')

          records=[direct_record]+peers; manifest=[]
          for i,rec in enumerate(records,1):
              tag='公司深度' if not rec['peer_report'] else '同业深度'
              filename=f"{i:02d}_{tag}_{safe(rec['publish_date'])}_{safe(rec['broker'])}_{safe(rec['stock_name'])}_{safe(rec['title'])}.pdf"
              shutil.copy2(rec['pdf_path'],FINAL/filename); clean={k:v for k,v in rec.items() if k!='pdf_path'}; clean['filename']=filename; manifest.append(clean)

          readme=['三维化学（002469.SZ）券商研究资料包',f'整理日期：{TODAY}','','检索结论与收录口径：','1. 公开研报数据库中能够直接下载并完成全文核验的三维化学公司专属长篇深度报告为1份。','2. 为满足2—3份的需求，本包另收录2份业务最接近的煤化工/化工工程同业长篇深度报告。','3. 同业报告用于比较煤化工景气、工程设计/EPC模式、订单执行和新材料转型，不代表券商对三维化学本身的评级、目标价或盈利预测。','4. 未使用网页摘要、缺页预览、媒体文章或无法核验全文的文件。','','文件清单：']
          for i,rec in enumerate(manifest,1):
              readme += [f'{i}. {rec["filename"]}',f'   类型：{rec["document_type"]}',f'   公司：{rec["stock_name"]}；券商：{rec["broker"]}；日期：{rec["publish_date"]}；页数：{rec["pages"]}',f'   标题：{rec["title"]}']
              if rec.get('relation_to_sunway'): readme.append(f'   与三维化学的可比性：{rec["relation_to_sunway"]}')
              readme += [f'   来源：{rec["source_url"]}',f'   SHA-256：{rec["sha256"]}','']
          readme.append('完整性核验：已检查报告主体、券商研究属性、实际页数、PDF文件头、qpdf结构、重复文件和SHA-256；每份PDF首页已渲染，最终ZIP已通过CRC测试。')
          (FINAL/'00_文件清单与口径说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (FINAL/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (FINAL/'同业研报检索元数据.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          (FINAL/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')
          for i,rec in enumerate(manifest,1):
              rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(FINAL/rec['filename']),str(VERIFY/f'{i:02d}')],capture_output=True,text=True)
              if rr.returncode!=0: raise RuntimeError(rr.stderr[-800:])
          zip_path=ART/f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in sorted(FINAL.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad: raise RuntimeError('ZIP CRC '+bad)
              if len(pdfs)!=3: raise RuntimeError(f'Expected 3 PDFs, found {len(pdfs)}')
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',sha(zip_path),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: sunway-chemical-002469-related-research-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: sunway-chemical-002469-related-research-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
