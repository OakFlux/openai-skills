name: Test SSE prospectus gzip response

on:
  push:
    branches: [tmp-trina-solar-688599-reports-20261016]
    paths: ['.github/workflows/tmp-trina-sse-pdf-decompress-test-20261016.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, urllib.request
          url='https://www.sse.com.cn/disclosure/listedinfo/bulletin/star/c/688599_20200604_2.pdf'
          req=urllib.request.Request(url,headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=688599',
            'Accept':'application/pdf,*/*;q=0.8',
          })
          with urllib.request.urlopen(req,timeout=180) as r:
            raw=r.read(); print('STATUS',r.status,'FINAL',r.geturl(),'HEADERS',dict(r.headers))
          print('RAW',len(raw),raw[:80])
          if raw.startswith(b'\x1f\x8b'):
            raw=gzip.decompress(raw)
          print('DECOMP',len(raw),raw[:160])
          open('candidate.bin','wb').write(raw)
          PY
          file candidate.bin
          head -c 16 candidate.bin | od -An -tx1
