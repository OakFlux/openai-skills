name: Build China Longgong 03339 report package v2 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-03339-final-package-v2-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from pypdf import PdfReader

          PACKAGE = '中国龙工_03339_2020-2025年报_最新中期报告_官方原件'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)

          docs = [
            ('01_中国龙工_03339_2020年年度报告.pdf','中国龙工2020年年度报告',2020,'年度报告','2021-04-28','/files/202104/20210428102237192.pdf',90),
            ('02_中国龙工_03339_2021年年度报告.pdf','中国龙工2021年年度报告',2021,'年度报告','2022-04-26','/upload/file/2022/04/29/f5716fe7855a4838b1eb8874b821f7a8.pdf',90),
            ('03_中国龙工_03339_2022年年度报告.pdf','中国龙工2022年年度报告',2022,'年度报告','2023-04-27','/upload/file/2023/04/27/8599a77327064e9eaef8d393babad2f3.pdf',90),
            ('04_中国龙工_03339_2023年年度报告.pdf','中国龙工2023年年度报告',2023,'年度报告','2024-04-26','/upload/file/2024/04/26/9f15f94c19bd429092c5e7ba0f7a20d9.pdf',90),
            ('05_中国龙工_03339_2024年年度报告.pdf','中国龙工2024年年度报告',2024,'年度报告','2025-05-07','/upload/file/2025/05/07/f6fe21995ceb4424999063c482b45918.pdf',90),
            ('06_中国龙工_03339_2025年年度报告.pdf','中国龙工2025年年度报告',2025,'年度报告','2026-05-06','/upload/file/2026/05/06/9e6af258e18f44a28f0eb11ab7183f75.pdf',90),
            ('07_中国龙工_03339_2025年中期报告_官网最新中报.pdf','中国龙工2025年中期报告',2025,'最新中期报告','2025-10-07','/upload/file/2025/10/07/7a791cb0539248b58e4e2b6cb825e1b9.pdf',40),
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
            'Referer':'https://www.lonking.cn/invest/periodic-reports.htm',
          })

          def urls(path, title):
            return [
              'https://www.lonking.cn' + path,
              'https://www.lonking.cn/core/control/common/down.jsp?filename=' + quote(path, safe='/') + '&title=' + quote(title),
            ]

          def download(path, title, dest):
            errors=[]
            for url in urls(path,title):
              for attempt in range(1,4):
                part=dest.with_suffix('.pdf.part')
                try:
                  with s.get(url,timeout=(30,300),stream=True,allow_redirects=True) as r:
                    print('DOWNLOAD',dest.name,attempt,r.status_code,url,'FINAL',r.url,flush=True)
                    r.raise_for_status()
                    with part.open('wb') as f:
                      for chunk in r.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                  if part.stat().st_size < 300_000 or part.read_bytes()[:5] != b'%PDF-':
                    raise RuntimeError(f'invalid response size={part.stat().st_size}')
                  part.replace(dest)
                  return r.url
                except Exception as exc:
                  errors.append(f'{url} attempt {attempt}: {exc!r}')
                  part.unlink(missing_ok=True)
                  time.sleep(attempt)
            raise RuntimeError(f'download failed {dest.name}: {errors}')

          def identity_ok(reader):
            n=len(reader.pages)
            idx=list(range(min(20,n))) + list(range(max(0,n-3),n))
            text=[]
            for i in dict.fromkeys(idx):
              try: text.append(reader.pages[i].extract_text() or '')
              except Exception: pass
            sample='\n'.join(text).lower()
            return any(x in sample for x in ['china longgong','lonking holdings','中國龍工','中国龙工','03339','3339'])

          records=[]; hashes=set()
          for filename,title,year,category,date,path,min_pages in docs:
            dest=root/filename
            final_url=download(path,title,dest)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages < min_pages: raise RuntimeError(f'page count too small: {filename} {pages}')
            if not identity_ok(reader): raise RuntimeError(f'company identity failed: {filename}')
            q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
            if q.returncode not in (0,3): raise RuntimeError(f'qpdf failed: {filename}: {q.stderr[-1500:]}')
            data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in hashes: raise RuntimeError(f'duplicate PDF: {filename}')
            hashes.add(sha)
            rec={'filename':filename,'title':title,'report_year':year,'category':category,'disclosure_date':date,'source':'中国龙工官网定期报告栏目','source_url':final_url,'pages':pages,'bytes':len(data),'sha256':sha}
            records.append(rec)
            print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          annual=[r for r in records if r['category']=='年度报告']
          if [r['report_year'] for r in annual] != [2020,2021,2022,2023,2024,2025]: raise RuntimeError('annual coverage mismatch')
          if len(records)!=7: raise RuntimeError('document count mismatch')

          readme=[
            '中国龙工控股有限公司（03339.HK）2020—2025年年度报告及官网最新中期报告',
            '整理日期：2026-09-26','',
            '收录：2020—2025年完整年度报告6份，以及官网“定期报告”栏目当前列出的最新中期报告——2025年中期报告1份，共7份官方PDF。','',
            '关于“最新季报”：中国龙工官网未列出独立季度报告。截至整理日，最新完整中期报告为2025年中期报告，因此以该文件替代“最新季报”。','',
            '官方报告索引：https://www.lonking.cn/invest/periodic-reports.htm','',
            '文件清单：'
          ]
          for i,r in enumerate(records,1):
            readme += [f"{i}. {r['title']}",f"   文件：{r['filename']}",f"   披露日期：{r['disclosure_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          readme += ['完整性核验：PDF文件头、公司身份、页数、qpdf结构、重复文件、SHA-256及ZIP CRC。']
          (root/'00_文件清单与范围说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
            for p in sorted(root.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad: raise RuntimeError('ZIP CRC failed: '+bad)
            if len(pdfs)!=7: raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-03339-annual-interim-final-v2
          path: 中国龙工_03339_2020-2025年报_最新中期报告_官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
