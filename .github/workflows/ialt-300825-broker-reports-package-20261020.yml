name: Package IAT Auto broker deep reports 20261020

on:
  push:
    paths:
      - '.github/workflows/ialt-300825-broker-reports-package-20261020.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          root = Path('阿尔特_300825_券商深度报告_完整版3份_截至20261020')
          preview_dir = root / '首页预览'
          root.mkdir(parents=True, exist_ok=True)
          preview_dir.mkdir(exist_ok=True)

          reports = [
            {
              'date':'2025-08-13','broker':'华金证券','analysts':'黄程保','rating':'买入',
              'title':'乘汽车产业变革东风，“AI+出海”双轮驱动成长新周期',
              'info_code':'AP202508131726696237','expected_pages':40,
              'filename':'2025-08-13_华金证券_乘汽车产业变革东风_AI加出海双轮驱动成长新周期.pdf',
              'type':'公司深度报告'
            },
            {
              'date':'2023-05-17','broker':'西南证券','analysts':'郑连声','rating':'买入',
              'title':'优质独立汽车设计公司，新业务打开成长空间',
              'info_code':'AP202305171586714993','expected_pages':31,
              'filename':'2023-05-17_西南证券_优质独立汽车设计公司_新业务打开成长空间.pdf',
              'type':'公司深度报告'
            },
            {
              'date':'2025-04-03','broker':'开源证券','analysts':'赵旭杨、王镇涛','rating':'买入',
              'title':'公司首次覆盖报告：海外订单放量驱动新增长，汽车设计龙头再启航',
              'info_code':'AP202504031650936042','expected_pages':28,
              'filename':'2025-04-03_开源证券_首次覆盖报告_海外订单放量驱动新增长_汽车设计龙头再启航.pdf',
              'type':'首次覆盖报告'
            },
          ]

          session = requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/300825.html',
            'Accept':'application/pdf,text/html;q=0.9,*/*;q=0.8',
          })

          def sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def download(item, target):
              code=item['info_code']
              candidates=[
                f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
              ]
              traces=[]
              for url in candidates:
                  for attempt in range(1,4):
                      try:
                          r=session.get(url,timeout=90,allow_redirects=True)
                          data=r.content
                          traces.append({'url':url,'status':r.status_code,'bytes':len(data),'head':repr(data[:20])})
                          if r.status_code==200 and data.startswith(b'%PDF') and len(data)>100000:
                              target.write_bytes(data)
                              return url,traces
                      except Exception as exc:
                          traces.append({'url':url,'error':repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError(f'Unable to download valid PDF for {item["info_code"]}: {traces}')

          manifest=[]
          for item in reports:
              target=root/item['filename']
              source_url,traces=download(item,target)

              q=subprocess.run(['qpdf','--check',str(target)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace')
              if q.returncode not in (0,3):
                  raise RuntimeError(f'qpdf failed for {target}: {q.returncode}\n{q.stdout}')

              reader=PdfReader(str(target))
              pages=len(reader.pages)
              if pages != item['expected_pages']:
                  raise RuntimeError(f'Unexpected page count for {target}: {pages}; expected {item["expected_pages"]}')

              txt=target.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(8,pages)),str(target),str(txt)],check=True)
              text=txt.read_text(encoding='utf-8',errors='replace')
              txt.unlink(missing_ok=True)
              identity_hits=[x for x in ['阿尔特','阿尔特汽车技术股份有限公司','300825',item['broker']] if x in text]
              if not any(x in text for x in ['阿尔特','阿尔特汽车技术股份有限公司','300825']):
                  raise RuntimeError(f'Company identity not found in first pages of {target}; hits={identity_hits}')
              if item['broker'] not in text:
                  raise RuntimeError(f'Broker identity not found in first pages of {target}')

              preview_stem=preview_dir/target.stem
              subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(target),str(preview_stem)],check=True)
              png=preview_stem.with_suffix('.png')
              if not png.exists() or png.stat().st_size < 10000:
                  raise RuntimeError(f'First-page render failed for {target}')

              entry=dict(item)
              entry.update({
                'source_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
                'source_url':source_url,
                'pages':pages,
                'bytes':target.stat().st_size,
                'sha256':sha256(target),
                'identity_hits':identity_hits,
                'qpdf_status':q.returncode,
                'qpdf_output':q.stdout.strip()[:2000],
                'download_attempts':traces,
              })
              manifest.append(entry)
              print('VERIFIED',json.dumps(entry,ensure_ascii=False,sort_keys=True))

          readme=[
            '# 阿尔特（300825）券商深度报告',
            '',
            '整理日期：2026-10-20',
            '',
            '本压缩包收录3份公开可下载的券商公司深度/首次覆盖报告原始PDF，优先选择篇幅较长、发布时间较新、研究框架较完整的报告。',
            '',
            '## 报告清单',
            '',
          ]
          for i,x in enumerate(manifest,1):
              readme += [
                f'### {i}. {x["broker"]}｜{x["date"]}｜{x["type"]}',
                f'- 标题：{x["title"]}',
                f'- 分析师：{x["analysts"]}',
                f'- 评级：{x["rating"]}',
                f'- 页数：{x["pages"]}',
                f'- 文件：{x["filename"]}',
                f'- SHA-256：`{x["sha256"]}`',
                f'- 来源页：{x["source_page"]}',
                '',
              ]
          readme += [
            '## 校验说明','',
            '- 每份PDF均检查文件头、PDF结构、实际页数、公司名称、证券代码、研究机构名称及首页渲染。',
            '- 压缩包创建后执行CRC完整性测试。',
            '- 研报内容仅代表原研究机构观点，仅供资料研究，不构成投资建议。',
          ]
          (root/'README.md').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text('\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in manifest)+'\n',encoding='utf-8')

          cn_zip=Path('阿尔特_300825_券商深度报告_完整版3份_截至20261020.zip')
          en_zip=Path('ialt_300825_broker_deep_reports_3_full_20261020.zip')
          for zpath in (cn_zip,en_zip):
              with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p,p.as_posix())
              with zipfile.ZipFile(zpath) as zf:
                  bad=zf.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')
                  pdfs=[n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if len(pdfs)!=3:
                      raise RuntimeError(f'Unexpected PDF count: {len(pdfs)}')
              print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',sha256(zpath))
          print('COUNTS',json.dumps({'reports':len(manifest),'pages':sum(x['pages'] for x in manifest)},ensure_ascii=False))
          PY

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: ialt-300825-broker-deep-reports-3-20261020
          path: |
            阿尔特_300825_券商深度报告_完整版3份_截至20261020.zip
            ialt_300825_broker_deep_reports_3_full_20261020.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
