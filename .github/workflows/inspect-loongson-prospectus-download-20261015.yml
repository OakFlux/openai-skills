name: Inspect Loongson prospectus download

on:
  push:
    paths:
      - '.github/workflows/inspect-loongson-prospectus-download-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Fetch prospectus candidate URLs
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('prospectus_inspect'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=688047',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,application/pdf;q=0.8,*/*;q=0.7',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          }
          urls=[
            'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
            'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
            'http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
            'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
            'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
            'https://static.sse.com.cn/stock/disclosure/announcement/c/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
            'https://www.sse.com.cn/stock/disclosure/announcement/c/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
          ]
          for i,url in enumerate(urls,1):
            try:
              r=s.get(url,headers=headers,timeout=90,allow_redirects=True)
              meta={'status':r.status_code,'url':url,'final_url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'history':[{'status':h.status_code,'url':h.url} for h in r.history]}
              out.joinpath(f'{i}.meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
              out.joinpath(f'{i}.body').write_bytes(r.content)
              print('RESULT',json.dumps(meta,ensure_ascii=False),flush=True)
              print('HEAD',repr(r.content[:300]),flush=True)
              if not r.content.startswith(b'%PDF'):
                text=r.content.decode(r.encoding or 'utf-8','replace')
                print('TEXT',re.sub(r'\s+',' ',text[:5000]),flush=True)
                soup=BeautifulSoup(text,'lxml')
                links=[]
                for a in soup.find_all('a',href=True): links.append(urljoin(r.url,a['href']))
                print('LINKS',json.dumps(links[:100],ensure_ascii=False),flush=True)
            except Exception as e:
              print('ERROR',url,repr(e),flush=True)
          PY
      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: loongson-prospectus-inspection-20261015
          path: prospectus_inspect
          retention-days: 7
          compression-level: 6