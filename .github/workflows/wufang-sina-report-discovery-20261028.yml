name: Inspect Wufang Sina report pages 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wufang-sina-report-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report pages
        shell: bash
        run: |
          python - <<'PY'
          import re, requests
          ids=['622715853303','621073330378','620290164120','620288520381']
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://finance.sina.com.cn/'}
          for rid in ids:
              url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
              try:
                  r=s.get(url,headers=h,timeout=(20,120),allow_redirects=True)
                  raw=r.content
                  text=None
                  for enc in ['utf-8','gb18030','gbk','latin1']:
                      try:
                          text=raw.decode(enc)
                          break
                      except Exception:
                          pass
                  text=text or raw.decode('latin1','ignore')
                  print('\nREPORT',rid,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(raw),'ENC',r.encoding,'CTYPE',r.headers.get('content-type'))
                  print('TITLE_TAG',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:3])
                  links=[]
                  for pat in [r'https?://[^\"\'<>\s]+?\.pdf(?:\?[^\"\'<>\s]*)?',r'//[^\"\'<>\s]+?\.pdf(?:\?[^\"\'<>\s]*)?',r'https?://[^\"\'<>\s]+?download[^\"\'<>\s]*']:
                      links += re.findall(pat,text,re.I)
                  print('PDF_LINKS',links[:30])
                  for key in ['pdf','down','report','rptid','attach','href']:
                      hits=[m.group(0) for m in re.finditer(r'.{0,120}'+key+r'.{0,200}',text,re.I|re.S)]
                      if hits:
                          print('KEY',key,'SAMPLES',hits[:5])
                  print('TEXT_HEAD',text[:4000].replace('\n',' ')[:4000])
              except Exception as e:
                  print('ERROR',rid,repr(e))
          PY
