name: Parse Wufang Sina visible report text 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wufang-sina-visible-text-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Parse visible report text
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          ids=['621073330378','620290164120','620288520381']
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://finance.sina.com.cn/'}
          for rid in ids:
              u=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
              r=s.get(u,headers=h,timeout=(20,120)); r.raise_for_status()
              txt=r.content.decode('gb18030','ignore')
              soup=BeautifulSoup(txt,'lxml')
              for tag in soup(['script','style','noscript']): tag.decompose()
              visible='\n'.join(line.strip() for line in soup.get_text('\n').splitlines() if line.strip())
              print('\n===== REPORT',rid,'=====')
              print(visible[:30000])
              print('\n--- KEY CONTEXTS ---')
              flat=re.sub(r'\s+',' ',visible)
              for key in ['报告日期','机构','作者','研究员','分析师','评级','五方光电','询价区间','发行价格','申购建议','预计发行价','新股询价']:
                  for m in list(re.finditer(key,flat))[:10]:
                      print(key,flat[max(0,m.start()-250):m.end()+600])
          PY
