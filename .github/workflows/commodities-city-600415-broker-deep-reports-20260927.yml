name: Build Small Commodity City broker deep report previews 20260927

on:
  push:
    paths:
      - '.github/workflows/commodities-city-600415-broker-deep-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download public previews, build PDFs and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from io import BytesIO
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '小商品城_600415_券商深度报告_公开预览版_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)
          work = Path('_small_commodity_city_work')
          work.mkdir(exist_ok=True)

          reports = [
              {
                  'id': 906747,
                  'broker': '国联民生证券',
                  'title': '小商品城（600415）深度系列2：“全球数贸中心”开业在即，市场化定价有望大幅增厚公司业绩',
                  'short_title': '深度系列2_全球数贸中心开业在即',
                  'date': '2025-08-11',
                  'rating': '以报告原页为准',
                  'analysts': '以报告原页为准',
                  'expected_total_pages': 19,
              },
              {
                  'id': 896427,
                  'broker': '申万宏源',
                  'title': '小商品城（600415）：数智化赋能贸易升级，产业链筑基关税破局',
                  'short_title': '数智化赋能贸易升级_产业链筑基关税破局',
                  'date': '2025-06-17',
                  'rating': '买入（首次覆盖）',
                  'analysts': '以报告原页为准',
                  'expected_total_pages': None,
              },
              {
                  'id': 896506,
                  'broker': '国海证券',
                  'title': '小商品城（600415）公司深度报告：产业集群实现“买卖全球”，多轮驱动价值重估',
                  'short_title': '产业集群实现买卖全球_多轮驱动价值重估',
                  'date': '2025-06-18',
                  'rating': '买入（首次覆盖）',
                  'analysts': '芦冠宇',
                  'expected_total_pages': 32,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url, payload):
              last = None
              for attempt in range(6):
                  try:
                      r = session.post(url, json=payload, timeout=(20, 120))
                      last = {'status':r.status_code,'text':r.text[:500]}
                      if r.status_code == 200:
                          return r.json()
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'POST failed {url}: {last}')

          def fetch_image(url: str) -> bytes:
              last = None
              for attempt in range(6):
                  try:
                      r = session.get(url, timeout=(20,120), allow_redirects=True, headers={
                          'User-Agent':session.headers['User-Agent'],
                          'Referer':'https://www.sdyanbao.com/',
                          'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                      })
                      last = {'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type','')}
                      if r.status_code == 200 and len(r.content) > 10000:
                          with Image.open(BytesIO(r.content)) as im:
                              im.verify()
                          return r.content
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Image download failed {url}: {last}')

          manifest = []
          for idx, report in enumerate(reports, 1):
              detail = post_json('https://api.sdyanbao.com/api/file/detail', {'id': report['id']})
              data = detail.get('data') if isinstance(detail, dict) else None
              if not isinstance(data, dict) or not data.get('page_url') or not data.get('page_count'):
                  raise RuntimeError(f'Invalid detail response for report {report["id"]}: {detail}')

              total_pages = int(data['page_count'])
              preview_pages = min(10, total_pages)
              if report['expected_total_pages'] and total_pages != report['expected_total_pages']:
                  # Keep the actual value in the manifest but do not fail; platforms can update metadata.
                  pass
              base = str(data['page_url']).rstrip('/')
              wdir = work / f'r{idx}'
              wdir.mkdir(exist_ok=True)
              page_files = []

              for pno in range(preview_pages):
                  raw = fetch_image(f'{base}/{pno}.png')
                  src = wdir / f'{pno:02d}_src.png'
                  src.write_bytes(raw)
                  with Image.open(src) as im:
                      rgba = im.convert('RGBA')
                      white = Image.new('RGBA', rgba.size, (255,255,255,255))
                      white.alpha_composite(rgba)
                      rgb = white.convert('RGB')
                      out = wdir / f'{pno:02d}.jpg'
                      rgb.save(out, 'JPEG', quality=95, subsampling=0)
                      page_files.append(out)

              safe_title = re.sub(r'[\\/:*?"<>|]+','_',report['short_title'])
              pdf_name = f'{idx:02d}_{report["broker"]}_小商品城_{safe_title}_公开预览前{preview_pages}页_{report["date"]}.pdf'
              pdf_path = root / pdf_name
              imgs = [Image.open(p).convert('RGB') for p in page_files]
              try:
                  imgs[0].save(pdf_path, save_all=True, append_images=imgs[1:], resolution=150.0, quality=95)
              finally:
                  for im in imgs:
                      im.close()

              reader = PdfReader(str(pdf_path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != preview_pages:
                  raise RuntimeError(f'PDF page mismatch {pdf_name}: {actual_pages} vs {preview_pages}')
              subprocess.run(['qpdf','--check',str(pdf_path)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = preview_dir / pdf_path.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(pdf_path),str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              cover = Path(str(prefix)+'.png')
              if not cover.exists() or cover.stat().st_size < 10000:
                  raise RuntimeError(f'Cover render failed: {pdf_name}')

              sha = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              manifest.append({
                  **report,
                  'source_detail_page':f'https://www.sdyanbao.com/detail/{report["id"]}',
                  'source_record_name':data.get('name'),
                  'page_image_base':base,
                  'original_total_pages':total_pages,
                  'public_preview_pages':preview_pages,
                  'pdf_file':pdf_name,
                  'actual_pdf_pages':actual_pages,
                  'bytes':pdf_path.stat().st_size,
                  'sha256':sha,
                  'cover_preview':str(Path('首页预览')/cover.name),
                  'validation':['all public preview images downloaded','image integrity','white-background compositing','PDF page count','qpdf structure','cover render'],
              })

          readme = [
              '小商品城（600415.SH）券商深度报告公开预览资料包',
              '整理日期：2026-09-27',
              '',
              '本包收录3份券商公司深度或首次覆盖报告的公开预览原页。',
              '完整原始PDF在相关研报平台需要账户或下载权限；本包未绕过登录、会员或付费限制，因此所有文件均明确标注为“公开预览版”。',
              '',
          ]
          for i, r in enumerate(manifest, 1):
              readme += [
                  f"{i}. {r['broker']}：《{r['title']}》",
                  f"   日期：{r['date']}；分析师：{r['analysts']}；评级：{r['rating']}",
                  f"   原报告：{r['original_total_pages']}页；本PDF：公开预览前{r['public_preview_pages']}页",
                  f"   来源页面：{r['source_detail_page']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += [
              '报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：预览图片完整性、白底校正、PDF页数、PDF结构、首页渲染、ZIP CRC及SHA-256。',
          ]

          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['pdf_file']}\n" for r in manifest), encoding='utf-8')

          zpath = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')

          print('FINAL_ZIP', zpath, zpath.stat().st_size, hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: small-commodity-city-600415-broker-deep-reports-public-previews
          path: 小商品城_600415_券商深度报告_公开预览版_3份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
