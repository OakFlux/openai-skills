name: Temporary Inspect Reportify Melco Source Attachments

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-inspect-reportify-melco.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect pages, APIs and public source links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          pages=[
            'https://reportify.cn/reports/1118968060607336448',
            'https://reportify.cn/reports/1052271542572027904',
            'https://reportify.cn/reports/962339654089314304',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://reportify.cn/'})
          result={'pages':[],'scripts':[],'probes':[]};scripts=[]
          needles=['pdf','download','sourceUrl','source_url','original','attachment','fileUrl','reportId','document','api/','oss','s3','1118968060607336448']
          for u in pages:
            try:
              r=s.get(u,timeout=60,allow_redirects=True);text=html.unescape(r.text).replace('\\/','/');soup=BeautifulSoup(text,'html.parser');links=[]
              for tag in soup.find_all(['a','script','link','iframe','img','source']):
                for attr in ['href','src','data-src','data-url','data-file','data-download']:
                  v=tag.get(attr)
                  if v:links.append(urljoin(r.url,v))
              links += re.findall(r'https?://[^"\'<>\s]+',text)
              snippets=[]
              for n in needles:
                for m in list(re.finditer(re.escape(n),text,re.I))[:100]:snippets.append({'needle':n,'text':re.sub(r'\s+',' ',text[max(0,m.start()-800):m.start()+3500])})
              page_scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')];scripts+=page_scripts
              result['pages'].append({'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':list(dict.fromkeys(links))[:5000],'snippets':snippets[:1200],'scripts':page_scripts,'head':text[:10000]})
            except Exception as e:result['pages'].append({'url':u,'error':repr(e)})
          for u in list(dict.fromkeys(scripts))[:120]:
            try:
              r=s.get(u,timeout=60);body=html.unescape(r.text).replace('\\/','/');hits=[]
              for n in needles:
                for m in list(re.finditer(re.escape(n),body,re.I))[:100]:hits.append({'needle':n,'text':re.sub(r'\s+',' ',body[max(0,m.start()-1000):m.start()+4200])})
              if hits:result['scripts'].append({'url':u,'status':r.status_code,'bytes':len(r.content),'hits':hits[:1000]})
            except Exception as e:result['scripts'].append({'url':u,'error':repr(e)})
          ids=['1118968060607336448','1052271542572027904','962339654089314304']
          bases=['https://reportify.cn/api/reports/{}','https://reportify.cn/api/report/{}','https://reportify.cn/api/v1/reports/{}','https://reportify.cn/api/documents/{}','https://reportify.cn/api/reports/{}/download','https://reportify.cn/reports/{}/download']
          for rid in ids:
            for tmpl in bases:
              u=tmpl.format(rid)
              try:
                r=s.get(u,timeout=45,allow_redirects=False);result['probes'].append({'url':u,'status':r.status_code,'location':r.headers.get('location'),'type':r.headers.get('content-type'),'bytes':len(r.content),'head':r.content[:100].hex(),'text':r.text[:12000] if 'text' in (r.headers.get('content-type') or '').lower() or 'json' in (r.headers.get('content-type') or '').lower() else ''})
              except Exception as e:result['probes'].append({'url':u,'error':repr(e)})
          Path('out').mkdir(exist_ok=True);Path('out/reportify_melco_findings.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY='+json.dumps({'pages':[(x.get('url'),x.get('status'),x.get('bytes'),x.get('title')) for x in result['pages']],'pdf_links':[u for x in result['pages'] for u in x.get('links',[]) if '.pdf' in u.lower()],'probes':[{'url':x.get('url'),'status':x.get('status'),'location':x.get('location'),'type':x.get('type'),'bytes':x.get('bytes')} for x in result['probes']]},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reportify-melco-findings
          path: out/reportify_melco_findings.json
          retention-days: 3
