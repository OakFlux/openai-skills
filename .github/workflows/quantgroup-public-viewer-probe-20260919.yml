name: Probe public Quantgroup report viewers 20260919
on:
  push:
    paths:
      - '.github/workflows/quantgroup-public-viewer-probe-20260919.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Install
        run: python -m pip install --quiet selenium requests beautifulsoup4 lxml
      - name: Probe viewers and mirrors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, html, os
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.common.exceptions import TimeoutException

          out=Path('qg_viewer_probe'); out.mkdir(exist_ok=True)
          urls=[
            ('fx_view','https://www.fxbaogao.com/view?id=5553065'),
            ('valuelist','https://www.valuelist.cn/871327.html'),
            ('yanbaoke','https://pc.yanbaoke.cn/info/6MX8BtbPRRyVQpwC5LWfy9'),
            ('eastmoney','https://caifuhao.eastmoney.com/news/20260902110412166457900'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          static=[]
          for i,(name,url) in enumerate(urls,1):
            rec={'name':name,'input':url,'links':[],'scripts':[],'regex':[]}
            try:
              r=s.get(url,timeout=(15,50),allow_redirects=True)
              rec.update(status=r.status_code,final=r.url,ctype=r.headers.get('content-type'),bytes=len(r.content))
              (out/f'{i:02d}_{name}_requests.html').write_bytes(r.content)
              print('REQUEST',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; soup=BeautifulSoup(text,'lxml')
              rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              for tag in soup.find_all(['a','script','iframe','embed','object','img','link']):
                for attr in ('href','src','data','data-src','data-url','data-file','download'):
                  v=tag.get(attr)
                  if not v: continue
                  v=html.unescape(str(v)).replace('\\/','/')
                  u=urljoin(r.url,v)
                  item={'tag':tag.name,'attr':attr,'url':u,'text':re.sub(r'\s+',' ',tag.get_text(' ',strip=True))[:300]}
                  rec['links'].append(item)
                  if tag.name=='script' and attr=='src': rec['scripts'].append(u)
              pats=[r'https?://[^\s"\'<>]+',r'(?:pdfUrl|pdf_url|fileUrl|file_url|downloadUrl|download_url|reportUrl|report_url|previewUrl|preview_url|originUrl|origin_url|src|url)\s*[:=]\s*["\']([^"\']+)',r'["\']([^"\']+\.(?:pdf|PDF)(?:\?[^"\']*)?)["\']']
              vals=set()
              for pat in pats:
                for m in re.finditer(pat,text,re.I):
                  v=(m.group(1) if m.lastindex else m.group(0)).replace('\\/','/')
                  if any(k in v.lower() for k in ('5553065','6mx8','871327','report','pdf','download','file','preview','api','attachment')): vals.add(urljoin(r.url,v))
              rec['regex']=sorted(vals)
              print('STATIC_TITLE',name,rec['title'],flush=True)
              for x in rec['links']:
                low=(x['url']+' '+x['text']).lower()
                if any(k in low for k in ('pdf','download','下载','报告原文','5553065','6mx8','871327','file','preview')): print('STATIC_LINK',name,json.dumps(x,ensure_ascii=False)[:2500],flush=True)
              for v in rec['regex']: print('STATIC_REGEX',name,v[:2500],flush=True)
              # fetch small relevant scripts and grep endpoints
              for j,su in enumerate(dict.fromkeys(rec['scripts'])):
                if j>=35: break
                try:
                  sr=s.get(su,timeout=(10,35),allow_redirects=True)
                  if sr.status_code==200 and len(sr.content)<12_000_000:
                    (out/f'{i:02d}_{name}_script_{j:02d}.js').write_bytes(sr.content)
                    st=sr.text
                    hits=[]
                    for pat in [r'https?://[^\s"\'<>]+',r'["\']([^"\']*(?:pdf|download|report-image|file|preview|attachment|view|document)[^"\']*)["\']']:
                      for m in re.finditer(pat,st,re.I):
                        v=m.group(1) if m.lastindex else m.group(0)
                        if len(v)<1200 and any(k in v.lower() for k in ('pdf','download','report-image','file','preview','attachment','5553065')): hits.append(v)
                    if hits:
                      print('SCRIPT',name,su,'bytes',len(sr.content),'hits',len(hits),flush=True)
                      for h in list(dict.fromkeys(hits))[:100]: print('JSHIT',name,h[:1200],flush=True)
                except Exception as e: print('SCRIPT_ERR',name,su,repr(e),flush=True)
            except Exception as e:
              rec['error']=repr(e); print('REQUEST_ERR',name,repr(e),flush=True)
            (out/f'{i:02d}_{name}_requests.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
            static.append(rec)

          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--disable-gpu'); opts.add_argument('--window-size=1440,2200'); opts.add_argument('--lang=zh-CN'); opts.page_load_strategy='eager'
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          dl=(out/'downloads').resolve(); dl.mkdir(exist_ok=True)
          opts.add_experimental_option('prefs',{'download.default_directory':str(dl),'download.prompt_for_download':False,'plugins.always_open_pdf_externally':True})
          d=webdriver.Chrome(options=opts); d.set_page_load_timeout(35); d.set_script_timeout(15)
          d.execute_cdp_cmd('Network.enable',{})
          d.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':str(dl)})
          brecs=[]
          def collect(label,rec):
            for z in d.get_log('performance'):
              try:
                m=json.loads(z['message'])['message']
                if m['method'] in ('Network.responseReceived','Network.requestWillBeSent'):
                  p=m['params']; obj=p.get('response') or p.get('request') or {}; u=obj.get('url',''); mime=obj.get('mimeType',''); typ=p.get('type',''); st=obj.get('status')
                  low=(u+' '+mime).lower()
                  if any(k in low for k in ('5553065','6mx8','871327','pdf','download','report-image','file','preview','attachment','api','document','oss','cos')):
                    item={'label':label,'method':m['method'],'url':u,'mime':mime,'type':typ,'status':st}; rec['network'].append(item); print('NET',rec['name'],json.dumps(item,ensure_ascii=False)[:2500],flush=True)
              except Exception: pass
          for i,(name,url) in enumerate(urls,1):
            rec={'name':name,'input':url,'network':[],'dom':[],'clicks':[],'errors':[]}
            try:
              try:d.get(url)
              except TimeoutException: print('BROWSER_TIMEOUT',name,flush=True)
              time.sleep(7)
              rec['final']=d.current_url; rec['title']=d.title; src=d.page_source
              (out/f'{i:02d}_{name}_browser.html').write_text(src,encoding='utf-8'); d.save_screenshot(str(out/f'{i:02d}_{name}.png'))
              print('BROWSER',name,d.title,d.current_url,len(src),flush=True); collect('initial',rec)
              for el in d.find_elements(By.XPATH,'//*[self::a or self::button or self::div or self::span]'):
                try:
                  txt=(el.text or '').strip(); href=el.get_attribute('href') or ''; outer=el.get_attribute('outerHTML') or ''
                  low=(txt+' '+href+' '+outer).lower()
                  if any(k in low for k in ('下载pdf','下载报告','下载原文','免费查看完整报告','点击查看原文','打开报告原文','download','\.pdf')):
                    item={'tag':el.tag_name,'text':txt[:300],'href':href,'outer':outer[:2500]}; rec['dom'].append(item); print('DOM',name,json.dumps(item,ensure_ascii=False)[:3000],flush=True)
                except Exception: pass
              # click only visible buttons explicitly advertising free view/download; do not interact with login/paywalls
              xps=["//*[contains(normalize-space(.),'点击免费查看完整报告')]","//*[contains(normalize-space(.),'免费查看完整报告')]","//*[contains(normalize-space(.),'下载PDF')]","//*[contains(normalize-space(.),'下载pdf')]","//*[contains(normalize-space(.),'下载报告')]","//a[contains(@href,'.pdf')]"]
              clicked=set()
              for xp in xps:
                for el in d.find_elements(By.XPATH,xp)[:3]:
                  try:
                    if not el.is_displayed(): continue
                    outer=el.get_attribute('outerHTML') or ''
                    if outer in clicked: continue
                    clicked.add(outer); txt=(el.text or '').strip(); before=d.current_url
                    print('CLICK',name,txt[:200],outer[:1500],flush=True)
                    d.execute_script("arguments[0].scrollIntoView({block:'center'});",el); time.sleep(.5); d.execute_script('arguments[0].click();',el); time.sleep(6)
                    after=d.current_url; rec['clicks'].append({'text':txt,'outer':outer[:2500],'before':before,'after':after}); print('AFTER',name,after,flush=True); collect('afterclick',rec)
                    if after!=before:
                      try:d.back(); time.sleep(4)
                      except Exception: pass
                  except Exception as e: rec['errors'].append('click '+repr(e))
            except Exception as e:
              rec['errors'].append(repr(e)); print('BROWSER_ERR',name,repr(e),flush=True)
            (out/f'{i:02d}_{name}_browser.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8'); brecs.append(rec)
          d.quit()
          (out/'static_all.json').write_text(json.dumps(static,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'browser_all.json').write_text(json.dumps(brecs,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DOWNLOADS')
          for p in sorted(dl.glob('*')): print(p.name,p.stat().st_size,flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-public-viewer-probe-20260919
          path: qg_viewer_probe
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
