name: Temporary Extract Sdyanbao Endpoint Candidates

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-extract-sdyanbao-endpoints.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract endpoint-like strings from Nuxt bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, requests
          from urllib.parse import urljoin

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://www.sdyanbao.com/detail/355422',
              'Accept-Language': 'zh-CN,zh;q=0.9',
          })
          page_url = 'https://www.sdyanbao.com/detail/355422'
          page = session.get(page_url, timeout=60)
          page.raise_for_status()
          text = html.unescape(page.text).replace('\\/', '/')
          scripts = [urljoin(page.url, s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)]
          print('SCRIPT_COUNT', len(scripts))
          print('SCRIPTS=' + json.dumps(scripts, ensure_ascii=False))

          keywords = ('api', 'report', 'detail', 'download', 'pdf', 'search', 'keyword', 'file', 'oss', 'document', 'yanbao')
          endpoint_re = re.compile(r'(?:(?:https?:)?//[^"\'`\\\s]+|/[A-Za-z0-9_.~!$&()*+,;=:@%/?#\-]{3,})')
          string_re = re.compile(r'(["\'`])((?:\\.|(?!\1).){1,600}?)\1', re.S)

          all_candidates = set()
          contexts = []
          for script_url in scripts:
              response = session.get(script_url, timeout=90)
              response.raise_for_status()
              body = response.text.replace('\\/', '/')
              local = set()
              for match in string_re.finditer(body):
                  value = match.group(2)
                  try:
                      value = bytes(value, 'utf-8').decode('unicode_escape')
                  except Exception:
                      pass
                  low = value.lower()
                  if any(k in low for k in keywords) and len(value) <= 600:
                      local.add(value)
                  for endpoint in endpoint_re.findall(value):
                      low_endpoint = endpoint.lower()
                      if any(k in low_endpoint for k in keywords):
                          local.add(endpoint)
              for needle in ('baseURL', 'baseUrl', 'axios.create', '$axios', 'reportId', 'report_id', 'fileUrl', 'pdfUrl', 'downloadUrl', 'detailInfo', 'reportDetail', 'searchReport'):
                  for match in list(re.finditer(re.escape(needle), body, re.I))[:20]:
                      fragment = re.sub(r'\s+', ' ', body[max(0, match.start()-220):match.start()+650])
                      contexts.append({'script': script_url, 'needle': needle, 'context': fragment})
              for value in local:
                  all_candidates.add(value)
              print('SCRIPT_SUMMARY=' + json.dumps({
                  'url': script_url,
                  'bytes': len(response.content),
                  'candidate_count': len(local),
                  'candidates': sorted(local)[:300],
              }, ensure_ascii=False))

          print('ALL_CANDIDATES=' + json.dumps(sorted(all_candidates)[:1000], ensure_ascii=False))
          dedup = []
          seen = set()
          for item in contexts:
              key = item['context']
              if key not in seen:
                  seen.add(key)
                  dedup.append(item)
          print('CONTEXTS=' + json.dumps(dedup[:250], ensure_ascii=False))
          PY
