name: Build verified Swire Pacific broker research archive
on:
  push:
    branches: [tmp-swire-package-final-20260908]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
      - name: Download pages, build PDFs, and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/reports work/pages work/renders
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, time, zipfile
          from pathlib import Path
          import img2pdf, pymupdf, requests
          from PIL import Image
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT=Path('output'); WORK=Path('work'); REPORTS=WORK/'reports'; PAGES=WORK/'pages'; RENDERS=WORK/'renders'
          specs=[
              {
                  'date':'2022-08',
                  'broker':'International investment bank',
                  'title':'Swire Pacific (0019.HK): Signs of recovery ahead; HK$4bn share buyback to help re-rating; Upgrade to Buy',
                  'base':'https://oss.sdyanbao.com/page/2022/8/22/341187',
                  'count':14,
                  'filename':'01_2022-08_International_Investment_Bank_Swire_Pacific_Signs_of_Recovery_14p.pdf',
              },
              {
                  'date':'2024-02-21',
                  'broker':'Industrial Securities',
                  'title':'Swire Pacific A (00019.HK): Expanding Southeast Asia beverage market through acquisition; maintaining frequent buybacks',
                  'base':'https://oss.sdyanbao.com/page/2024/2/21/935829',
                  'count':6,
                  'filename':'02_2024-02-21_Industrial_Securities_SE_Asia_Beverage_Expansion_6p.pdf',
              },
              {
                  'date':'2024-01-07',
                  'broker':'Industrial Securities',
                  'title':'Swire Pacific A (00019.HK): Strong cash position; stable dividends; HK$6bn buyback initiated',
                  'base':'https://oss.sdyanbao.com/page/2024/1/7/915328',
                  'count':5,
                  'filename':'03_2024-01-07_Industrial_Securities_Cash_Dividends_Buyback_5p.pdf',
              },
          ]

          retry=Retry(total=7,connect=7,read=7,status=7,backoff_factor=0.8,status_forcelist=[429,500,502,503,504],allowed_methods=frozenset(['GET']))
          s=requests.Session(); s.mount('https://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          records=[]; qa=[]

          for no,spec in enumerate(specs,1):
              page_dir=PAGES/f'report_{no}'; page_dir.mkdir(parents=True,exist_ok=True)
              paths=[]; hashes=[]; dimensions=[]
              for idx in range(spec['count']):
                  url=f"{spec['base']}/{idx}.png"
                  r=s.get(url,headers={'Referer':spec['base'],'Accept':'image/png,image/*,*/*;q=0.8'},timeout=(30,180))
                  r.raise_for_status(); data=r.content
                  if len(data)<5000: raise RuntimeError(f'Page too small: {url} {len(data)}')
                  with Image.open(io.BytesIO(data)) as im:
                      im.verify()
                  with Image.open(io.BytesIO(data)) as im:
                      width,height=im.size; fmt=im.format
                  if width<600 or height<600: raise RuntimeError(f'Unexpected dimensions: {url} {width}x{height}')
                  digest=hashlib.sha256(data).hexdigest()
                  if digest in hashes: raise RuntimeError(f'Duplicate page in report {no}: {idx+1}')
                  path=page_dir/f'{idx+1:03d}.png'; path.write_bytes(data)
                  paths.append(path); hashes.append(digest); dimensions.append(f'{width}x{height}')
                  print('PAGE_OK',no,idx+1,len(data),width,height,fmt,digest[:12],flush=True)
                  time.sleep(0.12)
              extra=s.get(f"{spec['base']}/{spec['count']}.png",headers={'Referer':spec['base'],'Accept':'image/png,image/*,*/*;q=0.8'},timeout=(20,90))
              print('NEXT_PAGE_STATUS',no,extra.status_code,len(extra.content),flush=True)
              pdf_path=REPORTS/spec['filename']
              pdf_path.write_bytes(img2pdf.convert([str(p) for p in paths]))
              pdf_data=pdf_path.read_bytes()
              if not pdf_data.startswith(b'%PDF'): raise RuntimeError(f'Not PDF: {pdf_path}')
              reader=PdfReader(io.BytesIO(pdf_data),strict=False); actual=len(reader.pages)
              if actual!=spec['count']: raise RuntimeError(f'Page count mismatch {pdf_path}: {actual}')
              doc=pymupdf.open(pdf_path); pix=doc[0].get_pixmap(matrix=pymupdf.Matrix(1.5,1.5),alpha=False)
              render=RENDERS/f'report_{no}_first_page.png'; pix.save(str(render)); doc.close(); qa.append(render)
              rec={
                  '序号':no,'券商_待封面复核':spec['broker'],'报告日期_待封面复核':spec['date'],'报告标题':spec['title'],
                  '实际PDF页数':actual,'文件大小_字节':len(pdf_data),'SHA256':hashlib.sha256(pdf_data).hexdigest(),
                  '公开逐页来源':spec['base'],'下一页HTTP状态':extra.status_code,'页面尺寸':';'.join(sorted(set(dimensions))),
                  '文件版本说明':'Complete public original-page image sequence merged into PDF without page deletion or reordering',
                  '文件名':pdf_path.name,
              }
              records.append(rec)

          manifest=REPORTS/'manifest_provisional.csv'
          with manifest.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(records[0].keys())); w.writeheader(); w.writerows(records)
          readme=REPORTS/'README_provisional.txt'
          readme.write_text('Swire Pacific Limited A (00019.HK) broker research package\n\nContains three complete PDFs reconstructed from complete publicly displayed original page sequences. Broker/date labels will be checked against rendered cover pages before final delivery.\n',encoding='utf-8')

          # Build QA contact sheet.
          cards=[]
          for p in qa:
              with Image.open(p) as im:
                  rgb=im.convert('RGB'); rgb.thumbnail((600,820)); card=Image.new('RGB',(640,860),'white'); card.paste(rgb,((640-rgb.width)//2,20)); cards.append(card)
          sheet=Image.new('RGB',(640*len(cards),860),'white')
          for i,card in enumerate(cards): sheet.paste(card,(640*i,0)); card.close()
          sheet.save(OUT/'first_page_contact_sheet.jpg',quality=92); sheet.close()
          for p in qa: (OUT/p.name).write_bytes(p.read_bytes())

          archive=OUT/'Swire_Pacific_00019_Broker_Research_3_Provisional.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(REPORTS.iterdir()): z.write(p,p.name)
          with zipfile.ZipFile(archive,'r') as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad is not None or len(pdfs)!=3: raise RuntimeError(f'ZIP validation failed bad={bad}, pdfs={pdfs}')
          result={'ok':True,'archive':archive.name,'archive_bytes':archive.stat().st_size,'zip_crc_ok':True,'pdf_count':3,'records':records}
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PACKAGE_OK',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - name: Upload package and QA files
        uses: actions/upload-artifact@v4
        with:
          name: swire-pacific-broker-research-package
          path: output/*
          retention-days: 1
          if-no-files-found: error
