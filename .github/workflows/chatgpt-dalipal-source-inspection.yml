name: Inspect public sources for complete Dalipal reports
on:
  push:
    branches:
      - chatgpt-dalipal-reports-20260907
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect source pages and search engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, urllib.parse, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
          s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages={
            'baogaobox_huatai':'https://www.baogaobox.com/insights/250202000006686.html',
            'hangyan_2022':'https://www.hangyan.co/reports/2773386358276752690',
            'nxny_latest':'https://www.nxny.com/report/view_6234382.html',
            'sgpjbg_2023':'https://www.sgpjbg.com/baogao/148717.html',
            'sgpjbg_pingzheng':'https://www.sgpjbg.com/baogao/137548.html',
            'fxbaogao_anxin':'https://www.fxbaogao.com/detail/4062059',
          }
          results={}
          def inspect_page(name,url):
            try:
              r=s.get(url,timeout=(15,90),allow_redirects=True)
              text=r.text
              Path(f'out/{name}.html').write_text(text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(text,'lxml')
              links=[]
              for tag in soup.find_all(['a','iframe','embed','object','source','img','script','link']):
                for attr in ('href','src','data','data-src','data-url','download','file','value'):
                  val=tag.get(attr)
                  if val:
                    absu=urllib.parse.urljoin(r.url,val)
                    if any(k in absu.lower() for k in ['pdf','download','file','report','attach','doc','oss','fileroot','api','view']) or tag.name in ('a','iframe','embed','object'):
                      links.append({'tag':tag.name,'attr':attr,'text':tag.get_text(' ',strip=True)[:120],'url':absu})
              # extract URLs and likely identifiers from raw HTML/JS
              raw_urls=[]
              for m in re.finditer(r'https?://[^\s"\'<>\\]+',text):
                u=html.unescape(m.group(0)).rstrip(');,]')
                if any(k in u.lower() for k in ['pdf','download','file','report','attach','doc','oss','fileroot','api','view']): raw_urls.append(u)
              snippets=[]
              for term in ['download','pdf','fileUrl','file_url','reportUrl','attach','sourceUrl','original','docId','reportId','bgdown','立即下载']:
                for m in list(re.finditer(term,text,re.I))[:20]:
                  snippets.append(text[max(0,m.start()-500):m.start()+1500].replace('\n',' ')[:2200])
              rec={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'links':links[:1000],'raw_urls':list(dict.fromkeys(raw_urls))[:500],'snippets':snippets[:100]}
              results[name]=rec
              print('\nPAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print('TITLE',rec['title'],flush=True)
              print('LINKS',json.dumps(rec['links'][:150],ensure_ascii=False),flush=True)
              print('RAW_URLS',json.dumps(rec['raw_urls'][:150],ensure_ascii=False),flush=True)
              for sn in rec['snippets'][:20]: print('SNIP',sn[:2200],flush=True)
            except Exception as e:
              results[name]={'error':repr(e)}; print('PAGE_FAIL',name,url,repr(e),flush=True)

          for name,url in pages.items(): inspect_page(name,url)

          queries=[
            '"大步迈进国际化，把握海外景气周期" pdf',
            '"大步迈进国际化" "达力普控股"',
            '"能源装备高端制造企业" "达力普控股" pdf',
            '"价值兼具成长" "达力普控股" pdf',
            '"专业石油管及无缝钢管制造企业" pdf',
            '"DALIPAL HLDG(1921.HK)" pdf',
          ]
          engines={
            'bing':'https://www.bing.com/search?q={q}&count=50',
            'baidu':'https://www.baidu.com/s?wd={q}&rn=50',
            'sogou':'https://www.sogou.com/web?query={q}&num=50',
            '360':'https://www.so.com/s?q={q}',
          }
          search_results=[]
          for q in queries:
            for eng,tpl in engines.items():
              url=tpl.format(q=urllib.parse.quote(q))
              try:
                r=s.get(url,headers={'User-Agent':ua,'Referer':'https://www.baidu.com/' if eng=='baidu' else 'https://www.bing.com/'},timeout=(15,90),allow_redirects=True)
                soup=BeautifulSoup(r.text,'lxml')
                links=[]
                for a in soup.find_all('a',href=True):
                  href=a['href']; texta=a.get_text(' ',strip=True)
                  absu=urllib.parse.urljoin(r.url,href)
                  if eng=='baidu' and href.startswith('/link?url='): absu=urllib.parse.urljoin(r.url,href)
                  if texta or 'pdf' in absu.lower(): links.append({'text':texta[:180],'url':absu})
                rec={'q':q,'engine':eng,'status':r.status_code,'bytes':len(r.content),'final':r.url,'links':links[:300]}
                search_results.append(rec)
                print('\nSEARCH',eng,repr(q),r.status_code,len(r.content),flush=True)
                for item in links[:120]:
                  blob=(item['text']+' '+item['url']).lower()
                  if any(k in blob for k in ['达力普','dalipal','1921','报告','研报','pdf','baogao','report']): print('RESULT',json.dumps(item,ensure_ascii=False),flush=True)
              except Exception as e:
                print('SEARCH_FAIL',eng,repr(q),repr(e),flush=True); search_results.append({'q':q,'engine':eng,'error':repr(e)})
              time.sleep(.2)
          results['search_results']=search_results
          Path('out/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dalipal-public-source-inspection
          path: out/
          retention-days: 3
          if-no-files-found: error
