name: Temporary China Everbright exact catalogue probe

on:
  push:
    branches:
      - tmp/china-everbright-exact-catalog-probe-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - shell: bash
        run: |
          python - <<'PY'
          import json, requests

          titles=[
            '跨境资管标的，业绩弹性可期',
            '跨境资管标的 业绩弹性可期',
            '资负共振，锚定科创，拐点已现',
            '资负共振 锚定科创 拐点已现',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          for q in titles:
            for page in range(1,4):
              try:
                r=s.post('https://api.sdyanbao.com/api/file/search',json={'page':page,'pageSize':100,'keyword':q},timeout=50)
                payload=r.json(); rows=(payload.get('data') or {}).get('files') or []
                print('\nSD_SEARCH',repr(q),page,r.status_code,'ROWS',len(rows),'PAYLOAD_KEYS',list(payload.keys()),flush=True)
                for row in rows:
                  print('SD_ROW',json.dumps(row,ensure_ascii=False),flush=True)
                  try:
                    d=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':row.get('id')},timeout=50).json()
                    print('SD_DETAIL',json.dumps(d,ensure_ascii=False),flush=True)
                  except Exception as e:
                    print('SD_DETAIL_ERROR',repr(e),flush=True)
                if len(rows)<100: break
              except Exception as e:
                print('SD_ERROR',repr(q),page,repr(e),flush=True); break

          em=requests.Session(); em.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/stock.jshtml'})
          variants=['00165','0165','165','0165.HK','00165.HK','HK00165','HK0165','116.00165','116.0165','中国光大控股']
          for variant in variants:
            bodies=[]
            base={'beginTime':'2025-01-01','endTime':'2026-08-31','industryCode':'*','ratingChange':'*','rating':'*','orgCode':'*','code':variant,'rcode':'','pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'qType':0}
            bodies.append(base)
            for extra in [
              {'keyword':'中国光大控股'},
              {'title':'跨境资管标的，业绩弹性可期'},
              {'searchkey':'中国光大控股'},
              {'code':'','keyword':'跨境资管标的'},
            ]:
              b=base.copy(); b.update(extra); bodies.append(b)
            for idx,b in enumerate(bodies):
              try:
                r=em.post('https://reportapi.eastmoney.com/report/list2',json=b,timeout=50,headers={'Content-Type':'application/json'})
                try: p=r.json()
                except Exception: p={'raw':r.text[:1000]}
                rows=p.get('data') or [] if isinstance(p,dict) else []
                print('\nEM',variant,idx,r.status_code,'LEN',len(r.content),'ROWS',len(rows),'BODY',json.dumps(b,ensure_ascii=False),flush=True)
                print('EM_PAYLOAD',json.dumps(p,ensure_ascii=False)[:100000],flush=True)
              except Exception as e:
                print('EM_ERROR',variant,idx,repr(e),flush=True)
          PY
