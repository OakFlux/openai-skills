name: Package Tianwei public research materials

on:
  pull_request:
    paths:
      - 'tasks/tianwei-public-materials-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow reportlab pypdf beautifulsoup4 lxml

      - name: Build verified public-materials package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.platypus import (
              SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak,
          )
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          AS_OF = '2026-10-12'
          ROOT = Path('work')
          SOURCE = ROOT / 'sources'
          VERIFY = ROOT / 'verify'
          PACKAGE = ROOT / '天微电子_688511.SH_券商深度报告公开材料包'
          OUT = Path('artifact_out')
          for path in (SOURCE, VERIFY, PACKAGE, OUT):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=5, connect=5, read=5, status=5, backoff_factor=1,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          listing_url = 'https://www.baogaobox.com/reports/240622000020971.html'
          cover_url = 'https://zy.baogaobox.com/file/p/2024/06-24/imguh6a1626h5plhqkyt9xid00020971.webp'
          charts_url = 'https://www.hangyan.co/charts/3396484144153232497'
          weekly_url = 'https://m.sohu.com/a/789437332_121123883/'

          listing = session.get(listing_url, timeout=(20, 90))
          listing.raise_for_status()
          (SOURCE / '01_报告公开索引页.html').write_bytes(listing.content)
          listing_text = listing.text
          required = ['天微电子', '天风证券', '18页', '2024-06-22']
          if not all(term in listing_text for term in required):
              raise RuntimeError('Public listing metadata validation failed')

          charts = session.get(charts_url, timeout=(20, 90))
          charts.raise_for_status()
          (SOURCE / '02_公开图表索引页.html').write_bytes(charts.content)
          if '天微电子' not in charts.text or '26个图表' not in charts.text:
              raise RuntimeError('Public chart-index validation failed')

          weekly = session.get(weekly_url, timeout=(20, 90))
          (SOURCE / '03_天风研究公开摘要来源页.html').write_bytes(weekly.content)

          cover_response = session.get(
              cover_url,
              headers={'Referer': listing_url, 'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'},
              timeout=(20, 90),
          )
          if cover_response.status_code != 200 or len(cover_response.content) < 20_000:
              raise RuntimeError(f'Public cover preview download failed: {cover_response.status_code}, {len(cover_response.content)} bytes')
          cover_webp = SOURCE / '天风证券报告公开封面.webp'
          cover_webp.write_bytes(cover_response.content)
          with Image.open(cover_webp) as im:
              if im.width < 400 or im.height < 500:
                  raise RuntimeError(f'Cover preview resolution too small: {im.size}')
              rgb = im.convert('RGB')
              cover_pdf = PACKAGE / '01_天风证券_2024-06-22_深度报告公开封面预览_非完整版.pdf'
              rgb.save(cover_pdf, 'PDF', resolution=150.0)

          pdfmetrics.registerFont(UnicodeCIDFont('STSong-Light'))
          styles = getSampleStyleSheet()
          title_style = ParagraphStyle(
              'CJKTitle', parent=styles['Title'], fontName='STSong-Light',
              fontSize=18, leading=26, alignment=TA_CENTER, spaceAfter=12,
          )
          h1 = ParagraphStyle(
              'CJKH1', parent=styles['Heading1'], fontName='STSong-Light',
              fontSize=13, leading=20, spaceBefore=10, spaceAfter=6,
          )
          body = ParagraphStyle(
              'CJKBody', parent=styles['BodyText'], fontName='STSong-Light',
              fontSize=10.5, leading=18, alignment=TA_LEFT, spaceAfter=7,
          )
          note = ParagraphStyle(
              'CJKNote', parent=body, fontSize=9.5, leading=16,
              textColor=colors.HexColor('#444444'),
          )
          small = ParagraphStyle(
              'CJKSmall', parent=body, fontSize=8.5, leading=14,
          )

          summary_pdf = PACKAGE / '02_天风证券_天微电子首次覆盖报告_公开摘要与元数据_非原始报告.pdf'
          doc = SimpleDocTemplate(
              str(summary_pdf), pagesize=A4,
              leftMargin=20*mm, rightMargin=20*mm, topMargin=18*mm, bottomMargin=18*mm,
              title='天微电子券商深度报告公开摘要与元数据',
              author='公开资料整理',
          )
          story = []
          story.append(Paragraph('天微电子（688511.SH）券商深度报告公开摘要与元数据', title_style))
          story.append(Paragraph('重要说明：本文件不是天风证券18页原始报告，也不替代原报告。它仅整理公开可核验的报告元数据、研究框架和来源入口。', note))
          story.append(Spacer(1, 5*mm))

          data = [
              ['项目', '公开可核验信息'],
              ['报告标题', '军用灭火防爆系统龙头，下游景气度传导助力业绩腾飞'],
              ['研究机构', '天风证券'],
              ['分析师', '王泽宇、杨英杰'],
              ['发布日期', '2024年6月22日'],
              ['报告属性', '公司深度研究 / 首次覆盖'],
              ['评级', '买入'],
              ['原报告页数', '18页'],
              ['公开图表索引', '26个图表'],
          ]
          table = Table(data, colWidths=[35*mm, 120*mm], repeatRows=1)
          table.setStyle(TableStyle([
              ('FONTNAME', (0,0), (-1,-1), 'STSong-Light'),
              ('FONTSIZE', (0,0), (-1,-1), 9.5),
              ('LEADING', (0,0), (-1,-1), 15),
              ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#EDEDED')),
              ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#999999')),
              ('VALIGN', (0,0), (-1,-1), 'TOP'),
              ('LEFTPADDING', (0,0), (-1,-1), 6),
              ('RIGHTPADDING', (0,0), (-1,-1), 6),
              ('TOPPADDING', (0,0), (-1,-1), 5),
              ('BOTTOMPADDING', (0,0), (-1,-1), 5),
          ]))
          story.append(table)
          story.append(Spacer(1, 5*mm))

          story.append(Paragraph('公开研究框架', h1))
          story.append(Paragraph('报告将公司定位为军用灭火抑爆系统细分领域企业，围绕军工资质与技术壁垒、型号配套与下游景气传导、产品结构、订单和交付节奏等因素展开分析。', body))
          story.append(Paragraph('公开图表索引显示，报告覆盖公司2019—2023年经营数据、应收票据及应收账款、主要在研项目、产品技术特点、产业链位置、航空防火系统与军用装备应用等内容。', body))
          story.append(Paragraph('公开评级信息显示，天风证券在该报告中首次覆盖天微电子并给予“买入”评级。由于原报告完整PDF未在公开索引页提供下载，本材料不复述未经公开页面完整展示的盈利预测表、估值模型及目标价。', body))

          story.append(Paragraph('来源与可得性说明', h1))
          story.append(Paragraph('远瞻慧库公开索引页列明报告机构、分析师、日期、页数和文件大小，但页面同时明确说明其仅提供检索与来源信息，不提供原始报告下载。', body))
          story.append(Paragraph('小牛行研公开图表页列明该报告含26个图表，并公开展示部分图表节选。该页面并非原始报告PDF。', body))
          story.append(Paragraph('截至2026年10月12日，公开研报索引对天微电子的直接公司深度覆盖仅能稳定核验到上述一份。为避免误导，本资料包没有使用公司公告、招股说明书、财经新闻或其他军工公司的行业报告冒充第二、第三份天微电子深度报告。', body))

          story.append(Paragraph('公开来源', h1))
          sources = [
              listing_url,
              charts_url,
              weekly_url,
          ]
          for idx, url in enumerate(sources, 1):
              story.append(Paragraph(f'{idx}. {url}', small))
          story.append(Spacer(1, 4*mm))
          story.append(Paragraph(f'整理日期：{AS_OF}', small))
          doc.build(story)

          index_pdf = PACKAGE / '03_公开检索结论与使用说明.pdf'
          doc2 = SimpleDocTemplate(
              str(index_pdf), pagesize=A4,
              leftMargin=20*mm, rightMargin=20*mm, topMargin=18*mm, bottomMargin=18*mm,
              title='天微电子券商研报公开检索结论', author='公开资料整理',
          )
          story2 = [
              Paragraph('天微电子券商研报公开检索结论', title_style),
              Paragraph('检索对象：天微电子（688511.SH）公司深度、首次覆盖和专题研究。', body),
              Paragraph('结果：公开可核验的直接公司深度报告只有天风证券2024年6月22日发布的18页首次覆盖报告。未发现第二、第三份可公开直取且符合“公司深度报告”口径的完整原始PDF。', body),
              Paragraph('交付内容：本包提供该报告的公开封面预览、公开摘要与元数据，以及原始公开索引页的HTML留档。封面预览和摘要均在文件名中明确标注“非完整版”或“非原始报告”。', body),
              Paragraph('未纳入内容：公司公告、招股说明书、定期报告、财经媒体文章、无关军工行业报告、其他防爆类上市公司的研究报告，以及需登录或加入社群才能取得的受限文件。', body),
              Paragraph('因此，本资料包属于公开研究材料包，不应被理解为包含2—3份完整券商深度报告。', note),
          ]
          doc2.build(story2)

          manifest = []
          sha_lines = []
          for path in sorted(PACKAGE.iterdir()):
              if path.is_file() and path.suffix.lower() == '.pdf':
                  reader = PdfReader(str(path), strict=False)
                  pages = len(reader.pages)
                  check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
                  if check.returncode not in (0,3):
                      raise RuntimeError(f'qpdf failed for {path.name}: {check.stderr[-800:]}')
                  first_prefix = VERIFY / (path.stem + '_first')
                  last_prefix = VERIFY / (path.stem + '_last')
                  first = subprocess.run(['pdftoppm','-f','1','-l','1','-singlefile','-png','-r','80',str(path),str(first_prefix)],capture_output=True,text=True)
                  last = subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-singlefile','-png','-r','80',str(path),str(last_prefix)],capture_output=True,text=True)
                  if first.returncode != 0 or last.returncode != 0:
                      raise RuntimeError(f'Page rendering failed for {path.name}')
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  manifest.append({'file_name':path.name,'pages':pages,'bytes':path.stat().st_size,'sha256':digest})
                  sha_lines.append(f'{digest}  {path.name}')

          readme = '''# 天微电子（688511.SH）券商深度报告公开材料包

本包不是“2—3份完整券商深度报告合集”。公开研报索引中仅能稳定核验到1份天微电子直接公司深度报告：天风证券2024年6月22日发布的18页首次覆盖报告《军用灭火防爆系统龙头，下游景气度传导助力业绩腾飞》。公开索引页不提供完整原始PDF下载。

本包包含：
1. 报告公开封面预览PDF（非完整版）；
2. 公开摘要与元数据PDF（非原始报告）；
3. 公开检索结论与使用说明PDF；
4. 三个公开来源网页的HTML留档；
5. manifest.json与SHA256SUMS.txt。

未使用公告、招股书、财经新闻或其他公司的研究报告冒充第二、第三份深度报告。
'''
          (PACKAGE / 'README.md').write_text(readme, encoding='utf-8')
          (PACKAGE / 'manifest.json').write_text(json.dumps({
              'company':'天微电子','ticker':'688511.SH','package_date':AS_OF,
              'verified_company_deep_reports':1,
              'verified_report':{
                  'title':'军用灭火防爆系统龙头，下游景气度传导助力业绩腾飞',
                  'broker':'天风证券','analysts':['王泽宇','杨英杰'],
                  'date':'2024-06-22','pages':18,'rating':'买入','coverage':'首次覆盖',
              },
              'package_pdfs':manifest,
              'source_urls':[listing_url,charts_url,weekly_url],
          },ensure_ascii=False,indent=2),encoding='utf-8')
          (PACKAGE / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines)+'\n',encoding='utf-8')
          for src in sorted(SOURCE.iterdir()):
              shutil.copy2(src, PACKAGE / src.name)

          chinese_zip = OUT / '天微电子_688511.SH_券商深度报告公开材料包.zip'
          with zipfile.ZipFile(chinese_zip,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as zf:
              for path in sorted(PACKAGE.iterdir()):
                  zf.write(path,arcname=f'{PACKAGE.name}/{path.name}')
          with zipfile.ZipFile(chinese_zip,'r') as zf:
              bad=zf.testzip()
              if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdf_count=sum(1 for n in zf.namelist() if n.lower().endswith('.pdf'))
              if pdf_count != 3: raise RuntimeError(f'Expected 3 public-material PDFs, got {pdf_count}')

          english_zip = OUT / 'Tianwei_Electronics_688511_Public_Research_Materials.zip'
          shutil.copy2(chinese_zip, english_zip)
          print('FINAL_ZIP',chinese_zip,chinese_zip.stat().st_size,hashlib.sha256(chinese_zip.read_bytes()).hexdigest(),flush=True)
          print('BACKUP_ZIP',english_zip,english_zip.stat().st_size,hashlib.sha256(english_zip.read_bytes()).hexdigest(),flush=True)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-public-research-materials-artifact
          path: artifact_out/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
