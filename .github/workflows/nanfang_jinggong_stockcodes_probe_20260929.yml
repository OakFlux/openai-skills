name: South Precision stockCodes Report Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_stockcodes_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe current report API parameters
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/stock.jshtml'})
          variants=[
            {'stockCodes':'002553'},
            {'stockCodes':'0.002553'},
            {'stockCode':'002553'},
            {'code':'002553'},
            {'code':'SZ002553'},
          ]
          base={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2026-09-29','pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          for variant in variants:
            params=dict(base,**variant)
            r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=90)
            print('\nVARIANT',variant,'STATUS',r.status_code,'LEN',len(r.content),'URL',r.url)
            obj=r.json(); rows=obj.get('data') or []
            print('HITS',obj.get('hits'),'TOTALPAGE',obj.get('TotalPage'),'ROWS',len(rows))
            for row in rows:
              keep={k:row.get(k) for k in ['publishDate','stockCode','stockName','title','orgSName','orgName','researcher','emRatingName','sRatingName','attachPages','attachSize','infoCode','column','encodeUrl']}
              print('ROW',json.dumps(keep,ensure_ascii=False))
          PY
