name: Temporary Test Public Mengtai PDF Endpoints V3

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-test-sdyanbao-mengtai-static-v3.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Query exact report titles and probe returned document URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          API = 'https://api.sdyanbao.com'
          STATIC = 'https://static.sdyanbao.com/'
          QUERIES = [
              '丙纶长丝行业领跑者 双基地强势进军碳纤维',
              '丙纶景气触底 布局碳纤维打开新增量',
          ]
          OUT = Path('endpoint_probe_v3')
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://www.sdyanbao.com/report',
              'Origin': 'https://www.sdyanbao.com',
              'Content-Type': 'application/json;charset=UTF-8',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Device': '1',
              'X-Token': '',
          })

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          targets = []
          for query in QUERIES:
              payload = {
                  'device': 1, 'hideTrader': 0, 'onlyTitle': 0, 'order': 0,
                  'page': 1, 'pageSize': 100, 'keyword': query, 'opFrom': 1,
              }
              response = session.post(API + '/api/file/search', json=payload, timeout=90)
              print('SEARCH_META=' + json.dumps({
                  'query': query,
                  'status': response.status_code,
                  'bytes': len(response.content),
                  'body_head': response.text[:500],
              }, ensure_ascii=False))
              response.raise_for_status()
              result = response.json()
              (OUT / ('search_' + str(len(targets)) + '.json')).write_text(
                  json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              matches = []
              for item in walk(result):
                  title = str(item.get('name') or item.get('title') or '')
                  blob = json.dumps(item, ensure_ascii=False)
                  if ('蒙泰高新' in blob or '300876' in blob) and ('丙纶' in blob or '碳纤维' in blob):
                      candidate = {
                          'id': str(item.get('id')),
                          'title': title,
                          'page_count': item.get('page_count'),
                          'size': item.get('size'),
                          'author': item.get('author'),
                          'organization': item.get('organization'),
                          'create_time': item.get('create_time'),
                          'update_time': item.get('update_time'),
                      }
                      if candidate not in matches:
                          matches.append(candidate)
              print('SEARCH_MATCHES=' + json.dumps({'query': query, 'matches': matches[:30]}, ensure_ascii=False))
              if not matches:
                  raise RuntimeError('No relevant match for query: ' + query)
              matches.sort(key=lambda x: (
                  int(x.get('page_count') or 0),
                  1 if '东北证券' in json.dumps(x, ensure_ascii=False) else 0,
              ), reverse=True)
              chosen = matches[0]
              if chosen not in targets:
                  targets.append(chosen)

          print('TARGETS=' + json.dumps(targets, ensure_ascii=False))
          if len(targets) != 2:
              raise RuntimeError(f'Expected two unique reports, got {len(targets)}')

          def is_pdf(raw):
              return len(raw) > 20000 and raw.lstrip().startswith(b'%PDF')

          def record_response(label, response):
              raw = response.content
              info = {
                  'label': label,
                  'requested_url': response.request.url,
                  'final_url': response.url,
                  'status': response.status_code,
                  'content_type': response.headers.get('content-type'),
                  'content_length': response.headers.get('content-length'),
                  'content_disposition': response.headers.get('content-disposition'),
                  'bytes': len(raw),
                  'head_hex': raw[:32].hex(),
                  'head_text': raw[:300].decode('utf-8', errors='replace'),
                  'is_pdf': is_pdf(raw),
              }
              print('RESPONSE=' + json.dumps(info, ensure_ascii=False))
              return info

          saved = []
          for target in targets:
              report_id = target['id']
              response = session.post(API + '/api/file/detail', json={'id': report_id, 'opFrom': 1}, timeout=90)
              record_response(report_id + ':detail', response)
              response.raise_for_status()
              payload = response.json()
              (OUT / f'{report_id}_detail.json').write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              data = payload.get('data')
              if not isinstance(data, dict):
                  raise RuntimeError(f'Detail failed: {payload}')
              print('DETAIL=' + json.dumps({key: data.get(key) for key in [
                  'id', 'name', 'page_count', 'size', 'author', 'organization',
                  'online_url', 'page_url', 'oss_name', 'page_dir', 'image_name',
                  'downloadName', 'is_unlock', 'is_download', 'file_size', 'original_id'
              ]}, ensure_ascii=False))

              candidates = []
              for base in [data.get('online_url'), data.get('page_url'), urljoin(STATIC, str(data.get('oss_name') or ''))]:
                  if not base:
                      continue
                  for candidate in [base, base + '.pdf', base + '?download=1', base + '?attname=1']:
                      if candidate not in candidates:
                          candidates.append(candidate)
              # Also try OSS host because search results sometimes use oss.sdyanbao.com.
              for field in ['online_url', 'page_url', 'share_url']:
                  value = data.get(field)
                  if value and value not in candidates:
                      candidates.append(value)

              discovered = []
              for idx, url in enumerate(candidates, 1):
                  try:
                      fetched = session.get(
                          url,
                          headers={'Accept': 'application/pdf,text/html,application/json,*/*', 'Referer': f'https://www.sdyanbao.com/detail/{report_id}'},
                          timeout=150,
                          allow_redirects=True,
                      )
                      info = record_response(f'{report_id}:candidate:{idx}', fetched)
                      if info['is_pdf']:
                          path = OUT / f'{report_id}_candidate_{idx}.pdf'
                          path.write_bytes(fetched.content)
                          saved.append({'id': report_id, 'title': target['title'], 'path': str(path), 'source': fetched.url})
                          continue
                      ctype = (fetched.headers.get('content-type') or '').lower()
                      if 'text' in ctype or 'json' in ctype or fetched.content[:1] in (b'<', b'{', b'['):
                          text = html.unescape(fetched.content.decode('utf-8', errors='ignore')).replace('\\/', '/')
                          (OUT / f'{report_id}_candidate_{idx}.txt').write_text(text[:1000000], encoding='utf-8')
                          for pattern in [
                              r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',
                              r'https?://(?:static|oss)\.sdyanbao\.com/[^"\'<>\s]+',
                              r'(?:src|href|url|file|pdfUrl|downloadUrl)\s*[:=]\s*["\']([^"\']+)["\']',
                          ]:
                              for value in re.findall(pattern, text, re.I):
                                  if isinstance(value, tuple):
                                      value = value[0]
                                  candidate = urljoin(fetched.url, value)
                                  if candidate not in discovered:
                                      discovered.append(candidate)
                  except Exception as exc:
                      print('CANDIDATE_ERROR=' + json.dumps({'id': report_id, 'url': url, 'error': repr(exc)}, ensure_ascii=False))

              print('DISCOVERED=' + json.dumps({'id': report_id, 'urls': discovered[:100]}, ensure_ascii=False))
              for idx, url in enumerate(discovered[:50], 1):
                  try:
                      fetched = session.get(url, timeout=150, allow_redirects=True)
                      info = record_response(f'{report_id}:discovered:{idx}', fetched)
                      if info['is_pdf']:
                          path = OUT / f'{report_id}_discovered_{idx}.pdf'
                          path.write_bytes(fetched.content)
                          saved.append({'id': report_id, 'title': target['title'], 'path': str(path), 'source': fetched.url})
                  except Exception as exc:
                      print('DISCOVERED_ERROR=' + json.dumps({'id': report_id, 'url': url, 'error': repr(exc)}, ensure_ascii=False))

              for idx, body in enumerate([
                  {'id': report_id}, {'id': report_id, 'opFrom': 1},
                  {'id': report_id, 'device': 1, 'opFrom': 1},
                  {'id': report_id, 'beike': 0, 'opFrom': 1},
              ], 1):
                  downloaded = session.post(API + '/api/file/download', json=body, timeout=90)
                  info = record_response(f'{report_id}:download:{idx}', downloaded)
                  if info['is_pdf']:
                      path = OUT / f'{report_id}_download_{idx}.pdf'
                      path.write_bytes(downloaded.content)
                      saved.append({'id': report_id, 'title': target['title'], 'path': str(path), 'source': downloaded.url})
                  else:
                      try:
                          print('DOWNLOAD_BODY=' + json.dumps({'id': report_id, 'request': body, 'response': downloaded.json()}, ensure_ascii=False))
                      except Exception:
                          pass

          print('SAVED=' + json.dumps(saved, ensure_ascii=False))
          (OUT / 'saved.json').write_text(json.dumps(saved, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: mengtai-sdyanbao-endpoint-probe-v3
          path: endpoint_probe_v3
          retention-days: 2
          if-no-files-found: error
