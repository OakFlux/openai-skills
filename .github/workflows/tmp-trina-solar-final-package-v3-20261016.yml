name: Build final Trina Solar filing package

on:
  push:
    branches: [tmp-trina-solar-688599-reports-20261016]
    paths: ['.github/workflows/tmp-trina-solar-final-package-v3-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='天合光能_688599_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE"

          python3 - <<'PY'
          import html, json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          outdir = Path('天合光能_688599_全部年报_招股说明书_最新季报')
          records = [
              {'category':'年度报告','period':'2020年度','detail_title':'天合光能股份有限公司2020年年度报告','filename':'01_天合光能_2020年年度报告.pdf','pdf_url':'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-3/2021-03-31/6997721.PDF','referer':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688599&id=6997721'},
              {'category':'年度报告','period':'2021年度','detail_title':'天合光能股份有限公司2021年年度报告（修订版）','filename':'02_天合光能_2021年年度报告_修订版.pdf','pdf_url':'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-6/2022-06-06/8273504.PDF','referer':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688599&id=8273504'},
              {'category':'年度报告','period':'2022年度','detail_title':'天合光能2022年年度报告','filename':'03_天合光能_2022年年度报告.pdf','pdf_url':'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-25/9060205.PDF','referer':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688599&id=9060205'},
              {'category':'年度报告','period':'2023年度','detail_title':'天合光能2023年年度报告','filename':'04_天合光能_2023年年度报告.pdf','pdf_url':'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-26/10073841.PDF','referer':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688599&id=10073841'},
              {'category':'年度报告','period':'2024年度','detail_title':'天合光能2024年年度报告','filename':'05_天合光能_2024年年度报告.pdf','pdf_url':'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-30/11075535.PDF','referer':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688599&id=11075535'},
              {'category':'年度报告','period':'2025年度','detail_title':'天合光能2025年年度报告','filename':'06_天合光能_2025年年度报告.pdf','pdf_url':'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-30/12285103.PDF','referer':'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=688599&id=12285103'},
              {'category':'招股说明书','period':'2020年首次公开发行','detail_title':'天合光能首次公开发行股票并在科创板上市招股说明书','filename':'07_天合光能_首次公开发行股票并在科创板上市招股说明书_2020-06-04.pdf','pdf_url':'https://pdf.dfcfw.com/pdf/H2_AN202006031382115156_1.pdf','referer':'https://data.eastmoney.com/xg/xg/detail/688599.html'},
          ]

          def fetch(url, referer=None):
              headers={'User-Agent':UA,'Accept':'application/pdf,text/html,application/xhtml+xml,*/*;q=0.8'}
              if referer: headers['Referer']=referer
              last=None
              for attempt in range(7):
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=300) as r:
                          return r.read(), r.geturl()
                  except Exception as exc:
                      last=exc; time.sleep(2+attempt)
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          def decode(raw):
              for enc in ('utf-8','gb18030','gbk'):
                  try: return raw.decode(enc)
                  except UnicodeDecodeError: pass
              return raw.decode('utf-8',errors='replace')

          anchor_pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          def anchors(url):
              raw, final=fetch(url)
              text=decode(raw); items=[]
              for m in anchor_pat.finditer(text):
                  label=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
                  label=re.sub(r'\s+','',label)
                  href=urllib.parse.urljoin(final,html.unescape(m.group(1).strip()))
                  items.append((label,href))
              return items

          q1_index='https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinYi/stockid/688599/page_type/yjdbg.phtml'
          q3_index='https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/688599/page_type/sjdbg.phtml'
          q3=[(l,u) for l,u in anchors(q3_index) if '2026年' in l and ('第三季度报告' in l or '三季度报告' in l) and '摘要' not in l and '天合光能' in l]
          q1=[(l,u) for l,u in anchors(q1_index) if '2026年' in l and ('第一季度报告' in l or '一季度报告' in l) and '摘要' not in l and '天合光能' in l]
          if q3:
              q_label,q_detail=q3[0]; q_period='2026年第三季度'; q_name='08_天合光能_2026年第三季度报告_最新季报.pdf'
          elif q1:
              q_label,q_detail=q1[0]; q_period='2026年第一季度'; q_name='08_天合光能_2026年第一季度报告_最新季报.pdf'
          else:
              raise SystemExit('Could not find a 2026 quarterly report')
          links=anchors(q_detail)
          downloads=[(l,u) for l,u in links if '下载公告' in l or '.pdf' in u.lower()]
          if not downloads: raise SystemExit(f'Could not find quarterly PDF on {q_detail}')
          downloads.sort(key=lambda x:0 if '下载公告' in x[0] else 1)
          records.append({'category':'最新季报','period':q_period,'detail_title':q_label,'filename':q_name,'pdf_url':urllib.parse.unquote(downloads[0][1]),'referer':q_detail})

          for rec in records:
              raw,final=fetch(rec['pdf_url'],rec.get('referer'))
              if not raw.startswith(b'%PDF-'): raise SystemExit(f"Not a PDF: {rec['pdf_url']}; prefix={raw[:80]!r}")
              if len(raw)<100000: raise SystemExit(f"PDF too small: {rec['pdf_url']}; bytes={len(raw)}")
              path=outdir/rec['filename']; path.write_bytes(raw)
              rec['resolved_pdf_url']=final; rec['bytes']=len(raw)
              print(f'Saved {path} ({len(raw)} bytes) from {final}')
          (outdir/'_download_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$qstatus"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l 15 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '天合光能股份有限公司|天合光能|Trina Solar' "$pdf.txt"
            rm -f "$pdf.txt"
            echo "Validated: $(basename "$pdf") ($pages pages, $(stat -c%s "$pdf") bytes)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          folder=Path('天合光能_688599_全部年报_招股说明书_最新季报')
          meta=json.loads((folder/'_download_metadata.json').read_text(encoding='utf-8'))
          pdfs=sorted(folder.glob('*.pdf'))
          if len(pdfs)!=8: raise SystemExit(f'Expected 8 PDFs, found {len(pdfs)}')
          by_name={x['filename']:x for x in meta}
          latest=next(x['period'] for x in meta if x['category']=='最新季报')
          lines=['天合光能股份有限公司（天合光能，688599）','上市以来全部年度报告、最终版招股说明书及最新季报','整理日期：2026-10-16','','收录说明：','1. 收录上市以来2020—2025年度报告全文，共6份。','2. 2021年年度报告采用后续披露的修订版。','3. 收录2020年6月4日披露的首次公开发行股票并在科创板上市招股说明书正式版；未用招股意向书替代。',f'4. 截至2026-10-16，最新已披露季度报告为{latest}报告。','5. 2026年半年度报告不属于季度报告，未将其替代为“最新季报”。','','文件清单：']
          sums=[]; total_pages=0; total_bytes=0
          for pdf in pdfs:
              item=by_name[pdf.name]; data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace',stderr=subprocess.DEVNULL)
              pages=int(next(line.split(':',1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages+=pages; total_bytes+=len(data)
              lines += [f'- {pdf.name}',f"  类型：{item['category']}；报告期：{item['period']}；页数：{pages}；大小：{len(data)}字节",f"  公告标题：{item['detail_title']}",f"  PDF来源：{item['resolved_pdf_url']}",f'  SHA-256：{sha}']
              sums.append(f'{sha}  {pdf.name}')
          lines += ['',f'合计页数：{total_pages}页。',f'PDF原件合计大小：{total_bytes}字节。','全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (folder/'_download_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Trina-Solar-688599-all-annual-reports-prospectus-latest-quarter
          path: 天合光能_688599_全部年报_招股说明书_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
