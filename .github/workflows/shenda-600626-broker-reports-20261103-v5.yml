name: Package verified Shenda 600626 broker report materials

on:
  push:
    branches:
      - tmp/shenda-600626-broker-reports-20261103-v1
    paths:
      - .github/workflows/shenda-600626-broker-reports-20261103-v5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          python -m pip install --quiet requests pypdf reportlab

      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import BaseDocTemplate, Frame, PageTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak

          CODE = "600626"
          COMPANY = "申达股份"
          FULL = "上海申达股份有限公司"
          PREPARED = "2026-11-03"
          ROOT_NAME = "申达股份_600626_券商研究资料_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          original = {
              "index": 1,
              "date": "2016-07-22",
              "broker": "海通证券",
              "analyst": "于旭辉、唐苓、梁希",
              "rating": "增持（首次覆盖）",
              "report_type": "公司深度研究/首次覆盖",
              "title": "三轮驱动新增长，受益上海地方国改",
              "document_form": "券商原始PDF",
              "url": "https://img3.gelonghui.com/pdf201607/pdf20160725152300299.pdf",
              "detail_url": "https://img3.gelonghui.com/pdf201607/pdf20160725152300299.pdf",
              "filename": "01_20160722_海通证券_三轮驱动新增长受益上海地方国改_券商原始PDF.pdf",
          }

          summaries = [
              {
                  "index": 2,
                  "date": "2016-07-26",
                  "broker": "申万宏源",
                  "analyst": "王立平",
                  "rating": "增持（首次覆盖）",
                  "report_type": "公司研究/首次覆盖",
                  "title": "大力发展汽车内饰和纺织新材料，受益上海国企改革落地",
                  "document_form": "公开研报摘要索引版（非券商原始PDF）",
                  "source_url": "https://www.cs.com.cn/gppd/zzgsm/201607/zzgsm20160727/01/201607/t20160727_5021970_8.html",
                  "filename": "02_20160726_申万宏源_大力发展汽车内饰和纺织新材料_公开摘要索引版_非原始PDF.pdf",
                  "summary": (
                      "报告从进出口贸易、汽车内饰和纺织新材料三条业务线评估公司增长潜力。核心判断包括："
                      "汽车内饰业务在国内汽车销量增长和外延并购推动下具备较高增速；纺织新材料毛利率较高，"
                      "碳纤维等募投项目有望扩展产品线；上海国企改革及控股股东资产证券化可能形成估值催化。"
                      "报告同时关注定增项目、海外并购整合和集团资产注入预期。"
                  ),
              },
              {
                  "index": 3,
                  "date": "2016-09-02",
                  "broker": "申万宏源",
                  "analyst": "王立平",
                  "rating": "增持（维持）",
                  "report_type": "公司点评研究",
                  "title": "汽车内饰业务爆发式增长，有望受益上海国企改革落地",
                  "document_form": "公开研报摘要索引版（非券商原始PDF）",
                  "source_url": "https://stock.cnstock.com/stock/smk_gszbs/201609/3912019.htm",
                  "filename": "03_20160902_申万宏源_汽车内饰业务爆发式增长_公开摘要索引版_非原始PDF.pdf",
                  "summary": (
                      "报告基于2016年半年报更新判断：公司归母净利润同比增长，汽车内饰业务成为主要增长来源，"
                      "各项业务毛利率改善；同时，兼并收购推高期间费用，存货、应收账款和经营现金流仍需跟踪。"
                      "报告继续看好定增推动的汽车内饰产能扩张、PFI与NYX相关并购，以及上海国企改革和潜在资产注入。"
                  ),
              },
          ]

          def download_pdf(url: str) -> bytes:
              last = None
              for attempt in range(5):
                  try:
                      r = session.get(url, timeout=(30, 420), allow_redirects=True, headers={"Referer": "https://www.gelonghui.com/", "Accept": "application/pdf,*/*;q=0.8"})
                      print("DOWNLOAD", r.status_code, len(r.content), r.url)
                      if r.status_code == 200 and r.content.startswith(b"%PDF-") and len(r.content) > 50_000:
                          return r.content
                      last = RuntimeError(f"HTTP/status invalid: {r.status_code}, bytes={len(r.content)}, type={r.headers.get('content-type')}")
                  except Exception as exc:
                      last = exc
                  time.sleep(1 + attempt)
              raise RuntimeError(f"Original PDF download failed: {last}")

          body_font = "/usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf"
          title_font = "/usr/share/fonts/truetype/arphic-gkai00mp/gkai00mp.ttf"
          if not Path(body_font).exists() or not Path(title_font).exists():
              raise FileNotFoundError("Chinese fonts not found")
          pdfmetrics.registerFont(TTFont("CJKBody", body_font))
          pdfmetrics.registerFont(TTFont("CJKTitle", title_font))

          styles = getSampleStyleSheet()
          title_style = ParagraphStyle("TitleCJK", parent=styles["Title"], fontName="CJKTitle", fontSize=20, leading=29, alignment=TA_LEFT, textColor=colors.HexColor("#1f2937"), spaceAfter=12)
          heading_style = ParagraphStyle("HeadingCJK", parent=styles["Heading2"], fontName="CJKTitle", fontSize=13, leading=20, textColor=colors.HexColor("#374151"), spaceAfter=8)
          body_style = ParagraphStyle("BodyCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=10.5, leading=18, textColor=colors.HexColor("#222222"), spaceAfter=10)
          small_style = ParagraphStyle("SmallCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=8.5, leading=14, textColor=colors.HexColor("#555555"), spaceAfter=6)
          warning_style = ParagraphStyle("WarningCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=10.5, leading=18, textColor=colors.HexColor("#9b1c1c"), backColor=colors.HexColor("#fff4f4"), borderColor=colors.HexColor("#d99a9a"), borderWidth=0.8, borderPadding=8, spaceAfter=14)

          PAGE_W, PAGE_H = A4
          def footer(canvas, doc):
              canvas.saveState()
              canvas.setFont("CJKBody", 8)
              canvas.setFillColor(colors.HexColor("#777777"))
              canvas.drawCentredString(PAGE_W / 2, 11 * mm, f"申达股份（600626.SH）公开研报摘要索引版  |  第 {doc.page} 页")
              canvas.restoreState()

          def build_summary_pdf(spec: dict, path: Path):
              doc = BaseDocTemplate(str(path), pagesize=A4, leftMargin=20*mm, rightMargin=20*mm, topMargin=20*mm, bottomMargin=20*mm, title=spec["title"], author="OpenAI")
              frame = Frame(doc.leftMargin, doc.bottomMargin, doc.width, doc.height, id="normal")
              doc.addPageTemplates([PageTemplate(id="all", frames=[frame], onPage=footer)])
              meta = [
                  ["公司", f"{FULL}（{CODE}.SH）"],
                  ["券商", spec["broker"]],
                  ["研究员", spec["analyst"]],
                  ["发布日期", spec["date"]],
                  ["评级", spec["rating"]],
                  ["报告类型", spec["report_type"]],
              ]
              table = Table(meta, colWidths=[30*mm, 120*mm])
              table.setStyle(TableStyle([
                  ("FONTNAME", (0,0), (-1,-1), "CJKBody"),
                  ("FONTSIZE", (0,0), (-1,-1), 10),
                  ("LEADING", (0,0), (-1,-1), 16),
                  ("BACKGROUND", (0,0), (0,-1), colors.HexColor("#f3f4f6")),
                  ("GRID", (0,0), (-1,-1), 0.5, colors.HexColor("#d1d5db")),
                  ("VALIGN", (0,0), (-1,-1), "TOP"),
                  ("LEFTPADDING", (0,0), (-1,-1), 7),
                  ("RIGHTPADDING", (0,0), (-1,-1), 7),
                  ("TOPPADDING", (0,0), (-1,-1), 6),
                  ("BOTTOMPADDING", (0,0), (-1,-1), 6),
              ]))
              story = [
                  Paragraph("公开研报摘要索引版 · 非券商原始PDF", warning_style),
                  Paragraph(html.escape(spec["title"]), title_style),
                  table,
                  Spacer(1, 10*mm),
                  Paragraph("文件性质", heading_style),
                  Paragraph("本文件仅用于识别、定位和概览对应券商研究报告。它不是券商发布的原始PDF，不包含原报告全文、图表、估值模型、风险提示页或原始版式。报告版权归原券商及作者所有。", body_style),
                  PageBreak(),
                  Paragraph("公开信息摘要", heading_style),
                  Paragraph(html.escape(spec["summary"]), body_style),
                  Spacer(1, 5*mm),
                  Paragraph("检索与使用说明", heading_style),
                  Paragraph("本次公开检索未获得可验证、可直接公开下载的对应券商原始PDF，因此没有绕过账户、会员或付费限制，也没有把网页内容重排后冒充原报告。该索引用于确认报告标题、券商、研究员、日期、评级和核心研究线索。", body_style),
                  Spacer(1, 5*mm),
                  Paragraph("公开来源", heading_style),
                  Paragraph(html.escape(spec["source_url"]), small_style),
                  Paragraph(f"整理日期：{PREPARED}", small_style),
              ]
              doc.build(story)

          manifest = []

          original_path = PDF_DIR / original["filename"]
          original_data = download_pdf(original["url"])
          original_path.write_bytes(original_data)
          original_reader = PdfReader(str(original_path), strict=False)
          original_pages = len(original_reader.pages)
          original_text = "\n".join((p.extract_text() or "") for p in original_reader.pages[:min(10, original_pages)])
          if original_pages < 4 or not (COMPANY in original_text and CODE in original_text):
              raise RuntimeError(f"Original PDF validation failed: pages={original_pages}")
          if "海通" not in original_text or "三轮驱动" not in original_text:
              raise RuntimeError("Original PDF broker/title validation failed")
          manifest.append({**original, "actual_pages": original_pages, "bytes": len(original_data), "sha256": hashlib.sha256(original_data).hexdigest(), "source_url": original["url"]})

          for spec in summaries:
              path = PDF_DIR / spec["filename"]
              build_summary_pdf(spec, path)
              reader = PdfReader(str(path), strict=False)
              text = "\n".join((p.extract_text() or "") for p in reader.pages)
              if not all(token in text for token in [COMPANY, CODE, spec["broker"], "非券商原始PDF"]):
                  raise RuntimeError(f"Summary PDF validation failed: {path.name}")
              data = path.read_bytes()
              manifest.append({**spec, "actual_pages": len(reader.pages), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})

          for item in manifest:
              path = PDF_DIR / item["filename"]
              q = subprocess.run(["qpdf", "--warning-exit-0", "--check", str(path)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if q.returncode != 0:
                  raise RuntimeError(f"qpdf validation failed for {path.name}: {q.stdout}")
              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {path.name}: {render.stdout}")
              item["preview_file"] = str(Path("首页预览") / preview.name)

          readme = [
              f"申达股份（{CODE}.SH）券商研究资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：1份券商原始PDF + 2份公开研报摘要索引版。",
              "公开渠道仅取得海通证券报告的完整原始PDF；两份申万宏源报告未取得可直接公开下载的原始PDF，故仅制作摘要索引版，并在文件名及首页显著标注。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；研究员：{item['analyst']}；发布日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   公开来源：{item.get('source_url') or item.get('detail_url')}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、券商与标题标识、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "未绕过登录、会员或付费限制。",
          ]
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {"company": COMPANY, "full_company_name": FULL, "stock_code": CODE, "prepared_on": PREPARED, "report_count": len(manifest), "original_pdf_count": sum(x["document_form"] == "券商原始PDF" for x in manifest), "index_pdf_count": sum("摘要索引版" in x["document_form"] for x in manifest), "files": manifest}
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "文件性质", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256", "公开来源"])
              for item in manifest:
                  writer.writerow([item["filename"], item["document_form"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"], item["actual_pages"], item["bytes"], item["sha256"], item.get("source_url") or item.get("detail_url")])
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n", encoding="utf-8")

          zip_path = Path("shenda_600626_broker_research_materials_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {"package": zip_path.name, "zip_bytes": zip_path.stat().st_size, "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(), "report_count": len(manifest), "original_pdf_count": payload["original_pdf_count"], "index_pdf_count": payload["index_pdf_count"], "files": [{k: item[k] for k in ["filename", "document_form", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256"]} for item in manifest]}
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: shenda-600626-broker-research-materials-3-20261103
          path: |
            shenda_600626_broker_research_materials_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
