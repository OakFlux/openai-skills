name: Crawl NEEQ date windows for Guoji Zhongzhuang reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-date-window-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Search all disclosures in likely annual-report windows
        run: |
          python - <<'PY'
          import json, requests, time
          s=requests.Session()
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s.headers.update({'User-Agent':ua})
          for u in ['http://www.neeq.com.cn/disclosure/examine.html','https://www.neeq.com.cn/disclosure/examine.html']:
            try:
              r=s.get(u,timeout=30,allow_redirects=True); print('WARM',u,r.status_code,r.url,len(r.content),s.cookies.get_dict())
            except Exception as e: print('WARM_ERR',repr(e))
          endpoints=['http://www.neeq.com.cn/disclosureInfoController/infoResult.do','https://www.neeq.com.cn/disclosureInfoController/infoResult.do']
          windows=[
            ('2016-04-15','2016-05-10'),
            ('2017-04-15','2017-05-10'),
            ('2018-04-15','2018-05-10'),
            ('2019-02-20','2019-03-10'),
            ('2020-03-20','2020-05-10'),
          ]
          for ep in endpoints:
            for dtype in ['5','9']:
              for isnew in ['1','0']:
                for start,end in windows:
                  for page in range(0,6):
                    form={'disclosureType':dtype,'page':str(page),'companyCd':'','isNewThree':isnew,'startTime':start,'endTime':end,'keyword':'','xxfcbj':'1'}
                    headers={'User-Agent':ua,'Accept':'text/plain','Content-Type':'application/x-www-form-urlencoded','Referer':'http://www.neeq.com.cn/disclosure/examine.html'}
                    try:
                      r=s.post(ep,data=form,headers=headers,timeout=40,allow_redirects=True)
                      raw=r.text.strip(); clean=raw[5:-1] if raw.startswith('null(') and raw.endswith(')') else raw.rstrip(';')
                      try: obj=json.loads(clean)
                      except Exception:
                        print('PARSE_FAIL',ep,dtype,isnew,start,end,page,r.status_code,len(raw),repr(raw[:300])); break
                      blocks=obj if isinstance(obj,list) else [obj]
                      rows=[]; total_pages=0
                      for b in blocks:
                        if isinstance(b,dict):
                          li=b.get('listInfo') or {}; rows+=li.get('content') or []; total_pages=max(total_pages,int(li.get('totalPages') or 0))
                      print('QUERY',ep,dtype,isnew,start,end,page,'ROWS',len(rows),'PAGES',total_pages)
                      for rec in rows:
                        blob=json.dumps(rec,ensure_ascii=False,sort_keys=True)
                        if any(x in blob for x in ('400062','二重','国重装','国机重型装备')):
                          print('MATCH',blob)
                      if page+1>=total_pages or not rows: break
                    except Exception as exc:
                      print('ERR',ep,dtype,isnew,start,end,page,repr(exc)); break
                    time.sleep(.1)
          PY
