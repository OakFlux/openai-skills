name: Build Xiceceshi 301306 broker deep reports

on:
  push:
    branches:
      - tmp-xiceceshi-broker-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='西测测试_301306_券商深度报告'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/xiceceshi_broker_render /tmp/xiceceshi_candidates

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from datetime import datetime
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('西测测试_301306_券商深度报告')
          TMP = Path('/tmp/xiceceshi_candidates')
          API = 'https://reportapi.eastmoney.com/report/list'
          PDF_TPL = 'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf'

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Referer': 'https://data.eastmoney.com/',
          })

          params = {
              'industryCode': '*', 'pageSize': '100', 'industry': '*',
              'rating': '*', 'ratingChange': '*',
              'beginTime': '2000-01-01', 'endTime': '2030-12-31',
              'pageNo': '1', 'fields': '', 'qType': '0',
              'orgCode': '', 'code': '301306', 'rcode': '',
              'p': '1', 'pageNum': '1', 'pageNumber': '1',
          }
          response = session.get(API, params=params, timeout=(30, 180))
          response.raise_for_status()
          payload = response.json()
          rows = payload.get('data') or []
          if not rows:
              raise RuntimeError(f'No Eastmoney reports returned: {str(payload)[:500]}')

          print('REPORT_API_COUNT', len(rows), 'TOTAL_PAGE', payload.get('TotalPage'), 'HITS', payload.get('hits'))
          for row in rows:
              print('REPORT_META', row.get('publishDate'), '|', row.get('orgSName'), '|', row.get('title'), '|', row.get('infoCode'))

          # Explicit public fallback for the known Tianfeng first-coverage report.
          if not any((r.get('infoCode') or '') == 'AP202306061590456420' for r in rows):
              rows.append({
                  'title': '一站式第三方检测机构，错位竞争聚焦军用装备',
                  'orgSName': '天风证券',
                  'publishDate': '2023-04-10 00:00:00',
                  'infoCode': 'AP202306061590456420',
                  'stockName': '西测测试',
                  'stockCode': '301306',
              })

          def safe(value: str, limit: int = 70) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value or '').strip()
              value = re.sub(r'\s+', '', value)
              return value[:limit] or '未命名'

          def extract_text(reader: PdfReader) -> str:
              pages = len(reader.pages)
              idxs = list(range(min(18, pages)))
              if pages > 18:
                  idxs.append(pages - 1)
              chunks = []
              for idx in dict.fromkeys(idxs):
                  try:
                      chunks.append(reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              return '\n'.join(chunks)

          def fetch_pdf(url: str, referer: str) -> bytes:
              last = None
              for attempt in range(7):
                  try:
                      r = session.get(
                          url,
                          headers={
                              'Referer': referer,
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                          },
                          timeout=(30, 360),
                          allow_redirects=True,
                      )
                      data = r.content
                      if r.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 120_000:
                          return data
                      last = RuntimeError(f'HTTP={r.status_code}, bytes={len(data)}, type={r.headers.get("content-type")}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(1 + attempt, 6))
              raise RuntimeError(f'download failed: {last!r}')

          def score_candidate(title: str, pages: int, publish_date: str) -> int:
              score = pages * 6
              keywords = {
                  '商业航天载荷超级工厂': 1200,
                  '一站式第三方检测机构': 1000,
                  '检测业务需求高涨': 900,
                  '首次覆盖': 700,
                  '深度报告': 650,
                  '公司深度': 650,
                  '错位竞争': 350,
                  '一站式': 220,
                  '商业航天': 220,
              }
              for key, value in keywords.items():
                  if key in title:
                      score += value
              penalties = ['点评', '业绩预告', '季报', '年报', '半年报', '中报', '快报', '事件']
              for key in penalties:
                  if key in title:
                      score -= 500
              try:
                  year = int((publish_date or '')[:4])
                  score += max(0, year - 2020) * 12
              except Exception:
                  pass
              return score

          candidates = []
          seen_info = set()
          seen_sha = set()
          for row in rows:
              info = (row.get('infoCode') or '').strip()
              title = (row.get('title') or '').strip()
              broker = (row.get('orgSName') or '未知券商').strip()
              date = (row.get('publishDate') or '')[:10]
              if not info or info in seen_info:
                  continue
              seen_info.add(info)
              url = PDF_TPL.format(info_code=info)
              referer = f'https://data.eastmoney.com/report/info/{info}.html'
              try:
                  data = fetch_pdf(url, referer)
                  sha = hashlib.sha256(data).hexdigest()
                  if sha in seen_sha:
                      continue
                  seen_sha.add(sha)
                  temp = TMP / f'{info}.pdf'
                  temp.write_bytes(data)
                  reader = PdfReader(str(temp), strict=False)
                  pages = len(reader.pages)
                  text = extract_text(reader)
                  compact = re.sub(r'\s+', '', text)
                  if pages < 8:
                      print('SKIP_SHORT', info, pages, title)
                      continue
                  if '西测测试' not in compact and '西安西测测试技术股份有限公司' not in compact:
                      print('SKIP_COMPANY_MISMATCH', info, title)
                      continue
                  broker_key = broker.replace('证券股份有限公司', '').replace('证券有限公司', '').replace('证券', '')
                  broker_ok = (not broker_key) or (broker_key in compact)
                  quality = score_candidate(title, pages, date)
                  candidates.append({
                      'infoCode': info,
                      'title': title,
                      'broker': broker,
                      'date': date,
                      'url': url,
                      'referer': referer,
                      'pages': pages,
                      'bytes': len(data),
                      'sha256': sha,
                      'temp': str(temp),
                      'broker_ok': broker_ok,
                      'score': quality,
                  })
                  print('VALID_CANDIDATE', quality, pages, broker_ok, date, broker, title, info)
              except Exception as exc:
                  print('CANDIDATE_FAILED', date, broker, title, info, repr(exc))

          if not candidates:
              raise RuntimeError('No valid original PDF reports found')

          # Prefer high-quality/deep reports and diversify brokers. Keep 2-3 reports.
          candidates.sort(key=lambda x: (x['score'], x['pages'], x['date']), reverse=True)
          selected = []
          used_brokers = set()
          for item in candidates:
              if item['broker'] in used_brokers:
                  continue
              selected.append(item)
              used_brokers.add(item['broker'])
              if len(selected) == 3:
                  break
          if len(selected) < 2:
              for item in candidates:
                  if item in selected:
                      continue
                  selected.append(item)
                  if len(selected) == 2:
                      break
          if len(selected) < 2:
              raise RuntimeError(f'Only {len(selected)} usable report(s) found')

          records = []
          for index, item in enumerate(selected, start=1):
              filename = f"{index:02d}_{safe(item['broker'], 20)}_{safe(item['title'])}_{item['date']}.pdf"
              target = OUT / filename
              target.write_bytes(Path(item['temp']).read_bytes())
              records.append({**item, 'order': index, 'filename': filename})
              print('SELECTED', index, item['score'], item['pages'], item['broker'], item['title'], item['infoCode'])

          lines = [
              '西测测试（301306）券商深度报告资料包',
              f'整理日期：{datetime.now().strftime("%Y-%m-%d")}',
              '',
              '收录原则：优先选择公开渠道可直接下载的券商原始完整PDF，并依据报告篇幅、首次覆盖/深度研究属性、主题完整性和券商多样性筛选。',
              '未使用网页摘要、预览截图或重新排版版本替代原始报告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   发布日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['url']}",
                  f"   研报索引：{item['referer']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f'合计：{len(records)}份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          count=$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)
          test "$count" -ge 2 && test "$count" -le 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 120000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 8
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '西测测试|西安西测测试技术股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/xiceceshi_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/xiceceshi_broker_test.zip "$PACKAGE"
          unzip -t /tmp/xiceceshi_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/xiceceshi_broker_test.zip | grep -c '\.pdf$')" -eq "$count"
          rm -f /tmp/xiceceshi_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Xiceceshi-301306-broker-deep-reports
          path: 西测测试_301306_券商深度报告/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
