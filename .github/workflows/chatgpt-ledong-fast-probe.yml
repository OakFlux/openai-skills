name: Fast probe Ledong Robotics report viewer

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Probe viewer metadata and image availability without downloading full images
        shell: bash
        run: |
          cat > /tmp/fast_viewer_probe.py <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('fast_output'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          reports={
              '5593366':'2026/08/10',
              '5608254':'2026/08/16',
              '5637842':'2026/08/25',
              '5646471':'2026/08/26',
          }
          all_scripts=[]
          for rid,date in reports.items():
              u=f'https://www.fxbaogao.com/view?id={rid}'
              r=s.get(u,timeout=45,allow_redirects=True)
              print('\nVIEW',rid,r.status_code,r.url,r.headers.get('content-type'),len(r.content),s.cookies.get_dict())
              (OUT/f'view_{rid}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              print('VIEW_TEXT',rid,' '.join(soup.stripped_strings)[:3000])
              for tag in soup.find_all(['script','iframe','embed','object','img','link']):
                  for attr in ('src','href','data'):
                      val=tag.get(attr)
                      if val:
                          full=urllib.parse.urljoin(r.url,val)
                          print('RESOURCE',rid,tag.name,attr,full)
                          if tag.name=='script' and attr=='src': all_scripts.append(full)
              for key in ('report-image','pdf','download','reportId','pageCount','totalPage','fileUrl','mofoun','viewer'):
                  positions=[m.start() for m in re.finditer(key,r.text,re.I)]
                  for pos in positions[:10]: print('CONTEXT',rid,key,repr(r.text[max(0,pos-300):pos+700]))

          for idx,u in enumerate(dict.fromkeys(all_scripts)):
              try:
                  r=s.get(u,timeout=60); r.raise_for_status(); txt=r.text
                  (OUT/f'script_{idx:03d}.js').write_bytes(r.content)
                  print('\nSCRIPT',idx,u,len(r.content))
                  for key in ('report-image','pdf','download','reportId','pageCount','totalPage','fileUrl','mofoun','viewer','/api/'):
                      positions=[m.start() for m in re.finditer(key,txt,re.I)]
                      for pos in positions[:20]: print('SCRIPT_CONTEXT',idx,key,repr(txt[max(0,pos-500):pos+1200]))
              except Exception as e: print('SCRIPT_ERR',idx,u,repr(e))

          summary={}
          for rid,date in reports.items():
              pages=[]; missing=[]; consecutive=0
              for page in range(1,81):
                  u=f'https://public.fxbaogao.com/report-image/{date}/{rid}-{page}.png'
                  try:
                      r=s.head(u,headers={'Referer':f'https://www.fxbaogao.com/view?id={rid}'},timeout=20,allow_redirects=True)
                      ctype=str(r.headers.get('content-type') or '')
                      clen=r.headers.get('content-length')
                      valid=r.status_code==200 and (ctype.startswith('image/') or (clen and int(clen)>1000))
                      print('HEAD_IMAGE',rid,page,r.status_code,ctype,clen,valid)
                      if not valid and r.status_code in (403,405):
                          rr=s.get(u,headers={'Range':'bytes=0-2047','Referer':f'https://www.fxbaogao.com/view?id={rid}'},timeout=20,allow_redirects=True,stream=True)
                          first=next(rr.iter_content(2048),b'')
                          ctype=str(rr.headers.get('content-type') or '')
                          valid=rr.status_code in (200,206) and len(first)>1000 and (ctype.startswith('image/') or first[:8]==b'\x89PNG\r\n\x1a\n')
                          print('RANGE_IMAGE',rid,page,rr.status_code,ctype,len(first),valid)
                      if valid:
                          pages.append(page); consecutive=0
                      else:
                          missing.append(page); consecutive+=1
                          if consecutive>=3 and page>3: break
                  except Exception as e:
                      print('HEAD_ERR',rid,page,repr(e)); missing.append(page); consecutive+=1
                      if consecutive>=3 and page>3: break
              summary[rid]={'pages':pages,'missing':missing,'count':len(pages)}
              print('COUNT',rid,len(pages),pages)
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/fast_viewer_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_Robotics_Fast_Probe
          path: fast_output
          retention-days: 2
          if-no-files-found: error
