name: Build complete Yongtai broker report page archives 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-sdyanbao-public-page-archive-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow img2pdf pypdf

      - name: Download complete public page sets and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, subprocess, time, zipfile
          from pathlib import Path
          import img2pdf, requests
          from PIL import Image
          from pypdf import PdfReader

          package='永太科技_002326_券商研究报告_3份_公开页面归档版'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'抽样页校验'; previews.mkdir(exist_ok=True)
          work=Path('_pages'); work.mkdir(exist_ok=True)
          reports=[
            {
              'seq':1,'broker':'海通国际','date':'2023-05-23','analysts':'刘威、庄怀超',
              'title':'以含氟技术为核心，持续深耕锂电材料及医药板块','pages':10,
              'base':'https://oss.sdyanbao.com/page/2023/5/23/544411','source_id':410780,
              'source_uuid':'AP202305231587068941',
              'filename':'01_海通国际_以含氟技术为核心持续深耕锂电材料及医药板块_20230523_公开页面归档版.pdf'
            },
            {
              'seq':2,'broker':'中泰证券','date':'2021-06-15','analysts':'苏晨、陈传红',
              'title':'氟化工龙头，六氟、VC高弹性品种','pages':15,
              'base':'https://oss.sdyanbao.com/page/2021/6/15/224310','source_id':178688,
              'source_uuid':'AP202106151498032996',
              'filename':'02_中泰证券_氟化工龙头六氟VC高弹性品种_20210615_公开页面归档版.pdf'
            },
            {
              'seq':3,'broker':'中泰证券','date':'2021-08-16','analysts':'苏晨、陈传红',
              'title':'业绩符合预期，与动力大客户签订长单助力公司穿越周期','pages':8,
              'base':'https://oss.sdyanbao.com/page/2021/8/16/220719','source_id':175141,
              'source_uuid':'AP202108161510389325',
              'filename':'03_中泰证券_业绩符合预期与动力大客户签订长单助力公司穿越周期_20210816_公开页面归档版.pdf'
            }
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Referer':'https://www.sdyanbao.com/','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'})

          def get_image(url):
            last=None
            for attempt in range(6):
              try:
                r=s.get(url,timeout=(20,120),allow_redirects=True)
                last={'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'final':r.url}
                if r.status_code==200 and len(r.content)>5000:
                  with Image.open(io.BytesIO(r.content)) as im:
                    im.verify()
                  return r.content,last
              except Exception as e:
                last={'error':repr(e)}
              time.sleep(1+attempt)
            raise RuntimeError(f'page download failed {url}: {last}')

          manifest=[]
          for rep in reports:
            page_dir=work/f"{rep['seq']:02d}"; page_dir.mkdir(exist_ok=True)
            paths=[]; page_checks=[]
            for i in range(rep['pages']):
              url=f"{rep['base']}/{i}.png"
              data,download=get_image(url)
              p=page_dir/f'{i:03d}.png'; p.write_bytes(data)
              with Image.open(p) as im:
                size=im.size; fmt=im.format; mode=im.mode
              if size[0]<500 or size[1]<500:
                raise RuntimeError(f'unexpected page size {url}: {size}')
              paths.append(p)
              page_checks.append({'index':i,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'size':size,'format':fmt,'mode':mode,'download':download})

            dest=root/rep['filename']; dest.write_bytes(img2pdf.convert([str(p) for p in paths]))
            reader=PdfReader(str(dest),strict=False); actual_pages=len(reader.pages)
            if actual_pages!=rep['pages']:
              raise RuntimeError(f'page count mismatch {dest.name}: {actual_pages}')
            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            rendered=[]
            for n in sorted(set([1,max(1,(actual_pages+1)//2),actual_pages])):
              prefix=previews/f"{rep['seq']:02d}_{rep['broker']}_第{n}页"
              subprocess.run(['pdftoppm','-f',str(n),'-l',str(n),'-png','-r','110','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              png=Path(str(prefix)+'.png')
              if not png.exists() or png.stat().st_size<10000: raise RuntimeError('render failed')
              rendered.append(str(Path('抽样页校验')/png.name))
            data=dest.read_bytes()
            manifest.append({**rep,'actual_pages':actual_pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'file_nature':'公开逐页图像按原顺序封装的PDF归档版，非券商原始PDF文件，不含文字层','page_checks':page_checks,'qpdf':q.stdout.strip(),'rendered_samples':rendered})

          readme=[
            '浙江永太科技股份有限公司（002326.SZ）券商研究报告资料包',
            '整理日期：2026-10-15','',
            '本包共3份：其中2份公司研究/首次覆盖报告，另含1份后续跟踪报告。',
            '公开原始PDF端点当前返回空文件，因此包内文件采用公开可直接访问的完整逐页图像，按原页序无损封装为PDF。它们不是券商服务器提供的原始PDF，也不含可搜索文字层。',''
          ]
          for x in manifest:
            readme += [f"{x['seq']}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；分析师：{x['analysts']}；完整页数：{x['actual_pages']}页",f"   文件：{x['filename']}",f"   公开页面：{x['base']}；来源标识：{x['source_uuid']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['核验项目：逐页下载状态、图像解析和尺寸、完整页数、qpdf结构、首页/中间页/末页渲染、PDF SHA-256及ZIP CRC。','报告版权归原券商及作者所有，仅供个人研究参考，不构成投资建议。']
          (root/'00_文件清单与核验说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          with (root/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f); w.writerow(['序号','券商','日期','标题','分析师','文件名','页数','字节数','SHA-256','公开页面','来源标识','文件性质'])
            for x in manifest: w.writerow([x['seq'],x['broker'],x['date'],x['title'],x['analysts'],x['filename'],x['actual_pages'],x['bytes'],x['sha256'],x['base'],x['source_uuid'],x['file_nature']])
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3: raise RuntimeError(f'zip check failed bad={bad} pdfs={len(pdfs)}')
          print(json.dumps({'zip':str(zpath),'zip_bytes':zpath.stat().st_size,'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'reports':[{'file':x['filename'],'pages':x['actual_pages'],'bytes':x['bytes'],'sha256':x['sha256']} for x in manifest]},ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-broker-reports-public-page-archive-final
          path: 永太科技_002326_券商研究报告_3份_公开页面归档版.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
