name: Build Yongtai broker report public page archives 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-sdyanbao-public-page-archive-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow img2pdf pypdf

      - name: Download public report pages and build PDF archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '永太科技_002326_券商深度报告_3份_公开页面归档版'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEWS = ROOT / '抽样页校验'
          PREVIEWS.mkdir(exist_ok=True)
          WORK = Path('_work_pages')
          WORK.mkdir(exist_ok=True)

          REPORTS = [
              {
                  'seq': 1,
                  'broker': '国联证券',
                  'date': '2022-09-29',
                  'title': '构建产业链一体化，打造业绩新曲线',
                  'analyst': '贺朝晖',
                  'rating': '买入（首次覆盖）',
                  'page_count': 27,
                  'file_size_reference': 1010287,
                  'source_id': 296135,
                  'original_id': 366808,
                  'source_uuid': 'AP202209291578773236',
                  'page_base': 'https://oss.sdyanbao.com/page/2022/9/29/366808',
                  'filename': '01_国联证券_构建产业链一体化_打造业绩新曲线_20220929_公开页面归档版.pdf',
              },
              {
                  'seq': 2,
                  'broker': '国盛证券',
                  'date': '2021-07-12',
                  'title': '从含氟精细化学品出发，抢攻锂电池电解液材料制高点',
                  'analyst': '王席鑫、王磊、郑震湘、杨义韬',
                  'rating': '买入（首次覆盖）',
                  'page_count': 18,
                  'file_size_reference': 1754808,
                  'source_id': 177527,
                  'original_id': 223129,
                  'source_uuid': 'AP202107121503339193',
                  'page_base': 'https://oss.sdyanbao.com/page/2021/7/12/223129',
                  'filename': '02_国盛证券_从含氟精细化学品出发_抢攻锂电池电解液材料制高点_20210712_公开页面归档版.pdf',
              },
              {
                  'seq': 3,
                  'broker': '中泰证券',
                  'date': '2021-06-15',
                  'title': '氟化工龙头，六氟、VC高弹性品种',
                  'analyst': '苏晨、陈传红',
                  'rating': '增持（首次覆盖）',
                  'page_count': 15,
                  'file_size_reference': 1510675,
                  'source_id': 178688,
                  'original_id': 224310,
                  'source_uuid': 'AP202106151498032996',
                  'page_base': 'https://oss.sdyanbao.com/page/2021/6/15/224310',
                  'filename': '03_中泰证券_氟化工龙头_六氟VC高弹性品种_20210615_公开页面归档版.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.sdyanbao.com/',
          })

          def fetch_image(url: str) -> tuple[bytes, dict[str, Any]]:
              attempts=[]
              for attempt in range(6):
                  try:
                      r=session.get(url,timeout=(20,180),allow_redirects=True)
                      meta={'url':url,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                      attempts.append(meta)
                      if r.status_code==200 and len(r.content)>5000:
                          try:
                              with Image.open(io.BytesIO(r.content)) as im:
                                  im.verify()
                              return r.content, {'successful':meta,'attempts':attempts}
                          except Exception as exc:
                              meta['image_error']=repr(exc)
                  except Exception as exc:
                      attempts.append({'url':url,'error':repr(exc)})
                  time.sleep(1+attempt)
              raise RuntimeError(f'Image download failed: {url}; attempts={attempts}')

          manifest=[]
          for report in REPORTS:
              page_dir=WORK/f"{report['seq']:02d}"
              page_dir.mkdir(parents=True,exist_ok=True)
              page_paths=[]
              page_meta=[]
              reference_size=None
              reference_format=None
              for page_index in range(report['page_count']):
                  url=f"{report['page_base']}/{page_index}.png"
                  data,download_log=fetch_image(url)
                  path=page_dir/f'{page_index:03d}.png'
                  path.write_bytes(data)
                  with Image.open(path) as im:
                      size=im.size; fmt=im.format; mode=im.mode
                  if page_index==0:
                      reference_size=size;reference_format=fmt
                  if size[0]<500 or size[1]<500:
                      raise RuntimeError(f'Unexpected small page image {url}: {size}')
                  page_paths.append(path)
                  page_meta.append({'page_index':page_index,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'image_size':size,'image_format':fmt,'image_mode':mode,'download_log':download_log})

              dest=ROOT/report['filename']
              pdf_bytes=img2pdf.convert([str(p) for p in page_paths])
              dest.write_bytes(pdf_bytes)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages!=report['page_count']:
                  raise RuntimeError(f'PDF page mismatch {dest.name}: {pages} != {report["page_count"]}')
              qpdf=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)

              rendered=[]
              for page_no in sorted(set([1,max(1,(pages+1)//2),pages])):
                  prefix=PREVIEWS/f"{report['seq']:02d}_{report['broker']}_第{page_no}页"
                  subprocess.run(['pdftoppm','-f',str(page_no),'-l',str(page_no),'-png','-r','110','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  png=Path(str(prefix)+'.png')
                  if not png.exists() or png.stat().st_size<10000:
                      raise RuntimeError(f'Render failed {dest.name} page {page_no}')
                  rendered.append(str(Path('抽样页校验')/png.name))

              sha=hashlib.sha256(pdf_bytes).hexdigest()
              manifest.append({
                  **report,
                  'archive_nature':'由公开可直接访问的逐页PNG图像按原顺序无损封装为PDF；非券商原始PDF文件',
                  'actual_pages':pages,
                  'actual_bytes':len(pdf_bytes),
                  'sha256':sha,
                  'first_page_image_size':reference_size,
                  'first_page_image_format':reference_format,
                  'qpdf_output':qpdf.stdout.strip(),
                  'rendered_sample_pages':rendered,
                  'page_files':page_meta,
              })

          readme=[
              '浙江永太科技股份有限公司（002326.SZ）券商深度报告资料包',
              '整理日期：2026-10-15',
              '',
              '本包收录3份公司深度/首次覆盖报告。由于公开索引中的原始PDF下载端点当前返回空文件，本包改用公开可直接访问的逐页报告图像，按原页序无损封装为PDF。',
              '因此，包内PDF是“公开页面归档版”，内容和页序对应原报告，但不是券商服务器提供的原始PDF文件，也不含可检索文字层。',
              '',
          ]
          for item in manifest:
              readme += [
                  f"{item['seq']}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；分析师：{item['analyst']}；评级：{item['rating']}",
                  f"   文件：{item['filename']}；页数：{item['actual_pages']}；大小：{item['actual_bytes']}字节",
                  f"   公开页面来源：{item['page_base']}；来源标识：{item['source_uuid']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '核验项目：逐页HTTP状态、图像可解析性及尺寸、页数、qpdf结构、首页/中间页/末页渲染、PDF SHA-256和ZIP CRC。',
              '报告内容及版权归原券商和作者所有，仅供个人研究参考，不构成投资建议。',
          ]
          (ROOT/'00_文件清单与核验说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          with (ROOT/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f)
              w.writerow(['序号','券商','日期','标题','分析师','评级','文件名','页数','字节数','SHA-256','公开页面来源','来源标识','文件性质'])
              for x in manifest:
                  w.writerow([x['seq'],x['broker'],x['date'],x['title'],x['analyst'],x['rating'],x['filename'],x['actual_pages'],x['actual_bytes'],x['sha256'],x['page_base'],x['source_uuid'],x['archive_nature']])
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as zf:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      zf.write(path,arcname=f'{PACKAGE}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path,'r') as zf:
              bad=zf.testzip()
              pdfs=[n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if bad is not None or len(pdfs)!=3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')
          print(json.dumps({'zip':str(zip_path),'zip_bytes':zip_path.stat().st_size,'zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'reports':[{'filename':x['filename'],'pages':x['actual_pages'],'bytes':x['actual_bytes'],'sha256':x['sha256']} for x in manifest]},ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-broker-deep-reports-public-page-archive
          path: 永太科技_002326_券商深度报告_3份_公开页面归档版.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
