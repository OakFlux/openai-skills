name: Package Tibet Pharmaceutical reports v2

on:
  push:
    paths:
      - '.github/workflows/package-tibet-pharma-600211-final-v2-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Download validate and package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests

          CODE='600211'
          AS_OF='2026-10-15'
          PACKAGE='西藏药业_600211_2020-2025年报及最新季报'
          ROOT=Path(PACKAGE); PDF_DIR=ROOT/'PDF文件'; VERIFY=ROOT/'验证记录'
          PDF_DIR.mkdir(parents=True,exist_ok=True); VERIFY.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          api='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          stock_variants=['600211,gssh0600211','600211,gssse0600211','600211,sse600211','600211']

          def norm(x):
              x=re.sub(r'<[^>]+>','',str(x or ''))
              return re.sub(r'[\s:：()（）【】\[\]]+','',x.replace('&nbsp;',' '))

          def clean_title(x):
              return re.sub(r'<[^>]+>','',str(x or '')).strip()

          def ddate(row):
              m=re.search(r'finalpage/(\d{4}-\d{2}-\d{2})/',str(row.get('adjunctUrl') or ''))
              return m.group(1) if m else ''

          def query(searchkey,date_range):
              all_errors=[]
              best=[]; best_stock=None
              for stock in stock_variants:
                  rows=[]; seen=set()
                  try:
                      for page in range(1,12):
                          form={'pageNum':str(page),'pageSize':'30','column':'sse','tabName':'fulltext','plate':'sh',
                                'stock':stock,'searchkey':searchkey,'secid':'','category':'','trade':'','seDate':date_range,
                                'sortName':'','sortType':'','isHLtitle':'true'}
                          r=s.post(api,data=form,headers={'User-Agent':UA,
                              'Referer':'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search',
                              'X-Requested-With':'XMLHttpRequest'},timeout=90)
                          r.raise_for_status(); payload=r.json(); batch=payload.get('announcements') or []
                          if not batch: break
                          for row in batch:
                              key=(row.get('announcementId'),row.get('adjunctUrl'))
                              if key not in seen: seen.add(key); rows.append(row)
                          total=int(payload.get('totalAnnouncement') or 0)
                          if total and page*30>=total: break
                      print('QUERY',searchkey,date_range,stock,'ROWS',len(rows),flush=True)
                      for row in rows:
                          print('ROW_TITLE',clean_title(row.get('announcementTitle')),'URL',row.get('adjunctUrl'),flush=True)
                      if len(rows)>len(best): best=rows; best_stock=stock
                      if rows: return rows,stock
                  except Exception as exc:
                      all_errors.append({'stock':stock,'error':repr(exc)})
              print('QUERY_ERRORS',json.dumps(all_errors,ensure_ascii=False),flush=True)
              return best,best_stock

          selections=[]; query_log=[]
          for idx,year in enumerate(range(2020,2026),1):
              phrase=f'{year}年年度报告'
              ranges=[f'{year+1}-01-01~{year+1}-12-31',f'{year}-01-01~{min(2026,year+2)}-12-31','2020-01-01~2026-10-15']
              candidates=[]
              for dr in ranges:
                  rows,stock=query(phrase,dr); query_log.append({'phrase':phrase,'range':dr,'stock':stock,'rows':rows})
                  for row in rows:
                      t=norm(row.get('announcementTitle'))
                      if phrase not in t: continue
                      if any(bad in t for bad in ('摘要','英文','社会责任','环境报告','内部控制','审计报告','问询','回复','更正公告')): continue
                      candidates.append(row)
                  if candidates: break
              if not candidates:
                  raise RuntimeError(f'No full annual report candidate for {year}')
              # Full annual report has the shortest direct title; prefer any later revised disclosure on equal title length.
              chosen=min(candidates,key=lambda r:(len(norm(r.get('announcementTitle'))),-int(r.get('announcementTime') or 0)))
              selections.append({'kind':'年度报告','year':year,'title':clean_title(chosen.get('announcementTitle')),
                  'date':ddate(chosen),'row':chosen,'filename':f'{idx:02d}_西藏药业_{year}年年度报告.pdf'})

          quarters=[]
          for phrase in ('2026年第三季度报告','2026年第一季度报告'):
              rows,stock=query(phrase,'2026-01-01~2026-10-15'); query_log.append({'phrase':phrase,'range':'2026-01-01~2026-10-15','stock':stock,'rows':rows})
              for row in rows:
                  t=norm(row.get('announcementTitle'))
                  if phrase in t and not any(bad in t for bad in ('摘要','正文','英文','问询','回复')):
                      quarters.append(row)
          if not quarters: raise RuntimeError('No 2026 formal quarterly report candidate')
          q=max(quarters,key=lambda r:(ddate(r),int(r.get('announcementTime') or 0)))
          qtitle=clean_title(q.get('announcementTitle')); qlabel='第三季度报告' if '第三季度' in qtitle else '第一季度报告'
          selections.append({'kind':'最新季报','year':2026,'title':qtitle,'date':ddate(q),'row':q,
              'filename':f'07_西藏药业_2026年{qlabel}_最新季报.pdf'})
          (VERIFY/'CNINFO_查询与选中文件.json').write_text(json.dumps({'queries':query_log,'selections':selections},ensure_ascii=False,indent=2),encoding='utf-8')

          def download(row,path):
              adj=str(row.get('adjunctUrl') or '')
              if not adj: raise RuntimeError('Missing adjunctUrl')
              urls=['https://static.cninfo.com.cn/'+adj.lstrip('/'),'http://static.cninfo.com.cn/'+adj.lstrip('/')]
              attempts=[]
              for url in urls:
                  for attempt in range(1,4):
                      try:
                          r=s.get(url,headers={'User-Agent':UA,'Referer':'https://www.cninfo.com.cn/','Accept':'application/pdf,*/*;q=0.8'},timeout=240,allow_redirects=True)
                          meta={'url':url,'final_url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'attempt':attempt}; attempts.append(meta)
                          if r.status_code==200 and r.content.startswith(b'%PDF') and len(r.content)>50000:
                              path.write_bytes(r.content); return r.url,attempts
                      except Exception as exc: attempts.append({'url':url,'attempt':attempt,'error':repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError('Download failed '+json.dumps(attempts,ensure_ascii=False))

          records=[]; hashes=set()
          for sel in selections:
              path=PDF_DIR/sel['filename']; source,attempts=download(sel['row'],path); data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError('Duplicate PDF '+path.name)
              hashes.add(sha)
              qcheck=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],capture_output=True,text=True)
              if qcheck.returncode!=0: raise RuntimeError('qpdf failed '+path.name+' '+qcheck.stderr[-1000:])
              info=subprocess.run(['pdfinfo',str(path)],capture_output=True,text=True)
              pm=re.search(r'^Pages:\s+(\d+)',info.stdout,re.M)
              if info.returncode!=0 or not pm: raise RuntimeError('pdfinfo failed '+path.name)
              pages=int(pm.group(1))
              txt=VERIFY/(path.stem+'_前12页.txt')
              tr=subprocess.run(['pdftotext','-f','1','-l',str(min(12,pages)),'-layout',str(path),str(txt)],capture_output=True,text=True)
              if tr.returncode!=0: raise RuntimeError('pdftotext failed '+path.name)
              text=norm(txt.read_text(encoding='utf-8',errors='replace'))
              if not any(k in text for k in ('西藏药业','西藏诺迪康药业',CODE)): raise RuntimeError('company check failed '+path.name)
              if str(sel['year']) not in text: raise RuntimeError('year check failed '+path.name)
              if sel['kind']=='年度报告' and '年度报告' not in text: raise RuntimeError('annual check failed '+path.name)
              if sel['kind']=='最新季报' and '季度报告' not in text: raise RuntimeError('quarter check failed '+path.name)
              prefix=VERIFY/(path.stem+'_首页'); rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(path),str(prefix)],capture_output=True,text=True)
              png=Path(str(prefix)+'.png')
              if rr.returncode!=0 or not png.exists() or png.stat().st_size<8000: raise RuntimeError('render failed '+path.name)
              render_bytes=png.stat().st_size; png.unlink()
              official='https://static.cninfo.com.cn/'+str(sel['row'].get('adjunctUrl') or '').lstrip('/')
              rec={'filename':'PDF文件/'+path.name,'document_type':sel['kind'],'title':sel['title'],'report_year':sel['year'],'disclosure_date':sel['date'],
                   'announcement_id':sel['row'].get('announcementId'),'official_pdf_url':official,'download_url':source,'pages':pages,'bytes':len(data),'sha256':sha,
                   'first_page_render_bytes':render_bytes,'download_attempts':attempts}
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          latest=records[-1]['title']
          lines=['西藏药业（600211.SH）2020-2025年年度报告及最新季度报告',f'整理日期：{AS_OF}','',
                 '本包共7份完整PDF：2020-2025年度报告全文6份，以及最新正式季度报告1份。',f'最新季报：{latest}。',
                 '年度报告均为全文，不以摘要替代；半年度报告不按季度报告计入。全部PDF来自巨潮资讯公开披露静态文件。','','文件清单：']
          for i,r in enumerate(records,1):
              lines += [f'{i}. {r["title"]}',f'   文件：{r["filename"]}',f'   披露日期：{r["disclosure_date"]}',f'   页数：{r["pages"]}',
                        f'   官方PDF：{r["official_pdf_url"]}',f'   SHA-256：{r["sha256"]}','']
          (ROOT/'00_文件清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')
          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as a:
              for f in sorted(ROOT.rglob('*')):
                  if f.is_file(): a.write(f,arcname=f'{PACKAGE}/{f.relative_to(ROOT)}')
          with zipfile.ZipFile(z) as a:
              bad=a.testzip(); pdfs=[n for n in a.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=7: raise RuntimeError(f'ZIP failed bad={bad} pdfs={len(pdfs)}')
          print('FINAL_PACKAGE',json.dumps({'filename':z.name,'bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),
                'pdf_count':7,'latest_quarter':latest,'pages':[r['pages'] for r in records]},ensure_ascii=False),flush=True)
          PY

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tibet-pharma-600211-final-v2-20261015
          path: 西藏药业_600211_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
