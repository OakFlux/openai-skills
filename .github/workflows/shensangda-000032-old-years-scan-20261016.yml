name: Scan Deep Sanda early filings
on:
  push:
    paths: ['.github/workflows/shensangda-000032-old-years-scan-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python - <<'PY'
          import requests, re
          s=requests.Session(); s.trust_env=False; s.headers['User-Agent']='Mozilla/5.0'
          rows=[]
          for p in range(1,80):
              q={'sr':'-1','page_size':'100','page_index':p,'ann_type':'A','client_source':'web','stock_list':'000032','f_node':'0','s_node':'0'}
              d=s.get('https://np-anotice-stock.eastmoney.com/api/security/ann',params=q,timeout=90).json(); b=((d.get('data') or {}).get('list') or [])
              if not b: break
              rows += b
          for r in rows:
              t=str(r.get('title') or ''); c=re.sub(r'\s+','',t)
              old=any(str(y) in c for y in range(1993,2008)) or any(x in c for x in ['一九九三','一九九四','一九九五','一九九六','一九九七','一九九八','一九九九','二〇〇〇','二零零零','二〇〇一','二零零一','二〇〇二','二零零二','二〇〇三','二零零三','二〇〇四','二零零四','二〇〇五','二零零五','二〇〇六','二零零六','二〇〇七','二零零七'])
              recent=('2026' in c and any(k in c for k in ['季度','季报']))
              if (old and any(k in c for k in ['年度','年报','报告','招股'])) or recent or '招股说明书' in c:
                  print(r.get('art_code') or r.get('artCode'), '|', r.get('display_time'), '|', t)
          PY
