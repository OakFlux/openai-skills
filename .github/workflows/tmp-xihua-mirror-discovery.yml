name: Temporary Xihua filing mirror discovery

on:
  push:
    branches: [tmp-xihua-official-filings-20260830]
    paths: [.github/workflows/tmp-xihua-mirror-discovery.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query Eastmoney announcements and CNINFO mirrors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests

          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':'https://data.eastmoney.com/notices/stock/603248.html',
              'Accept':'application/json,text/plain,*/*'
          })

          # Eastmoney announcement index.
          for page in range(1,6):
              params={
                  'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A',
                  'client_source':'web','stock_list':'603248','f_node':'0','s_node':'0'
              }
              r=s.get('https://np-anotice-stock.eastmoney.com/api/security/ann',params=params,timeout=90)
              print('\nEM_ANN',page,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
              print('HEAD',repr(r.text[:300]))
              r.raise_for_status(); obj=r.json(); rows=((obj.get('data') or {}).get('list') or [])
              print('ROWS',len(rows))
              for row in rows:
                  title=re.sub('<[^>]+>','',str(row.get('title') or ''))
                  if any(k in title for k in ['2025年年度报告','2026年第一季度报告','2026年半年度报告','招股说明书','招股意向书']):
                      print('EM_MATCH',json.dumps(row,ensure_ascii=False))
                      art=row.get('art_code')
                      for pre in ['H2','H3','H1']:
                          u=f'https://pdf.dfcfw.com/pdf/{pre}_{art}_1.pdf'
                          x=s.get(u,headers={'Accept':'application/pdf,*/*','Referer':'https://data.eastmoney.com/'},timeout=90,allow_redirects=True)
                          print('EM_PDF',pre,art,x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:20]),x.url)
              if not rows: break

          # Known CNINFO finalpage URLs derived from official announcement IDs indexed publicly.
          known=[
              ('2025年年度报告','2026-04-23','1225146334'),
              ('2026年第一季度报告','2026-04-23','1225146332'),
              ('2026年半年度报告','2026-08-26','1225506154'),
          ]
          for title,date,aid in known:
              u=f'https://static.cninfo.com.cn/finalpage/{date}/{aid}.PDF'
              x=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.cninfo.com.cn/'},timeout=90,allow_redirects=True)
              print('\nCN_KNOWN',title,u,x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:20]),x.url)

          # Global CNINFO title search without a stock filter, then with common stock/org formats.
          cn=requests.Session(); cn.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':'https://www.cninfo.com.cn/new/fulltextSearch?notautosubmit=&keyWord=%E9%94%A1%E5%8D%8E%E7%A7%91%E6%8A%80',
              'Origin':'https://www.cninfo.com.cn','Accept':'application/json,text/plain,*/*',
              'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'
          })
          for stock in ['', '603248', '603248,gssh0603248']:
              for key in ['锡华科技首次公开发行股票并在主板上市招股说明书','锡华科技 招股说明书','江苏锡华新能源科技股份有限公司 招股说明书']:
                  data={'pageNum':'1','pageSize':'100','column':'sse','tabName':'fulltext','plate':'sh','stock':stock,'searchkey':key,'secid':'','category':'','trade':'','seDate':'2025-01-01~2026-08-30','sortName':'','sortType':'','isHLtitle':'true'}
                  r=cn.post('https://www.cninfo.com.cn/new/hisAnnouncement/query',data=data,timeout=90)
                  print('\nCN_SEARCH',repr(stock),key,r.status_code,len(r.content),r.headers.get('content-type'))
                  print('CN_HEAD',repr(r.text[:300]))
                  try: obj=r.json()
                  except Exception as e: print('JSON_ERR',repr(e)); continue
                  anns=obj.get('announcements') or []
                  print('CN_ROWS',len(anns),'TOTAL',obj.get('totalAnnouncement'))
                  for a in anns[:30]: print('CN_ROW',json.dumps(a,ensure_ascii=False))
          PY
