name: Package IAT Auto complete filings 20261020
on:
  push:
    branches:
      - tmp/ialt-300825-all-filings-20261020
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python -m pip install --quiet requests pypdf
      - name: Download validate and package filings
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          root = Path('阿尔特_300825_上市以来全部年报_招股说明书及最新季报_截至20261020')
          prospectus_dir = root / '00_招股说明书'
          annual_dir = root / '01_年度报告'
          quarter_dir = root / '02_最新季度报告'
          preview_dir = root / '首页预览'
          for d in (prospectus_dir, annual_dir, quarter_dir, preview_dir):
              d.mkdir(parents=True, exist_ok=True)

          docs = [
              {
                  'kind': 'prospectus', 'period': '2020 IPO',
                  'art_code': 'AN202003161376525850',
                  'title': '阿尔特:首次公开发行股票并在创业板上市招股说明书',
                  'notice_date': '2020-03-17',
                  'filename': '2020_阿尔特_首次公开发行股票并在创业板上市招股说明书.pdf',
                  'folder': prospectus_dir,
              },
              {
                  'kind': 'annual', 'period': '2020',
                  'art_code': 'AN202308251595858439',
                  'title': '阿尔特:2020年年度报告(补充后)',
                  'notice_date': '2023-08-26',
                  'filename': '2020_阿尔特_2020年年度报告_补充后.pdf',
                  'folder': annual_dir,
              },
              {
                  'kind': 'annual', 'period': '2021',
                  'art_code': 'AN202204221560922543',
                  'title': '阿尔特:2021年年度报告',
                  'notice_date': '2022-04-23',
                  'filename': '2021_阿尔特_2021年年度报告.pdf',
                  'folder': annual_dir,
              },
              {
                  'kind': 'annual', 'period': '2022',
                  'art_code': 'AN202304231585723803',
                  'title': '阿尔特:2022年年度报告',
                  'notice_date': '2023-04-24',
                  'filename': '2022_阿尔特_2022年年度报告.pdf',
                  'folder': annual_dir,
              },
              {
                  'kind': 'annual', 'period': '2023',
                  'art_code': 'AN202404241631151581',
                  'title': '阿尔特:2023年年度报告',
                  'notice_date': '2024-04-25',
                  'filename': '2023_阿尔特_2023年年度报告.pdf',
                  'folder': annual_dir,
              },
              {
                  'kind': 'annual', 'period': '2024',
                  'art_code': 'AN202504241661799621',
                  'title': '阿尔特:2024年年度报告',
                  'notice_date': '2025-04-25',
                  'filename': '2024_阿尔特_2024年年度报告.pdf',
                  'folder': annual_dir,
              },
              {
                  'kind': 'annual', 'period': '2025',
                  'art_code': 'AN202604281821693124',
                  'title': '阿尔特:2025年年度报告',
                  'notice_date': '2026-04-29',
                  'filename': '2025_阿尔特_2025年年度报告.pdf',
                  'folder': annual_dir,
              },
              {
                  'kind': 'quarter', 'period': '2026Q1',
                  'art_code': 'AN202604281821693121',
                  'title': '阿尔特:2026年一季度报告',
                  'notice_date': '2026-04-29',
                  'filename': '2026Q1_阿尔特_2026年一季度报告.pdf',
                  'folder': quarter_dir,
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/notices/stock/300825.html',
              'Accept': 'application/pdf,text/html;q=0.9,*/*;q=0.8',
          })

          def file_sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def download_pdf(item, target):
              code = item['art_code']
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
              ]
              traces = []
              for url in candidates:
                  for attempt in range(1, 4):
                      try:
                          r = session.get(url, timeout=90, allow_redirects=True)
                          data = r.content
                          traces.append({'url': url, 'status': r.status_code, 'bytes': len(data), 'head': repr(data[:20])})
                          if r.status_code == 200 and data.startswith(b'%PDF') and len(data) > 50000:
                              target.write_bytes(data)
                              return url, traces
                      except Exception as exc:
                          traces.append({'url': url, 'error': repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError(f'Unable to download valid PDF for {item["art_code"]}: {traces}')

          manifest = []
          for item in docs:
              target = item['folder'] / item['filename']
              source_url, traces = download_pdf(item, target)

              q = subprocess.run(
                  ['qpdf', '--check', str(target)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  errors='replace',
              )
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {target}: {q.returncode}\n{q.stdout}')

              reader = PdfReader(str(target))
              pages = len(reader.pages)
              min_pages = 100 if item['kind'] == 'prospectus' else (20 if item['kind'] == 'annual' else 3)
              if pages < min_pages:
                  raise RuntimeError(f'Unexpectedly short {item["kind"]} PDF {target}: {pages} pages')

              txt_path = target.with_suffix('.txt')
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(10, pages)), str(target), str(txt_path)],
                  check=True,
              )
              text = txt_path.read_text(encoding='utf-8', errors='replace')
              txt_path.unlink(missing_ok=True)

              identity_hits = [x for x in ['阿尔特', '阿尔特汽车技术股份有限公司', '300825'] if x in text]
              if not identity_hits:
                  raise RuntimeError(f'Company identity not found in first pages of {target}')
              if item['kind'] == 'annual' and item['period'] not in text:
                  raise RuntimeError(f'Annual report period {item["period"]} not found in first pages of {target}')
              if item['kind'] == 'prospectus' and '招股说明书' not in text:
                  raise RuntimeError(f'Prospectus marker not found in first pages of {target}')
              if item['kind'] == 'quarter' and not ('第一季度' in text or '一季度' in text):
                  raise RuntimeError(f'Quarter marker not found in first pages of {target}')

              preview_stem = preview_dir / target.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(target), str(preview_stem)],
                  check=True,
              )
              png = preview_stem.with_suffix('.png')
              if not png.exists() or png.stat().st_size < 10000:
                  raise RuntimeError(f'First-page render failed for {target}')

              entry = {k: v for k, v in item.items() if k != 'folder'}
              entry.update({
                  'source_page': f'https://data.eastmoney.com/notices/detail/300825/{item["art_code"]}.html',
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': target.stat().st_size,
                  'sha256': file_sha256(target),
                  'identity_hits': identity_hits,
                  'qpdf_status': q.returncode,
                  'qpdf_output': q.stdout.strip()[:2000],
                  'download_attempts': traces,
              })
              manifest.append(entry)
              print('VERIFIED', json.dumps(entry, ensure_ascii=False, sort_keys=True))

          annual_periods = [x['period'] for x in manifest if x['kind'] == 'annual']
          if annual_periods != ['2020', '2021', '2022', '2023', '2024', '2025']:
              raise RuntimeError(f'Annual report coverage mismatch: {annual_periods}')
          if [x['period'] for x in manifest if x['kind'] == 'prospectus'] != ['2020 IPO']:
              raise RuntimeError('Prospectus coverage mismatch')
          if [x['period'] for x in manifest if x['kind'] == 'quarter'] != ['2026Q1']:
              raise RuntimeError('Latest quarterly report mismatch')

          readme = [
              '# 阿尔特（300825）上市以来年报、招股说明书及最新季度报告',
              '',
              '整理日期：2026-10-20',
              '',
              '## 收录范围',
              '',
              '- 2020-2025年完整年度报告，共6份。',
              '- 2020年首次公开发行股票并在创业板上市招股说明书，共1份。',
              '- 截至2026-10-20可检索到的最新独立季度报告：2026年第一季度报告，共1份。',
              '- 2020年年度报告采用公司2023年披露的“补充后”版本。',
              '- 未将年度报告摘要、半年报、提示性公告或招股说明书申报稿冒充正式文件。',
              '',
              '## 文件清单',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["title"]}',
                  f'   - 文件：{x["filename"]}',
                  f'   - 公告日期：{x["notice_date"]}',
                  f'   - 页数：{x["pages"]}',
                  f'   - SHA-256：`{x["sha256"]}`',
                  f'   - 公告页：{x["source_page"]}',
                  '',
              ]
          readme += [
              '## 校验说明',
              '',
              '- 每份PDF均检查文件头、PDF结构、实际页数、公司身份、报告期/文件类型及首页渲染。',
              '- 压缩包创建后执行CRC完整性测试。',
          ]
          (root / 'README.md').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              '\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in manifest) + '\n',
              encoding='utf-8',
          )

          cn_zip = Path('阿尔特_300825_上市以来全部年报_招股说明书及最新季报_截至20261020.zip')
          en_zip = Path('ialt_300825_all_annual_reports_prospectus_latest_quarter_20261020.zip')
          for zpath in (cn_zip, en_zip):
              with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p, p.as_posix())
              with zipfile.ZipFile(zpath) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')
                  pdf_names = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if len(pdf_names) != 8:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {len(pdf_names)}')
              print('FINAL_ZIP', zpath, zpath.stat().st_size, 'SHA256', file_sha256(zpath))

          print('COUNTS', json.dumps({
              'prospectus': 1,
              'annual': 6,
              'quarter': 1,
              'pdfs': 8,
              'pages': sum(x['pages'] for x in manifest),
          }, ensure_ascii=False))
          PY
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: ialt-300825-complete-filings-20261020
          path: |
            阿尔特_300825_上市以来全部年报_招股说明书及最新季报_截至20261020.zip
            ialt_300825_all_annual_reports_prospectus_latest_quarter_20261020.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
