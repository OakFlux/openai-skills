name: Probe Jingxue 301010 disclosure URLs

on:
  push:
    branches:
      - tmp-probe-jingxue-301010-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe announcement IDs and PDF endpoints
        shell: bash
        run: |
          python3 -m pip install --quiet requests pypdf
          python3 - <<'PY'
          import io, json, re, requests
          from pypdf import PdfReader

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://data.eastmoney.com/'})
          api='https://np-anotice-stock.eastmoney.com/api/security/ann'
          rows=[]
          for page in range(1,13):
              r=s.get(api,params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':'301010'},timeout=(10,30))
              print('PAGE',page,r.status_code,len(r.content))
              r.raise_for_status()
              got=((r.json().get('data') or {}).get('list') or [])
              rows.extend(got)
              if len(got)<100: break

          def title(x): return re.sub(r'\s+','',str(x.get('title') or x.get('title_ch') or ''))
          def date(x): return str(x.get('display_time') or x.get('notice_date') or '')[:10]
          targets=[]
          for year in range(2021,2026):
              cand=[]
              for x in rows:
                  t=title(x)
                  if t.endswith(f'{year}年年度报告') and not any(k in t for k in ['摘要','英文版','问询','回复','提示性公告','专项说明','更正','取消']):
                      cand.append(x)
              cand.sort(key=date,reverse=True)
              print('CANDIDATES',year,[(title(x),date(x),x.get('art_code')) for x in cand])
              if cand: targets.append((f'{year}年年度报告',cand[0]))
          q=[]
          for x in rows:
              t=title(x)
              if (t.endswith('2026年第三季度报告') or t.endswith('2026年三季度报告')) and not any(k in t for k in ['提示性公告','摘要','问询','回复']):
                  q.append(x)
          q.sort(key=date,reverse=True)
          print('Q3_CANDIDATES',[(title(x),date(x),x.get('art_code')) for x in q])
          if q: targets.append(('2026年第三季度报告',q[0]))

          for label,x in targets:
              art=x.get('art_code')
              print('\nTARGET',label,title(x),date(x),art,json.dumps(x,ensure_ascii=False)[:2000])
              for host in ['H2','H3']:
                  url=f'https://pdf.dfcfw.com/pdf/{host}_{art}_1.pdf'
                  try:
                      r=s.get(url,headers={'Referer':f'https://data.eastmoney.com/notices/detail/301010/{art}.html'},timeout=(10,45),allow_redirects=True)
                      data=r.content
                      pages=0; ok=False
                      if data.startswith(b'%PDF-'):
                          try:
                              rr=PdfReader(io.BytesIO(data),strict=False); pages=len(rr.pages)
                              sample=''.join((p.extract_text() or '') for p in rr.pages[:min(8,pages)])
                              ok=('晶雪节能' in sample or '江苏晶雪节能科技股份有限公司' in sample)
                          except Exception as e: print('PARSE_ERROR',repr(e))
                      print('PDF',url,'STATUS',r.status_code,'BYTES',len(data),'HEAD',data[:5],'PAGES',pages,'COMPANY',ok)
                  except Exception as e: print('PDF_ERROR',url,repr(e))

          for url in ['https://static.cninfo.com.cn/finalpage/2021-06-11/1210217780.PDF','https://reportdocs.static.szse.cn/UpFiles/rasinfodisc/RAS_000176848698DE3FEE125E25873CCD3F.pdf']:
              try:
                  r=s.get(url,timeout=(10,60),allow_redirects=True); data=r.content; pages=0
                  if data.startswith(b'%PDF-'):
                      try: pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                      except Exception as e: print('PROSPECTUS_PARSE',repr(e))
                  print('PROSPECTUS',url,'STATUS',r.status_code,'BYTES',len(data),'HEAD',data[:5],'PAGES',pages)
              except Exception as e: print('PROSPECTUS_ERROR',url,repr(e))
          PY
