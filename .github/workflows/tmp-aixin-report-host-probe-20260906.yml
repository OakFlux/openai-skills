name: Temporary Aixin report host probe

on:
  push:
    branches:
      - tmp-aixin-report-host-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch and inspect report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          urls={
            'reportify_guosheng':'https://reportify.cn/reports/1278761946887360512',
            'reportify_zhongyou':'https://reportify.cn/reports/1246890949045522432',
            'reportify_guotai':'https://reportify.cn/reports/1262379005902983168',
            'reportify_guotai_alt':'https://reportify.cn/reports/1262413294237519872',
            'vzkoo_guosheng':'https://www.vzkoo.com/document/1126926038310001149384a3edee.html',
            'fx_guosheng_update':'https://www.fxbaogao.com/detail/5605896',
          }
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          summary={}
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              print('FETCH',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text
              (out/f'{name}.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for tag in soup.find_all(['a','link','script','iframe','embed','object','source']):
                for attr in ['href','src','data','data-src','content']:
                  val=tag.get(attr)
                  if val:
                    u=urljoin(r.url,val)
                    if u not in links: links.append(u)
              strings=set(re.findall(r'https?://[^"\'<>\\\s]+',text))
              candidates=[]
              for u in links+sorted(strings):
                low=u.lower()
                if any(k in low for k in ['pdf','download','document','report','attachment','file','oss','cdn','api']):
                  if u not in candidates: candidates.append(u)
              # Also capture JSON-ish blocks and relevant line snippets.
              snippets=[]
              for key in ['pdf','download','attachment','fileUrl','documentUrl','sourceUrl','oss','report_url','original']:
                for m in re.finditer(key,text,re.I):
                  snippets.append(text[max(0,m.start()-220):min(len(text),m.end()+500)])
                  if len(snippets)>=80: break
                if len(snippets)>=80: break
              (out/f'{name}_candidates.txt').write_text('\n'.join(candidates),encoding='utf-8')
              (out/f'{name}_snippets.txt').write_text('\n\n---\n\n'.join(snippets),encoding='utf-8')
              summary[name]={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'candidates':candidates[:200]}
            except Exception as e:
              summary[name]={'error':repr(e)}; print('ERROR',name,repr(e),flush=True)
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: aixin-report-host-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
