name: Temporary Dongjiang Environmental broker report discovery

on:
  push:
    branches:
      - tmp-dongjiang-broker-reports-20260905

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report API and inspect PDF candidates
        run: |
          python -m pip install requests pypdf
          cat > /tmp/discover.py <<'PY'
          import io, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out = Path('discovery')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/json,text/javascript,*/*;q=0.9'
          })
          endpoint='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          seen=set()
          codes=['002672','00895','895','SZ002672','002672.SZ','*']
          windows=[('2010-01-01','2016-12-31'),('2017-01-01','2021-12-31'),('2022-01-01','2026-09-05')]
          for code in codes:
            for qtype in ['0','1']:
              for begin,end in windows:
                for page in range(1,8):
                  params={
                    'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                    'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                    'orgCode':'','code':code,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                    '_':str(int(time.time()*1000))
                  }
                  try:
                    r=s.get(endpoint,params=params,timeout=60); r.raise_for_status(); d=r.json()
                  except Exception as e:
                    print('APIERR',code,qtype,begin,end,page,repr(e)); break
                  rows=d.get('data') or []
                  print('QUERY',code,qtype,begin,end,'PAGE',page,'ROWS',len(rows),'HITS',d.get('hits'),'PAGES',d.get('TotalPage'))
                  for row in rows:
                    blob=json.dumps(row,ensure_ascii=False)
                    if code!='*' or '东江环保' in blob or '東江環保' in blob or 'Dongjiang Environmental' in blob or '002672' in blob or '00895' in blob:
                      key=str(row.get('infoCode') or row.get('id') or blob[:200])
                      if key not in seen:
                        seen.add(key); all_rows.append(row); print('ROW',blob)
                  tp=int(d.get('TotalPage') or 1)
                  if not rows or page>=tp: break

          (out/'rows.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_ROWS',len(all_rows))

          # Probe likely Eastmoney PDF URLs for each infoCode.
          candidates=[]
          for row in all_rows:
            blob=json.dumps(row,ensure_ascii=False)
            if not ('东江环保' in blob or '東江環保' in blob or 'Dongjiang Environmental' in blob or '002672' in blob or '00895' in blob):
              continue
            info=str(row.get('infoCode') or '').strip()
            if not info: continue
            info_no_ap=info[2:] if info.upper().startswith('AP') else info
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_AP{info_no_ap}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H3_AP{info_no_ap}_1.pdf?{int(time.time())}.pdf',
            ]
            for u in urls:
              try:
                rr=s.get(u,timeout=60,allow_redirects=True)
                data=rr.content
                print('PDFPROBE',rr.status_code,len(data),rr.url)
                if data.lstrip().startswith(b'%PDF') and len(data)>20000:
                  try:
                    reader=PdfReader(io.BytesIO(data),strict=False)
                    pages=len(reader.pages)
                    text=' '.join((p.extract_text() or '') for p in reader.pages[:8])
                    text=re.sub(r'\s+',' ',text)
                  except Exception as e:
                    pages=-1; text=''; print('PARSEERR',repr(e))
                  item={'row':row,'url':rr.url,'size':len(data),'pages':pages,'text_head':text[:3000]}
                  candidates.append(item)
                  fn=out/f'{info}_{len(candidates):02d}.pdf'; fn.write_bytes(data)
                  print('VALIDPDF',info,pages,row.get('orgSName'),row.get('publishDate'),row.get('title'),rr.url)
                  break
              except Exception as e:
                print('PDFERR',u,repr(e))
          (out/'candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          print('VALID_CANDIDATES',len(candidates))
          PY
          python /tmp/discover.py

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: dongjiang-broker-report-discovery
          path: discovery
          retention-days: 1
