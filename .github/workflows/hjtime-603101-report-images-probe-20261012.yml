name: Probe HJTime report page images 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-report-images-probe-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe image URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,concurrent.futures
          urls=[]
          paths=['report-image/2026/02/09/5261391-1.png','report-image/2026/02/12/5271496-1.png']
          hosts=['https://public.fxbaogao.com/','https://dr.fxbaogao.com/','https://static.fxbaogao.com/','https://oss-buy.hufangde.com/']
          suffixes=['','?x-oss-process=image/format,webp','?x-oss-process=image/format,png','?x-oss-process=image/resize,w_1600']
          for p in paths:
            for h in hosts:
              for s in suffixes: urls.append(h+p+s)
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/','Origin':'https://www.fxbaogao.com','Accept':'image/avif,image/webp,image/png,image/*,*/*'}
          def f(u):
            try:
              r=requests.get(u,headers=headers,timeout=(5,15),allow_redirects=True)
              return {'url':u,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'prefix':r.content[:12].hex(),'final':r.url}
            except Exception as e: return {'url':u,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
            for rec in ex.map(f,urls): print(json.dumps(rec,ensure_ascii=False),flush=True)
          PY
