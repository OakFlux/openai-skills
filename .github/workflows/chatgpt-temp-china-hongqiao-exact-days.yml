name: chatgpt-temp-china-hongqiao-exact-days
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-china-hongqiao-exact-days.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact publication days and package full PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf pymupdf pillow
          python <<'PY'
          import hashlib,json,re,time,zipfile
          from pathlib import Path
          import requests,pymupdf
          from PIL import Image,ImageStat
          from pypdf import PdfReader
          ROOT=Path('hongqiao_exact');P=ROOT/'PDF';Q=ROOT/'qa';P.mkdir(parents=True,exist_ok=True);Q.mkdir(parents=True,exist_ok=True)
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/javascript,*/*'})
          days=[
            ('2026-05-08',['红利吸引力突出','首次覆盖']),
            ('2026-04-27',['兼具一体化优势与高分红属性','首次覆盖']),
            ('2025-05-29',['全产业链优势打造盈利护城河','首次覆盖']),
            ('2025-05-28',['全产业链优势打造盈利护城河','首次覆盖']),
            ('2025-04-21',['高景气+一体化+高分红','电解铝龙头静待价值重估']),
            ('2023-08-18',['产业布局与成本双改善','电解铝龙头再出发']),
            ('2023-08-17',['产业布局与成本双改善','电解铝龙头再出发']),
            ('2024-05-08',['原料价格趋稳叠加铝行业景气周期','盈利能力显著提升']),
          ]
          def parse(t):
            try:return json.loads(t)
            except:
              a=t.find('{');b=t.rfind('}');return json.loads(t[a:b+1])
          recs=[];seen=set()
          for day,terms in days:
            found=False
            for ep in ['list','jg']:
              for qtype in [0,1,2,3,4,5,6]:
                for page in range(1,15):
                  params={'cb':'showData','pageSize':100,'pageNo':page,'qType':qtype,'beginTime':day,'endTime':day,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','ratingchange':'*','fields':'','orgCode':'','rcode':'','_':int(time.time()*1000)}
                  r=S.get(f'https://reportapi.eastmoney.com/report/{ep}',params=params,timeout=60);o=parse(r.text);rows=o.get('data') or []
                  if isinstance(rows,dict):rows=rows.get('data') or rows.get('list') or []
                  if not isinstance(rows,list):rows=[]
                  total=int(o.get('TotalPage') or 0)
                  print('SCAN',day,ep,qtype,page,'rows',len(rows),'total',total,'hits',o.get('hits'),flush=True)
                  for a in rows:
                    title=str(a.get('title') or a.get('TITLE') or '');blob=json.dumps(a,ensure_ascii=False)
                    if ('中国宏桥' in blob or 'CHINA HONGQIAO' in blob.upper() or sum(t in title for t in terms)>=1):
                      info=a.get('infoCode') or a.get('INFO_CODE')
                      if info and info not in seen:
                        seen.add(info);a['_day']=day;a['_endpoint']=ep;a['_qtype']=qtype;recs.append(a);found=True;print('MATCH',json.dumps(a,ensure_ascii=False),flush=True)
                  if not rows or page>=total:break
                  if found:break
                if found:break
              if found:break
          (ROOT/'records.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8');print('RECORDS',len(recs),flush=True)
          def get(a,*keys):
            for k in keys:
              if a.get(k) not in (None,''):return a.get(k)
            return ''
          def score(a):
            title=str(get(a,'title','TITLE'));date=str(get(a,'publishDate','PUBLISH_DATE'))[:10]
            try:pages=int(float(get(a,'attachPages','ATTACH_PAGES') or 0))
            except:pages=0
            s=0
            if '首次覆盖' in title:s+=300
            if '公司深度' in title or '深度' in title:s+=200
            for t in ['高景气+一体化+高分红','产业布局与成本双改善','全产业链优势打造盈利护城河','兼具一体化优势与高分红属性','红利吸引力突出','一体化优势']: 
              if t in title:s+=80
            if pages>=25:s+=100
            elif pages>=18:s+=70
            elif pages>=12:s+=40
            for t in ['点评','中报','年报点评','事件点评','业绩预告']:
              if t in title:s-=100
            return(s,date)
          recs.sort(key=score,reverse=True)
          def pdf(info):
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf',f'https://pdf.dfcfw.com/pdf/{info}_1.pdf']:
              rr=S.get(u,timeout=180,headers={'Referer':'https://data.eastmoney.com/'},allow_redirects=True);print('PDF',info,rr.status_code,len(rr.content),rr.url,flush=True)
              if rr.status_code==200 and rr.content.startswith(b'%PDF-') and len(rr.content)>100000:return rr.content,rr.url
            return None,None
          def safe(x):return re.sub(r'[\\/:*?"<>|\r\n]+','_',re.sub(r'\s+',' ',x)).strip()[:180]
          acc=[];hashes=set();orgs=set()
          for a in recs:
            if len(acc)>=3:break
            title=str(get(a,'title','TITLE'));org=str(get(a,'orgSName','orgName','ORG_SNAME') or '券商');date=str(get(a,'publishDate','PUBLISH_DATE'))[:10];info=str(get(a,'infoCode','INFO_CODE'))
            if any(x in title for x in ['点评','中报','年报点评','事件点评']) and '首次覆盖' not in title and '公司深度' not in title:continue
            if org in orgs:continue
            data,url=pdf(info)
            if not data:continue
            sha=hashlib.sha256(data).hexdigest()
            if sha in hashes:continue
            t=ROOT/(info+'.pdf');t.write_bytes(data)
            try:
              rd=PdfReader(str(t),strict=False);pages=len(rd.pages)
              if pages<10:raise RuntimeError('short '+str(pages))
              txt=[]
              for i in sorted(set(list(range(min(12,pages)))+[pages//2,pages-1])):
                try:txt.append(rd.pages[i].extract_text() or '')
                except:pass
              txt=' '.join(txt).upper()
              if not any(m in txt for m in ['中国宏桥','CHINA HONGQIAO','01378','1378.HK']):raise RuntimeError('identity')
              d=pymupdf.open(str(t));checks=[]
              for i,tag in [(0,'first'),(pages//2,'middle'),(pages-1,'last')]:
                pix=d[i].get_pixmap(matrix=pymupdf.Matrix(1,1),alpha=False);png=Q/f'{info}_{tag}.png';pix.save(str(png));std=float(ImageStat.Stat(Image.open(png).convert('L').resize((64,64))).stddev[0]);checks.append({'page':i+1,'stddev':round(std,3)})
                if std<2:raise RuntimeError('blank')
              d.close();fn=safe(f'{date}_{org}_中国宏桥_{title}')+'.pdf';out=P/fn;t.replace(out)
              item={'date':date,'institution':org,'title':title,'pages':pages,'filename':fn,'info_code':info,'source_url':url,'sha256':sha,'size_bytes':len(data),'render_checks':checks};acc.append(item);orgs.add(org);hashes.add(sha);print('ACCEPT',json.dumps(item,ensure_ascii=False),flush=True)
            except Exception as e:print('REJECT',title,repr(e),flush=True);t.unlink(missing_ok=True)
          if len(acc)<2:raise RuntimeError(f'only {len(acc)} accepted from {len(recs)} records')
          readme=['# 中国宏桥（01378.HK）券商深度报告','',f'收录 {len(acc)} 份完整 PDF。','', '| 日期 | 券商 | 题目 | 页数 |','|---|---|---|---:|']+[f"| {x['date']} | {x['institution']} | {x['title']} | {x['pages']} |" for x in acc]+['','来源与校验值见 manifest.json 和 SHA256SUMS.txt。']
          (ROOT/'README.md').write_text('\n'.join(readme)+'\n',encoding='utf-8');(ROOT/'manifest.json').write_text(json.dumps(acc,ensure_ascii=False,indent=2),encoding='utf-8');(ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  PDF/{x['filename']}" for x in acc)+'\n',encoding='utf-8')
          z=Path(f'China_Hongqiao_01378_Broker_Deep_Reports_{len(acc)}.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for f in ROOT.rglob('*'):
              if f.is_file() and Q not in f.parents and f.name!='records.json':zz.write(f,f.relative_to(ROOT.parent))
          with zipfile.ZipFile(z) as zz:
            assert zz.testzip() is None
          meta={'archive':z.name,'bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'reports':acc};Path('exact_meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');print('FINAL',json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: China-Hongqiao-Exact-Day-Reports
          path: |
            China_Hongqiao_01378_Broker_Deep_Reports_*.zip
            exact_meta.json
            hongqiao_exact/records.json
          retention-days: 1
          compression-level: 0
