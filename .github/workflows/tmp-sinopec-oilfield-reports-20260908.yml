name: temporary-sinopec-oilfield-report-fetch

on:
  push:
    branches:
      - chatgpt-sinopec-oilfield-reports-20260908

permissions:
  contents: read

jobs:
  fetch-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --disable-pip-version-check --quiet requests pypdf pillow img2pdf
      - name: Decode retrieval script
        shell: bash
