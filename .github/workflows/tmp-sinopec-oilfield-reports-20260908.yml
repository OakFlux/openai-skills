name: temporary-sinopec-oilfield-report-fetch

on:
  push:
    branches:
      - chatgpt-sinopec-oilfield-reports-20260908

permissions:
  contents: read

jobs:
  query-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query public Eastmoney report index
        shell: bash
        run: |
          python -m pip install --quiet requests
          mkdir -p artifact
          python - <<'PY'
          import json, time, requests
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          rows=[]; seen=set(); debug=[]
          for page in range(1,6):
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2018-01-01','endTime':'2026-09-08','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'600871','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),'_':str(int(time.time()*1000))}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=45)
              debug.append({'method':'GET','url':r.url,'status':r.status_code,'bytes':len(r.content),'head':r.text[:300]})
              try: d=r.json()
              except Exception: break
              batch=d.get('data') or []
              if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
              if not batch: break
              for x in batch:
                  k=str(x.get('infoCode') or x.get('encodeUrl') or json.dumps(x,sort_keys=True,ensure_ascii=False))
                  if k not in seen: seen.add(k); rows.append(x)
              if len(batch)<100: break
          if not rows:
              body={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2018-01-01','endTime':'2026-09-08','code':'600871','industryCode':'*','qType':0,'industry':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':'','fields':''}
              r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=45)
              debug.append({'method':'POST','url':r.url,'status':r.status_code,'bytes':len(r.content),'head':r.text[:300]})
              try:
                  d=r.json(); batch=d.get('data') or []
                  if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
                  rows.extend(batch)
              except Exception: pass
          open('artifact/records.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False,indent=2))
          open('artifact/debug.json','w',encoding='utf-8').write(json.dumps(debug,ensure_ascii=False,indent=2))
          with open('artifact/summary.txt','w',encoding='utf-8') as f:
              f.write(f'records={len(rows)}\n')
              for x in rows:
                  f.write(f"{str(x.get('publishDate',''))[:10]} | {x.get('orgSName') or x.get('orgName')} | {x.get('title')} | {x.get('infoCode')}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sinopec-report-index
          path: artifact
          retention-days: 1
