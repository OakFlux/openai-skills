name: Package Runben 603193 broker deep reports 20261016

on:
  push:
    branches:
      - tmp/runben-603193-broker-reports-20261016-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, re, subprocess, time, zipfile
          from datetime import datetime
          from pathlib import Path
          from typing import Any
          import requests
          from pypdf import PdfReader

          CODE = "603193"
          SHORT = "润本股份"
          FULL = "润本生物技术股份有限公司"
          PREPARED = "2026-10-16"
          PACKAGE = "润本股份_603193_券商深度报告_3份"
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36"
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": UA,
              "Referer": "https://data.eastmoney.com/report/",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          api = "https://reportapi.eastmoney.com/report/list"
          records: list[dict[str, Any]] = []
          query_log: list[dict[str, Any]] = []
          for page in range(1, 15):
              params = {
                  "industryCode": "*",
                  "pageSize": "100",
                  "industry": "*",
                  "rating": "*",
                  "ratingChange": "*",
                  "beginTime": "2022-01-01",
                  "endTime": "2030-12-31",
                  "pageNo": str(page),
                  "fields": "",
                  "qType": "0",
                  "orgCode": "",
                  "code": CODE,
                  "rcode": "",
                  "p": str(page),
                  "pageNum": str(page),
                  "pageNumber": str(page),
              }
              data = None
              last = None
              for attempt in range(8):
                  try:
                      response = session.get(api, params=params, timeout=(20,120))
                      last = {"status": response.status_code, "text": response.text[:300]}
                      if response.status_code == 200:
                          data = response.json()
                          break
                  except Exception as exc:
                      last = {"error": repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f"Eastmoney report API failed page {page}: {last}")
              batch = data.get("data") or []
              if isinstance(batch, dict):
                  batch = batch.get("list") or batch.get("data") or []
              if not isinstance(batch, list):
                  raise RuntimeError(f"Unexpected API shape: {type(batch)}")
              query_log.append({"page": page, "count": len(batch), "hits": data.get("hits")})
              records.extend(item for item in batch if isinstance(item, dict))
              if len(batch) < 100:
                  break
              time.sleep(0.2)

          if not records:
              raise RuntimeError("No broker reports returned for 603193")

          def first(row: dict[str, Any], *keys: str, default: Any = "") -> Any:
              for key in keys:
                  value = row.get(key)
                  if value not in (None, ""):
                      return value
              return default

          def as_int(value: Any) -> int:
              try:
                  return int(float(str(value).strip()))
              except Exception:
                  return 0

          def clean(value: Any) -> str:
              return re.sub(r"\s+", " ", str(value or "")).strip()

          def date_obj(value: Any) -> datetime:
              text = str(value or "").strip()
              for fmt, length in (("%Y-%m-%d",10),("%Y/%m/%d",10),("%Y%m%d",8)):
                  try:
                      return datetime.strptime(text[:length], fmt)
                  except Exception:
                      pass
              m = re.search(r"(20\d{2})[-/]?(\d{2})[-/]?(\d{2})", text)
              if m:
                  return datetime(int(m.group(1)), int(m.group(2)), int(m.group(3)))
              return datetime(1900,1,1)

          deep_words = [
              "深度", "首次覆盖", "首次评级", "公司专题", "专题报告", "深度研究",
              "投资价值", "价值分析", "公司研究报告", "公司研究", "新股研究", "新股覆盖",
          ]
          commentary_words = [
              "点评", "快报", "跟踪", "季报", "年报", "中报", "业绩预告",
              "业绩快报", "调研简报", "业绩点评", "财报点评", "事件点评",
          ]
          exclude_words = ["摘要", "会议纪要", "调研纪要", "路演纪要"]

          normalized = []
          seen = set()
          for row in records:
              code = clean(first(row, "stockCode", "stock_code", "code"))
              if code and CODE not in code:
                  continue
              info_code = clean(first(row, "infoCode", "info_code", "reportId", "report_id"))
              title = clean(first(row, "title", "reportTitle", "report_title"))
              if not info_code or not title or info_code in seen:
                  continue
              seen.add(info_code)
              org = clean(first(row, "orgSName", "orgName", "org_name", "organization")) or "未知券商"
              author = clean(first(row, "researcher", "researcherName", "author", "authors"))
              publish = clean(first(row, "publishDate", "publish_date", "pubDate", "pub_date"))
              meta_pages = as_int(first(row, "attachPages", "attach_pages", "pageCount", "pages"))
              rating = clean(first(row, "emRatingName", "ratingName", "rating", "rating_name"))
              dt = date_obj(publish)
              compact = re.sub(r"\s+", "", title)
              if any(w in compact for w in exclude_words):
                  continue
              true_deep = any(w in compact for w in deep_words)
              commentary = any(w in compact for w in commentary_words)
              if commentary and not true_deep:
                  continue
              if not true_deep and meta_pages < 15:
                  continue
              score = meta_pages * 5
              if true_deep: score += 280
              if "首次" in compact or "新股" in compact: score += 70
              if commentary: score -= 40
              score += max(0, dt.year - 2022) * 12
              if dt.year >= 2025: score += 45
              normalized.append({
                  "info_code": info_code, "title": title, "org": org, "author": author,
                  "publish": publish, "date": dt, "metadata_pages": meta_pages,
                  "rating": rating, "true_deep": true_deep, "commentary": commentary,
                  "score": score,
              })

          # If strict metadata is sparse, admit longer company reports even without "深度" in the title.
          if len(normalized) < 3:
              for row in records:
                  info_code = clean(first(row, "infoCode", "info_code", "reportId", "report_id"))
                  if not info_code or any(x["info_code"] == info_code for x in normalized):
                      continue
                  title = clean(first(row, "title", "reportTitle", "report_title"))
                  org = clean(first(row, "orgSName", "orgName", "org_name", "organization")) or "未知券商"
                  author = clean(first(row, "researcher", "researcherName", "author", "authors"))
                  publish = clean(first(row, "publishDate", "publish_date", "pubDate", "pub_date"))
                  meta_pages = as_int(first(row, "attachPages", "attach_pages", "pageCount", "pages"))
                  dt = date_obj(publish)
                  compact = re.sub(r"\s+", "", title)
                  if any(w in compact for w in exclude_words + commentary_words):
                      continue
                  if meta_pages >= 12:
                      normalized.append({
                          "info_code": info_code, "title": title, "org": org, "author": author,
                          "publish": publish, "date": dt, "metadata_pages": meta_pages,
                          "rating": clean(first(row, "emRatingName", "ratingName", "rating", "rating_name")),
                          "true_deep": False, "commentary": False,
                          "score": meta_pages * 5 + max(0, dt.year-2022)*10,
                      })

          ranked = sorted(normalized, key=lambda x:(x["score"],x["metadata_pages"],x["date"]), reverse=True)
          if not ranked:
              raise RuntimeError("No substantive broker reports found after filtering")

          # Prefer different brokers and at least one recent report.
          shortlist = []
          used_codes, used_orgs = set(), set()
          for pool in (
              [x for x in ranked if x["date"].year >= 2025],
              [x for x in ranked if x["true_deep"]],
              ranked,
          ):
              for item in pool:
                  if item["info_code"] in used_codes:
                      continue
                  if item["org"] in used_orgs and len(shortlist) < 2:
                      continue
                  shortlist.append(item)
                  used_codes.add(item["info_code"])
                  used_orgs.add(item["org"])
                  if len(shortlist) >= 60:
                      break
              if len(shortlist) >= 60:
                  break

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', "_", text)
              text = re.sub(r"\s+", " ", text).strip(" ._")
              return text[:115]

          def download_pdf(info_code: str):
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf",
              ]
              last = {}
              for url in urls:
                  for attempt in range(5):
                      try:
                          r = session.get(
                              url,
                              headers={"User-Agent": UA, "Referer": f"https://data.eastmoney.com/report/info/{info_code}.html", "Accept":"application/pdf,*/*;q=0.8"},
                              timeout=(30,420), allow_redirects=True
                          )
                          last = {"url":url,"status":r.status_code,"bytes":len(r.content),"content_type":r.headers.get("content-type","")}
                          if r.status_code == 200 and r.content[:5] == b"%PDF-" and len(r.content) > 50_000:
                              return r.content, url, last
                      except Exception as exc:
                          last = {"url":url,"error":repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f"PDF download failed for {info_code}: {last}")

          accepted, rejected = [], []
          def try_candidates(min_pages: int, distinct_org: bool, require_deep: bool):
              for candidate in shortlist:
                  if len(accepted) >= 3:
                      return
                  if any(x["info_code"] == candidate["info_code"] for x in accepted):
                      continue
                  if distinct_org and any(x["org"] == candidate["org"] for x in accepted):
                      continue
                  if require_deep and not candidate["true_deep"]:
                      continue
                  tmp = ROOT / ("_candidate_" + candidate["info_code"] + ".pdf")
                  try:
                      data, pdf_url, meta = download_pdf(candidate["info_code"])
                      tmp.write_bytes(data)
                      reader = PdfReader(str(tmp), strict=False)
                      pages = len(reader.pages)
                      text = ""
                      for p in reader.pages[:min(30,pages)]:
                          try: text += "\n" + (p.extract_text() or "")
                          except Exception: pass
                      issuer_ok = SHORT in text or FULL in text or CODE in text or "润本生物" in text
                      if pages < min_pages or not issuer_ok:
                          rejected.append({"info_code":candidate["info_code"],"title":candidate["title"],"org":candidate["org"],"pages":pages,"reason":"too short" if pages<min_pages else "issuer check failed"})
                          tmp.unlink(missing_ok=True)
                          continue
                      subprocess.run(["qpdf","--warning-exit-0","--check",str(tmp)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      date_prefix = candidate["date"].strftime("%Y%m%d") if candidate["date"].year > 1900 else "未知日期"
                      final_name = safe_name(f"{len(accepted)+1:02d}_{date_prefix}_{candidate['org']}_{candidate['title']}.pdf")
                      dest = ROOT / final_name
                      tmp.replace(dest)
                      prefix = PREVIEW / dest.stem
                      subprocess.run(["pdftoppm","-f","1","-l","1","-png","-r","120","-singlefile",str(dest),str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      png = Path(str(prefix)+".png")
                      if not png.exists() or png.stat().st_size < 5000:
                          raise RuntimeError("preview render failed")
                      accepted.append({
                          **{k:v for k,v in candidate.items() if k!="date"},
                          "filename": final_name, "actual_pages": pages, "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(), "pdf_url": pdf_url,
                          "detail_url": f"https://data.eastmoney.com/report/info/{candidate['info_code']}.html",
                          "download_meta": meta, "preview_file": str(Path("首页预览")/png.name),
                      })
                  except Exception as exc:
                      rejected.append({"info_code":candidate["info_code"],"title":candidate["title"],"org":candidate["org"],"reason":repr(exc)})
                      tmp.unlink(missing_ok=True)

          try_candidates(15, True, True)
          if len(accepted) < 3: try_candidates(12, True, True)
          if len(accepted) < 3: try_candidates(12, True, False)
          if len(accepted) < 3: try_candidates(10, False, True)
          if len(accepted) < 3: try_candidates(10, False, False)

          if len(accepted) < 2:
              raise RuntimeError(f"Only {len(accepted)} suitable reports found; ranked={[(x['org'],x['title'],x['metadata_pages']) for x in ranked[:20]]}; rejected={rejected[:30]}")

          count = len(accepted)
          final_package = f"润本股份_603193_券商深度报告_{count}份"
          readme = [
              f"润本股份（{CODE}.SH）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              f"本包收录{count}份公开可下载的券商公司研究报告，优先选择深度/首次覆盖类、实际篇幅较完整、较新发布时间和不同券商来源。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for i,item in enumerate(accepted,1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   券商：{item['org']}；研究员：{item['author'] or '未标注'}；发布日期：{item['publish'] or '未标注'}",
                  f"   标题：{item['title']}",
                  f"   评级：{item['rating'] or '未标注'}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['detail_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、润本股份/证券代码匹配、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "说明：东方财富研报中心为公开聚合来源；如报告后续被来源方撤回，应以原券商发布规则为准。",
          ]
          (ROOT/"README_报告清单与核验说明.txt").write_text("\n".join(readme),encoding="utf-8")
          manifest = {
              "company":SHORT,"full_company_name":FULL,"stock_code":CODE,"prepared_on":PREPARED,
              "report_count":count,"files":accepted,"rejected_candidates":rejected,
              "top_metadata_candidates":[{k:(str(v) if k=="date" else v) for k,v in x.items()} for x in ranked[:50]],
              "query_log":query_log,
          }
          (ROOT/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          with (ROOT/"manifest.csv").open("w",newline="",encoding="utf-8-sig") as f:
              w=csv.writer(f); w.writerow(["文件名","券商","研究员","发布日期","标题","评级","页数","字节数","SHA-256","来源页面","PDF地址"])
              for item in accepted:
                  w.writerow([item["filename"],item["org"],item["author"],item["publish"],item["title"],item["rating"],item["actual_pages"],item["bytes"],item["sha256"],item["detail_url"],item["pdf_url"]])
          (ROOT/"SHA256SUMS.txt").write_text("\n".join(f"{x['sha256']}  {x['filename']}" for x in accepted)+"\n",encoding="utf-8")

          zip_path = Path(final_package + ".zip")
          with zipfile.ZipFile(zip_path,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(ROOT.rglob("*")):
                  if p.is_file():
                      z.write(p,arcname=str(Path(final_package)/p.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path,"r") as z:
              bad=z.testzip()
              if bad is not None: raise RuntimeError(f"ZIP CRC failed: {bad}")

          Path("artifact_name.txt").write_text(zip_path.name,encoding="utf-8")
          print(json.dumps({
              "package":str(zip_path),
              "zip_bytes":zip_path.stat().st_size,
              "zip_sha256":hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count":count,
              "files":[{"name":x["filename"],"broker":x["org"],"date":x["publish"],"pages":x["actual_pages"],"sha256":x["sha256"],"title":x["title"]} for x in accepted]
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: runben-603193-broker-deep-reports-20261016
          path: 润本股份_603193_券商深度报告_*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
