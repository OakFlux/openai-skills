name: chatgpt-temp-cmbc-older-deep-search
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-cmbc-older-deep-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search exact report titles and probe current public page paths
        shell: bash
        run: |
          python -m pip install --quiet requests pillow
          python <<'PY'
          import io,json,time,hashlib
          from pathlib import Path
          import requests
          from PIL import Image
          W=Path('cmbc_older_deep_search');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Content-Type':'application/json','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          queries=['立足民营中小微 开启新征程','大民生 小微 股份制民营银行巨头蓄势','负重远行 不忘初心','破茧成蝶 民生银行','民生银行 柳暗尽处 可待花明','民生银行 资产质量改善 业绩修复可期']
          found={};raw={}
          for q in queries:
            for only in (1,0):
              p={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              r=s.post('https://api.sdyanbao.com/api/file/search',json=p,timeout=90)
              print('QUERY',q,only,r.status_code,len(r.content),flush=True)
              try:o=r.json()
              except Exception as e:print('PARSE_ERROR',repr(e),r.text[:500],flush=True);continue
              raw[f'{q}|{only}']=o
              for x in ((o.get('data') or {}).get('files') or []):
                blob=json.dumps(x,ensure_ascii=False)
                if '民生银行' in blob or '600016' in blob or '01988' in blob or '1988.HK' in blob:
                  found[x.get('id')]=x;print('RECORD',json.dumps(x,ensure_ascii=False),flush=True)
          rows=list(found.values());W.joinpath('records.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8');W.joinpath('raw.json').write_text(json.dumps(raw,ensure_ascii=False,indent=2),encoding='utf-8')
          probes=[]
          for x in rows:
            base=x.get('page_url');pages=int(x.get('page_count') or 0)
            if not base or pages<12:continue
            ok=[]
            for idx in [0,1,2,9,10,14,15,pages-1]:
              if idx<0:continue
              u=f'{base}/{idx}.png';rec={'id':x.get('id'),'title':x.get('name'),'index':idx,'url':u}
              try:
                r=s.get(u,headers={'Accept':'image/*,*/*;q=0.8','Referer':'https://www.sdyanbao.com/'},timeout=90)
                rec.update({'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')})
                if r.status_code==200 and len(r.content)>10000:
                  im=Image.open(io.BytesIO(r.content));im.load();rec.update({'width':im.width,'height':im.height});ok.append(idx)
              except Exception as e:rec['error']=repr(e)
              probes.append(rec);print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
            print('SUMMARY',x.get('id'),x.get('name'),'pages',pages,'ok',ok,flush=True)
          W.joinpath('probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CMBC-Older-Deep-Search
          path: cmbc_older_deep_search
          retention-days: 1
          compression-level: 6
