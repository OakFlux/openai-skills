name: Find China Hongqiao broker deep reports
on:
  push:
    branches:
      - tmp-chinahongqiao-deep-report-search-20260908b
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf pymupdf ddgs playwright
      - name: Search, download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/raw output/pdfs output/package
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re, shutil, time, zipfile
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          import fitz
          try:
              from ddgs import DDGS
          except Exception as exc:
              DDGS = None
              print('DDGS_IMPORT_ERROR', repr(exc), flush=True)

          OUT = Path('output')
          PDFDIR = OUT/'pdfs'
          PKG = OUT/'package'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          sess = requests.Session()
          sess.headers.update({'User-Agent': UA, 'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          company_re = re.compile(r'(中国宏桥|中國宏橋|China\s+Hongqiao|01378(?:\.HK)?|1378\.HK)', re.I)
          deep_re = re.compile(r'(深度|首次覆盖|首次覆蓋|公司研究|公司报告|公司報告|initiation|coverage|deep.?dive|research report)', re.I)
          title_terms = [
              '高景气+一体化+高分红，电解铝龙头静待价值重估',
              '全球电解铝龙头，一体化打造盈利护城河，高分红属性明显',
              '成本企稳+铝行业高景气，电解铝龙头扬帆起航',
              '电解铝龙头弹性显著',
              '全球电解铝龙头，兼具一体化优势与高分红属性',
              '全产业链铸就成本护城河，高股息引领价值重估',
              '价值洼地、行稳致远',
          ]
          queries = []
          for t in title_terms:
              queries += [f'"{t}" PDF', f'"{t}" 下载', f'"{t}" 研报']
          queries += [
              '中国宏桥 券商 深度报告 PDF',
              '中国宏桥 公司深度 报告 PDF',
              '中国宏桥 首次覆盖 报告 PDF',
              '01378.HK 深度研究报告 PDF',
              'China Hongqiao initiation report PDF',
              'site:pdf.dfcfw.com 中国宏桥 01378',
              'site:static.cninfo.com.cn 中国宏桥 研报',
              'site:reportdocs.static.szse.cn 中国宏桥',
          ]

          candidates = []
          seen = set()
          def add(url: str, title: str='', snippet: str='', source: str=''):
              if not url or not isinstance(url, str): return
              url = url.replace('&amp;', '&').strip()
              if url.startswith('//'): url = 'https:' + url
              if 'duckduckgo.com/l/?' in url:
                  try:
                      qs = parse_qs(urlparse(url).query)
                      if qs.get('uddg'): url = unquote(qs['uddg'][0])
                  except Exception: pass
              if not url.startswith('http'): return
              url = url.split('#')[0]
              if url in seen: return
              seen.add(url)
              candidates.append({'url':url,'title':title,'snippet':snippet,'source':source})

          # Search engines.
          if DDGS:
              for q in queries:
                  try:
                      for row in DDGS(timeout=20).text(q, region='cn-zh', safesearch='off', max_results=25):
                          add(row.get('href') or row.get('url') or '', row.get('title',''), row.get('body',''), 'ddgs:'+q)
                  except Exception as exc:
                      print('DDGS_ERROR', q, repr(exc), flush=True)

          for q in queries:
              try:
                  r = sess.get('https://www.bing.com/search', params={'q':q,'count':'50','setlang':'zh-hans'}, timeout=30)
                  soup = BeautifulSoup(r.text, 'lxml')
                  for li in soup.select('li.b_algo'):
                      a = li.select_one('h2 a')
                      if a:
                          p = li.select_one('.b_caption p')
                          add(a.get('href',''), a.get_text(' ',strip=True), p.get_text(' ',strip=True) if p else '', 'bing:'+q)
              except Exception as exc:
                  print('BING_ERROR', q, repr(exc), flush=True)

          # Known public report pages to inspect.
          known_pages = [
              'https://www.fxbaogao.com/detail/4802165',
              'https://www.fxbaogao.com/detail/4864892',
              'https://www.fxbaogao.com/detail/4307103',
              'https://www.vzkoo.com/read/20250528cadc25e0bf397f71233f77c6.html',
              'https://www.vzkoo.com/read/202406132f337967da1467c08bce7800.html',
              'https://www.vzkoo.com/read/2024081907b24b74412495f5108f985a.html',
              'https://www.vzkoo.com/read/4662679491238170624.html',
              'https://www.vzkoo.com/read/1136811353590001f892134f7e1e.html',
              'https://www.sdyanbao.com/detail/886387',
              'https://www.sdyanbao.com/detail/892745',
              'https://wap.hibor.com.cn/repinfodetail_4073301.html',
              'https://www.baogaobox.com/insights/250531000010921.html',
          ]
          for u in known_pages: add(u, source='known')

          Path('output/search_candidates.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2), encoding='utf-8')
          print('CANDIDATE_COUNT', len(candidates), flush=True)

          # Test the public Waterdrop API without credentials. Only accept URLs returned to an anonymous request.
          api_results = []
          for rid in [886387, 892745]:
              for endpoint, payload in [
                  ('https://api.sdyanbao.com/api/file/detail', {'id':str(rid),'opFrom':1}),
                  ('https://api.sdyanbao.com/api/file/download', {'id':str(rid),'opFrom':1}),
                  ('https://api.sdyanbao.com/api/file/download', {'id':rid}),
              ]:
                  try:
                      rr = sess.post(endpoint, json=payload, headers={'Origin':'https://www.sdyanbao.com','Referer':f'https://www.sdyanbao.com/detail/{rid}'}, timeout=30)
                      rec = {'rid':rid,'endpoint':endpoint,'payload':payload,'status':rr.status_code,'content_type':rr.headers.get('content-type',''),'text':rr.text[:20000]}
                      api_results.append(rec)
                      print('SDY_API', json.dumps(rec,ensure_ascii=False)[:5000], flush=True)
                      try:
                          data = rr.json()
                          blob = json.dumps(data,ensure_ascii=False).replace('\\/','/')
                          for m in re.finditer(r'https?://[^"\'<>\\s]+', blob):
                              u=m.group(0)
                              if '.pdf' in u.lower() or 'download' in u.lower() or 'oss' in u.lower(): add(u, source='sdy_api')
                      except Exception: pass
                  except Exception as exc:
                      api_results.append({'rid':rid,'endpoint':endpoint,'payload':payload,'error':repr(exc)})
          Path('output/sdy_api_results.json').write_text(json.dumps(api_results,ensure_ascii=False,indent=2),encoding='utf-8')

          # Crawl pages and expose their genuinely public links.
          crawl_queue = list(candidates)
          crawled = []
          for item in crawl_queue[:350]:
              u = item['url']
              rec = dict(item)
              try:
                  r = sess.get(u, timeout=35, allow_redirects=True)
                  rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)})
                  ct = rec['content_type'].lower()
                  if r.content.startswith(b'%PDF'):
                      rec['direct_pdf'] = True
                      data = r.content
                      sha = hashlib.sha256(data).hexdigest()
                      p = PDFDIR/f'cand_{len(list(PDFDIR.glob("*.pdf")))+1:03d}_{sha[:12]}.pdf'
                      p.write_bytes(data)
                      rec['saved_path']=str(p)
                  elif 'html' in ct or b'<html' in r.content[:2000].lower():
                      text = r.text.replace('\\/','/')
                      soup = BeautifulSoup(text,'lxml')
                      links=[]
                      for tag in soup.find_all(['a','iframe','embed','object','script','link']):
                          for attr in ['href','src','data-url','data-href','data-file','data-pdf','action']:
                              val=tag.get(attr)
                              if not val: continue
                              absu=urljoin(r.url,val)
                              txt=' '.join(tag.get_text(' ',strip=True).split())[:300]
                              if any(x in absu.lower() for x in ['.pdf','download','attachment','document','file','report']) or any(x in txt for x in ['下载','原文','报告']):
                                  links.append({'url':absu,'text':txt})
                                  add(absu, txt, item.get('title',''), 'crawl:'+r.url)
                      # Also search URL-like strings in source.
                      for m in re.finditer(r'https?://[^"\'<>\\s]+', text):
                          absu=m.group(0)
                          if any(x in absu.lower() for x in ['.pdf','download','attachment','document','file','report']):
                              add(absu, source='source:'+r.url)
                      rec['links']=links[:300]
                      Path(f'output/raw/page_{len(crawled):03d}.html').write_text(text,encoding='utf-8')
              except Exception as exc:
                  rec['error']=repr(exc)
              crawled.append(rec)
          Path('output/crawled.json').write_text(json.dumps(crawled,ensure_ascii=False,indent=2),encoding='utf-8')

          # Download newly discovered direct-looking URLs.
          first_urls = {x.get('url') for x in crawled}
          direct_items = [x for x in candidates if x['url'] not in first_urls and any(k in x['url'].lower() for k in ['.pdf','download','attachment','document','file'])]
          direct_results=[]
          for item in direct_items[:300]:
              rec=dict(item)
              try:
                  r=sess.get(item['url'],timeout=45,allow_redirects=True)
                  rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)})
                  if r.content.startswith(b'%PDF') and len(r.content)>20000:
                      sha=hashlib.sha256(r.content).hexdigest()
                      p=PDFDIR/f'direct_{len(list(PDFDIR.glob("*.pdf")))+1:03d}_{sha[:12]}.pdf'
                      p.write_bytes(r.content); rec['saved_path']=str(p)
              except Exception as exc: rec['error']=repr(exc)
              direct_results.append(rec)
          Path('output/direct_results.json').write_text(json.dumps(direct_results,ensure_ascii=False,indent=2),encoding='utf-8')

          # Browser inspection for known public pages; no login/payment interactions.
          try:
              from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout
              chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
                  context=browser.new_context(user_agent=UA,locale='zh-CN',viewport={'width':1440,'height':1100},accept_downloads=True)
                  browser_results=[]
                  for idx,u in enumerate(known_pages):
                      page=context.new_page(); reqs=[]; resps=[]
                      def on_req(req):
                          if re.search(r'(pdf|download|document|attachment|file|report|api)',req.url,re.I): reqs.append({'url':req.url,'method':req.method,'post_data':req.post_data,'resource_type':req.resource_type})
                      def on_resp(resp):
                          try: ct=resp.headers.get('content-type','')
                          except Exception: ct=''
                          if re.search(r'(pdf|download|document|attachment|file|report|api)',resp.url,re.I) or 'pdf' in ct.lower():
                              z={'url':resp.url,'status':resp.status,'content_type':ct}; resps.append(z)
                              if 'pdf' in ct.lower() or resp.url.lower().split('?')[0].endswith('.pdf'):
                                  try:
                                      data=resp.body()
                                      if data.startswith(b'%PDF') and len(data)>20000:
                                          sha=hashlib.sha256(data).hexdigest(); pp=PDFDIR/f'network_{len(list(PDFDIR.glob("*.pdf")))+1:03d}_{sha[:12]}.pdf'; pp.write_bytes(data); z['saved_path']=str(pp)
                                  except Exception as exc: z['save_error']=repr(exc)
                      page.on('request',on_req); page.on('response',on_resp)
                      br={'url':u,'requests':reqs,'responses':resps}
                      try:
                          rr=page.goto(u,wait_until='domcontentloaded',timeout=90000)
                          try: page.wait_for_load_state('networkidle',timeout=20000)
                          except PWTimeout: pass
                          page.wait_for_timeout(1500)
                          br.update({'status':rr.status if rr else None,'final_url':page.url,'title':page.title(),'body':' '.join(page.locator('body').inner_text(timeout=10000).split())[:80000]})
                          links=page.eval_on_selector_all('a','els=>els.map(e=>({text:(e.innerText||e.textContent||"").trim(),href:e.href||"",download:e.download||""}))')
                          br['links']=[x for x in links if re.search(r'(pdf|download|document|attachment|file|report|下载|原文)',json.dumps(x,ensure_ascii=False),re.I)][:300]
                          for x in br['links']: add(x.get('href',''),x.get('text',''),source='browser:'+u)
                          # Public buttons only; click once and stop on account/payment gate.
                          for text in ['点击免费查看完整报告','免费查看完整报告','打开报告原文','查看原文','免费下载','下载报告','立即下载']:
                              loc=page.get_by_text(text,exact=False)
                              if loc.count():
                                  try:
                                      before=page.url
                                      with page.expect_download(timeout=5000) as di:
                                          loc.first.click(timeout=5000,force=True)
                                      d=di.value; target=PDFDIR/f'click_{idx}_{d.suggested_filename}'; d.save_as(str(target)); br.setdefault('downloads',[]).append({'url':d.url,'file':str(target)})
                                  except Exception as exc:
                                      br.setdefault('clicks',[]).append({'text':text,'error':repr(exc),'url':page.url})
                                      try: page.wait_for_timeout(1000)
                                      except Exception: pass
                                  try:
                                      body=' '.join(page.locator('body').inner_text(timeout=5000).split())[:20000]
                                      if re.search(r'(登录|注册|会员|付费|购买|扫码)',body): break
                                  except Exception: pass
                          Path(f'output/raw/browser_{idx:02d}.html').write_text(page.content(),encoding='utf-8')
                      except Exception as exc: br['error']=repr(exc)
                      browser_results.append(br); page.close()
                  browser.close()
              Path('output/browser_results.json').write_text(json.dumps(browser_results,ensure_ascii=False,indent=2),encoding='utf-8')
          except Exception as exc:
              Path('output/browser_error.txt').write_text(repr(exc),encoding='utf-8')

          # Validate and deduplicate downloaded PDFs.
          vals=[]; unique={}
          for p in sorted(PDFDIR.glob('*.pdf')):
              rec={'file':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              try:
                  reader=PdfReader(str(p)); pages=len(reader.pages)
                  idxs=sorted(set([0,min(1,pages-1),min(4,pages-1),max(0,pages//2),max(0,pages-2),pages-1]))
                  text='\n'.join((reader.pages[i].extract_text() or '') for i in idxs)
                  compact=re.sub(r'\s+','',text)
                  rec.update({'pages':pages,'sample_text':' '.join(text.split())[:10000],'searchable_chars_sample':len(compact),'target':bool(company_re.search(text)),'deep':bool(deep_re.search(text))})
                  rec['valid']=bool(pages>=12 and rec['target'])
              except Exception as exc: rec.update({'valid':False,'error':repr(exc)})
              vals.append(rec)
              if rec.get('valid') and rec['sha256'] not in unique: unique[rec['sha256']]=rec
              print('PDF_VALID',json.dumps({k:rec.get(k) for k in ['file','bytes','pages','searchable_chars_sample','target','deep','valid','sample_text']},ensure_ascii=False)[:15000],flush=True)
          Path('output/validations.json').write_text(json.dumps(vals,ensure_ascii=False,indent=2),encoding='utf-8')

          good=list(unique.values())
          good.sort(key=lambda x:(bool(x.get('deep')),int(x.get('pages') or 0),int(x.get('bytes') or 0)),reverse=True)
          chosen=good[:3]
          manifest=[]
          for i,v in enumerate(chosen,1):
              src=Path(v['file'])
              # Infer broker/title/date from first-page text where possible.
              txt=v.get('sample_text','')
              broker='券商';
              for b in ['东吴证券','华源证券','华创证券','西部证券','开源证券','浙商证券','信达证券','国泰海通证券','国泰君安证券']:
                  if b in txt: broker=b; break
              mdate=re.search(r'(20\d{2})[ 年./-]+(\d{1,2})[ 月./-]+(\d{1,2})',txt)
              date=f'{mdate.group(1)}-{int(mdate.group(2)):02d}-{int(mdate.group(3)):02d}' if mdate else '未知日期'
              title='中国宏桥券商深度报告'
              for t in title_terms:
                  if t.replace('+','')[:8] in txt.replace('+','') or t[:12] in txt: title=t; break
              safe=re.sub(r'[\\/:*?"<>|]+','_',title)[:70]
              name=f'{i:02d}_{date}_{broker}_{safe}.pdf'
              dst=PKG/name; dst.write_bytes(src.read_bytes())
              manifest.append({'序号':i,'券商':broker,'日期':date,'标题':title,'页数':v.get('pages'),'文件大小':v.get('bytes'),'SHA256':v['sha256'],'文件名':name})

          # Fallback: produce transparent web archive PDFs from publicly rendered report pages if fewer than two original PDFs were located.
          fallback=[]
          if len(chosen)<2:
              archive_pages=[
                  ('华创证券','2025-05-27','全球电解铝龙头，一体化打造盈利护城河，高分红属性明显','https://www.vzkoo.com/read/20250528cadc25e0bf397f71233f77c6.html'),
                  ('开源证券','2024-06-13','成本企稳+铝行业高景气，电解铝龙头扬帆起航','https://www.vzkoo.com/read/202406132f337967da1467c08bce7800.html'),
                  ('西部证券','2025-04-21','高景气+一体化+高分红，电解铝龙头静待价值重估','https://www.fxbaogao.com/detail/4802165'),
              ]
              try:
                  from playwright.sync_api import sync_playwright
                  chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
                      ctx=browser.new_context(user_agent=UA,locale='zh-CN',viewport={'width':1440,'height':1200})
                      for j,(broker,date,title,url) in enumerate(archive_pages,1):
                          pg=ctx.new_page()
                          try:
                              pg.goto(url,wait_until='domcontentloaded',timeout=90000); pg.wait_for_timeout(3000)
                              # Remove fixed headers/popups where possible; preserve public report text and images.
                              pg.evaluate("""() => { document.querySelectorAll('header,nav,.header,.footer,.right-view,.login,.el-dialog__wrapper,.tool-bar,.sidebar').forEach(e=>e.remove()); document.body.style.background='white'; }""")
                              out=PKG/f'{len(manifest)+1:02d}_{date}_{broker}_{re.sub(r"[\\/:*?\"<>|]+","_",title)[:70]}_网页公开存档版.pdf'
                              pg.pdf(path=str(out),format='A4',print_background=True,margin={'top':'12mm','bottom':'12mm','left':'10mm','right':'10mm'})
                              rr=PdfReader(str(out)); pages=len(rr.pages)
                              manifest.append({'序号':len(manifest)+1,'券商':broker,'日期':date,'标题':title+'（网页公开存档版，非原始PDF）','页数':pages,'文件大小':out.stat().st_size,'SHA256':hashlib.sha256(out.read_bytes()).hexdigest(),'文件名':out.name})
                              fallback.append(str(out))
                              if len(manifest)>=3: break
                          except Exception as exc: print('FALLBACK_ERROR',url,repr(exc),flush=True)
                          finally: pg.close()
                      browser.close()
              except Exception as exc: print('FALLBACK_BROWSER_ERROR',repr(exc),flush=True)

          import csv
          if manifest:
              with (PKG/'报告清单.csv').open('w',encoding='utf-8-sig',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=list(manifest[0].keys()));w.writeheader();w.writerows(manifest)
              readme=['中国宏桥（01378.HK）券商深度报告包','',f'共 {len(manifest)} 份文件。']
              if fallback: readme += ['', '说明：未能从公开网页直接取得足够的原始PDF时，补充了网页公开存档版；文件名和清单已明确标注。']
              readme += ['', '文件清单：']+[f"{r['序号']}. {r['券商']}｜{r['日期']}｜{r['标题']}｜{r['页数']}页" for r in manifest]
              (PKG/'README.txt').write_text('\n'.join(readme),encoding='utf-8')
              zpath=OUT/'China_Hongqiao_01378_Broker_Deep_Reports_Repacked.zip'
              with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for p in sorted(PKG.iterdir()): z.write(p,p.name)
              with zipfile.ZipFile(zpath) as z:
                  bad=z.testzip(); assert bad is None, bad
              status={'ok':len(manifest)>=2,'count':len(manifest),'original_pdf_count':len(chosen),'fallback_count':len(fallback),'zip':str(zpath),'zip_bytes':zpath.stat().st_size,'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'reports':manifest}
          else:
              status={'ok':False,'count':0,'reason':'No usable reports found'}
          Path('output/final_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_STATUS',json.dumps(status,ensure_ascii=False),flush=True)
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: china-hongqiao-deep-reports-repacked
          path: output/*
          retention-days: 1
          if-no-files-found: error
