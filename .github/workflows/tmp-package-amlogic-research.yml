name: Temporary Package Amlogic Brokerage Deep Reports

on:
  push:
    branches:
      - tmp/fetch-amlogic-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests

          ROOT = Path('amlogic_research_package')
          PDF_DIR = ROOT / '01_券商深度报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '东吴证券',
                  'date': '2026-04-30',
                  'title': '重塑TV产业新格局，筑牢全域连接底座，构筑端侧全场景SoC核心生态平台',
                  'authors': '陈海进、李雅文',
                  'info_code': 'AP202604301821789664',
                  'filename': '01_东吴证券_晶晨股份_重塑TV产业新格局_20260430.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202604301821789664_1.pdf',
                  'expected_pages': 25,
              },
              {
                  'broker': '东吴证券',
                  'date': '2025-06-13',
                  'title': '全球布局的音视频SoC龙头，多元布局开拓成长空间',
                  'authors': '陈海进、李雅文',
                  'info_code': 'AP202506131690405930',
                  'filename': '02_东吴证券_晶晨股份_全球布局的音视频SoC龙头_20250613.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202506131690405930_1.pdf',
                  'expected_pages': None,
              },
              {
                  'broker': '中邮证券',
                  'date': '2025-03-16',
                  'title': '晶彩启晨，芯动视界',
                  'authors': '吴文吉、万玮',
                  'info_code': 'AP202503161644421019',
                  'filename': '03_中邮证券_晶晨股份_晶彩启晨芯动视界_20250316.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202503161644421019_1.pdf',
                  'expected_pages': 50,
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download(item, destination):
              errors = []
              for attempt in range(1, 4):
                  try:
                      print(f"GET {item['broker']} {item['title']} attempt={attempt}: {item['url']}")
                      with session.get(item['url'], timeout=120, allow_redirects=True, stream=True) as response:
                          response.raise_for_status()
                          data = bytearray()
                          for chunk in response.iter_content(chunk_size=1024 * 256):
                              if chunk:
                                  data.extend(chunk)
                          raw = bytes(data)
                          content_type = response.headers.get('content-type')
                      if len(raw) < 300_000 or not raw.lstrip().startswith(b'%PDF'):
                          raise RuntimeError(f"not a substantial PDF: type={content_type}, bytes={len(raw)}, head={raw[:20]!r}")
                      destination.write_bytes(raw)
                      return
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc}')
                      time.sleep(attempt * 2)
              raise RuntimeError(f"Unable to download {item['title']}: " + '; '.join(errors))

          def page_count(path):
              completed = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', completed.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_text(path, first_page, last_page):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as tmp:
                  out = Path(tmp.name)
              try:
                  completed = subprocess.run(
                      ['pdftotext', '-f', str(first_page), '-l', str(last_page), '-enc', 'UTF-8', str(path), str(out)],
                      capture_output=True,
                      text=True,
                  )
                  if completed.returncode != 0 or not out.exists():
                      return ''
                  return out.read_text(encoding='utf-8', errors='ignore')
              finally:
                  out.unlink(missing_ok=True)

          def compact(text):
              return re.sub(r'\s+', '', text or '')

          manifest = []
          sha_lines = []
          for item in reports:
              path = PDF_DIR / item['filename']
              download(item, path)
              raw = path.read_bytes()
              pages = page_count(path)
              if pages < 20:
                  raise RuntimeError(f"Report is not deep/complete enough: {item['title']} only {pages} pages")
              if item['expected_pages'] is not None and pages != item['expected_pages']:
                  raise RuntimeError(f"Unexpected page count for {item['title']}: {pages}, expected {item['expected_pages']}")

              sample_pages = sorted(set([1, min(10, pages), max(1, pages // 2), pages]))
              text_parts = [extract_text(path, p, p) for p in sample_pages]
              first_20 = extract_text(path, 1, min(20, pages))
              text = compact(first_20 + '\n' + '\n'.join(text_parts))

              identity_ok = ('晶晨股份' in text) or ('688099' in text) or ('晶晨半导体' in text)
              broker_ok = item['broker'] in text
              year_ok = item['date'][:4] in text
              title_terms = [term for term in re.split(r'[，、：,: ]+', item['title']) if len(term) >= 4]
              title_hits = sum(1 for term in title_terms if term in text)
              title_ok = title_hits >= max(1, min(3, len(title_terms)))
              if not all([identity_ok, broker_ok, year_ok, title_ok]):
                  raise RuntimeError(
                      f"Text validation failed for {item['title']}: identity={identity_ok}, "
                      f"broker={broker_ok}, year={year_ok}, title={title_ok}, hits={title_hits}"
                  )

              sha = hashlib.sha256(raw).hexdigest()
              relative = str(path.relative_to(ROOT))
              record = {
                  'broker': item['broker'],
                  'date': item['date'],
                  'title': item['title'],
                  'authors': item['authors'],
                  'info_code': item['info_code'],
                  'file': relative,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'source_url': item['url'],
                  'pdf_header_valid': True,
                  'company_identity_matched': identity_ok,
                  'broker_matched': broker_ok,
                  'year_matched': year_ok,
                  'title_matched': title_ok,
                  'sampled_pages': sample_pages,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {relative}')
              print(f"VERIFIED {item['broker']} {item['date']} {item['title']}: pages={pages}, bytes={len(raw)}")

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '晶晨股份（688099）券商深度报告包',
              '',
              '筛选原则：优先选择近年、完整、篇幅不少于20页的公司深度或首次覆盖报告；排除数页点评、摘要和加密文件。',
              '报告均从东方财富公开研报原文地址下载。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f"- {record['broker']}｜{record['date']}｜{record['title']}",
                  f"  作者：{record['authors']}",
                  f"  页数：{record['pages']}",
                  f"  文件：{record['file']}",
                  f"  SHA256：{record['sha256']}",
                  f"  来源：{record['source_url']}",
              ])
          readme.extend([
              '',
              '校验项目：PDF文件头、pdfinfo可解析页数、公司名称/证券代码、券商名称、报告年份、标题关键词、逐份SHA-256、ZIP CRC。',
          ])
          (ROOT / 'README_报告清单与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '晶晨股份_688099_券商深度报告_3份_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: amlogic-brokerage-deep-reports
          path: 晶晨股份_688099_券商深度报告_3份_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
