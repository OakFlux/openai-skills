name: Query Eastmoney 2023 Air China Cargo IPO report

on:
  push:
    paths:
      - '.github/workflows/air-china-cargo-eastmoney-2023-query-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests
      - name: Query exact 2023 report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,time,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          seen=set()
          for qtype in ['0','1','2','3']:
            for begin,end in [('2023-01-01','2023-01-15'),('2023-01-08','2023-01-09')]:
              for page in range(1,20):
                params={'cb':'cbx','pageSize':'500','pageNo':str(page),'beginTime':begin,'endTime':end,'qType':qtype,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','rcode':'','_':str(int(time.time()*1000))}
                try:
                  r=s.get(url,params=params,timeout=(20,90)); r.raise_for_status(); t=r.text.strip(); m=re.match(r'^[^(]+\((.*)\)\s*;?$',t,re.S); obj=json.loads(m.group(1) if m else t)
                  data=obj.get('data') or []
                  for x in data:
                    blob=json.dumps(x,ensure_ascii=False)
                    if any(k in blob for k in ['国货航','航空物流再添新军','22H1盈利21亿','聚焦国货航IPO']):
                      key=(x.get('infoCode'),x.get('title'))
                      if key in seen: continue
                      seen.add(key)
                      print('MATCH',json.dumps({k:x.get(k) for k in ['infoCode','title','stockName','stockCode','orgName','orgCode','publishDate','encodeUrl']},ensure_ascii=False),flush=True)
                  total=int(obj.get('TotalPage') or obj.get('totalPage') or 1)
                  if not data or page>=total: break
                except Exception as e:
                  print('ERR',qtype,begin,page,repr(e),flush=True); break
          print('TOTAL',len(seen),flush=True)
          PY
