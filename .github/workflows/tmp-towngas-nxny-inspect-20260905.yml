name: Temporary Towngas Nxny download endpoint inspection

on:
  push:
    branches:
      - tmp-towngas-broker-reports-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect scripts and candidate pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://www.nxny.com/'})
          urls=[
            'https://www.nxny.com/js/index.js?v=1.08',
            'https://www.nxny.com/js/Popup.js?v=1.01',
            'https://www.nxny.com/report/view_6244237.html',
            'https://www.nxny.com/report/view_6241686.html',
            'https://www.nxny.com/report/view_6239409.html',
            'https://www.nxny.com/report/view_6033129.html',
            'https://www.nxny.com/report/view_5831439.html',
          ]
          for url in urls:
            r=s.get(url,timeout=90,allow_redirects=True)
            print('\n===== FETCH',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),'=====',flush=True)
            r.encoding=r.apparent_encoding or r.encoding
            text=r.text
            out='nxny_'+re.sub(r'[^A-Za-z0-9]+','_',url)+'.txt'
            Path(out).write_text(text,encoding='utf-8')
            if '<html' in text[:1000].lower():
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              body=' '.join(soup.get_text(' ',strip=True).split())
              for pat in [r'共\s*([0-9]+)\s*页',r'([0-9]+)\s*页',r'大小[^0-9]*([0-9.]+\s*(?:KB|MB))']:
                print('META_MATCH',pat,re.findall(pat,body,re.I)[:10],flush=True)
              for tag in soup.find_all(['script','a','iframe','form','input','button']):
                attrs={k:v for k,v in tag.attrs.items() if k in ['src','href','action','onclick','id','class','name','value','data-url','data-id','data-file']}
                if attrs:
                  val=json.dumps(attrs,ensure_ascii=False)
                  if re.search(r'down|file|pdf|login|vip|report|view|ajax|624|603|583',val,re.I):
                    print('TAG',tag.name,val,tag.get_text(' ',strip=True)[:200],flush=True)
            for kw in ['download','down','file','pdf','loginId','vipId','viewVip','viewLogin','reportid','rid','ajax','Popup','openWin','getFile','view_']:
              poses=[m.start() for m in re.finditer(re.escape(kw),text,re.I)]
              print('KEY',kw,'COUNT',len(poses),flush=True)
              for p in poses[:30]:
                print('CTX',kw,text[max(0,p-700):p+1800].replace('\n',' ')[:2500],flush=True)
            for pat in [r'https?://[^\s"\'<>]+',r'["\']([^"\']*(?:\.pdf|download|down|file|login|vip|report)[^"\']*)["\']']:
              for m in re.findall(pat,text,re.I):
                if isinstance(m,tuple): m=m[0]
                if len(m)<1000:
                  print('MATCH',m,flush=True)
          PY

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: towngas-nxny-inspection
          path: nxny_*.txt
          retention-days: 1
          if-no-files-found: error
