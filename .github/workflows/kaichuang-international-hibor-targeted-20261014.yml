name: Inspect targeted Hibor reports for Kaichuang International

on:
  push:
    paths:
      - '.github/workflows/kaichuang-international-hibor-targeted-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve archive links and inspect public assets
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html,json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://www.hibor.com.cn/docdetail_178938.html',
            'https://www.hibor.com.cn/docdetail_182952.html',
            'https://fxgroup.hibor.com.cn/Archiver/200908.html',
            'https://www.hibor.com.cn/archiver_houtai/200908.html',
          ]
          details=[]
          for url in urls:
            try:
              r=s.get(url,timeout=25,allow_redirects=True)
              print('\nFETCH',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              if r.status_code!=200: continue
              r.encoding=r.apparent_encoding or 'utf-8'; text=r.text
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if '开创国际' in label or '600097' in label:
                  print('MATCH_LINK',json.dumps({'label':label,'href':href},ensure_ascii=False),flush=True)
                  if 'docdetail_' in href or 'repinfodetail_' in href: details.append(href)
              if 'docdetail_' in r.url or 'repinfodetail_' in r.url:
                details.append(r.url)
                plain=' '.join(soup.get_text(' ',strip=True).split())
                print('PLAIN',plain[:5000],flush=True)
                for tag in soup.find_all(['a','img','form','script','iframe','embed','object']):
                  attrs={k:tag.get(k) for k in ('href','src','action','onclick','data-url','data-src','data-id','data-file','value') if tag.get(k)}
                  label=' '.join(tag.get_text(' ',strip=True).split())[:250]
                  joined=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                  if any(k in joined for k in ('pdf','download','down','原文','浏览','file','report','doc','image','preview','open')):
                    print('NODE',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False),flush=True)
                for term in ('pdf','download','浏览报告原文','报告原文','repinfodetail','docdetail','fileurl','reporturl','downurl','preview'):
                  poses=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
                  if poses: print('TERM',term,len(poses),flush=True)
                  for p in poses[:20]: print('CTX',re.sub(r'\s+',' ',text[max(0,p-700):p+2200])[:3000],flush=True)
                allurls=set()
                for m in re.finditer(r'https?://[^\s"\'<>]+',text,re.I): allurls.add(html.unescape(m.group(0)))
                for u in sorted(allurls):
                  if any(k in u.lower() for k in ('pdf','download','report','doc','file','img','image','preview')): print('URL',u,flush=True)
            except Exception as e: print('ERROR',url,repr(e),flush=True)
          print('\nDETAILS',sorted(set(details)),flush=True)
          # Fetch any newly found detail pages.
          for url in sorted(set(details)):
            if url in urls: continue
            try:
              r=s.get(url,timeout=25,allow_redirects=True); print('\nNEW_DETAIL',url,r.status_code,len(r.content),r.url,flush=True)
              r.encoding=r.apparent_encoding or 'utf-8'; text=r.text; soup=BeautifulSoup(text,'lxml')
              print('NEW_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              print('NEW_PLAIN',' '.join(soup.get_text(' ',strip=True).split())[:4000],flush=True)
              for tag in soup.find_all(['a','img','form','iframe','embed','object']):
                attrs={k:tag.get(k) for k in ('href','src','action','onclick','data-url','data-src','data-id','data-file') if tag.get(k)}
                label=' '.join(tag.get_text(' ',strip=True).split())[:200]
                joined=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in joined for k in ('pdf','download','down','原文','浏览','file','report','doc','image','preview','open')):
                  print('NEW_NODE',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False),flush=True)
            except Exception as e: print('NEW_ERROR',url,repr(e),flush=True)
          PY
