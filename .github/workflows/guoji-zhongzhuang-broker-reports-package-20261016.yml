name: Package Guoji Zhongzhuang broker reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-broker-reports-package-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: |
          python - <<'PY'
          import hashlib, json, re, shutil, subprocess, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          root = Path('国机重装_601399_券商研究报告_2份_截至20261016')
          root.mkdir(parents=True, exist_ok=True)
          preview = root / '首页预览'
          preview.mkdir(exist_ok=True)

          reports = [
            {
              'date': '2025-12-25',
              'broker': '爱建证券',
              'analyst': '王凯',
              'rating': '买入',
              'title': '首次覆盖报告：能源装备国之重器，AI时代全球化破局',
              'info_code': 'AP202512251807901334',
              'expected_pages': 7,
              'filename': '2025-12-25_爱建证券_首次覆盖报告_能源装备国之重器_AI时代全球化破局.pdf',
            },
            {
              'date': '2024-04-26',
              'broker': '华鑫证券',
              'analyst': '吕卓阳',
              'rating': '买入',
              'title': '公司事件点评报告：业绩较快增长，盈利能力改善',
              'info_code': 'AP202404261631373752',
              'expected_pages': 5,
              'filename': '2024-04-26_华鑫证券_公司事件点评_业绩较快增长_盈利能力改善.pdf',
            },
          ]

          session = requests.Session()
          session.headers.update({
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer': 'https://data.eastmoney.com/report/601399.html',
          })

          manifest = []
          for item in reports:
            url = f"https://pdf.dfcfw.com/pdf/H3_{item['info_code']}_1.pdf"
            target = root / item['filename']
            r = session.get(url, timeout=60, allow_redirects=True)
            r.raise_for_status()
            data = r.content
            if not data.startswith(b'%PDF') or len(data) < 100_000:
              raise RuntimeError(f"Invalid PDF download for {item['info_code']}: {r.status_code}, {len(data)} bytes, {data[:30]!r}")
            target.write_bytes(data)

            q = subprocess.run(['qpdf', '--check', str(target)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace')
            if q.returncode not in (0, 3):
              raise RuntimeError(f"qpdf failed for {target}: {q.returncode}\n{q.stdout}")

            reader = PdfReader(str(target))
            pages = len(reader.pages)
            if pages != item['expected_pages']:
              raise RuntimeError(f"Unexpected page count for {target}: {pages}, expected {item['expected_pages']}")

            txt_path = target.with_suffix('.txt')
            subprocess.run(['pdftotext', '-f', '1', '-l', str(min(3, pages)), str(target), str(txt_path)], check=True)
            text = txt_path.read_text(encoding='utf-8', errors='replace')
            txt_path.unlink(missing_ok=True)
            identity_hits = [x for x in ['国机重装', '国机重型装备集团股份有限公司', item['broker'], item['analyst']] if x in text]
            if '国机重装' not in text and '国机重型装备集团股份有限公司' not in text:
              raise RuntimeError(f"Company identity not found in first pages of {target}; hits={identity_hits}")

            preview_stem = preview / target.stem
            subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '110', str(target), str(preview_stem)], check=True)
            png = preview_stem.with_suffix('.png')
            if not png.exists() or png.stat().st_size < 10_000:
              raise RuntimeError(f"First-page render failed for {target}")

            sha = hashlib.sha256(data).hexdigest()
            entry = dict(item)
            entry.update({
              'source_url': url,
              'source_page': f"https://data.eastmoney.com/report/info/{item['info_code']}.html",
              'pages': pages,
              'bytes': len(data),
              'sha256': sha,
              'identity_hits': identity_hits,
              'qpdf_status': q.returncode,
            })
            manifest.append(entry)
            print('VERIFIED', json.dumps(entry, ensure_ascii=False, sort_keys=True))

          readme = [
            '# 国机重装（601399）券商研究报告',
            '',
            '整理日期：2026-10-16',
            '',
            '本压缩包收录公开可下载的两份券商公司研究报告原始PDF。',
            '',
          ]
          for i, x in enumerate(manifest, 1):
            readme += [
              f"## {i}. {x['broker']}｜{x['date']}",
              f"- 标题：{x['title']}",
              f"- 分析师：{x['analyst']}",
              f"- 评级：{x['rating']}",
              f"- 页数：{x['pages']}",
              f"- 文件：{x['filename']}",
              f"- SHA-256：`{x['sha256']}`",
              '',
            ]
          readme += [
            '## 说明',
            '',
            '- 文件均已通过PDF结构检查、页数检查、公司身份检查和首页渲染检查。',
            '- 研报内容仅代表原研究机构观点，仅供资料研究，不构成投资建议。',
          ]
          (root / 'README.md').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['filename']}" for x in manifest) + '\n', encoding='utf-8')

          cn_zip = Path('国机重装_601399_券商研究报告_2份_截至20261016.zip')
          en_zip = Path('guoji_zhongzhuang_601399_broker_reports_2_20261016.zip')
          for zpath in [cn_zip, en_zip]:
            with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for p in sorted(root.rglob('*')):
                if p.is_file():
                  zf.write(p, p.as_posix())
            with zipfile.ZipFile(zpath) as zf:
              bad = zf.testzip()
              if bad:
                raise RuntimeError(f"ZIP CRC failure: {bad}")
            print('ZIP', zpath, zpath.stat().st_size, hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('COUNTS', json.dumps({'reports': len(manifest), 'pages': sum(x['pages'] for x in manifest)}, ensure_ascii=False))
          PY
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: guoji-zhongzhuang-601399-broker-reports-2-20261016
          path: |
            国机重装_601399_券商研究报告_2份_截至20261016.zip
            guoji_zhongzhuang_601399_broker_reports_2_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
