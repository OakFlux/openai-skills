name: Inspect Eastmoney industry report API 20261020

on:
  push:
    paths:
      - '.github/workflows/jingcheng-sector-api-sample-20261020.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests
      - name: Inspect samples
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          url='https://reportapi.eastmoney.com/report/list'
          for q in ['0','1','2','3']:
            p={'industryCode':'*','pageSize':'20','industry':'*','rating':'*','ratingChange':'*','beginTime':'2025-01-01','endTime':'2026-10-20','pageNo':'1','fields':'','qType':q,'orgCode':'','author':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
            r=s.get(url,params=p,timeout=90)
            print('\nQTYPE',q,'STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url)
            print('PREFIX',r.text[:300])
            if r.status_code==200:
              x=r.json(); rows=x.get('data') or []
              if isinstance(rows,dict): rows=rows.get('list') or rows.get('data') or []
              print('COUNT',len(rows) if isinstance(rows,list) else type(rows).__name__)
              for row in (rows[:8] if isinstance(rows,list) else []):
                print('ROW',json.dumps({k:row.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','stockCode','stockName','industryName']},ensure_ascii=False))
          PY
