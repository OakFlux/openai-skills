name: Discover Silkroad Visual 300556 broker reports 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, time
          from pathlib import Path
          import requests

          api = 'https://reportapi.eastmoney.com/report/list'
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml?stockcode=300556',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          rows = []
          raw_pages = []
          for page in range(1, 21):
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2016-01-01', 'endTime': '2026-10-20',
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'code': '300556', 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              data = None
              last = None
              for attempt in range(8):
                  try:
                      response = session.get(api, params=params, timeout=(20, 90))
                      last = {'status': response.status_code, 'text': response.text[:300]}
                      if response.status_code == 200:
                          data = response.json()
                          break
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'API failed page {page}: {last}')

              raw_pages.append(data)
              page_rows = data.get('data') or []
              if isinstance(page_rows, dict):
                  page_rows = page_rows.get('list') or page_rows.get('data') or []
              if not isinstance(page_rows, list):
                  raise RuntimeError(f'unexpected data shape page {page}: {type(page_rows)} keys={list(data)[:20]}')
              rows.extend(page_rows)
              print('PAGE', page, 'ROWS', len(page_rows), 'HITS', data.get('hits'), 'SIZE', data.get('size'))
              if not page_rows or len(page_rows) < 100:
                  break
              time.sleep(0.3)

          Path('silkroad_visual_report_api_raw.json').write_text(json.dumps(raw_pages, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('silkroad_visual_report_candidates.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')

          def first(row, *keys):
              for key in keys:
                  value = row.get(key)
                  if value not in (None, '', []):
                      return value
              return ''

          normalized = []
          for row in rows:
              normalized.append({
                  'infoCode': first(row, 'infoCode', 'info_code', 'reportId', 'report_id'),
                  'title': first(row, 'title', 'reportTitle'),
                  'publishDate': first(row, 'publishDate', 'publish_date', 'pubDate', 'pub_date'),
                  'orgName': first(row, 'orgSName', 'orgName', 'org_name'),
                  'researcher': first(row, 'researcher', 'researcherName', 'author'),
                  'rating': first(row, 'emRatingName', 'ratingName', 'rating'),
                  'ratingChange': first(row, 'ratingChange', 'rating_change'),
                  'attachPages': first(row, 'attachPages', 'attach_pages', 'pageCount'),
                  'attachSize': first(row, 'attachSize', 'attach_size'),
                  'stockCode': first(row, 'stockCode', 'stock_code', 'code'),
                  'stockName': first(row, 'stockName', 'stock_name', 'name'),
              })

          def page_num(item):
              try:
                  return int(item.get('attachPages') or 0)
              except Exception:
                  return 0

          normalized.sort(key=lambda item: (page_num(item), str(item.get('publishDate') or '')), reverse=True)
          Path('silkroad_visual_report_candidates_normalized.json').write_text(json.dumps(normalized, ensure_ascii=False, indent=2), encoding='utf-8')
          with open('silkroad_visual_report_candidates.csv', 'w', encoding='utf-8-sig', newline='') as file:
              fieldnames = list(normalized[0].keys()) if normalized else ['infoCode']
              writer = csv.DictWriter(file, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(normalized)

          print('TOTAL', len(rows))
          for item in normalized[:150]:
              print(json.dumps(item, ensure_ascii=False))
          PY

      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: silkroad-visual-300556-broker-discovery-20261020
          path: |
            silkroad_visual_report_api_raw.json
            silkroad_visual_report_candidates.json
            silkroad_visual_report_candidates_normalized.json
            silkroad_visual_report_candidates.csv
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
