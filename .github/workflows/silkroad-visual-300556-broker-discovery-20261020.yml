name: Inspect Silkroad Visual Sina report details 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ids = [
              '772917335740',
              '755805854690',
              '554831350327',
              '543594626889',
              '542806228845',
              '539853798025',
              '537522728885',
              '530965274667',
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://stock.finance.sina.com.cn/',
          })

          for rid in ids:
              url = f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
              r = s.get(url, timeout=(20, 90), allow_redirects=True)
              text = r.content.decode(r.apparent_encoding or 'gbk', errors='replace')
              soup = BeautifulSoup(text, 'lxml')
              plain = re.sub(r'\s+', ' ', soup.get_text(' ', strip=True))
              print('\n########', rid, 'STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content))
              print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')
              print('TEXT', plain[:2500])

              links = []
              for a in soup.find_all('a', href=True):
                  label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                  href = urljoin(r.url, a.get('href'))
                  lower = href.lower()
                  if '.pdf' in lower or 'download' in lower or 'down' in lower or 'file' in lower or '下载' in label or '原文' in label:
                      links.append({'label': label, 'href': href})
              print('LINKS', json.dumps(links, ensure_ascii=False))

              for token in ['机构：', '研究员：', '日期：', '类别：', '报告出处', 'PDF', '下载']:
                  pos = plain.find(token)
                  if pos >= 0:
                      print('TOKEN', token, plain[max(0, pos-150):pos+500])

              raw_candidates = []
              for chunk in re.findall(r'https?://[^\s\"<>]+', text):
                  if '.pdf' in chunk.lower() or 'download' in chunk.lower() or 'file' in chunk.lower():
                      raw_candidates.append(chunk[:500])
              print('RAW_URLS', json.dumps(sorted(set(raw_candidates))[:100], ensure_ascii=False))
          PY
