name: Inspect Silkroad Visual report source internals 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect source HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages = [
              ('Three Piggies 2023', 'https://www.sgpjbg.com/baogao/148552.html'),
              ('Three Piggies 2024', 'https://www.sgpjbg.com/baogao/166556.html'),
              ('Report Search 2024', 'https://report.seedsufe.com/preview/1028589'),
              ('BaogaoBox 2024', 'https://www.baogaobox.com/reports/240628000021853.html'),
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Connection': 'close',
          })

          def print_matches(prefix, text):
              patterns = [
                  r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                  r'https?://[^\s\"\'<>]+',
                  r'file[_-]?(?:url|path|name)[^\n]{0,800}',
                  r'(?:pdf|PDF)[^\n]{0,1000}',
                  r'download[^\n]{0,1000}',
                  r'preview[^\n]{0,1000}',
                  r'document[_-]?(?:id|url|path)[^\n]{0,800}',
                  r'report[_-]?(?:id|url|path)[^\n]{0,800}',
                  r'1028589[^\n]{0,800}',
                  r'148552[^\n]{0,800}',
                  r'166556[^\n]{0,800}',
                  r'240628000021853[^\n]{0,800}',
              ]
              for pattern in patterns:
                  found = re.findall(pattern, text, flags=re.I|re.S)
                  # For broad URL regex, retain relevant only.
                  if pattern.startswith('https?://[^') and '.pdf' not in pattern:
                      found = [x for x in found if any(k in x.lower() for k in ['pdf','download','file','document','report','preview','oss','cos','static','api','image'])]
                  print(prefix, 'PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:40])

          for label, url in pages:
              print('\n\n####################', label, url)
              try:
                  response = session.get(url, timeout=(20, 120), allow_redirects=True)
              except Exception as exc:
                  print('GET_ERROR', repr(exc))
                  continue
              print('STATUS', response.status_code, 'FINAL', response.url, 'LEN', len(response.content), 'CT', response.headers.get('content-type'))
              text = response.content.decode(response.apparent_encoding or 'utf-8', errors='replace')
              soup = BeautifulSoup(text, 'lxml')
              plain = re.sub(r'\s+', ' ', soup.get_text(' ', strip=True))
              print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')
              print('PLAIN_HEAD', plain[:8000])
              print('HTML_HEAD', repr(text[:8000]))
              print('HTML_TAIL', repr(text[-16000:]))
              print_matches(label, text)

              links = []
              for tag in soup.find_all(['a','iframe','embed','object','form','link','script','img','source']):
                  label_text = re.sub(r'\s+', ' ', tag.get_text(' ', strip=True))[:300]
                  for attr in ['href','src','action','data','value','content']:
                      raw = tag.get(attr)
                      if not raw:
                          continue
                      target = urljoin(response.url, html.unescape(str(raw)))
                      blob = (label_text + ' ' + target).lower()
                      if any(k in blob for k in ['pdf','下载','完整报告','download','file','document','report','preview','oss','cos','api','attachment']):
                          links.append({'tag':tag.name,'label':label_text,'attr':attr,'url':target[:1800]})
              print('RELEVANT_TAGS', json.dumps(links[:400], ensure_ascii=False))

              script_urls = []
              for script in soup.find_all('script', src=True):
                  script_urls.append(urljoin(response.url, script.get('src')))
              print('SCRIPT_URLS', json.dumps(script_urls, ensure_ascii=False))

              for script_url in script_urls[:80]:
                  try:
                      js = session.get(script_url, timeout=(15, 90), allow_redirects=True)
                      if js.status_code != 200 or len(js.content) > 3_000_000:
                          print('JS_SKIP', js.status_code, len(js.content), script_url)
                          continue
                      js_text = js.content.decode(js.apparent_encoding or 'utf-8', errors='replace')
                      relevant = any(k in js_text.lower() for k in ['pdf','download','fileurl','file_url','documentid','document_id','preview','1028589','148552','166556','reporturl','report_url'])
                      print('JS', js.status_code, len(js.content), 'RELEVANT', relevant, script_url)
                      if relevant:
                          print_matches('JS ' + script_url, js_text)
                          for key in ['1028589','148552','166556','pdfUrl','fileUrl','file_url','downloadUrl','download_url','previewUrl','reportUrl']:
                              pos = js_text.find(key)
                              if pos >= 0:
                                  print('JS_CONTEXT', key, repr(js_text[max(0,pos-1000):pos+4000]))
                  except Exception as exc:
                      print('JS_ERROR', script_url, repr(exc))
          PY
