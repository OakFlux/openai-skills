name: Search Silkroad Visual broker report PDFs 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Search public web sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote, unquote, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup

          queries = [
              '丝路视觉 以技术呈现创意 用数字定义视界 PDF',
              '丝路视觉 视觉综合服务领头羊 浙商证券 PDF',
              '丝路视觉 A股综合CG视觉服务稀缺标的 大型综合业务业绩弹性可期 PDF',
              '丝路视觉 CG视效综合服务领军者 PDF',
              '丝路视觉 A股稀缺CG标的 出海及产业链延伸潜力大 PDF',
              '丝路视觉 专业化CG视觉服务提供商 受益于影视特效迅速发展 PDF',
              '丝路视觉 券商 深度报告 pdf',
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          engines = {
              'bing': lambda q: f'https://www.bing.com/search?q={quote(q)}&count=50',
              'duckduckgo': lambda q: f'https://html.duckduckgo.com/html/?q={quote(q)}',
              'baidu': lambda q: f'https://www.baidu.com/s?wd={quote(q)}&rn=50',
              'sogou': lambda q: f'https://www.sogou.com/web?query={quote(q)}&num=50',
              'so360': lambda q: f'https://www.so.com/s?q={quote(q)}&pn=1',
          }

          def clean_url(href):
              if not href:
                  return ''
              href = html.unescape(href)
              if href.startswith('//'):
                  href = 'https:' + href
              if href.startswith('/l/?'):
                  qs = parse_qs(urlparse(href).query)
                  href = unquote((qs.get('uddg') or [''])[0])
              return href

          for query in queries:
              print('\n\n================ QUERY', query)
              for engine, make_url in engines.items():
                  url = make_url(query)
                  print('\n---- ENGINE', engine, url)
                  try:
                      r = session.get(url, timeout=(20, 90), allow_redirects=True)
                      print('STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content), 'CT', r.headers.get('content-type'))
                      text = r.content.decode(r.apparent_encoding or 'utf-8', errors='replace')
                      soup = BeautifulSoup(text, 'lxml')
                      out = []
                      seen = set()
                      for a in soup.find_all('a', href=True):
                          label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                          href = clean_url(a.get('href'))
                          blob = (label + ' ' + href).lower()
                          if not href.startswith('http'):
                              continue
                          if any(k.lower() in blob for k in ['丝路视觉', '300556', 'cg视觉', '数字定义视界', 'pdf', '研报', '报告']):
                              key = (label[:300], href[:1000])
                              if key not in seen:
                                  seen.add(key)
                                  out.append({'label': label[:300], 'href': href[:1000]})
                      print('RESULTS', json.dumps(out[:80], ensure_ascii=False))
                      raw_pdfs = sorted(set(re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?', text, flags=re.I)))
                      print('RAW_PDFS', json.dumps(raw_pdfs[:80], ensure_ascii=False))
                  except Exception as exc:
                      print('ERROR', repr(exc))
          PY
