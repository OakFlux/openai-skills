name: Decode Silkroad Visual 360 redirect targets 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Decode redirect HTML bodies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote, urljoin, unquote
          import requests
          from bs4 import BeautifulSoup

          queries = [
              ('丝路视觉 以技术呈现创意 用数字定义视界 PDF', ['三个皮匠报告','以技术呈现创意']),
              ('丝路视觉 视觉即话语 细琢数字内容创意 PDF', ['三个皮匠报告','未来智库','远瞻慧库','报告查一查']),
              ('丝路视觉 专业化CG视觉服务提供商 受益于影视特效迅速发展 PDF', ['发现报告','证券之星']),
              ('丝路视觉 A股稀缺CG标的 出海及产业链延伸潜力大 PDF', ['新浪财经','东方财富','康雅雯']),
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def extract_urls(body, base):
              values = []
              decoded = html.unescape(body)
              decoded2 = unquote(decoded)
              for source in [decoded, decoded2]:
                  values += re.findall(r'https?://[^\s\"\'<>\\]+', source)
                  values += re.findall(r'(?i)(?:location(?:\.href)?|url)\s*[:=]\s*[\"\']([^\"\']+)', source)
                  values += re.findall(r'(?i)<meta[^>]+url=([^\"\'>]+)', source)
              out=[]
              for value in values:
                  value = html.unescape(unquote(value)).replace('\\/','/')
                  if value.startswith('/'):
                      value=urljoin(base,value)
                  if value.startswith('http') and value not in out:
                      out.append(value)
              return out

          for query, needles in queries:
              print('\n\n######## QUERY', query)
              search_url = 'https://www.so.com/s?q=' + quote(query) + '&pn=1'
              sr = s.get(search_url, timeout=(20,90), allow_redirects=True)
              soup = BeautifulSoup(sr.content.decode(sr.apparent_encoding or 'utf-8', errors='replace'), 'lxml')
              matches=[]
              for a in soup.find_all('a', href=True):
                  label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                  if any(needle in label for needle in needles):
                      matches.append((label,urljoin(sr.url,html.unescape(a.get('href')))))
              print('MATCHES',json.dumps(matches,ensure_ascii=False))
              for label, href in matches:
                  try:
                      r=s.get(href,timeout=(20,90),allow_redirects=True)
                      body=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
                      print('\nLABEL',label)
                      print('HREF',href)
                      print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CT',r.headers.get('content-type'))
                      print('BODY_REPR',repr(body[:3000]))
                      urls=extract_urls(body,r.url)
                      print('EXTRACTED_URLS',json.dumps(urls,ensure_ascii=False))
                      for target in urls[:20]:
                          try:
                              rr=s.get(target,timeout=(20,90),allow_redirects=True)
                              snippet=rr.content[:500].decode(rr.apparent_encoding or 'utf-8',errors='replace') if 'text' in (rr.headers.get('content-type') or '') else ''
                              print('FOLLOW',target,'=>',rr.status_code,rr.url,len(rr.content),rr.headers.get('content-type'),'SNIP',repr(snippet[:500]))
                          except Exception as exc:
                              print('FOLLOW_ERROR',target,repr(exc))
                  except Exception as exc:
                      print('ERROR',label,repr(exc))
          PY
