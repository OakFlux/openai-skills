name: Resolve Silkroad Visual report source pages 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve search redirects and inspect targets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          targets = [
              ('丝路视觉 以技术呈现创意 用数字定义视界 PDF', ['以技术呈现创意', '用数字定义视界']),
              ('丝路视觉 视觉即话语 细琢数字内容创意 PDF', ['视觉即话语', '细琢数字内容创意']),
              ('丝路视觉 专业化CG视觉服务提供商 受益于影视特效迅速发展 PDF', ['专业化CG视觉服务提供商', '影视特效迅速发展']),
              ('丝路视觉 A股综合CG视觉服务稀缺标的 大型综合业务业绩弹性可期 PDF', ['A股综合CG视觉服务稀缺标的', '大型综合业务业绩弹性可期']),
              ('丝路视觉 A股稀缺CG标的 出海及产业链延伸潜力大 PDF', ['A股稀缺CG标的', '产业链延伸潜力大']),
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def inspect(url, label):
              try:
                  r = s.get(url, timeout=(20, 120), allow_redirects=True)
                  text = r.content.decode(r.apparent_encoding or 'utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'lxml')
                  plain = re.sub(r'\s+', ' ', soup.get_text(' ', strip=True))
                  print('\n===== TARGET', label)
                  print('START_URL', url)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content), 'CT', r.headers.get('content-type'))
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')
                  print('TEXT_HEAD', plain[:3500])

                  candidates = []
                  for tag in soup.find_all(['a','form','iframe','embed','object','source','script']):
                      attrs = []
                      for key in ['href','src','action','data','value']:
                          value = tag.get(key)
                          if value:
                              attrs.append((key, urljoin(r.url, html.unescape(str(value)))))
                      label_text = re.sub(r'\s+', ' ', tag.get_text(' ', strip=True))[:300]
                      for key, value in attrs:
                          blob = (label_text + ' ' + value).lower()
                          if any(token in blob for token in ['.pdf','download','down','file','oss','attachment','document','preview','api']):
                              candidates.append({'tag': tag.name, 'label': label_text, 'attr': key, 'url': value[:1200]})
                  print('CANDIDATES', json.dumps(candidates[:200], ensure_ascii=False))

                  raw_urls = []
                  for chunk in re.findall(r'https?://[^\s\"\'<>]+', text):
                      if any(token in chunk.lower() for token in ['.pdf','download','file','oss','attachment','api']):
                          raw_urls.append(html.unescape(chunk[:1500]))
                  print('RAW_URLS', json.dumps(sorted(set(raw_urls))[:200], ensure_ascii=False))

                  for pattern in [
                      r'file[_-]?url[^\n]{0,500}',
                      r'download[^\n]{0,500}',
                      r'pdf[^\n]{0,500}',
                      r'document[_-]?id[^\n]{0,300}',
                      r'oss[^\n]{0,500}',
                      r'preview[^\n]{0,500}',
                      r'__NEXT_DATA__[^\n]{0,5000}',
                  ]:
                      found = re.findall(pattern, text, flags=re.I|re.S)
                      print('PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:10])
              except Exception as exc:
                  print('INSPECT_ERROR', label, url, repr(exc))

          seen_final = set()
          for query, fragments in targets:
              search_url = 'https://www.so.com/s?q=' + quote(query) + '&pn=1'
              print('\n\n################ QUERY', query)
              response = s.get(search_url, timeout=(20, 120), allow_redirects=True)
              text = response.content.decode(response.apparent_encoding or 'utf-8', errors='replace')
              soup = BeautifulSoup(text, 'lxml')
              matches = []
              for a in soup.find_all('a', href=True):
                  label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                  if any(fragment in label for fragment in fragments):
                      href = urljoin(response.url, html.unescape(a.get('href')))
                      matches.append((label, href))
              print('MATCHES', json.dumps(matches[:50], ensure_ascii=False))
              for label, href in matches[:20]:
                  try:
                      r = s.get(href, timeout=(20, 120), allow_redirects=True)
                      final = r.url
                      print('RESOLVE', label[:300], '=>', final, 'STATUS', r.status_code, 'LEN', len(r.content), 'CT', r.headers.get('content-type'))
                      if final not in seen_final:
                          seen_final.add(final)
                          inspect(final, label)
                  except Exception as exc:
                      print('RESOLVE_ERROR', label, href, repr(exc))

          direct_pages = [
              ('360文库 安信报告', 'https://wenku.so.com/d/48ddfb3c309469a5526ad171bc4409cd'),
          ]
          for label, url in direct_pages:
              if url not in seen_final:
                  inspect(url, label)
          PY
