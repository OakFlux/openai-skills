name: Fast discover Kaichuang International reports

on:
  push:
    paths:
      - '.github/workflows/kaichuang-international-600097-fast-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query direct company reports
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json,time,requests
          CODE='600097'; endpoint='https://reportapi.eastmoney.com/report/list'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          windows=[('2008-01-01','2012-12-31'),('2013-01-01','2017-12-31'),('2018-01-01','2022-12-31'),('2023-01-01','2026-10-14')]
          seen=set(); found=[]
          for begin,end in windows:
            for qtype in ('0','1'):
              for page in range(1,10):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':begin,'endTime':end,
                        'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':CODE,'rcode':'','p':str(page),
                        'pageNum':str(page),'pageNumber':str(page),'_':str(int(time.time()*1000))}
                r=s.get(endpoint,params=params,timeout=60); print('QUERY',begin,end,qtype,page,r.status_code,len(r.content),flush=True)
                r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                print('COUNT',len(rows),'HITS',payload.get('hits'),flush=True)
                if not rows: break
                for x in rows:
                  ic=str(x.get('infoCode') or '')
                  if ic and ic not in seen:
                    seen.add(ic); found.append(x); print('FOUND',json.dumps(x,ensure_ascii=False),flush=True)
                if len(rows)<100: break
          print('FINAL_FOUND',len(found),flush=True)
          for x in sorted(found,key=lambda v:str(v.get('publishDate') or ''),reverse=True):
            print('SUMMARY',json.dumps({k:x.get(k) for k in ('title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column','reportType','encodeUrl')},ensure_ascii=False),flush=True)
          PY
