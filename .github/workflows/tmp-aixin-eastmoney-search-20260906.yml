name: Temporary Aixin Eastmoney research search

on:
  push:
    branches:
      - tmp-aixin-eastmoney-search-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query and download public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io, json, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9',
            'Referer':'https://data.eastmoney.com/report/','Origin':'https://data.eastmoney.com'
          })
          api='https://reportapi.eastmoney.com/report/list'
          codes=['00600','0600','HK00600','116.00600','105.00600','600']
          qtypes=[0,1,2]
          all_rows=[]
          for code in codes:
            for qt in qtypes:
              for page in range(1,6):
                params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2025-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'',
                  'qType':str(qt),'orgCode':'','code':code,'rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page),'client':'WEB','source':'WEB'
                }
                try:
                  r=s.get(api,params=params,timeout=90)
                  print('API',code,qt,page,r.status_code,len(r.content),r.url,flush=True)
                  obj=r.json(); batch=obj.get('data') or obj.get('Data') or obj.get('result') or []
                  if isinstance(batch,dict): batch=batch.get('data') or batch.get('list') or batch.get('records') or []
                  print('ROWS',len(batch),'HITS',obj.get('hits') or obj.get('total'),flush=True)
                  if not batch: break
                  for rec in batch:
                    rec={'query_code':code,'query_qtype':qt,**rec}; all_rows.append(rec)
                    joined=''.join(str(rec.get(k) or '') for k in ['stockName','stockCode','title','orgSName'])
                    if '爱芯元智' in joined or str(rec.get('stockCode') or '') in {'00600','0600'}:
                      print('MATCH',json.dumps({k:rec.get(k) for k in ['stockName','stockCode','title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName']},ensure_ascii=False),flush=True)
                except Exception as e:
                  print('ERR',code,qt,page,repr(e),flush=True); break
          uniq={str(r.get('infoCode') or r.get('INFO_CODE') or id(r)):r for r in all_rows}
          rows=list(uniq.values())
          matches=[]
          for rec in rows:
            joined=''.join(str(rec.get(k) or '') for k in ['stockName','stockCode','title','orgSName'])
            if '爱芯元智' not in joined and str(rec.get('stockCode') or '') not in {'00600','0600'}:
              continue
            info=str(rec.get('infoCode') or rec.get('INFO_CODE') or '')
            if not info: continue
            urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time()*1000)}']
            tests=[]
            for u in urls:
              try:
                rr=s.get(u,headers={'Referer':f'https://data.eastmoney.com/report/info/{info}.html','Accept':'application/pdf,*/*'},timeout=(20,180),allow_redirects=True)
                data=rr.content
                row={'url':u,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
                if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                  row['pages']=len(PdfReader(io.BytesIO(data),strict=False).pages)
                  fp=out/f'{info}.pdf'; fp.write_bytes(data); row['saved']=fp.name
                  print('PDF_OK',info,row['pages'],len(data),rec.get('orgSName'),rec.get('title'),flush=True)
                  tests.append(row); break
                print('PDF_BAD',info,row,flush=True); tests.append(row)
              except Exception as e:
                tests.append({'url':u,'error':repr(e)}); print('PDF_ERR',info,repr(e),flush=True)
            matches.append({'record':rec,'tests':tests})
          (out/'all_rows.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE',len(rows),'MATCHES',len(matches),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-eastmoney-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
