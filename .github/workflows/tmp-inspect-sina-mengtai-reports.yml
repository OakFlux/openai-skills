name: Temporary Inspect Sina Mengtai High-tech Reports

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-inspect-sina-mengtai-reports.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch and parse Sina report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from urllib.parse import urljoin
          urls=[
            'https://finance.sina.com.cn/realstock/company/sz300876/nc.shtml',
            'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=sz300876&t1=all',
            'https://vip.stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz300876&t1=all',
            'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=300876&t1=all',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz300876&t1=all',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          def dec(raw):
            for enc in ('utf-8','gb18030','gbk'):
              try:return raw.decode(enc)
              except UnicodeDecodeError:pass
            return raw.decode('utf-8','ignore')
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              text=html.unescape(dec(r.content)).replace('\\/','/')
              visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
              visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
              visible=re.sub(r'<[^>]+>',' ',visible)
              visible=re.sub(r'\s+',' ',visible).strip()
              print('PAGE_JSON='+json.dumps({'url':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'head':visible[:1000]},ensure_ascii=False))
              links=[]
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                href=urljoin(r.url,html.unescape(m.group(1)))
                title=re.sub(r'<[^>]+>',' ',m.group(2)); title=re.sub(r'\s+',' ',html.unescape(title)).strip()
                both=(href+' '+title).lower()
                if any(k in both for k in ['vreport','report','研报','报告','300876','蒙泰']):
                  links.append({'title':title,'href':href})
              uniq=[];seen=set()
              for x in links:
                key=(x['title'],x['href'])
                if key not in seen:seen.add(key);uniq.append(x)
              print('LINKS_JSON='+json.dumps({'url':url,'links':uniq[:100]},ensure_ascii=False))
            except Exception as e:
              print('ERROR_JSON='+json.dumps({'url':url,'error':repr(e)},ensure_ascii=False))
          PY
