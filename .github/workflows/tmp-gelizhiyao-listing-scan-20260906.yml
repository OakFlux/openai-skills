name: Temporary Ascletis report catalogue scan

on:
  push:
    branches:
      - tmp-gelizhiyao-listing-scan-20260906

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan rendered catalogue HTML
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          ranges=list(range(280,306))+list(range(395,436))
          phrases=['歌礼制药','口服小分子率先破局','聚焦减重代谢产品差异化管线','全新GLP-1减重不减肌','ASC30','ASC47']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.hangyan.co/reports'})
          pages=[]; matches=[]
          for page_no in ranges:
            url=f'https://www.hangyan.co/reports?page={page_no}'
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              soup=BeautifulSoup(r.text,'html.parser')
              items=[]
              for a in soup.select('a[data-controller~="protected-link"]'):
                text=' '.join(a.get_text(' ',strip=True).split())
                parent=a.find_parent(['article','li','section','div'])
                context=' '.join((parent.get_text(' ',strip=True) if parent else text).split())
                rec={'page':page_no,'text':text,'context':context[:4000],'attributes':dict(a.attrs)}
                items.append(rec)
                joined=text+' '+context
                if any(p in joined for p in phrases):
                  matches.append(rec)
                  print('MATCH',json.dumps(rec,ensure_ascii=False),flush=True)
              dates=sorted(set(re.findall(r'20\d{2}-\d{2}-\d{2}',r.text)))
              pages.append({'page':page_no,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'dates':dates,'item_count':len(items),'items':items})
              print('PAGE',page_no,r.status_code,len(items),dates[:3],dates[-3:],flush=True)
              time.sleep(0.08)
            except Exception as e:
              pages.append({'page':page_no,'url':url,'error':repr(e)})
              print('ERR',page_no,repr(e),flush=True)
          (out/'pages.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT',len(matches),flush=True)
          PY
      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: gelizhiyiao-listing-scan
          path: output/*
          retention-days: 1
          if-no-files-found: error
