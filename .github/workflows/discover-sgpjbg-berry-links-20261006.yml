name: Discover SGPJBG Berry report links

on:
  pull_request:
    paths:
      - 'tasks/sgpjbg-berry-link-discovery-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch SGPJBG pages and inspect report links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = [
            'https://www.sgpjbg.com/labels/beiruijiyinnianbao.html',
            'https://www.sgpjbg.com/labels/jiyincexuxingyexianzhuang.html',
            'https://www.sgpjbg.com.cn/bggroup/2287.html',
            'https://www.sgpjbg.com/zhuanti/beiruijiyin.html',
          ]
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/'})
          out={}
          for i,url in enumerate(urls):
            try:
              r=s.get(url,timeout=(25,120),allow_redirects=True)
              print('PAGE',i,r.status_code,len(r.content),r.url,flush=True)
              Path(f'output/page_{i}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              matches=[]
              for tag in soup.find_all(['a','button','iframe','embed','object','form']):
                text=' '.join(tag.get_text(' ',strip=True).split())
                attrs={a:tag.get(a) for a in ('href','src','action','data','data-url','data-href','onclick') if tag.get(a)}
                blob=text+' '+json.dumps(attrs,ensure_ascii=False)
                if any(k in blob for k in ['贝瑞基因','基因测序行业的领头羊','解码生命经纬','肿瘤早筛','20200929','250828']):
                  norm={k:(urljoin(r.url,v) if k in ('href','src','action','data','data-url','data-href') and isinstance(v,str) else v) for k,v in attrs.items()}
                  matches.append({'tag':tag.name,'text':text[:500],'attrs':norm})
              raw=[]
              for m in re.finditer(r'.{0,300}(?:贝瑞基因|基因测序行业的领头羊|解码生命经纬|肿瘤早筛|20200929|250828).{0,500}',r.text,flags=re.I|re.S):
                raw.append(re.sub(r'\s+',' ',m.group(0))[:1000])
              urls_found=sorted(set(re.findall(r'https?://[^\s"\'<>]+',r.text)))
              interesting=[u for u in urls_found if any(k in u.lower() for k in ('pdf','download','report','file','upload','static'))]
              out[str(i)]={'url':url,'final_url':r.url,'status':r.status_code,'length':len(r.content),'matches':matches,'raw':raw[:100],'interesting_urls':interesting[:300]}
              print('MATCHES',i,json.dumps(matches,ensure_ascii=False)[:30000],flush=True)
              print('RAW',i,json.dumps(raw[:100],ensure_ascii=False)[:30000],flush=True)
              print('INTERESTING',i,json.dumps(interesting[:300],ensure_ascii=False)[:30000],flush=True)
            except Exception as e:
              out[str(i)]={'url':url,'error':repr(e)};print('ERROR',i,repr(e),flush=True)
          Path('output/discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sgpjbg-berry-link-discovery
          path: output/
          retention-days: 7
          if-no-files-found: error
