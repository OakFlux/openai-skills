name: Inspect Lixing 300421 Eastmoney browser network 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-eastmoney-browser-inspect-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: Capture report network and table data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import re
          from pathlib import Path
          from playwright.async_api import async_playwright

          START_URLS = [
              'https://data.eastmoney.com/report/300421.html',
              'https://data.eastmoney.com/report/stock.jshtml?stockcode=300421',
          ]

          async def inspect(context, start_url):
              page = await context.new_page()
              captures = []
              requests = []

              def on_request(req):
                  try:
                      u = req.url.lower()
                      if any(k in u for k in ['reportapi', '/report/', 'report/list', 'datacenter', 'api/data', '300421']):
                          requests.append({
                              'method': req.method,
                              'url': req.url,
                              'resource_type': req.resource_type,
                              'post_data': req.post_data,
                          })
                  except Exception:
                      pass

              async def on_response(resp):
                  try:
                      url = resp.url
                      ct = (resp.headers.get('content-type') or '').lower()
                      lower = url.lower()
                      if any(k in lower for k in ['reportapi', '/report/', 'report/list', 'datacenter', 'api/data', '300421']) or 'json' in ct:
                          item = {'status': resp.status, 'url': url, 'content_type': ct}
                          if resp.status == 200 and ('json' in ct or 'text' in ct or 'javascript' in ct):
                              try:
                                  body = await resp.text()
                                  if any(k in body for k in ['300421', '力星股份', 'infoCode', 'report/list', '精密滚动体', '陶瓷球']):
                                      item['body'] = body[:300000]
                              except Exception as exc:
                                  item['body_error'] = repr(exc)
                          captures.append(item)
                  except Exception:
                      pass

              page.on('request', on_request)
              page.on('response', lambda resp: asyncio.create_task(on_response(resp)))
              print('\n\n######## OPEN', start_url)
              try:
                  await page.goto(start_url, wait_until='domcontentloaded', timeout=90000)
              except Exception as exc:
                  print('GOTO_ERROR', repr(exc), 'CURRENT', page.url)
              await page.wait_for_timeout(15000)
              for _ in range(15):
                  try:
                      await page.mouse.wheel(0, 1200)
                  except Exception:
                      pass
                  await page.wait_for_timeout(350)

              print('FINAL_URL', page.url)
              try:
                  print('TITLE', await page.title())
              except Exception as exc:
                  print('TITLE_ERROR', repr(exc))
              try:
                  body = await page.locator('body').inner_text(timeout=10000)
              except Exception as exc:
                  body = ''
                  print('BODY_ERROR', repr(exc))
              print('BODY_HEAD', re.sub(r'\s+', ' ', body[:30000]))

              # Capture rows/links from the rendered page.
              try:
                  rows = await page.locator('tr').evaluate_all("""
                  trs => trs.map((tr, i) => ({
                    i,
                    text: (tr.innerText || '').trim(),
                    links: Array.from(tr.querySelectorAll('a')).map(a => ({text:(a.innerText||'').trim(), href:a.href}))
                  })).filter(x => x.text)
                  """)
              except Exception as exc:
                  rows = []
                  print('ROWS_ERROR', repr(exc))
              relevant_rows = [r for r in rows if any(k in (r.get('text') or '') for k in ['力星股份', '陶瓷球', '滚动体', '轴承', '机器人', '800V'])]
              print('RELEVANT_ROWS', json.dumps(relevant_rows[:300], ensure_ascii=False))

              try:
                  links = await page.locator('a').evaluate_all("""
                  els => els.map(a => ({text:(a.innerText||'').trim(), href:a.href})).filter(x => x.href)
                  """)
              except Exception:
                  links = []
              relevant_links = []
              for item in links:
                  blob = (item.get('text','') + ' ' + item.get('href','')).lower()
                  if any(k in blob for k in ['力星股份', '300421', 'report/info', 'infocode', 'rptid', '.pdf', '陶瓷球', '滚动体']):
                      relevant_links.append(item)
              print('RELEVANT_LINKS', json.dumps(relevant_links[:500], ensure_ascii=False))

              try:
                  html = await page.content()
              except Exception:
                  html = ''
              for pattern in [
                  r'AP\d{18}',
                  r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                  r'infoCode.{0,500}',
                  r'report/list.{0,1000}',
                  r'300421.{0,1000}',
                  r'精密滚动体.{0,1000}',
              ]:
                  found = re.findall(pattern, html, flags=re.I|re.S)
                  print('HTML_PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:100])

              await page.wait_for_timeout(3000)
              print('REQUESTS', json.dumps(requests, ensure_ascii=False))
              print('CAPTURES')
              for item in captures:
                  if item.get('body'):
                      print(json.dumps(item, ensure_ascii=False))
                  else:
                      print(json.dumps(item, ensure_ascii=False))
              await page.close()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox'])
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                      locale='zh-CN',
                      viewport={'width': 1440, 'height': 1000},
                  )
                  for url in START_URLS:
                      await inspect(context, url)
                  await browser.close()

          asyncio.run(main())
          PY
