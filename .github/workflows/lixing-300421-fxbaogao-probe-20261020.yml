name: Probe Lixing public report sources 20261020

on:
  push:
    branches:
      - tmp/lixing-300421-broker-reports-20261020
    paths:
      - .github/workflows/lixing-300421-fxbaogao-probe-20261020.yml

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect public report pages and image sources
        shell: bash
        run: |
          python - <<'PY'
          import re
          import requests
          from urllib.parse import quote

          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})

          details = [
              ('4772943','2025','04','08'),
              ('3886525','2023','09','02'),
          ]
          for rid,y,m,d in details:
              url=f'https://www.fxbaogao.com/detail/{rid}'
              r=s.get(url,timeout=45)
              print('\nDETAIL',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              text=r.text
              print(text[:500].replace('\n',' '))
              pats = sorted(set(re.findall(r'https?://[^\"\'<>\\s]+|/[^\"\'<>\\s]*(?:pdf|report-image|api|view)[^\"\'<>\\s]*', text, flags=re.I)))
              for p in pats[:200]:
                  print('REF',p[:500])
              for n in range(1, 55):
                  img=f'https://public.fxbaogao.com/report-image/{y}/{m}/{d}/{rid}-{n}.png'
                  rr=s.get(img,timeout=30,allow_redirects=True)
                  ok = rr.status_code==200 and rr.headers.get('content-type','').startswith('image/') and len(rr.content)>1000
                  print('IMG',rid,n,rr.status_code,len(rr.content),rr.headers.get('content-type'),rr.url,'OK' if ok else '')
                  if n>2 and not ok:
                      break

          queries = ['力星股份','800V架构逐步成为电车主流方案，陶瓷球迎来新机遇']
          templates = [
              'https://www.fxbaogao.com/search?keywords={}',
              'https://www.fxbaogao.com/search?keyword={}',
              'https://www.fxbaogao.com/search?q={}',
              'https://www.fxbaogao.com/s?wd={}',
          ]
          for q in queries:
              for tpl in templates:
                  url=tpl.format(quote(q))
                  try:
                      r=s.get(url,timeout=30,allow_redirects=True)
                      ids=sorted(set(re.findall(r'/detail/(\d+)',r.text)))
                      print('SEARCH',q,url,r.status_code,len(r.content),r.url,'IDS',ids[:50])
                  except Exception as e:
                      print('SEARCHERR',url,repr(e))
          PY
