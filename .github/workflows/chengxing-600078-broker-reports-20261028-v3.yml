name: Recover Chengxing Anxin report pages

on:
  push:
    paths:
      - '.github/workflows/chengxing-600078-broker-reports-20261028-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow pypdf
      - name: Recover sequential report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          root=Path('chengxing_v3'); pages=root/'pages'; out=root/'reports'
          pages.mkdir(parents=True,exist_ok=True); out.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':'https://www.fxbaogao.com/detail/1492879','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'})
          found=[]; misses=0; status=[]
          for n in range(1,81):
              url=f'https://public.fxbaogao.com/report-image/2014/10/15/1492879-{n}.png?x-oss-process=image/format,webp'
              try:
                  r=s.get(url,timeout=45,allow_redirects=True)
                  ctype=(r.headers.get('content-type') or '').lower()
                  entry={'page':n,'status':r.status_code,'bytes':len(r.content),'content_type':ctype,'url':r.url}
                  try:
                      im=Image.open(io.BytesIO(r.content)); im.load()
                      entry.update({'width':im.width,'height':im.height,'format':im.format})
                      if r.status_code==200 and im.width>=800 and im.height>=900:
                          p=pages/f'{n:03d}.jpg'; im.convert('RGB').save(p,quality=96,subsampling=0)
                          found.append(p); misses=0; print('PAGE',n,'OK',im.size,len(r.content),flush=True)
                      else:
                          misses+=1; print('PAGE',n,'REJECT',entry,flush=True)
                  except Exception as exc:
                      entry['image_error']=str(exc); misses+=1; print('PAGE',n,'NOIMAGE',entry,flush=True)
                  status.append(entry)
              except Exception as exc:
                  misses+=1; status.append({'page':n,'error':str(exc)}); print('PAGE',n,'ERROR',exc,flush=True)
              if n>=3 and misses>=3:
                  break
          (root/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          if len(found)<3:
              print(json.dumps({'complete':False,'pages':len(found)},ensure_ascii=False))
          else:
              # Require contiguous sequence from page 1.
              nums=[int(p.stem) for p in found]
              contiguous=(nums==list(range(1,max(nums)+1)))
              imgs=[Image.open(p).convert('RGB') for p in found]
              pdf=out/'03_安信证券_2014-10-15_国内磷酸龙头矿电磷一体化成本优势显著_公开页面重建版.pdf'
              imgs[0].save(pdf,format='PDF',save_all=True,append_images=imgs[1:],resolution=150.0)
              reader=PdfReader(str(pdf),strict=False)
              meta={'complete_sequence':contiguous,'page_count':len(reader.pages),'found_pages':nums,'sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),'bytes':pdf.stat().st_size}
              (root/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chengxing-600078-anxin-pages-v3
          path: chengxing_v3/
          retention-days: 7
          if-no-files-found: error
