name: Package verified Hengbo 301225 broker research reports

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-broker-reports-final-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate select and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '恒勃股份'
          FULL_NAME = '恒勃控股股份有限公司'
          CODE = '301225'
          AS_OF = '2026-10-28'

          CANDIDATES = [
              {
                  'info_code':'AP202511241787234946',
                  'broker':'华鑫证券',
                  'title':'公司动态研究报告：汽摩进气系统领军企业，积极开拓成长新曲线',
                  'publish_date':'2025-11-24',
                  'author':['林子健'],
                  'rating':'买入',
                  'priority':1000,
              },
              {
                  'info_code':'AP202305311587369843',
                  'broker':'华金证券',
                  'title':'新股覆盖研究：恒勃股份',
                  'publish_date':'2023-05-31',
                  'author':['李蕙'],
                  'rating':'未标注',
                  'priority':700,
              },
              {
                  'info_code':'AP202306181591195774',
                  'broker':'华金证券',
                  'title':'“空气滤清器”龙头，多元化拓展可期',
                  'publish_date':'2023-06-18',
                  'author':['李蕙'],
                  'rating':'未标注',
                  'priority':680,
              },
              {
                  'info_code':'AP202507291719344452',
                  'broker':'华鑫证券',
                  'title':'业绩符合预期，差异化产品放量可期',
                  'publish_date':'2025-07-30',
                  'author':[],
                  'rating':'买入',
                  'priority':350,
              },
              {
                  'info_code':'AP202403041625131817',
                  'broker':'华金证券',
                  'title':'2023年报点评：营收稳中有升，利润表现亮眼',
                  'publish_date':'2024-03-04',
                  'author':['李蕙'],
                  'rating':'未标注',
                  'priority':300,
              },
          ]

          downloads = Path('downloads')
          verify = Path('verify')
          output = Path('artifact_out')
          for directory in (downloads, verify, output):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=7, connect=7, read=7, status=7,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(info_code: str, target: Path) -> str:
              variants = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              last = None
              for url in variants:
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              headers={'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},
                              timeout=(30, 360), allow_redirects=True,
                          )
                          last = {'url':url,'status':response.status_code,'bytes':len(response.content)}
                          print('DOWNLOAD', info_code, response.status_code, len(response.content), url, flush=True)
                          if response.status_code == 200 and response.content.startswith(b'%PDF') and len(response.content) > 70_000:
                              target.write_bytes(response.content)
                              return url
                      except Exception as exc:
                          last = {'url':url,'error':repr(exc)}
                          print('DOWNLOAD_ERROR', info_code, url, repr(exc), flush=True)
                      time.sleep(1 + attempt)
              raise RuntimeError(f'Unable to download {info_code}: {last}')

          valid = []
          seen_hashes = set()
          for spec in CANDIDATES:
              info_code = spec['info_code']
              raw_path = downloads / f'{info_code}.pdf'
              try:
                  source_url = download_pdf(info_code, raw_path)
                  reader = PdfReader(str(raw_path), strict=False)
                  pages = len(reader.pages)
                  if pages < 7:
                      raise RuntimeError(f'Too few pages: {pages}')

                  indices = list(range(min(24, pages)))
                  if pages > 26:
                      indices += list(range(max(0, pages - 2), pages))
                  text_parts = []
                  for page_index in dict.fromkeys(indices):
                      try:
                          text_parts.append(reader.pages[page_index].extract_text() or '')
                      except Exception:
                          pass
                  compact = re.sub(r'\s+', '', '\n'.join(text_parts))
                  identity_ok = COMPANY in compact or FULL_NAME in compact or CODE in compact
                  research_ok = any(term in compact for term in (
                      '证券研究报告','公司研究报告','新股覆盖研究','公司动态研究报告',
                      '投资评级','分析师','研究报告'
                  ))
                  if not identity_ok or not research_ok:
                      raise RuntimeError(f'Identity/research check failed: identity={identity_ok}, research={research_ok}')

                  check = subprocess.run(
                      ['qpdf','--warning-exit-0','--check',str(raw_path)],
                      capture_output=True, text=True,
                  )
                  if check.returncode != 0:
                      raise RuntimeError(f'qpdf failed: {check.stdout[-800:]}')

                  for page_number, suffix in ((1,'first'),(pages,'last')):
                      prefix = verify / f'{info_code}_{suffix}'
                      render = subprocess.run(
                          ['pdftoppm','-f',str(page_number),'-l',str(page_number),'-singlefile','-png','-r','90',str(raw_path),str(prefix)],
                          capture_output=True, text=True,
                      )
                      image = Path(str(prefix)+'.png')
                      if render.returncode != 0 or not image.exists() or image.stat().st_size < 5000:
                          raise RuntimeError(f'Page rendering failed at page {page_number}')

                  data = raw_path.read_bytes()
                  sha256 = hashlib.sha256(data).hexdigest()
                  if sha256 in seen_hashes:
                      raise RuntimeError('Duplicate PDF hash')
                  seen_hashes.add(sha256)

                  score = spec['priority'] + min(pages, 80) * 15
                  valid.append({
                      **spec,
                      'actual_pages':pages,
                      'bytes':len(data),
                      'sha256':sha256,
                      'source_url':source_url,
                      'file':str(raw_path),
                      'score':score,
                      'identity_text_check':identity_ok,
                      'research_document_check':research_ok,
                  })
                  print('VALID', json.dumps({k:valid[-1][k] for k in ('broker','title','publish_date','actual_pages','score')},ensure_ascii=False),flush=True)
              except Exception as exc:
                  print('REJECT', info_code, spec['title'], repr(exc), flush=True)
                  raw_path.unlink(missing_ok=True)

          if len(valid) < 2:
              raise RuntimeError(f'Only {len(valid)} reports passed validation')

          valid.sort(key=lambda item:(item['score'],item['actual_pages'],item['publish_date']),reverse=True)
          selected = valid[:3]
          selected.sort(key=lambda item:item['publish_date'],reverse=True)
          count = len(selected)

          package_cn = f'恒勃股份_301225.SZ_券商公司研究报告_{count}份'
          package_en = f'Hengbo_301225_Broker_Company_Research_{count}_Reports'
          root = Path(package_cn)
          root.mkdir(parents=True,exist_ok=True)

          def safe_name(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+','_',str(text)).strip(' ._')[:105]

          manifest = []
          for index,item in enumerate(selected,start=1):
              filename = f'{index:02d}_{item["publish_date"]}_{safe_name(item["broker"])}_{safe_name(item["title"])}.pdf'
              shutil.copy2(item['file'],root/filename)
              record = {k:v for k,v in item.items() if k not in ('file','score','priority')}
              record['filename']=filename
              record['validation']=[
                  'PDF header','issuer identity','research-document identity','page count',
                  'qpdf structure','first-page render','last-page render','duplicate hash check'
              ]
              manifest.append(record)

          readme=[
              f'恒勃股份（301225.SZ）券商公司研究报告合集（{count}份）',
              f'整理日期：{AS_OF}',
              '',
              '说明：公开渠道可直接下载并核验的恒勃股份完整原始PDF篇幅整体较短。本包优先保留较长、研究内容较完整的公司研究/新股覆盖报告；未将会员页、预览页或网页摘要冒充原始PDF。',
              '',
              '文件清单：',
          ]
          for number,item in enumerate(manifest,start=1):
              authors=item.get('author') or []
              authors_text='、'.join(authors) if isinstance(authors,list) else str(authors)
              readme.extend([
                  f'{number}. {item["filename"]}',
                  f'   机构：{item["broker"]}',
                  f'   标题：{item["title"]}',
                  f'   日期：{item["publish_date"]}；实际页数：{item["actual_pages"]}',
                  f'   评级：{item.get("rating") or "未标注"}；分析师：{authors_text or "未标注"}',
                  f'   来源：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ])
          readme.append('核验项目：公司身份、研究报告属性、实际页数、PDF结构、首末页渲染、重复文件、SHA-256及ZIP CRC。')

          (root/'00_文件清单与范围说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),encoding='utf-8')

          cn_zip=output/f'{package_cn}.zip'
          with zipfile.ZipFile(cn_zip,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as archive:
              for path in sorted(root.iterdir()):
                  archive.write(path,arcname=f'{package_cn}/{path.name}')
          with zipfile.ZipFile(cn_zip,'r') as archive:
              bad=archive.testzip()
              pdf_count=sum(name.lower().endswith('.pdf') for name in archive.namelist())
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if pdf_count != count:
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count} vs {count}')

          en_zip=output/f'{package_en}.zip'
          shutil.copy2(cn_zip,en_zip)
          print('FINAL_COUNT',count,flush=True)
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',cn_zip,cn_zip.stat().st_size,hashlib.sha256(cn_zip.read_bytes()).hexdigest(),flush=True)
          print('BACKUP_ZIP',en_zip,en_zip.stat().st_size,hashlib.sha256(en_zip.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hengbo-301225-broker-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
