name: Search Kent pre-IPO report metadata 20261020

on:
  push:
    branches:
      - tmp/kent-title-search-20261020-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search report API by date and title
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          for qtype in ['0','1','2','3']:
              print('\n### QTYPE',qtype)
              for page in range(1,81):
                  params={
                    'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                    'beginTime':'2023-11-15','endTime':'2023-11-30','pageNo':str(page),'fields':'',
                    'qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
                  }
                  try:
                      r=s.get(api,params=params,timeout=(20,120)); d=r.json()
                      batch=d.get('data') or []
                      if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
                      if page==1: print('hits',d.get('hits'),'first_count',len(batch) if isinstance(batch,list) else 'bad')
                      if not isinstance(batch,list) or not batch: break
                      for x in batch:
                          blob=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode','orgSName','researcher'])
                          if any(k in blob for k in ['肯特股份','南京肯特','A17295','高性能工程塑料零部件领先企业']):
                              print('MATCH',json.dumps({k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','stockCode','stockName','researcher']},ensure_ascii=False,default=str))
                      if len(batch)<100: break
                      time.sleep(.1)
                  except Exception as e:
                      print('ERROR',qtype,page,repr(e)); break
          PY
