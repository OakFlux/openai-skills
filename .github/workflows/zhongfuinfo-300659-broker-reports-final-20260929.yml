name: Package Zhongfu Information 300659 public broker reports 20260929

on:
  push:
    paths:
      - '.github/workflows/zhongfuinfo-300659-broker-reports-final-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '中孚信息_300659_券商研究报告_2份_公开完整PDF'
          OUT = Path(PACKAGE)
          ART = Path('artifact_out')
          OUT.mkdir(exist_ok=True)
          ART.mkdir(exist_ok=True)

          reports = [
              {
                  'filename': '01_2021-09-14_开源证券_首次覆盖报告_从保密安全走向数字安全_长期成长路径逐渐清晰.pdf',
                  'broker': '开源证券',
                  'title': '公司首次覆盖报告：从“保密安全”走向“数字安全”，长期成长路径逐渐清晰',
                  'publish_date': '2021-09-14',
                  'report_type': '首次覆盖深度报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202109141516192301_1.pdf',
                  'expected_pages': 16,
              },
              {
                  'filename': '02_2022-04-08_西南证券_营收持续高增长_政策推动行业高景气.pdf',
                  'broker': '西南证券',
                  'title': '营收持续高增长，政策推动行业高景气',
                  'publish_date': '2022-04-08',
                  'report_type': '完整公司研究报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202204081557973891_1.pdf',
                  'expected_pages': 9,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/pdf,*/*',
          })

          def download(url: str, path: Path) -> str:
              last = None
              for attempt in range(1, 5):
                  temp = path.with_suffix('.pdf.part')
                  try:
                      with session.get(url, timeout=(30, 240), allow_redirects=True, stream=True) as response:
                          print('DOWNLOAD', attempt, response.status_code, url, 'FINAL', response.url, flush=True)
                          response.raise_for_status()
                          with temp.open('wb') as handle:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      handle.write(chunk)
                          final_url = str(response.url)
                      data = temp.read_bytes()
                      if len(data) < 100_000 or not data.startswith(b'%PDF-'):
                          raise RuntimeError('Response is not a valid PDF')
                      temp.replace(path)
                      return final_url
                  except Exception as exc:
                      last = exc
                      temp.unlink(missing_ok=True)
                      print('DOWNLOAD_ERR', attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'Download failed: {last!r}')

          manifest = []
          seen_hashes = set()
          for item in reports:
              path = OUT / item['filename']
              final_url = download(item['url'], path)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != item['expected_pages']:
                  raise RuntimeError(f'Unexpected page count for {path.name}: {pages} != {item["expected_pages"]}')

              sample_parts = []
              for index in range(min(pages, 12)):
                  try:
                      sample_parts.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              sample = '\n'.join(sample_parts)
              if '中孚信息' not in sample and '300659' not in sample:
                  raise RuntimeError(f'Company identity not verified in {path.name}')
              if item['broker'] not in sample:
                  raise RuntimeError(f'Broker identity not verified in {path.name}')
              if not any(marker in sample for marker in ['证券研究报告', '公司研究', '首次覆盖', '研究报告']):
                  raise RuntimeError(f'Research-report identity not verified in {path.name}')

              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {path.name}: {check.stderr[-1000:]}')

              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'Duplicate report: {path.name}')
              seen_hashes.add(digest)
              record = {
                  'filename': item['filename'],
                  'broker': item['broker'],
                  'title': item['title'],
                  'publish_date': item['publish_date'],
                  'report_type': item['report_type'],
                  'pages': pages,
                  'bytes': len(data),
                  'source_url': final_url,
                  'sha256': digest,
              }
              manifest.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '中孚信息（300659.SZ）券商研究报告合集',
              '整理日期：2026-09-29',
              '',
              '说明：公开渠道中可直接下载并完成全文核验的长篇公司研究数量有限。本包收录1份首次覆盖深度报告和1份完整公司研究报告；未使用需要登录、付费或积分解锁的预览文件。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(manifest, 1):
              readme += [
                  f'{index}. {record["filename"]}',
                  f'   类型：{record["report_type"]}',
                  f'   券商：{record["broker"]}',
                  f'   标题：{record["title"]}',
                  f'   发布日期：{record["publish_date"]}；页数：{record["pages"]}',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查PDF文件头、公司与券商身份、实际页数、qpdf结构、重复文件及SHA-256；最终ZIP已通过CRC测试。')

          (OUT / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in manifest),
              encoding='utf-8',
          )

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len(pdfs) != 2:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: zhongfuinfo-300659-broker-reports-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
