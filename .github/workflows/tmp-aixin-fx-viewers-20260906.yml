name: Temporary Aixin FxBaogao viewer inspection
on:
  push:
    branches:
      - tmp-aixin-fx-viewers-20260906
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Inspect viewers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          ids=['5605896','5472548','5601555','5252285','5248517','5248522']
          all_results={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              context=browser.new_context(viewport={'width':1440,'height':1200},locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
              for report_id in ids:
                  page=context.new_page()
                  records=[]
                  page.on('response',lambda response, records=records: records.append({'url':response.url,'status':response.status,'type':response.request.resource_type,'content_type':response.headers.get('content-type','')}))
                  url=f'https://www.fxbaogao.com/view?id={report_id}'
                  try:
                      response=page.goto(url,wait_until='domcontentloaded',timeout=120000)
                      page.wait_for_timeout(10000)
                      for _ in range(8):
                          page.mouse.wheel(0,1000)
                          page.wait_for_timeout(400)
                      title=page.title()
                      body=page.locator('body').inner_text(timeout=30000)
                      html=page.content()
                      images=page.locator('img').evaluate_all("els => els.map(e => ({src:e.currentSrc||e.src||'',alt:e.alt||'',width:e.naturalWidth||0,height:e.naturalHeight||0}))")
                      canvases=page.locator('canvas').count()
                      links=page.locator('a').evaluate_all("els => els.map(e => ({text:(e.innerText||e.textContent||'').trim().slice(0,200),href:e.href||'',title:e.title||''})).filter(x=>x.text||x.href)")
                      buttons=page.locator('button').evaluate_all("els => els.map(e => ({text:(e.innerText||e.textContent||'').trim().slice(0,200),title:e.title||'',aria:e.getAttribute('aria-label')||'',cls:e.className||''})).filter(x=>x.text||x.title||x.aria)")
                      Path(f'output/{report_id}.html').write_text(html,encoding='utf-8')
                      Path(f'output/{report_id}_body.txt').write_text(body,encoding='utf-8')
                      Path(f'output/{report_id}_responses.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
                      Path(f'output/{report_id}_images.json').write_text(json.dumps(images,ensure_ascii=False,indent=2),encoding='utf-8')
                      Path(f'output/{report_id}_links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
                      Path(f'output/{report_id}_buttons.json').write_text(json.dumps(buttons,ensure_ascii=False,indent=2),encoding='utf-8')
                      page.screenshot(path=f'output/{report_id}.png',full_page=True)
                      result={'status':response.status if response else None,'url':page.url,'title':title,'body_head':body[:2000],'images':images,'canvas_count':canvases,'links':links,'buttons':buttons,'responses':records}
                      all_results[report_id]=result
                      print('\nREPORT',report_id,'STATUS',result['status'],'TITLE',title,'URL',page.url,'IMAGES',len(images),'CANVAS',canvases,'RESP',len(records),flush=True)
                      print('BODY',body[:1000].replace('\n',' | '),flush=True)
                      for item in links+buttons:
                          text=' '.join(str(item.get(k,'') or '') for k in item)
                          if any(k in text.lower() for k in ['下载','原文','全文','pdf','报告','下一页','查看']):
                              print('CONTROL',json.dumps(item,ensure_ascii=False),flush=True)
                      for rec in records:
                          combined=(rec['url']+' '+rec['content_type']).lower()
                          if any(k in combined for k in ['pdf','document','report-image','image','download','file','oss','cdn','api']):
                              print('RESOURCE',json.dumps(rec,ensure_ascii=False),flush=True)
                  except Exception as exc:
                      all_results[report_id]={'error':repr(exc)}
                      print('ERROR',report_id,repr(exc),flush=True)
                  finally:
                      page.close()
              browser.close()
          Path('output/summary.json').write_text(json.dumps(all_results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: aixin-fxbaogao-viewers
          path: output/*
          retention-days: 1
          if-no-files-found: error
