name: Temporary Kaisheng Sdyanbao search inspection

on:
  push:
    branches:
      - tmp-kaisheng-sdysearch-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('out'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          detail='https://www.sdyanbao.com/detail/767990'
          h=s.get(detail,timeout=45); print('DETAIL',h.status_code,len(h.content),h.url); h.raise_for_status(); (out/'detail.html').write_text(h.text,encoding='utf-8')
          soup=BeautifulSoup(h.text,'html.parser')
          scripts=[]
          for t in soup.find_all('script',src=True):
              u=urljoin(h.url,t['src']); scripts.append(u)
          for i,u in enumerate(scripts):
              try:
                  r=s.get(u,timeout=60); print('JS',i,r.status_code,len(r.content),u); r.raise_for_status(); (out/f'chunk_{i}.js').write_bytes(r.content)
              except Exception as e: print('JSERR',u,repr(e))

          combined='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in out.glob('chunk_*.js'))
          patterns=[r'https?://[^"\'`\\ ]+', r'/(?:api|report|search|detail|download|user|stock|organization)[A-Za-z0-9_?&=./{}:-]*']
          vals=[]
          for pat in patterns:
              vals += re.findall(pat,combined,re.I)
          uniq=[]
          for v in vals:
              if v not in uniq and len(v)<400: uniq.append(v)
          (out/'strings.txt').write_text('\n'.join(uniq),encoding='utf-8')
          for v in uniq:
              if any(k in v.lower() for k in ['api','report','search','download']): print('STR',v[:350])

          variants=[
            'https://www.sdyanbao.com/report?keyword=%E5%87%AF%E7%9B%9B%E6%96%B0%E8%83%BD',
            'https://www.sdyanbao.com/report?keywords=%E5%87%AF%E7%9B%9B%E6%96%B0%E8%83%BD',
            'https://www.sdyanbao.com/report?search=%E5%87%AF%E7%9B%9B%E6%96%B0%E8%83%BD',
            'https://www.sdyanbao.com/report?q=%E5%87%AF%E7%9B%9B%E6%96%B0%E8%83%BD',
            'https://www.sdyanbao.com/report?word=%E5%87%AF%E7%9B%9B%E6%96%B0%E8%83%BD',
            'https://www.sdyanbao.com/report?keyword=%E6%B4%9B%E9%98%B3%E7%8E%BB%E7%92%83',
          ]
          for j,u in enumerate(variants):
              try:
                  r=s.get(u,timeout=45); print('SEARCHPAGE',j,r.status_code,len(r.content),r.url); (out/f'search_{j}.html').write_text(r.text,encoding='utf-8')
                  text=r.text
                  for needle in ['凯盛新能','洛阳玻璃','767990','reportList','page_url','original_id']:
                      print('HAS',j,needle,needle in text)
              except Exception as e: print('SEARCHERR',j,repr(e))
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-sdysearch
          path: out/*
          retention-days: 1
          if-no-files-found: error
