name: Probe fxbaogao view JS endpoints 20260927

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-view-js-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch selected JS and probe public PDF paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json,hashlib
          from pathlib import Path
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151','Referer':'https://www.fxbaogao.com/view?id=1422001','Accept':'*/*'})
          base='https://www.fxbaogao.com/view?id=1422001'
          urls=[
            'https://static.fxbaogao.com/pub/fxbaogao-seo/zz.pc.v3.6.js',
            'https://static.fxbaogao.com/pub/js/config/production.js',
            'https://www.fxbaogao.com/_fxbg/2609231203/js/runtime.f11d9ea2b47e9ef0acc0.js',
            'https://www.fxbaogao.com/_fxbg/2609231203/js/app-pages-fxbg-main-js.458bd8b379183bf9adab.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2609231203/js/vendors~app-pages-fxbg-main-js.321b18c37b6e48ca97b7.chunk.js',
            'https://m.fxbaogao.com/static/js/index.d5abb977.js',
          ]
          recs=[]
          for i,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=(20,180),allow_redirects=True)
              print('JS',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              p=Path(f'out/js_{i:02d}.js'); p.write_bytes(r.content)
              text=r.text
              hits=[]
              for term in ['mofoun','report','download','pdf','fileUrl','reportUrl','docId','report-image','original','oss','view?id','getPdf','getFile','preview','1422001']:
                for m in list(re.finditer(re.escape(term),text,re.I))[:80]:
                  sn=text[max(0,m.start()-250):min(len(text),m.end()+700)]
                  hits.append({'term':term,'snippet':sn})
              print('HITS',i,json.dumps(hits[:120],ensure_ascii=False)[:70000],flush=True)
              recs.append({'url':u,'status':r.status_code,'bytes':len(r.content),'hits':hits[:300]})
            except Exception as e:
              print('JS_ERR',u,repr(e),flush=True)
          Path('out/js_hits.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')

          # Probe common public object-storage PDF patterns without bypassing auth.
          candidates=[]
          roots=['https://public.fxbaogao.com','https://static.fxbaogao.com','https://file.fxbaogao.com']
          paths=[
            '/report/2019/08/31/1422001.pdf',
            '/report-pdf/2019/08/31/1422001.pdf',
            '/report-file/2019/08/31/1422001.pdf',
            '/report/1422001.pdf',
            '/pdf/1422001.pdf',
            '/file/1422001.pdf',
            '/report-file/1422001.pdf',
            '/uploads/report/2019/08/31/1422001.pdf',
            '/report-image/2019/08/31/1422001.pdf',
            '/report-image/2019/08/31/1422001-1.pdf',
          ]
          for root in roots:
            for path in paths:
              u=root+path
              try:
                r=s.get(u,timeout=(10,60),allow_redirects=True)
                ok=r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100000
                rec={'url':u,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'ok':ok,'final_url':r.url}
                candidates.append(rec); print('PDF_PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
                if ok:
                  Path(f'out/found_{hashlib.sha256(r.content).hexdigest()[:12]}.pdf').write_bytes(r.content)
              except Exception as e:
                candidates.append({'url':u,'error':repr(e),'ok':False})
          Path('out/pdf_probes.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-view-js-probe
          path: out
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
