name: Inspect Trina Solar prospectus and Q3

on:
  push:
    branches: [tmp-trina-solar-688599-reports-20261016]
    paths: ['.github/workflows/tmp-trina-solar-prospectus-q3-discovery-20261016.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          pages={
            'prospectus_index':'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688599.phtml',
            'q3':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/688599/page_type/sjdbg.phtml',
          }
          pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          for name,url in pages.items():
            print('\n===== '+name+' =====')
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            raw=urllib.request.urlopen(req,timeout=120).read()
            for enc in ('utf-8','gb18030','gbk'):
              try: text=raw.decode(enc); break
              except UnicodeDecodeError: pass
            else: text=raw.decode('utf-8',errors='replace')
            print('BYTES',len(raw),'FINAL',url)
            for m in pat.finditer(text):
              label=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
              label=re.sub(r'\s+','',label)
              href=urllib.parse.urljoin(url,html.unescape(m.group(1)))
              if label or '.pdf' in href.lower():
                if any(k in label for k in ('招股','说明书','发行','上市','季度报告','三季度','下载公告')) or '.pdf' in href.lower():
                  print(label,'\t',href)
            print('--- RAW CONTEXT ---')
            for line in text.splitlines():
              if any(k in line for k in ('招股说明书','三季度报告','.PDF','.pdf','下载公告')):
                print(re.sub(r'\s+',' ',line).strip()[:3000])
          PY
