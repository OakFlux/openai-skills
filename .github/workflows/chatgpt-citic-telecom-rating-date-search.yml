name: Search dated broker coverage for CITIC Telecom

on:
  push:
    branches:
      - chatgpt-citic-telecom-ratings-search-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Search dated broker reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/search.py <<'PY'
          from __future__ import annotations
          import base64, html, json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          queries=[
            '"中信国际电讯" "中信建投国际" 2018',
            '"中信国际电讯" "德意志银行" 2018',
            '"中信国际电讯" "星展唯高达" 2015',
            '"中信国际电讯" "汇丰银行" 2015',
            '"中信国际电讯" "野村国际" 2015',
            '"中信国际电讯" "信达国际" 2014',
            '"中信国际电讯" "银河国际" 2014',
            '"中信国际电讯" "东方证券香港" 2014',
            '"中信国际电讯" "富昌证券" 2013',
            '"中信国际电讯" "元大证券" 2012',
            '"中信国际电讯" "中信证券国际" 2011',
            '"CITIC Telecom" "DBS Vickers" 2015 report',
            '"CITIC Telecom" "BOCI" research report',
            '"CITIC Telecom" "Daiwa" research report',
            '"CITIC Telecom" "CIMB" research report',
            '"CITIC Telecom" "Deutsche Bank" report',
          ]
          engines={
            '360':'https://www.so.com/s?q={q}',
            'baidu':'https://www.baidu.com/s?wd={q}&rn=50',
            'bing':'https://www.bing.com/search?q={q}&count=50',
            'sogou':'https://www.sogou.com/web?query={q}&num=50',
          }
          def decode_bing(u):
            try:
              qs=urllib.parse.parse_qs(urllib.parse.urlparse(u).query); x=qs.get('u',[''])[0]
              if x.startswith('a1'):
                z=x[2:]+'='*((4-len(x[2:])%4)%4); return base64.urlsafe_b64decode(z).decode('utf-8','replace')
            except Exception: pass
          results=[]; candidates=[]
          for q in queries:
            for eng,tpl in engines.items():
              try:
                r=s.get(tpl.format(q=urllib.parse.quote(q)),timeout=(15,90),allow_redirects=True)
                soup=BeautifulSoup(r.text,'lxml'); found=[]
                for a in soup.find_all('a',href=True):
                  text=re.sub(r'\s+',' ',a.get_text(' ',strip=True)); raw=urllib.parse.urljoin(r.url,html.unescape(a['href']))
                  target=decode_bing(raw) if eng=='bing' else raw
                  target=target or raw
                  blob=(text+' '+target).lower()
                  if any(k in blob for k in ['中信国际电讯','中信國際電訊','citic telecom','1883.hk','01883','1883_hk']):
                    item={'query':q,'engine':eng,'text':text[:500],'url':target,'raw':raw}
                    found.append(item); candidates.append(item)
                rec={'query':q,'engine':eng,'status':r.status_code,'bytes':len(r.content),'found':found}
                results.append(rec)
                print('\nSEARCH',eng,repr(q),'hits=',len(found),flush=True)
                for x in found: print('HIT',json.dumps(x,ensure_ascii=False),flush=True)
              except Exception as e: results.append({'query':q,'engine':eng,'error':repr(e)}); print('FAIL',eng,repr(q),repr(e),flush=True)
              time.sleep(.1)
          unique=[]; seen=set()
          for x in candidates:
            u=x['url']; key=u.split('#')[0]
            if key in seen: continue
            seen.add(key); unique.append(x)
          resolved=[]
          for x in unique[:400]:
            u=x['url']
            if not u.startswith('http'): continue
            try:
              host=urllib.parse.urlparse(u).netloc.lower()
              if host in {'www.baidu.com','www.bing.com','www.so.com','www.sogou.com','chat.baidu.com'}: continue
              r=s.get(u,timeout=(12,60),allow_redirects=True)
              soup=BeautifulSoup(r.text,'lxml') if 'html' in (r.headers.get('content-type') or '').lower() else None
              rec={**x,'status':r.status_code,'final_url':r.url,'ctype':r.headers.get('content-type'),'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup and soup.title else None}
              if soup:
                rec['text']=re.sub(r'\s+',' ',soup.get_text(' ',strip=True))[:5000]
                rec['links']=[]
                for tag in soup.find_all(['a','iframe','embed','object','img','script']):
                  for attr in ('href','src','data','data-url'):
                    v=tag.get(attr)
                    if v and any(k in str(v).lower() for k in ['pdf','download','report','detail','view','doc']): rec['links'].append(urllib.parse.urljoin(r.url,v))
                rec['links']=list(dict.fromkeys(rec['links']))[:100]
              resolved.append(rec); print('\nRESOLVED',json.dumps(rec,ensure_ascii=False)[:20000],flush=True)
            except Exception as e: resolved.append({**x,'error':repr(e)}); print('RESOLVE_FAIL',u,repr(e),flush=True)
          Path('out/results.json').write_text(json.dumps({'search':results,'resolved':resolved},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/search.py
      - uses: actions/upload-artifact@v4
        with:
          name: citic-telecom-rating-date-search
          path: out/
          retention-days: 3
          if-no-files-found: error
