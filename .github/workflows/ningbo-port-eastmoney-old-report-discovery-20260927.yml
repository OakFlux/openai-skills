name: Discover Ningbo Port old Eastmoney report PDFs 20260927

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-eastmoney-old-report-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect pages scripts and candidate endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          IDS = ['560941685719','621134643935','353672532937','348910379234','337787979781']
          out=Path('discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36',
              'Accept':'text/html,application/xhtml+xml,application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer':'https://emwap.eastmoney.com/',
          })

          def fetch(url, tag, binary=False):
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  print('FETCH',tag,r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
                  ext='.bin' if binary else '.txt'
                  name=re.sub(r'[^A-Za-z0-9_.-]+','_',tag)[:100]+ext
                  (out/name).write_bytes(r.content)
                  return r
              except Exception as e:
                  print('FETCH_ERR',tag,url,repr(e),flush=True); return None

          all_records=[]
          script_urls=set()
          candidate_urls=set()
          for rid in IDS:
              urls=[
                  f'https://emwap.eastmoney.com/report/detail/{rid}',
                  f'https://emwap.eastmoney.com/report/detail/{rid}/',
                  f'https://data.eastmoney.com/report/info/{rid}.html',
                  f'https://data.eastmoney.com/report/info/{rid}',
              ]
              for i,u in enumerate(urls):
                  r=fetch(u,f'{rid}_page_{i}')
                  if not r or r.status_code!=200: continue
                  text=r.text
                  (out/f'{rid}_page_{i}.html').write_text(text,encoding='utf-8')
                  soup=BeautifulSoup(text,'lxml')
                  title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  scripts=[]
                  for tag in soup.find_all(['script','link','a'],href=True):
                      pass
                  for tag in soup.find_all('script',src=True):
                      su=urllib.parse.urljoin(r.url,tag['src']); scripts.append(su); script_urls.add(su)
                  for tag in soup.find_all('link',href=True):
                      hu=urllib.parse.urljoin(r.url,tag['href'])
                      if hu.lower().endswith('.js') or 'javascript' in str(tag.get('type','')).lower(): script_urls.add(hu)
                  for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                      cu=m.group(0).replace('\\/','/')
                      if any(k in cu.lower() for k in ('pdf','report','api','download','attach','info')):
                          candidate_urls.add(cu.rstrip(');,]'))
                  for m in re.finditer(r'[^"\']{0,100}(?:pdf|download|reportapi|attach|infoCode|reportId|rptid)[^"\']{0,250}',text,re.I):
                      print('HTML_SNIP',rid,m.group(0)[:400].replace('\n',' '),flush=True)
                  rec={'rid':rid,'url':r.url,'status':r.status_code,'bytes':len(r.content),'title':title,'scripts':scripts,'text':soup.get_text(' ',strip=True)[:5000]}
                  all_records.append(rec)
                  print('PAGE_REC',json.dumps(rec,ensure_ascii=False)[:8000],flush=True)

          script_records=[]
          for idx,u in enumerate(sorted(script_urls),1):
              r=fetch(u,f'script_{idx:03d}')
              if not r or r.status_code!=200: continue
              text=r.text
              (out/f'script_{idx:03d}.js').write_text(text,encoding='utf-8')
              hits=[]
              for pat in [r'https?://[^\s"\'<>]+',r'/[A-Za-z0-9_?&=./${}:-]{5,220}']:
                  for m in re.finditer(pat,text):
                      x=m.group(0).replace('\\/','/')
                      if any(k in x.lower() for k in ('report','pdf','download','attach','research','infocode','rptid')):
                          hits.append(x[:500])
                          candidate_urls.add(urllib.parse.urljoin(u,x).rstrip(');,]'))
              hits=list(dict.fromkeys(hits))[:300]
              script_records.append({'url':u,'bytes':len(r.content),'hits':hits})
              print('SCRIPT_HITS',u,json.dumps(hits[:120],ensure_ascii=False),flush=True)

          # Probe common old/mobile APIs for each report id.
          templates=[
              'https://reportapi.eastmoney.com/report/detail?reportId={id}',
              'https://reportapi.eastmoney.com/report/detail?infoCode={id}',
              'https://reportapi.eastmoney.com/report/get?reportId={id}',
              'https://reportapi.eastmoney.com/report/get?infoCode={id}',
              'https://emdcadvise.eastmoney.com/api/report/detail?id={id}',
              'https://emwap.eastmoney.com/api/report/detail/{id}',
              'https://emwap.eastmoney.com/api/report/detail?id={id}',
              'https://emwap.eastmoney.com/report/api/detail/{id}',
              'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_REPORT_DETAIL&columns=ALL&filter=(REPORT_ID%3D%22{id}%22)',
              'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_REPORT_LIST&columns=ALL&filter=(REPORT_ID%3D%22{id}%22)',
          ]
          probes=[]
          for rid in IDS:
              for j,t in enumerate(templates):
                  u=t.format(id=rid)
                  r=fetch(u,f'probe_{rid}_{j:02d}')
                  if not r: continue
                  txt=r.text[:10000]
                  probes.append({'rid':rid,'url':u,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'sample':txt[:3000]})
                  if any(k in txt.lower() for k in ('pdf','infocode','attach','reportname','title')):
                      print('PROBE_INTERESTING',rid,u,txt[:6000].replace('\n',' '),flush=True)

          (out/'pages.json').write_text(json.dumps(all_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'scripts.json').write_text(json.dumps(script_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'candidate_urls.txt').write_text('\n'.join(sorted(candidate_urls)),encoding='utf-8')
          PY

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-eastmoney-old-report-discovery
          path: discovery
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
