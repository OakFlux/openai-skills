name: Temporary Inspect Sina Jiuding Download Parameters

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect hidden report download links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import requests

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36'})
          ids = ['501060940103','297328985296','251560912796','250333086187','250252887640']
          for rptid in ids:
              url = f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rptid}/index.phtml'
              r = session.get(url, timeout=60)
              r.raise_for_status()
              raw = r.content
              text = None
              for enc in ('gb18030','gbk','utf-8'):
                  try:
                      text = raw.decode(enc); break
                  except UnicodeDecodeError: pass
              text = html.unescape(text or raw.decode('utf-8',errors='ignore')).replace('\\/','/')
              print('\n===', rptid, '===')
              for needle in ['vIR_RatingDown','RatingDown','download','rptid','pdf','PDF','doc','DOC']:
                  starts = [m.start() for m in re.finditer(needle, text, flags=re.I)]
                  print('NEEDLE', needle, 'COUNT', len(starts))
                  for pos in starts[:8]:
                      print('SNIP', re.sub(r'\s+',' ',text[max(0,pos-400):pos+700]))
              # Print all forms and anchor tags containing down/rating.
              for m in re.finditer(r'<(?:a|form)\b[^>]*(?:down|rating)[^>]*>', text, flags=re.I):
                  print('TAG', re.sub(r'\s+',' ',m.group(0)))
          PY
