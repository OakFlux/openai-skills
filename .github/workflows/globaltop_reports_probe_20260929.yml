name: Global Top Brokerage Reports Probe

on:
  push:
    branches:
      - chatgpt-globaltop-reports-20260929
    paths:
      - .github/workflows/globaltop_reports_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Probe research report databases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time
          from urllib.parse import urlencode, urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def show(url, **kwargs):
            try:
              r=s.get(url,timeout=60,allow_redirects=True,**kwargs)
              print('\n===',url,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'),'===')
              print(r.text[:20000])
              return r
            except Exception as e:
              print('\nERROR',url,repr(e)); return None

          params={
            'pageSize':'100','pageNo':'1','qType':'0','code':'002640',
            'beginTime':'2010-01-01','endTime':'2026-09-29','fields':'',
            'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'',
          }
          api='https://reportapi.eastmoney.com/report/list?'+urlencode(params)
          r=show(api,headers={'Referer':'https://data.eastmoney.com/report/002640.html'})
          if r:
            try:
              obj=r.json()
              print('EASTMONEY_JSON',json.dumps(obj,ensure_ascii=False,indent=2)[:100000])
            except Exception as e: print('EASTMONEY_JSON_ERR',repr(e))

          # Company report listing pages and F10 research pages.
          pages=[
            'https://data.eastmoney.com/report/002640.html',
            'https://basic.10jqka.com.cn/002640/worth.html',
            'https://stockpage.10jqka.com.cn/002640/#research',
            'https://www.nxny.com/report/search?q=%E8%B7%A8%E5%A2%83%E9%80%9A',
            'https://www.fxbaogao.com/search?keywords=%E8%B7%A8%E5%A2%83%E9%80%9A',
            'https://www.sgpjbg.com/search?q=%E8%B7%A8%E5%A2%83%E9%80%9A',
            'https://www.yanbaoke.com/search?keyword=%E8%B7%A8%E5%A2%83%E9%80%9A',
          ]
          for url in pages:
            r=show(url)
            if not r: continue
            soup=BeautifulSoup(r.text,'html.parser')
            hits=[]
            for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              blob=text+' '+href
              if any(k in blob for k in ['跨境通','002640','公司深度','首次覆盖','深度报告']):
                hits.append({'text':text,'href':href})
            print('LINK_HITS',json.dumps(hits[:200],ensure_ascii=False,indent=2))
            pdfs=sorted(set(re.findall(r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r.text,re.I)))
            print('PDF_URLS',json.dumps(pdfs[:200],ensure_ascii=False,indent=2))

          # Bing HTML queries can surface old report titles and direct PDFs.
          queries=[
            '跨境通 002640 公司深度 券商 研报 PDF',
            '跨境通 首次覆盖 证券研究报告',
            '跨境通 002640 深度研究 报告 券商',
            'site:pdf.dfcfw.com 跨境通 002640',
          ]
          for q in queries:
            url='https://www.bing.com/search?'+urlencode({'q':q,'count':'50','setlang':'zh-hans'})
            r=show(url)
            if not r: continue
            soup=BeautifulSoup(r.text,'html.parser')
            rows=[]
            for li in soup.select('li.b_algo'):
              a=li.find('a',href=True)
              if not a: continue
              title=' '.join(a.get_text(' ',strip=True).split())
              snippet=' '.join(li.get_text(' ',strip=True).split())[:1000]
              rows.append({'title':title,'href':a['href'],'snippet':snippet})
            print('BING_RESULTS',q,json.dumps(rows,ensure_ascii=False,indent=2)[:50000])
          PY
