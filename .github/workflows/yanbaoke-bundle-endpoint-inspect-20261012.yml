name: Inspect Yanbaoke download bundle endpoints 20261012

on:
  push:
    paths:
      - '.github/workflows/yanbaoke-bundle-endpoint-inspect-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Fetch exact Nuxt bundles and print download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json
          base='https://pc.yanbaoke.cn/_nuxt/'
          files=['7dQU-PHG.js','CKPQz2V3.js','CzVpEmEQ.js','BMLNknyN.js','D_BJhXZl.js','B-4fmDFb.js','BOlOmbaY.js','janY2Cbp.js','BehF-KBf.js','D6O-xWFi.js']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://pc.yanbaoke.cn/info/hE6AtQEFRHTDLPWmNBfqzX','Accept':'*/*'})
          for name in files:
            try:
              r=s.get(base+name,timeout=(15,60)); text=r.text
              print('FILE',name,r.status_code,len(r.content),flush=True)
              hits=[]
              patterns=[r'https?://[^\s"\'<>]+',r'/(?:api|download|info|read|pay|user|file)[A-Za-z0-9_?&=./:${}%-]{1,300}',r'[A-Za-z0-9_./-]{0,100}(?:download|pdf|docx?|pptx?|fileUrl|downloadUrl|download_url|download_file|downloadPdf|downloadFile|useDownload|downloadArticle|articleDownload)[A-Za-z0-9_?&=./:${}%-]{0,250}']
              for pat in patterns:
                for m in re.finditer(pat,text,re.I):
                  x=m.group(0)
                  if any(k in x.lower() for k in ('download','pdf','doc','ppt','file','api','read','pay')):
                    hits.append(x[:800])
              for token in ('download','pdf','doc','ppt','article','fileUrl','useDownload','/api/'):
                for m in list(re.finditer(token,text,re.I))[:120]:
                  hits.append(text[max(0,m.start()-350):min(len(text),m.end()+750)])
              hits=list(dict.fromkeys(hits))
              if hits: print('HITS',name,json.dumps(hits[:500],ensure_ascii=False),flush=True)
            except Exception as e: print('ERR',name,repr(e),flush=True)
          PY
