name: Build Ningbo Port 601018 broker deep report package 20260927

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-601018-broker-deep-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '601018'
          COMPANY = '宁波港'
          WORK = Path('ningbo_port_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL_ROOT = WORK / 'final'
          ART = Path('artifact_out')
          for p in (DOWNLOADS, FINAL_ROOT, ART):
              p.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,application/pdf,*/*;q=0.01',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:100]

          def query_page(page: int) -> list[dict]:
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2010-01-01', 'endTime': '2026-09-27',
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'code': CODE, 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              last = None
              for attempt in range(1, 5):
                  try:
                      r = session.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=(20, 120))
                      print('API', attempt, r.status_code, len(r.content), r.url, flush=True)
                      r.raise_for_status()
                      return r.json().get('data') or []
                  except Exception as exc:
                      last = exc
                      print('API_ERR', attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'API failed: {last!r}')

          rows = []
          for page in range(1, 8):
              batch = query_page(page)
              rows.extend(batch)
              if len(batch) < 100:
                  break

          uniq = {}
          for row in rows:
              blob = json.dumps(row, ensure_ascii=False)
              if CODE not in blob and COMPANY not in blob and '宁波舟山港' not in blob:
                  continue
              key = str(row.get('infoCode') or row.get('id') or blob)
              uniq[key] = row
          metadata = list(uniq.values())
          metadata.sort(key=lambda x: str(x.get('publishDate') or ''), reverse=True)
          (WORK / 'all_metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          print('METADATA_COUNT', len(metadata), flush=True)
          for row in metadata:
              print('META', json.dumps({k: row.get(k) for k in ('infoCode','title','orgSName','publishDate','stockName','stockCode','attachPages')}, ensure_ascii=False), flush=True)

          deep_terms = [
              '深度', '首次覆盖', '公司深度', '投资价值', '价值重估', '港口龙头',
              '世界一流', '强港', '枢纽港', '港口整合', '资源整合', '资产注入',
              '宁波舟山港', '一带一路', '海铁联运', '长三角', '高股息', '核心港口',
              '国际航运中心', '港口一体化', '吞吐量', '集装箱', '码头运营'
          ]
          shallow_terms = ['点评', '季报', '年报点评', '中报点评', '业绩快报', '简评', '月报', '半年报点评', '三季报']

          def meta_score(row: dict) -> tuple:
              title = str(row.get('title') or '')
              pages = int(row.get('attachPages') or 0)
              score = sum(5 for term in deep_terms if term in title)
              if '深度' in title:
                  score += 45
              if '首次覆盖' in title:
                  score += 40
              if '公司深度' in title:
                  score += 25
              score -= sum(10 for term in shallow_terms if term in title)
              if pages >= 40:
                  score += 35
              elif pages >= 30:
                  score += 28
              elif pages >= 20:
                  score += 20
              elif pages >= 15:
                  score += 14
              elif pages >= 10:
                  score += 8
              year = int(str(row.get('publishDate') or '0')[:4] or 0)
              recent = max(0, min(10, year - 2016))
              return (score + recent, pages, str(row.get('publishDate') or ''))

          candidates = sorted(metadata, key=meta_score, reverse=True)[:120]

          def download_pdf(info_code: str, target: Path) -> str:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              errors = []
              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          r = session.get(url, timeout=(25, 180), allow_redirects=True)
                          print('PDF', info_code, attempt, r.status_code, len(r.content), url, 'FINAL', r.url, flush=True)
                          if r.status_code == 200 and len(r.content) > 100_000 and r.content.startswith(b'%PDF-'):
                              target.write_bytes(r.content)
                              return str(r.url)
                      except Exception as exc:
                          errors.append(repr(exc))
                      time.sleep(attempt)
              raise RuntimeError('; '.join(errors) or 'no valid PDF variant')

          valid = []
          seen_sha = set()
          for row in candidates:
              info = str(row.get('infoCode') or '')
              if not info:
                  continue
              title = str(row.get('title') or '').strip() or info
              broker = str(row.get('orgSName') or row.get('orgName') or '未知券商').strip()
              date = str(row.get('publishDate') or '')[:10]
              target = DOWNLOADS / f'{info}.pdf'
              try:
                  source_url = download_pdf(info, target)
                  reader = PdfReader(str(target), strict=False)
                  pages = len(reader.pages)
                  parts = []
                  indices = list(range(min(16, pages)))
                  if pages > 18:
                      indices += list(range(max(0, pages - 4), pages))
                  for idx in dict.fromkeys(indices):
                      try:
                          parts.append(reader.pages[idx].extract_text() or '')
                      except Exception:
                          pass
                  sample = '\n'.join(parts)
                  low = sample.lower()
                  identity = (
                      COMPANY in sample or CODE in sample or '宁波舟山港股份' in sample or
                      'ningbo zhoushan port' in low or 'ningbo port' in low
                  )
                  title_deep = any(term in title for term in ['深度', '首次覆盖', '公司研究报告', '投资价值', '价值重估', '港口龙头', '枢纽港', '资源整合'])
                  research = any(term in sample for term in ['证券研究报告', '公司研究', '深度研究', '首次覆盖', '行业研究']) or 'equity research' in low or title_deep
                  if not identity or not research or pages < 10:
                      print('REJECT', info, title, pages, identity, research, flush=True)
                      target.unlink(missing_ok=True)
                      continue
                  q = subprocess.run(['qpdf', '--check', str(target)], capture_output=True, text=True)
                  if q.returncode not in (0, 3):
                      raise RuntimeError('qpdf check failed: ' + q.stderr[-1000:])
                  data = target.read_bytes()
                  sha = hashlib.sha256(data).hexdigest()
                  if sha in seen_sha:
                      target.unlink(missing_ok=True)
                      continue
                  seen_sha.add(sha)
                  keyword_score = sum(6 for term in deep_terms if term in title)
                  if '深度' in title:
                      keyword_score += 50
                  if '首次覆盖' in title:
                      keyword_score += 45
                  keyword_score -= sum(10 for term in shallow_terms if term in title)
                  page_score = 28 if pages >= 45 else 24 if pages >= 35 else 20 if pages >= 25 else 16 if pages >= 18 else 10 if pages >= 12 else 6
                  year = int(date[:4]) if re.match(r'20\d{2}', date) else 0
                  recent_score = max(0, min(10, year - 2016))
                  rec = {
                      'info_code': info, 'title': title, 'broker': broker,
                      'publish_date': date, 'pages': pages, 'bytes': len(data),
                      'sha256': sha, 'source_url': source_url,
                      'score': keyword_score + page_score + recent_score,
                      'file': str(target),
                  }
                  valid.append(rec)
                  print('VALID', json.dumps({k: rec[k] for k in ('title','broker','publish_date','pages','score')}, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('PROBE_ERR', info, title, repr(exc), flush=True)
                  target.unlink(missing_ok=True)

          if len(valid) < 2:
              raise RuntimeError(f'Only {len(valid)} valid long-form reports found')

          valid.sort(key=lambda x: (x['score'], x['pages'], x['publish_date']), reverse=True)
          selected = []
          used_brokers = set()
          for rec in valid:
              if rec['broker'] in used_brokers:
                  continue
              selected.append(rec)
              used_brokers.add(rec['broker'])
              if len(selected) == 3:
                  break
          if len(selected) < 3:
              for rec in valid:
                  if rec not in selected:
                      selected.append(rec)
                  if len(selected) == 3:
                      break
          selected = selected[:3]

          package = f'宁波港_601018_券商深度报告_{len(selected)}份'
          final = FINAL_ROOT / package
          final.mkdir(parents=True, exist_ok=True)
          final_records = []
          for index, rec in enumerate(selected, 1):
              filename = f'{index:02d}_{safe(rec["publish_date"])}_{safe(rec["broker"])}_{safe(rec["title"])}.pdf'
              shutil.copy2(rec['file'], final / filename)
              final_records.append({
                  'filename': filename,
                  'broker': rec['broker'],
                  'title': rec['title'],
                  'publish_date': rec['publish_date'],
                  'pages': rec['pages'],
                  'bytes': rec['bytes'],
                  'sha256': rec['sha256'],
                  'source_url': rec['source_url'],
                  'info_code': rec['info_code'],
              })

          readme = [
              '宁波港（601018.SH，宁波舟山港股份有限公司）券商深度报告合集',
              '整理日期：2026-09-27',
              '',
              '筛选标准：公开可直接下载的完整PDF；公司身份和券商研究属性可核验；优先深度、首次覆盖或长篇公司专题，排除数页季报/年报点评；尽量分散券商来源。',
              '',
              '文件清单：',
          ]
          for idx, rec in enumerate(final_records, 1):
              readme += [
                  f'{idx}. {rec["filename"]}',
                  f'   券商：{rec["broker"]}',
                  f'   标题：{rec["title"]}',
                  f'   日期：{rec["publish_date"]}；页数：{rec["pages"]}',
                  f'   来源：{rec["source_url"]}',
                  f'   SHA-256：{rec["sha256"]}',
                  '',
              ]
          readme += ['完整性核验：已检查PDF文件头、公司名称/证券代码、券商研究标识、实际页数、qpdf结构、重复文件及SHA-256；ZIP已通过CRC测试。']
          (final / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (final / 'manifest.json').write_text(json.dumps(final_records, ensure_ascii=False, indent=2), encoding='utf-8')
          (final / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in final_records), encoding='utf-8')

          zip_path = ART / f'{package}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(final.iterdir()):
                  zf.write(path, arcname=f'{package}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              pdfs = [name for name in zf.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != len(final_records):
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)} vs {len(final_records)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('SELECTED_FINAL', json.dumps(final_records, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-601018-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
