name: resolve-donghu-sina-originals-v8

on:
  push:
    branches:
      - tmp/donghu-hightech-page-probe-20261104-v7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Parse list and resolve original links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          list_url='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh600133&t1=all'
          r=s.get(list_url,timeout=(10,40),allow_redirects=True)
          print('LIST',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          text=r.content.decode('gb18030',errors='replace')
          # print report-like hrefs with surrounding text
          links=[]
          for m in re.finditer(r'href=["\']([^"\']*vReport_Show[^"\']*rptid/\d+[^"\']*)["\']',text,re.I):
              href=html.unescape(m.group(1)); full=urljoin(r.url,href)
              ctx=re.sub(r'<[^>]+>',' ',text[max(0,m.start()-500):min(len(text),m.end()+700)])
              ctx=re.sub(r'\s+',' ',html.unescape(ctx)).strip()
              rpt=re.search(r'rptid/(\d+)',full)
              if rpt and not any(x['rptid']==rpt.group(1) for x in links):
                  links.append({'rptid':rpt.group(1),'detail':full,'context':ctx})
          print('REPORT_LINKS',len(links))
          for item in links:
              print('ITEM',json.dumps(item,ensure_ascii=False))
              detail=item['detail'].rstrip('/')
              original=detail+'/url'
              try:
                  rr=s.get(original,timeout=(10,50),allow_redirects=True,headers={'Referer':item['detail'],'Accept':'application/pdf,text/html,*/*;q=0.8'})
                  print('ORIGINAL',item['rptid'],rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),rr.history and [(h.status_code,h.url,h.headers.get('location')) for h in rr.history])
                  print('MAGIC',rr.content[:20])
                  if not rr.content.startswith(b'%PDF-'):
                      t=rr.content.decode(rr.apparent_encoding or 'utf-8',errors='replace')
                      print('ORIGINAL_HEAD',re.sub(r'\s+',' ',t[:3000]))
                      pdfs=re.findall(r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',t,re.I)
                      print('PDF_LINKS',pdfs[:20])
              except Exception as e:
                  print('ORIGINAL_ERROR',item['rptid'],repr(e))
          PY
