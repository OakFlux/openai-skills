name: Package Qingju Technology annual reports prospectus and latest quarter

on:
  pull_request:
    paths:
      - 'tasks/qingju-filings-20261005.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '青矩技术'
          FULL_NAME = '青矩技术股份有限公司'
          CURRENT_CODE = '920208'
          HISTORICAL_CODE = '836208'
          AS_OF = '2026-10-05'

          filings = [
              {
                  'kind': 'prospectus',
                  'label': '向不特定合格投资者公开发行股票并在北京证券交易所上市招股说明书',
                  'date': '2023-03-27',
                  'url': 'https://static.cninfo.com.cn/finalpage/2023-03-27/1216235278.PDF',
                  'filename': '01_青矩技术_北交所上市招股说明书.pdf',
                  'min_pages': 350,
              },
              {
                  'kind': 'annual',
                  'year': 2023,
                  'label': '2023年年度报告',
                  'date': '2024-04-18',
                  'url': 'https://static.cninfo.com.cn/finalpage/2024-04-18/1219673253.PDF',
                  'filename': '02_青矩技术_2023年年度报告.pdf',
                  'min_pages': 120,
              },
              {
                  'kind': 'annual',
                  'year': 2024,
                  'label': '2024年年度报告',
                  'date': '2025-04-25',
                  'url': 'https://static.cninfo.com.cn/finalpage/2025-04-25/1223333039.PDF',
                  'filename': '03_青矩技术_2024年年度报告.pdf',
                  'min_pages': 120,
              },
              {
                  'kind': 'annual',
                  'year': 2025,
                  'label': '2025年年度报告',
                  'date': '2026-04-17',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-04-17/1225121479.PDF',
                  'filename': '04_青矩技术_2025年年度报告.pdf',
                  'min_pages': 120,
              },
              {
                  'kind': 'quarter',
                  'year': 2026,
                  'quarter': 1,
                  'label': '2026年第一季度报告',
                  'date': '2026-04-17',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-04-17/1225121322.PDF',
                  'filename': '05_青矩技术_2026年第一季度报告.pdf',
                  'min_pages': 8,
              },
          ]

          out = Path('artifact_out')
          work = Path('qingju_work')
          package = work / '青矩技术_920208.BJ_全部年报_招股说明书_最新季报'
          verify = work / 'verify'
          for path in (out, package, verify):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=6, connect=6, read=6, status=6, backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=6, pool_maxsize=6))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://www.cninfo.com.cn/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          records = []
          sha_lines = []
          for index, item in enumerate(filings, start=1):
              dest = package / item['filename']
              print('DOWNLOAD', item['label'], item['url'], flush=True)
              response = session.get(
                  item['url'],
                  headers={'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},
                  timeout=(30, 300),
              )
              response.raise_for_status()
              blob = response.content
              if not blob.startswith(b'%PDF'):
                  raise RuntimeError(f'Not a PDF: {item["label"]}; head={blob[:80]!r}')
              if len(blob) < 100_000:
                  raise RuntimeError(f'PDF too small: {item["label"]}; bytes={len(blob)}')
              dest.write_bytes(blob)

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {item["label"]}: {check.stderr[-1000:]}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Page count too small for {item["label"]}: {pages}')

              text_path = verify / f'{index:02d}.txt'
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(20, pages)), str(dest), str(text_path)],
                  capture_output=True, text=True, check=False,
              )
              sample = text_path.read_text(encoding='utf-8', errors='ignore') if text_path.exists() else ''
              compact = re.sub(r'\s+', '', sample)
              identity_ok = COMPANY in compact or FULL_NAME in compact or CURRENT_CODE in compact or HISTORICAL_CODE in compact
              if item['kind'] == 'prospectus':
                  type_ok = '招股说明书' in compact and ('北京证券交易所' in compact or '北交所' in compact)
              elif item['kind'] == 'annual':
                  type_ok = str(item['year']) in compact and '年度报告' in compact
              else:
                  type_ok = str(item['year']) in compact and ('季度报告' in compact or '一季度报告' in compact)
              if not identity_ok or not type_ok:
                  raise RuntimeError(f'Identity/type validation failed for {item["label"]}: identity={identity_ok}, type={type_ok}')

              first_prefix = verify / f'{index:02d}_first'
              last_prefix = verify / f'{index:02d}_last'
              first = subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '80', str(dest), str(first_prefix)],
                  capture_output=True, text=True,
              )
              last = subprocess.run(
                  ['pdftoppm', '-f', str(pages), '-l', str(pages), '-singlefile', '-png', '-r', '80', str(dest), str(last_prefix)],
                  capture_output=True, text=True,
              )
              first_png = Path(str(first_prefix) + '.png')
              last_png = Path(str(last_prefix) + '.png')
              if first.returncode != 0 or last.returncode != 0 or not first_png.exists() or not last_png.exists() or first_png.stat().st_size < 5000 or last_png.stat().st_size < 5000:
                  raise RuntimeError(f'Page rendering failed for {item["label"]}')

              digest = hashlib.sha256(blob).hexdigest()
              record = {
                  **item,
                  'pages': pages,
                  'bytes': len(blob),
                  'sha256': digest,
                  'source': '巨潮资讯网公开披露原件',
              }
              records.append(record)
              sha_lines.append(f'{digest}  {item["filename"]}')
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 5:
              raise RuntimeError(f'Expected 5 PDFs, got {len(records)}')

          readme = [
              '# 青矩技术（现证券代码920208.BJ，原代码836208）全部年报、招股说明书及最新季报',
              '',
              f'打包日期：{AS_OF}',
              '',
              '收录口径：公司于2023年6月29日在北京证券交易所上市，因此“全部年报”按北交所上市公司口径收录2023、2024和2025年度完整年度报告。',
              '同时收录正式版北交所上市招股说明书，以及截至打包日最新正式季报2026年第一季度报告。',
              '已排除年度报告摘要、半年度报告、三季度报告、招股说明书注册稿/申报稿、发行公告及其他说明文件。',
              '',
              '## 文件清单',
              '',
          ]
          for record in records:
              readme.append(f'- {record["filename"]}（{record["pages"]}页；披露日期 {record["date"]}）')
          readme += [
              '',
              '## 来源与校验',
              '',
              '全部PDF均来自巨潮资讯网公开披露原件。已完成PDF文件头、文件大小、公司身份、文件类型、实际页数、qpdf结构、首末页渲染和SHA-256校验。',
              '原始PDF地址、页数、文件大小和校验值见manifest.json；校验值另见SHA256SUMS.txt。',
              '',
              '材料仅供研究与存档，不构成投资建议。',
          ]
          (package / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (package / 'manifest.json').write_text(json.dumps({
              'company': COMPANY,
              'full_name': FULL_NAME,
              'current_ticker': '920208.BJ',
              'historical_ticker': '836208.BJ',
              'listing_date': '2023-06-29',
              'package_date': AS_OF,
              'reports': records,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          (package / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          chinese_zip = out / '青矩技术_920208.BJ_全部年报_招股说明书_最新季报.zip'
          with zipfile.ZipFile(chinese_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(package.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{package.name}/{path.relative_to(package)}')
          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len(pdfs) != 5:
                  raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs, expected 5')

          english_zip = out / 'Qingju_Technology_920208_Filings.zip'
          shutil.copy2(chinese_zip, english_zip)
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, hashlib.sha256(chinese_zip.read_bytes()).hexdigest(), flush=True)
          print('BACKUP_ZIP', english_zip, english_zip.stat().st_size, hashlib.sha256(english_zip.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: qingju-filings-artifact
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
