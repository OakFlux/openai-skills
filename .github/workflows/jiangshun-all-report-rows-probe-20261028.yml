name: Probe all Jiangshun public broker report rows 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jiangshun-all-report-rows-probe-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests
      - name: Scan relevant date windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2025-04-10','2025-04-16'),
            ('2025-08-25','2025-09-05'),
            ('2025-09-18','2025-09-26'),
            ('2026-06-18','2026-06-27'),
            ('2026-08-24','2026-09-05'),
            ('2026-10-17','2026-10-24'),
          ]
          terms=['江顺科技','铝型材挤压模具','3D打印','海外市场星辰大海','新兴领域打开第二曲线','主业筑牢基本盘','国内铝型材领军企业']
          all_found=[];seen=set()
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1','2']:
              total=1
              for page in range(1,121):
                if page>total:break
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                payload=None
                for attempt in range(5):
                  try:
                    r=s.get(api,params=p,timeout=(20,120))
                    if r.status_code==200:payload=r.json();break
                  except Exception as e:print('ERR',begin,qtype,page,repr(e))
                  time.sleep(1+attempt)
                if payload is None:break
                total=min(int(payload.get('TotalPage') or payload.get('totalPage') or 1),120)
                rows=payload.get('data') or []
                if isinstance(rows,dict):rows=rows.get('list') or rows.get('data') or []
                if not rows:break
                for row in rows:
                  title=str(row.get('title') or '')
                  code=str(row.get('stockCode') or '')
                  name=str(row.get('stockName') or '')
                  if code=='001400' or '江顺科技' in name or any(t in title for t in terms):
                    item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','author','emRatingName','sRatingName','stockCode','stockName','industryName']}
                    key=str(item.get('infoCode') or '')+'|'+str(item.get('title') or '')
                    print('MATCH',json.dumps(item,ensure_ascii=False))
                    if key not in seen:seen.add(key);all_found.append(item)
                if page>=total or len(rows)<100:break
              print('QTYPE_DONE',qtype,'TOTAL',total)
          print('\nALL_FOUND',json.dumps(all_found,ensure_ascii=False,indent=2))
          PY
