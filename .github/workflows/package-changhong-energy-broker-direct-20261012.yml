name: Package direct Changhong Energy broker report archive

on:
  pull_request:
    paths:
      - 'tasks/changhong-energy-broker-direct-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and prepare archive contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          reports = [
              {
                  'info_code': 'AP202510201765545144',
                  'broker': '开源证券',
                  'title': '北交所首次覆盖报告：锂电回暖+海外布局+半固态量产+机器人，多点开花增长潜力深厚',
                  'publish_date': '2025-10-20',
                  'authors': ['诸海滨'],
                  'rating': '增持（首次）',
                  'expected_pages': 22,
              },
              {
                  'info_code': 'AP202211211580425226',
                  'broker': '东吴证券',
                  'title': '碱电业务稳增长，锂电业务高增前景可期',
                  'publish_date': '2022-11-21',
                  'authors': ['曾朵红', '阮巧燕', '刘晓恬'],
                  'rating': '增持',
                  'expected_pages': 31,
              },
              {
                  'info_code': 'AP202211161580308172',
                  'broker': '东莞证券',
                  'title': '北交所上市公司系列研究之长虹能源：公司推进扩能项目，锂离子电池收入高速增长',
                  'publish_date': '2022-11-16',
                  'authors': ['刘兴文', '苏治彬'],
                  'rating': '未标注',
                  'expected_pages': 18,
              },
          ]

          out = Path('package') / '长虹能源_920239.BJ_券商深度报告_3份'
          verify = Path('verify')
          out.mkdir(parents=True, exist_ok=True)
          verify.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=5, connect=5, read=5, status=5, backoff_factor=1.0,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:110]

          records = []
          sha_lines = []
          for index, report in enumerate(reports, 1):
              url = f'https://pdf.dfcfw.com/pdf/H3_{report["info_code"]}_1.pdf'
              response = session.get(url, headers={'Accept': 'application/pdf,*/*;q=0.8'}, timeout=(30, 240))
              response.raise_for_status()
              blob = response.content
              if not blob.startswith(b'%PDF') or len(blob) < 100_000:
                  raise RuntimeError(f'Invalid PDF for {report["info_code"]}: {len(blob)} bytes')

              filename = f'{index:02d}_{report["publish_date"]}_{safe(report["broker"])}_{safe(report["title"])}.pdf'
              path = out / filename
              path.write_bytes(blob)

              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {filename}: {check.stderr[-800:]}')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f'Unexpected page count for {filename}: {pages}')

              text = ''.join((page.extract_text() or '') for page in reader.pages[:min(25, pages)])
              compact = re.sub(r'\s+', '', text)
              if not ('长虹能源' in compact or '920239' in compact or '836239' in compact):
                  raise RuntimeError(f'Company identity check failed for {filename}')
              if not any(term in compact for term in ('证券研究报告', '公司研究', '首次覆盖', '投资评级', '分析师')):
                  raise RuntimeError(f'Research-report check failed for {filename}')

              first_prefix = verify / f'{index:02d}_first'
              last_prefix = verify / f'{index:02d}_last'
              first = subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '80', str(path), str(first_prefix)], capture_output=True, text=True)
              last = subprocess.run(['pdftoppm', '-f', str(pages), '-l', str(pages), '-singlefile', '-png', '-r', '80', str(path), str(last_prefix)], capture_output=True, text=True)
              if first.returncode != 0 or last.returncode != 0:
                  raise RuntimeError(f'Page render failed for {filename}')

              sha = hashlib.sha256(blob).hexdigest()
              record = {
                  **report,
                  'filename': filename,
                  'pages': pages,
                  'bytes': len(blob),
                  'sha256': sha,
                  'source_url': url,
              }
              records.append(record)
              sha_lines.append(f'{sha}  {filename}')
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '长虹能源（920239.BJ，原代码836239）券商深度报告合集',
              '整理日期：2026-10-12',
              '',
              '本资料包收录3份完整长篇公司研究PDF：开源证券首次覆盖22页、东吴证券公司研究31页、东莞证券北交所系列研究18页。',
              '已排除网页摘要、行情快讯、短篇信息更新、财报点评、询价与申购材料。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f'{i}. {rec["filename"]}',
                  f'   机构：{rec["broker"]}',
                  f'   标题：{rec["title"]}',
                  f'   日期：{rec["publish_date"]}；页数：{rec["pages"]}',
                  f'   分析师：{"、".join(rec["authors"])}；评级：{rec["rating"]}',
                  f'   来源：{rec["source_url"]}',
                  '',
              ])
          readme.append('完整性核验：已检查PDF文件头、公司身份、券商研究属性、实际页数、qpdf结构、首末页渲染和SHA-256。')
          (out / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')
          PY

      - name: Upload directly downloadable archive
        uses: actions/upload-artifact@v4
        with:
          name: changhong-energy-broker-direct
          path: package/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
