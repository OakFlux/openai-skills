name: Discover Sirio Health 300791 broker reports 20261006

on:
  push:
    paths:
      - '.github/workflows/sirio-health-300791-broker-report-discovery-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report index and probe public PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          from typing import Any
          import requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          params = {
              'industryCode':'*', 'pageSize':'100', 'industry':'*', 'rating':'*',
              'ratingChange':'*', 'beginTime':'2018-01-01', 'endTime':'2030-12-31',
              'pageNo':'1', 'fields':'', 'qType':'0', 'orgCode':'', 'code':'300791',
              'rcode':'', 'p':'1', 'pageNum':'1', 'pageNumber':'1'
          }
          r = s.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=(20,120))
          r.raise_for_status()
          data = r.json()
          rows = data.get('data') or []
          Path('out/index.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          keywords = ['深度','首次覆盖','投资价值','龙头','全球','CDMO','迈向世界','蓄势疾行','格局趋于集中']
          result=[]
          for row in rows:
              item = {
                  'title':row.get('title'), 'stockName':row.get('stockName'), 'stockCode':row.get('stockCode'),
                  'orgName':row.get('orgName'), 'orgSName':row.get('orgSName'), 'publishDate':row.get('publishDate'),
                  'infoCode':row.get('infoCode'), 'attachPages':row.get('attachPages'), 'attachSize':row.get('attachSize'),
                  'rating':row.get('emRatingName') or row.get('sRatingName'), 'researcher':row.get('researcher'),
                  'column':row.get('column'), 'reportType':row.get('reportType'),
              }
              title=str(row.get('title') or '')
              score=sum(10 for k in keywords if k.lower() in title.lower())
              pages=int(row.get('attachPages') or 0)
              if pages >= 20: score += 5
              if pages >= 30: score += 3
              item['deep_score']=score
              code=str(row.get('infoCode') or '')
              if code:
                  url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'
                  item['pdf_url']=url
                  try:
                      rr=s.get(url,timeout=(20,120),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'})
                      item['pdf_status']=rr.status_code
                      item['pdf_bytes']=len(rr.content)
                      item['pdf_head']=rr.content[:5].decode('latin1','replace')
                      if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>50000:
                          p=Path('out/pdfs')/f'{code}.pdf'
                          p.write_bytes(rr.content)
                          item['saved_file']=str(p)
                  except Exception as exc:
                      item['pdf_error']=repr(exc)
              result.append(item)
              time.sleep(.05)

          result.sort(key=lambda x:(x.get('deep_score') or 0, x.get('publishDate') or ''), reverse=True)
          Path('out/summary.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HITS', data.get('hits'), 'ROWS', len(rows))
          for x in result:
              print(json.dumps(x,ensure_ascii=False))
          PY
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: sirio-health-300791-broker-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
