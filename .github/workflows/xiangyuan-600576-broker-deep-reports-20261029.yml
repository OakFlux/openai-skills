name: Package Xiangyuan 600576 broker deep reports

on:
  push:
    paths:
      - '.github/workflows/xiangyuan-600576-broker-deep-reports-20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '祥源文旅'
          FULL_COMPANY = '浙江祥源文旅股份有限公司'
          CODE = '600576'
          CUTOFF = '2026-10-29'
          CUTOFF_COMPACT = '20261029'
          ROOT_NAME = f'{COMPANY}_{CODE}_券商深度报告_精选3份_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          REPORT_DIR = ROOT / '报告PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          DIST = Path('dist')
          for directory in (REPORT_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          REPORTS = [
              {
                  'filename': '01_东吴证券_2025-04-03_首次覆盖_内生外延拓展旅游资产_文旅大集团启航前行.pdf',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202504031650889122_1.pdf?1743705993000.pdf=',
                      'https://pdf.dfcfw.com/pdf/H3_AP202504031650889122_1.pdf',
                  ],
                  'referer': 'https://data.eastmoney.com/report/info/AP202504031650889122.html',
                  'broker': '东吴证券',
                  'date': '2025-04-03',
                  'title': '内生外延拓展旅游资产，文旅大集团启航前行',
                  'authors': '吴劲草',
                  'rating': '增持（首次）',
                  'report_type': '公司深度研究/首次覆盖',
                  'min_pages': 24,
                  'max_pages': 27,
              },
              {
                  'filename': '02_华西证券_2025-04-07_首次覆盖_深度布局文旅科技_打造新型文旅平台.pdf',
                  'urls': [
                      'https://aigc.idigital.com.cn/djyanbao/%E3%80%90%E5%8D%8E%E8%A5%BF%E8%AF%81%E5%88%B8%E3%80%91%E7%A5%A5%E6%BA%90%E6%96%87%E6%97%85%EF%BC%88600576%EF%BC%89%EF%BC%9A%E6%B7%B1%E5%BA%A6%E5%B8%83%E5%B1%80%E6%96%87%E6%97%85%2B%E7%A7%91%E6%8A%80%EF%BC%8C%E6%89%93%E9%80%A0%E6%96%B0%E5%9E%8B%E6%96%87%E6%97%85%E5%B9%B3%E5%8F%B0-2025-04-10.pdf',
                  ],
                  'referer': 'https://aigc.idigital.com.cn/',
                  'broker': '华西证券',
                  'date': '2025-04-07',
                  'title': '深度布局文旅+科技，打造新型文旅平台',
                  'authors': '刘文正、许光辉、徐晴',
                  'rating': '增持（首次覆盖）',
                  'report_type': '公司深度研究/首次覆盖',
                  'min_pages': 28,
                  'max_pages': 31,
              },
              {
                  'filename': '03_东莞证券_2025-01-24_深度报告_持续探索文旅发展新模式_布局低空开拓新市场.pdf',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202501241642518241_1.pdf?1737733224000.pdf=',
                      'https://pdf.dfcfw.com/pdf/H3_AP202501241642518241_1.pdf',
                  ],
                  'referer': 'https://data.eastmoney.com/report/info/AP202501241642518241.html',
                  'broker': '东莞证券',
                  'date': '2025-01-24',
                  'title': '持续探索文旅发展新模式，布局低空开拓新市场',
                  'authors': '邓升亮',
                  'rating': '增持',
                  'report_type': '公司深度报告',
                  'min_pages': 20,
                  'max_pages': 45,
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=1.0,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}),
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          def safe_name(value: str) -> str:
              return re.sub(r'_+', '_', re.sub(r'[\\/:*?"<>|]', '_', value)).strip('_. ')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          records = []
          for report in REPORTS:
              response = None
              used_url = ''
              failures = []
              for url in report['urls']:
                  try:
                      candidate = session.get(
                          url,
                          headers={'Referer': report['referer']},
                          timeout=240,
                          allow_redirects=True,
                      )
                      print('DOWNLOAD', candidate.status_code, len(candidate.content), url, '->', candidate.url)
                      if candidate.status_code == 200 and len(candidate.content) >= 100_000 and candidate.content.startswith(b'%PDF'):
                          response = candidate
                          used_url = url
                          break
                      failures.append(f'{url}: status={candidate.status_code}, size={len(candidate.content)}, head={candidate.content[:16]!r}')
                  except Exception as exc:
                      failures.append(f'{url}: {exc!r}')
              if response is None:
                  raise RuntimeError('No valid PDF for ' + report['title'] + ': ' + ' | '.join(failures))

              destination = REPORT_DIR / safe_name(report['filename'])
              destination.write_bytes(response.content)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception as exc:
                      raise RuntimeError(f'Encrypted PDF cannot be opened: {destination}: {exc}')
              page_count = len(reader.pages)
              if not report['min_pages'] <= page_count <= report['max_pages']:
                  raise RuntimeError(
                      f"Unexpected page count for {destination}: range={report['min_pages']}-{report['max_pages']} actual={page_count}"
                  )

              pdf = fitz.open(destination)
              if pdf.page_count != page_count:
                  raise RuntimeError(f'PDF parser page mismatch: {destination}: pypdf={page_count}, fitz={pdf.page_count}')
              first_pixmap = pdf.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_pixmap = pdf.load_page(pdf.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first_pixmap.width, first_pixmap.height, last_pixmap.width, last_pixmap.height) < 100:
                  raise RuntimeError(f'PDF render validation failed: {destination}')
              first_pixmap.save(PREVIEW_DIR / f'{destination.stem}.png')

              probe = ''
              for page_index in range(min(10, pdf.page_count)):
                  try:
                      probe += pdf.load_page(page_index).get_text('text')
                  except Exception:
                      pass
              pdf.close()
              compact = re.sub(r'\s+', '', probe)
              if COMPANY not in compact and FULL_COMPANY not in compact and CODE not in compact:
                  raise RuntimeError(f'Company identity not found in PDF: {destination}')
              broker_key = report['broker'].replace('证券', '')
              if broker_key not in compact and report['broker'] not in compact:
                  raise RuntimeError(f'Broker identity not found in PDF: {destination}')

              first_page_text = ''
              try:
                  first_page_text = reader.pages[0].extract_text() or ''
              except Exception:
                  pass

              record = {
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'rating': report['rating'],
                  'report_type': report['report_type'],
                  'source_url': used_url,
                  'resolved_url': response.url,
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': sha256(destination),
                  'first_page_text_excerpt': re.sub(r'\s+', ' ', first_page_text).strip()[:1800],
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
                  'broker_identity_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'document_count': len(records),
              'selection_note': '优先选择公开可完整取得、篇幅较长且覆盖景区资产整合、经营模式和成长逻辑的公司深度或首次覆盖报告。',
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）券商深度报告精选',
              '',
              f'- 截止日期：{CUTOFF}',
              '- 共3份公开可完整取得的公司深度或首次覆盖报告。',
              '- 所有PDF均保留原始内容，未合并、删页或重排。',
              '- 已完成PDF文件头、双解析器页数、公司与券商身份、首末页渲染、SHA-256及ZIP CRC校验。',
              '',
              '## 文件清单',
              '',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 机构：{record['broker']}；日期：{record['date']}；类型：{record['report_type']}",
                  f"   - 标题：{record['title']}",
                  f"   - 分析师：{record['authors']}；评级：{record['rating']}",
                  f"   - 页数：{record['page_count']}；文件大小：{record['file_size_bytes']:,}字节",
                  f"   - 来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'xiangyuan_culture_tourism_600576_broker_deep_reports_3_{CUTOFF_COMPACT}.zip'
          for path in (chinese_zip, english_zip):
              if path.exists():
                  path.unlink()

          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad_member = archive.testzip()
                  if bad_member:
                      raise RuntimeError(f'ZIP CRC failure: {path}: {bad_member}')
                  pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdf_members) != 3:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {path}: {len(pdf_members)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256(path))

          print('FINAL_JSON', json.dumps({
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': sha256(chinese_zip),
              'records': records,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiangyuan-600576-broker-deep-reports-20261029
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
