name: Package official CCCC Development 000736 reports 20260927

on:
  push:
    paths:
      - '.github/workflows/cccc-development-000736-official-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='中交发展_000736_2020-2025年报及2026年中期报告_官方原件'
          out=Path(package); out.mkdir(exist_ok=True)
          docs=[
            ('01_中交地产_000736_2020年年度报告.pdf','2020年年度报告','2021-04-15','https://static.cninfo.com.cn/finalpage/2021-04-15/1209691245.PDF','2020',100),
            ('02_中交地产_000736_2021年年度报告.pdf','2021年年度报告','2022-04-15','https://static.cninfo.com.cn/finalpage/2022-04-15/1212925020.PDF','2021',100),
            ('03_中交地产_000736_2022年年度报告.pdf','2022年年度报告','2023-04-08','https://static.cninfo.com.cn/finalpage/2023-04-08/1216358368.PDF','2022',100),
            ('04_中交地产_000736_2023年年度报告.pdf','2023年年度报告','2024-04-08','https://static.cninfo.com.cn/finalpage/2024-04-08/1219517434.PDF','2023',100),
            ('05_中交地产_000736_2024年年度报告.pdf','2024年年度报告','2025-04-15','https://static.cninfo.com.cn/finalpage/2025-04-15/1223096939.PDF','2024',100),
            ('06_中交地产_000736_2025年年度报告.pdf','2025年年度报告','2026-04-15','https://static.cninfo.com.cn/finalpage/2026-04-15/1225104696.PDF','2025',100),
            ('07_中交发展_000736_2026年半年度报告.pdf','2026年半年度报告（截至2026-09-27最新定期报告）','2026-08-20','https://static.cninfo.com.cn/finalpage/2026-08-20/1225481227.PDF','2026',20),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def get_pdf(url,dest):
            errs=[]
            for u in (url,url.replace('static.cninfo.com.cn','www.cninfo.com.cn')):
              for attempt in range(1,5):
                tmp=dest.with_suffix('.pdf.part')
                try:
                  with s.get(u,headers={'Referer':'https://www.cninfo.com.cn/','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},timeout=(30,300),allow_redirects=True,stream=True) as r:
                    print('DOWNLOAD',dest.name,attempt,r.status_code,u,'final',r.url,flush=True); r.raise_for_status()
                    with tmp.open('wb') as f:
                      for chunk in r.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                    final=r.url
                  size=tmp.stat().st_size
                  with tmp.open('rb') as f: head=f.read(8)
                  if size<150000 or not head.startswith(b'%PDF-'): raise RuntimeError(f'invalid size={size} head={head!r}')
                  tmp.replace(dest); return final
                except Exception as e:
                  errs.append(f'{u} attempt {attempt}: {e!r}'); tmp.unlink(missing_ok=True); time.sleep(attempt*2)
            raise RuntimeError(f'download failed {dest.name}: {errs}')

          recs=[]; hashes=set()
          for filename,period,date,url,year,minpages in docs:
            dest=out/filename; final=get_pdf(url,dest)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<minpages: raise RuntimeError(f'page count too small {filename}: {pages}')
            text=''
            for p in reader.pages[:min(18,pages)]:
              try: text+='\n'+(p.extract_text() or '')
              except Exception: pass
            compact=re.sub(r'\s+','',text)
            if '000736' not in compact or not any(x in compact for x in ('中交地产','中交城市发展控股集团','中交发展')): raise RuntimeError(f'identity check failed {filename}')
            if year not in compact or not any(x in compact for x in ('年度报告','半年度报告')): raise RuntimeError(f'period check failed {filename}')
            q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
            if q.returncode not in (0,3): raise RuntimeError(f'qpdf failed {filename}: {q.stderr[-1200:]}')
            data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in hashes: raise RuntimeError(f'duplicate {filename}')
            hashes.add(sha)
            rec={'filename':filename,'report_period':period,'disclosure_date':date,'source':'巨潮资讯网官方披露原件','source_url':final,'pages':pages,'bytes':len(data),'sha256':sha}
            recs.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          readme=[
            '中交发展（000736.SZ）2020—2025年年度报告及最新定期报告',
            '整理日期：2026-09-27','',
            '公司说明：证券代码000736保持不变。公司原名“中交地产股份有限公司”，2026年更名为“中交城市发展控股集团股份有限公司”，证券简称变更为“中交发展”。因此2020—2025年年度报告仍以“中交地产”或“*ST中地”名义披露。','',
            '收录范围：2020—2025年完整年度报告各1份，以及截至整理日最新的2026年半年度报告。未以摘要、业绩预告、审计专项报告或其他短篇公告替代完整报告。','',
            '全部PDF均来自巨潮资讯网官方披露原件，并完成文件头、证券代码、公司名称、报告年度/期间、实际页数、qpdf结构、重复哈希及SHA-256核验。','',
            '文件清单：'
          ]
          for i,r in enumerate(recs,1):
            readme += [f"{i}. {r['report_period']}",f"   文件：{r['filename']}",f"   披露日期：{r['disclosure_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MiB",f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in recs),encoding='utf-8')
          print('FINAL_PACKAGE',package,'PDF_COUNT',len(recs),'TOTAL_BYTES',sum(r['bytes'] for r in recs),flush=True)
          print('FINAL_MANIFEST',json.dumps(recs,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cccc-development-000736-official-reports-final
          path: 中交发展_000736_2020-2025年报及2026年中期报告_官方原件/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
