name: Nanfang Precision Historical Research API Probe

on:
  push:
    branches:
      - chatgpt-nanfang-precision-reports-20261004
    paths:
      - .github/workflows/nanfang_precision_historical_api_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Probe report APIs and detail pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          import re
          from urllib.parse import urlencode, urljoin
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          output = {'eastmoney': [], 'pages': []}

          # Date-window probes and variant parameter combinations.
          windows = [
              ('2026-01-01','2026-12-31'),
              ('2024-01-01','2024-12-31'),
              ('2022-01-01','2022-12-31'),
              ('2021-01-01','2021-12-31'),
              ('2017-01-01','2017-12-31'),
              ('2010-01-01','2026-12-31'),
          ]
          endpoints = [
              'https://reportapi.eastmoney.com/report/list',
              'https://reportapi.eastmoney.com/report/list2',
          ]
          for endpoint in endpoints:
              for begin, end in windows:
                  for qtype in ('0','1'):
                      params = {
                          'pageSize':'100','pageNo':'1','qType':qtype,'code':'002553',
                          'beginTime':begin,'endTime':end,'fields':'','industryCode':'*',
                          'industry':'*','rating':'*','ratingChange':'*','orgCode':'',
                      }
                      url = endpoint + '?' + urlencode(params)
                      rec = {'endpoint': endpoint, 'begin':begin, 'end':end, 'qType':qtype, 'url':url}
                      try:
                          r = s.get(url, headers={'Referer':'https://data.eastmoney.com/report/002553.html'}, timeout=45)
                          rec.update({'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'final':r.url})
                          try:
                              obj = r.json()
                              rows = obj.get('data') or obj.get('result') or []
                              rec['hits'] = obj.get('hits') or obj.get('total') or obj.get('count')
                              rec['rows'] = []
                              for row in rows:
                                  rec['rows'].append({
                                      k: row.get(k) for k in (
                                          'publishDate','orgSName','orgName','title','researcher','emRatingName',
                                          'sRatingName','attachPages','attachSize','infoCode','column','attachUrl','pdfUrl','url'
                                      )
                                  })
                          except Exception as exc:
                              rec['json_error'] = repr(exc)
                              rec['text_head'] = r.text[:1000]
                      except Exception as exc:
                          rec['error'] = repr(exc)
                      output['eastmoney'].append(rec)
                      if rec.get('rows'):
                          print('EM_RESULT', json.dumps(rec, ensure_ascii=False))

          page_specs = [
              ('stockstar','https://stock.quote.stockstar.com/corp/rating_002553.shtml'),
              ('hangyan2024','https://www.hangyan.co/reports/3492847056811197936'),
              ('eastmoney2024','https://data.eastmoney.com/report/info/AP202411021640685655.html'),
              ('sina_list_company','https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=2&symbol=002553'),
              ('sina_list_keyword','https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=3&keyword=%C4%CF%B7%BD%BE%AB%B9%A4'),
          ]
          for name, url in page_specs:
              rec = {'name':name,'url':url}
              try:
                  r = s.get(url, timeout=60, allow_redirects=True)
                  raw = r.content
                  text = None
                  for enc in ('utf-8','gb18030',r.apparent_encoding):
                      if not enc: continue
                      try:
                          text = raw.decode(enc)
                          break
                      except Exception: pass
                  text = text or r.text
                  rec.update({'status':r.status_code,'bytes':len(raw),'ctype':r.headers.get('content-type'),'final':r.url})
                  soup = BeautifulSoup(text,'html.parser')
                  rec['title'] = soup.title.get_text(' ',strip=True) if soup.title else ''
                  links=[]
                  for a in soup.find_all('a',href=True):
                      label=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      blob=(label+' '+href)
                      if any(term in blob for term in ('南方精工','南方轴承','新能源汽车注入新活力','芯片研发取进展','拟变更控股权','PDF','pdf','report','Report','查看详情')):
                          links.append({'text':label[:200],'url':href})
                  rec['links']=links[:500]
                  snippets=[]
                  for term in ('新能源汽车注入新活力','芯片研发取进展','拟变更控股权','南方精工','南方轴承','AP202411021640685655'):
                      for m in re.finditer(re.escape(term),text,re.I):
                          sn=re.sub(r'\s+',' ',text[max(0,m.start()-800):min(len(text),m.end()+1200)])[:2400]
                          if sn not in snippets: snippets.append(sn)
                          if len(snippets)>=40: break
                  rec['snippets']=snippets
                  print('PAGE',json.dumps(rec,ensure_ascii=False))
              except Exception as exc:
                  rec['error']=repr(exc)
              output['pages'].append(rec)

          with open('output/historical_probe.json','w',encoding='utf-8') as f:
              json.dump(output,f,ensure_ascii=False,indent=2)
          PY

      - name: Upload probe data
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-precision-historical-api-probe
          path: output/historical_probe.json
          retention-days: 1
