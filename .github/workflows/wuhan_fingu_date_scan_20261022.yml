name: Scan known Wuhan Fingu report dates 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_date_scan_20261022.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests pypdf
      - name: Scan dates download validate package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          import os,re,json,hashlib,zipfile,datetime,time
          import requests
          from pypdf import PdfReader
          OUT='out'; PDFDIR=OUT+'/pdfs'
          s=requests.Session();s.trust_env=False
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'*/*'}
          dates=[]
          for a,b in [('2019-10-23','2019-10-30'),('2020-08-09','2020-08-13'),('2020-11-02','2020-11-05')]:
              d=datetime.date.fromisoformat(a); end=datetime.date.fromisoformat(b)
              while d<end:dates.append(d.isoformat());d+=datetime.timedelta(days=1)
          found=[]
          for day in dates:
              for page in range(1,15):
                  p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':day,'endTime':day,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  try:r=s.get('https://reportapi.eastmoney.com/report/list',params=p,headers=H,timeout=(15,45));o=r.json()
                  except Exception as e:print('LISTERR',day,page,repr(e));break
                  rows=o.get('data') or []
                  print('DAYPAGE',day,page,'hits',o.get('hits'),'rows',len(rows))
                  for x in rows:
                      if str(x.get('stockCode',''))=='002194' or str(x.get('stockName',''))=='武汉凡谷' or '武汉凡谷' in str(x.get('title','')):
                          print('MATCH',json.dumps(x,ensure_ascii=False));found.append(x)
                  if page>=int(o.get('TotalPage') or 0) or not rows:break
                  time.sleep(.4)
          uniq=[];seen=set()
          for x in found:
              key=x.get('infoCode') or (x.get('title'),x.get('publishDate'),x.get('orgSName'))
              if key in seen:continue
              seen.add(key);uniq.append(x)
          found=uniq
          print('FOUND_TOTAL',len(found))
          with open(OUT+'/matched_records.json','w',encoding='utf-8') as f:json.dump(found,f,ensure_ascii=False,indent=2)
          def safe(v):return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+',' ',v).strip())[:150]
          manifest=[]
          for x in found:
              info=str(x.get('infoCode') or '')
              if not info:continue
              url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              try:r=s.get(url,headers=H,timeout=(15,60));data=r.content
              except Exception as e:print('PDFERR',url,repr(e));continue
              print('PDFGET',r.status_code,len(data),r.headers.get('content-type'),url)
              if not data.startswith(b'%PDF') or len(data)<20000:continue
              date=str(x.get('publishDate') or '')[:10];org=str(x.get('orgSName') or '未知券商');title=str(x.get('title') or info)
              fn=safe(f'{date}_{org}_{title}')+'.pdf';path=PDFDIR+'/'+fn
              open(path,'wb').write(data)
              try:
                  pr=PdfReader(path);pages=len(pr.pages);text='\n'.join((pr.pages[i].extract_text() or '') for i in range(min(3,pages)))[:15000]
              except Exception as e:print('PARSEERR',repr(e));os.remove(path);continue
              if not ('武汉凡谷' in text or '002194' in text or '武漢凡谷' in text):
                  print('VERIFYFAIL',fn,text[:400]);os.remove(path);continue
              rec={'filename':fn,'date':date,'broker':org,'title':title,'info_code':info,'pages':pages,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_url':url,'rating':x.get('emRatingName'),'attach_pages':x.get('attachPages'),'researcher':x.get('researcher') or x.get('author')}
              manifest.append(rec);print('VERIFIED',json.dumps(rec,ensure_ascii=False))
          manifest.sort(key=lambda z:(z['pages'],z['date']),reverse=True)
          with open(OUT+'/manifest.json','w',encoding='utf-8') as f:json.dump(manifest,f,ensure_ascii=False,indent=2)
          md=['# 武汉凡谷（002194）公开券商报告','',f'已验证：{len(manifest)}份','']
          for i,x in enumerate(manifest,1):md += [f'## {i}. {x["title"]}',f'- 券商：{x["broker"]}',f'- 日期：{x["date"]}',f'- 页数：{x["pages"]}',f'- 文件：{x["filename"]}',f'- SHA-256：{x["sha256"]}','']
          md += ['文件均验证为PDF，且前三页可识别“武汉凡谷”或“002194”。','来源：东方财富公开研报索引及其公开PDF附件。']
          open(OUT+'/README.md','w',encoding='utf-8').write('\n'.join(md))
          zname='武汉凡谷_券商报告_日期检索验证版.zip'
          with zipfile.ZipFile(zname,'w',zipfile.ZIP_DEFLATED) as z:
              z.write(OUT+'/README.md','README.md');z.write(OUT+'/manifest.json','manifest.json')
              for x in manifest:z.write(PDFDIR+'/'+x['filename'],x['filename'])
          print('FINAL',len(manifest),os.path.getsize(zname))
          if not manifest:raise SystemExit('No verified reports found')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-date-scan-20261022
          path: |
            武汉凡谷_券商报告_日期检索验证版.zip
            out
          retention-days: 7
          if-no-files-found: error
