name: Package Tangshan Port financial reports 20261016

"on":
  push:
    paths:
      - '.github/workflows/tangshan-port-601000-package-financial-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: python .github/scripts/tangshan_port_package_20261016.py
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: tangshan-port-601000-financial-reports-20261016
          path: |
            唐山港_601000_2020-2025年报及最新季报_截至20261016.zip
            tangshan_port_601000_2020_2025_annual_latest_quarter_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
