name: Probe Xiceceshi report pages

on:
  push:
    branches:
      - tmp-xiceceshi-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe HTML sources
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html,re,requests,json
          from bs4 import BeautifulSoup
          urls=[
            'https://www.9fzt.com/detail/sz_301306_10_753728496767.html',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/837052576766/index.phtml',
            'https://www.vzkoo.com/document/1112340033770001b8a068362fe8.html',
            'https://m.vzkoo.com/document/1112340033770001b8a068362fe8.html',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.baidu.com/'})
          patterns=[
            r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
            r'https?:\\/\\/[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
            r'[^\s\"\'<>]{0,80}(?:pdf|download|fileUrl|file_url|reportUrl|report_url)[^\s\"\'<>]{0,180}',
          ]
          for url in urls:
            print('\n===PAGE===',url)
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'))
              r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
              text=html.unescape(r.text).replace('\\/','/')
              print('TITLE',BeautifulSoup(text,'html.parser').title)
              found=[]
              for pat in patterns:
                for m in re.findall(pat,text,flags=re.I):
                  if m not in found: found.append(m)
              for m in found[:200]: print('MATCH',m[:500])
              for line in text.splitlines():
                low=line.lower()
                if any(k in low for k in ['.pdf','download','fileurl','reporturl','file_url','report_url','附件','原文']):
                  clean=re.sub(r'\s+',' ',line).strip()
                  if clean: print('LINE',clean[:1000])
            except Exception as e:
              print('ERROR',repr(e))
          PY
