name: Build Dongya Pharma broker deep-report package

on:
  push:
    branches: [tmp-dongya-pharma-broker-reports-20261020]
    paths: ['.github/workflows/tmp-dongya-pharma-broker-package-20261020.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='东亚药业_券商深度报告_2份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local expected_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 7 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=605177' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -eq "$expected_pages"

            pdftotext -f 1 -l 20 "$out" "$out.txt" 2>/dev/null
            grep -Eq '浙江东亚药业股份有限公司|东亚药业' "$out.txt"
            rm -f "$out.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$out" "$out.last" >/dev/null 2>&1
            test -s "$out.first.png" && test -s "$out.last.png"
            rm -f "$out.first.png" "$out.last.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202309211599679509_1.pdf' \
            "$PACKAGE/01_华安证券_抗生素量价齐升布局制剂注入新动力_首次覆盖_2023-09-21.pdf" \
            22

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202305161586669790_1.pdf' \
            "$PACKAGE/02_山西证券_抗菌原料药中间体主流企业产业链前后向延伸拐点将至_2023-05-16.pdf" \
            21

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('东亚药业_券商深度报告_2份')
          meta = {
              '01_华安证券_抗生素量价齐升布局制剂注入新动力_首次覆盖_2023-09-21.pdf': {
                  'broker': '华安证券',
                  'date': '2023-09-21',
                  'title': '抗生素量价齐升，布局制剂注入新动力',
                  'type': '公司深度/首次覆盖报告',
                  'index': 'AP202309211599679509',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202309211599679509_1.pdf',
              },
              '02_山西证券_抗菌原料药中间体主流企业产业链前后向延伸拐点将至_2023-05-16.pdf': {
                  'broker': '山西证券',
                  'date': '2023-05-16',
                  'title': '抗菌原料药中间体主流企业，产业链前、后向延伸拐点将至',
                  'type': '公司深度报告',
                  'index': 'AP202305161586669790',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202305161586669790_1.pdf',
              },
          }
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 2:
              raise SystemExit(f'Expected 2 PDFs, found {len(pdfs)}')

          lines = [
              '东亚药业（605177）券商深度报告资料包',
              '整理日期：2026-10-20',
              '',
              '收录原则：',
              '1. 收录公开可直接下载的长篇公司深度或首次覆盖报告。',
              '2. 排除3—5页的财报点评、新股询价报告、可转债价值分析和网页摘要。',
              '3. 公开个股研报索引共列出6份报告，其中符合长篇公司深度标准的为本包所收录的2份。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  PDF来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、精确页数、正文公司名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 2
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Dongya-Pharma-605177-broker-deep-reports-2
          path: 东亚药业_券商深度报告_2份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
