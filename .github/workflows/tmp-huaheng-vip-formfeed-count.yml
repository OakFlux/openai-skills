name: Temporary Huaheng alternate prospectus count

on:
  push:
    branches:
      - tmp/huaheng-biotech-filings-20260830
    paths:
      - .github/workflows/tmp-huaheng-vip-formfeed-count.yml

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          for u in [
            'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?id=7052638&stockid=688639',
            'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7052638&stockid=688639',
          ]:
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36'},timeout=90)
            r.encoding=r.apparent_encoding or 'gb18030'
            soup=BeautifulSoup(r.text,'lxml')
            node=soup.select_one('#content')
            raw=node.get_text('',strip=False)
            nums=[int(x.split('-')[-1]) for x in re.findall(r'1-1-\d+',raw)]
            print('URL',u,'STATUS',r.status_code,'RAW',len(raw),'FF',raw.count('\x0c'),'PAGES',len(raw.split('\x0c')),'MAX',max(nums or [0]),'NUMCOUNT',len(nums),'END',repr(raw[-500:]),flush=True)
          PY
