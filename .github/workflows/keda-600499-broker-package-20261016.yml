name: Build KEDA 600499 broker deep reports package 20261016

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keda-600499-broker-package-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package full reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='科达制造_600499_券商深度报告_完整版_3份_截至20261016'
          root=Path(package); root.mkdir(exist_ok=True)
          pdf_dir=root/'PDF原文'; pdf_dir.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'broker':'国金证券','date':'2025-05-23','analysts':'李阳、赵铭、王龙','rating':'买入',
              'title':'科达制造：建材出海第一股，非洲南美乘风破浪',
              'info_code':'AP202505231677756386','min_pages':24,
              'terms':['科达制造','建材出海第一股','非洲南美','乘风破浪'],
              'filename':'01_国金证券_科达制造_建材出海第一股非洲南美乘风破浪_公司深度报告_2025-05-23.pdf'
            },
            {
              'broker':'东吴证券','date':'2024-06-19','analysts':'黄诗涛、房大磊、石峰源、杨晓曦','rating':'买入',
              'title':'科达制造：领先掘金非洲建材蓝海，陶机主业仍具成长空间',
              'info_code':'AP202406191636682881','min_pages':30,
              'terms':['科达制造','非洲建材蓝海','陶机主业','成长空间'],
              'filename':'02_东吴证券_科达制造_领先掘金非洲建材蓝海陶机主业仍具成长空间_公司深度研究_2024-06-19.pdf'
            },
            {
              'broker':'民生证券','date':'2023-12-13','analysts':'李阳、李哲','rating':'推荐',
              'title':'科达制造深度报告：战投提锂，掘金非洲，出海蓬勃',
              'info_code':'AP202312131614087363','min_pages':24,
              'terms':['科达制造','深度报告','战投提锂','掘金非洲','出海蓬勃'],
              'filename':'03_民生证券_科达制造_战投提锂掘金非洲出海蓬勃_深度报告_2023-12-13.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept-Language':'zh-CN,zh;q=0.9'
          })

          def download(code:str):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf',
            ]
            last=None
            for url in urls:
              for attempt in range(6):
                try:
                  r=s.get(url,timeout=(25,300),allow_redirects=True,headers={
                    'User-Agent':s.headers['User-Agent'],
                    'Referer':'https://data.eastmoney.com/report/',
                    'Accept':'application/pdf,*/*;q=0.8'
                  })
                  last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                    return r.content,url,last
                except Exception as e:
                  last={'url':url,'error':repr(e)}
                time.sleep(1+attempt)
            raise RuntimeError(f'download failed {code}: {last}')

          manifest=[]
          for r in reports:
            data,url,download_meta=download(r['info_code'])
            dest=pdf_dir/r['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<r['min_pages']:
              raise RuntimeError(f'too few pages: {dest.name} {pages} < {r["min_pages"]}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(15,pages)])
            compact=re.sub(r'\s+','',text)
            if not any(x in compact for x in ['科达制造','600499','科达机电','科达洁能']):
              raise RuntimeError(f'issuer mismatch: {dest.name}')
            matched=[t for t in r['terms'] if re.sub(r'\s+','',t) in compact]
            if len(matched)<2:
              raise RuntimeError(f'title-keyword mismatch: {dest.name}; matched={matched}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError('preview failed: '+dest.name)
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **r,
              'source_report_page':f"https://data.eastmoney.com/report/info/{r['info_code']}.html",
              'pdf_url':url,
              'pages':pages,
              'bytes':len(data),
              'sha256':sha,
              'matched_terms':matched,
              'download_meta':download_meta,
              'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商原始完整PDF',
              'validation':['PDF header','issuer identity','title keywords','minimum page count','qpdf structure','first-page render']
            })

          readme=[
            '科达制造股份有限公司（600499.SH）券商深度报告完整版资料包',
            '整理基准日：2026-10-16',
            '',
            '本包收录3份可公开取得的券商原始完整PDF，均为长篇公司深度报告，不是网页预览或摘要重制文件。',
            '筛选原则：优先较新报告、不同券商、完整页数较长，并排除业绩快评、季度点评和短篇事件点评。',
            ''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['pages']}页；文件：PDF原文/{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",
              ''
            ]
          readme += [
            '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、标题关键词、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  PDF原文/{x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3:
              raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          short=Path('keda_600499_broker_deep_reports_3.zip')
          short.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: keda-600499-broker-deep-reports-final-20261016
          path: |
            科达制造_600499_券商深度报告_完整版_3份_截至20261016.zip
            keda_600499_broker_deep_reports_3.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
