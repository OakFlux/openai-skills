name: Temporary Aixin Yuanzhi broker report search

on:
  push:
    branches:
      - tmp-aixin-reports-search-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public report index
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          import requests

          out = Path('output')
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/report',
              'Content-Type': 'application/json;charset=UTF-8',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'zh-CN,zh;q=0.9',
          })
          endpoint = 'https://api.sdyanbao.com/api/file/search'
          queries = ['爱芯元智', '00600', '0600.HK', '爱芯元智 首次覆盖', '爱芯元智 研报']
          collected = {}
          raw_responses = []

          for query in queries:
              for page in range(1, 11):
                  body = {
                      'device': 1,
                      'hideTrader': 0,
                      'onlyTitle': 0,
                      'order': 1,
                      'page': page,
                      'pageSize': 100,
                      'pageCount': 0,
                      'dateRange': 0,
                      'startTime': '',
                      'endTime': '',
                      'typeIds': '',
                      'industryIds': '',
                      'keyword': query,
                  }
                  response = session.post(endpoint, json=body, timeout=90)
                  print('QUERY', query, 'PAGE', page, 'STATUS', response.status_code, 'BYTES', len(response.content), flush=True)
                  response.raise_for_status()
                  obj = response.json()
                  raw_responses.append({'query': query, 'page': page, 'response': obj})
                  data = obj.get('data') or {}
                  files = data.get('files') or []
                  print('FILES', len(files), 'TOTAL', data.get('total'), data.get('totalFile'), flush=True)
                  if not files:
                      break
                  for item in files:
                      item_id = str(item.get('id') or item.get('original_id') or '')
                      if not item_id:
                          continue
                      title = str(item.get('name') or '')
                      stock = item.get('stock') or {}
                      stock_name = str(stock.get('name') or '')
                      stock_code = str(stock.get('code') or '')
                      joined = ''.join((title, stock_name, stock_code)).replace(' ', '')
                      is_target = (
                          '爱芯元智' in joined
                          or stock_code in {'00600', '0600', '00600.HK', '0600.HK'}
                          or ('600.HK' in joined and '爱芯' in joined)
                      )
                      if is_target:
                          collected[item_id] = item
                          summary = {key: item.get(key) for key in [
                              'id', 'name', 'page_count', 'size', 'time_text', 'create_time',
                              'original_id', 'page_url', 'share_url', 'file_size', 'status'
                          ]}
                          summary['organization'] = item.get('organization')
                          summary['type'] = item.get('type')
                          summary['stock'] = item.get('stock')
                          print('TARGET', json.dumps(summary, ensure_ascii=False), flush=True)
                  if len(files) < 100:
                      break
                  time.sleep(0.15)

          targets = list(collected.values())
          targets.sort(key=lambda x: (str(x.get('time_text') or ''), int(x.get('page_count') or 0)), reverse=True)
          (out / 'targets.json').write_text(json.dumps(targets, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'raw_responses.json').write_text(json.dumps(raw_responses, ensure_ascii=False), encoding='utf-8')
          print('TARGET_COUNT', len(targets), flush=True)
          print(json.dumps(targets, ensure_ascii=False, indent=2), flush=True)
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-report-search-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
