name: Build Shanghai Hugong 603131 reports package

on:
  push:
    branches:
      - tmp-shanghai-hugong-603131-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf beautifulsoup4

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='上海沪工_603131_2020-2025年报及最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/shanghai_hugong_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('上海沪工_603131_2020-2025年报及最新季报')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def sina_pdf(year: int, month: int, day: int, doc_id: int) -> str:
              return (
                  'https://file.finance.sina.com.cn/211.154.219.97%3A9494/'
                  f'MRGG/CNSESH_STOCK/{year}/{year}-{month}/{year}-{month:02d}-{day:02d}/{doc_id}.PDF'
              )

          documents = [
              {
                  'order': 1, 'kind': 'annual', 'year': 2020,
                  'title': '2020年年度报告', 'date': '2021-04-29',
                  'file': '01_上海沪工_2020年年度报告.pdf', 'min_pages': 100,
                  'detail': 'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/603131/page_type/ndbg.phtml',
                  'urls': [
                      sina_pdf(2021, 4, 29, 7174429),
                      sina_pdf(2021, 4, 29, 7174431),
                      sina_pdf(2021, 4, 29, 7174428),
                      sina_pdf(2021, 4, 29, 7174432),
                  ],
              },
              {
                  'order': 2, 'kind': 'annual', 'year': 2021,
                  'title': '2021年年度报告', 'date': '2022-04-26',
                  'file': '02_上海沪工_2021年年度报告.pdf', 'min_pages': 100,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8078887&stockid=603131',
                  'urls': [sina_pdf(2022, 4, 26, 8078887)],
              },
              {
                  'order': 3, 'kind': 'annual', 'year': 2022,
                  'title': '2022年年度报告', 'date': '2023-04-26',
                  'file': '03_上海沪工_2022年年度报告.pdf', 'min_pages': 100,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9082298&stockid=603131',
                  'urls': [sina_pdf(2023, 4, 26, 9082298)],
              },
              {
                  'order': 4, 'kind': 'annual', 'year': 2023,
                  'title': '2023年年度报告', 'date': '2024-04-27',
                  'file': '04_上海沪工_2023年年度报告.pdf', 'min_pages': 100,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10099147&stockid=603131',
                  'urls': [sina_pdf(2024, 4, 27, 10099147)],
              },
              {
                  'order': 5, 'kind': 'annual', 'year': 2024,
                  'title': '2024年年度报告', 'date': '2025-04-25',
                  'file': '05_上海沪工_2024年年度报告.pdf', 'min_pages': 100,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10956734&stockid=603131',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-25/10956734.PDF',
                  ],
              },
              {
                  'order': 6, 'kind': 'annual', 'year': 2025,
                  'title': '2025年年度报告', 'date': '2026-04-22',
                  'file': '06_上海沪工_2025年年度报告.pdf', 'min_pages': 100,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12130308&stockid=603131',
                  'urls': [sina_pdf(2026, 4, 22, 12130308)],
              },
              {
                  'order': 7, 'kind': 'quarter', 'year': 2026,
                  'title': '2026年第三季度报告', 'date': '2026-10-28',
                  'file': '07_上海沪工_2026年第三季度报告.pdf', 'min_pages': 5,
                  'detail': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12666063&stockid=603131',
                  'urls': [sina_pdf(2026, 10, 28, 12666063)],
              },
          ]

          def extract_pdf_urls(page_url: str) -> list[str]:
              urls: list[str] = []
              try:
                  r = session.get(page_url, timeout=(20, 120), allow_redirects=True)
                  if r.status_code != 200:
                      return []
                  r.encoding = r.apparent_encoding or r.encoding or 'utf-8'
                  decoded = html.unescape(r.text).replace('\\/', '/')
                  soup = BeautifulSoup(decoded, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = html.unescape(a.get('href', '')).strip().replace('\\/', '/')
                      label = re.sub(r'\s+', '', a.get_text(' ', strip=True))
                      if '.pdf' in href.lower() or '下载公告' in label or '下载PDF' in label or '查看PDF' in label:
                          urls.append(urljoin(r.url, href))
                  for m in re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?', decoded, flags=re.I):
                      urls.append(html.unescape(m))
              except Exception as exc:
                  print('DETAIL_EXTRACTION_FAILED', page_url, repr(exc))
              normalized = []
              seen = set()
              for url in urls:
                  if url.startswith('//'):
                      url = 'https:' + url
                  if url.startswith('http://'):
                      url = 'https://' + url[7:]
                  if url not in seen:
                      seen.add(url)
                      normalized.append(url)
              return normalized

          def inspect(path: Path, document: dict) -> int:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < int(document['min_pages']):
                  raise RuntimeError(f'page count below minimum: {pages}')
              idxs = list(range(min(20, pages)))
              if pages > 20:
                  idxs.append(pages - 1)
              text = ''
              for idx in dict.fromkeys(idxs):
                  try:
                      text += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '上海沪工' not in compact and '上海沪工焊接集团股份有限公司' not in compact:
                  raise RuntimeError('company name mismatch')
              if document['kind'] == 'annual':
                  year = str(document['year'])
                  if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                      raise RuntimeError('annual title mismatch')
                  if '年度报告摘要' in compact[:600]:
                      raise RuntimeError('annual report summary, not full report')
              else:
                  if ('第三季度报告' not in compact and '三季度报告' not in compact) or '2026' not in compact:
                      raise RuntimeError('quarter title mismatch')
              return pages

          def download(document: dict) -> dict:
              destination = out / document['file']
              candidates = list(document.get('urls', []))
              candidates.extend(extract_pdf_urls(document['detail']))
              candidates = list(dict.fromkeys(candidates))
              last = None
              for url in candidates:
                  for attempt in range(3):
                      try:
                          r = session.get(
                              url,
                              headers={
                                  'Referer': document['detail'],
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360), allow_redirects=True,
                          )
                          data = r.content
                          if r.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(
                                  f'HTTP={r.status_code}, bytes={len(data)}, type={r.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          pages = inspect(destination, document)
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', document['title'], 'pages=', pages, 'bytes=', len(data), 'source=', r.url, 'sha256=', sha)
                          return {**document, 'pages': pages, 'bytes': len(data), 'source': r.url, 'sha256': sha}
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', document['title'], url, repr(exc))
                          time.sleep(min(1 + attempt, 3))
              raise RuntimeError(f'Could not download {document["title"]}: {last!r}')

          records = [download(doc) for doc in documents]
          records.sort(key=lambda x: x['order'])

          lines = [
              '上海沪工（603131）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：',
              '1. 2020-2025年度报告全文，共6份，不含年度报告摘要。',
              '2. 最新季报为2026年10月28日披露的2026年第三季度报告。',
              '3. 文件均为公开披露PDF原件；优先采用公告附件或公开镜像，并通过公司名称、报告期、页数和PDF结构核验。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['file']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   原始PDF：{item['source']}",
                  f"   公告/索引页：{item['detail']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['file']}")
          lines += [
              f'合计：7份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '上海沪工|上海沪工焊接集团股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/shanghai_hugong_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/shanghai_hugong_test.zip "$PACKAGE"
          unzip -t /tmp/shanghai_hugong_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/shanghai_hugong_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/shanghai_hugong_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Shanghai-Hugong-603131-2020-2025-annual-reports-latest-quarter
          path: 上海沪工_603131_2020-2025年报及最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
