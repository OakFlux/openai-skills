name: Greentown Sina correct report API

on:
  push:
    branches:
      - chatgpt-temp-greentown-yanbaoke-20260829

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query official public report detail endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          import requests

          out = Path('out_sina')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://stock.finance.sina.com.cn/'})
          ids = [
              '841236720416','841219615755','841160638243','841229994401','841136512766','841135613114',
              '809383920516','809382679482','809381611550',
              '796957128518','800631919576','808561860344',
          ]
          results=[]
          for rid in ids:
              url=f'https://quotes.sina.cn/hk/api/openapi.php/HK_ReportService.getShow?rptid={rid}&simple=1'
              try:
                  r=s.get(url,timeout=30)
                  text=r.text
                  print('\nRID',rid,'status',r.status_code,'len',len(r.content),'ctype',r.headers.get('content-type'))
                  print(text[:20000])
                  try: data=r.json()
                  except Exception: data={'raw':text}
                  results.append({'rid':rid,'url':url,'status':r.status_code,'data':data})
                  for match in sorted(set(re.findall(r'https?://[^\s"\'<>\\]+',text))):
                      if any(k in match.lower() for k in ['pdf','download','file','report']): print('URL',match)
              except Exception as exc:
                  results.append({'rid':rid,'url':url,'error':repr(exc)})
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: greentown-sina-correct-api
          path: out_sina/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
