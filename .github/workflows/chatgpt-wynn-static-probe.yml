name: Static probe public Wynn Macau report sources

on:
  push:
    branches:
      - chatgpt-temp-wynn-macau-quick-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Inspect sites and public endpoints
        shell: bash
        run: |
          cat > /tmp/static_probe.py <<'PY'
          from __future__ import annotations
          import io, json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path('wynn_static_output'); OUT.mkdir(exist_ok=True)
          PDF=OUT/'pdfs'; PDF.mkdir(exist_ok=True)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          LOG=[]
          def log(*x):
              t=' '.join(str(i) for i in x); LOG.append(t); print(t,flush=True)
          def safe(s): return re.sub(r'[^A-Za-z0-9_.-]+','_',s)[:160]
          def get(url, **kw):
              try:
                  r=S.get(url,timeout=45,allow_redirects=True,**kw)
                  log('GET',r.status_code,r.url,r.headers.get('content-type'),len(r.content))
                  return r
              except Exception as e:
                  log('GETERR',url,repr(e)); return None
          def validate(data,url,name):
              if len(data)<15000 or b'%PDF' not in data[:4096]: return False
              try:
                  rd=PdfReader(io.BytesIO(data),strict=False); n=len(rd.pages)
                  txt=''
                  for p in rd.pages[:4]:
                      try: txt+=(p.extract_text() or '')+'\n'
                      except: pass
                  relevant=('永利澳门' in txt or '永利澳門' in txt or 'Wynn Macau' in txt or '1128' in txt)
                  f=PDF/name; f.write_bytes(data)
                  (PDF/(name+'.json')).write_text(json.dumps({'url':url,'pages':n,'bytes':len(data),'relevant':relevant,'head':txt[:3000]},ensure_ascii=False,indent=2),encoding='utf-8')
                  log('PDF',name,'pages',n,'bytes',len(data),'relevant',relevant,url)
                  return True
              except Exception as e: log('PDFERR',url,repr(e)); return False

          pages={
            'sdy_888721':'https://www.sdyanbao.com/detail/888721',
            'sdy_856304':'https://www.sdyanbao.com/detail/856304',
            'sgp_label':'https://www.sgpjbg.com/labels/yonglidichanfazhannianbao.html',
            'nxny_stock':'https://www.nxny.com/stock/stock_01128/',
            'fxb_4442715':'https://www.fxbaogao.com/detail/4442715',
            'fxb_4296230':'https://www.fxbaogao.com/detail/4296230',
          }
          discovered=[]
          api_strings=set()
          exact_sgp=[]
          exact_nx=[]
          for key,url in pages.items():
              r=get(url)
              if not r: continue
              (OUT/f'{key}.html').write_bytes(r.content)
              if validate(r.content,r.url,f'{key}.pdf'): continue
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              log('TITLE',key,title)
              entries=[]
              for tag in soup.find_all(True):
                  attrs={k:(' '.join(v) if isinstance(v,list) else str(v)) for k,v in tag.attrs.items()}
                  tx=' '.join(tag.get_text(' ',strip=True).split())[:500]
                  blob=(tx+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                  if any(w in blob for w in ('下载','download','pdf','file','report','永利澳门','永利澳門')):
                      entries.append({'tag':tag.name,'text':tx,'attrs':attrs})
                  for a in ('href','src','data-url','data-href','data-file','data-pdf','action'):
                      if a in attrs:
                          u=urllib.parse.urljoin(r.url,attrs[a])
                          if any(w in u.lower() for w in ('pdf','download','report','bgdown','detail','file')):
                              discovered.append((key,u,tx))
                  if key=='sgp_label' and ('VIP疲弱' in tx or '永利澳门（1128.HK）' in tx):
                      h=attrs.get('href')
                      if h: exact_sgp.append(urllib.parse.urljoin(r.url,h))
                  if key=='nxny_stock' and any(w in tx for w in ('VIP疲弱','GGR与EBITDA','2025澳门博彩展望','24Q4博彩业务')):
                      h=attrs.get('href')
                      if h: exact_nx.append(urllib.parse.urljoin(r.url,h))
              (OUT/f'{key}_elements.json').write_text(json.dumps(entries,ensure_ascii=False,indent=2),encoding='utf-8')
              for e in entries[:300]: log('EL',key,json.dumps(e,ensure_ascii=False)[:1400])
              # inline URLs and escaped URLs
              for u in re.findall(r'https?:(?:\\/\\/|//)[^\"\'<>\s]+',text):
                  u=u.replace('\\/','/')
                  if any(w in u.lower() for w in ('pdf','download','report','file')): discovered.append((key,u,''))
              # scripts
              for idx,sc in enumerate(soup.find_all('script')):
                  if sc.get('src'):
                      jsurl=urllib.parse.urljoin(r.url,sc['src']); jr=get(jsurl)
                      if not jr: continue
                      body=jr.text; (OUT/f'{key}_script_{idx:02d}.js').write_bytes(jr.content)
                  else:
                      body=sc.get_text() or ''
                      if body: (OUT/f'{key}_inline_{idx:02d}.js').write_text(body,encoding='utf-8')
                  if not body: continue
                  for m in re.finditer(r'(?i)(download|pdf|fileurl|file_url|reporturl|report_url|/api/)',body):
                      a=max(0,m.start()-500); b=min(len(body),m.start()+1200)
                      snip=body[a:b]
                      log('SNIP',key,snip[:1800].replace('\n',' '))
                  for ap in re.findall(r'[\"\']([^\"\']*(?:/api/|download|pdf)[^\"\']*)[\"\']',body,re.I):
                      if len(ap)<1000: api_strings.add((r.url,ap))
                  for u in re.findall(r'https?:(?:\\/\\/|//)[^\"\'<>\s]+',body):
                      u=u.replace('\\/','/')
                      if any(w in u.lower() for w in ('pdf','download','report','file')): discovered.append((key,u,''))

          # Follow exact detail pages found on listing pages.
          for i,u in enumerate(dict.fromkeys(exact_sgp+exact_nx)):
              r=get(u)
              if not r: continue
              (OUT/f'detail_{i:02d}.html').write_bytes(r.content)
              log('DETAILTITLE',u,BeautifulSoup(r.text,'html.parser').title)
              if validate(r.content,r.url,f'detail_{i:02d}.pdf'): continue
              soup=BeautifulSoup(r.text,'html.parser')
              for tag in soup.find_all(True):
                  tx=' '.join(tag.get_text(' ',strip=True).split())[:500]
                  for a in ('href','src','data-url','data-href','data-file','data-pdf','action'):
                      if tag.get(a):
                          x=urllib.parse.urljoin(r.url,str(tag.get(a)))
                          if any(w in (tx+' '+x).lower() for w in ('下载','download','pdf','file','report','bgdown')):
                              discovered.append(('detail',x,tx)); log('DETAIL_EL',tx[:600],x)

          # Probe discovered direct-looking public URLs.
          seen=set(); n=0
          for key,u,tx in discovered:
              u=u.strip('\\\"\' ,;')
              if not u.startswith('http') or u in seen: continue
              seen.add(u)
              if len(u)>2000: continue
              if not any(w in u.lower() for w in ('.pdf','download','bgdown','file','report')): continue
              r=get(u,headers={'Referer':pages.get(key,pages['sdy_888721'])})
              if not r: continue
              ctype=(r.headers.get('content-type') or '').lower()
              if validate(r.content,r.url,f'discovered_{n:03d}.pdf'): n+=1
              else:
                  (OUT/f'discovered_{n:03d}_{safe(key)}.bin').write_bytes(r.content[:300000])
                  log('NONPDF',key,u,'=>',r.status_code,r.url,ctype,len(r.content),repr(r.content[:120]))
                  n+=1
              if n>120: break

          # Probe public API strings inferred from scripts, without authentication.
          ids=['888721','856304','4442715','4296230']
          apilog=[]
          for base,ap in list(api_strings)[:300]:
              if len(ap)>700: continue
              candidates=[]
              if ap.startswith('http'): candidates=[ap]
              elif ap.startswith('/'): candidates=[urllib.parse.urljoin(base,ap)]
              else: continue
              for raw in candidates:
                  for rid in ids:
                      variants=[raw.replace('${id}',rid).replace('{id}',rid).replace(':id',rid)]
                      if '?' not in raw:
                          variants += [raw+'?id='+rid,raw+'?reportId='+rid,raw+'?report_id='+rid]
                      for u in variants:
                          if u in seen: continue
                          seen.add(u)
                          r=get(u,headers={'Referer':base,'Accept':'application/json,application/pdf,*/*'})
                          if not r: continue
                          rec={'url':u,'status':r.status_code,'final':r.url,'type':r.headers.get('content-type'),'size':len(r.content),'head':repr(r.content[:160])}
                          apilog.append(rec); log('API',json.dumps(rec,ensure_ascii=False))
                          validate(r.content,r.url,f'api_{safe(rid)}_{len(apilog):03d}.pdf')
                          if len(apilog)>160: break
                      if len(apilog)>160: break
                  if len(apilog)>160: break
              if len(apilog)>160: break
          (OUT/'api_probe.json').write_text(json.dumps(apilog,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'discovered_urls.json').write_text(json.dumps([{'source':a,'url':b,'text':c} for a,b,c in discovered],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'static_probe.log').write_text('\n'.join(LOG),encoding='utf-8')
          metas=[]
          for p in PDF.glob('*.json'):
              try: metas.append(json.loads(p.read_text('utf-8')))
              except: pass
          (OUT/'pdf_summary.json').write_text(json.dumps(metas,ensure_ascii=False,indent=2),encoding='utf-8')
          log('DONE PDFs',len(metas))
          PY
          python /tmp/static_probe.py
      - name: Upload static probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wynn_Macau_Static_Probe
          path: wynn_static_output
          retention-days: 2
          if-no-files-found: error
