name: Archive FXBaogao frontend assets for Henghe reports

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-fxbaogao-assets-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch pages and scripts
        run: |
          python - <<'PY'
          import hashlib,json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin,urlparse

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages=['https://www.fxbaogao.com/view?id=3760192','https://www.fxbaogao.com/pdf?id=3760192','https://www.fxbaogao.com/report?keyword=%E6%A8%AA%E6%B2%B3%E7%B2%BE%E5%AF%86','https://www.fxbaogao.com/']
          scripts=[]; manifest={'pages':[],'scripts':[]}
          for i,u in enumerate(pages):
            r=s.get(u,timeout=60); print('PAGE',i,r.status_code,len(r.content),r.url,r.headers.get('content-type')); r.raise_for_status(); r.encoding=r.apparent_encoding or r.encoding
            p=out/f'page_{i}.html'; p.write_text(r.text,encoding='utf-8')
            soup=BeautifulSoup(r.text,'html.parser'); srcs=[]
            for tag in soup.find_all('script',src=True):
              su=urljoin(r.url,tag['src']); srcs.append(su)
              if su not in scripts: scripts.append(su)
            manifest['pages'].append({'url':r.url,'file':p.name,'title':soup.title.get_text(' ',strip=True) if soup.title else '','scripts':srcs})
          for i,u in enumerate(scripts):
            try:
              r=s.get(u,timeout=90); print('SCRIPT',i,r.status_code,len(r.content),u,r.headers.get('content-type'))
              if r.status_code!=200 or len(r.content)>20_000_000: continue
              name=urlparse(u).path.rsplit('/',1)[-1] or f'script_{i}.js'; name=re.sub(r'[^A-Za-z0-9._-]','_',name)
              p=out/f'{i:03d}_{name}'; p.write_bytes(r.content)
              manifest['scripts'].append({'url':u,'file':p.name,'size':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
            except Exception as e: print('SCRIPT_ERROR',u,repr(e))
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FILES',[(p.name,p.stat().st_size) for p in out.iterdir()])
          PY
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: henghe-300539-fxbaogao-assets-20261021
          path: out
          compression-level: 6
          retention-days: 7
