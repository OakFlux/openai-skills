name: Temporary Pingtan Development source discovery v2

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-source-discovery-v2.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Search report indexes and historical pages
        run: |
          mkdir -p out/pages
          python - <<'PY'
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('out'); P=OUT/'pages'
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5',
          })
          logs=[]; candidates=[]; seen=set()
          def note(*a):
              x=' '.join(str(v) for v in a); print(x,flush=True); logs.append(x)
          def decode_resp(r):
              enc=r.apparent_encoding or r.encoding or 'utf-8'
              try:return r.content.decode(enc,'replace')
              except:return r.content.decode('utf-8','replace')
          def add(url,title='',snippet='',source=''):
              if not url: return
              url=html.unescape(url).replace('\\/','/').strip().rstrip(').,;')
              if url.startswith('//'): url='https:'+url
              if not url.startswith(('http://','https://')): return
              # Decode Bing redirect links.
              try:
                  q=parse_qs(urlparse(url).query)
                  if 'u' in q and q['u']:
                      v=q['u'][0]
                      if v.startswith('a1'): v=v[2:]
                      # Bing sometimes base64-url encodes; leave raw when not easy.
                  if 'url' in q and q['url'] and q['url'][0].startswith('http'):
                      url=unquote(q['url'][0])
              except: pass
              k=url.split('#')[0]
              if k in seen:return
              seen.add(k); candidates.append({'url':url,'title':title,'snippet':snippet,'source':source})
              note('CANDIDATE',source,title[:100],url)

          # 1) Direct Sina report list variants.
          list_urls=[]
          hosts=['https://vip.stock.finance.sina.com.cn','https://stock.finance.sina.com.cn','http://vip.stock.finance.sina.com.cn','http://stock.finance.sina.com.cn']
          paths=[
             '/q/go.php/vReport_List/kind/search/index.phtml?symbol=sz000592&t1=all',
             '/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz000592&t1=all',
             '/q/go.php/vReport_List/kind/search/index.phtml?symbol=000592&t1=all',
             '/stock/go.php/vReport_List/kind/search/index.phtml?symbol=000592&t1=all',
             '/q/go.php/vReport_List/kind/search/index.phtml?symbol=sz000592',
             '/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz000592',
          ]
          for h in hosts:
              for p in paths:list_urls.append(h+p)
          for idx,u in enumerate(list_urls):
              try:
                  r=s.get(u,timeout=45,allow_redirects=True)
                  text=decode_resp(r)
                  note('SINA_LIST',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                  (P/f'sina_{idx}.html').write_text(text,encoding='utf-8',errors='ignore')
                  soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a['href']); label=' '.join(a.stripped_strings)
                      if any(k in href.lower() for k in ['vreport','rptid','report']) or any(k in label for k in ['中福','平潭','研报','报告']):
                          add(href,label,'','sina-list')
                  for m in re.finditer(r'(?:rptid/|rptid=)(\d+)',text,re.I):
                      rid=m.group(1)
                      add(f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',f'Sina rptid {rid}','','sina-list-regex')
              except Exception as e: note('SINA_ERR',u,repr(e))

          # 2) Public search engines. Exact aliases and titles matter.
          queries=[
             '"中福实业" 研报 PDF',
             '"福建中福" 研报 PDF',
             '"平潭发展" 券商 研报 PDF',
             '"000592" 研报 PDF',
             '"000592" "公司研究"',
             '"依托林业资产分享平潭政策红利"',
             'site:vip.stock.finance.sina.com.cn/q/go.php/vReport_Show "中福实业"',
             'site:stock.finance.sina.com.cn/stock/go.php/vReport_Show "中福实业"',
             'site:hibor.com.cn/repinfodetail "中福实业"',
             'site:wap.hibor.com.cn/repinfodetail "中福实业"',
             'site:pdf.dfcfw.com 000592',
             'site:reportapi.eastmoney.com 000592',
          ]
          engines=[
             ('bing','https://www.bing.com/search?q={q}&count=50'),
             ('ddg','https://html.duckduckgo.com/html/?q={q}'),
             ('baidu','https://www.baidu.com/s?wd={q}&rn=50'),
          ]
          for qi,q in enumerate(queries):
              for en,tpl in engines:
                  u=tpl.format(q=quote_plus(q))
                  try:
                      time.sleep(.8)
                      r=s.get(u,timeout=45,headers={'Referer':'https://www.bing.com/'})
                      text=decode_resp(r)
                      note('SEARCH',en,qi,r.status_code,len(r.content),q)
                      (P/f'{en}_{qi}.html').write_text(text,encoding='utf-8',errors='ignore')
                      soup=BeautifulSoup(text,'lxml')
                      if en=='bing':
                          for li in soup.select('li.b_algo'):
                              a=li.select_one('h2 a[href]')
                              if not a: continue
                              sn=' '.join((li.select_one('.b_caption') or li).stripped_strings)
                              add(a.get('href'),' '.join(a.stripped_strings),sn,en)
                      elif en=='ddg':
                          for a in soup.select('a.result__a[href]'):
                              parent=a.find_parent(class_=re.compile('result'))
                              sn=' '.join(parent.stripped_strings) if parent else ''
                              add(a.get('href'),' '.join(a.stripped_strings),sn,en)
                      else:
                          for a in soup.select('h3 a[href]'):
                              parent=a.find_parent(class_=re.compile('result'))
                              sn=' '.join(parent.stripped_strings) if parent else ''
                              add(a.get('href'),' '.join(a.stripped_strings),sn,en)
                      # Generic links that visibly contain target aliases or report identifiers.
                      for a in soup.find_all('a',href=True):
                          label=' '.join(a.stripped_strings)
                          href=urljoin(r.url,a['href'])
                          if any(k in (label+href) for k in ['中福实业','福建中福','平潭发展','000592','vReport_Show','repinfodetail']):
                              add(href,label,'',en+'-generic')
                  except Exception as e: note('SEARCH_ERR',en,q,repr(e))

          # 3) Fetch high-value candidate pages and extract nested links/report metadata.
          fetched=[]
          for i,c in enumerate(list(candidates)[:300]):
              u=c['url']
              if not any(h in u for h in ['sina.com.cn','hibor.com.cn','9fzt.com','eastmoney.com','dfcfw.com','stockstar.com','sohu.com','hexun.com']):
                  continue
              try:
                  time.sleep(.45)
                  r=s.get(u,timeout=45,allow_redirects=True)
                  text=decode_resp(r)
                  rec={'requested':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'title':c.get('title'),'prefix':text[:1500]}
                  fetched.append(rec); note('FETCH',r.status_code,len(r.content),r.url)
                  (P/f'candidate_{i}.html').write_text(text,encoding='utf-8',errors='ignore')
                  soup=BeautifulSoup(text,'lxml')
                  page_title=(soup.title.get_text(' ',strip=True) if soup.title else '')
                  body=' '.join(soup.stripped_strings)[:6000]
                  for a in soup.find_all(['a','iframe','embed','object'],href=True):
                      href=urljoin(r.url,a.get('href')); label=' '.join(a.stripped_strings)
                      if any(k in (href+label).lower() for k in ['.pdf','download','attach','rptid','vreport','report','原文']):
                          add(href,label,body[:1000],'nested')
                  for tag in soup.find_all(['iframe','embed','object']):
                      for attr in ['src','data']:
                          if tag.get(attr): add(urljoin(r.url,tag.get(attr)),page_title,body[:1000],'nested-media')
                  raw=html.unescape(text).replace('\\/','/')
                  for link in re.findall(r'https?://[^\s"\'<>]+',raw,re.I):
                      if any(k in link.lower() for k in ['.pdf','download','attach','rptid','report']): add(link,page_title,body[:1000],'nested-regex')
              except Exception as e: note('FETCH_ERR',u,repr(e))

          (OUT/'candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'fetched.json').write_text(json.dumps(fetched,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          note('DONE','CANDIDATES',len(candidates),'FETCHED',len(fetched))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-source-discovery-v2
          path: out/
          if-no-files-found: error
          retention-days: 3
