name: Build RoboSense verified report archives
on:
  push:
    branches:
      - tmp-robosense-final-reports-20260914
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet 'httpx[http2]' pypdf pymupdf
      - name: Download, verify and package official HKEX reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/pdfs work/renders
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import shutil
          import time
          import zipfile
          from pathlib import Path

          import httpx
          import pymupdf
          from pypdf import PdfReader

          OUT = Path('output')
          PDFDIR = Path('work/pdfs')
          RENDERDIR = Path('work/renders')
          for p in [OUT, PDFDIR, RENDERDIR]:
              p.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'seq': 1,
                  'filename': '01_RoboSense_2023_Annual_Report.pdf',
                  'type': '年度报告',
                  'period': '2023',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0426/2024042600628.pdf',
                  'min_pages': 100,
                  'tokens': ['2023', 'ANNUAL REPORT'],
              },
              {
                  'seq': 2,
                  'filename': '02_RoboSense_2024_Annual_Report.pdf',
                  'type': '年度报告',
                  'period': '2024',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0428/2025042800961.pdf',
                  'min_pages': 100,
                  'tokens': ['2024', 'ANNUAL REPORT'],
              },
              {
                  'seq': 3,
                  'filename': '03_RoboSense_2025_Annual_Report.pdf',
                  'type': '年度报告',
                  'period': '2025',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0424/2026042400954.pdf',
                  'min_pages': 100,
                  'tokens': ['2025', 'ANNUAL REPORT'],
              },
              {
                  'seq': 4,
                  'filename': '04_RoboSense_Final_Prospectus_2023-12-27.pdf',
                  'type': '正式招股章程',
                  'period': '2024上市',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2023/1227/2023122700027.pdf',
                  'min_pages': 400,
                  'tokens_any': ['GLOBAL OFFERING', 'HOW TO APPLY', 'PROSPECTUS'],
              },
              {
                  'seq': 5,
                  'filename': '05_RoboSense_2026_Q1_Unaudited_Results.pdf',
                  'type': '第一季度报告',
                  'period': '2026Q1',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0527/2026052701304.pdf',
                  'min_pages': 10,
                  'tokens': ['FIRST QUARTER OF 2026'],
              },
              {
                  'seq': 6,
                  'filename': '06_RoboSense_2026_Interim_Results.pdf',
                  'type': '最新中期业绩公告',
                  'period': '2026H1',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0826/2026082601087.pdf',
                  'min_pages': 20,
                  'tokens': ['INTERIM RESULTS', '2026'],
              },
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000211551',
          }

          def normalise(text: str) -> str:
              return re.sub(r'\s+', ' ', text or '').upper()

          manifest = []
          with httpx.Client(http2=True, timeout=600, follow_redirects=True, headers=headers) as client:
              for spec in reports:
                  path = PDFDIR / spec['filename']
                  last_error = None
                  for attempt in range(1, 9):
                      try:
                          print('DOWNLOAD', spec['seq'], attempt, spec['url'], flush=True)
                          with client.stream('GET', spec['url']) as response:
                              response.raise_for_status()
                              sha = hashlib.sha256()
                              size = 0
                              with path.open('wb') as f:
                                  for chunk in response.iter_bytes(chunk_size=1024 * 1024):
                                      if not chunk:
                                          continue
                                      f.write(chunk)
                                      sha.update(chunk)
                                      size += len(chunk)
                          if size < 80_000 or b'%PDF-' not in path.read_bytes()[:2048]:
                              raise RuntimeError(f'Invalid PDF payload: {size} bytes')

                          reader = PdfReader(str(path), strict=False)
                          pages = len(reader.pages)
                          if pages < spec['min_pages']:
                              raise RuntimeError(f'Unexpected page count: {pages} < {spec["min_pages"]}')

                          sample_indices = sorted(set(
                              list(range(min(15, pages)))
                              + [max(0, pages // 2), max(0, pages - 3), max(0, pages - 2), pages - 1]
                          ))
                          sample_parts = []
                          for index in sample_indices:
                              try:
                                  sample_parts.append(reader.pages[index].extract_text() or '')
                              except Exception:
                                  pass
                          text = normalise('\n'.join(sample_parts))
                          if not any(token in text for token in [
                              'ROBOSENSE TECHNOLOGY', 'ROBOSENSE', '速騰聚創', '速腾聚创',
                              'STOCK CODE: 2498', 'STOCK CODE : 2498'
                          ]):
                              raise RuntimeError('Company identity not found')
                          for token in spec.get('tokens', []):
                              if normalise(token) not in text:
                                  raise RuntimeError(f'Missing report token: {token}')
                          if spec.get('tokens_any') and not any(normalise(token) in text for token in spec['tokens_any']):
                              raise RuntimeError('Prospectus identity token not found')

                          doc = pymupdf.open(path)
                          render_indices = sorted(set([0, min(1, len(doc)-1), max(0, len(doc)//2)]))
                          for render_index in render_indices:
                              pix = doc[render_index].get_pixmap(matrix=pymupdf.Matrix(0.9, 0.9), alpha=False)
                              png = RENDERDIR / f"{spec['seq']:02d}_{render_index:04d}.png"
                              pix.save(str(png))
                              if png.stat().st_size < 1500:
                                  raise RuntimeError(f'Render check failed: {png}')
                          doc.close()

                          manifest.append({
                              '序号': spec['seq'],
                              '文件名': path.name,
                              '报告类型': spec['type'],
                              '报告期间': spec['period'],
                              'PDF页数': pages,
                              '文件大小（字节）': size,
                              'SHA-256': sha.hexdigest(),
                              '港交所官方来源': spec['url'],
                          })
                          print('VERIFIED', path.name, pages, size, flush=True)
                          break
                      except Exception as exc:
                          last_error = exc
                          print('RETRY', spec['seq'], attempt, repr(exc), flush=True)
                          path.unlink(missing_ok=True)
                          time.sleep(min(2 ** attempt, 30))
                  else:
                      raise RuntimeError(f"Failed {spec['filename']}: {last_error!r}")

          if len(manifest) != len(reports):
              raise RuntimeError(f'Expected {len(reports)} PDFs, verified {len(manifest)}')

          csv_path = PDFDIR / '文件清单与校验值.csv'
          with csv_path.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=list(manifest[0].keys()))
              writer.writeheader()
              writer.writerows(manifest)

          readme_lines = [
              'RoboSense Technology Co., Ltd（速腾聚创，02498.HK）官方报告资料包',
              '打包日期：2026-09-14',
              '',
              '收录内容：',
              '1. 上市后全部完整年度报告：2023、2024、2025年报。',
              '2. 2023年12月27日发布的正式上市招股章程（GLOBAL OFFERING），未使用申请版本或聆讯后资料集替代。',
              '3. 2026年第一季度未经审核财务业绩，属于严格意义上的最新季度报告。',
              '4. 2026年中期业绩公告，属于截至打包日更晚的集团层面定期财务披露。',
              '5. 截至2026年9月14日，港交所尚未列示2026年完整中期报告，因此未以2025年旧中报替代。',
              '',
              '全部PDF来自港交所披露易。已检查PDF文件头、可解析性、实际页数、公司名称、报告期间、抽样页渲染与SHA-256。',
              '压缩包已通过ZIP CRC完整性测试。',
              '',
          ]
          for row in manifest:
              readme_lines.append(
                  f"{row['序号']}. {row['文件名']} | {row['PDF页数']}页 | {row['港交所官方来源']}"
              )
          (PDFDIR / 'README.txt').write_text('\n'.join(readme_lines), encoding='utf-8')

          validation = {
              'company': 'RoboSense Technology Co., Ltd',
              'stock_code': '02498.HK',
              'package_date': '2026-09-14',
              'pdf_count': len(manifest),
              'reports': manifest,
          }
          (PDFDIR / '验证记录.json').write_text(
              json.dumps(validation, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          complete_zip = OUT / 'RoboSenseReports.zip'
          with zipfile.ZipFile(complete_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in sorted(PDFDIR.iterdir()):
                  z.write(p, arcname=p.name)
          with zipfile.ZipFile(complete_zip, 'r') as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad is not None or len(pdfs) != len(reports):
                  raise RuntimeError(f'Complete ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          prospectus_zip = OUT / 'RoboSenseProspectus.zip'
          with zipfile.ZipFile(prospectus_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              z.write(PDFDIR / '04_RoboSense_Final_Prospectus_2023-12-27.pdf', arcname='RoboSense_Final_Prospectus.pdf')
              z.write(PDFDIR / 'README.txt', arcname='README.txt')

          reports_zip = OUT / 'RoboSenseAnnualLatest.zip'
          with zipfile.ZipFile(reports_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in sorted(PDFDIR.glob('*.pdf')):
                  if p.name != '04_RoboSense_Final_Prospectus_2023-12-27.pdf':
                      z.write(p, arcname=p.name)
              for name in ['README.txt', '文件清单与校验值.csv', '验证记录.json']:
                  z.write(PDFDIR / name, arcname=name)

          for archive in [complete_zip, prospectus_zip, reports_zip]:
              with zipfile.ZipFile(archive, 'r') as z:
                  if z.testzip() is not None:
                      raise RuntimeError(f'ZIP CRC failed: {archive}')

          result = {
              'ok': True,
              'complete_archive': complete_zip.name,
              'prospectus_archive': prospectus_zip.name,
              'reports_archive': reports_zip.name,
              'complete_size_bytes': complete_zip.stat().st_size,
              'prospectus_size_bytes': prospectus_zip.stat().st_size,
              'reports_size_bytes': reports_zip.stat().st_size,
              'pdf_count': len(manifest),
              'zip_crc_ok': True,
              'reports': manifest,
          }
          (OUT / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PACKAGE_OK', json.dumps(result, ensure_ascii=False), flush=True)
          PY
      - name: Upload verified archives
        uses: actions/upload-artifact@v4
        with:
          name: robosense-verified-reports
          path: |
            output/RoboSenseReports.zip
            output/RoboSenseProspectus.zip
            output/RoboSenseAnnualLatest.zip
            output/result.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
