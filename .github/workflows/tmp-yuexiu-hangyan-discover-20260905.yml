name: Discover Hangyan Yuexiu Transport report links

on:
  push:
    branches:
      - tmp-yuexiu-hangyan-discover-20260905

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch report search pages
        run: |
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          queries=['越秀交通基建','控股里程不断超越 三平台架构一枝独秀','平临高速收购落地 保持稳健派息','平临高速将增厚25年业绩','中期分红率53.8%']
          urls=['https://www.hangyan.co/charts/3811300443254949651']
          for q in queries:
              for p in range(1,4):
                  urls.append('https://www.hangyan.co/reports?q='+quote(q)+('&page='+str(p) if p>1 else ''))
          all_links=[]
          for idx,u in enumerate(urls,1):
              try:
                  r=s.get(u,timeout=40,allow_redirects=True)
                  print('PAGE',idx,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                  raw=html.unescape(r.text).replace('\\/','/')
                  Path(f'output/page_{idx:02d}.html').write_text(raw,encoding='utf-8')
                  soup=BeautifulSoup(raw,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a['href']); txt=' '.join(a.stripped_strings)
                      blob=(href+' '+txt).lower()
                      if '/reports/' in href or any(k in blob for k in ['越秀交通','yuexiu','控股里程','三平台架构','01052','001052','平临高速','中期分红率53.8']):
                          item={'page':r.url,'text':txt[:500],'href':href}
                          if item not in all_links:
                              all_links.append(item); print('LINK',json.dumps(item,ensure_ascii=False))
                  for m in re.finditer(r'/reports/[0-9]+',raw):
                      href=urljoin(r.url,m.group(0)); item={'page':r.url,'text':'regex','href':href}
                      if item not in all_links:
                          all_links.append(item); print('REGEX',href)
                  for needle in ['越秀交通基建','控股里程不断超','三平台架构一枝独秀','平临高速','中期分红率53.8','西南证券','兴证国际','东兴证券','国联证券']:
                      for m in list(re.finditer(re.escape(needle),raw,re.I))[:20]:
                          print('SNIP',needle,raw[max(0,m.start()-700):m.start()+2000].replace('\n',' ')[:2700])
              except Exception as e:
                  print('ERR',u,repr(e))
          Path('output/links.json').write_text(json.dumps(all_links,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(all_links))
          PY
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: yuexiu-hangyan-discovery-v2
          path: output
          retention-days: 1
