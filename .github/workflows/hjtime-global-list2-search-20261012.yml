name: Search global Eastmoney list2 for HJTime reports 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-global-list2-search-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Search global stock report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,time
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,*/*','Content-Type':'application/json'})
          ranges=[('2025-01-01','2025-12-31'),('2026-01-01','2026-10-12'),('2023-01-01','2024-12-31'),('2016-01-01','2022-12-31')]
          keys=['汇嘉时代','603101','新疆零售龙头','新疆商业龙头','胖改驱动业态提质','创新转型价值重估','低空经济有望成为第二增长曲线','多业态驱动扩张','深耕本土']
          found=[]
          for begin,end in ranges:
            for page in range(1,81):
              body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':begin,'endTime':end,'code':'*','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
              try:
                r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=(20,120))
                print('QUERY',begin,end,page,r.status_code,len(r.content),flush=True)
                if r.status_code!=200: break
                j=r.json(); rows=j.get('data') or []
                for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if any(k in blob for k in keys):
                    print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
                    found.append(row)
                if len(rows)<100:
                  print('RANGE_DONE',begin,end,page,len(rows),flush=True); break
                time.sleep(.2)
              except Exception as e:
                print('ERR',begin,end,page,repr(e),flush=True); break
          print('FOUND_TOTAL',len(found),flush=True)
          print('FOUND_JSON',json.dumps(found,ensure_ascii=False),flush=True)
          PY
