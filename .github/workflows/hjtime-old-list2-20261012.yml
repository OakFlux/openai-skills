name: Find old HJTime Eastmoney reports 20261012
on:
  push:
    paths: ['.github/workflows/hjtime-old-list2-20261012.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query old date windows
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Content-Type':'application/json'})
          for begin,end in [('2016-01-01','2018-12-31'),('2019-01-01','2021-12-31'),('2022-01-01','2024-12-31')]:
            body={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':begin,'endTime':end,'code':'603101','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
            r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=60)
            print('QUERY',begin,end,r.status_code,len(r.content),flush=True)
            if r.status_code==200:
              rows=r.json().get('data') or []
              print('COUNT',len(rows),flush=True)
              for row in rows: print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
          PY
