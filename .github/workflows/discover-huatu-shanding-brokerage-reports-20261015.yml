name: Discover Huatu Shanding brokerage reports

on:
  push:
    paths:
      - '.github/workflows/discover-huatu-shanding-brokerage-reports-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query Eastmoney report API
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time, requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/300492.html'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          seen=set(); rows_all=[]
          for begin,end in [('2014-01-01','2019-12-31'),('2020-01-01','2026-10-15')]:
              for qtype in ('0','1'):
                  for page in range(1,10):
                      params={
                          'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                          'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                          'orgCode':'','code':'300492','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                          '_':str(int(time.time()*1000)),
                      }
                      r=s.get(endpoint,params=params,timeout=60)
                      print('QUERY',begin,end,qtype,page,r.status_code,len(r.content),r.url,flush=True)
                      r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                      print('COUNT',len(rows),'HITS',payload.get('hits'),flush=True)
                      if not rows: break
                      for row in rows:
                          code=str(row.get('infoCode') or '')
                          if code and code not in seen:
                              seen.add(code); rows_all.append(row)
                      if len(rows)<100: break
          print('TOTAL',len(rows_all),flush=True)
          for row in sorted(rows_all,key=lambda x:(int(x.get('attachPages') or 0),str(x.get('publishDate') or '')),reverse=True):
              print('REPORT',json.dumps({k:row.get(k) for k in (
                  'title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize',
                  'researcher','emRatingName','column','reportType','ratingChangeName'
              )},ensure_ascii=False),flush=True)
          PY
