name: Temporary FXBaoGao preview probe for Aixin reports

on:
  push:
    branches:
      - tmp-fx-preview-aixin-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query preview image API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests Pillow
          python - <<'PY'
          import io, json, re
          from pathlib import Path
          import requests
          from PIL import Image

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9',
            'Origin':'https://www.fxbaogao.com',
            'Referer':'https://www.fxbaogao.com/',
          })
          ids=['5480083','5472548','5605896']
          results={}
          for rid in ids:
            url=f'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId={rid}'
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              print('API',rid,r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
              entry={'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'final_url':r.url,'text':r.text[:500000]}
              try:
                obj=r.json(); entry['json']=obj
                print('JSON',rid,json.dumps(obj,ensure_ascii=False)[:20000],flush=True)
                urls=[]
                def walk(v):
                  if isinstance(v,dict):
                    for x in v.values(): walk(x)
                  elif isinstance(v,list):
                    for x in v: walk(x)
                  elif isinstance(v,str) and v.startswith(('http://','https://')):
                    urls.append(v)
                walk(obj)
                urls=list(dict.fromkeys(urls))
                entry['urls']=urls
                for i,u in enumerate(urls):
                  try:
                    rr=s.get(u,headers={'Referer':f'https://www.fxbaogao.com/view?id={rid}','Accept':'image/avif,image/webp,image/png,image/*,*/*'},timeout=(20,90),allow_redirects=True)
                    data=rr.content
                    item={'index':i,'url':u,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
                    if rr.status_code==200 and len(data)>1000:
                      try:
                        im=Image.open(io.BytesIO(data)); im.load(); item.update({'width':im.width,'height':im.height,'format':im.format})
                        (out/f'{rid}_{i+1:03d}.{(im.format or "png").lower()}').write_bytes(data)
                      except Exception as e: item['image_error']=repr(e)
                    entry.setdefault('url_checks',[]).append(item)
                    print('URLCHECK',rid,json.dumps(item,ensure_ascii=False),flush=True)
                  except Exception as e:
                    entry.setdefault('url_checks',[]).append({'index':i,'url':u,'error':repr(e)})
              except Exception as e:
                entry['json_error']=repr(e)
              results[rid]=entry
            except Exception as e:
              results[rid]={'error':repr(e),'url':url}
              print('ERROR',rid,repr(e),flush=True)
          (out/'preview_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload preview results
        uses: actions/upload-artifact@v4
        with:
          name: fx-preview-aixin-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
