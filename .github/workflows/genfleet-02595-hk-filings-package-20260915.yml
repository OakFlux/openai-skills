name: Build GenFleet 02595 HK filings package 20260915

on:
  push:
    paths:
      - '.github/workflows/genfleet-02595-hk-filings-package-20260915.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf fonttools

      - name: Download official filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '劲方医药_02595_港股_招股说明书_2025年报_2026中期业绩'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.genfleet.com/',
          })

          def variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          docs = [
              {
                  'filename': '01_劲方医药_02595_招股说明书_中文版_2025-09-11.pdf',
                  'title': '劲方医药招股说明书（中文版）',
                  'date': '2025-09-11',
                  'urls': [
                      'https://www.genfleet.com/Public/Uploads/uploadfile/files/20250911/HKEX-EPS_20250911_11837295_0.pdf',
                  ],
                  'min_bytes': 5_000_000,
                  'min_pages': 500,
              },
              {
                  'filename': '02_GenFleet_02595_Prospectus_English_2025-09-11.pdf',
                  'title': 'GenFleet Therapeutics Prospectus (English)',
                  'date': '2025-09-11',
                  'urls': [
                      'https://www.genfleet.com/Public/Uploads/uploadfile/files/20250911/HKEX-EPS_20250911_11837294_0.pdf',
                  ],
                  'min_bytes': 5_000_000,
                  'min_pages': 500,
              },
              {
                  'filename': '03_劲方医药_02595_2025年年度报告_中文版_2026-04-09.pdf',
                  'title': '劲方医药2025年年度报告（中文版）',
                  'date': '2026-04-09',
                  'urls': [
                      'https://www.genfleet.com/Public/Uploads/uploadfile/files/20260420/zhongwen.pdf',
                      *variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0409/2026040900158_c.pdf'),
                  ],
                  'min_bytes': 1_000_000,
                  'min_pages': 150,
              },
              {
                  'filename': '04_GenFleet_02595_2025_Annual_Report_English_2026-04-09.pdf',
                  'title': 'GenFleet Therapeutics 2025 Annual Report (English)',
                  'date': '2026-04-09',
                  'urls': [
                      'https://www.genfleet.com/Public/Uploads/uploadfile/files/20260420/yingwen.pdf',
                      *variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0409/2026040900157.pdf'),
                  ],
                  'min_bytes': 1_000_000,
                  'min_pages': 150,
              },
              {
                  'filename': '05_劲方医药_02595_2026年中期业绩公告_中文版_2026-08-21.pdf',
                  'title': '截至2026年6月30日止六个月中期业绩公告（中文版）',
                  'date': '2026-08-21',
                  'urls': [
                      'https://www.genfleet.com/Public/Uploads/uploadfile/files/20260822/zhongwengonggao.pdf',
                      *variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0821/2026082100176_c.pdf'),
                  ],
                  'min_bytes': 100_000,
                  'min_pages': 30,
              },
              {
                  'filename': '06_GenFleet_02595_2026_Interim_Results_English_2026-08-21.pdf',
                  'title': 'Interim Results Announcement for the Six Months Ended June 30, 2026 (English)',
                  'date': '2026-08-21',
                  'urls': [
                      'https://www.genfleet.com/Public/Uploads/uploadfile/files/20260822/yingwengonggao.pdf',
                      *variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0821/2026082100175.pdf'),
                  ],
                  'min_bytes': 100_000,
                  'min_pages': 30,
              },
          ]

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(20, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              identity_ok = any(term.lower() in sample_text.lower() for term in ('2595', 'GenFleet', '勁方'))
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'disclosure_date': doc['date'],
                  'source': '劲方医药投资者关系网站 / 香港交易所披露易',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '劲方医药科技（上海）股份有限公司（02595.HK）港股披露文件',
              '整理日期：2026-09-15',
              '',
              '收录范围：最终招股说明书、上市后全部完整年度报告，以及截至整理日最新阶段性财务报告。',
              '公司于2025-09-19在香港联交所主板上市，因此截至整理日，上市后完整年度报告只有2025年年度报告。',
              '香港主板公司通常不按A股口径强制发布第一、第三季度报告；截至2026-09-15，最新财务披露为2026-08-21发布的截至2026年6月30日止六个月中期业绩公告，本包收录中英文原件。',
              '招股说明书和年度报告亦同时收录中英文原件，便于检索与交叉核对。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司身份、实际页数、qpdf结构检查、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 6:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: genfleet-02595-hk-filings-final
          path: 劲方医药_02595_港股_招股说明书_2025年报_2026中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
