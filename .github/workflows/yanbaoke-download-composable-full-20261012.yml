name: Print Yanbaoke download composable 20261012

on:
  push:
    paths:
      - '.github/workflows/yanbaoke-download-composable-full-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Print exact small bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          base='https://pc.yanbaoke.cn/_nuxt/'
          for name in ['CKPQz2V3.js','B6DZUC9F.js','CU8fsBPa.js','7P1kDFxB.js','ChXfW4F4.js','BMKe_D3j.js','BMSQkwth.js']:
            r=requests.get(base+name,headers={'User-Agent':'Mozilla/5.0','Referer':'https://pc.yanbaoke.cn/info/hE6AtQEFRHTDLPWmNBfqzX'},timeout=(15,60))
            print('BEGIN',name,r.status_code,len(r.content),flush=True)
            print(r.text,flush=True)
            print('END',name,flush=True)
          PY
