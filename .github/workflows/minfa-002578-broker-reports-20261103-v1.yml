name: Package Minfa Aluminum 002578 broker reports

on:
  push:
    branches:
      - tmp/minfa-broker-reports-20261103-v1
    paths:
      - .github/workflows/minfa-002578-broker-reports-20261103-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          CODE = "002578"
          COMPANY = "闽发铝业"
          FULL_NAMES = ["福建省闽发铝业股份有限公司", "福建闽发铝业股份有限公司"]
          PREPARED = "2026-11-03"
          ROOT_NAME = "闽发铝业_002578_券商深度研究报告"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF原件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          reports = [
              {
                  "priority": 1,
                  "date": "2024-05-09",
                  "broker": "东吴证券",
                  "analyst": "孟祥文、徐毅达",
                  "rating": "中性（首次覆盖）",
                  "report_type": "公司深度研究",
                  "title": "专注铝加工业，持续培育型材利润新增长点",
                  "direct_urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP202405091632765588_1.pdf",
                      "https://pdf.dfcfw.com/pdf/H2_AP202405091632765588_1.pdf",
                  ],
                  "detail_url": "https://data.eastmoney.com/report/info/AP202405091632765588.html",
                  "expected_min_pages": 12,
              },
              {
                  "priority": 2,
                  "date": "2012-03-22",
                  "broker": "东兴证券",
                  "analyst": "林阳；联系人：李晨辉",
                  "rating": "推荐（首次）",
                  "report_type": "调研快报/首次覆盖",
                  "title": "海西铝材龙头，募投项目稳步推进",
                  "direct_urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP201203230005064262_1.pdf",
                      "https://pdf.dfcfw.com/pdf/H2_AP201203230005064262_1.pdf",
                  ],
                  "detail_url": "https://data.eastmoney.com/report/info/AP201203230005064262.html",
                  "expected_min_pages": 5,
              },
          ]

          p5w_candidates = [
              {
                  "priority": 3,
                  "date": "2011-04-14",
                  "broker": "东北证券",
                  "analyst": "杨霞辉",
                  "rating": "新股定价报告",
                  "report_type": "新股定价/公司研究",
                  "title": "海西铝材龙头，建议申购区间15—18元",
                  "page_url": "https://www.p5w.net/stock/lzft/gsyj/201104/t3555067.htm",
                  "expected_min_pages": 5,
              },
              {
                  "priority": 4,
                  "date": "2011-04-15",
                  "broker": "国都证券",
                  "analyst": "肖世俊",
                  "rating": "新股定价报告",
                  "report_type": "新股定价/公司研究",
                  "title": "海西板块龙头，加快推进产品结构转型",
                  "page_url": "https://www.p5w.net/stock/lzft/gsyj/201104/t3554938.htm",
                  "expected_min_pages": 5,
              },
          ]

          def get_with_retry(url, *, accept="*/*", referer=None, timeout=(25, 240)):
              last = None
              headers = {"Accept": accept}
              if referer:
                  headers["Referer"] = referer
              for attempt in range(5):
                  try:
                      r = session.get(url, timeout=timeout, allow_redirects=True, headers=headers)
                      print("GET", r.status_code, len(r.content), r.url)
                      return r
                  except Exception as exc:
                      last = exc
                      print("GET_ERROR", url, attempt, repr(exc))
                      time.sleep(1 + attempt)
              raise last

          def discover_p5w_pdf(spec):
              r = get_with_retry(spec["page_url"], accept="text/html,*/*;q=0.8")
              if r.status_code != 200:
                  return []
              raw = r.content
              texts = []
              for enc in [r.encoding, r.apparent_encoding, "utf-8", "gb18030", "gbk"]:
                  if not enc:
                      continue
                  try:
                      texts.append(raw.decode(enc, errors="replace"))
                  except Exception:
                      pass
              text = max(texts, key=lambda x: (COMPANY in x, len(x)), default="")
              (ROOT / f"source_{spec['broker']}.html").write_text(text, encoding="utf-8")
              soup = BeautifulSoup(text, "lxml")
              urls = []
              for tag in soup.find_all(True):
                  for attr in ["href", "src", "data-url", "data-href"]:
                      val = tag.get(attr)
                      if val and ".pdf" in val.lower():
                          urls.append(urljoin(r.url, val.strip()))
              for m in re.findall(r"(?:https?:)?//[^\s\"'<>]+\.pdf(?:\?[^\s\"'<>]*)?|[^\s\"'<>]+\.pdf(?:\?[^\s\"'<>]*)?", text, flags=re.I):
                  urls.append(urljoin(r.url, m.strip()))
              unique = []
              for u in urls:
                  u = u.replace("&amp;", "&")
                  if u not in unique:
                      unique.append(u)
              print("P5W_PDF_CANDIDATES", spec["broker"], json.dumps(unique, ensure_ascii=False))
              return unique

          for spec in p5w_candidates:
              try:
                  discovered = discover_p5w_pdf(spec)
              except Exception as exc:
                  print("P5W_DISCOVERY_FAILED", spec["broker"], repr(exc))
                  discovered = []
              spec["direct_urls"] = discovered
              spec["detail_url"] = spec["page_url"]
              reports.append(spec)

          def safe_name(text):
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text)
              return re.sub(r"\s+", " ", text).strip(" ._")[:170]

          manifest = []
          failures = []
          for spec in sorted(reports, key=lambda x: x["priority"]):
              if len(manifest) >= 3:
                  break
              urls = list(spec.get("direct_urls") or [])
              if not urls:
                  failures.append({"title": spec["title"], "reason": "no PDF URL discovered"})
                  continue
              data = None
              used_url = None
              attempts = []
              for url in urls:
                  try:
                      r = get_with_retry(url, accept="application/pdf,*/*;q=0.8", referer=spec.get("detail_url"))
                      rec = {"url": url, "status": r.status_code, "bytes": len(r.content), "content_type": r.headers.get("content-type", ""), "magic": r.content[:8].hex(), "final_url": r.url}
                      attempts.append(rec)
                      print("PDF_PROBE", json.dumps(rec, ensure_ascii=False))
                      if r.status_code == 200 and r.content.startswith(b"%PDF-") and len(r.content) > 50000:
                          data = r.content
                          used_url = r.url
                          break
                  except Exception as exc:
                      attempts.append({"url": url, "error": repr(exc)})
              if data is None:
                  failures.append({"title": spec["title"], "reason": "download failed", "attempts": attempts})
                  continue

              filename = safe_name(f"{len(manifest)+1:02d}_{spec['date'].replace('-', '')}_{spec['broker']}_{spec['title']}.pdf")
              path = PDF_DIR / filename
              path.write_bytes(data)
              try:
                  reader = PdfReader(str(path), strict=False)
                  pages = len(reader.pages)
              except Exception as exc:
                  failures.append({"title": spec["title"], "reason": f"PDF parse failed: {exc!r}"})
                  path.unlink(missing_ok=True)
                  continue
              if pages < int(spec.get("expected_min_pages") or 1):
                  failures.append({"title": spec["title"], "reason": f"too short: {pages} pages"})
                  path.unlink(missing_ok=True)
                  continue

              text_parts = []
              for page in reader.pages[:min(20, pages)]:
                  try:
                      text_parts.append(page.extract_text() or "")
                  except Exception:
                      pass
              sample_text = "\n".join(text_parts)
              if len(sample_text.strip()) > 100 and not (COMPANY in sample_text or CODE in sample_text or any(n in sample_text for n in FULL_NAMES)):
                  failures.append({"title": spec["title"], "reason": "issuer validation failed"})
                  path.unlink(missing_ok=True)
                  continue

              q = subprocess.run(["qpdf", "--warning-exit-0", "--check", str(path)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if q.returncode != 0:
                  failures.append({"title": spec["title"], "reason": "qpdf validation failed", "detail": q.stdout})
                  path.unlink(missing_ok=True)
                  continue

              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5000:
                  failures.append({"title": spec["title"], "reason": "preview rendering failed", "detail": render.stdout})
                  path.unlink(missing_ok=True)
                  continue

              manifest.append({**spec, "filename": filename, "actual_pages": pages, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "pdf_url": used_url, "preview_file": str(Path("首页预览") / preview.name), "download_attempts": attempts})

          if len(manifest) < 2:
              raise RuntimeError(f"Only {len(manifest)} valid reports found; failures={failures}")

          readme = [
              f"闽发铝业（{CODE}.SZ）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              f"本包收录{len(manifest)}份可公开直接下载并完成结构核验的券商原始PDF。",
              "其中优先收录公司深度、首次覆盖、调研及新股定价类公司研究。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   券商：{item['broker']}；类型：{item['report_type']}；研究员：{item['analyst']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   评级：{item['rating']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   原始PDF：{item['pdf_url']}",
                  f"   来源页面：{item['detail_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          if failures:
              readme += ["未纳入候选："] + [f"- {x['title']}：{x['reason']}" for x in failures] + [""]
          readme += [
              "核验项目：PDF文件头、发行人名称/证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "未使用网页摘要或自行重排文件替代券商原始PDF。",
          ]
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {"company": COMPANY, "stock_code": CODE, "prepared_on": PREPARED, "report_count": len(manifest), "all_files_are_original_broker_pdfs": True, "files": manifest, "failures": failures}
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as f:
              w = csv.writer(f)
              w.writerow(["文件名", "报告类型", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256", "来源页面", "PDF地址"])
              for x in manifest:
                  w.writerow([x["filename"], x["report_type"], x["broker"], x["analyst"], x["date"], x["title"], x["rating"], x["actual_pages"], x["bytes"], x["sha256"], x["detail_url"], x["pdf_url"]])
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(f"{x['sha256']}  PDF原件/{x['filename']}" for x in manifest) + "\n", encoding="utf-8")

          zip_path = Path("minfa_002578_broker_deep_reports.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in sorted(ROOT.rglob("*")):
                  if p.is_file():
                      z.write(p, arcname=str(Path(ROOT_NAME) / p.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as z:
              bad = z.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {"package": zip_path.name, "zip_bytes": zip_path.stat().st_size, "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(), "report_count": len(manifest), "files": [{k: x[k] for k in ["filename", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256", "detail_url", "pdf_url"]} for x in manifest], "failures": failures}
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: minfa-002578-broker-reports-20261103
          path: |
            minfa_002578_broker_deep_reports.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
