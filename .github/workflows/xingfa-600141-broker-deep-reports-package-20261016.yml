name: Package Xingfa Group 600141 broker deep reports 20261016

on:
  push:
    paths:
      - '.github/workflows/xingfa-600141-broker-deep-reports-package-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='兴发集团'
          FULL='湖北兴发化工集团股份有限公司'
          CODE='600141'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT, RENDER, ART):
              d.mkdir(parents=True, exist_ok=True)

          reports=[
            {
              'order':1,
              'broker':'开源证券',
              'date':'2023-07-07',
              'title':'公司首次覆盖报告：一体化精细磷化工龙头，研发创新引领转型升级',
              'info_code':'AP202307071592101336',
              'expected_pages':46,
              'filename':'01_2023-07-07_开源证券_公司首次覆盖报告_一体化精细磷化工龙头_研发创新引领转型升级.pdf'
            },
            {
              'order':2,
              'broker':'东亚前海证券',
              'date':'2022-08-08',
              'title':'首次覆盖报告：一体化布局优势显著，多赛道布局助力成长',
              'info_code':'AP202208071576975296',
              'expected_pages':29,
              'filename':'02_2022-08-08_东亚前海证券_首次覆盖报告_一体化布局优势显著_多赛道布局助力成长.pdf'
            },
            {
              'order':3,
              'broker':'万联证券',
              'date':'2022-04-08',
              'title':'首次覆盖：磷化工产业一体化成效显著，入局新材料开拓全新成长路径',
              'info_code':'AP202204081558007992',
              'expected_pages':42,
              'filename':'03_2022-04-08_万联证券_首次覆盖_磷化工产业一体化成效显著_入局新材料开拓成长路径.pdf'
            },
          ]

          session=requests.Session()
          session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/600141.html',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
              urls=[
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last={}
              for url in urls:
                  for attempt in range(1,7):
                      try:
                          r=session.get(url,timeout=(30,420),allow_redirects=True)
                          last={
                              'requested_url':url,
                              'final_url':str(r.url),
                              'status':r.status_code,
                              'bytes':len(r.content),
                              'content_type':r.headers.get('content-type',''),
                          }
                          if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                              return r.content,str(r.url),last
                      except Exception as exc:
                          last={'requested_url':url,'error':repr(exc)}
                      time.sleep(attempt)
              raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
              data,source_url,download_meta=download_pdf(item['info_code'])
              dest=OUT/item['filename']
              dest.write_bytes(data)

              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages<18:
                  raise RuntimeError(f'Too few pages: {dest.name} = {pages}')
              if abs(pages-item['expected_pages'])>2:
                  raise RuntimeError(f'Unexpected page count: {dest.name} actual={pages} expected={item["expected_pages"]}')

              sample=[]
              page_indexes=list(range(min(15,pages)))+[max(0,pages-2),pages-1]
              for page_index in dict.fromkeys(page_indexes):
                  try:
                      sample.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              text='\n'.join(sample)
              if not any(x in text for x in [COMPANY,FULL,CODE,'湖北兴发']):
                  txt=dest.with_suffix('.txt')
                  subprocess.run(
                      ['pdftotext','-f','1','-l',str(min(18,pages)),str(dest),str(txt)],
                      check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT
                  )
                  text=txt.read_text(encoding='utf-8',errors='ignore')
                  txt.unlink(missing_ok=True)

              identity_ok=any(x in text for x in [COMPANY,FULL,CODE,'湖北兴发'])
              broker_tokens=[item['broker'],item['broker'].replace('证券','')]
              if item['broker']=='东亚前海证券':
                  broker_tokens += ['东亚前海']
              broker_ok=any(x in text for x in broker_tokens)
              title_tokens=[token for token in ['精细磷化工','一体化布局','磷化工产业','新材料','成长路径'] if token in item['title']]
              theme_ok=sum(1 for token in title_tokens if token in text)>=1
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')
              if not broker_ok:
                  raise RuntimeError(f'Broker identity check failed: {dest.name}')
              if not theme_ok:
                  raise RuntimeError(f'Report-theme check failed: {dest.name}')

              q=subprocess.run(
                  ['qpdf','--warning-exit-0','--check',str(dest)],
                  stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True
              )
              if q.returncode!=0:
                  raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

              first=RENDER/f'{item["order"]:02d}_first'
              last=RENDER/f'{item["order"]:02d}_last'
              subprocess.run(
                  ['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],
                  check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT
              )
              subprocess.run(
                  ['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],
                  check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT
              )
              first_png=Path(str(first)+'.png')
              last_png=Path(str(last)+'.png')
              if not first_png.exists() or first_png.stat().st_size<8_000:
                  raise RuntimeError(f'First-page render failed: {dest.name}')
              if not last_png.exists() or last_png.stat().st_size<3_000:
                  raise RuntimeError(f'Last-page render failed: {dest.name}')

              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  'stock_code':CODE,
                  'stock_name':COMPANY,
                  'broker':item['broker'],
                  'publish_date':item['date'],
                  'title':item['title'],
                  'info_code':item['info_code'],
                  'pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'source_url':source_url,
                  'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
                  'filename':item['filename'],
                  'identity_check':identity_ok,
                  'broker_check':broker_ok,
                  'theme_check':theme_ok,
                  'validation':['PDF header','company identity','broker identity','report theme','page count','qpdf structure','first-page render','last-page render'],
                  'download_meta':download_meta,
              })

          if len(manifest)!=3 or len({x['sha256'] for x in manifest})!=3:
              raise RuntimeError('Report count or duplicate check failed')

          readme=[
              '兴发集团（600141.SH；湖北兴发化工集团股份有限公司）券商深度报告资料包',
              '整理日期：2026-10-16','',
              '收录数量：3份，均为兴发集团公司专属、公开可完整下载的长篇券商研究报告。',
              '筛选口径：优先公司首次覆盖、公司深度和系统性研究；排除短篇财报点评、同业报告、网页摘要及缺页预览。','',
              '文件清单：'
          ]
          for index,m in enumerate(manifest,1):
              readme += [
                  f'{index}. {m["filename"]}',
                  f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
                  f'   标题：{m["title"]}',
                  f'   PDF来源：{m["source_url"]}',
                  f'   研报页面：{m["report_page"]}',
                  f'   SHA-256：{m["sha256"]}',''
              ]
          readme += [
              '主要研究内容：磷矿资源与“矿电化一体化”、精细磷化工、草甘膦与有机硅、新能源材料、湿电子化学品及公司成长路径。',
              '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、主题关键词、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
              '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'兴发集团长篇研报候选清单.json').write_text(json.dumps([
              {'publishDate':'2023-07-07','attachPages':46,'orgSName':'开源证券','title':'公司首次覆盖报告：一体化精细磷化工龙头，研发创新引领转型升级','infoCode':'AP202307071592101336'},
              {'publishDate':'2023-03-22','attachPages':24,'orgSName':'华安证券','title':'全年业绩创新高，磷硅新材料打开成长空间','infoCode':'AP202303211584456018'},
              {'publishDate':'2022-09-07','attachPages':21,'orgSName':'华安证券','title':'产业链一体化布局，新材料打开成长空间','infoCode':'AP202209071578103482'},
              {'publishDate':'2022-08-08','attachPages':29,'orgSName':'东亚前海证券','title':'首次覆盖报告：一体化布局优势显著，多赛道布局助力成长','infoCode':'AP202208071576975296'},
              {'publishDate':'2022-04-08','attachPages':42,'orgSName':'万联证券','title':'首次覆盖：磷化工产业一体化成效显著，入局新材料开拓全新成长路径','infoCode':'AP202204081558007992'},
              {'publishDate':'2018-09-10','attachPages':33,'orgSName':'东兴证券','title':'深度报告：马太效应显著，规模优势、技术领先双动力','infoCode':'AP201809101192050512'},
          ],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'兴发集团_600141_券商深度报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path,arcname=path.name)
          with zipfile.ZipFile(zip_path,'r') as archive:
              bad=archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len([name for name in archive.namelist() if name.lower().endswith('.pdf')])!=3:
                  raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xingfa-600141-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
