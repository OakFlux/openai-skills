name: Diagnose Zenergy 03677 filing discovery 20260922

on:
  push:
    paths:
      - '.github/workflows/zenergy-03677-filings-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch and parse title pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zenergy_discovery
          python - <<'PY'
          import json, re, html, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('zenergy_discovery')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Cache-Control':'no-cache'})
          stock='1000255774'
          results=[]
          for lang in ['EN','ZH','TC','CH']:
              url=f'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang={lang}&market=SEHK&stockId={stock}&_={int(time.time())}'
              rec={'lang':lang,'url':url}
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  rec.update(status=r.status_code,final_url=r.url,bytes=len(r.content),content_type=r.headers.get('content-type',''))
                  (out/f'{lang}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'lxml')
                  rows=[]
                  for a in soup.find_all('a',href=True):
                      href=html.unescape(a.get('href','')).replace('\\/','/')
                      if '.pdf' not in href.lower() or '/listedco/listconews/sehk/' not in urljoin(r.url,href).lower():
                          continue
                      p=a.find_parent('tr') or a.parent
                      txt=' '.join((p.get_text(' ',strip=True) if p else a.get_text(' ',strip=True)).split())
                      rows.append({'title':' '.join(a.get_text(' ',strip=True).split()),'href':urljoin(r.url,href),'context':txt})
                  rec['pdf_rows']=rows
                  print(lang,r.status_code,len(r.content),'rows',len(rows),flush=True)
                  for row in rows:
                      t=(row['title']+' '+row['context']).lower()
                      if any(k in t for k in ['annual report','interim report','interim results','global offering','prospectus']) or any(k in row['context'] for k in ['年度報告','年報','中期報告','中期業績','全球發售','招股章程']):
                          print('MATCH',lang,json.dumps(row,ensure_ascii=False),flush=True)
              except Exception as e:
                  rec['error']=repr(e)
                  print('ERR',lang,repr(e),flush=True)
              results.append(rec)
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: zenergy-03677-filing-discovery
          path: zenergy_discovery
          retention-days: 7
