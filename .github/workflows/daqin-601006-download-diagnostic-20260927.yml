name: Diagnose Daqin Railway report downloads 20260927

on:
  push:
    paths:
      - '.github/workflows/daqin-601006-download-diagnostic-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests pypdf
      - name: Download and inspect each URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, time, hashlib
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          docs = [
            ('2020','/disclosure/listedinfo/announcement/c/new/2021-04-29/601006_20210429_18.pdf'),
            ('2021','/disclosure/listedinfo/announcement/c/new/2022-04-28/601006_20220428_2_YLGcJEoy.pdf'),
            ('2022','/disclosure/listedinfo/announcement/c/new/2023-04-27/601006_20230427_JDLK.pdf'),
            ('2023','/disclosure/listedinfo/announcement/c/new/2024-04-27/601006_20240427_I78R.pdf'),
            ('2024','/disclosure/listedinfo/announcement/c/new/2025-04-30/601006_20250430_F8WB.pdf'),
            ('2025','/disclosure/listedinfo/announcement/c/new/2026-04-30/601006_20260430_VFZD.pdf'),
            ('2026Q1','/disclosure/listedinfo/announcement/c/new/2026-04-30/601006_20260430_SOQY.pdf'),
            ('2026H1','/disclosure/listedinfo/announcement/c/new/2026-08-21/601006_20260821_8I2N.pdf'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=601006','Accept':'application/pdf,*/*;q=0.8'})
          results=[]
          for label,path in docs:
            rec={'label':label,'path':path,'attempts':[]}
            for base in ('https://static.sse.com.cn','https://www.sse.com.cn'):
              url=base+path
              try:
                r=s.get(url,timeout=(20,180),allow_redirects=True)
                att={'url':url,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'head':r.content[:20].hex()}
                rec['attempts'].append(att)
                if r.status_code==200 and r.content[:5]==b'%PDF-':
                  fn=Path('out')/f'{label}.pdf'; fn.write_bytes(r.content)
                  try:
                    reader=PdfReader(str(fn),strict=False)
                    rec['pages']=len(reader.pages)
                    rec['sha256']=hashlib.sha256(r.content).hexdigest()
                    rec['success_url']=url
                    rec['file']=fn.name
                  except Exception as e:
                    rec['parse_error']=repr(e)
                  break
              except Exception as e:
                rec['attempts'].append({'url':url,'error':repr(e)})
              time.sleep(1)
            results.append(rec)
            print(json.dumps(rec,ensure_ascii=False))
          Path('out/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: daqin-601006-download-diagnostic
          path: out
          retention-days: 7
          if-no-files-found: error
