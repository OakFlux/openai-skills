name: Temporary Inspect Sdyanbao Nuxt Data

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-inspect-sdyanbao-fixed.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Extract Nuxt data, scripts and endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from urllib.parse import urljoin,quote
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sdyanbao.com/'})
          pages=['https://www.sdyanbao.com/detail/355422','https://www.sdyanbao.com/report','https://www.sdyanbao.com/search?keyword='+quote('蒙泰高新')]
          scripts=set()
          for page in pages:
            r=s.get(page,timeout=60); t=html.unescape(r.text).replace('\\/','/')
            print('PAGE_META='+json.dumps({'url':page,'status':r.status_code,'bytes':len(r.content),'final':r.url},ensure_ascii=False))
            for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):scripts.add(urljoin(r.url,src))
            # Print concise key/value-like fragments from HTML/Nuxt state.
            hits=[]
            needles=['download','pdf','fileUrl','file_url','pdfUrl','pdf_url','urlPath','oss','sourceUrl','reportInfo','reportDetail','detailInfo','searchList','keyword','api/','355422','2.15M','31页']
            for needle in needles:
              for m in list(re.finditer(re.escape(needle),t,re.I))[:30]:
                frag=re.sub(r'\s+',' ',t[max(0,m.start()-450):m.start()+1500])
                if frag not in hits:hits.append(frag)
            print('HTML_HITS='+json.dumps({'url':page,'hits':hits[:120]},ensure_ascii=False))
            # Extract all URL-looking strings and keys nearby.
            urls=[]
            for u in re.findall(r'https?://[^"\'<>\s\\]+',t,re.I):
              if any(k in u.lower() for k in ['pdf','download','file','api','oss','report']):
                if u not in urls:urls.append(u)
            print('HTML_URLS='+json.dumps({'url':page,'urls':urls[:150]},ensure_ascii=False))
          print('SCRIPTS='+json.dumps(sorted(scripts),ensure_ascii=False))
          for su in sorted(scripts):
            try:
              q=s.get(su,timeout=90); body=q.text
              hitfrags=[]
              for needle in ['download','pdf','fileUrl','file_url','api/','axios','search','keyword','report/detail','report/list','detail/']:
                for m in list(re.finditer(re.escape(needle),body,re.I))[:60]:
                  frag=re.sub(r'\s+',' ',body[max(0,m.start()-500):m.start()+1800])
                  if frag not in hitfrags:hitfrags.append(frag)
              if hitfrags:
                print('SCRIPT_HITS='+json.dumps({'url':su,'status':q.status_code,'bytes':len(q.content),'hits':hitfrags[:180]},ensure_ascii=False))
              urls=[]
              for u in re.findall(r'https?://[^"\'<>\s\\]+',body,re.I):
                if any(k in u.lower() for k in ['api','download','pdf','report','file']):
                  if u not in urls:urls.append(u)
              if urls:print('SCRIPT_URLS='+json.dumps({'url':su,'urls':urls[:100]},ensure_ascii=False))
            except Exception as e:print('SCRIPT_ERR='+json.dumps({'url':su,'error':repr(e)},ensure_ascii=False))
          PY
