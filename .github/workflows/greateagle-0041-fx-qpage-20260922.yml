name: Fetch FXBaogao Great Eagle stock page
on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-fx-qpage-20260922.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          mkdir output
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          curl -L --fail --retry 2 --max-time 90 -A "$UA" 'https://www.fxbaogao.com/q/00041' -o output/q00041.html
          curl -L --fail --retry 2 --max-time 90 -A "$UA" 'https://www.fxbaogao.com/_next/static/chunks/pages/q/%5Bcode%5D-3640806307177440.js' -o output/qroute.js
          grep -RInE '鹰君|00041|searchReport|facet|reportStock|article|docId|reportId|fetchPost|fetchGet' output > output/hits.txt || true
          wc -c output/*
          head -c 5000 output/q00041.html
      - uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-fx-qpage
          path: output
          retention-days: 7
