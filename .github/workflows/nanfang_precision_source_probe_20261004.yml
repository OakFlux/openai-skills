name: Nanfang Precision Report Source Probe

on:
  push:
    branches:
      - chatgpt-nanfang-precision-reports-20261004
    paths:
      - .github/workflows/nanfang_precision_source_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Probe source pages, search results, and original attachments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import io
          import json
          import re
          from urllib.parse import quote, urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          pages = [
              {
                  'name': '2026_10jqka',
                  'url': 'https://news.10jqka.com.cn/field/sr/20260119/55776103.shtml',
                  'terms': ['pdfUrl', 'original', '公司深度', '南方精工'],
              },
              {
                  'name': 'stockstar_rating',
                  'url': 'https://stock.quote.stockstar.com/corp/rating_002553.shtml',
                  'terms': ['2022-10-13', '新能源汽车注入新活力', '查看详情', 'report'],
              },
              {
                  'name': 'greatwisdom_f10',
                  'url': 'https://webf10.gw.com.cn/SZ/B16/SZ002553_B16.html',
                  'terms': ['2022-10-13', '新能源汽车注入新活力', '东方财富证券', 'href'],
              },
              {
                  'name': 'nbd_2022',
                  'url': 'https://www.nbd.com.cn/articles/2022-10-13/2497526.html',
                  'terms': ['新能源汽车注入新活力', 'pdf', '研报'],
              },
              {
                  'name': 'sina_2026',
                  'url': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/822148019858/index.phtml',
                  'terms': ['南方精工', '中国银河', 'pdf', 'rptid'],
              },
          ]

          search_queries = [
              '"新能源汽车注入新活力" "南方精工" pdf',
              '"新能源汽车注入新活力，看好轴承+芯片双轮驱动"',
              'site:news.10jqka.com.cn/field/sr "南方精工" "轴承+芯片"',
              'site:stock.finance.sina.com.cn/stock/go.php/vReport_Show "新能源汽车注入新活力"',
              '"芯片研发取进展，业绩增长新动能" 南方精工',
          ]

          output = {'pages': [], 'searches': [], 'pdf_probes': []}

          def decode_response(response):
              for enc in ('utf-8', 'gb18030', response.apparent_encoding):
                  if not enc:
                      continue
                  try:
                      return response.content.decode(enc)
                  except Exception:
                      pass
              return response.text

          def extract_urls(text, base):
              urls = set()
              soup = BeautifulSoup(text, 'html.parser')
              for tag in soup.find_all(['a', 'iframe', 'embed', 'object', 'script', 'link']):
                  for attr in ('href', 'src', 'data'):
                      value = tag.get(attr)
                      if value:
                          urls.add(urljoin(base, value))
              for raw in re.findall(r'https?:(?:\\/\\/|//)[^\"\'<>\s]+', text):
                  urls.add(raw.replace('\\/', '/'))
              return sorted(urls)

          for spec in pages:
              record = {'name': spec['name'], 'url': spec['url']}
              try:
                  r = session.get(spec['url'], timeout=90, allow_redirects=True)
                  text = decode_response(r)
                  record.update({
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type'),
                      'bytes': len(r.content),
                      'title': (BeautifulSoup(text, 'html.parser').title.string if BeautifulSoup(text, 'html.parser').title else ''),
                  })
                  urls = extract_urls(text, r.url)
                  record['interesting_urls'] = [
                      u for u in urls
                      if any(k in u.lower() for k in ('pdf', 'original', 'report', 'rating', 'rptid', 'detail'))
                  ][:300]
                  record['pdfurl_regex'] = re.findall(
                      r'(?:pdfUrl|pdf_url|fileUrl|file_url|reportUrl)\s*[:=]\s*[\"\']([^\"\']+)',
                      text,
                      re.I,
                  )[:50]
                  snippets = []
                  for term in spec['terms']:
                      for match in re.finditer(re.escape(term), text, re.I):
                          snippet = text[max(0, match.start()-600):min(len(text), match.end()+1000)]
                          snippet = re.sub(r'\s+', ' ', snippet)
                          if snippet not in snippets:
                              snippets.append(snippet[:1800])
                          if len(snippets) >= 30:
                              break
                      if len(snippets) >= 30:
                          break
                  record['snippets'] = snippets
                  print('\nPAGE', spec['name'], json.dumps(record, ensure_ascii=False, indent=2))
              except Exception as exc:
                  record['error'] = repr(exc)
                  print('PAGE_ERROR', spec['name'], repr(exc))
              output['pages'].append(record)

          for query in search_queries:
              search_record = {'query': query, 'engines': []}
              search_urls = [
                  ('bing', 'https://www.bing.com/search?q=' + quote(query)),
                  ('baidu', 'https://www.baidu.com/s?wd=' + quote(query)),
              ]
              for engine, url in search_urls:
                  item = {'engine': engine, 'url': url}
                  try:
                      r = session.get(url, timeout=90, allow_redirects=True)
                      text = decode_response(r)
                      item.update({'status': r.status_code, 'bytes': len(r.content), 'final_url': r.url})
                      urls = extract_urls(text, r.url)
                      item['interesting_urls'] = [
                          u for u in urls
                          if any(host in u for host in (
                              '10jqka.com.cn', 'sina.com.cn', 'dfcfw.com', 'eastmoney.com',
                              'stockstar.com', 'fxbaogao.com', 'nxny.com', 'book118.com',
                          ))
                      ][:300]
                      snippets = []
                      for term in ('南方精工', '新能源汽车注入新活力', '芯片研发取进展'):
                          for m in re.finditer(re.escape(term), text, re.I):
                              snippet = re.sub(r'\s+', ' ', text[max(0,m.start()-500):min(len(text),m.end()+1000)])
                              if snippet not in snippets:
                                  snippets.append(snippet[:1800])
                              if len(snippets) >= 20:
                                  break
                      item['snippets'] = snippets
                  except Exception as exc:
                      item['error'] = repr(exc)
                  search_record['engines'].append(item)
              output['searches'].append(search_record)
              print('\nSEARCH', json.dumps(search_record, ensure_ascii=False, indent=2))

          # Validate every directly exposed PDF candidate.
          candidates = []
          for record in output['pages']:
              candidates.extend(record.get('pdfurl_regex') or [])
              candidates.extend(record.get('interesting_urls') or [])
          # Known public 2024 attachment.
          candidates.append('https://pdf.dfcfw.com/pdf/H3_AP202411021640685655_1.pdf')
          dedup = []
          seen = set()
          for candidate in candidates:
              clean = candidate.replace('\\/', '/').replace('&amp;', '&')
              if clean.startswith('//'):
                  clean = 'https:' + clean
              if not clean.lower().split('?')[0].endswith('.pdf'):
                  continue
              if clean not in seen:
                  dedup.append(clean)
                  seen.add(clean)

          for url in dedup:
              item = {'url': url}
              try:
                  r = session.get(url, headers={'Referer': 'https://news.10jqka.com.cn/'}, timeout=150, allow_redirects=True)
                  item.update({
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type'),
                      'bytes': len(r.content),
                      'is_pdf': r.content.startswith(b'%PDF'),
                  })
                  if item['is_pdf']:
                      reader = PdfReader(io.BytesIO(r.content))
                      item['pages'] = len(reader.pages)
                      try:
                          item['first_text'] = re.sub(r'\s+', ' ', reader.pages[0].extract_text() or '')[:1200]
                      except Exception:
                          item['first_text'] = ''
                  print('PDF_PROBE', json.dumps(item, ensure_ascii=False))
              except Exception as exc:
                  item['error'] = repr(exc)
              output['pdf_probes'].append(item)

          with open('output/probe.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          PY

      - name: Upload probe metadata
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-precision-source-probe
          path: output/probe.json
          retention-days: 1
