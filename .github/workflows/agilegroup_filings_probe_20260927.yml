name: Agile Group Filings Probe

on:
  push:
    branches:
      - chatgpt-agilegroup-filings-20260927
    paths:
      - .github/workflows/agilegroup_filings_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Inspect official financial reports and HKEX search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls=[
            'https://www.agile.com.cn/en/invest/report?level_id=1000000143',
            'https://www.agile.com.cn/invest/report?level_id=1000000143',
            'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=EN',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True,verify=False)
              r.encoding=r.apparent_encoding or 'utf-8'
              print('\n=== PAGE',url,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'),'ENC',r.encoding,'===')
              print(r.text[:4000])
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                text=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                blob=(text+' '+href).lower()
                if any(k in blob for k in ['annual report','interim report','年报','中期报告','financial','report','.pdf','download','3383','03383']):
                  links.append({'text':text,'href':href})
              print('LINKS',json.dumps(links,ensure_ascii=False,indent=2))
              # Print all PDF-like strings in HTML/JS.
              pdfs=sorted(set(re.findall(r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?|/[A-Za-z0-9_%./?=&-]+\.pdf(?:\?[^\"\'<>\s]*)?',r.text,re.I)))
              print('PDF_STRINGS',json.dumps(pdfs,ensure_ascii=False,indent=2))
            except Exception as exc:
              print('ERROR',url,repr(exc))

          # Probe Agile report page API endpoints mentioned in HTML/JS.
          try:
            page=s.get('https://www.agile.com.cn/en/invest/report?level_id=1000000143',timeout=60,verify=False)
            page.encoding=page.apparent_encoding or 'utf-8'
            js_urls=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page.text,re.I)
            print('SCRIPT_URLS',json.dumps(js_urls,ensure_ascii=False,indent=2))
            for src in js_urls:
              u=urljoin(page.url,src)
              try:
                rr=s.get(u,timeout=30,verify=False)
                rr.encoding=rr.apparent_encoding or 'utf-8'
                if any(x in rr.text.lower() for x in ['invest/report','api','ajax','financial report','annual report']):
                  print('\n=== SCRIPT',u,'STATUS',rr.status_code,'BYTES',len(rr.content),'===')
                  print(rr.text[:12000])
              except Exception as exc:
                print('SCRIPT_ERROR',u,repr(exc))
          except Exception as exc:
            print('PAGE_API_PROBE_ERROR',repr(exc))
          PY
