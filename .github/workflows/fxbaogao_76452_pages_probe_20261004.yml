name: Fxbaogao 76452 Public Pages Probe

on:
  push:
    branches:
      - chatgpt-nanfang-precision-reports-20261004
    paths:
      - .github/workflows/fxbaogao_76452_pages_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow img2pdf

      - name: Download sequential public report pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/pages
          python - <<'PY'
          import io, json, hashlib
          from pathlib import Path
          import requests
          from PIL import Image

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://www.fxbaogao.com/detail/76452'})
          base='https://public.fxbaogao.com/report-image/2016/08/02/76452-{}.png'
          records=[]
          valid=[]
          misses=0
          for page in range(1,61):
              url=base.format(page)
              r=s.get(url,timeout=60,allow_redirects=True)
              rec={'page':page,'url':url,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'final':r.url}
              ok=False
              if r.status_code==200 and len(r.content)>5000:
                  try:
                      im=Image.open(io.BytesIO(r.content))
                      rec['format']=im.format; rec['size']=list(im.size)
                      ok=im.width>500 and im.height>500
                  except Exception as e:
                      rec['image_error']=repr(e)
              rec['ok']=ok
              records.append(rec)
              print('PAGE',json.dumps(rec,ensure_ascii=False))
              if ok:
                  path=Path('output/pages')/f'{page:03d}.png'
                  path.write_bytes(r.content)
                  valid.append(path)
                  misses=0
              else:
                  misses+=1
                  if valid and misses>=3:
                      break
          Path('output/metadata.json').write_text(json.dumps({'valid_pages':len(valid),'records':records},ensure_ascii=False,indent=2),encoding='utf-8')
          if not valid:
              raise RuntimeError('No public page images found')
          # Convert public pages to one PDF without changing visual content.
          import img2pdf
          pdf=img2pdf.convert([str(p) for p in valid])
          out=Path('output/guojin_nanfang_bearing_2016_public_pages.pdf')
          out.write_bytes(pdf)
          print('FINAL',json.dumps({'pages':len(valid),'bytes':len(pdf),'sha256':hashlib.sha256(pdf).hexdigest()},ensure_ascii=False))
          PY

      - name: Upload public pages PDF
        uses: actions/upload-artifact@v4
        with:
          name: guojin-nanfang-bearing-2016-public-pages
          path: |
            output/guojin_nanfang_bearing_2016_public_pages.pdf
            output/metadata.json
          retention-days: 1
