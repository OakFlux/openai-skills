name: Probe HUTCHMED legacy annual reports via Wayback 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-wayback-annual-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Query Wayback and parse annual page
        run: |
          python - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pathlib import Path

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 research archive'})
          targets=[
            'http://www.chi-med.com/eng/irinfo/annual.htm',
            'http://www.chi-med.com/eng/irinfo/annual.php',
            'http://www.chi-med.com/eng/irinfo/annual_reports.htm',
          ]
          result=[]
          for target in targets:
            cdx='https://web.archive.org/cdx/search/cdx'
            params={'url':target,'output':'json','filter':['statuscode:200','mimetype:text/html'],'fl':'timestamp,original,statuscode,mimetype,digest','collapse':'digest','from':'2006','to':'2013'}
            try:
              r=s.get(cdx,params=params,timeout=90); print('CDX',target,r.status_code,len(r.content),r.url); print(r.text[:1000])
              if r.status_code!=200: continue
              rows=r.json()
              if len(rows)<=1: continue
              for row in rows[1:][-5:]:
                ts=row[0]; snap=f'https://web.archive.org/web/{ts}id_/{target}'
                rr=s.get(snap,timeout=90); print('SNAP',snap,rr.status_code,len(rr.content),rr.url)
                if rr.status_code!=200: continue
                text=rr.content.decode(rr.apparent_encoding or 'latin-1',errors='replace')
                soup=BeautifulSoup(text,'lxml')
                links=[]
                for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(target,a['href'])
                  key=(label+' '+href).lower()
                  if any(str(y) in key for y in range(2006,2012)) or ('annual' in key and '.pdf' in key):
                    links.append({'label':label,'href':href})
                if links:
                  result.append({'target':target,'timestamp':ts,'snapshot':snap,'links':links})
                  Path('annual_snapshot.htm').write_text(text,encoding='utf-8')
                  break
            except Exception as e:
              print('ERROR',target,repr(e))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          Path('wayback_annual_links.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-wayback-annual-probe
          path: |
            wayback_annual_links.json
            annual_snapshot.htm
          if-no-files-found: warn
          retention-days: 7
