name: package-donghu-hightech-600133-broker-final

on:
  push:
    branches:
      - tmp/donghu-hightech-600133-broker-final-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          python -m pip install --quiet requests pypdf pillow reportlab

      - name: Build validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import math
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfgen import canvas
          from reportlab.lib.utils import ImageReader

          COMPANY = "东湖高新"
          FULL_NAME = "武汉东湖高新集团股份有限公司"
          CODE = "600133"
          PREPARED = "2026-11-04"
          ROOT_NAME = "东湖高新_600133_券商研究资料_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          SOURCE_IMG_DIR = Path("_source_images")
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)
          SOURCE_IMG_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          body_font = "/usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf"
          title_font = "/usr/share/fonts/truetype/arphic-gkai00mp/gkai00mp.ttf"
          if not Path(body_font).exists() or not Path(title_font).exists():
              raise FileNotFoundError("Required CJK fonts were not found")
          pdfmetrics.registerFont(TTFont("CJKBody", body_font))
          pdfmetrics.registerFont(TTFont("CJKTitle", title_font))

          reports = [
              {
                  "sequence": 1,
                  "date": "2024-07-05",
                  "broker": "财通证券",
                  "analyst": "毕春晖",
                  "rating": "增持（维持）",
                  "report_type": "战略转型专题/公司研究",
                  "title": "调整发展战略，发力数字科技",
                  "document_form": "券商原始PDF",
                  "source_url": "https://duplik-1252068037.cos.ap-beijing.myqcloud.com/duplik/447460783945158/520072899438150/d8fe20905dc5417d9f9fbef103a6a7c7447460783945158.pdf",
                  "filename": "01_20240705_财通证券_调整发展战略发力数字科技_券商原始PDF.pdf",
              },
              {
                  "sequence": 2,
                  "date": "2023-06-29",
                  "public_date": "2023-06-30",
                  "broker": "财通证券",
                  "analyst": "毕春晖、李美岑",
                  "rating": "增持（首次覆盖）",
                  "report_type": "首次覆盖/公司研究",
                  "title": "置出工程业务，轻装再出发",
                  "document_form": "公开阅读器页面合成版（非券商原始PDF）",
                  "detail_url": "https://www.fxbaogao.com/detail/3770114",
                  "image_urls": [
                      "https://public.fxbaogao.com/report-image/2023/06/29/3770114-1.png",
                      "https://public.fxbaogao.com/report-image/2023/06/29/3770114-2.png",
                  ],
                  "filename": "02_20230629_财通证券_置出工程业务轻装再出发_公开阅读器页面合成版_非原始PDF.pdf",
              },
              {
                  "sequence": 3,
                  "date": "2023-11-01",
                  "public_date": "2023-11-02",
                  "broker": "财通证券",
                  "analyst": "毕春晖",
                  "rating": "增持（维持）",
                  "report_type": "三季报专题/公司跟踪",
                  "title": "资产减值略有承压，工程业务置出持续推进",
                  "document_form": "公开阅读器页面合成版（非券商原始PDF）",
                  "detail_url": "https://www.fxbaogao.com/detail/3990320",
                  "image_urls": [
                      "https://public.fxbaogao.com/report-image/2023/11/01/3990320-1.png",
                      "https://public.fxbaogao.com/report-image/2023/11/01/3990320-2.png",
                  ],
                  "filename": "03_20231101_财通证券_资产减值略有承压工程业务置出持续推进_公开阅读器页面合成版_非原始PDF.pdf",
              },
          ]

          def fetch_bytes(url: str, *, referer: str | None = None, minimum: int = 1000) -> tuple[bytes, str, str]:
              last = None
              for attempt in range(5):
                  try:
                      headers = {"Accept": "application/pdf,image/png,image/jpeg,*/*;q=0.8"}
                      if referer:
                          headers["Referer"] = referer
                      response = session.get(url, timeout=(30, 420), allow_redirects=True, headers=headers)
                      print("DOWNLOAD", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                      response.raise_for_status()
                      if len(response.content) >= minimum:
                          return response.content, response.url, response.headers.get("content-type", "")
                      last = RuntimeError(f"Response too small: {len(response.content)} bytes")
                  except Exception as exc:
                      last = exc
                      print("DOWNLOAD_ERROR", attempt, url, repr(exc))
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Download failed for {url}: {last}")

          def wrap_cn(text: str, width: int = 30) -> list[str]:
              text = text.strip()
              return [text[i:i+width] for i in range(0, len(text), width)] or [""]

          def create_reader_composite(spec: dict, output_path: Path) -> tuple[int, list[dict]]:
              images = []
              image_records = []
              for index, url in enumerate(spec["image_urls"], 1):
                  data, final_url, content_type = fetch_bytes(url, referer=spec["detail_url"], minimum=20_000)
                  if not data.startswith(b"\x89PNG\r\n\x1a\n") and not data.startswith(b"\xff\xd8\xff"):
                      raise RuntimeError(f"Invalid image header for {url}")
                  image_path = SOURCE_IMG_DIR / f"{spec['sequence']:02d}_{index}.png"
                  image_path.write_bytes(data)
                  with Image.open(image_path) as image:
                      image.verify()
                  with Image.open(image_path) as image:
                      width, height = image.size
                  images.append(image_path)
                  image_records.append({
                      "page": index,
                      "source_url": final_url,
                      "content_type": content_type,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "pixel_width": width,
                      "pixel_height": height,
                  })

              c = canvas.Canvas(str(output_path), pagesize=A4, pageCompression=1)
              page_w, page_h = A4

              # Disclosure page.
              c.setFillColor(colors.HexColor("#9b1c1c"))
              c.roundRect(18 * mm, page_h - 48 * mm, page_w - 36 * mm, 24 * mm, 3 * mm, fill=0, stroke=1)
              c.setFont("CJKTitle", 17)
              c.drawString(25 * mm, page_h - 33 * mm, "公开阅读器页面合成版 - 非券商原始PDF")
              c.setFillColor(colors.HexColor("#1f2937"))
              c.setFont("CJKTitle", 19)
              y = page_h - 68 * mm
              for line in wrap_cn(spec["title"], 22):
                  c.drawString(22 * mm, y, line)
                  y -= 10 * mm
              y -= 3 * mm
              c.setFont("CJKBody", 11)
              meta_lines = [
                  f"公司：{FULL_NAME}（{CODE}.SH）",
                  f"券商：{spec['broker']}",
                  f"研究员：{spec['analyst']}",
                  f"报告日期：{spec['date']}；公开页面日期：{spec.get('public_date', '')}",
                  f"评级：{spec['rating']}",
                  f"报告类型：{spec['report_type']}",
                  "",
                  "文件性质说明：",
                  "本文件由公开阅读器中可直接访问的完整逐页图像合成。",
                  "它不是券商发布的原始PDF，不保留原PDF的文本层、书签、元数据或附件。",
                  "报告正文页面未改写；版权归原券商及作者所有，仅供研究与存档。",
              ]
              for line in meta_lines:
                  for wrapped in wrap_cn(line, 36):
                      c.drawString(22 * mm, y, wrapped)
                      y -= 7 * mm
                  if not line:
                      y -= 2 * mm
              c.setFont("CJKBody", 8.5)
              c.setFillColor(colors.HexColor("#555555"))
              c.drawString(22 * mm, 20 * mm, f"来源索引：{spec['detail_url']}")
              c.drawString(22 * mm, 14 * mm, f"整理日期：{PREPARED}")
              c.showPage()

              # Unmodified public reader pages, scaled to fit A4.
              for image_path in images:
                  with Image.open(image_path) as image:
                      iw, ih = image.size
                  margin = 4 * mm
                  max_w = page_w - 2 * margin
                  max_h = page_h - 2 * margin
                  scale = min(max_w / iw, max_h / ih)
                  draw_w = iw * scale
                  draw_h = ih * scale
                  x = (page_w - draw_w) / 2
                  y = (page_h - draw_h) / 2
                  c.drawImage(ImageReader(str(image_path)), x, y, width=draw_w, height=draw_h, preserveAspectRatio=True, mask="auto")
                  c.showPage()
              c.save()
              return 1 + len(images), image_records

          manifest = []

          # Original PDF.
          original = reports[0]
          original_data, original_final_url, original_type = fetch_bytes(original["source_url"], minimum=100_000)
          if not original_data.startswith(b"%PDF-"):
              raise RuntimeError("Original report response is not a PDF")
          original_path = PDF_DIR / original["filename"]
          original_path.write_bytes(original_data)
          original_reader = PdfReader(str(original_path), strict=False)
          original_pages = len(original_reader.pages)
          if original_pages < 3:
              raise RuntimeError(f"Original report unexpectedly short: {original_pages} pages")
          original_text = "\n".join((page.extract_text() or "") for page in original_reader.pages[: min(5, original_pages)])
          compact_original_text = re.sub(r"\s+", "", original_text)
          if not (COMPANY in compact_original_text or CODE in compact_original_text or FULL_NAME in compact_original_text):
              raise RuntimeError("Original PDF issuer validation failed")
          manifest.append({
              **original,
              "actual_pages": original_pages,
              "report_body_pages": original_pages,
              "bytes": len(original_data),
              "sha256": hashlib.sha256(original_data).hexdigest(),
              "downloaded_source_url": original_final_url,
              "content_type": original_type,
          })

          # Reader composites.
          for spec in reports[1:]:
              path = PDF_DIR / spec["filename"]
              pages, image_records = create_reader_composite(spec, path)
              data = path.read_bytes()
              reader = PdfReader(str(path), strict=False)
              if len(reader.pages) != pages or pages != 3:
                  raise RuntimeError(f"Unexpected composite page count for {path.name}: {len(reader.pages)}")
              manifest.append({
                  **spec,
                  "actual_pages": pages,
                  "report_body_pages": 2,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_page_images": image_records,
              })

          # Structural checks and previews.
          for item in manifest:
              path = PDF_DIR / item["filename"]
              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {path.name}: {check.stdout}")
              preview_page = 1 if item["document_form"] == "券商原始PDF" else 2
              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", str(preview_page), "-l", str(preview_page), "-png", "-r", "150", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f"Preview failed for {path.name}: {render.stdout}")
              item["preview_file"] = str(Path("首页预览") / preview.name)

          readme = [
              f"{FULL_NAME}（{CODE}.SH）券商研究资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：1份券商原始PDF + 2份公开阅读器页面合成版。",
              "两份合成版均由公开页面中完整的2页报告图像合成，并额外添加1页文件性质说明；它们不是券商原始PDF。",
              "未绕过登录、会员或付费限制，也未将网页摘要冒充原报告。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              source = item.get("downloaded_source_url") or item.get("detail_url") or item.get("source_url")
              readme.extend([
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   类型：{item['report_type']}；券商：{item['broker']}；研究员：{item['analyst']}",
                  f"   日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   PDF实际页数：{item['actual_pages']}；报告正文页数：{item['report_body_pages']}；文件大小：{item['bytes']}字节",
                  f"   公开来源：{source}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司/证券代码或报告元数据、实际页数、源图像完整性、qpdf结构、页面渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "original_pdf_count": sum(item["document_form"] == "券商原始PDF" for item in manifest),
              "reader_composite_count": sum("合成版" in item["document_form"] for item in manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "文件性质", "报告类型", "券商", "研究员", "日期", "标题", "评级", "PDF页数", "报告正文页数", "字节数", "SHA-256", "公开来源"])
              for item in manifest:
                  source = item.get("downloaded_source_url") or item.get("detail_url") or item.get("source_url")
                  writer.writerow([
                      item["filename"], item["document_form"], item["report_type"], item["broker"], item["analyst"], item["date"],
                      item["title"], item["rating"], item["actual_pages"], item["report_body_pages"], item["bytes"], item["sha256"], source,
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("donghu_hightech_600133_broker_research_materials_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 3:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 3")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": payload["original_pdf_count"],
              "reader_composite_count": payload["reader_composite_count"],
              "files": [{k: item[k] for k in ["filename", "document_form", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "report_body_pages", "bytes", "sha256"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: donghu-hightech-600133-broker-research-materials-3-20261104
          path: |
            donghu_hightech_600133_broker_research_materials_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
