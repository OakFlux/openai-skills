name: Build Kersen 603626 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kesen-603626-broker-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '603626'
          COMPANY = '科森科技'
          COMPANY_FULL = '昆山科森科技股份有限公司'
          AS_OF = '2026-10-28'
          PACKAGE = '科森科技_603626_券商深度与首次覆盖报告_完整版_3份_截至20261028'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / 'PDF原文'
          PREVIEW_DIR = ROOT / '首页预览'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def compact(value: Any) -> str:
              return re.sub(r'[\s，。、“”‘’：:；;（）()—－+&·]+', '', str(value or '')).lower()

          api = 'https://reportapi.eastmoney.com/report/list'
          rows: list[dict[str, Any]] = []
          for page in range(1, 30):
              params = {
                  'industryCode':'*', 'pageSize':'100', 'industry':'*', 'rating':'*',
                  'ratingChange':'*', 'beginTime':'2017-01-01', 'endTime':'2030-12-31',
                  'pageNo':str(page), 'fields':'', 'qType':'0', 'orgCode':'',
                  'code':STOCK_CODE, 'rcode':'', 'p':str(page),
                  'pageNum':str(page), 'pageNumber':str(page),
              }
              data = None
              last = None
              for attempt in range(7):
                  try:
                      r = session.get(api, params=params, timeout=(20, 120))
                      last = {'status':r.status_code,'text':r.text[:300]}
                      if r.status_code == 200:
                          data = r.json()
                          break
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'report API failed page {page}: {last}')
              batch = data.get('data') or []
              print('INDEX_PAGE', page, 'HITS', data.get('hits'), 'ROWS', len(batch), flush=True)
              if not batch:
                  break
              rows.extend(batch)
              if len(batch) < 100:
                  break

          dedup: dict[str, dict[str, Any]] = {}
          for row in rows:
              code = str(row.get('infoCode') or '')
              if code:
                  dedup.setdefault(code, row)
          rows = list(dedup.values())

          def pages_of(row: dict[str, Any]) -> int:
              try:
                  return int(row.get('attachPages') or 0)
              except Exception:
                  return 0

          preferences = [
              {
                  'title_tokens':['精密制造为基','机器人业务迎来破局时刻'],
                  'broker_tokens':['国盛证券'],
                  'label':'2026年国盛证券首次覆盖',
              },
              {
                  'title_tokens':['深耕精密金属结构件','2020年业绩全面反转'],
                  'broker_tokens':['国盛证券'],
                  'label':'2020年国盛证券首次覆盖',
              },
              {
                  'title_tokens':['深耕消费电子精密金属件制造','拐点已现','空间打开'],
                  'broker_tokens':['华西证券'],
                  'label':'2020年华西证券公司深度',
              },
              {
                  'title_tokens':['借势不锈钢','新秀崛起'],
                  'broker_tokens':['华泰证券'],
                  'label':'2017年华泰证券首次覆盖',
              },
          ]

          selected: list[dict[str, Any]] = []
          used_codes: set[str] = set()
          for pref in preferences:
              matches = []
              for row in rows:
                  title_c = compact(row.get('title'))
                  broker_c = compact(str(row.get('orgSName') or '') + str(row.get('orgName') or ''))
                  if not all(compact(tok) in title_c for tok in pref['title_tokens']):
                      continue
                  if not any(compact(tok) in broker_c for tok in pref['broker_tokens']):
                      continue
                  if pages_of(row) < 15:
                      continue
                  matches.append(row)
              matches.sort(key=lambda x:(str(x.get('publishDate') or ''), pages_of(x)), reverse=True)
              if matches:
                  row = dict(matches[0])
                  code = str(row.get('infoCode') or '')
                  if code and code not in used_codes:
                      row['_selection_label'] = pref['label']
                      selected.append(row)
                      used_codes.add(code)
              if len(selected) >= 3:
                  break

          direct_fallbacks = [
              {
                  '_selection_label':'2020年华西证券公司深度',
                  'title':'深耕消费电子精密金属件制造，拐点已现，空间打开',
                  'orgSName':'华西证券', 'orgName':'华西证券股份有限公司',
                  'publishDate':'2020-02-21 00:00:00.000', 'researcher':'刘菁,孙远峰,俞能飞',
                  'emRatingName':'买入', 'infoCode':'AP202002231375391843', 'attachPages':18,
                  '_direct_url':'https://pdf.dfcfw.com/pdf/H3_AP202002231375391843_1.pdf',
              },
              {
                  '_selection_label':'2017年华泰证券首次覆盖',
                  'title':'颜值时代系列报告三：借势不锈钢，新秀崛起',
                  'orgSName':'华泰证券', 'orgName':'华泰证券股份有限公司',
                  'publishDate':'2017-04-11 00:00:00.000', 'researcher':'张騄',
                  'emRatingName':'买入（首次评级）', 'infoCode':'HTSC20170411KERSEN', 'attachPages':25,
                  '_direct_url':'https://crm.htsc.com.cn/doc/2017/10710101/1fb328ab-3983-4a3c-82fe-7e571d1b24c6.pdf',
              },
          ]
          for row in direct_fallbacks:
              if len(selected) >= 3:
                  break
              if any(compact(x.get('title')) == compact(row.get('title')) for x in selected):
                  continue
              selected.append(row)

          if len(selected) < 2:
              raise RuntimeError(f'Only {len(selected)} suitable reports found')
          selected = selected[:3]

          print('SELECTED')
          for row in selected:
              print(json.dumps({k:row.get(k) for k in ['_selection_label','title','orgSName','orgName','publishDate','infoCode','attachPages','researcher','emRatingName','_direct_url']}, ensure_ascii=False), flush=True)

          def download_pdf(row: dict[str, Any]) -> tuple[bytes, str, dict[str, Any]]:
              direct = row.get('_direct_url')
              urls = []
              if direct:
                  urls.append(str(direct))
              code = str(row.get('infoCode') or '')
              if code.startswith('AP'):
                  urls.extend([
                      f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H1_{code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf',
                  ])
              last: dict[str, Any] = {}
              for url in dict.fromkeys(urls):
                  for attempt in range(7):
                      try:
                          r = session.get(url, timeout=(30, 480), allow_redirects=True, headers={
                              'User-Agent':session.headers['User-Agent'],
                              'Referer':'https://data.eastmoney.com/report/',
                              'Accept':'application/pdf,*/*;q=0.8',
                          })
                          last = {'url':url,'status':r.status_code,'final_url':r.url,
                                  'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 100000:
                              return r.content, url, last
                      except Exception as exc:
                          last = {'url':url,'error':repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {row.get("title")}: {last}')

          def safe_name(value: Any) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', str(value or ''))
              value = re.sub(r'\s+', '', value).strip('._')
              return value[:95] or '报告'

          manifest = []
          hashes: set[str] = set()
          for idx, row in enumerate(selected, 1):
              data, pdf_url, download_meta = download_pdf(row)
              broker = str(row.get('orgSName') or row.get('orgName') or '券商')
              title = str(row.get('title') or '')
              date = str(row.get('publishDate') or '')[:10]
              filename = f'{idx:02d}_{safe_name(broker)}_科森科技_{safe_name(title)}_{date}.pdf'
              dest = PDF_DIR / filename
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < 15:
                  raise RuntimeError(f'too few pages: {filename}: {pages}')
              text = ''
              for page in reader.pages[:min(35, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              text_c = compact(text)
              if not any(compact(x) in text_c for x in [COMPANY, COMPANY_FULL, STOCK_CODE]):
                  raise RuntimeError(f'issuer identity mismatch: {filename}')
              broker_short = broker.replace('股份有限公司','').replace('有限责任公司','').replace('证券','')
              if compact(broker_short) and compact(broker_short) not in text_c and compact(broker) not in text_c:
                  raise RuntimeError(f'broker identity mismatch: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              if sha in hashes:
                  raise RuntimeError(f'duplicate report: {filename}')
              hashes.add(sha)

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)], check=True,
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',
                              str(dest),str(prefix)], check=True,
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10000:
                  raise RuntimeError(f'preview failed: {filename}')

              info_code = str(row.get('infoCode') or '')
              manifest.append({
                  'selection_label':row.get('_selection_label'),
                  'title':title,
                  'broker':broker,
                  'broker_full':row.get('orgName'),
                  'date':date,
                  'analysts':row.get('researcher'),
                  'rating':row.get('emRatingName') or row.get('sRatingName'),
                  'info_code':info_code,
                  'index_pages':row.get('attachPages'),
                  'actual_pages':pages,
                  'bytes':len(data),
                  'filename':filename,
                  'pdf_url':pdf_url,
                  'source_report_page':f'https://data.eastmoney.com/report/info/{info_code}.html' if info_code.startswith('AP') else row.get('_direct_url'),
                  'sha256':sha,
                  'download_meta':download_meta,
                  'preview_file':str(Path('首页预览') / preview.name),
                  'document_nature':'券商原始完整PDF',
                  'validation':['PDF header','issuer identity','broker identity','minimum page count','qpdf structure','first-page render','duplicate hash check'],
              })

          readme = [
              '昆山科森科技股份有限公司（603626.SH）券商深度与首次覆盖报告资料包',
              f'整理基准日：{AS_OF}', '',
              f'本包收录{len(manifest)}份公开可直接取得并完成全文核验的券商原始完整PDF。',
              '筛选标准：优先公司深度、首次覆盖和长篇公司研究；排除年报、季报、事件点评和网页摘要。', ''
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；分析师：{item['analysts'] or '未列示'}；评级：{item['rating'] or '未列示'}",
                  f"   完整页数：{item['actual_pages']}页；文件：PDF原文/{item['filename']}",
                  f"   来源页面：{item['source_report_page']}",
                  f"   SHA-256：{item['sha256']}", ''
              ]
          readme += [
              '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商身份、实际页数、qpdf结构、首页渲染、重复文件、ZIP CRC及SHA-256。'
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  PDF原文/{item['filename']}\n" for item in manifest), encoding='utf-8'
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      z.write(path, arcname=f'{PACKAGE}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              pdfs = [name for name in z.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest) or not (2 <= len(pdfs) <= 3):
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}, manifest={len(manifest)}')

          short_path = Path('kesen_603626_broker_deep_reports.zip')
          shutil.copy2(zip_path, short_path)
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha, flush=True)
          print('REPORT_COUNT', len(manifest), flush=True)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: kesen-603626-broker-deep-reports-final-20261028
          path: |
            科森科技_603626_券商深度与首次覆盖报告_完整版_3份_截至20261028.zip
            kesen_603626_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
