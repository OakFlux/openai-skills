name: Inspect Huabao public report viewer network with Playwright

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-playwright-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Capture network and DOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          IDS=['5343581','5367228','5666169']

          async def inspect(docid):
              network=[]; responses=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  context=await browser.new_context(viewport={'width':1440,'height':1800},locale='zh-CN')
                  page=await context.new_page()
                  page.on('request',lambda req: network.append({'method':req.method,'url':req.url,'resource_type':req.resource_type,'post_data':req.post_data}))
                  async def on_response(resp):
                      u=resp.url
                      if any(k in u.lower() for k in ['api.fxbaogao','report-image','pdf','download','document','page','view','file','oss']):
                          item={'url':u,'status':resp.status,'headers':await resp.all_headers()}
                          try:
                              ct=(item['headers'].get('content-type') or '').lower()
                              if 'json' in ct or 'text' in ct or 'javascript' in ct:
                                  txt=await resp.text(); item['text_prefix']=txt[:5000]
                          except Exception as e: item['body_error']=repr(e)
                          responses.append(item)
                  page.on('response',on_response)
                  url=f'https://www.fxbaogao.com/view?id={docid}'
                  try:
                      await page.goto(url,wait_until='domcontentloaded',timeout=90000)
                      await page.wait_for_timeout(12000)
                      for _ in range(8):
                          await page.mouse.wheel(0,5000); await page.wait_for_timeout(1200)
                      title=await page.title()
                      html=await page.content()
                      text=await page.locator('body').inner_text()
                      imgs=await page.locator('img').evaluate_all("els => els.map(e => ({src:e.src,alt:e.alt,width:e.naturalWidth,height:e.naturalHeight,className:e.className}))")
                      canvases=await page.locator('canvas').count()
                      links=await page.locator('a').evaluate_all("els => els.map(e => ({href:e.href,text:(e.innerText||'').trim()})).filter(x=>x.href)")
                      print('PAGE',docid,'TITLE',title,'IMGS',len(imgs),'CANVASES',canvases,'TEXT',text[:1000].replace('\n',' '),flush=True)
                      relevant=[x for x in network if any(k in x['url'].lower() for k in ['api.fxbaogao','report-image','.pdf','download','document','page','view','file','oss'])]
                      print('NETWORK',docid,json.dumps(relevant[-200:],ensure_ascii=False)[:50000],flush=True)
                      print('RESPONSES',docid,json.dumps(responses[-200:],ensure_ascii=False)[:50000],flush=True)
                      print('IMAGES',docid,json.dumps(imgs,ensure_ascii=False)[:30000],flush=True)
                      Path(f'out/{docid}.html').write_text(html,encoding='utf-8')
                      Path(f'out/{docid}.txt').write_text(text,encoding='utf-8')
                      Path(f'out/{docid}_network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
                      Path(f'out/{docid}_responses.json').write_text(json.dumps(responses,ensure_ascii=False,indent=2),encoding='utf-8')
                      Path(f'out/{docid}_images.json').write_text(json.dumps(imgs,ensure_ascii=False,indent=2),encoding='utf-8')
                      Path(f'out/{docid}_links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
                      await page.screenshot(path=f'out/{docid}.png',full_page=True)
                  except Exception as e:
                      print('ERROR',docid,repr(e),flush=True)
                      Path(f'out/{docid}_error.txt').write_text(repr(e),encoding='utf-8')
                  await browser.close()

          async def main():
              for docid in IDS:
                  await inspect(docid)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-playwright-network
          path: out/
          retention-days: 3
          if-no-files-found: error
