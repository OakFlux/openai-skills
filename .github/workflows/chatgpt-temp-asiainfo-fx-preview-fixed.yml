name: chatgpt-temp-asiainfo-fx-preview-fixed
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-asiainfo-fx-preview-fixed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build readable PDFs from the public preview images
        shell: bash
        run: |
          python -m pip install --quiet requests pillow pypdf
          python <<'PY'
          import hashlib, io, json, re
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          root=Path('asiainfo_fx_preview_fixed');pdfdir=root/'PDF';pagesroot=root/'pages'
          pdfdir.mkdir(parents=True,exist_ok=True);pagesroot.mkdir(parents=True,exist_ok=True)
          reports=[
            {'id':'5415424','date':'2026-05-13','institution':'国信证券','title':'AI大模型交付龙头，不断拓展新领域','paths':['report-image/2026/05/13/5415424-1.png','report-image/2026/05/13/5415424-2.png']},
            {'id':'4154738','date':'2024-02-27','institution':'华盛证券','title':'宏观环境冲击行业，三新业务砥砺前行','paths':['report-image/2024/02/27/4154738-1.png','report-image/2024/02/27/4154738-2.png']}
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/'})
          manifest=[]
          for rpt in reports:
            imgs=[];meta=[];pdir=pagesroot/rpt['id'];pdir.mkdir(parents=True,exist_ok=True)
            for i,path in enumerate(rpt['paths'],1):
              u='https://public.fxbaogao.com/'+path
              r=s.get(u,headers={'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'},timeout=120,allow_redirects=True)
              print(f"GET {rpt['id']} page={i} HTTP={r.status_code} bytes={len(r.content)} type={r.headers.get('content-type')} final={r.url}",flush=True)
              if r.status_code!=200 or len(r.content)<10000:raise RuntimeError(f'Image unavailable {u}')
              im=Image.open(io.BytesIO(r.content));im.load()
              # Public previews may use transparent backgrounds. Composite onto white before PDF conversion.
              if 'A' in im.getbands():
                rgba=im.convert('RGBA')
                bg=Image.new('RGBA',rgba.size,(255,255,255,255))
                rgb=Image.alpha_composite(bg,rgba).convert('RGB')
              elif im.mode=='P' and 'transparency' in im.info:
                rgba=im.convert('RGBA')
                bg=Image.new('RGBA',rgba.size,(255,255,255,255))
                rgb=Image.alpha_composite(bg,rgba).convert('RGB')
              else:
                rgb=im.convert('RGB')
              p=pdir/f'page_{i:02d}.png';rgb.save(p,'PNG',optimize=True)
              imgs.append(rgb.copy());meta.append({'page':i,'url':r.url,'source_mode':im.mode,'width':im.width,'height':im.height,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
            fn=re.sub(r'[\\/:*?"<>|]+','_',f"{rpt['date']}_{rpt['institution']}_亚信科技_{rpt['title']}_公开试读2页")+'.pdf'
            out=pdfdir/fn;imgs[0].save(out,'PDF',save_all=True,append_images=imgs[1:],resolution=160.0)
            pc=len(PdfReader(str(out),strict=False).pages);data=out.read_bytes()
            if pc!=2:raise RuntimeError(f'Unexpected PDF pages {pc}')
            rec={**rpt,'filename':fn,'public_preview_pages':pc,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_page':f"https://www.fxbaogao.com/detail/{rpt['id']}",'pages':meta}
            manifest.append(rec);print('VALID '+json.dumps(rec,ensure_ascii=False),flush=True)
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AsiaInfo-FX-Public-Previews-Fixed
          path: asiainfo_fx_preview_fixed
          retention-days: 1
          compression-level: 6
