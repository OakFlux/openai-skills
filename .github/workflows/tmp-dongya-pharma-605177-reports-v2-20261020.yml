name: Build Dongya Pharma 605177 filing package v2

on:
  push:
    branches: [tmp-dongya-pharma-605177-reports-20261020]
    paths: ['.github/workflows/tmp-dongya-pharma-605177-reports-v2-20261020.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='东亚药业_605177_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE"

          cat > /tmp/build.py <<'PY'
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import unquote, urljoin
          import requests

          OUT = Path('东亚药业_605177_全部年报_招股说明书_最新季报')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          S = requests.Session()
          S.headers.update({'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7'})
          anchor_re = re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''', re.I | re.S)
          pdf_re = re.compile(r'''https?://[^\s"'<>]+?\.pdf(?:\?[^\s"'<>]*)?''', re.I)

          rows = [
              dict(order=1, kind='年度报告', period='2020年度', title='东亚药业2020年年度报告', filename='01_东亚药业_2020年年度报告.pdf', min_pages=50, direct='http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-30/7197439.PDF'),
              dict(order=2, kind='年度报告', period='2021年度', title='东亚药业2021年年度报告', filename='02_东亚药业_2021年年度报告.pdf', min_pages=50, direct='http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-01/7947674.PDF'),
              dict(order=3, kind='年度报告', period='2022年度', title='东亚药业2022年年度报告', filename='03_东亚药业_2022年年度报告.pdf', min_pages=50, direct='http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-11/8968269.PDF'),
              dict(order=4, kind='年度报告', period='2023年度', title='东亚药业2023年年度报告', filename='04_东亚药业_2023年年度报告.pdf', min_pages=50, direct='http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-24/10036424.PDF'),
              dict(order=5, kind='年度报告', period='2024年度', title='东亚药业2024年年度报告', filename='05_东亚药业_2024年年度报告.pdf', min_pages=50, direct='http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-30/11062356.PDF'),
              dict(order=6, kind='年度报告', period='2025年度', title='东亚药业2025年年度报告', filename='06_东亚药业_2025年年度报告.pdf', min_pages=50, direct='http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-23/12138617.PDF'),
              dict(order=7, kind='招股说明书', period='首次公开发行并上市', title='东亚药业首次公开发行股票招股说明书', filename='07_东亚药业_首次公开发行股票招股说明书.pdf', min_pages=100, direct='https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2020/2020-11/2020-11-13/6722092.PDF'),
          ]

          def get(url, referer=None, pdf=False):
              headers = {'Accept': 'application/pdf,application/octet-stream;q=0.9,text/html;q=0.8,*/*;q=0.7'}
              if referer:
                  headers['Referer'] = referer
              last = None
              for n in range(8):
                  try:
                      r = S.get(url, headers=headers, timeout=300, allow_redirects=True)
                      r.raise_for_status()
                      if pdf and not r.content.startswith(b'%PDF-'):
                          raise RuntimeError(f'not PDF: {r.status_code} {r.headers.get("content-type")} {r.content[:60]!r}')
                      return r.content, r.url
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + n)
              raise RuntimeError(f'fetch failed {url}: {last}')

          def decode(raw):
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try: return raw.decode(enc)
                  except UnicodeDecodeError: pass
              return raw.decode('utf-8', errors='replace')

          def anchors(url):
              raw, final = get(url)
              text = decode(raw)
              out = []
              for m in anchor_re.finditer(text):
                  href = unquote(html.unescape(m.group(1).strip()))
                  label = html.unescape(re.sub(r'\s+', '', re.sub(r'<[^>]+>', '', m.group(2))))
                  out.append((label, urljoin(final, href)))
              return out

          q3 = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/605177/page_type/sjdbg.phtml'
          q1 = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinYi/stockid/605177/page_type/yjdbg.phtml'
          q3c = [(a,b) for a,b in anchors(q3) if '2026年' in a and ('第三季度报告' in a or '三季度报告' in a) and '摘要' not in a]
          if q3c:
              label, detail = q3c[0]
              quarter = dict(order=8, kind='最新季报', period='2026年第三季度', title=label, filename='08_东亚药业_2026年第三季度报告_最新季报.pdf', min_pages=5, detail=detail)
          else:
              q1c = [(a,b) for a,b in anchors(q1) if '2026年' in a and ('第一季度报告' in a or '一季度报告' in a) and '摘要' not in a]
              if not q1c:
                  raise RuntimeError('No 2026 quarterly report found')
              label, detail = q1c[0]
              quarter = dict(order=8, kind='最新季报', period='2026年第一季度', title=label, filename='08_东亚药业_2026年第一季度报告_最新季报.pdf', min_pages=5, detail=detail)
          rows.append(quarter)

          def obtain_detail(detail):
              raw, final = get(detail)
              if raw.startswith(b'%PDF-'):
                  return raw, final
              text = decode(raw)
              candidates = []
              for m in anchor_re.finditer(text):
                  href = unquote(html.unescape(m.group(1).strip()))
                  label = html.unescape(re.sub(r'\s+', '', re.sub(r'<[^>]+>', '', m.group(2))))
                  full = urljoin(final, href)
                  if '.pdf' in full.lower() or '下载公告' in label or '公告原文' in label:
                      candidates.append((0 if '下载公告' in label else 1, full))
              for m in pdf_re.finditer(text):
                  candidates.append((2, unquote(html.unescape(m.group(0)))))
              seen = set(); errors=[]
              for _, candidate in sorted(candidates, key=lambda x:(x[0],len(x[1]))):
                  if candidate in seen: continue
                  seen.add(candidate)
                  try:
                      data, resolved = get(candidate, referer=final, pdf=True)
                      if len(data) > 50000:
                          return data, resolved
                  except Exception as exc:
                      errors.append(str(exc))
              raise RuntimeError(f'No valid PDF on {detail}; candidates={len(candidates)} errors={errors[:5]}')

          for row in rows:
              if 'direct' in row:
                  data, final = get(row['direct'], pdf=True)
              else:
                  data, final = obtain_detail(row['detail'])
              (OUT / row['filename']).write_bytes(data)
              row['pdf_url'] = final
              row['bytes'] = len(data)
              print('SAVED', row['filename'], len(data), final)

          (OUT / '_metadata.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          python3 /tmp/build.py

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l 50 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '浙江东亚药业股份有限公司|东亚药业' "$pdf.txt"
            rm -f "$pdf.txt"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$pdf.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$pdf" "$pdf.last" >/dev/null 2>&1
            test -s "$pdf.first.png" && test -s "$pdf.last.png"
            rm -f "$pdf.first.png" "$pdf.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          folder=Path('东亚药业_605177_全部年报_招股说明书_最新季报')
          rows=json.loads((folder/'_metadata.json').read_text(encoding='utf-8'))
          by_name={r['filename']:r for r in rows}
          pdfs=sorted(folder.glob('*.pdf'))
          if len(pdfs)!=8: raise SystemExit(f'Expected 8 PDFs, found {len(pdfs)}')
          latest=next(r for r in rows if r['kind']=='最新季报')
          lines=['浙江东亚药业股份有限公司（东亚药业，605177）','上市以来全部年度报告、正式招股说明书及最新季报','整理日期：2026-10-20','','收录说明：','1. 收录2020—2025年度报告全文，共6份。','2. 招股说明书采用2020年11月13日披露的首次公开发行股票正式版，排除摘要、招股意向书和申报稿。',f"3. 截至2026-10-20，最新已披露季度报告为《{latest['title']}》。",'4. 2026年半年度报告不属于季度报告，未用其替代“最新季报”。','5. 文件均为完整PDF原件；压缩包附来源和SHA-256校验值。','','文件清单：']
          sums=[]; total_pages=0; total_bytes=0
          for pdf in pdfs:
              r=by_name[pdf.name]; data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace',stderr=subprocess.DEVNULL)
              pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              if pages<int(r['min_pages']): raise SystemExit(f'{pdf.name}: only {pages} pages')
              total_pages+=pages; total_bytes+=len(data)
              lines += [f'- {pdf.name}',f"  类型：{r['kind']}；报告期：{r['period']}；页数：{pages}；大小：{len(data)}字节",f"  标题：{r['title']}",f"  PDF来源：{r['pdf_url']}",f'  SHA-256：{sha}']
              sums.append(f'{sha}  {pdf.name}')
          lines += ['',f'合计页数：{total_pages}页。',f'PDF原件合计大小：{total_bytes}字节。','全部PDF均已通过文件头、文件大小、PDF结构、实际页数、正文公司名称及首末页渲染检查。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (folder/'_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Dongya-Pharma-605177-all-annual-prospectus-latest-quarter-v2
          path: 东亚药业_605177_全部年报_招股说明书_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
