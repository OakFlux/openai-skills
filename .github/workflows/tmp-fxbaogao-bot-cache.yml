name: Temporary fxbaogao crawler cache probe

on:
  push:
    branches:
      - tmp/china-everbright-fxbaogao-bot-cache-20260831

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Fetch crawler variants
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('out'); OUT.mkdir()
          base='https://www.fxbaogao.com/detail/5040903'
          agents={
            'desktop':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
            'googlebot':'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
            'googlebot_mobile':'Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
            'bingbot':'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm) Chrome/116 Safari/537.36',
            'baidu':'Mozilla/5.0 (compatible; Baiduspider/2.0; +http://www.baidu.com/search/spider.html)',
            'sogou':'Sogou web spider/4.0(+http://www.sogou.com/docs/help/webmasters.htm#07)',
            'yandex':'Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)',
            'bytespider':'Mozilla/5.0 (compatible; Bytespider; spider-feedback@bytedance.com)',
          }
          variants=[
            ('plain',base),
            ('escaped',base+'?_escaped_fragment_='),
            ('amp',base+'?amp=1'),
            ('output',base+'?output=1'),
            ('from_baidu',base+'?from=baidu'),
            ('from_bing',base+'?from=bing'),
          ]
          result=[]
          for aname,ua in agents.items():
            for vname,url in variants:
              try:
                r=requests.get(url,headers={'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.bing.com/'},timeout=50,allow_redirects=True)
                r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                html=r.text; soup=BeautifulSoup(html,'lxml'); text=soup.get_text('\n',strip=True)
                score=sum(text.count(k) for k in ['资负共振','锚定科创','拐点已现','风险提示','净资产收益率','战略性新兴产业'])
                longattrs=[]
                for tag in soup.find_all(True):
                  for key,val in tag.attrs.items():
                    if isinstance(val,list): val=' '.join(map(str,val))
                    val=str(val)
                    if len(val)>1000: longattrs.append((tag.name,key,len(val),val[:100]))
                item={'agent':aname,'variant':vname,'url':r.url,'status':r.status_code,'html_len':len(html),'text_len':len(text),'score':score,'risk_count':text.count('风险提示'),'strategic_count':text.count('战略性新兴产业'),'roe_count':text.count('净资产收益率'),'longattrs':longattrs[:20],'text_end':text[-3000:]}
                result.append(item)
                fn=f'{aname}_{vname}.html'; (OUT/fn).write_text(html,encoding='utf-8')
                print('VARIANT',json.dumps(item,ensure_ascii=False),flush=True)
              except Exception as exc:
                item={'agent':aname,'variant':vname,'error':repr(exc)}; result.append(item); print('ERROR',json.dumps(item,ensure_ascii=False),flush=True)
          result.sort(key=lambda x:(x.get('text_len',0),x.get('score',0)),reverse=True)
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('BEST',json.dumps(result[:10],ensure_ascii=False),flush=True)
          PY
      - name: Upload crawler variants
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-bot-cache-probe
          path: out/
          retention-days: 3
          if-no-files-found: error