name: Inspect 9fzt Super Hi report source pages 20260927

on:
  push:
    paths:
      - '.github/workflows/super-hi-9fzt-source-inspect-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect report pages and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, json, html
          from urllib.parse import urljoin
          import requests

          pages = [
              'https://gmg.9fzt.com/report/HKSE/09658/784910903365.html',
              'https://gmg.9fzt.com/report/HKSE/09658/781968505611.html',
          ]
          s = requests.Session(); s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for u in pages:
              print('\n===PAGE===', u, flush=True)
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),flush=True)
              r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'; t=r.text
              print('TITLE', re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)[:3],flush=True)
              patterns = [
                  r'https?://[^"\'<> ]+\.pdf[^"\'<> ]*',
                  r'https?://[^"\'<> ]+',
                  r'(?:href|src|data-url|data-file|data-pdf|data-download|value)=["\']([^"\']+)["\']',
                  r'["\']([^"\']*(?:pdf|download|attach|file|report)[^"\']*)["\']',
              ]
              for pat in patterns:
                  vals=[]
                  for x in re.findall(pat,t,re.I|re.S):
                      v=x if isinstance(x,str) else x[0]
                      if v not in vals: vals.append(v)
                  print('PATTERN',pat,'COUNT',len(vals),flush=True)
                  for v in vals[:300]:
                      if any(k in v.lower() for k in ['pdf','download','attach','file','report','784910903365','781968505611']):
                          print('VAL',v[:1600].replace('\n',' '),flush=True)
              for kw in ['784910903365','781968505611','pdf','download','fileurl','filepath','attach','reportid','report_id','docid','url']:
                  print('\nKW',kw,flush=True)
                  for m in list(re.finditer(kw,t,re.I))[:40]:
                      print(t[max(0,m.start()-500):min(len(t),m.end()+1000)].replace('\n',' ')[:2000],flush=True)
              scripts=[]
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):
                  su=urljoin(r.url,src)
                  if su not in scripts: scripts.append(su)
              print('SCRIPTS',json.dumps(scripts,ensure_ascii=False),flush=True)
              for su in scripts[:30]:
                  try:
                      rr=s.get(su,timeout=(15,60)); print('SCRIPT',su,rr.status_code,len(rr.content),flush=True)
                      if rr.status_code != 200 or len(rr.content)>5000000: continue
                      rr.encoding=rr.apparent_encoding or 'utf-8'; st=rr.text
                      if any(k in st.lower() for k in ['download','fileurl','pdf','reportid','attach']):
                          for kw in ['download','fileurl','pdf','reportid','attach']:
                              for m in list(re.finditer(kw,st,re.I))[:25]:
                                  print('SCRIPT_SNIP',kw,st[max(0,m.start()-400):min(len(st),m.end()+800)].replace('\n',' ')[:1500],flush=True)
                  except Exception as e: print('SCRIPT_ERR',su,repr(e),flush=True)
          PY
