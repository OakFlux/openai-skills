name: Temporary Discover Zhongcao Historical Reports

on:
  push:
    branches:
      - tmp/fetch-zhongcao-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover historical annual reports under old NEEQ code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          from urllib.parse import unquote
          import requests

          stock = '870800'
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 Chrome/151.0 Safari/537.36'})

          def decode(response):
              raw = response.content
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      continue
              return raw.decode('utf-8', errors='ignore')

          urls = [
              f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{stock}/page_type/ndbg.phtml',
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{stock}/page_type/ndbg.phtml',
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{stock}.phtml?ftype=ndbg',
          ]
          ids = []
          for page in urls:
              response = session.get(page, timeout=60)
              response.raise_for_status()
              text = html.unescape(decode(response)).replace('\\/', '/')
              print('PAGE', page, 'BYTES', len(response.content))
              for match in re.finditer(r'<a\b[^>]*href=[\"\']([^\"\']+)[\"\'][^>]*>(.*?)</a>', text, flags=re.I | re.S):
                  href = match.group(1)
                  visible = re.sub(r'<[^>]+>', ' ', match.group(2))
                  visible = re.sub(r'\s+', ' ', html.unescape(visible)).strip()
                  if '年度报告' not in visible:
                      continue
                  id_match = re.search(r'(?:[?&]|%3F|%26)id(?:=|%3D)(\d+)', href, flags=re.I)
                  if not id_match:
                      id_match = re.search(r'id/(\d+)', href, flags=re.I)
                  bulletin_id = id_match.group(1) if id_match else None
                  print('ANCHOR', visible, href, bulletin_id)
                  if bulletin_id and bulletin_id != stock and bulletin_id not in ids:
                      ids.append(bulletin_id)

          for bulletin_id in ids:
              detail = f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid={stock}'
              response = session.get(detail, timeout=60)
              response.raise_for_status()
              text = html.unescape(decode(response)).replace('\\/', '/')
              visible = re.sub(r'<[^>]+>', ' ', text)
              visible = re.sub(r'\s+', ' ', visible).strip()
              pdfs = []
              for url in re.findall(r'https?://[^\s\"\'<>]+?\.PDF', text, flags=re.I):
                  url = unquote(url)
                  if url not in pdfs:
                      pdfs.append(url)
              print('DETAIL', bulletin_id, 'VISIBLE_HEAD', visible[:300], 'PDFS', pdfs)
          PY
