name: Temporary Xihua official filing discovery

on:
  push:
    branches: [tmp-xihua-official-filings-20260830]
    paths: [.github/workflows/tmp-xihua-official-discovery.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query official SSE and CNINFO disclosure endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time, urllib.parse
          import requests

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=603248',
            'Accept':'application/json,text/javascript,*/*;q=0.9'
          })
          base='https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          combos=[
            {'reportType2':'ALL','reportType':'ALL','securityType':'0101,120100,020100,020200,120200'},
            {'reportType2':'DQBG','reportType':'ALL','securityType':'0101,120100,020100,020200,120200'},
            {'reportType2':'ALL','reportType':'ALL','securityType':'0101'},
          ]
          all_rows=[]
          for idx,c in enumerate(combos,1):
            params={
              'isPagination':'true','productId':'603248','keyWord':'','beginDate':'2025-01-01','endDate':'2026-08-30',
              'pageHelp.pageSize':'200','pageHelp.pageCount':'200','pageHelp.pageNo':'1','pageHelp.beginPage':'1','pageHelp.endPage':'1',
              '_':str(int(time.time()*1000)), **c
            }
            r=s.get(base,params=params,timeout=90)
            print('\nSSE_CALL',idx,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
            print('SSE_HEAD',repr(r.text[:300]))
            try: obj=r.json()
            except Exception as e:
              print('SSE_JSON_ERR',repr(e)); continue
            rows=(obj.get('pageHelp') or {}).get('data') or obj.get('result') or obj.get('data') or []
            print('SSE_ROWS',len(rows),'KEYS',list(obj.keys()))
            for row in rows:
              title=str(row.get('TITLE') or row.get('title') or row.get('BULLETIN_TYPE') or '')
              url=row.get('URL') or row.get('url') or row.get('PDF_URL') or row.get('pdfUrl')
              rec={k:row.get(k) for k in row.keys()}
              if any(k in title for k in ['年度报告','第一季度报告','半年度报告','招股说明书','招股意向书']) or '招股' in title:
                print('SSE_MATCH',json.dumps(rec,ensure_ascii=False))
              all_rows.append(rec)

          # CNINFO announcements query, both full-text keyword and generic stock query.
          cn=requests.Session(); cn.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://www.cninfo.com.cn/new/disclosure/stock?stockCode=603248&orgId=',
            'Origin':'https://www.cninfo.com.cn','Accept':'application/json,text/plain,*/*',
            'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'
          })
          for key in ['', '年度报告', '第一季度报告', '半年度报告', '招股说明书', '招股意向书']:
            data={
              'pageNum':'1','pageSize':'100','column':'sse','tabName':'fulltext','plate':'sh','stock':'603248',
              'searchkey':key,'secid':'','category':'','trade':'','seDate':'2025-01-01~2026-08-30','sortName':'','sortType':'','isHLtitle':'true'
            }
            r=cn.post('https://www.cninfo.com.cn/new/hisAnnouncement/query',data=data,timeout=90)
            print('\nCN_CALL',key or '<blank>',r.status_code,len(r.content),r.headers.get('content-type'))
            print('CN_HEAD',repr(r.text[:300]))
            try: obj=r.json()
            except Exception as e:
              print('CN_JSON_ERR',repr(e)); continue
            anns=obj.get('announcements') or []
            print('CN_ROWS',len(anns),'TOTAL',obj.get('totalAnnouncement'))
            for a in anns:
              title=re.sub('<[^>]+>','',str(a.get('announcementTitle') or ''))
              if any(k in title for k in ['年度报告','第一季度报告','半年度报告','招股说明书','招股意向书']) or '招股' in title:
                print('CN_MATCH',json.dumps({k:a.get(k) for k in a.keys()},ensure_ascii=False))

          # Inspect China Daily mirror pages for embedded SSE source URLs.
          for u in [
            'https://caijing.chinadaily.com.cn/a/202512/18/WS6943759da310942cc49973f7.html',
            'https://caijing.chinadaily.com.cn/a/202604/23/WS69e980b2a310942cc49a8f7c.html'
          ]:
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
            print('\nMIRROR',u,r.status_code,len(r.content),r.url)
            for pat in [r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',r'https?://[^\s"\'<>]+(?:sse|cninfo)[^\s"\'<>]+']:
              for m in sorted(set(re.findall(pat,r.text,re.I))): print('MIRROR_LINK',m[:2000])
          PY
