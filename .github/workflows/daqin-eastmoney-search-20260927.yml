name: Search Eastmoney Daqin Railway announcements 20260927
on:
  push:
    paths:
      - '.github/workflows/daqin-eastmoney-search-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query announcements and probe PDF patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,re,time
          from pathlib import Path
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/notices/stock/601006.html'})
          api='https://np-anotice-stock.eastmoney.com/api/security/ann'
          params={'sr':'-1','page_size':'200','page_index':'1','ann_type':'A','client_source':'web','stock_list':'601006','f_node':'0','s_node':'0'}
          out={}
          try:
            r=s.get(api,params=params,timeout=(20,90));out['api']={'status':r.status_code,'url':r.url,'text':r.text}
            data=r.json()
            rows=((data.get('data') or {}).get('list') or [])
            selected=[]
            wanted=['2025年年度报告','2024年年度报告','2023年年度报告','2022年年度报告','2021年年度报告','2020年年度报告','2026年第一季度报告','2026年半年度报告']
            for row in rows:
              title=row.get('title','')
              if any(w in title for w in wanted) and '摘要' not in title:
                selected.append(row)
            out['selected']=selected
            probes=[]
            for row in selected:
              art=row.get('art_code') or row.get('artCode')
              title=row.get('title')
              urls=[
                f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf?{int(time.time()*1000)}.pdf',
                f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                f'https://notice.10jqka.com.cn/api/pdf/{art}.pdf',
              ]
              for u in urls:
                try:
                  rr=s.get(u,timeout=(15,60),allow_redirects=True)
                  rec={'title':title,'art_code':art,'url':u,'status':rr.status_code,'final':rr.url,'type':rr.headers.get('content-type'),'bytes':len(rr.content),'head':rr.content[:20].hex()}
                  probes.append(rec)
                  if rr.status_code==200 and rr.content[:5]==b'%PDF-':
                    Path('out',f'{art}.pdf').write_bytes(rr.content)
                    break
                except Exception as e:
                  probes.append({'title':title,'art_code':art,'url':u,'error':repr(e)})
            out['probes']=probes
          except Exception as e:out['error']=repr(e)
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:300000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daqin-eastmoney-search
          path: out
          retention-days: 7
          if-no-files-found: error
