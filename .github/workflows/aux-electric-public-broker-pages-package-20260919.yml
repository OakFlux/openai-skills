name: Build AUX Electric public broker research package 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-public-broker-pages-package-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install browser and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Render public broker research pages and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import asyncio
          import hashlib
          import json
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          from playwright.async_api import async_playwright
          from pypdf import PdfReader

          PACKAGE = '奥克斯电气_02580_券商深度报告_2份_公开网页保存版'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)
          work = Path('_render_work')
          work.mkdir(exist_ok=True)

          candidates = [
              {
                  'priority': 1,
                  'broker': '财通证券',
                  'title': '奥克斯电气（02580）：网批重构渠道效率，掘金新兴市场空调红利',
                  'date': '2026-05-29',
                  'published_page_date': '2026-06-01',
                  'url': 'https://finance.sina.com.cn/wm/2026-06-01/doc-inhzwckz2640125.shtml',
                  'preferred_selectors': ['#artibody', '.article-content', 'article'],
                  'minimum_text_chars': 7000,
                  'filename': '01_财通证券_奥克斯电气_网批重构渠道效率掘金新兴市场空调红利_公开网页保存版.pdf',
              },
              {
                  'priority': 2,
                  'broker': '华泰证券',
                  'title': '奥克斯电气：供应链效率领先，中国制造出海典范',
                  'date': '2025-10-15',
                  'published_page_date': '2025-10-15',
                  'url': 'https://www.vzkoo.com/read/20251015fa4cb1477b01027a9be317a5.html',
                  'preferred_selectors': ['article', 'main', '.article-content', '.read-content', '.detail-content', '.content'],
                  'minimum_text_chars': 5000,
                  'filename': '02_华泰证券_奥克斯电气_供应链效率领先中国制造出海典范_公开网页保存版.pdf',
              },
              {
                  'priority': 3,
                  'broker': '华西证券',
                  'title': '奥克斯电气（02580）：加码AI空调，推进全球化布局',
                  'date': '2026-06-04',
                  'published_page_date': '2026-06-08',
                  'url': 'https://finance.sina.com.cn/wm/2026-06-08/doc-iniarzfu8894112.shtml',
                  'preferred_selectors': ['#artibody', '.article-content', 'article'],
                  'minimum_text_chars': 850,
                  'filename': '03_华西证券_奥克斯电气_加码AI空调推进全球化布局_公开网页保存版.pdf',
              },
              {
                  'priority': 4,
                  'broker': '国盛证券',
                  'title': '奥克斯电气：内外兼修，渠道运作高效',
                  'date': '2026-04-16',
                  'published_page_date': '2026-04-16',
                  'url': 'https://www.fxbaogao.com/detail/5357558',
                  'preferred_selectors': ['article', 'main', '.article-content', '.content', 'body'],
                  'minimum_text_chars': 500,
                  'filename': '04_国盛证券_奥克斯电气_内外兼修渠道运作高效_公开摘要页保存版.pdf',
              },
          ]

          CLEAN_SCRIPT = r'''
          ({preferredSelectors}) => {
            const makeAbsolute = (raw) => {
              if (!raw) return '';
              try { return new URL(raw, location.href).href; } catch (e) { return raw; }
            };
            document.querySelectorAll('img').forEach((img) => {
              const lazy = img.getAttribute('data-src') || img.getAttribute('data-original') ||
                           img.getAttribute('data-actualsrc') || img.getAttribute('data-lazy-src') ||
                           img.currentSrc || img.getAttribute('src');
              if (lazy) img.setAttribute('src', makeAbsolute(lazy));
              img.removeAttribute('srcset');
              img.removeAttribute('data-srcset');
              img.setAttribute('loading', 'eager');
            });
            document.querySelectorAll('a').forEach((a) => {
              const href = a.getAttribute('href');
              if (href) a.setAttribute('href', makeAbsolute(href));
            });
            document.querySelectorAll('script,style,noscript,iframe,form,button,video,audio,canvas').forEach((el) => el.remove());
            document.querySelectorAll('[class*="advert" i],[class*="ad-" i],[id*="advert" i],[id*="ad_" i],.share,.toolbar,.comment,.comments,.recommend,.related,.footer,.header,.nav,.sidebar').forEach((el) => el.remove());

            const selectors = [...preferredSelectors, 'article', 'main', '#artibody', '.article-content', '.read-content', '.detail-content', '.content', '.main-content', '.news-content'];
            const seen = new Set();
            const nodes = [];
            for (const sel of selectors) {
              try {
                for (const node of document.querySelectorAll(sel)) {
                  if (!seen.has(node)) { seen.add(node); nodes.push(node); }
                }
              } catch (e) {}
            }
            if (!seen.has(document.body)) nodes.push(document.body);

            let chosen = document.body;
            let bestScore = -1;
            for (const node of nodes) {
              const text = (node.innerText || '').replace(/\s+/g, ' ').trim();
              const links = node.querySelectorAll ? node.querySelectorAll('a').length : 0;
              const paras = node.querySelectorAll ? node.querySelectorAll('p').length : 0;
              const imgs = node.querySelectorAll ? node.querySelectorAll('img').length : 0;
              const score = text.length + paras * 35 + imgs * 20 - links * 3;
              if (score > bestScore) { bestScore = score; chosen = node; }
            }

            const cloned = chosen.cloneNode(true);
            cloned.querySelectorAll('script,style,noscript,iframe,form,button,video,audio,canvas').forEach((el) => el.remove());
            cloned.querySelectorAll('[class*="advert" i],[class*="ad-" i],[id*="advert" i],[id*="ad_" i],.share,.toolbar,.comment,.comments,.recommend,.related,.footer,.header,.nav,.sidebar').forEach((el) => el.remove());
            cloned.querySelectorAll('*').forEach((el) => {
              for (const attr of [...el.attributes]) {
                if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
              }
            });
            const text = (cloned.innerText || '').replace(/\s+/g, ' ').trim();
            return {
              html: cloned.innerHTML,
              textLength: text.length,
              pageTitle: document.title,
              selectedTag: chosen.tagName,
              selectedId: chosen.id || '',
              selectedClass: chosen.className || '',
              sourceUrl: location.href,
            };
          }
          '''

          async def render_candidate(browser, item):
              context = await browser.new_context(
                  viewport={'width': 1440, 'height': 1100},
                  locale='zh-CN',
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                  java_script_enabled=True,
                  ignore_https_errors=True,
              )
              page = await context.new_page()
              try:
                  response = await page.goto(item['url'], wait_until='domcontentloaded', timeout=120_000)
                  status = response.status if response else None
                  await page.wait_for_timeout(7000)
                  for _ in range(8):
                      await page.mouse.wheel(0, 1800)
                      await page.wait_for_timeout(500)
                  await page.evaluate('window.scrollTo(0,0)')
                  await page.wait_for_timeout(1200)
                  extracted = await page.evaluate(CLEAN_SCRIPT, {'preferredSelectors': item['preferred_selectors']})
                  print('EXTRACT', item['broker'], 'status', status, json.dumps({k:v for k,v in extracted.items() if k!='html'}, ensure_ascii=False), flush=True)
                  if extracted['textLength'] < item['minimum_text_chars']:
                      raise RuntimeError(f"Insufficient public article text for {item['broker']}: {extracted['textLength']} < {item['minimum_text_chars']}")

                  article_html = extracted['html']
                  source_url = extracted['sourceUrl']
                  safe_title = item['title'].replace('&','&amp;').replace('<','&lt;').replace('>','&gt;')
                  clean_doc = f'''<!doctype html>
                  <html lang="zh-CN"><head><meta charset="utf-8"><base href="{source_url}">
                  <style>
                    @page {{ size: A4; margin: 18mm 16mm 18mm 16mm; }}
                    * {{ box-sizing: border-box; }}
                    body {{ margin: 0 auto; max-width: 178mm; color: #111; background: #fff; font-family: "Noto Sans CJK SC", "Noto Serif CJK SC", "Microsoft YaHei", sans-serif; font-size: 10.6pt; line-height: 1.68; }}
                    .cover {{ border-bottom: 1px solid #999; padding: 8mm 0 6mm; margin-bottom: 7mm; }}
                    h1 {{ font-size: 20pt; line-height: 1.35; margin: 0 0 5mm; font-weight: 700; }}
                    .meta {{ color: #555; font-size: 9.5pt; line-height: 1.6; }}
                    h2 {{ font-size: 15pt; margin: 7mm 0 3mm; page-break-after: avoid; }}
                    h3 {{ font-size: 12.5pt; margin: 5mm 0 2mm; page-break-after: avoid; }}
                    p {{ margin: 0 0 3.2mm; text-align: justify; orphans: 2; widows: 2; }}
                    img {{ display: block; max-width: 100% !important; height: auto !important; margin: 4mm auto; page-break-inside: avoid; }}
                    table {{ width: 100% !important; border-collapse: collapse; margin: 4mm 0; font-size: 9pt; page-break-inside: avoid; }}
                    th, td {{ border: 0.3pt solid #999; padding: 1.5mm; vertical-align: top; }}
                    blockquote {{ margin: 3mm 0; padding: 2mm 4mm; border-left: 2pt solid #888; background: #f7f7f7; }}
                    a {{ color: inherit; text-decoration: none; }}
                    ul, ol {{ padding-left: 7mm; }}
                    .source-note {{ margin-top: 9mm; padding-top: 4mm; border-top: 0.5pt solid #bbb; color: #666; font-size: 8.5pt; }}
                  </style></head><body>
                    <div class="cover">
                      <h1>{safe_title}</h1>
                      <div class="meta">出品机构：{item['broker']}<br>报告日期：{item['date']}<br>公开页面发布日期：{item['published_page_date']}<br>保存说明：由公开网页按浏览器打印方式保存，非证券公司原始矢量PDF。</div>
                    </div>
                    <main>{article_html}</main>
                    <div class="source-note">公开来源：{source_url}<br>保存日期：2026-09-19。版权归原作者及发布机构所有，仅供个人研究与资料查阅。</div>
                  </body></html>'''

                  await page.set_content(clean_doc, wait_until='domcontentloaded', timeout=120_000)
                  await page.wait_for_timeout(3000)
                  await page.evaluate('''async () => {
                    const imgs=[...document.images];
                    await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res => {img.onload=res; img.onerror=res; setTimeout(res,12000);}))); 
                  }''')
                  pdf_path = out / item['filename']
                  await page.pdf(
                      path=str(pdf_path),
                      format='A4',
                      print_background=True,
                      prefer_css_page_size=True,
                      display_header_footer=True,
                      header_template='<div style="font-size:7px;width:100%;text-align:center;color:#777;"></div>',
                      footer_template='<div style="font-size:8px;width:100%;text-align:center;color:#666;"><span class="pageNumber"></span> / <span class="totalPages"></span></div>',
                      margin={'top':'18mm','right':'16mm','bottom':'20mm','left':'16mm'},
                  )
                  return {
                      **item,
                      'http_status': status,
                      'extracted_text_chars': extracted['textLength'],
                      'selected_element': f"{extracted['selectedTag']}#{extracted['selectedId']}.{extracted['selectedClass']}",
                      'pdf_path': str(pdf_path),
                      'source_url_final': source_url,
                  }
              finally:
                  await context.close()

          async def main():
              rendered=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True, args=['--disable-dev-shm-usage'])
                  for item in candidates:
                      try:
                          rec=await render_candidate(browser,item)
                          rendered.append(rec)
                          print('RENDERED', item['broker'], item['filename'], flush=True)
                      except Exception as exc:
                          print('SKIP', item['broker'], repr(exc), flush=True)
                      if len(rendered) >= 2:
                          break
                  await browser.close()
              if len(rendered) < 2:
                  raise RuntimeError(f'Only {len(rendered)} public broker research pages could be rendered')
              return rendered

          rendered = asyncio.run(main())

          records=[]
          for item in rendered:
              pdf_path=Path(item['pdf_path'])
              reader=PdfReader(str(pdf_path),strict=False)
              pages=len(reader.pages)
              if pages < 2:
                  raise RuntimeError(f'PDF too short: {pdf_path} has {pages} page(s)')
              check=subprocess.run(['qpdf','--check',str(pdf_path)],capture_output=True,text=True)
              if check.returncode not in (0,3):
                  raise RuntimeError(f'qpdf failed for {pdf_path}: {check.stderr[-2000:]}')
              preview=work/f"cover_{item['priority']}"
              render=subprocess.run(['pdftoppm','-f','1','-singlefile','-r','100','-png',str(pdf_path),str(preview)],capture_output=True,text=True)
              if render.returncode != 0 or not preview.with_suffix('.png').exists():
                  raise RuntimeError(f'Cover render failed for {pdf_path}: {render.stderr[-1000:]}')
              data=pdf_path.read_bytes()
              records.append({
                  'broker':item['broker'],
                  'title':item['title'],
                  'report_date':item['date'],
                  'public_page_date':item['published_page_date'],
                  'filename':pdf_path.name,
                  'source_url':item['source_url_final'],
                  'pages':pages,
                  'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'extracted_text_chars':item['extracted_text_chars'],
                  'format_note':'公开网页浏览器打印保存版，非证券公司原始矢量PDF。',
              })

          readme=[
              '奥克斯电气股份有限公司（02580.HK）券商研究资料',
              '整理日期：2026-09-19',
              '',
              '本包收录2份公开可访问的券商深度研究页面，并按浏览器打印方式保存为PDF。',
              '由于可检索到的证券公司原始PDF下载路径需要登录、会员或付费，本包未绕过任何访问控制。',
              '因此文件属于“公开网页保存版”，不是证券公司官网下载的原始矢量PDF。',
              '',
              '文件清单：',
          ]
          for i,r in enumerate(records,1):
              readme.extend([
                  f"{i}. {r['broker']}：《{r['title']}》",
                  f"   报告日期：{r['report_date']}；PDF页数：{r['pages']}；文件：{r['filename']}",
                  f"   公开来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ])
          readme.extend([
              '完整性检查：PDF实际页数、qpdf结构检查、首页渲染、ZIP CRC和SHA-256。',
              '使用说明：文件仅供个人研究与资料查阅，版权归原作者及发布机构所有。',
          ])
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path,arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad=zf.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=2: raise RuntimeError(f'Expected 2 PDFs, got {len(pdfs)}')
          print('FINAL_RECORDS',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: aux-electric-02580-public-broker-research-final
          path: 奥克斯电气_02580_券商深度报告_2份_公开网页保存版.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
