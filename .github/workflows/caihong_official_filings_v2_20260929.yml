name: Caihong Official Filings V2

on:
  push:
    branches:
      - chatgpt-caihong-reports-20260929
    paths:
      - .github/workflows/caihong_official_filings_v2_20260929.yml
      - scripts/build_caihong_official_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pillow

      - name: Build package
        run: python scripts/build_caihong_official_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: caihong-official-filings-package-v2
          path: |
            output/caihong_gufen_2020_2025_annual_reports_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
