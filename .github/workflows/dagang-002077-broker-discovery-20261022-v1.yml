name: Discover Dagang 002077 broker reports 20261022

on:
  push:
    branches:
      - tmp/dagang-002077-broker-discovery-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query public broker-report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          import time
          from urllib.parse import quote_plus

          import requests
          from bs4 import BeautifulSoup

          CODE = "002077"
          COMPANY = "大港股份"
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer": "https://data.eastmoney.com/report/",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          api = "https://reportapi.eastmoney.com/report/list"
          records = []
          for qtype in ["0", "1", "2"]:
              for page in range(1, 30):
                  params = {
                      "industryCode": "*",
                      "pageSize": "100",
                      "industry": "*",
                      "rating": "*",
                      "ratingChange": "*",
                      "beginTime": "2000-01-01",
                      "endTime": "2030-12-31",
                      "pageNo": str(page),
                      "fields": "",
                      "qType": qtype,
                      "orgCode": "",
                      "code": CODE,
                      "rcode": "",
                      "p": str(page),
                      "pageNum": str(page),
                      "pageNumber": str(page),
                  }
                  r = s.get(api, params=params, timeout=(20, 120))
                  print("API", qtype, page, r.status_code, len(r.content), r.url)
                  r.raise_for_status()
                  data = r.json()
                  batch = data.get("data") or []
                  if isinstance(batch, dict):
                      batch = batch.get("list") or batch.get("data") or []
                  print("HITS", data.get("hits"), "COUNT", len(batch) if isinstance(batch, list) else "bad")
                  if not isinstance(batch, list) or not batch:
                      break
                  records.extend(batch)
                  if len(batch) < 100:
                      break
                  time.sleep(0.1)

          seen = set()
          normalized = []
          for row in records:
              info = str(row.get("infoCode") or row.get("info_code") or "")
              if not info or info in seen:
                  continue
              seen.add(info)
              normalized.append({
                  "infoCode": info,
                  "title": row.get("title"),
                  "orgSName": row.get("orgSName"),
                  "orgName": row.get("orgName"),
                  "publishDate": row.get("publishDate"),
                  "attachPages": row.get("attachPages"),
                  "stockCode": row.get("stockCode"),
                  "stockName": row.get("stockName"),
                  "researcher": row.get("researcher"),
                  "emRatingName": row.get("emRatingName"),
                  "ratingChange": row.get("ratingChange"),
                  "indvInduName": row.get("indvInduName"),
                  "predictThisYearEps": row.get("predictThisYearEps"),
                  "predictNextYearEps": row.get("predictNextYearEps"),
              })

          print("EASTMONEY_RESULT_COUNT", len(normalized))
          print(json.dumps(normalized, ensure_ascii=False, indent=2, default=str))

          # Inspect Sina's historical company-research search pages as a fallback.
          search_urls = [
              f"https://search.sina.com.cn/?q={quote_plus(COMPANY + ' 研报')}&c=finance&from=channel",
              f"https://search.sina.com.cn/?q={quote_plus(COMPANY + ' 公司研究')}&c=finance&from=channel",
          ]
          for url in search_urls:
              print("\nSEARCH", url)
              try:
                  r = s.get(url, timeout=(20, 120), allow_redirects=True)
                  print("STATUS", r.status_code, "BYTES", len(r.content), "FINAL", r.url)
                  enc = r.apparent_encoding or r.encoding or "utf-8"
                  text = r.content.decode(enc, errors="replace")
                  soup = BeautifulSoup(text, "lxml")
                  links = []
                  for a in soup.find_all("a", href=True):
                      label = re.sub(r"\s+", " ", a.get_text(" ", strip=True))
                      href = a["href"]
                      if COMPANY in label or CODE in label or COMPANY in href:
                          links.append({"label": label[:200], "href": href})
                  print("LINKS", json.dumps(links[:100], ensure_ascii=False, indent=2))
              except Exception as exc:
                  print("SEARCH_ERROR", repr(exc))
          PY
