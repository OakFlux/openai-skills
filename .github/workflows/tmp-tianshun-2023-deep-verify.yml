name: Temporary Verify Tianshun 2023 Deep Report Originals

on:
  push:
    branches:
      - tmp/tianshun-wind-reports-20260830
    paths:
      - .github/workflows/tmp-tianshun-2023-deep-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and inspect resolved PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io,json,re,requests
          from pathlib import Path
          from pypdf import PdfReader
          codes=['AP202302091582944023','AP202303031584005955','AP202212041580799553','AP201809131194586376','AP201807121165809973']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/stockcalendar/002531.html'})
          Path('out/pdfs').mkdir(parents=True,exist_ok=True)
          results=[]
          for code in codes:
            url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'
            item={'code':code,'url':url}
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              item.update({'status':r.status_code,'final':r.url,'bytes':len(r.content),'head':r.content[:8].hex(),'type':r.headers.get('content-type')})
              if r.status_code==200 and r.content[:4]==b'%PDF':
                path=Path('out/pdfs')/(code+'.pdf');path.write_bytes(r.content)
                reader=PdfReader(io.BytesIO(r.content),strict=False)
                item['pages']=len(reader.pages);item['ok']=True
                texts=[]
                for i in range(min(3,len(reader.pages))):
                  try:texts.append(' '.join((reader.pages[i].extract_text() or '').split()))
                  except Exception:texts.append('')
                item['text']='\n'.join(texts)[:12000]
                item['title_meta']=str((reader.metadata or {}).get('/Title') or '')
                item['author_meta']=str((reader.metadata or {}).get('/Author') or '')
              else:item['ok']=False
            except Exception as e:item.update({'ok':False,'error':repr(e)})
            results.append(item);print('VERIFY='+json.dumps(item,ensure_ascii=False),flush=True)
          Path('out/verification.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianshun-2023-deep-verification
          path: out
          retention-days: 3
