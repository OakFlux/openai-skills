name: Wens PDF Download Probe

on:
  push:
    branches:
      - chatgpt-wens-filings-20260927
    paths:
      - .github/workflows/wens_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official PDF sizes
        shell: bash
        run: |
          set -euxo pipefail
          urls=(
            'https://www.wens.com.cn/uploadfiles/2021/04/20210422181223818.pdf'
            'https://www.wens.com.cn/uploadfiles/2022/04/20220416103035134.pdf'
            'https://www.wens.com.cn/uploadfiles/2023/04/20230426103745999.pdf'
            'https://www.wens.com.cn/uploadfiles/2024/04/20240429155306097.pdf'
            'https://www.wens.com.cn/uploadfiles/2025/04/20250424085426118.pdf'
            'https://www.wens.com.cn/uploadfiles/2026/04/20260422104344852.pdf'
            'https://www.wens.com.cn/uploadfiles/2026/04/20260422104359416.pdf'
          )
          for url in "${urls[@]}"; do
            echo "URL=$url"
            curl -L -sS --connect-timeout 15 --max-time 45 -A 'Mozilla/5.0' -e 'https://www.wens.com.cn/Investor/index.aspx' -o /dev/null -w 'HTTP=%{http_code} SIZE=%{size_download} SPEED=%{speed_download} TYPE=%{content_type} TIME=%{time_total}\n' "$url"
          done
