name: Wens PDF Download Probe

on:
  push:
    branches:
      - chatgpt-wens-filings-20260927
    paths:
      - .github/workflows/wens_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official PDFs
        shell: bash
        run: |
          set -euxo pipefail
          echo 'Testing official Wens PDF endpoint'
          curl -L --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' -e 'https://www.wens.com.cn/Investor/index.aspx' -o /tmp/q1.pdf -w '\nHTTP=%{http_code} SIZE=%{size_download} TYPE=%{content_type}\n' 'https://www.wens.com.cn/uploadfiles/2026/04/20260422104359416.pdf'
          head -c 16 /tmp/q1.pdf | xxd
          ls -lh /tmp/q1.pdf
