name: Probe static China Hongqiao report endpoints
on:
  push:
    branches:
      - tmp-chinahongqiao-static-endpoints-20260908
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch pages and scripts
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          targets={
            'wd_west':'https://www.sdyanbao.com/detail/886387',
            'wd_hc':'https://www.sdyanbao.com/detail/892745',
            'vz_hc_doc':'https://www.vzkoo.com/document/202505284d706ccf964f075580f58225.html?from=report',
            'vz_ky_doc':'https://www.vzkoo.com/document/20240613685119ace79295e90edc0069.html?from=report',
            'vz_hy_read':'https://www.vzkoo.com/read/4662679491238170624.html',
            'vz_dw_read':'https://www.vzkoo.com/read/1136811353590001f892134f7e1e.html',
            'vz_zs_read':'https://www.vzkoo.com/read/2024081907b24b74412495f5108f985a.html',
          }
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          s=requests.Session();s.headers.update(h)
          pat=re.compile(r'(https?://[^\"\'<>\s\\]+|/[A-Za-z0-9_./?=&%:+-]*(?:pdf|download|file|document|report|attach|oss|cdn|api)[A-Za-z0-9_./?=&%:+-]*)',re.I)
          keypat=re.compile(r'(\.pdf|download|fileurl|file_url|pdfurl|pdf_url|documenturl|document_url|reporturl|report_url|attachment|oss|cdn|api)',re.I)
          out={}
          script_urls=[]
          for name,url in targets.items():
            rec={'url':url}
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              text=r.text.replace('\\/','/')
              Path(f'output/{name}.html').write_text(text,encoding='utf-8')
              rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'history':[{'status':x.status_code,'url':x.url,'location':x.headers.get('location')} for x in r.history]})
              soup=BeautifulSoup(text,'lxml')
              scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]
              rec['scripts']=scripts
              for su in scripts:
                if urlparse(su).netloc.endswith(('sdyanbao.com','vzkoo.com','vzkoo.net')):
                  script_urls.append(su)
              found=[]
              for m in pat.finditer(text):
                val=m.group(0)
                if keypat.search(val): found.append(val)
              rec['tokens']=sorted(set(found))[:2000]
              snippets=[]
              for m in keypat.finditer(text):
                snippets.append(' '.join(text[max(0,m.start()-400):m.start()+1600].split())[:2500])
              rec['snippets']=snippets[:200]
              # Useful data attributes and forms.
              elems=[]
              for tag in soup.find_all(True):
                attrs={k:v for k,v in tag.attrs.items() if k in {'href','src','action','onclick','id','name','class','value','download'} or k.startswith('data-') or 'url' in k.lower() or 'file' in k.lower()}
                item={'tag':tag.name,'text':' '.join(tag.get_text(' ',strip=True).split())[:500],'attrs':attrs}
                if keypat.search(json.dumps(item,ensure_ascii=False)) or '下载' in item['text'] or '立即下载' in item['text']:
                  elems.append(item)
              rec['elements']=elems[:1000]
              print('PAGE',name,json.dumps(rec,ensure_ascii=False)[:50000],flush=True)
            except Exception as e:
              rec['error']=repr(e);print('PAGE_ERROR',name,repr(e),flush=True)
            out[name]=rec

          scripts_out={}
          for i,su in enumerate(sorted(set(script_urls))[:80]):
            rec={'url':su}
            try:
              r=s.get(su,timeout=30,allow_redirects=True)
              text=r.text.replace('\\/','/')
              rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)})
              Path(f'output/script_{i:03d}.js').write_text(text,encoding='utf-8')
              snippets=[]
              for m in keypat.finditer(text):
                snippets.append(' '.join(text[max(0,m.start()-500):m.start()+1800].split())[:3000])
              rec['snippets']=snippets[:100]
              found=[]
              for m in pat.finditer(text):
                val=m.group(0)
                if keypat.search(val): found.append(val)
              rec['tokens']=sorted(set(found))[:1000]
              if snippets or found:
                print('SCRIPT',i,json.dumps(rec,ensure_ascii=False)[:50000],flush=True)
            except Exception as e: rec['error']=repr(e)
            scripts_out[str(i)]=rec
          out['scripts']=scripts_out
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-static-endpoints
          path: output/*
          retention-days: 1
          if-no-files-found: error
