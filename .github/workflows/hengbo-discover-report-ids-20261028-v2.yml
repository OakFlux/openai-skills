name: Discover Hengbo 301225 recent report IDs 20261028 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengbo-discover-report-ids-20261028-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Search Eastmoney report API globally
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[('2025-11-20','2025-12-31'),('2026-03-20','2026-03-31'),('2026-06-01','2026-06-10')]
          seen=set()
          for begin,end in windows:
            for qtype in ['0','2']:
              print('\nWINDOW',begin,end,'QTYPE',qtype,flush=True)
              for page in range(1,80):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                        'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                        'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                data=None
                for attempt in range(6):
                  try:
                    r=s.get(api,params=params,timeout=(20,120))
                    if r.status_code==200:
                      data=r.json(); break
                  except Exception as exc:
                    print('ERR',begin,end,qtype,page,repr(exc),flush=True)
                  time.sleep(1+attempt)
                if data is None: raise RuntimeError((begin,end,qtype,page))
                rows=data.get('data') or []
                print('PAGE',page,'HITS',data.get('hits'),'ROWS',len(rows),flush=True)
                if not rows: break
                for x in rows:
                  fields=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode','orgSName','orgName','researcher'])
                  if '恒勃' in fields or str(x.get('stockCode') or '')=='301225':
                    code=str(x.get('infoCode') or '')
                    if code not in seen:
                      seen.add(code)
                      print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                if len(rows)<100: break
          print('TOTAL_MATCHES',len(seen),flush=True)
          PY
