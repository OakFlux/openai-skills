name: Download Nanfang Precision Financial Reports V2

on:
  push:
    branches:
      - chatgpt-nanfang-precision-reports-20261004
    paths:
      - .github/workflows/download_nanfang_precision_financial_reports_v2_20261004.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Download, verify and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports
          python - <<'PY'
          import hashlib
          import json
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          reports = [
              ("南方精工_2025年年度报告.pdf", "2026-04-15", "12089145", 2025, "年度报告"),
              ("南方精工_2024年年度报告.pdf", "2025-04-23", "10938540", 2024, "年度报告"),
              ("南方精工_2023年年度报告.pdf", "2024-04-19", "9999721", 2023, "年度报告"),
              ("南方精工_2022年年度报告.pdf", "2023-03-31", "8941488", 2022, "年度报告"),
              ("南方精工_2021年年度报告.pdf", "2022-04-12", "7977617", 2021, "年度报告"),
              ("南方精工_2020年年度报告.pdf", "2021-03-26", "6979449", 2020, "年度报告"),
              ("南方精工_2026年第一季度报告.pdf", "2026-04-30", "12277196", 2026, "第一季度报告"),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Referer": "https://money.finance.sina.com.cn/",
              "Accept": "application/pdf,*/*",
          })

          out_dir = Path("output/reports")
          manifest = []

          for filename, date, bulletin_id, report_year, report_type in reports:
              y, m, _ = date.split("-")
              url = f"https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/{y}/{y}-{int(m)}/{date}/{bulletin_id}.PDF"
              path = out_dir / filename
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=180, allow_redirects=True)
                      print("FETCH", filename, attempt + 1, r.status_code, len(r.content), r.url, r.headers.get("content-type"))
                      if r.ok and r.content.startswith(b"%PDF"):
                          path.write_bytes(r.content)
                          last = None
                          break
                      last = RuntimeError(f"HTTP {r.status_code}, head={r.content[:80]!r}")
                  except Exception as exc:
                      last = exc
                  time.sleep(2 * (attempt + 1))
              if last is not None or not path.exists():
                  raise RuntimeError(f"Download failed for {filename}: {last!r}")

              reader = PdfReader(str(path))
              pages = len(reader.pages)
              if pages < 2 or reader.is_encrypted:
                  raise RuntimeError(f"Invalid PDF {filename}: pages={pages}, encrypted={reader.is_encrypted}")
              try:
                  first_text = reader.pages[0].extract_text() or ""
              except Exception:
                  first_text = ""
              if str(report_year) not in first_text and report_type not in first_text and "季度报告" not in first_text:
                  print("WARN_FIRST_PAGE", filename, repr(first_text[:300]))

              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              rec = {
                  "filename": filename,
                  "report_year": report_year,
                  "report_type": report_type,
                  "announcement_date": date,
                  "sina_bulletin_id": bulletin_id,
                  "source_detail": f"https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid=002553",
                  "download_url": url,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": digest,
              }
              manifest.append(rec)
              print("VERIFIED", json.dumps(rec, ensure_ascii=False))

          readme = [
              "南方精工（002553）2020-2025年报及最新季报",
              "",
              "收录文件：2020、2021、2022、2023、2024、2025年年度报告，以及截至2026-10-04最新已披露的季度报告——2026年第一季度报告。",
              "2026年半年度报告属于半年度报告，不作为季度报告替代件收入本资料包。",
              "",
              "校验：所有PDF均通过文件头、页数、加密状态及首页文本抽查。",
              "",
              "文件清单：",
          ]
          for r in manifest:
              readme.append(f"- {r['filename']} | {r['pages']}页 | {r['bytes']}字节 | SHA-256 {r['sha256']}")
          (out_dir / "README.txt").write_text("\n".join(readme) + "\n", encoding="utf-8")
          (out_dir / "metadata.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          (out_dir / "SHA256SUMS.txt").write_text("\n".join(f"{r['sha256']}  {r['filename']}" for r in manifest) + "\n", encoding="utf-8")

          zip_path = Path("output/南方精工_2020-2025年报及2026年第一季度报告.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in sorted(out_dir.iterdir(), key=lambda p: p.name):
                  zf.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")
          print("ZIP", zip_path.name, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest())
          PY

      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-precision-financial-reports-v2
          path: output/南方精工_2020-2025年报及2026年第一季度报告.zip
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
