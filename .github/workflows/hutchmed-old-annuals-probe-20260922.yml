name: Probe HUTCHMED 2006-2011 annual reports 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-old-annuals-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Scrape official archive
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, requests, urllib3
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pathlib import Path

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          s=requests.Session(); s.trust_env=False; s.verify=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36'})
          targets={str(y):[] for y in range(2006,2012)}
          article_urls=set()
          for pg in range(14,22):
            u=f'https://www.hutch-med.com/shareholder-information/announcements/?pg={pg}'
            r=s.get(u,timeout=60,verify=False); r.raise_for_status()
            soup=BeautifulSoup(r.text,'lxml')
            for a in soup.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              key=(text+' '+href).lower()
              if 'annual report' in key or ('report and accounts' in key and any(str(y) in key for y in range(2006,2012))):
                article_urls.add(href)
                print('CANDIDATE',pg,repr(text),href)
          # known official article URLs surfaced by site search and archive; keep as fallback
          article_urls.update([
            'https://www.hutch-med.com/2011-annual-report-and-notice-of-annual-general-meeting-2/',
            'https://www.hutch-med.com/2010-annual-report-and-notice-of-annual-general-meeting-2/',
          ])
          results=[]
          for u in sorted(article_urls):
            try:
              r=s.get(u,timeout=60,verify=False); r.raise_for_status()
              soup=BeautifulSoup(r.text,'lxml')
              title=' '.join((soup.find('h1').get_text(' ',strip=True) if soup.find('h1') else soup.title.get_text(' ',strip=True)).split())
              pdfs=[]
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a['href'])
                if '.pdf' in href.lower():
                  pdfs.append({'text':' '.join(a.get_text(' ',strip=True).split()),'href':href})
              row={'article':r.url,'title':title,'pdfs':pdfs}
              results.append(row)
              print(json.dumps(row,ensure_ascii=False))
            except Exception as e:
              print('ERROR',u,repr(e))
          Path('old_annuals.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-old-annuals-probe
          path: old_annuals.json
          if-no-files-found: error
          retention-days: 7
