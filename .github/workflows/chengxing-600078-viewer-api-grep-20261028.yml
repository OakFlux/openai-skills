name: Trace Chengxing report viewer APIs

on:
  push:
    paths:
      - '.github/workflows/chengxing-600078-viewer-api-grep-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: |
          python - <<'PY'
          import re, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':'https://www.fxbaogao.com/view?id=1492879'})
          urls=[
            'https://www.fxbaogao.com/_fxbg/2610231746/js/app-pages-fxbg-main-js.7cf554b804bc5f3eb4d0.chunk.js',
            'https://www.hibor.com.cn/hiborweb/DocDetailNew/js?v=JhJG5MdT9wDoAQX8-xy-bc9qho_6DU5Ailv07PYCEEg1',
          ]
          keys=['reportId','report-id','pdfUrl','pdfurl','download','preview','pages/pdf-viewer','report.fxbaogao.com','api.fxbaogao.com','getReport','report/detail','report/view','fileUrl','oss','NewContent','ncid','docId','documentId']
          for url in urls:
            r=s.get(url,timeout=60); text=r.text
            print('\nURL',url,'STATUS',r.status_code,'LEN',len(text))
            for key in keys:
              pos=0; n=0
              while True:
                p=text.lower().find(key.lower(),pos)
                if p<0 or n>=30: break
                print('\nKEY',key,'AT',p)
                print(text[max(0,p-800):p+1600])
                pos=p+len(key); n+=1
            # Print URL-ish strings containing relevant terms.
            vals=[]
            for m in re.finditer(r'["\']([^"\']{1,400})["\']',text):
              v=m.group(1)
              if any(k in v.lower() for k in ('report','pdf','download','preview','document','detail','view','file','mofoun')) and v not in vals:
                vals.append(v)
            print('\nSTRINGS')
            for v in vals[:500]: print(repr(v))
          PY
