name: Package Qingdao Doublestar 000599 broker reports v2

on:
  push:
    branches:
      - tmp/qingdao-doublestar-broker-reports-20261103-v1
    paths:
      - .github/workflows/qingdao-doublestar-000599-broker-reports-20261103-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          code = "000599"
          company = "青岛双星"
          full_company = "青岛双星股份有限公司"
          root_name = "青岛双星_000599_券商深度研究报告_2份"
          root = Path(root_name)
          pdf_dir = root / "PDF原件"
          preview_dir = root / "首页预览"
          pdf_dir.mkdir(parents=True, exist_ok=True)
          preview_dir.mkdir(parents=True, exist_ok=True)

          reports = [
              dict(date="2014-06-06", broker="浙商证券", analyst="龚超", rating="买入（首次评级）",
                   report_type="公司深度报告", title="双星转型升级，打造世界轮胎名牌企业——青岛双星深度报告",
                   info_code="AP201406090006023730", url="https://pdf.dfcfw.com/pdf/H3_AP201406090006023730_1.pdf", expected_pages=26),
              dict(date="2015-03-23", broker="光大证券", analyst="毛伟、周南", rating="买入（维持）",
                   report_type="专题型公司研究", title="公司打造O2O/E2E模式，切入汽车后市场",
                   info_code="AP201503240008850265", url="https://pdf.dfcfw.com/pdf/H3_AP201503240008850265_1.pdf", expected_pages=None),
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer": "https://data.eastmoney.com/report/000599.html",
              "Accept": "application/pdf,*/*;q=0.8",
          })

          def safe(text):
              return re.sub(r"\s+", " ", re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text)).strip(" ._")[:170]

          manifest = []
          for idx, spec in enumerate(reports, 1):
              data = None
              used_url = None
              attempts = []
              for url in [spec["url"], spec["url"].replace("/H3_", "/H2_"), spec["url"].replace("/H3_", "/H1_")]:
                  for attempt in range(5):
                      try:
                          r = session.get(url, timeout=(30, 420), allow_redirects=True)
                          attempts.append({"url": url, "status": r.status_code, "bytes": len(r.content), "content_type": r.headers.get("content-type", ""), "magic": r.content[:8].hex(), "final_url": r.url})
                          print("PDF_REQUEST", json.dumps(attempts[-1], ensure_ascii=False))
                          if r.status_code == 200 and r.content.startswith(b"%PDF-") and len(r.content) > 50000:
                              data, used_url = r.content, r.url
                              break
                      except Exception as exc:
                          attempts.append({"url": url, "error": repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"download failed: {spec['title']} {attempts}")

              filename = safe(f"{idx:02d}_{spec['date'].replace('-', '')}_{spec['broker']}_{spec['title']}.pdf")
              path = pdf_dir / filename
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 8:
                  raise RuntimeError(f"report too short: {filename}, {pages} pages")
              if spec["expected_pages"] is not None and pages != spec["expected_pages"]:
                  raise RuntimeError(f"unexpected pages: {filename}, {pages}")

              text = ""
              for page in reader.pages[:min(20, pages)]:
                  try:
                      text += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              if not any(token in text for token in [company, full_company, code]):
                  raise RuntimeError(f"issuer validation failed: {filename}")

              q = subprocess.run(["qpdf", "--warning-exit-0", "--check", str(path)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if q.returncode != 0:
                  raise RuntimeError(q.stdout)
              prefix = preview_dir / path.stem
              render = subprocess.run(["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5000:
                  raise RuntimeError(f"preview failed: {filename} {render.stdout}")

              manifest.append({**spec, "filename": filename, "actual_pages": pages, "bytes": len(data),
                               "sha256": hashlib.sha256(data).hexdigest(), "pdf_url": used_url,
                               "detail_url": f"https://data.eastmoney.com/report/info/{spec['info_code']}.html",
                               "preview_file": str(Path("首页预览") / preview.name), "download_attempts": attempts})

          readme = [f"青岛双星（{code}.SZ）券商深度研究报告资料包", "整理日期：2026-11-03", "",
                    "本包收录2份公开可直接下载的券商原始PDF：1份26页首次覆盖深度报告，1份专题型公司研究报告。",
                    "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。", ""]
          for i, item in enumerate(manifest, 1):
              readme += [f"{i}. {item['filename']}",
                         f"   券商：{item['broker']}；报告类型：{item['report_type']}；研究员：{item['analyst']}；发布日期：{item['date']}",
                         f"   标题：{item['title']}",
                         f"   评级：{item['rating']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                         f"   原始PDF：{item['pdf_url']}", f"   SHA-256：{item['sha256']}", ""]
          readme += ["核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
                     "未使用网页摘要或重排文件替代券商原始PDF。"]
          (root / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")
          (root / "manifest.json").write_text(json.dumps({"company": company, "full_company_name": full_company, "stock_code": code,
                                                            "prepared_on": "2026-11-03", "report_count": len(manifest),
                                                            "all_files_are_original_broker_pdfs": True, "files": manifest},
                                                           ensure_ascii=False, indent=2), encoding="utf-8")
          with (root / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as f:
              w = csv.writer(f)
              w.writerow(["文件名", "报告类型", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256", "来源页面", "PDF地址"])
              for x in manifest:
                  w.writerow([x["filename"], x["report_type"], x["broker"], x["analyst"], x["date"], x["title"], x["rating"], x["actual_pages"], x["bytes"], x["sha256"], x["detail_url"], x["pdf_url"]])
          (root / "SHA256SUMS.txt").write_text("\n".join(f"{x['sha256']}  PDF原件/{x['filename']}" for x in manifest) + "\n", encoding="utf-8")

          zip_path = Path("qingdao_doublestar_000599_broker_deep_reports_2.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      z.write(p, arcname=str(Path(root_name) / p.relative_to(root)))
          with zipfile.ZipFile(zip_path, "r") as z:
              bad = z.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")
          result = {"package": zip_path.name, "zip_bytes": zip_path.stat().st_size,
                    "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(), "report_count": len(manifest),
                    "files": [{k: x[k] for k in ["filename", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256", "detail_url", "pdf_url"]} for x in manifest]}
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: qingdao-doublestar-000599-broker-deep-reports-2-20261103-v2
          path: |
            qingdao_doublestar_000599_broker_deep_reports_2.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
