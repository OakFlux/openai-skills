name: Query HKEX CEL latest filing

on:
  push:
    branches:
      - tmp/cel-report-scrape-fast-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check --quiet 'httpx[http2]' requests beautifulsoup4 lxml
      - name: Query HKEX
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse
          import httpx, requests
          from bs4 import BeautifulSoup
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          urls=[
            'https://www1.hkexnews.hk/ncms/script/eds/activestock_sehk_e.json',
            'https://www1.hkexnews.hk/ncms/script/eds/activestock_sehk_c.json',
          ]
          internal=None
          for u in urls:
            for client in ['requests','httpx']:
              try:
                if client=='requests': r=requests.get(u,headers=headers,timeout=30); body=r.text; status=r.status_code
                else:
                  with httpx.Client(http2=True,headers=headers,timeout=30,follow_redirects=True) as c:r=c.get(u)
                  body=r.text;status=r.status_code
                print('ACTIVE',client,status,len(body),u,body[:200],flush=True)
                if status==200 and body.strip().startswith('['):
                  data=json.loads(body)
                  for x in data:
                    if str(x.get('c','')).zfill(5)=='00165':
                      internal=str(x.get('i'));print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                  if internal:break
              except Exception as e:print('ACTIVE_ERR',client,u,repr(e),flush=True)
            if internal:break
          print('INTERNAL',internal,flush=True)
          if not internal:raise RuntimeError('stock id not found')

          search='https://www1.hkexnews.hk/search/titlesearch.xhtml'
          post_variants=[
            {'lang':'EN','stockId':internal,'from':'20260827','to':'20260827','documentType':'-1','MB-Daterange':'0','title':''},
            {'lang':'ZH','stockId':internal,'from':'20260827','to':'20260827','documentType':'-1','MB-Daterange':'0','title':''},
            {'lang':'EN','stockId':internal,'fromDate':'20260827','toDate':'20260827','documentType':'-1','MB-Daterange':'0','title':''},
          ]
          for i,p in enumerate(post_variants):
            try:
              r=requests.post(search,data=p,headers={**headers,'Referer':search},timeout=40)
              print('POST',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print('POSTBODY',r.text[:1000].replace('\n',' '),flush=True)
              soup=BeautifulSoup(r.text,'lxml')
              for a in soup.select('.doc-link a[href], a[href*="listconews"]'):
                title=' '.join(a.get_text(' ',strip=True).split())
                href=urllib.parse.urljoin(r.url,a.get('href'))
                print('POSTLINK',i,title,href,flush=True)
            except Exception as e:print('POST_ERR',i,repr(e),flush=True)

          base='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          params={'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':internal,'documentType':'-1','fromDate':'20260827','toDate':'20260827','title':'','searchType':'1','t1code':'40000','t2Gcode':'-2','t2code':'-2','rowRange':'1000','lang':'EN'}
          for client in ['requests','httpx']:
            try:
              ah={**headers,'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en','Accept':'application/json,text/javascript,*/*;q=0.01','X-Requested-With':'XMLHttpRequest'}
              if client=='requests':r=requests.get(base,params=params,headers=ah,timeout=40);body=r.text;status=r.status_code
              else:
                with httpx.Client(http2=True,headers=ah,timeout=40,follow_redirects=True) as c:r=c.get(base,params=params)
                body=r.text;status=r.status_code
              print('SERVLET',client,status,len(body),str(r.url),body[:50000],flush=True)
            except Exception as e:print('SERVLET_ERR',client,repr(e),flush=True)
          PY