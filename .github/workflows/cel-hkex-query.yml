name: Query HKEX CEL latest filing

on:
  push:
    branches:
      - tmp/cel-report-scrape-fast-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query HKEX
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, urllib.parse
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en','Accept':'application/json,text/javascript,*/*;q=0.01','X-Requested-With':'XMLHttpRequest'})
          base='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          variants=[]
          common={'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'289','documentType':'-1','fromDate':'27/08/2026','toDate':'27/08/2026','title':'','searchType':'1','t1code':'40000','t2Gcode':'-2','t2code':'-2','rowRange':'100','lang':'en'}
          variants.append(common)
          v=common.copy();v.update({'stockId':'289','stockCode':'00165','searchType':'0'});variants.append(v)
          v=common.copy();v.update({'stockId':'289','stockCode':'00165','searchType':'1','lang':'EN'});variants.append(v)
          for i,p in enumerate(variants):
            try:
              r=s.get(base,params=p,timeout=30)
              print('QUERY',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print('BODY',r.text[:30000],flush=True)
            except Exception as e:print('ERR',i,repr(e),flush=True)
          PY