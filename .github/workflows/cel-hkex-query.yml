name: Query HKEX CEL latest filing

on:
  push:
    branches:
      - tmp/cel-report-scrape-fast-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check --quiet 'httpx[http2]' requests
      - name: Query HKEX
        shell: bash
        run: |
          python - <<'PY'
          import httpx, requests
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en','Accept':'application/json,text/javascript,*/*;q=0.01','X-Requested-With':'XMLHttpRequest'}
          base='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          variants=[]
          for lang in ['EN','zh']:
            for t2 in ['40100','-2']:
              variants.append({'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'289','documentType':'-1','fromDate':'20260827','toDate':'20260827','title':'','searchType':'1','t1code':'40000','t2Gcode':'-2','t2code':t2,'rowRange':'1000','lang':lang})
          for i,p in enumerate(variants):
            for client_name in ['httpx','requests']:
              try:
                if client_name=='httpx':
                  with httpx.Client(http2=True,headers=headers,timeout=30.0,follow_redirects=True) as c:r=c.get(base,params=p)
                  body=r.text; status=r.status_code; ctype=r.headers.get('content-type'); url=str(r.url)
                else:
                  r=requests.get(base,params=p,headers=headers,timeout=30);body=r.text;status=r.status_code;ctype=r.headers.get('content-type');url=r.url
                print('QUERY',i,client_name,status,len(body),url,ctype,flush=True)
                print('BODY',body[:50000],flush=True)
              except Exception as e:print('ERR',i,client_name,repr(e),flush=True)
          PY