name: Temporary Reportify document endpoint inspection
on:
  push:
    branches:
      - tmp-reportify-document-api-20260906
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query document endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          report_id='1278761946887360512'
          document_id='831126939078626'
          base='https://api.reportify.cn'
          paths=[
              f'/reports/{report_id}',
              f'/reports/{report_id}/space',
              f'/reports/{report_id}/analysis',
              f'/reports/{report_id}/document',
              f'/reports/{report_id}/pages',
              f'/documents/{document_id}',
              f'/documents/{document_id}/pages',
              f'/documents/{document_id}/images',
              f'/documents/{document_id}/preview',
              f'/documents/{document_id}/content',
              f'/documents/{document_id}/download',
              f'/documents/{document_id}/pdf',
              f'/documents/{document_id}/file',
              f'/documents/{document_id}/render',
              f'/documents/{document_id}/page/1',
              f'/documents/{document_id}/pages/1',
              f'/document/{document_id}',
              f'/document/{document_id}/pages',
              f'/document/{document_id}/download',
          ]
          query_suffixes=['','?page=1','?page_no=1','?pageNum=1','?page_size=100','?limit=100']
          session=requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9',
              'Origin':'https://reportify.cn',
              'Referer':f'https://reportify.cn/reports/{report_id}',
          })
          results=[]
          for path in paths:
              suffixes=query_suffixes if any(key in path for key in ['/pages','/images','/content','/render']) else ['']
              for suffix in suffixes:
                  url=base+path+suffix
                  try:
                      response=session.get(url,timeout=60,allow_redirects=False)
                      data=response.content
                      row={
                          'url':url,
                          'status':response.status_code,
                          'content_type':response.headers.get('content-type'),
                          'content_length':response.headers.get('content-length'),
                          'location':response.headers.get('location'),
                          'bytes':len(data),
                          'head_hex':data[:24].hex(),
                          'text':response.text[:20000] if 'text' in (response.headers.get('content-type') or '') or 'json' in (response.headers.get('content-type') or '') else '',
                      }
                      print('RESULT',json.dumps({k:row[k] for k in ['url','status','content_type','bytes','location']},ensure_ascii=False),flush=True)
                  except Exception as exc:
                      row={'url':url,'error':repr(exc)}
                      print('ERROR',url,repr(exc),flush=True)
                  results.append(row)
          Path('output/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: reportify-document-api-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
