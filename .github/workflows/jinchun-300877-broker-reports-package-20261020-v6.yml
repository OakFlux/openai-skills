name: Package Jinchun 300877 broker reports 20261020 v6

on:
  push:
    branches:
      - tmp/jinchun-300877-broker-reports-package-20261020-v6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, html, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          CODE='300877'
          PACKAGE='金春股份_300877_券商深度研究报告_2份'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREVIEW=ROOT/'首页预览'; PREVIEW.mkdir(exist_ok=True)
          VERIFY=Path('_verify_jinchun'); VERIFY.mkdir(exist_ok=True)
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          specs=[
            {'url':'https://www.9fzt.com/detail/sz_300877_10_659779551713.html','broker':'天风证券股份有限公司','date':'2020-11-27','original_pages':18,'fallback_title':'金春股份：非织造优质新秀，产能优势凸显，拓展热风超纤扩大竞争优势','filename':'01_20201127_天风证券_非织造优质新秀_公开网页全文整理版_非券商原始PDF.pdf'},
            {'url':'https://www.9fzt.com/detail/sz_300877_10_666205438566.html','broker':'中信证券股份有限公司','date':'2021-02-09','original_pages':25,'fallback_title':'金春股份：水刺无纺布龙头，优势显著需求旺盛','filename':'02_20210209_中信证券_水刺无纺布龙头_公开网页全文整理版_非券商原始PDF.pdf'}
          ]

          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          def fetch(url):
              last={}
              for attempt in range(8):
                  try:
                      r=s.get(url,timeout=(25,180),allow_redirects=True)
                      last={'status':r.status_code,'bytes':len(r.content),'final_url':r.url,'type':r.headers.get('content-type','')}
                      if r.status_code==200 and len(r.content)>10000: return r
                  except Exception as e:
                      last={'error':repr(e)}
                  time.sleep(1+attempt)
              raise RuntimeError('fetch failed '+url+' '+json.dumps(last,ensure_ascii=False))

          def make_report(spec):
              r=fetch(spec['url']); r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
              soup=BeautifulSoup(r.text,'lxml')
              title_node=soup.select_one('.title-header') or soup.select_one('h1')
              body=soup.select_one('.detail-article-content') or soup.select_one('.blk_container')
              broker_node=soup.select_one('.date-type'); date_node=soup.select_one('.date-time')
              if title_node is None or body is None: raise RuntimeError('page structure changed '+spec['url'])
              title=re.sub(r'\s+',' ',title_node.get_text(' ',strip=True)) or spec['fallback_title']
              broker=re.sub(r'\s+',' ',broker_node.get_text(' ',strip=True)) if broker_node else spec['broker']
              date=re.sub(r'\s+',' ',date_node.get_text(' ',strip=True)) if date_node else spec['date']
              for tag in body.find_all(['script','style','iframe','form','button','noscript']): tag.decompose()
              for tag in body.find_all(True):
                  for attr in ['style','class','id','onclick','width','height']:
                      tag.attrs.pop(attr,None)
              body_text=re.sub(r'\s+',' ',body.get_text(' ',strip=True))
              if '金春股份' not in title+' '+body_text or len(body_text)<900:
                  raise RuntimeError(f'insufficient report text {spec["url"]}: {len(body_text)}')
              doc=f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>{html.escape(title)}</title><style>
              @page {{ size:A4; margin:17mm 17mm 19mm 17mm; @bottom-center {{ content:"公开网页全文整理版 - 第 " counter(page) " 页 / " counter(pages) " 页"; font-size:8.5pt; color:#666; }} }}
              body {{ font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif; font-size:10.4pt; line-height:1.72; color:#222; word-break:break-word; }}
              h1 {{ font-size:19pt; line-height:1.38; margin:0 0 12pt; }}
              .meta {{ font-size:10pt; color:#444; border-bottom:1px solid #aaa; padding-bottom:9pt; margin-bottom:13pt; line-height:1.65; }}
              .notice {{ border:1.5px solid #8c3131; background:#fff8f4; padding:10pt 12pt; margin:8pt 0 16pt; font-size:9.7pt; line-height:1.6; }}
              .notice strong {{ color:#781f1f; }} .source {{ font-size:8.3pt; color:#666; margin-top:7pt; word-break:break-all; }}
              p {{ margin:0 0 9pt; text-align:justify; }} a {{ color:#222; text-decoration:none; }}
              </style></head><body><h1>{html.escape(title)}</h1>
              <div class="meta">券商：{html.escape(broker)}<br>发布日期：{html.escape(date)}<br>对应原始报告公开信息页数：{spec['original_pages']}页</div>
              <div class="notice"><strong>文件性质说明：</strong>本文件依据公开网页所展示的券商研究报告正文整理并打印为PDF，<strong>不是券商发布的原始PDF</strong>。原始报告中的封面、图表、排版、页码、研究员签名及部分附录可能未被公开网页保留。报告著作权归原券商及作者所有。<div class="source">公开正文来源：{html.escape(spec['url'])}</div></div>
              {str(body)}</body></html>'''
              pdf=ROOT/spec['filename']; HTML(string=doc,base_url=spec['url']).write_pdf(str(pdf))
              if pdf.read_bytes()[:5]!=b'%PDF-': raise RuntimeError('bad PDF header '+pdf.name)
              reader=PdfReader(str(pdf),strict=False); pages=len(reader.pages)
              if pages<2: raise RuntimeError('too few pages '+pdf.name)
              text=''
              for p in reader.pages:
                  try: text+='\n'+(p.extract_text() or '')
                  except Exception: pass
              required=['金春股份',broker[:2],date[:4]]
              missing=[x for x in required if x not in text]
              if missing: raise RuntimeError(f'text validation failed {pdf.name}: {missing}')
              subprocess.run(['qpdf','--warning-exit-0','--check',str(pdf)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=VERIFY/pdf.stem
              subprocess.run(['pdftoppm','-png','-r','150',str(pdf),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              renders=sorted(VERIFY.glob(pdf.stem+'-*.png'))
              if len(renders)!=pages or any(x.stat().st_size<5000 for x in renders): raise RuntimeError('render verification failed '+pdf.name)
              preview=PREVIEW/(pdf.stem+'.png'); preview.write_bytes(renders[0].read_bytes())
              return {'filename':pdf.name,'document_form':'公开网页全文整理版（非券商原始PDF）','broker':broker,'date':date,'title':title,'source_url':spec['url'],'original_report_pages_public_metadata':spec['original_pages'],'offline_pdf_pages':pages,'bytes':pdf.stat().st_size,'sha256':sha(pdf),'preview_file':str(Path('首页预览')/preview.name),'note':'公开网页正文离线排版版；不是券商原始PDF，可能不含原报告图表、封面和版式。'}

          rows=[make_report(spec) for spec in specs]
          lines=[f'金春股份（{CODE}.SZ）券商深度研究报告资料包','整理日期：2026-10-20','',
                 '本包收录2份首次覆盖/公司深度研究资料。公开渠道未提供可直接下载的券商原始PDF，',
                 '因此包内PDF为公开网页正文的离线阅读版。文件名、PDF首页和清单均明确标注文件性质。','']
          for i,x in enumerate(rows,1):
              lines += [f'{i}. {x["filename"]}',f'   文件性质：{x["document_form"]}',f'   券商：{x["broker"]}；发布日期：{x["date"]}',f'   标题：{x["title"]}',f'   原始报告公开信息页数：{x["original_report_pages_public_metadata"]}页；离线整理版：{x["offline_pdf_pages"]}页',f'   来源页面：{x["source_url"]}',f'   SHA-256：{x["sha256"]}',f'   说明：{x["note"]}','']
          lines += ['核验项目：网页正文长度、PDF文件头、文本内容、qpdf结构、全页渲染、首页预览、逐文件SHA-256及ZIP CRC。','报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。']
          (ROOT/'README_报告清单与文件性质说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps({'company':'金春股份','full_company_name':'安徽金春无纺布股份有限公司','stock_code':CODE,'prepared_on':'2026-10-20','report_count':2,'files':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          with (ROOT/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['文件名','文件性质','券商','发布日期','标题','原始报告公开页数','离线整理版页数','字节数','SHA-256','来源页面','说明'])
              for x in rows: w.writerow([x['filename'],x['document_form'],x['broker'],x['date'],x['title'],x['original_report_pages_public_metadata'],x['offline_pdf_pages'],x['bytes'],x['sha256'],x['source_url'],x['note']])
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in rows)+'\n',encoding='utf-8')
          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=str(p))
          with zipfile.ZipFile(zpath,'r') as z:
              bad=z.testzip()
              if bad is not None: raise RuntimeError('ZIP CRC failed '+bad)
          print(json.dumps({'package':str(zpath),'zip_bytes':zpath.stat().st_size,'zip_sha256':sha(zpath),'report_count':2,'files':[{'name':x['filename'],'broker':x['broker'],'date':x['date'],'title':x['title'],'offline_pages':x['offline_pdf_pages'],'original_public_pages':x['original_report_pages_public_metadata'],'bytes':x['bytes'],'sha256':x['sha256']} for x in rows]},ensure_ascii=False,indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: jinchun-300877-broker-reports-20261020-v6
          path: 金春股份_300877_券商深度研究报告_2份.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
