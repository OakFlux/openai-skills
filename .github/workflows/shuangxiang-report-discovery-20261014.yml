name: Discover public brokerage reports for Shuangxiang 002395

on:
  push:
    paths:
      - '.github/workflows/shuangxiang-report-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query public report indexes and APIs
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, html, sys
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def fetch(url, headers=None, method='get', data=None):
            try:
              if method=='post': r=s.post(url,headers=headers,data=data,timeout=60,allow_redirects=True)
              else: r=s.get(url,headers=headers,timeout=60,allow_redirects=True)
              print('\nFETCH',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              return r
            except Exception as e:
              print('\nERROR',url,repr(e),flush=True); return None

          # Eastmoney report API variants.
          base='https://reportapi.eastmoney.com/report/list'
          variants=[
            {'pageSize':'100','beginTime':'2010-01-01','endTime':'2026-10-14','pageNo':'1','qType':'0','code':'002395','p':'1','pageNum':'1'},
            {'pageSize':'100','pageNo':'1','qType':'0','code':'002395'},
            {'pageSize':'100','beginTime':'2010-01-01','endTime':'2026-10-14','pageNo':'1','qType':'1','code':'002395','p':'1','pageNum':'1'},
          ]
          for params in variants:
            try:
              r=s.get(base,params=params,headers={'Referer':'https://data.eastmoney.com/report/002395.html','User-Agent':s.headers['User-Agent']},timeout=60)
              print('\nEASTMONEY',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print(r.text[:100000],flush=True)
            except Exception as e: print('EASTMONEY_ERROR',repr(e),flush=True)

          # Sina likely report-list/search endpoints.
          sina_urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=002395',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?keyword='+quote('双象股份'),
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?stockcode=002395',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?code=002395',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/629760863215/index.phtml',
          ]
          for u in sina_urls:
            r=fetch(u)
            if not r: continue
            r.encoding=r.apparent_encoding or 'utf-8'; text=r.text
            soup=BeautifulSoup(text,'lxml')
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
            for form in soup.find_all('form'):
              fields=[]
              for inp in form.find_all(['input','select','textarea']):
                fields.append({'tag':inp.name,'name':inp.get('name'),'id':inp.get('id'),'type':inp.get('type'),'value':inp.get('value')})
              print('FORM',json.dumps({'action':urljoin(r.url,form.get('action') or ''),'method':form.get('method'),'id':form.get('id'),'fields':fields},ensure_ascii=False),flush=True)
            links=[]
            for a in soup.find_all('a',href=True):
              label=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              joined=label+' '+href
              if any(k in joined for k in ('双象股份','002395','vReport_Show','rptid')):
                links.append({'label':label,'href':href})
            print('MATCH_LINKS',json.dumps(links[:300],ensure_ascii=False),flush=True)
            for term in ('双象股份','002395','vReport_Show','rptid','search'):
              poses=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
              print('TERM',term,len(poses),flush=True)
              for p in poses[:12]: print('CTX',re.sub(r'\s+',' ',html.unescape(text[max(0,p-700):p+1800]))[:2500],flush=True)

          # Try Sina search form POST/GET guesses.
          guesses=[
            ('get','https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml',{'keyword':'双象股份'}),
            ('get','https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml',{'stock':'双象股份'}),
            ('get','https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml',{'symbol':'002395'}),
            ('post','https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml',{'keyword':'双象股份','symbol':'002395'}),
          ]
          for method,u,data in guesses:
            try:
              if method=='post': r=s.post(u,data=data,timeout=60)
              else: r=s.get(u,params=data,timeout=60)
              r.encoding=r.apparent_encoding or 'utf-8'; soup=BeautifulSoup(r.text,'lxml')
              print('\nSINA_GUESS',method,r.status_code,len(r.content),r.url,'TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
                if '双象股份' in label or '002395' in label or 'vReport_Show' in href:
                  print('SINA_RESULT',json.dumps({'label':label,'href':href},ensure_ascii=False),flush=True)
            except Exception as e: print('SINA_GUESS_ERROR',repr(e),flush=True)

          # Search engines for exact titles and PDF assets.
          queries=[
            '"双象股份" 002395 研报 PDF',
            '"双象股份" 深度报告 PDF',
            '"双象股份(002395)" 公司研究 PDF',
            '"立足原料优势 看好公司PMMA产业链一体化布局" PDF',
            '"双象股份" 东兴证券 2010 PDF',
            '"双象股份" 光大证券 2010 PDF',
            '"双象股份" 中信建投 2010 PDF',
          ]
          engines={
            'bing':lambda q:'https://www.bing.com/search?q='+quote(q),
            'so360':lambda q:'https://www.so.com/s?q='+quote(q),
          }
          for q in queries:
            print('\nQUERY',q,flush=True)
            for name,build in engines.items():
              r=fetch(build(q))
              if not r: continue
              r.encoding=r.apparent_encoding or 'utf-8'; soup=BeautifulSoup(r.text,'lxml')
              count=0
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
                joined=(label+' '+href).lower()
                if any(k in joined for k in ('双象股份','002395','pdf','vreport_show','研报','报告')) and len(label)>4:
                  print('SEARCH_RESULT',name,json.dumps({'label':label[:400],'href':href},ensure_ascii=False),flush=True); count+=1
                  if count>=60: break

          # Hibor search/archive guesses.
          hibor_urls=[
            'https://www.hibor.com.cn/search.html?keyword='+quote('双象股份'),
            'https://www.hibor.com.cn/search?keyword='+quote('双象股份'),
            'https://www.hibor.com.cn/newsearch?keyword='+quote('双象股份'),
            'https://www.hibor.com.cn/repinfosearch?keyword='+quote('双象股份'),
            'https://fxgroup.hibor.com.cn/Archiver/201912.html',
            'https://www.hibor.com.cn/archiver_houtai/201912.html',
          ]
          for u in hibor_urls:
            r=fetch(u)
            if not r: continue
            r.encoding=r.apparent_encoding or 'utf-8'; soup=BeautifulSoup(r.text,'lxml')
            print('HIBOR_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
            for a in soup.find_all('a',href=True):
              label=' '.join(a.get_text(' ',strip=True).split()); href=urljoin(r.url,a['href'])
              if '双象股份' in label or '002395' in label:
                print('HIBOR_RESULT',json.dumps({'label':label,'href':href},ensure_ascii=False),flush=True)
          PY