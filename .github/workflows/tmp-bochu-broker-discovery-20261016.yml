name: Discover Bochu Electronics broker reports

on:
  push:
    branches: [tmp-bochu-broker-reports-20261016]
    paths: ['.github/workflows/tmp-bochu-broker-discovery-20261016.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney public report index
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=688188' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&beginTime=2018-01-01&endTime=2026-10-16&qType=0&code=688188&industryCode=*&orgCode=&author=&fields=' \
            -o reports.jsonp
          wc -c reports.jsonp
          cat reports.jsonp
