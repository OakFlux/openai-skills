name: package-laplace-688726-filings

on:
  push:
    branches:
      - tmp/laplace-688726-filings-20261105-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Download validate and package documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          COMPANY = "拉普拉斯"
          FULL_NAME = "拉普拉斯新能源科技股份有限公司"
          CODE = "688726"
          PREPARED = "2026-11-05"
          ROOT_NAME = "拉普拉斯_688726_所有年报_招股说明书及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def extract_sina_download(detail_url: str) -> str:
              response = session.get(detail_url, timeout=(30, 180), allow_redirects=True)
              print("DETAIL", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
              response.raise_for_status()
              response.encoding = response.apparent_encoding or "gbk"
              soup = BeautifulSoup(response.text, "lxml")
              candidates: list[str] = []
              for anchor in soup.find_all("a", href=True):
                  href = urljoin(response.url, anchor["href"])
                  text = "".join(anchor.get_text(" ", strip=True).split())
                  if "下载公告" in text or "file.finance.sina.com.cn" in href or href.lower().endswith(".pdf"):
                      candidates.append(href)
              for match in re.findall(r"https?://[^\s\"'<>]+", response.text):
                  clean = match.replace("&amp;", "&")
                  if "file.finance.sina.com.cn" in clean or clean.lower().endswith(".pdf"):
                      candidates.append(clean)
              for candidate in dict.fromkeys(candidates):
                  if "file.finance.sina.com.cn" in candidate or candidate.lower().endswith(".pdf"):
                      print("DETAIL_PDF", candidate)
                      return candidate
              raise RuntimeError(f"No downloadable PDF found on {detail_url}")

          def resolved_urls(detail_url: str, fallbacks: list[str]) -> list[str]:
              urls: list[str] = []
              try:
                  urls.append(extract_sina_download(detail_url))
              except Exception as exc:
                  print("DETAIL_ERROR", detail_url, repr(exc))
              urls.extend(fallbacks)
              return list(dict.fromkeys(urls))

          documents = [
              {
                  "sequence": 1,
                  "category": "年度报告",
                  "period": "2024年年度报告",
                  "announcement_date": "2025-04-17",
                  "filename": "01_2024年年度报告.pdf",
                  "minimum_pages": 100,
                  "keyword": "2024年年度报告",
                  "urls": resolved_urls(
                      "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10884628&stockid=688726",
                      [
                          "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-17/10884628.PDF",
                          "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-17/10884628.PDF",
                      ],
                  ),
              },
              {
                  "sequence": 2,
                  "category": "年度报告",
                  "period": "2025年年度报告",
                  "announcement_date": "2026-04-24",
                  "filename": "02_2025年年度报告.pdf",
                  "minimum_pages": 100,
                  "keyword": "2025年年度报告",
                  "urls": resolved_urls(
                      "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12170739&stockid=688726",
                      [
                          "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-24/12170739.PDF",
                          "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-24/12170739.PDF",
                      ],
                  ),
              },
              {
                  "sequence": 3,
                  "category": "招股说明书",
                  "period": "首次公开发行股票并在科创板上市招股说明书",
                  "announcement_date": "2024-10-24",
                  "filename": "03_20241024_首次公开发行股票并在科创板上市招股说明书.pdf",
                  "minimum_pages": 300,
                  "keyword": "招股说明书",
                  "urls": resolved_urls(
                      "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10539049&stockid=688726",
                      [
                          "https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-10/2024-10-24/10539049.PDF",
                          "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-10/2024-10-24/10539049.PDF",
                      ],
                  ),
              },
              {
                  "sequence": 4,
                  "category": "季度报告",
                  "period": "2026年第三季度报告",
                  "announcement_date": "2026-10-30",
                  "filename": "04_2026年第三季度报告.pdf",
                  "minimum_pages": 5,
                  "keyword": "2026年第三季度报告",
                  "urls": resolved_urls(
                      "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12679157&stockid=688726",
                      [
                          "https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/688726_20261030_0WZB.pdf",
                          "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-30/12679157.PDF",
                      ],
                  ),
              },
          ]

          accepted_names = [CODE, COMPANY, FULL_NAME, "LAPLACE"]

          def compact_pdf_text(reader: PdfReader) -> str:
              count = len(reader.pages)
              indices = list(range(min(16, count)))
              if count > 16:
                  indices.extend(range(max(16, count - 3), count))
              text = "\n".join((reader.pages[i].extract_text() or "") for i in sorted(set(indices)))
              return re.sub(r"\s+", "", text)

          def download_valid_pdf(document: dict) -> tuple[bytes, str, str, int]:
              last_error: Exception | None = None
              for url in document["urls"]:
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 480),
                              allow_redirects=True,
                              headers={
                                  "Accept": "application/pdf,*/*;q=0.8",
                                  "Referer": "https://www.sse.com.cn/",
                              },
                          )
                          print("DOWNLOAD", document["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          if not response.content.startswith(b"%PDF-") or len(response.content) < 50_000:
                              raise RuntimeError(f"Not a valid PDF response: {response.content[:60]!r}")

                          temp = Path("candidate.pdf")
                          temp.write_bytes(response.content)
                          reader = PdfReader(str(temp), strict=False)
                          pages = len(reader.pages)
                          if pages < document["minimum_pages"]:
                              raise RuntimeError(f"Document too short: {pages} pages")
                          compact = compact_pdf_text(reader)
                          if not any(name.replace(" ", "") in compact for name in accepted_names):
                              raise RuntimeError("Issuer validation failed")
                          if document["keyword"].replace(" ", "") not in compact:
                              raise RuntimeError(f"Document type validation failed for {document['keyword']}")
                          return response.content, response.url, response.headers.get("content-type", ""), pages
                      except Exception as exc:
                          last_error = exc
                          print("DOWNLOAD_ERROR", document["period"], attempt, url, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to obtain {document['period']}: {last_error}")

          manifest: list[dict] = []
          for document in documents:
              data, source_url, content_type, pages = download_valid_pdf(document)
              path = PDF_DIR / document["filename"]
              path.write_bytes(data)

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {path.name}: {qpdf.stdout}")

              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 6_000:
                  raise RuntimeError(f"Preview rendering failed for {path.name}: {render.stdout}")

              record = {
                  "sequence": document["sequence"],
                  "category": document["category"],
                  "period": document["period"],
                  "announcement_date": document["announcement_date"],
                  "filename": document["filename"],
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": source_url,
                  "content_type": content_type,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(record)
              print("VALIDATED", record["category"], record["period"], pages, record["sha256"])

          if len(manifest) != 4:
              raise RuntimeError(f"Expected 4 documents, got {len(manifest)}")

          readme = [
              f"{FULL_NAME}（{CODE}.SH）年度报告、招股说明书及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "公司于2024年10月29日在上海证券交易所科创板上市。上市后已披露的年度报告为2024年年度报告和2025年年度报告，因此“所有年报”共2份。",
              "本包另收录2024年10月24日披露的最终版首次公开发行股票并在科创板上市招股说明书，以及截至整理日最新的2026年第三季度报告。",
              "已排除年度报告摘要、招股意向书、招股说明书申报稿/上会稿/注册稿、半年度报告及其他附件。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   类型：{item['category']}；文件名称：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、文件类型、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_文件清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "listing_date": "2024-10-29",
              "prepared_on": PREPARED,
              "document_count": len(manifest),
              "annual_report_count": sum(item["category"] == "年度报告" for item in manifest),
              "prospectus_count": sum(item["category"] == "招股说明书" for item in manifest),
              "latest_quarter": "2026年第三季度报告",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "类型", "文件名称", "公告日期", "文件名", "页数", "字节数", "SHA-256", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["category"], item["period"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"],
                      item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("laplace_688726_all_annual_prospectus_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 4:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 4")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "document_count": len(manifest),
              "annual_report_count": 2,
              "prospectus_count": 1,
              "latest_quarter": "2026年第三季度报告",
              "files": [{key: item[key] for key in ["category", "period", "announcement_date", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: laplace-688726-filings-20261105
          path: |
            laplace_688726_all_annual_prospectus_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
