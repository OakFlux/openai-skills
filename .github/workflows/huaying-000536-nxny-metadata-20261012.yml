name: Inspect Nxny Huaying 000536 report metadata 20261012

on:
  push:
    paths:
      - '.triggers/huaying-000536-nxny-metadata-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Parse stock and report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse,time
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.nxny.com/'})
          code='000536'; links={}
          urls=[f'https://www.nxny.com/stock/stock_{code}/']+[f'https://www.nxny.com/stock/stock_{code}/index_{p}.html' for p in range(2,8)]+[f'https://www.nxny.com/stock/stock_{code}/?page={p}' for p in range(2,8)]
          for u in urls:
              try:
                  r=s.get(u,timeout=(15,60),allow_redirects=True)
                  print('STOCK',r.status_code,len(r.content),u,'FINAL',r.url,flush=True)
                  if r.status_code!=200 or len(r.content)<1000: continue
                  text=r.content.decode('gb18030',errors='replace'); soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all('a',href=True):
                      href=urllib.parse.urljoin(r.url,a['href']); title=' '.join(a.get_text(' ',strip=True).split())
                      m=re.search(r'/report/view_(\d+)\.html',href)
                      if m and ('华映科技' in title or code in title): links[m.group(1)]={'rid':m.group(1),'url':href,'list_title':title}
              except Exception as e: print('STOCK_ERR',u,repr(e),flush=True)
          print('LINK_COUNT',len(links),flush=True)
          for rid,rec in links.items():
              try:
                  r=s.get(rec['url'],timeout=(15,60),allow_redirects=True)
                  print('DETAIL_FETCH',rid,r.status_code,len(r.content),r.url,flush=True)
                  if r.status_code!=200 or '/error/' in r.url or len(r.content)<1000:
                      print('DETAIL_BAD',json.dumps(rec,ensure_ascii=False),flush=True); continue
                  text=r.content.decode('gb18030',errors='replace'); soup=BeautifulSoup(text,'lxml')
                  page_title=soup.title.get_text(' ',strip=True) if soup.title else rec['list_title']
                  visible=' '.join(soup.get_text(' ',strip=True).split())
                  pages=''; size=''; broker=''; date=''; rating=''; authors=''
                  mp=re.search(r'pdf\s*(?:&nbsp;|\s)*共\s*(\d+)\s*页',text,re.I) or re.search(r'pdf\s*共(\d+)页',visible,re.I)
                  if mp: pages=mp.group(1)
                  ms=re.search(r'大小[：:]?(?:</td>\s*<td[^>]*>)?(?:&nbsp;)*\s*([0-9.]+\s*(?:KB|MB))',text,re.I)
                  if ms: size=ms.group(1)
                  md=re.search(r'上传日期[：:]?(?:</td>\s*<td[^>]*>)?(?:&nbsp;)*\s*(\d{4}/\d{1,2}/\d{1,2})',text,re.I)
                  if md: date=md.group(1)
                  # Extract metadata table cells using labels and next cell.
                  for tr in soup.find_all('tr'):
                      cells=[' '.join(c.get_text(' ',strip=True).split()) for c in tr.find_all(['td','th'])]
                      joined=' | '.join(cells)
                      if '来源' in joined and len(cells)>=2:
                          for i,c in enumerate(cells[:-1]):
                              if '来源' in c: broker=cells[i+1]
                      if '评级' in joined and len(cells)>=2:
                          for i,c in enumerate(cells[:-1]):
                              if '评级' in c: rating=cells[i+1]
                      if '作者' in joined and len(cells)>=2:
                          for i,c in enumerate(cells[:-1]):
                              if '作者' in c: authors=cells[i+1]
                  out={**rec,'page_title':page_title,'pages':pages,'size':size,'date':date,'broker':broker,'rating':rating,'authors':authors,'visible_sample':visible[:1200]}
                  print('DETAIL',json.dumps(out,ensure_ascii=False),flush=True)
                  time.sleep(.15)
              except Exception as e: print('DETAIL_ERR',rid,repr(e),flush=True)
          PY
