name: Target Shanghai Jiubai related broker reports

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-related-reports-targeted-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests
      - name: Find exact report metadata
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[('2022-04-29','2022-05-05'),('2022-05-27','2022-06-02')]
          terms=['上海稳步推进复工复产','上海线下商业即将全面恢复营业','上海本地商业股','本地商业股的修复机会']
          for begin,end in windows:
            for qtype in ['0','1','2']:
              p={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              r=s.get(api,params=p,timeout=(20,120))
              print('HTTP',begin,end,qtype,r.status_code,len(r.content),r.url)
              if r.status_code!=200: continue
              payload=r.json(); data=payload.get('data') or []
              if isinstance(data,dict): data=data.get('list') or data.get('data') or []
              found=[]
              for row in data:
                title=str(row.get('title') or '')
                if any(t in title for t in terms):
                  found.append({k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
              print('FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          PY
