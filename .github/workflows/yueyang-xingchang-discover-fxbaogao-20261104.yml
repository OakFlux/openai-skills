name: Discover Yueyang Xingchang deep report PDF 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-discover-fxbaogao-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect public report pages
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests
          from urllib.parse import urljoin

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          })
          urls = [
              'https://www.fxbaogao.com/detail/3433347',
              'https://www.fxbaogao.com/view?id=3433347',
              'https://www.sgpjbg.com/baogao/103931.html',
              'https://www.sgpjbg.com/baogao/103932.html',
              'https://www.sgpjbg.com/baogao/103933.html',
          ]
          for url in urls:
              try:
                  r = session.get(url, timeout=(30, 180), allow_redirects=True)
                  print('\n===URL===', url, 'STATUS', r.status_code, 'FINAL', r.url, 'TYPE', r.headers.get('content-type'), 'BYTES', len(r.content))
                  text = r.text
                  print('HEAD', repr(text[:2000]))
                  patterns = [
                      r'https?://[^\"\'<>\\s]+?\.pdf(?:\?[^\"\'<>\\s]*)?',
                      r'https?://[^\"\'<>\\s]*dr\.fxbaogao\.com[^\"\'<>\\s]+',
                      r'[^\"\']+\.pdf',
                      r'__NEXT_DATA__[^>]*>(.*?)</script>',
                  ]
                  found = []
                  for pattern in patterns:
                      found.extend(re.findall(pattern, text, flags=re.I|re.S))
                  print('FOUND', json.dumps(list(dict.fromkeys(found))[:100], ensure_ascii=False))
                  for line in text.splitlines():
                      low = line.lower()
                      if any(token in low for token in ('pdf', 'download', '3433347', 'dr.fxbaogao')):
                          print('LINE', line[:2000])
              except Exception as exc:
                  print('ERROR', url, repr(exc))
          PY
