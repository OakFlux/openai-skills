name: Package Changhong Energy annual reports prospectus and latest quarter

on:
  pull_request:
    paths:
      - 'tasks/changhong-energy-filings-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import html
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '长虹能源'
          FULL_NAME = '四川长虹新能源科技股份有限公司'
          CURRENT_CODE = '920239'
          HISTORICAL_CODE = '836239'
          CODES = (CURRENT_CODE, HISTORICAL_CODE)
          AS_OF = dt.date(2026, 10, 12)

          OUT = Path('artifact_out')
          WORK = Path('changhong_energy_filings_work')
          PACKAGE = WORK / '长虹能源_920239.BJ_全部年报_招股说明书_最新季报'
          VERIFY = WORK / 'verify'
          for path in (OUT, PACKAGE, VERIFY):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=6, connect=6, read=6, status=6,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=10, pool_maxsize=10))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def clean_title(value: str) -> str:
              text = html.unescape(value or '')
              text = re.sub(r'<[^>]+>', '', text)
              return re.sub(r'\s+', '', text).strip()

          announcements: list[dict] = []
          for code in CODES:
              for page in range(1, 61):
                  params = {
                      'sr': '-1',
                      'page_size': '100',
                      'page_index': str(page),
                      'ann_type': 'A',
                      'client_source': 'web',
                      'stock_list': code,
                  }
                  response = session.get(
                      'https://np-anotice-stock.eastmoney.com/api/security/ann',
                      params=params,
                      timeout=(25, 120),
                  )
                  print('ANNOUNCEMENT_PAGE', code, page, response.status_code, len(response.content), flush=True)
                  response.raise_for_status()
                  rows = (response.json().get('data') or {}).get('list') or []
                  if not rows:
                      break
                  for row in rows:
                      item = dict(row)
                      item['_query_code'] = code
                      item['_title'] = clean_title(row.get('title') or row.get('title_ch') or '')
                      item['_date'] = str(row.get('notice_date') or row.get('display_time') or '')[:10]
                      announcements.append(item)
                  dates = [str(row.get('notice_date') or row.get('display_time') or '')[:10] for row in rows]
                  if dates and min(dates) < '2019-01-01':
                      break
                  time.sleep(0.12)

          if not announcements:
              raise RuntimeError('No announcements returned for Changhong Energy')

          dedup = {}
          for item in announcements:
              key = str(item.get('art_code') or item.get('artCode') or item.get('announcementId') or (item['_title'], item['_date']))
              if key not in dedup:
                  dedup[key] = item
              elif item['_query_code'] == CURRENT_CODE:
                  dedup[key] = item
          announcements = list(dedup.values())
          announcements.sort(key=lambda item: (item['_date'], item['_title']), reverse=True)
          (WORK / 'announcement_index.json').write_text(
              json.dumps(announcements, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          print('ANNOUNCEMENT_COUNT', len(announcements), flush=True)
          for item in announcements:
              title = item['_title']
              if any(term in title for term in ('年度报告', '季度报告', '一季度报告', '三季度报告', '招股说明书', '公开发行股票说明书', '公开发行说明书')):
                  print('CANDIDATE', item['_date'], item['_query_code'], title, item.get('art_code'), flush=True)

          excluded_common = (
              '摘要', '英文版', '审计报告', '审核报告', '鉴证报告', '问询函', '回复',
              '取消', '提示性公告', '董事会决议', '监事会决议', '更正公告',
              '补充公告', '说明公告', '内部控制', '社会责任报告', '独立董事述职',
              '业绩快报', '业绩预告', '风险提示',
          )

          def version_score(title: str, phrase: str) -> int:
              exacts = {
                  phrase, f'{COMPANY}:{phrase}', f'{COMPANY}：{phrase}',
                  f'{CURRENT_CODE}:{phrase}', f'{HISTORICAL_CODE}:{phrase}',
                  f'{FULL_NAME}:{phrase}', f'{FULL_NAME}：{phrase}',
              }
              score = 1000 if title in exacts else 0
              if title.endswith(phrase):
                  score += 250
              if any(word in title for word in ('修订版', '更正后', '更新后')):
                  score += 120
              if '正文' in title:
                  score -= 20
              return score

          def choose_annual(year: int) -> dict:
              phrase = f'{year}年年度报告'
              candidates = []
              for item in announcements:
                  title = item['_title']
                  if phrase not in title or any(word in title for word in excluded_common):
                      continue
                  candidates.append((version_score(title, phrase), item['_date'], item))
              if not candidates:
                  nearby = [x['_title'] for x in announcements if str(year) in x['_title'] and '年度报告' in x['_title']][:80]
                  raise RuntimeError(f'Missing annual report {year}: {nearby}')
              candidates.sort(key=lambda row: (row[0], row[1]), reverse=True)
              return candidates[0][2]

          def choose_prospectus() -> dict:
              excluded = excluded_common + (
                  '招股说明书摘要', '公开发行说明书摘要', '申报稿', '注册稿',
                  '草案', '预披露', '问询回复', '反馈意见', '审核意见',
                  '招股意向书', '意向书', '附录', '修订说明',
              )
              candidates = []
              for item in announcements:
                  title = item['_title']
                  is_offering_doc = (
                      '招股说明书' in title or
                      '公开发行股票说明书' in title or
                      ('公开发行说明书' in title and '股票' in title)
                  )
                  if not is_offering_doc or any(word in title for word in excluded):
                      continue
                  score = 0
                  if '向不特定合格投资者公开发行股票并在精选层挂牌' in title:
                      score += 2200
                  if '向不特定合格投资者公开发行股票' in title:
                      score += 1400
                  if '招股说明书' in title:
                      score += 800
                  if '公开发行股票说明书' in title:
                      score += 700
                  if title.endswith(('招股说明书', '公开发行股票说明书', '公开发行说明书')):
                      score += 300
                  if '2021-01-01' <= item['_date'] <= '2021-02-28':
                      score += 300
                  candidates.append((score, item['_date'], item))
              if not candidates:
                  nearby = [x['_title'] for x in announcements if '发行' in x['_title'] and '说明书' in x['_title']][:120]
                  raise RuntimeError(f'No final offering prospectus found: {nearby}')
              candidates.sort(key=lambda row: (row[0], row[1]), reverse=True)
              print('PROSPECTUS_CHOICES', json.dumps([
                  {'score': row[0], 'date': row[1], 'title': row[2]['_title'], 'code': row[2].get('art_code')}
                  for row in candidates[:20]
              ], ensure_ascii=False, indent=2), flush=True)
              return candidates[0][2]

          def quarter_period(title: str):
              match = re.search(r'(20\d{2})年(第一|一|第三|三)季度报告', title)
              if not match:
                  return None
              year = int(match.group(1))
              quarter = 1 if match.group(2) in ('第一', '一') else 3
              return year, quarter

          def choose_latest_quarter() -> tuple[dict, int, int]:
              candidates = []
              for item in announcements:
                  title = item['_title']
                  period = quarter_period(title)
                  if not period or any(word in title for word in excluded_common):
                      continue
                  year, quarter = period
                  variants = [f'{year}年第一季度报告', f'{year}年一季度报告'] if quarter == 1 else [f'{year}年第三季度报告', f'{year}年三季度报告']
                  vscore = max(version_score(title, phrase) for phrase in variants)
                  candidates.append((year, quarter, vscore, item['_date'], item))
              if not candidates:
                  nearby = [x['_title'] for x in announcements if '季度报告' in x['_title'] or '一季度报告' in x['_title'] or '三季度报告' in x['_title']][:100]
                  raise RuntimeError(f'Missing quarterly report: {nearby}')
              candidates.sort(key=lambda row: (row[0], row[1], row[2], row[3]), reverse=True)
              year, quarter, _, _, item = candidates[0]
              return item, year, quarter

          selected = [{
              'kind': 'prospectus',
              'label': '向不特定合格投资者公开发行股票说明书（正式版）',
              'item': choose_prospectus(),
              'min_pages': 250,
          }]
          for year in range(2020, 2026):
              selected.append({
                  'kind': 'annual', 'year': year, 'label': f'{year}年年度报告',
                  'item': choose_annual(year), 'min_pages': 90,
              })
          quarter_item, quarter_year, quarter_no = choose_latest_quarter()
          quarter_cn = '第一季度' if quarter_no == 1 else '第三季度'
          selected.append({
              'kind': 'quarter', 'year': quarter_year, 'quarter': quarter_no,
              'label': f'{quarter_year}年{quarter_cn}报告',
              'item': quarter_item, 'min_pages': 6,
          })

          print('SELECTED', json.dumps([
              {'label': entry['label'], 'title': entry['item']['_title'], 'date': entry['item']['_date'], 'query_code': entry['item']['_query_code']}
              for entry in selected
          ], ensure_ascii=False, indent=2), flush=True)

          def candidate_urls(item: dict) -> list[str]:
              urls = []
              for key in ('attach_url', 'adjunct_url', 'pdf_url', 'url'):
                  value = item.get(key)
                  if isinstance(value, str) and value:
                      if value.startswith('http'):
                          urls.append(value)
                      elif value.lower().endswith('.pdf'):
                          urls.append(urljoin('https://pdf.dfcfw.com/', value.lstrip('/')))
              code = item.get('art_code') or item.get('artCode') or item.get('announcementId')
              if code:
                  urls.extend([
                      f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H2_{code}_01.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{code}_01.pdf',
                  ])
              return list(dict.fromkeys(urls))

          def download_validate(entry: dict, dest: Path, index: int) -> tuple[str, int, int, str]:
              item = entry['item']
              last_error = None
              for url in candidate_urls(item):
                  try:
                      print('TRY_DOWNLOAD', item['_title'], url, flush=True)
                      response = session.get(
                          url,
                          headers={'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},
                          timeout=(30, 300),
                      )
                      response.raise_for_status()
                      blob = response.content
                      if not blob.startswith(b'%PDF'):
                          raise RuntimeError(f'not PDF; head={blob[:40]!r}')
                      if len(blob) < 100_000:
                          raise RuntimeError(f'file too small: {len(blob)} bytes')
                      dest.write_bytes(blob)

                      check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
                      if check.returncode not in (0, 3):
                          raise RuntimeError('qpdf failed: ' + check.stderr[-800:])

                      reader = PdfReader(str(dest), strict=False)
                      pages = len(reader.pages)
                      if pages < entry['min_pages']:
                          raise RuntimeError(f'page count {pages} below {entry["min_pages"]}')

                      text_path = VERIFY / f'{index:02d}.txt'
                      subprocess.run(
                          ['pdftotext', '-f', '1', '-l', str(min(25, pages)), str(dest), str(text_path)],
                          capture_output=True, text=True, check=False,
                      )
                      text = text_path.read_text(encoding='utf-8', errors='ignore') if text_path.exists() else ''
                      compact = re.sub(r'\s+', '', text)
                      identity_ok = COMPANY in compact or FULL_NAME in compact or CURRENT_CODE in compact or HISTORICAL_CODE in compact
                      if entry['kind'] == 'prospectus':
                          period_ok = (
                              ('招股说明书' in compact or '公开发行股票说明书' in compact or '公开发行说明书' in compact)
                              and ('向不特定合格投资者' in compact or '精选层' in compact or '公开发行股票' in compact)
                          )
                      elif entry['kind'] == 'annual':
                          period_ok = str(entry['year']) in compact and '年度报告' in compact
                      else:
                          period_ok = str(entry['year']) in compact and ('季度报告' in compact or '一季度报告' in compact or '三季度报告' in compact)
                      if not identity_ok or not period_ok:
                          raise RuntimeError(f'text identity/period check failed: identity={identity_ok}, period={period_ok}')

                      first_prefix = VERIFY / f'{index:02d}_first'
                      last_prefix = VERIFY / f'{index:02d}_last'
                      first = subprocess.run(
                          ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '80', str(dest), str(first_prefix)],
                          capture_output=True, text=True,
                      )
                      last = subprocess.run(
                          ['pdftoppm', '-f', str(pages), '-l', str(pages), '-singlefile', '-png', '-r', '80', str(dest), str(last_prefix)],
                          capture_output=True, text=True,
                      )
                      first_png = Path(str(first_prefix) + '.png')
                      last_png = Path(str(last_prefix) + '.png')
                      if first.returncode != 0 or last.returncode != 0 or not first_png.exists() or not last_png.exists() or first_png.stat().st_size < 5000 or last_png.stat().st_size < 5000:
                          raise RuntimeError('first/last page rendering failed')

                      digest = hashlib.sha256(blob).hexdigest()
                      return url, pages, len(blob), digest
                  except Exception as exc:
                      last_error = exc
                      if dest.exists():
                          dest.unlink()
                      print('DOWNLOAD_FAILED', url, repr(exc), flush=True)
              raise RuntimeError(f'Unable to download {item["_title"]}: {last_error}')

          manifest = []
          sha_lines = []
          for index, entry in enumerate(selected, start=1):
              if entry['kind'] == 'prospectus':
                  filename = f'{index:02d}_长虹能源_向不特定合格投资者公开发行股票说明书_正式版.pdf'
              elif entry['kind'] == 'annual':
                  filename = f'{index:02d}_长虹能源_{entry["year"]}年年度报告.pdf'
              else:
                  filename = f'{index:02d}_长虹能源_{entry["year"]}年{quarter_cn}报告.pdf'
              dest = PACKAGE / filename
              source_url, pages, size, digest = download_validate(entry, dest, index)
              item = entry['item']
              record = {
                  'file_name': filename,
                  'document_type': entry['kind'],
                  'label': entry['label'],
                  'announcement_title': item['_title'],
                  'announcement_date': item['_date'],
                  'announcement_code': item.get('art_code') or item.get('artCode') or item.get('announcementId'),
                  'query_code': item['_query_code'],
                  'source_pdf_url': source_url,
                  'pages': pages,
                  'bytes': size,
                  'sha256': digest,
              }
              manifest.append(record)
              sha_lines.append(f'{digest}  {filename}')
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(manifest) != 8:
              raise RuntimeError(f'Expected 8 PDFs, obtained {len(manifest)}')

          readme = [
              '# 长虹能源（920239.BJ，原代码836239）全部年报、公开发行说明书及最新季报',
              '',
              f'打包日期：{AS_OF.isoformat()}',
              '',
              '收录口径：公司于2021年2月9日在精选层挂牌，后平移至北京证券交易所；收录正式版向不特定合格投资者公开发行股票说明书、2020—2025年六份完整年度报告，以及截至打包日最新正式季度报告。',
              '已排除年度报告摘要、英文版、单独审计附件、发行说明书申报稿/问询回复、半年报和公告说明文件。',
              '',
              '## 文件清单',
              '',
          ]
          for record in manifest:
              readme.append(f'- {record["file_name"]}（{record["pages"]}页；公告日期 {record["announcement_date"]}；原公告标题：{record["announcement_title"]}）')
          readme += [
              '',
              '## 来源与校验',
              '',
              'PDF来自上市公司公开披露公告镜像。每份文件均完成PDF文件头、文件大小、公司及报告期文本、实际页数、qpdf结构检查和首末页渲染验证。',
              '原始公告标题、公告日期、PDF地址、页数、文件大小和SHA-256见manifest.json；校验值另见SHA256SUMS.txt。',
          ]
          (PACKAGE / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (PACKAGE / 'manifest.json').write_text(json.dumps({
              'company': COMPANY,
              'full_name': FULL_NAME,
              'current_ticker': '920239.BJ',
              'historical_ticker': '836239',
              'listing_date': '2021-02-09',
              'package_date': AS_OF.isoformat(),
              'reports': manifest,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          (PACKAGE / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          chinese_zip = OUT / '长虹能源_920239.BJ_全部年报_招股说明书_最新季报.zip'
          with zipfile.ZipFile(chinese_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(PACKAGE.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{PACKAGE.name}/{path.relative_to(PACKAGE)}')
          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len(pdfs) != 8:
                  raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs, expected 8')

          english_zip = OUT / 'Changhong_Energy_920239_All_Filings.zip'
          shutil.copy2(chinese_zip, english_zip)
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, hashlib.sha256(chinese_zip.read_bytes()).hexdigest(), flush=True)
          print('BACKUP_ZIP', english_zip, english_zip.stat().st_size, hashlib.sha256(english_zip.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: changhong-energy-filings-artifact
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
