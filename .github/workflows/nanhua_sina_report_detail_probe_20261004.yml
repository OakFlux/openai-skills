name: Nanhua Historical Report Detail Probe

on:
  push:
    branches:
      - chatgpt-nanhua-biological-broker-reports-20261004
    paths:
      - .github/workflows/nanhua_sina_report_detail_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Inspect report pages and hidden attachments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/html output/text
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ids=['322818659593','239791214234','227181924657','227111904454','208273612406','178214978092','178205186500','176915062500']
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          records=[]
          for rid in ids:
            url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
            r=s.get(url,timeout=90,allow_redirects=True)
            r.encoding=r.apparent_encoding or 'gb18030'
            html=r.text
            Path(f'output/html/{rid}.html').write_text(html,encoding='utf-8')
            soup=BeautifulSoup(html,'html.parser')
            title=' '.join((soup.title.get_text(' ',strip=True) if soup.title else '').split())
            h1s=[' '.join(x.get_text(' ',strip=True).split()) for x in soup.find_all(['h1','h2'])]
            full_text='\n'.join(line.strip() for line in soup.get_text('\n').splitlines() if line.strip())
            Path(f'output/text/{rid}.txt').write_text(full_text,encoding='utf-8')
            links=[]
            for tag in soup.find_all(['a','iframe','embed','object','script','link','img']):
              raw=tag.get('href') or tag.get('src') or tag.get('data') or ''
              if raw:
                absolute=urljoin(r.url,raw)
                blob=(absolute+' '+str(tag)).lower()
                if any(k in blob for k in ['.pdf','download','attach','file','report','rptid','doc','flash']):
                  links.append({'tag':tag.name,'text':' '.join(tag.get_text(' ',strip=True).split()),'url':absolute,'raw':raw})
            regex_urls=re.findall(r'https?://[^\"\'<>\s]+',html,re.I)
            for u in regex_urls:
              if any(k in u.lower() for k in ['.pdf','download','attach','file.finance','report']):
                links.append({'tag':'regex','text':'','url':u,'raw':u})
            # Extract likely metadata and article body from tables/divs.
            metadata=[]
            for node in soup.find_all(['p','td','div','span','li']):
              text=' '.join(node.get_text(' ',strip=True).split())
              if text and len(text)<500 and any(k in text for k in ['类别：','机构：','研究员：','日期：','评级','目标价']):
                metadata.append(text)
            # Large text blocks likely report body.
            blocks=[]
            for node in soup.find_all(['div','td','p']):
              text=' '.join(node.get_text(' ',strip=True).split())
              if len(text)>200:
                blocks.append({'len':len(text),'text':text})
            blocks=sorted(blocks,key=lambda x:x['len'],reverse=True)[:10]
            rec={'id':rid,'url':url,'status':r.status_code,'bytes':len(r.content),'encoding':r.encoding,'title':title,'headings':h1s,'metadata_candidates':list(dict.fromkeys(metadata))[:30],'links':links,'largest_blocks':blocks,'full_text_length':len(full_text)}
            records.append(rec)
            print('REPORT',json.dumps(rec,ensure_ascii=False))
          Path('output/report_details.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: nanhua-historical-report-detail-probe
          path: output/
          retention-days: 1
