name: Build DeZhan Health broker deep-report package

on:
  push:
    branches: [tmp-dezhan-broker-reports-20261015]
    paths: ['.github/workflows/tmp-dezhan-broker-package-20261015.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Download and validate reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='德展健康_券商深度报告_2份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            if [ "$qstatus" -eq 3 ]; then
              echo "qpdf reported repairable legacy warnings for $(basename "$out"):"
              cat "$out.qpdf.txt"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge 8
            pdftotext -f 1 -l 5 "$out" "$out.txt" 2>/dev/null
            grep -Eq '德展健康|天山纺织|嘉林药业' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201712291071161921_1.pdf' \
            "$PACKAGE/01_东方证券_降脂药龙头企业一致性评价带来新机遇_2017-12-28.pdf"

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201601240013257074_1.pdf' \
            "$PACKAGE/02_西南证券_嘉林药业借壳摇身成降血脂龙头_2016-01-22.pdf"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('德展健康_券商深度报告_2份')
          meta = {
              '01_东方证券_降脂药龙头企业一致性评价带来新机遇_2017-12-28.pdf': {
                  'broker': '东方证券',
                  'title': '降脂药龙头企业，一致性评价带来新机遇',
                  'date': '2017-12-28',
                  'index': 'AP201712291071161921',
                  'note': '德展健康首次覆盖/公司深度报告。',
              },
              '02_西南证券_嘉林药业借壳摇身成降血脂龙头_2016-01-22.pdf': {
                  'broker': '西南证券',
                  'title': '嘉林药业借壳，摇身成降血脂龙头',
                  'date': '2016-01-22',
                  'index': 'AP201601240013257074',
                  'note': '报告发布时证券简称为天山纺织（000813），研究对象为拟注入的嘉林药业；重组后上市公司更名为德展健康。',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 2:
              raise SystemExit(f'Expected 2 PDFs, found {len(pdfs)}')

          lines = [
              '德展健康（000813）券商公司深度报告',
              '整理日期：2026-10-15',
              '',
              '收录说明：',
              '1. 收录公开可下载的完整公司深度或首次覆盖报告，共2份。',
              '2. 2016年报告发布时证券简称为“天山纺织”，研究对象为重组拟注入资产嘉林药业；该公司后来成为德展健康核心经营主体。',
              '3. 两份旧版PDF可被常用阅读器正常解析；东方证券报告含可自动修复的旧式交叉引用警告，不影响页数和正文读取。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          for p in pdfs:
              item = meta[p.name]
              data = p.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(['pdfinfo', str(p)], text=True, errors='replace', stderr=subprocess.DEVNULL)
              pages = int(next(x.split(':', 1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              total_pages += pages
              lines += [
                  f'- {p.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  说明：{item['note']}",
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {p.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及首页正文关键词检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: DeZhan-Health-broker-deep-reports-2
          path: 德展健康_券商深度报告_2份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
