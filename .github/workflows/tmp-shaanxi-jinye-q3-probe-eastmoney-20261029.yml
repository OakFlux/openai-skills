name: Probe Shaanxi Jinye Q3 Eastmoney

on:
  push:
    branches:
      - tmp-shaanxi-jinye-q3-probe-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe Eastmoney and CFI
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html,json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://data.eastmoney.com/'})
          urls=[
            'https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=100&page_index=1&ann_type=A&client_source=web&stock_list=000812',
            'https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=100&page_index=1&ann_type=SHA&client_source=web&stock_list=000812',
          ]
          for u in urls:
            try:
              r=s.get(u,timeout=(10,30)); print('\nEAST',r.status_code,len(r.content),r.url,r.text[:1000])
              if r.ok:
                p=r.json(); print('KEYS',p.keys())
                data=p.get('data') or {}
                rows=data.get('list') or data.get('data') or []
                print('ROWS',len(rows))
                for x in rows:
                  title=x.get('title') or x.get('announcement_title') or ''
                  if '2026年第三季度报告' in title or '2026年三季度报告' in title:
                    print('MATCH',json.dumps(x,ensure_ascii=False)[:5000])
                    art=x.get('art_code') or x.get('artCode') or x.get('announcementId')
                    if art:
                      for host in ['H2','H3']:
                        pdf=f'https://pdf.dfcfw.com/pdf/{host}_{art}_1.pdf'
                        z=s.get(pdf,timeout=(10,60),headers={'Referer':'https://data.eastmoney.com/'}); print('PDF',pdf,z.status_code,len(z.content),z.headers.get('content-type'),z.content[:5])
            except Exception as e: print('EAST ERROR',repr(e))

          cfi='https://www.cfi.net.cn/p20261028001301.html'
          try:
            r=s.get(cfi,timeout=(10,30),allow_redirects=True); print('\nCFI',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            r.encoding=r.apparent_encoding or 'gb18030'; text=html.unescape(r.text).replace('\\/','/')
            soup=BeautifulSoup(text,'html.parser')
            print('TITLE',soup.title)
            for a in soup.find_all('a',href=True):
              href=urljoin(r.url,a.get('href'))
              label=re.sub(r'\s+','',a.get_text(' ',strip=True))
              if '.pdf' in href.lower() or '下载' in label or '附件' in label: print('CFI LINK',label,href)
            for m in re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',text,flags=re.I): print('CFI PDF',m)
          except Exception as e: print('CFI ERROR',repr(e))
          PY
