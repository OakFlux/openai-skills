name: Inspect Silkroad Visual SGPJBG pages 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-sgpjbg-inspect-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright requests beautifulsoup4 lxml
          python -m playwright install chromium

      - name: Inspect direct report pages and network
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import re
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          TARGETS = [
              ('浙商证券2023', 'https://www.sgpjbg.com/baogao/148552.html?newsid=2419475'),
              ('万联证券2024', 'https://www.sgpjbg.com/baogao/166556.html?newsid=2685550'),
          ]

          async def inspect(context, label, url):
              page = await context.new_page()
              requests_log = []
              responses = []

              def on_request(req):
                  try:
                      requests_log.append({
                          'method': req.method,
                          'url': req.url,
                          'resource_type': req.resource_type,
                          'post_data': (req.post_data or '')[:5000],
                      })
                  except Exception:
                      pass

              async def capture_response(resp):
                  try:
                      ct = (resp.headers.get('content-type') or '').lower()
                      item = {'status': resp.status, 'url': resp.url, 'content_type': ct}
                      blob = (resp.url + ' ' + ct).lower()
                      if ('json' in ct or any(k in blob for k in ['api','detail','report','file','download','preview','document'])) and resp.status == 200:
                          try:
                              body = await resp.text()
                              item['body'] = body[:20000]
                          except Exception as exc:
                              item['body_error'] = repr(exc)
                      responses.append(item)
                  except Exception:
                      pass

              page.on('request', on_request)
              page.on('response', lambda resp: asyncio.create_task(capture_response(resp)))

              print('\n\n################', label, url)
              try:
                  await page.goto(url, wait_until='commit', timeout=30000)
              except PlaywrightTimeoutError as exc:
                  print('GOTO_TIMEOUT', repr(exc), 'CURRENT', page.url)
              except Exception as exc:
                  print('GOTO_ERROR', repr(exc), 'CURRENT', page.url)

              try:
                  await page.wait_for_timeout(18000)
              except Exception:
                  pass

              print('FINAL_URL', page.url)
              try:
                  print('TITLE', await page.title())
              except Exception as exc:
                  print('TITLE_ERROR', repr(exc))

              try:
                  body_text = await page.locator('body').inner_text(timeout=10000)
              except Exception as exc:
                  body_text = ''
                  print('BODY_ERROR', repr(exc))
              plain = re.sub(r'\s+', ' ', body_text)
              print('BODY_HEAD', plain[:15000])

              try:
                  html = await page.content()
              except Exception as exc:
                  html = ''
                  print('HTML_ERROR', repr(exc))
              print('HTML_LEN', len(html))
              for pattern in [
                  r'https?://[^\s\"\'<>]+?\.(?:pdf|png|jpe?g|webp)(?:\?[^\s\"\'<>]*)?',
                  r'(?:src|href|data-src|data-original)=[\"\']([^\"\']+)[\"\']',
                  r'file[_-]?(?:url|path|name).{0,1000}',
                  r'(?:pdf|download|preview|document|report|page)[^\n]{0,1000}',
              ]:
                  found = re.findall(pattern, html, flags=re.I|re.S)
                  if pattern.startswith('(?:src'):
                      found = [urljoin(page.url, x) for x in found]
                  relevant = []
                  for x in found:
                      value = x if isinstance(x, str) else str(x)
                      if any(k in value.lower() for k in ['148552','166556','pdf','report','baogao','image','page','preview','download','file','static','upload','oss','cdn']):
                          relevant.append(value[:2000])
                  print('PATTERN', pattern, 'COUNT', len(found), 'RELEVANT', json.dumps(relevant[:300], ensure_ascii=False))

              try:
                  elements = await page.locator('img, iframe, embed, object, a').evaluate_all("""
                  els => els.map(el => ({
                    tag: el.tagName,
                    text: (el.innerText || el.alt || '').trim(),
                    src: el.src || el.data || '',
                    href: el.href || '',
                    dataSrc: el.getAttribute('data-src') || '',
                    dataOriginal: el.getAttribute('data-original') || ''
                  }))
                  """)
              except Exception as exc:
                  elements = []
                  print('ELEMENT_ERROR', repr(exc))
              selected = []
              for item in elements:
                  blob = json.dumps(item, ensure_ascii=False).lower()
                  if any(k in blob for k in ['148552','166556','pdf','download','报告','查看完整','image','page','preview','file','upload','oss','cdn']):
                      selected.append(item)
              print('ELEMENTS', json.dumps(selected[:400], ensure_ascii=False))

              await page.wait_for_timeout(3000)
              print('REQUESTS')
              for item in requests_log:
                  blob = (item['url'] + ' ' + item['resource_type']).lower()
                  if any(k in blob for k in ['148552','166556','pdf','report','baogao','image','page','preview','download','file','upload','oss','cdn','api']):
                      print(json.dumps(item, ensure_ascii=False))

              print('RESPONSES')
              for item in responses:
                  blob = (item['url'] + ' ' + item.get('content_type','')).lower()
                  if any(k in blob for k in ['148552','166556','pdf','report','baogao','image','page','preview','download','file','upload','oss','cdn','api']) or 'json' in item.get('content_type',''):
                      print(json.dumps(item, ensure_ascii=False))

              await page.close()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox'])
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
                      locale='zh-CN',
                      viewport={'width': 1440, 'height': 900},
                  )
                  for label, url in TARGETS:
                      await inspect(context, label, url)
                  await browser.close()

          asyncio.run(main())
          PY
