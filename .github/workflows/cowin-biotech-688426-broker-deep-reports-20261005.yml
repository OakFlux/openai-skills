name: Build Cowin Biotech 688426 broker deep reports 20261005

on:
  push:
    paths:
      - '.github/workflows/cowin-biotech-688426-broker-deep-reports-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '688426'
          COMPANY = '康为世纪'
          FULL = '江苏康为世纪生物科技股份有限公司'
          TODAY = '2026-10-05'
          WORK = Path('cowin_broker_work')
          RAW = WORK / 'raw'
          FINAL = WORK / 'final'
          ART = Path('artifact_out')
          for p in (RAW, FINAL, ART):
              p.mkdir(parents=True, exist_ok=True)

          s = requests.Session()
          # Keep runner proxy enabled for reliable outbound access.
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/json,text/plain,application/pdf,*/*',
              'Referer': 'https://data.eastmoney.com/report/',
          })

          def clean(x: str) -> str:
              x = re.sub(r'<[^>]+>', '', str(x or ''))
              x = x.replace('：', ':').replace('，', ',').replace('（', '(').replace('）', ')')
              return re.sub(r'\s+', '', x).lower()

          def safe(x: str, n: int = 120) -> str:
              x = re.sub(r'[\\/:*?"<>|]+', '_', str(x or '')).strip(' ._')
              return x[:n] or 'report'

          def query_report_api(page: int) -> list[dict]:
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2022-01-01', 'endTime': TODAY,
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'code': CODE, 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              last = None
              for attempt in range(1, 5):
                  try:
                      r = s.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=(20, 120))
                      print('REPORT_API', page, attempt, r.status_code, len(r.content), r.url, flush=True)
                      r.raise_for_status()
                      j = r.json()
                      return j.get('data') or []
                  except Exception as exc:
                      last = exc
                      print('REPORT_API_ERR', page, attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'Report API failed: {last!r}')

          rows = []
          for page in range(1, 8):
              batch = query_report_api(page)
              rows.extend(batch)
              if len(batch) < 100:
                  break

          uniq = {}
          for row in rows:
              key = str(row.get('infoCode') or row.get('id') or json.dumps(row, ensure_ascii=False))
              uniq[key] = row
          rows = list(uniq.values())
          (WORK / 'eastmoney_metadata.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          print('REPORT_METADATA_COUNT', len(rows), flush=True)
          for row in rows:
              print('META', json.dumps({k: row.get(k) for k in ('infoCode','title','orgSName','publishDate','attachPages','stockName','stockCode')}, ensure_ascii=False), flush=True)

          target_specs = [
              {
                  'label': '东吴证券_分子检测全产业链布局',
                  'needles': ['分子检测全产业链布局', '幽门螺杆菌便检铸就第二成长曲线'],
                  'broker': '东吴',
              },
              {
                  'label': '方正证券_分子检测原料小龙头',
                  'needles': ['分子检测原料小龙头', '消化道检测是下一个发展蓝海'],
                  'broker': '方正',
              },
              {
                  'label': '开源证券_公司首次覆盖报告',
                  'needles': ['立足分子检测上游市场', '幽门螺杆菌检测产品有望打开公司高速成长曲线'],
                  'broker': '开源',
              },
          ]

          def row_score(row: dict, spec: dict) -> int:
              title = clean(row.get('title'))
              broker = clean(row.get('orgSName') or row.get('orgName'))
              score = 0
              for needle in spec['needles']:
                  n = clean(needle)
                  if n in title:
                      score += 80
                  else:
                      # Reward partial overlap by Chinese character bigrams.
                      pieces = [n[i:i+4] for i in range(0, max(1, len(n)-3), 3)]
                      score += sum(3 for p in pieces if p and p in title)
              if clean(spec['broker']) in broker:
                  score += 40
              pages = int(row.get('attachPages') or 0)
              score += min(pages, 50)
              return score

          candidates = []
          used_info = set()
          for spec in target_specs:
              ranked = sorted(rows, key=lambda r: row_score(r, spec), reverse=True)
              if ranked and row_score(ranked[0], spec) >= 50:
                  r = dict(ranked[0])
                  r['_label'] = spec['label']
                  r['_score'] = row_score(r, spec)
                  info = str(r.get('infoCode') or '')
                  if info and info not in used_info:
                      candidates.append(r)
                      used_info.add(info)

          # Fallback: add other long company research reports if an exact title was not found.
          if len(candidates) < 3:
              fallbacks = []
              for row in rows:
                  info = str(row.get('infoCode') or '')
                  if not info or info in used_info:
                      continue
                  title = clean(row.get('title'))
                  pages = int(row.get('attachPages') or 0)
                  broker = str(row.get('orgSName') or row.get('orgName') or '')
                  score = pages
                  if any(k in title for k in map(clean, ['深度', '首次覆盖', '公司研究', '成长曲线', '分子检测', '幽门螺杆菌'])):
                      score += 80
                  if any(k in title for k in map(clean, ['点评', '季报', '年报', '中报'])):
                      score -= 40
                  fallbacks.append((score, pages, row))
              for _, _, row in sorted(fallbacks, reverse=True, key=lambda x: (x[0], x[1])):
                  r = dict(row)
                  r['_label'] = f"{r.get('orgSName') or '券商'}_{r.get('title') or '公司研究'}"
                  candidates.append(r)
                  used_info.add(str(r.get('infoCode') or ''))
                  if len(candidates) >= 3:
                      break

          print('SELECTED_METADATA', json.dumps(candidates, ensure_ascii=False, indent=2), flush=True)
          if len(candidates) < 2:
              raise RuntimeError(f'Only {len(candidates)} candidate reports found')

          def download_pdf(info: str, target: Path) -> str:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_01.pdf',
              ]
              errors = []
              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          r = s.get(url, timeout=(25, 180), allow_redirects=True)
                          print('PDF_GET', info, attempt, r.status_code, len(r.content), url, 'FINAL', r.url, flush=True)
                          if r.status_code == 200 and len(r.content) > 100_000 and r.content.startswith(b'%PDF-'):
                              target.write_bytes(r.content)
                              return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(attempt)
              raise RuntimeError('No valid PDF for ' + info + '; ' + '; '.join(errors[-5:]))

          records = []
          seen_sha = set()
          valid = []
          for idx, row in enumerate(candidates, 1):
              info = str(row.get('infoCode') or '')
              title = str(row.get('title') or info).strip()
              broker = str(row.get('orgSName') or row.get('orgName') or '未知券商').strip()
              date = str(row.get('publishDate') or '')[:10]
              tmp = RAW / f'{idx:02d}_{info}.pdf'
              try:
                  source = download_pdf(info, tmp)
                  reader = PdfReader(str(tmp), strict=False)
                  pages = len(reader.pages)
                  text_parts = []
                  indices = list(range(min(15, pages)))
                  if pages > 18:
                      indices += list(range(max(0, pages - 3), pages))
                  for pno in dict.fromkeys(indices):
                      try:
                          text_parts.append(reader.pages[pno].extract_text() or '')
                      except Exception:
                          pass
                  sample = '\n'.join(text_parts)
                  identity = CODE in sample or COMPANY in sample or FULL in sample
                  research = any(k in sample for k in ['证券研究报告', '公司研究', '深度报告', '首次覆盖', '研究报告'])
                  if not identity:
                      raise RuntimeError('company identity check failed')
                  if pages < 10:
                      raise RuntimeError(f'report is too short: {pages} pages')
                  if not research:
                      print('WARN_RESEARCH_MARKER_NOT_FOUND', title, flush=True)
                  q = subprocess.run(['qpdf', '--check', str(tmp)], capture_output=True, text=True)
                  if q.returncode not in (0, 3):
                      raise RuntimeError('qpdf failed: ' + q.stderr[-1000:])
                  data = tmp.read_bytes()
                  sha = hashlib.sha256(data).hexdigest()
                  if sha in seen_sha:
                      raise RuntimeError('duplicate PDF')
                  seen_sha.add(sha)
                  valid.append({
                      'tmp': tmp, 'info_code': info, 'title': title, 'broker': broker,
                      'publish_date': date, 'pages': pages, 'bytes': len(data),
                      'sha256': sha, 'source_url': source, 'label': row.get('_label'),
                  })
                  print('VALID', json.dumps({k: valid[-1][k] for k in ('broker','title','publish_date','pages')}, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('CANDIDATE_FAILED', info, title, repr(exc), flush=True)
                  tmp.unlink(missing_ok=True)

          if len(valid) < 2:
              raise RuntimeError(f'Only {len(valid)} validated reports found')
          valid = valid[:3]

          package_name = f'康为世纪_688426_券商深度报告_{len(valid)}份'
          package_dir = FINAL / package_name
          package_dir.mkdir(parents=True, exist_ok=True)
          for idx, rec in enumerate(valid, 1):
              filename = f'{idx:02d}_{safe(rec["publish_date"])}_{safe(rec["broker"])}_{safe(rec["title"])}.pdf'
              shutil.copy2(rec['tmp'], package_dir / filename)
              rec['filename'] = filename
              rec.pop('tmp', None)

          readme = [
              f'{FULL}（{CODE}.SH，证券简称：{COMPANY}）券商深度报告合集',
              f'整理日期：{TODAY}',
              '',
              '筛选标准：优先收录完整公司深度报告或首次覆盖报告，排除数页季报/年报点评；尽量选择不同券商。',
              '',
              '文件清单：',
          ]
          for idx, rec in enumerate(valid, 1):
              readme += [
                  f'{idx}. {rec["filename"]}',
                  f'   券商：{rec["broker"]}',
                  f'   标题：{rec["title"]}',
                  f'   日期：{rec["publish_date"]}；页数：{rec["pages"]}',
                  f'   来源：{rec["source_url"]}',
                  f'   SHA-256：{rec["sha256"]}',
                  '',
              ]
          readme += ['完整性检查：已验证PDF文件头、公司名称/证券代码、实际页数、qpdf结构、重复文件及SHA-256；ZIP已完成CRC测试。']
          (package_dir / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (package_dir / 'manifest.json').write_text(json.dumps(valid, ensure_ascii=False, indent=2), encoding='utf-8')
          (package_dir / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in valid), encoding='utf-8')

          zip_path = ART / f'{package_name}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(package_dir.iterdir()):
                  zf.write(p, arcname=f'{package_name}/{p.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdf_count = sum(1 for name in zf.namelist() if name.lower().endswith('.pdf'))
              if pdf_count != len(valid):
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count} vs {len(valid)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_RECORDS', json.dumps(valid, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: cowin-biotech-688426-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
