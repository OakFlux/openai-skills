name: Discover Juneyao Airlines broker deep reports

on:
  push:
    branches: [tmp-juneyao-broker-reports-20261016-v2]
    paths: ['.github/workflows/tmp-juneyao-broker-discovery-20261016-v2.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query and filter public broker report index
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=603885' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=200&pageNo=1&beginTime=2018-01-01&endTime=2026-10-16&qType=0&code=603885&industryCode=*&orgCode=&author=&fields=' \
            -o reports.jsonp
          python3 - <<'PY'
          import json, re
          text = open('reports.jsonp', encoding='utf-8').read()
          payload = json.loads(re.sub(r'^datatable\(|\)$', '', text))
          rows = payload.get('data') or []
          print('TOTAL', len(rows))
          # Prefer full company deep/initiating reports and exclude routine result commentaries.
          deep_markers = ('深度', '首次覆盖', '公司研究', '专题', '价值', '航空', '枢纽', '国际', '成长')
          exclude = ('点评', '季报', '中报', '年报', '业绩', '快报', '预告', '月度')
          selected = []
          for r in rows:
              title = r.get('title') or ''
              pages = int(r.get('attachPages') or 0)
              column = str(r.get('column') or '')
              if pages >= 15 and (column.startswith('002004001') or any(x in title for x in deep_markers)) and not any(x in title for x in exclude):
                  selected.append(r)
          selected.sort(key=lambda r: r.get('publishDate') or '', reverse=True)
          for r in selected[:30]:
              print('\t'.join([
                  str(r.get('publishDate',''))[:10],
                  str(r.get('orgSName') or r.get('orgName') or ''),
                  str(r.get('attachPages') or ''),
                  str(r.get('infoCode') or ''),
                  str(r.get('title') or ''),
              ]))
          PY
