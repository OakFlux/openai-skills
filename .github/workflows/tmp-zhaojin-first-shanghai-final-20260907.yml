name: Build complete First Shanghai Zhaojin report PDF

on:
  push:
    branches:
      - tmp-zhaojin-first-shanghai-final-20260907

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow img2pdf pypdf pymupdf

      - name: Download all pages and build PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/pages output/render
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          from pathlib import Path

          import img2pdf
          import pymupdf
          import requests
          from PIL import Image
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          output = Path('output')
          pages_dir = output / 'pages'
          base = 'https://oss.sdyanbao.com/page/2024/7/2/1030510'
          page_count = 15

          retry = Retry(total=6, connect=6, read=6, status=6, backoff_factor=1.0,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=frozenset(['GET']))
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          page_paths = []
          page_hashes = []
          page_info = []

          for index in range(page_count):
              url = f'{base}/{index}.png'
              response = session.get(
                  url,
                  headers={'Referer': base, 'Accept': 'image/png,image/*,*/*;q=0.8'},
                  timeout=(30, 180),
              )
              response.raise_for_status()
              data = response.content
              if len(data) < 8000:
                  raise RuntimeError(f'Page {index + 1} too small: {len(data)} bytes')
              with Image.open(io.BytesIO(data)) as image:
                  image.verify()
              with Image.open(io.BytesIO(data)) as image:
                  width, height = image.size
                  fmt = image.format
              if width < 600 or height < 600:
                  raise RuntimeError(f'Page {index + 1} unexpected dimensions: {width}x{height}')
              digest = hashlib.sha256(data).hexdigest()
              page_path = pages_dir / f'{index + 1:03d}.png'
              page_path.write_bytes(data)
              page_paths.append(page_path)
              page_hashes.append(digest)
              page_info.append({
                  'page': index + 1,
                  'bytes': len(data),
                  'width': width,
                  'height': height,
                  'format': fmt,
                  'sha256': digest,
              })
              print('PAGE_OK', index + 1, len(data), width, height, fmt, digest[:12], flush=True)

          if len(set(page_hashes)) != page_count:
              raise RuntimeError('Duplicate pages detected.')

          extra = session.get(
              f'{base}/{page_count}.png',
              headers={'Referer': base, 'Accept': 'image/png,image/*,*/*;q=0.8'},
              timeout=(30, 180),
          )
          if extra.status_code != 404:
              raise RuntimeError(f'Unexpected page 16 status: {extra.status_code}')

          pdf_path = output / '2024-06-24_First_Shanghai_Zhaojin_Mining_Initiation_15_pages.pdf'
          pdf_path.write_bytes(img2pdf.convert([str(path) for path in page_paths]))
          pdf_data = pdf_path.read_bytes()
          if not pdf_data.startswith(b'%PDF'):
              raise RuntimeError('Generated output is not PDF.')
          reader = PdfReader(io.BytesIO(pdf_data), strict=False)
          actual_pages = len(reader.pages)
          if actual_pages != page_count:
              raise RuntimeError(f'PDF page count mismatch: {actual_pages}')

          document = pymupdf.open(pdf_path)
          for page_number in [0, actual_pages - 1]:
              pixmap = document[page_number].get_pixmap(matrix=pymupdf.Matrix(1.25, 1.25), alpha=False)
              pixmap.save(str(output / 'render' / f'page_{page_number + 1:02d}.png'))
          document.close()

          result = {
              'ok': True,
              'broker': '第一上海证券',
              'date': '2024-06-24',
              'title': '招金矿业：黄金行业优质高成长公司，增长潜力巨大，目标价17.46港元',
              'page_count': actual_pages,
              'pdf_bytes': len(pdf_data),
              'pdf_sha256': hashlib.sha256(pdf_data).hexdigest(),
              'source': base,
              'extra_page_status': extra.status_code,
              'page_info': page_info,
          }
          (output / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PDF_OK', json.dumps({k: result[k] for k in ['ok','broker','date','title','page_count','pdf_bytes','pdf_sha256']}, ensure_ascii=False), flush=True)
          PY

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-shanghai-zhaojin-complete-report
          path: |
            output/2024-06-24_First_Shanghai_Zhaojin_Mining_Initiation_15_pages.pdf
            output/result.json
            output/render/*.png
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
