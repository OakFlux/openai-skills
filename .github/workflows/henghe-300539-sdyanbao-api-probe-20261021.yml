name: Probe Sdyanbao API for Henghe reports

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-sdyanbao-api-probe-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect JS call signatures and probe APIs
        run: |
          python - <<'PY'
          import json,re,requests
          from urllib.parse import urljoin

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','Accept':'application/json,text/plain,*/*'})
          js_url='https://www.sdyanbao.com/_nuxt/a94fdf1.js'
          r=s.get(js_url,timeout=60); r.raise_for_status(); text=r.text
          print('JS_LEN',len(text))
          for needle in ['/api/file/search','/api/file/detail','/api/file/download','api.sdyanbao.com']:
            print('\nNEEDLE',needle)
            starts=[m.start() for m in re.finditer(re.escape(needle),text)]
            print('COUNT',len(starts))
            for pos in starts[:20]: print(text[max(0,pos-2500):pos+4000])

          base='https://api.sdyanbao.com'
          def call(method,path,*,params=None,data=None,json_body=None,headers=None):
            try:
              rr=s.request(method,base+path,params=params,data=data,json=json_body,headers=headers,timeout=60)
              print('\nCALL',method,path,'STATUS',rr.status_code,'LEN',len(rr.content),'CTYPE',rr.headers.get('content-type'),'URL',rr.url)
              print('RESP_HEADERS',json.dumps(dict(rr.headers),ensure_ascii=False))
              print('BODY',rr.text[:15000])
              return rr
            except Exception as e:
              print('CALL_ERROR',method,path,repr(e)); return None

          # Known public detail to infer schema.
          for method in ['GET','POST']:
            call(method,'/api/file/detail',params={'id':'931897'} if method=='GET' else None,json_body={'id':931897} if method=='POST' else None,data={'id':'931897'} if method=='POST' else None)
          # Search parameter variants, GET and POST.
          variants=[
            {'keyword':'横河精密','page':1,'pageSize':100},
            {'searchKey':'横河精密','page':1,'pageSize':100},
            {'key':'横河精密','page':1,'pageSize':100},
            {'name':'横河精密','page':1,'pageSize':100},
            {'keyword':'优质精密制造企业 新能源汽车结构件打开成长空间','page':1,'pageSize':100},
            {'keyword':'横河模具','page':1,'pageSize':100},
            {'keyword':'300539','page':1,'pageSize':100},
          ]
          for v in variants:
            call('GET','/api/file/search',params=v)
            call('POST','/api/file/search',json_body=v)
            call('POST','/api/file/search',data=v)
          # Download known file to determine public/auth behavior.
          for payload in ({'id':931897},{'fid':931897},{'fileId':931897}):
            call('GET','/api/file/download',params=payload)
            call('POST','/api/file/download',json_body=payload)
            call('POST','/api/file/download',data=payload)
          PY
