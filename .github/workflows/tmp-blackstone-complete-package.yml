name: Temporary complete Blackstone broker report package

on:
  push:
    branches:
      - tmp/blackstone-broker-reports-20260829
    paths:
      - .github/workflows/tmp-blackstone-complete-package.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests Pillow img2pdf PyMuPDF
      - name: Download, assemble, verify, and package
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import pymupdf
          import requests
          from PIL import Image

          root = Path('blackstone_complete')
          package = root / 'Blackstone_Broker_Reports_3'
          work = root / '_work'
          verify = root / 'verification'
          for p in [package, work, verify]:
              p.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'index': 1,
                  'kind': 'direct_pdf',
                  'broker': '国信证券',
                  'date': '2022-08-22',
                  'title': '财富管理行业专题：黑石集团——另类投资领头羊',
                  'pages': 24,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202208231577500547_1.pdf',
                  'filename': '01_Guosen_Securities_2022-08-22_Blackstone_Alternative_Investment_Leader_24p.pdf',
                  'format': '券商公开原始PDF',
              },
              {
                  'index': 2,
                  'kind': 'page_images',
                  'broker': '东方证券',
                  'date': '2023-05-07',
                  'title': '黑石集团1Q2023业绩点评：管理费稳健／业绩报酬承压，困难时期重点关注AUM增长与募资／投放进度',
                  'pages': 9,
                  'base': 'https://oss.sdyanbao.com/page/2023/5/7/536541',
                  'filename': '02_Orient_Securities_2023-05-07_Blackstone_1Q2023_Results_9p.pdf',
                  'format': '公开完整高清页面按原页序合成PDF',
              },
              {
                  'index': 3,
                  'kind': 'page_images',
                  'broker': 'Goldman Sachs',
                  'date': '2022-07-22',
                  'title': 'Blackstone Group (BX): Premium FRE growth to support premium valuation; fundraising dynamics remain robust',
                  'pages': 12,
                  'base': 'https://oss.sdyanbao.com/page/2022/8/4/331972',
                  'filename': '03_Goldman_Sachs_2022-07-22_Blackstone_Premium_FRE_Growth_12p.pdf',
                  'format': '公开完整高清页面按原页序合成PDF',
              },
          ]

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          def fetch(url: str, *, referer: str, accept: str, min_bytes: int) -> bytes:
              last = None
              for attempt in range(1, 7):
                  try:
                      r = s.get(url, timeout=90, headers={'Referer': referer, 'Accept': accept})
                      if r.status_code != 200:
                          raise RuntimeError(f'HTTP {r.status_code}')
                      if len(r.content) < min_bytes:
                          raise RuntimeError(f'payload too small: {len(r.content)}')
                      return r.content
                  except Exception as exc:
                      last = exc
                      time.sleep(min(attempt * 1.3, 6))
              raise RuntimeError(f'failed to fetch {url}: {last!r}')

          def build_image_pdf(report: dict) -> Path:
              page_dir = work / Path(report['filename']).stem
              page_dir.mkdir(exist_ok=True)
              image_paths = []
              for idx in range(report['pages']):
                  url = f"{report['base']}/{idx}.png"
                  data = fetch(url, referer='https://www.sdyanbao.com/', accept='image/*,*/*;q=0.8', min_bytes=10_000)
                  with Image.open(io.BytesIO(data)) as im:
                      im.load()
                      if im.width < 700 or im.height < 900:
                          raise RuntimeError(f"invalid page image {idx+1}: {im.width}x{im.height}")
                      if im.mode not in ('RGB', 'L'):
                          im = im.convert('RGB')
                      path = page_dir / f'{idx+1:03d}.png'
                      im.save(path, format='PNG', optimize=False)
                      image_paths.append(path)
                  print(f"{report['broker']} page {idx+1}/{report['pages']} downloaded")
              out = package / report['filename']
              with out.open('wb') as f:
                  f.write(img2pdf.convert([str(p) for p in image_paths]))
              return out

          def validate(path: Path, report: dict) -> dict:
              data = path.read_bytes()
              if not data.startswith(b'%PDF'):
                  raise RuntimeError(f'bad PDF header: {path}')
              doc = pymupdf.open(str(path))
              if doc.page_count != report['pages']:
                  raise RuntimeError(f"page count mismatch for {path}: {doc.page_count} vs {report['pages']}")
              samples = []
              extracted = []
              for page_no in sorted(set([1, (doc.page_count + 1)//2, doc.page_count])):
                  page = doc.load_page(page_no - 1)
                  extracted.append(page.get_text('text'))
                  pix = page.get_pixmap(matrix=pymupdf.Matrix(0.55, 0.55), alpha=False)
                  png = verify / f"{report['index']:02d}_page_{page_no}.png"
                  pix.save(str(png))
                  samples.append(str(png))
              encrypted = bool(doc.needs_pass)
              doc.close()
              return {
                  'pages': report['pages'],
                  'size_bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'encrypted': encrypted,
                  'rendered_samples': samples,
                  'sample_text_chars': len(re.sub(r'\s+', '', ''.join(extracted))),
              }

          manifest = []
          for report in reports:
              if report['kind'] == 'direct_pdf':
                  data = fetch(report['url'], referer='https://data.eastmoney.com/', accept='application/pdf,*/*;q=0.8', min_bytes=50_000)
                  path = package / report['filename']
                  path.write_bytes(data)
              else:
                  path = build_image_pdf(report)
              check = validate(path, report)
              item = {
                  'index': report['index'],
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'pages': report['pages'],
                  'filename': report['filename'],
                  'format': report['format'],
                  'validation': check,
              }
              manifest.append(item)
              print('VALID', json.dumps(item, ensure_ascii=False))

          readme = [
              '黑石集团（NYSE: BX）券商／投行研究报告，共3份',
              '',
              '压缩包内直接包含3份PDF，不含网页快捷方式或下载脚本。',
              '国信证券为券商公开原始PDF；东方证券与高盛报告由公开完整高清页面按原页序合成。',
              '',
          ]
          for item in manifest:
              readme.extend([
                  f"{item['index']}. {item['broker']}｜{item['date']}｜{item['pages']}页",
                  f"   {item['title']}",
                  f"   文件：{item['filename']}",
                  f"   形式：{item['format']}",
                  f"   SHA-256：{item['validation']['sha256']}",
                  '',
              ])
          (package / 'README_CN.txt').write_text('\n'.join(readme), encoding='utf-8')
          (package / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (package / 'SHA256SUMS.txt').write_text('\n'.join(
              f"{item['validation']['sha256']}  {item['filename']}" for item in manifest
          ) + '\n', encoding='utf-8')

          zip_path = root / 'Blackstone_Broker_Reports_3.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for file in sorted(package.iterdir()):
                  zf.write(file, arcname=file.name)
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              names = zf.namelist()
              if sum(n.lower().endswith('.pdf') for n in names) != 3:
                  raise RuntimeError(f'ZIP PDF count is not 3: {names}')

          summary = {
              'zip_file': zip_path.name,
              'zip_size_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'reports': manifest,
          }
          (root / 'build_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('SUMMARY', json.dumps(summary, ensure_ascii=False))
          PY
      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: blackstone-broker-reports-complete
          path: blackstone_complete/Blackstone_Broker_Reports_3.zip
          retention-days: 1
          if-no-files-found: error
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: blackstone-broker-reports-complete-verification
          path: |
            blackstone_complete/build_summary.json
            blackstone_complete/verification/
          retention-days: 1
          if-no-files-found: error
