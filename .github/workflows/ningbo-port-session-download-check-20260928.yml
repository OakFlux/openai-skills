name: Check public report session download 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-session-download-check-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install
        run: python -m pip install --quiet requests
      - name: Check public report files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          out=Path('check_out'); out.mkdir()
          docs=[
            ('118940','report/2017/10/10/118940.pdf'),
            ('1690672','report/2013/02/04/1690672.pdf'),
            ('1608827','report/2010/09/15/1608827.pdf'),
            ('2938297','report/2021/12/05/2938297.pdf'),
          ]
          records=[]
          for did,path in docs:
              for page in [f'https://www.fxbaogao.com/view?id={did}',f'https://www.fxbaogao.com/detail/{did}']:
                  s=requests.Session(); s.trust_env=False
                  headers={
                    'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                    'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
                    'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  }
                  try:
                      pr=s.get(page,headers=headers,timeout=(15,60),allow_redirects=True)
                      print('PAGE',did,pr.status_code,len(pr.content),pr.url,'COOKIES',s.cookies.get_dict(),flush=True)
                  except Exception as e:
                      print('PAGE_ERR',did,page,repr(e),flush=True); continue
                  variants=[
                    f'https://dr.fxbaogao.com/{path}',
                    f'https://dr.fxbaogao.com/{path}?download=1',
                    f'https://report.fxbaogao.com/{path}',
                  ]
                  for u in variants:
                      h={
                        'User-Agent':headers['User-Agent'],
                        'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                        'Accept-Language':headers['Accept-Language'],
                        'Referer':page,
                        'Origin':'https://www.fxbaogao.com',
                        'Sec-Fetch-Dest':'document',
                        'Sec-Fetch-Mode':'navigate',
                        'Sec-Fetch-Site':'same-site',
                        'Upgrade-Insecure-Requests':'1',
                      }
                      try:
                        r=s.get(u,headers=h,timeout=(15,90),allow_redirects=True)
                        rec={'doc':did,'page':page,'url':u,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'final':r.url,'headers':dict(r.headers),'body_prefix':r.content[:300].decode('utf-8','replace')}
                        records.append(rec)
                        print('FILE',json.dumps(rec,ensure_ascii=False)[:5000],flush=True)
                        if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                            (out/f'{did}.pdf').write_bytes(r.content)
                            print('FOUND',did,len(r.content),flush=True)
                            break
                      except Exception as e:
                        print('FILE_ERR',did,u,repr(e),flush=True)
                  if (out/f'{did}.pdf').exists(): break
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-session-download-check
          path: check_out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
