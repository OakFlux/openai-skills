name: Probe Sina Ascletis report archive
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/probe-sina-ascletis-ids.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_sina_ascletis_ids.py
      - uses: actions/upload-artifact@v4
        with:
          name: sina-ascletis-report-probe
          path: |
            sina_ascletis_probe.json
            sina_ascletis_probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
