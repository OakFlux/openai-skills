name: Probe Shanghai Jiubai related report pages

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-fxbaogao-probe-20261021.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml pillow
      - name: Inspect reports and page images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse,io
          from bs4 import BeautifulSoup
          from PIL import Image
          ids=['3160542','3195008']
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://www.fxbaogao.com/'}
          for rid in ids:
            url=f'https://www.fxbaogao.com/detail/{rid}'
            print('\nDETAIL',rid,url)
            r=s.get(url,headers=h,timeout=(20,150));print('STATUS',r.status_code,'BYTES',len(r.content),'CT',r.headers.get('content-type'))
            text=r.text
            patterns=[
              rf'https://public\.fxbaogao\.com/report-image/[^"\'\s<>]+/{rid}-1\.(?:png|jpg|jpeg)',
              rf'https://public\.fxbaogao\.com/report-image/[^"\'\s<>]*{rid}-1\.(?:png|jpg|jpeg)'
            ]
            first=None
            for pat in patterns:
              m=re.search(pat,text,re.I)
              if m:first=html.unescape(m.group(0));break
            if not first:
              soup=BeautifulSoup(text,'lxml')
              for tag in soup.find_all(['img','a']):
                for a in ['src','data-src','href']:
                  v=tag.get(a)
                  if v and rid+'-1.' in v and 'report-image' in v:first=urllib.parse.urljoin(r.url,v);break
                if first:break
            print('FIRST',first)
            for key in ['pageCount','page_count','totalPage','pages','页']:
              for m in list(re.finditer(key,text,re.I))[:5]:
                print('CTX',key,text[max(0,m.start()-100):m.end()+180].replace('\n',' ')[:400])
            if first:
              for n in range(1,8):
                u=re.sub(r'-1\.(png|jpg|jpeg)(?:\?.*)?$',rf'-{n}.\1',first,flags=re.I)
                rr=s.get(u,headers={**h,'Referer':url,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'},timeout=(15,90))
                ok=False;dim=None;fmt=None
                if rr.status_code==200 and len(rr.content)>1000:
                  try:
                    im=Image.open(io.BytesIO(rr.content));dim=im.size;fmt=im.format;im.verify();ok=True
                  except Exception:pass
                print('PAGE',n,rr.status_code,len(rr.content),rr.headers.get('content-type'),ok,fmt,dim,u)
          PY
