name: Retry Hegang broker report API query

on:
  push:
    branches: [tmp-hegang-000709-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hegang-broker-code-v2-20261016.yml']

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query reports with normalized dates
        run: |
          curl --http1.1 -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=000709' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable1&industryCode=*&pageSize=100&industry=*&rating=*&ratingChange=*&beginTime=20100101&endTime=20300101&pageNo=1&p=1&pageNum=1&pageNumber=1&fields=&qType=0&orgCode=&code=000709&rcode=' \
            -o reports.jsonp
          python3 - <<'PY'
          import json,re
          text=open('reports.jsonp',encoding='utf-8').read()
          data=json.loads(re.sub(r'^datatable\d*\(|\)$','',text))
          rows=data.get('data') or []
          print('HITS',data.get('hits'),'SIZE',data.get('size'),'ROWS',len(rows))
          rows.sort(key=lambda x:x.get('publishDate') or '',reverse=True)
          for x in rows:
              print(str(x.get('publishDate',''))[:10],x.get('orgSName') or x.get('orgName'),x.get('attachPages'),x.get('infoCode'),x.get('stockCode'),x.get('stockName'),x.get('title'))
          PY
