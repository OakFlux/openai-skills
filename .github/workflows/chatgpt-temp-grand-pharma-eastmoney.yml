name: chatgpt-temp-grand-pharma-eastmoney

on:
  push:
    branches:
      - chatgpt-temp-grand-pharma-eastmoney-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query report API and fetch original PDFs
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python <<'PY'
          import requests, json, re, os, hashlib, zipfile, time
          from pypdf import PdfReader
          os.makedirs('out/pdfs', exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          log=[]; rec=[]
          def L(x): print(x); log.append(str(x))
          def parse(t):
              a=t.find('{'); b=t.rfind('}')
              return json.loads(t[a:b+1]) if a>=0 and b>a else None
          for qtype in [0,1,2]:
            for code in ['00512','0512','00512.HK','HK00512']:
              p={'cb':'jQuery'+str(int(time.time()*1000)),'pageSize':500,'pageNo':1,'qType':qtype,'stockCode':code,'beginTime':'2020-01-01','endTime':'2026-09-05','fields':'','orgCode':'','author':'','industryCode':'*','industry':'*','rating':'','ratingChange':''}
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=12)
                L(f'{qtype=} {code=} status={r.status_code} size={len(r.content)} url={r.url}')
                open(f'out/api_{qtype}_{re.sub("[^A-Za-z0-9]","_",code)}.txt','wb').write(r.content)
                if r.ok:
                  o=parse(r.text) or {}; d=o.get('data') or []
                  if isinstance(d,dict): d=d.get('data') or d.get('list') or []
                  for x in d if isinstance(d,list) else []:
                    if isinstance(x,dict):
                      txt=json.dumps(x,ensure_ascii=False)
                      if '远大医药' in txt or 'Grand Pharma' in txt or str(x.get('stockCode','')) in ['00512','0512']:
                        rec.append(x)
              except Exception as e: L(f'ERR {qtype=} {code=} {e!r}')
          uniq=[]; seen=set()
          for x in rec:
            k=x.get('infoCode') or x.get('title') or json.dumps(x,sort_keys=True,ensure_ascii=False)
            if k not in seen: seen.add(k); uniq.append(x)
          rec=uniq
          open('out/records.json','w',encoding='utf-8').write(json.dumps(rec,ensure_ascii=False,indent=2))
          L(f'records={len(rec)}')
          got=[]
          for x in rec:
            info=x.get('infoCode') or x.get('INFO_CODE')
            title=x.get('title') or x.get('TITLE') or '远大医药研究报告'
            org=x.get('orgSName') or x.get('orgName') or x.get('ORG_SNAME') or ''
            date=str(x.get('publishDate') or x.get('PUBLIC_DATE') or '')[:10]
            if not info: continue
            for url in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf']:
              try:
                r=s.get(url,timeout=20,allow_redirects=True)
                L(f'PDF {r.status_code} {len(r.content)} {url}')
                if r.ok and r.content[:5]==b'%PDF-' and len(r.content)>30000:
                  fn=re.sub(r'[\\/:*?"<>|]+','_',f'{date}_{org}_{title}')[:180]+'.pdf'
                  path='out/pdfs/'+fn; open(path,'wb').write(r.content)
                  try: pages=len(PdfReader(path).pages)
                  except Exception: pages=-1
                  got.append({'path':path,'title':title,'org':org,'date':date,'pages':pages,'size':len(r.content),'url':url,'sha256':hashlib.sha256(r.content).hexdigest()})
                  break
              except Exception as e: L(f'PDFERR {url} {e!r}')
          open('out/downloaded.json','w',encoding='utf-8').write(json.dumps(got,ensure_ascii=False,indent=2))
          open('out/run.log','w',encoding='utf-8').write('\n'.join(log))
          L(f'valid_pdfs={len(got)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Grand-Pharma-Eastmoney-Fetch
          path: out
          retention-days: 1
