name: Build Sunrain broker company-report package

on:
  push:
    branches: [tmp-sunrain-broker-reports-20261021]
    paths: ['.github/workflows/tmp-sunrain-broker-package-20261021.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='日出东方_券商公司研究报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local expected_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 7 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=603366' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -eq "$expected_pages"

            pdftotext -f 1 -l "$pages" "$out" "$out.txt" 2>/dev/null
            grep -Eq '日出东方控股股份有限公司|日出东方太阳能股份有限公司|日出东方' "$out.txt"
            grep -Eq '信达证券|CINDA SECURITIES|信达' "$out.txt"
            rm -f "$out.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$out" "$out.last" >/dev/null 2>&1
            test -s "$out.first.png" && test -s "$out.last.png"
            rm -f "$out.first.png" "$out.last.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202304271585928070_1.pdf' \
            "$PACKAGE/01_日出东方_603366_信达证券_Q1收入稳健增长期待空气能业务放量_全文_2023-04-27.pdf" \
            6

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202308161594836740_1.pdf' \
            "$PACKAGE/02_日出东方_603366_信达证券_Q2盈利能力大幅改善推动清洁能源业务快速发展_全文_2023-08-16.pdf" \
            5

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202310281605631904_1.pdf' \
            "$PACKAGE/03_日出东方_603366_信达证券_Q3盈利能力改善采暖业务贡献增量_全文_2023-10-29.pdf" \
            5

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('日出东方_券商公司研究报告_3份')
          meta = {
              '01_日出东方_603366_信达证券_Q1收入稳健增长期待空气能业务放量_全文_2023-04-27.pdf': {
                  'broker': '信达证券',
                  'date': '2023-04-27',
                  'title': 'Q1收入稳健增长，期待空气能业务放量',
                  'type': '公司跟踪/业绩点评报告',
                  'index': 'AP202304271585928070',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202304271585928070_1.pdf',
              },
              '02_日出东方_603366_信达证券_Q2盈利能力大幅改善推动清洁能源业务快速发展_全文_2023-08-16.pdf': {
                  'broker': '信达证券',
                  'date': '2023-08-16',
                  'title': 'Q2盈利能力大幅改善，推动清洁能源业务快速发展',
                  'type': '公司跟踪/中报点评报告',
                  'index': 'AP202308161594836740',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202308161594836740_1.pdf',
              },
              '03_日出东方_603366_信达证券_Q3盈利能力改善采暖业务贡献增量_全文_2023-10-29.pdf': {
                  'broker': '信达证券',
                  'date': '2023-10-29',
                  'title': 'Q3盈利能力改善，采暖业务贡献增量',
                  'type': '公司跟踪/三季报点评报告',
                  'index': 'AP202310281605631904',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202310281605631904_1.pdf',
              },
          }
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '日出东方（603366）券商公司研究报告资料包',
              '整理日期：2026-10-21',
              '',
              '收录说明：',
              '1. 公开个股研报索引共列出6份日出东方券商公司报告，均为4—6页，没有10页以上的长篇公司深度/首次覆盖报告。',
              '2. 本包选取其中页数最多、时间较新且内容连续的3份完整公司跟踪报告。',
              '3. 排除网页摘要、非券商材料和无法直接下载校验的文件。',
              '4. 三份文件均为公开渠道直接下载的券商原始PDF，仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  PDF来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、精确页数、正文公司名称、券商名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Sunrain-603366-broker-company-reports-3
          path: 日出东方_券商公司研究报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
