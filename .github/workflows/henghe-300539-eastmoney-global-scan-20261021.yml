name: Scan Eastmoney global index for Henghe reports

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-eastmoney-global-scan-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Scan report API
        run: |
          python - <<'PY'
          import json, time, requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          API='https://reportapi.eastmoney.com/report/list'
          s=requests.Session()
          retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=.8,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})

          windows=[
            ('2026-05-09','2026-05-13'),
            ('2025-12-26','2025-12-30'),
            ('2025-10-08','2025-10-12'),
            ('2025-09-04','2025-09-08'),
            ('2025-08-31','2025-09-04'),
            ('2025-05-18','2025-05-22'),
            ('2024-03-07','2024-03-11'),
            ('2023-10-24','2023-10-28'),
            ('2023-06-18','2023-06-22'),
            ('2017-05-21','2017-05-25'),
            ('2016-08-16','2016-08-20'),
          ]
          qtypes=['0','1','2']
          variants=[
            {'code':'','stockCode':'','stockName':'','searchKey':''},
            {'code':'300539','stockCode':'','stockName':'','searchKey':''},
            {'code':'','stockCode':'300539','stockName':'','searchKey':''},
            {'code':'','stockCode':'','stockName':'横河精密','searchKey':''},
            {'code':'','stockCode':'','stockName':'横河模具','searchKey':''},
            {'code':'','stockCode':'','stockName':'','searchKey':'横河精密'},
            {'code':'','stockCode':'','stockName':'','searchKey':'横河模具'},
          ]
          matches={}
          for begin,end in windows:
            for qtype in qtypes:
              # First scan global index for this narrow date window.
              for page in range(1,31):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(API,params=params,timeout=60)
                  print('GLOBAL',begin,end,'q',qtype,'page',page,'status',r.status_code,'len',len(r.content))
                  r.raise_for_status(); data=r.json(); rows=data.get('data') or []
                  if page==1: print('META',json.dumps({'begin':begin,'end':end,'qType':qtype,'hits':data.get('hits'),'size':data.get('size'),'rows':len(rows)},ensure_ascii=False))
                  for x in rows:
                    blob=' '.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName'))
                    if any(k in blob for k in ('横河精密','横河模具','300539')):
                      info=str(x.get('infoCode') or '')
                      matches[info]=x
                      print('MATCH_GLOBAL',json.dumps(x,ensure_ascii=False))
                  hits=int(data.get('hits') or 0)
                  if not rows or page*100>=hits: break
                  time.sleep(.15)
                except Exception as e:
                  print('GLOBAL_ERROR',begin,end,qtype,page,repr(e)); break

              # Probe alternate parameter names only on page 1.
              for extra in variants[1:]:
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','code':extra['code'],'rcode':'','p':'1','pageNum':'1','pageNumber':'1','stockCode':extra['stockCode'],'stockName':extra['stockName'],'searchKey':extra['searchKey']}
                try:
                  r=s.get(API,params=params,timeout=45); data=r.json(); rows=data.get('data') or []
                  if rows or data.get('hits'):
                    print('VARIANT_META',json.dumps({'begin':begin,'end':end,'qType':qtype,'extra':extra,'hits':data.get('hits'),'rows':len(rows)},ensure_ascii=False))
                  for x in rows:
                    blob=' '.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName'))
                    if any(k in blob for k in ('横河精密','横河模具','300539')):
                      info=str(x.get('infoCode') or '')
                      matches[info]=x
                      print('MATCH_VARIANT',json.dumps(x,ensure_ascii=False))
                except Exception as e: print('VARIANT_ERROR',begin,end,qtype,extra,repr(e))
              time.sleep(.2)
          print('FINAL_MATCH_COUNT',len(matches))
          for info,x in matches.items():
            print('FINAL_MATCH',info,json.dumps(x,ensure_ascii=False))
            print('PDF_CANDIDATE',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf')
          PY
