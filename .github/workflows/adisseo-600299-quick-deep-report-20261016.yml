name: Quick fetch Adisseo 600299 deep report 20261016

on:
  push:
    paths:
      - '.github/workflows/adisseo-600299-quick-deep-report-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Query exact reports and download long PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('adisseo_quick_deep'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          s.headers.update({'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=600299','Accept':'application/json,text/plain,*/*'})
          api='https://reportapi.eastmoney.com/report/list'
          rows=[]; logs=[]; seen=set()
          cases=[
            {'code':'600299','qType':'0','beginTime':'2025-08-01','endTime':'2025-11-15'},
            {'code':'600299','qType':'0','beginTime':'2020-03-01','endTime':'2020-06-30'},
            {'code':'600299','qType':'0','beginTime':'2019-01-01','endTime':'2026-10-16'},
            {'code':'600299','qType':'1','beginTime':'2019-01-01','endTime':'2026-10-16'},
            {'code':'600299','qType':'2','beginTime':'2019-01-01','endTime':'2026-10-16'},
          ]
          for case in cases:
            params={'pageSize':'100','pageNo':'1','p':'1','pageNum':'1','pageNumber':'1','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','fields':'','orgCode':'','author':'','rcode':'',**case}
            r=s.get(api,params=params,timeout=(20,120))
            logs.append({'params':params,'status':r.status_code,'bytes':len(r.content),'url':r.url,'prefix':r.text[:300]})
            if r.status_code!=200: continue
            try: data=r.json()
            except Exception:
              m=re.search(r'^[^(]*\((.*)\)\s*;?$',r.text,re.S)
              data=json.loads(m.group(1)) if m else None
            if not data: continue
            cand=[]
            if isinstance(data,list): cand=data
            elif isinstance(data,dict):
              for key in ['data','result','list','rows']:
                v=data.get(key)
                if isinstance(v,list): cand.extend(v)
                elif isinstance(v,dict):
                  for k2 in ['data','list','rows']:
                    vv=v.get(k2)
                    if isinstance(vv,list): cand.extend(vv)
            for row in cand:
              if not isinstance(row,dict): continue
              code=str(row.get('infoCode') or row.get('info_code') or row.get('reportCode') or row.get('rcode') or '')
              key=code or json.dumps(row,ensure_ascii=False,sort_keys=True)
              if key in seen: continue
              seen.add(key); rows.append(row)
          (out/'requests.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'rows.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')

          def get(row,*keys):
            for k in keys:
              v=row.get(k)
              if v not in (None,''): return str(v)
            return ''
          def comp(x): return re.sub(r'\s+','',str(x or ''))
          ranked=[]
          for row in rows:
            title=get(row,'title','reportTitle','reportName'); ct=comp(title)
            stock=get(row,'stockCode','stock_code'); name=get(row,'stockName','stock_name')
            if stock!='600299' and '安迪苏' not in name and '安迪苏' not in title: continue
            pages_s=get(row,'attachPages','pages','pageCount')
            try: pages=int(float(pages_s)) if pages_s else 0
            except: pages=0
            score=pages*10
            for k,v in [('全球蛋氨酸行业龙头',1000),('特种产品蓬勃发展',800),('蛋氨酸拐点在即',700),('VA高景气周期',600)]:
              if k in ct: score+=v
            if '东吴' in get(row,'orgSName','orgName'): score+=100
            ranked.append((score,pages,row))
          ranked.sort(key=lambda x:(x[0],x[1]),reverse=True)
          (out/'ranked.json').write_text(json.dumps([{'score':a,'pages':b,'row':c} for a,b,c in ranked],ensure_ascii=False,indent=2),encoding='utf-8')
          print('RANKED',json.dumps([{'score':a,'pages':b,'title':get(c,'title'),'broker':get(c,'orgSName','orgName'),'date':get(c,'publishDate'),'infoCode':get(c,'infoCode')} for a,b,c in ranked[:20]],ensure_ascii=False,indent=2),flush=True)
          if not ranked: raise RuntimeError('No exact-stock report rows')

          selected=None; failures=[]
          for score,index_pages,row in ranked:
            code=get(row,'infoCode','info_code','reportCode','rcode'); title=get(row,'title','reportTitle','reportName')
            if not code or (index_pages and index_pages<15 and score<600): continue
            detail=f'https://data.eastmoney.com/report/info/{code}.html'
            for prefix in ['H3','H2','H1','H4']:
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
              try:
                rr=s.get(url,timeout=(25,180),headers={'User-Agent':ua,'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'})
                if rr.status_code!=200 or rr.content[:5]!=b'%PDF-':
                  failures.append({'code':code,'url':url,'status':rr.status_code,'bytes':len(rr.content)}); continue
                filename=re.sub(r'[\\/:*?"<>|]+','_',f"{get(row,'orgSName','orgName')}_安迪苏_{title}_{get(row,'publishDate')[:10]}.pdf")
                dest=out/filename; dest.write_bytes(rr.content)
                reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
                if pages<15:
                  failures.append({'code':code,'url':url,'error':f'too few pages {pages}'}); dest.unlink(); continue
                text=''.join((p.extract_text() or '') for p in reader.pages[:min(10,pages)])
                if len(comp(text))>300 and not any(x in comp(text) for x in ['安迪苏','600299','蓝星安迪苏']):
                  failures.append({'code':code,'url':url,'error':'issuer mismatch'}); dest.unlink(); continue
                subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                preview=out/'首页预览.png'
                subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(preview.with_suffix(''))],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                selected={'filename':filename,'title':title,'broker':get(row,'orgSName','orgName'),'authors':get(row,'researcher','author'),'date':get(row,'publishDate')[:10],'infoCode':code,'indexed_pages':index_pages,'actual_pages':pages,'bytes':len(rr.content),'sha256':hashlib.sha256(rr.content).hexdigest(),'source_report_page':detail,'pdf_url':url,'raw':row}
                break
              except Exception as exc: failures.append({'code':code,'url':url,'error':repr(exc)})
            if selected: break
          (out/'failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          if not selected: raise RuntimeError('No long PDF passed validation')
          (out/'manifest.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SELECTED',json.dumps(selected,ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload long report
        uses: actions/upload-artifact@v4
        with:
          name: adisseo-600299-quick-deep-report
          path: adisseo_quick_deep
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
