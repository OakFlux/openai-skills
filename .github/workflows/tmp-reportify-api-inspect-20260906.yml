name: Temporary Reportify API inspection
on:
  push:
    branches:
      - tmp-reportify-api-inspect-20260906
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 --max-time 120 -A 'Mozilla/5.0' 'https://files.reportify.cc/fe-static/_next/static/chunks/app/(common)/reports/%5Bid%5D/page-f361b4a009af7d33.js' -o output/report-page.js
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('output/report-page.js').read_text(encoding='utf-8', errors='ignore')
          keys = ['api.reportify.cn','document_id','documentId','report_id','reportId','download','pdf','page','image','preview','source_url','original_url']
          snippets=[]
          for key in keys:
              for match in list(re.finditer(re.escape(key), text, re.I))[:40]:
                  snippets.append('KEY='+key+'\n'+text[max(0,match.start()-600):match.end()+1400])
          Path('output/snippets.txt').write_text('\n\n-----\n\n'.join(snippets),encoding='utf-8')
          strings=[]
          for value in re.findall(r'https?://[^" ]+|/[A-Za-z0-9_?&=./{}:-]{3,180}', text):
              if any(k in value.lower() for k in ['api','report','document','download','file','pdf','page','image']):
                  if value not in strings: strings.append(value)
          Path('output/strings.txt').write_text('\n'.join(strings),encoding='utf-8')
          print('BYTES',len(text),'SNIPPETS',len(snippets),'STRINGS',len(strings))
          for value in strings[:300]: print(value)
          PY
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: reportify-api-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
