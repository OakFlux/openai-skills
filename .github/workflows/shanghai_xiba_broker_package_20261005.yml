name: Shanghai Xiba Broker Research Package

on:
  push:
    branches:
      - chatgpt-shanghai-xiba-broker-reports-20261005
    paths:
      - .github/workflows/shanghai_xiba_broker_package_20261005.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow
      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports output/renders
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          OUT = Path('output')
          REPORTS = OUT / 'reports'
          RENDERS = OUT / 'renders'

          reports = [
              {
                  'filename': '01_东吴证券_上海洗霸_洗尽尘沙鳞爪已现霸业共襄_2025-08-06.pdf',
                  'info_code': 'AP202508061722160089',
                  'title': '洗尽尘沙，鳞爪已现，霸业共襄',
                  'broker': '东吴证券',
                  'broker_tokens': ['东吴证券', '东吴'],
                  'date': '2025-08-06',
                  'analyst': '曾朵红、袁理、阮巧燕、朱家佟、岳斯瑶',
                  'rating': '买入',
                  'expected_pages': 31,
                  'type': '公司深度报告',
              },
              {
                  'filename': '02_新时代证券现诚通证券_上海洗霸_第三方治理加速渗透工业水治理龙头高增长可期_2018-07-08.pdf',
                  'info_code': 'AP201807081164557213',
                  'title': '公司深度报告：第三方治理加速渗透，工业水治理龙头高增长可期',
                  'broker': '新时代证券（现诚通证券）',
                  'broker_tokens': ['新时代证券', '诚通证券', '新时代'],
                  'date': '2018-07-08',
                  'analyst': '邱懿峰、黄红卫、赵腾辉',
                  'rating': '增持',
                  'expected_pages': 23,
                  'type': '公司深度报告',
              },
              {
                  'filename': '03_国金证券_上海洗霸_工业水处理解决方案提供商_2017-09-19.pdf',
                  'info_code': 'AP201709190896631118',
                  'title': '工业水处理解决方案提供商，受益环保趋严下工业环保需求提升',
                  'broker': '国金证券',
                  'broker_tokens': ['国金证券', '国金'],
                  'date': '2017-09-19',
                  'analyst': '苏宝亮',
                  'rating': '未标注',
                  'expected_pages': 22,
                  'type': '公司深度研究报告',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def fetch(url):
              last = None
              for attempt in range(5):
                  try:
                      response = session.get(url, timeout=180, allow_redirects=True)
                      print('FETCH', response.status_code, len(response.content), response.url, response.headers.get('content-type'))
                      if response.status_code == 200 and response.content.startswith(b'%PDF-'):
                          return response
                      last = RuntimeError(f'HTTP {response.status_code}; head={response.content[:32]!r}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(10, 2 ** attempt))
              raise RuntimeError(f'Failed {url}: {last}')

          manifest = []
          render_paths = []
          for item in reports:
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H3_{item["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{item["info_code"]}.pdf',
              ]
              response = None
              used_url = None
              errors = []
              for url in candidates:
                  try:
                      response = fetch(url)
                      used_url = url
                      break
                  except Exception as exc:
                      errors.append({'url': url, 'error': repr(exc)})
              if response is None:
                  raise RuntimeError(f'All URLs failed for {item["title"]}: {errors}')

              data = response.content
              if len(data) < 100000:
                  raise RuntimeError(f'PDF too small: {item["title"]}, {len(data)} bytes')
              path = REPORTS / item['filename']
              path.write_bytes(data)

              reader = PdfReader(str(path))
              if reader.is_encrypted and not reader.decrypt(''):
                  raise RuntimeError(f'Password-protected PDF: {path.name}')
              page_count = len(reader.pages)
              if page_count != item['expected_pages']:
                  raise RuntimeError(f'Page mismatch: {path.name}: {page_count} != {item["expected_pages"]}')

              doc = pymupdf.open(str(path))
              text = ''.join(doc[i].get_text('text') for i in range(min(8, doc.page_count)))
              normalized = re.sub(r'\s+', '', text)
              if '上海洗霸' not in normalized and '603200' not in normalized:
                  raise RuntimeError(f'Company identity check failed: {path.name}')
              if not any(token and token in normalized for token in item['broker_tokens']):
                  raise RuntimeError(f'Broker check failed: {path.name}')

              for label, index in [('first', 0), ('last', doc.page_count - 1)]:
                  pix = doc[index].get_pixmap(matrix=pymupdf.Matrix(1.3, 1.3), alpha=False)
                  render_path = RENDERS / f'{path.stem}_{label}.png'
                  pix.save(str(render_path))
                  render_paths.append(render_path)
              doc.close()

              record = {
                  'filename': path.name,
                  'title': item['title'],
                  'report_type': item['type'],
                  'broker': item['broker'],
                  'date': item['date'],
                  'analyst': item['analyst'],
                  'rating': item['rating'],
                  'info_code': item['info_code'],
                  'report_page': f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
                  'source_url': used_url,
                  'final_url': response.url,
                  'pages': page_count,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'encrypted': reader.is_encrypted,
              }
              manifest.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          thumbs = []
          for image_path in render_paths:
              image = Image.open(image_path).convert('RGB')
              image.thumbnail((420, 580))
              canvas = Image.new('RGB', (440, 630), 'white')
              canvas.paste(image, ((440 - image.width) // 2, 8))
              ImageDraw.Draw(canvas).text((10, 605), image_path.stem[:58], fill='black')
              thumbs.append(canvas)
              image.close()
          cols = 2
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 440, rows * 630), 'white')
          for idx, canvas in enumerate(thumbs):
              sheet.paste(canvas, ((idx % cols) * 440, (idx // cols) * 630))
              canvas.close()
          contact_sheet = RENDERS / 'contact_sheet.jpg'
          sheet.save(contact_sheet, 'JPEG', quality=90)
          sheet.close()

          readme = [
              '上海洗霸（603200.SH）券商深度研究报告资料包',
              '',
              '本资料包包含3份公开可直接取得的完整券商原始PDF，不含网页摘要、付费预览或重新排版版本。',
              '筛选原则：优先选择篇幅较长、研究框架完整的公司深度报告；同时兼顾近期固态电池材料逻辑与历史水处理主业研究。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.append(
                  f"- {record['filename']} | {record['broker']} | {record['date']} | {record['pages']}页 | "
                  f"{record['rating']} | 分析师：{record['analyst']}"
              )
          readme += [
              '',
              '核验：已检查PDF文件头、实际页数、公司名称、券商名称及加密状态，并渲染每份报告首页与末页。',
              '压缩包已执行ZIP CRC完整性测试。',
              '文件仅供个人研究与学习使用，请遵守原始报告版权与免责声明。',
          ]
          (REPORTS / '00_资料说明.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (REPORTS / '00_文件清单及校验值.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (REPORTS / '00_SHA256SUMS.txt').write_text(
              '\n'.join(f"{r['sha256']}  {r['filename']}" for r in manifest) + '\n', encoding='utf-8'
          )

          zip_path = OUT / 'shanghai_xiba_broker_deep_reports_3.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(REPORTS.iterdir(), key=lambda p: p.name):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')

          summary = {
              'zip_filename': zip_path.name,
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'report_count': len(manifest),
              'total_pages': sum(r['pages'] for r in manifest),
              'reports': manifest,
          }
          (OUT / 'BUILD_SUMMARY.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('FINAL_SUMMARY', json.dumps({k: summary[k] for k in ('zip_filename','zip_bytes','zip_sha256','report_count','total_pages')}, ensure_ascii=False))
          PY
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-xiba-broker-deep-reports-package
          path: |
            output/shanghai_xiba_broker_deep_reports_3.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
