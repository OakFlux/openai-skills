name: Inspect CR BMT public report page assets
on:
  push:
    branches: [tmp-cr-bmt-report-pages-probe-20260906]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect report page assets
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urls=['https://www.sgpjbg.com/baogao/651924.html','https://www.sgpjbg.com/baogao/175200.html','https://www.sgpjbg.com/baogao/1167150.html']
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for url in urls:
              r=s.get(url,timeout=60)
              print('\nPAGE',url,'STATUS',r.status_code,'SIZE',len(r.content),'FINAL',r.url)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(True):
                  values=[]
                  for attr in ['href','src','data-src','data-url','data-file','data-pdf','data-download','onclick']:
                      value=tag.get(attr)
                      if value:
                          values.append((attr,value))
                  for attr,value in values:
                      if any(key in value.lower() for key in ['.pdf','download','file','upload','preview','source','document']):
                          if attr != 'onclick':
                              value=urljoin(r.url,value)
                          print('ASSET',attr,value[:1600])
              patterns=[r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r'https?://[^\"\'<>\s]+(?:download|file|upload|preview)[^\"\'<>\s]*']
              for pattern in patterns:
                  for match in list(dict.fromkeys(re.findall(pattern,r.text,re.I)))[:100]:
                      print('MATCH',match[:1600])
              for key in ['pdfurl','pdf_url','fileurl','file_url','downurl','downloadurl','sourceurl','reporturl','attachurl','oss','651924','175200','1167150']:
                  low=r.text.lower(); pos=0; count=0
                  while count<5:
                      idx=low.find(key,pos)
                      if idx<0: break
                      print('CTX',key,r.text[max(0,idx-250):min(len(r.text),idx+900)].replace('\n',' ')[:1150])
                      pos=idx+len(key); count+=1
          PY
