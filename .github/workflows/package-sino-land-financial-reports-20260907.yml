name: Package Sino Land financial reports 20260907

on:
  push:
    branches:
      - chatgpt-sino-land-financial-reports-20260907
    paths:
      - scripts/package_sino_land_financial_reports_20260907.py
      - .github/workflows/package-sino-land-financial-reports-20260907.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -o pipefail
          python scripts/package_sino_land_financial_reports_20260907.py 2>&1 | tee sino_land_packaging.log

      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: sino-land-2020-2025-annual-and-latest-reports
          path: |
            dist_sino_land_20260907/*.zip
            dist_sino_land_20260907/PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sino-land-report-packaging-diagnostics
          path: |
            sino_land_packaging.log
            _work_sino_land_20260907/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
