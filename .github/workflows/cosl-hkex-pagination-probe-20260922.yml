name: Probe COSL HKEX pagination 20260922
on:
  push:
    paths:
      - '.github/workflows/cosl-hkex-pagination-probe-20260922.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect pagination and forms
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers['User-Agent']='Mozilla/5.0 Chrome/151 Safari/537.36'
          u='https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=4651&lang=EN'
          r=s.get(u,timeout=120); r.raise_for_status(); t=r.text
          soup=BeautifulSoup(t,'html.parser')
          print('LEN',len(t),'TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
          print('FORMS')
          for f in soup.find_all('form'):
              print('FORM',f.get('id'),f.get('name'),f.get('method'),urljoin(r.url,f.get('action','')))
              for i in f.find_all(['input','select']):
                  print(' FIELD',i.name,i.get('name'),i.get('id'),i.get('value'))
          print('PAGINATION_LINKS')
          for a in soup.find_all('a',href=True):
              label=' '.join(a.get_text(' ',strip=True).split())
              h=urljoin(r.url,a['href'])
              if any(k in (label+' '+h).lower() for k in ('next','page','older','oldest','load more','show more')):
                  print('A',repr(label),h)
          print('SCRIPT_SRCS')
          for x in soup.find_all('script',src=True): print(urljoin(r.url,x['src']))
          for pat in ('pageNo','pageNum','currentPage','totalPages','loadMore','resultCount','recordCount','pagination','stockId'):
              print('\nPAT',pat)
              for m in re.finditer(pat,t,re.I):
                  print(t[max(0,m.start()-250):m.start()+500].replace('\n',' ')[:900])
                  break
          PY