name: chatgpt-temp-dazhong-gw-inspect
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-gw-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Great Wisdom F10 report page and assets
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python <<'PY'
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          W=Path('dazhong_gw_inspect');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://webf10.gw.com.cn/'})
          u='https://webf10.gw.com.cn/SH/B16/SH600635_B16.html'
          r=s.get(u,timeout=90);print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True);W.joinpath('page.html').write_bytes(r.content)
          text=r.content.decode(r.apparent_encoding or 'utf-8','ignore');soup=BeautifulSoup(text,'html.parser')
          scripts=[]
          for x in soup.find_all('script'):
            scripts.append({'src':urllib.parse.urljoin(r.url,x.get('src')) if x.get('src') else None,'text':(x.string or x.get_text() or '')[:100000]})
          links=[{'text':' '.join(a.get_text(' ',strip=True).split()),'href':urllib.parse.urljoin(r.url,a['href']),'attrs':dict(a.attrs)} for a in soup.find_all('a',href=True)]
          urls=list(dict.fromkeys(re.findall(r'(?:https?:)?//[^"\'<>\s]+|/[A-Za-z0-9_./?=&%:-]+',text)))
          nums=list(dict.fromkeys(re.findall(r'\b\d{7,20}\b',text)))
          (W/'page_analysis.json').write_text(json.dumps({'scripts':scripts,'links':links,'urls':urls,'numbers':nums},ensure_ascii=False,indent=2),encoding='utf-8')
          print('scripts',json.dumps([x['src'] for x in scripts],ensure_ascii=False),flush=True)
          print('links',json.dumps(links,ensure_ascii=False),flush=True)
          print('numbers',json.dumps(nums[:200]),flush=True)
          for item in scripts:
            if not item['src']:continue
            try:
              rr=s.get(item['src'],timeout=90);name=re.sub(r'[^A-Za-z0-9._-]+','_',item['src'])[-180:];W.joinpath(name).write_bytes(rr.content);print('SCRIPT',rr.status_code,len(rr.content),item['src'],flush=True)
              st=rr.content.decode(rr.apparent_encoding or 'utf-8','ignore')
              if any(k in st for k in ['B16','report','研报','Research','SH600635']):
                print('SCRIPT_MATCH',item['src'],st[:3000].replace('\n',' '),flush=True)
            except Exception as e:print('SCRIPT_ERR',item['src'],repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Great-Wisdom-Inspect
          path: dazhong_gw_inspect
          retention-days: 1
          compression-level: 6
