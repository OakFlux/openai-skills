name: Build verified China Hongqiao report PDFs
on:
  push:
    branches:
      - tmp-chinahongqiao-imagepdf-20260908
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests pillow img2pdf pypdf
      - name: Download public report pages and build PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/work output/package
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time, zipfile
          from pathlib import Path
          import requests, img2pdf
          from PIL import Image
          from pypdf import PdfReader

          reports = [
              {
                  'id': '5587515', 'date_path': '2026/08/07', 'date': '2026-08-07',
                  'broker': '东吴证券',
                  'title': '全产业链铸就成本护城河，高股息引领价值重估',
                  'expected_min_pages': 26,
                  'filename': '01_东吴证券_2026-08-07_全产业链铸就成本护城河_高股息引领价值重估.pdf',
                  'detail_url': 'https://www.fxbaogao.com/detail/5587515',
              },
              {
                  'id': '4864892', 'date_path': '2025/05/27', 'date': '2025-05-27',
                  'broker': '华创证券',
                  'title': '全球电解铝龙头，一体化打造盈利护城河，高分红属性明显',
                  'expected_min_pages': 24,
                  'filename': '02_华创证券_2025-05-27_全球电解铝龙头_一体化打造盈利护城河_高分红属性明显.pdf',
                  'detail_url': 'https://www.fxbaogao.com/detail/4864892',
              },
              {
                  'id': '4802165', 'date_path': '2025/04/21', 'date': '2025-04-21',
                  'broker': '西部证券',
                  'title': '高景气+一体化+高分红，电解铝龙头静待价值重估',
                  'expected_min_pages': 24,
                  'filename': '03_西部证券_2025-04-21_高景气_一体化_高分红_电解铝龙头静待价值重估.pdf',
                  'detail_url': 'https://www.fxbaogao.com/detail/4802165',
              },
          ]
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer': 'https://www.fxbaogao.com/',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          }
          s = requests.Session(); s.headers.update(headers)
          manifest = []
          package = Path('output/package')
          work = Path('output/work')

          def valid_image(data: bytes, ctype: str) -> tuple[bool, str, tuple[int,int] | None]:
              if len(data) < 5000 or 'image' not in ctype.lower(): return False, '', None
              try:
                  import io
                  im = Image.open(io.BytesIO(data)); im.verify()
                  im2 = Image.open(io.BytesIO(data))
                  fmt = (im2.format or '').lower(); size = im2.size
                  if size[0] < 500 or size[1] < 700: return False, fmt, size
                  return True, fmt, size
              except Exception:
                  return False, '', None

          for rep in reports:
              repdir = work / rep['id']; repdir.mkdir(parents=True, exist_ok=True)
              pages = []
              page_meta = []
              misses = 0
              for n in range(1, 61):
                  candidates = [
                      f'https://public.fxbaogao.com/report-image/{rep["date_path"]}/{rep["id"]}-{n}.png',
                      f'https://public.fxbaogao.com/report-image/{rep["date_path"]}/{rep["id"]}-{n}.jpg',
                      f'https://public.fxbaogao.com/report-image/{rep["date_path"]}/{rep["id"]}-{n}.jpeg',
                  ]
                  found = False
                  attempts = []
                  for url in candidates:
                      try:
                          r = s.get(url, timeout=45, allow_redirects=True)
                          ctype = r.headers.get('content-type','')
                          ok, fmt, size = valid_image(r.content, ctype)
                          attempts.append({'url': url, 'status': r.status_code, 'bytes': len(r.content), 'content_type': ctype, 'valid': ok, 'format': fmt, 'size': size})
                          if r.status_code == 200 and ok:
                              ext = 'png' if fmt == 'png' else ('jpg' if fmt in ('jpeg','jpg') else fmt)
                              p = repdir / f'{n:03d}.{ext}'
                              p.write_bytes(r.content)
                              pages.append(p)
                              page_meta.append({'page': n, 'url': r.url, 'file': str(p), 'bytes': len(r.content), 'sha256': hashlib.sha256(r.content).hexdigest(), 'format': fmt, 'size': size})
                              found = True
                              misses = 0
                              print('PAGE_OK', rep['id'], n, r.url, len(r.content), fmt, size, flush=True)
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'error': repr(exc)})
                  if not found:
                      misses += 1
                      print('PAGE_MISS', rep['id'], n, json.dumps(attempts, ensure_ascii=False), flush=True)
                      if pages and misses >= 3:
                          break
                  time.sleep(0.05)

              rec = {k: rep[k] for k in ['id','date','broker','title','detail_url','filename','expected_min_pages']}
              rec['downloaded_pages'] = len(pages)
              rec['page_meta'] = page_meta
              if len(pages) < rep['expected_min_pages']:
                  rec['status'] = 'insufficient_pages'
                  manifest.append(rec)
                  print('REPORT_FAIL', json.dumps(rec, ensure_ascii=False), flush=True)
                  continue

              # img2pdf preserves each full-resolution page image without recompressing it.
              pdf_bytes = img2pdf.convert([str(p) for p in pages])
              out = package / rep['filename']; out.write_bytes(pdf_bytes)
              reader = PdfReader(str(out))
              rec.update({
                  'status': 'ok',
                  'pdf_file': str(out),
                  'pdf_pages': len(reader.pages),
                  'pdf_bytes': out.stat().st_size,
                  'pdf_sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
              })
              if rec['pdf_pages'] != len(pages):
                  rec['status'] = 'page_count_mismatch'
              manifest.append(rec)
              print('REPORT_OK', json.dumps({k:rec[k] for k in ['id','broker','date','title','status','downloaded_pages','pdf_pages','pdf_bytes','pdf_sha256']}, ensure_ascii=False), flush=True)

          good = [r for r in manifest if r.get('status') == 'ok']
          if len(good) < 2:
              raise RuntimeError(f'Only {len(good)} complete reports were built; need at least 2')

          # Readable manifest included in the archive.
          lines = [
              '中国宏桥（01378.HK）券商深度报告',
              '',
              f'完整报告数量：{len(good)}',
              '来源页面均标示“点击免费查看完整报告”；PDF由公开逐页原图无损合成。',
              '',
          ]
          for i, r in enumerate(good, 1):
              lines += [
                  f'{i}. {r["broker"]}｜{r["date"]}',
                  f'   标题：{r["title"]}',
                  f'   页数：{r["pdf_pages"]}',
                  f'   文件：{r["filename"]}',
                  f'   来源：{r["detail_url"]}',
                  f'   SHA-256：{r["pdf_sha256"]}',
                  '',
              ]
          (package / '报告清单与校验信息.txt').write_text('\n'.join(lines), encoding='utf-8')
          Path('output/manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = Path('output/中国宏桥_01378_券商深度报告_重新打包.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in sorted(package.iterdir()):
                  z.write(p, arcname=p.name)
          # Verify ZIP contents and CRCs.
          with zipfile.ZipFile(zip_path, 'r') as z:
              bad = z.testzip()
              names = z.namelist()
          if bad:
              raise RuntimeError(f'ZIP CRC failure: {bad}')
          status = {
              'ok': True,
              'zip': str(zip_path),
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'reports': [{k:r.get(k) for k in ['broker','date','title','filename','pdf_pages','pdf_bytes','pdf_sha256','detail_url']} for r in good],
              'zip_names': names,
          }
          Path('output/status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_STATUS', json.dumps(status, ensure_ascii=False), flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-broker-deep-reports-repacked
          path: |
            output/中国宏桥_01378_券商深度报告_重新打包.zip
            output/status.json
            output/manifest.json
          retention-days: 1
          if-no-files-found: error
