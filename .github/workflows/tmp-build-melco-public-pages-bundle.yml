name: Temporary Build Melco Public Research Page PDF Bundle

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-build-melco-public-pages-bundle.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Python dependencies
        run: python -m pip install --quiet selenium pypdf pillow

      - name: Print public report pages to PDF and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          from pypdf import PdfReader
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          reports = [
              {
                  'seq': 1,
                  'broker': '华泰证券',
                  'date': '2025-05-09',
                  'title': '澳门总GGR恢复超行业，市场份额和EM增长',
                  'url': 'https://reportify.cn/reports/1118968060607336448',
                  'original_pages_indexed': 15,
              },
              {
                  'seq': 2,
                  'broker': '东吴证券国际',
                  'date': '2024-11-08',
                  'title': '2024年三季报业绩点评：业绩符合预期，日均运营费用维持稳定',
                  'url': 'https://reportify.cn/reports/1052271542572027904',
                  'original_pages_indexed': 4,
              },
              {
                  'seq': 3,
                  'broker': '东吴证券国际',
                  'date': '2024-03-05',
                  'title': '2023年四季报点评：受到赢率偏低及减值费用的影响，业绩略低于预期',
                  'url': 'https://reportify.cn/reports/962339654089314304',
                  'original_pages_indexed': 4,
              },
          ]

          root = Path('melco_public_bundle')
          pdf_dir = root / '公开页面PDF'
          root.mkdir(exist_ok=True)
          pdf_dir.mkdir(exist_ok=True)

          chrome_candidates = [
              '/opt/google/chrome/google-chrome',
              '/usr/bin/google-chrome-stable',
              '/usr/bin/google-chrome',
              '/usr/bin/chromium',
              '/usr/bin/chromium-browser',
          ]
          driver_candidates = [
              '/usr/local/share/chromedriver-linux64/chromedriver',
              '/usr/local/bin/chromedriver',
              '/usr/bin/chromedriver',
          ]
          chrome = next((x for x in chrome_candidates if Path(x).exists()), None)
          driver_path = next((x for x in driver_candidates if Path(x).exists()), None)
          if not chrome:
              raise RuntimeError('No Chrome binary found')

          options = Options()
          options.binary_location = chrome
          for arg in [
              '--headless=new', '--no-sandbox', '--disable-dev-shm-usage',
              '--disable-gpu', '--window-size=1440,1200', '--lang=zh-CN',
              '--remote-debugging-pipe', '--disable-notifications',
          ]:
              options.add_argument(arg)
          options.add_experimental_option('prefs', {
              'profile.default_content_setting_values.notifications': 2,
              'intl.accept_languages': 'zh-CN,zh,en',
          })

          service = Service(driver_path) if driver_path else Service()
          driver = webdriver.Chrome(service=service, options=options)
          manifest = []
          try:
              for report in reports:
                  driver.get(report['url'])
                  time.sleep(8)
                  # Close common consent/login overlays when a visible close button exists.
                  driver.execute_script('''
                    const selectors=['button[aria-label="Close"]','.ant-modal-close','.ant-drawer-close','button.close'];
                    selectors.forEach(s=>document.querySelectorAll(s).forEach(el=>{try{el.click()}catch(e){}}));
                  ''')
                  # Scroll through the page so deferred public sections render.
                  height = driver.execute_script('return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)') or 5000
                  y = 0
                  while y <= min(height + 2000, 40000):
                      driver.execute_script(f'window.scrollTo(0,{y});')
                      time.sleep(0.25)
                      y += 750
                      height = max(height, driver.execute_script('return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)') or height)
                  driver.execute_script('window.scrollTo(0,0)')
                  time.sleep(2)

                  visible_text = driver.execute_script("return document.body ? document.body.innerText : ''") or ''
                  compact = re.sub(r'\s+', '', visible_text)
                  if '新濠国际发展' not in compact and '新濠國際發展' not in compact:
                      raise RuntimeError(f"Company identity absent from public page: {report['url']}")
                  title_terms = [x for x in re.split(r'[：，、；\s]+', report['title']) if len(x) >= 4]
                  title_hits = sum(1 for x in title_terms if x in compact)
                  if title_hits < max(1, min(2, len(title_terms))):
                      raise RuntimeError(f"Report title not sufficiently matched: {report['title']}")

                  # Inject a disclosure banner into the printed copy.
                  driver.execute_script('''
                    const banner=document.createElement('div');
                    banner.id='openai-public-copy-banner';
                    banner.style.cssText='position:relative;z-index:2147483647;background:#fff4d6;border:1px solid #b48a26;padding:12px 16px;margin:8px;font-size:14px;line-height:1.6;color:#222;font-family:Arial,"Noto Sans CJK SC",sans-serif;';
                    banner.textContent='公开页面存档：本PDF由公开可访问的研究报告详情页打印生成，用于资料整理；不是券商原始版式PDF。原始全文如受版权或账户权限限制，本文件不绕过相关限制。';
                    document.body.insertBefore(banner,document.body.firstChild);
                    document.querySelectorAll('header,nav,[class*="cookie"],[class*="Cookie"],[class*="floating"],[class*="Floating"]').forEach(el=>{try{el.style.position='static'}catch(e){}});
                  ''')
                  time.sleep(1)

                  print_result = driver.execute_cdp_cmd('Page.printToPDF', {
                      'landscape': False,
                      'displayHeaderFooter': True,
                      'printBackground': True,
                      'preferCSSPageSize': False,
                      'paperWidth': 8.27,
                      'paperHeight': 11.69,
                      'marginTop': 0.45,
                      'marginBottom': 0.55,
                      'marginLeft': 0.35,
                      'marginRight': 0.35,
                      'headerTemplate': '<div style="font-size:8px;width:100%;text-align:center;color:#777">新濠国际发展（00200.HK）券商研究公开页面存档</div>',
                      'footerTemplate': '<div style="font-size:8px;width:100%;text-align:center;color:#777"><span class="pageNumber"></span> / <span class="totalPages"></span></div>',
                  })
                  pdf_bytes = base64.b64decode(print_result['data'])
                  if not pdf_bytes.startswith(b'%PDF') or len(pdf_bytes) < 50000:
                      raise RuntimeError(f"Invalid printed PDF for {report['url']}")

                  safe_title = re.sub(r'[\\/:*?"<>|，。；：、（）()【】《》\s]+', '_', report['title']).strip('_')[:80]
                  filename = f"{report['seq']:02d}_{report['broker']}_新濠国际发展_{safe_title}_{report['date']}_公开页面版.pdf"
                  path = pdf_dir / filename
                  path.write_bytes(pdf_bytes)
                  reader = PdfReader(str(path), strict=False)
                  pages = len(reader.pages)
                  if pages < 1:
                      raise RuntimeError(f'Printed PDF has no pages: {filename}')

                  first_text = ''
                  try:
                      first_text = reader.pages[0].extract_text() or ''
                  except Exception:
                      pass
                  manifest.append({
                      **report,
                      'file': str(path.relative_to(root)),
                      'printed_pdf_pages': pages,
                      'bytes': len(pdf_bytes),
                      'sha256': hashlib.sha256(pdf_bytes).hexdigest(),
                      'company_identity_verified_in_browser': True,
                      'title_terms_matched_in_browser': title_hits,
                      'first_page_text_head': first_text[:1000],
                      'copy_type': '公开研究报告详情页打印存档，非券商原始版式PDF',
                  })
                  print('VERIFIED=' + json.dumps(manifest[-1], ensure_ascii=False), flush=True)
          finally:
              driver.quit()

          readme_lines = [
              '新濠国际发展（00200.HK）券商研究报告公开页面资料包',
              '',
              '重要说明：',
              '1. 前一次提供的链接对应文件未实际生成，本包为重新生成并验证后的正式交付文件。',
              '2. 包内PDF是公开可访问研究报告详情页的打印存档，不是券商原始版式PDF。',
              '3. 原始券商全文入口存在版权或账户权限限制，本包没有绕过登录、付费或访问控制。',
              '4. 报告标题、券商、日期及公开索引页数仅用于识别报告；打印PDF页数取决于网页排版。',
              '',
              '文件清单：',
          ]
          for item in manifest:
              readme_lines.extend([
                  f"{item['seq']}. {item['broker']}｜{item['date']}｜{item['title']}",
                  f"   公开索引标注原报告页数：{item['original_pages_indexed']}页",
                  f"   当前公开页面打印PDF页数：{item['printed_pdf_pages']}页",
                  f"   文件：{item['file']}",
                  f"   SHA-256：{item['sha256']}",
                  f"   来源页面：{item['url']}",
              ])
          (root / 'README_说明与校验.txt').write_text('\n'.join(readme_lines) + '\n', encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_name = '新濠国际发展_00200_HK_券商研究报告_3份_公开页面PDF_重新生成.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(root.name) / path.relative_to(root)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdf_count = len([name for name in archive.namelist() if name.lower().endswith('.pdf')])
              if pdf_count != 3:
                  raise RuntimeError(f'Expected three PDFs, found {pdf_count}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}', flush=True)
          PY

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: melco-public-research-pages-bundle
          path: 新濠国际发展_00200_HK_券商研究报告_3份_公开页面PDF_重新生成.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
