name: Discover Guoji Zhongzhuang historical reports via CNINFO 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-cninfo-discover-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query CNINFO archives
        run: |
          python - <<'PY'
          import json, requests

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.cninfo.com.cn/'})
          orgs=[]
          for kw in ['400062','二重5','国重装5','国机重装','601399','601268']:
              try:
                  r=s.get('https://www.cninfo.com.cn/new/information/topSearch/query',params={'keyWord':kw,'maxSecNum':'20'},timeout=30)
                  print('\nTOPSEARCH',kw,r.status_code,r.url,'LEN',len(r.text))
                  print(r.text[:3000])
                  if r.ok:
                      data=r.json()
                      rows=data if isinstance(data,list) else data.get('data') or data.get('keyBoardList') or []
                      for rec in rows:
                          oid=rec.get('orgId') or rec.get('orgid')
                          code=rec.get('code') or rec.get('secCode')
                          if oid: orgs.append((code,oid,rec))
              except Exception as exc:
                  print('TOPSEARCH_ERR',kw,repr(exc))
          print('\nORGS',json.dumps(orgs,ensure_ascii=False))

          endpoint='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          combos=[]
          candidates=[('400062',''),('601268',''),('601399','')]
          for code,oid,rec in orgs:
              if code in ('400062','601268','601399'):
                  candidates.append((code,oid))
          seen=set()
          for code,oid in candidates:
              stock=f'{code},{oid}' if oid else code
              for column in ['neeq','sse','szse','']:
                  for category in ['category_ndbg_szsh;','category_ndbg_szsh;category_bndbg_szsh;','']:
                      key=(stock,column,category)
                      if key in seen: continue
                      seen.add(key)
                      combos.append(key)
          for i,(stock,column,category) in enumerate(combos,1):
              form={
                'pageNum':'1','pageSize':'100','column':column,'tabName':'fulltext',
                'plate':'','stock':stock,'searchkey':'','secid':'','category':category,
                'trade':'','seDate':'2015-01-01~2020-12-31','sortName':'','sortType':'',
                'isHLtitle':'true'
              }
              try:
                  r=s.post(endpoint,data=form,timeout=40,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search'})
                  print('\nQUERY',i,'STATUS',r.status_code,'STOCK',stock,'COLUMN',column,'CATEGORY',category,'LEN',len(r.text))
                  print('HEAD',r.text[:500])
                  if not r.ok: continue
                  data=r.json(); anns=data.get('announcements') or []
                  print('TOTAL',data.get('totalAnnouncement'),'ROWS',len(anns))
                  for a in anns:
                      title=str(a.get('announcementTitle') or '')
                      if '年度报告' in title or '年报' in title:
                          print('HIT',json.dumps(a,ensure_ascii=False,sort_keys=True))
              except Exception as exc:
                  print('QUERY_ERR',i,stock,column,category,repr(exc))
          PY
