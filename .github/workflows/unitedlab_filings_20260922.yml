name: United Laboratories Official Filings Package

on:
  push:
    branches:
      - chatgpt-unitedlab-filings-20260922
    paths:
      - .github/workflows/unitedlab_filings_20260922.yml
      - scripts/build_unitedlab_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Apply prospectus validation compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_unitedlab_filings.py')
          text = path.read_text(encoding='utf-8')
          old_encryption = """    reader = PdfReader(str(temp))
              if reader.is_encrypted:
                  raise RuntimeError(f'Encrypted PDF: {url}')
              pages = len(reader.pages)
          """
          new_encryption = """    reader = PdfReader(str(temp))
              if reader.is_encrypted and not reader.decrypt(''):
                  raise RuntimeError(f'Password-protected PDF: {url}')
              pages = len(reader.pages)
          """
          old_validator = """    company_ok = 'UNITED LABORATORIES' in text or '聯邦製藥' in text or '联邦制药' in text
              document_ok = any(k in text for k in ('PROSPECTUS', 'GLOBAL OFFERING', '招股章程', '招股書', '招股说明书'))
              return company_ok and (document_ok or rec['pages'] >= 250)
          """
          new_validator = """    company_ok = 'UNITED LABORATORIES' in text or '聯邦製藥' in text or '联邦制药' in text
              official_source_ok = 'unitedlab/listingdoc' in link_of(row).lower()
              document_ok = any(k in text for k in ('PROSPECTUS', 'GLOBAL OFFERING', '招股章程', '招股書', '招股说明书'))
              return (company_ok or official_source_ok) and (document_ok or rec['pages'] >= 250)
          """
          if old_encryption not in text:
              raise RuntimeError('Expected encryption validation block was not found')
          if old_validator not in text:
              raise RuntimeError('Expected prospectus validator block was not found')
          text = text.replace(old_encryption, new_encryption).replace(old_validator, new_validator)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Download and validate official filings
        run: python scripts/build_unitedlab_filings.py

      - name: List package files
        run: ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: unitedlab-official-filings-package
          path: |
            output/联邦制药_2020-2025年报_招股说明书_最新财报.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
