name: United Laboratories Official Filings Package

on:
  push:
    branches:
      - chatgpt-unitedlab-filings-20260922
    paths:
      - .github/workflows/unitedlab_filings_20260922.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Download and validate filings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/debug
          cat > /tmp/build_unitedlab.py <<'PY'
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs, unquote

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT = Path('output')
          DEBUG = OUT / 'debug'
          STOCK_ID = '15767'
          HKEX_BASE = 'https://www1.hkexnews.hk'
          HKEX_API = HKEX_BASE + '/search/titleSearchServlet.do'
          TODAY = '20260922'

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def get(url, *, params=None, headers=None, timeout=90):
              last = None
              merged = dict(session.headers)
              if headers:
                  merged.update(headers)
              for attempt in range(5):
                  try:
                      r = session.get(url, params=params, headers=merged, timeout=timeout, allow_redirects=True)
                      if r.status_code == 200:
                          return r
                      last = RuntimeError(f'HTTP {r.status_code} for {r.url}: {r.text[:200]}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(12, 2 ** attempt))
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          def normalize_rows(obj):
              if isinstance(obj, str):
                  try:
                      return normalize_rows(json.loads(obj))
                  except Exception:
                      return []
              if isinstance(obj, list):
                  if obj and all(isinstance(x, dict) for x in obj):
                      return obj
                  for x in obj:
                      rows = normalize_rows(x)
                      if rows:
                          return rows
                  return []
              if isinstance(obj, dict):
                  for key in ('result', 'data', 'rows', 'records', 'items'):
                      if key in obj:
                          rows = normalize_rows(obj[key])
                          if rows:
                              return rows
                  for value in obj.values():
                      rows = normalize_rows(value)
                      if rows:
                          return rows
              return []

          def query_hkex(lang, from_date, to_date, t2code='-2', label='query'):
              params = {
                  'sortDir': '1',
                  'sortByOptions': 'DateTime',
                  'category': '0',
                  'market': 'SEHK',
                  'stockId': STOCK_ID,
                  'documentType': '-1',
                  'fromDate': from_date,
                  'toDate': to_date,
                  'title': '',
                  'searchType': '1',
                  't1code': '40000' if t2code != '-2' else '-2',
                  't2Gcode': '-2',
                  't2code': t2code,
                  'rowRange': '2000',
                  'lang': lang,
              }
              headers = {
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
                  'Referer': HKEX_BASE + '/search/titlesearch.xhtml?category=0&lang=' + ('ZH' if lang == 'zh' else 'EN') + '&market=SEHK&stockId=' + STOCK_ID,
                  'X-Requested-With': 'XMLHttpRequest',
              }
              r = get(HKEX_API, params=params, headers=headers, timeout=60)
              (DEBUG / f'{label}_{lang}_{t2code}.txt').write_bytes(r.content)
              try:
                  obj = r.json()
              except Exception:
                  text = r.text.strip()
                  left, right = text.find('('), text.rfind(')')
                  if left >= 0 and right > left:
                      obj = json.loads(text[left+1:right])
                  else:
                      raise
              rows = normalize_rows(obj)
              print('HKEX_QUERY', label, lang, t2code, 'rows=', len(rows), 'url=', r.url)
              for row in rows[:10]:
                  print('ROW', json.dumps({k: row.get(k) for k in ('DATE_TIME','STOCK_CODE','STOCK_NAME','TITLE','FILE_LINK','FILE_INFO','T2_CODE')}, ensure_ascii=False))
              return rows

          def title_of(row):
              return str(row.get('TITLE') or row.get('title') or '').strip()

          def date_of(row):
              return str(row.get('DATE_TIME') or row.get('dateTime') or row.get('date') or '').strip()

          def link_of(row):
              link = str(row.get('FILE_LINK') or row.get('fileLink') or row.get('href') or row.get('url') or '').strip()
              if not link:
                  return ''
              return urljoin(HKEX_BASE + '/', link)

          def unwrap_redirect(url):
              try:
                  p = urlparse(url)
                  q = parse_qs(p.query)
                  if 'url' in q and q['url']:
                      return unquote(q['url'][0])
              except Exception:
                  pass
              return url

          def collect_irasia_links(page_url, label):
              try:
                  r = get(page_url, timeout=60)
              except Exception as exc:
                  print('IRASIA_PAGE_FAILED', page_url, repr(exc))
                  return []
              (DEBUG / f'{label}.html').write_bytes(r.content)
              soup = BeautifulSoup(r.text, 'html.parser')
              out = []
              for a in soup.find_all('a', href=True):
                  href = unwrap_redirect(urljoin(r.url, a['href']))
                  text = ' '.join(a.get_text(' ', strip=True).split())
                  parent = a.find_parent(['li','tr','p','div'])
                  context = ' '.join((parent.get_text(' ', strip=True) if parent else text).split())
                  if '.pdf' in href.lower() or 'redirect.cgi' in a['href']:
                      out.append({'TITLE': text or context, 'CONTEXT': context, 'FILE_LINK': href, 'DATE_TIME': ''})
              print('IRASIA_LINKS', label, len(out))
              for row in out:
                  print('IRASIA', json.dumps(row, ensure_ascii=False))
              return out

          def dedupe_rows(rows):
              seen = set()
              out = []
              for row in rows:
                  u = link_of(row) if isinstance(row, dict) else ''
                  if not u:
                      u = str(row.get('FILE_LINK') or '') if isinstance(row, dict) else ''
                  u = unwrap_redirect(u)
                  if not u or u in seen:
                      continue
                  seen.add(u)
                  r = dict(row)
                  r['FILE_LINK'] = u
                  out.append(r)
              return out

          def download_pdf(url, temp_name):
              r = get(url, timeout=180)
              data = r.content
              if not data.startswith(b'%PDF-'):
                  raise RuntimeError(f'Not PDF: {url}; status={r.status_code}; head={data[:32]!r}; type={r.headers.get("content-type")}')
              if len(data) < 40000:
                  raise RuntimeError(f'PDF too small: {url}; bytes={len(data)}')
              path = DEBUG / temp_name
              path.write_bytes(data)
              reader = PdfReader(str(path))
              if reader.is_encrypted:
                  raise RuntimeError(f'Encrypted PDF: {url}')
              pages = len(reader.pages)
              first_text = ''
              try:
                  first_text = ' '.join((reader.pages[0].extract_text() or '').split())[:1500]
              except Exception:
                  pass
              return {
                  'url': url,
                  'final_url': r.url,
                  'data': data,
                  'pages': pages,
                  'first_text': first_text,
                  'bytes': len(data),
              }

          def choose_and_save(filename, display_title, category, candidates, *, min_pages, max_candidates=20, validator=None):
              errors = []
              valid = []
              for idx, row in enumerate(dedupe_rows(candidates)[:max_candidates], 1):
                  url = row.get('FILE_LINK') or link_of(row)
                  if not url:
                      continue
                  try:
                      print('TRY', category, title_of(row), url)
                      rec = download_pdf(url, f'candidate_{re.sub(r"[^A-Za-z0-9]+","_",category)}_{idx}.pdf')
                      if rec['pages'] < min_pages:
                          raise RuntimeError(f'page count {rec["pages"]} < {min_pages}')
                      if validator and not validator(row, rec):
                          raise RuntimeError('content/title validation rejected candidate')
                      score = rec['pages'] * 1000000 + rec['bytes']
                      valid.append((score, row, rec))
                      print('VALID_CANDIDATE', category, title_of(row), rec['pages'], rec['bytes'], url)
                  except Exception as exc:
                      errors.append({'title': title_of(row), 'url': url, 'error': repr(exc)})
                      print('CANDIDATE_FAILED', category, url, repr(exc))
              if not valid:
                  raise RuntimeError(f'No valid candidate for {category}: {json.dumps(errors, ensure_ascii=False)}')
              valid.sort(key=lambda x: x[0], reverse=True)
              _, row, rec = valid[0]
              path = OUT / filename
              path.write_bytes(rec['data'])
              saved = {
                  'filename': filename,
                  'title': display_title,
                  'category': category,
                  'source_title': title_of(row),
                  'source_date': date_of(row),
                  'source_url': rec['url'],
                  'final_url': rec['final_url'],
                  'pages': rec['pages'],
                  'bytes': rec['bytes'],
                  'sha256': hashlib.sha256(rec['data']).hexdigest(),
                  'first_page_text_excerpt': rec['first_text'],
              }
              print('SELECTED', json.dumps(saved, ensure_ascii=False))
              return path, saved

          def annual_validator(year):
              def _v(row, rec):
                  t = (title_of(row) + ' ' + rec['first_text']).upper()
                  return str(year) in t and ('ANNUAL REPORT' in t or '年報' in t or '年度報告' in t or rec['pages'] >= 100)
              return _v

          def prospectus_validator(row, rec):
              t = (title_of(row) + ' ' + rec['first_text']).upper()
              return ('PROSPECTUS' in t or 'GLOBAL OFFERING' in t or '招股' in t or rec['pages'] >= 200)

          def interim_report_validator(row, rec):
              t = (title_of(row) + ' ' + rec['first_text']).upper()
              return ('INTERIM REPORT' in t or '中期報告' in t or 'INTERIM RESULTS' in t or '中期業績' in t)

          # Query official HKEX records. Each query has English and Chinese fallbacks.
          annual_rows = []
          for lang in ('zh', 'en'):
              annual_rows += query_hkex(lang, '20200101', TODAY, '40200', 'annual')
          interim_rows = []
          for lang in ('zh', 'en'):
              interim_rows += query_hkex(lang, '20250101', TODAY, '40300', 'interim')
          all_recent_rows = []
          for lang in ('zh', 'en'):
              all_recent_rows += query_hkex(lang, '20260101', TODAY, '-2', 'recent_all')
          prospectus_rows = []
          for lang in ('zh', 'en'):
              prospectus_rows += query_hkex(lang, '20070101', '20071231', '40500', 'prospectus')

          # Supplement with company IR direct sources.
          irasia_listing = collect_irasia_links('https://www.irasia.com/listco/hk/unitedlab/listingdoc/07index.htm', 'irasia_listing_2007')
          irasia_interim = collect_irasia_links('https://www.irasia.com/listco/hk/unitedlab/interim/index.htm', 'irasia_interim_index')

          docs = []
          for year in range(2020, 2026):
              candidates = []
              for row in annual_rows:
                  t = title_of(row).upper()
                  d = date_of(row)
                  if str(year) in t and ('ANNUAL REPORT' in t or '年報' in t or '年度報告' in t):
                      if not any(x in t for x in ('SUPPLEMENTAL', '補充', '澄清', 'CLARIFICATION', 'ESG', 'ENVIRONMENTAL')):
                          candidates.append(row)
              candidates += [{
                  'TITLE': f'Annual Report {year} - Company IR',
                  'FILE_LINK': f'https://doc.irasia.com/listco/hk/unitedlab/annual/{year}/ar{year}.pdf',
                  'DATE_TIME': str(year),
              }]
              path, rec = choose_and_save(
                  f'{year-2019:02d}_联邦制药_{year}年年报.pdf',
                  f'联邦制药国际控股有限公司 - {year}年年报',
                  f'{year}年年报',
                  candidates,
                  min_pages=70,
                  validator=annual_validator(year),
              )
              docs.append((path, rec))

          # Final IPO prospectus: prefer official HKEX prospectus rows; supplement with IR links.
          prospectus_candidates = []
          for row in prospectus_rows + irasia_listing:
              t = (title_of(row) + ' ' + str(row.get('CONTEXT') or '')).upper()
              if any(k in t for k in ('PROSPECTUS', 'GLOBAL OFFERING', '招股章程', '招股書', '招股说明书', '招股')):
                  if not any(x in t for x in ('FORMAL NOTICE', 'APPLICATION FORM', 'WHITE FORM', 'YELLOW FORM', '正式通告', '申請表')):
                      prospectus_candidates.append(row)
          if not prospectus_candidates:
              prospectus_candidates = prospectus_rows + irasia_listing
          path, rec = choose_and_save(
              '07_联邦制药_招股说明书_2007.pdf',
              '联邦制药国际控股有限公司 - 首次公开发行最终版招股说明书',
              '招股说明书',
              prospectus_candidates,
              min_pages=120,
              max_candidates=30,
              validator=prospectus_validator,
          )
          docs.append((path, rec))

          # Latest periodic financial disclosure. Prefer a full 2026 interim report. If none exists,
          # use the 2026 interim results announcement, which contains the latest six-month financial statements.
          full_2026 = []
          for row in interim_rows + irasia_interim:
              t = (title_of(row) + ' ' + str(row.get('CONTEXT') or '')).upper()
              if '2026' in t and ('INTERIM REPORT' in t or '中期報告' in t or '中期报告' in t):
                  full_2026.append(row)
          full_2026 += [{
              'TITLE': 'Interim Report 2026 - Company IR guessed official path',
              'FILE_LINK': 'https://doc.irasia.com/listco/hk/unitedlab/interim/2026/intrep.pdf',
              'DATE_TIME': '2026',
          }]

          latest_path = latest_rec = None
          try:
              latest_path, latest_rec = choose_and_save(
                  '08_联邦制药_2026年中期报告_最新定期财报.pdf',
                  '联邦制药国际控股有限公司 - 2026年中期报告',
                  '2026年中期报告',
                  full_2026,
                  min_pages=20,
                  max_candidates=15,
                  validator=interim_report_validator,
              )
              latest_rec['latest_document_basis'] = '截至2026-09-22已发现并下载2026年完整中期报告。'
          except Exception as full_exc:
              print('FULL_2026_INTERIM_NOT_AVAILABLE', repr(full_exc))
              result_candidates = []
              for row in all_recent_rows:
                  t = title_of(row).upper()
                  if ('INTERIM RESULTS' in t or '中期業績' in t or '中期业绩' in t) and ('2026' in t or 'SIX MONTHS ENDED 30 JUNE 2026' in t or '截至二零二六年六月三十日' in t):
                      if 'CLARIFICATION' not in t and '澄清' not in t:
                          result_candidates.append(row)
              latest_path, latest_rec = choose_and_save(
                  '08_联邦制药_2026年中期业绩公告_最新财务披露.pdf',
                  '联邦制药国际控股有限公司 - 截至2026年6月30日止六个月中期业绩公告',
                  '2026年最新中期财务披露',
                  result_candidates,
                  min_pages=10,
                  max_candidates=20,
                  validator=interim_report_validator,
              )
              latest_rec['latest_document_basis'] = '截至2026-09-22，港交所未检索到2026年完整中期报告；收录2026年中期业绩公告作为最新财务披露。'
          docs.append((latest_path, latest_rec))

          manifest = [rec for _, rec in docs]
          latest_note = manifest[-1].get('latest_document_basis', '')
          note = f'''联邦制药国际控股有限公司（03933.HK）官方披露文件资料包

文件范围：
1. 2020年至2025年年度报告，共6份。
2. 2007年首次公开发行最终版招股说明书，共1份。
3. 最新中期财务披露，共1份。

最新财报口径：
- 香港主板发行人通常披露年度报告和中期报告，并不强制发布季度报告。
- {latest_note}

文件说明：
- 优先从香港交易所披露易检索并下载官方PDF；公司投资者关系网站作为缺失记录的官方备用来源。
- 未重复收录业绩公告、年报补充公告、ESG报告、申请表或配售文件，招股说明书仅保留最终版。
- 每份PDF均已检查文件头、实际页数、加密状态和SHA-256校验值。
- 仅供个人研究与学习使用，请遵守原始文件的版权及免责声明。
'''
          (OUT / '资料说明.txt').write_text(note, encoding='utf-8')
          (OUT / '文件清单及校验值.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = OUT / '联邦制药_2020-2025年报_招股说明书_最新财报.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path, _ in docs:
                  z.write(path, path.name)
              z.write(OUT / '资料说明.txt', '资料说明.txt')
              z.write(OUT / '文件清单及校验值.json', '文件清单及校验值.json')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC validation failed at {bad}')
          summary = {
              'zip': zip_path.name,
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'documents': manifest,
          }
          (OUT / 'BUILD_SUMMARY.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_SUMMARY', json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/build_unitedlab.py
          rm -rf output/debug
          ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: unitedlab-official-filings-package
          path: |
            output/联邦制药_2020-2025年报_招股说明书_最新财报.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
