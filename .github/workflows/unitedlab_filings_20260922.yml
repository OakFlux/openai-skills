name: United Laboratories Official Filings Package

on:
  push:
    branches:
      - chatgpt-unitedlab-filings-20260922
    paths:
      - .github/workflows/unitedlab_filings_20260922.yml
      - scripts/build_unitedlab_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Permit empty-password restricted PDFs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_unitedlab_filings.py')
          text = path.read_text(encoding='utf-8')
          old = """    reader = PdfReader(str(temp))
              if reader.is_encrypted:
                  raise RuntimeError(f'Encrypted PDF: {url}')
              pages = len(reader.pages)
          """
          new = """    reader = PdfReader(str(temp))
              if reader.is_encrypted and not reader.decrypt(''):
                  raise RuntimeError(f'Password-protected PDF: {url}')
              pages = len(reader.pages)
          """
          if old not in text:
              raise RuntimeError('Expected encryption validation block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Download and validate official filings
        run: python scripts/build_unitedlab_filings.py

      - name: List package files
        run: ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: unitedlab-official-filings-package
          path: |
            output/联邦制药_2020-2025年报_招股说明书_最新财报.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
