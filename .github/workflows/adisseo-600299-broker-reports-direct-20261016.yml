name: Build Adisseo 600299 broker reports direct 20261016

on:
  push:
    paths:
      - '.github/workflows/adisseo-600299-broker-reports-direct-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='安迪苏_600299_券商深度报告_3份'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)

          candidates=[
            {
              'code':'AP202609141829351640','broker':'太平洋证券','date':'2026-09-14','authors':'王海涛',
              'title':'蛋氨酸、特种产品齐头并进，新产品、新产能蓄势待发','class':'最新公司研究',
              'filename':'太平洋证券_安迪苏_蛋氨酸特种产品齐头并进新产品新产能蓄势待发_2026-09-14.pdf','min_pages':3,
              'terms':['安迪苏','600299','蛋氨酸','特种产品']
            },
            {
              'code':'AP202604071821050020','broker':'东吴证券','date':'2026-04-08','authors':'陈淑娴、周少玟',
              'title':'地缘冲突引发蛋氨酸价格快速上涨，公司作为全球蛋氨酸龙头有望受益','class':'公司研究',
              'filename':'东吴证券_安迪苏_地缘冲突引发蛋氨酸价格快速上涨_2026-04-08.pdf','min_pages':3,
              'terms':['安迪苏','600299','蛋氨酸','全球蛋氨酸龙头']
            },
            {
              'code':'AP202410301640570450','broker':'东吴证券','date':'2024-10-31','authors':'陈淑娴、周少玟',
              'title':'2024年三季报点评：特种产品业务增速亮眼，蛋氨酸景气度持续改善','class':'公司研究',
              'filename':'东吴证券_安迪苏_特种产品业务增速亮眼蛋氨酸景气度改善_2024-10-31.pdf','min_pages':3,
              'terms':['安迪苏','600299','特种产品','蛋氨酸']
            },
            {
              'code':'AP202501091641841924','broker':'太平洋证券','date':'2025-01-09','authors':'王亮',
              'title':'VA、蛋氨酸景气延续，有望实现量价齐升','class':'公司研究',
              'filename':'太平洋证券_安迪苏_VA蛋氨酸景气延续有望实现量价齐升_2025-01-09.pdf','min_pages':3,
              'terms':['安迪苏','600299','VA','蛋氨酸']
            },
            {
              'code':'AP202604071821071086','broker':'东兴证券','date':'2026-04-07','authors':'刘宇卓',
              'title':'2025年年报点评：蛋氨酸价格环比下滑拖累业绩水平，长期成长动能维持强劲','class':'公司研究',
              'filename':'东兴证券_安迪苏_2025年年报点评长期成长动能维持强劲_2026-04-07.pdf','min_pages':3,
              'terms':['安迪苏','600299','蛋氨酸','长期成长']
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          def fetch(code):
            attempts=[]
            detail=f'https://data.eastmoney.com/report/info/{code}.html'
            for prefix in ['H3','H2','H1','H4']:
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
              for _ in range(2):
                try:
                  r=s.get(url,timeout=(20,180),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'})
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>40000:
                    return r.content,url,attempts
                except Exception as exc:
                  attempts.append({'url':url,'error':repr(exc)})
            raise RuntimeError(json.dumps(attempts[-8:],ensure_ascii=False))

          manifest=[]; failures=[]
          for item in candidates:
            if len(manifest)>=3: break
            try:
              data,url,attempts=fetch(item['code'])
              temp=root/('tmp_'+item['filename']); temp.write_bytes(data)
              reader=PdfReader(str(temp),strict=False); pages=len(reader.pages)
              if pages<item['min_pages']:
                raise RuntimeError(f'too few pages {pages}')
              text=''
              for p in reader.pages[:min(12,pages)]:
                try: text+='\n'+(p.extract_text() or '')
                except Exception: pass
              ct=re.sub(r'\s+','',text)
              hits=[x for x in item['terms'] if re.sub(r'\s+','',x) in ct]
              if len(ct)>300 and not any(x in ct for x in ['安迪苏','600299','蓝星安迪苏']) and len(hits)<1:
                raise RuntimeError('issuer/title text mismatch')
              idx=len(manifest)+1
              dest=root/f'{idx:02d}_{item["filename"]}'
              temp.replace(dest)
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=previews/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('preview failed')
              sha=hashlib.sha256(data).hexdigest()
              manifest.append({**item,'filename':dest.name,'pages':pages,'bytes':len(data),'sha256':sha,'pdf_url':url,'source_report_page':f'https://data.eastmoney.com/report/info/{item["code"]}.html','text_hits':hits,'extracted_chars':len(ct),'preview_file':str(Path('首页预览')/preview.name),'download_attempts':attempts})
            except Exception as exc:
              failures.append({'code':item['code'],'title':item['title'],'error':repr(exc)})
              for p in root.glob('tmp_*'): p.unlink(missing_ok=True)

          if len(manifest)<2: raise RuntimeError(f'Only {len(manifest)} reports succeeded: {failures}')

          readme=['蓝星安迪苏股份有限公司（600299.SH）券商研究报告资料包','整理日期：2026-10-16','',f'本包收录{len(manifest)}份券商原始完整PDF。优先采用公开研报索引中可直接取得、可验证的公司研究报告。','未使用网页摘要或自行重制的PDF。','']
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；作者：{x['authors']}；类型：{x['class']}",f"   完整页数：{x['pages']}页；文件：{x['filename']}",f"   来源页面：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、研报编号、页数、qpdf结构、首页渲染、可提取文本中的公司/标题关键词、ZIP CRC和SHA-256。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'download_failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=len(manifest) or len(pdfs)<2: raise RuntimeError(f'ZIP failed bad={bad} pdfs={len(pdfs)} manifest={len(manifest)}')
          Path('adisseo_broker_reports_direct.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FAILURES',json.dumps(failures,ensure_ascii=False,indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: adisseo-600299-broker-reports-direct-final
          path: |
            安迪苏_600299_券商深度报告_3份.zip
            adisseo_broker_reports_direct.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
