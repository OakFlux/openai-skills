name: Inspect Trina Solar prospectus detail

on:
  push:
    branches: [tmp-trina-solar-688599-reports-20261016]
    paths: ['.github/workflows/tmp-trina-prospectus-detail-inspect-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect prospectus detail
        shell: bash
        run: |
          set -euo pipefail
          URL='https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=688599&id=6344183'
          curl --http1.1 -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            "$URL" -D headers.txt -o page.raw
          python3 - <<'PY'
          import html,re,pathlib
          raw=pathlib.Path('page.raw').read_bytes()
          for enc in ('utf-8','gb18030','gbk'):
              try: text=raw.decode(enc); break
              except UnicodeDecodeError: pass
          else: text=raw.decode('utf-8',errors='replace')
          text=html.unescape(text)
          print('BYTES',len(raw),'PREFIX',raw[:100])
          pats=[r'https?://[^\s"\'<>]+',r'//[^\s"\'<>]+',r'[^\s"\'<>]{0,200}\.pdf(?:\?[^\s"\'<>]*)?']
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen and any(k in s.lower() for k in ('pdf','download','file','6344183','prospect','attach','notice')):
                      seen.add(s); print('CAND',s[:3000])
          print('--- LINES ---')
          for i,line in enumerate(text.splitlines(),1):
              low=line.lower()
              if any(k in low for k in ('pdf','download','file.finance','6344183','附件','下载','原文','查看')):
                  print(i,re.sub(r'\s+',' ',line).strip()[:5000])
          print('--- FULL FIRST 300 LINES ---')
          for i,line in enumerate(text.splitlines()[:300],1):
              print(i,re.sub(r'\s+',' ',line).strip()[:2000])
          PY
