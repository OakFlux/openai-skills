name: Temporary targeted Yuexiu Hibor public image inspection

on:
  push:
    branches:
      - tmp-yuexiu-hibor-targeted-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect exact public images
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          mkdir -p output
          python - <<'PY'
          import html, io, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          out=Path('output')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          pages={
            'west_20260429':'https://www.microbell.com/repinfodetail_5101524.html',
            'dongxing_20260401_mobile':'https://wap.hibor.com.cn/repinfodetail_5018836.html',
            'dongxing_20260401_desktop':'https://www.microbell.com/repinfodetail_5018836.html',
          }
          exact=['https://huibobjb.hibor.com.cn/CheckMd5File/img/2026/4/20260429221846597.gif']
          found=[]
          for key,u in pages.items():
            try:
              r=s.get(u,timeout=20,allow_redirects=True)
              print('PAGE',key,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              raw=html.unescape(r.text).replace('\\/','/')
              (out/f'{key}.html').write_text(raw,encoding='utf-8')
              soup=BeautifulSoup(raw,'html.parser')
              print('TITLE',key,soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(True):
                for a in ['src','href','data-src','data-original','data-url','content']:
                  v=tag.get(a)
                  if isinstance(v,str):
                    full=urljoin(r.url,v)
                    if 'CheckMd5File/img/' in full or 'huibobjb.hibor.com.cn' in full:
                      found.append(full); print('FOUND',key,tag.name,a,full)
              for m in re.findall(r'https?://[^\"\'<>\\\s]+',raw):
                if 'CheckMd5File/img/' in m or 'huibobjb.hibor.com.cn' in m:
                  found.append(m); print('RAWFOUND',key,m)
            except Exception as e: print('PAGEERR',key,repr(e))

          urls=list(dict.fromkeys(exact+found))
          metadata=[]
          for idx,u in enumerate(urls,1):
            try:
              r=s.get(u,timeout=20,headers={'Referer':'https://www.microbell.com/','User-Agent':s.headers['User-Agent']})
              print('IMAGE_FETCH',idx,r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.headers.get('content-length'))
              p=out/f'image_{idx:02d}.bin'; p.write_bytes(r.content)
              try:
                im=Image.open(io.BytesIO(r.content))
                n=getattr(im,'n_frames',1)
                meta={'url':r.url,'format':im.format,'size':list(im.size),'mode':im.mode,'frames':n,'bytes':len(r.content)}
                print('IMAGE_META',json.dumps(meta,ensure_ascii=False)); metadata.append(meta)
                for fi in range(n):
                  im.seek(fi)
                  frame=im.convert('RGB')
                  frame.save(out/f'image_{idx:02d}_frame_{fi+1:02d}.png')
              except Exception as e: print('IMAGE_PARSE_ERR',idx,repr(e),r.content[:100])
            except Exception as e: print('IMAGE_ERR',idx,u,repr(e))
          (out/'metadata.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yuexiu-hibor-targeted-inspection
          path: output
          retention-days: 1
