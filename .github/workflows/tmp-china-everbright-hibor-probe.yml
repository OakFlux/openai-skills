name: Temporary China Everbright Hibor attachment probe

on:
  push:
    branches:
      - tmp/china-everbright-hibor-probe-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Inspect report pages and attachment URLs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests, urllib.parse
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer':'https://www.hibor.com.cn/',
          })
          urls=[
              'https://www.hibor.com.cn/repinfodetail_5073681.html',
              'https://wap.hibor.com.cn/repinfodetail_5073681.html',
              'https://p.hibor.com.cn/repinfodetail_5073681.html',
              'https://web.hibor.com.cn/repinfodetail_5073681.html',
          ]
          for u in urls:
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  print('\n===',u,'STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url,flush=True)
                  r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                  html=r.text
                  print('START',repr(html[:1000]),flush=True)
                  print('END',repr(html[-2000:]),flush=True)
                  soup=BeautifulSoup(html,'lxml')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None,flush=True)
                  text=soup.get_text('\n',strip=True)
                  print('TEXT_LEN',len(text),'TEXT_START',repr(text[:1500]),'TEXT_END',repr(text[-2000:]),flush=True)
                  links=[]
                  for tag in soup.find_all(['a','iframe','embed','object','img','script','source']):
                      for attr in ['href','src','data','data-src','value','action']:
                          val=tag.get(attr)
                          if val:
                              full=urllib.parse.urljoin(r.url,val)
                              if any(k in full.lower() for k in ['pdf','download','report','file','attach','view','repinfo','document']):
                                  links.append((tag.name,attr,full,tag.get_text(' ',strip=True)[:80],dict(tag.attrs)))
                  print('LINKS',json.dumps(links[:300],ensure_ascii=False),flush=True)

                  all_urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',html)))
                  print('RAW_URLS',json.dumps([x for x in all_urls if any(k in x.lower() for k in ['pdf','download','report','file','attach'])][:300],ensure_ascii=False),flush=True)
                  for idx,script in enumerate(soup.find_all('script')):
                      val=script.string or script.get_text('',strip=False)
                      if val and any(k in val.lower() for k in ['pdf','download','5073681','report','fileurl','attach']):
                          print('SCRIPT',idx,'SRC',script.get('src'),'LEN',len(val),'START',repr(val[:3000]),'END',repr(val[-3000:]),flush=True)
              except Exception as e:
                  print('ERROR',u,repr(e),flush=True)
          PY
