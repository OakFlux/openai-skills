name: Search Eastmoney general report API for 2021 Huabao deep report

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-eastmoney-huabao-2021-title-search.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query general report lists
        run: |
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list2'
          variants=[
            {'code':'','qType':0}, {'code':'*','qType':0}, {'code':None,'qType':0},
            {'code':'','qType':1}, {'code':'*','qType':1}, {'code':None,'qType':1},
            {'code':'','qType':2}, {'code':'*','qType':2}, {'code':None,'qType':2},
          ]
          for v in variants:
            print('\nVARIANT',v,flush=True)
            for page in range(1,16):
              body={'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':'2021-06-01','endTime':'2021-06-20','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':'',**v}
              if v['code'] is None: body.pop('code',None)
              try:
                r=s.post(api,json=body,timeout=(10,50))
                print('PAGE',page,r.status_code,len(r.content),r.text[:120].replace('\n',' '),flush=True)
                if not r.ok: break
                j=r.json(); rows=j.get('data') or []
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False)
                  if any(k in blob for k in ['华宝国际','華寶國際','香精、薄片','新型烟草蓄势待发','00336']):
                    print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                total=int(j.get('TotalPage') or 0)
                if not rows or (total and page>=total): break
              except Exception as e:
                print('FAIL',page,repr(e),flush=True); break
              time.sleep(.2)
          PY
