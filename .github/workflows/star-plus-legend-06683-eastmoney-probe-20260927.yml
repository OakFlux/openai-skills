name: Probe Star Plus Legend 06683 broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/star-plus-legend-06683-eastmoney-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml feedparser

      - name: Query report APIs and public search results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p star_plus_legend_probe
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin

          import feedparser
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('star_plus_legend_probe')
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          def parse_jsonp(resp):
              try:
                  return resp.json()
              except Exception:
                  text = resp.text.strip()
                  m = re.search(r'^[^(]*\((.*)\)\s*;?$', text, re.S)
                  if m:
                      return json.loads(m.group(1))
                  raise

          api = 'https://reportapi.eastmoney.com/report/list'
          results = {'queries': [], 'matches': [], 'search_links': [], 'pdf_probes': []}
          seen = set()
          code_variants = ['06683','6683','HK06683','06683.HK','116.06683','STAR PLUS LEGEND']
          qtypes = ['0','1']
          for code in code_variants:
              for qtype in qtypes:
                  params = {
                      'industryCode':'*','pageSize':'200','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':'2023-01-01','endTime':'2026-09-27','pageNo':'1','fields':'',
                      'qType':qtype,'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
                  }
                  try:
                      r = s.get(api, params=params, timeout=(20,90)); r.raise_for_status()
                      data = parse_jsonp(r)
                      rows = data.get('data') or data.get('Data') or [] if isinstance(data,dict) else []
                      rec = {'code':code,'qType':qtype,'url':r.url,'count':len(rows),'keys':list(data) if isinstance(data,dict) else None}
                      results['queries'].append(rec)
                      print('QUERY', json.dumps(rec, ensure_ascii=False), flush=True)
                      for row in rows:
                          text = json.dumps(row, ensure_ascii=False)
                          low = text.lower()
                          if any(k in low for k in ['巨星传奇','巨星傳奇','star plus legend','06683','6683.hk']):
                              key = str(row.get('infoCode') or row.get('info_code') or row.get('id') or text)
                              if key not in seen:
                                  seen.add(key); results['matches'].append(row)
                                  print('MATCH', text, flush=True)
                  except Exception as e:
                      results['queries'].append({'code':code,'qType':qtype,'error':repr(e)})
                  time.sleep(0.25)

          # Search Bing RSS and standard HTML for titles/source pages.
          queries = [
              '"巨星传奇" 券商 研报',
              '"巨星传奇" 首次覆盖 报告',
              '"巨星传奇" 公司深度 PDF',
              '"Star Plus Legend" research report PDF',
              '"6683 HK" equity research PDF',
              'site:pdf.dfcfw.com 巨星传奇',
              'site:research.cmbi.com.hk "Star Plus Legend"',
              'site:hk-offering.com 巨星传奇 研报',
          ]
          links = []
          for q in queries:
              try:
                  rss_url = 'https://www.bing.com/search?format=rss&q=' + quote_plus(q)
                  feed = feedparser.parse(s.get(rss_url, timeout=(20,60)).content)
                  for ent in feed.entries:
                      links.append({'query':q,'title':ent.get('title',''),'url':ent.get('link',''),'summary':ent.get('summary','')})
              except Exception as e:
                  links.append({'query':q,'error':repr(e)})
              try:
                  html_url = 'https://www.bing.com/search?q=' + quote_plus(q)
                  rr=s.get(html_url,timeout=(20,60));
                  soup=BeautifulSoup(rr.text,'lxml')
                  for a in soup.select('li.b_algo h2 a')[:20]:
                      links.append({'query':q,'title':a.get_text(' ',strip=True),'url':a.get('href','')})
              except Exception:
                  pass
          # Dedupe and retain relevant.
          dedup=[]; seen_links=set()
          for x in links:
              u=x.get('url','')
              if not u or u in seen_links: continue
              seen_links.add(u)
              t=(x.get('title','')+' '+x.get('summary','')+' '+u).lower()
              if any(k in t for k in ['巨星','star plus','06683','6683','dfcfw','research','report','研报']): dedup.append(x)
          results['search_links']=dedup
          print('SEARCH_LINKS', json.dumps(dedup,ensure_ascii=False,indent=2), flush=True)

          # Probe standard Eastmoney PDF URL variants for every matched infoCode.
          for row in results['matches']:
              ic=str(row.get('infoCode') or row.get('info_code') or '').strip()
              if not ic: continue
              variants=[
                  f'https://pdf.dfcfw.com/pdf/H3_{ic}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{ic}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{ic}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{ic}.pdf',
              ]
              for u in variants:
                  try:
                      r=s.get(u,timeout=(20,60),stream=True,allow_redirects=True)
                      head=next(r.iter_content(16),b'') if r.status_code==200 else b''
                      probe={'infoCode':ic,'url':u,'status':r.status_code,'type':r.headers.get('content-type'),'length':r.headers.get('content-length'),'head':repr(head[:8])}
                      results['pdf_probes'].append(probe)
                      print('PDF_PROBE',json.dumps(probe,ensure_ascii=False),flush=True)
                  except Exception as e:
                      results['pdf_probes'].append({'infoCode':ic,'url':u,'error':repr(e)})

          (OUT/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'matches.json').write_text(json.dumps(results['matches'],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'search_links.json').write_text(json.dumps(results['search_links'],ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: star-plus-legend-06683-broker-probe
          path: star_plus_legend_probe
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
