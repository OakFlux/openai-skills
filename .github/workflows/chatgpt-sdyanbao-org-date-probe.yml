name: Probe Sdyanbao by organization and date for Huabao report

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-sdyanbao-org-date-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Query candidate filters
        run: |
          python - <<'PY'
          import json, urllib.request
          api='https://api.sdyanbao.com/api/file/search'
          variants=[]
          base={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':100,'keyword':'','pageCount':'','dateRange':'2021-06-01,2021-06-30','startTime':'2021-06-01','endTime':'2021-06-30','typeIds':[],'industryIds':[],'opFrom':1}
          for field,val in [
              ('organizationIds',[154]),('organization_ids',[154]),('organizationId',154),('organization_id',154),('orgIds',[154]),('orgId',154),
              ('researcherIds',[8298]),('researcherId',8298),('keyword','华宝国际'),('keyword','香精'),('keyword','薄片')
          ]:
              b=dict(base); b[field]=val; variants.append((field,val,b))
          for field,val,b in variants:
              req=urllib.request.Request(api,data=json.dumps(b,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=60) as r: p=json.loads(r.read().decode())
                  rows=(p.get('data') or {}).get('files') or []
                  print('\nVARIANT',field,repr(val),'TOTAL',(p.get('data') or {}).get('total'),'ROWS',len(rows),flush=True)
                  for x in rows:
                      blob=json.dumps(x,ensure_ascii=False)
                      if any(k in blob for k in ['华宝国际','新型烟草','薄片','香精']) or field not in ('keyword',):
                          print(json.dumps({'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'pages':x.get('page_count'),'page_url':x.get('page_url'),'org':(x.get('organization') or {}).get('name'),'uuid':x.get('data_source_uuid'),'stock':x.get('stock'),'content_array':x.get('content_array')},ensure_ascii=False),flush=True)
              except Exception as e: print('FAIL',field,repr(val),repr(e),flush=True)
          PY
