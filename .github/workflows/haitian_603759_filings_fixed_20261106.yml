name: package-haitian-603759-filings-fixed

on:
  push:
    branches:
      - tmp/haitian-603759-filings-20261106-v2

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Download validate and package documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          COMPANY = "海天水务集团股份公司"
          SHORT_NAME = "海天股份"
          CODE = "603759"
          PREPARED = "2026-11-06"
          ROOT_NAME = "海天股份_603759_所有年报_招股说明书及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  "sequence": 1,
                  "category": "年度报告",
                  "period": "2020年年度报告",
                  "announcement_date": "2021-04-20",
                  "bulletin_id": "7066617",
                  "detail_url": "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7066617&stockid=603759",
                  "filename": "01_2020年年度报告.pdf",
                  "minimum_pages": 100,
                  "period_markers": ["2020年年度报告", "2020年度报告"],
              },
              {
                  "sequence": 2,
                  "category": "年度报告",
                  "period": "2021年年度报告",
                  "announcement_date": "2022-04-12",
                  "bulletin_id": "7977647",
                  "detail_url": "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7977647&stockid=603759",
                  "filename": "02_2021年年度报告.pdf",
                  "minimum_pages": 100,
                  "period_markers": ["2021年年度报告", "2021年度报告"],
              },
              {
                  "sequence": 3,
                  "category": "年度报告",
                  "period": "2022年年度报告",
                  "announcement_date": "2023-04-26",
                  "bulletin_id": "9093459",
                  "detail_url": "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9093459&stockid=603759",
                  "filename": "03_2022年年度报告.pdf",
                  "minimum_pages": 100,
                  "period_markers": ["2022年年度报告", "2022年度报告"],
              },
              {
                  "sequence": 4,
                  "category": "年度报告",
                  "period": "2023年年度报告",
                  "announcement_date": "2024-03-20",
                  "bulletin_id": "9883213",
                  "detail_url": "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9883213&stockid=603759",
                  "filename": "04_2023年年度报告.pdf",
                  "minimum_pages": 100,
                  "period_markers": ["2023年年度报告", "2023年度报告"],
              },
              {
                  "sequence": 5,
                  "category": "年度报告",
                  "period": "2024年年度报告",
                  "announcement_date": "2025-03-06",
                  "bulletin_id": "10771304",
                  "detail_url": "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10771304&stockid=603759",
                  "filename": "05_2024年年度报告.pdf",
                  "minimum_pages": 100,
                  "period_markers": ["2024年年度报告", "2024年度报告"],
              },
              {
                  "sequence": 6,
                  "category": "年度报告",
                  "period": "2025年年度报告",
                  "announcement_date": "2026-04-30",
                  "bulletin_id": "12284610",
                  "detail_url": "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12284610&stockid=603759",
                  "filename": "06_2025年年度报告.pdf",
                  "minimum_pages": 100,
                  "period_markers": ["2025年年度报告", "2025年度报告"],
              },
              {
                  "sequence": 7,
                  "category": "招股说明书",
                  "period": "首次公开发行股票招股说明书（最终发行版）",
                  "announcement_date": "2021-02-23",
                  "bulletin_id": "6912942",
                  "detail_url": "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=6912942&stockid=603759",
                  "filename": "07_首次公开发行股票招股说明书_最终发行版.pdf",
                  "minimum_pages": 300,
                  "period_markers": ["首次公开发行股票招股说明书", "首次公开发行股票并上市招股说明书"],
              },
              {
                  "sequence": 8,
                  "category": "季度报告",
                  "period": "2026年第三季度报告",
                  "announcement_date": "2026-10-31",
                  "direct_urls": [
                      "https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-31/603759_20261031_AQV6.pdf",
                      "http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-31/603759_20261031_AQV6.pdf",
                  ],
                  "filename": "08_2026年第三季度报告.pdf",
                  "minimum_pages": 5,
                  "period_markers": ["2026年第三季度报告", "2026年三季度报告"],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def compact(value: str) -> str:
              return re.sub(r"\s+", "", value or "")

          def detail_variants(url: str) -> list[str]:
              variants = [url]
              if "money.finance.sina.com.cn" in url:
                  variants.append(url.replace("money.finance.sina.com.cn", "vip.stock.finance.sina.com.cn"))
              if "vip.stock.finance.sina.com.cn" in url:
                  variants.append(url.replace("vip.stock.finance.sina.com.cn", "money.finance.sina.com.cn"))
              return list(dict.fromkeys(variants))

          def decode_candidates(content: bytes) -> list[str]:
              values: list[str] = []
              for encoding in ["utf-8", "gb18030", "gbk", "latin-1"]:
                  try:
                      values.append(content.decode(encoding, errors="ignore"))
                  except Exception:
                      pass
              return values

          def resolve_sina_pdf(document: dict) -> tuple[list[str], str]:
              found: list[str] = []
              page_used = ""
              for page_url in detail_variants(document["detail_url"]):
                  for attempt in range(4):
                      try:
                          response = session.get(page_url, timeout=(30, 180), allow_redirects=True)
                          print("DETAIL", document["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          page_used = response.url
                          for text in decode_candidates(response.content):
                              expanded_texts = [text, urllib.parse.unquote(text), html.unescape(text)]
                              for expanded in expanded_texts:
                                  soup = BeautifulSoup(expanded, "html.parser")
                                  for tag in soup.find_all(["a", "iframe", "embed", "object"]):
                                      for attr in ["href", "src", "data"]:
                                          value = tag.get(attr)
                                          if value:
                                              value = html.unescape(str(value)).strip()
                                              if ".pdf" in value.lower() or "download" in value.lower():
                                                  found.append(urllib.parse.urljoin(response.url, value))
                                  patterns = [
                                      r"https?://file\.finance\.sina\.com\.cn/[^\"'<>\s]+?\.pdf(?:\?[^\"'<>\s]*)?",
                                      r"//file\.finance\.sina\.com\.cn/[^\"'<>\s]+?\.pdf(?:\?[^\"'<>\s]*)?",
                                      r"https?://[^\"'<>\s]+?\.pdf(?:\?[^\"'<>\s]*)?",
                                  ]
                                  for pattern in patterns:
                                      for match in re.findall(pattern, expanded, flags=re.IGNORECASE):
                                          value = "https:" + match if match.startswith("//") else match
                                          found.append(html.unescape(value))
                          if found:
                              break
                      except Exception as exc:
                          print("DETAIL_ERROR", document["period"], attempt, page_url, repr(exc))
                          time.sleep(1 + attempt)
                  if found:
                      break

              date = document["announcement_date"]
              year = date[:4]
              month = date[:7]
              bulletin_id = document["bulletin_id"]
              guessed = [
                  f"http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/{year}/{month}/{date}/{bulletin_id}.PDF",
                  f"https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/{year}/{month}/{date}/{bulletin_id}.PDF",
                  f"http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/{year}/{month}/{date}/{bulletin_id}.PDF",
              ]
              found.extend(guessed)
              cleaned: list[str] = []
              for value in found:
                  value = html.unescape(urllib.parse.unquote(str(value))).replace(" ", "%20")
                  if value.lower().startswith(("http://", "https://")):
                      cleaned.append(value)
              cleaned = list(dict.fromkeys(cleaned))
              print("PDF_CANDIDATES", document["period"], json.dumps(cleaned, ensure_ascii=False, indent=2))
              return cleaned, page_used

          def download_pdf(document: dict) -> tuple[bytes, str, str]:
              if document.get("direct_urls"):
                  urls = list(document["direct_urls"])
                  referer = "https://www.sse.com.cn/"
              else:
                  urls, detail_page = resolve_sina_pdf(document)
                  referer = detail_page or document["detail_url"]
              variants: list[str] = []
              for url in urls:
                  variants.extend([url, url + ("&download=1" if "?" in url else "?download=1")])
              last_error: Exception | None = None
              for url in dict.fromkeys(variants):
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 480),
                              allow_redirects=True,
                              headers={"Accept": "application/pdf,*/*;q=0.8", "Referer": referer},
                          )
                          print("DOWNLOAD", document["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          if response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                              return response.content, response.url, response.headers.get("content-type", "")
                          last_error = RuntimeError(f"Not a valid PDF response: {response.content[:80]!r}")
                      except Exception as exc:
                          last_error = exc
                          print("DOWNLOAD_ERROR", document["period"], attempt, url, repr(exc))
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to download {document['period']}: {last_error}")

          manifest: list[dict] = []
          accepted_names = [COMPANY, SHORT_NAME, CODE, "海天水务集团"]

          for document in documents:
              data, final_url, content_type = download_pdf(document)
              output = PDF_DIR / document["filename"]
              output.write_bytes(data)

              with output.open("rb") as handle:
                  if handle.read(5) != b"%PDF-":
                      raise RuntimeError(f"Invalid PDF header: {output.name}")

              reader = PdfReader(str(output), strict=False)
              pages = len(reader.pages)
              if pages < document["minimum_pages"]:
                  raise RuntimeError(f"Document too short: {output.name}: {pages} pages")

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {output.name}: {qpdf.stdout}")

              text_run = subprocess.run(
                  ["pdftotext", "-f", "1", "-l", str(min(30, pages)), str(output), "-"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              text_compact = compact(text_run.stdout)
              issuer_hits = [marker for marker in accepted_names if compact(marker) in text_compact]
              period_hits = [marker for marker in document["period_markers"] if compact(marker) in text_compact]
              if not issuer_hits:
                  raise RuntimeError(f"Issuer validation failed for {output.name}")
              if not period_hits:
                  raise RuntimeError(f"Document type/period validation failed for {output.name}")

              prefix = PREVIEW_DIR / output.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 6_000:
                  raise RuntimeError(f"Preview rendering failed for {output.name}: {render.stdout}")

              record = {
                  "sequence": document["sequence"],
                  "category": document["category"],
                  "period": document["period"],
                  "announcement_date": document["announcement_date"],
                  "filename": document["filename"],
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": final_url,
                  "content_type": content_type,
                  "issuer_marker_hits": issuer_hits,
                  "period_marker_hits": period_hits,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(record)
              print("VALIDATED", json.dumps(record, ensure_ascii=False))

          if len(manifest) != 8:
              raise RuntimeError(f"Expected 8 documents, got {len(manifest)}")

          readme = [
              f"{COMPANY}（{CODE}.SH）全部年度报告、首次公开发行股票招股说明书及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：2020—2025年年度报告全文共6份、2021年首次公开发行股票招股说明书最终发行版1份，以及截至整理日最新独立季度报告——2026年第三季度报告1份。",
              "招股说明书采用2021年2月23日披露的最终发行版，未使用招股意向书、摘要、申报稿或上市公告书替代。",
              "年度报告均为完整正文，已排除年度报告摘要和其他附件。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   类型：{item['category']}；报告：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、报告期间/文件类型、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_文件清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "document_count": len(manifest),
              "annual_report_count": 6,
              "prospectus_count": 1,
              "latest_quarter": "2026年第三季度报告",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "类型", "报告", "公告日期", "文件名", "页数", "字节数", "SHA-256", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["category"], item["period"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"],
                      item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("haitian_603759_all_annual_prospectus_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              previews = [name for name in archive.namelist() if name.lower().endswith(".png")]
              if bad is not None or len(pdf_names) != 8 or len(previews) != 8:
                  raise RuntimeError(f"ZIP validation failed: bad={bad}, pdfs={len(pdf_names)}, previews={len(previews)}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "document_count": len(manifest),
              "annual_report_count": 6,
              "prospectus_count": 1,
              "latest_quarter": "2026年第三季度报告",
              "files": [{k: item[k] for k in ["category", "period", "announcement_date", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: haitian-603759-filings-fixed-20261106
          path: |
            haitian_603759_all_annual_prospectus_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
