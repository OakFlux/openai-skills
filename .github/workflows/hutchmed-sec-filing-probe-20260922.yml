name: Probe HUTCHMED SEC prospectus filing 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-sec-filing-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query SEC submissions
        run: |
          python - <<'PY'
          import json, requests
          from pathlib import Path

          s=requests.Session()
          s.trust_env=False
          s.headers.update({'User-Agent':'Academic research archive contact jiamlu@outlook.com','Accept-Encoding':'gzip, deflate','Host':'data.sec.gov'})
          j=s.get('https://data.sec.gov/submissions/CIK0001648257.json',timeout=60).json()
          out=[]
          recent=j.get('filings',{}).get('recent',{})
          keys=['accessionNumber','filingDate','reportDate','acceptanceDateTime','act','form','fileNumber','filmNumber','items','size','isXBRL','isInlineXBRL','primaryDocument','primaryDocDescription']
          n=len(recent.get('accessionNumber',[]))
          for i in range(n):
            row={k:(recent.get(k,[None]*n)[i] if i < len(recent.get(k,[])) else None) for k in keys}
            if str(row.get('filingDate','')).startswith(('2015','2016','2017')) or row.get('form') in ('424B4','F-1','F-1/A'):
              out.append(row)
          for old in j.get('filings',{}).get('files',[]):
            name=old.get('name')
            if not name: continue
            u='https://data.sec.gov/submissions/'+name
            jj=s.get(u,timeout=60).json()
            nn=len(jj.get('accessionNumber',[]))
            for i in range(nn):
              row={k:(jj.get(k,[None]*nn)[i] if i < len(jj.get(k,[])) else None) for k in keys}
              if str(row.get('filingDate','')).startswith(('2015','2016','2017')) or row.get('form') in ('424B4','F-1','F-1/A'):
                out.append(row)
          out=sorted(out,key=lambda x:(x.get('filingDate') or '',x.get('accessionNumber') or ''))
          Path('sec_filings.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-sec-filing-probe
          path: sec_filings.json
          if-no-files-found: error
          retention-days: 7
