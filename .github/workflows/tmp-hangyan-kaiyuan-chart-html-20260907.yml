name: Save Hangyan chart HTML
on:
  push:
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch chart page
        run: |
          mkdir -p out
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.hangyan.co/charts/3388540536716527430' -o out/chart.html
          wc -c out/chart.html
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-kaiyuan-chart-html
          path: out
          retention-days: 1
          compression-level: 0
