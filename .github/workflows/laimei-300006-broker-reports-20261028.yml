name: Build Laimei Pharmaceutical 300006 broker deep reports 20261028

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY='莱美药业'
          COMPANY_FULL='重庆莱美药业股份有限公司'
          STOCK_CODE='300006'
          AS_OF='2026-10-28'
          PACKAGE='莱美药业_300006_券商深度报告_完整版_3份_截至20261028'
          ROOT=Path(PACKAGE)
          PDF_DIR=ROOT/'PDF原文'
          PREVIEW_DIR=ROOT/'首页预览'
          PDF_DIR.mkdir(parents=True,exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True,exist_ok=True)

          reports=[
              {
                  'info_code':'AP202509191746631898',
                  'report_date':'2025-09-13',
                  'broker':'西南证券',
                  'title':'聚焦核心产品卡纳琳的多适应症拓展和出海进程，同步建设“仿创结合”研发管线梯队',
                  'analysts':'杜向阳、陈辰',
                  'rating':'首次覆盖建议关注',
                  'min_pages':15,
              },
              {
                  'info_code':'AP201905051326661322',
                  'report_date':'2019-05-05',
                  'broker':'西南证券',
                  'title':'高壁垒产品线护城河，政策免疫业绩增长快',
                  'analysts':'以PDF首页为准',
                  'rating':'买入',
                  'min_pages':12,
              },
              {
                  'info_code':'AP201608180017156387',
                  'report_date':'2016-08-16',
                  'broker':'广证恒生',
                  'title':'专科药放量进入提速期的拐点型黑马',
                  'analysts':'王亮、唐爱金',
                  'rating':'强烈推荐（首次）',
                  'min_pages':15,
              },
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/pdf,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe_name(s:str)->str:
              s=re.sub(r'[\\/:*?"<>|]+','_',str(s or ''))
              s=re.sub(r'\s+','',s).strip('._')
              return s[:100] or '报告'

          def download_pdf(code:str):
              urls=[
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf',
              ]
              last={}
              for url in urls:
                  for attempt in range(7):
                      try:
                          r=session.get(url,timeout=(25,360),allow_redirects=True)
                          last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                          if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                              return r.content,url,last
                      except Exception as exc:
                          last={'url':url,'error':repr(exc)}
                      time.sleep(1+attempt)
              raise RuntimeError(f'download failed {code}: {last}')

          manifest=[]
          for idx,spec in enumerate(reports,1):
              data,url,meta=download_pdf(spec['info_code'])
              filename=f"{idx:02d}_{safe_name(spec['broker'])}_莱美药业_{safe_name(spec['title'])}_{spec['report_date']}.pdf"
              dest=PDF_DIR/filename
              dest.write_bytes(data)

              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages<spec['min_pages']:
                  raise RuntimeError(f'too few pages: {filename}: {pages} < {spec["min_pages"]}')
              text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(20,pages)])
              compact=re.sub(r'\s+','',text)
              if not any(k in compact for k in [COMPANY,COMPANY_FULL,STOCK_CODE]):
                  raise RuntimeError(f'issuer mismatch: {filename}')
              title_key=re.sub(r'[，、“”"：:（）()\s]','',spec['title'])[:14]
              compact_loose=re.sub(r'[，、“”"：:（）()\s]','',text)
              title_check=title_key in compact_loose
              if not title_check:
                  print('TITLE_TEXT_WARNING',filename,title_key)

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREVIEW_DIR/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000:
                  raise RuntimeError(f'preview failed: {filename}')

              first_page=(reader.pages[0].extract_text() or '')
              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  **spec,
                  'filename':filename,
                  'actual_pages':pages,
                  'bytes':len(data),
                  'pdf_url':url,
                  'source_report_page':f"https://data.eastmoney.com/report/info/{spec['info_code']}.html",
                  'sha256':sha,
                  'download_meta':meta,
                  'issuer_identity_check':True,
                  'title_text_check':title_check,
                  'first_page_text':first_page[:5000],
                  'preview_file':str(Path('首页预览')/preview.name),
                  'validation':['PDF header','issuer identity','minimum page count','qpdf structure','first-page render'],
              })

          readme=[
              '重庆莱美药业股份有限公司（300006.SZ）券商深度报告资料包',
              f'整理基准日：{AS_OF}',
              '',
              f'本包收录{len(manifest)}份公开可直接取得并完成全文核验的券商原始完整PDF。',
              '筛选标准：优先公司深度、首次覆盖和公司级研究报告；排除年报、季报、半年报和事件短评。',
              '',
          ]
          for i,m in enumerate(manifest,1):
              readme += [
                  f"{i}. {m['broker']}：《{m['title']}》",
                  f"   报告日期：{m['report_date']}；分析师：{m['analysts']}；评级：{m['rating']}",
                  f"   完整页数：{m['actual_pages']}页；文件：PDF原文/{m['filename']}",
                  f"   来源页面：{m['source_report_page']}",
                  f"   SHA-256：{m['sha256']}",
                  '',
              ]
          readme += [
              '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip()
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3:
                  raise RuntimeError(f'zip validation failed: bad={bad}, pdfs={len(pdfs)}')

          short=Path('laimei_300006_broker_deep_reports.zip')
          short.write_bytes(zip_path.read_bytes())
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'SHA256',hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print('REPORT_COUNT',len(manifest))
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: laimei-300006-broker-deep-reports-final-20261028
          path: |
            莱美药业_300006_券商深度报告_完整版_3份_截至20261028.zip
            laimei_300006_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
