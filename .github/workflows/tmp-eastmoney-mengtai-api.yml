name: Temporary Inspect Eastmoney Mengtai Report APIs

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-eastmoney-mengtai-api.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect GET, POST and report page scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests,time
          from urllib.parse import urljoin
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/300876.html','Accept':'application/json,text/plain,*/*','Content-Type':'application/json'})
          base={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2020-01-01','endTime':'2026-08-30','code':'300876','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','author':'','rcode':'','qType':'0','fields':''}
          tests=[]
          for code in ['300876','sz300876','300876.SZ','SZ300876']:
            for qtype in ['0','1','2']:
              p=dict(base);p['code']=code;p['qType']=qtype;p['_']=str(int(time.time()*1000))
              tests.append(('GET','https://reportapi.eastmoney.com/report/list',p))
          for name,url,payload in [
            ('POST','https://reportapi.eastmoney.com/report/list2',dict(base)),
            ('POST','https://reportapi.eastmoney.com/report/list',dict(base)),
          ]:
            tests.append((name,url,payload))
          for method,url,data in tests:
            try:
              if method=='GET': r=s.get(url,params=data,timeout=45)
              else:r=s.post(url,json=data,timeout=45)
              text=r.text
              print('API_TEST='+json.dumps({'method':method,'url':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'body':text[:1500]},ensure_ascii=False))
            except Exception as e:print('API_TEST='+json.dumps({'method':method,'url':url,'error':repr(e)},ensure_ascii=False))
          page='https://data.eastmoney.com/report/300876.html'
          r=s.get(page,timeout=60); text=r.text
          print('PAGE_STATUS',r.status_code,len(r.content),r.url)
          scripts=[urljoin(r.url,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)]
          print('SCRIPTS='+json.dumps(scripts,ensure_ascii=False))
          for u in scripts:
            if any(k in u.lower() for k in ['report','research','main','common','data']):
              try:
                q=s.get(u,timeout=60); body=q.text
                hits=[]
                for needle in ['reportapi','list2','report/list','infoCode','publishDate','qType']:
                  for m in list(re.finditer(needle,body,re.I))[:10]: hits.append(re.sub(r'\s+',' ',body[max(0,m.start()-300):m.start()+800]))
                if hits:print('SCRIPT_HITS='+json.dumps({'url':u,'status':q.status_code,'bytes':len(q.content),'hits':hits[:40]},ensure_ascii=False))
              except Exception as e:print('SCRIPT_ERR',u,repr(e))
          PY
