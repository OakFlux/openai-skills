name: Package Kent 301591 selected reports 20261020 v6

on:
  push:
    branches:
      - tmp/kent-301591-selected-reports-20261020-v6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml weasyprint

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, html, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          CODE='301591'; SHORT='肯特股份'; FULL='南京肯特复合材料股份有限公司'
          PACKAGE='肯特股份_301591_券商研究报告_2份'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREVIEW=ROOT/'首页预览'; PREVIEW.mkdir(exist_ok=True)
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          def validate(path,min_pages,tokens):
              if path.read_bytes()[:5] != b'%PDF-': raise RuntimeError('bad PDF header '+path.name)
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              if pages<min_pages: raise RuntimeError(f'too few pages {path.name}: {pages}')
              text=''
              for p in reader.pages[:min(35,pages)]:
                  try: text+='\n'+(p.extract_text() or '')
                  except Exception: pass
              if not all(t in text for t in tokens):
                  raise RuntimeError(f'text validation failed {path.name}: {tokens}')
              subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREVIEW/path.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(path),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              png=Path(str(prefix)+'.png')
              if not png.exists() or png.stat().st_size<5000: raise RuntimeError('preview failed '+path.name)
              return pages

          def get_pdf(info_code):
              last={}
              for host in ['H3','H2','H1','H4']:
                  url=f'https://pdf.dfcfw.com/pdf/{host}_{info_code}_1.pdf'
                  for attempt in range(6):
                      try:
                          r=s.get(url,headers={'User-Agent':UA,'Referer':f'https://data.eastmoney.com/report/info/{info_code}.html','Accept':'application/pdf,*/*;q=0.8'},timeout=(30,420),allow_redirects=True)
                          last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                          if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000: return r.content,url,last
                      except Exception as e: last={'url':url,'error':repr(e)}
                      time.sleep(1+attempt)
              raise RuntimeError('download failed '+json.dumps(last,ensure_ascii=False))

          records=[]

          # HuaJin original PDF.
          info='AP202402011620033334'
          data,pdf_url,meta=get_pdf(info)
          p1=ROOT/'01_20240201_华金证券_新股覆盖研究_肯特股份_原始PDF.pdf'
          p1.write_bytes(data)
          pages1=validate(p1,10,['肯特股份'])
          records.append({
            'filename':p1.name,'document_form':'券商原始PDF','broker':'华金证券','authors':'李蕙','date':'2024-02-01',
            'title':'新股覆盖研究：肯特股份','pages':pages1,'bytes':p1.stat().st_size,'sha256':sha(p1),
            'source':'https://data.eastmoney.com/report/info/AP202402011620033334.html',
            'note':'公开聚合渠道提供的券商原始PDF。','pdf_url':pdf_url,'download_meta':meta
          })

          # ZheShang publicly displayed full text, printed transparently as a non-original PDF.
          source='https://www.9fzt.com/detail/sz_301591_10_754040529033.html'
          r=s.get(source,timeout=(30,180),allow_redirects=True); r.raise_for_status()
          r.encoding=r.apparent_encoding or 'utf-8'
          soup=BeautifulSoup(r.text,'lxml')
          title_node=soup.select_one('.title-header'); body=soup.select_one('.detail-article-content')
          broker_node=soup.select_one('.date-type'); date_node=soup.select_one('.date-time')
          if title_node is None or body is None: raise RuntimeError('public page structure changed')
          for tag in body.find_all(['script','style','iframe','form','button']): tag.decompose()
          title=re.sub(r'\s+',' ',title_node.get_text(' ',strip=True))
          broker=re.sub(r'\s+',' ',broker_node.get_text(' ',strip=True)) if broker_node else '浙商证券股份有限公司'
          report_date=re.sub(r'\s+',' ',date_node.get_text(' ',strip=True)) if date_node else '2023-11-23'
          body_text=re.sub(r'\s+',' ',body.get_text(' ',strip=True))
          if '肯特股份' not in title+body_text or len(body_text)<1500: raise RuntimeError('insufficient public report text')
          body_html=str(body)
          doc=f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>{html.escape(title)}</title><style>
          @page {{ size:A4; margin:18mm 17mm 20mm 17mm; @bottom-center {{ content:"公开网页全文整理版 - 第 " counter(page) " 页 / " counter(pages) " 页"; font-size:8.5pt; color:#666; }} }}
          body {{ font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif; font-size:10.5pt; line-height:1.75; color:#222; word-break:break-word; }}
          h1 {{ font-size:20pt; line-height:1.35; margin:0 0 12pt; }}
          .meta {{ font-size:10pt; color:#444; border-bottom:1px solid #bbb; padding-bottom:10pt; margin-bottom:14pt; }}
          .notice {{ border:1.5px solid #a33; background:#fff7f3; padding:10pt 12pt; margin:8pt 0 16pt; font-size:10pt; line-height:1.55; }}
          .source {{ font-size:8.5pt; color:#666; margin-top:6pt; word-break:break-all; }}
          .detail-article-content p {{ margin:0 0 9pt; text-align:justify; }} a {{ color:#333; text-decoration:none; }}
          </style></head><body>
          <h1>{html.escape(title)}</h1>
          <div class="meta">机构：{html.escape(broker)}<br>研究员：黄宇宸、黄海童、芦家宁<br>发布日期：{html.escape(report_date)}</div>
          <div class="notice"><strong>文件性质说明：</strong>本文件依据公开网页所展示的报告全文整理并打印为PDF，<strong>不是浙商证券发布的原始PDF</strong>。原始报告的封面、图表、排版和页码可能未被公开网页保留。本整理版用于便于离线阅读，报告著作权归原券商及作者所有。<div class="source">公开全文来源：{html.escape(source)}</div></div>
          {body_html}</body></html>'''
          p2=ROOT/'02_20231123_浙商证券_新股报告_高性能工程塑料零部件领先企业_公开网页全文整理版_非原始PDF.pdf'
          HTML(string=doc,base_url=source).write_pdf(str(p2))
          pages2=validate(p2,2,['肯特股份','浙商证券','2023-11-23'])
          records.append({
            'filename':p2.name,'document_form':'公开网页全文整理版（非券商原始PDF）','broker':'浙商证券','authors':'黄宇宸、黄海童、芦家宁','date':'2023-11-23',
            'title':'肯特股份新股报告：高性能工程塑料零部件领先企业','pages':pages2,'bytes':p2.stat().st_size,'sha256':sha(p2),
            'source':source,'note':'公开网页全文转为便于离线阅读的PDF；不是券商原始PDF，可能不含原始图表与版式。'
          })

          lines=[f'肯特股份（{CODE}.SZ）券商研究报告资料包',f'整理日期：2026-10-20','',
                 '本包共收录2份公司研究资料。肯特股份上市时间较短，公开渠道可直接下载的完整券商原始PDF较少。',
                 '华金证券文件为原始PDF；浙商证券文件为公开网页全文整理版，非券商原始PDF，文件名和首页均已明确标注。','']
          for i,x in enumerate(records,1):
              lines += [f'{i}. {x["filename"]}',f'   文件性质：{x["document_form"]}',f'   券商：{x["broker"]}；研究员：{x["authors"]}；发布日期：{x["date"]}',
                        f'   标题：{x["title"]}',f'   实际页数：{x["pages"]}页；文件大小：{x["bytes"]}字节',f'   来源页面：{x["source"]}',f'   SHA-256：{x["sha256"]}',f'   说明：{x["note"]}','']
          lines += ['核验项目：PDF文件头、公司名称、报告标题与日期、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。','报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。']
          (ROOT/'README_报告清单与文件性质说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps({'company':SHORT,'full_company_name':FULL,'stock_code':CODE,'prepared_on':'2026-10-20','report_count':2,'files':records},ensure_ascii=False,indent=2),encoding='utf-8')
          with (ROOT/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['文件名','文件性质','券商','研究员','发布日期','标题','页数','字节数','SHA-256','来源页面','说明'])
              for x in records: w.writerow([x['filename'],x['document_form'],x['broker'],x['authors'],x['date'],x['title'],x['pages'],x['bytes'],x['sha256'],x['source'],x['note']])
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in records)+'\n',encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=str(p))
          with zipfile.ZipFile(zpath,'r') as z:
              bad=z.testzip()
              if bad is not None: raise RuntimeError('ZIP CRC failed '+bad)
          print(json.dumps({'package':str(zpath),'zip_bytes':zpath.stat().st_size,'zip_sha256':sha(zpath),'report_count':2,
                            'files':[{'name':x['filename'],'document_form':x['document_form'],'broker':x['broker'],'date':x['date'],'pages':x['pages'],'bytes':x['bytes'],'sha256':x['sha256'],'title':x['title']} for x in records]},ensure_ascii=False,indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: kent-301591-selected-research-reports-20261020-v6
          path: 肯特股份_301591_券商研究报告_2份.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
