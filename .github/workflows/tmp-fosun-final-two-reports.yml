name: Temporary Fosun International final two-report package

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-final-two-reports.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 Pillow img2pdf PyMuPDF pypdf reportlab
      - name: Extract two-report package script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/tmp-fosun-final-package.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          script = textwrap.dedent(workflow.split(marker_start, 1)[1].split(marker_end, 1)[0])

          nested_filter = (
              "    if tag.name != 'img' and any(isinstance(parent, Tag) and parent.name in allowed and parent is not tag for parent in tag.parents if parent is not content_node):\n"
              "        # Skip nested text blocks to avoid duplication; images remain independent.\n"
              "        continue\n"
          )
          script = script.replace(nested_filter, '')
          script = script.replace(
              "if len(article_text) < 20_000 or '风险提示' not in article_text or '盈利预测' not in article_text:",
              "if len(article_text) < 3_000 or '风险提示' not in article_text or '盈利预测' not in article_text:",
          )
          script = script.replace(
              "if mupdf_pages < 30 or len(full_text) < 20_000 or '风险提示' not in full_text:",
              "if mupdf_pages < 30 or len(full_text) < 3_000 or '风险提示' not in full_text:",
          )

          # Remove the unavailable third report and its report-list entry.
          script = re.sub(
              r"\n# Report 3: Industrial Securities.*?xingye_extra = build_image_pdf\(xingye_urls, xingye_pdf, 'https://www\.sdyanbao\.com/'\)\n",
              "\n",
              script,
              flags=re.S,
          )
          script = re.sub(
              r"\n    \{\n        'file': xingye_pdf,.*?\n    \},",
              "",
              script,
              flags=re.S,
          )
          script = script.replace('复星国际_券商深度报告_3份_完整可读版.zip', '复星国际_券商深度报告_2份_完整可读版.zip')
          script = script.replace("f'本压缩包共3份PDF，合计{total_pages}页。'", "f'本压缩包共2份PDF，合计{total_pages}页。'")
          script = script.replace(
              "- 华西证券与兴业证券报告均依据公开展示的全部原始页面按页序无删减合成为PDF；不是文本摘要，也不含网页快捷方式。",
              "- 华西证券报告依据公开展示的全部5张原始页面按页序无删减合成为PDF；不是文本摘要，也不含网页快捷方式。",
          )
          script = script.replace(
              "- 东北证券、开源证券、东吴证券等长篇报告的公开阅读页只开放前15页或要求登录下载，未将缺页预览版收入本包。",
              "- 东北证券、开源证券、东吴证券等长篇报告的公开阅读页只开放前15页或要求登录下载；兴业证券页面源已失效，均未将缺页或失效版本收入本包。",
          )
          Path('/tmp/fosun_two_reports.py').write_text(script, encoding='utf-8')
          print('Prepared script chars:', len(script))
          PY
      - name: Download, create, and verify report PDFs
        run: python /tmp/fosun_two_reports.py
      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: fosun-international-broker-reports-two-final
          path: fosun_final/复星国际_券商深度报告_2份_完整可读版.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload verification material
        uses: actions/upload-artifact@v4
        with:
          name: fosun-international-two-report-verification
          path: fosun_final/verification/
          retention-days: 1
          if-no-files-found: error
