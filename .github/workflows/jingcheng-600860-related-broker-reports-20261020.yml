name: Build Jingcheng 600860 related broker reports 20261020

on:
  push:
    paths:
      - '.github/workflows/jingcheng-600860-related-broker-reports-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pymupdf

      - name: Discover, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import fitz
          import requests

          PACKAGE_CN = '京城股份_600860_相关券商深度报告_3份'
          PACKAGE_EN = 'jingcheng_600860_related_broker_deep_reports'
          ROOT = Path(PACKAGE_CN)
          PDF_DIR = ROOT / '原始PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          TMP_DIR = Path('_candidate_pdfs')
          for d in [ROOT, PDF_DIR, PREVIEW_DIR, TMP_DIR]:
              d.mkdir(parents=True, exist_ok=True)

          API = 'https://reportapi.eastmoney.com/report/list'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36'

          def new_session() -> requests.Session:
              s = requests.Session()
              s.trust_env = False
              s.headers.update({
                  'User-Agent': UA,
                  'Referer': 'https://data.eastmoney.com/report/',
                  'Accept': 'application/json,text/plain,*/*',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              })
              return s

          session = new_session()
          rows: list[dict[str, Any]] = []
          seen: set[str] = set()
          request_log: list[dict[str, Any]] = []

          # qType=1 is the industry-research collection.  Scan complete yearly result sets.
          for year in range(2019, 2027):
              first_payload = None
              total_pages = 1
              for page in range(1, 301):
                  if page > total_pages:
                      break
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*',
                      'beginTime': f'{year}-01-01',
                      'endTime': ('2026-10-20' if year == 2026 else f'{year}-12-31'),
                      'pageNo': str(page), 'fields': '', 'qType': '1',
                      'orgCode': '', 'author': '', 'code': '', 'rcode': '',
                      'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                  }
                  payload = None
                  last: dict[str, Any] = {}
                  for attempt in range(6):
                      try:
                          r = session.get(API, params=params, timeout=(20, 120))
                          last = {'year': year, 'page': page, 'status': r.status_code,
                                  'bytes': len(r.content), 'url': r.url}
                          if r.status_code == 200:
                              payload = r.json()
                              break
                      except Exception as exc:
                          last = {'year': year, 'page': page, 'error': repr(exc)}
                      time.sleep(1 + attempt)
                  request_log.append(last)
                  if payload is None:
                      raise RuntimeError(f'Industry report API failed: {last}')
                  if page == 1:
                      first_payload = payload
                      total_pages = int(payload.get('TotalPage') or 1)
                      total_pages = min(total_pages, 300)
                  page_rows = payload.get('data') or []
                  if isinstance(page_rows, dict):
                      page_rows = page_rows.get('list') or page_rows.get('data') or []
                  if not isinstance(page_rows, list) or not page_rows:
                      break
                  for row in page_rows:
                      if not isinstance(row, dict):
                          continue
                      info = str(row.get('infoCode') or '')
                      if not info or info in seen:
                          continue
                      seen.add(info)
                      rows.append(row)
                  if len(page_rows) < 100:
                      break
                  time.sleep(0.015)
              print('SCANNED_YEAR', year, 'TOTAL_PAGES', total_pages, 'ACCUM_ROWS', len(rows))

          def compact(value: Any) -> str:
              return re.sub(r'\s+', '', str(value or ''))

          def as_int(value: Any) -> int:
              try:
                  return int(float(value))
              except Exception:
                  return 0

          strong_terms = [
              '车载储氢瓶', '储氢瓶', '氢气瓶', '复合气瓶', '高压气瓶',
              '氢储运', '储运氢', '储氢容器', '高压储氢', '气态储氢',
              'IV型瓶', 'Ⅳ型瓶', '四型瓶', 'III型瓶', 'Ⅲ型瓶',
              '车载供氢', '供氢系统', '氢能储运', '氢能源储运',
          ]
          broad_terms = [
              '氢能', '氢能源', '燃料电池', '加氢站', '碳纤维储罐',
              '碳纤维储氢', '氢能产业链', '制储运', '氢储能',
          ]
          exclude_terms = [
              '周报', '日报', '月报', '晨报', '点评', '简评', '快评',
              '三季报', '半年报', '年报', '业绩', '策略会',
          ]

          candidates: list[dict[str, Any]] = []
          for row in rows:
              title = str(row.get('title') or '')
              ct = compact(title)
              pages = as_int(row.get('attachPages'))
              if pages < 15:
                  continue
              strong_hits = [x for x in strong_terms if compact(x) in ct]
              broad_hits = [x for x in broad_terms if compact(x) in ct]
              if not strong_hits and not broad_hits:
                  continue
              excluded = [x for x in exclude_terms if compact(x) in ct]
              score = pages * 4 + 90 * len(strong_hits) + 24 * len(broad_hits)
              if any(x in ct for x in ['深度', '专题', '行业研究', '系列报告', '产业链']):
                  score += 80
              if '储运' in ct or '储氢瓶' in ct or '气瓶' in ct:
                  score += 120
              if excluded:
                  score -= 220
              candidates.append({
                  'row': row,
                  'info_code': str(row.get('infoCode') or ''),
                  'title': title,
                  'broker': str(row.get('orgSName') or row.get('orgName') or '未知机构'),
                  'date': str(row.get('publishDate') or '')[:10],
                  'pages_meta': pages,
                  'score_meta': score,
                  'strong_hits': strong_hits,
                  'broad_hits': broad_hits,
                  'excluded_hits': excluded,
              })

          candidates.sort(key=lambda x: (x['score_meta'], x['pages_meta'], x['date']), reverse=True)
          # Preserve the strongest storage-specific reports and a broad time spread.
          shortlist = candidates[:180]
          print('METADATA_CANDIDATES', len(candidates), 'SHORTLIST', len(shortlist))
          print('TOP_METADATA', json.dumps([{k:v for k,v in x.items() if k != 'row'} for x in shortlist[:40]], ensure_ascii=False, indent=2))

          aliases = [
              ('京城股份', 130), ('北京京城机电股份有限公司', 130), ('600860', 125),
              ('京城机电股份', 110), ('京城机电', 90), ('00187', 80),
              ('北京天海工业', 85), ('天海工业', 75),
              ('北京天海氢能', 85), ('天海氢能', 75), ('北京天海', 65),
          ]

          def download_and_scan(item: dict[str, Any]) -> dict[str, Any]:
              s = new_session()
              info = item['info_code']
              detail = f'https://data.eastmoney.com/report/info/{info}.html'
              attempts: list[dict[str, Any]] = []
              data = None
              pdf_url = None
              for prefix in ['H3', 'H2', 'H1', 'H4']:
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  for attempt in range(3):
                      try:
                          rr = s.get(url, timeout=(25, 240), allow_redirects=True, headers={
                              'User-Agent': UA, 'Referer': detail,
                              'Accept': 'application/pdf,*/*;q=0.8',
                          })
                          attempts.append({'url': url, 'status': rr.status_code,
                                           'bytes': len(rr.content),
                                           'content_type': rr.headers.get('content-type', '')})
                          if rr.status_code == 200 and rr.content[:5] == b'%PDF-' and len(rr.content) > 80_000:
                              data = rr.content
                              pdf_url = url
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'error': repr(exc)})
                      time.sleep(0.8 + attempt)
                  if data is not None:
                      break
              if data is None:
                  return {**item, 'scan_error': 'download_failed', 'attempts': attempts}

              temp = TMP_DIR / f'{info}.pdf'
              temp.write_bytes(data)
              try:
                  doc = fitz.open(stream=data, filetype='pdf')
                  actual_pages = doc.page_count
                  page_hits: list[dict[str, Any]] = []
                  total_weighted = 0
                  total_occurrences = 0
                  snippets: list[dict[str, Any]] = []
                  for pno in range(actual_pages):
                      text = doc.load_page(pno).get_text('text') or ''
                      ct = compact(text)
                      this_hits: dict[str, int] = {}
                      for alias, weight in aliases:
                          n = ct.count(compact(alias))
                          if n:
                              this_hits[alias] = n
                              total_occurrences += n
                              total_weighted += n * weight
                              if len(snippets) < 16:
                                  raw_pos = text.find(alias)
                                  if raw_pos < 0 and alias in ['600860', '00187']:
                                      raw_pos = text.find(alias)
                                  if raw_pos >= 0:
                                      lo = max(0, raw_pos - 160)
                                      hi = min(len(text), raw_pos + len(alias) + 260)
                                      snippets.append({
                                          'page': pno + 1,
                                          'alias': alias,
                                          'text': ' '.join(text[lo:hi].split()),
                                      })
                      if this_hits:
                          page_hits.append({'page': pno + 1, 'hits': this_hits})
                  doc.close()
              except Exception as exc:
                  return {**item, 'scan_error': 'pdf_parse_failed:' + repr(exc), 'attempts': attempts}

              mention_pages = len(page_hits)
              exact_company = any(
                  any(k in ph['hits'] for k in ['京城股份', '北京京城机电股份有限公司', '600860', '京城机电股份'])
                  for ph in page_hits
              )
              score_mentions = total_weighted + mention_pages * 55 + min(total_occurrences, 20) * 10
              if exact_company:
                  score_mentions += 500
              if mention_pages >= 2:
                  score_mentions += 250
              if mention_pages >= 3:
                  score_mentions += 300
              return {
                  **item,
                  'data': data,
                  'pdf_url': pdf_url,
                  'detail_page': detail,
                  'attempts': attempts,
                  'actual_pages': actual_pages,
                  'mention_pages': mention_pages,
                  'total_occurrences': total_occurrences,
                  'page_hits': page_hits,
                  'snippets': snippets,
                  'exact_company': exact_company,
                  'score_mentions': score_mentions,
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          scanned: list[dict[str, Any]] = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              futures = [ex.submit(download_and_scan, item) for item in shortlist]
              for idx, fut in enumerate(concurrent.futures.as_completed(futures), 1):
                  result = fut.result()
                  scanned.append(result)
                  if result.get('mention_pages', 0):
                      print('MENTION_FOUND', json.dumps({
                          k: result.get(k) for k in ['info_code','title','broker','date','actual_pages','mention_pages','total_occurrences','exact_company','score_mentions']
                      }, ensure_ascii=False))
                  if idx % 20 == 0:
                      print('SCANNED_PDFS', idx, 'OF', len(shortlist))

          valid = [x for x in scanned if x.get('data') and x.get('actual_pages', 0) >= 15]
          mentioned = [x for x in valid if x.get('mention_pages', 0) >= 1]
          mentioned.sort(key=lambda x: (x.get('score_mentions', 0), x.get('score_meta', 0), x.get('actual_pages', 0)), reverse=True)

          # Prefer genuinely substantive mentions; then distinct broker coverage.
          substantive = [x for x in mentioned if x.get('exact_company') or x.get('mention_pages', 0) >= 2 or x.get('total_occurrences', 0) >= 3]
          pool = substantive if len(substantive) >= 2 else mentioned
          selected: list[dict[str, Any]] = []
          used_brokers: set[str] = set()
          for item in pool:
              if item['broker'] in used_brokers:
                  continue
              selected.append(item)
              used_brokers.add(item['broker'])
              if len(selected) == 3:
                  break
          for item in pool:
              if len(selected) == 3:
                  break
              if item in selected:
                  continue
              selected.append(item)

          # If public reports with direct mentions are scarce, fill the package with the
          # most storage-specific broker deep reports and label them transparently.
          if len(selected) < 3:
              fallback = sorted(
                  [x for x in valid if not x.get('excluded_hits')],
                  key=lambda x: (x.get('score_meta', 0), x.get('actual_pages', 0)),
                  reverse=True,
              )
              for item in fallback:
                  if len(selected) == 3:
                      break
                  if item in selected:
                      continue
                  if item['broker'] in used_brokers and len(used_brokers) < 3:
                      continue
                  selected.append(item)
                  used_brokers.add(item['broker'])

          if len(selected) < 2:
              raise RuntimeError('Unable to obtain two complete relevant broker reports')
          selected = selected[:3]

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              text = re.sub(r'\s+', '', text)
              return text[:70]

          manifest: list[dict[str, Any]] = []
          total_pages = 0
          for idx, item in enumerate(selected, 1):
              classification = (
                  '正文直接点名京城股份/京城机电/天海工业的相关行业深度报告'
                  if item.get('mention_pages', 0) else
                  '储氢瓶/氢能储运相关行业深度报告（正文未检出公司名称）'
              )
              filename = f"{idx:02d}_{safe_name(item['broker'])}_{safe_name(item['title'])}_{item['date']}.pdf"
              dest = PDF_DIR / filename
              dest.write_bytes(item['data'])
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],
                             check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],
                             check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError('Preview render failed: ' + filename)
              total_pages += int(item['actual_pages'])
              row = item['row']
              manifest.append({
                  'filename': str(Path('原始PDF') / filename),
                  'broker': item['broker'],
                  'title': item['title'],
                  'date': item['date'],
                  'analysts': row.get('researcher') or row.get('author'),
                  'metadata_pages': item['pages_meta'],
                  'actual_pages': item['actual_pages'],
                  'classification': classification,
                  'mention_pages_count': item.get('mention_pages', 0),
                  'mention_occurrences': item.get('total_occurrences', 0),
                  'exact_company_name_or_code_found': bool(item.get('exact_company')),
                  'mention_page_details': item.get('page_hits', []),
                  'mention_snippets': item.get('snippets', []),
                  'source_report_page': item['detail_page'],
                  'pdf_url': item['pdf_url'],
                  'info_code': item['info_code'],
                  'sha256': item['sha256'],
                  'preview_file': str(Path('首页预览') / preview.name),
                  'validation': ['PDF header','page count','qpdf structure','first-page render','full-text alias scan'],
              })

          direct_count = sum(1 for x in manifest if x['mention_pages_count'] > 0)
          readme = [
              '京城股份（600860.SH / 00187.HK）相关券商深度报告资料包',
              '整理日期：2026-10-20', '',
              '重要说明：公开券商研报数据库未检出以京城股份为唯一研究对象的公司深度/首次覆盖报告。',
              '本资料包改收录与公司核心业务最相关的储氢瓶、氢能储运和复合气瓶券商行业深度报告。',
              f'其中有{direct_count}份报告正文检出“京城股份/京城机电/天海工业/天海氢能/证券代码”等直接提及；其余报告作为行业与竞品研究补充。',
              '每份报告的分类、命中页码和上下文摘录均记录在 manifest.json 中，避免将行业报告误称为公司独立覆盖报告。', '',
          ]
          for i, x in enumerate(manifest, 1):
              pages = ', '.join(str(p['page']) for p in x['mention_page_details']) or '未检出'
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   日期：{x['date']}；分析师：{x['analysts']}；完整页数：{x['actual_pages']}页",
                  f"   分类：{x['classification']}",
                  f"   公司相关命中页：{pages}；命中总次数：{x['mention_occurrences']}",
                  f"   文件：{x['filename']}",
                  f"   来源页：{x['source_report_page']}",
                  f"   SHA-256：{x['sha256']}", '',
              ]
          readme += [
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '完整性核验：PDF文件头、页数、qpdf结构、首页渲染、全文别名扫描、ZIP CRC和SHA-256。',
          ]

          (ROOT / '00_文件清单与重要说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_ranking.json').write_text(json.dumps(
              [{k:v for k,v in x.items() if k not in ['row','data']} for x in sorted(valid, key=lambda z:(z.get('score_mentions',0),z.get('score_meta',0)), reverse=True)[:120]],
              ensure_ascii=False, indent=2, default=str), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(
              f"{x['sha256']}  {x['filename']}\n" for x in manifest), encoding='utf-8')
          (ROOT / 'api_request_summary.json').write_text(json.dumps({
              'requests': len(request_log), 'rows_scanned': len(rows),
              'metadata_candidates': len(candidates), 'pdfs_scanned': len(scanned),
              'reports_with_company_alias_mentions': len(mentioned),
          }, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = Path(PACKAGE_EN + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE_CN}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdfs={len(pdfs)} manifest={len(manifest)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha)
          print('TOTAL_PAGES', total_pages, 'DIRECT_MENTION_REPORTS', direct_count)
          print('SELECTED_MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jingcheng-600860-related-broker-reports-final
          path: jingcheng_600860_related_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
