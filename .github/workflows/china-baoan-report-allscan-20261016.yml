name: Scan all Eastmoney reports for China Baoan IDs

on:
  push:
    paths:
      - '.github/workflows/china-baoan-report-allscan-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Scan report metadata by date windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          windows=[('2021-07-05','2021-07-12'),('2021-08-01','2021-08-12'),('2021-10-20','2021-10-30')]
          matches={}
          for begin,end in windows:
            for page in range(1,101):
              cb=f'datatable{begin.replace("-","")}{page}'
              params={'cb':cb,'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'qType':'0','orgCode':'*','code':'*','rcode':'*','p':str(page),'pageNum':str(page),'pageNumber':str(page),'_':str(int(time.time()*1000))}
              r=s.get(url,params=params,timeout=60)
              text=r.text.strip()
              if text.startswith(cb+'(') and text.endswith(')'): text=text[len(cb)+1:-1]
              data=json.loads(text)
              rows=data.get('data') or []
              print('PAGE',begin,end,page,'STATUS',r.status_code,'ROWS',len(rows),'HITS',data.get('hits'),'TOTAL',data.get('TotalPage'),flush=True)
              for row in rows:
                if '中国宝安' in str(row.get('title') or '') or '中国宝安' in str(row.get('stockName') or '') or str(row.get('stockCode') or '')=='000009':
                  matches[str(row.get('infoCode'))]=row
                  print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
              total=int(data.get('TotalPage') or 0)
              if not rows or (total and page>=total) or len(rows)<100: break
              time.sleep(0.1)
          print('FINAL_MATCHES',json.dumps(list(matches.values()),ensure_ascii=False,indent=2),flush=True)
          if not matches: raise RuntimeError('No matches')
          PY
