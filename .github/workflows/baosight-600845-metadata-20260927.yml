name: Query Baosight Software 600845 broker report metadata 20260927

on:
  push:
    paths:
      - '.github/workflows/baosight-600845-metadata-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          rows=[]
          for page in range(1,5):
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2015-01-01','endTime':'2026-09-27','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'600845','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(url,params=p,timeout=(20,90)); print('QUERY',page,r.status_code,len(r.content),flush=True); r.raise_for_status(); d=r.json(); batch=d.get('data') or []; rows.extend(batch)
              if len(batch)<100: break
          uniq={str(x.get('infoCode')):x for x in rows if x.get('infoCode')}
          rows=list(uniq.values()); rows.sort(key=lambda x:str(x.get('publishDate') or ''),reverse=True)
          print('COUNT',len(rows),flush=True)
          for i,x in enumerate(rows,1):
              rec={k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','stockName','stockCode','author']}
              print('ROW',i,json.dumps(rec,ensure_ascii=False,separators=(',',':')),flush=True)
          PY
