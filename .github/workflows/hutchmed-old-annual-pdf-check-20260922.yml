name: Check HUTCHMED 2006-2011 annual PDF candidates 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-old-annual-pdf-check-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests pypdf
      - name: Download and inspect candidates
        run: |
          python - <<'PY'
          import json, requests, urllib3
          from io import BytesIO
          from pypdf import PdfReader
          from pathlib import Path
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          urls={
            2011:'https://www.hutch-med.com/wp-content/uploads/docArchive/announcements/a120410.pdf',
            2010:'https://www.hutch-med.com/wp-content/uploads/docArchive/announcements/a110404.pdf',
            2009:'https://www.hutch-med.com/wp-content/uploads/docArchive/announcements/a100329.pdf',
            2008:'https://www.hutch-med.com/wp-content/uploads/docArchive/announcements/a090406.pdf',
            2007:'https://www.hutch-med.com/wp-content/uploads/docArchive/announcements/a080409.pdf',
            2006:'https://www.hutch-med.com/wp-content/uploads/docArchive/announcements/a070412.pdf',
          }
          s=requests.Session(); s.trust_env=False; s.verify=False; s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152'})
          rows=[]
          for year,u in urls.items():
            try:
              r=s.get(u,timeout=90,verify=False); r.raise_for_status(); data=r.content
              row={'year':year,'url':u,'bytes':len(data),'header':data[:8].decode('latin1','replace')}
              if data.startswith(b'%PDF'):
                reader=PdfReader(BytesIO(data)); row['pages']=len(reader.pages)
                texts=[]
                for p in reader.pages[:5]:
                  try: texts.append(p.extract_text() or '')
                  except: pass
                row['text']=' '.join(' '.join(texts).split())[:1000]
              rows.append(row); print(json.dumps(row,ensure_ascii=False))
            except Exception as e:
              row={'year':year,'url':u,'error':repr(e)}; rows.append(row); print(json.dumps(row))
          Path('candidate_check.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hutchmed-old-annual-pdf-check
          path: candidate_check.json
          retention-days: 7
