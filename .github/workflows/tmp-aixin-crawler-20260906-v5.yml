name: Temporary Aixin Yuanzhi report package v5

on:
  push:
    branches:
      - tmp-aixin-crawler-20260906-v5

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-aixin-crawler-20260906-v5
          persist-credentials: true
      - name: Search and package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf pymupdf pillow img2pdf rapidfuzz beautifulsoup4
          python - <<'PY'
          import csv, hashlib, io, json, math, re, shutil, time, zipfile
          from pathlib import Path
          from urllib.parse import quote, unquote
          import requests, img2pdf, pymupdf
          from PIL import Image, ImageDraw
          from pypdf import PdfReader
          from rapidfuzz.fuzz import ratio, partial_ratio, token_set_ratio
          from bs4 import BeautifulSoup

          ROOT=Path('/tmp/aixin_v5'); PAGES=ROOT/'pages'; REPORTS=ROOT/'reports'; DIAG=ROOT/'diag'; OUT=Path('/tmp/aixin_output_v5')
          for p in [ROOT,PAGES,REPORTS,DIAG,OUT]: p.mkdir(parents=True,exist_ok=True)
          TARGET_TITLES=[
            '踏智驾及边缘AI之浪，启高端芯片之航',
            '高端启新，智驱全球',
            'AI终端平台公司，智能汽车打开增量空间',
            '中报超预期，边缘AI、智能车驱动未来成长',
          ]
          BROKERS=['国盛证券','中邮证券','国泰海通证券','国泰君安证券','交银国际证券']
          QUERIES=['爱芯元智','爱芯','踏智驾','边缘AI之浪','高端芯片之航','高端启新','智驱全球','AI终端平台','智能汽车打开增量','首次覆盖 爱芯','00600','0600.HK']
          def norm(x): return re.sub(r'[^0-9a-zA-Z\u4e00-\u9fff]+','',str(x or '')).lower()
          def safe(x,n=110): return re.sub(r'[\\/:*?"<>|]+','_',str(x or '')).strip()[:n] or 'report'
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          def request(method,url,**kw):
            last=None
            for i in range(5):
              try:
                r=S.request(method,url,timeout=kw.pop('timeout',(20,120)),**kw)
                if r.status_code>=400: raise RuntimeError(f'HTTP {r.status_code}')
                return r
              except Exception as e: last=e; time.sleep(i+1)
            raise RuntimeError(f'{method} {url}: {last}')
          def item_org(it):
            o=it.get('organization'); return str(o.get('name') or '') if isinstance(o,dict) else str(o or '')
          def item_score(it):
            title=str(it.get('name') or ''); org=item_org(it); stock=it.get('stock') or {}; blob=' '.join([title,org,str(stock),str(it.get('content') or ''),str(it.get('summary') or '')])
            sims=[max(ratio(norm(title),norm(t)),partial_ratio(norm(title),norm(t)),token_set_ratio(norm(title),norm(t))) for t in TARGET_TITLES]
            token=max(sum(1 for z in re.split(r'[，,:：；;、\s]+',t) if len(z)>=3 and norm(z) in norm(blob)) for t in TARGET_TITLES)
            stock_bonus=100 if isinstance(stock,dict) and ('爱芯元智' in str(stock.get('name') or '') or str(stock.get('code') or '') in {'00600','0600','00600.HK','0600.HK'}) else 0
            org_bonus=35 if any(norm(b.replace('证券','')) in norm(org) for b in BROKERS) else 0
            name_bonus=60 if '爱芯元智' in title else 0
            return max(sims)+token*12+stock_bonus+org_bonus+name_bonus

          endpoint='https://api.sdyanbao.com/api/file/search'; all_items={}; stats=[]
          for q in QUERIES:
            for page in range(1,13):
              body={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':page,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','keyword':q}
              try:
                r=request('POST',endpoint,json=body,headers={'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report','Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'},timeout=(20,90)); obj=r.json(); data=obj.get('data') or {}; batch=data.get('files') or []
              except Exception as e: print('QUERY_FAIL',q,page,repr(e),flush=True); break
              stats.append({'query':q,'page':page,'count':len(batch),'total':data.get('total')})
              for it in batch:
                iid=str(it.get('id') or it.get('original_id') or '')
                if iid: all_items[iid]=it
              if len(batch)<100: break
              time.sleep(.08)
          ranked=[]
          for it in all_items.values():
            pages=int(it.get('page_count') or 0); year=str(it.get('time_text') or '')[:4]; sc=item_score(it)
            if 8<=pages<=100 and year in {'2026','2025'} and sc>=75: ranked.append((sc,it))
          ranked.sort(key=lambda x:(x[0],int(x[1].get('page_count') or 0)),reverse=True)
          (DIAG/'stats.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
          (DIAG/'ranked.json').write_text(json.dumps([{'score':s,'item':i} for s,i in ranked[:120]],ensure_ascii=False,indent=2),encoding='utf-8')
          for sc,it in ranked[:80]: print('CANDIDATE',round(sc,1),it.get('id'),it.get('time_text'),it.get('page_count'),item_org(it),it.get('name'),flush=True)

          built=[]; seen=set()
          def image_data(url,referer):
            r=request('GET',url,headers={'Referer':referer,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'},timeout=(20,90)); raw=r.content
            if len(raw)<10000: raise RuntimeError(f'small {len(raw)}')
            im=Image.open(io.BytesIO(raw)); im.load()
            if im.width<600 or im.height<800: raise RuntimeError(f'dim {im.width}x{im.height}')
            return raw,im,r.url
          def build_item(it,score):
            expected=int(it.get('page_count') or 0); base=str(it.get('page_url') or ''); first=str(it.get('share_url') or '')
            if not base and first: base=first.rsplit('/',1)[0]
            if not base: return None
            detail=f"https://www.sdyanbao.com/detail/{it.get('id')}"; folder=PAGES/str(it.get('id')); folder.mkdir(exist_ok=True); paths=[]; hashes=set(); sources=[]
            for idx in range(expected):
              urls=[]
              if idx==0 and first: urls.append(first)
              urls += [f'{base.rstrip("/")}/{idx}.{ext}' for ext in ['png','jpg','jpeg','webp']]
              found=None
              for u in list(dict.fromkeys(urls)):
                try: found=image_data(u,detail); break
                except Exception: pass
              if found is None: return None
              raw,im,final=found; h=hashlib.sha256(raw).hexdigest()
              if h in hashes: return None
              hashes.add(h); p=folder/f'{idx+1:03d}.png'
              if im.format=='PNG' and im.mode in ('RGB','L'): p.write_bytes(raw)
              else: im.convert('RGB').save(p,'PNG')
              paths.append(p); sources.append(final); time.sleep(.03)
            data=img2pdf.convert([str(x) for x in paths]); count=len(PdfReader(io.BytesIO(data),strict=False).pages)
            if count!=expected: return None
            sha=hashlib.sha256(data).hexdigest()
            if sha in seen: return None
            seen.add(sha)
            return {'data':data,'pages':count,'sha256':sha,'broker':item_org(it) or '券商未标注','date':str(it.get('time_text') or ''),'title':str(it.get('name') or ''),'info_page':detail,'source_url':base,'source':'水滴研报公开展示的原报告逐页图像','score':score,'id':it.get('id')}

          for sc,it in ranked[:55]:
            if len(built)>=3: break
            title=str(it.get('name') or ''); org=item_org(it); stock=it.get('stock') or {}
            strong=max(partial_ratio(norm(title),norm(t)) for t in TARGET_TITLES)>=68
            known=any(norm(b.replace('证券','')) in norm(org) for b in BROKERS)
            target_stock=isinstance(stock,dict) and ('爱芯元智' in str(stock.get('name') or '') or str(stock.get('code') or '') in {'00600','0600','00600.HK','0600.HK'})
            if not (strong or target_stock or (known and sc>=105)): continue
            try:
              x=build_item(it,sc)
              if x: built.append(x); print('BUILT',x['broker'],x['date'],x['pages'],x['title'],flush=True)
            except Exception as e: print('BUILD_FAIL',it.get('id'),repr(e),flush=True)

          # Fallback: exact-title web search, then reconstruct FXBaogao public report images.
          if len(built)<2:
            pages_to_probe=[]
            for title in TARGET_TITLES:
              for engine in [f'https://www.bing.com/search?q={quote(chr(34)+title+chr(34)+" 爱芯元智")}&count=50',f'https://www.google.com/search?q={quote(chr(34)+title+chr(34)+" 爱芯元智")}&num=30']:
                try:
                  rr=request('GET',engine,headers={'Accept':'text/html,application/xhtml+xml'},timeout=(20,90)); soup=BeautifulSoup(rr.text,'html.parser')
                  for a in soup.find_all('a',href=True):
                    h=a['href']
                    if h.startswith('/url?q='): h=unquote(h.split('/url?q=',1)[1].split('&',1)[0])
                    if h.startswith('http') and any(d in h for d in ['fxbaogao.com/detail/','sdyanbao.com/detail/','hangyan.co/reports/']): pages_to_probe.append(h)
                except Exception: pass
            pages_to_probe.append('https://www.fxbaogao.com/detail/5605896')
            (DIAG/'web_pages.json').write_text(json.dumps(list(dict.fromkeys(pages_to_probe)),ensure_ascii=False,indent=2),encoding='utf-8')
            for page_url in list(dict.fromkeys(pages_to_probe)):
              if len(built)>=3: break
              if 'sdyanbao.com/detail/' in page_url:
                continue
              if 'fxbaogao.com/detail/' not in page_url: continue
              try:
                rr=request('GET',page_url,headers={'Accept':'text/html,application/xhtml+xml'},timeout=(20,90)); text=rr.text; soup=BeautifulSoup(text,'html.parser'); ptitle=soup.title.get_text(' ',strip=True) if soup.title else ''
                if '爱芯元智' not in ptitle+text[:10000]: continue
                image_urls=re.findall(r'https://public\.fxbaogao\.com/report-image/[^"\'<>\s]+?-[0-9]+\.png(?:\?[^"\'<>\s]*)?',text)
                if not image_urls: continue
                first=image_urls[0].split('?')[0]; m=re.match(r'(.+)-1\.png$',first)
                if not m: continue
                stem=m.group(1); folder=PAGES/('fx_'+page_url.rstrip('/').split('/')[-1]); folder.mkdir(exist_ok=True); paths=[]; hashes=set()
                for n in range(1,81):
                  found=None
                  for u in [f'{stem}-{n}.png',f'{stem}-{n}.jpg']:
                    try: found=image_data(u,page_url); break
                    except Exception: pass
                  if found is None:
                    if n<=8: paths=[]
                    break
                  raw,im,final=found; h=hashlib.sha256(raw).hexdigest()
                  if h in hashes: paths=[]; break
                  hashes.add(h); p=folder/f'{n:03d}.png'; im.convert('RGB').save(p,'PNG'); paths.append(p)
                if len(paths)<8: continue
                data=img2pdf.convert([str(x) for x in paths]); sha=hashlib.sha256(data).hexdigest()
                if sha in seen: continue
                seen.add(sha)
                broker='国盛证券' if '国盛' in ptitle+text[:5000] else '券商未标注'
                title=next((t for t in TARGET_TITLES if any(z in ptitle+text[:10000] for z in re.split(r'[，,:：；;、\s]+',t) if len(z)>=4)),ptitle)
                built.append({'data':data,'pages':len(paths),'sha256':sha,'broker':broker,'date':'2026-08-15' if '5605896' in page_url else '','title':title,'info_page':page_url,'source_url':stem,'source':'发现报告公开展示的原报告逐页图像','score':95,'id':'fx'+page_url.rstrip('/').split('/')[-1]})
                print('BUILT_FX',broker,len(paths),title,flush=True)
              except Exception as e: print('FX_FAIL',page_url,repr(e),flush=True)

          # Semantic dedupe and package.
          built.sort(key=lambda x:(x.get('score',0),x.get('pages',0)),reverse=True); selected=[]; keys=set()
          for x in built:
            title_index=max(range(len(TARGET_TITLES)),key=lambda i:partial_ratio(norm(x.get('title')),norm(TARGET_TITLES[i])))
            key=(norm(x.get('broker')).replace(norm('证券'),''),title_index)
            if key in keys: continue
            keys.add(key); selected.append(x)
            if len(selected)>=3: break
          status={'items':len(all_items),'ranked':len(ranked),'built':len(built),'selected_count':len(selected),'selected':[{k:v for k,v in x.items() if k!='data'} for x in selected]}
          (OUT/'build_status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8'); shutil.make_archive(str(OUT/'diagnostics'),'zip',DIAG)
          if len(selected)>=2:
            rows=[]; pdfs=[]
            for i,x in enumerate(selected,1):
              d=re.sub(r'[^0-9]','',x.get('date',''))[:8] or '日期未识别'; name=f"{i:02d}_{safe(x.get('broker'))}_爱芯元智_{safe(x.get('title'),82)}_{d}_{x['pages']}页.pdf"; p=REPORTS/name; p.write_bytes(x['data']); pdfs.append(p)
              rows.append({'文件名':name,'券商':x.get('broker'),'发布日期':x.get('date'),'报告标题':x.get('title'),'页数':x.get('pages'),'文件大小（字节）':len(x['data']),'SHA256':x.get('sha256'),'报告信息页':x.get('info_page'),'原始来源':x.get('source_url'),'来源说明':x.get('source')})
            with (REPORTS/'文件清单与校验值.csv').open('w',encoding='utf-8-sig',newline='') as f: w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
            lines=['爱芯元智（00600.HK）券商深度报告资料包','',f'包含{len(pdfs)}份完整公司深度/首次覆盖报告：']+[f"{i}. {r['券商']}，{r['发布日期']}，{r['页数']}页，《{r['报告标题']}》。" for i,r in enumerate(rows,1)]+['','已检查逐页图像尺寸和重复页，合并后核对PDF页数，并记录SHA-256；ZIP已执行CRC测试。','报告中的评级、盈利预测及目标价均对应发布时点。']
            (REPORTS/'README.txt').write_text('\n'.join(lines),encoding='utf-8')
            tiles=[]
            for p in pdfs:
              doc=pymupdf.open(str(p))
              for no,lab in [(0,'首页'),(len(doc)-1,'末页')]: pix=doc.load_page(no).get_pixmap(matrix=pymupdf.Matrix(.75,.75),alpha=False); q=ROOT/f'{p.stem}_{lab}.jpg'; pix.save(str(q)); tiles.append((p.name+' '+lab,q))
              doc.close()
            tw,th=360,510; sheet=Image.new('RGB',(tw*2,th*math.ceil(len(tiles)/2)),'white')
            for i,(lab,p) in enumerate(tiles): im=Image.open(p).convert('RGB'); im.thumbnail((tw-24,th-60),Image.Resampling.LANCZOS); cv=Image.new('RGB',(tw,th),'white'); cv.paste(im,((tw-im.width)//2,8)); ImageDraw.Draw(cv).text((8,th-42),lab[:58],fill='black'); sheet.paste(cv,((i%2)*tw,(i//2)*th))
            sheet.save(OUT/'首页末页核验图.jpg',quality=90)
            z=OUT/'爱芯元智_00600_券商深度报告.zip'
            with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as a:
              for p in sorted(REPORTS.iterdir(),key=lambda p:p.name): a.write(p,p.name)
            with zipfile.ZipFile(z) as a: assert a.testzip() is None; assert 2<=sum(n.lower().endswith('.pdf') for n in a.namelist())<=3
            print('ARCHIVE_READY',z,z.stat().st_size,len(pdfs),flush=True)
          else: print('INSUFFICIENT',len(selected),flush=True)
          PY
      - name: Publish output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp-aixin-output-20260906:tmp-aixin-output-20260906
          git switch tmp-aixin-output-20260906
          rm -rf aixin_output
          mkdir -p aixin_output
          cp -a /tmp/aixin_output_v5/. aixin_output/
          git config user.name "OakFlux"
          git config user.email "206205057+OakFlux@users.noreply.github.com"
          git add aixin_output
          if ! git diff --cached --quiet; then
            git commit -m "Publish Aixin Yuanzhi report package [skip ci]"
            git push origin tmp-aixin-output-20260906
          fi
