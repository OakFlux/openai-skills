name: Build QuantGroup broker report public preview package 20260920

on:
  push:
    paths:
      - '.github/workflows/quantgroup-broker-reports-final-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests Pillow img2pdf pypdf

      - name: Download public previews, validate, build PDFs and ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '量化派_02685_券商深度报告_公开预览版_2份'
          out = Path(PACKAGE)
          work = Path('_work')
          out.mkdir(exist_ok=True)
          work.mkdir(exist_ok=True)

          reports = [
              {
                  'order': '01',
                  'broker': '盈立证券',
                  'title': '港股首次覆盖报告：AI战略发展赋能线上消费基本盘，智能硬件打开增长新范式',
                  'report_date': '2026-08-17',
                  'original_report_pages': 40,
                  'rating': '推荐（首次）',
                  'detail_url': 'https://www.fxbaogao.com/detail/5609436',
                  'crosscheck_url': 'https://www.microbell.com/repinfodetail_5329571.html',
                  'preview_api': 'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId=5609436',
                  'expected_paths': [
                      'report-image/2026/08/17/5609436-1.png',
                      'report-image/2026/08/17/5609436-2.png',
                  ],
                  'filename': '01_盈立证券_量化派_AI战略发展赋能线上消费基本盘_智能硬件打开增长新范式_公开预览版_2026-08-17.pdf',
                  'identity_terms': ['盈立证券', '量化派', 'AI战略发展', '智能硬件'],
              },
              {
                  'order': '02',
                  'broker': '复星国际证券（复星恒利）',
                  'title': '从线上消费平台到物理AI场景赋能者',
                  'report_date': '2026-07-23',
                  'original_report_pages': None,
                  'rating': '买入（首次覆盖）',
                  'detail_url': 'https://www.fxbaogao.com/detail/5553065',
                  'crosscheck_url': 'https://news.futunn.com/post/76392924/fosun-international-securities-initiated-coverage-of-lianghuaipai-with-a-buy',
                  'preview_api': 'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId=5553065',
                  'expected_paths': [
                      'report-image/2026/07/23/5553065-1.png',
                      'report-image/2026/07/23/5553065-2.png',
                  ],
                  'filename': '02_复星国际证券_量化派_从线上消费平台到物理AI场景赋能者_公开预览版_2026-07-23.pdf',
                  'identity_terms': ['量化派', '物理AI', '复星'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          def get_json(url: str, referer: str) -> dict:
              headers = {
                  'Referer': referer,
                  'Origin': 'https://www.fxbaogao.com',
                  'CLIENT-TYPE-X': 'pc',
                  'version': '1.0.0',
                  'user-id': '0',
                  'Accept': 'application/json,text/plain,*/*',
              }
              r = session.get(url, headers=headers, timeout=(20, 90), allow_redirects=True)
              r.raise_for_status()
              data = r.json()
              if data.get('code') != 0 or not isinstance(data.get('data'), list):
                  raise RuntimeError(f'preview API returned unexpected payload for {url}: {data}')
              return data

          def download_image(url: str, dest: Path, referer: str) -> tuple[int, int, str, int]:
              errors = []
              for attempt in range(1, 5):
                  try:
                      r = session.get(
                          url,
                          headers={'Referer': referer, 'Accept': 'image/png,image/jpeg,image/webp,image/*;q=0.8,*/*;q=0.5'},
                          timeout=(25, 180),
                          allow_redirects=True,
                      )
                      print('IMAGE', dest.name, 'attempt', attempt, 'status', r.status_code, 'bytes', len(r.content), 'final', r.url, flush=True)
                      r.raise_for_status()
                      if len(r.content) < 50_000:
                          raise RuntimeError(f'image too small: {len(r.content)} bytes')
                      with Image.open(io.BytesIO(r.content)) as im:
                          im.load()
                          width, height = im.size
                          if width < 900 or height < 1200:
                              raise RuntimeError(f'image dimensions too small: {width}x{height}')
                          if height <= width:
                              raise RuntimeError(f'expected portrait report page, got {width}x{height}')
                          # Normalize to RGB PNG to avoid alpha/profile issues while keeping text lossless.
                          if im.mode != 'RGB':
                              bg = Image.new('RGB', im.size, 'white')
                              if 'A' in im.getbands():
                                  bg.paste(im.convert('RGBA'), mask=im.convert('RGBA').getchannel('A'))
                                  im = bg
                              else:
                                  im = im.convert('RGB')
                          im.save(dest, format='PNG', optimize=True)
                      sha = hashlib.sha256(dest.read_bytes()).hexdigest()
                      return width, height, sha, dest.stat().st_size
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      dest.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'failed to download {url}: {errors}')

          records = []
          for report in reports:
              api_payload = get_json(report['preview_api'], report['detail_url'])
              paths = api_payload['data']
              if paths != report['expected_paths']:
                  raise RuntimeError(f"preview path mismatch for {report['broker']}: {paths}")
              if len(paths) != 2:
                  raise RuntimeError(f"expected exactly two public preview pages for {report['broker']}, got {len(paths)}")

              normalized_images = []
              image_records = []
              for index, relpath in enumerate(paths, 1):
                  url = 'https://public.fxbaogao.com/' + relpath.lstrip('/')
                  dest = work / f"{report['order']}_{index}.png"
                  width, height, sha, size = download_image(url, dest, report['detail_url'])
                  normalized_images.append(dest)
                  image_records.append({
                      'page': index,
                      'public_preview_url': url,
                      'width': width,
                      'height': height,
                      'bytes': size,
                      'sha256': sha,
                  })

              pdf_path = out / report['filename']
              pdf_path.write_bytes(img2pdf.convert([str(p) for p in normalized_images]))
              reader = PdfReader(str(pdf_path), strict=False)
              pages = len(reader.pages)
              if pages != 2:
                  raise RuntimeError(f'PDF page count mismatch for {pdf_path.name}: {pages}')
              qcheck = subprocess.run(['qpdf', '--check', str(pdf_path)], capture_output=True, text=True)
              if qcheck.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {pdf_path.name}: {qcheck.stderr[-2000:]}')

              # Re-render both pages to verify the final PDF is readable and complete.
              render_dir = work / f"render_{report['order']}"
              render_dir.mkdir(exist_ok=True)
              render_prefix = render_dir / 'page'
              subprocess.run([
                  'pdftoppm', '-png', '-r', '120', '-f', '1', '-l', '2',
                  str(pdf_path), str(render_prefix)
              ], check=True, capture_output=True)
              rendered = sorted(render_dir.glob('page-*.png'))
              if len(rendered) != 2:
                  raise RuntimeError(f'render verification failed for {pdf_path.name}: {len(rendered)} pages')
              for rendered_page in rendered:
                  with Image.open(rendered_page) as im:
                      if im.width < 900 or im.height < 1200:
                          raise RuntimeError(f'rendered page too small for {pdf_path.name}: {im.size}')

              pdf_data = pdf_path.read_bytes()
              pdf_sha = hashlib.sha256(pdf_data).hexdigest()
              records.append({
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'title': report['title'],
                  'report_date': report['report_date'],
                  'rating': report['rating'],
                  'original_report_pages': report['original_report_pages'],
                  'included_public_preview_pages': 2,
                  'content_mode': '发现报告公开展示的前2页预览，按原页图像合成为PDF',
                  'detail_url': report['detail_url'],
                  'crosscheck_url': report['crosscheck_url'],
                  'preview_api': report['preview_api'],
                  'images': image_records,
                  'compiled_pdf_pages': pages,
                  'compiled_pdf_bytes': len(pdf_data),
                  'sha256': pdf_sha,
              })
              print('VALIDATED', json.dumps(records[-1], ensure_ascii=False), flush=True)

          readme = [
              '量化派控股有限公司（02685.HK）券商深度报告公开预览资料包',
              '整理日期：2026-09-20',
              '',
              '本包收录2份与量化派直接相关的券商深度研究报告公开预览：盈立证券首次覆盖报告、复星国际证券（复星恒利）首次覆盖报告。',
              '重要说明：报告平台对完整原始PDF设置了登录或下载权限。本包没有绕过访问控制，只收录平台无需登录公开展示的前2页，并将原页图像合成为PDF。',
              '因此，本包中的两份PDF均为“公开预览版”，不是完整的券商原始PDF。需要完整原报告时，应通过券商、研究平台或合规数据库授权获取。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              original_pages = rec['original_report_pages'] if rec['original_report_pages'] is not None else '公开页面未标示'
              readme.extend([
                  f"{i}. {rec['broker']}：《{rec['title']}》",
                  f"   报告日期：{rec['report_date']}；评级：{rec['rating']}",
                  f"   原报告页数：{original_pages}；本包收录：公开预览前2页",
                  f"   文件：{rec['filename']}",
                  f"   报告详情页：{rec['detail_url']}",
                  f"   交叉核验页：{rec['crosscheck_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.extend([
              '完整性核验：预览API返回值、图像文件结构与尺寸、PDF实际页数、qpdf结构、两页重新渲染、ZIP CRC及SHA-256。',
              '本资料仅用于研究与信息整理，不构成投资建议。',
          ])
          (out / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(out.iterdir()):
                  zf.write(p, arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-broker-reports-public-preview-final
          path: 量化派_02685_券商深度报告_公开预览版_2份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
