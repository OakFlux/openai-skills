name: Package Kinco 688160 official filings fast

on:
  push:
    paths:
      - '.github/workflows/kinco-688160-official-filings-fast-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE='688160'
          COMPANY='步科股份'
          FULL='上海步科自动化股份有限公司'
          CUTOFF='2026-10-28'
          COMPACT='20261028'
          ROOT_NAME=f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{COMPACT}'
          ROOT=Path('work')/ROOT_NAME
          DIST=Path('dist')
          for d in (ROOT/'00_招股说明书',ROOT/'01_年度报告',ROOT/'02_最新季度报告',ROOT/'首页预览',DIST):
              d.mkdir(parents=True,exist_ok=True)

          docs=[
            {
              'kind':'prospectus','period':'IPO','filename':'2020_步科股份_首次公开发行股票并在科创板上市招股说明书.pdf',
              'urls':[
                'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2020/2020-11/2020-11-06/6709994.PDF',
                'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2020/2020-11/2020-11-06/6709994.PDF'
              ],
              'folder':'00_招股说明书','min_pages':200,'markers':['招股说明书','首次公开发行股票并在科创板上市']
            },
            {
              'kind':'annual_report','period':'2020','filename':'2020_步科股份_2020年年度报告.pdf',
              'urls':['https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2021-04-21/688160_20210421_2.pdf'],
              'folder':'01_年度报告','min_pages':80,'markers':['2020年年度报告']
            },
            {
              'kind':'annual_report','period':'2021','filename':'2021_步科股份_2021年年度报告.pdf',
              'urls':[
                'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-21/8026743.PDF',
                'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-21/8026743.PDF'
              ],
              'folder':'01_年度报告','min_pages':80,'markers':['2021年年度报告']
            },
            {
              'kind':'annual_report','period':'2022','filename':'2022_步科股份_2022年年度报告.pdf',
              'urls':[
                'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-31/8931664.PDF',
                'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-31/8931664.PDF'
              ],
              'folder':'01_年度报告','min_pages':80,'markers':['2022年年度报告']
            },
            {
              'kind':'annual_report','period':'2023','filename':'2023_步科股份_2023年年度报告.pdf',
              'urls':[
                'https://dataclouds.cninfo.com.cn/shgonggao/2024/2024-03-27/f51b6441eb5b11eebb3bfa163e26e5de.pdf',
                'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-27/9900762.PDF'
              ],
              'folder':'01_年度报告','min_pages':80,'markers':['2023年年度报告']
            },
            {
              'kind':'annual_report','period':'2024','filename':'2024_步科股份_2024年年度报告.pdf',
              'urls':['https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-25/688160_20250425_680M.pdf'],
              'folder':'01_年度报告','min_pages':80,'markers':['2024年年度报告']
            },
            {
              'kind':'annual_report','period':'2025','filename':'2025_步科股份_2025年年度报告.pdf',
              'urls':['https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-03/688160_20260403_16A8.pdf'],
              'folder':'01_年度报告','min_pages':80,'markers':['2025年年度报告']
            },
            {
              'kind':'quarterly_report','period':'2026Q1','filename':'2026Q1_步科股份_2026年第一季度报告.pdf',
              'urls':['https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-28/688160_20260428_OJ7D.pdf'],
              'folder':'02_最新季度报告','min_pages':5,'markers':['2026年第一季度报告']
            },
          ]

          s=requests.Session()
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=1,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})

          def compact(text:str)->str:
              return re.sub(r'\s+','',text or '')
          def digest(path:Path)->str:
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              return h.hexdigest()

          records=[]
          for spec in docs:
              response=None; used=None; errors=[]
              for url in spec['urls']:
                  try:
                      r=s.get(url,headers={'Referer':'https://www.sse.com.cn/'},timeout=240,allow_redirects=True)
                      print('DOWNLOAD',spec['period'],r.status_code,len(r.content),url,'->',r.url)
                      if r.status_code==200 and len(r.content)>=50000 and r.content.startswith(b'%PDF'):
                          response=r;used=url;break
                      errors.append(f'{url}: status={r.status_code}, size={len(r.content)}, head={r.content[:12]!r}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              if response is None:
                  raise RuntimeError(f"No valid PDF for {spec['period']}: {' | '.join(errors)}")

              dest=ROOT/spec['folder']/spec['filename']
              dest.write_bytes(response.content)
              reader=PdfReader(str(dest),strict=False)
              if reader.is_encrypted:
                  reader.decrypt('')
              pages=len(reader.pages)
              if pages<spec['min_pages']:
                  raise RuntimeError(f"Unexpected page count for {spec['period']}: {pages}")
              doc=fitz.open(dest)
              if doc.page_count!=pages:
                  raise RuntimeError(f"Parser mismatch for {spec['period']}: {pages} vs {doc.page_count}")
              first=doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
              last=doc.load_page(doc.page_count-1).get_pixmap(matrix=fitz.Matrix(.8,.8),alpha=False)
              if min(first.width,first.height,last.width,last.height)<100:
                  raise RuntimeError(f"Render failure for {spec['period']}")
              first.save(ROOT/'首页预览'/f"{dest.stem}.png")
              probe=''
              for i in range(min(15,doc.page_count)):
                  try: probe+=doc.load_page(i).get_text('text')
                  except Exception: pass
              doc.close()
              cprobe=compact(probe)
              if COMPANY not in cprobe and FULL not in cprobe and CODE not in cprobe:
                  raise RuntimeError(f"Company identity missing for {spec['period']}")
              for marker in spec['markers']:
                  if compact(marker) not in cprobe:
                      raise RuntimeError(f"Marker {marker!r} missing for {spec['period']}")
              rec={
                'document_type':spec['kind'],'period':spec['period'],'source_url':used,'resolved_url':response.url,
                'relative_path':str(dest.relative_to(ROOT)).replace(os.sep,'/'),'file_name':dest.name,
                'file_size_bytes':dest.stat().st_size,'page_count':pages,'sha256':digest(dest),
                'pdf_header_valid':True,'first_page_rendered':True,'last_page_rendered':True,
                'company_identity_validated':True,'period_validated':True
              }
              records.append(rec)
              print('VERIFIED',json.dumps(rec,ensure_ascii=False))

          years=sorted(int(r['period']) for r in records if r['document_type']=='annual_report')
          if years!=[2020,2021,2022,2023,2024,2025]:raise RuntimeError(years)
          manifest={
            'company':COMPANY,'full_company_name':FULL,'stock_code':CODE,'market':'上海证券交易所科创板',
            'listing_date':'2020-11-12','cutoff_date':CUTOFF,'annual_report_years':years,'latest_quarter':'2026Q1',
            'latest_quarter_note':'截至2026-10-28，2026年第三季度报告预约披露日为2026-10-30，尚未正式披露，因此收录2026年第一季度报告。',
            'document_count':len(records),'documents':records,'generated_at_utc':datetime.now(timezone.utc).isoformat()
          }
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records)+'\n',encoding='utf-8')
          lines=[f'# {COMPANY}（{CODE}）上市以来官方披露文件包','',f'- 截止日期：{CUTOFF}','- 收录最终正式版IPO招股说明书、2020—2025年全部年度报告、截至截止日最新正式独立季报。','- 2026年第三季度报告预约于2026年10月30日披露，因此本包最新季报为2026年第一季度报告。','- 已排除摘要、招股意向书、申报稿及重复文件。','- 已完成PDF文件头、页数、公司身份、报告期、首末页渲染、SHA-256和ZIP CRC校验。','','## 文件清单','']
          for i,r in enumerate(records,1):
              lines += [f"{i}. `{r['relative_path']}`",f"   - 类型/期间：{r['document_type']} / {r['period']}",f"   - 页数：{r['page_count']}；大小：{r['file_size_bytes']:,}字节",f"   - 来源：{r['source_url']}",f"   - SHA-256：`{r['sha256']}`"]
          (ROOT/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          cn=DIST/f'{ROOT_NAME}.zip'; en=DIST/f'kinco_688160_all_annual_reports_prospectus_latest_quarter_{COMPACT}.zip'
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():z.write(p,str(p.relative_to(ROOT.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for p in (cn,en):
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad:raise RuntimeError(bad)
                  if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=8:raise RuntimeError('PDF count')
              print('ZIP_VERIFIED',p,p.stat().st_size,digest(p))
          print('FINAL_JSON',json.dumps({'annual_years':years,'latest_quarter':'2026Q1','document_count':len(records),'total_pages':sum(r['page_count'] for r in records),'chinese_zip':str(cn),'english_zip':str(en),'chinese_zip_size':cn.stat().st_size,'chinese_zip_sha256':digest(cn),'records':records},ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinco-688160-official-filings-fast-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
