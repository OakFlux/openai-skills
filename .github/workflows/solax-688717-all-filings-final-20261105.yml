name: Build final SolaX filing package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solax-688717-all-filings-final-20261105.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pypdf 'pymupdf<2'
      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          fetch_pdf() {
            local out="$1"; shift
            rm -f "$out" "$out.part"
            for url in "$@"; do
              echo "FETCH $url"
              if curl --fail --location --silent --show-error \
                --connect-timeout 15 --max-time 180 --retry 1 --retry-delay 2 \
                --user-agent 'Mozilla/5.0 Chrome/155' \
                --referer 'https://www.cninfo.com.cn/' \
                --output "$out.part" "$url"; then
                if [ "$(head -c 4 "$out.part")" = '%PDF' ] && [ "$(wc -c < "$out.part")" -gt 50000 ]; then
                  mv "$out.part" "$out"
                  echo "DOWNLOADED $out $(wc -c < "$out")"
                  return 0
                fi
              fi
              rm -f "$out.part"
            done
            echo "FAILED $out" >&2
            return 1
          }

          fetch_pdf downloads/prospectus.pdf \
            'https://static.cninfo.com.cn/finalpage/2023-12-28/1218746774.PDF'
          fetch_pdf downloads/annual_2023.pdf \
            'https://static.cninfo.com.cn/finalpage/2024-04-22/1219728866.PDF'
          fetch_pdf downloads/annual_2024.pdf \
            'https://static.cninfo.com.cn/finalpage/2025-04-29/1223392162.PDF'
          fetch_pdf downloads/annual_2025.pdf \
            'https://static.cninfo.com.cn/finalpage/2026-04-29/1225242242.PDF'
          fetch_pdf downloads/q3_2026.pdf \
            'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-31/12682787.PDF' \
            'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-31/12682787.PDF'

          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re, shutil, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import pymupdf
          from pypdf import PdfReader

          COMPANY='艾罗能源'
          FULL_NAME='浙江艾罗网络能源技术股份有限公司'
          CODE='688717'
          CUTOFF='2026-11-05'
          COMPACT='20261105'
          ROOT_NAME=f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{COMPACT}'
          ROOT=Path('work')/ROOT_NAME
          PDF_DIR=ROOT/'报告PDF'
          PREVIEW_DIR=ROOT/'首页与末页预览'
          DIST=Path('dist')
          for d in (PDF_DIR,PREVIEW_DIR,DIST): d.mkdir(parents=True,exist_ok=True)

          docs=[
            dict(src='downloads/prospectus.pdf', type='招股说明书', period='2023-12-28', title='首次公开发行股票并在科创板上市招股说明书', label='首次公开发行股票并在科创板上市招股说明书_最终正式版', source='巨潮资讯网', source_url='https://static.cninfo.com.cn/finalpage/2023-12-28/1218746774.PDF', min_pages=250, tokens=['首次公开发行股票','招股说明书']),
            dict(src='downloads/annual_2023.pdf', type='年度报告', period='2023年', title='2023年年度报告全文', label='2023年年度报告', source='巨潮资讯网', source_url='https://static.cninfo.com.cn/finalpage/2024-04-22/1219728866.PDF', min_pages=100, tokens=['2023年年度报告']),
            dict(src='downloads/annual_2024.pdf', type='年度报告', period='2024年', title='2024年年度报告', label='2024年年度报告', source='巨潮资讯网', source_url='https://static.cninfo.com.cn/finalpage/2025-04-29/1223392162.PDF', min_pages=100, tokens=['2024年年度报告']),
            dict(src='downloads/annual_2025.pdf', type='年度报告', period='2025年', title='2025年年度报告', label='2025年年度报告', source='巨潮资讯网', source_url='https://static.cninfo.com.cn/finalpage/2026-04-29/1225242242.PDF', min_pages=100, tokens=['2025年年度报告']),
            dict(src='downloads/q3_2026.pdf', type='第三季度报告', period='2026年第三季度', title='2026年第三季度报告', label='2026年第三季度报告', source='新浪财经公开披露镜像（对应上交所原公告）', source_url='http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-31/12682787.PDF', official_url='http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-31/688717_20261031_NDEU.pdf', min_pages=5, tokens=['2026年第三季度报告',CODE]),
          ]

          def sha256(path:Path)->str:
            h=hashlib.sha256()
            with path.open('rb') as f:
              for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
            return h.hexdigest()

          records=[]
          for i,item in enumerate(docs,1):
            src=Path(item['src'])
            if not src.read_bytes()[:4]==b'%PDF': raise RuntimeError(f'PDF header invalid: {src}')
            reader=PdfReader(src,strict=False)
            if reader.is_encrypted:
              try: reader.decrypt('')
              except Exception: pass
            pages=len(reader.pages)
            if pages<item['min_pages']: raise RuntimeError(f'Page count too low: {item["title"]} {pages}')
            idx=sorted(set(list(range(min(20,pages)))+[pages-1]))
            text=[]
            for p in idx:
              try: text.append(reader.pages[p].extract_text() or '')
              except Exception as e: print('TEXT_WARNING',item['title'],p,repr(e),flush=True)
            sample=re.sub(r'\s+',' ','\n'.join(text)).strip()
            compact=re.sub(r'\s+','',sample)
            if FULL_NAME not in compact and COMPANY not in compact: raise RuntimeError(f'Company check failed: {item["title"]}')
            if not all(token in compact for token in item['tokens']): raise RuntimeError(f'Identity check failed: {item["title"]}')
            filename=f'{i:02d}_{COMPANY}_{CODE}_{item["label"]}.pdf'
            dest=PDF_DIR/filename
            shutil.copy2(src,dest)
            pdf=pymupdf.open(dest)
            if pdf.page_count!=pages: raise RuntimeError(f'Dual parser mismatch: {filename}')
            first=pdf.load_page(0).get_pixmap(matrix=pymupdf.Matrix(1.5,1.5),alpha=False)
            last=pdf.load_page(pdf.page_count-1).get_pixmap(matrix=pymupdf.Matrix(1.0,1.0),alpha=False)
            if min(first.width,first.height,last.width,last.height)<400: raise RuntimeError(f'Render failed: {filename}')
            first.save(PREVIEW_DIR/f'{Path(filename).stem}_首页.png')
            last.save(PREVIEW_DIR/f'{Path(filename).stem}_末页.png')
            pdf.close()
            rec={k:v for k,v in item.items() if k not in ('src','min_pages','tokens')}
            rec.update(file_name=filename,page_count=pages,file_size_bytes=dest.stat().st_size,sha256=sha256(dest),pdf_header_valid=True,company_and_report_identity_validated=True,dual_parser_page_count_validated=True,first_and_last_pages_rendered=True,text_sample=sample[:1000])
            records.append(rec)
            print('VERIFIED',json.dumps(rec,ensure_ascii=False),flush=True)

          manifest=dict(company_short_name=COMPANY,company_full_name=FULL_NAME,stock_code=CODE,listing_date='2024-01-03',cutoff_date=CUTOFF,annual_report_scope='2023-2025年度（上市以来全部年度报告）',prospectus='2023-12-28最终正式发行版',latest_quarterly_report='2026年第三季度报告（披露日期2026-10-31）',document_count=len(records),total_pages=sum(r['page_count'] for r in records),documents=records,generated_at_utc=datetime.now(timezone.utc).isoformat())
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=[f'# {COMPANY}（{CODE}）全部年报、招股说明书及最新季报','',f'- 截止日期：{CUTOFF}','- 上市日期：2024-01-03。','- 上市以来年度报告：2023、2024、2025年度，共3份。','- 招股说明书：2023-12-28最终正式发行版。','- 最新季报：2026年第三季度报告，披露日期为2026-10-31。','- 三季报使用新浪财经公开披露的原始PDF镜像，并记录上交所原公告地址。','- 未收录年报摘要、审计报告、ESG报告、提示性公告及重复文件。','- 已校验PDF文件头、公司与报告身份、双解析器页数、首末页渲染、SHA-256及ZIP CRC。','','## 文件清单','']
          for n,r in enumerate(records,1):
            lines += [f'{n}. `{r["file_name"]}`',f'   - 标题：{r["title"]}',f'   - 页数：{r["page_count"]}',f'   - 来源：{r["source"]}',f'   - SHA-256：`{r["sha256"]}`']
          (ROOT/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (ROOT/'文件清单.txt').write_text('\n'.join(r['file_name'] for r in records)+'\n',encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  报告PDF/{r["file_name"]}\n' for r in records),encoding='utf-8')

          cn=DIST/f'{ROOT_NAME}.zip'
          en=DIST/f'solax_power_688717_all_annual_reports_prospectus_latest_quarter_{COMPACT}.zip'
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,str(p.relative_to(ROOT.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for zp in (cn,en):
            with zipfile.ZipFile(zp) as z:
              bad=z.testzip()
              if bad: raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdfs=[x for x in z.namelist() if x.lower().endswith('.pdf')]
              if len(pdfs)!=5: raise RuntimeError(f'Expected 5 PDFs, got {len(pdfs)}')
            print('ZIP_VERIFIED',zp,zp.stat().st_size,sha256(zp),flush=True)
          print('FINAL_SUMMARY',json.dumps(dict(chinese_zip=str(cn),english_zip=str(en),zip_size_bytes=cn.stat().st_size,zip_sha256=sha256(cn),document_count=len(records),total_pages=sum(r['page_count'] for r in records),records=[dict(file_name=r['file_name'],title=r['title'],page_count=r['page_count'],sha256=r['sha256']) for r in records]),ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: solax-688717-all-filings-final-20261105
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
