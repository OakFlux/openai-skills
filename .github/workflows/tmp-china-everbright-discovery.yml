name: Temporary China Everbright Limited broker report discovery

on:
  push:
    branches:
      - tmp/china-everbright-broker-reports-final-20260831
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Search report catalogues and public sources
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          s = requests.Session()
          s.headers.update({'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6'})

          def dump(label, obj, limit=12000):
              text = json.dumps(obj, ensure_ascii=False, default=str)
              print(label, text[:limit], flush=True)

          print('=== EASTMONEY LIST2 ===', flush=True)
          endpoint='https://reportapi.eastmoney.com/report/list2'
          variants=['00165','0165','165','HK00165','HK0165','00165.HK','0165.HK']
          for code in variants:
              for qtype in [0,1,2,3]:
                  body={
                    'beginTime':'2010-01-01','endTime':'2026-08-31','industryCode':'*',
                    'ratingChange':'*','rating':'*','orgCode':'*','code':code,'rcode':'',
                    'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'qType':qtype,
                  }
                  try:
                      r=s.post(endpoint,json=body,headers={'Content-Type':'application/json','Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/stock.jshtml'},timeout=45)
                      data=r.json()
                      rows=data.get('data') or []
                      print('EM_POST',code,qtype,r.status_code,'ROWS',len(rows),'TOTAL',data.get('TotalCount') or data.get('totalCount'),'PAGES',data.get('TotalPage') or data.get('totalPage'),flush=True)
                      for row in rows:
                          blob=json.dumps(row,ensure_ascii=False)
                          if any(k in blob for k in ['光大控股','00165','0165']):
                              dump('EM_ROW',row)
                  except Exception as e:
                      print('EM_POST_ERROR',code,qtype,repr(e),flush=True)
              try:
                  params={
                    'beginTime':'2010-01-01','endTime':'2026-08-31','industryCode':'*',
                    'ratingChange':'*','rating':'*','orgCode':'*','code':code,'rcode':'',
                    'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'qType':0,
                  }
                  r=s.get(endpoint,params=params,headers={'Referer':'https://data.eastmoney.com/report/stock.jshtml'},timeout=45)
                  print('EM_GET',code,r.status_code,len(r.content),r.text[:200],flush=True)
              except Exception as e:
                  print('EM_GET_ERROR',code,repr(e),flush=True)

          print('=== SDYANBAO ===', flush=True)
          sd=requests.Session(); sd.headers.update({'User-Agent':UA,'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          queries=['中国光大控股','00165','0165.HK','跨境资管标的 业绩弹性可期','壮大资管 开启价值发现之旅','光大控股 国泰海通','光大控股 太平洋证券','光大控股 天风证券']
          seen={}
          for q in queries:
              for page in range(1,4):
                  try:
                      r=sd.post('https://api.sdyanbao.com/api/file/search',json={'page':page,'pageSize':100,'keyword':q},timeout=45)
                      payload=r.json(); rows=(payload.get('data') or {}).get('files') or []
                      print('SD_SEARCH',q,page,r.status_code,len(rows),flush=True)
                      for row in rows:
                          blob=json.dumps(row,ensure_ascii=False)
                          if any(k in blob for k in ['中国光大控股','00165','0165.HK','光大控股']):
                              rid=row.get('id')
                              if rid not in seen: seen[rid]=row
                              dump('SD_ROW',row)
                      if len(rows)<100: break
                  except Exception as e:
                      print('SD_SEARCH_ERROR',q,page,repr(e),flush=True); break
          for rid,row in list(seen.items()):
              try:
                  d=sd.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=45).json()
                  detail=d.get('data') or {}
                  dump('SD_DETAIL',detail,20000)
              except Exception as e:
                  print('SD_DETAIL_ERROR',rid,repr(e),flush=True)

          print('=== HIBOR SEARCH ===', flush=True)
          hib=requests.Session(); hib.headers.update({'User-Agent':UA,'Referer':'https://www.hibor.com.cn/','Accept-Language':'zh-CN,zh;q=0.9'})
          hib_urls=[
            'https://www.hibor.com.cn/newweb/web/search?ybfl1=all&ssfw=ybbt&sjfw=3&index=1&f=3x&gjz='+urllib.parse.quote('中国光大控股'),
            'https://www.hibor.com.cn/newweb/HuiSou/s?gjc='+urllib.parse.quote('中国光大控股')+'&sslb=1',
            'https://www.hibor.com.cn/newweb/web/search?ybfl1=all&ssfw=gpdm&sjfw=3&index=1&f=3x&gjz=0165.HK',
          ]
          detail_links=[]
          for u in hib_urls:
              try:
                  r=hib.get(u,timeout=60); r.encoding=r.apparent_encoding or 'utf-8'
                  print('HIB_SEARCH',r.status_code,len(r.content),r.url,flush=True)
                  soup=BeautifulSoup(r.text,'lxml')
                  for a in soup.find_all('a',href=True):
                      href=urllib.parse.urljoin(r.url,a['href'])
                      text=a.get_text(' ',strip=True)
                      if any(p in href for p in ['repinfodetail_','/data/']) and any(k in (text+' '+a.get('title','')) for k in ['光大控股','00165','0165']):
                          print('HIB_LINK',text,a.get('title'),href,flush=True)
                          if href not in detail_links: detail_links.append(href)
                  for m in re.finditer(r'https?://[^"\']+|/repinfodetail_\d+\.html|/data/[a-f0-9]+\.html',r.text):
                      href=urllib.parse.urljoin(r.url,m.group(0))
                      if href not in detail_links and ('repinfodetail_' in href or '/data/' in href): detail_links.append(href)
              except Exception as e:
                  print('HIB_SEARCH_ERROR',u,repr(e),flush=True)
          # known latest page
          detail_links.insert(0,'https://www.hibor.com.cn/repinfodetail_5073681.html')
          for u in detail_links[:40]:
              try:
                  r=hib.get(u,timeout=60); r.encoding=r.apparent_encoding or 'utf-8'
                  if '光大控股' not in r.text and '00165' not in r.text and '0165.HK' not in r.text: continue
                  soup=BeautifulSoup(r.text,'lxml')
                  title=(soup.title.get_text(' ',strip=True) if soup.title else '')
                  page_text=soup.get_text(' ',strip=True)
                  gifs=re.findall(r'https?://[^"\']+/CheckMd5File/img/\d{4}/\d{1,2}/\d+\.gif',r.text)
                  print('HIB_DETAIL',r.status_code,len(r.content),u,title[:300],flush=True)
                  print('HIB_META',page_text[:1800],flush=True)
                  print('HIB_GIFS',gifs,flush=True)
              except Exception as e:
                  print('HIB_DETAIL_ERROR',u,repr(e),flush=True)

          print('=== VZKOO/FUTURE THINK TANK ===', flush=True)
          vz_urls=[
            'https://www.vzkoo.com/read/4661212100247425024.html',
            'https://www.vzkoo.com/search?keyword='+urllib.parse.quote('中国光大控股'),
            'https://www.vzkoo.com/search/'+urllib.parse.quote('中国光大控股'),
          ]
          for u in vz_urls:
              try:
                  r=s.get(u,headers={'Referer':'https://www.vzkoo.com/','User-Agent':UA},timeout=60)
                  r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                  print('VZ_PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  print('VZ_SNIP',r.text[:3000],flush=True)
                  for patt in [r'https?://[^"\']+\.pdf[^"\']*',r'https?://[^"\']+(?:download|file|report)[^"\']*',r'["\']([^"\']*(?:pdf|download|file|report)[^"\']*)["\']']:
                      vals=re.findall(patt,r.text,re.I)
                      if vals: print('VZ_MATCH',patt,vals[:100],flush=True)
              except Exception as e:
                  print('VZ_ERROR',u,repr(e),flush=True)

          print('=== OTHER KNOWN PAGES ===', flush=True)
          other=[
            'https://daily.hstong.com/news/detail/26042422034988912',
            'https://www.usmartsecurities.com/zh-hk/news-detail/6651004101192695948',
            'https://basic.10jqka.com.cn/new/HK0165/rating.html',
          ]
          for u in other:
              try:
                  r=s.get(u,timeout=60); r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                  print('OTHER',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  print(r.text[:1500],flush=True)
                  pdfs=re.findall(r'https?://[^"\']+\.pdf[^"\']*',r.text,re.I)
                  print('OTHER_PDFS',pdfs[:50],flush=True)
              except Exception as e:
                  print('OTHER_ERROR',u,repr(e),flush=True)
          PY