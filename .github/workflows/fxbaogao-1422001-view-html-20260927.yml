name: Fetch fxbaogao 1422001 view HTML 20260927

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-1422001-view-html-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch view HTML and public image candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests, re, json, urllib.parse, time
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/detail/1422001'})
          urls=['https://www.fxbaogao.com/view?id=1422001','https://m.fxbaogao.com/view?id=1422001']
          allurls=[]
          for idx,u in enumerate(urls):
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('PAGE',idx,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path(f'out/view_{idx}.html').write_bytes(r.content)
              text=r.text
              for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                x=m.group(0).replace('\\/','/').rstrip(');,]')
                allurls.append(x)
              for term in ['1422001','report-image','pdf','download','fileUrl','reportUrl','oss','pageCount','page_count','totalPage','images','api','login','vip']:
                print('\nTERM',idx,term,flush=True)
                for m in list(re.finditer(re.escape(term),text,re.I))[:30]:
                  print(text[max(0,m.start()-300):min(len(text),m.end()+700)].replace('\n',' ')[:1200],flush=True)
            except Exception as e:
              print('ERR',u,repr(e),flush=True)
          Path('out/urls.txt').write_text('\n'.join(sorted(set(allurls))),encoding='utf-8')

          # Probe predictable public report images. Stop after repeated misses.
          image_records=[]
          misses=0
          for page in range(1,101):
            candidates=[
              f'https://public.fxbaogao.com/report-image/2019/08/31/1422001-{page}.png',
              f'https://public.fxbaogao.com/report-image/2019/08/31/1422001-{page}.jpg',
              f'https://public.fxbaogao.com/report-image/2019/08/31/1422001-{page}.webp',
            ]
            found=False
            for cu in candidates:
              try:
                rr=s.get(cu,timeout=(15,90),allow_redirects=True)
                ct=(rr.headers.get('content-type') or '').lower()
                ok=rr.status_code==200 and len(rr.content)>5000 and ('image' in ct or rr.content[:8] in [b'\x89PNG\r\n\x1a\n'] or rr.content[:2]==b'\xff\xd8')
                print('IMG',page,rr.status_code,len(rr.content),ct,ok,cu,flush=True)
                image_records.append({'page':page,'url':cu,'status':rr.status_code,'bytes':len(rr.content),'content_type':ct,'ok':ok})
                if ok:
                  ext='png' if rr.content.startswith(b'\x89PNG') else 'jpg' if rr.content.startswith(b'\xff\xd8') else 'img'
                  Path(f'out/page_{page:03d}.{ext}').write_bytes(rr.content)
                  found=True
                  break
              except Exception as e:
                image_records.append({'page':page,'url':cu,'error':repr(e),'ok':False})
            if found:
              misses=0
            else:
              misses+=1
              if misses>=3 and page>3:
                break
          Path('out/image_records.json').write_text(json.dumps(image_records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-1422001-view-html
          path: out
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
