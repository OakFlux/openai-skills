name: Build Transsion 688036 brokerage deep reports ZIP 20260927

on:
  push:
    paths:
      - '.github/workflows/transsion-688036-brokerage-deep-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download selected deep reports and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '传音控股_688036_券商深度报告精选_3份'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'filename': '01_开源证券_2025-11-19_公司首次覆盖报告_新兴市场手机王者_多元化全球化高端化打开空间.pdf',
                  'broker': '开源证券',
                  'date': '2025-11-19',
                  'title': '公司首次覆盖报告：新兴市场手机王者，多元化/全球化/高端化打开空间',
                  'authors': '陈蓉芳、张威震',
                  'info_code': 'AP202511191784337653',
                  'expected_pages': 52,
                  'min_pages': 48,
                  'min_bytes': 2_000_000,
              },
              {
                  'filename': '02_华安证券_2024-12-25_全球新兴市场手机头部企业_多元化业务布局空间广阔.pdf',
                  'broker': '华安证券',
                  'date': '2024-12-25',
                  'title': '全球新兴市场手机头部企业，多元化业务布局空间广阔',
                  'authors': '陈耀波、刘志来',
                  'info_code': 'AP202412251641420493',
                  'expected_pages': 26,
                  'min_pages': 23,
                  'min_bytes': 2_000_000,
              },
              {
                  'filename': '03_太平洋证券_2024-09-25_新兴市场基本盘稳固_横纵业务拓展再度腾飞.pdf',
                  'broker': '太平洋证券',
                  'date': '2024-09-25',
                  'title': '新兴市场基本盘稳固，横纵业务拓展再度腾飞',
                  'authors': '张世杰、罗平',
                  'info_code': 'AP202409251640031798',
                  'expected_pages': 24,
                  'min_pages': 21,
                  'min_bytes': 700_000,
              },
          ]

          def url_candidates(info_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.PDF',
              ]

          def download(report: dict, dest: Path) -> str:
              errors: list[str] = []
              for url in url_candidates(report['info_code']):
                  for attempt in range(1, 4):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      tmp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/report/stock.jshtml?encodeUrl=',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 420),
                          ) as response:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              header = fh.read(8)
                          if size < report['min_bytes'] or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, header={header!r}')
                          tmp.replace(dest)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f"download failed for {dest.name}: {errors}")

          records: list[dict] = []
          hashes: set[str] = set()
          for report in reports:
              dest = OUT / report['filename']
              source_url = download(report, dest)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')
              if abs(pages - report['expected_pages']) > 3:
                  raise RuntimeError(f'unexpected page count for {dest.name}: {pages}, expected about {report["expected_pages"]}')

              validation = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if validation.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {dest.name}: {validation.stderr[-2000:]}')

              data = dest.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              hashes.add(sha256)

              record = {
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'info_code': report['info_code'],
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '传音控股（688036.SH）券商深度报告精选',
              '整理日期：2026-09-27',
              '',
              '筛选原则：优先选择近年、完整篇幅、首次覆盖或公司深度类报告，并尽量覆盖不同券商。',
              '资料来源：东方财富研究报告公开文件服务器。',
              '所有PDF均完成文件头、文件大小、页数、qpdf结构、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['broker']}，{record['date']}",
                  f"   标题：{record['title']}",
                  f"   作者：{record['authors']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   文件：{record['filename']}",
                  f"   来源：{record['source_url']}",
                  f"   信息代码：{record['info_code']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'expected 3 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: transsion-688036-brokerage-deep-reports-20260927
          path: 传音控股_688036_券商深度报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
