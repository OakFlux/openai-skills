name: Inspect Sina China Baoan report page

on:
  push:
    paths:
      - '.github/workflows/china-baoan-000009-broker-deep-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and print page
        shell: bash
        run: |
          python - <<'PY'
          import requests
          u = 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/349169055092/index.phtml'
          r = requests.get(u, headers={'User-Agent':'Mozilla/5.0'}, timeout=60)
          print('STATUS', r.status_code, 'BYTES', len(r.content), 'TYPE', r.headers.get('content-type'))
          text = r.content.decode('gb18030', errors='replace')
          print(text[:50000])
          PY
