name: Inspect Sina report attachment
on:
  push:
    paths:
      - '.github/workflows/china-baoan-000009-broker-deep-reports-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch report page
        run: |
          curl -L --fail --silent --show-error --user-agent 'Mozilla/5.0' 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/349169055092/index.phtml' -o report.html
          file report.html
          grep -Eio 'https?[^" ]+|href="[^"]+"|src="[^"]+"|rptid[/=][0-9]+' report.html | grep -Ei 'pdf|download|report|rptid|file' | head -300 || true
          grep -Ein 'pdf|download|附件|全文|报告原文|rptid' report.html | head -200 || true
