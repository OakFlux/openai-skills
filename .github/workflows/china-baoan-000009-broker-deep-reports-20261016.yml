name: Inspect SGPJBG China Baoan report link

on:
  push:
    paths:
      - '.github/workflows/china-baoan-000009-broker-deep-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect report links
        shell: bash
        run: |
          python - <<'PY'
          import html, re, requests
          from urllib.parse import urljoin
          urls=[
            'https://www.sgpjbg.com.cn/zhuanti/teruisibaogao.html',
            'https://www.sgpjbg.com/zhuanti/teruisibaogao.html',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.sgpjbg.com/'})
          needle='中国宝安：手握贝特瑞核心资产治理优化整装待发'
          for u in urls:
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              print('\nURL',u,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'))
              r.encoding=r.apparent_encoding or 'utf-8'
              text=r.text
              pos=text.find(needle)
              print('NEEDLE_POS',pos,'ENC',r.encoding)
              if pos>=0:
                print('CONTEXT',text[max(0,pos-5000):pos+10000])
              print('MATCHING_ANCHORS')
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                href,body=m.groups()
                body_text=html.unescape(re.sub(r'<[^>]+>',' ',body))
                body_text=re.sub(r'\s+',' ',body_text).strip()
                if '中国宝安' in body_text or '手握贝特瑞' in body_text or '中国宝安' in href:
                  print(urljoin(r.url,href),'TEXT=',body_text[:500])
              print('PDF_URLS')
              for x in sorted(set(re.findall(r'https?[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',text,re.I))):
                if 'bao' in x.lower() or '000009' in x or '20210808' in x: print(x)
            except Exception as e:
              print('ERROR',u,repr(e))
          PY
