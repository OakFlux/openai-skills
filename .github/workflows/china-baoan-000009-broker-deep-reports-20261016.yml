name: Discover China Baoan report IDs from date windows

on:
  push:
    paths:
      - '.github/workflows/china-baoan-000009-broker-deep-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Scan Eastmoney report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests

          s=requests.Session()
          s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2021-07-05','2021-07-12'),
            ('2021-08-01','2021-08-12'),
            ('2021-10-20','2021-10-30'),
            ('2020-01-01','2022-12-31'),
          ]
          matches={}
          for begin,end in windows:
            for page in range(1,101):
              cb=f'datatable{begin.replace("-","")}{page}'
              params={
                'cb':cb,
                'industryCode':'*','pageSize':'100','industry':'*',
                'rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,
                'pageNo':str(page),'fields':'','qType':'0','orgCode':'*',
                'code':'*','rcode':'*','p':str(page),'pageNum':str(page),
                'pageNumber':str(page),'_':str(int(time.time()*1000)),
              }
              r=s.get(url,params=params,timeout=60)
              print('REQUEST',begin,end,page,r.status_code,len(r.content),r.url,flush=True)
              text=r.text.strip()
              if text.startswith(cb+'(') and text.endswith(')'):
                text=text[len(cb)+1:-1]
              data=json.loads(text)
              rows=data.get('data') or []
              print('PAGE_META',json.dumps({'begin':begin,'end':end,'page':page,'rows':len(rows),'hits':data.get('hits'),'TotalPage':data.get('TotalPage')},ensure_ascii=False),flush=True)
              for row in rows:
                title=str(row.get('title') or '')
                stock_name=str(row.get('stockName') or '')
                stock_code=str(row.get('stockCode') or '')
                if '中国宝安' in title or '中国宝安' in stock_name or stock_code=='000009':
                  key=str(row.get('infoCode') or '')
                  matches[key]=row
                  print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
              total=int(data.get('TotalPage') or 0)
              if not rows or (total and page>=total) or len(rows)<100:
                break
              time.sleep(0.15)
          print('FINAL_MATCHES',json.dumps(list(matches.values()),ensure_ascii=False,indent=2),flush=True)
          if not matches:
            raise RuntimeError('No China Baoan reports found in all-report scans')
          PY
