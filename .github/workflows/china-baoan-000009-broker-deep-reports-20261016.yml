name: Build China Baoan 000009 broker deep reports 20261016

on:
  push:
    paths:
      - '.github/workflows/china-baoan-000009-broker-deep-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package broker reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '000009'
          COMPANY_SHORT = '中国宝安'
          COMPANY_FULL = '中国宝安集团股份有限公司'
          PACKAGE = '中国宝安_000009_券商深度报告_公开完整PDF'
          ROOT = Path('china_baoan_broker_work')
          FINAL = ROOT / 'final'
          PREVIEW = ROOT / 'preview'
          ARTIFACT = Path('artifact_out')
          for d in (FINAL, PREVIEW, ARTIFACT):
              d.mkdir(parents=True, exist_ok=True)

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/json,text/plain,*/*',
          })

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          records: list[dict[str, Any]] = []
          seen: set[str] = set()
          request_log: list[dict[str, Any]] = []

          for page in range(1, 11):
              params = {
                  'industryCode': '*',
                  'pageSize': '100',
                  'industry': '*',
                  'rating': '*',
                  'ratingChange': '*',
                  'beginTime': '2017-01-01',
                  'endTime': '2030-01-01',
                  'pageNo': str(page),
                  'fields': '',
                  'qType': '0',
                  'orgCode': '',
                  'code': STOCK_CODE,
                  'rcode': '',
                  'p': str(page),
                  'pageNum': str(page),
                  'pageNumber': str(page),
              }
              payload = None
              last: Any = None
              for attempt in range(1, 8):
                  try:
                      r = s.get(endpoint, params=params, timeout=(20, 120))
                      last = {'status': r.status_code, 'bytes': len(r.content), 'text': r.text[:200]}
                      if r.status_code == 200:
                          payload = r.json()
                          break
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(attempt)
              if payload is None:
                  raise RuntimeError(f'Report API failed page {page}: {last}')

              batch = payload.get('data') or payload.get('Data') or []
              if isinstance(batch, dict):
                  batch = batch.get('list') or batch.get('data') or []
              request_log.append({
                  'page': page,
                  'count': len(batch),
                  'hits': payload.get('hits') or payload.get('Hits'),
                  'size': payload.get('size') or payload.get('Size'),
              })
              if not batch:
                  break
              for row in batch:
                  info = str(row.get('infoCode') or row.get('info_code') or '').strip()
                  if info and info not in seen:
                      seen.add(info)
                      records.append(row)
              if len(batch) < 100:
                  break
              time.sleep(0.5)

          if not records:
              raise RuntimeError('No broker report metadata returned')

          def as_int(value: Any) -> int:
              try:
                  return int(float(str(value or 0)))
              except Exception:
                  return 0

          def compact(value: Any) -> str:
              return re.sub(r'\s+', '', str(value or ''))

          def pub_year(row: dict[str, Any]) -> int:
              m = re.match(r'(\d{4})', str(row.get('publishDate') or row.get('publish_date') or ''))
              return int(m.group(1)) if m else 0

          def score(row: dict[str, Any]) -> int:
              title = compact(row.get('title'))
              pages = as_int(row.get('attachPages') or row.get('attach_pages'))
              value = pages * 3 + max(0, pub_year(row) - 2016)
              positive = {
                  '深度报告': 320,
                  '公司深度': 300,
                  '深度研究': 300,
                  '首次覆盖': 280,
                  '公司首次覆盖': 300,
                  '价值重估': 180,
                  '平台价值': 160,
                  '新能源材料': 100,
                  '贝特瑞': 80,
              }
              negative = {
                  '点评': 180,
                  '季报': 170,
                  '年报': 160,
                  '中报': 160,
                  '业绩快报': 200,
                  '事件': 120,
                  '跟踪': 80,
                  '更新': 60,
                  '简评': 160,
              }
              for key, weight in positive.items():
                  if key in title:
                      value += weight
              for key, weight in negative.items():
                  if key in title and not any(x in title for x in ['深度报告', '公司深度', '首次覆盖']):
                      value -= weight
              if pages >= 30:
                  value += 100
              elif pages >= 20:
                  value += 60
              elif pages >= 15:
                  value += 20
              return value

          ranked = sorted(records, key=lambda row: (score(row), as_int(row.get('attachPages')), str(row.get('publishDate') or '')), reverse=True)
          metadata_view = []
          for row in ranked:
              metadata_view.append({
                  'score': score(row),
                  'infoCode': row.get('infoCode'),
                  'title': row.get('title'),
                  'publishDate': row.get('publishDate'),
                  'orgSName': row.get('orgSName'),
                  'researcher': row.get('researcher'),
                  'emRatingName': row.get('emRatingName'),
                  'attachPages': row.get('attachPages'),
                  'stockCode': row.get('stockCode'),
                  'stockName': row.get('stockName'),
              })
          print('REPORT_METADATA', json.dumps(metadata_view, ensure_ascii=False, indent=2), flush=True)

          def download_pdf(info_code: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(1, 6):
                      try:
                          r = s.get(url, timeout=(30, 300), allow_redirects=True, headers={
                              'User-Agent': s.headers['User-Agent'],
                              'Referer': 'https://data.eastmoney.com/report/',
                              'Accept': 'application/pdf,*/*;q=0.8',
                          })
                          last = {
                              'requested_url': url,
                              'final_url': str(r.url),
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                          }
                          if r.status_code == 200 and r.content.startswith(b'%PDF-') and len(r.content) > 100_000:
                              return r.content, str(r.url), last
                      except Exception as exc:
                          last = {'requested_url': url, 'error': repr(exc)}
                      time.sleep(attempt)
              raise RuntimeError(f'PDF download failed {info_code}: {last}')

          def safe_name(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:110]

          selected: list[dict[str, Any]] = []
          rejected: list[dict[str, Any]] = []
          used_hashes: set[str] = set()

          for row in ranked:
              if len(selected) >= 3:
                  break
              info_code = str(row.get('infoCode') or '').strip()
              title = str(row.get('title') or '').strip()
              broker = str(row.get('orgSName') or '未知券商').strip()
              date = str(row.get('publishDate') or '')[:10]
              if not info_code or not title:
                  continue
              try:
                  data, pdf_url, download_meta = download_pdf(info_code)
                  temp = ROOT / f'{info_code}.pdf'
                  temp.write_bytes(data)
                  reader = PdfReader(str(temp), strict=False)
                  pages = len(reader.pages)
                  if pages < 15:
                      rejected.append({'infoCode': info_code, 'title': title, 'reason': f'too few pages: {pages}'})
                      temp.unlink(missing_ok=True)
                      continue

                  indices = list(range(min(12, pages)))
                  if pages > 2:
                      indices.extend([pages - 2, pages - 1])
                  parts = []
                  for idx in dict.fromkeys(indices):
                      try:
                          parts.append(reader.pages[idx].extract_text() or '')
                      except Exception:
                          pass
                  text = compact('\n'.join(parts))
                  identity_ok = any(x in text for x in [COMPANY_SHORT, COMPANY_FULL, STOCK_CODE, '中国宝安集团'])
                  if not identity_ok:
                      rejected.append({'infoCode': info_code, 'title': title, 'reason': 'issuer identity mismatch'})
                      temp.unlink(missing_ok=True)
                      continue

                  q = subprocess.run(['qpdf', '--warning-exit-0', '--check', str(temp)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  if q.returncode != 0:
                      rejected.append({'infoCode': info_code, 'title': title, 'reason': 'qpdf structure failure'})
                      temp.unlink(missing_ok=True)
                      continue

                  sha = hashlib.sha256(data).hexdigest()
                  if sha in used_hashes:
                      rejected.append({'infoCode': info_code, 'title': title, 'reason': 'duplicate PDF content'})
                      temp.unlink(missing_ok=True)
                      continue
                  used_hashes.add(sha)

                  filename = f'{len(selected)+1:02d}_{safe_name(broker)}_中国宝安_{safe_name(title)}_{date}.pdf'
                  dest = FINAL / filename
                  temp.replace(dest)

                  first_prefix = PREVIEW / f'{len(selected)+1:02d}_first'
                  last_prefix = PREVIEW / f'{len(selected)+1:02d}_last'
                  subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '120', '-singlefile', str(dest), str(first_prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  subprocess.run(['pdftoppm', '-f', str(pages), '-l', str(pages), '-png', '-r', '100', '-singlefile', str(dest), str(last_prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  first_png = Path(str(first_prefix) + '.png')
                  last_png = Path(str(last_prefix) + '.png')
                  if not first_png.exists() or first_png.stat().st_size < 8_000 or not last_png.exists() or last_png.stat().st_size < 3_000:
                      dest.unlink(missing_ok=True)
                      rejected.append({'infoCode': info_code, 'title': title, 'reason': 'render validation failure'})
                      continue

                  selected.append({
                      'filename': filename,
                      'broker': broker,
                      'publish_date': date,
                      'title': title,
                      'researcher': row.get('researcher'),
                      'rating': row.get('emRatingName'),
                      'infoCode': info_code,
                      'metadata_attach_pages': as_int(row.get('attachPages')),
                      'actual_pages': pages,
                      'score': score(row),
                      'report_page': f'https://data.eastmoney.com/report/info/{info_code}.html',
                      'pdf_url': pdf_url,
                      'bytes': len(data),
                      'sha256': sha,
                      'identity_text_check': identity_ok,
                      'download_meta': download_meta,
                      'validation': ['PDF header', 'issuer identity', 'minimum 15 pages', 'qpdf structure', 'first-page render', 'last-page render', 'duplicate hash check'],
                  })
              except Exception as exc:
                  rejected.append({'infoCode': info_code, 'title': title, 'reason': repr(exc)})

          if len(selected) < 2:
              raise RuntimeError(f'Fewer than 2 valid long company reports. selected={selected}, rejected={rejected}')

          count = len(selected)
          final_zip_name = f'中国宝安_000009_券商深度报告_{count}份_公开完整PDF.zip'
          readme = [
              '中国宝安集团股份有限公司（000009.SZ）券商深度报告资料包',
              '整理日期：2026-10-16',
              '',
              f'本包收录{count}份公开可直接取得、且经全文核验的中国宝安公司专属长篇券商报告。',
              '筛选口径：证券代码000009；PDF不少于15页；正文能够核验公司名称或证券代码；优先选择深度报告、首次覆盖和长篇研究。',
              '未使用同业报告、网页摘要、缺页预览或短篇财报点评补足数量。',
              '',
              '文件清单：',
          ]
          for i, x in enumerate(selected, 1):
              readme += [
                  f'{i}. {x["broker"]}：《{x["title"]}》',
                  f'   日期：{x["publish_date"]}；评级：{x.get("rating") or "未标注"}；研究员：{x.get("researcher") or "未标注"}',
                  f'   完整页数：{x["actual_pages"]}页；文件：{x["filename"]}',
                  f'   来源页面：{x["report_page"]}',
                  f'   SHA-256：{x["sha256"]}',
                  '',
              ]
          readme += [
              '版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司身份、实际页数、qpdf结构、首页与末页渲染、重复文件和ZIP CRC。',
          ]

          (FINAL / '00_文件清单与筛选口径.txt').write_text('\n'.join(readme), encoding='utf-8')
          (FINAL / 'manifest.json').write_text(json.dumps(selected, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / '原始研报检索元数据.json').write_text(json.dumps(metadata_view, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / '筛选排除记录.json').write_text(json.dumps(rejected, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / '接口请求记录.json').write_text(json.dumps(request_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in selected), encoding='utf-8')

          zip_path = ARTIFACT / final_zip_name
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(FINAL.iterdir()):
                  if p.is_file():
                      z.write(p, arcname=p.name)
          with zipfile.ZipFile(zip_path, 'r') as z:
              bad = z.testzip()
              pdfs = [name for name in z.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != count:
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} expected={count}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('SELECTED_REPORTS', json.dumps(selected, ensure_ascii=False, indent=2), flush=True)
          print('REJECTED_REPORTS', json.dumps(rejected, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', count, 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: china-baoan-000009-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
