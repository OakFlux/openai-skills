name: List Sina China Baoan research reports

on:
  push:
    paths:
      - '.github/workflows/china-baoan-000009-broker-deep-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch search result pages
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          import requests
          from urllib.parse import urljoin
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          base = 'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml'
          found = {}
          for page in range(1, 31):
              params = {'t1':'2','symbol':'000009','p':str(page)}
              r = s.get(base, params=params, timeout=60)
              text = r.content.decode('gb18030', errors='replace')
              print('PAGE', page, 'STATUS', r.status_code, 'BYTES', len(r.content), 'URL', r.url)
              hits = re.findall(r'href="([^"]*vReport_Show[^"]*rptid/(\d+)/[^"]*)"[^>]*>(.*?)</a>', text, flags=re.I|re.S)
              for href, rptid, title_html in hits:
                  title = re.sub(r'<[^>]+>', '', title_html)
                  title = html.unescape(title).strip()
                  found[rptid] = {'rptid':rptid,'title':title,'url':urljoin(r.url,href)}
              if not hits and page > 1:
                  break
          print('FOUND_COUNT', len(found))
          for item in found.values():
              print('REPORT', item)
          PY
