name: Package Makeng Mining 601123 official filings v3

on:
  push:
    paths:
      - '.github/workflows/makeng-mining-601123-official-filings-20261104-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, verify and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import re
          import shutil
          import time
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE = '601123'
          COMPANY = '马矿股份'
          FULL_COMPANY = '福建马坑矿业股份有限公司'
          LISTING_DATE = '2026-09-01'
          CUTOFF = '2026-11-04'
          CUTOFF_COMPACT = '20261104'
          ROOT_NAME = f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_附IPO审计报告_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          NOTE_DIR = ROOT / '00_年报情况说明'
          PROSPECTUS_DIR = ROOT / '01_招股说明书'
          AUDIT_DIR = ROOT / '02_IPO财务报告及审计报告'
          QUARTER_DIR = ROOT / '03_最新季度报告'
          PREVIEW_DIR = ROOT / '首页预览'
          DIST = Path('dist')
          for directory in (NOTE_DIR, PROSPECTUS_DIR, AUDIT_DIR, QUARTER_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          retry = Retry(
              total=4,
              connect=4,
              read=4,
              status=4,
              backoff_factor=0.8,
              status_forcelist=(408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}),
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.mount('http://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Connection': 'close',
          })

          documents = [
              {
                  'document_type': 'prospectus',
                  'title': '首次公开发行股票并在主板上市招股说明书',
                  'date': '2026-08-27',
                  'destination': PROSPECTUS_DIR / '2026_马矿股份_首次公开发行股票并在主板上市招股说明书.pdf',
                  'min_pages': 250,
                  'required_any': ('招股说明书',),
                  'candidates': [
                      {
                          'url': 'http://pdffile.qianlong.com.cn:21380/NoticeFile/SH/Stock/2026-08-27/601123_20260827_KVSF.pdf',
                          'note': '正式发行版招股说明书公开镜像，文件标识与上交所公告一致',
                      },
                      {
                          'url': 'https://pdffile.qianlong.com.cn:21380/NoticeFile/SH/Stock/2026-08-27/601123_20260827_KVSF.pdf',
                          'note': '正式发行版招股说明书公开镜像，文件标识与上交所公告一致',
                      },
                      {
                          'url': 'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-08-27/601123_20260827_KVSF.pdf',
                          'note': '上交所正式发行版公告原文',
                      },
                      {
                          'url': 'http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-08-27/601123_20260827_KVSF.pdf',
                          'note': '上交所正式发行版公告原文',
                      },
                      {
                          'url': 'https://static.sse.com.cn/stock/disclosure/announcement/c/202605/002132_20260529_ZFLM.pdf',
                          'note': '上交所注册稿招股说明书备用版本',
                          'fallback_version': '注册稿',
                      },
                  ],
              },
              {
                  'document_type': 'ipo_audit_report',
                  'title': '发行人最近三年的财务报告和审计报告（2023—2025年度）',
                  'date': '2026-05-29',
                  'destination': AUDIT_DIR / '2023-2025_马矿股份_财务报告及审计报告.pdf',
                  'min_pages': 100,
                  'required_any': ('审计报告', '财务报表'),
                  'candidates': [
                      {
                          'url': 'https://static.sse.com.cn/stock/disclosure/announcement/c/202605/002132_20260529_OB7W.pdf',
                          'note': '上交所IPO注册稿配套审计报告',
                      },
                  ],
              },
              {
                  'document_type': 'quarterly_report',
                  'title': '2026年第三季度报告',
                  'date': '2026-10-28',
                  'destination': QUARTER_DIR / '2026Q3_马矿股份_2026年第三季度报告.pdf',
                  'min_pages': 5,
                  'required_any': ('第三季度报告',),
                  'candidates': [
                      {
                          'url': 'http://pdffile.qianlong.com.cn:21380/NoticeFile/SH/Stock/2026-10-28/601123_20261028_64RN.pdf',
                          'note': '第三季度报告公开镜像，文件标识与上交所公告一致',
                      },
                      {
                          'url': 'https://pdffile.qianlong.com.cn:21380/NoticeFile/SH/Stock/2026-10-28/601123_20261028_64RN.pdf',
                          'note': '第三季度报告公开镜像，文件标识与上交所公告一致',
                      },
                      {
                          'url': 'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-28/601123_20261028_64RN.pdf',
                          'note': '上交所第三季度报告原文',
                      },
                      {
                          'url': 'http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-28/601123_20261028_64RN.pdf',
                          'note': '上交所第三季度报告原文',
                      },
                  ],
              },
          ]

          def validate_pdf_bytes(data: bytes, minimum_pages: int, document_type: str) -> tuple[int, str]:
              if len(data) < 50_000 or not data.startswith(b'%PDF'):
                  raise ValueError(f'not a complete PDF: size={len(data)}, head={data[:20]!r}')
              reader = PdfReader(io.BytesIO(data), strict=False)
              if reader.is_encrypted:
                  reader.decrypt('')
              pages = len(reader.pages)
              if pages < minimum_pages:
                  raise ValueError(f'page count below minimum: {pages} < {minimum_pages}')
              sample = ''
              indexes = list(range(min(15, pages)))
              if pages > 15:
                  indexes.extend(range(max(15, pages - 5), pages))
              for index in sorted(set(indexes)):
                  try:
                      sample += reader.pages[index].extract_text() or ''
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', sample)
              if CODE not in compact and COMPANY not in compact and FULL_COMPANY not in compact:
                  raise ValueError(f'company identity missing for {document_type}')
              return pages, compact

          def download_candidate(document: dict) -> tuple[bytes, dict, int, str]:
              errors = []
              for candidate in document['candidates']:
                  url = candidate['url']
                  referers = [
                      'https://www.sse.com.cn/',
                      'https://act.ql18.com.cn/',
                      'https://www.ql18.com.cn/',
                      None,
                  ]
                  for referer in referers:
                      headers = {}
                      if referer:
                          headers['Referer'] = referer
                      try:
                          response = session.get(url, headers=headers, timeout=180, allow_redirects=True)
                          print('TRY', document['document_type'], response.status_code, len(response.content), url, 'referer=', referer, '->', response.url)
                          if response.status_code != 200:
                              errors.append(f'{url} [{referer}]: status={response.status_code}')
                              continue
                          pages, compact = validate_pdf_bytes(
                              response.content,
                              int(document['min_pages']),
                              document['document_type'],
                          )
                          terms = [re.sub(r'\s+', '', value) for value in document['required_any']]
                          if not any(term in compact for term in terms):
                              raise ValueError(f'document-type terms missing: {terms}')
                          return response.content, {**candidate, 'resolved_url': response.url}, pages, compact
                      except Exception as exc:
                          errors.append(f'{url} [{referer}]: {exc!r}')
                          print('CANDIDATE_ERROR', errors[-1])
                          time.sleep(0.3)
              raise RuntimeError('all candidates failed for ' + document['title'] + ': ' + ' | '.join(errors))

          records = []
          prospectus_version = '正式发行版'
          for document in documents:
              data, source, page_count, compact = download_candidate(document)
              destination = Path(document['destination'])
              if document['document_type'] == 'prospectus' and source.get('fallback_version'):
                  prospectus_version = source['fallback_version']
                  destination = destination.with_name(destination.stem + '_注册稿备用版.pdf')
              destination.write_bytes(data)

              doc = fitz.open(destination)
              if doc.page_count != page_count:
                  raise RuntimeError(f'双解析器页数不一致: {destination}: {doc.page_count} vs {page_count}')
              first = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 100:
                  raise RuntimeError(f'首末页渲染异常: {destination}')
              first.save(PREVIEW_DIR / f'{destination.stem}.png')
              doc.close()

              record = {
                  'document_type': document['document_type'],
                  'title': document['title'],
                  'date': document['date'],
                  'source_url': source['url'],
                  'resolved_url': source['resolved_url'],
                  'source_note': source['note'],
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          note_lines = [
              '# 马矿股份（601123）年度报告情况说明',
              '',
              f'- 公司于 **{LISTING_DATE}** 在上海证券交易所主板上市。',
              f'- 截至 **{CUTOFF}**，公司尚未进入首个上市公司年度报告披露期，因此上市以来已披露年度报告数量为 **0份**。',
              '- 为便于查阅历史年度财务信息，本包补充收录IPO申报文件中的《发行人最近三年的财务报告和审计报告》，覆盖 **2023—2025年度**。',
              '- 该审计报告不等同于上市公司定期年度报告。',
              f'- 招股说明书版本：{prospectus_version}。',
              '- 最新季报为2026年第三季度报告。',
          ]
          (NOTE_DIR / '年报情况说明.md').write_text('\n'.join(note_lines) + '\n', encoding='utf-8')

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'market': '上海证券交易所主板',
              'listing_date': LISTING_DATE,
              'cutoff_date': CUTOFF,
              'listed_company_annual_report_count': 0,
              'supplementary_audited_years': [2023, 2024, 2025],
              'prospectus_version': prospectus_version,
              'latest_quarter': '2026Q3',
              'document_count': len(records),
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）官方披露文件包',
              '',
              f'- 截止日期：{CUTOFF}',
              f'- 上市日期：{LISTING_DATE}',
              '- 上市以来年度报告：0份（尚未进入首个年报披露期）。',
              f'- 招股说明书：1份（{prospectus_version}）。',
              '- IPO财务报告及审计报告：1份，覆盖2023—2025年度。',
              '- 最新季度报告：2026年第三季度报告。',
              '- 已完成PDF文件头、双解析器页数、公司与文档类型身份、首末页渲染、SHA-256及ZIP CRC校验。',
              '',
              '## 文件清单',
              '',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 标题：{record['title']}",
                  f"   - 日期：{record['date']}",
                  f"   - 页数：{record['page_count']}；大小：{record['file_size_bytes']:,}字节",
                  f"   - 来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'makeng_mining_601123_prospectus_audited_financials_latest_quarter_{CUTOFF_COMPACT}.zip'
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC校验失败: {path}: {bad}')
                  pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdfs) != 3:
                      raise RuntimeError(f'ZIP内PDF数量异常: {path}: {len(pdfs)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())

          print('FINAL_JSON', json.dumps({
              'listed_company_annual_report_count': 0,
              'supplementary_audited_years': [2023, 2024, 2025],
              'prospectus_version': prospectus_version,
              'latest_quarter': '2026Q3',
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': hashlib.sha256(chinese_zip.read_bytes()).hexdigest(),
              'records': records,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: makeng-mining-601123-official-filings-20261104-v3
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
