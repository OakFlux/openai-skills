name: Temporary Hibor fast HTML inspect

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-hibor-fast-html.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and print relevant HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests, json, urllib.parse
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          for host in ['wap.hibor.com.cn','www.hibor.com.cn']:
            url=f'https://{host}/repinfodetail_4644159.html'
            try:
              r=requests.get(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*'},timeout=45,allow_redirects=True)
              print('\nPAGE',url,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
              text=r.text
              for needle in ['打开报告原文','下载报告','免责声明','report','pdf','download','read','show','4644159']:
                for m in list(re.finditer(re.escape(needle),text,re.I))[:40]:
                  p=m.start(); print('CTX',needle,text[max(0,p-1200):p+3500].replace('\n',' ')[:4700])
              for pat in [r'href=["\']([^"\']+)["\']',r'src=["\']([^"\']+)["\']',r'onclick=["\']([^"\']+)["\']']:
                for v in sorted(set(re.findall(pat,text,re.I))):
                  if any(k in v.lower() for k in ['pdf','download','down','read','show','report','4644159']):
                    print('ATTR',urllib.parse.urljoin(r.url,v))
            except Exception as e: print('ERR',url,repr(e))
          PY
