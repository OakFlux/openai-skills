name: Retry SGPJBG China Baoan report inspection
on:
  push:
    paths:
      - '.github/workflows/china-baoan-sgpjbg-inspect-v2-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet curl_cffi beautifulsoup4 lxml
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from curl_cffi import requests
          from bs4 import BeautifulSoup
          urls=['https://www.sgpjbg.com.cn/zhuanti/teruisibaogao.html','https://www.sgpjbg.com/zhuanti/teruisibaogao.html']
          needle='中国宝安：手握贝特瑞核心资产治理优化整装待发'
          s=requests.Session(impersonate='chrome')
          for u in urls:
            print('FETCH',u,flush=True)
            try:
              r=s.get(u,timeout=60,allow_redirects=True,headers={'Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.baidu.com/'})
              print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
              text=r.text
              pos=text.find(needle)
              print('NEEDLE_POS',pos,flush=True)
              if pos>=0: print('CONTEXT',text[max(0,pos-12000):pos+30000],flush=True)
              soup=BeautifulSoup(text,'lxml')
              for tag in soup.find_all(True):
                blob=tag.get_text(' ',strip=True)+' '+json.dumps(tag.attrs,ensure_ascii=False)
                if '中国宝安' in blob or '手握贝特瑞' in blob:
                  print('TAG',tag.name,dict(tag.attrs),'TEXT',tag.get_text(' ',strip=True)[:5000],flush=True)
            except Exception as e:
              print('ERROR',type(e).__name__,str(e),flush=True)
          PY
