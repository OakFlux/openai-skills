name: Build Sidike 300806 annual reports package

on:
  push:
    branches:
      - tmp-sidike-300806-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='斯迪克_300806_2020-2025年报及最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/sidike_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('斯迪克_300806_2020-2025年报及最新季报')
          s = requests.Session()
          s.trust_env = False
          s.mount('https://', HTTPAdapter(max_retries=Retry(
              total=4, connect=4, read=4, status=4, backoff_factor=0.8,
              status_forcelist=[429,500,502,503,504], allowed_methods=['GET'], raise_on_status=False)))
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9',
          })

          docs = [
            dict(order=1,year=2020,kind='annual',title='2020年年度报告',date='2021-04-17',file='01_斯迪克_2020年年度报告.pdf',min_pages=100,urls=[
              'https://static.cninfo.com.cn/finalpage/2021-04-17/1209714136.PDF',
            ]),
            dict(order=2,year=2021,kind='annual',title='2021年年度报告',date='2022-04-25',file='02_斯迪克_2021年年度报告.pdf',min_pages=100,urls=[
              'https://disc.static.szse.cn/disc/disk03/finalpage/2022-04-25/cda8a0a7-c3f5-4891-a8a8-80e50251513a.PDF',
              'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2022/2022-4/2022-04-25/8059195.PDF',
            ]),
            dict(order=3,year=2022,kind='annual',title='2022年年度报告',date='2023-04-26',file='03_斯迪克_2022年年度报告.pdf',min_pages=100,urls=[
              'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-26/9091772.PDF',
              'https://www.100est.com/res/financial-report/r2022/SZ300806_202304251585833187.pdf',
            ]),
            dict(order=4,year=2023,kind='annual',title='2023年年度报告',date='2024-04-19',file='04_斯迪克_2023年年度报告.pdf',min_pages=100,urls=[
              'https://static.cninfo.com.cn/finalpage/2024-04-19/1219667393.PDF',
              'https://disc.static.szse.cn/disc/disk03/finalpage/2024-04-18/197e78da-e33e-4600-b824-0a2a54ab2ab5.PDF',
            ]),
            dict(order=5,year=2024,kind='annual',title='2024年年度报告',date='2025-04-21',file='05_斯迪克_2024年年度报告.pdf',min_pages=100,urls=[
              'https://static.cninfo.com.cn/finalpage/2025-04-21/1223153943.PDF',
              'https://disc.static.szse.cn/disc/disk03/finalpage/2025-04-18/efea57fd-189f-447b-8f4f-4cf0d432aa02.PDF',
            ]),
            dict(order=6,year=2025,kind='annual',title='2025年年度报告',date='2026-04-27',file='06_斯迪克_2025年年度报告.pdf',min_pages=100,urls=[
              'https://static.cninfo.com.cn/finalpage/2026-04-27/1225192516.PDF',
              'https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-27/861c7a62-eea4-499c-a4c9-0887f13107b0.PDF',
            ]),
            dict(order=7,year=2026,kind='quarter',title='2026年第一季度报告',date='2026-04-27',file='07_斯迪克_2026年第一季度报告.pdf',min_pages=5,urls=[
              'https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-27/bad3c13b-9b24-48e4-8573-5c7bdec60171.PDF',
            ]),
          ]

          def inspect(path, doc):
              r = PdfReader(str(path), strict=False)
              pages = len(r.pages)
              if pages < doc['min_pages']:
                  return False, pages, f'page count {pages}'
              idxs = list(range(min(12,pages)))
              if pages > 12: idxs.append(pages-1)
              text = ''
              for i in dict.fromkeys(idxs):
                  try: text += '\n' + (r.pages[i].extract_text() or '')
                  except Exception: pass
              compact = re.sub(r'\s+','',text)
              if '斯迪克' not in compact:
                  return False, pages, 'company mismatch'
              if doc['kind']=='annual':
                  if f"{doc['year']}年年度报告" not in compact and f"{doc['year']}年度报告" not in compact:
                      return False, pages, 'title mismatch'
              else:
                  if '第一季度报告' not in compact or '2026' not in compact:
                      return False, pages, 'title mismatch'
              return True, pages, ''

          def download(doc):
              dest = out/doc['file']
              last = None
              for url in doc['urls']:
                  try:
                      r = s.get(url, headers={'Referer':'https://www.cninfo.com.cn/'}, timeout=(20,150), allow_redirects=True)
                      data = r.content
                      if r.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80000:
                          raise RuntimeError(f'HTTP={r.status_code} bytes={len(data)} type={r.headers.get("content-type")}')
                      dest.write_bytes(data)
                      ok,pages,reason = inspect(dest,doc)
                      if not ok: raise RuntimeError(reason)
                      sha = hashlib.sha256(data).hexdigest()
                      print('DOWNLOADED',doc['title'],'pages=',pages,'bytes=',len(data),'source=',r.url,'sha256=',sha)
                      return {**doc,'pages':pages,'bytes':len(data),'source':r.url,'sha256':sha}
                  except Exception as exc:
                      last = exc
                      dest.unlink(missing_ok=True)
                      print('FAILED',doc['title'],url,repr(exc))
              raise RuntimeError(f"Could not download {doc['title']}: {last!r}")

          records = [download(d) for d in docs]
          lines = [
            '斯迪克（300806）2020-2025年年度报告及最新季报资料包',
            '整理日期：2026-10-28','',
            '收录范围：',
            '1. 2020-2025年度报告全文，共6份，不含年度报告摘要。',
            '2. 2026年第三季度报告预约于2026年10月29日披露；截至2026年10月28日，最新已披露季度报告为2026年第一季度报告。',
            '3. 优先使用深圳证券交易所或巨潮资讯原始PDF；2022年年报如官方直链不稳定，则使用同一公开披露文件镜像，并完成公司、年份、标题和页数核验。','',
            '文件清单：'
          ]
          sums=[]; total_pages=0; total_bytes=0
          for x in records:
              total_pages += x['pages']; total_bytes += x['bytes']
              lines += [f"{x['order']}. {x['file']}",f"   文档：{x['title']}",f"   披露日期：{x['date']}",f"   页数：{x['pages']}页",f"   原始PDF：{x['source']}",f"   SHA-256：{x['sha256']}",'']
              sums.append(f"{x['sha256']}  {x['file']}")
          lines += [f'合计：7份PDF，{total_pages}页，{total_bytes}字节。','全部文件已通过PDF结构、公司名称、报告期和首末页渲染检查。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e; qpdf --check "$pdf" >"$pdf.qpdf" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '斯迪克|江苏斯迪克新材料科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/sidike_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/sidike_test.zip "$PACKAGE"
          unzip -t /tmp/sidike_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/sidike_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/sidike_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Sidike-300806-2020-2025-annual-reports-latest-quarter
          path: 斯迪克_300806_2020-2025年报及最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
