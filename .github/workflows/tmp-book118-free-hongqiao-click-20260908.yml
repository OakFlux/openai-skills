name: Test public Book118 China Hongqiao free downloads
on:
  push:
    branches:
      - tmp-book118-free-hongqiao-click-20260908
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet playwright pypdf requests
      - name: Click anonymous free-download controls and validate
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,re,shutil
          from pathlib import Path
          from pypdf import PdfReader
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          targets={
            'xibu_free':('https://max.book118.com/html/2025/0423/7061153036010064.shtm','2025-04-24_中国宏桥_高景气一体化'),
          }
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          out={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(user_agent=ua,locale='zh-CN',viewport={'width':1500,'height':1200},accept_downloads=True)
            for key,(url,name) in targets.items():
              pg=ctx.new_page();reqs=[];resps=[];downloads=[]
              def req(r):
                if re.search(r'(download|down|file|pdf|order|login|captcha|verify)',r.url,re.I): reqs.append({'url':r.url,'method':r.method,'type':r.resource_type,'post':r.post_data})
              def resp(r):
                try:ct=r.headers.get('content-type','')
                except:ct=''
                if re.search(r'(download|down|file|pdf|order|login|captcha|verify)',r.url,re.I) or 'pdf' in ct.lower(): resps.append({'url':r.url,'status':r.status,'ct':ct})
              pg.on('request',req);pg.on('response',resp)
              rec={'url':url,'requests':reqs,'responses':resps,'downloads':downloads}
              try:
                r=pg.goto(url,wait_until='domcontentloaded',timeout=120000)
                try:pg.wait_for_load_state('networkidle',timeout=25000)
                except PWTimeout:pass
                pg.wait_for_timeout(1500)
                rec['initial']={'status':r.status if r else None,'title':pg.title(),'body':' '.join(pg.locator('body').inner_text(timeout=15000).split())[:100000]}
                for selector in ['#title_download','#hd_download','#bar_download','.btn-download']:
                  loc=pg.locator(selector)
                  if not loc.count():continue
                  item={'selector':selector,'before':pg.url}
                  try:
                    with pg.expect_download(timeout=10000) as di:
                      loc.first.click(force=True,timeout=8000)
                    d=di.value; dest=Path('output')/f'{name}_{d.suggested_filename}';d.save_as(str(dest))
                    v={'url':d.url,'file':str(dest),'bytes':dest.stat().st_size,'header':dest.read_bytes()[:8].decode('latin1','replace')}
                    if dest.read_bytes().startswith(b'%PDF'):
                      rd=PdfReader(str(dest));n=len(rd.pages);text=' '.join(((rd.pages[i].extract_text() or '') for i in sorted(set([0,min(1,n-1),min(4,n-1),n-1]))))
                      v.update(pages=n,mentions=bool(re.search(r'中国宏桥|01378|1378\.HK',text,re.I)),sample=' '.join(text.split())[:5000],sha256=hashlib.sha256(dest.read_bytes()).hexdigest())
                    downloads.append(v);item['download']=v
                  except Exception as exc:
                    item['download_error']=repr(exc)
                    try:loc.first.click(force=True,timeout=7000)
                    except Exception as exc2:item['click_error']=repr(exc2)
                    pg.wait_for_timeout(2500)
                  item['after']=pg.url
                  try:item['after_body']=' '.join(pg.locator('body').inner_text(timeout=5000).split())[:50000]
                  except:pass
                  rec.setdefault('clicks',[]).append(item)
                  if downloads:break
                rec['final_body']=' '.join(pg.locator('body').inner_text(timeout=5000).split())[:100000]
                rec['final_url']=pg.url
                pg.screenshot(path=f'output/{key}.png',full_page=True)
                Path(f'output/{key}.html').write_text(pg.content(),encoding='utf-8')
              except Exception as exc:rec['error']=repr(exc)
              out[key]=rec;print('RESULT',json.dumps(rec,ensure_ascii=False)[:50000],flush=True);pg.close()
            browser.close()
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: book118-free-hongqiao-click
          path: output/*
          retention-days: 1
          if-no-files-found: error
