name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect public report metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})

          for detail_id in ('2892941', '2983400'):
              page_url = f'https://www.fxbaogao.com/detail/{detail_id}'
              response = session.get(page_url, timeout=(25, 120), allow_redirects=True)
              print('\nPAGE', detail_id, response.status_code, response.url, len(response.content), flush=True)
              soup = BeautifulSoup(response.text, 'html.parser')
              print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
              for tag in soup.find_all(['a', 'button', 'iframe', 'embed', 'object', 'script', 'link', 'img']):
                  label = ' '.join(tag.get_text(' ', strip=True).split())[:150]
                  for attribute in ('href', 'src', 'data', 'data-url'):
                      value = tag.get(attribute)
                      if not value:
                          continue
                      absolute = urljoin(response.url, value)
                      combined = (label + ' ' + absolute).lower()
                      if any(word in combined for word in ('pdf', 'download', '完整报告', '查看完整')):
                          print('TAG', tag.name, attribute, repr(label), absolute, flush=True)
              next_tag = soup.find('script', id='__NEXT_DATA__')
              if next_tag and next_tag.string:
                  next_data = json.loads(next_tag.string)
                  print('NEXT_BUILD', next_data.get('buildId'), flush=True)
                  print('NEXT_PAGE', next_data.get('page'), flush=True)
                  print('NEXT_QUERY', next_data.get('query'), flush=True)
                  props_text = json.dumps(next_data.get('props'), ensure_ascii=False)
                  print('NEXT_PROPS', props_text[:20000], flush=True)
                  build_id = next_data.get('buildId')
                  if build_id:
                      data_url = f'https://www.fxbaogao.com/_next/data/{build_id}/detail/{detail_id}.json'
                      data_response = session.get(data_url, timeout=(25, 120))
                      print('NEXT_JSON', data_response.status_code, len(data_response.content), data_response.text[:5000], flush=True)
              else:
                  print('NO_NEXT_DATA', flush=True)
          PY
