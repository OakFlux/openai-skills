name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Inspect public report page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          TARGETS = [
              'https://www.sgpjbg.com.cn/zhuanti/teruisibaogao.html',
              'https://www.sgpjbg.com/zhuanti/teruisibaogao.html',
          ]
          NEEDLE = '中国宝安：手握贝特瑞核心资产治理优化整装待发'

          async def inspect(page, url):
              print('\nTARGET', url, flush=True)
              relevant_requests = []
              async def on_request(request):
                  lower = request.url.lower()
                  if any(term in lower for term in ('pdf', 'download', 'down', 'file', 'report')):
                      relevant_requests.append(('REQUEST', request.method, request.url, request.post_data))
              async def on_response(response):
                  lower = response.url.lower()
                  if any(term in lower for term in ('pdf', 'download', 'down', 'file', 'report')):
                      relevant_requests.append(('RESPONSE', response.status, response.url, response.headers.get('content-type')))
              page.on('request', on_request)
              page.on('response', on_response)
              try:
                  response = await page.goto(url, wait_until='domcontentloaded', timeout=120000)
                  await page.wait_for_timeout(12000)
                  print('STATUS', response.status if response else None, 'FINAL', page.url, flush=True)
                  print('TITLE', await page.title(), flush=True)
                  body_text = await page.locator('body').inner_text()
                  print('BODY_HAS_NEEDLE', '中国宝安' in body_text, 'BODY_LEN', len(body_text), flush=True)
                  print('BODY_SNIP', body_text[:6000], flush=True)
                  locators = page.get_by_text('中国宝安：手握贝特瑞核心资产治理优化整装待发-20210808（18页）.pdf', exact=False)
                  count = await locators.count()
                  print('MATCH_COUNT', count, flush=True)
                  for index in range(min(count, 10)):
                      element = locators.nth(index)
                      print('MATCH', index, await element.evaluate('(el)=>el.outerHTML'), flush=True)
                      print('ANCESTOR1', await element.evaluate('(el)=>el.parentElement ? el.parentElement.outerHTML : ""'), flush=True)
                      print('ANCESTOR2', await element.evaluate('(el)=>el.parentElement && el.parentElement.parentElement ? el.parentElement.parentElement.outerHTML : ""'), flush=True)
                      print('ANCESTOR3', await element.evaluate('(el)=>el.closest("li,article,div") ? el.closest("li,article,div").outerHTML : ""'), flush=True)
                  anchors = await page.locator('a').evaluate_all('''els => els.map(a => ({text:(a.innerText||a.textContent||'').trim(), href:a.href, outer:a.outerHTML})).filter(x => x.text.includes('中国宝安') || x.text.includes('手握贝特瑞') || x.href.includes('20210808') || x.href.toLowerCase().includes('pdf')).slice(0,100)''')
                  print('ANCHORS', json.dumps(anchors, ensure_ascii=False), flush=True)
                  buttons = await page.locator('a,button').evaluate_all('''els => els.map(e => ({text:(e.innerText||e.textContent||'').trim(), href:e.href||'', outer:e.outerHTML})).filter(x => x.text.includes('立即下载') || x.text.includes('下载')).slice(0,100)''')
                  print('DOWNLOAD_BUTTONS', json.dumps(buttons, ensure_ascii=False), flush=True)
                  print('NETWORK', json.dumps(relevant_requests[-200:], ensure_ascii=False), flush=True)
                  Path('page.html').write_text(await page.content(), encoding='utf-8')
              except Exception as exc:
                  print('ERROR', repr(exc), flush=True)

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                      locale='zh-CN',
                      viewport={'width': 1440, 'height': 1200},
                      accept_downloads=True,
                  )
                  for url in TARGETS:
                      page = await context.new_page()
                      await inspect(page, url)
                      await page.close()
                  await browser.close()

          asyncio.run(main())
          PY
