name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect public report viewer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://www.fxbaogao.com/detail/2892941'
          })

          urls = [
              'https://www.fxbaogao.com/view?id=2892941',
              'https://www.fxbaogao.com/view/2892941',
          ]
          for page_url in urls:
              response = session.get(page_url, timeout=(25, 120), allow_redirects=True)
              print('\nPAGE', response.status_code, response.url, len(response.content), response.headers.get('content-type'), flush=True)
              if response.content.startswith(b'%PDF'):
                  print('DIRECT_PDF', len(response.content), flush=True)
                  continue
              soup = BeautifulSoup(response.text, 'html.parser')
              print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
              for tag in soup.find_all(['a', 'iframe', 'embed', 'object', 'script', 'link', 'img', 'source']):
                  label = ' '.join(tag.get_text(' ', strip=True).split())[:150]
                  for attribute in ('href', 'src', 'data', 'data-url', 'data-src'):
                      value = tag.get(attribute)
                      if not value:
                          continue
                      absolute = urljoin(response.url, value)
                      combined = (label + ' ' + absolute).lower()
                      if any(word in combined for word in ('pdf', 'download', 'report', 'viewer', 'page', 'image', 'oss', 'file')):
                          print('TAG', tag.name, attribute, repr(label), absolute, flush=True)
              for line in response.text.splitlines():
                  lower = line.lower()
                  if any(word in lower for word in ('.pdf', 'pdfurl', 'fileurl', 'downloadurl', 'reporturl', 'oss', 'pageurl', 'viewerurl')):
                      print('LINE', ' '.join(line.split())[:3000], flush=True)
              text = ' | '.join(soup.get_text('\n', strip=True).splitlines())
              print('TEXT', text[:3000], flush=True)
          PY
