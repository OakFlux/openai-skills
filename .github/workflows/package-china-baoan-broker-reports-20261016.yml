name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Probe public report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})

          urls = [
              'https://www.sgpjbg.com.cn/zhuanti/teruisibaogao.html',
              'https://www.sgpjbg.com/zhuanti/teruisibaogao.html',
              'https://www.fxbaogao.com/detail/2892941',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz000009&t1=all',
              'https://webf10.gw.com.cn/SZ/B16/SZ000009_B16.html',
          ]
          for url in urls:
              try:
                  r=s.get(url,timeout=(25,120),allow_redirects=True)
                  print('\nURL',url,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),flush=True)
                  print('HEAD',r.text[:500].replace('\n',' '),flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.find_all('a',href=True):
                      text=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      blob=(text+' '+href).lower()
                      if ('中国宝安' in text or '手握贝特瑞' in text or '新技术驱动正负极' in text or
                          '000009' in href or '.pdf' in href.lower() or 'download' in href.lower() or 'down' in href.lower()):
                          print('LINK',repr(text[:160]),href,flush=True)
                  for m in re.findall(r'https?://[^\"\'<> ]+',r.text):
                      if '.pdf' in m.lower() or 'download' in m.lower():
                          print('RAWURL',m[:500],flush=True)
              except Exception as e:
                  print('ERROR',url,repr(e),flush=True)

          queries=[
              '"手握贝特瑞核心资产，治理优化整装待发" pdf',
              '"新技术驱动正负极腾飞，新治理有望改善经营" pdf',
              '"公司治理有望优化，电池材料业务迎高增长期" pdf',
          ]
          for q in queries:
              url='https://www.bing.com/search?q='+quote(q)
              try:
                  r=s.get(url,timeout=(25,120))
                  print('\nBING',q,r.status_code,len(r.content),flush=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.select('li.b_algo h2 a')[:10]:
                      print('RESULT',a.get_text(' ',strip=True),a.get('href'),flush=True)
              except Exception as e:
                  print('BING_ERROR',q,repr(e),flush=True)
          PY
