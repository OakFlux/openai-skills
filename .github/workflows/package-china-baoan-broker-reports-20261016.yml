name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://stock.finance.sina.com.cn/'
          })

          report_ids = [
              '688799411912', '681479012338', '679088764988',
              '683397165865', '681420051279', '348056495639',
              '337943388733', '337419312671'
          ]

          for report_id in report_ids:
              url = f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{report_id}/index.phtml'
              response = session.get(url, timeout=(25, 120), allow_redirects=True)
              response.encoding = response.apparent_encoding
              print('\nREPORT', report_id, response.status_code, response.url, len(response.content), flush=True)
              soup = BeautifulSoup(response.text, 'html.parser')
              print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
              for tag in soup.find_all(['a', 'iframe', 'embed', 'object', 'script', 'link']):
                  label = ' '.join(tag.get_text(' ', strip=True).split())[:160]
                  for attribute in ('href', 'src', 'data'):
                      value = tag.get(attribute)
                      if not value:
                          continue
                      absolute = urljoin(response.url, value)
                      combined = (label + ' ' + absolute).lower()
                      if any(word in combined for word in ('pdf', '下载', '原文', '附件', 'attach', 'download', 'file', 'report')):
                          print('LINK', tag.name, attribute, repr(label), absolute, flush=True)
              for line in response.text.splitlines():
                  low = line.lower()
                  if any(word in low for word in ('.pdf', 'download', 'attachment', 'attach_url', 'file_url', 'report_url')):
                      print('LINE', ' '.join(line.split())[:2000], flush=True)
              page_text = ' | '.join(soup.get_text('\n', strip=True).splitlines())
              print('TEXT', page_text[:2500], flush=True)
          PY
