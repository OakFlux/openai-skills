name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Probe public report APIs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          import requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/view?id=2892941',
              'Accept': 'application/json, text/plain, */*',
          })

          base = 'https://node.mofoun.com'
          report_id = 2892941
          get_paths = [
              f'/mofoun/report/readReport/readReport?reportId={report_id}',
              f'/mofoun/report/report/getReportPreviewImages?reportId={report_id}',
              f'/mofoun/report/searchReport/detail/catalog?reportId={report_id}',
              f'/mofoun/report/report/downloadReportByBean?reportId={report_id}',
          ]
          for path in get_paths:
              url = base + path
              try:
                  response = session.get(url, timeout=(25, 120), allow_redirects=True)
                  print('\nGET', response.status_code, response.url, response.headers.get('content-type'), len(response.content), flush=True)
                  print('TEXT', response.text[:30000], flush=True)
              except Exception as exc:
                  print('GET_ERROR', url, repr(exc), flush=True)

          post_cases = [
              ({'reportId': report_id}, 'json'),
              ({'id': report_id}, 'json'),
              ({'docId': report_id}, 'json'),
              ({'reportId': report_id}, 'form'),
              ({'id': report_id}, 'form'),
          ]
          detail_url = base + '/mofoun/report/searchReport/detail'
          for payload, mode in post_cases:
              try:
                  if mode == 'json':
                      response = session.post(detail_url, json=payload, timeout=(25, 120))
                  else:
                      response = session.post(detail_url, data=payload, timeout=(25, 120))
                  print('\nPOST_DETAIL', mode, payload, response.status_code, response.headers.get('content-type'), len(response.content), flush=True)
                  print('TEXT', response.text[:30000], flush=True)
              except Exception as exc:
                  print('POST_ERROR', mode, payload, repr(exc), flush=True)

          search_url = base + '/mofoun/report/searchReport/searchNoAuth'
          search_payloads = [
              {'word': '中国宝安', 'currPage': 1, 'pageSize': 50},
              {'keyword': '中国宝安', 'currPage': 1, 'pageSize': 50},
              {'query': '中国宝安', 'page': 1, 'limit': 50},
              {'title': '中国宝安', 'currPage': 1, 'pageSize': 50},
              {'searchWord': '中国宝安', 'pageNum': 1, 'pageSize': 50},
          ]
          for payload in search_payloads:
              try:
                  response = session.post(search_url, json=payload, timeout=(25, 120))
                  print('\nPOST_SEARCH', payload, response.status_code, response.headers.get('content-type'), len(response.content), flush=True)
                  print('TEXT', response.text[:50000], flush=True)
              except Exception as exc:
                  print('SEARCH_ERROR', payload, repr(exc), flush=True)
          PY
