name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect report API request headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests

          url = 'https://www.fxbaogao.com/_fxbg/2610141742/js/app-pages-fxbg-main-js.fd6234d1ab18d90a303e.chunk.js'
          response = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'}, timeout=(25, 120))
          text = response.text
          print('BUNDLE', response.status_code, len(response.content), flush=True)

          patterns = [
              'fetchGet', 'fetchPost', 'NODE_API', 'pageVersion', 'appVersion',
              'versionCode', 'x-version', 'X-Version', 'version:', 'version=',
              'headers:', 'Authorization', 'axios', 'XMLHttpRequest', '251105',
              'dnGetter', 'refreshLocalTime', 'getK', 'localTime', 'timestamp',
          ]
          for pattern in patterns:
              matches = list(re.finditer(re.escape(pattern), text, re.I))
              print('\nPATTERN', pattern, 'COUNT', len(matches), flush=True)
              for match in matches[:20]:
                  start = max(0, match.start() - 1200)
                  end = min(len(text), match.start() + 2400)
                  print('SNIP', text[start:end].replace('\n', ' ')[:3600], flush=True)

          for regex in [
              r'headers\s*[:=]\s*\{[^}]{0,2000}\}',
              r'fetchGet\s*[:=][^;]{0,3000}',
              r'function\s+\w+\([^)]*\)\{[^{}]{0,1200}fetch\(',
              r'[A-Za-z0-9_-]{2,30}Version[A-Za-z0-9_-]{0,20}',
          ]:
              found = re.findall(regex, text, re.I)
              print('\nREGEX', regex, 'COUNT', len(found), flush=True)
              for item in found[:40]:
                  print('FOUND', str(item)[:3000], flush=True)
          PY
