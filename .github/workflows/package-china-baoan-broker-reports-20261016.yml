name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect public report download links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          targets = [
              'https://www.sgpjbg.com.cn/zhuanti/teruisibaogao.html',
              'https://www.sgpjbg.com/zhuanti/teruisibaogao.html',
          ]
          needle = '中国宝安：手握贝特瑞核心资产治理优化整装待发'
          for url in targets:
              try:
                  response = session.get(url, timeout=(25, 180), allow_redirects=True)
                  response.encoding = response.apparent_encoding
                  text = response.text
                  print('\nPAGE', response.status_code, response.url, len(response.content), response.headers.get('content-type'), response.encoding, flush=True)
                  soup = BeautifulSoup(text, 'html.parser')
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '', flush=True)
                  hits = 0
                  for node in soup.find_all(string=lambda value: value and ('中国宝安' in value or '手握贝特瑞' in value)):
                      hits += 1
                      parent = node.parent
                      print('NODE', repr(node.strip()[:500]), flush=True)
                      current = parent
                      for depth in range(6):
                          if current is None:
                              break
                          print('ANCESTOR', depth, current.name, current.attrs, str(current)[:5000].replace('\n',' '), flush=True)
                          current = current.parent
                  print('HITS', hits, flush=True)

                  for anchor in soup.find_all('a', href=True):
                      label = ' '.join(anchor.get_text(' ', strip=True).split())
                      href = urljoin(response.url, anchor['href'])
                      combined = label + ' ' + href
                      if ('中国宝安' in combined or '手握贝特瑞' in combined or
                          '20210808' in combined or 'download' in combined.lower() or
                          '.pdf' in combined.lower()):
                          print('ANCHOR', repr(label[:500]), href, anchor.attrs, flush=True)

                  for line_number, line in enumerate(text.splitlines(), start=1):
                      if ('中国宝安' in line or '手握贝特瑞' in line or '20210808' in line):
                          print('LINE', line_number, line.strip()[:12000], flush=True)

                  for match in re.findall(r'https?://[^\"\'<>\s]+', text):
                      low = match.lower()
                      if 'pdf' in low or 'download' in low or '20210808' in low:
                          print('RAWURL', match[:2000], flush=True)
              except Exception as exc:
                  print('ERROR', url, repr(exc), flush=True)
          PY
