name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Capture anonymous viewer requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          from playwright.async_api import async_playwright

          TARGET = 'https://www.fxbaogao.com/view?id=2892941'

          def redact(headers):
              result = {}
              for key, value in headers.items():
                  lower = key.lower()
                  if lower in {'cookie', 'authorization', 'proxy-authorization'}:
                      result[key] = '<redacted>'
                  else:
                      result[key] = value
              return result

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                      locale='zh-CN',
                      viewport={'width': 1440, 'height': 1000},
                  )
                  page = await context.new_page()

                  async def on_request(request):
                      if 'node.mofoun.com' not in request.url:
                          return
                      try:
                          headers = await request.all_headers()
                      except Exception:
                          headers = request.headers
                      print('REQUEST', json.dumps({
                          'method': request.method,
                          'url': request.url,
                          'headers': redact(headers),
                          'post_data': request.post_data,
                      }, ensure_ascii=False), flush=True)

                  async def on_response(response):
                      if 'node.mofoun.com' not in response.url:
                          return
                      try:
                          headers = await response.all_headers()
                      except Exception:
                          headers = response.headers
                      record = {
                          'status': response.status,
                          'url': response.url,
                          'headers': redact(headers),
                      }
                      try:
                          body = await response.body()
                          record['bytes'] = len(body)
                          if body.startswith(b'%PDF'):
                              record['body_type'] = 'PDF'
                              record['body_head'] = body[:24].hex()
                          else:
                              record['body_type'] = 'text_or_binary'
                              record['body_head'] = body[:30000].decode('utf-8', errors='replace')
                      except Exception as exc:
                          record['body_error'] = repr(exc)
                      print('RESPONSE', json.dumps(record, ensure_ascii=False), flush=True)

                  page.on('request', on_request)
                  page.on('response', on_response)
                  await page.goto(TARGET, wait_until='domcontentloaded', timeout=120000)
                  await page.wait_for_timeout(18000)
                  print('PAGE_TITLE', await page.title(), flush=True)
                  print('PAGE_URL', page.url, flush=True)
                  print('PAGE_TEXT', (await page.locator('body').inner_text())[:10000], flush=True)
                  print('COOKIES', json.dumps([
                      {'name': cookie['name'], 'domain': cookie['domain'], 'path': cookie['path']}
                      for cookie in await context.cookies()
                  ], ensure_ascii=False), flush=True)
                  await browser.close()

          asyncio.run(main())
          PY
