name: Package China Baoan broker research reports

on:
  pull_request:
    paths:
      - 'tasks/china-baoan-broker-reports-20261016.trigger'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect viewer JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({'User-Agent': 'Mozilla/5.0'})
          urls = [
              'https://www.fxbaogao.com/_fxbg/2610141742/js/app-pages-fxbg-main-js.fd6234d1ab18d90a303e.chunk.js',
              'https://www.fxbaogao.com/_fxbg/2610141742/js/vendors~app-pages-fxbg-main-js.f7b12df6cb87e7f5ac48.chunk.js',
          ]
          for url in urls:
              response = session.get(url, timeout=(25, 120))
              text = response.text
              print('\nBUNDLE', response.status_code, url, len(response.content), flush=True)
              for word in ('pdf', 'download', 'viewReport', 'reportId', 'api/', '/view', 'pageCount', 'fileUrl', 'preview'):
                  positions = [match.start() for match in re.finditer(re.escape(word), text, re.I)][:30]
                  print('WORD', word, 'COUNT', len(positions), flush=True)
                  for position in positions[:10]:
                      start = max(0, position - 350)
                      end = min(len(text), position + 700)
                      print('SNIP', text[start:end].replace('\n', ' ')[:1100], flush=True)
          PY
