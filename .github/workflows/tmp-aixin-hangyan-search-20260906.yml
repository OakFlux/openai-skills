name: Temporary Aixin Hangyan catalogue search

on:
  push:
    branches:
      - tmp-aixin-hangyan-search-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch catalogue pages and identify reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          })
          queries=['爱芯元智','00600','0600.HK','踏智驾及边缘AI之浪','AI终端平台公司','高端启新，智驱全球','上市后首次中报营收维持高增长']
          rows=[]
          seen={}
          for q in queries:
            for page in range(1,8):
              url='https://www.hangyan.co/reports?q='+quote(q)
              if page>1: url += '&page='+str(page)
              try:
                r=s.get(url,timeout=90,allow_redirects=True)
                print('FETCH',q,page,r.status_code,len(r.content),r.url,flush=True)
                soup=BeautifulSoup(r.text,'html.parser')
                page_row={'query':q,'page':page,'status':r.status_code,'bytes':len(r.content),'final_url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else None,'links':[]}
                found_this=0
                for a in soup.select('a[href*="/reports/"]'):
                  href=urljoin(r.url,a.get('href'))
                  m=re.search(r'/reports/(\d+)',href)
                  if not m: continue
                  rid=m.group(1)
                  text=' '.join(a.get_text(' ',strip=True).split())
                  parent=' '.join((a.parent.get_text(' ',strip=True) if a.parent else text).split())
                  record={'id':rid,'href':href,'anchor':text,'context':parent[:2000],'query':q,'page':page}
                  page_row['links'].append(record)
                  joined=text+parent
                  if any(k in joined for k in ['爱芯元智','踏智驾及边缘AI之浪','AI终端平台公司','高端启新','上市后首次中报营收维持高增长','中报超预期，边缘AI']):
                    seen[rid]=record; found_this+=1
                    print('MATCH',json.dumps(record,ensure_ascii=False),flush=True)
                rows.append(page_row)
                (out/f'{q}_{page}.html').write_bytes(r.content)
                if page>1 and not page_row['links']:
                  break
              except Exception as e:
                rows.append({'query':q,'page':page,'url':url,'error':repr(e)})
                print('ERR',q,page,repr(e),flush=True)
                break
          # Fetch matched detail pages and extract metadata and potential download controls.
          details=[]
          for rid,rec in seen.items():
            try:
              r=s.get(rec['href'],timeout=90,allow_redirects=True)
              soup=BeautifulSoup(r.text,'html.parser')
              attrs=[]
              for tag in soup.find_all(True):
                relevant={k:v for k,v in tag.attrs.items() if any(x in k.lower() for x in ['pdf','download','filename','page','report','cache'])}
                if relevant:
                  attrs.append({'tag':tag.name,'attrs':relevant,'text':' '.join(tag.get_text(' ',strip=True).split())[:500]})
              detail={'id':rid,'href':rec['href'],'status':r.status_code,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'heading':(soup.find('h1') or soup.find('h2')).get_text(' ',strip=True) if (soup.find('h1') or soup.find('h2')) else None,'attrs':attrs[:1000]}
              details.append(detail)
              (out/f'detail_{rid}.html').write_bytes(r.content)
              print('DETAIL',json.dumps({k:detail.get(k) for k in ['id','title','heading','status','bytes']},ensure_ascii=False),flush=True)
            except Exception as e:
              details.append({'id':rid,'href':rec['href'],'error':repr(e)})
          (out/'catalogue_pages.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matches.json').write_text(json.dumps(list(seen.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT',len(seen),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-hangyan-search-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
