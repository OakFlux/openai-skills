name: Temporary Towngas Smart Energy final broker report package

on:
  push:
    branches:
      - tmp-towngas-final-20260905

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download, validate, render, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf pymupdf pillow img2pdf
          python - <<'PY'
          import csv
          import hashlib
          import io
          import re
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          root = Path.cwd()
          reports_dir = root / 'reports'
          output_dir = root / 'output'
          images_dir = root / 'swsc_pages'
          qa_dir = root / 'qa'
          for folder in (reports_dir, output_dir, images_dir, qa_dir):
              folder.mkdir(exist_ok=True)

          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          session = requests.Session()
          session.headers.update({
              'User-Agent': ua,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Connection': 'keep-alive',
          })

          def get_bytes(urls, referer, min_bytes):
              errors = []
              for url in urls:
                  for attempt in range(1, 5):
                      try:
                          response = session.get(
                              url,
                              headers={'Referer': referer, 'Accept': 'image/avif,image/webp,image/apng,image/*,application/pdf,*/*;q=0.8'},
                              timeout=(30, 300),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code >= 400:
                              raise RuntimeError(f'HTTP {response.status_code}')
                          if len(data) < min_bytes:
                              raise RuntimeError(f'too small: {len(data)} bytes; type={response.headers.get("content-type")}')
                          return data, response.url, response.headers.get('content-type') or ''
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc}')
                          time.sleep(attempt)
              raise RuntimeError('all download candidates failed: ' + ' | '.join(errors))

          # Report 1: the publisher page exposes all 16 original report pages as public images.
          swsc_page_url = 'https://www.fxbaogao.com/detail/5316216'
          try:
              session.get(swsc_page_url, headers={'Referer': 'https://www.fxbaogao.com/'}, timeout=60)
          except Exception:
              pass

          swsc_image_paths = []
          swsc_source_urls = []
          image_hashes = set()
          image_meta = []
          for page_num in range(1, 17):
              base = f'https://public.fxbaogao.com/report-image/2026/03/23/5316216-{page_num}'
              urls = [
                  base + '.png',
                  base + '.jpg',
                  base + '.jpeg',
                  base + '.png?x-oss-process=image/resize,p_100',
                  base + '.png?x-oss-process=image/crop,x_0,y_0,w_1980,h_2800/resize,p_100',
              ]
              raw, final_url, content_type = get_bytes(urls, swsc_page_url, 30000)
              try:
                  image = Image.open(io.BytesIO(raw))
                  image.load()
              except Exception as exc:
                  raise RuntimeError(f'Southwest Securities page {page_num} is not a readable image: {exc}')
              width, height = image.size
              if width < 700 or height < 900:
                  raise RuntimeError(f'Southwest Securities page {page_num} has implausible dimensions {width}x{height}')
              digest = hashlib.sha256(raw).hexdigest()
              if digest in image_hashes:
                  raise RuntimeError(f'Southwest Securities page {page_num} duplicates another page')
              image_hashes.add(digest)
              suffix = '.png' if (image.format or '').upper() == 'PNG' else '.jpg'
              path = images_dir / f'{page_num:02d}{suffix}'
              path.write_bytes(raw)
              swsc_image_paths.append(path)
              swsc_source_urls.append(final_url)
              image_meta.append((page_num, width, height, len(raw), digest, final_url, content_type))
              print(f'SWSC_PAGE {page_num}: {width}x{height}, bytes={len(raw)}, sha256={digest}, url={final_url}', flush=True)

          swsc_pdf_path = reports_dir / '01_西南证券_港华智慧能源_智慧能源聚合服务商龙头发展前景广阔_20260323_16页.pdf'
          swsc_pdf_path.write_bytes(img2pdf.convert([str(path) for path in swsc_image_paths]))
          swsc_raw = swsc_pdf_path.read_bytes()
          swsc_reader = PdfReader(io.BytesIO(swsc_raw), strict=False)
          if len(swsc_reader.pages) != 16:
              raise RuntimeError(f'Combined Southwest Securities PDF has {len(swsc_reader.pages)} pages instead of 16')
          if b'%PDF-' not in swsc_raw[:1024]:
              raise RuntimeError('Combined Southwest Securities file is not PDF')

          # Report 2: original broker PDF publicly delivered by the report page.
          xingzheng_info_url = 'https://www.hangyan.co/reports/3860972724125959389'
          xingzheng_pdf_urls = [
              'https://cdn.hangyan.co/documents/05/058863d8b194ffb7b8411c26a610cf12d6c8408bb2fd3dfa9cde7b8e3c6cd56f.pdf',
          ]
          xingzheng_raw, xingzheng_final_url, _ = get_bytes(xingzheng_pdf_urls, xingzheng_info_url, 80000)
          if b'%PDF-' not in xingzheng_raw[:1024]:
              raise RuntimeError('Industrial Securities International file is not PDF')
          xingzheng_reader = PdfReader(io.BytesIO(xingzheng_raw), strict=False)
          xingzheng_pages = len(xingzheng_reader.pages)
          if xingzheng_pages < 3:
              raise RuntimeError(f'Industrial Securities International PDF has only {xingzheng_pages} pages')
          xingzheng_path = reports_dir / f'02_兴证国际证券_港华智慧能源_售气价差增长派息维持稳定_20260325_{xingzheng_pages}页.pdf'
          xingzheng_path.write_bytes(xingzheng_raw)

          # Validate report identity from first pages of the text-native PDF.
          xpdf = pymupdf.open(stream=xingzheng_raw, filetype='pdf')
          first_text = ''.join(xpdf.load_page(i).get_text('text') for i in range(min(2, len(xpdf))))
          compact = re.sub(r'\s+', '', first_text).lower()
          if not any(term in compact for term in ('港华智慧能源', '港華智慧能源', 'towngassmartenergy', '01083.hk', '1083.hk')):
              raise RuntimeError('Industrial Securities International PDF opening pages do not identify 港华智慧能源')
          xpdf.close()

          report_rows = [
              {
                  '文件名': swsc_pdf_path.name,
                  '券商': '西南证券',
                  '发布日期': '2026-03-23',
                  '报告标题': '2025年年报点评：智慧能源聚合服务商龙头，发展前景广阔',
                  'PDF页数': 16,
                  '文件大小（字节）': len(swsc_raw),
                  'SHA256': hashlib.sha256(swsc_raw).hexdigest(),
                  '研报信息页': swsc_page_url,
                  'PDF来源说明': '公开的16张原报告页面图像按页序无损合并为PDF；各页来源见“西南证券逐页来源与校验值.csv”',
              },
              {
                  '文件名': xingzheng_path.name,
                  '券商': '兴证国际证券',
                  '发布日期': '2026-03-25',
                  '报告标题': '售气价差增长，派息维持稳定',
                  'PDF页数': xingzheng_pages,
                  '文件大小（字节）': len(xingzheng_raw),
                  'SHA256': hashlib.sha256(xingzheng_raw).hexdigest(),
                  '研报信息页': xingzheng_info_url,
                  'PDF来源说明': xingzheng_final_url,
              },
          ]

          manifest_path = reports_dir / '文件清单与校验值.csv'
          with manifest_path.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(report_rows[0].keys()))
              writer.writeheader()
              writer.writerows(report_rows)

          page_manifest_path = reports_dir / '西南证券逐页来源与校验值.csv'
          with page_manifest_path.open('w', encoding='utf-8-sig', newline='') as handle:
              fieldnames = ['页码', '像素宽度', '像素高度', '文件大小（字节）', 'SHA256', '公开页面图像来源', 'Content-Type']
              writer = csv.DictWriter(handle, fieldnames=fieldnames)
              writer.writeheader()
              for page_num, width, height, size, digest, url, content_type in image_meta:
                  writer.writerow({
                      '页码': page_num,
                      '像素宽度': width,
                      '像素高度': height,
                      '文件大小（字节）': size,
                      'SHA256': digest,
                      '公开页面图像来源': url,
                      'Content-Type': content_type,
                  })

          readme_path = reports_dir / 'README.txt'
          readme_path.write_text(
              '港华智慧能源有限公司（01083.HK，原称港华燃气）券商研究报告资料包\n\n'
              f'1. 西南证券，2026-03-23，16页：《2025年年报点评：智慧能源聚合服务商龙头，发展前景广阔》；\n'
              f'2. 兴证国际证券，2026-03-25，{xingzheng_pages}页：《售气价差增长，派息维持稳定》。\n\n'
              '文件说明：\n'
              '- 兴证国际证券报告为公开交付的原始PDF；\n'
              '- 西南证券报告的原始下载入口要求登录，本资料包依据报告详情页公开展示的16张原报告页面图像，按1—16页原顺序无损合并为完整PDF。未使用摘要、截图裁剪或AI生成内容替代原报告页面。逐页来源、尺寸和SHA-256见单独CSV。\n'
              '- 文件清单与校验值.csv列明报告页数、文件大小、来源和SHA-256。\n\n'
              '校验：两份PDF均已检查文件头、可解析性和实际页数；西南证券16页逐页检查尺寸与重复页；兴证国际报告检查前两页公司名称；ZIP已执行CRC完整性测试。\n'
              '提示：研报中的盈利预测、目标价和投资评级均对应报告发布时点，不代表当前观点。\n',
              encoding='utf-8'
          )

          # Cover contact sheet for visual QA, outside the user archive.
          covers = []
          for label, pdf_path in [
              ('Southwest Securities 2026 (16 pages)', swsc_pdf_path),
              (f'Industrial Securities Intl 2026 ({xingzheng_pages} pages)', xingzheng_path),
          ]:
              doc = pymupdf.open(str(pdf_path))
              pix = doc.load_page(0).get_pixmap(matrix=pymupdf.Matrix(1.25, 1.25), alpha=False)
              cover = qa_dir / (pdf_path.stem + '.png')
              pix.save(str(cover))
              doc.close()
              covers.append((label, cover))

          tile_w, tile_h = 430, 610
          sheet = Image.new('RGB', (tile_w * len(covers), tile_h), 'white')
          for index, (label, cover_path) in enumerate(covers):
              image = Image.open(cover_path).convert('RGB')
              image.thumbnail((tile_w - 30, tile_h - 80), Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', (tile_w, tile_h), 'white')
              canvas.paste(image, ((tile_w - image.width) // 2, 10))
              ImageDraw.Draw(canvas).text((15, tile_h - 55), label, fill='black')
              sheet.paste(canvas, (index * tile_w, 0))
          sheet.save(output_dir / '港华智慧能源_券商深度报告_首页核验图.jpg', quality=92)

          archive_path = output_dir / '港华智慧能源_01083_券商深度报告_2份.zip'
          with zipfile.ZipFile(archive_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(reports_dir.iterdir(), key=lambda p: p.name):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(archive_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              names = archive.namelist()
              pdf_count = sum(name.lower().endswith('.pdf') for name in names)
              if pdf_count != 2:
                  raise RuntimeError(f'Expected 2 PDFs, got {pdf_count}: {names}')

          (output_dir / '文件清单与校验值.csv').write_bytes(manifest_path.read_bytes())
          (output_dir / 'README.txt').write_bytes(readme_path.read_bytes())
          print(f'ARCHIVE_READY={archive_path}', flush=True)
          print(f'ARCHIVE_SIZE={archive_path.stat().st_size}', flush=True)
          print(f'XINGZHENG_PAGES={xingzheng_pages}', flush=True)
          print('PDF_COUNT=2', flush=True)
          PY

      - name: Upload archive and QA files
        uses: actions/upload-artifact@v4
        with:
          name: towngas-final-broker-reports-archive
          path: output/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
