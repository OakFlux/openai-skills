name: Package Shanghai Jiubai 600838 related broker reports

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-600838-broker-package-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pymupdf pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests, pymupdf
          from pypdf import PdfReader

          PACKAGE='上海九百_600838_券商相关研究报告_2份'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'info_code':'AP202205051563617966',
              'broker':'上海证券','date':'2022-05-05','analysts':'彭毅、张洪乐','rating':'增持（行业）','expected_pages':20,
              'title':'商贸零售行业周报：上海稳步推进复工复产，关注上海本地商业股的修复机会',
              'classification':'商贸零售行业周报；正文明确推荐上海九百等上海本地商业股',
            },
            {
              'info_code':'AP202205311569008525',
              'broker':'上海证券','date':'2022-05-31','analysts':'彭毅、张洪乐','rating':'增持（行业）','expected_pages':12,
              'title':'商贸零售行业周报：上海线下商业即将全面恢复营业，关注本地商业股的修复机会',
              'classification':'商贸零售行业周报；正文明确推荐上海九百等上海本地商业股',
            },
          ]

          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
          s.headers.update({'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/'})

          def safe_name(x:str)->str:
            return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',x))[:100]

          manifest=[]
          for idx,rep in enumerate(reports,1):
            detail=f"https://data.eastmoney.com/report/info/{rep['info_code']}.html"
            data=None; pdf_url=''; attempts=[]
            for prefix in ['H3','H2','H1','H4']:
              url=f"https://pdf.dfcfw.com/pdf/{prefix}_{rep['info_code']}_1.pdf"
              for attempt in range(6):
                try:
                  r=s.get(url,headers={'User-Agent':ua,'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'},timeout=(25,360),allow_redirects=True)
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                    data=r.content; pdf_url=url; break
                except Exception as exc:
                  attempts.append({'url':url,'error':repr(exc)})
                time.sleep(1+attempt)
              if data: break
            if not data:
              raise RuntimeError(f"Download failed {rep['info_code']}: {attempts[-12:]}")

            filename=f"{idx:02d}_{rep['broker']}_{safe_name(rep['title'])}_{rep['date']}.pdf"
            dest=PDFDIR/filename; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); actual_pages=len(reader.pages)
            if actual_pages!=rep['expected_pages']:
              raise RuntimeError(f"Page mismatch {filename}: {actual_pages} != {rep['expected_pages']}")
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)

            doc=pymupdf.open(str(dest)); hits=[]; snippets=[]; occurrences=0
            aliases=['上海九百','600838']
            for pno in range(doc.page_count):
              text=doc.load_page(pno).get_text('text') or ''
              compact=re.sub(r'\s+','',text); ph={}
              for alias in aliases:
                n=compact.count(alias)
                if n:
                  ph[alias]=n; occurrences+=n
                  pos=text.find(alias)
                  if pos>=0 and len(snippets)<12:
                    snippets.append({'page':pno+1,'alias':alias,'text':' '.join(text[max(0,pos-180):pos+len(alias)+420].split())})
              if ph:hits.append({'page':pno+1,'hits':ph})
            doc.close()
            if occurrences<1:
              raise RuntimeError(f"No Shanghai Jiubai mention found in {filename}")

            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','150','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError(f"Preview failed {filename}")

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **rep,'filename':str(Path('原始PDF')/filename),'actual_pages':actual_pages,'bytes':len(data),'sha256':sha,
              'company_mention_occurrences':occurrences,'company_mention_pages':hits,'mention_snippets':snippets,
              'source_report_page':detail,'pdf_url':pdf_url,'preview_file':str(Path('首页预览')/preview.name),
              'download_attempts':attempts,
              'validation':['PDF header','exact page count','qpdf structure','full-text Shanghai Jiubai scan','first-page render'],
            })

          lines=[
            '上海九百（600838.SH）券商相关研究报告资料包',
            '整理日期：2026-10-21','',
            '公开券商数据库未检出以上海九百为唯一研究对象的公司深度或首次覆盖报告。',
            '本包收录2份上海证券商贸零售行业研究报告；两份均在正文中明确推荐上海九百，但不应表述为上海九百独立公司深度报告。',''
          ]
          for i,x in enumerate(manifest,1):
            pages=', '.join(str(v['page']) for v in x['company_mention_pages'])
            lines += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}；完整页数：{x['actual_pages']}页",
              f"   类型：{x['classification']}",
              f"   全文检出上海九百/600838：{x['company_mention_occurrences']}次；命中页：{pages}",
              f"   文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",'',
            ]
          lines += ['报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','已核验PDF文件头、实际页数、文档结构、全文公司名称命中、首页渲染及ZIP CRC。']
          (ROOT/'00_文件清单与口径说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path('shanghai_jiubai_600838_broker_reports.zip')
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2: raise RuntimeError(f'ZIP validation failed bad={bad} pdfs={len(pdfs)}')
          chinese=Path(PACKAGE+'.zip'); chinese.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-jiubai-600838-broker-reports-final
          path: |
            shanghai_jiubai_600838_broker_reports.zip
            上海九百_600838_券商相关研究报告_2份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
