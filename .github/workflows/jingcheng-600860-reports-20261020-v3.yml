name: Build Jingcheng 600860 reports package 20261020 v3

on:
  push:
    paths:
      - '.github/workflows/jingcheng-600860-reports-20261020-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Run corrected validated package builder
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/OakFlux/openai-skills/6695e9167469e681d80cfc25b59bbb8b2c5d2844/.github/workflows/jingcheng-600860-reports-20261020-v2.yml' -o source.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('source.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(lines[start + 1:end]))
          old = "'min_pages':80}"
          new = "'min_pages':80, 'doc_type':'年度报告'}"
          count = code.count(old)
          if count != 6:
              raise RuntimeError(f'Expected six annual spec replacements, found {count}')
          code = code.replace(old, new)
          Path('builder.py').write_text(code, encoding='utf-8')
          PY
          python builder.py

      - name: Upload final package directory
        uses: actions/upload-artifact@v4
        with:
          name: jingcheng-600860-annual-reports-final-v3
          path: 京城股份_600860_2020-2025年报及最新季报
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
