name: Temporary Huaheng prospectus form-feed count

on:
  push:
    branches:
      - tmp/huaheng-biotech-filings-20260830
    paths:
      - .github/workflows/tmp-huaheng-formfeed-count.yml

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          u='https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7052638&stockid=688639'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36'},timeout=90)
          r.encoding=r.apparent_encoding or 'gb18030'
          soup=BeautifulSoup(r.text,'lxml')
          pre=soup.select_one('#content')
          raw=pre.get_text('',strip=False)
          print('RAW_LEN',len(raw),'FORMFEEDS',raw.count('\x0c'),'SPLIT_PAGES',len(raw.split('\x0c')))
          pages=raw.split('\x0c')
          for i in [0,1,len(pages)//2,len(pages)-2,len(pages)-1]:
            if 0 <= i < len(pages):
              text=pages[i]
              nums=re.findall(r'1-1-\d+',text)
              print('PAGE',i+1,'LEN',len(text),'LINES',text.count('\n')+1,'NUMS',nums[-5:],'START',repr(text[:150]),'END',repr(text[-150:]))
          print('MAX_NUM',max([int(x.split('-')[-1]) for x in re.findall(r'1-1-\d+',raw)] or [0]))
          PY
