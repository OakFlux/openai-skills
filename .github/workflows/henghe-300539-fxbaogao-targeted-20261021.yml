name: Inspect FXBaogao public endpoints for Henghe reports

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-fxbaogao-targeted-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect public report pages and API metadata
        run: |
          python - <<'PY'
          import html, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote, urljoin

          DOC='3760192'
          BASE='https://www.fxbaogao.com'
          API='https://api.fxbaogao.com'
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Referer':BASE+'/',
            'Accept':'text/html,application/xhtml+xml,application/json,text/plain,*/*',
          })

          urls=[
            f'{BASE}/detail/{DOC}',
            f'{BASE}/view?id={DOC}',
            f'{BASE}/pdf?id={DOC}',
            f'{BASE}/pdf?id={DOC}&type=dt',
            f'{BASE}/report?keyword='+quote('横河精密'),
            f'{BASE}/report?keyword='+quote('横河模具'),
            f'{BASE}/report?keyword='+quote('300539'),
            f'{BASE}/report?keyword='+quote('优质精密制造企业 新能源汽车结构件打开成长空间'),
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\n===PAGE===',url,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'))
              print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False))
              if r.status_code!=200: continue
              ctype=str(r.headers.get('content-type','')).lower()
              if r.content.startswith(b'%PDF'):
                print('PDF_PUBLIC',url,'SIZE',len(r.content),'HEAD',r.content[:20]); continue
              r.encoding=r.apparent_encoding or r.encoding
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              plain=' '.join(soup.get_text(' ',strip=True).split())
              for key in ['横河精密','横河模具','优质精密制造企业','扩产进入汽车产业','国内优质的塑料制品','点击免费查看完整报告','立即下载']:
                pos=plain.find(key)
                if pos>=0: print('PLAIN_MATCH',key,plain[max(0,pos-700):pos+2500])
              next_data=soup.find('script',id='__NEXT_DATA__')
              if next_data:
                print('NEXT_DATA',next_data.get_text()[:50000])
              for script in soup.find_all('script'):
                txt=script.get_text() or ''
                if any(k in txt for k in ['3760192','横河精密','originPdfName','report-image','report.fxbaogao.com','downloadUrl','pdfUrl']):
                  print('INLINE_SCRIPT',txt[:80000])
              for tag in soup.find_all(['a','script','iframe','embed','object','form','link','meta']):
                attrs={k:tag.get(k) for k in ('href','src','data','action','content','name','id','type','download') if tag.get(k)}
                label=' '.join(tag.get_text(' ',strip=True).split())[:500]
                raw=label+' '+json.dumps(attrs,ensure_ascii=False)
                if any(k in raw.lower() for k in ['3760192','横河','300539','pdf','download','report','api','file','view','originpdf']):
                  for k in ('href','src','data','action'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('TAG',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False)[:5000])
              pats=[
                r'https?://[^\"\'<>\s]+',
                r'[\"\'](/[^\"\']*(?:3760192|api|report|pdf|download|view|file)[^\"\']*)[\"\']',
                r'(?:pdfUrl|downloadUrl|fileUrl|originPdfName|url|path|uuid|reportId|docId)\s*[:=]\s*[\"\']([^\"\']+)[\"\']',
              ]
              for pat in pats:
                vals=[]
                for m in re.finditer(pat,text,re.I):
                  v=html.unescape(m.group(1) if m.lastindex else m.group(0))
                  if any(k in v.lower() for k in ['3760192','横河','300539','pdf','download','report','file','view','api']): vals.append(v)
                for v in list(dict.fromkeys(vals))[:500]: print('RAW',v[:5000])
            except Exception as e:
              print('PAGE_ERROR',url,repr(e))

          def api_call(method,path,params=None,json_body=None,data=None):
            try:
              h={'Origin':BASE,'Referer':f'{BASE}/detail/{DOC}','Accept':'application/json,text/plain,*/*'}
              r=s.request(method,API+path,params=params,json=json_body,data=data,headers=h,timeout=60,allow_redirects=True)
              print('\n===API===',method,path,'STATUS',r.status_code,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),'URL',r.url)
              print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False))
              print('BODY',r.text[:100000])
              return r
            except Exception as e:
              print('API_ERROR',method,path,repr(e))

          # Public metadata/detail/read/search endpoint candidates seen in current JS bundles.
          calls=[
            ('GET','/mofoun/report/report/report/getXcxReportInfo',{'uuid':DOC},None,None),
            ('GET','/mofoun/report/report/report/isDownload',{'reportId':DOC},None,None),
            ('POST','/mofoun/report/report/report/isDownload',None,{'reportId':int(DOC)},None),
            ('GET','/mofoun/report/reportStock/search',{'keyword':'横河精密','pageNum':1,'pageSize':100},None,None),
            ('POST','/mofoun/report/reportStock/search',None,{'keyword':'横河精密','pageNum':1,'pageSize':100},None),
            ('GET','/mofoun/report/searchReportData/facet',{'type':'report','keyword':'横河精密','pageNum':1,'pageSize':100},None,None),
            ('GET','/mofoun/report/searchReport/facet',{'type':'report','keyword':'横河精密','pageNum':1,'pageSize':100},None,None),
            ('GET','/mofoun/report/searchReport/suggestTyping',{'keyword':'横河精密'},None,None),
            ('GET','/mofoun/report/searchReport/suggestKeywords',{'keyword':'横河精密'},None,None),
            ('GET','/mofoun/report/article/recommend',{'id':DOC},None,None),
            ('GET','/mofoun/report/report/report/history',{'id':DOC},None,None),
          ]
          for method,path,params,jbody,data in calls:
            api_call(method,path,params,jbody,data)
          PY
