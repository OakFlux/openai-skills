name: Inspect Yiyi CNInfo global IPO 20261004

on:
  push:
    paths:
      - '.github/workflows/inspect-yiyi-cninfo-global-ipo-20261004.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query global announcement index
        run: |
          python - <<'PY'
          import requests,re
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.cninfo.com.cn','Referer':'https://www.cninfo.com.cn/','X-Requested-With':'XMLHttpRequest'})
          url='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          for key in ['依依股份 招股说明书','依依股份','天津市依依卫生用品股份有限公司','001206 招股说明书','首次公开发行股票招股说明书']:
            for column,plate in [('szse','sz'),('szse',''),('sse','')]:
              data={'pageNum':'1','pageSize':'100','column':column,'tabName':'fulltext','plate':plate,'stock':'','searchkey':key,'secid':'','category':'','trade':'','seDate':'2021-04-28~2021-05-02','sortName':'','sortType':'','isHLtitle':'true'}
              r=s.post(url,data=data,timeout=120)
              print('\nQUERY',key,column,plate,r.status_code,len(r.content))
              try: items=r.json().get('announcements') or []
              except Exception: continue
              for x in items:
                t=re.sub(r'<[^>]+>','',str(x.get('announcementTitle') or ''))
                if any(k in (t+str(x.get('secName') or '')) for k in ['依依','招股说明书','001206']):
                  print('ITEM',t,x.get('announcementTime'),x.get('adjunctUrl'),x.get('secCode'),x.get('secName'))
          PY
