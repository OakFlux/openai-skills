name: Inspect China Baoan report page on fxbaogao
on:
  push:
    paths:
      - '.github/workflows/china-baoan-fxbaogao-inspect-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet curl_cffi beautifulsoup4 lxml
      - shell: bash
        run: |
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          from curl_cffi import requests
          from bs4 import BeautifulSoup
          urls=['https://www.fxbaogao.com/detail/2892941','https://fxbaogao.com/detail/2892941']
          s=requests.Session(impersonate='chrome')
          for u in urls:
            print('\nFETCH',u,flush=True)
            try:
              r=s.get(u,timeout=60,allow_redirects=True,headers={'Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.baidu.com/'})
              print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
              text=r.text
              print('START',text[:2000],flush=True)
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None,flush=True)
              for tag in soup.find_all(True):
                attrs=json.dumps(tag.attrs,ensure_ascii=False)
                blob=tag.get_text(' ',strip=True)+' '+attrs
                if any(k in blob.lower() for k in ['pdf','download','下载','完整报告','2892941']):
                  if tag.name in ['a','iframe','embed','object','script','button','div','img']:
                    print('TAG',tag.name,attrs,'TEXT',tag.get_text(' ',strip=True)[:1000],flush=True)
              print('URL_STRINGS',flush=True)
              pats=[r'https?[^\s"\'<>]+',r'[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',r'[^\s"\'<>]+download[^\s"\'<>]*']
              seen=set()
              for pat in pats:
                for x in re.findall(pat,text,re.I):
                  if isinstance(x,tuple): x=''.join(x)
                  if x not in seen:
                    seen.add(x); print(x,flush=True)
              for script in soup.find_all('script'):
                st=script.get_text('\n')
                if any(k in st.lower() for k in ['pdf','download','2892941','完整报告']): print('SCRIPT',st[:50000],flush=True)
            except Exception as e:
              print('ERROR',type(e).__name__,str(e),flush=True)
          PY
