name: Discover Youningwei 301166 reports 20261004

on:
  push:
    paths:
      - '.github/workflows/youningwei-301166-report-discovery-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect public announcement pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          urls=[
            ('ANNUAL','https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/301166/page_type/ndbg.phtml'),
            ('Q1','https://money.finance.sina.com.cn/corp/view/vCB_BulletinYi.php?page_type=yjdbg&stockid=301166&type=list'),
            ('H1','https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinZhong/stockid/301166/page_type/zqbg.phtml'),
          ]
          for tag,url in urls:
            r=s.get(url,timeout=60); print('\nPAGE',tag,r.status_code,len(r.content),r.url,flush=True); r.raise_for_status()
            text=r.content.decode('gb18030',errors='replace')
            soup=BeautifulSoup(text,'lxml')
            for a in soup.find_all('a',href=True):
              label=re.sub(r'\s+','',a.get_text(' ',strip=True))
              if any(k in label for k in ['年度报告','一季度报告','第一季度报告','半年度报告','中期报告','招股说明书']):
                print('LINK',tag,label,urljoin(r.url,a['href']),flush=True)

          for page in range(1,31):
            url=f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/301166.phtml?Page={page}'
            r=s.get(url,timeout=60); print('\nALLPAGE',page,r.status_code,len(r.content),r.url,flush=True); r.raise_for_status()
            text=r.content.decode('gb18030',errors='replace')
            soup=BeautifulSoup(text,'lxml')
            found=0
            for a in soup.find_all('a',href=True):
              label=re.sub(r'\s+','',a.get_text(' ',strip=True))
              if any(k in label for k in ['招股说明书','年度报告','第一季度报告','一季度报告','半年度报告','中期报告']):
                print('ALLLINK',page,label,urljoin(r.url,a['href']),flush=True); found+=1
            if page>10 and not found and len(r.content)<30000:
              break
          PY
