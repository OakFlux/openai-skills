name: Diagnose Standard Chartered report downloads 20260926

on:
  push:
    paths:
      - '.github/workflows/standard-chartered-download-diagnostic-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests pypdf
      - name: Probe all official PDFs
        shell: bash
        run: |
          mkdir -p out
          python -u - <<'PY'
          import json, traceback
          from pathlib import Path
          import requests, urllib3
          from pypdf import PdfReader
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          urls=[
            ('2020','https://www.sc.com/en/uploads/sites/66/content/docs/SCB_AR2020.pdf'),
            ('2021','https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2021-report.pdf'),
            ('2022','https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2022-report.pdf'),
            ('2023','https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2023-report.pdf'),
            ('2024','https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-full-year-2024-report.pdf'),
            ('2025','https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-2025-annual-report.pdf'),
            ('HY2026','https://www.sc.com/en/uploads/sites/66/content/docs/standard-chartered-plc-hy-2026-report.pdf'),
          ]
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://www.sc.com/en/investors/financial-results/'})
          result=[]
          for label,url in urls:
            rec={'label':label,'url':url}
            try:
              r=s.get(url,timeout=(30,300),allow_redirects=True,verify=False)
              rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'prefix':r.content[:20].hex()})
              p=Path('out')/f'{label}.bin';p.write_bytes(r.content)
              if r.content[:5]==b'%PDF-':
                try:
                  reader=PdfReader(str(p),strict=False)
                  rec['pages']=len(reader.pages)
                  rec['metadata']={str(k):str(v) for k,v in (reader.metadata or {}).items()}
                  text=''
                  for i in range(min(3,len(reader.pages))):
                    try:text += '\n'+(reader.pages[i].extract_text() or '')
                    except Exception as e:text += '\nTEXTERR '+repr(e)
                  rec['sample_text']=text[:5000]
                except Exception as e:
                  rec['pdf_error']=repr(e);rec['pdf_traceback']=traceback.format_exc()
            except Exception as e:
              rec['request_error']=repr(e);rec['traceback']=traceback.format_exc()
            print(json.dumps(rec,ensure_ascii=False),flush=True)
            result.append(rec)
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: standard-chartered-download-diagnostic
          path: out
          retention-days: 7
          if-no-files-found: error
