name: Build Xinbang Intelligent related broker research 20261014

on:
  push:
    paths:
      - '.github/workflows/xinbang-intelligent-301112-related-research-package-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          from typing import Any
          import requests
          from pypdf import PdfReader

          TODAY='2026-10-14'; CODE='301112'; COMPANY='信邦智能'; FULL_COMPANY='广州信邦智能装备股份有限公司'
          PACKAGE='信邦智能_301112_券商研究资料_1份公司独立财务顾问报告_2份智能制造同业深度'
          WORK=Path('xinbang_related_research_work'); DOWNLOADS=WORK/'downloads'; FINAL=WORK/'final'/PACKAGE
          ART=Path('artifact_out'); VERIFY=Path('verification_renders')
          for d in (DOWNLOADS,FINAL,ART,VERIFY): d.mkdir(parents=True,exist_ok=True)

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def safe(text): return re.sub(r'[\\/:*?"<>|]+','_',text).strip(' ._')[:105]
          def qcheck(path):
              r=subprocess.run(['qpdf','--check',str(path)],capture_output=True,text=True)
              if r.returncode not in (0,3): raise RuntimeError(r.stderr[-800:])
          def read_pdf(path,max_pages=40):
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages); parts=[]
              for i in range(min(max_pages,pages)):
                  try: parts.append(reader.pages[i].extract_text() or '')
                  except Exception: pass
              return pages,'\n'.join(parts)
          def download(urls,target):
              last=''
              for attempt in range(1,5):
                  for url in urls:
                      try:
                          r=s.get(url,timeout=(30,420),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'})
                          print('PDF',target.name,attempt,r.status_code,len(r.content),url,flush=True)
                          if r.status_code==200 and len(r.content)>100000 and r.content.startswith(b'%PDF-'):
                              target.write_bytes(r.content); return str(r.url)
                          last=f'{r.status_code}/{len(r.content)}'
                      except Exception as e: last=repr(e)
                  time.sleep(attempt)
              raise RuntimeError(f'No complete PDF for {target.name}: {last}')

          # Company-specific independent financial adviser report.
          ann_api='https://np-anotice-stock.eastmoney.com/api/security/ann'; anns=[]; seen=set()
          for page in range(1,15):
              r=s.get(ann_api,params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':CODE},timeout=(25,180))
              print('ANN_API',page,r.status_code,len(r.content),flush=True); r.raise_for_status(); data=r.json().get('data') or {}; batch=data.get('list') or []
              if not batch: break
              for item in batch:
                  art=str(item.get('art_code') or '')
                  if art and art not in seen: seen.add(art); anns.append(item)
              hits=int(data.get('total_hits') or len(batch))
              if page>=max(1,(hits+99)//100): break
          def atitle(x): return re.sub(r'\s+',' ',str(x.get('title') or '')).strip()
          def adate(x): return str(x.get('notice_date') or x.get('display_time') or '')[:10]
          direct=[x for x in anns if '独立财务顾问报告' in atitle(x) and not any(t in atitle(x) for t in ['摘要','核查意见','问询','回复','差异','主办人'])]
          if not direct: raise RuntimeError('No company independent financial adviser report found')
          direct.sort(key=adate,reverse=True); item=direct[0]; art=str(item.get('art_code') or '')
          dr=s.get('https://np-cnotice-stock.eastmoney.com/api/content/ann',params={'art_code':art,'client_source':'web','page_index':'1'},timeout=(25,180)); dr.raise_for_status(); dd=dr.json().get('data') or {}
          url=str(dd.get('attach_url_web') or dd.get('attach_url') or '') or f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf'
          path=DOWNLOADS/f'{art}.pdf'; source=download([url,f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf'],path)
          pages,text=read_pdf(path,50)
          if pages<100 or not (COMPANY in text or FULL_COMPANY in text or CODE in text) or '独立财务顾问' not in text: raise RuntimeError('Direct report validation failed')
          qcheck(path); broker='华泰联合证券' if '华泰联合' in (atitle(item)+text[:10000]) else '券商独立财务顾问'
          direct_record={'stock_code':CODE,'stock_name':COMPANY,'broker':broker,'publish_date':adate(item),'title':atitle(item),'document_type':'公司专属独立财务顾问报告（并购重组文件，非二级市场评级研报）','pages':pages,'bytes':path.stat().st_size,'sha256':sha(path),'source_url':source,'pdf_path':str(path),'peer_report':False}
          print('DIRECT_VALIDATED',json.dumps(direct_record,ensure_ascii=False),flush=True)

          # Two closest peer deep reports.
          report_api='https://reportapi.eastmoney.com/report/list'
          specs=[
              {'code':'688090','name':'瑞松科技','weight':145,'relation':'工业机器人系统集成与汽车焊装自动化业务，与信邦智能汽车智能制造产线最为接近。'},
              {'code':'688218','name':'江苏北人','weight':140,'relation':'工业机器人系统集成商，重点覆盖汽车焊装与新能源车智能制造产线。'},
              {'code':'688529','name':'豪森智能','weight':135,'relation':'汽车动力总成及新能源车智能生产线供应商，可比较订单、验收和项目制经营。'},
              {'code':'688097','name':'博众精工','weight':95,'relation':'大型自动化装备与智能制造解决方案商，可用于技术平台和多行业扩张对标。'},
              {'code':'300276','name':'三丰智能','weight':85,'relation':'智能输送与工业自动化系统集成企业，可用于项目制业务与机器人应用对标。'},
          ]
          candidates=[]; metadata={}
          for spec in specs:
              r=s.get(report_api,params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2016-01-01','endTime':TODAY,'pageNo':'1','fields':'','qType':'0','orgCode':'','code':spec['code'],'rcode':'','p':'1','pageNum':'1','pageNumber':'1'},timeout=(25,180))
              print('REPORT_API',spec['code'],r.status_code,len(r.content),flush=True); r.raise_for_status(); rows=r.json().get('data') or []; metadata[spec['code']]=rows
              for row in rows:
                  title=str(row.get('title') or '').strip(); info=str(row.get('infoCode') or '').strip(); pages=int(row.get('attachPages') or 0)
                  if not title or not info or pages<18: continue
                  if any(t in title for t in ['季报点评','年报点评','中报点评','事件点评','信息更新','业绩预告','业绩快报']): continue
                  score=spec['weight']+pages+(150 if any(t in title for t in ['首次覆盖','深度报告','公司深度','深度研究']) else 0)+(30 if str(row.get('publishDate') or '')[:10]>='2024-01-01' else 0)
                  candidates.append((score,row,spec))
          candidates.sort(key=lambda x:x[0],reverse=True); peers=[]; used_companies=set(); used_hashes={direct_record['sha256']}
          for score,row,spec in candidates:
              if len(peers)>=2: break
              if spec['name'] in used_companies: continue
              info=str(row.get('infoCode') or ''); target=DOWNLOADS/f'{info}.pdf'
              try:
                  source_url=download([f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf'],target)
                  pgs,txt=read_pdf(target,32)
                  if pgs<18 or (spec['name'] not in txt and spec['code'] not in txt): raise RuntimeError('peer identity/length')
                  if not any(m in txt for m in ['证券研究报告','公司研究','首次覆盖','深度报告','投资评级']): raise RuntimeError('research identity')
                  qcheck(target); digest=sha(target)
                  if digest in used_hashes: raise RuntimeError('duplicate')
                  used_hashes.add(digest); used_companies.add(spec['name'])
                  rec={'stock_code':spec['code'],'stock_name':spec['name'],'broker':str(row.get('orgSName') or row.get('orgName') or '未知券商'),'publish_date':str(row.get('publishDate') or '')[:10],'title':str(row.get('title') or '').strip(),'document_type':'智能制造/汽车自动化同业长篇深度或首次覆盖报告','relation_to_xinbang':spec['relation'],'pages':pgs,'bytes':target.stat().st_size,'sha256':digest,'source_url':source_url,'pdf_path':str(target),'peer_report':True,'selection_score':score}
                  peers.append(rec); print('PEER_VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e:
                  print('PEER_REJECT',spec['name'],row.get('title'),repr(e),flush=True); target.unlink(missing_ok=True)
          if len(peers)<2: raise RuntimeError(f'Only {len(peers)} peer deep reports validated')

          records=[direct_record]+peers; manifest=[]
          for i,rec in enumerate(records,1):
              tag='公司独立财务顾问报告' if not rec['peer_report'] else '同业深度'
              filename=f"{i:02d}_{tag}_{safe(rec['publish_date'])}_{safe(rec['broker'])}_{safe(rec['stock_name'])}_{safe(rec['title'])}.pdf"
              shutil.copy2(rec['pdf_path'],FINAL/filename); clean={k:v for k,v in rec.items() if k!='pdf_path'}; clean['filename']=filename; manifest.append(clean)
          readme=['信邦智能（301112.SZ）券商研究资料包',f'整理日期：{TODAY}','','检索结论与收录口径：','1. 按证券代码301112、证券简称“信邦智能”和公司全称检索，公开二级市场研报数据库没有返回可直接下载并核验的公司专属深度、首次覆盖或盈利预测报告。','2. 为保留公司直接研究材料，本包收录1份券商出具的公司专属独立财务顾问报告。该文件属于并购重组专业报告，不是二级市场评级研报。','3. 另收录2份业务最接近的汽车智能制造/工业机器人系统集成同业长篇深度报告，用于比较行业逻辑、订单模式、项目验收、客户结构和盈利能力。','4. 同业报告不代表券商对信邦智能本身的评级、目标价或盈利预测。','','文件清单：']
          for i,rec in enumerate(manifest,1):
              readme += [f'{i}. {rec["filename"]}',f'   类型：{rec["document_type"]}',f'   公司：{rec["stock_name"]}；券商：{rec["broker"]}；日期：{rec["publish_date"]}；页数：{rec["pages"]}',f'   标题：{rec["title"]}']
              if rec.get('relation_to_xinbang'): readme.append(f'   与信邦智能的可比性：{rec["relation_to_xinbang"]}')
              readme += [f'   来源：{rec["source_url"]}',f'   SHA-256：{rec["sha256"]}','']
          readme.append('完整性核验：已检查报告主体、券商研究属性、实际页数、PDF文件头、qpdf结构、重复文件和SHA-256；每份PDF首页已渲染，最终ZIP已通过CRC测试。')
          (FINAL/'00_文件清单与口径说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (FINAL/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (FINAL/'同业研报检索元数据.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          (FINAL/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')
          for i,rec in enumerate(manifest,1):
              rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(FINAL/rec['filename']),str(VERIFY/f'{i:02d}')],capture_output=True,text=True)
              if rr.returncode!=0: raise RuntimeError(rr.stderr[-800:])
          zip_path=ART/f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in sorted(FINAL.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad: raise RuntimeError('ZIP CRC '+bad)
              if len(pdfs)!=3: raise RuntimeError(f'Expected 3 PDFs, found {len(pdfs)}')
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',sha(zip_path),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xinbang-intelligent-301112-related-research-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: xinbang-intelligent-301112-related-research-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
