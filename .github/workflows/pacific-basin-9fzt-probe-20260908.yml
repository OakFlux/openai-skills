name: Probe public 9F Pacific Basin report assets 20260908

on:
  push:
    paths:
      - '.github/workflows/pacific-basin-9fzt-probe-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch report pages and assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('probe'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          ids=['759091526315','732696054512']
          all_candidates=[]
          for rid in ids:
            url=f'https://gmg.9fzt.com/report/HKSE/02343/{rid}.html'
            r=s.get(url,timeout=60,allow_redirects=True)
            print('\nPAGE',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            (out/f'{rid}.html').write_bytes(r.content)
            text=r.text
            soup=BeautifulSoup(text,'html.parser')
            scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')]
            attrs=[]
            for tag in soup.find_all(True):
              for attr in ['href','src','data-url','data-src','onclick','content','value']:
                v=tag.get(attr)
                if not v: continue
                sv=html.unescape(str(v).replace('\\/','/'))
                if any(k in sv.lower() for k in ['pdf','download','report','file','attachment','759091526315','732696054512','api']): attrs.append((tag.name,attr,sv))
            raw=re.findall(r'(?:https?:)?\\?/\\?/[^\"\'<>\\s]+',text)
            for x in raw:
              x=html.unescape(x.replace('\\/','/'))
              if any(k in x.lower() for k in ['pdf','download','report','file','attachment','api']): attrs.append(('raw','url',x))
            print('ATTRS',rid,json.dumps(attrs,ensure_ascii=False,indent=2)[:50000])
            all_candidates += [x[2] for x in attrs]
            for pat in ['pdf','download','attachment','fileurl','file_url','reporturl','report_url',rid,'api/','report/detail','research']:
              pos=0;n=0
              while True:
                i=text.lower().find(pat.lower(),pos)
                if i<0 or n>=20: break
                print('CTX',rid,pat,i,repr(text[max(0,i-400):min(len(text),i+1200)]))
                pos=i+len(pat); n+=1
            for idx,js in enumerate(scripts):
              try:
                rr=s.get(js,timeout=60)
                print('SCRIPT',rid,idx,rr.status_code,len(rr.content),js)
                if rr.status_code==200 and 0<len(rr.content)<15_000_000:
                  jp=out/f'{rid}_script_{idx}.js'; jp.write_bytes(rr.content)
                  jt=rr.text
                  for pat in ['pdf','download','attachment','fileurl','report/detail','research/report','reportId']:
                    if pat.lower() in jt.lower():
                      for m in list(re.finditer(pat,jt,re.I))[:20]:
                        print('JSCTX',rid,idx,pat,m.start(),repr(jt[max(0,m.start()-300):m.start()+900]))
              except Exception as e: print('SCRIPTERR',rid,idx,repr(e))
          (out/'candidates.json').write_text(json.dumps(sorted(set(all_candidates)),ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pacific-basin-9fzt-probe
          path: probe/
          retention-days: 7
          if-no-files-found: error
