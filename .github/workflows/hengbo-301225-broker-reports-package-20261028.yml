name: Package Hengbo 301225 broker reports 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-broker-reports-package-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, html, json, re, subprocess, time, urllib.parse, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          TODAY='2026-10-28'
          CODE='301225'
          COMPANY='恒勃股份'
          FULL='恒勃控股股份有限公司'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'broker':'财通证券','date':'2026-06-05','rating':'增持（首次）',
              'title':'汽摩进气系统龙头，卡位机器人PEEK核心环节',
              'info_code':'AP202606051823263343','expected_pages':19,
              'filename':'01_2026-06-05_财通证券_恒勃股份公司深度_汽摩进气系统龙头_卡位机器人PEEK核心环节.pdf',
              'broker_tokens':['财通证券','财通证券股份有限公司','财通'],
              'theme_tokens':['PEEK','机器人','进气系统','汽车零部件','摩托车']
            },
            {
              'order':2,'broker':'华鑫证券','date':'2025-11-24','rating':'买入',
              'title':'公司动态研究报告：汽摩进气系统领军企业，积极开拓成长新曲线',
              'info_code':'AP202511241787234946','expected_pages':7,
              'filename':'02_2025-11-24_华鑫证券_公司动态研究_汽摩进气系统领军企业_积极开拓成长新曲线.pdf',
              'broker_tokens':['华鑫证券','华鑫证券有限责任公司','华鑫'],
              'theme_tokens':['进气系统','摩托车','汽车','热管理','PEEK']
            },
            {
              'order':3,'broker':'华金证券','date':'2023-05-31','rating':'新股覆盖',
              'title':'新股覆盖研究：恒勃股份',
              'info_code':'AP202305311587369843','expected_pages':11,
              'filename':'03_2023-05-31_华金证券_新股覆盖研究_恒勃股份.pdf',
              'broker_tokens':['华金证券','华金证券股份有限公司','华金'],
              'theme_tokens':['进气系统','汽车','摩托车','滤清器','内燃机']
            },
          ]

          candidate_record={
            'selected':[
              {'broker':r['broker'],'date':r['date'],'title':r['title'],'info_code':r['info_code'],'expected_pages':r['expected_pages']}
              for r in reports
            ],
            'not_included_due_to_access_restriction':[
              {'broker':'申万宏源','date':'2025-11-30','title':'进气系统头部供应商，多元布局PEEK核心卡位','pages':32,'reason':'公开聚合页仅提供前10页预览，完整下载需登录或会员权限'},
              {'broker':'中泰证券','date':'2025-10-24','title':'汽摩内燃机进气系统龙头，布局PEEK领域拓展第二增长曲线','pages':25,'reason':'检索到报告信息，但未找到可公开直接下载的原始完整PDF'},
              {'broker':'中国国际金融','date':'2026-03-25','title':'汽摩进气系统龙头实现机器人PEEK核心卡位','pages':None,'reason':'公开页面仅提供报告摘要，未提供完整PDF'},
            ],
            'selection_note':'优先收录公司专属、券商署名明确、可公开完整下载并可通过结构与全文核验的PDF。'
          }

          session=requests.Session(); session.trust_env=False
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          session.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def candidates_from_page(info_code:str):
            report_page=f'https://data.eastmoney.com/report/info/{info_code}.html'
            urls=[]
            try:
              r=session.get(report_page,headers={'User-Agent':UA,'Accept':'text/html,*/*'},timeout=(20,120),allow_redirects=True)
              if r.status_code==200:
                soup=BeautifulSoup(r.text,'html.parser')
                for tag in soup.find_all(['a','iframe','embed'],href=True):
                  u=urllib.parse.urljoin(report_page,html.unescape(tag.get('href','')))
                  if 'pdf.dfcfw.com/pdf/' in u and '.pdf' in u.lower(): urls.append(u)
                for tag in soup.find_all(['iframe','embed','script'],src=True):
                  u=urllib.parse.urljoin(report_page,html.unescape(tag.get('src','')))
                  if 'pdf.dfcfw.com/pdf/' in u and '.pdf' in u.lower(): urls.append(u)
                for m in re.findall(r'https?://pdf\.dfcfw\.com/pdf/[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',r.text,re.I):
                  urls.append(html.unescape(m))
            except Exception:
              pass
            for prefix in ['H3','H2','H1','H4']:
              urls += [
                f'https://pdf.dfcfw.com/pdf/{prefix}_{info_code}_1.pdf',
                f'https://pdf.dfcfw.com/pdf/{prefix}_{info_code}_01.pdf'
              ]
            out=[]
            for u in urls:
              u=u.replace('&amp;','&')
              if u not in out: out.append(u)
            return report_page,out

          def download_pdf(info_code:str):
            report_page,urls=candidates_from_page(info_code)
            last={}
            for url in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(url,headers={
                    'User-Agent':UA,'Referer':report_page,
                    'Accept':'application/pdf,application/octet-stream,*/*;q=0.8',
                    'Origin':'https://data.eastmoney.com'
                  },timeout=(30,420),allow_redirects=True)
                  last={'requested_url':url,'final_url':str(r.url),'status':r.status_code,
                        'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                    return r.content,str(r.url),report_page,last
                except Exception as exc:
                  last={'requested_url':url,'error':repr(exc)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,source_url,report_page,download_meta=download_pdf(item['info_code'])
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<6 or abs(pages-item['expected_pages'])>2:
              raise RuntimeError(f'Unexpected page count: {dest.name}: actual={pages}, expected={item["expected_pages"]}')

            txt=RENDER/f'{item["order"]:02d}_full.txt'
            subprocess.run(['pdftotext',str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            text=txt.read_text(encoding='utf-8',errors='ignore')
            identity_ok=any(x in text for x in [COMPANY,FULL,CODE,'恒勃控股'])
            broker_ok=any(x in text for x in item['broker_tokens'])
            theme_hits={k:(k in text) for k in item['theme_tokens']}
            theme_ok=sum(theme_hits.values())>=2
            if not identity_ok: raise RuntimeError(f'Issuer identity check failed: {dest.name}')
            if not broker_ok: raise RuntimeError(f'Broker identity check failed: {dest.name}')
            if not theme_ok: raise RuntimeError(f'Business-theme check failed: {dest.name}: {theme_hits}')

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0: raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'
            last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8_000: raise RuntimeError(f'First-page render failed: {dest.name}')
            if not last_png.exists() or last_png.stat().st_size<3_000: raise RuntimeError(f'Last-page render failed: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'stock_code':CODE,'stock_name':COMPANY,'company_full_name':FULL,
              'broker':item['broker'],'publish_date':item['date'],'title':item['title'],'rating':item['rating'],
              'info_code':item['info_code'],'pages':pages,'bytes':len(data),'sha256':sha,
              'source_url':source_url,'report_page':report_page,'filename':item['filename'],
              'identity_check':identity_ok,'broker_check':broker_ok,'business_theme_hits':theme_hits,
              'validation':['PDF header','company identity','broker identity','business themes','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })
            print('VALIDATED',json.dumps(manifest[-1],ensure_ascii=False),flush=True)

          if len(manifest)!=3 or len({m['sha256'] for m in manifest})!=3:
            raise RuntimeError('Report count or duplicate check failed')

          readme=[
            '恒勃股份（301225.SZ；恒勃控股股份有限公司）券商深度及公司研究报告资料包',
            f'整理日期：{TODAY}','',
            '收录3份公司专属、公开可完整下载的券商PDF。',
            '其中财通证券为19页公司深度研究；华鑫证券为7页公司动态研究；华金证券为11页新股覆盖研究。',
            '筛选以完整性和可核验性为优先。申万宏源32页、中泰证券25页及中金公司报告虽可检索到题名或摘要，但公开页面未提供无需账户权限的完整原始PDF，因此未以预览图、网页摘要或非授权技术绕过补数。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；评级：{m["rating"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   PDF来源：{m["source_url"]}',
              f'   研报页面：{m["report_page"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、业务主题、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
            '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'恒勃股份研报候选与筛选记录.json').write_text(json.dumps(candidate_record,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'恒勃股份_301225_券商深度及公司研究报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha,flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hengbo-301225-broker-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
