name: Discover Jianshe Industry 002265 broker reports 20261016

on:
  push:
    paths:
      - '.github/workflows/jianshe-industry-002265-broker-discovery-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query public research-report indexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests

          out=Path('jianshe_broker_discovery')
          out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=002265',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def parse_payload(text):
              text=text.strip()
              try: return json.loads(text)
              except Exception: pass
              m=re.search(r'^[^(]*\((.*)\)\s*;?$', text, re.S)
              if m:
                  try: return json.loads(m.group(1))
                  except Exception: pass
              return None

          requests_log=[]
          all_rows=[]
          seen=set()
          endpoint='https://reportapi.eastmoney.com/report/list'
          base={
              'pageSize':'100','industryCode':'*','industry':'*','rating':'*','ratingChange':'*',
              'fields':'','orgCode':'','author':'','stockCode':'002265','rcode':'',
          }
          cases=[]
          for qtype in ['0','1','2']:
              for dated in [False, True]:
                  for cb in [False, True]:
                      p=dict(base)
                      p.update({'pageNo':'1','qType':qtype,'p':'1','pageNum':'1','pageNumber':'1'})
                      if dated:
                          p.update({'beginTime':'2010-01-01','endTime':'2026-10-16'})
                      if cb: p['cb']='datatable'
                      cases.append((qtype,dated,cb,p))

          for qtype,dated,cb,p in cases:
              last=None
              for attempt in range(5):
                  try:
                      r=s.get(endpoint,params=p,timeout=(20,90))
                      payload=parse_payload(r.text)
                      rec={
                          'qType':qtype,'dated':dated,'callback':cb,'status':r.status_code,
                          'url':r.url,'content_type':r.headers.get('content-type',''),
                          'bytes':len(r.content),'prefix':r.text[:500],
                          'parsed_type':type(payload).__name__ if payload is not None else None,
                      }
                      requests_log.append(rec)
                      last=rec
                      if r.status_code==200 and payload is not None:
                          candidates=[]
                          if isinstance(payload,dict):
                              for key in ['data','result','list','rows']:
                                  val=payload.get(key)
                                  if isinstance(val,list): candidates.extend(val)
                                  elif isinstance(val,dict):
                                      for k2 in ['data','list','rows']:
                                          v2=val.get(k2)
                                          if isinstance(v2,list): candidates.extend(v2)
                          elif isinstance(payload,list): candidates=payload
                          for row in candidates:
                              if not isinstance(row,dict): continue
                              code=str(row.get('infoCode') or row.get('info_code') or row.get('reportCode') or row.get('rcode') or '')
                              key=code or json.dumps(row,ensure_ascii=False,sort_keys=True)
                              if key in seen: continue
                              seen.add(key); all_rows.append(row)
                          break
                  except Exception as e:
                      last={'qType':qtype,'dated':dated,'callback':cb,'error':repr(e)}
                      requests_log.append(last)
                  time.sleep(1+attempt)

          (out/'requests_log.json').write_text(json.dumps(requests_log,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'parsed_rows.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'summary.txt').write_text(f'rows={len(all_rows)}\nrequests={len(requests_log)}\n',encoding='utf-8')
          print('ROWS',len(all_rows))
          print(json.dumps(all_rows,ensure_ascii=False,indent=2)[:20000])
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: jianshe-industry-002265-broker-discovery
          path: jianshe_broker_discovery
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
