name: probe-donghu-hightech-report-attachments-v5

on:
  push:
    branches:
      - tmp/donghu-hightech-600133-broker-probe-20261104-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install parsers
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch and inspect pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_output
          python - <<'PY'
          import json, re, html
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls={
            'sina_list':'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh600133&t1=all',
            'sina_2025q1':'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/799312999325/index.phtml',
            'fx_202306':'https://www.fxbaogao.com/detail/3770114',
            'fx_202311':'https://www.fxbaogao.com/detail/3990320',
            'nbd_202306':'https://m.nbd.com.cn/articles/2023-06-30/2893953.html',
          }
          all_results={}
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=(30,180),allow_redirects=True)
              print('\n===',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),'===')
              enc=r.apparent_encoding or r.encoding or 'utf-8'
              try: text=r.content.decode(enc,errors='replace')
              except: text=r.text
              Path(f'probe_output/{name}.html').write_text(text,encoding='utf-8')
              print('HEAD',text[:1200].replace('\n',' '))
              soup=BeautifulSoup(text,'lxml')
              links=[]
              for a in soup.find_all(['a','link','script','iframe','img']):
                for attr in ['href','src','data-src','data-url','url']:
                  v=a.get(attr)
                  if v:
                    links.append(urljoin(r.url,v))
              raw_urls=re.findall(r'https?://[^\s"\'<>\\]+',text)
              links.extend(raw_urls)
              interesting=[]
              for link in links:
                lower=link.lower()
                if any(k in lower for k in ['.pdf','download','attachment','file','report','duplik','cos.','oss.','dfcfw']):
                  if link not in interesting: interesting.append(link)
              print('INTERESTING_COUNT',len(interesting))
              for link in interesting[:200]: print('LINK',link)
              for pat in ['pdf','download','fileUrl','file_url','attachment','reportUrl','report_url','docUrl','oss','cos','infocode','infoCode','rptid']:
                matches=[]
                for m in re.finditer(pat,text,re.I):
                  start=max(0,m.start()-240); end=min(len(text),m.end()+500)
                  snippet=re.sub(r'\s+',' ',text[start:end])
                  if snippet not in matches: matches.append(snippet)
                  if len(matches)>=12: break
                if matches:
                  print('PATTERN',pat,'COUNT',len(matches))
                  for sn in matches: print('SNIP',sn)
              all_results[name]={'url':r.url,'status':r.status_code,'bytes':len(r.content),'encoding':enc,'interesting':interesting}
            except Exception as e:
              print('ERROR',name,repr(e)); all_results[name]={'error':repr(e)}
          Path('probe_output/results.json').write_text(json.dumps(all_results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: donghu-hightech-probe-v5
          path: probe_output
          retention-days: 7
          compression-level: 6
