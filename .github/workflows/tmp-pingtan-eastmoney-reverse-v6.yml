name: Temporary Pingtan Development Eastmoney reverse search v6

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-eastmoney-reverse-v6.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests pypdf
      - name: Reverse-search exact publication windows and download PDFs
        run: |
          mkdir -p out/pdfs
          python - <<'PY'
          import hashlib,json,re,time,zipfile
          from datetime import date,timedelta
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          O=Path('out'); P=O/'pdfs'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept-Language':'zh-CN,zh;q=0.9'})
          dates=['2011-11-23','2011-12-05','2013-01-22','2013-12-12','2014-03-21','2014-07-16','2014-07-29','2014-06-03','2014-08-27','2014-10-31']
          terms=['中福实业','福建中福','平潭发展','000592','乘平潭开发东风','主业稳健发展','依托林业资产','建设两岸家园','扎根两岸家园','受益平潭实验区']
          logs=[]; matches=[]; query=[]
          def note(*a):x=' '.join(map(str,a));print(x,flush=True);logs.append(x)
          for ds in dates:
            d=date.fromisoformat(ds); begin=(d-timedelta(days=2)).isoformat(); end=(d+timedelta(days=2)).isoformat()
            for page in range(1,25):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':page,'fields':'','qType':0,'orgCode':'','code':'*','rcode':'','p':page,'pageNum':page,'pageNumber':page}
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=45)
                text=r.text.strip();
                if text.startswith('(') and text.endswith(')'):text=text[1:-1]
                obj=json.loads(text); data=obj.get('data') or []; total=int(obj.get('TotalPage') or 1)
                note('GET',ds,begin,end,page,r.status_code,len(data),total,len(r.content));query.append({'date':ds,'page':page,'status':r.status_code,'count':len(data),'total':total})
                for x in data:
                  blob=json.dumps(x,ensure_ascii=False)
                  if any(t in blob for t in terms):
                    matches.append(x);note('MATCH',x.get('publishDate'),x.get('orgSName'),x.get('stockCode'),x.get('title'),x.get('infoCode'),x.get('attachPages'))
                if not data or page>=total:break
              except Exception as e:note('GETERR',ds,page,repr(e));break
              time.sleep(.25)
          # Try list2 POST as a second route.
          for ds in dates:
            d=date.fromisoformat(ds); begin=(d-timedelta(days=2)).isoformat(); end=(d+timedelta(days=2)).isoformat()
            for page in range(1,25):
              body={'beginTime':begin,'endTime':end,'industryCode':'*','ratingChange':'*','rating':'*','orgCode':'*','code':'*','rcode':'','pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'qType':0}
              try:
                r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=45,headers={'Content-Type':'application/json','Origin':'https://data.eastmoney.com'})
                obj=r.json();data=obj.get('data') or [];total=int(obj.get('TotalPage') or 1)
                note('POST',ds,page,r.status_code,len(data),total,len(r.content));query.append({'route':'list2','date':ds,'page':page,'status':r.status_code,'count':len(data),'total':total})
                for x in data:
                  blob=json.dumps(x,ensure_ascii=False)
                  if any(t in blob for t in terms):matches.append(x);note('MATCH2',x.get('publishDate'),x.get('orgSName'),x.get('stockCode'),x.get('title'),x.get('infoCode'),x.get('attachPages'))
                if not data or page>=total:break
              except Exception as e:note('POSTERR',ds,page,repr(e));break
              time.sleep(.25)
          uniq=[];seen=set()
          for x in matches:
            k=x.get('infoCode') or (x.get('title'),x.get('publishDate'),x.get('orgSName'))
            if k in seen:continue
            seen.add(k);uniq.append(x)
          (O/'matches.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'queries.json').write_text(json.dumps(query,ensure_ascii=False,indent=2),encoding='utf-8')
          def clean(x,n=100):return re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x or '')).strip(' ._')[:n] or 'report'
          got=[];hs=set()
          for x in uniq:
            info=str(x.get('infoCode') or '')
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf']:
              try:
                r=s.get(u,timeout=90,headers={'Referer':'https://data.eastmoney.com/'})
                note('PDF',r.status_code,len(r.content),r.headers.get('content-type'),u)
                if r.status_code!=200 or len(r.content)<1500 or not r.content.lstrip().startswith(b'%PDF'):continue
                h=hashlib.sha256(r.content).hexdigest()
                if h in hs:break
                hs.add(h);tmp=P/f'tmp_{h[:12]}.pdf';tmp.write_bytes(r.content)
                rd=PdfReader(str(tmp));pages=len(rd.pages);text=''
                for pg in rd.pages[:7]:
                  try:text+='\n'+(pg.extract_text() or '')
                  except:pass
                datev=str(x.get('publishDate') or '')[:10];org=x.get('orgSName') or x.get('orgName') or '未知机构';title=x.get('title') or '平潭发展研报'
                fn=f'{datev}_{clean(org,35)}_{clean(title,95)}_{pages}页.pdf';tmp.rename(P/fn)
                got.append({'file':fn,'date':datev,'org':org,'title':title,'pages':pages,'bytes':len(r.content),'identity':any(k in text for k in ['平潭发展','中福实业','福建中福','000592']),'url':u,'sha256':h});note('SAVED',fn)
                break
              except Exception as e:note('PDFERR',u,repr(e))
          (O/'pdfs.json').write_text(json.dumps(got,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          with zipfile.ZipFile(O/'平潭发展_东财历史研报恢复包.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in P.glob('*.pdf'):z.write(f,f.name)
            z.write(O/'pdfs.json','pdfs.json')
          note('DONE','MATCHES',len(uniq),'PDFS',len(got))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-eastmoney-reverse-v6
          path: out/
          retention-days: 3
