name: Package Shandong Mining Machinery 002526 broker deep reports 20261028 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-shandongkuangji-002526-broker-deep-reports-20261028-v2.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          package='山东矿机_002526_券商深度与首次覆盖报告_完整版_3份_截至20261028'
          root=Path(package); pdfdir=root/'PDF原文'; prevdir=root/'首末页预览'
          pdfdir.mkdir(parents=True); prevdir.mkdir(parents=True)
          candidates=[
            dict(broker='中银国际证券',date='2012-02-22',title='差异化竞争的综合煤机新星',analysts='许民乐',rating='买入（首次评级）',kind='公司深度/首次评级',min_pages=20,
                 urls=['https://pdf.dfcfw.com/pdf/H3_AP201202250003487364_1.pdf','https://qccdata.qichacha.com/ReportData/PDF/3373330474abe20c6d49752364083c6e.pdf'],
                 source='https://data.eastmoney.com/report/info/AP201202250003487364.html',tokens=['中银国际','中银国际研究']),
            dict(broker='华泰联合证券',date='2011-01-10',title='薄煤层综采成套设备领先者',analysts='吴凯',rating='增持（首次评级）',kind='公司深度研究/首次评级',min_pages=15,
                 urls=['https://pdf.dfcfw.com/pdf/H3_AS201202260003843498_1.pdf'],
                 source='https://pdf.dfcfw.com/pdf/H3_AS201202260003843498_1.pdf',tokens=['华泰联合','华泰联合证券']),
            dict(broker='国金证券',date='2011-12-18',title='2012年将是公司新业务的收获之年',analysts='董亚光',rating='买入（维持）',kind='公司深度研究',min_pages=10,
                 urls=['https://pdf.dfcfw.com/pdf/H3_AP201202250003436965_1.pdf'],
                 source='https://data.eastmoney.com/report/info/AP201202250003436965.html',tokens=['国金证券','国金研究']),
            dict(broker='国金证券',date='2010-12-02',title='山东矿机新股研究',analysts='罗立波',rating='未评级',kind='新股深度研究',min_pages=10,
                 urls=['https://pdf.dfcfw.com/pdf/H3_AS201202260003785346_1.pdf'],
                 source='https://pdf.dfcfw.com/pdf/H3_AS201202260003785346_1.pdf',tokens=['国金证券','国金研究'])
          ]
          s=requests.Session(); s.trust_env=False
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=6,connect=6,read=6,status=6,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)))
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          def compact(x): return re.sub(r'[\s，。、“”‘’：:；;（）()—－+&·＊*]+','',str(x or '')).lower()
          def safe(x): return re.sub(r'[\\/:*?"<>|]+','_',str(x)).strip()[:90]
          manifest=[]; skipped=[]; hashes=set()
          for c in candidates:
            if len(manifest)>=3: break
            try:
              data=None; used=None; meta={}
              for url in c['urls']:
                for attempt in range(4):
                  try:
                    r=s.get(url,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'},timeout=(30,480),allow_redirects=True)
                    meta={'url':url,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                    if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                      data=r.content; used=url; break
                  except Exception as e: meta={'url':url,'error':repr(e)}
                  time.sleep(1+attempt)
                if data: break
              if not data: raise RuntimeError(f'download failed {meta}')
              name=f"{len(manifest)+1:02d}_{safe(c['broker'])}_山东矿机_{safe(c['title'])}_{c['date']}.pdf"
              dest=pdfdir/name; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<c['min_pages']: raise RuntimeError(f'only {pages} pages')
              text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(40,pages)])
              ct=compact(text)
              if not any(compact(x) in ct for x in ['山东矿机','山东矿机集团股份有限公司','002526']): raise RuntimeError('issuer mismatch')
              if not any(compact(x) in ct for x in c['tokens']): raise RuntimeError('broker mismatch')
              title_parts=[x for x in re.split(r'[，、“”+：:——]',c['title']) if len(compact(x))>=4]
              if not any(compact(x) in ct for x in title_parts): raise RuntimeError('title mismatch')
              sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError('duplicate')
              hashes.add(sha)
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              previews=[]
              for pageno,label in [(1,'首页'),(pages,'末页')]:
                prefix=prevdir/f'{dest.stem}_{label}'
                subprocess.run(['pdftoppm','-f',str(pageno),'-l',str(pageno),'-singlefile','-png','-r','130',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                img=Path(str(prefix)+'.png')
                if not img.exists() or img.stat().st_size<8000: raise RuntimeError('render failed')
                previews.append(str(Path('首末页预览')/img.name))
              manifest.append({**{k:v for k,v in c.items() if k not in ['urls','tokens']},'filename':name,'actual_pages':pages,'bytes':len(data),'sha256':sha,'pdf_url':used,'download_meta':meta,'preview_files':previews,'document_nature':'券商原始完整PDF'})
            except Exception as e:
              skipped.append({'title':c['title'],'broker':c['broker'],'reason':repr(e)})
              try:
                if 'dest' in locals() and dest.exists(): dest.unlink()
              except Exception: pass
          if len(manifest)!=3: raise RuntimeError(f'only {len(manifest)} verified reports; skipped={skipped}')
          readme=['山东矿机集团股份有限公司（002526.SZ）券商深度与首次覆盖报告资料包','整理基准日：2026-10-28','',
                  '公开渠道未检索到近年的完整公司深度报告；本包收录3份经全文核验的历史长篇公司研究。','']
          for i,m in enumerate(manifest,1):
            readme += [f"{i}. {m['broker']}：《{m['title']}》",f"   类型：{m['kind']}；日期：{m['date']}；分析师：{m['analysts']}；评级：{m['rating']}",f"   完整页数：{m['actual_pages']}页；文件：PDF原文/{m['filename']}",f"   来源：{m['source']}",f"   SHA-256：{m['sha256']}",'']
          readme += ['报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。','核验：PDF文件头、公司与券商身份、标题、页数、qpdf结构、首末页渲染、重复文件及ZIP CRC。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'候选筛选记录.json').write_text(json.dumps(skipped,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')
          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            if z.testzip() or sum(n.lower().endswith('.pdf') for n in z.namelist())!=3: raise RuntimeError('zip validation failed')
          short=Path('shandongkuangji_002526_broker_deep_reports_3.zip'); shutil.copy2(zpath,short)
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest(),flush=True)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('SKIPPED',json.dumps(skipped,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shandongkuangji-002526-broker-deep-reports-v2-final-20261028
          path: |
            山东矿机_002526_券商深度与首次覆盖报告_完整版_3份_截至20261028.zip
            shandongkuangji_002526_broker_deep_reports_3.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
