name: Locate exact CEL 2026 interim PDF

on:
  push:
    branches:
      - tmp/cel-report-scrape-fast-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Inspect mirrors for source PDF links
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.parse,requests
          from bs4 import BeautifulSoup
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          s=requests.Session();s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages=[
            'https://financialfilings.com/filings/china-everbright-limited/interim-quarterly-report/2026/57734926/',
            'https://www.hkej.com/instantnews/hkex/article/4495948/%E4%B8%AD%E5%9C%8B%E5%85%89%E5%A4%A7%E6%8E%A7%E8%82%A1%2800165%29%3A%E6%88%AA%E8%87%B32026%E5%B9%B46%E6%9C%8830%E6%97%A5%E6%AD%A2%E5%85%AD%E5%80%8B%E6%9C%88%E4%B9%8B%E4%B8%AD%E6%9C%9F%E6%A5%AD%E7%B8%BE%E5%85%AC%E5%91%8A',
            'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=289',
          ]
          for u in pages:
            try:
              r=s.get(u,timeout=45,allow_redirects=True)
              print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              soup=BeautifulSoup(r.text,'lxml')
              for tag,attr in [('a','href'),('iframe','src'),('embed','src'),('object','data'),('script','src')]:
                for x in soup.find_all(tag):
                  v=x.get(attr)
                  if not v:continue
                  full=urllib.parse.urljoin(r.url,v.strip())
                  txt=' '.join(x.get_text(' ',strip=True).split())
                  blob=(full+' '+txt).lower()
                  if any(k in blob for k in ['pdf','original','hkexnews','48999','download','listedco','rns_2026-08-27']):
                    print('LINK',tag,repr(txt[:300]),full,flush=True)
              raw=r.text.replace('\\/','/')
              pats=[
                r'https?://[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?',
                r'https?://[^"\'<>\s]+48999[^"\'<>\s]+',
                r'/listedco/listconews/[^"\'<>\s]+\.pdf',
                r'[^"\'<>\s]*48999_rns_2026-08-27_ddf735f9-77d5-4d55-9b7a-bac723733210\.pdf[^"\'<>\s]*',
              ]
              for pat in pats:
                for m in re.findall(pat,raw,re.I):
                  print('REGEX',urllib.parse.urljoin(r.url,m),flush=True)
              for needle in ['48999_rns_2026-08-27','Original Filing','Download Original','hkexnews.hk/listedco']:
                pos=raw.find(needle)
                if pos>=0:print('SNIPPET',needle,raw[max(0,pos-1000):pos+1800].replace('\n',' ')[:2800],flush=True)
            except Exception as e:print('ERROR',u,repr(e),flush=True)
          PY