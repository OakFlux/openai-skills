name: Build Quanyangquan 600189 annual reports 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quanyangquan-600189-annual-reports-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '600189'
          SHORT = '泉阳泉'
          FULL = '吉林泉阳泉股份有限公司'
          OLD_NAMES = ('吉林森林工业股份有限公司', '吉林森工')
          PACKAGE = '泉阳泉_600189_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          items = [
              {
                  'label': '2020年年度报告',
                  'kind': 'annual',
                  'year': 2020,
                  'announcement_date': '2021-04-27',
                  'announcement_id': '7126013',
                  'required_tokens': ['2020年年度报告'],
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-27/7126013.PDF',
                  ],
              },
              {
                  'label': '2021年年度报告',
                  'kind': 'annual',
                  'year': 2021,
                  'announcement_date': '2022-04-30',
                  'announcement_id': '8170659',
                  'required_tokens': ['2021年年度报告', '2021年年报全文'],
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-30/8170659.PDF',
                  ],
              },
              {
                  'label': '2022年年度报告',
                  'kind': 'annual',
                  'year': 2022,
                  'announcement_date': '2023-04-29',
                  'announcement_id': '9162218',
                  'required_tokens': ['2022年年度报告'],
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-29/9162218.PDF',
                  ],
              },
              {
                  'label': '2023年年度报告',
                  'kind': 'annual',
                  'year': 2023,
                  'announcement_date': '2024-04-15',
                  'announcement_id': '9970321',
                  'required_tokens': ['2023年年度报告'],
                  'min_pages': 100,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-15/9970321.PDF',
                  ],
              },
              {
                  'label': '2024年年度报告（前期会计差错更正后版本）',
                  'kind': 'annual',
                  'year': 2024,
                  'announcement_date': '2025-04-30',
                  'announcement_id': '11072007',
                  'required_tokens': ['2024年年度报告'],
                  'min_pages': 150,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-30/11072007.PDF',
                      'https://pdf.dfcfw.com/pdf/H2_AN202504291664549798_1.pdf',
                  ],
              },
              {
                  'label': '2025年年度报告',
                  'kind': 'annual',
                  'year': 2025,
                  'announcement_date': '2026-03-31',
                  'announcement_id': '12045369',
                  'required_tokens': ['2025年年度报告'],
                  'min_pages': 80,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-3/2026-03-31/12045369.PDF',
                  ],
              },
              {
                  'label': '2026年第三季度报告',
                  'kind': 'quarter',
                  'year': 2026,
                  'announcement_date': '2026-10-27',
                  'announcement_id': '12661599',
                  'required_tokens': ['2026年第三季度报告'],
                  'min_pages': 5,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-10/2026-10-27/12661599.PDF',
                  ],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          identities = (SHORT, FULL, CODE, '吉林泉阳泉股份', *OLD_NAMES, 'JILINQUANYANGQUAN')
          manifest = []

          for idx, item in enumerate(items, 1):
              data = None
              source_url = ''
              attempts = []
              for url in item['urls']:
                  for attempt in range(5):
                      try:
                          if 'sina.com.cn' in url:
                              referer = 'https://vip.stock.finance.sina.com.cn/'
                          elif 'dfcfw.com' in url:
                              referer = 'https://data.eastmoney.com/'
                          else:
                              referer = 'https://www.sse.com.cn/'
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url,
                              'attempt': attempt + 1,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f'Download failed for {item["label"]}: {attempts}')

              filename = f'{idx:02d}_泉阳泉_{item["label"]}.pdf'
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(80, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in identities if normalize(x) in compact]
              title_hits = [x for x in item['required_tokens'] if normalize(x) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')
              if len(compact) > 500 and not title_hits:
                  raise RuntimeError(f'Report title mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              record = {
                  'label': item['label'],
                  'kind': item['kind'],
                  'report_year': item['year'],
                  'announcement_date': item['announcement_date'],
                  'announcement_id': item['announcement_id'],
                  'source_url': source_url,
                  'candidate_urls': item['urls'],
                  'filename': str(Path('原始PDF') / filename),
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'title_hits': title_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'report title', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              }
              manifest.append(record)
              print('VERIFIED', record['label'], record['pages'], record['bytes'], record['sha256'], record['source_url'])

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '吉林泉阳泉股份有限公司（600189.SH）年度报告及最新季度报告资料包',
              '整理日期：2026-11-04', '',
              '收录范围：2020—2025年年度报告全文，以及截至整理日最新披露的2026年第三季度报告。',
              '2024年年度报告采用2025年4月30日因前期会计差错更正后重新披露的全文版本。',
              '不收录年度报告摘要、半年度报告、单独审计附件或普通公告页面。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["label"]}',
                  f'   页数：{x["pages"]}页；文件：{x["filename"]}',
                  f'   披露日期：{x["announcement_date"]}；公告ID：{x["announcement_id"]}',
                  f'   来源：{x["source_url"]}',
                  f'   SHA-256：{x["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '核验项目：PDF文件头、公司名称/证券代码、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('quanyangquan_600189_2020_2025_annual_reports_latest_quarter.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: quanyangquan-600189-filings-final
          path: |
            泉阳泉_600189_2020-2025年报及最新季报.zip
            quanyangquan_600189_2020_2025_annual_reports_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
