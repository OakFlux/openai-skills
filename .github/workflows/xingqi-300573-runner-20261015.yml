name: Curl Matrix Wuhan Fingu Report 16990

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl wget openssl
      - name: Curl protocol and header matrix
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          urls=(
            'https://bg.sgpjbg.com/baogao/16990.html'
            'https://bg.sgpjbg.com/bgdown/16990.html'
            'http://bg.sgpjbg.com/baogao/16990.html'
            'http://bg.sgpjbg.com/bgdown/16990.html'
            'https://www.sgpjbg.com/baogao/16990.html'
            'https://www.sgpjbg.com/bgdown/16990.html'
          )
          modes=(
            '--http1.0'
            '--http1.1'
            '--http2'
            '--http1.1 --tlsv1.2'
            '--http1.1 --tls-max 1.2 --ciphers AES128-SHA256'
          )
          n=0
          for url in "${urls[@]}"; do
            for mode in "${modes[@]}"; do
              key=$(printf '%03d' "$n"); n=$((n+1))
              echo "=== $key $mode $url ===" | tee "out/${key}.meta"
              # shellcheck disable=SC2086
              timeout 60 curl -vkL $mode --connect-timeout 15 --max-time 50 \
                --compressed \
                -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36' \
                -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,application/pdf;q=0.8,image/avif,image/webp,*/*;q=0.7' \
                -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                -H 'Connection: close' \
                -H 'Sec-Fetch-Dest: document' \
                -H 'Sec-Fetch-Mode: navigate' \
                -H 'Sec-Fetch-Site: same-origin' \
                -H 'Upgrade-Insecure-Requests: 1' \
                -e 'https://bg.sgpjbg.com/zhuanti/xintiandichanjituanbaogao.html' \
                -c out/cookies.txt -b out/cookies.txt \
                -D "out/${key}.headers" -o "out/${key}.body" "$url" \
                2>"out/${key}.stderr" || true
              size=$(stat -c%s "out/${key}.body" 2>/dev/null || echo 0)
              magic=$(head -c 8 "out/${key}.body" 2>/dev/null | od -An -tx1 | tr -d ' \n')
              echo "SIZE=$size MAGIC=$magic" | tee -a "out/${key}.meta"
              sed -n '1,35p' "out/${key}.headers" 2>/dev/null | tee -a "out/${key}.meta" || true
              tail -30 "out/${key}.stderr" 2>/dev/null | tee -a "out/${key}.meta" || true
            done
          done
          echo '=== WGET ===' | tee out/wget.meta
          timeout 90 wget -S --max-redirect=10 --timeout=20 --tries=2 \
            --user-agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            --referer='https://bg.sgpjbg.com/zhuanti/xintiandichanjituanbaogao.html' \
            -O out/wget_16990.bin 'https://bg.sgpjbg.com/bgdown/16990.html' \
            2>&1 | tee -a out/wget.meta || true
          file out/*.body out/wget_16990.bin 2>/dev/null | tee out/filetypes.txt || true
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-16990-curl-matrix
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
