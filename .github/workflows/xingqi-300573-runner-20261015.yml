name: Run Xingqi Eye Medicine filing package 20261015

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Extract and run packaging script
        shell: bash
        run: |
          set -euo pipefail
          awk '/python - <<'\''PY'\''/{flag=1;next} /^[[:space:]]*PY$/{flag=0} flag{sub(/^          /,""); print}' \
            .github/workflows/xingqi-300573-annual-reports-2020-2025-20261015.yml > /tmp/xingqi_package.py
          python /tmp/xingqi_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: xingqi-300573-annual-reports-final-20261015
          path: |
            兴齐眼药_300573_2020-2025年报及最新季报.zip
            xingqi_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
