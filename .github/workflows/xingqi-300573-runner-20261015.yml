name: Diagnose Wuhan Fingu Report 16990

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils curl openssl
          python -m pip install --quiet requests
      - name: Probe original and proxy URLs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          {
            echo '=== DNS ==='
            for h in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com r.jina.ai; do
              echo "--- $h"; dig +short "$h" A; dig +short "$h" CNAME; getent ahostsv4 "$h" || true
            done
            echo '=== TLS ==='
            for h in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com r.jina.ai; do
              echo "--- $h"; timeout 15 openssl s_client -connect "$h:443" -servername "$h" -brief </dev/null 2>&1 | head -40 || true
            done
          } | tee out/network.txt

          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import requests

          urls=[
            'https://bg.sgpjbg.com/baogao/16990.html',
            'https://bg.sgpjbg.com/bgdown/16990.html',
            'https://www.sgpjbg.com/baogao/16990.html',
            'https://www.sgpjbg.com/bgdown/16990.html',
            'https://r.jina.ai/http://bg.sgpjbg.com/baogao/16990.html',
            'https://r.jina.ai/http://bg.sgpjbg.com/bgdown/16990.html',
            'https://r.jina.ai/https://bg.sgpjbg.com/baogao/16990.html',
            'https://r.jina.ai/https://bg.sgpjbg.com/bgdown/16990.html',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://bg.sgpjbg.com/baogao/16990.html',
          })
          results=[]
          for i,url in enumerate(urls):
            last=None
            for attempt in range(3):
              try:
                r=s.get(url,timeout=(20,120),allow_redirects=True)
                item={'url':url,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'headers':dict(r.headers),'prefix_hex':r.content[:24].hex(),'cookies':s.cookies.get_dict()}
                results.append(item)
                Path(f'out/resp_{i}.bin').write_bytes(r.content)
                Path(f'out/resp_{i}.json').write_text(json.dumps(item,ensure_ascii=False,indent=2),encoding='utf-8')
                print('RESULT',json.dumps(item,ensure_ascii=False))
                break
              except Exception as exc:
                last=repr(exc); print('ERROR',url,attempt,last); time.sleep(2+attempt)
            else:
              results.append({'url':url,'error':last})
          Path('out/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-16990-probe
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
