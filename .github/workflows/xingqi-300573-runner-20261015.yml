name: Run Saimo Intelligent public broker research archive package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4
      - name: Extract and run packaging script
        shell: bash
        run: |
          set -euo pipefail
          awk '/python - <<'\''PY'\''/{flag=1;next} /^[[:space:]]*PY$/{flag=0} flag{sub(/^          /,""); print}' \
            .github/workflows/package-saimo-intelligent-broker-reports-20261020.yml > /tmp/saimo_public_research_package.py
          python /tmp/saimo_public_research_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: saimo-intelligent-public-research-archives
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
