name: Recover Wuhan Fingu Eastmoney Report IDs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Scan historical Eastmoney report windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          import requests

          api='https://reportapi.eastmoney.com/report/list'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          windows=[
            ('2020-08-07','2020-08-14'),
            ('2020-10-28','2020-11-06'),
            ('2019-10-20','2019-11-02'),
            ('2019-04-01','2019-05-10'),
            ('2009-04-20','2009-05-05'),
          ]
          matches=[]
          for begin,end in windows:
            for fmt in ['hyphen','compact']:
              b=begin if fmt=='hyphen' else begin.replace('-','')
              e=end if fmt=='hyphen' else end.replace('-','')
              for page in range(1,80):
                params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
                  'ratingChange':'*','beginTime':b,'endTime':e,
                  'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'',
                  'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                  'cb':'',
                }
                r=s.get(api,params=params,timeout=(20,120)); r.raise_for_status()
                text=r.text.strip()
                if text.startswith('{'):
                  d=r.json()
                else:
                  m=re.search(r'\((\{.*\})\)\s*;?$',text,re.S)
                  if not m: raise RuntimeError('Unrecognized response: '+text[:200])
                  d=json.loads(m.group(1))
                rows=d.get('data') or []
                if page==1: print('WINDOW',begin,end,fmt,'HITS',d.get('hits'),'ROWS',len(rows))
                for x in rows:
                  blob=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode','researcher','orgName','orgSName'])
                  if ('武汉凡谷' in blob or str(x.get('stockCode') or '')=='002194' or
                      '专注基站射频三十年' in blob or '5G滤波器再塑发展新天地' in blob):
                    key=str(x.get('infoCode') or '')
                    item={'window':[begin,end,fmt],'row':x}
                    if not any(str(y['row'].get('infoCode') or '')==key and key for y in matches): matches.append(item)
                    print('MATCH',json.dumps(item,ensure_ascii=False,separators=(',',':')))
                if not rows or len(rows)<100: break
                time.sleep(.03)

          # Also try exact code with multiple date formats and omitted dates.
          code_variants=[
            {'code':'002194','beginTime':'2000-01-01','endTime':'2030-01-01'},
            {'code':'002194','beginTime':'20000101','endTime':'20300101'},
            {'code':'002194'},
          ]
          for idx,extra in enumerate(code_variants):
            p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
            p.update(extra)
            r=s.get(api,params=p,timeout=(20,120)); r.raise_for_status(); d=r.json(); rows=d.get('data') or []
            print('CODE_VARIANT',idx,'HITS',d.get('hits'),'ROWS',len(rows),'URL',r.url)
            for x in rows:
              print('CODE_ROW',json.dumps(x,ensure_ascii=False,separators=(',',':')))

          Path('out/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          # Probe/download every matched PDF mirror.
          for idx,item in enumerate(matches):
            x=item['row']; code=str(x.get('infoCode') or '')
            if not code: continue
            for prefix in ['H3','H2','H1','H4']:
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
              try:
                rr=s.get(url,timeout=(20,240),allow_redirects=True,headers={'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'})
                print('PDF',idx,prefix,rr.status_code,len(rr.content),rr.headers.get('content-type'),url,rr.content[:5])
                if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>30000:
                  Path(f'out/pdfs/{idx}_{prefix}_{code}.pdf').write_bytes(rr.content)
                  break
              except Exception as exc:
                print('PDF_ERROR',idx,prefix,repr(exc))
          PY
      - name: Upload recovery output
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-eastmoney-id-recovery
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
