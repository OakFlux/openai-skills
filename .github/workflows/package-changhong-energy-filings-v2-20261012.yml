name: Package verified Changhong Energy filings

on:
  pull_request:
    paths:
      - 'tasks/changhong-energy-filings-v2-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '长虹能源'
          FULL_NAME = '四川长虹新能源科技股份有限公司'
          CURRENT_CODE = '920239'
          HISTORICAL_CODE = '836239'
          AS_OF = '2026-10-12'

          docs = [
              {
                  'kind': 'prospectus',
                  'label': '公开发行说明书（正式版）',
                  'announcement_title': '长虹能源:公开发行说明书',
                  'announcement_date': '2021-01-21',
                  'info_code': 'AN202101211452953126',
                  'filename': '01_长虹能源_公开发行说明书_正式版.pdf',
                  'min_pages': 250,
              },
              {
                  'kind': 'annual', 'year': 2020,
                  'label': '2020年年度报告',
                  'announcement_title': '长虹能源:2020年年度报告',
                  'announcement_date': '2021-04-08',
                  'info_code': 'AN202104081482699972',
                  'filename': '02_长虹能源_2020年年度报告.pdf',
                  'min_pages': 100,
              },
              {
                  'kind': 'annual', 'year': 2021,
                  'label': '2021年年度报告',
                  'announcement_title': '长虹能源:2021年年度报告',
                  'announcement_date': '2022-04-22',
                  'info_code': 'AN202204221560863748',
                  'filename': '03_长虹能源_2021年年度报告.pdf',
                  'min_pages': 100,
              },
              {
                  'kind': 'annual', 'year': 2022,
                  'label': '2022年年度报告（更正后）',
                  'announcement_title': '长虹能源:2022年年度报告(更正后)',
                  'announcement_date': '2023-07-03',
                  'info_code': 'AN202307031591998708',
                  'filename': '04_长虹能源_2022年年度报告_更正后.pdf',
                  'min_pages': 100,
              },
              {
                  'kind': 'annual', 'year': 2023,
                  'label': '2023年年度报告',
                  'announcement_title': '长虹能源:2023年年度报告',
                  'announcement_date': '2024-04-24',
                  'info_code': 'AN202404241631129778',
                  'filename': '05_长虹能源_2023年年度报告.pdf',
                  'min_pages': 100,
              },
              {
                  'kind': 'annual', 'year': 2024,
                  'label': '2024年年度报告',
                  'announcement_title': '长虹能源:2024年年度报告',
                  'announcement_date': '2025-04-18',
                  'info_code': 'AN202504181658520480',
                  'filename': '06_长虹能源_2024年年度报告.pdf',
                  'min_pages': 100,
              },
              {
                  'kind': 'annual', 'year': 2025,
                  'label': '2025年年度报告',
                  'announcement_title': '长虹能源:2025年年度报告',
                  'announcement_date': '2026-04-27',
                  'info_code': 'AN202604271821646019',
                  'filename': '07_长虹能源_2025年年度报告.pdf',
                  'min_pages': 100,
              },
              {
                  'kind': 'quarter', 'year': 2026, 'quarter': 1,
                  'label': '2026年第一季度报告',
                  'announcement_title': '长虹能源:2026年一季度报告',
                  'announcement_date': '2026-04-27',
                  'info_code': 'AN202604271821646045',
                  'filename': '08_长虹能源_2026年第一季度报告.pdf',
                  'min_pages': 6,
              },
          ]

          OUT = Path('artifact_out')
          ROOT = Path('work')
          PACKAGE = ROOT / '长虹能源_920239.BJ_全部年报_招股说明书_最新季报'
          VERIFY = ROOT / 'verify'
          for path in (OUT, PACKAGE, VERIFY):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=6, connect=6, read=6, status=6, backoff_factor=1.0,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          records = []
          sha_lines = []
          for index, doc in enumerate(docs, start=1):
              dest = PACKAGE / doc['filename']
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H2_{doc["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{doc["info_code"]}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{doc["info_code"]}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{doc["info_code"]}_01.pdf',
              ]
              last_error = None
              source_url = None
              blob = None
              for url in urls:
                  try:
                      response = session.get(url, headers={'Accept': 'application/pdf,*/*;q=0.8'}, timeout=(30, 300))
                      print('DOWNLOAD', doc['label'], response.status_code, len(response.content), url, flush=True)
                      if response.status_code == 200 and response.content.startswith(b'%PDF') and len(response.content) > 100_000:
                          blob = response.content
                          source_url = url
                          break
                  except Exception as exc:
                      last_error = exc
                      print('DOWNLOAD_ERROR', doc['label'], url, repr(exc), flush=True)
              if blob is None or source_url is None:
                  raise RuntimeError(f'Unable to download {doc["label"]}: {last_error}')
              dest.write_bytes(blob)

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {doc["label"]}: {check.stderr[-1000:]}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'Page count too small for {doc["label"]}: {pages}')

              text_path = VERIFY / f'{index:02d}.txt'
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(30, pages)), str(dest), str(text_path)],
                  capture_output=True, text=True, check=False,
              )
              text = text_path.read_text(encoding='utf-8', errors='ignore') if text_path.exists() else ''
              compact = re.sub(r'\s+', '', text)
              identity_ok = COMPANY in compact or FULL_NAME in compact or CURRENT_CODE in compact or HISTORICAL_CODE in compact
              if doc['kind'] == 'prospectus':
                  type_ok = '公开发行说明书' in compact and ('精选层' in compact or '向不特定合格投资者' in compact or '公开发行股票' in compact)
              elif doc['kind'] == 'annual':
                  type_ok = str(doc['year']) in compact and '年度报告' in compact
              else:
                  type_ok = str(doc['year']) in compact and ('季度报告' in compact or '一季度报告' in compact)
              if not identity_ok or not type_ok:
                  raise RuntimeError(f'Identity/type validation failed for {doc["label"]}: identity={identity_ok}, type={type_ok}')

              first_prefix = VERIFY / f'{index:02d}_first'
              last_prefix = VERIFY / f'{index:02d}_last'
              first = subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '80', str(dest), str(first_prefix)], capture_output=True, text=True)
              last = subprocess.run(['pdftoppm', '-f', str(pages), '-l', str(pages), '-singlefile', '-png', '-r', '80', str(dest), str(last_prefix)], capture_output=True, text=True)
              first_png = Path(str(first_prefix) + '.png')
              last_png = Path(str(last_prefix) + '.png')
              if first.returncode != 0 or last.returncode != 0 or not first_png.exists() or not last_png.exists() or first_png.stat().st_size < 5000 or last_png.stat().st_size < 5000:
                  raise RuntimeError(f'Page rendering failed for {doc["label"]}')

              digest = hashlib.sha256(blob).hexdigest()
              record = {
                  **doc,
                  'pages': pages,
                  'bytes': len(blob),
                  'sha256': digest,
                  'source_pdf_url': source_url,
              }
              records.append(record)
              sha_lines.append(f'{digest}  {doc["filename"]}')
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 8:
              raise RuntimeError(f'Expected 8 PDFs, got {len(records)}')

          readme = [
              '# 长虹能源（920239.BJ，原代码836239）全部年报、公开发行说明书及最新季报',
              '',
              f'打包日期：{AS_OF}',
              '',
              '公司于2021年2月9日在全国股转系统精选层挂牌，后平移至北京证券交易所。资料包收录正式版《公开发行说明书》、2020—2025年六份完整年度报告（2022年采用更正后版本），以及截至打包日最新正式季报2026年第一季度报告。',
              '用户所称“招股说明书”在公司原公告中的正式文件名为《公开发行说明书》。',
              '已排除年报摘要、单独审计附件、公开发行说明书申报稿/报会稿/审议稿、半年报及说明公告。',
              '',
              '## 文件清单',
              '',
          ]
          for record in records:
              readme.append(f'- {record["filename"]}（{record["pages"]}页；公告日期 {record["announcement_date"]}；原公告标题：{record["announcement_title"]}）')
          readme += [
              '',
              '## 来源与校验',
              '',
              '文件来自上市公司公开披露公告镜像。已完成PDF文件头、公司身份、文件类型、实际页数、qpdf结构、首末页渲染和SHA-256校验。',
              '原始PDF地址、页数、文件大小和校验值见manifest.json；校验值另见SHA256SUMS.txt。',
          ]
          (PACKAGE / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (PACKAGE / 'manifest.json').write_text(json.dumps({
              'company': COMPANY,
              'full_name': FULL_NAME,
              'current_ticker': '920239.BJ',
              'historical_ticker': '836239',
              'listing_date': '2021-02-09',
              'package_date': AS_OF,
              'reports': records,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          (PACKAGE / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          chinese_zip = OUT / '长虹能源_920239.BJ_全部年报_招股说明书_最新季报.zip'
          with zipfile.ZipFile(chinese_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(PACKAGE.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{PACKAGE.name}/{path.relative_to(PACKAGE)}')
          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != 8:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          english_zip = OUT / 'Changhong_Energy_920239_All_Filings.zip'
          shutil.copy2(chinese_zip, english_zip)
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, hashlib.sha256(chinese_zip.read_bytes()).hexdigest(), flush=True)
          print('BACKUP_ZIP', english_zip, english_zip.stat().st_size, hashlib.sha256(english_zip.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: changhong-energy-filings-v2-artifact
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
