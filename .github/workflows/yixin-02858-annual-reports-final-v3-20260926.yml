name: Build robust Yixin Group annual reports package 20260926

on:
  push:
    paths:
      - '.github/workflows/yixin-02858-annual-reports-final-v3-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk zip curl

      - name: Download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='易鑫集团_02858_2020-2025年报及最新阶段性财务报告'
          mkdir -p "$PACKAGE/首页预览"
          cat > /tmp/docs.tsv <<'EOF'
01	2020年年度报告	2020年度	2021-04-01	https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0401/2021040103775_c.pdf
02	2021年年度报告	2021年度	2022-04-14	https://www1.hkexnews.hk/listedco/listconews/sehk/2022/0414/2022041400902_c.pdf
03	2022年年度报告	2022年度	2023-03-13	https://www1.hkexnews.hk/listedco/listconews/sehk/2023/0313/2023031300322_c.pdf
04	2023年年度报告	2023年度	2024-03-08	https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0308/2024030800776_c.pdf
05	2024年年度报告	2024年度	2025-03-13	https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0313/2025031300380_c.pdf
06	2025年年度报告	2025年度	2026-03-25	https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0325/2026032502020_c.pdf
07	2026年中期报告	截至2026年6月30日止六个月	2026-09-01	https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0901/2026090102626_c.pdf
08	2026年第一季度未经审核业务更新	2026年第一季度	2026-05-12	https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0512/2026051201235_c.pdf
EOF

          printf '%s\n' \
            '易鑫集团有限公司（02858.HK）2020—2025年年度报告及最新阶段性财务报告' \
            '整理日期：2026-09-26' '' \
            '本包全部文件均为香港交易所披露易官方PDF原件。' \
            '收录2020—2025年六份年度报告、2026年中期报告，并补充2026年第一季度未经审核业务更新。' \
            '香港上市公司通常以中期报告及自愿业务更新代替A股口径的一季报和三季报，因此两类最新文件同时保留。' '' \
            '文件清单：' > "$PACKAGE/00_文件清单与说明.txt"
          : > "$PACKAGE/SHA256SUMS.txt"
          printf '[\n' > "$PACKAGE/manifest.json"
          first_json=1

          while IFS=$'\t' read -r num title period release url; do
            file="$PACKAGE/${num}_${title}_港交所官方原件.pdf"
            echo "Downloading $title ..."
            ok=0
            for base in "$url" "${url/www1.hkexnews.hk/www.hkexnews.hk}"; do
              if curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 \
                -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
                -H 'Accept: application/pdf,*/*;q=0.8' \
                -H 'Referer: https://www1.hkexnews.hk/' \
                "$base" -o "$file.tmp"; then
                if [ "$(head -c 5 "$file.tmp")" = '%PDF-' ] && [ "$(stat -c%s "$file.tmp")" -gt 20000 ]; then
                  mv "$file.tmp" "$file"
                  ok=1
                  final_url="$base"
                  break
                fi
              fi
              rm -f "$file.tmp"
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "Failed: $title" >&2
              exit 1
            fi

            pages=$(pdfinfo "$file" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            if [ -z "$pages" ] || [ "$pages" -lt 1 ]; then
              echo "Invalid page count: $file" >&2
              exit 1
            fi
            qpdf --check "$file" > "$file.qpdf.txt" 2>&1 || true
            pdftoppm -f 1 -l 1 -png -r 120 -singlefile "$file" "$PACKAGE/首页预览/${num}_${title}" >/dev/null 2>&1
            preview="$PACKAGE/首页预览/${num}_${title}.png"
            if [ ! -s "$preview" ]; then
              echo "Preview failed: $file" >&2
              exit 1
            fi
            sha=$(sha256sum "$file" | awk '{print $1}')
            bytes=$(stat -c%s "$file")
            echo "$sha  $(basename "$file")" >> "$PACKAGE/SHA256SUMS.txt"
            {
              echo "${num#0}. $title"
              echo "   报告期：$period；披露日期：$release；页数：${pages}页；大小：${bytes}字节"
              echo "   港交所官方来源：$final_url"
              echo "   SHA-256：$sha"
              echo
            } >> "$PACKAGE/00_文件清单与说明.txt"

            [ "$first_json" -eq 1 ] || printf ',\n' >> "$PACKAGE/manifest.json"
            first_json=0
            python - "$num" "$title" "$period" "$release" "$final_url" "$(basename "$file")" "$pages" "$bytes" "$sha" <<'PY'
import json,sys
keys=['order','title','period','release_date','official_url','file','pages','bytes','sha256']
vals=sys.argv[1:]
obj=dict(zip(keys,vals))
obj['order']=int(obj['order'])
obj['pages']=int(obj['pages'])
obj['bytes']=int(obj['bytes'])
print(json.dumps(obj,ensure_ascii=False,indent=2),end='')
PY
            >> "$PACKAGE/manifest.json"
            sleep 1
          done < /tmp/docs.tsv
          printf '\n]\n' >> "$PACKAGE/manifest.json"
          echo '校验项目：PDF文件头、pdfinfo页数、qpdf结构检查记录、首页渲染、ZIP CRC及SHA-256。' >> "$PACKAGE/00_文件清单与说明.txt"

          # Remove verbose qpdf check logs from user package; the checks have already run.
          find "$PACKAGE" -name '*.qpdf.txt' -delete
          zip -q -r -6 "$PACKAGE.zip" "$PACKAGE"
          unzip -t "$PACKAGE.zip" >/tmp/ziptest.txt
          count=$(unzip -Z1 "$PACKAGE.zip" | grep -c '\.pdf$')
          [ "$count" -eq 8 ] || { echo "PDF count mismatch: $count" >&2; exit 1; }
          sha256sum "$PACKAGE.zip"
          du -h "$PACKAGE.zip"

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yixin-02858-annual-reports-final-v3
          path: 易鑫集团_02858_2020-2025年报及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
