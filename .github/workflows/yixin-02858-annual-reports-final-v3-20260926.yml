name: Build Fujia 603219 reports package

on:
  push:
    branches:
      - tmp-fujia-603219-reports-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf
      - name: Build package
        run: python3 tmp/fujia_603219_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Fujia-603219-annual-reports-prospectus-latest-quarterly-report
          path: 富佳股份_603219_年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
