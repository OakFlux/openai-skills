name: Temporary package Jindawei reports 20261015

on:
  push:
    paths:
      - '.github/workflows/yixin-02858-annual-reports-final-v3-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk zip curl

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='金达威_002626_2020-2025年报及2026年第一季度报告'
          mkdir -p "$PACKAGE/首页预览"

          cat > /tmp/docs.tsv <<'EOF'
01	2020年年度报告（更新后）	2020年度	2024-04-09	https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-09/9948590.PDF	https://www.kingdomway.com/assets/Reports/Upload/2020%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A.pdf
02	2021年年度报告（更新后）	2021年度	2024-04-09	https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-09/9948593.PDF	https://www.kingdomway.com/assets/Reports/Upload/2021%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A.pdf
03	2022年年度报告（更新后）	2022年度	2024-04-09	https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-09/9948592.PDF	https://stockn.xueqiu.com/SZ002626/20230419406315.pdf
04	2023年年度报告	2023年度	2024-04-30	https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-30/10168812.PDF	https://www.kingdomway.com/assets/Reports/Upload/2023%E5%B9%B4%E5%B9%B4%E5%BA%A6%E6%8A%A5%E5%91%8A%E5%85%A8%E6%96%87.pdf
05	2024年年度报告	2024年度	2025-04-10	https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-10/10856974.PDF	-
06	2025年年度报告	2025年度	2026-04-21	https://static.cninfo.com.cn/finalpage/2026-04-21/1225126689.PDF	https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-21/12120022.PDF
07	2026年第一季度报告（最新季报）	2026年第一季度	2026-04-30	https://static.cninfo.com.cn/finalpage/2026-04-30/1225255580.PDF	https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-30/12280985.PDF
EOF

          printf '%s\n' \
            '厦门金达威集团股份有限公司（002626.SZ）2020—2025年年度报告及最新季度报告' \
            '整理日期：2026-10-15' '' \
            '收录范围：2020—2025年六份年度报告，以及截至整理日最新已披露的2026年第一季度报告。' \
            '2020—2022年采用公司于2024年4月9日披露的更新后年度报告。' \
            'PDF来源优先采用巨潮资讯官方原件；部分历史报告采用公司官网或新浪财经公告附件镜像。' '' \
            '文件清单：' > "$PACKAGE/00_文件清单与说明.txt"
          : > "$PACKAGE/SHA256SUMS.txt"
          printf '[\n' > "$PACKAGE/manifest.json"
          first_json=1

          download_pdf() {
            local target="$1"
            shift
            local source
            for source in "$@"; do
              [ "$source" = '-' ] && continue
              echo "Trying $source"
              rm -f "$target.tmp"
              if curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
                --connect-timeout 30 --max-time 900 \
                -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
                -H 'Accept: application/pdf,*/*;q=0.8' \
                -H 'Referer: https://www.cninfo.com.cn/' \
                "$source" -o "$target.tmp"; then
                if [ "$(head -c 5 "$target.tmp" || true)" = '%PDF-' ] && [ "$(stat -c%s "$target.tmp")" -gt 50000 ]; then
                  mv "$target.tmp" "$target"
                  FINAL_URL="$source"
                  return 0
                fi
              fi
              rm -f "$target.tmp"
            done
            return 1
          }

          while IFS=$'\t' read -r num title period release url1 url2; do
            safe_title=$(printf '%s' "$title" | tr '（）' '()')
            file="$PACKAGE/${num}_${safe_title}.pdf"
            echo "Downloading $title ..."
            FINAL_URL=''
            if ! download_pdf "$file" "$url1" "$url2"; then
              echo "All sources failed: $title" >&2
              exit 1
            fi

            qpdf --check "$file" >/tmp/qpdf.txt 2>&1 || { cat /tmp/qpdf.txt >&2; exit 1; }
            pages=$(pdfinfo "$file" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            if [ -z "$pages" ] || [ "$pages" -lt 1 ]; then
              echo "Invalid page count: $file" >&2
              exit 1
            fi
            pdftotext -f 1 -l 5 "$file" /tmp/report.txt || true
            if ! grep -Eqi '金达威|KINGDOMWAY' /tmp/report.txt; then
              echo "Company-name validation failed: $file" >&2
              head -100 /tmp/report.txt >&2 || true
              exit 1
            fi
            pdftoppm -f 1 -l 1 -png -r 110 -singlefile "$file" "$PACKAGE/首页预览/${num}_${safe_title}" >/dev/null 2>&1
            preview="$PACKAGE/首页预览/${num}_${safe_title}.png"
            [ -s "$preview" ] || { echo "Preview failed: $file" >&2; exit 1; }

            sha=$(sha256sum "$file" | awk '{print $1}')
            bytes=$(stat -c%s "$file")
            echo "$sha  $(basename "$file")" >> "$PACKAGE/SHA256SUMS.txt"
            {
              echo "${num#0}. $title"
              echo "   报告期：$period；披露日期：$release；页数：${pages}页；大小：${bytes}字节"
              echo "   下载来源：$FINAL_URL"
              echo "   SHA-256：$sha"
              echo
            } >> "$PACKAGE/00_文件清单与说明.txt"

            [ "$first_json" -eq 1 ] || printf ',\n' >> "$PACKAGE/manifest.json"
            first_json=0
            python3 - "$num" "$title" "$period" "$release" "$FINAL_URL" "$(basename "$file")" "$pages" "$bytes" "$sha" <<'PY' >> "$PACKAGE/manifest.json"
import json, sys
keys = ['order','title','period','release_date','source_url','file','pages','bytes','sha256']
vals = sys.argv[1:]
obj = dict(zip(keys, vals))
obj['order'] = int(obj['order'])
obj['pages'] = int(obj['pages'])
obj['bytes'] = int(obj['bytes'])
print(json.dumps(obj, ensure_ascii=False, indent=2), end='')
PY
          done < /tmp/docs.tsv
          printf '\n]\n' >> "$PACKAGE/manifest.json"
          echo '校验项目：PDF文件头、文件大小、qpdf结构、pdfinfo页数、公司名称文本、首页渲染、ZIP完整性及SHA-256。' >> "$PACKAGE/00_文件清单与说明.txt"

          zip -q -r -6 "$PACKAGE.zip" "$PACKAGE"
          unzip -t "$PACKAGE.zip" >/tmp/ziptest.txt
          count=$(unzip -Z1 "$PACKAGE.zip" | grep -c '\.pdf$')
          [ "$count" -eq 7 ] || { echo "PDF count mismatch: $count" >&2; exit 1; }
          sha256sum "$PACKAGE.zip"
          unzip -l "$PACKAGE.zip"

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jindawei-002626-reports-final
          path: 金达威_002626_2020-2025年报及2026年第一季度报告.zip
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
