name: Inspect Yuheng 002437 Report APIs

on:
  push:
    branches:
      - tmp-yuheng-002437-broker-reports-20261004

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - name: Inspect API variants
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Referer':'https://data.eastmoney.com/report/'})
          codes=['002437','002437.SZ','SZ002437']
          for code in codes:
            payload={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2009-01-01','endTime':'2030-12-31','code':code,'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
            for mode in ('json','form'):
              try:
                r=s.post('https://reportapi.eastmoney.com/report/list2',json=payload if mode=='json' else None,data=payload if mode=='form' else None,timeout=30)
                print('\nPOST',mode,'code',code,'status',r.status_code,'len',len(r.content),'ctype',r.headers.get('content-type'))
                print(r.text[:5000])
              except Exception as e: print('ERR',mode,code,e)
            for qtype in ('0','1',''):
              params={'pageSize':100,'pageNo':1,'beginTime':'2009-01-01','endTime':'2030-12-31','code':code,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','rcode':''}
              if qtype: params['qType']=qtype
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=30)
                print('\nGET list qType',qtype or '(none)','code',code,'url',r.url,'status',r.status_code,'len',len(r.content))
                print(r.text[:5000])
              except Exception as e: print('ERR GET',qtype,code,e)
          PY
