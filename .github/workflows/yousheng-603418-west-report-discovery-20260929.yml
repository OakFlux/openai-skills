name: Discover West Securities Yousheng report PDF 20260929

on:
  push:
    paths:
      - '.github/workflows/yousheng-603418-west-report-discovery-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect report pages and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from html import unescape
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          urls=[
              'https://www.sgpjbg.com/baogao/1269661.html',
              'https://www.sgpjbg.com.cn/baogao/1320324.html',
              'https://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
              'http://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
          ]
          for url in urls:
              try:
                  r=s.get(url,headers={'Referer':'https://www.sgpjbg.com/' if 'sgpjbg' in url else 'https://stock.finance.sina.com.cn/'},timeout=(15,50),allow_redirects=True)
                  print('\nURL',url,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'CTYPE',r.headers.get('content-type'),'ENC',r.apparent_encoding,flush=True)
                  text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
                  print('HEAD',text[:1800].replace('\n',' '),flush=True)
                  for pat in [r'https?://[^"\'<> ]+\.pdf(?:\?[^"\'<> ]*)?', r'https?:\\/\\/[^"\'<> ]+\.pdf(?:\?[^"\'<> ]*)?', r'[^"\']*(?:download|down|pdf)[^"\']*']:
                      for m in re.finditer(pat,text,re.I):
                          print('MATCH',unescape(m.group(0))[:1000],flush=True)
                  for m in re.finditer(r'(?:href|src|data-url|data-src|url)\s*=\s*["\']([^"\']+)["\']',text,re.I):
                      raw=unescape(m.group(1)); full=urljoin(r.url,raw)
                      if any(k in full.lower() for k in ['pdf','download','down','file','attach','report','baogao']):
                          print('RESOURCE',full,flush=True)
              except Exception as e:
                  print('ERROR',url,repr(e),flush=True)

          # Probe common Sina report URL endpoints.
          for base in [
              'https://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
              'http://stock.finance.sina.com.cn/stock/view/paper.php?reportid=841577299931&symbol=sh603418',
          ]:
              for suffix in ['', '&download=1', '&type=pdf', '&url=1']:
                  url=base+suffix
                  try:
                      r=s.get(url,timeout=(15,50),allow_redirects=False,stream=True)
                      head=next(r.iter_content(64),b'')
                      print('PROBE',url,'STATUS',r.status_code,'LOC',r.headers.get('location'),'CTYPE',r.headers.get('content-type'),'CLEN',r.headers.get('content-length'),'HEAD',repr(head),flush=True)
                      r.close()
                  except Exception as e:
                      print('PROBE_ERROR',url,repr(e),flush=True)
          PY
