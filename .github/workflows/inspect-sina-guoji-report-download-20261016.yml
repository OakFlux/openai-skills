name: Inspect Sina Guoji report download 20261016
on:
  push:
    paths:
      - '.github/workflows/inspect-sina-guoji-report-download-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect download endpoint
        run: |
          python - <<'PY'
          import requests
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/810211900971/url',
            'http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/810211900971/url',
          ]
          for u in urls:
            try:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://stock.finance.sina.com.cn/'},timeout=30,allow_redirects=True)
              print('URL',u,'STATUS',r.status_code,'FINAL',r.url,'CTYPE',r.headers.get('content-type'),'LEN',len(r.content),'HEAD',repr(r.content[:100]))
              print('HISTORY',[(x.status_code,x.url,x.headers.get('location')) for x in r.history])
              print('HEADERS',dict(r.headers))
            except Exception as e: print('ERR',u,repr(e))
          PY
