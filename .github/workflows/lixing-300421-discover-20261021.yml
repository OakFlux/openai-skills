name: Discover Lixing 300421 broker reports 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-discover-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests
      - name: Query company research metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, time, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=300421'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          rows=[];seen=set()
          for page in range(1,31):
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2015-01-01','endTime':'2026-10-21','pageNo':str(page),'fields':'','qType':'0','orgCode':'','author':'','code':'300421','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              payload=None
              for attempt in range(5):
                  try:
                      r=s.get(endpoint,params=p,timeout=(20,120))
                      print('HTTP',page,r.status_code,len(r.content),r.url)
                      if r.status_code==200:
                          payload=r.json();break
                  except Exception as e: print('ERR',page,repr(e))
                  time.sleep(1+attempt)
              if payload is None:break
              data=payload.get('data') or []
              if isinstance(data,dict): data=data.get('list') or data.get('data') or []
              print('PAGE',page,'COUNT',len(data),'HITS',payload.get('hits'),'TOTALPAGE',payload.get('TotalPage'))
              if not data:break
              for row in data:
                  info=str(row.get('infoCode') or '')
                  if info and info not in seen:
                      seen.add(info);rows.append(row)
              if len(data)<100:break
          out=[]
          for r in rows:
              pages=int(float(r.get('attachPages') or 0));title=str(r.get('title') or '')
              item={k:r.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName']}
              item['likely_deep']=pages>=12 or any(x in title for x in ['深度','首次覆盖','投资价值','专题','公司研究'])
              item['exclude_short']=any(x in title for x in ['季报点评','年报点评','中报点评','半年报点评','事件点评','业绩点评','快报点评','调研简报'])
              out.append(item)
          out.sort(key=lambda x:(x['likely_deep'] and not x['exclude_short'],int(float(x.get('attachPages') or 0)),str(x.get('publishDate') or '')),reverse=True)
          print('TOTAL_ROWS',len(out))
          print('ALL_CANDIDATES',json.dumps(out,ensure_ascii=False,indent=2))
          PY
