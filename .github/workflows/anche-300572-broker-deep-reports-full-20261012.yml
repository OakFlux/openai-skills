name: Build Anche Technologies 300572 broker deep reports 20261012

on:
  push:
    paths:
      - '.github/workflows/anche-300572-broker-deep-reports-full-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download and package full reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='安车检测_300572_券商深度报告_完整版_2份'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'broker':'华金证券','date':'2023-10-09','analysts':'刘荆','rating':'增持',
              'title':'安车检测：设备+检测站运营双轮驱动，机动车检测龙头有望二次腾飞',
              'info_code':'AP202310091601098576','terms':['安车检测','设备','检测站运营','机动车检测龙头'],
              'filename':'01_华金证券_安车检测_设备加检测站运营双轮驱动机动车检测龙头有望二次腾飞_完整版_2023-10-09.pdf'
            },
            {
              'broker':'信达证券','date':'2020-05-20','analysts':'罗政','rating':'买入',
              'title':'安车检测深度报告：设备与服务双轮驱动，打造汽车检测综合服务龙头',
              'info_code':'AP202005201379986342','terms':['安车检测','设备与服务双轮驱动','汽车检测综合服务龙头'],
              'filename':'02_信达证券_安车检测_设备与服务双轮驱动打造汽车检测综合服务龙头_完整版_2020-05-20.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept-Language':'zh-CN,zh;q=0.9'
          })

          def download(url:str)->bytes:
            last=None
            for attempt in range(7):
              try:
                r=s.get(url,timeout=(25,180),allow_redirects=True,headers={
                  'User-Agent':s.headers['User-Agent'],
                  'Referer':'https://data.eastmoney.com/report/',
                  'Accept':'application/pdf,*/*;q=0.8'
                })
                last=(r.status_code,len(r.content),r.headers.get('content-type'))
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                  return r.content
              except Exception as e:
                last=repr(e)
              time.sleep(1+attempt)
            raise RuntimeError(f'download failed {url}: {last}')

          manifest=[]
          for r in reports:
            url=f"https://pdf.dfcfw.com/pdf/H3_{r['info_code']}_1.pdf"
            data=download(url)
            dest=root/r['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<15:
              raise RuntimeError(f'too few pages: {dest.name} {pages}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(12,pages)])
            compact=re.sub(r'\s+','',text)
            if not any(x in compact for x in ['安车检测','300572','深圳市安车检测']):
              raise RuntimeError(f'issuer mismatch: {dest.name}')
            matched=[t for t in r['terms'] if re.sub(r'\s+','',t) in compact]
            if not matched:
              raise RuntimeError(f'title-keyword mismatch: {dest.name}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError('preview failed')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **r,
              'source_report_page':f"https://data.eastmoney.com/report/info/{r['info_code']}.html",
              'pdf_url':url,
              'pages':pages,
              'bytes':len(data),
              'sha256':sha,
              'matched_terms':matched,
              'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商原始完整PDF',
              'validation':['PDF header','issuer identity','title keywords','page count','qpdf structure','first-page render']
            })

          readme=[
            '深圳市安车检测股份有限公司（300572.SZ）券商深度报告完整版资料包',
            '整理日期：2026-10-12',
            '',
            '本包收录2份公开可直接取得的券商原始完整PDF，不是预览页重制文件。',
            '公开研报索引中可直接下载的长篇公司深度报告数量较少，因此优先保留2份真正的长篇深度报告，未用短篇点评凑数。',
            ''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",
              ''
            ]
          readme += [
            '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、标题关键词、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2:
              raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          Path('anche_broker_reports_full.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: anche-300572-broker-deep-reports-full-final
          path: |
            安车检测_300572_券商深度报告_完整版_2份.zip
            anche_broker_reports_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
