name: Probe Wuhan Fingu Report 16990 Download 20261022

on:
  push:
    paths:
      - '.github/workflows/anche-300572-broker-deep-reports-full-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools and probe all known hosts
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils curl openssl
          mkdir -p out
          {
            echo '=== DNS ==='
            for h in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com static.sgpjbg.com file.sgpjbg.com img.sgpjbg.com; do
              echo "--- $h"; dig +short "$h" A; dig +short "$h" CNAME; getent ahostsv4 "$h" || true
            done
            echo '=== TLS ==='
            for h in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com; do
              echo "--- $h"; timeout 15 openssl s_client -connect "$h:443" -servername "$h" -brief </dev/null 2>&1 | head -40 || true
            done
          } | tee out/network.txt

          for scheme in https http; do
            for host in bg.sgpjbg.com www.sgpjbg.com sgpjbg.com; do
              for path in / /baogao/16990.html /bgdown/16990.html /download/16990.html /down/16990.html; do
                key=$(echo "${scheme}_${host}${path}" | tr '/.:' '____')
                echo "=== ${scheme}://${host}${path} ===" | tee -a out/network.txt
                curl -vkL --http1.1 --connect-timeout 15 --max-time 45 \
                  -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
                  -H 'Accept: text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.8' \
                  -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' \
                  -e "https://bg.sgpjbg.com/baogao/16990.html" \
                  -c out/cookies.txt -b out/cookies.txt \
                  -D "out/${key}.headers" -o "out/${key}.body" \
                  "${scheme}://${host}${path}" 2>"out/${key}.stderr" || true
                wc -c "out/${key}.body" 2>/dev/null | tee -a out/network.txt || true
                head -c 20 "out/${key}.body" 2>/dev/null | od -An -tx1 | tee -a out/network.txt || true
                sed -n '1,35p' "out/${key}.headers" 2>/dev/null | tee -a out/network.txt || true
                tail -25 "out/${key}.stderr" 2>/dev/null | tee -a out/network.txt || true
              done
            done
          done
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-16990-network-probe
          path: out
          retention-days: 7
          if-no-files-found: error
