name: Build Lianming 603006 broker reports package 20261028

on:
  push:
    paths:
      - '.github/workflows/anche-300572-broker-deep-reports-full-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          import urllib3
          from pypdf import PdfReader

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          PACKAGE = '联明股份_603006_券商深度与首次覆盖报告_完整版_2份_截至20261028'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / 'PDF原文'
          PREVIEW_DIR = ROOT / '首页预览'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker_expected':'国海证券',
                  'date':'2016-09-13',
                  'analysts':'冯胜；联系人：李欣雨',
                  'rating':'增持（首次覆盖）',
                  'title':'物流与汽车零部件业务协同发展带动业绩高速增长——联明股份动态研究',
                  'url':'https://img3.gelonghui.com/pdf201609/pdf20160914110949289.pdf',
                  'min_pages':8,
                  'terms':['联明股份','物流与汽车零部件业务协同发展','动态研究','首次覆盖'],
                  'filename_core':'物流与汽车零部件业务协同发展带动业绩高速增长_动态研究_2016-09-13',
              },
              {
                  'broker_expected':'',
                  'date':'2017-01-20',
                  'analysts':'以PDF首页为准',
                  'rating':'首次覆盖',
                  'title':'联明股份——经验丰富的车身零部件供应商',
                  'url':'https://img3.gelonghui.com/pdf201701/pdf20170120144724195.pdf',
                  'min_pages':12,
                  'terms':['联明股份','经验丰富的车身零部件供应商','首次覆盖','客户需求稳步上升'],
                  'filename_core':'经验丰富的车身零部件供应商_首次覆盖报告_2017-01-20',
              },
          ]

          broker_names = [
              '国海证券','安信证券','东北证券','中泰证券','东兴证券','民生证券','国金证券',
              '国联证券','海通证券','华创证券','招商证券','广发证券','申万宏源','中银国际',
              '西南证券','国信证券','中信建投','兴业证券','太平洋证券','长江证券','东吴证券',
              '华安证券','天风证券','东方证券','国泰君安','渤海证券','光大证券','方正证券',
              '国元证券','中投证券','中国中投证券','华泰证券','平安证券','中信证券','银河证券',
              '财富证券','上海证券','中原证券','新时代证券','首创证券','山西证券','西部证券',
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept':'application/pdf,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer':'https://www.gelonghui.com/',
          })

          def download(url: str) -> tuple[bytes, dict]:
              candidates = [url]
              if url.startswith('https://'):
                  candidates.append('http://' + url[len('https://'):])
              last = None
              for candidate in candidates:
                  for verify in (True, False):
                      for attempt in range(7):
                          try:
                              r = session.get(candidate, timeout=(30, 360), allow_redirects=True, verify=verify)
                              last = {
                                  'requested_url':candidate,
                                  'final_url':r.url,
                                  'status':r.status_code,
                                  'bytes':len(r.content),
                                  'content_type':r.headers.get('content-type',''),
                                  'verify_tls':verify,
                              }
                              if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 100_000:
                                  return r.content, last
                          except Exception as exc:
                              last = {'requested_url':candidate,'verify_tls':verify,'error':repr(exc)}
                          time.sleep(1 + attempt)
              raise RuntimeError(f'download failed {url}: {last}')

          def clean_filename(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              return re.sub(r'\s+', '', text).strip('._')

          manifest = []
          for index, report in enumerate(reports, 1):
              data, download_meta = download(report['url'])
              tmp = Path(f'_report_{index}.pdf')
              tmp.write_bytes(data)
              reader = PdfReader(str(tmp), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'too few pages for report {index}: {pages} < {report["min_pages"]}')

              text_parts = []
              for page in reader.pages[:min(15, pages)]:
                  try:
                      text_parts.append(page.extract_text() or '')
                  except Exception:
                      pass
              text = '\n'.join(text_parts)
              compact = re.sub(r'\s+', '', text)
              if not any(x in compact for x in ['联明股份','603006','上海联明机械股份有限公司']):
                  raise RuntimeError(f'issuer mismatch for report {index}')
              matched = [term for term in report['terms'] if re.sub(r'\s+','',term) in compact]
              if len(matched) < 2:
                  raise RuntimeError(f'title-keyword mismatch for report {index}: {matched}')

              broker = report['broker_expected'] or next((name for name in broker_names if name in compact), '券商机构未识别')
              if report['broker_expected'] and report['broker_expected'] not in compact:
                  raise RuntimeError(f'broker identity mismatch for report {index}: expected {report["broker_expected"]}')

              filename = f'{index:02d}_{clean_filename(broker)}_联明股份_{clean_filename(report["filename_core"])}.pdf'
              dest = PDF_DIR / filename
              tmp.replace(dest)

              subprocess.run(
                  ['qpdf','--warning-exit-0','--check',str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run([
                  'pdftoppm','-f','1','-l','1','-png','-r','145','-singlefile',str(dest),str(prefix)
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'preview render failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              first_page = ''
              try:
                  first_page = reader.pages[0].extract_text() or ''
              except Exception:
                  pass
              manifest.append({
                  **report,
                  'broker_detected':broker,
                  'filename':filename,
                  'pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'matched_terms':matched,
                  'download_meta':download_meta,
                  'preview_file':str(Path('首页预览') / preview.name),
                  'first_page_text_excerpt':first_page[:2500],
                  'document_nature':'券商原始完整PDF',
                  'validation':['PDF header','issuer identity','broker identity where specified','title keywords','minimum page count','qpdf structure','first-page render'],
              })

          readme = [
              '上海联明机械股份有限公司（603006.SH）券商深度与首次覆盖报告资料包',
              '整理基准日：2026-10-28',
              '',
              '公开研报索引对603006返回为空；经跨站检索，能够公开直接取得并完成全文核验的公司级深度/首次覆盖报告共2份。',
              '本包没有使用短篇年报点评、季报点评或行业报告凑数。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['broker_detected']}：《{item['title']}》",
                  f"   日期：{item['date']}；分析师：{item['analysts']}；评级：{item['rating']}",
                  f"   完整页数：{item['pages']}页；文件：PDF原文/{item['filename']}",
                  f"   原始公开链接：{item['url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商信息（可核验处）、标题关键词、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  PDF原文/{x['filename']}\n" for x in manifest), encoding='utf-8'
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != 2:
                  raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')

          short = Path('lianming_603006_broker_reports_2.zip')
          short.write_bytes(zip_path.read_bytes())
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: lianming-603006-broker-reports-final-20261028
          path: |
            联明股份_603006_券商深度与首次覆盖报告_完整版_2份_截至20261028.zip
            lianming_603006_broker_reports_2.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
