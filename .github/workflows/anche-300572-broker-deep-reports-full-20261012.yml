name: Build CosMX 688772 broker deep reports 20261016

on:
  push:
    paths:
      - '.github/workflows/anche-300572-broker-deep-reports-full-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package full reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='珠海冠宇_688772_券商深度报告_完整版_2份_截至20261016'
          root=Path(package); root.mkdir(exist_ok=True)
          pdf_dir=root/'PDF原文'; pdf_dir.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'broker':'开源证券','date':'2025-10-16','analysts':'陈蓉芳、殷晟路、仇方君','rating':'买入（维持）',
              'title':'珠海冠宇：消费电池龙头，打造AI终端高能量“心脏”——公司深度报告',
              'info_code':'AP202510161763271603','min_pages':20,
              'terms':['珠海冠宇','消费电池龙头','AI终端高能量','公司深度报告'],
              'filename':'01_开源证券_珠海冠宇_消费电池龙头打造AI终端高能量心脏_公司深度报告_2025-10-16.pdf'
            },
            {
              'broker':'东吴证券','date':'2024-06-29','analysts':'曾朵红、阮巧燕；研究助理：孙瀚博','rating':'买入（首次）',
              'title':'珠海冠宇：AI驱动消费锂电需求新周期，动力聚焦优质业务',
              'info_code':'AP202406301637063453','min_pages':30,
              'terms':['珠海冠宇','AI驱动消费锂电需求新周期','动力聚焦优质业务','公司深度研究'],
              'filename':'02_东吴证券_珠海冠宇_AI驱动消费锂电需求新周期动力聚焦优质业务_公司深度研究_2024-06-29.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept-Language':'zh-CN,zh;q=0.9'
          })

          def download(url:str)->bytes:
            last=None
            for attempt in range(7):
              try:
                r=s.get(url,timeout=(25,240),allow_redirects=True,headers={
                  'User-Agent':s.headers['User-Agent'],
                  'Referer':'https://data.eastmoney.com/report/',
                  'Accept':'application/pdf,*/*;q=0.8'
                })
                last=(r.status_code,len(r.content),r.headers.get('content-type'))
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                  return r.content
              except Exception as e:
                last=repr(e)
              time.sleep(1+attempt)
            raise RuntimeError(f'download failed {url}: {last}')

          manifest=[]
          for r in reports:
            url=f"https://pdf.dfcfw.com/pdf/H3_{r['info_code']}_1.pdf"
            data=download(url)
            dest=pdf_dir/r['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<r['min_pages']:
              raise RuntimeError(f'too few pages: {dest.name} {pages} < {r["min_pages"]}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(12,pages)])
            compact=re.sub(r'\s+','',text)
            if not any(x in compact for x in ['珠海冠宇','688772','珠海冠宇电池股份有限公司']):
              raise RuntimeError(f'issuer mismatch: {dest.name}')
            matched=[t for t in r['terms'] if re.sub(r'\s+','',t) in compact]
            if len(matched)<2:
              raise RuntimeError(f'title-keyword mismatch: {dest.name}; matched={matched}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError('preview failed: '+dest.name)
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **r,
              'source_report_page':f"https://data.eastmoney.com/report/info/{r['info_code']}.html",
              'pdf_url':url,
              'pages':pages,
              'bytes':len(data),
              'sha256':sha,
              'matched_terms':matched,
              'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商原始完整PDF',
              'validation':['PDF header','issuer identity','title keywords','minimum page count','qpdf structure','first-page render']
            })

          readme=[
            '珠海冠宇电池股份有限公司（688772.SH）券商深度报告完整版资料包',
            '整理基准日：2026-10-16',
            '',
            '本包收录2份可公开取得的券商原始完整PDF，均为长篇公司深度报告，不是网页预览或摘要重制文件。',
            '筛选原则：优先较新报告、不同券商、完整页数较长，并排除短篇业绩点评与普通快评。',
            ''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['pages']}页；文件：PDF原文/{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",
              ''
            ]
          readme += [
            '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、标题关键词、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  PDF原文/{x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2:
              raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          short=Path('cosmx_688772_broker_deep_reports_2.zip')
          short.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: cosmx-688772-broker-deep-reports-final-20261016
          path: |
            珠海冠宇_688772_券商深度报告_完整版_2份_截至20261016.zip
            cosmx_688772_broker_deep_reports_2.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
