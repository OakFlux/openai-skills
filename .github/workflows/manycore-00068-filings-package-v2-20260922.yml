name: Build Manycore 00068 filings package v2 20260922

on:
  push:
    paths:
      - '.github/workflows/manycore-00068-filings-package-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow

      - name: Download official HKEX filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '群核科技_00068_港股_招股说明书_2025年度资料_2026中期业绩'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          docs = [
              {
                  'filename': '01_群核科技_00068_最终招股说明书_中文版_2026-04-09.pdf',
                  'title': '群核科技最终招股说明书（中文版）',
                  'date': '2026-04-09',
                  'document_type': 'final_prospectus',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0409/2026040900026_c.pdf',
                  'min_bytes': 4_000_000,
                  'min_pages': 400,
              },
              {
                  'filename': '02_Manycore_Tech_00068_Final_Prospectus_English_2026-04-09.pdf',
                  'title': 'Manycore Tech final prospectus (English)',
                  'date': '2026-04-09',
                  'document_type': 'final_prospectus',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0409/2026040900025.pdf',
                  'min_bytes': 4_000_000,
                  'min_pages': 400,
              },
              {
                  'filename': '03_群核科技_00068_2025年度报告豁免公告_中文版_2026-04-30.pdf',
                  'title': '上市规则第13.46(2)条项下关于2025年年度报告的豁免（中文版）',
                  'date': '2026-04-30',
                  'document_type': 'annual_report_exemption',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0430/2026043004359_c.pdf',
                  'min_bytes': 40_000,
                  'min_pages': 2,
              },
              {
                  'filename': '04_Manycore_Tech_00068_2025_Annual_Report_Exemption_English_2026-04-30.pdf',
                  'title': 'Exemption under Rule 13.46(2) regarding the 2025 annual report (English)',
                  'date': '2026-04-30',
                  'document_type': 'annual_report_exemption',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0430/2026043004358.pdf',
                  'min_bytes': 40_000,
                  'min_pages': 2,
              },
              {
                  'filename': '05_群核科技_00068_2026年中期业绩公告_中文版_2026-08-27.pdf',
                  'title': '截至2026年6月30日止六个月中期业绩公告（中文版）',
                  'date': '2026-08-27',
                  'document_type': 'interim_results_announcement',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0827/2026082700657_c.pdf',
                  'min_bytes': 100_000,
                  'min_pages': 10,
              },
              {
                  'filename': '06_Manycore_Tech_00068_2026_Interim_Results_English_2026-08-27.pdf',
                  'title': 'Interim results announcement for the six months ended June 30, 2026 (English)',
                  'date': '2026-08-27',
                  'document_type': 'interim_results_announcement',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0827/2026082700656.pdf',
                  'min_bytes': 100_000,
                  'min_pages': 10,
              },
          ]

          def variants(url: str) -> list[str]:
              values = [url]
              if 'www1.hkexnews.hk' in url:
                  values.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  values.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(values))

          def download_pdf(doc: dict, destination: Path) -> str:
              errors: list[str] = []
              for url in variants(doc['url']):
                  for attempt in range(1, 5):
                      temporary = destination.with_suffix(destination.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 420), allow_redirects=True, stream=True) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temporary.open('wb') as handle:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          handle.write(chunk)
                          size = temporary.stat().st_size
                          with temporary.open('rb') as handle:
                              head = handle.read(8)
                          if size < doc['min_bytes'] or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response size={size}, head={head!r}')
                          temporary.replace(destination)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temporary.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {destination.name}: {errors}')

          def render_sample_pages(pdf_path: Path, page_count: int) -> list[int]:
              sample_pages = sorted(set([1, max(1, page_count // 2), page_count]))
              with tempfile.TemporaryDirectory(prefix='manycore-render-') as temp:
                  temp_dir = Path(temp)
                  for page_number in sample_pages:
                      prefix = temp_dir / f'p{page_number}'
                      result = subprocess.run(
                          ['pdftoppm', '-f', str(page_number), '-l', str(page_number), '-singlefile', '-r', '72', '-png', str(pdf_path), str(prefix)],
                          capture_output=True,
                          text=True,
                          timeout=180,
                      )
                      if result.returncode != 0:
                          raise RuntimeError(f'pdftoppm failed for {pdf_path.name} page {page_number}: {result.stderr[-1500:]}')
                      image_path = prefix.with_suffix('.png')
                      if not image_path.exists() or image_path.stat().st_size < 3_000:
                          raise RuntimeError(f'render output missing or too small: {pdf_path.name} page {page_number}')
                      with Image.open(image_path) as image:
                          image.verify()
                      with Image.open(image_path) as image:
                          width, height = image.size
                      if width < 300 or height < 300:
                          raise RuntimeError(f'render dimensions too small: {pdf_path.name} page {page_number} {width}x{height}')
              return sample_pages

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in docs:
              destination = out / doc['filename']
              final_url = download_pdf(doc, destination)
              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  raise RuntimeError(f'encrypted PDF not accepted: {destination.name}')
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {destination.name}: {pages}')

              extracted = ''
              for page in reader.pages[:min(25, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              lower = extracted.lower()
              if not any(term in lower for term in ('00068', 'manycore', '群核科技', '群核')):
                  raise RuntimeError(f'company identity could not be verified in {destination.name}')

              qpdf = subprocess.run(['qpdf', '--check', str(destination)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {destination.name}: {qpdf.stderr[-2000:]}')

              rendered_pages = render_sample_pages(destination, pages)
              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              seen_hashes.add(digest)

              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'document_type': doc['document_type'],
                  'disclosure_date': doc['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'render_checked_pages': rendered_pages,
                  'bytes': len(data),
                  'sha256': digest,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              'Manycore Tech Inc.（群核科技，00068.HK）港股披露文件资料包',
              '整理日期：2026-09-22',
              '',
              '收录范围：最终招股说明书、上市后全部年度报告相关文件，以及截至整理日最新阶段性财务披露。',
              '公司于2026年4月17日在香港联交所主板上市。',
              '公司依据香港上市规则第13.46(2)条注4获豁免另行编制、刊发及寄发截至2025年12月31日止年度的独立年度报告。2025年度财务资料及企业管治资料已载入2026年4月9日的最终招股说明书。因此，本包以“最终招股说明书 + 年报豁免公告”完整记录2025年度披露口径。',
              '截至2026年9月22日，港交所披露页尚未出现完整《2026年中期报告》；最新财务披露为2026年8月27日发布的截至2026年6月30日止六个月中期业绩公告。本包按其真实文件类型收录，不将其误标为季度报告或完整中期报告。',
              '最终招股说明书、年报豁免公告及中期业绩公告均收录中英文港交所官方PDF原件。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['title']}",
                  f"   文件：{record['filename']}",
                  f"   披露日期：{record['disclosure_date']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   抽样渲染核验页：{', '.join(str(page) for page in record['render_checked_pages'])}",
                  f"   来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、证券代码及公司身份、实际页数、非加密状态、qpdf结构检查、首/中/末页抽样渲染、文件去重、ZIP CRC及SHA-256校验。')

          (out / '00_文件清单与披露口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{record['sha256']}  {record['filename']}\n" for record in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 6:
                  raise RuntimeError(f'PDF count mismatch: {len(pdf_names)}')

          zip_digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdf_names), 'SHA256', zip_digest, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: manycore-00068-filings-final-v2
          path: 群核科技_00068_港股_招股说明书_2025年度资料_2026中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
