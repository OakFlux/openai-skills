name: Discover Dongbei Group and predecessor filings

on:
  push:
    paths:
      - '.github/workflows/dongbei-601956-discover-filings-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Query Eastmoney announcements
        run: |
          python - <<'PY'
          import json, re, time, requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          API='https://np-anotice-stock.eastmoney.com/api/security/ann'
          s=requests.Session()
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=.7,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/notices/','Accept':'application/json,text/plain,*/*'})

          all_rows=[]
          for code in ('601956','900956'):
            rows=[]
            for page in range(1,80):
              params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':code}
              r=s.get(API,params=params,timeout=60)
              print('GET',code,page,r.status_code,len(r.content),r.url)
              r.raise_for_status(); obj=r.json(); data=obj.get('data') or {}; part=data.get('list') or []
              if page==1: print('META',code,json.dumps({k:data.get(k) for k in ('page_index','page_size','total_hits','total_pages')},ensure_ascii=False))
              if not part: break
              rows.extend(part)
              oldest=min(str(x.get('notice_date') or x.get('display_time') or '9999')[:10] for x in part)
              print('PAGE',code,page,'rows',len(part),'acc',len(rows),'oldest',oldest)
              if oldest<'1998-01-01': break
              if data.get('total_hits') and len(rows)>=int(data.get('total_hits')): break
              time.sleep(.15)
            ded={str(x.get('art_code') or ''):x for x in rows if x.get('art_code')}
            rows=list(ded.values()); all_rows.extend(rows)
            print('CODE_TOTAL',code,len(rows))
            for x in sorted(rows,key=lambda z:str(z.get('notice_date') or z.get('display_time') or ''),reverse=True):
              title=str(x.get('title') or '')
              if any(k in title for k in ('年度报告','季度报告','招股说明书','换股吸收合并','上市公告书')):
                print('CANDIDATE',code,json.dumps({k:x.get(k) for k in ('art_code','title','notice_date','display_time','source_type')},ensure_ascii=False))
                art=str(x.get('art_code'))
                print('PDF_H2',f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf')
                print('PDF_H3',f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf')
          print('ALL_TOTAL',len(all_rows))
          PY
