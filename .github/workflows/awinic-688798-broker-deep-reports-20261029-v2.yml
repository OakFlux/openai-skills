name: Package Awinic 688798 broker deep reports v2

on:
  push:
    paths:
      - '.github/workflows/awinic-688798-broker-deep-reports-20261029-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, shutil, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import fitz, requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY='艾为电子'; FULL='上海艾为电子技术股份有限公司'; CODE='688798'; CUT='20261029'
          ROOT_NAME=f'{COMPANY}_{CODE}_券商深度报告_精选3份_截至{CUT}'
          ROOT=Path('work')/ROOT_NAME; PDFDIR=ROOT/'报告PDF'; PREV=ROOT/'首页预览'; DIST=Path('dist')
          for p in (PDFDIR,PREV,DIST): p.mkdir(parents=True,exist_ok=True)
          reports=[
            dict(filename='01_光大证券_2021-09-02_首次覆盖_针尖起梦舞世界艾为芯.pdf',url='https://pdf.dfcfw.com/pdf/H3_AP202109021513818326_1.pdf?1630602717000.pdf=',broker='光大证券',date='2021-09-02',title='针尖起梦舞，世界艾为芯',authors='刘凯',rating='买入（首次）',rtype='公司深度/首次覆盖',min_pages=50,max_pages=60),
            dict(filename='02_信达证券_2021-08-18_深度报告_音频功放IC设计龙头声光电射手五大产品齐开花.pdf',url='https://pdf.dfcfw.com/pdf/H3_AP202108191511008784_1.pdf',broker='信达证券',date='2021-08-18',title='音频功放IC设计龙头，声光电射手五大产品齐开花',authors='方竞、李少青',rating='增持',rtype='公司深度报告',min_pages=45,max_pages=55),
            dict(filename='03_国金证券_2021-08-10_深度报告_厚积薄发的手机芯片领域多面手.pdf',url='https://pdf.dfcfw.com/pdf/H3_AP202108111509361331_1.pdf',broker='国金证券',date='2021-08-10',title='厚积薄发的手机芯片领域多面手',authors='樊志远、刘妍雪、邓小路',rating='买入（首次）',rtype='公司深度研究',min_pages=35,max_pages=40),
          ]
          s=requests.Session(); retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=1,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry)); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':'https://data.eastmoney.com/report/'})
          def h(path):
            x=hashlib.sha256()
            with path.open('rb') as f:
              for c in iter(lambda:f.read(1024*1024),b''): x.update(c)
            return x.hexdigest()
          records=[]
          for r in reports:
            resp=s.get(r['url'],timeout=240,allow_redirects=True); print('DOWNLOAD',resp.status_code,len(resp.content),r['url'],resp.url); resp.raise_for_status()
            if len(resp.content)<100000 or not resp.content.startswith(b'%PDF'): raise RuntimeError('invalid PDF '+r['url'])
            dest=PDFDIR/r['filename']; dest.write_bytes(resp.content)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if not (r['min_pages']<=pages<=r['max_pages']): raise RuntimeError(f'page count out of range {dest} {pages}')
            doc=fitz.open(dest)
            if doc.page_count!=pages: raise RuntimeError('parser page mismatch')
            first=doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False); last=doc.load_page(pages-1).get_pixmap(matrix=fitz.Matrix(.8,.8),alpha=False)
            first.save(PREV/(dest.stem+'.png'))
            text=''.join(doc.load_page(i).get_text('text') for i in range(min(10,pages))); doc.close(); compact=re.sub(r'\s+','',text)
            if COMPANY not in compact and FULL not in compact and CODE not in compact: raise RuntimeError('company mismatch '+dest.name)
            if r['broker'].replace('证券','') not in compact and r['broker'] not in compact: raise RuntimeError('broker mismatch '+dest.name)
            rec={'broker':r['broker'],'date':r['date'],'title':r['title'],'authors':r['authors'],'rating':r['rating'],'report_type':r['rtype'],'source_url':r['url'],'resolved_url':resp.url,'relative_path':str(dest.relative_to(ROOT)).replace(os.sep,'/'),'file_name':dest.name,'file_size_bytes':dest.stat().st_size,'page_count':pages,'sha256':h(dest),'pdf_header_valid':True,'first_page_rendered':True,'last_page_rendered':True,'company_identity_validated':True,'broker_identity_validated':True}
            records.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False))
          manifest={'company':COMPANY,'full_company_name':FULL,'stock_code':CODE,'cutoff_date':'2026-10-29','document_count':3,'documents':records,'generated_at_utc':datetime.now(timezone.utc).isoformat()}
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records)+'\n',encoding='utf-8')
          lines=[f'# {COMPANY}（{CODE}）券商深度报告精选','', '- 共3份公司深度或首次覆盖报告。','- 已完成PDF文件头、页数、公司与券商身份、首末页渲染、SHA-256及ZIP CRC校验。','','## 文件清单','']
          for i,r in enumerate(records,1): lines += [f"{i}. `{r['relative_path']}`",f"   - {r['broker']}｜{r['date']}｜{r['report_type']}｜{r['rating']}",f"   - {r['title']}",f"   - 分析师：{r['authors']}；页数：{r['page_count']}",f"   - 来源：{r['source_url']}",f"   - SHA-256：`{r['sha256']}`"]
          (ROOT/'README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          cn=DIST/f'{ROOT_NAME}.zip'; en=DIST/f'awinic_688798_broker_deep_reports_3_{CUT}.zip'
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,str(p.relative_to(ROOT.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for p in (cn,en):
            with zipfile.ZipFile(p) as z:
              if z.testzip(): raise RuntimeError('ZIP CRC failure')
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('PDF count mismatch')
            print('ZIP_VERIFIED',p,p.stat().st_size,h(p))
          print('FINAL_JSON',json.dumps({'document_count':3,'total_pages':sum(r['page_count'] for r in records),'chinese_zip':str(cn),'english_zip':str(en),'chinese_zip_size':cn.stat().st_size,'chinese_zip_sha256':h(cn),'records':records},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: awinic-688798-broker-deep-reports-20261029-v2
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
