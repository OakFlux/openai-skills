name: Temporary Verify Tianshun Wind Energy Candidate Reports

on:
  push:
    branches:
      - tmp/tianshun-wind-reports-20260830
    paths:
      - .github/workflows/tmp-tianshun-wind-candidate-pages.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and inspect candidate PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io,json,time,requests
          from pathlib import Path
          from pypdf import PdfReader

          candidates = [
            ('AP202605091822095119','东吴证券','2026-05-09','2026年一季报点评：陆风历史包袱出清，静待国内外海工拐点'),
            ('AP202601041814746143','东吴证券','2026-01-04','短期承压，后续有望迎来修复拐点'),
            ('AP202409051639751433','中银证券','2024-09-05','陆上板块战略收缩，静候海工板块盈利修复'),
            ('AP202405141633055476','西南证券','2024-05-14','海工产能布局完善，出海有望提速'),
            ('AP202405071632550373','中银证券','2024-05-07','强化海工产能布局，积极拓展新业务领域'),
            ('AP202311071609226734','中银证券','2023-11-07','海工产能规划明确，积极迎接海风需求启动'),
            ('AP202311021607911214','国信证券','2023-11-02','海工盈利能力行业领先，导管架产能优势突出'),
            ('AP202309051597491028','太平洋','2023-09-05','陆塔&叶片盈利水平不断改善，海工业务快速发展'),
            ('AP202309031597465097','东吴证券','2023-09-03','Q2收购长风海工实现0-1，海陆双驱助量利增长'),
            ('AP202303271584565155','中邮证券','2023-03-27','加速海工产能布局，塔筒龙头加速成长'),
            ('AP202212041580799553','民生证券','2022-12-04','公司深度：将飞翼伏，以待东风'),
            ('AP202204141559198509','中银证券','2022-04-14','风塔产能扩张持续，风场资源储备深厚'),
            ('AP202108241512098596','西南证券','2021-08-24','公司产能扩张加速，风塔吨利润回升'),
            ('AP201809291204781964','广证恒生证券研究所','2018-09-29','深度报告：技改推升产能，叶片与发电业务贡献加大'),
            ('AP201809131194586376','新时代证券','2018-09-13','全球风塔龙头，受益于行业回暖，产业纵向延伸提高盈利能力'),
            ('AP201807121165809973','粤开证券','2018-07-12','公司深度研究：风塔吨利润有望反弹，新业务开展顺利'),
            ('AP201803301115300039','民生证券','2018-03-30','全球风塔优质供应商，有望受益行业改善'),
            ('AP201802231094094930','西南证券','2018-02-23','风塔龙头多点发力，业绩爆发势在必行'),
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/002531.html'})
          out=[]
          Path('out').mkdir(exist_ok=True)
          for code,broker,date,title in candidates:
            item={'code':code,'broker':broker,'date':date,'title':title}
            body=None;final='';err=''
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{int(time.time()*1000)}.pdf']:
              try:
                r=s.get(u,timeout=45,allow_redirects=True)
                if r.status_code==200 and r.content[:4]==b'%PDF':body=r.content;final=r.url;break
              except Exception as e:err=repr(e)
            if body:
              try:
                reader=PdfReader(io.BytesIO(body),strict=False)
                item.update({'ok':True,'pages':len(reader.pages),'bytes':len(body),'url':final})
                try:item['first']=(' '.join((reader.pages[0].extract_text() or '').split()))[:400]
                except Exception:item['first']=''
              except Exception as e:item.update({'ok':False,'error':'parse '+repr(e)})
            else:item.update({'ok':False,'error':err or 'download failed'})
            out.append(item);print('CANDIDATE='+json.dumps(item,ensure_ascii=False),flush=True)
          Path('out/candidate_pages.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianshun-candidate-pages
          path: out/candidate_pages.json
          retention-days: 3
