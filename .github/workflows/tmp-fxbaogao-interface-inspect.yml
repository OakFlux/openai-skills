name: Temporary fxbaogao public reader inspection

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-fxbaogao-interface-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect detail HTML, JavaScript and public image assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests, urllib.parse
          from pathlib import Path
          from PIL import Image
          import io

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          session=requests.Session(); session.headers.update({'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/json,*/*'})
          reports=[('5099547','2025/10/16'),('5138556','2025/11/06'),('5284768','2026/03/04')]
          needles=['report-image','pageCount','page_count','pageSize','pdfUrl','pdf_url','downloadUrl','download_url','fileUrl','file_url','oss','preview','reportId','report_id','pages','original']

          for rid,date in reports:
              url=f'https://www.fxbaogao.com/detail/{rid}'
              r=session.get(url,timeout=90,allow_redirects=True)
              print('\n=== DETAIL',rid,r.status_code,len(r.content),r.headers.get('content-type'),r.url,'===')
              text=r.text
              print('HEAD',text[:1000])
              for needle in needles:
                  hits=list(re.finditer(re.escape(needle),text,re.I))
                  print('NEEDLE',needle,'COUNT',len(hits))
                  for h in hits[:12]:
                      p=h.start(); print('CTX',needle,re.sub(r'\s+',' ',text[max(0,p-500):p+1800])[:2300])
              for pat in [
                  r'https?://[^\s"\'<>]+(?:\.pdf|\.png|\.jpg|\.jpeg|\.webp)(?:\?[^\s"\'<>]*)?',
                  r'https?://[^\s"\'<>]+(?:download|reader|preview|report|file|api)[^\s"\'<>]*',
                  r'/_next/static/[^\s"\'<>]+\.js',
                  r'<script[^>]+src=["\']([^"\']+)["\']',
              ]:
                  vals=re.findall(pat,text,re.I)
                  if vals:
                      print('PATTERN',pat,'COUNT',len(vals))
                      for value in sorted(set(vals))[:100]: print('MATCH',value[:2000])

              # Try likely image/page naming variations and report dimensions.
              candidates=[]
              for page in [0,1,2,3,18,28,37]:
                  bases=[
                      f'https://public.fxbaogao.com/report-image/{date}/{rid}-{page}.png',
                      f'https://public.fxbaogao.com/report-image/{date}/{rid}_{page}.png',
                      f'https://public.fxbaogao.com/report-image/{date}/{rid}/{page}.png',
                      f'https://public.fxbaogao.com/report-page/{date}/{rid}-{page}.png',
                      f'https://public.fxbaogao.com/report-page/{date}/{rid}/{page}.png',
                  ]
                  for base in bases:
                      for suffix in ['', '?x-oss-process=image/format,png', '?x-oss-process=image/crop,x_0,y_0,w_1980,h_2800/resize,p_60', '?x-oss-process=image/resize,w_1980/format,png']:
                          candidates.append(base+suffix)
              seen=set()
              for u in candidates:
                  if u in seen: continue
                  seen.add(u)
                  try:
                      x=requests.get(u,headers={'User-Agent':ua,'Referer':url,'Accept':'image/*,*/*'},timeout=30,allow_redirects=True)
                      if x.status_code==200 and len(x.content)>5000 and str(x.headers.get('content-type') or '').startswith('image/'):
                          try:
                              im=Image.open(io.BytesIO(x.content))
                              print('IMAGE_OK',u,'status',x.status_code,'bytes',len(x.content),'type',x.headers.get('content-type'),'size',im.size,'format',im.format)
                          except Exception as e:
                              print('IMAGE_BAD',u,len(x.content),repr(e))
                  except Exception as e: pass

              # Inspect JS bundles that mention the report id or reader/download APIs.
              scripts=[]
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I):
                  scripts.append(urllib.parse.urljoin(r.url,src))
              print('SCRIPTS',len(scripts))
              for jsurl in scripts:
                  try:
                      js=session.get(jsurl,timeout=60).text
                      if rid in js or any(n.lower() in js.lower() for n in ['report-image','downloadurl','pdfurl','pagecount','reader']):
                          print('JS_HIT',jsurl,'LEN',len(js))
                          for needle in [rid,'report-image','downloadUrl','pdfUrl','pageCount','page_count','reader','preview']:
                              for h in list(re.finditer(re.escape(needle),js,re.I))[:8]:
                                  p=h.start(); print('JS_CTX',needle,js[max(0,p-700):p+2200][:2900])
                  except Exception as e: print('JS_ERR',jsurl,repr(e))
          PY
