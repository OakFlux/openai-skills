name: Build Yueyang Xingchang 000819 broker deep reports 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-000819-broker-deep-reports-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import re
          import subprocess
          import time
          import zipfile
          from datetime import datetime
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = '000819'
          SHORT = '岳阳兴长'
          FULL = '岳阳兴长石化股份有限公司'
          PACKAGE = '岳阳兴长_000819_券商深度研究报告_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          session.headers.update({
              'User-Agent': ua,
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:120]

          def parse_json_or_jsonp(text: str) -> dict[str, Any]:
              text = text.strip().lstrip('\ufeff')
              if text.startswith('{'):
                  return json.loads(text)
              match = re.search(r'^[^(]+\((.*)\)\s*;?\s*$', text, re.S)
              if not match:
                  raise ValueError(f'Unexpected API payload prefix: {text[:180]!r}')
              return json.loads(match.group(1))

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          all_rows: list[dict[str, Any]] = []
          for page_no in range(1, 8):
              params = {
                  'industryCode': '*',
                  'pageSize': '100',
                  'industry': '*',
                  'rating': '*',
                  'ratingChange': '*',
                  'beginTime': '2010-01-01',
                  'endTime': '2026-11-04',
                  'pageNo': str(page_no),
                  'fields': '',
                  'qType': '0',
                  'orgCode': '',
                  'rcode': '',
                  'code': CODE,
                  'cb': f'datatable000819{page_no}',
                  '_': str(int(time.time() * 1000)),
              }
              response = session.get(endpoint, params=params, timeout=(30, 180))
              print('REPORT_API', page_no, response.status_code, len(response.content), response.url)
              response.raise_for_status()
              payload = parse_json_or_jsonp(response.text)
              rows = payload.get('data') or []
              all_rows.extend(rows)
              hits = int(payload.get('hits') or len(all_rows))
              if not rows or len(all_rows) >= hits or len(rows) < 100:
                  break

          if not all_rows:
              raise RuntimeError('Eastmoney report API returned no records for 000819')

          api_snapshot = []
          for row in all_rows:
              api_snapshot.append({
                  'title': row.get('title'),
                  'broker': row.get('orgSName') or row.get('orgName'),
                  'publishDate': row.get('publishDate'),
                  'infoCode': row.get('infoCode') or row.get('infocode'),
                  'authors': row.get('researcher') or row.get('author'),
                  'rating': row.get('emRatingName') or row.get('ratingName'),
                  'ratingChange': row.get('ratingChange'),
                  'raw_keys': sorted(row.keys()),
              })
          (ROOT / 'report_api_results.json').write_text(
              json.dumps(api_snapshot, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('REPORT_API_COUNT', len(api_snapshot))
          print('REPORT_API_TITLES', json.dumps(api_snapshot, ensure_ascii=False))

          # Preference order: a true long-form deep report first, then first-coverage/systematic company research.
          target_specs = [
              {
                  'key': 'guolian_20221031',
                  'title_fragments': ['炼化精细化工龙头', '特种聚丙烯'],
                  'broker_fragments': ['国联证券'],
                  'classification': '公司深度研究／首次覆盖',
                  'min_pages': 18,
                  'priority': 500,
              },
              {
                  'key': 'southwest_20150415',
                  'title_fragments': ['内外兼修', '蓄势待发'],
                  'broker_fragments': ['西南证券'],
                  'classification': '公司研究',
                  'min_pages': 8,
                  'priority': 440,
              },
              {
                  'key': 'china_post_20220916',
                  'title_fragments': ['业绩符合预期', '高端聚烯烃项目明年投产'],
                  'broker_fragments': ['中邮证券'],
                  'classification': '公司首次覆盖',
                  'min_pages': 3,
                  'priority': 400,
              },
              {
                  'key': 'guolian_20230625',
                  'title_fragments': ['惠州项目即将投产', '茂金属催化剂平台持续成长'],
                  'broker_fragments': ['国联证券'],
                  'classification': '公司跟踪研究',
                  'min_pages': 3,
                  'priority': 340,
              },
              {
                  'key': 'southwest_20150826',
                  'title_fragments': ['否极泰来', '主营业绩底部反转'],
                  'broker_fragments': ['西南证券'],
                  'classification': '公司研究',
                  'min_pages': 8,
                  'priority': 320,
              },
          ]

          def row_date(row: dict[str, Any]) -> datetime:
              value = str(row.get('publishDate') or '')[:10]
              try:
                  return datetime.strptime(value, '%Y-%m-%d')
              except Exception:
                  return datetime(1900, 1, 1)

          selected_meta: list[tuple[dict[str, Any], dict[str, Any]]] = []
          used_codes: set[str] = set()
          for spec in target_specs:
              matches = []
              for row in all_rows:
                  title_norm = normalize(str(row.get('title') or ''))
                  broker_norm = normalize(str(row.get('orgSName') or row.get('orgName') or ''))
                  info_code = str(row.get('infoCode') or row.get('infocode') or '').strip()
                  if not info_code:
                      continue
                  title_ok = all(normalize(fragment) in title_norm for fragment in spec['title_fragments'])
                  broker_ok = any(normalize(fragment) in broker_norm for fragment in spec['broker_fragments'])
                  if title_ok and broker_ok:
                      matches.append(row)
              matches.sort(key=row_date, reverse=True)
              chosen = next(
                  (row for row in matches if str(row.get('infoCode') or row.get('infocode')) not in used_codes),
                  None,
              )
              if chosen is None:
                  print('TARGET_NOT_FOUND', spec['key'])
                  continue
              info_code = str(chosen.get('infoCode') or chosen.get('infocode'))
              used_codes.add(info_code)
              selected_meta.append((spec, chosen))
              print('SELECTED_META', spec['key'], json.dumps({
                  'title': chosen.get('title'),
                  'broker': chosen.get('orgSName') or chosen.get('orgName'),
                  'publishDate': chosen.get('publishDate'),
                  'infoCode': info_code,
              }, ensure_ascii=False))

          # If named targets are insufficient, add other non-commentary company research candidates.
          if len(selected_meta) < 3:
              fallback_rows = []
              for row in all_rows:
                  info_code = str(row.get('infoCode') or row.get('infocode') or '').strip()
                  if not info_code or info_code in used_codes:
                      continue
                  title = str(row.get('title') or '')
                  title_norm = normalize(title)
                  broker = str(row.get('orgSName') or row.get('orgName') or '')
                  score = 0
                  if '深度' in title:
                      score += 180
                  if '首次覆盖' in title:
                      score += 150
                  if '投资价值' in title:
                      score += 130
                  if any(token in title for token in ('龙头', '成长空间', '蓄势待发', '产业化')):
                      score += 80
                  if any(token in title for token in ('点评', '季报', '中报', '年报', '业绩预告')):
                      score -= 180
                  date_score = max(0, row_date(row).year - 2010)
                  score += date_score
                  if score > 0:
                      fallback_rows.append((score, row))
              fallback_rows.sort(key=lambda item: (item[0], row_date(item[1])), reverse=True)
              for score, row in fallback_rows:
                  if len(selected_meta) >= 5:
                      break
                  info_code = str(row.get('infoCode') or row.get('infocode'))
                  if info_code in used_codes:
                      continue
                  spec = {
                      'key': f'fallback_{info_code}',
                      'title_fragments': [str(row.get('title') or '')],
                      'broker_fragments': [str(row.get('orgSName') or row.get('orgName') or '')],
                      'classification': '公司系统性研究',
                      'min_pages': 3,
                      'priority': 100 + score,
                  }
                  selected_meta.append((spec, row))
                  used_codes.add(info_code)
                  print('SELECTED_FALLBACK', score, info_code, row.get('title'))

          manual_fallback_urls = {
              '惠州项目即将投产，茂金属催化剂平台持续成长': [
                  'https://file.iyanbao.com/pdf/e0e5c-18eefe2a-5daa-4a7e-90d5-97ed2704e72a.pdf',
              ],
              '业绩符合预期，高端聚烯烃项目明年投产': [
                  'https://pdf.dfcfw.com/pdf/H3_AP202209181578487364_1.pdf',
              ],
          }

          downloaded: list[dict[str, Any]] = []
          identities = (SHORT, FULL, CODE, '岳阳兴长石化', 'YUEYANG XINGCHANG')

          for spec, row in selected_meta:
              title = str(row.get('title') or '').strip()
              broker = str(row.get('orgSName') or row.get('orgName') or '').strip()
              date = str(row.get('publishDate') or '')[:10]
              authors = str(row.get('researcher') or row.get('author') or '').strip()
              rating = str(row.get('emRatingName') or row.get('ratingName') or '').strip()
              info_code = str(row.get('infoCode') or row.get('infocode')).strip()
              source_page = f'https://data.eastmoney.com/report/info/{info_code}.html'

              pdf_urls = []
              for key, value in row.items():
                  if isinstance(value, str) and '.pdf' in value.lower():
                      pdf_urls.append(value)
              pdf_urls.extend([
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf?download=1',
              ])
              for manual_title, urls in manual_fallback_urls.items():
                  if normalize(manual_title) in normalize(title) or normalize(title) in normalize(manual_title):
                      pdf_urls.extend(urls)
              pdf_urls = list(dict.fromkeys(url for url in pdf_urls if url))

              data = None
              source_url = ''
              attempts = []
              pages = 0
              extracted = ''
              for pdf_url in pdf_urls:
                  for attempt in range(4):
                      try:
                          referer = 'https://data.eastmoney.com/report/'
                          if 'iyanbao.com' in pdf_url:
                              referer = 'https://www.iyanbao.com/'
                          response = session.get(
                              pdf_url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 420),
                              allow_redirects=True,
                          )
                          attempt_record = {
                              'url': pdf_url,
                              'attempt': attempt + 1,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          attempts.append(attempt_record)
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 80000:
                              reader = PdfReader(io.BytesIO(response.content), strict=False)
                              candidate_pages = len(reader.pages)
                              if candidate_pages < int(spec['min_pages']):
                                  attempt_record['validation_error'] = f'only {candidate_pages} pages'
                                  break
                              candidate_text = ''
                              for page in reader.pages[:min(60, candidate_pages)]:
                                  try:
                                      candidate_text += '\n' + (page.extract_text() or '')
                                  except Exception:
                                      pass
                              compact = normalize(candidate_text)
                              identity_hits = [token for token in identities if normalize(token) in compact]
                              title_hits = [fragment for fragment in spec['title_fragments'] if normalize(fragment) in compact]
                              broker_hits = [fragment for fragment in spec['broker_fragments'] if normalize(fragment) in compact]
                              if len(compact) > 1000 and not identity_hits:
                                  attempt_record['validation_error'] = 'issuer mismatch'
                                  break
                              # Metadata confirms title/broker; extracted text checks independently where encoding permits.
                              data = response.content
                              source_url = pdf_url
                              pages = candidate_pages
                              extracted = candidate_text
                              break
                          if response.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': pdf_url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break

              if data is None:
                  print('SKIP_UNDOWNLOADABLE', title, json.dumps(attempts, ensure_ascii=False))
                  continue

              compact = normalize(extracted)
              identity_hits = [token for token in identities if normalize(token) in compact]
              title_hits = [fragment for fragment in spec['title_fragments'] if normalize(fragment) in compact]
              broker_hits = [fragment for fragment in spec['broker_fragments'] if normalize(fragment) in compact]
              score = int(spec['priority']) + min(pages, 60)
              if pages >= 20:
                  score += 50
              elif pages >= 10:
                  score += 25

              downloaded.append({
                  'score': score,
                  'broker': broker,
                  'date': date,
                  'title': title,
                  'classification': spec['classification'],
                  'authors': authors,
                  'rating': rating,
                  'infoCode': info_code,
                  'source_page': source_page,
                  'source_url': source_url,
                  'candidate_urls': pdf_urls,
                  'actual_pages': pages,
                  'bytes': len(data),
                  'data': data,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hits': title_hits,
                  'download_attempts': attempts,
              })
              print('DOWNLOADED', score, broker, title, pages, len(data), source_url)

          if len(downloaded) < 2:
              raise RuntimeError(f'Only {len(downloaded)} qualifying reports could be downloaded')

          downloaded.sort(key=lambda item: (item['score'], item['actual_pages']), reverse=True)
          chosen_reports = downloaded[:3]
          manifest = []

          for index, item in enumerate(chosen_reports, 1):
              filename = f"{index:02d}_{safe(item['broker'])}_岳阳兴长_{safe(item['title'])}_{item['date']}.pdf"
              destination = PDFDIR / filename
              destination.write_bytes(item['data'])

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREV / destination.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed for {filename}')

              sha256 = hashlib.sha256(item['data']).hexdigest()
              record = {key: value for key, value in item.items() if key not in ('data', 'score')}
              record.update({
                  'filename': str(Path('原始PDF') / filename),
                  'sha256': sha256,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'validation': [
                      'PDF header', 'Eastmoney report metadata', 'issuer identity where extractable',
                      'page count', 'qpdf structure', 'first-page render',
                  ],
              })
              manifest.append(record)
              print('VERIFIED', item['broker'], item['title'], item['actual_pages'], sha256)

          total_pages = sum(item['actual_pages'] for item in manifest)
          readme = [
              '岳阳兴长石化股份有限公司（000819.SZ）券商深度研究报告资料包',
              '整理日期：2026-11-04', '',
              f'本包收录{len(manifest)}份公开可直接取得并完成完整性核验的券商原始PDF。',
              '筛选口径：优先公司深度、首次覆盖或系统性公司研究；普通财报点评、行业周报和网页摘要不纳入。', '',
          ]
          for position, item in enumerate(manifest, 1):
              readme += [
                  f'{position}. {item["broker"]}：《{item["title"]}》',
                  f'   类型：{item["classification"]}；日期：{item["date"]}',
                  f'   分析师：{item["authors"] or "原PDF详见首页"}；评级：{item["rating"] or "原PDF详见首页"}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_page"]}',
                  f'   PDF来源：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、研报元数据、公司/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')

          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad_member = archive.testzip()
              pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_member or len(pdf_members) != len(manifest):
                  raise RuntimeError(
                      f'ZIP validation failed: bad={bad_member}, pdf_count={len(pdf_members)}, manifest={len(manifest)}'
                  )

          english_zip = Path('yueyang_xingchang_000819_broker_deep_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          final_sha = hashlib.sha256(chinese_zip.read_bytes()).hexdigest()
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', final_sha)
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: yueyang-xingchang-000819-broker-deep-reports-final
          path: |
            岳阳兴长_000819_券商深度研究报告_3份.zip
            yueyang_xingchang_000819_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
