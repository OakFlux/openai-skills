name: Temporary Aixin Reportify API probe

on:
  push:
    branches:
      - tmp-aixin-reportify-api-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect public APIs and frontend bundles
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Accept':'application/json,text/plain,*/*',
            'Referer':'https://reportify.cn/'
          })
          reports={
            'guosheng':('1278761946887360512','831126939078626'),
            'guotai':('1262379005902983168','815124656831714'),
            'zhongyou':('1246890949045522432','799998146746487'),
          }
          all_scripts=set()
          page_meta={}
          for key,(rid,did) in reports.items():
            url=f'https://reportify.cn/reports/{rid}'
            r=s.get(url,timeout=90)
            print('REPORT_PAGE',key,r.status_code,len(r.content),flush=True)
            (out/f'{key}_report_page.html').write_bytes(r.content)
            soup=BeautifulSoup(r.text,'html.parser')
            scripts=[]
            for tag in soup.find_all('script'):
              src=tag.get('src')
              if src:
                full=urljoin(r.url,src)
                scripts.append(full); all_scripts.add(full)
            page_meta[key]={'rid':rid,'did':did,'scripts':scripts}
          # Fetch all JS bundles loaded by the report page and extract API/path-like literals.
          js_findings=[]
          for i,url in enumerate(sorted(all_scripts),1):
            try:
              r=s.get(url,timeout=120)
              print('JS',i,len(all_scripts),r.status_code,len(r.content),url,flush=True)
              if r.status_code!=200 or len(r.content)<100: continue
              text=r.text
              name=f'js_{i:03d}.js'
              (out/name).write_text(text,encoding='utf-8',errors='ignore')
              # Capture strings likely related to reports/documents/files/download/view pages.
              strings=set()
              for m in re.finditer(r'["\']([^"\']{1,400})["\']',text):
                val=m.group(1)
                low=val.lower()
                if any(k in low for k in ['/reports','/documents','/document','/files','download','url_pdf','content_url','preview','page_image','page-image','pdf','render_type','document_id']):
                  strings.add(val)
              js_findings.append({'url':url,'file':name,'strings':sorted(strings)[:5000]})
            except Exception as e:
              js_findings.append({'url':url,'error':repr(e)})
              print('JS_ERR',url,repr(e),flush=True)
          (out/'js_findings.json').write_text(json.dumps(js_findings,ensure_ascii=False,indent=2),encoding='utf-8')

          api_results=[]
          api_base='https://api.reportify.cn'
          for key,(rid,did) in reports.items():
            paths=[
              f'/reports/{rid}',
              f'/reports/{rid}/analysis',
              f'/reports/{rid}/space',
              f'/reports/{rid}/document',
              f'/reports/{rid}/documents',
              f'/reports/{rid}/content',
              f'/reports/{rid}/download',
              f'/reports/{rid}/pdf',
              f'/documents/{did}',
              f'/documents/{did}/content',
              f'/documents/{did}/pages',
              f'/documents/{did}/images',
              f'/documents/{did}/download',
              f'/documents/{did}/file',
              f'/documents/{did}/url',
              f'/documents/{did}/pdf',
              f'/document/{did}',
              f'/document/{did}/content',
              f'/document/{did}/pages',
              f'/document/{did}/download',
              f'/files/{did}',
              f'/files/{did}/download',
            ]
            for path in paths:
              url=api_base+path
              try:
                r=s.get(url,headers={'Referer':f'https://reportify.cn/reports/{rid}'},timeout=60,allow_redirects=False)
                ct=r.headers.get('content-type','')
                body=r.content[:250000]
                row={'key':key,'rid':rid,'did':did,'path':path,'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':ct,'location':r.headers.get('location')}
                if 'json' in ct or body.lstrip().startswith((b'{',b'[')):
                  try: row['json']=r.json()
                  except Exception: row['text']=body.decode('utf-8','replace')
                else:
                  row['head_hex']=body[:64].hex(); row['text']=body.decode('utf-8','replace')[:3000]
                api_results.append(row)
                print('API',key,r.status_code,len(r.content),ct,path,flush=True)
              except Exception as e:
                api_results.append({'key':key,'rid':rid,'did':did,'path':path,'url':url,'error':repr(e)})
                print('API_ERR',key,path,repr(e),flush=True)
          (out/'api_results.json').write_text(json.dumps(api_results,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'page_meta.json').write_text(json.dumps(page_meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DONE scripts',len(all_scripts),'api_calls',len(api_results),flush=True)
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: aixin-reportify-api-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
