name: Probe Qingbaoyuan Super Hi report download 20260927

on:
  push:
    paths:
      - '.github/workflows/qingbaoyuan-superhi-download-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe page and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, json
          from urllib.parse import urljoin
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=['https://m.qingbaoyuan.vip/doc/45737/','https://www.qingbaoyuan.vip/doc/45737/']
          for u in urls:
            print('\n===',u,'===',flush=True)
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),flush=True)
              r.raise_for_status(); r.encoding=r.apparent_encoding or 'utf-8'; t=r.text
              print('COOKIES',s.cookies.get_dict(),flush=True)
              print('TEXT_HEAD',t[:3000],flush=True)
              for kw in ['download','下载','45737','file','pdf','pay','order','docid','doc_id','resource']:
                print('\nKEYWORD',kw,flush=True)
                for m in list(re.finditer(kw,t,re.I))[:20]:
                  a=max(0,m.start()-300); b=min(len(t),m.end()+500)
                  print(t[a:b].replace('\n',' ')[:1000],flush=True)
              scripts=[]
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):
                su=urljoin(r.url,src)
                if su not in scripts: scripts.append(su)
              print('SCRIPTS',json.dumps(scripts,ensure_ascii=False),flush=True)
              for su in scripts:
                try:
                  rr=s.get(su,timeout=(15,60)); print('\nSCRIPT',su,rr.status_code,len(rr.content),flush=True)
                  if rr.status_code!=200 or len(rr.content)>3000000: continue
                  rr.encoding=rr.apparent_encoding or 'utf-8'; st=rr.text
                  if any(k in st.lower() for k in ['download','docid','fileurl','/pay','/order']):
                    for kw in ['download','docid','fileurl','pay','order','45737']:
                      for m in list(re.finditer(kw,st,re.I))[:20]:
                        a=max(0,m.start()-300); b=min(len(st),m.end()+500)
                        print('SCRIPT_SNIP',kw,st[a:b].replace('\n',' ')[:1200],flush=True)
                except Exception as e: print('SCRIPT_ERR',su,repr(e),flush=True)
            except Exception as e: print('PAGE_ERR',repr(e),flush=True)
          PY
