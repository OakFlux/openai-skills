name: Inspect public Hibor report reader
on:
  push:
    branches:
      - tmp-chinahongqiao-hibor-reader-20260908
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Playwright
        run: python -m pip install --quiet playwright
      - name: Inspect reader and direct files
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import hashlib, json, re, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          urls=[
            'https://www.hibor.com.cn/data/8097a0a927336a561dda01052f71adbe.html',
            'https://wap.hibor.com.cn/data/8097a0a927336a561dda01052f71adbe.html'
          ]
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          out={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',locale='zh-CN',accept_downloads=True,viewport={'width':1440,'height':1100})
            for i,url in enumerate(urls):
              page=ctx.new_page()
              rec={'requested_url':url,'requests':[],'responses':[],'downloads':[],'popups':[]}
              def on_req(req,rec=rec):
                if re.search(r'pdf|download|file|data|checkmd5|img|report|api|oss|cdn',req.url,re.I):
                  rec['requests'].append({'url':req.url,'method':req.method,'post_data':req.post_data,'type':req.resource_type})
              def on_resp(resp,rec=rec):
                try: ct=resp.headers.get('content-type','')
                except: ct=''
                if re.search(r'pdf|download|file|data|checkmd5|img|report|api|oss|cdn',resp.url,re.I) or 'pdf' in ct.lower():
                  item={'url':resp.url,'status':resp.status,'content_type':ct}
                  rec['responses'].append(item)
                  if 'json' in ct.lower() or 'javascript' in ct.lower():
                    try: item['body']=resp.text()[:500000]
                    except Exception as e: item['error']=repr(e)
              page.on('request',on_req); page.on('response',on_resp)
              try:
                r=page.goto(url,wait_until='domcontentloaded',timeout=100000)
                try: page.wait_for_load_state('networkidle',timeout=25000)
                except PWTimeout: pass
                page.wait_for_timeout(3000)
                rec['status']=r.status if r else None
                rec['final_url']=page.url
                rec['title']=page.title()
                rec['body']=' '.join(page.locator('body').inner_text(timeout=15000).split())[:200000]
                rec['links']=page.eval_on_selector_all('a',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),href:e.href,onclick:e.getAttribute('onclick')||'',download:e.download||'',target:e.target||'',outer:e.outerHTML}))")
                rec['embeds']=page.eval_on_selector_all('embed,iframe,object',"els=>els.map(e=>({tag:e.tagName,src:e.src||'',data:e.data||'',type:e.type||'',outer:e.outerHTML}))")
                rec['images']=page.eval_on_selector_all('img',"els=>els.map(e=>({src:e.src,alt:e.alt||'',title:e.title||'',width:e.naturalWidth,height:e.naturalHeight}))")
                rec['scripts']=page.eval_on_selector_all('script',"els=>els.map(e=>({src:e.src||'',text:(e.textContent||'').slice(0,500000)}))")
                Path(f'output/page_{i}.html').write_text(page.content(),encoding='utf-8')
                page.screenshot(path=f'output/page_{i}.png',full_page=True)
                for text in ['下载报告','下载原文','下载PDF','下载','打开报告原文']:
                  loc=page.get_by_text(text,exact=False)
                  if not loc.count(): continue
                  try:
                    with page.expect_download(timeout=8000) as di:
                      loc.first.click(timeout=8000,force=True)
                    d=di.value
                    target=Path('output')/f'{i}_{d.suggested_filename}'
                    d.save_as(str(target)); data=target.read_bytes()
                    rec['downloads'].append({'text':text,'url':d.url,'file':str(target),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'magic':data[:8].hex()})
                  except Exception as e:
                    rec.setdefault('clicks',[]).append({'text':text,'error':repr(e),'after_url':page.url})
                    page.wait_for_timeout(1500)
                rec['all_pages']=[{'url':pg.url,'title':pg.title()} for pg in ctx.pages]
              except Exception as e:
                rec['error']=repr(e)
              out[str(i)]=rec
              print('READER',i,json.dumps({'status':rec.get('status'),'final_url':rec.get('final_url'),'downloads':rec.get('downloads'),'embeds':rec.get('embeds'),'requests':rec.get('requests')[-80:],'responses':rec.get('responses')[-80:]},ensure_ascii=False),flush=True)
              page.close()
            browser.close()
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-hibor-reader-inspection
          path: output/*
          retention-days: 1
