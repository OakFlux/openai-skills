name: Search public engines for China Longgong broker reports 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-search-engines-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml feedparser
      - name: Search RSS and lightweight result pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p search_results
          python - <<'PY'
          import json,html,re,time
          from pathlib import Path
          from urllib.parse import quote_plus,urljoin,unquote
          import requests,feedparser
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          queries=[
            '"中国龙工" 研报 PDF',
            '"中国龙工" 券商报告',
            '"中国龙工" 公司深度',
            '"中国龙工" 首次覆盖',
            '"中国龙工" 研究报告',
            '"Lonking Holdings" research report pdf',
            '"Lonking" 3339 HK research pdf',
            '"03339 HK" broker report',
            'site:pdf.dfcfw.com 中国龙工',
            'site:fxbaogao.com 中国龙工',
            'site:baogaobox.com 中国龙工',
            'site:fhyanbao.com 中国龙工',
            'site:dbs.com Lonking 3339',
            'site:*.com.hk Lonking 3339 research',
          ]
          out=[]
          for qi,q in enumerate(queries):
            urls=[
              ('bing_rss_zh','https://www.bing.com/search?format=rss&mkt=zh-CN&setlang=zh-hans&q='+quote_plus(q)),
              ('bing_rss_en','https://www.bing.com/search?format=rss&mkt=en-US&setlang=en&q='+quote_plus(q)),
              ('ddg_html','https://html.duckduckgo.com/html/?q='+quote_plus(q)),
              ('brave','https://search.brave.com/search?q='+quote_plus(q)+'&source=web'),
              ('mojeek','https://www.mojeek.com/search?q='+quote_plus(q)),
              ('google','https://www.google.com/search?num=100&q='+quote_plus(q)),
              ('jina_google','https://r.jina.ai/http://www.google.com/search?q='+quote_plus(q)),
              ('jina_bing','https://r.jina.ai/http://www.bing.com/search?q='+quote_plus(q)),
            ]
            for engine,u in urls:
              rec={'query':q,'engine':engine,'url':u,'items':[]}
              try:
                r=s.get(u,timeout=(10,25),allow_redirects=True)
                rec.update(status=r.status_code,final=r.url,bytes=len(r.content),type=r.headers.get('content-type'))
                Path(f'search_results/{qi:02d}_{engine}.txt').write_bytes(r.content)
                if 'rss' in engine:
                  f=feedparser.loads(r.content)
                  for e in f.entries:
                    rec['items'].append({'title':getattr(e,'title',''),'link':getattr(e,'link',''),'summary':getattr(e,'summary','')})
                else:
                  text=r.text
                  soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all('a',href=True):
                    href=html.unescape(a['href']); title=a.get_text(' ',strip=True)
                    if href.startswith('/url?q='): href=unquote(href.split('/url?q=',1)[1].split('&',1)[0])
                    href=urljoin(r.url,href)
                    combo=(title+' '+href).lower()
                    if any(k in combo for k in ['中国龙工','中國龍工','lonking','03339','3339','dfcfw','fxbaogao','baogaobox','fhyanbao','report','research','研报','pdf']):
                      rec['items'].append({'title':title,'link':href})
                  # Jina output often plain markdown URLs
                  if engine.startswith('jina_'):
                    for m in re.finditer(r'\[([^\]]{1,300})\]\((https?://[^)]+)\)',text):
                      rec['items'].append({'title':m.group(1),'link':m.group(2)})
                print('SEARCH',qi,engine,r.status_code,len(r.content),'ITEMS',len(rec['items']),flush=True)
              except Exception as e:
                rec['error']=repr(e); print('ERR',qi,engine,repr(e),flush=True)
              out.append(rec)
              time.sleep(.05)
          Path('search_results/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          # compact relevant results
          rel=[]; seen=set()
          for r in out:
            for it in r.get('items',[]):
              t=json.dumps(it,ensure_ascii=False)
              if any(k.lower() in t.lower() for k in ['中国龙工','中國龍工','lonking','03339','3339','pdf.dfcfw','fxbaogao','baogaobox','fhyanbao']):
                key=it.get('link','')
                if key not in seen:
                  seen.add(key); rel.append({'query':r['query'],'engine':r['engine'],**it})
          Path('search_results/relevant.json').write_text(json.dumps(rel,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RELEVANT',json.dumps(rel,ensure_ascii=False,indent=2)[:80000],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-longgong-search-engine-results
          path: search_results
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
