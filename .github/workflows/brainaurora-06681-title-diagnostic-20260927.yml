name: Diagnose BrainAurora 06681 title pages 20260927

on:
  push:
    paths:
      - '.github/workflows/brainaurora-06681-title-diagnostic-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch EN and ZH title-search pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, re, traceback
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Cache-Control':'no-cache'})
          result={}
          for lang in ('EN','ZH'):
              url=f'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000240904&lang={lang}'
              rec={'url':url}
              try:
                  r=s.get(url,timeout=(30,120),allow_redirects=True)
                  rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'encoding':r.encoding})
                  text=r.content.decode('utf-8','replace')
                  Path(f'out/titles_{lang}.html').write_text(text,encoding='utf-8')
                  soup=BeautifulSoup(text,'lxml')
                  links=[]
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a['href'])
                      if '/listedco/listconews/sehk/' in href and '.pdf' in href.lower():
                          title=' '.join(a.get_text(' ',strip=True).split())
                          node=a
                          context=title
                          for _ in range(8):
                              node=node.parent
                              if node is None: break
                              t=' '.join(node.get_text(' ',strip=True).split())
                              if len(t)<=2500: context=t
                              if re.search(r'\d{2}/\d{2}/\d{4}',t): break
                          links.append({'title':title,'href':href,'context':context})
                  rec['link_count']=len(links)
                  rec['links']=links
              except Exception as e:
                  rec['error']=repr(e)
                  rec['traceback']=traceback.format_exc()
              result[lang]=rec
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2)[:500000])
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: brainaurora-06681-title-diagnostic
          path: out
          retention-days: 7
          if-no-files-found: error
