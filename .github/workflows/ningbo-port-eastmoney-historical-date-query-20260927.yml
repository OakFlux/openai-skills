name: Query historical Eastmoney Ningbo Port reports 20260927

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-eastmoney-historical-date-query-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query exact historical dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          out=Path('results'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/plain,*/*'})
          windows=[
            ('2019-09-01','2019-09-15'),
            ('2017-10-01','2017-10-20'),
            ('2011-03-01','2011-03-31'),
            ('2011-01-01','2011-01-31'),
            ('2010-09-01','2010-09-30'),
          ]
          records=[]
          for begin,end in windows:
            for code in ['601018','']:
              for qtype in ['0','2']:
                for page in range(1,6):
                  params={
                    'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*',
                    'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                    'orgCode':'','code':code,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
                  }
                  try:
                    r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,120))
                    print('QUERY',begin,end,'code',repr(code),'q',qtype,'p',page,r.status_code,len(r.content),r.url,flush=True)
                    data=r.json()
                    rows=data.get('data') or []
                    print('ROWS',len(rows),'KEYS',list(data.keys()),'TOTAL',data.get('total') or data.get('TotalCount') or data.get('count'),flush=True)
                    for row in rows:
                      blob=json.dumps(row,ensure_ascii=False)
                      if '601018' in blob or '宁波港' in blob or '宁波舟山港' in blob:
                        rec={'begin':begin,'end':end,'code_param':code,'qtype':qtype,'page':page,'row':row}
                        records.append(rec)
                        print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
                    if len(rows)<500: break
                  except Exception as e:
                    print('ERR',begin,end,code,qtype,page,repr(e),flush=True)
                  time.sleep(.3)
          # dedupe and try PDF variants
          uniq={}
          for rec in records:
            row=rec['row']; key=str(row.get('infoCode') or row.get('id') or row)
            uniq[key]=row
          final=[]
          for key,row in uniq.items():
            info=str(row.get('infoCode') or '')
            probes=[]
            if info:
              for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf']:
                try:
                  rr=s.get(u,timeout=(20,120),allow_redirects=True)
                  ok=rr.status_code==200 and rr.content.startswith(b'%PDF-') and len(rr.content)>100000
                  probes.append({'url':u,'status':rr.status_code,'bytes':len(rr.content),'pdf':ok})
                  print('PDF_PROBE',info,ok,rr.status_code,len(rr.content),u,flush=True)
                  if ok:
                    (out/f'{info}.pdf').write_bytes(rr.content)
                    break
                except Exception as e:
                  probes.append({'url':u,'error':repr(e)})
            final.append({'row':row,'probes':probes})
          (out/'historical_matches.json').write_text(json.dumps(final,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_MATCHES',len(final),flush=True)
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-historical-eastmoney-query
          path: results
          retention-days: 7
          if-no-files-found: error
