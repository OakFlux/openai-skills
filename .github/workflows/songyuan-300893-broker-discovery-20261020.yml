name: Discover Songyuan Safety 300893 broker reports 20261020

on:
  push:
    paths:
      - '.github/workflows/songyuan-300893-broker-discovery-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery_out
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          CODE='300893'
          NAMES={'松原安全','松原股份'}
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/report/{CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          url='https://reportapi.eastmoney.com/report/list'
          rows_all=[]; logs=[]
          for page in range(1,16):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2000-01-01','endTime':'2026-10-20','pageNo':str(page),'fields':'',
                  'qType':'0','orgCode':'','code':CODE,'rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page)
              }
              obj=None; last=None
              for attempt in range(1,7):
                  try:
                      r=s.get(url,params=params,timeout=(20,120))
                      last={'status':r.status_code,'bytes':len(r.content),'head':r.text[:160]}
                      if r.status_code==200:
                          text=r.text.strip()
                          if text.startswith('{'):
                              obj=json.loads(text)
                          else:
                              a=text.find('('); b=text.rfind(')')
                              if a>=0 and b>a: obj=json.loads(text[a+1:b])
                          if obj is not None: break
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(attempt)
              if obj is None:
                  raise RuntimeError(f'page {page} failed: {last}')
              rows=obj.get('data') or []
              if isinstance(rows,dict):
                  rows=rows.get('list') or rows.get('data') or []
              logs.append({'page':page,'count':len(rows),'hits':obj.get('hits'),'totalPage':obj.get('TotalPage') or obj.get('totalPage')})
              if not rows: break
              rows_all.extend(rows)
              if len(rows)<100: break
              time.sleep(0.4)

          unique=[]; seen=set()
          for row in rows_all:
              info=str(row.get('infoCode') or '')
              if not info or info in seen: continue
              seen.add(info); unique.append(row)
          unique=[r for r in unique if str(r.get('stockCode') or '')==CODE or str(r.get('stockName') or '') in NAMES]
          unique.sort(key=lambda r:(str(r.get('publishDate') or ''), int(r.get('attachPages') or 0)), reverse=True)

          long_reports=[r for r in unique if int(r.get('attachPages') or 0)>=15]
          Path('discovery_out/songyuan_300893_all_report_metadata.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery_out/songyuan_300893_long_report_candidates.json').write_text(json.dumps(long_reports,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery_out/query_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=[f'TOTAL={len(unique)} LONG={len(long_reports)}']
          for r in long_reports:
              lines.append('\t'.join([
                  str(r.get('publishDate') or '')[:10],
                  str(r.get('attachPages') or ''),
                  str(r.get('orgSName') or ''),
                  str(r.get('title') or ''),
                  str(r.get('infoCode') or ''),
                  str(r.get('emRatingName') or ''),
              ]))
          Path('discovery_out/songyuan_300893_long_report_index.tsv').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: songyuan-300893-broker-discovery-20261020
          path: discovery_out/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
