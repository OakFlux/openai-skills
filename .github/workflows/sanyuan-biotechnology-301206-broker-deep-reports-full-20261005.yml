name: Build Sanyuan Biotechnology full broker deep reports 20261005

on:
  push:
    paths:
      - '.github/workflows/sanyuan-biotechnology-301206-broker-deep-reports-full-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          PACKAGE = '三元生物_301206_券商深度报告_完整版_2份'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEW_DIR = ROOT / '首页预览'
          PREVIEW_DIR.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'broker': '开源证券',
                  'title': '三元生物：无糖赛道优质，龙头风范尽显',
                  'report_type': '公司首次覆盖报告',
                  'date': '2022-02-18',
                  'analysts': '张宇光',
                  'rating': '增持（首次）',
                  'info_code': 'AP202202181547737899',
                  'expected_pages': 28,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202202181547737899_1.pdf',
                  'filename': '01_开源证券_三元生物_无糖赛道优质龙头风范尽显_完整版_2022-02-18.pdf',
                  'title_terms': ['无糖赛道优质', '龙头风范尽显'],
              },
              {
                  'order': 2,
                  'broker': '申港证券',
                  'title': '三元生物：“无糖”翘楚，厚积薄发',
                  'report_type': '公司深度研究',
                  'date': '2022-05-12',
                  'analysts': '汪冰洁',
                  'rating': '增持（首次）',
                  'info_code': 'AP202205131565334168',
                  'expected_pages': 25,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202205131565334168_1.pdf',
                  'filename': '02_申港证券_三元生物_无糖翘楚厚积薄发_完整版_2022-05-12.pdf',
                  'title_terms': ['无糖', '翘楚', '厚积薄发'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(url: str) -> tuple[bytes, dict[str, Any]]:
              last: dict[str, Any] = {}
              for attempt in range(8):
                  try:
                      r = session.get(
                          url,
                          timeout=(25, 240),
                          allow_redirects=True,
                          headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://data.eastmoney.com/report/',
                              'Accept': 'application/pdf,*/*;q=0.8',
                          },
                      )
                      last = {
                          'status': r.status_code,
                          'final_url': r.url,
                          'content_type': r.headers.get('content-type', ''),
                          'bytes': len(r.content),
                      }
                      if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 100_000:
                          return r.content, last
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {url}: {last}')

          manifest: list[dict[str, Any]] = []
          for report in reports:
              data, download_meta = download_pdf(report['url'])
              dest = ROOT / report['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f'Page mismatch {dest.name}: {pages} != {report["expected_pages"]}')

              extracted = ''
              for page in reader.pages[:min(8, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', extracted)
              if not any(term in compact for term in ['三元生物', '301206', '山东三元']):
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')
              matched_terms = [term for term in report['title_terms'] if re.sub(r'\s+', '', term) in compact]
              if not matched_terms:
                  raise RuntimeError(f'Title identity check failed: {dest.name}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'First-page render failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **report,
                  'actual_pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'download_meta': download_meta,
                  'identity_text_check': True,
                  'matched_title_terms': matched_terms,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'source_report_page': f'https://data.eastmoney.com/report/info/{report["info_code"]}.html',
                  'validation': [
                      'PDF file header',
                      'issuer identity',
                      'title identity',
                      'exact page count',
                      'qpdf structure',
                      'first-page render',
                  ],
              })

          readme = [
              '三元生物（301206.SZ）券商深度报告完整版资料包',
              '整理日期：2026-10-05',
              '',
              '本包收录2份公开可直接取得的券商原始完整PDF，不是预览页重制文件。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   类型：{item['report_type']}；日期：{item['date']}；分析师：{item['analysts']}；评级：{item['rating']}",
                  f"   完整页数：{item['actual_pages']}页；文件：{item['filename']}",
                  f"   报告页面：{item['source_report_page']}",
                  f"   原始PDF：{item['url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '版权及使用说明：报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、三元生物/证券代码身份、标题关键词、精确页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in z.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')

          short_path = Path('sanyuan_broker_reports_full.zip')
          short_path.write_bytes(zip_path.read_bytes())
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: sanyuan-biotechnology-301206-broker-deep-reports-full-final
          path: |
            三元生物_301206_券商深度报告_完整版_2份.zip
            sanyuan_broker_reports_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
