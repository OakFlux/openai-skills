name: Temporary Sdyanbao Aixin Shenwan listing
on:
  push:
    branches:
      - tmp-sdy-aixin-shenwan-list-20260906
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query and save all records
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report','Content-Type':'application/json;charset=UTF-8','Accept':'application/json, text/plain, */*'})
          body={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':1,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','keyword':'爱芯元智 申万宏源'}
          r=s.post('https://api.sdyanbao.com/api/file/search',json=body,timeout=90); r.raise_for_status(); obj=r.json()
          files=((obj.get('data') or {}).get('files') or [])
          Path('output/response.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          print('COUNT',len(files))
          for item in files: print(json.dumps(item,ensure_ascii=False),flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sdy-aixin-shenwan-list
          path: output/*
          retention-days: 1
          if-no-files-found: error
