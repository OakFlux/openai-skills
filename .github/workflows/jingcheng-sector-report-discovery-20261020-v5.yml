name: Find broker sector reports mentioning Jingcheng 20261020 v5

on:
  push:
    paths:
      - '.github/workflows/jingcheng-sector-report-discovery-20261020-v5.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: python -m pip install --quiet requests
      - name: Scan Eastmoney report metadata
        shell: bash
        run: |
          python - <<'PY'
          import json, time, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          terms=['氢能','氢能源','储氢','氢储运','氢气瓶','储氢瓶','燃料电池','气瓶','高压容器','碳纤维','清洁能源装备','氢能装备','氢能产业','氢能行业']
          matches=[]; seen=set()
          for year in range(2018,2027):
            begin=f'{year}-01-01'; end=f'{year}-12-31'
            for page in range(1,101):
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              try:
                r=s.get(endpoint,params=p,timeout=60)
                if r.status_code!=200:
                  print('HTTP_FAIL',year,page,r.status_code,r.text[:200]); break
                payload=r.json(); rows=payload.get('data') or []
                if isinstance(rows,dict): rows=rows.get('list') or rows.get('data') or []
              except Exception as e:
                print('ERROR',year,page,repr(e)); break
              print('PAGE',year,page,len(rows))
              if not rows: break
              for row in rows:
                info=str(row.get('infoCode') or '')
                if not info or info in seen: continue
                seen.add(info)
                title=str(row.get('title') or '')
                hits=[t for t in terms if t in title]
                pages=int(float(row.get('attachPages') or 0))
                if hits and pages>=15:
                  item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName']}
                  item['hits']=hits
                  matches.append(item)
                  print('MATCH',json.dumps(item,ensure_ascii=False))
              if len(rows)<100: break
              time.sleep(.05)
          matches.sort(key=lambda x:(int(float(x.get('attachPages') or 0)),str(x.get('publishDate') or '')),reverse=True)
          print('TOTAL_MATCHES',len(matches))
          print('TOP_MATCHES',json.dumps(matches[:300],ensure_ascii=False,indent=2))
          PY
