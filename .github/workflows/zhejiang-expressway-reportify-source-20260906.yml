name: Inspect Reportify source for Zhejiang Expressway 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-reportify-source-20260906.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Save public page source
        run: |
          mkdir -p source
          curl -L --max-time 120 -A 'Mozilla/5.0 Chrome/151 Safari/537.36' 'https://reportify.cn/reports/1267541011870126080' -o source/page.html
          grep -Eoi 'https?[^"<> ]+|[^"<> ]+\.pdf[^"<> ]*|[^"<> ]+(download|document|file)[^"<> ]*' source/page.html | head -n 500 > source/candidates.txt || true
          wc -c source/page.html
          sed -n '1,500p' source/candidates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-reportify-source
          path: source/
          retention-days: 7
