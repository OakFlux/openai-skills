name: Discover Chengdu Huawei 688709 report URLs 20261016

on:
  push:
    branches:
      - tmp/chengdu-huawei-688709-report-discovery-20261016-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Discover report sources
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls = [
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh688709&t1=all',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=688709&t1=all',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sh688709',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/760467727171/index.phtml',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/833736210293/index.phtml',
          ]

          for u in urls:
              print('\n' + '='*100)
              print('URL', u)
              try:
                  r = s.get(u, timeout=(20, 120), allow_redirects=True)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'TYPE', r.headers.get('content-type'), 'BYTES', len(r.content))
                  encs = [r.encoding, r.apparent_encoding, 'gb18030', 'utf-8']
                  text = None
                  used = None
                  for enc in encs:
                      if not enc:
                          continue
                      try:
                          candidate = r.content.decode(enc, errors='strict')
                          if '成都华微' in candidate or 'vReport' in candidate or '<html' in candidate.lower():
                              text = candidate
                              used = enc
                              break
                      except Exception:
                          pass
                  if text is None:
                      text = r.content.decode('gb18030', errors='replace')
                      used = 'gb18030-replace'
                  print('ENCODING', used, 'TITLE_MATCH', '成都华微' in text)
                  soup = BeautifulSoup(text, 'lxml')
                  title = soup.title.get_text(' ', strip=True) if soup.title else ''
                  print('HTML_TITLE', title)
                  links = []
                  for tag in soup.find_all(['a','link','script','iframe','form','embed','object']):
                      for attr in ('href','src','action','data'):
                          v = tag.get(attr)
                          if v:
                              full = urljoin(r.url, v)
                              label = tag.get_text(' ', strip=True)[:100]
                              links.append((attr, full, label))
                  keep = []
                  for item in links:
                      low = (item[1] + ' ' + item[2]).lower()
                      if any(k in low for k in ['pdf', 'download', 'down', 'report', 'rptid', '688709', '成都华微']):
                          keep.append(item)
                  print('RELEVANT_LINKS', json.dumps(keep[:300], ensure_ascii=False, indent=2))
                  pdfs = sorted(set(re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?', text, flags=re.I)))
                  print('PDF_URLS', json.dumps(pdfs[:100], ensure_ascii=False, indent=2))
                  rptids = sorted(set(re.findall(r'rptid[/=](\d{6,})', text, flags=re.I)))
                  print('RPTIDS', rptids[:200])
                  snippets = []
                  for pat in ['760467727171', '成都华微', '华泰证券', '招商证券', '华西证券', '特种集成电路小巨人', '特种芯片国产化', '特种ADC']:
                      pos = text.find(pat)
                      if pos >= 0:
                          snippets.append((pat, re.sub(r'\s+', ' ', text[max(0,pos-300):pos+700])))
                  print('SNIPPETS', json.dumps(snippets, ensure_ascii=False, indent=2))
              except Exception as e:
                  print('ERROR', repr(e))

          # Try the Eastmoney metadata endpoint with several query types and broad date ranges.
          api = 'https://reportapi.eastmoney.com/report/list'
          for qtype in ['0','1','2','3']:
              params = {
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2018-01-01','endTime':'2030-12-31','pageNo':'1','fields':'',
                  'qType':qtype,'orgCode':'','code':'688709','rcode':'','p':'1','pageNum':'1','pageNumber':'1'
              }
              try:
                  r = s.get(api, params=params, timeout=(20,120))
                  print('\nEASTMONEY QTYPE', qtype, 'STATUS', r.status_code, 'URL', r.url)
                  data = r.json()
                  batch = data.get('data') or []
                  if isinstance(batch, dict):
                      batch = batch.get('list') or batch.get('data') or []
                  out = []
                  for x in batch if isinstance(batch,list) else []:
                      out.append({k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','stockCode','stockName']})
                  print(json.dumps(out, ensure_ascii=False, indent=2, default=str))
              except Exception as e:
                  print('EASTMONEY ERROR', qtype, repr(e))
          PY
