name: Build Quantgroup 02685 filings package 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-02685-filings-package-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '量化派_02685_招股说明书_2025年报_2026中期业绩_截至2026-09-19'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.hkexnews.hk/',
          })

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          headers = {}
                          if 'xueqiu.com' in url:
                              headers['Referer'] = 'https://xueqiu.com/'
                          elif 'futunn.com' in url:
                              headers['Referer'] = 'https://www.futunn.com/'
                          elif 'quantgroup.com' in url:
                              headers['Referer'] = 'https://www.quantgroup.com/'
                          with session.get(url, headers=headers, timeout=(30, 600), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          docs = [
              {
                  'filename': '01_量化派_02685_最终招股章程_中文_2025-11-19.pdf',
                  'title': '量化派控股有限公司最终招股章程（中文）',
                  'category': '招股说明书',
                  'date': '2025-11-19',
                  'urls': [
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1119/2025111900010_c.pdf',
                      'https://www.hkexnews.hk/listedco/listconews/sehk/2025/1119/2025111900010_c.pdf',
                      'https://www.quantgroup.com/static/upload/2025/11/18/202511181888.pdf',
                      'https://ossnoticepdf.iqdii.com/stockdata/notice/02685/2025/2025111900010_c.pdf',
                  ],
                  'min_bytes': 5_000_000,
                  'min_pages': 500,
              },
              {
                  'filename': '02_Quantgroup_02685_Final_Prospectus_English_2025-11-19.pdf',
                  'title': 'Quantgroup Holding Limited Final Prospectus (English)',
                  'category': '招股说明书',
                  'date': '2025-11-19',
                  'urls': [
                      'https://www.quantgroup.com/static/upload/2025/11/19/202511192016.pdf',
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1119/2025111900010.pdf',
                      'https://www.hkexnews.hk/listedco/listconews/sehk/2025/1119/2025111900010.pdf',
                  ],
                  'min_bytes': 5_000_000,
                  'min_pages': 500,
              },
              {
                  'filename': '03_量化派_02685_2025年年度报告_中文_2026-04-23.pdf',
                  'title': '量化派控股有限公司2025年年度报告（中文）',
                  'category': '年度报告',
                  'date': '2026-04-23',
                  'urls': [
                      'https://www.quantgroup.com/static/upload/2026/04/23/202604233540.pdf',
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042300014_c.pdf',
                      'https://www.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042300014_c.pdf',
                  ],
                  'min_bytes': 1_000_000,
                  'min_pages': 180,
              },
              {
                  'filename': '04_Quantgroup_02685_2025_Annual_Report_English_2026-04-23.pdf',
                  'title': 'Quantgroup Holding Limited Annual Report 2025 (English)',
                  'category': '年度报告',
                  'date': '2026-04-23',
                  'urls': [
                      'https://www.quantgroup.com/static/upload/2026/04/23/202604232438.pdf',
                      'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042300013.pdf',
                      'https://www.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042300013.pdf',
                  ],
                  'min_bytes': 1_000_000,
                  'min_pages': 180,
              },
              {
                  'filename': '05_量化派_02685_2026年中期业绩公告_中文_2026-08-28.pdf',
                  'title': '截至2026年6月30日止六个月之中期业绩公告（中文）',
                  'category': '最新中期财务披露',
                  'date': '2026-08-28',
                  'urls': [
                      'https://stockn.xueqiu.com/02685/20260828914119.pdf',
                      'https://newsfile.futunn.com/public/NN-PersistNoticeAttachment/7781/20260828/12305596-0.PDF',
                  ],
                  'min_bytes': 100_000,
                  'min_pages': 35,
              },
              {
                  'filename': '06_Quantgroup_02685_2026_Interim_Results_English_2026-08-28.pdf',
                  'title': 'Interim Results Announcement for the Six Months Ended June 30, 2026 (English)',
                  'category': '最新中期财务披露',
                  'date': '2026-08-28',
                  'urls': [
                      'https://cdn.financialreports.eu/financialreports/media/filings/50756/2026/RNS/50756_rns_2026-08-28_6db4ea0f-e0a7-4c43-a875-b6c2bd9a9d0d.pdf',
                  ],
                  'min_bytes': 100_000,
                  'min_pages': 35,
              },
          ]

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              sample_indices = list(range(min(30, pages)))
              for idx in sample_indices:
                  try:
                      sample_text += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              identity_ok = any(term.lower() in sample_text.lower() for term in ('2685', 'Quantgroup', '量化派'))
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'category': doc['category'],
                  'disclosure_date': doc['date'],
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '量化派控股有限公司（02685.HK）公开披露文件',
              '整理日期：2026-09-19',
              '',
              '收录范围：2025年最终招股章程、上市后全部完整年度报告，以及截至整理日最新阶段性财务报告；各类别均收录中英文原件。',
              '量化派于2025年11月27日在香港联交所主板上市，因此截至整理日，上市后完整年度报告只有2025年年度报告。',
              '香港主板发行人通常按年度及半年度披露财务报告，并非按A股口径强制发布第一、第三季度报告；本包将截至2026年6月30日止六个月的中期业绩公告作为最新定期财务披露。',
              '截至2026年9月19日，单独成册的2026年中期报告尚未检索到；中期业绩公告共37页，包含中期简明综合财务报表及附注。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   类别：{rec['category']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司身份、实际页数、qpdf结构检查、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 6:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-02685-filings-final-20260919
          path: 量化派_02685_招股说明书_2025年报_2026中期业绩_截至2026-09-19.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
