name: Temporary Kaisheng Sdyanbao JavaScript

on:
  push:
    branches:
      - tmp-kaisheng-sdy-js-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for f in 0bec462.js 7ff3a18.js 359ac1f.js a94fdf1.js; do
            curl -L --fail --retry 2 --max-time 60 -A 'Mozilla/5.0' "https://www.sdyanbao.com/_nuxt/$f" -o "output/$f"
          done
          wc -c output/*
      - name: Upload JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-sdyanbao-javascript
          path: output/*
          retention-days: 1
          if-no-files-found: error
