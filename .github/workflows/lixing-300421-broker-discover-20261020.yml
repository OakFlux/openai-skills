name: Search Lixing public PDF sources 20261020

on:
  push:
    branches:
      - tmp/lixing-300421-broker-reports-20261020
    paths:
      - .github/workflows/lixing-300421-broker-discover-20261020.yml

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Search and inspect public sources
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import requests
          from urllib.parse import quote, unquote, urlparse, parse_qs

          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})

          for rid in ['4772943','3886525']:
              r=s.get(f'https://www.fxbaogao.com/detail/{rid}',timeout=45)
              print('DETAIL',rid,r.status_code,len(r.content),r.url)
              text=r.text
              for key in ['__NEXT_DATA__','report-image','download','pdf','pageCount','attachPages','fileUrl','reportUrl','oss']:
                  print('KEY',rid,key,text.lower().find(key.lower()))
              urls=sorted(set(html.unescape(x) for x in re.findall(r'https?://[^\"\'<>\s]+',text)))
              for u in urls:
                  if any(k in u.lower() for k in ['pdf','report','download','oss','api','fxbaogao']):
                      print('URL',rid,u[:1000])
              for m in re.finditer(r'(?i)(?:pdf|download|report-image|pagecount|attachpages|fileurl|reporturl|oss)',text):
                  a=max(0,m.start()-250); b=min(len(text),m.start()+500)
                  snippet=re.sub(r'\s+',' ',text[a:b])
                  print('SNIP',rid,snippet[:900])

          queries=[
              '"力星股份" "精密滚动体龙头" pdf',
              '"力星股份" "800V架构逐步成为电车主流方案" pdf',
              '"力星股份" "盈利能力短期受行业影响" pdf',
              '"力星股份" "瞄准下游新能车" pdf',
              '300421 财通证券 研报 pdf',
              '300421 财信证券 研报 pdf',
          ]
          for q in queries:
              url='https://www.bing.com/search?q='+quote(q)
              r=s.get(url,timeout=45)
              print('BING',q,r.status_code,len(r.content),r.url)
              hrefs=[]
              for raw in re.findall(r'href=[\"\']([^\"\']+)',r.text):
                  u=html.unescape(raw)
                  if u.startswith('/ck/a?'):
                      qs=parse_qs(urlparse(u).query)
                      if 'u' in qs:
                          u=qs['u'][0]
                  if u.startswith('http'):
                      hrefs.append(u)
              for u in sorted(set(hrefs)):
                  if any(k in u.lower() for k in ['pdf','report','研报','fxbaogao','sgpjbg','baogao','dfcfw','huibo','stockstar','research']):
                      print('RESULT',q,u[:1200])
          PY
