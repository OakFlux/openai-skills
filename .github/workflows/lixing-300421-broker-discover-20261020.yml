name: Inspect Fxbaogao public viewer endpoints 20261020

on:
  push:
    branches:
      - tmp/lixing-300421-broker-reports-20261020
    paths:
      - .github/workflows/lixing-300421-broker-discover-20261020.yml

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect viewer resources
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re, requests
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          for rid in ['4772943','3886525']:
              url=f'https://www.fxbaogao.com/view?id={rid}'
              r=s.get(url,timeout=45,allow_redirects=True)
              print('VIEW',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              text=r.text
              print('HEAD',re.sub(r'\s+',' ',text[:1200]))
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
              print('SCRIPTS',rid,scripts)
              for src in scripts:
                  full=urljoin(r.url,html.unescape(src))
                  try:
                      rr=s.get(full,timeout=45)
                      print('SCRIPT',rid,rr.status_code,len(rr.content),full)
                      js=rr.text
                      if any(k in js.lower() for k in ['report-image','docid','download','preview','pdf','view']):
                          for pat in [r'https?://[^"\'`\s]+',r'/api/[^"\'`\s]+',r'[^"\'`\s]*(?:report-image|download|preview|pdf)[^"\'`\s]*']:
                              vals=sorted(set(re.findall(pat,js,re.I)))
                              for v in vals[:200]: print('JSREF',rid,full,v[:1000])
                          for m in re.finditer(r'(?i)(report-image|download|docid|preview|pdf|pagecount)',js):
                              a=max(0,m.start()-300); b=min(len(js),m.start()+650)
                              print('JSSNIP',rid,re.sub(r'\s+',' ',js[a:b])[:1200])
                  except Exception as e:
                      print('SCRIPTERR',rid,full,repr(e))
              for key in ['__NEXT_DATA__','report-image','download','pdf','docId','pageCount','preview']:
                  pos=text.lower().find(key.lower())
                  print('HTMLKEY',rid,key,pos)
                  if pos>=0: print('HTMLSNIP',rid,re.sub(r'\s+',' ',text[max(0,pos-350):pos+850])[:1300])
          PY
