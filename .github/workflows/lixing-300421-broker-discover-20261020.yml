name: Probe Lixing public report sources 20261020

on:
  push:
    branches:
      - tmp/lixing-300421-broker-reports-20261020
    paths:
      - .github/workflows/lixing-300421-broker-discover-20261020.yml

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe public report pages and images
        shell: bash
        run: |
          python - <<'PY'
          import requests
          import re
          from urllib.parse import quote

          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          items = [
              ('4772943','2025','04','08'),
              ('3886525','2023','09','02'),
          ]
          for rid,y,m,d in items:
              detail = s.get(f'https://www.fxbaogao.com/detail/{rid}', timeout=30)
              print('DETAIL', rid, detail.status_code, len(detail.content), detail.url)
              print('DETAIL_IDS', sorted(set(re.findall(r'/detail/(\d+)', detail.text)))[:50])
              for n in range(1, 61):
                  url = f'https://public.fxbaogao.com/report-image/{y}/{m}/{d}/{rid}-{n}.png'
                  r = s.get(url, timeout=30, allow_redirects=True)
                  ctype = r.headers.get('content-type','')
                  ok = r.status_code == 200 and ctype.startswith('image/') and len(r.content) > 1000
                  print('IMAGE', rid, n, r.status_code, len(r.content), ctype, 'OK' if ok else 'NO')
                  if n >= 2 and not ok:
                      break

          for q in ['力星股份', '800V架构逐步成为电车主流方案']:
              for url in [
                  'https://www.fxbaogao.com/search?keywords=' + quote(q),
                  'https://www.fxbaogao.com/search?keyword=' + quote(q),
                  'https://www.fxbaogao.com/search?q=' + quote(q),
              ]:
                  r = s.get(url, timeout=30, allow_redirects=True)
                  ids = sorted(set(re.findall(r'/detail/(\d+)', r.text)))
                  print('SEARCH', q, r.status_code, len(r.content), r.url, ids[:100])
          PY
