name: Temporary Inspect Orient Gene F10 Report Links

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-f10-links.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract report links and identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin
          url='https://webf10.gw.com.cn/SH/B16/SH688298_B16.html'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://webf10.gw.com.cn/'},timeout=60);r.raise_for_status()
          text=html.unescape(r.text).replace('\\/','/')
          needles=['东方POCT龙头呼之欲出','深耕POCT国际市场','深耕国际市场的POCT全产业链企业','新生代国际化IVD龙头','2021-08-05','2020-11-09','2020-01-13','2022-03-13']
          snippets=[]
          for n in needles:
            for m in list(re.finditer(re.escape(n),text,re.I))[:30]:snippets.append({'needle':n,'text':re.sub(r'\s+',' ',text[max(0,m.start()-1500):m.start()+5000])})
          urls=[]
          for x in re.findall(r'(?:href|src)=["\']([^"\']+)["\']',text,re.I):
            u=urljoin(r.url,x)
            if any(k in u.lower() for k in ['report','yanbao','research','pdf','688298','worth','b16']) and u not in urls:urls.append(u)
          result={'url':url,'status':r.status_code,'bytes':len(r.content),'urls':urls,'snippets':snippets,'head':text[:3000]}
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_f10_links.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT='+json.dumps({'status':r.status_code,'bytes':len(r.content),'urls':urls,'snippets':snippets},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-f10-links
          path: out/orient_gene_f10_links.json
          if-no-files-found: error
          retention-days: 3
