name: chatgpt-temp-bank-of-chongqing-hk-query
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-bank-of-chongqing-hk-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query code variants and probe long report PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python <<'PY'
          import io, json, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          WORK=Path('bank_of_chongqing_hk_query'); WORK.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          codes=['01963','1963','01963.HK','1963.HK','HK01963','11601963','601963.SH','SH601963']
          all_records=[]; seen=set(); responses=[]
          def parse(text):
              a=text.find('{'); b=text.rfind('}')
              return json.loads(text[a:b+1]) if a>=0 and b>a else {}
          for code in codes:
              params={'cb':'showData','pageSize':100,'pageNo':1,'qType':0,'code':code,'industryCode':'*','industry':'*','rating':'','ratingChange':'','beginTime':'2018-01-01','endTime':'2026-09-14','fields':'','orgCode':'','rcode':'','_':int(time.time()*1000)}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=90)
              print('QUERY',code,r.status_code,len(r.content),r.url,r.text[:500],flush=True)
              responses.append({'code':code,'url':r.url,'status':r.status_code,'text':r.text})
              try:o=parse(r.text)
              except Exception as e:print('PARSE_ERROR',code,repr(e),flush=True);continue
              rows=o.get('data') or []
              if isinstance(rows,dict): rows=rows.get('data') or rows.get('list') or []
              for x in rows if isinstance(rows,list) else []:
                  info=x.get('infoCode')
                  if info and info not in seen:
                      seen.add(info); all_records.append(x); print('RECORD',code,json.dumps(x,ensure_ascii=False),flush=True)
          (WORK/'responses.json').write_text(json.dumps(responses,ensure_ascii=False,indent=2),encoding='utf-8')
          (WORK/'records.json').write_text(json.dumps(all_records,ensure_ascii=False,indent=2),encoding='utf-8')
          valid=[]
          for x in all_records:
              pages=int(x.get('attachPages') or 0)
              if pages<12: continue
              info=x.get('infoCode'); url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              try:
                  r=s.get(url,headers={'Referer':'https://data.eastmoney.com/'},timeout=180,allow_redirects=True)
                  print('PDF',info,r.status_code,len(r.content),r.headers.get('content-type'),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                      actual=len(PdfReader(io.BytesIO(r.content),strict=False).pages)
                      rec={'infoCode':info,'date':str(x.get('publishDate') or '')[:10],'institution':x.get('orgSName'),'title':x.get('title'),'metadata_pages':pages,'actual_pages':actual,'url':r.url,'bytes':len(r.content)}
                      valid.append(rec);print('VALID',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e: print('PDF_ERROR',info,repr(e),flush=True)
          (WORK/'valid.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL',json.dumps(valid,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bank-of-Chongqing-HK-Query
          path: bank_of_chongqing_hk_query
          retention-days: 1
          compression-level: 6
