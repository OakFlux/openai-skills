name: Temporary Seazen public links
on:
  push:
    branches:
      - tmp-seazen-valuelist-vzkoo-20260907
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io,json
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          out=Path('output')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          result={}
          page='https://www.valuelist.cn/814543.html'
          try:
              p=s.get(page,timeout=60)
              result['page']={'status':p.status_code,'url':p.url,'bytes':len(p.content),'cookies':s.cookies.get_dict()}
          except Exception as e:
              result['page']={'error':repr(e)}
          target='https://www.valuelist.cn/goto?down=ODE0NTQzLTAtMmIxMDViMDk0Nw%3D%3D'
          try:
              r=s.get(target,headers={'Referer':page,'Accept':'application/pdf,application/octet-stream,text/html,*/*'},timeout=120,allow_redirects=True)
              data=r.content
              row={'status':r.status_code,'url':r.url,'history':[{'status':x.status_code,'url':x.url,'location':x.headers.get('location')} for x in r.history],'headers':dict(r.headers),'bytes':len(data),'head':data[:100].hex()}
              if b'%PDF-' in data[:1024]:
                  row['pages']=len(PdfReader(io.BytesIO(data),strict=False).pages)
                  (out/'valuelist_report.pdf').write_bytes(data)
              else:
                  (out/'valuelist_response.bin').write_bytes(data)
              result['download']=row
          except Exception as e:
              result['download']={'error':repr(e)}
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: seazen-public-link-result
          path: output/*
          retention-days: 1
          if-no-files-found: error
