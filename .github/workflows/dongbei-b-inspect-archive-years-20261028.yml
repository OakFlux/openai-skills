name: Summarize Dongbei B historical archive years

on:
  push:
    paths:
      - '.github/workflows/dongbei-b-inspect-archive-years-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Summarize cached metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, requests, re
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; job=122579751663
          r=requests.get(f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},timeout=90,allow_redirects=True); r.raise_for_status()
          rows=[]
          for line in r.content.decode('utf-8-sig',errors='replace').splitlines():
            p=line.find('MATCH ')
            if p<0: continue
            try: obj=json.loads(line[p+6:].strip())
            except Exception: continue
            key=(str(obj.get('title') or ''),str(obj.get('date') or ''),str(obj.get('path') or ''))
            rows.append(key)
          rows=sorted(set(rows),key=lambda x:(x[1],x[0]))
          grouped={}
          for title,date,path in rows:
            years=re.findall(r'(?:19|20)\d{2}',title)
            for year in years:
              y=int(year)
              if 1997<=y<=2014 and any(k in title for k in ('年度','年报','报告','摘要')):
                grouped.setdefault(str(y),[]).append({'title':title,'date':date,'path':path})
          print('GROUPED',json.dumps(grouped,ensure_ascii=False,sort_keys=True))
          early=[{'title':t,'date':d,'path':p} for t,d,p in rows if d[:4] in ('1999','2000','2001','2002','2003')]
          print('EARLY_BY_DATE',json.dumps(early,ensure_ascii=False))
          PY
