name: Build Beiyuan 601568 broker deep reports 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beiyuan-601568-broker-deep-reports-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import math
          import re
          import subprocess
          import time
          import zipfile
          from datetime import datetime
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '601568'
          CURRENT = '北元化工'
          OLD = '北元集团'
          FULL = '陕西北元化工集团股份有限公司'
          PACKAGE = '北元化工_601568_券商深度报告'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          session.headers.update({'User-Agent': ua, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'})

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:110]

          def parse_date(value: str) -> datetime:
              text = (value or '')[:10]
              try:
                  return datetime.strptime(text, '%Y-%m-%d')
              except Exception:
                  return datetime(1900, 1, 1)

          # Pull all company research reports from Eastmoney's public report endpoint.
          endpoint = 'https://reportapi.eastmoney.com/report/list2'
          page_size = 100
          rows = []
          page_no = 1
          while True:
              payload = {
                  'pageSize': page_size, 'pageNo': page_no, 'p': page_no,
                  'pageNum': page_no, 'pageNumber': page_no,
                  'beginTime': '2019-01-01', 'endTime': '2026-11-04',
                  'code': CODE, 'industryCode': '*',
                  'rating': None, 'ratingChange': None,
                  'orgCode': None, 'rcode': ''
              }
              r = session.post(endpoint, json=payload, headers={'Content-Type': 'application/json'}, timeout=(30, 120))
              print('API_PAGE', page_no, r.status_code, r.headers.get('content-type'), len(r.content))
              r.raise_for_status()
              obj = r.json()
              batch = obj.get('data') or []
              rows.extend(batch)
              hits = int(obj.get('hits') or len(rows))
              if not batch or len(rows) >= hits or page_no >= max(1, math.ceil(hits / page_size)):
                  break
              page_no += 1

          print('API_TOTAL', len(rows))
          print('API_ROWS', json.dumps([
              {
                  'title': x.get('title'), 'org': x.get('orgSName') or x.get('orgName'),
                  'date': x.get('publishDate'), 'infoCode': x.get('infoCode'),
                  'rating': x.get('emRatingName') or x.get('ratingName'),
                  'authors': x.get('researcher') or x.get('author')
              } for x in rows
          ], ensure_ascii=False))
          (ROOT / 'report_api_results.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')

          identities = (CURRENT, OLD, FULL, CODE, '北元化工集团', 'BEIYUAN GROUP')
          excluded_words = ('点评', '快报', '年报', '中报', '季报', '半年报', '业绩预告', '事件点评', '跟踪报告', '调研纪要')
          depth_words = ('深度', '首次覆盖', '初次覆盖', '价值分析', '公司研究', '投资价值', '新股覆盖')
          candidates = []

          for row in rows:
              title = (row.get('title') or '').strip()
              info = row.get('infoCode') or row.get('infocode') or ''
              broker = (row.get('orgSName') or row.get('orgName') or '').strip()
              if not title or not info:
                  continue
              pdf_url = f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              attempts = []
              data = None
              for attempt in range(3):
                  try:
                      pr = session.get(
                          pdf_url,
                          headers={
                              'User-Agent': ua,
                              'Referer': 'https://data.eastmoney.com/report/',
                              'Accept': 'application/pdf,*/*;q=0.8',
                          },
                          timeout=(30, 360), allow_redirects=True,
                      )
                      attempts.append({
                          'attempt': attempt + 1, 'status': pr.status_code,
                          'bytes': len(pr.content), 'content_type': pr.headers.get('content-type', ''),
                          'final_url': pr.url,
                      })
                      if pr.status_code == 200 and pr.content[:5] == b'%PDF-' and len(pr.content) > 70000:
                          data = pr.content
                          break
                      if pr.status_code in (400, 401, 403, 404, 410):
                          break
                  except Exception as exc:
                      attempts.append({'attempt': attempt + 1, 'error': repr(exc)})
                  time.sleep(1 + attempt)
              if data is None:
                  print('CANDIDATE_DOWNLOAD_FAILED', title, pdf_url, attempts)
                  continue

              try:
                  reader = PdfReader(io.BytesIO(data), strict=False)
                  pages = len(reader.pages)
              except Exception as exc:
                  print('CANDIDATE_PDF_FAILED', title, repr(exc))
                  continue
              if pages < 8:
                  print('CANDIDATE_TOO_SHORT', title, pages)
                  continue

              text = ''
              for page in reader.pages[:min(45, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in identities if normalize(x) in compact]
              broker_hits = [broker] if broker and normalize(broker) in compact else []
              title_core = normalize(re.sub(r'^(公司深度报告|公司深度|首次覆盖报告|公司首次覆盖报告)[:：]?', '', title))
              title_hit = bool(title_core and title_core[:18] in compact)
              if len(compact) > 500 and not identity_hits:
                  print('CANDIDATE_ISSUER_MISMATCH', title, broker, pages)
                  continue

              score = 0
              if any(word in title for word in depth_words):
                  score += 120
              if '首次覆盖' in title or '初次覆盖' in title:
                  score += 80
              if '深度' in title:
                  score += 70
              if '价值分析' in title or '投资价值' in title:
                  score += 60
              if pages >= 35:
                  score += 55
              elif pages >= 25:
                  score += 45
              elif pages >= 18:
                  score += 30
              elif pages >= 12:
                  score += 15
              if any(word in title for word in excluded_words):
                  score -= 150
              if title_hit:
                  score += 10
              if broker_hits:
                  score += 5

              candidates.append({
                  'title': title,
                  'broker': broker or '未知券商',
                  'date': (row.get('publishDate') or '')[:10],
                  'rating': row.get('emRatingName') or row.get('ratingName') or '',
                  'authors': row.get('researcher') or row.get('author') or '',
                  'infoCode': info,
                  'source_page': f'https://data.eastmoney.com/report/info/{info}.html',
                  'source_url': pdf_url,
                  'pages': pages,
                  'bytes': len(data),
                  'data': data,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hit': title_hit,
                  'score': score,
                  'download_attempts': attempts,
              })
              print('CANDIDATE', score, pages, broker, title, pdf_url)

          if not candidates:
              raise RuntimeError('No valid company research PDFs found')

          # Prefer true deep/initial-coverage reports; fall back to the longest non-commentary research.
          preferred = [c for c in candidates if c['score'] >= 60 and not any(w in c['title'] for w in excluded_words)]
          preferred.sort(key=lambda c: (c['score'], c['pages'], parse_date(c['date'])), reverse=True)
          fallback = [c for c in candidates if c not in preferred and c['pages'] >= 12 and not any(w in c['title'] for w in excluded_words)]
          fallback.sort(key=lambda c: (c['pages'], c['score'], parse_date(c['date'])), reverse=True)

          selected = []
          seen = set()
          for c in preferred + fallback:
              key = normalize(c['title'])
              if key in seen:
                  continue
              selected.append(c)
              seen.add(key)
              if len(selected) >= 3:
                  break
          if len(selected) < 2:
              # Last-resort inclusion of the longest complete company reports, still excluding sub-8-page briefs.
              rest = sorted(candidates, key=lambda c: (c['pages'], c['score'], parse_date(c['date'])), reverse=True)
              for c in rest:
                  key = normalize(c['title'])
                  if key in seen:
                      continue
                  selected.append(c)
                  seen.add(key)
                  if len(selected) >= 2:
                      break
          if len(selected) < 2:
              raise RuntimeError('Fewer than two complete broker research reports could be validated')

          (ROOT / 'selection_record.json').write_text(
              json.dumps([{k: v for k, v in c.items() if k != 'data'} for c in candidates], ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          manifest = []
          for idx, c in enumerate(selected, 1):
              filename = f"{idx:02d}_{safe(c['broker'])}_北元化工_{safe(c['title'])}_{c['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(c['data'])
              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')
              sha = hashlib.sha256(c['data']).hexdigest()
              record = {
                  **{k: v for k, v in c.items() if k != 'data'},
                  'filename': str(Path('原始PDF') / filename),
                  'preview_file': str(Path('首页预览') / preview.name),
                  'sha256': sha,
                  'validation': [
                      'PDF header', 'issuer identity', 'broker/title text where extractable',
                      'page count', 'qpdf structure', 'first-page render'
                  ],
              }
              manifest.append(record)
              print('SELECTED_VERIFIED', idx, c['broker'], c['title'], c['pages'], sha, c['source_url'])

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '陕西北元化工集团股份有限公司（601568.SH）券商研究报告资料包',
              '整理日期：2026-11-04', '',
              f'本包收录{len(manifest)}份公开可直接取得并完成完整性核验的券商原始PDF。',
              '筛选口径优先采用公司深度、首次覆盖、投资价值分析或长篇公司研究；排除普通财报点评、行业周报和网页摘要。',
              '历史报告中的证券简称通常为“北元集团”；现证券简称为“北元化工”，证券代码保持601568不变。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   日期：{x['date']}；评级：{x['rating'] or '未标明'}；分析师：{x['authors'] or '原PDF详见首页'}",
                  f"   完整页数：{x['pages']}页；文件：{x['filename']}",
                  f"   来源页面：{x['source_page']}",
                  f"   PDF来源：{x['source_url']}",
                  f"   SHA-256：{x['sha256']}", '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest), encoding='utf-8'
          )

          suffix = f'{len(manifest)}份'
          chinese_zip = Path(f'北元化工_601568_券商深度报告_{suffix}.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('beiyuan_601568_broker_deep_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: beiyuan-601568-broker-deep-reports-final
          path: |
            北元化工_601568_券商深度报告_*.zip
            beiyuan_601568_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
