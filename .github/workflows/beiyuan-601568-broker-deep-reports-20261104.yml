name: Build Beiyuan 601568 broker deep research package 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beiyuan-601568-broker-deep-reports-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '601568'
          CURRENT = '北元化工'
          OLD = '北元集团'
          FULL = '陕西北元化工集团股份有限公司'
          PACKAGE = '北元化工_601568_券商深度研究资料_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '海通证券',
                  'date': '2021-06-01',
                  'title': '依托资源优势，布局以PVC产品为核心的一体化产业链',
                  'classification': '公司研究报告／首次覆盖',
                  'rating': '优于大市（首次）',
                  'analysts': '刘威、邓勇、李智',
                  'scope': '公司专属报告',
                  'focus_note': '直接研究北元集团（现北元化工）的资源禀赋、PVC—烧碱一体化循环产业链与盈利逻辑。',
                  'urls': [
                      'https://file.iyanbao.com/pdf/664af-9b578c96-b468-4e9f-9d6f-714a237b50c2.pdf',
                  ],
                  'source_page': 'https://wap.hibor.com.cn/repinfodetail_851102.html',
                  'min_pages': 4,
                  'broker_aliases': ['海通证券', '海通证券研究所', 'HAITONG SECURITIES'],
                  'title_tokens': ['依托资源优势', '布局以PVC产品为核心的一体化产业链'],
              },
              {
                  'broker': '开源证券',
                  'date': '2026-03-19',
                  'title': '氯碱行业景气度逐步触底，双碳政策、PVC无汞化推进将加快行业景气度底部向上',
                  'classification': '基础化工行业深度报告',
                  'rating': '看好（维持）',
                  'analysts': '金益腾、宋梓荣、张晓锋',
                  'scope': '行业深度报告（含北元集团受益标的与经营比较）',
                  'focus_note': '覆盖PVC、烧碱供需、无汞化与碳约束，并将北元集团列为受益标的和氯碱龙头比较对象。',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202603191820644954_1.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/zw_industry.jshtml?infocode=AP202603191820644954',
                  'min_pages': 25,
                  'broker_aliases': ['开源证券', '开源证券研究所'],
                  'title_tokens': ['氯碱行业景气度逐步触底', 'PVC无汞化'],
              },
              {
                  'broker': '东吴证券',
                  'date': '2025-01-16',
                  'title': '烧碱：关注2025H1烧碱供需错配机会',
                  'classification': '基础化工行业深度报告',
                  'rating': '增持（首次）',
                  'analysts': '陈淑娴；研究助理：周少玟',
                  'scope': '行业深度报告（含北元集团产能、项目与估值比较）',
                  'focus_note': '对北元集团烧碱产能、市值/产能指标及新增项目进行横向比较，适合补充公司周期与估值判断。',
                  'urls': [
                      'https://file.iyanbao.com/pdf/737fc-140fcc35-9530-4a4e-8225-477784a6663d.pdf',
                  ],
                  'source_page': 'https://file.iyanbao.com/pdf/737fc-140fcc35-9530-4a4e-8225-477784a6663d.pdf',
                  'min_pages': 18,
                  'broker_aliases': ['东吴证券', '东吴证券研究所'],
                  'title_tokens': ['烧碱', '关注2025H1烧碱供需错配机会'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:110]

          identities = (CURRENT, OLD, FULL, CODE, '北元化工集团', 'BEIYUAN GROUP')
          manifest = []

          for idx, rep in enumerate(reports, 1):
              data = None
              source_url = ''
              attempts = []
              for url in rep['urls']:
                  for attempt in range(5):
                      try:
                          if 'dfcfw.com' in url:
                              referer = 'https://data.eastmoney.com/report/'
                          elif 'iyanbao.com' in url:
                              referer = 'https://www.iyanbao.com/'
                          else:
                              referer = 'https://www.eastmoney.com/'
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 360), allow_redirects=True,
                          )
                          attempts.append({
                              'url': url, 'attempt': attempt + 1,
                              'status': r.status_code, 'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 70000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

              filename = f"{idx:02d}_{safe(rep['broker'])}_北元化工_{safe(rep['title'])}_{rep['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < rep['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(80, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in identities if normalize(x) in compact]
              broker_hits = [x for x in rep['broker_aliases'] if normalize(x) in compact]
              title_hits = [x for x in rep['title_tokens'] if normalize(x) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer/company reference missing: {filename}')
              if len(compact) > 500 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch: {filename}')
              if len(compact) > 500 and not title_hits:
                  raise RuntimeError(f'Title mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              record = {
                  **{k: v for k, v in rep.items() if k not in ('urls', 'min_pages', 'broker_aliases', 'title_tokens')},
                  'source_url': source_url,
                  'candidate_urls': rep['urls'],
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hits': title_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'company/stock reference', 'broker identity',
                      'report title', 'page count', 'qpdf structure', 'first-page render'
                  ],
              }
              manifest.append(record)
              print('VERIFIED', rep['broker'], rep['title'], pages, len(data), sha, source_url)

          total_pages = sum(x['actual_pages'] for x in manifest)
          readme = [
              '陕西北元化工集团股份有限公司（601568.SH）券商深度研究资料包',
              '整理日期：2026-11-04', '',
              '公开渠道可直接下载的北元化工公司专属长篇研报较少。本包采用“1份公司首次覆盖报告＋2份直接纳入北元集团比较的氯碱/PVC行业深度报告”结构。',
              '未使用普通财报点评、行业周报、机构调研纪要或网页摘要凑数。',
              '报告发布时公司证券简称主要为“北元集团”；现证券简称为“北元化工”，证券代码保持601568不变。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   类型：{x['classification']}；范围：{x['scope']}",
                  f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   与北元化工的关系：{x['focus_note']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   来源页面：{x['source_page']}",
                  f"   PDF来源：{x['source_url']}",
                  f"   SHA-256：{x['sha256']}", '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司/证券代码引用、券商标识、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest), encoding='utf-8'
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('beiyuan_601568_broker_deep_research_package.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: beiyuan-601568-broker-deep-research-final
          path: |
            北元化工_601568_券商深度研究资料_3份.zip
            beiyuan_601568_broker_deep_research_package.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
