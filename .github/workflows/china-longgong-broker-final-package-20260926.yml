name: Build China Longgong broker research package 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-broker-final-package-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf fonttools

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '中国龙工_03339_券商研究报告_3份_公开完整PDF'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          docs = [
              {
                  'filename': '01_广发证券香港_Lonking首次覆盖_受益于中国工程机械上行周期_2017-10-17_16页.pdf',
                  'title': 'Lonking (3339 HK): Beneficiary of the upcycle in China’s construction machinery industry; initiate at Buy',
                  'broker': 'GF Securities (Hong Kong)',
                  'date': '2017-10-17',
                  'category': '首次覆盖/深度报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201710180960118297_01.pdf',
                  'min_bytes': 250_000,
                  'min_pages': 12,
                  'max_pages': 30,
                  'company_terms': ['lonking', '3339 hk'],
                  'broker_terms': ['gf securities', '广发证券'],
                  'type_terms': ['initiation', 'initiate at buy'],
              },
              {
                  'filename': '02_招银国际_Lonking装载机销售复苏及金属价格映射_上调至买入_2021-02-10_5页.pdf',
                  'title': 'Lonking (3339 HK): Recovery of wheel loader sales; Proxy of metal prices; Upgrade to BUY',
                  'broker': 'CMB International Securities',
                  'date': '2021-02-10',
                  'category': '公司研究更新',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202102101460684080_1.pdf',
                  'min_bytes': 150_000,
                  'min_pages': 5,
                  'max_pages': 12,
                  'company_terms': ['lonking', '3339 hk'],
                  'broker_terms': ['cmb international', 'cmbis'],
                  'type_terms': ['recovery of wheel loader sales', 'upgrade to buy', 'u/g to buy'],
              },
              {
                  'filename': '03_光大证券_中国龙工2023年度业绩点评_业绩见底反弹海外出口表现亮眼_2024-04-03_4页.pdf',
                  'title': '中国龙工（3339.HK）2023年度业绩点评：业绩见底反弹，海外出口表现亮眼',
                  'broker': '光大证券',
                  'date': '2024-04-03',
                  'category': '公司业绩研究更新',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202404031629691067_1.pdf',
                  'min_bytes': 150_000,
                  'min_pages': 4,
                  'max_pages': 10,
                  'company_terms': ['中国龙工', '3339.hk'],
                  'broker_terms': ['光大证券', 'ebscn.com'],
                  'type_terms': ['业绩见底反弹', '2023 年度业绩点评', '2023年度业绩点评'],
              },
          ]

          def download_pdf(doc: dict, dest: Path) -> str:
              candidates = [doc['url']]
              if 'pdf.dfcfw.com/pdf/' in doc['url']:
                  candidates.append(doc['url'].replace('https://pdf.dfcfw.com/', 'http://pdf.dfcfw.com/'))
              errors = []
              for url in candidates:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          headers = {
                              'Referer': 'https://data.eastmoney.com/',
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                          }
                          with session.get(url, headers=headers, timeout=(25, 240), allow_redirects=True, stream=True) as response:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, 'url', url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < doc['min_bytes'] or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def extract_text(reader: PdfReader) -> str:
              parts = []
              for page in reader.pages:
                  try:
                      parts.append(page.extract_text() or '')
                  except Exception as exc:
                      print('TEXT_EXTRACT_WARNING', repr(exc), flush=True)
              return '\n'.join(parts)

          records = []
          seen_hashes = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc, dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if not (doc['min_pages'] <= pages <= doc['max_pages']):
                  raise RuntimeError(f'page count outside expected range for {dest.name}: {pages}')

              text = extract_text(reader)
              lower = text.lower().replace('\u3000', ' ')
              if not any(term.lower() in lower for term in doc['company_terms']):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              if not any(term.lower() in lower for term in doc['broker_terms']):
                  raise RuntimeError(f'broker identity could not be verified in {dest.name}')
              if not any(term.lower() in lower for term in doc['type_terms']):
                  raise RuntimeError(f'report title/type could not be verified in {dest.name}')

              qpdf = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {qpdf.stderr[-2000:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate report detected: {dest.name}')
              seen_hashes.add(sha)

              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'broker': doc['broker'],
                  'publication_date': doc['date'],
                  'category': doc['category'],
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 3:
              raise RuntimeError(f'report count mismatch: {len(records)}')

          readme = [
              '中国龙工控股有限公司（03339.HK）券商研究报告公开完整PDF合集',
              '整理日期：2026-09-26',
              '',
              '一、收录说明',
              '本包收录3份能够公开取得并完成PDF完整性核验的券商研究报告。',
              '其中第1份为16页首次覆盖报告，属于本包的核心深度报告；第2、3份为完整公司研究更新，分别补充2021年估值框架和2024年最新可公开取得的年度业绩分析。',
              '为避免将网页摘要、报告预览页、行业新闻或公司公告冒充券商报告，本包仅收录实际下载成功且正文可核验的完整PDF。',
              '',
              '二、文件清单',
          ]
          for i, record in enumerate(records, 1):
              readme.extend([
                  f"{i}. {record['broker']}｜{record['title']}",
                  f"   类别：{record['category']}；发布日期：{record['publication_date']}",
                  f"   文件：{record['filename']}",
                  f"   页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   公开来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          readme.extend([
              '三、完整性核验',
              '所有PDF均完成文件头、公司身份、券商身份、报告题名/类型、实际页数、qpdf结构、重复文件和SHA-256校验；最终ZIP已完成CRC测试。',
              '',
              '四、使用提示',
              '券商报告反映其发布时点的研究判断，不代表当前投资结论。',
          ])

          (out / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'PDF count mismatch in ZIP: {len(pdfs)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-broker-reports-final
          path: 中国龙工_03339_券商研究报告_3份_公开完整PDF.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
