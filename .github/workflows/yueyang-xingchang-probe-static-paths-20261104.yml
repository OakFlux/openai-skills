name: Probe Yueyang Xingchang static report paths 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-probe-static-paths-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect viewer script and static asset patterns
        shell: bash
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import io, json, re, requests
          from PIL import Image

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.sgpjbg.com/baogao/105099.html'})
          jsurl='https://cache.sgpjbg.com/Master/view/view-mini-fz.js'
          r=s.get(jsurl,timeout=(30,180))
          print('JS',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          body=r.text
          for needle in ['_Addpage','dp','pageContainer','fileroot','GetPage','src','gif','png','jpg','BookMarkPage']:
              print('\nNEEDLE',needle)
              pos=0; shown=0
              while True:
                  idx=body.find(needle,pos)
                  if idx<0 or shown>=30: break
                  print(body[max(0,idx-1000):idx+2500].replace('\n',' ')[:3600])
                  pos=idx+len(needle); shown+=1
          base='https://file.sgpjbg.com/fileroot_temp1/2022-11/1/e3741f6f-59d2-4783-8576-8ea1afd0f9fb/e3741f6f-59d2-4783-8576-8ea1afd0f9fb'
          candidates=[]
          # direct PDF names
          for suffix in ['.pdf','.PDF','_1.pdf','-1.pdf','/document.pdf','/source.pdf','/105099.pdf']:
              candidates.append(base+suffix)
          # likely preview page naming patterns
          for i in [1,2,3,15,16,24]:
              for pattern in [
                  f'{base}_{i}.gif', f'{base}_{i}.png', f'{base}_{i}.jpg', f'{base}-{i}.gif', f'{base}-{i}.png',
                  f'{base}/{i}.gif', f'{base}/{i}.png', f'{base}/{i}.jpg', f'{base}/page{i}.gif', f'{base}/page_{i}.gif',
                  f'{base}{i}.gif', f'{base}{i}.png', f'{base}{i}.jpg',
              ]:
                  candidates.append(pattern)
          seen=set()
          for url in candidates:
              if url in seen: continue
              seen.add(url)
              try:
                  rr=s.get(url,timeout=(20,90),allow_redirects=True)
                  info={'url':url,'status':rr.status_code,'bytes':len(rr.content),'type':rr.headers.get('content-type'),'final':rr.url,'head':rr.content[:12].hex()}
                  if rr.status_code==200 and rr.content:
                      if rr.content[:5]==b'%PDF-':
                          info['kind']='pdf'
                      else:
                          try:
                              im=Image.open(io.BytesIO(rr.content)); im.load(); info.update({'kind':'image','format':im.format,'size':im.size})
                          except Exception as e:
                              info['parse_error']=repr(e)
                  print('PROBE',json.dumps(info,ensure_ascii=False))
              except Exception as e:
                  print('PROBE_ERR',url,repr(e))
          PY
