name: Query modern NEEQ API for Guoji Zhongzhuang reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-modern-api-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query modern disclosure endpoint
        run: |
          python - <<'PY'
          import json, requests
          endpoint='https://www.neeq.com.cn/disclosureInfoController/infoResult_zh.do'
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Origin':'https://www.neeq.com.cn',
            'Referer':'https://www.neeq.com.cn/disclosure/announcement.html',
            'X-Requested-With':'XMLHttpRequest',
            'Accept':'*/*',
          })
          cases=[]
          for xxfcbj in ['1','2','3','4','']:
            for company,keyword in [
              ('400062',''),
              ('','400062'),
              ('','二重5'),
              ('','二重3'),
              ('','国重装5'),
              ('','二重集团（德阳）重型装备股份有限公司'),
              ('','国机重型装备集团股份有限公司'),
            ]:
              cases.append((xxfcbj,company,keyword))
          for n,(xxfcbj,company,keyword) in enumerate(cases,1):
            form=[
              ('noticeType[]','5'),('disclosureType[]','5'),('disclosureSubtype[]',''),
              ('page','0'),('companyCd',company),('isNewThree','1'),('keyword',keyword),
              ('startTime','2015-01-01'),('endTime','2020-06-30'),
              ('xxfcbj[]',xxfcbj),('hyType[]',''),
              ('needFields[]','companyCd'),('needFields[]','companyName'),
              ('needFields[]','disclosureTitle'),('needFields[]','disclosurePostTitle'),
              ('needFields[]','destFilePath'),('needFields[]','publishDate'),
              ('needFields[]','xxfcbj'),('needFields[]','fileExt'),('needFields[]','xxzrlx'),
              ('siteId','1'),('sortfield','xxssdq'),('sorttype','asc'),
            ]
            r=s.post(endpoint,data=form,timeout=40)
            raw=r.text.strip()
            print('\nCASE',n,'XXFCBJ',repr(xxfcbj),'COMPANY',repr(company),'KEYWORD',repr(keyword),'STATUS',r.status_code,'LEN',len(raw),'URL',r.url)
            clean=raw
            if '(' in clean and clean.rstrip().endswith(')') and not clean.startswith('['):
              clean=clean[clean.find('(')+1:clean.rfind(')')]
            elif clean.startswith('null(') and clean.endswith(')'):
              clean=clean[5:-1]
            try: obj=json.loads(clean)
            except Exception as exc:
              print('PARSE_ERROR',repr(exc),'HEAD',repr(raw[:1000])); continue
            blocks=obj if isinstance(obj,list) else [obj]
            total=0
            for block in blocks:
              if not isinstance(block,dict): continue
              li=block.get('listInfo') or {}
              rows=li.get('content') or []
              total+=len(rows)
              for rec in rows:
                print('HIT',json.dumps(rec,ensure_ascii=False,sort_keys=True))
            print('TOTAL_ROWS',total)
          PY
