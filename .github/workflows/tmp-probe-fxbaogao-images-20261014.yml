name: Probe Sanwei FXBaogao images 20261014

on:
  push:
    branches:
      - tmp-sanwei-chemical-research-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests Pillow
      - env:
          PYTHONUTF8: "1"
        run: python tmp/probe_fxbaogao_images_20261014.py
