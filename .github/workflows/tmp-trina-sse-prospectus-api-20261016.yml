name: Query SSE Trina Solar prospectus

on:
  push:
    branches: [tmp-trina-solar-688599-reports-20261016]
    paths: ['.github/workflows/tmp-trina-sse-prospectus-api-20261016.yml']

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query SSE announcement API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://query.sse.com.cn/security/stock/queryCompanyBulletin.do?isPagination=true&productId=688599&keyWord=&securityType=0101%2C120100%2C020100%2C020200%2C120200&pageHelp.pageSize=100&pageHelp.pageCount=50&pageHelp.pageNo=1&pageHelp.beginPage=1&pageHelp.cacheSize=1&pageHelp.endPage=5&beginDate=2020-05-01&endDate=2020-06-30'
          curl --http1.1 -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
            -H 'Referer: https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=688599' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Accept: application/json, text/javascript, */*; q=0.01' \
            "$URL" -D headers.txt -o response.txt
          echo '===== HEADERS ====='
          sed -n '1,100p' headers.txt
          echo '===== BODY PREFIX ====='
          head -c 20000 response.txt
          echo
          python3 - <<'PY'
          import json,re,pathlib
          text=pathlib.Path('response.txt').read_text(encoding='utf-8',errors='replace').strip()
          text=re.sub(r'^[^(]*\(','',text)
          text=re.sub(r'\)\s*;?\s*$','',text)
          data=json.loads(text)
          print('\n===== PARSED =====')
          print('keys',data.keys())
          rows=data.get('result') or data.get('pageHelp',{}).get('data') or []
          print('ROWS',len(rows))
          for r in rows:
              title=str(r.get('TITLE') or r.get('title') or '')
              url=str(r.get('URL') or r.get('url') or '')
              date=str(r.get('SSEDATE') or r.get('sseDate') or r.get('date') or '')
              if any(k in title for k in ('招股说明书','招股意向书','上市公告书')):
                  print(date,'\t',title,'\t',url)
          PY
