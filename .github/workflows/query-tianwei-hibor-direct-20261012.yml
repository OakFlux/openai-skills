name: Query Tianwei Hibor directly

on:
  pull_request:
    paths:
      - 'tasks/tianwei-hibor-direct-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Hibor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, pathlib, urllib.parse, re
          import requests
          from bs4 import BeautifulSoup
          out=pathlib.Path('hibor_direct'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://www.hibor.com.cn/','Accept-Language':'zh-CN,zh;q=0.9'})
          params={'gjc':'天微电子','sslb':'1','sjfw':'24','cxzd':'','px':'xgd','bgys':'','gs':'','sdhy':'','sdgs':'','sdhgcl':'','mhss':'','hy':'','gp':''}
          for host in ['https://www.hibor.com.cn','https://wap.hibor.com.cn']:
            r=s.get(host+'/newweb/HuiSou/s',params=params,timeout=(20,120),allow_redirects=True)
            print('SEARCH',host,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
            fn='www.html' if 'www.' in host else 'wap.html'; (out/fn).write_bytes(r.content)
            soup=BeautifulSoup(r.text,'lxml')
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
            for a in soup.find_all('a',href=True):
              label=' '.join(a.get_text(' ',strip=True).split())
              href=urllib.parse.urljoin(r.url,a['href'])
              if any(k in (label+' '+href) for k in ('天微电子','688511','军用灭火','repinfodetail','report')):
                print('LINK',label,href,flush=True)
            # print nearby text
            text=' '.join(soup.get_text(' ',strip=True).split())
            for term in ['天微电子','688511','军用灭火']:
              i=text.find(term)
              if i>=0: print('CONTEXT',term,text[max(0,i-500):i+1500],flush=True)
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-hibor-direct
          path: hibor_direct/
          if-no-files-found: error
          retention-days: 2
