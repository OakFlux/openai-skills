name: Build Wuhan Fingu broker report package v2

on:
  push:
    branches: [tmp-wuhan-fingu-broker-deep-reports-20261024]
    paths: ['.github/workflows/tmp-wuhan-fingu-broker-package-v2-20261024.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk tesseract-ocr tesseract-ocr-chi-sim
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 trafilatura weasyprint img2pdf pillow

      - name: Build and validate package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='武汉凡谷_券商深度与公司研究报告_3份'
          mkdir -p "$PACKAGE" /tmp/wuhan_fingu_pages

          python3 - <<'PY'
          from __future__ import annotations
          import html, re, time
          from pathlib import Path
          import img2pdf, requests, trafilatura
          from bs4 import BeautifulSoup
          from weasyprint import HTML

          OUT=Path('武汉凡谷_券商深度与公司研究报告_3份')
          TMP=Path('/tmp/wuhan_fingu_pages')
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          # 海通证券21页首次覆盖深度报告：公开逐页预览按原顺序合成。
          base='https://file.sgpjbg.com/fileroot1/2020-8/10/bd630d01-ef74-4a45-81de-dac3aadb5901/bd630d01-ef74-4a45-81de-dac3aadb5901'
          images=[]
          for i in range(1,22):
              url=f'{base}{i}.gif'
              err=None
              for attempt in range(6):
                  try:
                      r=S.get(url,timeout=120); r.raise_for_status()
                      if r.content.startswith(b'GIF8'): ext='.gif'
                      elif r.content.startswith(b'\x89PNG\r\n\x1a\n'): ext='.png'
                      else: raise RuntimeError(f'bad signature {r.content[:12]!r}')
                      p=TMP/f'{i:02d}{ext}'; p.write_bytes(r.content); images.append(p)
                      print('PAGE',i,len(r.content)); break
                  except Exception as exc:
                      err=exc; time.sleep(1+attempt)
              else: raise RuntimeError(f'page {i} failed: {err}')
          if len(images)!=21: raise RuntimeError(f'expected 21 images, got {len(images)}')
          (OUT/'01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf').write_bytes(img2pdf.convert([str(p) for p in images]))

          def public_text(url:str, required:list[str], minimum:int=700)->str:
              r=S.get(url,timeout=180); r.raise_for_status()
              raw=r.content
              text_html=raw.decode('gb18030' if 'sina.com.cn' in url else 'utf-8',errors='replace')
              text=trafilatura.extract(text_html,include_comments=False,include_tables=True,favor_recall=True,output_format='txt') or ''
              text=re.sub(r'\n{3,}','\n\n',text).strip()
              if len(text)<minimum or not all(x in text for x in required):
                  soup=BeautifulSoup(text_html,'html.parser')
                  for tag in soup(['script','style','noscript','svg']): tag.decompose()
                  candidates=[]
                  for tag in soup.find_all(['article','main','section','div']):
                      t=re.sub(r'[ \t\r\f\v]+',' ',tag.get_text('\n',strip=True))
                      t=re.sub(r'\n{3,}','\n\n',t).strip()
                      if len(t)>=minimum and all(x in t for x in required): candidates.append(t)
                  if candidates: text=min(candidates,key=len)
              if len(text)<minimum or not all(x in text for x in required):
                  raise RuntimeError(f'insufficient text {url}: {len(text)} chars')
              print('TEXT',url,len(text)); return text

          def make_pdf(filename,title,broker,date,source,text):
              blocks=[]
              for b in re.split(r'\n\s*\n',text):
                  b=b.strip()
                  if b: blocks.append('<p>'+html.escape(b).replace('\n','<br>')+'</p>')
              doc=f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
              @page{{size:A4;margin:18mm 17mm 20mm;@bottom-center{{content:counter(page);font-size:9pt;color:#666}}}}
              body{{font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif;color:#111;font-size:10.5pt;line-height:1.72}}
              h1{{font-size:18pt;line-height:1.35;margin:0 0 9mm}} .meta{{border-top:1px solid #555;border-bottom:1px solid #aaa;padding:3mm 0;margin-bottom:6mm;font-size:9.5pt}}
              .notice{{background:#f2f2f2;padding:3mm 4mm;margin-bottom:6mm;font-size:9pt}} p{{margin:0 0 4mm;text-align:justify}} .source{{word-break:break-all;font-size:8.5pt;color:#555;margin-top:8mm}}
              </style></head><body><h1>{html.escape(title)}</h1><div class="meta">券商：{html.escape(broker)}　发布日期：{date}　版本：公开全文导出版</div>
              <div class="notice">本文件由公开可访问的券商研究全文网页排版导出，不是券商客户端原始附件PDF；正文研究结论未作改写。</div>{''.join(blocks)}<div class="source">公开来源：{html.escape(source)}</div></body></html>'''
              HTML(string=doc,base_url=source).write_pdf(OUT/filename)

          sina='https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/625253469469/index.phtml'
          make_pdf('02_国信证券_三季度盈利能力改善业绩符合预期_公开全文导出版_2019-10-24.pdf','武汉凡谷：三季度盈利能力改善，业绩符合预期','国信证券','2019-10-24',sina,public_text(sina,['武汉凡谷','国信证券'],800))

          cj='https://www.9fzt.com/detail/sz_002194_10_491131147358.html'
          make_pdf('03_长江证券_扩充先进产能强化市场优势地位推动自动化升级布局长期发展_公开全文导出版_2015-07-25.pdf','武汉凡谷：扩充先进产能强化市场优势地位，推动自动化升级布局长期发展','长江证券','2015-07-25',cj,public_text(cj,['武汉凡谷','长江证券'],700))
          print('CREATED',*[p.name for p in sorted(OUT.glob('*.pdf'))],sep='\n')
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 50000
            set +e; qpdf --check "$pdf" >"$pdf.check" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.check"; exit "$rc"; fi
            rm -f "$pdf.check"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 1
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$pdf.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$pdf.last" >/dev/null 2>&1
            test -s "$pdf.first.png" && test -s "$pdf.last.png"
            rm -f "$pdf.first.png" "$pdf.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          test "$(pdfinfo "$PACKAGE/01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 21
          pdftoppm -f 1 -l 1 -singlefile -png -r 200 "$PACKAGE/01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf" /tmp/deep_cover >/dev/null 2>&1
          tesseract /tmp/deep_cover.png /tmp/deep_cover -l chi_sim+eng >/dev/null 2>&1
          grep -Eq '武汉凡谷|凡谷' /tmp/deep_cover.txt
          for pdf in "$PACKAGE"/02_*.pdf "$PACKAGE"/03_*.pdf; do pdftotext "$pdf" "$pdf.txt"; grep -Eq '武汉凡谷' "$pdf.txt"; rm -f "$pdf.txt"; done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          folder=Path('武汉凡谷_券商深度与公司研究报告_3份')
          meta={
          '01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf':('海通证券','2020-08-10','专注基站射频三十年，5G滤波器再塑发展新天地','首次覆盖深度报告；公开逐页预览重建版','https://www.sgpjbg.com/baogao/16990.html'),
          '02_国信证券_三季度盈利能力改善业绩符合预期_公开全文导出版_2019-10-24.pdf':('国信证券','2019-10-24','三季度盈利能力改善，业绩符合预期','公司财报点评；公开全文导出版','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/625253469469/index.phtml'),
          '03_长江证券_扩充先进产能强化市场优势地位推动自动化升级布局长期发展_公开全文导出版_2015-07-25.pdf':('长江证券','2015-07-25','扩充先进产能强化市场优势地位，推动自动化升级布局长期发展','公司研究；公开全文导出版','https://www.9fzt.com/detail/sz_002194_10_491131147358.html')}
          lines=['武汉凡谷（002194）券商深度与公司研究报告资料包','整理日期：2026-10-24','','版本说明：','1. 海通证券报告由公开的21页逐页预览按原顺序合成为PDF，并明确标注“公开预览重建版”。','2. 国信证券、长江证券报告由公开完整研究全文网页排版导出，并明确标注“公开全文导出版”。','3. 三份文件均不是券商客户端原始附件PDF；文件名和清单未作混淆。','4. 资料仅供研究参考，不构成投资建议。','','文件清单：']
          sums=[]; total_pages=0; total_bytes=0
          for pdf in sorted(folder.glob('*.pdf')):
              broker,date,title,kind,source=meta[pdf.name]; data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace'); pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              total_pages+=pages; total_bytes+=len(data)
              lines += [f'- {pdf.name}',f'  券商：{broker}；日期：{date}；类型：{kind}；页数：{pages}',f'  标题：{title}',f'  公开来源：{source}',f'  SHA-256：{sha}']
              sums.append(f'{sha}  {pdf.name}')
          lines += ['',f'合计页数：{total_pages}页。',f'PDF合计大小：{total_bytes}字节。','全部PDF均已通过文件头、文件大小、PDF结构、页数、公司名称及首末页渲染检查；海通证券报告首页另通过OCR核验公司名称。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8'); (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Wuhan-Fingu-002194-broker-reports-3-v2
          path: 武汉凡谷_券商深度与公司研究报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
