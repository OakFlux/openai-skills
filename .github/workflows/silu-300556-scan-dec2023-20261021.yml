name: Scan Dec 2023 for Silu Vision report 20261021

on:
  push:
    paths:
      - '.github/workflows/silu-300556-scan-dec2023-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: python -m pip install --quiet requests
      - name: Scan all reports in Dec 2023
        shell: bash
        run: |
          python - <<'PY'
          import json,time,requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          for qtype in ['0','1','2']:
              found=[]
              for page in range(1,201):
                  p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2023-12-01','endTime':'2023-12-31','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  payload=None
                  for attempt in range(5):
                      try:
                          r=s.get(endpoint,params=p,timeout=(20,120))
                          if r.status_code==200: payload=r.json();break
                      except Exception as e: print('ERR',qtype,page,repr(e))
                      time.sleep(1+attempt)
                  if payload is None: break
                  data=payload.get('data') or []
                  if isinstance(data,dict): data=data.get('list') or data.get('data') or []
                  if page==1: print('QTYPE',qtype,'HITS',payload.get('hits'),'TOTALPAGE',payload.get('TotalPage'))
                  if not data: break
                  for row in data:
                      blob=json.dumps(row,ensure_ascii=False)
                      if str(row.get('stockCode') or '')=='300556' or '丝路视觉' in blob or '丝路蓝' in blob or '瑞云科技' in blob:
                          found.append({k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
                  total=int(payload.get('TotalPage') or 1)
                  if page>=total or len(data)<100: break
                  time.sleep(.03)
              print('FOUND_QTYPE',qtype,json.dumps(found,ensure_ascii=False,indent=2))
          PY
