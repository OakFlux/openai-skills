name: Build verified Zhaojin Mining report archive

on:
  push:
    branches:
      - tmp-zhaojin-final-2-v4-20260907

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow img2pdf pypdf pymupdf

      - name: Build and validate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/final work/pages work/renders
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path

          import img2pdf
          import pymupdf
          import requests
          from PIL import Image
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('output')
          WORK = Path('work')
          FINAL = WORK / 'final'
          PAGES = WORK / 'pages'
          RENDERS = WORK / 'renders'

          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=frozenset(['GET']),
          )
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          records = []

          # Report 1: original 30-page PDF.
          report1_url = 'https://cdn.hangyan.co/document_reports/3466271943412417652/202409_zhaojinkuangyeshengqianli_zhaojinerlai.pdf'
          response = session.get(
              report1_url,
              headers={'Referer': 'https://www.hangyan.co/reports/3466271943412417652', 'Accept': 'application/pdf,*/*'},
              timeout=(30, 240),
          )
          response.raise_for_status()
          report1_data = response.content
          if not report1_data.lstrip().startswith(b'%PDF') or len(report1_data) < 500_000:
              raise RuntimeError('The Zheshang Securities download is not a valid PDF.')

          reader1 = PdfReader(io.BytesIO(report1_data), strict=False)
          pages1 = len(reader1.pages)
          if pages1 != 30:
              raise RuntimeError(f'Unexpected Zheshang report page count: {pages1}')
          sample_text = '\n'.join((page.extract_text() or '') for page in reader1.pages[:3])
          if '招金矿业' not in sample_text or '浙商' not in sample_text:
              raise RuntimeError('Zheshang report identity check failed.')

          report1_path = FINAL / '2024-09-27_浙商证券_深聚潜力_招金而来_30页.pdf'
          report1_path.write_bytes(report1_data)
          records.append({
              '序号': 1,
              '券商': '浙商证券',
              '发布日期': '2024-09-27',
              '报告标题': '招金矿业深度报告：深聚潜力，“招”金而来',
              '实际PDF页数': pages1,
              '文件大小_字节': len(report1_data),
              'SHA256': hashlib.sha256(report1_data).hexdigest(),
              '版本说明': '公开下载的券商原始PDF',
              '公开来源': 'https://www.hangyan.co/reports/3466271943412417652',
              '文件名': report1_path.name,
          })

          # Report 2: all 15 publicly displayed original pages merged in order.
          report2_base = 'https://oss.sdyanbao.com/page/2024/7/2/1030510'
          report2_page_count = 15
          report2_page_paths = []
          page_hashes = []
          dimensions = []
          report2_dir = PAGES / 'first_shanghai'
          report2_dir.mkdir(parents=True, exist_ok=True)

          for page_index in range(report2_page_count):
              url = f'{report2_base}/{page_index}.png'
              page_response = session.get(
                  url,
                  headers={'Referer': report2_base, 'Accept': 'image/png,image/*,*/*;q=0.8'},
                  timeout=(30, 180),
              )
              page_response.raise_for_status()
              data = page_response.content
              if len(data) < 8_000:
                  raise RuntimeError(f'Page {page_index + 1} is unexpectedly small: {len(data)} bytes')
              with Image.open(io.BytesIO(data)) as image:
                  image.verify()
              with Image.open(io.BytesIO(data)) as image:
                  width, height = image.size
                  fmt = image.format
              if width < 600 or height < 600:
                  raise RuntimeError(f'Unexpected page dimensions: {width}x{height}')
              digest = hashlib.sha256(data).hexdigest()
              page_path = report2_dir / f'{page_index + 1:03d}.png'
              page_path.write_bytes(data)
              report2_page_paths.append(page_path)
              page_hashes.append(digest)
              dimensions.append(f'{width}x{height}')
              print('PAGE_OK', page_index + 1, len(data), width, height, fmt, digest[:12], flush=True)

          if len(set(page_hashes)) != report2_page_count:
              raise RuntimeError('Duplicate page image detected in the First Shanghai report.')

          # Confirm that the next page does not exist, proving the full public page set is 15 pages.
          extra = session.get(
              f'{report2_base}/{report2_page_count}.png',
              headers={'Referer': report2_base, 'Accept': 'image/png,image/*,*/*;q=0.8'},
              timeout=(30, 180),
          )
          if extra.status_code != 404:
              raise RuntimeError(f'Unexpected page after the declared 15 pages: HTTP {extra.status_code}')

          report2_path = FINAL / '2024-06-24_第一上海_黄金行业优质高成长公司_增长潜力巨大_15页.pdf'
          report2_path.write_bytes(img2pdf.convert([str(path) for path in report2_page_paths]))
          report2_data = report2_path.read_bytes()
          reader2 = PdfReader(io.BytesIO(report2_data), strict=False)
          pages2 = len(reader2.pages)
          if pages2 != report2_page_count:
              raise RuntimeError(f'Unexpected First Shanghai report page count: {pages2}')

          records.append({
              '序号': 2,
              '券商': '第一上海证券',
              '发布日期': '2024-06-24',
              '报告标题': '招金矿业：黄金行业优质高成长公司，增长潜力巨大，目标价17.46港元',
              '实际PDF页数': pages2,
              '文件大小_字节': len(report2_data),
              'SHA256': hashlib.sha256(report2_data).hexdigest(),
              '版本说明': '公开原报告逐页图像按原页序无删减合并为PDF',
              '公开来源': report2_base,
              '文件名': report2_path.name,
          })

          # Render first pages for visual QA.
          qa_images = []
          for number, report_path in enumerate([report1_path, report2_path], 1):
              document = pymupdf.open(report_path)
              pixmap = document[0].get_pixmap(matrix=pymupdf.Matrix(1.25, 1.25), alpha=False)
              render_path = RENDERS / f'report_{number}_first_page.png'
              pixmap.save(str(render_path))
              document.close()
              qa_images.append(render_path)

          # A simple side-by-side contact sheet for later inspection.
          cards = []
          for render_path in qa_images:
              with Image.open(render_path) as image:
                  rgb = image.convert('RGB')
                  rgb.thumbnail((650, 900))
                  card = Image.new('RGB', (700, 940), 'white')
                  card.paste(rgb, ((700 - rgb.width) // 2, 20))
                  cards.append(card)
          sheet = Image.new('RGB', (1400, 940), 'white')
          sheet.paste(cards[0], (0, 0))
          sheet.paste(cards[1], (700, 0))
          sheet.save(OUT / 'first_page_contact_sheet.jpg', quality=92)
          for card in cards:
              card.close()
          sheet.close()

          manifest_path = FINAL / '文件清单与校验值.csv'
          with manifest_path.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(records[0].keys()))
              writer.writeheader()
              writer.writerows(records)

          readme_lines = [
              '招金矿业（01818.HK）券商深度报告资料包',
              '重新打包日期：2026-09-07',
              '',
              '本压缩包收录2份完整、篇幅较长的招金矿业公司研究报告。',
              '已核验PDF文件头、实际页数、公司身份、首页渲染和ZIP CRC。',
              '',
          ]
          for record in records:
              readme_lines.extend([
                  f"{record['序号']}. {record['券商']} | {record['发布日期']} | {record['报告标题']} | {record['实际PDF页数']}页",
                  f"   版本：{record['版本说明']}",
                  f"   文件：{record['文件名']}",
                  '',
              ])
          (FINAL / 'README.txt').write_text('\n'.join(readme_lines), encoding='utf-8')

          archive_path = OUT / 'Zhaojin_Mining_01818_Broker_Deep_Reports_2_Verified.zip'
          with zipfile.ZipFile(archive_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(FINAL.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(archive_path, 'r') as archive:
              bad = archive.testzip()
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failure at {bad}')
              if len(pdf_names) != 2:
                  raise RuntimeError(f'Expected 2 PDFs in ZIP, found {len(pdf_names)}')

          result = {
              'ok': True,
              'archive': archive_path.name,
              'archive_bytes': archive_path.stat().st_size,
              'zip_crc_ok': True,
              'pdf_count': 2,
              'records': records,
          }
          (OUT / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PACKAGE_OK', json.dumps(result, ensure_ascii=False), flush=True)
          PY

      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-mining-verified-report-package
          path: output/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
