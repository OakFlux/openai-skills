name: Temporary Johnson Electric HK qType scan

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-johnson-hk-qtype-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scan qType and code variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, re
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
          codes=['00179','0179','179','HK00179','HK0179','00179.HK','0179.HK','116.00179','100.00179']
          qtypes=[str(i) for i in range(0,8)]
          dates=[('2025-03-01','2025-03-31'),('2025-09-01','2025-11-30'),('2026-03-01','2026-03-10')]
          needles=['德昌电机控股','车用电机龙头','有内生优势的人形机器人供应链公司','汽车微电机单车价值提升','液冷水泵、人形机器人零部件弹性可期','全球化电机企业探索人形机器人应用','全球微型电机领军企业']
          found={}
          for begin,end in dates:
            for q in qtypes:
              for code in codes:
                params={'pageNo':'1','pageSize':'500','code':code,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'fields':'','qType':q,'orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
                try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=45)
                  if r.status_code!=200: continue
                  obj=r.json(); rows=obj.get('data') or []
                  if rows: print('NONEMPTY',begin,end,'q',q,'code',code,'rows',len(rows),'hits',obj.get('hits'),'pages',obj.get('TotalPage'))
                  for row in rows:
                    blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode','orgSName','orgName'])
                    if any(n in blob for n in needles):
                      info=str(row.get('infoCode') or '')
                      found[info or blob]=row
                      print('MATCH',json.dumps(row,ensure_ascii=False))
                      if info:
                        for pre in ['H3','H2','H1']:
                          u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                          x=requests.get(u,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*','Range':'bytes=0-4095'},timeout=45,allow_redirects=True)
                          print('PDF',info,pre,x.status_code,len(x.content),x.headers.get('content-type'),x.headers.get('content-range'),repr(x.content[:30]))
                except Exception as e: print('ERR',begin,end,q,code,repr(e))
          print('FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          PY
