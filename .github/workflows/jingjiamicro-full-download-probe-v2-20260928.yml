name: Probe public full Jingjia Micro report downloads v2 20260928

on:
  push:
    paths:
      - '.github/workflows/jingjiamicro-full-download-probe-v2-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Probe public endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, re, html
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          results=[]

          def record_get(name,url,headers=None):
            rec={'name':name,'url':url}
            try:
              r=s.get(url,headers=headers or {},timeout=(20,120),allow_redirects=True)
              rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'headers':dict(r.headers)})
              Path(f'out/{name}.bin').write_bytes(r.content)
              try: rec['text']=r.content.decode('utf-8','replace')[:1000000]
              except: pass
              rec['is_pdf']=r.content[:5]==b'%PDF-'
              if rec['is_pdf']:
                Path(f'out/{name}.pdf').write_bytes(r.content)
            except Exception as e:
              rec['error']=repr(e)
            results.append(rec)
            return rec

          for endpoint in ('detail','download'):
            rec={'name':f'sdy_{endpoint}','url':f'https://api.sdyanbao.com/api/file/{endpoint}'}
            try:
              r=s.post(rec['url'],json={'id':903033},headers={'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/detail/903033'},timeout=(20,120),allow_redirects=True)
              rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'headers':dict(r.headers),'is_pdf':r.content[:5]==b'%PDF-'})
              Path(f'out/sdy_{endpoint}.bin').write_bytes(r.content)
              if rec['is_pdf']:
                Path(f'out/sdy_{endpoint}.pdf').write_bytes(r.content)
              else:
                rec['text']=r.content.decode('utf-8','replace')[:1000000]
            except Exception as e:
              rec['error']=repr(e)
            results.append(rec)

          pages={
            'yanbaoke':'https://www.yanbaoke.com/info/ervwAqMukDb3PNqL5cdZaQ',
            'why':'https://www.360why.com/bg/2cae0f000054927.html',
            'hangyan':'https://www.hangyan.co/reports/3591658029633767266',
            'sdy_page':'https://www.sdyanbao.com/detail/903033',
          }
          candidates=[]
          for name,url in pages.items():
            rec=record_get(name,url,{'Referer':'https://www.google.com/'})
            text=rec.get('text','')
            if not text: continue
            soup=BeautifulSoup(text,'html.parser')
            links=[]
            for tag in soup.find_all(['a','iframe','embed','object','script']):
              v=tag.get('href') or tag.get('src') or tag.get('data')
              if not v: continue
              u=urljoin(rec.get('final_url',url),html.unescape(v).replace('\\/','/'))
              t=tag.get_text(' ',strip=True)[:200]
              links.append({'url':u,'text':t,'tag':tag.name})
              low=(u+' '+t).lower()
              if any(k in low for k in ('pdf','download','file','attachment','report')):
                candidates.append((name,u,t))
            rec['links']=links[:3000]
            for pat in [
              r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
              r'https?://[^\s"\'<>]+?(?:download|file|attachment)[^\s"\'<>]*',
              r'["\']([^"\']+?\.pdf(?:\?[^"\']*)?)["\']',
            ]:
              for m in re.finditer(pat,text,re.I):
                raw=m.group(1) if m.lastindex else m.group(0)
                u=urljoin(rec.get('final_url',url),html.unescape(raw).replace('\\/','/'))
                candidates.append((name,u,'regex'))

          seen=set()
          for source,u,label in candidates:
            if u in seen: continue
            seen.add(u)
            if len(seen)>120: break
            low=u.lower()
            if any(x in low for x in ('javascript:','mailto:','#')): continue
            name='candidate_'+str(len(seen)).zfill(3)
            rec=record_get(name,u,{'Referer':pages.get(source,'https://www.google.com/')})
            rec['source']=source
            rec['label']=label

          Path('out/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/candidates.json').write_text(json.dumps([{'source':a,'url':b,'label':c} for a,b,c in candidates],ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > out/file_sizes.txt

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: jingjiamicro-full-download-probe-v2
          path: out
          retention-days: 7
          if-no-files-found: error
