name: Temporary Fast Locate SGPJBG Mengtai Report ID

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-fast-sgpjbg-id-scan-mengtai.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Concurrently scan IDs near June 2023 uploads
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet httpx
          python - <<'PY'
          import asyncio, html, json, re
          import httpx

          IDS=list(range(129500,130501))
          TARGETS=('蒙泰高新','丙纶长丝行业领跑者','双基地强势进军碳纤维')
          sem=asyncio.Semaphore(45)
          found=[]
          checked=0

          async def fetch(client,report_id):
            global checked
            url=f'https://www.sgpjbg.com/baogao/{report_id}.html'
            async with sem:
              try:
                r=await client.get(url,headers={'Range':'bytes=0-180000'},follow_redirects=True,timeout=12)
                checked+=1
                if checked%100==0:print('PROGRESS',checked,flush=True)
                if r.status_code not in (200,206) or len(r.content)<1000:return
                text=html.unescape(r.text)
                if not any(t in text for t in TARGETS):return
                title='';h1=''
                m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                if m:title=re.sub(r'<[^>]+>',' ',m.group(1));title=re.sub(r'\s+',' ',title).strip()
                m=re.search(r'<h1[^>]*>(.*?)</h1>',text,re.I|re.S)
                if m:h1=re.sub(r'<[^>]+>',' ',m.group(1));h1=re.sub(r'\s+',' ',h1).strip()
                item={'id':report_id,'url':str(r.url),'status':r.status_code,'bytes':len(r.content),'title':title,'h1':h1}
                found.append(item);print('FOUND='+json.dumps(item,ensure_ascii=False),flush=True)
              except Exception:
                pass

          async def main():
            limits=httpx.Limits(max_connections=60,max_keepalive_connections=30)
            async with httpx.AsyncClient(headers={'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'},limits=limits,http2=True) as client:
              await asyncio.gather(*(fetch(client,i) for i in IDS))
            print('ALL_FOUND='+json.dumps(found,ensure_ascii=False))
            if not found:raise RuntimeError('No Mengtai report found in 129500-130500')
          asyncio.run(main())
          PY
