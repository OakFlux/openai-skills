name: Build Transsion 688036 direct reports package 20260927

on:
  push:
    paths:
      - '.github/workflows/transsion-688036-reports-direct-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download reports, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          package_name = '传音控股_688036_2020-2025年报及2026最新季报与半年报'
          out = Path(package_name)
          out.mkdir(parents=True, exist_ok=True)

          docs = [
              {
                  'filename': '01_传音控股_688036_2020年年度报告.pdf',
                  'title': '传音控股2020年年度报告',
                  'period': '2020年度',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/1ef32f7ca97dcef6.pdf',
                  'min_pages': 100,
                  'min_bytes': 1_000_000,
              },
              {
                  'filename': '02_传音控股_688036_2021年年度报告.pdf',
                  'title': '传音控股2021年年度报告',
                  'period': '2021年度',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/6d01773fcf2b2d96.pdf',
                  'min_pages': 100,
                  'min_bytes': 1_000_000,
              },
              {
                  'filename': '03_传音控股_688036_2022年年度报告.pdf',
                  'title': '传音控股2022年年度报告',
                  'period': '2022年度',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/79321cbdf94e9861.pdf',
                  'min_pages': 100,
                  'min_bytes': 1_000_000,
              },
              {
                  'filename': '04_传音控股_688036_2023年年度报告.pdf',
                  'title': '传音控股2023年年度报告',
                  'period': '2023年度',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/ed67f251e2534125.pdf',
                  'min_pages': 100,
                  'min_bytes': 1_000_000,
              },
              {
                  'filename': '05_传音控股_688036_2024年年度报告.pdf',
                  'title': '传音控股2024年年度报告',
                  'period': '2024年度',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/e7df681c2ec57c28.pdf',
                  'min_pages': 100,
                  'min_bytes': 1_000_000,
              },
              {
                  'filename': '06_传音控股_688036_2025年年度报告.pdf',
                  'title': '传音控股2025年年度报告',
                  'period': '2025年度',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/be73301c55bf781b.pdf',
                  'min_pages': 100,
                  'min_bytes': 1_000_000,
              },
              {
                  'filename': '07_传音控股_688036_2026年第一季度报告.pdf',
                  'title': '传音控股2026年第一季度报告',
                  'period': '2026年第一季度',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/8a9d18833db5456a.pdf',
                  'min_pages': 4,
                  'min_bytes': 80_000,
              },
              {
                  'filename': '08_传音控股_688036_2026年半年度报告.pdf',
                  'title': '传音控股2026年半年度报告',
                  'period': '截至2026年6月30日止六个月',
                  'url': 'https://notice.10jqka.com.cn/api/pdf/b8aa475fe221a045.pdf',
                  'min_pages': 40,
                  'min_bytes': 400_000,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://s.askci.com/stock/financialreport/688036/financefile/',
          })

          def download(doc: dict, dest: Path) -> str:
              errors = []
              for attempt in range(1, 5):
                  tmp = dest.with_suffix(dest.suffix + '.part')
                  try:
                      with session.get(doc['url'], stream=True, allow_redirects=True, timeout=(20, 300)) as response:
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, 'final', response.url, flush=True)
                          response.raise_for_status()
                          with tmp.open('wb') as fh:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                      size = tmp.stat().st_size
                      with tmp.open('rb') as fh:
                          header = fh.read(8)
                      if size < doc['min_bytes'] or not header.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF: size={size}, header={header!r}')
                      tmp.replace(dest)
                      return str(response.url)
                  except Exception as exc:
                      tmp.unlink(missing_ok=True)
                      errors.append(f'attempt {attempt}: {exc!r}')
                      time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records = []
          seen_hashes = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download(doc, dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(20, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              sample_lower = sample_text.lower()
              if not any(term.lower() in sample_lower for term in ('传音控股', '688036', 'transsion')):
                  raise RuntimeError(f'company identity not found in first pages of {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(digest)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'download_url': final_url,
                  'official_disclosure_page': 'https://www.sse.com.cn/star/market/stocklist/info/company/index.shtml?COMPANY_CODE=688036',
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          notes = [
              '深圳传音控股股份有限公司（688036.SH）2020—2025年年度报告及2026年最新季报/半年报',
              '整理日期：2026-09-27',
              '',
              '收录内容：2020—2025年完整年度报告、2026年第一季度报告、2026年半年度报告。',
              '文件为上海证券交易所披露文件的公开PDF镜像；公司官方披露入口见清单。',
              '所有PDF均完成文件头、文件大小、公司身份、页数、qpdf结构、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              notes.extend([
                  f"{index}. {record['title']}",
                  f"   文件：{record['filename']}",
                  f"   报告期：{record['period']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   下载镜像：{record['download_url']}",
                  f"   官方披露入口：{record['official_disclosure_page']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(notes), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(package_name + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(out.iterdir()):
                  archive.write(path, arcname=f'{package_name}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 8:
                  raise RuntimeError(f'expected 8 PDFs, found {len(pdfs)}')
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: transsion-688036-direct-package-20260927
          path: 传音控股_688036_2020-2025年报及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
