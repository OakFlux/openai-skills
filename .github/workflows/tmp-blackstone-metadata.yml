name: Temporary Blackstone broker report metadata

on:
  push:
    branches:
      - tmp/blackstone-broker-reports-20260829
    paths:
      - .github/workflows/tmp-blackstone-metadata.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Search exact reports and inspect metadata
        run: |
          python - <<'PY'
          import json, re
          import requests

          queries = [
              '黑石集团 光阴卌载 全球资本之王',
              '光阴卌载 全球资本之王是怎样炼成的',
              '黑石集团 全球另类投资巨头',
              '全球另类投资巨头 黑石集团 国信证券',
              '黑石集团 全球领先的另类资管巨头',
              '中金看海外 黑石集团 全球领先的另类资管巨头',
              '黑石 他山之石 可以攻玉',
              '解码黑石 另类资管之王押注全球',
          ]

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/',
          })

          seen = set()
          for query in queries:
              try:
                  r = s.post('https://api.sdyanbao.com/api/file/search', json={'page': 1, 'pageSize': 100, 'keyword': query}, timeout=60)
                  r.raise_for_status()
                  payload = r.json()
                  rows = (payload.get('data') or {}).get('files') or []
                  print('\nQUERY', query, 'COUNT', len(rows))
              except Exception as exc:
                  print('QUERY_ERROR', query, repr(exc))
                  continue

              for row in rows:
                  name = str(row.get('name') or '')
                  norm = re.sub(r'\s+', '', name)
                  if not any(token in norm for token in ['黑石集团', '全球资本之王', '全球另类投资巨头', '另类资管巨头', '他山之石', '解码黑石']):
                      continue
                  rid = row.get('id')
                  if rid in seen:
                      continue
                  seen.add(rid)
                  try:
                      d = s.post('https://api.sdyanbao.com/api/file/detail', json={'id': rid}, timeout=60)
                      d.raise_for_status()
                      dp = d.json()
                      detail = (dp.get('data') or {}) if dp.get('status') == 1 else {}
                  except Exception as exc:
                      detail = {}
                      print('DETAIL_ERROR', rid, repr(exc))

                  summary = {
                      'id': rid,
                      'name': name,
                      'page_count': row.get('page_count') or detail.get('page_count'),
                      'time_text': detail.get('time_text') or row.get('time_text'),
                      'organization': ((detail.get('organization') or {}).get('name') if isinstance(detail.get('organization'), dict) else detail.get('organization')) or ((row.get('organization') or {}).get('name') if isinstance(row.get('organization'), dict) else row.get('organization')),
                      'data_source_uuid': detail.get('data_source_uuid') or row.get('data_source_uuid'),
                      'original_id': detail.get('original_id') or row.get('original_id'),
                      'page_url': detail.get('page_url') or row.get('page_url'),
                      'online_url': detail.get('online_url') or row.get('online_url'),
                      'file_url': detail.get('file_url') or row.get('file_url'),
                      'download_url': detail.get('download_url') or row.get('download_url'),
                      'url': detail.get('url') or row.get('url'),
                      'file_size': detail.get('file_size') or row.get('file_size'),
                      'keys': sorted(detail.keys()),
                  }
                  print('MATCH', json.dumps(summary, ensure_ascii=False))
                  print('DETAIL_JSON', json.dumps(detail, ensure_ascii=False)[:30000])
          PY
