name: Build final BrainAurora 06681 filings package 20260927

on:
  push:
    paths:
      - '.github/workflows/brainaurora-06681-filings-explicit-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download official HKEX PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='脑动极光_06681_全部年报_招股说明书及最新阶段性财务报告'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)

          docs=[
            {
              'order':1,'kind':'annual_report','year':2024,'language':'中文','label':'2024年年度报告中文版',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0428/2025042804406_c.pdf',
              'filename':'01_脑动极光_2024年年度报告_中文版.pdf','min_pages':80,
            },
            {
              'order':1,'kind':'annual_report','year':2024,'language':'English','label':'BrainAurora 2024 Annual Report',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0428/2025042804405.pdf',
              'filename':'01_BrainAurora_2024_Annual_Report_English.pdf','min_pages':80,
            },
            {
              'order':2,'kind':'annual_report','year':2025,'language':'中文','label':'2025年年度报告中文版',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0428/2026042801063_c.pdf',
              'filename':'02_脑动极光_2025年年度报告_中文版.pdf','min_pages':80,
            },
            {
              'order':2,'kind':'annual_report','year':2025,'language':'English','label':'BrainAurora 2025 Annual Report',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0428/2026042801062.pdf',
              'filename':'02_BrainAurora_2025_Annual_Report_English.pdf','min_pages':80,
            },
            {
              'order':3,'kind':'prospectus','year':2024,'language':'中文','label':'最终招股章程中文版（全球发售）',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/1230/2024123000046_c.pdf',
              'filename':'03_脑动极光_最终招股章程_全球发售_中文版.pdf','min_pages':300,
            },
            {
              'order':3,'kind':'prospectus','year':2024,'language':'English','label':'Final Prospectus / Global Offering',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/1230/2024123000045.pdf',
              'filename':'03_BrainAurora_Final_Prospectus_Global_Offering_English.pdf','min_pages':300,
            },
            {
              'order':4,'kind':'latest_interim_results','year':2026,'language':'中文','label':'2026年中期业绩公告中文版',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082803855_c.pdf',
              'filename':'04_脑动极光_2026年中期业绩公告_中文版.pdf','min_pages':5,
            },
            {
              'order':4,'kind':'latest_interim_results','year':2026,'language':'English','label':'2026 Interim Results Announcement',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082803854.pdf',
              'filename':'04_BrainAurora_2026_Interim_Results_Announcement_English.pdf','min_pages':5,
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www1.hkexnews.hk/',
          })

          def fetch(url):
            last=None
            for attempt in range(6):
              try:
                r=s.get(url,timeout=(30,240),allow_redirects=True)
                last={'status':r.status_code,'final_url':r.url,'type':r.headers.get('content-type'),'bytes':len(r.content)}
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>20_000:
                  return r.content,last
              except Exception as e:
                last={'error':repr(e)}
              time.sleep(2+attempt)
            raise RuntimeError(f'download failed {url}: {last}')

          manifest=[]
          for d in docs:
            data,download=fetch(d['url'])
            dest=root/d['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<d['min_pages']:
              raise RuntimeError(f'page count too low for {dest.name}: {pages}')
            text=''
            for p in reader.pages[:4]:
              try: text+='\n'+(p.extract_text() or '')
              except: pass
            identity=(('6681' in text or '06681' in text) and ('BrainAurora' in text or '腦動極光' in text or '脑动极光' in text))
            if not identity:
              raise RuntimeError(f'company identity check failed for {dest.name}')
            subprocess.run(['qpdf','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','100','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10_000:
              raise RuntimeError(f'preview render failed for {dest.name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **d,'pages':pages,'bytes':len(data),'sha256':sha,'download':download,
              'pdf_file':dest.name,'preview_file':str(Path('首页预览')/preview.name),
              'validation':['PDF header','BrainAurora/6681 identity','page count','qpdf structure','first-page render']
            })

          lines=[
            '脑动极光医疗科技有限公司（06681.HK）全部年报、招股说明书及最新阶段性财务报告',
            '整理日期：2026-09-27','',
            '本包收录港交所官方PDF原件，中文和英文版本均已保留。',
            '脑动极光于2025年1月8日在港交所上市。截至整理日，已发布的完整年度报告为2024年及2025年。',
            '截至整理日，港交所尚未发布2026年完整中期报告；本包以2026年8月28日发布的中期业绩公告作为最新阶段性财务披露。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            lines += [
              f"{i}. {m['label']}，{m['pages']}页",
              f"   文件：{m['pdf_file']}",
              f"   港交所来源：{m['url']}",
              f"   SHA-256：{m['sha256']}",'',
            ]
          lines += [
            '“最新季报”按港股披露习惯对应最近一期中期报告或中期业绩公告，并非A股口径的第一季度或第三季度报告。',
            '全部文件已完成PDF文件头、公司名称/股票代码、实际页数、PDF结构和首页渲染检查；压缩包另行进行CRC完整性检查。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  {m['pdf_file']}\n" for m in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failure: '+bad)
            pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if len(pdfs)!=len(docs): raise RuntimeError(f'PDF count mismatch {len(pdfs)} != {len(docs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: brainaurora-06681-filings-explicit-final
          path: 脑动极光_06681_全部年报_招股说明书及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
