name: Inspect public 9fzt report JavaScript
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download report page JavaScript chunks
        run: |
          mkdir -p out
          python - <<'PY'
          import re
          import requests
          from urllib.parse import urljoin
          page='https://gmg.9fzt.com/report/HKSE/01313/780086137443.html'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':page})
          r=s.get(page,timeout=60)
          print('PAGE',r.status_code,len(r.content))
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',r.text,re.I):
              u=urljoin(page,src)
              if '9fzt.com' in u and ('_next/static/chunks' in u or 'production' in u):
                  scripts.append(u)
          scripts=list(dict.fromkeys(scripts))
          print('SCRIPTS',len(scripts))
          for i,u in enumerate(scripts):
              try:
                  x=s.get(u,timeout=60)
                  name=f'{i:02d}_'+re.sub(r'[^A-Za-z0-9._-]+','_',u.split('/')[-1] or 'script.js')
                  open('out/'+name,'wb').write(x.content)
                  print('SCRIPT',x.status_code,len(x.content),u,name)
                  text=x.text
                  for key in ['s3url','reportId','download','pdf','api/report','getReport','research','attachment']:
                      pos=text.lower().find(key.lower())
                      if pos>=0:
                          print('KEY',key,'CTX',text[max(0,pos-500):pos+1600].replace('\n',' ')[:2100])
              except Exception as e:
                  print('ERR',u,repr(e))
          PY
      - name: Upload JavaScript chunks
        uses: actions/upload-artifact@v4
        with:
          name: 9fzt-report-js
          path: out
          retention-days: 1
          compression-level: 0
