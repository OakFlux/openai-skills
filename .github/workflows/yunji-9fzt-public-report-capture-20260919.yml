name: Capture 9fzt public Yunji report 20260919

on:
  push:
    paths:
      - '.github/workflows/yunji-9fzt-public-report-capture-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright pypdf requests
          python -m playwright install --with-deps chromium
      - name: Capture public page and possible PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, hashlib, json, re
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs, unquote
          from pypdf import PdfReader
          from playwright.async_api import async_playwright

          URL='https://gmg.9fzt.com/report/HKSE/02670/829740237518.html'
          OUT=Path('9fzt-output'); OUT.mkdir(exist_ok=True)
          PDF=OUT/'国泰海通证券_云迹02670HK_首次覆盖_技术筑基场景放量全球化启航_2026-04-16.pdf'
          network=[]
          pdf_bodies=[]

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--disable-blink-features=AutomationControlled'])
              context=await browser.new_context(accept_downloads=True,user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',locale='zh-CN',viewport={'width':1440,'height':1000})
              page=await context.new_page()
              async def on_response(resp):
                row={'url':resp.url,'status':resp.status,'content_type':resp.headers.get('content-type',''),'resource_type':resp.request.resource_type}
                network.append(row)
                ct=row['content_type'].lower(); u=row['url'].lower()
                if 'application/pdf' in ct or u.endswith('.pdf') or '.pdf?' in u:
                  try:
                    body=await resp.body()
                    if body.startswith(b'%PDF-'):
                      pdf_bodies.append((resp.url,body))
                  except Exception as e:
                    print('PDF_BODY_ERROR',resp.url,repr(e),flush=True)
              page.on('response',on_response)
              resp=await page.goto(URL,wait_until='domcontentloaded',timeout=120000)
              print('GOTO',resp.status if resp else None,page.url,flush=True)
              await page.wait_for_timeout(10000)
              print('TITLE',await page.title(),flush=True)
              body=(await page.locator('body').inner_text())
              print('BODY_TEXT',body[:30000],flush=True)
              links=await page.locator('a').evaluate_all("els => els.map(e => ({text:(e.innerText||'').trim(),href:e.href}))")
              imgs=await page.locator('img').evaluate_all("els => els.map(e => e.src)")
              frames=[f.url for f in page.frames]
              print('LINKS',json.dumps(links,ensure_ascii=False),flush=True)
              print('IMAGES',json.dumps(imgs,ensure_ascii=False),flush=True)
              print('FRAMES',json.dumps(frames,ensure_ascii=False),flush=True)
              # click any report/PDF/open original links that are visible
              selectors=['a:has-text("报告原文")','a:has-text("查看原文")','a:has-text("下载")','a[href*="pdf"]']
              for sel in selectors:
                try:
                  loc=page.locator(sel).first
                  if await loc.count() and await loc.is_visible():
                    print('CLICKING',sel,await loc.get_attribute('href'),flush=True)
                    try:
                      async with page.expect_download(timeout=30000) as dinfo:
                        await loc.click()
                      dl=await dinfo.value
                      print('DOWNLOAD',dl.suggested_filename,flush=True)
                      await dl.save_as(str(PDF))
                      break
                    except Exception as e:
                      print('CLICK_DOWNLOAD_ERROR',repr(e),flush=True)
                except Exception as e:
                  print('SELECTOR_ERROR',sel,repr(e),flush=True)
              await page.wait_for_timeout(3000)
              for row in network:
                u=row['url'].lower(); ct=row['content_type'].lower()
                if any(k in u for k in ['report','research','news','pdf','s3','oss','document']) or 'application/json' in ct:
                  print('NET',json.dumps(row,ensure_ascii=False),flush=True)
              if not PDF.exists() and pdf_bodies:
                PDF.write_bytes(max(pdf_bodies,key=lambda x:len(x[1]))[1])
              if not PDF.exists():
                # Try public links found in anchors, iframe URLs, or query parameters.
                candidates=[]
                for item in links:
                  href=item.get('href') or ''
                  if '.pdf' in href.lower(): candidates.append(href)
                for f in frames:
                  if '.pdf' in f.lower(): candidates.append(f)
                  qs=parse_qs(urlparse(f).query)
                  for vals in qs.values():
                    for v in vals:
                      v=unquote(v)
                      if '.pdf' in v.lower(): candidates.append(v)
                print('CANDIDATES',json.dumps(candidates,ensure_ascii=False),flush=True)
                for cand in candidates:
                  try:
                    rr=await context.request.get(cand,headers={'Referer':URL},timeout=120000)
                    dat=await rr.body()
                    print('CANDIDATE',rr.status,len(dat),cand,(await rr.all_headers()).get('content-type'),flush=True)
                    if rr.status==200 and dat.startswith(b'%PDF-'):
                      PDF.write_bytes(dat); break
                  except Exception as e:
                    print('CANDIDATE_ERROR',cand,repr(e),flush=True)
              await page.screenshot(path=str(OUT/'page.png'),full_page=True)
              (OUT/'network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
              (OUT/'links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
              await browser.close()
          asyncio.run(main())
          if PDF.exists():
            data=PDF.read_bytes(); print('PDF_HEAD',data[:8],len(data),hashlib.sha256(data).hexdigest(),flush=True)
            if data.startswith(b'%PDF-'):
              print('PDF_PAGES',len(PdfReader(str(PDF),strict=False).pages),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yunji-9fzt-public-capture
          path: 9fzt-output
          retention-days: 7
          if-no-files-found: error
