name: Archive Hibor report pages for endpoint inspection

on:
  push:
    paths:
      - '.github/workflows/kaichuang-hibor-pages-artifact-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch report pages and JavaScript assets
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          targets = {
              '178938': 'https://www.hibor.com.cn/data/86cb65196d867327037925fca45f29f1.html',
              '182952': 'https://www.hibor.com.cn/data/a6a66e7cdadd4411c00401333696741a.html',
              '209931': 'https://www.hibor.com.cn/data/8c2d02a32cf69b08a33a8ac867654bec.html',
              '211932': 'https://www.hibor.com.cn/data/f74b5c44327c5979d9937c690a722386.html',
          }
          out = Path('hibor_inspection')
          out.mkdir(exist_ok=True)
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.hibor.com.cn/',
          })
          summary = []
          downloaded_scripts = {}
          for rid, url in targets.items():
              r = s.get(url, timeout=60, allow_redirects=True)
              r.raise_for_status()
              enc = r.apparent_encoding or r.encoding or 'utf-8'
              text = r.content.decode(enc, errors='replace')
              page_file = out / f'{rid}_page.html'
              page_file.write_text(text, encoding='utf-8')
              soup = BeautifulSoup(text, 'lxml')
              scripts = []
              for tag in soup.find_all('script', src=True):
                  src = urljoin(r.url, tag.get('src'))
                  scripts.append(src)
                  if src in downloaded_scripts:
                      continue
                  try:
                      sr = s.get(src, timeout=60, allow_redirects=True)
                      name = re.sub(r'[^A-Za-z0-9._-]+', '_', urlparse(sr.url).path.strip('/') or 'script')[-180:]
                      if not name.endswith('.js'):
                          name += '.js'
                      idx = len(downloaded_scripts) + 1
                      script_file = out / f'script_{idx:03d}_{name}'
                      script_file.write_bytes(sr.content)
                      downloaded_scripts[src] = {
                          'file': script_file.name,
                          'status': sr.status_code,
                          'final_url': sr.url,
                          'content_type': sr.headers.get('content-type'),
                          'bytes': len(sr.content),
                      }
                  except Exception as exc:
                      downloaded_scripts[src] = {'error': repr(exc)}
              inline = []
              for i, tag in enumerate(soup.find_all('script')):
                  if not tag.get('src') and tag.string:
                      body = str(tag.string)
                      if body.strip():
                          fn = out / f'{rid}_inline_{i:03d}.js'
                          fn.write_text(body, encoding='utf-8')
                          inline.append(fn.name)
              forms = []
              for form in soup.find_all('form'):
                  forms.append({
                      'action': urljoin(r.url, form.get('action') or ''),
                      'method': form.get('method'),
                      'id': form.get('id'),
                      'class': form.get('class'),
                  })
              attrs = []
              for tag in soup.find_all(True):
                  rec = {'tag': tag.name}
                  for key in ('href','src','action','onclick','data-url','data-src','data-id','data-file','data-report-id','data-doc-id','value'):
                      if tag.get(key) is not None:
                          rec[key] = tag.get(key)
                  if len(rec) > 1:
                      attrs.append(rec)
              summary.append({
                  'id': rid,
                  'requested_url': url,
                  'final_url': r.url,
                  'status': r.status_code,
                  'content_type': r.headers.get('content-type'),
                  'encoding': enc,
                  'bytes': len(r.content),
                  'title': soup.title.get_text(' ', strip=True) if soup.title else '',
                  'scripts': scripts,
                  'inline_files': inline,
                  'forms': forms,
                  'attrs': attrs,
              })
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'scripts.json').write_text(json.dumps(downloaded_scripts, ensure_ascii=False, indent=2), encoding='utf-8')
          print('ARCHIVED_PAGES', len(summary), 'SCRIPTS', len(downloaded_scripts), flush=True)
          PY

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaichuang-hibor-inspection-20261014
          path: hibor_inspection
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
