name: Fast extract Huatai CCCC report link 20260927

on:
  push:
    paths:
      - '.github/workflows/htsc-link-first-fast-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install --quiet requests pypdf pymupdf
      - shell: bash
        run: |
          python - <<'PY'
          import json, requests, fitz
          from pathlib import Path
          u='https://crm.htsc.com.cn/doc/2020/10720402/5781e194-86f3-4e96-bec8-0fbaa36ee33f.pdf'
          s=requests.Session(); s.trust_env=False; s.headers['User-Agent']='Mozilla/5.0'
          r=s.get(u,timeout=(15,45)); print('GET',r.status_code,len(r.content),flush=True); r.raise_for_status()
          p=Path('w.pdf'); p.write_bytes(r.content)
          d=fitz.open(str(p))
          for i,page in enumerate(d):
            for link in page.get_links():
              if link.get('uri'):
                print('LINK',i,json.dumps(link,ensure_ascii=False,default=str),flush=True)
          PY
