name: Inspect bearing reports 20261005
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-bearing-reports-20261005.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query metadata
        run: |
          python - <<'PY'
          import json
          import requests
          s=requests.Session()
          s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          api='https://reportapi.eastmoney.com/report/list'
          for begin,end in [('2025-06-07','2025-06-10'),('2022-05-30','2022-06-03'),('2022-02-26','2022-03-02'),('2022-10-10','2022-10-24')]:
              params={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              r=s.get(api,params=params,timeout=120)
              print('STATUS',begin,end,r.status_code,len(r.content))
              r.raise_for_status()
              rows=r.json().get('data') or []
              print('COUNT',len(rows))
              for row in rows:
                  title=str(row.get('title') or '')
                  if '轴承' in title or '雷迪克' in title:
                      print('MATCH',json.dumps(row,ensure_ascii=False))
          PY
