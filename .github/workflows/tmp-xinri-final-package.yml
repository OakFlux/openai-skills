name: Temporary Xinri final annual report package

on:
  push:
    branches:
      - tmp/xinri-annual-reports-20260829
    paths:
      - .github/workflows/tmp-xinri-final-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF beautifulsoup4
      - name: Resolve 2020 annual report and package all official PDFs
        run: |
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import pymupdf
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('xinri_final')
          PDFDIR = OUT / 'pdfs'
          RENDERDIR = OUT / 'renders'
          for p in (OUT, PDFDIR, RENDERDIR):
              p.mkdir(parents=True, exist_ok=True)

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Origin': 'https://www.cninfo.com.cn',
              'Referer': 'https://www.cninfo.com.cn/',
              'X-Requested-With': 'XMLHttpRequest',
          })
          logs = []
          def note(*parts):
              line = ' '.join(str(x) for x in parts)
              print(line, flush=True)
              logs.append(line)

          def clean_title(title: str) -> str:
              return re.sub(r'<[^>]+>', '', title or '').replace('&nbsp;', ' ').strip()

          # Resolve the one older attachment omitted from the category index.
          endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
          candidates = []
          query_variants = [
              {'column':'sse','plate':'sh','stock':'603787,9900024502','searchkey':'2020年年度报告','category':'','seDate':'2021-04-20~2021-04-30'},
              {'column':'sse','plate':'sh','stock':'603787,9900024502','searchkey':'','category':'','seDate':'2021-04-20~2021-04-30'},
              {'column':'sse','plate':'sh','stock':'','searchkey':'新日股份 2020年年度报告','category':'','seDate':'2021-04-20~2021-04-30'},
              {'column':'shse','plate':'sh','stock':'603787,9900024502','searchkey':'2020年年度报告','category':'','seDate':'2021-04-20~2021-04-30'},
          ]
          for q in query_variants:
              data = {
                  'pageNum':'1','pageSize':'100','tabName':'fulltext','secid':'','trade':'',
                  'sortName':'time','sortType':'desc','isHLtitle':'true', **q,
              }
              try:
                  r = s.post(endpoint, data=data, timeout=60)
                  rows = r.json().get('announcements') or [] if r.ok else []
                  note('QUERY_2020', json.dumps(q,ensure_ascii=False), r.status_code, len(rows), r.text[:180])
                  for row in rows:
                      title = clean_title(row.get('announcementTitle') or '')
                      if str(row.get('secCode') or '') == '603787' and '2020年年度报告' in title and '摘要' not in title and row.get('adjunctUrl'):
                          candidates.append(row)
              except Exception as exc:
                  note('QUERY_2020_ERROR', repr(exc))

          # Sina metadata fallback: use the detail page only to discover the official/archived attachment URL.
          if not candidates:
              try:
                  page_url = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/603787/page_type/ndbg.phtml'
                  r = s.get(page_url, timeout=60, headers={'Referer':'https://vip.stock.finance.sina.com.cn/'})
                  soup = BeautifulSoup(r.text, 'html.parser')
                  links = []
                  for a in soup.find_all('a'):
                      label = a.get_text(' ', strip=True)
                      href = a.get('href')
                      if href and '2020年年度报告' in label and '摘要' not in label:
                          links.append(urljoin(r.url, href))
                  note('SINA_2020_LINKS', json.dumps(links, ensure_ascii=False))
                  for link in links:
                      d = s.get(link, timeout=60, allow_redirects=True, headers={'Referer':r.url})
                      text = d.text.replace('\\/','/')
                      for match in re.findall(r'https?://[^\s"\'<>]+(?:\.PDF|\.pdf)[^\s"\'<>]*', text):
                          candidates.append({'announcementTitle':'2020年年度报告','adjunctUrl':match,'announcementTime':1619193600000,'_absolute':True})
                      # Sina report-detail routes sometimes expose the original file through /url.
                      for alt in [link.rstrip('/') + '/url', link.replace('/index.phtml','/url')]:
                          try:
                              z = s.get(alt, timeout=60, allow_redirects=True, headers={'Referer':link})
                              if z.status_code == 200 and z.content.lstrip().startswith(b'%PDF') and len(z.content) > 100000:
                                  tmp = OUT / 'sina_2020_direct.pdf'; tmp.write_bytes(z.content)
                                  candidates.append({'announcementTitle':'2020年年度报告','adjunctUrl':z.url,'announcementTime':1619193600000,'_absolute':True,'_bytes':z.content})
                          except Exception:
                              pass
              except Exception as exc:
                  note('SINA_FALLBACK_ERROR', repr(exc))

          if not candidates:
              raise RuntimeError('Unable to resolve the 2020 annual report attachment')
          candidates.sort(key=lambda x:int(x.get('announcementTime') or 0), reverse=True)
          row2020 = candidates[0]
          note('RESOLVED_2020', clean_title(row2020.get('announcementTitle') or ''), row2020.get('adjunctUrl'))

          reports = [
              {'kind':'annual','year':2020,'label':'2020年年度报告','row':row2020},
              {'kind':'annual','year':2021,'label':'2021年年度报告','adjunct':'finalpage/2022-04-30/1213272387.PDF','announcement_date':'2022-04-30'},
              {'kind':'annual','year':2022,'label':'2022年年度报告','adjunct':'finalpage/2023-04-18/1216438106.PDF','announcement_date':'2023-04-18'},
              {'kind':'annual','year':2023,'label':'2023年年度报告','adjunct':'finalpage/2024-04-26/1219821056.PDF','announcement_date':'2024-04-26'},
              {'kind':'annual','year':2024,'label':'2024年年度报告','adjunct':'finalpage/2025-04-26/1223315393.PDF','announcement_date':'2025-04-26'},
              {'kind':'annual','year':2025,'label':'2025年年度报告','adjunct':'finalpage/2026-04-25/1225176112.PDF','announcement_date':'2026-04-25'},
              {'kind':'interim','year':2026,'label':'2026年半年度报告','adjunct':'finalpage/2026-08-27/1225509804.PDF','announcement_date':'2026-08-27'},
          ]

          records = []
          for item in reports:
              data = None; source_url = None; ann_date = item.get('announcement_date','')
              if item.get('row'):
                  row = item['row']
                  ts = int(row.get('announcementTime') or 0)
                  if ts:
                      ann_date = dt.datetime.fromtimestamp(ts/1000,tz=dt.timezone(dt.timedelta(hours=8))).strftime('%Y-%m-%d')
                  if row.get('_bytes'):
                      data = row['_bytes']; source_url = str(row.get('adjunctUrl'))
                  else:
                      adjunct = str(row.get('adjunctUrl') or '')
                      urls = [adjunct] if row.get('_absolute') or adjunct.startswith('http') else [f'https://static.cninfo.com.cn/{adjunct.lstrip("/")}', f'http://static.cninfo.com.cn/{adjunct.lstrip("/")}']
              else:
                  adjunct = item['adjunct']
                  urls = [f'https://static.cninfo.com.cn/{adjunct}', f'http://static.cninfo.com.cn/{adjunct}']
              if data is None:
                  for url in urls:
                      try:
                          r = s.get(url, timeout=120, allow_redirects=True, headers={'Referer':'https://www.cninfo.com.cn/','Accept':'application/pdf,*/*;q=0.8'})
                          note('DOWNLOAD', item['label'], r.status_code, len(r.content), r.headers.get('content-type'), r.url)
                          if r.status_code == 200 and r.content.lstrip().startswith(b'%PDF') and len(r.content) > 100000:
                              data = r.content; source_url = r.url; break
                      except Exception as exc:
                          note('DOWNLOAD_ERROR', item['label'], url, repr(exc))
              if data is None:
                  raise RuntimeError(f'Failed to download {item["label"]}')

              filename = f'新日股份_{item["label"]}.pdf'
              path = PDFDIR / filename
              path.write_bytes(data)
              doc = pymupdf.open(str(path)); pages = doc.page_count
              if pages < 30:
                  raise RuntimeError(f'{filename} unexpectedly short: {pages} pages')
              indices = sorted(set([0,1,min(5,pages-1),pages//2,pages-1]))
              text = '\n'.join(doc.load_page(i).get_text('text') for i in indices)
              compact = re.sub(r'\s+','',text)
              if not any(k in compact for k in ['新日股份','江苏新日电动车股份有限公司','江苏新日','603787']):
                  raise RuntimeError(f'Company identity check failed: {filename}')
              for label,idx in [('first',0),('last',pages-1)]:
                  pix=doc.load_page(idx).get_pixmap(matrix=pymupdf.Matrix(.8,.8),alpha=False)
                  pix.save(str(RENDERDIR/f'{item["year"]}_{item["kind"]}_{label}.png'))
              encrypted=bool(doc.is_encrypted); doc.close()
              rec={'file':filename,'type':item['kind'],'report_year':item['year'],'title':item['label'],'announcement_date':ann_date,'pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'encrypted':encrypted,'source_url':source_url}
              records.append(rec); note('VALIDATED',json.dumps(rec,ensure_ascii=False))

          if len(records)!=7 or len({r['sha256'] for r in records})!=7:
              raise RuntimeError('Final report-count or duplicate-content check failed')
          records.sort(key=lambda r:(r['report_year'],0 if r['type']=='annual' else 1))
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          read=['新日股份（603787.SH）2020—2025年年度报告及2026年半年度报告','',f'文件数量：{len(records)}份完整PDF','来源：巨潮资讯网官方公告附件','']
          for i,r in enumerate(records,1): read.append(f"{i}. {r['title']}｜公告日期：{r['announcement_date']}｜{r['pages']}页")
          read += ['','核验：已检查PDF文件头、实际页数、报告主体、加密状态及首尾页渲染；ZIP完整性测试通过。','版权归上市公司及公告发布平台所有，仅供研究参考。']
          (OUT/'README.txt').write_text('\n'.join(read),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['file']}" for r in records)+'\n',encoding='utf-8')
          (OUT/'download_log.txt').write_text('\n'.join(logs),encoding='utf-8')

          zip_path=OUT/'xinri_reports_2020_2025_2026H1.zip'
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(PDFDIR.glob('*.pdf')): z.write(p,p.name)
              for n in ['README.txt','manifest.json','SHA256SUMS.txt']: z.write(OUT/n,n)
          with zipfile.ZipFile(zip_path) as z:
              if z.testzip(): raise RuntimeError('ZIP integrity test failed')
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=7: raise RuntimeError('ZIP PDF count failed')
          note('FINAL_ZIP',zip_path,zip_path.stat().st_size)
          print('\n'.join(read))
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: xinri-final-annual-reports
          path: xinri_final/
          retention-days: 3
          if-no-files-found: error
