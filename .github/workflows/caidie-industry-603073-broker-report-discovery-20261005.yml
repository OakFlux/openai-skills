name: Discover CaiDie Industry broker reports 20261005

on:
  push:
    paths:
      - '.github/workflows/caidie-industry-603073-broker-report-discovery-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Query public research-report index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          from typing import Any
          import requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url: str, payload: dict[str, Any]) -> dict[str, Any]:
              last: Any = None
              for attempt in range(6):
                  try:
                      r = session.post(url, json=payload, timeout=(20, 100))
                      last = {'status':r.status_code, 'text':r.text[:500]}
                      if r.status_code == 200:
                          return r.json()
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'{url}: {last}')

          def collect_records(obj: Any) -> list[dict[str, Any]]:
              found: list[dict[str, Any]] = []
              def walk(x: Any) -> None:
                  if isinstance(x, dict):
                      if isinstance(x.get('id'), int) and isinstance(x.get('name'), str):
                          found.append(x)
                      for v in x.values():
                          walk(v)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v)
              walk(obj)
              return list({int(r['id']): r for r in found}.values())

          queries = [
              '彩蝶实业', '603073', '彩蝶实业 深度报告', '彩蝶实业 首次覆盖',
              '彩蝶实业 公司深度', '浙江彩蝶实业', '涤纶长丝 彩蝶实业',
              '差别化纤维 彩蝶实业', '无缝成衣 彩蝶实业'
          ]
          raw: dict[str, Any] = {}
          records: dict[int, dict[str, Any]] = {}
          for q in queries:
              payload = {
                  'device':1,'hideTrader':0,'onlyTitle':1,'order':0,
                  'page':1,'pageSize':100,'keyword':q,'pageCount':0,
                  'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''
              }
              try:
                  data = post_json('https://api.sdyanbao.com/api/file/search', payload)
                  raw[q] = data
                  for rec in collect_records(data):
                      records[int(rec['id'])] = rec
              except Exception as exc:
                  raw[q] = {'error':repr(exc)}
              time.sleep(0.12)

          phrases = ('彩蝶实业', '603073', '浙江彩蝶', '差别化纤维', '无缝成衣')
          candidates = []
          for rid, rec in records.items():
              name = str(rec.get('name') or '')
              if any(p in name for p in phrases):
                  candidates.append((rid, rec))
          candidates.sort(reverse=True)
          candidates = candidates[:80]

          details = []
          for rid, rec in candidates:
              try:
                  response = post_json('https://api.sdyanbao.com/api/file/detail', {'id':rid})
                  data = response.get('data') if isinstance(response, dict) else None
                  if not isinstance(data, dict):
                      data = {}
                  details.append({'record':rec, 'detail':data})
              except Exception as exc:
                  details.append({'record':rec, 'detail':{}, 'error':repr(exc)})
              time.sleep(0.07)

          summary = []
          for item in details:
              rec = item.get('record') if isinstance(item.get('record'), dict) else {}
              detail = item.get('detail') if isinstance(item.get('detail'), dict) else {}
              typ = rec.get('type')
              record_type = typ.get('name') if isinstance(typ, dict) else typ
              summary.append({
                  'id':rec.get('id'),
                  'name':rec.get('name'),
                  'time_text':rec.get('time_text'),
                  'record_page_count':rec.get('page_count'),
                  'record_type':record_type,
                  'detail_name':detail.get('name'),
                  'detail_page_count':detail.get('page_count'),
                  'page_url':detail.get('page_url'),
                  'data_source':detail.get('data_source'),
                  'publish_time':detail.get('publish_time'),
                  'file_size':detail.get('file_size'),
                  'original_id':detail.get('original_id'),
                  'error':item.get('error'),
              })
          summary.sort(key=lambda x:(str(x.get('publish_time') or x.get('time_text') or ''), int(x.get('id') or 0)), reverse=True)

          Path('out/search_raw.json').write_text(json.dumps(raw, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('out/details.json').write_text(json.dumps(details, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('out/summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: caidie-industry-603073-broker-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
