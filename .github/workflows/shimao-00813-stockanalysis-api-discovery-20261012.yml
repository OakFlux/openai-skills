name: Inspect StockAnalysis filing API data 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-stockanalysis-api-discovery-20261012.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect embedded filing data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import re, requests
          url='https://stockanalysis.com/filings/HKG:0813/'
          s=requests.Session(); s.trust_env=False
          r=s.get(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'},timeout=60)
          text=r.text
          print('STATUS',r.status_code,'LEN',len(text),flush=True)
          ids=['3686208','2802513','1877899','1877891','1877883','1877875','1877873']
          for fid in ids:
              print('\n=== ID',fid,'===',flush=True)
              start=0
              count=0
              while True:
                  idx=text.find(fid,start)
                  if idx<0: break
                  count+=1
                  print('OCC',count,text[max(0,idx-1200):idx+2500],flush=True)
                  start=idx+len(fid)
                  if count>=10: break
          print('\n=== URL PATTERNS ===',flush=True)
          patterns=[
              r'https?://[^\"\'<> ]+',
              r'/(?:api|filings|documents|document|pdf|files|download)[^\"\'<> ]+',
              r'[^\"\'<> ]+\.pdf[^\"\'<> ]*',
          ]
          for pat in patterns:
              vals=[]
              for m in re.findall(pat,text,re.I):
                  if isinstance(m,tuple): m=' '.join(m)
                  if m not in vals: vals.append(m)
              print('PAT',pat,'COUNT',len(vals),flush=True)
              for v in vals:
                  low=v.lower()
                  if any(k in low for k in ['filing','document','pdf','api','download','stockanalysis']):
                      print('MATCH',v[:1000],flush=True)
          for key in ['filingId','filing_id','documentUrl','document_url','pdfUrl','pdf_url','downloadUrl','download_url','sourceUrl','source_url']:
              if key in text:
                  print('KEY_FOUND',key,flush=True)
          PY
