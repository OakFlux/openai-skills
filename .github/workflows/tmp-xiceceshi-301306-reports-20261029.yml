name: Build Xiceceshi 301306 disclosure package

on:
  push:
    branches:
      - tmp-xiceceshi-301306-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='西测测试_301306_全部年报_招股说明书_最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/xiceceshi_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('西测测试_301306_全部年报_招股说明书_最新季报')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          documents = [
              {
                  'order': 1,
                  'kind': 'prospectus',
                  'year': 2022,
                  'title': '首次公开发行股票并在创业板上市招股说明书',
                  'date': '2022-07-21',
                  'file': '01_西测测试_首次公开发行股票并在创业板上市招股说明书_2022-07-21.pdf',
                  'min_pages': 300,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?id=8374203&stockid=301306',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2022/2022-7/2022-07-21/8374203.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2022/2022-7/2022-07-21/8374203.PDF',
                  ],
              },
              {
                  'order': 2,
                  'kind': 'annual',
                  'year': 2022,
                  'title': '2022年年度报告',
                  'date': '2023-04-26',
                  'file': '02_西测测试_2022年年度报告.pdf',
                  'min_pages': 100,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9079904&stockid=301306',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-26/9079904.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-26/9079904.PDF',
                  ],
              },
              {
                  'order': 3,
                  'kind': 'annual',
                  'year': 2023,
                  'title': '2023年年度报告',
                  'date': '2024-04-25',
                  'file': '03_西测测试_2023年年度报告.pdf',
                  'min_pages': 100,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10055500&stockid=301306',
                  'urls': [
                      'https://disc.static.szse.cn/disc/disk03/finalpage/2024-04-24/8a75d0d5-fbf3-45cf-9d87-d9e1c3c942e5.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-25/10055500.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-25/10055500.PDF',
                  ],
              },
              {
                  'order': 4,
                  'kind': 'annual',
                  'year': 2024,
                  'title': '2024年年度报告',
                  'date': '2025-04-28',
                  'file': '04_西测测试_2024年年度报告.pdf',
                  'min_pages': 100,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=11016857&stockid=301306',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-28/11016857.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-28/11016857.PDF',
                  ],
              },
              {
                  'order': 5,
                  'kind': 'annual',
                  'year': 2025,
                  'title': '2025年年度报告',
                  'date': '2026-04-28',
                  'file': '05_西测测试_2025年年度报告.pdf',
                  'min_pages': 100,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12233485&stockid=301306',
                  'urls': [
                      'https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-28/e7ffc7a2-e0b9-4b08-8ff7-880d191bc0f4.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-28/12233485.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-28/12233485.PDF',
                  ],
              },
              {
                  'order': 6,
                  'kind': 'quarter',
                  'year': 2026,
                  'title': '2026年第三季度报告',
                  'date': '2026-10-29',
                  'file': '06_西测测试_2026年第三季度报告.pdf',
                  'min_pages': 5,
                  'detail': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12670651&stockid=301306',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-29/12670651.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-29/12670651.PDF',
                  ],
              },
          ]

          def extract_pdf_urls(page_url: str) -> list[str]:
              urls: list[str] = []
              try:
                  response = session.get(page_url, timeout=(30, 180), allow_redirects=True)
                  if response.status_code != 200:
                      return []
                  response.encoding = response.apparent_encoding or response.encoding or 'utf-8'
                  decoded = html.unescape(response.text).replace('\\/', '/')
                  soup = BeautifulSoup(decoded, 'html.parser')
                  for anchor in soup.find_all('a', href=True):
                      href = html.unescape(anchor.get('href', '')).strip().replace('\\/', '/')
                      label = re.sub(r'\s+', '', anchor.get_text(' ', strip=True))
                      if '.pdf' in href.lower() or '下载公告' in label or '查看PDF' in label or '下载PDF' in label:
                          urls.append(urljoin(response.url, href))
                  for match in re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?', decoded, flags=re.I):
                      urls.append(html.unescape(match))
              except Exception as exc:
                  print('DETAIL EXTRACTION FAILED', page_url, repr(exc))
              normalized: list[str] = []
              seen = set()
              for url in urls:
                  if url.startswith('//'):
                      url = 'https:' + url
                  if url.startswith('http://'):
                      url = 'https://' + url[7:]
                  if url not in seen:
                      seen.add(url)
                      normalized.append(url)
              return normalized

          def inspect(path: Path, document: dict) -> tuple[int, str]:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < int(document['min_pages']):
                  raise RuntimeError(f'page count below minimum: {pages}')
              indexes = list(range(min(20, pages)))
              if pages > 20:
                  indexes.append(pages - 1)
              text = ''
              for index in dict.fromkeys(indexes):
                  try:
                      text += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '西测测试' not in compact and '西安西测测试技术股份有限公司' not in compact:
                  raise RuntimeError('company name mismatch')
              if document['kind'] == 'prospectus':
                  if '招股说明书' not in compact or '首次公开发行股票' not in compact:
                      raise RuntimeError('prospectus title mismatch')
              elif document['kind'] == 'annual':
                  year = str(document['year'])
                  if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                      raise RuntimeError('annual report title mismatch')
              else:
                  if ('第三季度报告' not in compact and '三季度报告' not in compact) or '2026' not in compact:
                      raise RuntimeError('quarterly report title mismatch')
              return pages, compact

          def download(document: dict) -> dict:
              destination = out / document['file']
              candidates = list(document.get('urls', []))
              candidates.extend(extract_pdf_urls(document['detail']))
              candidates = list(dict.fromkeys(candidates))
              last = None
              for url in candidates:
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'Referer': document['detail'],
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(
                                  f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          pages, _ = inspect(destination, document)
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', document['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return {
                              **document,
                              'pages': pages,
                              'bytes': len(data),
                              'source': response.url,
                              'sha256': sha,
                          }
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', document['title'], url, repr(exc))
                          time.sleep(min(1 + attempt, 3))
              raise RuntimeError(f'Could not download {document["title"]}: {last!r}')

          records = [download(document) for document in documents]
          records.sort(key=lambda item: item['order'])

          lines = [
              '西测测试（301306）全部年度报告、招股说明书及最新季报资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：',
              '1. 公司于2022年7月26日在深交所创业板上市，上市后完整年度报告自2022年度起披露；本包收录2022-2025年度报告全文，共4份。',
              '2. 收录2022年7月21日披露的首次公开发行股票并在创业板上市招股说明书正式发行版。',
              '3. 最新季报为2026年10月29日披露的2026年第三季度报告。',
              '4. 未收录年度报告摘要、半年度报告、招股意向书、申报稿、注册稿或其他临时公告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['file']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   原始PDF：{item['source']}",
                  f"   公告/索引页：{item['detail']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['file']}")
          lines += [
              f'合计：6份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件均已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 6
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '西测测试|西安西测测试技术股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/xiceceshi_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/xiceceshi_test.zip "$PACKAGE"
          unzip -t /tmp/xiceceshi_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/xiceceshi_test.zip | grep -c '\.pdf$')" -eq 6
          rm -f /tmp/xiceceshi_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Xiceceshi-301306-all-annual-reports-prospectus-latest-quarter
          path: 西测测试_301306_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
