name: Build Huayou Cobalt 603799 reports package v2 20260927

on:
  push:
    paths:
      - '.github/workflows/huayou-cobalt-603799-reports-final-v2-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE = '华友钴业_603799_2020-2025年报及最新季报'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)

          specs = [
              {'key':'2020年年度报告','type':'年度报告','period':'2020','filename':'01_华友钴业_2020年年度报告.pdf','min_pages':80},
              {'key':'2021年年度报告','type':'年度报告','period':'2021','filename':'02_华友钴业_2021年年度报告.pdf','min_pages':80},
              {'key':'2022年年度报告','type':'年度报告','period':'2022','filename':'03_华友钴业_2022年年度报告.pdf','min_pages':80},
              {'key':'2023年年度报告','type':'年度报告','period':'2023','filename':'04_华友钴业_2023年年度报告.pdf','min_pages':80},
              {'key':'2024年年度报告','type':'年度报告','period':'2024','filename':'05_华友钴业_2024年年度报告.pdf','min_pages':80},
              {'key':'2025年年度报告','type':'年度报告','period':'2025','filename':'06_华友钴业_2025年年度报告.pdf','min_pages':80},
              {'key':'2026年第一季度报告','type':'第一季度报告','period':'2026Q1','filename':'07_华友钴业_2026年第一季度报告_最新季报.pdf','min_pages':5},
              {'key':'2026年半年度报告','type':'半年度报告','period':'2026H1','filename':'08_华友钴业_2026年半年度报告_最新阶段性报告.pdf','min_pages':25},
          ]
          keys = [s['key'] for s in specs]

          session = requests.Session(); session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer':'https://data.eastmoney.com/notices/stock/603799.html',
              'Accept':'application/json,text/plain,*/*',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows = []
          search_pages = []
          for page in range(1, 81):
              params = {'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':'603799','f_node':'0','s_node':'0'}
              last = None
              for attempt in range(5):
                  try:
                      r = session.get(api, params=params, timeout=(20,90))
                      last = (r.status_code, r.text[:200])
                      if r.status_code == 200:
                          payload = r.json(); break
                  except Exception as exc:
                      last = repr(exc)
                  time.sleep(1 + attempt)
              else:
                  raise RuntimeError(f'Announcement API failed page {page}: {last}')
              rows = ((payload.get('data') or {}).get('list') or [])
              search_pages.append({'page':page,'count':len(rows)})
              if not rows:
                  break
              all_rows.extend(rows)
              raw_found = set()
              for row in all_rows:
                  title = re.sub(r'\s+','',str(row.get('title') or ''))
                  if '摘要' in title:
                      continue
                  for key in keys:
                      if key in title:
                          raw_found.add(key)
              if len(raw_found) == len(keys):
                  break
              time.sleep(0.12)

          def title_score(title: str, key: str) -> int:
              t = re.sub(r'\s+', '', title or '')
              if key not in t:
                  return -1000
              if any(x in t for x in ['摘要','英文版','取消','问询','回复','审计报告','董事会','监事会','更正公告','提示性公告']):
                  return -1000
              score = 20
              if t.endswith(key): score += 30
              if t.endswith(key+'（修订稿）') or t.endswith(key+'(修订稿)'): score += 35
              if t.startswith('华友钴业') or t.startswith('浙江华友钴业股份有限公司'): score += 10
              if '修订' in t: score += 3
              if t.startswith('关于'): score -= 20
              return score

          selected = {}; candidates_log = {}
          for spec in specs:
              candidates = []
              for row in all_rows:
                  title = str(row.get('title') or '')
                  score = title_score(title, spec['key'])
                  if score > -1000:
                      candidates.append((score,row))
              candidates.sort(key=lambda x:(x[0],str(x[1].get('display_time') or '')),reverse=True)
              candidates_log[spec['key']] = [{'score':s,'title':r.get('title'),'display_time':r.get('display_time'),'art_code':r.get('art_code') or r.get('artCode')} for s,r in candidates[:10]]
              if not candidates:
                  available = [str(r.get('title') or '') for r in all_rows if spec['key'][:5] in str(r.get('title') or '')][:20]
                  raise RuntimeError(f'Missing report: {spec["key"]}; nearby titles={available}')
              selected[spec['key']] = candidates[0][1]

          manifest = []
          for spec in specs:
              row = selected[spec['key']]
              art = str(row.get('art_code') or row.get('artCode') or '')
              if not art:
                  raise RuntimeError(f'No art_code for {spec["key"]}')
              mirror = f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf'
              detail_page = f'https://data.eastmoney.com/notices/detail/603799/{art}.html'
              pdf_data = None; last = None
              for attempt in range(6):
                  try:
                      rr = session.get(mirror, timeout=(30,300), allow_redirects=True, headers={
                          'User-Agent':session.headers['User-Agent'],
                          'Referer':detail_page,
                          'Accept':'application/pdf,*/*;q=0.8',
                      })
                      last = {'status':rr.status_code,'final_url':rr.url,'content_type':rr.headers.get('content-type',''),'bytes':len(rr.content)}
                      if rr.status_code == 200 and rr.content[:5] == b'%PDF-' and len(rr.content) > 50_000:
                          pdf_data = rr.content; break
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(2 + attempt)
              if pdf_data is None:
                  raise RuntimeError(f'PDF download failed {spec["key"]}: {last}')

              dest = root / spec['filename']; dest.write_bytes(pdf_data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {dest.name}: {pages}')
              extracted = ''
              for p in reader.pages[:min(5,pages)]:
                  try: extracted += '\n' + (p.extract_text() or '')
                  except Exception: pass
              identity_ok = ('华友钴业' in extracted) or ('603799' in extracted) or ('HUAYOU' in extracted.upper())
              subprocess.run(['qpdf','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix = preview_dir / dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview = Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview failed {dest.name}')
              sha = hashlib.sha256(pdf_data).hexdigest()
              manifest.append({
                  **spec,
                  'announcement_title':row.get('title'),
                  'announcement_date':row.get('display_time'),
                  'art_code':art,
                  'announcement_detail_page':detail_page,
                  'mirror_pdf_url':mirror,
                  'official_sse_index':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=603799',
                  'actual_pages':pages,
                  'bytes':len(pdf_data),
                  'sha256':sha,
                  'identity_text_check':identity_ok,
                  'preview_file':str(Path('首页预览')/preview.name),
                  'validation':['PDF header','announcement-title match','minimum page count','qpdf structure','first-page render'],
              })

          readme = [
              '浙江华友钴业股份有限公司（603799.SH）2020-2025年报及最新季报资料包',
              '整理日期：2026-09-27',
              '',
              '文件范围：2020-2025年度报告（6份）、2026年第一季度报告（最新季报）及2026年半年度报告（最新完整阶段性报告）。',
              '',
              '来源说明：公告标题及披露记录通过上市公司公告索引匹配；PDF从可访问的公告镜像下载，并与对应公告代码逐一绑定。',
              '完整性核验：PDF文件头、公告标题、最低页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
              '',
          ]
          for i,r in enumerate(manifest,1):
              readme += [
                  f"{i}. {r['key']}（{r['actual_pages']}页）",
                  f"   公告标题：{r['announcement_title']}",
                  f"   公告时间：{r['announcement_date']}",
                  f"   公告详情：{r['announcement_detail_page']}",
                  f"   PDF镜像：{r['mirror_pdf_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += ['说明：截至整理日，2026年第三季度报告尚未披露，因此最新“季报”为2026年第一季度报告；本包额外收录2026年半年度报告。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps({'search_pages':search_pages,'candidates':candidates_log,'reports':manifest},ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in manifest),encoding='utf-8')

          zpath = Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 8: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: huayou-cobalt-603799-2020-2025-annual-reports-and-latest-quarter-final-v2
          path: 华友钴业_603799_2020-2025年报及最新季报.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
