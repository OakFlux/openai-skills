name: Temporary Scan Hibor Mengtai Reports

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-hibor-mengtai-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scan monthly archives and report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from urllib.parse import urljoin,unquote

          months=['202106','202108','202208','202304','202306','202308','202404']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.hibor.com.cn/'})
          def dec(raw):
            for enc in ('gb18030','gbk','utf-8'):
              try:return raw.decode(enc)
              except UnicodeDecodeError:pass
            return raw.decode('utf-8','ignore')
          matches=[]
          for month in months:
            url=f'https://p.hibor.com.cn/archiver/{month}.html'
            r=s.get(url,timeout=90); print('ARCHIVE',month,r.status_code,len(r.content),r.url)
            if r.status_code!=200: continue
            text=html.unescape(dec(r.content)).replace('\\/','/')
            for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
              title=re.sub(r'<[^>]+>',' ',m.group(2));title=re.sub(r'\s+',' ',html.unescape(title)).strip()
              if '蒙泰高新' in title or '300876' in title:
                u=urljoin(r.url,m.group(1))
                item={'month':month,'title':title,'url':u}
                if item not in matches:matches.append(item)
          print('MATCHES='+json.dumps(matches,ensure_ascii=False))

          for item in matches:
            try:
              r=s.get(item['url'],timeout=60,allow_redirects=True)
              text=html.unescape(dec(r.content)).replace('\\/','/')
              visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
              visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
              visible=re.sub(r'<[^>]+>',' ',visible);visible=re.sub(r'\s+',' ',visible).strip()
              urls=[]
              for pat in [r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',r'(?:href|src|action|data|value)=["\']([^"\']+)["\']']:
                for v in re.findall(pat,text,re.I):
                  if isinstance(v,tuple):v=v[0]
                  u=urljoin(r.url,html.unescape(unquote(v)))
                  if any(k in u.lower() for k in ['pdf','download','down','file','doc','report']):
                    if u not in urls:urls.append(u)
              ids=sorted(set(re.findall(r'(?:docdetail_|[?&]id=)(\d+)',r.url+' '+text,re.I)))
              snippets=[]
              for needle in ['研报页数','研报大小','下载','浏览','pdf','docdetail','checkauthor','sysdownload']:
                for mm in list(re.finditer(needle,text,re.I))[:8]:
                  snippets.append(re.sub(r'\s+',' ',text[max(0,mm.start()-250):mm.start()+850]))
              print('DETAIL='+json.dumps({**item,'final':r.url,'status':r.status_code,'bytes':len(r.content),'visible_head':visible[:1600],'ids':ids,'urls':urls[:80],'snippets':snippets[:50]},ensure_ascii=False))
            except Exception as e: print('DETAIL='+json.dumps({**item,'error':repr(e)},ensure_ascii=False))
          PY
