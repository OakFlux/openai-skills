name: Inspect Foton Motor report pagination

on:
  push:
    branches: [tmp-foton-600166-reports-20261016]
    paths: ['.github/workflows/tmp-foton-discovery-pages-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect annual and quarterly indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          bases={
            'annual':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/600166/page_type/ndbg.phtml',
            'q1':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinYi/stockid/600166/page_type/yjdbg.phtml',
            'q3':'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/600166/page_type/sjdbg.phtml',
          }
          pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          for name,base in bases.items():
            for suffix in ('','?p=1','?p=2','?p=3','?page=2'):
              url=base+suffix
              print('\n===== '+name+' '+suffix+' =====')
              try:
                req=urllib.request.Request(url,headers={'User-Agent':UA})
                raw=urllib.request.urlopen(req,timeout=120).read()
              except Exception as e:
                print('ERROR',repr(e)); continue
              for enc in ('utf-8','gb18030','gbk'):
                try: text=raw.decode(enc); break
                except UnicodeDecodeError: pass
              else: text=raw.decode('utf-8',errors='replace')
              print('BYTES',len(raw))
              for m in pat.finditer(text):
                label=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
                label=re.sub(r'\s+','',label)
                href=urllib.parse.urljoin(url,html.unescape(m.group(1)))
                if any(k in label for k in ('年度报告','季度报告','一季度报告','三季度报告','下一页','上一页','末页')):
                  print(label,'\t',href)
          PY
