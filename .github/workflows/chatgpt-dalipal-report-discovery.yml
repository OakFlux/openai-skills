name: Discover Dalipal Holdings broker reports
on:
  push:
    branches:
      - chatgpt-dalipal-reports-20260907
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Search report indexes and probe public PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import io, json, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          terms = [
              '达力普控股', '達力普控股', 'Dalipal', '1921.HK', '01921',
              '大步迈进国际化，把握海外景气周期',
              '中东生产基地将于年内开工',
              '能源装备高端制造企业',
              '价值兼具成长', '能源高端装备巨匠',
              '专业石油管及无缝钢管制造企业',
          ]
          title_fragments = [
              '大步迈进国际化', '中东生产基地', '能源装备高端制造企业',
              '价值兼具成长', '能源高端装备巨匠', '专业石油管',
          ]
          out = {'eastmoney': [], 'sdyanbao': [], 'pdf_probes': []}
          s = requests.Session(); s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'})

          # Eastmoney report index scans around known publication windows.
          em_api = 'https://reportapi.eastmoney.com/report/list2'
          windows = [
              ('2022-02-01','2022-02-28'),
              ('2023-08-15','2023-09-05'),
              ('2023-12-01','2024-02-05'),
              ('2024-03-01','2024-04-05'),
              ('2025-01-01','2025-02-10'),
          ]
          em_headers = {
              'Accept':'application/json,text/plain,*/*',
              'Origin':'https://data.eastmoney.com',
              'Referer':'https://data.eastmoney.com/report/',
              'User-Agent':s.headers['User-Agent'],
          }
          seen = set()
          for begin,end in windows:
              for qtype in (0,1,2):
                  for code in ('', '1921', '01921', '1921.HK'):
                      for page in range(1, 31):
                          body = {
                              'pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,
                              'beginTime':begin,'endTime':end,'industryCode':'*','rating':None,
                              'ratingChange':None,'orgCode':None,'rcode':'','code':code,'qType':qtype,
                          }
                          try:
                              r = s.post(em_api, json=body, headers=em_headers, timeout=(10,60))
                              if r.status_code != 200:
                                  print('EM_HTTP', begin,end,qtype,repr(code),page,r.status_code,len(r.content),flush=True)
                                  break
                              j = r.json(); rows = j.get('data') or []
                              hits = int(j.get('hits') or 0); total = int(j.get('TotalPage') or ((hits+99)//100))
                              if page == 1:
                                  print('EM_WINDOW', begin,end,'Q',qtype,'CODE',repr(code),'HITS',hits,'PAGES',total,flush=True)
                              for x in rows:
                                  blob = json.dumps(x, ensure_ascii=False)
                                  if any(t.lower() in blob.lower() for t in terms):
                                      key = str(x.get('infoCode') or (x.get('title'),x.get('publishDate'),x.get('orgSName')))
                                      if key not in seen:
                                          seen.add(key); out['eastmoney'].append(x)
                                          print('EM_MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                              if not rows or page >= total: break
                              time.sleep(.08)
                          except Exception as e:
                              print('EM_FAIL',begin,end,qtype,repr(code),page,repr(e),flush=True)
                              break

          # Sdyanbao exact/full-text searches.
          sd_api = 'https://api.sdyanbao.com/api/file/search'
          sd_headers = {
              'Content-Type':'application/json','Accept':'application/json,text/plain,*/*',
              'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
              'device':'1','User-Agent':s.headers['User-Agent'],
          }
          sd_queries = [
              '达力普控股','达力普','1921.HK','01921',
              '大步迈进国际化 把握海外景气周期',
              '中东生产基地将于年内开工',
              '能源装备高端制造企业',
              '价值兼具成长 专精特新 能源高端装备巨匠',
              '专业石油管及无缝钢管制造企业',
          ]
          sd_seen = set()
          for phrase in sd_queries:
              for only in (1,0):
                  for page in range(1, 11):
                      body = {
                          'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':page,
                          'pageSize':100,'keyword':phrase,'pageCount':'','dateRange':'',
                          'startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1,
                      }
                      try:
                          r=s.post(sd_api,json=body,headers=sd_headers,timeout=(10,60)); r.raise_for_status(); j=r.json()
                          data=j.get('data') or {}; rows=data.get('files') or []; total=int(data.get('total') or 0)
                          if page==1: print('SD_QUERY',repr(phrase),'ONLY',only,'TOTAL',total,'ROWS',len(rows),flush=True)
                          for x in rows:
                              blob=json.dumps(x,ensure_ascii=False)
                              if any(t.lower() in blob.lower() for t in terms) or any(f.lower() in blob.lower() for f in title_fragments):
                                  key=str(x.get('id') or x.get('data_source_uuid') or x.get('name'))
                                  if key not in sd_seen:
                                      sd_seen.add(key); out['sdyanbao'].append(x)
                                      print('SD_MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                          if not rows or page*100>=total: break
                          time.sleep(.1)
                      except Exception as e:
                          print('SD_FAIL',repr(phrase),only,page,repr(e),flush=True); break

          # Probe standard Eastmoney PDF URLs for any AP info codes discovered.
          candidates=[]
          for x in out['eastmoney']:
              code=str(x.get('infoCode') or '')
              if code.startswith('AP'): candidates.append((x.get('title'),code))
          for x in out['sdyanbao']:
              code=str(x.get('data_source_uuid') or '')
              if code.startswith('AP'): candidates.append((x.get('name'),code))
          dedup=[]; sc=set()
          for title,code in candidates:
              if code not in sc: sc.add(code); dedup.append((title,code))
          for title, code in dedup:
              for prefix in ('H3','H2'):
                  url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
                  try:
                      r=s.get(url,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/'},timeout=(10,90),allow_redirects=True)
                      ok=r.status_code==200 and b'%PDF' in r.content[:4096] and len(r.content)>30000
                      pages=None
                      if ok:
                          try: pages=len(PdfReader(io.BytesIO(r.content),strict=False).pages)
                          except Exception as e: pages='ERR:'+repr(e)
                      rec={'title':title,'infoCode':code,'url':url,'status':r.status_code,'bytes':len(r.content),'ok':ok,'pages':pages,'ctype':r.headers.get('content-type')}
                      out['pdf_probes'].append(rec); print('PDF_PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
                      if ok:
                          Path(f'out/{code}.pdf').write_bytes(r.content); break
                  except Exception as e:
                      rec={'title':title,'infoCode':code,'url':url,'error':repr(e)}
                      out['pdf_probes'].append(rec); print('PDF_FAIL',json.dumps(rec,ensure_ascii=False),flush=True)

          Path('out/discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('COUNTS',len(out['eastmoney']),len(out['sdyanbao']),len(out['pdf_probes']),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dalipal-report-discovery
          path: out/
          retention-days: 3
          if-no-files-found: error
