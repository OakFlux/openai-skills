name: Download public Hangyan Yuexiu Transport PDF

on:
  push:
    branches:
      - tmp-yuexiu-hangyan-full-20260905

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download and verify public original PDF
        run: |
          python -m pip install --quiet requests beautifulsoup4 cryptography pypdf
          mkdir -p deliverable
          cat > /tmp/get_hangyan_pdf.py <<'PY'
          import base64, hashlib, json, math, re, time, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          from cryptography.hazmat.primitives.padding import PKCS7
          from pypdf import PdfReader

          PAGE='https://www.hangyan.co/reports/3601231225693407004'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          r=s.get(PAGE,timeout=45)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          el=soup.select_one('[data-controller~="native-pdf"]')
          if el is None:
              raise RuntimeError('native-pdf element not found')
          token=el.get('data-native-pdf-cache-key-value')
          filename=el.get('data-native-pdf-filename-value') or 'xingzheng_yuexiu_transport_20250331.pdf'
          if not token:
              raise RuntimeError('encrypted public PDF URL not found')

          def decrypt_url(token):
              raw=token.replace('-','+').replace('_','/')
              raw += '='*((4-len(raw)%4)%4)
              payload=base64.b64decode(raw)
              iv,ct=payload[:16],payload[16:]
              now=int(time.time())
              # Public client-side controller derives a 32-byte AES key from a 120-second time bucket.
              for offset in range(-5,6):
                  bucket=math.floor((now+offset*120)/120)
                  keystr=('cv_'+str(bucket)+'zIDfwokaoIUFlw')[:32].ljust(32,'0')
                  try:
                      dec=Cipher(algorithms.AES(keystr.encode()),modes.CBC(iv)).decryptor()
                      padded=dec.update(ct)+dec.finalize()
                      unpad=PKCS7(128).unpadder()
                      pt=unpad.update(padded)+unpad.finalize()
                      url=pt.decode('utf-8')
                      if url.startswith('http'):
                          return url
                  except Exception:
                      pass
              raise RuntimeError('could not decrypt temporary public PDF URL')

          pdf_url=decrypt_url(token)
          print('PDF_HOST',pdf_url.split('/')[2])
          rr=s.get(pdf_url,timeout=90,headers={'Referer':PAGE})
          rr.raise_for_status()
          data=rr.content
          if not data.lstrip().startswith(b'%PDF') or len(data)<50000:
              raise RuntimeError(f'not a valid PDF: {rr.status_code}, {rr.headers.get("content-type")}, {len(data)}')

          out=Path('deliverable')
          safe='2025-03-31_Xingzheng_International_Yuexiu_Transport.pdf'
          pdf_path=out/safe
          pdf_path.write_bytes(data)
          reader=PdfReader(str(pdf_path),strict=False)
          pages=len(reader.pages)
          text=' '.join((p.extract_text() or '') for p in reader.pages[:4])
          compact=re.sub(r'\s+',' ',text)
          if not any(k in compact for k in ['越秀交通基建','Yuexiu Transport','01052','1052']):
              raise RuntimeError('issuer name/code not found in first pages')
          sha=hashlib.sha256(data).hexdigest()
          meta={
              'company':'越秀交通基建有限公司',
              'stock_code':'01052.HK',
              'broker':'兴证国际证券',
              'report_date':'2025-03-31',
              'title':'平临高速收购落地，保持稳健派息',
              'file':safe,
              'original_filename':filename,
              'pages':pages,
              'size_bytes':len(data),
              'sha256':sha,
              'public_report_page':PAGE,
              'download_type':'public original PDF downloaded through the page’s public client-side download flow'
          }
          (out/'manifest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'README.txt').write_text(
              'Yuexiu Transport Infrastructure (01052.HK) broker report\n'
              'Broker: Xingzheng International Securities\n'
              'Date: 2025-03-31\n'
              'Title: 平临高速收购落地，保持稳健派息\n'
              f'Pages: {pages}\n'
              f'SHA-256: {sha}\n'
              'This is the original PDF returned by the report page’s public download flow.\n',
              encoding='utf-8'
          )
          with zipfile.ZipFile(out/'yuexiu_hangyan_full_report.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write(pdf_path,pdf_path.name)
              z.write(out/'manifest.json','manifest.json')
              z.write(out/'README.txt','README.txt')
          with zipfile.ZipFile(out/'yuexiu_hangyan_full_report.zip') as z:
              assert z.testzip() is None
          print('OK',pages,len(data),sha)
          PY
          python /tmp/get_hangyan_pdf.py

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: yuexiu-hangyan-full-report
          path: deliverable/yuexiu_hangyan_full_report.zip
          retention-days: 1
          compression-level: 0
