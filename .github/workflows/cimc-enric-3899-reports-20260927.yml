name: Build CIMC Enric 3899 reports package 20260927

on:
  push:
    paths:
      - '.github/workflows/cimc-enric-3899-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official reports, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '中集安瑞科_03899_2020-2025年报及2026最新季度与中期报告'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def hkex_variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          headers = {'Referer': 'https://www1.hkexnews.hk/'} if 'hkexnews.hk' in url else {'Referer': 'https://www.irasia.com/'}
                          with session.get(url, timeout=(30, 360), allow_redirects=True, stream=True, headers=headers) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          docs = [
              {
                  'filename': '01_中集安瑞科_03899_2020年报_中文版.pdf',
                  'title': '中集安瑞科2020年年度报告（中文版）',
                  'period': '2020年度',
                  'urls': ['https://doc.irasia.com/listco/hk/enric/annual/ar245738-cw03899ar.pdf'],
                  'min_bytes': 1_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '02_中集安瑞科_03899_2021年报_中文版.pdf',
                  'title': '中集安瑞科2021年年度报告（中文版）',
                  'period': '2021年度',
                  'urls': ['https://doc.irasia.com/listco/hk/enric/annual/2021/car2021.pdf'],
                  'min_bytes': 1_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '03_中集安瑞科_03899_2022年报_中文版.pdf',
                  'title': '中集安瑞科2022年年度报告（中文版）',
                  'period': '2022年度',
                  'urls': ['https://doc.irasia.com/listco/hk/enric/annual/2022/car2022.pdf'],
                  'min_bytes': 1_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '04_中集安瑞科_03899_2023年报_中文版.pdf',
                  'title': '中集安瑞科2023年年度报告（中文版）',
                  'period': '2023年度',
                  'urls': ['https://doc.irasia.com/listco/hk/enric/annual/2023/car2023.pdf'],
                  'min_bytes': 1_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '05_中集安瑞科_03899_2024年报_中文版.pdf',
                  'title': '中集安瑞科2024年年度报告（中文版）',
                  'period': '2024年度',
                  'urls': ['https://doc.irasia.com/listco/hk/enric/annual/2024/car2024.pdf'],
                  'min_bytes': 1_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '06_中集安瑞科_03899_2025年报_中文版.pdf',
                  'title': '中集安瑞科2025年年度报告（中文版）',
                  'period': '2025年度',
                  'urls': [
                      'https://doc.irasia.com/listco/hk/enric/annual/2025/car2025.pdf',
                      *hkex_variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0422/2026042202028.pdf'),
                  ],
                  'min_bytes': 1_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '07_中集安瑞科_03899_2026年第一季度营运数据_未经审计.pdf',
                  'title': '中集安瑞科截至2026年3月31日止三个月营运数据（未经审计）',
                  'period': '2026年第一季度',
                  'urls': hkex_variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0427/2026042701256.pdf'),
                  'min_bytes': 80_000,
                  'min_pages': 5,
              },
              {
                  'filename': '08_中集安瑞科_03899_2026年中期报告.pdf',
                  'title': '中集安瑞科2026年中期报告',
                  'period': '截至2026年6月30日止六个月',
                  'urls': [
                      'https://doc.irasia.com/listco/hk/enric/interim/2026/intrepc.pdf',
                      *hkex_variants('https://www.hkexnews.hk/listedco/listconews/sehk/2026/0914/2026091400316.pdf'),
                  ],
                  'min_bytes': 500_000,
                  'min_pages': 60,
              },
          ]

          records: list[dict] = []
          seen_hashes: set[str] = set()
          identity_terms = ('中集安瑞科', 'CIMC Enric', '3899')

          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(30, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              sample_lower = sample_text.lower()
              if not any(term.lower() in sample_lower for term in identity_terms):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              rec = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(rec)
              print('VALIDATED', json.dumps(rec, ensure_ascii=False), flush=True)

          readme = [
              '中集安瑞科控股有限公司（03899.HK）2020—2025年年度报告及2026年最新季度/中期报告',
              '整理日期：2026-09-27',
              '',
              '收录文件：2020—2025年完整年度报告（中文版）、截至2026年3月31日止三个月营运数据，以及2026年中期报告。',
              '说明：港股主板公司通常不发布A股格式的法定季度报告；因此本包将公司最新季度性营运数据与最新完整中期财务报告一并收录。',
              '所有PDF均来自中集安瑞科投资者关系披露平台或香港交易所披露易，并通过PDF文件头、公司身份、页数、qpdf结构、SHA-256和ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   报告期：{rec['period']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 8:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: cimc-enric-3899-reports-20260927
          path: 中集安瑞科_03899_2020-2025年报及2026最新季度与中期报告.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
