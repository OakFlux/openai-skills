name: Targeted probe Weilong broker report PDFs 20260927

on:
  push:
    paths:
      - '.github/workflows/weilong-targeted-report-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright requests beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
      - name: Inspect pages and network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import asyncio,json,re,html,urllib.parse
          from pathlib import Path
          from playwright.async_api import async_playwright
          urls=[
            'https://www.baogaobox.com/reports/250626000065338.html',
            'https://www.baogaobox.com/reports/250422000056654.html',
            'https://www.baogaobox.com/reports/250318000008758.html',
            'https://www.vzkoo.com/question/1761728539694779',
            'https://www.fxbaogao.com/q/2511226017912869',
            'https://www.fxbaogao.com/q/2508255388457691',
            'https://finance.sina.com.cn/stock/relnews/hk/2025-02-27/doc-inemxrkc7795747.shtml',
          ]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              c=await b.new_context(locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36')
              for i,u in enumerate(urls,1):
                page=await c.new_page(); net=[]
                page.on('response',lambda r: net.append({'url':r.url,'status':r.status,'type':r.headers.get('content-type','')}))
                rec={'input':u}
                try:
                  await page.goto(u,wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_timeout(6000)
                  rec['final']=page.url;rec['title']=await page.title()
                  body=await page.locator('body').inner_text(timeout=20000)
                  rec['body_sample']=body[:40000]
                  content=await page.content();Path(f'out/{i:02d}.html').write_text(content,encoding='utf-8')
                  # Try to expose href/src values and script text matches.
                  vals=await page.evaluate('''() => {
                    const a=[];
                    for (const el of document.querySelectorAll('*')) {
                      for (const k of ['href','src','data-src','data-url','data-original','data-file','data-pdf','content']) {
                        const v=el.getAttribute && el.getAttribute(k); if(v) a.push(v);
                      }
                    }
                    return a;
                  }''')
                  allu=set()
                  for v in vals:
                    try: allu.add(urllib.parse.urljoin(page.url,html.unescape(v).replace('\\/','/')))
                    except: pass
                  for m in re.finditer(r'https?://[^\s"\'<>\\]+',content):allu.add(html.unescape(m.group(0)).replace('\\/','/'))
                  rec['dom_urls']=sorted(x for x in allu if any(k in x.lower() for k in ('pdf','download','file','report','research','dfcfw','oss','cos','cdn','preview','attachment')))
                  rec['network']=net
                  # Click visible download/read buttons only when no sign-in/payment action is involved.
                  for sel in ['text=下载报告','text=下载PDF','text=下载','text=阅读全文','text=查看原文']:
                    try:
                      loc=page.locator(sel).first
                      if await loc.count() and await loc.is_visible():
                        await loc.click(timeout=2500)
                        await page.wait_for_timeout(3000)
                    except Exception:pass
                  rec['network_after_click']=net
                except Exception as e:rec['error']=repr(e)
                Path(f'out/{i:02d}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                print(i,rec.get('title'),len(net),len(rec.get('dom_urls',[])),rec.get('error',''),flush=True)
                await page.close()
              await b.close()
          asyncio.run(main())
          PY
          grep -RInE "pdf\.dfcfw\.com|https?[^[:space:]\"']+\.pdf|pdfUrl|downloadUrl|fileUrl|sourceUrl|attachment|魔芋十年|魔芋开启新纪元|辣味休闲食品龙头" out > out/grep_hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: weilong-targeted-report-probe-20260927
          path: out
          retention-days: 7
          if-no-files-found: error
