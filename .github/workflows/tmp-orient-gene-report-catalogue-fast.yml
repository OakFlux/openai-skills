name: Temporary Export Orient Gene Report Catalogue Fast

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-report-catalogue-fast.yml

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query report catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          from pathlib import Path
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/688298.html','Accept':'application/json,text/plain,*/*'})
          rows=[]
          for page in range(1,12):
            params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2019-01-01','endTime':'2026-08-30','pageNo':str(page),'fields':'','qType':'0','orgCode':'','author':'','code':'688298','rcode':'','_':str(int(time.time()*1000))}
            r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60);r.raise_for_status();data=r.json().get('data') or []
            rows.extend(data)
            if len(data)<100:break
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_report_catalogue.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          slim=[]
          for x in rows:
            slim.append({k:x.get(k) for k in ['infoCode','publishDate','orgSName','orgName','title','researcher','ratingName','attachPages','attachSize','encodeUrl','stockName','stockCode'] if k in x})
          print('CATALOGUE='+json.dumps(slim,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-report-catalogue
          path: out/orient_gene_report_catalogue.json
          if-no-files-found: error
          retention-days: 3
