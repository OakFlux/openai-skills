name: Probe KLN public broker report assets

on:
  push:
    branches:
      - tmp-kln-report-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public report pages and assets
        run: |
          python -m pip install --quiet requests beautifulsoup4
          cat > /tmp/probe_kln.py <<'PY'
          import re, json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = [
            'https://gmg.9fzt.com/report/HKSE/00636/536425491863.html',
            'https://www.sohu.com/a/124031560_313170',
            'https://www.dbs.com.hk/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/032025/636_HK_03312025.xml',
            'https://www.dbs.com.hk/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/082025/636_HK_08292025.xml',
            'https://www.dbs.com.hk/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/082026/636_HK_08312026.xml',
          ]
          s = requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })
          for u in urls:
            print('\n===== PAGE', u, '=====')
            try:
              r = s.get(u, timeout=(20,90), allow_redirects=True)
              print('STATUS', r.status_code, 'FINAL', r.url, 'TYPE', r.headers.get('content-type'), 'LEN', len(r.content))
              print('HEAD', r.text[:500].replace('\n',' ')[:500])
              soup = BeautifulSoup(r.text, 'html.parser')
              print('TITLE', soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(['a','link','script','iframe','img','source']):
                vals=[]
                for attr in ['href','src','data-src','data-url','data-file','data-pdf','download']:
                  v=tag.get(attr)
                  if v:
                    vals.append(urljoin(r.url,v))
                for v in vals:
                  lv=v.lower()
                  if any(k in lv for k in ['.pdf','download','report','api','file','attachment','print','viewer','static','assets']):
                    print('ASSET',v)
              patterns = [
                r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',
                r'https?://[^\"\'<>\s]+(?:download|attachment|report|file|viewer|pdf)[^\"\'<>\s]*',
                r'/(?:api|download|attachment|report|file|viewer)[^\"\'<>\s]*',
              ]
              for p in patterns:
                for m in list(dict.fromkeys(re.findall(p,r.text,re.I)))[:200]:
                  print('MATCH',m[:1000])
              for key in ['pdf','download','attachment','report','fileUrl','file_url','docUrl','sourceUrl','536425491863','00636','636_HK']:
                low=r.text.lower(); k=key.lower(); pos=0; shown=0
                while shown<8:
                  i=low.find(k,pos)
                  if i<0: break
                  print('CTX',key,r.text[max(0,i-350):min(len(r.text),i+1000)].replace('\n',' ')[:1350])
                  pos=i+len(k); shown+=1
            except Exception as e:
              print('ERROR',repr(e))
          PY
          PYTHONWARNINGS=ignore python /tmp/probe_kln.py
