name: Inspect Sdyanbao for Henghe reports

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-sdyanbao-inspect-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect site
        run: |
          python - <<'PY'
          import html,json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin,quote,urlparse

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          urls=[
            'https://www.sdyanbao.com/detail/931897',
            'https://www.sdyanbao.com/search?keyword='+quote('横河精密'),
            'https://www.sdyanbao.com/search?query='+quote('横河精密'),
            'https://www.sdyanbao.com/?s='+quote('横河精密'),
            'https://www.sdyanbao.com/search/'+quote('横河精密'),
            'https://www.sdyanbao.com/',
          ]
          scripts=set()
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True); print('\nPAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type')); print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False))
              if r.status_code!=200: continue
              r.encoding=r.apparent_encoding or r.encoding; text=r.text; soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              plain=' '.join(soup.get_text(' ',strip=True).split())
              for key in ['横河精密','优质精密制造企业','下载','PDF','931897']:
                pos=plain.find(key)
                if pos>=0: print('PLAIN_MATCH',key,plain[max(0,pos-800):pos+2500])
              for tag in soup.find_all(['a','script','link','iframe','form','input','button','meta']):
                attrs={k:tag.get(k) for k in ('href','src','action','value','name','id','class','data-id','data-url','data-file','content','type') if tag.get(k) is not None}
                label=' '.join(tag.get_text(' ',strip=True).split())[:500]
                raw=label+' '+json.dumps(attrs,ensure_ascii=False)
                if tag.name=='script' and attrs.get('src'): scripts.add(urljoin(r.url,attrs['src']))
                if any(k in raw.lower() for k in ['横河','300539','download','pdf','report','detail','api','search','file','931897']):
                  for k in ('href','src','action','data-url','data-file'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('TAG',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False)[:4000])
              for pat in [
                r'https?://[^\"\'<>\s]+',
                r'/(?:api|detail|download|report|file|search)[^\"\'<>\s]*',
                r'(?:reportId|report_id|documentId|docId|id|fileUrl|downloadUrl|pdfUrl|url|path)\s*[:=]\s*[\"\']([^\"\']+)[\"\']',
              ]:
                vals=[]
                for m in re.finditer(pat,text,re.I):
                  v=html.unescape(m.group(1) if m.lastindex else m.group(0))
                  if any(k in v.lower() for k in ['api','detail','download','report','pdf','search','file','931897','300539','横河']): vals.append(v)
                for v in list(dict.fromkeys(vals))[:300]: print('RAW',v[:4000])
            except Exception as e: print('PAGE_ERROR',url,repr(e))
          print('SCRIPTS',len(scripts))
          for i,url in enumerate(sorted(scripts)):
            try:
              r=s.get(url,timeout=60); print('\nSCRIPT',i,r.status_code,len(r.content),url,r.headers.get('content-type'))
              if r.status_code!=200 or len(r.content)>10_000_000: continue
              text=r.text
              for pat in [r'https?://[^\"\'<>\s]+',r'[\"\'](/[^\"\']*(?:api|search|detail|download|report|pdf|file)[^\"\']*)[\"\']',r'(?:baseURL|url|path)\s*[:=]\s*[\"\']([^\"\']+)[\"\']']:
                vals=[]
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if any(k in v.lower() for k in ['api','search','detail','download','report','pdf','file']): vals.append(v)
                for v in list(dict.fromkeys(vals))[:500]: print('SCRIPT_RAW',v[:4000])
            except Exception as e: print('SCRIPT_ERROR',url,repr(e))
          PY
