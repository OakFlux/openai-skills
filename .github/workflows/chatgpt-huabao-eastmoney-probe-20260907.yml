name: Probe public Eastmoney APIs for Huabao International reports

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-eastmoney-probe-20260907.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Query public report APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import io, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out = Path('out')
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer':'https://data.eastmoney.com/',
              'Origin':'https://data.eastmoney.com',
          })

          codes = ['00336','0336','HK00336','116.00336','HK|00336','00336.HK']
          all_rows = {}
          raw = []

          for code in codes:
              body = {
                  'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,
                  'beginTime':'2010-01-01','endTime':'2026-09-07',
                  'code':code,'industryCode':'*','rating':None,'ratingChange':None,
                  'orgCode':None,'rcode':''
              }
              try:
                  r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,timeout=(10,45))
                  rec={'kind':'list2-post','code':code,'status':r.status_code,'ctype':r.headers.get('content-type'),'bytes':len(r.content),'text':r.text[:3000]}
                  raw.append(rec)
                  print('LIST2',code,r.status_code,len(r.content),r.text[:300].replace('\n',' '),flush=True)
                  if r.ok:
                      j=r.json()
                      rows=j.get('data') or []
                      print('ROWS',code,len(rows),'HITS',j.get('hits'),'TOTALPAGE',j.get('TotalPage'),flush=True)
                      for x in rows:
                          all_rows[str(x.get('infoCode') or x.get('encodeUrl') or len(all_rows))]=x
              except Exception as e:
                  print('LIST2_FAIL',code,repr(e),flush=True)
                  raw.append({'kind':'list2-post','code':code,'error':repr(e)})

          get_endpoint='https://reportapi.eastmoney.com/report/list'
          for code in codes:
              params={
                  'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,
                  'beginTime':'2010-01-01','endTime':'2026-09-07','code':code,
                  'industryCode':'*','qType':0,'orgCode':'','rcode':'','_':'1777777777777'
              }
              try:
                  r=s.get(get_endpoint,params=params,timeout=(10,45))
                  raw.append({'kind':'list-get','code':code,'url':r.url,'status':r.status_code,'ctype':r.headers.get('content-type'),'bytes':len(r.content),'text':r.text[:3000]})
                  print('LISTGET',code,r.status_code,len(r.content),r.text[:300].replace('\n',' '),flush=True)
                  txt=r.text.strip()
                  txt=re.sub(r'^[^(]*\(','',txt); txt=re.sub(r'\)\s*;?\s*$','',txt)
                  try:
                      j=json.loads(txt)
                      rows=j.get('data') or []
                      print('GETROWS',code,len(rows),flush=True)
                      for x in rows:
                          all_rows[str(x.get('infoCode') or x.get('encodeUrl') or len(all_rows))]=x
                  except Exception: pass
              except Exception as e:
                  print('LISTGET_FAIL',code,repr(e),flush=True)

          report_names=['RPT_RESEARCHREPORT','RPT_HK_RESEARCHREPORT','RPT_RES_REPORT','RPT_HK_STOCK_RESEARCH']
          filters=[
              '(SECURITY_CODE="00336")',
              '(SECUCODE="00336.HK")',
              '(STOCK_CODE="00336")',
              '(SECURITY_NAME_ABBR="华宝国际")'
          ]
          for rn in report_names:
              for flt in filters:
                  params={'reportName':rn,'columns':'ALL','filter':flt,'pageNumber':1,'pageSize':100,'sortColumns':'PUBLISH_DATE','sortTypes':'-1','source':'WEB','client':'WEB'}
                  try:
                      r=s.get('https://datacenter-web.eastmoney.com/api/data/v1/get',params=params,timeout=(10,45))
                      raw.append({'kind':'datacenter','reportName':rn,'filter':flt,'url':r.url,'status':r.status_code,'ctype':r.headers.get('content-type'),'bytes':len(r.content),'text':r.text[:3000]})
                      print('DC',rn,flt,r.status_code,len(r.content),r.text[:240].replace('\n',' '),flush=True)
                      if r.ok:
                          j=r.json(); rows=((j.get('result') or {}).get('data') or [])
                          for x in rows:
                              key=str(x.get('INFO_CODE') or x.get('INFOCODE') or x.get('REPORT_ID') or len(all_rows))
                              all_rows[key]=x
                  except Exception as e:
                      print('DC_FAIL',rn,flt,repr(e),flush=True)

          # Keep only rows plausibly connected to Huabao or target titles.
          compact=[]
          terms=['华宝国际','華寶國際','00336','历尽千帆','涅槃重生','轻装上阵','全面出海','香精行业龙头','业务结构多元']
          for key,x in all_rows.items():
              blob=json.dumps(x,ensure_ascii=False)
              if any(t in blob for t in terms):
                  compact.append(x)
          print('MATCHED_ROWS',len(compact),flush=True)
          for x in compact:
              print('ROW',json.dumps(x,ensure_ascii=False)[:4000],flush=True)

          # Probe the canonical Eastmoney PDF URLs for any discovered infoCode.
          pdfs=[]
          for x in compact:
              info=str(x.get('infoCode') or x.get('INFO_CODE') or x.get('INFOCODE') or '')
              if not info or not info.startswith('AP'): continue
              for prefix in ['H3','H2']:
                  url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  try:
                      r=s.get(url,timeout=(10,90),allow_redirects=True)
                      ok=r.status_code==200 and b'%PDF' in r.content[:4096] and len(r.content)>50000
                      pages=None
                      if ok:
                          try: pages=len(PdfReader(io.BytesIO(r.content),strict=False).pages)
                          except Exception as e: pages='ERR:'+repr(e)
                      print('PDF',url,r.status_code,len(r.content),ok,pages,flush=True)
                      pdfs.append({'url':url,'status':r.status_code,'bytes':len(r.content),'ok':ok,'pages':pages,'infoCode':info})
                      if ok: break
                  except Exception as e:
                      print('PDF_FAIL',url,repr(e),flush=True)
                      pdfs.append({'url':url,'error':repr(e),'infoCode':info})

          (out/'raw.json').write_text(json.dumps(raw,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matched.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'pdf_probe.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-eastmoney-probe
          path: out/
          retention-days: 3
          if-no-files-found: error
