name: Search 51pdf for Makeng Mining reports

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-51pdf-search-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Inspect search paths and report links
        run: |
          python - <<'PY'
          import io, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, quote
          from pypdf import PdfReader

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          bases=['https://www.51pdf.cn/','https://www.51pdf.cn/report_xg_p6/','https://www.51pdf.cn/report_xg_p4/']
          probes=[
            'https://www.51pdf.cn/search.php?keyword='+quote('马矿股份'),
            'https://www.51pdf.cn/search.php?key='+quote('马矿股份'),
            'https://www.51pdf.cn/search/?keyword='+quote('马矿股份'),
            'https://www.51pdf.cn/report_search.php?keyword='+quote('马矿股份'),
            'https://www.51pdf.cn/?s='+quote('马矿股份'),
            'https://www.51pdf.cn/search-'+quote('马矿股份')+'.html',
          ]
          all_links=[]
          for url in bases+probes:
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              print('\nPAGE',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for form in soup.find_all('form'):
                print('FORM',urljoin(r.url,form.get('action') or ''),form.get('method'),[(i.get('name'),i.get('value'),i.get('type')) for i in form.find_all('input')],flush=True)
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if label or any(x in href.lower() for x in ('report','down','pdf')):
                  if any(k in label for k in ('马矿股份','新股精要','新股覆盖研究')) or 'report_' in href.lower() or 'download' in href.lower():
                    print('LINK',json.dumps({'label':label[:500],'href':href},ensure_ascii=False),flush=True)
                    all_links.append((label,href))
              for script in soup.find_all('script',src=True):
                print('SCRIPT',urljoin(r.url,script['src']),flush=True)
            except Exception as e: print('PAGE_ERROR',url,repr(e),flush=True)

          # Inspect unique detail links, focusing on any report whose page text mentions Makeng or report downloads.
          seen=set()
          for label,url in all_links:
            if url in seen: continue
            seen.add(url)
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              text=r.text
              if '马矿股份' in text or any(k in label for k in ('马矿股份','新股精要')):
                print('\nDETAIL',label,url,r.status_code,len(r.content),r.url,flush=True)
                soup=BeautifulSoup(text,'html.parser')
                for tag in soup.find_all(['a','iframe','embed','object','script','form']):
                  for attr in ('href','src','data','action'):
                    val=tag.get(attr)
                    if not val: continue
                    full=urljoin(r.url,val)
                    if any(k in full.lower() for k in ('.pdf','download','down','file')):
                      print('DETAIL_CANDIDATE',full,flush=True)
                      try:
                        rr=s.get(full,headers={'Referer':r.url},timeout=60,allow_redirects=True)
                        print('TEST',rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),flush=True)
                        if rr.content.startswith(b'%PDF'):
                          rd=PdfReader(io.BytesIO(rr.content),strict=False); print('PDF_OK',full,len(rd.pages),flush=True)
                      except Exception as e: print('TEST_ERROR',full,repr(e),flush=True)
            except Exception as e: print('DETAIL_ERROR',url,repr(e),flush=True)
          PY
