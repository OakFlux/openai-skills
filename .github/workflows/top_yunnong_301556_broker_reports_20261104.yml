name: package-top-yunnong-301556-broker-reports

on:
  push:
    branches:
      - tmp/top-yunnong-301556-broker-20261104-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = "托普云农"
          FULL_NAME = "浙江托普云农科技股份有限公司"
          CODE = "301556"
          PREPARED = "2026-11-04"
          ROOT_NAME = "托普云农_301556_券商深度研究报告_2份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "sequence": 1,
                  "date": "2025-06-20",
                  "broker": "东吴证券",
                  "analyst": "王紫敬、张文佳",
                  "rating": "买入（首次）",
                  "report_type": "公司深度研究",
                  "title": "智慧农业领军，AI+深度赋能",
                  "expected_pages": 20,
                  "filename": "01_20250620_东吴证券_智慧农业领军_AI深度赋能_公司深度研究.pdf",
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP202506201694418837_1.pdf?1750438371000.pdf=",
                      "https://pdf.dfcfw.com/pdf/H3_AP202506201694418837_1.pdf",
                  ],
              },
              {
                  "sequence": 2,
                  "date": "2024-10-17",
                  "broker": "民生证券",
                  "analyst": "吕伟",
                  "rating": "未标注（新股研究）",
                  "report_type": "新股研究报告",
                  "title": "稀缺的AI+农业领军者",
                  "expected_pages": 22,
                  "filename": "02_20241017_民生证券_稀缺的AI加农业领军者_新股研究报告.pdf",
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP202410171640334607_1.pdf?1729156330000.pdf=",
                      "https://pdf.dfcfw.com/pdf/H3_AP202410171640334607_1.pdf",
                  ],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Referer": "https://data.eastmoney.com/",
              "Accept": "application/pdf,*/*;q=0.8",
          })

          def download_pdf(urls: list[str]) -> tuple[bytes, str, str]:
              errors = []
              for url in urls:
                  for attempt in range(4):
                      try:
                          response = session.get(url, timeout=(20, 240), allow_redirects=True)
                          print("DOWNLOAD", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          data = response.content
                          if data.startswith(b"%PDF-") and len(data) > 100_000:
                              return data, response.url, response.headers.get("content-type", "")
                          errors.append(f"{url}: non-PDF or too small ({len(data)} bytes, {data[:20]!r})")
                      except Exception as exc:
                          errors.append(f"{url}: {exc!r}")
                          time.sleep(1 + attempt)
              raise RuntimeError("All download attempts failed: " + " | ".join(errors))

          manifest = []
          for spec in reports:
              data, final_url, content_type = download_pdf(spec["urls"])
              path = PDF_DIR / spec["filename"]
              path.write_bytes(data)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != spec["expected_pages"]:
                  raise RuntimeError(f"Unexpected page count for {path.name}: {pages}, expected {spec['expected_pages']}")

              text = "\n".join((page.extract_text() or "") for page in reader.pages[: min(5, pages)])
              compact = re.sub(r"\s+", "", text)
              if CODE not in compact or COMPANY not in compact:
                  raise RuntimeError(f"Issuer validation failed for {path.name}")

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf validation failed for {path.name}: {qpdf.stdout}")

              preview_prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "160", "-singlefile", str(path), str(preview_prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview_path = Path(str(preview_prefix) + ".png")
              if render.returncode != 0 or not preview_path.exists() or preview_path.stat().st_size < 10_000:
                  raise RuntimeError(f"First-page render failed for {path.name}: {render.stdout}")

              sha256 = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{key: value for key, value in spec.items() if key not in {"urls", "expected_pages"}},
                  "document_form": "券商原始PDF",
                  "actual_pages": pages,
                  "bytes": len(data),
                  "sha256": sha256,
                  "source_url": final_url,
                  "content_type": content_type,
                  "preview_file": str(Path("首页预览") / preview_path.name),
              })

          readme = [
              f"{FULL_NAME}（{CODE}.SZ）券商研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录2份可直接公开下载并核验的券商原始PDF。",
              "筛选口径：优先公司深度研究、首次覆盖或新股研究；不使用网页摘要或重新排版文件替代原报告。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              readme.extend([
                  f"{index}. {item['filename']}",
                  f"   类型：{item['report_type']}；券商：{item['broker']}；研究员：{item['analyst']}",
                  f"   日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['actual_pages']}；文件大小：{item['bytes']}字节",
                  f"   公开来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称与证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "文件性质", "报告类型", "券商", "研究员", "日期", "标题", "评级", "页数", "字节数", "SHA-256", "公开来源"])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["document_form"], item["report_type"], item["broker"], item["analyst"],
                      item["date"], item["title"], item["rating"], item["actual_pages"], item["bytes"], item["sha256"], item["source_url"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("top_yunnong_301556_broker_deep_reports_2.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 2:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 2")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": [{key: item[key] for key in ["filename", "document_form", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: top-yunnong-301556-broker-deep-reports-2-20261104
          path: |
            top_yunnong_301556_broker_deep_reports_2.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
