name: Download accessible Standard Chartered 2021 annual report 20260926

on:
  push:
    paths:
      - '.github/workflows/standard-chartered-2021-alt-download-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests pypdf
      - name: Download and select full report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -u - <<'PY'
          import json
          from pathlib import Path
          import requests, urllib3
          from pypdf import PdfReader
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          urls=[
            'https://av.sc.com/hk/content/docs/hk-e-annual-report-w-bookmark-2021.pdf',
            'https://av.sc.com/hk/content/docs/hk-e-20220217-scplc-announcement-2021-annual-report.pdf',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://www.sc.com/hk/investor-relations/'})
          recs=[]; candidates=[]
          for i,u in enumerate(urls,1):
            rec={'url':u}
            try:
              r=s.get(u,timeout=(30,300),allow_redirects=True,verify=False)
              rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'is_pdf':r.content[:5]==b'%PDF-'})
              p=Path('out')/f'candidate_{i}.pdf'; p.write_bytes(r.content)
              if rec['is_pdf']:
                reader=PdfReader(str(p),strict=False)
                rec['pages']=len(reader.pages)
                text=''
                for j in range(min(5,len(reader.pages))):
                  try:text+='\n'+(reader.pages[j].extract_text() or '')
                  except:pass
                rec['identity']='standard chartered' in text.lower()
                rec['sample_text']=text[:2000]
                if rec['pages']>100 and rec['identity']:
                  candidates.append((rec['pages'],p,rec))
            except Exception as e:
              rec['error']=repr(e)
            print(json.dumps(rec,ensure_ascii=False),flush=True)
            recs.append(rec)
          if not candidates:
            raise RuntimeError('No full accessible 2021 annual report found: '+json.dumps(recs,ensure_ascii=False))
          candidates.sort(reverse=True,key=lambda x:x[0])
          _,src,best=candidates[0]
          dst=Path('out/渣打集团_2021年年度报告_官方英文版.pdf')
          dst.write_bytes(src.read_bytes())
          Path('out/result.json').write_text(json.dumps({'selected':best,'all':recs},ensure_ascii=False,indent=2),encoding='utf-8')
          print('SELECTED',best,flush=True)
          PY
      - name: Upload 2021 report
        uses: actions/upload-artifact@v4
        with:
          name: standard-chartered-2021-full-report
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
