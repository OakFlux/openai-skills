name: Temporary Greentown report discovery

on:
  push:
    branches:
      - task-artifacts-20260828-01

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public report index
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 <<'PY'
          import json
          import requests
          from pathlib import Path

          out = Path('output')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
              'Device': '1',
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/',
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
          })
          search_url = 'https://api.sdyanbao.com/api/file/search'
          detail_url = 'https://api.sdyanbao.com/api/file/detail'
          all_items = []
          for page in range(1, 11):
              body = {
                  'device': 1,
                  'hideTrader': 0,
                  'onlyTitle': 1,
                  'order': 0,
                  'page': page,
                  'pageSize': 50,
                  'keyword': '绿城中国',
                  'pageCount': '',
                  'dateRange': '',
                  'startTime': '',
                  'endTime': '',
                  'typeIds': [],
                  'industryIds': [],
                  'opFrom': 1,
              }
              r = s.post(search_url, json=body, timeout=60)
              print('search', page, r.status_code, r.text[:500])
              r.raise_for_status()
              data = r.json()
              items = (data.get('data') or {}).get('files') or []
              if not items:
                  break
              all_items.extend(items)
              if len(items) < 50:
                  break
          print('items total', len(all_items))
          summaries = []
          for item in all_items:
              rid = item.get('id')
              summary = {
                  'id': rid,
                  'name': item.get('name'),
                  'time_text': item.get('time_text'),
                  'page_count': item.get('page_count'),
                  'file_size': item.get('file_size'),
                  'organization': (item.get('organization') or {}).get('name'),
                  'type': (item.get('type') or {}).get('name'),
                  'industry': (item.get('industry') or {}).get('name'),
                  'page_url': item.get('page_url'),
              }
              if rid:
                  dr = s.post(detail_url, json={'id': rid, 'opFrom': 1}, timeout=60)
                  print('detail', rid, dr.status_code, dr.text[:1000])
                  try:
                      detail = dr.json()
                  except Exception:
                      detail = {'raw': dr.text[:5000]}
                  summary['detail'] = detail
              summaries.append(summary)
          (out / 'search_results.json').write_text(json.dumps(summaries, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summaries, ensure_ascii=False, indent=2))
          PY
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: greentown-report-discovery
          path: output/search_results.json
          if-no-files-found: error
          retention-days: 1
