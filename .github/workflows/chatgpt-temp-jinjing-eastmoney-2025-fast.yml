name: chatgpt-temp-jinjing-eastmoney-2025-fast
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-jinjing-eastmoney-2025-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match exact 2025 titles and download PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python <<'PY'
          import json,re,time,hashlib
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          root=Path('jinjing_eastmoney_2025_fast'); pdfdir=root/'PDF';pdfdir.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          logs=[];matches={}
          def L(x):x=str(x);print(x);logs.append(x)
          def obj(t):
              try:return json.loads(t)
              except:pass
              a=t.find('{');b=t.rfind('}')
              try:return json.loads(t[a:b+1]) if a>=0 and b>a else {}
              except:return {}
          def rows(o):
              x=o.get('data') or []
              if isinstance(x,dict):x=x.get('data') or x.get('list') or []
              return x if isinstance(x,list) else []
          def n(x):return re.sub(r'[\s:：()（）“”"\-—_]+','',str(x or '')).lower()
          targets={
            '国金证券':'港股市场点评报告6月下一个审议考察期潜在入通的港股标的梳理',
            '东吴证券':'港股通调整预测2025年6月',
            '申万宏源':'2025年9月港股通月报港股通25年9月调整回顾及26年3月调整测算',
            '申万宏源预测':'港股通2025年9月调整名单预测寻找下一个明星',
          }
          nt={k:n(v) for k,v in targets.items()}
          for begin,end in [('2025-05-23','2025-05-31'),('2025-07-05','2025-07-10'),('2025-09-21','2025-09-30')]:
            for qtype in range(0,7):
              for page in range(1,30):
                p={'cb':'jQuery1124','pageSize':100,'pageNo':page,'qType':qtype,'beginTime':begin,'endTime':end,'fields':'','orgCode':'','author':'','industryCode':'*','industry':'*','rating':'','ratingChange':'','rcode':'','_':int(time.time()*1000)}
                try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=45);o=obj(r.text);rr=rows(o)
                  L(f'{begin} q={qtype} p={page} HTTP={r.status_code} rows={len(rr)} total={o.get("TotalPage")}')
                  for rec in rr:
                    title=n(rec.get('title') or rec.get('TITLE'))
                    for label,t in nt.items():
                      # Require the distinctive title core, allowing prefixes/suffixes.
                      core=t[:max(12,int(len(t)*0.65))]
                      if (t in title or title in t or core in title) and label not in matches:
                        matches[label]=rec;L('MATCH '+label+' '+json.dumps(rec,ensure_ascii=False))
                  total=int(o.get('TotalPage') or 1)
                  if not rr or page>=total:break
                except Exception as e:L(f'ERR {begin} {qtype} {page} {e!r}');break
                time.sleep(.05)
          (root/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          dl=[]
          for label,rec in matches.items():
            info=rec.get('infoCode') or rec.get('INFO_CODE'); title=rec.get('title') or rec.get('TITLE') or label
            org=rec.get('orgSName') or rec.get('orgName') or label;dt=str(rec.get('publishDate') or rec.get('PUBLISH_DATE') or '')[:10]
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf']:
              r=s.get(u,headers={'Referer':'https://data.eastmoney.com/'},timeout=120,allow_redirects=True)
              L(f'PDF {label} {info} HTTP={r.status_code} bytes={len(r.content)} type={r.headers.get("content-type")}')
              if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>80000:
                fn=re.sub(r'[\\/:*?"<>|]+','_',f'{dt}_{org}_{title}')[:200]+'.pdf';p=pdfdir/fn;p.write_bytes(r.content)
                pc=len(PdfReader(str(p),strict=False).pages)
                dl.append({'label':label,'filename':fn,'pages':pc,'size_bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'url':r.url,'record':rec});L(f'VALID {fn} pages={pc}')
                break
          (root/'downloaded.json').write_text(json.dumps(dl,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          print('FINAL '+json.dumps(dl,ensure_ascii=False))
          if len(dl)<2:raise RuntimeError(f'Only {len(dl)} PDFs downloaded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Jinjing-Envision-Greenwise-2025-Full-Broker-PDFs
          path: jinjing_eastmoney_2025_fast
          retention-days: 1
          compression-level: 6
