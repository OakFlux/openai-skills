name: Inspect Makeng report detail endpoints

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-nxny-detail-inspection-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Inspect detail pages and linked scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from pypdf import PdfReader

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          pages=[
            'https://www.nxny.com/report/view_6451804.html',
            'https://www.51pdf.cn/report/view_5966943.html',
            'https://www.51pdf.cn/report/view_5940000.html',
          ]
          scripts=set(); candidates=[]
          for idx,url in enumerate(pages):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nPAGE',idx,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text
              print('TEXT_START',repr(text[:1000]),flush=True)
              soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for tag in soup.find_all(['a','script','iframe','embed','object','form','input','button','link']):
                attrs={k:tag.get(k) for k in ('href','src','data','action','value','name','id','class','type','onclick') if tag.get(k) is not None}
                label=' '.join(tag.get_text(' ',strip=True).split())[:300]
                for k in ('href','src','data','action'):
                  if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                raw=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if tag.name=='script' and attrs.get('src'): scripts.add(attrs['src'])
                if any(k in raw for k in ('pdf','download','down','file','viewreport','reportid','docid','会员','下载')):
                  print('TAG',tag.name,json.dumps(attrs,ensure_ascii=False),label,flush=True)
                  for k in ('href','src','data','action'):
                    if attrs.get(k): candidates.append(attrs[k])
              raw=text.replace('\\/','/')
              patterns=[
                r'https?://[^\s"\'<>]+',
                r'/(?:[^\s"\'<>]*(?:download|down|file|pdf|report)[^\s"\'<>]*)',
                r'(?:reportid|report_id|docid|id|aid)\s*[:=]\s*["\']?([0-9]+)',
                r'(?:url|file|pdf|download)[A-Za-z_]*\s*[:=]\s*["\']([^"\']+)["\']',
              ]
              for pat in patterns:
                for m in re.finditer(pat,raw,re.I):
                  val=m.group(1) if m.lastindex else m.group(0)
                  if val.startswith('//'): val='https:'+val
                  full=urljoin(r.url,val)
                  low=full.lower()
                  if any(k in low for k in ('pdf','download','down','file','report','6451804','5966943')) or (val.isdigit() and len(val)>4):
                    print('REGEX',full,flush=True); candidates.append(full)
            except Exception as e: print('PAGE_ERROR',url,repr(e),flush=True)

          for i,url in enumerate(sorted(scripts)):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nSCRIPT',i,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text
              print('SCRIPT_HEAD',text[:2000],flush=True)
              for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',text.replace('\\/','/'),re.I):
                val=m.group(0).rstrip('),;]}')
                if val.startswith('//'): val='https:'+val
                full=urljoin(r.url,val)
                if any(k in full.lower() for k in ('pdf','download','down','file','report')):
                  print('SCRIPT_CANDIDATE',full,flush=True); candidates.append(full)
            except Exception as e: print('SCRIPT_ERROR',url,repr(e),flush=True)

          # Add common endpoint guesses for both sites.
          candidates += [
            'https://www.nxny.com/report/down_6451804.html',
            'https://www.nxny.com/report/download_6451804.html',
            'https://www.nxny.com/report/download.aspx?id=6451804',
            'https://www.nxny.com/report/down.aspx?id=6451804',
            'https://www.nxny.com/download.aspx?id=6451804',
            'https://www.nxny.com/report/file/6451804.pdf',
            'https://www.51pdf.cn/report/down_5966943.html',
            'https://www.51pdf.cn/report/download_5966943.html',
            'https://www.51pdf.cn/report/download.aspx?id=5966943',
            'https://www.51pdf.cn/report/down.aspx?id=5966943',
            'https://www.51pdf.cn/download.aspx?id=5966943',
          ]
          seen=set()
          for url in candidates:
            if not url or url in seen: continue
            seen.add(url)
            if url.startswith('javascript:') or url.startswith('mailto:'): continue
            try:
              referer='https://www.nxny.com/report/view_6451804.html' if 'nxny.com' in url else 'https://www.51pdf.cn/report/view_5966943.html'
              r=s.get(url,headers={'Referer':referer},timeout=45,allow_redirects=True)
              print('TEST',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),repr(r.content[:60]),flush=True)
              if r.content.startswith(b'%PDF'):
                rd=PdfReader(io.BytesIO(r.content),strict=False)
                tx=''
                for j in range(min(3,len(rd.pages))):
                  try:tx+=rd.pages[j].extract_text() or ''
                  except Exception:pass
                print('PDF_OK',json.dumps({'url':url,'resolved':r.url,'pages':len(rd.pages),'bytes':len(r.content),'text':re.sub(r'\s+',' ',tx)[:500]},ensure_ascii=False),flush=True)
            except Exception as e: print('TEST_ERROR',url,repr(e),flush=True)
          PY
