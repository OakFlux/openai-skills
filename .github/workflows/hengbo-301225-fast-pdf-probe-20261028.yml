name: Fast probe Hengbo 301225 PDF endpoints 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-fast-pdf-probe-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json, re
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'*/*','Referer':'https://www.fhyanbao.com/rpview/1920166'})
          urls=[
            'https://api.fhyanbao.com/api/report/preview/1920166?resize=0',
            'https://api.fhyanbao.com/api/report/preview/1920166',
            'https://api.fhyanbao.com/api/report/download/1920166',
            'https://www.fhyanbao.com/api/report/preview/1920166?resize=0',
            'https://pdf.dfcfw.com/pdf/H3_AP202511241787234946_1.pdf',
            'https://pdf.dfcfw.com/pdf/H3_AP202305311587369843_1.pdf'
          ]
          for u in urls:
            print('\nURL',u)
            try:
              r=s.get(u,timeout=(8,20),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'TYPE',r.headers.get('content-type'),'DISP',r.headers.get('content-disposition'))
              print('HEAD',repr(r.content[:80]))
              if not r.content.startswith(b'%PDF'):
                print('TEXT',repr(r.text[:1000]))
              else:
                open('/tmp/probe.pdf','wb').write(r.content)
                try:
                  from subprocess import check_output
                  print(check_output(['pdfinfo','/tmp/probe.pdf'],text=True,stderr=None)[:1200])
                except Exception as e: print('PDFINFOERR',repr(e))
            except Exception as e: print('ERROR',repr(e))
          PY
