name: Inspect public 9FZT Wuhan Fingu report viewer 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_9fzt_reportview_20261022.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet selenium requests pypdf
      - name: Capture report viewer and public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/downloads out/screens out/json
          python - <<'PY'
          import os,json,time,re,hashlib,requests,urllib.parse,traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from pypdf import PdfReader

          content='武汉凡谷(002194)公司研究报告：专注基站射频三十年 5G滤波器再塑发展新天地'
          url='https://www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId=650430884853&content='+urllib.parse.quote(content)
          dl=os.path.abspath('out/downloads')
          o=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1920,4000','--lang=zh-CN','--ignore-certificate-errors','--disable-popup-blocking','--disable-blink-features=AutomationControlled']:
              o.add_argument(a)
          o.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36')
          o.add_experimental_option('prefs',{'download.default_directory':dl,'download.prompt_for_download':False,'download.directory_upgrade':True,'plugins.always_open_pdf_externally':True,'safebrowsing.enabled':True})
          o.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=o);d.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':dl});d.set_page_load_timeout(80)
          print('OPEN',url,flush=True)
          try:d.get(url)
          except Exception as e:print('LOADERR',repr(e),flush=True)
          time.sleep(12)
          print('PAGE',d.current_url,d.title,flush=True)
          open('out/page.html','w',encoding='utf-8',errors='replace').write(d.page_source)
          try:d.save_screenshot('out/screens/page.png')
          except Exception as e:print('SHOTERR',repr(e))
          dom=[]
          for sel,attr in [('a','href'),('img','src'),('iframe','src'),('embed','src'),('object','data'),('script','src'),('video','src'),('source','src')]:
              for e in d.find_elements(By.CSS_SELECTOR,sel):
                  v=e.get_attribute(attr)
                  if v:dom.append({'tag':sel,'url':v,'text':(e.text or '')[:500],'outer':e.get_attribute('outerHTML')[:1500]})
          json.dump(dom,open('out/json/dom.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          perf=[]
          for item in d.get_log('performance'):
              try:
                  m=json.loads(item['message'])['message'];method=m.get('method');p=m.get('params',{});obj=p.get('request') or p.get('response') or {};u=obj.get('url')
                  if u:perf.append({'method':method,'url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')})
              except:pass
          json.dump(perf,open('out/json/network.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          candidates=[]
          for x in dom:
              u=x['url'];blob=(u+' '+x.get('text','')).lower()
              if any(k in blob for k in ['pdf','download','file','report','article','650430884853']):candidates.append({'kind':'dom',**x})
          for x in perf:
              u=x['url'].lower()
              if any(k in u for k in ['pdf','download','file','report','article','650430884853']):candidates.append({'kind':'network',**x})
          # Collect visible controls and try only public view/download buttons.
          controls=[]
          for e in d.find_elements(By.XPATH,"//*[self::a or self::button or @role='button']"):
              txt=(e.text or '').strip();href=e.get_attribute('href') or e.get_attribute('data-url') or e.get_attribute('data-href')
              if any(k in txt for k in ['查看','阅读','下载','报告','全文','PDF']):controls.append({'text':txt[:500],'href':href,'outer':e.get_attribute('outerHTML')[:2000]})
          json.dump(controls,open('out/json/controls.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('COUNTS dom',len(dom),'network',len(perf),'controls',len(controls),'candidates',len(candidates),flush=True)
          for x in candidates:print('CAND',json.dumps(x,ensure_ascii=False)[:3000],flush=True)
          for i,e in enumerate(d.find_elements(By.XPATH,"//*[self::a or self::button or @role='button']")):
              txt=(e.text or '').strip()
              if not any(k in txt for k in ['查看完整','阅读原文','查看报告','下载报告','PDF']):continue
              try:
                  before=set(os.listdir(dl));old_handles=list(d.window_handles);old=d.current_url
                  print('CLICK',i,txt,e.get_attribute('href'),flush=True)
                  d.execute_script("arguments[0].scrollIntoView({block:'center'});",e);time.sleep(1)
                  try:e.click()
                  except:d.execute_script('arguments[0].click();',e)
                  time.sleep(8)
                  newh=[h for h in d.window_handles if h not in old_handles]
                  if newh:d.switch_to.window(newh[-1]);time.sleep(5)
                  print('AFTER',d.current_url,d.title,'files',sorted(set(os.listdir(dl))-before),flush=True)
                  d.save_screenshot(f'out/screens/click_{i}.png')
                  for item in d.get_log('performance'):
                      try:
                          m=json.loads(item['message'])['message'];p=m.get('params',{});obj=p.get('request') or p.get('response') or {};u=obj.get('url')
                          if u and any(k in u.lower() for k in ['pdf','download','file','report','650430884853']):candidates.append({'kind':'post_click','url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')})
                      except:pass
                  if newh:d.close();d.switch_to.window(old_handles[0])
                  elif d.current_url!=old:d.back();time.sleep(4)
              except Exception as ex:print('CLICKERR',i,repr(ex),flush=True)
          cookies={c['name']:c['value'] for c in d.get_cookies()};d.quit()
          # Fetch candidate URLs with browser cookies.
          ded=[];seen=set()
          for x in candidates:
              u=x.get('url')
              if not u or u.startswith(('data:','blob:','javascript:')):continue
              if u.startswith('//'):u='https:'+u
              if u.startswith('http://'):u='https://'+u[7:]
              if u not in seen:seen.add(u);x['url']=u;ded.append(x)
          candidates=ded
          json.dump(candidates,open('out/json/candidates.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          s=requests.Session();s.trust_env=False;s.cookies.update(cookies)
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':url,'Accept':'application/pdf,text/html,*/*'}
          results=[]
          for i,x in enumerate(candidates):
              u=x['url']
              try:
                  r=s.get(u,headers=h,timeout=(15,90),allow_redirects=True);data=r.content
                  rec={'url':u,'final_url':r.url,'status':r.status_code,'type':r.headers.get('content-type',''),'bytes':len(data),'magic':data[:20].hex()};results.append(rec);print('FETCH',json.dumps(rec,ensure_ascii=False),flush=True)
                  if data.startswith(b'%PDF') and len(data)>20000:open(os.path.join(dl,f'candidate_{i}.pdf'),'wb').write(data)
              except Exception as e:results.append({'url':u,'error':repr(e)})
          files=[]
          for name in os.listdir(dl):
              p=os.path.join(dl,name)
              if not os.path.isfile(p):continue
              data=open(p,'rb').read();rec={'file':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'magic':data[:20].hex()}
              if data.startswith(b'%PDF'):
                  try:rec['pages']=len(PdfReader(p,strict=False).pages)
                  except Exception as e:rec['pdf_error']=repr(e)
              files.append(rec)
          json.dump(results,open('out/json/fetch_results.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump(files,open('out/json/files.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('FILES',json.dumps(files,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuhan-fingu-9fzt-report-viewer-inspection
          path: out
          retention-days: 7
          if-no-files-found: error
