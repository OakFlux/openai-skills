name: Temporary Aixin knowledge document probe

on:
  push:
    branches:
      - tmp-aixin-knowledge-doc-probe-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public metadata endpoint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          out=Path('output'); out.mkdir(exist_ok=True)
          ids=['831126939078626','815124656831714','799998146746487']
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9',
            'Origin':'https://reportify.cn','Referer':'https://reportify.cn/'
          })
          tests=[]
          for base in ['https://api.reportify.cn','https://reportify.cn/api']:
            for path in ['/knowledge/documents/info','/knowledge/documents','/document-processing/info','/documents/info']:
              for method in ['post','get']:
                url=base+path
                try:
                  if method=='post':
                    r=s.post(url,json={'document_id_list':ids},timeout=60,allow_redirects=False)
                  else:
                    r=s.get(url,params={'document_id_list':','.join(ids)},timeout=60,allow_redirects=False)
                  row={'method':method,'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'location':r.headers.get('location'),'text':r.text[:100000]}
                  try: row['json']=r.json()
                  except Exception: pass
                  tests.append(row)
                  print(method.upper(),url,r.status_code,len(r.content),r.headers.get('content-type'),r.text[:500],flush=True)
                except Exception as e:
                  tests.append({'method':method,'url':url,'error':repr(e)})
                  print('ERR',method,url,repr(e),flush=True)
          (out/'tests.json').write_text(json.dumps(tests,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: aixin-knowledge-doc-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
