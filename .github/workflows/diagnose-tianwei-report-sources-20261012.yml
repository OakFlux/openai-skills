name: Diagnose Tianwei broker report sources

on:
  pull_request:
    paths:
      - 'tasks/tianwei-broker-diagnostic-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch candidate pages and searches
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, pathlib, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          out = pathlib.Path('diagnostic_out')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          urls = {
            'baogaobox':'https://www.baogaobox.com/reports/240622000020971.html',
            'hangyan_chart':'https://www.hangyan.co/charts/3396484144153232497',
            'hangyan_search1':'https://www.hangyan.co/search?q=%E5%A4%A9%E5%BE%AE%E7%94%B5%E5%AD%90',
            'hangyan_search2':'https://www.hangyan.co/search?keyword=%E5%A4%A9%E5%BE%AE%E7%94%B5%E5%AD%90',
            'bing_exact':'https://www.bing.com/search?q='+urllib.parse.quote('"天微电子" "军用灭火防爆系统龙头" pdf'),
            'bing_general':'https://www.bing.com/search?q='+urllib.parse.quote('天微电子 688511 券商 研报 PDF'),
            'baidu_exact':'https://www.baidu.com/s?wd='+urllib.parse.quote('"天微电子" "军用灭火防爆系统龙头" PDF'),
            'duck_exact':'https://html.duckduckgo.com/html/?q='+urllib.parse.quote('"天微电子" "军用灭火防爆系统龙头" PDF'),
          }
          summary=[]
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              p=out/f'{name}.html'
              p.write_bytes(r.content)
              text=r.text
              links=[]
              for m in re.findall(r'https?://[^\s"\'<>]+', text):
                if any(k in m.lower() for k in ('pdf','report','hangyan','baogao','688511','tianwei')):
                  links.append(m[:500])
              soup=BeautifulSoup(text,'lxml')
              for a in soup.find_all('a',href=True):
                href=urllib.parse.urljoin(r.url,a['href'])
                label=' '.join(a.get_text(' ',strip=True).split())
                if any(k in (href+' '+label).lower() for k in ('pdf','report','研报','天微','688511','军用灭火')):
                  links.append(href+' | '+label)
              scripts=[]
              for sc in soup.find_all('script'):
                st=sc.get_text(' ',strip=True)
                if any(k in st for k in ('3396484144153232497','天微电子','军用灭火','reportId','report_id','pdf')):
                  scripts.append(st[:5000])
              summary.append({'name':name,'status':r.status_code,'url':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':list(dict.fromkeys(links))[:300], 'scripts':scripts[:30]})
              print('\n###',name,r.status_code,len(r.content),r.url)
              print('TITLE', summary[-1]['title'])
              for x in summary[-1]['links'][:100]: print('LINK',x)
              for x in scripts[:10]: print('SCRIPT',x[:1500].replace('\n',' '))
            except Exception as e:
              summary.append({'name':name,'error':repr(e),'url':url})
              print('ERROR',name,repr(e))
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-report-source-diagnostics
          path: diagnostic_out/
          if-no-files-found: error
          retention-days: 2
