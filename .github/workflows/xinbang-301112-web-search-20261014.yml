name: Search web for Xinbang Intelligent broker reports 20261014

on:
  push:
    paths:
      - '.github/workflows/xinbang-301112-web-search-20261014.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search Bing and public report sites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, time, urllib.parse, xml.etree.ElementTree as ET
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          queries=[
            '"信邦智能" 券商 研报 PDF',
            '"信邦智能" 深度报告',
            '"信邦智能" 新股报告',
            '"信邦智能" 新股覆盖研究',
            '"信邦智能" 华金证券',
            '"信邦智能" 申万宏源',
            '"301112" 券商 研报',
            '"301112" 新股 研究报告',
            '"广州信邦智能装备" 证券研究报告',
            '"信邦智能" 投资价值研究报告',
            '"信邦智能" filetype:pdf',
            'site:sgpjbg.com 信邦智能',
            'site:nxny.com 信邦智能 301112',
            'site:fxbaogao.com 信邦智能',
            'site:pdf.dfcfw.com 信邦智能',
            'site:hibor.com.cn 信邦智能',
            'site:pdf.hanspub.org 信邦智能',
          ]
          all_rows=[]
          for q in queries:
            # Bing RSS
            url='https://www.bing.com/search?format=rss&q='+urllib.parse.quote(q)
            try:
              r=s.get(url,timeout=(20,90))
              print('BING_RSS',q,r.status_code,len(r.content),r.url,flush=True)
              (out/('bing_'+str(len(all_rows))+'.xml')).write_bytes(r.content)
              if r.status_code==200:
                root=ET.fromstring(r.content)
                for item in root.findall('.//item'):
                  row={'engine':'bing_rss','query':q,'title':item.findtext('title') or '', 'link':item.findtext('link') or '', 'description':item.findtext('description') or ''}
                  all_rows.append(row); print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
            except Exception as e:
              print('BING_ERR',q,repr(e),flush=True)
            time.sleep(.2)

            # Bing HTML
            try:
              url2='https://cn.bing.com/search?q='+urllib.parse.quote(q)+'&count=50&setlang=zh-CN'
              r=s.get(url2,timeout=(20,90))
              print('BING_HTML',q,r.status_code,len(r.content),r.url,flush=True)
              if r.status_code==200:
                soup=BeautifulSoup(r.text,'lxml')
                for li in soup.select('li.b_algo'):
                  a=li.select_one('h2 a')
                  if not a: continue
                  p=li.select_one('.b_caption p')
                  row={'engine':'bing_html','query':q,'title':a.get_text(' ',strip=True),'link':a.get('href',''),'description':p.get_text(' ',strip=True) if p else ''}
                  all_rows.append(row); print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
            except Exception as e:
              print('BINGHTML_ERR',q,repr(e),flush=True)
            time.sleep(.2)

            # Baidu HTML
            try:
              bu='https://www.baidu.com/s?wd='+urllib.parse.quote(q)+'&rn=50'
              r=s.get(bu,timeout=(20,90),headers={'Referer':'https://www.baidu.com/'})
              print('BAIDU',q,r.status_code,len(r.content),r.url,flush=True)
              if r.status_code==200:
                soup=BeautifulSoup(r.text,'lxml')
                for div in soup.select('div.result, div.c-container'):
                  a=div.select_one('h3 a')
                  if not a: continue
                  row={'engine':'baidu','query':q,'title':a.get_text(' ',strip=True),'link':a.get('href',''),'description':div.get_text(' ',strip=True)[:500]}
                  all_rows.append(row); print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
            except Exception as e:
              print('BAIDU_ERR',q,repr(e),flush=True)
            time.sleep(.2)

          # de-dup
          uniq={}
          for x in all_rows:
            key=(x.get('link',''),x.get('title',''))
            uniq[key]=x
          rows=list(uniq.values())
          (out/'search_results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          with (out/'search_results.txt').open('w',encoding='utf-8') as f:
            for x in rows:
              f.write(json.dumps(x,ensure_ascii=False)+'\n')
          print('TOTAL',len(rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-web-search
          path: out
          retention-days: 7
