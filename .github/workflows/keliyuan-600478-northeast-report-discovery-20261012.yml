name: Find Keliyuan Northeast Securities report 20261012

on:
  push:
    paths:
      - '.github/workflows/keliyuan-600478-northeast-report-discovery-20261012.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          for page in range(1,16):
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':'2022-11-28','endTime':'2022-12-02','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(endpoint,params=p,timeout=60); print('QUERY',page,r.status_code,len(r.content),flush=True); r.raise_for_status()
              rows=(r.json() or {}).get('data') or []
              if not rows: break
              for x in rows:
                  text=' '.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgSName'))
                  if '科力远' in text or '600478' in text:
                      print('MATCH',json.dumps({k:x.get(k) for k in ['title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column','encodeUrl']},ensure_ascii=False),flush=True)
              if len(rows)<100: break
          PY
