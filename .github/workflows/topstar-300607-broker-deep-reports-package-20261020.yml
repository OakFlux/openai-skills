name: Package Topstar 300607 broker deep reports 20261020

on:
  push:
    paths:
      - '.github/workflows/topstar-300607-broker-deep-reports-package-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='拓斯达'
          FULL='广东拓斯达科技股份有限公司'
          CODE='300607'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART):
              d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'broker':'国金证券','date':'2023-12-29',
              'title':'聚集三大核心产品线，经营质量持续向好',
              'info_code':'AP202312291615469661','expected_pages':30,
              'filename':'01_2023-12-29_国金证券_聚集三大核心产品线_经营质量持续向好.pdf'
            },
            {
              'order':2,'broker':'开源证券','date':'2022-12-28',
              'title':'公司首次覆盖报告：开启三大增长曲线，深耕高端五轴数控机床',
              'info_code':'AP202212281581439441','expected_pages':24,
              'filename':'02_2022-12-28_开源证券_首次覆盖_开启三大增长曲线_深耕高端五轴数控机床.pdf'
            },
            {
              'order':3,'broker':'东亚前海证券','date':'2022-12-26',
              'title':'首次覆盖报告：多元布局高景气赛道，四轮驱动蓄势待发',
              'info_code':'AP202212261581375721','expected_pages':39,
              'filename':'03_2022-12-26_东亚前海证券_首次覆盖_多元布局高景气赛道_四轮驱动蓄势待发.pdf'
            },
          ]

          candidate_metadata=[
            {'publishDate':'2023-12-29','attachPages':30,'orgSName':'国金证券','title':'聚集三大核心产品线，经营质量持续向好','infoCode':'AP202312291615469661','rating':'增持','selected':True},
            {'publishDate':'2022-12-28','attachPages':24,'orgSName':'开源证券','title':'公司首次覆盖报告：开启三大增长曲线，深耕高端五轴数控机床','infoCode':'AP202212281581439441','rating':'买入','selected':True},
            {'publishDate':'2022-12-26','attachPages':39,'orgSName':'东亚前海证券','title':'首次覆盖报告：多元布局高景气赛道，四轮驱动蓄势待发','infoCode':'AP202212261581375721','rating':'增持','selected':True},
            {'publishDate':'2021-07-29','attachPages':35,'orgSName':'东莞证券','title':'深度报告：主营业务稳定增长，完善制造业领域布局','infoCode':'AP202107291506780163','rating':'增持','selected':False},
            {'publishDate':'2021-02-07','attachPages':33,'orgSName':'万联证券','title':'首次覆盖报告：注塑机、CNC接力成长，平台化战略打开新空间','infoCode':'AP202102071459773174','rating':'买入','selected':False},
            {'publishDate':'2020-04-01','attachPages':33,'orgSName':'新时代证券','title':'拓斯达首次覆盖报告：平台型智能制造服务商，短期口罩机业务爆发增长','infoCode':'AP202004011377436300','rating':'买入','selected':False},
            {'publishDate':'2019-08-16','attachPages':29,'orgSName':'世纪证券','title':'深度研究报告：掌握关键技术的智能制造综合服务商','infoCode':'AP201908161344343739','rating':'增持','selected':False},
            {'publishDate':'2020-01-05','attachPages':22,'orgSName':'国元证券','title':'拓斯达首次覆盖报告：工业机器人新贵，受益于自动化升级的产业大趋势','infoCode':'AP202001051373519133','rating':'买入','selected':False},
            {'publishDate':'2018-05-28','attachPages':27,'orgSName':'东吴证券','title':'“机器换人”步伐加快，自动化大趋势下的小而美公司','infoCode':'AP201805281149685113','rating':'增持','selected':False},
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/300607.html',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf'
            ]
            last={}
            for u in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(u,timeout=(30,420),allow_redirects=True)
                  last={'requested_url':u,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                    return r.content,str(r.url),last
                except Exception as e:
                  last={'requested_url':u,'error':repr(e)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,source_url,download_meta=download_pdf(item['info_code'])
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<15:
              raise RuntimeError(f'Too few pages: {dest.name} = {pages}')
            if abs(pages-item['expected_pages'])>2:
              raise RuntimeError(f'Unexpected page count: {dest.name} actual={pages} expected={item["expected_pages"]}')

            sample=[]
            indices=list(range(min(15,pages)))+[max(0,pages-2),pages-1]
            for i in dict.fromkeys(indices):
              try:
                sample.append(reader.pages[i].extract_text() or '')
              except Exception:
                pass
            text='\n'.join(sample)
            if not any(x in text for x in [COMPANY,FULL,CODE,'广东拓斯达科技']):
              txt=RENDER/f'{item["order"]:02d}.txt'
              subprocess.run(['pdftotext','-f','1','-l',str(min(18,pages)),str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              text += '\n' + txt.read_text(encoding='utf-8',errors='ignore')
            identity_ok=any(x in text for x in [COMPANY,FULL,CODE,'广东拓斯达科技'])
            broker_ok=item['broker'] in text or item['broker'].replace('证券','') in text
            if not identity_ok:
              raise RuntimeError(f'Issuer identity check failed: {dest.name}')
            if not broker_ok:
              raise RuntimeError(f'Broker identity check failed: {dest.name}')

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0:
              raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'
            last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8_000:
              raise RuntimeError(f'First-page render failed: {dest.name}')
            if not last_png.exists() or last_png.stat().st_size<3_000:
              raise RuntimeError(f'Last-page render failed: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'stock_code':CODE,'stock_name':COMPANY,'company_full_name':FULL,
              'broker':item['broker'],'publish_date':item['date'],'title':item['title'],
              'info_code':item['info_code'],'pages':pages,'bytes':len(data),'sha256':sha,
              'source_url':source_url,'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
              'filename':item['filename'],'identity_check':identity_ok,'broker_check':broker_ok,
              'validation':['PDF header','company identity','broker identity','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })

          if len(manifest)!=3 or len({x['sha256'] for x in manifest})!=3:
            raise RuntimeError('Report count or duplicate check failed')

          readme=[
            '拓斯达（300607.SZ；广东拓斯达科技股份有限公司）券商深度报告资料包',
            '整理日期：2026-10-20','',
            '收录数量：3份，均为拓斯达公司专属、公开可完整下载的长篇券商研究报告。',
            '筛选口径：优先近期公司深度、首次覆盖及系统性研究，兼顾工业机器人、注塑机、数控机床和智能制造业务分析。',
            '未使用短篇财报点评、行业报告、网页摘要、缺页预览或非券商材料补足数量。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   PDF来源：{m["source_url"]}',
              f'   研报页面：{m["report_page"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
            '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'拓斯达长篇研报候选清单.json').write_text(json.dumps(candidate_metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'拓斯达_300607_券商深度报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()):
              z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad:
              raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3:
              raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: topstar-300607-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
