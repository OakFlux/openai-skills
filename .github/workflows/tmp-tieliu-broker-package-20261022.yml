name: Build Tieliu broker research-report package

on:
  push:
    branches: [tmp-tieliu-broker-reports-20261022]
    paths: ['.github/workflows/tmp-tieliu-broker-package-20261022.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='铁流股份_券商研究报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local expected_pages="$3"
            local broker_pattern="$4"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 7 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=603926' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -eq "$expected_pages"

            pdftotext -f 1 -l "$pages" "$out" "$out.txt" 2>/dev/null
            grep -Eq '铁流股份有限公司|铁流股份' "$out.txt"
            grep -Eq "$broker_pattern" "$out.txt"
            rm -f "$out.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$out" "$out.last" >/dev/null 2>&1
            test -s "$out.first.png" && test -s "$out.last.png"
            rm -f "$out.first.png" "$out.last.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202509161744839321_1.pdf' \
            "$PACKAGE/01_开源证券_精密制造能力显著长期成长天花板高企_首次覆盖_2025-09-16.pdf" \
            12 \
            '开源证券|KAIYUAN SECURITIES'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202512111798351219_1.pdf' \
            "$PACKAGE/02_爱建证券_掌握精密加工全链路积极布局机器人_首次覆盖_2025-12-11.pdf" \
            5 \
            '爱建证券|AJ SECURITIES|爱建'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202512141800268763_1.pdf' \
            "$PACKAGE/03_开源证券_设立子公司全面进军具身智能深度合作哈特研究院_公司更新_2025-12-14.pdf" \
            4 \
            '开源证券|KAIYUAN SECURITIES'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('铁流股份_券商研究报告_3份')
          meta = {
              '01_开源证券_精密制造能力显著长期成长天花板高企_首次覆盖_2025-09-16.pdf': {
                  'broker': '开源证券',
                  'date': '2025-09-16',
                  'title': '精密制造能力显著，长期成长天花板高企',
                  'type': '中小盘首次覆盖报告（长篇）',
                  'index': 'AP202509161744839321',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202509161744839321_1.pdf',
              },
              '02_爱建证券_掌握精密加工全链路积极布局机器人_首次覆盖_2025-12-11.pdf': {
                  'broker': '爱建证券',
                  'date': '2025-12-11',
                  'title': '掌握精密加工全链路，积极布局机器人',
                  'type': '首次覆盖报告（短篇）',
                  'index': 'AP202512111798351219',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202512111798351219_1.pdf',
              },
              '03_开源证券_设立子公司全面进军具身智能深度合作哈特研究院_公司更新_2025-12-14.pdf': {
                  'broker': '开源证券',
                  'date': '2025-12-14',
                  'title': '设立子公司全面进军具身智能，深度合作哈特研究院',
                  'type': '中小盘信息更新报告（短篇）',
                  'index': 'AP202512141800268763',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202512141800268763_1.pdf',
              },
          }
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '铁流股份（603926）券商研究报告资料包',
              '整理日期：2026-10-22',
              '',
              '收录说明：',
              '1. 公开个股研报索引共列出5份报告，其中仅1份达到10页以上的长篇公司深度/首次覆盖标准。',
              '2. 本包收录该长篇首次覆盖报告，并补充2份较新的完整首次覆盖或公司更新报告。',
              '3. 排除2017年旧业绩点评、新股询价报告、网页摘要及非券商材料。',
              '4. 三份文件均为公开渠道直接下载的券商原始PDF，仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  PDF来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、精确页数、正文公司名称、券商名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Tieliu-603926-broker-research-reports-3
          path: 铁流股份_券商研究报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
