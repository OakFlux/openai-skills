name: Build Dadixiong 688077 disclosure package

on:
  push:
    branches:
      - tmp-dadixiong-688077-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='大地熊_688077_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE" /tmp/dadixiong_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import parse_qs, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('大地熊_688077_全部年报_招股说明书_最新季报')
          STOCK = '688077'
          TODAY = '2026-10-28'

          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def get_text(url: str) -> str:
              r = session.get(url, timeout=(30, 180), allow_redirects=True)
              if r.status_code != 200:
                  raise RuntimeError(f'HTTP {r.status_code} for {url}')
              r.encoding = r.apparent_encoding or r.encoding or 'gb18030'
              return r.text

          def clean(value: str) -> str:
              value = BeautifulSoup(value or '', 'html.parser').get_text(' ', strip=True)
              return re.sub(r'\s+', '', value)

          def extract_detail_id(detail_url: str) -> str | None:
              query = parse_qs(urlparse(detail_url).query)
              values = query.get('id') or query.get('ID')
              return values[0] if values else None

          def find_date_near(anchor) -> str | None:
              nodes = [anchor]
              parent = anchor.parent
              for _ in range(4):
                  if parent is None:
                      break
                  nodes.append(parent)
                  parent = parent.parent
              for node in nodes:
                  text = node.get_text(' ', strip=True) if hasattr(node, 'get_text') else str(node)
                  m = re.search(r'20\d{2}[-年/.]\d{1,2}[-月/.]\d{1,2}', text)
                  if m:
                      date = m.group(0).replace('年', '-').replace('月', '-').replace('日', '').replace('/', '-').replace('.', '-')
                      y, mo, d = date.split('-')
                      return f'{int(y):04d}-{int(mo):02d}-{int(d):02d}'
              return None

          def discover_sina_list(urls: list[str], predicate) -> list[dict]:
              found = []
              seen = set()
              for list_url in urls:
                  try:
                      text = get_text(list_url)
                      soup = BeautifulSoup(text, 'html.parser')
                      for a in soup.find_all('a', href=True):
                          title = clean(a.get_text(' ', strip=True))
                          href = html.unescape(a.get('href', '')).strip()
                          if not predicate(title):
                              continue
                          detail = urljoin(list_url, href)
                          bulletin_id = extract_detail_id(detail)
                          date = find_date_near(a)
                          key = (title, bulletin_id, date)
                          if key in seen:
                              continue
                          seen.add(key)
                          found.append({'title': title, 'detail': detail, 'id': bulletin_id, 'date': date})
                  except Exception as exc:
                      print('LIST DISCOVERY FAILED', list_url, repr(exc))
              return found

          annual_urls = [
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/ndbg.phtml',
              f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/ndbg.phtml',
          ]
          annual_candidates = discover_sina_list(
              annual_urls,
              lambda t: '年度报告' in t and '摘要' not in t and '审计' not in t,
          )
          print('ANNUAL CANDIDATES', json.dumps(annual_candidates, ensure_ascii=False, indent=2))

          annuals = []
          for year in range(2020, 2026):
              matching = [x for x in annual_candidates if f'{year}年年度报告' in x['title']]
              if not matching:
                  raise RuntimeError(f'No annual report discovered for {year}')
              matching.sort(key=lambda x: (x.get('date') or '', '更新' in x['title'] or '修订' in x['title']), reverse=True)
              chosen = matching[0]
              chosen.update({'kind': 'annual', 'year': year, 'min_pages': 80})
              annuals.append(chosen)

          quarter_urls = [
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/yjdbg.phtml',
              f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/yjdbg.phtml',
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/sjdbg.phtml',
              f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/sjdbg.phtml',
              f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK}.phtml',
          ]
          quarter_candidates = discover_sina_list(
              quarter_urls,
              lambda t: ('第一季度报告' in t or '第三季度报告' in t) and '摘要' not in t,
          )
          quarter_candidates = [x for x in quarter_candidates if x.get('date') and x['date'] <= TODAY]
          quarter_candidates.sort(key=lambda x: x['date'], reverse=True)
          print('QUARTER CANDIDATES', json.dumps(quarter_candidates[:20], ensure_ascii=False, indent=2))
          if not quarter_candidates:
              raise RuntimeError('No disclosed quarterly report found')
          quarter = quarter_candidates[0]
          quarter.update({'kind': 'quarter', 'year': int(quarter['date'][:4]), 'min_pages': 5})

          prospectus = {
              'title': '首次公开发行股票并在科创板上市招股说明书',
              'detail': f'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=6445485&stockid={STOCK}',
              'id': '6445485',
              'date': '2020-07-17',
              'kind': 'prospectus',
              'year': 2020,
              'min_pages': 300,
          }

          documents = [prospectus] + annuals + [quarter]

          def extract_pdf_urls(detail_url: str) -> list[str]:
              urls: list[str] = []
              try:
                  text = get_text(detail_url)
                  decoded = html.unescape(text)
                  soup = BeautifulSoup(decoded, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = html.unescape(a.get('href', '')).strip()
                      label = clean(a.get_text(' ', strip=True))
                      if '.pdf' in href.lower() or '下载公告' in label:
                          urls.append(urljoin(detail_url, href))
                  for m in re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?', decoded, flags=re.I):
                      urls.append(html.unescape(m))
              except Exception as exc:
                  print('DETAIL EXTRACTION FAILED', detail_url, repr(exc))
              unique = []
              seen = set()
              for url in urls:
                  url = url.replace('\\/', '/')
                  if url.startswith('//'):
                      url = 'https:' + url
                  if url.startswith('http://'):
                      url = 'https://' + url[7:]
                  if url not in seen:
                      seen.add(url)
                      unique.append(url)
              return unique

          def fallback_urls(doc: dict) -> list[str]:
              bulletin_id = doc.get('id')
              date = doc.get('date')
              if not bulletin_id or not date:
                  return []
              y = date[:4]
              m = str(int(date[5:7]))
              m2 = date[5:7]
              urls = []
              for market in ('CNSESH_STOCK', 'CNSESZ_STOCK'):
                  for month_dir in (f'{y}-{m}', f'{y}-{m2}'):
                      for host in ('211.154.219.97:9494', '211.154.219.97%3A9494'):
                          urls.append(f'https://file.finance.sina.com.cn/{host}/MRGG/{market}/{y}/{month_dir}/{date}/{bulletin_id}.PDF')
              return urls

          def matches_document(path: Path, doc: dict, pages: int) -> bool:
              reader = PdfReader(str(path), strict=False)
              indices = list(range(min(12, pages)))
              if pages > 12:
                  indices.append(pages - 1)
              text = ''
              for index in dict.fromkeys(indices):
                  try:
                      text += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '大地熊' not in compact and '安徽大地熊新材料股份有限公司' not in compact:
                  return False
              if doc['kind'] == 'prospectus':
                  return '招股说明书' in compact and '首次公开发行股票' in compact
              if doc['kind'] == 'annual':
                  y = str(doc['year'])
                  return f'{y}年年度报告' in compact or f'{y}年度报告' in compact
              if doc['kind'] == 'quarter':
                  return '季度报告' in compact and str(doc['year']) in compact
              return True

          def download_document(doc: dict) -> dict:
              candidates = extract_pdf_urls(doc['detail']) + fallback_urls(doc)
              candidates = list(dict.fromkeys(candidates))
              last = None
              temp = OUT / '_temp.pdf'
              for attempt in range(6):
                  for url in candidates:
                      try:
                          r = session.get(
                              url,
                              headers={
                                  'Referer': doc['detail'],
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = r.content
                          if r.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(f'HTTP={r.status_code} bytes={len(data)} type={r.headers.get("content-type")}')
                          temp.write_bytes(data)
                          pages = len(PdfReader(str(temp), strict=False).pages)
                          if pages < int(doc['min_pages']):
                              raise RuntimeError(f'pages={pages} below {doc["min_pages"]}')
                          if not matches_document(temp, doc, pages):
                              raise RuntimeError('company/title mismatch')
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', doc['title'], 'pages=', pages, 'bytes=', len(data), 'source=', r.url, 'sha256=', sha)
                          return {
                              **doc,
                              'source': r.url,
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': sha,
                              'data': data,
                          }
                      except Exception as exc:
                          last = exc
                          temp.unlink(missing_ok=True)
                  time.sleep(min(2 + attempt, 8))
              raise RuntimeError(f'Could not download {doc["title"]}: {last!r}')

          records = []
          for doc in documents:
              item = download_document(doc)
              if item['kind'] == 'prospectus':
                  filename = '01_大地熊_首次公开发行股票并在科创板上市招股说明书_2020-07-17.pdf'
              elif item['kind'] == 'annual':
                  suffix = '_更新版' if ('更新' in item['title'] or '修订' in item['title']) else ''
                  filename = f"{item['year'] - 2018:02d}_大地熊_{item['year']}年年度报告{suffix}.pdf"
              else:
                  title = '2026年第一季度报告' if '第一季度' in item['title'] else item['title']
                  filename = f"08_大地熊_{title}.pdf"
              path = OUT / filename
              path.write_bytes(item.pop('data'))
              item['file'] = filename
              records.append(item)

          records.sort(key=lambda x: (0 if x['kind'] == 'prospectus' else 1 if x['kind'] == 'annual' else 2, x.get('year', 0)))

          lines = [
              '大地熊（688077）全部年报、招股说明书及最新季报资料包',
              '整理日期：2026-10-28',
              '',
              '收录范围：',
              '1. 2020—2025年度报告全文，共6份；若同一年度存在更新版或修订版，采用最新披露版本。',
              '2. 2020年7月17日披露的首次公开发行股票并在科创板上市招股说明书正式发行版。',
              '3. 截至2026年10月28日最新已正式披露的季度报告。2026年第三季度报告预约于2026年10月29日披露，因此本包收录2026年第一季度报告。',
              '4. 未收录年度报告摘要、半年度报告、招股意向书、申报稿或其他临时公告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for idx, item in enumerate(records, start=1):
              total_pages += int(item['pages'])
              total_bytes += int(item['bytes'])
              lines += [
                  f'{idx}. {item["file"]}',
                  f'   文档：{item["title"]}',
                  f'   披露日期：{item["date"]}',
                  f'   页数：{item["pages"]}页',
                  f'   原始PDF：{item["source"]}',
                  f'   公告/索引页：{item["detail"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
              sums.append(f'{item["sha256"]}  {item["file"]}')
          lines += [
              f'合计：{len(records)}份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件均为公开渠道直接下载的完整PDF。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '大地熊|安徽大地熊新材料股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/dadixiong_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/dadixiong_test.zip "$PACKAGE"
          unzip -t /tmp/dadixiong_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/dadixiong_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f /tmp/dadixiong_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dadixiong-688077-annual-reports-prospectus-latest-quarter
          path: 大地熊_688077_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
