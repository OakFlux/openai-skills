name: Discover Berry reports by exact date and title

on:
  pull_request:
    paths:
      - 'tasks/berry-exact-date-report-discovery-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Query Eastmoney general report index on target dates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          target_windows = [
              ('2025-08-27','2025-08-30'),
              ('2020-09-28','2020-10-01'),
              ('2020-07-17','2020-07-21'),
              ('2020-04-06','2020-04-09'),
          ]
          keywords = ('贝瑞基因','贝瑞和康','解码生命经纬','基因测序行业的领头羊','肿瘤早筛','先行一步','蓄势待发')
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)))
          found=[]
          for begin,end in target_windows:
            for qtype in range(0,4):
              for page in range(1,80):
                params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':str(qtype),
                  'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                }
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(25,180))
                print('QUERY',begin,end,qtype,page,r.status_code,len(r.content),flush=True)
                if r.status_code!=200: break
                payload=r.json();batch=payload.get('data') or []
                for row in batch:
                  blob=json.dumps(row,ensure_ascii=False)
                  if any(k in blob for k in keywords) or str(row.get('stockCode') or '')=='000710':
                    rec=dict(row);rec['_window']=[begin,end];rec['_qType']=qtype;found.append(rec)
                    print('MATCH',json.dumps({k:rec.get(k) for k in ('_qType','infoCode','title','orgSName','publishDate','attachPages','attachSize','stockName','stockCode')},ensure_ascii=False),flush=True)
                total=int(payload.get('TotalPage') or payload.get('totalPage') or 1)
                if page>=total or not batch: break
          uniq={}
          for row in found:
            key=str(row.get('infoCode') or (row.get('title'),row.get('orgSName'),row.get('publishDate')));uniq[key]=row
          rows=list(uniq.values());rows.sort(key=lambda x:str(x.get('publishDate') or ''),reverse=True)
          Path('output/matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_COUNT',len(rows),flush=True)
          print(json.dumps([{k:r.get(k) for k in ('_qType','infoCode','title','orgSName','publishDate','attachPages','attachSize','stockName','stockCode')} for r in rows],ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: berry-exact-date-report-discovery
          path: output/matches.json
          retention-days: 7
          if-no-files-found: error
