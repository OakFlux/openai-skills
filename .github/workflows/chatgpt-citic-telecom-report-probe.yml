name: Probe public CITIC Telecom International broker reports

on:
  push:
    branches:
      - chatgpt-citic-telecom-broker-reports-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Search public sources and inspect candidate pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe_output
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import base64, html, json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('probe_output')
          s = requests.Session(); s.trust_env = False
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
          s.headers.update({'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7'})

          queries = [
              '"中信国际电讯" 券商 研报 pdf',
              '"中信国际电讯" 深度 报告',
              '"中信国际电讯" 首次覆盖',
              '"中信国际电讯" 目标价 券商',
              '"中信國際電訊" 研究報告 pdf',
              '"01883.HK" 研报 pdf',
              '"1883.HK" 研究报告',
              '"CITIC Telecom International" research report pdf',
              '"CITIC Telecom International" initiation report',
              '"CITIC Telecom" equity research 1883',
              '"中信国际电讯" 第一上海',
              '"中信国际电讯" 国泰君安国际',
              '"中信国际电讯" 招银国际',
              '"中信国际电讯" 海通国际',
              '"中信国际电讯" 光大证券国际',
          ]
          engines = {
              'bing': 'https://www.bing.com/search?q={q}&count=50&setlang=zh-hans',
              '360': 'https://www.so.com/s?q={q}',
              'baidu': 'https://www.baidu.com/s?wd={q}&rn=50',
              'sogou': 'https://www.sogou.com/web?query={q}&num=50',
          }

          def clean_text(x: str) -> str:
              return re.sub(r'\s+', ' ', x or '').strip()

          def decode_bing(url: str) -> str | None:
              try:
                  p = urllib.parse.urlparse(url)
                  qs = urllib.parse.parse_qs(p.query)
                  u = qs.get('u', [''])[0]
                  if u.startswith('a1'):
                      raw = u[2:]
                      raw += '=' * ((4 - len(raw) % 4) % 4)
                      return base64.urlsafe_b64decode(raw).decode('utf-8', 'replace')
              except Exception:
                  pass
              return None

          search_records=[]
          all_candidates=[]
          for qi,q in enumerate(queries,1):
              for eng,tpl in engines.items():
                  url=tpl.format(q=urllib.parse.quote(q))
                  try:
                      r=s.get(url,timeout=(15,90),allow_redirects=True)
                      soup=BeautifulSoup(r.text,'lxml')
                      found=[]
                      for a in soup.find_all('a',href=True):
                          href=html.unescape(a.get('href') or '')
                          text=clean_text(a.get_text(' ',strip=True))
                          if not href: continue
                          absu=urllib.parse.urljoin(r.url,href)
                          decoded = decode_bing(absu) if eng=='bing' else None
                          target=decoded or absu
                          blob=(text+' '+target).lower()
                          if any(k in blob for k in ['中信国际电讯','中信國際電訊','citic telecom','01883','1883.hk','1883 hk']):
                              item={'query':q,'engine':eng,'text':text[:300],'url':target,'raw_url':absu}
                              found.append(item); all_candidates.append(item)
                      rec={'query':q,'engine':eng,'status':r.status_code,'bytes':len(r.content),'final_url':r.url,'title':clean_text(soup.title.get_text(' ',strip=True) if soup.title else ''),'found':found}
                      search_records.append(rec)
                      print('\nSEARCH',eng,repr(q),'status=',r.status_code,'bytes=',len(r.content),'hits=',len(found),flush=True)
                      for item in found[:100]: print('CAND',json.dumps(item,ensure_ascii=False),flush=True)
                  except Exception as e:
                      search_records.append({'query':q,'engine':eng,'error':repr(e)})
                      print('SEARCH_FAIL',eng,repr(q),repr(e),flush=True)
                  time.sleep(.15)

          direct_pages = {
              'nxny_stock':'https://www.nxny.com/stock/stock_01883/',
              'nxny_search':'https://www.nxny.com/search/?key=%E4%B8%AD%E4%BF%A1%E5%9B%BD%E9%99%85%E7%94%B5%E8%AE%AF',
              'hangyan_q':'https://www.hangyan.co/reports?q=%E4%B8%AD%E4%BF%A1%E5%9B%BD%E9%99%85%E7%94%B5%E8%AE%AF',
              'hangyan_keyword':'https://www.hangyan.co/reports?keyword=%E4%B8%AD%E4%BF%A1%E5%9B%BD%E9%99%85%E7%94%B5%E8%AE%AF',
              'fx_search':'https://www.fxbaogao.com/search?keyword=%E4%B8%AD%E4%BF%A1%E5%9B%BD%E9%99%85%E7%94%B5%E8%AE%AF',
              'sg_search':'https://www.sgpjbg.com/search.html?keyword=%E4%B8%AD%E4%BF%A1%E5%9B%BD%E9%99%85%E7%94%B5%E8%AE%AF',
              'hibor_search':'https://www.hibor.com.cn/search?word=%E4%B8%AD%E4%BF%A1%E5%9B%BD%E9%99%85%E7%94%B5%E8%AE%AF',
              'vzkoo_search':'https://www.vzkoo.com/search?keyword=%E4%B8%AD%E4%BF%A1%E5%9B%BD%E9%99%85%E7%94%B5%E8%AE%AF',
          }
          direct_records={}
          for name,url in direct_pages.items():
              try:
                  r=s.get(url,timeout=(15,90),allow_redirects=True)
                  text=r.text
                  (OUT/f'{name}.html').write_text(text,encoding='utf-8',errors='replace')
                  soup=BeautifulSoup(text,'lxml')
                  links=[]
                  for a in soup.find_all('a',href=True):
                      t=clean_text(a.get_text(' ',strip=True)); u=urllib.parse.urljoin(r.url,a['href'])
                      blob=(t+' '+u).lower()
                      if any(k in blob for k in ['中信国际电讯','中信國際電訊','citic telecom','01883','1883.hk','研报','报告','report']):
                          links.append({'text':t[:300],'url':u})
                  snippets=[]
                  for term in ['中信国际电讯','中信國際電訊','CITIC Telecom','01883','1883.HK']:
                      for m in list(re.finditer(re.escape(term),text,re.I))[:40]:
                          snippets.append(clean_text(text[max(0,m.start()-500):m.start()+1200])[:1800])
                  direct_records[name]={'status':r.status_code,'bytes':len(r.content),'final_url':r.url,'title':clean_text(soup.title.get_text(' ',strip=True) if soup.title else ''),'links':links[:1000],'snippets':snippets[:100]}
                  print('\nDIRECT',name,r.status_code,len(r.content),r.url,'links=',len(links),flush=True)
                  for item in links[:200]: print('LINK',json.dumps(item,ensure_ascii=False),flush=True)
                  for sn in snippets[:15]: print('SNIP',sn,flush=True)
              except Exception as e:
                  direct_records[name]={'error':repr(e)}
                  print('DIRECT_FAIL',name,url,repr(e),flush=True)

          # Resolve unique external candidates, avoiding search engine/navigation URLs.
          unique=[]; seen=set()
          skip_hosts={'www.bing.com','bing.com','www.baidu.com','baidu.com','www.so.com','so.com','www.sogou.com','sogou.com','chat.baidu.com','ai.so.com'}
          for item in all_candidates:
              u=item['url']
              try:
                  host=urllib.parse.urlparse(u).netloc.lower()
              except Exception: continue
              if not host or host in skip_hosts: continue
              key=u.split('#')[0]
              if key in seen: continue
              seen.add(key); unique.append(item)

          resolved=[]
          for item in unique[:250]:
              u=item['url']
              try:
                  rr=s.get(u,timeout=(12,60),allow_redirects=True,stream=True)
                  ctype=rr.headers.get('content-type','')
                  head=rr.raw.read(65536,decode_content=True)
                  title=''; snippets=[]; links=[]
                  if 'html' in ctype.lower() or b'<html' in head.lower() or b'<!doctype' in head.lower():
                      enc=rr.encoding or 'utf-8'
                      body=head.decode(enc,errors='replace')
                      soup=BeautifulSoup(body,'lxml')
                      title=clean_text(soup.title.get_text(' ',strip=True) if soup.title else '')
                      for term in ['中信国际电讯','中信國際電訊','CITIC Telecom','01883','1883.HK']:
                          for m in list(re.finditer(re.escape(term),body,re.I))[:5]:
                              snippets.append(clean_text(body[max(0,m.start()-300):m.start()+700])[:1000])
                      for tag in soup.find_all(['a','iframe','embed','object'],limit=500):
                          for attr in ('href','src','data'):
                              v=tag.get(attr)
                              if v:
                                  au=urllib.parse.urljoin(rr.url,v)
                                  if any(k in au.lower() for k in ['pdf','download','report','baogao','detail','view']): links.append(au)
                  rec={**item,'status':rr.status_code,'final_url':rr.url,'ctype':ctype,'head_bytes':len(head),'title':title,'snippets':snippets[:10],'links':list(dict.fromkeys(links))[:100]}
                  resolved.append(rec)
                  print('\nRESOLVED',json.dumps({k:rec.get(k) for k in ['text','url','status','final_url','ctype','title']},ensure_ascii=False),flush=True)
                  for sn in snippets[:5]: print('RSNIP',sn,flush=True)
                  for lk in rec['links'][:30]: print('RLINK',lk,flush=True)
              except Exception as e:
                  resolved.append({**item,'resolve_error':repr(e)})
                  print('RESOLVE_FAIL',u,repr(e),flush=True)

          data={'search_records':search_records,'direct_records':direct_records,'resolved_candidates':resolved}
          (OUT/'probe_results.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\nSUMMARY searches=',len(search_records),'raw_candidates=',len(all_candidates),'unique_external=',len(unique),'resolved=',len(resolved),flush=True)
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: citic-telecom-broker-report-probe
          path: probe_output/
          retention-days: 3
          if-no-files-found: error
