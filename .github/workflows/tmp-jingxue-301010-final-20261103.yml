name: Build final Jingxue 301010 disclosure package

on:
  push:
    branches:
      - tmp-jingxue-301010-final-20261103

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='晶雪节能_301010_全部年报_招股说明书_最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/jingxue_final_render

          python3 - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import json
          import re
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          out = Path('晶雪节能_301010_全部年报_招股说明书_最新季报')
          documents = [
              {
                  'order': 1,
                  'kind': 'prospectus',
                  'year': 2021,
                  'title': '首次公开发行股票并在创业板上市招股说明书',
                  'date': '2021-06-11',
                  'filename': '01_晶雪节能_首次公开发行股票并在创业板上市招股说明书_2021-06-11.pdf',
                  'pages': 605,
                  'announcement': '1210217780',
                  'url': 'https://static.cninfo.com.cn/finalpage/2021-06-11/1210217780.PDF',
                  'referer': 'https://www.cninfo.com.cn/',
              },
              {
                  'order': 2,
                  'kind': 'annual',
                  'year': 2021,
                  'title': '2021年年度报告',
                  'date': '2022-04-23',
                  'filename': '02_晶雪节能_2021年年度报告.pdf',
                  'pages': 199,
                  'announcement': 'AN202204221560864089',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202204221560864089_1.pdf',
                  'referer': 'https://data.eastmoney.com/notices/detail/301010/AN202204221560864089.html',
              },
              {
                  'order': 3,
                  'kind': 'annual',
                  'year': 2022,
                  'title': '2022年年度报告',
                  'date': '2023-04-25',
                  'filename': '03_晶雪节能_2022年年度报告.pdf',
                  'pages': 174,
                  'announcement': 'AN202304241585758429',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202304241585758429_1.pdf',
                  'referer': 'https://data.eastmoney.com/notices/detail/301010/AN202304241585758429.html',
              },
              {
                  'order': 4,
                  'kind': 'annual',
                  'year': 2023,
                  'title': '2023年年度报告',
                  'date': '2024-04-23',
                  'filename': '04_晶雪节能_2023年年度报告.pdf',
                  'pages': 184,
                  'announcement': 'AN202404221630968366',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202404221630968366_1.pdf',
                  'referer': 'https://data.eastmoney.com/notices/detail/301010/AN202404221630968366.html',
              },
              {
                  'order': 5,
                  'kind': 'annual',
                  'year': 2024,
                  'title': '2024年年度报告',
                  'date': '2025-04-19',
                  'filename': '05_晶雪节能_2024年年度报告.pdf',
                  'pages': 192,
                  'announcement': 'AN202504181658494810',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202504181658494810_1.pdf',
                  'referer': 'https://data.eastmoney.com/notices/detail/301010/AN202504181658494810.html',
              },
              {
                  'order': 6,
                  'kind': 'annual',
                  'year': 2025,
                  'title': '2025年年度报告',
                  'date': '2026-04-27',
                  'filename': '06_晶雪节能_2025年年度报告.pdf',
                  'pages': 181,
                  'announcement': 'AN202604261821588694',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202604261821588694_1.pdf',
                  'referer': 'https://data.eastmoney.com/notices/detail/301010/AN202604261821588694.html',
              },
              {
                  'order': 7,
                  'kind': 'quarter',
                  'year': 2026,
                  'title': '2026年第三季度报告',
                  'date': '2026-10-30',
                  'filename': '07_晶雪节能_2026年第三季度报告.pdf',
                  'pages': 11,
                  'announcement': 'AN202610291831179847',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202610291831179847_1.pdf',
                  'referer': 'https://data.eastmoney.com/notices/detail/301010/AN202610291831179847.html',
              },
          ]

          def sample_text(reader: PdfReader) -> str:
              count = len(reader.pages)
              indexes = list(range(min(22, count)))
              if count > 22:
                  indexes.append(count - 1)
              text = ''
              for index in dict.fromkeys(indexes):
                  try:
                      text += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              return re.sub(r'\s+', '', text)

          def fetch(document: dict) -> dict:
              session = requests.Session()
              session.trust_env = False
              session.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  'Referer': document['referer'],
              })
              response = session.get(document['url'], timeout=(30, 180), allow_redirects=True)
              data = response.content
              if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                  raise RuntimeError(
                      f"{document['title']}: HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get('content-type')}"
                  )
              destination = out / document['filename']
              destination.write_bytes(data)
              reader = PdfReader(str(destination), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != document['pages']:
                  raise RuntimeError(
                      f"{document['filename']}: expected {document['pages']} pages, got {actual_pages}"
                  )
              compact = sample_text(reader)
              if '晶雪节能' not in compact and '江苏晶雪节能科技股份有限公司' not in compact:
                  raise RuntimeError(f"{document['filename']}: company mismatch")
              if document['kind'] == 'prospectus':
                  if '首次公开发行股票' not in compact or '招股说明书' not in compact:
                      raise RuntimeError(f"{document['filename']}: prospectus mismatch")
              elif document['kind'] == 'annual':
                  year = str(document['year'])
                  if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                      raise RuntimeError(f"{document['filename']}: annual title mismatch")
                  if '年度报告摘要' in compact[:1200]:
                      raise RuntimeError(f"{document['filename']}: summary received")
              else:
                  if ('第三季度报告' not in compact and '三季度报告' not in compact) or '2026' not in compact:
                      raise RuntimeError(f"{document['filename']}: quarter title mismatch")
              sha = hashlib.sha256(data).hexdigest()
              print('DOWNLOADED', document['title'], 'pages=', actual_pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
              return {
                  **document,
                  'bytes': len(data),
                  'source': response.url,
                  'sha256': sha,
              }

          records = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as executor:
              futures = [executor.submit(fetch, document) for document in documents]
              for future in concurrent.futures.as_completed(futures):
                  records.append(future.result())
          records.sort(key=lambda item: item['order'])

          lines = [
              '晶雪节能（301010）全部年度报告、招股说明书及最新季报资料包',
              '整理日期：2026-11-03',
              '',
              '收录范围：',
              '1. 公司于2021年6月18日在深交所创业板上市；上市公司口径的全部年度报告为2021-2025年度，共5份。',
              '2. 收录2021年6月11日披露的首次公开发行股票并在创业板上市招股说明书正式发行版。',
              '3. 最新季报为2026年10月30日披露的2026年第三季度报告。',
              '4. 未收录年度报告摘要、半年度报告、招股意向书、申报稿、注册稿或提示性公告。',
              '',
              '文件清单：',
          ]
          checksums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['filename']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   公告编号：{item['announcement']}",
                  f"   原始PDF：{item['source']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              checksums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f'合计：7份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '晶雪节能|江苏晶雪节能科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/jingxue_final_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          test "$(pdfinfo "$PACKAGE/01_晶雪节能_首次公开发行股票并在创业板上市招股说明书_2021-06-11.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 605
          test "$(pdfinfo "$PACKAGE/02_晶雪节能_2021年年度报告.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 199
          test "$(pdfinfo "$PACKAGE/03_晶雪节能_2022年年度报告.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 174
          test "$(pdfinfo "$PACKAGE/04_晶雪节能_2023年年度报告.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 184
          test "$(pdfinfo "$PACKAGE/05_晶雪节能_2024年年度报告.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 192
          test "$(pdfinfo "$PACKAGE/06_晶雪节能_2025年年度报告.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 181
          test "$(pdfinfo "$PACKAGE/07_晶雪节能_2026年第三季度报告.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 11

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/jingxue_final_test.zip "$PACKAGE"
          unzip -t /tmp/jingxue_final_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/jingxue_final_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/jingxue_final_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Jingxue-301010-all-annual-reports-prospectus-latest-quarter-final
          path: 晶雪节能_301010_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
