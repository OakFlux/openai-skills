name: Build Energy Environment broker-report package

on:
  push:
    branches: [tmp-jienenghuanjing-broker-reports-20261016]
    paths: ['.github/workflows/tmp-jienenghuanjing-broker-package-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='节能环境_券商公司研究报告_2份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=300140' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 8 "$out" "$out.txt" 2>/dev/null
            grep -Eq '节能环境|中环装备|中节能环保装备股份有限公司|启源装备' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201811211249618352_1.pdf' \
            "$PACKAGE/01_西南证券_监测大单持续落地业务新增长点确立_2018-11-21.pdf" \
            12

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201802011085139811_1.pdf' \
            "$PACKAGE/02_西南证券_收购兆盛环保中节能旗下唯一环保上市公司_2018-02-01.pdf" \
            10

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('节能环境_券商公司研究报告_2份')
          meta = {
              '01_西南证券_监测大单持续落地业务新增长点确立_2018-11-21.pdf': {
                  'broker': '西南证券',
                  'title': '监测大单持续落地，业务新增长点确立',
                  'date': '2018-11-21',
                  'index': 'AP201811211249618352',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201811211249618352_1.pdf',
              },
              '02_西南证券_收购兆盛环保中节能旗下唯一环保上市公司_2018-02-01.pdf': {
                  'broker': '西南证券',
                  'title': '收购兆盛环保，中节能旗下唯一环保上市公司',
                  'date': '2018-02-01',
                  'index': 'AP201802011085139811',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201802011085139811_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 2:
              raise SystemExit(f'Expected 2 PDFs, found {len(pdfs)}')

          lines = [
              '节能环境（300140，原中环装备）券商公司研究报告',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 收录公开可直接下载并可完整校验的券商公司研究报告2份。',
              '2. 报告发布时公司证券简称为“中环装备”，现证券简称为“节能环境”。',
              '3. 已检索到2025年国泰海通证券首次覆盖报告，但其公开页面要求登录，未取得可校验的完整PDF原件，因此未将网页摘要或不完整文件混入本包。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 2
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Energy-Environment-300140-broker-research-reports-2
          path: 节能环境_券商公司研究报告_2份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
