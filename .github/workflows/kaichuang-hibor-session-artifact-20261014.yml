name: Inspect Hibor reports through session redirects

on:
  push:
    paths:
      - '.github/workflows/kaichuang-hibor-session-artifact-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch report pages through normal session flow
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          ids=['178938','182952','209931','210263','211839','211932']
          out=Path('hibor_session'); out.mkdir(exist_ok=True)
          manifest=[]
          for rid in ids:
              s=requests.Session(); s.trust_env=False
              s.headers.update({
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
                  'Upgrade-Insecure-Requests':'1',
              })
              home=s.get('https://www.hibor.com.cn/',timeout=45,allow_redirects=True)
              url=f'https://www.hibor.com.cn/docdetail_{rid}.html'
              r=s.get(url,headers={'Referer':home.url},timeout=60,allow_redirects=True)
              fn=out/f'{rid}_final.html'; fn.write_bytes(r.content)
              item={
                  'id':rid,'requested':url,'home_status':home.status_code,'home_url':home.url,
                  'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),
                  'bytes':len(r.content),'cookies':s.cookies.get_dict(),
                  'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location'),'set_cookie':h.headers.get('set-cookie')} for h in r.history],
              }
              text=r.content.decode(r.apparent_encoding or r.encoding or 'utf-8',errors='replace')
              soup=BeautifulSoup(text,'lxml')
              item['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              item['plain']=' '.join(soup.get_text(' ',strip=True).split())[:3000]
              item['scripts']=[urljoin(r.url,t.get('src')) for t in soup.find_all('script',src=True)]
              item['forms']=[{'action':urljoin(r.url,f.get('action') or ''),'method':f.get('method'),'id':f.get('id')} for f in soup.find_all('form')]
              item['links']=[{'label':' '.join(a.get_text(' ',strip=True).split())[:200],'href':urljoin(r.url,a.get('href'))} for a in soup.find_all('a',href=True) if any(k in ((' '.join(a.get_text(' ',strip=True).split())+' '+str(a.get('href'))).lower()) for k in ('pdf','download','下载','原文','浏览','报告'))][:100]
              manifest.append(item)
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DONE',len(manifest),flush=True)
          PY

      - name: Upload session inspection
        uses: actions/upload-artifact@v4
        with:
          name: kaichuang-hibor-session-20261014
          path: hibor_session
          retention-days: 7
          if-no-files-found: error
