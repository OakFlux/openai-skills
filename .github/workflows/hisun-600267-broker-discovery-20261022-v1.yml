name: Discover Hisun 600267 broker reports 20261022

on:
  push:
    branches:
      - tmp/hisun-600267-broker-discovery-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, time
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})

          api='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          for qtype in ['0','1','2']:
            for page in range(1,15):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'600267','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(api,params=params,timeout=(20,120))
              print('API_STATUS',qtype,page,r.status_code,len(r.content),r.url)
              d=r.json(); batch=d.get('data') or []
              if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
              print('QTYPE',qtype,'PAGE',page,'HITS',d.get('hits'),'COUNT',len(batch) if isinstance(batch,list) else 'bad')
              if not isinstance(batch,list) or not batch: break
              all_rows.extend(batch)
              if len(batch)<100: break
              time.sleep(.1)
          seen=set(); out=[]
          for x in all_rows:
            info=str(x.get('infoCode') or x.get('info_code') or '')
            if not info or info in seen: continue
            seen.add(info)
            out.append({k:x.get(k) for k in ['infoCode','title','orgSName','orgCode','publishDate','attachPages','stockCode','stockName','researcher','emRatingName','ratingChange','indvInduName','predictNextTwoYearEps']})
          print('EASTMONEY_RESULT_COUNT',len(out))
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))

          print('\n=== SINA REPORT LIST ===')
          for page in range(1,8):
            url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=600267&p={page}'
            try:
              r=s.get(url,timeout=(20,120)); enc=r.apparent_encoding or r.encoding or 'gb18030'; text=r.content.decode(enc,errors='replace')
              soup=BeautifulSoup(text,'lxml')
              candidates=[]
              for a in soup.find_all('a',href=True):
                label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                href=urljoin(r.url,a['href'])
                if ('vReport_Show' in href or 'rptid' in href) and any(k in label for k in ['海正','600267']):
                  candidates.append({'label':label,'url':href})
              print('SINA_PAGE',page,'STATUS',r.status_code,'BYTES',len(r.content),'COUNT',len(candidates))
              print(json.dumps(candidates,ensure_ascii=False,indent=2))
            except Exception as e:
              print('SINA_ERROR',page,repr(e))
          PY
