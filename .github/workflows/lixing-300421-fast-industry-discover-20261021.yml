name: Fast discover Lixing related deep reports 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-fast-industry-discover-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests
      - name: Query exact publication dates
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          dates=[('2022-05-30','2022-06-02'),('2023-02-28','2023-03-02'),('2023-07-29','2023-08-01'),('2024-03-16','2024-03-19')]
          terms=['轴承','滚子','滚动体','人形机器人']
          for begin,end in dates:
            print('WINDOW',begin,end)
            for qtype in ['0','1']:
              p={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              r=s.get(api,params=p,timeout=(20,120)); print('HTTP',qtype,r.status_code,len(r.content),r.url)
              data=(r.json().get('data') or []) if r.status_code==200 else []
              if isinstance(data,dict):data=data.get('list') or data.get('data') or []
              found=[]
              for row in data:
                title=str(row.get('title') or '')
                if any(t in title for t in terms):
                  found.append({k:row.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
              print('FOUND',qtype,json.dumps(found,ensure_ascii=False,indent=2))
          PY
