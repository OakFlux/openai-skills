name: Inspect CGSI public research pages
on:
  push:
    branches: [tmp-cgsi-research-inspect-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect page metadata and scripts
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urls=[
            'https://en.chinastock.com.hk/business/research/news/',
            'https://en.chinastock.com.hk/business/research/news/211.html',
            'https://cn.chinastock.com.hk/business/research/news/'
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9,zh-CN;q=0.8'})
          for url in urls:
              r=s.get(url,timeout=60)
              print('\nPAGE',url,'STATUS',r.status_code,'SIZE',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'))
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(['script','a','link','iframe'],src=True):
                  print('SRC',urljoin(r.url,tag.get('src')))
              for tag in soup.find_all(['a','link'],href=True):
                  href=urljoin(r.url,tag.get('href'))
                  text=' '.join(tag.get_text(' ',strip=True).split())
                  if any(k in href.lower()+text.lower() for k in ['pdf','research','news','load','ajax','more']):
                      print('LINK',text[:200],'|',href[:1000])
              for key in ['load more','loadmore','ajax','pageindex','pageSize','getNews','research','pdf','attachment','download','华润水泥','China Resources Cement']:
                  low=r.text.lower(); pos=0; count=0
                  while count<10:
                      i=low.find(key.lower(),pos)
                      if i<0: break
                      print('CTX',key,r.text[max(0,i-400):min(len(r.text),i+1500)].replace('\n',' ')[:1900])
                      pos=i+len(key); count+=1
              for pattern in [r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r'/(?:api|ajax|news|research|load)[^\"\'<>\s]+']:
                  for match in list(dict.fromkeys(re.findall(pattern,r.text,re.I)))[:100]:
                      print('MATCH',match[:1200])
          PY
