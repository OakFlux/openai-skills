name: package-gongyuan-002641-filings-fixed

on:
  push:
    branches:
      - tmp/gongyuan-002641-filings-20261106-v2

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from pypdf import PdfReader

          COMPANY = "公元股份有限公司"
          SHORT_NAME = "公元股份"
          OLD_COMPANY = "永高股份有限公司"
          OLD_SHORT_NAME = "永高股份"
          CODE = "002641"
          PREPARED = "2026-11-06"
          ROOT_NAME = "公元股份_002641_2020-2025年报及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  "sequence": 1,
                  "category": "年度报告",
                  "period": "2020年年度报告",
                  "announcement_date": "2021-04-27",
                  "filename": "01_2020年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": [
                      "https://disc.static.szse.cn/disc/disk02/finalpage/2021-04-27/08e35c00-7dfe-4534-afa7-bc82351c3afa.PDF",
                  ],
                  "period_markers": ["2020年年度报告", "2020年度报告"],
              },
              {
                  "sequence": 2,
                  "category": "年度报告",
                  "period": "2021年年度报告",
                  "announcement_date": "2022-04-12",
                  "filename": "02_2021年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2022-04-12/1212885995.PDF",
                  ],
                  "period_markers": ["2021年年度报告", "2021年度报告"],
              },
              {
                  "sequence": 3,
                  "category": "年度报告",
                  "period": "2022年年度报告",
                  "announcement_date": "2023-03-31",
                  "filename": "03_2022年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2023-03-31/1216280190.PDF",
                  ],
                  "period_markers": ["2022年年度报告", "2022年度报告"],
              },
              {
                  "sequence": 4,
                  "category": "年度报告",
                  "period": "2023年年度报告",
                  "announcement_date": "2024-04-26",
                  "filename": "04_2023年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2024-04-26/1219822476.PDF",
                  ],
                  "period_markers": ["2023年年度报告", "2023年度报告"],
              },
              {
                  "sequence": 5,
                  "category": "年度报告",
                  "period": "2024年年度报告",
                  "announcement_date": "2025-04-24",
                  "filename": "05_2024年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2025-04-24/1223240128.PDF",
                  ],
                  "period_markers": ["2024年年度报告", "2024年度报告"],
              },
              {
                  "sequence": 6,
                  "category": "年度报告",
                  "period": "2025年年度报告",
                  "announcement_date": "2026-04-24",
                  "filename": "06_2025年年度报告.pdf",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2026-04-24/1225159481.PDF",
                  ],
                  "period_markers": ["2025年年度报告", "2025年度报告"],
              },
              {
                  "sequence": 7,
                  "category": "季度报告",
                  "period": "2026年第三季度报告",
                  "announcement_date": "2026-10-28",
                  "filename": "07_2026年第三季度报告.pdf",
                  "minimum_pages": 5,
                  "urls": [
                      "http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-28/12664737.PDF",
                      "https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-28/12664737.PDF",
                  ],
                  "sina_page": "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12664737&stockid=002641",
                  "period_markers": ["2026年第三季度报告", "2026年三季度报告"],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def compact(value: str) -> str:
              return re.sub(r"\s+", "", value or "")

          def resolve_sina_download(page_url: str) -> list[str]:
              found: list[str] = []
              try:
                  response = session.get(page_url, timeout=(30, 120), allow_redirects=True)
                  print("SINA_PAGE", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                  response.raise_for_status()
                  texts = [
                      response.content.decode("utf-8", errors="ignore"),
                      response.content.decode("gb18030", errors="ignore"),
                  ]
                  for text in texts:
                      for pattern in [
                          r"https?://file\.finance\.sina\.com\.cn/[^\"'<>\s]+?\.PDF",
                          r"//file\.finance\.sina\.com\.cn/[^\"'<>\s]+?\.PDF",
                      ]:
                          for match in re.findall(pattern, text, flags=re.IGNORECASE):
                              url = "https:" + match if match.startswith("//") else match
                              found.append(url.replace("&amp;", "&"))
              except Exception as exc:
                  print("SINA_PAGE_WARNING", repr(exc))
              return list(dict.fromkeys(found))

          def download_pdf(document: dict) -> tuple[bytes, str, str]:
              variants = list(document["urls"])
              if document.get("sina_page"):
                  variants = resolve_sina_download(document["sina_page"]) + variants
              expanded: list[str] = []
              for url in variants:
                  expanded.extend([url, url + ("&download=1" if "?" in url else "?download=1")])
              last_error: Exception | None = None
              for url in dict.fromkeys(expanded):
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 480),
                              allow_redirects=True,
                              headers={
                                  "Accept": "application/pdf,*/*;q=0.8",
                                  "Referer": document.get("sina_page", "https://www.cninfo.com.cn/"),
                              },
                          )
                          print("DOWNLOAD", document["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          if response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                              return response.content, response.url, response.headers.get("content-type", "")
                          last_error = RuntimeError(f"Not PDF: {response.content[:80]!r}")
                      except Exception as exc:
                          last_error = exc
                          print("DOWNLOAD_ERROR", document["period"], attempt, url, repr(exc))
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to download {document['period']}: {last_error}")

          manifest = []
          accepted_names = [COMPANY, SHORT_NAME, OLD_COMPANY, OLD_SHORT_NAME, CODE, "浙江永高塑业发展"]

          for document in documents:
              data, final_url, content_type = download_pdf(document)
              output = PDF_DIR / document["filename"]
              output.write_bytes(data)

              with output.open("rb") as handle:
                  if handle.read(5) != b"%PDF-":
                      raise RuntimeError(f"Invalid PDF header: {output.name}")

              reader = PdfReader(str(output), strict=False)
              pages = len(reader.pages)
              if pages < document["minimum_pages"]:
                  raise RuntimeError(f"Document too short: {output.name}: {pages} pages")

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {output.name}: {qpdf.stdout}")

              text_run = subprocess.run(
                  ["pdftotext", "-f", "1", "-l", str(min(20, pages)), str(output), "-"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              text_compact = compact(text_run.stdout)
              issuer_hits = [marker for marker in accepted_names if compact(marker) in text_compact]
              period_hits = [marker for marker in document["period_markers"] if compact(marker) in text_compact]
              if not issuer_hits:
                  raise RuntimeError(f"Issuer validation failed for {output.name}")
              if not period_hits:
                  raise RuntimeError(f"Period validation failed for {output.name}")

              prefix = PREVIEW_DIR / output.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 6_000:
                  raise RuntimeError(f"Preview rendering failed for {output.name}: {render.stdout}")

              item = {
                  "sequence": document["sequence"],
                  "category": document["category"],
                  "period": document["period"],
                  "announcement_date": document["announcement_date"],
                  "filename": document["filename"],
                  "source_url": final_url,
                  "content_type": content_type,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "issuer_marker_hits": issuer_hits,
                  "period_marker_hits": period_hits,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(item)
              print("VALIDATED", item["period"], item["announcement_date"], pages, item["sha256"], final_url)

          if len(manifest) != 7:
              raise RuntimeError(f"Expected 7 documents, got {len(manifest)}")

          readme = [
              f"{COMPANY}（{CODE}.SZ，历史名称：{OLD_COMPANY}）2020—2025年年度报告及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：2020—2025年年度报告全文共6份，以及截至整理日最新独立季度报告——2026年第三季度报告1份。",
              "2020年年度报告使用公司历史名称“永高股份有限公司”；2021年报告封面及正文可能同时出现历史简称。证券代码始终为002641。",
              "已排除年度报告摘要、半年度报告、审计附件、董事会文件及其他非正文资料。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   类型：{item['category']}；报告：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称/历史名称或证券代码、报告期间、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "historical_company": OLD_COMPANY,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "file_count": len(manifest),
              "annual_report_count": 6,
              "latest_quarter": "2026年第三季度报告",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "类型", "报告", "公告日期", "文件名", "页数", "字节数", "SHA-256", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["category"], item["period"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"],
                      item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("gongyuan_002641_2020_2025_annual_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              previews = [name for name in archive.namelist() if name.lower().endswith(".png")]
              if bad is not None or len(pdf_names) != 7 or len(previews) != 7:
                  raise RuntimeError(f"ZIP validation failed: bad={bad}, pdfs={len(pdf_names)}, previews={len(previews)}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "file_count": len(manifest),
              "annual_report_count": 6,
              "latest_quarter": "2026年第三季度报告",
              "files": [{k: item[k] for k in ["period", "announcement_date", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gongyuan-002641-filings-fixed-20261106
          path: |
            gongyuan_002641_2020_2025_annual_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
