name: Build Kangzhong 688607 broker deep reports

on:
  push:
    branches:
      - tmp-kangzhong-broker-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='康众科技_688607_券商深度报告_3份'
          mkdir -p "$PACKAGE" /tmp/kangzhong_broker_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('康众科技_688607_券商深度报告_3份')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.2,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def parse_json_or_jsonp(text: str) -> Any:
              text = text.strip().lstrip('\ufeff')
              try:
                  return json.loads(text)
              except Exception:
                  pass
              left = text.find('(')
              right = text.rfind(')')
              if left >= 0 and right > left:
                  return json.loads(text[left + 1:right])
              raise ValueError('Response is neither JSON nor JSONP')

          def collect_records(obj: Any) -> list[dict[str, Any]]:
              found: list[dict[str, Any]] = []
              def walk(node: Any) -> None:
                  if isinstance(node, dict):
                      lowered = {str(k).lower(): v for k, v in node.items()}
                      if ('infocode' in lowered or 'info_code' in lowered) and ('title' in lowered or 'reporttitle' in lowered):
                          found.append(node)
                      for value in node.values():
                          walk(value)
                  elif isinstance(node, list):
                      for value in node:
                          walk(value)
              walk(obj)
              return found

          def getv(record: dict[str, Any], *names: str) -> Any:
              wanted = {name.lower() for name in names}
              for key, value in record.items():
                  if str(key).lower() in wanted:
                      return value
              return None

          def query_eastmoney_reports() -> list[dict[str, Any]]:
              endpoint = 'https://reportapi.eastmoney.com/report/list'
              base_params = {
                  'pageSize': '100',
                  'beginTime': '2021-01-01',
                  'endTime': '2026-10-28',
                  'pageNo': '1',
                  'fields': '',
                  'qType': '0',
                  'orgCode': '',
                  'author': '',
                  'code': '688607',
                  'industryCode': '',
                  'industry': '',
                  'rating': '',
                  'ratingChange': '',
                  'beginMarketValue': '',
                  'endMarketValue': '',
                  'beginMonth': '',
                  'endMonth': '',
                  'keyWord': '',
                  '_': str(int(time.time() * 1000)),
              }
              headers = {
                  'Referer': 'https://data.eastmoney.com/report/stock.jshtml?stockcode=688607',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              }
              payloads = []
              attempts = [
                  dict(base_params),
                  {**base_params, 'cb': f'datatable{int(time.time()*1000)}'},
              ]
              for params in attempts:
                  try:
                      response = session.get(endpoint, params=params, headers=headers, timeout=(30, 180))
                      print('REPORT API', response.status_code, response.url, 'bytes=', len(response.content))
                      if response.status_code == 200 and response.text.strip():
                          payloads.append(parse_json_or_jsonp(response.text))
                  except Exception as exc:
                      print('REPORT API FAILED', repr(exc))
              records = []
              for payload in payloads:
                  records.extend(collect_records(payload))
              dedup = {}
              for record in records:
                  info = str(getv(record, 'infoCode', 'info_code') or '').strip()
                  if info:
                      dedup[info] = record
              records = list(dedup.values())
              print('DISCOVERED REPORT RECORDS', len(records))
              for record in sorted(records, key=lambda r: str(getv(r, 'publishDate', 'publishdate') or ''), reverse=True):
                  print('REPORT',
                        getv(record, 'publishDate', 'publishdate'), '|',
                        getv(record, 'orgSName', 'orgsname', 'orgName', 'orgname'), '|',
                        getv(record, 'title', 'reportTitle', 'reporttitle'), '|',
                        getv(record, 'infoCode', 'info_code'))
              return records

          records = query_eastmoney_reports()

          manual = {
              'AP202304191585563146': {
                  'infoCode': 'AP202304191585563146',
                  'title': '以自主创新为基石，齿科+工业构建第二增长曲线',
                  'orgSName': '光大证券',
                  'publishDate': '2023-04-18',
              }
          }
          indexed = {str(getv(r, 'infoCode', 'info_code')): r for r in records}
          indexed.update({k: v for k, v in manual.items() if k not in indexed})

          preferences = [
              ('X光平板探测行业领军者', '国金证券', '2026-07-28'),
              ('“设备+医疗AI”双轮驱动', '申万宏源', '2026-03-27'),
              ('设备+医疗AI', '申万宏源', '2026-03-27'),
              ('以自主创新为基石', '光大证券', '2023-04-18'),
              ('国内领先的X射线平板探测器厂商', '方正证券', '2022-03-26'),
          ]

          def normalized_record(record: dict[str, Any]) -> dict[str, str]:
              return {
                  'infoCode': str(getv(record, 'infoCode', 'info_code') or '').strip(),
                  'title': str(getv(record, 'title', 'reportTitle', 'reporttitle') or '').strip(),
                  'broker': str(getv(record, 'orgSName', 'orgsname', 'orgName', 'orgname') or '').strip(),
                  'date': str(getv(record, 'publishDate', 'publishdate') or '').strip()[:10],
              }

          chosen = []
          seen = set()
          normalized = [normalized_record(r) for r in indexed.values()]
          for title_key, broker_hint, date_hint in preferences:
              for item in normalized:
                  if not item['infoCode'] or item['infoCode'] in seen:
                      continue
                  title_compact = item['title'].replace(' ', '')
                  if title_key.replace(' ', '') in title_compact:
                      if broker_hint and broker_hint.replace('证券', '') not in item['broker'] and broker_hint not in item['broker']:
                          continue
                      chosen.append(item)
                      seen.add(item['infoCode'])
                      break
              if len(chosen) >= 4:
                  break

          # Always keep the verified public Guangda report as a fallback.
          if 'AP202304191585563146' not in seen:
              chosen.append(normalized_record(manual['AP202304191585563146']))
              seen.add('AP202304191585563146')

          print('CANDIDATE REPORTS', chosen)

          def candidate_pdf_urls(info_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H301_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.PDF',
              ]

          def download_candidate(item: dict[str, str]) -> dict[str, Any] | None:
              last = None
              for attempt in range(6):
                  for url in candidate_pdf_urls(item['infoCode']):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'Referer': f'https://data.eastmoney.com/report/info/{item["infoCode"]}.html',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 150_000:
                              last = RuntimeError(f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}')
                              continue
                          temp = OUT / f'_temp_{item["infoCode"]}.pdf'
                          temp.write_bytes(data)
                          reader = PdfReader(str(temp), strict=False)
                          pages = len(reader.pages)
                          sample = ''
                          indices = list(range(min(12, pages)))
                          if pages > 12:
                              indices.append(pages - 1)
                          for index in dict.fromkeys(indices):
                              try:
                                  sample += '\n' + (reader.pages[index].extract_text() or '')
                              except Exception:
                                  pass
                          compact = re.sub(r'\s+', '', sample)
                          if pages < 15 or ('康众医疗' not in compact and '康众科技' not in compact and '江苏康众数字医疗科技股份有限公司' not in compact):
                              raise RuntimeError(f'content mismatch or too short: pages={pages}')
                          broker_key = item['broker'].replace('证券', '')
                          if broker_key and broker_key not in compact:
                              print('BROKER TEXT WARNING', item['broker'], item['title'])
                          sha = hashlib.sha256(data).hexdigest()
                          return {
                              **item,
                              'source': response.url,
                              'data': data,
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': sha,
                          }
                      except Exception as exc:
                          last = exc
                          try:
                              temp.unlink(missing_ok=True)
                          except Exception:
                              pass
                  time.sleep(min(2 + attempt, 8))
              print('DOWNLOAD FAILED', item, repr(last))
              return None

          downloaded = []
          for item in chosen:
              result = download_candidate(item)
              if result is not None:
                  downloaded.append(result)
              if len(downloaded) >= 3:
                  break

          if len(downloaded) < 2:
              raise RuntimeError(f'Only {len(downloaded)} complete broker reports could be downloaded')

          downloaded.sort(key=lambda x: x['date'], reverse=True)
          downloaded = downloaded[:3]

          def clean_filename(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '', text)
              text = re.sub(r'\s+', '', text)
              return text[:54]

          records_out = []
          for idx, item in enumerate(downloaded, start=1):
              filename = f'{idx:02d}_{clean_filename(item["broker"])}_{clean_filename(item["title"])}_{item["date"]}.pdf'
              path = OUT / filename
              path.write_bytes(item['data'])
              temp = OUT / f'_temp_{item["infoCode"]}.pdf'
              temp.unlink(missing_ok=True)
              records_out.append({k: v for k, v in item.items() if k != 'data'} | {'file': filename})
              print('SELECTED', filename, 'pages=', item['pages'], 'bytes=', item['bytes'], 'sha256=', item['sha256'])

          # Remove any unselected temporary files.
          for temp in OUT.glob('_temp_*.pdf'):
              temp.unlink(missing_ok=True)

          lines = [
              '康众科技（688607，原证券简称：康众医疗）券商深度报告资料包',
              '整理日期：2026-10-28',
              '',
              '收录原则：优先收录公开渠道可直接下载、且经结构、页数和正文公司名称核验的券商原始完整PDF。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for idx, item in enumerate(records_out, start=1):
              total_pages += int(item['pages'])
              total_bytes += int(item['bytes'])
              lines += [
                  f'{idx}. {item["broker"]}｜{item["title"]}',
                  f'   发布日期：{item["date"]}',
                  f'   页数：{item["pages"]}页',
                  f'   文件：{item["file"]}',
                  f'   研报索引：https://data.eastmoney.com/report/info/{item["infoCode"]}.html',
                  f'   原始PDF：{item["source"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
              sums.append(f'{item["sha256"]}  {item["file"]}')
          lines += [
              f'合计：{len(records_out)}份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records_out, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          pdf_count=$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)
          test "$pdf_count" -ge 2
          test "$pdf_count" -le 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 15
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '康众医疗|康众科技|江苏康众数字医疗科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/kangzhong_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/kangzhong_broker_test.zip "$PACKAGE"
          unzip -t /tmp/kangzhong_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/kangzhong_broker_test.zip | grep -c '\.pdf$')" -eq "$pdf_count"
          rm -f /tmp/kangzhong_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Kangzhong-688607-broker-deep-reports
          path: 康众科技_688607_券商深度报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
