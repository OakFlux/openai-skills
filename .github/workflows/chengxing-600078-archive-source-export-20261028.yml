name: Export Chengxing report viewer sources

on:
  push:
    paths:
      - '.github/workflows/chengxing-600078-archive-source-export-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Download viewer HTML and scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          out=Path('out'); out.mkdir()
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          targets=[
            'https://www.fxbaogao.com/detail/1492879',
            'https://www.fxbaogao.com/view?id=1492879',
            'https://www.hibor.com.cn/docdetail_96264.html',
          ]
          manifest=[]; scripts=set()
          for j,url in enumerate(targets):
            r=s.get(url,timeout=60,allow_redirects=True); print('PAGE',j,r.status_code,len(r.content),url,r.url)
            path=out/f'page_{j}.html'; path.write_bytes(r.content)
            soup=BeautifulSoup(r.content,'lxml')
            rec={'url':url,'final_url':r.url,'status':r.status_code,'scripts':[]}
            for tag in soup.find_all('script',src=True):
              full=urljoin(r.url,tag['src']); scripts.add(full); rec['scripts'].append(full)
            manifest.append(rec)
          for i,url in enumerate(sorted(scripts)):
            try:
              r=s.get(url,timeout=90,allow_redirects=True); print('SCRIPT',i,r.status_code,len(r.content),url,r.url)
              if r.status_code==200 and len(r.content)<5_000_000:
                base=urlparse(url).path.rsplit('/',1)[-1] or f'script_{i}.js'
                base=re.sub(r'[^A-Za-z0-9._-]+','_',base)
                (out/f'{i:03d}_{base}').write_bytes(r.content)
            except Exception as e: print('ERROR',url,repr(e))
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chengxing-600078-archive-source-export-20261028
          path: out
          compression-level: 6
          retention-days: 7
