name: Package Kinco 688160 official filings v2

on:
  push:
    paths:
      - '.github/workflows/kinco-688160-official-filings-v2-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE = '688160'
          COMPANY = '步科股份'
          FULL_COMPANY = '上海步科自动化股份有限公司'
          CUTOFF = '2026-10-28'
          CUTOFF_COMPACT = '20261028'
          ROOT_NAME = f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          DIST = Path('dist')
          for directory in (ROOT / '00_招股说明书', ROOT / '01_年度报告', ROOT / '02_最新季度报告', ROOT / '首页预览', DIST):
              directory.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  'document_type': 'prospectus', 'period': 'IPO',
                  'file_name': '2020_步科股份_首次公开发行股票并在科创板上市招股说明书.pdf',
                  'folder': '00_招股说明书', 'min_pages': 200,
                  'markers': ['招股说明书', '首次公开发行股票并在科创板上市'],
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2020/2020-11/2020-11-06/6709994.PDF'],
              },
              {
                  'document_type': 'annual_report', 'period': '2020',
                  'file_name': '2020_步科股份_2020年年度报告.pdf', 'folder': '01_年度报告',
                  'min_pages': 80, 'markers': ['2020年年度报告'],
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-21/7079356.PDF'],
              },
              {
                  'document_type': 'annual_report', 'period': '2021',
                  'file_name': '2021_步科股份_2021年年度报告.pdf', 'folder': '01_年度报告',
                  'min_pages': 80, 'markers': ['2021年年度报告'],
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-21/8026743.PDF'],
              },
              {
                  'document_type': 'annual_report', 'period': '2022',
                  'file_name': '2022_步科股份_2022年年度报告.pdf', 'folder': '01_年度报告',
                  'min_pages': 80, 'markers': ['2022年年度报告'],
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-3/2023-03-31/8931664.PDF'],
              },
              {
                  'document_type': 'annual_report', 'period': '2023',
                  'file_name': '2023_步科股份_2023年年度报告.pdf', 'folder': '01_年度报告',
                  'min_pages': 80, 'markers': ['2023年年度报告'],
                  'urls': [
                      'https://dataclouds.cninfo.com.cn/shgonggao/2024/2024-03-27/f51b6441eb5b11eebb3bfa163e26e5de.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-27/9900762.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report', 'period': '2024',
                  'file_name': '2024_步科股份_2024年年度报告.pdf', 'folder': '01_年度报告',
                  'min_pages': 80, 'markers': ['2024年年度报告'],
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-25/10962008.PDF'],
              },
              {
                  'document_type': 'annual_report', 'period': '2025',
                  'file_name': '2025_步科股份_2025年年度报告.pdf', 'folder': '01_年度报告',
                  'min_pages': 80, 'markers': ['2025年年度报告'],
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-03/12058320.PDF'],
              },
              {
                  'document_type': 'quarterly_report', 'period': '2026Q1',
                  'file_name': '2026Q1_步科股份_2026年第一季度报告.pdf', 'folder': '02_最新季度报告',
                  'min_pages': 5, 'markers': ['2026年第一季度报告'],
                  'urls': ['https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-28/12216398.PDF'],
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6, connect=6, read=6, status=6, backoff_factor=1.0,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}), raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.mount('http://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://vip.stock.finance.sina.com.cn/',
          })

          def compact(text: str) -> str:
              return re.sub(r'\s+', '', text or '')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          records = []
          for specification in documents:
              response = None
              source_url = None
              errors = []
              for url in specification['urls']:
                  try:
                      candidate = session.get(url, timeout=240, allow_redirects=True)
                      print('DOWNLOAD', specification['period'], candidate.status_code, len(candidate.content), url, '->', candidate.url)
                      if candidate.status_code == 200 and len(candidate.content) >= 50_000 and candidate.content.startswith(b'%PDF'):
                          response = candidate
                          source_url = url
                          break
                      errors.append(f'{url}: status={candidate.status_code}, size={len(candidate.content)}, head={candidate.content[:12]!r}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              if response is None:
                  raise RuntimeError(f"No complete PDF for {specification['period']}: {' | '.join(errors)}")

              destination = ROOT / specification['folder'] / specification['file_name']
              destination.write_bytes(response.content)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  reader.decrypt('')
              page_count = len(reader.pages)
              if page_count < specification['min_pages']:
                  raise RuntimeError(f"Unexpected page count for {specification['period']}: {page_count}")

              document = fitz.open(destination)
              if document.page_count != page_count:
                  raise RuntimeError(f"Parser page mismatch for {specification['period']}: {page_count} vs {document.page_count}")
              first_page = document.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_page = document.load_page(document.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first_page.width, first_page.height, last_page.width, last_page.height) < 100:
                  raise RuntimeError(f"Render validation failed for {specification['period']}")
              first_page.save(ROOT / '首页预览' / f'{destination.stem}.png')

              text_probe = ''
              for page_index in range(min(15, document.page_count)):
                  try:
                      text_probe += document.load_page(page_index).get_text('text')
                  except Exception:
                      pass
              document.close()
              compact_probe = compact(text_probe)
              if COMPANY not in compact_probe and FULL_COMPANY not in compact_probe and CODE not in compact_probe:
                  raise RuntimeError(f"Company identity missing for {specification['period']}")
              for marker in specification['markers']:
                  if compact(marker) not in compact_probe:
                      raise RuntimeError(f"Marker {marker!r} missing for {specification['period']}")

              record = {
                  'document_type': specification['document_type'],
                  'period': specification['period'],
                  'source_url': source_url,
                  'resolved_url': response.url,
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': sha256(destination),
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
                  'period_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          annual_years = sorted(int(record['period']) for record in records if record['document_type'] == 'annual_report')
          if annual_years != [2020, 2021, 2022, 2023, 2024, 2025]:
              raise RuntimeError(f'Annual coverage mismatch: {annual_years}')

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'market': '上海证券交易所科创板',
              'listing_date': '2020-11-12',
              'cutoff_date': CUTOFF,
              'annual_report_years': annual_years,
              'latest_quarter': '2026Q1',
              'latest_quarter_note': '截至2026-10-28，2026年第三季度报告预约披露日为2026-10-30，尚未正式披露，因此收录2026年第一季度报告。',
              'document_count': len(records),
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）上市以来官方披露文件包', '',
              f'- 截止日期：{CUTOFF}',
              '- 收录最终正式版IPO招股说明书、2020—2025年全部年度报告、截至截止日最新正式独立季报。',
              '- 2026年第三季度报告预约于2026年10月30日披露，截至本包截止日尚未发布，因此最新季报为2026年第一季度报告。',
              '- 已排除年度报告摘要、招股意向书、申报稿、提示性公告和重复文件。',
              '- 已完成PDF文件头、双解析器页数、公司身份、报告期、首末页渲染、SHA-256及ZIP CRC校验。', '',
              '## 文件清单', '',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 类型/期间：{record['document_type']} / {record['period']}",
                  f"   - 页数：{record['page_count']}；文件大小：{record['file_size_bytes']:,}字节",
                  f"   - 来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'kinco_688160_all_annual_reports_prospectus_latest_quarter_{CUTOFF_COMPACT}.zip'
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')
                  pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdfs) != 8:
                      raise RuntimeError(f'Unexpected PDF count: {len(pdfs)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256(path))

          print('FINAL_JSON', json.dumps({
              'annual_years': annual_years,
              'latest_quarter': '2026Q1',
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': sha256(chinese_zip),
              'records': records,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinco-688160-official-filings-v2-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
