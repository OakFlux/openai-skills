name: Search NEEQ archive with simple legacy parameters 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-simple-search-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Search exact historical report titles
        run: |
          python - <<'PY'
          import json, requests
          endpoint='https://www.neeq.com.cn/disclosureInfoController/infoResult.do'
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.neeq.com.cn/','X-Requested-With':'XMLHttpRequest'}
          keywords=[
            '400062','二重5','二重3','国重装5',
            '二重集团（德阳）重型装备股份有限公司',
            '国机重型装备集团股份有限公司',
            '2015年年度报告','2016年年度报告','2017年年度报告','2018年年度报告','2019年年度报告',
            '二重重装2015年年度报告','二重重装2016年年度报告','二重重装2017年年度报告',
            '国重装52018年年度报告','国重装52019年年度报告',
          ]
          for dtype in ['9','1','5']:
            for page in ['0','1']:
              for kw in keywords:
                form={
                  'flag':'1','disclosureType':dtype,'page':page,
                  'startTime':'2015-01-01','endTime':'2020-06-30',
                  'keyword':kw,'sortfield':'xxssdq','sorttype':'asc'
                }
                try:
                  r=requests.post(endpoint,data=form,headers=headers,timeout=35)
                  raw=r.text.strip()
                  clean=raw[5:-1] if raw.startswith('null(') and raw.endswith(')') else raw.rstrip(';')
                  try: obj=json.loads(clean)
                  except Exception:
                    continue
                  blocks=obj if isinstance(obj,list) else [obj]
                  rows=[]
                  for b in blocks:
                    if isinstance(b,dict): rows += ((b.get('listInfo') or {}).get('content') or [])
                  if rows:
                    print('\nFOUND','DTYPE',dtype,'PAGE',page,'KW',repr(kw),'ROWS',len(rows))
                    for rec in rows:
                      print('ROW',json.dumps(rec,ensure_ascii=False,sort_keys=True))
                except Exception as exc:
                  print('ERROR',dtype,page,repr(kw),repr(exc))
          PY
