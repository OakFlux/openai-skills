name: grand-pharma-viewdiag
on:
  push:
    branches: [chatgpt-temp-grand-pharma-viewdiag-20260905]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public viewer pages
        run: |
          mkdir -p diag
          curl -L --fail --retry 2 -A 'Mozilla/5.0' 'https://www.fxbaogao.com/view?id=4918101' -o diag/view_4918101.html || true
          curl -L --fail --retry 2 -A 'Mozilla/5.0' 'https://www.fxbaogao.com/view?id=4530021' -o diag/view_4530021.html || true
          grep -Eo 'https?://[^" ]+|src="[^"]+|href="[^"]+' diag/view_4918101.html > diag/links_4918101.txt || true
          grep -Eo 'https?://[^" ]+|src="[^"]+|href="[^"]+' diag/view_4530021.html > diag/links_4530021.txt || true
          wc -c diag/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: Grand-Pharma-Viewer-Diagnostics
          path: diag
          retention-days: 1
