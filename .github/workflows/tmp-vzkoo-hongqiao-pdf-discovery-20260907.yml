name: Inspect Vzkoo Hongqiao report page
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public document page
        run: |
          mkdir -p out
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.vzkoo.com/document/20240613685119ace79295e90edc0069.html?from=report' -o out/document.html
          grep -Eoi 'https?[^" ]+\.pdf[^" ]*|https?[^" ]+cdnfiles[^" ]*|href="[^"]+"|src="[^"]+"' out/document.html | head -300 || true
      - uses: actions/upload-artifact@v4
        with:
          name: vzkoo-hongqiao-page
          path: out
          retention-days: 1
          compression-level: 0
