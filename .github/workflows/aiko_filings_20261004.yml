name: Aiko Solar Annual Reports and Latest Quarter

on:
  push:
    branches:
      - chatgpt-aiko-filings-20261004
    paths:
      - .github/workflows/aiko_filings_20261004.yml
      - scripts/build_aiko_filings_20261004.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_aiko_filings_20261004.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: aiko-filings-package
          path: |
            output/aiko_solar_2020_2025_annual_reports_and_2026_q1.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
