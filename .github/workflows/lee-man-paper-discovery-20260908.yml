name: Discover public Lee and Man Paper broker reports 20260908

on:
  push:
    paths:
      - '.github/workflows/lee-man-paper-discovery-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe public sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re, time
          from urllib.parse import urlencode, urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          out={'eastmoney':[],'pages':{}}

          def get(url, **kw):
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True,**kw)
              print('GET',r.status_code,len(r.content),r.url,flush=True)
              return r
            except Exception as e:
              print('GETERR',url,repr(e),flush=True); return None

          # Eastmoney GET and JSONP variants, split by year and code formats.
          for code in ['02314','2314','02314.HK','2314.HK']:
            for year in range(2012,2027):
              params=dict(industryCode='*',pageSize='100',industry='*',rating='*',ratingChange='*',
                          beginTime=f'{year}-01-01',endTime=f'{year}-12-31',pageNo='1',fields='',qType='0',
                          orgCode='*',code=code,rcode='*',p='1',pageNum='1',pageNumber='1')
              u='https://reportapi.eastmoney.com/report/list?'+urlencode(params)
              r=get(u,headers={'Referer':'https://data.eastmoney.com/report/stock.jshtml?encode=02314'})
              if not r or r.status_code!=200: continue
              text=r.text.strip()
              try:
                data=json.loads(text)
              except Exception:
                m=re.search(r'\((\{.*\})\)\s*;?$',text,re.S)
                if not m: continue
                try: data=json.loads(m.group(1))
                except Exception: continue
              rows=[]
              if isinstance(data,dict):
                if isinstance(data.get('data'),list): rows=data['data']
                elif isinstance(data.get('data'),dict): rows=data['data'].get('dataList') or data['data'].get('list') or []
                elif isinstance(data.get('result'),dict): rows=data['result'].get('data') or []
              for x in rows:
                raw=json.dumps(x,ensure_ascii=False)
                if '理文' in raw or 'Lee & Man' in raw or '2314' in raw:
                  key=(x.get('infoCode') or x.get('infocode') or x.get('info_code'),x.get('title'))
                  if not any((y.get('infoCode') or y.get('infocode') or y.get('info_code'),y.get('title'))==key for y in out['eastmoney']):
                    out['eastmoney'].append(x)
                    print('EMMATCH',raw,flush=True)
              time.sleep(.1)

          # Probe public pages for raw URLs and metadata; no authenticated endpoints.
          pages={
            'hibor':'https://m.hibor.com.cn/wap_detail.aspx?id=64f03a7a82857e8c02f8bd30db577c5d',
            'sina':'https://stock.finance.sina.com.cn/hkstock/view/hk_report.php?reportid=840894205940',
            'sgpjbg':'https://www.sgpjbg.com.cn/baogao/1291931.html',
            'baogaobox':'https://www.baogaobox.com/reports/260824000116326.html',
            'vzkoo':'https://www.vzkoo.com/document/1151193022390001f439a9b331af.html?from=read',
          }
          for name,u in pages.items():
            r=get(u)
            if not r: continue
            text=r.text
            soup=BeautifulSoup(text,'html.parser')
            urls=[]
            for tag in soup.find_all(True):
              for attr in ['href','src','data-src','data-url','content','value']:
                v=tag.get(attr)
                if isinstance(v,str) and ('.pdf' in v.lower() or 'download' in v.lower() or 'preview' in v.lower() or 'file' in v.lower() or 'image' in v.lower()):
                  urls.append(urljoin(r.url,v))
            urls += re.findall(r'https?://[^\"\'<>\s]+',text)
            urls=[x.rstrip('),;') for x in urls if any(k in x.lower() for k in ['pdf','download','preview','upload','file','img','image'])]
            uniq=[]
            for x in urls:
              if x not in uniq: uniq.append(x)
            out['pages'][name]={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'urls':uniq[:300], 'html_head':text[:12000]}
            print('PAGE',name,'URLS',json.dumps(uniq[:100],ensure_ascii=False),flush=True)

          open('discovery.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print('SUMMARY',json.dumps({'eastmoney_count':len(out['eastmoney']),'page_counts':{k:len(v.get('urls',[])) for k,v in out['pages'].items()}},ensure_ascii=False),flush=True)
          PY
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: lee-man-paper-discovery
          path: discovery.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
