name: Inspect public FXBaogao report viewer
on:
  push:
    branches: [tmp-fxbaogao-cofco-view-20260905]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch visible public viewer page
        run: |
          python -m pip install requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          u='https://www.fxbaogao.com/view?id=3202477'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/detail/3202477','Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(u,timeout=60,allow_redirects=True)
          print('VIEW',r.status_code,len(r.content),r.url,r.headers.get('content-type'),r.headers.get('content-disposition'))
          open('output/view.bin','wb').write(r.content)
          if r.content.lstrip().startswith(b'%PDF'):
              open('output/report.pdf','wb').write(r.content)
              print('DIRECT_PDF')
          else:
              open('output/view.html','wb').write(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(True):
                  for a in ['href','src','data-src','data-url','data-file','data-pdf','content']:
                      v=tag.get(a)
                      if isinstance(v,str):
                          full=urljoin(r.url,v)
                          if any(k in (a+' '+v+' '+full).lower() for k in ['pdf','download','file','viewer','blob']):
                              print('ASSET',tag.name,a,repr(v[:500]),full[:800])
              for key in ['pdf','download','fileUrl','pdfUrl','source','blob','fetch(','axios','viewer']:
                  ms=list(re.finditer(re.escape(key),r.text,re.I))
                  print('KEY',key,len(ms))
                  for m in ms[:5]: print('SNIP',r.text[max(0,m.start()-300):m.start()+900].replace('\n',' ')[:1200])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-cofco-view
          path: output
          retention-days: 1
