name: Inspect Hengbo public long-report page links 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-nxny-scrape-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html,urllib.parse,json
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=['https://www.nxny.com/author/11309_p15.html','https://www.nxny.com/stype_gg_p1532/']
          for u in urls:
            print('\n===',u,'===')
            try:
              r=s.get(u,timeout=(15,45),allow_redirects=True)
              print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'))
              text=r.content.decode('utf-8','ignore')
              if '恒勃' not in text:
                text=r.content.decode('gb18030','ignore')
              print('CONTAINS', '恒勃' in text)
              for m in re.finditer('恒勃',text):
                print('CTX',text[max(0,m.start()-1000):min(len(text),m.end()+2000)].replace('\n',' ')[:3200])
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urllib.parse.urljoin(r.url,html.unescape(a['href']))
                if '恒勃' in label or '恒勃' in href or any(k in href.lower() for k in ['pdf','download','report']):
                  links.append({'label':label[:300],'href':href})
              print('LINKS',json.dumps(links[:200],ensure_ascii=False,indent=2))
            except Exception as e: print('ERROR',repr(e))
          PY
