name: Temporary inspect Eastmoney Daan Gene report page API

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-em-page-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Inspect page scripts and report API calls
        run: |
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          url='https://data.eastmoney.com/report/002030.html'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(url,timeout=60)
          text=r.content.decode('utf-8','replace'); decoded=html.unescape(text).replace('\\/','/')
          soup=BeautifulSoup(text,'html.parser')
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          scripts=[]
          for tag in soup.find_all('script'):
            src=tag.get('src')
            if src:
              src=urljoin(r.url,src); scripts.append(src); print('SCRIPT',src)
            content=tag.get_text() or ''
            if content.strip() and any(k.lower() in content.lower() for k in ['reportapi','002030','report/list','qtype','pageSize'.lower()]):
              print('INLINE',content[:30000])
          for needle in ['reportapi','report/list','002030','qType','pageSize','industryCode','rcode','stockCode','beginTime']:
            poss=[m.start() for m in re.finditer(re.escape(needle),decoded,re.I)]
            if poss:
              print('PAGE_NEEDLE',needle,'COUNT',len(poss))
              for pos in poss[:20]: print('PAGE_CONTEXT',re.sub(r'\s+',' ',decoded[max(0,pos-700):pos+1800])[:2800])
          for js_url in scripts:
            try:
              jr=s.get(js_url,timeout=60); jtext=jr.content.decode('utf-8','replace')
            except Exception as e: print('JS_ERROR',js_url,repr(e)); continue
            if not any(k.lower() in jtext.lower() for k in ['reportapi','report/list','qtype','attachpages','infocode']):
              continue
            print('\nJS_FILE',js_url,'STATUS',jr.status_code,'BYTES',len(jr.content))
            vals=[]
            for pat in [r'https?://[^"\'<>\s]+',r'["\'](/[^"\']*(?:report|api)[^"\']*)["\']']:
              for v in re.findall(pat,jtext,re.I):
                if isinstance(v,tuple): v=''.join(v)
                if len(v)<1000 and v not in vals: vals.append(v)
            print('VALUES',json.dumps(vals[:500],ensure_ascii=False))
            for needle in ['reportapi','report/list','qType','pageSize','industryCode','rcode','code:','code=','stockCode','beginTime','attachPages','infoCode']:
              poss=[m.start() for m in re.finditer(re.escape(needle),jtext,re.I)]
              if poss:
                print('JS_NEEDLE',needle,'COUNT',len(poss))
                for pos in poss[:30]: print('JS_CONTEXT',re.sub(r'\s+',' ',jtext[max(0,pos-600):pos+1600])[:2600])
          PY
