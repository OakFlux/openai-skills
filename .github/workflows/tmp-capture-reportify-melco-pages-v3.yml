name: Temporary Capture Reportify Melco Page Assets V3

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-capture-reportify-melco-pages-v3.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Python dependencies
        run: python -m pip install --quiet selenium requests pillow

      - name: Capture public report document assets only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, re, subprocess, time
          from pathlib import Path
          import requests
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          OUT=Path('out');ASSETS=OUT/'assets';ASSETS.mkdir(parents=True,exist_ok=True)
          targets=[
            ('1118968060607336448','https://reportify.cn/reports/1118968060607336448',15),
            ('1052271542572027904','https://reportify.cn/reports/1052271542572027904',4),
            ('962339654089314304','https://reportify.cn/reports/962339654089314304',4),
          ]
          chrome='/opt/google/chrome/google-chrome'
          driver_path='/usr/local/share/chromedriver-linux64/chromedriver'
          if not Path(chrome).exists():chrome='/usr/bin/google-chrome'
          if not Path(driver_path).exists():driver_path=None
          opts=Options();opts.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1600,1200','--remote-debugging-pipe']:opts.add_argument(a)
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL'})
          driver=webdriver.Chrome(service=Service(driver_path) if driver_path else Service(),options=opts)
          sess=requests.Session();sess.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://reportify.cn/'})
          results=[]
          try:
            for rid,url,expected in targets:
              rdir=ASSETS/rid;rdir.mkdir(parents=True,exist_ok=True)
              try:driver.get_log('performance')
              except:pass
              driver.get(url);time.sleep(8)
              # Scroll through the document viewer in moderate increments.
              for _ in range(18):
                driver.execute_script('window.scrollBy(0,800)');time.sleep(.4)
              time.sleep(3)
              html=driver.page_source;(rdir/'page_source.html').write_text(html,encoding='utf-8')
              dom_urls=driver.execute_script('''return Array.from(document.querySelectorAll('img,source,iframe,object,embed,a')).flatMap(el=>['src','href','data-src','data-url','data-file','data-download'].map(k=>el.getAttribute&&el.getAttribute(k)).filter(Boolean));''')
              logs=driver.get_log('performance')
              responses={};requests_seen=[]
              for entry in logs:
                try:m=json.loads(entry['message'])['message'];p=m.get('params',{})
                except:continue
                if m.get('method')=='Network.requestWillBeSent':
                  q=p.get('request',{});u=q.get('url')
                  if u:requests_seen.append({'url':u,'method':q.get('method'),'type':p.get('type'),'postData':q.get('postData')})
                elif m.get('method')=='Network.responseReceived':
                  q=p.get('response',{});u=q.get('url')
                  if u:responses[u]={'status':q.get('status'),'mimeType':q.get('mimeType'),'encodedDataLength':q.get('encodedDataLength')}
              candidates=[]
              for u,meta in responses.items():
                mime=(meta.get('mimeType') or '').lower();low=u.lower()
                if meta.get('status')==200 and (mime.startswith('image/') or mime=='application/pdf' or any(k in low for k in ['/document/','/report/page','page_image','page-image','s.reportify.cn/r/'])):
                  candidates.append(u)
              for u in dom_urls:
                if isinstance(u,str) and u.startswith('http') and any(k in u.lower() for k in ['preview','/report/','.pdf','.png','.jpg','.jpeg','.webp','s.reportify.cn/r/']):candidates.append(u)
              candidates=list(dict.fromkeys(candidates))
              downloads=[]
              for i,u in enumerate(candidates):
                try:
                  q=sess.get(u,timeout=30,allow_redirects=True);body=q.content;ctype=(q.headers.get('content-type') or '').lower();rec={'url':u,'final':q.url,'status':q.status_code,'type':ctype,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest() if body else ''}
                  ext=None
                  if q.status_code==200 and body.lstrip().startswith(b'%PDF'):ext='.pdf'
                  elif q.status_code==200:
                    try:im=Image.open(io.BytesIO(body));rec['size']=list(im.size);ext='.'+(im.format or 'png').lower().replace('jpeg','jpg')
                    except:pass
                  if ext:
                    path=rdir/f'{i:04d}{ext}';path.write_bytes(body);rec['saved']=str(path)
                  downloads.append(rec)
                except Exception as e:downloads.append({'url':u,'error':repr(e)})
              result={'report_id':rid,'url':url,'expected_pages':expected,'title':driver.title,'responses':responses,'requests':requests_seen,'dom_urls':dom_urls,'candidates':candidates,'downloads':downloads}
              results.append(result)
              print('CAPTURE='+json.dumps({'report_id':rid,'title':driver.title,'candidate_count':len(candidates),'saved':[x for x in downloads if x.get('saved')]},ensure_ascii=False),flush=True)
          finally:driver.quit()
          (OUT/'capture.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: reportify-melco-page-capture-v3
          path: out
          retention-days: 3
          if-no-files-found: error
