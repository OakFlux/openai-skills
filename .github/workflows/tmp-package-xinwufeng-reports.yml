name: Temporary Package New Wellful Brokerage Reports

on:
  push:
    branches:
      - tmp/fetch-xinwufeng-reports-20260830
    paths:
      - .github/workflows/tmp-package-xinwufeng-reports.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-xinwufeng-reports-20260830
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pypdf requests

      - name: Download, validate, render and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil, subprocess, zipfile
          import requests
          from pypdf import PdfReader

          reports = [
            {
              'num': 1,
              'broker': '国金证券',
              'date': '2024-12-27',
              'title': '国有区域养殖龙头，提质扩量稳健发展',
              'info': 'AP202412291641462158',
              'expected_min_pages': 15,
            },
            {
              'num': 2,
              'broker': '民生证券',
              'date': '2023-05-17',
              'title': '首次覆盖报告：国有生猪养殖区域龙头，并购重组实现出栏高增',
              'info': 'AP202305181586740282',
              'expected_min_pages': 18,
            },
            {
              'num': 3,
              'broker': '国元证券',
              'date': '2022-03-04',
              'title': '新五丰首次覆盖报告：进击的湖南生猪养殖龙头',
              'info': 'AP202203041550524115',
              'expected_min_pages': 15,
            },
          ]
          root = Path('deliverables/xinwufeng')
          pdf_dir = root / 'pdfs'
          preview_dir = root / 'previews'
          pdf_dir.mkdir(parents=True, exist_ok=True)
          preview_dir.mkdir(parents=True, exist_ok=True)
          s = requests.Session()
          headers = {
            'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
            'Referer': 'https://data.eastmoney.com/',
            'Accept': 'application/pdf,*/*',
          }
          manifest=[]
          for report in reports:
            url = f"https://pdf.dfcfw.com/pdf/H3_{report['info']}_1.pdf"
            safe_title = re.sub(r'[\\/:*?"<>|，。；：、（）()【】《》\s]+','_',report['title']).strip('_')
            filename = f"{report['num']:02d}_{report['broker']}_新五丰_{safe_title}_{report['date'].replace('-','')}.pdf"
            path = pdf_dir / filename
            print(f"DOWNLOADING {report['num']}: {url}")
            r = s.get(url, headers=headers, timeout=120)
            print('HTTP', r.status_code, 'BYTES', len(r.content), 'TYPE', r.headers.get('content-type'))
            r.raise_for_status()
            if len(r.content) < 20000 or not r.content.startswith(b'%PDF'):
              raise RuntimeError(f"not a valid PDF: {filename}")
            path.write_bytes(r.content)
            reader = PdfReader(str(path), strict=False)
            pages = len(reader.pages)
            if pages < report['expected_min_pages']:
              raise RuntimeError(f"page count too low for {filename}: {pages}")
            # Extract first-page text for identity validation.
            first_text = (reader.pages[0].extract_text() or '').replace('\x00',' ')
            identity_ok = ('新五丰' in first_text or '600975' in first_text) and report['broker'][:2] in first_text
            if not identity_ok:
              print('FIRST_TEXT_HEAD', first_text[:1200])
              raise RuntimeError(f"identity validation failed: {filename}")
            sha = hashlib.sha256(r.content).hexdigest()
            # Render first and last page for later visual QA.
            stem = path.stem
            subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(path),str(preview_dir/f'{stem}_first')], check=True)
            subprocess.run(['pdftoppm','-f',str(pages),'-singlefile','-png','-r','110',str(path),str(preview_dir/f'{stem}_last')], check=True)
            item={**report,'filename':filename,'url':url,'pages':pages,'bytes':len(r.content),'sha256':sha,'first_page_text_head':first_text[:500]}
            manifest.append(item)
            print('VALIDATED_JSON='+json.dumps(item,ensure_ascii=False))

          manifest_txt = root / '来源与校验.txt'
          lines = [
            '新五丰（600975）券商深度报告',
            '生成日期：2026-08-30',
            '说明：下列文件均为公开原始 PDF，未修改正文。',
            '',
          ]
          for item in manifest:
            lines += [
              f"{item['num']}. {item['broker']}｜{item['date']}｜{item['title']}",
              f"   文件：{item['filename']}",
              f"   页数：{item['pages']} 页；大小：{item['bytes']} 字节",
              f"   SHA-256：{item['sha256']}",
              f"   来源：{item['url']}",
              '',
            ]
          manifest_txt.write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          zip_path = root / '新五丰_券商深度报告_3份_2022-2024.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for item in manifest:
              p=pdf_dir/item['filename']
              z.write(p,arcname=p.name)
            z.write(manifest_txt,arcname='来源与校验.txt')
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP test failed: '+bad)
          print('ZIP_JSON='+json.dumps({'path':str(zip_path),'bytes':zip_path.stat().st_size,'sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest()},ensure_ascii=False))
          PY

      - name: Commit deliverables to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Research Packager'
          git config user.email 'actions@users.noreply.github.com'
          git add deliverables/xinwufeng
          git commit -m 'chore: add validated New Wellful brokerage report package'
          git push origin HEAD:tmp/fetch-xinwufeng-reports-20260830

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xinwufeng-brokerage-reports
          path: |
            deliverables/xinwufeng/新五丰_券商深度报告_3份_2022-2024.zip
            deliverables/xinwufeng/manifest.json
            deliverables/xinwufeng/来源与校验.txt
            deliverables/xinwufeng/previews/*.png
          retention-days: 3
          if-no-files-found: error
