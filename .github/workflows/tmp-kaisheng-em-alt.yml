name: Temporary Kaisheng alternate Eastmoney report indexes

on:
  push:
    branches:
      - tmp-kaisheng-em-alt-20260905

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query alternate report indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          base='https://reportapi.eastmoney.com/report/list'
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'}
          out=[]
          codes=['600876','SH600876','600876.SH','01108','1108','HK01108','HK1108']
          for code in codes:
            for qtype in ['0','1','2']:
              params={
                'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':'2015-01-01','endTime':'2026-12-31','pageNo':'1','fields':'',
                'qType':qtype,'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
              }
              url=base+'?'+urllib.parse.urlencode(params)
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=60) as r: body=r.read().decode('utf-8','replace')
                obj=json.loads(body); rows=obj.get('data') or []
                print('QUERY',code,qtype,'hits',obj.get('hits'),'rows',len(rows),flush=True)
                for row in rows:
                  rec={'query_code':code,'query_qtype':qtype,**row}; out.append(rec)
                  print('ROW',json.dumps({k:row.get(k) for k in ['publishDate','orgSName','title','infoCode','attachPages','attachSize','stockName','stockCode','researcher']},ensure_ascii=False),flush=True)
              except Exception as e: print('ERROR',code,qtype,repr(e),flush=True)
          unique={}
          for r in out: unique[r.get('infoCode') or json.dumps(r,sort_keys=True,ensure_ascii=False)]=r
          Path('output/results.json').write_text(json.dumps(list(unique.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE',len(unique),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-eastmoney-alt-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
