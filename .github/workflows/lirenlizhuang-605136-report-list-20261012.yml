name: List Lirenlizhuang 605136 research reports
on:
  push:
    paths:
      - '.github/workflows/lirenlizhuang-605136-report-list-20261012.yml'
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List reports
        run: |
          python - <<'PY'
          import json, requests
          u='https://reportapi.eastmoney.com/report/list'
          p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':'2018-01-01','endTime':'2026-10-12','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'605136','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          r=requests.get(u,params=p,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'},timeout=60)
          print(r.status_code, len(r.content))
          for x in r.json().get('data',[]):
              print(json.dumps({k:x.get(k) for k in ['title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column']},ensure_ascii=False))
          PY
