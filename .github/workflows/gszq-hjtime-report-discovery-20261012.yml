name: Discover official Guosheng HJTime report PDF 20261012

on:
  push:
    paths:
      - '.github/workflows/gszq-hjtime-report-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect official research portal and APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('discovery'); out.mkdir()
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept':'text/html,application/json,text/plain,application/pdf,*/*',
              'Referer':'https://research.gszq.com/',
          })
          urls=['https://research.gszq.com/','https://research.gszq.com/report','https://research.gszq.com/research','https://research.gszq.com/album']
          scripts=set(); pages=[]
          for i,url in enumerate(urls,1):
              try:
                  r=s.get(url,timeout=(20,90),allow_redirects=True)
                  print('PAGE',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  (out/f'page_{i}.html').write_bytes(r.content)
                  text=r.text; soup=BeautifulSoup(text,'lxml')
                  print('TITLE',i,soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
                  links=[]
                  for tag in soup.find_all(True):
                      for attr in ('href','src','data-url','data-src','onclick'):
                          val=tag.get(attr)
                          if not val: continue
                          sv=str(val)
                          if attr in ('href','src','data-url','data-src'): sv=urllib.parse.urljoin(r.url,sv)
                          if tag.name=='script' and attr=='src': scripts.add(sv)
                          if any(k in sv.lower() for k in ('api','report','pdf','download','research','search')):
                              links.append({'tag':tag.name,'attr':attr,'value':sv,'text':' '.join(tag.get_text(' ',strip=True).split())[:200]})
                  print('LINKS',i,json.dumps(links[:500],ensure_ascii=False),flush=True)
                  for pat in ('api','report','pdf','download','search','汇嘉时代','603101'):
                      snips=[]
                      for m in list(re.finditer(pat,text,re.I))[:100]: snips.append(text[max(0,m.start()-300):min(len(text),m.end()+700)])
                      if snips: print('PAGE_SNIPS',i,pat,json.dumps(snips[:50],ensure_ascii=False),flush=True)
                  pages.append({'url':r.url,'scripts':list(scripts)})
              except Exception as e: print('PAGE_ERR',url,repr(e),flush=True)
          (out/'pages.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SCRIPT_COUNT',len(scripts),flush=True)
          script_records=[]
          endpoints=set()
          for i,url in enumerate(sorted(scripts),1):
              try:
                  r=s.get(url,timeout=(20,90),allow_redirects=True)
                  print('SCRIPT',i,r.status_code,len(r.content),url,flush=True)
                  if r.status_code!=200: continue
                  text=r.text; (out/f'script_{i:03d}.js').write_text(text,encoding='utf-8',errors='replace')
                  hits=[]
                  for pat in ('api','report','pdf','download','search','research','upload','attachment','fileUrl','url'):
                      for m in list(re.finditer(pat,text,re.I))[:200]: hits.append(text[max(0,m.start()-250):min(len(text),m.end()+600)])
                  for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                      u=m.group(0).replace('\\/','/').rstrip(');,]}')
                      if any(k in u.lower() for k in ('api','report','pdf','download','research','file')): endpoints.add(u)
                  for m in re.finditer(r'["\'](/[^"\']{2,250})["\']',text):
                      p=m.group(1)
                      if any(k in p.lower() for k in ('api','report','pdf','download','research','search','file')): endpoints.add(urllib.parse.urljoin('https://research.gszq.com/',p))
                  if hits:
                      script_records.append({'url':url,'hits':hits})
                      print('SCRIPT_HITS',url,json.dumps(hits[:100],ensure_ascii=False),flush=True)
              except Exception as e: print('SCRIPT_ERR',url,repr(e),flush=True)
          (out/'scripts.json').write_text(json.dumps(script_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'endpoints.txt').write_text('\n'.join(sorted(endpoints)),encoding='utf-8')
          print('ENDPOINTS',json.dumps(sorted(endpoints),ensure_ascii=False),flush=True)
          PY
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: gszq-hjtime-report-discovery
          path: discovery
          retention-days: 7
          if-no-files-found: error
