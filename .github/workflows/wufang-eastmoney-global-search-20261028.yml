name: Search Eastmoney globally for Wufang IPO reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wufang-eastmoney-global-search-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search report API
        run: |
          python - <<'PY'
          import json, requests, re
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          allrows=[]
          for qtype in ['0','1','2']:
            print('\n=== QTYPE',qtype,'===')
            for page in range(1,31):
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                 'beginTime':'2019-08-20','endTime':'2019-09-30','pageNo':str(page),'fields':'',
                 'qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(api,params=p,timeout=(20,120)); print('PAGE',page,'STATUS',r.status_code,'URL',r.url)
              if r.status_code!=200: print(r.text[:500]); break
              d=r.json(); rows=d.get('data') or []; print('HITS',d.get('hits'),'ROWS',len(rows))
              if not rows: break
              for x in rows:
                title=str(x.get('title') or '')
                fields=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode','orgSName','orgName','researcher'])
                if any(k in fields for k in ['五方光电','002962','科博达']) or ('新股' in title and str(x.get('publishDate') or '')[:10] in ['2019-08-27','2019-09-06']):
                  print('MATCH',json.dumps(x,ensure_ascii=False))
              allrows.extend(rows)
              if len(rows)<100: break
          print('TOTAL_ROWS',len(allrows))
          PY
