name: Discover China Longgong 03339 broker research reports 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-broker-discovery-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Search public report indexes and probe PDF candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p longgong_broker_discovery
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('longgong_broker_discovery')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'text/html,application/xhtml+xml,application/json,text/javascript,*/*;q=0.8',
          })

          result = {'eastmoney': [], 'search_pages': [], 'candidates': [], 'errors': []}
          seen_candidate = set()

          def add_candidate(url: str, source: str, title: str = '', context: str = ''):
              url = html.unescape(url).replace('\\/', '/')
              if url.startswith('//'):
                  url = 'https:' + url
              if not url.startswith(('http://', 'https://')):
                  return
              key = url.split('#')[0]
              if key in seen_candidate:
                  return
              seen_candidate.add(key)
              result['candidates'].append({'url': url, 'source': source, 'title': title, 'context': context[:1500]})

          def parse_json_or_jsonp(r):
              try:
                  return r.json()
              except Exception:
                  t = r.text.strip()
                  m = re.search(r'^[^(]*\((.*)\)\s*;?$', t, re.S)
                  if m:
                      return json.loads(m.group(1))
                  raise

          # 1. Eastmoney report API with multiple ticker parameter variants.
          api = 'https://reportapi.eastmoney.com/report/list'
          variants = []
          for field in ('code', 'stockCode', 'scode'):
              for code in ('03339', '3339', '03339.HK', '3339.HK', 'HK03339', '116.03339'):
                  for qtype in ('0', '1'):
                      variants.append((field, code, qtype))
          for field, code, qtype in variants:
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*', 'rating': '*',
                  'ratingChange': '*', 'beginTime': '2005-01-01', 'endTime': '2026-09-26',
                  'pageNo': '1', 'fields': '', 'qType': qtype, 'orgCode': '', 'author': '',
                  field: code, 'rcode': '', 'p': '1', 'pageNum': '1', 'pageNumber': '1'
              }
              try:
                  r = s.get(api, params=params, timeout=(20, 90), headers={'Referer': 'https://data.eastmoney.com/'})
                  print('EASTMONEY', field, code, qtype, r.status_code, len(r.content), r.url, flush=True)
                  r.raise_for_status()
                  data = parse_json_or_jsonp(r)
                  records = data.get('data') or data.get('Data') or [] if isinstance(data, dict) else []
                  matched = []
                  for rec in records:
                      text = json.dumps(rec, ensure_ascii=False)
                      if any(k.lower() in text.lower() for k in ('中国龙工', '中國龍工', 'china longgong', 'lonking', '03339', '3339.hk')):
                          matched.append(rec)
                          info = str(rec.get('infoCode') or rec.get('info_code') or rec.get('infocode') or '')
                          title = str(rec.get('title') or rec.get('reportTitle') or '')
                          if info:
                              for prefix in ('H3_', ''):
                                  for suffix in ('_1.pdf', '.pdf'):
                                      add_candidate(f'https://pdf.dfcfw.com/pdf/{prefix}{info}{suffix}', 'Eastmoney derived', title, text)
                          for k, v in rec.items():
                              if isinstance(v, str) and ('pdf' in v.lower() or v.startswith('http')):
                                  add_candidate(v, 'Eastmoney field:' + k, title, text)
                  if matched:
                      result['eastmoney'].append({'field': field, 'code': code, 'qType': qtype, 'url': r.url, 'records': matched})
              except Exception as e:
                  result['errors'].append({'stage': 'eastmoney', 'field': field, 'code': code, 'qType': qtype, 'error': repr(e)})
              time.sleep(0.15)

          # 2. Public web search pages and report repositories.
          queries = [
              '"中国龙工" 研报 PDF',
              '"中国龙工" 券商 深度报告',
              '"中国龙工" 首次覆盖',
              '"中国龙工" 公司研究 报告',
              '"03339.HK" research report PDF',
              '"3339 HK" equity research PDF',
              '"Lonking Holdings" research report PDF',
              'site:pdf.dfcfw.com 中国龙工',
              'site:fxbaogao.com 中国龙工',
              'site:baogaobox.com 中国龙工',
              'site:fhyanbao.com 中国龙工',
              'site:dbs.com Lonking 3339 report',
              'site:research.hktdc.com Lonking',
          ]
          search_urls = []
          for q in queries:
              search_urls.extend([
                  ('bing', 'https://www.bing.com/search?q=' + quote_plus(q)),
                  ('baidu', 'https://www.baidu.com/s?wd=' + quote_plus(q)),
                  ('sogou', 'https://www.sogou.com/web?query=' + quote_plus(q)),
              ])
          search_urls.extend([
              ('fxbaogao', 'https://www.fxbaogao.com/search?keyword=' + quote_plus('中国龙工')),
              ('fxbaogao', 'https://www.fxbaogao.com/search?q=' + quote_plus('中国龙工')),
              ('baogaobox', 'https://www.baogaobox.com/search.html?keyword=' + quote_plus('中国龙工')),
              ('fhyanbao', 'https://www.fhyanbao.com/search?keyword=' + quote_plus('中国龙工')),
              ('sina', 'https://stock.finance.sina.com.cn/hkstock/view/paper.php?symbol=03339'),
              ('sina', 'https://stock.finance.sina.com.cn/hkstock/view/paper.php?symbol=3339'),
          ])

          for idx, (source, url) in enumerate(search_urls, 1):
              try:
                  r = s.get(url, timeout=(20, 90), allow_redirects=True)
                  print('SEARCH', idx, source, r.status_code, len(r.content), r.url, flush=True)
                  fn = OUT / f'search_{idx:03d}_{source}.html'
                  fn.write_bytes(r.content)
                  rec = {'source': source, 'input_url': url, 'final_url': r.url, 'status': r.status_code,
                         'bytes': len(r.content), 'content_type': r.headers.get('content-type'), 'title': ''}
                  text = r.text
                  soup = BeautifulSoup(text, 'lxml')
                  rec['title'] = soup.title.get_text(' ', strip=True) if soup.title else ''
                  links = []
                  for tag in soup.find_all(['a', 'iframe', 'embed', 'object', 'script', 'link']):
                      for attr in ('href', 'src', 'data', 'data-src', 'data-url'):
                          v = tag.get(attr)
                          if v:
                              u = urljoin(r.url, html.unescape(v))
                              links.append(u)
                              low = u.lower()
                              if any(x in low for x in ('.pdf', 'report', '研报', 'yanbao', 'baogao', 'paper.php', 'rpview', '/read/', '/reports/')):
                                  add_candidate(u, source, tag.get_text(' ', strip=True), '')
                  for pat in (
                      r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                      r'["\']([^"\']*(?:download|down|file|pdf|report|resource|attachment|preview|rpview|reports)[^"\']*)["\']',
                  ):
                      for m in re.finditer(pat, text, re.I):
                          v = m.group(1) if m.lastindex else m.group(0)
                          add_candidate(urljoin(r.url, v), source, '', '')
                  rec['interesting_links'] = sorted(set(links))[:500]
                  result['search_pages'].append(rec)
              except Exception as e:
                  result['errors'].append({'stage': 'search', 'source': source, 'url': url, 'error': repr(e)})
              time.sleep(0.2)

          # 3. Probe candidate URLs without downloading huge files.
          probed = []
          for i, cand in enumerate(result['candidates'][:1000], 1):
              url = cand['url']
              try:
                  r = s.get(url, timeout=(20, 90), allow_redirects=True, stream=True,
                            headers={'Range': 'bytes=0-65535', 'Referer': cand.get('source', '')})
                  head = b''
                  for chunk in r.iter_content(65536):
                      if chunk:
                          head += chunk
                          break
                  info = {**cand, 'status': r.status_code, 'final_url': r.url,
                          'content_type': r.headers.get('content-type'),
                          'content_length': r.headers.get('content-length'),
                          'content_range': r.headers.get('content-range'),
                          'head': head[:16].hex(), 'is_pdf': head.startswith(b'%PDF-')}
                  probed.append(info)
                  if info['is_pdf']:
                      print('PDF_CANDIDATE', json.dumps(info, ensure_ascii=False), flush=True)
              except Exception as e:
                  probed.append({**cand, 'error': repr(e)})
          result['probed'] = probed

          (OUT / 'discovery.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'pdf_candidates.json').write_text(json.dumps([x for x in probed if x.get('is_pdf')], ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'all_candidates.json').write_text(json.dumps(result['candidates'], ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_EASTMONEY', json.dumps(result['eastmoney'], ensure_ascii=False, indent=2), flush=True)
          print('FINAL_PDFS', json.dumps([x for x in probed if x.get('is_pdf')], ensure_ascii=False, indent=2), flush=True)
          PY

          grep -RInE "中国龙工|中國龍工|China Longgong|Lonking|03339|3339\.HK|\.pdf" longgong_broker_discovery > longgong_broker_discovery/grep_hits.txt || true
          find longgong_broker_discovery -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > longgong_broker_discovery/file_sizes.txt

      - name: Upload discovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-broker-discovery
          path: longgong_broker_discovery
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
