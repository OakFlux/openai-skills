name: Discover China Longgong 03339 report links 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-03339-discovery-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch source pages and extract report links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out = Path('discovery')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls = [
              'https://stock.qianzhan.com/hk/sourcefiles_03339.HK.html',
              'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en',
              'https://www.hkexnews.hk/search/titlesearch.xhtml?lang=en',
              'https://www.lonking.cn/',
              'http://www.lonking.cn/',
          ]
          all_links = []
          report = []
          for i, url in enumerate(urls, 1):
              try:
                  r = s.get(url, timeout=(20, 120), allow_redirects=True)
                  print('FETCH', url, r.status_code, r.url, len(r.content), r.headers.get('content-type'), flush=True)
                  item = {'url': url, 'status': r.status_code, 'final_url': r.url, 'bytes': len(r.content), 'content_type': r.headers.get('content-type')}
                  report.append(item)
                  suffix = '.html' if 'html' in (r.headers.get('content-type') or '').lower() else '.bin'
                  (out / f'{i:02d}{suffix}').write_bytes(r.content)
                  text = r.text
                  soup = BeautifulSoup(text, 'lxml')
                  for a in soup.find_all('a', href=True):
                      href = urljoin(r.url, a.get('href'))
                      label = ' '.join(a.get_text(' ', strip=True).split())
                      all_links.append({'source': r.url, 'href': href, 'label': label})
                  # Capture raw URL-like strings from scripts and JSON payloads.
                  for m in re.finditer(r'https?://[^\"\'<>\\\s]+', text, flags=re.I):
                      all_links.append({'source': r.url, 'href': m.group(0), 'label': 'raw'})
              except Exception as exc:
                  print('ERROR', url, repr(exc), flush=True)
                  report.append({'url': url, 'error': repr(exc)})

          # Try a few likely company IR endpoints.
          candidates = [
              'https://www.lonking.cn/investor/',
              'https://www.lonking.cn/investor-relations/',
              'https://www.lonking.cn/tzzgx/',
              'https://www.lonking.cn/InvestorRelations/',
              'https://www.lonking.cn/Uploads/',
          ]
          for j, url in enumerate(candidates, 20):
              try:
                  r = s.get(url, timeout=(20, 90), allow_redirects=True)
                  print('CANDIDATE', url, r.status_code, r.url, len(r.content), r.headers.get('content-type'), flush=True)
                  (out / f'{j:02d}.html').write_bytes(r.content)
                  soup = BeautifulSoup(r.text, 'lxml')
                  for a in soup.find_all('a', href=True):
                      all_links.append({'source': r.url, 'href': urljoin(r.url, a.get('href')), 'label': ' '.join(a.get_text(' ', strip=True).split())})
              except Exception as exc:
                  print('CANDIDATE_ERROR', url, repr(exc), flush=True)

          # Deduplicate and write filtered link sets.
          uniq = []
          seen = set()
          for x in all_links:
              key = (x['href'], x.get('label',''))
              if key not in seen:
                  seen.add(key)
                  uniq.append(x)
          filt = [x for x in uniq if any(k in (x['href'] + ' ' + x.get('label','')).lower() for k in ['pdf','annual','interim','report','03339','3339','longgong','lonking','年報','年报','中期'])]
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'all_links.json').write_text(json.dumps(uniq, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'filtered_links.json').write_text(json.dumps(filt, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FILTERED_COUNT', len(filt), flush=True)
          for x in filt[:500]:
              print(json.dumps(x, ensure_ascii=False), flush=True)
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: china-longgong-03339-discovery
          path: discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
