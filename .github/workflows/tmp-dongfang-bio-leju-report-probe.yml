name: Temporary Dongfang Biotech Leju report probe

on:
  push:
    branches:
      - tmp-dongfang-bio-reports-20260830
    paths:
      - .github/workflows/tmp-dongfang-bio-leju-report-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect report page and PDF assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          url='https://m.lejucaijing.com/report-35489.html'
          r=requests.get(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*'},timeout=90,allow_redirects=True)
          print('PAGE',r.status_code,len(r.content),r.headers.get('content-type'),r.url)
          print('HEAD',r.text[:1500])
          links=[]
          for pat in [r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',r'(?://|/)[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?']:
              links.extend(re.findall(pat,r.text,re.I))
          for link in sorted(set(links)):
              if link.startswith('//'): link='https:'+link
              elif link.startswith('/'): link='https://m.lejucaijing.com'+link
              print('PDF_LINK',link)
              try:
                  x=requests.get(link,headers={'User-Agent':ua,'Referer':r.url,'Accept':'application/pdf,*/*'},timeout=90,allow_redirects=True)
                  print('PDF_TEST',x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:20]),x.url)
                  open('/tmp/candidate.pdf','wb').write(x.content)
              except Exception as e: print('PDF_ERR',repr(e))
          for needle in ['pdf','download','研报','安信证券','新生代国际化IVD龙头']:
              for m in list(re.finditer(needle,r.text,re.I))[:20]:
                  p=m.start(); print('CTX',needle,re.sub(r'\s+',' ',r.text[max(0,p-700):p+1800])[:2500])
          PY
