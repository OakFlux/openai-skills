name: Focused broker queries for Great Eagle Holdings
on:
  push:
    paths:
      - '.github/workflows/greateagle-focused-broker-query-20260922.yml'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: |
          set -euo pipefail
          mkdir output
          python - <<'PY'
          import concurrent.futures,json,re
          from pathlib import Path
          import requests
          qs=[
            '鷹君 摩根大通','鹰君 摩根大通','鷹君 地產','鹰君 地产','鷹君 酒店','鹰君 酒店',
            'Great Eagle JPMorgan','Great Eagle JP Morgan','Great Eagle Hong Kong property',
            '0041 摩根大通','0041 香港地产','0041 酒店','鷹君 朗廷','鹰君 朗廷','Great Eagle Langham',
            '鷹君 冠君','鹰君 冠君','Great Eagle Champion REIT'
          ]
          def f(q):
            s=requests.Session();s.trust_env=False
            s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json','Content-Type':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
            b={'order':'2','pdfPage':'-1','pageNum':1,'pageSize':100,'paragraphSize':20,'keywords':q}
            try:
              r=s.post('https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth',json=b,timeout=(15,60));d=r.json()
              docs=[]
              for x in ((d.get('data') or {}).get('dataList') or []):
                title=re.sub('<[^>]+>','',str(x.get('title') or ''))
                paras=' '.join(re.sub('<[^>]+>','',str(p.get('content') or '')) for p in (x.get('paragraphObjs') or []))
                docs.append({'docId':x.get('docId'),'title':title,'org':re.sub('<[^>]+>','',str(x.get('orgName') or '')),'pub':x.get('pubTimeStr'),'pages':x.get('pageNum'),'reportType':x.get('reportType'),'isDeep':x.get('isDeep'),'stocks':x.get('stocks'),'pdfPath':x.get('pdfPath'),'coverPrefix':x.get('coverPrefix'),'paragraphs':paras[:5000]})
              return {'q':q,'count':(d.get('data') or {}).get('count'),'pageCount':(d.get('data') or {}).get('pageCount'),'docs':docs}
            except Exception as e:return {'q':q,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=9) as ex:rows=list(ex.map(f,qs))
          Path('output/results.json').write_text(json.dumps(rows,ensure_ascii=True,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=True,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: greateagle-focused-broker-query
          path: output
          retention-days: 7
