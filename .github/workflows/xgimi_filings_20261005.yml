name: XGIMI Complete Filings Package

on:
  push:
    branches:
      - chatgpt-xgimi-filings-20261005
    paths:
      - scripts/build_xgimi_filings_20261005.py
      - .github/workflows/xgimi_filings_20261005.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow
      - name: Download, validate, and package reports
        run: python scripts/build_xgimi_filings_20261005.py
      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xgimi-complete-filings-package
          path: |
            output/xgimi_all_annual_reports_prospectus_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
