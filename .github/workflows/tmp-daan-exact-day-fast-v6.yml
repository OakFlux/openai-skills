name: Temporary Daan Gene exact-day fast v6

on:
  push:
    branches: [tmp/daan-gene-broker-reports-20260829]
    paths: [.github/workflows/tmp-daan-exact-day-fast-v6.yml]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests pypdf
      - name: Search exact publication days and package PDFs
        run: |
          mkdir -p out/pdfs
          python - <<'PY'
          import json,re,hashlib,zipfile,time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          OUT=Path('out'); P=OUT/'pdfs'; OUT.mkdir(exist_ok=True); P.mkdir(exist_ok=True)
          dates=['2016-02-16','2016-04-16','2016-09-01','2016-12-23','2017-04-06','2019-04-26','2020-07-16','2020-09-01','2020-11-02']
          api='https://reportapi.eastmoney.com/report/list2'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Origin':'https://data.eastmoney.com'})
          logs=[]; matches=[]
          def note(*a): x=' '.join(map(str,a)); print(x,flush=True); logs.append(x)
          for d in dates:
            for page in range(1,11):
              b={'beginTime':d,'endTime':d,'industryCode':'*','ratingChange':'*','rating':'*','orgCode':'*','code':'*','rcode':'','pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'qType':0}
              try:
                r=s.post(api,json=b,timeout=40,headers={'Content-Type':'application/json'}); o=r.json(); data=o.get('data') or []; total=int(o.get('TotalPage') or 1)
                note('DAY',d,'PAGE',page,'N',len(data),'TOTAL',total)
                for x in data:
                  blob=json.dumps(x,ensure_ascii=False)
                  if x.get('stockCode')=='002030' or x.get('stockName')=='达安基因' or '达安基因' in blob:
                    matches.append(x); note('MATCH',x.get('publishDate'),x.get('orgSName'),x.get('title'),x.get('infoCode'))
                if not data or page>=total: break
                time.sleep(.35)
              except Exception as e: note('ERR',d,page,repr(e)); break
          uniq=[]; seen=set()
          for x in matches:
            k=x.get('infoCode')
            if not k or k in seen: continue
            seen.add(k); uniq.append(x)
          (OUT/'matches.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          def clean(x,n=95): return re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x)).strip(' ._')[:n]
          got=[]; hs=set()
          for x in uniq:
            info=x['infoCode']; u=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            try:
              r=s.get(u,timeout=90,headers={'Referer':'https://data.eastmoney.com/'})
              note('PDF',r.status_code,len(r.content),r.headers.get('content-type'),u)
              if r.status_code!=200 or len(r.content)<1500 or not r.content.lstrip().startswith(b'%PDF'): continue
              h=hashlib.sha256(r.content).hexdigest()
              if h in hs: continue
              hs.add(h); tmp=P/f'tmp_{h[:12]}.pdf'; tmp.write_bytes(r.content)
              reader=PdfReader(str(tmp)); pages=len(reader.pages); text=''
              for pg in reader.pages[:4]:
                try: text+='\n'+(pg.extract_text() or '')
                except: pass
              if pages<2: tmp.unlink(); continue
              title=x.get('title') or '达安基因研报'; org=x.get('orgSName') or x.get('orgName') or '未知机构'; date=str(x.get('publishDate') or '')[:10]
              fn=f'{date}_{clean(org,30)}_{clean(title)}_{pages}页.pdf'; tmp.rename(P/fn)
              got.append({'file':fn,'title':title,'org':org,'date':date,'pages':pages,'bytes':len(r.content),'url':u,'identity':('达安基因' in text or '002030' in text),'sha256':h})
            except Exception as e: note('PDFERR',info,repr(e))
          got.sort(key=lambda x:(x['identity'],x['pages'],x['date']),reverse=True); sel=got[:3]; keep={x['file'] for x in sel}
          for f in P.glob('*.pdf'):
            if f.name not in keep: f.unlink()
          (OUT/'selected_reports.json').write_text(json.dumps(sel,ensure_ascii=False,indent=2),encoding='utf-8')
          read=['达安基因（002030）公开券商研报下载包','',f'完整 PDF：{len(sel)} 份','']+[f"{i}. {x['date']}｜{x['org']}｜{x['title']}｜{x['pages']}页" for i,x in enumerate(sel,1)]
          (OUT/'README.txt').write_text('\n'.join(read),encoding='utf-8'); (OUT/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          with zipfile.ZipFile(OUT/'达安基因_券商深度报告.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in P.glob('*.pdf'): z.write(f,f.name)
            z.write(OUT/'README.txt','README.txt'); z.write(OUT/'selected_reports.json','selected_reports.json')
          note('DONE',len(sel))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daan-gene-public-broker-reports-v6
          path: out/
          retention-days: 3
