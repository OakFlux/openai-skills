name: Build targeted Jingcheng hydrogen storage reports 20261020

on:
  push:
    paths:
      - '.github/workflows/jingcheng-600860-targeted-sector-reports-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pymupdf

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          from typing import Any
          import fitz, requests

          PACKAGE='jingcheng_600860_related_broker_deep_reports'
          ROOT=Path('京城股份_600860_相关券商深度报告_3份')
          PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in [ROOT,PDFDIR,PREV]: d.mkdir(parents=True,exist_ok=True)

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2021-07-15','2021-08-10'),
            ('2022-03-01','2022-03-20'),
            ('2022-12-01','2022-12-25'),
            ('2023-03-20','2023-04-15'),
            ('2025-05-20','2025-06-20'),
            ('2026-03-01','2026-03-25'),
          ]
          title_needles=[
            '氢储能潜力巨大','氢能应用催生千亿储运市场','小氢瓶承载大产业',
            '制储运全链多点开花','氢能开启规模化元年','船舶绿色燃料场景突破',
          ]
          rows=[]; seen=set()
          for begin,end in windows:
            total=1
            for page in range(1,80):
              if page>total: break
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'1','orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              payload=None
              for attempt in range(5):
                try:
                  r=s.get(api,params=p,timeout=(20,120))
                  if r.status_code==200: payload=r.json(); break
                except Exception: pass
                time.sleep(1+attempt)
              if payload is None: raise RuntimeError(f'API failed {begin} {page}')
              total=min(int(payload.get('TotalPage') or 1),79)
              data=payload.get('data') or []
              if isinstance(data,dict): data=data.get('list') or data.get('data') or []
              if not data: break
              for row in data:
                info=str(row.get('infoCode') or '')
                if info and info not in seen:
                  seen.add(info); rows.append(row)
              if len(data)<100: break
          matches=[]
          for row in rows:
            title=str(row.get('title') or '')
            hits=[x for x in title_needles if x in title]
            if hits:
              matches.append({'row':row,'hits':hits,'title':title,'info':str(row.get('infoCode')),'broker':str(row.get('orgSName') or row.get('orgName') or '未知机构'),'date':str(row.get('publishDate') or '')[:10],'meta_pages':int(float(row.get('attachPages') or 0))})
          print('MATCHES',json.dumps([{k:v for k,v in x.items() if k!='row'} for x in matches],ensure_ascii=False,indent=2))
          if len(matches)<3: raise RuntimeError(f'Only {len(matches)} targeted reports found')

          aliases=['京城股份','北京京城机电股份有限公司','京城机电股份','京城机电','600860','00187','北京天海工业','天海工业','北京天海氢能','天海氢能','北京天海']
          def fetch(item):
            detail=f"https://data.eastmoney.com/report/info/{item['info']}.html"
            pdf=None; url=''
            for h in ['H3','H2','H1','H4']:
              u=f"https://pdf.dfcfw.com/pdf/{h}_{item['info']}_1.pdf"
              for attempt in range(4):
                try:
                  rr=s.get(u,timeout=(30,300),headers={'User-Agent':s.headers['User-Agent'],'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'})
                  if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>80000:
                    pdf=rr.content;url=u;break
                except Exception: pass
                time.sleep(1+attempt)
              if pdf: break
            if not pdf: raise RuntimeError('download failed '+item['info'])
            doc=fitz.open(stream=pdf,filetype='pdf')
            pagehits=[]; snippets=[]; occurrences=0
            for pno in range(doc.page_count):
              text=doc.load_page(pno).get_text('text') or ''
              compact=re.sub(r'\s+','',text)
              hit={}
              for alias in aliases:
                n=compact.count(re.sub(r'\s+','',alias))
                if n:
                  hit[alias]=n;occurrences+=n
                  if len(snippets)<12:
                    pos=text.find(alias)
                    if pos>=0: snippets.append({'page':pno+1,'alias':alias,'text':' '.join(text[max(0,pos-140):pos+len(alias)+240].split())})
              if hit: pagehits.append({'page':pno+1,'hits':hit})
            pages=doc.page_count;doc.close()
            exact=any(any(a in ph['hits'] for a in ['京城股份','北京京城机电股份有限公司','京城机电股份','600860']) for ph in pagehits)
            score=(1000 if exact else 0)+len(pagehits)*180+occurrences*35+item['meta_pages']
            if '小氢瓶承载大产业' in item['title']: score+=500
            if '氢能应用催生千亿储运市场' in item['title']: score+=450
            return {**item,'pdf':pdf,'pdf_url':url,'detail':detail,'pages':pages,'pagehits':pagehits,'snippets':snippets,'occurrences':occurrences,'exact':exact,'score':score,'sha256':hashlib.sha256(pdf).hexdigest()}

          scanned=[fetch(x) for x in matches]
          scanned.sort(key=lambda x:(x['score'],x['date']),reverse=True)
          selected=[];used=set()
          for x in scanned:
            if x['broker'] in used: continue
            selected.append(x);used.add(x['broker'])
            if len(selected)==3:break
          for x in scanned:
            if len(selected)==3:break
            if x not in selected:selected.append(x)
          selected=selected[:3]

          def safe(x): return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',x))[:72]
          manifest=[]
          for i,x in enumerate(selected,1):
            name=f"{i:02d}_{safe(x['broker'])}_{safe(x['title'])}_{x['date']}.pdf"
            dest=PDFDIR/name;dest.write_bytes(x['pdf'])
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            png=Path(str(prefix)+'.png')
            if not png.exists() or png.stat().st_size<10000: raise RuntimeError('preview failed')
            row=x['row']
            manifest.append({'filename':str(Path('原始PDF')/name),'broker':x['broker'],'title':x['title'],'date':x['date'],'analysts':row.get('researcher') or row.get('author'),'pages':x['pages'],'company_mention_pages':x['pagehits'],'company_mention_occurrences':x['occurrences'],'exact_company_name_or_code_found':x['exact'],'mention_snippets':x['snippets'],'classification':('正文直接提及京城股份/京城机电/天海工业' if x['pagehits'] else '与公司主营业务高度相关的储氢瓶/氢储运行业深度报告'),'source_report_page':x['detail'],'pdf_url':x['pdf_url'],'info_code':x['info'],'sha256':x['sha256'],'preview_file':str(Path('首页预览')/png.name)})

          direct=sum(bool(x['company_mention_pages']) for x in manifest)
          readme=['京城股份（600860.SH / 00187.HK）相关券商深度报告资料包','整理日期：2026-10-20','',
            '公开数据库未检出以京城股份为唯一研究对象的券商公司深度或首次覆盖报告。',
            '本包因此收录3份与其核心业务——高压储氢瓶、复合气瓶和氢能储运——最相关的券商行业深度报告。',
            f'其中{direct}份正文直接检出京城股份、京城机电、天海工业或相关证券代码；每份命中页码与上下文见manifest.json。','']
          for i,x in enumerate(manifest,1):
            pages=', '.join(str(p['page']) for p in x['company_mention_pages']) or '未检出'
            readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；分析师：{x['analysts']}；页数：{x['pages']}",f"   分类：{x['classification']}；公司命中页：{pages}",f"   文件：{x['filename']}",f"   来源：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。','已核验PDF文件头、页数、qpdf结构、首页渲染、全文公司别名及ZIP CRC。']
          (ROOT/'00_文件清单与重要说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')
          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file():z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip();pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3:raise RuntimeError(f'zip bad={bad} pdfs={len(pdfs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('DIRECT_MENTION_REPORTS',direct)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jingcheng-600860-targeted-related-reports-final
          path: jingcheng_600860_related_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
