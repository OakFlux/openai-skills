name: Discover Makeng Mining broker reports

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-broker-report-discovery-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Scan Eastmoney and test candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, re, requests, time
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          api='https://reportapi.eastmoney.com/report/list'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=4,connect=4,read=4,status=4,backoff_factor=.6,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)))

          windows=[('2026-08-15','2026-08-31'),('2026-10-20','2026-10-26')]
          matches={}
          for begin,end in windows:
            for qtype in ('0','1','2'):
              for page in range(1,21):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(api,params=params,timeout=60)
                  print('GLOBAL',begin,end,qtype,page,r.status_code,len(r.content),flush=True)
                  r.raise_for_status(); data=r.json(); rows=data.get('data') or []; hits=int(data.get('hits') or 0)
                  if page==1: print('META',json.dumps({'begin':begin,'end':end,'qType':qtype,'hits':hits,'rows':len(rows)},ensure_ascii=False),flush=True)
                  for x in rows:
                    blob='|'.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName'))
                    if '马矿股份' in blob or '601123' in blob:
                      info=str(x.get('infoCode') or '')
                      matches[info]=x
                      print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                  if not rows or page*100>=hits: break
                  time.sleep(.08)
                except Exception as e:
                  print('GLOBAL_ERROR',begin,end,qtype,page,repr(e),flush=True); break

          # Probe code-filter variants.
          variants=[
            {'code':'601123'},
            {'stockCode':'601123'},
            {'stockName':'马矿股份'},
            {'searchKey':'马矿股份'},
          ]
          for begin,end in windows:
            for qtype in ('0','1','2'):
              for extra in variants:
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1',**extra}
                try:
                  r=s.get(api,params=params,timeout=45); data=r.json(); rows=data.get('data') or []
                  if rows or data.get('hits'): print('VARIANT_META',json.dumps({'begin':begin,'end':end,'qType':qtype,'extra':extra,'hits':data.get('hits'),'rows':len(rows)},ensure_ascii=False),flush=True)
                  for x in rows:
                    blob='|'.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName'))
                    if '马矿股份' in blob or '601123' in blob:
                      info=str(x.get('infoCode') or '')
                      matches[info]=x
                      print('MATCH_VARIANT',json.dumps(x,ensure_ascii=False),flush=True)
                except Exception as e: print('VARIANT_ERROR',begin,end,qtype,extra,repr(e),flush=True)

          known=['AP202608291828704120']
          for info in list(matches)+known:
            for prefix in ('H3','H2'):
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
              try:
                r=s.get(url,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=60)
                print('PDF_TEST',url,r.status_code,len(r.content),r.headers.get('content-type'),flush=True)
                if r.status_code==200 and r.content.startswith(b'%PDF'):
                  reader=PdfReader(io.BytesIO(r.content),strict=False)
                  pages=len(reader.pages)
                  text=''
                  for i in range(min(4,pages)):
                    try: text += reader.pages[i].extract_text() or ''
                    except Exception: pass
                  print('PDF_OK',json.dumps({'infoCode':info,'prefix':prefix,'url':url,'pages':pages,'text':re.sub(r'\s+',' ',text)[:500]},ensure_ascii=False),flush=True)
              except Exception as e: print('PDF_ERROR',url,repr(e),flush=True)

          print('FINAL_MATCH_COUNT',len(matches),flush=True)
          for info,x in matches.items():
            print('FINAL_MATCH',info,json.dumps(x,ensure_ascii=False),flush=True)
          PY
