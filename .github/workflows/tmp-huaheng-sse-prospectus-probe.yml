name: Temporary Huaheng SSE prospectus probe

on:
  push:
    branches:
      - tmp/huaheng-biotech-filings-20260830
    paths:
      - .github/workflows/tmp-huaheng-sse-prospectus-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Query SSE bulletin API
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Referer':'https://www.sse.com.cn/','Accept':'application/json,text/javascript,*/*;q=0.01'})
          url='https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          param_sets=[
            {'isPagination':'true','productId':'688639','keyWord':'招股说明书','securityType':'0101,120100,020100,020200,120200','reportType2':'DQBG','reportType':'ALL','beginDate':'2021-03-01','endDate':'2021-04-30','pageHelp.pageSize':'100','pageHelp.pageCount':'50','pageHelp.pageNo':'1','pageHelp.beginPage':'1','pageHelp.cacheSize':'1','pageHelp.endPage':'5'},
            {'isPagination':'true','productId':'688639','keyWord':'','securityType':'0101,120100,020100,020200,120200','reportType2':'DQBG','reportType':'ALL','beginDate':'2021-03-01','endDate':'2021-04-30','pageHelp.pageSize':'100','pageHelp.pageCount':'50','pageHelp.pageNo':'1','pageHelp.beginPage':'1','pageHelp.cacheSize':'1','pageHelp.endPage':'5'},
            {'isPagination':'true','productId':'688639','keyWord':'','securityType':'0101,120100,020100,020200,120200','reportType2':'','reportType':'ALL','beginDate':'2021-03-01','endDate':'2021-04-30','pageHelp.pageSize':'100','pageHelp.pageCount':'50','pageHelp.pageNo':'1','pageHelp.beginPage':'1','pageHelp.cacheSize':'1','pageHelp.endPage':'5'},
          ]
          for i,p in enumerate(param_sets,1):
            try:
              r=s.get(url,params=p,timeout=60)
              print('PROBE',i,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
              print(r.text[:20000])
            except Exception as e:
              print('ERROR',i,repr(e))
          PY
