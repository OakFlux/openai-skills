name: Query Guoji Zhongzhuang Eastmoney reports fast 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-eastmoney-report-list-fast-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query report API
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/601399.html'})
          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2026-10-16','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'601399','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          for ep in ['https://reportapi.eastmoney.com/report/list','https://reportapi.eastmoney.com/report/list2']:
            try:
              r=s.get(ep,params=params,timeout=15); print('EP',ep,'STATUS',r.status_code,'LEN',len(r.content),'URL',r.url)
              raw=r.text.strip(); print('RAWHEAD',repr(raw[:200]))
              if raw.startswith('datatable') and '(' in raw: raw=raw[raw.find('(')+1:raw.rfind(')')]
              obj=json.loads(raw); print('HITS',obj.get('hits'),'SIZE',obj.get('size'))
              for rec in obj.get('data') or []:
                print('REPORT',json.dumps(rec,ensure_ascii=False,sort_keys=True))
            except Exception as e: print('ERR',ep,repr(e))
          PY
