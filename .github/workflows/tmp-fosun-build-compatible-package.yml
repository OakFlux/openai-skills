name: Temporary Fosun International compatible report package

on:
  push:
    branches:
      - tmp/fosun-international-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-build-compatible-package.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests Pillow img2pdf PyMuPDF
      - name: Download all public report pages and rebuild PDFs
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import os
          import shutil
          import time
          import zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          import img2pdf
          import pymupdf
          import requests
          from PIL import Image

          reports = [
              {
                  'filename': '01_Northeast_Securities_2024-11-15_Fosun_International_Deep_Report_54p.pdf',
                  'broker': '东北证券',
                  'date': '2024-11-15',
                  'title': '瘦身健体再出发，科技创新与全球化布局驱动成长',
                  'pages': 54,
                  'base': 'https://oss.sdyanbao.com/page/2024/11/25/1120507',
              },
              {
                  'filename': '02_Kaiyuan_Securities_2023-05-08_Fosun_International_Initiation_43p.pdf',
                  'broker': '开源证券',
                  'date': '2023-05-08',
                  'title': '瘦身调整聚焦主业，创新协同提供增量',
                  'pages': 43,
                  'base': 'https://oss.sdyanbao.com/page/2023/5/9/537648',
              },
              {
                  'filename': '03_Zheshang_Securities_2023-07-17_Fosun_International_Initiation_39p.pdf',
                  'broker': '浙商证券',
                  'date': '2023-07-17',
                  'title': '消费旗舰三十年乘风破浪，聚焦主业再扬帆',
                  'pages': 39,
                  'base': 'https://oss.sdyanbao.com/page/2023/7/19/572792',
              },
          ]

          root = Path('fosun_compatible_package')
          pdf_dir = root / 'Fosun_International_Broker_Reports_3'
          image_root = root / '_images'
          root.mkdir(exist_ok=True)
          pdf_dir.mkdir(exist_ok=True)
          image_root.mkdir(exist_ok=True)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Referer': 'https://www.sdyanbao.com/',
              'Origin': 'https://www.sdyanbao.com',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          }

          def download_page(report: dict, report_dir: Path, index: int) -> tuple[int, str, int, tuple[int, int]]:
              url = f"{report['base']}/{index}.png"
              last_error = None
              for attempt in range(1, 7):
                  try:
                      response = requests.get(url, headers=headers, timeout=45)
                      response.raise_for_status()
                      data = response.content
                      if len(data) < 10_000:
                          raise RuntimeError(f'page payload too small: {len(data)} bytes')
                      with Image.open(io.BytesIO(data)) as image:
                          image.load()
                          width, height = image.size
                          if width < 700 or height < 600:
                              raise RuntimeError(f'invalid image dimensions: {width}x{height}')
                          if image.mode not in ('RGB', 'L'):
                              image = image.convert('RGB')
                          path = report_dir / f'{index:04d}.png'
                          image.save(path, format='PNG', optimize=False)
                      return index, str(path), len(data), (width, height)
                  except Exception as exc:
                      last_error = exc
                      time.sleep(min(1.5 * attempt, 8))
              raise RuntimeError(f'failed to download page {index + 1} from {url}: {last_error!r}')

          manifest = []
          for report_number, report in enumerate(reports, start=1):
              report_dir = image_root / f'report_{report_number:02d}'
              report_dir.mkdir(exist_ok=True)
              print(f"Downloading {report['broker']} report: {report['pages']} pages")
              with ThreadPoolExecutor(max_workers=10) as executor:
                  futures = [executor.submit(download_page, report, report_dir, index) for index in range(report['pages'])]
                  results = []
                  for future in as_completed(futures):
                      result = future.result()
                      results.append(result)
                      if len(results) % 10 == 0 or len(results) == report['pages']:
                          print(f"  completed {len(results)}/{report['pages']} pages")

              image_paths = [report_dir / f'{index:04d}.png' for index in range(report['pages'])]
              missing = [str(path) for path in image_paths if not path.exists()]
              if missing:
                  raise RuntimeError(f'missing page images: {missing[:10]}')

              output_pdf = pdf_dir / report['filename']
              with output_pdf.open('wb') as handle:
                  handle.write(img2pdf.convert([str(path) for path in image_paths]))

              document = pymupdf.open(str(output_pdf))
              actual_pages = document.page_count
              first_page = document.load_page(0).get_pixmap(matrix=pymupdf.Matrix(0.35, 0.35), alpha=False)
              middle_page = document.load_page(actual_pages // 2).get_pixmap(matrix=pymupdf.Matrix(0.25, 0.25), alpha=False)
              last_page = document.load_page(actual_pages - 1).get_pixmap(matrix=pymupdf.Matrix(0.25, 0.25), alpha=False)
              validation_bytes = len(first_page.samples) + len(middle_page.samples) + len(last_page.samples)
              document.close()
              if actual_pages != report['pages']:
                  raise RuntimeError(f"page count mismatch for {output_pdf}: expected {report['pages']}, got {actual_pages}")
              if validation_bytes < 100_000:
                  raise RuntimeError(f'render validation failed for {output_pdf}')

              digest = hashlib.sha256(output_pdf.read_bytes()).hexdigest()
              manifest.append({
                  'index': report_number,
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'pages': actual_pages,
                  'filename': report['filename'],
                  'size_bytes': output_pdf.stat().st_size,
                  'sha256': digest,
                  'source_page_base': report['base'],
                  'format_note': 'Rebuilt as a page-image PDF from publicly accessible complete report pages.',
              })
              shutil.rmtree(report_dir)

          readme_lines = [
              '复星国际（00656.HK）券商深度报告，共3份',
              '',
              '为提高浏览器和系统兼容性，压缩包及PDF均使用英文文件名。',
              'PDF由公开可访问的完整报告页面逐页重建，实际页数已经核验。',
              '',
          ]
          for item in manifest:
              readme_lines.extend([
                  f"{item['index']}. {item['broker']}｜{item['date']}｜{item['pages']}页",
                  f"   {item['title']}",
                  f"   文件：{item['filename']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ])
          (pdf_dir / 'README_CN.txt').write_text('\n'.join(readme_lines), encoding='utf-8')
          (pdf_dir / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = root / 'Fosun_International_Broker_Reports_3.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(pdf_dir.iterdir()):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              names = archive.namelist()
              if bad is not None:
                  raise RuntimeError(f'ZIP integrity test failed at {bad}')
              if len([name for name in names if name.lower().endswith('.pdf')]) != 3:
                  raise RuntimeError(f'ZIP does not contain exactly 3 PDFs: {names}')

          (root / 'build_summary.json').write_text(json.dumps({
              'zip_filename': zip_path.name,
              'zip_size_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'reports': manifest,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print((root / 'build_summary.json').read_text(encoding='utf-8'))
          PY
      - name: Upload rebuilt download package
        uses: actions/upload-artifact@v4
        with:
          name: Fosun_International_Broker_Reports_3
          path: fosun_compatible_package/Fosun_International_Broker_Reports_3.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload build verification
        uses: actions/upload-artifact@v4
        with:
          name: Fosun_International_Broker_Reports_3_Verification
          path: fosun_compatible_package/build_summary.json
          retention-days: 1
          if-no-files-found: error
