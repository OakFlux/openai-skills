name: Build Qingdao Food 001219 all annual reports prospectus latest quarter 20261028

on:
  push:
    paths:
      - '.github/workflows/qingdao-food-001219-all-annual-reports-prospectus-latest-quarter-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          TODAY = '2026-10-28'
          STOCK_CODE = '001219'
          OLD_STOCK_CODE = '872387'
          COMPANY_SHORT = '青岛食品'
          COMPANY_FULL = '青岛食品股份有限公司'
          PACKAGE = '青岛食品_001219_全部年报_招股说明书_最新季报'
          EXPECTED_ANNUAL_YEARS = list(range(2017, 2026))

          WORK = Path('qingdao_food_work')
          FINAL = WORK / 'final'
          VERIFY = WORK / 'verification_renders'
          ARTIFACT = Path('artifact_out')
          for directory in (FINAL, VERIFY, ARTIFACT):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          announcement_api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows: list[dict[str, Any]] = []
          page_log: list[dict[str, Any]] = []
          seen: set[str] = set()

          for page in range(1, 81):
              params = {
                  'sr': '-1',
                  'page_size': '100',
                  'page_index': str(page),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': STOCK_CODE,
                  'f_node': '0',
                  's_node': '0',
              }
              payload = None
              last: Any = None
              for attempt in range(1, 8):
                  try:
                      response = session.get(announcement_api, params=params, timeout=(20, 120))
                      last = {'status': response.status_code, 'bytes': len(response.content), 'head': response.text[:160]}
                      if response.status_code == 200:
                          payload = response.json()
                          break
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(attempt)
              if payload is None:
                  raise RuntimeError(f'Announcement API failed on page {page}: {last}')
              rows = ((payload.get('data') or {}).get('list') or [])
              page_log.append({'page': page, 'count': len(rows)})
              if not rows:
                  break
              new_count = 0
              for row in rows:
                  art = str(row.get('art_code') or row.get('artCode') or '')
                  key = art or json.dumps(row, ensure_ascii=False, sort_keys=True)
                  if key in seen:
                      continue
                  seen.add(key)
                  all_rows.append(row)
                  new_count += 1
              if len(rows) < 100 or new_count == 0:
                  break
              time.sleep(0.1)

          if not all_rows:
              raise RuntimeError('No announcement metadata returned')

          def compact(value: Any) -> str:
              return re.sub(r'\s+', '', str(value or '')).replace('&nbsp;', '')

          def row_title(row: dict[str, Any]) -> str:
              return compact(row.get('title'))

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '').strip()

          def row_date(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or row.get('notice_date') or '')

          annual_excluded = [
              '摘要', '英文版', '取消版', '已取消', '问询函', '回复函', '审计报告',
              '董事会', '监事会', '更正公告', '提示性公告', '社会责任报告',
              '环境、社会及管治报告', '可持续发展报告', '内部控制评价报告',
              '财务决算报告', '年度报告说明会', '网上说明会', '业绩说明会',
              '募集资金', '会计师事务所', '前期会计差错更正后的财务报表',
              '财务报表及相关附注', '关于召开', '独立董事述职', '业绩预告', '业绩快报',
              '补充更正公告', '补充公告',
          ]

          def choose_annual(year: int) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              variants = [f'{year}年年度报告', f'{year}年度报告']
              candidates: list[tuple[int, str, dict[str, Any], str]] = []
              for row in all_rows:
                  title = row_title(row)
                  matched = next((v for v in variants if compact(v) in title), None)
                  if not matched:
                      continue
                  if any(compact(term) in title for term in annual_excluded):
                      continue
                  score = 100
                  key = compact(matched)
                  if title == key:
                      score += 80
                  if title.endswith(key):
                      score += 60
                  if COMPANY_SHORT in title or COMPANY_FULL in title:
                      score += 30
                  if any(term in title for term in ['更正后', '修订版', '更新后', '修订稿']):
                      score += 160
                  if '报告全文' in title:
                      score += 30
                  candidates.append((score, row_date(row), row, matched))
              candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
              log = [
                  {'year': year, 'score': score, 'date': date, 'title': row.get('title'),
                   'art_code': art_code(row), 'matched_variant': matched}
                  for score, date, row, matched in candidates[:20]
              ]
              if not candidates:
                  near = [
                      {'title': r.get('title'), 'date': row_date(r), 'art_code': art_code(r)}
                      for r in all_rows if str(year) in row_title(r) and '年度' in row_title(r)
                  ][:40]
                  raise RuntimeError(f'Missing annual report for {year}; near={json.dumps(near, ensure_ascii=False)}')
              return candidates[0][2], log

          selected: list[dict[str, Any]] = []
          candidate_logs: dict[str, Any] = {}

          for order, year in enumerate(EXPECTED_ANNUAL_YEARS, 1):
              row, log = choose_annual(year)
              candidate_logs[f'{year}年年度报告'] = log
              selected.append({
                  'order': order,
                  'period': str(year),
                  'report_label': f'{year}年年度报告',
                  'doc_type': '年度报告',
                  'filename': f'{order:02d}_青岛食品_{year}年年度报告.pdf',
                  'min_pages': 60,
                  'row': row,
              })

          prospectus_candidates: list[tuple[int, str, dict[str, Any]]] = []
          prospectus_log: list[dict[str, Any]] = []
          for row in all_rows:
              title = row_title(row)
              if '招股说明书' not in title:
                  continue
              if any(term in title for term in ['摘要', '意向书', '申报稿', '注册稿', '上市公告书', '发行公告', '网上路演', '问询', '回复']):
                  continue
              score = 100
              if '首次公开发行股票招股说明书' in title:
                  score += 150
              if COMPANY_SHORT in title or COMPANY_FULL in title:
                  score += 30
              if any(term in title for term in ['更新后', '修订版', '更正后']):
                  score += 50
              prospectus_candidates.append((score, row_date(row), row))
          prospectus_candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
          prospectus_log = [
              {'score': score, 'date': date, 'title': row.get('title'), 'art_code': art_code(row)}
              for score, date, row in prospectus_candidates[:30]
          ]
          candidate_logs['正式招股说明书'] = prospectus_log
          if not prospectus_candidates:
              near = [
                  {'title': r.get('title'), 'date': row_date(r), 'art_code': art_code(r)}
                  for r in all_rows if '招股' in row_title(r)
              ][:50]
              raise RuntimeError(f'Formal prospectus not found; near={json.dumps(near, ensure_ascii=False)}')
          prospectus_row = prospectus_candidates[0][2]
          selected.append({
              'order': len(selected) + 1,
              'period': 'IPO',
              'report_label': '首次公开发行股票招股说明书',
              'doc_type': '招股说明书',
              'filename': f'{len(selected)+1:02d}_青岛食品_首次公开发行股票招股说明书.pdf',
              'min_pages': 250,
              'row': prospectus_row,
          })

          quarter_candidates: list[tuple[int, int, str, dict[str, Any], str]] = []
          quarter_patterns = [
              (re.compile(r'(20\d{2})年第三季度报告'), 3, '第三季度报告'),
              (re.compile(r'(20\d{2})年三季度报告'), 3, '第三季度报告'),
              (re.compile(r'(20\d{2})年第一季度报告'), 1, '第一季度报告'),
              (re.compile(r'(20\d{2})年一季度报告'), 1, '第一季度报告'),
          ]
          for row in all_rows:
              title = row_title(row)
              if any(term in title for term in ['摘要', '更正公告', '提示性公告', '董事会', '监事会']):
                  continue
              for pattern, quarter_no, normalized_label in quarter_patterns:
                  match = pattern.search(title)
                  if not match:
                      continue
                  year = int(match.group(1))
                  period_rank = year * 10 + quarter_no
                  score = 100
                  if COMPANY_SHORT in title or COMPANY_FULL in title:
                      score += 20
                  if any(term in title for term in ['更正后', '修订版', '更新后']):
                      score += 80
                  quarter_candidates.append((period_rank, score, row_date(row), row, f'{year}年{normalized_label}'))
                  break
          quarter_candidates.sort(key=lambda item: (item[0], item[1], item[2]), reverse=True)
          candidate_logs['季度报告候选'] = [
              {'period_rank': rank, 'score': score, 'date': date, 'title': row.get('title'),
               'art_code': art_code(row), 'normalized_label': label}
              for rank, score, date, row, label in quarter_candidates[:30]
          ]
          if not quarter_candidates:
              raise RuntimeError('No independent quarterly report found')
          _, _, _, quarter_row, quarter_label = quarter_candidates[0]
          selected.append({
              'order': len(selected) + 1,
              'period': quarter_label[:4] + ('Q3' if '第三季度' in quarter_label else 'Q1'),
              'report_label': quarter_label,
              'doc_type': '季度报告',
              'filename': f'{len(selected)+1:02d}_青岛食品_{quarter_label}.pdf',
              'min_pages': 5,
              'row': quarter_row,
          })

          def pdf_candidate_urls(art: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art}_01.pdf',
              ]

          def download_pdf(art: str, detail_page: str) -> tuple[bytes, str, dict[str, Any]]:
              last: dict[str, Any] = {}
              for url in pdf_candidate_urls(art):
                  for attempt in range(1, 7):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 420),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': detail_page,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'requested_url': url,
                              'final_url': str(response.url),
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                          }
                          if response.status_code == 200 and response.content.startswith(b'%PDF-') and len(response.content) > 30_000:
                              return response.content, str(response.url), last
                      except Exception as exc:
                          last = {'requested_url': url, 'error': repr(exc)}
                      time.sleep(attempt)
              raise RuntimeError(f'PDF download failed for {art}: {last}')

          manifest: list[dict[str, Any]] = []
          identity_tokens = [COMPANY_SHORT, COMPANY_FULL, STOCK_CODE, OLD_STOCK_CODE, 'QINGDAO FOODS']

          for item_raw in selected:
              item = dict(item_raw)
              row = item.pop('row')
              art = art_code(row)
              if not art:
                  raise RuntimeError(f'Missing art code: {item["filename"]}')
              detail_page = f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html'
              pdf_bytes, resolved_url, download_meta = download_pdf(art, detail_page)
              destination = FINAL / item['filename']
              destination.write_bytes(pdf_bytes)

              reader = PdfReader(str(destination), strict=False)
              page_count = len(reader.pages)
              if page_count < item['min_pages']:
                  raise RuntimeError(f'Page count too small: {destination.name} = {page_count}')

              sample_indices = list(range(min(25, page_count)))
              if page_count > 2:
                  sample_indices.extend([page_count - 2, page_count - 1])
              extracted_parts: list[str] = []
              for page_index in dict.fromkeys(sample_indices):
                  try:
                      extracted_parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              extracted = '\n'.join(extracted_parts)
              identity_ok = any(token in extracted for token in identity_tokens)
              if not identity_ok:
                  txt_path = VERIFY / f'{item["order"]:02d}.txt'
                  subprocess.run(
                      ['pdftotext', '-f', '1', '-l', str(min(30, page_count)), str(destination), str(txt_path)],
                      check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  )
                  extracted += '\n' + txt_path.read_text(encoding='utf-8', errors='ignore')
                  identity_ok = any(token in extracted for token in identity_tokens)
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {destination.name}')

              if item['doc_type'] == '年度报告':
                  period_ok = item['period'] in extracted and ('年度报告' in extracted or '年度 报告' in extracted or 'Annual Report' in extracted)
              elif item['doc_type'] == '招股说明书':
                  period_ok = '招股说明书' in extracted and ('首次公开发行股票' in extracted or '首次公开发行' in extracted)
              else:
                  year_token = item['period'][:4]
                  quarter_token = '第三季度' if item['period'].endswith('Q3') else '第一季度'
                  period_ok = year_token in extracted and (quarter_token in extracted or '季度报告' in extracted or '三季度' in extracted or '一季度' in extracted)
              if not period_ok:
                  raise RuntimeError(f'Document-type/period text check failed: {destination.name}')

              qpdf = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf check failed: {destination.name}: {qpdf.stdout[-1200:]}')

              first_prefix = VERIFY / f'{item["order"]:02d}_first'
              last_prefix = VERIFY / f'{item["order"]:02d}_last'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '120', '-singlefile', str(destination), str(first_prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              subprocess.run(
                  ['pdftoppm', '-f', str(page_count), '-l', str(page_count), '-png', '-r', '95', '-singlefile', str(destination), str(last_prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              first_png = Path(str(first_prefix) + '.png')
              last_png = Path(str(last_prefix) + '.png')
              if not first_png.exists() or first_png.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page render failed: {destination.name}')
              if not last_png.exists() or last_png.stat().st_size < 3_000:
                  raise RuntimeError(f'Last-page render failed: {destination.name}')

              sha = hashlib.sha256(pdf_bytes).hexdigest()
              manifest.append({
                  **item,
                  'announcement_title': row.get('title'),
                  'announcement_date': row_date(row),
                  'art_code': art,
                  'announcement_detail_page': detail_page,
                  'pdf_source_url': resolved_url,
                  'official_cninfo_index': f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK_CODE}',
                  'official_szse_profile': f'https://www.szse.cn/market/product/stock/list/index.html?code={STOCK_CODE}',
                  'actual_pages': page_count,
                  'bytes': len(pdf_bytes),
                  'sha256': sha,
                  'identity_text_check': identity_ok,
                  'document_type_period_check': period_ok,
                  'download_meta': download_meta,
                  'validation': ['PDF header', 'issuer identity', 'document type/period', 'minimum page count', 'qpdf structure', 'first-page render', 'last-page render'],
              })
              print('VALIDATED', json.dumps(manifest[-1], ensure_ascii=False), flush=True)

          expected_count = len(EXPECTED_ANNUAL_YEARS) + 2
          if len(manifest) != expected_count:
              raise RuntimeError(f'Expected {expected_count} PDF files, got {len(manifest)}')
          if len({item['sha256'] for item in manifest}) != len(manifest):
              raise RuntimeError('Duplicate PDF content detected')

          annual_years = [int(item['period']) for item in manifest if item['doc_type'] == '年度报告']
          if annual_years != EXPECTED_ANNUAL_YEARS:
              raise RuntimeError(f'Annual year coverage mismatch: {annual_years}')

          latest_quarter = next(item for item in manifest if item['doc_type'] == '季度报告')
          readme_lines = [
              '青岛食品股份有限公司（001219.SZ；新三板时期代码872387）全部公开年度报告、正式招股说明书及最新季报资料包',
              f'整理日期：{TODAY}',
              '',
              '年度报告口径：收录公司自新三板挂牌后公开披露的2017—2025年度报告全文，共9份；对同一年度存在后续更正、修订或重新披露版本的，优先采用后续完整版本。',
              '招股说明书口径：收录2021年首次公开发行股票正式招股说明书，排除招股意向书、摘要、申报稿、注册稿、发行公告和上市公告书。',
              f'最新季报口径：截至整理日识别的最新独立季度报告为{latest_quarter["report_label"]}。',
              '未使用年度报告摘要、审计报告、业绩快报、网页摘要或缺页预览替代正文。',
              '',
              '文件清单：',
          ]
          for index, item in enumerate(manifest, 1):
              readme_lines.extend([
                  f'{index}. {item["filename"]}',
                  f'   类型：{item["doc_type"]}；报告期/文件：{item["report_label"]}',
                  f'   公告标题：{item["announcement_title"]}',
                  f'   公告日期：{item["announcement_date"]}；实际页数：{item["actual_pages"]}页',
                  f'   公告页面：{item["announcement_detail_page"]}',
                  f'   PDF来源：{item["pdf_source_url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ])
          readme_lines.extend([
              '核验说明：',
              '- 每份PDF均核对公司名称或证券代码、文件类型/报告期、实际页数和PDF结构。',
              '- 每份PDF均完成首页和末页渲染检查，并排除重复文件。',
              '- 最终ZIP已执行CRC完整性检查。',
          ])

          (FINAL / '00_文件清单与来源说明.txt').write_text('\n'.join(readme_lines), encoding='utf-8')
          (FINAL / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / '候选公告筛选记录.json').write_text(json.dumps(candidate_logs, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / '公告检索分页记录.json').write_text(json.dumps(page_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_path = ARTIFACT / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(FINAL.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad_member = archive.testzip()
              if bad_member:
                  raise RuntimeError(f'ZIP CRC failure: {bad_member}')
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != expected_count:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdf_names)} vs {expected_count}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', expected_count, 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: qingdao-food-001219-all-annual-reports-prospectus-latest-quarter-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
