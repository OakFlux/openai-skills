name: Build Shaanxi Jinye 000812 reports package v2

on:
  push:
    branches:
      - tmp-shaanxi-jinye-000812-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='陕西金叶_000812_2020-2025年报及最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/shaanxi_jinye_render

          python3 - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          OUT = Path('陕西金叶_000812_2020-2025年报及最新季报')
          API = 'https://np-anotice-stock.eastmoney.com/api/security/ann'

          fallback_urls = {
              2020: 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-30/7209409.PDF',
              2021: 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2022/2022-4/2022-04-28/8128984.PDF',
              2022: 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-29/9183845.PDF',
              2023: 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-26/10086925.PDF',
              2024: 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-25/10971792.PDF',
              2025: 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-24/12174937.PDF',
          }

          def new_session() -> requests.Session:
              s = requests.Session()
              s.trust_env = False
              s.mount('https://', HTTPAdapter(max_retries=Retry(
                  total=3, connect=3, read=3, status=3,
                  backoff_factor=0.7,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET'], raise_on_status=False,
              )))
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              })
              return s

          # Discover the current announcement IDs from Eastmoney's public announcement index.
          session = new_session()
          rows: list[dict] = []
          for page in range(1, 11):
              response = session.get(
                  API,
                  params={
                      'sr': '-1', 'page_size': '100', 'page_index': str(page),
                      'ann_type': 'A', 'client_source': 'web', 'stock_list': '000812',
                  },
                  headers={'Referer': 'https://data.eastmoney.com/'},
                  timeout=(15, 90),
              )
              response.raise_for_status()
              page_rows = ((response.json().get('data') or {}).get('list') or [])
              if not page_rows:
                  break
              rows.extend(page_rows)
              print('ANNOUNCEMENT_PAGE', page, 'ROWS', len(page_rows))
              if len(page_rows) < 100:
                  break

          if not rows:
              raise RuntimeError('Announcement index returned no records')

          def title_of(row: dict) -> str:
              return re.sub(r'\s+', '', str(row.get('title') or row.get('title_ch') or ''))

          docs: list[dict] = []
          for order, year in enumerate(range(2020, 2026), start=1):
              key = f'{year}年年度报告'
              candidates = [
                  row for row in rows
                  if key in title_of(row)
                  and '摘要' not in title_of(row)
                  and '英文版' not in title_of(row)
                  and '一张图' not in title_of(row)
                  and '提示性公告' not in title_of(row)
              ]
              candidates.sort(
                  key=lambda row: str(row.get('display_time') or row.get('notice_date') or ''),
                  reverse=True,
              )
              selected = candidates[0] if candidates else None
              art_code = str((selected or {}).get('art_code') or '')
              display_time = str((selected or {}).get('display_time') or '')
              notice_date = str((selected or {}).get('notice_date') or '')
              date = (display_time or notice_date)[:10]
              docs.append({
                  'order': order,
                  'year': year,
                  'kind': 'annual',
                  'title': f'{year}年年度报告',
                  'date': date,
                  'filename': f'{order:02d}_陕西金叶_{year}年年度报告.pdf',
                  'min_pages': 80,
                  'art_code': art_code,
                  'fallback': fallback_urls[year],
              })
              print('SELECT_ANNUAL', year, art_code, title_of(selected or {}), date)

          q3_candidates = [
              row for row in rows
              if ('2026年三季度报告' in title_of(row) or '2026年第三季度报告' in title_of(row))
              and '一张图' not in title_of(row)
              and '提示性公告' not in title_of(row)
          ]
          q3_candidates.sort(
              key=lambda row: str(row.get('display_time') or row.get('notice_date') or ''),
              reverse=True,
          )
          if not q3_candidates:
              raise RuntimeError('Could not find the 2026 third-quarter report in announcement index')
          q3 = q3_candidates[0]
          q3_art = str(q3.get('art_code') or '')
          q3_date = str(q3.get('display_time') or q3.get('notice_date') or '')[:10]
          docs.append({
              'order': 7,
              'year': 2026,
              'kind': 'quarter',
              'title': '2026年第三季度报告',
              'date': q3_date,
              'filename': '07_陕西金叶_2026年第三季度报告.pdf',
              'min_pages': 5,
              'art_code': q3_art,
              'fallback': 'https://pdf.dfcfw.com/pdf/H2_AN202610281831103664_1.pdf',
          })
          print('SELECT_Q3', q3_art, title_of(q3), q3_date)

          def extract_sample(reader: PdfReader) -> str:
              pages = len(reader.pages)
              indexes = list(range(min(20, pages)))
              if pages > 20:
                  indexes.append(pages - 1)
              chunks: list[str] = []
              for idx in dict.fromkeys(indexes):
                  try:
                      chunks.append(reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              return re.sub(r'\s+', '', '\n'.join(chunks))

          def validate_pdf(path: Path, doc: dict) -> int:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < int(doc['min_pages']):
                  raise RuntimeError(f'{doc["title"]}: page count {pages} below minimum')
              compact = extract_sample(reader)
              if '陕西金叶' not in compact and '陕西金叶科教集团股份有限公司' not in compact:
                  raise RuntimeError(f'{doc["title"]}: company name mismatch')
              if doc['kind'] == 'annual':
                  year = str(doc['year'])
                  if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                      raise RuntimeError(f'{doc["title"]}: report title mismatch')
                  if '年度报告摘要' in compact[:1000]:
                      raise RuntimeError(f'{doc["title"]}: summary received instead of full report')
              else:
                  if ('第三季度报告' not in compact and '三季度报告' not in compact) or '2026' not in compact:
                      raise RuntimeError('2026 Q3 report title mismatch')
              return pages

          def download_one(doc: dict) -> dict:
              s = new_session()
              art = doc['art_code']
              urls: list[str] = []
              if art:
                  urls.extend([
                      f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                  ])
              urls.append(doc['fallback'])
              urls = list(dict.fromkeys(urls))
              last: Exception | None = None
              destination = OUT / doc['filename']
              for url in urls:
                  for attempt in range(3):
                      try:
                          response = s.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(20, 180),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(
                                  f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          pages = validate_pdf(destination, doc)
                          sha = hashlib.sha256(data).hexdigest()
                          result = {
                              **doc,
                              'pages': pages,
                              'bytes': len(data),
                              'source': response.url,
                              'sha256': sha,
                          }
                          print('DOWNLOADED', doc['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return result
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('DOWNLOAD_FAILED', doc['title'], url, repr(exc))
                          time.sleep(0.8 + attempt)
              raise RuntimeError(f'Could not download {doc["title"]}: {last!r}')

          records: list[dict] = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as executor:
              futures = {executor.submit(download_one, doc): doc for doc in docs}
              for future in concurrent.futures.as_completed(futures):
                  records.append(future.result())
          records.sort(key=lambda item: item['order'])

          manifest = [
              '陕西金叶（000812）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：',
              '1. 2020-2025年度报告全文，共6份，不含年度报告摘要。',
              '2. 最新季报为2026年10月28日披露的2026年第三季度报告。',
              '3. 文件均为公开披露PDF原件，并通过公司名称、报告期、页数、PDF结构及首末页渲染检查。',
              '',
              '文件清单：',
          ]
          sums: list[str] = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              manifest += [
                  f"{item['order']}. {item['filename']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   公告编号：{item['art_code'] or '未检索到，采用公告镜像'}",
                  f"   原始PDF：{item['source']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          manifest += [
              f'合计：7份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(manifest))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '陕西金叶|陕西金叶科教集团股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/shaanxi_jinye_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/shaanxi_jinye_test.zip "$PACKAGE"
          unzip -t /tmp/shaanxi_jinye_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/shaanxi_jinye_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/shaanxi_jinye_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Shaanxi-Jinye-000812-2020-2025-annual-reports-latest-quarter-v2
          path: 陕西金叶_000812_2020-2025年报及最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
