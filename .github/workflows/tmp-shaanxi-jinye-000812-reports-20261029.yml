name: Build Shaanxi Jinye 000812 reports package

on:
  push:
    branches:
      - tmp-shaanxi-jinye-000812-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='陕西金叶_000812_2020-2025年报及最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/shaanxi_jinye_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('陕西金叶_000812_2020-2025年报及最新季报')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET', 'POST'],
              raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          annuals = [
              {
                  'order': 1, 'year': 2020, 'title': '2020年年度报告', 'date': '2021-04-30',
                  'file': '01_陕西金叶_2020年年度报告.pdf', 'min_pages': 100,
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-30/7209409.PDF',
                  'index': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7209409&stockid=000812',
              },
              {
                  'order': 2, 'year': 2021, 'title': '2021年年度报告', 'date': '2022-04-28',
                  'file': '02_陕西金叶_2021年年度报告.pdf', 'min_pages': 100,
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2022/2022-4/2022-04-28/8128984.PDF',
                  'index': 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8128984&stockid=000812',
              },
              {
                  'order': 3, 'year': 2022, 'title': '2022年年度报告', 'date': '2023-04-29',
                  'file': '03_陕西金叶_2022年年度报告.pdf', 'min_pages': 90,
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-4/2023-04-29/9183845.PDF',
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9183845&stockid=000812',
              },
              {
                  'order': 4, 'year': 2023, 'title': '2023年年度报告', 'date': '2024-04-26',
                  'file': '04_陕西金叶_2023年年度报告.pdf', 'min_pages': 90,
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2024/2024-4/2024-04-26/10086925.PDF',
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10086925&stockid=000812',
              },
              {
                  'order': 5, 'year': 2024, 'title': '2024年年度报告', 'date': '2025-04-25',
                  'file': '05_陕西金叶_2024年年度报告.pdf', 'min_pages': 90,
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2025/2025-4/2025-04-25/10971792.PDF',
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10971792&stockid=000812',
              },
              {
                  'order': 6, 'year': 2025, 'title': '2025年年度报告', 'date': '2026-04-24',
                  'file': '06_陕西金叶_2025年年度报告.pdf', 'min_pages': 90,
                  'url': 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-4/2026-04-24/12174937.PDF',
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12174937&stockid=000812',
              },
          ]

          def clean_title(value: str) -> str:
              return re.sub(r'<[^>]+>', '', html.unescape(value or '')).replace(' ', '')

          def request_pdf(url: str, referer: str) -> tuple[str, bytes]:
              last = None
              candidates = [url, url + ('&' if '?' in url else '?') + 'download=1']
              for attempt in range(8):
                  for candidate in candidates:
                      try:
                          response = session.get(
                              candidate,
                              headers={
                                  'Referer': referer,
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 80_000:
                              return response.url, data
                          last = RuntimeError(
                              f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                          )
                      except Exception as exc:
                          last = exc
                  time.sleep(min(1 + attempt, 8))
              raise RuntimeError(f'PDF download failed: {last!r}')

          def discover_cninfo_q3() -> dict | None:
              try:
                  top_url = 'https://www.cninfo.com.cn/new/information/topSearch/query'
                  top = session.get(
                      top_url,
                      params={'keyWord': '000812', 'maxSecNum': 10},
                      headers={'Referer': 'https://www.cninfo.com.cn/'},
                      timeout=(30, 180),
                  )
                  top.raise_for_status()
                  entries = top.json()
                  org_id = None
                  for entry in entries:
                      if str(entry.get('code') or entry.get('secCode') or '') == '000812':
                          org_id = entry.get('orgId') or entry.get('orgid')
                          break
                  org_id = org_id or 'gssz0000812'

                  query_url = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
                  form = {
                      'pageNum': '1',
                      'pageSize': '100',
                      'column': 'szse',
                      'tabName': 'fulltext',
                      'plate': 'sz',
                      'stock': f'000812,{org_id}',
                      'searchkey': '2026年第三季度报告',
                      'secid': '',
                      'category': 'category_sjdbg_szsh;',
                      'trade': '',
                      'seDate': '2026-10-01~2026-10-29',
                      'sortName': '',
                      'sortType': '',
                      'isHLtitle': 'true',
                  }
                  response = session.post(
                      query_url,
                      data=form,
                      headers={
                          'Referer': 'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search',
                          'X-Requested-With': 'XMLHttpRequest',
                          'Origin': 'https://www.cninfo.com.cn',
                      },
                      timeout=(30, 180),
                  )
                  response.raise_for_status()
                  payload = response.json()
                  for announcement in payload.get('announcements') or []:
                      title = clean_title(announcement.get('announcementTitle') or '')
                      if '2026年第三季度报告' in title and '摘要' not in title and '关于' not in title:
                          adjunct = announcement.get('adjunctUrl') or ''
                          if adjunct:
                              pdf_url = urljoin('https://static.cninfo.com.cn/', adjunct)
                              return {
                                  'order': 7,
                                  'year': 2026,
                                  'title': '2026年第三季度报告',
                                  'date': str(announcement.get('announcementTime') or '2026-10-28')[:10],
                                  'file': '07_陕西金叶_2026年第三季度报告.pdf',
                                  'min_pages': 5,
                                  'url': pdf_url,
                                  'index': 'https://www.cninfo.com.cn/',
                              }
              except Exception as exc:
                  print('CNINFO_Q3_DISCOVERY_FAILED', repr(exc))
              return None

          def discover_sina_q3() -> dict | None:
              try:
                  list_url = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/000812/page_type/sjdbg.phtml'
                  listing = session.get(list_url, timeout=(30, 180), allow_redirects=True)
                  listing.raise_for_status()
                  listing.encoding = listing.apparent_encoding or 'gb18030'
                  soup = BeautifulSoup(listing.text, 'html.parser')
                  details = []
                  for anchor in soup.find_all('a', href=True):
                      label = re.sub(r'\s+', '', anchor.get_text(' ', strip=True))
                      href = urljoin(listing.url, anchor.get('href'))
                      if '2026年第三季度报告' in label and '摘要' not in label:
                          details.append(href)
                  for detail_url in details:
                      detail = session.get(detail_url, timeout=(30, 180), allow_redirects=True)
                      detail.raise_for_status()
                      detail.encoding = detail.apparent_encoding or 'gb18030'
                      soup2 = BeautifulSoup(detail.text, 'html.parser')
                      for anchor in soup2.find_all('a', href=True):
                          href = urljoin(detail.url, anchor.get('href'))
                          if 'file.finance.sina.com.cn' in href and '.pdf' in href.lower():
                              return {
                                  'order': 7,
                                  'year': 2026,
                                  'title': '2026年第三季度报告',
                                  'date': '2026-10-28',
                                  'file': '07_陕西金叶_2026年第三季度报告.pdf',
                                  'min_pages': 5,
                                  'url': href,
                                  'index': detail_url,
                              }
              except Exception as exc:
                  print('SINA_Q3_DISCOVERY_FAILED', repr(exc))
              return None

          q3 = discover_cninfo_q3() or discover_sina_q3()
          if q3 is None:
              raise RuntimeError('Could not discover the 2026 third-quarter report PDF')

          documents = annuals + [q3]

          def inspect(path: Path, document: dict) -> tuple[int, str]:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < int(document['min_pages']):
                  raise RuntimeError(f'page count below minimum: {pages}')
              indexes = list(range(min(20, pages)))
              if pages > 20:
                  indexes.append(pages - 1)
              text = ''
              for index in dict.fromkeys(indexes):
                  try:
                      text += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '陕西金叶' not in compact and '陕西金叶科教集团股份有限公司' not in compact:
                  raise RuntimeError('company name mismatch')
              if document['order'] <= 6:
                  year = str(document['year'])
                  if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                      raise RuntimeError('annual report title mismatch')
                  if '年度报告摘要' in compact[:800]:
                      raise RuntimeError('annual report summary instead of full report')
              else:
                  if ('第三季度报告' not in compact and '三季度报告' not in compact) or '2026' not in compact:
                      raise RuntimeError('quarterly report title mismatch')
              return pages, compact

          records = []
          for document in documents:
              source, data = request_pdf(document['url'], document['index'])
              path = out / document['file']
              path.write_bytes(data)
              pages, _ = inspect(path, document)
              sha = hashlib.sha256(data).hexdigest()
              record = {**document, 'pages': pages, 'bytes': len(data), 'source': source, 'sha256': sha}
              records.append(record)
              print('DOWNLOADED', document['title'], 'pages=', pages, 'bytes=', len(data), 'source=', source, 'sha256=', sha)

          records.sort(key=lambda item: item['order'])
          manifest = [
              '陕西金叶（000812）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：',
              '1. 2020-2025年度报告全文，共6份，不含年度报告摘要。',
              '2. 最新季报为2026年10月28日披露的2026年第三季度报告。',
              '3. 文件均为公开披露PDF原件，并通过公司名称、报告期、页数、PDF结构及首末页渲染检查。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              manifest += [
                  f"{item['order']}. {item['file']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   原始PDF：{item['source']}",
                  f"   公告/索引页：{item['index']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['file']}")
          manifest += [
              f'合计：7份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件已完成PDF结构、实际页数、公司名称、报告标题及首末页渲染检查。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(manifest))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '陕西金叶|陕西金叶科教集团股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/shaanxi_jinye_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/shaanxi_jinye_test.zip "$PACKAGE"
          unzip -t /tmp/shaanxi_jinye_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/shaanxi_jinye_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/shaanxi_jinye_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Shaanxi-Jinye-000812-2020-2025-annual-reports-latest-quarter
          path: 陕西金叶_000812_2020-2025年报及最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
