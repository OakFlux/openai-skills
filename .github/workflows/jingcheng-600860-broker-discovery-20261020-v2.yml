name: Discover Jingcheng broker reports 20261020 v2

on:
  push:
    paths:
      - '.github/workflows/jingcheng-600860-broker-discovery-20261020-v2.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests
      - name: Query report endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          codes=['600860','600860.SH','SH600860','00187','00187.HK','HK00187','187']
          for code in codes:
            for qtype in ['0','1','2']:
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2026-10-20','pageNo':'1','fields':'','qType':qtype,'orgCode':'','author':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              try:
                r=s.get(endpoint,params=p,timeout=60)
                print('QUERY',code,qtype,'STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url)
                if r.status_code != 200:
                  print('TEXT',r.text[:500]); continue
                payload=r.json(); data=payload.get('data') or []
                if isinstance(data,dict): data=data.get('list') or data.get('data') or []
                print('COUNT',len(data) if isinstance(data,list) else 'NONLIST')
                if isinstance(data,list):
                  for row in data[:25]:
                    print('ROW',json.dumps({k:row.get(k) for k in ['stockCode','stockName','infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName']},ensure_ascii=False))
              except Exception as e:
                print('ERROR',code,qtype,repr(e))
          # Eastmoney suggestion endpoint for both names.
          for keyword in ['京城股份','京城机电股份','北京京城机电股份有限公司']:
            for url in [
              'https://searchapi.eastmoney.com/api/suggest/get',
              'https://searchapi.eastmoney.com/api/suggest/get?input='+requests.utils.quote(keyword)+'&type=14&token=D43BF722C8E33BDC906FB84D85E326E8',
            ]:
              try:
                params=None if '?' in url else {'input':keyword,'type':'14','token':'D43BF722C8E33BDC906FB84D85E326E8'}
                r=s.get(url,params=params,timeout=60)
                print('SUGGEST',keyword,r.status_code,r.url,r.text[:2000])
              except Exception as e:
                print('SUGGEST_ERROR',keyword,repr(e))
          PY
