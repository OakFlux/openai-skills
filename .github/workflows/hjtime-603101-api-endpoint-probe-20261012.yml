name: Probe HJTime report APIs 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-api-endpoint-probe-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe public report API endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9'})
          base='https://api.fxbaogao.com'
          paths=[
            '/mofoun/report/report/getReportPreviewImages?reportId={id}',
            '/mofoun/report/readReport/readReport?reportId={id}',
            '/mofoun/report/searchReport/detail/catalog?reportId={id}',
            '/mofoun/report/report/report/preDownV2?reportId={id}',
            '/mofoun/report/report/file/downloadReport?reportId={id}',
            '/mofoun/report/report/downloadReportByBean?reportId={id}',
            '/mofoun/report/report/report/getUrlAfterPay?reportId={id}',
          ]
          for did in ('5271496','5261391'):
            for i,tpl in enumerate(paths,1):
              url=base+tpl.format(id=did)
              try:
                r=s.get(url,timeout=(15,60),allow_redirects=True)
                print('GET',did,i,r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
                print('BODY',did,i,r.text[:30000],flush=True)
              except Exception as e: print('GET_ERR',did,i,url,repr(e),flush=True)
          PY
