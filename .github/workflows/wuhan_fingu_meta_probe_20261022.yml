name: Probe exact Wuhan Fingu report metadata 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wuhan_fingu_meta_probe_20261022.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install --quiet requests
      - name: Query exact dates and titles
        run: |
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'}
          api='https://reportapi.eastmoney.com/report/list'
          dates=['2019-08-20','2019-10-24','2019-10-28','2019-12-18','2020-08-10','2020-08-11','2020-11-03']
          terms=['武汉凡谷','基站滤波器','基站天线及滤波器','射频滤波器国产化','新周期开启','盈利能力改善','克服疫情影响','专注基站射频三十年']
          for day in dates:
            for qtype in ['0','1']:
              p={'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*','beginTime':day,'endTime':day,'pageNo':'1','fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              try:r=s.get(api,params=p,headers=h,timeout=(15,60));o=r.json()
              except Exception as e:print('ERR',day,qtype,repr(e));continue
              rows=o.get('data') or []
              if isinstance(rows,dict):rows=rows.get('list') or rows.get('data') or []
              for row in rows:
                title=str(row.get('title') or '')
                if str(row.get('stockCode') or '')=='002194' or str(row.get('stockName') or '')=='武汉凡谷' or any(t in title for t in terms):
                  print('MATCH',day,'Q',qtype,json.dumps({k:row.get(k) for k in ['infoCode','title','stockCode','stockName','orgSName','publishDate','attachPages','researcher','emRatingName','reportType','column']},ensure_ascii=False))
          PY
