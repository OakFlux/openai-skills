name: Discover Kaitian Gas brokerage reports 20261004

on:
  push:
    paths:
      - '.github/workflows/kaitian-gas-920010-brokerage-discovery-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query public brokerage report metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time, requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,*/*;q=0.8',
          })
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          for code in ['831010','920010']:
              seen=set(); rows_all=[]
              for begin,end in [('2015-01-01','2019-12-31'),('2020-01-01','2022-12-31'),('2023-01-01','2024-12-31'),('2025-01-01','2026-10-04')]:
                  for page in range(1,10):
                      params={
                          'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                          'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'',
                          'code':code,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                          '_':str(int(time.time()*1000)),
                      }
                      r=s.get(endpoint,params=params,timeout=60)
                      print('QUERY',code,begin,end,page,r.status_code,len(r.content),flush=True)
                      r.raise_for_status(); payload=r.json()
                      rows=payload.get('data',[]) if isinstance(payload,dict) else []
                      print('COUNT',len(rows),flush=True)
                      if not rows: break
                      for row in rows:
                          info=row.get('infoCode')
                          if not info or info in seen: continue
                          seen.add(info); rows_all.append(row)
                      if len(rows)<100: break
              print('TOTAL',code,len(rows_all),flush=True)
              for row in rows_all:
                  compact={k:row.get(k) for k in [
                      'title','stockName','stockCode','orgSName','publishDate','infoCode',
                      'attachPages','attachSize','researcher','column','emRatingName','encodeUrl'
                  ]}
                  print('REPORT_ROW',code,json.dumps(compact,ensure_ascii=False),flush=True)
          PY
