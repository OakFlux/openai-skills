name: Inspect historical Sanbian broker report sources 20261022

on:
  push:
    branches:
      - tmp/sanbian-002112-broker-discovery-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect source pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = [
              'https://finance.sina.com.cn/stock/companyresearch/20070124/13333277890.shtml',
              'https://finance.sina.com.cn/stock/companyresearch/20070124/10113277169.shtml',
              'https://finance.sina.com.cn/stock/companyresearch/20070123/15403274198.shtml',
              'https://finance.sina.com.cn/stock/companyresearch/20070126/14173286388.shtml',
              'https://finance.sina.com.cn/stock/companyresearch/20070123/15523274234.shtml',
              'https://business.sohu.com/20080317/n255744589.shtml',
          ]
          s = requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for url in urls:
              print('\n===', url, '===')
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  enc=r.apparent_encoding or r.encoding or 'utf-8'
                  text=r.content.decode(enc,errors='replace')
                  soup=BeautifulSoup(text,'lxml')
                  print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url)
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                  links=[]
                  for tag in soup.find_all(True):
                      for attr in ['href','src','data-src','data-url','data-href']:
                          val=tag.get(attr)
                          if not val: continue
                          full=urljoin(r.url,val)
                          label=re.sub(r'\s+',' ',tag.get_text(' ',strip=True))[:180]
                          low=(full+' '+label).lower()
                          if any(k in low for k in ['.pdf','download','附件','报告原文','研报原文','file=','attach']):
                              links.append({'tag':tag.name,'attr':attr,'label':label,'url':full})
                  print('CANDIDATE_LINKS',json.dumps(links[:300],ensure_ascii=False,indent=2))
                  body=re.sub(r'\s+',' ',soup.get_text(' ',strip=True))
                  print('BODY_HEAD',body[:5000])
              except Exception as exc:
                  print('ERROR',repr(exc))
          PY
