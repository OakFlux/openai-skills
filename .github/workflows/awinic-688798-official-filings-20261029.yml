name: Package Awinic 688798 official filings

on:
  push:
    paths:
      - '.github/workflows/awinic-688798-official-filings-20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, verify, and package official filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '艾为电子'
          FULL_COMPANY = '上海艾为电子技术股份有限公司'
          CODE = '688798'
          CUTOFF = '2026-10-29'
          CUTOFF_COMPACT = '20261029'
          ROOT_NAME = f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          PROSPECTUS_DIR = ROOT / '00_招股说明书'
          ANNUAL_DIR = ROOT / '01_年度报告'
          QUARTER_DIR = ROOT / '02_最新季度报告'
          PREVIEW_DIR = ROOT / '首页预览'
          DIST = Path('dist')
          for directory in (PROSPECTUS_DIR, ANNUAL_DIR, QUARTER_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          SINA_BASE = 'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK'
          SINA_BASE_RAW = 'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK'

          DOCUMENTS = [
              {
                  'doc_type': 'prospectus',
                  'period': 'IPO',
                  'announcement_date': '2021-08-10',
                  'announcement_title': '首次公开发行股票并在科创板上市招股说明书',
                  'filename': '2021_艾为电子_首次公开发行股票并在科创板上市招股说明书.pdf',
                  'directory': PROSPECTUS_DIR,
                  'expected_tokens': ['招股说明书', '科创板'],
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2021-08-10/1210710619.PDF',
                      'https://pdf.dfcfw.com/pdf/H2_AN202108091509053471_1.pdf',
                  ],
              },
              {
                  'doc_type': 'annual_report',
                  'period': '2021',
                  'announcement_date': '2022-07-29',
                  'announcement_title': '2021年年度报告（更新后）',
                  'filename': '2021_艾为电子_2021年年度报告_更新后.pdf',
                  'directory': ANNUAL_DIR,
                  'expected_tokens': ['2021', '年度报告'],
                  'urls': [
                      f'{SINA_BASE}/2022/2022-7/2022-07-29/8388914.PDF',
                      f'{SINA_BASE_RAW}/2022/2022-7/2022-07-29/8388914.PDF',
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-7/2022-07-29/8388914.PDF',
                  ],
              },
              {
                  'doc_type': 'annual_report',
                  'period': '2022',
                  'announcement_date': '2023-05-27',
                  'announcement_title': '2022年年度报告（修订版）',
                  'filename': '2022_艾为电子_2022年年度报告_修订版.pdf',
                  'directory': ANNUAL_DIR,
                  'expected_tokens': ['2022', '年度报告'],
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2023-05-27/1216921796.PDF',
                      f'{SINA_BASE}/2023/2023-5/2023-05-27/9253291.PDF',
                      f'{SINA_BASE_RAW}/2023/2023-5/2023-05-27/9253291.PDF',
                  ],
              },
              {
                  'doc_type': 'annual_report',
                  'period': '2023',
                  'announcement_date': '2024-04-10',
                  'announcement_title': '2023年年度报告',
                  'filename': '2023_艾为电子_2023年年度报告.pdf',
                  'directory': ANNUAL_DIR,
                  'expected_tokens': ['2023', '年度报告'],
                  'urls': [
                      f'{SINA_BASE}/2024/2024-4/2024-04-10/9953854.PDF',
                      f'{SINA_BASE_RAW}/2024/2024-4/2024-04-10/9953854.PDF',
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-10/9953854.PDF',
                  ],
              },
              {
                  'doc_type': 'annual_report',
                  'period': '2024',
                  'announcement_date': '2025-04-10',
                  'announcement_title': '2024年年度报告',
                  'filename': '2024_艾为电子_2024年年度报告.pdf',
                  'directory': ANNUAL_DIR,
                  'expected_tokens': ['2024', '年度报告'],
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2025-04-10/1223046125.PDF',
                      f'{SINA_BASE}/2025/2025-4/2025-04-10/10859032.PDF',
                      f'{SINA_BASE_RAW}/2025/2025-4/2025-04-10/10859032.PDF',
                  ],
              },
              {
                  'doc_type': 'annual_report',
                  'period': '2025',
                  'announcement_date': '2026-04-10',
                  'announcement_title': '2025年年度报告',
                  'filename': '2025_艾为电子_2025年年度报告.pdf',
                  'directory': ANNUAL_DIR,
                  'expected_tokens': ['2025', '年度报告'],
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-04-10/1225090195.PDF',
                      'https://pdf.dfcfw.com/pdf/H2_AN202604091821097956_1.pdf',
                      f'{SINA_BASE}/2026/2026-4/2026-04-10/12073947.PDF',
                  ],
              },
              {
                  'doc_type': 'quarterly_report',
                  'period': '2026Q3',
                  'announcement_date': '2026-10-28',
                  'announcement_title': '2026年第三季度报告',
                  'filename': '2026Q3_艾为电子_2026年第三季度报告.pdf',
                  'directory': QUARTER_DIR,
                  'expected_tokens': ['2026', '第三季度报告'],
                  'urls': [
                      'https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-28/688798_20261028_EX5Q.pdf',
                      f'{SINA_BASE}/2026/2026-10/2026-10-28/12667100.PDF',
                      f'{SINA_BASE_RAW}/2026/2026-10/2026-10-28/12667100.PDF',
                  ],
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6,
              connect=6,
              read=6,
              status=6,
              backoff_factor=1.0,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}),
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.mount('http://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://www.cninfo.com.cn/',
          })

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def safe_name(value: str) -> str:
              return re.sub(r'_+', '_', re.sub(r'[\\/:*?"<>|]', '_', value)).strip('_. ')

          def download_document(document: dict) -> tuple[Path, str, str]:
              errors = []
              for url in document['urls']:
                  try:
                      referer = 'https://vip.stock.finance.sina.com.cn/' if 'sina.com.cn' in url else 'https://www.cninfo.com.cn/'
                      response = session.get(url, headers={'Referer': referer}, timeout=240, allow_redirects=True)
                      print('DOWNLOAD', response.status_code, len(response.content), url, '->', response.url)
                      if response.status_code == 200 and len(response.content) >= 50_000 and response.content.startswith(b'%PDF'):
                          destination = document['directory'] / safe_name(document['filename'])
                          destination.write_bytes(response.content)
                          return destination, url, response.url
                      errors.append(f'{url}: status={response.status_code}, size={len(response.content)}, head={response.content[:16]!r}')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              raise RuntimeError('No valid PDF for ' + document['announcement_title'] + ': ' + ' | '.join(errors))

          records = []
          for document in DOCUMENTS:
              destination, source_url, resolved_url = download_document(document)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception as exc:
                      raise RuntimeError(f'Encrypted PDF cannot be opened: {destination}: {exc}')
              page_count = len(reader.pages)
              if page_count < 2:
                  raise RuntimeError(f'Invalid PDF page count: {destination}: {page_count}')

              pdf = fitz.open(destination)
              if pdf.page_count != page_count:
                  raise RuntimeError(f'PDF parser page mismatch: {destination}: pypdf={page_count}, fitz={pdf.page_count}')
              first_pixmap = pdf.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_pixmap = pdf.load_page(pdf.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first_pixmap.width, first_pixmap.height, last_pixmap.width, last_pixmap.height) < 100:
                  raise RuntimeError(f'PDF render validation failed: {destination}')
              first_pixmap.save(PREVIEW_DIR / f'{destination.stem}.png')

              probe = ''
              for page_index in range(min(10, pdf.page_count)):
                  try:
                      probe += pdf.load_page(page_index).get_text('text')
                  except Exception:
                      pass
              pdf.close()
              compact = re.sub(r'\s+', '', probe)
              if COMPANY not in compact and FULL_COMPANY not in compact and CODE not in compact:
                  raise RuntimeError(f'Company identity not found in PDF: {destination}')
              for token in document['expected_tokens']:
                  if re.sub(r'\s+', '', token) not in compact:
                      print('WARNING expected token not found in first ten pages:', token, destination)

              record = {
                  'document_type': document['doc_type'],
                  'period': document['period'],
                  'announcement_title': document['announcement_title'],
                  'announcement_date': document['announcement_date'],
                  'source_url': source_url,
                  'resolved_url': resolved_url,
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': sha256(destination),
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          annual_years = sorted(int(record['period']) for record in records if record['document_type'] == 'annual_report')
          if annual_years != [2021, 2022, 2023, 2024, 2025]:
              raise RuntimeError(f'Annual report coverage mismatch: {annual_years}')
          if sum(record['document_type'] == 'prospectus' for record in records) != 1:
              raise RuntimeError('Prospectus count mismatch')
          if sum(record['document_type'] == 'quarterly_report' for record in records) != 1:
              raise RuntimeError('Quarterly report count mismatch')

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'market': '上海证券交易所科创板',
              'listing_date': '2021-08-16',
              'cutoff_date': CUTOFF,
              'annual_report_years': annual_years,
              'latest_quarter': '2026Q3',
              'document_count': len(records),
              'selection_policy': {
                  'annual_reports': '收录公司上市以来2021—2025年全部正式年度报告全文；2021年采用更新后版本，2022年采用修订版；排除摘要及提示性公告。',
                  'prospectus': '收录2021年8月10日披露的最终正式版首次公开发行股票并在科创板上市招股说明书。',
                  'latest_quarterly_report': '收录截至2026年10月29日最新正式季度报告，即2026年第三季度报告。',
                  'pre_listing_reports': '2018—2020年度材料为IPO申报阶段历史财务材料，不纳入上市以来年度报告范围。',
              },
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）上市以来全部年报、招股说明书及最新季报',
              '',
              f'- 截止日期：{CUTOFF}',
              '- 上市日期：2021年8月16日。',
              '- 年报范围：2021—2025年；2021年采用更新后版本，2022年采用修订版。',
              '- 招股说明书：2021年8月10日最终正式版。',
              '- 最新季度报告：2026年第三季度报告，披露日期为2026年10月28日。',
              '- 2018—2020年度文件属于IPO申报阶段历史材料，不作为上市以来年度报告重复收录。',
              '- 已排除年度报告摘要、招股说明书申报稿/注册稿及提示性公告。',
              '- 已完成PDF文件头、双解析器页数、公司身份、首末页渲染、SHA-256及ZIP CRC校验。',
              '',
              '## 文件清单',
              '',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 披露标题：{record['announcement_title']}",
                  f"   - 披露日期：{record['announcement_date']}",
                  f"   - 页数：{record['page_count']}；大小：{record['file_size_bytes']:,}字节",
                  f"   - 来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'awinic_688798_all_annual_reports_prospectus_latest_quarter_{CUTOFF_COMPACT}.zip'
          for path in (chinese_zip, english_zip):
              if path.exists():
                  path.unlink()

          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad_member = archive.testzip()
                  if bad_member:
                      raise RuntimeError(f'ZIP CRC failure: {path}: {bad_member}')
                  pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdf_members) != len(records):
                      raise RuntimeError(f'Unexpected PDF count: {path}: {len(pdf_members)} vs {len(records)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256(path))

          print('FINAL_JSON', json.dumps({
              'annual_years': annual_years,
              'latest_quarter': '2026Q3',
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': sha256(chinese_zip),
              'records': records,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: awinic-688798-official-filings-20261029
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
