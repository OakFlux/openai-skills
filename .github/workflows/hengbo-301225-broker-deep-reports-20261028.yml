name: Package Hengbo 301225 verified broker research PDFs

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-broker-deep-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY, FULL_NAME, CODE = '恒勃股份', '恒勃控股股份有限公司', '301225'
          AS_OF = '2026-10-28'
          CANDIDATES = [
              dict(info_code='AP202511241787234946', broker='华鑫证券', title='公司动态研究报告：汽摩进气系统领军企业，积极开拓成长新曲线', publish_date='2025-11-24', author=['林子健'], rating='买入', priority=1000),
              dict(info_code='AP202305311587369843', broker='华金证券', title='新股覆盖研究：恒勃股份', publish_date='2023-05-31', author=['李蕙'], rating='未标注', priority=700),
              dict(info_code='AP202306181591195774', broker='华金证券', title='“空气滤清器”龙头，多元化拓展可期', publish_date='2023-06-18', author=['李蕙'], rating='未标注', priority=680),
              dict(info_code='AP202507291719344452', broker='华鑫证券', title='业绩符合预期，差异化产品放量可期', publish_date='2025-07-30', author=[], rating='买入', priority=350),
              dict(info_code='AP202403041625131817', broker='华金证券', title='2023年报点评：营收稳中有升，利润表现亮眼', publish_date='2024-03-04', author=['李蕙'], rating='未标注', priority=300),
          ]

          work, verify, out = Path('downloads'), Path('verify'), Path('artifact_out')
          for p in (work, verify, out): p.mkdir(parents=True, exist_ok=True)

          s = requests.Session(); s.trust_env = False
          s.mount('https://', HTTPAdapter(max_retries=Retry(total=7, connect=7, read=7, status=7, backoff_factor=1, status_forcelist=[429,500,502,503,504], allowed_methods=['GET'], raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9'})

          def download(code, target):
              urls = [f'https://pdf.dfcfw.com/pdf/H{x}_{code}_{suffix}.pdf' for x in (3,2,1,4) for suffix in ('1','01')]
              last = None
              for url in urls:
                  try:
                      r = s.get(url, headers={'Accept':'application/pdf,*/*;q=0.8'}, timeout=(30,360), allow_redirects=True)
                      last = (url, r.status_code, len(r.content)); print('DOWNLOAD', code, *last, flush=True)
                      if r.status_code == 200 and r.content.startswith(b'%PDF') and len(r.content) > 70000:
                          target.write_bytes(r.content); return url
                  except Exception as e:
                      last = (url, repr(e)); print('DOWNLOAD_ERROR', code, last, flush=True)
                  time.sleep(1)
              raise RuntimeError(f'download failed {code}: {last}')

          valid, hashes = [], set()
          for spec in CANDIDATES:
              code = spec['info_code']; pdf = work/f'{code}.pdf'
              try:
                  url = download(code, pdf)
                  reader = PdfReader(str(pdf), strict=False); pages = len(reader.pages)
                  if pages < 7: raise RuntimeError(f'too short: {pages}')
                  ids = list(range(min(24,pages))) + (list(range(max(0,pages-2),pages)) if pages > 26 else [])
                  text = ''
                  for i in dict.fromkeys(ids):
                      try: text += '\n' + (reader.pages[i].extract_text() or '')
                      except Exception: pass
                  compact = re.sub(r'\s+','',text)
                  identity = COMPANY in compact or FULL_NAME in compact or CODE in compact
                  research = any(x in compact for x in ('证券研究报告','公司研究报告','新股覆盖研究','公司动态研究报告','投资评级','分析师','研究报告'))
                  if not identity or not research: raise RuntimeError(f'identity/research {identity}/{research}')
                  q = subprocess.run(['qpdf','--warning-exit-0','--check',str(pdf)],capture_output=True,text=True)
                  if q.returncode != 0: raise RuntimeError('qpdf failed')
                  for n,suffix in ((1,'first'),(pages,'last')):
                      prefix=verify/f'{code}_{suffix}'
                      r=subprocess.run(['pdftoppm','-f',str(n),'-l',str(n),'-singlefile','-png','-r','90',str(pdf),str(prefix)],capture_output=True,text=True)
                      image=Path(str(prefix)+'.png')
                      if r.returncode != 0 or not image.exists() or image.stat().st_size < 5000: raise RuntimeError(f'render failed {n}')
                  data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
                  if sha in hashes: raise RuntimeError('duplicate')
                  hashes.add(sha)
                  rec={**spec,'actual_pages':pages,'bytes':len(data),'sha256':sha,'source_url':url,'file':str(pdf),'score':spec['priority']+pages*15,'identity_text_check':identity,'research_document_check':research}
                  valid.append(rec); print('VALID',json.dumps({k:rec[k] for k in ('broker','title','actual_pages','score')},ensure_ascii=False),flush=True)
              except Exception as e:
                  print('REJECT',code,spec['title'],repr(e),flush=True); pdf.unlink(missing_ok=True)

          if len(valid) < 2: raise RuntimeError(f'only {len(valid)} reports passed')
          valid.sort(key=lambda x:(x['score'],x['actual_pages'],x['publish_date']),reverse=True)
          selected=valid[:3]; selected.sort(key=lambda x:x['publish_date'],reverse=True); count=len(selected)
          cn=f'恒勃股份_301225.SZ_券商公司研究报告_{count}份'; en=f'Hengbo_301225_Broker_Company_Research_{count}_Reports'
          root=Path(cn); root.mkdir(exist_ok=True)
          safe=lambda x: re.sub(r'[\\/:*?"<>|]+','_',str(x)).strip(' ._')[:105]
          manifest=[]
          for i,item in enumerate(selected,1):
              filename=f'{i:02d}_{item["publish_date"]}_{safe(item["broker"])}_{safe(item["title"])}.pdf'
              shutil.copy2(item['file'],root/filename)
              rec={k:v for k,v in item.items() if k not in ('file','score','priority')}; rec['filename']=filename
              rec['validation']=['PDF header','issuer identity','research-document identity','page count','qpdf structure','first-page render','last-page render','duplicate hash check']
              manifest.append(rec)
          lines=[f'恒勃股份（301225.SZ）券商公司研究报告合集（{count}份）',f'整理日期：{AS_OF}','','说明：公开渠道可直接下载并核验的恒勃股份原始券商PDF篇幅整体偏短。本包优先保留篇幅较长、内容较完整的公司研究/新股覆盖报告；未将会员页、预览页或网页摘要冒充原始PDF。','','文件清单：']
          for i,x in enumerate(manifest,1):
              lines += [f'{i}. {x["filename"]}',f'   机构：{x["broker"]}',f'   标题：{x["title"]}',f'   日期：{x["publish_date"]}；实际页数：{x["actual_pages"]}',f'   评级：{x.get("rating") or "未标注"}；分析师：{"、".join(x.get("author") or []) or "未标注"}',f'   来源：{x["source_url"]}',f'   SHA-256：{x["sha256"]}','']
          lines.append('核验项目：公司身份、研究报告属性、实际页数、PDF结构、首末页渲染、重复文件、SHA-256及ZIP CRC。')
          (root/'00_文件清单与范围说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')
          z=out/f'{cn}.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as a:
              for p in sorted(root.iterdir()): a.write(p,arcname=f'{cn}/{p.name}')
          with zipfile.ZipFile(z) as a:
              bad=a.testzip(); pdf_count=sum(n.lower().endswith('.pdf') for n in a.namelist())
              if bad or pdf_count != count: raise RuntimeError(f'zip validation {bad}/{pdf_count}/{count}')
          ez=out/f'{en}.zip'; shutil.copy2(z,ez)
          print('FINAL_COUNT',count,flush=True); print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',z,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          print('BACKUP_ZIP',ez,ez.stat().st_size,hashlib.sha256(ez.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hengbo-301225-broker-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
