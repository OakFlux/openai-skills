name: Package verified Hengbo 301225 broker reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengbo-301225-broker-deep-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='恒勃股份'; FULL='恒勃控股股份有限公司'; CODE='301225'; AS_OF='2026-10-28'
          CANDIDATES=[
            {
              'info_code':'AP202511241787234946','broker':'华鑫证券','date':'2025-11-23',
              'title':'公司动态研究报告：汽摩进气系统领军企业，积极开拓成长新曲线',
              'analysts':'林子健','rating':'买入（首次）','report_type':'公司动态研究/首次覆盖','min_pages':7,
            },
            {
              'info_code':'AP202306181591195774','broker':'华金证券','date':'2023-06-18',
              'title':'“空气滤清器”龙头，多元化拓展可期',
              'analysts':'李蕙','rating':'未标注','report_type':'公司研究','min_pages':7,
            },
            {
              'info_code':'AP202305311587369843','broker':'华金证券','date':'2023-05-29',
              'title':'新股覆盖研究：恒勃股份',
              'analysts':'李蕙','rating':'未评级','report_type':'新股覆盖研究','min_pages':10,
            },
          ]

          root=Path('恒勃股份_301225_券商公司研究报告_完整版_截至20261028')
          pdfdir=root/'PDF原文'; prevdir=root/'首页预览'
          pdfdir.mkdir(parents=True,exist_ok=True); prevdir.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def compact(x): return re.sub(r'\s+','',str(x or '')).lower()
          def safe(x):
            x=re.sub(r'[\\/:*?"<>|]+','_',str(x or '')); x=re.sub(r'\s+','',x).strip('._')
            return x[:100] or '报告'
          def download(code):
            last={}
            for prefix in ('H3','H2','H1','H4'):
              for suffix in ('1','01'):
                url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_{suffix}.pdf'
                for attempt in range(7):
                  try:
                    r=s.get(url,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'},timeout=(25,360),allow_redirects=True)
                    last={'url':url,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                    if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>70000:
                      return r.content,url,last
                  except Exception as exc:
                    last={'url':url,'error':repr(exc)}
                  time.sleep(1+attempt)
            raise RuntimeError(f'download failed {code}: {last}')

          manifest=[]; failures=[]; hashes=set()
          for spec in CANDIDATES:
            try:
              data,url,meta=download(spec['info_code'])
              tmp=Path('_candidate.pdf'); tmp.write_bytes(data)
              reader=PdfReader(str(tmp),strict=False); pages=len(reader.pages)
              if pages<spec['min_pages']: raise RuntimeError(f'too few pages {pages}')
              text=''
              for p in reader.pages[:min(30,pages)]:
                try: text+='\n'+(p.extract_text() or '')
                except Exception: pass
              c=compact(text)
              if not any(compact(k) in c for k in (COMPANY,FULL,CODE)): raise RuntimeError('issuer identity mismatch')
              broker_key=spec['broker'].replace('证券','')
              if compact(broker_key) not in c and compact(spec['broker']) not in c: raise RuntimeError('broker identity mismatch')
              sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError('duplicate PDF')
              hashes.add(sha)
              filename=f"{len(manifest)+1:02d}_{safe(spec['broker'])}_恒勃股份_{safe(spec['title'])}_{spec['date']}.pdf"
              dest=pdfdir/filename; dest.write_bytes(data)
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=prevdir/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-singlefile','-png','-r','140',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('first-page render failed')
              manifest.append({**spec,'filename':filename,'actual_pages':pages,'bytes':len(data),'pdf_url':url,
                               'source_page':f"https://data.eastmoney.com/report/info/{spec['info_code']}.html",
                               'sha256':sha,'download_meta':meta,'preview_file':str(Path('首页预览')/preview.name),
                               'validation':['PDF header','issuer identity','broker identity','minimum page count','qpdf structure','first-page render']})
              print('VALID',json.dumps(manifest[-1],ensure_ascii=False),flush=True)
            except Exception as exc:
              failures.append({'candidate':spec,'error':repr(exc)})
              print('REJECT',spec['info_code'],repr(exc),flush=True)
            finally:
              Path('_candidate.pdf').unlink(missing_ok=True)

          if len(manifest)<2: raise RuntimeError(f'Only {len(manifest)} reports passed: {failures}')

          readme=[
            '恒勃控股股份有限公司（301225.SZ）券商公司研究报告资料包',
            f'整理基准日：{AS_OF}','',
            f'本包收录{len(manifest)}份公开可直接取得并通过全文核验的券商原始完整PDF。',
            '说明：严格优先公司深度、公司动态研究和新股覆盖；未使用季报、年报或事件短评凑数。',''
          ]
          for i,m in enumerate(manifest,1):
            readme += [f"{i}. {m['broker']}：《{m['title']}》",f"   类型：{m['report_type']}；日期：{m['date']}",
                       f"   分析师：{m['analysts']}；评级：{m['rating']}；完整页数：{m['actual_pages']}页",
                       f"   来源页面：{m['source_page']}",f"   SHA-256：{m['sha256']}",'']
          readme += ['报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
                     '核验项目：PDF文件头、公司身份、券商身份、实际页数、PDF结构、首页渲染、重复哈希、ZIP CRC及SHA-256。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')

          cn=Path('恒勃股份_301225_券商公司研究报告_完整版_截至20261028.zip')
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{root.name}/{p.relative_to(root)}')
          with zipfile.ZipFile(cn) as z:
            bad=z.testzip(); count=sum(n.lower().endswith('.pdf') for n in z.namelist())
            if bad or count!=len(manifest): raise RuntimeError(f'zip validation {bad}/{count}/{len(manifest)}')
          en=Path('hengbo_301225_broker_company_research_reports.zip'); shutil.copy2(cn,en)
          digest=hashlib.sha256(cn.read_bytes()).hexdigest()
          print('FINAL_COUNT',len(manifest),flush=True)
          print('FINAL_ZIP',cn,cn.stat().st_size,'SHA256',digest,flush=True)
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hengbo-301225-broker-reports-final-20261028
          path: |
            恒勃股份_301225_券商公司研究报告_完整版_截至20261028.zip
            hengbo_301225_broker_company_research_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
