name: Package Hengbo 301225 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengbo-301225-broker-deep-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '301225'
          COMPANY = '恒勃股份'
          COMPANY_FULL = '恒勃控股股份有限公司'
          AS_OF = '2026-10-28'
          PACKAGE = '恒勃股份_301225_券商深度与首次覆盖报告_完整版_3份_截至20261028'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / 'PDF原文'
          PREVIEW_DIR = ROOT / '首页预览'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://reportapi.eastmoney.com/report/list'
          rows: list[dict[str, Any]] = []
          for page in range(1, 20):
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*', 'rating': '*',
                  'ratingChange': '*', 'beginTime': '2023-01-01', 'endTime': '2030-12-31',
                  'pageNo': str(page), 'fields': '', 'qType': '0', 'orgCode': '',
                  'code': STOCK_CODE, 'rcode': '', 'p': str(page),
                  'pageNum': str(page), 'pageNumber': str(page),
              }
              data = None
              last = None
              for attempt in range(8):
                  try:
                      r = session.get(api, params=params, timeout=(20, 120))
                      last = {'status': r.status_code, 'text': r.text[:300]}
                      if r.status_code == 200:
                          data = r.json()
                          break
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'report API failed page {page}: {last}')
              batch = data.get('data') or []
              print('INDEX_PAGE', page, 'HITS', data.get('hits'), 'ROWS', len(batch))
              if not batch:
                  break
              rows.extend(batch)
              if len(batch) < 100:
                  break

          dedup: dict[str, dict[str, Any]] = {}
          for row in rows:
              code = str(row.get('infoCode') or '')
              if code:
                  dedup.setdefault(code, row)
          rows = list(dedup.values())

          def compact(value: Any) -> str:
              return re.sub(r'[\s，。、“”‘’：:；;（）()—－+&]+', '', str(value or '')).lower()

          def pages_of(row: dict[str, Any]) -> int:
              try:
                  return int(row.get('attachPages') or 0)
              except Exception:
                  return 0

          excluded = ['年报点评','季报点评','一季报点评','三季报点评','中报点评','半年报点评','业绩点评','事件点评','公告点评','业绩快报点评']
          candidates = []
          for row in rows:
              title = str(row.get('title') or '')
              if any(term in title for term in excluded):
                  continue
              if pages_of(row) < 10:
                  continue
              candidates.append(row)

          preferred = [
              {
                  'title_tokens': ['汽摩进气系统龙头', '卡位机器人peek核心环节'],
                  'broker_tokens': ['财通证券'],
                  'label': '财通证券首次覆盖',
              },
              {
                  'title_tokens': ['汽摩进气系统龙头实现机器人peek核心卡位'],
                  'broker_tokens': ['中金公司', '中国国际金融'],
                  'label': '中金公司首次覆盖',
              },
              {
                  'title_tokens': ['主业稳步向上', '新业务积极布局'],
                  'broker_tokens': ['天风证券'],
                  'label': '天风证券首次覆盖',
              },
              {
                  'title_tokens': ['汽摩进气系统领军企业', '积极开拓成长新曲线'],
                  'broker_tokens': ['华鑫证券'],
                  'label': '华鑫证券首次覆盖',
              },
              {
                  'title_tokens': ['进气系统头部供应商', 'peek核心卡位'],
                  'broker_tokens': ['申万宏源', '上海申银万国'],
                  'label': '申万宏源公司研究',
              },
          ]

          selected: list[dict[str, Any]] = []
          used_codes = set()
          used_brokers = set()
          for pref in preferred:
              matches = []
              for row in candidates:
                  title_c = compact(row.get('title'))
                  broker_c = compact(str(row.get('orgSName') or '') + str(row.get('orgName') or ''))
                  if not all(compact(tok) in title_c for tok in pref['title_tokens']):
                      continue
                  if pref['broker_tokens'] and not any(compact(tok) in broker_c for tok in pref['broker_tokens']):
                      continue
                  matches.append(row)
              matches.sort(key=lambda x: (str(x.get('publishDate') or ''), pages_of(x)), reverse=True)
              if matches:
                  row = matches[0]
                  code = str(row.get('infoCode') or '')
                  broker = str(row.get('orgSName') or row.get('orgName') or '券商')
                  if code not in used_codes and broker not in used_brokers:
                      row = dict(row)
                      row['_selection_label'] = pref['label']
                      selected.append(row)
                      used_codes.add(code)
                      used_brokers.add(broker)
              if len(selected) >= 3:
                  break

          def fallback_score(row: dict[str, Any]) -> tuple[int, int, str]:
              title = str(row.get('title') or '')
              p = pages_of(row)
              date = str(row.get('publishDate') or '')
              score = 0
              for term, weight in [
                  ('首次覆盖', 180), ('公司深度', 170), ('深度报告', 160), ('公司动态研究报告', 120),
                  ('汽摩进气系统', 70), ('PEEK', 70), ('机器人', 45), ('新业务', 25), ('成长', 20),
              ]:
                  if compact(term) in compact(title):
                      score += weight
              if p >= 30: score += 90
              elif p >= 24: score += 75
              elif p >= 18: score += 60
              elif p >= 14: score += 40
              elif p >= 10: score += 20
              if date[:4] >= '2026': score += 35
              elif date[:4] >= '2025': score += 25
              return score, p, date

          if len(selected) < 3:
              for row in sorted(candidates, key=fallback_score, reverse=True):
                  code = str(row.get('infoCode') or '')
                  broker = str(row.get('orgSName') or row.get('orgName') or '券商')
                  if not code or code in used_codes or broker in used_brokers:
                      continue
                  row = dict(row)
                  row['_selection_label'] = '候选深度公司研究'
                  selected.append(row)
                  used_codes.add(code)
                  used_brokers.add(broker)
                  if len(selected) >= 3:
                      break

          print('CANDIDATES')
          for row in sorted(candidates, key=fallback_score, reverse=True)[:30]:
              print(json.dumps({k: row.get(k) for k in ['title','orgSName','orgName','publishDate','infoCode','attachPages','researcher','emRatingName','sRatingName']}, ensure_ascii=False), 'SCORE', fallback_score(row))

          if len(selected) < 2:
              raise RuntimeError(f'Only {len(selected)} suitable reports found')
          selected = selected[:3]

          def download_pdf(info_code: str) -> tuple[bytes, str, dict[str, Any]]:
              last = {}
              for prefix in ['H3','H2','H1','H4']:
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info_code}_1.pdf'
                  for attempt in range(8):
                      try:
                          r = session.get(url, timeout=(30, 480), allow_redirects=True, headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://data.eastmoney.com/report/',
                              'Accept': 'application/pdf,*/*;q=0.8',
                          })
                          last = {'url': url, 'status': r.status_code, 'final_url': r.url,
                                  'content_type': r.headers.get('content-type',''), 'bytes': len(r.content)}
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 100000:
                              return r.content, url, last
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          def safe_name(value: Any) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', str(value or ''))
              value = re.sub(r'\s+', '', value).strip('._')
              return value[:95] or '报告'

          manifest = []
          for idx, row in enumerate(selected, 1):
              info_code = str(row.get('infoCode') or '')
              data, pdf_url, download_meta = download_pdf(info_code)
              broker = str(row.get('orgSName') or row.get('orgName') or '券商')
              title = str(row.get('title') or '')
              date = str(row.get('publishDate') or '')[:10]
              filename = f'{idx:02d}_{safe_name(broker)}_恒勃股份_{safe_name(title)}_{date}.pdf'
              dest = PDF_DIR / filename
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages < 10:
                  raise RuntimeError(f'too few pages: {filename}: {actual_pages}')
              text = ''
              for page in reader.pages[:min(30, actual_pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              text_c = compact(text)
              if not any(compact(x) in text_c for x in [COMPANY, COMPANY_FULL, STOCK_CODE]):
                  raise RuntimeError(f'issuer identity mismatch: {filename}')
              broker_short = broker.replace('股份有限公司','').replace('有限责任公司','').replace('证券','')
              if compact(broker_short) and compact(broker_short) not in text_c and compact(broker) not in text_c:
                  raise RuntimeError(f'broker identity mismatch: {filename}')

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)], check=True,
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',
                              str(dest),str(prefix)], check=True,
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10000:
                  raise RuntimeError(f'preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'selection_label': row.get('_selection_label'),
                  'title': title,
                  'broker': broker,
                  'broker_full': row.get('orgName'),
                  'date': date,
                  'analysts': row.get('researcher'),
                  'rating': row.get('emRatingName') or row.get('sRatingName'),
                  'info_code': info_code,
                  'index_pages': row.get('attachPages'),
                  'actual_pages': actual_pages,
                  'bytes': len(data),
                  'filename': filename,
                  'pdf_url': pdf_url,
                  'source_report_page': f'https://data.eastmoney.com/report/info/{info_code}.html',
                  'sha256': sha,
                  'download_meta': download_meta,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'document_nature': '券商原始完整PDF',
                  'validation': ['PDF header','issuer identity','broker identity','minimum page count','qpdf structure','first-page render'],
              })

          readme = [
              '恒勃控股股份有限公司（301225.SZ）券商深度与首次覆盖报告资料包',
              f'整理基准日：{AS_OF}', '',
              f'本包收录{len(manifest)}份公开可直接取得并完成全文核验的券商原始完整PDF。',
              '筛选标准：优先近年首次覆盖、公司深度和长篇公司研究；排除年报、季报、中报、事件与公告短评。', ''
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；分析师：{item['analysts'] or '未列示'}；评级：{item['rating'] or '未列示'}",
                  f"   完整页数：{item['actual_pages']}页；文件：PDF原文/{item['filename']}",
                  f"   来源页面：{item['source_report_page']}",
                  f"   SHA-256：{item['sha256']}", ''
              ]
          readme += [
              '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商身份、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]

          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_reports.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  PDF原文/{item['filename']}\n" for item in manifest), encoding='utf-8'
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      z.write(path, arcname=f'{PACKAGE}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              pdfs = [name for name in z.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest) or not (2 <= len(pdfs) <= 3):
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}, manifest={len(manifest)}')

          short_path = Path('hengbo_301225_broker_deep_reports.zip')
          short_path.write_bytes(zip_path.read_bytes())
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print('REPORT_COUNT', len(manifest))
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hengbo-301225-broker-reports-final-20261028
          path: |
            恒勃股份_301225_券商深度与首次覆盖报告_完整版_3份_截至20261028.zip
            hengbo_301225_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
