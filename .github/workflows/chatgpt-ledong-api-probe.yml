name: Inspect Ledong Robotics public report APIs

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Call public report metadata and reader endpoints
        shell: bash
        run: |
          cat > /tmp/api_probe.py <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('api_output'); OUT.mkdir(exist_ok=True)
          base='https://api.fxbaogao.com'
          reports=['5593366','5608254','5637842','5646471']
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36',
              'Accept':'application/json, text/plain, */*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Origin':'https://www.fxbaogao.com',
              'Referer':'https://www.fxbaogao.com/',
              'CLIENT-TYPE-X':'pc',
              'version':'1.0.0',
              'user-id':'0',
              'user-token':'QQ',
              'x-fp':'',
              'x-bot':'',
          })
          # Establish anonymous visitor cookies and clock offset first.
          for rid in reports:
              try:
                  r=s.get(f'https://www.fxbaogao.com/view?id={rid}',timeout=60)
                  print('SEED',rid,r.status_code,len(r.content),s.cookies.get_dict())
              except Exception as e: print('SEED_ERR',rid,repr(e))
          try:
              import time
              now=int(time.time())
              r=s.get(base+f'/mofoun/common/param/time?now={now}',timeout=60)
              print('TIME',r.status_code,r.text[:1000])
          except Exception as e: print('TIME_ERR',repr(e))

          get_specs=[
              ('read', '/mofoun/report/readReport/readReport', lambda rid:{'reportId':rid}),
              ('preview', '/mofoun/report/report/getReportPreviewImages', lambda rid:{'reportId':rid}),
              ('catalog', '/mofoun/report/searchReport/detail/catalog', lambda rid:{'reportId':rid}),
              ('download_bean','/mofoun/report/report/downloadReportByBean',lambda rid:{'reportId':rid}),
              ('download_file','/mofoun/report/report/file/downloadReport',lambda rid:{'reportId':rid}),
              ('predown','/mofoun/report/report/report/preDownV2',lambda rid:{'reportId':rid}),
              ('afterpay','/mofoun/report/report/report/getUrlAfterPay',lambda rid:{'reportId':rid}),
          ]
          post_specs=[
              ('detail_reportid','/mofoun/report/searchReport/detail',lambda rid:{'reportId':int(rid)}),
              ('detail_id','/mofoun/report/searchReport/detail',lambda rid:{'id':int(rid)}),
              ('detail_docid','/mofoun/report/searchReport/detail',lambda rid:{'docId':int(rid)}),
              ('detail_data_reportid','/mofoun/report/searchReportData/detail',lambda rid:{'reportId':int(rid)}),
              ('detail_data_id','/mofoun/report/searchReportData/detail',lambda rid:{'id':int(rid)}),
          ]
          def dump_response(label,rid,r):
              ctype=str(r.headers.get('content-type') or '')
              data=r.content
              print('\nRESP',label,rid,'status',r.status_code,'url',r.url,'type',ctype,'bytes',len(data),'cookies',s.cookies.get_dict())
              print(r.text[:12000] if 'text' in ctype or 'json' in ctype else repr(data[:100]))
              ext='json' if 'json' in ctype else 'txt'
              (OUT/f'{rid}_{label}.{ext}').write_bytes(data)
              if 'json' in ctype:
                  try:
                      obj=r.json()
                      (OUT/f'{rid}_{label}_pretty.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
                      def walk(x,path=''):
                          if isinstance(x,dict):
                              for k,v in x.items():
                                  p=f'{path}.{k}' if path else k
                                  if any(t in k.lower() for t in ('pdf','path','url','page','file','image','preview','download','report')):
                                      print('FIELD',label,rid,p,'=',repr(v)[:3000])
                                  walk(v,p)
                          elif isinstance(x,list):
                              for i,v in enumerate(x[:300]): walk(v,f'{path}[{i}]')
                      walk(obj)
                  except Exception as e: print('JSON_PARSE_ERR',label,rid,repr(e))
          for rid in reports:
              headers={'Referer':f'https://www.fxbaogao.com/view?id={rid}','refer_url':urllib.parse.quote('https://www.fxbaogao.com/view',safe='')}
              for label,path,param_fn in get_specs:
                  try:
                      r=s.get(base+path,params=param_fn(rid),headers=headers,timeout=90,allow_redirects=True)
                      dump_response(label,rid,r)
                  except Exception as e: print('GET_ERR',label,rid,repr(e))
              for label,path,body_fn in post_specs:
                  try:
                      r=s.post(base+path,json=body_fn(rid),headers={**headers,'Content-Type':'application/json; charset=UTF-8'},timeout=90,allow_redirects=True)
                      dump_response(label,rid,r)
                  except Exception as e: print('POST_ERR',label,rid,repr(e))
          PY
          python /tmp/api_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_Robotics_API_Inspection
          path: api_output
          retention-days: 2
          if-no-files-found: error
