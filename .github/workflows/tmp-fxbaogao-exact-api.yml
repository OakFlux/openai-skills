name: Temporary fxbaogao exact API inspection

on:
  push:
    branches:
      - tmp/china-everbright-fxbaogao-exact-api-20260831

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Query exact public endpoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import requests

          out = Path('out')
          out.mkdir()
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/view?id=5040903',
          })
          urls = [
              'https://api.fxbaogao.com/mofoun/report/report/getReportCatalog?id=5040903',
              'https://api.fxbaogao.com/mofoun/report/report/getReportDetail?id=5040903',
              'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId=5040903',
              'https://api.fxbaogao.com/mofoun/report/report/downloadOrViewReport?reportId=5040903&userId=&actionType=view',
              'https://api.fxbaogao.com/mofoun/report/report/downloadOrViewReport?reportId=5040903&userId=&actionType=download',
              'https://api.fxbaogao.com/mofoun/report/report/downloadOrViewReport?reportId=5040903&actionType=view',
              'https://api.fxbaogao.com/mofoun/report/report/downloadOrViewReport?reportId=5040903&actionType=download',
          ]
          result = []
          for i, url in enumerate(urls):
              try:
                  r = s.get(url, timeout=45, allow_redirects=False)
                  item = {
                      'url': url,
                      'status': r.status_code,
                      'content_type': r.headers.get('content-type'),
                      'location': r.headers.get('location'),
                      'length': len(r.content),
                      'text': r.text,
                  }
                  result.append(item)
                  (out / f'response_{i}.bin').write_bytes(r.content)
                  print('RESPONSE', json.dumps(item, ensure_ascii=False)[:30000], flush=True)
              except Exception as exc:
                  item = {'url': url, 'error': repr(exc)}
                  result.append(item)
                  print('ERROR', json.dumps(item, ensure_ascii=False), flush=True)
          (out / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-exact-api
          path: out/
          retention-days: 3
          if-no-files-found: error