name: Build streamlined JST Group 06687 filings package 20260922

on:
  push:
    paths:
      - '.github/workflows/jst-group-06687-filings-package-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf

      - name: Build package from official HKEX documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          STOCK_ID='1000277318'
          PACKAGE='聚水潭_06687_全部年报_招股说明书及最新中期报告'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          previews=out/'首页预览'; previews.mkdir(exist_ok=True)
          session=requests.Session(); session.trust_env=False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept':'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def parse_size(s:str)->int:
              vals=[]
              for num,unit in re.findall(r'\(?\s*([0-9]+(?:\.[0-9]+)?)\s*(KB|MB)\s*\)?',s,re.I):
                  n=float(num)*(1024*1024 if unit.upper()=='MB' else 1024)
                  vals.append(int(n))
              return max(vals) if vals else 0

          def load_index(lang:str):
              url=f'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang={lang}&market=SEHK&stockId={STOCK_ID}'
              r=session.get(url,timeout=(20,90)); r.raise_for_status()
              soup=BeautifulSoup(r.content.decode('utf-8',errors='replace'),'lxml')
              items=[]
              for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href'])
                  if '/listedco/listconews/sehk/' not in href.lower() or '.pdf' not in href.lower():
                      continue
                  title=' '.join(a.get_text(' ',strip=True).split())
                  context=''
                  node=a
                  for _ in range(5):
                      node=node.parent
                      if node is None: break
                      txt=' '.join(node.get_text(' ',strip=True).split())
                      if len(txt)>len(context): context=txt
                      if node.name=='tr': break
                  items.append({'title':title,'url':href,'size_hint':parse_size(context),'context':context[:1000]})
              print('INDEX',lang,json.dumps(items,ensure_ascii=False),flush=True)
              return items

          indexes={'EN':load_index('EN'),'CN':load_index('ZH')}

          def match(kind,lang,item):
              t=item['title']; low=t.lower()
              if kind=='annual':
                  return ('2025' in t or '二零二五' in t) and ('annual report' in low or '年度報告' in t or '年報' in t)
              if kind=='prospectus':
                  return 'global offering' in low or '全球發售' in t
              if kind=='interim':
                  return ('2026' in t or '二零二六' in t) and ('interim report' in low or '中期報告' in t)
              return False

          def choose(kind,lang):
              c=[x for x in indexes[lang] if match(kind,lang,x)]
              if not c:
                  date_frag={'annual':'/2026/0427/','prospectus':'/2025/1013/','interim':'/2026/0910/'}[kind]
                  c=[x for x in indexes[lang] if date_frag in x['url']]
              if not c: raise RuntimeError(f'no index candidate for {kind} {lang}')
              # The full prospectus is the large GLOBAL OFFERING PDF, not the small formal notice.
              c.sort(key=lambda x:(x['size_hint'],len(x['title'])),reverse=True)
              print('CHOOSE',kind,lang,json.dumps(c,ensure_ascii=False),flush=True)
              return c[0]

          specs=[
              ('annual','CN','01_聚水潭_06687_2025年年度报告_中文版.pdf','聚水潭2025年年度报告（中文版）','2026-04-27',100,1_000_000),
              ('annual','EN','02_JST_Group_06687_2025_Annual_Report_English.pdf','JST Group 2025 Annual Report (English)','2026-04-27',100,1_000_000),
              ('prospectus','CN','03_聚水潭_06687_招股章程_中文版_2025-10-13.pdf','聚水潭招股章程（中文版）','2025-10-13',400,3_000_000),
              ('prospectus','EN','04_JST_Group_06687_Prospectus_English_2025-10-13.pdf','JST Group Prospectus (English)','2025-10-13',400,3_000_000),
              ('interim','CN','05_聚水潭_06687_2026年中期报告_中文版.pdf','聚水潭2026年中期报告（中文版）','2026-09-10',40,400_000),
              ('interim','EN','06_JST_Group_06687_2026_Interim_Report_English.pdf','JST Group 2026 Interim Report (English)','2026-09-10',40,400_000),
          ]

          def variants(u):
              out=[u]
              if 'www1.hkexnews.hk' in u: out.append(u.replace('www1.hkexnews.hk','www.hkexnews.hk'))
              return list(dict.fromkeys(out))

          def download(url,dest,min_bytes):
              errs=[]
              for u in variants(url):
                  for attempt in (1,2):
                      tmp=dest.with_suffix('.pdf.part')
                      try:
                          with session.get(u,timeout=(20,120),stream=True,allow_redirects=True,headers={'Referer':'https://www1.hkexnews.hk/'}) as r:
                              print('GET',dest.name,attempt,r.status_code,u,r.url,flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024*1024):
                                      if chunk: f.write(chunk)
                          if tmp.stat().st_size<min_bytes or not tmp.read_bytes()[:8].startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid response size={tmp.stat().st_size}')
                          tmp.replace(dest); return str(r.url)
                      except Exception as e:
                          errs.append(repr(e)); tmp.unlink(missing_ok=True)
              raise RuntimeError(f'download failed {dest.name}: {errs}')

          records=[]; hashes=set()
          for kind,lang,fn,title,date,min_pages,min_bytes in specs:
              item=choose(kind,lang)
              dest=out/fn
              final_url=download(item['url'],dest,min_bytes)
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<min_pages: raise RuntimeError(f'{fn}: pages={pages}, expected >= {min_pages}')
              text=''
              for p in reader.pages[:min(20,pages)]:
                  try: text+='\n'+(p.extract_text() or '')
                  except Exception: pass
              if not any(x.lower() in text.lower() for x in ('JST Group','聚水潭','6687')):
                  raise RuntimeError('company identity check failed '+fn)
              q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if q.returncode not in (0,3): raise RuntimeError('qpdf failed '+fn+' '+q.stderr[-1000:])
              sha=hashlib.sha256(dest.read_bytes()).hexdigest()
              if sha in hashes: raise RuntimeError('duplicate PDF '+fn)
              hashes.add(sha)
              preview=previews/(dest.stem+'_首页.png')
              rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(dest),str(preview.with_suffix(''))],capture_output=True,text=True)
              if rr.returncode or not preview.exists(): raise RuntimeError('render failed '+fn)
              records.append({'filename':fn,'title':title,'kind':kind,'language':lang,'disclosure_date':date,'source':'香港交易所披露易','source_url':final_url,'index_title':item['title'],'pages':pages,'bytes':dest.stat().st_size,'sha256':sha,'preview':str(preview.relative_to(out))})

          readme=[
              '聚水潭集团股份有限公司（06687.HK）港股官方披露文件','整理日期：2026-09-22','',
              '收录：上市后全部完整年度报告、最终招股章程，以及截至整理日最新完整阶段性财务报告。',
              '聚水潭于2025-10-21上市，故上市后完整年度报告目前只有2025年年度报告。',
              '最新完整阶段性财务报告为2026年中期报告；港股主板通常不按A股口径强制发布第一、第三季度报告。',
              '本包同时收录中英文官方原件。','', '文件清单：']
          for i,r in enumerate(records,1):
              readme += [f"{i}. {r['title']}",f"   文件：{r['filename']}",f"   披露日期：{r['disclosure_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          readme.append('核验：PDF文件头、公司身份、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。')
          (out/'00_文件清单与核验说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in sorted(out.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(out)}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure '+bad)
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=6: raise RuntimeError(f'PDF count {len(pdfs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest(),flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: jst-group-06687-filings-final-v2
          path: 聚水潭_06687_全部年报_招股说明书及最新中期报告.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
