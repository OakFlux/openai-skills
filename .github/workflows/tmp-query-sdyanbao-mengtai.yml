name: Temporary Query Sdyanbao for Mengtai Reports

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-query-sdyanbao-mengtai.yml

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search and fetch public report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests

          base='https://api.sdyanbao.com'
          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
            'Referer':'https://www.sdyanbao.com/report?keyword=%E8%92%99%E6%B3%B0%E9%AB%98%E6%96%B0',
            'Origin':'https://www.sdyanbao.com',
            'Content-Type':'application/json;charset=UTF-8',
            'Accept':'application/json,text/plain,*/*',
            'Device':'1',
            'X-Token':'',
          })
          queries=[
            '蒙泰高新',
            '丙纶长丝行业领跑者 双基地强势进军碳纤维',
            '丙纶景气触底 布局碳纤维打开新增量',
            '国内丙纶长丝龙头 募投扩产助力成长',
            '发行可转债 加码BCF和DTY布局',
          ]
          found={}
          for keyword in queries:
            payload={
              'device':1,'hideTrader':0,'onlyTitle':0,'order':0,
              'page':1,'pageSize':100,'keyword':keyword,'opFrom':1,
            }
            r=session.post(base+'/api/file/search',json=payload,timeout=60)
            print('SEARCH_META='+json.dumps({'keyword':keyword,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')},ensure_ascii=False))
            print('SEARCH_BODY='+json.dumps({'keyword':keyword,'body':r.text[:10000]},ensure_ascii=False))
            try:data=r.json()
            except Exception:continue
            def walk(value):
              if isinstance(value,dict):
                if 'id' in value and any(k in value for k in ('name','title','page_count','size','organization','keyword')):
                  yield value
                for v in value.values():yield from walk(v)
              elif isinstance(value,list):
                for v in value:yield from walk(v)
            for item in walk(data):
              blob=json.dumps(item,ensure_ascii=False)
              if '蒙泰高新' in blob or '300876' in blob or any(q[:8] in blob for q in queries[1:]):
                found[str(item.get('id'))]=item
          print('FOUND='+json.dumps(list(found.values()),ensure_ascii=False))
          for item_id,item in found.items():
            r=session.post(base+'/api/file/detail',json={'id':item_id,'opFrom':1},timeout=60)
            print('DETAIL_META='+json.dumps({'id':item_id,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')},ensure_ascii=False))
            print('DETAIL_BODY='+json.dumps({'id':item_id,'body':r.text[:20000]},ensure_ascii=False))
          PY
