name: Inspect Kent public report pages 20261020

on:
  push:
    branches:
      - tmp/kent-sina-report-inspect-20261020-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect page source and related scripts
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          targets=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/754040529033/index.phtml',
            'https://www.9fzt.com/detail/sz_301591_10_754040529033.html',
            'https://www.sgpjbg.com/baogao/146398.html',
          ]
          for u in targets:
              print('\n### TARGET',u)
              try:
                  r=s.get(u,timeout=(20,120),allow_redirects=True)
                  print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content))
                  encs=[r.encoding,r.apparent_encoding,'gb18030','utf-8']
                  text=None; used=None
                  for enc in encs:
                      if not enc: continue
                      try:
                          t=r.content.decode(enc)
                          if '<html' in t.lower() or '肯特' in t or 'report' in t.lower():
                              text=t; used=enc; break
                      except Exception: pass
                  if text is None:
                      text=r.content.decode('utf-8',errors='replace'); used='utf-8-replace'
                  print('ENC',used,'TITLE',BeautifulSoup(text,'lxml').title.get_text(' ',strip=True) if BeautifulSoup(text,'lxml').title else '')
                  soup=BeautifulSoup(text,'lxml')
                  links=[]
                  for tag in soup.find_all(['a','script','link','iframe','embed','object','form','source']):
                      for attr in ['href','src','data','action']:
                          v=tag.get(attr)
                          if not v: continue
                          full=urljoin(r.url,v)
                          label=tag.get_text(' ',strip=True)[:120]
                          low=(full+' '+label).lower()
                          if any(k in low for k in ['pdf','download','down','attach','file','report','rptid','754040529033','146398']):
                              links.append({'tag':tag.name,'attr':attr,'url':full,'label':label})
                  print('LINKS',json.dumps(links[:500],ensure_ascii=False,indent=2))
                  patterns={
                    'pdf_urls':r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                    'all_pdf_paths':r'[^\s\"\'<>]{0,200}\.pdf(?:\?[^\s\"\'<>]*)?',
                    'downloadish':r'[^\s\"\'<>]{0,180}(?:download|down|attach|file)[^\s\"\'<>]{0,220}',
                    'json_urls':r'https?://[^\s\"\'<>]+',
                  }
                  for name,pat in patterns.items():
                      vals=sorted(set(re.findall(pat,text,flags=re.I)))
                      print(name,json.dumps(vals[:500],ensure_ascii=False,indent=2))
                  for key in ['754040529033','肯特股份','高性能工程塑料零部件领先企业','pdf','download','attach','fileUrl','file_url','reportUrl','report_url']:
                      positions=[m.start() for m in re.finditer(re.escape(key),text,flags=re.I)]
                      for p in positions[:10]:
                          print('SNIP',key,re.sub(r'\s+',' ',text[max(0,p-500):p+1500]))
                  # Fetch relevant scripts referenced by page.
                  for item in links:
                      if item['tag']=='script' and item['url'].startswith(('http://','https://')):
                          try:
                              sr=s.get(item['url'],timeout=(20,120)); st=sr.content.decode(sr.encoding or sr.apparent_encoding or 'utf-8',errors='replace')
                              if any(k in st.lower() for k in ['pdf','download','report','rptid']):
                                  print('\nSCRIPT',item['url'],'STATUS',sr.status_code,'BYTES',len(sr.content))
                                  print(st[:20000])
                          except Exception as e:
                              print('SCRIPT_ERROR',item['url'],repr(e))
              except Exception as e:
                  print('ERROR',repr(e))
          PY
