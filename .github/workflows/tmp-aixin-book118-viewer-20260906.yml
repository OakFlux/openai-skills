name: Temporary Aixin Originality viewer inspection
on:
  push:
    branches:
      - tmp-aixin-book118-viewer-20260906
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Inspect viewer resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          urls = {
              'vip33': 'https://max.book118.com/html/2026/0616/8121016032010102.shtm',
              'free31': 'https://max.book118.com/html/2026/0616/8105134034010102.shtm',
          }
          out = Path('output')
          results = {}

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled'])
              context = browser.new_context(
                  viewport={'width': 1440, 'height': 1200},
                  locale='zh-CN',
                  timezone_id='Asia/Shanghai',
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36',
              )
              context.add_init_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined});")
              for name, url in urls.items():
                  page = context.new_page()
                  records = []
                  console = []
                  page.on('response', lambda response, records=records: records.append({
                      'url': response.url,
                      'status': response.status,
                      'type': response.request.resource_type,
                      'content_type': response.headers.get('content-type',''),
                      'content_length': response.headers.get('content-length',''),
                  }))
                  page.on('console', lambda msg, console=console: console.append({'type': msg.type, 'text': msg.text}))
                  try:
                      response = page.goto(url, wait_until='domcontentloaded', timeout=120000)
                      page.wait_for_timeout(12000)
                      for _ in range(18):
                          page.mouse.wheel(0, 900)
                          page.wait_for_timeout(400)
                      page.wait_for_timeout(3000)
                      title = page.title()
                      body = page.locator('body').inner_text(timeout=30000)
                      html = page.content()
                      images = page.locator('img').evaluate_all("els => els.map(e => ({src:e.currentSrc||e.src||'',alt:e.alt||'',width:e.naturalWidth||0,height:e.naturalHeight||0,cls:e.className||''})).filter(x=>x.src)")
                      frames = [frame.url for frame in page.frames]
                      controls = page.locator('a,button').evaluate_all("els => els.map(e => ({tag:e.tagName,text:(e.innerText||e.textContent||'').trim().slice(0,300),href:e.href||'',title:e.title||'',aria:e.getAttribute('aria-label')||'',onclick:e.getAttribute('onclick')||'',cls:e.className||''})).filter(x=>x.text||x.href||x.title||x.aria)")
                      scripts = page.locator('script').evaluate_all("els => els.map(e => ({src:e.src||'',text:(e.textContent||'').slice(0,5000)}))")
                      Path(f'output/{name}.html').write_text(html, encoding='utf-8')
                      Path(f'output/{name}_body.txt').write_text(body, encoding='utf-8')
                      Path(f'output/{name}_responses.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
                      Path(f'output/{name}_images.json').write_text(json.dumps(images, ensure_ascii=False, indent=2), encoding='utf-8')
                      Path(f'output/{name}_controls.json').write_text(json.dumps(controls, ensure_ascii=False, indent=2), encoding='utf-8')
                      Path(f'output/{name}_scripts.json').write_text(json.dumps(scripts, ensure_ascii=False, indent=2), encoding='utf-8')
                      Path(f'output/{name}_console.json').write_text(json.dumps(console, ensure_ascii=False, indent=2), encoding='utf-8')
                      page.screenshot(path=f'output/{name}.png', full_page=True)
                      result = {
                          'status': response.status if response else None,
                          'final_url': page.url,
                          'title': title,
                          'body_head': body[:4000],
                          'images': images,
                          'frames': frames,
                          'controls': controls,
                          'responses': records,
                      }
                      results[name] = result
                      print('\nPAGE', name, result['status'], title, page.url, 'IMAGES', len(images), 'RESPONSES', len(records), 'FRAMES', frames, flush=True)
                      print('BODY', body[:1500].replace('\n',' | '), flush=True)
                      for item in controls:
                          joined = ' '.join(str(item.get(key,'') or '') for key in item)
                          if any(key in joined.lower() for key in ['下载','预览','全文','原文','pdf','下一页','继续阅读','查看']):
                              print('CONTROL', json.dumps(item, ensure_ascii=False), flush=True)
                      for record in records:
                          joined = (record['url'] + ' ' + record['content_type']).lower()
                          if any(key in joined for key in ['pdf','preview','document','page','image','download','file','book118','showdoc','wenku','api']):
                              print('RESOURCE', json.dumps(record, ensure_ascii=False), flush=True)
                  except Exception as exc:
                      results[name] = {'error': repr(exc)}
                      print('ERROR', name, repr(exc), flush=True)
                  finally:
                      page.close()
              browser.close()

          Path('output/summary.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: aixin-originality-viewer-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
