name: Query Eastmoney for Air China Cargo reports 20260927

on:
  push:
    paths:
      - '.github/workflows/air-china-cargo-eastmoney-title-query-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Query report API variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,time,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          seen=set()
          for qtype in ['0','1','2','3']:
            for code_key in ['code','codes','stockCode']:
              params={
                'cb':'callback123456789','pageSize':'500','pageNo':'1','beginTime':'2025-12-25','endTime':'2026-01-10',
                'qType':qtype,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','rcode':'',
                code_key:'001391','_':str(int(time.time()*1000))
              }
              try:
                r=s.get(url,params=params,timeout=(20,90)); r.raise_for_status(); t=r.text.strip()
                m=re.match(r'^[^(]+\((.*)\)\s*;?$',t,re.S); obj=json.loads(m.group(1) if m else t)
                for x in obj.get('data') or []:
                  blob=json.dumps(x,ensure_ascii=False)
                  if ('国货航' in blob or '001391' in blob or '航空货运龙头顺势而为' in blob):
                    key=(x.get('infoCode'),x.get('title'))
                    if key in seen: continue
                    seen.add(key)
                    print('MATCH',json.dumps({k:x.get(k) for k in ['infoCode','title','stockName','stockCode','orgName','orgCode','publishDate','predictNextTwoYearEps','encodeUrl']},ensure_ascii=False),flush=True)
              except Exception as e:
                print('ERR',qtype,code_key,repr(e),flush=True)
          # Broad date query without code, all pages, title filter
          for qtype in ['0','1','2','3']:
            for page in range(1,11):
              params={'cb':'cbx','pageSize':'500','pageNo':str(page),'beginTime':'2025-12-25','endTime':'2026-01-10','qType':qtype,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','rcode':'','_':str(int(time.time()*1000))}
              try:
                r=s.get(url,params=params,timeout=(20,90)); r.raise_for_status(); t=r.text.strip(); m=re.match(r'^[^(]+\((.*)\)\s*;?$',t,re.S); obj=json.loads(m.group(1) if m else t)
                data=obj.get('data') or []
                for x in data:
                  blob=json.dumps(x,ensure_ascii=False)
                  if ('国货航' in blob or '001391' in blob or '航空货运龙头顺势而为' in blob):
                    key=(x.get('infoCode'),x.get('title'))
                    if key in seen: continue
                    seen.add(key)
                    print('BROAD_MATCH',json.dumps({k:x.get(k) for k in ['infoCode','title','stockName','stockCode','orgName','orgCode','publishDate','encodeUrl']},ensure_ascii=False),flush=True)
                if not data or page >= int(obj.get('TotalPage') or obj.get('totalPage') or 1): break
              except Exception as e:
                print('BROAD_ERR',qtype,page,repr(e),flush=True); break
          print('TOTAL_UNIQUE',len(seen),flush=True)
          PY
