name: Package Songzhi annual and quarterly reports

on:
  pull_request:
    paths:
      - 'tasks/songzhi-financials-20261004.trigger'
  workflow_dispatch:

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import html
          import json
          import pathlib
          import re
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          from pypdf import PdfReader

          STOCK = '002454'
          COMPANY = '松芝股份'
          TODAY = dt.date(2026, 10, 4)
          root = pathlib.Path('dist')
          work = pathlib.Path('work')
          package = work / '松芝股份_002454_2020-2025年报及最新季报'
          root.mkdir(parents=True, exist_ok=True)
          package.mkdir(parents=True, exist_ok=True)

          def get_json(url, retries=5):
              last = None
              for attempt in range(1, retries + 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36',
                              'Referer': 'https://data.eastmoney.com/',
                              'Accept': 'application/json,text/plain,*/*',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=45) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as exc:
                      last = exc
                      time.sleep(attempt * 2)
              raise RuntimeError(f'JSON request failed: {url}: {last}')

          def clean_title(value):
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', '', value)
              return re.sub(r'\s+', '', value)

          announcements = []
          for page in range(1, 61):
              params = {
                  'sr': '-1',
                  'page_size': '100',
                  'page_index': str(page),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': STOCK,
              }
              url = 'https://np-anotice-stock.eastmoney.com/api/security/ann?' + urllib.parse.urlencode(params)
              payload = get_json(url)
              data = payload.get('data') or {}
              rows = data.get('list') or []
              if not rows:
                  break
              for row in rows:
                  item = dict(row)
                  item['clean_title'] = clean_title(row.get('title') or row.get('title_ch') or '')
                  announcements.append(item)
              dates = [str(x.get('notice_date') or x.get('display_time') or '')[:10] for x in rows]
              if dates and min(dates) < '2019-01-01':
                  break
              time.sleep(0.25)

          if not announcements:
              raise RuntimeError('No announcements returned by Eastmoney API')

          def notice_date(item):
              return str(item.get('notice_date') or item.get('display_time') or '')[:10]

          def version_score(title, phrase):
              score = 0
              if title.endswith(phrase):
                  score += 100
              if title in (phrase, f'{COMPANY}:{phrase}', f'{COMPANY}：{phrase}'):
                  score += 1000
              if any(k in title for k in ('修订版', '更新后', '更正后')):
                  score += 300
              if '正文' in title:
                  score -= 50
              return score

          def select_report(phrase):
              excluded = ('摘要', '英文版', '审计报告', '审核报告', '意见', '说明', '问询函', '回复', '取消')
              candidates = []
              for item in announcements:
                  title = item['clean_title']
                  if phrase not in title:
                      continue
                  if any(word in title for word in excluded):
                      continue
                  candidates.append(item)
              if not candidates:
                  nearby = [x['clean_title'] for x in announcements if phrase[:5] in x['clean_title']][:30]
                  raise RuntimeError(f'Missing report {phrase}; nearby titles={nearby}')
              candidates.sort(key=lambda x: (version_score(x['clean_title'], phrase), notice_date(x)), reverse=True)
              return candidates[0]

          requested = []
          for year in range(2020, 2026):
              phrase = f'{year}年年度报告'
              requested.append((f'{year}年年度报告', select_report(phrase)))
          requested.append(('2026年第一季度报告', select_report('2026年第一季度报告')))

          def download_pdf(item, dest):
              code = item.get('art_code') or item.get('artCode') or item.get('announcementId')
              if not code:
                  raise RuntimeError(f'No art_code for {item}')
              candidates = []
              for key in ('attach_url', 'adjunct_url', 'pdf_url', 'url'):
                  value = item.get(key)
                  if isinstance(value, str) and value.startswith('http'):
                      candidates.append(value)
              candidates.extend([
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
              ])
              last = None
              for url in dict.fromkeys(candidates):
                  for attempt in range(1, 4):
                      try:
                          req = urllib.request.Request(
                              url,
                              headers={
                                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36',
                                  'Referer': 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                          )
                          with urllib.request.urlopen(req, timeout=60) as r:
                              blob = r.read()
                          if not blob.startswith(b'%PDF'):
                              raise RuntimeError(f'not PDF, head={blob[:20]!r}')
                          if len(blob) < 100_000:
                              raise RuntimeError(f'PDF too small: {len(blob)} bytes')
                          dest.write_bytes(blob)
                          reader = PdfReader(str(dest), strict=False)
                          pages = len(reader.pages)
                          if pages < 3:
                              raise RuntimeError(f'Unexpected page count: {pages}')
                          return url, pages
                      except Exception as exc:
                          last = exc
                          if dest.exists():
                              dest.unlink()
                          time.sleep(attempt * 1.5)
              raise RuntimeError(f'Failed to download {item.get("clean_title")}: {last}')

          manifest = []
          sha_lines = []
          for idx, (label, item) in enumerate(requested, start=1):
              date = notice_date(item)
              filename = f'{idx:02d}_松芝股份_{label}_披露日期{date}.pdf'
              dest = package / filename
              source_url, pages = download_pdf(item, dest)
              digest = hashlib.sha256(dest.read_bytes()).hexdigest()
              entry = {
                  'label': label,
                  'announcement_title': item['clean_title'],
                  'notice_date': date,
                  'art_code': item.get('art_code') or item.get('artCode'),
                  'source_pdf_url': source_url,
                  'file_name': filename,
                  'bytes': dest.stat().st_size,
                  'pages': pages,
                  'sha256': digest,
              }
              manifest.append(entry)
              sha_lines.append(f'{digest}  {filename}')

          readme_lines = [
              '# 松芝股份（002454.SZ）2020-2025年年度报告及最新季度报告',
              '',
              f'打包日期：{TODAY.isoformat()}',
              '',
              '本资料包包含2020年至2025年六份完整年度报告，以及截至打包日已披露的最新季度报告《2026年第一季度报告》。2026年三季度报告截至2026年10月4日尚未披露。',
              '',
              '## 文件清单',
              '',
          ]
          for entry in manifest:
              readme_lines.append(f"- {entry['file_name']}（{entry['pages']}页，公告日期{entry['notice_date']}）")
          readme_lines += [
              '',
              '## 校验与来源',
              '',
              '所有PDF均从东方财富公告镜像下载，并使用pypdf完成结构及页数校验。原公告代码、PDF来源地址、文件大小、页数及SHA-256见manifest.json；校验值另见SHA256SUMS.txt。',
              '',
              '材料仅供研究与存档，不构成投资建议。',
          ]
          (package / 'README.md').write_text('\n'.join(readme_lines) + '\n', encoding='utf-8')
          (package / 'manifest.json').write_text(
              json.dumps({'company': COMPANY, 'ticker': '002454.SZ', 'package_date': TODAY.isoformat(), 'reports': manifest}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          (package / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          zip_path = root / '松芝股份_002454_2020-2025年报及最新季报.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(package.rglob('*')):
                  if path.is_file():
                      zf.write(path, arcname=f'{package.name}/{path.relative_to(package)}')

          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure at {bad}')

          print(json.dumps({'zip': str(zip_path), 'reports': manifest}, ensure_ascii=False, indent=2))
          PY

      - name: Upload packaged ZIP
        uses: actions/upload-artifact@v4
        with:
          name: songzhi-financials-artifact
          path: dist/松芝股份_002454_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 7
