name: Fast Sdyanbao Yongtai report search 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-sdy-search-fast-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Search exact reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          s=requests.Session();s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*',
            'Content-Type':'application/json;charset=UTF-8','Origin':'https://www.sdyanbao.com',
            'Referer':'https://www.sdyanbao.com/report'
          })
          queries=['永太科技','从含氟精细化学品出发','氟化工龙头']
          out=[]; ids={296135}
          for q in queries:
            payload={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
            try:
              r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=(10,20))
              try: body=r.json()
              except Exception: body={'text':r.text[:10000]}
              out.append({'kind':'search','q':q,'status':r.status_code,'bytes':len(r.content),'body':body})
              print('SEARCH',q,r.status_code,len(r.content));print(json.dumps(body,ensure_ascii=False)[:100000])
              data=body.get('data') if isinstance(body,dict) else None
              if isinstance(data,dict):
                for row in data.get('files') or []:
                  if isinstance(row,dict) and row.get('id') is not None:
                    ids.add(int(row['id']))
            except Exception as e:
              out.append({'kind':'search','q':q,'error':repr(e)});print('ERR',q,repr(e))
          for fid in sorted(ids):
            try:
              r=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':fid},timeout=(10,20))
              try: body=r.json()
              except Exception: body={'text':r.text[:10000]}
              out.append({'kind':'detail','id':fid,'status':r.status_code,'bytes':len(r.content),'body':body})
              print('DETAIL',fid,r.status_code,len(r.content));print(json.dumps(body,ensure_ascii=False)[:100000])
            except Exception as e:
              out.append({'kind':'detail','id':fid,'error':repr(e)});print('ERR DETAIL',fid,repr(e))
          Path('sdyanbao_yongtai_fast.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-yongtai-fast
          path: sdyanbao_yongtai_fast.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
