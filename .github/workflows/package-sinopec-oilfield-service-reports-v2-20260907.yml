name: Package Sinopec Oilfield Service financial reports v2 20260907

on:
  push:
    branches:
      - chatgpt-sinopec-oilfield-reports-20260907
    paths:
      - scripts/package_sinopec_oilfield_service_reports_20260907.py
      - scripts/package_sinopec_oilfield_service_reports_v2_20260907.py
      - .github/workflows/package-sinopec-oilfield-service-reports-v2-20260907.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package reports
        run: |
          set -o pipefail
          python scripts/package_sinopec_oilfield_service_reports_v2_20260907.py 2>&1 | tee sinopec_oilfield_service_packaging_v2.log

      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: sinopec-oilfield-service-2020-2025-annual-and-2026-latest-reports-v2
          path: dist_sinopec_oilfield_service_20260907/*.zip
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sinopec-oilfield-service-report-packaging-v2-diagnostics
          path: |
            sinopec_oilfield_service_packaging_v2.log
            _work_sinopec_oilfield_service_20260907/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
