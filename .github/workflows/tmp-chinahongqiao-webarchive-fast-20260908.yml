name: Create China Hongqiao report web archive PDFs
on:
  push:
    branches:
      - tmp-chinahongqiao-webarchive-fast-20260908
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet playwright pypdf
      - name: Print public report pages and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/package
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, re, shutil, zipfile
          from pathlib import Path
          from pypdf import PdfReader
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          reports = [
              {'broker':'华创证券','date':'2025-05-27','title':'全球电解铝龙头，一体化打造盈利护城河，高分红属性明显','url':'https://www.fxbaogao.com/detail/4864892'},
              {'broker':'西部证券','date':'2025-04-21','title':'高景气+一体化+高分红，电解铝龙头静待价值重估','url':'https://www.fxbaogao.com/detail/4802165'},
              {'broker':'信达证券','date':'2024-05-16','title':'中国宏桥公司深度研究报告','url':'https://www.fxbaogao.com/detail/4307103'},
          ]
          out=Path('output/package')
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          manifest=[]
          errors=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
              ctx=browser.new_context(user_agent=ua,locale='zh-CN',viewport={'width':1440,'height':1200})
              for idx,r in enumerate(reports,1):
                  page=ctx.new_page()
                  try:
                      resp=page.goto(r['url'],wait_until='domcontentloaded',timeout=90000)
                      try: page.wait_for_load_state('networkidle',timeout=25000)
                      except PWTimeout: pass
                      page.wait_for_timeout(2500)
                      body=' '.join(page.locator('body').inner_text(timeout=15000).split())
                      body_identity=('中国宏桥' in body or 'China Hongqiao' in body)
                      if not body_identity:
                          raise RuntimeError('page identity check failed')
                      if len(body) < 5000:
                          raise RuntimeError(f'page text too short: {len(body)}')
                      page.evaluate("""() => {
                        const sels=['header','nav','footer','.header','.footer','.right','.right-view','.sidebar','.fixed','.float','.tool','.tools','.recommend','.recommend-list','.advertisement','.ad','.ant-back-top','.el-dialog__wrapper','.modal','.mask'];
                        for (const s of sels) document.querySelectorAll(s).forEach(e=>e.remove());
                        document.querySelectorAll('script,noscript').forEach(e=>e.remove());
                        for (const e of document.querySelectorAll('*')) {
                          e.style.maxHeight='none';
                          e.style.overflow='visible';
                          if (getComputedStyle(e).position === 'fixed' || getComputedStyle(e).position === 'sticky') e.style.position='static';
                        }
                        document.body.style.background='white';
                        document.body.style.color='black';
                        document.body.style.maxWidth='760px';
                        document.body.style.margin='0 auto';
                      }""")
                      page.add_style_tag(content='''
                        @page { size: A4; margin: 13mm 12mm; }
                        body, body * { font-family: Arial, "Noto Sans CJK SC", sans-serif !important; line-height: 1.72 !important; }
                        body { font-size: 16px !important; width: 760px !important; }
                        p, li, div, span { font-size: 15px !important; }
                        h1 { font-size: 25px !important; }
                        h2 { font-size: 21px !important; }
                        h3 { font-size: 18px !important; }
                        img { max-width: 100% !important; height: auto !important; page-break-inside: avoid; }
                        table { width: 100% !important; page-break-inside: auto; }
                        tr { page-break-inside: avoid; }
                      ''')
                      safe=re.sub(r'[\\/:*?"<>|]+','_',r['title'])[:70]
                      name=f"{idx:02d}_{r['date']}_{r['broker']}_{safe}_网页公开存档版.pdf"
                      path=out/name
                      page.emulate_media(media='print')
                      page.pdf(path=str(path),format='A4',print_background=True,prefer_css_page_size=True)
                      reader=PdfReader(str(path)); pages=len(reader.pages)
                      text=''.join((reader.pages[i].extract_text() or '') for i in range(pages))
                      compact=re.sub(r'\s+','',text)
                      if pages < 3 or len(compact) < 3000 or path.stat().st_size < 100000:
                          raise RuntimeError(f'PDF validation failed pages={pages}, text={len(compact)}, bytes={path.stat().st_size}')
                      manifest.append({'序号':idx,'券商':r['broker'],'报告日期':r['date'],'报告标题':r['title'],'版本':'公开网页存档版（非券商原始PDF）','页数':pages,'网页正文身份校验':'通过','可检索文本字符数':len(compact),'文件大小_字节':path.stat().st_size,'SHA256':hashlib.sha256(path.read_bytes()).hexdigest(),'公开来源':r['url'],'文件名':name})
                  except Exception as exc:
                      errors.append({'report':r,'error':repr(exc)})
                  finally:
                      page.close()
              browser.close()

          if len(manifest)<2:
              raise RuntimeError(f'Only {len(manifest)} valid archive PDFs: {errors}')
          with (out/'报告清单.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(manifest[0].keys())); w.writeheader(); w.writerows(manifest)
          readme=['中国宏桥（01378.HK）券商深度报告包','',f'共收录 {len(manifest)} 份。','这些文件由公开报告详情页打印存档，便于离线阅读；不是券商发布的原始 PDF，文件名和清单已明确标注。','']
          readme += [f"{x['序号']}. {x['券商']}｜{x['报告日期']}｜{x['报告标题']}｜{x['页数']}页" for x in manifest]
          (out/'README.txt').write_text('\n'.join(readme),encoding='utf-8')
          z=Path('output/China_Hongqiao_01378_Broker_Deep_Reports_Working_Link.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
              for p in sorted(out.iterdir()): zz.write(p,p.name)
          with zipfile.ZipFile(z) as zz:
              bad=zz.testzip(); assert bad is None,bad
              assert len([n for n in zz.namelist() if n.lower().endswith('.pdf')]) >= 2
          status={'ok':True,'zip':str(z),'zip_bytes':z.stat().st_size,'zip_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'reports':manifest,'errors':errors}
          Path('output/status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_STATUS',json.dumps(status,ensure_ascii=False),flush=True)
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: china-hongqiao-working-link
          path: output/*
          retention-days: 1
          if-no-files-found: error
