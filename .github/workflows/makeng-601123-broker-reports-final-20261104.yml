name: Build final Makeng Mining broker report package

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-broker-reports-final-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2' reportlab
      - name: Download, create, verify and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, re, shutil, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.pdfbase import pdfmetrics
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak

          COMPANY='马矿股份'; FULL='福建马坑矿业股份有限公司'; CODE='601123'; CUTOFF='2026-11-04'; COMPACT='20261104'
          ROOT_NAME=f'{COMPANY}_{CODE}_券商研究报告_精选2份_截至{COMPACT}'
          ROOT=Path('work')/ROOT_NAME; REPORTS=ROOT/'报告PDF'; PREVIEWS=ROOT/'首页预览'; DIST=Path('dist')
          for p in (REPORTS,PREVIEWS,DIST): p.mkdir(parents=True,exist_ok=True)

          session=requests.Session(); session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})

          def digest(path: Path) -> str:
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          # 1) Original full PDF from Huajin Securities.
          huajin_url='https://pdf.dfcfw.com/pdf/H3_AP202608291828704120_1.pdf'
          response=session.get(huajin_url,headers={'Referer':'https://data.eastmoney.com/report/info/AP202608291828704120.html'},timeout=180,allow_redirects=True)
          print('DOWNLOAD_HUAJIN',response.status_code,len(response.content),response.url,flush=True)
          response.raise_for_status()
          if len(response.content)<300000 or not response.content.startswith(b'%PDF'):
              raise RuntimeError('华金证券PDF下载内容不完整')
          original=REPORTS/'01_华金证券_2026-08-28_新股覆盖研究_马矿股份_原始完整版.pdf'
          original.write_bytes(response.content)

          reader=PdfReader(str(original),strict=False)
          if reader.is_encrypted: reader.decrypt('')
          pages_original=len(reader.pages)
          text=''
          for i in range(min(6,pages_original)):
              try:text+=reader.pages[i].extract_text() or ''
              except Exception:pass
          compact=re.sub(r'\s+','',text)
          if pages_original!=14 or ('马矿股份' not in compact and CODE not in compact) or '华金证券' not in compact:
              raise RuntimeError(f'华金证券PDF校验失败: pages={pages_original}')

          # 2) Public-summary compilation for Guotai Haitong first coverage.
          pdfmetrics.registerFont(UnicodeCIDFont('STSong-Light'))
          summary=REPORTS/'02_国泰海通证券_2026-10-23_首次覆盖_原矿产量将扩大一倍_公开摘要整理版.pdf'
          styles=getSampleStyleSheet()
          base=ParagraphStyle('BaseCN',parent=styles['BodyText'],fontName='STSong-Light',fontSize=10.3,leading=16,spaceAfter=6,textColor=colors.HexColor('#222222'))
          title_style=ParagraphStyle('TitleCN',parent=base,fontSize=20,leading=28,alignment=TA_CENTER,spaceAfter=12,textColor=colors.HexColor('#111111'))
          subtitle=ParagraphStyle('SubtitleCN',parent=base,fontSize=11.5,leading=18,alignment=TA_CENTER,spaceAfter=18,textColor=colors.HexColor('#444444'))
          h1=ParagraphStyle('H1CN',parent=base,fontSize=14,leading=20,spaceBefore=10,spaceAfter=8,textColor=colors.HexColor('#111111'))
          small=ParagraphStyle('SmallCN',parent=base,fontSize=8.5,leading=13,textColor=colors.HexColor('#555555'))
          warning=ParagraphStyle('WarningCN',parent=base,fontSize=10.2,leading=16,textColor=colors.HexColor('#8A1C1C'),borderColor=colors.HexColor('#B74A4A'),borderWidth=0.8,borderPadding=8,backColor=colors.HexColor('#FFF4F4'),spaceAfter=14)

          def footer(canvas,doc):
              canvas.saveState(); canvas.setFont('STSong-Light',8); canvas.setFillColor(colors.HexColor('#666666'))
              canvas.drawString(18*mm,10*mm,'公开摘要整理版 - 非券商原始完整版PDF')
              canvas.drawRightString(192*mm,10*mm,f'第 {doc.page} 页')
              canvas.restoreState()

          doc=SimpleDocTemplate(str(summary),pagesize=A4,rightMargin=18*mm,leftMargin=18*mm,topMargin=18*mm,bottomMargin=18*mm,title='马矿股份：原矿产量将扩大一倍（公开摘要整理版）',author='基于公开网页摘要整理')
          story=[]
          story += [Paragraph('马矿股份（601123）：原矿产量将扩大一倍',title_style),Paragraph('国泰海通证券首次覆盖报告 - 公开摘要整理版',subtitle)]
          story.append(Paragraph('<b>重要说明：</b>本文件依据公开网页展示的券商研报摘要进行结构化整理，便于与原始公司资料配套查阅。它不是国泰海通证券发布的原始完整版PDF，不包含原报告全部图表、模型明细和免责声明。原始完整版在公开下载渠道中未能稳定取得。',warning))
          meta=[
              ['报告机构','国泰海通证券股份有限公司'],['报告日期','2026年10月23日'],['报告类型','公司研究 / 首次覆盖'],['研究人员','李鹏飞、刘彦奇、魏雨迪、王宏玉'],['公开评级','增持（首次覆盖）'],['公开目标价','15.75元'],['整理截止日',CUTOFF]
          ]
          table=Table([[Paragraph(str(c),base) for c in row] for row in meta],colWidths=[34*mm,122*mm],hAlign='LEFT')
          table.setStyle(TableStyle([('GRID',(0,0),(-1,-1),0.35,colors.HexColor('#B8B8B8')),('BACKGROUND',(0,0),(0,-1),colors.HexColor('#F2F2F2')),('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),6),('RIGHTPADDING',(0,0),(-1,-1),6),('TOPPADDING',(0,0),(-1,-1),6),('BOTTOMPADDING',(0,0),(-1,-1),6)]))
          story += [table,Spacer(1,8*mm)]

          story += [Paragraph('一、核心判断',h1),Paragraph('报告将马矿股份定位为拥有区域与资源优势的独立铁矿采选企业。公司主要产品为铁精粉和伴生钼精矿，铁精粉构成收入主体。福建省本地铁矿供给有限，而公司靠近区域钢铁客户，运输距离较短，形成一定区位优势。',base),Paragraph('增长逻辑主要来自马坑铁矿采选扩能工程。募投项目拟新增500万吨/年铁矿石采选产能，项目完成后原矿生产规模预计由500万吨/年扩大至1000万吨/年，铁精粉和钼精矿产量也将相应增长。项目建设期较长，产能释放需要分阶段观察。',base)]

          story += [Paragraph('二、业务结构与资源禀赋',h1)]
          bullets=[
              '公司拥有马坑铁矿采矿权，主营铁矿石采选、综合利用以及铁精粉、钼精矿销售。',
              '2025年铁精粉约占主营业务收入的90%，钼精矿约占8%；钼精矿为铁矿伴生产品，对盈利形成补充。',
              '福建区域铁矿资源相对短缺，公司周边存在大型钢铁客户，产品运输半径与区域供需关系构成竞争优势。',
              '钼精矿价格具有较强周期性。公开摘要指出，2026年前三季度钼精矿均价同比上升，但后续价格仍可能波动。'
          ]
          for b in bullets: story.append(Paragraph('• '+b,base))

          story += [Paragraph('三、盈利预测与估值',h1)]
          forecast=[['项目','2026E','2027E','2028E'],['归母净利润（亿元）','7.04','7.16','7.20'],['每股收益（元）','0.57','0.58','0.58']]
          ft=Table([[Paragraph(str(c),base) for c in row] for row in forecast],colWidths=[55*mm,33*mm,33*mm,33*mm],hAlign='LEFT')
          ft.setStyle(TableStyle([('GRID',(0,0),(-1,-1),0.45,colors.HexColor('#AFAFAF')),('BACKGROUND',(0,0),(-1,0),colors.HexColor('#EDEDED')),('ALIGN',(1,1),(-1,-1),'CENTER'),('VALIGN',(0,0),(-1,-1),'MIDDLE'),('TOPPADDING',(0,0),(-1,-1),7),('BOTTOMPADDING',(0,0),(-1,-1),7)]))
          story += [ft,Spacer(1,4*mm),Paragraph('公开摘要显示，报告综合参考国内可比铁矿上市公司的市盈率水平，并考虑矿产品价格波动，给出15.75元目标价以及“增持”首次覆盖评级。以上预测与目标价均为券商在报告发布日的判断，不代表当前估值或投资建议。',base)]

          story += [PageBreak(),Paragraph('四、产能扩张的验证重点',h1)]
          checks=[
              ['验证事项','需要持续跟踪的指标'],
              ['项目进度','扩能工程建设节点、设备安装与投产时间、资本开支执行率'],
              ['产量兑现','原矿处理量、铁精粉产量、钼精矿产量及产销率'],
              ['价格与盈利','区域铁精粉售价、钼精矿价格、单位采选成本、综合毛利率'],
              ['客户与运输','主要钢厂客户采购量、销售半径、运输成本及区域价格差'],
              ['现金流','扩产期经营现金流、在建工程、折旧增加与融资安排']
          ]
          ct=Table([[Paragraph(str(c),base) for c in row] for row in checks],colWidths=[35*mm,121*mm],hAlign='LEFT')
          ct.setStyle(TableStyle([('GRID',(0,0),(-1,-1),0.4,colors.HexColor('#B3B3B3')),('BACKGROUND',(0,0),(-1,0),colors.HexColor('#EDEDED')),('VALIGN',(0,0),(-1,-1),'TOP'),('TOPPADDING',(0,0),(-1,-1),7),('BOTTOMPADDING',(0,0),(-1,-1),7),('LEFTPADDING',(0,0),(-1,-1),6),('RIGHTPADDING',(0,0),(-1,-1),6)]))
          story += [ct]

          story += [Paragraph('五、公开披露的主要风险',h1)]
          risks=[
              '宏观固定资产投资及生铁产量下降，可能压低铁精粉需求和价格。',
              '全球铁矿石供给增加、需求放缓，可能通过进口矿价格传导至国内铁精粉价格。',
              '钼精矿价格在上涨后可能出现较大波动，影响伴生矿收益。',
              '扩能项目建设期较长，存在进度、投资额、达产节奏和产能消化不及预期的风险。',
              '矿山企业还需持续关注安全生产、环保合规和资源开发政策变化。'
          ]
          for b in risks: story.append(Paragraph('• '+b,base))

          story += [Paragraph('六、来源与使用边界',h1),Paragraph('主要整理来源：新浪财经公开展示的国泰海通证券报告摘要，页面标题为《马矿股份(601123)：原矿产量将扩大一倍》，发布日期为2026年10月23日。该公开页面披露了研究人员、首次覆盖评级、盈利预测、目标价、主要业务逻辑与风险提示。',base),Paragraph('本整理文件仅用于资料归档与研究线索梳理。涉及盈利预测、估值、目标价和评级的内容均保留其原报告时点属性，不构成投资建议。',warning)]
          story += [Spacer(1,8*mm),Paragraph('公开摘要页面：https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/846069340415/index.phtml',small)]
          doc.build(story,onFirstPage=footer,onLaterPages=footer)

          # Validate and render both PDFs.
          records=[]
          metadata=[
              (original,'华金证券','2026-08-28','新股覆盖研究：马矿股份','李蕙、戴筝筝','原始完整PDF',huajin_url),
              (summary,'国泰海通证券','2026-10-23','马矿股份（601123）：原矿产量将扩大一倍','李鹏飞、刘彦奇、魏雨迪、王宏玉','公开摘要整理版（非原始完整版）','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/846069340415/index.phtml')
          ]
          for path,broker,date,title,authors,format_label,source in metadata:
              rd=PdfReader(str(path),strict=False)
              if rd.is_encrypted: rd.decrypt('')
              pages=len(rd.pages)
              docfitz=fitz.open(path)
              if docfitz.page_count!=pages: raise RuntimeError(f'双解析器页数不一致: {path}')
              first=docfitz.load_page(0).get_pixmap(matrix=fitz.Matrix(1.6,1.6),alpha=False)
              last=docfitz.load_page(docfitz.page_count-1).get_pixmap(matrix=fitz.Matrix(1.0,1.0),alpha=False)
              if min(first.width,first.height,last.width,last.height)<100: raise RuntimeError(f'渲染失败: {path}')
              first.save(PREVIEWS/f'{path.stem}_首页.png'); last.save(PREVIEWS/f'{path.stem}_末页.png')
              probe=''
              for i in range(min(6,pages)):
                  try:probe+=rd.pages[i].extract_text() or ''
                  except Exception:pass
              cp=re.sub(r'\s+','',probe)
              if COMPANY not in cp and CODE not in cp: raise RuntimeError(f'公司身份校验失败: {path}')
              if broker.replace('证券','') not in cp and broker not in cp: raise RuntimeError(f'机构身份校验失败: {path}')
              docfitz.close()
              records.append({'broker':broker,'date':date,'title':title,'authors':authors,'file_format':format_label,'relative_path':str(path.relative_to(ROOT)).replace(os.sep,'/'),'file_name':path.name,'page_count':pages,'file_size_bytes':path.stat().st_size,'sha256':digest(path),'source_url':source,'pdf_header_valid':path.read_bytes().startswith(b'%PDF'),'first_page_rendered':True,'last_page_rendered':True,'company_identity_validated':True})
              print('VERIFIED',json.dumps(records[-1],ensure_ascii=False),flush=True)

          manifest={'company':COMPANY,'full_company_name':FULL,'stock_code':CODE,'cutoff_date':CUTOFF,'document_count':2,'total_pages':sum(r['page_count'] for r in records),'selection_note':'公司上市时间较短。公开渠道中仅核实到1份可直接取得的券商原始完整PDF；另收录1份根据券商公开网页摘要制作的整理版，已在文件名和首页明确标注。','documents':records,'generated_at_utc':datetime.now(timezone.utc).isoformat()}
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records)+'\n',encoding='utf-8')
          readme=[f'# {COMPANY}（{CODE}）券商研究报告精选','',f'- 截止日期：{CUTOFF}','- 共2份PDF：1份券商原始完整PDF，1份公开摘要整理版。','- 公开摘要整理版不是券商原始完整版，文件名及首页已明确标注。','- 已完成PDF文件头、双解析器页数、公司与机构身份、首末页渲染、SHA-256及ZIP CRC校验。','','## 文件清单','']
          for i,r in enumerate(records,1):
              readme += [f"{i}. `{r['relative_path']}`",f"   - 机构：{r['broker']}；日期：{r['date']}",f"   - 标题：{r['title']}",f"   - 研究人员：{r['authors']}",f"   - 文件性质：{r['file_format']}；页数：{r['page_count']}",f"   - 来源：{r['source_url']}",f"   - SHA-256：`{r['sha256']}`"]
          (ROOT/'README.md').write_text('\n'.join(readme)+'\n',encoding='utf-8')

          cn=DIST/f'{ROOT_NAME}.zip'; en=DIST/f'makeng_mining_601123_broker_research_reports_2_{COMPACT}.zip'
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,str(p.relative_to(ROOT.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for p in (cn,en):
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad: raise RuntimeError(f'ZIP CRC失败: {bad}')
                  pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
                  if len(pdfs)!=2: raise RuntimeError(f'PDF数量异常: {len(pdfs)}')
              print('ZIP_VERIFIED',p,p.stat().st_size,digest(p),flush=True)
          print('FINAL_JSON',json.dumps({'document_count':2,'total_pages':sum(r['page_count'] for r in records),'chinese_zip':str(cn),'english_zip':str(en),'zip_size':cn.stat().st_size,'zip_sha256':digest(cn),'records':records},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-601123-broker-reports-final-20261104
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
