name: Temporary Galaxy Microelectronics Huayuan source probe

on:
  push:
    branches:
      - tmp/galaxy-microelectronics-broker-reports-20260830
    paths:
      - .github/workflows/tmp-galaxy-huayuan-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Inspect public report pages and links
        run: |
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('galaxy_probe'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://m.sgpjbg.com.cn/info/edd24426b5c5d62edb0efd081f4646f9.html',
            'https://www.sgpjbg.com/info/edd24426b5c5d62edb0efd081f4646f9.html',
            'https://www.baogaobox.com/insights/260417000026928.html',
            'https://www.ai-gupiao.com/research/summary/31237',
            'https://data.cfi.cn/ybyl/107379/688689.html',
          ]
          records=[]
          for idx,url in enumerate(urls):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              txt=html.unescape(r.text).replace('\\/','/')
              (out/f'page_{idx}.html').write_text(txt,encoding='utf-8',errors='ignore')
              soup=BeautifulSoup(txt,'html.parser')
              links=[]
              for tag in soup.find_all(True):
                for attr in ['href','src','data','action','value','content','onclick']:
                  v=tag.get(attr)
                  if isinstance(v,str) and v:
                    links.append(urljoin(r.url,v))
              links += re.findall(r'https?://[^\s"\'<>]+',txt,re.I)
              interesting=[]
              for link in links:
                link=link.rstrip('),;')
                low=link.lower()
                if any(k in low for k in ['.pdf','download','bgdown','baogao','report','file','oss','attachment','260416','688689','edd24426']):
                  if link not in interesting: interesting.append(link)
              patterns={}
              for pat in [
                r'AP\d{15,}',r'baogao/\d+\.html',r'bgdown/\d+\.html',r'BookDownLoad[^\s"\'<>]*',
                r'(?i)(?:reportid|baogaoid|fileid|bookid|id)\s*[:=]\s*["\']?\d{4,}',
                r'(?i)[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                r'(?i)(?:pdf|download|file|attachment)[^\n]{0,300}',
              ]:
                vals=[]
                for m in re.findall(pat,txt):
                  v=m if isinstance(m,str) else ' '.join(m)
                  if v not in vals: vals.append(v)
                patterns[pat]=vals[:100]
              rec={'url':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'type':r.headers.get('content-type'),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'interesting_links':interesting[:300],'patterns':patterns}
              records.append(rec)
              print('PAGE',json.dumps(rec,ensure_ascii=False)[:20000],flush=True)
              for needle in ['深耕半导体分立器件','银河微电','华源证券','下载','pdf','baogao','bgdown','BookDownLoad']:
                positions=[m.start() for m in re.finditer(re.escape(needle),txt,re.I)]
                print('NEEDLE',idx,needle,'COUNT',len(positions),flush=True)
                for pos in positions[:8]:
                  print('CTX',re.sub(r'\s+',' ',txt[max(0,pos-500):pos+1000])[:1800],flush=True)
            except Exception as e:
              records.append({'url':url,'error':repr(e)}); print('ERROR',url,repr(e),flush=True)
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-huayuan-source-probe
          path: galaxy_probe/
          retention-days: 3
