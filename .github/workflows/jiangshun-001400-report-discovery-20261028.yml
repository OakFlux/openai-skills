name: Discover Jiangshun 001400 report IDs 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jiangshun-001400-report-discovery-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests
      - name: Query exact publication windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[('2026-06-20','2026-06-26'),('2026-10-18','2026-10-24')]
          terms=['江顺科技','铝型材挤压模具行业龙头','国内铝型材领军企业','差异化3D打印','前瞻布局3D打印']
          found=[];seen=set()
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1','2']:
              total=1
              for page in range(1,101):
                if page>total:break
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                payload=None
                for attempt in range(5):
                  try:
                    r=s.get(api,params=p,timeout=(20,120))
                    if r.status_code==200:payload=r.json();break
                  except Exception as e:print('ERR',qtype,page,repr(e))
                  time.sleep(1+attempt)
                if payload is None:break
                total=min(int(payload.get('TotalPage') or payload.get('totalPage') or 1),100)
                rows=payload.get('data') or []
                if isinstance(rows,dict):rows=rows.get('list') or rows.get('data') or []
                if not rows:break
                for row in rows:
                  title=str(row.get('title') or '')
                  code=str(row.get('stockCode') or '')
                  name=str(row.get('stockName') or '')
                  if code=='001400' or '江顺科技' in name or any(t in title for t in terms):
                    key=str(row.get('infoCode') or '')
                    item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','author','emRatingName','sRatingName','stockCode','stockName','industryName']}
                    print('MATCH',json.dumps(item,ensure_ascii=False))
                    if key not in seen:seen.add(key);found.append(item)
                if page>=total or len(rows)<100:break
              print('QTYPE_DONE',qtype,'TOTAL_PAGES',total)
          print('FOUND_ALL',json.dumps(found,ensure_ascii=False,indent=2))
          PY
