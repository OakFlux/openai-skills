name: Query Eastmoney reports for 300059 20260927

on:
  push:
    paths:
      - '.github/workflows/eastmoney-300059-report-query-20260927.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Query report APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time, requests
          s = requests.Session(); s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          seen=set()
          ranges=[('2016-01-01','2019-12-31'),('2020-01-01','2022-12-31'),('2023-01-01','2024-12-31'),('2025-01-01','2026-09-27')]
          for qtype in ['0','1','2','3']:
            for begin,end in ranges:
              for code_key in ['code','codes','stockCode']:
                for page in range(1,8):
                  params={
                    'cb':'cbx','pageSize':'500','pageNo':str(page),'beginTime':begin,'endTime':end,
                    'qType':qtype,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*',
                    'orgCode':'','rcode':'',code_key:'300059','_':str(int(time.time()*1000))
                  }
                  try:
                    r=s.get(url,params=params,timeout=(20,90)); r.raise_for_status(); t=r.text.strip()
                    m=re.match(r'^[^(]+\((.*)\)\s*;?$',t,re.S); obj=json.loads(m.group(1) if m else t)
                    data=obj.get('data') or []
                    if page == 1:
                      print('QUERY',qtype,begin,end,code_key,'keys',list(obj.keys()),'count',len(data),'total',obj.get('TotalPage') or obj.get('totalPage'),flush=True)
                    for x in data:
                      blob=json.dumps(x,ensure_ascii=False)
                      if '东方财富' in blob or '300059' in blob:
                        key=(x.get('infoCode'),x.get('title'),x.get('publishDate'))
                        if key in seen: continue
                        seen.add(key)
                        print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                    total=int(obj.get('TotalPage') or obj.get('totalPage') or 1)
                    if not data or page>=total: break
                  except Exception as e:
                    print('ERR',qtype,begin,end,code_key,page,repr(e),flush=True); break
          print('TOTAL_UNIQUE',len(seen),flush=True)
          PY
