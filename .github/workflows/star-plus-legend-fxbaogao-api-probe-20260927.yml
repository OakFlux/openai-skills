name: Probe FXBaogao Star Plus Legend report API 20260927

on:
  push:
    paths:
      - '.github/workflows/star-plus-legend-fxbaogao-api-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests
      - name: Query public endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fxapi_star
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, time
          from pathlib import Path
          import requests

          base='https://api.fxbaogao.com'
          rid=4445898
          s=requests.Session();s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Origin':'https://www.fxbaogao.com',
            'Referer':f'https://www.fxbaogao.com/view?id={rid}',
            'x-fp':'','x-bot':'',
          })
          calls=[]
          get_paths=[
            f'/mofoun/report/report/getReportPreviewImages?reportId={rid}',
            f'/mofoun/report/searchReport/detail/catalog?reportId={rid}',
            f'/mofoun/report/report/file/downloadReport?reportId={rid}',
            f'/mofoun/report/report/report/preDownV2?reportId={rid}',
            f'/mofoun/report/report/report/isDownload?reportId={rid}',
            f'/mofoun/report/report/report/getUrlAfterPay?reportId={rid}',
          ]
          for path in get_paths: calls.append(('GET',path,None))
          for body in [
            {'id':rid},{'reportId':rid},{'id':str(rid)},{'reportId':str(rid)},
            {'reportId':rid,'isEnglish':False},{'id':rid,'isEnglish':False},
          ]: calls.append(('POST','/mofoun/report/searchReport/detail',body))
          results=[]
          for idx,(method,path,body) in enumerate(calls):
            url=base+path; rec={'method':method,'url':url,'body':body}
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True) if method=='GET' else s.post(url,json=body,timeout=(20,120),allow_redirects=True)
              rec.update(status=r.status_code,final_url=r.url,content_type=r.headers.get('content-type'),bytes=len(r.content),headers=dict(r.headers),sha256=hashlib.sha256(r.content).hexdigest())
              ext='.json' if 'json' in (r.headers.get('content-type') or '') else '.bin'
              fn=Path(f'fxapi_star/{idx:02d}{ext}');fn.write_bytes(r.content);rec['file']=fn.name
              try: rec['json']=r.json()
              except Exception: rec['text_preview']=r.text[:20000]
              print(json.dumps(rec,ensure_ascii=False)[:20000],flush=True)
            except Exception as e:
              rec['error']=repr(e);print(json.dumps(rec,ensure_ascii=False),flush=True)
            results.append(rec);time.sleep(.3)
          Path('fxapi_star/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-plus-legend-fxbaogao-api-probe
          path: fxapi_star
          retention-days: 7
          if-no-files-found: warn
