name: Probe Ledong Robotics direct public PDFs

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Probe reversible report-image source paths
        shell: bash
        run: |
          cat > /tmp/direct_probe.py <<'PY'
          from __future__ import annotations
          import hashlib, io, json, urllib.parse
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          OUT=Path('direct_output'); OUT.mkdir(exist_ok=True)
          reports={
              '5593366':'2026/08/10',
              '5608254':'2026/08/16',
              '5637842':'2026/08/25',
              '5646471':'2026/08/26',
          }
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept':'application/pdf,application/octet-stream,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer':'https://www.fxbaogao.com/',
          })
          summary=[]
          for rid,date in reports.items():
              paths=[]
              for host in ['https://public.fxbaogao.com','https://report.fxbaogao.com','https://dr.fxbaogao.com']:
                  for root in ['report','report-cn','report-en']:
                      paths += [
                          f'{host}/{root}/{date}/{rid}.pdf',
                          f'{host}/{root}/{date}/{rid}.PDF',
                          f'{host}/{root}/{date}/{rid}-source.pdf',
                          f'{host}/{root}/{date}/{rid}-1.pdf',
                      ]
              found=False
              for url in paths:
                  try:
                      r=s.get(url,timeout=90,allow_redirects=True)
                      ctype=str(r.headers.get('content-type') or '')
                      head=r.content[:20]
                      is_pdf=(b'%PDF' in r.content[:4096] and len(r.content)>20000)
                      print('TRY',rid,r.status_code,ctype,len(r.content),is_pdf,r.url,repr(head))
                      summary.append({'id':rid,'url':url,'final_url':r.url,'status':r.status_code,'content_type':ctype,'bytes':len(r.content),'is_pdf':is_pdf})
                      if is_pdf:
                          reader=PdfReader(io.BytesIO(r.content),strict=False)
                          pages=len(reader.pages)
                          text=''.join((p.extract_text() or '') for p in reader.pages[:min(6,pages)])
                          print('FOUND_PDF',rid,'pages',pages,'bytes',len(r.content),'sha256',hashlib.sha256(r.content).hexdigest(),'mentions',text.count('乐动机器人'))
                          (OUT/f'{rid}.pdf').write_bytes(r.content)
                          found=True
                          break
                  except Exception as e:
                      print('ERR',rid,url,repr(e)); summary.append({'id':rid,'url':url,'error':repr(e)})
              if not found: print('NO_PDF',rid)
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/direct_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_Robotics_Direct_PDF_Probe
          path: direct_output
          retention-days: 2
          if-no-files-found: error
