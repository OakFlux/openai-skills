name: Inspect Hangyan report page metadata
on:
  push:
    branches: [tmp-hangyan-page-inspect-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print relevant public page metadata
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          url='https://www.hangyan.co/reports/3399260180989347557'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
          print('STATUS',r.status_code,'SIZE',len(r.content))
          soup=BeautifulSoup(r.text,'html.parser')
          for tag in soup.find_all(['a','link','script','meta','iframe'], href=True):
              print('HREF',tag.name,tag.get('href'))
          for tag in soup.find_all(['script','img','iframe'], src=True):
              print('SRC',tag.name,tag.get('src'))
          text=r.text
          for key in ['pdf','download','attachment','report_file','file_url','original','paper','report_id','3399260180989347557']:
              start=0; count=0; low=text.lower()
              while count<12:
                  i=low.find(key.lower(),start)
                  if i<0: break
                  print('CTX',key,text[max(0,i-450):min(len(text),i+1300)].replace('\n',' ')[:1750])
                  start=i+len(key); count+=1
          for pat in [r'https?://[^\"\'<> ]+',r'/[^\"\'<> ]+\.pdf[^\"\'<> ]*']:
              for m in list(dict.fromkeys(re.findall(pat,text,re.I)))[:100]:
                  if any(k in m.lower() for k in ['pdf','report','download','file','cdn']): print('MATCH',m[:1500])
          PY
