name: South Precision 10jqka PDF Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_jinggong_10jqka_pdf_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PDF parser
        run: python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Extract and validate report attachment
        shell: bash
        run: |
          python - <<'PY'
          import io,json,re
          import requests
          from pypdf import PdfReader
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          pages=[
            'https://news.10jqka.com.cn/field/sr/20260119/55776103.shtml',
          ]
          for page in pages:
            r=s.get(page,timeout=60,allow_redirects=True)
            r.encoding=r.apparent_encoding or 'gb18030'
            print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            html=r.text
            print('TITLE',BeautifulSoup(html,'html.parser').title)
            patterns=[
              r'window\.pdfUrl\s*=\s*["\']([^"\']+)',
              r'pdfUrl\s*[:=]\s*["\']([^"\']+)',
              r'https?:\\?/\\?/notice\.10jqka\.com\.cn\\?/api\\?/original\\?/[^"\'<>\\s]+\.pdf',
              r'https?://notice\.10jqka\.com\.cn/api/original/[^"\'<>\s]+\.pdf',
            ]
            found=[]
            for pat in patterns:
              for m in re.finditer(pat,html,re.I):
                value=m.group(1) if m.lastindex else m.group(0)
                value=value.replace('\\/','/').replace('\\u0026','&')
                if value not in found: found.append(value)
            print('PDF_CANDIDATES',json.dumps(found,ensure_ascii=False,indent=2))
            for url in found:
              rr=s.get(url,headers={'Referer':page},timeout=120,allow_redirects=True)
              print('PDFTRY',rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),repr(rr.content[:12]))
              if rr.status_code==200 and rr.content.startswith(b'%PDF'):
                reader=PdfReader(io.BytesIO(rr.content))
                text=''
                for i in range(min(3,len(reader.pages))):
                  try:text+=(reader.pages[i].extract_text() or '')
                  except:pass
                print('PDF_OK',json.dumps({'url':url,'final_url':rr.url,'pages':len(reader.pages),'bytes':len(rr.content),'encrypted':reader.is_encrypted,'text_excerpt':re.sub(r'\s+',' ',text)[:1000]},ensure_ascii=False))
          PY
