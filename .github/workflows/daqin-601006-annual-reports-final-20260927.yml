name: Build Daqin Railway 601006 annual reports package 20260927

on:
  push:
    paths:
      - '.github/workflows/daqin-601006-annual-reports-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download official SSE PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE = '大秦铁路_601006_2020-2025年报及最新季度和半年度报告'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)

          docs = [
              {
                  'type': '年度报告', 'period': '2020', 'date': '2021-04-29',
                  'title': '大秦铁路2020年年度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2021-04-29/601006_20210429_18.pdf',
                  'filename': '01_大秦铁路_2020年年度报告.pdf', 'min_pages': 100,
              },
              {
                  'type': '年度报告', 'period': '2021', 'date': '2022-04-28',
                  'title': '大秦铁路2021年年度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2022-04-28/601006_20220428_2_YLGcJEoy.pdf',
                  'filename': '02_大秦铁路_2021年年度报告.pdf', 'min_pages': 100,
              },
              {
                  'type': '年度报告', 'period': '2022', 'date': '2023-04-27',
                  'title': '大秦铁路2022年年度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2023-04-27/601006_20230427_JDLK.pdf',
                  'filename': '03_大秦铁路_2022年年度报告.pdf', 'min_pages': 100,
              },
              {
                  'type': '年度报告', 'period': '2023', 'date': '2024-04-27',
                  'title': '大秦铁路2023年年度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2024-04-27/601006_20240427_I78R.pdf',
                  'filename': '04_大秦铁路_2023年年度报告.pdf', 'min_pages': 100,
              },
              {
                  'type': '年度报告', 'period': '2024', 'date': '2025-04-30',
                  'title': '大秦铁路2024年年度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2025-04-30/601006_20250430_F8WB.pdf',
                  'filename': '05_大秦铁路_2024年年度报告.pdf', 'min_pages': 100,
              },
              {
                  'type': '年度报告', 'period': '2025', 'date': '2026-04-30',
                  'title': '大秦铁路2025年年度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2026-04-30/601006_20260430_VFZD.pdf',
                  'filename': '06_大秦铁路_2025年年度报告.pdf', 'min_pages': 100,
              },
              {
                  'type': '第一季度报告', 'period': '2026Q1', 'date': '2026-04-30',
                  'title': '大秦铁路2026年第一季度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2026-04-30/601006_20260430_SOQY.pdf',
                  'filename': '07_大秦铁路_2026年第一季度报告_最新季报.pdf', 'min_pages': 5,
              },
              {
                  'type': '半年度报告', 'period': '2026H1', 'date': '2026-08-21',
                  'title': '大秦铁路2026年半年度报告',
                  'path': '/disclosure/listedinfo/announcement/c/new/2026-08-21/601006_20260821_8I2N.pdf',
                  'filename': '08_大秦铁路_2026年半年度报告_最新阶段性报告.pdf', 'min_pages': 30,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=601006',
              'Accept': 'application/pdf,*/*;q=0.8',
          })

          def fetch_pdf(path: str) -> tuple[bytes, dict]:
              bases = ['https://static.sse.com.cn', 'https://www.sse.com.cn']
              last = None
              for base in bases:
                  url = base + path
                  for attempt in range(4):
                      try:
                          r = session.get(url, timeout=(30, 240), allow_redirects=True)
                          last = {'status': r.status_code, 'url': url, 'final_url': r.url,
                                  'content_type': r.headers.get('content-type', ''), 'bytes': len(r.content)}
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50_000:
                              return r.content, last
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {path}: {last}')

          manifest = []
          for doc in docs:
              data, download = fetch_pdf(doc['path'])
              dest = root / doc['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f"Too few pages for {dest.name}: {pages}")
              subprocess.run(['qpdf', '--check', str(dest)], check=True,
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)

              # Text identity check is recorded but not used as the sole gate because some PDFs have embedded fonts.
              txt_path = root / '_tmp_text.txt'
              subprocess.run(['pdftotext', '-f', '1', '-l', '5', str(dest), str(txt_path)],
                             check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              text = txt_path.read_text(errors='ignore') if txt_path.exists() else ''
              identity_ok = ('大秦铁路' in text) or ('DAQIN' in text.upper()) or ('601006' in text)
              if txt_path.exists(): txt_path.unlink()

              prefix = preview_dir / dest.stem
              subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile',
                              str(dest), str(prefix)], check=True,
                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'First-page rendering failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              source_url = 'https://www.sse.com.cn' + doc['path']
              rec = dict(doc)
              rec.update({
                  'source_url': source_url,
                  'actual_pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'download': download,
                  'text_identity_check': identity_ok,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'validation': ['PDF header', 'minimum page count', 'qpdf structure', 'first-page render', 'text identity check recorded'],
              })
              manifest.append(rec)

          readme = [
              '大秦铁路股份有限公司（601006.SH）2020-2025年报及最新阶段性财务报告资料包',
              '整理日期：2026-09-27',
              '',
              '本包全部文件均为上海证券交易所公告页面对应的官方PDF原件。',
              '',
              '文件范围：',
              '1. 2020-2025年度报告，共6份；',
              '2. 2026年第一季度报告，作为截至整理日最新的“季度报告”；',
              '3. 2026年半年度报告，作为截至整理日最新的完整阶段性财务报告。',
              '',
              '说明：截至2026-09-27，2026年第三季度报告尚未到法定披露期，故最新季度报告为2026年第一季度报告。',
              '',
          ]
          for i, r in enumerate(manifest, 1):
              readme += [
                  f"{i}. {r['title']}",
                  f"   披露日期：{r['date']}；实际页数：{r['actual_pages']}页；文件大小：{r['bytes']}字节",
                  f"   官方来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += [
              '完整性检查：PDF文件头、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in manifest), encoding='utf-8')

          zpath = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != len(docs):
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')

          print('FINAL_ZIP', zpath, zpath.stat().st_size, hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daqin-601006-2020-2025-annual-reports-final
          path: 大秦铁路_601006_2020-2025年报及最新季度和半年度报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
