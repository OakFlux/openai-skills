name: Extract Hangyan chart report links
on:
  push:
    branches: [tmp-hangyan-chart-links-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Parse public chart pages
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urls=[
            'https://www.hangyan.co/charts/2536171657060419515',
            'https://www.hangyan.co/charts/2926948901774689740',
            'https://www.hangyan.co/charts/3348558758795019616',
            'https://www.hangyan.co/charts/3438580287372526607'
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for url in urls:
              r=s.get(url,timeout=60)
              print('\nPAGE',url,'STATUS',r.status_code,'SIZE',len(r.content),'FINAL',r.url)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              seen=set()
              for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href'])
                  text=' '.join(a.get_text(' ',strip=True).split())
                  if '/reports/' in href and href not in seen:
                      seen.add(href)
                      print('REPORT',href,'|',text[:800])
          PY
