name: Probe FX report search for CCCC Development 20260927

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-search-probe-cccc-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe search routes and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin, quote
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          base='https://www.fxbaogao.com/'
          r=s.get(base,timeout=(20,60)); print('HOME',r.status_code,len(r.text),r.url); r.raise_for_status(); html=r.text
          print('HOME_HEAD',html[:3000])
          for m in re.finditer(r'<form[^>]*>',html,re.I): print('FORM',m.group(0)[:1000])
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              u=urljoin(base,src); scripts.append(u); print('SCRIPT',u)
          for href in re.findall(r'<a[^>]+href=["\']([^"\']+)',html,re.I):
              if 'search' in href.lower() or 'query' in href.lower(): print('SEARCH_LINK',href)

          q=quote('中交地产')
          routes=[
              f'https://www.fxbaogao.com/search?keyword={q}',
              f'https://www.fxbaogao.com/search?q={q}',
              f'https://www.fxbaogao.com/search?query={q}',
              f'https://www.fxbaogao.com/search/{q}',
              f'https://www.fxbaogao.com/report/search?keyword={q}',
              f'https://www.fxbaogao.com/api/search?keyword={q}',
              f'https://www.fxbaogao.com/api/report/search?keyword={q}',
              f'https://www.fxbaogao.com/search.html?keyword={q}',
          ]
          for u in routes:
              try:
                  rr=s.get(u,timeout=(20,60),allow_redirects=True)
                  print('ROUTE',u,'->',rr.status_code,rr.url,'len',len(rr.text),'contains',('中交地产' in rr.text))
                  print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',rr.text,re.I|re.S)[:1])
                  links=re.findall(r'href=["\']([^"\']+)',rr.text,re.I)
                  hits=[x for x in links if '/detail/' in x]
                  print('DETAIL_LINKS',hits[:20])
              except Exception as e: print('ROUTE_ERR',u,repr(e))

          # Inspect a manageable prefix of JS chunks for API/search endpoint clues.
          for u in scripts[:25]:
              try:
                  rr=s.get(u,timeout=(20,60)); print('JS',rr.status_code,len(rr.content),u)
                  if len(rr.content)>5_000_000: continue
                  text=rr.text
                  needles=['/api/','search','keyword','query','elasticsearch','report/list']
                  if any(n in text for n in needles):
                      for pat in [r'https?://[^"\']+',r'/api/[A-Za-z0-9_?=&/.-]+',r'/[A-Za-z0-9_-]*search[A-Za-z0-9_?=&/.-]*']:
                          vals=[]
                          for x in re.findall(pat,text,re.I):
                              if x not in vals: vals.append(x)
                          if vals: print('JS_MATCH',u,pat,vals[:80])
              except Exception as e: print('JS_ERR',u,repr(e))
          PY
