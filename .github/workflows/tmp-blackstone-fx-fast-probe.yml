name: Temporary Blackstone fast public page probe

on:
  push:
    branches:
      - tmp/blackstone-broker-reports-20260829
    paths:
      - .github/workflows/tmp-blackstone-fx-fast-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests Pillow
      - name: Probe all page image URLs once
        run: |
          python - <<'PY'
          import io, json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from PIL import Image

          reports=[
              ('western',31,'https://public.fxbaogao.com/report-image/2023/07/19/3798566'),
              ('guosen',24,'https://public.fxbaogao.com/report-image/2022/08/23/3333199'),
              ('xingye',33,'https://public.fxbaogao.com/report-image/2022/03/24/3086430'),
          ]
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/','Accept':'image/*,*/*;q=0.8'}
          def one(url,page):
              try:
                  r=requests.get(url,headers=headers,timeout=15)
                  valid=False; dims=None; fmt=None
                  if r.status_code==200 and len(r.content)>5000:
                      try:
                          with Image.open(io.BytesIO(r.content)) as im:
                              im.load(); dims=im.size; fmt=im.format
                              valid=im.width>=700 and im.height>=900
                      except Exception: pass
                  return {'page':page,'status':r.status_code,'bytes':len(r.content),'valid':valid,'dims':dims,'format':fmt,'url':url}
              except Exception as e:
                  return {'page':page,'error':repr(e),'valid':False,'url':url}
          for name,count,base in reports:
              with ThreadPoolExecutor(max_workers=16) as ex:
                  futs={ex.submit(one,f'{base}-{p}.png',p):p for p in range(1,count+1)}
                  rows=[f.result() for f in as_completed(futs)]
              rows.sort(key=lambda x:x['page'])
              valid=[x['page'] for x in rows if x.get('valid')]
              print('REPORT',name,json.dumps({'expected':count,'valid_count':len(valid),'valid_pages':valid,'invalid':[x for x in rows if not x.get('valid')][:10],'first':rows[0],'last':rows[-1]},ensure_ascii=False))
          PY
