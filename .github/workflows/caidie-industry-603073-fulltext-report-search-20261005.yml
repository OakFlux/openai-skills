name: Search full-text reports mentioning CaiDie Industry 20261005

on:
  push:
    paths:
      - '.github/workflows/caidie-industry-603073-fulltext-report-search-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query full-text public report index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          from typing import Any
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post(url: str, payload: dict[str, Any]):
            last=None
            for n in range(6):
              try:
                r=s.post(url,json=payload,timeout=(20,120))
                last={'status':r.status_code,'text':r.text[:300]}
                if r.status_code==200: return r.json()
              except Exception as e: last={'error':repr(e)}
              time.sleep(1+n)
            raise RuntimeError((url,last))

          def records(obj: Any):
            out=[]
            def walk(x):
              if isinstance(x,dict):
                if isinstance(x.get('id'),int) and isinstance(x.get('name'),str): out.append(x)
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(obj)
            return list({int(x['id']):x for x in out}.values())

          queries=['彩蝶实业','603073','浙江彩蝶实业']
          allrec={}; raw={}
          for q in queries:
            payload={
              'device':1,'hideTrader':0,'onlyTitle':0,'order':0,
              'page':1,'pageSize':100,'keyword':q,'pageCount':0,
              'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''
            }
            try:
              data=post('https://api.sdyanbao.com/api/file/search',payload)
              raw[q]=data
              for r in records(data): allrec[int(r['id'])]=r
            except Exception as e:
              raw[q]={'error':repr(e)}
            time.sleep(.2)

          candidates=[]
          for rid,r in allrec.items():
            name=str(r.get('name') or '')
            typ=r.get('type')
            typname=typ.get('name') if isinstance(typ,dict) else typ
            if typname in ('财报','招股书'):
              continue
            candidates.append((rid,r))
          candidates.sort(reverse=True)
          candidates=candidates[:120]

          details=[]
          for rid,r in candidates:
            try:
              response=post('https://api.sdyanbao.com/api/file/detail',{'id':rid})
              data=response.get('data') if isinstance(response,dict) else None
              if not isinstance(data,dict): data={}
              details.append({'record':r,'detail':data})
            except Exception as e:
              details.append({'record':r,'detail':{},'error':repr(e)})
            time.sleep(.06)

          summary=[]
          for x in details:
            r=x.get('record') if isinstance(x.get('record'),dict) else {}
            d=x.get('detail') if isinstance(x.get('detail'),dict) else {}
            typ=r.get('type')
            typname=typ.get('name') if isinstance(typ,dict) else typ
            summary.append({
              'id':r.get('id'),'name':r.get('name'),'time_text':r.get('time_text'),
              'record_page_count':r.get('page_count'),'record_type':typname,
              'detail_page_count':d.get('page_count'),'page_url':d.get('page_url'),
              'file_size':d.get('file_size'),'data_source':d.get('data_source'),
              'original_id':d.get('original_id'),'error':x.get('error')
            })
          summary.sort(key=lambda x:(str(x.get('time_text') or ''),int(x.get('id') or 0)),reverse=True)
          Path('out/search_raw.json').write_text(json.dumps(raw,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: caidie-industry-603073-fulltext-report-search
          path: out
          retention-days: 7
          if-no-files-found: error
