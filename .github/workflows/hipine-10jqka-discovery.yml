name: Hipine 10jqka discovery

on:
  push:
    branches:
      - tmp-hipine-10jqka-20260914

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect 10jqka pages and APIs
        shell: bash
        run: |
          cat > /tmp/tjq.py <<'PY'
          from __future__ import annotations
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://basic.10jqka.com.cn/838948/'})

          def get(u):
              try:
                  r=S.get(u,timeout=(20,60),allow_redirects=True)
                  print('GET',u,'->',r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
                  return r
              except Exception as e:
                  print('ERR',u,repr(e),flush=True); return None

          pages=[
              'https://basic.10jqka.com.cn/838948/',
              'https://basic.10jqka.com.cn/838948/company.html',
              'https://basic.10jqka.com.cn/838948/finance.html',
              'https://basic.10jqka.com.cn/838948/event.html',
              'https://basic.10jqka.com.cn/838948/news.html',
              'https://basic.10jqka.com.cn/873888/',
              'https://basic.10jqka.com.cn/873888/company.html',
              'https://basic.10jqka.com.cn/873888/finance.html',
              'https://basic.10jqka.com.cn/873888/event.html',
              'https://basic.10jqka.com.cn/873888/news.html',
          ]
          allscripts=[]
          allids=set()
          for u in pages:
              r=get(u)
              if not r: continue
              enc=r.apparent_encoding or 'utf-8'
              try: text=r.content.decode(enc,'ignore')
              except: text=r.text
              print('TITLE',re.search(r'<title[^>]*>(.*?)</title>',text,re.S|re.I).group(1) if re.search(r'<title[^>]*>(.*?)</title>',text,re.S|re.I) else '',flush=True)
              for key in ['2020年报','2021年报','2022年报','2023年报','2018年报','2017年报','2016年报','公开转让说明书','pubInfo','公告']:
                  pos=0; c=0
                  while True:
                      i=text.find(key,pos)
                      if i<0: break
                      print('CTX',u,key,i,text[max(0,i-1500):i+4000],flush=True)
                      pos=i+len(key); c+=1
                      if c>=8: break
              ids=re.findall(r'/api/stockph/pubInfo/(\d+)/?',text)
              allids.update(ids)
              print('PUBINFO_IDS',u,ids[:200],flush=True)
              soup=BeautifulSoup(text,'html.parser')
              scripts=[urljoin(r.url,s['src']) for s in soup.find_all('script',src=True)]
              allscripts.extend(scripts)
              print('SCRIPTS',u,json.dumps(scripts,ensure_ascii=False),flush=True)
              links=[]
              for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href']); label=' '.join(a.get_text(' ',strip=True).split())
                  if any(k in label for k in ('年报','年度报告','公开转让','招股')) or 'pubInfo' in href or '.pdf' in href.lower():
                      links.append((label,href))
              print('LINKS',u,json.dumps(links[:500],ensure_ascii=False,indent=2),flush=True)

          for su in sorted(set(allscripts)):
              r=get(su)
              if not r: continue
              text=r.text
              if any(k.lower() in text.lower() for k in ('pubinfo','stockph','notice','announcement','report')):
                  print('---SCRIPT',su,'---',flush=True)
                  for key in ('pubInfo','stockph','notice','announcement','report','api/'):
                      pos=0;c=0
                      while True:
                          i=text.lower().find(key.lower(),pos)
                          if i<0: break
                          print('SCTX',key,i,text[max(0,i-1200):i+3500],flush=True)
                          pos=i+len(key);c+=1
                          if c>=12: break
                  urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+|/[A-Za-z0-9_./?=&%-]*(?:pubInfo|stockph|notice|ann|report)[A-Za-z0-9_./?=&%-]*',text,re.I)))
                  print('SURLS',json.dumps(urls[:500],ensure_ascii=False,indent=2),flush=True)

          print('ALL_IDS',sorted(allids),flush=True)
          # Try likely public-info list endpoints inferred from site naming.
          endpoints=[
              'https://basic.10jqka.com.cn/api/stockph/pubInfo/',
              'https://basic.10jqka.com.cn/api/stockph/pubInfoList/',
              'https://basic.10jqka.com.cn/api/stockph/notice/',
              'https://basic.10jqka.com.cn/api/stockph/noticeList/',
          ]
          for ep in endpoints:
              for params in ({'code':'838948'},{'stockcode':'838948'},{'stockCode':'838948'},{'page':1,'code':'838948'},{'pageNo':1,'pageSize':100,'code':'838948'}):
                  try:
                      r=S.get(ep,params=params,timeout=30)
                      print('EP',r.url,r.status_code,len(r.content),r.text[:5000].replace('\n',' '),flush=True)
                  except Exception as e: print('EPERR',ep,params,repr(e),flush=True)
          PY
          python /tmp/tjq.py | tee 10jqka.log
      - uses: actions/upload-artifact@v4
        with:
          name: hipine-10jqka-log
          path: 10jqka.log
          retention-days: 3
