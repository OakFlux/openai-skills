name: Discover Keliyuan historical brokerage reports 20261012

on:
  push:
    paths:
      - '.github/workflows/keliyuan-600478-historical-report-discovery-20261012.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Search narrow historical windows
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time, requests

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer':'https://data.eastmoney.com/',
              'Accept':'application/json,text/javascript,*/*;q=0.8',
          })
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[
              ('2015-10-20','2015-11-30'),
              ('2015-12-01','2015-12-31'),
              ('2017-01-01','2017-12-31'),
              ('2022-11-01','2022-11-30'),
          ]
          for begin,end in windows:
              total=0
              print('WINDOW',begin,end,flush=True)
              for page in range(1,80):
                  p={
                      'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                      'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0',
                      'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                      '_':str(int(time.time()*1000)),
                  }
                  r=s.get(endpoint,params=p,timeout=60)
                  print('QUERY',begin,end,page,r.status_code,len(r.content),flush=True)
                  r.raise_for_status()
                  payload=r.json()
                  rows=payload.get('data',[]) if isinstance(payload,dict) else []
                  if not rows:
                      break
                  total += len(rows)
                  for x in rows:
                      hay=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode'])
                      if '科力远' in hay or '600478' in hay or '乘混动之风' in hay:
                          compact={k:x.get(k) for k in ['title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column','encodeUrl']}
                          print('MATCH',json.dumps(compact,ensure_ascii=False),flush=True)
                  if len(rows)<100:
                      break
              print('WINDOW_TOTAL',begin,end,total,flush=True)
          PY
