name: Temporary Fast Inspect SGPJBG Mengtai HTML V2

on:
  push:
    branches: [tmp/fetch-mengtai-reports-20260830]
    paths: [.github/workflows/tmp-sgpjbg-static-fast2-mengtai.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-mengtai-reports-20260830
          fetch-depth: 0
      - name: Extract static clues
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4 requests
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup

          url='https://www.sgpjbg.com/baogao/141130.html'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36'},timeout=60)
          r.raise_for_status()
          text=html.unescape(r.text).replace('\\/','/')
          soup=BeautifulSoup(text,'html.parser')
          urls=[]
          def add(value):
            if not isinstance(value,str) or not value.strip():return
            u=urljoin(r.url,value.strip())
            if any(k in u.lower() for k in ('pdf','down','download','file','attach','preview','image','img','page','api','141130')) and u not in urls:
              urls.append(u)
          for tag in soup.find_all(True):
            for value in tag.attrs.values():
              if isinstance(value,list):
                for x in value:add(x)
              else:add(value)
          for match in re.finditer(r'https?://[^\s"\'<>]+',text,re.I):add(match.group(0))
          snippets=[]
          needles=['141130','pdf','download','down','file','attach','preview','pagecount','reportid','baogaoid','docid','fileid','readurl','viewurl','原文','下载']
          for needle in needles:
            for m in list(re.finditer(re.escape(needle),text,re.I))[:30]:
              snippets.append({'needle':needle,'text':re.sub(r'\s+',' ',text[max(0,m.start()-700):m.start()+2000])})
          scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')]
          result={'url':url,'status':r.status_code,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'urls':urls[:1000],'scripts':scripts,'snippets':snippets[:500]}
          Path('discoveries').mkdir(exist_ok=True)
          Path('discoveries/mengtai_sgpjbg_static_v2.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'title':result['title'],'urls':len(urls),'scripts':len(scripts),'snippets':len(snippets)},ensure_ascii=False))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'OpenAI Report Discovery'
          git config user.email 'actions@users.noreply.github.com'
          git add discoveries/mengtai_sgpjbg_static_v2.json
          git commit -m 'chore: persist SGPJBG Mengtai HTML clues v2' || exit 0
          git push origin HEAD:tmp/fetch-mengtai-reports-20260830
