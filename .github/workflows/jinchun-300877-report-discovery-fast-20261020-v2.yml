name: Fast discover Jinchun 300877 reports 20261020

on:
  push:
    branches:
      - tmp/jinchun-300877-report-discovery-fast-20261020-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query Eastmoney by stock code
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          for qtype in ['0','1','2']:
            for page in range(1,10):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2018-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'300877','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(api,params=params,timeout=(20,120)); d=r.json(); batch=d.get('data') or []
              if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
              print('QTYPE',qtype,'PAGE',page,'HITS',d.get('hits'),'COUNT',len(batch) if isinstance(batch,list) else 'bad')
              if not isinstance(batch,list) or not batch: break
              all_rows.extend(batch)
              if len(batch)<100: break
              time.sleep(.1)
          seen=set(); out=[]
          for x in all_rows:
            info=str(x.get('infoCode') or '')
            if not info or info in seen: continue
            seen.add(info)
            out.append({k:x.get(k) for k in ['infoCode','title','orgSName','orgCode','publishDate','attachPages','stockCode','stockName','researcher','emRatingName','ratingChange','indvInduName','predictNextTwoYearEps']})
          print('RESULT_COUNT',len(out))
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))
          PY
