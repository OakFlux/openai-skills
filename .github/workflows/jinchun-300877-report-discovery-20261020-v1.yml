name: Discover Jinchun 300877 broker reports 20261020

on:
  push:
    branches:
      - tmp/jinchun-300877-report-discovery-20261020-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, requests, time
          from bs4 import BeautifulSoup
          from urllib.parse import quote

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})
          api='https://reportapi.eastmoney.com/report/list'
          queries=[
            {'label':'code-300877','code':'300877','begin':'2018-01-01','end':'2030-12-31','qType':'0'},
            {'label':'name-jinchun','code':'金春股份','begin':'2018-01-01','end':'2030-12-31','qType':'0'},
            {'label':'empty-q0','code':'','begin':'2019-01-01','end':'2025-12-31','qType':'0'},
            {'label':'empty-q1','code':'','begin':'2019-01-01','end':'2025-12-31','qType':'1'},
            {'label':'empty-q2','code':'','begin':'2019-01-01','end':'2025-12-31','qType':'2'},
          ]
          seen=set()
          matches=[]
          for q in queries:
            print('\n### QUERY',q['label'])
            for page in range(1,101):
              params={
                'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':q['begin'],'endTime':q['end'],'pageNo':str(page),'fields':'',
                'qType':q['qType'],'orgCode':'','code':q['code'],'rcode':'','p':str(page),
                'pageNum':str(page),'pageNumber':str(page)
              }
              try:
                r=s.get(api,params=params,timeout=(20,120)); d=r.json()
                batch=d.get('data') or []
                if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
                if page==1: print('hits',d.get('hits'),'first_count',len(batch) if isinstance(batch,list) else 'bad')
                if not isinstance(batch,list) or not batch: break
                for x in batch:
                  blob=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode','orgSName','researcher'])
                  if q['code']=='300877' or any(k in blob for k in ['金春股份','安徽金春','300877']):
                    obj={k:x.get(k) for k in ['infoCode','title','orgSName','orgCode','publishDate','attachPages','stockCode','stockName','researcher','emRatingName','ratingChange','indvInduName']}
                    key=json.dumps(obj,ensure_ascii=False,sort_keys=True,default=str)
                    if key not in seen:
                      seen.add(key); matches.append(obj)
                      print('MATCH',json.dumps(obj,ensure_ascii=False,default=str))
                if len(batch)<100: break
                time.sleep(.05)
              except Exception as e:
                print('ERROR',q['label'],page,repr(e)); break

          print('\n### UNIQUE_MATCHES')
          print(json.dumps(matches,ensure_ascii=False,indent=2,default=str))

          # Inspect Sina report search/list pages for pre-IPO or unindexed reports.
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=2&symbol=sz300877',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=3&industry=金春股份',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=5&title=金春股份',
          ]
          for u in urls:
            print('\n### SINA',u)
            try:
              r=s.get(u,timeout=(20,120)); print('status',r.status_code,'bytes',len(r.content),'type',r.headers.get('content-type'))
              text=r.content.decode(r.apparent_encoding or 'gb18030',errors='replace')
              soup=BeautifulSoup(text,'lxml')
              print('title',soup.title.get_text(' ',strip=True) if soup.title else '')
              found=[]
              for a in soup.find_all('a',href=True):
                label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                href=a.get('href')
                if '金春' in label or '300877' in label or (href and 'vReport_Show' in href):
                  found.append({'label':label,'href':href})
              print(json.dumps(found[:500],ensure_ascii=False,indent=2))
            except Exception as e:
              print('SINA_ERROR',repr(e))
          PY
