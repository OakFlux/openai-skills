name: Discover Kaichuang International 600097 brokerage reports

on:
  push:
    paths:
      - '.github/workflows/kaichuang-international-600097-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney report API
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, time, requests

          CODE='600097'
          endpoint='https://reportapi.eastmoney.com/report/list'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          windows=[
              ('2008-01-01','2010-12-31'),
              ('2011-01-01','2013-12-31'),
              ('2014-01-01','2016-12-31'),
              ('2017-01-01','2019-12-31'),
              ('2020-01-01','2022-12-31'),
              ('2023-01-01','2026-10-14'),
          ]
          seen=set(); found=[]
          for begin,end in windows:
              for qtype in ('0','1'):
                  for mode in ('company','blank'):
                      for page in range(1,40):
                          params={
                              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                              'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                              'orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                              '_':str(int(time.time()*1000)),'code':CODE if mode=='company' else '',
                          }
                          r=s.get(endpoint,params=params,timeout=60)
                          print('QUERY',begin,end,qtype,mode,page,r.status_code,len(r.content),flush=True)
                          r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                          print('COUNT',len(rows),'HITS',payload.get('hits'),flush=True)
                          if not rows: break
                          for x in rows:
                              stock=str(x.get('stockCode') or '')
                              name=str(x.get('stockName') or '')
                              title=str(x.get('title') or '')
                              if stock==CODE or '开创国际' in name or '开创国际' in title:
                                  ic=str(x.get('infoCode') or '')
                                  if ic and ic not in seen:
                                      seen.add(ic); found.append(x)
                                      print('FOUND',json.dumps(x,ensure_ascii=False),flush=True)
                          if len(rows)<100: break
          print('FINAL_FOUND',len(found),flush=True)
          for x in sorted(found,key=lambda v:str(v.get('publishDate') or ''),reverse=True):
              compact={k:x.get(k) for k in (
                  'title','stockName','stockCode','orgSName','orgName','publishDate','infoCode',
                  'attachPages','attachSize','researcher','emRatingName','column','reportType','encodeUrl'
              )}
              print('SUMMARY',json.dumps(compact,ensure_ascii=False),flush=True)
          PY
