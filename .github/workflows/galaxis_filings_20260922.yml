name: Galaxis Official Filings Package

on:
  push:
    branches:
      - chatgpt-galaxis-filings-20260922
    paths:
      - .github/workflows/galaxis_filings_20260922.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet "httpx[http2]" pypdf

      - name: Download and validate official filings
        run: python scripts/build_galaxis_filings_20260922.py

      - name: List package files
        run: ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: galaxis-official-filings-package
          path: |
            output/凯乐士科技_年报_招股说明书_最新定期财报.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
