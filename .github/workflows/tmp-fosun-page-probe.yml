name: Temporary Fosun report page completeness probe

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-page-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --quiet requests Pillow
      - name: Probe public page ranges
        run: |
          python - <<'PY'
          import io, json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from PIL import Image

          reports = [
              ('东北证券_20241115', 54, 'https://oss.sdyanbao.com/page/2024/11/25/1120507'),
              ('开源证券_20230508', 43, 'https://oss.sdyanbao.com/page/2023/5/9/537648'),
              ('东吴证券_20230216', 42, 'https://oss.sdyanbao.com/page/2023/2/16/437807'),
              ('浙商证券_20230717', 39, 'https://oss.sdyanbao.com/page/2023/7/19/572792'),
          ]

          def probe_one(report):
              name, count, base = report
              indices = sorted({0, 1, 14, 15, count // 2, count - 2, count - 1})
              s = requests.Session()
              s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com'})
              checks = []
              for index in indices:
                  url = f'{base}/{index}.png'
                  try:
                      r = s.get(url, timeout=12)
                      valid = False
                      dims = None
                      fmt = None
                      if r.status_code == 200 and len(r.content) > 10_000:
                          try:
                              with Image.open(io.BytesIO(r.content)) as im:
                                  im.load(); dims = im.size; fmt = im.format
                                  valid = dims[0] >= 700 and dims[1] >= 600
                          except Exception:
                              pass
                      checks.append({'index':index,'page_number':index+1,'status':r.status_code,'bytes':len(r.content),'valid':valid,'dims':dims,'format':fmt})
                  except Exception as exc:
                      checks.append({'index':index,'page_number':index+1,'error':repr(exc)})
              return {'name':name,'page_count':count,'base':base,'checks':checks}

          with ThreadPoolExecutor(max_workers=4) as executor:
              futures = [executor.submit(probe_one, report) for report in reports]
              for future in as_completed(futures):
                  print('RESULT', json.dumps(future.result(), ensure_ascii=False))
          PY
