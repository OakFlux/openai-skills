name: Inspect sdyanbao report 839553 20260929

on:
  push:
    paths:
      - '.github/workflows/inspect-sdyanbao-839553-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect page and assets
        run: |
          python - <<'PY'
          import re, json, requests
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'}
          url='https://www.sdyanbao.com/detail/839553'
          r=s.get(url,headers=h,timeout=60)
          print('PAGE',r.status_code,len(r.content),r.url)
          text=r.text
          for pat in [r'https?://[^\"\'<> ]+', r'[^\"\'<> ]+\.pdf[^\"\'<> ]*', r'[^\"\'<> ]*download[^\"\'<> ]*', r'[^\"\'<> ]*839553[^\"\'<> ]*']:
              vals=[]
              for x in re.findall(pat,text,re.I):
                  if x not in vals: vals.append(x)
              print('PATTERN',pat,'COUNT',len(vals))
              for x in vals[:100]: print('MATCH',x)
          for m in re.finditer(r'(?i)(pdf|download|file|oss|839553)', text):
              a=max(0,m.start()-300); b=min(len(text),m.end()+500)
              print('CTX',text[a:b].replace('\n',' ')[:1000])
          scripts=re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',text,re.I)
          print('SCRIPTS',len(scripts))
          for src in scripts[:30]:
              u=urljoin(r.url,src)
              try:
                  rr=s.get(u,headers=h,timeout=60)
                  print('SCRIPT',rr.status_code,len(rr.content),u)
                  st=rr.text
                  if any(k in st.lower() for k in ['download','pdf','report']):
                      for m in re.finditer(r'(?i)(download|pdf)',st):
                          a=max(0,m.start()-200); b=min(len(st),m.end()+400)
                          print('SCRIPTCTX',st[a:b].replace('\n',' ')[:700])
                          break
              except Exception as e: print('SCRIPTERR',u,repr(e))
          PY
