name: Build AUX Electric 02580 annual reports and prospectus package 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-02580-annual-prospectus-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '奥克斯电气_02580_全部年报及招股章程_中英文官方原件'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          def variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          docs = [
              {
                  'filename': '01_奥克斯电气_02580_2025年年度报告_中文版_2026-04-28.pdf',
                  'title': '奥克斯电气2025年年度报告（中文版）',
                  'date': '2026-04-28',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0428/2026042801934_c.pdf'),
                  'min_bytes': 500_000,
                  'min_pages': 180,
              },
              {
                  'filename': '02_AUX_Electric_02580_2025_Annual_Report_English_2026-04-28.pdf',
                  'title': 'AUX Electric 2025 Annual Report (English)',
                  'date': '2026-04-28',
                  'urls': [
                      *variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0428/2026042801933.pdf'),
                      'https://cdn.financialreports.eu/financialreports/media/filings/50687/2026/RNS/50687_rns_2026-04-28_ddae769e-2f0f-42f5-9c12-d65265370508.pdf',
                  ],
                  'min_bytes': 500_000,
                  'min_pages': 180,
              },
              {
                  'filename': '03_奥克斯电气_02580_招股章程_中文版_2025-08-25.pdf',
                  'title': '奥克斯电气最终招股章程（中文版）',
                  'date': '2025-08-25',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0825/2025082500012_c.pdf'),
                  'min_bytes': 5_000_000,
                  'min_pages': 600,
              },
              {
                  'filename': '04_AUX_Electric_02580_Prospectus_English_2025-08-25.pdf',
                  'title': 'AUX Electric Final Prospectus (English)',
                  'date': '2025-08-25',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0825/2025082500011.pdf'),
                  'min_bytes': 5_000_000,
                  'min_pages': 600,
              },
          ]

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(30, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              sample_lower = sample_text.lower()
              identity_ok = any(term.lower() in sample_lower for term in ('2580', 'aux electric', '奧克斯電氣', '奥克斯电气'))
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'disclosure_date': doc['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '奥克斯电气有限公司（02580.HK）全部年度报告及最终招股章程',
              '整理日期：2026-09-19',
              '',
              '收录范围：截至整理日，上市后全部完整年度报告，以及正式最终招股章程；两类文件均收录中英文官方原件。',
              '奥克斯电气于2025年9月2日在香港联交所上市，因此截至整理日，上市主体对外发布的完整年度报告只有2025年年度报告。',
              '2020—2024年不存在以该香港上市主体名义发布的独立年度报告；2022—2024年及2025年第一季度的历史财务资料已包含在最终招股章程及其会计师报告中。',
              '本包不以业绩公告、中期报告、ESG报告或上市申请稿替代年度报告。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司身份、实际页数、qpdf结构检查、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 4:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: aux-electric-02580-annual-prospectus-final
          path: 奥克斯电气_02580_全部年报及招股章程_中英文官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
