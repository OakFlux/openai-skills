name: Test public SGP direct report URL

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Test public URLs and inspect download form
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          page='https://www.sgpjbg.com/bgdown/399121.html'
          r=s.get(page,timeout=60)
          print('PAGE',r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
          text=r.text
          for pat in [r'<form[^>]*.*?</form>',r'BookDownLoad[^\s"\'<>]*',r'<input[^>]+>',r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>[^<]*下载[^<]*</a>']:
              matches=re.findall(pat,text,re.I|re.S)
              print('PATTERN',pat,'COUNT',len(matches),flush=True)
              for m in matches[:100]: print('MATCH',m if isinstance(m,str) else repr(m),flush=True)
          direct='https://www.sgpjbg.com/bgdown/三维化学-公司研究报告-三业联动发展业绩或迎拐点-250107（17页）.pdf'
          for url in [direct,'https://www.sgpjbg.com/FlexPaper/BookDownLoad.aspx']:
              for method in ('GET','HEAD'):
                  try:
                      rr=s.request(method,url,headers={'Referer':page},timeout=60,allow_redirects=True)
                      print('TEST',method,url,'STATUS',rr.status_code,'FINAL',rr.url,'TYPE',rr.headers.get('content-type'),'LEN',len(rr.content),'DISP',rr.headers.get('content-disposition'),'PREFIX',rr.content[:32],flush=True)
                  except Exception as e: print('ERROR',method,url,repr(e),flush=True)
          PY
