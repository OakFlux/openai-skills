name: Inspect FxBaogao full report view implementation

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect view page and scripts
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import html,re,requests
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/detail/4665308'})
          for doc in ('4665308','4736599'):
            url=f'https://www.fxbaogao.com/view?id={doc}'
            r=s.get(url,timeout=60,allow_redirects=True)
            print('\nVIEW',doc,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
            text=r.text
            print('PREFIX',text[:2000].replace('\n',' '),flush=True)
            for term in ('report-image','pdf','download','pageCount','page_count','docId','getReport','api/','viewer','fileUrl','srcUrl','imageUrl'):
              pos=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
              print('TERM',term,'COUNT',len(pos),flush=True)
              for p in pos[:30]: print('CTX',text[max(0,p-600):p+1800].replace('\n',' '),flush=True)
            scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
            for src in scripts:
              su=urljoin(r.url,src.strip())
              print('SCRIPT',su,flush=True)
              try:
                sr=s.get(su,timeout=60); print('SCRIPT_STATUS',sr.status_code,len(sr.content),flush=True)
                st=sr.text
                if any(term.lower() in st.lower() for term in ('report-image','download','pageCount','getReport','pdf','docId','view?id')):
                  for term in ('report-image','download','pageCount','getReport','pdf','docId','reportInfo','imageUrl','pageUrl'):
                    positions=[m.start() for m in re.finditer(re.escape(term),st,re.I)]
                    if positions: print('SCRIPT_TERM',term,'COUNT',len(positions),flush=True)
                    for p in positions[:20]: print('SCRIPT_CTX',st[max(0,p-1000):p+3000],flush=True)
              except Exception as e: print('SCRIPT_ERROR',repr(e),flush=True)
            urls=sorted(set(html.unescape(x) for x in re.findall(r'https?://[^\s"\'<>]+',text)))
            for u in urls:
              if any(k in u.lower() for k in ('report','pdf','download','api','image','view')): print('URL',u,flush=True)
          PY
