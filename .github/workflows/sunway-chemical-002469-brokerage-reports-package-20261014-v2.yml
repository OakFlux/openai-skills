name: Inspect Sunway Chemical report pages

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect public pages and assets
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin, urlparse
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          pages=[
            'https://www.baogaobox.com/reports/250319000052828.html',
            'https://www.baogaobox.com/insights/250521000010338.html',
            'https://www.fxbaogao.com/detail/4736599',
            'https://www.fxbaogao.com/detail/4665308',
            'https://www.sgpjbg.com/bgdown/399121.html',
          ]
          for url in pages:
              try:
                  r=s.get(url,timeout=60,allow_redirects=True)
                  print('\n=== PAGE',url,'STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),'===',flush=True)
                  print('HEADERS',json.dumps(dict(r.headers),ensure_ascii=False),flush=True)
                  text=r.text
                  print('PREFIX',text[:1000].replace('\n',' '),flush=True)
                  patterns=[
                    r'https?://[^\s"\'<>]+',
                    r'(?:href|src|data-url|data-src|download|file|pdf)[^=]{0,30}=["\']([^"\']+)',
                    r'["\']([^"\']+\.(?:pdf|PDF)(?:\?[^"\']*)?)["\']',
                  ]
                  assets=set()
                  for pattern in patterns:
                      for m in re.finditer(pattern,text,re.I):
                          val=m.group(1) if m.lastindex else m.group(0)
                          val=val.replace('&amp;','&')
                          if any(k in val.lower() for k in ('pdf','download','attach','report','file','static','upload','asset','api')):
                              assets.add(urljoin(r.url,val))
                  for asset in sorted(assets):
                      print('ASSET',asset,flush=True)
                  scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
                  for src in scripts:
                      script_url=urljoin(r.url,src)
                      print('SCRIPT',script_url,flush=True)
                      try:
                          sr=s.get(script_url,timeout=60)
                          print('SCRIPT_STATUS',sr.status_code,'LEN',len(sr.content),flush=True)
                          st=sr.text
                          for m in re.finditer(r'https?://[^\s"\'<>]+|["\']([^"\']*(?:download|pdf|report|file|attach|api)[^"\']*)["\']',st,re.I):
                              val=m.group(1) if m.lastindex and m.group(1) else m.group(0)
                              if 3 < len(val) < 500:
                                  print('SCRIPT_REF',urljoin(script_url,val.replace('&amp;','&')),flush=True)
                      except Exception as e:
                          print('SCRIPT_ERROR',repr(e),flush=True)
              except Exception as e:
                  print('PAGE_ERROR',url,repr(e),flush=True)
          PY
