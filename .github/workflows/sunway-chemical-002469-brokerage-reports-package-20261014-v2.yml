name: Search historical Sunway Engineering reports

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Search all historical reports
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json,time,requests
          CODE='002469'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2010-08-01','2010-10-31'),
            ('2010-11-01','2011-12-31'),
            ('2012-01-01','2014-12-31'),
            ('2015-01-01','2019-12-31'),
            ('2020-01-01','2024-12-31'),
          ]
          seen=set(); found=[]
          for begin,end in windows:
            for mode in ('company','blank'):
              for qtype in ('0','1'):
                for page in range(1,100):
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':begin,'endTime':end,
                          'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                          '_':str(int(time.time()*1000))}
                  params['code']=CODE if mode=='company' else ''
                  r=s.get(endpoint,params=params,timeout=60)
                  print('QUERY',begin,end,mode,qtype,page,r.status_code,len(r.content),flush=True)
                  r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                  print('COUNT',len(rows),'HITS',payload.get('hits'),flush=True)
                  if not rows: break
                  for x in rows:
                    if str(x.get('stockCode') or '')==CODE:
                      ic=str(x.get('infoCode') or '')
                      if ic not in seen:
                        seen.add(ic); found.append(x); print('FOUND',json.dumps(x,ensure_ascii=False),flush=True)
                  if len(rows)<100: break
          print('FINAL_FOUND',len(found),flush=True)
          for x in found:
            print('SUMMARY',json.dumps({k:x.get(k) for k in ('title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column')},ensure_ascii=False),flush=True)
          PY
