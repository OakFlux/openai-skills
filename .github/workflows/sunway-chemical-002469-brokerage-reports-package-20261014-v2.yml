name: Query exact Sunway Chemical report dates

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Search exact publication date windows
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json,time,requests
          CODE='002469'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2025-01-06','2025-01-08','财通'),
            ('2025-03-17','2025-03-20','国盛三月'),
            ('2025-04-01','2025-04-03','国海'),
            ('2025-04-07','2025-04-09','东北'),
            ('2025-04-22','2025-04-24','德邦'),
            ('2025-05-10','2025-05-12','天风'),
            ('2025-08-03','2025-08-05','广发'),
            ('2025-08-10','2025-08-12','长江'),
            ('2025-08-20','2025-08-22','国盛八月'),
          ]
          all_matches=[]; seen=set()
          for begin,end,label in windows:
            print('\nWINDOW',label,begin,end,flush=True)
            for qtype in ('0','1'):
              for page in range(1,61):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                        'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                        'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                        '_':str(int(time.time()*1000))}
                r=s.get(endpoint,params=params,timeout=60)
                print('QUERY',label,qtype,page,r.status_code,len(r.content),flush=True)
                r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                print('COUNT',len(rows),'HITS',payload.get('hits'),flush=True)
                if not rows: break
                for x in rows:
                  stock=str(x.get('stockCode') or '')
                  name=str(x.get('stockName') or '')
                  title=str(x.get('title') or '')
                  if stock==CODE or '三维化学' in name or '三维工程' in name or '三维化学' in title or '三维工程' in title:
                    ic=str(x.get('infoCode') or '')
                    if ic and ic not in seen:
                      seen.add(ic); all_matches.append(x)
                      print('MATCH',label,json.dumps(x,ensure_ascii=False),flush=True)
                if len(rows)<100: break
          print('\nFINAL_MATCHES',len(all_matches),flush=True)
          for x in all_matches:
            print('SUMMARY',json.dumps({k:x.get(k) for k in ('title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column')},ensure_ascii=False),flush=True)
          PY
