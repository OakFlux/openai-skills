name: Find and package two Sunway Chemical deep reports

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Find, download, validate, and package reports
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '002469'
          COMPANY = '三维化学'
          PACKAGE = '三维化学_002469_券商深度报告精选_2份'
          OUT = Path(PACKAGE)
          OUT.mkdir(exist_ok=True)

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          endpoint = 'https://reportapi.eastmoney.com/report/list'

          def query_reports(begin, end, code_value, max_pages=30):
              found = []
              seen = set()
              for page in range(1, max_pages + 1):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingchange': '*', 'beginTime': begin,
                      'endTime': end, 'pageNo': str(page), 'fields': '',
                      'qType': '0', 'orgCode': '', 'code': code_value,
                      'rcode': '', 'p': str(page), 'pageNum': str(page),
                      'pageNumber': str(page), '_': str(int(time.time() * 1000)),
                  }
                  r = s.get(endpoint, params=params, timeout=60)
                  print('QUERY', begin, end, repr(code_value), page, r.status_code, len(r.content), r.url, flush=True)
                  r.raise_for_status()
                  payload = r.json() if r.content else {}
                  rows = payload.get('data') or []
                  print('COUNT', len(rows), 'TOTAL', payload.get('TotalCount') or payload.get('total') or payload.get('count'), flush=True)
                  if not rows:
                      break
                  for row in rows:
                      ic = str(row.get('infoCode') or '')
                      if ic and ic not in seen:
                          seen.add(ic)
                          found.append(row)
                  if len(rows) < 100:
                      break
              return found

          # Direct company query currently returns the 2025 Guosen report.
          direct_rows = []
          for period in [('2024-01-01', '2026-10-14'), ('2020-01-01', '2023-12-31')]:
              direct_rows.extend(query_reports(period[0], period[1], CODE, 10))

          # Search all reports around the publication date of the Caitong first-coverage report.
          all_rows = []
          for code_value in ['', '*']:
              try:
                  all_rows.extend(query_reports('2025-01-01', '2025-01-15', code_value, 30))
              except Exception as exc:
                  print('ALL_QUERY_ERROR', repr(code_value), repr(exc), flush=True)

          merged = []
          seen = set()
          for row in direct_rows + all_rows:
              ic = str(row.get('infoCode') or '')
              if ic and ic not in seen:
                  seen.add(ic)
                  merged.append(row)

          print('MERGED_TOTAL', len(merged), flush=True)
          for row in merged:
              text = ' '.join(str(row.get(k) or '') for k in ('title','stockName','stockCode','orgSName','researcher'))
              if any(term in text for term in ('三维化学', '三维工程', '三业联动发展', '业绩或迎拐点', '毕春晖')):
                  print('MATCH', json.dumps(row, ensure_ascii=False), flush=True)

          def norm(x):
              return re.sub(r'[\s，,：:、。·—－\-（）()]+', '', str(x or '').lower())

          guosen = None
          caitong = None
          for row in merged:
              title = norm(row.get('title'))
              stock_code = str(row.get('stockCode') or '')
              stock_name = str(row.get('stockName') or '')
              broker = str(row.get('orgSName') or '')
              if stock_code == CODE or COMPANY in stock_name or '三维工程' in stock_name:
                  if '受益于新疆煤化工建设提速' in title or ('工程实业携手并进' in title and '国信' in broker):
                      guosen = row
                  if '三业联动发展' in title or '业绩或迎拐点' in title or ('财通' in broker and '三维' in stock_name):
                      caitong = row

          if guosen is None:
              guosen = {
                  'title': '受益于新疆煤化工建设提速，“工程+实业”携手并进',
                  'stockName': COMPANY,
                  'stockCode': CODE,
                  'orgSName': '国信证券',
                  'publishDate': '2025-05-16 00:00:00.000',
                  'infoCode': 'AP202505161673828576',
                  'attachPages': 37,
                  'attachSize': 3441,
                  'researcher': '任鹤,朱家琪',
                  'emRatingName': '增持',
              }

          if caitong is None:
              raise RuntimeError('Caitong 2025-01 first-coverage report was not found in Eastmoney all-report search')

          chosen = [guosen, caitong]
          print('CHOSEN', json.dumps(chosen, ensure_ascii=False, indent=2), flush=True)

          def safe(x):
              return re.sub(r'[\\/:*?"<>|\s]+', '_', str(x or '').strip())[:84]

          def pdf_urls(ic):
              return [f'https://pdf.dfcfw.com/pdf/{prefix}_{ic}_1.pdf' for prefix in ('H3','H2','H4')]

          records = []
          hashes = set()
          for idx, row in enumerate(chosen, 1):
              broker = str(row.get('orgSName') or '券商')
              date = str(row.get('publishDate') or '')[:10]
              title = str(row.get('title') or '公司研究报告')
              ic = str(row.get('infoCode') or '')
              dest = OUT / f'{idx:02d}_{safe(broker)}_{date}_{safe(title)}.pdf'
              errors = []
              source = None
              for url in pdf_urls(ic):
                  try:
                      r = s.get(url, headers={'Referer': 'https://data.eastmoney.com/report/'}, timeout=(30,900))
                      print('DOWNLOAD', dest.name, r.status_code, url, flush=True)
                      r.raise_for_status()
                      data = r.content
                      if len(data) < 150000 or not data.startswith(b'%PDF-'):
                          raise RuntimeError(f'bad PDF len={len(data)}')
                      dest.write_bytes(data)
                      source = url
                      break
                  except Exception as exc:
                      errors.append(repr(exc))
              if source is None:
                  raise RuntimeError(f'download failed for {dest.name}: {errors}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              expected = int(row.get('attachPages') or 0)
              if pages < 10 or (expected and abs(pages - expected) > 3):
                  raise RuntimeError(f'page mismatch {dest.name}: {pages} vs {expected}')
              q = subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)], capture_output=True, text=True)
              if q.returncode != 0:
                  raise RuntimeError(q.stderr[-1500:])
              root = OUT / (dest.stem + '_render')
              rr = subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','96',str(dest),str(root)], capture_output=True, text=True)
              png = Path(str(root)+'.png')
              if rr.returncode != 0 or not png.exists() or png.stat().st_size < 8000:
                  raise RuntimeError(f'render failed for {dest.name}')
              render_size = png.stat().st_size
              png.unlink()
              sample = ''.join((reader.pages[j].extract_text() or '') for j in range(min(8,pages)))
              sample = re.sub(r'\s+', '', sample)
              if COMPANY not in sample and CODE not in sample and '三维工程' not in sample and '三维石化' not in sample:
                  raise RuntimeError(f'identity failed for {dest.name}')
              raw = dest.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest in hashes:
                  raise RuntimeError('duplicate PDF')
              hashes.add(digest)
              record = {
                  'filename': dest.name,
                  'company': '山东三维化学集团股份有限公司',
                  'stock_code': '002469.SZ',
                  'broker': broker,
                  'date': date,
                  'title': title,
                  'researcher': str(row.get('researcher') or ''),
                  'rating': str(row.get('emRatingName') or ''),
                  'info_code': ic,
                  'source_pdf_url': source,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': digest,
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          lines = [
              '山东三维化学集团股份有限公司（三维化学，002469.SZ）券商深度报告精选',
              '整理日期：2026-10-14', '',
              '本包收录2份券商原始排版完整PDF。',
              '均为研究框架较完整的公司深度或首次覆盖报告。', '',
          ]
          for i, r in enumerate(records,1):
              lines += [
                  f"{i}. {r['broker']}，{r['date']}，{r['pages']}页",
                  f"   标题：{r['title']}",
                  f"   分析师：{r['researcher']}；评级：{r['rating']}",
                  f"   文件：{r['filename']}",
                  f"   PDF来源：{r['source_pdf_url']}",
                  f"   SHA-256：{r['sha256']}", '',
              ]
          (OUT/'00_报告清单与来源说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          z = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as archive:
              for p in sorted(OUT.iterdir()):
                  archive.write(p, arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(z) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure ' + bad)
              pdfs = [n for n in archive.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'expected 2 PDFs, got {len(pdfs)}')
          print('FINAL_ZIP', z.name, z.stat().st_size, 'SHA256', hashlib.sha256(z.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: sunway-chemical-002469-brokerage-reports-20261014-v2
          path: 三维化学_002469_券商深度报告精选_2份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
