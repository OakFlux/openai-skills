name: Find and package two Sunway Chemical deep reports

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Search, download, validate, and package
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='002469'; COMPANY='三维化学'; PACKAGE='三维化学_002469_券商深度报告精选_2份'
          OUT=Path(PACKAGE); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          endpoint='https://reportapi.eastmoney.com/report/list'

          def query(begin,end,mode,qtype='0',max_pages=50):
              result=[]; seen=set()
              for page in range(1,max_pages+1):
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                          'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                          'orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                          '_':str(int(time.time()*1000))}
                  if mode=='company': params['code']=CODE
                  elif mode=='blank': params['code']=''
                  elif mode=='star': params['code']='*'
                  r=s.get(endpoint,params=params,timeout=60)
                  print('QUERY',begin,end,mode,qtype,page,r.status_code,len(r.content),r.url,flush=True)
                  r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                  print('COUNT',len(rows),'TOTALS',{k:payload.get(k) for k in ('TotalCount','total','count','hits')},flush=True)
                  if not rows: break
                  for x in rows:
                      ic=str(x.get('infoCode') or '')
                      if ic and ic not in seen: seen.add(ic); result.append(x)
                  if len(rows)<100: break
              return result

          rows=[]; seen=set()
          windows=[('2025-01-01','2025-01-15'),('2025-03-15','2025-03-22'),('2025-05-10','2025-05-20')]
          for begin,end in windows:
              for mode in ('company','blank','omit','star'):
                  for qtype in ('0','1'):
                      try:
                          batch=query(begin,end,mode,qtype,50)
                      except Exception as e:
                          print('QUERY_ERROR',begin,end,mode,qtype,repr(e),flush=True); continue
                      for x in batch:
                          ic=str(x.get('infoCode') or '')
                          if ic and ic not in seen: seen.add(ic); rows.append(x)

          print('UNIQUE_TOTAL',len(rows),flush=True)
          targets=[]
          for x in rows:
              text=' '.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgSName','researcher'))
              if any(t in text for t in ('三维化学','三维工程','三业联动发展','业绩或迎拐点','硫磺回收','正丙醇','何亚轩','毕春晖')):
                  print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
                  if str(x.get('stockCode') or '')==CODE or COMPANY in str(x.get('stockName') or '') or '三维工程' in str(x.get('stockName') or ''):
                      targets.append(x)

          def norm(v): return re.sub(r'[\s，,：:、。·—－\-（）()“”]+','',str(v or '').lower())
          guosen=None; extra=None
          for x in targets:
              t=norm(x.get('title')); broker=str(x.get('orgSName') or '')
              if '受益于新疆煤化工建设提速' in t or ('工程实业携手并进' in t and '国信' in broker): guosen=x
              if ('三业联动发展' in t or '业绩或迎拐点' in t) and '财通' in broker: extra=x
              if ('硫磺回收' in t and '正丙醇' in t) and '国盛' in broker: extra=x

          if guosen is None:
              guosen={'title':'受益于新疆煤化工建设提速，“工程+实业”携手并进','stockName':COMPANY,'stockCode':CODE,
                      'orgSName':'国信证券','publishDate':'2025-05-16 00:00:00.000','infoCode':'AP202505161673828576',
                      'attachPages':37,'attachSize':3441,'researcher':'任鹤,朱家琪','emRatingName':'增持'}
          if extra is None:
              raise RuntimeError('No second long-form report found in all-report date-window search')
          chosen=[guosen,extra]
          print('CHOSEN',json.dumps(chosen,ensure_ascii=False,indent=2),flush=True)

          def safe(v): return re.sub(r'[\\/:*?"<>|\s]+','_',str(v or '').strip())[:84]
          def urls(ic): return [f'https://pdf.dfcfw.com/pdf/{p}_{ic}_1.pdf' for p in ('H3','H2','H4')]
          records=[]; hashes=set()
          for i,x in enumerate(chosen,1):
              broker=str(x.get('orgSName') or '券商'); date=str(x.get('publishDate') or '')[:10]
              title=str(x.get('title') or '公司研究报告'); ic=str(x.get('infoCode') or '')
              dest=OUT/f'{i:02d}_{safe(broker)}_{date}_{safe(title)}.pdf'; source=None; errors=[]
              for u in urls(ic):
                  try:
                      r=s.get(u,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=(30,900)); print('DOWNLOAD',dest.name,r.status_code,u,flush=True)
                      r.raise_for_status(); data=r.content
                      if len(data)<150000 or not data.startswith(b'%PDF-'): raise RuntimeError(f'bad PDF {len(data)}')
                      dest.write_bytes(data); source=u; break
                  except Exception as e: errors.append(repr(e))
              if source is None: raise RuntimeError(f'download failed {dest.name}: {errors}')
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages); expected=int(x.get('attachPages') or 0)
              if pages<10 or (expected and abs(pages-expected)>3): raise RuntimeError(f'page mismatch {pages} vs {expected}')
              q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],capture_output=True,text=True)
              if q.returncode!=0: raise RuntimeError(q.stderr[-1200:])
              root=OUT/(dest.stem+'_render'); rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','96',str(dest),str(root)],capture_output=True,text=True)
              png=Path(str(root)+'.png')
              if rr.returncode!=0 or not png.exists() or png.stat().st_size<8000: raise RuntimeError('render failed')
              render_size=png.stat().st_size; png.unlink()
              text=''.join((reader.pages[j].extract_text() or '') for j in range(min(8,pages))); text=re.sub(r'\s+','',text)
              if COMPANY not in text and CODE not in text and '三维工程' not in text and '三维石化' not in text: raise RuntimeError('identity failed')
              raw=dest.read_bytes(); digest=hashlib.sha256(raw).hexdigest()
              if digest in hashes: raise RuntimeError('duplicate PDF')
              hashes.add(digest)
              rec={'filename':dest.name,'company':'山东三维化学集团股份有限公司','stock_code':'002469.SZ','broker':broker,'date':date,
                   'title':title,'researcher':str(x.get('researcher') or ''),'rating':str(x.get('emRatingName') or ''),'info_code':ic,
                   'source_pdf_url':source,'pages':pages,'bytes':len(raw),'sha256':digest,'first_page_render_bytes':render_size}
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          lines=['山东三维化学集团股份有限公司（三维化学，002469.SZ）券商深度报告精选','整理日期：2026-10-14','',
                 '本包收录2份券商原始排版完整PDF。','均为篇幅较长、研究框架完整的公司深度或首次覆盖报告。','']
          for i,r in enumerate(records,1):
              lines += [f"{i}. {r['broker']}，{r['date']}，{r['pages']}页",f"   标题：{r['title']}",f"   分析师：{r['researcher']}；评级：{r['rating']}",
                        f"   文件：{r['filename']}",f"   PDF来源：{r['source_pdf_url']}",f"   SHA-256：{r['sha256']}",'']
          (OUT/'00_报告清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')
          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as a:
              for p in sorted(OUT.iterdir()): a.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(z) as a:
              bad=a.testzip(); pdfs=[n for n in a.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=2: raise RuntimeError(f'ZIP validation failed bad={bad} pdfs={len(pdfs)}')
          print('FINAL_ZIP',z.name,z.stat().st_size,'SHA256',hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: sunway-chemical-002469-brokerage-reports-20261014-v2
          path: 三维化学_002469_券商深度报告精选_2份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
