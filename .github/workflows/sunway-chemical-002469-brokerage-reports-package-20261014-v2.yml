name: Inspect exact broker rows for Sunway Chemical

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Print matching broker reports in exact windows
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json,time,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2025-01-06','2025-01-08','财通证券',['三业联动','业绩或迎拐点','三维']),
            ('2025-03-17','2025-03-20','国盛证券',['硫磺回收','正丙醇','新疆煤化工','三维']),
            ('2025-04-01','2025-04-03','国海证券',['三维','化学','工程']),
            ('2025-04-07','2025-04-09','东北证券',['三维','化学','工程']),
            ('2025-04-22','2025-04-24','德邦证券',['三维','化学','工程']),
            ('2025-05-10','2025-05-12','天风证券',['三维','化学','工程']),
            ('2025-08-03','2025-08-05','广发证券',['三维','化学','工程']),
            ('2025-08-10','2025-08-12','长江证券',['炼化','煤化','新材料','三维']),
            ('2025-08-20','2025-08-22','国盛证券',['三维','化学','工程']),
          ]
          results=[]
          for begin,end,broker,keywords in windows:
            print('\nWINDOW',broker,begin,end,flush=True)
            for page in range(1,20):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':begin,'endTime':end,
                      'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),
                      'pageNumber':str(page),'_':str(int(time.time()*1000))}
              r=s.get(endpoint,params=params,timeout=60); r.raise_for_status(); rows=(r.json() or {}).get('data') or []
              print('PAGE',page,'COUNT',len(rows),flush=True)
              if not rows: break
              for x in rows:
                org=str(x.get('orgSName') or '')
                title=str(x.get('title') or '')
                name=str(x.get('stockName') or '')
                if broker.replace('证券','') in org or broker in org or any(k in title or k in name for k in keywords):
                  record={k:x.get(k) for k in ('title','stockName','stockCode','orgSName','orgName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column','reportType')}
                  print('CANDIDATE',json.dumps(record,ensure_ascii=False),flush=True)
                  if (broker.replace('证券','') in org or broker in org) and any(k in title or k in name for k in keywords):
                    results.append(x); print('STRONG_MATCH',json.dumps(x,ensure_ascii=False),flush=True)
              if len(rows)<100: break
          print('\nSTRONG_TOTAL',len(results),flush=True)
          for x in results:
            print('STRONG_SUMMARY',json.dumps({k:x.get(k) for k in ('title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName','column')},ensure_ascii=False),flush=True)
          PY
