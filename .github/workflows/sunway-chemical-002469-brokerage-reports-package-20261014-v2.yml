name: Inspect FxBaogao metadata for original report identifiers

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-brokerage-reports-package-20261014-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect page JSON and metadata
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import html,json,re,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          for doc in ('4736599','4665308'):
            url=f'https://www.fxbaogao.com/detail/{doc}'
            r=s.get(url,timeout=60); print('\nPAGE',doc,r.status_code,len(r.content),r.url,flush=True)
            text=r.text
            for term in ['__NEXT_DATA__','infoCode','reportId','reportUrl','pdfUrl','downloadUrl','fileUrl','sourceUrl','originUrl','4736599','4665308','AP2025','public.fxbaogao.com/report-image']:
              positions=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
              print('TERM',term,'COUNT',len(positions),flush=True)
              for pos in positions[:20]:
                print('CTX',text[max(0,pos-500):pos+1500].replace('\n',' '),flush=True)
            aps=sorted(set(re.findall(r'AP\d{15,}',text)))
            print('AP_CODES',aps,flush=True)
            urls=sorted(set(html.unescape(x) for x in re.findall(r'https?://[^\s"\'<>]+',text)))
            for u in urls:
              if any(k in u.lower() for k in ('pdf','report','download','file','doc','api')):
                print('URL',u,flush=True)
            # Print script bodies containing doc id, image path, or report metadata.
            for m in re.finditer(r'<script[^>]*>(.*?)</script>',text,re.I|re.S):
              body=m.group(1)
              if doc in body or 'report-image' in body or 'downloadUrl' in body or 'pdfUrl' in body or 'reportInfo' in body:
                print('SCRIPT_BODY',body[:30000],flush=True)
          PY
