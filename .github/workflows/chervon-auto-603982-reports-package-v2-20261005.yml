name: Build corrected Chervon Auto 603982 reports package 20261005

on:
  push:
    paths:
      - '.github/workflows/chervon-auto-603982-reports-package-v2-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Run corrected packaging script
        shell: bash
        run: |
          set -euo pipefail
          SRC='.github/workflows/chervon-auto-603982-reports-package-20261005.yml'
          awk 'BEGIN{f=0} /python - <<'\''PY'\''/{f=1;next} f && /^          PY$/{exit} f{sub(/^          /,""); print}' "$SRC" > /tmp/build_chervon.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/build_chervon.py')
          text = p.read_text(encoding='utf-8')
          old = "if f'{year}年年度报告' in title and not any(k in title for k in ['摘要', '英文版']):"
          new = "if f'{year}年年度报告' in title and not any(k in title for k in ['摘要', '英文版', '更正公告']) and not title.startswith('关于'):"
          if old not in text:
              raise SystemExit('annual selection pattern not found')
          text = text.replace(old, new, 1)
          old2 = "    if pages < 2:\n        raise RuntimeError(f'Unexpected page count {pages} for {title}')"
          new2 = "    if pages < 2:\n        raise RuntimeError(f'Unexpected page count {pages} for {title}')\n    if item['kind'].endswith('年年度报告') and pages < 100:\n        raise RuntimeError(f'Annual report is unexpectedly short ({pages} pages): {title}')"
          if old2 not in text:
              raise SystemExit('page validation pattern not found')
          text = text.replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python /tmp/build_chervon.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: chervon-auto-603982-reports-final-corrected
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
