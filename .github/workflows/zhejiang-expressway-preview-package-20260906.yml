name: Build Zhejiang Expressway broker report public preview package 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-preview-package-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pillow pymupdf pypdf

      - name: Download public preview pages and build PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageStat
          from pypdf import PdfReader

          package_name = '浙江沪杭甬_券商研报_公开预览版_3份_非完整版'
          out = Path(package_name)
          work = Path('_preview_work')
          renders = work / 'renders'
          out.mkdir(exist_ok=True)
          work.mkdir(exist_ok=True)
          renders.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'broker': '申万宏源',
                  'date': '2025-04-23',
                  'title': '区域经济赋能车流量长期增长，改扩建重塑资产久期',
                  'type': '公司深度／首次覆盖',
                  'rating': '买入（首次评级）',
                  'authors': '闫海、严天鹏、范晨轩',
                  'source': 'https://www.sdyanbao.com/detail/886575',
                  'full_pages': 21,
                  'preview_pages': 10,
                  'urls': [f'https://oss.sdyanbao.com/page/2025/5/7/1192234/{i}.png' for i in range(10)],
                  'referer': 'https://www.sdyanbao.com/detail/886575',
              },
              {
                  'order': 2,
                  'broker': '西南证券',
                  'date': '2026-04-06',
                  'title': '路网扩张提效，双业协同进阶',
                  'type': '公司研究／首次覆盖',
                  'rating': '买入（首次覆盖）',
                  'authors': '王湘杰、杨蕊',
                  'source': 'https://www.fxbaogao.com/detail/5345667',
                  'full_pages': None,
                  'preview_pages': 2,
                  'urls': [f'https://public.fxbaogao.com/report-image/2026/04/09/5345667-{i}.png' for i in range(1, 3)],
                  'referer': 'https://www.fxbaogao.com/view?id=5345667',
              },
              {
                  'order': 3,
                  'broker': '太平洋证券',
                  'date': '2026-06-25',
                  'title': '2025年报点评：稳健分红，H+A正在推进中',
                  'type': '公司点评／首次覆盖',
                  'rating': '增持（首次覆盖）',
                  'authors': '程志峰',
                  'source': 'https://www.fxbaogao.com/detail/5494602',
                  'full_pages': 4,
                  'preview_pages': 2,
                  'urls': [f'https://public.fxbaogao.com/report-image/2026/06/25/5494602-{i}.png' for i in range(1, 3)],
                  'referer': 'https://www.fxbaogao.com/view?id=5494602',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          def fetch_image(url: str, referer: str, dest: Path) -> dict:
              errors = []
              for attempt in range(1, 4):
                  try:
                      r = session.get(url, headers={'Referer': referer}, timeout=(20, 150), allow_redirects=True)
                      sig = r.content[:16]
                      is_image = sig.startswith(b'\x89PNG') or sig.startswith(b'\xff\xd8\xff') or sig.startswith(b'RIFF')
                      print('FETCH', attempt, r.status_code, len(r.content), r.headers.get('content-type'), r.url, flush=True)
                      if r.status_code == 200 and is_image and len(r.content) > 10000:
                          dest.write_bytes(r.content)
                          with Image.open(dest) as im:
                              im.verify()
                          with Image.open(dest) as im:
                              width, height = im.size
                              mode = im.mode
                              gray = im.convert('L')
                              extrema = gray.getextrema()
                              mean = ImageStat.Stat(gray).mean[0]
                          if width < 500 or height < 700:
                              raise RuntimeError(f'image too small: {width}x{height}')
                          if extrema[0] == extrema[1] or mean > 254.9:
                              raise RuntimeError('blank or near-blank image')
                          return {
                              'url': url,
                              'final_url': r.url,
                              'bytes': len(r.content),
                              'width': width,
                              'height': height,
                              'mode': mode,
                              'sha256': hashlib.sha256(r.content).hexdigest(),
                          }
                      errors.append(f'HTTP {r.status_code}, bytes={len(r.content)}, sig={sig!r}')
                  except Exception as exc:
                      errors.append(repr(exc))
                  time.sleep(attempt * 2)
              raise RuntimeError(f'failed to download public preview page {url}: {errors}')

          manifest = []
          for report in reports:
              image_dir = work / f"images_{report['order']}"
              image_dir.mkdir(exist_ok=True)
              image_files = []
              page_records = []
              page_hashes = set()
              for page_no, url in enumerate(report['urls'], start=1):
                  dest = image_dir / f'{page_no:03d}.png'
                  meta = fetch_image(url, report['referer'], dest)
                  if meta['sha256'] in page_hashes:
                      raise RuntimeError(f"duplicate page image in report {report['order']}: page {page_no}")
                  page_hashes.add(meta['sha256'])
                  meta['page'] = page_no
                  page_records.append(meta)
                  image_files.append(dest)

              if len(image_files) != report['preview_pages']:
                  raise RuntimeError(f"preview page count mismatch for report {report['order']}")

              pdf_tmp = work / f"report_{report['order']}.pdf"
              doc = pymupdf.open()
              for img_path in image_files:
                  with Image.open(img_path) as im:
                      width, height = im.size
                  page = doc.new_page(width=width, height=height)
                  page.insert_image(page.rect, filename=str(img_path), keep_proportion=False)
              doc.set_metadata({
                  'title': f"{report['title']}（公开预览版，非完整版）",
                  'author': report['broker'],
                  'subject': '浙江沪杭甬（00576.HK）券商研究报告公开预览页',
                  'keywords': '浙江沪杭甬,00576.HK,券商研报,公开预览版,非完整版',
              })
              doc.save(str(pdf_tmp), garbage=4, deflate=True, clean=True)
              doc.close()

              pdf_bytes = pdf_tmp.read_bytes()
              if not pdf_bytes.startswith(b'%PDF-'):
                  raise RuntimeError('invalid PDF signature')
              actual_pages = len(PdfReader(str(pdf_tmp), strict=False).pages)
              if actual_pages != report['preview_pages']:
                  raise RuntimeError(f'PDF page mismatch: {actual_pages}')
              q = subprocess.run(['qpdf', '--check', str(pdf_tmp)], capture_output=True, text=True)
              print('QPDF', report['order'], q.returncode, q.stdout[-500:], q.stderr[-500:], flush=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError('qpdf structural validation failed')

              render_doc = pymupdf.open(str(pdf_tmp))
              render_pages = sorted(set([0, actual_pages - 1]))
              for pno in render_pages:
                  pix = render_doc.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(0.8, 0.8), alpha=False)
                  render_path = renders / f"report_{report['order']}_page_{pno+1}.png"
                  pix.save(str(render_path))
                  if render_path.stat().st_size < 5000 or pix.width < 350 or pix.height < 500:
                      raise RuntimeError('PDF render validation failed')
              render_doc.close()

              safe_date = report['date'].replace('-', '')
              filename = f"{report['order']:02d}_公开预览版_非完整版_{report['broker']}_{safe_date}_{report['title']}.pdf"
              final_pdf = out / filename
              final_pdf.write_bytes(pdf_bytes)
              record = {
                  **{k: v for k, v in report.items() if k not in ('urls', 'referer')},
                  'filename': filename,
                  'actual_preview_pages': actual_pages,
                  'pdf_bytes': len(pdf_bytes),
                  'pdf_sha256': hashlib.sha256(pdf_bytes).hexdigest(),
                  'page_files': page_records,
                  'validation': ['image signature', 'image decode', 'image dimensions', 'duplicate-page check', 'PDF signature', 'PDF page count', 'qpdf structure', 'first/last page render'],
              }
              manifest.append(record)

          readme = [
              '浙江沪杭甬（00576.HK）券商研报公开预览版',
              '',
              '重要说明：本压缩包内3份PDF均为公开预览版，不是完整原始研报。文件名已明确标注“公开预览版_非完整版”。',
              '未使用登录、会员、积分、付费或其他受限下载接口，也未把摘要网页冒充完整PDF。',
              '',
          ]
          for r in manifest:
              total = f"完整报告标注为{r['full_pages']}页" if r['full_pages'] else '公开页面未可靠标注完整页数'
              readme += [
                  f"{r['order']}. {r['broker']}：《{r['title']}》",
                  f"   日期：{r['date']}；类型：{r['type']}；评级：{r['rating']}；作者：{r['authors']}",
                  f"   本包页数：{r['actual_preview_pages']}页；{total}",
                  f"   来源页面：{r['source']}",
                  f"   文件：{r['filename']}",
                  f"   SHA-256：{r['pdf_sha256']}",
                  '',
              ]
          readme += [
              '核验说明：每个PDF均通过图像解码、页面去重、PDF文件头、实际页数、qpdf结构以及首页/末页渲染检查；ZIP已执行CRC完整性检查。',
              '用途限制：仅供个人研究与学习，请遵守来源网站及报告发布机构的版权与使用条款。',
          ]
          (out / '00_说明_这些是公开预览版而非完整研报.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['pdf_sha256']}  {r['filename']}\n" for r in manifest), encoding='utf-8')

          zip_path = Path(package_name + '.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as zf:
              for p in sorted(out.iterdir()):
                  zf.write(p, arcname=f'{package_name}/{p.name}')
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdf_names = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdf_names) != 3:
                  raise RuntimeError(f'ZIP expected 3 PDFs, found {pdf_names}')
          print('FINAL', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(manifest), 'PREVIEW_PAGES', sum(x['actual_preview_pages'] for x in manifest), flush=True)
          print(json.dumps([{k: v for k, v in x.items() if k not in ('page_files',)} for x in manifest], ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-broker-report-public-previews-final
          path: 浙江沪杭甬_券商研报_公开预览版_3份_非完整版.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload validation renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-preview-validation-renders
          path: _preview_work/renders/
          if-no-files-found: ignore
          retention-days: 7
