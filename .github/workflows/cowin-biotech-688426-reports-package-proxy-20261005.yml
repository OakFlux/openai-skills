name: Build Cowin Biotech 688426 reports package via proxy 20261005

on:
  push:
    paths:
      - '.github/workflows/cowin-biotech-688426-reports-package-proxy-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf
      - name: Extract and run packaging script with environment proxy enabled
        shell: bash
        run: |
          set -euo pipefail
          SRC='.github/workflows/cowin-biotech-688426-reports-package-20261005.yml'
          awk 'BEGIN{f=0} /python - <<'\''PY'\''/{f=1;next} f && /^          PY$/{exit} f{sub(/^          /,""); print}' "$SRC" > /tmp/build_cowin.py
          sed -i 's/^s\.trust_env = False$/# use runner proxy environment/' /tmp/build_cowin.py
          python /tmp/build_cowin.py
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: cowin-biotech-688426-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
