name: Package Guomai Culture 301052 filings 20261014

on:
  push:
    paths:
      - '.triggers/guomai-301052-financial-reports-package-20261014.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '301052'
          COMPANY = '果麦文化'
          FULL_COMPANY = '果麦文化传媒股份有限公司'
          TODAY = dt.date(2026, 10, 14)
          ROOT = Path('guomai_work')
          OUT = ROOT / 'package'
          TMP = ROOT / 'tmp'
          ART = Path('artifact_out')
          for p in (OUT, TMP, ART):
              p.mkdir(parents=True, exist_ok=True)

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/json,text/plain,application/pdf,*/*',
              'Referer': f'https://data.eastmoney.com/notices/stock/{CODE}.html',
          })

          def clean(v: object) -> str:
              return re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', html.unescape(str(v or '')))).strip()

          def safe(v: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', v).strip(' ._')[:145]

          # Discover all public disclosure metadata for the security.
          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          announcements: list[dict] = []
          seen = set()
          for page in range(1, 31):
              params = {
                  'sr': '-1',
                  'page_size': '100',
                  'page_index': str(page),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': CODE,
              }
              last = None
              for attempt in range(1, 5):
                  try:
                      r = s.get(api, params=params, timeout=(20, 120))
                      print('ANN_HTTP', page, attempt, r.status_code, len(r.content), r.url, flush=True)
                      if r.status_code == 200:
                          j = r.json()
                          break
                      last = RuntimeError(f'HTTP {r.status_code}: {r.text[:200]}')
                  except Exception as e:
                      last = e
                  time.sleep(attempt)
              else:
                  raise RuntimeError(f'Announcement API failed on page {page}: {last!r}')
              data = j.get('data') or {}
              rows = data.get('list') or []
              total = int(data.get('total_hits') or data.get('total') or 0)
              print('ANN_PAGE', page, 'rows', len(rows), 'total', total, 'keys', list(data.keys()), flush=True)
              for row in rows:
                  blob = json.dumps(row, ensure_ascii=False)
                  if CODE not in blob and COMPANY not in blob:
                      continue
                  key = str(row.get('art_code') or row.get('artCode') or row.get('id') or blob)
                  if key not in seen:
                      seen.add(key)
                      announcements.append(row)
              if not rows or len(rows) < 100 or (total and page * 100 >= total):
                  break
              time.sleep(0.15)

          print('ANNOUNCEMENT_COUNT', len(announcements), flush=True)
          for row in announcements:
              title = clean(row.get('title') or row.get('title_ch') or row.get('announcementTitle') or '')
              if any(k in title for k in ['年度报告', '季度报告', '招股说明书']):
                  print('MATCH_META', json.dumps(row, ensure_ascii=False)[:12000], flush=True)
          (ROOT / 'announcement_metadata.json').write_text(json.dumps(announcements, ensure_ascii=False, indent=2), encoding='utf-8')

          def normalize(row: dict) -> dict:
              title = clean(row.get('title') or row.get('title_ch') or row.get('announcementTitle') or '')
              art_code = str(row.get('art_code') or row.get('artCode') or row.get('announcementId') or '').strip()
              raw_date = clean(row.get('notice_date') or row.get('display_time') or row.get('noticeDate') or row.get('announcementTime') or '')
              date_match = re.search(r'20\d{2}[-/]\d{1,2}[-/]\d{1,2}', raw_date)
              date = date_match.group(0).replace('/', '-') if date_match else ''
              ts = 0
              if date:
                  try:
                      ts = int(dt.datetime.strptime(date, '%Y-%m-%d').replace(tzinfo=dt.timezone.utc).timestamp())
                  except Exception:
                      pass
              direct_urls = []
              for k in ('attach_url', 'attachUrl', 'pdf_url', 'pdfUrl', 'url', 'download_url', 'downloadUrl'):
                  u = row.get(k)
                  if isinstance(u, str) and u.startswith('http'):
                      direct_urls.append(u)
              if art_code:
                  direct_urls += [
                      f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H2_{art_code}_01.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{art_code}_01.pdf',
                  ]
              return {
                  'title': title,
                  'art_code': art_code,
                  'announcement_date': date,
                  'announcement_time': ts,
                  'candidate_urls': list(dict.fromkeys(direct_urls)),
                  'raw': row,
              }

          normalized = [normalize(x) for x in announcements]

          annual_candidates = []
          for r in normalized:
              t = r['title']
              if any(x in t for x in ['摘要', '英文版', '英文', '取消', '审计报告', '业绩说明会', '问询函', '提示性公告']):
                  continue
              m = re.search(r'(20\d{2})年年度报告(?:（[^）]+）)?$', t) or re.search(r'(20\d{2})年度报告(?:（[^）]+）)?$', t)
              if m:
                  r = dict(r)
                  r['report_year'] = int(m.group(1))
                  annual_candidates.append(r)
          if not annual_candidates:
              raise RuntimeError('No full annual reports found in public metadata')

          annual_selected = []
          for year in sorted({x['report_year'] for x in annual_candidates}):
              group = [x for x in annual_candidates if x['report_year'] == year]
              group.sort(key=lambda x: (
                  2 if any(k in x['title'] for k in ['更正后', '更新后', '修订版', '修订稿']) else 0,
                  x['announcement_time'],
              ), reverse=True)
              annual_selected.append(group[0])

          prospectus_candidates = []
          for r in normalized:
              t = r['title']
              if '首次公开发行股票' in t and '招股说明书' in t and not any(x in t for x in ['摘要', '提示性公告', '上市公告书', '回复', '法律意见书']):
                  r = dict(r)
                  r['draft_penalty'] = sum(1 for x in ['申报稿', '上会稿', '注册稿'] if x in t)
                  prospectus_candidates.append(r)
          if not prospectus_candidates:
              for r in normalized:
                  t = r['title']
                  if '招股说明书' in t and '摘要' not in t:
                      r = dict(r)
                      r['draft_penalty'] = sum(1 for x in ['申报稿', '上会稿', '注册稿'] if x in t)
                      prospectus_candidates.append(r)
          if not prospectus_candidates:
              raise RuntimeError('No prospectus found in public metadata')
          prospectus_candidates.sort(key=lambda x: (-x['draft_penalty'], x['announcement_time']), reverse=True)
          prospectus_selected = prospectus_candidates[0]

          quarter_candidates = []
          for r in normalized:
              t = r['title']
              if any(x in t for x in ['摘要', '英文版', '英文', '更正公告', '提示性公告', '取消']):
                  continue
              m = re.search(r'(20\d{2})年(第一|第三)季度报告(?:（[^）]+）)?$', t)
              if m:
                  r = dict(r)
                  r['report_year'] = int(m.group(1))
                  r['quarter'] = 1 if m.group(2) == '第一' else 3
                  quarter_candidates.append(r)
          if not quarter_candidates:
              raise RuntimeError('No complete quarterly report found in public metadata')
          quarter_candidates.sort(key=lambda x: (x['report_year'], x['quarter'], x['announcement_time']), reverse=True)
          quarter_selected = quarter_candidates[0]

          selected = []
          for r in annual_selected:
              selected.append({**r, 'document_type': '年度报告', 'period': str(r['report_year'])})
          selected.append({**prospectus_selected, 'document_type': '招股说明书', 'period': 'IPO'})
          selected.append({**quarter_selected, 'document_type': '最新季报', 'period': f"{quarter_selected['report_year']}Q{quarter_selected['quarter']}"})
          print('SELECTED', json.dumps([{k:v for k,v in x.items() if k != 'raw'} for x in selected], ensure_ascii=False, indent=2), flush=True)

          def download_pdf(rec: dict, target: Path) -> str:
              errors = []
              for url in rec['candidate_urls']:
                  for attempt in range(1, 4):
                      try:
                          r = s.get(url, timeout=(20, 240), allow_redirects=True, headers={'Referer': 'https://data.eastmoney.com/', 'Accept': 'application/pdf,*/*'})
                          print('PDF_TRY', attempt, r.status_code, len(r.content), url, 'FINAL', r.url, flush=True)
                          if r.status_code == 200 and len(r.content) >= 50_000 and r.content.startswith(b'%PDF-'):
                              target.write_bytes(r.content)
                              return url
                          errors.append(f'{url}: HTTP {r.status_code}, {len(r.content)} bytes')
                      except Exception as e:
                          errors.append(f'{url}: {e!r}')
                      time.sleep(attempt * 0.8)
              raise RuntimeError(f'Could not download {rec["title"]}: ' + ' | '.join(errors[-20:]))

          manifest = []
          seen_sha = set()
          for index, rec in enumerate(selected, 1):
              if rec['document_type'] == '年度报告':
                  filename = f"{rec['period']}年_果麦文化_年度报告.pdf"
              elif rec['document_type'] == '招股说明书':
                  filename = '2021年_果麦文化_首次公开发行股票并在创业板上市招股说明书.pdf'
              else:
                  filename = f"{rec['period']}_果麦文化_最新季报.pdf"
              filename = safe(filename)
              path = OUT / filename
              used_url = download_pdf(rec, path)

              q = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              print('QPDF', filename, q.returncode, q.stdout[-800:], q.stderr[-800:], flush=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {filename}: {q.stderr[-800:]}')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 2:
                  raise RuntimeError(f'Unexpected page count for {filename}: {pages}')
              text_parts = []
              for pi in list(range(min(10, pages))) + list(range(max(0, pages - 2), pages)):
                  try:
                      text_parts.append(reader.pages[pi].extract_text() or '')
                  except Exception:
                      pass
              sample = '\n'.join(text_parts)
              if COMPANY not in sample and FULL_COMPANY not in sample and CODE not in sample:
                  raise RuntimeError(f'Company identity validation failed for {filename}')
              if rec['document_type'] == '年度报告' and ('年度报告' not in sample or rec['period'] not in sample):
                  raise RuntimeError(f'Annual-report validation failed for {filename}')
              if rec['document_type'] == '招股说明书' and '招股说明书' not in sample:
                  raise RuntimeError(f'Prospectus validation failed for {filename}')
              if rec['document_type'] == '最新季报' and '季度报告' not in sample:
                  raise RuntimeError(f'Quarterly-report validation failed for {filename}')

              render_prefix = TMP / f'render_{index:02d}'
              rr = subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '90', str(path), str(render_prefix)], capture_output=True, text=True)
              render_path = Path(str(render_prefix) + '.png')
              if rr.returncode != 0 or not render_path.exists() or render_path.stat().st_size < 10_000:
                  raise RuntimeError(f'First-page render failed for {filename}: {rr.stderr[-800:]}')

              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_sha:
                  raise RuntimeError(f'Duplicate PDF detected: {filename}')
              seen_sha.add(sha)
              item = {
                  'document_type': rec['document_type'],
                  'period': rec['period'],
                  'title': rec['title'],
                  'announcement_date': rec['announcement_date'],
                  'source_url': used_url,
                  'art_code': rec['art_code'],
                  'filename': filename,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              manifest.append(item)
              print('VERIFIED', json.dumps(item, ensure_ascii=False), flush=True)

          annual_years = [x['period'] for x in manifest if x['document_type'] == '年度报告']
          prospectus = next(x for x in manifest if x['document_type'] == '招股说明书')
          latest_quarter = next(x for x in manifest if x['document_type'] == '最新季报')
          readme = [
              '果麦文化传媒股份有限公司（301052.SZ）全部年度报告、招股说明书及最新季报',
              f'整理日期：{TODAY.isoformat()}',
              '文件为公开披露完整PDF，已逐份进行结构、内容和渲染检查。',
              '',
              f'年度报告：{", ".join(annual_years)}年度，共{len(annual_years)}份。',
              f'招股说明书：{prospectus["title"]}。',
              f'最新季报：{latest_quarter["title"]}（{latest_quarter["period"]}）。',
              '',
              '说明：',
              '1. 排除年度报告摘要、英文版、单独审计报告、更正公告和提示性公告。',
              '2. 同一年度如存在修订或更新全文，优先采用较新的完整版本。',
              '3. 果麦文化于2021年上市，上市前不存在独立上市公司年度报告的年份不作虚构补齐。',
              '4. 已检查PDF文件头、公司名称/证券代码、报告类型、实际页数、qpdf结构、首屏渲染、重复文件及ZIP CRC。',
              '',
              '文件清单：',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f'{i}. {item["filename"]}',
                  f'   类型：{item["document_type"]}；报告期：{item["period"]}',
                  f'   官方标题：{item["title"]}',
                  f'   公告日期：{item["announcement_date"]}；页数：{item["pages"]}；大小：{item["bytes"]} bytes',
                  f'   公开PDF：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest), encoding='utf-8')

          zip_name = f'果麦文化_301052_全部年报_招股说明书及最新季报_截至{TODAY.isoformat()}.zip'
          zip_path = ART / zip_name
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for p in sorted(OUT.iterdir()):
                  zf.write(p, arcname=p.name)
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdf_count = sum(1 for n in zf.namelist() if n.lower().endswith('.pdf'))
              if pdf_count != len(manifest):
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count} vs {len(manifest)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, zip_sha, flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: guomai-301052-financial-reports
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
