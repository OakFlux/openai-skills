name: Temporary Johnson Electric public full-page report package

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-johnson-electric-public-pages-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare PDF tools
        run: |
          python -m pip install --disable-pip-version-check --quiet requests pillow img2pdf pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download public report pages, assemble PDFs, verify and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          REPORTS = [
              {
                  'broker': '爱建证券',
                  'report_date': '2025-11-06',
                  'folder_date': '2025/11/06',
                  'report_id': '5138556',
                  'pages': 37,
                  'title': '首次覆盖报告：汽车微电机单车价值提升，机器人与AIDC液冷泵开辟新成长曲线',
                  'filename': '01_Johnson_Electric_Aijian_20251106_37p_Public_Full_Page.pdf',
                  'detail_url': 'https://www.fxbaogao.com/detail/5138556',
              },
              {
                  'broker': '国泰海通证券',
                  'report_date': '2025-10-16',
                  'folder_date': '2025/10/16',
                  'report_id': '5099547',
                  'pages': 18,
                  'title': '有内生优势的人形机器人供应链公司',
                  'filename': '02_Johnson_Electric_Guotai_Haitong_20251016_18p_Public_Full_Page.pdf',
                  'detail_url': 'https://www.fxbaogao.com/detail/5099547',
              },
              {
                  'broker': '国盛证券',
                  'report_date': '2026-03-04',
                  'folder_date': '2026/03/04',
                  'report_id': '5284768',
                  'pages': 28,
                  'title': '车用电机龙头，AIDC液冷+机器人开启成长新曲线',
                  'filename': '03_Johnson_Electric_Guosheng_20260304_28p_Public_Full_Page.pdf',
                  'detail_url': 'https://www.fxbaogao.com/detail/5284768',
              },
          ]

          out = Path('Johnson_Electric_Broker_Deep_Reports')
          evidence = Path('verification')
          out.mkdir(exist_ok=True)
          evidence.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          manifest = []
          for report_index, report in enumerate(REPORTS, 1):
              page_dir = Path('pages') / report['report_id']
              page_dir.mkdir(parents=True, exist_ok=True)
              page_paths = []
              page_hashes = []

              for page_no in range(1, report['pages'] + 1):
                  base = f"https://public.fxbaogao.com/report-image/{report['folder_date']}/{report['report_id']}-{page_no}.png"
                  urls = [
                      base,
                      base + '?x-oss-process=image/format,png',
                      base + '?x-oss-process=image/resize,w_1980/format,png',
                  ]
                  content = None
                  used_url = None
                  last = None
                  for attempt in range(1, 5):
                      for url in urls:
                          try:
                              r = session.get(url, headers={'Referer': report['detail_url']}, timeout=(20, 90), allow_redirects=True)
                              last = f"status={r.status_code}, bytes={len(r.content)}, type={r.headers.get('content-type')}"
                              if r.status_code == 200 and len(r.content) > 20_000 and str(r.headers.get('content-type') or '').startswith('image/'):
                                  try:
                                      im = Image.open(io.BytesIO(r.content))
                                      im.verify()
                                      content = r.content
                                      used_url = r.url
                                      break
                                  except Exception as img_exc:
                                      last = f'image validation failed: {img_exc!r}'
                          except Exception as exc:
                              last = repr(exc)
                      if content is not None:
                          break
                      time.sleep(attempt)
                  if content is None:
                      raise RuntimeError(f"Unable to fetch report {report['report_id']} page {page_no}: {last}")

                  # Normalize all pages to high-quality JPEG for stable, reasonably-sized PDF output.
                  image = Image.open(io.BytesIO(content)).convert('RGB')
                  if image.width < 1000 or image.height < 1400:
                      raise RuntimeError(
                          f"Page resolution too small for {report['report_id']} page {page_no}: {image.size}"
                      )
                  page_path = page_dir / f'{page_no:03d}.jpg'
                  image.save(page_path, 'JPEG', quality=93, optimize=True, subsampling=0, dpi=(160, 160))
                  page_paths.append(page_path)
                  page_hashes.append(hashlib.sha256(page_path.read_bytes()).hexdigest())
                  print('PAGE_OK', report['report_id'], page_no, image.size, len(content), used_url)

              pdf_path = out / report['filename']
              with pdf_path.open('wb') as f:
                  f.write(img2pdf.convert([str(p) for p in page_paths]))

              reader = PdfReader(str(pdf_path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != report['pages']:
                  raise RuntimeError(
                      f"Page count mismatch for {report['report_id']}: {actual_pages} != {report['pages']}"
                  )
              pdf_bytes = pdf_path.read_bytes()
              if not pdf_bytes.startswith(b'%PDF-'):
                  raise RuntimeError(f"Invalid PDF header for {pdf_path}")
              sha = hashlib.sha256(pdf_bytes).hexdigest()

              # Render first and last page as evidence of PDF readability.
              import subprocess
              subprocess.run([
                  'pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '100',
                  str(pdf_path), str(evidence / f'{report_index:02d}_first')
              ], check=True)
              subprocess.run([
                  'pdftoppm', '-f', str(actual_pages), '-singlefile', '-png', '-r', '80',
                  str(pdf_path), str(evidence / f'{report_index:02d}_last')
              ], check=True)

              manifest.append({
                  **report,
                  'actual_pages': actual_pages,
                  'bytes': len(pdf_bytes),
                  'sha256': sha,
                  'page_image_sha256': page_hashes,
                  'format_note': '由无需登录即可访问的公开逐页高清阅读图合成为PDF；不是券商网站直接提供的原始PDF文件流。',
                  'validation': '通过：公开页面序列完整、图片分辨率、PDF文件头、实际页数、首末页渲染和ZIP完整性。',
              })
              print('PDF_OK', json.dumps({k: v for k, v in manifest[-1].items() if k != 'page_image_sha256'}, ensure_ascii=False))

          readme = [
              '德昌电机控股（00179.HK）券商深度报告下载包',
              '',
              '本包包含3份公司深度/首次覆盖报告。',
              '文件由报告平台无需登录即可访问的逐页高清阅读图合成为PDF，内容及页序完整；并非券商服务器直接提供的原始PDF文件流。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['broker']}｜{item['report_date']}｜{item['actual_pages']}页",
                  f"   标题：{item['title']}",
                  f"   文件：{item['filename']}",
                  f"   来源详情页：{item['detail_url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += ['资料仅供研究参考，不构成投资建议。']
          (out / 'README_报告清单与核验信息.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          with (out / 'SHA256SUMS.txt').open('w', encoding='utf-8') as f:
              for item in manifest:
                  f.write(f"{item['sha256']}  {item['filename']}\n")

          zip_ascii = Path('johnson_electric_broker_deep_reports_3.zip')
          zip_cn = Path('德昌电机控股_券商深度报告_3份.zip')
          for zip_path in [zip_ascii, zip_cn]:
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
                  for p in sorted(out.iterdir()):
                      z.write(p, arcname=p.name)
              with zipfile.ZipFile(zip_path, 'r') as z:
                  bad = z.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP integrity failure: {zip_path} / {bad}')
                  pdf_count = sum(name.lower().endswith('.pdf') for name in z.namelist())
                  if pdf_count != 3:
                      raise RuntimeError(f'Unexpected PDF count in {zip_path}: {pdf_count}')
              print('ZIP_OK', zip_path, zip_path.stat().st_size)

          Path('selected_manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: Johnson_Electric_Broker_Deep_Reports_Final
          path: |
            johnson_electric_broker_deep_reports_3.zip
            德昌电机控股_券商深度报告_3份.zip
            Johnson_Electric_Broker_Deep_Reports/*.pdf
            Johnson_Electric_Broker_Deep_Reports/*.txt
            Johnson_Electric_Broker_Deep_Reports/manifest.json
            verification/*.png
            selected_manifest.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
