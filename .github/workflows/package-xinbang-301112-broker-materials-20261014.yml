name: Package Xinbang Intelligent broker materials

on:
  push:
    paths:
      - 'tasks/xinbang-301112-broker-materials-20261014.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '信邦智能'
          CODE = '301112'
          AS_OF = '2026-10-14'
          work = Path('work')
          package_dir = work / '信邦智能_301112_券商深度及投行材料精选'
          render_dir = work / 'renders'
          out = Path('artifact_out')
          for p in (package_dir, render_dir, out):
              p.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'date': '2026-04-29',
                  'broker': '华泰联合证券',
                  'title': '关于广州信邦智能装备股份有限公司发行股份及支付现金购买资产并募集配套资金暨关联交易之独立财务顾问报告（修订稿）',
                  'classification': '并购重组独立财务顾问深度报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202604281821708428_1.pdf',
                  'broker_tokens': ['华泰联合证券', '华泰联合'],
              },
              {
                  'date': '2026-04-29',
                  'broker': '国泰海通证券',
                  'title': '关于广州信邦智能装备股份有限公司发行股份及支付现金购买资产并募集配套资金暨关联交易之独立财务顾问报告（修订稿）',
                  'classification': '并购重组独立财务顾问深度报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202604281821708437_1.pdf',
                  'broker_tokens': ['国泰海通证券', '国泰海通'],
              },
              {
                  'date': '2022-06-02',
                  'broker': '中信证券',
                  'title': '关于广州信邦智能装备股份有限公司首次公开发行股票并在创业板上市之发行保荐书',
                  'classification': 'IPO发行保荐与深度尽调材料',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202206011569364696_1.pdf',
                  'broker_tokens': ['中信证券'],
              },
          ]

          retry = Retry(
              total=5, connect=5, read=5, status=5,
              backoff_factor=1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/pdf,*/*',
              'Referer': 'https://data.eastmoney.com/',
          })

          def safe(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              text = re.sub(r'\s+', '', text)
              return text.strip(' ._')[:120]

          manifest = []
          seen_hashes = set()
          for index, report in enumerate(reports, 1):
              filename = f'{index:02d}_{report["date"]}_{report["broker"]}_{safe(report["title"])}.pdf'
              path = package_dir / filename
              errors = []
              data = b''
              for attempt in range(1, 5):
                  try:
                      response = session.get(report['url'], timeout=(25, 300), allow_redirects=True)
                      data = response.content
                      print('DOWNLOAD', index, attempt, response.status_code, len(data), response.url, flush=True)
                      if response.status_code == 200 and len(data) > 100_000 and data.startswith(b'%PDF-'):
                          path.write_bytes(data)
                          break
                      errors.append(f'HTTP {response.status_code}, {len(data)} bytes, {response.headers.get("content-type")}')
                  except Exception as exc:
                      errors.append(repr(exc))
                  time.sleep(attempt)
              if not path.exists():
                  raise RuntimeError(f'Download failed for {report["title"]}: {errors}')

              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF detected: {filename}')
              seen_hashes.add(digest)

              qpdf = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              print('QPDF', filename, qpdf.returncode, qpdf.stdout[-500:], qpdf.stderr[-500:], flush=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {filename}: {qpdf.stderr[-800:]}')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 10:
                  raise RuntimeError(f'Unexpectedly short document {filename}: {pages} pages')

              indices = list(range(min(15, pages)))
              if pages > 15:
                  indices.extend([pages // 2, pages - 1])
              parts = []
              for page_index in indices:
                  try:
                      parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              sample = '\n'.join(parts)
              if COMPANY not in sample and CODE not in sample and '广州信邦智能装备' not in sample:
                  raise RuntimeError(f'Company validation failed for {filename}')
              if not any(token in sample for token in report['broker_tokens']):
                  raise RuntimeError(f'Broker validation failed for {filename}')
              if not any(token in sample for token in ['财务顾问报告', '发行保荐书', '保荐机构', '独立财务顾问']):
                  raise RuntimeError(f'Document-type validation failed for {filename}')

              render_prefix = render_dir / f'first_{index:02d}'
              rendered = subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '100', str(path), str(render_prefix)],
                  capture_output=True, text=True,
              )
              rendered_path = Path(str(render_prefix) + '.png')
              if rendered.returncode != 0 or not rendered_path.exists() or rendered_path.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page render failed for {filename}: {rendered.stderr[-800:]}')

              item = {
                  **{k: v for k, v in report.items() if k != 'broker_tokens'},
                  'filename': filename,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
              }
              manifest.append(item)
              print('VERIFIED', json.dumps(item, ensure_ascii=False), flush=True)

          readme = [
              '信邦智能（301112.SZ）券商深度及投行材料精选',
              f'整理日期：{AS_OF}',
              '',
              '口径说明：公开渠道中，信邦智能的标准卖方首次覆盖/评级深度研报数量较少。本包因此收录3份由证券公司正式出具、对公司及相关交易进行系统分析的完整文件：两份并购重组独立财务顾问报告，以及一份IPO发行保荐与深度尽调材料。它们具有较强的公司、行业、业务、财务和风险分析价值，但不应全部理解为证券研究所发布的日常股票评级研报。',
              '',
              '文件清单：',
          ]
          for index, item in enumerate(manifest, 1):
              readme.extend([
                  f'{index}. {item["filename"]}',
                  f'   机构：{item["broker"]}',
                  f'   类型：{item["classification"]}',
                  f'   标题：{item["title"]}',
                  f'   日期：{item["date"]}',
                  f'   页数：{item["pages"]}；大小：{item["bytes"]} bytes',
                  f'   公开来源：{item["url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ])
          readme.extend([
              '完整性检查：已检查PDF文件头、文件大小、公司名称/证券代码、出具机构、文件类型、实际页数、qpdf结构、首页渲染、重复哈希及ZIP CRC。',
              '本资料包仅用于公开资料归档，不构成投资建议。',
          ])
          (package_dir / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (package_dir / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (package_dir / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = out / '信邦智能_301112_券商深度及投行材料_3份.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(package_dir.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdf_count = sum(1 for name in archive.namelist() if name.lower().endswith('.pdf'))
              if pdf_count != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count}')
          zip_hash = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, zip_hash, flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-broker-materials-v2
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
