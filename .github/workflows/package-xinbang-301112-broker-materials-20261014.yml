name: Package Xinbang Intelligent broker materials

on:
  push:
    paths:
      - 'tasks/xinbang-301112-broker-materials-20261014.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '信邦智能'
          CODE = '301112'
          AS_OF = '2026-10-14'
          work = Path('work')
          pdf_dir = work / 'pdfs'
          render_dir = work / 'renders'
          out = Path('artifact_out')
          for p in (pdf_dir, render_dir, out):
              p.mkdir(parents=True, exist_ok=True)

          retry = Retry(
              total=5, connect=5, read=5, status=5,
              backoff_factor=1,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.mount('http://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/pdf,application/json,text/plain,*/*',
          })

          candidates = [
              {
                  'priority': 10,
                  'date': '2026-01-09',
                  'broker': '华泰联合证券',
                  'title': '关于广州信邦智能装备股份有限公司发行股份及支付现金购买资产并募集配套资金暨关联交易之独立财务顾问报告（修订稿）',
                  'classification': '并购重组独立财务顾问深度报告',
                  'urls': ['https://static.cninfo.com.cn/finalpage/2026-01-09/1224925850.PDF'],
              },
              {
                  'priority': 20,
                  'date': '2022-03-31',
                  'broker': '中信证券（保荐机构）',
                  'title': '发行人及保荐机构关于发行注册环节反馈意见落实函的回复',
                  'classification': 'IPO注册反馈深度尽调材料',
                  'urls': [
                      'https://www.csrc.gov.cn/csrc/c100091/c2252158/2252158/files/%E5%8F%91%E8%A1%8C%E4%BA%BA%E5%8F%8A%E4%BF%9D%E8%8D%90%E6%9C%BA%E6%9E%84%E5%85%B3%E4%BA%8E%E5%8F%91%E8%A1%8C%E6%B3%A8%E5%86%8C%E7%8E%AF%E8%8A%82%E5%8F%8D%E9%A6%88%E6%84%8F%E8%A7%81%E8%90%BD%E5%AE%9E%E5%87%BD%E7%9A%84%E5%9B%9E%E5%A4%8D.pdf'
                  ],
              },
          ]

          # Discover current broker-authored company documents from the public announcement API.
          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          keys = [
              '独立财务顾问报告',
              '2025年度跟踪报告',
              '持续督导保荐总结报告书',
              '持续督导定期现场检查报告',
              '上市保荐书',
              '发行保荐书',
          ]
          discovered = []
          for page in range(1, 20):
              params = {
                  'sr': '-1', 'page_size': '100', 'page_index': str(page),
                  'ann_type': 'A', 'client_source': 'web', 'stock_list': CODE,
                  'f_node': '0', 's_node': '0',
              }
              try:
                  response = session.get(api, params=params, timeout=(20, 120), headers={'Referer': 'https://data.eastmoney.com/notices/'})
                  print('ANN_API', page, response.status_code, len(response.content), response.url, flush=True)
                  if response.status_code != 200:
                      break
                  payload = response.json()
                  rows = ((payload.get('data') or {}).get('list') or [])
                  if not rows:
                      break
                  for row in rows:
                      title = str(row.get('title') or '').strip()
                      art_code = str(row.get('art_code') or '').strip()
                      if art_code and any(key in title for key in keys):
                          date = str(row.get('notice_date') or row.get('display_time') or '')[:10]
                          item = {
                              'priority': 30,
                              'date': date,
                              'broker': '券商公开披露文件',
                              'title': title,
                              'classification': '券商跟踪或专项核查材料',
                              'urls': [
                                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_01.pdf',
                                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_01.pdf',
                              ],
                              'art_code': art_code,
                          }
                          discovered.append(item)
                          print('ANN_CANDIDATE', json.dumps(item, ensure_ascii=False), flush=True)
                  if len(rows) < 100:
                      break
              except Exception as exc:
                  print('ANN_API_ERR', page, repr(exc), flush=True)
                  break
              time.sleep(0.15)

          # Prefer substantive documents and distinct titles.
          seen_titles = set()
          for item in discovered:
              title = item['title']
              if title in seen_titles:
                  continue
              seen_titles.add(title)
              if '独立财务顾问报告' in title:
                  item['priority'] = 12
                  item['broker'] = '独立财务顾问'
                  item['classification'] = '并购重组独立财务顾问报告'
              elif '2025年度跟踪报告' in title:
                  item['priority'] = 31
                  item['broker'] = '中信证券'
                  item['classification'] = '年度持续督导跟踪报告'
              elif '保荐总结报告书' in title:
                  item['priority'] = 32
                  item['broker'] = '中信证券'
                  item['classification'] = '持续督导保荐总结报告'
              elif '现场检查报告' in title:
                  item['priority'] = 35
                  item['broker'] = '中信证券'
                  item['classification'] = '持续督导现场检查报告'
              candidates.append(item)

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              text = re.sub(r'\s+', '', text)
              return text.strip(' ._')[:115]

          def download(item: dict, target: Path) -> tuple[str, bytes]:
              errors = []
              for url in item['urls']:
                  for attempt in range(1, 4):
                      try:
                          headers = {
                              'Referer': 'https://data.eastmoney.com/' if 'dfcfw.com' in url else 'https://www.cninfo.com.cn/',
                              'Accept': 'application/pdf,*/*',
                          }
                          response = session.get(url, timeout=(25, 240), allow_redirects=True, headers=headers)
                          data = response.content
                          print('DOWNLOAD', item['title'][:50], attempt, response.status_code, len(data), url, 'FINAL', response.url, flush=True)
                          if response.status_code == 200 and len(data) > 50_000 and data.startswith(b'%PDF-'):
                              target.write_bytes(data)
                              return url, data
                          errors.append(f'{url}: HTTP {response.status_code}, {len(data)} bytes, {response.headers.get("content-type")}')
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(attempt)
              raise RuntimeError(' | '.join(errors[-12:]))

          verified = []
          seen_hashes = set()
          failures = []

          # Download by priority; stop after three verified, but require at least two.
          candidates = sorted(candidates, key=lambda x: (x.get('priority', 99), x.get('date', '')))
          for item in candidates:
              if len(verified) >= 3:
                  break
              stem = f"{item.get('date') or '日期不详'}_{item.get('broker')}_{safe_name(item['title'])}"
              temp_path = pdf_dir / (safe_name(stem) + '.pdf')
              try:
                  source_url, data = download(item, temp_path)
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in seen_hashes:
                      temp_path.unlink(missing_ok=True)
                      print('DUPLICATE', item['title'], flush=True)
                      continue

                  qpdf = subprocess.run(['qpdf', '--check', str(temp_path)], capture_output=True, text=True)
                  if qpdf.returncode not in (0, 3):
                      raise RuntimeError('qpdf check failed: ' + qpdf.stderr[-800:])

                  reader = PdfReader(str(temp_path), strict=False)
                  pages = len(reader.pages)
                  if pages < 3:
                      raise RuntimeError(f'page count too small: {pages}')

                  text_parts = []
                  sample_indices = list(range(min(12, pages)))
                  if pages > 12:
                      sample_indices.extend([pages - 1])
                  for idx in sample_indices:
                      try:
                          text_parts.append(reader.pages[idx].extract_text() or '')
                      except Exception:
                          pass
                  sample = '\n'.join(text_parts)
                  if COMPANY not in sample and CODE not in sample and '广州信邦智能装备' not in sample:
                      raise RuntimeError('company identity validation failed')
                  if not any(token in sample for token in ['证券', '保荐', '财务顾问', '研究报告', '跟踪报告']):
                      raise RuntimeError('broker-document validation failed')

                  render_prefix = render_dir / f'first_{len(verified)+1}'
                  render = subprocess.run(
                      ['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '90', str(temp_path), str(render_prefix)],
                      capture_output=True, text=True,
                  )
                  rendered = Path(str(render_prefix) + '.png')
                  if render.returncode != 0 or not rendered.exists() or rendered.stat().st_size < 8_000:
                      raise RuntimeError('first-page render failed: ' + render.stderr[-800:])

                  final_name = f"{len(verified)+1:02d}_{item.get('date') or '日期不详'}_{item.get('broker')}_{safe_name(item['title'])}.pdf"
                  final_path = pdf_dir / final_name
                  temp_path.rename(final_path)
                  seen_hashes.add(digest)
                  record = {
                      **{k: v for k, v in item.items() if k != 'urls'},
                      'filename': final_name,
                      'pages': pages,
                      'bytes': len(data),
                      'sha256': digest,
                      'source_url': source_url,
                  }
                  verified.append(record)
                  print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)
              except Exception as exc:
                  temp_path.unlink(missing_ok=True)
                  failure = {'title': item['title'], 'error': repr(exc), 'urls': item.get('urls', [])}
                  failures.append(failure)
                  print('FAILED', json.dumps(failure, ensure_ascii=False), flush=True)

          if len(verified) < 2:
              raise RuntimeError(f'Only {len(verified)} documents verified; failures={json.dumps(failures, ensure_ascii=False)}')

          package_dir = work / '信邦智能_301112_券商深度材料精选'
          package_dir.mkdir()
          for record in verified:
              src = pdf_dir / record['filename']
              src.rename(package_dir / record['filename'])

          readme = [
              '信邦智能（301112.SZ）券商深度材料精选',
              f'整理日期：{AS_OF}',
              '',
              '口径说明：信邦智能公开可直接获取的标准卖方首次覆盖/评级深度报告较少。本包优先收录券商对公司进行系统分析的公开完整文件，包括并购重组独立财务顾问报告、IPO注册反馈深度尽调材料及持续督导文件。它们均为券商出具或由券商作为保荐机构共同出具，但不应全部视作日常股票评级研报。',
              '',
              '文件清单：',
          ]
          for idx, record in enumerate(verified, 1):
              readme.extend([
                  f'{idx}. {record["filename"]}',
                  f'   机构：{record.get("broker")}',
                  f'   类型：{record.get("classification")}',
                  f'   标题：{record.get("title")}',
                  f'   日期：{record.get("date") or "日期不详"}',
                  f'   页数：{record["pages"]}；大小：{record["bytes"]} bytes',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])
          readme.extend([
              '完整性检查：PDF文件头、文件大小、公司名称/证券代码、券商文件属性、页数、qpdf结构、首页渲染、重复哈希及ZIP CRC均已检查。',
              '本包仅作公开资料归档，不构成投资建议。',
          ])
          (package_dir / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (package_dir / 'manifest.json').write_text(json.dumps(verified, ensure_ascii=False, indent=2), encoding='utf-8')
          (package_dir / 'SHA256SUMS.txt').write_text(
              ''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in verified),
              encoding='utf-8',
          )
          (package_dir / 'download_failures.json').write_text(json.dumps(failures, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = out / f'信邦智能_301112_券商深度材料_{len(verified)}份.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(package_dir.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdf_count = sum(1 for name in archive.namelist() if name.lower().endswith('.pdf'))
              if pdf_count != len(verified):
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count} != {len(verified)}')
          zip_hash = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, zip_hash, flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-broker-materials
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
