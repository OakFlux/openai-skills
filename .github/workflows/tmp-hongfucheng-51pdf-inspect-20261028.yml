name: Inspect 51pdf Hongfucheng report page

on:
  push:
    branches: [tmp-hongfucheng-broker-reports-20261028]
    paths: ['.github/workflows/tmp-hongfucheng-51pdf-inspect-20261028.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect listing and detail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,requests
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          listings=['https://www.51pdf.cn/report_44_p3/','https://www.51pdf.cn/report_xg_p2/']
          targets=[]
          a_re=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          for url in listings:
            r=s.get(url,timeout=(25,180),allow_redirects=True)
            print('LIST',url,r.status_code,r.url,len(r.content),r.headers.get('content-type'))
            text=r.content.decode(r.encoding or 'utf-8',errors='replace')
            if text.count('\ufffd')>100: text=r.content.decode('gb18030',errors='replace')
            for m in a_re.finditer(text):
              label=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
              label=re.sub(r'\s+',' ',label).strip()
              href=urljoin(r.url,html.unescape(m.group(1)))
              if '鸿富诚' in label:
                print('TARGET',repr(label),href); targets.append(href)
          for url in dict.fromkeys(targets):
            r=s.get(url,timeout=(25,180),allow_redirects=True)
            print('\nDETAIL',url,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
            text=r.content.decode(r.encoding or 'utf-8',errors='replace')
            if text.count('\ufffd')>100: text=r.content.decode('gb18030',errors='replace')
            for m in a_re.finditer(text):
              label=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
              label=re.sub(r'\s+',' ',label).strip()
              href=urljoin(r.url,html.unescape(m.group(1)))
              if any(k in (label+' '+href).lower() for k in ('下载','download','.pdf','attachment','file')):
                print('LINK',repr(label),href)
            for pattern in [r'''https?://[^\s"'<>]+''',r'''(?:file|url|download|attach)["'\s:=]+(["']?)([^"'\s<>]+)\1''']:
              for m in re.finditer(pattern,text,re.I):
                token=m.group(0) if m.lastindex is None else m.group(m.lastindex)
                if any(k in token.lower() for k in ('.pdf','download','attach','file')):
                  print('TOKEN',html.unescape(token)[:1000])
            print('TEXTFRAG',re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',text))[:2500])
          PY
