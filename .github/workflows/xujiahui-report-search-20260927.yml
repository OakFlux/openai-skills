name: Xujiahui report search 20260927
on:
  push:
    paths:
      - '.github/workflows/xujiahui-report-search-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Eastmoney
        run: |
          mkdir -p out
          python - <<'PY'
          import requests
          from pathlib import Path
          s=requests.Session()
          s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2030-01-01','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'002561','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
          Path('out/eastmoney.json').write_text(r.text,encoding='utf-8')
          print(r.status_code)
          print(r.url)
          print(r.text[:50000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xujiahui-eastmoney-search
          path: out
          retention-days: 7
