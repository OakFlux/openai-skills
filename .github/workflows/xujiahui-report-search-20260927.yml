name: Xujiahui report search 20260927
on:
  push:
    paths:
      - '.github/workflows/xujiahui-report-search-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Sina
        run: |
          mkdir -p out
          python - <<'PY'
          import requests
          from pathlib import Path
          s=requests.Session()
          s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})
          u='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz002561&t1=all'
          r=s.get(u,timeout=60)
          Path('out/page.html').write_bytes(r.content)
          print(r.status_code)
          print(r.url)
          print(len(r.content))
          print(r.text[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xujiahui-sina-search
          path: out
          retention-days: 7
