name: Xujiahui report search 20260927
on:
  push:
    paths:
      - '.github/workflows/xujiahui-report-search-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Search
        run: |
          mkdir -p out
          python - <<'PY'
          import json, requests, time
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          queries=['徐家汇 深度','徐家汇 公司深度','徐家汇 首次覆盖','002561 深度报告','002561 首次覆盖','上海徐家汇商城 深度']
          out={}
          for q in queries:
              payload={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=60)
                  out[q]={'status':r.status_code,'body':r.json() if r.status_code==200 else r.text[:1000]}
              except Exception as e:
                  out[q]={'error':repr(e)}
              time.sleep(.2)
          Path('out/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          for q,v in out.items():
              print('\nQUERY',q)
              body=v.get('body') if isinstance(v,dict) else None
              if not isinstance(body,dict):
                  print(body); continue
              files=((body.get('data') or {}).get('files') or [])
              for x in files[:100]:
                  print(x.get('id'),x.get('time_text'),x.get('page_count'),(x.get('type') or {}).get('name'),x.get('name'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xujiahui-report-search-v2
          path: out
          retention-days: 7
