name: Build Wasion Holdings 03393 reports package 20260926

on:
  push:
    paths:
      - '.github/workflows/wasion-holdings-03393-reports-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official reports, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '威胜控股_03393_2020-2025年报及2026年中期报告_港交所官方原件'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          def variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          docs = [
              {
                  'filename': '01_威胜控股_03393_2020年年度报告_中文版.pdf',
                  'title': '威胜控股2020年年度报告（中文版）',
                  'period': '2020年年度报告',
                  'date': '2021-04-28',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0428/2021042800084_c.pdf'),
                  'min_bytes': 500_000,
                  'min_pages': 150,
              },
              {
                  'filename': '02_威胜控股_03393_2021年年度报告_中文版.pdf',
                  'title': '威胜控股2021年年度报告（中文版）',
                  'period': '2021年年度报告',
                  'date': '2022-04-28',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2022/0428/2022042801764_c.pdf'),
                  'min_bytes': 500_000,
                  'min_pages': 150,
              },
              {
                  'filename': '03_威胜控股_03393_2022年年度报告_中文版.pdf',
                  'title': '威胜控股2022年年度报告（中文版）',
                  'period': '2022年年度报告',
                  'date': '2023-04-20',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2023/0420/2023042001010_c.pdf'),
                  'min_bytes': 500_000,
                  'min_pages': 150,
              },
              {
                  'filename': '04_威胜控股_03393_2023年年度报告_中文版.pdf',
                  'title': '威胜控股2023年年度报告（中文版）',
                  'period': '2023年年度报告',
                  'date': '2024-04-11',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0411/2024041100259_c.pdf'),
                  'min_bytes': 500_000,
                  'min_pages': 150,
              },
              {
                  'filename': '05_威胜控股_03393_2024年年度报告_中文版.pdf',
                  'title': '威胜控股2024年年度报告（中文版）',
                  'period': '2024年年度报告',
                  'date': '2025-04-23',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0423/2025042300882_c.pdf'),
                  'min_bytes': 500_000,
                  'min_pages': 150,
              },
              {
                  'filename': '06_威胜控股_03393_2025年年度报告_中文版.pdf',
                  'title': '威胜控股2025年年度报告（中文版）',
                  'period': '2025年年度报告',
                  'date': '2026-04-22',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0422/2026042201404_c.pdf'),
                  'min_bytes': 500_000,
                  'min_pages': 150,
              },
              {
                  'filename': '07_威胜控股_03393_2026年中期报告_中文版_最新定期报告.pdf',
                  'title': '威胜控股2026年中期报告（中文版，最新定期报告）',
                  'period': '2026年中期报告',
                  'date': '2026-09-18',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0918/2026091800306_c.pdf'),
                  'min_bytes': 200_000,
                  'min_pages': 50,
              },
          ]

          records: list[dict] = []
          seen_hashes: set[str] = set()
          identity_terms = ('3393', 'wason holdings', 'wasion holdings', '威勝控股', '威胜控股')

          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(35, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              sample_lower = sample_text.lower().replace(' ', '')
              identity_ok = any(term.lower().replace(' ', '') in sample_lower for term in identity_terms)
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified in {dest.name}; sample={sample_text[:1000]!r}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'report_period': doc['period'],
                  'disclosure_date': doc['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '威胜控股有限公司（03393.HK）2020—2025年年度报告及最新定期报告',
              '整理日期：2026-09-26',
              '',
              '收录内容：2020、2021、2022、2023、2024、2025年度报告，以及截至整理日最新的2026年中期报告；均为香港交易所披露易发布的中文完整PDF原件。',
              '说明：威胜控股为香港联交所主板上市公司，主板规则不要求发行人按季度披露集团层面的季度报告。因此，本包以截至整理日最新的2026年中期报告作为“最新季报/最新定期报告”，未使用业绩公告或子公司季度数据替代。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司身份、实际页数、qpdf结构检查、SHA-256去重及ZIP CRC检查。')
          (out / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          csv_path = out / '来源清单.csv'
          with csv_path.open('w', encoding='utf-8-sig', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=['filename', 'report_period', 'disclosure_date', 'source_url', 'pages', 'bytes', 'sha256'])
              writer.writeheader()
              for rec in records:
                  writer.writerow({k: rec[k] for k in writer.fieldnames})

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 7:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: wasion-holdings-03393-reports-final
          path: 威胜控股_03393_2020-2025年报及2026年中期报告_港交所官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
