name: Fetch AviChina periodical reports HTML
on:
  push:
    branches: [tmp-avichina-html-20260908]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --max-time 60 -A 'Mozilla/5.0' 'https://www.avichina.com/sycd/ggygz/dqbg/' -o output/page.html
          grep -Ein 'page|年度报告|年度報告|2021|2020|ajax|api|list' output/page.html | tail -n 500 > output/grep.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: avichina-html
          path: output/*
          retention-days: 1
