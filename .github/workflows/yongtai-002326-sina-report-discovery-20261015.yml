name: Discover Yongtai 002326 reports from Sina 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-sina-report-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch Sina report listing pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz002326&t1=all',
            'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=sz002326&t1=all',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=002326&t1=all',
            'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=002326&t1=all',
            'http://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz002326&t1=all'
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Referer':'https://stock.finance.sina.com.cn/'})
          results=[]
          for url in urls:
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              print('URL',url,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'CTYPE',r.headers.get('content-type'))
              raw=r.content
              text=None
              for enc in [r.encoding,'utf-8','gb18030','gbk']:
                if not enc: continue
                try:
                  text=raw.decode(enc,errors='replace')
                  if '永太科技' in text or 'vReport_Show' in text or '<html' in text.lower():
                    break
                except Exception: pass
              if text is None: text=raw.decode('utf-8',errors='replace')
              Path('page_'+str(len(results))+'.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'lxml')
              links=[]
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a['href'])
                title=' '.join(a.get_text(' ',strip=True).split())
                if 'vReport_Show' in href or 'rptid' in href or ('永太科技' in title and len(title)>4):
                  links.append({'title':title,'href':href})
              results.append({'input_url':url,'status':r.status_code,'final_url':r.url,'bytes':len(raw),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'links':links[:300],'text_head':text[:1000]})
              print('FOUND LINKS',len(links))
              for x in links[:100]: print(json.dumps(x,ensure_ascii=False))
            except Exception as e:
              print('ERROR',url,repr(e))
              results.append({'input_url':url,'error':repr(e)})
          Path('yongtai_sina_discovery.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-sina-report-discovery
          path: |
            yongtai_sina_discovery.json
            page_*.html
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
