name: Probe China Cinda Guosen report

on:
  push:
    branches:
      - chatgpt-china-cinda-broker-reports-20260906
    paths:
      - '.github/workflows/probe-china-cinda-guosen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_china_cinda_guosen_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: china-cinda-guosen-probe
          path: china-cinda-guosen-probe.json
          if-no-files-found: error
          retention-days: 1
