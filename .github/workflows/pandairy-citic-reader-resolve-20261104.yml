name: Resolve CITIC Pandairy reader assets
on:
  push:
    paths: ['.github/workflows/pandairy-citic-reader-resolve-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import html,json,re
          from urllib.parse import urljoin,quote
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':'https://www.sgpjbg.com/baogao/28394.html','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://www.sgpjbg.com/sgpjbg/View.aspx?id=28394',
            'https://www.sgpjbg.com/BookRead.aspx?bhtype=2&url='+quote('http://www.sgpjbg.com/sgpjbg/View.aspx?id=28394',safe=''),
            'https://www.sgpjbg.com/BookRead.aspx?bhtype=2&url=http%3a%2f%2fwww.sgpjbg.com%2fsgpjbg%2fView.aspx%3fid%3d28394',
          ]
          for u in urls:
            r=s.get(u,timeout=90,allow_redirects=True)
            print('FETCH',u,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
            text=r.text
            for line in text.splitlines():
              if any(k.lower() in line.lower() for k in ('fileroot','file.sgpjbg','pageurl','bookurl','swf','json','28394','bookread','view.aspx','getpage','pdf')):
                print('LINE',line[:3000],flush=True)
            urls2=[]
            for pat in [r'https?://[^\"\'<> ]+',r'/[^\"\'<> ]+']:
              for m in re.findall(pat,html.unescape(text),re.I):
                if any(k in m.lower() for k in ('fileroot','file.sgpjbg','view.aspx','bookread','getpage','pdf','flexpaper')):
                  urls2.append(urljoin(r.url,m.rstrip(');,')))
            print('CANDIDATES',json.dumps(list(dict.fromkeys(urls2))[:200],ensure_ascii=False),flush=True)
          PY
