name: Inspect DBS report page
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public DBS pages
        run: |
          mkdir -p out
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.dbs.com.hk/private-banking/aics/templatedata/article/recentdevelopment/data/en/DBSV/092024/1378_HK_09262024.xml' -o out/report_2024.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.dbs.com.hk/private-banking/aics/templatedata/article/equity/data/en/DBSV/012014/1378_HK.xml' -o out/equity_page.html
          grep -Eoi 'https?[^" ]+pdf[^" ]*|href="[^"]+"' out/report_2024.html | head -200 || true
          grep -Eoi 'https?[^" ]+pdf[^" ]*|href="[^"]+"' out/equity_page.html | head -200 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dbs-hongqiao-pages
          path: out
          retention-days: 1
          compression-level: 0
