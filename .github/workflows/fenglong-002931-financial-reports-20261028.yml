name: Package Fenglong 002931 financial reports

on:
  push:
    paths:
      - '.github/workflows/fenglong-002931-financial-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF validation dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Discover, download, verify, and package official PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import re
          import shutil
          import time
          import zipfile
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from typing import Any

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE = '002931'
          COMPANY = '锋龙股份'
          FULL_COMPANY = '浙江锋龙电气股份有限公司'
          CUTOFF = '2026-10-28'
          CUTOFF_COMPACT = '20261028'
          BASE_STATIC = 'https://static.cninfo.com.cn/'
          API = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
          ROOT_NAME = f'{COMPANY}_{CODE}_2020-2025年报及最新季报_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          DIST = Path('dist')
          ANNUAL_DIR = ROOT / '01_年度报告'
          QUARTER_DIR = ROOT / '02_最新季度报告'
          PREVIEW_DIR = ROOT / '首页预览'
          for directory in (ANNUAL_DIR, QUARTER_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          def make_session() -> requests.Session:
              session = requests.Session()
              retry = Retry(
                  total=6,
                  connect=6,
                  read=6,
                  status=6,
                  backoff_factor=1.0,
                  status_forcelist=(403, 408, 429, 500, 502, 503, 504),
                  allowed_methods=frozenset({'GET', 'POST'}),
                  raise_on_status=False,
              )
              session.mount('https://', HTTPAdapter(max_retries=retry))
              session.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
                  'Accept': 'application/json, text/plain, */*',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
                  'Connection': 'keep-alive',
                  'X-Requested-With': 'XMLHttpRequest',
                  'Referer': f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={CODE}',
              })
              return session

          S = make_session()

          def clean_title(value: str) -> str:
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', '', value)
              value = value.replace('\u3000', ' ').replace(' ', ' ')
              return re.sub(r'\s+', '', value).strip()

          def get_json(url: str) -> Any:
              response = S.get(url, timeout=60)
              print('GET', response.status_code, len(response.content), response.url)
              response.raise_for_status()
              return response.json()

          def iter_dicts(value: Any):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from iter_dicts(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from iter_dicts(child)

          def resolve_org_id() -> str:
              urls = [
                  'https://www.cninfo.com.cn/new/data/szse_stock.json',
                  f'https://www.cninfo.com.cn/new/information/topSearch/query?keyWord={CODE}&maxNum=20',
                  f'https://www.cninfo.com.cn/new/information/topSearch/query?keyWord={COMPANY}&maxNum=20',
              ]
              for url in urls:
                  try:
                      data = get_json(url)
                      for item in iter_dicts(data):
                          code = str(item.get('code') or item.get('stockCode') or item.get('secCode') or '')
                          name = str(item.get('zwjc') or item.get('name') or item.get('secName') or '')
                          org = str(item.get('orgId') or item.get('orgid') or item.get('org_id') or '')
                          if (code == CODE or COMPANY in name or FULL_COMPANY in name) and org:
                              print('RESOLVED_ORG_ID', org, json.dumps(item, ensure_ascii=False))
                              return org
                  except Exception as exc:
                      print('ORG_LOOKUP_ERROR', url, repr(exc))
              raise RuntimeError('Unable to resolve CNINFO orgId for 002931')

          ORG_ID = resolve_org_id()

          def query_announcements() -> list[dict[str, Any]]:
              all_rows: list[dict[str, Any]] = []
              page = 1
              total = None
              while page <= 30:
                  payload = {
                      'pageNum': str(page),
                      'pageSize': '100',
                      'column': 'szse',
                      'tabName': 'fulltext',
                      'plate': 'sz',
                      'stock': f'{CODE},{ORG_ID}',
                      'searchkey': '',
                      'secid': '',
                      'category': '',
                      'trade': '',
                      'seDate': f'2021-01-01~{CUTOFF}',
                      'sortName': 'time',
                      'sortType': 'desc',
                      'isHLtitle': 'true',
                  }
                  response = S.post(API, data=payload, timeout=90)
                  print('POST', page, response.status_code, len(response.content), response.url)
                  response.raise_for_status()
                  data = response.json()
                  rows = data.get('announcements') or []
                  if total is None:
                      total = int(data.get('totalAnnouncement') or data.get('totalRecordNum') or 0)
                      print('TOTAL_ANNOUNCEMENTS', total)
                  if not rows:
                      break
                  all_rows.extend(rows)
                  print('PAGE_ROWS', page, len(rows), 'ACCUMULATED', len(all_rows))
                  if total and len(all_rows) >= total:
                      break
                  page += 1
                  time.sleep(0.25)
              return all_rows

          raw_rows = query_announcements()
          if not raw_rows:
              raise RuntimeError('CNINFO returned no announcements for Fenglong')

          normalized: list[dict[str, Any]] = []
          seen = set()
          for row in raw_rows:
              path = str(row.get('adjunctUrl') or '').lstrip('/')
              title = clean_title(str(row.get('announcementTitle') or ''))
              if not path or not title:
                  continue
              key = (title, path)
              if key in seen:
                  continue
              seen.add(key)
              timestamp = int(row.get('announcementTime') or 0)
              date = datetime.fromtimestamp(timestamp / 1000, tz=timezone(timedelta(hours=8))).strftime('%Y-%m-%d') if timestamp else ''
              normalized.append({
                  'title': title,
                  'url_path': path,
                  'source_url': BASE_STATIC + path,
                  'announcement_time': timestamp,
                  'announcement_date': date,
                  'announcement_id': row.get('announcementId'),
                  'sec_code': row.get('secCode') or CODE,
                  'sec_name': row.get('secName') or COMPANY,
              })

          print('NORMALIZED_COUNT', len(normalized))
          for item in normalized:
              if any(keyword in item['title'] for keyword in ('年度报告', '季度报告')):
                  print('CANDIDATE', item['announcement_date'], item['title'], item['url_path'])

          annual_by_year: dict[int, list[dict[str, Any]]] = {}
          for item in normalized:
              match = re.search(r'(20\d{2})年年度报告', item['title'])
              if not match:
                  continue
              title = item['title']
              if any(keyword in title for keyword in (
                  '摘要', '更正公告', '提示性公告', '取消', '审计报告', '审核报告',
                  '独立意见', '董事会', '监事会', '问询函', '回复', '说明会', '业绩说明会'
              )):
                  continue
              year = int(match.group(1))
              if year in range(2020, 2026):
                  annual_by_year.setdefault(year, []).append(item)

          def annual_rank(item: dict[str, Any]) -> tuple[int, int, int, int]:
              title = item['title']
              revision = 3 if any(keyword in title for keyword in ('修订稿', '修订版', '更新后', '更正后', '补充后')) else 1
              exact = 3 if re.fullmatch(r'20\d{2}年年度报告(?:（[^）]+）|\([^)]*\))?', title) else 1
              full_text = 2 if title.endswith('年度报告') or '年度报告（' in title or '年度报告(' in title else 1
              return revision, exact, full_text, int(item['announcement_time'])

          annual_selected: list[dict[str, Any]] = []
          for year in range(2020, 2026):
              candidates = annual_by_year.get(year) or []
              if not candidates:
                  raise RuntimeError(f'Missing official full annual report for {year}')
              chosen = dict(max(candidates, key=annual_rank))
              chosen['doc_type'] = 'annual_report'
              chosen['report_year'] = year
              annual_selected.append(chosen)

          quarter_candidates: list[dict[str, Any]] = []
          for item in normalized:
              title = item['title']
              match = re.search(r'(20\d{2})年(第一|第三|一|三)季度报告', title)
              if not match:
                  continue
              if any(keyword in title for keyword in ('摘要', '更正公告', '提示性公告', '问询', '说明')):
                  continue
              quarter = 3 if match.group(2) in ('第三', '三') else 1
              candidate = dict(item)
              candidate.update(doc_type='quarterly_report', report_year=int(match.group(1)), quarter=quarter)
              quarter_candidates.append(candidate)

          if not quarter_candidates:
              raise RuntimeError('No formal Q1/Q3 report found')
          latest_quarter = max(
              quarter_candidates,
              key=lambda item: (item['report_year'], item['quarter'], int(item['announcement_time']))
          )
          if latest_quarter['report_year'] != 2026 or latest_quarter['quarter'] != 3:
              raise RuntimeError(f"Unexpected latest quarter: {latest_quarter['report_year']}Q{latest_quarter['quarter']}")

          selected = [*annual_selected, latest_quarter]
          print('SELECTED_DOCUMENTS')
          for item in selected:
              print(json.dumps({key: item.get(key) for key in (
                  'doc_type', 'report_year', 'quarter', 'announcement_date', 'title', 'source_url'
              )}, ensure_ascii=False))

          def safe_filename(name: str) -> str:
              name = re.sub(r'[\\/:*?"<>|]', '_', name)
              return re.sub(r'_+', '_', name).strip('_. ')

          def download_pdf(item: dict[str, Any], destination: Path) -> None:
              response = S.get(
                  item['source_url'],
                  headers={
                      'Referer': 'https://www.cninfo.com.cn/',
                      'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  },
                  timeout=180,
              )
              print('DOWNLOAD', response.status_code, len(response.content), item['source_url'])
              response.raise_for_status()
              if len(response.content) < 50_000 or not response.content.startswith(b'%PDF'):
                  raise RuntimeError(
                      f"Downloaded content is not a complete PDF: {item['source_url']} size={len(response.content)}"
                  )
              destination.write_bytes(response.content)

          records: list[dict[str, Any]] = []
          for item in selected:
              if item['doc_type'] == 'annual_report':
                  year = int(item['report_year'])
                  revision_suffix = ''
                  if any(keyword in item['title'] for keyword in ('修订稿', '修订版', '更新后', '更正后', '补充后')):
                      revision_suffix = '_修订或更新版'
                  filename = f'{year}_{COMPANY}_{year}年年度报告{revision_suffix}.pdf'
                  destination = ANNUAL_DIR / safe_filename(filename)
                  period = str(year)
              else:
                  year = int(item['report_year'])
                  quarter = int(item['quarter'])
                  quarter_cn = '第一季度' if quarter == 1 else '第三季度'
                  filename = f'{year}Q{quarter}_{COMPANY}_{year}年{quarter_cn}报告.pdf'
                  destination = QUARTER_DIR / safe_filename(filename)
                  period = f'{year}Q{quarter}'

              download_pdf(item, destination)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception as exc:
                      raise RuntimeError(f'Encrypted PDF cannot be opened: {destination}: {exc}')
              page_count = len(reader.pages)
              if page_count < 2:
                  raise RuntimeError(f'Abnormal page count: {destination} -> {page_count}')

              doc = fitz.open(destination)
              if doc.page_count != page_count:
                  raise RuntimeError(
                      f'PDF parser page count mismatch: {destination}: pypdf={page_count}, fitz={doc.page_count}'
                  )
              first_pix = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_pix = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first_pix.width, first_pix.height, last_pix.width, last_pix.height) < 100:
                  raise RuntimeError(f'PDF render validation failed: {destination}')
              preview_path = PREVIEW_DIR / f'{destination.stem}.png'
              first_pix.save(preview_path)

              text_probe = ''
              for page_index in range(min(6, doc.page_count)):
                  try:
                      text_probe += doc.load_page(page_index).get_text('text')
                  except Exception:
                      pass
              doc.close()
              if COMPANY not in text_probe and FULL_COMPANY not in text_probe and CODE not in text_probe:
                  raise RuntimeError(f'Company identity was not found in the first pages: {destination}')

              digest = hashlib.sha256(destination.read_bytes()).hexdigest()
              record = {
                  'document_type': item['doc_type'],
                  'period': period,
                  'announcement_title': item['title'],
                  'announcement_date': item['announcement_date'],
                  'source_url': item['source_url'],
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': digest,
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          annual_years = sorted(int(record['period']) for record in records if record['document_type'] == 'annual_report')
          if annual_years != [2020, 2021, 2022, 2023, 2024, 2025]:
              raise RuntimeError(f'Annual report coverage mismatch: {annual_years}')

          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'market': '深圳证券交易所',
              'cutoff_date': CUTOFF,
              'annual_report_years': annual_years,
              'latest_quarter': f"{latest_quarter['report_year']}Q{latest_quarter['quarter']}",
              'document_count': len(records),
              'selection_policy': {
                  'annual_reports': '收录2020—2025年正式年度报告全文；排除摘要、提示公告、审计报告单行文件及重复项；同年度优先采用后续修订或更新全文。',
                  'latest_quarterly_report': '在正式第一季度报告和第三季度报告中，按报告期选择截至截止日最新一期。',
              },
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme_lines = [
              f'# {COMPANY}（{CODE}）2020—2025年报及最新季报',
              '',
              f'- 截止日期：{CUTOFF}',
              '- 来源：巨潮资讯网官方原始PDF。',
              '- 收录：2020—2025年完整年度报告，以及截至截止日最新正式季度报告。',
              '- 排除：年度报告摘要、提示性公告、单独审计文件及重复文件。',
              '- 校验：PDF文件头、双解析器页数、公司身份、首末页渲染、SHA-256和ZIP CRC。',
              '',
              '## 文件清单',
              '',
          ]
          for index, record in enumerate(records, 1):
              readme_lines.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 披露标题：{record['announcement_title']}",
                  f"   - 披露日期：{record['announcement_date']}",
                  f"   - 页数：{record['page_count']}；文件大小：{record['file_size_bytes']:,}字节",
                  f"   - 官方来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme_lines) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'fenglong_002931_2020_2025_annual_latest_quarter_{CUTOFF_COMPACT}.zip'
          for path in (chinese_zip, english_zip):
              if path.exists():
                  path.unlink()

          with zipfile.ZipFile(chinese_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive_name = str(path.relative_to(ROOT.parent)).replace(os.sep, '/')
                      archive.write(path, archive_name)
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad = archive.testzip()
                  if bad is not None:
                      raise RuntimeError(f'ZIP CRC failure: {path}: {bad}')
                  pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdfs) != 7:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {path}: {len(pdfs)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest())

          print('FINAL_JSON', json.dumps({
              'annual_years': annual_years,
              'latest_quarter': manifest['latest_quarter'],
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': hashlib.sha256(chinese_zip.read_bytes()).hexdigest(),
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenglong-002931-financial-reports-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
