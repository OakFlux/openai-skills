name: Simple probe Sinopharm report assets

on:
  push:
    branches:
      - tmp-sinopharm-hangyan-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public pages
        run: |
          python -m pip install --quiet requests
          cat > /tmp/report_asset_probe.py <<'PY'
          import re
          from urllib.parse import urljoin
          import requests

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          pages = [
              'https://www.hangyan.co/reports/3097844454174754770',
              'https://www.sdyanbao.com/detail/938808'
          ]
          for page in pages:
              print('\nPAGE', page)
              response = session.get(page, timeout=(20, 80))
              print('STATUS', response.status_code, 'LEN', len(response.content), 'FINAL', response.url)
              text = response.text
              urls = re.findall(r'(?:href|src)=[\"\']([^\"\']+)', text, re.I)
              absolute = [urljoin(response.url, item) for item in urls]
              for item in dict.fromkeys(absolute):
                  lower = item.lower()
                  if any(word in lower for word in ('pdf','download','report','api','oss','file','_next','_nuxt')):
                      print('ASSET', item)
              for key in ('pdf','download','file_url','fileurl','reporturl','original_id','data_source_uuid','preview','3097844454174754770','938808'):
                  lower = text.lower()
                  start = 0
                  shown = 0
                  while shown < 10:
                      index = lower.find(key.lower(), start)
                      if index < 0:
                          break
                      snippet = text[max(0,index-300):min(len(text),index+900)].replace('\n',' ')
                      print('CONTEXT', key, snippet[:1200])
                      start = index + len(key)
                      shown += 1
              scripts = [item for item in absolute if item.endswith('.js') or '.js?' in item]
              for script_url in scripts[:30]:
                  try:
                      script = session.get(script_url, timeout=(15, 60)).text
                  except Exception as exc:
                      print('SCRIPT_ERROR', script_url, repr(exc))
                      continue
                  if any(word in script.lower() for word in ('download','file_url','reporturl','original_id','data_source_uuid')):
                      print('SCRIPT', script_url, 'LEN', len(script))
                      for key in ('download','file_url','reporturl','original_id','data_source_uuid'):
                          index = script.lower().find(key)
                          if index >= 0:
                              print('SCRIPT_CONTEXT', key, script[max(0,index-500):index+1500])
          PY
          python /tmp/report_asset_probe.py
