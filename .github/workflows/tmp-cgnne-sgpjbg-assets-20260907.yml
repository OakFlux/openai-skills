name: Inspect SGPJBG CGN New Energy assets
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect viewer script and public assets
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.sgpjbg.com/baogao/70108.html','Accept-Language':'zh-CN,zh;q=0.9'})
          page=s.get('https://www.sgpjbg.com/baogao/70108.html',timeout=90)
          print('PAGE',page.status_code,len(page.content))
          soup=BeautifulSoup(page.text,'html.parser')
          for tag in soup.find_all(['img','input','a','iframe'],src=True):
            print('SRC',tag.name,tag.get('id'),tag.get('class'),tag.get('src'))
          for tag in soup.find_all(['input','a'],value=True):
            v=tag.get('value')
            if v and ('file.sgpjbg.com' in v or 'fileroot' in v): print('VALUE',tag.name,tag.get('id'),v)
          for pat in [r'https?://file\.sgpjbg\.com/[^"\'<>\s]+',r'https?://[^"\'<>\s]+fileroot[^"\'<>\s]+']:
            vals=list(dict.fromkeys(re.findall(pat,page.text,re.I))); print('PAGE_PAT',pat,len(vals)); print('\n'.join(vals[:100]))
          jsurl='https://cache.sgpjbg.com/master/view/view2.js'
          js=s.get(jsurl,timeout=90)
          print('JS',js.status_code,len(js.content),jsurl)
          text=js.text
          for term in ['_Addpage','getElementById("dp")','fileroot','pageurl','jpg','png','webp','GetPage','LoadPage','mhi','nodecode']:
            pos=text.lower().find(term.lower()); print('\nTERM',term,'POS',pos)
            if pos>=0: print(text[max(0,pos-1500):pos+5000])
          base='https://file.sgpjbg.com/fileroot_temp1/2022-4/28/4458eb71-fd8f-41a7-80b7-0a6b0cb96bed/4458eb71-fd8f-41a7-80b7-0a6b0cb96bed'
          suffixes=['','.pdf','.PDF','_1.jpg','_1.png','_1.webp','-1.jpg','-1.png','/1.jpg','/1.png','/1.webp','/1','_1','1.jpg','1.png','/0001.jpg','_0001.jpg']
          for suffix in suffixes:
            u=base+suffix
            try:
              r=s.get(u,timeout=45,allow_redirects=False)
              print('TEST',suffix or '<empty>',r.status_code,r.headers.get('content-type'),len(r.content),r.headers.get('location'),repr(r.content[:20]))
            except Exception as e: print('TEST_ERR',suffix,repr(e))
          PY
