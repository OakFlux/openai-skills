name: Inspect HJTime Fxbaogao view pages 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-fxbaogao-view-inspect-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect view pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          scripts=set()
          for did in ('5271496','5261391'):
            url=f'https://www.fxbaogao.com/view?id={did}'
            try:
              r=s.get(url,timeout=(15,60),allow_redirects=True)
              print('PAGE',did,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              text=r.text; soup=BeautifulSoup(text,'lxml')
              imgs=[]
              for img in soup.find_all('img'):
                for attr in ('src','data-src','data-original'):
                  v=img.get(attr)
                  if v: imgs.append(urllib.parse.urljoin(r.url,v))
              for sc in soup.find_all('script',src=True): scripts.add(urllib.parse.urljoin(r.url,sc['src']))
              print('IMAGES',did,json.dumps(imgs[:500],ensure_ascii=False),flush=True)
              urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',text)))
              interesting=[u.replace('\\/','/') for u in urls if any(k in u.lower() for k in ('report-image','pdf','download','file','readreport','preview','report/2026'))]
              print('URLS',did,json.dumps(interesting[:500],ensure_ascii=False),flush=True)
              for pat in ('report-image','pdfPath','getReportPreviewImages','readReport','preDown','download','5261391','5271496','pageNum','auth_key'):
                snips=[]
                for m in list(re.finditer(pat,text,re.I))[:100]: snips.append(text[max(0,m.start()-400):min(len(text),m.end()+900)])
                if snips: print('SNIPS',did,pat,json.dumps(snips[:60],ensure_ascii=False),flush=True)
            except Exception as e: print('ERR',did,repr(e),flush=True)
          for i,url in enumerate(sorted(scripts),1):
            try:
              r=s.get(url,timeout=(15,60)); text=r.text
              print('SCRIPT',i,r.status_code,len(r.content),url,flush=True)
              hits=[]
              for pat in ('report-image','getReportPreviewImages','readReport','preDown','downloadReport','pdfPath','fileUrl','auth_key'):
                for m in list(re.finditer(pat,text,re.I))[:100]: hits.append(text[max(0,m.start()-300):min(len(text),m.end()+700)])
              if hits: print('SCRIPT_HITS',url,json.dumps(hits[:100],ensure_ascii=False),flush=True)
            except Exception as e: print('SCRIPT_ERR',url,repr(e),flush=True)
          PY
