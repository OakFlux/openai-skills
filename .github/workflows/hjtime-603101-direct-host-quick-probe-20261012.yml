name: Quick probe HJTime report hosts 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-direct-host-quick-probe-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe likely PDF hosts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, requests, json
          paths=['report/2026/02/12/5271496.pdf','report/2026/02/09/5261391.pdf']
          hosts=['https://dr.fxbaogao.com/','https://public.fxbaogao.com/','https://report.fxbaogao.com/','https://oss-buy.hufangde.com/','https://api.fxbaogao.com/']
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/','Origin':'https://www.fxbaogao.com','Accept':'application/pdf,*/*','Range':'bytes=0-4095'}
          def probe(url):
            try:
              r=requests.get(url,headers=headers,timeout=(5,12),allow_redirects=True)
              return {'url':url,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'prefix':r.content[:8].hex(),'final':r.url}
            except Exception as e: return {'url':url,'error':repr(e)}
          urls=[h+p for p in paths for h in hosts]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            for rec in ex.map(probe,urls): print(json.dumps(rec,ensure_ascii=False),flush=True)
          PY
