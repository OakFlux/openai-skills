name: scan-fengbei-603334-nxny

on:
  push:
    branches:
      - tmp/fengbei-603334-nxny-scan-20261106-v1

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Scan pages and inspect matches
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, urllib.parse, warnings
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          warnings.filterwarnings('ignore')

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          matches=[]
          for host in ['www.nxny.com','www3.nxny.com']:
            for page in range(20,61):
              u=f'https://{host}/stype_xg_p{page}/'
              try:
                r=s.get(u,timeout=(20,120),allow_redirects=True,verify=False)
                if r.status_code!=200: continue
                texts=[]
                for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030','gbk']:
                  if not enc: continue
                  try: texts.append(r.content.decode(enc,errors='ignore'))
                  except Exception: pass
                text=next((t for t in texts if '丰倍生物' in t), max(texts,key=len) if texts else '')
                if '丰倍生物' not in text: continue
                print('PAGE_MATCH',host,page,r.url,len(r.content))
                soup=BeautifulSoup(text,'html.parser')
                for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  title=' '.join(str(a.get('title') or '').split())
                  blob=label+' '+title
                  if '丰倍生物' in blob:
                    href=urllib.parse.urljoin(r.url,html.unescape(a['href']))
                    rec={'host':host,'page':page,'page_url':r.url,'label':label,'title':title,'href':href}
                    matches.append(rec); print('MATCH',json.dumps(rec,ensure_ascii=False))
              except Exception as e:
                print('PAGE_ERROR',host,page,repr(e))
          # inspect each unique detail page
          unique=[]
          seen=set()
          for m in matches:
            if m['href'] not in seen:
              seen.add(m['href']); unique.append(m)
          details=[]
          for i,m in enumerate(unique,1):
            for verify in [True,False]:
              try:
                r=s.get(m['href'],timeout=(30,180),allow_redirects=True,verify=verify,headers={'Referer':m['page_url']})
                print('DETAIL',i,verify,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                if r.status_code!=200: continue
                (out/f'detail_{i}.bin').write_bytes(r.content)
                texts=[]
                for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030','gbk']:
                  if not enc: continue
                  try: texts.append(r.content.decode(enc,errors='ignore'))
                  except Exception: pass
                text=next((t for t in texts if '丰倍生物' in t), max(texts,key=len) if texts else '')
                (out/f'detail_{i}.html').write_text(text,encoding='utf-8')
                soup=BeautifulSoup(text,'html.parser')
                links=[]
                for tag in soup.find_all(True):
                  for attr in ['href','src','data','data-url','data-href','data-file','value','content','onclick']:
                    v=tag.get(attr)
                    if not v: continue
                    v=html.unescape(str(v))
                    for candidate in re.findall(r'https?://[^\"\'<>\s)]+|//[^\"\'<>\s)]+|/[A-Za-z0-9_./?=&%+-]+',v,flags=re.I):
                      absolute=urllib.parse.urljoin(r.url,candidate)
                      if any(k in absolute.lower() for k in ['.pdf','download','file','attach','report','603334']): links.append(absolute)
                for pat in [r'https?://[^\"\'<>\s]+',r'//[^\"\'<>\s]+',r'[A-Za-z0-9_./?=&%+-]+\.pdf(?:\?[^\"\'<>\s]*)?']:
                  for candidate in re.findall(pat,text,flags=re.I):
                    absolute=urllib.parse.urljoin(r.url,html.unescape(candidate))
                    if any(k in absolute.lower() for k in ['.pdf','download','file','attach','report','603334']): links.append(absolute)
                links=list(dict.fromkeys(links))
                snippets=[]
                for line in text.splitlines():
                  if any(k in line.lower() for k in ['丰倍生物','603334','pdf','download','下载','file','attach','报告编号']):
                    line=' '.join(line.split())
                    if line and len(line)<5000: snippets.append(line)
                rec={**m,'detail_final':r.url,'links':links,'snippets':list(dict.fromkeys(snippets))}
                details.append(rec)
                print('DETAIL_REC',json.dumps(rec,ensure_ascii=False)[:30000])
                break
              except Exception as e:
                print('DETAIL_ERROR',i,verify,repr(e))
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          if not matches: raise RuntimeError('No Fengbei report match found')
          PY

      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: fengbei-603334-nxny-scan
          path: out
          if-no-files-found: error
          retention-days: 7
