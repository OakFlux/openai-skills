name: Probe fxbaogao for Great Eagle Holdings reports
on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-fxapi-probe-20260922.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          set -euo pipefail
          mkdir output
          base='https://api.fxbaogao.com'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          curl -L --fail --retry 2 -A "$ua" 'https://www.fxbaogao.com/_next/static/chunks/pages/report-d2e1e30536ba17c5.js' -o output/report_page.js
          for key in '%E9%B9%B0%E5%90%9B%E9%9B%86%E5%9B%A2' '%E9%B7%B9%E5%90%9B%E9%9B%86%E5%9C%98' 'Great%20Eagle%20Holdings' '0041.HK' '00041'; do
            safe=$(echo "$key" | tr -cd 'A-Za-z0-9' | cut -c1-30)
            curl -L -sS -A "$ua" "$base/mofoun/report/searchReport/suggestTyping?word=$key&limit=30" -o "output/suggest_${safe}.json" || true
            curl -L -sS -A "$ua" "$base/mofoun/report/reportStock/search?key=$key&limit=30" -o "output/stock_${safe}.json" || true
          done
          grep -oE '/mofoun/[^" ]+|fetch(Post|Get)\([^)]{0,500}' output/report_page.js > output/endpoints.txt || true
          grep -nE 'searchReport|searchReportData|facet|keyword|pageSize|pageNum|current|limit|query|word' output/report_page.js > output/contexts.txt || true
          for f in output/*.json; do echo "===== $f ====="; cat "$f"; echo; done
          head -c 50000 output/contexts.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-fxapi-probe
          path: output
          retention-days: 7
          compression-level: 6
