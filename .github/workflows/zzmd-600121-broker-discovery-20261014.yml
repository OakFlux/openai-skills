name: Discover Zhengzhou Coal 600121 broker reports 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-600121-broker-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney report index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, json, time
          from pathlib import Path
          import requests

          code='600121'
          out=Path('zzmd_broker_discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/stock.jshtml?encodeUrl=600121',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          endpoint='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          raw_pages=[]
          for page in range(1,21):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2000-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'',
                  'qType':'0','orgCode':'','code':code,'rcode':'',
                  'p':str(page),'pageNum':str(page),'pageNumber':str(page),
              }
              last=None; data=None
              for attempt in range(6):
                  try:
                      r=s.get(endpoint,params=params,timeout=(20,90))
                      last={'status':r.status_code,'url':r.url,'text':r.text[:300]}
                      if r.status_code==200:
                          data=r.json(); break
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(1+attempt)
              if data is None:
                  raise RuntimeError(f'API failed page={page}: {last}')
              raw_pages.append(data)
              rows=(data.get('data') or data.get('Data') or [])
              if isinstance(rows,dict):
                  rows=rows.get('list') or rows.get('List') or rows.get('items') or []
              if not isinstance(rows,list):
                  rows=[]
              print('PAGE',page,'ROWS',len(rows),'KEYS',list(data.keys()))
              if not rows:
                  break
              all_rows.extend(rows)
              if len(rows)<100:
                  break
              time.sleep(.2)

          (out/'raw_pages.json').write_text(json.dumps(raw_pages,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'all_rows.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          fields=['publishDate','orgSName','orgName','title','infoCode','attachPages','attachSize','emRatingName','ratingName','researcher','author','stockName','stockCode','industryName','indvInduName','reportType']
          with (out/'reports.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader()
              for row in all_rows: w.writerow({k:row.get(k,'') for k in fields})
          lines=[]
          for i,row in enumerate(all_rows,1):
              lines.append(f"{i:03d}\t{str(row.get('publishDate',''))[:10]}\t{row.get('orgSName') or row.get('orgName')}\t{row.get('attachPages')}页\t{row.get('infoCode')}\t{row.get('title')}")
          (out/'reports.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('TOTAL',len(all_rows))
          print('\n'.join(lines[:100]))
          PY

      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-600121-broker-discovery-20261014
          path: zzmd_broker_discovery
          retention-days: 2
          if-no-files-found: error
