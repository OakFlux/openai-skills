name: Search web for Silu Vision broker reports 20261021

on:
  push:
    paths:
      - '.github/workflows/silu-300556-websearch-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Search public indexes
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,urllib.parse,requests
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          queries=[
            '"丝路视觉" "浙商证券"',
            '"丝路视觉" "首次覆盖"',
            '"丝路视觉" "视觉即话语"',
            '"丝路视觉" 研报 PDF',
            '"300556" 浙商证券 研报',
            '"300556" 首次覆盖',
            'site:fxbaogao.com 丝路视觉',
            'site:yanbaoke.com 丝路视觉',
            'site:fhyanbao.com 丝路视觉',
            'site:nxny.com/report 丝路视觉',
            'site:pdf.dfcfw.com 300556',
            '"围绕数字创意技术这一主线"',
          ]
          def decode_bing(url):
              try:
                  q=urllib.parse.parse_qs(urllib.parse.urlparse(url).query)
                  u=(q.get('u') or [''])[0]
                  if u.startswith('a1'):
                      raw=u[2:];raw+='='*((4-len(raw)%4)%4)
                      return base64.b64decode(raw).decode('utf-8','ignore')
              except Exception: pass
              return url
          for q in queries:
              print('\n===QUERY===',q)
              for engine,url in [
                ('BING','https://www.bing.com/search?q='+urllib.parse.quote(q)+'&count=50'),
                ('SOGOU','https://www.sogou.com/web?query='+urllib.parse.quote(q)+'&num=50'),
              ]:
                  try:
                      r=s.get(url,timeout=60)
                      print(engine,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url)
                      soup=BeautifulSoup(r.text,'lxml')
                      results=[]
                      if engine=='BING':
                          nodes=soup.select('li.b_algo')
                          for li in nodes:
                              a=li.select_one('h2 a')
                              if not a: continue
                              title=' '.join(a.get_text(' ',strip=True).split())
                              href=decode_bing(a.get('href',''))
                              sn=' '.join((li.select_one('.b_caption') or li).get_text(' ',strip=True).split())
                              results.append({'title':title,'url':href,'snippet':sn[:700]})
                      else:
                          for a in soup.select('h3 a, .vr-title a, a[href]'):
                              title=' '.join(a.get_text(' ',strip=True).split())
                              href=a.get('href','')
                              if title and ('丝路' in title or '300556' in title or '研报' in title or '报告' in title):
                                  results.append({'title':title,'url':href})
                      for x in results[:80]: print(engine,'RESULT',json.dumps(x,ensure_ascii=False))
                  except Exception as e: print(engine,'ERROR',repr(e))
          PY
