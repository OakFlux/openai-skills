name: Inspect Hegang report attachment metadata

on:
  push:
    branches: [tmp-hegang-000709-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hegang-fxbaogao-inspect-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect report detail pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,urllib.request
          urls=[
            'https://www.fxbaogao.com/detail/4301471',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/800316839728/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/830853874814/index.phtml',
          ]
          for url in urls:
            print('\n===== PAGE',url,'=====')
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            raw=urllib.request.urlopen(req,timeout=120).read()
            text=raw.decode('utf-8','ignore')
            print('BYTES',len(raw))
            text2=html.unescape(text)
            seen=set()
            patterns=[
              r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
              r'[^\s"\'<>]{0,250}(?:download|reportFile|pdfUrl|fileUrl|attachment)[^\s"\'<>]{0,500}',
            ]
            for pat in patterns:
              for m in re.finditer(pat,text2,re.I):
                s=m.group(0)
                if s not in seen:
                  seen.add(s); print('CAND',s[:1000])
            for i,line in enumerate(text2.splitlines(),1):
              low=line.lower()
              if any(k in low for k in ('pdf','download','attachment','reportfile','fileurl','pdfurl')):
                line=re.sub(r'\s+',' ',line).strip()
                if line and len(line)<5000: print('LINE',i,line[:2000])
          PY
