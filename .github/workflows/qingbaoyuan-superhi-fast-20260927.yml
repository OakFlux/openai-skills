name: Fast inspect Qingbaoyuan Super Hi page 20260927

on:
  push:
    paths:
      - '.github/workflows/qingbaoyuan-superhi-fast-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect HTML
        shell: bash
        run: |
          python - <<'PY'
          import re, html, requests, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36'})
          u='https://m.qingbaoyuan.vip/doc/45737/'
          r=s.get(u,timeout=(20,60)); print('STATUS',r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True); r.raise_for_status()
          r.encoding='utf-8'; t=r.text
          print('COOKIES',s.cookies.get_dict(),flush=True)
          for pat in [
            r'<form[^>]*>', r'<input[^>]*>', r'<button[^>]*>', r'<a[^>]*>',
            r'onclick=["\'][^"\']+["\']', r'action=["\'][^"\']+["\']',
            r'(?:href|src|data-url|data-file|data-id|data-doc|value)=["\']([^"\']+)["\']',
            r'https?://[^"\'<> ]+', r'/[^"\'<> ]*(?:download|order|pay|file|pdf)[^"\'<> ]*',
          ]:
            vals=re.findall(pat,t,re.I|re.S)
            print('\nPATTERN',pat,'COUNT',len(vals),flush=True)
            for v in vals[:500]:
              if isinstance(v,tuple): v='|'.join(v)
              if any(k in v.lower() for k in ['download','下载','45737','pay','order','file','pdf','doc']):
                print('MATCH',v[:1200].replace('\n',' '),flush=True)
          for kw in ['download','下载','doc_id','docid','file_url','fileurl','pay','order','45737']:
            print('\nKW',kw,flush=True)
            for m in list(re.finditer(kw,t,re.I))[:100]:
              print(t[max(0,m.start()-500):min(len(t),m.end()+800)].replace('\n',' ')[:1600],flush=True)
          PY
