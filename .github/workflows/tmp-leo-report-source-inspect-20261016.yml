name: Inspect Leo Group report source pages

on:
  push:
    branches: [tmp-leo-broker-reports-20261016]
    paths: ['.github/workflows/tmp-leo-report-source-inspect-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect public report pages
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          inspect() {
            name="$1"; url="$2"
            curl --http1.1 -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 -A "$UA" "$url" -D "$name.headers" -o "$name.raw" || true
            python3 - "$name" <<'PY'
          import html, pathlib, re, sys
          name=sys.argv[1]
          p=pathlib.Path(name+'.raw')
          print('\n===== '+name+' =====')
          if not p.exists():
              print('NO FILE'); raise SystemExit
          raw=p.read_bytes(); print('BYTES',len(raw),'PREFIX',raw[:80])
          for enc in ('utf-8','gb18030','gbk'):
              try: text=raw.decode(enc); break
              except UnicodeDecodeError: pass
          else: text=raw.decode('utf-8',errors='replace')
          text=html.unescape(text)
          seen=set()
          pats=[r'https?://[^\s"\'<>]+',r'//[^\s"\'<>]+',r'[^\s"\'<>]{0,200}\.pdf(?:\?[^\s"\'<>]*)?']
          for pat in pats:
              for m in re.finditer(pat,text,re.I):
                  s=m.group(0)
                  if s not in seen and any(k in s.lower() for k in ('pdf','download','file','report','attachment','558034491367','544800661231','25195983')):
                      seen.add(s); print(s[:1500])
          print('--- KEY LINES ---')
          for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in ('pdf','download','fileurl','reporturl','attachment','558034491367','544800661231','25195983')):
                  line=re.sub(r'\s+',' ',line).strip()
                  if line: print(line[:3000])
          PY
          }
          inspect sina_2017_follow 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/558034491367/index.phtml'
          inspect sina_2017_annual 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/544800661231/index.phtml'
          inspect futu_2023_first 'https://news.futunn.com/post/25195983/rio-co-ltd-002131-marketing-pump-industry-two-wheel-drive'
