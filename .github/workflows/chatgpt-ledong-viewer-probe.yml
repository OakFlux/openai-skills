name: Inspect Ledong Robotics report viewer v2

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect viewer pages, scripts, endpoints and page images
        shell: bash
        run: |
          cat > /tmp/viewer_probe.py <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('viewer_output'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
          })
          reports={
              '5593366':{'date':'2026/08/10','title':'国投证券香港_视觉感知龙头看好割草机器人第二成长曲线'},
              '5608254':{'date':'2026/08/16','title':'兴证国际_智能感知赛道头部玩家割草机器人第二增长曲线爆发'},
              '5637842':{'date':'2026/08/25','title':'交银国际_1H26智能割草机器人放量驱动增长'},
              '5646471':{'date':'2026/08/26','title':'国投证券香港_1H26业绩符合预期割草机放量出海提速'},
          }
          patterns=[
              r'https?://[^\"\'<>\\\s]+',
              r'[^\"\'<>\\\s]{0,220}(?:report-image|download|pdfUrl|pdf_url|fileUrl|file_url|reportId|report_id|pageCount|page_count|totalPage|total_page|viewer|/view|/api/|mofoun)[^\"\'<>\\\s]{0,600}',
          ]
          all_scripts={}
          for rid,meta in reports.items():
              url=f'https://www.fxbaogao.com/view?id={rid}'
              try:
                  r=s.get(url,timeout=60,allow_redirects=True)
                  print('\nVIEW',rid,r.status_code,r.url,r.headers.get('content-type'),len(r.content),'cookies',s.cookies.get_dict())
                  print(r.text[:1800])
                  (OUT/f'view_{rid}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'html.parser')
                  print('TITLE',rid,soup.title.get_text(' ',strip=True) if soup.title else '')
                  scripts=[]; inline_index=0
                  for tag in soup.find_all('script'):
                      if tag.get('src'):
                          scripts.append(urllib.parse.urljoin(r.url,tag.get('src')))
                      else:
                          txt=tag.get_text() or ''
                          if txt.strip():
                              (OUT/f'view_{rid}_inline_{inline_index:02d}.js').write_text(txt,encoding='utf-8')
                              inline_index+=1
                  links=[urllib.parse.urljoin(r.url,x.get('href')) for x in soup.find_all('link') if x.get('href')]
                  imgs=[urllib.parse.urljoin(r.url,x.get('src')) for x in soup.find_all('img') if x.get('src')]
                  print('SCRIPTS',rid,len(scripts)); [print('SCRIPT',rid,x) for x in scripts]
                  print('LINKS',rid,len(links)); [print('LINK',rid,x) for x in links]
                  print('IMGS',rid,len(imgs)); [print('IMG',rid,x) for x in imgs[:80]]
                  hits=[]
                  for p in patterns: hits.extend(re.findall(p,r.text,re.I))
                  hits=list(dict.fromkeys(hits))
                  (OUT/f'view_{rid}_hits.txt').write_text('\n'.join(hits),encoding='utf-8')
                  for h in hits:
                      if any(k in h.lower() for k in ('report-image','download','pdf','reportid','pagecount','totalpage','/api/','mofoun')):
                          print('HTML_HIT',rid,repr(h[:2200]))
                  for jsurl in scripts: all_scripts[jsurl]=None
              except Exception as e: print('VIEW_ERR',rid,repr(e))

          for idx,jsurl in enumerate(all_scripts):
              try:
                  r=s.get(jsurl,timeout=90); r.raise_for_status()
                  name=f'js_{idx:03d}_{urllib.parse.urlparse(jsurl).path.rsplit("/",1)[-1] or "script"}'
                  (OUT/name).write_bytes(r.content)
                  hits=[]
                  for p in patterns: hits.extend(re.findall(p,r.text,re.I))
                  hits=list(dict.fromkeys(hits))
                  (OUT/f'{name}.hits.txt').write_text('\n'.join(hits),encoding='utf-8')
                  print('\nFETCH_SCRIPT',idx,jsurl,len(r.content))
                  for h in hits:
                      if any(k in h.lower() for k in ('report-image','download','pdfurl','fileurl','reportid','pagecount','totalpage','/api/','mofoun','/view')):
                          print('JS_HIT',idx,repr(h[:3000]))
              except Exception as e: print('SCRIPT_ERR',idx,jsurl,repr(e))

          image_summary={}
          for rid,meta in reports.items():
              ok=[]; failures=[]; consecutive=0
              for page in range(1,101):
                  base=f'https://public.fxbaogao.com/report-image/{meta["date"]}/{rid}-{page}.png'
                  try:
                      r=s.get(base,headers={'Referer':f'https://www.fxbaogao.com/view?id={rid}','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'},timeout=45,allow_redirects=True)
                      valid=r.status_code==200 and len(r.content)>1000 and (str(r.headers.get('content-type') or '').startswith('image/') or r.content[:8]==b'\x89PNG\r\n\x1a\n')
                      print('IMAGE',rid,page,r.status_code,r.headers.get('content-type'),len(r.content),'valid',valid,r.url)
                      if valid:
                          ok.append({'page':page,'url':base,'bytes':len(r.content),'type':r.headers.get('content-type')})
                          consecutive=0
                          if page<=3: (OUT/f'image_{rid}_{page}.bin').write_bytes(r.content)
                      else:
                          failures.append({'page':page,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')})
                          consecutive+=1
                          if consecutive>=3 and page>3: break
                  except Exception as e:
                      print('IMAGE_ERR',rid,page,repr(e)); failures.append({'page':page,'error':repr(e)}); consecutive+=1
                      if consecutive>=3 and page>3: break
                  time.sleep(.08)
              image_summary[rid]={'ok':ok,'failures':failures}
              print('IMAGE_SUMMARY',rid,'ok_pages',[x['page'] for x in ok], 'count',len(ok))
          (OUT/'image_summary.json').write_text(json.dumps(image_summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/viewer_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_Robotics_Viewer_Inspection_v2
          path: viewer_output
          retention-days: 2
          if-no-files-found: error
