name: Hipine deep discovery

on:
  push:
    branches:
      - tmp-hipine-deep-discovery-20260914

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Discover historical filing endpoints
        shell: bash
        run: |
          cat > /tmp/deep.py <<'PY'
          from __future__ import annotations
          import json, re, sys, time
          from urllib.parse import urljoin, urlencode
          import requests
          from bs4 import BeautifulSoup

          S=requests.Session()
          S.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
          })

          def req(method,url,**kw):
              try:
                  r=S.request(method,url,timeout=(20,60),allow_redirects=True,**kw)
                  print(f'REQ {method} {url} -> {r.status_code} {r.url} bytes={len(r.content)} type={r.headers.get("content-type")}',flush=True)
                  return r
              except Exception as e:
                  print('ERR',method,url,repr(e),flush=True)
                  return None

          print('=== EASTMONEY NOTICE PAGE SCRIPTS ===',flush=True)
          for code in ('838948','873888'):
              page=f'https://xinsanban.eastmoney.com/Article/NoticeList/{code}'
              r=req('GET',page)
              if not r: continue
              soup=BeautifulSoup(r.text,'html.parser')
              scripts=[]
              for s in soup.find_all('script'):
                  if s.get('src'):
                      scripts.append(urljoin(r.url,s['src']))
                  elif s.string and any(k in s.string for k in ('index_notice','code','Notice')):
                      print('INLINE',code,s.string[:5000],flush=True)
              print('SCRIPTS',code,json.dumps(scripts,ensure_ascii=False,indent=2),flush=True)
              for su in scripts:
                  rr=req('GET',su)
                  if not rr: continue
                  text=rr.text
                  if any(k.lower() in text.lower() for k in ('index_notice','noticelist','stock_list','np-anotice','security/ann','noticecontent','art_code')):
                      print(f'--- RELEVANT SCRIPT {su} ---',flush=True)
                      keys=('index_notice','NoticeList','noticelist','stock_list','np-anotice','security/ann','noticecontent','art_code','api/')
                      seen=[]
                      for key in keys:
                          pos=0
                          while True:
                              i=text.lower().find(key.lower(),pos)
                              if i<0: break
                              span=text[max(0,i-1500):i+3000]
                              sig=(key,i)
                              if sig not in seen:
                                  print('CTX',key,i,span,flush=True)
                                  seen.append(sig)
                              pos=i+len(key)
                              if len(seen)>60: break
                          if len(seen)>60: break
                      urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+|/[A-Za-z0-9_./?-]*(?:Notice|notice|ann|Article|api)[A-Za-z0-9_./?=&%-]*',text)))
                      print('CANDIDATE_URLS',json.dumps(urls[:300],ensure_ascii=False,indent=2),flush=True)

          print('=== EASTMONEY API VARIANTS ===',flush=True)
          api='https://np-anotice-stock.eastmoney.com/api/security/ann'
          codes=['838948','0.838948','838948.BJ','838948.NQ','NQ838948','873888','0.873888','873888.BJ','873888.NQ','NQ873888']
          for code in codes:
              params={'sr':'-1','page_size':'100','page_index':'1','ann_type':'A','client_source':'web','stock_list':code}
              r=req('GET',api,params=params)
              if r:
                  print('APIRESULT',code,r.text[:3000].replace('\n',' '),flush=True)

          print('=== NEEQ MOBILE SEARCH PAGE HIDDEN FIELDS ===',flush=True)
          for host in ('https://www.neeq.cc','https://www.neeq.com.cn'):
              r=req('GET',host+'/m/company/info_public.html')
              if not r: continue
              soup=BeautifulSoup(r.content,'html.parser')
              for tag in soup.find_all(['input','select','option']):
                  attrs=dict(tag.attrs)
                  if any(k in str(attrs).lower() for k in ('node','search','page')):
                      print('FIELD',host,tag.name,attrs,tag.get_text(' ',strip=True),flush=True)
              m=re.search(r'id=["\']searchNodeId["\'][^>]*value=["\']([^"\']*)',r.text,re.I)
              nodeids=['']
              if m: nodeids.append(m.group(1))
              nodeids += re.findall(r'(?:nodeId|searchNodeId)["\']?\s*[:=]\s*["\']?([0-9]+)',r.text,re.I)
              nodeids=list(dict.fromkeys(nodeids))
              print('NODEIDS',host,nodeids,flush=True)
              keywords=[
                  '838948','穿金戴银','尊尚（深圳）穿金戴银技术股份有限公司',
                  '穿金戴银 2018年年度报告','穿金戴银 2017年年度报告','穿金戴银 2016年年度报告',
                  '尊尚（深圳）穿金戴银技术股份有限公司 公开转让说明书',
              ]
              for node in nodeids:
                  for kwd in keywords:
                      data={'page':'0','pageSize':'100','keywords':kwd,'publishDate':'','nodeId':node,'callback':'cb'}
                      for method in ('GET','POST'):
                          rr=req(method,host+'/info/list.do',params=data if method=='GET' else None,data=data if method=='POST' else None,
                                 headers={'Referer':host+'/m/company/info_public.html','X-Requested-With':'XMLHttpRequest'})
                          if rr:
                              text=rr.content.decode('utf-8','ignore')
                              print('NEEQRESULT',host,method,'node='+node,'kw='+kwd,text[:12000].replace('\n',' '),flush=True)

          print('=== OTHER NEEQ SEARCH ENDPOINT VARIANTS ===',flush=True)
          endpoints=[
              'https://www.neeq.com.cn/disclosureInfoController/companyAnnouncement.do',
              'https://www.neeq.com.cn/disclosureInfoController/companyAnnouncementNoCache.do',
          ]
          for ep in endpoints:
              for code in ('838948','873888'):
                  variants=[
                      {'page':'0','pageSize':'500','companyCode':code,'disclosureType':'5','isNewThree':'1','xxfcbj':'3'},
                      {'page':'0','pageSize':'500','zqdm':code,'disclosureType':'5','isNewThree':'1','xxfcbj':'3'},
                      {'page':'0','pageSize':'500','stockCode':code,'disclosureType':'5','isNewThree':'1','xxfcbj':'3'},
                      {'page':'0','pageSize':'500','keywords':code,'disclosureType':'5','isNewThree':'1','xxfcbj':'3'},
                      {'page':'0','pageSize':'500','companyCode':code,'disclosureType[]':'5','isNewThree':'1','xxfcbj[]':'3'},
                  ]
                  for p in variants:
                      for method in ('GET','POST'):
                          rr=req(method,ep,params=p if method=='GET' else None,data=p if method=='POST' else None,
                                 headers={'Referer':'https://www.neeq.com.cn/'})
                          if rr:
                              print('DISCLOSURE_RESULT',ep,method,code,json.dumps(p,ensure_ascii=False),rr.text[:8000].replace('\n',' '),flush=True)
          PY
          python /tmp/deep.py | tee deep.log
      - uses: actions/upload-artifact@v4
        with:
          name: hipine-deep-discovery-log
          path: deep.log
          retention-days: 3
