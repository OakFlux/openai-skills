name: Publish Bank of Chongqing direct report archives
on:
  push:
    branches:
      - tmp-bank-chongqing-direct-artifacts-20260915
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download verified source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source complete part1 part2
          gh run download 34938921067 --repo OakFlux/openai-skills --name bank-chongqing-verified-reports --dir source
          ls -lah source
      - name: Extract and validate final packages
        run: |
          set -euo pipefail
          unzip -q source/CQBankReports.zip -d complete
          unzip -q source/CQBank_2020_2022.zip -d part1
          unzip -q source/CQBank_2023_2026.zip -d part2
          test "$(find complete -maxdepth 1 -type f -iname '*.pdf' | wc -l)" -eq 8
          test "$(find part1 -maxdepth 1 -type f -iname '*.pdf' | wc -l)" -eq 3
          test "$(find part2 -maxdepth 1 -type f -iname '*.pdf' | wc -l)" -eq 5
          unzip -t source/CQBankReports.zip >/dev/null
          unzip -t source/CQBank_2020_2022.zip >/dev/null
          unzip -t source/CQBank_2023_2026.zip >/dev/null
          find complete -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Upload complete direct archive
        uses: actions/upload-artifact@v4
        with:
          name: CQBankReports
          path: complete/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
      - name: Upload 2020-2022 direct archive
        uses: actions/upload-artifact@v4
        with:
          name: CQBank_2020_2022
          path: part1/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
      - name: Upload 2023-2026 direct archive
        uses: actions/upload-artifact@v4
        with:
          name: CQBank_2023_2026
          path: part2/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
