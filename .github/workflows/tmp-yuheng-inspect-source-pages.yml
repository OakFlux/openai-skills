name: Inspect Yuheng Report Source Pages

on:
  push:
    branches:
      - tmp-yuheng-002437-broker-reports-20261004

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4 lxml
      - name: Inspect source pages
        shell: bash
        run: |
          python - <<'PY'
          import re, json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages=[
            ('suwen-p','https://wenkum.suwen.cn/p-248976.html'),
            ('suwen-d','https://wenkum.suwen.cn/d-248976.html'),
            ('ninef','https://www.9fzt.com/detail/sz_002437_10_818776405669.html'),
            ('baogaobox-insight','https://www.baogaobox.com/insights/251214000023833.html'),
            ('book118','https://max.book118.com/html/2025/1212/5214002204013032.shtm'),
            ('ifxh','https://www.ifxh.com/2640.html'),
            ('299sucai','https://299sucai.com/hybg/9977/'),
          ]
          for label,url in pages:
            print('\n'+'='*120)
            print('PAGE',label,url)
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'))
              print('HEADERS',dict(r.headers))
              enc=r.apparent_encoding or r.encoding or 'utf-8'; r.encoding=enc
              html=r.text
              print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',html,re.I|re.S)[:3])
              print('FIRST500',html[:500].replace('\n',' '))
              soup=BeautifulSoup(html,'html.parser')
              candidates=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data','action','content'):
                  v=tag.get(attr)
                  if isinstance(v,str):
                    u=urljoin(r.url,v)
                    candidates.append((tag.name,attr,tag.get_text(' ',strip=True)[:80],u))
              for m in re.findall(r'https?://[^\"\'<>\s]+',html,re.I):
                candidates.append(('raw','url','',m))
              for m in re.findall(r'[\"\']([^\"\']+\.(?:pdf|zip|docx?|rar|7z)(?:\?[^\"\']*)?)[\"\']',html,re.I):
                candidates.append(('raw','file','',urljoin(r.url,m)))
              print('INTERESTING URLS')
              seen=set()
              for tag,attr,text,u in candidates:
                lu=u.lower()
                if u in seen: continue
                if any(k in lu for k in ('pdf','download','down','attach','file','doc','preview','api','ajax','resource','asset','oss','cos','cdn','pan.baidu','aliyundrive','quark','123pan')) or any(k in text for k in ('下载','PDF','原文','附件','网盘')):
                  seen.add(u)
                  print(tag,attr,repr(text),'=>',u[:1200])
              print('FORMS')
              for form in soup.find_all('form'):
                print('FORM',form.get('method'),urljoin(r.url,form.get('action') or ''),[(x.get('name'),x.get('value')) for x in form.find_all(['input','button'])][:30])
              print('SCRIPTS WITH KEYWORDS')
              for script in soup.find_all('script'):
                txt=script.string or script.get_text() or ''
                if any(k in txt.lower() for k in ('pdf','download','fileurl','filepath','attach','resource','docid','api/','ajax')):
                  print('SCRIPT SRC',script.get('src'),'TEXT',txt[:5000])
              print('LINES WITH KEYWORDS')
              for line in html.splitlines():
                ll=line.lower()
                if any(k in ll for k in ('pdf','download','fileurl','filepath','attach','resource','docid','百度网盘','提取码')):
                  print(line[:3000])
            except Exception as e:
              print('ERROR',type(e).__name__,repr(e))
          PY
