name: Browser inspect Silkroad Visual report sources 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-sina-report-inspect-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright beautifulsoup4 lxml requests
          python -m playwright install chromium

      - name: Resolve and inspect pages with browser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import re
          from urllib.parse import quote
          from playwright.async_api import async_playwright

          QUERIES = [
              ('丝路视觉 以技术呈现创意 用数字定义视界 PDF', ['三个皮匠报告']),
              ('丝路视觉 视觉即话语 细琢数字内容创意 PDF', ['三个皮匠报告','未来智库','远瞻慧库','报告查一查']),
              ('丝路视觉 专业化CG视觉服务提供商 受益于影视特效迅速发展 PDF', ['发现报告','证券之星']),
          ]

          async def inspect_page(context, label, href):
              page = await context.new_page()
              network = []
              page.on('response', lambda resp: network.append((resp.status, resp.url, resp.headers.get('content-type','')))
              print('\n\n===== OPEN', label)
              print('START', href)
              try:
                  await page.goto(href, wait_until='domcontentloaded', timeout=90000)
                  await page.wait_for_timeout(12000)
                  print('FINAL', page.url)
                  print('TITLE', await page.title())
                  body = re.sub(r'\s+', ' ', (await page.locator('body').inner_text(timeout=10000))[:12000])
                  print('BODY', body[:12000])
                  links = await page.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||'').trim(), href:a.href})).filter(x=>x.href)")
                  chosen = []
                  for item in links:
                      blob = (item.get('text','') + ' ' + item.get('href','')).lower()
                      if any(tok in blob for tok in ['pdf','下载','查看完整','免费查看','preview','file','report','document','附件']):
                          chosen.append(item)
                  print('LINKS', json.dumps(chosen[:200], ensure_ascii=False))
                  print('NETWORK')
                  for status, url, ct in network:
                      blob=(url+' '+ct).lower()
                      if any(tok in blob for tok in ['.pdf','download','file','preview','document','report','attachment','oss','api']):
                          print(status, ct, url)
                  html = await page.content()
                  for pattern in [
                      r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?',
                      r'file[_-]?url.{0,500}',
                      r'download.{0,500}',
                      r'preview.{0,500}',
                      r'document[_-]?id.{0,300}',
                  ]:
                      found = re.findall(pattern, html, flags=re.I|re.S)
                      print('PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:20])

                  # Try only clearly public/view buttons. Do not log in or purchase.
                  selectors = [
                      'text=免费查看完整报告',
                      'text=查看完整报告',
                      'text=在线阅读',
                      'text=报告下载',
                      'text=下载报告',
                      'text=预览',
                  ]
                  for selector in selectors:
                      loc = page.locator(selector)
                      try:
                          count = await loc.count()
                      except Exception:
                          count = 0
                      if count:
                          print('BUTTON_FOUND', selector, count)
                          try:
                              before = page.url
                              await loc.first.click(timeout=5000)
                              await page.wait_for_timeout(5000)
                              print('AFTER_CLICK', selector, 'BEFORE', before, 'AFTER', page.url, 'TITLE', await page.title())
                              print('POPUPS_OR_BODY', re.sub(r'\s+',' ',(await page.locator('body').inner_text())[:5000]))
                          except Exception as exc:
                              print('CLICK_ERROR', selector, repr(exc))
              except Exception as exc:
                  print('OPEN_ERROR', repr(exc), 'URL_NOW', page.url)
              finally:
                  await page.close()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox'])
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
                      locale='zh-CN',
                  )
                  seen=set()
                  for query, needles in QUERIES:
                      search = await context.new_page()
                      url = 'https://www.so.com/s?q=' + quote(query) + '&pn=1'
                      print('\n\n######## SEARCH', query, url)
                      try:
                          await search.goto(url, wait_until='domcontentloaded', timeout=90000)
                          await search.wait_for_timeout(5000)
                          anchors = await search.locator('a').evaluate_all("els => els.map(a=>({text:(a.innerText||'').trim(),href:a.href})).filter(x=>x.href)")
                          matches=[]
                          for item in anchors:
                              if any(n in item.get('text','') for n in needles):
                                  matches.append(item)
                          print('MATCHES', json.dumps(matches[:100], ensure_ascii=False))
                          for item in matches[:30]:
                              href=item['href']
                              if href not in seen:
                                  seen.add(href)
                                  await inspect_page(context, item.get('text',''), href)
                      except Exception as exc:
                          print('SEARCH_ERROR', repr(exc))
                      finally:
                          await search.close()
                  await browser.close()

          asyncio.run(main())
          PY
