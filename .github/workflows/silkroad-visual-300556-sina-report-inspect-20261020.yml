name: Probe Silkroad Visual public report page images 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-sina-report-inspect-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe public report images and Next data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pillow beautifulsoup4 lxml
          python - <<'PY'
          import io
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.fxbaogao.com/detail/92087',
          })

          detail = s.get('https://www.fxbaogao.com/detail/92087', timeout=(20,90))
          text = detail.content.decode(detail.apparent_encoding or 'utf-8', errors='replace')
          soup = BeautifulSoup(text, 'lxml')
          print('DETAIL', detail.status_code, len(detail.content))
          next_tag = soup.find('script', id='__NEXT_DATA__')
          print('NEXT_DATA_FOUND', bool(next_tag))
          if next_tag:
              print('NEXT_DATA', next_tag.get_text()[:30000])
          print('ALL_SCRIPTS')
          for script in soup.find_all('script', src=True):
              print(urljoin(detail.url, script.get('src')))

          bases = [
              'https://public.fxbaogao.com/report-image/2017/02/07/92087-{page}.png',
              'https://public.fxbaogao.com/report-image/2017/02/07/92087-{page}.jpg',
              'https://public.fxbaogao.com/report-image/2017/02/07/92087-{page}.jpeg',
              'https://public.fxbaogao.com/report-image/2017/02/07/92087-{page}.webp',
          ]
          for base in bases:
              print('\nBASE', base)
              consecutive_missing = 0
              for page in range(1, 36):
                  url = base.format(page=page)
                  try:
                      r = s.get(url, timeout=(15,60), allow_redirects=True)
                      info = {'page': page, 'status': r.status_code, 'bytes': len(r.content), 'ct': r.headers.get('content-type'), 'url': r.url}
                      if r.status_code == 200 and r.content:
                          try:
                              image = Image.open(io.BytesIO(r.content))
                              info['format'] = image.format
                              info['size'] = image.size
                          except Exception as exc:
                              info['image_error'] = repr(exc)
                      print(json.dumps(info, ensure_ascii=False))
                      if r.status_code == 200 and len(r.content) > 5000:
                          consecutive_missing = 0
                      else:
                          consecutive_missing += 1
                      if consecutive_missing >= 4 and page > 5:
                          break
                  except Exception as exc:
                      print(json.dumps({'page':page,'error':repr(exc)}, ensure_ascii=False))
                      consecutive_missing += 1
                      if consecutive_missing >= 4 and page > 5:
                          break
          PY
