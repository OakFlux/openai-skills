name: Inspect Silkroad Visual broker report sources 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-sina-report-inspect-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect public research pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls = [
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=300556',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz300556',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=%E4%B8%9D%E8%B7%AF%E8%A7%86%E8%A7%89',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=300556&t1=all',
              'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=300556',
              'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=sz300556',
          ]

          for url in urls:
              print('\n=== URL', url)
              try:
                  r = session.get(url, timeout=(20, 90), allow_redirects=True)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content), 'CT', r.headers.get('content-type'))
                  text = r.content.decode(r.apparent_encoding or 'utf-8', errors='replace')
                  print('HEAD', re.sub(r'\s+', ' ', text[:500]))
                  soup = BeautifulSoup(text, 'lxml')
                  seen = set()
                  for a in soup.find_all('a', href=True):
                      label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                      href = urljoin(r.url, a['href'])
                      blob = label + ' ' + href
                      if any(key in blob for key in ['丝路视觉', '300556', 'vReport_Show', 'rptid']):
                          key = (label, href)
                          if key not in seen:
                              seen.add(key)
                              print('LINK', label[:200], href)
                  for pattern in [r'rptid[/=](\d+)', r'vReport_Show[^"\']+', r'丝路视觉.{0,120}']:
                      found = re.findall(pattern, text, flags=re.S)
                      print('PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:20])
              except Exception as exc:
                  print('ERROR', repr(exc))
          PY
