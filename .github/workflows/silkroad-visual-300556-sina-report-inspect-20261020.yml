name: Inspect Silkroad Visual public report hosts 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-sina-report-inspect-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect report hosts and endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = [
              ('发现报告 安信2017', 'https://www.fxbaogao.com/detail/92087'),
              ('360文库 安信2017', 'https://wenku.so.com/d/48ddfb3c309469a5526ad171bc4409cd'),
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def inspect(label, url):
              print('\n\n########', label, url)
              try:
                  r = session.get(url, timeout=(20, 120), allow_redirects=True)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'LEN', len(r.content), 'CT', r.headers.get('content-type'))
                  text = r.content.decode(r.apparent_encoding or 'utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'lxml')
                  plain = re.sub(r'\s+', ' ', soup.get_text(' ', strip=True))
                  print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')
                  print('TEXT_HEAD', plain[:5000])

                  links = []
                  for tag in soup.find_all(['a','form','iframe','embed','object','source','script','link','img']):
                      label_text = re.sub(r'\s+', ' ', tag.get_text(' ', strip=True))[:300]
                      for key in ['href','src','action','data','value','content']:
                          value = tag.get(key)
                          if not value:
                              continue
                          target = urljoin(r.url, html.unescape(str(value)))
                          blob = (label_text + ' ' + target).lower()
                          if any(token in blob for token in ['.pdf','download','down','file','attachment','document','preview','api','oss','cos','static','media']):
                              links.append({'tag': tag.name, 'label': label_text, 'attr': key, 'url': target[:1800]})
                  print('LINKS', json.dumps(links[:300], ensure_ascii=False))

                  raw = []
                  for chunk in re.findall(r'https?://[^\s\"\'<>]+', text):
                      if any(token in chunk.lower() for token in ['.pdf','download','file','attachment','document','preview','api','oss','cos']):
                          raw.append(html.unescape(chunk[:2000]))
                  print('RAW_URLS', json.dumps(sorted(set(raw))[:300], ensure_ascii=False))

                  scripts = []
                  for script in soup.find_all('script'):
                      body = script.string or script.get_text() or ''
                      if any(token in body.lower() for token in ['pdf','download','fileurl','file_url','documentid','document_id','preview','oss','api']):
                          scripts.append(body[:8000])
                  print('SCRIPT_SNIPPETS', json.dumps(scripts[:30], ensure_ascii=False))

                  patterns = [
                      r'file[_-]?url[^\n]{0,1000}',
                      r'download[^\n]{0,1000}',
                      r'pdf[^\n]{0,1000}',
                      r'document[_-]?id[^\n]{0,800}',
                      r'preview[^\n]{0,1000}',
                      r'attachment[^\n]{0,1000}',
                      r'api[/\w?=&.%-]{0,1000}',
                  ]
                  for pattern in patterns:
                      found = re.findall(pattern, text, flags=re.I|re.S)
                      print('PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:20])
              except Exception as exc:
                  print('ERROR', repr(exc))

          for label, url in urls:
              inspect(label, url)
          PY
