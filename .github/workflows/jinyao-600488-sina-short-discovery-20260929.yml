name: Probe Sina Jinyao report archive quickly 20260929

on:
  push:
    paths:
      - '.github/workflows/jinyao-600488-sina-short-discovery-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe Sina endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, re
          from html import unescape
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})
          urls=[
            'https://biz.finance.sina.com.cn/qmx/stockreports.php?symbol=600488',
            'http://biz.finance.sina.com.cn/qmx/stockreports.php?symbol=600488',
            'https://biz.finance.sina.com.cn/qmx/stockreports.php?symbol=sh600488',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=(8,12),allow_redirects=True)
              print('URL',url,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'ENC',r.apparent_encoding,flush=True)
              text=r.content.decode(r.apparent_encoding or 'gb18030',errors='replace')
              print('TEXT_HEAD',text[:2000].replace('\n',' '),flush=True)
              for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                href=urljoin(r.url,unescape(m.group(1)))
                title=unescape(re.sub(r'<[^>]+>','',m.group(2)))
                title=re.sub(r'\s+',' ',title).strip()
                if title or '600488' in href:
                  print('LINK',title,href,flush=True)
            except Exception as e:
              print('ERROR',url,repr(e),flush=True)
          PY
