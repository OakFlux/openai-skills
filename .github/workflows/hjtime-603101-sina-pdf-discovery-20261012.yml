name: Discover HJTime Sina broker report PDF links 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-sina-pdf-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect Sina report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          from bs4 import BeautifulSoup
          pages={
            '824284320303':'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/824284320303/index.phtml',
            '823958022302':'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/823958022302/index.phtml',
          }
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://stock.finance.sina.com.cn/','Accept-Language':'zh-CN,zh;q=0.9'})
          scripts=set()
          for rid,url in pages.items():
            r=s.get(url,timeout=(15,60)); raw=r.content
            print('PAGE',rid,r.status_code,len(raw),r.url,r.headers.get('content-type'),flush=True)
            text=None
            for enc in ('gb18030','gbk','utf-8'):
              try: text=raw.decode(enc); break
              except: pass
            if text is None: text=raw.decode('latin1','replace')
            soup=BeautifulSoup(text,'lxml')
            print('TITLE',rid,soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
            links=[]
            for tag in soup.find_all(True):
              for attr in ('href','src','onclick','data-url','data-src'):
                val=tag.get(attr)
                if not val: continue
                sval=str(val)
                if attr in ('href','src','data-url','data-src'): sval=urllib.parse.urljoin(r.url,sval)
                if tag.name=='script' and attr=='src': scripts.add(sval)
                if any(k in sval.lower() for k in ('pdf','download','file','report','rpt','attach','doc')) or '下载' in sval or '全文' in sval:
                  links.append({'tag':tag.name,'attr':attr,'value':sval,'text':' '.join(tag.get_text(' ',strip=True).split())[:200]})
            urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',text)))
            interesting=[u for u in urls if any(k in u.lower() for k in ('pdf','download','file','report','rpt','attach','doc'))]
            print('LINKS',rid,json.dumps(links[:200],ensure_ascii=False),flush=True)
            print('URLS',rid,json.dumps(interesting[:200],ensure_ascii=False),flush=True)
            for pat in ('pdf','download','下载','报告全文','附件','rptid','file','url'):
              snippets=[]
              for m in list(re.finditer(pat,text,re.I))[:30]: snippets.append(text[max(0,m.start()-250):min(len(text),m.end()+500)])
              if snippets: print('SNIPS',rid,pat,json.dumps(snippets[:30],ensure_ascii=False),flush=True)
          for i,url in enumerate(sorted(scripts),1):
            try:
              r=s.get(url,timeout=(15,60)); text=r.text
              print('SCRIPT',i,r.status_code,len(r.content),url,flush=True)
              hits=[]
              for pat in ('pdf','download','rptid','report','file','attachment'):
                for m in list(re.finditer(pat,text,re.I))[:100]: hits.append(text[max(0,m.start()-180):min(len(text),m.end()+350)])
              if hits: print('SCRIPT_HITS',url,json.dumps(hits[:100],ensure_ascii=False),flush=True)
            except Exception as e: print('SCRIPT_ERR',url,repr(e),flush=True)
          PY
