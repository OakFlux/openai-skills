name: Probe Eastmoney public reports for Zhejiang Expressway 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-eastmoney-artifact-probe-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query report APIs and validate candidate PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          mkdir -p emprobe
          python - <<'PY'
          import hashlib, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('emprobe')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9'})
          base={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2030-01-01','pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
          variants=[]
          for code in ['00576','0576','576','116.00576','00576.HK','HK00576','*']:
            variants.append((f'list_code_{code.replace(".","_")}', 'GET','https://reportapi.eastmoney.com/report/list',{**base,'code':code}))
          for kw in ['浙江沪杭甬','沪杭甬','浙江沪杭甬高速公路']:
            variants.append((f'list_keyword_{kw}', 'GET','https://reportapi.eastmoney.com/report/list',{**base,'code':'*','keyword':kw}))
          # list2 is used by newer Eastmoney pages for individual-stock research.
          for code in ['00576','0576','576','116.00576','00576.HK']:
            variants.append((f'list2_get_{code.replace(".","_")}', 'GET','https://reportapi.eastmoney.com/report/list2',{**base,'code':code}))
            variants.append((f'list2_post_{code.replace(".","_")}', 'POST','https://reportapi.eastmoney.com/report/list2',{**base,'code':code}))
          for kw in ['浙江沪杭甬','沪杭甬']:
            variants.append((f'list2_keyword_{kw}', 'POST','https://reportapi.eastmoney.com/report/list2',{**base,'code':'*','keyword':kw}))

          all_rows=[]; summaries=[]
          for idx,(label,method,url,params) in enumerate(variants):
            try:
              if method=='POST':
                r=s.post(url,params=params,json=params,timeout=(20,90))
              else:
                r=s.get(url,params=params,timeout=(20,90))
              print('REQ',idx,label,method,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
              safe=re.sub(r'[^0-9A-Za-z_.-]+','_',label)
              (out/f'{idx:02d}_{safe}.bin').write_bytes(r.content)
              txt=r.text.strip(); txt=re.sub(r'^[^(]*\(','',txt); txt=re.sub(r'\)\s*;?\s*$','',txt)
              try: data=r.json()
              except Exception:
                try: data=json.loads(txt)
                except Exception as e:
                  summaries.append({'label':label,'status':r.status_code,'url':r.url,'bytes':len(r.content),'parse_error':repr(e),'head':txt[:500]}); continue
              rows=[]
              if isinstance(data,dict):
                for key in ['data','result','list','items','Data']:
                  v=data.get(key)
                  if isinstance(v,list): rows=v; break
                  if isinstance(v,dict):
                    for kk in ['data','list','items','Data']:
                      vv=v.get(kk)
                      if isinstance(vv,list): rows=vv; break
                    if rows: break
              hits=data.get('hits') if isinstance(data,dict) else None
              matches=[]
              for row in rows:
                if not isinstance(row,dict): continue
                blob=json.dumps(row,ensure_ascii=False)
                if any(k in blob for k in ['浙江沪杭甬','沪杭甬','00576','0576']): matches.append(row)
              print('PARSE',label,'hits',hits,'rows',len(rows),'matches',len(matches),flush=True)
              for m in matches: print('MATCH',json.dumps(m,ensure_ascii=False),flush=True)
              summaries.append({'label':label,'status':r.status_code,'url':r.url,'bytes':len(r.content),'hits':hits,'rows':len(rows),'matches':len(matches)})
              all_rows.extend(matches)
            except Exception as e:
              print('ERR',label,repr(e),flush=True); summaries.append({'label':label,'error':repr(e)})
            time.sleep(0.4)

          # Deduplicate and try Eastmoney's public PDF template.
          uniq=[]; seen=set()
          for row in all_rows:
            key=row.get('infoCode') or row.get('encodeUrl') or json.dumps(row,sort_keys=True,ensure_ascii=False)
            if key in seen: continue
            seen.add(key); uniq.append(row)
          pdf_results=[]
          for i,row in enumerate(uniq):
            info=row.get('infoCode')
            if not info: continue
            urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf']
            for j,u in enumerate(urls):
              try:
                r=s.get(u,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=(20,150),allow_redirects=True)
                ok=r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>20000
                rec={'infoCode':info,'title':row.get('title'),'orgSName':row.get('orgSName'),'publishDate':row.get('publishDate'),'attachPages':row.get('attachPages'),'url':u,'final_url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'ok':ok}
                if ok:
                  p=out/f'candidate_{i:02d}_{info}.pdf'; p.write_bytes(r.content)
                  try: rec['actual_pages']=len(PdfReader(str(p),strict=False).pages)
                  except Exception as e: rec['pdf_error']=repr(e)
                  rec['sha256']=hashlib.sha256(r.content).hexdigest()
                pdf_results.append(rec); print('PDF',json.dumps(rec,ensure_ascii=False),flush=True)
                if ok: break
              except Exception as e:
                pdf_results.append({'infoCode':info,'url':u,'error':repr(e),'ok':False}); print('PDFERR',info,u,repr(e),flush=True)
          (out/'summaries.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'matches.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'pdf_results.json').write_text(json.dumps(pdf_results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_MATCHES',len(uniq),'VALID_PDFS',sum(1 for x in pdf_results if x.get('ok')),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-eastmoney-artifact-probe
          path: emprobe/
          if-no-files-found: error
          retention-days: 7
