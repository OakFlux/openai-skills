name: Build Star Plus Legend 06683 complete filings package v2 20260927

on:
  push:
    paths:
      - '.github/workflows/starplus-06683-complete-filings-package-v2-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download and package official filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, html, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          BASE='https://www1.hkexnews.hk'
          SEARCH=BASE+'/search/titleSearchServlet.do'
          PACKAGE='巨星传奇_06683_全部年报_招股说明书_最新定期报告_截至2026-09-27'
          OUT=Path(PACKAGE); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/pdf,application/json,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':BASE+'/'})

          def get_text(url, params=None):
              errs=[]
              for n in range(1,6):
                  try:
                      r=s.get(url,params=params,timeout=(30,180),allow_redirects=True)
                      print('GET',r.status_code,r.url,'bytes',len(r.content),flush=True)
                      r.raise_for_status(); return r.text
                  except Exception as e:
                      errs.append(repr(e)); time.sleep(n*2)
              raise RuntimeError(f'GET failed {url}: {errs}')

          raw=get_text(BASE+'/search/prefix.do',{'callback':'cb','lang':'ZH','type':'A','name':'6683','market':'SEHK'})
          info=json.loads(raw[raw.index('(')+1:raw.rindex(')')])['stockInfo']
          sid=int([x for x in info if str(x.get('code','')).lstrip('0')=='6683'][0]['stockId'])

          def search(**kw):
              p=dict(sortDir=0,sortByOptions='DateTime',category=0,market='SEHK',stockId=sid,documentType=-1,fromDate=20150101,toDate=20991231,title='',searchType=1,t1code=-2,t2Gcode=-2,t2code=-2,rowRange=500,lang='ZH')
              p.update(kw)
              outer=json.loads(get_text(SEARCH,p)); result=outer.get('result',[])
              return json.loads(result) if isinstance(result,str) else result

          annual_rows=search(t1code=40000,t2code=40100)
          print('ANNUAL_ROWS',json.dumps(annual_rows,ensure_ascii=False),flush=True)
          annual={}
          for row in annual_rows:
              title=html.unescape(row.get('TITLE','')).strip(); compact=re.sub(r'\s+','',title)
              if not ('年報' in compact or '年度報告' in compact): continue
              if any(x in compact for x in ('環境、社會及管治','環境社會及管治','ESG','摘要','印刷')): continue
              years=[int(x) for x in re.findall(r'20\d{2}',title)]
              if years:
                  report_year=max(years)
              else:
                  m=re.search(r'(20\d{2})$',row.get('DATE_TIME',''))
                  if not m: continue
                  report_year=int(m.group(1))-1
              if report_year in (2023,2024,2025) and report_year not in annual:
                  annual[report_year]={'kind':'年度报告','title':title,'year':report_year,'date':row.get('DATE_TIME',''),'url':BASE+row['FILE_LINK'],'filename':f'{report_year}_巨星传奇_06683_{report_year}年年度报告_中文版_官方原文.pdf','min_pages':100,'min_bytes':300000}
          if set(annual)!={2023,2024,2025}:
              raise RuntimeError(f'annual report discovery incomplete: {annual}')

          docs=[annual[2023],annual[2024],annual[2025]]
          # The two final Chinese Global Offering documents published after the postponed listing are the base and supplemental prospectuses.
          prospectus_candidates=[
              {'kind':'招股文件待识别','title':'全球發售','year':2023,'date':'30/06/2023 06:10','url':BASE+'/listedco/listconews/sehk/2023/0630/2023063000038_c.pdf'},
              {'kind':'招股文件待识别','title':'全球發售','year':2023,'date':'30/06/2023 06:06','url':BASE+'/listedco/listconews/sehk/2023/0630/2023063000016_c.pdf'},
          ]
          latest={'kind':'最新定期财务披露','title':'截至2026年6月30日止六个月的中期业绩公告及有关2025年年报的补充资料','year':2026,'date':'31/08/2026 22:43','url':BASE+'/listedco/listconews/sehk/2026/0831/2026083102980_c.pdf','filename':'2026_巨星传奇_06683_2026年中期业绩公告_最新定期财务披露_中文版_官方原文.pdf','min_pages':10,'min_bytes':100000}
          interim={'kind':'最新完整中期报告','title':'2025中期报告','year':2025,'date':'30/09/2025 06:10','url':BASE+'/listedco/listconews/sehk/2025/0930/2025093000016_c.pdf','filename':'2025_巨星传奇_06683_2025年中期报告_最新完整中期报告_中文版_官方原文.pdf','min_pages':50,'min_bytes':200000}

          def download(url,dest,min_bytes):
              urls=[url]
              if 'www1.hkexnews.hk' in url: urls.append(url.replace('www1.hkexnews.hk','www.hkexnews.hk'))
              errs=[]
              for u in dict.fromkeys(urls):
                  for n in range(1,6):
                      tmp=dest.with_suffix(dest.suffix+'.part')
                      try:
                          with s.get(u,timeout=(30,300),allow_redirects=True,stream=True) as r:
                              print('DOWNLOAD',dest.name,n,r.status_code,u,'->',r.url,flush=True); r.raise_for_status()
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024*1024):
                                      if chunk: f.write(chunk)
                          if tmp.stat().st_size<min_bytes or not tmp.open('rb').read(8).startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF size={tmp.stat().st_size}')
                          tmp.replace(dest); return str(r.url)
                      except Exception as e:
                          errs.append(f'{u} #{n}: {e!r}'); tmp.unlink(missing_ok=True); time.sleep(n*2)
              raise RuntimeError(f'download failed {dest.name}: {errs}')

          def inspect(path):
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages); text=''
              for page in reader.pages[:min(40,pages)]:
                  try: text+='\n'+(page.extract_text() or '')
                  except Exception: pass
              return pages,text

          probes=[]
          for i,d in enumerate(prospectus_candidates,1):
              p=OUT/f'_prospectus_{i}.pdf'; final=download(d['url'],p,100000); pages,text=inspect(p)
              probes.append((d,p,final,pages,text))
          probes.sort(key=lambda x:x[3],reverse=True)
          print('PROSPECTUS_PAGE_COUNTS',[x[3] for x in probes],flush=True)
          if probes[0][3]<300 or probes[1][3]>=probes[0][3]: raise RuntimeError('prospectus classification failed')
          base,base_p,base_url,base_pages,base_text=probes[0]
          sup,sup_p,sup_url,sup_pages,sup_text=probes[1]
          base.update({'kind':'最终招股章程','title':'全球发售——最终招股章程（中文版）','filename':'2023_巨星传奇_06683_最终招股章程_中文版_官方原文.pdf','min_pages':300,'min_bytes':1000000,'preloaded':(base_p,base_url,base_pages,base_text)})
          sup.update({'kind':'补充招股章程','title':'全球发售——补充招股章程（中文版）','filename':'2023_巨星传奇_06683_补充招股章程_中文版_官方原文.pdf','min_pages':2,'min_bytes':100000,'preloaded':(sup_p,sup_url,sup_pages,sup_text)})
          docs.extend([base,sup,latest,interim])

          records=[]; hashes=set()
          for d in docs:
              dest=OUT/d['filename']
              if 'preloaded' in d:
                  p,source,pages,text=d.pop('preloaded'); p.replace(dest)
              else:
                  source=download(d['url'],dest,d['min_bytes']); pages,text=inspect(dest)
              if pages<d['min_pages']: raise RuntimeError(f'page count too small: {dest.name}: {pages}')
              check=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if check.returncode not in (0,3): raise RuntimeError(f'qpdf failed {dest.name}: {check.stderr[-1500:]}')
              data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError(f'duplicate PDF {dest.name}')
              hashes.add(sha)
              rec={'filename':dest.name,'document_type':d['kind'],'document_title':re.sub(r'\s+',' ',d['title']).strip(),'reporting_year':d['year'],'disclosure_datetime':d['date'],'source':'香港交易所披露易（HKEXnews）','source_url':source,'pages':pages,'bytes':len(data),'sha256':sha}
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          records.sort(key=lambda r:(r['reporting_year'],r['document_type'],r['filename']))
          readme=[
              '巨星传奇集团有限公司（06683.HK）全部年度报告、最终招股文件及最新定期财务报告',
              '整理日期：2026-09-27','资料来源：香港交易所披露易（HKEXnews）中文官方PDF原件','',
              '收录口径：',
              '1. 公司于2023年7月13日上市，上市主体独立完整年度报告为2023、2024、2025年；上市前2020—2022年历史财务资料载于招股章程及会计师报告。',
              '2. 招股文件收录2023年6月30日重新启动全球发售后正式刊发的最终招股章程及补充招股章程，不以早期申请稿替代。',
              '3. 港股主板公司通常不发布A股口径的一季报和三季报。截至2026年9月27日，最新定期财务披露为2026年中期业绩公告；2026年完整中期报告尚未刊发，因此同时收录最新完整的2025年中期报告。',
              '4. 为控制体积，本包收录中文官方原件，未重复加入内容等价的英文版本。','', '文件清单：'
          ]
          for i,r in enumerate(records,1):
              readme += [f"{i}. {r['document_type']}｜{r['document_title']}",f"   文件：{r['filename']}",f"   披露时间：{r['disclosure_datetime']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",f"   官方来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          readme += ['完整性核验：PDF文件头、实际页数、qpdf结构检查、重复哈希排除、SHA-256清单及ZIP CRC校验。']
          (OUT/'00_文件清单与范围说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')
          with (OUT/'sources.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(records[0])); w.writeheader(); w.writerows(records)

          zp=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in sorted(OUT.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zp) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad: raise RuntimeError('ZIP CRC failure '+bad)
              if len(pdfs)!=7: raise RuntimeError(f'expected 7 PDFs, got {len(pdfs)}')
          print('FINAL_ZIP',zp.name,zp.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',hashlib.sha256(zp.read_bytes()).hexdigest(),flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: starplus-06683-complete-filings-final-v2
          path: 巨星传奇_06683_全部年报_招股说明书_最新定期报告_截至2026-09-27.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
