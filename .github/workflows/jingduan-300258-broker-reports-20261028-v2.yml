name: Build Jingduan 300258 broker deep reports v2 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jingduan-300258-broker-reports-20261028-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='300258'; SHORT='精锻科技'; FULL='江苏太平洋精锻科技股份有限公司'
          PACKAGE='精锻科技_300258_券商深度报告_3份'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {'broker':'东吴证券','broker_aliases':['东吴证券','东吴证券研究所','东吴研究所'],'date':'2025-06-08','title':'精密齿轮行业龙头，布局减速器卡位机器人核心部件','analysts':'黄细里、郭雨蒙','rating':'买入（首次）','info':'AP202506081687237738','min_pages':20,'type':'公司深度研究/首次覆盖'},
            {'broker':'开源证券','broker_aliases':['开源证券','开源证券研究所','开源研究所'],'date':'2023-07-05','title':'公司首次覆盖报告：国内精锻齿轮龙头，战略转型赋能长期发展','analysts':'任浪、朱莹','rating':'买入（首次）','info':'AP202307051592039048','min_pages':20,'type':'公司首次覆盖报告'},
            {'broker':'德邦证券','broker_aliases':['德邦证券','德邦研究所','tebon.com.cn'],'date':'2023-09-14','title':'差速器齿轮隐形冠军，多元布局注入成长新动能','analysts':'俞能飞','rating':'买入（首次）','info':'AP202309151598691792','min_pages':18,'type':'公司首次覆盖报告'},
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Accept':'application/pdf,*/*;q=0.8'})
          def safe(x): return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',x))[:110]
          manifest=[]; total_pages=0

          for idx,rep in enumerate(reports,1):
            detail=f"https://data.eastmoney.com/report/info/{rep['info']}.html"
            data=None; source=''; attempts=[]
            for prefix in ('H3','H2','H1','H4'):
              url=f"https://pdf.dfcfw.com/pdf/{prefix}_{rep['info']}_1.pdf"
              for attempt in range(6):
                try:
                  r=s.get(url,headers={'User-Agent':s.headers['User-Agent'],'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'},timeout=(30,360),allow_redirects=True)
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                    data=r.content; source=url; break
                except Exception as exc:
                  attempts.append({'url':url,'attempt':attempt+1,'error':repr(exc)})
                time.sleep(1+attempt)
              if data: break
            if not data: raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

            filename=f"{idx:02d}_{safe(rep['broker'])}_精锻科技_{safe(rep['title'])}_{rep['date']}.pdf"
            dest=PDFDIR/filename; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<rep['min_pages']: raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')
            total_pages+=pages

            text=''
            for page in reader.pages[:min(20,pages)]:
              try: text+='\n'+(page.extract_text() or '')
              except Exception: pass
            compact=re.sub(r'\s+','',text)
            identity_hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
            broker_hits=[x for x in rep['broker_aliases'] if re.sub(r'\s+','',x) in compact]
            if len(compact)>500 and not identity_hits: raise RuntimeError(f'Issuer identity mismatch: {filename}')
            if len(compact)>500 and not broker_hits: raise RuntimeError(f'Broker identity mismatch: {filename}; aliases={rep["broker_aliases"]}')

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError(f'Preview failed: {filename}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**rep,'filename':str(Path('原始PDF')/filename),'actual_pages':pages,'bytes':len(data),'sha256':sha,'source_report_page':detail,'source_pdf_url':source,'identity_hits':identity_hits,'broker_hits':broker_hits,'preview_file':str(Path('首页预览')/preview.name),'download_attempts':attempts,'validation':['PDF header','issuer identity','broker identity','page count','qpdf structure','first-page render']})

          readme=['江苏太平洋精锻科技股份有限公司（300258.SZ）券商深度研究报告资料包','整理日期：2026-10-28','','本包收录3份公开可直接取得的券商原始完整PDF。','筛选口径：公司深度或首次覆盖，优先不同券商与较长报告；未使用普通季报点评凑数。','']
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   类型：{x['type']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",f"   来源页面：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          readme += [f'合计：{len(manifest)}份PDF，{total_pages}页。','报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','已核验PDF文件头、公司名称/证券代码、券商标识、实际页数、文档结构、首页渲染、ZIP CRC和SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zip_cn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_cn) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3: raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')
          zip_en=Path('jingduan_300258_broker_deep_reports.zip'); zip_en.write_bytes(zip_cn.read_bytes())
          print('FINAL_ZIP',zip_cn,zip_cn.stat().st_size,'SHA256',hashlib.sha256(zip_cn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: jingduan-300258-broker-deep-reports-v2-final
          path: |
            精锻科技_300258_券商深度报告_3份.zip
            jingduan_300258_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
