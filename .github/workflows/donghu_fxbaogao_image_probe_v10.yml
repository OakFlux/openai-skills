name: probe-donghu-fxbaogao-page-images-v10

on:
  push:
    branches:
      - tmp/donghu-hightech-page-probe-20261104-v7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe public page images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/'})
          docs=[('3770114','2023/06/29'),('3990320','2023/11/01')]
          for doc,date in docs:
            print('\nDOC',doc,date)
            for n in range(1,31):
              urls=[
                f'https://public.fxbaogao.com/report-image/{date}/{doc}-{n}.png',
                f'https://public.fxbaogao.com/report-image/{date}/{doc}-{n}.jpg',
              ]
              found=False
              for u in urls:
                try:
                  r=s.get(u,timeout=(10,30),allow_redirects=True,headers={'Range':'bytes=0-4095','Referer':f'https://www.fxbaogao.com/view?id={doc}'})
                  print('PAGE',doc,n,r.status_code,len(r.content),r.headers.get('content-type'),r.headers.get('content-range'),u,r.content[:12])
                  if r.status_code in (200,206) and r.headers.get('content-type','').startswith('image/') and len(r.content)>100:
                    found=True;break
                except Exception as e:
                  print('ERR',doc,n,u,repr(e))
              if not found and n>1:
                break
          PY
