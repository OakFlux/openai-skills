name: Locate Yanbaoke search API 20261020 v2

on:
  push:
    paths:
      - '.github/workflows/yanbaoke-search-api-20261020-v2.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests
      - name: Crawl search bundle dependencies
        shell: bash
        run: |
          python - <<'PY'
          import re, requests
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0'})
          base='https://www.yanbaoke.com/_nuxt/'
          queue=['D1qSNvGE.js','BGpYdiOz.js']
          seen=set()
          for depth in range(4):
            current=list(queue);queue=[]
            for name in current:
              if name in seen: continue
              seen.add(name)
              try:
                r=s.get(base+name,timeout=90);txt=r.text
                print('\nFILE',name,r.status_code,len(txt))
                # Print likely endpoint fragments and public API call definitions.
                for m in re.finditer(r'(?:https?://[^"\'` ]+|["\'`]/(?:api|search|report|info|download)[^"\'` ]*["\'`])',txt,re.I):
                  frag=txt[max(0,m.start()-300):m.end()+500]
                  print('ENDPOINT_FRAG',frag)
                for token in ['apiBase','api.quzili','keyword','searchParams','report/list','/search','download','fetch(','useFetch','$fetch','axios']:
                  for m in list(re.finditer(re.escape(token),txt,re.I))[:30]:
                    print('TOKEN',token,txt[max(0,m.start()-350):m.start()+800])
                deps=set(re.findall(r'["\']\.\/([A-Za-z0-9_\-]+\.js)["\']',txt))
                for dep in deps:
                  if dep not in seen: queue.append(dep)
              except Exception as e:
                print('ERROR',name,repr(e))
            print('DEPTH',depth,'NEXT',queue)
          print('SEEN',seen)
          PY
