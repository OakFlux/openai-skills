name: Find 2015 Yueyang Xingchang company report PDF 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-find-2015-report-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query report API and probe PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io, json, re, time, requests
          from pypdf import PdfReader

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          for begin,end in [('2015-04-01','2015-04-30'),('2014-01-01','2016-12-31'),('2010-01-01','2026-11-04')]:
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','code':'000819','cb':'datatable000819','_':str(int(time.time()*1000))}
              r=s.get(endpoint,params=params,timeout=(30,180)); print('API',begin,end,r.status_code,len(r.content),r.url)
              text=r.text.strip().lstrip('\ufeff')
              m=re.search(r'^[^(]+\((.*)\)\s*;?$',text,re.S)
              obj=json.loads(m.group(1) if m else text)
              rows=obj.get('data') or []
              print('HITS',obj.get('hits'),'ROWS',len(rows))
              for row in rows:
                  print('ROW',json.dumps({k:row.get(k) for k in ['title','orgSName','orgName','publishDate','infoCode','infocode','researcher','emRatingName']},ensure_ascii=False))
                  info=str(row.get('infoCode') or row.get('infocode') or '')
                  if not info: continue
                  urls=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf']
                  for url in urls:
                      rr=s.get(url,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/report/'},timeout=(30,180))
                      rec={'url':url,'status':rr.status_code,'bytes':len(rr.content),'type':rr.headers.get('content-type'),'head':rr.content[:8].hex()}
                      if rr.status_code==200 and rr.content[:5]==b'%PDF-':
                          try:
                              rec['pages']=len(PdfReader(io.BytesIO(rr.content),strict=False).pages)
                          except Exception as e: rec['pdf_error']=repr(e)
                      print('PROBE',json.dumps(rec,ensure_ascii=False))
          PY
