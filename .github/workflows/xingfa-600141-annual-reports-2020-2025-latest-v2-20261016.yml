name: Build Xingfa Group 600141 annual reports package v2 20261016

on:
  push:
    paths:
      - '.github/workflows/xingfa-600141-annual-reports-2020-2025-latest-v2-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build package
        run: python .github/scripts/xingfa_600141_reports_package.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xingfa-600141-annual-reports-2020-2025-latest-final-v2
          path: |
            兴发集团_600141_2020-2025年报及最新季报.zip
            ZIP_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
