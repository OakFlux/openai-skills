name: Probe SGPJBG file CDN for Lixing report

on:
  push:
    paths:
      - '.github/workflows/lixing-sgpjbg-probe-20261021.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Probe page and CDN candidates
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import requests,re,json,html,urllib.parse,os
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://www.sgpjbg.com/bgdown/623279.html','Connection':'close'}
          pages=['http://www.sgpjbg.com/bgdown/623279.html','https://www.sgpjbg.com/bgdown/623279.html','https://www.sgpjbg.com/baogao/623279.html']
          for u in pages:
            print('\nPAGE',u)
            try:
              r=s.get(u,headers=headers,timeout=(10,25),allow_redirects=True)
              print('STATUS',r.status_code,'LEN',len(r.content),'CT',r.headers.get('content-type'),'FINAL',r.url)
              text=r.text
              for i,line in enumerate(text.splitlines(),1):
                low=line.lower()
                if any(k in low for k in ['fileroot','acc452','623279','.pdf','downloadurl','downurl','fileurl','srcurl','original','docurl','f9933']):
                  if len(line)<10000: print('LINE',i,line[:9500])
              urls=[]
              for m in re.findall(r'https?://[^\s"\'<>]+',text):
                m=html.unescape(m)
                if any(k in m.lower() for k in ['fileroot','623279','acc452','.pdf']):urls.append(m)
              print('FOUND',json.dumps(list(dict.fromkeys(urls))[:200],ensure_ascii=False,indent=2))
            except Exception as e: print('PAGEERR',repr(e))

          base='https://file.sgpjbg.com/fileroot2/2025-4/9/f9933b8c-6bcb-4d52-9ecd-d89af9b76896/'
          names=[
            'acc452027edb45bb9364171c6d24e176.gif','acc452027edb45bb9364171c6d24e176.pdf','acc452027edb45bb9364171c6d24e176.docx',
            '623279.pdf','623279.docx','report.pdf','source.pdf','original.pdf','file.pdf','1.pdf','download.pdf',
          ]
          for name in names:
            u=base+name
            try:
              r=s.get(u,headers={**headers,'Range':'bytes=0-2047'},timeout=(10,20),allow_redirects=True)
              print('CDN',name,r.status_code,len(r.content),r.headers.get('content-type'),r.headers.get('content-length'),r.headers.get('content-range'),r.url,repr(r.content[:32]))
            except Exception as e: print('CDNERR',name,repr(e))
          PY
