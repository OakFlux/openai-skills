name: Build Qingdao Food 001219 complete filings package v2 20261028

on:
  push:
    paths:
      - '.github/workflows/qingdao-food-001219-all-filings-v2-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import urllib.parse
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          TODAY='2026-10-28'
          COMPANY='青岛食品'
          FULL='青岛食品股份有限公司'
          CODE='001219'
          OLD_CODE='872387'
          PACKAGE='青岛食品_001219_全部年报_招股说明书_最新季报'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART):
              d.mkdir(parents=True,exist_ok=True)

          reports=[
            {'order':1,'doc_type':'年度报告','period':'2017','label':'2017年年度报告','source_kind':'sina','bulletin_id':'6418757','source_date':'2020-07-02','announcement_title':'青岛食品：2017年年度报告（后续重新披露版本）','min_pages':50,'filename':'01_青岛食品_2017年年度报告.pdf'},
            {'order':2,'doc_type':'年度报告','period':'2018','label':'2018年年度报告','source_kind':'sina','bulletin_id':'6418890','source_date':'2020-07-02','announcement_title':'青岛食品：2018年年度报告（后续重新披露版本）','min_pages':50,'filename':'02_青岛食品_2018年年度报告.pdf'},
            {'order':3,'doc_type':'年度报告','period':'2019','label':'2019年年度报告','source_kind':'sina','bulletin_id':'6418941','source_date':'2020-07-02','announcement_title':'青岛食品：2019年年度报告（后续重新披露版本）','min_pages':50,'filename':'03_青岛食品_2019年年度报告.pdf'},
            {'order':4,'doc_type':'年度报告','period':'2020','label':'2020年年度报告','source_kind':'sina','bulletin_id':'6980138','source_date':'2021-03-26','announcement_title':'青岛食品：2020年年度报告','min_pages':50,'filename':'04_青岛食品_2020年年度报告.pdf'},
            {'order':5,'doc_type':'年度报告','period':'2021','label':'2021年年度报告','source_kind':'eastmoney','art_code':'AN202204171559827352','announcement_date':'2022-04-18','announcement_title':'青岛食品:2021年年度报告','min_pages':50,'filename':'05_青岛食品_2021年年度报告.pdf'},
            {'order':6,'doc_type':'年度报告','period':'2022','label':'2022年年度报告（更正后）','source_kind':'eastmoney','art_code':'AN202306271591724173','announcement_date':'2023-06-28','announcement_title':'青岛食品:2022年年度报告(更正后)','min_pages':50,'filename':'06_青岛食品_2022年年度报告_更正后.pdf'},
            {'order':7,'doc_type':'年度报告','period':'2023','label':'2023年年度报告','source_kind':'eastmoney','art_code':'AN202404091630085635','announcement_date':'2024-04-10','announcement_title':'青岛食品:2023年年度报告','min_pages':50,'filename':'07_青岛食品_2023年年度报告.pdf'},
            {'order':8,'doc_type':'年度报告','period':'2024','label':'2024年年度报告','source_kind':'eastmoney','art_code':'AN202504161657466419','announcement_date':'2025-04-17','announcement_title':'青岛食品:2024年年度报告','min_pages':50,'filename':'08_青岛食品_2024年年度报告.pdf'},
            {'order':9,'doc_type':'年度报告','period':'2025','label':'2025年年度报告','source_kind':'eastmoney','art_code':'AN202604161821273149','announcement_date':'2026-04-17','announcement_title':'青岛食品:2025年年度报告','min_pages':50,'filename':'09_青岛食品_2025年年度报告.pdf'},
            {'order':10,'doc_type':'招股说明书','period':'IPO','label':'首次公开发行股票招股说明书','source_kind':'eastmoney','art_code':'AN202109281519175067','announcement_date':'2021-09-29','announcement_title':'青岛食品:首次公开发行股票招股说明书','min_pages':250,'filename':'10_青岛食品_首次公开发行股票招股说明书.pdf'},
            {'order':11,'doc_type':'季度报告','period':'2026Q3','label':'2026年第三季度报告','source_kind':'eastmoney','art_code':'AN202610231830839870','announcement_date':'2026-10-24','announcement_title':'青岛食品:2026年三季度报告','min_pages':5,'filename':'11_青岛食品_2026年第三季度报告.pdf'},
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def get_pdf_from_urls(urls:list[str], referer:str='') -> tuple[bytes,str,dict[str,Any]]:
              last:dict[str,Any]={}
              for url in urls:
                  for attempt in range(1,6):
                      try:
                          headers={'User-Agent':session.headers['User-Agent'],'Accept':'application/pdf,*/*;q=0.8'}
                          if referer:
                              headers['Referer']=referer
                          r=session.get(url,headers=headers,timeout=(30,420),allow_redirects=True)
                          last={'requested_url':url,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                          if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>30000:
                              return r.content,str(r.url),last
                      except Exception as exc:
                          last={'requested_url':url,'error':repr(exc)}
                      time.sleep(attempt)
              raise RuntimeError(f'PDF download failed: {last}')

          def download_eastmoney(art_code:str) -> tuple[bytes,str,dict[str,Any],str]:
              detail=f'https://data.eastmoney.com/notices/detail/{CODE}/{art_code}.html'
              urls=[
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_01.pdf',
              ]
              data,url,meta=get_pdf_from_urls(urls,detail)
              return data,url,meta,detail

          def extract_sina_pdf_links(page_url:str) -> list[str]:
              links=[]
              try:
                  r=session.get(page_url,headers={'User-Agent':session.headers['User-Agent'],'Accept':'text/html,*/*'},timeout=(20,120),allow_redirects=True)
                  raw=r.content
                  for enc in ('gb18030','utf-8'):
                      try:
                          text=raw.decode(enc,errors='ignore')
                          break
                      except Exception:
                          text=''
                  patterns=[
                      r'href=["\']([^"\']+\.PDF(?:\?[^"\']*)?)["\']',
                      r'(https?://file\.finance\.sina\.com\.cn/[^"\'<>\s]+\.PDF)',
                  ]
                  for pattern in patterns:
                      for match in re.findall(pattern,text,flags=re.I):
                          u=html.unescape(match).replace('\\/','/')
                          u=urllib.parse.urljoin(page_url,u)
                          if u not in links:
                              links.append(u)
              except Exception:
                  pass
              return links

          def download_sina(bulletin_id:str, source_date:str) -> tuple[bytes,str,dict[str,Any],str]:
              detail_pages=[
                  f'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid={CODE}',
                  f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bulletin_id}&stockid={CODE}',
              ]
              candidate_urls=[]
              for page in detail_pages:
                  candidate_urls.extend(extract_sina_pdf_links(page))
              year,month,_=source_date.split('-')
              month_no=str(int(month))
              base_paths=[
                  f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/SBGG/{year}/{year}-{month_no}/{source_date}/{bulletin_id}.PDF',
                  f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/SBGG/{year}/{year}-{month}/{source_date}/{bulletin_id}.PDF',
                  f'http://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/SBGG/{year}/{year}-{month_no}/{source_date}/{bulletin_id}.PDF',
              ]
              for u in base_paths:
                  if u not in candidate_urls:
                      candidate_urls.append(u)
              last_error=None
              for detail in detail_pages:
                  try:
                      data,url,meta=get_pdf_from_urls(candidate_urls,detail)
                      return data,url,meta,detail
                  except Exception as exc:
                      last_error=exc
              raise RuntimeError(f'Sina PDF failed for {bulletin_id}: {last_error}; candidates={candidate_urls}')

          manifest=[]
          identity_tokens=[COMPANY,FULL,CODE,OLD_CODE,'QINGDAO FOODS']
          for item in reports:
              if item['source_kind']=='eastmoney':
                  data,source_url,download_meta,detail_page=download_eastmoney(item['art_code'])
              else:
                  data,source_url,download_meta,detail_page=download_sina(item['bulletin_id'],item['source_date'])

              dest=OUT/item['filename']; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages<item['min_pages']:
                  raise RuntimeError(f'Too few pages: {dest.name}={pages}')

              text_parts=[]
              indices=list(range(min(30,pages)))
              if pages>2:
                  indices += [pages-2,pages-1]
              for idx in dict.fromkeys(indices):
                  try:
                      text_parts.append(reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              text='\n'.join(text_parts)
              identity_ok=any(token in text for token in identity_tokens)
              if not identity_ok:
                  txt=RENDER/f'{item["order"]:02d}_extract.txt'
                  subprocess.run(['pdftotext','-f','1','-l',str(min(40,pages)),str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  text += '\n' + txt.read_text(encoding='utf-8',errors='ignore')
                  identity_ok=any(token in text for token in identity_tokens)
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity failed: {dest.name}')

              if item['doc_type']=='年度报告':
                  type_period_ok=item['period'] in text and ('年度报告' in text or '年度 报告' in text or 'Annual Report' in text)
              elif item['doc_type']=='招股说明书':
                  type_period_ok='招股说明书' in text and ('首次公开发行股票' in text or '首次公开发行' in text)
              else:
                  type_period_ok='2026' in text and ('第三季度' in text or '三季度' in text or '季度报告' in text)
              if not type_period_ok:
                  raise RuntimeError(f'Document type/period failed: {dest.name}')

              q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              if q.returncode!=0:
                  raise RuntimeError(f'qpdf failed: {dest.name}: {q.stdout[-1000:]}')

              first=RENDER/f'{item["order"]:02d}_first'
              last=RENDER/f'{item["order"]:02d}_last'
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','95','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
              if not first_png.exists() or first_png.stat().st_size<8000:
                  raise RuntimeError(f'First-page render failed: {dest.name}')
              if not last_png.exists() or last_png.stat().st_size<3000:
                  raise RuntimeError(f'Last-page render failed: {dest.name}')

              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  'order':item['order'],'stock_code':CODE,'former_stock_code':OLD_CODE,
                  'stock_name':COMPANY,'company_full_name':FULL,
                  'doc_type':item['doc_type'],'period':item['period'],'report_label':item['label'],
                  'announcement_title':item['announcement_title'],
                  'announcement_date':item.get('announcement_date') or item.get('source_date'),
                  'source_kind':item['source_kind'],'source_url':source_url,'detail_page':detail_page,
                  'art_code':item.get('art_code'),'sina_bulletin_id':item.get('bulletin_id'),
                  'filename':item['filename'],'pages':pages,'bytes':len(data),'sha256':sha,
                  'identity_check':identity_ok,'document_type_period_check':type_period_ok,
                  'validation':['PDF header','company identity','document type/period','page count','qpdf structure','first-page render','last-page render'],
                  'download_meta':download_meta,
              })
              print('VALIDATED',json.dumps(manifest[-1],ensure_ascii=False),flush=True)

          if len(manifest)!=11:
              raise RuntimeError(f'Expected 11 PDFs, got {len(manifest)}')
          if len({x['sha256'] for x in manifest})!=11:
              raise RuntimeError('Duplicate PDF content detected')
          annual_years=[x['period'] for x in manifest if x['doc_type']=='年度报告']
          expected=[str(y) for y in range(2017,2026)]
          if annual_years!=expected:
              raise RuntimeError(f'Annual coverage mismatch: {annual_years}')

          readme=[
              '青岛食品股份有限公司（001219.SZ；新三板时期代码872387）全部公开年报、正式招股说明书及最新季报资料包',
              f'整理日期：{TODAY}','',
              '收录范围：公司自新三板挂牌后公开披露的2017—2025年度报告全文共9份、2021年首次公开发行股票正式招股说明书，以及截至整理日最新的2026年第三季度报告。',
              '2017—2020年年报采用新三板时期后续重新披露或正式版本；2022年年报采用2023年6月披露的更正后版本。',
              '已排除年度报告摘要、招股意向书、招股说明书摘要、申报稿、注册稿、发行公告、上市公告书、审计报告和网页摘要。','',
              '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
              readme += [
                  f'{i}. {m["filename"]}',
                  f'   类型：{m["doc_type"]}；报告期/文件：{m["report_label"]}',
                  f'   公告标题：{m["announcement_title"]}',
                  f'   公告日期：{m["announcement_date"]}；实际页数：{m["pages"]}页',
                  f'   来源：{m["source_url"]}',
                  f'   SHA-256：{m["sha256"]}',''
              ]
          readme += [
              '核验说明：所有PDF均完成文件头、公司身份、文件类型/报告期、页数、qpdf结构、首页与末页渲染检查；已排除重复文件。',
              '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(OUT.iterdir()):
                  z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
              bad=z.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=11:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'PDF_COUNT',11,'SHA256',zip_sha,flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: qingdao-food-001219-all-annual-reports-prospectus-latest-quarter-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
