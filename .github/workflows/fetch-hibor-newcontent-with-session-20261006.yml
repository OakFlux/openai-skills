name: Fetch Hibor NewContent with session

on:
  pull_request:
    paths:
      - 'tasks/fetch-hibor-newcontent-with-session-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Load report pages then post NewContent request
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          reports={
            'haitong':('https://sysbg.hibor.com.cn/data/b6836279f674f42f07de9d42efb68f4f.html','049bf5e6-5f63-4e47-bbf0-40b7197f88d4'),
            'changjiang':('https://sysbg.hibor.com.cn/data/6f55c864c513463af41bc24102216d00.html','67e7eaa6-e837-4eab-8a86-4f788be44abc'),
          }
          result={}
          for name,(page,ncid) in reports.items():
            s=requests.Session();s.trust_env=False
            s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
            r=s.get(page,timeout=(25,120),allow_redirects=True)
            print('PAGE',name,r.status_code,len(r.content),r.url,'cookies',s.cookies.get_dict(),flush=True)
            Path(f'output/{name}_shell.html').write_bytes(r.content)
            headers={'Referer':r.url,'Origin':'https://sysbg.hibor.com.cn','X-Requested-With':'XMLHttpRequest','Accept':'*/*'}
            rr=s.post('https://sysbg.hibor.com.cn/hiborweb/DocDetail/NewContent',data={'ncid':ncid},headers=headers,timeout=(25,120),allow_redirects=True)
            Path(f'output/{name}_content.html').write_bytes(rr.content)
            text=rr.text
            print('CONTENT',name,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),'cookies',s.cookies.get_dict(),flush=True)
            print(text[:100000],flush=True)
            soup=BeautifulSoup(text,'html.parser') if text else None
            links=[]
            if soup:
              for tag in soup.find_all(['a','img','iframe','embed','object','form','input','script','button']):
                t=' '.join(tag.get_text(' ',strip=True).split())
                attrs={k:tag.get(k) for k in ('href','src','action','value','onclick','id','name','data','data-src','data-original') if tag.get(k)}
                blob=(t+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in blob for k in ('pdf','download','原文','报告','image','page','viewer','file','docid','repinfo','scan','view')):
                  links.append({'tag':tag.name,'text':t[:500],'attrs':attrs})
            tokens=[]
            for m in re.finditer(r'.{0,300}(?:\.pdf|download|fileurl|filepath|docid|pageimage|original|报告原文|打开报告原文|viewer|repinfo|docdetail).{0,600}',text,flags=re.I|re.S):
              tokens.append(re.sub(r'\s+',' ',m.group(0))[:1500])
            result[name]={'page_status':r.status_code,'content_status':rr.status_code,'content_length':len(rr.content),'content_type':rr.headers.get('content-type'),'cookies':s.cookies.get_dict(),'links':links,'tokens':tokens[:500]}
            print('PARSED',name,json.dumps(result[name],ensure_ascii=False)[:100000],flush=True)
          Path('output/results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hibor-newcontent-session-results
          path: output/
          retention-days: 7
          if-no-files-found: error
