name: Discover older Ningbo Huaxiang deep reports

on:
  push:
    branches:
      - tmp-ningbo-huaxiang-broker-reports-20261028

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query older Eastmoney public report index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, re, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          all_rows=[]; page=1
          while True:
              params={'cb':'datatable4263982','industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2005-01-01','endTime':'2017-12-31','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'002048','rcode':''}
              r=s.get(api,params=params,timeout=120); r.raise_for_status()
              t=r.text.strip(); m=re.match(r'^[^(]+\((.*)\)\s*;?$',t,re.S); p=json.loads(m.group(1) if m else t)
              rows=p.get('data') or []; hits=int(p.get('hits') or 0); all_rows.extend(rows)
              if not rows or page>=math.ceil(hits/100): break
              page+=1
          print('TOTAL',len(all_rows))
          all_rows.sort(key=lambda x:(x.get('attachPages') or 0,x.get('publishDate') or ''),reverse=True)
          for row in all_rows:
              print('\t'.join([str(row.get('publishDate') or '')[:10],str(row.get('attachPages') or ''),str(row.get('orgSName') or row.get('orgName') or ''),str(row.get('infoCode') or ''),str(row.get('ratingName') or row.get('emRatingName') or ''),str(row.get('researcher') or ''),str(row.get('title') or '')]))
          PY
