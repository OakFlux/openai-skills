name: Probe Vzkoo Greentown Huachuang report PDF 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-huachuang-vzkoo-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch document pages and inspect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vzkoo_probe
          python - <<'PY'
          from __future__ import annotations
          import html,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://www.vzkoo.com/read/2025010207170f6867843dcae5972c26.html'})
          urls=[
            'https://www.vzkoo.com/document/20250102ab841a6e55baebfaa34112fa.html?from=report',
            'https://www.vzkoo.com/document/20250102ab841a6e55baebfaa34112fa.html',
            'https://www.vzkoo.com/read/2025010207170f6867843dcae5972c26.html',
          ]
          all_scripts=[]; recs=[]
          for i,u in enumerate(urls):
            try:
              r=s.get(u,timeout=(30,180),allow_redirects=True)
              print('GET',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path(f'vzkoo_probe/page_{i}.bin').write_bytes(r.content)
              txt=r.text; soup=BeautifulSoup(txt,'lxml')
              scripts=[urljoin(r.url,t.get('src')) for t in soup.find_all('script') if t.get('src')]
              all_scripts += scripts
              links=[]
              for t in soup.find_all(['a','iframe','embed','object','source','link','img']):
                for a in ('href','src','data','data-src','data-url','file','url'):
                  v=t.get(a)
                  if v: links.append(urljoin(r.url,html.unescape(v)))
              pats=[r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',r'["\']([^"\']*(?:pdf|download|file|document|preview|oss|cdn)[^"\']*)["\']',r'(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|documentUrl|previewUrl|sourceUrl|url)\s*[:=]\s*["\']([^"\']+)["\']']
              cand=set(links)
              for pat in pats:
                for m in re.finditer(pat,txt,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  cand.add(urljoin(r.url,html.unescape(v).replace('\\/','/')))
              rec={'input':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '','scripts':scripts,'candidates':sorted(cand)}
              recs.append(rec); Path(f'vzkoo_probe/page_{i}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
            except Exception as e:
              recs.append({'input':u,'error':repr(e)}); print('ERR',u,repr(e),flush=True)
          for j,u in enumerate(dict.fromkeys(all_scripts)):
            if j>=80: break
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('SCRIPT',j,r.status_code,len(r.content),u,flush=True)
              if r.status_code==200 and len(r.content)<20_000_000:
                Path(f'vzkoo_probe/script_{j:02d}.js').write_bytes(r.content)
            except Exception as e: print('SCRIPT_ERR',u,repr(e),flush=True)
          Path('vzkoo_probe/records.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "\.pdf|pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|documentUrl|previewUrl|sourceUrl|20250102ab841a6e55baebfaa34112fa|cdnfiles|oss|api/" vzkoo_probe > vzkoo_probe/grep_hits.txt || true
          grep -RhoE "https?://[^\"'[:space:]<>]+" vzkoo_probe | sort -u > vzkoo_probe/urls.txt || true
          find vzkoo_probe -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > vzkoo_probe/file_sizes.txt

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greentown-huachuang-vzkoo-probe
          path: vzkoo_probe
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
