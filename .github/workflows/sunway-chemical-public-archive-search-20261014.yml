name: Search public archive for Sunway Chemical reports 20261014

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-public-archive-search-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search public directory indexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import requests
          from urllib.parse import unquote, urljoin

          urls = [
              'https://aigc.idigital.com.cn/djyanbao/',
          ]
          terms = ['三维化学', '三维工程', '工程化工齐发展', '新疆煤化工带来机遇', '分红比例大幅提升', 'Q4业绩显著提速']
          s = requests.Session()
          s.trust_env = False
          s.headers['User-Agent'] = 'Mozilla/5.0 Chrome/155'
          for url in urls:
              r = s.get(url, timeout=(30, 300))
              print('INDEX', url, r.status_code, len(r.content), r.headers.get('content-type'), flush=True)
              r.raise_for_status()
              text = r.content.decode('utf-8', errors='ignore')
              links = re.findall(r'href=["\']([^"\']+)["\']', text, flags=re.I)
              print('LINK_COUNT', len(links), flush=True)
              found = []
              for href in links:
                  decoded = html.unescape(unquote(href))
                  if any(term in decoded for term in terms):
                      found.append((decoded, urljoin(url, href)))
              print('FOUND_COUNT', len(found), flush=True)
              for name, full in found:
                  print('MATCH', name, full, flush=True)
          PY
