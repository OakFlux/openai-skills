name: Build Shanghai Jiubai 600838 reports 20261021

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-600838-reports-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import fitz
          import requests
          from PIL import Image
          from pypdf import PdfReader

          package_name = '上海九百_600838_2020-2025年报及最新季报_截至2026-10-21'
          root = Path(package_name)
          annual_dir = root / '年报'
          quarterly_dir = root / '最新季报'
          preview_dir = root / '首页预览'
          for folder in (root, annual_dir, quarterly_dir, preview_dir):
              folder.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'period': '2020',
                  'category': '年度报告',
                  'publish_date': '2021-03-31',
                  'title': '上海九百2020年年度报告',
                  'filename': '01_上海九百_2020年年度报告.pdf',
                  'destination': annual_dir,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-3/2021-03-31/7002051.PDF',
                  ],
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7002051&stockid=600838',
                  'min_pages': 100,
              },
              {
                  'order': 2,
                  'period': '2021',
                  'category': '年度报告',
                  'publish_date': '2022-03-31',
                  'title': '上海九百2021年年度报告',
                  'filename': '02_上海九百_2021年年度报告.pdf',
                  'destination': annual_dir,
                  'urls': ['https://static.cninfo.com.cn/finalpage/2022-03-31/1212742827.PDF'],
                  'source_page': 'https://static.cninfo.com.cn/finalpage/2022-03-31/1212742827.PDF',
                  'min_pages': 100,
              },
              {
                  'order': 3,
                  'period': '2022',
                  'category': '年度报告',
                  'publish_date': '2023-03-30',
                  'title': '上海九百2022年年度报告',
                  'filename': '03_上海九百_2022年年度报告.pdf',
                  'destination': annual_dir,
                  'urls': ['https://static.cninfo.com.cn/finalpage/2023-03-30/1216259972.PDF'],
                  'source_page': 'https://static.cninfo.com.cn/finalpage/2023-03-30/1216259972.PDF',
                  'min_pages': 100,
              },
              {
                  'order': 4,
                  'period': '2023',
                  'category': '年度报告',
                  'publish_date': '2024-03-30',
                  'title': '上海九百2023年年度报告',
                  'filename': '04_上海九百_2023年年度报告.pdf',
                  'destination': annual_dir,
                  'urls': ['https://static.cninfo.com.cn/finalpage/2024-03-30/1219467389.PDF'],
                  'source_page': 'https://static.cninfo.com.cn/finalpage/2024-03-30/1219467389.PDF',
                  'min_pages': 100,
              },
              {
                  'order': 5,
                  'period': '2024',
                  'category': '年度报告',
                  'publish_date': '2025-03-28',
                  'title': '上海九百2024年年度报告',
                  'filename': '05_上海九百_2024年年度报告.pdf',
                  'destination': annual_dir,
                  'urls': ['https://static.cninfo.com.cn/finalpage/2025-03-28/1222922393.PDF'],
                  'source_page': 'https://static.cninfo.com.cn/finalpage/2025-03-28/1222922393.PDF',
                  'min_pages': 100,
              },
              {
                  'order': 6,
                  'period': '2025',
                  'category': '年度报告',
                  'publish_date': '2026-03-27',
                  'title': '上海九百2025年年度报告',
                  'filename': '06_上海九百_2025年年度报告.pdf',
                  'destination': annual_dir,
                  'urls': ['https://static.cninfo.com.cn/finalpage/2026-03-27/1225034821.PDF'],
                  'source_page': 'https://static.cninfo.com.cn/finalpage/2026-03-27/1225034821.PDF',
                  'min_pages': 100,
              },
              {
                  'order': 7,
                  'period': '2026Q1',
                  'category': '第一季度报告',
                  'publish_date': '2026-04-29',
                  'title': '上海九百2026年第一季度报告',
                  'filename': '07_上海九百_2026年第一季度报告.pdf',
                  'destination': quarterly_dir,
                  'urls': ['https://static.cninfo.com.cn/finalpage/2026-04-29/1225224894.PDF'],
                  'source_page': 'https://static.cninfo.com.cn/finalpage/2026-04-29/1225224894.PDF',
                  'min_pages': 5,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          default_headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }

          def download_pdf(urls: list[str], referer: str) -> tuple[bytes, str, list[dict]]:
              attempts: list[dict] = []
              for url in urls:
                  for attempt in range(1, 7):
                      try:
                          response = session.get(
                              url,
                              headers={**default_headers, 'Referer': referer},
                              timeout=(30, 300),
                              allow_redirects=True,
                          )
                          content = response.content
                          attempts.append({
                              'url': url,
                              'attempt': attempt,
                              'status': response.status_code,
                              'bytes': len(content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          })
                          if response.status_code == 200 and content[:5] == b'%PDF-' and len(content) > 100_000:
                              return content, response.url, attempts
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt, 'error': repr(exc)})
                      time.sleep(min(10, 1.5 * attempt))
              raise RuntimeError(f'Unable to download PDF. Attempts: {attempts}')

          manifest: list[dict] = []
          for report in reports:
              destination = report['destination'] / report['filename']
              content, final_url, attempts = download_pdf(report['urls'], report['source_page'])
              destination.write_bytes(content)

              reader = PdfReader(str(destination), strict=False)
              page_count = len(reader.pages)
              if page_count < report['min_pages']:
                  raise RuntimeError(f"Unexpectedly short PDF: {destination} ({page_count} pages)")

              qpdf_result = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )

              text_file = destination.with_suffix('.first-pages.txt')
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', '2', '-layout', str(destination), str(text_file)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              first_text = text_file.read_text(encoding='utf-8', errors='ignore')
              text_file.unlink(missing_ok=True)
              normalized = re.sub(r'\s+', '', first_text)
              required_tokens = ['600838', '上海九百', report['period'][:4]]
              if report['category'] == '年度报告':
                  required_tokens.append('年度报告')
              else:
                  required_tokens.append('第一季度报告')
              missing = [token for token in required_tokens if token not in normalized]
              if missing:
                  raise RuntimeError(f"Title/content validation failed for {destination}; missing {missing}; text={normalized[:500]}")

              preview_prefix = preview_dir / destination.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '120', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_path = Path(str(preview_prefix) + '.png')
              if not preview_path.exists() or preview_path.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview render failed for {destination}')
              with Image.open(preview_path) as image:
                  width, height = image.size
                  if width < 500 or height < 500:
                      raise RuntimeError(f'Invalid preview dimensions for {destination}: {width}x{height}')

              # Rendered-page text is also checked directly with PyMuPDF to avoid accepting a blank or malformed first page.
              document = fitz.open(str(destination))
              first_page_text = document.load_page(0).get_text('text')
              document.close()
              if len(re.sub(r'\s+', '', first_page_text)) < 50:
                  raise RuntimeError(f'First page appears blank or unreadable: {destination}')

              sha256 = hashlib.sha256(content).hexdigest()
              manifest.append({
                  'order': report['order'],
                  'period': report['period'],
                  'category': report['category'],
                  'publish_date': report['publish_date'],
                  'title': report['title'],
                  'file': str(destination.relative_to(root)),
                  'pages': page_count,
                  'bytes': len(content),
                  'sha256': sha256,
                  'source_page': report['source_page'],
                  'download_url': final_url,
                  'preview_file': str(preview_path.relative_to(root)),
                  'validation': [
                      'PDF signature and minimum size',
                      'pypdf page count',
                      'qpdf structural check',
                      'first two pages title/company/year text check',
                      'first-page PNG render and dimensions check',
                      'PyMuPDF first-page text check',
                  ],
                  'download_attempts': attempts,
                  'qpdf_output': qpdf_result.stdout.strip(),
              })
              print(f"VALIDATED {report['period']} pages={page_count} bytes={len(content)} sha256={sha256}")

          notes = [
              '上海九百（600838）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-21',
              '',
              '收录范围：',
              '1. 2020、2021、2022、2023、2024、2025年度报告全文，共6份。',
              '2. 截至2026-10-21最新已披露的季度报告：2026年第一季度报告，共1份。',
              '3. 上海九百2026年第三季度报告计划于2026-10-28披露，故本包未收录尚未披露文件。',
              '4. 2026年半年度报告披露时间晚于一季报，但属于半年度报告，不按“最新季报”纳入。',
              '',
              '文件清单：',
          ]
          for item in manifest:
              notes.extend([
                  f"- {item['title']}",
                  f"  披露日期：{item['publish_date']}；页数：{item['pages']}；文件：{item['file']}",
                  f"  SHA-256：{item['sha256']}",
                  f"  来源：{item['source_page']}",
              ])
          notes.extend([
              '',
              '校验说明：所有PDF均完成文件头、页数、结构、首页标题文本和首页渲染检查；ZIP完成CRC测试。',
              '报告内容及版权归上海九百股份有限公司及原信息披露平台所有，仅供研究参考。',
          ])
          (root / '00_文件清单与说明.txt').write_text('\n'.join(notes), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['file']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path('shanghai_jiubai_600838_2020_2025_annual_latest_quarterly.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{root.name}/{path.relative_to(root)}')

          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              pdf_files = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_file is not None or len(pdf_files) != 7:
                  raise RuntimeError(f'ZIP validation failed: bad={bad_file}, pdf_count={len(pdf_files)}')

          chinese_zip = Path('上海九百_600838_2020-2025年报及最新季报.zip')
          chinese_zip.write_bytes(zip_path.read_bytes())
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print(f'FINAL_ZIP {zip_path} bytes={zip_path.stat().st_size} sha256={zip_sha}')
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-jiubai-600838-reports-final
          path: |
            shanghai_jiubai_600838_2020_2025_annual_latest_quarterly.zip
            上海九百_600838_2020-2025年报及最新季报.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
