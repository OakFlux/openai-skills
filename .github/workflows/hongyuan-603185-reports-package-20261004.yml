name: Build Hongyuan Green Energy 603185 reports ZIP 20261004

on:
  push:
    paths:
      - '.github/workflows/hongyuan-603185-reports-package-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download filings, validate and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '弘元绿能_603185_2020-2025年报及2026最新季报与半年报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          docs = [
              {
                  'filename': '01_弘元绿能_603185_2020年年度报告.pdf',
                  'title': '无锡上机数控股份有限公司2020年年度报告',
                  'category': '年度报告',
                  'period': '2020年度',
                  'announcement_date': '2021-04-22',
                  'art_code': 'AN202104211486871410',
                  'version_note': '完整年度报告；报告期公司简称为上机数控',
                  'min_pages': 100,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '02_弘元绿能_603185_2021年年度报告.pdf',
                  'title': '无锡上机数控股份有限公司2021年年度报告',
                  'category': '年度报告',
                  'period': '2021年度',
                  'announcement_date': '2022-04-28',
                  'art_code': 'AN202204271561977667',
                  'version_note': '完整年度报告；报告期公司简称为上机数控',
                  'min_pages': 100,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '03_弘元绿能_603185_2022年年度报告.pdf',
                  'title': '无锡上机数控股份有限公司2022年年度报告',
                  'category': '年度报告',
                  'period': '2022年度',
                  'announcement_date': '2023-04-27',
                  'art_code': 'AN202304261585870711',
                  'version_note': '完整年度报告；公司后续更名为弘元绿色能源股份有限公司',
                  'min_pages': 100,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '04_弘元绿能_603185_2023年年度报告.pdf',
                  'title': '弘元绿色能源股份有限公司2023年年度报告',
                  'category': '年度报告',
                  'period': '2023年度',
                  'announcement_date': '2024-04-26',
                  'art_code': 'AN202404251631315053',
                  'version_note': '完整年度报告',
                  'min_pages': 100,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '05_弘元绿能_603185_2024年年度报告.pdf',
                  'title': '弘元绿色能源股份有限公司2024年年度报告',
                  'category': '年度报告',
                  'period': '2024年度',
                  'announcement_date': '2025-04-30',
                  'art_code': 'AN202504291664592517',
                  'version_note': '完整年度报告',
                  'min_pages': 100,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '06_弘元绿能_603185_2025年年度报告.pdf',
                  'title': '弘元绿色能源股份有限公司2025年年度报告',
                  'category': '年度报告',
                  'period': '2025年度',
                  'announcement_date': '2026-04-29',
                  'art_code': 'AN202604281821686484',
                  'version_note': '完整年度报告',
                  'min_pages': 100,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '07_弘元绿能_603185_2026年第一季度报告.pdf',
                  'title': '弘元绿色能源股份有限公司2026年第一季度报告',
                  'category': '季度报告',
                  'period': '2026年第一季度',
                  'announcement_date': '2026-04-29',
                  'art_code': 'AN202604281821686483',
                  'version_note': '截至整理日最新季度报告',
                  'min_pages': 8,
                  'min_bytes': 100_000,
              },
              {
                  'filename': '08_弘元绿能_603185_2026年半年度报告.pdf',
                  'title': '弘元绿色能源股份有限公司2026年半年度报告',
                  'category': '半年度报告（补充）',
                  'period': '2026年半年度',
                  'announcement_date': '2026-08-31',
                  'art_code': 'AN202608301828734648',
                  'version_note': '作为截至整理日更近期的完整定期报告补充收录',
                  'min_pages': 60,
                  'min_bytes': 400_000,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def candidates(code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.PDF',
              ]

          def validate(path: Path, doc: dict) -> tuple[int, int]:
              size = path.stat().st_size
              if size < doc['min_bytes']:
                  raise RuntimeError(f'file too small: {size} < {doc["min_bytes"]}')
              with path.open('rb') as fh:
                  header = fh.read(8)
              if not header.startswith(b'%PDF-'):
                  raise RuntimeError(f'invalid PDF header: {header!r}')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small: {pages} < {doc["min_pages"]}')

              check = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(path)],
                  capture_output=True,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f'qpdf validation failed: {check.stderr[-2000:]}')

              render_root = path.parent / (path.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(path), str(render_root)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed: {render.stderr[-1000:]}')
              render_size = render_file.stat().st_size
              render_file.unlink(missing_ok=True)
              return pages, render_size

          def download(doc: dict, destination: Path) -> tuple[str, int, int]:
              errors: list[str] = []
              for url in candidates(doc['art_code']):
                  for attempt in range(1, 4):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 900),
                          ) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          pages, render_size = validate(temp, doc)
                          temp.replace(destination)
                          return str(response.url), pages, render_size
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {destination.name}: {errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in docs:
              destination = OUT / doc['filename']
              source_url, pages, render_size = download(doc, destination)
              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              seen_hashes.add(digest)
              record = {
                  'filename': destination.name,
                  'title': doc['title'],
                  'category': doc['category'],
                  'period': doc['period'],
                  'announcement_date': doc['announcement_date'],
                  'version_note': doc['version_note'],
                  'art_code': doc['art_code'],
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          annuals = [r for r in records if r['category'] == '年度报告']
          if len(annuals) != 6:
              raise RuntimeError(f'annual report count is unexpected: {len(annuals)}')
          if [r['period'] for r in annuals] != [f'{year}年度' for year in range(2020, 2026)]:
              raise RuntimeError(f'annual report periods are unexpected: {[r["period"] for r in annuals]}')
          if not any(r['category'] == '季度报告' for r in records):
              raise RuntimeError('quarterly report missing')

          readme = [
              '弘元绿色能源股份有限公司（603185.SH，原证券简称：上机数控）定期报告',
              '整理日期：2026-10-04',
              '',
              '收录范围：2020—2025年完整年度报告、截至整理日最新季度报告。另附更近期的2026年半年度报告。',
              '名称说明：公司原名无锡上机数控股份有限公司，2023年更名为弘元绿色能源股份有限公司。',
              '全部PDF均完成文件头、文件大小、页数、qpdf结构、首页渲染、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['title']}",
                  f"   类别：{record['category']}；报告期：{record['period']}；公告日期：{record['announcement_date']}",
                  f"   版本说明：{record['version_note']}",
                  f"   文件：{record['filename']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   来源：{record['source_url']}",
                  f"   公告代码：{record['art_code']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 8:
                  raise RuntimeError(f'expected 8 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: hongyuan-603185-final-reports-20261004
          path: 弘元绿能_603185_2020-2025年报及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
