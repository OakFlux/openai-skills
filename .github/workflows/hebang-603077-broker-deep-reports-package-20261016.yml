name: Package Hebang Biotechnology 603077 broker deep reports 20261016

on:
  push:
    paths:
      - '.github/workflows/hebang-603077-broker-deep-reports-package-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='和邦生物'
          FULL='四川和邦生物科技股份有限公司'
          CODE='603077'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'broker':'开源证券','date':'2021-12-20',
              'title':'公司首次覆盖报告：“化工+农业+光伏”齐头并进，平台型布局助力业绩高增长',
              'info_code':'AP202112201535652338','expected_pages':45,
              'filename':'01_2021-12-20_开源证券_公司首次覆盖报告_化工农业光伏齐头并进_平台型布局助力业绩高增长.pdf'
            },
            {
              'order':2,'broker':'东兴证券','date':'2019-04-04',
              'title':'深度报告：地产施工高增拉动纯碱景气，双甘膦技改、蛋氨酸新项目有望带来业绩增量',
              'info_code':'AP201904041315925018','expected_pages':24,
              'filename':'02_2019-04-04_东兴证券_深度报告_地产施工高增拉动纯碱景气_双甘膦技改与蛋氨酸项目贡献增量.pdf'
            },
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/603077.html',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
            urls=[f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf']
            last={}
            for u in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(u,timeout=(30,420),allow_redirects=True)
                  last={'requested_url':u,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                    return r.content,str(r.url),last
                except Exception as e:
                  last={'requested_url':u,'error':repr(e)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,source_url,download_meta=download_pdf(item['info_code'])
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<18:
              raise RuntimeError(f'Too few pages: {dest.name} = {pages}')
            if abs(pages-item['expected_pages'])>2:
              raise RuntimeError(f'Unexpected page count: {dest.name} actual={pages} expected={item["expected_pages"]}')

            sample=[]
            for i in list(range(min(12,pages)))+[max(0,pages-2),pages-1]:
              try: sample.append(reader.pages[i].extract_text() or '')
              except Exception: pass
            text='\n'.join(sample)
            if not any(x in text for x in [COMPANY,FULL,CODE,'四川和邦']):
              txt=dest.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(15,pages)),str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              text=txt.read_text(encoding='utf-8',errors='ignore')
              txt.unlink(missing_ok=True)
            identity_ok=any(x in text for x in [COMPANY,FULL,CODE,'四川和邦'])
            broker_ok=item['broker'] in text or item['broker'].replace('证券','') in text
            if not identity_ok:
              raise RuntimeError(f'Issuer identity check failed: {dest.name}')
            if not broker_ok:
              raise RuntimeError(f'Broker identity check failed: {dest.name}')

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0:
              raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'
            last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8_000: raise RuntimeError('first page render failed')
            if not last_png.exists() or last_png.stat().st_size<3_000: raise RuntimeError('last page render failed')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'stock_code':CODE,'stock_name':COMPANY,'broker':item['broker'],'publish_date':item['date'],
              'title':item['title'],'info_code':item['info_code'],'pages':pages,'bytes':len(data),'sha256':sha,
              'source_url':source_url,'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
              'filename':item['filename'],'identity_check':identity_ok,'broker_check':broker_ok,
              'validation':['PDF header','company identity','broker identity','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })

          if len(manifest)!=2 or len({x['sha256'] for x in manifest})!=2:
            raise RuntimeError('Report count or duplicate check failed')

          readme=[
            '和邦生物（603077.SH；四川和邦生物科技股份有限公司）券商深度报告资料包',
            '整理日期：2026-10-16','',
            '收录数量：2份，均为和邦生物公司专属、公开可完整下载的长篇券商研究报告。',
            '筛选口径：优先公司首次覆盖、公司深度和系统性研究；剔除4页左右的信息更新、业绩点评、网页摘要、缺页预览及非券商材料。',
            '公开研报数据库中符合上述口径并可完成全文核验的文件为本包两份，因此未用短篇报告或同业报告补足第三份。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   PDF来源：{m["source_url"]}',
              f'   研报页面：{m["report_page"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
            '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'和邦生物原始研报检索元数据.json').write_text(json.dumps([
            {'title':'草甘膦和光伏玻璃有所好转，矿业和蛋氨酸贡献主要利润','stockName':'和邦生物','stockCode':'603077','orgSName':'环球富盛理财','publishDate':'2025-08-21','infoCode':'AP202508211731630932','attachPages':4},
            {'title':'草甘膦价格回升，拓展蛋氨酸和矿产品等业务','stockName':'和邦生物','stockCode':'603077','orgSName':'环球富盛理财','publishDate':'2025-08-08','infoCode':'AP202508081723770423','attachPages':4},
            {'title':'公司信息更新报告：归母净利润环比+83％，拟回购2-4亿彰显发展信心','stockName':'和邦生物','stockCode':'603077','orgSName':'开源证券','publishDate':'2023-10-24','infoCode':'AP202310241602899990','attachPages':4},
            {'title':'公司信息更新报告：2023H1盈利承压，拟投资印尼联碱及草甘膦项目','stockName':'和邦生物','stockCode':'603077','orgSName':'开源证券','publishDate':'2023-08-31','infoCode':'AP202308311596906182','attachPages':4},
            {'title':'公司信息更新报告：业绩创新高，稳步推进双甘膦项目和光伏产业布局','stockName':'和邦生物','stockCode':'603077','orgSName':'开源证券','publishDate':'2023-02-23','infoCode':'AP202302231583641920','attachPages':4},
            {'title':'公司首次覆盖报告：“化工+农业+光伏”齐头并进，平台型布局助力业绩高增长','stockName':'和邦生物','stockCode':'603077','orgSName':'开源证券','publishDate':'2021-12-20','infoCode':'AP202112201535652338','attachPages':45},
            {'title':'深度报告：地产施工高增拉动纯碱景气，双甘膦技改、蛋氨酸新项目有望带来业绩增量','stockName':'和邦生物','stockCode':'603077','orgSName':'东兴证券','publishDate':'2019-04-04','infoCode':'AP201904041315925018','attachPages':24}
          ],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'和邦生物_603077_券商深度报告_2份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=2: raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hebang-603077-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
