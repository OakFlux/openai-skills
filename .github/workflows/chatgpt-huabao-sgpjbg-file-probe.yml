name: Probe exposed Huabao report file paths

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-sgpjbg-file-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Probe paths and inspect viewer scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import io, json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          reports={
            'glms':{
              'detail':'https://www.sgpjbg.com.cn/baogao/1160562.html',
              'base':'https://file.sgpjbg.com/fileroot3/2026-3/19/319ebd37-31ed-4e81-9618-5482792fc7ee/319ebd37-31ed-4e81-9618-5482792fc7ee',
              'thumb':'https://file.sgpjbg.com/fileroot3/2026-3/19/319ebd37-31ed-4e81-9618-5482792fc7ee/e6dc7eb553634ab982bb0e21c08bb59e.gif',
              'id':'1160562'
            },
            'nesc':{
              'detail':'https://www.sgpjbg.com.cn/baogao/1297618.html',
              'base':'https://file.sgpjbg.com/fileroot3/2026-8/20/7e29524e-6e59-4b50-9586-1871d0b10b0f/7e29524e-6e59-4b50-9586-1871d0b10b0f',
              'thumb':'https://file.sgpjbg.com/fileroot3/2026-8/20/7e29524e-6e59-4b50-9586-1871d0b10b0f/bd30c890e3814e2f9d49666dbf43bba6.gif',
              'id':'1297618'
            }
          }
          scripts=[
            'https://cache.sgpjbg.com.cn/master/view/view2.js',
            'https://cache.sgpjbg.com.cn/Master/view/view-mini-fz.js',
            'https://cache.sgpjbg.com.cn/css/view/encoder.js',
            'https://cache.sgpjbg.com.cn/master/view/view-mini.js',
          ]
          script_results=[]
          for i,u in enumerate(scripts):
            try:
              r=s.get(u,timeout=(10,60)); print('SCRIPT',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path(f'out/script_{i}.txt').write_bytes(r.content)
              script_results.append({'url':u,'status':r.status_code,'bytes':len(r.content),'ctype':r.headers.get('content-type')})
              txt=r.text
              for term in ['_Addpage','NewsFile','GetPage','pageurl','mhi','fileroot','GetBook','DownLoad','NewsFilePath']:
                positions=[m.start() for m in re.finditer(term,txt,re.I)][:20]
                for pos in positions:
                  print('SNIP',i,term,txt[max(0,pos-500):pos+1500].replace('\n',' ')[:2500],flush=True)
            except Exception as e:
              print('SCRIPT_FAIL',i,repr(e),flush=True); script_results.append({'url':u,'error':repr(e)})

          probes=[]
          suffixes=['','.pdf','.PDF','.doc','.docx','.zip','.rar','/','?download=1','?attname=1','?response-content-type=application/pdf']
          for name,rep in reports.items():
            for ref in [rep['detail'],'https://www.sgpjbg.com.cn/']:
              for candidate in [rep['base']+x for x in suffixes]+[rep['thumb']]:
                try:
                  r=s.get(candidate,headers={'Referer':ref,'Accept':'*/*'},timeout=(10,90),allow_redirects=True,stream=False)
                  data=r.content
                  ctype=r.headers.get('content-type')
                  disp=r.headers.get('content-disposition')
                  sig=data[:16]
                  pages=None
                  if b'%PDF' in data[:4096]:
                    try: pages=len(PdfReader(io.BytesIO(data),strict=False).pages)
                    except Exception as e: pages='ERR:'+repr(e)
                  rec={'name':name,'referer':ref,'candidate':candidate,'status':r.status_code,'final':r.url,'bytes':len(data),'ctype':ctype,'disposition':disp,'sig_hex':sig.hex(),'pages':pages}
                  probes.append(rec)
                  print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
                  # save any large binary/PDF response
                  if len(data)>50000 and ('pdf' in (ctype or '').lower() or b'%PDF' in data[:4096]):
                    Path(f'out/{name}_{len(probes)}.pdf').write_bytes(data)
                except Exception as e:
                  rec={'name':name,'referer':ref,'candidate':candidate,'error':repr(e)}; probes.append(rec)
                  print('PROBE_FAIL',json.dumps(rec,ensure_ascii=False),flush=True)
          Path('out/probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/scripts.json').write_text(json.dumps(script_results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-sgpjbg-file-probe
          path: out/
          retention-days: 3
          if-no-files-found: error
