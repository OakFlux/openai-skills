name: Inspect Yongtai 002326 nxny report pages 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-nxny-report-inspect-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch and inspect nxny report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          ids=['5082611','4704283','4682955','4205536']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Referer':'https://www.nxny.com/stock/stock_002326/'})
          out=[]
          for rid in ids:
            urls=[f'https://www.nxny.com/report/view_{rid}.html',f'http://www.nxny.com/report/view_{rid}.html']
            meta=None
            for url in urls:
              try:
                r=s.get(url,timeout=(20,90),allow_redirects=True)
                raw=r.content
                enc=r.encoding or r.apparent_encoding or 'utf-8'
                for candidate in [enc,'gb18030','utf-8']:
                  try:
                    text=raw.decode(candidate,errors='replace')
                    if '<html' in text.lower(): break
                  except Exception: pass
                p=Path(f'nxny_{rid}.html'); p.write_text(text,encoding='utf-8')
                soup=BeautifulSoup(text,'lxml')
                visible='\n'.join(x.strip() for x in soup.get_text('\n').splitlines() if x.strip())
                links=[]
                for a in soup.find_all('a',href=True):
                  links.append({'text':' '.join(a.get_text(' ',strip=True).split()),'href':urljoin(r.url,a['href'])})
                forms=[]
                for f in soup.find_all('form'):
                  forms.append({'action':urljoin(r.url,f.get('action','')),'method':f.get('method'),'html':str(f)[:3000]})
                scripts=[]
                for sc in soup.find_all('script'):
                  src=urljoin(r.url,sc.get('src')) if sc.get('src') else None
                  body=sc.get_text('\n',strip=True)
                  if src or any(k in body.lower() for k in ['download','pdf','report','down','ajax']): scripts.append({'src':src,'body':body[:10000]})
                urls_in_html=sorted(set(re.findall(r'https?://[^\s\"\'<>]+',text)))
                filtered_links=[x for x in links if any(k in (x['href']+' '+x['text']).lower() for k in ['pdf','down','download','file','report','下载','查看'])]
                meta={'rid':rid,'input':url,'status':r.status_code,'final':r.url,'ctype':r.headers.get('content-type'),'bytes':len(raw),'title':soup.title.get_text(' ',strip=True) if soup.title else None,'visible_head':visible[:7000],'filtered_links':filtered_links[:300],'all_links':links[:500],'forms':forms,'scripts':scripts,'url_strings':[u for u in urls_in_html if any(k in u.lower() for k in ['pdf','down','file','report'])][:300]}
                print('\nRID',rid,'INPUT',url,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(raw),'TITLE',meta['title'])
                print(visible[:3500])
                print('FILTERED_LINKS',json.dumps(filtered_links[:100],ensure_ascii=False))
                print('FORMS',json.dumps(forms,ensure_ascii=False))
                print('SCRIPTS',json.dumps(scripts,ensure_ascii=False)[:15000])
                print('URL_STRINGS',json.dumps(meta['url_strings'],ensure_ascii=False))
                break
              except Exception as e:
                print('ERR',rid,url,repr(e))
            out.append(meta)
          Path('yongtai_nxny_inspection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-nxny-report-inspection
          path: |
            yongtai_nxny_inspection.json
            nxny_*.html
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
