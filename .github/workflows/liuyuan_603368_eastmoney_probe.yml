name: probe-liuyuan-603368-eastmoney

on:
  push:
    branches:
      - tmp/liuyuan-603368-eastmoney-probe-20261104

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/603368.html'})
          url='https://reportapi.eastmoney.com/report/list'
          params={
            'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
            'beginTime':'2023-01-01','endTime':'2026-11-04','pageNo':'1','fields':'','qType':'0',
            'orgCode':'','code':'603368','rcode':'','cb':'callback123'
          }
          r=s.get(url,params=params,timeout=(30,120))
          print('STATUS',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          print('HEAD',r.text[:500])
          r.raise_for_status()
          m=re.search(r'^[^(]*\((.*)\)\s*;?\s*$',r.text,re.S)
          data=json.loads(m.group(1) if m else r.text)
          print('HITS',data.get('hits'),'SIZE',data.get('size'))
          for rec in data.get('data') or []:
            print('REC',json.dumps(rec,ensure_ascii=False,sort_keys=True))
          PY
