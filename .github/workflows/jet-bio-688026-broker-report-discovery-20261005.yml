name: Discover JET BIO 688026 broker reports 20261005

on:
  push:
    paths:
      - '.github/workflows/jet-bio-688026-broker-report-discovery-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Query public research report indexes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          from typing import Any
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          # Eastmoney direct company-report list.
          em_params={
            'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
            'beginTime':'2018-01-01','endTime':'2030-12-31','pageNo':'1','fields':'','qType':'0',
            'orgCode':'','code':'688026','rcode':'','p':'1','pageNum':'1','pageNumber':'1'
          }
          em={}
          try:
            r=s.get('https://reportapi.eastmoney.com/report/list',params=em_params,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=(20,90))
            em={'status':r.status_code,'url':r.url,'text':r.text[:1000000]}
            try: em['json']=r.json()
            except Exception: pass
          except Exception as e:
            em={'error':repr(e)}
          Path('out/eastmoney.json').write_text(json.dumps(em,ensure_ascii=False,indent=2),encoding='utf-8')

          # Public report index title and full-text search.
          s.headers.update({'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          def post(url:str,payload:dict[str,Any]):
            last=None
            for n in range(7):
              try:
                rr=s.post(url,json=payload,timeout=(20,120))
                last={'status':rr.status_code,'text':rr.text[:400]}
                if rr.status_code==200: return rr.json()
              except Exception as e: last={'error':repr(e)}
              time.sleep(1+n)
            raise RuntimeError((url,last))
          def records(obj:Any):
            out=[]
            def walk(x):
              if isinstance(x,dict):
                if isinstance(x.get('id'),int) and isinstance(x.get('name'),str): out.append(x)
                for v in x.values(): walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            walk(obj)
            return list({int(x['id']):x for x in out}.values())

          queries=['洁特生物','688026','广州洁特生物','洁特生物 深度报告','洁特生物 首次覆盖','生命科学耗材 洁特生物','细胞培养耗材 洁特生物']
          raw={}; allrec={}
          for only_title in (1,0):
            for q in queries:
              payload={'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
              key=f'{only_title}:{q}'
              try:
                data=post('https://api.sdyanbao.com/api/file/search',payload)
                raw[key]=data
                for rec in records(data): allrec[int(rec['id'])]=rec
              except Exception as e: raw[key]={'error':repr(e)}
              time.sleep(.08)
          details=[]
          for rid,rec in sorted(allrec.items(),reverse=True):
            typ=rec.get('type'); typname=typ.get('name') if isinstance(typ,dict) else typ
            name=str(rec.get('name') or '')
            if typname in ('财报','招股书'):
              continue
            # Keep likely company/industry reports from 2019 onward and cap detail calls.
            if not any(t in (name + json.dumps(rec,ensure_ascii=False)) for t in ['洁特生物','688026','生命科学耗材','细胞培养耗材']):
              continue
            try:
              resp=post('https://api.sdyanbao.com/api/file/detail',{'id':rid})
              data=resp.get('data') if isinstance(resp,dict) else None
              if not isinstance(data,dict): data={}
              details.append({'record':rec,'detail':data})
            except Exception as e:
              details.append({'record':rec,'detail':{},'error':repr(e)})
            if len(details)>=120: break
            time.sleep(.05)
          Path('out/sdy_raw.json').write_text(json.dumps(raw,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/sdy_details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')

          # Sina historical report list.
          sina=[]
          for symbol in ('sh688026','688026'):
            for p in range(1,8):
              url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol={symbol}&t1=all&p={p}'
              try:
                rr=s.get(url,headers={'Referer':'https://finance.sina.com.cn/'},timeout=(20,90))
                text=rr.content.decode('gb18030','replace')
                soup=BeautifulSoup(text,'lxml')
                links=[]
                for a in soup.find_all('a',href=True):
                  href=a.get('href') or ''
                  label=' '.join(a.get_text(' ',strip=True).split())
                  if 'vReport_Show' in href or 'rptid' in href:
                    links.append({'label':label,'href':href})
                sina.append({'symbol':symbol,'page':p,'status':rr.status_code,'url':rr.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links})
              except Exception as e:
                sina.append({'symbol':symbol,'page':p,'url':url,'error':repr(e)})
              time.sleep(.06)
          Path('out/sina.json').write_text(json.dumps(sina,ensure_ascii=False,indent=2),encoding='utf-8')

          print('=== EASTMONEY ===')
          j=em.get('json') if isinstance(em,dict) else None
          if isinstance(j,dict):
            rows=j.get('data') or []
            print('hits',j.get('hits'),'rows',len(rows) if isinstance(rows,list) else type(rows).__name__)
            if isinstance(rows,list):
              for row in rows: print(json.dumps(row,ensure_ascii=False))
          else: print((em.get('text') or '')[:5000])

          print('\n=== SDYANBAO DETAILS ===')
          summary=[]
          for x in details:
            r=x.get('record') or {}; d=x.get('detail') or {}; typ=r.get('type'); typname=typ.get('name') if isinstance(typ,dict) else typ
            item={'id':r.get('id'),'name':r.get('name'),'time_text':r.get('time_text'),'record_type':typname,'record_page_count':r.get('page_count'),'detail_name':d.get('name'),'detail_page_count':d.get('page_count'),'page_url':d.get('page_url'),'file_size':d.get('file_size'),'data_source':d.get('data_source'),'original_id':d.get('original_id'),'error':x.get('error')}
            summary.append(item)
          summary.sort(key=lambda x:(str(x.get('time_text') or ''),int(x.get('id') or 0)),reverse=True)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')

          print('\n=== SINA ===')
          uniq={}
          for page in sina:
            for link in page.get('links',[]): uniq[link['href']]=link
          for link in uniq.values(): print(link['label'],link['href'])
          print('unique links',len(uniq))
          PY

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: jet-bio-688026-broker-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
