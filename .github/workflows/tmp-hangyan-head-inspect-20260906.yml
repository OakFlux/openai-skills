name: Inspect Hangyan page head
on:
  push:
    branches: [tmp-hangyan-head-inspect-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print head and app body
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests
          page='https://www.hangyan.co/reports/3399260180989347557'
          r=requests.get(page,headers={'User-Agent':'Mozilla/5.0'},timeout=60)
          print('PAGE_HEAD')
          print(r.text[:9000])
          app='https://cdn.hangyan.co/assets/application-ec845e69.js'
          a=requests.get(app,headers={'User-Agent':'Mozilla/5.0','Referer':page},timeout=60)
          print('\nAPP_STATUS',a.status_code,a.headers.get('content-type'),len(a.content),a.url)
          print(a.text[:12000])
          PY
