name: chatgpt-temp-haixi-fast-package
on:
  push:
    branches:
      - chatgpt-temp-haixi-pharma-reports-20260914
    paths:
      - .github/workflows/chatgpt-temp-haixi-fast-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and package public report pages
        shell: bash
        run: |
          python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
          python <<'PY'
          import hashlib, io, json, re, time, zipfile
          from pathlib import Path
          import requests, img2pdf, pymupdf
          from PIL import Image, ImageStat
          from pypdf import PdfReader

          W=Path('haixi_fast_work'); ROOT=W/'海西新药_02637_券商深度报告'; PDF=ROOT/'PDF'; RAW=W/'raw'; QA=W/'qa'
          for d in (PDF,RAW,QA): d.mkdir(parents=True,exist_ok=True)
          reports=[
            {'institution':'国投证券','date':'2026-09-08','title':'口服小分子眼药有望破局眼底病治疗，仿创协同开启价值重估','rating':'买入-A（首次）','id':'5683790','bases':['https://public.fxbaogao.com/report-image/2026/09/08/5683790-{page}.png','https://public.fxbaogao.com/report-image/2026/09/09/5683790-{page}.png','https://public.fxbaogao.com/report-image/2026/09/07/5683790-{page}.png']},
            {'institution':'国泰海通证券','date':'2026-07-02','title':'仿创双轨推进，HXP056有望重塑眼底病用药格局','rating':'增持（首次）','id':'5505534','bases':['https://public.fxbaogao.com/report-image/2026/07/02/5505534-{page}.png','https://public.fxbaogao.com/report-image/2026/07/03/5505534-{page}.png','https://public.fxbaogao.com/report-image/2026/07/01/5505534-{page}.png']},
            {'institution':'兴证国际','date':'2026-07-15','title':'HXP056全球研发即将启动，营收利润稳健增长','rating':'无评级','id':'5535712','bases':['https://public.fxbaogao.com/report-image/2026/07/15/5535712-{page}.png']},
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept':'image/*,*/*;q=0.8','Referer':'https://www.fxbaogao.com/'})
          logs=[]; manifest=[]
          def L(x): x=str(x); print(x,flush=True); logs.append(x)
          def safe(x): return re.sub(r'[\\/:*?"<>|\s]+','_',x).strip('_')[:120]
          def get_image(url):
            try:
              r=s.get(url,timeout=20,allow_redirects=True)
              L(f'GET {r.status_code} {len(r.content)} {url}')
              if r.status_code==200 and len(r.content)>12000:
                im=Image.open(io.BytesIO(r.content)); im.load()
                if im.width>=650 and im.height>=800: return r.content,r.url,im.size
            except Exception as e: L(f'ERR {url} {e!r}')
            return None
          for ri,rep in enumerate(reports,1):
            template=None
            for cand in rep['bases']:
              if get_image(cand.format(page=1)):
                template=cand; break
            if not template:
              L('SKIP no first page '+rep['title']); continue
            rdir=RAW/rep['id']; rdir.mkdir(exist_ok=True)
            jpgs=[]; srcs=[]; hashes=[]; dims=[]
            for p in range(1,31):
              got=get_image(template.format(page=p))
              if not got: break
              data,url,size=got; h=hashlib.sha256(data).hexdigest()
              if h in hashes: raise RuntimeError('duplicate page '+rep['title'])
              hashes.append(h); raw=rdir/f'{p:02d}.png'; raw.write_bytes(data)
              im=Image.open(raw).convert('RGB'); jpg=rdir/f'{p:02d}.jpg'; im.save(jpg,'JPEG',quality=93)
              jpgs.append(jpg); srcs.append(url); dims.append({'page':p,'width':size[0],'height':size[1]})
            if not jpgs: continue
            label=f'公开展示{len(jpgs)}页'
            fn=f"{rep['date']}_{safe(rep['institution'])}_海西新药_{safe(rep['title'])}_{label}.pdf"
            path=PDF/fn; path.write_bytes(img2pdf.convert([str(x) for x in jpgs],layout_fun=img2pdf.get_fixed_dpi_layout_fun((150,150))))
            pages=len(PdfReader(str(path),strict=False).pages)
            if pages!=len(jpgs): raise RuntimeError('page mismatch')
            doc=pymupdf.open(str(path)); checks=[]
            for pn,tag in [(0,'first'),(pages//2,'middle'),(pages-1,'last')]:
              pix=doc[pn].get_pixmap(matrix=pymupdf.Matrix(2.2,2.2),alpha=False); out=QA/f'{ri}_{tag}.png'; pix.save(str(out))
              sd=ImageStat.Stat(Image.open(out).convert('L').resize((64,64))).stddev[0]
              if sd<1: raise RuntimeError('blank render')
              checks.append({'page':pn+1,'stddev':round(sd,3)})
            doc.close(); data=path.read_bytes()
            rec={'institution':rep['institution'],'date':rep['date'],'title':rep['title'],'rating':rep['rating'],'pages':pages,'status':label,'filename':'PDF/'+fn,'source_template':template,'source_pages':srcs,'sha256':hashlib.sha256(data).hexdigest(),'size_bytes':len(data),'dimensions':dims,'render_checks':checks}
            manifest.append(rec); L('VALID '+json.dumps(rec,ensure_ascii=False))
          # Fallback with a complete 14-page topic report centered on Haixi if fewer than two company reports are accessible.
          if len(manifest)<2:
            rep={'institution':'国联民生证券','date':'2026-05-29','title':'眼科口服VEGF值得关注，海西新药进度靠前','rating':'行业专题','base':'https://oss.sdyanbao.com/page/2026/5/29/1338049/{page}.png'}
            rdir=RAW/'971850'; rdir.mkdir(exist_ok=True); jpgs=[];srcs=[];hashes=[];dims=[]
            for i in range(14):
              got=get_image(rep['base'].format(page=i))
              if not got: raise RuntimeError('fallback page missing')
              data,url,size=got; h=hashlib.sha256(data).hexdigest(); hashes.append(h); raw=rdir/f'{i+1:02d}.png'; raw.write_bytes(data); im=Image.open(raw).convert('RGB'); jpg=rdir/f'{i+1:02d}.jpg'; im.save(jpg,'JPEG',quality=93); jpgs.append(jpg);srcs.append(url);dims.append({'page':i+1,'width':size[0],'height':size[1]})
            fn='2026-05-29_国联民生证券_海西新药_眼科口服VEGF值得关注海西新药进度靠前_完整14页.pdf'; path=PDF/fn; path.write_bytes(img2pdf.convert([str(x) for x in jpgs],layout_fun=img2pdf.get_fixed_dpi_layout_fun((150,150)))); pages=len(PdfReader(str(path)).pages); doc=pymupdf.open(str(path)); checks=[]
            for pn,tag in [(0,'first'),(7,'middle'),(13,'last')]:
              pix=doc[pn].get_pixmap(matrix=pymupdf.Matrix(2.2,2.2),alpha=False);out=QA/f'fallback_{tag}.png';pix.save(str(out));sd=ImageStat.Stat(Image.open(out).convert('L').resize((64,64))).stddev[0];checks.append({'page':pn+1,'stddev':round(sd,3)})
            doc.close();data=path.read_bytes();manifest.append({'institution':rep['institution'],'date':rep['date'],'title':rep['title'],'rating':rep['rating'],'pages':pages,'status':'完整公开专题报告','filename':'PDF/'+fn,'source_pages':srcs,'sha256':hashlib.sha256(data).hexdigest(),'size_bytes':len(data),'dimensions':dims,'render_checks':checks})
          if len(manifest)<2: raise RuntimeError('fewer than two reports')
          readme=['# 海西新药（02637.HK）券商研究报告资料包','','核对日期：2026-09-14','','文件状态均按公开渠道实际可取得页数标注，未将展示页标为券商原始完整版。','']
          for i,x in enumerate(manifest,1): readme.append(f"{i}. {x['institution']}｜{x['date']}｜{x['title']}｜{x['pages']}页｜{x['status']}")
          (ROOT/'README.md').write_text('\n'.join(readme)+'\n',encoding='utf-8');(ROOT/'manifest.json').write_text(json.dumps({'company':'福建海西新药创制股份有限公司','stock_code':'02637.HK','files':manifest},ensure_ascii=False,indent=2),encoding='utf-8');(ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['filename']}" for x in manifest)+'\n',encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          z=W/'海西新药_02637_券商深度报告_公开资料.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zz:
            for p in ROOT.rglob('*'):
              if p.is_file(): zz.write(p,arcname=str(ROOT.name/p.relative_to(ROOT)))
          with zipfile.ZipFile(z) as zz:
            if zz.testzip(): raise RuntimeError('zip crc')
          meta={'filename':z.name,'size_bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'pdf_count':len(manifest),'reports':manifest};(W/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8');print('FINAL '+json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Haixi-Pharma-Fast-Package
          path: |
            haixi_fast_work/海西新药_02637_券商深度报告_公开资料.zip
            haixi_fast_work/metadata.json
            haixi_fast_work/run.log
            haixi_fast_work/qa
          retention-days: 1
          compression-level: 0
