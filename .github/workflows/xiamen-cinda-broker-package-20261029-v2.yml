name: Package Xiamen Cinda broker research materials

on:
  push:
    branches:
      - tmp/xiamen-cinda-broker-reports-20261029-v1
    paths:
      - .github/workflows/xiamen-cinda-broker-package-20261029-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          python -m pip install --quiet requests pypdf reportlab

      - name: Build validate and package materials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import BaseDocTemplate, Frame, PageTemplate, Paragraph, Spacer, Table, TableStyle

          CODE = "000701"
          SHORT = "厦门信达"
          FULL = "厦门信达股份有限公司"
          PREPARED = "2026-10-29"
          ROOT_NAME = "厦门信达_000701_券商深度研究资料_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          body_font = "/usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf"
          title_font = "/usr/share/fonts/truetype/arphic-gkai00mp/gkai00mp.ttf"
          pdfmetrics.registerFont(TTFont("CJKBody", body_font))
          pdfmetrics.registerFont(TTFont("CJKTitle", title_font))

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer": "https://data.eastmoney.com/report/000701.html",
              "Accept": "application/pdf,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          original_spec = {
              "date": "2015-09-18",
              "broker": "平安证券",
              "analyst": "缴文超、陈雯；研究助理：罗晓娟",
              "rating": "推荐（首次）",
              "title": "定增助力电子信息业务，转型试水供应链金融",
              "info_code": "AP201509180010830659",
              "url": "https://pdf.dfcfw.com/pdf/H3_AP201509180010830659_1.pdf",
              "document_form": "券商原始PDF",
          }

          data = None
          used_url = None
          attempts = []
          for url in [
              original_spec["url"],
              original_spec["url"].replace("/H3_", "/H2_"),
              original_spec["url"].replace("/H3_", "/H1_"),
          ]:
              for attempt in range(5):
                  try:
                      r = session.get(url, timeout=(30, 420), allow_redirects=True)
                      rec = {
                          "url": url,
                          "status": r.status_code,
                          "bytes": len(r.content),
                          "content_type": r.headers.get("content-type", ""),
                          "magic": r.content[:8].hex(),
                          "final_url": r.url,
                      }
                      attempts.append(rec)
                      print("PDF_REQUEST", json.dumps(rec, ensure_ascii=False))
                      if r.status_code == 200 and r.content.startswith(b"%PDF-") and len(r.content) > 50_000:
                          data = r.content
                          used_url = r.url
                          break
                  except Exception as exc:
                      attempts.append({"url": url, "error": repr(exc)})
                  time.sleep(1 + attempt)
              if data is not None:
                  break
          if data is None:
              raise RuntimeError(f"Original PDF download failed: {attempts}")

          original_name = "01_20150918_平安证券_定增助力电子信息业务转型试水供应链金融_原始PDF.pdf"
          original_path = PDF_DIR / original_name
          original_path.write_bytes(data)
          reader = PdfReader(str(original_path), strict=False)
          original_pages = len(reader.pages)
          if original_pages != 18:
              raise RuntimeError(f"Unexpected original PDF page count: {original_pages}")
          original_text = ""
          for page in reader.pages[:12]:
              try:
                  original_text += "\n" + (page.extract_text() or "")
              except Exception:
                  pass
          if not any(token in original_text for token in [SHORT, FULL, CODE]):
              raise RuntimeError("Original PDF issuer validation failed")
          q = subprocess.run(["qpdf", "--warning-exit-0", "--check", str(original_path)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          if q.returncode != 0:
              raise RuntimeError(q.stdout)

          styles = getSampleStyleSheet()
          title_style = ParagraphStyle("TitleCJK", parent=styles["Title"], fontName="CJKTitle", fontSize=20, leading=29, alignment=TA_LEFT, textColor=colors.HexColor("#1f2937"), spaceAfter=13)
          subtitle_style = ParagraphStyle("SubtitleCJK", parent=styles["Heading2"], fontName="CJKTitle", fontSize=13, leading=20, textColor=colors.HexColor("#374151"), spaceAfter=7)
          body_style = ParagraphStyle("BodyCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=10.5, leading=18, textColor=colors.HexColor("#222222"), spaceAfter=9)
          small_style = ParagraphStyle("SmallCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=8.5, leading=14, textColor=colors.HexColor("#555555"), spaceAfter=5)
          warning_style = ParagraphStyle("WarningCJK", parent=styles["BodyText"], fontName="CJKBody", fontSize=10.5, leading=18, textColor=colors.HexColor("#9b1c1c"), backColor=colors.HexColor("#fff4f4"), borderColor=colors.HexColor("#d99a9a"), borderWidth=0.8, borderPadding=8, spaceAfter=13)

          def footer(canvas, doc):
              canvas.saveState()
              canvas.setFont("CJKBody", 8)
              canvas.setFillColor(colors.HexColor("#777777"))
              canvas.drawCentredString(A4[0] / 2, 11 * mm, f"{SHORT}（{CODE}.SZ）公开资料索引版 | 第 {doc.page} 页")
              canvas.restoreState()

          def build_index_pdf(spec: dict, path: Path) -> None:
              doc = BaseDocTemplate(str(path), pagesize=A4, leftMargin=20*mm, rightMargin=20*mm, topMargin=19*mm, bottomMargin=20*mm, title=spec["title"], author="OpenAI")
              frame = Frame(doc.leftMargin, doc.bottomMargin, doc.width, doc.height, id="normal")
              doc.addPageTemplates([PageTemplate(id="all", frames=[frame], onPage=footer)])
              meta = [
                  ["公司", f"{FULL}（{CODE}.SZ）"],
                  ["券商", spec["broker"]],
                  ["研究员", spec["analyst"]],
                  ["发布日期", spec["date"]],
                  ["评级", spec["rating"]],
                  ["文件性质", "公开资料索引版（非券商原始PDF）"],
              ]
              table = Table(meta, colWidths=[29*mm, 121*mm])
              table.setStyle(TableStyle([
                  ("FONTNAME", (0,0), (-1,-1), "CJKBody"),
                  ("FONTSIZE", (0,0), (-1,-1), 10),
                  ("LEADING", (0,0), (-1,-1), 16),
                  ("BACKGROUND", (0,0), (0,-1), colors.HexColor("#f3f4f6")),
                  ("GRID", (0,0), (-1,-1), 0.5, colors.HexColor("#d1d5db")),
                  ("VALIGN", (0,0), (-1,-1), "TOP"),
                  ("LEFTPADDING", (0,0), (-1,-1), 7),
                  ("RIGHTPADDING", (0,0), (-1,-1), 7),
                  ("TOPPADDING", (0,0), (-1,-1), 6),
                  ("BOTTOMPADDING", (0,0), (-1,-1), 6),
              ]))
              story = [
                  Paragraph("公开资料索引版 · 非券商原始PDF", warning_style),
                  Paragraph(html.escape(spec["title"]), title_style),
                  table,
                  Spacer(1, 8*mm),
                  Paragraph("核心观点概述", subtitle_style),
                  Paragraph(html.escape(spec["summary"]), body_style),
                  Paragraph("文件说明", subtitle_style),
                  Paragraph("公开页面能够确认该报告的标题、券商、发布日期和主要观点，但未提供可直接公开下载的券商原始PDF。慧博详情页要求客户端或账户访问，九方智投页面仅展示公开正文。为避免绕过权限，本文件只提供元数据、概述及来源索引，不复制原报告全文、图表或版式。", body_style),
                  Paragraph("公开来源", subtitle_style),
                  Paragraph(html.escape(spec["source_1"]), small_style),
                  Paragraph(html.escape(spec["source_2"]), small_style),
                  Paragraph(f"整理日期：{PREPARED}。报告版权归原券商及作者所有，仅供资料检索，不构成投资建议。", small_style),
              ]
              doc.build(story)

          index_specs = [
              {
                  "date": "2016-05-27",
                  "broker": "安信证券",
                  "analyst": "赵湘怀",
                  "rating": "买入-A",
                  "title": "布局供应链金融，产融结合迎春天",
                  "summary": "报告围绕厦门信达的供应链金融转型展开，重点讨论大宗商品电商平台、深圳迈科金融服务、融资租赁业务以及厦门国资背景带来的协同机会。报告预计金融业务将成为新的盈利来源，并给出买入评级与目标价判断。",
                  "source_1": "九方智投公开页面：https://www.9fzt.com/detail/sz_000701_10_517654982641.html",
                  "source_2": "发现报告元数据页：https://www.fxbaogao.com/detail/72772",
                  "filename": "02_20160527_安信证券_布局供应链金融产融结合迎春天_公开索引版_非原始PDF.pdf",
              },
              {
                  "date": "2016-03-31",
                  "broker": "招商证券",
                  "analyst": "公开页面未标注",
                  "rating": "强烈推荐-A（首次覆盖）",
                  "title": "与迈科金属深度合作，大力扩张类金融业务",
                  "summary": "报告聚焦公司与迈科金属的合作、大商道商品交易平台以及票据和类金融服务的扩张空间。报告认为交易平台与金融服务业务可能形成协同，推动利润增长，并在首次覆盖时给予强烈推荐评级。",
                  "source_1": "九方智投公开页面：https://www.9fzt.com/detail/sz_000701_10_512745297219.html",
                  "source_2": "慧博归档索引：https://www.hibor.com.cn/archiver_houtai/201603.html",
                  "filename": "03_20160331_招商证券_与迈科金属深度合作大力扩张类金融业务_公开索引版_非原始PDF.pdf",
              },
          ]

          index_manifest = []
          for spec in index_specs:
              path = PDF_DIR / spec["filename"]
              build_index_pdf(spec, path)
              r = PdfReader(str(path), strict=False)
              pages = len(r.pages)
              text = "\n".join((p.extract_text() or "") for p in r.pages)
              for token in [SHORT, CODE, spec["broker"], "非券商原始PDF"]:
                  if token not in text:
                      raise RuntimeError(f"Index PDF validation failed {path.name}: {token}")
              q = subprocess.run(["qpdf", "--warning-exit-0", "--check", str(path)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if q.returncode != 0:
                  raise RuntimeError(q.stdout)
              index_manifest.append({
                  **spec,
                  "document_form": "公开资料索引版（非券商原始PDF）",
                  "actual_pages": pages,
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          manifest = [{
              **original_spec,
              "filename": original_name,
              "actual_pages": original_pages,
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "pdf_url": used_url,
              "detail_url": "https://data.eastmoney.com/report/info/AP201509180010830659.html",
              "download_attempts": attempts,
          }] + index_manifest

          # Render and validate the first page of all files.
          for item in manifest:
              path = PDF_DIR / item["filename"]
              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed {path.name}: {render.stdout}")
              item["preview_file"] = str(Path("首页预览") / preview.name)

          readme = [
              f"厦门信达（{CODE}.SZ）券商深度研究资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包共收录3份资料：1份券商原始PDF，2份公开资料索引版。",
              "两份2016年报告的公开页面未提供可直接下载的原始PDF；本包未绕过客户端、账户、会员或付费限制，也未使用网页正文重排冒充券商原件。",
              "",
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   券商：{item['broker']}；研究员：{item['analyst']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   文件性质：{item['document_form']}；评级：{item['rating']}；页数：{item['actual_pages']}；大小：{item['bytes']}字节",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：PDF文件头、公司名称/证券代码、页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")
          (ROOT / "manifest.json").write_text(json.dumps({"company": SHORT, "full_company_name": FULL, "stock_code": CODE, "prepared_on": PREPARED, "report_count": len(manifest), "original_pdf_count": 1, "index_pdf_count": 2, "files": manifest}, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as f:
              w = csv.writer(f)
              w.writerow(["文件名", "文件性质", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256"])
              for x in manifest:
                  w.writerow([x["filename"], x["document_form"], x["broker"], x["analyst"], x["date"], x["title"], x["rating"], x["actual_pages"], x["bytes"], x["sha256"]])
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(f"{x['sha256']}  PDF文件/{x['filename']}" for x in manifest) + "\n", encoding="utf-8")

          zip_path = Path("xiamen_cinda_000701_broker_research_materials_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      z.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as z:
              bad = z.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": 1,
              "index_pdf_count": 2,
              "files": [{k: x.get(k) for k in ["filename", "document_form", "broker", "analyst", "date", "title", "rating", "actual_pages", "bytes", "sha256"]} for x in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xiamen-cinda-000701-broker-research-materials-3-20261029
          path: |
            xiamen_cinda_000701_broker_research_materials_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
