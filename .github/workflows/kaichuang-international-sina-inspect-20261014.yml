name: Inspect public Sina research pages for Kaichuang International
on:
  push:
    paths:
      - '.github/workflows/kaichuang-international-sina-inspect-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch public research pages
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import requests
          ids = ['519227929981','461956648318','430756307540','419673534621','416325881525']
          s = requests.Session()
          s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})
          for rid in ids:
              url = 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/' + rid + '/index.phtml'
              r = s.get(url, timeout=60)
              print('REPORT', rid, r.status_code, r.url, r.headers.get('content-type'), len(r.content), flush=True)
              text = r.content.decode('gb18030', errors='replace')
              print(text[:50000], flush=True)
          PY
