name: Inspect official broker research portals for Ledong Robotics

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Inspect official portals and public report data
        shell: bash
        run: |
          cat > /tmp/official.py <<'PY'
          from __future__ import annotations
          import io, json, re, time, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path('official_output'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          pages=[
              ('sdic_research','https://www.sdicsi.com.hk/zh/research-report'),
              ('sdic_company','https://www.sdicsi.com.hk/zh/research-report/company-report'),
              ('xyzq_home','https://www.xyzq.com.hk/'),
              ('bocom_research','https://research.bocomgroup.com/'),
          ]
          patterns=[
              r'https?://[^\"\'<>\\\s]+',
              r'[^\"\'<>\\\s]{0,260}(?:乐动机器人|樂動機器人|1236|01236|研究报告|research-report|company-report|loadMore|pagination|pageSize|currentPage|api/|pdf|download|attachment|fileUrl|file_path|upload)[^\"\'<>\\\s]{0,900}',
          ]
          script_urls=[]
          for name,url in pages:
              try:
                  r=s.get(url,timeout=90,allow_redirects=True)
                  print('\nPAGE',name,r.status_code,r.url,r.headers.get('content-type'),len(r.content))
                  print(r.text[:2500])
                  (OUT/f'{name}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'html.parser')
                  print('TITLE',name,soup.title.get_text(' ',strip=True) if soup.title else '')
                  for a in soup.find_all('a',href=True):
                      href=urllib.parse.urljoin(r.url,a['href'])
                      label=' '.join(a.get_text(' ',strip=True).split())
                      blob=(label+' '+href).lower()
                      if any(k in blob for k in ('乐动机器人','樂動機器人','1236','01236','pdf','download','research','报告','報告')):
                          print('LINK',name,repr(label[:600]),href)
                  for tag in soup.find_all('script'):
                      if tag.get('src'):
                          script_urls.append(urllib.parse.urljoin(r.url,tag['src']))
                      else:
                          body=tag.get_text() or ''
                          if body.strip():
                              p=OUT/f'{name}_inline_{len(list(OUT.glob(name+"_inline_*.js"))):02d}.js'; p.write_text(body,encoding='utf-8')
                              if any(k in body for k in ('乐动机器人','1236','research-report','company-report','pdf','api/')):
                                  print('INLINE_MATCH',name,body[:8000])
                  hits=[]
                  for pat in patterns: hits.extend(re.findall(pat,r.text,re.I))
                  hits=list(dict.fromkeys(hits))
                  (OUT/f'{name}_hits.txt').write_text('\n'.join(hits),encoding='utf-8')
                  for h in hits:
                      if any(k in h.lower() for k in ('乐动机器人','1236','research-report','company-report','api/','pdf','download','attachment')):
                          print('HTML_HIT',name,repr(h[:2500]))
              except Exception as e: print('PAGE_ERR',name,repr(e))

          seen=set()
          for idx,url in enumerate(script_urls):
              if url in seen: continue
              seen.add(url)
              try:
                  r=s.get(url,timeout=90); r.raise_for_status()
                  name=f'js_{idx:03d}_{urllib.parse.urlparse(url).path.rsplit("/",1)[-1] or "script"}'
                  (OUT/name).write_bytes(r.content)
                  hits=[]
                  for pat in patterns: hits.extend(re.findall(pat,r.text,re.I))
                  hits=list(dict.fromkeys(hits))
                  (OUT/(name+'.hits.txt')).write_text('\n'.join(hits),encoding='utf-8')
                  relevant=[h for h in hits if any(k in h.lower() for k in ('research-report','company-report','api/','pdf','download','attachment','fileurl','pagesize','loadmore','pagination','乐动机器人','1236'))]
                  if relevant:
                      print('\nSCRIPT',idx,url,'bytes',len(r.content))
                      for h in relevant[:500]: print('JS_HIT',idx,repr(h[:3500]))
              except Exception as e: print('SCRIPT_ERR',url,repr(e))

          # Exhaust Eastmoney's public August 2026 report listing as a fallback.
          api='https://reportapi.eastmoney.com/report/list'
          rows=[]
          for page in range(1,30):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2026-08-01','endTime':'2026-08-31','pageNo':page,'fields':'','qType':'1','orgCode':'','code':'','rcode':'','p':page,'pageNum':page,'pageNumber':page}
              try:
                  r=s.get(api,params=params,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=90); r.raise_for_status(); obj=r.json(); part=obj.get('data') or []
                  rows.extend(part); print('EAST_PAGE',page,'rows',len(part),'total',obj.get('TotalPage'),'hits',obj.get('hits'))
                  if not part or page>=int(obj.get('TotalPage') or page): break
              except Exception as e: print('EAST_ERR',page,repr(e)); break
          matches=[]
          for row in rows:
              blob=' '.join(str(row.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName','industryName'))
              if any(k in blob for k in ('乐动机器人','樂動機器人','01236','1236.HK','视觉感知龙头','智能感知赛道头部玩家','物理AI双曲线')):
                  print('EAST_MATCH',json.dumps(row,ensure_ascii=False)[:5000]); matches.append(row)
          (OUT/'east_matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')

          # Check standard metadata files on official domains.
          for host in ['https://www.sdicsi.com.hk','https://www.xyzq.com.hk','https://research.bocomgroup.com']:
              for suffix in ['/robots.txt','/sitemap.xml']:
                  try:
                      r=s.get(host+suffix,timeout=60); print('META',host+suffix,r.status_code,r.headers.get('content-type'),len(r.content),r.text[:3000])
                      safe=re.sub(r'[^a-zA-Z0-9]+','_',host+suffix).strip('_'); (OUT/f'{safe}.txt').write_bytes(r.content)
                  except Exception as e: print('META_ERR',host+suffix,repr(e))
          PY
          python /tmp/official.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_Official_Source_Inspection
          path: official_output
          retention-days: 2
          if-no-files-found: error
