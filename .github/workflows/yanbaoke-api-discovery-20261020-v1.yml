name: Inspect Yanbaoke API 20261020 v1

on:
  push:
    paths:
      - '.github/workflows/yanbaoke-api-discovery-20261020-v1.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect Nuxt bundles
        shell: bash
        run: |
          python - <<'PY'
          import re, requests, urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0'})
          base='https://www.yanbaoke.com'
          urls=[base+'/search?keyword='+urllib.parse.quote('京城股份'),base+'/']
          scripts=set()
          for url in urls:
            r=s.get(url,timeout=60);print('PAGE',r.status_code,len(r.content),r.url)
            print('HTML',r.text[:5000])
            soup=BeautifulSoup(r.text,'html.parser')
            for tag in soup.find_all('script',src=True):
              src=tag['src']; scripts.add(src if src.startswith('http') else base+src)
          print('SCRIPTS',scripts)
          for u in scripts:
            try:
              r=s.get(u,timeout=90); text=r.text
              print('\nBUNDLE',u,r.status_code,len(text))
              # Print strings around API/search/report/download keywords.
              for pat in ['api','search','report','download','keyword','list','info']:
                spots=[m.start() for m in re.finditer(pat,text,re.I)]
                print('PAT',pat,'COUNT',len(spots))
                for pos in spots[:25]:
                  frag=text[max(0,pos-250):pos+500]
                  if any(x in frag for x in ['http','/api','search','report','download']):
                    print('FRAG',frag)
            except Exception as e: print('ERR',u,repr(e))
          PY
