name: Probe CITIC Pandairy PDF
on:
  push:
    paths: ['.github/workflows/pandairy-citic-file-probe-v2-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pypdf
      - run: |
          python - <<'PY'
          from io import BytesIO
          import json, requests
          from pypdf import PdfReader
          b='https://file.sgpjbg.com/fileroot1/2021-1/26/530c7d6b-84e0-44e1-a639-06fed0edf18c/530c7d6b-84e0-44e1-a639-06fed0edf18c'
          urls=[b,b+'.pdf',b+'.PDF',b+'?download=1',b+'.pdf?download=1','https://file.sgpjbg.com/fileroot1/2021-1/26/530c7d6b-84e0-44e1-a639-06fed0edf18c/41e84db17c8546f3ab5cbb868ee9dace.pdf']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':'https://www.sgpjbg.com/baogao/28394.html','Accept':'application/pdf,*/*;q=0.8'})
          for u in urls:
            try:
              r=s.get(u,timeout=90,allow_redirects=True)
              print('PROBE',json.dumps({'url':u,'status':r.status_code,'bytes':len(r.content),'final':r.url,'ct':r.headers.get('content-type'),'cd':r.headers.get('content-disposition'),'magic':r.content[:16].hex()},ensure_ascii=False),flush=True)
              if r.content.startswith(b'%PDF'):
                q=PdfReader(BytesIO(r.content),strict=False); n=len(q.pages); t=''
                for i in [0,min(1,n-1),min(2,n-1),n-1]:
                  try:t+=q.pages[i].extract_text() or ''
                  except:pass
                print('FOUND',json.dumps({'url':r.url,'pages':n,'sample':t[:1200]},ensure_ascii=False),flush=True)
            except Exception as e: print('ERR',u,repr(e),flush=True)
          PY
