name: Temporary Resolve SGPJBG Orient Gene Report Pages

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-sgpjbg-links.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch label pages through Jina Reader and extract report links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          pages=[
            'https://www.sgpjbg.com/labels/poctshichangdiyufenbu.html',
            'https://www.sgpjbg.com/labels/poctxingye.html',
            'https://www.sgpjbg.com/labels/poctdefazhanweilai.html',
            'https://www.sgpjbg.com/labels/poctjianceshiji.html',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/plain,text/markdown,*/*'})
          result=[]
          needles=['东方生物','东方基因','深耕POCT国际市场','深耕国际市场的POCT全产业链企业','POCT龙头呼之欲出']
          for target in pages:
            reader='https://r.jina.ai/http://'+target.removeprefix('https://')
            try:
              r=s.get(reader,timeout=90);text=r.text
              links=[]
              for label,url in re.findall(r'\[([^\]]+)\]\((https?://[^)]+)\)',text):
                blob=label+' '+url
                if any(n in blob for n in needles):links.append({'label':label,'url':url})
              snippets=[]
              for n in needles:
                for m in list(re.finditer(re.escape(n),text,re.I))[:20]:
                  snippets.append({'needle':n,'text':re.sub(r'\s+',' ',text[max(0,m.start()-500):m.start()+1600])})
              result.append({'target':target,'reader':reader,'status':r.status_code,'bytes':len(r.content),'links':links,'snippets':snippets[:100],'text_head':text[:2000]})
            except Exception as e:result.append({'target':target,'reader':reader,'error':repr(e)})
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_sgpjbg_links.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULT='+json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-sgpjbg-links
          path: out/orient_gene_sgpjbg_links.json
          if-no-files-found: error
          retention-days: 3
