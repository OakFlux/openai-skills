name: Inspect Xiangyang public announcements 20261005

on:
  push:
    paths:
      - '.github/workflows/inspect-xiangyang-eastmoney-20261005.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query public announcement index
        run: |
          python - <<'PY'
          import json
          import requests

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
          })
          base = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          for page in (1, 2):
              params = {
                  'sr': '-1',
                  'page_size': '100',
                  'page_index': str(page),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': '000678',
              }
              response = session.get(base, params=params, timeout=120)
              print('STATUS', page, response.status_code, len(response.content), response.url)
              response.raise_for_status()
              payload = response.json()
              data = payload.get('data') or {}
              items = data.get('list') or data.get('items') or []
              print('COUNT', page, len(items), 'TOTAL', data.get('total_hits'), data.get('total_count'))
              for item in items:
                  title = str(item.get('title') or '')
                  if any(term in title for term in ['年度报告', '半年度报告', '季度报告']):
                      print('ITEM', json.dumps(item, ensure_ascii=False))
          PY
