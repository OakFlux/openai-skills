name: Build United Laboratories broker report public-page PDFs 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-broker-reports-public-pages-final-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow img2pdf pypdf

      - name: Download all public report pages and build complete PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '联邦制药_03933_券商深度报告_公开页面完整合成版_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          page_root = root / '逐页公开图片'
          preview_root = root / '首页预览'
          page_root.mkdir(exist_ok=True)
          preview_root.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'broker': '东吴证券',
                  'title': '联邦制药（03933.HK）：创新突破，三靶点战略联姻诺和诺德',
                  'date': '2025-07-12',
                  'report_type': '公司首次覆盖深度报告',
                  'rating': '买入',
                  'analysts': ['朱国广', '冉胜男'],
                  'pages': 25,
                  'page_base': 'https://oss.sdyanbao.com/page/2025/7/24/1215139',
                  'source_page': 'https://www.sdyanbao.com/detail/902006',
                  'filename': '01_东吴证券_联邦制药_创新突破三靶点战略联姻诺和诺德_2025-07-12_25页_公开页面完整合成版.pdf',
              },
              {
                  'order': 2,
                  'broker': '招商证券',
                  'title': '联邦制药（03933.HK）：创新药初结硕果，后续管线丰富，主业拓增长新曲线',
                  'date': '2025-09-16',
                  'report_type': '港股公司首次覆盖深度报告',
                  'rating': '强烈推荐',
                  'analysts': ['梁广楷', '许菲菲', '侯彪'],
                  'pages': 29,
                  'page_base': 'https://oss.sdyanbao.com/page/2025/9/22/1248844',
                  'source_page': 'https://www.sdyanbao.com/detail/920346',
                  'filename': '02_招商证券_联邦制药_创新药初结硕果后续管线丰富主业拓增长新曲线_2025-09-16_29页_公开页面完整合成版.pdf',
              },
              {
                  'order': 3,
                  'broker': '中泰证券',
                  'title': '联邦制药（3933.HK）：抗生素龙头跻身创新，GLP-1三靶携手MNC引领增长',
                  'date': '2025-09-18',
                  'report_type': '港股公司首次覆盖深度报告',
                  'rating': '买入',
                  'analysts': ['祝嘉琦'],
                  'pages': 36,
                  'page_base': 'https://oss.sdyanbao.com/page/2025/9/22/1248847',
                  'source_page': 'https://www.sdyanbao.com/detail/920349',
                  'filename': '03_中泰证券_联邦制药_抗生素龙头跻身创新_GLP-1三靶携手MNC引领增长_2025-09-18_36页_公开页面完整合成版.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.sdyanbao.com/',
          })

          def download_image(url: str) -> tuple[bytes, dict]:
              last = None
              for attempt in range(5):
                  try:
                      r = session.get(url, timeout=(20, 120), allow_redirects=True)
                      last = {
                          'status': r.status_code,
                          'final_url': r.url,
                          'content_type': r.headers.get('content-type', ''),
                          'bytes': len(r.content),
                      }
                      if r.status_code == 200 and len(r.content) > 20_000:
                          try:
                              im = Image.open(io.BytesIO(r.content))
                              im.verify()
                              if im.width >= 700 and im.height >= 900:
                                  return r.content, last
                          except Exception:
                              pass
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Failed to download image {url}: {last}')

          manifest = []
          all_pdf_hashes = []
          for rep in reports:
              rep_dir = page_root / f"{rep['order']:02d}_{rep['broker']}_{rep['date']}"
              rep_dir.mkdir(parents=True, exist_ok=True)
              image_paths: list[Path] = []
              page_records = []
              content_hashes = set()

              for page_index in range(rep['pages']):
                  url = f"{rep['page_base']}/{page_index}.png"
                  raw, dl = download_image(url)
                  img = Image.open(io.BytesIO(raw)).convert('RGB')
                  width, height = img.size
                  # Save normalized PNG to avoid browser-specific encodings and preserve legibility.
                  out = rep_dir / f'{page_index + 1:03d}.png'
                  img.save(out, format='PNG', optimize=True)
                  digest = hashlib.sha256(out.read_bytes()).hexdigest()
                  if digest in content_hashes:
                      raise RuntimeError(f'Duplicate page image detected: {rep["broker"]} page {page_index + 1}')
                  content_hashes.add(digest)
                  image_paths.append(out)
                  page_records.append({
                      'page': page_index + 1,
                      'source_url': url,
                      'width': width,
                      'height': height,
                      'bytes': out.stat().st_size,
                      'sha256': digest,
                      'download': dl,
                  })

              # Build one lossless image-only PDF containing every public report page.
              pdf_path = root / rep['filename']
              with pdf_path.open('wb') as f:
                  f.write(img2pdf.convert([str(p) for p in image_paths], rotation=img2pdf.Rotation.ifvalid))

              reader = PdfReader(str(pdf_path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != rep['pages']:
                  raise RuntimeError(f'PDF page mismatch for {rep["broker"]}: expected {rep["pages"]}, got {actual_pages}')
              subprocess.run(['qpdf', '--check', str(pdf_path)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)

              # Render first and last pages for visual verification.
              preview_prefix = preview_root / pdf_path.stem
              subprocess.run([
                  'pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '140', '-singlefile',
                  str(pdf_path), str(preview_prefix) + '_首页'
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              subprocess.run([
                  'pdftoppm', '-f', str(actual_pages), '-l', str(actual_pages), '-png', '-r', '140', '-singlefile',
                  str(pdf_path), str(preview_prefix) + '_末页'
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              first_preview = Path(str(preview_prefix) + '_首页.png')
              last_preview = Path(str(preview_prefix) + '_末页.png')
              for p in (first_preview, last_preview):
                  if not p.exists() or p.stat().st_size < 20_000:
                      raise RuntimeError(f'Preview rendering failed: {p}')

              pdf_bytes = pdf_path.read_bytes()
              pdf_sha = hashlib.sha256(pdf_bytes).hexdigest()
              all_pdf_hashes.append((pdf_sha, pdf_path.name))
              manifest.append({
                  **rep,
                  'actual_pages': actual_pages,
                  'pdf_bytes': len(pdf_bytes),
                  'pdf_sha256': pdf_sha,
                  'pdf_file': pdf_path.name,
                  'page_image_folder': str(rep_dir.relative_to(root)),
                  'first_preview': str(first_preview.relative_to(root)),
                  'last_preview': str(last_preview.relative_to(root)),
                  'page_records': page_records,
                  'format_note': 'Complete image-only PDF assembled from every publicly accessible report page image; not the broker-originated searchable PDF file.',
                  'validation': [
                      'all expected public page images downloaded',
                      'image dimensions and decodability checked',
                      'duplicate-page hashes checked',
                      'PDF page count checked',
                      'qpdf structure checked',
                      'first and last pages rendered',
                  ],
              })

          notice = [
              '联邦制药（03933.HK）券商深度报告资料包',
              '整理日期：2026-09-22',
              '',
              '重要说明：',
              '1. 本包中的3份PDF均由研报平台无需登录即可访问的逐页公开图片完整合成。每份PDF包含该报告的全部页面，不是仅有封面或前两页的预览。',
              '2. 由于券商原始可检索PDF下载入口要求登录或授权，本包没有绕过访问控制。因此，这些PDF不是券商服务器提供的原始PDF文件，而是内容完整的图像型合成PDF。',
              '3. 图像型PDF默认不含可检索文字层，但页面内容、图表、页码、免责声明等均按公开页面保留。',
              '',
              '收录报告：',
          ]
          for i, item in enumerate(manifest, 1):
              notice += [
                  f"{i}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；类型：{item['report_type']}；评级：{item['rating']}；页数：{item['actual_pages']}页",
                  f"   分析师：{'、'.join(item['analysts'])}",
                  f"   平台来源页：{item['source_page']}",
                  f"   公开逐页图片基址：{item['page_base']}",
                  f"   文件：{item['pdf_file']}",
                  f"   SHA-256：{item['pdf_sha256']}",
                  '',
              ]
          notice += [
              '核验项目：全部公开页抓取、页数、图像尺寸、重复页哈希、PDF结构、首末页渲染及ZIP CRC。',
              '研报观点、评级与目标价均对应报告发布日期，不构成当前投资建议。',
          ]
          (root / '00_文件清单与重要说明.txt').write_text('\n'.join(notice), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(''.join(f'{sha}  {name}\n' for sha, name in all_pdf_hashes), encoding='utf-8')

          # The page images are retained inside the package for independent verification.
          zpath = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath, 'r') as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zpath.read_bytes()).hexdigest()
          print('FINAL_ZIP', zpath.name, zpath.stat().st_size, 'SHA256', zip_sha)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-broker-reports-complete-public-pages-final
          path: 联邦制药_03933_券商深度报告_公开页面完整合成版_3份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
