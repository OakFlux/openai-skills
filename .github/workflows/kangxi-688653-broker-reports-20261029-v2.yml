name: Build corrected Kangxi 688653 broker reports 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kangxi-688653-broker-reports-20261029-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='688653'; SHORT='康希通信'; FULL='格兰康希通信科技（上海）股份有限公司'
          PACKAGE='康希通信_688653_券商研究报告_3份'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'东方财富证券','date':'2024-07-10','title':'Wi-Fi FEM国内领先企业，2024有望迎WIFI7发展元年',
              'classification':'公司深度研究报告','rating':'增持（首次）','analysts':'马行川；联系人：刘琦',
              'urls':['https://reportify-1252068037.cos.ap-beijing.myqcloud.com/media/production/s_fac5e4e5_fac5e4e586db1cb1cb354653675ca4ee.pdf','https://duplik-1252068037.cos.ap-beijing.myqcloud.com/duplik/447460783945158/520072899438150/bf977852162a4e529436557c239411b3447460783945158.pdf'],
              'source_page':'https://www.scribd.com/document/929101832/','min_pages':25,
              'broker_aliases':['东方财富证券','Eastmoney Securities','东方财富证券研究所'],'title_token':'Wi-FiFEM国内领先企业'
            },
            {
              'broker':'中邮证券','date':'2025-03-19','title':'WIFI 7 PA加速起量，智能控制模块下游整合',
              'classification':'公司首次覆盖短报告','rating':'买入（首次）','analysts':'吴文吉',
              'urls':['https://pdf.dfcfw.com/pdf/H3_AP202503191644725797_1.pdf'],
              'source_page':'https://data.eastmoney.com/report/info/AP202503191644725797.html','min_pages':4,
              'broker_aliases':['中邮证券','CHINA POST SECURITIES'],'title_token':'WIFI7PA加速起量'
            },
            {
              'broker':'华金证券','date':'2023-11-01','title':'新股覆盖研究：康希通信',
              'classification':'新股覆盖研究','rating':'未评级','analysts':'李蕙',
              'urls':['https://pdf.dfcfw.com/pdf/H3_AP202311011607624966_1.pdf'],
              'source_page':'https://data.eastmoney.com/report/info/AP202311011607624966.html','min_pages':8,
              'broker_aliases':['华金证券','HUAJIN SECURITIES'],'title_token':'康希通信'
            }
          ]

          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          norm=lambda x: re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+','',x or '').lower()
          safe=lambda x: re.sub(r'[\\/:*?"<>|\s]+','_',x)[:120]
          manifest=[]

          for i,rep in enumerate(reports,1):
            data=None; src=''; attempts=[]
            for url in rep['urls']:
              for n in range(5):
                try:
                  ref='https://data.eastmoney.com/report/' if 'dfcfw.com' in url else 'https://reportify.cn/'
                  r=s.get(url,headers={'User-Agent':ua,'Referer':ref,'Accept':'application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9'},timeout=(30,360),allow_redirects=True)
                  attempts.append({'url':url,'attempt':n+1,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:
                    data=r.content; src=url; break
                  if r.status_code in (400,401,403,404,410): break
                except Exception as e:
                  attempts.append({'url':url,'attempt':n+1,'error':repr(e)})
                time.sleep(1+n)
              if data is not None: break
            if data is None: raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

            fn=f"{i:02d}_{safe(rep['broker'])}_康希通信_{safe(rep['title'])}_{rep['date']}.pdf"
            p=PDFDIR/fn; p.write_bytes(data)
            reader=PdfReader(str(p),strict=False); pages=len(reader.pages)
            if pages<rep['min_pages']: raise RuntimeError(f'Unexpectedly short PDF {fn}: {pages} pages')
            text=''
            for pg in reader.pages[:min(40,pages)]:
              try: text+='\n'+(pg.extract_text() or '')
              except Exception: pass
            compact=norm(text)
            ih=[x for x in (SHORT,FULL,CODE,'格兰康希') if norm(x) in compact]
            bh=[x for x in rep['broker_aliases'] if norm(x) in compact]
            th=norm(rep['title_token']) in compact
            if len(compact)>500 and not ih: raise RuntimeError(f'Issuer mismatch: {fn}')
            if len(compact)>500 and not bh: raise RuntimeError(f'Broker mismatch: {fn}')
            if len(compact)>500 and not th: raise RuntimeError(f'Title mismatch: {fn}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(p)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/p.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(p),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<8000: raise RuntimeError(f'Preview failed: {fn}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**{k:v for k,v in rep.items() if k not in ('urls','min_pages','broker_aliases','title_token')},'source_url':src,'candidate_urls':rep['urls'],'actual_pages':pages,'filename':str(Path('原始PDF')/fn),'bytes':len(data),'sha256':sha,'identity_hits':ih,'broker_hits':bh,'title_hit':th,'preview_file':str(Path('首页预览')/preview.name),'download_attempts':attempts})
            print('VERIFIED',rep['broker'],rep['title'],pages,len(data),sha,src)

          total=sum(x['actual_pages'] for x in manifest)
          lines=['格兰康希通信科技（上海）股份有限公司（688653.SH）券商研究报告资料包','整理日期：2026-10-29','','收录3份完整券商原始PDF：一份公司深度研究、一份首次覆盖短报告和一份新股覆盖研究。','未使用行业周报、普通公告或网页摘要替代原始报告。','']
          for i,x in enumerate(manifest,1):
            lines += [f"{i}. {x['broker']}：《{x['title']}》",f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",f"   页数：{x['actual_pages']}页；文件：{x['filename']}",f"   来源页面：{x['source_page']}",f"   SHA-256：{x['sha256']}",'']
          lines += [f'合计：{len(manifest)}份PDF，{total}页。','报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、公司名称/证券代码、券商标识、报告标题、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zcn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=len(manifest): raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)}')
          zen=Path('kangxi_688653_broker_research_reports.zip'); zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: kangxi-688653-broker-reports-final-v2
          path: |
            康希通信_688653_券商研究报告_3份.zip
            kangxi_688653_broker_research_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
