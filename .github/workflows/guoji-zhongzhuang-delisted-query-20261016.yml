name: Query delisted board archive for 400062 annual reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-delisted-query-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - name: Query two-network and delisted company archive
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, requests
          from typing import Any

          BASE='https://www.neeq.com.cn'
          EP=BASE+'/disclosureInfoController/infoResult_en.do'
          PAGE=BASE+'/disclosure/snadc_announcement.html'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9'})
          warm=s.get(PAGE,timeout=40); print('WARM',warm.status_code,warm.url,len(warm.content),s.cookies.get_dict())
          cb='jQuery183009154627335424248_1770000000000'
          need=['companyCd','companyName','disclosureTitle','disclosurePostTitle','destFilePath','publishDate','fileExt']

          def parse(raw:str)->Any:
              t=raw.strip().rstrip(';')
              for prefix in (cb+'(','null(','callback('):
                  if t.startswith(prefix) and t.endswith(')'):
                      t=t[len(prefix):-1]; break
              if not t.startswith(('{','[')) and '(' in t and t.endswith(')'):
                  t=t[t.find('(')+1:-1]
              return json.loads(t)

          cases=[]
          for flag in ['1','0']:
              for dtype in ['5','9','']:
                  for company in ['400062','二重5','国重装5','400062/二重5','400062/国重装5','']:
                      kws=[''] if company else ['400062','二重5','二重重装','国重装5','国机重装','年度报告']
                      for kw in kws:
                          cases.append((flag,dtype,company,kw))

          for idx,(flag,dtype,company,kw) in enumerate(cases,1):
              form=[('flag',flag),('disclosureType',dtype),('page','0'),('companyCd',company),('isNewThree','0'),('startTime','2015-01-01'),('endTime','2020-06-30'),('keyword',kw)]
              for f in need: form.append(('needFields',f))
              headers={'User-Agent':UA,'Origin':BASE,'Referer':PAGE,'X-Requested-With':'XMLHttpRequest','Accept':'text/javascript, application/javascript, application/ecmascript, application/x-ecmascript, */*; q=0.01','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'}
              try:
                  r=s.post(EP,params={'callback':cb,'_':'1770000000000'},data=form,headers=headers,timeout=45)
                  print('\nCASE',idx,'FLAG',flag,'TYPE',repr(dtype),'COMP',repr(company),'KW',repr(kw),'STATUS',r.status_code,'LEN',len(r.text),'URL',r.url)
                  print('HEAD',repr(r.text[:300]))
                  try: obj=parse(r.text)
                  except Exception as exc: print('PARSE_ERROR',repr(exc)); continue
                  blocks=obj if isinstance(obj,list) else [obj]
                  rows=[]
                  for block in blocks:
                      if not isinstance(block,dict): continue
                      li=block.get('listInfo') or {}
                      content=li.get('content') or []
                      rows.extend(content)
                      print('LIST_INFO','TOTAL',li.get('totalElements'),'PAGES',li.get('totalPages'),'NUMBER',li.get('number'),'SIZE',li.get('size'),'CONTENT',len(content))
                  print('ROWS',len(rows))
                  for rec in rows:
                      print('HIT',json.dumps(rec,ensure_ascii=False,sort_keys=True))
              except Exception as exc:
                  print('REQUEST_ERROR',repr(exc))
          PY
