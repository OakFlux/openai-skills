name: Discover Wasion Holdings broker reports 20260926

on:
  push:
    paths:
      - '.github/workflows/wasion-broker-discovery-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Search public web and report APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          out = Path('wasion_discovery')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          queries = [
              '威胜控股 深度报告 PDF 券商 03393',
              '威胜控股 公司深度 研报 PDF',
              '威胜控股 首次覆盖 PDF',
              '威胜控股 顺势能源需求 积极乘风出海 PDF',
              '威胜控股 海外业务高增长 估值优势显著 PDF',
              '威胜控股 中泰国际 2025 PDF',
              '威胜控股 国元国际 2024 PDF',
              'Wasion Holdings initiation report PDF broker',
              '03393 HK equity research report PDF',
              '3393 HK research report PDF',
              'site:pdf.dfcfw.com 威胜控股',
              'site:ztsc.com.hk 威胜控股 PDF',
              'site:qlzq.com.hk 威胜控股 PDF',
              'site:fhyanbao.com 威胜控股 研报',
              'site:vzkoo.com 威胜控股 研报',
              'site:baogaobox.com 威胜控股',
          ]

          records = []
          def add(engine, query, title, url, snippet=''):
              if not url or not url.startswith(('http://','https://')):
                  return
              records.append({'engine':engine,'query':query,'title':title.strip(),'url':url,'snippet':snippet.strip()})

          def request(url, **kw):
              for attempt in range(3):
                  try:
                      r=s.get(url, timeout=(15,45), allow_redirects=True, **kw)
                      print('GET', r.status_code, len(r.content), url, '->', r.url, flush=True)
                      return r
                  except Exception as e:
                      print('ERR', url, repr(e), flush=True)
                      time.sleep(1+attempt)
              return None

          for qi,q in enumerate(queries):
              # Bing
              u='https://www.bing.com/search?q='+quote_plus(q)+'&count=50&setlang=zh-hans'
              r=request(u)
              if r and r.status_code==200:
                  (out/f'bing_{qi}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'lxml')
                  for li in soup.select('li.b_algo'):
                      a=li.select_one('h2 a')
                      if not a: continue
                      p=li.select_one('.b_caption p')
                      add('bing',q,a.get_text(' ',strip=True),a.get('href',''),p.get_text(' ',strip=True) if p else '')
              # DuckDuckGo HTML
              u='https://html.duckduckgo.com/html/?q='+quote_plus(q)
              r=request(u)
              if r and r.status_code==200:
                  (out/f'ddg_{qi}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'lxml')
                  for res in soup.select('.result'):
                      a=res.select_one('.result__a')
                      if not a: continue
                      href=a.get('href','')
                      if href.startswith('//duckduckgo.com/l/?'):
                          qs=parse_qs(urlparse('https:'+href).query)
                          href=unquote(qs.get('uddg',[''])[0])
                      sn=res.select_one('.result__snippet')
                      add('ddg',q,a.get_text(' ',strip=True),href,sn.get_text(' ',strip=True) if sn else '')
              # Baidu
              u='https://www.baidu.com/s?wd='+quote_plus(q)+'&rn=50'
              r=request(u)
              if r and r.status_code==200:
                  (out/f'baidu_{qi}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'lxml')
                  for h3 in soup.select('h3'):
                      a=h3.find('a')
                      if not a: continue
                      href=a.get('href','')
                      title=a.get_text(' ',strip=True)
                      add('baidu',q,title,href,'')
              time.sleep(.3)

          # Eastmoney report API probes.
          api_urls=[]
          for code in ['03393','3393','HK03393','03393.HK']:
              api_urls += [
                  f'https://reportapi.eastmoney.com/report/list?cb=&pageSize=100&beginTime=2018-01-01&endTime=2030-12-31&pageNo=1&fields=&qType=0&orgCode=&author=&code={code}',
                  f'https://reportapi.eastmoney.com/report/list?cb=&pageSize=100&beginTime=2018-01-01&endTime=2030-12-31&pageNo=1&qType=0&code={code}',
                  f'https://reportapi.eastmoney.com/report/list?cb=&pageSize=100&pageNo=1&qType=0&code={code}',
              ]
          api_results=[]
          for i,u in enumerate(api_urls):
              r=request(u, headers={'Referer':'https://data.eastmoney.com/report/'})
              if not r: continue
              (out/f'eastmoney_api_{i}.txt').write_bytes(r.content)
              api_results.append({'url':u,'status':r.status_code,'content_type':r.headers.get('content-type'),'text':r.text[:10000]})
          (out/'eastmoney_api_results.json').write_text(json.dumps(api_results,ensure_ascii=False,indent=2),encoding='utf-8')

          # Normalize, deduplicate, and probe likely report pages/PDFs.
          seen=set(); uniq=[]
          for x in records:
              key=x['url']
              if key in seen: continue
              seen.add(key); uniq.append(x)
          likely=[]
          terms=('威胜','威勝','wasi','03393','3393','研报','研報','report','pdf','研究')
          for x in uniq:
              blob=(x['title']+' '+x['url']+' '+x['snippet']).lower()
              if any(t.lower() in blob for t in terms): likely.append(x)
          (out/'all_results.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'likely_results.json').write_text(json.dumps(likely,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'likely_results.txt').write_text('\n\n'.join(f"[{x['engine']}] {x['title']}\n{x['url']}\n{x['snippet']}" for x in likely),encoding='utf-8')

          probes=[]
          for x in likely[:250]:
              u=x['url']
              # Skip search-engine redirect links that are unlikely to resolve cleanly.
              if 'baidu.com/link?' in u:
                  continue
              r=request(u)
              if not r: continue
              rec={'source_url':u,'final_url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'title':x['title']}
              head=r.content[:8]
              rec['is_pdf']=head.startswith(b'%PDF-') or 'application/pdf' in rec['content_type'].lower()
              if rec['is_pdf']:
                  p=out/f"probe_{len(probes):03d}.pdf"
                  p.write_bytes(r.content)
                  rec['saved']=str(p)
              else:
                  text=r.text[:100000]
                  # extract direct pdf-like links
                  pdfs=[]
                  soup=BeautifulSoup(text,'lxml')
                  for a in soup.find_all(['a','iframe','embed','source']):
                      href=a.get('href') or a.get('src') or ''
                      if href:
                          href=urljoin(r.url,href)
                          if '.pdf' in href.lower() or 'download' in href.lower():
                              pdfs.append(href)
                  rec['pdf_links']=list(dict.fromkeys(pdfs))[:30]
              probes.append(rec)
              if len(probes)>=120: break
          (out/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RESULTS',len(uniq),'LIKELY',len(likely),'PROBES',len(probes),flush=True)
          PY

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasion-broker-discovery
          path: wasion_discovery
          retention-days: 7
          compression-level: 6
