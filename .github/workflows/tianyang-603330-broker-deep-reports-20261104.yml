name: Build Tianyang 603330 broker deep reports 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tianyang-603330-broker-deep-reports-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '603330'
          PACKAGE = '天洋新材_603330_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '东亚前海证券',
                  'date': '2023-04-26',
                  'title': '热熔环保粘接龙头、光伏胶膜快速放量',
                  'classification': '公司深度报告／首次覆盖',
                  'rating': '推荐（首次覆盖）',
                  'analysts': '燕楠',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202304271585925042_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202304271585925042_1.pdf?1682587670000.pdf=',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202304271585925042.html',
                  'min_pages': 20,
                  'broker_aliases': ['东亚前海证券', '东亚前海证券研究所'],
                  'title_token': '热熔环保粘接龙头光伏胶膜快速放量',
              },
              {
                  'broker': '浙商证券',
                  'date': '2023-09-18',
                  'title': '热熔粘接材料领军者，光伏胶膜打开第二增长曲线',
                  'classification': '公司深度报告／首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '邱世梁、王华君；研究助理：姬新悦、周向昉',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202309191599282769_1.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202309191599282769.html',
                  'min_pages': 20,
                  'broker_aliases': ['浙商证券', '浙商证券研究所', 'ZHESHANG SECURITIES'],
                  'title_token': '热熔粘接材料领军者光伏胶膜打开第二增长曲线',
              },
              {
                  'broker': '光大证券',
                  'date': '2022-10-14',
                  'title': '拓展光伏胶膜业务，热熔胶龙头快速发展',
                  'classification': '投资价值分析报告／首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '赵乃迪',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202210161579192331_1.pdf',
                  ],
                  'source_page': 'https://data.eastmoney.com/report/info/AP202210161579192331.html',
                  'min_pages': 20,
                  'broker_aliases': ['光大证券', '光大证券研究所', 'EVERBRIGHT SECURITIES'],
                  'title_token': '拓展光伏胶膜业务热熔胶龙头快速发展',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:120]

          identities = (
              '天洋新材', '上海天洋', '天洋新材（上海）科技股份有限公司',
              '上海天洋热熔粘接材料股份有限公司', CODE,
          )

          manifest = []
          for idx, rep in enumerate(reports, 1):
              data = None
              source_url = ''
              attempts = []
              for url in rep['urls']:
                  for attempt in range(5):
                      try:
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url,
                              'attempt': attempt + 1,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 80000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

              filename = f"{idx:02d}_{safe(rep['broker'])}_天洋新材_{safe(rep['title'])}_{rep['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < rep['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(60, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in identities if normalize(x) in compact]
              broker_hits = [x for x in rep['broker_aliases'] if normalize(x) in compact]
              title_hit = normalize(rep['title_token']) in compact
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')
              if len(compact) > 500 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch: {filename}')
              if len(compact) > 500 and not title_hit:
                  raise RuntimeError(f'Title mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{k: v for k, v in rep.items() if k not in ('urls', 'min_pages', 'broker_aliases', 'title_token')},
                  'source_url': source_url,
                  'candidate_urls': rep['urls'],
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hit': title_hit,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'broker identity', 'report title',
                      'page count', 'qpdf structure', 'first-page render'
                  ],
              })
              print('VERIFIED', rep['broker'], rep['title'], pages, len(data), sha, source_url)

          total_pages = sum(x['actual_pages'] for x in manifest)
          readme = [
              '天洋新材（上海）科技股份有限公司（603330.SH）券商深度研究报告资料包',
              '整理日期：2026-11-04',
              '',
              '本包收录3份公开可直接取得并完成完整性核验的券商原始PDF。',
              '筛选口径：公司深度、首次覆盖或投资价值分析报告；不使用普通财报点评、行业周报或网页摘要凑数。',
              '2022年报告中的证券简称为“上海天洋”，与现证券简称“天洋新材”为同一上市公司。',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   来源页面：{x['source_page']}",
                  f"   PDF来源：{x['source_url']}",
                  f"   SHA-256：{x['sha256']}",
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('tianyang_603330_broker_deep_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: tianyang-603330-broker-deep-reports-final
          path: |
            天洋新材_603330_券商深度报告_3份.zip
            tianyang_603330_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
