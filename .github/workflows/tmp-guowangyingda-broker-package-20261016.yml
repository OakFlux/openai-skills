name: Build State Grid Yingda broker deep-report package

on:
  push:
    branches: [tmp-guowangyingda-broker-reports-20261016]
    paths: ['.github/workflows/tmp-guowangyingda-broker-package-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Download, validate and prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='国网英大_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=600517' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 8 "$out" "$out.txt" 2>/dev/null
            grep -Eq '国网英大|国网英大股份有限公司' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202605221822678937_1.pdf' \
            "$PACKAGE/01_东吴证券_深挖电网资源优势禀赋_产融结合塑造坚实壁垒_2026-05-22.pdf" \
            20

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202409101639813953_1.pdf' \
            "$PACKAGE/02_东吴证券_金融加制造特色鲜明_产融结合优势突出_2024-09-10.pdf" \
            19

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202109251518436158_1.pdf' \
            "$PACKAGE/03_东吴证券_金融制造并驾齐驱_碳资产业务一骑绝尘_2021-09-26.pdf" \
            30

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('国网英大_券商深度报告_3份')
          meta = {
              '01_东吴证券_深挖电网资源优势禀赋_产融结合塑造坚实壁垒_2026-05-22.pdf': {
                  'broker': '东吴证券',
                  'title': '深挖电网资源优势禀赋，产融结合塑造坚实壁垒',
                  'date': '2026-05-22',
                  'index': 'AP202605221822678937',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202605221822678937_1.pdf',
              },
              '02_东吴证券_金融加制造特色鲜明_产融结合优势突出_2024-09-10.pdf': {
                  'broker': '东吴证券',
                  'title': '“金融+制造”特色鲜明，产融结合优势突出',
                  'date': '2024-09-10',
                  'index': 'AP202409101639813953',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202409101639813953_1.pdf',
              },
              '03_东吴证券_金融制造并驾齐驱_碳资产业务一骑绝尘_2021-09-26.pdf': {
                  'broker': '东吴证券',
                  'title': '金融制造并驾齐驱，碳资产业务一骑绝尘',
                  'date': '2021-09-26',
                  'index': 'AP202109251518436158',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202109251518436158_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '国网英大（600517）券商公司深度报告',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 收录公开可下载的完整公司深度报告3份，排除短篇财报与季报点评。',
              '2. 三份报告分别覆盖电网资源与产融壁垒、“金融+制造”业务结构及碳资产业务。',
              '3. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: State-Grid-Yingda-broker-deep-reports-3
          path: 国网英大_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
