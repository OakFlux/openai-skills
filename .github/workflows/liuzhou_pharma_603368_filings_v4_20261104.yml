name: package-liuzhou-pharma-603368-filings-v4

on:
  push:
    branches:
      - tmp/liuzhou-pharma-603368-filings-20261104-v4

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='603368'; FULL='广西柳药集团股份有限公司'; PREPARED='2026-11-04'
          ROOT_NAME='柳药集团_603368_2020-2025年报及最新季报'; ROOT=Path(ROOT_NAME)
          PDF_DIR=ROOT/'PDF文件'; PREVIEW_DIR=ROOT/'首页预览'; PDF_DIR.mkdir(parents=True,exist_ok=True); PREVIEW_DIR.mkdir(parents=True,exist_ok=True)
          base='https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK'
          reports=[
            {'period':'2020年年度报告','kind':'annual','date':'2021-03-30','id':'6989892','year':2021,'month':3,'sse_path':'/disclosure/listedinfo/announcement/c/new/2021-03-30/603368_20210330_14.pdf','fallback':['https://static.cninfo.com.cn/finalpage/2021-03-30/1209478407.PDF']},
            {'period':'2021年年度报告','kind':'annual','date':'2022-03-31','id':'7938908','year':2022,'month':3,'sse_path':'/disclosure/listedinfo/announcement/c/new/2022-03-31/603368_20220331_2_Mn8sjnTr.pdf','fallback':[]},
            {'period':'2022年年度报告','kind':'annual','date':'2023-03-28','id':'8913755','year':2023,'month':3,'sse_path':'/disclosure/listedinfo/announcement/c/new/2023-03-28/603368_20230328_UKC2.pdf','fallback':[]},
            {'period':'2023年年度报告','kind':'annual','date':'2024-04-26','id':'10080892','year':2024,'month':4,'sse_path':'/disclosure/listedinfo/announcement/c/new/2024-04-26/603368_20240426_04MA.pdf','fallback':['https://static.cninfo.com.cn/finalpage/2024-04-26/1219835170.PDF']},
            {'period':'2024年年度报告','kind':'annual','date':'2025-03-27','id':'10808795','year':2025,'month':3,'sse_path':'/disclosure/listedinfo/announcement/c/new/2025-03-27/603368_20250327_3FH3.pdf','fallback':['https://static.cninfo.com.cn/finalpage/2025-03-27/1222909604.PDF']},
            {'period':'2025年年度报告','kind':'annual','date':'2026-04-30','id':'12282619','year':2026,'month':4,'sse_path':'/disclosure/listedinfo/announcement/c/new/2026-04-30/603368_20260430_WQCG.pdf','fallback':['https://static.cninfo.com.cn/finalpage/2026-04-30/1225261492.PDF']},
            {'period':'2026年第三季度报告','kind':'quarter','date':'2026-10-28','id':'12665037','year':2026,'month':10,'sse_path':'/disclosure/listedinfo/announcement/c/new/2026-10-28/603368_20261028_MU3D.pdf','fallback':[]},
          ]
          accepted=['603368','柳药集团','柳药股份','广西柳药集团股份有限公司','广西柳州医药股份有限公司']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://money.finance.sina.com.cn/'})

          def urls(r):
            path=f"{r['year']}/{r['year']}-{r['month']}/{r['date']}/{r['id']}.PDF"
            out=[f'{base}/{path}',f'http://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/{path}',f'http://211.154.219.97:9494/MRGG/CNSESH_STOCK/{path}']
            out.extend(r['fallback'])
            return out

          def fetch(r):
            last=None
            for u in urls(r):
              for attempt in range(4):
                try:
                  rr=s.get(u,headers={'Accept':'application/pdf,*/*;q=0.8','Referer':'https://money.finance.sina.com.cn/'},timeout=(30,360),allow_redirects=True)
                  print('DOWNLOAD',r['period'],rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),rr.content[:8])
                  rr.raise_for_status()
                  if rr.content.startswith(b'%PDF-') and len(rr.content)>50000: return rr.content,rr.url,rr.headers.get('content-type','')
                  last=RuntimeError(f'not PDF: {rr.content[:30]!r}')
                except Exception as e:
                  last=e; print('DOWNLOAD_ERROR',r['period'],u,attempt,repr(e)); time.sleep(attempt+1)
            raise RuntimeError(f"Unable to download {r['period']}: {last}")

          manifest=[]
          for i,r in enumerate(reports,1):
            data,final_url,ctype=fetch(r); filename=f"{i:02d}_{r['period']}.pdf"; path=PDF_DIR/filename; path.write_bytes(data)
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages); text=''.join((p.extract_text() or '') for p in reader.pages[:min(12,pages)]); compact=re.sub(r'\s+','',text)
            if not any(x in compact for x in accepted): raise RuntimeError(f'Issuer validation failed: {filename}')
            if r['kind']=='annual' and pages<50: raise RuntimeError(f'Annual report too short: {filename}: {pages}')
            if r['kind']=='quarter' and pages<5: raise RuntimeError(f'Quarter report too short: {filename}: {pages}')
            chk=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if chk.returncode!=0: raise RuntimeError(f'qpdf failed: {filename}: {chk.stdout}')
            prefix=PREVIEW_DIR/path.stem; rnd=subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(path),str(prefix)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True); preview=Path(str(prefix)+'.png')
            if rnd.returncode!=0 or not preview.exists() or preview.stat().st_size<5000: raise RuntimeError(f'Preview failed: {filename}: {rnd.stdout}')
            item={**r,'sequence':i,'filename':filename,'pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_url':final_url,'content_type':ctype,'preview_file':str(Path('首页预览')/preview.name)}
            manifest.append(item); print('VALIDATED',r['period'],pages,len(data),item['sha256'])

          lines=[f'{FULL}（{CODE}.SH）2020—2025年年度报告及最新季度报告资料包',f'整理日期：{PREPARED}','','本包包含2020—2025年年度报告全文6份，以及截至整理日已披露的最新独立季度报告：2026年第三季度报告。','','文件来源为上市公司法定信息披露文件的公开镜像；包内同时记录上交所公告路径和实际下载来源。','']
          for x in manifest:
            lines += [f"{x['sequence']}. {x['filename']}",f"   报告期间：{x['period']}",f"   公告日期：{x['date']}",f"   页数：{x['pages']}；字节数：{x['bytes']}",f"   实际下载来源：{x['source_url']}",f"   上交所公告路径：{x['sse_path']}",f"   SHA-256：{x['sha256']}",'']
          lines += ['核验项目：PDF文件头、公司名称或证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。']
          (ROOT/'README_报告清单与核验说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          payload={'company':FULL,'stock_code':CODE,'prepared_on':PREPARED,'file_count':7,'annual_report_count':6,'latest_quarter':'2026年第三季度报告','files':manifest}
          (ROOT/'manifest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          with (ROOT/'manifest.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.writer(f); w.writerow(['序号','报告期间','类型','公告日期','文件名','页数','字节数','SHA-256','实际下载来源','上交所公告路径','首页预览'])
            for x in manifest: w.writerow([x['sequence'],x['period'],x['kind'],x['date'],x['filename'],x['pages'],x['bytes'],x['sha256'],x['source_url'],x['sse_path'],x['preview_file']])
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  PDF文件/{x['filename']}" for x in manifest)+'\n',encoding='utf-8')
          zip_path=Path('liuzhou_pharma_603368_2020_2025_annual_latest_quarter.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=str(Path(ROOT_NAME)/p.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=7: raise RuntimeError(f'ZIP validation failed bad={bad} pdfs={len(pdfs)}')
          result={'package':zip_path.name,'zip_bytes':zip_path.stat().st_size,'zip_sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'file_count':7,'annual_report_count':6,'latest_quarter':'2026年第三季度报告','files':[{k:x[k] for k in ['period','date','pages','bytes','sha256','source_url']} for x in manifest]}
          Path('result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'); print('PACKAGE_RESULT',json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: liuzhou-pharma-603368-filings-v4-20261104
          path: |
            liuzhou_pharma_603368_2020_2025_annual_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
