name: Caihong Brokerage Deep Reports Package

on:
  push:
    branches:
      - chatgpt-caihong-reports-20260929
    paths:
      - .github/workflows/caihong_brokerage_reports_20260929.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/verification
          python - <<'PY'
          import io
          import json
          import os
          import re
          import hashlib
          import zipfile
          from pathlib import Path

          import fitz
          import requests
          from PIL import Image, ImageDraw, ImageFont
          from pypdf import PdfReader

          OUT = Path('output')
          VERIFY = OUT / 'verification'
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept': 'application/pdf,text/html;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'order': 1,
                  'broker': '西部证券',
                  'title': '液晶面板利润稳增，玻璃基板加速替代',
                  'date': '2025-03-14',
                  'authors': '郑宏达',
                  'rating': '买入',
                  'classification': '公司深度研究 / 首次覆盖报告',
                  'urls': [
                      'https://notice.10jqka.com.cn/api/original/491039eca730c823.pdf',
                      'https://max.book118.com/try_down/236234153044011055.pdf',
                  ],
                  'referer': 'https://news.10jqka.com.cn/field/sr/19700101/51148091.shtml',
                  'expected_pages': 22,
              },
              {
                  'order': 2,
                  'broker': '华安证券',
                  'title': '定增落地欲破垄断，静待质变',
                  'date': '2018-02-01',
                  'authors': '高欣宇、宫模恒',
                  'rating': '增持',
                  'classification': '公司深度研究报告',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201802011085279602_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP201802011085279602_1.pdf',
                  ],
                  'referer': 'https://data.eastmoney.com/report/600707.html',
                  'expected_pages': 17,
              },
              {
                  'order': 3,
                  'broker': '国元证券',
                  'title': '行走在玻璃基板产业“新长征”路上',
                  'date': '2016-10-25',
                  'authors': '常格非、刘单于',
                  'rating': '买入',
                  'classification': '公司深度调研报告',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201610240022300441_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP201610240022300441_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP201610240022300441.pdf',
                  ],
                  'referer': 'https://data.eastmoney.com/report/zw_stock.jshtml?infocode=AP201610240022300441',
                  'expected_pages': None,
              },
          ]

          def safe_name(text):
              text = text.replace('“', '').replace('”', '').replace('，', '_').replace('：', '_')
              text = re.sub(r'[\\/:*?"<>|\s]+', '_', text)
              return re.sub(r'_+', '_', text).strip('_')

          def get_pdf(meta):
              errors = []
              for url in meta['urls']:
                  try:
                      r = session.get(url, headers={'Referer': meta['referer']}, timeout=90, allow_redirects=True)
                      ctype = r.headers.get('content-type', '')
                      print('FETCH', r.status_code, len(r.content), url, '->', r.url, ctype)
                      if r.status_code == 200 and r.content.startswith(b'%PDF') and len(r.content) > 20000:
                          return r.content, url, r.url
                      errors.append(f'{url}: {r.status_code} {ctype} {len(r.content)} bytes')
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
              raise RuntimeError('No valid PDF: ' + ' | '.join(errors))

          def inspect_pdf(pdf_bytes, temp_path):
              temp_path.write_bytes(pdf_bytes)
              reader = PdfReader(str(temp_path))
              encrypted = bool(reader.is_encrypted)
              if encrypted:
                  try:
                      reader.decrypt('')
                  except Exception:
                      pass
              pages = len(reader.pages)
              first_text = ''
              last_text = ''
              try:
                  first_text = reader.pages[0].extract_text() or ''
              except Exception:
                  pass
              try:
                  last_text = reader.pages[-1].extract_text() or ''
              except Exception:
                  pass
              return pages, encrypted, first_text, last_text

          def render_page(pdf_path, page_no, out_path, dpi=130):
              doc = fitz.open(str(pdf_path))
              page = doc[page_no]
              matrix = fitz.Matrix(dpi / 72.0, dpi / 72.0)
              pix = page.get_pixmap(matrix=matrix, alpha=False)
              pix.save(str(out_path))
              doc.close()

          validated = []
          failures = []
          for meta in reports:
              try:
                  pdf_bytes, source_url, final_url = get_pdf(meta)
                  temp = OUT / f'temp_{meta["order"]}.pdf'
                  pages, encrypted, first_text, last_text = inspect_pdf(pdf_bytes, temp)
                  text_probe = (first_text + '\n' + last_text).replace('\x00', '')
                  company_match = ('彩虹股份' in text_probe) or ('600707' in text_probe)
                  broker_match = meta['broker'] in text_probe
                  expected = meta.get('expected_pages')
                  page_check = expected is None or pages == expected
                  # A scanned or font-encoded PDF can have sparse extraction. Rendering is the authoritative check.
                  filename = f"{meta['order']:02d}_{meta['broker']}_彩虹股份_{safe_name(meta['title'])}_{meta['date']}_{pages}页.pdf"
                  final_pdf = OUT / filename
                  temp.replace(final_pdf)

                  p1 = VERIFY / f'{meta["order"]:02d}_page1.png'
                  plast = VERIFY / f'{meta["order"]:02d}_lastpage.png'
                  render_page(final_pdf, 0, p1)
                  render_page(final_pdf, pages - 1, plast)

                  item = {
                      **{k: v for k, v in meta.items() if k not in ('urls', 'referer', 'expected_pages')},
                      'filename': filename,
                      'source_url': source_url,
                      'final_url': final_url,
                      'pages': pages,
                      'expected_pages': expected,
                      'page_check': page_check,
                      'bytes': len(pdf_bytes),
                      'sha256': hashlib.sha256(pdf_bytes).hexdigest(),
                      'encrypted': encrypted,
                      'company_text_match': company_match,
                      'broker_text_match': broker_match,
                      'first_text_excerpt': re.sub(r'\s+', ' ', first_text)[:700],
                  }
                  validated.append(item)
                  print('VALIDATED', json.dumps(item, ensure_ascii=False))
              except Exception as exc:
                  failures.append({'order': meta['order'], 'broker': meta['broker'], 'title': meta['title'], 'error': repr(exc)})
                  print('FAILED', json.dumps(failures[-1], ensure_ascii=False))

          if len(validated) < 2:
              raise RuntimeError(f'Only {len(validated)} valid reports; need at least 2. Failures={failures}')

          # Build a compact visual contact sheet from first/last pages.
          thumbs = []
          for item in validated:
              for suffix, label in [('page1', '首页'), ('lastpage', '末页')]:
                  path = VERIFY / f'{item["order"]:02d}_{suffix}.png'
                  im = Image.open(path).convert('RGB')
                  im.thumbnail((560, 760))
                  canvas = Image.new('RGB', (600, 830), 'white')
                  canvas.paste(im, ((600-im.width)//2, 45))
                  draw = ImageDraw.Draw(canvas)
                  draw.text((20, 15), f"{item['order']:02d} {item['broker']} - {label} ({item['pages']}页)", fill='black')
                  thumbs.append(canvas)
          cols = 2
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 600, rows * 830), 'white')
          for idx, im in enumerate(thumbs):
              sheet.paste(im, ((idx % cols) * 600, (idx // cols) * 830))
          contact = VERIFY / 'contact_sheet.jpg'
          sheet.save(contact, quality=88)

          manifest = {
              'company': '彩虹股份',
              'stock_code': '600707.SH',
              'pdf_count': len(validated),
              'total_pages': sum(x['pages'] for x in validated),
              'reports': validated,
              'failures': failures,
          }
          (OUT / '00_文件清单及校验值.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          lines = [
              '彩虹股份（600707.SH）券商深度研究报告资料包',
              '',
              f"已收录完整PDF：{len(validated)}份，合计{manifest['total_pages']}页。",
              '所有文件均已验证为可打开PDF，并核验实际页数、文件大小和SHA-256。',
              '报告仅供研究参考，不构成投资建议。',
              '',
          ]
          for x in validated:
              lines += [
                  f"{x['order']}. {x['broker']}：《{x['title']}》",
                  f"   日期：{x['date']}；页数：{x['pages']}；分析师：{x['authors']}；评级：{x['rating']}；类型：{x['classification']}",
                  f"   SHA-256：{x['sha256']}",
                  '',
              ]
          if failures:
              lines += ['未纳入文件：', json.dumps(failures, ensure_ascii=False, indent=2)]
          (OUT / '00_资料说明.txt').write_text('\n'.join(lines), encoding='utf-8')

          zip_path = OUT / 'caihong_gufen_brokerage_deep_research_reports.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for name in ['00_资料说明.txt', '00_文件清单及校验值.json']:
                  zf.write(OUT / name, arcname=name)
              for x in validated:
                  zf.write(OUT / x['filename'], arcname=x['filename'])

          # Re-open ZIP and test every entry CRC.
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              zip_entries = zf.namelist()

          summary = {
              **manifest,
              'zip_filename': zip_path.name,
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'zip_entries': zip_entries,
          }
          (OUT / 'BUILD_SUMMARY.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_SUMMARY', json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: caihong-brokerage-reports-package
          path: |
            output/caihong_gufen_brokerage_deep_research_reports.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
          compression-level: 6
