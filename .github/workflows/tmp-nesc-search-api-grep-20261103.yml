name: Grep NESC search API

on:
  push:
    branches:
      - tmp-nesc-search-api-grep-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Grep search implementation
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0'})
          u='https://www.nesc.cn/main/home/search/index.shtml'
          r=s.get(u,timeout=(20,90));r.encoding='utf-8';t=html.unescape(r.text).replace('\\/','/')
          print('LEN',len(t))
          for pat in ['search','keyword','keyWord','searchContent','result','pageNum','pageSize','ajax','/main/home/search','form','input']:
            print('\nPATTERN',pat)
            pos=0;n=0
            while n<30:
              i=t.lower().find(pat.lower(),pos)
              if i<0:break
              print(t[max(0,i-500):i+1500])
              pos=i+len(pat);n+=1
          soup=BeautifulSoup(t,'html.parser')
          for tag in soup.find_all(['form','input','button']): print('TAG',tag)
          for src in [urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]:
            try:
              q=s.get(src,timeout=(20,90));q.encoding=q.apparent_encoding or 'utf-8';b=html.unescape(q.text).replace('\\/','/')
              if any(x in b.lower() for x in ['searchcontent','search.shtml','search/index','searchlist']):
                print('\nSCRIPT_MATCH',src,'LEN',len(b))
                for pat in ['searchcontent','search.shtml','search/index','searchlist','keyword']:
                  pos=0;n=0
                  while n<20:
                    i=b.lower().find(pat.lower(),pos)
                    if i<0:break
                    print(b[max(0,i-600):i+1800]);pos=i+len(pat);n+=1
            except Exception as e: print('ERR',src,repr(e))
          PY
