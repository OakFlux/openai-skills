name: Temporary Parse 9fzt Melco Next Data

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-parse-9fzt-next-data.yml

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Parse embedded Next.js props and probe file-like fields
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 pypdf
          python - <<'PY'
          import io,json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pypdf import PdfReader
          pages=[
            'https://gmg.9fzt.com/report/HKSE/00200/800288177894.html',
            'https://gmg.9fzt.com/report/HKSE/00200/571497691655.html',
            'https://gmg.9fzt.com/report/HKSE/00200/568194048126.html',
            'https://gmg.9fzt.com/report/HKSE/00200/588845351474.html',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://gmg.9fzt.com/'})
          results=[]
          def walk(o,path=''):
            if isinstance(o,dict):
              for k,v in o.items():
                p=f'{path}.{k}' if path else k
                yield p,v
                yield from walk(v,p)
            elif isinstance(o,list):
              for i,v in enumerate(o):yield from walk(v,f'{path}[{i}]')
          for page in pages:
            r=s.get(page,timeout=60);r.raise_for_status();soup=BeautifulSoup(r.text,'html.parser')
            script=soup.find('script',id='__NEXT_DATA__');obj=json.loads(script.string) if script and script.string else None
            rec={'page':page,'status':r.status_code,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'next_data':obj,'file_fields':[],'probes':[]}
            if obj:
              for path,v in walk(obj):
                if isinstance(v,(str,int,float,bool)) and any(k in path.lower() for k in ['file','pdf','url','attach','download','source','origin','report','content']):
                  rec['file_fields'].append({'path':path,'value':v})
              urls=[]
              for x in rec['file_fields']:
                v=x['value']
                if isinstance(v,str) and (v.startswith('http') or v.startswith('//') or '.pdf' in v.lower()):urls.append(urljoin(page,v))
              for u in dict.fromkeys(urls):
                try:
                  q=s.get(u,timeout=45,allow_redirects=True);item={'url':u,'final':q.url,'status':q.status_code,'type':q.headers.get('content-type'),'bytes':len(q.content),'head':q.content[:8].hex()}
                  if q.status_code==200 and q.content.lstrip().startswith(b'%PDF'):
                    reader=PdfReader(io.BytesIO(q.content),strict=False);item['pages']=len(reader.pages);path=Path('out')/('pdf_'+str(len(rec['probes']))+'.pdf');path.parent.mkdir(exist_ok=True);path.write_bytes(q.content);item['saved']=str(path)
                  rec['probes'].append(item)
                except Exception as e:rec['probes'].append({'url':u,'error':repr(e)})
            results.append(rec)
            print('PAGE='+json.dumps({'page':page,'title':rec['title'],'file_fields':rec['file_fields'],'probes':rec['probes']},ensure_ascii=False),flush=True)
          Path('out').mkdir(exist_ok=True);Path('out/next_data.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ninefzt-melco-next-data
          path: out
          retention-days: 3
