name: Temporary Reportify API probe for Aixin reports

on:
  push:
    branches:
      - tmp-reportify-api-probe-aixin-20260906

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch Reportify scripts and inspect endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out = Path('output')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
          })
          page_url='https://reportify.cn/reports/1278761946887360512'
          page=s.get(page_url,timeout=90)
          page.raise_for_status()
          soup=BeautifulSoup(page.text,'html.parser')
          script_urls=[]
          for tag in soup.find_all('script',src=True):
              u=urljoin(page.url,tag['src'])
              if u not in script_urls: script_urls.append(u)
          print('SCRIPT_COUNT',len(script_urls),flush=True)
          patterns=[
              r'https?://[^"\'`\\\s]+',
              r'/(?:api|v1|v2|documents?|reports?|files?|render|download|preview|pages?)[A-Za-z0-9_?&=./{}:\-\[\]]*',
          ]
          keywords=['document_id','documentId','document_id_v2','render_type','url_pdf','content_url','preview_image','page_url','image_url','download','original_url','source_url','readable','resource_limit','report/detail','document/page','document/image','page-image','page_image']
          summary=[]
          all_matches=[]
          for i,u in enumerate(script_urls):
              try:
                  r=s.get(u,timeout=90)
                  print('SCRIPT',i,r.status_code,len(r.content),u,flush=True)
                  if r.status_code!=200: continue
                  text=r.text
                  filename=f'script_{i:03d}.js'
                  (out/filename).write_text(text,encoding='utf-8',errors='ignore')
                  found=[]
                  low=text.lower()
                  if any(k.lower() in low for k in keywords):
                      for kw in keywords:
                          start=0
                          while True:
                              pos=low.find(kw.lower(),start)
                              if pos<0: break
                              snippet=text[max(0,pos-500):min(len(text),pos+1600)]
                              found.append({'keyword':kw,'position':pos,'snippet':snippet})
                              start=pos+len(kw)
                              if len(found)>=80: break
                          if len(found)>=80: break
                      for pat in patterns:
                          for val in re.findall(pat,text,re.I):
                              if isinstance(val,tuple): val=''.join(val)
                              if any(k in val.lower() for k in ['api','document','report','render','download','preview','file','page']):
                                  all_matches.append({'script':u,'value':val})
                      summary.append({'script_index':i,'url':u,'bytes':len(r.content),'hits':found})
              except Exception as e:
                  print('SCRIPT_ERROR',i,u,repr(e),flush=True)
          # dedupe matches
          seen=set(); dedup=[]
          for item in all_matches:
              key=(item['script'],item['value'])
              if key in seen: continue
              seen.add(key); dedup.append(item)
          (out/'endpoint_matches.json').write_text(json.dumps(dedup,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'keyword_snippets.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY_SCRIPTS',len(summary),'MATCHES',len(dedup),flush=True)
          for item in dedup[:300]:
              print('MATCH',item['script'],item['value'][:500],flush=True)
          PY
      - name: Upload probe data
        uses: actions/upload-artifact@v4
        with:
          name: reportify-aixin-api-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
