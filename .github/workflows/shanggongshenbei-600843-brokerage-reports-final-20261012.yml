name: Build corrected Shang Gong Shen Bei 600843 brokerage reports package 20261012

on:
  push:
    paths:
      - '.github/workflows/shanggongshenbei-600843-brokerage-reports-final-20261012.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='上工申贝_600843_券商深度及重点研究报告精选_3份'
          OUT=Path(PACKAGE); OUT.mkdir(exist_ok=True)
          S=requests.Session(); S.trust_env=False
          S.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})

          reports=[
            {
              'filename':'01_粤开证券_2021-06-02_公司深度_周期上行重启_智能化浪潮已至_龙头进入收获期.pdf',
              'broker':'粤开证券','date':'2021-06-02','title':'周期上行重启、智能化浪潮已至，龙头进入收获期',
              'authors':'陈梦洁','rating':'增持（首次评级）','classification':'公司深度报告','pages':36,'min_bytes':2000000,
              'info_code':'AP202106021495520267','urls':['https://pdf.dfcfw.com/pdf/H3_AP202106021495520267_1.pdf','https://pdf.dfcfw.com/pdf/H2_AP202106021495520267_1.pdf']
            },
            {
              'filename':'02_国金证券_2015-08-22_首次覆盖_品牌整合效益初显_关注新应用领域及产品升级.pdf',
              'broker':'国金证券','date':'2015-08-22','title':'品牌整合效益初显，关注新应用领域及产品升级',
              'authors':'潘贻立','rating':'买入（首次评级）','classification':'公司首次覆盖报告','pages':21,'min_bytes':1500000,
              'info_code':'AP201509230010870711','urls':['https://pdf.dfcfw.com/pdf/H3_AP201509230010870711_1.pdf','https://pdf.dfcfw.com/pdf/H2_AP201509230010870711_1.pdf']
            },
            {
              'filename':'03_广发证券_2015-08-03_长篇公司研究_缝制领域的自动化专家.pdf',
              'broker':'广发证券','date':'2015-08-03','title':'缝制领域的自动化专家',
              'authors':'罗立波、刘芷君、真怡','rating':'买入','classification':'长篇公司研究报告','pages':19,'min_bytes':900000,
              'info_code':None,'urls':['https://img3.gelonghui.com/pdf201508/pdf20150805110310942.pdf']
            },
          ]

          def download(r,path):
            errors=[]
            for url in r['urls']:
              for attempt in range(1,4):
                tmp=path.with_suffix('.pdf.part'); tmp.unlink(missing_ok=True)
                try:
                  with S.get(url,headers={'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*'},stream=True,timeout=(30,600)) as resp:
                    print('DOWNLOAD',path.name,resp.status_code,url,flush=True); resp.raise_for_status()
                    with tmp.open('wb') as f:
                      for chunk in resp.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                  if tmp.stat().st_size<r['min_bytes'] or tmp.read_bytes()[:5]!=b'%PDF-': raise RuntimeError('invalid PDF')
                  tmp.replace(path); return url
                except Exception as exc:
                  errors.append(repr(exc)); tmp.unlink(missing_ok=True); time.sleep(attempt)
            raise RuntimeError(f'download failed {path.name}: {errors[-6:]}')

          records=[]; hashes=set()
          for r in reports:
            path=OUT/r['filename']; source=download(r,path)
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
            if pages!=r['pages']: raise RuntimeError(f'{path.name}: pages={pages}, expected={r["pages"]}')
            first=(reader.pages[0].extract_text() or '')[:2500].replace('\n',' | ')
            print('FIRST_PAGE_TEXT',path.name,first,flush=True)
            check=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],capture_output=True,text=True)
            if check.returncode: raise RuntimeError(check.stderr[-1500:])
            root=OUT/(path.stem+'_check')
            render=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','96',str(path),str(root)],capture_output=True,text=True)
            png=Path(str(root)+'.png')
            if render.returncode or not png.exists() or png.stat().st_size<8000: raise RuntimeError(f'render failed {path.name}')
            render_bytes=png.stat().st_size; png.unlink()
            data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in hashes: raise RuntimeError('duplicate PDF')
            hashes.add(sha)
            rec={k:v for k,v in r.items() if k not in ('urls','min_bytes')}
            rec.update({'source_pdf_url':source,'bytes':len(data),'sha256':sha,'first_page_render_bytes':render_bytes})
            records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          lines=[
            '上工申贝（集团）股份有限公司（600843.SH）券商深度及重点研究报告精选',
            '整理日期：2026-10-12','',
            '筛选说明：公开渠道中上工申贝的券商覆盖较少。本包收录一份36页公司深度报告、一份21页公司首次覆盖报告和一份19页长篇公司研究报告；均为券商原始排版完整PDF，未用网页摘要或新闻稿凑数。',
            '来源：东方财富研究报告公开文件服务器及公开PDF镜像。',
            '全部PDF已完成文件头、文件大小、页数、qpdf结构、首页渲染、SHA-256与ZIP CRC检查。','',
            '文件清单：'
          ]
          for i,r in enumerate(records,1):
            lines += [
              f"{i}. {r['broker']}，{r['date']}，{r['pages']}页",
              f"   类型：{r['classification']}",f"   标题：{r['title']}",
              f"   分析师：{r['authors']}；评级：{r['rating']}",f"   文件：{r['filename']}",
              f"   信息代码：{r['info_code'] or '无'}",f"   SHA-256：{r['sha256']}",'',
            ]
          (OUT/'00_报告清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as a:
            for p in sorted(OUT.iterdir()): a.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(z) as a:
            if a.testzip(): raise RuntimeError('ZIP CRC failure')
            if len([n for n in a.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('PDF count mismatch')
          print('FINAL_ZIP',z.name,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: shanggongshenbei-600843-brokerage-reports-final-20261012
          path: 上工申贝_600843_券商深度及重点研究报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
