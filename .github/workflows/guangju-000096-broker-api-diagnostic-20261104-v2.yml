name: Probe Guangju 000096 Eastmoney report API

on:
  push:
    branches:
      - tmp/guangju-000096-broker-reports-20261104-v1
    paths:
      - .github/workflows/guangju-000096-broker-api-diagnostic-20261104-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe public report APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests
          import time

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Referer": "https://data.eastmoney.com/report/000096.html",
              "Accept": "application/json,text/plain,*/*",
          })

          base = {
              "industryCode": "*",
              "pageSize": "100",
              "industry": "*",
              "rating": "*",
              "ratingChange": "*",
              "pageNo": "1",
              "fields": "",
              "qType": "0",
              "orgCode": "",
              "rcode": "",
              "p": "1",
              "pageNum": "1",
              "pageNumber": "1",
          }
          variants = []
          for code in ["000096", "SZ000096", "000096.SZ", "96"]:
              for begin, end in [
                  ("2017-01-01", "2026-11-04"),
                  ("20170101", "20261104"),
                  ("2017-01-01", "2030-01-01"),
                  ("2000-01-01", "2030-01-01"),
              ]:
                  p = dict(base)
                  p.update({"code": code, "beginTime": begin, "endTime": end})
                  variants.append(("GET_LIST", p))

          for label, params in variants:
              try:
                  r = s.get("https://reportapi.eastmoney.com/report/list", params=params, timeout=(20, 120))
                  print("===", label, params["code"], params["beginTime"], params["endTime"], "===")
                  print("STATUS", r.status_code, "URL", r.url, "BYTES", len(r.content), "TYPE", r.headers.get("content-type"))
                  print("TEXT", r.text[:1000])
                  try:
                      obj = r.json()
                      print("JSON_KEYS", list(obj.keys()) if isinstance(obj, dict) else type(obj).__name__)
                      if isinstance(obj, dict):
                          data = obj.get("data") or []
                          print("HITS", obj.get("hits"), "SIZE", obj.get("size"), "ROWS", len(data), "TOTALPAGE", obj.get("TotalPage") or obj.get("totalPage"))
                          for row in data[:10]:
                              print("ROW", json.dumps(row, ensure_ascii=False))
                  except Exception as exc:
                      print("JSON_ERROR", repr(exc))
              except Exception as exc:
                  print("REQUEST_ERROR", label, params, repr(exc))
              time.sleep(0.2)

          for code in ["000096", "SZ000096", "000096.SZ"]:
              body = {
                  "pageSize": 100,
                  "pageNo": 1,
                  "p": 1,
                  "pageNum": 1,
                  "pageNumber": 1,
                  "beginTime": "2017-01-01",
                  "endTime": "2026-11-04",
                  "code": code,
                  "industryCode": "*",
                  "rating": None,
                  "ratingChange": None,
                  "orgCode": None,
                  "rcode": "",
              }
              try:
                  r = s.post("https://reportapi.eastmoney.com/report/list2", json=body, headers={"Content-Type":"application/json", "Referer":"https://data.eastmoney.com/report/"}, timeout=(20,120))
                  print("=== POST_LIST2", code, "===")
                  print("STATUS", r.status_code, "BYTES", len(r.content), "TEXT", r.text[:1000])
              except Exception as exc:
                  print("POST_ERROR", code, repr(exc))
          PY
