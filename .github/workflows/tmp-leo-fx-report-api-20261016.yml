name: Inspect Leo FX report endpoints

on:
  push:
    branches: [tmp-leo-broker-reports-20261016]
    paths: ['.github/workflows/tmp-leo-fx-report-api-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public report endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.fxbaogao.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          call() {
            name="$1"; url="$2"
            echo "===== $name ====="
            curl --http1.1 -sSL --retry 3 --connect-timeout 20 --max-time 180 \
              -A "$UA" -H 'Origin: https://www.fxbaogao.com' -H 'Referer: https://www.fxbaogao.com/detail/91485' \
              -D "$name.headers" "$url" -o "$name.body" || true
            sed -n '1,40p' "$name.headers"
            head -c 5000 "$name.body" || true
            echo
          }
          call preview "$BASE/mofoun/report/report/getReportPreviewImages?reportId=91485"
          call detail "$BASE/mofoun/report/searchReport/detail?id=91485"
          call downloadbean "$BASE/mofoun/report/report/downloadReportByBean?reportId=91485"
          call predown "$BASE/mofoun/report/report/report/preDownV2?reportId=91485"
          call filedownload "$BASE/mofoun/report/report/file/downloadReport?reportId=91485"
