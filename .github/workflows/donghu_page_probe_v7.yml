name: probe-donghu-report-pages-v7

on:
  push:
    branches:
      - tmp/donghu-hightech-page-probe-20261104-v7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, json, html
          from urllib.parse import urljoin
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls={
            'sina_2025q1':'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/799312999325/index.phtml',
            'fx_2023first':'https://www.fxbaogao.com/detail/3770114',
            'fx_2023q3':'https://www.fxbaogao.com/detail/3990320',
          }
          for name,url in urls.items():
            print('\n#####',name,url)
            try:
              r=s.get(url,timeout=(10,35),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'))
              enc=r.apparent_encoding or r.encoding or 'utf-8'
              text=r.content.decode(enc,errors='replace')
              print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:2])
              patterns=[
                r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                r'(?i)(?:pdf|download|file|attach|attachment|oss|cos|url)[^\n]{0,800}',
                r'(?i)(?:infoCode|infocode|AP\d{12,})[^\n]{0,500}',
              ]
              seen=set()
              for pi,pat in enumerate(patterns):
                matches=re.findall(pat,text,re.I|re.S) if pi==0 else [re.sub(r'\s+',' ',text[max(0,m.start()-250):min(len(text),m.end()+700)]) for m in list(re.finditer(pat,text,re.I))[:50]]
                print('PATTERN',pi,'COUNT',len(matches))
                for m in matches[:100]:
                  x=html.unescape(m)
                  if x not in seen:
                    seen.add(x); print('MATCH',x[:2000])
              for href in re.findall(r'(?:href|src|data-url|data-src)=["\']([^"\']+)["\']',text,re.I):
                full=urljoin(r.url,html.unescape(href))
                if any(k in full.lower() for k in ['pdf','download','attach','file','report']):
                  if full not in seen:
                    seen.add(full); print('LINK',full)
              print('HEAD',re.sub(r'\s+',' ',text[:4000]))
            except Exception as e:
              print('ERROR',repr(e))
          PY
