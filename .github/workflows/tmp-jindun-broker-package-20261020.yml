name: Build Jindun 300411 broker research report package

on:
  push:
    branches: [tmp-jindun-300411-broker-reports-20261020]
    paths: ['.github/workflows/tmp-jindun-broker-package-20261020.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='金盾股份_券商公司研究报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            curl --http1.1 -fL --retry 7 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=300411' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 50000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 10 "$out" "$out.txt" 2>/dev/null
            grep -Eq '浙江金盾风机股份有限公司|金盾股份|金盾风机' "$out.txt"
            rm -f "$out.txt"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.render" >/dev/null 2>&1
            test -s "$out.render.png"
            rm -f "$out.render.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201706200659103773_1.pdf' \
            "$PACKAGE/01_民生证券_定增获批助力未来发展军民融合新星冉冉升起_2017-06-16.pdf" \
            4

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201702160345623365_1.pdf' \
            "$PACKAGE/02_太平洋证券_主营业务增速稳定转型军工值得期待_2017-02-14.pdf" \
            5

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201702150342703144_1.pdf' \
            "$PACKAGE/03_民生证券_地铁隧道风机龙头地位稳固关注军工转型进展_2017-02-13.pdf" \
            4

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('金盾股份_券商公司研究报告_3份')
          meta = {
              '01_民生证券_定增获批助力未来发展军民融合新星冉冉升起_2017-06-16.pdf': {
                  'broker': '民生证券',
                  'date': '2017-06-16',
                  'analyst': '刘振宇、樊艳阳',
                  'title': '定增获批助力未来发展，军民融合新星冉冉升起',
                  'index': 'AP201706200659103773',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201706200659103773_1.pdf',
              },
              '02_太平洋证券_主营业务增速稳定转型军工值得期待_2017-02-14.pdf': {
                  'broker': '太平洋证券',
                  'date': '2017-02-14',
                  'analyst': '刘倩倩',
                  'title': '主营业务增速稳定，转型军工值得期待',
                  'index': 'AP201702160345623365',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201702160345623365_1.pdf',
              },
              '03_民生证券_地铁隧道风机龙头地位稳固关注军工转型进展_2017-02-13.pdf': {
                  'broker': '民生证券',
                  'date': '2017-02-13',
                  'analyst': '朱金岩、刘振宇、李勇鹏、樊艳阳',
                  'title': '地铁、隧道风机龙头地位稳固，关注军工转型进展',
                  'index': 'AP201702150342703144',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201702150342703144_1.pdf',
              },
          }
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '金盾股份（300411）券商公司研究报告资料包',
              '整理日期：2026-10-20',
              '',
              '重要说明：',
              '1. 公开券商研报索引中仅检索到以下3份可直接下载并独立校验的完整公司研究PDF。',
              '2. 三份报告均为4—5页的完整公司研究/事件更新报告，不是10页以上的长篇深度报告。',
              '3. 已排除网页摘要、财务公告和非券商材料；文件均为券商原始PDF。',
              '4. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL)
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；日期：{item['date']}；研究员：{item['analyst']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  PDF来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、页数、正文公司名称及首页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Jindun-300411-broker-company-research-reports-3
          path: 金盾股份_券商公司研究报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
