name: Inspect FinancialFilings archives for historical Guoji Zhongzhuang reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-financialfilings-discover-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect company archive years and filing links
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          base='https://financialfilings.com/companies/sinomach-heavy-equipment-group-coltd/{}/'
          for y in range(2015,2027):
            u=base.format(y)
            try:
              r=s.get(u,timeout=30,allow_redirects=True)
              print('\nYEAR',y,'STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content))
              text=r.text
              if r.status_code!=200: print('HEAD',repr(text[:500])); continue
              for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                clean=re.sub('<[^>]+>',' ',label); clean=re.sub(r'\s+',' ',clean).strip()
                if any(k in (clean+' '+href).lower() for k in ('annual report','年度报告','relisting','重新上市','prospectus','招股')):
                  print('LINK',urljoin(r.url,href),repr(clean))
              for m in re.finditer(r'([\w-]+_rns_[^"\'<> ]+\.pdf)',text,re.I): print('PDFNAME',m.group(1))
            except Exception as exc: print('ERR',y,repr(exc))
          PY
