name: Probe fxbaogao 1422001 with Playwright 20260927

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-1422001-playwright-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright requests
          python -m playwright install --with-deps chromium

      - name: Load page and capture public report resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import asyncio, hashlib, json, re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          OUT=Path('probe'); OUT.mkdir(exist_ok=True)
          network=[]
          pdf_urls=[]
          saved_json=[]

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  context=await browser.new_context(
                      viewport={'width':1440,'height':1400},
                      locale='zh-CN',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
                  )
                  page=await context.new_page()

                  async def on_response(resp):
                      try:
                          ct=(resp.headers.get('content-type') or '').lower()
                          url=resp.url
                          rec={'url':url,'status':resp.status,'content_type':ct,'resource_type':resp.request.resource_type,'method':resp.request.method}
                          network.append(rec)
                          low=url.lower()
                          if 'application/pdf' in ct or re.search(r'\.pdf(?:$|[?#])',low):
                              pdf_urls.append(url)
                              try:
                                  body=await resp.body()
                                  if body.startswith(b'%PDF-') and len(body)>100000:
                                      fn=OUT/f'captured_{len(pdf_urls):02d}_{hashlib.sha256(body).hexdigest()[:12]}.pdf'
                                      fn.write_bytes(body)
                                      print('CAPTURED_PDF',fn,len(body),url,flush=True)
                              except Exception as e:
                                  print('PDF_BODY_ERR',url,repr(e),flush=True)
                          if ('json' in ct or resp.request.resource_type in ('xhr','fetch')) and any(k in low for k in ('report','detail','pdf','download','file','api','1422001')):
                              try:
                                  body=await resp.body()
                                  if len(body)<=5_000_000:
                                      idx=len(saved_json)+1
                                      fn=OUT/f'response_{idx:03d}.bin'
                                      fn.write_bytes(body)
                                      saved_json.append({'file':fn.name,**rec,'bytes':len(body)})
                                      sample=body[:5000].decode('utf-8','replace')
                                      print('API_RESPONSE',idx,json.dumps(rec,ensure_ascii=False),sample[:3000].replace('\n',' '),flush=True)
                              except Exception as e:
                                  print('RESP_BODY_ERR',url,repr(e),flush=True)
                      except Exception as e:
                          print('ON_RESPONSE_ERR',repr(e),flush=True)

                  page.on('response',on_response)
                  popups=[]
                  async def on_popup(popup):
                      popups.append(popup)
                      print('POPUP',popup.url,flush=True)
                  page.on('popup',on_popup)

                  url='https://www.fxbaogao.com/detail/1422001'
                  try:
                      await page.goto(url,wait_until='domcontentloaded',timeout=120000)
                  except Exception as e:
                      print('GOTO_ERR',repr(e),flush=True)
                  await page.wait_for_timeout(12000)
                  print('TITLE',await page.title(),flush=True)
                  print('CURRENT_URL',page.url,flush=True)
                  body_text=(await page.locator('body').inner_text())[:20000]
                  print('BODY_BEFORE',body_text,flush=True)
                  await page.screenshot(path=str(OUT/'before.png'),full_page=True)
                  (OUT/'before.html').write_text(await page.content(),encoding='utf-8')

                  elems=[]
                  for sel in ['a','button','[role="button"]','iframe']:
                      loc=page.locator(sel)
                      n=min(await loc.count(),300)
                      for i in range(n):
                          el=loc.nth(i)
                          try:
                              txt=' '.join((await el.inner_text()).split())[:300]
                          except Exception:
                              txt=''
                          try:
                              href=await el.get_attribute('href') or await el.get_attribute('src') or ''
                          except Exception:
                              href=''
                          elems.append({'selector':sel,'index':i,'text':txt,'href_or_src':href})
                  print('ELEMENTS',json.dumps(elems,ensure_ascii=False,indent=2)[:60000],flush=True)
                  (OUT/'elements.json').write_text(json.dumps(elems,ensure_ascii=False,indent=2),encoding='utf-8')

                  clicked=False
                  texts=['点击免费查看完整报告','免费查看完整报告','查看完整报告','阅读全文','立即查看','PDF下载','下载报告']
                  for txt in texts:
                      try:
                          loc=page.get_by_text(txt,exact=False)
                          count=await loc.count()
                          print('CLICK_CANDIDATE',txt,count,flush=True)
                          if count:
                              await loc.first.click(timeout=10000,force=True)
                              clicked=True
                              print('CLICKED',txt,flush=True)
                              break
                      except Exception as e:
                          print('CLICK_ERR',txt,repr(e),flush=True)
                  if not clicked:
                      # Try links/buttons containing report-related words.
                      for item in elems:
                          if item['text'] and any(k in item['text'] for k in ['完整报告','查看报告','免费下载','下载']):
                              try:
                                  await page.locator(item['selector']).nth(item['index']).click(timeout=10000,force=True)
                                  print('CLICKED_FALLBACK',json.dumps(item,ensure_ascii=False),flush=True)
                                  clicked=True
                                  break
                              except Exception as e:
                                  print('CLICK_FALLBACK_ERR',repr(e),flush=True)
                  await page.wait_for_timeout(15000)
                  print('AFTER_URL',page.url,flush=True)
                  body_after=(await page.locator('body').inner_text())[:30000]
                  print('BODY_AFTER',body_after,flush=True)
                  await page.screenshot(path=str(OUT/'after.png'),full_page=True)
                  (OUT/'after.html').write_text(await page.content(),encoding='utf-8')

                  # Inspect frames after click.
                  frames=[]
                  for fr in page.frames:
                      try:
                          frtxt=(await fr.locator('body').inner_text())[:10000]
                      except Exception:
                          frtxt=''
                      frames.append({'url':fr.url,'name':fr.name,'text':frtxt})
                      print('FRAME',fr.url,fr.name,frtxt[:3000],flush=True)
                  (OUT/'frames.json').write_text(json.dumps(frames,ensure_ascii=False,indent=2),encoding='utf-8')

                  # Direct-download any publicly exposed PDF URL seen on the page/network.
                  for i,pdf_url in enumerate(dict.fromkeys(pdf_urls),1):
                      try:
                          resp=await context.request.get(pdf_url,timeout=120000)
                          data=await resp.body()
                          print('PDF_FETCH',i,resp.status,len(data),pdf_url,flush=True)
                          if resp.status==200 and data.startswith(b'%PDF-') and len(data)>100000:
                              (OUT/f'direct_{i:02d}_{hashlib.sha256(data).hexdigest()[:12]}.pdf').write_bytes(data)
                      except Exception as e:
                          print('PDF_FETCH_ERR',pdf_url,repr(e),flush=True)

                  (OUT/'network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
                  (OUT/'saved_responses.json').write_text(json.dumps(saved_json,ensure_ascii=False,indent=2),encoding='utf-8')
                  print('PDF_URLS',json.dumps(list(dict.fromkeys(pdf_urls)),ensure_ascii=False,indent=2),flush=True)
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-1422001-playwright-probe
          path: probe
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
