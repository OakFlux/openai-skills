name: chatgpt-temp-sdyanbao-js-inspect
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-sdyanbao-js-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JavaScript bundles and find report-download endpoints
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python <<'PY'
          import asyncio,json,os,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          W=Path('sdyanbao_js');W.mkdir(exist_ok=True)
          async def main():
            async with async_playwright() as p:
              exe=next((x for x in ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'] if os.path.exists(x)),None)
              b=await p.chromium.launch(headless=True,executable_path=exe,args=['--no-sandbox','--disable-dev-shm-usage'])
              c=await b.new_context(user_agent='Mozilla/5.0 Chrome/152 Safari/537.36',locale='zh-CN')
              page=await c.new_page();await page.goto('https://www.sdyanbao.com/detail/886387',wait_until='domcontentloaded',timeout=120000);await page.wait_for_timeout(5000)
              srcs=await page.evaluate('()=>[...document.scripts].map(s=>s.src).filter(Boolean)')
              print('SCRIPTS',json.dumps(srcs,ensure_ascii=False),flush=True)
              matches=[]
              for i,u in enumerate(srcs):
                try:
                  r=await c.request.get(u,timeout=120000,fail_on_status_code=False);body=await r.body();f=W/f'{i:02d}.js';f.write_bytes(body);text=body.decode('utf-8','replace')
                  print('FETCH',i,r.status,len(body),u,flush=True)
                  for token in ['api/file','download','original_id','originalId','online_url','onlineUrl','file/detail','file/download','downLoad','getDownload','qrcode','cover-unlock','data_source_uuid','dataSourceUuid']:
                    pos=0;n=0
                    while n<40:
                      j=text.lower().find(token.lower(),pos)
                      if j<0:break
                      ctx=text[max(0,j-2500):min(len(text),j+5000)]
                      row={'script':i,'url':u,'token':token,'pos':j,'context':ctx};matches.append(row);print('MATCH',i,token,j,ctx[:7500],flush=True)
                      pos=j+len(token);n+=1
                except Exception as e:print('ERROR',i,u,repr(e),flush=True)
              (W/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8');await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sdyanbao-JS-Download-Handler-Inspection
          path: sdyanbao_js
          retention-days: 1
          compression-level: 6
