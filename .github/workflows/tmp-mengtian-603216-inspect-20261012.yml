name: Inspect Mengtian Broker Report Sources

on:
  push:
    branches:
      - tmp-mengtian-603216-broker-reports-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect report indexes and detail pages
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          out=[]
          for symbol in ('sh603216','603216'):
            for page in range(1,6):
              u=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol={symbol}&t1=all&p={page}'
              r=s.get(u,timeout=40); print('LIST',symbol,page,r.status_code,len(r.content)); r.encoding=r.apparent_encoding or 'gb18030'
              soup=BeautifulSoup(r.text,'html.parser'); found=0
              for a in soup.find_all('a',href=True):
                href=urljoin(u,a['href']); title=' '.join(a.get_text(' ',strip=True).split())
                if 'vReport_Show' not in href: continue
                m=re.search(r'/rptid/(\d+)/',href)
                if not m: continue
                found+=1
                rec={'symbol':symbol,'page':page,'rptid':m.group(1),'title':title,'url':href}
                try:
                  d=s.get(href,timeout=40); d.encoding=d.apparent_encoding or 'gb18030'; html=d.text
                  ds=BeautifulSoup(html,'html.parser')
                  fulltext='\n'.join(x.strip() for x in ds.stripped_strings)
                  rec['detail_status']=d.status_code; rec['detail_len']=len(d.content)
                  rec['title_tag']=ds.title.get_text(' ',strip=True) if ds.title else ''
                  rec['pdf_urls']=sorted(set(re.findall(r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',html,re.I)))
                  rec['interesting_lines']=[line.strip()[:1000] for line in html.splitlines() if any(k in line.lower() for k in ('pdf','download','attach','reporturl','fileurl'))][:20]
                  rec['text_sample']=fulltext[:5000]
                except Exception as e:
                  rec['detail_error']=repr(e)
                out.append(rec)
                print(json.dumps(rec,ensure_ascii=False))
              if found==0: break
          # Try Eastmoney APIs with alternate stock formats.
          api_rows=[]
          for code in ('603216','SH603216','603216.SH'):
            for qtype in ('0','1'):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31','pageNo':'1','fields':'','qType':qtype,'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=40)
                data=r.json(); print('EM',code,qtype,r.status_code,json.dumps(data,ensure_ascii=False)[:5000])
                api_rows.append({'code':code,'qtype':qtype,'status':r.status_code,'data':data})
              except Exception as e: print('EMERR',code,qtype,e)
          import pathlib
          pathlib.Path('inspect-output').mkdir(exist_ok=True)
          pathlib.Path('inspect-output/sina_records.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('inspect-output/eastmoney_responses.json').write_text(json.dumps(api_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Mengtian-603216-Report-Inspection
          path: inspect-output/*
          retention-days: 3
