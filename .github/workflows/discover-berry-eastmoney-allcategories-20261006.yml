name: Discover Berry Eastmoney reports across categories

on:
  pull_request:
    paths:
      - 'tasks/berry-eastmoney-allcategories-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query all report categories and date windows
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)))
          windows=[('2019-01-01','2021-12-31'),('2022-01-01','2026-10-06')]
          found=[]
          for begin,end in windows:
            for qtype in range(0,8):
              for code in ('000710',''):
                for page in range(1,15):
                  params={'industryCode':'*','pageSize':'5000','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':str(qtype),'orgCode':'','code':code,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(25,180))
                  print('QUERY',begin,end,qtype,code or '<blank>',page,r.status_code,len(r.content),flush=True)
                  if r.status_code!=200: break
                  try: payload=r.json()
                  except Exception as e: print('JSONERR',repr(e),r.text[:200],flush=True);break
                  batch=payload.get('data') or []
                  for row in batch:
                    blob=json.dumps(row,ensure_ascii=False)
                    title=str(row.get('title') or '')
                    if '贝瑞基因' in blob or '贝瑞和康' in blob or '000710' in blob or any(k in title for k in ('解码生命经纬','基因测序行业的领头羊','肿瘤早筛')):
                      rec=dict(row);rec['_qType']=qtype;rec['_queryCode']=code;rec['_window']=[begin,end];found.append(rec)
                      print('MATCH',json.dumps({k:rec.get(k) for k in ('_qType','infoCode','title','orgSName','publishDate','attachPages','stockName','stockCode')},ensure_ascii=False),flush=True)
                  total=int(payload.get('TotalPage') or 1)
                  if page>=total or len(batch)<5000: break
          uniq={}
          for row in found:
            key=str(row.get('infoCode') or (row.get('title'),row.get('orgSName'),row.get('publishDate')));uniq[key]=row
          rows=list(uniq.values());rows.sort(key=lambda x:str(x.get('publishDate') or ''),reverse=True)
          Path('output/matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL',len(rows),flush=True)
          print(json.dumps([{k:r.get(k) for k in ('_qType','infoCode','title','orgSName','publishDate','attachPages','stockName','stockCode')} for r in rows],ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: berry-eastmoney-allcategories
          path: output/matches.json
          retention-days: 7
          if-no-files-found: error
