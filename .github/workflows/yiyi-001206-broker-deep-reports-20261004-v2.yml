name: Build Yiyi 001206 broker deep reports 20261004

on:
  push:
    paths:
      - '.github/workflows/yiyi-001206-broker-deep-reports-20261004-v2.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '001206'
          COMPANY = '依依股份'
          FULL_COMPANY = '天津市依依卫生用品股份有限公司'
          TODAY = '2026-10-04'
          WORK = Path('yiyi_001206_broker_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL_ROOT = WORK / 'final'
          ART = Path('artifact_out')
          for path in (DOWNLOADS, FINAL_ROOT, ART):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,application/pdf,*/*;q=0.01',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:105]

          def get_json(url: str, params: dict) -> dict:
              last = None
              for attempt in range(1, 5):
                  try:
                      response = session.get(url, params=params, timeout=(25, 150))
                      print('API', attempt, response.status_code, len(response.content), response.url, flush=True)
                      response.raise_for_status()
                      return response.json()
                  except Exception as exc:
                      last = exc
                      print('API_ERR', attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'API failed: {last!r}')

          api = 'https://reportapi.eastmoney.com/report/list'
          rows = []
          for page in range(1, 8):
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2019-01-01', 'endTime': TODAY,
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'code': CODE, 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              payload = get_json(api, params)
              batch = payload.get('data') or []
              print('BATCH', page, len(batch), flush=True)
              if not batch:
                  break
              rows.extend(batch)
              if len(batch) < 100:
                  break

          unique = {}
          for row in rows:
              blob = json.dumps(row, ensure_ascii=False)
              if CODE not in blob and COMPANY not in blob:
                  continue
              key = str(row.get('infoCode') or row.get('id') or blob)
              unique[key] = row
          metadata = list(unique.values())
          metadata.sort(key=lambda item: str(item.get('publishDate') or ''), reverse=True)
          (WORK / 'all_metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          print('METADATA_COUNT', len(metadata), flush=True)
          if not metadata:
              raise RuntimeError('No broker-report metadata found for 001206')

          preferred_phrases = [
              '宠物卫生护理龙头稳健增长',
              '宠物护理用品畅销全球',
              '宠物护理用品龙头竞争优势凸显',
              '需求恢复助弹性',
              '需求有望进一步修复',
              '产业链整合',
          ]
          preferred_terms = [
              '深度', '首次覆盖', '公司深度', '覆盖报告', '首次',
              '宠物护理', '宠物卫生', '宠物用品', '龙头', '全球',
              '需求修复', '竞争优势', '成长', '产能', '出海', '产业链',
          ]
          shallow_terms = [
              '点评', '季报', '年报点评', '中报点评', '业绩点评', '快报',
              '简评', '事件点评', '跟踪点评', '月报', '纪要', '交流纪要',
          ]

          def meta_score(row: dict) -> tuple:
              title = str(row.get('title') or '')
              low = title.lower()
              score = sum(8 for term in preferred_terms if term.lower() in low)
              score += sum(35 for phrase in preferred_phrases if phrase in title)
              if any(term in title for term in ['深度', '首次覆盖', '覆盖报告', '公司深度']):
                  score += 40
              score -= sum(18 for term in shallow_terms if term in title)
              year = int(str(row.get('publishDate') or '0')[:4] or 0)
              return (score, year, str(row.get('publishDate') or ''))

          candidates = sorted(metadata, key=meta_score, reverse=True)[:120]
          valid = []
          seen_sha = set()

          def download_report(info_code: str, target: Path) -> str:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              errors = []
              for url in urls:
                  try:
                      response = session.get(url, timeout=(30, 240), allow_redirects=True)
                      print('PDF', info_code, response.status_code, len(response.content), url, 'FINAL', response.url, flush=True)
                      if response.status_code == 200 and len(response.content) > 100_000 and response.content.startswith(b'%PDF-'):
                          target.write_bytes(response.content)
                          return str(response.url)
                  except Exception as exc:
                      errors.append(repr(exc))
              raise RuntimeError('; '.join(errors) or 'no valid PDF variant')

          aliases = [CODE, COMPANY, FULL_COMPANY, 'YIYI', 'Yiyi']

          for row in candidates:
              if len(valid) >= 20:
                  break
              info_code = str(row.get('infoCode') or '')
              if not info_code:
                  continue
              title = str(row.get('title') or '').strip() or info_code
              broker = str(row.get('orgSName') or row.get('orgName') or '未知券商').strip()
              publish_date = str(row.get('publishDate') or '')[:10]
              if any(term in title for term in shallow_terms):
                  continue
              target = DOWNLOADS / f'{info_code}.pdf'
              try:
                  source_url = download_report(info_code, target)
                  reader = PdfReader(str(target), strict=False)
                  pages = len(reader.pages)
                  indices = list(range(min(22, pages)))
                  if pages > 25:
                      indices.extend(range(max(0, pages - 3), pages))
                  parts = []
                  for index in dict.fromkeys(indices):
                      try:
                          parts.append(reader.pages[index].extract_text() or '')
                      except Exception:
                          pass
                  sample = '\n'.join(parts)
                  low = sample.lower()
                  identity = any(alias.lower() in low for alias in aliases)
                  research = (
                      any(marker in sample for marker in ['证券研究报告', '公司研究', '深度研究', '首次覆盖', '公司深度'])
                      or 'equity research' in low
                      or any(marker in title for marker in ['深度', '首次覆盖', '覆盖报告', '公司深度'])
                  )
                  if not identity or not research or pages < 12:
                      print('REJECT', info_code, title, pages, identity, research, flush=True)
                      target.unlink(missing_ok=True)
                      continue
                  check = subprocess.run(['qpdf', '--check', str(target)], capture_output=True, text=True)
                  if check.returncode not in (0, 3):
                      raise RuntimeError('qpdf check failed: ' + check.stderr[-1000:])
                  data = target.read_bytes()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in seen_sha:
                      target.unlink(missing_ok=True)
                      continue
                  seen_sha.add(digest)
                  title_low = title.lower()
                  keyword_score = sum(8 for term in preferred_terms if term.lower() in title_low)
                  keyword_score += sum(40 for phrase in preferred_phrases if phrase in title)
                  if any(term in title for term in ['深度', '首次覆盖', '覆盖报告', '公司深度']):
                      keyword_score += 42
                  page_score = 30 if pages >= 45 else 26 if pages >= 35 else 22 if pages >= 25 else 18 if pages >= 18 else 12
                  year = int(publish_date[:4]) if re.match(r'20\d{2}', publish_date) else 0
                  recent_score = max(0, year - 2020) * 3
                  score = keyword_score + page_score + recent_score
                  record = {
                      'info_code': info_code,
                      'title': title,
                      'broker': broker,
                      'publish_date': publish_date,
                      'pages': pages,
                      'bytes': len(data),
                      'sha256': digest,
                      'source_url': source_url,
                      'score': score,
                      'file': str(target),
                  }
                  valid.append(record)
                  print('VALID', json.dumps({key: record[key] for key in ('title','broker','publish_date','pages','score')}, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('PROBE_ERR', info_code, title, repr(exc), flush=True)
                  target.unlink(missing_ok=True)

          if len(valid) < 2:
              raise RuntimeError(f'Only {len(valid)} valid long-form reports found')

          valid.sort(key=lambda item: (item['score'], item['pages'], item['publish_date']), reverse=True)
          selected = []
          used_brokers = set()
          for record in valid:
              if record['broker'] in used_brokers:
                  continue
              selected.append(record)
              used_brokers.add(record['broker'])
              if len(selected) == 3:
                  break
          if len(selected) < 3:
              for record in valid:
                  if record not in selected:
                      selected.append(record)
                  if len(selected) == 3:
                      break
          selected = selected[:3]

          package = f'依依股份_001206_券商深度报告_{len(selected)}份_公开完整PDF'
          final_dir = FINAL_ROOT / package
          final_dir.mkdir(parents=True, exist_ok=True)
          manifest = []
          for index, record in enumerate(selected, 1):
              filename = f'{index:02d}_{safe(record["publish_date"])}_{safe(record["broker"])}_{safe(record["title"])}.pdf'
              destination = final_dir / filename
              shutil.copy2(record['file'], destination)
              manifest.append({
                  'filename': filename,
                  'broker': record['broker'],
                  'title': record['title'],
                  'publish_date': record['publish_date'],
                  'pages': record['pages'],
                  'bytes': record['bytes'],
                  'sha256': record['sha256'],
                  'source_url': record['source_url'],
                  'info_code': record['info_code'],
              })

          readme = [
              '依依股份（001206.SZ；天津市依依卫生用品股份有限公司）券商深度报告合集',
              '整理日期：2026-10-04',
              '',
              '筛选标准：公开可直接下载的完整PDF；公司身份和券商研究属性可核验；优先首次覆盖、公司深度或长篇研究；剔除季报、年报及事件短评；尽量分散券商来源。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(manifest, 1):
              readme += [
                  f'{index}. {record["filename"]}',
                  f'   券商：{record["broker"]}',
                  f'   标题：{record["title"]}',
                  f'   日期：{record["publish_date"]}；页数：{record["pages"]}',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查PDF文件头、公司身份、券商研究标识、实际页数、qpdf结构、重复文件及SHA-256；最终ZIP已通过CRC测试。')
          (final_dir / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (final_dir / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (final_dir / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in manifest), encoding='utf-8')

          zip_path = ART / f'{package}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(final_dir.iterdir()):
                  archive.write(path, arcname=f'{package}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)} vs {len(manifest)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('SELECTED_FINAL', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: yiyi-001206-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
