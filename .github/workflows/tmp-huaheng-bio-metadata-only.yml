name: Temporary Huaheng Biotech metadata only

on:
  push:
    branches:
      - tmp-huaheng-bio-reports-20260830
    paths:
      - .github/workflows/tmp-huaheng-bio-metadata-only.yml

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print substantial report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/688639.html','Accept':'application/json,text/plain,*/*'})
          body={'pageSize':300,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':'2020-01-01','endTime':'2026-08-30','code':'688639','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
          r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'Referer':'https://data.eastmoney.com/','Content-Type':'application/json','Accept':'application/json,text/plain,*/*'},timeout=60)
          print('HTTP',r.status_code,len(r.content),r.headers.get('content-type'))
          r.raise_for_status(); obj=r.json(); rows=obj.get('data') or []
          print('HITS',obj.get('hits'),'ROWS',len(rows))
          for row in rows:
              pages=int(row.get('attachPages') or 0); title=str(row.get('title') or '')
              if pages>=10 or any(k in title for k in ['深度','首次覆盖','首次覆盖报告','公司首次覆盖']):
                  print('REPORT',json.dumps({
                      'date':str(row.get('publishDate') or '')[:10],
                      'broker':row.get('orgSName') or row.get('orgName'),
                      'title':title,'pages':pages,'size':row.get('attachSize'),
                      'infoCode':row.get('infoCode'),'rating':row.get('emRatingName') or row.get('sRatingName'),
                      'researcher':row.get('researcher'),'column':row.get('column'),'indvIsNew':row.get('indvIsNew')
                  },ensure_ascii=False))
          PY
