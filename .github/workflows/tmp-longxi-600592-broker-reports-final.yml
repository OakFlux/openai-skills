name: Build Available Longxi 600592 Broker Reports

on:
  push:
    branches:
      - tmp-longxi-600592-broker-reports-20261004

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pypdf pymupdf

      - name: Download, verify and package available original reports
        shell: bash
        run: |
          cat > /tmp/package_longxi.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import pymupdf
          import requests
          from pypdf import PdfReader

          OUT = Path('output')
          SEL = OUT / 'selected'
          REND = OUT / 'renders'
          SEL.mkdir(parents=True, exist_ok=True)
          REND.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'title': '关节轴承隐形冠军，有望充分受益人形机器人发展机遇',
                  'org': '国信证券',
                  'date': '2025-04-16',
                  'authors': '吴双、年亚颂',
                  'type': '公司深度报告',
                  'info_code': 'AP202504161657388483',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202504161657388483_1.pdf',
              },
              {
                  'title': '轴承核心业务稳健增长，全方位布局人形机器人产业',
                  'org': '国信证券',
                  'date': '2025-05-09',
                  'authors': '吴双、年亚颂',
                  'type': '公司跟踪报告',
                  'info_code': 'AP202505091669891613',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202505091669891613_1.pdf',
              },
              {
                  'title': '上半年收入利润承压，持续加强人形等新兴领域投入',
                  'org': '国信证券',
                  'date': '2025-08-27',
                  'authors': '报告原文列示',
                  'type': '中报跟踪报告',
                  'info_code': 'AP202508271735402107',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202508271735402107_1.pdf',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                            '(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
          })

          def safe_name(text: str, limit: int = 100) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', '_', text or '')
              text = re.sub(r'\s+', '_', text).strip(' ._')
              return text[:limit]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          manifest = []
          for idx, rec in enumerate(reports, 1):
              filename = f"{idx:02d}_{safe_name(rec['org'],20)}_{safe_name(rec['date'],12)}_{safe_name(rec['title'],80)}.pdf"
              path = SEL / filename
              with session.get(rec['url'], stream=True, timeout=120, allow_redirects=True) as r:
                  r.raise_for_status()
                  with path.open('wb') as f:
                      for chunk in r.iter_content(1024 * 256):
                          if chunk:
                              f.write(chunk)
              if path.stat().st_size < 80_000 or path.read_bytes()[:5] != b'%PDF-':
                  raise RuntimeError(f'Invalid PDF payload: {filename}')
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < 5:
                  raise RuntimeError(f'Unexpected page count {pages}: {filename}')
              opening = ''
              for p in reader.pages[:min(5,pages)]:
                  try:
                      opening += p.extract_text() or ''
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', opening)
              if '龙溪股份' not in compact and '600592' not in compact and '福建龙溪轴承' not in compact:
                  raise RuntimeError(f'Company identity not found: {filename}')
              doc = pymupdf.open(path)
              if doc.page_count != pages:
                  raise RuntimeError(f'Page count mismatch: {filename}')
              render_dir = REND / f'r{idx}'
              render_dir.mkdir(parents=True, exist_ok=True)
              for pno in sorted(set([0, pages // 2, pages - 1])):
                  out = render_dir / f'page-{pno+1}.png'
                  doc.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(1,1), alpha=False).save(out)
                  if out.stat().st_size < 4000:
                      raise RuntimeError(f'Blank render: {filename} page {pno+1}')
              doc.close()
              item = dict(rec)
              item.update({
                  'pages': pages,
                  'size_bytes': path.stat().st_size,
                  'package_filename': filename,
                  'sha256': sha256(path),
              })
              manifest.append(item)
              print(f"Accepted {filename}: {pages} pages")

          readme = [
              '# 龙溪股份（600592）券商研究报告原始PDF整理包',
              '',
              f'整理时间：{datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}',
              '',
              '公开个股研报库目前可直接下载并核验的文件共3份，其中1份为完整公司深度报告，另外2份为公司跟踪报告。',
              '华源证券2025年7月44页首次覆盖报告可核验报告信息和首页预览，但原始PDF下载受登录/权限限制，未放入本包，也未用摘要版冒充原始PDF。',
              '所有收录文件均为公开链接直接下载的券商原始PDF；已检查PDF文件头、页面树、公司标识，并渲染抽查首页、中间页和末页。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"## {i}. {item['title']}",
                  f"- 机构：{item['org']}",
                  f"- 日期：{item['date']}",
                  f"- 类型：{item['type']}",
                  f"- 页数：{item['pages']}",
                  f"- 分析师：{item['authors']}",
                  f"- 文件：`{item['package_filename']}`",
                  f"- 原始公开PDF：{item['url']}",
                  f"- SHA-256：`{item['sha256']}`",
                  '',
              ]
          readme += [
              '## 已核验但未收入的深度报告',
              '',
              '- 华源证券，赵梦妮，2025-07-20/21：《关节轴承龙头，龙轴再迎机器人新机遇》，44页，首次覆盖“买入”。公开页面仅提供预览与受权限控制的下载入口。',
              '',
          ]
          (SEL / 'README_文件清单与来源.md').write_text('\n'.join(readme), encoding='utf-8')
          (SEL / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (SEL / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{x['sha256']}  {x['package_filename']}" for x in manifest) + '\n', encoding='utf-8')

          zip_cn = OUT / '龙溪股份_600592_券商研究报告_原始PDF_3份_20261004.zip'
          zip_en = OUT / 'Longxi_Bearing_600592_Broker_Research_Original_PDFs_3_20261004.zip'
          for zp in (zip_cn, zip_en):
              with zipfile.ZipFile(zp, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
                  for p in sorted(SEL.iterdir()):
                      zf.write(p, arcname=p.name)
              with zipfile.ZipFile(zp) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')
              print(f'Created {zp.name}: {zp.stat().st_size} bytes; SHA256={sha256(zp)}')

          summary = {
              'count': len(manifest),
              'reports': manifest,
              'zip_cn': str(zip_cn),
              'zip_cn_sha256': sha256(zip_cn),
              'zip_en': str(zip_en),
              'zip_en_sha256': sha256(zip_en),
          }
          (OUT / 'package_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/package_longxi.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Longxi-600592-Available-Broker-Reports
          path: |
            output/*.zip
            output/package_summary.json
          if-no-files-found: error
          retention-days: 3
