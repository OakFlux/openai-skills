name: Targeted scan Haitian International Hangyan
on:
  push:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Scan target date window
        run: |
          python - <<'PY'
          import concurrent.futures,json,requests
          from bs4 import BeautifulSoup
          pages=list(range(740,981))
          terms=('海天国际','制造业产能再分布','全球注塑机龙头')
          def get(n):
            try:
              r=requests.get('https://www.hangyan.co/reports',params={'page':n},headers={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'},timeout=20)
              if r.status_code!=200: return n,[],f'HTTP {r.status_code}'
              soup=BeautifulSoup(r.text,'html.parser'); hits=[]
              for a in soup.select('a[data-controller="protected-link"]'):
                title=a.get_text(' ',strip=True)
                if any(t in title for t in terms):
                  parent=a.find_parent('div',class_=lambda c:c and 'box' in c.split())
                  meta=parent.get_text(' ',strip=True) if parent else title
                  hits.append({'page':n,'title':title,'meta':meta,'token':a.get('data-protected-link-token-value',''),'outer':str(a)[:3000]})
              return n,hits,None
            except Exception as e: return n,[],repr(e)
          found=[]; errs=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            for n,h,e in ex.map(get,pages):
              if h:
                found.extend(h); print('MATCH',json.dumps(h,ensure_ascii=False))
              if e: errs.append((n,e))
          print('FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          print('ERRORS',len(errs),errs[:30])
          if not found: raise SystemExit('No matches')
          PY
