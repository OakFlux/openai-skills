name: Inspect Shimao Group HK IR site 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-hk-ir-discovery-20261012.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect current IR site
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re, json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-TW,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://www.shimaogroup.hk/zh-TW/Shimao/Index',
            'https://www.shimaogroup.hk/en/Shimao/Index',
            'https://www.shimaogroup.hk/zh-CN/Shimao/Index',
            'https://www.shimaogroup.hk/',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=120,allow_redirects=True)
              print('\nPAGE',url,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,flush=True)
              text=r.text
              print('HEAD',text[:8000].replace('\n',' '),flush=True)
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for tag in soup.find_all(['a','script','link','iframe','source','form']):
                for attr in ('href','src','action','data-url','data-href','data-src','data-api'):
                  v=tag.get(attr)
                  if v:
                    full=urljoin(r.url,v)
                    if full not in links: links.append(full)
              for v in links:
                if any(k in v.lower() for k in ['pdf','report','annual','interim','financial','api','ajax','download','upload','json','js','shimao']):
                  print('LINK',v,flush=True)
              patterns=[
                r'https?://[^\"\'<> ]+\.pdf(?:\?[^\"\'<> ]*)?',
                r'[^\"\'<> ]+\.pdf(?:\?[^\"\'<> ]*)?',
                r'/Upload/DownloadFile/[^\"\'<> ]+',
                r'/(?:api|ajax)/[^\"\'<> ]+',
                r'url\s*[:=]\s*[\"\'][^\"\']+',
                r'financial[^\n]{0,500}',
              ]
              for p in patterns:
                vals=[]
                for m in re.findall(p,text,re.I):
                  if isinstance(m,tuple): m=' '.join(m)
                  if m not in vals: vals.append(m)
                for v in vals[:500]: print('MATCH',v,flush=True)
            except Exception as e:
              print('ERROR',url,repr(e),flush=True)
          PY
