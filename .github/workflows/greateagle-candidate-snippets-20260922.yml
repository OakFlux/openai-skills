name: Extract Great Eagle candidate broker report snippets
on:
  push:
    paths:
      - '.github/workflows/greateagle-candidate-snippets-20260922.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - run: |
          set -euo pipefail
          mkdir output
          python - <<'PY'
          import json,re
          from pathlib import Path
          import requests
          ids={5354157,5619778,5517072,5283692,5578034,5368807,4209785,4631475}
          qs=['鹰君 00041','鷹君 地產','鷹君 朗廷','鹰君 香港REITs','鹰君 公募REITs','鷹君 香港地產','0041 香港REITs']
          out=[]
          for q in qs:
            s=requests.Session();s.trust_env=False
            s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json','Content-Type':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
            b={'order':'2','pdfPage':'-1','pageNum':1,'pageSize':100,'paragraphSize':50,'keywords':q}
            try:
              r=s.post('https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth',json=b,timeout=(15,90));d=r.json()
              docs=[]
              for x in ((d.get('data') or {}).get('dataList') or []):
                if x.get('docId') in ids or any(t in re.sub('<[^>]+>','',str(x.get('title') or '')) for t in ['REIT','地产','地產','酒店','港股早晨']):
                  docs.append(x)
              out.append({'query':q,'count':(d.get('data') or {}).get('count'),'docs':docs})
            except Exception as e:out.append({'query':q,'error':repr(e)})
          Path('output/results.json').write_text(json.dumps(out,ensure_ascii=True,indent=2),encoding='utf-8')
          for r in out:
            print('\nQUERY',r.get('query'),'COUNT',r.get('count'),'ERR',r.get('error'))
            for d in r.get('docs',[]):
              print('DOC',d.get('docId'),re.sub('<[^>]+>','',str(d.get('title') or '')),d.get('orgName'),d.get('pageNum'),d.get('pubTimeStr'),d.get('pdfPath'),d.get('coverPrefix'))
              for p in d.get('paragraphObjs') or []:
                print('PARA',p.get('coordinates'),re.sub('<[^>]+>','',str(p.get('content') or ''))[:5000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: greateagle-candidate-snippets
          path: output
          retention-days: 7
