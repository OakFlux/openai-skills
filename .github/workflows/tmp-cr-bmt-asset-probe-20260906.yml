name: Check CR BMT publicly linked assets
on:
  push:
    branches: [tmp-cr-bmt-asset-probe-20260906]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check linked asset responses
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests
          urls=[
            'https://file.sgpjbg.com/fileroot2/2025-5/12/c3c0ddd9-4eb4-4aff-a699-c6fd32278a1d/c3c0ddd9-4eb4-4aff-a699-c6fd32278a1d',
            'https://file.sgpjbg.com/fileroot2/2024-9/20/024bef1e-7548-41f7-b00b-64bc1cdc2a85/024bef1e-7548-41f7-b00b-64bc1cdc2a85',
            'https://file.sgpjbg.com/fileroot3/2026-3/25/f59a2914-ee16-4036-bb81-5e52351d56bf/f59a2914-ee16-4036-bb81-5e52351d56bf'
          ]
          for url in urls:
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.sgpjbg.com/'},timeout=60,allow_redirects=True)
              print('URL',url)
              print('STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'SIZE',len(r.content),'FINAL',r.url,'MAGIC',repr(r.content[:32]))
          PY
