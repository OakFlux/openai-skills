name: Knight Dairy Filings Probe

on:
  push:
    branches:
      - chatgpt-knight-dairy-filings-20261004
    paths:
      - .github/workflows/knight_dairy_probe_20261004.yml
      - scripts/probe_knight_dairy_filings.py

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/probe_knight_dairy_filings.py
      - uses: actions/upload-artifact@v4
        with:
          name: knight-dairy-probe
          path: output/knight_dairy_probe.json
          retention-days: 1
