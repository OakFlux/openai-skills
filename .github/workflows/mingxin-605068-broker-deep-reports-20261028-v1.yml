name: Package Mingxin 605068 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mingxin-605068-broker-deep-reports-20261028-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY='明新旭腾'
          COMPANY_FULL='明新旭腾新材料股份有限公司'
          STOCK_CODE='605068'
          AS_OF='2026-10-28'
          PACKAGE='明新旭腾_605068_券商深度与首次覆盖报告_完整版_3份_截至20261028'
          ROOT=Path(PACKAGE)
          PDF_DIR=ROOT/'PDF原文'
          PREVIEW_DIR=ROOT/'首页预览'
          PDF_DIR.mkdir(parents=True,exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'德邦证券','report_date':'2024-06-05',
              'title':'主营汽车真皮内饰，超纤革业务打开成长空间',
              'analysts':'邓健全、赵悦媛、赵启政、秦梓月','rating':'增持（首次覆盖）',
              'report_type':'公司首次覆盖','expected_pages':21,
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202406061635672192_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202406061635672192.html',
              'filename':'01_德邦证券_明新旭腾_主营汽车真皮内饰，超纤革业务打开成长空间_2024-06-05.pdf'
            },
            {
              'broker':'华福证券','report_date':'2023-02-23',
              'title':'一站式材料供应商，“环保+美学”双理念引领汽车内饰革命',
              'analysts':'林子健','rating':'买入（首次覆盖）',
              'report_type':'公司深度研究','expected_pages':27,
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202302241583689678_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202302241583689678.html',
              'filename':'02_华福证券_明新旭腾_一站式材料供应商，环保加美学双理念引领汽车内饰革命_2023-02-23.pdf'
            },
            {
              'broker':'开源证券','report_date':'2022-06-06',
              'title':'汽车真皮自主龙头，开辟超纤革业务打造第二增长曲线',
              'analysts':'邓健全','rating':'买入（首次覆盖）',
              'report_type':'公司首次覆盖','expected_pages':19,
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202206061570323413_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202206061570323413.html',
              'filename':'03_开源证券_明新旭腾_汽车真皮自主龙头，开辟超纤革业务打造第二增长曲线_2022-06-06.pdf'
            }
          ]

          session=requests.Session(); session.trust_env=False
          retry=Retry(total=8,connect=8,read=8,status=8,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)
          session.mount('https://',HTTPAdapter(max_retries=retry))
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          manifest=[]; hashes=set()

          def compact(value: str) -> str:
              return re.sub(r'[\s，。、“”‘’：:；;（）()—－+&·]+','',str(value or '')).lower()

          for spec in reports:
              data=None; meta={}
              for attempt in range(8):
                  try:
                      r=session.get(spec['url'],timeout=(30,480),allow_redirects=True,headers={
                        'User-Agent':ua,'Accept':'application/pdf,*/*;q=0.8','Referer':'https://data.eastmoney.com/report/'})
                      meta={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                      if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                          data=r.content; break
                  except Exception as exc:
                      meta={'error':repr(exc)}
                  time.sleep(1+attempt)
              if data is None:
                  raise RuntimeError(f"download failed {spec['title']}: {meta}")

              dest=PDF_DIR/spec['filename']
              dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages!=spec['expected_pages']:
                  raise RuntimeError(f"page mismatch {dest.name}: {pages} != {spec['expected_pages']}")

              text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(35,pages)])
              text_c=compact(text)
              if not any(compact(x) in text_c for x in [COMPANY,COMPANY_FULL,STOCK_CODE]):
                  raise RuntimeError(f'issuer identity mismatch: {dest.name}')
              broker_short=spec['broker'].replace('证券','')
              if compact(spec['broker']) not in text_c and compact(broker_short) not in text_c:
                  raise RuntimeError(f'broker identity mismatch: {dest.name}')
              title_tokens=[t for t in re.split(r'[，、“”+：:]',spec['title']) if len(compact(t))>=4]
              title_hits=sum(compact(t) in text_c for t in title_tokens[:6])
              if title_hits<2:
                  raise RuntimeError(f'title identity mismatch: {dest.name}, hits={title_hits}')

              sha=hashlib.sha256(data).hexdigest()
              if sha in hashes:
                  raise RuntimeError(f'duplicate report: {dest.name}')
              hashes.add(sha)

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREVIEW_DIR/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-singlefile','-png','-r','140',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000:
                  raise RuntimeError(f'preview failed: {dest.name}')

              manifest.append({**spec,'actual_pages':pages,'bytes':len(data),'sha256':sha,'download_meta':meta,
                'preview_file':str(Path('首页预览')/preview.name),'document_nature':'券商原始完整PDF',
                'validation':['PDF header','issuer identity','broker identity','title identity','exact page count','qpdf structure','first-page render','duplicate hash check']})

          readme=[
            '明新旭腾新材料股份有限公司（605068.SH）券商深度与首次覆盖报告资料包',
            f'整理基准日：{AS_OF}','',
            '本包收录3份公开可直接取得并通过全文核验的券商原始完整PDF。',
            '筛选标准：优先公司深度、首次覆盖和长篇公司研究；排除年报、季报、事件点评和网页摘要。',''
          ]
          for i,m in enumerate(manifest,1):
              readme += [
                f"{i}. {m['broker']}：《{m['title']}》",
                f"   类型：{m['report_type']}；日期：{m['report_date']}；分析师：{m['analysts']}；评级：{m['rating']}",
                f"   完整页数：{m['actual_pages']}页；文件：PDF原文/{m['filename']}",
                f"   来源页面：{m['source_page']}",f"   SHA-256：{m['sha256']}",'']
          readme += ['报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、券商身份、标题、准确页数、qpdf结构、首页渲染、重复文件、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3:
                  raise RuntimeError(f'zip validation failed: bad={bad}, pdfs={len(pdfs)}')
          short=Path('mingxin_605068_broker_deep_reports_3.zip')
          shutil.copy2(zip_path,short)
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'SHA256',hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: mingxin-605068-broker-deep-reports-final-20261028
          path: |
            明新旭腾_605068_券商深度与首次覆盖报告_完整版_3份_截至20261028.zip
            mingxin_605068_broker_deep_reports_3.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
