name: Temporary List Mengtai High-tech Report Metadata

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-list-mengtai-reports.yml

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query report metadata and PDF page counts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf requests
          python - <<'PY'
          import json,time,requests,tempfile,os
          from pypdf import PdfReader

          params={
            'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingChange':'*',
            'beginTime':'2015-01-01','endTime':'2026-08-30','pageNo':'1','fields':'','qType':'0',
            'orgCode':'','author':'','code':'300876','rcode':'','p':'1','pageNum':'1','pageNumber':'1',
            '_':str(int(time.time()*1000))}
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/plain,*/*'}
          s=requests.Session(); s.headers.update(headers)
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
          print('API_STATUS',r.status_code,r.url,'BYTES',len(r.content))
          r.raise_for_status(); payload=r.json()
          data=payload.get('data'); rows=[]
          if isinstance(data,list): rows=data
          elif isinstance(data,dict):
            for k in ('dataList','list','rows'):
              if isinstance(data.get(k),list): rows=data[k];break
          if not rows and isinstance(payload.get('result'),dict):
            for k in ('data','dataList','list','rows'):
              if isinstance(payload['result'].get(k),list): rows=payload['result'][k];break
          print('ROW_COUNT='+str(len(rows)))
          for row in sorted(rows,key=lambda x:str(x.get('publishDate') or ''),reverse=True):
            info=str(row.get('infoCode') or '').strip()
            out={k:row.get(k) for k in ('infoCode','publishDate','orgSName','orgName','title','emRatingName','ratingName','author')}
            out['pages']=None; out['pdf_ok']=False; out['pdf_bytes']=None; out['pdf_error']=None
            if info:
              url=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
              try:
                pr=s.get(url,headers={**headers,'Accept':'application/pdf,*/*'},timeout=90)
                out['pdf_status']=pr.status_code; out['pdf_bytes']=len(pr.content); out['pdf_type']=pr.headers.get('content-type')
                if pr.status_code!=200 or len(pr.content)<10000 or not pr.content.startswith(b'%PDF'):
                  raise RuntimeError(f'not pdf status={pr.status_code} bytes={len(pr.content)} type={pr.headers.get("content-type")}')
                with tempfile.NamedTemporaryFile(suffix='.pdf',delete=False) as f:
                  f.write(pr.content); p=f.name
                try: out['pages']=len(PdfReader(p,strict=False).pages)
                finally: os.unlink(p)
                out['pdf_ok']=True
              except Exception as e: out['pdf_error']=repr(e)
            print('ROW_JSON='+json.dumps(out,ensure_ascii=False))
          PY
