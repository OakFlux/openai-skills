name: Temporary Greentown China broker report downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect public report pages and frontend assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import html
          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('site-diagnostics')
          OUT.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          pages = [
              'https://www.fxbaogao.com/detail/4463229',
              'https://www.fxbaogao.com/search?keyword=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
              'https://www.sgpjbg.com/labels/luchengzhongguoshehuizerenbaogao.html',
              'https://www.sgpjbg.com/baogao/614257.html',
              'https://www.sgpjbg.com/bgdown/614257.html',
              'https://www.xdyanbao.com/doc/01dsb3j1ue',
              'https://www.sdyanbao.com/detail/906687',
          ]

          keywords = [
              'pdf', 'download', '下载', 'file', 'report', 'baogao', 'bgdown',
              'api', 'data_source_uuid', 'online_url', 'share_url', '4463229',
              '614257', '01dsb3j1ue', '906687', '绿城中国',
          ]
          report = []
          script_urls = []
          for idx, url in enumerate(pages):
              try:
                  r = session.get(url, timeout=60, allow_redirects=True)
                  ctype = r.headers.get('content-type', '')
                  text = r.text if ('text' in ctype or 'json' in ctype or not ctype) else ''
                  filename = OUT / f'page_{idx}.html'
                  filename.write_text(text, encoding='utf-8', errors='replace')
                  soup = BeautifulSoup(text, 'html.parser') if text else None
                  scripts = []
                  links = []
                  forms = []
                  if soup:
                      scripts = [urllib.parse.urljoin(r.url, s.get('src')) for s in soup.select('script[src]') if s.get('src')]
                      for a in soup.select('a[href]'):
                          target = urllib.parse.urljoin(r.url, a.get('href'))
                          label = ' '.join(a.get_text(' ', strip=True).split())
                          if any(k.lower() in (target + ' ' + label).lower() for k in keywords):
                              links.append({'text': label, 'url': target})
                      for form in soup.select('form'):
                          forms.append({
                              'action': urllib.parse.urljoin(r.url, form.get('action') or ''),
                              'method': form.get('method'),
                              'html': str(form)[:3000],
                          })
                  raw_urls = sorted(set(re.findall(r'https?://[^\s"\'<>\\]+', html.unescape(text))))
                  interesting_urls = [u.rstrip('),.;') for u in raw_urls if any(k.lower() in u.lower() for k in keywords)]
                  onclicks = sorted(set(re.findall(r'onclick=["\']([^"\']+)', text, re.I)))
                  item = {
                      'source': url, 'status': r.status_code, 'final_url': r.url,
                      'content_type': ctype, 'length': len(r.content),
                      'scripts': scripts, 'links': links[:300], 'forms': forms,
                      'interesting_urls': interesting_urls[:500],
                      'onclicks': onclicks[:300],
                      'title': soup.title.get_text(' ', strip=True) if soup and soup.title else '',
                  }
                  report.append(item)
                  script_urls.extend(scripts)
                  print('\nPAGE', json.dumps(item, ensure_ascii=False, indent=2))
              except Exception as exc:
                  print('PAGE ERROR', url, repr(exc))

          # Fetch unique JS assets and retain only keyword-containing snippets.
          snippets = []
          seen = set()
          for url in script_urls:
              if url in seen:
                  continue
              seen.add(url)
              try:
                  r = session.get(url, timeout=60)
                  if r.status_code != 200 or len(r.content) > 12_000_000:
                      continue
                  text = r.text
                  matches = []
                  low = text.lower()
                  for key in keywords:
                      start = 0
                      needle = key.lower()
                      while True:
                          pos = low.find(needle, start)
                          if pos < 0:
                              break
                          matches.append(text[max(0, pos-500):min(len(text), pos+1000)])
                          start = pos + len(needle)
                          if len(matches) >= 120:
                              break
                      if len(matches) >= 120:
                          break
                  if matches:
                      entry = {'url': url, 'status': r.status_code, 'length': len(r.content), 'snippets': matches}
                      snippets.append(entry)
                      print('\nJS', url, len(r.content), '\n', '\n---\n'.join(matches[:20]))
              except Exception as exc:
                  print('JS ERROR', url, repr(exc))

          (OUT / 'pages.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'js_snippets.json').write_text(json.dumps(snippets, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload site diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: greentown-site-diagnostics
          path: site-diagnostics/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
