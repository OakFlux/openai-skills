name: Temporary Greentown China broker report downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Discover, download and validate public PDF reports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf beautifulsoup4
          python3 <<'PY'
          import hashlib
          import html
          import io
          import json
          import re
          import time
          import unicodedata
          import urllib.parse
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT = Path('output')
          OUT.mkdir(parents=True, exist_ok=True)

          def norm(value):
              value = unicodedata.normalize('NFKC', str(value or ''))
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value).lower()

          def clean_filename(value):
              value = re.sub(r'[\\/:*?"<>|]+', '_', str(value or '')).strip()
              value = re.sub(r'\s+', '', value)
              return value[:115] or 'report'

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          preferred = [
              {'needle': '用品质铸就穿越周期的力量', 'broker': '广发证券', 'date': '2026-05-12', 'expected_pages': 51},
              {'needle': '好房子引领者理顺机制再出发', 'broker': '申万宏源', 'date': '2025-08-14', 'expected_pages': 31},
              {'needle': '改善房企标杆龙头战法聚焦核心', 'broker': '国联民生证券', 'date': '2025-02-21', 'expected_pages': 29},
              {'needle': '匠心独运驭光而行', 'broker': '', 'date': '2025-01-13', 'expected_pages': 29},
              {'needle': '决胜壁龛市场挖潜新模式价值', 'broker': '', 'date': '2024-12-31', 'expected_pages': 22},
          ]

          # ---------- 1. Eastmoney company-report API ----------
          em_items = []
          seen_info = set()
          em_api = 'https://reportapi.eastmoney.com/report/list'
          code_variants = ['03900', '3900', 'HK03900', '03900.HK', '116.03900']
          for qtype in ['0', '1']:
              for code in code_variants:
                  params = {
                      'industryCode': '*', 'pageSize': '5000', 'industry': '*',
                      'rating': '*', 'ratingChange': '*', 'beginTime': '2020-01-01',
                      'endTime': '2027-01-01', 'pageNo': '1', 'fields': '',
                      'qType': qtype, 'orgCode': '', 'code': code, 'rcode': '',
                      'p': '1', 'pageNum': '1', 'pageNumber': '1',
                  }
                  try:
                      r = session.get(em_api, params=params, timeout=60)
                      print('EM query', code, qtype, r.status_code, r.url)
                      if r.status_code != 200:
                          continue
                      payload = r.json()
                      rows = payload.get('data') or []
                      print('EM rows', code, qtype, len(rows))
                      for row in rows:
                          info = str(row.get('infoCode') or '')
                          if not info or info in seen_info:
                              continue
                          seen_info.add(info)
                          em_items.append(row)
                          print('  EM', str(row.get('publishDate'))[:10], row.get('stockCode'), row.get('stockName'), row.get('orgSName'), row.get('attachPages'), row.get('title'), info)
                  except Exception as exc:
                      print('EM query failed', code, qtype, repr(exc))

          # Fallback: search broad report pages and filter by stock/title, limited to recent years.
          if not any('绿城中国' in str(x.get('stockName') or '') for x in em_items):
              for qtype in ['0', '1']:
                  for page in range(1, 31):
                      params = {
                          'industryCode': '*', 'pageSize': '500', 'industry': '*',
                          'rating': '*', 'ratingChange': '*', 'beginTime': '2024-01-01',
                          'endTime': '2027-01-01', 'pageNo': str(page), 'fields': '',
                          'qType': qtype, 'orgCode': '', 'code': '', 'rcode': '',
                          'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                      }
                      try:
                          r = session.get(em_api, params=params, timeout=60)
                          if r.status_code != 200:
                              break
                          payload = r.json()
                          rows = payload.get('data') or []
                          if not rows:
                              break
                          hits = []
                          for row in rows:
                              hay = norm((row.get('stockName') or '') + ' ' + (row.get('title') or ''))
                              if '绿城中国' in hay or any(p['needle'] in hay for p in preferred):
                                  info = str(row.get('infoCode') or '')
                                  if info and info not in seen_info:
                                      seen_info.add(info)
                                      em_items.append(row)
                                      hits.append(row)
                          if hits:
                              print('EM broad hits page', page, qtype, len(hits))
                              for row in hits:
                                  print('  EM broad', str(row.get('publishDate'))[:10], row.get('stockCode'), row.get('stockName'), row.get('orgSName'), row.get('attachPages'), row.get('title'), row.get('infoCode'))
                          if len(rows) < 500:
                              break
                      except Exception as exc:
                          print('EM broad failed', page, qtype, repr(exc))
                          break

          # ---------- 2. Sdyanbao public search/detail API ----------
          sd_items = []
          sd_headers = {
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
              'Device': '1',
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/',
              'X-Token': '',
              'User-Agent': session.headers['User-Agent'],
          }
          search_api = 'https://api.sdyanbao.com/api/file/search'
          detail_api = 'https://api.sdyanbao.com/api/file/detail'
          for type_ids in ([1], [], [2]):
              for page in range(1, 11):
                  body = {
                      'device': 1, 'hideTrader': 0, 'onlyTitle': 1, 'order': 0,
                      'page': page, 'pageSize': 50, 'keyword': '绿城中国',
                      'pageCount': '', 'dateRange': '', 'startTime': '', 'endTime': '',
                      'typeIds': type_ids, 'industryIds': [], 'opFrom': 1,
                  }
                  try:
                      r = session.post(search_api, headers=sd_headers, json=body, timeout=60)
                      print('SD search', type_ids, page, r.status_code)
                      if r.status_code != 200:
                          break
                      payload = r.json()
                      rows = (payload.get('data') or {}).get('files') or []
                      if not rows:
                          break
                      for row in rows:
                          title = str(row.get('name') or '')
                          if '绿城中国' not in title and not any(p['needle'] in norm(title) for p in preferred):
                              continue
                          rid = str(row.get('id') or '')
                          if not rid or any(str(x.get('id')) == rid for x in sd_items):
                              continue
                          sd_items.append(row)
                          org = (row.get('organization') or {}).get('name') if isinstance(row.get('organization'), dict) else ''
                          print('  SD', rid, row.get('time_text'), org, row.get('page_count'), title, row.get('page_url'))
                      if len(rows) < 50:
                          break
                  except Exception as exc:
                      print('SD search failed', type_ids, page, repr(exc))
                      break

          public_urls = []
          for row in sd_items:
              rid = row.get('id')
              try:
                  r = session.post(detail_api, headers=sd_headers, json={'id': rid, 'opFrom': 1}, timeout=60)
                  print('SD detail', rid, r.status_code)
                  if r.status_code != 200:
                      continue
                  payload = r.json()
                  data = payload.get('data') or {}
                  print('  SD detail keys', rid, sorted(data.keys()), 'online_url=', data.get('online_url'), 'share_url=', data.get('share_url'))
                  online = data.get('online_url')
                  if online:
                      public_urls.append({
                          'url': online,
                          'title': row.get('name') or data.get('name') or '',
                          'broker': ((row.get('organization') or {}).get('name') if isinstance(row.get('organization'), dict) else '') or data.get('organization_name') or '',
                          'date': str(row.get('time_text') or data.get('time_text') or '')[:10],
                          'expected_pages': int(row.get('page_count') or data.get('page_count') or 0),
                          'source': 'sdyanbao-online',
                      })
              except Exception as exc:
                  print('SD detail failed', rid, repr(exc))

          # ---------- 3. Build candidate direct-PDF URLs ----------
          candidates = []
          for row in em_items:
              title = str(row.get('title') or '')
              stock = str(row.get('stockName') or '')
              hay = norm(stock + title)
              if '绿城中国' not in hay and not any(p['needle'] in hay for p in preferred):
                  continue
              info = str(row.get('infoCode') or '')
              if not info:
                  continue
              candidates.append({
                  'url': f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  'title': title,
                  'broker': str(row.get('orgSName') or row.get('orgName') or ''),
                  'date': str(row.get('publishDate') or '')[:10],
                  'expected_pages': int(row.get('attachPages') or 0),
                  'source': 'eastmoney',
              })
          candidates.extend(public_urls)

          # Add search-engine-discovered direct PDF URLs as a final public fallback.
          exact_titles = [
              '绿城中国 用品质铸就 穿越周期的力量 PDF',
              '绿城中国 好房子引领者 理顺机制再出发 PDF',
              '绿城中国 改善房企标杆 龙头战法 聚焦核心 PDF',
              '绿城中国 匠心独运 驭光而行 PDF',
              '绿城中国 决胜壁龛市场 挖潜新模式价值 PDF',
          ]
          search_hosts = [
              'https://www.google.com/search?q={q}',
              'https://www.bing.com/search?q={q}',
              'https://html.duckduckgo.com/html/?q={q}',
          ]
          pdf_pattern = re.compile(r'https?://[^\s"<>]+?\.pdf(?:\?[^\s"<>]*)?', re.I)
          for query in exact_titles:
              for template in search_hosts:
                  try:
                      url = template.format(q=urllib.parse.quote(query))
                      r = session.get(url, timeout=45)
                      print('search page', url, r.status_code, len(r.content))
                      if r.status_code != 200:
                          continue
                      text = html.unescape(r.text.replace('\\u0026', '&'))
                      for found in pdf_pattern.findall(text):
                          found = found.replace('&amp;', '&')
                          if any(host in found for host in ['pdf.dfcfw.com', 'file.iyanbao.com', 'reportify', 'myqcloud.com', 'vcbeat.top', 'finet.hk']):
                              candidates.append({'url': found, 'title': query.replace(' PDF', ''), 'broker': '', 'date': '', 'expected_pages': 0, 'source': 'search'})
                  except Exception as exc:
                      print('search engine failed', template, repr(exc))

          # Deduplicate candidates and score preferred deep reports.
          dedup = {}
          for c in candidates:
              if c['url'] not in dedup:
                  dedup[c['url']] = c
          candidates = list(dedup.values())
          print('candidate URLs:', len(candidates))
          for c in candidates:
              print('  candidate', c)

          def score_candidate(c):
              h = norm((c.get('title') or '') + ' ' + (c.get('broker') or ''))
              score = int(c.get('expected_pages') or 0) * 2
              for idx, p in enumerate(preferred):
                  if p['needle'] in h or h in p['needle']:
                      score += 3000 - idx * 300
                  if p['broker'] and norm(p['broker']) in h:
                      score += 100
                  if p['date'] and c.get('date') == p['date']:
                      score += 80
              if c.get('source') == 'eastmoney':
                  score += 200
              if c.get('source') == 'sdyanbao-online':
                  score += 100
              return score

          candidates.sort(key=score_candidate, reverse=True)

          # ---------- 4. Download and validate up to 3 full reports ----------
          manifest = []
          used_titles = set()
          used_brokers = set()
          for c in candidates:
              if len(manifest) >= 3:
                  break
              title_norm = norm(c.get('title'))
              if title_norm in used_titles:
                  continue
              try:
                  headers = {
                      'User-Agent': session.headers['User-Agent'],
                      'Accept': 'application/pdf,application/octet-stream,*/*',
                      'Referer': 'https://data.eastmoney.com/' if c.get('source') == 'eastmoney' else 'https://www.sdyanbao.com/',
                  }
                  r = session.get(c['url'], headers=headers, timeout=180, allow_redirects=True)
                  print('download', c['url'], r.status_code, r.headers.get('content-type'), len(r.content), 'final=', r.url)
                  if r.status_code != 200:
                      continue
                  content = r.content
                  if not content.startswith(b'%PDF-') or len(content) < 150000:
                      print('  rejected non/full PDF', content[:20])
                      continue
                  reader = PdfReader(io.BytesIO(content))
                  pages = len(reader.pages)
                  if pages < 18:
                      print('  rejected short PDF', pages)
                      continue
                  first_text = ''
                  try:
                      for page_index in range(min(3, pages)):
                          first_text += reader.pages[page_index].extract_text() or ''
                  except Exception:
                      pass
                  verify_hay = norm(first_text + ' ' + (c.get('title') or ''))
                  if '绿城' not in verify_hay and 'greentown' not in verify_hay:
                      print('  rejected title/company mismatch')
                      continue
                  broker = c.get('broker') or '券商'
                  date = c.get('date') or '未知日期'
                  title = c.get('title') or '绿城中国公司深度报告'
                  filename = f"{len(manifest)+1:02d}_{clean_filename(broker)}_{date.replace('-', '')}_绿城中国_{clean_filename(title)}.pdf"
                  destination = OUT / filename
                  destination.write_bytes(content)
                  sha = hashlib.sha256(content).hexdigest()
                  manifest.append({
                      'filename': filename, 'broker': broker, 'date': date,
                      'title': title, 'pages': pages, 'size_bytes': len(content),
                      'sha256': sha, 'source_pdf': r.url, 'source_method': c.get('source'),
                  })
                  used_titles.add(title_norm)
                  used_brokers.add(norm(broker))
                  print('  accepted', filename, pages)
              except Exception as exc:
                  print('download failed', c.get('url'), repr(exc))

          if len(manifest) < 2:
              raise RuntimeError(f'只成功取得 {len(manifest)} 份完整PDF，未达到2份最低要求')

          list_path = OUT / '报告清单.txt'
          lines = ['绿城中国（03900.HK）券商深度报告清单', '']
          for idx, rec in enumerate(manifest, 1):
              lines += [
                  f"{idx}. {rec['broker']}｜{rec['date']}｜{rec['title']}",
                  f"   页数：{rec['pages']}页；大小：{rec['size_bytes']} bytes",
                  f"   文件：{rec['filename']}",
                  f"   SHA-256：{rec['sha256']}",
                  f"   来源：{rec['source_pdf']}",
                  '',
              ]
          list_path.write_text('\n'.join(lines), encoding='utf-8')
          manifest_path = OUT / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = OUT / f"绿城中国_券商深度报告_{len(manifest)}份.zip"
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for rec in manifest:
                  zf.write(OUT / rec['filename'], arcname=rec['filename'])
              zf.write(list_path, arcname=list_path.name)
              zf.write(manifest_path, arcname=manifest_path.name)
          with zipfile.ZipFile(zip_path, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP完整性测试失败：{bad}')
          print('created', zip_path, zip_path.stat().st_size)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload validated PDF package
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-broker-deep-reports
          path: |
            output/*.pdf
            output/*.zip
            output/报告清单.txt
            output/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
