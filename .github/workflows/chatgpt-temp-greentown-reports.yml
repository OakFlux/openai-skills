name: Temporary Greentown China exact-search and page-image downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Locate exact deep reports and assemble full-page PDFs when all pages are public
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pillow pypdf
          python3 <<'PY'
          import hashlib
          import html
          import io
          import json
          import re
          import zipfile
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT = Path('output')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
          })
          api = 'https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'

          def strip_tags(value):
              return re.sub(r'<[^>]+>', '', html.unescape(str(value or '')))

          def norm(value):
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', strip_tags(value)).lower()

          def clean(value):
              value = re.sub(r'[\\/:*?"<>|]+', '_', strip_tags(value)).strip()
              value = re.sub(r'\s+', '', value)
              return value[:100] or 'report'

          specs = [
              {'title': '用品质铸就，穿越周期的力量', 'keys': ['用品质铸就', '穿越周期的力量'], 'rank': 10000},
              {'title': '好房子引领者，理顺机制再出发', 'keys': ['好房子引领者', '理顺机制再出发'], 'rank': 9500},
              {'title': '改善房企标杆，“龙头战法”聚焦核心', 'keys': ['改善房企标杆', '龙头战法', '聚焦核心'], 'rank': 9000},
              {'title': '匠心独运，驭光而行', 'keys': ['匠心独运', '驭光而行'], 'rank': 8500},
              {'title': '决胜壁龛市场，挖潜新模式价值', 'keys': ['决胜壁龛市场', '挖潜新模式价值'], 'rank': 8200},
              {'title': '自投代建双核驱动，品质龙头逆势攀升', 'keys': ['自投代建双核驱动', '品质龙头逆势攀升'], 'rank': 7900},
              {'title': '品质龙头重返行业前十', 'keys': ['品质龙头', '重返行业前十'], 'rank': 7600},
              {'title': '深耕高能级城市结硕果', 'keys': ['深耕高能级城市', '结硕果'], 'rank': 7300},
              {'title': '品质标杆房企，逆流而上未来可期', 'keys': ['品质标杆房企', '逆流而上', '未来可期'], 'rank': 7000},
              {'title': '品质匠心代表，优质成长蓝筹', 'keys': ['品质匠心代表', '优质成长蓝筹'], 'rank': 6700},
              {'title': '融合央企基因，行业品质标杆', 'keys': ['融合央企基因', '行业品质标杆'], 'rank': 6400},
              {'title': '坚守品质标杆，融资优势+聚焦核心，高质量发展可期', 'keys': ['坚守品质标杆', '融资优势', '聚焦核心'], 'rank': 6100},
          ]

          rows_by_doc = {}
          query_log = []
          for spec in specs:
              bodies = [
                  {
                      'pageNum': 1, 'pageSize': 20, 'stockCodes': ['03900'], 'order': '2',
                      'titleMustKeys': spec['keys'], 'isTitleMustKey': True,
                  },
                  {
                      'pageNum': 1, 'pageSize': 20, 'stockCodes': ['03900'], 'order': '2',
                      'advancedQuery': True, 'advancedRequest': {'title': spec['title']},
                      'isKeySplit': 0, 'onlyTitle': True,
                  },
                  {
                      'pageNum': 1, 'pageSize': 20, 'stockCodes': ['03900'], 'order': '2',
                      'keywords': spec['title'], 'isKeySplit': 0, 'onlyTitle': True,
                  },
                  {
                      'pageNum': 1, 'pageSize': 20, 'order': '2',
                      'titleMustKeys': spec['keys'], 'isTitleMustKey': True,
                  },
              ]
              for body_index, body in enumerate(bodies):
                  try:
                      response = session.post(api, json=body, timeout=45)
                      try:
                          payload = response.json()
                      except Exception:
                          payload = {'raw': response.text[:2000]}
                      data = payload.get('data') or {} if isinstance(payload, dict) else {}
                      rows = data.get('dataList') or [] if isinstance(data, dict) else []
                      summary = {
                          'spec': spec['title'], 'body_index': body_index, 'body': body,
                          'status': response.status_code, 'code': payload.get('code') if isinstance(payload, dict) else None,
                          'msg': payload.get('msg') if isinstance(payload, dict) else None,
                          'count': data.get('count') if isinstance(data, dict) else None,
                          'pageCount': data.get('pageCount') if isinstance(data, dict) else None,
                          'rows': len(rows),
                      }
                      query_log.append(summary)
                      print('\nQUERY', json.dumps(summary, ensure_ascii=False))
                      relevant = []
                      for row in rows:
                          title = strip_tags(row.get('title'))
                          stock_blob = json.dumps(row.get('stocks'), ensure_ascii=False)
                          row_summary = {
                              'docId': row.get('docId'), 'date': row.get('pubTimeStr'),
                              'broker': row.get('orgName'), 'pages': row.get('pageNum'),
                              'isDeep': row.get('isDeep'), 'docType': row.get('docType'),
                              'title': title, 'pdfPath': row.get('pdfPath'),
                              'coverPrefix': row.get('coverPrefix'), 'stocks': row.get('stocks'),
                          }
                          print(' ROW', json.dumps(row_summary, ensure_ascii=False))
                          if '03900' not in stock_blob and '绿城中国' not in title:
                              continue
                          # Retain exact or strong multi-key title matches.
                          title_norm = norm(title)
                          hit_count = sum(1 for key in spec['keys'] if norm(key) in title_norm)
                          if hit_count >= max(1, len(spec['keys']) - 1):
                              row_copy = dict(row)
                              row_copy['_rank'] = spec['rank'] + hit_count * 100
                              row_copy['_spec'] = spec['title']
                              rows_by_doc[str(row.get('docId'))] = row_copy
                              relevant.append(row_copy)
                      if relevant:
                          break
                  except Exception as exc:
                      print('QUERY ERROR', spec['title'], body_index, repr(exc))

          # Known deep-report metadata from the same public index.
          rows_by_doc.setdefault('3093383', {
              'docId': 3093383,
              'pubTimeStr': '2022/03/29/',
              'orgName': '浙商证券',
              'pageNum': 20,
              'isDeep': True,
              'isNotBroker': False,
              'docType': 1,
              'title': '绿城中国深度报告：坚守品质标杆，融资优势+聚焦核心，高质量发展可期',
              'pdfPath': 'report/2022/03/29/3093383.pdf',
              'coverPrefix': 'report-image/2022/03/29/3093383',
              'stocks': [{'key': '03900', 'value': '绿城中国'}],
              '_rank': 6100,
              '_spec': 'known-index-fallback',
          })

          rows = list(rows_by_doc.values())
          (OUT / 'query_log.json').write_text(json.dumps(query_log, ensure_ascii=True, indent=2), encoding='utf-8')
          (OUT / 'matched_metadata.json').write_text(json.dumps(rows, ensure_ascii=True, indent=2), encoding='utf-8')
          print('\nMATCHED METADATA', len(rows))
          for row in rows:
              print(json.dumps({
                  'docId': row.get('docId'), 'date': row.get('pubTimeStr'),
                  'broker': row.get('orgName'), 'pages': row.get('pageNum'),
                  'isDeep': row.get('isDeep'), 'docType': row.get('docType'),
                  'title': strip_tags(row.get('title')), 'coverPrefix': row.get('coverPrefix'),
                  'pdfPath': row.get('pdfPath'), 'spec': row.get('_spec'),
              }, ensure_ascii=False))

          bad_terms = ['年报', '中期报告', '半年报', '点评', '周报', '月报', '债券', '信用评级']
          candidates = []
          for row in rows:
              title = strip_tags(row.get('title'))
              pages = int(row.get('pageNum') or 0)
              if pages < 18 or int(row.get('docType') or 0) != 1 or row.get('isNotBroker') is True:
                  continue
              if any(term in title for term in bad_terms):
                  continue
              score = int(row.get('_rank') or 0) + pages * 5 + (500 if row.get('isDeep') else 0)
              candidates.append((score, row))
          candidates.sort(key=lambda item: item[0], reverse=True)

          probes = []
          accepted = []
          for score, row in candidates:
              if len(accepted) >= 3:
                  break
              prefix = str(row.get('coverPrefix') or '')
              pages = int(row.get('pageNum') or 0)
              if not prefix:
                  continue
              page_images = []
              complete = True
              for page_number in range(1, pages + 1):
                  url = f'https://public.fxbaogao.com/{prefix}-{page_number}.png'
                  try:
                      response = session.get(
                          url,
                          headers={'User-Agent': session.headers['User-Agent'], 'Referer': 'https://www.fxbaogao.com/'},
                          timeout=60,
                          allow_redirects=True,
                      )
                      valid = False
                      dimensions = None
                      image = None
                      if response.status_code == 200 and len(response.content) > 5000:
                          try:
                              image = Image.open(io.BytesIO(response.content))
                              image.load()
                              dimensions = image.size
                              valid = image.width > 500 and image.height > 700
                          except Exception:
                              valid = False
                      probe = {
                          'docId': row.get('docId'), 'page': page_number,
                          'url': url, 'status': response.status_code,
                          'final_url': response.url, 'content_type': response.headers.get('content-type'),
                          'length': len(response.content), 'valid': valid, 'dimensions': dimensions,
                      }
                      probes.append(probe)
                      if page_number <= 3 or page_number == pages or not valid:
                          print('IMAGE', json.dumps(probe, ensure_ascii=False))
                      if not valid:
                          complete = False
                          break
                      if image.mode != 'RGB':
                          image = image.convert('RGB')
                      page_images.append(image.copy())
                  except Exception as exc:
                      print('IMAGE ERROR', row.get('docId'), page_number, repr(exc))
                      complete = False
                      break
              if not complete or len(page_images) != pages:
                  print('INCOMPLETE PUBLIC PAGES', row.get('docId'), len(page_images), '/', pages)
                  continue

              title = strip_tags(row.get('title'))
              broker = strip_tags(row.get('orgName')) or '券商'
              date = str(row.get('pubTimeStr') or '').strip('/').replace('/', '-')
              filename = (
                  f"{len(accepted)+1:02d}_{clean(broker)}_{date.replace('-', '')}_"
                  f"绿城中国_{clean(title)}_[完整页面版].pdf"
              )
              destination = OUT / filename
              page_images[0].save(
                  destination, 'PDF', save_all=True, append_images=page_images[1:],
                  resolution=150.0, quality=95
              )
              actual_pages = len(PdfReader(str(destination)).pages)
              if actual_pages != pages:
                  raise RuntimeError(f'PDF page mismatch for {filename}: {actual_pages} vs {pages}')
              content = destination.read_bytes()
              record = {
                  'filename': filename, 'broker': broker, 'date': date,
                  'title': title, 'pages': actual_pages, 'size_bytes': len(content),
                  'sha256': hashlib.sha256(content).hexdigest(),
                  'source_type': 'public-page-images',
                  'source_prefix': f'https://public.fxbaogao.com/{prefix}-N.png',
                  'docId': row.get('docId'),
              }
              accepted.append(record)
              print('ACCEPT COMPLETE PAGE VERSION', json.dumps(record, ensure_ascii=False, indent=2))

          (OUT / 'image_probes.json').write_text(json.dumps(probes, ensure_ascii=True, indent=2), encoding='utf-8')
          if len(accepted) < 2:
              raise RuntimeError(f'Only {len(accepted)} reports had all public page images')

          manifest = OUT / 'manifest.json'
          manifest.write_text(json.dumps(accepted, ensure_ascii=False, indent=2), encoding='utf-8')
          listing = OUT / '报告清单.txt'
          lines = ['绿城中国（03900.HK）券商深度报告清单', '',
                   '说明：PDF由报告平台公开的逐页高清页面合成，内容页数完整；并非券商原始矢量PDF文件。', '']
          for index, record in enumerate(accepted, 1):
              lines.extend([
                  f"{index}. {record['broker']}｜{record['date']}｜{record['title']}",
                  f"   页数：{record['pages']}页；文件：{record['filename']}",
                  f"   公开页面来源：{record['source_prefix']}",
                  '',
              ])
          listing.write_text('\n'.join(lines), encoding='utf-8')
          zip_path = OUT / f"绿城中国_券商深度报告_{len(accepted)}份_完整页面版.zip"
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for record in accepted:
                  archive.write(OUT / record['filename'], arcname=record['filename'])
              archive.write(manifest, arcname=manifest.name)
              archive.write(listing, arcname=listing.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              if archive.testzip() is not None:
                  raise RuntimeError('ZIP integrity check failed')
          print('DONE', zip_path, zip_path.stat().st_size)
          print(json.dumps(accepted, ensure_ascii=False, indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-exact-search-page-results
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
