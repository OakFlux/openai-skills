name: Temporary Greentown China complete-page report packager

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download every publicly hosted report page and assemble PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pillow pypdf
          python3 <<'PY'
          import hashlib
          import io
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT = Path('output')
          OUT.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '申万宏源', 'date': '2025-08-14',
                  'title': '好房子引领者，理顺机制再出发',
                  'pages': 31, 'base': 'https://oss.sdyanbao.com/page/2025/8/18/1223571',
              },
              {
                  'broker': '华泰证券', 'date': '2025-01-13',
                  'title': '匠心独运，驭光而行',
                  'pages': 29, 'base': 'https://oss.sdyanbao.com/page/2025/1/20/1143859',
              },
              {
                  'broker': '开源证券', 'date': '2024-01-22',
                  'title': '港股公司首次覆盖报告：自投代建双核驱动，品质龙头逆势攀升',
                  'pages': 25, 'base': 'https://oss.sdyanbao.com/page/2024/1/22/924183',
              },
              {
                  'broker': '中银证券', 'date': '2023-07-15',
                  'title': '品质龙头重返行业前十，聚焦核心+提质增效促公司良性发展',
                  'pages': 58, 'base': 'https://oss.sdyanbao.com/page/2023/7/15/570154',
              },
              {
                  'broker': '中信建投', 'date': '2022-10-18',
                  'title': '深耕高能级城市结硕果，融资能力强稳中有进',
                  'pages': 21, 'base': 'https://oss.sdyanbao.com/page/2022/10/18/373267',
              },
              {
                  'broker': '平安证券', 'date': '2022-08-15',
                  'title': '公司首次覆盖报告：品质标杆房企，逆流而上未来可期',
                  'pages': 24, 'base': 'https://oss.sdyanbao.com/page/2022/8/15/336048',
              },
              {
                  'broker': '海通证券', 'date': '2022-05-16',
                  'title': '公司研究报告：品质匠心代表，优质成长蓝筹',
                  'pages': 26, 'base': 'https://oss.sdyanbao.com/page/2022/5/16/295455',
              },
              {
                  'broker': '国信证券', 'date': '2022-04-21',
                  'title': '融合央企基因，行业品质标杆',
                  'pages': 24, 'base': 'https://oss.sdyanbao.com/page/2022/4/21/281441',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Referer': 'https://www.sdyanbao.com/',
              'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          def clean(value):
              value = re.sub(r'[\\/:*?"<>|]+', '_', value).strip()
              value = re.sub(r'\s+', '', value)
              return value[:105]

          accepted = []
          diagnostics = []
          for report in reports:
              if len(accepted) >= 3:
                  break
              images = []
              complete = True
              print('\nREPORT', report['broker'], report['date'], report['title'], report['pages'])
              for page_index in range(report['pages']):
                  url = f"{report['base']}/{page_index}.png"
                  response = None
                  for attempt in range(3):
                      try:
                          response = session.get(url, timeout=60, allow_redirects=True)
                          if response.status_code == 200 and len(response.content) > 5000:
                              break
                      except Exception as exc:
                          print('PAGE TRY ERROR', page_index, attempt, repr(exc))
                      time.sleep(1 + attempt)
                  valid = False
                  dimensions = None
                  image = None
                  if response is not None and response.status_code == 200 and len(response.content) > 5000:
                      try:
                          image = Image.open(io.BytesIO(response.content))
                          image.load()
                          dimensions = image.size
                          valid = image.width >= 700 and image.height >= 900
                      except Exception as exc:
                          print('IMAGE DECODE ERROR', page_index, repr(exc))
                  record = {
                      'broker': report['broker'], 'page_index': page_index,
                      'url': url, 'status': response.status_code if response is not None else None,
                      'content_type': response.headers.get('content-type') if response is not None else None,
                      'length': len(response.content) if response is not None else 0,
                      'valid': valid, 'dimensions': dimensions,
                  }
                  diagnostics.append(record)
                  if page_index < 3 or page_index >= report['pages'] - 2 or not valid:
                      print('PAGE', json.dumps(record, ensure_ascii=False))
                  if not valid:
                      complete = False
                      break
                  if image.mode != 'RGB':
                      image = image.convert('RGB')
                  images.append(image.copy())
                  time.sleep(0.05)

              if not complete or len(images) != report['pages']:
                  print('INCOMPLETE', report['title'], len(images), '/', report['pages'])
                  continue

              filename = (
                  f"{len(accepted)+1:02d}_{clean(report['broker'])}_{report['date'].replace('-', '')}_"
                  f"绿城中国_{clean(report['title'])}_完整页面版.pdf"
              )
              destination = OUT / filename
              images[0].save(
                  destination,
                  'PDF',
                  save_all=True,
                  append_images=images[1:],
                  resolution=150.0,
                  quality=95,
              )
              actual_pages = len(PdfReader(str(destination)).pages)
              if actual_pages != report['pages']:
                  raise RuntimeError(f"Page mismatch: {filename}: {actual_pages} vs {report['pages']}")
              content = destination.read_bytes()
              if not content.startswith(b'%PDF-') or len(content) < 150000:
                  raise RuntimeError(f"Invalid assembled PDF: {filename}")
              accepted.append({
                  **report,
                  'filename': filename,
                  'actual_pages': actual_pages,
                  'size_bytes': len(content),
                  'sha256': hashlib.sha256(content).hexdigest(),
                  'source_type': 'public-full-page-images',
                  'source_pattern': report['base'] + '/{0..N-1}.png',
              })
              print('ACCEPT', json.dumps(accepted[-1], ensure_ascii=False, indent=2))

          (OUT / 'page_diagnostics.json').write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          if len(accepted) < 2:
              raise RuntimeError(f"Only {len(accepted)} reports had all pages publicly accessible")

          manifest_path = OUT / 'manifest.json'
          manifest_path.write_text(json.dumps(accepted, ensure_ascii=False, indent=2), encoding='utf-8')
          list_path = OUT / '报告清单.txt'
          lines = [
              '绿城中国（03900.HK）券商深度报告清单',
              '',
              '说明：PDF由公开托管的逐页高清原报告页面无删减合成；内容及页数完整，但不是券商原始矢量PDF容器。',
              '',
          ]
          for index, record in enumerate(accepted, 1):
              lines.extend([
                  f"{index}. {record['broker']}｜{record['date']}｜{record['title']}",
                  f"   完整页数：{record['actual_pages']}页；文件：{record['filename']}",
                  f"   页面来源：{record['source_pattern']}",
                  '',
              ])
          list_path.write_text('\n'.join(lines), encoding='utf-8')

          zip_path = OUT / f"绿城中国_券商深度报告_{len(accepted)}份_完整页面版.zip"
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for record in accepted:
                  archive.write(OUT / record['filename'], arcname=record['filename'])
              archive.write(manifest_path, arcname=manifest_path.name)
              archive.write(list_path, arcname=list_path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP integrity failure: {bad}")
          print('DONE', zip_path, zip_path.stat().st_size)
          print(json.dumps(accepted, ensure_ascii=False, indent=2))
          PY

      - name: Upload complete-page package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-complete-page-package
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
