name: Temporary Greentown China page-image probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query yearly deep reports and probe all-page public images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pillow
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          import requests
          from PIL import Image
          from io import BytesIO

          OUT = Path('probe')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
          })
          api = 'https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'

          rows_by_doc = {}
          searches = []
          for year in ['2026', '2025', '2024', '2023', '2022', '2021', '2020']:
              bodies = [
                  {'pageNum': 1, 'pageSize': 100, 'stockCodes': ['03900'], 'years': [year], 'order': '2'},
                  {'pageNum': 1, 'pageSize': 100, 'stockCodes': ['03900'], 'years': [year], 'order': 2},
                  {'pageNum': 1, 'pageSize': 100, 'stockCodes': ['03900'], 'startTime': int(year)*10000000000, 'order': 2},
              ]
              chosen = None
              for bi, body in enumerate(bodies):
                  try:
                      r = session.post(api, json=body, timeout=45)
                      data = r.json().get('data') or {} if r.status_code == 200 else {}
                      rows = data.get('dataList') or []
                      rec = {'year': year, 'body_index': bi, 'body': body, 'status': r.status_code,
                             'count': data.get('count'), 'pageCount': data.get('pageCount'),
                             'currPage': data.get('currPage'), 'rows': rows}
                      searches.append(rec)
                      print('\nYEAR SEARCH', year, bi, r.status_code, 'count', data.get('count'),
                            'pageCount', data.get('pageCount'), 'curr', data.get('currPage'), 'rows', len(rows))
                      for x in rows:
                          print(' ', x.get('pubTimeStr'), x.get('orgName'), x.get('pageNum'),
                                x.get('isDeep'), x.get('docType'), re.sub(r'<[^>]+>', '', str(x.get('title') or '')),
                                x.get('docId'), x.get('coverPrefix'), x.get('pdfPath'))
                      # Accept a body only when its returned dates actually match the requested year.
                      matching = [x for x in rows if str(x.get('pubTimeStr') or '').startswith(year + '/')]
                      if matching:
                          chosen = matching
                          break
                  except Exception as exc:
                      print('YEAR SEARCH ERROR', year, bi, repr(exc))
              for x in chosen or []:
                  doc = str(x.get('docId') or '')
                  if doc:
                      rows_by_doc[doc] = x

          (OUT / 'year_searches.json').write_text(json.dumps(searches, ensure_ascii=False, indent=2), encoding='utf-8')

          candidates = []
          bad = ['年报', '中期报告', '半年报', '点评', '周报', '月报', '债券', '销售简报', '信用评级']
          for x in rows_by_doc.values():
              title = re.sub(r'<[^>]+>', '', str(x.get('title') or ''))
              pages = int(x.get('pageNum') or 0)
              if pages < 18 or int(x.get('docType') or 0) != 1 or x.get('isNotBroker') is True:
                  continue
              if any(k in title for k in bad):
                  continue
              candidates.append(x)
          candidates.sort(key=lambda x: (str(x.get('pubTimeStr') or ''), int(x.get('pageNum') or 0)), reverse=True)
          print('\nCANDIDATES', len(candidates))
          for x in candidates:
              print(json.dumps({k: x.get(k) for k in ['docId','pubTimeStr','orgName','pageNum','isDeep','title','coverPrefix','pdfPath']}, ensure_ascii=False))

          probes = []
          for x in candidates[:20]:
              prefix = str(x.get('coverPrefix') or '')
              pages = int(x.get('pageNum') or 0)
              if not prefix:
                  continue
              page_nums = sorted(set([1, 2, 3, min(10, pages), pages]))
              for n in page_nums:
                  urls = [
                      f'https://public.fxbaogao.com/{prefix}-{n}.png',
                      f'https://public.fxbaogao.com/{prefix}-{n}.jpg',
                      f'https://report.fxbaogao.com/{prefix}-{n}.png',
                  ]
                  for url in urls:
                      try:
                          r = session.get(url, headers={'User-Agent': session.headers['User-Agent'], 'Referer': 'https://www.fxbaogao.com/'}, timeout=45, allow_redirects=True)
                          valid = False
                          dims = None
                          if r.status_code == 200 and (r.headers.get('content-type') or '').startswith('image/') and len(r.content) > 5000:
                              try:
                                  im = Image.open(BytesIO(r.content))
                                  dims = im.size
                                  valid = True
                              except Exception:
                                  pass
                          rec = {'docId': x.get('docId'), 'title': x.get('title'), 'page': n,
                                 'url': url, 'status': r.status_code, 'final': r.url,
                                 'content_type': r.headers.get('content-type'), 'length': len(r.content),
                                 'valid_image': valid, 'dimensions': dims}
                          probes.append(rec)
                          print('PROBE', json.dumps(rec, ensure_ascii=False))
                          if valid:
                              break
                      except Exception as exc:
                          print('PROBE ERROR', x.get('docId'), n, url, repr(exc))
          (OUT / 'image_probes.json').write_text(json.dumps(probes, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'candidates.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greentown-page-image-probe
          path: probe/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
