name: Temporary Greentown China broker report downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Discover public source URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import base64
          import html
          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('diagnostics')
          OUT.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          sd_headers = {
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
              'Device': '1',
              'Origin': 'https://www.sdyanbao.com',
              'Referer': 'https://www.sdyanbao.com/',
              'X-Token': '',
              'User-Agent': session.headers['User-Agent'],
          }
          search_api = 'https://api.sdyanbao.com/api/file/search'
          detail_api = 'https://api.sdyanbao.com/api/file/detail'
          selected_needles = [
              '用品质铸就', '好房子引领者', '改善房企标杆', '匠心独运',
              '决胜壁龛市场', '自投代建双核驱动', '品质龙头重返行业前十',
              '深耕高能级城市结硕果', '品质标杆房企', '品质匠心代表',
              '融合央企基因',
          ]
          details = []
          seen = set()
          for type_ids in ([1], [], [2]):
              for page in range(1, 8):
                  body = {
                      'device': 1, 'hideTrader': 0, 'onlyTitle': 1, 'order': 0,
                      'page': page, 'pageSize': 50, 'keyword': '绿城中国',
                      'pageCount': '', 'dateRange': '', 'startTime': '', 'endTime': '',
                      'typeIds': type_ids, 'industryIds': [], 'opFrom': 1,
                  }
                  r = session.post(search_api, headers=sd_headers, json=body, timeout=60)
                  print('SD search', type_ids, page, r.status_code)
                  if r.status_code != 200:
                      break
                  rows = ((r.json().get('data') or {}).get('files') or [])
                  if not rows:
                      break
                  for row in rows:
                      title = str(row.get('name') or '')
                      if not any(n in title for n in selected_needles):
                          continue
                      rid = str(row.get('id') or '')
                      if not rid or rid in seen:
                          continue
                      seen.add(rid)
                      rd = session.post(detail_api, headers=sd_headers, json={'id': row.get('id'), 'opFrom': 1}, timeout=60)
                      data = (rd.json().get('data') or {}) if rd.status_code == 200 else {}
                      record = {'search': row, 'detail': data}
                      details.append(record)
                      print('\n=== SD FULL DETAIL', rid, title, '===')
                      print(json.dumps(data, ensure_ascii=False, indent=2))
                  if len(rows) < 50:
                      break
          (OUT / 'sdyanbao_details.json').write_text(json.dumps(details, ensure_ascii=False, indent=2), encoding='utf-8')

          def decode_result_href(href, base):
              href = html.unescape(href or '')
              if href.startswith('/'):
                  href = urllib.parse.urljoin(base, href)
              parsed = urllib.parse.urlparse(href)
              qs = urllib.parse.parse_qs(parsed.query)
              host = parsed.netloc.lower()
              if 'google.' in host and parsed.path == '/url':
                  return (qs.get('q') or qs.get('url') or [href])[0]
              if 'duckduckgo.com' in host and parsed.path.startswith('/l/'):
                  return (qs.get('uddg') or [href])[0]
              if 'bing.com' in host and parsed.path.startswith('/ck/a'):
                  u = (qs.get('u') or [''])[0]
                  if u.startswith('a1'):
                      raw = u[2:]
                      try:
                          raw += '=' * (-len(raw) % 4)
                          return base64.urlsafe_b64decode(raw).decode('utf-8', errors='replace')
                      except Exception:
                          pass
              return href

          queries = [
              '"绿城中国" "用品质铸就，穿越周期的力量" PDF',
              '"绿城中国" "好房子引领者，理顺机制再出发" PDF',
              '"绿城中国" "改善房企标杆" PDF',
              '"绿城中国" "匠心独运，驭光而行" PDF',
              '"绿城中国" "决胜壁龛市场" PDF',
              'site:pdf.dfcfw.com/pdf/H3_AP "绿城中国"',
              'site:file.iyanbao.com/pdf "绿城中国"',
              'site:reportify-1252068037.cos.ap-beijing.myqcloud.com "绿城中国"',
          ]
          engines = [
              ('google', 'https://www.google.com/search?q={q}'),
              ('bing', 'https://www.bing.com/search?q={q}'),
              ('ddg', 'https://html.duckduckgo.com/html/?q={q}'),
          ]
          all_links = []
          for query in queries:
              for engine, template in engines:
                  url = template.format(q=urllib.parse.quote(query))
                  try:
                      r = session.get(url, timeout=60)
                      print('\nSEARCH', engine, query, r.status_code, len(r.content))
                      soup = BeautifulSoup(r.text, 'html.parser')
                      links = []
                      for a in soup.select('a[href]'):
                          target = decode_result_href(a.get('href'), url)
                          text = ' '.join(a.get_text(' ', strip=True).split())
                          if target.startswith('http') and not any(h in urllib.parse.urlparse(target).netloc for h in ['google.com', 'bing.com', 'duckduckgo.com']):
                              item = {'engine': engine, 'query': query, 'url': target, 'text': text}
                              links.append(item)
                              all_links.append(item)
                      print(json.dumps(links[:50], ensure_ascii=False, indent=2))
                  except Exception as exc:
                      print('SEARCH ERROR', engine, query, repr(exc))
          # Deduplicate links.
          uniq = []
          seen_urls = set()
          for x in all_links:
              u = x['url']
              if u not in seen_urls:
                  seen_urls.add(u)
                  uniq.append(x)
          (OUT / 'search_links.json').write_text(json.dumps(uniq, ensure_ascii=False, indent=2), encoding='utf-8')

          # Follow likely report pages and extract all PDF-like/URL-like strings.
          page_diagnostics = []
          candidates = []
          for item in uniq[:160]:
              u = item['url']
              if not any(k in u for k in ['sina.com.cn', 'sgpjbg.com', 'sdyanbao.com', 'fxbaogao.com', 'baogaobox.com', 'iyanbao.com', 'dfcfw.com', 'reportify', 'myqcloud.com']):
                  continue
              try:
                  r = session.get(u, timeout=60, allow_redirects=True)
                  text = html.unescape(r.text) if 'text' in (r.headers.get('content-type') or '') else ''
                  found = sorted(set(re.findall(r'https?://[^\s"\'<>\\]+', text)))
                  pdfish = [x.rstrip('),.;') for x in found if '.pdf' in x.lower() or 'download' in x.lower() or 'file' in x.lower()]
                  scripts = []
                  if text:
                      soup = BeautifulSoup(text, 'html.parser')
                      scripts = [urllib.parse.urljoin(r.url, s.get('src')) for s in soup.select('script[src]') if s.get('src')]
                      for a in soup.select('a[href]'):
                          target = urllib.parse.urljoin(r.url, a.get('href'))
                          if '.pdf' in target.lower() or 'download' in target.lower():
                              pdfish.append(target)
                  diag = {'source': u, 'status': r.status_code, 'final_url': r.url, 'content_type': r.headers.get('content-type'), 'pdfish': sorted(set(pdfish)), 'scripts': scripts}
                  page_diagnostics.append(diag)
                  candidates.extend(diag['pdfish'])
                  print('\nPAGE DIAG', json.dumps(diag, ensure_ascii=False, indent=2))
              except Exception as exc:
                  print('PAGE ERROR', u, repr(exc))
          (OUT / 'page_diagnostics.json').write_text(json.dumps(page_diagnostics, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'candidate_urls.txt').write_text('\n'.join(sorted(set(candidates))), encoding='utf-8')
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: greentown-source-diagnostics
          path: diagnostics/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
