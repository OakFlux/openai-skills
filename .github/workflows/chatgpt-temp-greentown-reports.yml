name: Temporary Fxbaogao report search probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query no-auth report search and public metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 <<'PY'
          import json
          from pathlib import Path
          import requests

          OUT=Path('probe'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
            'Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/',
            'Accept':'application/json, text/plain, */*','Content-Type':'application/json'
          })
          base='https://api.fxbaogao.com'
          bodies=[
            {'pageNum':1,'pageSize':100,'keywords':'绿城中国','order':2},
            {'pageIndex':1,'pageSize':100,'keywords':'绿城中国','order':2},
            {'page':1,'limit':100,'keywords':'绿城中国','order':2},
            {'pageNum':1,'pageSize':100,'keywords':'绿城中国','order':2,'onlyTitle':False,'years':[],'stockCodes':[],'industryNames':[],'tagKeys':[],'docType':[],'typeIdList':[]},
            {'pageNum':1,'pageSize':100,'keywords':'绿城中国','order':2,'advancedQuery':True,'advancedRequest':{'title':'绿城中国'}},
          ]
          results=[]; reports=[]
          for ep in ['/mofoun/report/searchReport/searchNoAuth','/mofoun/report/searchReport/search']:
            for i,b in enumerate(bodies):
              try:
                r=s.post(base+ep,json=b,timeout=45)
                try:data=r.json()
                except Exception:data={'raw':r.text[:10000]}
                rec={'endpoint':ep,'body_index':i,'status':r.status_code,'data':data}; results.append(rec)
                print('\nSEARCH',json.dumps(rec,ensure_ascii=False,indent=2)[:100000])
                def walk(v):
                  if isinstance(v,dict):
                    if any(k in v for k in ['title','reportTitle','reportName']) and any(k in v for k in ['id','reportId','uuid','docId']): reports.append(v)
                    for x in v.values(): walk(x)
                  elif isinstance(v,list):
                    for x in v: walk(x)
                walk(data)
              except Exception as exc: print('SEARCH ERROR',ep,i,repr(exc))
          (OUT/'search_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')

          uniq=[]; seen=set()
          for x in reports:
            key=str(x.get('id') or x.get('reportId') or x.get('uuid') or x.get('docId') or '')+'|'+str(x.get('title') or x.get('reportTitle') or x.get('reportName') or '')
            if key not in seen: seen.add(key); uniq.append(x)
          print('\nEXTRACTED REPORTS',json.dumps(uniq,ensure_ascii=False,indent=2)[:300000])
          (OUT/'reports.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')

          metadata=[]
          for x in uniq[:100]:
            ids=[]
            for k in ['uuid','id','reportId','docId']:
              if x.get(k) not in [None,'']: ids.append((k,str(x.get(k))))
            for k,val in ids:
              calls=[
                ('GET',f'/mofoun/report/report/report/getXcxReportInfo?uuid={val}',None),
                ('POST','/mofoun/report/searchReport/detail',{'reportId':val}),
                ('POST','/mofoun/report/searchReport/detail',{'id':val}),
                ('GET',f'/mofoun/report/report/getReportPreviewImages?reportId={val}',None),
              ]
              for method,ep,payload in calls:
                try:
                  if method=='GET': r=s.get(base+ep,timeout=30)
                  else:r=s.post(base+ep,json=payload,timeout=30)
                  try:data=r.json()
                  except Exception:data={'raw':r.text[:5000]}
                  rec={'title':x.get('title') or x.get('reportTitle') or x.get('reportName'),'source_key':k,'source_value':val,'method':method,'endpoint':ep,'status':r.status_code,'data':data}
                  metadata.append(rec)
                  if r.status_code==200 or '绿城' in json.dumps(data,ensure_ascii=False): print('\nMETA',json.dumps(rec,ensure_ascii=False,indent=2)[:100000])
                except Exception as exc: print('META ERROR',k,val,ep,repr(exc))
          (OUT/'metadata.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')

          # Brute only plausible enum names to document accepted facet types, for metadata discovery.
          facet_types=['YEAR','YEARS','STOCK','STOCKS','INDUSTRY','INDUSTRIES','DATATYPE','DATATYPES','DOCTYPE','DOCTYPES','TYPE','TYPE_V2','V2','DATE','ORG','ORGANIZATION']
          facet=[]
          body={'pageNum':1,'pageSize':100,'keywords':'绿城中国','order':2}
          for ft in facet_types:
            try:
              r=s.post(base+'/mofoun/report/searchReport/facet?type='+ft,json=body,timeout=20)
              try:data=r.json()
              except Exception:data={'raw':r.text[:2000]}
              rec={'type':ft,'status':r.status_code,'data':data}; facet.append(rec)
              if r.status_code==200 or (isinstance(data,dict) and 'No enum constant' not in str(data.get('msg'))): print('FACET',json.dumps(rec,ensure_ascii=False,indent=2)[:30000])
            except Exception as exc: print('FACET ERROR',ft,repr(exc))
          (OUT/'facet.json').write_text(json.dumps(facet,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-report-search-probe
          path: probe/*
          retention-days: 1
          compression-level: 0
