name: Temporary Fxbaogao Greentown probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public report search and viewer APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import json,re,urllib.parse,html
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('probe'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          # Search page.
          search_urls=[
            'https://www.fxbaogao.com/rp?keywords=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD&order=2&nop=-1',
            'https://www.fxbaogao.com/rp?keywords=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD&order=2&nop=1',
          ]
          ids=[]; page_records=[]
          for idx,u in enumerate(search_urls):
            r=s.get(u,timeout=45,allow_redirects=True); print('SEARCH PAGE',u,r.status_code,len(r.content),r.url)
            (OUT/f'search{idx}.html').write_text(r.text,encoding='utf-8',errors='replace')
            soup=BeautifulSoup(r.text,'html.parser')
            rec=[]
            for a in soup.select('a[href]'):
              href=urllib.parse.urljoin(r.url,a.get('href'))
              m=re.search(r'/detail/(\d+)',href)
              if m:
                title=' '.join(a.get_text(' ',strip=True).split()) or a.get('title') or ''
                rid=m.group(1); ids.append(rid); rec.append({'id':rid,'title':title,'href':href})
            print('DETAIL LINKS',json.dumps(rec,ensure_ascii=False,indent=2))
            page_records.extend(rec)
            # Print Next data and inline state snippets.
            nd=soup.select_one('#__NEXT_DATA__')
            if nd: print('NEXTDATA',nd.get_text()[:200000])
            for sc in soup.select('script:not([src])'):
              t=sc.get_text(' ',strip=False)
              if '绿城中国' in t or 'pdfPath' in t or 'docId' in t:
                print('INLINE',t[:100000])

          # Include known IDs and deduplicate.
          ids=list(dict.fromkeys(ids+['4463229']))
          print('ALL IDS',ids)

          api='https://api.fxbaogao.com'
          api_results=[]
          for rid in ids[:80]:
            for endpoint in [
              f'/mofoun/report/report/report/getXcxReportInfo?uuid={rid}',
              f'/mofoun/report/report/report/getXcxReportInfo?id={rid}',
              f'/mofoun/report/report/report/detail?id={rid}',
              f'/mofoun/report/report/report/get?id={rid}',
            ]:
              try:
                rr=s.get(api+endpoint,headers={'Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'},timeout=30)
                try: data=rr.json()
                except Exception: data={'raw':rr.text[:2000]}
                record={'id':rid,'endpoint':endpoint,'status':rr.status_code,'headers':dict(rr.headers),'data':data}
                api_results.append(record)
                print('API',json.dumps(record,ensure_ascii=False,indent=2)[:30000])
              except Exception as exc: print('API ERROR',rid,endpoint,repr(exc))
          (OUT/'api.json').write_text(json.dumps(api_results,ensure_ascii=False,indent=2),encoding='utf-8')

          # Detail + view pages for first matching IDs.
          detail_records=[]
          for rid in ids[:40]:
            for kind,u in [('detail',f'https://www.fxbaogao.com/detail/{rid}'),('view',f'https://www.fxbaogao.com/view?id={rid}')]:
              try:
                r=s.get(u,timeout=45,allow_redirects=True)
                text=r.text
                (OUT/f'{kind}_{rid}.html').write_text(text,encoding='utf-8',errors='replace')
                soup=BeautifulSoup(text,'html.parser')
                title=soup.title.get_text(' ',strip=True) if soup.title else ''
                scripts=[urllib.parse.urljoin(r.url,x.get('src')) for x in soup.select('script[src]') if x.get('src')]
                interesting=[]
                for sc in soup.select('script:not([src])'):
                  t=sc.get_text(' ',strip=False)
                  if any(k in t for k in ['pdfPath','docId','uuid','getXcxReportInfo','绿城中国']): interesting.append(t[:100000])
                raw=sorted(set(re.findall(r'https?://[^\s"\'<>\\]+',html.unescape(text))))
                rec={'id':rid,'kind':kind,'status':r.status_code,'final':r.url,'length':len(r.content),'title':title,'scripts':scripts,'inline':interesting,'raw':[x for x in raw if any(k in x.lower() for k in ['pdf','report','fxbaogao'])]}
                detail_records.append(rec)
                print('PAGE',json.dumps(rec,ensure_ascii=False,indent=2)[:100000])
              except Exception as exc: print('PAGE ERROR',rid,kind,repr(exc))
          (OUT/'pages.json').write_text(json.dumps(detail_records,ensure_ascii=False,indent=2),encoding='utf-8')

          # Fetch report/view JS chunks and extract endpoint usage and parameter mappings.
          script_urls=[]
          for rec in detail_records: script_urls += rec.get('scripts',[])
          jsrecs=[]
          for u in list(dict.fromkeys(script_urls)):
            if 'fxbaogao.com' not in u: continue
            try:
              r=s.get(u,timeout=30)
              if r.status_code!=200 or len(r.content)>8_000_000: continue
              t=r.text; low=t.lower(); snippets=[]
              for key in ['getXcxReportInfo','pdfPath','docId','searchJson.id','report.fxbaogao.com','force-download','/download?id=','getCoverPathByPdf']:
                p=0
                while True:
                  p=low.find(key.lower(),p)
                  if p<0: break
                  snippets.append(t[max(0,p-1800):min(len(t),p+5000)])
                  p+=len(key)
                  if len(snippets)>=80: break
                if len(snippets)>=80: break
              if snippets:
                rec={'url':u,'length':len(r.content),'snippets':snippets}; jsrecs.append(rec)
                print('JS',u,'\n','\n---\n'.join(snippets[:20])[:100000])
            except Exception as exc: print('JS ERROR',u,repr(exc))
          (OUT/'js.json').write_text(json.dumps(jsrecs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-greentown-probe
          path: probe/*
          retention-days: 1
          compression-level: 0
