name: Temporary Greentown China fast complete-page packager

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Preflight all pages and assemble complete reports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pillow pypdf
          python3 <<'PY'
          import hashlib,io,json,re,zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT=Path('output');OUT.mkdir(exist_ok=True)
          reports=[
            ('申万宏源','2025-08-14','好房子引领者，理顺机制再出发',31,'https://oss.sdyanbao.com/page/2025/8/18/1223571'),
            ('华泰证券','2025-01-13','匠心独运，驭光而行',29,'https://oss.sdyanbao.com/page/2025/1/20/1143859'),
            ('开源证券','2024-01-22','港股公司首次覆盖报告：自投代建双核驱动，品质龙头逆势攀升',25,'https://oss.sdyanbao.com/page/2024/1/22/924183'),
            ('中银证券','2023-07-15','品质龙头重返行业前十，聚焦核心+提质增效促公司良性发展',58,'https://oss.sdyanbao.com/page/2023/7/15/570154'),
            ('中信建投','2022-10-18','深耕高能级城市结硕果，融资能力强稳中有进',21,'https://oss.sdyanbao.com/page/2022/10/18/373267'),
            ('平安证券','2022-08-15','公司首次覆盖报告：品质标杆房企，逆流而上未来可期',24,'https://oss.sdyanbao.com/page/2022/8/15/336048'),
            ('海通证券','2022-05-16','公司研究报告：品质匠心代表，优质成长蓝筹',26,'https://oss.sdyanbao.com/page/2022/5/16/295455'),
            ('国信证券','2022-04-21','融合央企基因，行业品质标杆',24,'https://oss.sdyanbao.com/page/2022/4/21/281441'),
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://www.sdyanbao.com/','Accept':'image/*,*/*;q=0.8'})
          def get_image(url,timeout=12):
            try:
              r=s.get(url,timeout=timeout,allow_redirects=True)
              if r.status_code!=200 or len(r.content)<5000:return None,{'url':url,'status':r.status_code,'length':len(r.content),'ctype':r.headers.get('content-type')}
              im=Image.open(io.BytesIO(r.content));im.load()
              valid=im.width>=700 and im.height>=900
              return (im.copy() if valid else None),{'url':url,'status':r.status_code,'length':len(r.content),'ctype':r.headers.get('content-type'),'dims':im.size,'valid':valid}
            except Exception as e:return None,{'url':url,'error':repr(e)}
          def clean(x):return re.sub(r'[\\/:*?"<>|]+','_',x).replace(' ','')[:100]
          accepted=[];diag=[]
          for broker,date,title,pages,base in reports:
            preflight=[]
            for i in sorted(set([0,1,9,min(10,pages-1),pages-1])):
              im,d=get_image(f'{base}/{i}.png');d['page']=i;preflight.append(d);diag.append({'broker':broker,**d})
            print('PREFLIGHT',broker,title,json.dumps(preflight,ensure_ascii=False))
            if not all(x.get('valid') for x in preflight):continue
            imgs=[];complete=True
            for i in range(pages):
              im,d=get_image(f'{base}/{i}.png');d['page']=i;diag.append({'broker':broker,**d})
              if im is None:complete=False;print('FAILPAGE',broker,i,json.dumps(d,ensure_ascii=False));break
              if im.mode!='RGB':im=im.convert('RGB')
              imgs.append(im)
            if not complete or len(imgs)!=pages:continue
            fn=f'{len(accepted)+1:02d}_{clean(broker)}_{date.replace("-","")}_绿城中国_{clean(title)}_完整页面版.pdf'
            path=OUT/fn
            imgs[0].save(path,'PDF',save_all=True,append_images=imgs[1:],resolution=150.0,quality=95)
            actual=len(PdfReader(str(path)).pages);content=path.read_bytes()
            if actual!=pages or not content.startswith(b'%PDF-'):raise RuntimeError(f'bad assembled PDF {fn}')
            rec={'filename':fn,'broker':broker,'date':date,'title':title,'pages':actual,'size_bytes':len(content),'sha256':hashlib.sha256(content).hexdigest(),'source_pattern':base+'/{0..N-1}.png','source_type':'public-full-page-images'}
            accepted.append(rec);print('ACCEPT',json.dumps(rec,ensure_ascii=False,indent=2))
            if len(accepted)>=3:break
          (OUT/'diagnostics.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2),encoding='utf-8')
          if len(accepted)<2:raise RuntimeError(f'Only {len(accepted)} complete reports')
          mf=OUT/'manifest.json';mf.write_text(json.dumps(accepted,ensure_ascii=False,indent=2),encoding='utf-8')
          ls=OUT/'报告清单.txt';lines=['绿城中国（03900.HK）券商深度报告清单','','说明：PDF由公开托管的逐页高清原报告页面无删减合成，内容及页数完整；不是券商原始矢量PDF容器。','']
          for i,x in enumerate(accepted,1):lines += [f"{i}. {x['broker']}｜{x['date']}｜{x['title']}",f"   完整页数：{x['pages']}页；文件：{x['filename']}",f"   来源：{x['source_pattern']}",'']
          ls.write_text('\n'.join(lines),encoding='utf-8')
          zp=OUT/f'绿城中国_券商深度报告_{len(accepted)}份_完整页面版.zip'
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for x in accepted:z.write(OUT/x['filename'],arcname=x['filename'])
            z.write(mf,arcname=mf.name);z.write(ls,arcname=ls.name)
          with zipfile.ZipFile(zp) as z:assert z.testzip() is None
          print('DONE',zp,zp.stat().st_size,json.dumps(accepted,ensure_ascii=False,indent=2))
          PY

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-fast-complete-package
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
