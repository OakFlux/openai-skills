name: Temporary Greentown China fast validated package

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build two complete report PDFs from public full pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pillow img2pdf pypdf
          python3 <<'PY'
          import hashlib
          import io
          import json
          import re
          import zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          OUT = Path('output')
          WORK = Path('work')
          OUT.mkdir(exist_ok=True)
          WORK.mkdir(exist_ok=True)

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          targets = [
              {
                  'doc_id': 4998036,
                  'broker': '申万宏源证券',
                  'date': '2025-08-15',
                  'title': '好房子引领者，理顺机制再出发',
                  'pages': 31,
                  'cover_prefix': 'report-image/2025/08/15/4998036',
              },
              {
                  'doc_id': 3093383,
                  'broker': '浙商证券',
                  'date': '2022-03-29',
                  'title': '坚守品质标杆，融资优势+聚焦核心，高质量发展可期',
                  'pages': 20,
                  'cover_prefix': 'report-image/2022/03/29/3093383',
              },
          ]

          def clean(value):
              value = re.sub(r'[\\/:*?"<>|]+', '_', str(value))
              return re.sub(r'\s+', '', value).strip('._')[:110]

          def fetch_page(target, page_number):
              base = f"https://public.fxbaogao.com/{target['cover_prefix']}-{page_number}.png"
              variants = [
                  base + '?x-oss-process=image/format,png',
                  base,
                  base + '?x-oss-process=image/format,webp',
              ]
              errors = []
              for url in variants:
                  try:
                      response = requests.get(
                          url,
                          headers={
                              'User-Agent': UA,
                              'Referer': f"https://www.fxbaogao.com/detail/{target['doc_id']}",
                              'Accept': 'image/avif,image/webp,image/apng,image/png,image/*,*/*;q=0.8',
                          },
                          timeout=45,
                          allow_redirects=True,
                      )
                      if response.status_code != 200 or len(response.content) < 15_000:
                          errors.append({
                              'url': url,
                              'status': response.status_code,
                              'size': len(response.content),
                              'ctype': response.headers.get('content-type'),
                          })
                          continue
                      image = Image.open(io.BytesIO(response.content))
                      image.load()
                      if image.width < 500 or image.height < 700:
                          errors.append({'url': url, 'dimensions': [image.width, image.height]})
                          continue
                      image = image.convert('RGB')
                      out_dir = WORK / str(target['doc_id'])
                      out_dir.mkdir(parents=True, exist_ok=True)
                      out_path = out_dir / f'{page_number:03d}.jpg'
                      image.save(out_path, 'JPEG', quality=95, subsampling=0, optimize=True)
                      return {
                          'page': page_number,
                          'path': str(out_path),
                          'source_url': response.url,
                          'source_size': len(response.content),
                          'dimensions': [image.width, image.height],
                      }
                  except Exception as exc:
                      errors.append({'url': url, 'error': repr(exc)})
              raise RuntimeError(
                  f"报告 {target['doc_id']} 第 {page_number}/{target['pages']} 页失败："
                  + json.dumps(errors, ensure_ascii=False)
              )

          manifest = []
          page_log = []

          for index, target in enumerate(targets, start=1):
              print('START', json.dumps(target, ensure_ascii=False))
              results = {}
              with ThreadPoolExecutor(max_workers=8) as executor:
                  futures = {
                      executor.submit(fetch_page, target, page_number): page_number
                      for page_number in range(1, target['pages'] + 1)
                  }
                  for future in as_completed(futures):
                      page_number = futures[future]
                      result = future.result()
                      results[page_number] = result
                      page_log.append({'doc_id': target['doc_id'], **result})
                      print('PAGE', target['doc_id'], page_number, result['dimensions'], result['source_size'])

              if sorted(results) != list(range(1, target['pages'] + 1)):
                  raise RuntimeError(
                      f"报告 {target['doc_id']} 页面不完整：{sorted(results)}"
                  )

              ordered_paths = [results[i]['path'] for i in range(1, target['pages'] + 1)]
              filename = (
                  f"{index:02d}_{clean(target['broker'])}_{target['date'].replace('-', '')}_"
                  f"绿城中国_{clean(target['title'])}_公司深度.pdf"
              )
              pdf_path = OUT / filename
              pdf_path.write_bytes(img2pdf.convert(ordered_paths))
              content = pdf_path.read_bytes()
              if not content.startswith(b'%PDF-') or len(content) < 200_000:
                  raise RuntimeError(f'生成PDF无效：{filename}')
              reader = PdfReader(str(pdf_path))
              actual_pages = len(reader.pages)
              if actual_pages != target['pages']:
                  raise RuntimeError(
                      f"报告 {target['doc_id']} PDF页数错误：{actual_pages} != {target['pages']}"
                  )
              manifest.append({
                  'filename': filename,
                  'broker': target['broker'],
                  'date': target['date'],
                  'title': target['title'],
                  'pages': actual_pages,
                  'size_bytes': pdf_path.stat().st_size,
                  'sha256': hashlib.sha256(content).hexdigest(),
                  'doc_id': target['doc_id'],
                  'source_detail': f"https://www.fxbaogao.com/detail/{target['doc_id']}",
                  'source_method': 'public-full-page-images',
              })
              print('ACCEPT', json.dumps(manifest[-1], ensure_ascii=False, indent=2))

          list_path = OUT / '报告清单.txt'
          lines = ['绿城中国（03900.HK）券商深度报告清单', '']
          for i, item in enumerate(manifest, 1):
              lines.extend([
                  f"{i}. {item['broker']}｜{item['date']}｜{item['title']}",
                  f"   页数：{item['pages']}页；文件：{item['filename']}",
                  f"   SHA-256：{item['sha256']}",
                  f"   公开报告页：{item['source_detail']}",
                  '',
              ])
          list_path.write_text('\n'.join(lines), encoding='utf-8')
          manifest_path = OUT / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          log_path = OUT / 'page_log.json'
          log_path.write_text(json.dumps(page_log, ensure_ascii=False, indent=2), encoding='utf-8')

          zip_path = OUT / '绿城中国_券商深度报告_2份.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for item in manifest:
                  archive.write(OUT / item['filename'], arcname=item['filename'])
              archive.write(list_path, arcname=list_path.name)
              archive.write(manifest_path, arcname=manifest_path.name)

          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP完整性失败：{bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'ZIP中的PDF数量错误：{len(pdfs)}')

          print('PACKAGE', zip_path, zip_path.stat().st_size)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload validated report package
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-two-deep-reports
          path: |
            output/*.pdf
            output/*.zip
            output/报告清单.txt
            output/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
