name: Temporary Greentown China original PDF downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Search exact report titles, download and validate original PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 <<'PY'
          import hashlib
          import html
          import io
          import json
          import re
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          OUT = Path('output')
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
          })
          search_api = 'https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'

          def strip_tags(value):
              return re.sub(r'<[^>]+>', '', html.unescape(str(value or '')))

          def norm(value):
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', strip_tags(value)).lower()

          def clean(value):
              value = re.sub(r'[\\/:*?"<>|]+', '_', strip_tags(value)).strip()
              value = re.sub(r'\s+', '', value)
              return value[:105] or 'report'

          query_specs = [
              {'query': '用品质铸就 穿越周期的力量', 'rank': 10000},
              {'query': '好房子引领者 理顺机制再出发', 'rank': 9500},
              {'query': '改善房企标杆 龙头战法 聚焦核心', 'rank': 9000},
              {'query': '匠心独运 驭光而行 绿城中国', 'rank': 8500},
              {'query': '决胜壁龛市场 挖潜新模式价值', 'rank': 8200},
              {'query': '自投代建双核驱动 品质龙头逆势攀升', 'rank': 7900},
              {'query': '品质龙头重返行业前十', 'rank': 7600},
              {'query': '深耕高能级城市结硕果', 'rank': 7300},
              {'query': '品质标杆房企 逆流而上未来可期', 'rank': 7000},
              {'query': '品质匠心代表 优质成长蓝筹', 'rank': 6700},
              {'query': '融合央企基因 行业品质标杆', 'rank': 6400},
              {'query': '坚守品质标杆 融资优势 聚焦核心', 'rank': 6100},
          ]

          rows_by_doc = {}
          query_hits = []
          for spec in query_specs:
              bodies = [
                  {'pageNum': 1, 'pageSize': 100, 'keywords': spec['query'], 'order': 2,
                   'stockCodes': ['03900'], 'years': [], 'industryNames': [], 'tagKeys': [],
                   'docType': [], 'typeIdList': []},
                  {'pageIndex': 1, 'pageSize': 100, 'keywords': spec['query'], 'orderBy': 2,
                   'filterStocks': ['03900'], 'stockCodes': ['03900'], 'filterYears': [],
                   'filterIndustries': [], 'filterDatatype': [], 'filterDoctype': [],
                   'filterV2': [], 'filterDate': ['', ''], 'onlyTitle': False, 'noParticiple': False},
                  {'pageNum': 1, 'pageSize': 100, 'keywords': spec['query'], 'order': 2},
              ]
              found = []
              for body_index, body in enumerate(bodies):
                  try:
                      response = session.post(search_api, json=body, timeout=45)
                      print('\nSEARCH', spec['query'], body_index, response.status_code)
                      if response.status_code != 200:
                          continue
                      payload = response.json()
                      data = payload.get('data') or {}
                      rows = data.get('dataList') or []
                      print('SEARCH META', json.dumps({
                          'count': data.get('count'), 'pageCount': data.get('pageCount'),
                          'currPage': data.get('currPage'), 'rows': len(rows)
                      }, ensure_ascii=False))
                      for row in rows:
                          title = strip_tags(row.get('title'))
                          stock_name = strip_tags(row.get('stockName'))
                          hay = norm(title + ' ' + stock_name)
                          if '绿城中国' not in hay and '03900' not in str(row.get('stockCode') or ''):
                              continue
                          doc_id = str(row.get('docId') or '')
                          if not doc_id:
                              continue
                          row_copy = dict(row)
                          row_copy['_query_rank'] = spec['rank']
                          row_copy['_matched_query'] = spec['query']
                          rows_by_doc.setdefault(doc_id, row_copy)
                          found.append(row_copy)
                          print(' HIT', json.dumps({
                              'query': spec['query'], 'docId': doc_id,
                              'pubTimeStr': row.get('pubTimeStr'), 'orgName': row.get('orgName'),
                              'pageNum': row.get('pageNum'), 'isDeep': row.get('isDeep'),
                              'docType': row.get('docType'), 'title': title,
                              'pdfPath': row.get('pdfPath'), 'stockCode': row.get('stockCode')
                          }, ensure_ascii=False))
                      if found:
                          break
                  except Exception as exc:
                      print('SEARCH ERROR', spec['query'], body_index, repr(exc))
              query_hits.extend(found)

          # Known public metadata fallback already confirmed from the no-auth search index.
          if '3093383' not in rows_by_doc:
              rows_by_doc['3093383'] = {
                  'docId': 3093383,
                  'pubTimeStr': '2022/03/29/',
                  'orgName': '浙商证券',
                  'pageNum': 20,
                  'isDeep': True,
                  'docType': 1,
                  'title': '绿城中国深度报告：坚守品质标杆，融资优势+聚焦核心，高质量发展可期',
                  'pdfPath': 'report/2022/03/29/3093383.pdf',
                  'stockCode': '03900',
                  '_query_rank': 1000,
                  '_matched_query': 'known-index-fallback',
              }

          all_rows = list(rows_by_doc.values())
          (OUT / 'search_metadata.json').write_text(
              json.dumps(all_rows, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('\nALL UNIQUE MATCHES', len(all_rows))
          for row in all_rows:
              print(json.dumps({
                  'docId': row.get('docId'), 'date': row.get('pubTimeStr'),
                  'broker': row.get('orgName'), 'pages': row.get('pageNum'),
                  'isDeep': row.get('isDeep'), 'docType': row.get('docType'),
                  'title': strip_tags(row.get('title')), 'pdfPath': row.get('pdfPath'),
                  'query': row.get('_matched_query')
              }, ensure_ascii=False))

          exclude_terms = [
              '年报', '中期报告', '半年报', '点评', '周报', '月报', '业绩预告',
              '销售简报', '信息更新', '债券', '信用评级', 'ESG报告'
          ]
          candidates = []
          for row in all_rows:
              title = strip_tags(row.get('title'))
              pages = int(row.get('pageNum') or 0)
              path = str(row.get('pdfPath') or '').lstrip('/')
              if not path or pages < 18:
                  continue
              if row.get('isNotBroker') is True:
                  continue
              if any(term in title for term in exclude_terms):
                  continue
              score = int(row.get('_query_rank') or 0) + pages * 5
              if row.get('isDeep'):
                  score += 1000
              if '首次覆盖' in title or '深度' in title:
                  score += 400
              candidates.append((score, row))
          candidates.sort(key=lambda item: item[0], reverse=True)

          print('\nRANKED CANDIDATES', len(candidates))
          for score, row in candidates:
              print(score, row.get('docId'), row.get('pubTimeStr'), row.get('orgName'),
                    row.get('pageNum'), row.get('isDeep'), strip_tags(row.get('title')),
                    row.get('pdfPath'))

          bases = [
              'https://report.fxbaogao.com/',
              'https://dr.fxbaogao.com/',
              'https://static.fxbaogao.com/',
          ]
          accepted = []
          diagnostics = []
          used_titles = set()
          used_brokers = set()

          for score, row in candidates:
              if len(accepted) >= 3:
                  break
              title = strip_tags(row.get('title'))
              title_key = norm(title)
              broker = strip_tags(row.get('orgName')) or '券商'
              if title_key in used_titles:
                  continue
              pdf_path = str(row.get('pdfPath') or '').lstrip('/')
              test_urls = [base + pdf_path for base in bases]
              for url in test_urls:
                  try:
                      response = session.get(
                          url,
                          headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://www.fxbaogao.com/',
                              'Accept': 'application/pdf, application/octet-stream, */*',
                          },
                          timeout=180,
                          allow_redirects=True,
                      )
                      diag = {
                          'docId': row.get('docId'), 'title': title, 'url': url,
                          'status': response.status_code, 'final_url': response.url,
                          'content_type': response.headers.get('content-type'),
                          'length': len(response.content), 'signature': repr(response.content[:24]),
                      }
                      diagnostics.append(diag)
                      print('DOWNLOAD TRY', json.dumps(diag, ensure_ascii=False))
                      content = response.content
                      if response.status_code != 200 or not content.startswith(b'%PDF-') or len(content) < 150000:
                          continue
                      reader = PdfReader(io.BytesIO(content))
                      actual_pages = len(reader.pages)
                      if actual_pages < 18:
                          print('REJECT SHORT', actual_pages)
                          continue
                      first_text = ''
                      try:
                          for page_index in range(min(4, actual_pages)):
                              first_text += reader.pages[page_index].extract_text() or ''
                      except Exception:
                          pass
                      if '绿城' not in first_text and 'Greentown' not in first_text:
                          print('REJECT COMPANY MISMATCH', first_text[:500])
                          continue
                      date = str(row.get('pubTimeStr') or '').strip('/').replace('/', '-')
                      filename = (
                          f"{len(accepted)+1:02d}_{clean(broker)}_{date.replace('-', '')}_"
                          f"绿城中国_{clean(title)}.pdf"
                      )
                      destination = OUT / filename
                      destination.write_bytes(content)
                      record = {
                          'filename': filename,
                          'broker': broker,
                          'date': date,
                          'title': title,
                          'pages': actual_pages,
                          'metadata_pages': int(row.get('pageNum') or 0),
                          'size_bytes': len(content),
                          'sha256': hashlib.sha256(content).hexdigest(),
                          'source_pdf': response.url,
                          'docId': row.get('docId'),
                          'pdfPath': row.get('pdfPath'),
                      }
                      accepted.append(record)
                      used_titles.add(title_key)
                      used_brokers.add(norm(broker))
                      print('ACCEPT', json.dumps(record, ensure_ascii=False, indent=2))
                      break
                  except Exception as exc:
                      print('DOWNLOAD ERROR', url, repr(exc))

          (OUT / 'diagnostics.json').write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          if len(accepted) < 2:
              raise RuntimeError(f'Only {len(accepted)} complete public PDFs obtained')

          manifest_path = OUT / 'manifest.json'
          manifest_path.write_text(json.dumps(accepted, ensure_ascii=False, indent=2), encoding='utf-8')
          list_path = OUT / '报告清单.txt'
          lines = ['绿城中国（03900.HK）券商深度报告清单', '']
          for index, record in enumerate(accepted, 1):
              lines.extend([
                  f"{index}. {record['broker']}｜{record['date']}｜{record['title']}",
                  f"   页数：{record['pages']}页；文件：{record['filename']}",
                  f"   原始PDF：{record['source_pdf']}",
                  '',
              ])
          list_path.write_text('\n'.join(lines), encoding='utf-8')

          zip_path = OUT / f"绿城中国_券商深度报告_{len(accepted)}份.zip"
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for record in accepted:
                  archive.write(OUT / record['filename'], arcname=record['filename'])
              archive.write(manifest_path, arcname=manifest_path.name)
              archive.write(list_path, arcname=list_path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise RuntimeError(f'ZIP validation failed: {bad_member}')
          print('DONE', zip_path, zip_path.stat().st_size)
          print(json.dumps(accepted, ensure_ascii=False, indent=2))
          PY

      - name: Upload validated package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-original-pdf-results-v3
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
