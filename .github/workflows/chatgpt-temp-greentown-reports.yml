name: Temporary Greentown China source probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Eastmoney HK and 9fzt sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 <<'PY'
          import json
          import re
          import urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('probe')
          OUT.mkdir(exist_ok=True)
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})

          # Eastmoney HK data-center probes.
          hosts = [
              'https://datacenter-web.eastmoney.com/api/data/v1/get',
              'https://datacenter.eastmoney.com/securities/api/data/v1/get',
          ]
          report_names = [
              'RPT_HKF10_FN_GONGBU',
              'RPT_HKF10_RESEARCH_REPORT', 'RPT_HKF10_RESEARCH', 'RPT_HK_RESEARCH_REPORT',
              'RPT_HK_RESEARCH', 'RPT_HKF10_FN_RESEARCH', 'RPT_HKSECURITY_RESEARCHREPORT',
              'RPT_HKF10_ORG_RESEARCH', 'RPT_HK_REPORT', 'RPT_HKSE_RESEARCH',
          ]
          filters = ['(SECURITY_CODE="03900")', '(SECUCODE="03900.HK")', '(SECURITY_CODE="3900")']
          east = []
          for host in hosts:
              for rn in report_names:
                  for flt in filters:
                      params = {
                          'sortColumns':'REPORT_DATE', 'sortTypes':'-1', 'pageSize':'100', 'pageNumber':'1',
                          'reportName':rn, 'columns':'ALL', 'filter':flt, 'source':'F10', 'client':'PC'
                      }
                      try:
                          r=s.get(host,params=params,timeout=20)
                          try: data=r.json()
                          except Exception: data={'raw':r.text[:500]}
                          result=data.get('result') if isinstance(data,dict) else None
                          rows=(result or {}).get('data') if isinstance(result,dict) else None
                          rec={'host':host,'reportName':rn,'filter':flt,'status':r.status_code,'success':data.get('success') if isinstance(data,dict) else None,'message':data.get('message') if isinstance(data,dict) else None,'count':len(rows or []),'first':(rows or [])[:3]}
                          east.append(rec)
                          if rec['success'] or rec['count'] or rn=='RPT_HKF10_FN_GONGBU':
                              print('EAST',json.dumps(rec,ensure_ascii=False,indent=2))
                      except Exception as exc:
                          print('EAST ERROR',host,rn,flt,repr(exc))
          (OUT/'eastmoney.json').write_text(json.dumps(east,ensure_ascii=False,indent=2),encoding='utf-8')

          # 9fzt and Sina page probes.
          urls=[
              'https://gmg.9fzt.com/report/HKSE/03900/796957128518.html',
              'https://gmg.9fzt.com/report/HKSE/03900/800631919576.html',
              'https://gmg.9fzt.com/report/HKSE/03900/index.html',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/808561860344/index.phtml',
          ]
          pages=[]
          script_urls=[]
          needles=['pdf','download','report','研报','796957128518','800631919576','808561860344','api','fileurl','url']
          for i,u in enumerate(urls):
              try:
                  r=s.get(u,timeout=25,allow_redirects=True)
                  text=r.text
                  (OUT/f'page{i}.html').write_text(text,encoding='utf-8',errors='replace')
                  soup=BeautifulSoup(text,'html.parser')
                  scripts=[urllib.parse.urljoin(r.url,x.get('src')) for x in soup.select('script[src]') if x.get('src')]
                  script_urls += scripts
                  inline=[]
                  for sc in soup.select('script:not([src])'):
                      t=sc.get_text(' ',strip=False)
                      if any(n.lower() in t.lower() for n in needles): inline.append(t[:20000])
                  links=[]
                  for a in soup.select('a[href]'):
                      href=urllib.parse.urljoin(r.url,a.get('href'))
                      label=' '.join(a.get_text(' ',strip=True).split())
                      if any(n.lower() in (href+' '+label).lower() for n in needles): links.append({'text':label,'href':href})
                  raws=sorted(set(re.findall(r'https?://[^\s"\'<>\\]+',text)))
                  rec={'url':u,'status':r.status_code,'final':r.url,'length':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'scripts':scripts,'inline':inline,'links':links,'raw_interesting':[x for x in raws if any(n.lower() in x.lower() for n in needles)]}
                  pages.append(rec)
                  print('PAGE',json.dumps(rec,ensure_ascii=False,indent=2))
              except Exception as exc: print('PAGE ERROR',u,repr(exc))
          (OUT/'pages.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')

          # Fetch only compact same-domain JS assets and grep endpoints.
          js=[]
          for u in list(dict.fromkeys(script_urls))[:30]:
              if not any(h in u for h in ['9fzt.com','sina.com.cn']): continue
              try:
                  r=s.get(u,timeout=15)
                  if r.status_code!=200 or len(r.content)>8_000_000: continue
                  text=r.text
                  snippets=[]
                  low=text.lower()
                  for n in ['pdf','download','report/detail','report/list','api/report','vreport','研报']:
                      p=0
                      while True:
                          p=low.find(n.lower(),p)
                          if p<0: break
                          snippets.append(text[max(0,p-400):min(len(text),p+900)])
                          p+=len(n)
                          if len(snippets)>=30: break
                      if len(snippets)>=30: break
                  if snippets:
                      rec={'url':u,'length':len(r.content),'snippets':snippets}
                      js.append(rec)
                      print('JS',u,'\n','\n---\n'.join(snippets[:10]))
              except Exception as exc: print('JS ERROR',u,repr(exc))
          (OUT/'js.json').write_text(json.dumps(js,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: greentown-source-probe
          path: probe/*
          retention-days: 1
          compression-level: 0
