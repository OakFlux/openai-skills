name: Temporary Greentown China Eastmoney PDF downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Search Eastmoney by keyword and validate original PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 <<'PY'
          import hashlib
          import io
          import json
          import re
          import time
          import unicodedata
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          OUT = Path('output')
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml',
              'Accept': 'application/json,text/plain,*/*',
          })

          def norm(value):
              value = unicodedata.normalize('NFKC', str(value or ''))
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value).lower()

          def clean(value):
              value = re.sub(r'[\\/:*?"<>|]+', '_', str(value or '')).strip()
              value = re.sub(r'\s+', '', value)
              return value[:110] or 'report'

          preferred = [
              ('用品质铸就穿越周期的力量', 10000),
              ('好房子引领者理顺机制再出发', 9500),
              ('改善房企标杆龙头战法聚焦核心', 9000),
              ('匠心独运驭光而行', 8500),
              ('决胜壁龛市场挖潜新模式价值', 8200),
              ('自投代建双核驱动品质龙头逆势攀升', 7900),
              ('品质龙头重返行业前十', 7600),
              ('深耕高能级城市结硕果', 7300),
              ('品质标杆房企逆流而上未来可期', 7000),
              ('品质匠心代表优质成长蓝筹', 6700),
              ('融合央企基因行业品质标杆', 6400),
              ('坚守品质标杆融资优势聚焦核心高质量发展可期', 6100),
          ]
          search_terms = [
              '绿城中国',
              '用品质铸就 穿越周期的力量',
              '好房子引领者 理顺机制再出发',
              '改善房企标杆 龙头战法 聚焦核心',
              '匠心独运 驭光而行',
              '决胜壁龛市场 挖潜新模式价值',
              '自投代建双核驱动 品质龙头逆势攀升',
              '融合央企基因 行业品质标杆',
          ]

          def extract_rows(payload):
              rows = []
              if isinstance(payload, dict):
                  for key in ['data', 'Data', 'rows', 'list', 'dataList']:
                      value = payload.get(key)
                      if isinstance(value, list):
                          rows.extend(value)
                  result = payload.get('result')
                  if isinstance(result, dict):
                      for key in ['data', 'rows', 'list', 'dataList']:
                          value = result.get(key)
                          if isinstance(value, list):
                              rows.extend(value)
              return [row for row in rows if isinstance(row, dict)]

          all_rows = []
          seen_codes = set()
          query_log = []
          list_url = 'https://reportapi.eastmoney.com/report/list'

          for term in search_terms:
              for qtype in ['0', '1']:
                  max_pages = 1
                  for page in range(1, 11):
                      if page > max_pages:
                          break
                      params = {
                          'industryCode': '*', 'pageSize': '100', 'industry': '*',
                          'rating': '*', 'ratingChange': '*',
                          'beginTime': '2000-01-01', 'endTime': '2030-01-01',
                          'pageNo': str(page), 'fields': '', 'qType': qtype,
                          'orgCode': '', 'code': '', 'rcode': '',
                          'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                          'keyword': term,
                      }
                      try:
                          response = session.get(list_url, params=params, timeout=60)
                          print('\nGET LIST', term, qtype, page, response.status_code, response.url)
                          try:
                              payload = response.json()
                          except Exception:
                              payload = {'raw': response.text[:5000]}
                          rows = extract_rows(payload)
                          tp = payload.get('TotalPage') or payload.get('totalPage') or payload.get('pageCount') or 1 if isinstance(payload, dict) else 1
                          try:
                              max_pages = min(10, max(1, int(tp)))
                          except Exception:
                              max_pages = 1
                          summary = {
                              'endpoint': 'list-get', 'term': term, 'qtype': qtype,
                              'page': page, 'status': response.status_code,
                              'totalPage': tp, 'rows': len(rows),
                              'top_keys': list(payload.keys()) if isinstance(payload, dict) else [],
                          }
                          query_log.append(summary)
                          print('SUMMARY', json.dumps(summary, ensure_ascii=False))
                          if page == 1 and rows:
                              print('FIRST ROW RAW', json.dumps(rows[0], ensure_ascii=False, indent=2)[:20000])
                          for row in rows:
                              info = str(row.get('infoCode') or row.get('INFO_CODE') or row.get('reportCode') or '')
                              title = str(row.get('title') or row.get('TITLE') or row.get('reportName') or '')
                              stock_name = str(row.get('stockName') or row.get('SECURITY_NAME_ABBR') or '')
                              if not info or info in seen_codes:
                                  continue
                              hay = norm(title + ' ' + stock_name)
                              if '绿城中国' not in hay and not any(p in hay for p, _ in preferred):
                                  continue
                              seen_codes.add(info)
                              row_copy = dict(row)
                              row_copy['_source_term'] = term
                              row_copy['_infoCode'] = info
                              all_rows.append(row_copy)
                              print('MATCH', json.dumps({
                                  'term': term,
                                  'infoCode': info,
                                  'title': title,
                                  'stockName': stock_name,
                                  'stockCode': row.get('stockCode') or row.get('SECURITY_CODE'),
                                  'org': row.get('orgSName') or row.get('orgName') or row.get('ORG_NAME'),
                                  'date': row.get('publishDate') or row.get('REPORT_DATE'),
                                  'pages': row.get('attachPages') or row.get('PAGE_NUM'),
                              }, ensure_ascii=False))
                          if not rows:
                              break
                      except Exception as exc:
                          print('GET LIST ERROR', term, qtype, page, repr(exc))
                          break

          # Probe the newer /list2 endpoint using both GET and POST payloads.
          list2_url = 'https://reportapi.eastmoney.com/report/list2'
          list2_bodies = [
              {'pageSize': 200, 'pageNo': 1, 'beginTime': '2000-01-01', 'endTime': '2030-01-01',
               'keyword': '绿城中国', 'code': '03900', 'qType': 0},
              {'pageSize': 200, 'pageNum': 1, 'beginTime': '2000-01-01', 'endTime': '2030-01-01',
               'keyword': '绿城中国', 'stockCode': '03900', 'qType': 0},
              {'pageSize': 200, 'pageNo': 1, 'keyword': '绿城中国', 'qType': 0},
          ]
          for body_index, body in enumerate(list2_bodies):
              for method in ['POST', 'GET']:
                  try:
                      if method == 'POST':
                          response = session.post(list2_url, json=body, timeout=60)
                      else:
                          response = session.get(list2_url, params=body, timeout=60)
                      print('\nLIST2', method, body_index, response.status_code, response.url)
                      try:
                          payload = response.json()
                      except Exception:
                          payload = {'raw': response.text[:5000]}
                      rows = extract_rows(payload)
                      summary = {
                          'endpoint': 'list2-' + method.lower(), 'body_index': body_index,
                          'body': body, 'status': response.status_code, 'rows': len(rows),
                          'top_keys': list(payload.keys()) if isinstance(payload, dict) else [],
                      }
                      query_log.append(summary)
                      print('SUMMARY', json.dumps(summary, ensure_ascii=False))
                      if rows:
                          print('FIRST ROW RAW', json.dumps(rows[0], ensure_ascii=False, indent=2)[:20000])
                      for row in rows:
                          info = str(row.get('infoCode') or row.get('INFO_CODE') or row.get('reportCode') or '')
                          title = str(row.get('title') or row.get('TITLE') or row.get('reportName') or '')
                          stock_name = str(row.get('stockName') or row.get('SECURITY_NAME_ABBR') or '')
                          if not info or info in seen_codes:
                              continue
                          hay = norm(title + ' ' + stock_name)
                          if '绿城中国' not in hay and not any(p in hay for p, _ in preferred):
                              continue
                          seen_codes.add(info)
                          row_copy = dict(row)
                          row_copy['_source_term'] = 'list2'
                          row_copy['_infoCode'] = info
                          all_rows.append(row_copy)
                          print('MATCH LIST2', json.dumps(row_copy, ensure_ascii=False)[:10000])
                  except Exception as exc:
                      print('LIST2 ERROR', method, body_index, repr(exc))

          (OUT / 'query_log.json').write_text(json.dumps(query_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'matched_rows.json').write_text(json.dumps(all_rows, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\nTOTAL MATCHED ROWS', len(all_rows))

          exclude_terms = ['点评', '年报', '半年报', '中报', '周报', '月报', '业绩预告', '销售简报', '债券']
          candidates = []
          for row in all_rows:
              title = str(row.get('title') or row.get('TITLE') or row.get('reportName') or '')
              pages_raw = row.get('attachPages') or row.get('PAGE_NUM') or row.get('pageNum') or 0
              try:
                  pages = int(pages_raw or 0)
              except Exception:
                  pages = 0
              if any(term in title for term in exclude_terms):
                  continue
              hay = norm(title)
              score = pages * 5
              for pattern, bonus in preferred:
                  if pattern in hay or hay in pattern:
                      score += bonus
              if '深度' in title or '首次覆盖' in title:
                  score += 500
              candidates.append((score, row))
          candidates.sort(key=lambda item: item[0], reverse=True)
          print('\nRANKED CANDIDATES')
          for score, row in candidates:
              print(score, json.dumps({
                  'infoCode': row.get('_infoCode'),
                  'title': row.get('title') or row.get('TITLE') or row.get('reportName'),
                  'org': row.get('orgSName') or row.get('orgName') or row.get('ORG_NAME'),
                  'date': row.get('publishDate') or row.get('REPORT_DATE'),
                  'pages': row.get('attachPages') or row.get('PAGE_NUM') or row.get('pageNum'),
              }, ensure_ascii=False))

          accepted = []
          download_log = []
          used_titles = set()
          for score, row in candidates:
              if len(accepted) >= 3:
                  break
              info_code = str(row.get('_infoCode') or '')
              title = str(row.get('title') or row.get('TITLE') or row.get('reportName') or '绿城中国公司深度报告')
              title_key = norm(title)
              if not info_code or title_key in used_titles:
                  continue
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf?download=1',
              ]
              for url in urls:
                  try:
                      response = session.get(
                          url,
                          headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://data.eastmoney.com/',
                              'Accept': 'application/pdf,application/octet-stream,*/*',
                          },
                          timeout=180,
                          allow_redirects=True,
                      )
                      record = {
                          'infoCode': info_code, 'url': url, 'status': response.status_code,
                          'final_url': response.url,
                          'content_type': response.headers.get('content-type'),
                          'length': len(response.content),
                          'signature': repr(response.content[:24]),
                      }
                      download_log.append(record)
                      print('DOWNLOAD', json.dumps(record, ensure_ascii=False))
                      content = response.content
                      if response.status_code != 200 or not content.startswith(b'%PDF-') or len(content) < 150000:
                          continue
                      reader = PdfReader(io.BytesIO(content))
                      actual_pages = len(reader.pages)
                      if actual_pages < 18:
                          print('REJECT SHORT', actual_pages)
                          continue
                      first_text = ''
                      try:
                          for page_index in range(min(4, actual_pages)):
                              first_text += reader.pages[page_index].extract_text() or ''
                      except Exception:
                          pass
                      if '绿城' not in first_text and 'Greentown' not in first_text:
                          print('REJECT COMPANY MISMATCH', first_text[:500])
                          continue
                      broker = str(row.get('orgSName') or row.get('orgName') or row.get('ORG_NAME') or '券商')
                      date = str(row.get('publishDate') or row.get('REPORT_DATE') or '').replace(' 00:00:00.000', '')[:10]
                      filename = f"{len(accepted)+1:02d}_{clean(broker)}_{date.replace('-', '')}_绿城中国_{clean(title)}.pdf"
                      destination = OUT / filename
                      destination.write_bytes(content)
                      accepted_record = {
                          'filename': filename, 'broker': broker, 'date': date,
                          'title': title, 'pages': actual_pages,
                          'size_bytes': len(content),
                          'sha256': hashlib.sha256(content).hexdigest(),
                          'source_pdf': response.url, 'infoCode': info_code,
                      }
                      accepted.append(accepted_record)
                      used_titles.add(title_key)
                      print('ACCEPT', json.dumps(accepted_record, ensure_ascii=False, indent=2))
                      break
                  except Exception as exc:
                      print('DOWNLOAD ERROR', url, repr(exc))

          (OUT / 'download_log.json').write_text(json.dumps(download_log, ensure_ascii=False, indent=2), encoding='utf-8')
          if len(accepted) < 2:
              raise RuntimeError(f'Only {len(accepted)} complete PDFs obtained')

          manifest_path = OUT / 'manifest.json'
          manifest_path.write_text(json.dumps(accepted, ensure_ascii=False, indent=2), encoding='utf-8')
          list_path = OUT / '报告清单.txt'
          lines = ['绿城中国（03900.HK）券商深度报告清单', '']
          for index, record in enumerate(accepted, 1):
              lines.extend([
                  f"{index}. {record['broker']}｜{record['date']}｜{record['title']}",
                  f"   页数：{record['pages']}页；文件：{record['filename']}",
                  f"   原始PDF：{record['source_pdf']}",
                  '',
              ])
          list_path.write_text('\n'.join(lines), encoding='utf-8')

          zip_path = OUT / f"绿城中国_券商深度报告_{len(accepted)}份.zip"
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for record in accepted:
                  archive.write(OUT / record['filename'], arcname=record['filename'])
              archive.write(manifest_path, arcname=manifest_path.name)
              archive.write(list_path, arcname=list_path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP integrity check failed: {bad}')
          print('DONE', zip_path, zip_path.stat().st_size)
          print(json.dumps(accepted, ensure_ascii=False, indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-eastmoney-pdf-results
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
