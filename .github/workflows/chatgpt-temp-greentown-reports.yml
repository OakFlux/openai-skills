name: Temporary Greentown China source mapping

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exact public preview paths and PDF responses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import requests

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/',
              'Accept': 'application/json, text/plain, */*',
          })

          docs = {
              4998036: 'report/2025/08/15/4998036.pdf',
              3093383: 'report/2022/03/29/3093383.pdf',
              5631238: 'report/2026/08/21/5631238.pdf',
          }
          for doc_id, pdf_path in docs.items():
              url = f'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId={doc_id}'
              r = s.get(url, timeout=25)
              print('PREVIEW', doc_id, r.status_code, r.text[:20000])
              for host in ['https://report.fxbaogao.com/', 'https://public.fxbaogao.com/', 'https://dr.fxbaogao.com/']:
                  pdf_url = host + pdf_path
                  for extra_headers in [
                      {},
                      {'Range': 'bytes=0-1023'},
                      {'Sec-Fetch-Site': 'same-site', 'Sec-Fetch-Mode': 'cors', 'Sec-Fetch-Dest': 'empty'},
                  ]:
                      try:
                          h = {
                              'User-Agent': s.headers['User-Agent'],
                              'Referer': f'https://www.fxbaogao.com/detail/{doc_id}',
                              'Accept': 'application/pdf,application/octet-stream,*/*',
                              **extra_headers,
                          }
                          rr = requests.get(pdf_url, headers=h, timeout=20, allow_redirects=True, stream=True)
                          first = b''
                          try:
                              first = next(rr.iter_content(2048), b'')
                          except Exception as exc:
                              first = repr(exc).encode()
                          print('PDF', json.dumps({
                              'doc_id': doc_id,
                              'url': pdf_url,
                              'headers': extra_headers,
                              'status': rr.status_code,
                              'final': rr.url,
                              'response_headers': dict(rr.headers),
                              'first_len': len(first),
                              'signature': repr(first[:80]),
                          }, ensure_ascii=False))
                          rr.close()
                      except Exception as exc:
                          print('PDF_ERROR', doc_id, pdf_url, extra_headers, repr(exc))
          PY
