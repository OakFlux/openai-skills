name: Temporary Fxbaogao search API probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect search API implementation and query GreenTown
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 <<'PY'
          import json,re
          from pathlib import Path
          import requests

          OUT=Path('probe'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
          jsurl='https://www.fxbaogao.com/_fxbg/2608241759/js/app-pages-fxbg-main-js.bf8665a4a5f068d0e1c6.chunk.js'
          r=s.get(jsurl,timeout=60); print('JS',r.status_code,len(r.content)); r.raise_for_status(); text=r.text
          (OUT/'app.js').write_text(text,encoding='utf-8',errors='replace')
          contexts=[]
          for needle in ['/mofoun/report/searchReport/facet','searchReport/facet','facet?type','searchReport']:
            start=0
            while True:
              p=text.find(needle,start)
              if p<0: break
              c=text[max(0,p-8000):min(len(text),p+12000)]
              contexts.append({'needle':needle,'position':p,'context':c})
              print('\n===== CONTEXT',needle,p,'=====\n',c)
              start=p+len(needle)
              if len(contexts)>50: break
            if len(contexts)>50: break
          (OUT/'contexts.json').write_text(json.dumps(contexts,ensure_ascii=False,indent=2),encoding='utf-8')

          api='https://api.fxbaogao.com/mofoun/report/searchReport/facet'
          bodies=[
            {'pageNum':1,'pageSize':100,'keywords':'绿城中国','orderBy':2,'onlyTitle':False},
            {'pageIndex':1,'pageSize':100,'keywords':'绿城中国','orderBy':2,'onlyTitle':False},
            {'page':1,'limit':100,'keywords':'绿城中国','order':2},
            {'pageNum':1,'pageSize':100,'keyword':'绿城中国','orderBy':2},
            {'pageIndex':1,'pageSize':100,'keywords':'绿城中国','filterYears':[],'filterStocks':[],'filterIndustries':[],'filterDatatype':[],'filterDoctype':[],'filterV2':[],'filterDate':['',''],'orderBy':2,'onlyTitle':False,'noParticiple':True},
          ]
          results=[]
          for typ in [0,1,2,3,4]:
            for i,b in enumerate(bodies):
              for mode in ['json','form']:
                try:
                  url=api+'?type='+str(typ)
                  if mode=='json': rr=s.post(url,json=b,headers={'Content-Type':'application/json'},timeout=45)
                  else: rr=s.post(url,data=b,headers={'Content-Type':'application/x-www-form-urlencoded'},timeout=45)
                  try: data=rr.json()
                  except Exception: data={'raw':rr.text[:5000]}
                  rec={'type':typ,'body_index':i,'mode':mode,'status':rr.status_code,'data':data}
                  results.append(rec)
                  print('\nAPI',json.dumps(rec,ensure_ascii=False,indent=2)[:30000])
                except Exception as exc: print('API ERROR',typ,i,mode,repr(exc))
          (OUT/'api_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-search-probe
          path: probe/*
          retention-days: 1
          compression-level: 0
