name: Temporary Greentown China validated report package

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download public full reports and build PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pillow img2pdf pypdf beautifulsoup4
          python3 <<'PY'
          import hashlib
          import io
          import json
          import re
          import shutil
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader

          OUT = Path("output")
          WORK = Path("work")
          OUT.mkdir(exist_ok=True)
          WORK.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
          })

          targets = [
              {
                  "doc_id": 4998036,
                  "broker": "申万宏源证券",
                  "date": "2025-08-15",
                  "title": "好房子引领者，理顺机制再出发",
                  "expected_pages": 31,
                  "pdf_path": "report/2025/08/15/4998036.pdf",
              },
              {
                  "doc_id": 3093383,
                  "broker": "浙商证券",
                  "date": "2022-03-29",
                  "title": "坚守品质标杆，融资优势+聚焦核心，高质量发展可期",
                  "expected_pages": 20,
                  "pdf_path": "report/2022/03/29/3093383.pdf",
              },
              {
                  "doc_id": 5631238,
                  "broker": "广发证券",
                  "date": "2026-08-21",
                  "title": "管理层变更不改高效运营，多元化产品能力保障流速",
                  "expected_pages": 16,
                  "pdf_path": "report/2026/08/21/5631238.pdf",
                  "supplemental": True,
              },
          ]

          def safe_name(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value).strip('._')
              return value[:110]

          def valid_pdf(content: bytes, min_pages: int):
              if not content.startswith(b"%PDF-") or len(content) < 100_000:
                  return None
              try:
                  reader = PdfReader(io.BytesIO(content))
                  pages = len(reader.pages)
                  return pages if pages >= min_pages else None
              except Exception:
                  return None

          manifest = []
          download_log = []

          for index, target in enumerate(targets, start=1):
              doc_id = target["doc_id"]
              min_pages = 15 if target.get("supplemental") else 18
              filename = (
                  f"{index:02d}_{safe_name(target['broker'])}_{target['date'].replace('-', '')}_"
                  f"绿城中国_{safe_name(target['title'])}.pdf"
              )
              destination = OUT / filename
              content = None
              actual_pages = None
              source_url = None
              source_method = None

              # Prefer the platform's original PDF object. Fall back to its public full-page images.
              for host in (
                  "https://report.fxbaogao.com/",
                  "https://public.fxbaogao.com/",
                  "https://dr.fxbaogao.com/",
              ):
                  url = host + target["pdf_path"]
                  try:
                      response = session.get(
                          url,
                          headers={
                              "User-Agent": session.headers["User-Agent"],
                              "Referer": f"https://www.fxbaogao.com/detail/{doc_id}",
                              "Accept": "application/pdf,application/octet-stream,*/*",
                          },
                          timeout=120,
                          allow_redirects=True,
                      )
                      record = {
                          "doc_id": doc_id,
                          "kind": "pdf",
                          "url": url,
                          "status": response.status_code,
                          "final_url": response.url,
                          "content_type": response.headers.get("content-type"),
                          "size": len(response.content),
                          "signature": repr(response.content[:20]),
                      }
                      download_log.append(record)
                      print("PDF TRY", json.dumps(record, ensure_ascii=False))
                      if response.status_code == 200:
                          pages = valid_pdf(response.content, min_pages)
                          if pages is not None:
                              content = response.content
                              actual_pages = pages
                              source_url = response.url
                              source_method = "original-pdf"
                              break
                  except Exception as exc:
                      print("PDF ERROR", doc_id, url, repr(exc))

              if content is None:
                  detail_url = f"https://www.fxbaogao.com/detail/{doc_id}"
                  detail_response = session.get(detail_url, timeout=60, allow_redirects=True)
                  detail_response.raise_for_status()
                  detail_html = detail_response.text
                  cover_match = re.search(
                      rf'https://public\.fxbaogao\.com/(report-image/[^\s"\'<>]+?/{doc_id})-1\.png',
                      detail_html,
                  )
                  if cover_match:
                      cover_prefix = cover_match.group(1)
                  else:
                      cover_prefix = target["pdf_path"].replace("report/", "report-image/").replace(".pdf", "")

                  page_dir = WORK / str(doc_id)
                  page_dir.mkdir(parents=True, exist_ok=True)
                  page_paths = []
                  expected = int(target["expected_pages"])
                  for page_number in range(1, expected + 1):
                      image_url = f"https://public.fxbaogao.com/{cover_prefix}-{page_number}.png"
                      response = session.get(
                          image_url,
                          headers={
                              "User-Agent": session.headers["User-Agent"],
                              "Referer": detail_url,
                              "Accept": "image/avif,image/webp,image/apng,image/png,image/*,*/*;q=0.8",
                          },
                          timeout=120,
                          allow_redirects=True,
                      )
                      record = {
                          "doc_id": doc_id,
                          "kind": "page-image",
                          "page": page_number,
                          "url": image_url,
                          "status": response.status_code,
                          "final_url": response.url,
                          "content_type": response.headers.get("content-type"),
                          "size": len(response.content),
                          "signature": repr(response.content[:16]),
                      }
                      download_log.append(record)
                      print("IMAGE TRY", json.dumps(record, ensure_ascii=False))
                      if response.status_code != 200 or len(response.content) < 20_000:
                          raise RuntimeError(
                              f"报告 {doc_id} 第 {page_number}/{expected} 页下载失败："
                              f"status={response.status_code}, size={len(response.content)}"
                          )
                      try:
                          image = Image.open(io.BytesIO(response.content))
                          image.verify()
                      except Exception as exc:
                          raise RuntimeError(f"报告 {doc_id} 第 {page_number} 页不是有效图片：{exc}")
                      suffix = ".png"
                      page_path = page_dir / f"{page_number:03d}{suffix}"
                      page_path.write_bytes(response.content)
                      page_paths.append(page_path)

                  if len(page_paths) != expected or len(page_paths) < min_pages:
                      raise RuntimeError(
                          f"报告 {doc_id} 页面数量不足：下载 {len(page_paths)}，预期 {expected}"
                      )
                  destination.write_bytes(img2pdf.convert([str(path) for path in page_paths]))
                  content = destination.read_bytes()
                  actual_pages = valid_pdf(content, min_pages)
                  if actual_pages != expected:
                      raise RuntimeError(
                          f"报告 {doc_id} 合成PDF页数异常：PDF={actual_pages}，预期={expected}"
                      )
                  source_url = f"https://www.fxbaogao.com/detail/{doc_id}"
                  source_method = "public-full-page-images"

              if not destination.exists():
                  destination.write_bytes(content)

              final_content = destination.read_bytes()
              final_pages = valid_pdf(final_content, min_pages)
              if final_pages is None:
                  raise RuntimeError(f"生成的PDF无效：{destination.name}")
              if abs(final_pages - int(target["expected_pages"])) > 1:
                  raise RuntimeError(
                      f"PDF页数与公开元数据不符：{destination.name}, "
                      f"PDF={final_pages}, metadata={target['expected_pages']}"
                  )

              first_text = ""
              try:
                  reader = PdfReader(str(destination))
                  for page_index in range(min(3, len(reader.pages))):
                      first_text += reader.pages[page_index].extract_text() or ""
              except Exception:
                  pass
              # Image-reconstructed PDFs may have no text layer; their identity is verified by
              # the document-specific image path and exact public metadata/page count.
              if source_method == "original-pdf" and "绿城" not in first_text and "Greentown" not in first_text:
                  raise RuntimeError(f"原始PDF内容与绿城中国不匹配：{destination.name}")

              manifest.append({
                  "filename": destination.name,
                  "broker": target["broker"],
                  "date": target["date"],
                  "title": target["title"],
                  "pages": final_pages,
                  "expected_pages": target["expected_pages"],
                  "size_bytes": destination.stat().st_size,
                  "sha256": hashlib.sha256(final_content).hexdigest(),
                  "source_url": source_url,
                  "source_method": source_method,
                  "doc_id": doc_id,
                  "supplemental": bool(target.get("supplemental")),
              })
              print("ACCEPTED", json.dumps(manifest[-1], ensure_ascii=False, indent=2))

          # Require the two explicit deep reports; the recent 16-page company report is supplemental.
          if len(manifest) < 2 or not all(x["doc_id"] in {4998036, 3093383, 5631238} for x in manifest):
              raise RuntimeError("未成功取得至少两份指定公司深度报告")

          list_path = OUT / "报告清单.txt"
          lines = ["绿城中国（03900.HK）券商研究报告清单", ""]
          for idx, item in enumerate(manifest, start=1):
              note = "（近期公司研究补充）" if item["supplemental"] else "（公司深度报告）"
              lines.extend([
                  f"{idx}. {item['broker']}｜{item['date']}｜{item['title']} {note}",
                  f"   页数：{item['pages']}页；文件：{item['filename']}",
                  f"   SHA-256：{item['sha256']}",
                  f"   公开来源：{item['source_url']}",
                  "",
              ])
          list_path.write_text("\n".join(lines), encoding="utf-8")
          manifest_path = OUT / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          log_path = OUT / "download_log.json"
          log_path.write_text(json.dumps(download_log, ensure_ascii=False, indent=2), encoding="utf-8")

          zip_path = OUT / f"绿城中国_券商深度报告_{len(manifest)}份.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for item in manifest:
                  archive.write(OUT / item["filename"], arcname=item["filename"])
              archive.write(list_path, arcname=list_path.name)
              archive.write(manifest_path, arcname=manifest_path.name)

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP完整性测试失败：{bad}")
              pdf_members = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_members) != len(manifest):
                  raise RuntimeError("ZIP中的PDF数量与清单不一致")

          print("PACKAGE", zip_path, zip_path.stat().st_size)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-validated-reports
          path: |
            output/*.pdf
            output/*.zip
            output/报告清单.txt
            output/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
