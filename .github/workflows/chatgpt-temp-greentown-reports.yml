name: Temporary Greentown China fast Eastmoney downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fast keyword search and PDF validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 <<'PY'
          import hashlib,io,json,re,unicodedata,zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          OUT=Path('output');OUT.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'})
          def norm(x):return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+','',unicodedata.normalize('NFKC',str(x or ''))).lower()
          def clean(x):return re.sub(r'[\\/:*?"<>|]+','_',str(x or '')).replace(' ','')[:100]
          preferred=[('用品质铸就穿越周期的力量',10000),('好房子引领者理顺机制再出发',9500),('改善房企标杆龙头战法聚焦核心',9000),('匠心独运驭光而行',8500),('决胜壁龛市场挖潜新模式价值',8200),('自投代建双核驱动品质龙头逆势攀升',7900),('融合央企基因行业品质标杆',6400),('坚守品质标杆融资优势聚焦核心高质量发展可期',6100)]
          terms=['绿城中国','用品质铸就 穿越周期的力量','好房子引领者 理顺机制再出发','改善房企标杆 龙头战法 聚焦核心','匠心独运 驭光而行','融合央企基因 行业品质标杆']
          url='https://reportapi.eastmoney.com/report/list'; rows=[];seen=set();logs=[]
          for term in terms:
            for qtype in ['0','1']:
              params={'industryCode':'*','pageSize':'5000','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2030-01-01','pageNo':'1','fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1','keyword':term}
              try:
                r=s.get(url,params=params,timeout=20);print('QUERY',term,qtype,r.status_code,r.url)
                try:p=r.json()
                except Exception:p={'raw':r.text[:3000]}
                data=p.get('data') if isinstance(p,dict) else []
                if not isinstance(data,list):data=[]
                logs.append({'term':term,'qtype':qtype,'status':r.status_code,'keys':list(p.keys()) if isinstance(p,dict) else [],'count':len(data),'totalPage':p.get('TotalPage') if isinstance(p,dict) else None})
                print('META',json.dumps(logs[-1],ensure_ascii=False))
                for x in data:
                  info=str(x.get('infoCode') or '');title=str(x.get('title') or '');stock=str(x.get('stockName') or '')
                  print('ROW',x.get('publishDate'),x.get('orgSName'),x.get('attachPages'),stock,title,info)
                  if info and info not in seen and ('绿城中国' in norm(stock+title) or any(pat in norm(title) for pat,_ in preferred)):
                    seen.add(info);y=dict(x);y['_info']=info;rows.append(y)
              except Exception as e:print('QUERY ERROR',term,qtype,repr(e))
          (OUT/'query_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8');(OUT/'rows.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          cand=[]
          for x in rows:
            title=str(x.get('title') or '');h=norm(title);pages=int(x.get('attachPages') or 0);score=pages*5
            if any(k in title for k in ['点评','年报','半年报','中报','周报','月报','债券']):continue
            for pat,b in preferred:
              if pat in h or h in pat:score+=b
            if '深度' in title or '首次覆盖' in title:score+=500
            cand.append((score,x))
          cand.sort(key=lambda z:z[0],reverse=True);print('CAND',len(cand))
          accepted=[];dlog=[];used=set()
          for score,x in cand:
            if len(accepted)>=3:break
            title=str(x.get('title') or '');tk=norm(title);info=x['_info']
            if tk in used:continue
            u=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            try:
              r=s.get(u,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=90,allow_redirects=True)
              rec={'url':u,'status':r.status_code,'final':r.url,'ctype':r.headers.get('content-type'),'length':len(r.content),'sig':repr(r.content[:20])};dlog.append(rec);print('DL',json.dumps(rec,ensure_ascii=False))
              if r.status_code!=200 or not r.content.startswith(b'%PDF-') or len(r.content)<150000:continue
              reader=PdfReader(io.BytesIO(r.content));pages=len(reader.pages)
              if pages<18:continue
              first=''
              try:
                for i in range(min(4,pages)):first+=reader.pages[i].extract_text() or ''
              except Exception:pass
              if '绿城' not in first and 'Greentown' not in first:continue
              broker=str(x.get('orgSName') or x.get('orgName') or '券商');date=str(x.get('publishDate') or '')[:10]
              fn=f'{len(accepted)+1:02d}_{clean(broker)}_{date.replace("-","")}_绿城中国_{clean(title)}.pdf';(OUT/fn).write_bytes(r.content)
              a={'filename':fn,'broker':broker,'date':date,'title':title,'pages':pages,'size_bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'source_pdf':r.url,'infoCode':info};accepted.append(a);used.add(tk);print('ACCEPT',json.dumps(a,ensure_ascii=False,indent=2))
            except Exception as e:print('DL ERROR',u,repr(e))
          (OUT/'download_log.json').write_text(json.dumps(dlog,ensure_ascii=False,indent=2),encoding='utf-8')
          if len(accepted)<2:raise RuntimeError(f'Only {len(accepted)} PDFs')
          mf=OUT/'manifest.json';mf.write_text(json.dumps(accepted,ensure_ascii=False,indent=2),encoding='utf-8');ls=OUT/'报告清单.txt';lines=['绿城中国（03900.HK）券商深度报告清单','']
          for i,x in enumerate(accepted,1):lines += [f"{i}. {x['broker']}｜{x['date']}｜{x['title']}",f"   页数：{x['pages']}页；文件：{x['filename']}",f"   原始PDF：{x['source_pdf']}",'']
          ls.write_text('\n'.join(lines),encoding='utf-8');zp=OUT/f'绿城中国_券商深度报告_{len(accepted)}份.zip'
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for x in accepted:z.write(OUT/x['filename'],arcname=x['filename'])
            z.write(mf,arcname=mf.name);z.write(ls,arcname=ls.name)
          with zipfile.ZipFile(zp) as z:assert z.testzip() is None
          print('DONE',zp,zp.stat().st_size,json.dumps(accepted,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-fast-eastmoney-results
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
