name: Temporary Greentown China direct PDF downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download and validate public original PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf beautifulsoup4
          python3 <<'PY'
          import hashlib
          import io
          import json
          import re
          import zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path('output'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          reports=[
            {'id':'614257','broker':'国联民生证券','date':'2025-02-21','title':'改善房企标杆，“龙头战法”聚焦核心','expected':29},
            {'id':'402563','broker':'华泰证券','date':'2025-01-13','title':'匠心独运，驭光而行','expected':29},
            {'id':'187494','broker':'券商','date':'2024-12-31','title':'决胜壁龛市场，挖潜新模式价值','expected':22},
            {'id':'152406','broker':'开源证券','date':'2024-01-22','title':'自投代建双核驱动，品质龙头逆势攀升','expected':25},
            {'id':'91945','broker':'平安证券','date':'2022-08-15','title':'品质标杆房企，逆流而上未来可期','expected':24},
            {'id':'68838','broker':'国信证券','date':'2022-04-19','title':'融合央企基因，行业品质标杆','expected':24},
          ]
          def clean(x): return re.sub(r'[\\/:*?"<>|]+','_',x).replace(' ','')[:110]
          accepted=[]; diagnostics=[]
          for item in reports:
              page=f"https://www.sgpjbg.com/baogao/{item['id']}.html"
              try:
                  r=s.get(page,timeout=45); print('PAGE',item['id'],r.status_code,len(r.content)); r.raise_for_status()
                  text=r.text
                  urls=sorted(set(re.findall(r'https://file\.sgpjbg\.com/fileroot[^\s"\'<>\\]+',text)))
                  urls=[u.rstrip('),.;') for u in urls if not re.search(r'\.(gif|png|jpg|jpeg|webp)(?:\?|$)',u,re.I)]
                  print('ROOT URLS',item['id'],json.dumps(urls,ensure_ascii=False,indent=2))
                  test_urls=[]
                  for u in urls:
                      test_urls += [u,u+'.pdf',u+'?download=1']
                  # Also inspect iframe/object/embed sources and any .pdf URLs.
                  soup=BeautifulSoup(text,'html.parser')
                  for tag in soup.select('iframe[src],embed[src],object[data],a[href]'):
                      u=tag.get('src') or tag.get('data') or tag.get('href')
                      if u and ('.pdf' in u.lower() or 'fileroot' in u.lower()):
                          from urllib.parse import urljoin
                          test_urls.append(urljoin(page,u))
                  seen=set(); success=False
                  for u in test_urls:
                      if u in seen: continue
                      seen.add(u)
                      try:
                          rr=s.get(u,headers={'User-Agent':s.headers['User-Agent'],'Referer':page,'Accept':'application/pdf,application/octet-stream,*/*'},timeout=120,allow_redirects=True)
                          sig=rr.content[:20]
                          diag={'id':item['id'],'url':u,'status':rr.status_code,'final':rr.url,'ctype':rr.headers.get('content-type'),'length':len(rr.content),'sig':repr(sig)}
                          diagnostics.append(diag); print('TRY',json.dumps(diag,ensure_ascii=False))
                          if rr.status_code!=200 or not rr.content.startswith(b'%PDF-') or len(rr.content)<150000: continue
                          reader=PdfReader(io.BytesIO(rr.content)); pages=len(reader.pages)
                          first=''
                          try:
                              for i in range(min(3,pages)): first += reader.pages[i].extract_text() or ''
                          except Exception: pass
                          if pages<18 or ('绿城' not in first and 'Greentown' not in first):
                              print('REJECT',item['id'],'pages',pages,'first',first[:300]); continue
                          filename=f"{len(accepted)+1:02d}_{clean(item['broker'])}_{item['date'].replace('-','')}_绿城中国_{clean(item['title'])}.pdf"
                          (OUT/filename).write_bytes(rr.content)
                          accepted.append({**item,'filename':filename,'pages':pages,'size_bytes':len(rr.content),'sha256':hashlib.sha256(rr.content).hexdigest(),'source_pdf':rr.url})
                          print('ACCEPT',filename,pages,len(rr.content)); success=True; break
                      except Exception as exc: print('TRY ERROR',item['id'],u,repr(exc))
                  if success and len(accepted)>=3: break
              except Exception as exc: print('PAGE ERROR',item['id'],repr(exc))
          (OUT/'diagnostics.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2),encoding='utf-8')
          if len(accepted)<2: raise RuntimeError(f'Only {len(accepted)} full PDFs obtained')
          manifest=OUT/'manifest.json'; manifest.write_text(json.dumps(accepted,ensure_ascii=False,indent=2),encoding='utf-8')
          listing=OUT/'报告清单.txt'
          lines=['绿城中国（03900.HK）券商深度报告清单','']
          for i,x in enumerate(accepted,1):
              lines += [f"{i}. {x['broker']}｜{x['date']}｜{x['title']}",f"   页数：{x['pages']}页；文件：{x['filename']}",f"   原始PDF：{x['source_pdf']}",'']
          listing.write_text('\n'.join(lines),encoding='utf-8')
          zp=OUT/f"绿城中国_券商深度报告_{len(accepted)}份.zip"
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for x in accepted: z.write(OUT/x['filename'],arcname=x['filename'])
              z.write(manifest,arcname=manifest.name); z.write(listing,arcname=listing.name)
          with zipfile.ZipFile(zp) as z:
              bad=z.testzip(); assert bad is None,bad
          print('DONE',json.dumps(accepted,ensure_ascii=False,indent=2),zp,zp.stat().st_size)
          PY

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-direct-pdf-results
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
