name: Temporary Greentown China final PDF downloader
on:
  push:
    branches: [chatgpt-temp-greentown-reports-20260828]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and validate three full reports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 <<'PY'
          import hashlib,io,json,re,zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          OUT=Path('output');OUT.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'})
          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2030-01-01','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':'1','pageNum':'1','pageNumber':'1','keyword':'绿城中国'}
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=30);r.raise_for_status();payload=r.json();rows=payload.get('data') or []
          print('ROWS',len(rows))
          for x in rows:print(x.get('publishDate'),x.get('orgSName'),x.get('attachPages'),x.get('stockName'),x.get('title'),x.get('infoCode'))
          preferred=[('用品质铸就穿越周期的力量',10000),('好房子引领者理顺机制再出发',9500),('改善房企标杆龙头战法聚焦核心',9000),('匠心独运驭光而行',8500),('决胜壁龛市场挖潜新模式价值',8200),('自投代建双核驱动品质龙头逆势攀升',7900),('融合央企基因行业品质标杆',6400)]
          def norm(x):return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+','',str(x or '')).lower()
          def clean(x):return re.sub(r'[\\/:*?"<>|]+','_',str(x or '')).replace(' ','')[:105]
          cand=[]
          for x in rows:
            title=str(x.get('title') or '');stock=str(x.get('stockName') or '');pages=int(x.get('attachPages') or 0);h=norm(title)
            if '绿城中国' not in norm(stock+title):continue
            if any(k in title for k in ['点评','年报','半年报','中报','周报','月报','债券']):continue
            score=pages*5
            for pat,b in preferred:
              if pat in h or h in pat:score+=b
            if '深度' in title or '首次覆盖' in title:score+=500
            cand.append((score,x))
          cand.sort(key=lambda z:z[0],reverse=True)
          accepted=[];dlog=[]
          for score,x in cand:
            if len(accepted)>=3:break
            info=str(x.get('infoCode') or '');title=str(x.get('title') or '');u=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            rr=s.get(u,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=120,allow_redirects=True)
            rec={'url':u,'status':rr.status_code,'final':rr.url,'ctype':rr.headers.get('content-type'),'length':len(rr.content),'sig':repr(rr.content[:20])};dlog.append(rec);print('DL',json.dumps(rec,ensure_ascii=False))
            if rr.status_code!=200 or not rr.content.startswith(b'%PDF-') or len(rr.content)<150000:continue
            reader=PdfReader(io.BytesIO(rr.content));pages=len(reader.pages)
            if pages<18:continue
            broker=str(x.get('orgSName') or x.get('orgName') or '券商');date=str(x.get('publishDate') or '')[:10]
            fn=f'{len(accepted)+1:02d}_{clean(broker)}_{date.replace("-","")}_绿城中国_{clean(title)}.pdf';(OUT/fn).write_bytes(rr.content)
            a={'filename':fn,'broker':broker,'date':date,'title':title,'pages':pages,'metadata_pages':int(x.get('attachPages') or 0),'size_bytes':len(rr.content),'sha256':hashlib.sha256(rr.content).hexdigest(),'source_pdf':rr.url,'infoCode':info};accepted.append(a);print('ACCEPT',json.dumps(a,ensure_ascii=False,indent=2))
          (OUT/'download_log.json').write_text(json.dumps(dlog,ensure_ascii=False,indent=2),encoding='utf-8')
          if len(accepted)<2:raise RuntimeError(f'Only {len(accepted)} PDFs')
          mf=OUT/'manifest.json';mf.write_text(json.dumps(accepted,ensure_ascii=False,indent=2),encoding='utf-8');ls=OUT/'报告清单.txt';lines=['绿城中国（03900.HK）券商深度报告清单','']
          for i,x in enumerate(accepted,1):lines += [f"{i}. {x['broker']}｜{x['date']}｜{x['title']}",f"   页数：{x['pages']}页；文件：{x['filename']}",f"   原始PDF：{x['source_pdf']}",'']
          ls.write_text('\n'.join(lines),encoding='utf-8');zp=OUT/f'绿城中国_券商深度报告_{len(accepted)}份.zip'
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for x in accepted:z.write(OUT/x['filename'],arcname=x['filename'])
            z.write(mf,arcname=mf.name);z.write(ls,arcname=ls.name)
          with zipfile.ZipFile(zp) as z:assert z.testzip() is None
          print('DONE',zp,zp.stat().st_size,json.dumps(accepted,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: greentown-final-pdfs
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
