name: Temporary Greentown China original PDF downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search, download and validate complete broker reports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 <<'PY'
          import hashlib,html,io,json,re,zipfile
          from datetime import datetime
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          OUT=Path('output'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json, text/plain, */*','Content-Type':'application/json'})
          api='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          def strip_tags(x): return re.sub(r'<[^>]+>','',html.unescape(str(x or '')))
          def norm(x): return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+','',strip_tags(x)).lower()
          def clean(x): return re.sub(r'[\\/:*?"<>|]+','_',strip_tags(x)).replace(' ','')[:110]

          all_rows=[]; seen=set(); page_count=8
          for page in range(1,page_count+1):
            body={'pageIndex':page,'pageSize':20,'keywords':'绿城中国','orderBy':2,'stockCodes':['03900'],'filterStocks':['03900'],'years':[],'industryNames':[],'tagKeys':[],'docType':[],'typeIdList':[]}
            r=s.post(api,json=body,timeout=45); print('SEARCH',page,r.status_code); r.raise_for_status()
            payload=r.json(); data=payload.get('data') or {}; rows=data.get('dataList') or []
            print('ROWS',page,len(rows),'count',data.get('count'),'curr',data.get('currPage'),'pages',data.get('pageCount'))
            page_count=int(data.get('pageCount') or page_count)
            for x in rows:
              doc=str(x.get('docId') or '')
              if doc and doc not in seen:
                seen.add(doc); all_rows.append(x)
                print(' ',x.get('pubTimeStr'),x.get('orgName'),x.get('pageNum'),x.get('isDeep'),strip_tags(x.get('title')),x.get('docId'),x.get('pdfPath'))
            if page>=page_count or not rows: break

          preferred=[('用品质铸就穿越周期的力量',5000),('好房子引领者理顺机制再出发',4700),('改善房企标杆龙头战法聚焦核心',4400),('匠心独运驭光而行',4100),('决胜壁龛市场挖潜新模式价值',3900),('自投代建双核驱动品质龙头逆势攀升',3700),('品质龙头重返行业前十',3500),('深耕高能级城市结硕果',3300),('品质标杆房企逆流而上未来可期',3100),('品质匠心代表优质成长蓝筹',2900),('融合央企基因行业品质标杆',2700),('坚守品质标杆融资优势聚焦核心高质量发展可期',2500)]
          bad_terms=['年报','中期报告','半年报','点评','周报','月报','业绩预告','销售简报','信息更新','债券']
          candidates=[]
          for x in all_rows:
            title=strip_tags(x.get('title')); pages=int(x.get('pageNum') or 0); h=norm(title)
            if pages<18 or x.get('isNotBroker') or int(x.get('docType') or 0)!=1 or any(t in title for t in bad_terms): continue
            score=pages*3+(500 if x.get('isDeep') else 0)
            for p,b in preferred:
              if norm(p) in h or h in norm(p): score+=b
            try: score+=max(0,datetime.fromtimestamp(int(x.get('pubTime') or 0)).year-2020)*25
            except Exception: pass
            candidates.append((score,x))
          candidates.sort(key=lambda z:z[0],reverse=True)
          print('\nCANDIDATES',len(candidates))
          for score,x in candidates: print(score,x.get('pubTimeStr'),x.get('orgName'),x.get('pageNum'),x.get('isDeep'),strip_tags(x.get('title')),x.get('docId'),x.get('pdfPath'))

          accepted=[]; diagnostics=[]; used_titles=set()
          for score,x in candidates:
            if len(accepted)>=3: break
            path=str(x.get('pdfPath') or '').lstrip('/'); title=strip_tags(x.get('title')); title_key=norm(title)
            if not path or title_key in used_titles: continue
            urls=['https://report.fxbaogao.com/'+path,'https://dr.fxbaogao.com/'+path,'https://static.fxbaogao.com/'+path]
            for u in urls:
              try:
                rr=s.get(u,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://www.fxbaogao.com/','Accept':'application/pdf,application/octet-stream,*/*'},timeout=150,allow_redirects=True)
                diag={'docId':x.get('docId'),'title':title,'url':u,'status':rr.status_code,'final':rr.url,'ctype':rr.headers.get('content-type'),'length':len(rr.content),'sig':repr(rr.content[:20])}; diagnostics.append(diag); print('TRY',json.dumps(diag,ensure_ascii=False))
                if rr.status_code!=200 or not rr.content.startswith(b'%PDF-') or len(rr.content)<150000: continue
                reader=PdfReader(io.BytesIO(rr.content)); actual=len(reader.pages)
                if actual<18: continue
                text=''
                try:
                  for i in range(min(3,actual)): text+=reader.pages[i].extract_text() or ''
                except Exception: pass
                if '绿城' not in text and 'Greentown' not in text: continue
                broker=str(x.get('orgName') or '券商'); date=str(x.get('pubTimeStr') or '').strip('/').replace('/','-')
                filename=f"{len(accepted)+1:02d}_{clean(broker)}_{date.replace('-','')}_绿城中国_{clean(title)}.pdf"; (OUT/filename).write_bytes(rr.content)
                rec={'filename':filename,'broker':broker,'date':date,'title':title,'pages':actual,'size_bytes':len(rr.content),'sha256':hashlib.sha256(rr.content).hexdigest(),'source_pdf':rr.url,'docId':x.get('docId'),'pdfPath':x.get('pdfPath')}
                accepted.append(rec); used_titles.add(title_key); print('ACCEPT',json.dumps(rec,ensure_ascii=False,indent=2)); break
              except Exception as exc: print('TRY ERROR',u,repr(exc))
          (OUT/'diagnostics.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2),encoding='utf-8')
          if len(accepted)<2: raise RuntimeError(f'Only {len(accepted)} complete public PDFs obtained')
          manifest=OUT/'manifest.json'; manifest.write_text(json.dumps(accepted,ensure_ascii=False,indent=2),encoding='utf-8')
          listing=OUT/'报告清单.txt'; lines=['绿城中国（03900.HK）券商深度报告清单','']
          for i,x in enumerate(accepted,1): lines += [f"{i}. {x['broker']}｜{x['date']}｜{x['title']}",f"   页数：{x['pages']}页；文件：{x['filename']}",f"   原始PDF：{x['source_pdf']}",'']
          listing.write_text('\n'.join(lines),encoding='utf-8')
          zp=OUT/f"绿城中国_券商深度报告_{len(accepted)}份.zip"
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for x in accepted:z.write(OUT/x['filename'],arcname=x['filename'])
            z.write(manifest,arcname=manifest.name);z.write(listing,arcname=listing.name)
          with zipfile.ZipFile(zp) as z: assert z.testzip() is None
          print('DONE',zp,zp.stat().st_size,json.dumps(accepted,ensure_ascii=False,indent=2))
          PY

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-original-pdf-results-v2
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
