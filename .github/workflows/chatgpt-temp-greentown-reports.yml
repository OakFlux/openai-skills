name: Temporary Greentown China matrix report downloader

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe-report:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - slug: guangfa-2026
            title: 用品质铸就，穿越周期的力量
          - slug: shenwan-2025
            title: 好房子引领者，理顺机制再出发
          - slug: guolian-2025
            title: 改善房企标杆，“龙头战法”聚焦核心
          - slug: huatai-2025
            title: 匠心独运，驭光而行
          - slug: huachuang-2024
            title: 决胜壁龛市场，挖潜新模式价值
          - slug: kaiyuan-2024
            title: 自投代建双核驱动，品质龙头逆势攀升
          - slug: zhongyin-2023
            title: 品质龙头重返行业前十，聚焦核心+提质增效促公司良性发展
          - slug: citic-2022
            title: 深耕高能级城市结硕果，融资能力强稳中有进
          - slug: pingan-2022
            title: 品质标杆房企，逆流而上未来可期
          - slug: haitong-2022
            title: 品质匠心代表，优质成长蓝筹
          - slug: guoxin-2022
            title: 融合央企基因，行业品质标杆
          - slug: zheshang-2022
            title: 坚守品质标杆，融资优势+聚焦核心，高质量发展可期
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Search exact title and probe public download endpoint
        shell: bash
        env:
          REPORT_TITLE: ${{ matrix.title }}
          REPORT_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pypdf
          python3 <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          title = os.environ['REPORT_TITLE']
          slug = os.environ['REPORT_SLUG']
          out = Path('output')
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Origin': 'https://www.fxbaogao.com',
              'Referer': 'https://www.fxbaogao.com/',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
          })
          base = 'https://api.fxbaogao.com'
          search_api = base + '/mofoun/report/searchReport/searchNoAuth'

          def clean_text(value):
              return re.sub(r'<[^>]+>', '', str(value or ''))

          def norm(value):
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', clean_text(value)).lower()

          keys = [x for x in re.split(r'[，。、“”+：:（）()\s]+', title) if len(norm(x)) >= 2]
          bodies = [
              {'pageNum': 1, 'pageSize': 100, 'keywords': title, 'order': 2},
              {'pageNum': 1, 'pageSize': 100, 'advancedQuery': True,
               'advancedRequest': {'title': title}, 'order': 2, 'onlyTitle': True,
               'isKeySplit': 0},
              {'pageNum': 1, 'pageSize': 100, 'titleMustKeys': keys,
               'isTitleMustKey': True, 'order': 2},
              {'pageNum': 1, 'pageSize': 100, 'keywords': title, 'order': 2,
               'stockCodes': ['03900']},
          ]

          responses = []
          rows_by_doc = {}
          for index, body in enumerate(bodies):
              try:
                  response = session.post(search_api, json=body, timeout=45)
                  try:
                      payload = response.json()
                  except Exception:
                      payload = {'raw': response.text[:10000]}
                  data = payload.get('data') or {} if isinstance(payload, dict) else {}
                  rows = data.get('dataList') or [] if isinstance(data, dict) else []
                  entry = {
                      'body_index': index, 'body': body, 'status': response.status_code,
                      'payload': payload,
                  }
                  responses.append(entry)
                  print('\nSEARCH RESPONSE', index, json.dumps({
                      'status': response.status_code,
                      'code': payload.get('code') if isinstance(payload, dict) else None,
                      'msg': payload.get('msg') if isinstance(payload, dict) else None,
                      'count': data.get('count') if isinstance(data, dict) else None,
                      'pageCount': data.get('pageCount') if isinstance(data, dict) else None,
                      'rows': len(rows),
                  }, ensure_ascii=False))
                  for row in rows:
                      doc_id = str(row.get('docId') or '')
                      if doc_id:
                          rows_by_doc.setdefault(doc_id, row)
                      print('ROW', json.dumps(row, ensure_ascii=False))
                  if rows:
                      break
              except Exception as exc:
                  print('SEARCH ERROR', index, repr(exc))

          (out / f'{slug}_search.json').write_text(
              json.dumps(responses, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          # Rank exact/near-title rows tied to GreenTown China.
          ranked = []
          title_norm = norm(title)
          for row in rows_by_doc.values():
              row_title = clean_text(row.get('title'))
              row_norm = norm(row_title)
              stocks_blob = json.dumps(row.get('stocks'), ensure_ascii=False)
              hit_count = sum(1 for key in keys if norm(key) in row_norm)
              score = hit_count * 1000 + int(row.get('pageNum') or 0)
              if title_norm in row_norm or row_norm in title_norm:
                  score += 10000
              if '03900' in stocks_blob or '绿城中国' in row_title:
                  score += 5000
              if row.get('isDeep'):
                  score += 1000
              ranked.append((score, row))
          ranked.sort(key=lambda item: item[0], reverse=True)

          probes = []
          accepted = []
          for score, row in ranked[:10]:
              doc_id = str(row.get('docId') or '')
              if not doc_id:
                  continue
              print('\nPROBING DOC', doc_id, score, clean_text(row.get('title')),
                    row.get('pageNum'), row.get('orgName'), row.get('pdfPath'))
              calls = [
                  ('GET', f'/mofoun/report/report/downloadReportByBean?reportId={doc_id}', None),
                  ('GET', f'/mofoun/report/report/getReportPreviewImages?reportId={doc_id}', None),
                  ('POST', '/mofoun/report/searchReport/detail', {'reportId': doc_id}),
                  ('POST', '/mofoun/report/searchReport/detail', {'docId': doc_id}),
              ]
              candidate_urls = []
              for method, endpoint, body in calls:
                  try:
                      if method == 'GET':
                          response = session.get(base + endpoint, timeout=45)
                      else:
                          response = session.post(base + endpoint, json=body, timeout=45)
                      try:
                          payload = response.json()
                      except Exception:
                          payload = {'raw': response.text[:10000]}
                      record = {
                          'docId': doc_id, 'method': method, 'endpoint': endpoint,
                          'status': response.status_code, 'payload': payload,
                      }
                      probes.append(record)
                      print('API PROBE', json.dumps(record, ensure_ascii=False, indent=2)[:50000])

                      def walk(value):
                          if isinstance(value, dict):
                              for child in value.values():
                                  walk(child)
                          elif isinstance(value, list):
                              for child in value:
                                  walk(child)
                          elif isinstance(value, str):
                              if value.startswith(('http://', 'https://')):
                                  candidate_urls.append(value)
                              elif '.pdf' in value.lower():
                                  candidate_urls.append(urllib.parse.urljoin('https://report.fxbaogao.com/', value.lstrip('/')))
                      walk(payload)
                  except Exception as exc:
                      print('API PROBE ERROR', method, endpoint, repr(exc))

              pdf_path = str(row.get('pdfPath') or '').lstrip('/')
              if pdf_path:
                  candidate_urls.extend([
                      'https://report.fxbaogao.com/' + pdf_path,
                      'https://dr.fxbaogao.com/' + pdf_path,
                      'https://static.fxbaogao.com/' + pdf_path,
                  ])
              unique_urls = []
              seen_urls = set()
              for url in candidate_urls:
                  if url not in seen_urls:
                      seen_urls.add(url)
                      unique_urls.append(url)

              for url in unique_urls:
                  try:
                      response = session.get(
                          url,
                          headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://www.fxbaogao.com/',
                              'Accept': 'application/pdf, application/octet-stream, */*',
                          },
                          timeout=150,
                          allow_redirects=True,
                      )
                      download_record = {
                          'docId': doc_id, 'url': url, 'status': response.status_code,
                          'final_url': response.url,
                          'content_type': response.headers.get('content-type'),
                          'length': len(response.content),
                          'signature': repr(response.content[:24]),
                      }
                      probes.append(download_record)
                      print('DOWNLOAD PROBE', json.dumps(download_record, ensure_ascii=False))
                      content = response.content
                      if response.status_code != 200 or not content.startswith(b'%PDF-') or len(content) < 150000:
                          continue
                      reader = PdfReader(io.BytesIO(content))
                      pages = len(reader.pages)
                      if pages < 18:
                          continue
                      text = ''
                      try:
                          for page_index in range(min(4, pages)):
                              text += reader.pages[page_index].extract_text() or ''
                      except Exception:
                          pass
                      if '绿城' not in text and 'Greentown' not in text:
                          continue
                      filename = f'{slug}_{doc_id}_{pages}pages.pdf'
                      (out / filename).write_bytes(content)
                      accepted.append({
                          'filename': filename, 'docId': doc_id,
                          'title': clean_text(row.get('title')),
                          'broker': row.get('orgName'),
                          'date': row.get('pubTimeStr'),
                          'pages': pages, 'size_bytes': len(content),
                          'sha256': hashlib.sha256(content).hexdigest(),
                          'source_pdf': response.url,
                          'metadata': row,
                      })
                      print('ACCEPT', json.dumps(accepted[-1], ensure_ascii=False, indent=2))
                      break
                  except Exception as exc:
                      print('DOWNLOAD ERROR', url, repr(exc))
              if accepted:
                  break

          (out / f'{slug}_probes.json').write_text(
              json.dumps(probes, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (out / f'{slug}_accepted.json').write_text(
              json.dumps(accepted, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload per-report result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greentown-${{ matrix.slug }}
          path: output/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
