name: Temporary Daan Gene precise dates fast search

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-precise-dates-fast.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF
      - name: Query precise dates and fetch PDFs
        run: |
          python - <<'PY'
          import hashlib, json, re, time
          from pathlib import Path
          import requests, pymupdf

          out=Path('daan_precise'); pdfdir=out/'pdfs'; out.mkdir(exist_ok=True); pdfdir.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          windows=[('2020-07-10','2020-07-22'),('2020-08-25','2020-09-05'),('2020-10-25','2020-11-05')]
          endpoint='https://reportapi.eastmoney.com/report/list'
          matches=[]; seen=set()
          for begin,end in windows:
            for qtype in ['0','1','2','3']:
              for page in range(1,5):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(endpoint,params=params,timeout=45); r.raise_for_status(); rows=r.json().get('data') or []
                except Exception as e: print('PAGE_ERROR',begin,end,qtype,page,repr(e)); break
                print('PAGE',begin,end,qtype,page,len(rows))
                for row in rows:
                  blob=re.sub(r'\s+','',' '.join(map(str,[row.get('title'),row.get('stockName'),row.get('stockCode')])))
                  if '达安基因' not in blob and '002030' not in blob: continue
                  rec={'title':row.get('title'),'organization':row.get('orgSName'),'date':str(row.get('publishDate') or '')[:10],'pages':row.get('attachPages'),'size':row.get('attachSize'),'infoCode':row.get('infoCode'),'stockName':row.get('stockName'),'stockCode':row.get('stockCode'),'researcher':row.get('researcher'),'qType':qtype}
                  key=(rec['infoCode'],rec['title'])
                  if key not in seen: seen.add(key); matches.append(rec); print('MATCH',json.dumps(rec,ensure_ascii=False))
                if len(rows)<100: break

          inspected=[]
          for rec in matches:
            code=str(rec.get('infoCode') or '')
            if not code.startswith('AP'): continue
            data=None; chosen=None; attempts=[]
            for url in [f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{int(time.time()*1000)}.pdf=']:
              try:
                r=s.get(url,timeout=90,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*;q=0.8'})
                attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'magic':r.content[:8].hex()})
                if r.status_code==200 and r.content.startswith(b'%PDF') and len(r.content)>50000: data=r.content; chosen=url; break
              except Exception as e: attempts.append({'url':url,'error':repr(e)})
            item={**rec,'valid_pdf':False,'attempts':attempts}
            if data:
              path=pdfdir/f'{code}.pdf'; path.write_bytes(data)
              try:
                doc=pymupdf.open(str(path)); pages=doc.page_count
                texts=[]
                for idx in sorted(set([0,min(1,pages-1),pages//2,pages-1])): texts.append(doc.load_page(idx).get_text('text'))
                first=re.sub(r'\s+',' ',doc.load_page(0).get_text('text')).strip()[:2500]
                last=re.sub(r'\s+',' ',doc.load_page(pages-1).get_text('text')).strip()[:800]
                render=[]
                for idx in sorted(set([0,pages//2,pages-1])): render.append(len(doc.load_page(idx).get_pixmap(matrix=pymupdf.Matrix(.4,.4),alpha=False).samples))
                enc=bool(doc.needs_pass); doc.close(); blob=re.sub(r'\s+','',''.join(texts))
                item.update({'valid_pdf':True,'chosen_url':chosen,'actual_pages':pages,'encrypted':enc,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'company_hit':('达安基因' in blob or '002030' in blob),'first_text':first,'last_text':last,'render_sizes':render,'saved_file':path.name})
              except Exception as e: item['parse_error']=repr(e)
            inspected.append(item); print('PDF_RESULT',json.dumps(item,ensure_ascii=False))
          summary={'matches':len(matches),'valid':sum(1 for x in inspected if x.get('valid_pdf') and x.get('company_hit')),'reports':[{'date':x.get('date'),'organization':x.get('organization'),'title':x.get('title'),'pages':x.get('actual_pages'),'infoCode':x.get('infoCode'),'sha256':x.get('sha256')} for x in inspected if x.get('valid_pdf') and x.get('company_hit')]}
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'inspection.json').write_text(json.dumps(inspected,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY',json.dumps(summary,ensure_ascii=False))
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: daan-gene-precise-results
          path: daan_precise/
          retention-days: 1
          if-no-files-found: error
