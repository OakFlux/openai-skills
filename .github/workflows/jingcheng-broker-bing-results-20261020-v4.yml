name: Extract Bing results for Jingcheng broker research 20261020 v4

on:
  push:
    paths:
      - '.github/workflows/jingcheng-broker-bing-results-20261020-v4.yml'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Extract results
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          queries=[
            '京城股份 研报', '京城股份 深度报告', '京城股份 首次覆盖',
            '600860 研究报告', '600860 券商', '京城股份 氢能 研报',
            '京城股份 储氢瓶 券商', '京城机电股份 研报',
            'site:fxbaogao.com 京城股份', 'site:yanbaoke.com 京城股份',
            'site:sgpjbg.com 京城股份', 'site:pdf.dfcfw.com 600860',
            'site:stock.stockstar.com 京城股份 研报', 'site:report.iresearch.cn 京城股份'
          ]
          for q in queries:
            print('\n===',q,'===')
            for first in [0,10,20]:
              url='https://www.bing.com/search?q='+urllib.parse.quote(q)+'&count=10&first='+str(first+1)
              r=s.get(url,timeout=45)
              print('PAGE',first//10+1,r.status_code,len(r.content),r.url)
              soup=BeautifulSoup(r.text,'lxml')
              for li in soup.select('li.b_algo'):
                a=li.select_one('h2 a')
                if not a: continue
                title=' '.join(a.get_text(' ',strip=True).split())
                href=a.get('href','')
                snippet=' '.join((li.select_one('.b_caption') or li).get_text(' ',strip=True).split())
                print('RESULT',json.dumps({'title':title,'url':href,'snippet':snippet[:600]},ensure_ascii=False))
          PY
