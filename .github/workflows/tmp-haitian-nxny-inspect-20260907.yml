name: Inspect Nxny Haitian report pages
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect pages and probable file endpoints
        run: |
          mkdir -p out
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          ids=['6033440','5873443','5694142']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.nxny.com/stock/stock_01882/'})
          result=[]
          for rid in ids:
            u=f'https://www.nxny.com/report/view_{rid}.html'
            r=s.get(u,timeout=90)
            print('\nPAGE',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            open(f'out/{rid}.html','wb').write(r.content)
            soup=BeautifulSoup(r.text,'html.parser')
            rec={'id':rid,'url':u,'status':r.status_code,'links':[],'forms':[],'raw':[]}
            for tag in soup.find_all(['a','form','iframe','embed','object','script','input']):
              vals=[]
              for attr in ['href','action','src','data','value','onclick']:
                val=tag.get(attr)
                if val and any(k in val.lower() for k in ['download','down','pdf','file','report','vip','login',rid]): vals.append((attr,val))
              if vals:
                print('TAG',tag.name,vals)
                rec['links'].append({'tag':tag.name,'attrs':vals})
            for form in soup.find_all('form'):
              fd={'action':form.get('action'),'method':form.get('method'),'inputs':[(x.get('name'),x.get('value'),x.get('type')) for x in form.find_all('input')]}
              rec['forms'].append(fd); print('FORM',fd)
            pats=[r'https?://[^"\'<>\s]+\.pdf[^"\'<>\s]*',r'[/A-Za-z0-9_.?=&-]*(?:download|down|file|pdf)[/A-Za-z0-9_.?=&-]*',r'view_\d+\.html',r'down_\d+\.html',r'\b\d{6,}\b']
            for pat in pats:
              vals=list(dict.fromkeys(re.findall(pat,r.text,re.I)))[:100]
              if vals:
                print('PATTERN',pat,vals[:40]); rec['raw'].append({'pattern':pat,'values':vals})
            result.append(rec)
          open('out/result.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: haitian-nxny-inspection
          path: out
          retention-days: 1
          compression-level: 0
