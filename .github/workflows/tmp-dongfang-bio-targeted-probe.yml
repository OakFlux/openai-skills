name: Temporary Dongfang Biotech targeted report probe

on:
  push:
    branches:
      - tmp-dongfang-bio-reports-20260830
    paths:
      - .github/workflows/tmp-dongfang-bio-targeted-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public indexes for the 2022 Anxin report and other long reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests, urllib.parse
          from bs4 import BeautifulSoup

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          queries=[
              '新生代国际化IVD龙头，后新冠检测时代全线业务全球化布局加速',
              '新生代国际化IVD龙头 后新冠检测时代全线业务全球化布局加速',
              '东方生物 安信证券',
              '东方生物 深度报告',
              '东方生物 首次覆盖',
              '688298 公司深度',
          ]
          sd=requests.Session(); sd.headers.update({
              'User-Agent':ua,'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
              'Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'
          })
          seen=set(); matches=[]
          for q in queries:
              for page in range(1,4):
                  payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':page,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
                  r=sd.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=90)
                  print('\nSD_QUERY',q,page,r.status_code,len(r.content),r.headers.get('content-type'))
                  r.raise_for_status(); data=(r.json().get('data') or {}); files=data.get('files') or []
                  print('SD_TOTAL',data.get('total'),'COUNT',len(files))
                  for f in files:
                      fid=f.get('id')
                      if fid in seen: continue
                      seen.add(fid)
                      name=str(f.get('name') or '')
                      stock=f.get('stock') or {}
                      content=str(f.get('content') or '')[:2500]
                      blob=' '.join([name,str(stock.get('name') or ''),str(stock.get('code') or ''),content])
                      if '东方生物' not in blob and '688298' not in blob and '东方基因' not in blob and '新生代国际化IVD龙头' not in blob:
                          continue
                      row={
                          'id':fid,'name':name,'date':f.get('time_text'),'pages':f.get('page_count'),
                          'size':f.get('file_size'),'type':(f.get('type') or {}).get('name'),
                          'organization':(f.get('organization') or {}).get('name'),'stock':stock,
                          'uuid':f.get('data_source_uuid'),'data_source':f.get('data_source'),
                          'original_id':f.get('original_id'),'online_url':f.get('online_url'),
                          'page_url':f.get('page_url'),'share_url':f.get('share_url'),
                          'summary':str(f.get('summary') or '')[:1000],
                          'content_head':content[:1000],
                      }
                      matches.append(row); print('SD_MATCH',json.dumps(row,ensure_ascii=False))
                      uuid=str(f.get('data_source_uuid') or '')
                      for info in re.findall(r'AP\d+',uuid):
                          for prefix in ['H3','H2','H1']:
                              u=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                              x=requests.get(u,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=60,allow_redirects=True)
                              print('AP_TEST',info,prefix,x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:20]),x.url)
                  if not files or page*100>=int(data.get('total') or 0): break

          # Search known public report sites and inspect pages for direct original PDF URLs.
          pages=[
              'https://m.lejucaijing.com/company/67764.html',
              'https://www.iivd.net/article-31035-1.html',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*'})
          for url in pages:
              try:
                  r=s.get(url,timeout=90,allow_redirects=True)
                  print('\nPAGE',url,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                  text=r.text
                  for pat in [r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',r'https?://[^\s"\'<>]+(?:download|attachment|file)[^\s"\'<>]*']:
                      for m in sorted(set(re.findall(pat,text,re.I))): print('PAGE_ASSET',m[:2000])
                  soup=BeautifulSoup(text,'html.parser')
                  for a in soup.find_all('a',href=True):
                      label=' '.join(a.get_text(' ',strip=True).split())
                      blob=(label+' '+a['href']).lower()
                      if any(k.lower() in blob for k in ['新生代国际化ivd龙头','东方生物','688298','pdf','下载']):
                          print('PAGE_LINK',json.dumps({'label':label[:500],'href':urllib.parse.urljoin(r.url,a['href'])},ensure_ascii=False))
              except Exception as e: print('PAGE_ERR',url,repr(e))

          print('\nFINAL_MATCHES',json.dumps(matches,ensure_ascii=False,indent=2))
          PY
        env:
          PYTHONUNBUFFERED: '1'
