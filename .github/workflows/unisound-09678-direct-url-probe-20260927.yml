name: Probe Yunzhisheng official PDF URLs 20260927
on:
  push:
    paths:
      - '.github/workflows/unisound-09678-direct-url-probe-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests pypdf
      - name: Probe URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,hashlib
          from pathlib import Path
          from io import BytesIO
          from pypdf import PdfReader
          urls=[
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042906218.pdf',
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042906219_c.pdf',
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0620/2025062000023.pdf',
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0620/2025062000024_c.pdf',
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0923/2026092301927.pdf',
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0923/2026092301928_c.pdf',
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082800295.pdf',
          'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082800296_c.pdf',
          ]
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://www1.hkexnews.hk/'})
          out=[]
          for i,u in enumerate(urls):
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              rec={'url':u,'status':r.status_code,'final':r.url,'type':r.headers.get('content-type'),'bytes':len(r.content),'head':r.content[:20].hex()}
              if r.content[:5]==b'%PDF-':
                try:
                  reader=PdfReader(BytesIO(r.content),strict=False); rec['pages']=len(reader.pages); rec['text0']=(reader.pages[0].extract_text() or '')[:1000]
                  rec['sha256']=hashlib.sha256(r.content).hexdigest()
                  Path(f'out/{i:02d}.pdf').write_bytes(r.content)
                except Exception as e: rec['pdf_error']=repr(e)
              out.append(rec)
            except Exception as e: out.append({'url':u,'error':repr(e)})
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: unisound-09678-direct-url-probe
          path: out
          retention-days: 7
          if-no-files-found: error
