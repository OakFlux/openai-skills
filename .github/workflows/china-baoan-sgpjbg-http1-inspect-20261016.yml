name: Inspect SGPJBG China Baoan report over HTTP1
on:
  push:
    paths:
      - '.github/workflows/china-baoan-sgpjbg-http1-inspect-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - shell: bash
        run: |
          set -x
          urls=(
            'https://www.sgpjbg.com.cn/zhuanti/teruisibaogao.html'
            'https://sgpjbg.com.cn/zhuanti/teruisibaogao.html'
            'https://www.sgpjbg.com/zhuanti/teruisibaogao.html'
            'https://m.sgpjbg.com.cn/zhuanti/teruisibaogao.html'
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            curl --http1.1 -4 -L --compressed --connect-timeout 20 --max-time 90 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
              -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' \
              -H 'Referer: https://www.baidu.com/' \
              -D headers.txt -o page.html "$u" || true
            cat headers.txt || true
            wc -c page.html || true
            file page.html || true
            python - <<'PY'
          from pathlib import Path
          p=Path('page.html')
          if not p.exists(): raise SystemExit
          b=p.read_bytes()
          for enc in ['utf-8','gb18030','gbk']:
            try:
              t=b.decode(enc); break
            except Exception: pass
          else: t=b.decode('utf-8','replace')
          pos=t.find('中国宝安')
          print('CHINA_BAOAN_POS',pos)
          if pos>=0: print(t[max(0,pos-12000):pos+30000])
          print('START',t[:1000])
          PY
          done
