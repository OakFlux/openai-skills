name: Discover Shimao Group reports 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-report-discovery-20261012.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect Shimao investor relations pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          urls = [
              'https://www.shimaogroup.com/smlist/list.php?tid=15',
              'https://www.shimaogroup.com/smlist/wap_list.php?tid=15',
              'https://www.shimaogroup.com/en/smlist/list.php?tid=15',
              'https://www.shimaogroup.com/en/smlist/wap_list.php?tid=15',
              'https://www.shimaogroup.com/index.php?m=content&c=index&a=lists&catid=15',
              'https://www.shimaogroup.com/en/index.php?m=content&c=index&a=lists&catid=15',
          ]
          for url in urls:
              try:
                  r = s.get(url, timeout=60, allow_redirects=True)
                  print('\nPAGE', url, 'STATUS', r.status_code, 'LEN', len(r.content), 'FINAL', r.url, flush=True)
                  text = r.text
                  print('HEAD', text[:3000].replace('\n',' '), flush=True)
                  soup = BeautifulSoup(text, 'html.parser')
                  vals=[]
                  for tag in soup.find_all(['a','script','link','iframe','source']):
                      for attr in ('href','src','data-url','data-href','data-src'):
                          v=tag.get(attr)
                          if v:
                              full=urljoin(r.url,v)
                              if full not in vals:
                                  vals.append(full)
                  for v in vals:
                      if any(k in v.lower() for k in ['pdf','report','annual','interim','ajax','api','list.php','download','upload']):
                          print('LINK', v, flush=True)
                  patterns = [
                      r'https?://[^\"\'<> ]+\.pdf(?:\?[^\"\'<> ]*)?',
                      r'[^\"\'<> ]+\.pdf(?:\?[^\"\'<> ]*)?',
                      r'(?:ajax|api|url|file|path)[^\n]{0,300}',
                  ]
                  for p in patterns:
                      matches=[]
                      for m in re.findall(p,text,re.I):
                          if isinstance(m,tuple): m=' '.join(m)
                          if m not in matches: matches.append(m)
                      for m in matches[:200]: print('MATCH', m, flush=True)
              except Exception as e:
                  print('ERROR', url, repr(e), flush=True)
          PY
