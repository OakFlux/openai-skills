name: Discover CosMX 688772 broker reports 20261016

on:
  push:
    paths:
      - '.github/workflows/anche-300572-broker-report-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query Eastmoney report index and probe public PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          rows=[]
          for page in range(1,8):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
                  'ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31',
                  'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'688772',
                  'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
              }
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,120))
              r.raise_for_status(); data=r.json(); batch=data.get('data') or []
              print('PAGE',page,'HITS',data.get('hits'),'ROWS',len(batch))
              if not batch: break
              rows.extend(batch)
              if len(batch)<100: break
              time.sleep(.1)
          out=[]; seen=set()
          for row in rows:
              code=str(row.get('infoCode') or '')
              if not code or code in seen: continue
              seen.add(code)
              item={
                  'title':row.get('title'),'stockName':row.get('stockName'),'stockCode':row.get('stockCode'),
                  'orgName':row.get('orgName'),'orgSName':row.get('orgSName'),'publishDate':row.get('publishDate'),
                  'infoCode':code,'attachPages':row.get('attachPages'),'attachSize':row.get('attachSize'),
                  'rating':row.get('emRatingName') or row.get('sRatingName'),'researcher':row.get('researcher'),
                  'column':row.get('column'),'reportType':row.get('reportType')
              }
              url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'; item['pdf_url']=url
              try:
                  rr=s.get(url,timeout=(20,180),allow_redirects=True,headers={
                      'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/report/',
                      'Accept':'application/pdf,*/*;q=0.8'
                  })
                  item.update({'pdf_status':rr.status_code,'pdf_bytes':len(rr.content),'pdf_head':rr.content[:5].decode('latin1','replace')})
              except Exception as exc:
                  item['pdf_error']=repr(exc)
              out.append(item)
          out.sort(key=lambda x:(str(x.get('publishDate') or ''),int(x.get('attachPages') or 0)),reverse=True)
          Path('out/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(out))
          for x in out:
              print('REPORT_JSON',json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: cosmx-688772-broker-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
