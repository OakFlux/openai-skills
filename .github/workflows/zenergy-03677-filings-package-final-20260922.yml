name: Build final Zenergy 03677 filings package 20260922

on:
  push:
    paths:
      - '.github/workflows/zenergy-03677-filings-package-final-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package official filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='正力新能_03677_全部年报_招股说明书及最新中期业绩'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          previews=out/'首页预览'; previews.mkdir(exist_ok=True)

          docs=[
            {
              'filename':'01_正力新能_03677_2025年年度报告_中文版_2026-04-23.pdf',
              'title':'正力新能2025年年度报告（中文版）',
              'type':'annual_report','language':'Chinese','date':'2026-04-23',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042302899_c.pdf',
              'min_pages':100,'min_bytes':500000,
            },
            {
              'filename':'02_ZENERGY_03677_2025_Annual_Report_English_2026-04-23.pdf',
              'title':'ZENERGY 2025 Annual Report (English)',
              'type':'annual_report','language':'English','date':'2026-04-23',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042302898.pdf',
              'min_pages':100,'min_bytes':500000,
            },
            {
              'filename':'03_正力新能_03677_招股章程_中文版_2025-04-03.pdf',
              'title':'正力新能招股章程（中文版）',
              'type':'prospectus','language':'Chinese','date':'2025-04-03',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0403/2025040300014_c.pdf',
              'min_pages':500,'min_bytes':3000000,
            },
            {
              'filename':'04_ZENERGY_03677_Prospectus_English_2025-04-03.pdf',
              'title':'ZENERGY Prospectus (English)',
              'type':'prospectus','language':'English','date':'2025-04-03',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0403/2025040300013.pdf',
              'min_pages':500,'min_bytes':3000000,
            },
            {
              'filename':'05_正力新能_03677_2026年中期业绩公告_中文版_2026-08-31.pdf',
              'title':'截至2026年6月30日止六个月中期业绩公告（中文版）',
              'type':'latest_interim_results','language':'Chinese','date':'2026-08-31',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0831/2026083100863_c.pdf',
              'min_pages':8,'min_bytes':80000,
            },
            {
              'filename':'06_ZENERGY_03677_2026_Interim_Results_English_2026-08-31.pdf',
              'title':'Interim Results for the Six Months Ended June 30, 2026 (English)',
              'type':'latest_interim_results','language':'English','date':'2026-08-31',
              'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0831/2026083100862.pdf',
              'min_pages':8,'min_bytes':80000,
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www1.hkexnews.hk/',
          })

          def variants(url):
            vals=[url]
            if 'www1.hkexnews.hk' in url: vals.append(url.replace('www1.hkexnews.hk','www.hkexnews.hk'))
            return vals

          def download(doc,dest):
            errors=[]
            for url in variants(doc['url']):
              for attempt in range(1,5):
                tmp=dest.with_suffix(dest.suffix+'.part')
                try:
                  with s.get(url,timeout=(30,300),allow_redirects=True,stream=True) as r:
                    print('DOWNLOAD',dest.name,'attempt',attempt,'status',r.status_code,url,'final',r.url,flush=True)
                    r.raise_for_status()
                    with tmp.open('wb') as f:
                      for chunk in r.iter_content(1024*1024):
                        if chunk: f.write(chunk)
                  size=tmp.stat().st_size
                  with tmp.open('rb') as f: head=f.read(8)
                  if size<doc['min_bytes'] or not head.startswith(b'%PDF-'):
                    raise RuntimeError(f'invalid PDF: size={size}, head={head!r}')
                  tmp.replace(dest)
                  return str(r.url)
                except Exception as e:
                  errors.append(f'{url} attempt {attempt}: {e!r}')
                  tmp.unlink(missing_ok=True)
                  time.sleep(attempt*2)
            raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records=[]; seen=set()
          for doc in docs:
            dest=out/doc['filename']
            final_url=download(doc,dest)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<doc['min_pages']:
              raise RuntimeError(f'page count too small for {dest.name}: {pages}')
            text=''
            for p in reader.pages[:min(20,pages)]:
              try: text+='\n'+(p.extract_text() or '')
              except Exception: pass
            low=text.lower()
            if not any(k in low for k in ('正力新能','zenergy','3677','03677')):
              raise RuntimeError(f'company identity not verified in {dest.name}')
            if doc['type']=='annual_report' and not any(k in low for k in ('年度報告','年度报告','annual report')):
              raise RuntimeError(f'annual report identity not verified in {dest.name}')
            if doc['type']=='prospectus' and not any(k in low for k in ('全球發售','全球发售','招股章程','global offering')):
              raise RuntimeError(f'prospectus identity not verified in {dest.name}')
            if doc['type']=='latest_interim_results' and not any(k in low for k in ('中期業績','中期业绩','interim results')):
              raise RuntimeError(f'interim results identity not verified in {dest.name}')
            check=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
            if check.returncode not in (0,3):
              raise RuntimeError(f'qpdf failed for {dest.name}: {check.stderr[-1200:]}')
            base=previews/dest.stem
            render=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','100',str(dest),str(base)],capture_output=True,text=True)
            if render.returncode!=0 or not base.with_suffix('.png').exists():
              raise RuntimeError(f'render failed for {dest.name}: {render.stderr[-1200:]}')
            data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in seen: raise RuntimeError('duplicate PDF '+dest.name)
            seen.add(sha)
            rec={
              'filename':doc['filename'],'title':doc['title'],'document_type':doc['type'],
              'language':doc['language'],'release_date':doc['date'],'source':'香港交易所披露易',
              'source_url':final_url,'pages':pages,'bytes':len(data),'sha256':sha,
            }
            records.append(rec)
            print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          readme=[
            '江苏正力新能电池技术股份有限公司（03677.HK）官方披露文件',
            '整理日期：2026-09-22','',
            '收录范围：上市后全部完整年度报告、最终招股章程，以及截至整理日最新阶段性财务报告。',
            '公司于2025-04-14在香港联交所上市，因此截至整理日，上市后完整年度报告只有2025年年度报告。',
            '公司已获豁免无须另行刊发2024年年度报告；2024年度历史财务资料载于本包招股章程，故不存在独立2024年年度报告。',
            '香港主板公司通常不按A股口径强制披露第一、第三季度报告。截至2026-09-22，最新财务披露为2026-08-31发布的截至2026年6月30日止六个月中期业绩公告，本包收录中英文官方原件。','',
            '文件清单：'
          ]
          for i,r in enumerate(records,1):
            readme += [
              f"{i}. {r['title']}",
              f"   文件：{r['filename']}",
              f"   披露日期：{r['release_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",
              f"   来源：{r['source_url']}",
              f"   SHA-256：{r['sha256']}",'',
            ]
          readme.append('完整性核验：PDF文件头、公司身份、文件类型、实际页数、qpdf结构检查、首页渲染、ZIP CRC及SHA-256。')
          (out/'00_文件清单与核验说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
            for p in sorted(out.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(out)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failure: '+bad)
            pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if len(pdfs)!=6: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha=hashlib.sha256(zpath.read_bytes()).hexdigest()
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',zip_sha,flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: zenergy-03677-filings-final-static
          path: 正力新能_03677_全部年报_招股说明书及最新中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
