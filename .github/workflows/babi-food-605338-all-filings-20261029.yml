name: Build Babi Food 605338 all filings 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/babi-food-605338-all-filings-20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          CODE = '605338'
          SHORT = '巴比食品'
          FULL = '中饮巴比食品股份有限公司'
          PACKAGE = '巴比食品_605338_全部年报_招股说明书_最新季报'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          TMP = Path('_tmp_babi')
          for d in (ROOT, PDFDIR, PREV, TMP):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          headers = {
              'User-Agent': ua,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }

          def compact_text(text: str) -> str:
              return re.sub(r'\s+', '', text or '')

          def unique(seq):
              out = []
              seen = set()
              for x in seq:
                  if x and x not in seen:
                      seen.add(x)
                      out.append(x)
              return out

          def extract_pdf_urls(page_url: str) -> list[str]:
              found = []
              try:
                  r = session.get(page_url, headers={**headers, 'Referer': 'https://finance.sina.com.cn/'}, timeout=(30, 120), allow_redirects=True)
                  r.encoding = r.apparent_encoding or 'utf-8'
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = urljoin(r.url, a.get('href'))
                      if '.pdf' in href.lower():
                          found.append(href)
                  for m in re.finditer(r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?', r.text, flags=re.I):
                      found.append(m.group(0).replace('&amp;', '&'))
              except Exception as exc:
                  print('PAGE_EXTRACT_ERROR', page_url, repr(exc))
              return unique(found)

          def discover_q3_candidates() -> list[str]:
              candidates = []
              list_pages = [
                  'https://money.finance.sina.com.cn/corp/view/vCB_BulletinSan.php?page_type=sjdbg&stockid=605338&type=list',
                  'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/605338/page_type/sjdbg.phtml',
                  'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/605338.phtml?ftype=lsgg',
                  'https://www.cfi.net.cn/p20261028003949.html',
                  'https://q.stock.sohu.com/cn/605338/bw.shtml',
              ]
              discovery = []
              for page_url in list_pages:
                  try:
                      r = session.get(page_url, headers={**headers, 'Referer': 'https://finance.sina.com.cn/'}, timeout=(30, 120), allow_redirects=True)
                      r.encoding = r.apparent_encoding or 'utf-8'
                      soup = BeautifulSoup(r.text, 'html.parser')
                      page_entry = {'url': page_url, 'status': r.status_code, 'bytes': len(r.content), 'matches': []}
                      for a in soup.find_all('a', href=True):
                          text = compact_text(a.get_text(' ', strip=True))
                          href = urljoin(r.url, a.get('href'))
                          if '2026年第三季度报告' in text and '经营数据' not in text and '摘要' not in text:
                              page_entry['matches'].append({'text': text, 'href': href})
                              if '.pdf' in href.lower():
                                  candidates.append(href)
                              m = re.search(r'(?:id=|/)(\d{7,9})(?:&|\.|/|$)', href)
                              if m:
                                  bid = m.group(1)
                                  for day in ('2026-10-29', '2026-10-28'):
                                      candidates.append(f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-10/{day}/{bid}.PDF')
                                  candidates.extend(extract_pdf_urls(href))
                      for m in re.finditer(r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?', r.text, flags=re.I):
                          url = m.group(0).replace('&amp;', '&')
                          context = compact_text(r.text[max(0, m.start()-500):min(len(r.text), m.end()+500)])
                          if '2026年第三季度报告' in context or CODE in context:
                              candidates.append(url)
                      discovery.append(page_entry)
                  except Exception as exc:
                      discovery.append({'url': page_url, 'error': repr(exc)})

              # Sina bulletin IDs around the same-day disclosures are consecutive; these are fallbacks.
              for bid in range(12670845, 12670876):
                  for day in ('2026-10-29', '2026-10-28'):
                      candidates.append(f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-10/{day}/{bid}.PDF')

              (ROOT / '00_最新季报来源发现记录.json').write_text(
                  json.dumps({'pages': discovery, 'candidates': unique(candidates)}, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )
              return unique(candidates)

          q3_candidates = discover_q3_candidates()

          items = [
              {
                  'label': '2020年年度报告',
                  'kind': 'annual',
                  'min_pages': 150,
                  'required': ['2020年年度报告'],
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-4/2021-04-28/7151481.PDF',
                      'https://pdf.dfcfw.com/pdf/H2_AN202104271488175991_1.pdf',
                  ],
              },
              {
                  'label': '2021年年度报告',
                  'kind': 'annual',
                  'min_pages': 150,
                  'required': ['2021年年度报告'],
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-09/7971162.PDF',
                  ],
              },
              {
                  'label': '2022年年度报告',
                  'kind': 'annual',
                  'min_pages': 150,
                  'required': ['2022年年度报告'],
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-07/8959541.PDF',
                  ],
              },
              {
                  'label': '2023年年度报告',
                  'kind': 'annual',
                  'min_pages': 150,
                  'required': ['2023年年度报告'],
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-3/2024-03-29/9913911.PDF',
                  ],
              },
              {
                  'label': '2024年年度报告',
                  'kind': 'annual',
                  'min_pages': 150,
                  'required': ['2024年年度报告'],
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-3/2025-03-28/10814222.PDF',
                  ],
              },
              {
                  'label': '2025年年度报告',
                  'kind': 'annual',
                  'min_pages': 150,
                  'required': ['2025年年度报告'],
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-10/12075141.PDF',
                  ],
              },
              {
                  'label': '首次公开发行股票招股说明书',
                  'kind': 'prospectus',
                  'min_pages': 350,
                  'required': ['首次公开发行股票招股说明书'],
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2020/2020-9/2020-09-22/6622346.PDF',
                  ],
              },
              {
                  'label': '2026年第三季度报告',
                  'kind': 'quarter',
                  'min_pages': 8,
                  'required': ['2026年第三季度报告'],
                  'urls': q3_candidates,
              },
          ]

          # Detail pages are added as fallback sources for historic filings.
          detail_pages = {
              '2020年年度报告': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7151481&stockid=605338',
              '2021年年度报告': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7971162&stockid=605338',
              '2022年年度报告': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8959541&stockid=605338',
              '2023年年度报告': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9913911&stockid=605338',
              '2024年年度报告': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10814222&stockid=605338',
              '2025年年度报告': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12075141&stockid=605338',
              '首次公开发行股票招股说明书': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=6622346&stockid=605338',
          }
          for item in items:
              page = detail_pages.get(item['label'])
              if page:
                  item['urls'] = unique(item['urls'] + extract_pdf_urls(page))

          manifest = []
          for idx, item in enumerate(items, 1):
              if not item['urls']:
                  raise RuntimeError(f'No candidate URLs for {item["label"]}')

              selected = None
              attempts = []
              for url_index, url in enumerate(item['urls']):
                  for attempt in range(2 if item['kind'] == 'quarter' else 4):
                      try:
                          if 'sina.com.cn' in url:
                              referer = 'https://vip.stock.finance.sina.com.cn/'
                          elif 'dfcfw.com' in url:
                              referer = 'https://data.eastmoney.com/'
                          elif 'sse.com.cn' in url:
                              referer = 'https://www.sse.com.cn/'
                          elif 'cninfo.com.cn' in url:
                              referer = 'https://www.cninfo.com.cn/'
                          else:
                              referer = 'https://www.cfi.net.cn/'
                          r = session.get(
                              url,
                              headers={**headers, 'Referer': referer, 'Accept': 'application/pdf,*/*;q=0.8'},
                              timeout=(20, 240),
                              allow_redirects=True,
                          )
                          record = {
                              'url': url, 'attempt': attempt + 1, 'status': r.status_code,
                              'bytes': len(r.content), 'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          }
                          attempts.append(record)
                          if r.status_code != 200 or r.content[:5] != b'%PDF-' or len(r.content) < 50000:
                              if r.status_code in (400, 401, 403, 404, 410):
                                  break
                              time.sleep(1 + attempt)
                              continue

                          probe = TMP / f'probe_{idx}_{url_index}.pdf'
                          probe.write_bytes(r.content)
                          try:
                              reader = PdfReader(str(probe), strict=False)
                              pages = len(reader.pages)
                              if pages < item['min_pages']:
                                  record['rejected'] = f'page_count={pages}'
                                  break
                              text = ''
                              for page_obj in reader.pages[:min(45, pages)]:
                                  try:
                                      text += '\n' + (page_obj.extract_text() or '')
                                  except Exception:
                                      pass
                              compact = compact_text(text)
                              identity_hits = [x for x in (SHORT, FULL, CODE, '中饮股份') if compact_text(x) in compact]
                              required_hits = [term for term in item['required'] if compact_text(term) in compact]
                              if len(compact) > 500 and not identity_hits:
                                  record['rejected'] = 'issuer_mismatch'
                                  break
                              if not required_hits:
                                  record['rejected'] = 'required_title_mismatch'
                                  break
                              subprocess.run(
                                  ['qpdf', '--warning-exit-0', '--check', str(probe)],
                                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                              )
                              selected = {
                                  'data': r.content,
                                  'source_url': url,
                                  'pages': pages,
                                  'identity_hits': identity_hits,
                                  'required_hits': required_hits,
                              }
                              break
                          except Exception as exc:
                              record['rejected'] = repr(exc)
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                          time.sleep(1 + attempt)
                  if selected is not None:
                      break

              if selected is None:
                  raise RuntimeError(f'No valid PDF selected for {item["label"]}: {attempts}')

              filename = f'{idx:02d}_巴比食品_{item["label"]}.pdf'
              dest = PDFDIR / filename
              dest.write_bytes(selected['data'])
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed for {filename}')

              sha = hashlib.sha256(selected['data']).hexdigest()
              manifest.append({
                  'label': item['label'],
                  'kind': item['kind'],
                  'source_url': selected['source_url'],
                  'candidate_count': len(item['urls']),
                  'filename': str(Path('原始PDF') / filename),
                  'pages': selected['pages'],
                  'bytes': len(selected['data']),
                  'sha256': sha,
                  'identity_hits': selected['identity_hits'],
                  'required_hits': selected['required_hits'],
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'report title', 'page count',
                      'qpdf structure', 'first-page render',
                  ],
              })
              print('VERIFIED', item['label'], selected['pages'], len(selected['data']), sha, selected['source_url'])

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '中饮巴比食品股份有限公司（605338.SH）公开披露文件资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：公司上市后全部年度报告全文（2020—2025年）、首次公开发行股票招股说明书最终发行版，以及截至整理日最新披露的2026年第三季度报告。',
              '不收录年度报告摘要、招股意向书、申报稿或普通公告页面。',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["label"]}',
                  f'   页数：{x["pages"]}页；文件：{x["filename"]}',
                  f'   来源：{x["source_url"]}',
                  f'   SHA-256：{x["sha256"]}',
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '核验项目：PDF文件头、公司名称/证券代码、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('babi_food_605338_all_annual_reports_prospectus_latest_quarter.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: babi-food-605338-all-filings-final
          path: |
            巴比食品_605338_全部年报_招股说明书_最新季报.zip
            babi_food_605338_all_annual_reports_prospectus_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
