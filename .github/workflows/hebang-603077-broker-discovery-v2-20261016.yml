name: Discover Hebang Biotechnology 603077 broker reports v2 20261016

on:
  push:
    paths:
      - '.github/workflows/hebang-603077-broker-discovery-v2-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery_out
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests
          CODE='603077'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':f'https://data.eastmoney.com/report/{CODE}.html','Accept':'application/json,text/plain,*/*'})
          url='https://reportapi.eastmoney.com/report/list'
          rows_all=[]; logs=[]
          for page in range(1,11):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2026-10-16','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':CODE,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              obj=None; last=None
              for attempt in range(1,7):
                  try:
                      r=s.get(url,params=params,timeout=(20,120)); last={'status':r.status_code,'bytes':len(r.content),'head':r.text[:120]}
                      if r.status_code==200:
                          t=r.text.strip();
                          if t.startswith('{'): obj=json.loads(t)
                          else:
                              a=t.find('('); b=t.rfind(')')
                              if a>=0 and b>a: obj=json.loads(t[a+1:b])
                          if obj is not None: break
                  except Exception as e: last={'error':repr(e)}
                  time.sleep(attempt)
              if obj is None: raise RuntimeError(f'page {page} failed {last}')
              rows=obj.get('data') or []
              if isinstance(rows,dict): rows=rows.get('list') or rows.get('data') or []
              logs.append({'page':page,'count':len(rows),'hits':obj.get('hits'),'totalPage':obj.get('TotalPage') or obj.get('totalPage')})
              if not rows: break
              rows_all.extend(rows)
              if len(rows)<100: break
              time.sleep(0.5)
          unique=[]; seen=set()
          for r in rows_all:
              ic=str(r.get('infoCode') or '')
              if ic in seen: continue
              seen.add(ic); unique.append(r)
          unique=[r for r in unique if str(r.get('stockCode') or '')==CODE or str(r.get('stockName') or '')=='和邦生物']
          unique.sort(key=lambda r:(str(r.get('publishDate') or ''),int(r.get('attachPages') or 0)),reverse=True)
          Path('discovery_out/hebang_603077_report_metadata.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery_out/query_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=[f'TOTAL={len(unique)}']
          for r in unique:
              lines.append('\t'.join([str(r.get('publishDate') or '')[:10],str(r.get('attachPages') or ''),str(r.get('orgSName') or ''),str(r.get('title') or ''),str(r.get('infoCode') or ''),str(r.get('column') or ''),str(r.get('emRatingName') or '')]))
          Path('discovery_out/hebang_603077_report_index.tsv').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: hebang-603077-broker-discovery-v2-20261016
          path: discovery_out/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
