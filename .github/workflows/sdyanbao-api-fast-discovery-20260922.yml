name: Discover Sdyanbao download API quickly 20260922

on:
  push:
    paths:
      - '.github/workflows/sdyanbao-api-fast-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch four Nuxt bundles and search APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          for f in 0bec462.js 7ff3a18.js 359ac1f.js a94fdf1.js; do
            curl -L --max-time 45 --retry 2 -A "$UA" "https://www.sdyanbao.com/_nuxt/$f" -o "out/$f" || true
          done
          grep -RInE 'download|pdf|original_id|originalId|data_source_uuid|dataSourceUuid|/api/|report.*url|url.*report|file.*url|axios' out > out/hits.txt || true
          python - <<'PY'
          from pathlib import Path
          import re,json
          rec={}
          pats=[r'.{0,350}(?:download|pdf|original_id|originalId|data_source_uuid|dataSourceUuid|/api/|fileUrl|reportUrl).{0,650}']
          for p in Path('out').glob('*.js'):
            text=p.read_text(errors='replace')
            arr=[]
            for pat in pats:
              for m in re.finditer(pat,text,re.I|re.S):
                s=' '.join(m.group(0).split())
                if s not in arr: arr.append(s)
                if len(arr)>=150: break
            rec[p.name]={'bytes':p.stat().st_size,'matches':arr}
          Path('out/context.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rec,ensure_ascii=False,indent=2))
          PY
          find out -type f -printf '%f %s bytes\n' | sort > out/sizes.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-api-fast-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
