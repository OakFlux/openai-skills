name: Wens Foodstuff Official Filings Package

on:
  push:
    branches:
      - chatgpt-wens-filings-20260927
    paths:
      - .github/workflows/wens_filings_20260927.yml
      - scripts/build_wens_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, and package official reports
        run: python scripts/build_wens_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: wens-official-filings-package
          path: |
            output/温氏股份_2020-2025年报_2026年第一季度报告.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
