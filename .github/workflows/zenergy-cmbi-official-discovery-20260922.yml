name: Discover official CMBI Zenergy research PDFs 20260922

on:
  push:
    paths:
      - '.github/workflows/zenergy-cmbi-official-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Scan CMBI research pages and extract official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('out')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          matches=[]
          list_records=[]
          for lang in ('en','cn'):
            for page in range(1,81):
              url=f'https://www.cmbi.com.hk/market-stockreview?lang={lang}&page={page}'
              try:
                r=s.get(url,timeout=(20,60))
                txt=r.content.decode('utf-8','replace')
                if r.status_code!=200: continue
                soup=BeautifulSoup(txt,'lxml')
                body=soup.get_text(' ',strip=True)
                if 'Zenergy' in body or '正力新能' in body or '3677 HK' in body:
                  rec={'lang':lang,'page':page,'url':url,'status':r.status_code,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':[]}
                  for a in soup.find_all('a',href=True):
                    t=a.get_text(' ',strip=True)
                    h=urljoin(url,a['href'])
                    if any(k.lower() in (t+' '+h).lower() for k in ('zenergy','正力新能','3677')):
                      rec['links'].append({'text':t,'url':h})
                      matches.append({'source_list':url,'text':t,'url':h})
                  list_records.append(rec)
                time.sleep(.08)
              except Exception as e:
                pass

          # Search site endpoint and generic root pages as extra paths
          for q in ('Zenergy','3677','正力新能'):
            for url in [f'https://www.cmbi.com.hk/search?keyword={q}', f'https://www.cmbi.com.hk/search?lang=en&keyword={q}', f'https://www.cmbi.com.hk/search?lang=cn&keyword={q}']:
              try:
                r=s.get(url,timeout=(20,60)); soup=BeautifulSoup(r.text,'lxml')
                for a in soup.find_all('a',href=True):
                  t=a.get_text(' ',strip=True); h=urljoin(url,a['href'])
                  if any(k.lower() in (t+' '+h).lower() for k in ('zenergy','正力新能','3677')):
                    matches.append({'source_list':url,'text':t,'url':h})
              except: pass

          # normalize only article pages, include known page 13341
          article_urls={'https://www.cmbi.com.hk/article/13341.html?lang=en'}
          for m in matches:
            h=m['url']
            mm=re.search(r'https?://(?:www\.)?cmbi\.com\.hk/article/\d+\.html(?:\?[^#]*)?',h)
            if mm: article_urls.add(mm.group(0))
            elif '/article/' in h: article_urls.add(h)
          article_records=[]
          pdfs=[]
          for au in sorted(article_urls):
            for lang in ('en','cn'):
              base=re.sub(r'\?.*$','',au)+f'?lang={lang}'
              try:
                r=s.get(base,timeout=(20,60)); soup=BeautifulSoup(r.text,'lxml')
                title=soup.find('h1') or soup.find('h2') or soup.title
                ttl=title.get_text(' ',strip=True) if title else ''
                links=[]
                for tag in soup.find_all(['a','iframe','embed','object'],href=True)+soup.find_all(['iframe','embed'],src=True):
                  val=tag.get('href') or tag.get('src') or tag.get('data')
                  if not val: continue
                  h=urljoin(base,val)
                  if '.pdf' in h.lower() or 'hk-official.cmbi.info' in h:
                    links.append(h); pdfs.append({'article':base,'title':ttl,'pdf_url':h})
                # regex fallback
                for h in re.findall(r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',r.text,re.I):
                  links.append(h); pdfs.append({'article':base,'title':ttl,'pdf_url':h})
                if any(k.lower() in (ttl+' '+soup.get_text(' ',strip=True)).lower() for k in ('zenergy','正力新能','3677')) or links:
                  article_records.append({'url':base,'status':r.status_code,'title':ttl,'pdf_links':sorted(set(links))})
              except Exception as e:
                article_records.append({'url':base,'error':repr(e)})

          # de-duplicate and verify pdfs
          dedup={}
          for p in pdfs: dedup[p['pdf_url']]=p
          verified=[]
          for url,p in dedup.items():
            try:
              r=s.get(url,timeout=(30,120),allow_redirects=True)
              rec={**p,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'is_pdf':r.content[:5]==b'%PDF-'}
              verified.append(rec)
              if rec['is_pdf']:
                fn=OUT/(re.sub(r'[^0-9A-Za-z._-]+','_',url.rsplit('/',1)[-1].split('?')[0]) or f'file_{len(verified)}.pdf')
                fn.write_bytes(r.content)
            except Exception as e:
              verified.append({**p,'error':repr(e)})
          (OUT/'list_matches.json').write_text(json.dumps(list_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'raw_matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'article_records.json').write_text(json.dumps(article_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'verified_pdfs.json').write_text(json.dumps(verified,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'matches':matches,'articles':article_records,'pdfs':verified},ensure_ascii=False,indent=2))
          PY
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > out/file_sizes.txt

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: zenergy-cmbi-official-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
