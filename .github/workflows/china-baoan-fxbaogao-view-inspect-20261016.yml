name: Inspect full China Baoan report viewer
on:
  push:
    paths:
      - '.github/workflows/china-baoan-fxbaogao-view-inspect-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet curl_cffi beautifulsoup4 lxml
      - shell: bash
        run: |
          python - <<'PY'
          import json,re
          from curl_cffi import requests
          from bs4 import BeautifulSoup
          urls=['https://www.fxbaogao.com/view?id=2892941','https://m.fxbaogao.com/view?id=2892941']
          s=requests.Session(impersonate='chrome')
          for u in urls:
            print('\nFETCH',u,flush=True)
            try:
              r=s.get(u,timeout=60,allow_redirects=True,headers={'Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.fxbaogao.com/detail/2892941'})
              print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
              text=r.text
              print('START',text[:3000],flush=True)
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None,flush=True)
              print('IMAGES')
              for img in soup.find_all('img'):
                print(json.dumps(img.attrs,ensure_ascii=False),flush=True)
              print('IFRAMES')
              for tag in soup.find_all(['iframe','embed','object']): print(tag.name,json.dumps(tag.attrs,ensure_ascii=False),flush=True)
              print('URL_CANDIDATES')
              for x in sorted(set(re.findall(r'https?[^\s"\'<>]+',text,re.I))):
                if any(k in x.lower() for k in ['report','pdf','image','2892941','download','oss']): print(x[:2000],flush=True)
              for script in soup.find_all('script'):
                st=script.get_text('\n')
                if any(k in st.lower() for k in ['report-image','2892941','pdf','pagecount','pages','download','oss']): print('SCRIPT',st[:100000],flush=True)
            except Exception as e:
              print('ERROR',type(e).__name__,str(e),flush=True)
          PY
