name: package-rongtai-605133-filings

on:
  push:
    branches:
      - tmp/rongtai-605133-filings-20261105-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Download validate and package documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import parse_qs, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          COMPANY = "嵘泰股份"
          FULL_NAME = "江苏嵘泰工业股份有限公司"
          CODE = "605133"
          PREPARED = "2026-11-05"
          ROOT_NAME = "嵘泰股份_605133_所有年报_招股说明书及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def compact(value: str) -> str:
              return re.sub(r"\s+", "", value or "")

          def fetch_html(url: str) -> tuple[str, str]:
              response = session.get(url, timeout=(30, 240), allow_redirects=True)
              print("HTML", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
              response.raise_for_status()
              response.encoding = response.apparent_encoding or "gbk"
              return response.text, response.url

          def query_id(url: str) -> int:
              parsed = urlparse(url)
              values = parse_qs(parsed.query).get("id", [])
              if values and str(values[0]).isdigit():
                  return int(values[0])
              match = re.search(r"(?:[?&]id=)(\d+)", url)
              return int(match.group(1)) if match else 0

          def extract_sina_download(detail_url: str) -> str:
              html, final_url = fetch_html(detail_url)
              soup = BeautifulSoup(html, "lxml")
              candidates: list[str] = []
              for anchor in soup.find_all("a", href=True):
                  text = compact(anchor.get_text(" ", strip=True))
                  href = urljoin(final_url, anchor["href"])
                  if "下载公告" in text or "file.finance.sina.com.cn" in href or href.lower().endswith(".pdf"):
                      candidates.append(href)
              for match in re.findall(r"https?://[^\s\"'<>]+", html):
                  candidate = match.replace("&amp;", "&")
                  if "file.finance.sina.com.cn" in candidate or candidate.lower().endswith(".pdf"):
                      candidates.append(candidate)
              for candidate in dict.fromkeys(candidates):
                  if "file.finance.sina.com.cn" in candidate or candidate.lower().endswith(".pdf"):
                      print("DETAIL_PDF", candidate)
                      return candidate
              raise RuntimeError(f"No downloadable PDF found on {detail_url}")

          def date_from_url(url: str) -> str:
              match = re.search(r"/(20\d{2}-\d{2}-\d{2})/", url)
              return match.group(1) if match else ""

          def annual_candidates() -> list[dict]:
              list_urls = [
                  "https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/605133/page_type/ndbg.phtml",
                  "https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/605133/page_type/ndbg.phtml",
                  "https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/605133.phtml?ftype=ndbg",
              ]
              collected: list[dict] = []
              for list_url in list_urls:
                  try:
                      html, final_url = fetch_html(list_url)
                  except Exception as exc:
                      print("LIST_ERROR", list_url, repr(exc))
                      continue
                  soup = BeautifulSoup(html, "lxml")
                  for anchor in soup.find_all("a", href=True):
                      title = " ".join(anchor.get_text(" ", strip=True).split())
                      title_compact = compact(title)
                      if "年度报告" not in title_compact or "摘要" in title_compact:
                          continue
                      match = re.search(r"(2020|2021|2022|2023|2024|2025)(?:年)?年度报告", title_compact)
                      if not match:
                          continue
                      href = urljoin(final_url, anchor["href"])
                      if "BulletinDetail" not in href:
                          continue
                      item_id = query_id(href)
                      if not item_id:
                          continue
                      collected.append({
                          "year": int(match.group(1)),
                          "title": title,
                          "compact_title": title_compact,
                          "detail_url": href,
                          "item_id": item_id,
                      })
              dedup: dict[int, dict] = {}
              for item in collected:
                  dedup[item["item_id"]] = item
              rows = list(dedup.values())
              print("ANNUAL_CANDIDATES", len(rows))
              for row in sorted(rows, key=lambda x: (x["year"], x["item_id"]), reverse=True):
                  print("ANNUAL_ROW", row["year"], row["item_id"], row["title"], row["detail_url"])
              return rows

          def pick_annual(rows: list[dict], year: int) -> dict:
              candidates = [row for row in rows if row["year"] == year]
              if not candidates:
                  raise RuntimeError(f"No annual report candidate found for {year}")

              def score(row: dict) -> tuple[int, int]:
                  title = row["compact_title"]
                  revision = 3 if any(word in title for word in ["更正后", "更新后", "修订后", "修正版"]) else 0
                  return revision, row["item_id"]

              chosen = max(candidates, key=score)
              print("ANNUAL_PICK", year, chosen["item_id"], chosen["title"], chosen["detail_url"])
              return chosen

          rows = annual_candidates()
          documents: list[dict] = []
          for sequence, year in enumerate(range(2020, 2026), start=1):
              row = pick_annual(rows, year)
              direct_url = extract_sina_download(row["detail_url"])
              revised = any(word in row["compact_title"] for word in ["更正后", "更新后", "修订后", "修正版"])
              period = f"{year}年年度报告（更正或更新版）" if revised else f"{year}年年度报告"
              documents.append({
                  "sequence": sequence,
                  "category": "年度报告",
                  "period": period,
                  "year": year,
                  "announcement_date": date_from_url(direct_url),
                  "filename": f"{sequence:02d}_{period}.pdf",
                  "minimum_pages": 100,
                  "detail_url": row["detail_url"],
                  "urls": [direct_url, direct_url.replace("http://", "https://", 1)],
                  "required_markers": [str(year), "年度报告"],
              })

          prospectus_list_url = "https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/605133.phtml?ftype=zgsmsyxs"
          prospectus_detail = ""
          prospectus_direct = "https://pdf.dfcfw.com/pdf/H2_AN202102021457271118_1.pdf"
          try:
              html, final_url = fetch_html(prospectus_list_url)
              soup = BeautifulSoup(html, "lxml")
              candidates = []
              for anchor in soup.find_all("a", href=True):
                  title = " ".join(anchor.get_text(" ", strip=True).split())
                  title_compact = compact(title)
                  if "首次公开发行股票招股说明书" not in title_compact:
                      continue
                  if any(word in title_compact for word in ["摘要", "意向书", "申报稿"]):
                      continue
                  href = urljoin(final_url, anchor["href"])
                  if "BulletinDetail" in href:
                      candidates.append((query_id(href), href, title))
              if candidates:
                  _, prospectus_detail, prospectus_title = max(candidates, key=lambda x: x[0])
                  print("PROSPECTUS_PICK", prospectus_title, prospectus_detail)
                  prospectus_direct = extract_sina_download(prospectus_detail)
          except Exception as exc:
              print("PROSPECTUS_LIST_FALLBACK", repr(exc))

          documents.append({
              "sequence": 7,
              "category": "招股说明书",
              "period": "首次公开发行股票招股说明书（最终发行版）",
              "year": 2021,
              "announcement_date": "2021-02-02",
              "filename": "07_首次公开发行股票招股说明书_最终发行版.pdf",
              "minimum_pages": 300,
              "detail_url": prospectus_detail or prospectus_list_url,
              "urls": [
                  prospectus_direct,
                  "https://pdf.dfcfw.com/pdf/H2_AN202102021457271118_1.pdf",
              ],
              "required_markers": ["首次公开发行股票", "招股说明书"],
          })

          documents.append({
              "sequence": 8,
              "category": "季度报告",
              "period": "2026年第三季度报告",
              "year": 2026,
              "announcement_date": "2026-10-30",
              "filename": "08_2026年第三季度报告.pdf",
              "minimum_pages": 5,
              "detail_url": "https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=605133",
              "urls": [
                  "https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/605133_20261030_DP4H.pdf",
                  "http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/605133_20261030_DP4H.pdf",
              ],
              "required_markers": ["2026年第三季度报告"],
          })

          accepted_issuer_markers = [CODE, COMPANY, FULL_NAME, "江苏嵘泰工业", "RONGTAI"]

          def download_pdf(document: dict) -> tuple[bytes, str, str]:
              last_error: Exception | None = None
              variants: list[str] = []
              for url in document["urls"]:
                  variants.extend([url, url + ("&download=1" if "?" in url else "?download=1")])
              for url in dict.fromkeys(variants):
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 600),
                              allow_redirects=True,
                              headers={
                                  "Accept": "application/pdf,*/*;q=0.8",
                                  "Referer": document["detail_url"],
                              },
                          )
                          print("DOWNLOAD", document["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          if response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                              return response.content, response.url, response.headers.get("content-type", "")
                          last_error = RuntimeError(f"Not a valid PDF response: {response.content[:60]!r}")
                      except Exception as exc:
                          last_error = exc
                          print("DOWNLOAD_ERROR", document["period"], attempt, url, repr(exc))
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Download failed for {document['period']}: {last_error}")

          manifest: list[dict] = []
          for document in documents:
              data, source_url, content_type = download_pdf(document)
              path = PDF_DIR / document["filename"]
              path.write_bytes(data)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < document["minimum_pages"]:
                  raise RuntimeError(f"Document too short: {path.name}: {pages} pages")

              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {path.name}: {check.stdout}")

              text_parts = []
              ranges = [(1, min(20, pages))]
              if pages > 25:
                  ranges.append((max(1, pages - 3), pages))
              for first_page, last_page in ranges:
                  run = subprocess.run(
                      ["pdftotext", "-f", str(first_page), "-l", str(last_page), str(path), "-"],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                  )
                  text_parts.append(run.stdout)
              text_compact = compact("\n".join(text_parts))
              issuer_hits = [marker for marker in accepted_issuer_markers if compact(marker) in text_compact]
              required_hits = [marker for marker in document["required_markers"] if compact(marker) in text_compact]
              if not issuer_hits:
                  raise RuntimeError(f"Issuer validation failed for {path.name}")
              if not required_hits:
                  raise RuntimeError(f"Document type/period validation failed for {path.name}")

              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 6_000:
                  raise RuntimeError(f"Preview rendering failed for {path.name}: {render.stdout}")

              record = {
                  "sequence": document["sequence"],
                  "category": document["category"],
                  "period": document["period"],
                  "announcement_date": document["announcement_date"] or date_from_url(source_url),
                  "filename": document["filename"],
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": source_url,
                  "detail_url": document["detail_url"],
                  "content_type": content_type,
                  "issuer_marker_hits": issuer_hits,
                  "document_marker_hits": required_hits,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(record)
              print("VALIDATED", record["period"], record["announcement_date"], record["pages"], record["sha256"])

          if len(manifest) != 8:
              raise RuntimeError(f"Expected 8 documents, got {len(manifest)}")

          readme = [
              f"{FULL_NAME}（{CODE}.SH）全部年度报告、最终发行版招股说明书及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：上市后2020—2025年年度报告全文6份、首次公开发行股票招股说明书最终发行版1份，以及截至整理日最新独立季度报告——2026年第三季度报告1份。",
              "已排除年度报告摘要、招股说明书摘要、招股意向书、申报稿、半年度报告及其他非正文文件。",
              "如某年度存在更正、更新或修订版，本包优先采用公开披露时间较晚的替代版本。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   类型：{item['category']}；文件：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   公告或检索页面：{item['detail_url']}",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、报告期间/文档类型、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_文件清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "document_count": len(manifest),
              "annual_report_count": 6,
              "prospectus_count": 1,
              "latest_quarter": "2026年第三季度报告",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "类型", "文件", "公告日期", "文件名", "页数", "字节数", "SHA-256", "公告或检索页面", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["category"], item["period"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"],
                      item["detail_url"], item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("rongtai_605133_all_annual_prospectus_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 8:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 8")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "document_count": len(manifest),
              "annual_report_count": 6,
              "prospectus_count": 1,
              "latest_quarter": "2026年第三季度报告",
              "files": [{key: item[key] for key in ["category", "period", "announcement_date", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rongtai-605133-filings-20261105
          path: |
            rongtai_605133_all_annual_prospectus_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
