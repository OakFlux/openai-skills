name: South Precision Yanbaoke Fast Source Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_yanbaoke_fast_source_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public source links
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          ids=['9ZqeyWaMotixaPaLD9URUv','viNYkEYokEWS9s6k9cFXqM','Hhrz8rvYiCE9H2ymLXSG8Z']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for doc_id in ids:
            url=f'https://www.yanbaoke.com/info/{doc_id}'
            r=s.get(url,timeout=60); text=r.content.decode('utf-8','replace')
            print('\n===== DOC',doc_id,'STATUS',r.status_code,'BYTES',len(r.content),'=====')
            patterns=['__NUXT__','payload','reportInfo','fileUrl','pdfUrl','downloadUrl','preview','quzili','files2','pageCount','totalPage','attachments','formats','original','file_path','filePath']
            for pat in patterns:
              positions=[m.start() for m in re.finditer(re.escape(pat),text,re.I)]
              print('PATTERN',pat,'COUNT',len(positions))
              for pos in positions[:8]:
                print('SNIP',pat,text[max(0,pos-400):min(len(text),pos+1200)].replace('\n',' ')[:1700])
            urls=sorted(set(u.replace('\\/','/') for u in re.findall(r'https?://[^\"\'<>\\s]+',text)))
            hits=[u for u in urls if any(k in u.lower() for k in ['quzili','pdf','download','file','preview',doc_id.lower()])]
            print('URL_HITS',json.dumps(hits,ensure_ascii=False,indent=2))
          PY
