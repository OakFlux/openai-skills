name: Package two verified Hengbo 301225 reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hengbo-301225-broker-2reports-fast-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, shutil, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          REPORTS=[
            {'broker':'华鑫证券','date':'2025-11-23','title':'公司动态研究报告：汽摩进气系统领军企业，积极开拓成长新曲线','analysts':'林子健','rating':'买入（首次）','type':'公司动态研究/首次覆盖','url':'https://pdf.dfcfw.com/pdf/H3_AP202511241787234946_1.pdf','pages':7,'code':'AP202511241787234946'},
            {'broker':'华金证券','date':'2023-05-29','title':'新股覆盖研究：恒勃股份','analysts':'李蕙','rating':'未评级','type':'新股覆盖研究','url':'https://pdf.dfcfw.com/pdf/H3_AP202305311587369843_1.pdf','pages':11,'code':'AP202305311587369843'},
          ]
          ROOT=Path('恒勃股份_301225_券商深度与覆盖报告_完整版_2份_截至20261028')
          PDF=ROOT/'PDF原文'; PREV=ROOT/'首页预览'; PDF.mkdir(parents=True); PREV.mkdir(parents=True)
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          def compact(x): return re.sub(r'\s+','',str(x or '')).lower()
          def safe(x): return re.sub(r'[\\/:*?"<>|]+','_',str(x)).strip()[:100]
          manifest=[]
          for i,rpt in enumerate(REPORTS,1):
            data=None; meta={}
            for attempt in range(5):
              try:
                res=s.get(rpt['url'],headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'},timeout=(30,240),allow_redirects=True)
                meta={'status':res.status_code,'final_url':res.url,'content_type':res.headers.get('content-type',''),'bytes':len(res.content)}
                if res.status_code==200 and res.content[:5]==b'%PDF-' and len(res.content)>70000:
                  data=res.content; break
              except Exception as exc: meta={'error':repr(exc)}
              time.sleep(1+attempt)
            if data is None: raise RuntimeError(f"download failed {rpt['url']} {meta}")
            name=f"{i:02d}_{rpt['broker']}_恒勃股份_{safe(rpt['title'])}_{rpt['date']}.pdf"
            dest=PDF/name; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages!=rpt['pages']: raise RuntimeError(f'page mismatch {name}: {pages}!={rpt["pages"]}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages)
            c=compact(text)
            if not any(compact(k) in c for k in ['恒勃股份','恒勃控股股份有限公司','301225']): raise RuntimeError(f'issuer mismatch {name}')
            if compact(rpt['broker'].replace('证券','')) not in c: raise RuntimeError(f'broker mismatch {name}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            pref=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-singlefile','-png','-r','140',str(dest),str(pref)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            img=Path(str(pref)+'.png')
            if not img.exists() or img.stat().st_size<10000: raise RuntimeError(f'render failed {name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**rpt,'filename':name,'actual_pages':pages,'bytes':len(data),'sha256':sha,'download_meta':meta,'source_page':f"https://data.eastmoney.com/report/info/{rpt['code']}.html",'preview_file':str(Path('首页预览')/img.name),'validation':['PDF header','issuer identity','broker identity','exact page count','qpdf structure','first-page render']})
          readme=['恒勃控股股份有限公司（301225.SZ）券商深度与覆盖报告资料包','整理基准日：2026-10-28','','本包收录2份公开可直接取得并通过全文核验的券商原始完整PDF。','其中1份为公司动态研究/首次覆盖，1份为新股覆盖研究；未使用季报、年报或事件短评凑数。','']
          for i,m in enumerate(manifest,1):
            readme += [f"{i}. {m['broker']}：《{m['title']}》",f"   类型：{m['type']}；日期：{m['date']}；分析师：{m['analysts']}；评级：{m['rating']}",f"   完整页数：{m['actual_pages']}页；来源页面：{m['source_page']}",f"   SHA-256：{m['sha256']}",'']
          readme += ['报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、公司身份、券商身份、准确页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')
          CN=Path('恒勃股份_301225_券商深度与覆盖报告_完整版_2份_截至20261028.zip')
          with zipfile.ZipFile(CN,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(CN) as z:
            if z.testzip() or sum(n.lower().endswith('.pdf') for n in z.namelist())!=2: raise RuntimeError('zip validation failed')
          EN=Path('hengbo_301225_broker_reports_2.zip'); shutil.copy2(CN,EN)
          print('FINAL_ZIP',CN,CN.stat().st_size,'SHA256',hashlib.sha256(CN.read_bytes()).hexdigest(),flush=True)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hengbo-301225-broker-2reports-final-20261028
          path: |
            恒勃股份_301225_券商深度与覆盖报告_完整版_2份_截至20261028.zip
            hengbo_301225_broker_reports_2.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
