name: Build final Ningbo Port broker report package 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-final-report-package-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pillow img2pdf pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader, PdfWriter

          ROOT = Path('work')
          RAW = ROOT / 'raw'
          IMG = ROOT / 'images'
          FINAL = ROOT / '宁波港_601018_券商深度报告_3份'
          OUT = Path('artifact_out')
          for p in (RAW, IMG, FINAL, OUT):
              p.mkdir(parents=True, exist_ok=True)

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/pdf,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
          })

          def download(url: str, target: Path, referer: str, min_bytes: int = 20000) -> dict:
              last = None
              for attempt in range(1, 5):
                  try:
                      r = s.get(url, headers={'Referer': referer}, timeout=(20, 120), allow_redirects=True)
                      print('GET', attempt, r.status_code, len(r.content), r.headers.get('content-type'), url, 'FINAL', r.url, flush=True)
                      if r.status_code == 200 and len(r.content) >= min_bytes:
                          target.write_bytes(r.content)
                          return {'source_url': url, 'final_url': r.url, 'bytes': len(r.content), 'content_type': r.headers.get('content-type')}
                      last = RuntimeError(f'HTTP {r.status_code}, {len(r.content)} bytes')
                  except Exception as exc:
                      last = exc
                  time.sleep(attempt * 1.5)
              raise RuntimeError(f'download failed: {url}: {last!r}')

          def add_metadata(src: Path, dst: Path, title: str, author: str, subject: str) -> None:
              reader = PdfReader(str(src), strict=False)
              writer = PdfWriter()
              for page in reader.pages:
                  writer.add_page(page)
              writer.add_metadata({'/Title': title, '/Author': author, '/Subject': subject, '/Creator': 'Public page-image PDF compilation'})
              with dst.open('wb') as f:
                  writer.write(f)

          def validate_pdf(path: Path, expected_pages: int | None = None) -> dict:
              if not path.read_bytes().startswith(b'%PDF-'):
                  raise RuntimeError(f'not PDF: {path}')
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if expected_pages is not None and pages != expected_pages:
                  raise RuntimeError(f'page mismatch {path}: {pages} != {expected_pages}')
              q = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if q.returncode not in (0, 3):
                  raise RuntimeError('qpdf failed: ' + q.stderr[-1000:])
              data = path.read_bytes()
              return {'pages': pages, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}

          records = []

          # Current full original PDF from the report publisher's public mirror.
          current_name = '01_2026-09-01_西南证券_首次覆盖_打造世界级港口集群_主营业务利润稳健.pdf'
          current_raw = RAW / 'current.pdf'
          current_url = 'https://pdf.dfcfw.com/pdf/H3_AP202609011828891233_1.pdf'
          try:
              dl = download(current_url, current_raw, 'https://data.eastmoney.com/report/info/AP202609011828891233.html', 50000)
              val = validate_pdf(current_raw, 12)
              shutil.copy2(current_raw, FINAL / current_name)
              records.append({
                  'filename': current_name,
                  'broker': '西南证券',
                  'date': '2026-09-01',
                  'title': '2026年半年报点评：打造世界级港口集群，主营业务利润稳健',
                  'authors': ['胡光怿', '杨蕊'],
                  'format': '原始PDF',
                  'source_page': 'https://data.eastmoney.com/report/info/AP202609011828891233.html',
                  **dl, **val,
              })
          except Exception as exc:
              print('CURRENT_ERR', repr(exc), flush=True)

          # Older long-form reports. The public source exposes complete high-resolution page images;
          # compile them losslessly into PDFs when all pages are present.
          image_reports = [
              {
                  'order': '02', 'doc_id': '118940', 'date_path': '2017/10/10', 'date': '2017-10-10',
                  'pages': 21, 'broker': '安信证券', 'authors': ['胡光怿'],
                  'title': '宁波港公司深度分析：非凡大港斩获殊勋茂绩，多重政策催发上行量能',
                  'filename': '02_2017-10-10_安信证券_公司深度分析_非凡大港斩获殊勋茂绩.pdf',
              },
              {
                  'order': '03', 'doc_id': '1690672', 'date_path': '2013/02/04', 'date': '2013-02-04',
                  'pages': 17, 'broker': '中泰证券', 'authors': ['李周'],
                  'title': '守正出奇的综合港口物流运营商',
                  'filename': '03_2013-02-04_中泰证券_守正出奇的综合港口物流运营商.pdf',
              },
              {
                  'order': '04', 'doc_id': '1608827', 'date_path': '2010/09/15', 'date': '2010-09-15',
                  'pages': 29, 'broker': '国金证券', 'authors': ['李光华'],
                  'title': '腹地资源＋水深优势成就国际综合大港',
                  'filename': '04_2010-09-15_国金证券_腹地资源与水深优势成就国际综合大港.pdf',
              },
          ]

          compiled = []
          for spec in image_reports:
              doc_dir = IMG / spec['doc_id']
              doc_dir.mkdir(parents=True, exist_ok=True)
              image_files = []
              okay = True
              for page_no in range(1, spec['pages'] + 1):
                  url = f"https://public.fxbaogao.com/report-image/{spec['date_path']}/{spec['doc_id']}-{page_no}.png"
                  target = doc_dir / f'{page_no:03d}.png'
                  try:
                      download(url, target, f"https://www.fxbaogao.com/view?id={spec['doc_id']}", 8000)
                      with Image.open(target) as im:
                          im.verify()
                      image_files.append(target)
                  except Exception as exc:
                      print('IMAGE_ERR', spec['doc_id'], page_no, repr(exc), flush=True)
                      okay = False
                      break
              if not okay or len(image_files) != spec['pages']:
                  continue
              tmp_pdf = RAW / f"{spec['doc_id']}_tmp.pdf"
              final_pdf = FINAL / spec['filename']
              with tmp_pdf.open('wb') as f:
                  f.write(img2pdf.convert([str(p) for p in image_files]))
              add_metadata(tmp_pdf, final_pdf, spec['title'], spec['broker'], '宁波港（601018）券商研究报告；由公开高清页面无损合成')
              val = validate_pdf(final_pdf, spec['pages'])
              rec = {
                  'filename': spec['filename'],
                  'broker': spec['broker'],
                  'date': spec['date'],
                  'title': spec['title'],
                  'authors': spec['authors'],
                  'format': '公开高清页面无损合成PDF（内容完整，非原始PDF容器）',
                  'source_page': f"https://www.fxbaogao.com/view?id={spec['doc_id']}",
                  'source_image_pattern': f"https://public.fxbaogao.com/report-image/{spec['date_path']}/{spec['doc_id']-{{page}}.png" if False else f"https://public.fxbaogao.com/report-image/{spec['date_path']}/{spec['doc_id']-PAGE.png",
                  **val,
              }
              compiled.append(rec)
              records.append(rec)
              print('COMPILED', json.dumps(rec, ensure_ascii=False), flush=True)
              if len(compiled) >= 2:
                  break

          # Public original fallback if fewer than two older long-form PDFs could be compiled.
          if len(records) < 3:
              fallback_name = '03_2023-11-07_太平洋证券_首次覆盖_收购大榭码头贡献第三季度业绩.pdf'
              fallback_raw = RAW / 'fallback.pdf'
              fallback_url = 'https://pdf.dfcfw.com/pdf/H3_AP202311071609246534_1.pdf'
              try:
                  dl = download(fallback_url, fallback_raw, 'https://data.eastmoney.com/report/info/AP202311071609246534.html', 30000)
                  val = validate_pdf(fallback_raw, 4)
                  shutil.copy2(fallback_raw, FINAL / fallback_name)
                  records.append({
                      'filename': fallback_name,
                      'broker': '太平洋证券',
                      'date': '2023-11-07',
                      'title': '2023年Q3点评，收购大榭码头，贡献第三季度业绩',
                      'authors': ['程志峰'],
                      'format': '原始PDF（短篇首次覆盖）',
                      'source_page': 'https://data.eastmoney.com/report/info/AP202311071609246534.html',
                      **dl, **val,
                  })
              except Exception as exc:
                  print('FALLBACK_ERR', repr(exc), flush=True)

          # Keep the best three: current original + two longest older deep reports, or fallback.
          current = [r for r in records if r['date'] == '2026-09-01']
          older = [r for r in records if r['date'] != '2026-09-01']
          older.sort(key=lambda r: (0 if '短篇' in r.get('format','') else 1, r['pages']), reverse=True)
          selected = (current + older)[:3]
          selected_names = {r['filename'] for r in selected}
          for p in list(FINAL.glob('*.pdf')):
              if p.name not in selected_names:
                  p.unlink()
          if len(selected) < 2:
              raise RuntimeError(f'Only {len(selected)} usable reports were obtained')

          lines = [
              '宁波港（601018.SH，宁波舟山港股份有限公司）券商研究报告精选',
              '整理日期：2026-09-28',
              '',
              '筛选原则：优先公司深度、首次覆盖和长篇专题；排除仅有摘要、网页节选和财报正文。',
              '格式说明：标注“原始PDF”的文件保持公开源PDF；标注“公开高清页面无损合成PDF”的文件由同一公开报告的全部高清页图按原页序合成，内容完整，但PDF容器并非券商原始文件。',
              '',
              '文件清单：',
          ]
          for i, r in enumerate(selected, 1):
              lines += [
                  f'{i}. {r["filename"]}',
                  f'   券商：{r["broker"]}；日期：{r["date"]}；页数：{r["pages"]}',
                  f'   标题：{r["title"]}',
                  f'   格式：{r["format"]}',
                  f'   来源页：{r["source_page"]}',
                  f'   SHA-256：{r["sha256"]}',
                  '',
              ]
          lines += ['完整性核验：PDF文件头、实际页数、qpdf结构、首末页存在性、SHA-256及ZIP CRC均已检查。']
          (FINAL / '00_文件清单与来源说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (FINAL / 'manifest.json').write_text(json.dumps(selected, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in selected), encoding='utf-8')

          package_name = f'宁波港_601018_券商深度报告_{len(selected)}份'
          zip_path = OUT / f'{package_name}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(FINAL.iterdir()):
                  zf.write(p, arcname=f'{package_name}/{p.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != len(selected):
                  raise RuntimeError(f'ZIP PDF count mismatch {len(pdfs)} != {len(selected)}')
          print('SELECTED', json.dumps(selected, ensure_ascii=False, indent=2), flush=True)
          print('ZIP', zip_path, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
