name: Probe official Quantgroup broker sources 20260919
on:
  push:
    paths:
      - '.github/workflows/quantgroup-official-broker-probe-20260919.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install
        run: python -m pip install --quiet selenium requests beautifulsoup4 lxml
      - name: Inspect official broker pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json,re,time,html
          from pathlib import Path
          from urllib.parse import urljoin,quote
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.common.exceptions import TimeoutException

          out=Path('qg_official_probe'); out.mkdir(exist_ok=True)
          pages=[
            ('sdic_tag','https://www.sdicsi.com.hk/cn/research-report/tag/2685hk-ipo'),
            ('sdic_zh_tag','https://www.sdicsi.com.hk/zh/research-report/tag/2685hk-ipo'),
            ('gy_home','https://www.gyzq.com.hk/'),
            ('gy_search_bing','https://www.bing.com/search?q='+quote('site:gyzq.com.hk 量化派 2685 IPO申购指南')),
            ('fx_sdic','https://www.fxbaogao.com/detail/5156999'),
            ('fx_gy','https://www.fxbaogao.com/detail/5156468'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for i,(name,url) in enumerate(pages,1):
            try:
              r=s.get(url,timeout=(15,50),allow_redirects=True)
              print('\nREQ',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              (out/f'{i:02d}_{name}.html').write_bytes(r.content)
              text=r.text; soup=BeautifulSoup(text,'lxml')
              rec={'name':name,'input':url,'status':r.status_code,'final':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':[], 'scripts':[]}
              for tag in soup.find_all(['a','script','iframe','embed','object','img','form','button']):
                for attr in ('href','src','data','data-src','action','onclick','data-url','data-file','download'):
                  v=tag.get(attr)
                  if not v: continue
                  v=html.unescape(str(v)).replace('\\/','/')
                  u=urljoin(r.url,v) if not v.lower().startswith('javascript:') else v
                  item={'tag':tag.name,'attr':attr,'url':u,'text':re.sub(r'\s+',' ',tag.get_text(' ',strip=True))[:400]}
                  rec['links'].append(item)
                  if tag.name=='script' and attr=='src': rec['scripts'].append(u)
                  low=(u+' '+item['text']).lower()
                  if any(k in low for k in ('pdf','量化派','2685','02685','ipo評分','ipo评分','申购指南','download','report','research','5156999','5156468')):
                    print('LINK',name,json.dumps(item,ensure_ascii=False)[:3000],flush=True)
              # regex URLs and likely file paths
              vals=set()
              for pat in [r'https?://[^\s"\'<>]+',r'["\']([^"\']+\.(?:pdf|PDF)(?:\?[^"\']*)?)["\']',r'(?:file|pdf|download|report|attachment|url|path)\s*[:=]\s*["\']([^"\']+)["\']']:
                for m in re.finditer(pat,text,re.I):
                  v=(m.group(1) if m.lastindex else m.group(0)).replace('\\/','/')
                  if any(k in v.lower() for k in ('pdf','2685','02685','5156999','5156468','report','download','upload','research')): vals.add(urljoin(r.url,v))
              rec['regex']=sorted(vals)
              for v in rec['regex']: print('REGEX',name,v[:2500],flush=True)
              (out/f'{i:02d}_{name}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
            except Exception as e: print('REQERR',name,repr(e),flush=True)

          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--disable-gpu'); opts.add_argument('--window-size=1440,2200'); opts.page_load_strategy='eager'; opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          dl=(out/'downloads').resolve(); dl.mkdir(exist_ok=True)
          opts.add_experimental_option('prefs',{'download.default_directory':str(dl),'download.prompt_for_download':False,'plugins.always_open_pdf_externally':True})
          d=webdriver.Chrome(options=opts); d.set_page_load_timeout(30); d.execute_cdp_cmd('Network.enable',{}); d.execute_cdp_cmd('Page.setDownloadBehavior',{'behavior':'allow','downloadPath':str(dl)})
          for i,(name,url) in enumerate(pages,1):
            if name=='gy_search_bing': continue
            rec={'name':name,'input':url,'network':[],'dom':[],'clicks':[],'errors':[]}
            try:
              try:d.get(url)
              except TimeoutException: print('TIMEOUT',name,flush=True)
              time.sleep(6); rec['title']=d.title; rec['final']=d.current_url
              src=d.page_source; (out/f'{i:02d}_{name}_browser.html').write_text(src,encoding='utf-8'); d.save_screenshot(str(out/f'{i:02d}_{name}.png'))
              print('\nBROWSER',name,d.title,d.current_url,len(src),flush=True)
              def collect(label):
                for z in d.get_log('performance'):
                  try:
                    m=json.loads(z['message'])['message'];
                    if m['method'] not in ('Network.responseReceived','Network.requestWillBeSent'): continue
                    p=m['params']; obj=p.get('response') or p.get('request') or {}; u=obj.get('url',''); mime=obj.get('mimeType',''); low=(u+' '+mime).lower()
                    if any(k in low for k in ('pdf','2685','02685','5156999','5156468','download','report','research','attachment','file','api','upload')):
                      item={'label':label,'method':m['method'],'url':u,'mime':mime,'status':obj.get('status'),'type':p.get('type')}; rec['network'].append(item); print('NET',name,json.dumps(item,ensure_ascii=False)[:2500],flush=True)
                  except Exception: pass
              collect('initial')
              for el in d.find_elements(By.XPATH,'//*[self::a or self::button or self::div or self::span or self::li]'):
                try:
                  txt=(el.text or '').strip(); href=el.get_attribute('href') or ''; outer=el.get_attribute('outerHTML') or ''; low=(txt+' '+href+' '+outer).lower()
                  if any(k in low for k in ('量化派','ipo評分 4.1','ipo评分 4.1','ipo申购指南','下载','download','.pdf')):
                    item={'tag':el.tag_name,'text':txt[:500],'href':href,'outer':outer[:3000]}; rec['dom'].append(item); print('DOM',name,json.dumps(item,ensure_ascii=False)[:3500],flush=True)
                except Exception: pass
              # click public report titles/download anchors only
              xps=["//*[contains(normalize-space(.),'量化派(2685.HK) IPO')]","//*[contains(normalize-space(.),'量化派') and (self::a or self::button)]","//*[contains(normalize-space(.),'点击免费查看完整报告')]","//*[contains(normalize-space(.),'下載')]","//*[contains(normalize-space(.),'下载')]","//a[contains(@href,'.pdf')]"]
              seen=set()
              for xp in xps:
                for el in d.find_elements(By.XPATH,xp)[:4]:
                  try:
                    if not el.is_displayed(): continue
                    outer=el.get_attribute('outerHTML') or ''
                    if outer in seen: continue
                    seen.add(outer); txt=(el.text or '').strip(); before=d.current_url
                    # do not click login/account buttons
                    if any(k in (txt+' '+outer).lower() for k in ('登入交易','login','开户','開戶')): continue
                    print('CLICK',name,txt[:300],outer[:1800],flush=True)
                    d.execute_script("arguments[0].scrollIntoView({block:'center'});",el); time.sleep(.5); d.execute_script('arguments[0].click();',el); time.sleep(5)
                    after=d.current_url; rec['clicks'].append({'text':txt,'outer':outer[:3000],'before':before,'after':after}); print('AFTER',name,after,flush=True); collect('after')
                    if after!=before:
                      try:d.back(); time.sleep(3)
                      except Exception: pass
                  except Exception as e: rec['errors'].append(repr(e))
            except Exception as e: rec['errors'].append(repr(e)); print('BERR',name,repr(e),flush=True)
            (out/f'{i:02d}_{name}_browser.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          d.quit()
          print('DOWNLOADS')
          for p in sorted(dl.glob('*')): print(p.name,p.stat().st_size,flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-official-broker-probe-20260919
          path: qg_official_probe
          retention-days: 7
          compression-level: 6
