name: Fast query Shanghai Jiubai company reports

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-600838-company-report-fast-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet requests
      - name: Query exact company code and name
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=600838'})
          api='https://reportapi.eastmoney.com/report/list'
          for code in ['600838','SH600838','上海九百']:
            for qtype in ['0','1','2']:
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2026-10-21','pageNo':'1','fields':'','qType':qtype,'orgCode':'','author':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              r=s.get(api,params=p,timeout=(20,120)); print('QUERY',code,qtype,'HTTP',r.status_code,'BYTES',len(r.content),r.url)
              if r.status_code!=200:continue
              payload=r.json();data=payload.get('data') or []
              if isinstance(data,dict):data=data.get('list') or data.get('data') or []
              print('RESULT',code,qtype,'HITS',payload.get('hits'),'TOTALPAGE',payload.get('TotalPage'),'COUNT',len(data))
              print(json.dumps([{k:x.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']} for x in data],ensure_ascii=False,indent=2))
          PY
