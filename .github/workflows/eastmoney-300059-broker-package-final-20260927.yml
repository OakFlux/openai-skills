name: Package Eastmoney 300059 broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/eastmoney-300059-broker-package-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '东方财富_300059_券商深度报告_合集'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)
          temp = Path('_candidate_pdfs')
          temp.mkdir(exist_ok=True)

          # 按优先级排列。前三份均为东方财富公司专项研究；第四份仅在前三份有文件失效时备用。
          candidates = [
              {
                  'filename': '01_太平洋证券_东方财富_从轻资产新贵走向传统龙头_2023-07-30.pdf',
                  'broker': '太平洋证券',
                  'title': '从轻资产新贵走向传统龙头——为何认为东方财富今年有重估机会？',
                  'date': '2023-07-30',
                  'report_type': '公司深度报告',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202308011592973081_1.pdf',
                  'min_pages': 40,
                  'broker_terms': ['太平洋证券'],
                  'title_terms_any': ['从轻资产新贵', '传统龙头', '重估机会'],
                  'target_terms': ['东方财富', '300059'],
                  'target_min_count': 20,
                  'scope_note': '东方财富公司专项深度报告，系统讨论证券、基金代销、流量变现、盈利与估值重估逻辑。',
              },
              {
                  'filename': '02_长城证券_东方财富_着力打造互联网金融平台生态圈_2018-12-05.pdf',
                  'broker': '长城证券',
                  'title': '着力打造互联网金融平台生态圈，规模与范围经济优势逐步凸显',
                  'date': '2018-12-05',
                  'report_type': '公司深度报告',
                  'url': 'https://img3.gelonghui.com/pdf201812/pdf20181207152236178.pdf',
                  'min_pages': 45,
                  'broker_terms': ['长城证券'],
                  'title_terms_any': ['互联网金融平台生态圈', '规模与范围经济', '范围经济优势'],
                  'target_terms': ['东方财富', '300059'],
                  'target_min_count': 20,
                  'scope_note': '东方财富公司专项深度报告，覆盖互联网金融平台、基金代销、证券零售、流量与成本优势及综合金融布局。',
              },
              {
                  'filename': '03_东吴证券_东方财富_流量龙头蓄势待发_2017.pdf',
                  'broker': '东吴证券',
                  'title': '流量龙头，蓄势待发',
                  'date': '2017',
                  'report_type': '公司专项研究',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201704190526728064_1.pdf',
                  'min_pages': 8,
                  'broker_terms': ['东吴证券'],
                  'title_terms_any': ['流量龙头', '蓄势待发', '东方财富'],
                  'target_terms': ['东方财富', '300059'],
                  'target_min_count': 8,
                  'scope_note': '东方财富公司专项研究，重点分析流量资源、证券与基金业务及互联网金融平台成长空间。',
              },
              {
                  'filename': '04_华泰证券_金融科技专题_含东方财富专项分析_2019-09-16.pdf',
                  'broker': '华泰证券',
                  'title': '金融科技专题研究（含东方财富：打造财富管理平台专项章节）',
                  'date': '2019-09-16',
                  'report_type': '行业深度报告／东方财富专项章节',
                  'url': 'https://crm.htsc.com.cn/doc/2019/10720102/0acdeeb8-c617-47cd-a47a-7a724aa49ff4.pdf',
                  'min_pages': 50,
                  'broker_terms': ['华泰证券'],
                  'title_terms_any': ['东方财富', '财富管理平台'],
                  'target_terms': ['东方财富', '300059'],
                  'target_min_count': 10,
                  'scope_note': '备用行业深度报告，设有东方财富专项章节，用于补充公司平台模式、流量变现与财富管理逻辑。',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download_pdf(url: str, dest: Path) -> str:
              errors = []
              for attempt in range(1, 5):
                  part = dest.with_suffix('.part')
                  try:
                      with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as response:
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, 'final', response.url, flush=True)
                          response.raise_for_status()
                          with part.open('wb') as fh:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                          final_url = response.url
                      size = part.stat().st_size
                      head = part.read_bytes()[:8]
                      if size < 100_000 or not head.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF size={size}, head={head!r}')
                      part.replace(dest)
                      return final_url
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      part.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'download failed: {errors}')

          def validate(doc: dict, source_path: Path, final_url: str) -> dict:
              qcheck = subprocess.run(['qpdf', '--check', str(source_path)], capture_output=True, text=True)
              if qcheck.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed: {qcheck.stderr[-1500:]}')

              reader = PdfReader(str(source_path), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small: {pages} < {doc["min_pages"]}')

              page_texts = []
              for page in reader.pages:
                  try:
                      page_texts.append(page.extract_text() or '')
                  except Exception as exc:
                      page_texts.append(f'[EXTRACTION_ERROR {exc!r}]')
              compact = re.sub(r'\s+', '', '\n'.join(page_texts))

              if not any(re.sub(r'\s+', '', term) in compact for term in doc['broker_terms']):
                  raise RuntimeError('broker identity check failed')
              if not any(re.sub(r'\s+', '', term) in compact for term in doc['title_terms_any']):
                  raise RuntimeError('title/topic check failed')

              target_pages = []
              target_count = 0
              for page_no, text in enumerate(page_texts, 1):
                  cp = re.sub(r'\s+', '', text)
                  hits = sum(cp.count(re.sub(r'\s+', '', term)) for term in doc['target_terms'])
                  if hits:
                      target_pages.append(page_no)
                      target_count += hits
              if target_count < doc['target_min_count']:
                  raise RuntimeError(f'target relevance check failed: count={target_count}, pages={target_pages}')

              data = source_path.read_bytes()
              return {
                  'company': '东方财富信息股份有限公司（东方财富，300059.SZ）',
                  'broker': doc['broker'],
                  'title': doc['title'],
                  'report_date': doc['date'],
                  'report_type': doc['report_type'],
                  'scope_note': doc['scope_note'],
                  'pages': pages,
                  'target_term_hits': target_count,
                  'target_related_pages': target_pages,
                  'bytes': len(data),
                  'source': '公开可匿名下载的研报PDF',
                  'source_url': final_url,
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          records = []
          seen_hashes = set()
          failures = []
          for doc in candidates:
              if len(records) >= 3:
                  break
              candidate_path = temp / doc['filename']
              try:
                  final_url = download_pdf(doc['url'], candidate_path)
                  record = validate(doc, candidate_path, final_url)
                  if record['sha256'] in seen_hashes:
                      raise RuntimeError('duplicate PDF detected')
                  seen_hashes.add(record['sha256'])
                  final_name = doc['filename']
                  destination = out / final_name
                  candidate_path.replace(destination)
                  record['filename'] = final_name
                  records.append(record)
                  print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)
              except Exception as exc:
                  candidate_path.unlink(missing_ok=True)
                  failure = {'candidate': doc['filename'], 'error': repr(exc)}
                  failures.append(failure)
                  print('SKIPPED', json.dumps(failure, ensure_ascii=False), flush=True)

          if len(records) < 2:
              raise RuntimeError(f'only {len(records)} valid reports; failures={failures}')

          readme = [
              '东方财富信息股份有限公司（东方财富，300059.SZ）券商深度报告合集',
              '整理日期：2026-09-27',
              '',
              '收录说明：',
              '1. 仅收录可匿名公开下载、取得完整PDF并通过结构与正文核验的文件。',
              '2. 优先选择直接针对东方财富的公司深度或公司专项研究；若公开直链失效，才使用含东方财富独立专项章节的行业深度报告补位。',
              '3. 所有PDF均保留原始文件，不删页、不拼接、不重制。',
              f'4. 本次最终收录 {len(records)} 份；下载或核验失败的候选文件不会进入压缩包。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              related_pages = '、'.join(map(str, record['target_related_pages']))
              readme.extend([
                  f"{index}. {record['broker']}｜{record['title']}",
                  f"   类型：{record['report_type']}",
                  f"   日期：{record['report_date']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MiB",
                  f"   东方财富相关页码（PDF页序）：{related_pages}；关键词命中：{record['target_term_hits']}次",
                  f"   说明：{record['scope_note']}",
                  f"   文件：{record['filename']}",
                  f"   原始来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])
          if failures:
              readme.extend(['未收录候选及原因：'])
              for failure in failures:
                  readme.append(f"- {failure['candidate']}：{failure['error']}")
              readme.append('')
          readme.extend([
              '完整性核验项目：PDF文件头、文件大小、实际页数、qpdf结构检查、券商名称、标题/主题关键词、目标公司相关性、重复哈希检查及SHA-256。',
              '用途说明：仅供个人研究与学习参考，请以各报告原文的免责声明和风险提示为准。',
          ])

          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps({'reports': records, 'failed_candidates': failures}, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          pdf_count = len(list(out.glob('*.pdf')))
          if pdf_count != len(records):
              raise RuntimeError(f'PDF count mismatch: files={pdf_count}, records={len(records)}')
          print('FINAL_PACKAGE', PACKAGE, 'PDF_COUNT', len(records), 'TOTAL_BYTES', sum(r['bytes'] for r in records), flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: eastmoney-300059-broker-reports-final
          path: 东方财富_300059_券商深度报告_合集/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
