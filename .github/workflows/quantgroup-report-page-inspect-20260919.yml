name: Inspect Quantgroup broker report download endpoints 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-report-page-inspect-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect pages, scripts and common endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, quote
          import requests
          from bs4 import BeautifulSoup

          out=Path('quantgroup_page_inspect'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Accept':'text/html,application/xhtml+xml,application/json,application/pdf,*/*;q=0.8'})
          pages=[
            ('microbell','https://www.microbell.com/repinfodetail_5329571.html'),
            ('fxbaogao','https://www.fxbaogao.com/detail/5553065'),
            ('vzkoo_search','https://www.vzkoo.com/search?keyword='+quote('量化派 从线上消费平台到物理AI场景赋能者')),
            ('bing_exact1','https://www.bing.com/search?q='+quote('"AI战略发展赋能线上消费基本盘" PDF')),
            ('bing_exact2','https://www.bing.com/search?q='+quote('"从线上消费平台到物理AI场景赋能者" PDF')),
            ('jina_bing1','https://r.jina.ai/http://www.bing.com/search?q='+quote('"AI战略发展赋能线上消费基本盘" PDF')),
            ('jina_bing2','https://r.jina.ai/http://www.bing.com/search?q='+quote('"从线上消费平台到物理AI场景赋能者" PDF')),
          ]
          all_urls=[]
          for i,(name,url) in enumerate(pages,1):
            try:
              r=s.get(url,timeout=(25,120),allow_redirects=True)
              print('\nPAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              (out/f'{i:02d}_{name}.html').write_bytes(r.content)
              text=r.text
              soup=BeautifulSoup(text,'lxml')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              print('TITLE',title,flush=True)
              scripts=[]; links=[]
              for tag in soup.find_all(['a','script','iframe','embed','object','link','source','button']):
                for attr in ('href','src','data','data-src','data-url','data-file','download','onclick','action'):
                  val=tag.get(attr)
                  if not val: continue
                  val=html.unescape(str(val)).replace('\\/','/')
                  absu=urljoin(r.url,val) if not val.lower().startswith(('javascript:','onclick:')) else val
                  links.append((tag.name,attr,absu,tag.get_text(' ',strip=True)[:180]))
                  if tag.name=='script' and attr=='src' and absu.startswith('http'): scripts.append(absu)
              # Regex URL and key/value extraction
              pats=[
                r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                r'https?://[^\s"\'<>]+',
                r'(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|reportUrl|report_url|downUrl|down_url|url|path)\s*[:=]\s*["\']([^"\']+)["\']',
                r'["\']([^"\']*(?:download|down|pdf|file|report|attachment|preview|repinfo)[^"\']*)["\']',
              ]
              candidates=set()
              for _,_,u,_ in links: candidates.add(u)
              for pat in pats:
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v).replace('\\/','/')
                  candidates.add(urljoin(r.url,v))
              interesting=[]
              for ln in text.splitlines():
                low=ln.lower()
                if any(k in low for k in ('download','下载','pdf','reportid','report_id','repinfo','fileid','file_id','preview','attachment','oss','cos','cdn','5329571','5553065')):
                  z=re.sub(r'\s+',' ',ln).strip()
                  if z and len(z)<8000: interesting.append(z)
              rec={'name':name,'input':url,'status':r.status_code,'final':r.url,'title':title,'links':links,'candidates':sorted(candidates),'interesting':interesting[:1000],'scripts':scripts}
              (out/f'{i:02d}_{name}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
              print('INTERESTING_START',name)
              for z in interesting[:120]: print(z[:1500],flush=True)
              print('CANDIDATES_START',name)
              for u in sorted(candidates):
                low=u.lower()
                if any(k in low for k in ('pdf','download','down','file','report','repinfo','preview','attachment','5329571','5553065')):
                  print('CAND',u,flush=True)
                  all_urls.append((name,u))
              print('CANDIDATES_END',name)
              # Fetch JS assets and grep likely endpoint strings
              for j,su in enumerate(dict.fromkeys(scripts)):
                if j>=30: break
                try:
                  sr=s.get(su,timeout=(20,90),allow_redirects=True)
                  if sr.status_code==200 and len(sr.content)<10_000_000:
                    fn=out/f'{i:02d}_{name}_script_{j:02d}.js'; fn.write_bytes(sr.content)
                    st=sr.text
                    hits=[]
                    for ln in st.splitlines():
                      low=ln.lower()
                      if any(k in low for k in ('download','pdfurl','fileurl','reportid','repinfo','preview','attachment')):
                        z=re.sub(r'\s+',' ',ln).strip()
                        if z and len(z)<6000: hits.append(z)
                    if hits:
                      print('JS',su,'HITS',len(hits),flush=True)
                      for h in hits[:40]: print('JSHIT',h[:1500],flush=True)
                except Exception as e: print('JSERR',su,repr(e),flush=True)
            except Exception as e:
              print('PAGEERR',name,url,repr(e),flush=True)

          # Probe common Microbell legacy download patterns.
          probes=[
            'https://www.microbell.com/repinfodown_5329571.html',
            'https://www.microbell.com/repinfodownload_5329571.html',
            'https://www.microbell.com/downrepinfo_5329571.html',
            'https://www.microbell.com/downloadrepinfo_5329571.html',
            'https://www.microbell.com/repinfo/download/5329571',
            'https://www.microbell.com/download/5329571',
            'https://www.microbell.com/repinfo/down?id=5329571',
            'https://www.microbell.com/downrepinfo.asp?id=5329571',
            'https://www.microbell.com/repinfodown.asp?id=5329571',
            'https://www.microbell.com/report/download?id=5329571',
            'https://www.microbell.com/api/report/download?id=5329571',
            'https://www.fxbaogao.com/api/report/download/5553065',
            'https://www.fxbaogao.com/download/5553065',
            'https://www.fxbaogao.com/detail/5553065/download',
          ]
          for name,u in all_urls:
            if u.startswith('http') and u not in probes: probes.append(u)
          results=[]
          for k,u in enumerate(dict.fromkeys(probes),1):
            try:
              rr=s.get(u,headers={'Referer':'https://www.microbell.com/repinfodetail_5329571.html' if 'microbell' in u else 'https://www.fxbaogao.com/detail/5553065'},timeout=(15,60),allow_redirects=True,stream=True)
              first=next(rr.iter_content(64),b'')
              rec={'url':u,'status':rr.status_code,'final':rr.url,'content_type':rr.headers.get('content-type'),'content_length':rr.headers.get('content-length'),'disposition':rr.headers.get('content-disposition'),'first_hex':first.hex(),'first_text':first[:40].decode('latin1','replace')}
              results.append(rec)
              print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
            except Exception as e:
              print('PROBEERR',u,repr(e),flush=True)
          (out/'probe_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          grep -RInE "\.pdf|download|下载|pdfUrl|fileUrl|reportId|repinfo|5329571|5553065" quantgroup_page_inspect > quantgroup_page_inspect/grep_hits.txt || true

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-report-page-inspect-20260919
          path: quantgroup_page_inspect
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
