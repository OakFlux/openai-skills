name: Temporary CGN New Energy report package fixed

on:
  push:
    branches:
      - chatgpt-temp-cgn-new-energy-reports-20260907

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'httpx[http2]' pypdf pymupdf
          cat > /tmp/package_cgn_fixed.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import httpx
          import pymupdf
          from pypdf import PdfReader

          OUT = Path('package_files')
          VERIFY = Path('verification')
          OUT.mkdir(parents=True, exist_ok=True)
          VERIFY.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  'filename': '01_中广核新能源_2020年年度报告.pdf',
                  'period': '2020年年度报告',
                  'release_time': '22/04/2021 16:38',
                  'title': '2020年年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0422/2021042200556_c.pdf',
                  'min_pages': 100,
              },
              {
                  'filename': '02_中广核新能源_2021年年度报告.pdf',
                  'period': '2021年年度报告',
                  'release_time': '14/04/2022 18:09',
                  'title': '2021年年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2022/0414/2022041400896_c.pdf',
                  'min_pages': 100,
              },
              {
                  'filename': '03_中广核新能源_2022年年度报告.pdf',
                  'period': '2022年年度报告',
                  'release_time': '19/04/2023 16:30',
                  'title': '2022年年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2023/0419/2023041900246_c.pdf',
                  'min_pages': 100,
              },
              {
                  'filename': '04_中广核新能源_2023年年度报告.pdf',
                  'period': '2023年年度报告',
                  'release_time': '17/04/2024 16:42',
                  'title': '2023年年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0417/2024041700373_c.pdf',
                  'min_pages': 100,
              },
              {
                  'filename': '05_中广核新能源_2024年年度报告.pdf',
                  'period': '2024年年度报告',
                  'release_time': '16/04/2025 16:44',
                  'title': '2024年年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0416/2025041600574_c.pdf',
                  'min_pages': 100,
              },
              {
                  'filename': '06_中广核新能源_2025年年度报告.pdf',
                  'period': '2025年年度报告',
                  'release_time': '29/04/2026 16:31',
                  'title': '2025年年報',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0429/2026042900759_c.pdf',
                  'min_pages': 100,
              },
              {
                  'filename': '07_中广核新能源_2026年中期业绩公告.pdf',
                  'period': '2026年中期业绩公告',
                  'release_time': '26/08/2026 18:04',
                  'title': '截至2026年6月30日止六個月中期業績公告',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0826/2026082600802_c.pdf',
                  'min_pages': 8,
              },
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          }
          client = httpx.Client(http2=True, follow_redirects=True, timeout=httpx.Timeout(600.0, connect=30.0), headers=headers)

          manifest = []
          for index, item in enumerate(documents, start=1):
              dest = OUT / item['filename']
              part = Path(str(dest) + '.part')
              errors = []
              for attempt in range(1, 4):
                  try:
                      print('Downloading', item['url'], 'attempt', attempt, flush=True)
                      with client.stream('GET', item['url']) as response:
                          response.raise_for_status()
                          with part.open('wb') as fh:
                              for chunk in response.iter_bytes(1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                          final_url = str(response.url)
                      size = part.stat().st_size
                      if part.read_bytes()[:5] != b'%PDF-':
                          raise RuntimeError(f'not PDF; bytes={size}')
                      if size < 80_000:
                          raise RuntimeError(f'file too small: {size}')
                      reader = PdfReader(str(part), strict=False)
                      pages = len(reader.pages)
                      if pages < item['min_pages']:
                          raise RuntimeError(f'too few pages: {pages} < {item["min_pages"]}')

                      doc = pymupdf.open(part)
                      cover = VERIFY / f'cover_{index:02d}.png'
                      doc[0].get_pixmap(matrix=pymupdf.Matrix(1.2, 1.2), alpha=False).save(cover)
                      sample = '\n'.join(doc[p].get_text('text') for p in range(min(doc.page_count, 20))).lower()
                      doc.close()
                      if not cover.exists() or cover.stat().st_size < 1500:
                          raise RuntimeError('cover render failed')
                      compact = re.sub(r'\s+', '', sample)
                      issuer_tokens = ('中廣核新能源', '中广核新能源', 'cgnnewenergy')
                      issuer_text_check = any(token.lower() in compact for token in issuer_tokens) if compact else None

                      part.replace(dest)
                      digest = hashlib.sha256(dest.read_bytes()).hexdigest()
                      manifest.append({
                          'filename': dest.name,
                          'period': item['period'],
                          'document_title': item['title'],
                          'release_time': item['release_time'],
                          'pages': pages,
                          'size_bytes': size,
                          'sha256': digest,
                          'source_url': final_url,
                          'issuer_text_check': issuer_text_check,
                      })
                      print('OK', dest.name, 'pages=', pages, 'bytes=', size, 'issuer_text_check=', issuer_text_check, flush=True)
                      break
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {type(exc).__name__}: {exc}')
                      part.unlink(missing_ok=True)
                      dest.unlink(missing_ok=True)
                      time.sleep(attempt * 2)
              else:
                  raise RuntimeError(f'Failed {dest.name}: ' + '; '.join(errors))

          if len(manifest) != 7:
              raise RuntimeError(f'Expected 7 PDFs, got {len(manifest)}')

          note = [
              '中广核新能源控股有限公司（01811.HK）定期报告资料包',
              '',
              '资料范围：2020—2025年完整年度报告，以及截至2026年9月7日最新正式财务披露《2026年中期业绩公告》。',
              '截至2026年9月7日，港交所尚未列示完整的《2026年中期报告》，因此采用2026年8月26日发布的中期业绩公告。',
              '所有PDF均来自港交所公开披露页面，为中文原始披露文件，未重新排版、转码或删页。',
              '',
              '文件清单与校验信息：',
          ]
          for row in manifest:
              note.extend([
                  f'- {row["filename"]}',
                  f'  报告口径：{row["period"]}',
                  f'  公告标题：{row["document_title"]}',
                  f'  披露时间：{row["release_time"]}',
                  f'  页数：{row["pages"]}',
                  f'  文件大小：{row["size_bytes"]} 字节',
                  f'  SHA-256：{row["sha256"]}',
                  f'  来源：{row["source_url"]}',
              ])
          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(note) + '\n', encoding='utf-8')
          (OUT / '00_manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          with (OUT / 'SHA256SUMS.txt').open('w', encoding='utf-8') as fh:
              for row in manifest:
                  fh.write(f'{row["sha256"]}  {row["filename"]}\n')

          test_zip = Path('CGN_New_Energy_local_integrity_check.zip')
          with zipfile.ZipFile(test_zip, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(OUT.iterdir(), key=lambda p: p.name):
                  zf.write(path, path.name)
          with zipfile.ZipFile(test_zip, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len([n for n in zf.namelist() if n.lower().endswith('.pdf')]) != 7:
                  raise RuntimeError('ZIP PDF count mismatch')
          test_zip.unlink()

          summary = {
              'pdf_count': len(manifest),
              'total_pages': sum(x['pages'] for x in manifest),
              'total_pdf_bytes': sum(x['size_bytes'] for x in manifest),
              'latest_kind': '2026年中期业绩公告',
              'documents': manifest,
          }
          (VERIFY / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PACKAGE READY ' + json.dumps(summary, ensure_ascii=False), flush=True)
          PY
          python /tmp/package_cgn_fixed.py

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cgn-new-energy-report-package-fixed
          path: package_files/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
