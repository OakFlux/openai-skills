name: Build Fenghuang Shipping broker research package 20261012

on:
  push:
    paths:
      - '.github/workflows/fenghuang-shipping-broker-research-package-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 pypdf reportlab

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.platypus import PageBreak, Paragraph, SimpleDocTemplate, Spacer

          TODAY = '2026-10-12'
          PACKAGE = '凤凰航运_000520_券商研究资料_1份公司调研简报_2份干散货同业深度'
          WORK = Path('fenghuang_broker_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL = WORK / 'final' / PACKAGE
          ART = Path('artifact_out')
          VERIFY = Path('verification_renders')
          for d in (DOWNLOADS, FINAL, ART, VERIFY):
              d.mkdir(parents=True, exist_ok=True)

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:105]

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def qpdf_check(path: Path) -> None:
              result = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if result.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {path.name}: {result.stderr[-800:]}')

          # 1) Direct company research note: archived Sina page, converted to a self-contained PDF.
          direct_url = 'https://finance.sina.com.cn/stock/companyresearch/20070124/15333278228.shtml'
          response = s.get(direct_url, timeout=(25, 180), allow_redirects=True)
          response.raise_for_status()
          response.encoding = response.apparent_encoding or 'utf-8'
          soup = BeautifulSoup(response.text, 'html.parser')
          title = '长航凤凰：调研简报显示公司正处转型期'
          author = '中信建投证券｜钱宏伟｜2007年1月24日'
          body = None
          for selector in ['#artibody', '.article', '.article-body', '#articleContent', '.blkContainerSblkCon']:
              node = soup.select_one(selector)
              if node and len(node.get_text(' ', strip=True)) > 500:
                  body = node
                  break
          if body is None:
              candidates = sorted(soup.find_all(['div', 'article']), key=lambda n: len(n.get_text(' ', strip=True)), reverse=True)
              body = candidates[0] if candidates else soup
          for tag in body.find_all(['script', 'style', 'iframe', 'form', 'nav', 'footer', 'aside']):
              tag.decompose()
          text = body.get_text('\n', strip=True)
          text = re.sub(r'\n{3,}', '\n\n', text)
          start = text.find('调研目的')
          if start >= 0:
              text = text[start:]
          if len(text) < 700 or '长航凤凰' not in (title + text):
              raise RuntimeError('Direct research note content could not be verified')

          pdfmetrics.registerFont(UnicodeCIDFont('STSong-Light'))
          styles = getSampleStyleSheet()
          title_style = ParagraphStyle('TitleCN', parent=styles['Title'], fontName='STSong-Light', fontSize=18, leading=26, alignment=TA_CENTER, spaceAfter=10)
          meta_style = ParagraphStyle('MetaCN', parent=styles['Normal'], fontName='STSong-Light', fontSize=9, leading=14, alignment=TA_CENTER, textColor='#444444', spaceAfter=12)
          body_style = ParagraphStyle('BodyCN', parent=styles['BodyText'], fontName='STSong-Light', fontSize=10.5, leading=18, firstLineIndent=21, spaceAfter=7)
          note_style = ParagraphStyle('NoteCN', parent=styles['Normal'], fontName='STSong-Light', fontSize=8.5, leading=13, textColor='#555555', spaceAfter=8)
          direct_path = DOWNLOADS / 'direct_note.pdf'
          doc = SimpleDocTemplate(str(direct_path), pagesize=A4, rightMargin=18*mm, leftMargin=18*mm, topMargin=16*mm, bottomMargin=16*mm, title=title, author='中信建投证券')
          story = [Paragraph(title, title_style), Paragraph(author, meta_style), Paragraph('资料形态说明：本文件依据新浪财经公开存档的中信建投公司调研简报正文整理为PDF，不是券商原始版式文件；内容指向证券代码000520的历史主体“长航凤凰”。', note_style), Spacer(1, 4)]
          for para in [p.strip() for p in re.split(r'\n+', text) if p.strip()]:
              para = para.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
              story.append(Paragraph(para, body_style))
          story += [PageBreak(), Paragraph('来源与核验信息', title_style), Paragraph(f'公开来源：{direct_url}', body_style), Paragraph('核验要点：标题、机构、作者、发布日期、公司旧称及主营业务描述均与公开存档一致。', body_style)]
          doc.build(story)
          qpdf_check(direct_path)
          direct_reader = PdfReader(str(direct_path), strict=False)
          direct_pages = len(direct_reader.pages)
          direct_record = {
              'stock_code': '000520',
              'stock_name': '凤凰航运（历史名称：长航凤凰）',
              'broker': '中信建投证券',
              'publish_date': '2007-01-24',
              'title': title,
              'document_type': '公司调研简报（网页存档转PDF，非原始版式）',
              'source_url': direct_url,
              'pages': direct_pages,
              'bytes': direct_path.stat().st_size,
              'sha256': sha256(direct_path),
              'peer_report': False,
              'text_searchable': True,
              'pdf_path': str(direct_path),
          }

          # 2) Select two closest dry-bulk shipping peer deep reports from public broker-report metadata.
          api = 'https://reportapi.eastmoney.com/report/list'
          peer_specs = [
              {'codes':['603162'], 'name':'海通发展', 'weight':120, 'relation':'主营境内外干散货运输，与凤凰航运在船队资产、运价周期和沿海/外贸业务方面可比。'},
              {'codes':['920571','833171'], 'name':'国航远洋', 'weight':115, 'relation':'以国际干散货航运为核心，可用于比较船队扩张、运力结构和BDI周期暴露。'},
              {'codes':['601022'], 'name':'宁波远洋', 'weight':90, 'relation':'兼营沿海及国际航运，可用于比较区域航线、散货与综合物流经营。'},
              {'codes':['600798'], 'name':'宁波海运', 'weight':85, 'relation':'以沿海及长江中下游干散货、电煤运输为主，业务形态与凤凰航运接近。'},
              {'codes':['601872'], 'name':'招商轮船', 'weight':60, 'relation':'综合航运龙头，干散货板块可用于行业周期和船队经营对标。'},
          ]

          def report_rows(code: str) -> list[dict[str, Any]]:
              params = {'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':TODAY,'pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              r = s.get(api, params=params, timeout=(25,180))
              print('API', code, r.status_code, len(r.content), flush=True)
              r.raise_for_status()
              return r.json().get('data') or []

          def download_report(info_code: str, target: Path) -> str:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              for url in urls:
                  r = s.get(url, timeout=(30,300), allow_redirects=True, headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'})
                  print('PDF', info_code, r.status_code, len(r.content), url, flush=True)
                  if r.status_code == 200 and len(r.content) > 100000 and r.content.startswith(b'%PDF-'):
                      target.write_bytes(r.content)
                      return str(r.url)
              raise RuntimeError(f'No valid PDF for {info_code}')

          candidates: list[tuple[int, dict[str, Any], dict[str, Any]]] = []
          metadata_archive: dict[str, list[dict[str, Any]]] = {}
          for spec in peer_specs:
              seen_info: set[str] = set()
              for code in spec['codes']:
                  rows = report_rows(code)
                  metadata_archive[code] = rows
                  for row in rows:
                      info = str(row.get('infoCode') or '')
                      if not info or info in seen_info:
                          continue
                      seen_info.add(info)
                      pages = int(row.get('attachPages') or 0)
                      report_title = str(row.get('title') or '').strip()
                      if pages < 18 or not report_title:
                          continue
                      if any(term in report_title for term in ['季报点评','年报点评','中报点评','事件点评','业绩预告','信息更新','点评报告']):
                          continue
                      score = int(spec['weight']) + pages
                      if any(term in report_title for term in ['首次覆盖','深度报告','公司深度','深度研究']):
                          score += 120
                      if any(term in report_title for term in ['干散货','航运','船队','高贝塔','三重驱动']):
                          score += 35
                      date = str(row.get('publishDate') or '')[:10]
                      if date >= '2023-01-01': score += 25
                      candidates.append((score, row, spec))
              time.sleep(0.5)

          candidates.sort(key=lambda x: x[0], reverse=True)
          peer_records: list[dict[str, Any]] = []
          used_companies: set[str] = set()
          used_hashes = {direct_record['sha256']}
          for score, row, spec in candidates:
              if len(peer_records) >= 2:
                  break
              if spec['name'] in used_companies:
                  continue
              info = str(row.get('infoCode') or '')
              temp = DOWNLOADS / f'{info}.pdf'
              try:
                  source_url = download_report(info, temp)
                  reader = PdfReader(str(temp), strict=False)
                  pages = len(reader.pages)
                  if pages < 18:
                      raise RuntimeError('too short')
                  text_parts = []
                  for i in range(min(24, pages)):
                      try: text_parts.append(reader.pages[i].extract_text() or '')
                      except Exception: pass
                  text = '\n'.join(text_parts)
                  if spec['name'] not in text and not any(code in text for code in spec['codes']):
                      raise RuntimeError('company identity not verified')
                  if not any(mark in text for mark in ['证券研究报告','公司研究','投资评级','首次覆盖','深度报告']):
                      raise RuntimeError('research identity not verified')
                  qpdf_check(temp)
                  digest = sha256(temp)
                  if digest in used_hashes:
                      raise RuntimeError('duplicate')
                  used_hashes.add(digest)
                  used_companies.add(spec['name'])
                  peer_records.append({
                      'stock_code': str(row.get('stockCode') or spec['codes'][0]),
                      'stock_name': spec['name'],
                      'broker': str(row.get('orgSName') or row.get('orgName') or '未知券商'),
                      'publish_date': str(row.get('publishDate') or '')[:10],
                      'title': str(row.get('title') or '').strip(),
                      'info_code': info,
                      'document_type': '干散货航运同业长篇深度/首次覆盖报告',
                      'relation_to_fenghuang': spec['relation'],
                      'source_url': source_url,
                      'pages': pages,
                      'bytes': temp.stat().st_size,
                      'sha256': digest,
                      'peer_report': True,
                      'text_searchable': True,
                      'selection_score': score,
                      'pdf_path': str(temp),
                  })
                  print('VALIDATED_PEER', json.dumps(peer_records[-1], ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('REJECT', spec['name'], row.get('title'), repr(exc), flush=True)
                  temp.unlink(missing_ok=True)

          if len(peer_records) < 2:
              raise RuntimeError(f'Only {len(peer_records)} peer reports validated')

          records = [direct_record] + peer_records
          manifest: list[dict[str, Any]] = []
          for index, record in enumerate(records, 1):
              tag = '公司调研简报' if not record['peer_report'] else '同业深度'
              filename = f"{index:02d}_{tag}_{safe(record['publish_date'])}_{safe(record['broker'])}_{safe(record['stock_name'])}_{safe(record['title'])}.pdf"
              shutil.copy2(record['pdf_path'], FINAL / filename)
              clean = {k:v for k,v in record.items() if k != 'pdf_path'}
              clean['filename'] = filename
              manifest.append(clean)

          readme = [
              '凤凰航运（000520.SZ，历史名称：长航凤凰）券商研究资料包',
              f'整理日期：{TODAY}',
              '',
              '检索结论与口径：',
              '1. 按证券代码000520、现名“凤凰航运”和旧名“长航凤凰”检索，公开券商研报库未发现可直接下载并核验的公司专属现代长篇深度报告。',
              '2. 本包收录1份中信建投对长航凤凰的历史公司调研简报；该文件依据公开网页存档整理为PDF，保留正文但不是券商原始版式。',
              '3. 为满足2-3份研究资料需求，另收录2份业务最接近的干散货航运同业长篇深度/首次覆盖报告。它们不代表券商对凤凰航运本身的评级、目标价或盈利预测。',
              '',
              '文件清单：',
          ]
          for i, r in enumerate(manifest, 1):
              readme += [
                  f'{i}. {r["filename"]}',
                  f'   公司：{r["stock_name"]}；券商：{r["broker"]}；日期：{r["publish_date"]}；页数：{r["pages"]}',
                  f'   标题：{r["title"]}',
                  f'   类型：{r["document_type"]}',
                  f'   来源：{r["source_url"]}',
                  f'   SHA-256：{r["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查PDF文件头、研究主体、实际页数、qpdf结构、重复文件及SHA-256；每份PDF首页已渲染，最终ZIP已通过CRC测试。')
          (FINAL / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (FINAL / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / '原始研报检索元数据.json').write_text(json.dumps(metadata_archive, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in manifest), encoding='utf-8')

          for i, r in enumerate(manifest, 1):
              source = FINAL / r['filename']
              prefix = VERIFY / f'{i:02d}'
              result = subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(source),str(prefix)], capture_output=True, text=True)
              if result.returncode != 0:
                  raise RuntimeError(f'Render failed: {source.name}: {result.stderr[-500:]}')

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(FINAL.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [n for n in archive.namelist() if n.lower().endswith('.pdf')]
              if bad: raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != 3: raise RuntimeError(f'Expected 3 PDFs, found {len(pdfs)}')
          print('FINAL_MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', sha256(zip_path), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: fenghuang-shipping-000520-broker-research-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: fenghuang-shipping-000520-broker-research-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
