name: Discover Qingdao Food 872387 filings 20261028

on:
  push:
    paths:
      - '.github/workflows/qingdao-food-872387-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query announcement APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          url='https://np-anotice-stock.eastmoney.com/api/security/ann'
          for code in ['872387','001219']:
              print('CODE',code)
              total=[]
              for page in range(1,11):
                  p={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':code,'f_node':'0','s_node':'0'}
                  r=s.get(url,params=p,timeout=(20,120)); print('PAGE',page,r.status_code,len(r.content))
                  obj=r.json(); rows=((obj.get('data') or {}).get('list') or [])
                  total.extend(rows)
                  if len(rows)<100: break
                  time.sleep(.1)
              print('TOTAL',len(total))
              for x in total:
                  t=str(x.get('title') or '')
                  if any(k in t for k in ['年度报告','招股说明书','季度报告','一季度报告','三季度报告']):
                      print(json.dumps({'title':t,'date':x.get('display_time') or x.get('notice_date'),'art_code':x.get('art_code') or x.get('artCode')},ensure_ascii=False))
          PY
