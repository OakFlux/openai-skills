name: probe-beiyuan-chemical-601568-broker-reports

on:
  push:
    branches:
      - tmp/beiyuan-chemical-601568-broker-probe-20261104

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install parsers
        run: python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Probe report indexes and public pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, html, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          CODE='601568'
          NAMES=['北元化工','北元集团','陕西北元化工集团']
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def get(url, **kwargs):
              r=s.get(url, timeout=kwargs.pop('timeout',(20,120)), allow_redirects=True, **kwargs)
              print('GET',r.status_code,len(r.content),r.headers.get('content-type'),r.url)
              return r

          print('\n=== REPORTLIST DATASETS ===')
          candidates={}
          for year in range(2017,2027):
              u=f'https://raw.githubusercontent.com/metatools2023/reportlists/main/site/data/index-{year}.json'
              try:
                  r=get(u)
                  if r.status_code!=200: continue
                  data=r.json()
              except Exception as e:
                  print('INDEX_ERR',year,repr(e)); continue
              reports=data.get('reports') or []
              print('INDEX',year,'REPORTS',len(reports))
              for rec in reports:
                  blob=' '.join(str(rec.get(k) or '') for k in ['s','t','n','o','a'])
                  if CODE in blob or any(n in blob for n in NAMES):
                      info=str(rec.get('i') or '')
                      item={k:rec.get(k) for k in rec.keys()}
                      candidates[info]=item
                      print('CANDIDATE',year,json.dumps(item,ensure_ascii=False))
          print('CANDIDATE_COUNT',len(candidates))

          out=Path('probe_pdfs'); out.mkdir(exist_ok=True)
          for info,rec in candidates.items():
              if not info: continue
              for prefix in ['H3','H2','H1','H4','H5']:
                  u=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  try:
                      r=get(u,headers={'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*;q=0.8'})
                      if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>20000:
                          p=out/f'{prefix}_{info}.pdf'; p.write_bytes(r.content)
                          reader=PdfReader(str(p),strict=False); pages=len(reader.pages)
                          text='\n'.join((pg.extract_text() or '') for pg in reader.pages[:min(5,pages)])
                          compact=re.sub(r'\s+','',text)
                          print('PDF_OK',prefix,info,'PAGES',pages,'BYTES',len(r.content),'MATCH',CODE in compact or any(n in compact for n in NAMES),'TEXT',compact[:500])
                          break
                  except Exception as e:
                      print('PDF_ERR',prefix,info,repr(e))

          print('\n=== EASTMONEY API ===')
          params={
              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
              'beginTime':'2010-01-01','endTime':'2026-11-04','pageNo':'1','fields':'','qType':'0',
              'orgCode':'','code':CODE,'rcode':'','cb':'callback123'
          }
          try:
              r=get('https://reportapi.eastmoney.com/report/list',params=params,headers={'Referer':f'https://data.eastmoney.com/report/{CODE}.html'})
              print('EM_HEAD',r.text[:1000])
          except Exception as e: print('EM_ERR',repr(e))

          print('\n=== EASTMONEY PAGE ===')
          try:
              r=get(f'https://data.eastmoney.com/report/{CODE}.html')
              txt=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
              for pat in ['var initdata', 'infoCode', '依托资源优势', '北元']:
                  for m in list(re.finditer(re.escape(pat),txt,re.I))[:10]:
                      print('EM_PAGE_MATCH',pat,re.sub(r'\s+',' ',txt[max(0,m.start()-500):m.end()+1500]))
          except Exception as e: print('EM_PAGE_ERR',repr(e))

          print('\n=== SINA REPORT LIST ===')
          for symbol in ['sh601568','601568']:
              try:
                  u=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol={symbol}&t1=all'
                  r=get(u)
                  txt=r.content.decode('gb18030',errors='replace')
                  print('SINA_TITLE',re.findall(r'<title[^>]*>(.*?)</title>',txt,re.I|re.S)[:2])
                  links=[]
                  for m in re.finditer(r'href=["\']([^"\']*vReport_Show[^"\']*rptid/\d+[^"\']*)["\']',txt,re.I):
                      full=urljoin(r.url,html.unescape(m.group(1)))
                      rid=re.search(r'rptid/(\d+)',full)
                      if rid and rid.group(1) not in [x[0] for x in links]:
                          ctx=re.sub(r'<[^>]+>',' ',txt[max(0,m.start()-500):m.end()+900])
                          ctx=re.sub(r'\s+',' ',html.unescape(ctx)).strip()
                          links.append((rid.group(1),full,ctx))
                  print('SINA_LINKS',symbol,len(links))
                  for x in links: print('SINA_ITEM',json.dumps(x,ensure_ascii=False))
              except Exception as e: print('SINA_ERR',symbol,repr(e))

          print('\n=== KNOWN PUBLIC SOURCES ===')
          urls=[
              'https://file.iyanbao.com/pdf/664af-9b578c96-b468-4e9f-9d6f-714a237b50c2.pdf',
              'https://www.nxny.com/author/25104_p1.html',
              'https://www.nxny.com/stype_1025_p86/',
              'https://wap.hibor.com.cn/repinfodetail_851102.html',
              'https://www.futunn.com/stock/601568-SH/institutional-ratings',
              'https://profile.10jqka.com.cn/601568/',
          ]
          for u in urls:
              try:
                  r=get(u,headers={'Referer':'https://www.google.com/'} if 'pdf' not in u else {'Referer':'https://www.iyanbao.com/','Accept':'application/pdf,*/*;q=0.8'})
                  if r.content.startswith(b'%PDF-'):
                      p=out/'known.pdf'; p.write_bytes(r.content)
                      rr=PdfReader(str(p),strict=False)
                      print('KNOWN_PDF',u,'PAGES',len(rr.pages),'BYTES',len(r.content))
                      continue
                  txt=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
                  print('PAGE_TITLE',u,re.findall(r'<title[^>]*>(.*?)</title>',txt,re.I|re.S)[:2])
                  soup=BeautifulSoup(txt,'lxml')
                  for tag in soup.find_all(['a','script','iframe','embed','object']):
                      val=tag.get('href') or tag.get('src') or tag.get('data')
                      if val:
                          full=urljoin(r.url,html.unescape(val))
                          low=full.lower()
                          if any(k in low for k in ['pdf','download','report','file','attach']):
                              print('PAGE_LINK',u,full,tag.get_text(' ',strip=True)[:150])
                  for pat in [r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',r'AP\d{10,}',r'infoCode[^\n]{0,500}',r'download[^\n]{0,800}']:
                      for m in re.finditer(pat,txt,re.I):
                          print('RAW_MATCH',u,re.sub(r'\s+',' ',txt[max(0,m.start()-300):m.end()+700])[:1600])
              except Exception as e: print('KNOWN_ERR',u,repr(e))
          PY
