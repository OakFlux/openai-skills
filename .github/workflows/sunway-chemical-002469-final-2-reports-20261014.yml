name: Build final Sunway Chemical 002469 two-report package 20261014

on:
  push:
    paths:
      - '.github/workflows/sunway-chemical-002469-final-2-reports-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          TODAY = '2026-10-14'
          PACKAGE = '三维化学_002469_券商研究资料_1份公司深度_1份化工工程同业深度'
          WORK = Path('sunway_final_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL = WORK / 'final' / PACKAGE
          ART = Path('artifact_out')
          VERIFY = Path('verification_renders')
          for directory in (DOWNLOADS, FINAL, ART, VERIFY):
              directory.mkdir(parents=True, exist_ok=True)

          reports: list[dict[str, Any]] = [
              {
                  'stock_code': '002469',
                  'stock_name': '三维化学',
                  'aliases': ['002469', '三维化学', '山东三维化学集团股份有限公司', '山东三维石化工程股份有限公司'],
                  'broker': '国信证券',
                  'publish_date': '2025-05-16',
                  'title': '受益于新疆煤化工建设提速，“工程+实业”携手并进',
                  'info_code': 'AP202505161673828576',
                  'min_pages': 30,
                  'expected_pages': 37,
                  'document_type': '三维化学公司专属长篇深度/首次覆盖报告',
                  'peer_report': False,
                  'relation': '',
              },
              {
                  'stock_code': '601117',
                  'stock_name': '中国化学',
                  'aliases': ['601117', '中国化学', '中国化学工程股份有限公司'],
                  'broker': '华安证券',
                  'publish_date': '2023-03-29',
                  'title': '全年工程合同金额稳步增长，实业新材料有序推进',
                  'info_code': 'AP202303291584653861',
                  'min_pages': 20,
                  'expected_pages': 25,
                  'document_type': '化工工程同业长篇研究报告',
                  'peer_report': True,
                  'relation': '中国化学是大型化工工程承包商，可用于比较煤化工景气、工程设计/EPC商业模式、订单执行以及实业新材料布局。',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:108]

          def download(info_code: str, target: Path) -> str:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              last = ''
              for attempt in range(1, 5):
                  for url in urls:
                      try:
                          response = session.get(url, timeout=(30, 420), allow_redirects=True, headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://data.eastmoney.com/',
                              'Accept': 'application/pdf,*/*',
                          })
                          print('PDF', info_code, attempt, response.status_code, len(response.content), url, flush=True)
                          if response.status_code == 200 and len(response.content) > 100_000 and response.content.startswith(b'%PDF-'):
                              target.write_bytes(response.content)
                              return str(response.url)
                          last = f'{response.status_code}/{len(response.content)}'
                      except Exception as exc:
                          last = repr(exc)
                  time.sleep(attempt)
              raise RuntimeError(f'No complete PDF for {info_code}: {last}')

          records: list[dict[str, Any]] = []
          seen_hashes: set[str] = set()
          for index, report in enumerate(reports, 1):
              temp = DOWNLOADS / f"{report['info_code']}.pdf"
              source_url = download(report['info_code'], temp)
              reader = PdfReader(str(temp), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f"Unexpectedly short PDF: {report['title']} ({pages})")
              if report['expected_pages'] and pages != report['expected_pages']:
                  raise RuntimeError(f"Page mismatch: {report['title']} ({pages} != {report['expected_pages']})")

              parts: list[str] = []
              page_indexes = list(range(min(45, pages)))
              if pages > 50:
                  page_indexes.extend(range(max(0, pages - 5), pages))
              for page_index in dict.fromkeys(page_indexes):
                  try:
                      parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              text = '\n'.join(parts)
              identity_blob = text + '\n' + report['title']
              if not any(alias in identity_blob for alias in report['aliases']):
                  raise RuntimeError(f"Company identity not verified: {report['title']}")
              if not any(mark in text for mark in ['证券研究报告', '公司研究', '首次覆盖', '深度报告', '投资评级', '研究报告', '公司报告']):
                  raise RuntimeError(f"Broker research identity not verified: {report['title']}")

              check = subprocess.run(['qpdf', '--check', str(temp)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f"qpdf failed: {report['title']}: {check.stderr[-800:]}")
              raw = temp.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f"Duplicate PDF: {report['title']}")
              seen_hashes.add(digest)

              tag = '公司深度' if not report['peer_report'] else '同业深度'
              filename = f"{index:02d}_{tag}_{safe(report['publish_date'])}_{safe(report['broker'])}_{safe(report['stock_name'])}_{safe(report['title'])}.pdf"
              shutil.copy2(temp, FINAL / filename)
              record = {
                  'stock_code': report['stock_code'],
                  'stock_name': report['stock_name'],
                  'broker': report['broker'],
                  'publish_date': report['publish_date'],
                  'title': report['title'],
                  'info_code': report['info_code'],
                  'document_type': report['document_type'],
                  'peer_report': report['peer_report'],
                  'relation_to_sunway': report['relation'],
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': digest,
                  'source_url': source_url,
                  'filename': filename,
                  'text_searchable': True,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '三维化学（002469.SZ；山东三维化学集团股份有限公司）券商研究资料包',
              f'整理日期：{TODAY}',
              '',
              '检索结论与收录口径：',
              '1. 公开研报数据库中能够直接下载并完成全文核验的三维化学公司专属长篇深度报告为1份。',
              '2. 用户要求2—3份，因此补充1份业务高度相关的化工工程同业长篇研究报告。',
              '3. 同业报告用于比较煤化工景气、工程设计/EPC模式、订单执行及实业新材料布局；不代表券商对三维化学本身的评级、目标价或盈利预测。',
              '4. 未使用网页摘要、缺页预览、媒体文章或无法核验全文的文件。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme += [
                  f'{index}. {record["filename"]}',
                  f'   类型：{record["document_type"]}',
                  f'   公司：{record["stock_name"]}；券商：{record["broker"]}；日期：{record["publish_date"]}；页数：{record["pages"]}',
                  f'   标题：{record["title"]}',
              ]
              if record['relation_to_sunway']:
                  readme.append(f'   与三维化学的可比性：{record["relation_to_sunway"]}')
              readme += [
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查研究主体、券商研究属性、实际页数、PDF文件头、qpdf结构、重复文件及SHA-256；两份PDF首页均已渲染，最终ZIP已通过CRC测试。')

          (FINAL / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (FINAL / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records), encoding='utf-8')

          for index, record in enumerate(records, 1):
              source = FINAL / record['filename']
              prefix = VERIFY / f'{index:02d}'
              render = subprocess.run([
                  'pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(source), str(prefix)
              ], capture_output=True, text=True)
              if render.returncode != 0:
                  raise RuntimeError(f'Render failed for {source.name}: {render.stderr[-800:]}')

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(FINAL.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != 2:
                  raise RuntimeError(f'Expected 2 PDFs, found {len(pdfs)}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: sunway-chemical-002469-final-two-reports
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: sunway-chemical-002469-final-two-reports-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
