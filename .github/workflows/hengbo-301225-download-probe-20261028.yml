name: Probe Hengbo 301225 report download endpoints 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-download-probe-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Probe endpoints and page data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, re, json, html, urllib.parse
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def show_response(label,u,method='get',**kw):
            print('\n###',label,u)
            try:
              r=getattr(s,method)(u,timeout=(20,120),allow_redirects=True,**kw)
              print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),'DISP',r.headers.get('content-disposition'))
              print('HEAD_BYTES',repr(r.content[:180]))
              if len(r.content)<200000 and ('text' in (r.headers.get('content-type') or '') or 'json' in (r.headers.get('content-type') or '')):
                txt=r.text
                print('TEXT_HEAD',repr(txt[:1000]))
              return r
            except Exception as e:
              print('ERROR',repr(e)); return None

          # Fenghuo page and APIs
          fh_page=show_response('FH_PAGE','https://www.fhyanbao.com/rpview/1920166')
          if fh_page:
            txt=fh_page.text
            for key in ['__NEXT_DATA__','1920166','preview','download','pdf','reportUrl','fileUrl','oss']:
              print('\nFH_CONTEXT',key)
              for m in list(re.finditer(re.escape(key),txt,re.I))[:8]:
                a=max(0,m.start()-350); b=min(len(txt),m.end()+650)
                print(txt[a:b].replace('\n',' ')[:1100])
            soup=BeautifulSoup(txt,'html.parser')
            nd=soup.find('script',id='__NEXT_DATA__')
            if nd and nd.string:
              try:
                obj=json.loads(nd.string)
                print('NEXT_DATA_KEYS',obj.keys())
                print('NEXT_DATA_SNIP',json.dumps(obj,ensure_ascii=False)[:12000])
              except Exception as e: print('NEXT_PARSE_ERROR',repr(e))

          fh_endpoints=[
            'https://api.fhyanbao.com/api/report/preview/1920166?resize=0',
            'https://api.fhyanbao.com/api/report/preview/1920166',
            'https://api.fhyanbao.com/api/report/download/1920166',
            'https://api.fhyanbao.com/api/report/detail/1920166',
            'https://api.fhyanbao.com/api/report/1920166',
            'https://api.fhyanbao.com/api/reports/1920166',
            'https://www.fhyanbao.com/api/report/preview/1920166?resize=0',
            'https://www.fhyanbao.com/api/report/download/1920166'
          ]
          for u in fh_endpoints: show_response('FH_ENDPOINT',u)

          # Shuidi page and scripts
          sd_page=show_response('SD_PAGE','https://www.sdyanbao.com/detail/937833')
          if sd_page:
            txt=sd_page.text
            for key in ['__NUXT__','937833','download','pdf','file','report','url','2.65']:
              print('\nSD_CONTEXT',key)
              for m in list(re.finditer(re.escape(key),txt,re.I))[:10]:
                a=max(0,m.start()-400); b=min(len(txt),m.end()+700)
                print(txt[a:b].replace('\n',' ')[:1200])
            soup=BeautifulSoup(txt,'html.parser')
            scripts=[urllib.parse.urljoin(sd_page.url,x.get('src')) for x in soup.find_all('script') if x.get('src')]
            print('SD_SCRIPTS',scripts)
            for su in scripts:
              r=show_response('SD_SCRIPT',su)
              if not r: continue
              st=r.text
              hits=[]
              for pattern in [r'https?://[^"\'<>\s]+',r'/api/[^"\'<>\s]+',r'[^"\'<>\s]+\.pdf[^"\'<>\s]*']:
                hits.extend(re.findall(pattern,st,re.I))
              uniq=[]
              for h in hits:
                h=html.unescape(h).replace('\\/','/')
                if h not in uniq and any(k in h.lower() for k in ['pdf','download','report','detail','file','api']): uniq.append(h)
              print('SD_SCRIPT_LINKS',su,json.dumps(uniq[:120],ensure_ascii=False))
              for key in ['download','pdf','report/detail','report/download','fileUrl','file_url','oss']:
                ms=list(re.finditer(re.escape(key),st,re.I))
                if ms:
                  print('SD_SCRIPT_CONTEXT',su,key)
                  for m in ms[:5]:
                    print(st[max(0,m.start()-250):min(len(st),m.end()+450)][:800])

          # Hibor page contexts
          hb=show_response('HIBOR','https://www.hibor.com.cn/wap_detail.aspx?id=5119519')
          if hb:
            try: txt=hb.content.decode('gb18030','ignore')
            except: txt=hb.text
            for key in ['5119519','download','Down','pdf','href','file']:
              print('\nHIBOR_CONTEXT',key)
              for m in list(re.finditer(re.escape(key),txt,re.I))[:12]:
                print(txt[max(0,m.start()-350):min(len(txt),m.end()+650)].replace('\n',' ')[:1100])
          PY
