name: Temporary Aixin research index lookup

on:
  push:
    branches:
      - tmp-aixin-em-index-20260906

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public research index
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, math, time
          from pathlib import Path
          import requests

          out=Path('output'); out.mkdir(exist_ok=True)
          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Origin':'https://data.eastmoney.com',
            'Accept':'application/json,text/plain,*/*',
          })
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2026-04-25','2026-05-05'),
            ('2026-06-08','2026-06-15'),
            ('2026-07-23','2026-07-30'),
            ('2026-08-08','2026-08-18'),
          ]
          target_words=['爱芯元智','踏智驾及边缘AI之浪','AI终端平台公司','高端启新','中报超预期','上市后首次中报']
          matches={}
          page_stats=[]
          for begin,end in windows:
            first=True
            page=1
            total_pages=1
            while page<=total_pages and page<=30:
              params={
                'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0',
                'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),
                'pageNumber':str(page),'client':'WEB','source':'WEB'
              }
              response=session.get(endpoint,params=params,timeout=90)
              response.raise_for_status()
              obj=response.json()
              records=obj.get('data') or []
              if isinstance(records,dict):
                records=records.get('data') or records.get('list') or records.get('records') or []
              hits=int(obj.get('hits') or obj.get('total') or 0)
              total_pages=max(1,math.ceil(hits/100))
              page_stats.append({'begin':begin,'end':end,'page':page,'hits':hits,'rows':len(records)})
              print('PAGE',begin,end,page,'rows',len(records),'hits',hits,flush=True)
              for record in records:
                searchable=' '.join(str(record.get(k) or '') for k in ['stockName','stockCode','title','orgSName','researcher'])
                if any(word in searchable for word in target_words):
                  key=str(record.get('infoCode') or record.get('title'))
                  matches[key]=record
                  print('MATCH',json.dumps({k:record.get(k) for k in ['stockName','stockCode','title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName']},ensure_ascii=False),flush=True)
              page+=1
              time.sleep(0.1)
          (out/'matches.json').write_text(json.dumps(list(matches.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'page_stats.json').write_text(json.dumps(page_stats,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT',len(matches),flush=True)
          PY
      - name: Upload lookup
        uses: actions/upload-artifact@v4
        with:
          name: aixin-research-index-results
          path: output/*
          retention-days: 1
          if-no-files-found: error
