name: Temporary Kaisheng Eastmoney report probe

on:
  push:
    branches:
      - tmp-kaisheng-eastmoney-probe-20260905

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query and test PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io, json, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('out'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9',
              'Referer':'https://data.eastmoney.com/report/600876.html',
              'Origin':'https://data.eastmoney.com',
          })
          api='https://reportapi.eastmoney.com/report/list'
          allrecs=[]
          for code in ['600876','SH600876','01108','1108']:
              for qtype in [0,1,2]:
                  for page in range(1,6):
                      params={
                        'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                        'beginTime':'2010-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'',
                        'qType':str(qtype),'orgCode':'','code':code,'rcode':'','p':str(page),
                        'pageNum':str(page),'pageNumber':str(page),'client':'WEB','source':'WEB'
                      }
                      try:
                          r=s.get(api,params=params,timeout=60); print('API',code,qtype,page,r.status_code,len(r.content),r.url,flush=True)
                          obj=r.json(); batch=obj.get('data') or obj.get('Data') or obj.get('result') or []
                          if isinstance(batch,dict): batch=batch.get('data') or batch.get('list') or batch.get('records') or []
                          print('ROWS',len(batch),'HITS',obj.get('hits') or obj.get('Hits') or obj.get('total'),flush=True)
                          if not batch: break
                          for rec in batch:
                              rec={'query_code':code,'query_qtype':qtype,**rec}; allrecs.append(rec)
                              print('REC',json.dumps({k:rec.get(k) for k in ['stockName','stockCode','title','orgSName','publishDate','infoCode','attachPages','attachSize','researcher','emRatingName']},ensure_ascii=False),flush=True)
                      except Exception as e:
                          print('ERR',code,qtype,page,repr(e),flush=True); break
          # Deduplicate by infoCode.
          uniq={str(r.get('infoCode') or r.get('INFO_CODE') or id(r)):r for r in allrecs}
          recs=list(uniq.values())
          (out/'records.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          needles=['供需边际改善','革故鼎新','转型新能源材料','光伏玻璃新力量','驶入新能源快车道','洛阳玻璃','凯盛新能']
          matches=[]
          for rec in recs:
              title=str(rec.get('title') or rec.get('TITLE') or '')
              stock=str(rec.get('stockName') or rec.get('SECURITY_NAME_ABBR') or '')
              if not any(n in title or n in stock for n in needles): continue
              info=str(rec.get('infoCode') or rec.get('INFO_CODE') or '')
              if not info: continue
              print('MATCH',info,title,flush=True)
              tested=[]
              urls=[
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time()*1000)}',
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time())}.pdf',
                f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{info}.pdf',
              ]
              for u in urls:
                  try:
                      rr=s.get(u,headers={'Referer':f'https://data.eastmoney.com/report/info/600876/{info}.html','Accept':'application/pdf,*/*'},timeout=(20,120),allow_redirects=True)
                      data=rr.content
                      row={'url':u,'status':rr.status_code,'bytes':len(data),'content_type':rr.headers.get('content-type'),'final_url':rr.url}
                      if rr.status_code==200 and b'%PDF-' in data[:1024] and len(data)>50000:
                          try: row['pages']=len(PdfReader(io.BytesIO(data),strict=False).pages)
                          except Exception as e: row['pdf_error']=repr(e)
                          fp=out/f'{info}.pdf'; fp.write_bytes(data); row['saved']=str(fp)
                          print('PDF_OK',info,row,flush=True); tested.append(row); break
                      print('PDF_BAD',info,row,flush=True); tested.append(row)
                  except Exception as e:
                      tested.append({'url':u,'error':repr(e)}); print('PDF_ERR',info,u,repr(e),flush=True)
              matches.append({'record':rec,'tested':tested})
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE_RECORDS',len(recs),'MATCHES',len(matches),flush=True)
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-eastmoney-probe
          path: out/*
          retention-days: 1
          if-no-files-found: error
