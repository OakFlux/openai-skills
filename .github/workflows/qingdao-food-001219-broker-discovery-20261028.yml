name: Discover Qingdao Food 001219 broker reports 20261028

on:
  push:
    paths:
      - '.github/workflows/qingdao-food-001219-broker-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery_out
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          CODE='001219'
          NAME='青岛食品'
          END='2026-10-28'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/report/{CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })
          url='https://reportapi.eastmoney.com/report/list'
          rows_all=[]; logs=[]
          for page in range(1,20):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2000-01-01','endTime':END,'pageNo':str(page),'fields':'',
                  'qType':'0','orgCode':'','code':CODE,'rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page)
              }
              obj=None; last=None
              for attempt in range(1,7):
                  try:
                      r=s.get(url,params=params,timeout=(20,120))
                      last={'status':r.status_code,'bytes':len(r.content),'head':r.text[:160]}
                      if r.status_code==200:
                          t=r.text.strip()
                          if t.startswith('{'):
                              obj=json.loads(t)
                          else:
                              a=t.find('('); b=t.rfind(')')
                              if a>=0 and b>a:
                                  obj=json.loads(t[a+1:b])
                          if obj is not None:
                              break
                  except Exception as e:
                      last={'error':repr(e)}
                  time.sleep(attempt)
              if obj is None:
                  raise RuntimeError(f'page {page} failed {last}')
              rows=obj.get('data') or []
              if isinstance(rows,dict):
                  rows=rows.get('list') or rows.get('data') or []
              logs.append({'page':page,'count':len(rows),'hits':obj.get('hits'),'totalPage':obj.get('TotalPage') or obj.get('totalPage')})
              if not rows:
                  break
              rows_all.extend(rows)
              if len(rows)<100:
                  break
              time.sleep(0.3)

          unique=[]; seen=set()
          for r in rows_all:
              ic=str(r.get('infoCode') or '')
              if not ic or ic in seen:
                  continue
              seen.add(ic); unique.append(r)
          unique=[r for r in unique if str(r.get('stockCode') or '')==CODE or str(r.get('stockName') or '')==NAME]
          unique.sort(key=lambda r:(str(r.get('publishDate') or ''),int(r.get('attachPages') or 0)),reverse=True)

          long_candidates=[]
          for r in unique:
              pages=int(r.get('attachPages') or 0)
              title=str(r.get('title') or '')
              org=str(r.get('orgSName') or '')
              if pages>=12 and ('证券' in org or '研究' in org or '财富' in org):
                  score=pages
                  if any(k in title for k in ['首次覆盖','深度','公司深度','专题研究','研究报告']): score+=100
                  if any(k in title for k in ['点评','快报','季报','年报点评','中报点评','信息更新','跟踪报告']): score-=80
                  if any(k in title for k in ['饼干','钙奶','休闲食品','全国扩张','渠道','产能','品牌']): score+=15
                  long_candidates.append({**r,'selectionScore':score})
          long_candidates.sort(key=lambda r:(int(r.get('selectionScore') or 0),str(r.get('publishDate') or '')),reverse=True)

          Path('discovery_out/qingdao_food_001219_report_metadata.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery_out/qingdao_food_001219_long_candidates.json').write_text(json.dumps(long_candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery_out/query_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=[f'TOTAL={len(unique)} LONG={len(long_candidates)}']
          for r in long_candidates:
              lines.append('\t'.join([
                  str(r.get('publishDate') or '')[:10],str(r.get('attachPages') or ''),
                  str(r.get('orgSName') or ''),str(r.get('title') or ''),
                  str(r.get('infoCode') or ''),str(r.get('emRatingName') or ''),
                  str(r.get('selectionScore') or '')
              ]))
          Path('discovery_out/qingdao_food_001219_long_candidates.tsv').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:120]))
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: qingdao-food-001219-broker-discovery-20261028
          path: discovery_out/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
