name: Temporary Goke Micro Eastmoney list2 query

on:
  push:
    branches: [tmp-goke-list2-20260830]

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query list2 and test returned PDFs
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/plain,*/*'})
          for begin,end in [('2023-05-25','2023-06-03'),('2023-11-20','2023-12-01'),('2019-12-01','2020-02-01'),('2024-06-01','2024-06-30')]:
            body={'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,'beginTime':begin,'endTime':end,'code':'300672','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
            r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'Content-Type':'application/json'},timeout=90)
            print('\nLIST2',begin,end,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
            print('HEAD',r.text[:500])
            try: obj=r.json()
            except Exception as e: print('JSON_ERR',repr(e)); continue
            print('HITS',obj.get('hits'),'TOTALPAGE',obj.get('TotalPage'),'ROWS',len(obj.get('data') or []))
            for row in obj.get('data') or []:
              print('ROW',json.dumps({k:row.get(k) for k in ['publishDate','orgSName','title','attachPages','attachSize','infoCode','encodeUrl','stockCode','stockName','reportType']},ensure_ascii=False))
              info=row.get('infoCode')
              if not info: continue
              for pre in ['H3','H2','H1']:
                u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                x=s.get(u,headers={'Accept':'application/pdf,*/*'},timeout=60,allow_redirects=True)
                print('PDF',pre,info,x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:80]))
          PY
