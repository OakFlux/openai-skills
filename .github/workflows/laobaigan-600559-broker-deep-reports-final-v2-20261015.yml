name: Package Laobaigan 600559 broker deep reports v2 20261015

on:
  push:
    paths:
      - '.github/workflows/laobaigan-600559-broker-deep-reports-final-v2-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='老白干酒_600559_券商深度报告_完整版_3份_截至20261015'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'broker':'华鑫证券','date':'2023-08-28','analysts':'孙山山','rating':'买入','pages_hint':63,
              'title':'公司深度报告：冀酒龙头剑指高端，武陵名酒飘香全国',
              'info_code':'AP202308271595902675',
              'terms':['老白干酒','600559','冀酒龙头','武陵'],
              'filename':'01_华鑫证券_老白干酒_冀酒龙头剑指高端武陵名酒飘香全国_2023-08-28_完整版.pdf'
            },
            {
              'broker':'西南证券','date':'2024-09-23','analysts':'朱会振,笪文钊,王书龙','rating':'买入','pages_hint':45,
              'title':'一树三香五花齐放，冀鲁湘皖香飘全国',
              'info_code':'AP202409231639974976',
              'terms':['老白干酒','600559','一树三香','冀鲁湘皖'],
              'filename':'02_西南证券_老白干酒_一树三香五花齐放冀鲁湘皖香飘全国_2024-09-23_完整版.pdf'
            },
            {
              'broker':'东吴证券','date':'2024-04-30','analysts':'孙瑜,王颖洁','rating':'买入','pages_hint':40,
              'title':'以精耕固市场，厚积薄发终有时',
              'info_code':'AP202404301632060125',
              'terms':['老白干酒','600559','衡水老白干','武陵'],
              'filename':'03_东吴证券_老白干酒_以精耕固市场厚积薄发终有时_2024-04-30_完整版.pdf'
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/600559.html',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download(info_code:str)->tuple[bytes,str,dict]:
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
            ]
            last={}
            for url in urls:
              for attempt in range(6):
                try:
                  r=s.get(url,timeout=(30,300),allow_redirects=True,headers={
                    'User-Agent':s.headers['User-Agent'],
                    'Referer':f'https://data.eastmoney.com/report/info/{info_code}.html',
                    'Accept':'application/pdf,*/*;q=0.8'
                  })
                  last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>150000:
                    return r.content,url,last
                except Exception as e:
                  last={'url':url,'error':repr(e)}
                time.sleep(1+attempt)
            raise RuntimeError(f'download failed {info_code}: {last}')

          manifest=[]
          for rep in reports:
            data,pdf_url,dlmeta=download(rep['info_code'])
            dest=root/rep['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages < max(18, rep['pages_hint']-3):
              raise RuntimeError(f'too few pages {dest.name}: {pages}, expected about {rep["pages_hint"]}')

            text=''
            for p in reader.pages[:min(18,pages)]:
              try: text += '\n'+(p.extract_text() or '')
              except Exception: pass
            if len(re.sub(r'\s+','',text))<200:
              txt=dest.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(18,pages)),str(dest),str(txt)],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if txt.exists(): text += '\n'+txt.read_text(encoding='utf-8',errors='ignore')
            compact=re.sub(r'\s+','',text)
            identity_hits=[t for t in rep['terms'] if re.sub(r'\s+','',t) in compact]
            if not any(t in compact for t in ['老白干酒','河北衡水老白干','600559']):
              raise RuntimeError(f'issuer mismatch: {dest.name}; hits={identity_hits}')

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError(f'preview failed: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **rep,
              'actual_pages':pages,
              'bytes':len(data),
              'sha256':sha,
              'identity_hits':identity_hits,
              'source_report_page':f'https://data.eastmoney.com/report/info/{rep["info_code"]}.html',
              'pdf_url':pdf_url,
              'download_meta':dlmeta,
              'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商原始完整PDF',
              'validation':['PDF header','issuer identity','actual page count','qpdf structure','first-page render']
            })

          readme=[
            '河北衡水老白干酒业股份有限公司（600559.SH）券商深度报告完整版资料包',
            '整理日期：2026-10-15','',
            '本包收录3份公开可直接取得的券商原始完整PDF，优先选择长篇公司深度、首次覆盖或系统性研究报告，并尽量覆盖不同券商。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",'',
            ]
          readme += [
            '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3:
              raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')

          alias=Path('laobaigan_600559_broker_deep_reports_3_full_20261015.zip')
          alias.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: laobaigan-600559-broker-deep-reports-final-v2-20261015
          path: |
            老白干酒_600559_券商深度报告_完整版_3份_截至20261015.zip
            laobaigan_600559_broker_deep_reports_3_full_20261015.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
