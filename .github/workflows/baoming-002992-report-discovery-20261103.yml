name: Discover Baoming 002992 broker reports 20261103

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baoming-002992-report-discovery-20261103.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Python packages
        run: python -m pip install --quiet requests pypdf

      - name: Query Eastmoney report API and inspect PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests
          from pypdf import PdfReader
          from io import BytesIO

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          payload={
            'pageSize':100,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,
            'beginTime':'2019-01-01','endTime':'2026-11-03','code':'002992',
            'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''
          }
          r=s.post('https://reportapi.eastmoney.com/report/list2',json=payload,headers={'Content-Type':'application/json'},timeout=60)
          print('API',r.status_code,r.headers.get('content-type'),len(r.content))
          print('API_HEAD',r.text[:1000])
          r.raise_for_status()
          obj=r.json()
          rows=obj.get('data') or []
          print('TOTAL_ROWS',len(rows),'TOTAL_HITS',obj.get('hits') or obj.get('total') or obj.get('count'))
          summary=[]
          for i,item in enumerate(rows,1):
            info=item.get('infoCode') or item.get('infocode') or ''
            title=item.get('title') or ''
            org=item.get('orgSName') or item.get('orgName') or ''
            date=item.get('publishDate') or item.get('publishDateTime') or ''
            rating=item.get('ratingName') or ''
            pdf=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf' if info else ''
            rec={'n':i,'infoCode':info,'title':title,'org':org,'date':date,'rating':rating,'pdf':pdf}
            if pdf:
              try:
                pr=s.get(pdf,headers={'Referer':'https://data.eastmoney.com/report/'},timeout=120)
                rec['status']=pr.status_code; rec['bytes']=len(pr.content); rec['ct']=pr.headers.get('content-type','')
                if pr.status_code==200 and pr.content[:5]==b'%PDF-':
                  reader=PdfReader(BytesIO(pr.content),strict=False)
                  rec['pages']=len(reader.pages)
                  text=''
                  for pg in reader.pages[:min(12,len(reader.pages))]:
                    try: text += '\n'+(pg.extract_text() or '')
                    except Exception: pass
                  compact=re.sub(r'\s+','',text)
                  rec['issuer_hit']=('宝明科技' in compact or '002992' in compact or '深圳市宝明科技股份有限公司' in compact)
                  rec['text_head']=compact[:240]
              except Exception as e:
                rec['error']=repr(e)
            summary.append(rec)
            print('REPORT',json.dumps(rec,ensure_ascii=False))
          open('baoming_report_discovery.json','w',encoding='utf-8').write(json.dumps({'api':obj,'summary':summary},ensure_ascii=False,indent=2))
          PY

      - name: Upload discovery JSON
        uses: actions/upload-artifact@v4
        with:
          name: baoming-002992-report-discovery
          path: baoming_report_discovery.json
          retention-days: 7
          if-no-files-found: error
# trigger 3
