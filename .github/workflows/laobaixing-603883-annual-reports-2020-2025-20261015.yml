name: Build Laobaixing 603883 annual reports package 20261015

on:
  push:
    paths:
      - '.github/workflows/laobaixing-603883-annual-reports-2020-2025-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '603883'
          COMPANY_SHORT = '老百姓'
          COMPANY_FULL = '老百姓大药房连锁股份有限公司'
          PACKAGE = '老百姓_603883_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          VALIDATION_PREVIEWS = Path('_validation_previews')
          VALIDATION_PREVIEWS.mkdir(exist_ok=True)

          annual_specs = [
              {'variants':['2020年年度报告'], 'period':'2020', 'filename':'01_老百姓_2020年年度报告.pdf', 'min_pages':80},
              {'variants':['2021年年度报告'], 'period':'2021', 'filename':'02_老百姓_2021年年度报告.pdf', 'min_pages':80},
              {'variants':['2022年年度报告'], 'period':'2022', 'filename':'03_老百姓_2022年年度报告.pdf', 'min_pages':80},
              {'variants':['2023年年度报告'], 'period':'2023', 'filename':'04_老百姓_2023年年度报告.pdf', 'min_pages':80},
              {'variants':['2024年年度报告'], 'period':'2024', 'filename':'05_老百姓_2024年年度报告.pdf', 'min_pages':80},
              {'variants':['2025年年度报告'], 'period':'2025', 'filename':'06_老百姓_2025年年度报告.pdf', 'min_pages':80},
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows: list[dict[str, Any]] = []
          search_pages: list[dict[str, Any]] = []

          for page in range(1, 61):
              params = {
                  'sr':'-1', 'page_size':'100', 'page_index':str(page),
                  'ann_type':'A', 'client_source':'web', 'stock_list':STOCK_CODE,
                  'f_node':'0', 's_node':'0',
              }
              data = None
              last: Any = None
              for attempt in range(8):
                  try:
                      response = session.get(api, params=params, timeout=(20, 120))
                      last = {'status':response.status_code,'text':response.text[:300]}
                      if response.status_code == 200:
                          data = response.json()
                          break
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'Announcement API failed page {page}: {last}')
              rows = ((data.get('data') or {}).get('list') or [])
              search_pages.append({'page':page,'count':len(rows)})
              if not rows:
                  break
              all_rows.extend(rows)
              if len(rows) < 100:
                  break
              time.sleep(0.08)

          def compact(text: str) -> str:
              return re.sub(r'\s+', '', text or '')

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '')

          def date_value(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or '')

          bad_common = [
              '摘要','英文版','取消','问询','回复','审计报告','董事会','监事会',
              '更正公告','提示性公告','社会责任报告','环境、社会及管治报告',
              '可持续发展报告','独立董事述职报告','内部控制评价报告','财务决算报告',
              '年度报告说明会','年度报告网上说明会','募集资金','会计师事务所',
              '前期会计差错更正后的财务报表','财务报表及相关附注','业绩预告',
          ]

          def choose_report(variants: list[str], period: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              candidates: list[tuple[int, str, dict[str, Any], str]] = []
              for row in all_rows:
                  raw = str(row.get('title') or '')
                  title = compact(raw)
                  matched = next((key for key in variants if compact(key) in title), None)
                  if not matched or any(compact(x) in title for x in bad_common):
                      continue
                  score = 50
                  key = compact(matched)
                  if title.endswith(key): score += 35
                  if title == key: score += 20
                  if title.startswith(COMPANY_SHORT) or title.startswith(COMPANY_FULL): score += 15
                  if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score += 100
                  if any(x in title for x in ['取消版','已取消']): score -= 100
                  candidates.append((score, date_value(row), row, matched))
              candidates.sort(key=lambda item:(item[0], item[1]), reverse=True)
              if not candidates:
                  raise RuntimeError(f'Missing report: {variants}')
              log = [
                  {'period':period,'matched_variant':matched,'score':score,'date':date,'title':row.get('title'),'art_code':art_code(row)}
                  for score,date,row,matched in candidates[:20]
              ]
              return candidates[0][2], log

          def choose_latest_quarter() -> tuple[dict[str, Any], str, list[dict[str, Any]]]:
              desired = [
                  (['2026年第三季度报告','2026年三季度报告'], '2026Q3'),
                  (['2026年第一季度报告','2026年一季度报告'], '2026Q1'),
                  (['2025年第三季度报告','2025年三季度报告'], '2025Q3'),
                  (['2025年第一季度报告','2025年一季度报告'], '2025Q1'),
              ]
              combined: list[dict[str, Any]] = []
              for variants, period in desired:
                  try:
                      row, log = choose_report(variants, period)
                      combined.extend(log)
                      return row, period, combined
                  except RuntimeError:
                      continue
              raise RuntimeError('Missing latest quarterly report')

          selected: list[dict[str, Any]] = []
          candidate_logs: dict[str, Any] = {}

          for spec in annual_specs:
              row, log = choose_report(spec['variants'], spec['period'])
              candidate_logs[f"{spec['period']}年年度报告"] = log
              selected.append({
                  'key':spec['variants'][0], 'period':spec['period'], 'filename':spec['filename'],
                  'min_pages':spec['min_pages'], 'doc_type':'年度报告', 'row':row,
              })

          quarter_row, quarter_period, quarter_log = choose_latest_quarter()
          candidate_logs['最新季报'] = quarter_log
          quarter_label = {
              '2026Q3':'2026年第三季度报告',
              '2026Q1':'2026年第一季度报告',
              '2025Q3':'2025年第三季度报告',
              '2025Q1':'2025年第一季度报告',
          }[quarter_period]
          selected.append({
              'key':compact(str(quarter_row.get('title') or '')), 'period':quarter_period,
              'filename':f'07_老百姓_{quarter_label}_最新季报.pdf',
              'min_pages':5, 'doc_type':'最新季报', 'row':quarter_row,
          })

          def fetch_pdf(art: str, referer: str) -> tuple[bytes, dict[str, Any], str]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art}_1.pdf',
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(5):
                      try:
                          response = session.get(url, timeout=(30, 420), allow_redirects=True, headers={
                              'User-Agent':session.headers['User-Agent'], 'Referer':referer,
                              'Accept':'application/pdf,*/*;q=0.8',
                          })
                          last = {'url':url,'status':response.status_code,'final_url':response.url,'content_type':response.headers.get('content-type',''),'bytes':len(response.content)}
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 30_000:
                              return response.content, last, url
                      except Exception as exc:
                          last = {'url':url,'error':repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {art}: {last}')

          manifest: list[dict[str, Any]] = []
          for index, spec in enumerate(selected, 1):
              row = spec.pop('row')
              art = art_code(row)
              if not art:
                  raise RuntimeError(f'No art code for {spec["filename"]}')
              detail_page = f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html'
              data, download_meta, mirror_pdf = fetch_pdf(art, detail_page)
              destination = ROOT / spec['filename']
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {destination.name}: {pages} < {spec["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(20, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              identity_ok = any(x in extracted for x in ['老百姓','603883','老百姓大药房'])
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {destination.name}')

              subprocess.run(
                  ['qpdf','--warning-exit-0','--check',str(destination)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview_prefix = VALIDATION_PREVIEWS / f'{index:02d}'
              subprocess.run([
                  'pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(destination),str(preview_prefix)
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview render failed: {destination.name}')

              sha256 = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **spec,
                  'announcement_title':row.get('title'),
                  'announcement_date':row.get('display_time'),
                  'art_code':art,
                  'announcement_detail_page':detail_page,
                  'mirror_pdf_url':mirror_pdf,
                  'official_cninfo_index':f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK_CODE}',
                  'official_sse_profile':f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK_CODE}',
                  'actual_pages':pages,
                  'bytes':len(data),
                  'sha256':sha256,
                  'identity_text_check':identity_ok,
                  'download_meta':download_meta,
                  'validation':['PDF header','announcement-title match','issuer identity','minimum page count','qpdf structure','first-page render'],
              })

          readme = [
              '老百姓大药房连锁股份有限公司（603883.SH）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-15',
              '',
              '本包收录2020年至2025年全部完整年度报告，以及截至整理日最新已正式披露的独立季度报告。',
              '年度报告均为全文，不以年度报告摘要替代；如同一年度存在修订版或更正后版本，优先收录最新修订文件。',
              '半年度报告不属于“季报”，因此未混入本标准包。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件类型：{item['doc_type']}；公告标题：{item['announcement_title']}",
                  f"   公告日期：{item['announcement_date']}；实际页数：{item['actual_pages']}页",
                  f"   公告页面：{item['announcement_detail_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '来源说明：PDF由公开公告镜像下载，并与证券代码、公司名称、公告标题和报告年份逐一匹配；包内保留公告页面及官方信息披露索引。',
              '核验项目：PDF文件头、公告标题、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_selection_log.json').write_text(json.dumps(candidate_logs, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'announcement_search_pages.json').write_text(json.dumps(search_pages, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file_path in sorted(ROOT.rglob('*')):
                  if file_path.is_file():
                      archive.write(file_path, arcname=f'{PACKAGE}/{file_path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != 7:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          alias_path = Path('laobaixing_603883_2020_2025_annual_latest_quarterly.zip')
          alias_path.write_bytes(zip_path.read_bytes())
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha256)
          print('LATEST_QUARTER', quarter_period, quarter_label)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: laobaixing-603883-annual-reports-final
          path: |
            老百姓_603883_2020-2025年报及最新季报.zip
            laobaixing_603883_2020_2025_annual_latest_quarterly.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
