name: Package Ledman broker research reports

on:
  pull_request:
    paths:
      - 'tasks/ledman-broker-reports-20261004.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE = '300162'
          COMPANY = '雷曼光电'
          FULL_NAME = '深圳雷曼光电科技股份有限公司'
          AS_OF = '2026-10-04'
          WORK = Path('ledman_work')
          DOWNLOADS = WORK / 'downloads'
          VERIFY = WORK / 'verify'
          FINAL_ROOT = WORK / 'final'
          ART = Path('artifact_out')
          for path in (DOWNLOADS, VERIFY, FINAL_ROOT, ART):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          retry = Retry(total=5, connect=5, read=5, status=5, backoff_factor=1.0,
                        status_forcelist=[429, 500, 502, 503, 504],
                        allowed_methods=['GET'], raise_on_status=False)
          session.mount('https://', HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:110]

          def query_page(page: int) -> list[dict]:
              params = {
                  'industryCode': '*', 'pageSize': '200', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2000-01-01', 'endTime': AS_OF,
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'code': CODE, 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              response = session.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=(25, 150))
              print('API', response.status_code, len(response.content), response.url, flush=True)
              response.raise_for_status()
              return response.json().get('data') or []

          rows = []
          for page in range(1, 8):
              batch = query_page(page)
              rows.extend(batch)
              if len(batch) < 200:
                  break

          unique = {}
          for row in rows:
              blob = json.dumps(row, ensure_ascii=False)
              if CODE not in blob and COMPANY not in blob and FULL_NAME not in blob:
                  continue
              key = str(row.get('infoCode') or row.get('id') or blob)
              unique[key] = row

          # Ensure the known Shanghai Securities long-form report is included even if API pagination changes.
          unique.setdefault('AP202112061533150439', {
              'infoCode': 'AP202112061533150439',
              'title': '小间距显示进入高速成长期，COB封装迎来增长拐点',
              'orgSName': '上海证券',
              'publishDate': '2021-12-06 00:00:00.000',
              'reportType': 2,
              'stockCode': CODE,
              'stockName': COMPANY,
          })

          metadata = list(unique.values())
          metadata.sort(key=lambda item: str(item.get('publishDate') or ''), reverse=True)
          (WORK / 'all_metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          print('METADATA_COUNT', len(metadata), flush=True)
          for row in metadata:
              print('META', json.dumps({key: row.get(key) for key in (
                  'infoCode', 'title', 'orgSName', 'publishDate', 'reportType',
                  'attachPages', 'attachSize', 'author', 'emRatingName'
              )}, ensure_ascii=False), flush=True)

          deep_terms = [
              '深度', '首次覆盖', '首次', '公司研究', '专题', '小间距', 'COB',
              'MicroLED', 'Micro LED', 'MiniLED', 'Mini LED', '超高清', '显示',
              '增长拐点', '拐点', '龙头', '成长', '全产业链', '新周期', '新赛道'
          ]
          shallow_terms = [
              '点评', '季报', '年报', '中报', '业绩快报', '业绩预告', '跟踪',
              '简评', '事件点评', '调研', '更新报告', '询价', '申购'
          ]

          def meta_score(row: dict) -> tuple:
              title = str(row.get('title') or '')
              score = 0
              if '深度' in title or '首次覆盖' in title:
                  score += 60
              score += sum(7 for term in deep_terms if term.lower() in title.lower())
              score -= sum(10 for term in shallow_terms if term in title)
              try:
                  pages = int(row.get('attachPages') or 0)
              except Exception:
                  pages = 0
              score += min(pages, 80) // 3
              return (score, pages, str(row.get('publishDate') or ''))

          candidates = sorted(metadata, key=meta_score, reverse=True)

          def download_pdf(info_code: str, target: Path) -> str:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              last = None
              for url in urls:
                  try:
                      response = session.get(url, headers={'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'}, timeout=(30, 240))
                      print('PDF', info_code, response.status_code, len(response.content), url, flush=True)
                      if response.status_code == 200 and len(response.content) > 70_000 and response.content.startswith(b'%PDF'):
                          target.write_bytes(response.content)
                          return url
                  except Exception as exc:
                      last = exc
                      print('PDF_ERROR', info_code, url, repr(exc), flush=True)
              raise RuntimeError(f'No valid PDF variant: {last!r}')

          valid = []
          seen_sha = set()
          for row in candidates[:100]:
              info = str(row.get('infoCode') or '')
              if not info:
                  continue
              title = str(row.get('title') or '').strip() or info
              broker = str(row.get('orgSName') or row.get('orgName') or '未知券商').strip()
              date = str(row.get('publishDate') or '')[:10]
              target = DOWNLOADS / f'{info}.pdf'
              try:
                  source_url = download_pdf(info, target)
                  reader = PdfReader(str(target), strict=False)
                  pages = len(reader.pages)
                  if pages < 3:
                      target.unlink(missing_ok=True)
                      continue

                  sample_indices = list(range(min(18, pages)))
                  if pages > 20:
                      sample_indices += list(range(max(0, pages - 3), pages))
                  parts = []
                  for index in dict.fromkeys(sample_indices):
                      try:
                          parts.append(reader.pages[index].extract_text() or '')
                      except Exception:
                          pass
                  sample = '\n'.join(parts)
                  compact = re.sub(r'\s+', '', sample)
                  identity = COMPANY in compact or FULL_NAME in compact or CODE in compact or COMPANY in title
                  research = any(term in compact for term in ('证券研究报告', '公司研究', '深度研究', '首次覆盖', '投资评级', '分析师'))
                  if not identity or not research:
                      print('REJECT_IDENTITY', info, title, pages, identity, research, flush=True)
                      target.unlink(missing_ok=True)
                      continue

                  check = subprocess.run(['qpdf', '--check', str(target)], capture_output=True, text=True)
                  if check.returncode not in (0, 3):
                      raise RuntimeError('qpdf check failed: ' + check.stderr[-800:])

                  first_prefix = VERIFY / f'{info}_first'
                  last_prefix = VERIFY / f'{info}_last'
                  first = subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-singlefile', '-png', '-r', '70', str(target), str(first_prefix)], capture_output=True, text=True)
                  last_page = subprocess.run(['pdftoppm', '-f', str(pages), '-l', str(pages), '-singlefile', '-png', '-r', '70', str(target), str(last_prefix)], capture_output=True, text=True)
                  if first.returncode != 0 or last_page.returncode != 0:
                      raise RuntimeError('page rendering failed')

                  data = target.read_bytes()
                  sha = hashlib.sha256(data).hexdigest()
                  if sha in seen_sha:
                      target.unlink(missing_ok=True)
                      continue
                  seen_sha.add(sha)

                  score = 0
                  if '深度' in title or '首次覆盖' in title:
                      score += 70
                  score += sum(8 for term in deep_terms if term.lower() in title.lower())
                  score -= sum(13 for term in shallow_terms if term in title)
                  score += 40 if pages >= 30 else 32 if pages >= 20 else 24 if pages >= 12 else 15 if pages >= 8 else 6
                  rec = {
                      'info_code': info,
                      'title': title,
                      'broker': broker,
                      'publish_date': date,
                      'pages': pages,
                      'bytes': len(data),
                      'sha256': sha,
                      'source_url': source_url,
                      'report_type': row.get('reportType'),
                      'rating': row.get('emRatingName'),
                      'author': row.get('author'),
                      'score': score,
                      'file': str(target),
                  }
                  valid.append(rec)
                  print('VALID', json.dumps({key: rec[key] for key in ('title', 'broker', 'publish_date', 'pages', 'score')}, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('PROBE_ERROR', info, title, repr(exc), flush=True)
                  target.unlink(missing_ok=True)

          if len(valid) < 2:
              raise RuntimeError(f'Only {len(valid)} complete company research PDFs passed validation')

          valid.sort(key=lambda item: (item['score'], item['pages'], item['publish_date']), reverse=True)
          long_form = [item for item in valid if item['pages'] >= 10 and not any(term in item['title'] for term in ('季报', '年报点评', '中报点评', '询价', '申购'))]
          pool = long_form if len(long_form) >= 2 else valid

          selected = []
          used_brokers = set()
          for item in pool:
              if item['broker'] in used_brokers:
                  continue
              selected.append(item)
              used_brokers.add(item['broker'])
              if len(selected) == 3:
                  break
          if len(selected) < min(3, len(pool)):
              for item in pool:
                  if item not in selected:
                      selected.append(item)
                  if len(selected) == 3:
                      break
          selected = selected[:3]

          package_name = f'雷曼光电_300162.SZ_券商研究报告_{len(selected)}份'
          final_dir = FINAL_ROOT / package_name
          final_dir.mkdir(parents=True, exist_ok=True)
          final_records = []
          for index, item in enumerate(selected, start=1):
              filename = f'{index:02d}_{safe(item["publish_date"])}_{safe(item["broker"])}_{safe(item["title"])}.pdf'
              shutil.copy2(item['file'], final_dir / filename)
              record = {key: value for key, value in item.items() if key not in ('file', 'score')}
              record['filename'] = filename
              final_records.append(record)

          readme = [
              '雷曼光电（300162.SZ）券商研究报告合集',
              f'整理日期：{AS_OF}',
              '',
              '筛选口径：优先完整公司深度、首次覆盖及专题研究；如长篇直接覆盖不足，再选取公司分析内容较完整的研究报告。未使用网页摘要、行情快讯或无关行业材料。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(final_records, start=1):
              readme.extend([
                  f'{index}. {record["filename"]}',
                  f'   券商：{record["broker"]}',
                  f'   标题：{record["title"]}',
                  f'   日期：{record["publish_date"]}；页数：{record["pages"]}',
                  f'   评级：{record.get("rating") or "未标注"}；分析师：{record.get("author") or "未标注"}',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])
          readme.append('完整性核验：已检查PDF文件头、公司身份、券商研究属性、实际页数、qpdf结构、首末页渲染、重复文件、SHA-256及ZIP CRC。')
          (final_dir / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (final_dir / 'manifest.json').write_text(json.dumps(final_records, ensure_ascii=False, indent=2), encoding='utf-8')
          (final_dir / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in final_records), encoding='utf-8')

          zip_path = ART / f'{package_name}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(final_dir.iterdir()):
                  archive.write(path, arcname=f'{package_name}/{path.name}')
          with zipfile.ZipFile(zip_path, 'r') as archive:
              bad = archive.testzip()
              pdf_count = sum(1 for name in archive.namelist() if name.lower().endswith('.pdf'))
              if bad:
                  raise RuntimeError(f'ZIP CRC failure at {bad}')
              if pdf_count != len(final_records):
                  raise RuntimeError(f'ZIP PDF count mismatch: {pdf_count} vs {len(final_records)}')

          print('SELECTED_FINAL', json.dumps(final_records, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ledman-broker-reports-artifact
          path: artifact_out/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
