name: Temporary Pingtan iyanbao fast query v13

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-iyanbao-fast-v13.yml]

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Query exact search pages and recover file URLs
        run: |
          mkdir -p out/pages out/pdfs
          python - <<'PY'
          import hashlib,html,json,re,time
          from pathlib import Path
          from urllib.parse import quote,urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          O=Path('out');H=O/'pages';P=O/'pdfs'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.iyanbao.com/'})
          logs=[];results=[];links=set();details=set();pdfs=[];seen=set()
          def note(*a):x=' '.join(map(str,a));print(x,flush=True);logs.append(x)
          def dec(r):
              r.encoding=r.apparent_encoding or r.encoding or 'utf-8';return r.text
          def harvest(t,b):
              raw=html.unescape(t).replace('\\/','/')
              soup=BeautifulSoup(t,'html.parser')
              for tag in soup.find_all(True):
                  for a in ['href','src','data','value','action','data-url','data-file','data-href']:
                      v=tag.get(a)
                      if isinstance(v,str) and v.strip():
                          u=urljoin(b,v.strip());links.add(u)
                          if re.search(r'/detail/\d+',u):details.add(u)
              for u in re.findall(r'https?://[^\s"\'<>]+',raw,re.I):links.add(u.rstrip('),;'))
          def save_pdf(c,u,tag):
              if len(c)<1500 or not c.lstrip().startswith(b'%PDF'):return False
              h=hashlib.sha256(c).hexdigest()
              if h in seen:return True
              seen.add(h);f=P/f'{tag}_{h[:10]}.pdf';f.write_bytes(c)
              try:
                  rd=PdfReader(str(f));pages=len(rd.pages);tx=''
                  for pg in rd.pages[:5]:
                      try:tx+='\n'+(pg.extract_text() or '')
                      except:pass
              except Exception as e:note('BADPDF',u,repr(e));f.unlink(missing_ok=True);return False
              ident=any(k in tx for k in ['平潭发展','中福实业','000592'])
              pdfs.append({'file':f.name,'url':u,'pages':pages,'bytes':len(c),'identity':ident,'sha256':h,'text_prefix':tx[:700]});note('SAVEDPDF',f.name,pages,ident,u);return True
          # get home for cookies
          try:s.get('https://www.iyanbao.com/',timeout=30)
          except:pass
          terms=['平潭发展','中福实业','000592','乘平潭开发东风','依托林业资产']
          for i,q in enumerate(terms):
              u='https://www.iyanbao.com/search?keyword='+quote(q)
              try:
                  r=s.get(u,timeout=45,allow_redirects=True);t=dec(r);H.joinpath(f'search_{i}.html').write_text(t,encoding='utf-8',errors='ignore');harvest(t,r.url)
                  note('SEARCH',q,r.status_code,len(r.content),r.url,'DETAILS',len(details))
                  results.append({'term':q,'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'title':BeautifulSoup(t,'html.parser').title.string if BeautifulSoup(t,'html.parser').title else None,'prefix':t[:1200]})
              except Exception as e:note('SEARCHERR',q,repr(e));results.append({'term':q,'error':repr(e)})
          # inspect target detail pages only
          matched=[]
          for i,u in enumerate(sorted(details)):
              try:
                  r=s.get(u,timeout=45);t=dec(r);H.joinpath(f'detail_{i}.html').write_text(t,encoding='utf-8',errors='ignore');harvest(t,r.url)
                  target=any(k in t for k in ['平潭发展','中福实业','000592','乘平潭开发东风','依托林业资产'])
                  if target:matched.append({'url':u,'final':r.url,'bytes':len(r.content),'title':BeautifulSoup(t,'html.parser').title.string if BeautifulSoup(t,'html.parser').title else None});note('MATCH',u)
              except Exception as e:note('DETAILERR',u,repr(e))
          # follow only file/download links after details
          follow=[]
          for u in links:
              low=u.lower()
              if ('iyanbao.com' in low) and any(k in low for k in ['file.iyanbao','.pdf','download','attachment','reportfile','viewpdf']):follow.append(u)
          for i,u in enumerate(list(dict.fromkeys(follow))[:250]):
              try:
                  r=s.get(u,timeout=60,allow_redirects=True);note('FOLLOW',i,r.status_code,len(r.content),r.headers.get('content-type'),r.url);save_pdf(r.content,r.url,f'file_{i}')
              except Exception as e:note('FOLLOWERR',i,u,repr(e))
          O.joinpath('results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          O.joinpath('details.json').write_text(json.dumps(sorted(details),ensure_ascii=False,indent=2),encoding='utf-8')
          O.joinpath('matched.json').write_text(json.dumps(matched,ensure_ascii=False,indent=2),encoding='utf-8')
          O.joinpath('links.json').write_text(json.dumps(sorted(links),ensure_ascii=False,indent=2),encoding='utf-8')
          O.joinpath('pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          O.joinpath('log.txt').write_text('\n'.join(logs),encoding='utf-8')
          note('DONE','DETAILS',len(details),'MATCHED',len(matched),'PDFS',len(pdfs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-iyanbao-fast-v13
          path: out/
          retention-days: 3
