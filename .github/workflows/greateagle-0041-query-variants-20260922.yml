name: Test Great Eagle query variants
on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-query-variants-20260922.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          mkdir output
          python - <<'PY'
          import concurrent.futures,json
          from pathlib import Path
          import requests
          qs=['鹰君','鹰君 00041','00041 鹰君','鹰君集团','鷹君集團','Great Eagle Holdings','Great Eagle 0041','00041']
          def f(q):
            s=requests.Session(); s.trust_env=False
            s.headers.update({'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Accept':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
            body={'order':'2','pdfPage':'-1','pageNum':1,'pageSize':20,'paragraphSize':3,'keywords':q}
            try:
              r=s.post('https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth',json=body,timeout=(10,30)); d=r.json()
              dl=(d.get('data') or {}).get('dataList') or []
              return {'q':q,'status':r.status_code,'count':(d.get('data') or {}).get('count'),'pageCount':(d.get('data') or {}).get('pageCount'),'docs':[{'docId':x.get('docId'),'title':x.get('title'),'orgName':x.get('orgName'),'stocks':x.get('stocks'),'pageNum':x.get('pageNum'),'pubTimeStr':x.get('pubTimeStr'),'reportType':x.get('reportType')} for x in dl]}
            except Exception as e:return {'q':q,'error':repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex: rows=list(ex.map(f,qs))
          Path('output/results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-query-variants
          path: output
          retention-days: 7
