name: Inspect AviChina report page pagination
on:
  push:
    branches: [tmp-avichina-site-inspect-20260908]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          mkdir -p output
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          base='https://www.avichina.com/sycd/ggygz/dqbg/'
          urls=[base,base+'index_1.html',base+'index_2.html',base+'index_3.html',base+'?page=2',base+'?pageNum=2',base+'?currentPage=2']
          out=[]
          for u in urls:
              try:
                  r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=90,allow_redirects=True)
                  soup=BeautifulSoup(r.text,'lxml')
                  links=[]
                  for a in soup.find_all('a',href=True):
                      text=' '.join(a.get_text(' ',strip=True).split())
                      href=urljoin(r.url,a['href'])
                      if any(k in text for k in ['年度报告','年度報告','中期报告','中期報告','2020','2021','2022','2023','2024','2025']):
                          links.append({'text':text,'href':href})
                  scripts=[]
                  for s in soup.find_all('script'):
                      src=s.get('src')
                      txt=s.string or s.get_text() or ''
                      if src or any(k in txt for k in ['page','Page','ajax','list','total']):
                          scripts.append({'src':urljoin(r.url,src) if src else None,'text':txt[:20000]})
                  rec={'url':u,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'links':links,'scripts':scripts}
                  out.append(rec)
                  print('URL',u,r.status_code,r.url,'LINKS',json.dumps(links,ensure_ascii=False),flush=True)
              except Exception as e:
                  out.append({'url':u,'error':repr(e)}); print('ERR',u,repr(e),flush=True)
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avichina-site-inspect
          path: output/result.json
          retention-days: 1
