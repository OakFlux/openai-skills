name: Package Huatu Cendes annual reports

on:
  push:
    paths:
      - '.github/workflows/package-huatu-cendes-300492-annual-reports-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Discover, download, validate, and package reports
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests

          AS_OF = '2026-10-15'
          CODE = '300492'
          PACKAGE = '华图山鼎_300492_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / 'PDF文件'
          VERIFY_DIR = ROOT / '验证记录'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          VERIFY_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          session.headers.update({
              'User-Agent': UA,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def strip_html(text: Any) -> str:
              return re.sub(r'<[^>]+>', '', str(text or '')).replace('&nbsp;', ' ').strip()

          def compact(text: Any) -> str:
              value = strip_html(text).replace('：', ':')
              return re.sub(r'[\s:：()（）【】\[\]<>《》]+', '', value)

          def notice_date(item: dict[str, Any]) -> str:
              return str(item.get('notice_date') or item.get('display_time') or '')[:10]

          # Fetch the complete public announcement index for the company.
          announcement_api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          announcements: list[dict[str, Any]] = []
          seen = set()
          page_snapshots = []
          for page in range(1, 30):
              response = session.get(
                  announcement_api,
                  params={
                      'sr': '-1',
                      'page_size': '100',
                      'page_index': str(page),
                      'ann_type': 'A',
                      'client_source': 'web',
                      'stock_list': CODE,
                  },
                  headers={
                      'User-Agent': UA,
                      'Referer': f'https://data.eastmoney.com/notices/stock/{CODE}.html',
                  },
                  timeout=90,
              )
              response.raise_for_status()
              payload = response.json()
              rows = (payload.get('data') or {}).get('list') or []
              page_snapshots.append({'page': page, 'count': len(rows), 'rows': rows})
              print('ANNOUNCEMENT_PAGE', page, 'ROWS', len(rows), flush=True)
              if not rows:
                  break
              for item in rows:
                  key = str(item.get('art_code') or item.get('announcement_id') or '')
                  if key and key not in seen:
                      seen.add(key)
                      announcements.append(item)
              dates = [notice_date(item) for item in rows if notice_date(item)]
              if dates and min(dates) < '2019-01-01':
                  break

          if not announcements:
              raise RuntimeError('No public announcement metadata returned for 300492')

          (VERIFY_DIR / '东方财富公告索引快照.json').write_text(
              json.dumps({'pages': page_snapshots, 'announcements': announcements}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          annual_exclusions = (
              '摘要', '英文', '独立意见', '问询', '回复', '监管', '说明', '社会责任',
              '环境报告', '内部控制', '审计报告', '鉴证报告', '专项报告', '更正公告',
              '董事会', '监事会', '审议', '提示性公告',
          )

          annual_by_year: dict[int, dict[str, Any]] = {}
          for item in announcements:
              title = compact(item.get('title'))
              if any(term in title for term in annual_exclusions):
                  continue
              match = re.search(r'(20\d{2})年年度报告(?:全文)?(?:修订版|更新后|更正后)?$', title)
              if not match:
                  continue
              year = int(match.group(1))
              if not 2020 <= year <= 2025:
                  continue
              old = annual_by_year.get(year)
              if old is None or (notice_date(item), int(item.get('art_code', '0').replace('AN', '') or 0)) > (
                  notice_date(old), int(str(old.get('art_code', '0')).replace('AN', '') or 0)
              ):
                  annual_by_year[year] = item

          annual_years = sorted(annual_by_year)
          if annual_years != [2020, 2021, 2022, 2023, 2024, 2025]:
              candidates = [
                  {'title': strip_html(item.get('title')), 'date': notice_date(item), 'art_code': item.get('art_code')}
                  for item in announcements
                  if '年度报告' in compact(item.get('title')) and '摘要' not in compact(item.get('title'))
              ]
              raise RuntimeError(f'Annual-report coverage mismatch: {annual_years}; candidates={json.dumps(candidates, ensure_ascii=False)}')

          quarter_candidates: list[dict[str, Any]] = []
          for item in announcements:
              title = compact(item.get('title'))
              if any(term in title for term in ('摘要', '英文', '问询', '回复', '说明')):
                  continue
              if re.search(r'2026年第(?:一|三)季度报告(?:全文)?$', title):
                  quarter_candidates.append(item)

          if not quarter_candidates:
              raise RuntimeError('No formal 2026 quarterly report found in the announcement index')

          latest_quarter = max(quarter_candidates, key=lambda item: (notice_date(item), str(item.get('art_code') or '')))
          latest_quarter_title = strip_html(latest_quarter.get('title'))
          quarter_label = '第三季度报告' if '第三季度' in latest_quarter_title else '第一季度报告'

          selections: list[dict[str, Any]] = []
          for index, year in enumerate(annual_years, start=1):
              item = annual_by_year[year]
              selections.append({
                  'kind': '年度报告',
                  'year': year,
                  'title': strip_html(item.get('title')),
                  'date': notice_date(item),
                  'row': item,
                  'filename': f'{index:02d}_华图山鼎_{year}年年度报告.pdf',
              })
          selections.append({
              'kind': '最新季报',
              'year': 2026,
              'title': latest_quarter_title,
              'date': notice_date(latest_quarter),
              'row': latest_quarter,
              'filename': f'07_华图山鼎_2026年{quarter_label}_最新季报.pdf',
          })

          (VERIFY_DIR / '选中文件元数据.json').write_text(
              json.dumps(selections, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          def download_pdf(item: dict[str, Any], destination: Path) -> tuple[str, list[dict[str, Any]]]:
              art_code = str(item.get('art_code') or '')
              if not art_code:
                  raise RuntimeError('Selected announcement has no art_code')
              public_page = f'https://data.eastmoney.com/notices/detail/{CODE}/{art_code}.html'
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{art_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{art_code}_1.pdf',
              ]
              attempts = []
              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': UA,
                                  'Referer': public_page,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=240,
                              allow_redirects=True,
                          )
                          meta = {
                              'requested_url': url,
                              'final_url': response.url,
                              'status': response.status_code,
                              'content_type': response.headers.get('content-type'),
                              'bytes': len(response.content),
                              'attempt': attempt,
                          }
                          attempts.append(meta)
                          if response.status_code == 200 and response.content.startswith(b'%PDF') and len(response.content) > 50_000:
                              destination.write_bytes(response.content)
                              return response.url, attempts
                      except Exception as exc:
                          attempts.append({'requested_url': url, 'attempt': attempt, 'error': repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError('PDF download failed: ' + json.dumps({'art_code': art_code, 'attempts': attempts}, ensure_ascii=False))

          records = []
          hashes = set()
          identity_terms = ('华图山鼎', '山鼎设计', '四川山鼎', CODE)

          for selection in selections:
              path = PDF_DIR / selection['filename']
              source_url, attempts = download_pdf(selection['row'], path)
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError('Duplicate PDF content: ' + path.name)
              hashes.add(digest)

              qpdf = subprocess.run(['qpdf', '--warning-exit-0', '--check', str(path)], capture_output=True, text=True)
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf failed for {path.name}: {qpdf.stderr[-2000:]}')

              info = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True)
              if info.returncode != 0:
                  raise RuntimeError(f'pdfinfo failed for {path.name}: {info.stderr[-1500:]}')
              page_match = re.search(r'^Pages:\s+(\d+)', info.stdout, re.M)
              if not page_match:
                  raise RuntimeError('Page count unavailable for ' + path.name)
              pages = int(page_match.group(1))
              if pages < 1:
                  raise RuntimeError('No pages in ' + path.name)

              text_path = VERIFY_DIR / (path.stem + '_前12页.txt')
              text_run = subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(12, pages)), '-layout', str(path), str(text_path)],
                  capture_output=True,
                  text=True,
              )
              if text_run.returncode != 0:
                  raise RuntimeError(f'pdftotext failed for {path.name}: {text_run.stderr[-1500:]}')
              extracted = compact(text_path.read_text(encoding='utf-8', errors='replace'))
              if not any(term in extracted for term in identity_terms):
                  raise RuntimeError('Company identity check failed for ' + path.name)
              if str(selection['year']) not in extracted:
                  raise RuntimeError('Year identity check failed for ' + path.name)
              if selection['kind'] == '年度报告' and '年度报告' not in extracted:
                  raise RuntimeError('Annual-report identity check failed for ' + path.name)
              if selection['kind'] == '最新季报' and '季度报告' not in extracted:
                  raise RuntimeError('Quarterly-report identity check failed for ' + path.name)

              render_prefix = VERIFY_DIR / (path.stem + '_首页')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(path), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page rendering failed for {path.name}: {render.stderr[-1200:]}')
              render_bytes = render_file.stat().st_size
              render_file.unlink()

              art_code = str(selection['row'].get('art_code') or '')
              record = {
                  'filename': 'PDF文件/' + path.name,
                  'document_type': selection['kind'],
                  'title': selection['title'],
                  'report_year': selection['year'],
                  'disclosure_date': selection['date'],
                  'eastmoney_art_code': art_code,
                  'public_announcement_page': f'https://data.eastmoney.com/notices/detail/{CODE}/{art_code}.html',
                  'download_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_bytes,
                  'download_attempts': attempts,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '华图山鼎（300492.SZ）2020-2025年年度报告及最新季度报告',
              f'整理日期：{AS_OF}',
              '',
              '本压缩包共收录7份完整PDF：',
              '1. 2020-2025年年度报告全文，共6份；',
              f'2. 截至整理日已披露的最新正式季度报告：{latest_quarter_title}，共1份。',
              '',
              '年度报告均为报告全文，不以摘要替代；最新季报按第一季度报告或第三季度报告口径确定，半年度报告不作为季报替代。',
              '文件通过公开公告索引筛选并下载公告PDF镜像，已完成PDF结构、页数、公司与年份身份及首页渲染检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, start=1):
              readme += [
                  f'{index}. {record["title"]}',
                  f'   文件：{record["filename"]}',
                  f'   披露日期：{record["disclosure_date"]}',
                  f'   页数：{record["pages"]}',
                  f'   公告页面：{record["public_announcement_page"]}',
                  f'   PDF来源：{record["download_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]

          (ROOT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file in sorted(ROOT.rglob('*')):
                  if file.is_file():
                      archive.write(file, arcname=f'{PACKAGE}/{file.relative_to(ROOT)}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad is not None or len(pdfs) != 7:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}')

          final = {
              'filename': zip_path.name,
              'bytes': zip_path.stat().st_size,
              'sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'pdf_count': len(records),
              'annual_years': [2020, 2021, 2022, 2023, 2024, 2025],
              'latest_quarter': latest_quarter_title,
              'pages': [record['pages'] for record in records],
          }
          print('FINAL_PACKAGE', json.dumps(final, ensure_ascii=False), flush=True)
          PY

      - name: Upload completed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: huatu-cendes-300492-annual-reports-20261015
          path: 华图山鼎_300492_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
