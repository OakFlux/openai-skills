name: Package Huatu Cendes annual reports

on:
  push:
    paths:
      - '.github/workflows/package-huatu-cendes-300492-annual-reports-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Discover, download, validate, and package reports
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests

          AS_OF = '2026-10-15'
          CODE = '300492'
          PACKAGE = '华图山鼎_300492_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / 'PDF文件'
          VERIFY_DIR = ROOT / '验证记录'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          VERIFY_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          session.headers.update({
              'User-Agent': UA,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
          stock_variants = [
              ('szse', 'sz', '300492,szse300492'),
              ('szse', 'sz', '300492,szse0300492'),
              ('szse', 'sz', '300492'),
          ]

          def strip_html(text: Any) -> str:
              return re.sub(r'<[^>]+>', '', str(text or '')).replace('&nbsp;', ' ').strip()

          def compact(text: Any) -> str:
              value = strip_html(text).replace('：', ':')
              return re.sub(r'[\s:：()（）【】\[\]<>《》]+', '', value)

          def disclosure_date(item: dict[str, Any]) -> str:
              path = str(item.get('adjunctUrl') or '')
              match = re.search(r'finalpage/(\d{4}-\d{2}-\d{2})/', path)
              if match:
                  return match.group(1)
              timestamp = int(item.get('announcementTime') or 0)
              if timestamp:
                  return time.strftime('%Y-%m-%d', time.localtime(timestamp / 1000))
              return ''

          def query_cninfo(searchkey: str, date_range: str) -> tuple[list[dict[str, Any]], dict[str, str] | None]:
              best_rows: list[dict[str, Any]] = []
              best_meta = None
              errors = []
              for column, plate, stock in stock_variants:
                  rows: list[dict[str, Any]] = []
                  seen = set()
                  try:
                      for page in range(1, 12):
                          form = {
                              'pageNum': str(page),
                              'pageSize': '30',
                              'column': column,
                              'tabName': 'fulltext',
                              'plate': plate,
                              'stock': stock,
                              'searchkey': searchkey,
                              'secid': '',
                              'category': '',
                              'trade': '',
                              'seDate': date_range,
                              'sortName': '',
                              'sortType': '',
                              'isHLtitle': 'true',
                          }
                          response = session.post(
                              endpoint,
                              data=form,
                              headers={
                                  'User-Agent': UA,
                                  'Referer': 'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search',
                                  'X-Requested-With': 'XMLHttpRequest',
                              },
                              timeout=90,
                          )
                          response.raise_for_status()
                          payload = response.json()
                          batch = payload.get('announcements') or []
                          if not batch:
                              break
                          for item in batch:
                              key = (item.get('announcementId'), item.get('adjunctUrl'))
                              if key not in seen:
                                  seen.add(key)
                                  rows.append(item)
                          total = int(payload.get('totalAnnouncement') or 0)
                          if total and page * 30 >= total:
                              break
                      meta = {'column': column, 'plate': plate, 'stock': stock}
                      print('QUERY', searchkey, date_range, json.dumps(meta, ensure_ascii=False), 'ROWS', len(rows), flush=True)
                      for item in rows:
                          print('ROW', strip_html(item.get('announcementTitle')), item.get('adjunctUrl'), flush=True)
                      if len(rows) > len(best_rows):
                          best_rows = rows
                          best_meta = meta
                      if rows:
                          return rows, meta
                  except Exception as exc:
                      errors.append({'column': column, 'plate': plate, 'stock': stock, 'error': repr(exc)})
              print('QUERY_ERRORS', searchkey, date_range, json.dumps(errors, ensure_ascii=False), flush=True)
              return best_rows, best_meta

          queries = []
          selections: list[dict[str, Any]] = []

          annual_exclusions = (
              '摘要', '英文', '独立意见', '问询', '回复', '监管', '说明', '社会责任',
              '环境报告', '内部控制', '审计报告', '鉴证报告', '专项报告', '更正公告',
          )

          for index, report_year in enumerate(range(2020, 2026), start=1):
              phrase = f'{report_year}年年度报告'
              disclosure_year = report_year + 1
              date_ranges = [
                  f'{disclosure_year}-01-01~{disclosure_year}-12-31',
                  f'{report_year}-01-01~{min(2026, disclosure_year + 1)}-12-31',
                  '2020-01-01~2026-10-15',
              ]
              candidates: list[dict[str, Any]] = []
              for date_range in date_ranges:
                  rows, meta = query_cninfo(phrase, date_range)
                  queries.append({
                      'searchkey': phrase,
                      'date_range': date_range,
                      'query_meta': meta,
                      'count': len(rows),
                      'rows': rows,
                  })
                  for item in rows:
                      title = compact(item.get('announcementTitle'))
                      if phrase not in title:
                          continue
                      if any(term in title for term in annual_exclusions):
                          continue
                      # Accept the direct report, a “全文” version, or a later revised/updated full report.
                      if not any(marker in title for marker in (phrase, phrase + '全文')):
                          continue
                      candidates.append(item)
                  if candidates:
                      break
              if not candidates:
                  raise RuntimeError(f'No full annual report candidate found for {report_year}')

              # Prefer the latest disclosure, so a revised/updated full report supersedes the original.
              chosen = max(
                  candidates,
                  key=lambda item: (
                      disclosure_date(item),
                      int(item.get('announcementTime') or 0),
                      -len(compact(item.get('announcementTitle'))),
                  ),
              )
              title = strip_html(chosen.get('announcementTitle'))
              selections.append({
                  'kind': '年度报告',
                  'year': report_year,
                  'title': title,
                  'date': disclosure_date(chosen),
                  'row': chosen,
                  'filename': f'{index:02d}_华图山鼎_{report_year}年年度报告.pdf',
              })

          quarter_candidates: list[dict[str, Any]] = []
          for phrase in ('2026年第三季度报告', '2026年第一季度报告'):
              rows, meta = query_cninfo(phrase, '2026-01-01~2026-10-15')
              queries.append({
                  'searchkey': phrase,
                  'date_range': '2026-01-01~2026-10-15',
                  'query_meta': meta,
                  'count': len(rows),
                  'rows': rows,
              })
              for item in rows:
                  title = compact(item.get('announcementTitle'))
                  if phrase not in title:
                      continue
                  if any(term in title for term in ('摘要', '英文', '问询', '回复', '说明')):
                      continue
                  quarter_candidates.append(item)

          if not quarter_candidates:
              raise RuntimeError('No formal 2026 quarterly report candidate found')

          latest_quarter = max(
              quarter_candidates,
              key=lambda item: (disclosure_date(item), int(item.get('announcementTime') or 0)),
          )
          latest_quarter_title = strip_html(latest_quarter.get('announcementTitle'))
          quarter_label = '第三季度报告' if '第三季度' in latest_quarter_title else '第一季度报告'
          selections.append({
              'kind': '最新季报',
              'year': 2026,
              'title': latest_quarter_title,
              'date': disclosure_date(latest_quarter),
              'row': latest_quarter,
              'filename': f'07_华图山鼎_2026年{quarter_label}_最新季报.pdf',
          })

          (VERIFY_DIR / 'CNINFO_查询与选中文件.json').write_text(
              json.dumps({'queries': queries, 'selections': selections}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          def download_pdf(item: dict[str, Any], destination: Path) -> tuple[str, list[dict[str, Any]]]:
              adjunct = str(item.get('adjunctUrl') or '')
              if not adjunct:
                  raise RuntimeError('Selected CNINFO item has no adjunctUrl')
              urls = [
                  'https://static.cninfo.com.cn/' + adjunct.lstrip('/'),
                  'http://static.cninfo.com.cn/' + adjunct.lstrip('/'),
              ]
              attempts = []
              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': UA,
                                  'Referer': 'https://www.cninfo.com.cn/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=240,
                              allow_redirects=True,
                          )
                          meta = {
                              'requested_url': url,
                              'final_url': response.url,
                              'status': response.status_code,
                              'content_type': response.headers.get('content-type'),
                              'bytes': len(response.content),
                              'attempt': attempt,
                          }
                          attempts.append(meta)
                          if response.status_code == 200 and response.content.startswith(b'%PDF') and len(response.content) > 50_000:
                              destination.write_bytes(response.content)
                              return response.url, attempts
                      except Exception as exc:
                          attempts.append({'requested_url': url, 'attempt': attempt, 'error': repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError('PDF download failed: ' + json.dumps(attempts, ensure_ascii=False))

          records = []
          hashes = set()
          identity_terms = ('华图山鼎', '山鼎设计', '四川山鼎', CODE)

          for selection in selections:
              path = PDF_DIR / selection['filename']
              source_url, attempts = download_pdf(selection['row'], path)
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError('Duplicate PDF content: ' + path.name)
              hashes.add(digest)

              qpdf = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(path)],
                  capture_output=True,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf failed for {path.name}: {qpdf.stderr[-2000:]}')

              info = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True)
              if info.returncode != 0:
                  raise RuntimeError(f'pdfinfo failed for {path.name}: {info.stderr[-1500:]}')
              page_match = re.search(r'^Pages:\s+(\d+)', info.stdout, re.M)
              if not page_match:
                  raise RuntimeError('Page count unavailable for ' + path.name)
              pages = int(page_match.group(1))
              if pages < 1:
                  raise RuntimeError('No pages in ' + path.name)

              text_path = VERIFY_DIR / (path.stem + '_前12页.txt')
              text_run = subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(12, pages)), '-layout', str(path), str(text_path)],
                  capture_output=True,
                  text=True,
              )
              if text_run.returncode != 0:
                  raise RuntimeError(f'pdftotext failed for {path.name}: {text_run.stderr[-1500:]}')
              extracted = compact(text_path.read_text(encoding='utf-8', errors='replace'))
              if not any(term in extracted for term in identity_terms):
                  raise RuntimeError('Company identity check failed for ' + path.name)
              if str(selection['year']) not in extracted:
                  raise RuntimeError('Year identity check failed for ' + path.name)
              if selection['kind'] == '年度报告' and '年度报告' not in extracted:
                  raise RuntimeError('Annual-report identity check failed for ' + path.name)
              if selection['kind'] == '最新季报' and '季度报告' not in extracted:
                  raise RuntimeError('Quarterly-report identity check failed for ' + path.name)

              render_prefix = VERIFY_DIR / (path.stem + '_首页')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(path), str(render_prefix)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_prefix) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'First-page rendering failed for {path.name}: {render.stderr[-1200:]}')
              render_bytes = render_file.stat().st_size
              render_file.unlink()

              official_url = 'https://static.cninfo.com.cn/' + str(selection['row'].get('adjunctUrl') or '').lstrip('/')
              record = {
                  'filename': 'PDF文件/' + path.name,
                  'document_type': selection['kind'],
                  'title': selection['title'],
                  'report_year': selection['year'],
                  'disclosure_date': selection['date'],
                  'cninfo_announcement_id': selection['row'].get('announcementId'),
                  'official_pdf_url': official_url,
                  'download_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_bytes,
                  'download_attempts': attempts,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '华图山鼎（300492.SZ）2020-2025年年度报告及最新季度报告',
              f'整理日期：{AS_OF}',
              '',
              '本压缩包共收录7份完整PDF：',
              '1. 2020-2025年年度报告全文，共6份；',
              f'2. 截至整理日已披露的最新正式季度报告：{latest_quarter_title}，共1份。',
              '',
              '年度报告均为报告全文，不以摘要替代；最新季报按第一季度报告或第三季度报告口径确定，半年度报告不作为季报替代。',
              '全部PDF来自巨潮资讯公开披露静态文件，并完成PDF结构、页数、公司与年份身份及首页渲染检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, start=1):
              readme += [
                  f'{index}. {record["title"]}',
                  f'   文件：{record["filename"]}',
                  f'   披露日期：{record["disclosure_date"]}',
                  f'   页数：{record["pages"]}',
                  f'   官方PDF：{record["official_pdf_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]

          (ROOT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file in sorted(ROOT.rglob('*')):
                  if file.is_file():
                      archive.write(file, arcname=f'{PACKAGE}/{file.relative_to(ROOT)}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad is not None or len(pdfs) != 7:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}')

          final = {
              'filename': zip_path.name,
              'bytes': zip_path.stat().st_size,
              'sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'pdf_count': len(records),
              'annual_years': [2020, 2021, 2022, 2023, 2024, 2025],
              'latest_quarter': latest_quarter_title,
              'pages': [record['pages'] for record in records],
          }
          print('FINAL_PACKAGE', json.dumps(final, ensure_ascii=False), flush=True)
          PY

      - name: Upload completed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: huatu-cendes-300492-annual-reports-20261015
          path: 华图山鼎_300492_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
