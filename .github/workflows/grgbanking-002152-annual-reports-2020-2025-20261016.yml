name: Build GRG Banking 002152 annual reports package 20261016

on:
  push:
    paths:
      - '.github/workflows/grgbanking-002152-annual-reports-2020-2025-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = '002152'
          SHORT = '广电运通'
          PACKAGE = '广电运通_002152_2020-2025年报及最新季报'
          PREPARED = '2026-10-16'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / '首页预览'
          PREVIEW.mkdir(exist_ok=True)

          annual_specs = [
              (['2020年年度报告','2020年年报'], '2020', '01_广电运通_2020年年度报告.pdf', 80),
              (['2021年年度报告','2021年年报'], '2021', '02_广电运通_2021年年度报告.pdf', 80),
              (['2022年年度报告','2022年年报'], '2022', '03_广电运通_2022年年度报告.pdf', 80),
              (['2023年年度报告','2023年年报'], '2023', '04_广电运通_2023年年度报告.pdf', 80),
              (['2024年年度报告','2024年年报'], '2024', '05_广电运通_2024年年度报告.pdf', 80),
              (['2025年年度报告','2025年年报'], '2025', '06_广电运通_2025年年度报告.pdf', 80),
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/notices/stock/{CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          windows = [
              ('2021-01-01','2021-06-30'),
              ('2022-01-01','2022-06-30'),
              ('2023-01-01','2023-06-30'),
              ('2024-01-01','2024-06-30'),
              ('2025-01-01','2025-06-30'),
              ('2026-01-01','2026-10-16'),
          ]
          rows: list[dict[str, Any]] = []
          query_log: list[dict[str, Any]] = []

          for begin, end in windows:
              for page in range(1, 16):
                  params = {
                      'sr':'-1','page_size':'100','page_index':str(page),
                      'ann_type':'A','client_source':'web','stock_list':CODE,
                      'f_node':'0','s_node':'0','begin_time':begin,'end_time':end,
                  }
                  data = None
                  last: Any = None
                  for attempt in range(8):
                      try:
                          response = session.get(api, params=params, timeout=(20,120))
                          last = {'status':response.status_code,'text':response.text[:300]}
                          if response.status_code == 200:
                              data = response.json()
                              break
                      except Exception as exc:
                          last = {'error':repr(exc)}
                      time.sleep(1 + attempt)
                  if data is None:
                      raise RuntimeError(f'Announcement API failed {begin} to {end}, page {page}: {last}')
                  batch = ((data.get('data') or {}).get('list') or [])
                  query_log.append({'begin':begin,'end':end,'page':page,'count':len(batch)})
                  if not batch:
                      break
                  rows.extend(x for x in batch if isinstance(x, dict))
                  time.sleep(0.08)

          unique: dict[str, dict[str, Any]] = {}
          for row in rows:
              key = str(row.get('art_code') or row.get('artCode') or '')
              if key:
                  unique[key] = row
          rows = list(unique.values())

          def compact(text: Any) -> str:
              return re.sub(r'\s+', '', str(text or ''))

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '')

          def date_value(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or '')

          exclusions = [
              '摘要','英文版','取消','问询','回复','审计报告','董事会','监事会',
              '更正公告','提示性公告','社会责任报告','环境、社会及管治报告',
              '可持续发展报告','独立董事述职报告','内部控制评价报告','财务决算报告',
              '年度报告说明会','年度报告网上说明会','募集资金','会计师事务所',
              '前期会计差错更正后的财务报表','财务报表及相关附注',
          ]

          def choose(variants: list[str], label: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              found: list[tuple[int, str, dict[str, Any], str]] = []
              for row in rows:
                  title = compact(row.get('title'))
                  hit = next((v for v in variants if compact(v) in title), None)
                  if not hit or any(compact(x) in title for x in exclusions):
                      continue
                  score = 50
                  key = compact(hit)
                  if title.endswith(key): score += 35
                  if title == key: score += 20
                  if title.startswith(SHORT) or f'{CODE}:' in title: score += 15
                  if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score += 100
                  if any(x in title for x in ['取消版','已取消']): score -= 100
                  found.append((score, date_value(row), row, hit))
              found.sort(key=lambda x:(x[0],x[1]), reverse=True)
              if not found:
                  titles = sorted({str(r.get('title') or '') for r in rows if any(k in compact(r.get('title')) for k in ['年度报告','季度报告','一季报','三季报'])})
                  raise RuntimeError(f'Missing {label}; variants={variants}; available={titles}')
              log = [
                  {'score':score,'date':date,'title':row.get('title'),'art_code':art_code(row),'variant':hit}
                  for score,date,row,hit in found[:20]
              ]
              return found[0][2], log

          selected: list[dict[str, Any]] = []
          candidate_log: dict[str, Any] = {}
          for variants, period, filename, min_pages in annual_specs:
              row, log = choose(variants, period)
              candidate_log[period] = log
              selected.append({
                  'row':row,'period':period,'filename':filename,
                  'min_pages':min_pages,'doc_type':'年度报告',
              })

          quarter_options = [
              (['2026年第三季度报告','2026年三季度报告'], '2026Q3'),
              (['2026年第一季度报告','2026年一季度报告'], '2026Q1'),
              (['2025年第三季度报告','2025年三季度报告'], '2025Q3'),
              (['2025年第一季度报告','2025年一季度报告'], '2025Q1'),
          ]
          qrow = None
          qperiod = None
          qlog: list[dict[str, Any]] = []
          for variants, period in quarter_options:
              try:
                  qrow, qlog = choose(variants, period)
                  qperiod = period
                  break
              except RuntimeError:
                  continue
          if qrow is None or qperiod is None:
              raise RuntimeError('No independent quarterly report found')
          candidate_log['latest_quarter'] = qlog
          selected.append({
              'row':qrow,'period':qperiod,
              'filename':f'07_广电运通_{qperiod}_最新季报.pdf',
              'min_pages':4,'doc_type':'最新季报',
          })

          def download_pdf(code: str, referer: str) -> tuple[bytes, str, dict[str, Any]]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf',
              ]
              last: dict[str, Any] = {}
              for url in urls:
                  for attempt in range(5):
                      try:
                          response = session.get(url, headers={
                              'User-Agent':session.headers['User-Agent'],
                              'Referer':referer,
                              'Accept':'application/pdf,*/*;q=0.8',
                          }, timeout=(30,420), allow_redirects=True)
                          last = {
                              'url':url,'status':response.status_code,
                              'content_type':response.headers.get('content-type',''),
                              'bytes':len(response.content),'final_url':response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 30_000:
                              return response.content, url, last
                      except Exception as exc:
                          last = {'url':url,'error':repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {code}: {last}')

          manifest: list[dict[str, Any]] = []
          identity_tokens = ['广电运通','002152','广州广电运通','广电运通集团']

          for item in selected:
              row = item.pop('row')
              code = art_code(row)
              if not code:
                  raise RuntimeError(f'No article code for {item["filename"]}')
              detail = f'https://data.eastmoney.com/notices/detail/{CODE}/{code}.html'
              data, pdf_url, meta = download_pdf(code, detail)
              dest = ROOT / item['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Too few pages: {dest.name}, {pages} < {item["min_pages"]}')

              text = ''
              for page in reader.pages[:min(20,pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              if not any(token in text for token in identity_tokens):
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')

              subprocess.run(
                  ['qpdf','--warning-exit-0','--check',str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW / dest.stem
              subprocess.run(
                  ['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(dest),str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(prefix) + '.png')
              if not preview_file.exists() or preview_file.stat().st_size < 5_000:
                  raise RuntimeError(f'Preview render failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **item,
                  'announcement_title':row.get('title'),
                  'announcement_date':row.get('display_time'),
                  'art_code':code,
                  'announcement_page':detail,
                  'pdf_url':pdf_url,
                  'actual_pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'download_meta':meta,
                  'preview_file':str(Path('首页预览') / preview_file.name),
              })

          readme = [
              f'广电运通（{CODE}.SZ）2020—2025年年度报告及最新季度报告资料包',
              f'整理日期：{PREPARED}',
              '',
              '本包收录2020年至2025年六份完整年度报告，以及截至整理日已披露的最新独立季度报告。',
              '若同一年度存在更正后、修订版或更新后版本，优先选用最新版本。',
              '',
          ]
          for index, item in enumerate(manifest,1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   公告标题：{item['announcement_title']}",
                  f"   公告日期：{item['announcement_date']}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   公告页面：{item['announcement_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '来源说明：PDF由公开公告镜像下载，并与证券代码、公告标题和报告期间逐一匹配。',
              '核验项目：PDF文件头、公司名称/证券代码、报告期间、实际页数、qpdf结构、首页渲染、SHA-256及ZIP CRC。',
          ]
          (ROOT / 'README_文件清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps({
              'company':SHORT,'stock_code':CODE,'prepared_on':PREPARED,
              'latest_quarter':qperiod,'files':manifest,
              'candidate_log':candidate_log,'query_log':query_log,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          with (ROOT / 'manifest.csv').open('w', newline='', encoding='utf-8-sig') as handle:
              writer = csv.writer(handle)
              writer.writerow(['文件名','类型','期间','公告标题','公告日期','页数','字节数','SHA-256','公告页面','PDF地址'])
              for item in manifest:
                  writer.writerow([
                      item['filename'],item['doc_type'],item['period'],item['announcement_title'],
                      item['announcement_date'],item['actual_pages'],item['bytes'],item['sha256'],
                      item['announcement_page'],item['pdf_url'],
                  ])
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{item['sha256']}  {item['filename']}" for item in manifest) + '\n',
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path,'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')

          print(json.dumps({
              'package':str(zip_path),
              'zip_bytes':zip_path.stat().st_size,
              'pdf_count':len(manifest),
              'latest_quarter':qperiod,
              'files':[{
                  'name':item['filename'],'pages':item['actual_pages'],
                  'bytes':item['bytes'],'sha256':item['sha256'],
                  'title':item['announcement_title'],'date':item['announcement_date'],
              } for item in manifest],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: grgbanking-002152-2020-2025-annual-latest-quarter-20261016
          path: 广电运通_002152_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
