name: Target CMBI Zenergy research pages v2 20260922

on:
  push:
    paths:
      - '.github/workflows/zenergy-cmbi-targeted-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Target official pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json,html
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False;s.headers['User-Agent']='Mozilla/5.0 Chrome/151 Safari/537.36'
          urls=[
            'https://www.cmbi.com.hk/market-stockreview?lang=cn&page=44',
            'https://www.cmbi.com.hk/market-stockreview?lang=en&page=44',
            'https://www.cmbi.com.hk/market-stockreview?lang=en&page=43',
            'https://www.cmbi.com.hk/market-stockreview?lang=cn&page=43',
            'https://www.cmbi.com.hk/article/13341.html?lang=en',
          ]
          allrec=[]; articles=set(['https://www.cmbi.com.hk/article/13341.html?lang=en'])
          for i,u in enumerate(urls):
            try:
              r=s.get(u,timeout=(20,120));text=r.content.decode('utf-8','replace');Path(f'out/page_{i}.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'html.parser');links=[]
              for a in soup.find_all('a',href=True):
                t=a.get_text(' ',strip=True);h=urljoin(r.url,html.unescape(a['href']))
                if 'zenergy' in (t+' '+h).lower() or '正力新能' in t or '3677' in (t+' '+h):
                  links.append({'text':t,'url':h})
                  if '/article/' in h: articles.add(h)
              allrec.append({'url':u,'status':r.status_code,'final':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links, 'body_hits':[x for x in soup.get_text('\n',strip=True).splitlines() if any(k.lower() in x.lower() for k in ('zenergy','正力新能','3677'))][:30]})
            except Exception as e: allrec.append({'url':u,'error':repr(e)})
          pdfrec=[]
          for au in list(articles):
            base=re.sub(r'\?.*$','',au)
            for lang in ('en','cn'):
              u=base+'?lang='+lang
              try:
                r=s.get(u,timeout=(20,120));text=r.content.decode('utf-8','replace');soup=BeautifulSoup(text,'html.parser')
                ident=re.sub(r'\D','',base.rsplit('/',1)[-1]) or 'unknown'
                Path(f'out/article_{ident}_{lang}.html').write_text(text,encoding='utf-8')
                hits=[]
                for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                  h=html.unescape(m.group(0)).replace('\\/','/')
                  if '.pdf' in h.lower() or 'hk-official.cmbi.info' in h.lower(): hits.append(h)
                for tag in soup.find_all(['a','iframe','embed','object']):
                  v=tag.get('href') or tag.get('src') or tag.get('data')
                  if v:
                    h=urljoin(u,v)
                    if '.pdf' in h.lower() or 'hk-official.cmbi.info' in h.lower(): hits.append(h)
                title_node=soup.find('h1') or soup.title
                pdfrec.append({'article':u,'status':r.status_code,'title':title_node.get_text(' ',strip=True) if title_node else '', 'pdfs':sorted(set(hits))})
              except Exception as e: pdfrec.append({'article':u,'error':repr(e)})
          result={'list':allrec,'articles':sorted(articles),'article_records':pdfrec}
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zenergy-cmbi-targeted-v2
          path: out
          retention-days: 7
          if-no-files-found: error
