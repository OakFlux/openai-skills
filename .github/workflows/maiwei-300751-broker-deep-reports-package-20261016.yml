name: Package Maiwei Technology 300751 broker deep reports 20261016

on:
  push:
    paths:
      - '.github/workflows/maiwei-300751-broker-deep-reports-package-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='迈为股份'
          FULL='苏州迈为科技股份有限公司'
          CODE='300751'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'broker':'东吴证券','date':'2024-09-24',
              'title':'HJT整线设备龙头受益于行业规模扩产在即，泛半导体领域加速布局',
              'info_code':'AP202409241640009034','expected_pages':71,
              'filename':'01_2024-09-24_东吴证券_HJT整线设备龙头受益行业规模扩产_泛半导体领域加速布局.pdf'
            },
            {
              'order':2,'broker':'开源证券','date':'2021-06-02',
              'title':'公司首次覆盖报告：高效光伏设备领跑者，九宫格战略打造平台公司',
              'info_code':'AP202106021495554524','expected_pages':33,
              'filename':'02_2021-06-02_开源证券_首次覆盖_高效光伏设备领跑者_九宫格战略打造平台公司.pdf'
            },
            {
              'order':3,'broker':'华安证券','date':'2021-03-08',
              'title':'能源革命之光伏设备研究系列（一）-迈为股份：迈步向前沿，为首新时代',
              'info_code':'AP202103081469652325','expected_pages':103,
              'filename':'03_2021-03-08_华安证券_能源革命之光伏设备研究系列_迈步向前沿_为首新时代.pdf'
            },
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/300751.html',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf'
            ]
            last={}
            for u in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(u,timeout=(30,480),allow_redirects=True)
                  last={'requested_url':u,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                    return r.content,str(r.url),last
                except Exception as e:
                  last={'requested_url':u,'error':repr(e)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,source_url,download_meta=download_pdf(item['info_code'])
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<18:
              raise RuntimeError(f'Too few pages: {dest.name} = {pages}')
            if abs(pages-item['expected_pages'])>3:
              raise RuntimeError(f'Unexpected page count: {dest.name} actual={pages} expected={item["expected_pages"]}')

            sample=[]
            indices=list(range(min(15,pages)))+[max(0,pages-2),pages-1]
            for i in dict.fromkeys(indices):
              try: sample.append(reader.pages[i].extract_text() or '')
              except Exception: pass
            text='\n'.join(sample)
            if not any(x in text for x in [COMPANY,FULL,CODE,'苏州迈为']):
              txt=dest.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(20,pages)),str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              text=txt.read_text(encoding='utf-8',errors='ignore')
              txt.unlink(missing_ok=True)
            identity_ok=any(x in text for x in [COMPANY,FULL,CODE,'苏州迈为'])
            broker_ok=item['broker'] in text or item['broker'].replace('证券','') in text
            if not identity_ok:
              raise RuntimeError(f'Issuer identity check failed: {dest.name}')
            if not broker_ok:
              raise RuntimeError(f'Broker identity check failed: {dest.name}')

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0:
              raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'
            last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8_000: raise RuntimeError('first page render failed')
            if not last_png.exists() or last_png.stat().st_size<3_000: raise RuntimeError('last page render failed')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'stock_code':CODE,'stock_name':COMPANY,'broker':item['broker'],'publish_date':item['date'],
              'title':item['title'],'info_code':item['info_code'],'pages':pages,'bytes':len(data),'sha256':sha,
              'source_url':source_url,'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
              'filename':item['filename'],'identity_check':identity_ok,'broker_check':broker_ok,
              'validation':['PDF header','company identity','broker identity','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })

          if len(manifest)!=3 or len({x['sha256'] for x in manifest})!=3:
            raise RuntimeError('Report count or duplicate check failed')

          readme=[
            '迈为股份（300751.SZ；苏州迈为科技股份有限公司）券商深度报告资料包',
            '整理日期：2026-10-16','',
            '收录数量：3份，均为迈为股份公司专属、公开可完整下载的长篇券商研究报告。',
            '筛选口径：优先近年公司深度、首次覆盖及系统性研究；剔除短篇财报点评、网页摘要、缺页预览和非券商材料。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   PDF来源：{m["source_url"]}',
              f'   研报页面：{m["report_page"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
            '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'迈为股份长篇研报候选清单.json').write_text(json.dumps([
            {'publishDate':'2024-09-24','attachPages':71,'orgSName':'东吴证券','title':'HJT整线设备龙头受益于行业规模扩产在即，泛半导体领域加速布局','infoCode':'AP202409241640009034'},
            {'publishDate':'2023-07-25','attachPages':19,'orgSName':'国信证券','title':'HJT电池设备供应商，受益于光伏电池新技术迭代','infoCode':'AP202307251592619903'},
            {'publishDate':'2021-06-02','attachPages':33,'orgSName':'开源证券','title':'公司首次覆盖报告：高效光伏设备领跑者，九宫格战略打造平台公司','infoCode':'AP202106021495554524'},
            {'publishDate':'2021-03-08','attachPages':103,'orgSName':'华安证券','title':'能源革命之光伏设备研究系列（一）-迈为股份：迈步向前沿，为首新时代','infoCode':'AP202103081469652325'},
            {'publishDate':'2020-10-13','attachPages':29,'orgSName':'中银证券','title':'丝网印刷设备龙头，HJT设备新锐','infoCode':'AP202010131421151033'},
            {'publishDate':'2020-09-08','attachPages':32,'orgSName':'世纪证券','title':'深度研究报告：丝网设备龙头，布局新技术持续提升竞争力','infoCode':'AP202009081409130476'},
            {'publishDate':'2019-11-13','attachPages':27,'orgSName':'国金证券','title':'光伏丝印设备龙头，向平台型公司进化','infoCode':'AP201911131370692450'}
          ],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'迈为股份_300751_券商深度报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: maiwei-300751-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
