name: Patched Mingguan package rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/mingguan-package-rerun-20261105.txt'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Run patched package script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          path=Path('.github/workflows/mingguan-688560-triggered-package-20261105.yml')
          text=path.read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n",start)
          script=text[start:end]
          script=script.replace('/2021/2021-04/2021-04-23/','/2021/2021-4/2021-04-23/')
          Path('/tmp/mingguan_package.py').write_text(script,encoding='utf-8')
          subprocess.run([sys.executable,'/tmp/mingguan_package.py'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mingguan-688560-final-package-20261105
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
