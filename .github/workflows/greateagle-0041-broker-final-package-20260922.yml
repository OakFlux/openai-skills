name: Build Great Eagle Holdings 0041 broker research package

on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-broker-final-package-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf img2pdf

      - name: Assemble and validate public reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import io
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import img2pdf
          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '鹰君集团_0041_券商研究报告_精选3份'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)
          page_root = Path('_pages_greateagle')
          page_root.mkdir(exist_ok=True)

          items = [
              {
                  'seq': 1,
                  'id': '5354157',
                  'path': '2026/04/15',
                  'expected_pages': 26,
                  'broker': '华西证券',
                  'date': '2026-04-15',
                  'title': '公募REITs系列之五：商业不动产借鉴，中国香港REITs知多少？',
                  'type': '深度行业专题（覆盖香港REITs及鹰君相关资产管理平台）',
                  'relevance': '用于理解鹰君旗下及关联的香港REITs、商业不动产证券化与资产管理平台。',
                  'filename': '01_华西证券_中国香港REITs深度专题_覆盖鹰君相关平台_2026-04-15_26页.pdf',
              },
              {
                  'seq': 2,
                  'id': '5283692',
                  'path': '2026/03/04',
                  'expected_pages': 9,
                  'broker': '信达国际',
                  'date': '2026-03-04',
                  'title': '港股早晨快讯：鹰君2025年度业绩专题',
                  'type': '公司业绩研究快讯',
                  'relevance': '直接整理鹰君2025年度收入、股东应占亏损、核心溢利及末期股息。',
                  'filename': '02_信达国际_鹰君2025年度业绩专题_2026-03-04_9页.pdf',
              },
              {
                  'seq': 3,
                  'id': '4209785',
                  'path': '2024/04/05',
                  'expected_pages': 10,
                  'broker': '信达国际',
                  'date': '2024-04-05',
                  'title': '港股早晨快讯：鹰君拟私有化朗廷专题',
                  'type': '公司重大事项研究快讯',
                  'relevance': '直接讨论鹰君拟通过协议安排私有化朗廷酒店投资及撤销上市地位的事项。',
                  'filename': '03_信达国际_鹰君拟私有化朗廷专题_2024-04-05_10页.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def fetch_page(item: dict, page_no: int) -> tuple[int, bytes, str]:
              raw = f"https://public.fxbaogao.com/report-image/{item['path']}/{item['id']}-{page_no}.png"
              urls = [raw + '?x-oss-process=image/format,webp', raw]
              headers = {'Referer': f"https://www.fxbaogao.com/detail/{item['id']}"}
              errors = []
              for url in urls:
                  for attempt in range(1, 5):
                      try:
                          r = session.get(url, headers=headers, timeout=(20, 120), allow_redirects=True)
                          ctype = (r.headers.get('content-type') or '').lower()
                          print('FETCH', item['id'], page_no, attempt, r.status_code, ctype, len(r.content), flush=True)
                          if r.status_code in (403, 429, 500, 502, 503, 504):
                              time.sleep(attempt * 1.5)
                              continue
                          if r.status_code != 200 or not ctype.startswith('image/') or len(r.content) < 12000:
                              raise RuntimeError(f'invalid response status={r.status_code} type={ctype} size={len(r.content)}')
                          with Image.open(io.BytesIO(r.content)) as im:
                              im.load()
                              w, h = im.size
                              if w < 700 or h < 900:
                                  raise RuntimeError(f'image dimensions too small: {w}x{h}')
                          return page_no, r.content, url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt)
              raise RuntimeError(f"failed page {page_no} of {item['id']}: {errors[-8:]}")

          records = []
          for item in items:
              pdir = page_root / item['id']
              pdir.mkdir(exist_ok=True)
              results = []
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
                  futures = [executor.submit(fetch_page, item, n) for n in range(1, item['expected_pages'] + 1)]
                  for fut in concurrent.futures.as_completed(futures):
                      results.append(fut.result())
              results.sort(key=lambda x: x[0])
              if [x[0] for x in results] != list(range(1, item['expected_pages'] + 1)):
                  raise RuntimeError(f"page sequence mismatch for {item['id']}")

              jpgs = []
              image_hashes = set()
              source_urls = []
              for page_no, data, source_url in results:
                  image_sha = hashlib.sha256(data).hexdigest()
                  if image_sha in image_hashes:
                      raise RuntimeError(f"duplicate page image in {item['id']}: {page_no}")
                  image_hashes.add(image_sha)
                  with Image.open(io.BytesIO(data)) as im:
                      rgb = im.convert('RGB')
                      target = pdir / f'{page_no:03d}.jpg'
                      rgb.save(target, 'JPEG', quality=94, subsampling=0, progressive=False, optimize=False, dpi=(150, 150))
                  jpgs.append(target)
                  source_urls.append(source_url)

              pdf_path = out / item['filename']
              with pdf_path.open('wb') as fh:
                  fh.write(img2pdf.convert([str(p) for p in jpgs]))

              reader = PdfReader(str(pdf_path), strict=False)
              pages = len(reader.pages)
              if pages != item['expected_pages']:
                  raise RuntimeError(f"PDF page mismatch for {pdf_path.name}: {pages}")
              check = subprocess.run(['qpdf', '--check', str(pdf_path)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f"qpdf check failed for {pdf_path.name}: {check.stderr[-2000:]}")
              render_prefix = page_root / f"render_{item['id']}"
              render = subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-r', '100', '-png', str(pdf_path), str(render_prefix)], capture_output=True, text=True)
              if render.returncode != 0 or not render_prefix.with_suffix('.png').exists():
                  raise RuntimeError(f"first-page render failed for {pdf_path.name}")

              pdf_bytes = pdf_path.read_bytes()
              record = {
                  'sequence': item['seq'],
                  'broker': item['broker'],
                  'title': item['title'],
                  'report_type': item['type'],
                  'relevance_to_great_eagle': item['relevance'],
                  'date': item['date'],
                  'filename': item['filename'],
                  'page_count': pages,
                  'bytes': len(pdf_bytes),
                  'sha256': hashlib.sha256(pdf_bytes).hexdigest(),
                  'source_detail_url': f"https://www.fxbaogao.com/detail/{item['id']}",
                  'source_image_pattern': f"https://public.fxbaogao.com/report-image/{item['path']}/{item['id']}-{{page}}.png",
                  'source_page_count': len(source_urls),
                  'assembly_note': '由公开可访问的逐页报告原图按原页序合成为完整PDF；未绕过登录、付费或访问控制。',
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          records.sort(key=lambda x: x['sequence'])
          lines = [
              '鹰君集团有限公司（0041.HK）券商研究报告精选3份',
              '整理日期：2026-09-22',
              '',
              '范围说明：公开可获取的鹰君本体完整公司首次覆盖或长篇深度报告较少。本包按相关性收录1份香港REITs深度行业专题，以及2份直接讨论鹰君年度业绩和重大资本事项的券商研究快讯。',
              '其中第1份用于分析鹰君相关商业不动产证券化及资产管理平台；第2、3份直接覆盖鹰君本体。',
              '',
              '文件来源及格式：',
              '各PDF由公开报告页面的逐页原图按原页序合成，不是证券公司官网下载的矢量原始PDF；未绕过登录、付费或访问控制。',
              '已检查逐页图片解码、页序、重复页、PDF页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
              '',
              '文件清单：',
          ]
          for rec in records:
              lines.extend([
                  f"{rec['sequence']}. {rec['broker']}：《{rec['title']}》",
                  f"   类型：{rec['report_type']}",
                  f"   与鹰君的关系：{rec['relevance_to_great_eagle']}",
                  f"   日期：{rec['date']}；页数：{rec['page_count']}；文件：{rec['filename']}",
                  f"   来源页面：{rec['source_detail_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          lines.extend([
              '使用说明：仅供个人研究与资料查阅，版权归原作者及发布机构所有。',
              '如需可复制文字层或原始矢量文件，应以证券公司官网或授权数据库版本为准。',
          ])
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-broker-research-final
          path: 鹰君集团_0041_券商研究报告_精选3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
