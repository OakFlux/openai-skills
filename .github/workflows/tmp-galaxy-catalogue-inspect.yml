name: Temporary Galaxy Microelectronics catalogue inspection

on:
  push:
    branches:
      - tmp/galaxy-microelectronics-broker-reports-20260830
    paths:
      - .github/workflows/tmp-galaxy-catalogue-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect catalogue entries
        run: |
          python - <<'PY'
          import json
          import requests

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          for query in ['银河微电','常州银河世纪微电子','分立器件 银河微电','688689']:
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/search',json={'page':1,'pageSize':100,'keyword':query},timeout=45)
                  rows=(r.json().get('data') or {}).get('files') or []
                  print('QUERY',query,'COUNT',len(rows),flush=True)
              except Exception as e:
                  print('SEARCH_ERROR',query,repr(e),flush=True); continue
              for row in rows:
                  detail={}
                  try:
                      d=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':row.get('id')},timeout=45).json()
                      if d.get('status')==1: detail=d.get('data') or {}
                  except Exception as e:
                      print('DETAIL_ERROR',row.get('id'),repr(e),flush=True)
                  item={
                      'id':row.get('id'),
                      'name':detail.get('name') or row.get('name'),
                      'page_count':detail.get('page_count') or row.get('page_count'),
                      'date':detail.get('time_text') or row.get('time_text'),
                      'org':((detail.get('organization') or {}).get('name') or (row.get('organization') or {}).get('name')),
                      'stock':detail.get('stock') or row.get('stock'),
                      'data_source_uuid':detail.get('data_source_uuid') or row.get('data_source_uuid'),
                      'original_id':detail.get('original_id') or row.get('original_id'),
                      'page_url':detail.get('page_url') or row.get('page_url'),
                      'online_url':detail.get('online_url') or row.get('online_url'),
                      'file_size':detail.get('file_size') or row.get('file_size'),
                  }
                  print('ITEM',json.dumps(item,ensure_ascii=False),flush=True)
          PY
