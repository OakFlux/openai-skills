name: Inspect old Haofan Pharnex report pages

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-pharnex-old-reports-20261020.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect annual pages and related links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          import re, html, urllib.parse, urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          pages=[
            'https://www.pharnexcloud.com/data/qynb_4c482b5acc65f04d96fe38b94130047d.html',
            'https://www.pharnexcloud.com/data/qynb_9b42edd82304a06db42e5101b626088b.html',
            'https://www.pharnexcloud.com/data/qynb_cbdc86e5f466e793c1e7cebab37e0a52.html',
          ]
          for url in pages:
            print('\n===== ',url,' =====')
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9'})
            with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read(); final=r.geturl()
            text=raw.decode('utf-8','ignore')
            soup=BeautifulSoup(text,'html.parser')
            plain=re.sub(r'\s+',' ',soup.get_text(' ',strip=True))
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
            print('HTML',len(text),'PLAIN',len(plain))
            for key in ['详细报告内容','第一节','重要提示','年度报告','下载报告','报告附件','2016','2017','2018']:
              pos=plain.find(key)
              print('KEY',key,'POS',pos,'SNIP',plain[max(0,pos-300):pos+1500] if pos>=0 else '')
            print('-- relevant anchors --')
            for a in soup.find_all('a',href=True):
              label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
              full=urllib.parse.urljoin(final,html.unescape(a['href']))
              if any(k in label for k in ('查看报告','下载报告','年报报告')) or 'qynb_' in full:
                print(repr(label),full)
            print('-- hidden/input/data attrs --')
            for tag in soup.find_all(True):
              attrs=' '.join(f'{k}={v}' for k,v in tag.attrs.items())
              if any(k in attrs.lower() for k in ('qynb','download','file','report','attach','cbdc86','9b42edd')):
                print(tag.name,attrs[:1500])
          PY
