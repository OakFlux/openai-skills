name: Inspect bearing industry filter 20261005
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-bearing-industry-filter-20261005.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query bearing filter
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          params={'industryCode':'*','pageSize':'100','industry':'轴承','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2026-10-05','pageNo':'1','fields':'','qType':'1','orgCode':'','code':'','rcode':''}
          r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=120)
          print('STATUS',r.status_code,len(r.content)); r.raise_for_status()
          rows=r.json().get('data') or []
          print('COUNT',len(rows))
          for row in rows:
              title=str(row.get('title') or '')
              if '轴承' in title or '雷迪克' in title:
                  print('MATCH',json.dumps(row,ensure_ascii=False))
          PY
