name: Build final Nanshan Aluminium International broker research package 20260919

on:
  push:
    paths:
      - '.github/workflows/nanshan-aluminium-international-broker-reports-final-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info
          python -m pip install --quiet requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build three public research PDFs and ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html as htmlmod
          import json
          import re
          import subprocess
          import time
          import zipfile
          from datetime import date
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          PACKAGE='南山铝业国际_02610_券商深度报告_公开资料版_3份'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)

          docs=[
            {
              'key':'huachuang','filename':'01_华创证券_南山铝业国际_东南亚氧化铝龙头_电解铝筑第二成长曲线_公开资料版_2026-06-25.pdf',
              'broker':'华创证券','title':'南山铝业国际（02610.HK）深度研究报告：东南亚氧化铝龙头，电解铝筑第二成长曲线',
              'report_date':'2026-06-25','original_pages':25,'analysts':'刘岗、李梦娇','rating':'推荐（首次覆盖）',
              'source_name':'周知报告公开研报解读页','source_url':'https://www.360why.com/enterprise/260706000010654.html',
              'index_url':'https://www.nxny.com/report/view_6350912.html',
              'fallback':'''<h2>报告核心逻辑</h2>
              <p>华创证券将南山铝业国际定位为东南亚氧化铝龙头，并把公司由氧化铝向电解铝延伸视为第二成长曲线。公司在印度尼西亚宾坦岛形成氧化铝生产、港口、电力与物流配套，400万吨设计产能在2025年末进入全面释放阶段。</p>
              <p>低成本是报告的主要关注点。本地铝土矿采购、自备电厂、自有深水港和园区一体化布局共同降低原料、能源与运输成本；长期客户关系则有助于稳定销售。公开研报解读页面列示，公司2025年单吨氧化铝销售成本约251美元，处于行业较低水平，因此在氧化铝价格下行阶段仍具有一定盈利韧性。</p>
              <h2>第二成长曲线</h2>
              <p>成长端主要来自印尼25万吨电解铝一期项目。公开资料显示，项目投资约4.4亿美元，建设周期约两年，并有远期扩产规划。氧化铝自产、能源及港口配套可形成产业链协同，电解铝业务预计在投产后改善收入结构并增强利润弹性。</p>
              <h2>公开预测与风险</h2>
              <p>公开解读页面列示的2026—2028年归母净利润预测分别约为1.94亿、2.18亿和4.13亿美元，目标价为47.01港元。主要风险包括氧化铝与电解铝价格低于预期、新项目建设或产能爬坡不及预期、印尼政策变化、原料能源价格及汇率波动。上述数据仅用于识别原报告观点，应以券商原始报告为准。</p>'''
            },
            {
              'key':'shenwan','filename':'02_申万宏源_南山铝业国际_东南亚领先氧化铝制造商_电解铝项目打开成长空间_公开资料版_2026-06-29.pdf',
              'broker':'申万宏源','title':'南山铝业国际（02610.HK）：东南亚领先氧化铝制造商，电解铝项目打开成长空间',
              'report_date':'2026-06-29','original_pages':23,'analysts':'公开页面未完整列示','rating':'增持（首次覆盖）',
              'source_name':'周知报告公开研报解读页与原创力文档公开预览','source_url':'https://www.360why.com/enterprise/260702000010607.html',
              'index_url':'https://max.book118.com/html/2026/0630/7056101064011126.shtm',
              'fallback':'''<h2>报告核心逻辑</h2>
              <p>申万宏源首次覆盖报告将南山铝业国际概括为东南亚领先的冶金级氧化铝制造商。公司氧化铝产能集中于印尼宾坦产业园，截至2025年末设计产能达到400万吨。报告重点关注新增产能爬坡、低成本原料与能源、港口物流以及东南亚客户结构。</p>
              <p>公开解读显示，公司通过本地铝土矿采购、160MW自备火电机组和深水码头构建成本护城河。新增产能释放将推动销量增长，但氧化铝价格仍是短期盈利的关键变量。即使行业处于价格下行阶段，低成本和园区一体化配套仍有助于保持相对竞争力。</p>
              <h2>电解铝项目与产业链延伸</h2>
              <p>报告认为，25万吨电解铝项目是公司由单一氧化铝生产商向一体化铝业集团转型的关键步骤。自产氧化铝、能源和港口资源可降低中间环节成本，项目投产后有望形成新的利润来源。</p>
              <h2>公开预测与风险</h2>
              <p>公开页面列示的2026—2028年营业收入预测约为13.30亿、14.76亿和20.77亿美元，归母净利润预测约为3.12亿、4.00亿和5.38亿美元；首次覆盖给予“增持”评级。主要不确定性包括商品价格、产能投放节奏、矿石及能源成本、印尼政策与海外经营风险。最终预测应以券商原始报告为准。</p>'''
            },
            {
              'key':'huatai','filename':'03_华泰证券_南山铝业国际_兼具稳定现金流与高成长性_公开资料版_2026-02-10.pdf',
              'broker':'华泰证券','title':'南山铝业国际（02610.HK）：兼具稳定现金流与高成长性',
              'report_date':'2026-02-10','original_pages':22,'analysts':'公开页面未完整列示','rating':'买入（首次覆盖）',
              'source_name':'远瞻慧库公开研报解读页与证券之星公开报道','source_url':'https://www.baogaobox.com/insights/260211000025523.html',
              'index_url':'https://hk.stockstar.com/IG2026021100010860.shtml',
              'fallback':'''<h2>报告核心逻辑</h2>
              <p>华泰证券首次覆盖报告认为，南山铝业国际兼具氧化铝业务的现金流基础与电解铝项目的成长性。公司在印尼拥有400万吨氧化铝年产能，依托当地铝土矿资源、能源条件与港口配套形成成本优势。</p>
              <p>公开研报摘要指出，公司2024年铝土矿采购均价约35美元/吨，单吨氧化铝毛利约239美元，盈利能力高于行业平均水平。上述优势来自矿源、能源、运输和园区协同，而不仅是单一环节。</p>
              <h2>电解铝成长空间</h2>
              <p>公司计划建设25万吨年产能电解铝项目，预计2028年投产，并保留远期50万吨扩产空间。华泰证券在特定铝价和成本假设下测算，项目达产后可能形成较明显的利润增量。全球电解铝供给约束和氧化铝成本支撑构成报告的行业判断基础。</p>
              <h2>公开评级与风险</h2>
              <p>公开报道显示，华泰证券首次覆盖给予“买入”评级，初始目标价78.18港元。主要风险包括氧化铝及电解铝价格低于预期、新建产能进度不及预期、印尼政策变化，以及能源、原料和汇率波动。目标价基于报告发布时的假设，不代表当前估值或投资建议。</p>'''
            },
          ]

          def sha256(path:Path)->str:
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          def fetch_public_article(doc:dict)->tuple[str,str,str,bool]:
              session=requests.Session(); session.trust_env=False
              session.headers.update({
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36',
                  'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Cache-Control':'no-cache','Connection':'close'
              })
              try:
                  r=session.get(doc['source_url'],timeout=(20,90),allow_redirects=True)
                  raw=r.content.decode('utf-8',errors='replace')
                  soup=BeautifulSoup(raw,'lxml')
                  page_title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  full=soup.get_text('\n',strip=True)
                  status=f'{r.status_code} {r.url}'
                  if '安全验证' in page_title or '我不是机器人' in full or '南山铝业国际' not in full or len(full)<1800:
                      return doc['fallback'],page_title,status,False
                  for tag in soup(['script','style','noscript','iframe','video','audio','canvas','form','button','input','textarea','select','nav','header','footer','aside','svg']): tag.decompose()
                  candidates=[]
                  for sel in ['article','main','.article-content','.article_detail','.article-detail','.detail-content','.detail_content','.news-content','.insight-content','.post-content','.entry-content','.article','.detail','.content']:
                      candidates.extend(soup.select(sel))
                  h1=soup.find('h1')
                  if h1:
                      p=h1
                      while p and p.name not in ('body','html'):
                          if len(p.get_text(' ',strip=True))>2200: candidates.append(p)
                          p=p.parent
                  candidates.append(soup.body or soup)
                  viable=[]
                  for el in candidates:
                      txt=el.get_text(' ',strip=True)
                      if '南山铝业国际' in txt and len(txt)>1800:
                          score=len(txt)+80*len(el.find_all('p'))+160*len(el.find_all(['h1','h2','h3']))-6*len(el.find_all('a'))
                          viable.append((score,el))
                  if not viable: return doc['fallback'],page_title,status,False
                  clone=BeautifulSoup(str(max(viable,key=lambda x:x[0])[1]),'lxml')
                  root=clone.body or clone
                  for tag in root.find_all(['script','style','noscript','iframe','video','audio','canvas','form','button','input','textarea','select','nav','header','footer','aside','svg','img','picture','source']): tag.decompose()
                  for a in root.find_all('a'): a.unwrap()
                  for tag in list(root.find_all(True)):
                      tag.attrs={}
                      if tag.name not in ('p','h1','h2','h3','h4','h5','ul','ol','li','table','thead','tbody','tr','th','td','blockquote','strong','b','em','i','div','section','span','br','hr'):
                          tag.unwrap()
                  content=str(root)
                  content=re.split(r'(?:相关报告|相关文章|热门报告|热门洞察|版权说明|版权声明|问题反馈)',content,maxsplit=1)[0]
                  vis=BeautifulSoup(content,'lxml').get_text(' ',strip=True)
                  if len(vis)<1800: return doc['fallback'],page_title,status,False
                  return content,page_title,status,True
              except Exception as exc:
                  return doc['fallback'],'',repr(exc),False

          records=[]
          for i,doc in enumerate(docs):
              content,page_title,fetch_status,fetched=fetch_public_article(doc)
              mode='公开研报解读页面排版' if fetched else '公开信息摘要整理'
              cover=f'''<section class="cover"><div class="kicker">券商深度报告公开资料整理版</div>
              <h1>{htmlmod.escape(doc['title'])}</h1><div class="meta">
              <p><b>研究机构：</b>{htmlmod.escape(doc['broker'])}</p><p><b>报告日期：</b>{doc['report_date']}</p>
              <p><b>原报告标示页数：</b>{doc['original_pages']}页</p><p><b>研究员：</b>{htmlmod.escape(doc['analysts'])}</p>
              <p><b>评级：</b>{htmlmod.escape(doc['rating'])}</p></div>
              <div class="notice"><b>版本说明：</b>本文件整理自公开可访问的研报解读、预览或新闻摘要，用于资料检索。它不是券商原始PDF，也未绕过登录、会员、付费或下载权限。页面内容与数据应以券商原始报告为准。</div>
              <div class="source"><b>公开内容来源：</b>{htmlmod.escape(doc['source_name'])}<br>{htmlmod.escape(doc['source_url'])}<br><br><b>原报告索引或交叉核验页：</b><br>{htmlmod.escape(doc['index_url'])}</div></section>'''
              page=f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
              @page {{ size:A4; margin:16mm 15mm 18mm; @bottom-center {{ content: counter(page) " / " counter(pages); font-size:8pt; color:#666; }} }}
              *{{box-sizing:border-box}} body{{font-family:"Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;color:#111;font-size:10.5pt;line-height:1.72;margin:0}}
              .cover{{min-height:250mm;padding:22mm 8mm 8mm;page-break-after:always;display:flex;flex-direction:column}} .kicker{{font-size:11pt;letter-spacing:.08em;margin-bottom:18mm}}
              .cover h1{{font-size:23pt;line-height:1.36;margin:0 0 16mm}} .meta{{border-top:1px solid #777;border-bottom:1px solid #777;padding:5mm 0;margin-bottom:10mm}}
              .meta p{{margin:2mm 0}} .notice{{border:1px solid #aaa;padding:5mm;font-size:9.5pt;margin-bottom:10mm}} .source{{margin-top:auto;font-size:8.3pt;overflow-wrap:anywhere}}
              .mode{{font-size:9pt;color:#555;margin:0 0 7mm;padding-bottom:3mm;border-bottom:1px solid #bbb}} h1{{font-size:19pt;line-height:1.4;margin:0 0 7mm}}
              h2{{font-size:15pt;margin:8mm 0 4mm;page-break-after:avoid}} h3{{font-size:12.5pt;margin:6mm 0 3mm;page-break-after:avoid}} h4{{font-size:11.5pt;margin:5mm 0 2mm;page-break-after:avoid}}
              p{{margin:0 0 3.5mm;text-align:justify;orphans:3;widows:3}} ul,ol{{padding-left:7mm}} li{{margin-bottom:2mm}} table{{width:100%;border-collapse:collapse;margin:5mm 0;font-size:8.8pt;page-break-inside:avoid}}
              th,td{{border:1px solid #999;padding:2mm;vertical-align:top}} blockquote{{margin:4mm 0;padding-left:4mm;border-left:2px solid #888}}
              </style></head><body>{cover}<article><div class="mode">内容形态：{mode}</div>{content}</article></body></html>'''
              dest=out/doc['filename']
              HTML(string=page,base_url=doc['source_url']).write_pdf(str(dest))
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<2: raise RuntimeError(f'PDF too short: {dest.name}: {pages}')
              sample=''.join((p.extract_text() or '') for p in reader.pages[:min(6,pages)])
              if '南山铝业国际' not in sample or doc['broker'] not in sample: raise RuntimeError('identity failed '+dest.name)
              ck=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if ck.returncode not in (0,3): raise RuntimeError('qpdf failed '+dest.name+' '+ck.stderr[-800:])
              preview=out/(dest.stem+'_首页预览.png')
              subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(dest),str(preview.with_suffix(''))],check=True)
              rec={**{k:doc[k] for k in ('key','filename','broker','title','report_date','original_pages','analysts','rating','source_name','source_url','index_url')},
                   'compiled_pdf_pages':pages,'content_mode':mode,'source_fetched':fetched,'source_page_title':page_title,'fetch_status':fetch_status,
                   'bytes':dest.stat().st_size,'sha256':sha256(dest),'format_note':'公开研报解读/预览或摘要整理版，非券商原始PDF'}
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)
              time.sleep(2)

          readme=['南山铝业国际控股有限公司（02610.HK）券商深度报告公开资料包',f'整理日期：{date.today().isoformat()}','',
                  '收录3份与南山铝业国际直接相关的券商深度研究资料：华创证券、申万宏源、华泰证券。',
                  '重要说明：原始券商PDF所在平台设有登录、会员、付费或下载权限。本包没有绕过访问控制；所收PDF由公开可访问的研报解读、预览或新闻摘要整理排版而成，均在封面标明“公开资料整理版”，不能替代券商原始PDF。','','文件清单：']
          for i,r in enumerate(records,1):
              readme += [f"{i}. {r['broker']}：{r['title']}",f"   报告日期：{r['report_date']}；原报告标示页数：{r['original_pages']}页；本包PDF：{r['compiled_pdf_pages']}页",
                         f"   内容形态：{r['content_mode']}",f"   文件：{r['filename']}",f"   公开内容来源：{r['source_url']}",f"   原报告索引/交叉核验：{r['index_url']}",f"   SHA-256：{r['sha256']}",'']
          readme.append('完整性核验：PDF文件身份、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。')
          (out/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(out.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=3: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',sha256(zpath),flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: nanshan-aluminium-international-broker-reports-final
          path: 南山铝业国际_02610_券商深度报告_公开资料版_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
