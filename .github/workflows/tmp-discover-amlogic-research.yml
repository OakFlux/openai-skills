name: Temporary Discover Amlogic Research PDFs

on:
  push:
    branches:
      - tmp/fetch-amlogic-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover Eastmoney research metadata and PDF URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import requests
          from datetime import datetime

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': '*/*',
          })

          url = 'https://reportapi.eastmoney.com/report/list'
          params = {
              'cb': 'datatable',
              'pageNo': 1,
              'pageSize': 500,
              'code': '688099',
              'industryCode': '*',
              'industry': '*',
              'rating': '*',
              'ratingChange': '*',
              'beginTime': '2020-01-01',
              'endTime': '2026-08-30',
              'fields': '',
              'qType': 0,
          }
          r = session.get(url, params=params, timeout=60)
          print('API', r.url, r.status_code, len(r.content), r.text[:120])
          r.raise_for_status()
          text = r.text.strip()
          m = re.match(r'^datatable\((.*)\)\s*;?$', text, flags=re.S)
          if not m:
              raise RuntimeError('Unexpected JSONP response')
          payload = json.loads(m.group(1))
          data = payload.get('data') or []
          print('TOTAL', len(data))

          keywords = ['深度', '首次覆盖', '投资价值', '核心技术为躯', '晶彩启晨', '重塑TV', '五大业务多向布局', '多媒体智能SoC龙头', '中国多媒体终端SoC龙头', '国内领先的SoC']
          exact_interest = [
              '晶彩启晨，芯动视界',
              '重塑TV产业新格局，筑牢全域连接底座，构筑端侧全场景SoC核心生态平台',
              '核心技术为躯，全球开拓为翼',
              '五大业务多向布局，AIoT引领创新增量',
          ]

          selected = []
          for item in data:
              title = item.get('title') or ''
              publish = item.get('publishDate') or item.get('publishDateStr') or ''
              org = item.get('orgSName') or item.get('orgName') or ''
              info = item.get('infoCode') or item.get('infoCodeStr') or ''
              researcher = item.get('researcher') or ''
              if any(k.lower() in title.lower() for k in keywords) or any(x in title for x in exact_interest):
                  selected.append((publish, org, title, info, researcher, item))

          selected.sort(reverse=True)
          for publish, org, title, info, researcher, item in selected:
              print('\nMATCH', publish, org, info, title, researcher)
              print('META', json.dumps(item, ensure_ascii=False, sort_keys=True))
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(datetime.now().timestamp()*1000)}.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
              ]
              for pdf_url in candidates:
                  try:
                      rr = session.get(pdf_url, timeout=45, allow_redirects=True, stream=True)
                      head = next(rr.iter_content(chunk_size=32), b'')
                      print('PDFTEST', rr.status_code, rr.headers.get('content-type'), rr.headers.get('content-length'), head[:8], pdf_url)
                      rr.close()
                  except Exception as exc:
                      print('PDFERR', repr(exc), pdf_url)
          PY
