name: Package Deep Sanda 000032 all filings v2 20261016
on:
  push:
    paths:
      - '.github/workflows/shensangda-000032-package-all-filings-v2-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Enable legacy Eastmoney attachments
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/shensangda_package_20261016.py')
          t=p.read_text(encoding='utf-8')
          old='''def eastmoney_urls(art: str) -> list[str]:
    return [f"https://pdf.dfcfw.com/pdf/H{x}_{art}_1.pdf" for x in (3, 2, 1, 4)]
'''
          new='''def eastmoney_urls(art: str) -> list[str]:
    urls: list[str] = []
    try:
        meta_url = f"https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code={art}&client_source=web&page_index=1"
        meta = s.get(meta_url, timeout=(20, 90), headers={"User-Agent": s.headers["User-Agent"], "Referer": f"https://data.eastmoney.com/notices/detail/{CODE}/{art}.html"}).json().get("data") or {}
        for item in (meta.get("attach_list") or []):
            if item.get("attach_url"):
                urls.append(str(item["attach_url"]))
        for key in ("attach_url_web", "attach_url"):
            if meta.get(key):
                urls.append(str(meta[key]))
    except Exception:
        pass
    urls.extend([f"https://pdf.dfcfw.com/pdf/H{x}_{art}_1.pdf" for x in (22, 3, 2, 1, 4)])
    return list(dict.fromkeys(urls))
'''
          if old not in t:
              raise SystemExit('target block not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
          PY
      - name: Build verified archive
        run: python .github/scripts/shensangda_package_20261016.py
      - uses: actions/upload-artifact@v4
        with:
          name: shensangda-000032-all-filings-v2-20261016
          path: |
            深桑达A_000032_上市以来年报_招股说明书及最新季报_截至20261016.zip
            shensangda_000032_all_annual_reports_prospectus_latest_quarter_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
