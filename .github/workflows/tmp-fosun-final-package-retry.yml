name: Temporary Fosun International final report package retry

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-final-package-retry.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 Pillow img2pdf PyMuPDF pypdf reportlab
      - name: Extract corrected package script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-fosun-final-package.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          if marker_start not in workflow or marker_end not in workflow:
              raise RuntimeError('Could not locate embedded package script')
          script = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = textwrap.dedent(script)
          old = """    if tag.name != 'img' and any(isinstance(parent, Tag) and parent.name in allowed and parent is not tag for parent in tag.parents if parent is not content_node):
        # Skip nested text blocks to avoid duplication; images remain independent.
        continue
"""
          if old not in script:
              raise RuntimeError('Expected incomplete-text filter was not found')
          script = script.replace(old, '')
          Path('/tmp/fosun_package.py').write_text(script, encoding='utf-8')
          print('Corrected script chars:', len(script))
          PY
      - name: Download, create, and verify report PDFs
        run: python /tmp/fosun_package.py
      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: fosun-international-broker-reports-final-v2
          path: fosun_final/复星国际_券商深度报告_3份_完整可读版.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload verification material
        uses: actions/upload-artifact@v4
        with:
          name: fosun-international-report-verification-v2
          path: fosun_final/verification/
          retention-days: 1
          if-no-files-found: error
