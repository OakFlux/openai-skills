name: Probe Hibor modern and mobile report previews 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-hibor-modern-preview-probe-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch modern pages, mobile pages and scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json
          import re
          import urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          ids = ['2072487','2133283','1191797','420954','101288']
          out = Path('zzmd_hibor_modern_probe')
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/153 Mobile Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer':'https://www.hibor.com.cn/'
          })
          static_urls = [
              'https://www.hibor.com.cn/JS/sysdownload.js',
              'https://www.hibor.com.cn/js/docdetailJSN.js?ver=2020',
              'https://www.hibor.com.cn/JS/login.js',
              'https://www.hibor.com.cn/hiborweb/Common/ClientDownloadLayer?fromType=4&layerType=0',
              'https://www.hibor.com.cn/login.html'
          ]
          urls = []
          for did in ids:
              urls.extend([
                  f'https://www.hibor.com.cn/repinfodetail_{did}.html',
                  f'https://wap.hibor.com.cn/repinfodetail_{did}.html',
                  f'https://web.hibor.com.cn/repinfodetail_{did}.html',
                  f'https://www.microbell.com/repinfodetail_{did}.html',
                  f'https://www.hibor.com.cn/wap_detail.aspx?id={did}&un=&wp=2&fromtype=2&sm=1',
                  f'https://wap.hibor.com.cn/wap_detail.aspx?id={did}&un=&wp=2&fromtype=2&sm=1'
              ])
          urls = static_urls + urls
          summaries=[]
          for idx,url in enumerate(urls):
              try:
                  r=session.get(url,timeout=(15,60),allow_redirects=True)
                  r.encoding=r.apparent_encoding or r.encoding or 'gb18030'
                  text=r.text
                  suffix='.js' if ('javascript' in r.headers.get('content-type','').lower() or url.lower().split('?')[0].endswith('.js')) else '.html'
                  name=f'{idx:03d}_{urllib.parse.urlparse(url).netloc.replace(".","_")}{suffix}'
                  (out/name).write_text(text,encoding='utf-8',errors='replace')
                  soup=BeautifulSoup(text,'lxml') if suffix=='.html' else None
                  found=[]
                  # HTML attributes
                  if soup is not None:
                      for tag in soup.find_all(True):
                          for attr in ('href','src','data-src','data-url','data-original','data-file','data-pdf','onclick','action'):
                              val=tag.get(attr)
                              if not isinstance(val,str) or not val.strip():
                                  continue
                              absolute=urllib.parse.urljoin(r.url,val.strip())
                              label=' '.join(tag.get_text(' ',strip=True).split())[:200]
                              if any(k in absolute.lower() for k in ('pdf','download','attach','upload','preview','read','view','image','file','page')) or any(k in label for k in ('报告原文','打开报告','下载报告','点击浏览')):
                                  found.append({'tag':tag.name,'attr':attr,'raw':val,'url':absolute,'text':label})
                  # Quoted strings in HTML/JS
                  for m in re.finditer(r'["\']([^"\']{1,1000})["\']', text):
                      val=m.group(1)
                      low=val.lower()
                      if any(k in low for k in ('pdf','download','attach','upload','preview','read','view','image','file','page','document')):
                          found.append({'tag':'raw','attr':'quoted','raw':val,'url':urllib.parse.urljoin(r.url,val),'text':''})
                  unique=[]; seen=set()
                  for x in found:
                      key=x['url']
                      if key not in seen:
                          seen.add(key); unique.append(x)
                  (out/f'{name}.assets.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
                  rec={'requested':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'title':soup.title.get_text(' ',strip=True) if soup and soup.title else '','assets':len(unique)}
                  summaries.append(rec)
                  print('\nPAGE',json.dumps(rec,ensure_ascii=False))
                  print('ASSETS',json.dumps(unique[:100],ensure_ascii=False,indent=2)[:25000])
              except Exception as exc:
                  rec={'requested':url,'error':repr(exc)}
                  summaries.append(rec)
                  print('ERROR',json.dumps(rec,ensure_ascii=False))
          (out/'summaries.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-hibor-modern-preview-probe-20261014
          path: zzmd_hibor_modern_probe
          retention-days: 2
          if-no-files-found: error
