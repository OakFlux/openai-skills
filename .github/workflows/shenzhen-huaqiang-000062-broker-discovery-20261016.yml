name: Build Shenzhen Huaqiang 000062 broker deep reports 20261016

on:
  push:
    paths:
      - '.github/workflows/shenzhen-huaqiang-000062-broker-discovery-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package full reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          package = '深圳华强_000062_券商深度报告_完整版_3份'
          root = Path(package)
          root.mkdir(exist_ok=True)
          preview_dir = Path('_preview_validation')
          preview_dir.mkdir(exist_ok=True)
          text_dir = Path('_text_validation')
          text_dir.mkdir(exist_ok=True)

          reports = [
              {
                  'broker': '开源证券',
                  'date': '2021-07-06',
                  'analysts': '陈宝健、闫宁',
                  'rating': '买入',
                  'title': '公司首次覆盖报告：电子产业互联网平台蓄势待发',
                  'info_code': 'AP202107061502136997',
                  'expected_pages': 13,
                  'min_pages': 10,
                  'title_terms': ['电子产业互联网平台', '蓄势待发', '首次覆盖'],
                  'filename': '01_开源证券_深圳华强_电子产业互联网平台蓄势待发_2021-07-06_13页.pdf',
              },
              {
                  'broker': '万和证券',
                  'date': '2020-09-03',
                  'analysts': '沈彦东',
                  'rating': '增持',
                  'title': '深圳华强：深度整合线上线下业务，巩固分销龙头地位',
                  'info_code': 'AP202009031407192743',
                  'expected_pages': 25,
                  'min_pages': 20,
                  'title_terms': ['深度整合线上线下', '分销龙头', '巩固分销龙头地位'],
                  'filename': '02_万和证券_深圳华强_深度整合线上线下巩固分销龙头地位_2020-09-03_25页.pdf',
              },
              {
                  'broker': '东吴证券',
                  'date': '2018-09-12',
                  'analysts': '谢恒、姚康',
                  'rating': '买入',
                  'title': '受益集中度提升，本土分销龙头并购整合迎快速成长',
                  'info_code': 'AP201809121193866707',
                  'expected_pages': 32,
                  'min_pages': 28,
                  'title_terms': ['集中度提升', '本土分销龙头', '并购整合', '快速成长'],
                  'filename': '03_东吴证券_深圳华强_本土分销龙头并购整合迎快速成长_2018-09-12_32页.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(info_code: str) -> tuple[bytes, str]:
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last = None
              for url in urls:
                  for attempt in range(7):
                      try:
                          response = session.get(
                              url,
                              timeout=(25, 300),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 100_000:
                              return response.content, url
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          manifest = []
          for index, report in enumerate(reports, 1):
              data, pdf_url = download_pdf(report['info_code'])
              destination = root / report['filename']
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'too few pages: {destination.name}: {pages} < {report["min_pages"]}')

              extracted = ''
              for page in reader.pages[:min(15, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass

              text_path = text_dir / f'{index:02d}.txt'
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(15, pages)), str(destination), str(text_path)],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if text_path.exists():
                  extracted += '\n' + text_path.read_text(encoding='utf-8', errors='ignore')

              compact = re.sub(r'\s+', '', extracted)
              issuer_ok = any(term in compact for term in ['深圳华强', '000062', '深圳华强实业股份有限公司'])
              if not issuer_ok:
                  raise RuntimeError(f'issuer identity check failed: {destination.name}')
              matched_terms = [term for term in report['title_terms'] if re.sub(r'\s+', '', term) in compact]
              if not matched_terms:
                  raise RuntimeError(f'title keyword check failed: {destination.name}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = preview_dir / f'{index:02d}'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'first-page render failed: {destination.name}')

              sha256 = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **report,
                  'actual_pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
                  'source_report_page': f'https://data.eastmoney.com/report/info/{report["info_code"]}.html',
                  'pdf_url': pdf_url,
                  'matched_title_terms': matched_terms,
                  'document_nature': '券商原始完整PDF',
                  'validation': [
                      'PDF header', 'issuer identity', 'title keywords', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              })

          readme = [
              '深圳华强实业股份有限公司（000062.SZ）券商深度报告完整版资料包',
              '整理日期：2026-10-16',
              '',
              '本包收录3份公开可直接取得的券商原始完整PDF，均为公司深度研究或首次覆盖报告。',
              '由于公开渠道中深圳华强近年的长篇公司深度报告数量较少，本包优先选取最新的首次覆盖报告，并补充两份研究框架较完整的深度报告。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f'{index}. {item["broker"]}：《{item["title"]}》',
                  f'   日期：{item["date"]}；分析师：{item["analysts"]}；评级：{item["rating"]}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_report_page"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme += [
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、标题关键词、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(package + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file_path in sorted(root.rglob('*')):
                  if file_path.is_file():
                      archive.write(file_path, arcname=f'{package}/{file_path.relative_to(root)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              pdf_files = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_file or len(pdf_files) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad_file}, pdf_count={len(pdf_files)}')

          alias_path = Path('shenzhen_huaqiang_000062_broker_deep_reports_3_full.zip')
          alias_path.write_bytes(zip_path.read_bytes())
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha256)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-huaqiang-000062-broker-deep-reports-full-3
          path: |
            深圳华强_000062_券商深度报告_完整版_3份.zip
            shenzhen_huaqiang_000062_broker_deep_reports_3_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
