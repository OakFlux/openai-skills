name: Build Shanghai Hugong broker research package v2

on:
  push:
    branches:
      - tmp-shanghai-hugong-broker-reports-20261029-v2

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='上海沪工_603131_券商研究报告_3份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/sh_hugong_broker_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('上海沪工_603131_券商研究报告_3份')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          reports = [
              {
                  'order': 1,
                  'broker': '浙商证券',
                  'date': '2019-07-25',
                  'title': '焊接切割“小巨人”，布局“弹、箭、星”航天领域',
                  'type': '公司深度报告',
                  'filename': '01_浙商证券_焊接切割小巨人布局弹箭星航天领域_2019-07-25.pdf',
                  'pages': 24,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201907261341436370_1.PDF',
                  'index': 'https://data.eastmoney.com/report/info/AP201907261341436370.html',
              },
              {
                  'order': 2,
                  'broker': '开源证券',
                  'date': '2021-03-15',
                  'title': '国内焊机龙头，发力航天军工业务',
                  'type': '公司首次覆盖报告',
                  'filename': '02_开源证券_国内焊机龙头发力航天军工业务_2021-03-15.pdf',
                  'pages': 21,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202103161472387765_1.pdf',
                  'index': 'https://data.eastmoney.com/report/info/AP202103161472387765.html',
              },
              {
                  'order': 3,
                  'broker': '开源证券',
                  'date': '2021-08-26',
                  'title': '海外焊机快速增长，航天业务蓄势待发',
                  'type': '公司信息更新报告',
                  'filename': '03_开源证券_海外焊机快速增长航天业务蓄势待发_2021-08-26.pdf',
                  'pages': 13,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202108271512601163_1.pdf',
                  'index': 'https://data.eastmoney.com/report/info/AP202108271512601163.html',
              },
          ]

          def fetch(report: dict) -> tuple[str, bytes]:
              last = None
              candidates = [report['url'], report['url'] + '?download=1']
              for attempt in range(8):
                  for url in candidates:
                      try:
                          response = session.get(
                              url,
                              headers={'Referer': report['index']},
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 150_000:
                              return response.url, data
                          last = RuntimeError(
                              f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                          )
                      except Exception as exc:
                          last = exc
                  time.sleep(min(1 + attempt, 8))
              raise RuntimeError(f'download failed for {report["title"]}: {last!r}')

          records = []
          for report in reports:
              source, data = fetch(report)
              path = out / report['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != report['pages']:
                  raise RuntimeError(f'{path.name}: expected {report["pages"]} pages, got {pages}')
              sample = ''
              idxs = list(range(min(15, pages)))
              if pages > 15:
                  idxs.append(pages - 1)
              for idx in dict.fromkeys(idxs):
                  try:
                      sample += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', sample)
              if '上海沪工' not in compact and '上海沪工焊接集团股份有限公司' not in compact:
                  raise RuntimeError(f'{path.name}: company name mismatch')
              broker_key = report['broker'].replace('证券', '')
              if broker_key not in compact:
                  raise RuntimeError(f'{path.name}: broker name mismatch')
              sha = hashlib.sha256(data).hexdigest()
              records.append({**report, 'source': source, 'bytes': len(data), 'sha256': sha})
              print('DOWNLOADED', report['broker'], report['title'], 'pages=', pages, 'bytes=', len(data), 'sha256=', sha)

          lines = [
              '上海沪工（603131）券商研究报告资料包',
              '整理日期：2026-10-29',
              '',
              '版本说明：',
              '1. 三份文件均为公开渠道直接下载的券商原始完整PDF，未使用网页摘要、截图或重新排版版本。',
              '2. 浙商证券报告为24页公司深度报告；开源证券首次覆盖报告为21页；另收录13页公司信息更新报告，用于补充后续经营与航天业务进展。',
              '3. 资料仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   类型：{item['type']}",
                  f"   发布日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   研报索引：{item['index']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [f'合计：3份PDF，{total_pages}页，{total_bytes}字节。']
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 10
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '上海沪工|上海沪工焊接集团股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/sh_hugong_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/sh_hugong_broker_test.zip "$PACKAGE"
          unzip -t /tmp/sh_hugong_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/sh_hugong_broker_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f /tmp/sh_hugong_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Shanghai-Hugong-603131-broker-research-reports-3-v2
          path: 上海沪工_603131_券商研究报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
