name: Build Trina Solar filing package

on:
  push:
    branches: [tmp-trina-solar-688599-reports-20261016]
    paths: ['.github/workflows/tmp-trina-solar-final-package-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Discover, download and validate filings
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='天合光能_688599_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE"

          python3 - <<'PY'
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          ANNUAL = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/688599/page_type/ndbg.phtml'
          Q1 = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinYi/stockid/688599/page_type/yjdbg.phtml'
          Q3 = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/688599/page_type/sjdbg.phtml'
          PROSPECTUS = 'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/688599.phtml'
          outdir = Path('天合光能_688599_全部年报_招股说明书_最新季报')

          def fetch(url, referer=None):
              headers = {
                  'User-Agent': UA,
                  'Accept': 'text/html,application/xhtml+xml,application/pdf,*/*;q=0.8',
              }
              if referer:
                  headers['Referer'] = referer
              last = None
              for attempt in range(7):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=240) as response:
                          return response.read(), response.geturl(), dict(response.headers)
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt)
              raise RuntimeError(f'Failed to fetch {url}: {last}')

          def decode_page(raw):
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='replace')

          anchor_pattern = re.compile(
              r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',
              re.I | re.S,
          )

          def page_data(page_url):
              raw, final_url, _ = fetch(page_url)
              text = decode_page(raw)
              items = []
              for match in anchor_pattern.finditer(text):
                  href = html.unescape(match.group(1).strip())
                  label = re.sub(r'<[^>]+>', '', match.group(2))
                  label = html.unescape(re.sub(r'\s+', '', label))
                  items.append((label, urllib.parse.urljoin(final_url, href)))
              return text, items

          annual_text, annual_links = page_data(ANNUAL)
          q1_text, q1_links = page_data(Q1)
          q3_text, q3_links = page_data(Q3)
          prospectus_text, prospectus_links = page_data(PROSPECTUS)

          records = []
          revision_words = ('修订版', '修订稿', '更新后', '更正后', '更新', '修订')

          for index, year in enumerate(range(2020, 2026), start=1):
              candidates = [
                  (label, url) for label, url in annual_links
                  if f'{year}年年度报告' in label
                  and '摘要' not in label
                  and '英文' not in label
                  and '天合光能' in label
              ]
              if not candidates:
                  raise SystemExit(f'Could not find {year} annual report detail link')
              candidates.sort(
                  key=lambda item: (
                      0 if any(word in item[0] for word in revision_words) else 1,
                      len(item[0]),
                  )
              )
              label, detail_url = candidates[0]
              revised = any(word in label for word in revision_words)
              suffix = '_修订或更新版' if revised else ''
              records.append({
                  'order': index,
                  'category': '年度报告',
                  'period': f'{year}年度',
                  'detail_title': label,
                  'detail_url': detail_url,
                  'filename': f'{index:02d}_天合光能_{year}年年度报告{suffix}.pdf',
              })

          prospectus_candidates = [
              (label, url) for label, url in prospectus_links
              if '首次公开发行股票' in label
              and '招股说明书' in label
              and '意向书' not in label
              and '申报稿' not in label
          ]
          if not prospectus_candidates:
              prospectus_candidates = [
                  (label, url) for label, url in prospectus_links
                  if '招股说明书' in label and '意向书' not in label and '申报稿' not in label
              ]
          if not prospectus_candidates:
              raise SystemExit('Could not find final IPO prospectus detail link')
          prospectus_label, prospectus_detail_url = prospectus_candidates[0]
          records.append({
              'order': 7,
              'category': '招股说明书',
              'period': '2020年首次公开发行',
              'detail_title': prospectus_label,
              'detail_url': prospectus_detail_url,
              'filename': '07_天合光能_首次公开发行股票并在科创板上市招股说明书_2020-06-04.pdf',
          })

          q3_2026 = [
              (label, url) for label, url in q3_links
              if '2026年' in label and ('第三季度报告' in label or '三季度报告' in label)
              and '摘要' not in label and '天合光能' in label
          ]
          q1_2026 = [
              (label, url) for label, url in q1_links
              if '2026年' in label and ('第一季度报告' in label or '一季度报告' in label)
              and '摘要' not in label and '天合光能' in label
          ]
          if q3_2026:
              quarter_label, quarter_detail_url = q3_2026[0]
              quarter_period = '2026年第三季度'
              quarter_filename = '08_天合光能_2026年第三季度报告_最新季报.pdf'
          elif q1_2026:
              quarter_label, quarter_detail_url = q1_2026[0]
              quarter_period = '2026年第一季度'
              quarter_filename = '08_天合光能_2026年第一季度报告_最新季报.pdf'
          else:
              raise SystemExit('Could not find a 2026 quarterly report')
          records.append({
              'order': 8,
              'category': '最新季报',
              'period': quarter_period,
              'detail_title': quarter_label,
              'detail_url': quarter_detail_url,
              'filename': quarter_filename,
          })

          def extract_pdf_url(detail_url):
              raw, final_url, _ = fetch(detail_url)
              text = decode_page(raw)
              candidates = []
              for match in anchor_pattern.finditer(text):
                  href = urllib.parse.urljoin(final_url, html.unescape(match.group(1).strip()))
                  label = re.sub(r'<[^>]+>', '', match.group(2))
                  label = html.unescape(re.sub(r'\s+', '', label))
                  if '下载公告' in label or '.pdf' in href.lower():
                      candidates.append((0 if '下载公告' in label else 1, href))
              if candidates:
                  candidates.sort(key=lambda x: x[0])
                  return urllib.parse.unquote(candidates[0][1])
              regexes = [
                  r'https?://[^\s"\'<>]+\.PDF(?:\?[^\s"\'<>]*)?',
                  r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                  r'http%3A[^\s"\'<>]+\.PDF(?:%3F[^\s"\'<>]*)?',
                  r'https%3A[^\s"\'<>]+\.PDF(?:%3F[^\s"\'<>]*)?',
              ]
              for pattern in regexes:
                  match = re.search(pattern, text, re.I)
                  if match:
                      return urllib.parse.unquote(html.unescape(match.group(0)))
              raise RuntimeError(f'Could not find PDF link on detail page: {detail_url}')

          for record in records:
              pdf_url = extract_pdf_url(record['detail_url'])
              raw, final_url, _ = fetch(pdf_url, record['detail_url'])
              if not raw.startswith(b'%PDF-'):
                  raise SystemExit(f'Not a PDF: {pdf_url}; prefix={raw[:80]!r}')
              if len(raw) < 100_000:
                  raise SystemExit(f'PDF too small: {pdf_url}; bytes={len(raw)}')
              path = outdir / record['filename']
              path.write_bytes(raw)
              record['pdf_url'] = final_url
              record['bytes'] = len(raw)
              print(f"Saved {path} ({len(raw)} bytes) from {final_url}")

          (outdir / '_download_metadata.json').write_text(
              json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge 5
            pdftotext -f 1 -l 12 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '天合光能股份有限公司|天合光能|Trina Solar' "$pdf.txt"
            rm -f "$pdf.txt"
            echo "Validated: $(basename "$pdf") ($pages pages, $(stat -c%s "$pdf") bytes)"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          folder = Path('天合光能_688599_全部年报_招股说明书_最新季报')
          metadata = json.loads((folder / '_download_metadata.json').read_text(encoding='utf-8'))
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 8:
              raise SystemExit(f'Expected 8 PDFs, found {len(pdfs)}')

          by_name = {item['filename']: item for item in metadata}
          latest_quarter = next(item['period'] for item in metadata if item['category'] == '最新季报')
          lines = [
              '天合光能股份有限公司（天合光能，688599）',
              '上市以来全部年度报告、最终版招股说明书及最新季报',
              '整理日期：2026-10-16',
              '',
              '收录说明：',
              '1. 公司于2020年上市，本资料包收录上市以来2020—2025年度报告全文，共6份。',
              '2. 2021年年度报告采用后续披露的修订版。',
              '3. 收录2020年6月4日披露的首次公开发行股票并在科创板上市招股说明书正式版；未用招股意向书替代。',
              f'4. 截至2026-10-16，最新已披露季度报告为{latest_quarter}报告。',
              '5. 2026年半年度报告不属于季度报告，未将其替代为“最新季报”。',
              '6. PDF来自公开披露公告附件镜像，报告正文所载指定披露平台为上海证券交易所。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = by_name[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  类型：{item['category']}；报告期：{item['period']}；页数：{pages}；大小：{len(data)}字节",
                  f"  公告标题：{item['detail_title']}",
                  f"  PDF来源：{item['pdf_url']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、结构可解析性、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_download_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Trina-Solar-688599-all-annual-reports-prospectus-latest-quarter
          path: 天合光能_688599_全部年报_招股说明书_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
