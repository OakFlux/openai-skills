name: Discover Tibet Pharmaceutical brokerage reports

on:
  push:
    paths:
      - '.github/workflows/discover-tibet-pharma-brokerage-reports-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query Eastmoney report API
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time
          import requests

          code='600211'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/600211.html'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[
              ('2010-01-01','2014-12-31'),
              ('2015-01-01','2019-12-31'),
              ('2020-01-01','2022-12-31'),
              ('2023-01-01','2024-12-31'),
              ('2025-01-01','2026-10-15'),
          ]
          seen=set(); found=[]
          for begin,end in windows:
              for mode in ('company','blank'):
                  for qtype in ('0','1'):
                      for page in range(1,31):
                          params={
                              'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*',
                              'beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,
                              'orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                              '_':str(int(time.time()*1000)),
                              'code': code if mode=='company' else '',
                          }
                          r=s.get(endpoint,params=params,timeout=60)
                          print('QUERY',begin,end,mode,qtype,page,r.status_code,len(r.content),flush=True)
                          r.raise_for_status(); payload=r.json() or {}; rows=payload.get('data') or []
                          if not rows: break
                          for row in rows:
                              stock=str(row.get('stockCode') or '')
                              name=str(row.get('stockName') or '')
                              title=str(row.get('title') or '')
                              if stock==code or '西藏药业' in name or '西藏药业' in title:
                                  info=str(row.get('infoCode') or '')
                                  if info and info not in seen:
                                      seen.add(info); found.append(row)
                                      print('FOUND',json.dumps(row,ensure_ascii=False),flush=True)
                          if len(rows)<100: break
          print('FINAL_FOUND',len(found),flush=True)
          for row in sorted(found,key=lambda x:(str(x.get('publishDate') or ''),int(x.get('attachPages') or 0)),reverse=True):
              print('SUMMARY',json.dumps({k:row.get(k) for k in (
                  'title','stockName','stockCode','orgSName','publishDate','infoCode','attachPages','attachSize',
                  'researcher','emRatingName','column','reportType','ratingChangeName')},ensure_ascii=False),flush=True)
          PY