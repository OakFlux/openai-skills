name: Package Fenglong 002931 broker reports

on:
  push:
    paths:
      - '.github/workflows/fenglong-002931-broker-reports-package-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '锋龙股份'
          CODE = '002931'
          CUTOFF = '2026-10-28'
          CUTOFF_COMPACT = '20261028'
          ROOT_NAME = f'{COMPANY}_{CODE}_券商研究报告_精选3份_截至{CUTOFF_COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          REPORT_DIR = ROOT / '报告PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          DIST = Path('dist')
          for d in (REPORT_DIR, PREVIEW_DIR, DIST):
              d.mkdir(parents=True, exist_ok=True)

          REPORTS = [
              {
                  'filename': '01_川财证券_2021-09-01_公司深度_园林机械配件行业领导者汽车零配件和液压元件加速成长.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202109021513787636_1.pdf',
                  'broker': '川财证券',
                  'date': '2021-09-01',
                  'title': '中国制造之先进制造：机械基础件：锋龙股份：园林机械配件行业领导者，汽车零配件和液压元件加速公司成长',
                  'authors': '孙灿',
                  'rating': '增持',
                  'report_type': '公司深度（首次覆盖）',
                  'priority': 1,
              },
              {
                  'filename': '02_川财证券_2022-04-23_公司事件点评_毛利率修复低于预期疫情制约二季度经营.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202204251561566269_1.pdf?1650926546000.pdf=',
                  'broker': '川财证券',
                  'date': '2022-04-23',
                  'title': '公司毛利率修复情况低于我们预期，疫情制约公司二季度经营发力',
                  'authors': '孙灿',
                  'rating': '增持',
                  'report_type': '公司事件点评',
                  'priority': 2,
              },
              {
                  'filename': '03_恒泰证券_2018-03-22_新股申购_预计上市初期压力位23元至27元.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201803221108326362_1.pdf',
                  'broker': '恒泰证券',
                  'date': '2018-03-22',
                  'title': '新股申购：预计上市初期压力位23元-27元',
                  'authors': '廖文凯',
                  'rating': '未评级',
                  'report_type': '新股申购研究（补充材料）',
                  'priority': 3,
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6, connect=6, read=6, status=6, backoff_factor=1.0,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}), raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://data.eastmoney.com/report/',
          })

          def safe_name(value: str) -> str:
              return re.sub(r'_+', '_', re.sub(r'[\\/:*?"<>|]', '_', value)).strip('_. ')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          records = []
          for report in REPORTS:
              response = session.get(report['url'], timeout=180, allow_redirects=True)
              print('DOWNLOAD', response.status_code, len(response.content), report['url'], '->', response.url)
              response.raise_for_status()
              if len(response.content) < 80_000 or not response.content.startswith(b'%PDF'):
                  raise RuntimeError(f"Not a complete PDF: {report['url']} size={len(response.content)} head={response.content[:20]!r}")

              destination = REPORT_DIR / safe_name(report['filename'])
              destination.write_bytes(response.content)

              reader = PdfReader(str(destination), strict=False)
              if reader.is_encrypted:
                  try:
                      reader.decrypt('')
                  except Exception as exc:
                      raise RuntimeError(f'Encrypted PDF cannot be opened: {destination}: {exc}')
              page_count = len(reader.pages)
              if page_count < 2:
                  raise RuntimeError(f'Abnormal page count: {destination}: {page_count}')

              doc = fitz.open(destination)
              if doc.page_count != page_count:
                  raise RuntimeError(f'Parser page mismatch: {destination}: pypdf={page_count}, fitz={doc.page_count}')
              first_pix = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
              last_pix = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
              if min(first_pix.width, first_pix.height, last_pix.width, last_pix.height) < 100:
                  raise RuntimeError(f'Render validation failed: {destination}')
              preview_path = PREVIEW_DIR / f'{destination.stem}.png'
              first_pix.save(preview_path)

              text = ''
              for page_index in range(min(8, doc.page_count)):
                  try:
                      text += doc.load_page(page_index).get_text('text')
                  except Exception:
                      pass
              doc.close()
              compact = re.sub(r'\s+', '', text)
              if COMPANY not in compact and CODE not in compact and '浙江锋龙电气股份有限公司' not in compact:
                  raise RuntimeError(f'Company identity not found in PDF: {destination}')
              broker_key = report['broker'].replace('证券', '')
              if broker_key not in compact and report['broker'] not in compact:
                  raise RuntimeError(f'Broker identity not found in PDF: {destination}')

              record = {
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'rating': report['rating'],
                  'report_type': report['report_type'],
                  'source_url': report['url'],
                  'resolved_url': response.url,
                  'relative_path': str(destination.relative_to(ROOT)).replace(os.sep, '/'),
                  'file_name': destination.name,
                  'file_size_bytes': destination.stat().st_size,
                  'page_count': page_count,
                  'sha256': sha256(destination),
                  'pdf_header_valid': True,
                  'first_page_rendered': True,
                  'last_page_rendered': True,
                  'company_identity_validated': True,
                  'broker_identity_validated': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False))

          manifest = {
              'company': COMPANY,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'document_count': len(records),
              'selection_note': '公开渠道可完整取得的常规公司研究覆盖较少；本包优先收录公司深度报告和后续公司点评，并以一份上市前新股研究作为补充。',
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{record['sha256']}  {record['relative_path']}" for record in records) + '\n',
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）券商研究报告精选', '',
              f'- 截止日期：{CUTOFF}',
              '- 本包共3份公开可完整取得的券商研究报告。',
              '- 其中第1份为公司深度/首次覆盖，第2份为后续公司事件点评，第3份为上市前新股申购研究补充。',
              '- 所有PDF均保留原始内容，未合并或改写。',
              '- 已完成PDF文件头、双解析器页数、公司与券商身份、首末页渲染、SHA-256及ZIP CRC校验。', '',
              '## 文件清单', '',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. `{record['relative_path']}`",
                  f"   - 机构：{record['broker']}；日期：{record['date']}；类型：{record['report_type']}",
                  f"   - 标题：{record['title']}",
                  f"   - 分析师：{record['authors']}；评级：{record['rating']}",
                  f"   - 页数：{record['page_count']}；文件大小：{record['file_size_bytes']:,}字节",
                  f"   - 来源：{record['source_url']}",
                  f"   - SHA-256：`{record['sha256']}`",
              ])
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          chinese_zip = DIST / f'{ROOT_NAME}.zip'
          english_zip = DIST / f'fenglong_002931_broker_research_reports_3_{CUTOFF_COMPACT}.zip'
          for path in (chinese_zip, english_zip):
              if path.exists():
                  path.unlink()

          with zipfile.ZipFile(chinese_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(chinese_zip, english_zip)

          for path in (chinese_zip, english_zip):
              with zipfile.ZipFile(path, 'r') as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {path}: {bad}')
                  pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdfs) != 3:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {path}: {len(pdfs)}')
              print('ZIP_VERIFIED', path, path.stat().st_size, sha256(path))

          print('FINAL_JSON', json.dumps({
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'chinese_zip': str(chinese_zip),
              'english_zip': str(english_zip),
              'chinese_zip_size': chinese_zip.stat().st_size,
              'chinese_zip_sha256': sha256(chinese_zip),
              'records': records,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenglong-002931-broker-reports-package-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
