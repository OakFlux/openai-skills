name: Search bearing report keywords 20261005
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/search-bearing-report-keywords-20261005.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query report keywords
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          api='https://reportapi.eastmoney.com/report/list'
          for keyword in ['轴承','雷迪克','人形机器人轴承','汽车轴承','国产化到全球化']:
            print('KEYWORD',keyword)
            for qtype in ['0','1']:
              for page in range(1,8):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2026-10-05','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','keyword':keyword,'p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                r=s.get(api,params=params,timeout=120); r.raise_for_status()
                rows=r.json().get('data') or []
                print('Q',qtype,'PAGE',page,'COUNT',len(rows))
                for row in rows:
                  title=str(row.get('title') or '')
                  if keyword in title or '轴承' in title or '雷迪克' in title:
                    print('MATCH',json.dumps(row,ensure_ascii=False))
                if len(rows)<100:
                  break
          PY
