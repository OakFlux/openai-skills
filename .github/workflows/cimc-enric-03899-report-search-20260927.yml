name: Search CIMC Enric 03899 broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/cimc-enric-03899-report-search-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public report APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          from typing import Any
          import requests

          queries = [
              '中集安瑞科',
              '中集安瑞科 深度',
              '中集安瑞科 首次覆盖',
              '清洁能源越两岸 氢舟已过万重山',
              'LNG把握当下 氢能布局未来',
              'LNG储运订单高增',
              '绿醇 LNG 航天装备 新增长极',
              '清洁能源装备平台 能源装备 能源运营 双轮驱动',
          ]
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def collect_records(obj: Any) -> list[dict[str, Any]]:
              out=[]
              def walk(x):
                  if isinstance(x,dict):
                      if isinstance(x.get('id'),int) and isinstance(x.get('name'),str): out.append(x)
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(obj)
              uniq={}
              for r in out: uniq[r['id']]=r
              return list(uniq.values())

          results={}
          all_records={}
          for q in queries:
              payload={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=(20,90))
                  rec={'status':r.status_code,'text_head':r.text[:1000]}
                  if r.status_code==200:
                      obj=r.json(); rec['json']=obj
                      for item in collect_records(obj): all_records[item['id']]=item
                  results[q]=rec
              except Exception as e:
                  results[q]={'error':repr(e)}
              time.sleep(.5)

          # Fetch detail for likely CIMC Enric records.
          details=[]
          for rid,item in sorted(all_records.items()):
              name=item.get('name','')
              if '中集安瑞科' not in name and '3899' not in name and '03899' not in name:
                  continue
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=(20,90))
                  obj=r.json() if r.status_code==200 else {'status':r.status_code,'text':r.text[:1000]}
                  details.append({'search_record':item,'detail':obj})
              except Exception as e:
                  details.append({'search_record':item,'error':repr(e)})
              time.sleep(.2)

          Path('out/search_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/all_matching_records.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(details,ensure_ascii=False,indent=2)[:500000])
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: cimc-enric-03899-report-search
          path: out
          retention-days: 7
          if-no-files-found: error
