name: Scan Great Eagle traditional content mentions fixed

on:
  push:
    paths:
      - '.github/workflows/greateagle-traditional-content-scan-fixed-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Scan exact phrase result pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import concurrent.futures, json, re, time
          from pathlib import Path
          import requests

          API='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          HEAD={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/json','Content-Type':'application/json;charset=UTF-8','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'}
          queries={'鷹君集團':5,'鷹君':20,'Great Eagle Holdings Limited':20,'Great Eagle Holdings':20,'Great Eagle':20}
          def get(q,page):
            body={'order':'2','pdfPage':'-1','pageNum':page,'pageSize':20,'paragraphSize':10,'keywords':q}
            for a in range(1,4):
              try:
                s=requests.Session(); s.trust_env=False; s.headers.update(HEAD)
                r=s.post(API,json=body,timeout=(15,60)); r.raise_for_status(); d=r.json()
                if d.get('code')!=0: raise RuntimeError(d)
                return {'q':q,'page':page,'response':d}
              except Exception as e:
                if a==3:return {'q':q,'page':page,'error':repr(e)}
                time.sleep(a)
          first=[get(q,1) for q in queries]
          jobs=[]
          for row in first:
            q=row['q']; d=(row.get('response') or {}).get('data') or {}
            pages=min(int(d.get('pageCount') or 1),queries[q])
            jobs.extend((q,p) for p in range(2,pages+1))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            rest=list(ex.map(lambda x:get(*x),jobs))
          rows=first+rest
          terms=['鷹君集團','鷹君','鹰君集团','鹰君','great eagle holdings','great eagle']
          exact=[]; seen=set()
          for row in rows:
            for d in (((row.get('response') or {}).get('data') or {}).get('dataList') or []):
              title=re.sub(r'<[^>]+>','',str(d.get('title') or ''))
              org=re.sub(r'<[^>]+>','',str(d.get('orgName') or ''))
              paras='\n'.join(re.sub(r'<[^>]+>','',str(p.get('content') or '')) for p in (d.get('paragraphObjs') or []))
              stocks=' '.join(str(x.get('key',''))+' '+re.sub(r'<[^>]+>','',str(x.get('value') or '')) for x in (d.get('stocks') or []) if isinstance(x,dict))
              blob='\n'.join([title,org,paras,stocks]).lower()
              matched=[t for t in terms if t.lower() in blob]
              if matched and d.get('docId') not in seen:
                seen.add(d.get('docId'))
                exact.append({'matched':matched,'query':row['q'],'titleClean':title,'orgClean':org,'parasClean':paras,'raw':d})
          exact.sort(key=lambda x:int(x['raw'].get('pubTime') or 0),reverse=True)
          # ensure_ascii=True safely escapes malformed surrogate characters from source pages.
          Path('output/matched_docs.json').write_text(json.dumps(exact,ensure_ascii=True,indent=2),encoding='utf-8')
          summary=[]
          for x in exact:
            d=x['raw']
            summary.append({'docId':d.get('docId'),'title':x['titleClean'],'org':x['orgClean'],'pub':d.get('pubTimeStr'),'pages':d.get('pageNum'),'reportType':d.get('reportType'),'docType':d.get('docType'),'stocks':d.get('stocks'),'pdfPath':d.get('pdfPath'),'coverPrefix':d.get('coverPrefix'),'matched':x['matched'],'paragraphs':x['parasClean'][:2500]})
          Path('output/summary.json').write_text(json.dumps(summary,ensure_ascii=True,indent=2),encoding='utf-8')
          print('MATCHED',len(summary),flush=True)
          print(json.dumps(summary,ensure_ascii=True,indent=2),flush=True)
          PY

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        with:
          name: greateagle-traditional-content-scan-fixed
          path: output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
