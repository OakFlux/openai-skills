name: Build Guibao Technology 300019 broker deep reports 20261012

on:
  push:
    paths:
      - '.github/workflows/guibao-300019-broker-deep-reports-full-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download and package full reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='硅宝科技_300019_券商深度报告_完整版_3份'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'broker':'开源证券','date':'2022-11-10','analysts':'金益腾、徐正凤、蒋跨跃','rating':'买入（首次覆盖）',
              'title':'硅宝科技公司首次覆盖报告：有机硅密封胶龙头持续扩张，布局硅碳负极材料成长可期',
              'info_code':'AP202211101580137109','terms':['硅宝科技','有机硅密封胶龙头','硅碳负极'],
              'filename':'01_开源证券_硅宝科技_有机硅密封胶龙头持续扩张布局硅碳负极材料成长可期_完整版_2022-11-10.pdf'
            },
            {
              'broker':'华安证券','date':'2022-10-18','analysts':'尹沿技、王强峰','rating':'买入（首次覆盖）',
              'title':'硅宝科技：建筑密封胶头部地位稳固，工业胶快速扩容',
              'info_code':'AP202210181579258595','terms':['硅宝科技','建筑密封胶','工业胶'],
              'filename':'02_华安证券_硅宝科技_建筑密封胶头部地位稳固工业胶快速扩容_完整版_2022-10-18.pdf'
            },
            {
              'broker':'川财证券','date':'2020-05-28','analysts':'白竣天','rating':'增持（首次覆盖）',
              'title':'硅宝科技深度报告：内生及外延共同拓展硅橡胶市场',
              'info_code':'AP202005281380367551','terms':['硅宝科技','内生及外延','硅橡胶市场'],
              'filename':'03_川财证券_硅宝科技_内生及外延共同拓展硅橡胶市场_完整版_2020-05-28.pdf'
            }
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})

          def download(url:str)->bytes:
            last=None
            for attempt in range(7):
              try:
                r=s.get(url,timeout=(25,180),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*;q=0.8'})
                last=(r.status_code,len(r.content),r.headers.get('content-type'))
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                  return r.content
              except Exception as e: last=repr(e)
              time.sleep(1+attempt)
            raise RuntimeError(f'download failed {url}: {last}')

          manifest=[]
          for r in reports:
            url=f"https://pdf.dfcfw.com/pdf/H3_{r['info_code']}_1.pdf"
            data=download(url)
            dest=root/r['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<12: raise RuntimeError(f'too few pages: {dest.name} {pages}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(10,pages)])
            compact=re.sub(r'\s+','',text)
            if not any(x in compact for x in ['硅宝科技','300019','成都硅宝']):
              raise RuntimeError(f'issuer mismatch: {dest.name}')
            matched=[t for t in r['terms'] if re.sub(r'\s+','',t) in compact]
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('preview failed')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**r,'source_report_page':f"https://data.eastmoney.com/report/info/{r['info_code']}.html",'pdf_url':url,'pages':pages,'bytes':len(data),'sha256':sha,'matched_terms':matched,'preview_file':str(Path('首页预览')/preview.name)})

          readme=['硅宝科技（300019.SZ）券商深度报告完整版资料包','整理日期：2026-10-12','','本包收录3份公开可直接取得的券商原始完整PDF，不是预览页重制文件。','']
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",f"   完整页数：{x['pages']}页；文件：{x['filename']}",f"   来源页面：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、公司名称/证券代码、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3: raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          Path('guibao_broker_reports_full.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: guibao-300019-broker-deep-reports-full-final
          path: |
            硅宝科技_300019_券商深度报告_完整版_3份.zip
            guibao_broker_reports_full.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
