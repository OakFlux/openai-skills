name: chatgpt-temp-dazhong-api-diagnostic
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-api-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect records in target date windows
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json,time
          from pathlib import Path
          import requests
          W=Path('dazhong_diag');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          found=[];samples=[];logs=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          def parse(t):
            try:return json.loads(t)
            except:pass
            a=t.find('{');b=t.rfind('}')
            try:return json.loads(t[a:b+1]) if a>=0 and b>a else {}
            except:return {}
          def rows(o):
            x=o.get('data') or []
            if isinstance(x,dict):x=x.get('data') or x.get('list') or []
            return x if isinstance(x,list) else []
          windows=[('2023-07-01','2023-07-31'),('2022-12-01','2023-01-10'),('2022-04-01','2022-04-30'),('2017-04-01','2017-09-30')]
          needles=['大众','600635','创投增厚','四大板块多元发展','公用事业平稳发展','华璨基金','投资收益减少']
          for begin,end in windows:
            for endpoint in ['list','jg']:
              for q in range(0,7):
                for pg in range(1,120):
                  p={'cb':'jQuery1124','pageSize':100,'pageNo':pg,'qType':q,'beginTime':begin,'endTime':end,'fields':'','orgCode':'','author':'','industryCode':'*','industry':'*','rating':'','ratingChange':'','rcode':'','_':int(time.time()*1000)}
                  r=s.get(f'https://reportapi.eastmoney.com/report/{endpoint}',params=p,timeout=45);o=parse(r.text);rs=rows(o)
                  if pg==1:L(f'{begin} {endpoint} q={q} first rows={len(rs)} total={o.get("TotalPage")} samplekeys={list(rs[0]) if rs else []}')
                  if rs and len(samples)<10:samples.extend(rs[:min(2,10-len(samples))])
                  for rec in rs:
                    txt=json.dumps(rec,ensure_ascii=False)
                    if any(n in txt for n in needles):
                      found.append({'window':[begin,end],'endpoint':endpoint,'qtype':q,'record':rec});L('FOUND '+txt)
                  total=int(o.get('TotalPage') or 1)
                  if not rs or pg>=total:break
          (W/'found.json').write_text(json.dumps(found,ensure_ascii=False,indent=2),encoding='utf-8');(W/'samples.json').write_text(json.dumps(samples,ensure_ascii=False,indent=2),encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          print('FINAL found',len(found),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Eastmoney-Diagnostic
          path: dazhong_diag
          retention-days: 1
          compression-level: 6
