name: Fast probe Qingsong Health broker reports 20260919

on:
  push:
    paths:
      - '.github/workflows/qingsong-health-broker-report-fast-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Probe
        shell: bash
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=['https://www.fxbaogao.com/detail/5188870','https://www.fxbaogao.com/detail/5319486','https://www.hkstarlightgroup.com/news/id-99.html']
          for url in urls:
            print('\n===',url,flush=True)
            try:
              r=s.get(url,timeout=(10,20),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),flush=True)
              text=r.text; soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all(['a','iframe','embed','object','script'],href=True):
                print('A',urljoin(r.url,a.get('href')),flush=True)
              for tag in soup.find_all(['a','iframe','embed','object','script']):
                for attr in ('href','src','data','data-url','data-file','data-pdf'):
                  v=tag.get(attr)
                  if v and any(k in v.lower() for k in ('.pdf','download','file','report','oss')):
                    print('LINK',attr,urljoin(r.url,v),flush=True)
              pats=[r'https?://[^\"\'<> ]+?\.pdf(?:\?[^\"\'<> ]*)?',r'[/A-Za-z0-9_.-]+\.pdf(?:\?[^\"\'<> ]*)?']
              for p in pats:
                for m in sorted(set(re.findall(p,text,re.I))): print('PDF',urljoin(r.url,m),flush=True)
              for line in text.splitlines():
                if any(k in line.lower() for k in ('download','pdf','5188870','5319486','reportid','fileurl')):
                  print('LINE',line[:1800],flush=True)
            except Exception as e: print('ERR',repr(e),flush=True)
          PY
