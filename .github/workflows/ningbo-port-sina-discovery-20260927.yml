name: Discover Ningbo Port Sina broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-sina-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch and inspect Sina report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out = Path('discovery')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://stock.finance.sina.com.cn/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def decode(r):
              raw = r.content
              for enc in ('utf-8','gb18030','gbk'):
                  try:
                      return raw.decode(enc)
                  except Exception:
                      pass
              return raw.decode('latin1','replace')

          list_urls = []
          base = 'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml'
          for p in range(1, 9):
              list_urls.extend([
                  f'{base}?symbol=sh601018&t1=all&p={p}',
                  f'{base}?symbol=sh601018&t1=all&page={p}',
                  f'{base}?symbol=sh601018&t1=all&num={p}',
              ])

          reports = {}
          list_summaries = []
          seen_hash = set()
          import hashlib
          for idx, url in enumerate(list_urls, 1):
              try:
                  r = s.get(url, timeout=(20,90), allow_redirects=True)
                  text = decode(r)
                  h = hashlib.sha256(r.content).hexdigest()
                  print('LIST', idx, r.status_code, len(r.content), h[:12], r.url, flush=True)
                  if r.status_code != 200 or len(r.content) < 500:
                      continue
                  if h in seen_hash:
                      print('LIST_DUPLICATE_CONTENT', url, flush=True)
                  seen_hash.add(h)
                  name = f'list_{idx:02d}_{h[:10]}.html'
                  (out/name).write_text(text, encoding='utf-8')
                  soup = BeautifulSoup(text, 'lxml')
                  page_reports=[]
                  for a in soup.find_all('a', href=True):
                      href = urllib.parse.urljoin(r.url, a['href'])
                      label = ' '.join(a.get_text(' ', strip=True).split())
                      m = re.search(r'/rptid/(\d+)', href)
                      if m:
                          rid=m.group(1)
                          reports.setdefault(rid, {'rptid':rid,'list_titles':[],'detail_url':href})
                          if label and label not in reports[rid]['list_titles']:
                              reports[rid]['list_titles'].append(label)
                          page_reports.append({'rptid':rid,'title':label,'url':href})
                  list_summaries.append({'request_url':url,'final_url':r.url,'sha256':h,'reports':page_reports})
                  print('LIST_REPORTS', len(page_reports), json.dumps(page_reports[:10], ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('LIST_ERR', url, repr(exc), flush=True)

          # Always inspect the known deep-report page.
          reports.setdefault('560941685719', {
              'rptid':'560941685719',
              'list_titles':['宁波港(601018)公司深度分析：非凡大港斩获殊勋茂绩 多重政策催发上行量能'],
              'detail_url':'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/560941685719/index.phtml'
          })

          detail_records=[]
          for rid, rec in sorted(reports.items()):
              url=rec['detail_url']
              try:
                  r=s.get(url, timeout=(20,90), allow_redirects=True)
                  text=decode(r)
                  print('DETAIL', rid, r.status_code, len(r.content), r.url, flush=True)
                  if r.status_code != 200:
                      continue
                  (out/f'detail_{rid}.html').write_text(text, encoding='utf-8')
                  soup=BeautifulSoup(text,'lxml')
                  title=' '.join((soup.title.get_text(' ',strip=True) if soup.title else '').split())
                  links=[]
                  for tag in soup.find_all(True):
                      for attr in ('href','src','data-url','data-src','onclick'):
                          val=tag.get(attr)
                          if not val:
                              continue
                          sval=str(val)
                          if attr in ('href','src','data-url','data-src'):
                              sval=urllib.parse.urljoin(r.url,sval)
                          if any(k in sval.lower() for k in ('pdf','download','attach','file','report','rpt','doc')) or '下载' in sval:
                              links.append({'tag':tag.name,'attr':attr,'value':sval,'text':' '.join(tag.get_text(' ',strip=True).split())[:200]})
                  # Also scan raw text for absolute URLs and strings around PDF/download tokens.
                  raw_urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+', text)))
                  raw_interesting=[u for u in raw_urls if any(k in u.lower() for k in ('pdf','download','attach','file','report','rpt','doc'))]
                  snippets=[]
                  for pat in ('pdf','download','下载','附件','报告全文','rptid','file'):
                      for m in list(re.finditer(pat,text,re.I))[:20]:
                          snippets.append(text[max(0,m.start()-180):min(len(text),m.end()+300)])
                  record={
                      'rptid':rid,'url':r.url,'title':title,'list_titles':rec.get('list_titles',[]),
                      'links':links,'raw_interesting_urls':raw_interesting,'snippets':snippets[:80],
                      'visible_text':' '.join(soup.get_text(' ',strip=True).split())[:8000],
                  }
                  detail_records.append(record)
                  print('DETAIL_TITLE', rid, title, flush=True)
                  print('DETAIL_LINKS', rid, json.dumps(links[:80],ensure_ascii=False), flush=True)
                  print('DETAIL_RAW_URLS', rid, json.dumps(raw_interesting[:80],ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('DETAIL_ERR', rid, repr(exc), flush=True)

          (out/'list_summaries.json').write_text(json.dumps(list_summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'detail_records.json').write_text(json.dumps(detail_records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL_REPORT_IDS', len(reports), flush=True)
          PY

      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-sina-discovery
          path: discovery
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
