name: Package verified Loongson brokerage deep reports

on:
  push:
    paths:
      - '.github/workflows/package-loongson-brokerage-reports-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Discover, download, validate, and package reports
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests

          PACKAGE = '龙芯中科_688047_券商深度及首次覆盖报告精选_3份'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / 'PDF文件'
          VERIFY_DIR = ROOT / '验证记录'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          VERIFY_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/688047.html',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          candidates: list[dict[str, Any]] = [
              {
                  'priority': 90,
                  'info_code': 'AP202206291575539310',
                  'broker': '开源证券',
                  'date': '2022-06-29',
                  'title': '公司首次覆盖报告：领先国产CPU厂商，全面打造自主生态',
                  'researcher': '陈宝健、刘逍遥',
                  'rating': '买入（首次）',
                  'report_type': '公司首次覆盖报告',
                  'public_page': 'https://data.eastmoney.com/report/info/AP202206291575539310.html',
              },
              {
                  'priority': 85,
                  'info_code': 'AP202207281576632640',
                  'broker': '开源证券',
                  'date': '2022-07-28',
                  'title': '公司深度报告：国产自主通用CPU核心供应商，步入发展黄金期',
                  'researcher': '刘翔、傅盛盛',
                  'rating': '买入（维持）',
                  'report_type': '公司深度报告',
                  'public_page': 'https://data.eastmoney.com/report/info/AP202207281576632640.html',
              },
              {
                  'priority': 80,
                  'info_code': 'AP202212281581427936',
                  'broker': '东兴证券',
                  'date': '2022-12-28',
                  'title': '国产CPU生态建设者，工控、通用领域两开花',
                  'researcher': '刘蒙、张永嘉',
                  'rating': '推荐',
                  'report_type': '公司研究报告',
                  'public_page': 'https://data.eastmoney.com/report/info/AP202212281581427936.html',
              },
              {
                  'priority': 70,
                  'info_code': 'AP202206221573875809',
                  'broker': '中航证券',
                  'date': '2022-06-22',
                  'title': '新股报告：高度自主可控，引领国产CPU生态',
                  'researcher': '刘牧野',
                  'rating': '增持',
                  'report_type': '新股研究报告',
                  'public_page': 'https://data.eastmoney.com/report/info/AP202206221573875809.html',
              },
          ]

          # Discover the 2022-12-12 Ping An first-coverage report from Eastmoney's public report API.
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          discovered = []
          for mode in ('code', 'blank'):
              for page in range(1, 20):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*', 'rating': '*',
                      'ratingchange': '*', 'beginTime': '2022-12-11', 'endTime': '2022-12-13',
                      'pageNo': str(page), 'fields': '', 'qType': '0', 'orgCode': '',
                      'code': '688047' if mode == 'code' else '', 'rcode': '', 'p': str(page),
                      'pageNum': str(page), 'pageNumber': str(page), '_': str(int(time.time() * 1000)),
                  }
                  try:
                      response = session.get(endpoint, params=params, timeout=90)
                      response.raise_for_status()
                      rows = (response.json() or {}).get('data') or []
                  except Exception as exc:
                      print('API_ERROR', mode, page, repr(exc), flush=True)
                      break
                  print('API_ROWS', mode, page, len(rows), flush=True)
                  if not rows:
                      break
                  for row in rows:
                      stock_code = str(row.get('stockCode') or '')
                      stock_name = str(row.get('stockName') or '')
                      title = str(row.get('title') or '')
                      if (stock_code == '688047' or '龙芯中科' in stock_name) and '国产CPU引领者' in title:
                          discovered.append(row)
                          print('PINGAN_DISCOVERED', json.dumps(row, ensure_ascii=False), flush=True)
                  if len(rows) < 100:
                      break
          for row in discovered:
              info_code = str(row.get('infoCode') or '')
              if info_code and not any(c['info_code'] == info_code for c in candidates):
                  date = str(row.get('publishDate') or '')[:10] or '2022-12-12'
                  candidates.insert(0, {
                      'priority': 100,
                      'info_code': info_code,
                      'broker': str(row.get('orgSName') or row.get('orgName') or '平安证券'),
                      'date': date,
                      'title': str(row.get('title') or '国产CPU引领者，构建自主可控生态体系'),
                      'researcher': str(row.get('researcher') or '付强、闫磊、徐勇'),
                      'rating': str(row.get('emRatingName') or row.get('ratingName') or '推荐（首次）'),
                      'report_type': '公司首次覆盖报告',
                      'public_page': f'https://data.eastmoney.com/report/info/{info_code}.html',
                      'api_attach_pages': row.get('attachPages'),
                      'api_attach_size': row.get('attachSize'),
                  })

          # Save discovery metadata before attempting downloads.
          VERIFY_DIR.joinpath('候选报告元数据.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2), encoding='utf-8')

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              text = re.sub(r'\s+', '', text).strip('._ ')
              return text[:80]

          def download_report(candidate: dict[str, Any], destination: Path) -> tuple[str, list[dict[str, Any]]]:
              info_code = candidate['info_code']
              variants = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              ]
              attempts = []
              for url in variants:
                  for attempt in range(1, 4):
                      try:
                          response = session.get(url, timeout=240, allow_redirects=True, headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': candidate['public_page'],
                              'Accept': 'application/pdf,*/*;q=0.8',
                          })
                          meta = {
                              'requested_url': url,
                              'final_url': response.url,
                              'status': response.status_code,
                              'content_type': response.headers.get('content-type'),
                              'bytes': len(response.content),
                              'attempt': attempt,
                          }
                          attempts.append(meta)
                          if response.status_code == 200 and response.content.startswith(b'%PDF') and len(response.content) > 100_000:
                              destination.write_bytes(response.content)
                              return response.url, attempts
                      except Exception as exc:
                          attempts.append({'requested_url': url, 'attempt': attempt, 'error': repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError('download failed: ' + json.dumps(attempts, ensure_ascii=False))

          validated: list[dict[str, Any]] = []
          hashes = set()
          for candidate in sorted(candidates, key=lambda x: x.get('priority', 0), reverse=True):
              work_pdf = PDF_DIR / ('temp_' + candidate['info_code'] + '.pdf')
              try:
                  source_url, attempts = download_report(candidate, work_pdf)
                  data = work_pdf.read_bytes()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in hashes:
                      work_pdf.unlink(missing_ok=True)
                      continue

                  qpdf = subprocess.run(['qpdf', '--warning-exit-0', '--check', str(work_pdf)], capture_output=True, text=True)
                  if qpdf.returncode != 0:
                      raise RuntimeError('qpdf failed: ' + qpdf.stderr[-2000:])
                  info = subprocess.run(['pdfinfo', str(work_pdf)], capture_output=True, text=True)
                  if info.returncode != 0:
                      raise RuntimeError('pdfinfo failed: ' + info.stderr[-1000:])
                  page_match = re.search(r'^Pages:\s+(\d+)', info.stdout, re.M)
                  if not page_match:
                      raise RuntimeError('page count unavailable')
                  pages = int(page_match.group(1))
                  if pages < 10:
                      raise RuntimeError(f'only {pages} pages; excluded as not sufficiently in-depth')

                  text_file = VERIFY_DIR / (candidate['info_code'] + '_前8页.txt')
                  text_run = subprocess.run(['pdftotext', '-f', '1', '-l', str(min(8, pages)), '-layout', str(work_pdf), str(text_file)], capture_output=True, text=True)
                  if text_run.returncode != 0:
                      raise RuntimeError('pdftotext failed: ' + text_run.stderr[-1000:])
                  text = text_file.read_text(encoding='utf-8', errors='replace')
                  compact = re.sub(r'\s+', '', text)
                  if '龙芯中科' not in compact and '688047' not in compact:
                      raise RuntimeError('company identity check failed')
                  title_tokens = [token for token in re.split(r'[：，、“”\s]+', candidate['title']) if len(token) >= 4]
                  title_hit = any(re.sub(r'\s+', '', token) in compact for token in title_tokens[:8])
                  if not title_hit:
                      raise RuntimeError('title identity check failed')

                  render_prefix = VERIFY_DIR / (candidate['info_code'] + '_首页')
                  render = subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(work_pdf), str(render_prefix)], capture_output=True, text=True)
                  render_file = Path(str(render_prefix) + '.png')
                  if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                      raise RuntimeError('first-page render failed')
                  render_bytes = render_file.stat().st_size
                  render_file.unlink()

                  final_name = f'{len(validated)+1:02d}_{safe_name(candidate["broker"])}_{candidate["date"]}_{safe_name(candidate["title"])}.pdf'
                  final_path = PDF_DIR / final_name
                  work_pdf.replace(final_path)
                  hashes.add(digest)
                  record = {
                      **candidate,
                      'filename': f'PDF文件/{final_name}',
                      'source_pdf_url': source_url,
                      'pages': pages,
                      'bytes': len(data),
                      'sha256': digest,
                      'first_page_render_bytes': render_bytes,
                      'download_attempts': attempts,
                  }
                  validated.append(record)
                  print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)
                  if len(validated) == 3:
                      break
              except Exception as exc:
                  print('CANDIDATE_FAILED', candidate['info_code'], candidate['title'], repr(exc), flush=True)
                  work_pdf.unlink(missing_ok=True)

          if len(validated) < 2:
              raise RuntimeError(f'Only {len(validated)} sufficiently long original PDFs were validated.')

          # Re-number if only two reports were available.
          if len(validated) != 3:
              for old_index, record in enumerate(validated, start=1):
                  old_path = ROOT / record['filename']
                  new_name = re.sub(r'^\d{2}_', f'{old_index:02d}_', old_path.name)
                  new_path = PDF_DIR / new_name
                  if old_path != new_path:
                      old_path.replace(new_path)
                  record['filename'] = f'PDF文件/{new_name}'

          report_count = len(validated)
          final_package = f'龙芯中科_688047_券商深度及首次覆盖报告精选_{report_count}份'
          final_root = Path(final_package)
          if final_root != ROOT:
              ROOT.rename(final_root)
              ROOT = final_root
              PDF_DIR = ROOT / 'PDF文件'
              VERIFY_DIR = ROOT / '验证记录'

          readme = [
              f'龙芯中科（688047.SH）券商深度及首次覆盖报告精选{report_count}份',
              '整理日期：2026-10-15',
              '',
              '本包仅收录可从公开渠道直接下载、且完成结构与内容身份核验的券商原始排版PDF。',
              '筛选规则：报告页数不少于10页，优先选择公司深度、首次覆盖和新股研究类报告；未使用网页打印版或短篇业绩点评补足数量。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(validated, start=1):
              readme += [
                  f'{index}. {record["broker"]}，{record["date"]}，{record["pages"]}页',
                  f'   标题：{record["title"]}',
                  f'   分析师：{record.get("researcher") or "公开页面未列明"}',
                  f'   评级：{record.get("rating") or "公开页面未列明"}',
                  f'   类型：{record.get("report_type") or "公司研究报告"}',
                  f'   文件：{record["filename"]}',
                  f'   研报页面：{record["public_page"]}',
                  f'   PDF来源：{record["source_pdf_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]
          (ROOT / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(validated, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in validated), encoding='utf-8')

          zip_path = Path(final_package + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{final_package}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != report_count:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}, expected={report_count}')

          print('FINAL_PACKAGE', json.dumps({
              'filename': zip_path.name,
              'bytes': zip_path.stat().st_size,
              'sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'report_count': report_count,
              'reports': [{key: r.get(key) for key in ('broker','date','title','pages','info_code')} for r in validated],
          }, ensure_ascii=False), flush=True)
          PY

      - name: Upload completed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: loongson-688047-brokerage-deep-reports-20261015
          path: 龙芯中科_688047_券商深度及首次覆盖报告精选_*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0