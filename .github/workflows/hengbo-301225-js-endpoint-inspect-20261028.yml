name: Inspect Hengbo report download JS endpoints 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-js-endpoint-inspect-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'*/*'})
          urls=[
            'https://www.fhyanbao.com/_next/static/chunks/pages/rpview/%5Bid%5D-4ae703460cf49130.js',
            'https://www.sdyanbao.com/_nuxt/0bec462.js',
            'https://www.sdyanbao.com/_nuxt/7ff3a18.js',
            'https://www.sdyanbao.com/_nuxt/359ac1f.js',
            'https://www.sdyanbao.com/_nuxt/a94fdf1.js'
          ]
          keys=['/api/report/download','report/download','downloadReport','preview','download','fileUrl','file_url','.pdf','oss','937833','1920166','auth','token']
          for u in urls:
            print('\n===== SCRIPT',u,'=====')
            try:
              r=s.get(u,timeout=(10,30))
              print('STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
              t=r.text
              for k in keys:
                ms=list(re.finditer(re.escape(k),t,re.I))
                if ms:
                  print('\nKEY',k,'COUNT',len(ms))
                  for m in ms[:12]:
                    print(t[max(0,m.start()-500):min(len(t),m.end()+900)][:1600])
              pats=[r'https?://[^"\'<>\s]+',r'/api/[A-Za-z0-9_./?=&${}-]+']
              links=[]
              for p in pats:
                links.extend(re.findall(p,t,re.I))
              uniq=[]
              for x in links:
                x=html.unescape(x).replace('\\/','/')
                if x not in uniq and any(k in x.lower() for k in ['report','download','pdf','file','preview','api']): uniq.append(x)
              print('LINKS',json.dumps(uniq[:200],ensure_ascii=False))
            except Exception as e: print('ERROR',repr(e))
          PY
