name: Inspect Makeng Mining report sources

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-report-source-inspection-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf pillow
      - name: Inspect pages, APIs and candidate files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, re, requests, time
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from urllib.parse import urljoin, urlparse
          from pathlib import Path

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Connection':'close'})
          pages=[
            'https://www.fxbaogao.com/detail/5612427',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/846069340415/index.phtml',
            'https://shiguang.cn/stock/601123/',
            'https://www.51pdf.cn/report_xg_p6/',
            'https://www.nxny.com/stype_1025_p64/',
          ]
          endpoints=[
            'https://api.fxbaogao.com/mofoun/report/readReport/readReport?reportId=5612427',
            'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId=5612427',
            'https://api.fxbaogao.com/mofoun/report/report/file/downloadReport?reportId=5612427',
            'https://api.fxbaogao.com/mofoun/report/report/report/preDownV2?reportId=5612427',
            'https://api.fxbaogao.com/mofoun/report/report/downloadReportByBean?reportId=5612427',
            'https://api.fxbaogao.com/mofoun/report/searchReport/detail/catalog?reportId=5612427',
          ]
          candidates=[]; images=[]
          url_re=re.compile(r'''(?:(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+)''',re.I)
          def process_text(base,text,label):
            (out/(re.sub(r'[^A-Za-z0-9._-]+','_',label)+'.txt')).write_text(text[:2000000],encoding='utf-8',errors='ignore')
            soup=BeautifulSoup(text,'html.parser')
            print('TITLE',label,soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
            for tag in soup.find_all(['a','script','iframe','embed','object','form','link','img']):
              for attr in ('href','src','data','action'):
                val=tag.get(attr)
                if not val: continue
                full=urljoin(base,val.replace('\\/','/'))
                low=full.lower()
                txt=' '.join(tag.get_text(' ',strip=True).split())[:300]
                if any(k in low for k in ('.pdf','download','report','api','file','preview')) or any(k in txt for k in ('马矿股份','原矿产量','新股精要','下载')):
                  print('TAG',label,tag.name,attr,full,txt,flush=True)
                  candidates.append(full)
                if any(ext in low for ext in ('.png','.jpg','.jpeg','.webp')):
                  images.append(full)
            raw=text.replace('\\/','/')
            for m in url_re.finditer(raw):
              val=m.group(0).rstrip('),;]}')
              if val.startswith('//'): val='https:'+val
              full=urljoin(base,val)
              low=full.lower()
              if any(k in low for k in ('.pdf','downloadreport','predown','report-cn/','report-en/','report-image/','previewimage','file/download')):
                print('RAW_CANDIDATE',label,full,flush=True)
                candidates.append(full)
              if any(ext in low for ext in ('.png','.jpg','.jpeg','.webp')) and ('report' in low or 'preview' in low):
                images.append(full)
            try:
              obj=json.loads(text)
              def walk(v):
                if isinstance(v,dict):
                  for k,x in v.items():
                    if isinstance(x,str):
                      yield k,x
                    else: yield from walk(x)
                elif isinstance(v,list):
                  for x in v: yield from walk(x)
              for k,v in walk(obj):
                full=urljoin(base,v.replace('\\/','/'))
                low=full.lower()
                if any(q in low for q in ('.pdf','report-cn/','report-en/','download','fileurl','report-image/')):
                  print('JSON_CANDIDATE',label,k,full,flush=True); candidates.append(full)
                if any(ext in low for ext in ('.png','.jpg','.jpeg','.webp')):
                  images.append(full)
            except Exception: pass

          for i,url in enumerate(pages):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('PAGE',i,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              process_text(r.url,r.text,f'page_{i}')
            except Exception as e: print('PAGE_ERROR',url,repr(e),flush=True)
          for i,url in enumerate(endpoints):
            try:
              r=s.get(url,headers={'Referer':'https://www.fxbaogao.com/detail/5612427'},timeout=60,allow_redirects=True)
              print('ENDPOINT',i,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              if r.content.startswith(b'%PDF'):
                reader=PdfReader(io.BytesIO(r.content),strict=False)
                print('ENDPOINT_PDF',url,'pages',len(reader.pages),flush=True)
                candidates.append(url)
              else: process_text(r.url,r.text,f'endpoint_{i}')
            except Exception as e: print('ENDPOINT_ERROR',url,repr(e),flush=True)

          # Common fxbaogao image guesses for all pages.
          for n in range(1,20):
            images.extend([
              f'https://public.fxbaogao.com/report-image/2026/08/18/5612427-{n}.png?x-oss-process=image/format,webp',
              f'https://public.fxbaogao.com/report-image/2026/08/18/5612427-{n}.png',
            ])

          # Deduplicate and test candidate PDFs and images.
          candidates=list(dict.fromkeys(candidates)); images=list(dict.fromkeys(images))
          print('CANDIDATE_COUNT',len(candidates),flush=True)
          for url in candidates[:300]:
            try:
              r=s.get(url,headers={'Referer':'https://www.fxbaogao.com/detail/5612427'},timeout=45,allow_redirects=True)
              if r.content.startswith(b'%PDF'):
                reader=PdfReader(io.BytesIO(r.content),strict=False)
                text=''
                for j in range(min(3,len(reader.pages))):
                  try:text+=reader.pages[j].extract_text() or ''
                  except Exception:pass
                print('PDF_OK',json.dumps({'url':url,'resolved':r.url,'bytes':len(r.content),'pages':len(reader.pages),'text':re.sub(r'\s+',' ',text)[:400]},ensure_ascii=False),flush=True)
              elif '.pdf' in url.lower() or 'download' in url.lower():
                print('PDF_FAIL',url,r.status_code,len(r.content),r.headers.get('content-type'),r.content[:40],flush=True)
            except Exception as e: print('CANDIDATE_ERROR',url,repr(e),flush=True)

          image_ok=[]
          for url in images[:500]:
            try:
              r=s.get(url,headers={'Referer':'https://www.fxbaogao.com/detail/5612427'},timeout=35,allow_redirects=True)
              if r.status_code==200 and len(r.content)>20000 and r.content[:4] not in (b'<htm',b'<!DO'):
                from PIL import Image
                im=Image.open(io.BytesIO(r.content)); im.load()
                if im.width>=700 and im.height>=800:
                  image_ok.append((url,r.url,len(r.content),im.width,im.height,im.format))
                  print('IMAGE_OK',json.dumps(image_ok[-1],ensure_ascii=False),flush=True)
            except Exception: pass
          print('IMAGE_OK_COUNT',len(image_ok),flush=True)
          print('IMAGE_OK_FINAL',json.dumps(image_ok,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-601123-report-source-inspection-20261104
          path: out/
          retention-days: 7
          if-no-files-found: warn
