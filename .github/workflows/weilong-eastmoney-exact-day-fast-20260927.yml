name: Fast exact-day Eastmoney scan for Weilong reports 20260927

on:
  push:
    paths:
      - '.github/workflows/weilong-eastmoney-exact-day-fast-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          API='https://reportapi.eastmoney.com/report/list'
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/javascript,*/*;q=0.01'})
          def parse(r):
            try:return r.json()
            except:
              m=re.search(r'^[^(]*\((.*)\)\s*;?$',r.text.strip(),re.S);return json.loads(m.group(1)) if m else {}
          dates=['2025-02-27','2025-04-28','2025-04-29','2025-06-24','2025-06-25','2024-10-18','2021-05-21']
          hits=[];meta=[]
          for day in dates:
            for qtype in ('0','1'):
              for p in range(1,9):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':day,'endTime':day,'pageNo':str(p),'qType':qtype,'orgCode':'','code':'','rcode':'','p':str(p),'pageNum':str(p),'pageNumber':str(p)}
                r=s.get(API,params=params,timeout=(15,60));d=parse(r);data=d.get('data') or [];total=int(d.get('TotalPage') or d.get('totalPage') or 1)
                meta.append({'day':day,'qType':qtype,'page':p,'total':total,'count':len(data),'hits':d.get('hits')})
                for rec in data:
                  txt=json.dumps(rec,ensure_ascii=False)
                  if any(k in txt for k in ['卫龙','衛龍','09985','9985','魔芋','辣条','辣味']):
                    info=rec.get('infoCode') or rec.get('INFOCODE') or rec.get('id')
                    rec['_day']=day;rec['_qType']=qtype
                    rec['_candidate_pdf_urls']=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf'] if info else []
                    hits.append(rec)
                print(day,qtype,p,total,len(data),len(hits),flush=True)
                if p>=total:break
          Path('out/hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HITS_JSON',json.dumps(hits,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weilong-eastmoney-exact-day-fast-20260927
          path: out
          retention-days: 7
