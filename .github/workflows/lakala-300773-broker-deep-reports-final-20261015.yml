name: Package Lakala 300773 broker deep reports 20261015

on:
  push:
    paths:
      - '.github/workflows/lakala-300773-broker-deep-reports-final-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='拉卡拉'
          COMPANY_FULL='拉卡拉支付股份有限公司'
          STOCK_CODE='300773'
          PACKAGE='拉卡拉_300773_券商深度报告_完整版_3份_截至20261015'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)

          reports=[
            {
              'broker':'开源证券','date':'2024-01-15','analysts':'高超、唐关勇','rating':'买入',
              'title':'公司首次覆盖报告：受益量价齐升和格局优化，“支付+”赛道空间长远',
              'info_code':'AP202401151617493790','min_pages':35,
              'terms':['拉卡拉','支付+','首次覆盖','量价齐升','格局优化'],
              'filename':'01_开源证券_拉卡拉首次覆盖_受益量价齐升和格局优化支付加赛道空间长远_2024-01-15_完整版.pdf'
            },
            {
              'broker':'国金证券','date':'2023-05-14','analysts':'陆意','rating':'买入',
              'title':'第三方收单机构龙头，量价齐升可期',
              'info_code':'AP202305141586621461','min_pages':20,
              'terms':['拉卡拉','第三方收单','量价齐升','收单机构龙头'],
              'filename':'02_国金证券_拉卡拉_第三方收单机构龙头量价齐升可期_2023-05-14_完整版.pdf'
            },
            {
              'broker':'东吴证券','date':'2019-07-16','analysts':'张良卫','rating':'买入',
              'title':'B端支付龙头，科技赋能小微成长',
              'info_code':'AP201907161339008073','min_pages':40,
              'terms':['拉卡拉','B端支付','科技赋能','小微成长'],
              'filename':'03_东吴证券_拉卡拉_B端支付龙头科技赋能小微成长_2019-07-16_完整版.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def compact(x:str)->str:
            return re.sub(r'\s+','',x or '')

          def download(info_code:str)->tuple[bytes,str,dict]:
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
            ]
            last={}
            for url in urls:
              for attempt in range(6):
                try:
                  r=s.get(url,timeout=(30,300),allow_redirects=True,headers={
                    'User-Agent':s.headers['User-Agent'],
                    'Referer':f'https://data.eastmoney.com/report/info/{info_code}.html',
                    'Accept':'application/pdf,*/*;q=0.8'
                  })
                  last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                    return r.content,url,last
                except Exception as e:
                  last={'url':url,'error':repr(e)}
                time.sleep(1+attempt)
            raise RuntimeError(f'下载失败 {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,pdf_url,download_meta=download(item['info_code'])
            dest=root/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<item['min_pages']:
              raise RuntimeError(f'页数不足 {dest.name}: {pages} < {item["min_pages"]}')

            text=''
            for p in reader.pages[:min(15,pages)]:
              try: text+='\n'+(p.extract_text() or '')
              except Exception: pass
            if len(compact(text))<100:
              txt=dest.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(15,pages)),str(dest),str(txt)],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if txt.exists(): text+='\n'+txt.read_text(encoding='utf-8',errors='ignore')
            text_c=compact(text)
            identity=[x for x in [COMPANY,COMPANY_FULL,STOCK_CODE] if compact(x) in text_c]
            matched=[x for x in item['terms'] if compact(x) in text_c]
            if not identity:
              raise RuntimeError(f'公司身份核验失败: {dest.name}')
            if not matched:
              raise RuntimeError(f'标题关键词核验失败: {dest.name}')

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError(f'首页预览失败: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **item,
              'source_report_page':f"https://data.eastmoney.com/report/info/{item['info_code']}.html",
              'pdf_url':pdf_url,
              'actual_pages':pages,
              'bytes':len(data),
              'sha256':sha,
              'identity_terms':identity,
              'matched_terms':matched,
              'download_meta':download_meta,
              'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商原始完整PDF',
              'validation':['PDF header','issuer identity','title keywords','actual page count','qpdf structure','first-page render']
            })

          readme=[
            '拉卡拉支付股份有限公司（300773.SZ）券商深度报告完整版资料包',
            '整理日期：2026-10-15','',
            '本包收录3份公开可直接取得的券商原始完整PDF，分别为首次覆盖、公司深度和收单行业专题。',
            '三份报告来自不同券商，页数分别为约43页、24页和46页，未使用短篇点评凑数。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",'',
            ]
          readme += [
            '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、标题关键词、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3:
              raise RuntimeError(f'ZIP核验失败 bad={bad} pdfs={len(pdfs)}')
          Path('lakala_300773_broker_deep_reports.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: lakala-300773-broker-deep-reports-final-20261015
          path: |
            拉卡拉_300773_券商深度报告_完整版_3份_截至20261015.zip
            lakala_300773_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
