name: Package final Rihai Intelligent 002313 reports 20261020

on:
  push:
    paths:
      - '.github/workflows/rihai-002313-reports-final-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Download, verify and zip reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          reports = [
              {
                  'period': '2020',
                  'title': '日海智能：2020年年度报告（更新后）',
                  'date': '2021-05-14',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202105131491494873_1.pdf',
              },
              {
                  'period': '2021',
                  'title': '日海智能：2021年年度报告',
                  'date': '2022-04-30',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202204301562383533_1.pdf',
              },
              {
                  'period': '2022',
                  'title': '*ST日海：2022年年度报告',
                  'date': '2023-04-17',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202304161585487345_1.pdf',
              },
              {
                  'period': '2023',
                  'title': '日海智能：2023年年度报告',
                  'date': '2024-03-29',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202403281628556064_1.pdf',
              },
              {
                  'period': '2024',
                  'title': '日海智能：2024年年度报告',
                  'date': '2025-03-21',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202503201645183282_1.pdf',
              },
              {
                  'period': '2025',
                  'title': '日海智能：2025年年度报告',
                  'date': '2026-04-23',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202604221821460119_1.pdf',
              },
              {
                  'period': '2026Q1',
                  'title': '日海智能：2026年一季度报告',
                  'date': '2026-04-28',
                  'url': 'https://pdf.dfcfw.com/pdf/H2_AN202604271821619500_1.pdf',
              },
          ]

          root = Path('日海智能_002313_报告包')
          pdf_dir = root / 'PDF'
          pdf_dir.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download(url):
              last = None
              for attempt in range(6):
                  try:
                      response = session.get(url, timeout=(20, 180))
                      last = response
                      if response.status_code == 200 and response.content.startswith(b'%PDF'):
                          return response.content
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 ** attempt, 10))
              raise RuntimeError(f'Failed to download {url}: {last!r}')

          for index, item in enumerate(reports, start=1):
              content = download(item['url'])
              safe_title = re.sub(r'[\\/:*?"<>|]+', '_', item['title'])
              filename = f'{index:02d}_{safe_title}.pdf'
              path = pdf_dir / filename
              path.write_bytes(content)
              pages = len(PdfReader(str(path)).pages)
              if pages < 2:
                  raise RuntimeError(f'Invalid page count {pages}: {item["title"]}')
              item['filename'] = f'PDF/{filename}'
              item['pages'] = pages
              item['bytes'] = len(content)
              item['sha256'] = hashlib.sha256(content).hexdigest()
              print('VERIFIED', item['period'], filename, pages, len(content))

          manifest = {
              'company': '日海智能科技股份有限公司',
              'stock_code': '002313',
              'generated_at': '2026-10-20',
              'latest_quarterly_report': '2026年一季度报告',
              'reports': reports,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          lines = [
              '# 日海智能（002313）报告文件清单',
              '',
              '- 范围：2020—2025年年度报告及截至2026-10-20最新季度报告。',
              '- 最新季度报告：2026年一季度报告，公告日期2026-04-28。',
              '- PDF来源：东方财富公告镜像；每个文件均已验证PDF格式、页数并计算SHA-256。',
              '',
              '| 序号 | 报告期 | 公告标题 | 公告日期 | 页数 | 文件 | 来源链接 |',
              '|---:|---|---|---|---:|---|---|',
          ]
          for i, item in enumerate(reports, start=1):
              lines.append(
                  f'| {i} | {item["period"]} | {item["title"]} | {item["date"]} | {item["pages"]} | `{item["filename"]}` | {item["url"]} |'
              )
          lines.extend(['', '## SHA-256 校验', ''])
          for item in reports:
              lines.append(f'- `{item["filename"]}`：`{item["sha256"]}`')
          (root / '文件清单.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          zip_name = '日海智能_002313_2020-2025年报及最新季报_20261020.zip'
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      archive.write(file, arcname=str(file.relative_to(root)))
          print('PACKAGE', zip_name, Path(zip_name).stat().st_size)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: rihai-intelligent-002313-reports-final-20261020
          path: 日海智能_002313_2020-2025年报及最新季报_20261020.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
