name: Probe Shaanxi Jinye 2026 Q3 report URL

on:
  push:
    branches:
      - tmp-shaanxi-jinye-q3-probe-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe sources
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          print('--- CNINFO TOP SEARCH ---')
          try:
              r=s.get('https://www.cninfo.com.cn/new/information/topSearch/query',params={'keyWord':'000812','maxSecNum':10},headers={'Referer':'https://www.cninfo.com.cn/'},timeout=(10,30))
              print('TOP',r.status_code,len(r.content),r.text[:1000])
              entries=r.json() if r.ok else []
              org='gssz0000812'
              for e in entries:
                  if str(e.get('code') or e.get('secCode') or '')=='000812':
                      org=e.get('orgId') or e.get('orgid') or org
              print('ORG',org)
              form={'pageNum':'1','pageSize':'100','column':'szse','tabName':'fulltext','plate':'sz','stock':f'000812,{org}','searchkey':'2026年第三季度报告','secid':'','category':'category_sjdbg_szsh;','trade':'','seDate':'2026-10-01~2026-10-29','sortName':'','sortType':'','isHLtitle':'true'}
              q=s.post('https://www.cninfo.com.cn/new/hisAnnouncement/query',data=form,headers={'Referer':'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search','X-Requested-With':'XMLHttpRequest','Origin':'https://www.cninfo.com.cn'},timeout=(10,30))
              print('QUERY',q.status_code,len(q.content),q.text[:3000])
              if q.ok:
                  for a in (q.json().get('announcements') or []):
                      title=re.sub(r'<[^>]+>','',html.unescape(a.get('announcementTitle') or ''))
                      print('ANN',title,a.get('announcementTime'),a.get('adjunctUrl'),a.get('announcementId'))
          except Exception as e:
              print('CNINFO ERROR',repr(e))

          print('--- SINA Q3 LIST ---')
          try:
              u='https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/000812/page_type/sjdbg.phtml'
              r=s.get(u,timeout=(10,30),allow_redirects=True)
              print('SINA LIST',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              r.encoding=r.apparent_encoding or 'gb18030'
              soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.find_all('a',href=True):
                  label=re.sub(r'\s+','',a.get_text(' ',strip=True))
                  if '2026年第三季度报告' in label:
                      detail=urljoin(r.url,a.get('href'))
                      print('SINA DETAIL',label,detail)
                      d=s.get(detail,timeout=(10,30),allow_redirects=True)
                      d.encoding=d.apparent_encoding or 'gb18030'
                      print('DETAIL STATUS',d.status_code,len(d.content),d.url)
                      soup2=BeautifulSoup(d.text,'html.parser')
                      for x in soup2.find_all('a',href=True):
                          href=urljoin(d.url,x.get('href'))
                          if '.pdf' in href.lower(): print('SINA PDF',href)
          except Exception as e:
              print('SINA ERROR',repr(e))
          PY
