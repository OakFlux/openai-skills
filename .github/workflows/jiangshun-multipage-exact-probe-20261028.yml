name: Probe multipage Jiangshun exact-date lists 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jiangshun-multipage-exact-probe-20261028.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet requests
      - name: Scan all pages on high-volume dates
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          dates=['2025-09-02','2026-08-28','2026-09-02']
          terms=['江顺科技','深化3D打印布局','主业筑牢基本盘','铝型材挤压模具','新兴领域打开第二曲线']
          found=[]
          for d in dates:
            for qtype in ['0','1','2']:
              for page in range(1,8):
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':d,'endTime':d,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(api,params=p,timeout=(15,90));o=r.json();rows=o.get('data') or []
                  if isinstance(rows,dict):rows=rows.get('list') or rows.get('data') or []
                  total=int(o.get('TotalPage') or 1)
                  print('PAGE',d,qtype,page,'ROWS',len(rows),'TOTAL',total)
                  for row in rows:
                    title=str(row.get('title') or '');code=str(row.get('stockCode') or '');name=str(row.get('stockName') or '')
                    if code=='001400' or '江顺科技' in name or any(t in title for t in terms):
                      item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','author','emRatingName','sRatingName','stockCode','stockName','industryName']}
                      print('MATCH',json.dumps(item,ensure_ascii=False));found.append(item)
                  if page>=total or not rows:break
                except Exception as e:print('ERR',d,qtype,page,repr(e));break
          print('FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          PY
