name: Download official Zenergy 03677 filings 20260922

on:
  push:
    paths:
      - '.github/workflows/zenergy-03677-filings-download-only-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download and package official PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, time, zipfile
          from pathlib import Path
          import urllib.request

          PACKAGE='正力新能_03677_全部年报_招股说明书及最新中期业绩'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          docs=[
            ('01_正力新能_03677_2025年年度报告_中文版_2026-04-23.pdf','正力新能2025年年度报告（中文版）','annual_report','Chinese','2026-04-23','https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042302899_c.pdf'),
            ('02_ZENERGY_03677_2025_Annual_Report_English_2026-04-23.pdf','ZENERGY 2025 Annual Report (English)','annual_report','English','2026-04-23','https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0423/2026042302898.pdf'),
            ('03_正力新能_03677_招股章程_中文版_2025-04-03.pdf','正力新能招股章程（中文版）','prospectus','Chinese','2025-04-03','https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0403/2025040300014_c.pdf'),
            ('04_ZENERGY_03677_Prospectus_English_2025-04-03.pdf','ZENERGY Prospectus (English)','prospectus','English','2025-04-03','https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0403/2025040300013.pdf'),
            ('05_正力新能_03677_2026年中期业绩公告_中文版_2026-08-31.pdf','截至2026年6月30日止六个月中期业绩公告（中文版）','latest_interim_results','Chinese','2026-08-31','https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0831/2026083100863_c.pdf'),
            ('06_ZENERGY_03677_2026_Interim_Results_English_2026-08-31.pdf','Interim Results for the Six Months Ended June 30, 2026 (English)','latest_interim_results','English','2026-08-31','https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0831/2026083100862.pdf'),
          ]
          opener=urllib.request.build_opener()
          opener.addheaders=[
            ('User-Agent','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'),
            ('Accept','application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'),
            ('Accept-Language','zh-CN,zh;q=0.9,en;q=0.8'),
            ('Referer','https://www1.hkexnews.hk/'),
          ]
          records=[]
          for filename,title,typ,lang,d,url in docs:
            dest=out/filename
            errors=[]
            for attempt in range(1,5):
              try:
                print('DOWNLOAD',filename,'attempt',attempt,url,flush=True)
                with opener.open(url,timeout=300) as r, dest.open('wb') as f:
                  while True:
                    chunk=r.read(1024*1024)
                    if not chunk: break
                    f.write(chunk)
                if dest.stat().st_size<50000 or dest.read_bytes()[:5]!=b'%PDF-':
                  raise RuntimeError(f'invalid PDF size={dest.stat().st_size}')
                break
              except Exception as e:
                errors.append(repr(e)); dest.unlink(missing_ok=True); time.sleep(attempt*2)
            if not dest.exists():
              raise RuntimeError(f'failed {filename}: {errors}')
            data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            rec={'filename':filename,'title':title,'document_type':typ,'language':lang,'release_date':d,'source':'香港交易所披露易','source_url':url,'bytes':len(data),'sha256':sha}
            records.append(rec)
            print('DOWNLOADED',json.dumps(rec,ensure_ascii=False),flush=True)

          readme=[
            '江苏正力新能电池技术股份有限公司（03677.HK）官方披露文件',
            '整理日期：2026-09-22','',
            '收录范围：上市后全部完整年度报告、最终招股章程，以及截至整理日最新阶段性财务报告。',
            '公司于2025-04-14在香港联交所上市，因此截至整理日，上市后完整年度报告只有2025年年度报告。',
            '公司已获豁免无须另行刊发2024年年度报告；2024年度历史财务资料载于招股章程。',
            '截至2026-09-22，最新阶段性财务披露为2026-08-31发布的截至2026年6月30日止六个月中期业绩公告。','',
            '文件清单：'
          ]
          for i,r in enumerate(records,1):
            readme += [f"{i}. {r['title']}",f"   文件：{r['filename']}",f"   披露日期：{r['release_date']}；大小：{r['bytes']/1048576:.2f} MB",f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
            for p in sorted(out.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failure: '+bad)
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: zenergy-03677-filings-download-only
          path: 正力新能_03677_全部年报_招股说明书及最新中期业绩.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
