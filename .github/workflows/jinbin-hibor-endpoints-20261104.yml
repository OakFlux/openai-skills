name: Inspect Hibor endpoints for Jinbin report
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jinbin-hibor-endpoints-20261104.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import html,json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urls=[
            'https://www.hibor.com.cn/JS/sysdownload.js',
            'https://www.hibor.com.cn/js/docdetailJSN.js?ver=2020',
            'https://www.hibor.com.cn/wap_detail.aspx?id=100915&un=&wp=2&fromtype=2&sm=1',
            'https://www.hibor.com.cn/100915',
            'https://www.hibor.com.cn/docdetail.asp?id=100915',
            'https://www.hibor.com.cn/checkauthor.asp?fromurl=https://www.hibor.com.cn:443/docdetail.asp?id=100915',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148','Referer':'https://www.hibor.com.cn/docdetail_100915.html'})
          for u in urls:
            try:
              r=s.get(u,timeout=120,allow_redirects=True);t=html.unescape(r.text)
              print('\n===FETCH===',u,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              print('HEAD',t[:2000])
              found=[];soup=BeautifulSoup(t,'html.parser')
              for tag in soup.find_all(True):
                for a in ('href','src','data-src','data-url','value','onclick','action','content'):
                  v=tag.get(a)
                  if v and any(k in str(v).lower() for k in ('pdf','down','attach','file','read','view','100915','auth','url')):
                    found.append({'tag':tag.name,'attr':a,'value':urljoin(r.url,str(v)),'text':tag.get_text(' ',strip=True)[:150]})
              print('FOUND',json.dumps(found,ensure_ascii=False,indent=2))
              for k in ('100915','download','sysdown','href','pdf','view','read','fileurl','filepath','checkauthor'):
                i=t.lower().find(k.lower())
                if i>=0:print('CTX',k,t[max(0,i-1000):i+3500])
            except Exception as e: print('ERR',u,repr(e))
          PY
