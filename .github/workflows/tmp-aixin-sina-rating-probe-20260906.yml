name: Temporary Aixin Sina rating links

on:
  push:
    branches:
      - tmp-aixin-sina-rating-probe-20260906

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and parse public pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          urls=[
            'https://vip.stock.finance.sina.com.cn/hk/rating.php?symbol=00600',
            'https://stock.finance.sina.com.cn/hkstock/quotes/00600.html'
          ]
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          results=[]
          for index,url in enumerate(urls,1):
            try:
              response=session.get(url,timeout=90,allow_redirects=True)
              soup=BeautifulSoup(response.text,'html.parser')
              items=[]
              for tag in soup.find_all(['a','form','script','iframe']):
                text=' '.join(tag.get_text(' ',strip=True).split())
                attrs={key:value for key,value in tag.attrs.items()}
                haystack=(text+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(term in haystack for term in ['查看','report','rating','研报','00600','research']):
                  items.append({'tag':tag.name,'text':text[:1000],'attrs':attrs})
              row={'url':url,'status':response.status_code,'bytes':len(response.content),'final_url':response.url,'title':soup.title.get_text(' ',strip=True) if soup.title else None,'items':items}
              results.append(row)
              (out/f'page_{index}.html').write_bytes(response.content)
              print('PAGE',response.status_code,len(response.content),response.url,row['title'],flush=True)
              for item in items[:200]:
                print('ITEM',json.dumps(item,ensure_ascii=False),flush=True)
            except Exception as error:
              results.append({'url':url,'error':repr(error)})
              print('ERROR',url,repr(error),flush=True)
          (out/'results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-sina-rating-links
          path: output/*
          retention-days: 1
          if-no-files-found: error
