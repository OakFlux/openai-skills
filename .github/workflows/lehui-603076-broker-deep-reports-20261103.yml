name: Build Lehui 603076 broker deep reports 20261103

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lehui-603076-broker-deep-reports-20261103.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '603076'
          SHORT = '乐惠国际'
          FULL = '宁波乐惠国际工程装备股份有限公司'
          PACKAGE = '乐惠国际_603076_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          targets = [
              {
                  'title': '设备主业恢复稳健，鲜啤第二曲线韧性成长',
                  'title_token': '设备主业恢复稳健鲜啤第二曲线韧性成长',
                  'broker': '东吴证券',
                  'broker_aliases': ['东吴证券', '东吴证券研究所'],
                  'date': '2026-06-30',
                  'classification': '公司深度研究／首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '苏铖、郭晓东',
                  'min_pages': 18,
                  'fallback_urls': [],
              },
              {
                  'title': '设备业务行业领先，鲜啤业务势头正盛',
                  'title_token': '设备业务行业领先鲜啤业务势头正盛',
                  'broker': '华源证券',
                  'broker_aliases': ['华源证券', '华源证券研究所'],
                  'date': '2025-09-19',
                  'classification': '首次覆盖报告',
                  'rating': '增持（首次）',
                  'analysts': '张东雪、林若尧、周翔、郦悦轩',
                  'min_pages': 15,
                  'fallback_urls': ['https://pdf.dfcfw.com/pdf/H3_AP202509191746688545_1.pdf'],
              },
              {
                  'title': '海外装备空间广阔，鲜啤业务放量在即',
                  'title_token': '海外装备空间广阔鲜啤业务放量在即',
                  'broker': '甬兴证券',
                  'broker_aliases': ['甬兴证券', '甬兴证券研究所'],
                  'date': '2024-06-28',
                  'classification': '公司深度／首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '汪玲、夏明达',
                  'min_pages': 20,
                  'fallback_urls': ['https://file.iyanbao.com/pdf/f306b-20624c33-a9a4-4096-9f41-61d5db5add9a.pdf'],
              },
              {
                  'title': '二次创业新篇章，第二主业扬帆起航',
                  'title_token': '二次创业新篇章第二主业扬帆起航',
                  'broker': '华鑫证券',
                  'broker_aliases': ['华鑫证券', '华鑫证券研究所'],
                  'date': '2022-10-13',
                  'classification': '公司深度报告／首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '孙山山',
                  'min_pages': 20,
                  'fallback_urls': ['https://pdf.dfcfw.com/pdf/H3_AP202210131579126249_1.pdf'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          session.headers.update({'User-Agent': ua, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'})

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:120]

          api_rows = []
          api_error = None
          try:
              payload = {
                  'pageSize': 100, 'pageNo': 1, 'p': 1, 'pageNum': 1, 'pageNumber': 1,
                  'beginTime': '2022-01-01', 'endTime': '2026-11-03', 'code': CODE,
                  'industryCode': '*', 'rating': None, 'ratingChange': None,
                  'orgCode': None, 'rcode': ''
              }
              r = session.post(
                  'https://reportapi.eastmoney.com/report/list2',
                  json=payload,
                  headers={'Content-Type': 'application/json'},
                  timeout=(30, 90),
              )
              print('API', r.status_code, r.headers.get('content-type'), len(r.content))
              r.raise_for_status()
              obj = r.json()
              api_rows = obj.get('data') or []
              print('API_REPORTS', len(api_rows), json.dumps([
                  {
                      'title': x.get('title'), 'org': x.get('orgSName'),
                      'date': x.get('publishDate'), 'infoCode': x.get('infoCode')
                  } for x in api_rows
              ], ensure_ascii=False))
          except Exception as exc:
              api_error = repr(exc)
              print('API_ERROR', api_error)

          discovery = {'api_error': api_error, 'api_rows': api_rows, 'targets': targets}
          (ROOT / 'report_discovery.json').write_text(json.dumps(discovery, ensure_ascii=False, indent=2), encoding='utf-8')

          manifest = []
          failures = []
          for target in targets:
              if len(manifest) >= 3:
                  break

              candidate_urls = []
              matched_api = []
              for row in api_rows:
                  row_title = row.get('title') or ''
                  row_org = row.get('orgSName') or row.get('orgName') or ''
                  if normalize(target['title_token']) in normalize(row_title):
                      info = row.get('infoCode') or row.get('infocode') or ''
                      if info:
                          matched_api.append({
                              'title': row_title,
                              'org': row_org,
                              'date': row.get('publishDate'),
                              'infoCode': info,
                          })
                          candidate_urls.append(f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf')
              candidate_urls.extend(target['fallback_urls'])
              candidate_urls = list(dict.fromkeys(candidate_urls))

              attempts = []
              accepted = None
              target_errors = []
              for url in candidate_urls:
                  data = None
                  for attempt in range(5):
                      try:
                          if 'dfcfw.com' in url:
                              referer = 'https://data.eastmoney.com/report/'
                          elif 'iyanbao.com' in url:
                              referer = 'https://www.iyanbao.com/'
                          else:
                              referer = 'https://www.eastmoney.com/'
                          pr = session.get(
                              url,
                              headers={'User-Agent': ua, 'Referer': referer, 'Accept': 'application/pdf,*/*;q=0.8'},
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url, 'attempt': attempt + 1, 'status': pr.status_code,
                              'bytes': len(pr.content), 'content_type': pr.headers.get('content-type', ''),
                              'final_url': pr.url,
                          })
                          if pr.status_code == 200 and pr.content[:5] == b'%PDF-' and len(pr.content) > 80000:
                              data = pr.content
                              break
                          if pr.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is None:
                      continue

                  tmp = ROOT / '_candidate.pdf'
                  tmp.write_bytes(data)
                  try:
                      reader = PdfReader(str(tmp), strict=False)
                      pages = len(reader.pages)
                      if pages < target['min_pages']:
                          target_errors.append(f'{url}: only {pages} pages')
                          continue
                      text = ''
                      for page in reader.pages[:min(60, pages)]:
                          try:
                              text += '\n' + (page.extract_text() or '')
                          except Exception:
                              pass
                      compact = normalize(text)
                      identity_hits = [x for x in (SHORT, FULL, CODE, '乐惠国际工程装备') if normalize(x) in compact]
                      broker_hits = [x for x in target['broker_aliases'] if normalize(x) in compact]
                      title_hit = normalize(target['title_token']) in compact
                      if len(compact) > 500 and not identity_hits:
                          target_errors.append(f'{url}: issuer mismatch')
                          continue
                      if len(compact) > 500 and not broker_hits:
                          target_errors.append(f'{url}: broker mismatch')
                          continue
                      if len(compact) > 500 and not title_hit:
                          target_errors.append(f'{url}: title mismatch')
                          continue
                      accepted = {
                          'data': data, 'source_url': url, 'pages': pages,
                          'identity_hits': identity_hits, 'broker_hits': broker_hits,
                          'title_hit': title_hit, 'matched_api': matched_api,
                          'attempts': attempts.copy(),
                      }
                      break
                  finally:
                      tmp.unlink(missing_ok=True)

              if accepted is None:
                  failures.append({
                      'target': target, 'matched_api': matched_api,
                      'candidate_urls': candidate_urls, 'attempts': attempts,
                      'errors': target_errors,
                  })
                  print('TARGET_FAILED', target['title'], json.dumps(failures[-1], ensure_ascii=False))
                  continue

              idx = len(manifest) + 1
              filename = f"{idx:02d}_{safe(target['broker'])}_乐惠国际_{safe(target['title'])}_{target['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(accepted['data'])

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(accepted['data']).hexdigest()
              record = {
                  **{k: v for k, v in target.items() if k not in ('fallback_urls', 'broker_aliases', 'title_token', 'min_pages')},
                  'source_url': accepted['source_url'],
                  'candidate_urls': candidate_urls,
                  'matched_api': accepted['matched_api'],
                  'actual_pages': accepted['pages'],
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(accepted['data']),
                  'sha256': sha,
                  'identity_hits': accepted['identity_hits'],
                  'broker_hits': accepted['broker_hits'],
                  'title_hit': accepted['title_hit'],
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': accepted['attempts'],
                  'validation': [
                      'PDF header', 'issuer identity', 'broker identity', 'report title',
                      'page count', 'qpdf structure', 'first-page render'
                  ],
              }
              manifest.append(record)
              print('VERIFIED', record['broker'], record['title'], record['actual_pages'], record['bytes'], sha, record['source_url'])

          (ROOT / 'failed_candidates.json').write_text(json.dumps(failures, ensure_ascii=False, indent=2), encoding='utf-8')
          if len(manifest) < 3:
              raise RuntimeError(f'Only {len(manifest)} valid reports were packaged; failures={json.dumps(failures, ensure_ascii=False)}')

          total_pages = sum(x['actual_pages'] for x in manifest)
          readme = [
              '宁波乐惠国际工程装备股份有限公司（603076.SH）券商深度研究报告资料包',
              '整理日期：2026-11-03', '',
              '本包收录3份公开可直接取得并完成完整性核验的券商原始PDF。',
              '筛选口径：公司深度、首次覆盖或较完整的公司研究；不使用普通财报点评、行业周报或网页摘要凑数。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   PDF来源：{x['source_url']}",
                  f"   SHA-256：{x['sha256']}", '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('lehui_603076_broker_deep_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: lehui-603076-broker-deep-reports-final
          path: |
            乐惠国际_603076_券商深度报告_3份.zip
            lehui_603076_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
