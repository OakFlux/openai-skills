name: Parse Sina CCCC Development report list 20260927

on:
  push:
    paths:
      - '.github/workflows/sina-cccc-report-list-parse-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Parse list and report details
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, html as htmlmod
          from urllib.parse import urljoin
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          u='https://vip.stock.finance.sina.com.cn/q/go.php/vReport_List/kind/search/index.phtml?symbol=sz000736&orgname=&industry=&title=&t1=all'
          r=s.get(u,timeout=(20,90),allow_redirects=True); r.raise_for_status(); r.encoding='gbk'; text=r.text
          print('LIST_STATUS',r.status_code,r.url,len(text),flush=True)
          # Print each table row containing a report-show link.
          rows=re.findall(r'<tr[^>]*>(.*?)</tr>',text,re.I|re.S)
          reports=[]
          for row in rows:
            if 'vReport_Show' not in row: continue
            clean=htmlmod.unescape(re.sub(r'<[^>]+>',' ',row))
            clean=re.sub(r'\s+',' ',clean).strip()
            m=re.search(r'rptid/(\d+)/',row)
            hrefm=re.search(r'href=["\']([^"\']*vReport_Show[^"\']+)["\']',row,re.I)
            if not m: continue
            href=urljoin(r.url,hrefm.group(1)) if hrefm else ''
            rec={'rptid':m.group(1),'row_text':clean,'href':href}
            reports.append(rec); print('ROW',json.dumps(rec,ensure_ascii=False),flush=True)
          print('REPORT_COUNT',len(reports),flush=True)
          for rec in reports:
            try:
              rr=s.get(rec['href'],timeout=(20,60),allow_redirects=True); rr.raise_for_status(); rr.encoding='gbk'; t=rr.text
              title=''; org=''; date=''; content=''
              mt=re.search(r'<h1[^>]*>(.*?)</h1>',t,re.I|re.S)
              if mt: title=re.sub(r'\s+',' ',htmlmod.unescape(re.sub(r'<[^>]+>',' ',mt.group(1)))).strip()
              # Entire visible text helps identify title/date/source.
              visible=re.sub(r'<script.*?</script>|<style.*?</style>',' ',t,flags=re.I|re.S)
              visible=htmlmod.unescape(re.sub(r'<[^>]+>',' ',visible))
              visible=re.sub(r'\s+',' ',visible).strip()
              links=[]
              for x in re.findall(r'(?:href|src)=["\']([^"\']+)["\']',t,re.I):
                if any(k in x.lower() for k in ('pdf','download','file','attach')):
                  links.append(urljoin(rr.url,x))
              out={'rptid':rec['rptid'],'detail_url':rr.url,'title_h1':title,'visible_head':visible[:2500],'file_links':list(dict.fromkeys(links))[:50]}
              print('DETAIL',json.dumps(out,ensure_ascii=False),flush=True)
            except Exception as e: print('DETAIL_ERR',rec['rptid'],repr(e),flush=True)
          PY
