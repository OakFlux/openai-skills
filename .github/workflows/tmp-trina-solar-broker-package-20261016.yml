name: Build Trina Solar broker deep-report package

on:
  push:
    branches: [tmp-trina-solar-broker-reports-20261016]
    paths: ['.github/workflows/tmp-trina-solar-broker-package-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='天合光能_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=688599' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 15 "$out" "$out.txt" 2>/dev/null
            grep -Eq '天合光能股份有限公司|天合光能|Trina Solar' "$out.txt"
            rm -f "$out.txt"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202501011641499459_1.pdf' \
            "$PACKAGE/01_东海证券_大浪识英雄组件龙头稳健跨越周期_公司深度报告_2025-01-01.pdf" \
            25

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202311011607635559_1.pdf' \
            "$PACKAGE/02_川财证券_一体化布局提速多业务协同增厚盈利_深度报告_2023-11-01.pdf" \
            25

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202302111583050311_1.pdf' \
            "$PACKAGE/03_信达证券_N型一体化布局加速多业务协同空间广阔_公司深度报告_2023-02-11.pdf" \
            35

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('天合光能_券商深度报告_3份')
          meta = {
              '01_东海证券_大浪识英雄组件龙头稳健跨越周期_公司深度报告_2025-01-01.pdf': {
                  'broker': '东海证券',
                  'date': '2025-01-01',
                  'title': '公司深度报告：大浪识英雄，组件龙头稳健跨越周期',
                  'index': 'AP202501011641499459',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202501011641499459_1.pdf',
              },
              '02_川财证券_一体化布局提速多业务协同增厚盈利_深度报告_2023-11-01.pdf': {
                  'broker': '川财证券',
                  'date': '2023-11-01',
                  'title': '天合光能深度报告：一体化布局提速，多业务协同增厚盈利',
                  'index': 'AP202311011607635559',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202311011607635559_1.pdf',
              },
              '03_信达证券_N型一体化布局加速多业务协同空间广阔_公司深度报告_2023-02-11.pdf': {
                  'broker': '信达证券',
                  'date': '2023-02-11',
                  'title': '公司深度报告：N型一体化布局加速，多业务协同空间广阔',
                  'index': 'AP202302111583050311',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202302111583050311_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '天合光能（688599）券商深度报告资料包',
              '整理日期：2026-10-16',
              '',
              '收录原则：',
              '1. 仅收录明确标注为公司深度报告或深度报告的完整券商PDF。',
              '2. 排除3—10页的财报点评、季报点评和网页摘要。',
              '3. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、页数及正文公司名称检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Trina-Solar-688599-broker-deep-reports-3
          path: 天合光能_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
