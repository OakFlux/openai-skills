name: Discover public full Jingjia Micro broker reports 20260928

on:
  push:
    paths:
      - '.github/workflows/jingjiamicro-full-report-discovery-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Inspect public download pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/discover.py <<'PY'
          from __future__ import annotations
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path('out')
          targets=[
            ('yanbaoke_zhejiang','https://www.yanbaoke.com/info/ervwAqMukDb3PNqL5cdZaQ'),
            ('sdy_huachuang','https://www.sdyanbao.com/detail/903033'),
            ('why_huaxi','https://www.360why.com/bg/2cae0f000054927.html'),
            ('hangyan_zhejiang','https://www.hangyan.co/reports/3591658029633767266'),
          ]

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(
                viewport={'width':1440,'height':1100},
                locale='zh-CN',
                accept_downloads=True,
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
              )
              all_results=[]
              for name,url in targets:
                page=await ctx.new_page()
                net=[]
                downloads=[]

                async def on_response(resp):
                  try:
                    headers=await resp.all_headers()
                    ct=headers.get('content-type','')
                    if resp.request.resource_type in ('xhr','fetch','document') or 'pdf' in ct.lower() or 'download' in resp.url.lower():
                      item={
                        'url':resp.url,'status':resp.status,
                        'type':resp.request.resource_type,
                        'content_type':ct,'method':resp.request.method,
                        'post_data':resp.request.post_data,
                      }
                      try:
                        body=await resp.body()
                        item['body_bytes']=len(body)
                        if len(body)<500000 and ('json' in ct.lower() or 'text' in ct.lower() or body[:1] in (b'{',b'[')):
                          item['body_text']=body.decode('utf-8','replace')[:500000]
                        if body[:5]==b'%PDF-':
                          fn=OUT/f'{name}_network_{len(downloads)+1}.pdf'
                          fn.write_bytes(body)
                          item['saved_pdf']=fn.name
                          downloads.append(fn.name)
                      except Exception as e:
                        item['body_error']=repr(e)
                      net.append(item)
                  except Exception as e:
                    net.append({'url':getattr(resp,'url',''),'error':repr(e)})

                page.on('response',on_response)
                rec={'name':name,'input_url':url}
                try:
                  resp=await page.goto(url,wait_until='domcontentloaded',timeout=120000)
                  rec['status']=resp.status if resp else None
                  await page.wait_for_timeout(7000)
                  rec['final_url']=page.url
                  rec['title']=await page.title()
                  rec['body_text']=(await page.locator('body').inner_text())[:200000]
                  rec['links']=await page.locator('a').evaluate_all("els=>els.map(e=>({href:e.href,text:(e.innerText||'').trim(),download:e.download||''})).filter(x=>x.href)")
                  rec['buttons']=await page.locator('button,[role=button],input[type=button],input[type=submit]').evaluate_all("els=>els.map(e=>({tag:e.tagName,text:(e.innerText||e.value||'').trim(),id:e.id,cls:String(e.className||'')}))")
                  (OUT/f'{name}.html').write_text(await page.content(),encoding='utf-8')
                  await page.screenshot(path=str(OUT/f'{name}.png'),full_page=True)

                  candidates=page.locator('a,button,[role=button]')
                  count=await candidates.count()
                  clicked=[]
                  for i in range(min(count,400)):
                    el=candidates.nth(i)
                    try:
                      text=((await el.inner_text()) or '').strip()
                      if not text:
                        continue
                      low=text.lower()
                      relevant=(
                        any(k in text for k in ('下载PDF','下载pdf','PDF版本','pdf版本','立即下载','下载报告','完整报告'))
                        or ('download' in low and len(text)<80)
                      )
                      if not relevant or any(k in text for k in ('登录','会员','购买','充值','付费')):
                        continue
                      clicked.append(text[:120])
                      try:
                        async with page.expect_download(timeout=8000) as di:
                          await el.click(timeout=5000)
                        d=await di.value
                        suggested=d.suggested_filename or f'{name}_download_{len(downloads)+1}.bin'
                        safe=re.sub(r'[^0-9A-Za-z._-]+','_',suggested)
                        dest=OUT/f'{name}_{safe}'
                        await d.save_as(str(dest))
                        downloads.append(dest.name)
                      except Exception:
                        try:
                          await el.click(timeout=5000)
                          await page.wait_for_timeout(2500)
                        except Exception:
                          pass
                      if len(clicked)>=10:
                        break
                    except Exception:
                      pass
                  rec['clicked_controls']=clicked
                except Exception as e:
                  rec['error']=repr(e)
                  try:
                    await page.screenshot(path=str(OUT/f'{name}_error.png'),full_page=True)
                  except Exception:
                    pass
                rec['network']=net
                rec['downloads']=downloads
                (OUT/f'{name}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                all_results.append(rec)
                await page.close()
              (OUT/'summary.json').write_text(json.dumps(all_results,ensure_ascii=False,indent=2),encoding='utf-8')
              await browser.close()

          asyncio.run(main())
          PY
          python /tmp/discover.py
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > out/file_sizes.txt
          grep -RInE 'pdf|download|下载|完整报告|登录|会员|pay|fileUrl|pdfUrl|oss|cos' out/*.json out/*.html > out/grep_hits.txt || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: jingjiamicro-full-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
