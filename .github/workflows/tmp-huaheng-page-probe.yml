name: Temporary Huaheng prospectus page probe

on:
  push:
    branches:
      - tmp/huaheng-biotech-filings-20260830
    paths:
      - .github/workflows/tmp-huaheng-page-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests Pillow
      - run: |
          python - <<'PY'
          import io, requests
          from PIL import Image
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Referer':'https://www.sdyanbao.com/'})
          base='https://oss.sdyanbao.com/page/2022/3/26/267353'
          for i in [0,1,205,410]:
            for ext in ['png','jpg','jpeg','webp']:
              try:
                r=s.get(f'{base}/{i}.{ext}',timeout=30)
                msg=[i,ext,r.status_code,len(r.content),r.headers.get('content-type')]
                if r.status_code==200 and len(r.content)>1000:
                  try:
                    im=Image.open(io.BytesIO(r.content)); im.load(); msg += [im.format,im.size]
                  except Exception as e: msg += ['IMAGE_ERROR',repr(e)]
                print(*msg,flush=True)
              except Exception as e: print(i,ext,'ERROR',repr(e),flush=True)
          PY
