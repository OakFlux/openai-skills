name: Probe public Swire Pacific research index
on:
  push:
    branches: [tmp-swire-sd-probe-20260908]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query public research index
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report','Content-Type':'application/json;charset=UTF-8','Accept':'application/json, text/plain, */*'})
          queries=['太古股份公司','太古股份公司A','太古A','太古股份','00019.HK','00019','Swire Pacific','太古集团']
          out=[]; seen=set()
          for kw in queries:
              for page in range(1,6):
                  body={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':page,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','keyword':kw}
                  try:
                      r=s.post('https://api.sdyanbao.com/api/file/search',json=body,timeout=90)
                      obj=r.json(); data=obj.get('data') or {}; files=data.get('files') or []
                      print('QUERY',kw,page,r.status_code,'total',data.get('total'),'files',len(files),flush=True)
                      for item in files:
                          raw=json.dumps(item,ensure_ascii=False)
                          low=raw.lower()
                          if not any(x in low for x in ['太古股份公司','太古a','swire pacific','00019']):
                              continue
                          if ('太古地产' in raw or 'swire properties' in low or '01972' in raw) and not any(x in low for x in ['太古股份公司','swire pacific','00019']):
                              continue
                          key=str(item.get('id') or item.get('file_id') or item.get('name') or raw[:100])
                          if key in seen: continue
                          seen.add(key); out.append({'query':kw,'item':item})
                          print('MATCH',item.get('name'),'ORG',item.get('organization'),'PAGES',item.get('page_count'),'ID',item.get('id') or item.get('file_id'),flush=True)
                      if len(files)<100: break
                  except Exception as e:
                      out.append({'query':kw,'page':page,'error':repr(e)}); print('ERR',kw,page,repr(e),flush=True); break
          Path('output/sdyanbao_swire_matches.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT',len([x for x in out if 'item' in x]),flush=True)
          PY
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: swire-sdyanbao-probe
          path: output/*
          retention-days: 1
          if-no-files-found: error
