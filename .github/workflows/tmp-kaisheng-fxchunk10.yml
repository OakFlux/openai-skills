name: Temporary Kaisheng FXBaogao full viewer chunk

on:
  push:
    branches:
      - tmp-kaisheng-fxchunk10-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch viewer chunk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0' 'https://www.fxbaogao.com/_fxbg/2609031714/js/10.246ac11407cda3a87ce1.chunk.js' -o output/chunk10.js
          wc -c output/chunk10.js
      - name: Upload viewer chunk
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-fxbaogao-chunk10
          path: output/*
          retention-days: 1
          if-no-files-found: error
