name: inspect-fengbei-603334-long-report-sources

on:
  push:
    branches:
      - tmp/fengbei-603334-broker-inspect-20261106-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect source pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import html
          import json
          import re
          import urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out = Path('out')
          out.mkdir()
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          pages = [
              'http://news.10jqka.com.cn/field/sr/19700101/59403093.shtml',
              'https://news.10jqka.com.cn/field/sr/19700101/59403093.shtml',
              'https://news.10jqka.com.cn/field/sr/20260824/59403093.shtml',
              'https://www.fxbaogao.com/detail/5635091',
              'https://m.vzkoo.com/document/11504820241500018732bc7a4b1b.html',
              'https://www.vzkoo.com/document/11504820241500018732bc7a4b1b.html',
              'https://www.vzkoo.com/read/11505994245100018feceeacda46.html',
              'https://basic.10jqka.com.cn/603334/news.html',
          ]
          summary=[]
          for i,url in enumerate(pages,1):
              try:
                  r=session.get(url,timeout=(30,180),allow_redirects=True)
                  print('PAGE',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                  raw=out/f'{i:02d}.bin'; raw.write_bytes(r.content)
                  texts=[]
                  for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030','gbk']:
                      if not enc: continue
                      try:
                          text=r.content.decode(enc,errors='ignore')
                      except Exception:
                          continue
                      if text not in texts: texts.append(text)
                  links=[]; snippets=[]
                  for text in texts:
                      soup=BeautifulSoup(text,'html.parser')
                      for tag in soup.find_all(True):
                          for attr in ['href','src','data','data-url','data-href','value','content']:
                              value=tag.get(attr)
                              if value:
                                  absolute=urllib.parse.urljoin(r.url,html.unescape(str(value)).strip())
                                  low=absolute.lower()
                                  if any(k in low for k in ['pdf','download','file','report','yanbao','original','attach']):
                                      links.append(absolute)
                      for pattern in [
                          r'https?://[^\"\'<>\s]+',
                          r'//[^\"\'<>\s]+',
                          r'[A-Za-z0-9_./?=&%-]+\.pdf(?:\?[^\"\'<>\s]*)?',
                      ]:
                          for match in re.findall(pattern,text,flags=re.I):
                              absolute=urllib.parse.urljoin(r.url,html.unescape(match))
                              low=absolute.lower()
                              if any(k in low for k in ['pdf','download','file','report','yanbao','original','attach']):
                                  links.append(absolute)
                      for line in text.splitlines():
                          low=line.lower()
                          if any(k in low for k in ['.pdf','download','原文','附件','fileurl','file_url','reporturl','report_url','attach','59403093','11504820241500018732','5635091']):
                              line=' '.join(line.split())
                              if line and len(line)<3000:
                                  snippets.append(line)
                  links=list(dict.fromkeys(links)); snippets=list(dict.fromkeys(snippets))
                  Path(out/f'{i:02d}.links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
                  Path(out/f'{i:02d}.snippets.txt').write_text('\n'.join(snippets),encoding='utf-8')
                  print('LINKS',i,json.dumps(links[:80],ensure_ascii=False,indent=2))
                  print('SNIPPETS',i,json.dumps(snippets[:80],ensure_ascii=False,indent=2))
                  summary.append({'input':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'links':links,'snippets':snippets})
              except Exception as exc:
                  print('ERROR',i,url,repr(exc))
                  summary.append({'input':url,'error':repr(exc)})
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: fengbei-603334-long-report-source-inspection
          path: out
          if-no-files-found: error
          retention-days: 7
