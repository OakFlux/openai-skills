name: Build corrected Lehui 603076 annual reports and latest quarter 20261103

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lehui-603076-annual-reports-20261103-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import parse_qs, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          CODE = '603076'
          SHORT = '乐惠国际'
          FULL = '宁波乐惠国际工程装备股份有限公司'
          PACKAGE = '乐惠国际_603076_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          common_headers = {'User-Agent': ua, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'}

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def decode_html(resp: requests.Response) -> str:
              raw = resp.content
              encodings = [resp.encoding, resp.apparent_encoding, 'gb18030', 'gbk', 'utf-8']
              for enc in encodings:
                  if not enc:
                      continue
                  try:
                      text = raw.decode(enc, errors='strict')
                      if '乐惠国际' in text or '年度报告' in text or '下载公告' in text:
                          return text
                  except Exception:
                      pass
              return raw.decode('gb18030', errors='replace')

          def sina_pdf_url(aid: str, date: str) -> str:
              y, m, _ = date.split('-')
              return f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/{y}/{y}-{int(m)}/{date}/{aid}.PDF'

          def probe_2021(aid: str) -> bool:
              url = sina_pdf_url(aid, '2022-04-29')
              try:
                  r = session.get(url, headers={**common_headers, 'Referer': 'https://vip.stock.finance.sina.com.cn/'}, timeout=(15, 120))
                  if r.status_code != 200 or r.content[:5] != b'%PDF-' or len(r.content) < 100000:
                      return False
                  reader = PdfReader(__import__('io').BytesIO(r.content), strict=False)
                  if len(reader.pages) < 100:
                      return False
                  text = ''
                  for page in reader.pages[:20]:
                      try:
                          text += '\n' + (page.extract_text() or '')
                      except Exception:
                          pass
                  compact = normalize(text)
                  ok = '2021年年度报告' in compact and ('乐惠国际' in compact or CODE in compact)
                  print('PROBE_2021', aid, len(reader.pages), ok, url)
                  return ok
              except Exception as exc:
                  print('PROBE_2021_ERROR', aid, repr(exc))
                  return False

          def discover_2021_announcement_id() -> str:
              listing_urls = [
                  'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/603076/page_type/ndbg.phtml',
                  'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/603076/page_type/ndbg.phtml',
                  'https://money.finance.sina.com.cn/corp/view/vCB_Bulletin.php?page_type=ndbg&stockid=603076&type=list',
              ]
              candidate_ids = []
              for url in listing_urls:
                  try:
                      r = session.get(url, headers=common_headers, timeout=(20, 90))
                      print('LISTING', url, r.status_code, len(r.content), r.headers.get('content-type', ''))
                      if r.status_code != 200:
                          continue
                      text = decode_html(r)
                      soup = BeautifulSoup(text, 'html.parser')
                      for a in soup.find_all('a', href=True):
                          title = re.sub(r'\s+', '', (a.get_text(' ', strip=True) or '') + ' ' + (a.get('title') or ''))
                          href = html.unescape(a.get('href') or '')
                          if 'vCB_AllBulletinDetail.php' not in href:
                              continue
                          query = parse_qs(urlparse(urljoin(url, href)).query)
                          aid = (query.get('id') or [None])[0]
                          if aid and '2021年年度报告' in title and '摘要' not in title:
                              candidate_ids.append(str(aid))
                              print('LISTING_CANDIDATE_2021', aid, title, href)
                  except Exception as exc:
                      print('LISTING_ERROR', url, repr(exc))

              for aid in dict.fromkeys(candidate_ids):
                  if probe_2021(aid):
                      print('DISCOVERED_2021', aid)
                      return aid

              # Fallback around the 2021 report disclosure cluster; only accept a full PDF over 100 pages.
              for candidate in range(8153000, 8153131):
                  aid = str(candidate)
                  if aid in candidate_ids:
                      continue
                  if probe_2021(aid):
                      print('DISCOVERED_2021_FALLBACK', aid)
                      return aid
              raise RuntimeError(f'Unable to discover the 2021 annual report announcement ID; candidates={candidate_ids}')

          id_2021 = discover_2021_announcement_id()

          announcements = [
              {'label': '2020年年度报告', 'kind': 'annual', 'required': '2020年年度报告', 'announcement_id': '7052940', 'date': '2021-04-16', 'min_pages': 100, 'extra_urls': []},
              {'label': '2021年年度报告', 'kind': 'annual', 'required': '2021年年度报告', 'announcement_id': id_2021, 'date': '2022-04-29', 'min_pages': 100, 'extra_urls': []},
              {'label': '2022年年度报告（2023年5月二次修订）', 'kind': 'annual', 'required': '2022年年度报告', 'announcement_id': '9206399', 'date': '2023-05-12', 'min_pages': 100, 'extra_urls': []},
              {'label': '2023年年度报告', 'kind': 'annual', 'required': '2023年年度报告', 'announcement_id': '10111455', 'date': '2024-04-27', 'min_pages': 100, 'extra_urls': ['https://static.cninfo.com.cn/finalpage/2024-04-27/1219878951.PDF']},
              {'label': '2024年年度报告', 'kind': 'annual', 'required': '2024年年度报告', 'announcement_id': '10961223', 'date': '2025-04-25', 'min_pages': 100, 'extra_urls': ['https://stockn.xueqiu.com/SH603076/20250424216170.pdf']},
              {'label': '2025年年度报告', 'kind': 'annual', 'required': '2025年年度报告', 'announcement_id': '12245201', 'date': '2026-04-29', 'min_pages': 100, 'extra_urls': []},
              {'label': '2026年第三季度报告', 'kind': 'quarter', 'required': '2026年第三季度报告', 'announcement_id': '12674832', 'date': '2026-10-30', 'min_pages': 5, 'extra_urls': ['https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/603076_20261030_NHL7.pdf']},
          ]

          def candidate_urls(item: dict) -> list[str]:
              aid = item['announcement_id']
              urls = [sina_pdf_url(aid, item['date'])]
              for detail in [
                  f'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={aid}&stockid={CODE}',
                  f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={aid}&stockid={CODE}',
              ]:
                  try:
                      r = session.get(detail, headers=common_headers, timeout=(20, 60))
                      if r.status_code != 200:
                          continue
                      text = decode_html(r)
                      soup = BeautifulSoup(text, 'html.parser')
                      for a in soup.find_all('a', href=True):
                          href = html.unescape(a.get('href') or '').strip()
                          label = re.sub(r'\s+', '', a.get_text(' ', strip=True))
                          if (href.lower().endswith('.pdf') or 'file.finance.sina.com.cn' in href or 'static.sse.com.cn' in href) and ('下载' in label or '.pdf' in href.lower()):
                              urls.append(urljoin(detail, href))
                      for match in re.findall(r'https?://[^\"\'<>\s]+?\.PDF(?:\?[^\"\'<>\s]*)?', text, flags=re.I):
                          urls.append(html.unescape(match))
                  except Exception as exc:
                      print('DETAIL_ERROR', detail, repr(exc))
              urls.extend(item.get('extra_urls') or [])
              return list(dict.fromkeys(u for u in urls if u))

          manifest = []
          for idx, item in enumerate(announcements, 1):
              urls = candidate_urls(item)
              attempts = []
              data = None
              source_url = ''
              for url in urls:
                  for attempt in range(4):
                      try:
                          if 'sina.com.cn' in url:
                              referer = 'https://vip.stock.finance.sina.com.cn/'
                          elif 'sse.com.cn' in url:
                              referer = 'https://www.sse.com.cn/'
                          elif 'cninfo.com.cn' in url:
                              referer = 'https://www.cninfo.com.cn/'
                          elif 'xueqiu.com' in url:
                              referer = 'https://xueqiu.com/'
                          else:
                              referer = 'https://www.eastmoney.com/'
                          r = session.get(url, headers={**common_headers, 'Referer': referer, 'Accept': 'application/pdf,*/*;q=0.8'}, timeout=(30, 360), allow_redirects=True)
                          attempts.append({'url': url, 'attempt': attempt + 1, 'status': r.status_code, 'bytes': len(r.content), 'content_type': r.headers.get('content-type', ''), 'final_url': r.url})
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f'Download failed for {item["label"]}: {attempts}')

              filename = f'{idx:02d}_乐惠国际_{item["label"]}.pdf'
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(60, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [x for x in (SHORT, FULL, CODE, '乐惠国际工程装备') if normalize(x) in compact]
              required_hit = normalize(item['required']) in compact
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')
              if len(compact) > 500 and not required_hit:
                  raise RuntimeError(f'Report title mismatch: {filename}')

              subprocess.run(['qpdf', '--warning-exit-0', '--check', str(dest)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = PREV / dest.stem
              subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'label': item['label'], 'kind': item['kind'],
                  'announcement_id': item['announcement_id'], 'announcement_date': item['date'],
                  'source_url': source_url, 'candidate_urls': urls,
                  'filename': str(Path('原始PDF') / filename), 'pages': pages, 'bytes': len(data), 'sha256': sha,
                  'identity_hits': identity_hits, 'required_title_hit': required_hit,
                  'preview_file': str(Path('首页预览') / preview.name), 'download_attempts': attempts,
                  'validation': ['PDF header', 'issuer identity', 'report title', 'page count', 'qpdf structure', 'first-page render'],
              })
              print('VERIFIED', item['label'], pages, len(data), sha, source_url)

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '宁波乐惠国际工程装备股份有限公司（603076.SH）年度报告及最新季度报告资料包',
              '整理日期：2026-11-03', '',
              '收录范围：2020—2025年年度报告全文，以及截至整理日最新披露的2026年第三季度报告。',
              '2022年年度报告采用2023年5月12日披露的二次修订版本。',
              '不收录年度报告摘要、单独审计附件或普通公告页面。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["label"]}',
                  f'   页数：{x["pages"]}页；文件：{x["filename"]}',
                  f'   披露日期：{x["announcement_date"]}；公告ID：{x["announcement_id"]}',
                  f'   来源：{x["source_url"]}', f'   SHA-256：{x["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '核验项目：PDF文件头、公司名称/证券代码、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest), encoding='utf-8')

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('lehui_603076_2020_2025_annual_reports_latest_quarter.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: lehui-603076-all-filings-final-v2
          path: |
            乐惠国际_603076_2020-2025年报及最新季报.zip
            lehui_603076_2020_2025_annual_reports_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
