name: Temporary Inspect 9fzt Melco Report Routes

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-inspect-9fzt-melco.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public report pages and scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          pages=[
            'https://gmg.9fzt.com/report/HKSE/00200/800288177894.html',
            'https://gmg.9fzt.com/report/HKSE/00200/571497691655.html',
            'https://gmg.9fzt.com/report/HKSE/00200/568194048126.html',
            'https://gmg.9fzt.com/report/HKSE/00200/588845351474.html',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://gmg.9fzt.com/'})
          result={'pages':[],'scripts':[],'probes':[]};scripts=[]
          needles=['pdf','download','file','attach','origin','source','研报原文','报告原文','800288177894','api','oss','cdn']
          for u in pages:
            try:
              r=s.get(u,timeout=60,allow_redirects=True);text=html.unescape(r.text).replace('\\/','/');soup=BeautifulSoup(text,'html.parser');links=[]
              for tag in soup.find_all(['a','script','link','img','iframe','source']):
                for attr in ['href','src','data-src','data-url','data-file','data-download']:
                  v=tag.get(attr)
                  if v:links.append(urljoin(r.url,v))
              urls=re.findall(r'https?://[^"\'<>\s]+',text);links+=urls
              snippets=[]
              for n in needles:
                for m in list(re.finditer(re.escape(n),text,re.I))[:100]:snippets.append({'needle':n,'text':re.sub(r'\s+',' ',text[max(0,m.start()-700):m.start()+2600])})
              page_scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')];scripts+=page_scripts
              result['pages'].append({'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':list(dict.fromkeys(links))[:3000],'snippets':snippets[:1000],'scripts':page_scripts})
            except Exception as e:result['pages'].append({'url':u,'error':repr(e)})
          for u in list(dict.fromkeys(scripts))[:100]:
            try:
              r=s.get(u,timeout=60);body=html.unescape(r.text).replace('\\/','/');hits=[]
              for n in needles:
                for m in list(re.finditer(re.escape(n),body,re.I))[:100]:hits.append({'needle':n,'text':re.sub(r'\s+',' ',body[max(0,m.start()-800):m.start()+3000])})
              if hits:result['scripts'].append({'url':u,'status':r.status_code,'bytes':len(r.content),'hits':hits[:800]})
            except Exception as e:result['scripts'].append({'url':u,'error':repr(e)})
          # Conventional public endpoint probes based solely on visible report id.
          rid='800288177894'
          for u in [
            f'https://gmg.9fzt.com/report/download/{rid}',f'https://gmg.9fzt.com/report/download?id={rid}',
            f'https://gmg.9fzt.com/api/report/{rid}',f'https://gmg.9fzt.com/api/report/download/{rid}',
            f'https://gmg.9fzt.com/report/HKSE/00200/{rid}.pdf',f'https://gmg.9fzt.com/files/{rid}.pdf'
          ]:
            try:
              r=s.get(u,timeout=40,allow_redirects=False);result['probes'].append({'url':u,'status':r.status_code,'location':r.headers.get('location'),'type':r.headers.get('content-type'),'bytes':len(r.content),'head':r.content[:100].hex(),'text':r.text[:2000] if 'text' in (r.headers.get('content-type') or '').lower() or 'json' in (r.headers.get('content-type') or '').lower() else ''})
            except Exception as e:result['probes'].append({'url':u,'error':repr(e)})
          Path('out').mkdir(exist_ok=True);Path('out/9fzt_melco_findings.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pages':[(x.get('url'),x.get('status'),x.get('bytes'),x.get('title')) for x in result['pages']],'scripts':len(result['scripts']),'probes':result['probes']},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ninefzt-melco-findings
          path: out/9fzt_melco_findings.json
          retention-days: 3
