name: Inspect Hangyan native PDF controller
on:
  push:
    branches: [tmp-hangyan-js-controller-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print native PDF controller snippets
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests
          url='https://cdn.hangyan.co/assets/application-ec845e69.js'
          text=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60).text
          print('STATUS_SIZE',len(text))
          low=text.lower()
          for key in ['native-pdf','cachekey','cache-key','webviewer','pdftron','download()','cloud-download','presigned','qingstor','s3']:
              pos=0; n=0
              while n<20:
                  i=low.find(key.lower(),pos)
                  if i<0: break
                  print('\nKEY',key,'POS',i)
                  print(text[max(0,i-1400):min(len(text),i+4200)])
                  pos=i+len(key); n+=1
          PY
