name: Build final Yixin Group annual reports package 20260926

on:
  push:
    paths:
      - '.github/workflows/yixin-02858-annual-reports-final-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests pypdf

      - name: Download official HKEX PDFs and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='易鑫集团_02858_2020-2025年报及最新阶段性财务报告'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREVIEW=ROOT/'首页预览'; PREVIEW.mkdir(exist_ok=True)

          docs=[
            {'order':1,'kind':'annual_report','display':'2020年年度报告','period':'2020年度','release':'2021-04-01','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0401/2021040103775_c.pdf'},
            {'order':2,'kind':'annual_report','display':'2021年年度报告','period':'2021年度','release':'2022-04-14','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2022/0414/2022041400902_c.pdf'},
            {'order':3,'kind':'annual_report','display':'2022年年度报告','period':'2022年度','release':'2023-03-13','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2023/0313/2023031300322_c.pdf'},
            {'order':4,'kind':'annual_report','display':'2023年年度报告','period':'2023年度','release':'2024-03-08','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0308/2024030800776_c.pdf'},
            {'order':5,'kind':'annual_report','display':'2024年年度报告','period':'2024年度','release':'2025-03-13','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0313/2025031300380_c.pdf'},
            {'order':6,'kind':'annual_report','display':'2025年年度报告','period':'2025年度','release':'2026-03-25','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0325/2026032502020_c.pdf'},
            {'order':7,'kind':'interim_report','display':'2026年中期报告','period':'截至2026年6月30日止六个月','release':'2026-09-01','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0901/2026090102626_c.pdf'},
            {'order':8,'kind':'quarterly_business_update','display':'2026年第一季度未经审核业务更新','period':'2026年第一季度','release':'2026-05-12','url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0512/2026051201235_c.pdf'},
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=166831',
          })

          def fetch(url):
            last=None
            for attempt in range(7):
              try:
                r=s.get(url,timeout=(30,300),allow_redirects=True)
                last={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content)}
                if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>20000:
                  return r.content,last
              except Exception as e:
                last={'error':repr(e)}
              time.sleep(2+attempt)
            raise RuntimeError(f'Download failed: {url} :: {last}')

          manifest=[]
          for d in docs:
            data,dl=fetch(d['url'])
            filename=f"{d['order']:02d}_{d['display']}_港交所官方原件.pdf"
            path=ROOT/filename; path.write_bytes(data)
            reader=PdfReader(str(path),strict=False)
            pages=len(reader.pages)
            if pages<1: raise RuntimeError(f'No pages: {filename}')
            text=''
            for p in reader.pages[:min(15,pages)]:
              try: text+='\n'+(p.extract_text() or '')
              except: pass
            identity_ok=any(k.lower() in text.lower() for k in ('易鑫','yixin','02858','2858'))
            subprocess.run(['qpdf','--check',str(path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREVIEW/path.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(path),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<5000: raise RuntimeError(f'Preview failed: {filename}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**d,'file':filename,'pages':pages,'bytes':len(data),'sha256':sha,'download':dl,'identity_text_check':identity_ok,'preview_file':str(Path('首页预览')/preview.name),'validation':['PDF header','page count','qpdf structure','first-page render','company/ticker text sample when extractable']})

          lines=[
            '易鑫集团有限公司（02858.HK）2020—2025年年度报告及最新阶段性财务报告',
            '整理日期：2026-09-26',
            '',
            '本包全部文件均为香港交易所披露易官方PDF原件。',
            '收录2020—2025年六份年度报告，并收录最新完整阶段性财务报告——2026年中期报告。',
            '由于香港上市公司通常不按A股口径编制正式一季报和三季报，另附2026年第一季度未经审核业务更新，以对应“最新季报”的季度口径。',
            '',
            '文件清单：',
          ]
          for i,m in enumerate(manifest,1):
            lines += [
              f'{i}. {m["display"]}',
              f'   报告期：{m["period"]}；披露日期：{m["release"]}；页数：{m["pages"]}页',
              f'   港交所官方来源：{m["url"]}',
              f'   SHA-256：{m["sha256"]}',
              '',
            ]
          lines += ['校验项目：PDF文件头、页数、qpdf结构、首页渲染、公司/股票代码文本抽样、ZIP CRC和SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["file"]}\n' for m in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failure: '+bad)
            pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if len(pdfs)!=8: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha=hashlib.sha256(zpath.read_bytes()).hexdigest()
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yixin-02858-annual-reports-final
          path: 易鑫集团_02858_2020-2025年报及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
