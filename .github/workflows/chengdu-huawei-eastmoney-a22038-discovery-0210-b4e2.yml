name: Discover Chengdu Huawei Eastmoney pre-IPO reports 0210 b4e2

on:
  push:
    branches:
      - tmp/chengdu-huawei-eastmoney-a22038-discovery-20261016-0210-b4e2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query report API variants
        shell: bash
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          code_variants=['A22038','688709','SH688709','sh688709','成都华微','']
          extra_variants=[
              {},
              {'keyword':'成都华微'},
              {'title':'成都华微'},
              {'search':'成都华微'},
              {'stockName':'成都华微'},
              {'name':'成都华微'},
          ]
          for code in code_variants:
              for extra in extra_variants:
                  params={
                    'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                    'beginTime':'2022-01-01','endTime':'2030-12-31','pageNo':'1','fields':'',
                    'qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
                  }
                  params.update(extra)
                  try:
                      r=s.get(api,params=params,timeout=(20,120))
                      d=r.json(); batch=d.get('data') or []
                      if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
                      out=[]
                      for x in batch if isinstance(batch,list) else []:
                          title=str(x.get('title') or '')
                          stock=str(x.get('stockName') or '')+' '+str(x.get('stockCode') or '')
                          if '成都华微' in title or '成都华微' in stock or 'A22038' in stock or code in ['A22038','688709','SH688709','sh688709']:
                              out.append({k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','attachPages','stockCode','stockName','researcher']})
                      if out:
                          print('\nQUERY',json.dumps({'code':code,'extra':extra,'hits':d.get('hits')},ensure_ascii=False))
                          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))
                  except Exception as e:
                      print('ERROR',code,extra,repr(e))
                  time.sleep(.15)
          PY
