name: Package Lixing 300421 financial reports 20261020

on:
  push:
    branches:
      - 'tmp/lixing-300421-financial-reports-20261020'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '300421'
          COMPANY_SHORT = '力星股份'
          COMPANY_FULL = '江苏力星通用钢球股份有限公司'
          AS_OF = '2026-10-20'
          REQUIRED_YEARS = list(range(2020, 2026))

          root = Path(f'{COMPANY_SHORT}_{STOCK_CODE}_2020-2025年报及最新季报_截至20261020')
          annual_dir = root / '01_年度报告'
          quarter_dir = root / '02_最新季度报告'
          preview_dir = root / '首页预览'
          for d in (annual_dir, quarter_dir, preview_dir):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept': 'application/json,text/plain,*/*',
          })

          endpoint = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          rows_all = []
          for page in range(1, 31):
              params = {
                  'sr': '-1',
                  'page_size': '100',
                  'page_index': str(page),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': STOCK_CODE,
                  'f_node': '0',
                  's_node': '0',
              }
              response = session.get(endpoint, params=params, timeout=45)
              print('ANN_PAGE', page, 'STATUS', response.status_code, 'LEN', len(response.content))
              response.raise_for_status()
              obj = response.json()
              rows = (obj.get('data') or {}).get('list') or []
              print('ANN_ROWS', len(rows))
              if not rows:
                  break
              rows_all.extend(rows)
              if len(rows) < 100:
                  break
              time.sleep(0.2)

          print('ANN_TOTAL', len(rows_all))
          if not rows_all:
              raise RuntimeError('Announcement API returned no records')

          def notice_date(rec):
              raw = rec.get('notice_date') or rec.get('display_time') or rec.get('eiTime') or ''
              return raw[:10]

          def col_names(rec):
              return [str(c.get('column_name') or '') for c in (rec.get('columns') or []) if isinstance(c, dict)]

          def clean_title(rec):
              return str(rec.get('title') or '').strip()

          annual_candidates = {year: [] for year in REQUIRED_YEARS}
          quarter_candidates = []

          for rec in rows_all:
              title = clean_title(rec)
              cols = col_names(rec)
              art_code = rec.get('art_code')
              if not art_code or not title:
                  continue

              if '年度报告全文' in cols and '摘要' not in title and '更正公告' not in title and '取消' not in title and '关于' not in title:
                  match = re.search(r'(20\d{2})年年度报告', title)
                  if match:
                      year = int(match.group(1))
                      if year in annual_candidates:
                          annual_candidates[year].append(rec)

              q = None
              match_q1 = re.search(r'(20\d{2})年(?:第)?一季度报告', title)
              match_q3 = re.search(r'(20\d{2})年(?:第)?三季度报告', title)
              if match_q1:
                  q = (int(match_q1.group(1)), 1)
              elif match_q3:
                  q = (int(match_q3.group(1)), 3)
              full_quarter_col = any(x in ('一季度报告全文', '三季度报告全文') for x in cols)
              if q and full_quarter_col and '提示性公告' not in title and '摘要' not in title and '关于' not in title:
                  quarter_candidates.append((q, rec))

          print('ANNUAL_COUNTS', {year: len(items) for year, items in annual_candidates.items()})
          print('QUARTER_CANDIDATES', [(q, clean_title(rec), notice_date(rec)) for q, rec in quarter_candidates[:30]])

          selected_annual = []
          for year in REQUIRED_YEARS:
              candidates = annual_candidates.get(year) or []
              if not candidates:
                  raise RuntimeError(f'Missing complete annual report for {year}')
              selected = max(candidates, key=lambda x: (notice_date(x), clean_title(x)))
              selected_annual.append((year, selected))

          if not quarter_candidates:
              raise RuntimeError('No independent quarterly report found')
          latest_quarter_key, selected_quarter = max(
              quarter_candidates,
              key=lambda x: (x[0][0], x[0][1], notice_date(x[1]))
          )

          docs = []
          for year, rec in selected_annual:
              title = clean_title(rec)
              suffix = ''
              for marker in ('更正后', '修订后', '更新后', '补充后'):
                  if marker in title:
                      suffix = '_' + marker
                      break
              docs.append({
                  'kind': 'annual',
                  'period': str(year),
                  'art_code': rec['art_code'],
                  'title': title,
                  'notice_date': notice_date(rec),
                  'filename': f'{year}_{COMPANY_SHORT}_{year}年年度报告{suffix}.pdf',
                  'folder': annual_dir,
                  'columns': col_names(rec),
              })

          q_year, q_num = latest_quarter_key
          q_label = '第一季度' if q_num == 1 else '第三季度'
          docs.append({
              'kind': 'quarter',
              'period': f'{q_year}Q{q_num}',
              'art_code': selected_quarter['art_code'],
              'title': clean_title(selected_quarter),
              'notice_date': notice_date(selected_quarter),
              'filename': f'{q_year}Q{q_num}_{COMPANY_SHORT}_{q_year}年{q_label}报告.pdf',
              'folder': quarter_dir,
              'columns': col_names(selected_quarter),
          })

          print('SELECTED_DOCS')
          for item in docs:
              print(json.dumps({k: v for k, v in item.items() if k != 'folder'}, ensure_ascii=False, sort_keys=True))

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def download_pdf(item, target):
              code = item['art_code']
              urls = [
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
              ]
              traces = []
              for url in urls:
                  for attempt in range(1, 4):
                      try:
                          response = session.get(url, timeout=120, allow_redirects=True)
                          data = response.content
                          traces.append({
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(data),
                              'head': repr(data[:20]),
                          })
                          if response.status_code == 200 and data.startswith(b'%PDF') and len(data) > 50000:
                              target.write_bytes(data)
                              return url, traces
                      except Exception as exc:
                          traces.append({'url': url, 'error': repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError(f'Unable to download valid PDF for {code}: {traces}')

          manifest = []
          for item in docs:
              target = item['folder'] / item['filename']
              source_url, traces = download_pdf(item, target)

              check = subprocess.run(
                  ['qpdf', '--check', str(target)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  errors='replace',
              )
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {target}: {check.returncode}\n{check.stdout}')

              reader = PdfReader(str(target))
              pages = len(reader.pages)
              min_pages = 20 if item['kind'] == 'annual' else 3
              if pages < min_pages:
                  raise RuntimeError(f'Unexpectedly short {item["kind"]} PDF {target}: {pages} pages')

              text_path = target.with_suffix('.txt')
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', str(min(15, pages)), str(target), str(text_path)],
                  check=True,
              )
              text = text_path.read_text(encoding='utf-8', errors='replace')
              text_path.unlink(missing_ok=True)
              compact = re.sub(r'\s+', '', text)

              identity_hits = [x for x in (COMPANY_SHORT, COMPANY_FULL, STOCK_CODE) if x in compact]
              if not identity_hits:
                  raise RuntimeError(f'Company identity not found in first pages of {target}')

              if item['kind'] == 'annual':
                  marker = f'{item["period"]}年年度报告'
                  if marker not in compact:
                      raise RuntimeError(f'Annual report marker {marker} not found in first pages of {target}')
              else:
                  expected_marker = f'{q_year}年{q_label}报告'
                  alt_marker = f'{q_year}年第{q_label}报告'
                  if expected_marker not in compact and alt_marker not in compact:
                      raise RuntimeError(f'Quarter marker not found in first pages of {target}')

              preview_stem = preview_dir / target.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(target), str(preview_stem)],
                  check=True,
              )
              preview = preview_stem.with_suffix('.png')
              if not preview.exists() or preview.stat().st_size < 10000:
                  raise RuntimeError(f'First-page render failed for {target}')

              entry = {k: v for k, v in item.items() if k != 'folder'}
              entry.update({
                  'source_page': f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{item["art_code"]}.html',
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': target.stat().st_size,
                  'sha256': sha256(target),
                  'identity_hits': identity_hits,
                  'qpdf_status': check.returncode,
                  'qpdf_output': check.stdout.strip()[:2000],
                  'download_attempts': traces,
              })
              manifest.append(entry)
              print('VERIFIED', json.dumps(entry, ensure_ascii=False, sort_keys=True))

          annual_periods = [entry['period'] for entry in manifest if entry['kind'] == 'annual']
          if annual_periods != [str(year) for year in REQUIRED_YEARS]:
              raise RuntimeError(f'Annual coverage mismatch: {annual_periods}')
          if len([entry for entry in manifest if entry['kind'] == 'quarter']) != 1:
              raise RuntimeError('Quarter count mismatch')

          readme = [
              f'# {COMPANY_SHORT}（{STOCK_CODE}）2020—2025年年度报告及最新季度报告',
              '',
              f'整理日期：{AS_OF}',
              '',
              '## 收录范围',
              '',
              '- 2020—2025年完整年度报告，共6份。',
              f'- 截至{AS_OF}可检索到的最新独立季度报告：{q_year}年第{q_num}季度报告，共1份。',
              '- 未将年度报告摘要、半年报、业绩预告或提示性公告作为正式年报/季报收录。',
              '',
              '## 文件清单',
              '',
          ]
          for index, entry in enumerate(manifest, 1):
              readme += [
                  f'{index}. {entry["title"]}',
                  f'   - 文件：{entry["filename"]}',
                  f'   - 类型：{entry["kind"]}',
                  f'   - 报告期：{entry["period"]}',
                  f'   - 公告日期：{entry["notice_date"]}',
                  f'   - 页数：{entry["pages"]}',
                  f'   - SHA-256：`{entry["sha256"]}`',
                  f'   - 公告页：{entry["source_page"]}',
                  '',
              ]
          readme += [
              '## 校验说明',
              '',
              '- 每份PDF均检查文件头、PDF结构、实际页数、公司身份、报告期及首页渲染。',
              '- 压缩包创建后执行CRC完整性测试。',
          ]

          (root / 'README.md').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              '\n'.join(f'{entry["sha256"]}  {entry["filename"]}' for entry in manifest) + '\n',
              encoding='utf-8',
          )

          cn_zip = Path('力星股份_300421_2020-2025年报及最新季报_截至20261020.zip')
          en_zip = Path('lixing_300421_2020_2025_annual_latest_quarter_20261020.zip')
          for zip_path in (cn_zip, en_zip):
              with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
                  for path in sorted(root.rglob('*')):
                      if path.is_file():
                          archive.write(path, path.as_posix())
              with zipfile.ZipFile(zip_path) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')
                  pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdf_names) != 7:
                      raise RuntimeError(f'Unexpected PDF count in ZIP: {len(pdf_names)}')
              print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', sha256(zip_path))

          print('COUNTS', json.dumps({
              'annual': 6,
              'quarter': 1,
              'pdfs': 7,
              'pages': sum(entry['pages'] for entry in manifest),
              'latest_quarter': f'{q_year}Q{q_num}',
          }, ensure_ascii=False))
          PY

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: lixing-300421-financial-reports-20261020
          path: |
            力星股份_300421_2020-2025年报及最新季报_截至20261020.zip
            lixing_300421_2020_2025_annual_latest_quarter_20261020.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
