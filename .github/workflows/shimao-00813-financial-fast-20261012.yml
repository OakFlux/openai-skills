name: Fetch Shimao financial page fast 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-financial-fast-20261012.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch one financial page
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          requests.packages.urllib3.disable_warnings()
          url='https://shimaogroup.hk/en/Financial/Index/'
          s=requests.Session(); s.trust_env=False
          r=s.get(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'},verify=False,timeout=(10,20),allow_redirects=True)
          print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,flush=True)
          print(r.text[:15000],flush=True)
          soup=BeautifulSoup(r.text,'html.parser')
          for tag in soup.find_all('a'):
              href=tag.get('href')
              if href:
                  full=urljoin(r.url,href)
                  text=tag.get_text(' ',strip=True)
                  if any(k in (full+' '+text).lower() for k in ['report','annual','interim','downloadfile','financial']):
                      print('A',text,'=>',full,flush=True)
          for m in sorted(set(re.findall(r'/Upload/DownloadFile/[A-Za-z0-9_-]+',r.text,re.I))):
              print('DOWNLOAD',m,flush=True)
          PY
