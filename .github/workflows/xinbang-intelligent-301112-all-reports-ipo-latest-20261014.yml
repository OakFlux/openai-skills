name: Build Xinbang Intelligent 301112 all reports IPO latest 20261014

on:
  push:
    paths:
      - '.github/workflows/xinbang-intelligent-301112-all-reports-ipo-latest-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = '301112'
          COMPANY = '信邦智能'
          TODAY = '2026-10-14'
          PACKAGE = '信邦智能_301112_全部年报_招股说明书_2026最新半年度报告及季度报告_公告原件'
          OUT = Path(PACKAGE)
          ART = Path('artifact_out')
          VERIFY = Path('verification_renders')
          for directory in (OUT, ART, VERIFY):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/plain,application/pdf,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def get_json(url: str, params: dict[str, str] | None = None) -> dict[str, Any]:
              last: Exception | None = None
              for attempt in range(1, 6):
                  try:
                      response = session.get(url, params=params, timeout=(25, 180), allow_redirects=True)
                      print('GET_JSON', attempt, response.status_code, len(response.content), response.url, flush=True)
                      response.raise_for_status()
                      return response.json()
                  except Exception as exc:
                      last = exc
                      print('GET_JSON_ERR', attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'JSON request failed: {url}: {last!r}')

          index_url = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          announcements: list[dict[str, Any]] = []
          seen_art: set[str] = set()
          total_pages = 30
          for page in range(1, 31):
              payload = get_json(index_url, {
                  'sr': '-1',
                  'page_size': '100',
                  'page_index': str(page),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': CODE,
              })
              data = payload.get('data') or {}
              batch = data.get('list') or data.get('items') or []
              if page == 1:
                  hits = int(data.get('total_hits') or data.get('total_count') or len(batch))
                  total_pages = min(30, max(1, (hits + 99) // 100))
                  print('TOTAL_HITS', hits, 'TOTAL_PAGES_LIMIT', total_pages, flush=True)
              print('PAGE', page, 'ITEMS', len(batch), flush=True)
              if not batch:
                  break
              for item in batch:
                  art_code = str(item.get('art_code') or '')
                  codes = item.get('codes') or []
                  code_ok = any(str(code.get('stock_code') or '') == CODE for code in codes if isinstance(code, dict))
                  if art_code and code_ok and art_code not in seen_art:
                      seen_art.add(art_code)
                      announcements.append(item)
              if page >= total_pages:
                  break

          if not announcements:
              raise RuntimeError('No announcement metadata found for 信邦智能 301112')
          print('ANNOUNCEMENT_COUNT', len(announcements), flush=True)

          def title_of(item: dict[str, Any]) -> str:
              return re.sub(r'\s+', ' ', str(item.get('title') or item.get('title_ch') or '')).strip()

          def notice_date(item: dict[str, Any]) -> str:
              return str(item.get('notice_date') or item.get('display_time') or '')[:10]

          edition_suffix = r'(?:\s*[（(][^）)]*(?:修订|更正|更新)[^）)]*[）)])?\s*$'
          annual_candidates: dict[int, list[tuple[tuple[int, str], dict[str, Any]]]] = {}
          half_candidates: list[tuple[int, str, dict[str, Any]]] = []
          quarter_candidates: list[tuple[int, str, str, dict[str, Any]]] = []
          prospectus_candidates: list[tuple[tuple[int, str], dict[str, Any]]] = []

          for item in announcements:
              title = title_of(item)
              if not title or '摘要' in title or '英文' in title or '审计报告' in title:
                  continue

              annual = re.search(r'(20\d{2})年年度报告' + edition_suffix, title)
              half = re.search(r'(20\d{2})年半年度报告' + edition_suffix, title)
              q1 = re.search(r'(20\d{2})年(?:第一|一)季度报告' + edition_suffix, title)
              q3 = re.search(r'(20\d{2})年(?:第三|三)季度报告' + edition_suffix, title)

              if annual:
                  year = int(annual.group(1))
                  if 2020 <= year <= 2025:
                      revised = int(any(term in title for term in ['修订版', '更新后', '更正后', '修订后', '更正版']))
                      annual_candidates.setdefault(year, []).append(((revised, notice_date(item)), item))
              if half:
                  half_candidates.append((int(half.group(1)), notice_date(item), item))
              if q1:
                  quarter_candidates.append((int(q1.group(1)) * 10 + 1, notice_date(item), '第一季度报告', item))
              if q3:
                  quarter_candidates.append((int(q3.group(1)) * 10 + 3, notice_date(item), '第三季度报告', item))

              if '招股说明书' in title:
                  excluded = ['摘要', '意向书', '申报稿', '预披露', '反馈意见', '问询', '回复', '更新稿', '上会稿', '封卷稿', '注册稿']
                  if not any(term in title for term in excluded):
                      formal = int('首次公开发行股票' in title and re.search(r'招股说明书\s*$', title) is not None)
                      prospectus_candidates.append(((formal, notice_date(item)), item))

          annual_by_year: dict[int, dict[str, Any]] = {}
          for year, candidates in annual_candidates.items():
              candidates.sort(key=lambda entry: entry[0], reverse=True)
              annual_by_year[year] = candidates[0][1]

          annual_years = sorted(annual_by_year)
          if not annual_years:
              relevant = [title_of(item) for item in announcements if '年度报告' in title_of(item)][:120]
              raise RuntimeError(f'No complete annual reports found: {relevant}')
          if annual_years[-1] != 2025:
              raise RuntimeError(f'Latest annual report is not 2025: found={annual_years}')
          if not prospectus_candidates:
              relevant = [title_of(item) for item in announcements if '招股' in title_of(item)][:120]
              raise RuntimeError(f'Formal prospectus not found: {relevant}')
          if not half_candidates or not quarter_candidates:
              raise RuntimeError('Latest half-year or quarterly report missing')

          prospectus_candidates.sort(key=lambda entry: entry[0], reverse=True)
          prospectus_item = prospectus_candidates[0][1]
          half_candidates.sort(key=lambda entry: (entry[0], entry[1]), reverse=True)
          quarter_candidates.sort(key=lambda entry: (entry[0], entry[1]), reverse=True)
          half_year, _, half_item = half_candidates[0]
          quarter_period, _, quarter_kind, quarter_item = quarter_candidates[0]
          quarter_year = quarter_period // 10
          if half_year < 2026 or quarter_year < 2026:
              raise RuntimeError(f'Latest reports unexpectedly old: half={half_year}, quarter={quarter_year} {quarter_kind}')

          content_url = 'https://np-cnotice-stock.eastmoney.com/api/content/ann'

          def resolve_attachment(item: dict[str, Any]) -> tuple[str, dict[str, Any]]:
              art_code = str(item.get('art_code') or '')
              detail = get_json(content_url, {
                  'art_code': art_code,
                  'client_source': 'web',
                  'page_index': '1',
              })
              data = detail.get('data') or {}
              url = str(data.get('attach_url_web') or data.get('attach_url') or '')
              if not url:
                  attach_list = data.get('attach_list') or []
                  if attach_list:
                      url = str(attach_list[0].get('attach_url') or '')
              if not url:
                  url = f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf'
              return url, data

          selected: list[dict[str, Any]] = []
          counter = 1

          prospectus_url, prospectus_detail = resolve_attachment(prospectus_item)
          selected.append({
              'filename': f'{counter:02d}_信邦智能_301112_首次公开发行股票招股说明书.pdf',
              'category': '首次公开发行股票招股说明书',
              'report_year': int(notice_date(prospectus_item)[:4]),
              'title': title_of(prospectus_item),
              'disclosure_date': notice_date(prospectus_item),
              'art_code': prospectus_item['art_code'],
              'source_url': prospectus_url,
              'detail': prospectus_detail,
              'announcement_metadata': prospectus_item,
              'min_pages': 250,
          })
          counter += 1

          for year in annual_years:
              item = annual_by_year[year]
              attach_url, detail = resolve_attachment(item)
              selected.append({
                  'filename': f'{counter:02d}_信邦智能_301112_{year}年年度报告.pdf',
                  'category': '年度报告',
                  'report_year': year,
                  'title': title_of(item),
                  'disclosure_date': notice_date(item),
                  'art_code': item['art_code'],
                  'source_url': attach_url,
                  'detail': detail,
                  'announcement_metadata': item,
                  'min_pages': 80,
              })
              counter += 1

          attach_url, detail = resolve_attachment(half_item)
          selected.append({
              'filename': f'{counter:02d}_信邦智能_301112_{half_year}年半年度报告_最新中期报告.pdf',
              'category': '最新半年度报告',
              'report_year': half_year,
              'title': title_of(half_item),
              'disclosure_date': notice_date(half_item),
              'art_code': half_item['art_code'],
              'source_url': attach_url,
              'detail': detail,
              'announcement_metadata': half_item,
              'min_pages': 25,
          })
          counter += 1

          attach_url, detail = resolve_attachment(quarter_item)
          selected.append({
              'filename': f'{counter:02d}_信邦智能_301112_{quarter_year}年{quarter_kind}_最新季报.pdf',
              'category': f'最新{quarter_kind}',
              'report_year': quarter_year,
              'title': title_of(quarter_item),
              'disclosure_date': notice_date(quarter_item),
              'art_code': quarter_item['art_code'],
              'source_url': attach_url,
              'detail': detail,
              'announcement_metadata': quarter_item,
              'min_pages': 5,
          })

          print('SELECTED', json.dumps([{k: v for k, v in item.items() if k not in {'detail', 'announcement_metadata'}} for item in selected], ensure_ascii=False, indent=2), flush=True)

          def download_pdf(url: str, destination: Path) -> str:
              last: Exception | None = None
              for attempt in range(1, 6):
                  temporary = destination.with_suffix('.pdf.part')
                  try:
                      with session.get(url, timeout=(30, 360), allow_redirects=True, stream=True, headers={
                          'User-Agent': session.headers['User-Agent'],
                          'Referer': 'https://data.eastmoney.com/',
                          'Accept': 'application/pdf,*/*',
                      }) as response:
                          print('DOWNLOAD', destination.name, attempt, response.status_code, response.url, flush=True)
                          response.raise_for_status()
                          with temporary.open('wb') as handle:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      handle.write(chunk)
                          final_url = response.url
                      raw = temporary.read_bytes()
                      if len(raw) < 50_000 or not raw.startswith(b'%PDF-'):
                          raise RuntimeError(f'Invalid PDF response: {len(raw)} bytes')
                      temporary.replace(destination)
                      return str(final_url)
                  except Exception as exc:
                      last = exc
                      temporary.unlink(missing_ok=True)
                      print('DOWNLOAD_ERR', destination.name, attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'Download failed {destination.name}: {last!r}')

          def extract_sample(reader: PdfReader) -> str:
              count = len(reader.pages)
              indices = list(range(min(45, count)))
              if count > 50:
                  indices.extend(range(max(0, count - 5), count))
              parts: list[str] = []
              for index in dict.fromkeys(indices):
                  try:
                      parts.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              return '\n'.join(parts)

          aliases = [CODE, COMPANY, '信邦智能装备股份有限公司']
          records: list[dict[str, Any]] = []
          source_index: list[dict[str, Any]] = []
          seen_hashes: set[str] = set()

          for document in selected:
              destination = OUT / document['filename']
              final_url = download_pdf(document['source_url'], destination)
              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < document['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {destination.name}: {pages}')
              sample = extract_sample(reader)
              detail_text = str(document['detail'].get('notice_content') or '')
              identity_blob = sample + '\n' + detail_text + '\n' + document['title']
              identity_low = identity_blob.lower()
              if not any(alias.lower() in identity_low for alias in aliases):
                  raise RuntimeError(f'Company identity not verified in {destination.name}')
              if document['category'] == '首次公开发行股票招股说明书':
                  if '招股说明书' not in identity_blob or '首次公开发行' not in identity_blob:
                      raise RuntimeError(f'Prospectus identity not verified in {destination.name}')
              elif str(document['report_year']) not in identity_blob:
                  raise RuntimeError(f'Report year not verified in {destination.name}')
              check = subprocess.run(['qpdf', '--check', str(destination)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed {destination.name}: {check.stderr[-1000:]}')
              raw = destination.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF: {destination.name}')
              seen_hashes.add(digest)
              record = {
                  'filename': document['filename'],
                  'category': document['category'],
                  'report_year': document['report_year'],
                  'title': document['title'],
                  'disclosure_date': document['disclosure_date'],
                  'art_code': document['art_code'],
                  'source': '东方财富公告镜像（上市公司原始披露PDF）',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': digest,
              }
              records.append(record)
              source_index.append({
                  'announcement_metadata': document['announcement_metadata'],
                  'announcement_detail': document['detail'],
              })
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '信邦智能（301112.SZ）全部独立年报、正式招股说明书及最新定期财务报告',
              f'整理日期：{TODAY}',
              '',
              '收录范围：',
              '1. 正式首次公开发行股票招股说明书1份；未使用招股意向书、摘要、申报稿、注册稿、预披露稿或问询回复。',
              f'2. 公告库中可核验的全部完整年度报告为{annual_years[0]}-{annual_years[-1]}年，共{len(annual_years)}份；如存在修订、更新或更正版本，优先保留较新的正式全文。',
              f'3. 最新完整半年度报告：{records[-2]["title"]}。',
              f'4. 严格季度报告口径下的最新文件：{records[-1]["title"]}。',
              '',
              '同时保留半年报与严格季度报告，用于避免“最新季报”在日常口径与监管定期报告口径之间的歧义。',
              'PDF来自东方财富公告镜像，内容为上市公司原始披露文件；未使用摘要、媒体转载、问询回复或拆分页文件。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme += [
                  f'{index}. {record["filename"]}',
                  f'   类别：{record["category"]}；报告年度：{record["report_year"]}；披露日期：{record["disclosure_date"]}',
                  f'   公告标题：{record["title"]}',
                  f'   公告代码：{record["art_code"]}',
                  f'   页数：{record["pages"]}；大小：{record["bytes"] / 1048576:.2f} MB',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查PDF文件头、公司身份、文件类别或报告年度、实际页数、qpdf结构、重复文件及SHA-256；最终ZIP已通过CRC测试。')
          (OUT / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records), encoding='utf-8')
          (OUT / '公告来源记录.json').write_text(json.dumps(source_index, ensure_ascii=False, indent=2), encoding='utf-8')

          render_indices = [0, 1, len(records) - 3, len(records) - 2, len(records) - 1]
          for order, record_index in enumerate(dict.fromkeys(render_indices), 1):
              source = OUT / records[record_index]['filename']
              prefix = VERIFY / f'{order:02d}'
              result = subprocess.run([
                  'pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '110', str(source), str(prefix)
              ], capture_output=True, text=True)
              if result.returncode != 0:
                  raise RuntimeError(f'PDF render failed for {source.name}: {result.stderr[-1000:]}')

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != len(records):
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)} vs {len(records)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xinbang-intelligent-301112-all-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: xinbang-intelligent-301112-verification-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
