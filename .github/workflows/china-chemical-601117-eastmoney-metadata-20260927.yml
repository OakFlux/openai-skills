name: Query China Chemical 601117 broker report metadata 20260927

on:
  push:
    paths:
      - '.github/workflows/china-chemical-601117-eastmoney-metadata-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p china_chemical_metadata
          python - <<'PY'
          import json,re,time
          from pathlib import Path
          import requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/javascript,*/*;q=0.01'})
          api='https://reportapi.eastmoney.com/report/list'
          allr=[]; payloads=[]
          for code in ['601117','SH601117','601117.SH','1.601117']:
            p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2026-09-27','pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
            r=s.get(api,params=p,timeout=(20,90));print('QUERY',code,r.status_code,len(r.content),r.url,flush=True);r.raise_for_status();d=r.json();payloads.append({'code':code,'data':d});recs=d.get('data') or [];allr.extend(recs);time.sleep(.2)
          uniq={}
          for x in allr:
            t=json.dumps(x,ensure_ascii=False)
            if '601117' not in t and '中国化学' not in t:continue
            k=str(x.get('infoCode') or x.get('id') or t);uniq[k]=x
          rows=list(uniq.values());rows.sort(key=lambda x:str(x.get('publishDate') or ''),reverse=True)
          Path('china_chemical_metadata/records.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('china_chemical_metadata/payloads.json').write_text(json.dumps(payloads,ensure_ascii=False,indent=2),encoding='utf-8')
          print('COUNT',len(rows),flush=True)
          for i,x in enumerate(rows,1):
            rec={k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','stockName','stockCode','ratingName','predictThisYearEps','predictNextYearEps','author']}
            print('ROW',i,json.dumps(rec,ensure_ascii=False,separators=(',',':')),flush=True)
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: china-chemical-601117-eastmoney-metadata
          path: china_chemical_metadata
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
