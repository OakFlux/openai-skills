name: Resolve targeted CITIC Telecom broker report links

on:
  push:
    branches:
      - chatgpt-citic-telecom-targeted-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml playwright
      - name: Resolve links with HTTP and headless browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/resolve.py <<'PY'
          from __future__ import annotations
          import html, json, os, re, shutil, subprocess, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          targets=[
            {'name':'deutsche_catching','title':'Deutsche Bank-CITIC Telecom(1883.HK)Catching the Express-150611','url':'https://www.so.com/link?m=ukpYHN4SyYMDzjuEIKe0x3KujRgaTC0bEJq0UmkLn%2BXUa3mMYC0uvxTlfY%2BvFuIXMh5s0dkqQSPqFJJbdLlgriFqWZ9PEg2Q7jVYS8dOC%2BTOVb3DjuTdNdNetWUQ95VPyIX69Q%2BMdV%2BaD%2FjnRdcUZ2M2ROGQQCqQKzCg5q%2Br0OEtfVpw%2FXRzi5uKnoWfp7K6svr%2B2rQ%3D%3D'},
            {'name':'get_nice','title':'致富证券-中信国际电讯集团有限公司-1883.HK-港股推介-150305','url':'https://www.so.com/link?m=uStmmO3Psv4lZIMbhKjFzZKgdS80AnnCaFYvfq67b324p9bRmX0gmelYq6%2FEoyN%2B4mhUaQtkRAwf1Z47YxxxfMjPi6OS2r%2FzPqyIThsiUzeNSwFI3aw09%2FxOdHP4UykNJa7j8iEhsg2BX3N002P1utjTAO8HOFLLMpt6mOO6IVvU6BHpfVA2SpzovGyBYqWRDIyUZSqd1KTHRk%2FwdK9rvkp%2FZaMeNFgdz'},
            {'name':'deutsche_upgrade','title':'德意志银行-中信国际电讯-升至买入评级看3.2元','url':'https://www.so.com/link?m=zWKYOQFoJhYVl2bbkWCBvKI3rOCTjDVRZquJlT6uQM3VLgXfyawHlr6q%2B2fA2Zl%2F%2FcVurebeCjBzh6KeKAb523XyfBkLPjwlGY0gnPaK%2FhbkLrPIx3thIWkGkEDWjGn6sQfkhGWI8%2Fc2OFRzlBiF2oIeNxBcS49QH%2BrEKlD63ZCdG75ALdyJ5Jcv3EEizgCAVyl7RY0JS2k0DYVkvR9PeIz%2BO7x6U%2FkQJ8%2BrxFP4I1c66g7DD%2Fl8IMvbIqUSqG3SV'},
          ]
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Referer':'https://www.so.com/'})
          results=[]

          def extract(name,text,base):
            soup=BeautifulSoup(text,'lxml')
            out={'title':soup.title.get_text(' ',strip=True) if soup.title else None,'links':[],'meta':[],'js_locations':[],'raw_urls':[]}
            for a in soup.find_all(True):
              attrs={k:(' '.join(v) if isinstance(v,list) else str(v)) for k,v in a.attrs.items()}
              blob=' '.join(attrs.values())+' '+a.get_text(' ',strip=True)
              if any(k in blob.lower() for k in ['hibor','microbell','huiboyan','huiyun','report','pdf','download','detail','1883','citic telecom','中信国际电讯']):
                out['links'].append({'tag':a.name,'text':a.get_text(' ',strip=True)[:300],'attrs':attrs})
              if a.name=='meta': out['meta'].append(attrs)
            for pat in [r'(?:window\.)?location(?:\.href)?\s*=\s*["\']([^"\']+)',r'location\.replace\(["\']([^"\']+)',r'location\.assign\(["\']([^"\']+)']:
              for m in re.finditer(pat,text,re.I): out['js_locations'].append(urllib.parse.urljoin(base,html.unescape(m.group(1))))
            for m in re.finditer(r'https?://[^\s"\'<>\\]+',text):
              u=html.unescape(m.group(0)).rstrip(');,]')
              if any(k in u.lower() for k in ['hibor','microbell','huiboyan','huiyun','pdf','report','download']): out['raw_urls'].append(u)
            out['raw_urls']=list(dict.fromkeys(out['raw_urls']))
            return out

          for t in targets:
            rec={'name':t['name'],'title':t['title'],'source_url':t['url']}
            try:
              r=s.get(t['url'],timeout=(15,90),allow_redirects=True)
              rec['http']={'status':r.status_code,'final_url':r.url,'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in r.history],'headers':dict(r.headers),'bytes':len(r.content),'parsed':extract(t['name'],r.text,r.url)}
              Path(f'out/{t["name"]}_http.html').write_text(r.text,encoding='utf-8',errors='replace')
              print('\nHTTP',t['name'],json.dumps({k:rec['http'].get(k) for k in ['status','final_url','history','bytes']},ensure_ascii=False),flush=True)
              print('HTTP_PARSED',json.dumps(rec['http']['parsed'],ensure_ascii=False)[:20000],flush=True)
            except Exception as e:
              rec['http_error']=repr(e); print('HTTP_FAIL',t['name'],repr(e),flush=True)
            results.append(rec)

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          print('CHROME',chrome,flush=True)
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage']) if chrome else p.chromium.launch(headless=True)
            context=browser.new_context(user_agent=UA,locale='zh-CN',ignore_https_errors=True)
            for rec,t in zip(results,targets):
              page=context.new_page()
              console=[]; reqs=[]; resps=[]
              page.on('console',lambda msg, arr=console: arr.append({'type':msg.type,'text':msg.text[:1000]}))
              page.on('request',lambda req, arr=reqs: arr.append(req.url) if any(k in req.url.lower() for k in ['hibor','microbell','huiboyan','huiyun','pdf','report','download','1883']) else None)
              page.on('response',lambda resp, arr=resps: arr.append({'status':resp.status,'url':resp.url}) if any(k in resp.url.lower() for k in ['hibor','microbell','huiboyan','huiyun','pdf','report','download','1883']) else None)
              try:
                page.goto(t['url'],wait_until='domcontentloaded',timeout=90000,referer='https://www.so.com/s?q=%221883.HK%22+%E7%A0%94%E7%A9%B6%E6%8A%A5%E5%91%8A')
                page.wait_for_timeout(8000)
                body=page.content()
                Path(f'out/{t["name"]}_browser.html').write_text(body,encoding='utf-8',errors='replace')
                rec['browser']={'final_url':page.url,'title':page.title(),'bytes':len(body.encode()),'parsed':extract(t['name'],body,page.url),'requests':list(dict.fromkeys(reqs))[:500],'responses':resps[-500:],'console':console[-100:]}
                print('\nBROWSER',t['name'],json.dumps({k:rec['browser'].get(k) for k in ['final_url','title','bytes']},ensure_ascii=False),flush=True)
                print('BROWSER_PARSED',json.dumps(rec['browser']['parsed'],ensure_ascii=False)[:30000],flush=True)
                print('REQUESTS',json.dumps(rec['browser']['requests'],ensure_ascii=False),flush=True)
              except Exception as e:
                rec['browser_error']=repr(e); print('BROWSER_FAIL',t['name'],repr(e),flush=True)
              finally:
                page.close()
            browser.close()

          # Inspect any final report pages more fully and probe obvious file links.
          candidates=[]
          for rec in results:
            for source in ['http','browser']:
              obj=rec.get(source) or {}
              u=obj.get('final_url')
              if u and not u.startswith('https://www.so.com') and u not in candidates: candidates.append(u)
              parsed=obj.get('parsed') or {}
              for x in parsed.get('raw_urls',[]):
                if x not in candidates: candidates.append(x)
              for x in parsed.get('js_locations',[]):
                if x not in candidates: candidates.append(x)
              for x in parsed.get('links',[]):
                attrs=x.get('attrs') or {}
                for k,v in attrs.items():
                  if k in ('href','src','data-url','data-href','data-download','onclick'):
                    for m in re.findall(r'https?://[^\s"\'<>]+|/[^\s"\'<>]+',v):
                      au=urllib.parse.urljoin(u or 'https://www.so.com/',html.unescape(m))
                      if au not in candidates: candidates.append(au)
          probed=[]
          for u in candidates[:500]:
            if not u.startswith('http'): continue
            if any(h in urllib.parse.urlparse(u).netloc.lower() for h in ['so.com','360.cn','qhimg.com','qhres.com']): continue
            try:
              rr=s.get(u,timeout=(12,90),allow_redirects=True)
              head=rr.content[:4096]
              obj={'url':u,'status':rr.status_code,'final_url':rr.url,'ctype':rr.headers.get('content-type'),'bytes':len(rr.content),'is_pdf':b'%PDF' in head}
              probed.append(obj); print('PROBE',json.dumps(obj,ensure_ascii=False),flush=True)
              if obj['is_pdf'] and len(rr.content)>20000:
                Path('out',f'candidate_{len(probed):03d}.pdf').write_bytes(rr.content)
              elif 'html' in (obj['ctype'] or '').lower() and len(rr.content)<5_000_000:
                Path('out',f'candidate_{len(probed):03d}.html').write_bytes(rr.content)
            except Exception as e: print('PROBE_FAIL',u,repr(e),flush=True)
          Path('out/results.json').write_text(json.dumps({'targets':results,'probed':probed},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/resolve.py
      - uses: actions/upload-artifact@v4
        with:
          name: citic-telecom-targeted-resolve
          path: out/
          retention-days: 3
          if-no-files-found: error
