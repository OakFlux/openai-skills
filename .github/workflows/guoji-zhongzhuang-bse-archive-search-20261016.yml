name: Search BSE disclosure archive for historical Guoji Zhongzhuang reports 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-bse-archive-search-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Query BSE and NEEQ compatible archives
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); ua='Mozilla/5.0'; s.headers.update({'User-Agent':ua})
          endpoints=[
            'https://www.bse.cn/disclosureInfoController/infoResult.do',
            'https://www.bse.cn/disclosureInfoController/zoneInfoResult.do',
            'https://www.neeq.com.cn/disclosureInfoController/infoResult.do',
          ]
          for warm in ['https://www.bse.cn/disclosure/announcement.html','https://www.bse.cn/','https://www.neeq.com.cn/']:
            try:
              r=s.get(warm,timeout=30); print('WARM',warm,r.status_code,r.url,len(r.content),s.cookies.get_dict())
            except Exception as e: print('WARMERR',warm,repr(e))
          keywords=['400062','二重5','国重装5','二重集团（德阳）重型装备股份有限公司','国机重型装备集团股份有限公司','二重重装2015年年度报告','2018年年度报告']
          for ep in endpoints:
            for dtype in ['5','9','9530']:
              for kw in keywords:
                forms=[
                  {'flag':'1','disclosureType':dtype,'page':'0','companyCd':'','isNewThree':'1','startTime':'2015-01-01','endTime':'2020-06-30','keyword':kw,'sortfield':'xxssdq','sorttype':'asc'},
                  {'flag':'1','disclosureType':dtype,'page':'1','companyCd':'','isNewThree':'0','startTime':'2015-01-01','endTime':'2020-06-30','keyword':kw,'sortfield':'xxssdq','sorttype':'asc'},
                ]
                for form in forms:
                  try:
                    r=s.post(ep,data=form,timeout=40,headers={'User-Agent':ua,'Referer':ep.rsplit('/',1)[0]+'/','X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'})
                    raw=r.text.strip(); clean=raw
                    if clean.startswith('null(') and clean.endswith(')'): clean=clean[5:-1]
                    elif '(' in clean and clean.endswith(')') and not clean.startswith(('[','{')): clean=clean[clean.find('(')+1:-1]
                    else: clean=clean.rstrip(';')
                    try: obj=json.loads(clean)
                    except Exception:
                      print('BAD',ep,dtype,kw,form['page'],r.status_code,len(raw),repr(raw[:200])); continue
                    blocks=obj if isinstance(obj,list) else [obj]
                    rows=[]
                    for b in blocks:
                      if isinstance(b,dict):
                        li=b.get('listInfo') or b.get('data') or {}
                        if isinstance(li,dict): rows += li.get('content') or li.get('list') or []
                    if rows:
                      print('\nFOUND',ep,dtype,repr(kw),'PAGE',form['page'],'ROWS',len(rows))
                      for rec in rows: print('ROW',json.dumps(rec,ensure_ascii=False,sort_keys=True))
                  except Exception as exc: print('ERR',ep,dtype,repr(kw),repr(exc))
          PY
