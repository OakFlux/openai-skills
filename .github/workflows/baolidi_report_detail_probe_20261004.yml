name: Baolidi Report Detail Probe

on:
  push:
    branches:
      - chatgpt-baolidi-broker-reports-20261004
    paths:
      - .github/workflows/baolidi_report_detail_probe_20261004.yml
      - scripts/probe_baolidi_report_details.py

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Inspect report detail pages
        run: |
          mkdir -p output
          python scripts/probe_baolidi_report_details.py

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: baolidi-report-detail-probe
          path: output/baolidi_detail_probe/
          retention-days: 1
