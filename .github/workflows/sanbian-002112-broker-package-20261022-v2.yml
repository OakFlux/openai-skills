name: Package Sanbian 002112 broker research reports 20261022

on:
  push:
    branches:
      - tmp/sanbian-002112-broker-package-20261022-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF and font tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet requests beautifulsoup4 lxml weasyprint pypdf

      - name: Build validate and package offline research PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup, Tag
          from pypdf import PdfReader
          from weasyprint import HTML

          CODE = "002112"
          SHORT = "三变科技"
          FULL = "三变科技股份有限公司"
          PREPARED = "2026-10-22"
          ROOT_NAME = "三变科技_002112_券商历史研究报告_3份_公开网页离线版"
          OUTPUT_ZIP = "sanbian_002112_broker_reports.zip"
          ROOT = Path(ROOT_NAME)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          reports = [
              {
                  "broker": "长江证券",
                  "analyst": "李勃",
                  "date": "2007-01-24",
                  "title": "三变科技：合理股价11.4-13.2元",
                  "source_url": "https://finance.sina.com.cn/stock/companyresearch/20070124/13333277890.shtml",
                  "filename": "01_20070124_长江证券_合理股价11.4-13.2元_公开网页离线版_非原始PDF.pdf",
              },
              {
                  "broker": "国泰君安",
                  "analyst": "彭继忠",
                  "date": "2007-01-24",
                  "title": "三变科技：向第二阵营迈进的变压器厂商",
                  "source_url": "https://finance.sina.com.cn/stock/companyresearch/20070124/10113277169.shtml",
                  "filename": "02_20070124_国泰君安_向第二阵营迈进的变压器厂商_公开网页离线版_非原始PDF.pdf",
              },
              {
                  "broker": "平安证券",
                  "analyst": "何本虎",
                  "date": "2007-01-23",
                  "title": "三变科技：预计上市定价14.00-15.50元",
                  "source_url": "https://finance.sina.com.cn/stock/companyresearch/20070123/15403274198.shtml",
                  "filename": "03_20070123_平安证券_预计上市定价14.00-15.50元_公开网页离线版_非原始PDF.pdf",
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def clean_text(value: str) -> str:
              value = value.replace("\u3000", " ").replace("\xa0", " ")
              return re.sub(r"\s+", " ", value).strip()

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def fetch_html(url: str) -> tuple[str, dict[str, Any]]:
              last: dict[str, Any] = {}
              for attempt in range(7):
                  try:
                      response = session.get(url, timeout=(20, 150), allow_redirects=True)
                      encoding = response.apparent_encoding or response.encoding or "utf-8"
                      text = response.content.decode(encoding, errors="replace")
                      last = {
                          "status": response.status_code,
                          "bytes": len(response.content),
                          "final_url": response.url,
                          "encoding": encoding,
                      }
                      if response.status_code == 200 and len(text) > 10_000:
                          return text, last
                  except Exception as exc:
                      last = {"error": repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f"Failed to fetch {url}: {last}")

          def extract_article(source_html: str, title: str, broker: str) -> tuple[list[str], str]:
              soup = BeautifulSoup(source_html, "lxml")
              for tag in soup(["script", "style", "noscript", "iframe", "form", "svg"]):
                  tag.decompose()

              target = (
                  soup.select_one("#artibody")
                  or soup.select_one(".artibody")
                  or soup.find(id=re.compile(r"artibody|articlebody|article_body", re.I))
                  or soup.select_one("article")
              )

              if target is None:
                  candidates: list[tuple[int, Tag]] = []
                  for node in soup.find_all(["div", "td"]):
                      text = clean_text(node.get_text(" ", strip=True))
                      if SHORT in text and broker in text:
                          candidates.append((len(text), node))
                  if candidates:
                      target = max(candidates, key=lambda item: item[0])[1]
              if target is None:
                  raise RuntimeError(f"Could not locate article body for {title}")

              for selector in [
                  ".related", ".recommend", ".comment", ".share", ".tools", ".ad",
                  "#comment", "#comment_t_show", "#sinashareto", ".blkComment",
              ]:
                  for node in target.select(selector):
                      node.decompose()

              raw = target.get_text("\n", strip=True)
              lines: list[str] = []
              seen: set[str] = set()
              stop_markers = [
                  "新浪声明", "发表评论", "爱问(iAsk.com)", "相关专题", "机构相关文章",
                  "新浪网财经纵横网友意见留言板", "Copyright ©",
              ]
              skip_exact = {
                  title, SHORT, broker, "报告要点", "投资要点", "投资摘要", "公司研究",
              }
              for raw_line in raw.splitlines():
                  line = clean_text(raw_line)
                  if not line:
                      continue
                  if any(marker in line for marker in stop_markers):
                      break
                  if line in skip_exact:
                      continue
                  if line.startswith("http://") or line.startswith("https://"):
                      continue
                  if len(line) <= 1:
                      continue
                  if line in seen:
                      continue
                  seen.add(line)
                  lines.append(line)

              joined = "\n".join(lines)
              if len(joined) < 2_500 or SHORT not in joined:
                  # Old Sina pages may expose the article as mixed text nodes. Use the largest
                  # text block while still stopping before the site disclaimer/navigation.
                  body_text = clean_text(target.get_text(" ", strip=True))
                  for marker in stop_markers:
                      pos = body_text.find(marker)
                      if pos >= 0:
                          body_text = body_text[:pos]
                  chunks = re.split(r"(?<=[。！？；])\s+|\s{2,}", body_text)
                  lines = []
                  seen.clear()
                  for chunk in chunks:
                      line = clean_text(chunk)
                      if len(line) < 4 or line in seen:
                          continue
                      seen.add(line)
                      lines.append(line)
                  joined = "\n".join(lines)

              if len(joined) < 2_500:
                  raise RuntimeError(f"Article extraction too short for {title}: {len(joined)} chars")
              return lines, clean_text(soup.title.get_text(" ", strip=True) if soup.title else "")

          def render_pdf(spec: dict[str, Any], paragraphs: list[str], page_title: str, path: Path) -> None:
              body_parts = []
              for paragraph in paragraphs:
                  escaped = html.escape(paragraph)
                  if len(paragraph) <= 30 and re.match(r"^[一二三四五六七八九十0-9IVX\.、（）()：:]+", paragraph):
                      body_parts.append(f"<h2>{escaped}</h2>")
                  elif len(paragraph) <= 22 and any(word in paragraph for word in ["要点", "概况", "分析", "估值", "建议", "风险", "结论", "小结"]):
                      body_parts.append(f"<h2>{escaped}</h2>")
                  else:
                      body_parts.append(f"<p>{escaped}</p>")

              document = f"""<!doctype html>
              <html lang="zh-CN">
              <head>
                <meta charset="utf-8">
                <title>{html.escape(spec['title'])}</title>
                <style>
                  @page {{
                    size: A4;
                    margin: 20mm 18mm 20mm 18mm;
                    @bottom-center {{ content: "第 " counter(page) " 页"; font-size: 9pt; color: #666; }}
                  }}
                  body {{ font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; color: #222; font-size: 10.5pt; line-height: 1.78; }}
                  .cover {{ min-height: 245mm; display: flex; flex-direction: column; justify-content: center; page-break-after: always; }}
                  .label {{ display: inline-block; align-self: flex-start; border: 1.5px solid #9b1c1c; color: #9b1c1c; padding: 5px 10px; font-weight: 700; font-size: 11pt; margin-bottom: 20mm; }}
                  h1 {{ font-size: 24pt; line-height: 1.35; margin: 0 0 12mm; }}
                  .meta {{ font-size: 11pt; line-height: 1.9; margin-bottom: 10mm; }}
                  .notice {{ border-top: 1px solid #aaa; padding-top: 7mm; color: #555; font-size: 9.5pt; }}
                  .source {{ word-break: break-all; font-family: monospace; font-size: 8.5pt; }}
                  .content-title {{ font-size: 17pt; border-bottom: 2px solid #333; padding-bottom: 4mm; margin-bottom: 8mm; }}
                  h2 {{ font-size: 13pt; margin: 8mm 0 3mm; page-break-after: avoid; }}
                  p {{ margin: 0 0 4.2mm; text-align: justify; text-indent: 2em; orphans: 3; widows: 3; }}
                </style>
              </head>
              <body>
                <section class="cover">
                  <div class="label">公开网页正文离线整理版 · 非券商原始PDF</div>
                  <h1>{html.escape(spec['title'])}</h1>
                  <div class="meta">
                    券商：{html.escape(spec['broker'])}<br>
                    研究员：{html.escape(spec['analyst'])}<br>
                    发布日期：{html.escape(spec['date'])}<br>
                    公司：{SHORT}（{CODE}.SZ）
                  </div>
                  <div class="notice">
                    本文件依据公开财经网站展示的券商研究正文制作，便于离线阅读。它不是券商发布的原始PDF，
                    不保留原报告封面、图表、页码和版式；报告版权归原券商及作者所有。<br><br>
                    来源页面标题：{html.escape(page_title)}<br>
                    来源：<span class="source">{html.escape(spec['source_url'])}</span><br>
                    整理日期：{PREPARED}
                  </div>
                </section>
                <h1 class="content-title">报告正文</h1>
                {''.join(body_parts)}
              </body>
              </html>"""
              HTML(string=document, base_url=spec["source_url"]).write_pdf(str(path))

          manifest: list[dict[str, Any]] = []
          for spec in reports:
              source_html, fetch_meta = fetch_html(spec["source_url"])
              paragraphs, page_title = extract_article(source_html, spec["title"], spec["broker"])
              dest = ROOT / spec["filename"]
              render_pdf(spec, paragraphs, page_title, dest)

              if not dest.exists() or dest.stat().st_size < 50_000:
                  raise RuntimeError(f"Generated PDF is missing or too small: {dest}")
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < 3:
                  raise RuntimeError(f"Generated PDF too short: {dest.name}, {pages} pages")
              extracted = ""
              for page in reader.pages[:min(pages, 30)]:
                  try:
                      extracted += "\n" + (page.extract_text() or "")
                  except Exception:
                      pass
              if SHORT not in extracted or spec["broker"] not in extracted or "非券商原始PDF" not in extracted:
                  raise RuntimeError(f"PDF identity/disclosure check failed: {dest.name}")

              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEW / dest.stem
              subprocess.run(
                  [
                      "pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "130",
                      "-singlefile", str(dest), str(preview_prefix),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_file = Path(str(preview_prefix) + ".png")
              if not preview_file.exists() or preview_file.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview rendering failed: {dest.name}")

              manifest.append({
                  **spec,
                  "document_form": "公开网页正文离线整理版（非券商原始PDF）",
                  "source_page_title": page_title,
                  "source_character_count": sum(len(item) for item in paragraphs),
                  "actual_pages": pages,
                  "bytes": dest.stat().st_size,
                  "sha256": sha256_file(dest),
                  "fetch_meta": fetch_meta,
                  "preview_file": str(Path("首页预览") / preview_file.name),
              })

          readme = [
              f"三变科技（{CODE}.SZ）券商历史研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "重要说明：",
              "1. 本次检索未发现近年公开可直接下载的三变科技券商公司深度报告原始PDF。",
              "2. 本包收录3份上市初期的券商公司研究，均依据公开网页正文制作离线阅读版。",
              "3. 三份文件均不是券商原始PDF，不保留原报告封面、图表、页码和版式；文件名及首页已明确标注。",
              "4. 未收录自媒体文章、股吧内容或普通新闻分析。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   券商：{item['broker']}；研究员：{item['analyst']}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   来源页面：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ]
          readme += [
              "核验项目：来源页面访问、正文长度、公司与券商标识、非原始PDF披露、PDF文件头、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
          ]
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": SHORT,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "all_files_are_original_broker_pdfs": False,
              "document_form": "公开网页正文离线整理版（非券商原始PDF）",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  "文件名", "文件性质", "券商", "研究员", "发布日期", "标题", "页数",
                  "字节数", "SHA-256", "来源页面",
              ])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["document_form"], item["broker"], item["analyst"],
                      item["date"], item["title"], item["actual_pages"], item["bytes"],
                      item["sha256"], item["source_url"],
                  ])
          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path(OUTPUT_ZIP)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": sha256_file(zip_path),
              "report_count": len(manifest),
              "files": [
                  {
                      "name": item["filename"],
                      "broker": item["broker"],
                      "analyst": item["analyst"],
                      "date": item["date"],
                      "title": item["title"],
                      "pages": item["actual_pages"],
                      "bytes": item["bytes"],
                      "sha256": item["sha256"],
                      "source_character_count": item["source_character_count"],
                  }
                  for item in manifest
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: sanbian-002112-broker-reports-20261022
          path: sanbian_002112_broker_reports.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
