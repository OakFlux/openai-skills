name: Discover Guoji Zhongzhuang historical filings 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-discover-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query public announcement archives
        run: |
          python - <<'PY'
          import json, re, requests
          from datetime import datetime

          endpoint='https://np-anotice-stock.eastmoney.com/api/security/ann'
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'}
          codes=['601399','601268','400062']
          keep_words=('年度报告','年报','招股说明书','招股意向书','重新上市报告书','重新上市申请','季度报告')
          for code in codes:
              print('\n=== CODE',code,'===')
              rows_all=[]; seen=set()
              for page in range(1,31):
                  params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':code,'f_node':'0','s_node':'0'}
                  r=requests.get(endpoint,params=params,headers=headers,timeout=40)
                  print('PAGE',page,'STATUS',r.status_code,'URL',r.url)
                  r.raise_for_status()
                  payload=r.json(); data=payload.get('data') or {}
                  rows=data.get('list') if isinstance(data,dict) else data
                  rows=rows or []
                  print('ROWS',len(rows))
                  if not rows: break
                  for rec in rows:
                      art=rec.get('art_code') or rec.get('artCode')
                      if not art or art in seen: continue
                      seen.add(art)
                      title=str(rec.get('title') or '').strip()
                      if any(w in title for w in keep_words):
                          out={k:rec.get(k) for k in ['art_code','title','notice_date','display_time','columns','codes','short_name']}
                          print('HIT',json.dumps(out,ensure_ascii=False,sort_keys=True))
                  if len(rows)<100: break
          PY
