name: Fetch Nxny Makeng report detail source

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-nxny-source-only-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Fetch sources
        run: |
          mkdir -p out
          python - <<'PY'
          import requests
          from pathlib import Path
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          urls={
            'nxny_6451804.html':'https://www.nxny.com/report/view_6451804.html',
            'nxny_view_js.js':'https://www.nxny.com/js/view.js',
            'nxny_index_js.js':'https://www.nxny.com/js/index.js',
            'pdf51_5966943.html':'https://www.51pdf.cn/report/view_5966943.html',
            'pdf51_view_js.js':'https://www.51pdf.cn/js/view.js',
          }
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print(name,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path('out',name).write_bytes(r.content)
            except Exception as e: print('ERR',name,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-601123-nxny-source-only-20261104
          path: out/
          if-no-files-found: error
          retention-days: 7
