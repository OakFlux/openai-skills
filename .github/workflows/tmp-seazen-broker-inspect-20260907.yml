name: Temporary Seazen broker report inspection
on:
  push:
    branches:
      - tmp-seazen-broker-reports-20260907
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('output')
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Accept':'text/html,application/xhtml+xml,application/pdf,image/avif,image/webp,image/apng,*/*;q=0.8'})
          label='https://www.sgpjbg.com/labels/xinchengfazhannianbao.html'
          targets=['不止于开发','商业精耕红利凸显','云销雨霁']
          result={'label_url':label,'label':{},'reports':[]}
          r=s.get(label,timeout=90,allow_redirects=True)
          print('LABEL',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
          (out/'label.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'lxml')
          matched=[]
          all_report=[]
          for a in soup.find_all('a',href=True):
              href=urljoin(r.url,a.get('href'))
              txt=' '.join(a.get_text(' ',strip=True).split())
              parent=a.find_parent(['article','li','section','div','h2','h3'])
              context=' '.join((parent.get_text(' ',strip=True) if parent else txt).split())[:4000]
              rec={'href':href,'text':txt,'context':context,'attrs':dict(a.attrs)}
              if re.search(r'/baogao/\d+\.html',href): all_report.append(rec)
              if any(t in txt or t in context for t in targets):
                  matched.append(rec)
                  print('MATCH',json.dumps(rec,ensure_ascii=False),flush=True)
          result['label']={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'matched':matched,'all_report_count':len(all_report),'all_report':all_report[:500]}
          report_urls=[]
          for rec in matched:
              if re.search(r'/baogao/\d+\.html',rec['href']): report_urls.append(rec['href'])
          report_urls=list(dict.fromkeys(report_urls))
          print('REPORT_URLS',json.dumps(report_urls,ensure_ascii=False),flush=True)
          for idx,url in enumerate(report_urls,1):
              row={'url':url}
              try:
                  rr=s.get(url,timeout=90,allow_redirects=True)
                  row.update({'status':rr.status_code,'final_url':rr.url,'bytes':len(rr.content),'content_type':rr.headers.get('content-type')})
                  (out/f'report_{idx}.html').write_bytes(rr.content)
                  sp=BeautifulSoup(rr.text,'lxml')
                  row['title']=sp.title.get_text(' ',strip=True) if sp.title else None
                  row['h1']=' '.join((sp.find('h1').get_text(' ',strip=True) if sp.find('h1') else '').split())
                  candidates=[]
                  for tag in sp.find_all(True):
                      for attr in ['href','src','data-src','data-original','data-url','data-file','data-pdf','data-download','content','value']:
                          val=tag.get(attr)
                          if not val or not isinstance(val,str): continue
                          absolute=urljoin(rr.url,val)
                          low=absolute.lower()
                          if any(x in low for x in ['.pdf','.jpg','.jpeg','.png','.webp','download','downfile','fileurl','viewer','preview','attachment']):
                              candidates.append({'tag':tag.name,'attr':attr,'value':val,'url':absolute,'text':' '.join(tag.get_text(' ',strip=True).split())[:500]})
                  decoded=rr.text.replace('\\/','/').replace('&amp;','&')
                  regex_urls=re.findall(r'https?://[^"\'<>\s\\]+',decoded,re.I)
                  for u in regex_urls:
                      low=u.lower()
                      if any(x in low for x in ['.pdf','.jpg','.jpeg','.png','.webp','download','downfile','viewer','preview']):
                          candidates.append({'tag':'regex','attr':'text','value':u,'url':u,'text':''})
                  unique=[]; seen=set()
                  for c in candidates:
                      key=c['url']
                      if key in seen: continue
                      seen.add(key); unique.append(c)
                  row['candidates']=unique[:1500]
                  row['scripts']=[urljoin(rr.url,x.get('src')) for x in sp.find_all('script',src=True)]
                  row['body_head']=' '.join(sp.get_text(' ',strip=True).split())[:15000]
                  print('REPORT',idx,rr.status_code,len(rr.content),rr.url,row['title'],'CANDS',len(unique),flush=True)
                  for c in unique[:100]: print('CAND',idx,json.dumps(c,ensure_ascii=False),flush=True)
              except Exception as e:
                  row['error']=repr(e); print('REPORT_ERR',url,repr(e),flush=True)
              result['reports'].append(row)
          (out/'inspection.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: seazen-broker-inspection
          path: output/*
          retention-days: 1
          if-no-files-found: error
