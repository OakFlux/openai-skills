name: Discover public PDF sources for Henghe reports

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-public-pdf-source-discovery-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Discover sources
        run: |
          python - <<'PY'
          import html, json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, quote

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})

          seed_urls=[
            'https://www.sgpjbg.com/zhuanti/xinnengyuanjiegoujianbaogao.html',
            'https://max.book118.com/html/2023/0622/6232000125005151.shtm',
            'https://www.fxbaogao.com/search?query='+quote('横河精密 深度报告'),
            'https://www.fxbaogao.com/search?keyword='+quote('横河精密'),
            'https://www.10100.com/search?keyword='+quote('横河精密'),
          ]
          discovered=[]
          for url in seed_urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nSEED',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              if r.status_code!=200: continue
              r.encoding=r.apparent_encoding or r.encoding
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                if any(k in label for k in ['横河精密','横河模具','优质精密制造企业','扩产进入汽车产业','国内优质的塑料制品']):
                  print('MATCH_LINK',json.dumps({'label':label[:500],'href':href},ensure_ascii=False)); discovered.append(href)
              text=r.text
              for pat in [r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r'[\"\']([^\"\']*(?:横河|300539)[^\"\']*)[\"\']']:
                for m in re.finditer(pat,text,re.I):
                  v=html.unescape(m.group(1) if m.lastindex else m.group(0)); print('RAW_MATCH',v[:2000])
            except Exception as e: print('SEED_ERROR',url,repr(e))

          for url in list(dict.fromkeys(discovered))[:30]:
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nDETAIL',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              if r.status_code!=200: continue
              r.encoding=r.apparent_encoding or r.encoding
              soup=BeautifulSoup(r.text,'html.parser')
              print('DETAIL_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for tag in soup.find_all(['a','iframe','embed','object','source','script','link']):
                attrs={k:tag.get(k) for k in ('href','src','data','download','type') if tag.get(k)}
                label=' '.join(tag.get_text(' ',strip=True).split())[:400]
                raw=label+' '+json.dumps(attrs,ensure_ascii=False)
                if any(k in raw.lower() for k in ['pdf','download','下载','原文','附件','file','docurl','report']):
                  for k in ('href','src','data'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('DETAIL_TAG',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False))
              for pat in [r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r'(?:pdf|download|file|attachment|docurl|url)[A-Za-z_]*\s*[:=]\s*[\"\']([^\"\']+)[\"\']']:
                for m in re.finditer(pat,r.text,re.I):
                  v=html.unescape(m.group(1) if m.lastindex else m.group(0)); print('DETAIL_RAW',v[:2000])
            except Exception as e: print('DETAIL_ERROR',url,repr(e))

          # Probe Eastmoney report API parameter variants and focused date windows.
          api='https://reportapi.eastmoney.com/report/list'
          variants=['300539','SZ300539','0.300539','300539.SZ','横河精密','横河模具']
          date_ranges=[('2023-06-01','2023-07-15'),('2017-05-01','2017-06-15'),('2016-08-01','2016-09-15'),('2024-03-01','2024-04-01')]
          for code in variants:
            for begin,end in date_ranges:
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':'1','fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'}
              try:
                r=s.get(api,params=params,timeout=30); data=r.json(); rows=data.get('data') or []
                if rows or data.get('hits'):
                  print('EM_HIT',code,begin,end,'hits',data.get('hits'),'rows',len(rows))
                  for x in rows: print('EM_REPORT',json.dumps(x,ensure_ascii=False))
              except Exception as e: print('EM_ERROR',code,begin,end,repr(e))
          PY
