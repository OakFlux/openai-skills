name: Build JST Group broker report public preview package 20260922

on:
  push:
    paths:
      - '.github/workflows/jst-broker-reports-final-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install browser and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet playwright pillow pypdf reportlab requests
          python -m playwright install --with-deps chromium

      - name: Capture public previews, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import asyncio
          import hashlib
          import io
          import json
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from PIL import Image
          from pypdf import PdfReader, PdfWriter
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.utils import ImageReader
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.cidfonts import UnicodeCIDFont
          from reportlab.pdfgen import canvas
          from playwright.async_api import async_playwright

          PACKAGE = '聚水潭_06687_券商深度报告_公开预览版_3份'
          out = Path(PACKAGE)
          work = Path('_work')
          out.mkdir(exist_ok=True)
          work.mkdir(exist_ok=True)

          pdfmetrics.registerFont(UnicodeCIDFont('STSong-Light'))
          FONT = 'STSong-Light'
          PAGE_W, PAGE_H = A4

          reports = [
              {
                  'order': '01',
                  'broker': '广发证券',
                  'title': '聚水潭（06687.HK）：进入盈利释放期的稀缺SaaS公司，海外与AI应用助力突破远期天花板',
                  'report_date': '2025-12-12',
                  'original_pages': 23,
                  'authors': '刘雪峰、吴祖鹏',
                  'rating': '买入',
                  'report_page': 'https://www.sgpjbg.com/baogao/994868.html',
                  'metadata_url': 'https://www.nxny.com/report/view_6177257.html',
                  'keyword': '进入盈利释放期',
                  'filename': '01_广发证券_聚水潭_进入盈利释放期的稀缺SaaS公司_公开预览版_2025-12-12.pdf',
                  'fallback_points': [
                      '聚水潭以电商SaaS ERP为核心，覆盖订单、库存、物流协同和财务结算，并逐步扩展为综合电商SaaS协同平台。',
                      '公开研报信息显示，公司2024年在中国电商SaaS ERP市场的份额为24.4%，净客户收入留存率为115%，LTV/CAC为9.3。',
                      '报告将海外扩张与增值软件视为新增长曲线，重点关注东南亚，并继续探索欧美、拉美和中东市场。',
                      '公开预测为2025-2027年营业收入11.4/13.9/16.6亿元，归母净利润0.7/3.5/5.2亿元；报告给予买入评级。',
                  ],
              },
              {
                  'order': '02',
                  'broker': '申万宏源',
                  'title': '聚水潭（06687.HK）：盈利拐点已现，规模化、AI与出海驱动未来增长',
                  'report_date': '2026-04-11',
                  'original_pages': 23,
                  'authors': '公开页面未完整列示',
                  'rating': '首次覆盖（公开解读页未统一列示具体评级）',
                  'report_page': 'https://www.sgpjbg.com/baogao/1187141.html',
                  'metadata_url': 'https://www.360why.com/enterprise/260419000009509.html',
                  'keyword': '盈利拐点已现',
                  'filename': '02_申万宏源_聚水潭_盈利拐点已现_规模化_AI_出海驱动未来增长_公开预览版_2026-04-11.pdf',
                  'fallback_points': [
                      '报告关注聚水潭从高速收入增长走向利润释放：2025年收入约11.4亿元，经调整净利润约2.3亿元，实现盈利拐点。',
                      '盈利改善主要来自规模效应、毛利率提升、销售与研发效率优化，以及高黏性客户持续贡献。',
                      'AI方向包括智能客服、经营分析、自动化流程与产品能力升级；出海重点面向东南亚电商生态。',
                      '风险因素主要包括电商景气度、平台合作关系、SaaS竞争、海外拓展和AI产品商业化不及预期。',
                  ],
              },
              {
                  'order': '03',
                  'broker': '华泰证券',
                  'title': '聚水潭（06687.HK）：成长盈利共振的电商SaaS ERP龙头',
                  'report_date': '2026-05-13',
                  'original_pages': 42,
                  'authors': '侯杰、夏路路、曹卓铭',
                  'rating': '买入（首次覆盖）；公开页面目标价26.15港元',
                  'report_page': 'https://www.sgpjbg.com/baogao/1237915.html',
                  'metadata_url': 'https://www.nxny.com/report/view_6292412.html',
                  'keyword': '成长盈利共振',
                  'filename': '03_华泰证券_聚水潭_成长盈利共振的电商SaaS_ERP龙头_公开预览版_2026-05-13.pdf',
                  'fallback_points': [
                      '华泰证券首次覆盖聚水潭，公开页面列示买入评级和26.15港元目标价。',
                      '报告认为合规监管、多平台经营和低渗透率将推动电商SaaS ERP由可选工具逐步转为经营刚需。',
                      '增长路径包括行业渗透率提升、市场份额集中、产品交叉销售和海外复制；AI主要用于扩充功能和优化服务成本。',
                      '公开预测为2026-2028年经调整净利润约4.0/5.7/7.0亿元，风险包括平台合作、技术迭代及AI竞争。',
                  ],
              },
          ]

          def wrapped_lines(text: str, max_chars: int) -> list[str]:
              text = re.sub(r'\s+', ' ', text).strip()
              return [text[i:i+max_chars] for i in range(0, len(text), max_chars)] or ['']

          def make_cover(report: dict, path: Path, preview_count: int, mode: str) -> None:
              c = canvas.Canvas(str(path), pagesize=A4)
              c.setTitle(report['title'])
              margin = 54
              y = PAGE_H - 65
              c.setFont(FONT, 11)
              c.drawString(margin, y, '聚水潭（06687.HK）券商研究资料')
              y -= 45
              c.setFont(FONT, 20)
              for line in wrapped_lines(report['title'], 25):
                  c.drawString(margin, y, line)
                  y -= 30
              y -= 8
              c.setFont(FONT, 12)
              facts = [
                  f"券商：{report['broker']}",
                  f"报告日期：{report['report_date']}",
                  f"原报告标示页数：{report['original_pages']}页",
                  f"分析师：{report['authors']}",
                  f"评级信息：{report['rating']}",
                  f"本包形态：{mode}",
              ]
              for item in facts:
                  for line in wrapped_lines(item, 37):
                      c.drawString(margin, y, line)
                      y -= 21
              y -= 15
              c.setFont(FONT, 11)
              notice = (
                  '重要说明：券商完整原始PDF所在平台设有登录、会员或加密下载权限。'
                  '本文件没有绕过访问控制，仅收录网页公开展示的预览页面；若公开预览未能载入，'
                  '则提供基于公开研报解读的要点整理。该文件不能替代券商完整原始报告。'
              )
              for line in wrapped_lines(notice, 39):
                  c.drawString(margin, y, line)
                  y -= 20
              y -= 12
              c.setFont(FONT, 9)
              for label, url in [('公开预览页', report['report_page']), ('报告元数据/公开解读', report['metadata_url'])]:
                  c.drawString(margin, y, f'{label}：')
                  y -= 15
                  for line in wrapped_lines(url, 75):
                      c.drawString(margin, y, line)
                      y -= 14
              c.setFont(FONT, 9)
              c.drawRightString(PAGE_W - margin, 35, f"公开预览页数：{preview_count}")
              c.save()

          def make_summary(report: dict, path: Path) -> None:
              c = canvas.Canvas(str(path), pagesize=A4)
              c.setTitle(report['title'] + ' 公开要点')
              margin = 54
              y = PAGE_H - 58
              c.setFont(FONT, 16)
              c.drawString(margin, y, '公开研报要点整理')
              y -= 34
              c.setFont(FONT, 11)
              for idx, point in enumerate(report['fallback_points'], 1):
                  lines = wrapped_lines(f'{idx}. {point}', 40)
                  for line in lines:
                      if y < 75:
                          c.showPage(); c.setFont(FONT, 11); y = PAGE_H - 58
                      c.drawString(margin, y, line)
                      y -= 20
                  y -= 9
              y -= 8
              c.setFont(FONT, 9)
              note = '以上内容为公开页面信息的概括，不含券商报告未公开页面、完整图表或全部假设。'
              for line in wrapped_lines(note, 65):
                  c.drawString(margin, y, line); y -= 15
              c.save()

          def make_image_pdf(image_paths: list[Path], path: Path) -> None:
              c = canvas.Canvas(str(path), pagesize=A4)
              for image_path in image_paths:
                  with Image.open(image_path) as im:
                      im.seek(0)
                      rgb = im.convert('RGB')
                      buf = io.BytesIO()
                      rgb.save(buf, format='JPEG', quality=94, optimize=True)
                      buf.seek(0)
                      iw, ih = rgb.size
                      scale = min((PAGE_W - 26) / iw, (PAGE_H - 26) / ih)
                      w, h = iw * scale, ih * scale
                      c.drawImage(ImageReader(buf), (PAGE_W - w) / 2, (PAGE_H - h) / 2, width=w, height=h, preserveAspectRatio=True)
                      c.showPage()
              c.save()

          def merge_pdfs(paths: list[Path], dest: Path) -> None:
              writer = PdfWriter()
              for path in paths:
                  reader = PdfReader(str(path), strict=False)
                  for page in reader.pages:
                      writer.add_page(page)
              with dest.open('wb') as fh:
                  writer.write(fh)

          async def collect_previews() -> dict[str, dict]:
              results: dict[str, dict] = {}
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled','--no-sandbox'])
                  context = await browser.new_context(
                      viewport={'width': 1440, 'height': 1050},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                      locale='zh-CN',
                  )
                  for report in reports:
                      page = await context.new_page()
                      net: list[str] = []
                      page.on('response', lambda resp, net=net: net.append(resp.url) if ('file.sgpjbg.com/fileroot' in resp.url and resp.status == 200) else None)
                      rec = {'status': None, 'final_url': None, 'title': None, 'images': [], 'page_text': '', 'error': None}
                      try:
                          resp = await page.goto(report['report_page'], wait_until='domcontentloaded', timeout=90000)
                          rec['status'] = resp.status if resp else None
                          await page.wait_for_timeout(3500)
                          for _ in range(18):
                              await page.mouse.wheel(0, 2300)
                              await page.wait_for_timeout(220)
                          await page.wait_for_timeout(1800)
                          rec['final_url'] = page.url
                          rec['title'] = await page.title()
                          rec['page_text'] = (await page.locator('body').inner_text())[:50000]
                          dom_images = await page.eval_on_selector_all(
                              'img',
                              '''(els, kw) => els.map(e => ({src:e.currentSrc||e.src||'', alt:e.alt||'', w:e.naturalWidth||0, h:e.naturalHeight||0}))
                                  .filter(x => x.src.includes('file.sgpjbg.com/fileroot') && x.alt.includes(kw) && x.alt.includes('第') && x.w > 700 && x.h > 900)''',
                              report['keyword'],
                          )
                          urls = [x['src'] for x in dom_images]
                          # Only include report-page images that the public viewer actually loaded during a normal browse.
                          for url in net:
                              if url not in urls and any(url.rsplit('/',1)[-1].startswith(u.rsplit('/',1)[-1].rsplit('.',1)[0][:-1]) for u in urls):
                                  urls.append(url)
                          # Keep conservative public preview scope: maximum five loaded images.
                          urls = list(dict.fromkeys(urls))[:5]
                          rec['images'] = urls
                      except Exception as exc:
                          rec['error'] = repr(exc)
                      results[report['order']] = rec
                      await page.close()
                  await browser.close()
              return results

          preview_results = asyncio.run(collect_previews())
          session = requests.Session()
          session.trust_env = False
          session.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36', 'Referer': 'https://www.sgpjbg.com/'})

          records = []
          for report in reports:
              rec = preview_results.get(report['order'], {})
              report_work = work / report['order']
              report_work.mkdir(exist_ok=True)
              image_paths: list[Path] = []
              download_errors: list[str] = []
              for idx, url in enumerate(rec.get('images', []), 1):
                  try:
                      r = session.get(url, timeout=(20, 120), allow_redirects=True)
                      r.raise_for_status()
                      if len(r.content) < 20_000:
                          raise RuntimeError(f'image too small: {len(r.content)}')
                      img_path = report_work / f'preview_{idx:02d}{Path(urlparse(url).path).suffix or ".img"}'
                      img_path.write_bytes(r.content)
                      with Image.open(img_path) as im:
                          im.verify()
                      image_paths.append(img_path)
                  except Exception as exc:
                      download_errors.append(f'{url}: {exc!r}')

              cover = report_work / 'cover.pdf'
              components = [cover]
              if image_paths:
                  image_pdf = report_work / 'preview_pages.pdf'
                  make_image_pdf(image_paths, image_pdf)
                  mode = f'公开预览版（收录网页公开展示的{len(image_paths)}页）'
                  make_cover(report, cover, len(image_paths), mode)
                  components.append(image_pdf)
                  content_mode = 'public_preview_pages'
              else:
                  summary_pdf = report_work / 'public_summary.pdf'
                  make_summary(report, summary_pdf)
                  mode = '公开资料整理版（公开预览页未能稳定载入）'
                  make_cover(report, cover, 0, mode)
                  components.append(summary_pdf)
                  content_mode = 'public_information_summary'

              dest = out / report['filename']
              merge_pdfs(components, dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < 2:
                  raise RuntimeError(f'too few pages for {dest.name}: {pages}')
              text = ''
              for page in reader.pages[:min(3, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              if '聚水潭' not in text or report['broker'] not in text:
                  raise RuntimeError(f'identity check failed: {dest.name}')
              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {dest.name}: {check.stderr[-1200:]}')
              render_prefix = report_work / 'render'
              subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '110', str(dest), str(render_prefix)], check=True, capture_output=True)
              rendered = Path(str(render_prefix) + '.png')
              if not rendered.exists() or rendered.stat().st_size < 10_000:
                  raise RuntimeError(f'render check failed: {dest.name}')
              sha = hashlib.sha256(dest.read_bytes()).hexdigest()
              records.append({
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'title': report['title'],
                  'report_date': report['report_date'],
                  'original_report_pages': report['original_pages'],
                  'compiled_pdf_pages': pages,
                  'public_preview_pages_included': len(image_paths),
                  'content_mode': content_mode,
                  'authors': report['authors'],
                  'rating': report['rating'],
                  'public_report_page': report['report_page'],
                  'metadata_or_interpretation_url': report['metadata_url'],
                  'viewer_status': rec.get('status'),
                  'viewer_final_url': rec.get('final_url'),
                  'viewer_error': rec.get('error'),
                  'image_download_errors': download_errors,
                  'bytes': dest.stat().st_size,
                  'sha256': sha,
              })

          readme = [
              '聚水潭集团股份有限公司（06687.HK）券商深度研究资料包',
              '整理日期：2026-09-22',
              '',
              '收录报告：广发证券、申万宏源、华泰证券，共3份。',
              '重要说明：券商完整原始PDF所在平台设有加密、登录、会员或VIP下载权限。',
              '本包没有绕过访问控制。PDF仅收录网页公开展示的报告预览页；若某页面无法稳定载入，则提供基于公开研报解读的要点整理。',
              '各文件封面均明确标注内容形态，不能替代券商完整原始PDF。',
              '',
              '文件清单：',
          ]
          for idx, r in enumerate(records, 1):
              readme.extend([
                  f"{idx}. {r['broker']}：{r['title']}",
                  f"   报告日期：{r['report_date']}；原报告标示页数：{r['original_report_pages']}页",
                  f"   本包PDF：{r['compiled_pdf_pages']}页；公开预览原页：{r['public_preview_pages_included']}页",
                  f"   内容形态：{r['content_mode']}",
                  f"   文件：{r['filename']}",
                  f"   公开预览页：{r['public_report_page']}",
                  f"   元数据/公开解读：{r['metadata_or_interpretation_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF页数、公司与券商身份、qpdf结构、首页渲染、ZIP CRC及SHA-256。')
          (out / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', digest)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: jst-group-broker-reports-public-preview-final
          path: 聚水潭_06687_券商深度报告_公开预览版_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
