name: Temporary Test Public Mengtai Report PDF Endpoints

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-test-sdyanbao-mengtai-static.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect detail, download and static endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import html
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          API = 'https://api.sdyanbao.com'
          STATIC = 'https://static.sdyanbao.com/'
          IDS = [55094, 42029]
          OUT = Path('endpoint_probe')
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://www.sdyanbao.com/',
              'Origin': 'https://www.sdyanbao.com',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Device': '1',
              'X-Token': '',
          })

          def is_pdf(data: bytes) -> bool:
              return len(data) > 20000 and data.lstrip().startswith(b'%PDF')

          def summarize_response(label, response):
              raw = response.content
              result = {
                  'label': label,
                  'requested_url': response.request.url,
                  'final_url': response.url,
                  'status': response.status_code,
                  'content_type': response.headers.get('content-type'),
                  'content_length_header': response.headers.get('content-length'),
                  'content_disposition': response.headers.get('content-disposition'),
                  'bytes': len(raw),
                  'head_hex': raw[:32].hex(),
                  'head_text': raw[:500].decode('utf-8', errors='replace'),
                  'is_pdf': is_pdf(raw),
              }
              print('RESPONSE_JSON=' + json.dumps(result, ensure_ascii=False))
              return result

          for report_id in IDS:
              detail_response = session.post(
                  API + '/api/file/detail',
                  json={'id': report_id, 'opFrom': 1},
                  timeout=60,
              )
              summarize_response(f'{report_id}:detail', detail_response)
              detail_response.raise_for_status()
              detail_payload = detail_response.json()
              (OUT / f'{report_id}_detail.json').write_text(
                  json.dumps(detail_payload, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              data = detail_payload.get('data') or {}
              print('DETAIL_FIELDS=' + json.dumps({
                  'id': report_id,
                  'name': data.get('name'),
                  'page_count': data.get('page_count'),
                  'size': data.get('size'),
                  'author': data.get('author'),
                  'organization': data.get('organization'),
                  'online_url': data.get('online_url'),
                  'page_url': data.get('page_url'),
                  'oss_name': data.get('oss_name'),
                  'page_dir': data.get('page_dir'),
                  'image_name': data.get('image_name'),
                  'downloadName': data.get('downloadName'),
                  'is_unlock': data.get('is_unlock'),
                  'is_download': data.get('is_download'),
              }, ensure_ascii=False))

              candidates = []
              for candidate in [
                  data.get('online_url'),
                  data.get('page_url'),
                  urljoin(STATIC, str(data.get('oss_name') or '')),
              ]:
                  if candidate and candidate not in candidates:
                      candidates.append(candidate)
                  if candidate and not candidate.lower().endswith('.pdf'):
                      for suffix in ('.pdf', '?download=1', '?attname=1'):
                          value = candidate + suffix
                          if value not in candidates:
                              candidates.append(value)

              discovered = []
              for index, candidate in enumerate(candidates, start=1):
                  try:
                      response = session.get(
                          candidate,
                          headers={'Accept': 'application/pdf,text/html,application/json,*/*'},
                          timeout=120,
                          allow_redirects=True,
                      )
                      summary = summarize_response(f'{report_id}:candidate:{index}', response)
                      raw = response.content
                      if summary['is_pdf']:
                          path = OUT / f'{report_id}_candidate_{index}.pdf'
                          path.write_bytes(raw)
                          print('SAVED_PDF=' + json.dumps({'id': report_id, 'path': str(path)}, ensure_ascii=False))
                      else:
                          ctype = (response.headers.get('content-type') or '').lower()
                          if 'text' in ctype or 'json' in ctype or raw[:1] in (b'{', b'[', b'<'):
                              text = html.unescape(raw.decode('utf-8', errors='ignore')).replace('\\/', '/')
                              (OUT / f'{report_id}_candidate_{index}.txt').write_text(text[:500000], encoding='utf-8')
                              for pattern in [
                                  r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',
                                  r'https?://static\.sdyanbao\.com/[^"\'<>\s]+',
                                  r'(?:src|href|url|file|pdfUrl|downloadUrl)\s*[:=]\s*["\']([^"\']+)["\']',
                              ]:
                                  for match in re.findall(pattern, text, flags=re.I):
                                      if isinstance(match, tuple):
                                          match = match[0]
                                      url = urljoin(response.url, match)
                                      if url not in discovered:
                                          discovered.append(url)
                  except Exception as exc:
                      print('CANDIDATE_ERROR=' + json.dumps({
                          'id': report_id, 'url': candidate, 'error': repr(exc)
                      }, ensure_ascii=False))

              print('DISCOVERED_URLS=' + json.dumps({'id': report_id, 'urls': discovered[:200]}, ensure_ascii=False))
              for index, candidate in enumerate(discovered[:50], start=1):
                  try:
                      response = session.get(candidate, timeout=120, allow_redirects=True)
                      summary = summarize_response(f'{report_id}:discovered:{index}', response)
                      if summary['is_pdf']:
                          path = OUT / f'{report_id}_discovered_{index}.pdf'
                          path.write_bytes(response.content)
                          print('SAVED_PDF=' + json.dumps({'id': report_id, 'path': str(path)}, ensure_ascii=False))
                  except Exception as exc:
                      print('DISCOVERED_ERROR=' + json.dumps({
                          'id': report_id, 'url': candidate, 'error': repr(exc)
                      }, ensure_ascii=False))

              download_payloads = [
                  {'id': report_id},
                  {'id': report_id, 'opFrom': 1},
                  {'id': report_id, 'beike': 0, 'opFrom': 1},
                  {'fileId': report_id, 'opFrom': 1},
              ]
              for index, payload in enumerate(download_payloads, start=1):
                  try:
                      response = session.post(API + '/api/file/download', json=payload, timeout=60)
                      summary = summarize_response(f'{report_id}:download:{index}', response)
                      raw = response.content
                      if summary['is_pdf']:
                          path = OUT / f'{report_id}_download_{index}.pdf'
                          path.write_bytes(raw)
                          print('SAVED_PDF=' + json.dumps({'id': report_id, 'path': str(path)}, ensure_ascii=False))
                          continue
                      try:
                          payload_response = response.json()
                      except Exception:
                          continue
                      print('DOWNLOAD_BODY=' + json.dumps({
                          'id': report_id, 'request': payload, 'response': payload_response
                      }, ensure_ascii=False))
                      urls = []
                      def walk(value):
                          if isinstance(value, dict):
                              for item in value.values():
                                  yield from walk(item)
                          elif isinstance(value, list):
                              for item in value:
                                  yield from walk(item)
                          elif isinstance(value, str) and value.startswith(('http://', 'https://')):
                              yield value
                      for value in walk(payload_response):
                          if value not in urls:
                              urls.append(value)
                      for url_index, url in enumerate(urls, start=1):
                          fetched = session.get(url, timeout=120, allow_redirects=True)
                          fetched_summary = summarize_response(
                              f'{report_id}:download-url:{index}:{url_index}', fetched
                          )
                          if fetched_summary['is_pdf']:
                              path = OUT / f'{report_id}_download_url_{index}_{url_index}.pdf'
                              path.write_bytes(fetched.content)
                              print('SAVED_PDF=' + json.dumps({'id': report_id, 'path': str(path)}, ensure_ascii=False))
                  except Exception as exc:
                      print('DOWNLOAD_ERROR=' + json.dumps({
                          'id': report_id, 'request': payload, 'error': repr(exc)
                      }, ensure_ascii=False))
          PY

      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: mengtai-sdyanbao-endpoint-probe
          path: endpoint_probe
          retention-days: 2
          if-no-files-found: error
