name: Search open China Hongqiao broker PDFs
on:
  push:
    branches:
      - tmp-hongqiao-open-pdf-search-20260908
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf ddgs
      - name: Search, fetch and validate PDFs
        run: |
          set -euo pipefail
          mkdir -p output/pdfs output/html
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from pathlib import Path
          from urllib.parse import parse_qs, unquote, urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          try:
              from ddgs import DDGS
          except Exception as exc:
              DDGS=None; print('DDGS_IMPORT_ERROR',repr(exc),flush=True)

          titles=[
            '产业升级顺势而为，前瞻布局穿越周期',
            '全产业链铸就成本护城河，高股息引领价值重估',
            '高景气+一体化+高分红，电解铝龙头静待价值重估',
            '全球电解铝龙头，一体化打造盈利护城河，高分红属性明显',
            '全球电解铝龙头，兼具一体化优势与高分红属性',
            '铝材料领军企业，产品高端化电解铝高景气开启新征程',
            '成本企稳+铝行业高景气，电解铝龙头扬帆起航',
          ]
          queries=[]
          for t in titles:
              queries += [f'"{t}" PDF',f'"中国宏桥" "{t}"',f'"01378.HK" "{t}"']
          queries += [
            '中国宏桥 券商 深度报告 PDF',
            '中国宏桥 公司深度 证券研究报告 PDF',
            'China Hongqiao initiation coverage PDF broker',
            'China Hongqiao equity research report PDF',
            'site:pdf.dfcfw.com/pdf 中国宏桥',
            'site:pdf.dfcfw.com/pdf 01378',
            'site:researchreport.* 中国宏桥 PDF',
            'S0680521030003 中国宏桥 PDF',
            'S0800523090001 中国宏桥 PDF',
            'S0360522120003 中国宏桥 PDF',
            'S0600526060002 中国宏桥 PDF',
          ]
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session();s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          found=[]; seen=set()
          def add(url,title='',snippet='',source=''):
              if not url: return
              url=url.replace('&amp;','&').strip()
              if url.startswith('//'): url='https:'+url
              if 'duckduckgo.com/l/?' in url:
                  q=parse_qs(urlparse(url).query); url=unquote((q.get('uddg') or [url])[0])
              if not url.startswith('http'): return
              url=url.split('#')[0]
              if url not in seen:
                  seen.add(url);found.append({'url':url,'title':title,'snippet':snippet,'source':source})

          # DDGS text search across multiple backends.
          if DDGS:
              for q in queries:
                  try:
                      for r in DDGS(timeout=20).text(q,region='cn-zh',safesearch='off',max_results=40):
                          add(r.get('href') or r.get('url'),r.get('title',''),r.get('body',''),'ddgs:'+q)
                  except Exception as exc: print('DDGS_ERR',q,repr(exc),flush=True)

          # Direct HTML search-engine fallbacks.
          for q in queries:
              for engine,url,params in [
                ('bing','https://www.bing.com/search',{'q':q,'count':'50','setlang':'zh-hans'}),
                ('ducklite','https://lite.duckduckgo.com/lite/',{'q':q}),
                ('yahoo','https://search.yahoo.com/search',{'p':q,'n':'50'}),
              ]:
                try:
                  r=s.get(url,params=params,timeout=25); soup=BeautifulSoup(r.text,'lxml')
                  if engine=='bing':
                    for li in soup.select('li.b_algo'):
                      a=li.select_one('h2 a'); p=li.select_one('.b_caption p')
                      if a: add(a.get('href'),a.get_text(' ',strip=True),p.get_text(' ',strip=True) if p else '',engine+':'+q)
                  elif engine=='ducklite':
                    for a in soup.select('a.result-link'): add(a.get('href'),a.get_text(' ',strip=True),'',engine+':'+q)
                  else:
                    for a in soup.select('h3.title a, div#web a[href]'):
                      add(a.get('href'),a.get_text(' ',strip=True),'',engine+':'+q)
                except Exception as exc: print('ENGINE_ERR',engine,q,repr(exc),flush=True)

          Path('output/search_results.json').write_text(json.dumps(found,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FOUND_URLS',len(found),flush=True)
          company=re.compile(r'中国宏桥|中國宏橋|China\s+Hongqiao|01378|1378\.HK',re.I)
          report=re.compile(r'证券研究报告|證券研究報告|公司深度|首次覆盖|首次覆蓋|深度研究|initiation|equity research|coverage',re.I)
          deny_hosts={'max.book118.com','www.book118.com','www.fxbaogao.com','wap.hibor.com.cn','www.sdyanbao.com','www.vzkoo.com','www.yanbaoke.com','www.nxny.com'}
          queue=[]; qseen=set()
          def enqueue(url,ref='',label=''):
              if not url or not url.startswith('http'): return
              url=url.replace('&amp;','&').split('#')[0]
              if url not in qseen:
                  qseen.add(url);queue.append({'url':url,'ref':ref,'label':label})
          for x in found:
              blob=' '.join([x['url'],x['title'],x['snippet']])
              if company.search(blob) or any(t[:8] in blob for t in titles): enqueue(x['url'],label=x['title'])
          # Known public articles that sometimes expose source attachment URLs.
          for u in [
            'https://www.sohu.com/a/1015361932_121123901',
            'https://www.sohu.com/a/931325274_122123195',
            'https://www.baogaobox.com/insights/250528000015577.html',
          ]: enqueue(u,label='known-page')

          inspected=[]; saved={}
          def validate(data,url,label):
              rec={'url':url,'label':label,'bytes':len(data),'header':data[:8].decode('latin1','replace')}
              if not data.startswith(b'%PDF'): rec['is_pdf']=False; return rec
              rec['is_pdf']=True; sha=hashlib.sha256(data).hexdigest();rec['sha256']=sha
              tmp=Path('output')/f'tmp_{sha[:12]}.pdf';tmp.write_bytes(data)
              try:
                rd=PdfReader(str(tmp)); n=len(rd.pages); idxs=sorted(set([0,min(1,n-1),min(4,n-1),max(0,n//2),max(0,n-2),n-1]))
                text='\n'.join((rd.pages[i].extract_text() or '') for i in idxs); compact=' '.join(text.split())
                rec.update(pages=n,sample=compact[:12000],mentions_company=bool(company.search(compact)),mentions_report=bool(report.search(compact)),
                           has_end=bool(re.search(r'免责声明|免責聲明|分析师声明|Analyst Certification|评级说明|法律声明',compact[-6000:],re.I)))
                # Accept only substantial report PDFs, not 1-10 page summaries or known partial preview hosts.
                host=urlparse(url).netloc.lower()
                rec['accepted']=rec['mentions_company'] and n>=15 and host not in deny_hosts and (rec['has_end'] or n>=22)
                if rec['accepted'] and sha not in saved:
                  name=re.sub(r'[\\/:*?"<>|]+','_',label or '中国宏桥券商研究报告')[:100]
                  dest=Path('output/pdfs')/f'{len(saved)+1:02d}_{name}.pdf';dest.write_bytes(data);saved[sha]=str(dest);rec['saved_as']=str(dest)
              except Exception as exc: rec['parse_error']=repr(exc)
              tmp.unlink(missing_ok=True);return rec

          i=0
          while i<len(queue) and i<500 and len(saved)<8:
              item=queue[i];i+=1;u=item['url'];rec=dict(item)
              try:
                r=s.get(u,headers={'Referer':item.get('ref') or 'https://www.google.com/'},timeout=45,allow_redirects=True,stream=True)
                data=b''
                for chunk in r.iter_content(262144):
                  if chunk:data+=chunk
                  if len(data)>80*1024*1024:break
                rec.update(status=r.status_code,final_url=r.url,content_type=r.headers.get('content-type',''),bytes=len(data))
                v=validate(data,r.url,item.get('label') or '')
                rec['pdf']=v
                if not v.get('is_pdf') and ('html' in rec['content_type'].lower() or b'<html' in data[:2000].lower()):
                  text=data.decode(r.encoding or 'utf-8',errors='ignore').replace('\\/','/')
                  soup=BeautifulSoup(text,'lxml'); links=[]
                  for tag in soup.find_all(['a','iframe','embed','object','source'],href=True):
                    links.append((urljoin(r.url,tag.get('href')),tag.get_text(' ',strip=True)))
                  for tag in soup.find_all(['iframe','embed','object','source'],src=True):
                    links.append((urljoin(r.url,tag.get('src')),tag.get_text(' ',strip=True)))
                  for m in re.finditer(r'https?://[^\"\'<>\s]+?(?:\.pdf(?:\?[^\"\'<>\s]*)?|/download[^\"\'<>\s]*)',text,re.I): links.append((m.group(0),'regex'))
                  rec['extracted_links']=[]
                  for link,label in links:
                    if re.search(r'\.pdf(?:$|\?)|download|attachment|file',link,re.I):
                      rec['extracted_links'].append({'url':link,'label':label});enqueue(link,ref=r.url,label=label or item.get('label',''))
                  # record cloud-share links for diagnosis, but do not automate them
                  rec['cloud_links']=sorted(set(re.findall(r'https?://(?:pan\.baidu\.com|pan\.quark\.cn|drive\.google\.com|1drv\.ms|aliyundrive\.com)[^\"\'<>\s]+',text,re.I)))
                  Path(f'output/html/{i:03d}.html').write_text(text,encoding='utf-8')
              except Exception as exc: rec['error']=repr(exc)
              inspected.append(rec)
              if rec.get('pdf',{}).get('is_pdf'):
                print('PDF',json.dumps(rec['pdf'],ensure_ascii=False)[:25000],flush=True)
          Path('output/inspected.json').write_text(json.dumps(inspected,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/summary.json').write_text(json.dumps({'saved':saved,'queue_count':len(queue),'inspected_count':len(inspected)},ensure_ascii=False,indent=2),encoding='utf-8')
          print('SAVED',json.dumps(saved,ensure_ascii=False),flush=True)
          PY
      - name: Upload search output
        uses: actions/upload-artifact@v4
        with:
          name: hongqiao-open-pdf-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
