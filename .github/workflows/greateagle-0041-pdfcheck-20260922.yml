name: Check Great Eagle public PDF candidates
on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-pdfcheck-20260922.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf
          mkdir output
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://xueqiu.com/' 'https://stockmc.xueqiu.com/202604/470081cbf30341ec982eeab2acfe9248.pdf' -o output/report1.pdf
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://xueqiu.com/' 'https://stockmc.xueqiu.com/202606/64b49f8155324ca69d4a49e4d6c4ac0d.pdf' -o output/report2.pdf
          qpdf --check output/report1.pdf
          qpdf --check output/report2.pdf
          pdfinfo output/report1.pdf > output/report1_info.txt
          pdfinfo output/report2.pdf > output/report2_info.txt
          pdftotext -f 1 -l 15 -layout output/report1.pdf output/report1_first15.txt
          pdftotext -f 1 -l 15 -layout output/report2.pdf output/report2_first15.txt
          sha256sum output/*.pdf > output/SHA256SUMS.txt
          head -300 output/report1_first15.txt
          head -300 output/report2_first15.txt
      - uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-pdfcheck
          path: output
          retention-days: 7
          compression-level: 0
