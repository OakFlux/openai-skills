name: Temporary Hangyan public report navigation

on:
  push:
    branches:
      - tmp-hangyan-r-post-20260906

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Follow public report link
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout

          out=Path('output'); out.mkdir(exist_ok=True)
          source='https://www.hangyan.co/charts/3601111842144912396'
          result={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            context=browser.new_context(viewport={'width':1440,'height':1200},locale='zh-CN',accept_downloads=True,user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
            page=context.new_page()
            requests=[]; responses=[]; new_pages=[]
            page.on('request',lambda r: requests.append({'url':r.url,'method':r.method,'resource_type':r.resource_type}) if ('hangyan.co/r' in r.url or '/reports/' in r.url) else None)
            page.on('response',lambda r: responses.append({'url':r.url,'status':r.status,'headers':dict(r.headers)}) if ('hangyan.co/r' in r.url or '/reports/' in r.url) else None)
            context.on('page',lambda p2:new_pages.append(p2))
            page.goto('https://www.hangyan.co/',wait_until='domcontentloaded',timeout=120000)
            page.wait_for_timeout(1500)
            page.goto(source,wait_until='domcontentloaded',timeout=120000)
            page.wait_for_timeout(2500)
            link=page.locator('a[data-controller~="protected-link"]',has_text='全新GLP-1减重不减肌').first
            result['link_count']=link.count()
            result['before']=page.url
            if link.count():
              try:
                with page.expect_response(lambda response: response.url.rstrip('/').endswith('/r'),timeout=30000) as pending:
                  link.click(timeout=12000)
                response=pending.value
                result['r_response']={'url':response.url,'status':response.status,'headers':dict(response.headers)}
              except Exception as exc:
                result['expect_response_error']=repr(exc)
              page.wait_for_timeout(5000)
            result['after']=page.url
            result['title']=page.title()
            result['requests']=requests
            result['responses']=responses
            result['pages']=[{'url':p2.url,'title':p2.title()} for p2 in new_pages]
            result['frames']=[{'url':f.url,'name':f.name} for f in page.frames]
            result['body']=' '.join(page.locator('body').inner_text().split())[:20000]
            (out/'page.html').write_text(page.content(),encoding='utf-8')
            page.screenshot(path=str(out/'page.png'),full_page=True)
            browser.close()
          print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-public-navigation
          path: output/*
          retention-days: 1
          if-no-files-found: error
