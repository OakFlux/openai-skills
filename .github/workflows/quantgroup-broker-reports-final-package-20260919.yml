name: Build Quantgroup broker research reports final package 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-broker-reports-final-package-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validation and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf selenium

      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          PACKAGE = '量化派_02685_券商研究报告_3份_截至2026-09-19'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)
          work = Path('_work')
          work.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,text/html;q=0.8,*/*;q=0.7',
          })

          def is_pdf(data: bytes) -> bool:
              return data[:8].startswith(b'%PDF-')

          def save_response_as_pdf(r: requests.Response, dest: Path, min_bytes: int) -> str:
              data = r.content
              print('RESPONSE', r.status_code, r.url, r.headers.get('content-type'), r.headers.get('content-disposition'), len(data), flush=True)
              r.raise_for_status()
              if len(data) < min_bytes or not is_pdf(data):
                  raise RuntimeError(f'not a valid PDF: status={r.status_code}, final={r.url}, type={r.headers.get("content-type")}, bytes={len(data)}, head={data[:32]!r}')
              dest.write_bytes(data)
              return str(r.url)

          def request_pdf(url: str, dest: Path, min_bytes: int, referer: str | None = None) -> str:
              headers = {'Referer': referer} if referer else {}
              errors = []
              for attempt in range(1, 5):
                  try:
                      r = session.get(url, headers=headers, timeout=(25, 240), allow_redirects=True)
                      return save_response_as_pdf(r, dest, min_bytes)
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      time.sleep(attempt * 2)
              raise RuntimeError(f'failed to download PDF {url}: {errors}')

          def download_valuelist_report(dest: Path) -> str:
              page_url = 'https://www.valuelist.cn/871327.html'
              known_url = 'https://www.valuelist.cn/goto?down=ODcxMzI3LTAtZThhMTRkN2ViZg%3D%3D'
              errors = []

              # First use the public download URL directly.
              for url in (known_url, page_url):
                  try:
                      r = session.get(url, headers={'Referer': page_url}, timeout=(25, 240), allow_redirects=True)
                      print('VALUELIST_DIRECT', url, r.status_code, r.url, r.headers.get('content-type'), len(r.content), flush=True)
                      if is_pdf(r.content) and len(r.content) > 500_000:
                          dest.write_bytes(r.content)
                          return str(r.url)
                      if 'html' in (r.headers.get('content-type') or '').lower() or r.content.lstrip().startswith(b'<'):
                          soup = BeautifulSoup(r.text, 'lxml')
                          candidates = []
                          refresh = soup.find('meta', attrs={'http-equiv': re.compile('refresh', re.I)})
                          if refresh and refresh.get('content'):
                              m = re.search(r'url\s*=\s*(.+)', refresh['content'], re.I)
                              if m:
                                  candidates.append(urljoin(r.url, m.group(1).strip(' "\'')))
                          for a in soup.find_all('a'):
                              href = html.unescape(a.get('href') or '').replace('\\/', '/')
                              txt = a.get_text(' ', strip=True)
                              if href and ('.pdf' in href.lower() or any(k in (href + txt).lower() for k in ('download', '下载', 'goto?down=', 'file'))):
                                  candidates.append(urljoin(r.url, href))
                          for m in re.finditer(r'https?://[^\s"\'<>]+(?:\.pdf|/download/|goto\?down=)[^\s"\'<>]*', r.text, re.I):
                              candidates.append(html.unescape(m.group(0)).replace('\\/', '/'))
                          for candidate in dict.fromkeys(candidates):
                              try:
                                  rr = session.get(candidate, headers={'Referer': r.url}, timeout=(25, 240), allow_redirects=True)
                                  print('VALUELIST_CANDIDATE', candidate, rr.status_code, rr.url, rr.headers.get('content-type'), len(rr.content), flush=True)
                                  if is_pdf(rr.content) and len(rr.content) > 500_000:
                                      dest.write_bytes(rr.content)
                                      return str(rr.url)
                              except Exception as exc:
                                  errors.append(f'candidate {candidate}: {exc!r}')
                  except Exception as exc:
                      errors.append(f'direct {url}: {exc!r}')

              # Public-page browser fallback. This only clicks the site's free-download link;
              # it does not log in, solve paywalls, or access restricted endpoints.
              try:
                  from selenium import webdriver
                  from selenium.common.exceptions import TimeoutException
                  from selenium.webdriver.chrome.options import Options
                  from selenium.webdriver.common.by import By

                  dl = work / 'valuelist_downloads'
                  dl.mkdir(exist_ok=True)
                  opts = Options()
                  opts.add_argument('--headless=new')
                  opts.add_argument('--no-sandbox')
                  opts.add_argument('--disable-dev-shm-usage')
                  opts.add_argument('--disable-gpu')
                  opts.add_argument('--window-size=1440,1800')
                  opts.add_argument('--lang=zh-CN')
                  opts.page_load_strategy = 'eager'
                  opts.add_experimental_option('prefs', {
                      'download.default_directory': str(dl.resolve()),
                      'download.prompt_for_download': False,
                      'download.directory_upgrade': True,
                      'plugins.always_open_pdf_externally': True,
                  })
                  driver = webdriver.Chrome(options=opts)
                  driver.set_page_load_timeout(45)
                  driver.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior': 'allow', 'downloadPath': str(dl.resolve())})
                  try:
                      driver.get(page_url)
                  except TimeoutException:
                      pass
                  time.sleep(5)
                  hrefs = []
                  for el in driver.find_elements(By.XPATH, "//a[contains(@href,'goto?down=') or contains(normalize-space(.),'免费下载') or contains(normalize-space(.),'立即下载')]"):
                      try:
                          href = el.get_attribute('href')
                          if href:
                              hrefs.append(href)
                      except Exception:
                          pass
                  cookies = {c['name']: c['value'] for c in driver.get_cookies()}
                  ua = driver.execute_script('return navigator.userAgent')
                  driver.quit()

                  bs = requests.Session()
                  bs.trust_env = False
                  bs.headers.update({'User-Agent': ua, 'Referer': page_url, 'Accept': 'application/pdf,*/*;q=0.8'})
                  bs.cookies.update(cookies)
                  for href in dict.fromkeys(hrefs + [known_url]):
                      try:
                          rr = bs.get(href, timeout=(25, 240), allow_redirects=True)
                          print('VALUELIST_BROWSER_URL', href, rr.status_code, rr.url, rr.headers.get('content-type'), len(rr.content), flush=True)
                          if is_pdf(rr.content) and len(rr.content) > 500_000:
                              dest.write_bytes(rr.content)
                              return str(rr.url)
                      except Exception as exc:
                          errors.append(f'browser-url {href}: {exc!r}')

                  # Check for a browser-triggered download.
                  for _ in range(12):
                      completed = [p for p in dl.iterdir() if p.is_file() and not p.name.endswith(('.crdownload', '.tmp'))]
                      for p in completed:
                          data = p.read_bytes()
                          if is_pdf(data) and len(data) > 500_000:
                              shutil.copy2(p, dest)
                              return page_url + '#public-download'
                      time.sleep(1)
              except Exception as exc:
                  errors.append(f'browser fallback: {exc!r}')

              raise RuntimeError('ValueList public report download failed: ' + ' | '.join(errors))

          docs = [
              {
                  'filename': '01_盈立证券_量化派首次覆盖_AI战略发展赋能线上消费基本盘_2026-08-17.pdf',
                  'broker': '盈立证券（uSMART）',
                  'title': 'AI战略发展赋能线上消费基本盘，智能硬件打开增长新范式',
                  'date': '2026-08-17',
                  'type': '首次覆盖深度报告',
                  'download': 'valuelist',
                  'source_page': 'https://www.valuelist.cn/871327.html',
                  'min_bytes': 500_000,
                  'min_pages': 35,
                  'identity_terms': ['量化派', 'Quantgroup', '2685', '02685'],
                  'broker_terms': ['盈立', 'uSMART', '智能硬件', 'AI战略'],
              },
              {
                  'filename': '02_国投证券国际_量化派_IPO点评_2025-11-19.pdf',
                  'broker': '国投证券国际（国证国际）',
                  'title': '量化派（2685.HK）IPO点评',
                  'date': '2025-11-19',
                  'type': 'IPO研究报告',
                  'url': 'https://www.sdicsi.com.hk/backend/storage/app/media/ResearchReports/IPOReports/2685-20251119.pdf',
                  'source_page': 'https://www.sdicsi.com.hk/cn/research-report/tag/2685hk-ipo',
                  'min_bytes': 80_000,
                  'min_pages': 1,
                  'identity_terms': ['量化派', 'Quantgroup', '2685', '02685'],
                  'broker_terms': ['国投', '国证', 'SDIC', 'IPO'],
              },
              {
                  'filename': '03_华安证券香港_量化派_IPO报告_2025-11-20.pdf',
                  'broker': '华安证券（香港）',
                  'title': '量化派控股有限公司（02685.HK）IPO报告',
                  'date': '2025-11-20',
                  'type': 'IPO研究报告',
                  'url': 'https://api.hasc.com.hk/uploads/02685_HK_4281dc2d69.pdf',
                  'source_page': 'https://www.hasc.com.hk/',
                  'min_bytes': 100_000,
                  'min_pages': 5,
                  'identity_terms': ['量化派', 'Quantgroup', '2685', '02685'],
                  'broker_terms': ['华安证券', '華安證券', 'HASC', 'IPO'],
              },
          ]

          records = []
          seen_hashes = set()
          for doc in docs:
              dest = out / doc['filename']
              if doc.get('download') == 'valuelist':
                  final_url = download_valuelist_report(dest)
              else:
                  final_url = request_pdf(doc['url'], dest, doc['min_bytes'], doc['source_page'])

              data = dest.read_bytes()
              if len(data) < doc['min_bytes'] or not is_pdf(data):
                  raise RuntimeError(f'invalid downloaded PDF: {dest.name}')

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_indices = sorted(set(list(range(min(pages, 12))) + ([pages - 1] if pages else [])))
              text = ''
              for idx in sample_indices:
                  try:
                      text += '\n' + (reader.pages[idx].extract_text() or '')
                  except Exception:
                      pass
              low_text = text.lower()
              identity_ok = any(t.lower() in low_text for t in doc['identity_terms'])
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              broker_ok = any(t.lower() in low_text for t in doc['broker_terms'])
              if not broker_ok:
                  print('WARNING broker/title term not found in extracted sample:', dest.name, flush=True)

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')

              # Render first page to ensure it is readable by a standard PDF renderer.
              render_dir = work / ('render_' + str(len(records) + 1))
              render_dir.mkdir(exist_ok=True)
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(dest), str(render_dir / 'page1')],
                  capture_output=True,
                  text=True,
              )
              rendered = render_dir / 'page1.png'
              if render.returncode != 0 or not rendered.exists() or rendered.stat().st_size < 10_000:
                  raise RuntimeError(f'first-page render failed for {dest.name}: {render.stderr[-2000:]}')

              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)

              record = {
                  'filename': doc['filename'],
                  'broker': doc['broker'],
                  'title': doc['title'],
                  'publication_date': doc['date'],
                  'report_type': doc['type'],
                  'source_page': doc['source_page'],
                  'download_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'qpdf_check': 'passed',
                  'first_page_render': 'passed',
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '量化派控股有限公司（02685.HK）券商研究报告',
              '整理日期：2026-09-19',
              '',
              '本压缩包实际包含3份券商PDF原件。',
              '其中第1份为40页左右的首次覆盖深度报告；量化派上市时间较短，公开可完整下载的长篇覆盖报告较少，因此另收录2份券商上市阶段IPO研究报告作为补充。',
              '未收录仅有网页摘要、单页预览、要求登录后阅读或无法验证完整性的文件。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['broker']}：《{rec['title']}》",
                  f"   类型：{rec['report_type']}；发布日期：{rec['publication_date']}",
                  f"   文件：{rec['filename']}",
                  f"   页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源页面：{rec['source_page']}",
                  f"   最终下载地址：{rec['download_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.extend([
              '完整性核验：PDF文件头、公司身份、实际页数、qpdf结构检查、首屏渲染、重复哈希、ZIP CRC和SHA-256。',
              '说明：报告观点、评级和目标价均属于相应券商及作者，不代表整理者意见。',
          ])
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-02685-broker-reports-final-20260919
          path: 量化派_02685_券商研究报告_3份_截至2026-09-19.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
