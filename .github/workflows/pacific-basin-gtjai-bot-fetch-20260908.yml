name: Probe GTJAI Pacific Basin PDF access variants 20260908

on:
  push:
    paths:
      - '.github/workflows/pacific-basin-gtjai-bot-fetch-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Try browser and crawler access variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import hashlib, itertools, os
          from pathlib import Path
          from urllib.parse import quote, unquote
          import requests
          from pypdf import PdfReader

          out=Path('probe'); out.mkdir(exist_ok=True)
          paths=[
            '/UploadFiles/gtja_Report/2019/03/%E5%9B%BD%E6%B3%B0%E5%90%9B%E5%AE%89%E5%9B%BD%E9%99%85-%E5%A4%AA%E5%B9%B3%E6%B4%8B%E8%88%AA%E8%BF%90%20(2343%20HK)%20%E2%80%93%20%E6%8A%93%E4%BD%8F%E4%B8%8D%E7%A1%AE%E5%AE%9A%E6%80%A7%E4%B8%AD%E7%9A%84%E7%A1%AE%E5%AE%9A%E6%80%A7_20190307.pdf',
            '/UploadFiles/gtja_Report/2018/02/%E5%9B%BD%E6%B3%B0%E5%90%9B%E5%AE%89%E5%9B%BD%E9%99%85-%E5%A4%AA%E5%B9%B3%E6%B4%8B%E8%88%AA%E8%BF%90%20(2343%20HK)%20%E2%80%93%20%E8%A1%8C%E4%B8%9A%E5%A4%8D%E8%8B%8F%E4%B8%AD%E5%A4%84%E4%BA%8E%E7%BB%9D%E4%BD%B3%E4%BD%8D%E7%BD%AE_20180228.pdf',
          ]
          hosts=['www.gtjai.com','gtjai.com','www.gtjas.com.hk','www.gtjai.com.hk','research.gtjai.com']
          uas={
            'chrome':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0 Safari/537.36',
            'google':'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
            'bing':'Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)',
            'openai':'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; OAI-SearchBot/1.0; +https://openai.com/searchbot',
            'curl':'curl/8.5.0',
          }
          count=0
          for pi,path in enumerate(paths):
            for host in hosts:
              for scheme in ['https','http']:
                for uname,ua in uas.items():
                  count+=1
                  url=f'{scheme}://{host}{path}'
                  s=requests.Session(); s.trust_env=False
                  headers={
                    'User-Agent':ua,
                    'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                    'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
                    'Referer':f'{scheme}://{host}/',
                    'Cache-Control':'no-cache',
                  }
                  try:
                    r=s.get(url,headers=headers,timeout=(15,80),allow_redirects=True,verify=False)
                    sig=r.content[:12]
                    print('TRY',pi,host,scheme,uname,r.status_code,len(r.content),r.url,r.headers.get('content-type'),sig,flush=True)
                    ext='pdf' if r.content.startswith(b'%PDF-') else 'bin'
                    p=out/f'{pi}_{host.replace(".","_")}_{scheme}_{uname}.{ext}'
                    if r.content.startswith(b'%PDF-') or (r.status_code==200 and len(r.content)>200000): p.write_bytes(r.content)
                    if r.content.startswith(b'%PDF-'):
                      rd=PdfReader(str(p),strict=False)
                      print('SUCCESS',p,len(rd.pages),hashlib.sha256(r.content).hexdigest(),flush=True)
                  except Exception as e:
                    print('ERR',pi,host,scheme,uname,repr(e),flush=True)
          PY
      - name: Try curl path-as-is for canonical hosts
        shell: bash
        run: |
          set +e
          cd probe
          urls=(
          'https://www.gtjai.com/UploadFiles/gtja_Report/2019/03/%E5%9B%BD%E6%B3%B0%E5%90%9B%E5%AE%89%E5%9B%BD%E9%99%85-%E5%A4%AA%E5%B9%B3%E6%B4%8B%E8%88%AA%E8%BF%90%20(2343%20HK)%20%E2%80%93%20%E6%8A%93%E4%BD%8F%E4%B8%8D%E7%A1%AE%E5%AE%9A%E6%80%A7%E4%B8%AD%E7%9A%84%E7%A1%AE%E5%AE%9A%E6%80%A7_20190307.pdf'
          'https://www.gtjai.com/UploadFiles/gtja_Report/2018/02/%E5%9B%BD%E6%B3%B0%E5%90%9B%E5%AE%89%E5%9B%BD%E9%99%85-%E5%A4%AA%E5%B9%B3%E6%B4%8B%E8%88%AA%E8%BF%90%20(2343%20HK)%20%E2%80%93%20%E8%A1%8C%E4%B8%9A%E5%A4%8D%E8%8B%8F%E4%B8%AD%E5%A4%84%E4%BA%8E%E7%BB%9D%E4%BD%B3%E4%BD%8D%E7%BD%AE_20180228.pdf'
          )
          i=0
          for u in "${urls[@]}"; do
            for ua in \
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
              'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' \
              'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; OAI-SearchBot/1.0; +https://openai.com/searchbot'; do
              f="curl_${i}_$(echo "$ua" | sha256sum | cut -c1-8).bin"
              curl -k -L --http1.1 --path-as-is --compressed --max-time 90 -A "$ua" -e 'https://www.gtjai.com/' -D "${f}.headers" -o "$f" "$u"
              echo CURL "$i" "$f" "$(wc -c < "$f")" "$(head -c 8 "$f" | xxd -p)"
            done
            i=$((i+1))
          done
          exit 0
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: pacific-basin-gtjai-bot-fetch
          path: probe/
          retention-days: 7
          if-no-files-found: error
