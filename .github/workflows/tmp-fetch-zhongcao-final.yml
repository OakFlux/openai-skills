name: Temporary Fetch Zhongcao Fragrances Filings Final

on:
  push:
    branches:
      - tmp/fetch-zhongcao-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download, verify, and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote

          import requests

          ROOT = Path('zhongcao_package')
          PDF_DIR = ROOT / '01_年报_招股说明书_半年报'
          RENDER_DIR = ROOT / '_validation_renders'
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          RENDER_DIR.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  'document_type': 'annual_report',
                  'report_year': '2016',
                  'title': '中草香料：2016年年度报告',
                  'disclosure_date': '2017-04-24',
                  'bulletin_id': '3286711',
                  'filename': '01_中草香料_2016年年度报告.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2017/2017-4/2017-04-24/3286711.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2017',
                  'title': '中草香料：2017年年度报告',
                  'disclosure_date': '2018-04-19',
                  'bulletin_id': '4262070',
                  'filename': '02_中草香料_2017年年度报告.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2018/2018-4/2018-04-19/4262070.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2018',
                  'title': '中草香料：2018年年度报告',
                  'disclosure_date': '2019-04-19',
                  'bulletin_id': '5213794',
                  'filename': '03_中草香料_2018年年度报告.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2019/2019-4/2019-04-19/5213794.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2019',
                  'title': '中草香料：2019年度报告（最新重新披露版本）',
                  'disclosure_date': '2022-11-25',
                  'bulletin_id': '8689508',
                  'filename': '04_中草香料_2019年年度报告_最新重新披露版本.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2022/2022-11/2022-11-25/8689508.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2020',
                  'title': '中草香料：2020年年度报告（最新重新披露版本）',
                  'disclosure_date': '2022-11-25',
                  'bulletin_id': '8689546',
                  'filename': '05_中草香料_2020年年度报告_最新重新披露版本.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2022/2022-11/2022-11-25/8689546.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2021',
                  'title': '中草香料：2021年年度报告（最新重新披露版本）',
                  'disclosure_date': '2022-11-25',
                  'bulletin_id': '8689598',
                  'filename': '06_中草香料_2021年年度报告_最新重新披露版本.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2022/2022-11/2022-11-25/8689598.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2022',
                  'title': '中草香料：2022年年度报告',
                  'disclosure_date': '2023-03-10',
                  'bulletin_id': '8876496',
                  'filename': '07_中草香料_2022年年度报告.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2023/2023-3/2023-03-10/8876496.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2023',
                  'title': '中草香料：2023年年度报告',
                  'disclosure_date': '2024-03-15',
                  'bulletin_id': '9874208',
                  'filename': '08_中草香料_2023年年度报告.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2024/2024-3/2024-03-15/9874208.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2024',
                  'title': '中草香料：2024年年度报告',
                  'disclosure_date': '2025-04-18',
                  'bulletin_id': '10904091',
                  'filename': '09_中草香料_2024年年度报告.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSEBJ_STOCK/2025/2025-4/2025-04-18/10904091.PDF',
                  ],
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2025',
                  'title': '中草香料：2025年年度报告',
                  'disclosure_date': '2026-04-17',
                  'bulletin_id': '12110985',
                  'filename': '10_中草香料_2025年年度报告.pdf',
                  'min_pages': 60,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSEBJ_STOCK/2026/2026-4/2026-04-17/12110985.PDF',
                  ],
              },
              {
                  'document_type': 'prospectus',
                  'report_year': '2024',
                  'title': '向不特定合格投资者公开发行股票并在北京证券交易所上市招股说明书',
                  'disclosure_date': '2024-08-30',
                  'bulletin_id': '10461798',
                  'filename': '11_中草香料_北交所上市正式招股说明书.pdf',
                  'min_pages': 250,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSEBJ_STOCK/2024/2024-8/2024-08-30/10461798.PDF',
                  ],
              },
              {
                  'document_type': 'half_year_report',
                  'report_year': '2026',
                  'title': '中草香料：2026年半年度报告',
                  'disclosure_date': '2026-08-21',
                  'bulletin_id': '12518476',
                  'filename': '12_中草香料_2026年半年度报告.pdf',
                  'min_pages': 50,
                  'direct_urls': [
                      'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSEBJ_STOCK/2026/2026-8/2026-08-21/12518476.PDF',
                  ],
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })

          def decode_response(response):
              raw = response.content
              for encoding in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      continue
              return raw.decode('utf-8', errors='ignore')

          def candidate_urls(item):
              urls = []
              def add(url):
                  if not url:
                      return
                  url = html.unescape(unquote(url)).replace('\\/', '/')
                  if url.startswith('http://'):
                      https_url = 'https://' + url[len('http://'):]
                      for candidate in (https_url, url):
                          if candidate not in urls:
                              urls.append(candidate)
                  elif url not in urls:
                      urls.append(url)

              for url in item['direct_urls']:
                  add(url)

              stock_ids = ['920016', '870800']
              detail_templates = [
                  'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={id}&stockid={stock}',
                  'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?id={id}&stockid={stock}',
              ]
              for stock in stock_ids:
                  for template in detail_templates:
                      detail = template.format(id=item['bulletin_id'], stock=stock)
                      try:
                          response = session.get(detail, timeout=45)
                          response.raise_for_status()
                          text = html.unescape(decode_response(response)).replace('\\/', '/')
                          for match in re.findall(r'https?://[^\s\"\'<>]+?\.PDF', text, flags=re.I):
                              add(match)
                      except Exception as exc:
                          print(f'DETAIL WARNING {item["title"]}: {detail}: {exc}')
              return urls

          def looks_like_pdf(raw):
              return len(raw) > 100_000 and raw.lstrip().startswith(b'%PDF') and b'%%EOF' in raw[-32768:]

          def download(item, path):
              errors = []
              for url in candidate_urls(item):
                  for attempt in range(1, 4):
                      try:
                          print(f'GET {item["title"]} attempt={attempt}: {url}')
                          headers = {
                              'Referer': 'https://vip.stock.finance.sina.com.cn/',
                              'User-Agent': session.headers['User-Agent'],
                          }
                          with session.get(url, headers=headers, timeout=180, allow_redirects=True, stream=True) as response:
                              response.raise_for_status()
                              data = bytearray()
                              for chunk in response.iter_content(chunk_size=1024 * 512):
                                  if chunk:
                                      data.extend(chunk)
                              raw = bytes(data)
                              status = response.status_code
                              content_type = response.headers.get('content-type')
                          if not looks_like_pdf(raw):
                              raise RuntimeError(
                                  f'not complete PDF; status={status}, type={content_type}, '
                                  f'bytes={len(raw)}, head={raw[:20]!r}'
                              )
                          path.write_bytes(raw)
                          return url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f'Unable to download {item["title"]}:\n' + '\n'.join(errors))

          def pdf_page_count(path):
              result = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', result.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_text(path, first, last):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as handle:
                  output = Path(handle.name)
              try:
                  result = subprocess.run(
                      ['pdftotext', '-f', str(first), '-l', str(last), '-enc', 'UTF-8', str(path), str(output)],
                      capture_output=True,
                      text=True,
                  )
                  if result.returncode != 0 or not output.exists():
                      return ''
                  return output.read_text(encoding='utf-8', errors='ignore')
              finally:
                  output.unlink(missing_ok=True)

          def render_page(path, page, output_prefix):
              subprocess.run(
                  [
                      'pdftoppm', '-f', str(page), '-l', str(page), '-singlefile',
                      '-png', '-r', '72', str(path), str(output_prefix)
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              png = Path(str(output_prefix) + '.png')
              if not png.exists() or png.stat().st_size < 5_000:
                  raise RuntimeError(f'Render validation failed for {path}, page {page}')
              return png

          manifest = []
          sha_lines = []
          for index, item in enumerate(documents, start=1):
              path = PDF_DIR / item['filename']
              source_url = download(item, path)
              raw = path.read_bytes()
              pages = pdf_page_count(path)
              if pages < item['min_pages']:
                  raise RuntimeError(f'Unexpectedly short document: {item["title"]}, pages={pages}')

              text = extract_text(path, 1, min(40, pages))
              compact = re.sub(r'\s+', '', text)
              identity_ok = (
                  '中草香料' in compact
                  or '安徽中草香料股份有限公司' in compact
                  or '870800' in compact
                  or '920016' in compact
              )
              year_ok = item['report_year'] in compact
              if item['document_type'] == 'annual_report':
                  title_ok = '年度报告' in compact
              elif item['document_type'] == 'half_year_report':
                  title_ok = '半年度报告' in compact and '摘要' not in compact[:3000]
              else:
                  title_ok = '招股说明书' in compact and '申报稿' not in compact[:12000] and '招股意向书' not in compact[:12000]

              if not identity_ok or not year_ok or not title_ok:
                  raise RuntimeError(
                      f'Identity/title validation failed for {item["title"]}: '
                      f'identity={identity_ok}, year={year_ok}, title={title_ok}'
                  )

              render_page(path, 1, RENDER_DIR / f'{index:02d}_cover')
              if item['document_type'] == 'half_year_report':
                  render_page(path, max(1, pages // 2), RENDER_DIR / f'{index:02d}_middle')
                  render_page(path, pages, RENDER_DIR / f'{index:02d}_last')

              sha = hashlib.sha256(raw).hexdigest()
              rel = str(path.relative_to(ROOT))
              record = {
                  'document_type': item['document_type'],
                  'report_year': item['report_year'],
                  'title': item['title'],
                  'disclosure_date': item['disclosure_date'],
                  'bulletin_id': item['bulletin_id'],
                  'file': rel,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'source_url': source_url,
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': identity_ok,
                  'year_text_matched': year_ok,
                  'title_text_matched': title_ok,
                  'cover_render_valid': True,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {rel}')
              print(f'VERIFIED {item["title"]}: pages={pages}, bytes={len(raw)}')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          duplicate_notes = [
              '版本选择说明',
              '',
              '本包按“每个报告年度保留一个最终有效完整年报”的原则整理。',
              '2019、2020、2021年度报告在公开页面存在多次重复披露；本包采用2022年11月25日重新披露的最新版本。',
              '未重复装入较早的同年度上传件，以避免同一年度年报被计算多次。',
              '',
              '被排除的重复披露：',
              '- 2019年度报告：公告ID 6086488、7869647；保留公告ID 8689508。',
              '- 2020年度报告：公告ID 6881187、7869686；保留公告ID 8689546。',
              '- 2021年度报告：公告ID 7869459；保留公告ID 8689598。',
              '- 招股说明书申报稿：公告ID 8758161；保留正式版公告ID 10461798。',
              '- 2026年半年度报告摘要：公告ID 12518477；保留完整报告公告ID 12518476。',
          ]
          (ROOT / '版本选择说明.txt').write_text('\n'.join(duplicate_notes) + '\n', encoding='utf-8')

          readme = [
              '安徽中草香料股份有限公司公开披露文件包',
              '历史新三板证券代码：870800；现北交所证券代码：920016。',
              '',
              '内容范围：',
              '1. 公司挂牌以来全部独立年度报告：2016—2025年，共10份；',
              '2. 2024年8月30日正式披露的北交所上市招股说明书；',
              '3. 截至2026年8月30日最新完整半年度报告：2026年半年度报告。',
              '',
              '公司于2017年2月22日在全国股转系统挂牌，首份公开年度报告为2016年年度报告；',
              '于2024年9月13日在北京证券交易所上市。',
              '',
              '校验项目：PDF文件头与EOF、pdfinfo页数、公司名称、报告年度、标题、SHA-256、封面渲染及ZIP CRC。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f'- {record["title"]}',
                  f'  披露日期：{record["disclosure_date"]}',
                  f'  页数：{record["pages"]}',
                  f'  大小：{record["bytes"]} bytes',
                  f'  文件：{record["file"]}',
                  f'  SHA256：{record["sha256"]}',
                  f'  来源：{record["source_url"]}',
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          # Validation render images are operational intermediates, not user deliverables.
          for render in RENDER_DIR.glob('*.png'):
              render.unlink()
          RENDER_DIR.rmdir()

          zip_name = '中草香料_全部年报_招股说明书_2026年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: zhongcao-fragrances-filings-final
          path: 中草香料_全部年报_招股说明书_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
