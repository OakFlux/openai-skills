name: Build China Everbright official report package

on:
  push:
    branches: [tmp/cel-final-only-20260831-v10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests pypdf pymupdf
      - name: Download, verify and package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out/reports out/renders
          python - <<'PY'
          import csv, hashlib, json, re, warnings, zipfile
          from pathlib import Path
          import requests, pymupdf
          from pypdf import PdfReader
          from urllib3.exceptions import InsecureRequestWarning
          warnings.simplefilter('ignore', InsecureRequestWarning)

          out=Path('out'); report_dir=out/'reports'; render_dir=out/'renders'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          items=[
            ('年度报告','2020','中国光大控股_2020年年度报告.pdf',80,['https://www.everbright.com/sites/default/files/results-announcements/C_Annual%20Report_0.pdf','https://www.everbright.com/sites/default/files/results-announcements/C_Annual%20Report.pdf'],'中国光大控股投资者关系官网'),
            ('年度报告','2021','中国光大控股_2021年年度报告.pdf',80,['https://www.everbright.com/sites/default/files/results-announcements/C%20Annual%20Report.pdf'],'中国光大控股投资者关系官网'),
            ('年度报告','2022','中国光大控股_2022年年度报告.pdf',80,['https://www.everbright.com/sites/default/files/results-announcements/cw0165_Annual%20Report.pdf'],'中国光大控股投资者关系官网'),
            ('年度报告','2023','中国光大控股_2023年年度报告.pdf',80,['https://www.everbright.com/sites/default/files/results-announcements/CW001651-AR23.pdf'],'中国光大控股投资者关系官网'),
            ('年度报告','2024','中国光大控股_2024年年度报告.pdf',80,['https://www.everbright.com/sites/default/files/results-announcements/CW00165-AR24.pdf'],'中国光大控股投资者关系官网'),
            ('年度报告','2025','中国光大控股_2025年年度报告.pdf',80,['https://www.everbright.com/sites/default/files/results-announcements/C%20Annual%20Report_0.pdf'],'中国光大控股投资者关系官网'),
            ('中期业绩公告（最新季报口径）','截至2026-06-30止六个月','中国光大控股_2026年中期业绩公告.pdf',15,['https://www.hkexnews.hk/listedco/listconews/sehk/2026/0827/2026082701530_c.pdf','https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0827/2026082701530_c.pdf'],'香港交易所披露易'),
          ]

          def get_pdf(url):
            errs=[]
            for verify in (True,False):
              try:
                ref='https://www.everbright.com/' if 'everbright.com' in url else 'https://www.hkexnews.hk/'
                r=s.get(url,timeout=(20,240),verify=verify,allow_redirects=True,headers={'Referer':ref,'Accept':'application/pdf,*/*;q=0.8'})
                errs.append(f'{r.status_code}/{len(r.content)}/{r.headers.get("content-type")}')
                if r.status_code==200 and len(r.content)>50000 and r.content.lstrip().startswith(b'%PDF'): return r.content,r.url
              except Exception as e: errs.append(repr(e))
            raise RuntimeError(' | '.join(errs))

          def inspect(path,min_pages,seq,period):
            pr=PdfReader(str(path)); pages=len(pr.pages)
            if pages<min_pages: raise RuntimeError(f'{path.name}: only {pages} pages')
            for p in pr.pages: _=p.mediabox
            doc=pymupdf.open(str(path))
            if doc.is_encrypted or len(doc)!=pages: raise RuntimeError(f'{path.name}: PDF structure mismatch')
            idxs=list(range(min(12,pages)))+[pages//2,max(0,pages-2),pages-1]
            text='\n'.join(doc.load_page(i).get_text('text') for i in sorted(set(idxs)))
            for label,i in [('first',0),('middle',pages//2),('last',pages-1)]:
              pix=doc.load_page(i).get_pixmap(matrix=pymupdf.Matrix(.8,.8),alpha=False); pix.save(str(render_dir/f'{seq}_{period[:4]}_{label}.png'))
            doc.close(); return pages,text

          records=[]
          for seq,(kind,period,name,min_pages,urls,source) in enumerate(items,1):
            errors=[]; chosen=None
            for url in urls:
              try:
                data,final_url=get_pdf(url); tmp=report_dir/f'_tmp_{seq}.pdf'; tmp.write_bytes(data)
                pages,text=inspect(tmp,min_pages,seq,period); chosen=(data,final_url,tmp,pages,text); break
              except Exception as e:
                errors.append(f'{url}: {e}')
                try: tmp.unlink(missing_ok=True)
                except Exception: pass
            if chosen is None: raise RuntimeError(f'{name}: '+json.dumps(errors,ensure_ascii=False))
            data,final_url,tmp,pages,text=chosen; final=report_dir/name; tmp.rename(final)
            compact=re.sub(r'\s+','',text).lower()
            rec={'type':kind,'period':period,'filename':name,'pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source':source,'source_url':final_url,'text_check_company':any(x in compact for x in ['中國光大控股','中国光大控股','chinaeverbrightlimited']),'text_check_period':period[:4] in compact,'text_check_report_type':any(x in compact for x in (['年度報告','年度报告','annualreport'] if kind=='年度报告' else ['中期業績','中期业绩','interimresults']))}
            records.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False),flush=True)

          total=sum(r['pages'] for r in records)
          readme=['中国光大控股有限公司（00165.HK）2020-2025年报及最新定期财务披露','',f'文件数量：{len(records)}份完整PDF',f'合计页数：{total}页','','口径说明：香港上市公司通常不发布A股式第一季度或第三季度报告。','截至2026年8月31日，最新正式财务披露为2026年8月27日发布的《截至2026年6月30日止六个月之中期业绩公告》，本包将其作为“最新季报口径”纳入。','','文件清单：']
          readme += [f"{i}. {r['filename']}｜{r['pages']}页｜{r['source']}" for i,r in enumerate(records,1)]
          readme += ['','校验：PDF文件头、完整结构、双解析器页数、加密状态，以及每份文件首页、中间页和末页渲染。','压缩包已完成CRC完整性测试；逐文件SHA-256见 SHA256SUMS.txt。']
          (out/'README.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'报告清单.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          fields=list(records[0].keys())
          with (out/'来源及校验清单.csv').open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(records)
          (out/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['filename']}" for r in records)+'\n',encoding='utf-8')

          zhs=out/'中国光大控股_2020-2025年报及2026年中期业绩公告.zip'; ens=out/'china_everbright_reports_2020_2025_2026_interim.zip'
          for zpath in (zhs,ens):
            with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,allowZip64=True) as z:
              for p in sorted(report_dir.glob('*.pdf')): z.write(p,p.name)
              for n in ('README.txt','报告清单.json','来源及校验清单.csv','SHA256SUMS.txt'): z.write(out/n,n)
            with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              assert len([n for n in z.namelist() if n.lower().endswith('.pdf')])==7
          summary={'records':records,'total_pages':total,'zip_chinese':zhs.name,'zip_chinese_bytes':zhs.stat().st_size,'zip_chinese_sha256':hashlib.sha256(zhs.read_bytes()).hexdigest(),'zip_english':ens.name,'zip_english_bytes':ens.stat().st_size,'zip_english_sha256':hashlib.sha256(ens.read_bytes()).hexdigest()}
          (out/'package_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'); print('PACKAGE_SUMMARY',json.dumps(summary,ensure_ascii=False),flush=True)
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: china-everbright-official-reports-verified
          path: |
            out/中国光大控股_2020-2025年报及2026年中期业绩公告.zip
            out/china_everbright_reports_2020_2025_2026_interim.zip
            out/package_summary.json
            out/README.txt
            out/报告清单.json
            out/来源及校验清单.csv
            out/SHA256SUMS.txt
            out/renders/*.png
          if-no-files-found: error
          retention-days: 7