name: Probe Eastmoney Kaitian Gas historical announcements 20261005

on:
  push:
    paths:
      - '.github/workflows/kaitian-gas-eastmoney-announcement-probe-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query Eastmoney announcement API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          endpoints=[
            'https://np-anotice-stock.eastmoney.com/api/security/ann',
            'https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=100&page_index=1&ann_type=A&client_source=web&stock_list=831010',
            'https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=100&page_index=1&ann_type=A&client_source=web&stock_list=920010',
          ]
          for code in ['831010','920010']:
            for page in range(1,21):
              url='https://np-anotice-stock.eastmoney.com/api/security/ann'
              params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':code}
              try:
                r=s.get(url,params=params,timeout=60)
                print('\nQUERY',code,page,r.status_code,len(r.content),r.url,flush=True)
                print(r.text[:500],flush=True)
                r.raise_for_status(); payload=r.json()
                data=(payload.get('data') or {}) if isinstance(payload,dict) else {}
                rows=data.get('list') or data.get('data') or []
                print('COUNT',len(rows),'TOTAL',data.get('total_hits') or data.get('total') or data.get('total_count'),flush=True)
                if not rows: break
                for row in rows:
                  text=json.dumps(row,ensure_ascii=False)
                  title=str(row.get('title') or row.get('notice_title') or '')
                  date=str(row.get('display_time') or row.get('notice_date') or row.get('eiTime') or '')
                  if any(k in title for k in ['2014年年度报告','2015年年度报告','2016年年度报告','公开发行说明书']):
                    print('MATCH',text,flush=True)
                  elif date.startswith('2015-04') or date.startswith('2015/04'):
                    print('APR2015',text,flush=True)
                if len(rows)<100: break
              except Exception as e:
                print('ERROR',code,page,repr(e),flush=True); break
          PY
