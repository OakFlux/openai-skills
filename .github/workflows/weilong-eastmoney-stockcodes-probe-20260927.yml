name: Probe Eastmoney stockCodes for Weilong reports 20260927
on:
  push:
    paths:
      - '.github/workflows/weilong-eastmoney-stockcodes-probe-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query stockCodes variants and test PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs
          python - <<'PY'
          import json,re,requests,hashlib
          from pathlib import Path
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/javascript,*/*;q=0.01'})
          api='https://reportapi.eastmoney.com/report/list'
          variants=['09985','9985','09985.HK','HK09985','09985,9985']
          allrecs=[]; probes=[]
          for stock in variants:
            for qt in ['0','1']:
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2020-01-01','endTime':'2026-09-27','pageNo':'1','fields':'','qType':qt,'orgCode':'','rcode':'','stockCodes':stock}
              try:
                r=s.get(api,params=p,timeout=(20,120));r.raise_for_status()
                try:d=r.json()
                except Exception:
                  m=re.search(r'^[^(]*\((.*)\)\s*;?$',r.text.strip(),re.S);d=json.loads(m.group(1)) if m else {}
                data=d.get('data') or []
                probes.append({'stockCodes':stock,'qType':qt,'hits':d.get('hits'),'totalPage':d.get('TotalPage') or d.get('totalPage'),'count':len(data)})
                print('PROBE',stock,qt,len(data),d.get('hits'),flush=True)
                allrecs.extend(data)
              except Exception as e:probes.append({'stockCodes':stock,'qType':qt,'error':repr(e)})
          uniq={}
          for rec in allrecs:
            k=str(rec.get('infoCode') or rec.get('INFOCODE') or rec.get('id') or json.dumps(rec,ensure_ascii=False,sort_keys=True))
            uniq[k]=rec
          recs=list(uniq.values())
          for rec in recs:
            info=rec.get('infoCode') or rec.get('INFOCODE') or rec.get('id')
            if not info:continue
            for pre in ['H3','H2']:
              u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
              try:
                r=s.get(u,timeout=(20,180),allow_redirects=True)
                ok=r.status_code==200 and r.content.startswith(b'%PDF') and len(r.content)>50000
                probes.append({'infoCode':info,'pdf_url':u,'status':r.status_code,'bytes':len(r.content),'ok':ok})
                if ok:
                  fn=f'{info}_{pre}.pdf';Path('out/pdfs',fn).write_bytes(r.content);rec['_pdf_url']=u;rec['_pdf_file']=fn;break
              except Exception as e:probes.append({'infoCode':info,'pdf_url':u,'error':repr(e)})
            if rec.get('_pdf_file'):continue
          Path('out/records.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RECORDS',json.dumps(recs,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weilong-eastmoney-stockcodes-probe-20260927
          path: out
          retention-days: 7
          if-no-files-found: error
