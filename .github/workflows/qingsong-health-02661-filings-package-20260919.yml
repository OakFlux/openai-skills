name: Build Qingsong Health 02661 filings package 20260919

on:
  push:
    paths:
      - '.github/workflows/qingsong-health-02661-filings-package-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '轻松健康_02661_全部年报_最终招股章程_最新中期报告_中英文官方原件'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-HK,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          def variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(url, timeout=(30, 300), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          docs = [
              {
                  'filename': '01_轻松健康_02661_2025年年度报告_中文版_2026-04-17.pdf',
                  'title': '轻松健康2025年年度报告（中文版）',
                  'type': '年度报告',
                  'language': '中文',
                  'date': '2026-04-17',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041701568_c.pdf'),
                  'min_bytes': 5_000_000,
                  'min_pages': 250,
              },
              {
                  'filename': '02_Qingsong_Health_02661_2025_Annual_Report_English_2026-04-17.pdf',
                  'title': 'Qingsong Health 2025 Annual Report (English)',
                  'type': 'Annual Report',
                  'language': 'English',
                  'date': '2026-04-17',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041701567.pdf'),
                  'min_bytes': 5_000_000,
                  'min_pages': 250,
              },
              {
                  'filename': '03_轻松健康_02661_最终招股章程_中文版_2025-12-15.pdf',
                  'title': '轻松健康最终招股章程（中文版）',
                  'type': '最终招股章程',
                  'language': '中文',
                  'date': '2025-12-15',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1215/2025121500032_c.pdf'),
                  'min_bytes': 8_000_000,
                  'min_pages': 350,
              },
              {
                  'filename': '04_Qingsong_Health_02661_Final_Prospectus_English_2025-12-15.pdf',
                  'title': 'Qingsong Health Final Prospectus (English)',
                  'type': 'Final Prospectus',
                  'language': 'English',
                  'date': '2025-12-15',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1215/2025121500031.pdf'),
                  'min_bytes': 7_000_000,
                  'min_pages': 350,
              },
              {
                  'filename': '05_轻松健康_02661_2026年中期报告_中文版_2026-08-24.pdf',
                  'title': '轻松健康2026年中期报告（中文版）',
                  'type': '中期报告',
                  'language': '中文',
                  'date': '2026-08-24',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401506_c.pdf'),
                  'min_bytes': 3_000_000,
                  'min_pages': 80,
              },
              {
                  'filename': '06_Qingsong_Health_02661_2026_Interim_Report_English_2026-08-24.pdf',
                  'title': 'Qingsong Health 2026 Interim Report (English)',
                  'type': 'Interim Report',
                  'language': 'English',
                  'date': '2026-08-24',
                  'urls': variants('https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401505.pdf'),
                  'min_bytes': 3_000_000,
                  'min_pages': 80,
              },
          ]

          records: list[dict] = []
          seen_hashes: set[str] = set()
          identity_terms = ('2661', 'Qingsong Health', 'QINGSONG HEALTH', '輕鬆健康', '轻松健康')

          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(30, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              identity_ok = any(term.lower() in sample_text.lower() for term in identity_terms)
              if not identity_ok:
                  print('WARNING identity text not extractable; relying on official URL, size, page count and qpdf:', dest.name, flush=True)

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'document_type': doc['type'],
                  'language': doc['language'],
                  'disclosure_date': doc['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_text_verified': identity_ok,
                  'qpdf_return_code': check.returncode,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '轻松健康集团（02661.HK）全部年度报告、最终招股章程及最新阶段性财务报告',
              '整理日期：2026-09-19',
              '',
              '收录范围：',
              '1. 上市后截至整理日发布的全部完整年度报告：2025年年度报告；',
              '2. 2025年12月15日发布的正式最终招股章程；',
              '3. 截至整理日最新完整阶段性财务报告：2026年中期报告；',
              '4. 以上三类文件均收录港交所中文及英文官方原件，共6份PDF。',
              '',
              '范围说明：',
              '轻松健康于2025年12月23日在香港联交所上市，因此截至2026年9月19日，上市主体发布的完整年度报告只有2025年年度报告。',
              '香港上市公司通常按年度及半年度披露定期财务报告，并不按A股口径强制发布第一、第三季度报告；因此本包以2026年8月24日发布的2026年中期报告作为“最新季报/最新阶段性报告”。',
              '本包收录正式最终招股章程，不以申请版本、聆讯后资料集、业绩公告或中期业绩公告替代完整报告。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   类型：{rec['document_type']}；语言：{rec['language']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、文件大小、实际页数、公司身份文本（可提取时）、qpdf结构检查、去重、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 6:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: qingsong-health-02661-filings-final
          path: 轻松健康_02661_全部年报_最终招股章程_最新中期报告_中英文官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
