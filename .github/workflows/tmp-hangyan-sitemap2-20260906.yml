name: Inspect Hangyan public sitemaps
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests
      - name: Fetch robots and sitemaps
        run: |
          python - <<'PY'
          import re
          import requests
          from urllib.parse import urljoin

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          root='https://www.hangyan.co/'
          candidates=['robots.txt','sitemap.xml','sitemap_index.xml','sitemaps.xml','sitemap/index.xml']
          queue=[]
          for item in candidates:
              u=urljoin(root,item)
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  print('\nROOT',u,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'SIZE',len(r.content),'FINAL',r.url)
                  print(r.text[:3000])
                  if r.status_code==200:
                      queue.extend(re.findall(r'https?://[^<\s]+(?:xml|txt)',r.text,re.I))
              except Exception as e: print('ERR',u,repr(e))
          seen=set()
          for u in queue[:100]:
              u=u.replace('&amp;','&')
              if u in seen: continue
              seen.add(u)
              try:
                  r=s.get(u,timeout=120)
                  print('\nSITEMAP',u,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'SIZE',len(r.content))
                  low=r.text.lower()
                  for term in ['华润建材科技','华润水泥','01313','3399260180989347557']:
                      idx=r.text.find(term)
                      print('TERM',term,'POS',idx)
                      if idx>=0: print(r.text[max(0,idx-500):idx+1500])
                  print('URLS',len(re.findall(r'<loc>',r.text,re.I)))
              except Exception as e: print('ERR',u,repr(e))
          PY
