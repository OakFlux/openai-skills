name: Temporary Kaisheng Sina report source inspection

on:
  push:
    branches:
      - tmp-kaisheng-sina-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and inspect report page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          url='https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/720076140084/index.phtml'
          curl -L --fail --retry 2 --max-time 90 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' "$url" -o output/report.html
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('output/report.html').read_bytes().decode('gb18030','replace')
          Path('output/report-utf8.html').write_text(text,encoding='utf-8')
          print('HTML_CHARS',len(text),flush=True)
          for kw in ['pdf','download','attach','file','rptid','report','720076140084']:
              for m in list(re.finditer(kw,text,re.I))[:40]:
                  print('CTX',kw,text[max(0,m.start()-300):m.start()+900].replace('\n',' ')[:1200],flush=True)
          urls=[]
          for pat in [r'https?://[^\s"\'<>]+',r'[^\s"\'<>]+\.pdf[^\s"\'<>]*',r'[^\s"\'<>]*(?:download|attach|file)[^\s"\'<>]*']:
              for x in re.findall(pat,text,re.I):
                  x=x.strip('"\'()[]{};,')
                  if x not in urls: urls.append(x)
          for x in urls:
              if re.search(r'pdf|download|attach|file|report|rptid',x,re.I): print('URL',x[:1200],flush=True)
          PY
      - name: Upload page
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-sina-report-source
          path: output/*
          retention-days: 1
          if-no-files-found: error
