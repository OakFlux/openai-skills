name: Inspect Reguanli Songzhi page HTTP1 20261004

on:
  push:
    paths:
      - '.github/workflows/songzhi-reguanli-page-http1-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Fetch page and extract file links
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://www.reguanli.com/18386.html' 'http://www.reguanli.com/18386.html'; do
            echo "TRY $url"
            rm -f page.html
            curl --http1.1 -L --max-time 45 --retry 2 --retry-all-errors -A 'Mozilla/5.0' -o page.html "$url" || true
            if [ -s page.html ]; then break; fi
          done
          ls -l page.html || true
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urljoin
          p=Path('page.html')
          if not p.exists() or p.stat().st_size == 0:
              print('NO_PAGE'); raise SystemExit
          b=p.read_bytes(); print('SIZE',len(b),'HEAD',b[:100])
          text=b.decode('utf-8','replace')
          for line in text.splitlines():
              low=line.lower()
              if any(k in low for k in ['.pdf','iframe','embed','download','documenturl','pdfjs','wp-content','file_name','file-url']): print('LINE',line[:10000])
          vals=[]
          for pat in [r'(?:src|href|data|data-src|data-url)=["\']([^"\']+)',r'https?://[^\s"\'<>]+']:
              for m in re.findall(pat,text,re.I):
                  u=urljoin('https://www.reguanli.com/18386.html',m)
                  if u not in vals and any(k in u.lower() for k in ['pdf','upload','download','18386','wp-content']): vals.append(u)
          for u in vals: print('LINK',u)
          PY
