name: Recover archived Jinbin report links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jinbin-wayback-recovery-20261104.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import html,json,re,time
          from urllib.parse import quote,urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155'})
          targets=[
            'www.hibor.com.cn/docdetail_100915.html',
            'www.hibor.com.cn/docdetail.asp?id=100915',
            'www.hibor.com.cn/*100915*',
            'hibor.com.cn/*100915*',
          ]
          snapshots=[]
          for target in targets:
            u='https://web.archive.org/cdx/search/cdx?url='+quote(target,safe='*?=&')+'&output=json&fl=timestamp,original,statuscode,mimetype,digest,length&filter=statuscode:200&collapse=digest&limit=100&from=2007&to=2026'
            try:
              r=s.get(u,timeout=180);print('CDX',target,r.status_code,len(r.content),r.url,flush=True)
              print('CDX_HEAD',r.text[:1000],flush=True)
              if r.status_code==200:
                try:data=r.json()
                except Exception as e:print('CDX_JSON_ERR',repr(e));continue
                if len(data)>1:
                  for row in data[1:]:
                    rec=dict(zip(data[0],row));snapshots.append(rec)
            except Exception as e:print('CDX_ERR',target,repr(e),flush=True)
          print('SNAPSHOTS',json.dumps(snapshots,ensure_ascii=False,indent=2),flush=True)
          seen=set()
          chosen=[]
          for rec in snapshots:
            key=(rec.get('timestamp'),rec.get('original'))
            if key in seen:continue
            seen.add(key);chosen.append(rec)
          chosen=sorted(chosen,key=lambda x:x.get('timestamp',''))
          # inspect first, middle, last and snapshots around 2008-2014
          inspect=[]
          for rec in chosen:
            ts=rec.get('timestamp','')
            if ts.startswith(('2008','2009','2010','2011','2012','2013','2014')):inspect.append(rec)
          inspect=(inspect[:10]+inspect[-10:]) if inspect else chosen[:5]+chosen[-5:]
          for rec in inspect:
            ts=rec.get('timestamp');orig=rec.get('original')
            u=f'https://web.archive.org/web/{ts}id_/{orig}'
            try:
              r=s.get(u,timeout=180,allow_redirects=True);t=html.unescape(r.text)
              print('\nARCHIVE',ts,orig,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              print('HEAD',t[:1200],flush=True)
              urls=[]
              soup=BeautifulSoup(t,'html.parser')
              for tag in soup.find_all(True):
                for a in ('href','src','action','onclick','value','data-src','data-url'):
                  v=tag.get(a)
                  if not v:continue
                  vv=str(v)
                  if any(k in vv.lower() for k in ('100915','pdf','download','down','read','view','attach','file','docdetail')):
                    urls.append({'tag':tag.name,'attr':a,'value':urljoin(r.url,vv),'text':tag.get_text(' ',strip=True)[:160]})
              print('URLS',json.dumps(urls,ensure_ascii=False,indent=2),flush=True)
              for k in ('100915','download','downurl','readurl','pdf','agreeview','checkauthor','docdetail'):
                i=t.lower().find(k.lower())
                if i>=0:print('CTX',k,t[max(0,i-1200):i+4500],flush=True)
            except Exception as e:print('ARCHIVE_ERR',ts,orig,repr(e),flush=True)
          PY
