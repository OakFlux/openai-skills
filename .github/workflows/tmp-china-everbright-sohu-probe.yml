name: Temporary China Everbright Sohu research probe

on:
  push:
    branches:
      - tmp/china-everbright-sohu-probe-20260831

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Inspect article content and attachments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          out=Path('out'); out.mkdir()
          urls=[
            'https://www.sohu.com/a/932519215_122511150',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          result=[]
          for idx,u in enumerate(urls):
            r=s.get(u,timeout=60,allow_redirects=True);r.raise_for_status();r.encoding=r.apparent_encoding or r.encoding
            html=r.text;soup=BeautifulSoup(html,'lxml')
            selectors=['article','.article','.article-content','.article-content-wrap','.text','#mp-editor','.content-wrapper','.main-content']
            nodes=[]
            for sel in selectors:
              for node in soup.select(sel):
                nodes.append((len(node.get_text('\n',strip=True)),sel,node))
            nodes.sort(reverse=True,key=lambda x:x[0]); node=nodes[0][2] if nodes else (soup.body or soup); sel=nodes[0][1] if nodes else 'body'
            text=node.get_text('\n',strip=True)
            imgs=[];links=[];attrs=[]
            for tag in node.find_all(True):
              for attr in ['src','data-src','data-original','href','data','onclick']:
                v=tag.get(attr)
                if not v: continue
                full=urllib.parse.urljoin(r.url,str(v))
                if tag.name=='img' or any(k in str(v).lower() for k in ['pdf','download','file','doc','report','oss','cdn','weixin','mp.weixin']):
                  attrs.append({'tag':tag.name,'attr':attr,'value':str(v),'full':full,'text':tag.get_text(' ',strip=True)[:100],'all_attrs':dict(tag.attrs)})
                  if tag.name=='img' and full not in imgs: imgs.append(full)
                  if tag.name=='a' and full not in links: links.append(full)
            raw_urls=[x for x in sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',html))) if any(k in x.lower() for k in ['pdf','download','file','doc','report','oss','cdn','weixin','mp.weixin'])]
            item={'url':r.url,'status':r.status_code,'html_len':len(html),'selector':sel,'text_len':len(text),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'contains_target':'资负共振' in text or '中国光大控股' in text,'images':imgs,'links':links,'attrs':attrs[:1000],'raw_urls':raw_urls[:1000],'text':text}
            result.append(item)
            (out/f'article_{idx}.html').write_text(html,encoding='utf-8')
            (out/f'content_{idx}.html').write_text(str(node),encoding='utf-8')
            (out/f'text_{idx}.txt').write_text(text,encoding='utf-8')
            print('ARTICLE',json.dumps({k:item[k] for k in ['url','status','html_len','selector','text_len','title','contains_target','images','links','attrs','raw_urls']},ensure_ascii=False)[:50000],flush=True)
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: china-everbright-sohu-probe
          path: out/
          retention-days: 3
          if-no-files-found: error