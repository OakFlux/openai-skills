name: Probe Wuhan Fingu report sources

on:
  push:
    branches: [tmp-wuhan-fingu-broker-deep-reports-20261024]
    paths: ['.github/workflows/tmp-wuhan-fingu-source-probe-20261024.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe public report pages and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, json, re, requests
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          urls=[
            'https://www.9fzt.com/detail/sz_002194_10_650430884853.html',
            'https://www.sgpjbg.com/baogao/16990.html',
            'https://www.sgpjbg.com/bgdown/16990.html',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/625253469469/index.phtml',
          ]
          for u in urls:
            print('\n===== PAGE',u,'=====')
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
              text=r.text
              print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:1])
              for pat in [r'https?://[^\s"\'<>]+',r'["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']',r'["\']([^"\']*(?:download|down|viewer|view|file)[^"\']*)["\']']:
                vals=[]
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v)
                  if v not in vals: vals.append(v)
                for v in vals[:100]: print('CAND',urljoin(r.url,v))
              print('TEXT_HEAD',re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',text))[:1500])
            except Exception as e: print('ERR',repr(e))

          print('\n===== SGPJBG SEQUENTIAL IMAGES =====')
          base='https://file.sgpjbg.com/fileroot1/2020-8/10/bd630d01-ef74-4a45-81de-dac3aadb5901/bd630d01-ef74-4a45-81de-dac3aadb5901'
          for i in range(1,31):
            u=f'{base}{i}.gif'
            try:
              r=s.get(u,timeout=30)
              print(i,r.status_code,len(r.content),r.headers.get('content-type'),r.content[:6])
            except Exception as e: print(i,'ERR',repr(e))
          PY
