name: Haian broker reports direct v2
on:
  push:
    paths:
      - .triggers/haian-001233-broker-direct-v2-20261015.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Build package
        run: |
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          reports = [
            ('2025-11-10','华金证券','新股覆盖研究：海安集团','新股覆盖研究','AP202511091778242536'),
            ('2026-01-08','山西证券','巨胎龙头受益矿端景气度，深度绑定紫金矿业，持续开拓全球市场','公司专题研究报告','AP202601081816850426'),
            ('2026-09-03','中邮证券','Q2环比高增，巨胎主业盈利韧性凸显','公司跟踪研究报告','AP202609031828978638'),
          ]
          out=Path('final'); art=Path('artifact_out'); renders=Path('renders')
          for p in (out,art,renders): p.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/','Accept':'application/pdf,*/*'})
          manifest=[]; seen=set()
          def safe(x): return re.sub(r'[\\/:*?"<>|]+','_',x).strip(' ._')[:110]
          for i,(date,broker,title,kind,code) in enumerate(reports,1):
            path=out/f'{i:02d}_{date}_{broker}_{safe(title)}.pdf'
            used=''; errors=[]
            for url in [f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf']:
              for attempt in range(1,4):
                try:
                  r=s.get(url,timeout=(15,90),allow_redirects=True)
                  print('DOWNLOAD',broker,attempt,r.status_code,len(r.content),url,flush=True)
                  if r.status_code==200 and len(r.content)>90000 and r.content.startswith(b'%PDF-'):
                    path.write_bytes(r.content); used=url; break
                  errors.append(f'{url}: {r.status_code}/{len(r.content)}')
                except Exception as e:
                  errors.append(f'{url}: {e!r}')
                time.sleep(attempt)
              if used: break
            if not used: raise RuntimeError('download failed '+title+' | '+' | '.join(errors))
            q=subprocess.run(['qpdf','--check',str(path)],capture_output=True,text=True)
            if q.returncode not in (0,3): raise RuntimeError(q.stderr[-500:])
            reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
            text=[]
            for pi in range(min(10,pages)):
              try: text.append(reader.pages[pi].extract_text() or '')
              except Exception: pass
            sample='\n'.join(text)
            if not any(k in sample for k in ('海安集团','海安橡胶集团','001233')): raise RuntimeError('company check failed '+title)
            if not any(k in sample for k in ('证券研究报告','公司研究','研究报告','投资评级','新股研究')): raise RuntimeError('research check failed '+title)
            prefix=renders/f'cover_{i}'
            rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','80',str(path),str(prefix)],capture_output=True,text=True)
            png=Path(str(prefix)+'.png')
            if rr.returncode or not png.exists() or png.stat().st_size<5000: raise RuntimeError('render failed '+title)
            data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in seen: raise RuntimeError('duplicate')
            seen.add(sha)
            item={'filename':path.name,'date':date,'broker':broker,'title':title,'classification':kind,'pages':pages,'bytes':len(data),'sha256':sha,'source_url':used}
            manifest.append(item); print('VERIFIED',json.dumps(item,ensure_ascii=False),flush=True)
          lines=['海安集团（001233.SZ）券商深度及公司研究报告精选','整理日期：2026-10-15','',f'共收录{len(manifest)}份公开、完整的券商研究PDF。','华金证券为新股覆盖研究；山西证券和中邮证券报告补充上市后的业务逻辑与最新经营变化。','未使用网页摘要、预览页或残缺文件。','','文件清单：']
          for i,x in enumerate(manifest,1):
            lines += [f'{i}. {x["filename"]}',f'   券商：{x["broker"]}',f'   类型：{x["classification"]}',f'   标题：{x["title"]}',f'   日期：{x["date"]}；页数：{x["pages"]}；大小：{x["bytes"]} bytes',f'   公开PDF：{x["source_url"]}',f'   SHA-256：{x["sha256"]}','']
          lines.append('完整性检查：PDF文件头、公司名称/证券代码、研究报告属性、页数、qpdf结构、首页渲染、重复文件及ZIP CRC均已检查。')
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')
          zpath=art/'海安集团_001233_券商深度及公司研究报告_3份.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(out.iterdir()): z.write(p,p.name)
          with zipfile.ZipFile(zpath) as z:
            if z.testzip() or sum(n.endswith('.pdf') for n in z.namelist())!=3: raise RuntimeError('zip validation failed')
          print('FINAL_ZIP',zpath.name,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest(),flush=True)
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False),flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: haian-001233-broker-direct-v2
          path: artifact_out/*.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
