# trigger 2
name: Search Hibor archives for Xinbang Intelligent reports

on:
  push:
    paths:
      - '.github/workflows/xinbang-301112-hibor-archive-search-20261014.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Search Hibor archives
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          out=Path('out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          rows=[]
          urls=[]
          for host in ['https://p.hibor.com.cn','https://www.hibor.com.cn','https://20www.hibor.com.cn']:
            for kind in ['archiver_houtai','archiver']:
              for ym in ['202204','202205','202206','202207','202208']:
                urls.append(f'{host}/{kind}/{ym}.html')
          for url in urls:
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True)
              print('GET',r.status_code,len(r.content),url,'FINAL',r.url,flush=True)
              if r.status_code!=200 or len(r.content)<1000: continue
              enc=r.apparent_encoding or 'utf-8'
              text=r.content.decode(enc,errors='replace')
              if '信邦智能' in text or '301112' in text:
                (out/(re.sub(r'[^A-Za-z0-9]+','_',url)+'.html')).write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'lxml')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urllib.parse.urljoin(r.url,a['href'])
                if '信邦智能' in label or '301112' in label or ('信邦' in label and any(x in label for x in ['华金','申万','证券','新股'])):
                  row={'source':url,'title':label,'href':href}
                  rows.append(row); print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
            except Exception as e:
              print('ERR',url,repr(e),flush=True)
          uniq={}
          for x in rows: uniq[(x['title'],x['href'])]=x
          rows=list(uniq.values())
          (out/'matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-hibor-archive-search
          path: out
          retention-days: 7
