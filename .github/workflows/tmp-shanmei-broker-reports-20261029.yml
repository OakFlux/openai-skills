name: Build Shanmei International broker deep reports

on:
  push:
    branches:
      - tmp-shanmei-broker-reports-20261029

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='山煤国际_600546_券商深度报告_3份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/shanmei_broker_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('山煤国际_600546_券商深度报告_3份')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          reports = [
              {
                  'order': 1,
                  'broker': '开源证券',
                  'date': '2026-05-20',
                  'title': '公司深度报告：吨利优异高分红延续，周期上行业绩弹性可期',
                  'filename': '01_开源证券_吨利优异高分红延续周期上行业绩弹性可期_2026-05-20.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202605201822488464_1.pdf',
                  'index': 'https://data.eastmoney.com/report/info/AP202605201822488464.html',
                  'min_pages': 18,
              },
              {
                  'order': 2,
                  'broker': '大同证券',
                  'date': '2025-03-13',
                  'title': '聚焦主业精细化管理，提升效率成本优势突出',
                  'filename': '02_大同证券_聚焦主业精细化管理提升效率成本优势突出_2025-03-13.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202503131644343875_1.pdf',
                  'index': 'https://data.eastmoney.com/report/info/AP202503131644343875.html',
                  'min_pages': 18,
              },
              {
                  'order': 3,
                  'broker': '国盛证券',
                  'date': '2019-08-08',
                  'title': '山煤国际首次覆盖深度报告',
                  'filename': '03_国盛证券_山煤国际首次覆盖深度报告_2019-08-08.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201908081342663024_1.PDF',
                  'index': 'https://pdf.dfcfw.com/pdf/H3_AP201908081342663024_1.PDF',
                  'min_pages': 15,
              },
          ]

          def inspect_pdf(path: Path, report: dict) -> tuple[int, str]:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'page count too small: {pages}')
              indexes = list(range(min(20, pages)))
              if pages > 20:
                  indexes.append(pages - 1)
              text = ''
              for index in dict.fromkeys(indexes):
                  try:
                      text += '\n' + (reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              if '山煤国际' not in compact and '山煤国际能源集团股份有限公司' not in compact:
                  raise RuntimeError('company name mismatch')
              broker_key = report['broker'].replace('证券', '')
              if broker_key not in compact:
                  raise RuntimeError('broker name mismatch')
              return pages, text

          records = []
          for report in reports:
              response = None
              last = None
              for attempt in range(8):
                  try:
                      candidate = session.get(
                          report['url'],
                          headers={'Referer': report['index']},
                          timeout=(30, 360),
                          allow_redirects=True,
                      )
                      if candidate.status_code == 200 and candidate.content.startswith(b'%PDF-') and len(candidate.content) > 150_000:
                          response = candidate
                          break
                      last = RuntimeError(
                          f'HTTP={candidate.status_code}, bytes={len(candidate.content)}, type={candidate.headers.get("content-type")}'
                      )
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 + attempt, 8))
              if response is None:
                  raise RuntimeError(f'Could not download {report["title"]}: {last!r}')

              path = out / report['filename']
              path.write_bytes(response.content)
              pages, sample_text = inspect_pdf(path, report)
              sha = hashlib.sha256(response.content).hexdigest()
              first_lines = [line.strip() for line in sample_text.splitlines() if line.strip()][:20]
              records.append({
                  **report,
                  'source': response.url,
                  'pages': pages,
                  'bytes': len(response.content),
                  'sha256': sha,
                  'first_page_sample': first_lines,
              })
              print('DOWNLOADED', report['broker'], report['title'], 'pages=', pages, 'bytes=', len(response.content), 'sha256=', sha)
              print('TEXT_SAMPLE', ' | '.join(first_lines[:10]))

          lines = [
              '山煤国际（600546）券商深度报告资料包',
              '整理日期：2026-10-29',
              '',
              '收录原则：仅收录公开渠道可直接下载、经PDF结构、页数、公司名称和券商名称核验的券商原始完整PDF。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   发布日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   研报索引：{item['index']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f'合计：3份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 15
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '山煤国际|山煤国际能源集团股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/shanmei_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/shanmei_broker_test.zip "$PACKAGE"
          unzip -t /tmp/shanmei_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/shanmei_broker_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f /tmp/shanmei_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Shanmei-600546-broker-deep-reports-3
          path: 山煤国际_600546_券商深度报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
