name: Discover Yongtai Technology 002326 broker reports 20261015

on:
  push:
    paths:
      - '.github/workflows/yongtai-002326-broker-report-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney broker report index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          code='002326'
          url='https://reportapi.eastmoney.com/report/list'
          params={
            'industryCode':'*','pageSize':'5000','industry':'*','rating':'*','ratingChange':'*',
            'beginTime':'2000-01-01','endTime':'2099-12-31','pageNo':'1','fields':'','qType':'0',
            'orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
          }
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*;q=0.01',
            'Accept-Language':'zh-CN,zh;q=0.9'
          })
          data=None; last=None
          for i in range(8):
            try:
              r=s.get(url,params=params,timeout=(20,120))
              last={'status':r.status_code,'bytes':len(r.content),'text':r.text[:200]}
              if r.status_code==200:
                data=r.json(); break
            except Exception as e:
              last=repr(e)
            time.sleep(1+i)
          if data is None:
            raise RuntimeError(last)
          rows=[]
          for x in data.get('data') or []:
            rows.append({
              'infoCode':x.get('infoCode'),
              'date':(x.get('publishDate') or '')[:10],
              'org':x.get('orgSName'),
              'analyst':x.get('researcher') or x.get('author'),
              'rating':x.get('emRatingName'),
              'title':x.get('title'),
              'stockName':x.get('stockName'),
              'stockCode':x.get('stockCode'),
              'industry':x.get('indvInduName'),
              'pdf':f"https://pdf.dfcfw.com/pdf/H3_{x.get('infoCode')}_1.pdf" if x.get('infoCode') else None
            })
          rows.sort(key=lambda x:x['date'],reverse=True)
          Path('yongtai_broker_reports_index.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('COUNT',len(rows),'TotalPage',data.get('TotalPage'),'currentYear',data.get('currentYear'))
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

      - name: Upload discovery index
        uses: actions/upload-artifact@v4
        with:
          name: yongtai-002326-broker-report-index-20261015
          path: yongtai_broker_reports_index.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
