name: Inspect FxBaogao download implementation

on:
  push:
    paths:
      - '.github/workflows/inspect-fxbaogao-download-js-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch viewer pages and JavaScript chunks
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36'})
          pages=['https://www.fxbaogao.com/view?id=4665308','https://www.fxbaogao.com/view?id=4736599']
          for page in pages:
              r=s.get(page,timeout=60); print('\nPAGE',page,r.status_code,len(r.content),r.url,flush=True)
              text=r.text
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)
              print('SCRIPTS',scripts,flush=True)
              for src in scripts:
                  url=urljoin(r.url,src)
                  sr=s.get(url,timeout=60)
                  print('SCRIPT',url,sr.status_code,len(sr.content),flush=True)
                  js=sr.text
                  terms=['下载报告','download','fileId','pageCount','report-image','/api/','fetch(','axios','window.open','location.href','login','vip','pay']
                  hit=False
                  for term in terms:
                      positions=[m.start() for m in re.finditer(re.escape(term),js,re.I)]
                      if positions:
                          hit=True
                          print('TERM',term,'COUNT',len(positions),flush=True)
                          for pos in positions[:20]:
                              print('CTX',js[max(0,pos-1200):pos+3500],flush=True)
                  if hit:
                      urls=sorted(set(re.findall(r'https?://[^\s"\'<>]+',js)))
                      for u in urls:
                          if any(k in u.lower() for k in ('api','download','report','pdf','file')):
                              print('JS_URL',u,flush=True)
          PY
