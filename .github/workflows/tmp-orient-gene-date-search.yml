name: Temporary Resolve Orient Gene Deep Report IDs

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-date-search.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search Eastmoney report date windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          from pathlib import Path

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'})
          windows=[
            ('2020-01-10','2020-01-16'),
            ('2020-11-06','2020-11-13'),
            ('2021-08-02','2021-08-10'),
            ('2022-03-10','2022-03-18'),
          ]
          needles=['东方生物','东方基因','POCT龙头呼之欲出','新生代国际化IVD龙头','深耕POCT国际市场','深耕国际市场的POCT全产业链企业']
          matches=[];diagnostics=[]
          for begin,end in windows:
            for page in range(1,50):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','author':'','code':'','rcode':'','_':str(int(time.time()*1000))}
              r=session.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60);r.raise_for_status();payload=r.json();rows=payload.get('data') or []
              diagnostics.append({'begin':begin,'end':end,'page':page,'rows':len(rows),'hits':payload.get('hits'),'size':payload.get('size')})
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if any(n in blob for n in needles):
                  matches.append(row)
              if len(rows)<100:break
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_date_matches.json').write_text(json.dumps({'matches':matches,'diagnostics':diagnostics},ensure_ascii=False,indent=2),encoding='utf-8')
          slim=[]
          for x in matches:
            slim.append({k:x.get(k) for k in ['infoCode','publishDate','orgSName','orgName','title','researcher','ratingName','attachPages','attachSize','encodeUrl','stockName','stockCode'] if k in x})
          print('MATCHES='+json.dumps(slim,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-date-matches
          path: out/orient_gene_date_matches.json
          if-no-files-found: error
          retention-days: 3
