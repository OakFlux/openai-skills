name: Paginate global report API for Xinjiang Joinworld deep reports

on:
  push:
    paths:
      - '.github/workflows/xinjiang-joinworld-global-report-api-probe-v2-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Query all pages in narrow date windows
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          from __future__ import annotations
          import json
          from io import BytesIO
          import requests
          from pypdf import PdfReader

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})
          windows=[('2022-08-18','2022-08-27'),('2023-07-27','2023-08-06'),('2025-09-23','2025-10-03')]
          needles=['全国领先的高纯铝龙头','被低估的电极箔一体化龙头','铝电子材料一体化完备','多业务领跑行业','新疆众和']
          api='https://reportapi.eastmoney.com/report/list'
          found={}
          for begin,end in windows:
              for page in range(1,101):
                  params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                  r=s.get(api,params=params,timeout=(25,180)); r.raise_for_status()
                  batch=r.json().get('data') or []
                  print('PAGE',begin,end,page,len(batch),flush=True)
                  for row in batch:
                      blob=json.dumps(row,ensure_ascii=False)
                      if any(n in blob for n in needles):
                          key=str(row.get('infoCode') or row.get('id') or blob)
                          found[key]=row
                          print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
                  if len(batch)<100:
                      break
          print('FOUND_COUNT',len(found),flush=True)
          for info,row in found.items():
              print('SUMMARY',json.dumps({k:row.get(k) for k in ('infoCode','title','orgSName','publishDate','attachPages','author','emRatingName','stockName','stockCode')},ensure_ascii=False),flush=True)
              if not info.startswith('AP'): continue
              for prefix in ('H3','H2','H1','H4'):
                  url=f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  try:
                      rr=s.get(url,timeout=(30,240),headers={'Accept':'application/pdf,*/*;q=0.8'})
                      valid=rr.status_code==200 and rr.content.startswith(b'%PDF') and len(rr.content)>50000
                      pages=len(PdfReader(BytesIO(rr.content),strict=False).pages) if valid else None
                      print('PDF',info,prefix,rr.status_code,len(rr.content),valid,pages,url,flush=True)
                      if valid: break
                  except Exception as exc:
                      print('PDF_ERROR',info,prefix,repr(exc),flush=True)
          PY
