name: Temporary 9fzt report pagination probe

on:
  push:
    branches:
      - chatgpt-temp-greentown-reports-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch 9fzt frontend code and probe report list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import time
          import urllib.parse
          import requests

          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          base='https://gmg.9fzt.com'
          urls=[
            base+'/_next/static/chunks/165-ef53ec44034acb35.js',
            base+'/_next/static/chunks/pages/report/%5Bmarket%5D/%5Bsymbol%5D/%5Bid%5D-142396bae566cc0b.js',
            base+'/_next/static/chunks/pages/report/%5Bmarket%5D/%5Bsymbol%5D/index.html-0c40c865cf450d5c.js',
            base+'/_next/static/chunks/621-fec19ff4371b76dd.js',
            base+'/_next/static/chunks/182-14cc603575c311f0.js',
            base+'/_next/static/chunks/446-33e31a30861c535a.js',
          ]
          texts=[]
          for u in urls:
            try:
              r=S.get(u,timeout=30)
              print('FETCH',u,r.status_code,len(r.content),r.headers.get('content-type'))
              if r.status_code==200:
                t=r.text;texts.append((u,t))
                for key in ['getCompanyReportList','/api/1/stock/a/report/list','apiHqDomain','report/list','pageNo','pageNum','pageSize']:
                  pos=t.find(key)
                  if pos>=0:print('SNIP',u,key,t[max(0,pos-2500):pos+5000])
            except Exception as e:print('FETCHERR',u,repr(e))

          # Extract configuration domains from all fetched source.
          alltext='\n'.join(t for _,t in texts)
          for pattern in [r'apiHqDomain.{0,500}',r'domain.{0,200}apiServer.{0,200}',r'https?://[^"\']+']:
            print('PATTERN',pattern)
            for m in re.findall(pattern,alltext,re.I)[:100]:print(m)

          # Try likely API hosts and unsigned query forms.
          hosts=[
            'https://news.9fzt.com','https://api.9fzt.com','https://hq-api.9fzt.com',
            'https://stock.9fzt.com','https://gmg.9fzt.com','https://gateway.9fzt.com',
            'https://news-api.9fzt.com','https://hq.9fzt.com','https://api-hq.9fzt.com'
          ]
          path='/api/1/stock/a/report/list'
          querysets=[]
          for page in [1,2,5,10,13]:
            querysets += [
              {'market':'HKSE','symbol':'03900','page':page,'size':20},
              {'market':'HKSE','symbol':'03900','pageNo':page,'pageSize':20},
              {'market':'HKSE','code':'03900','page':page,'pageSize':20},
              {'market':'HK','symbol':'03900','pageNum':page,'pageSize':20},
              {'code':'03900','market':'116','pageNum':page,'pageSize':20},
            ]
          for h in hosts:
            for q in querysets:
              try:
                r=S.get(h+path,params=q,timeout=8)
                c=r.text[:3000]
                if r.status_code!=404 or '03900' in c or '绿城' in c or 'signature' in c.lower():
                  print('API',json.dumps({'host':h,'q':q,'status':r.status_code,'final':r.url,'ctype':r.headers.get('content-type'),'len':len(r.content),'text':c},ensure_ascii=False))
              except Exception as e:
                pass

          # Probe SSR pagination query variants; inspect NEXT_DATA titles.
          for key in ['page','pageNo','pageNum','p','current']:
            for val in [2,5,10,13]:
              u=f'{base}/report/HKSE/03900/index.html?{key}={val}'
              try:
                r=S.get(u,timeout=20)
                m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',r.text,re.S)
                summary={'url':u,'status':r.status_code,'len':len(r.content)}
                if m:
                  d=json.loads(m.group(1));lst=d.get('props',{}).get('pageProps',{}).get('list',[])
                  summary['items']=[{'id':x.get('id'),'time':x.get('time'),'title':x.get('title')} for x in lst[:3]]
                  summary['last']=[{'id':x.get('id'),'time':x.get('time'),'title':x.get('title')} for x in lst[-3:]]
                print('SSR',json.dumps(summary,ensure_ascii=False))
              except Exception as e:print('SSRERR',u,repr(e))
          PY
