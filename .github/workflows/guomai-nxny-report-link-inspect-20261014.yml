name: Inspect Guomai broker report detail links 20261014

on:
  push:
    paths:
      - '.triggers/guomai-nxny-report-link-inspect-20261014.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect detail pages and candidate assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          ids=['6085251','5873844','5493657']
          out=Path('inspect'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,application/pdf,*/*','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.nxny.com/'})
          records=[]
          candidate_urls=set()
          for rid in ids:
              url=f'https://www.nxny.com/report/view_{rid}.html'
              try:
                  r=s.get(url,timeout=(20,120),allow_redirects=True)
                  print('PAGE',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                  raw=r.content
                  text=''
                  for enc in ('gb18030','utf-8','gbk'):
                      try:
                          text=raw.decode(enc); break
                      except Exception: pass
                  if not text: text=raw.decode('latin1','replace')
                  (out/f'page_{rid}.html').write_text(text,encoding='utf-8')
                  soup=BeautifulSoup(text,'lxml')
                  title=soup.title.get_text(' ',strip=True) if soup.title else ''
                  links=[]
                  for tag in soup.find_all(True):
                      for attr in ('href','src','data-url','data-src','onclick','action'):
                          val=tag.get(attr)
                          if not val: continue
                          sv=str(val)
                          if attr in ('href','src','data-url','data-src','action'):
                              sv=urllib.parse.urljoin(r.url,sv)
                          if any(k in sv.lower() for k in ('pdf','download','attach','file','report','doc','view_')) or '下载' in sv:
                              item={'tag':tag.name,'attr':attr,'value':sv,'text':' '.join(tag.get_text(' ',strip=True).split())[:300]}
                              links.append(item)
                              if sv.startswith('http'): candidate_urls.add(sv)
                  raw_urls=set(re.findall(r'https?://[^\s"\'<>]+',text))
                  for u in raw_urls:
                      u=u.replace('\\/','/').rstrip(');,]}')
                      if any(k in u.lower() for k in ('pdf','download','attach','file','report','doc')):
                          candidate_urls.add(u)
                  snippets=[]
                  for pat in ('pdf','download','下载','报告全文','附件','file','report','url','href'):
                      for m in list(re.finditer(pat,text,re.I))[:100]:
                          snippets.append(text[max(0,m.start()-250):min(len(text),m.end()+600)])
                  rec={'id':rid,'url':r.url,'title':title,'links':links,'snippets':snippets[:300],'visible_text':' '.join(soup.get_text(' ',strip=True).split())[:12000]}
                  records.append(rec)
                  print('TITLE',rid,title,flush=True)
                  print('LINKS',rid,json.dumps(links[:200],ensure_ascii=False),flush=True)
                  print('SNIPS',rid,json.dumps(snippets[:100],ensure_ascii=False),flush=True)
              except Exception as e:
                  print('PAGE_ERR',rid,repr(e),flush=True)
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'candidate_urls.txt').write_text('\n'.join(sorted(candidate_urls)),encoding='utf-8')

          # Probe discovered candidates with HEAD/GET prefix only.
          probes=[]
          for i,u in enumerate(sorted(candidate_urls),1):
              if len(u)>1000 or any(x in u for x in ('${','javascript:')): continue
              try:
                  r=s.get(u,timeout=(15,90),allow_redirects=True)
                  rec={'url':u,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'final_url':r.url,'prefix':r.content[:16].hex()}
                  probes.append(rec)
                  print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                      (out/f'found_{i:03d}.pdf').write_bytes(r.content)
              except Exception as e:
                  print('PROBE_ERR',u,repr(e),flush=True)
          (out/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: guomai-broker-report-link-inspection
          path: inspect
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
