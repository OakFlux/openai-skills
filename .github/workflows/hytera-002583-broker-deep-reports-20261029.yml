name: Build Hytera 002583 broker deep reports 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hytera-002583-broker-deep-reports-20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE='002583'
          SHORT='海能达'
          FULL='海能达通信股份有限公司'
          PACKAGE='海能达_002583_券商深度报告_3份'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'招商证券','date':'2023-12-25',
              'title':'专用通信龙头战略变革成效显著，发展已进入“右侧”',
              'classification':'公司深度报告/首次覆盖','rating':'增持（首次）',
              'analysts':'梁程加、李哲瀚',
              'url':'https://www.hytera.com/iwov-resources/hytera/12_investors/communication_report/zhaoshang_20231226.pdf',
              'source_page':'https://www.hytera.com/cn/investor-relations/research.html',
              'min_pages':35,'broker_aliases':['招商证券','CMS']
            },
            {
              'broker':'国元证券','date':'2023-11-28',
              'title':'公司首次覆盖报告：“2+3+1”战略成效初现，多业务协同重回增长正轨',
              'classification':'公司首次覆盖报告','rating':'增持（首次）',
              'analysts':'杨为敩',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202311281612479695_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202311281612479695.html',
              'min_pages':20,'broker_aliases':['国元证券','GUOYUAN SECURITIES']
            },
            {
              'broker':'天风证券','date':'2023-01-11',
              'title':'迎风破浪，否极泰来',
              'classification':'公司首次覆盖报告','rating':'增持（首次）',
              'analysts':'唐海清、王奕红',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202301121581904419_1.pdf',
              'source_page':'https://data.eastmoney.com/report/info/AP202301121581904419.html',
              'min_pages':15,'broker_aliases':['天风证券','TF SECURITIES']
            },
          ]

          session=requests.Session(); session.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          def safe(v:str)->str:
              return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',v))[:110]

          manifest=[]
          for idx,rep in enumerate(reports,1):
              attempts=[]; data=None
              for attempt in range(6):
                  try:
                      referer='https://www.hytera.com/cn/investor-relations/research.html' if 'hytera.com' in rep['url'] else 'https://data.eastmoney.com/report/'
                      r=session.get(rep['url'],headers={
                          'User-Agent':ua,
                          'Referer':referer,
                          'Accept':'application/pdf,*/*;q=0.8',
                          'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
                      },timeout=(30,360),allow_redirects=True)
                      attempts.append({'url':rep['url'],'attempt':attempt+1,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                      if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:
                          data=r.content; break
                      if r.status_code in (400,401,403,404,410): break
                  except Exception as exc:
                      attempts.append({'url':rep['url'],'attempt':attempt+1,'error':repr(exc)})
                  time.sleep(1+attempt)
              if not data:
                  raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

              fn=f"{idx:02d}_{safe(rep['broker'])}_海能达_{safe(rep['title'])}_{rep['date']}.pdf"
              dest=PDFDIR/fn; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages < rep['min_pages']:
                  raise RuntimeError(f"Unexpectedly short PDF {fn}: {pages} pages")

              text=''
              for page in reader.pages[:min(50,pages)]:
                  try: text += '\n' + (page.extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','',text)
              identity_hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
              broker_hits=[x for x in rep['broker_aliases'] if re.sub(r'\s+','',x).lower() in compact.lower()]
              if len(compact)>500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {fn}')
              if len(compact)>500 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch: {fn}')

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREV/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<9000:
                  raise RuntimeError(f'Preview failed: {fn}')

              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{k:v for k,v in rep.items() if k not in ('broker_aliases','min_pages')},
                  'actual_pages':pages,'filename':str(Path('原始PDF')/fn),
                  'bytes':len(data),'sha256':sha,'identity_hits':identity_hits,
                  'broker_hits':broker_hits,'preview_file':str(Path('首页预览')/preview.name),
                  'download_attempts':attempts,
                  'validation':['PDF header','issuer identity','broker identity','page count','qpdf structure','first-page render']
              })
              print('VERIFIED',rep['broker'],rep['title'],pages,len(data),sha)

          total_pages=sum(x['actual_pages'] for x in manifest)
          readme=[
              '海能达通信股份有限公司（002583.SZ）券商深度研究报告资料包',
              '整理日期：2026-10-29','',
              '本包收录3份公开可直接取得并通过完整性核验的券商原始PDF。',
              '筛选口径：公司深度或首次覆盖报告；不使用普通财报点评凑数。',''
          ]
          for i,x in enumerate(manifest,1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   来源页面：{x['source_page']}",
                  f"   SHA-256：{x['sha256']}",''
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zcn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3:
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)}')
          zen=Path('hytera_002583_broker_deep_reports.zip'); zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hytera-002583-broker-deep-reports-final
          path: |
            海能达_002583_券商深度报告_3份.zip
            hytera_002583_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
