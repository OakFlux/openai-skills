name: Discover Canadian Solar 688472 filings 20260927

on:
  push:
    paths:
      - '.github/workflows/canadian-solar-688472-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query SSE official disclosures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json,re,time
          from pathlib import Path
          import requests

          STOCK='688472'
          BEGIN='2020-01-01'
          END='2026-09-27'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def parse(text):
            text=text.strip().lstrip('\ufeff')
            if text.startswith('{') or text.startswith('['): return json.loads(text)
            m=re.search(r'^[^(]*\((.*)\)\s*;?$',text,re.S)
            if m:return json.loads(m.group(1))
            raise ValueError(text[:300])
          def clean(x):
            return re.sub(r'\s+','',re.sub(r'<[^>]+>','',str(x or '')).replace('&nbsp;',''))
          def norm(row,kind):
            return {'query':kind,'title':clean(row.get('TITLE') or row.get('title') or row.get('bulletinTitle') or ''),'url':str(row.get('URL') or row.get('url') or row.get('bulletinUrl') or ''),'date':str(row.get('SSEDATE') or row.get('date') or row.get('bulletinDate') or ''),'raw':row}
          def query(kind,keyword='',report2=''):
            endpoint='https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
            out=[]
            for page in range(1,8):
              params={'isPagination':'true','productId':STOCK,'keyWord':keyword,'securityType':'0101,120100,020100,020200,120200','reportType2':report2,'reportType':'','beginDate':BEGIN,'endDate':END,'pageHelp.pageSize':'100','pageHelp.pageCount':'50','pageHelp.pageNo':str(page),'pageHelp.beginPage':str(page),'pageHelp.cacheSize':'1','pageHelp.endPage':str(page+4),'_':str(int(time.time()*1000))}
              headers={'Referer':f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK}','Accept':'application/json,text/javascript,*/*;q=0.8'}
              r=s.get(endpoint,params=params,headers=headers,timeout=60)
              print('QUERY',kind,page,r.status_code,len(r.content),r.url,flush=True)
              r.raise_for_status(); data=parse(r.text)
              rows=data.get('result') or data.get('pageHelp',{}).get('data') or data.get('data') or []
              print('ROWS',kind,page,len(rows),flush=True)
              out.extend(norm(x,kind) for x in rows)
              if len(rows)<100:break
              time.sleep(.3)
            return out

          rows=[]
          rows+=query('periodic','', 'DQBG')
          rows+=query('prospectus','招股说明书','')
          rows+=query('prospectus_intent','招股意向书','')
          rows+=query('ipo','首次公开发行','')
          dedup={}
          for x in rows:
            if x['title'] and x['url']:dedup[(x['title'],x['url'])]=x
          rows=list(dedup.values())
          rows.sort(key=lambda x:x['date'],reverse=True)
          Path('output/candidates.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          for x in rows:print(json.dumps({k:x[k] for k in ('query','title','url','date')},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canadian-solar-688472-discovery-20260927
          path: output/candidates.json
          retention-days: 7
          if-no-files-found: error
