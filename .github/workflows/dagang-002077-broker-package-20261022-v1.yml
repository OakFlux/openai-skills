name: Package Dagang 002077 broker research bundle 20261022

on:
  push:
    branches:
      - tmp/dagang-002077-broker-package-20261022-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet reportlab pypdf

      - name: Build validate and package research index PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import subprocess
          import zipfile
          from pathlib import Path

          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import (
              BaseDocTemplate,
              Frame,
              PageTemplate,
              Paragraph,
              Spacer,
              Table,
              TableStyle,
              PageBreak,
          )

          CODE = "002077"
          COMPANY = "大港股份"
          FULL = "江苏大港股份有限公司"
          PREPARED = "2026-10-22"
          ROOT_NAME = "大港股份_002077_券商研究报告_3份_公开摘要索引版"
          OUTPUT_ZIP = "dagang_002077_broker_reports.zip"
          ROOT = Path(ROOT_NAME)
          ROOT.mkdir(exist_ok=True)
          PREVIEW = ROOT / "首页预览"
          PREVIEW.mkdir(exist_ok=True)

          reports = [
              {
                  "index": 1,
                  "date": "2022-08-09",
                  "broker": "东北证券",
                  "analyst": "李玖",
                  "rating": "增持（首次覆盖）",
                  "title": "大港股份：封测行业迎机遇，扩充产能求发展",
                  "filename": "01_20220809_东北证券_封测行业迎机遇扩充产能求发展_公开摘要索引版_非原始PDF.pdf",
                  "summary": (
                      "首次覆盖并给予增持评级。报告围绕公司集成电路封装与测试业务展开，指出2021年封装与测试业务营收分别为2.42亿元和1.60亿元，合计占公司总营收68.40%。"
                      "报告认为，先进制程推进难度上升将推动先进封装市场发展，公司具备一定成长弹性；预计2022-2024年营收分别为7.80亿元、8.91亿元和9.99亿元，净利润分别为1.77亿元、2.00亿元和2.57亿元。"
                  ),
                  "source_url": "https://webf10.gw.com.cn/SZ/B16/SZ002077_B16.html",
                  "source_note": "大智慧F10公开研报摘要与盈利预测记录；原始券商PDF未在本次公开检索中取得。",
              },
              {
                  "index": 2,
                  "date": "2017-08-16",
                  "broker": "东北证券",
                  "analyst": "笪佳敏",
                  "rating": "增持",
                  "title": "大港股份：剥离亏损建材业务，半导体业务稳步增长",
                  "filename": "02_20170816_东北证券_剥离亏损建材业务半导体业务稳步增长_公开摘要索引版_非原始PDF.pdf",
                  "summary": (
                      "报告关注公司剥离亏损建材业务以及半导体业务增长。2017年上半年，公司实现营业收入6.57亿元，同比增长2.25%；归属于股东的净利润为-1500万元。"
                      "报告预计2017-2019年净利润增速分别为59%、47%和48%，对应每股收益分别为0.11元、0.17元和0.25元，并给予增持评级。"
                  ),
                  "source_url": "https://webf10.gw.com.cn/SZ/B16/SZ002077_B16.html",
                  "source_note": "大智慧F10公开研报摘要记录；原始券商PDF未在本次公开检索中取得。",
              },
              {
                  "index": 3,
                  "date": "2017-04-05",
                  "broker": "东北证券",
                  "analyst": "瞿永忠",
                  "rating": "增持",
                  "title": "大港股份：艾科半导体并表扭亏，建材业务拖累业绩",
                  "filename": "03_20170405_东北证券_艾科半导体并表扭亏建材业务拖累业绩_公开摘要索引版_非原始PDF.pdf",
                  "summary": (
                      "报告分析艾科半导体并表对公司盈利的拉动，同时指出建材业务仍对经营表现形成拖累。2016年公司实现营业收入13.70亿元，同比增长27.08%；归属于股东的净利润为4159万元，同比增长325.74%。"
                      "报告预计2017-2019年净利润增速分别为299%、22%和21%，对应每股收益分别为0.29元、0.35元和0.42元，并给予增持评级。"
                  ),
                  "source_url": "https://webf10.gw.com.cn/SZ/B16/SZ002077_B16.html",
                  "source_note": "大智慧F10公开研报摘要记录；原始券商PDF未在本次公开检索中取得。",
              },
          ]

          font_candidates = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJKsc-Regular.otf",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
          ]
          bold_candidates = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJKsc-Bold.otf",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Bold.ttc",
          ]
          regular = next((Path(p) for p in font_candidates if Path(p).exists()), None)
          bold = next((Path(p) for p in bold_candidates if Path(p).exists()), None)
          if regular is None:
              raise RuntimeError("Noto Sans CJK regular font not found")
          pdfmetrics.registerFont(TTFont("CJK", str(regular), subfontIndex=2 if regular.suffix.lower() == ".ttc" else 0))
          if bold is not None:
              pdfmetrics.registerFont(TTFont("CJKBold", str(bold), subfontIndex=2 if bold.suffix.lower() == ".ttc" else 0))
          else:
              pdfmetrics.registerFont(TTFont("CJKBold", str(regular), subfontIndex=2 if regular.suffix.lower() == ".ttc" else 0))

          PAGE_W, PAGE_H = A4
          styles = getSampleStyleSheet()
          title_style = ParagraphStyle(
              "TitleCJK", parent=styles["Title"], fontName="CJKBold", fontSize=22,
              leading=31, alignment=TA_LEFT, textColor=colors.HexColor("#1f2937"), spaceAfter=14,
          )
          subtitle_style = ParagraphStyle(
              "SubtitleCJK", parent=styles["Heading2"], fontName="CJKBold", fontSize=13,
              leading=20, textColor=colors.HexColor("#374151"), spaceAfter=8,
          )
          body_style = ParagraphStyle(
              "BodyCJK", parent=styles["BodyText"], fontName="CJK", fontSize=10.5,
              leading=18, alignment=TA_LEFT, textColor=colors.HexColor("#222222"), spaceAfter=10,
          )
          small_style = ParagraphStyle(
              "SmallCJK", parent=styles["BodyText"], fontName="CJK", fontSize=8.5,
              leading=14, textColor=colors.HexColor("#555555"), spaceAfter=6,
          )
          warning_style = ParagraphStyle(
              "WarningCJK", parent=styles["BodyText"], fontName="CJKBold", fontSize=10.5,
              leading=18, textColor=colors.HexColor("#9b1c1c"), backColor=colors.HexColor("#fff4f4"),
              borderColor=colors.HexColor("#d99a9a"), borderWidth=0.8, borderPadding=8, spaceAfter=14,
          )

          def footer(canvas, doc):
              canvas.saveState()
              canvas.setFont("CJK", 8)
              canvas.setFillColor(colors.HexColor("#777777"))
              canvas.drawCentredString(PAGE_W / 2, 12 * mm, f"{COMPANY}（{CODE}.SZ）公开研报摘要索引版  |  第 {doc.page} 页")
              canvas.restoreState()

          def build_pdf(spec: dict, path: Path) -> None:
              doc = BaseDocTemplate(
                  str(path), pagesize=A4,
                  leftMargin=20 * mm, rightMargin=20 * mm,
                  topMargin=20 * mm, bottomMargin=20 * mm,
                  title=spec["title"], author="OpenAI research-file packaging workflow",
              )
              frame = Frame(doc.leftMargin, doc.bottomMargin, doc.width, doc.height, id="normal")
              doc.addPageTemplates([PageTemplate(id="all", frames=[frame], onPage=footer)])

              story = []
              story.append(Paragraph("公开研报摘要索引版 · 非券商原始PDF", warning_style))
              story.append(Paragraph(html.escape(spec["title"]), title_style))
              meta = [
                  ["公司", f"{FULL}（{CODE}.SZ）"],
                  ["券商", spec["broker"]],
                  ["研究员", spec["analyst"]],
                  ["发布日期", spec["date"]],
                  ["评级", spec["rating"]],
              ]
              table = Table(meta, colWidths=[28 * mm, 122 * mm])
              table.setStyle(TableStyle([
                  ("FONTNAME", (0, 0), (-1, -1), "CJK"),
                  ("FONTNAME", (0, 0), (0, -1), "CJKBold"),
                  ("FONTSIZE", (0, 0), (-1, -1), 10),
                  ("LEADING", (0, 0), (-1, -1), 16),
                  ("BACKGROUND", (0, 0), (0, -1), colors.HexColor("#f3f4f6")),
                  ("GRID", (0, 0), (-1, -1), 0.5, colors.HexColor("#d1d5db")),
                  ("VALIGN", (0, 0), (-1, -1), "TOP"),
                  ("LEFTPADDING", (0, 0), (-1, -1), 7),
                  ("RIGHTPADDING", (0, 0), (-1, -1), 7),
                  ("TOPPADDING", (0, 0), (-1, -1), 6),
                  ("BOTTOMPADDING", (0, 0), (-1, -1), 6),
              ]))
              story.append(table)
              story.append(Spacer(1, 12 * mm))
              story.append(Paragraph("研报摘要", subtitle_style))
              story.append(Paragraph(html.escape(spec["summary"]), body_style))
              story.append(Spacer(1, 5 * mm))
              story.append(Paragraph("文件性质与使用说明", subtitle_style))
              story.append(Paragraph(
                  "本文件依据公开研报元数据与摘要制作，仅用于帮助定位和识别对应券商报告。它不是券商发布的原始PDF，也不包含原报告全文、图表、估值模型、风险提示页或原始版式。报告版权归原券商及作者所有。",
                  body_style,
              ))
              story.append(Paragraph(
                  "本次公开检索未获得可验证、可直接公开下载的对应原始券商PDF，因此未以网页正文重排版冒充原件，也未绕过会员、登录或付费限制。",
                  body_style,
              ))
              story.append(Spacer(1, 5 * mm))
              story.append(Paragraph("公开来源", subtitle_style))
              story.append(Paragraph(html.escape(spec["source_note"]), small_style))
              story.append(Paragraph(html.escape(spec["source_url"]), small_style))
              story.append(Paragraph(f"整理日期：{PREPARED}", small_style))
              doc.build(story)

          manifest = []
          for spec in reports:
              path = ROOT / spec["filename"]
              build_pdf(spec, path)
              if not path.exists() or path.stat().st_size < 20_000:
                  raise RuntimeError(f"Generated PDF missing or too small: {path}")
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              text = "\n".join((page.extract_text() or "") for page in reader.pages)
              required = [COMPANY, CODE, spec["broker"], spec["analyst"], "非券商原始PDF"]
              missing = [token for token in required if token not in text]
              if missing:
                  raise RuntimeError(f"PDF text validation failed {path.name}: missing={missing}")
              subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEW / path.stem
              subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(path), str(preview_prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + ".png")
              if not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f"Preview render failed: {path.name}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest.append({
                  **spec,
                  "document_form": "公开研报摘要索引版（非券商原始PDF）",
                  "actual_pages": pages,
                  "bytes": path.stat().st_size,
                  "sha256": digest,
                  "preview_file": str(Path("首页预览") / preview.name),
              })

          readme = [
              f"大港股份（{CODE}.SZ）券商研究报告资料索引包",
              f"整理日期：{PREPARED}",
              "",
              "重要说明：",
              "1. 本包收录3份具有明确券商、研究员、日期与评级信息的公司研究报告摘要索引。",
              "2. 三份PDF均为公开研报摘要索引版，不是券商原始PDF，也不包含原报告全文、图表及原始排版。",
              "3. 本次公开检索未取得可验证、可直接公开下载的原始券商PDF；未绕过会员、登录或付费限制。",
              "4. 2022年报告属于首次覆盖；两份2017年报告用于补充公司半导体业务转型阶段的历史研究脉络。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['index']}. {item['filename']}",
                  f"   券商：{item['broker']}；研究员：{item['analyst']}；发布日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   文件性质：{item['document_form']}；页数：{item['actual_pages']}；字节数：{item['bytes']}",
                  f"   公开来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：公司名称、证券代码、券商/研究员信息、文件性质披露、PDF结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "仅供研究资料整理，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "full_company_name": FULL,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "all_files_are_original_broker_pdfs": False,
              "document_form": "公开研报摘要索引版（非券商原始PDF）",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "文件性质", "券商", "研究员", "发布日期", "评级", "标题", "页数", "字节数", "SHA-256", "公开来源"])
              for item in manifest:
                  writer.writerow([
                      item["filename"], item["document_form"], item["broker"], item["analyst"],
                      item["date"], item["rating"], item["title"], item["actual_pages"],
                      item["bytes"], item["sha256"], item["source_url"],
                  ])
          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  {item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          html_rows = []
          for item in manifest:
              html_rows.append(
                  "<tr>"
                  f"<td>{item['index']}</td><td>{html.escape(item['date'])}</td><td>{html.escape(item['broker'])}</td>"
                  f"<td>{html.escape(item['analyst'])}</td><td>{html.escape(item['title'])}</td>"
                  f"<td><a href='{html.escape(item['source_url'])}'>公开来源</a></td>"
                  "</tr>"
              )
          source_html = f"""<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><title>大港股份券商研报来源索引</title>
          <style>body{{font-family:sans-serif;max-width:1100px;margin:40px auto;line-height:1.7}}table{{border-collapse:collapse;width:100%}}th,td{{border:1px solid #ccc;padding:8px;vertical-align:top}}.warn{{padding:12px;background:#fff4f4;border:1px solid #d99a9a}}</style></head>
          <body><h1>大港股份（002077.SZ）券商研报来源索引</h1><p class='warn'>本包PDF均为公开摘要索引版，不是券商原始PDF。</p>
          <table><thead><tr><th>#</th><th>日期</th><th>券商</th><th>研究员</th><th>标题</th><th>来源</th></tr></thead><tbody>{''.join(html_rows)}</tbody></table></body></html>"""
          (ROOT / "公开来源索引.html").write_text(source_html, encoding="utf-8")

          zip_path = Path(OUTPUT_ZIP)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(path))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          print(json.dumps({
              "package": str(zip_path),
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "files": [
                  {
                      "name": item["filename"],
                      "broker": item["broker"],
                      "analyst": item["analyst"],
                      "date": item["date"],
                      "rating": item["rating"],
                      "title": item["title"],
                      "pages": item["actual_pages"],
                      "bytes": item["bytes"],
                      "sha256": item["sha256"],
                  }
                  for item in manifest
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: dagang-002077-broker-research-bundle-20261022
          path: dagang_002077_broker_reports.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
