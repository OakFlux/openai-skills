name: Temporary Johnson Electric targeted report probe

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-johnson-electric-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact report metadata and public assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, requests
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          titles=[
            '车用电机龙头，AIDC液冷+机器人开启成长新曲线',
            '有内生优势的人形机器人供应链公司',
            '首次覆盖报告：汽车微电机单车价值提升，机器人与AIDC液冷泵开辟新成长曲线',
            '汽车微电机单车价值提升，机器人与AIDC液冷泵开辟新成长曲线',
            '液冷水泵、人形机器人零部件弹性可期',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'})
          matches=[]; seen=set()
          for q in titles:
            payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':50,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
            r=s.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=90)
            print('\nQUERY',q,r.status_code,len(r.content)); r.raise_for_status(); data=(r.json().get('data') or {}); files=data.get('files') or []
            print('TOTAL',data.get('total'),'COUNT',len(files))
            for f in files:
              fid=f.get('id'); name=str(f.get('name') or ''); stock=f.get('stock') or {}; content=str(f.get('content') or '')[:2000]
              if fid in seen: continue
              blob=' '.join([name,str(stock.get('name') or ''),str(stock.get('code') or ''),content])
              if '德昌电机控股' not in blob and '00179' not in blob and '0179.HK' not in blob:
                continue
              seen.add(fid)
              row={k:f.get(k) for k in f.keys()}
              matches.append(row)
              print('FULL_MATCH',json.dumps(row,ensure_ascii=False))
              uuid=str(f.get('data_source_uuid') or '')
              for info in re.findall(r'AP\d+',uuid):
                for pre in ['H3','H2','H1']:
                  u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                  x=requests.get(u,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'},timeout=90,allow_redirects=True)
                  print('AP_PDF',info,pre,x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:40]),x.url)
              page_url=str(f.get('page_url') or '').rstrip('/')
              pages=int(f.get('page_count') or 0)
              if page_url and pages:
                good=0; failures=[]
                for i in range(pages):
                  u=f'{page_url}/{i}.png'
                  try:
                    x=requests.get(u,headers={'User-Agent':ua,'Referer':'https://www.sdyanbao.com/'},timeout=40)
                    valid=x.status_code==200 and x.content[:8]==b'\x89PNG\r\n\x1a\n' and len(x.content)>10000
                    if valid: good+=1
                    else: failures.append((i,x.status_code,len(x.content),x.content[:16].hex()))
                  except Exception as e: failures.append((i,repr(e)))
                print('PAGE_SEQUENCE',name,'declared',pages,'good',good,'failures',json.dumps(failures[:10],ensure_ascii=False))
          print('\nMATCH_SUMMARY',json.dumps([{'id':m.get('id'),'name':m.get('name'),'date':m.get('time_text'),'pages':m.get('page_count'),'size':m.get('file_size'),'type':(m.get('type') or {}).get('name'),'org':(m.get('organization') or {}).get('name'),'uuid':m.get('data_source_uuid'),'page_url':m.get('page_url'),'share_url':m.get('share_url'),'online_url':m.get('online_url')} for m in matches],ensure_ascii=False,indent=2))
          PY
