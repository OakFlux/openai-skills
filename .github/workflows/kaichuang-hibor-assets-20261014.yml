name: Archive Hibor download scripts and mobile report pages

on:
  push:
    paths:
      - '.github/workflows/kaichuang-hibor-assets-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch scripts and mobile pages
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          out=Path('hibor_assets'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/155 Mobile Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          assets={
            'sysdownload.js':'https://www.hibor.com.cn/JS/sysdownload.js',
            'BoxView.js':'https://www.hibor.com.cn/js/BoxView.js',
            'docdetailJSN.js':'https://www.hibor.com.cn/js/docdetailJSN.js?ver=2020',
            'JavaScript.js':'https://www.hibor.com.cn/JS/JavaScript.js',
            'login.js':'https://www.hibor.com.cn/JS/login.js',
          }
          manifest=[]
          for name,url in assets.items():
            r=s.get(url,timeout=60,allow_redirects=True)
            (out/name).write_bytes(r.content)
            manifest.append({'name':name,'url':url,'status':r.status_code,'final':r.url,'type':r.headers.get('content-type'),'bytes':len(r.content)})
          for rid in ['178938','210263','211839']:
            for prefix,url in {
              'wap':f'https://www.hibor.com.cn/wap_detail.aspx?id={rid}&un=&wp=2&fromtype=2&sm=1',
              'mobile':f'https://wap.hibor.com.cn/repinfodetail_{rid}.html',
              'detail':f'https://www.hibor.com.cn/docdetail_{rid}.html',
            }.items():
              r=s.get(url,timeout=60,allow_redirects=True)
              fn=f'{rid}_{prefix}.html'; (out/fn).write_bytes(r.content)
              manifest.append({'name':fn,'url':url,'status':r.status_code,'final':r.url,'type':r.headers.get('content-type'),'bytes':len(r.content),'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in r.history]})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaichuang-hibor-assets-20261014
          path: hibor_assets
          retention-days: 7
          if-no-files-found: error
