name: Query China Baoan reports with valid callback
on:
  push:
    paths:
      - '.github/workflows/china-baoan-reportapi-fixed-callback-20261016.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          python - <<'PY'
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          url='https://reportapi.eastmoney.com/report/list'
          variants=[
            ('no_callback',{}),
            ('fixed_callback',{'cb':'datatable7539582'}),
          ]
          for name,extra in variants:
            params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2030-01-01','pageNo':'1','qType':'0','orgCode':'*','code':'000009','rcode':'*','p':'1','pageNum':'1','pageNumber':'1','_':'1684802657014',**extra}
            r=s.get(url,params=params,timeout=60)
            print('\nNAME',name,'STATUS',r.status_code,'URL',r.url,'BYTES',len(r.content),flush=True)
            print(r.text[:100000],flush=True)
          PY
