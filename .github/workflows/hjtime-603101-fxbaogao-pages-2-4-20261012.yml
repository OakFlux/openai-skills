name: HJTime 603101 fxbaogao pages 2-4 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-fxbaogao-pages-2-4-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          for page in (2,3,4):
            url='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
            body={'stockCodes':['603101'],'pageNum':page,'pageSize':100,'order':2}
            data=json.dumps(body,ensure_ascii=False).encode('utf-8')
            req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=45) as r: raw=r.read()
              print('PAGE',page,'BYTES',len(raw),flush=True)
              j=json.loads(raw)
              rows=((j.get('data') or {}).get('dataList') or [])
              for row in rows:
                print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
            except Exception as e:
              print('ERROR',page,repr(e),flush=True)
          PY
