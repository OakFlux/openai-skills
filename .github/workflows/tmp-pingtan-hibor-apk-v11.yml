name: Temporary Pingtan Hibor APK API inspection v11

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-hibor-apk-v11.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests androguard
      - name: Download APK and inspect report/download APIs
        run: |
          mkdir -p out/apk_extract out/decompiled
          python - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          import requests
          O=Path('out'); apk=O/'Hibor459.apk'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36','Referer':'https://www.hibor.com.cn/soft/sjb/index.html'})
          urls=['https://www.hibor.com.cn/apk/Hibor459.apk','http://www.hibor.com.cn/apk/Hibor459.apk','https://www.hibor.com.cn/apk/Hibor.apk','https://download.hibor.com.cn/apk/Hibor459.apk']
          logs=[]
          def note(*a):x=' '.join(map(str,a));print(x,flush=True);logs.append(x)
          for u in urls:
              try:
                  r=s.get(u,timeout=120,allow_redirects=True);note('APK',r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                  if r.status_code==200 and len(r.content)>100000 and r.content[:2]==b'PK':
                      apk.write_bytes(r.content);break
              except Exception as e:note('APKERR',u,repr(e))
          if not apk.exists():
              (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8');raise SystemExit(0)
          with zipfile.ZipFile(apk) as z:
              z.extractall(O/'apk_extract')
              names=z.namelist();(O/'zip_names.txt').write_text('\n'.join(names),encoding='utf-8')
          note('APK_SAVED',apk.stat().st_size)
          (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          PY
          # Extract raw printable strings from dex/resources/native libs.
          find out/apk_extract -type f \( -name '*.dex' -o -name '*.so' -o -name '*.arsc' -o -name '*.xml' -o -name '*.js' \) -print0 | xargs -0 -r strings -a -n 5 > out/all_strings.txt || true
          grep -Eio 'https?://[^[:space:]"<>]+' out/all_strings.txt | sort -u > out/urls.txt || true
          grep -Ein 'hibor|download|downfile|filedown|pdf|docdetail|report|research|did=|docid|fileurl|filepath|preview|viewdoc|clientdownload|app://hibor|api/' out/all_strings.txt > out/relevant_strings.txt || true
          python - <<'PY'
          import json,re
          from pathlib import Path
          from androguard.misc import AnalyzeAPK
          O=Path('out'); apk=str(O/'Hibor459.apk')
          try:
              a,ds,dx=AnalyzeAPK(apk)
              strings=set()
              for d in ds:
                  for s in d.get_strings():
                      v=s.get_value()
                      if any(k in v.lower() for k in ['hibor','download','pdf','report','docdetail','docid','did=','fileurl','filepath','preview','research','clientdownload','api/']): strings.add(v)
              (O/'androguard_strings.txt').write_text('\n'.join(sorted(strings)),encoding='utf-8',errors='ignore')
              methods=[]
              for d in ds:
                  for c in d.get_classes():
                      cn=c.get_name()
                      if any(k in cn.lower() for k in ['download','report','document','detail','pdf','research','http','api']):
                          methods.append(cn)
                          for m in c.get_methods():methods.append('  '+m.get_name()+m.get_descriptor())
              (O/'relevant_classes.txt').write_text('\n'.join(methods),encoding='utf-8',errors='ignore')
              print('ANDROGUARD_STRINGS',len(strings),'CLASSES',len(methods))
          except Exception as e:
              (O/'androguard_error.txt').write_text(repr(e),encoding='utf-8');print('ANDROGUARD_ERR',repr(e))
          PY
          # Try jadx from GitHub release for readable source. Failure is non-fatal.
          curl -L --retry 2 --connect-timeout 20 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip || true
          if unzip -tq /tmp/jadx.zip >/dev/null 2>&1; then
            mkdir -p /tmp/jadx && unzip -q /tmp/jadx.zip -d /tmp/jadx
            /tmp/jadx/bin/jadx -j 2 --show-bad-code -d out/decompiled out/Hibor459.apk >/tmp/jadx.log 2>&1 || true
            cp /tmp/jadx.log out/jadx.log
            grep -RInE 'hibor|download|downfile|filedown|\.pdf|docdetail|report|research|did=|docid|fileurl|filepath|preview|clientdownload|api/' out/decompiled > out/jadx_relevant.txt || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-hibor-apk-v11
          path: out/
          retention-days: 3
