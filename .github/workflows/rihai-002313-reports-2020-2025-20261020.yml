name: Package Rihai Intelligent 002313 reports 20261020

on:
  push:
    paths:
      - '.github/workflows/rihai-002313-reports-2020-2025-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests pypdf

      - name: Download and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '002313'
          COMPANY = '日海智能'
          TODAY = '2026-10-20'
          YEARS = list(range(2020, 2026))
          OUT_ROOT = Path('rihai_reports')
          PDF_DIR = OUT_ROOT / 'PDF'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def clean_title(value):
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', '', value)
              return re.sub(r'\s+', '', value).strip()

          def request(method, url, *, attempts=6, timeout=(20, 120), **kwargs):
              last = None
              for attempt in range(attempts):
                  try:
                      response = session.request(method, url, timeout=timeout, **kwargs)
                      last = response
                      if response.status_code == 200 and response.content:
                          return response
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 ** attempt, 10))
              raise RuntimeError(f'Request failed: {method} {url}; last={last!r}')

          def query_announcements():
              api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
              rows = []
              for page in range(1, 31):
                  response = request(
                      'GET', api,
                      params={
                          'sr': '-1',
                          'page_size': '100',
                          'page_index': str(page),
                          'ann_type': 'A',
                          'client_source': 'web',
                          'stock_list': STOCK_CODE,
                          'f_node': '0',
                      },
                      headers={
                          'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
                          'Accept': 'application/json, text/plain, */*',
                      },
                  )
                  payload = response.json()
                  data = payload.get('data') or {}
                  page_rows = data.get('list') or []
                  print('Announcement page', page, 'rows', len(page_rows), 'total', data.get('total_hits'))
                  for row in page_rows:
                      art_code = row.get('art_code') or row.get('artCode')
                      if not art_code:
                          continue
                      rows.append({
                          'title': clean_title(row.get('title')),
                          'date': str(row.get('notice_date') or row.get('display_time') or '')[:10],
                          'url': f'https://pdf.dfcfw.com/pdf/H2_{art_code}_1.pdf',
                          'source': '东方财富公告镜像',
                          'announcement_id': str(art_code),
                      })
                  if not page_rows or len(page_rows) < 100:
                      break
              return rows

          candidates = query_announcements()
          if not candidates:
              raise RuntimeError('No announcement candidates returned')

          def excluded(title):
              words = [
                  '摘要', '英文版', '审计报告', '内部控制', '问询函', '回复', '说明',
                  '意见', '提示性公告', '更正公告', '取消', '董事会', '监事会',
                  '社会责任', '独立董事', '财务报告', '鉴证报告', '募集资金',
                  '延期披露', '预约披露', '关于',
              ]
              return any(word in title for word in words)

          def choose_annual(year):
              pattern = re.compile(
                  rf'[:：]{year}年年度报告(?:[（(](?:更新后|修订稿|修订版|更正后|修正版)[）)])?$'
              )
              options = [item for item in candidates if pattern.search(item['title']) and not excluded(item['title'])]
              if not options:
                  return None
              def score(item):
                  revision = 1 if any(x in item['title'] for x in ['更新后', '修订稿', '修订版', '更正后', '修正版']) else 0
                  return revision, item['date']
              return sorted(options, key=score, reverse=True)[0]

          annual = []
          missing = []
          for year in YEARS:
              item = choose_annual(year)
              if item is None:
                  missing.append(year)
              else:
                  item = dict(item)
                  item['kind'] = 'annual'
                  item['period'] = str(year)
                  annual.append(item)
          if missing:
              raise RuntimeError('Missing annual reports: ' + ', '.join(map(str, missing)))

          quarter_pattern = re.compile(
              r'[:：](20\d{2})年(第一季度报告|第三季度报告)(?:[（(](?:更新后|修订稿|修订版|更正后|修正版)[）)])?$'
          )
          quarters = []
          for item in candidates:
              match = quarter_pattern.search(item['title'])
              if not match or excluded(item['title']):
                  continue
              q_item = dict(item)
              q_item['_year'] = int(match.group(1))
              q_item['_quarter'] = 1 if match.group(2) == '第一季度报告' else 3
              quarters.append(q_item)
          if not quarters:
              raise RuntimeError('No valid first-quarter or third-quarter report found')

          latest_quarter = sorted(
              quarters,
              key=lambda item: (item['_year'], item['_quarter'], item['date']),
              reverse=True,
          )[0]
          latest_quarter['kind'] = 'quarterly'
          latest_quarter['period'] = f"{latest_quarter['_year']}Q{latest_quarter['_quarter']}"
          latest_quarter.pop('_year')
          latest_quarter.pop('_quarter')

          selected = annual + [latest_quarter]
          print('Selected reports:')
          for item in selected:
              print(json.dumps(item, ensure_ascii=False))

          def safe_name(title):
              title = re.sub(r'[\\/:*?"<>|]+', '_', title)
              return re.sub(r'\s+', '', title)[:150]

          for index, item in enumerate(selected, start=1):
              response = request(
                  'GET', item['url'], attempts=6, timeout=(20, 180),
                  headers={
                      'Referer': 'https://data.eastmoney.com/',
                      'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  },
              )
              content = response.content
              if not content.startswith(b'%PDF'):
                  raise RuntimeError(f'Not a PDF for {item["title"]}: {content[:100]!r}')
              filename = f'{index:02d}_{safe_name(item["title"])}.pdf'
              path = PDF_DIR / filename
              path.write_bytes(content)
              pages = len(PdfReader(str(path)).pages)
              if pages < 2:
                  raise RuntimeError(f'Suspicious page count {pages} for {item["title"]}')
              item['filename'] = f'PDF/{filename}'
              item['pages'] = pages
              item['bytes'] = len(content)
              item['sha256'] = hashlib.sha256(content).hexdigest()
              print('Downloaded', filename, 'pages', pages, 'bytes', len(content))

          manifest = {
              'company': COMPANY,
              'stock_code': STOCK_CODE,
              'generated_at': TODAY,
              'scope': '2020-2025年年度报告及截至生成日最新的一季度/三季度报告',
              'reports': selected,
          }
          (OUT_ROOT / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          lines = [
              f'# {COMPANY}（{STOCK_CODE}）报告文件清单',
              '',
              f'- 打包日期：{TODAY}',
              f'- 最新季报：{latest_quarter["period"]}，公告日期 {latest_quarter["date"]}',
              '- 文件来源：东方财富公告镜像。',
              '',
              '| 序号 | 报告期 | 公告标题 | 公告日期 | 页数 | 文件 | 来源链接 |',
              '|---:|---|---|---|---:|---|---|',
          ]
          for i, item in enumerate(selected, start=1):
              lines.append(
                  f'| {i} | {item["period"]} | {item["title"]} | {item["date"]} | {item["pages"]} | `{item["filename"]}` | {item["url"]} |'
              )
          lines.extend(['', '## SHA-256 校验', ''])
          for item in selected:
              lines.append(f'- `{item["filename"]}`：`{item["sha256"]}`')
          (OUT_ROOT / '文件清单.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          zip_name = f'{COMPANY}_{STOCK_CODE}_2020-2025年报及最新季报_{TODAY.replace("-", "")}.zip'
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(OUT_ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(path.relative_to(OUT_ROOT)))
          print('ZIP_CREATED', zip_name, Path(zip_name).stat().st_size)
          print('LATEST_QUARTER', latest_quarter['period'], latest_quarter['title'], latest_quarter['date'])
          PY

      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: rihai-intelligent-002313-reports-20261020-v2
          path: 日海智能_002313_2020-2025年报及最新季报_20261020.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
