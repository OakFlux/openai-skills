name: Package Yinbang 300337 annual reports and latest quarter

on:
  push:
    paths:
      - '.github/workflows/yinbang-300337-annual-reports-latest-quarter-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import time
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '银邦股份'
          FULL_NAME = '银邦金属复合材料股份有限公司'
          CODE = '300337'
          CUTOFF = '2026-11-04'
          COMPACT = '20261104'
          ROOT_NAME = f'{COMPANY}_{CODE}_2020-2025年报及最新季报_截至{COMPACT}'
          ROOT = Path('work') / ROOT_NAME
          PDF_DIR = ROOT / 'PDF文件'
          PREVIEW_DIR = ROOT / '首页与末页预览'
          DIST = Path('dist')
          for directory in (PDF_DIR, PREVIEW_DIR, DIST):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          retry = Retry(
              total=6, connect=6, read=6, status=6,
              backoff_factor=0.8,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET', 'POST'}),
              raise_on_status=False,
          )
          adapter = HTTPAdapter(max_retries=retry)
          session.mount('https://', adapter)
          session.mount('http://', adapter)
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://www.cninfo.com.cn/',
          })

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def clean_title(value: str) -> str:
              return re.sub(r'<[^>]+>', '', value or '').replace('&amp;', '&').strip()

          def resolve_quarterly() -> dict:
              endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              search_keys = ['2026年三季度报告', '2026年第三季度报告']
              stock_values = [CODE, f'{CODE},', '']
              collected = []
              for key in search_keys:
                  for stock in stock_values:
                      for page in range(1, 4):
                          payload = {
                              'pageNum': str(page),
                              'pageSize': '100',
                              'column': 'szse',
                              'tabName': 'fulltext',
                              'plate': 'sz',
                              'stock': stock,
                              'searchkey': key,
                              'secid': '',
                              'category': '',
                              'trade': '',
                              'seDate': '2026-10-27~2026-10-27',
                              'sortName': 'time',
                              'sortType': 'desc',
                              'isHLtitle': 'true',
                          }
                          response = session.post(endpoint, data=payload, timeout=90)
                          print('QUERY_Q3', key, stock, page, response.status_code, len(response.content), flush=True)
                          if response.status_code != 200:
                              continue
                          try:
                              rows = response.json().get('announcements') or []
                          except Exception:
                              rows = []
                          for row in rows:
                              title = clean_title(str(row.get('announcementTitle') or ''))
                              sec_code = str(row.get('secCode') or '')
                              if sec_code == CODE and ('2026年三季度报告' in title or '2026年第三季度报告' in title) and '摘要' not in title:
                                  row['_title'] = title
                                  row['_time'] = int(row.get('announcementTime') or 0)
                                  collected.append(row)
                          if not rows:
                              break
                          time.sleep(0.1)
              if collected:
                  collected.sort(key=lambda row: row['_time'], reverse=True)
                  row = collected[0]
                  adjunct = str(row.get('adjunctUrl') or '').lstrip('/')
                  if adjunct:
                      return {
                          'file_name': '07_2026年第三季度报告.pdf',
                          'type': '最新季度报告',
                          'year': 2026,
                          'date': '2026-10-27',
                          'title': row['_title'],
                          'url': f'https://static.cninfo.com.cn/{adjunct}',
                          'announcement_id': str(row.get('announcementId') or ''),
                      }

              # Fallback: recover the official PDF address from the public Sina announcement page.
              page_url = 'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12660125&stockid=300337'
              response = session.get(page_url, timeout=90)
              raw = response.content
              texts = []
              for encoding in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      texts.append(raw.decode(encoding, errors='ignore'))
                  except Exception:
                      pass
              patterns = [
                  r'https?://static\.cninfo\.com\.cn/finalpage/2026-10-27/[^\"\'<> ]+\.PDF',
                  r'https?://disc\.static\.szse\.cn/[^\"\'<> ]+\.PDF',
              ]
              for text in texts:
                  text = text.replace('\\/', '/')
                  for pattern in patterns:
                      match = re.search(pattern, text, re.I)
                      if match:
                          return {
                              'file_name': '07_2026年第三季度报告.pdf',
                              'type': '最新季度报告',
                              'year': 2026,
                              'date': '2026-10-27',
                              'title': '2026年三季度报告',
                              'url': match.group(0),
                              'announcement_id': '12660125',
                          }
              raise RuntimeError('未能解析银邦股份2026年第三季度报告官方PDF地址')

          documents = [
              {
                  'file_name': '01_2020年年度报告.pdf',
                  'type': '年度报告', 'year': 2020, 'date': '2021-03-24',
                  'title': '2020年年度报告',
                  'url': 'https://static.cninfo.com.cn/finalpage/2021-03-24/1209438508.PDF',
                  'announcement_id': '1209438508',
              },
              {
                  'file_name': '02_2021年年度报告.pdf',
                  'type': '年度报告', 'year': 2021, 'date': '2022-03-30',
                  'title': '2021年年度报告',
                  'url': 'https://static.cninfo.com.cn/finalpage/2022-03-30/1212727339.PDF',
                  'announcement_id': '1212727339',
              },
              {
                  'file_name': '03_2022年年度报告.pdf',
                  'type': '年度报告', 'year': 2022, 'date': '2023-04-21',
                  'title': '2022年年度报告',
                  'url': 'https://static.cninfo.com.cn/finalpage/2023-04-21/1216494033.PDF',
                  'announcement_id': '1216494033',
              },
              {
                  'file_name': '04_2023年年度报告.pdf',
                  'type': '年度报告', 'year': 2023, 'date': '2024-03-29',
                  'title': '2023年年度报告',
                  'url': 'https://disc.static.szse.cn/disc/disk03/finalpage/2024-03-28/1e2c1820-b819-4011-90b6-9ff5a1ac8cc8.PDF',
                  'announcement_id': '1e2c1820-b819-4011-90b6-9ff5a1ac8cc8',
              },
              {
                  'file_name': '05_2024年年度报告.pdf',
                  'type': '年度报告', 'year': 2024, 'date': '2025-04-18',
                  'title': '2024年年度报告',
                  'url': 'https://static.cninfo.com.cn/finalpage/2025-04-18/1223120427.PDF',
                  'announcement_id': '1223120427',
              },
              {
                  'file_name': '06_2025年年度报告.pdf',
                  'type': '年度报告', 'year': 2025, 'date': '2026-04-17',
                  'title': '2025年年度报告',
                  'url': 'https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-17/b7fd15a7-27a8-442f-9051-1285c2144132.PDF',
                  'announcement_id': 'b7fd15a7-27a8-442f-9051-1285c2144132',
              },
          ]
          documents.append(resolve_quarterly())
          print('DOCUMENTS', json.dumps(documents, ensure_ascii=False, indent=2), flush=True)

          records = []
          for item in documents:
              response = session.get(item['url'], headers={'Referer': 'https://www.cninfo.com.cn/'}, timeout=300, allow_redirects=True)
              print('DOWNLOAD', item['file_name'], response.status_code, len(response.content), response.url, response.headers.get('content-type'), flush=True)
              response.raise_for_status()
              data = response.content
              if not data.startswith(b'%PDF') or len(data) < 20000:
                  raise RuntimeError(f"PDF内容异常: {item['file_name']}, bytes={len(data)}")

              path = PDF_DIR / item['file_name']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              if reader.is_encrypted:
                  reader.decrypt('')
              pages = len(reader.pages)
              if pages < 2:
                  raise RuntimeError(f"PDF页数异常: {item['file_name']}, pages={pages}")

              sample = ''
              for index in sorted(set([0, min(1, pages - 1), min(2, pages - 1), pages - 1])):
                  try:
                      sample += reader.pages[index].extract_text() or ''
                  except Exception:
                      pass
              compact_text = re.sub(r'\s+', '', sample)
              if FULL_NAME not in compact_text and COMPANY not in compact_text and CODE not in compact_text:
                  raise RuntimeError(f"公司身份校验失败: {item['file_name']}")
              if item['type'] == '年度报告' and f"{item['year']}年年度报告" not in compact_text:
                  raise RuntimeError(f"报告年份校验失败: {item['file_name']}")
              if item['type'] == '最新季度报告' and '2026年第三季度报告' not in compact_text and '2026年三季度报告' not in compact_text:
                  raise RuntimeError('最新季度报告文本校验失败')

              document = fitz.open(path)
              if document.page_count != pages:
                  raise RuntimeError(f"双解析器页数不一致: {item['file_name']}")
              first = document.load_page(0).get_pixmap(matrix=fitz.Matrix(1.25, 1.25), alpha=False)
              last = document.load_page(document.page_count - 1).get_pixmap(matrix=fitz.Matrix(1.0, 1.0), alpha=False)
              if min(first.width, first.height, last.width, last.height) < 400:
                  raise RuntimeError(f"页面渲染异常: {item['file_name']}")
              first.save(PREVIEW_DIR / f"{path.stem}_首页.png")
              last.save(PREVIEW_DIR / f"{path.stem}_末页.png")
              document.close()

              record = {
                  **item,
                  'resolved_url': response.url,
                  'page_count': pages,
                  'file_size_bytes': path.stat().st_size,
                  'sha256': sha256(path),
                  'pdf_header_valid': True,
                  'company_identity_validated': True,
                  'dual_parser_page_count_validated': True,
                  'first_and_last_pages_rendered': True,
              }
              records.append(record)
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          manifest = {
              'company_short_name': COMPANY,
              'company_full_name': FULL_NAME,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'scope': '2020—2025年完整年度报告及截至截止日最新季度报告（2026年第三季度报告）',
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'documents': records,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{record['sha256']}  PDF文件/{record['file_name']}\n" for record in records),
              encoding='utf-8',
          )

          readme = [
              f'# {COMPANY}（{CODE}）2020—2025年报及最新季报',
              '',
              f'- 公司全称：{FULL_NAME}',
              f'- 截止日期：{CUTOFF}',
              '- 文件范围：2020—2025年完整年度报告、2026年第三季度报告。',
              f'- PDF数量：{len(records)}份；合计页数：{sum(record["page_count"] for record in records)}页。',
              '- 来源：巨潮资讯网及深圳证券交易所法定信息披露PDF。',
              '- 校验：PDF文件头、公司与报告身份、双解析器页数、首末页渲染、SHA-256和ZIP CRC。',
              '',
              '## 文件清单',
              '',
          ]
          for number, record in enumerate(records, 1):
              readme += [
                  f'{number}. `{record["file_name"]}`',
                  f'   - 类型：{record["type"]}；公告日期：{record["date"]}',
                  f'   - 页数：{record["page_count"]}',
                  f'   - 来源：{record["resolved_url"]}',
                  f'   - SHA-256：`{record["sha256"]}`',
              ]
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          cn_zip = DIST / f'{ROOT_NAME}.zip'
          en_zip = DIST / f'yinbang_300337_2020_2025_annual_latest_quarter_{COMPACT}.zip'
          with zipfile.ZipFile(cn_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(cn_zip, en_zip)

          for zip_path in (cn_zip, en_zip):
              with zipfile.ZipFile(zip_path) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC校验失败: {bad}')
                  pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
                  if len(pdfs) != 7:
                      raise RuntimeError(f'ZIP内PDF数量异常: {len(pdfs)}')
              print('ZIP_VERIFIED', zip_path, zip_path.stat().st_size, sha256(zip_path), flush=True)

          print('FINAL_SUMMARY', json.dumps({
              'chinese_zip': str(cn_zip),
              'english_zip': str(en_zip),
              'zip_size_bytes': cn_zip.stat().st_size,
              'zip_sha256': sha256(cn_zip),
              'document_count': len(records),
              'total_pages': sum(record['page_count'] for record in records),
              'records': records,
          }, ensure_ascii=False), flush=True)
          PY

      - name: Upload final ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: yinbang-300337-reports-final-20261104
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
