name: Probe Yousheng SGPJBG endpoints directly 20260929

on:
  push:
    paths:
      - '.github/workflows/yousheng-603418-sgpjbg-endpoint-only-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe direct endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests

          endpoints = [
              'https://www.sgpjbg.com/bgdown/1269661.html',
              'https://www.sgpjbg.com/bgdown/1269661.html?dtype=0',
              'https://www.sgpjbg.com/bgdown/1269661.html?dtype=184928',
              'https://m.sgpjbg.com/bgdown/1269661.html',
              'https://m.sgpjbg.com/bgdown/1269661.html?dtype=0',
              'https://www.sgpjbg.com/baogao/1269661.html',
          ]
          header_sets = [
              {
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
                  'Accept':'application/pdf,text/html,*/*;q=0.8',
                  'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
                  'Referer':'https://www.sgpjbg.com/baogao/1269661.html',
              },
              {
                  'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
                  'Accept':'application/pdf,text/html,*/*;q=0.8',
                  'Accept-Language':'zh-CN,zh;q=0.9',
                  'Referer':'https://m.sgpjbg.com/baogao/1269661.html',
              },
              {
                  'User-Agent':'Mozilla/5.0',
                  'Accept':'*/*',
              },
          ]
          for hidx, headers in enumerate(header_sets, 1):
              session = requests.Session()
              session.trust_env = False
              session.headers.update(headers)
              # Warm up domain without aborting.
              for warm in ['https://www.sgpjbg.com/', 'https://www.sgpjbg.com/baogao/1269661.html']:
                  try:
                      w = session.get(warm, timeout=(10,30), allow_redirects=True)
                      print('WARM', hidx, warm, w.status_code, w.url, len(w.content), dict(session.cookies), flush=True)
                  except Exception as exc:
                      print('WARM_ERROR', hidx, warm, repr(exc), flush=True)
              for url in endpoints:
                  for follow in (False, True):
                      try:
                          r = session.get(url, timeout=(15,60), allow_redirects=follow, stream=True)
                          head = next(r.iter_content(512), b'')
                          print('PROBE', hidx, url, 'FOLLOW', follow, 'STATUS', r.status_code, 'FINAL', r.url, 'LOC', r.headers.get('location'), 'CTYPE', r.headers.get('content-type'), 'DISP', r.headers.get('content-disposition'), 'CLEN', r.headers.get('content-length'), 'COOKIES', dict(session.cookies), 'HEAD', repr(head[:160]), flush=True)
                          r.close()
                      except Exception as exc:
                          print('ERROR', hidx, url, follow, repr(exc), flush=True)
          PY
