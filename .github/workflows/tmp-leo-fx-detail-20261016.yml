name: Read Leo report public metadata

on:
  push:
    branches: [tmp-leo-broker-reports-20261016]
    paths: ['.github/workflows/tmp-leo-fx-detail-20261016.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read report metadata
        shell: bash
        run: |
          curl --http1.1 -sSL --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            -H 'Origin: https://www.fxbaogao.com' \
            -H 'Referer: https://www.fxbaogao.com/detail/91485' \
            -H 'Content-Type: application/json;charset=UTF-8' \
            --data '{"id":91485,"isEnglish":0}' \
            'https://api.fxbaogao.com/mofoun/report/searchReport/detail'
