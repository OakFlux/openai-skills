name: Temporary Ascletis report-index search

on:
  push:
    branches:
      - tmp-gelizhiyao-sdy-search-20260906

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Search public index and inspect report metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import requests

          out=Path('output'); out.mkdir(exist_ok=True)
          endpoint='https://api.sdyanbao.com/api/file/search'
          s=requests.Session(); s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/report',
            'Content-Type':'application/json;charset=UTF-8','Accept':'application/json, text/plain, */*',
            'Accept-Language':'zh-CN,zh;q=0.9'
          })
          queries=[
            '歌礼制药','01672','1672.HK',
            '全新GLP-1减重不减肌','口服小分子率先破局','聚焦减重代谢产品差异化管线'
          ]
          records={}; raw=[]
          for q in queries:
            for page in range(1,7):
              body={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':page,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'','keyword':q}
              try:
                r=s.post(endpoint,json=body,timeout=45)
                print('SEARCH',q,page,r.status_code,len(r.content),flush=True)
                r.raise_for_status(); obj=r.json(); raw.append({'query':q,'page':page,'response':obj})
                files=((obj.get('data') or {}).get('files') or [])
                print('FILES',q,page,len(files),(obj.get('data') or {}).get('total'),flush=True)
                for f in files:
                  joined=' '.join(str(f.get(k) or '') for k in ['name','content'])
                  stock=f.get('stock') or {}; org=f.get('organization') or {}
                  joined+=' '+str(stock)+' '+str(org)
                  if any(x in joined for x in ['歌礼制药','全新GLP-1减重不减肌','口服小分子率先破局','聚焦减重代谢产品差异化管线']):
                    key=str(f.get('id') or f.get('original_id') or len(records))
                    records[key]=f
                    print('MATCH',json.dumps({k:f.get(k) for k in ['id','name','page_count','size','time_text','create_time','original_id','page_url','share_url','online_url','file_size','status','hash','data_source','data_source_uuid']},ensure_ascii=False),json.dumps({'organization':org,'stock':stock,'type':f.get('type')},ensure_ascii=False),flush=True)
                if len(files)<100: break
              except Exception as exc:
                print('SEARCH_ERROR',q,page,repr(exc),flush=True); break
          details=[]
          for key,f in records.items():
            fid=f.get('id')
            row={'record':f}
            for path,payload in [('/api/file/detail',{'id':fid}),('/api/file/download',{'id':fid}),('/api/file/download',{'file_id':fid}),('/api/file/download',{'fileId':fid})]:
              try:
                r=s.post('https://api.sdyanbao.com'+path,json=payload,timeout=45,allow_redirects=False)
                item={'path':path,'payload':payload,'status':r.status_code,'bytes':len(r.content),'headers':dict(r.headers),'text':r.text[:20000]}
                try: item['json']=r.json()
                except Exception: pass
                row.setdefault('requests',[]).append(item)
                print('REQUEST',fid,path,json.dumps(payload),r.status_code,len(r.content),r.text[:300],flush=True)
              except Exception as exc:
                row.setdefault('requests',[]).append({'path':path,'payload':payload,'error':repr(exc)})
            details.append(row)
          (out/'matches.json').write_text(json.dumps(list(records.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'raw.json').write_text(json.dumps(raw,ensure_ascii=False),encoding='utf-8')
          print('MATCH_COUNT',len(records),flush=True)
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: gelizhiyuo-sdy-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
