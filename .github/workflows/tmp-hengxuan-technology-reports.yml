name: Temporary Hengxuan Technology annual reports and prospectus collection

on:
  push:
    branches:
      - tmp/hengxuan-technology-reports-20260830
    paths:
      - .github/workflows/tmp-hengxuan-technology-reports.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF
      - name: Query CNINFO, download, validate, and package reports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests

          CODE = '688608'
          SHORT_NAME = '恒玄科技'
          FULL_NAMES = ['恒玄科技（上海）股份有限公司', '恒玄科技(上海)股份有限公司']
          END_DATE = '2026-08-30'

          OUT = Path('hengxuan_reports')
          PDFDIR = OUT / 'pdfs'
          RENDERDIR = OUT / 'renders'
          for path in (OUT, PDFDIR, RENDERDIR):
              path.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Origin': 'https://www.cninfo.com.cn',
              'Referer': 'https://www.cninfo.com.cn/',
              'X-Requested-With': 'XMLHttpRequest',
          })

          logs: list[str] = []

          def note(*parts):
              line = ' '.join(str(x) for x in parts)
              print(line, flush=True)
              logs.append(line)

          def clean_title(title: str) -> str:
              return re.sub(r'<[^>]+>', '', title or '').replace('&nbsp;', ' ').strip()

          def flatten_stock_rows(obj):
              rows = []
              if isinstance(obj, dict):
                  for value in obj.values():
                      if isinstance(value, list):
                          rows.extend(value)
                      elif isinstance(value, dict):
                          rows.append(value)
              elif isinstance(obj, list):
                  rows = obj
              return rows

          # Resolve official CNINFO organization id. CNINFO currently exposes
          # both exchanges through one or more public stock-list endpoints.
          org_id = ''
          for stock_list_url in [
              'https://www.cninfo.com.cn/new/data/sse_stock.json',
              'https://www.cninfo.com.cn/new/data/szse_stock.json',
          ]:
              try:
                  response = session.get(stock_list_url, timeout=45)
                  note('STOCK_LIST', response.status_code, len(response.content), stock_list_url)
                  if response.status_code != 200:
                      continue
                  for row in flatten_stock_rows(response.json()):
                      if str(row.get('code') or '') == CODE:
                          org_id = str(row.get('orgId') or row.get('orgid') or '')
                          note('STOCK_MATCH', json.dumps(row, ensure_ascii=False))
                          break
              except Exception as exc:
                  note('STOCK_LIST_ERROR', stock_list_url, repr(exc))
              if org_id:
                  break
          if not org_id:
              raise RuntimeError(f'Unable to resolve CNINFO orgId for {CODE}')
          note('ORG_ID', org_id)

          endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
          announcements: list[dict] = []

          def query(category: str, keyword: str = '', date_range: str = f'2019-01-01~{END_DATE}'):
              data = {
                  'pageNum': '1',
                  'pageSize': '100',
                  'column': 'sse',
                  'tabName': 'fulltext',
                  'plate': 'sh',
                  'stock': f'{CODE},{org_id}',
                  'searchkey': keyword,
                  'secid': '',
                  'category': category,
                  'trade': '',
                  'seDate': date_range,
                  'sortName': 'time',
                  'sortType': 'desc',
                  'isHLtitle': 'true',
              }
              response = session.post(endpoint, data=data, timeout=60)
              note('QUERY', category or 'ALL', keyword or '-', date_range, response.status_code, len(response.content), response.text[:140])
              response.raise_for_status()
              result = response.json()
              total_pages = int(result.get('totalpages') or result.get('totalPages') or 1)
              for row in result.get('announcements') or []:
                  if str(row.get('secCode') or '') == CODE:
                      announcements.append(row)
              for page_num in range(2, min(total_pages, 10) + 1):
                  time.sleep(0.3)
                  data['pageNum'] = str(page_num)
                  page_response = session.post(endpoint, data=data, timeout=60)
                  page_response.raise_for_status()
                  page_rows = page_response.json().get('announcements') or []
                  note('QUERY_PAGE', keyword or category or 'ALL', page_num, len(page_rows))
                  for row in page_rows:
                      if str(row.get('secCode') or '') == CODE:
                          announcements.append(row)

          # Broad and exact searches to avoid missing documents because of
          # inconsistent title/category tagging.
          query('category_ndbg_szsh;')
          query('category_bndbg_szsh;')
          query('', '年度报告')
          query('', '年报')
          query('', '半年度报告')
          query('', '招股说明书', '2019-01-01~2021-12-31')
          for year in range(2020, 2026):
              query('', f'{year}年年度报告', f'{year + 1}-01-01~{year + 1}-07-31')
              query('', f'{year}年年报', f'{year + 1}-01-01~{year + 1}-07-31')
          for year in range(2020, 2027):
              query('', f'{year}年半年度报告', f'{year}-07-01~{year}-10-31')
              query('', f'{year}年半年报', f'{year}-07-01~{year}-10-31')

          # Deduplicate metadata.
          deduped = []
          seen = set()
          for row in announcements:
              key = (row.get('adjunctUrl'), clean_title(row.get('announcementTitle') or ''))
              if key in seen:
                  continue
              seen.add(key)
              deduped.append(row)
          announcements = deduped
          (OUT / 'cninfo_announcements.json').write_text(json.dumps(announcements, ensure_ascii=False, indent=2), encoding='utf-8')
          note('ANNOUNCEMENT_COUNT', len(announcements))
          for row in announcements:
              note('ANN', row.get('announcementTime'), clean_title(row.get('announcementTitle') or ''), row.get('adjunctUrl'))

          bad_words = [
              '摘要', '英文版', '取消', '提示性公告', '审计报告', '问询函', '回复',
              '董事会', '监事会', '决议公告', '独立意见', '专项说明', '内部控制',
              '社会责任', '环境报告', 'ESG', '预约披露', '更正公告',
          ]

          def version_rank(row: dict) -> tuple:
              title = clean_title(row.get('announcementTitle') or '')
              score = 0
              if any(word in title for word in ['修订版', '修订稿']):
                  score = 5
              elif any(word in title for word in ['更正后', '更正版']):
                  score = 4
              elif any(word in title for word in ['更新后', '更新版']):
                  score = 3
              elif any(word in title for word in ['调整后', '重述']):
                  score = 2
              return score, int(row.get('announcementTime') or 0)

          def annual_match(row: dict, year: int) -> bool:
              title = clean_title(row.get('announcementTitle') or '')
              if any(word in title for word in bad_words) or not row.get('adjunctUrl'):
                  return False
              return (f'{year}年年度报告' in title) or (f'{year}年年报' in title)

          selected: list[dict] = []
          for year in range(2020, 2026):
              matches = [row for row in announcements if annual_match(row, year)]
              matches.sort(key=version_rank, reverse=True)
              if not matches:
                  raise RuntimeError(f'Missing official full annual report: {year}')
              title = clean_title(matches[0].get('announcementTitle') or '')
              selected.append({'kind': 'annual', 'year': year, 'label': title, 'row': matches[0]})
              note('SELECT_ANNUAL', year, title, matches[0].get('adjunctUrl'))

          interim_candidates = []
          for row in announcements:
              title = clean_title(row.get('announcementTitle') or '')
              match = re.search(r'(20\d{2})年(?:半年度报告|半年报(?:报告)?)', title)
              if not match or any(word in title for word in bad_words) or not row.get('adjunctUrl'):
                  continue
              interim_candidates.append((int(match.group(1)), row))
          if not interim_candidates:
              raise RuntimeError('No complete interim report found')
          latest_interim_year = max(year for year, _ in interim_candidates)
          latest_rows = [row for year, row in interim_candidates if year == latest_interim_year]
          latest_rows.sort(key=version_rank, reverse=True)
          latest_row = latest_rows[0]
          selected.append({'kind': 'interim', 'year': latest_interim_year, 'label': clean_title(latest_row.get('announcementTitle') or ''), 'row': latest_row})
          note('SELECT_INTERIM', latest_interim_year, clean_title(latest_row.get('announcementTitle') or ''), latest_row.get('adjunctUrl'))

          # Select the formal issuance prospectus. A final issuance version is
          # preferred over registration or filing drafts.
          prospectus_candidates = []
          prospectus_bad = [
              '提示性公告', '发行保荐书', '上市保荐书', '法律意见', '律师工作报告',
              '审核问询', '回复', '确认意见', '招股意向书', '招股说明书摘要',
              '保荐人', '保荐机构',
          ]
          for row in announcements:
              title = clean_title(row.get('announcementTitle') or '')
              if '招股说明书' not in title or any(word in title for word in prospectus_bad) or not row.get('adjunctUrl'):
                  continue
              final_score = 100
              if '申报稿' in title:
                  final_score = 20
              elif '注册稿' in title:
                  final_score = 50
              prospectus_candidates.append((final_score, version_rank(row), row))
          if not prospectus_candidates:
              raise RuntimeError('No prospectus found')
          prospectus_candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
          prospectus_row = prospectus_candidates[0][2]
          selected.append({'kind': 'prospectus', 'year': 2020, 'label': clean_title(prospectus_row.get('announcementTitle') or ''), 'row': prospectus_row})
          note('SELECT_PROSPECTUS', clean_title(prospectus_row.get('announcementTitle') or ''), prospectus_row.get('adjunctUrl'))

          records = []
          for item in selected:
              row = item['row']
              adjunct = str(row.get('adjunctUrl') or '').lstrip('/')
              data = None
              source_url = None
              attempts = []
              for url in [f'https://static.cninfo.com.cn/{adjunct}', f'http://static.cninfo.com.cn/{adjunct}']:
                  try:
                      response = session.get(url, timeout=120, allow_redirects=True, headers={
                          'Referer': 'https://www.cninfo.com.cn/',
                          'Accept': 'application/pdf,*/*;q=0.8',
                      })
                      attempts.append({'url': url, 'status': response.status_code, 'bytes': len(response.content), 'type': response.headers.get('content-type')})
                      note('DOWNLOAD', item['kind'], item['year'], response.status_code, len(response.content), response.headers.get('content-type'), response.url)
                      if response.status_code == 200 and response.content.lstrip().startswith(b'%PDF') and len(response.content) > 100_000:
                          data = response.content
                          source_url = response.url
                          break
                  except Exception as exc:
                      attempts.append({'url': url, 'error': repr(exc)})
                      note('DOWNLOAD_ERROR', item['kind'], item['year'], url, repr(exc))
              if data is None:
                  raise RuntimeError(f"Failed to download {item['label']}: {attempts}")

              if item['kind'] == 'annual':
                  filename = f"恒玄科技_{item['year']}年年度报告.pdf"
              elif item['kind'] == 'interim':
                  filename = f"恒玄科技_{item['year']}年半年度报告.pdf"
              else:
                  filename = '恒玄科技_首次公开发行股票并在科创板上市招股说明书.pdf'
              path = PDFDIR / filename
              path.write_bytes(data)

              try:
                  doc = pymupdf.open(str(path))
                  pages = doc.page_count
                  minimum_pages = 100 if item['kind'] == 'prospectus' else 25
                  if pages < minimum_pages:
                      raise ValueError(f'Unexpectedly short document: {pages} pages')
                  sample_indices = sorted(set([0, 1, min(5, pages - 1), pages // 2, pages - 1]))
                  text = '\n'.join(doc.load_page(index).get_text('text') for index in sample_indices)
                  compact = re.sub(r'\s+', '', text)
                  if not any(key in compact for key in [SHORT_NAME, CODE, *FULL_NAMES]):
                      raise ValueError('Company identity not found in sampled pages')
                  for label, index in [('first', 0), ('middle', pages // 2), ('last', pages - 1)]:
                      pix = doc.load_page(index).get_pixmap(matrix=pymupdf.Matrix(0.8, 0.8), alpha=False)
                      pix.save(str(RENDERDIR / f"{item['kind']}_{item['year']}_{label}.png"))
                  encrypted = bool(doc.is_encrypted)
                  doc.close()
              except Exception:
                  path.unlink(missing_ok=True)
                  raise

              timestamp = int(row.get('announcementTime') or 0)
              announcement_date = dt.datetime.fromtimestamp(
                  timestamp / 1000,
                  tz=dt.timezone(dt.timedelta(hours=8)),
              ).strftime('%Y-%m-%d') if timestamp else ''
              record = {
                  'file': filename,
                  'type': item['kind'],
                  'report_year': item['year'],
                  'official_title': item['label'],
                  'announcement_date': announcement_date,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'encrypted': encrypted,
                  'source_url': source_url,
                  'adjunct_url': adjunct,
              }
              records.append(record)
              note('VALIDATED', json.dumps(record, ensure_ascii=False))

          if len(records) != 8:
              raise RuntimeError(f'Expected 8 documents, got {len(records)}')
          if len({record['sha256'] for record in records}) != 8:
              raise RuntimeError('Duplicate PDF content detected')

          type_order = {'annual': 0, 'prospectus': 1, 'interim': 2}
          records.sort(key=lambda record: (type_order[record['type']], record['report_year']))
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          readme = [
              '恒玄科技（688608.SH）上市以来全部年报、招股说明书及最新半年报',
              '',
              f'文件数量：{len(records)}份完整PDF',
              '来源：巨潮资讯网官方公告附件',
              '',
          ]
          for index, record in enumerate(records, 1):
              readme.append(f"{index}. {record['file']}｜公告日期：{record['announcement_date']}｜{record['pages']}页｜官方标题：{record['official_title']}")
          readme += [
              '',
              f'范围：上市以来2020—2025年年度报告、首次公开发行正式招股说明书、{latest_interim_year}年半年度报告。',
              '说明：若同一报告存在修订、更正或更新版本，优先采用公司后续披露的最新版；招股说明书优先采用正式发行版本。',
              '核验：已检查PDF文件头、实际页数、报告主体、加密状态及首页、中间页、末页渲染；ZIP完整性测试通过。',
              '版权归上市公司及公告发布平台所有，仅供研究参考。',
          ]
          (OUT / 'README.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text('\n'.join(f"{record['sha256']}  {record['file']}" for record in records) + '\n', encoding='utf-8')
          (OUT / 'download_log.txt').write_text('\n'.join(logs), encoding='utf-8')

          zip_path = OUT / f'hengxuan_technology_all_annual_reports_prospectus_{latest_interim_year}H1.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(PDFDIR.glob('*.pdf')):
                  archive.write(path, path.name)
              for name in ['README.txt', 'manifest.json', 'SHA256SUMS.txt']:
                  archive.write(OUT / name, name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 8:
                  raise RuntimeError(f'ZIP contains {len(pdfs)} PDFs instead of 8')
          note('FINAL_ZIP', zip_path, zip_path.stat().st_size)
          print((OUT / 'README.txt').read_text(encoding='utf-8'))
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: hengxuan-technology-final-reports
          path: hengxuan_reports/
          retention-days: 3
          if-no-files-found: error
