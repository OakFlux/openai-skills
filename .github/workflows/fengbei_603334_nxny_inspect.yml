name: inspect-fengbei-603334-nxny-report

on:
  push:
    branches:
      - tmp/fengbei-603334-broker-inspect-20261106-v1

permissions:
  contents: read

jobs:
  inspect-nxny:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect listing and report page
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          seed_urls=[
            'https://www.nxny.com/stype_xg_p27/',
            'http://www.nxny.com/stype_xg_p27/',
            'https://www3.nxny.com/stype_xg_p27/',
            'https://www.nxny.com/search/?keyword=%E4%B8%B0%E5%80%8D%E7%94%9F%E7%89%A9',
          ]
          pages=[]
          report_urls=[]
          for i,u in enumerate(seed_urls,1):
            try:
              r=s.get(u,timeout=(30,180),allow_redirects=True)
              print('SEED',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              (out/f'seed_{i}.bin').write_bytes(r.content)
              text=''
              for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030','gbk']:
                if not enc: continue
                try:
                  t=r.content.decode(enc,errors='ignore')
                  if ('丰倍生物' in t or len(t)>len(text)): text=t
                except Exception: pass
              (out/f'seed_{i}.html').write_text(text,encoding='utf-8')
              pages.append({'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content)})
              soup=BeautifulSoup(text,'html.parser')
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urllib.parse.urljoin(r.url,html.unescape(a['href']))
                if '丰倍生物' in label or '丰倍生物' in href or '603334' in label or '603334' in href:
                  print('REPORT_LINK',label,href)
                  report_urls.append(href)
              for m in re.findall(r'https?://[^\"\'<>\s]+',text,flags=re.I):
                if '603334' in m or '%E4%B8%B0%E5%80%8D' in m:
                  report_urls.append(html.unescape(m))
            except Exception as e:
              print('SEED_ERROR',i,u,repr(e))
          report_urls=list(dict.fromkeys(report_urls))
          print('REPORT_URLS',json.dumps(report_urls,ensure_ascii=False,indent=2))

          all_links=[]
          for j,u in enumerate(report_urls,1):
            try:
              r=s.get(u,timeout=(30,180),allow_redirects=True,headers={'Referer':'https://www.nxny.com/stype_xg_p27/'})
              print('REPORT',j,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              (out/f'report_{j}.bin').write_bytes(r.content)
              texts=[]
              for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030','gbk']:
                if not enc: continue
                try: texts.append(r.content.decode(enc,errors='ignore'))
                except Exception: pass
              text=max(texts,key=len) if texts else ''
              (out/f'report_{j}.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for tag in soup.find_all(True):
                for attr in ['href','src','data','data-url','data-href','data-file','value','content']:
                  v=tag.get(attr)
                  if not v: continue
                  absolute=urllib.parse.urljoin(r.url,html.unescape(str(v)).strip())
                  low=absolute.lower()
                  if any(k in low for k in ['.pdf','download','file','attach','report','603334']): links.append(absolute)
              for pat in [r'https?://[^\"\'<>\s]+',r'//[^\"\'<>\s]+',r'[A-Za-z0-9_./?=&%+-]+\.pdf(?:\?[^\"\'<>\s]*)?']:
                for m in re.findall(pat,text,flags=re.I):
                  absolute=urllib.parse.urljoin(r.url,html.unescape(m))
                  if any(k in absolute.lower() for k in ['.pdf','download','file','attach','report','603334']): links.append(absolute)
              links=list(dict.fromkeys(links)); all_links.extend(links)
              print('LINKS',j,json.dumps(links[:300],ensure_ascii=False,indent=2))
              for line in text.splitlines():
                if any(k in line.lower() for k in ['pdf','download','下载','603334','丰倍生物','附件','fileurl','filepath']):
                  line=' '.join(line.split())
                  if line and len(line)<4000: print('LINE',line)
            except Exception as e:
              print('REPORT_ERROR',j,u,repr(e))
          all_links=list(dict.fromkeys(all_links))
          (out/'summary.json').write_text(json.dumps({'pages':pages,'report_urls':report_urls,'candidate_links':all_links},ensure_ascii=False,indent=2),encoding='utf-8')

          # Probe likely direct PDF candidates discovered from page source.
          for idx,u in enumerate(all_links):
            if idx>300: break
            try:
              r=s.get(u,timeout=(20,180),allow_redirects=True,headers={'Referer':'https://www.nxny.com/','Accept':'application/pdf,*/*;q=0.8'})
              rec={'url':u,'status':r.status_code,'bytes':len(r.content),'final':r.url,'type':r.headers.get('content-type'),'prefix':r.content[:5].decode('latin-1',errors='ignore')}
              print('PROBE',json.dumps(rec,ensure_ascii=False))
              if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                (out/f'found_{idx}.pdf').write_bytes(r.content)
            except Exception as e:
              print('PROBE_ERROR',u,repr(e))
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: fengbei-603334-nxny-inspection
          path: out
          if-no-files-found: error
          retention-days: 7
