name: Probe public static files for Wuhan Fingu report

on:
  push:
    branches:
      - tmp/wuhan-fingu-broker-reports-20261023-v1
    paths:
      - .github/workflows/wuhan-fingu-static-file-probe-20261023-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe JS and static file candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p out/files
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          out=Path('out'); files=out/'files'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.sgpjbg.com/baogao/16990.html','Accept':'*/*'})
          base='https://file.sgpjbg.com/fileroot1/2020-8/10/bd630d01-ef74-4a45-81de-dac3aadb5901/'
          uuid='bd630d01-ef74-4a45-81de-dac3aadb5901'
          cover='4087a689aaba47a5ba376aeb4cb1947f'
          names=[]
          for stem in [uuid,cover,uuid+'1',uuid+'01','武汉凡谷-公司研究报告：专注基站射频三十年5G滤波器再塑发展新天地-20200810']:
              for ext in ['.pdf','.PDF','.zip','.rar','.doc','.docx','']:
                  names.append(stem+ext)
          urls=[base+n for n in names]
          urls += [
            'https://cache.sgpjbg.com/Master/view/view-mini-fz.js',
            'https://cache.sgpjbg.com/master/view/view2.js',
            'https://cache.sgpjbg.com/css/view/encoder.js',
            'https://www.sgpjbg.com/sgpjbg/View.aspx/DownLoad',
            'https://www.sgpjbg.com/BookRead.aspx?bhtype=2&url=http%3a%2f%2fwww.sgpjbg.com%2fsgpjbg%2fView.aspx%3fid%3d16990',
          ]
          records=[]
          for i,u in enumerate(dict.fromkeys(urls)):
              try:
                  if u.endswith('/DownLoad'):
                      r=s.post(u,json={'booktype':'1','bookid':'16990'},timeout=(20,120),allow_redirects=True)
                  else:
                      r=s.get(u,timeout=(20,120),allow_redirects=True)
                  rec={'i':i,'url':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'ctype':r.headers.get('content-type'),'disposition':r.headers.get('content-disposition'),'magic':r.content[:20].hex(),'sha256':hashlib.sha256(r.content).hexdigest()}
                  records.append(rec); print(json.dumps(rec,ensure_ascii=False))
                  if r.status_code==200 and len(r.content)>0:
                      ctype=(r.headers.get('content-type') or '').lower()
                      if r.content.startswith(b'%PDF-'):
                          p=files/f'{i:03d}.pdf'; p.write_bytes(r.content); rec['saved']=str(p)
                      elif 'javascript' in ctype or u.lower().endswith('.js'):
                          p=files/f'{i:03d}.js'; p.write_bytes(r.content); rec['saved']=str(p)
                          text=r.text
                          hits=[]
                          for pat in ['pdf','DownLoad','dp','file.sgpjbg','bgdown','product_id','ForceFreepage','BookRead']:
                              for m in re.finditer(pat,text,re.I): hits.append(text[max(0,m.start()-300):m.start()+800])
                          rec['snippets']=hits[:100]
                      elif len(r.content)<2_000_000:
                          p=files/f'{i:03d}.bin'; p.write_bytes(r.content); rec['saved']=str(p)
              except Exception as e:
                  records.append({'i':i,'url':u,'error':repr(e)})
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          find out -type f -printf '%p\t%s bytes\n' | sort

      - name: Upload static probe
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-static-file-probe
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error