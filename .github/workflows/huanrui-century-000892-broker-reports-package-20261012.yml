name: Build Huanrui Century 000892 broker reports package 20261012

on:
  push:
    paths:
      - '.github/workflows/huanrui-century-000892-broker-reports-package-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf beautifulsoup4

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from io import BytesIO
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE='欢瑞世纪_000892_券商公司研究报告_3份'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREVIEW=ROOT/'首页预览'; PREVIEW.mkdir(exist_ok=True)
          SOURCE=ROOT/'来源记录'; SOURCE.mkdir(exist_ok=True)
          WORK=Path('_work_huanrui'); WORK.mkdir(exist_ok=True)

          reports=[
              {
                  'order':1,
                  'kind':'original_pdf',
                  'broker':'华创证券',
                  'date':'2018-04-27',
                  'analysts':'肖丽荣',
                  'rating':'强推（维持）',
                  'title':'欢瑞世纪年报点评：头部剧艺人经纪双管齐下，多部大剧合约签订',
                  'detail_id':13812,
                  'detail_url':'https://www.fxbaogao.com/detail/13812',
                  'filename':'01_华创证券_欢瑞世纪_头部剧艺人经纪双管齐下多部大剧合约签订_公开完整页面版_2018-04-27.pdf',
                  'document_nature':'公开完整页面版；由公开逐页图片合成为PDF，不是券商原始PDF附件',
              },
              {
                  'order':2,
                  'kind':'eastmoney_pdf',
                  'broker':'民生证券',
                  'date':'2017-04-10',
                  'analysts':'胡琛、吴清羽',
                  'rating':'强烈推荐',
                  'title':'欢瑞世纪2016年年报点评：精品内容+渠道优势，业绩延续高增长',
                  'info_code':'AP201704100492893775',
                  'filename':'02_民生证券_欢瑞世纪_精品内容渠道优势业绩延续高增长_完整版_2017-04-10.pdf',
                  'document_nature':'券商原始完整PDF',
              },
              {
                  'order':3,
                  'kind':'eastmoney_pdf',
                  'broker':'国元证券',
                  'date':'2017-04-10',
                  'analysts':'孔蓉',
                  'rating':'增持',
                  'title':'欢瑞世纪：2016年业绩大增，电视剧业务为增长主力',
                  'info_code':'AP201704100492757285',
                  'filename':'03_国元证券_欢瑞世纪_2016年业绩大增电视剧业务为增长主力_完整版_2017-04-10.pdf',
                  'document_nature':'券商原始完整PDF',
              },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def get_bytes(url:str,referer:str,minimum:int=50000)->bytes:
              last=None
              for attempt in range(7):
                  try:
                      r=s.get(url,timeout=(25,180),allow_redirects=True,headers={
                          'User-Agent':s.headers['User-Agent'],'Referer':referer,
                          'Accept':'application/pdf,image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                      })
                      last={'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'final':r.url}
                      if r.status_code==200 and len(r.content)>=minimum:
                          return r.content
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(1+attempt)
              raise RuntimeError(f'download failed {url}: {last}')

          def build_fxbaogao_pdf(report:dict,dest:Path)->dict:
              detail_url=report['detail_url']
              html_bytes=get_bytes(detail_url,'https://www.fxbaogao.com/',minimum=10000)
              html_text=html_bytes.decode('utf-8','replace')
              (SOURCE/f"{report['order']:02d}_fxbaogao_{report['detail_id']}.html").write_text(html_text,encoding='utf-8')
              soup=BeautifulSoup(html_text,'html.parser')
              first=''
              for img in soup.find_all('img',src=True):
                  src=img.get('src') or ''
                  if f"/{report['detail_id']}-1." in src:
                      first=src.split('?')[0]
                      if first.startswith('//'): first='https:'+first
                      elif first.startswith('/'): first='https://www.fxbaogao.com'+first
                      break
              if not first:
                  raise RuntimeError('could not locate first public report page image')
              m=re.match(r'(.+/)'+str(report['detail_id'])+r'-1\.(png|jpg|jpeg|webp)$',first,re.I)
              if not m:
                  raise RuntimeError('unexpected image URL: '+first)
              base=m.group(1)+str(report['detail_id'])+'-'; ext=m.group(2)
              image_paths=[]; page_meta=[]
              report_work=WORK/f"fx_{report['detail_id']}"; report_work.mkdir(exist_ok=True)
              for page in range(1,81):
                  url=f'{base}{page}.{ext}'
                  try:
                      raw=get_bytes(url,detail_url,minimum=5000)
                      with Image.open(BytesIO(raw)) as im:
                          im.load(); width,height=im.size
                          if width<700 or height<900:
                              break
                          rgba=im.convert('RGBA')
                          bg=Image.new('RGBA',rgba.size,(255,255,255,255)); bg.alpha_composite(rgba)
                          rgb=bg.convert('RGB')
                          jpg=report_work/f'{page:03d}.jpg'; rgb.save(jpg,'JPEG',quality=95,subsampling=0)
                          image_paths.append(jpg)
                          page_meta.append({'page':page,'url':url,'bytes':len(raw),'width':width,'height':height,'sha256':hashlib.sha256(raw).hexdigest()})
                  except Exception:
                      break
                  time.sleep(.04)
              if len(image_paths)<2:
                  raise RuntimeError(f'too few public pages for report {report["detail_id"]}: {len(image_paths)}')
              images=[Image.open(p).convert('RGB') for p in image_paths]
              try:
                  images[0].save(dest,save_all=True,append_images=images[1:],resolution=150.0,quality=95)
              finally:
                  for im in images: im.close()
              return {'detail_url':detail_url,'first_image_url':first,'page_images':page_meta,'public_page_count':len(image_paths)}

          manifest=[]
          for report in reports:
              dest=ROOT/report['filename']
              source_meta={}
              if report['kind']=='eastmoney_pdf':
                  code=report['info_code']
                  url=f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf'
                  raw=get_bytes(url,'https://data.eastmoney.com/report/',minimum=50000)
                  if raw[:5]!=b'%PDF-': raise RuntimeError('not PDF: '+url)
                  dest.write_bytes(raw)
                  source_meta={'source_report_page':f'https://data.eastmoney.com/report/info/{code}.html','pdf_url':url}
              else:
                  source_meta=build_fxbaogao_pdf(report,dest)

              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<2: raise RuntimeError(f'too few PDF pages: {dest.name} {pages}')
              text=''
              for p in reader.pages[:min(8,pages)]:
                  try: text+='\n'+(p.extract_text() or '')
                  except Exception: pass
              # Image-only first report may not expose searchable text; metadata and source page are retained.
              if report['kind']=='eastmoney_pdf' and not any(x in text for x in ['欢瑞世纪','000892']):
                  raise RuntimeError('issuer identity check failed: '+dest.name)
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREVIEW/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('preview render failed: '+dest.name)
              sha=hashlib.sha256(dest.read_bytes()).hexdigest()
              manifest.append({**report,**source_meta,'pages':pages,'bytes':dest.stat().st_size,'sha256':sha,'preview_file':str(Path('首页预览')/preview.name),'validation':['issuer/title metadata','PDF page count','qpdf structure','first-page render']})

          readme=[
              '欢瑞世纪联合股份有限公司（000892.SZ）券商公司研究报告资料包',
              '整理日期：2026-10-12',
              '',
              '公开检索到的欢瑞世纪直接券商覆盖较少，未发现近期长篇公司深度报告。',
              '本包因此收录3份与欢瑞世纪直接相关的券商公司研究/年报点评报告：2份券商原始完整PDF，以及1份公开完整页面合成PDF。',
              '所有文件均来自无需登录即可公开访问的页面或附件，未绕过账户、会员或付费限制。',
              '',
          ]
          for i,x in enumerate(manifest,1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   文件性质：{x['document_nature']}；页数：{x['pages']}页",
                  f"   SHA-256：{x['sha256']}",
                  '',
              ]
          readme += [
              '报告版权及观点归原券商和研究员所有，仅供研究参考，不构成投资建议。',
              '包内另附来源HTML、首页预览、manifest.json及SHA256SUMS.txt。',
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3: raise RuntimeError(f'ZIP validation failed: bad={bad}, pdfs={len(pdfs)}')
          short=Path('huanrui_broker_reports.zip'); short.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: huanrui-century-000892-broker-reports-final
          path: |
            欢瑞世纪_000892_券商公司研究报告_3份.zip
            huanrui_broker_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
