name: Create final Loongson report package

on:
  push:
    paths:
      - '.github/workflows/package-loongson-final-simple-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Download and package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests

          package = '龙芯中科_688047_所有年报_招股说明书_最新季报_20261015'
          root = Path(package)
          pdf_dir = root / 'PDF文件'
          check_dir = root / '验证记录'
          pdf_dir.mkdir(parents=True, exist_ok=True)
          check_dir.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  'kind':'招股说明书',
                  'title':'龙芯中科首次公开发行股票并在科创板上市招股说明书',
                  'date':'2022-06-21',
                  'filename':'01_龙芯中科_首次公开发行股票并在科创板上市招股说明书.pdf',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2022-06-21/1213762762.PDF',
                  'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2022-06-21/688047_20220621_1_Et2DxLXX.pdf',
              },
              {
                  'kind':'年度报告','year':2022,'title':'龙芯中科2022年年度报告','date':'2023-04-26',
                  'filename':'02_龙芯中科_2022年年度报告.pdf',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2023-04-26/1216596471.PDF',
                  'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2023-04-26/688047_20230426_QB77.pdf',
              },
              {
                  'kind':'年度报告','year':2023,'title':'龙芯中科2023年年度报告','date':'2024-04-27',
                  'filename':'03_龙芯中科_2023年年度报告.pdf',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2024-04-27/1219882942.PDF',
                  'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2024-04-27/688047_20240427_S07G.pdf',
              },
              {
                  'kind':'年度报告','year':2024,'title':'龙芯中科2024年年度报告','date':'2025-04-29',
                  'filename':'04_龙芯中科_2024年年度报告.pdf',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2025-04-29/1223391254.PDF',
                  'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2025-04-29/688047_20250429_YWG5.pdf',
              },
              {
                  'kind':'年度报告','year':2025,'title':'龙芯中科2025年年度报告','date':'2026-04-29',
                  'filename':'05_龙芯中科_2025年年度报告.pdf',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2026-04-29/1225234886.PDF',
                  'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-29/688047_20260429_EN5Q.pdf',
              },
              {
                  'kind':'最新季报','year':2026,'title':'龙芯中科2026年第一季度报告','date':'2026-04-29',
                  'filename':'06_龙芯中科_2026年第一季度报告_最新季报.pdf',
                  'cninfo':'https://static.cninfo.com.cn/finalpage/2026-04-29/1225234957.PDF',
                  'sse':'https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-04-29/688047_20260429_G5UF.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download(doc, target):
              candidates = [
                  ('巨潮资讯官方静态披露文件', doc['cninfo']),
                  ('巨潮资讯官方静态披露文件HTTP', doc['cninfo'].replace('https://','http://',1)),
                  ('上海证券交易所官方文件', doc['sse']),
              ]
              attempts = []
              for source, url in candidates:
                  for attempt in range(1, 4):
                      try:
                          r = session.get(url, headers={
                              'User-Agent':session.headers['User-Agent'],
                              'Referer':'https://www.cninfo.com.cn/' if 'cninfo' in url else 'https://www.sse.com.cn/',
                              'Accept':'application/pdf,*/*;q=0.8',
                          }, timeout=240, allow_redirects=True)
                          item = {'source':source,'requested_url':url,'final_url':r.url,'status':r.status_code,
                                  'content_type':r.headers.get('content-type'),'bytes':len(r.content),'attempt':attempt}
                          attempts.append(item)
                          if r.status_code == 200 and r.content.startswith(b'%PDF') and len(r.content) > 50000:
                              target.write_bytes(r.content)
                              return source, r.url, attempts
                      except Exception as e:
                          attempts.append({'source':source,'url':url,'attempt':attempt,'error':repr(e)})
                      time.sleep(attempt)
              raise RuntimeError('Download failed: '+json.dumps({'title':doc['title'],'attempts':attempts},ensure_ascii=False))

          records = []
          seen = set()
          for doc in documents:
              path = pdf_dir / doc['filename']
              source, source_url, attempts = download(doc, path)
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen:
                  raise RuntimeError('Duplicate PDF: '+path.name)
              seen.add(sha)

              q = subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],capture_output=True,text=True)
              if q.returncode != 0:
                  raise RuntimeError('qpdf failed for '+path.name+'\n'+q.stderr[-2000:])

              info = subprocess.run(['pdfinfo',str(path)],capture_output=True,text=True)
              if info.returncode != 0:
                  raise RuntimeError('pdfinfo failed for '+path.name)
              m = re.search(r'^Pages:\s+(\d+)',info.stdout,re.M)
              if not m:
                  raise RuntimeError('Cannot read page count for '+path.name)
              pages = int(m.group(1))

              txt = check_dir / (path.stem+'_前12页.txt')
              p = subprocess.run(['pdftotext','-f','1','-l',str(min(12,pages)),'-layout',str(path),str(txt)],capture_output=True,text=True)
              if p.returncode != 0:
                  raise RuntimeError('pdftotext failed for '+path.name+'\n'+p.stderr[-2000:])
              text = txt.read_text(encoding='utf-8',errors='replace')
              compact = re.sub(r'\s+','',text)
              if '龙芯中科' not in compact and '688047' not in compact:
                  raise RuntimeError('Company identity check failed: '+path.name)
              if doc['kind'] == '招股说明书' and '招股说明书' not in compact:
                  raise RuntimeError('Prospectus check failed: '+path.name)
              if doc['kind'] == '年度报告' and (str(doc['year']) not in compact or '年度报告' not in compact):
                  raise RuntimeError('Annual report check failed: '+path.name)
              if doc['kind'] == '最新季报' and '第一季度报告' not in compact and '季度报告' not in compact:
                  raise RuntimeError('Quarterly report check failed: '+path.name)

              prefix = check_dir / (path.stem+'_首页')
              render = subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(path),str(prefix)],capture_output=True,text=True)
              png = Path(str(prefix)+'.png')
              if render.returncode != 0 or not png.exists() or png.stat().st_size < 8000:
                  raise RuntimeError('Render check failed: '+path.name)
              render_bytes = png.stat().st_size
              png.unlink()

              record = {
                  'filename':'PDF文件/'+path.name,
                  'document_type':doc['kind'],
                  'title':doc['title'],
                  'report_year':doc.get('year'),
                  'disclosure_date':doc['date'],
                  'official_sse_url':doc['sse'],
                  'download_source':source,
                  'download_url':source_url,
                  'pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'first_page_render_bytes':render_bytes,
                  'download_attempts':attempts,
              }
              records.append(record)
              print('VALIDATED',json.dumps(record,ensure_ascii=False),flush=True)

          readme = [
              '龙芯中科（688047.SH）所有年报、招股说明书及最新季报',
              '整理日期：2026-10-15','',
              '共6份完整PDF：最终版IPO招股说明书1份、2022—2025年度报告4份、2026年第一季度报告1份。',
              '年度报告仅收录全文，不收录摘要。截至2026-10-15，2026年第三季度报告尚未披露，因此最新正式季报为2026年第一季度报告；半年度报告不按季报计入。',
              '公告标题、披露日期和上交所链接均来自上海证券交易所正式披露信息；PDF下载使用巨潮资讯官方静态披露文件。','',
              '文件清单：'
          ]
          for i,r in enumerate(records,1):
              readme += [
                  f'{i}. {r["title"]}',f'   文件：{r["filename"]}',f'   披露日期：{r["disclosure_date"]}',
                  f'   页数：{r["pages"]}',f'   上交所来源：{r["official_sse_url"]}',
                  f'   PDF下载来源：{r["download_url"]}',f'   SHA-256：{r["sha256"]}',''
              ]
          (root/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')

          zip_path = Path(package+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_file():
                      z.write(f,arcname=f'{package}/{f.relative_to(root)}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != 6:
                  raise RuntimeError(f'ZIP check failed bad={bad} pdfs={len(pdfs)}')
          print('FINAL_PACKAGE',json.dumps({'filename':zip_path.name,'bytes':zip_path.stat().st_size,
                'sha256':hashlib.sha256(zip_path.read_bytes()).hexdigest(),'pdf_count':6},ensure_ascii=False),flush=True)
          PY

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: loongson-688047-all-official-reports-20261015
          path: 龙芯中科_688047_所有年报_招股说明书_最新季报_20261015.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0