name: chatgpt-temp-dazhong-stockstar-article-inspect
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-stockstar-article-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect research article pages
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python <<'PY'
          import json,re,urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          W=Path('dazhong_stockstar_articles');W.mkdir(exist_ok=True)
          pages={
            '2018_cmbi':'https://stock.stockstar.com/JC2018041300001135.shtml',
            '2017_09':'https://stock.stockstar.com/JC2017111800000442.shtml',
            '2017_anxin':'https://stock.stockstar.com/JC2017050800000675.shtml',
            '2017_steady':'https://stock.stockstar.com/JC2017042000002294.shtml',
            '2016_deep':'https://stock.stockstar.com/JC2016120600000973.shtml'}
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          out={};logs=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          for key,u in pages.items():
            r=s.get(u,timeout=90,allow_redirects=True);L(f'{key} HTTP={r.status_code} bytes={len(r.content)} type={r.headers.get("content-type")} final={r.url} apparent={r.apparent_encoding}')
            W.joinpath(key+'.html').write_bytes(r.content)
            text=r.content.decode(r.apparent_encoding or 'gb18030','ignore');soup=BeautifulSoup(text,'html.parser')
            links=[]
            for a in soup.find_all('a',href=True):
              href=urllib.parse.urljoin(r.url,a['href']);txt=' '.join(a.get_text(' ',strip=True).split())
              links.append({'text':txt,'href':href})
            srcs=[]
            for tag in soup.find_all(['script','img','iframe','embed','object']):
              for attr in ['src','data-src','data-original','data']:
                if tag.get(attr):srcs.append(urllib.parse.urljoin(r.url,tag.get(attr)))
            regex_urls=list(dict.fromkeys(re.findall(r'(?:https?:)?//[^"\'<>\s]+',text)))
            allurls=list(dict.fromkeys([x['href'] for x in links]+srcs+[('https:'+x if x.startswith('//') else x) for x in regex_urls]))
            interesting=[x for x in allurls if any(k in x.lower() for k in ['pdf','download','report','research','attachment','file','doc','cmbi','anxin','essence','xyzq'])]
            content=[]
            for sel in ['article','.article','.content','.article-content','.main-content','#content','.newsContent','.detail-content']:
              for node in soup.select(sel):
                val='\n'.join(x.strip() for x in node.get_text('\n',strip=True).splitlines() if x.strip())
                if len(val)>len(content[0]) if content else len(val)>0:content=[val]
            body='\n'.join(x.strip() for x in soup.get_text('\n',strip=True).splitlines() if x.strip())
            if not content:content=[body]
            out[key]={'url':r.url,'status':r.status_code,'title':soup.title.get_text(' ',strip=True) if soup.title else '',
              'meta':[{a:b for a,b in tag.attrs.items()} for tag in soup.find_all('meta')],
              'interesting_urls':interesting,'links':links,'content':content[0][:50000],'body':body[:100000]}
            L(key+' title='+out[key]['title'])
            L(key+' interesting='+json.dumps(interesting,ensure_ascii=False))
            L(key+' content_head='+content[0][:1500].replace('\n',' | '))
          (W/'articles.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8');(W/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Stockstar-Article-Inspect
          path: dazhong_stockstar_articles
          retention-days: 1
          compression-level: 6
