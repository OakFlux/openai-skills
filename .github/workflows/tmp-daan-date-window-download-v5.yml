name: Temporary Daan Gene date-window download v5

on:
  push:
    branches: [tmp/daan-gene-broker-reports-20260829]
    paths: [.github/workflows/tmp-daan-date-window-download-v5.yml]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests pypdf beautifulsoup4
      - name: Reverse lookup reports and download PDFs
        run: |
          mkdir -p out/pdfs
          python - <<'PY'
          import hashlib, html, json, re, time, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT=Path('out'); PDFDIR=OUT/'pdfs'; OUT.mkdir(exist_ok=True); PDFDIR.mkdir(exist_ok=True)
          log=[]
          def note(*a):
              x=' '.join(str(v) for v in a); print(x,flush=True); log.append(x)
          sess=requests.Session()
          sess.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5',
          })
          windows=[
            ('2016-02-14','2016-02-19'),
            ('2016-04-13','2016-04-19'),
            ('2016-08-28','2016-09-05'),
            ('2016-12-20','2016-12-27'),
            ('2017-04-02','2017-04-10'),
            ('2019-04-20','2019-05-10'),
            ('2020-07-12','2020-07-20'),
            ('2020-08-27','2020-09-05'),
            ('2020-10-26','2020-11-05'),
          ]
          exact_titles=[
            '分子诊断行业待爆发，龙头达安笑傲江湖',
            '定位精准医疗，核酸诊断稳定增长',
            '服务类产品收入大幅提升，积极布局基因诊断',
            '独立实验室新业态崛起，未来高增长可期',
            '业绩整体平稳增长，业务结构性变化是行业变化风向标',
            '2018年业绩表现欠佳，公共卫生参与大有可为',
            '上半年业绩超预期，公司发展迎里程碑拐点',
            '后疫情时代新冠筛查从严，下半年业绩持续受益',
            '三季度业绩超预期，产能扩建有望延续新冠优势',
          ]
          rows=[]; query_records=[]
          api='https://reportapi.eastmoney.com/report/list2'
          for begin,end in windows:
              for page in range(1,31):
                  body={
                    'beginTime':begin,'endTime':end,'industryCode':'*','ratingChange':'*',
                    'rating':'*','orgCode':'*','code':'*','rcode':'','pageSize':100,
                    'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'qType':0
                  }
                  try:
                      time.sleep(1.05)
                      r=sess.post(api,json=body,timeout=45,headers={
                        'Content-Type':'application/json','Origin':'https://data.eastmoney.com',
                        'Referer':'https://data.eastmoney.com/report/stock.jshtml'
                      })
                      obj=r.json(); data=obj.get('data') or []; total=int(obj.get('TotalPage') or 1)
                      note('EM',begin,end,'PAGE',page,'COUNT',len(data),'TOTAL',total,'STATUS',r.status_code)
                      query_records.append({'begin':begin,'end':end,'page':page,'status':r.status_code,'count':len(data),'total':total})
                      for x in data:
                          blob=json.dumps(x,ensure_ascii=False)
                          title=str(x.get('title') or '')
                          if x.get('stockCode')=='002030' or x.get('stockName')=='达安基因' or '达安基因' in blob or any(t in title for t in exact_titles):
                              rows.append(x); note('MATCH',x.get('publishDate'),x.get('orgSName'),x.get('stockCode'),title,x.get('infoCode'))
                      if page>=total or not data: break
                  except Exception as e:
                      note('EM_ERROR',begin,end,page,repr(e)); query_records.append({'begin':begin,'end':end,'page':page,'error':repr(e)}); break

          # Dedupe metadata.
          unique=[]; seen=set()
          for x in rows:
              key=x.get('infoCode') or (x.get('title'),x.get('publishDate'),x.get('orgSName'))
              if key in seen: continue
              seen.add(key); unique.append(x)
          (OUT/'eastmoney_matches.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'query_records.json').write_text(json.dumps(query_records,ensure_ascii=False,indent=2),encoding='utf-8')

          def clean(x,n=110):
              x=re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x)).strip(' ._')
              return (x or 'report')[:n]
          downloads=[]
          def validate_and_save(content, meta, source_url):
              if len(content)<1500 or not content.lstrip().startswith(b'%PDF'): return False
              h=hashlib.sha256(content).hexdigest()
              if any(d['sha256']==h for d in downloads): return True
              tmp=PDFDIR/f'_tmp_{h[:12]}.pdf'; tmp.write_bytes(content)
              try:
                  reader=PdfReader(str(tmp)); pages=len(reader.pages)
                  text=''
                  for p in reader.pages[:4]:
                      try: text+='\n'+(p.extract_text() or '')
                      except Exception: pass
              except Exception as e:
                  note('INVALID_PDF',source_url,repr(e)); tmp.unlink(missing_ok=True); return False
              if pages<2:
                  note('TOO_SHORT',source_url,pages); tmp.unlink(missing_ok=True); return False
              title=str(meta.get('title') or '达安基因研报'); org=str(meta.get('org') or '未知机构'); date=str(meta.get('date') or '')[:10]
              identity=('达安基因' in text or '002030' in text or any(t[:10] in text for t in exact_titles if t in title))
              if not identity:
                  note('IDENTITY_WARN',source_url,'PAGES',pages,'TEXT',text[:280].replace('\n',' '))
              fn=f'{date}_{clean(org,32)}_{clean(title,90)}_{pages}页.pdf'
              final=PDFDIR/fn; final.unlink(missing_ok=True); tmp.rename(final)
              downloads.append({'file':fn,'title':title,'org':org,'date':date,'pages':pages,'bytes':len(content),'sha256':h,'source_url':source_url,'identity':identity,'text_prefix':text[:400]})
              note('SAVED',fn,len(content),source_url)
              return True

          # Eastmoney attachment URLs.
          for x in unique:
              info=str(x.get('infoCode') or '').strip()
              if not info: continue
              meta={'title':x.get('title'),'org':x.get('orgSName') or x.get('orgName'),'date':x.get('publishDate')}
              for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf']:
                  try:
                      rr=sess.get(u,timeout=90,headers={'Referer':'https://data.eastmoney.com/'})
                      note('PDF_TRY',rr.status_code,len(rr.content),rr.headers.get('content-type'),u)
                      if rr.status_code==200 and validate_and_save(rr.content,meta,rr.url): break
                  except Exception as e: note('PDF_ERROR',u,repr(e))

          # Sina report pages and their /url endpoints; follow direct/embedded original URLs.
          sina=[
            ('3124306','2016-02-16','广州广证恒生证券','分子诊断行业待爆发，龙头达安笑傲江湖'),
            ('648229670402','2020-07-16','国海证券','上半年业绩超预期，公司发展迎里程碑拐点'),
            ('684425869377','2020-09-01','国海证券','2020年半年报点评：后疫情时代新冠筛查从严，下半年业绩持续受益'),
          ]
          sina_records=[]
          for rid,date,org,title in sina:
              page=f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml'
              candidates=[
                f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/url',
                f'http://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/url',
                page,
              ]
              meta={'date':date,'org':org,'title':title}
              visited=set()
              for u in candidates:
                  if u in visited: continue
                  visited.add(u)
                  try:
                      rr=sess.get(u,timeout=90,allow_redirects=True,headers={'Referer':page})
                      rec={'rid':rid,'requested':u,'status':rr.status_code,'final':rr.url,'type':rr.headers.get('content-type'),'bytes':len(rr.content),'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('Location')} for h in rr.history],'prefix':rr.text[:1000] if not rr.content.lstrip().startswith(b'%PDF') else '%PDF'}
                      sina_records.append(rec)
                      note('SINA',rid,rr.status_code,len(rr.content),rr.headers.get('content-type'),rr.url,'HIST',len(rr.history))
                      if rr.status_code==200 and validate_and_save(rr.content,meta,rr.url): break
                      txt=html.unescape(rr.text).replace('\\/','/')
                      links=set(re.findall(r'https?://[^\s"\'<>]+',txt,re.I))
                      soup=BeautifulSoup(txt,'html.parser')
                      for tag in soup.find_all(['a','iframe','embed','object','script']):
                          for attr in ['href','src','data']:
                              if tag.get(attr): links.add(urljoin(rr.url,tag.get(attr)))
                      for link in list(links):
                          link=link.rstrip('),;')
                          if link in visited or not any(k in link.lower() for k in ['pdf','report','rpt','download','attach']): continue
                          visited.add(link)
                          try:
                              q=sess.get(link,timeout=90,allow_redirects=True,headers={'Referer':rr.url})
                              note('SINA_FOLLOW',rid,q.status_code,len(q.content),q.headers.get('content-type'),q.url)
                              if q.status_code==200 and validate_and_save(q.content,meta,q.url): break
                          except Exception as e: note('SINA_FOLLOW_ERROR',rid,link,repr(e))
                  except Exception as e: note('SINA_ERROR',rid,u,repr(e))
          (OUT/'sina_records.json').write_text(json.dumps(sina_records,ensure_ascii=False,indent=2),encoding='utf-8')

          # 9FZT report landing links (sometimes expose attachment identifiers).
          report_pages=[
            ('2016-02-16','广州广证恒生证券','分子诊断行业待爆发，龙头达安笑傲江湖','508957738559'),
            ('2016-02-16','广州广证恒生证券','分子诊断行业待爆发，龙头达安笑傲江湖','ba6aeea10aa02d017368232603806f9b'),
            ('2020-07-16','国海证券','上半年业绩超预期，公司发展迎里程碑拐点','5d7cb1e6c7e03cb5b2b3905f02a30fc0'),
          ]
          nine_records=[]
          for date,org,title,cid in report_pages:
              u=f'https://www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId={cid}'
              try:
                  rr=sess.get(u,timeout=90,allow_redirects=True,headers={'Referer':'https://www.9fzt.com/'})
                  txt=html.unescape(rr.text).replace('\\/','/')
                  rec={'cid':cid,'status':rr.status_code,'final':rr.url,'type':rr.headers.get('content-type'),'bytes':len(rr.content),'prefix':txt[:1500]}
                  nine_records.append(rec); note('9FZT',cid,rr.status_code,len(rr.content),rr.url)
                  validate_and_save(rr.content,{'date':date,'org':org,'title':title},rr.url)
                  links=set(re.findall(r'https?://[^\s"\'<>]+',txt,re.I))
                  for link in links:
                      link=link.rstrip('),;')
                      if not any(k in link.lower() for k in ['.pdf','download','attach','file']): continue
                      try:
                          q=sess.get(link,timeout=90,headers={'Referer':rr.url})
                          note('9FZT_FOLLOW',cid,q.status_code,len(q.content),q.url)
                          validate_and_save(q.content,{'date':date,'org':org,'title':title},q.url)
                      except Exception as e: note('9FZT_FOLLOW_ERROR',cid,link,repr(e))
              except Exception as e: note('9FZT_ERROR',cid,repr(e))
          (OUT/'ninefzt_records.json').write_text(json.dumps(nine_records,ensure_ascii=False,indent=2),encoding='utf-8')

          # Prefer actual long/deep reports, then exact-title coverage, then date.
          def score(d):
              deep=1 if d['pages']>=20 or '深度' in d['title'] else 0
              exact=1 if any(t in d['title'] for t in exact_titles) else 0
              identity=1 if d.get('identity') else 0
              return (identity,deep,d['pages'],exact,d['date'])
          downloads.sort(key=score,reverse=True)
          selected=downloads[:3]
          keep={d['file'] for d in selected}
          for p in PDFDIR.glob('*.pdf'):
              if p.name not in keep: p.unlink()
          (OUT/'selected_reports.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          readme=['达安基因（002030）公开券商研报下载包','',f'成功下载并校验完整 PDF：{len(selected)} 份','']
          for i,d in enumerate(selected,1): readme.append(f"{i}. {d['date']}｜{d['org']}｜{d['title']}｜{d['pages']}页｜{d['bytes']}字节")
          readme += ['', '文件来自公开可直接访问的原始研报附件；版权归原发布机构及作者所有，仅供研究参考。']
          (OUT/'README.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'download_log.txt').write_text('\n'.join(log),encoding='utf-8')
          zp=OUT/'达安基因_券商深度报告.zip'
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(PDFDIR.glob('*.pdf')): z.write(p,p.name)
              for f in ['README.txt','selected_reports.json']: z.write(OUT/f,f)
          note('FINAL','COUNT',len(selected),'ZIP_BYTES',zp.stat().st_size)
          print((OUT/'README.txt').read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daan-gene-public-broker-reports-v5
          path: out/
          if-no-files-found: error
          retention-days: 3
