name: Build final Ping An Bank 000001 reports ZIP 20260927

on:
  push:
    paths:
      - '.github/workflows/pingan-bank-000001-reports-fixed-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official reports and build final ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '平安银行_000001_2020-2025年报及2026最新季报与半年报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          docs = [
              {
                  'filename': '01_平安银行_000001_2020年年度报告.pdf',
                  'title': '平安银行2020年年度报告',
                  'period': '2020年度',
                  'url': 'https://static.cninfo.com.cn/finalpage/2021-02-02/1209224370.PDF',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': '02_平安银行_000001_2021年年度报告.pdf',
                  'title': '平安银行2021年年度报告',
                  'period': '2021年度',
                  'url': 'https://static.cninfo.com.cn/finalpage/2022-03-10/1212533413.PDF',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': '03_平安银行_000001_2022年年度报告.pdf',
                  'title': '平安银行2022年年度报告',
                  'period': '2022年度',
                  'url': 'https://static.cninfo.com.cn/finalpage/2023-03-09/1216072952.PDF',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': '04_平安银行_000001_2023年年度报告.pdf',
                  'title': '平安银行2023年年度报告',
                  'period': '2023年度',
                  'url': 'https://static.cninfo.com.cn/finalpage/2024-03-15/1219306493.PDF',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': '05_平安银行_000001_2024年年度报告.pdf',
                  'title': '平安银行2024年年度报告',
                  'period': '2024年度',
                  'url': 'https://static.cninfo.com.cn/finalpage/2025-03-15/1222806505.PDF',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': '06_平安银行_000001_2025年年度报告.pdf',
                  'title': '平安银行2025年年度报告',
                  'period': '2025年度',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-03-21/1225022887.PDF',
                  'min_bytes': 1_000_000,
                  'min_pages': 100,
              },
              {
                  'filename': '07_平安银行_000001_2026年一季度报告.pdf',
                  'title': '平安银行2026年一季度报告',
                  'period': '2026年第一季度',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-04-25/1225188741.PDF',
                  'min_bytes': 200_000,
                  'min_pages': 20,
              },
              {
                  'filename': '08_平安银行_000001_2026年半年度报告.pdf',
                  'title': '平安银行2026年半年度报告',
                  'period': '截至2026年6月30日止六个月',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-08-15/1225475344.PDF',
                  'min_bytes': 800_000,
                  'min_pages': 80,
              },
          ]

          def download_pdf(doc: dict, dest: Path) -> str:
              errors: list[str] = []
              for attempt in range(1, 5):
                  tmp = dest.with_suffix(dest.suffix + '.part')
                  try:
                      with session.get(
                          doc['url'],
                          headers={'Referer': 'https://www.cninfo.com.cn/'},
                          stream=True,
                          allow_redirects=True,
                          timeout=(30, 600),
                      ) as response:
                          print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, response.url, flush=True)
                          response.raise_for_status()
                          with tmp.open('wb') as fh:
                              for chunk in response.iter_content(chunk_size=1024 * 1024):
                                  if chunk:
                                      fh.write(chunk)
                      size = tmp.stat().st_size
                      with tmp.open('rb') as fh:
                          header = fh.read(8)
                      if size < doc['min_bytes'] or not header.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF: size={size}, header={header!r}')
                      tmp.replace(dest)
                      return str(response.url)
                  except Exception as exc:
                      tmp.unlink(missing_ok=True)
                      errors.append(f'attempt {attempt}: {exc!r}')
                      time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()

          for doc in docs:
              dest = OUT / doc['filename']
              source_url = download_pdf(doc, dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')
              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')
              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '平安银行股份有限公司（000001.SZ）2020—2025年年度报告及2026年最新季报/半年报',
              '整理日期：2026-09-27',
              '',
              '收录内容：2020—2025年完整年度报告、2026年一季度报告及2026年半年度报告。',
              '资料来源：中国证监会指定信息披露平台巨潮资讯。',
              '所有PDF均完成文件头、文件大小、页数、qpdf结构、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   报告期：{rec['period']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   官方来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与官方来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 8:
                  raise RuntimeError(f'expected 8 PDFs, found {len(pdf_names)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(pdf_names), 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: pingan-bank-000001-final-package-20260927
          path: 平安银行_000001_2020-2025年报及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
