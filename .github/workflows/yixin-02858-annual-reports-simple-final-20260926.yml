name: Build simple final Yixin Group annual reports ZIP 20260926

on:
  push:
    paths:
      - '.github/workflows/yixin-02858-annual-reports-simple-final-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install Python packages
        run: python -m pip install --quiet requests pypdf

      - name: Download and package official PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import time
          import traceback
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          package_name = '易鑫集团_02858_2020-2025年报及最新阶段性财务报告'
          root = Path(package_name)
          root.mkdir(exist_ok=True)

          documents = [
              {'order': 1, 'title': '2020年年度报告', 'period': '2020年度', 'release_date': '2021-04-01', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2021/0401/2021040103775_c.pdf'},
              {'order': 2, 'title': '2021年年度报告', 'period': '2021年度', 'release_date': '2022-04-14', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2022/0414/2022041400902_c.pdf'},
              {'order': 3, 'title': '2022年年度报告', 'period': '2022年度', 'release_date': '2023-03-13', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2023/0313/2023031300322_c.pdf'},
              {'order': 4, 'title': '2023年年度报告', 'period': '2023年度', 'release_date': '2024-03-08', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0308/2024030800776_c.pdf'},
              {'order': 5, 'title': '2024年年度报告', 'period': '2024年度', 'release_date': '2025-03-13', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0313/2025031300380_c.pdf'},
              {'order': 6, 'title': '2025年年度报告', 'period': '2025年度', 'release_date': '2026-03-25', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0325/2026032502020_c.pdf'},
              {'order': 7, 'title': '2026年中期报告', 'period': '截至2026年6月30日止六个月', 'release_date': '2026-09-01', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0901/2026090102626_c.pdf'},
              {'order': 8, 'title': '2026年第一季度未经审核业务更新', 'period': '2026年第一季度', 'release_date': '2026-05-12', 'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0512/2026051201235_c.pdf'},
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          def download_pdf(url: str) -> tuple[bytes, dict]:
              candidates = [url, url.replace('www1.hkexnews.hk', 'www.hkexnews.hk')]
              last = None
              for candidate in candidates:
                  for attempt in range(6):
                      try:
                          response = session.get(candidate, timeout=(30, 600), allow_redirects=True)
                          last = {
                              'requested_url': candidate,
                              'status': response.status_code,
                              'final_url': response.url,
                              'content_type': response.headers.get('content-type', ''),
                              'bytes': len(response.content),
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 20000:
                              return response.content, last
                      except Exception as exc:
                          last = {'requested_url': candidate, 'error': repr(exc)}
                      time.sleep(2 + attempt)
              raise RuntimeError(f'Unable to download {url}: {last}')

          manifest = []
          errors = []
          for document in documents:
              try:
                  data, download_meta = download_pdf(document['url'])
                  filename = f"{document['order']:02d}_{document['title']}_港交所官方原件.pdf"
                  path = root / filename
                  path.write_bytes(data)

                  pages = None
                  pdf_parse_error = None
                  try:
                      pages = len(PdfReader(str(path), strict=False).pages)
                  except Exception as exc:
                      pdf_parse_error = repr(exc)

                  sha256 = hashlib.sha256(data).hexdigest()
                  manifest.append({
                      **document,
                      'file': filename,
                      'bytes': len(data),
                      'pages': pages,
                      'sha256': sha256,
                      'download': download_meta,
                      'pdf_parse_error': pdf_parse_error,
                      'header_valid': data[:5] == b'%PDF-',
                  })
                  time.sleep(1.5)
              except Exception as exc:
                  errors.append({'document': document, 'error': repr(exc), 'traceback': traceback.format_exc()})

          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'download_errors.json').write_text(json.dumps(errors, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['file']}\n" for item in manifest), encoding='utf-8')

          readme = [
              '易鑫集团有限公司（02858.HK）2020—2025年年度报告及最新阶段性财务报告',
              '整理日期：2026-09-26',
              '',
              '本包文件均来自香港交易所披露易官方PDF。',
              '包括2020—2025年六份年度报告、2026年中期报告，以及2026年第一季度未经审核业务更新。',
              '香港上市公司通常以中期报告及自愿业务更新代替A股口径的一季报和三季报，因此同时保留最新中期报告和季度业务更新。',
              '',
              '文件清单：',
          ]
          for index, item in enumerate(manifest, 1):
              page_text = f"{item['pages']}页" if item['pages'] is not None else '页数解析未完成'
              readme.extend([
                  f"{index}. {item['title']}",
                  f"   报告期：{item['period']}；披露日期：{item['release_date']}；{page_text}",
                  f"   港交所官方来源：{item['download'].get('final_url', item['url'])}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ])
          if errors:
              readme.extend(['未成功下载的文件：', json.dumps(errors, ensure_ascii=False, indent=2)])
          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')

          if len(manifest) != len(documents):
              raise RuntimeError(f'Only downloaded {len(manifest)} of {len(documents)} PDFs. See download_errors.json')

          zip_path = Path(package_name + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{package_name}/{path.relative_to(root)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdf_count = sum(name.lower().endswith('.pdf') for name in archive.namelist())
              if pdf_count != 8:
                  raise RuntimeError(f'Expected 8 PDFs, found {pdf_count}')

          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          print(f'FINAL_ZIP={zip_path} BYTES={zip_path.stat().st_size} SHA256={zip_sha}')
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yixin-02858-annual-reports-simple-final
          path: 易鑫集团_02858_2020-2025年报及最新阶段性财务报告.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
