name: Quick Ningbo Port direct PDF check 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-quick-api-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check six likely public PDF URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          out=Path('quick_out'); out.mkdir()
          urls=[
            'https://public.fxbaogao.com/report/2019/08/31/1422001.pdf',
            'https://public.fxbaogao.com/report-cn/2019/08/31/1422001.pdf',
            'https://public.fxbaogao.com/report-en/2019/08/31/1422001.pdf',
            'https://public.fxbaogao.com/report/2019/09/07/1422001.pdf',
            'https://public.fxbaogao.com/report-cn/2019/09/07/1422001.pdf',
            'https://public.fxbaogao.com/report-en/2019/09/07/1422001.pdf',
          ]
          rows=[]
          for i,u in enumerate(urls,1):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/view?id=1422001','Accept':'application/pdf,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=8) as r:
                raw=r.read(); row={'url':u,'status':r.status,'final_url':r.geturl(),'bytes':len(raw),'content_type':r.headers.get('content-type'),'prefix':raw[:8].hex()}
              print(json.dumps(row,ensure_ascii=False),flush=True); rows.append(row)
              (out/f'raw_{i:02d}.bin').write_bytes(raw)
              if raw.startswith(b'%PDF-') and len(raw)>50000:
                (out/'FOUND_宁波港_国泰君安_首次覆盖_2019.pdf').write_bytes(raw)
                break
            except Exception as e:
              row={'url':u,'error':repr(e)}; print(json.dumps(row,ensure_ascii=False),flush=True); rows.append(row)
          (out/'records.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-fxbaogao-quick-api
          path: quick_out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
