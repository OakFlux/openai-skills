name: Quick Ningbo Port fxbaogao API inspect 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-quick-api-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query public search API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          out=Path('quick_out'); out.mkdir()
          queries=['宁波港','市场份额提升 码头结构优化','非凡大港斩获殊勋茂绩','依托浙江海洋经济区','港口翘楚 增长稳定']
          ep='https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          allrows={}
          for i,q in enumerate(queries,1):
              data=json.dumps({'keywords':q,'pageIndex':1,'pageSize':20,'order':1,'nop':-1},ensure_ascii=False).encode()
              req=urllib.request.Request(ep,data=data,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read()
                  (out/f'search_{i}.json').write_bytes(raw)
                  j=json.loads(raw)
                  print('QUERY',q,'CODE',j.get('code'),'MSG',j.get('msg'),flush=True)
                  rows=((j.get('data') or {}).get('dataList') or [])
                  print('ROWS',len(rows),flush=True)
                  for row in rows:
                      print('ROW',json.dumps(row,ensure_ascii=False),flush=True)
                      did=str(row.get('docId') or row.get('id') or row.get('reportId') or '')
                      if did: allrows[did]=row
              except Exception as e:
                  print('ERR',q,repr(e),flush=True)
          (out/'all_rows.json').write_text(json.dumps(allrows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-fxbaogao-quick-api
          path: quick_out
          retention-days: 7
          if-no-files-found: error
