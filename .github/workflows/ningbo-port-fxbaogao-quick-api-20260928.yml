name: Query Ningbo Port public report metadata 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-quick-api-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query anonymous report search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path
          out=Path('quick_out'); out.mkdir()
          ep='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          bodies=[
            {'docId':1422001,'pageNum':1,'pageSize':10,'order':1},
            {'docId':1422001,'pageNum':1,'pageSize':10,'order':'1'},
            {'keywords':'宁波港','pageNum':1,'pageSize':50,'order':1},
            {'keywords':'宁波港','pageNum':1,'pageSize':50,'order':'1'},
            {'advancedQuery':True,'advancedRequest':{'title':'宁波港'},'pageNum':1,'pageSize':50,'order':1},
            {'keywords':'市场份额提升 码头结构优化','pageNum':1,'pageSize':20,'order':1},
          ]
          records=[]
          for i,body in enumerate(bodies,1):
            data=json.dumps(body,ensure_ascii=False).encode('utf-8')
            req=urllib.request.Request(ep,data=data,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=40) as r:
                raw=r.read(); info={'i':i,'body':body,'status':r.status,'bytes':len(raw),'content_type':r.headers.get('content-type')}
              (out/f'response_{i:02d}.json').write_bytes(raw)
              print('RESULT',json.dumps(info,ensure_ascii=False),flush=True)
              print(raw[:30000].decode('utf-8','replace'),flush=True)
              records.append(info)
            except Exception as e:
              info={'i':i,'body':body,'error':repr(e)}; print('ERR',json.dumps(info,ensure_ascii=False),flush=True); records.append(info)
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-fxbaogao-quick-api
          path: quick_out
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
