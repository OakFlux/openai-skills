name: List Ningbo Port broker research candidates 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-quick-api-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query and rank exact company research
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, urllib.request, html, re
          from pathlib import Path

          out=Path('quick_out'); out.mkdir()
          ep='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json,*/*'}

          bodies=[]
          for page in range(1,7):
              bodies.append({'stockCodes':['601018'],'pageNum':page,'pageSize':100,'order':1})
          for page in range(1,4):
              bodies.append({'advancedQuery':True,'advancedRequest':{'title':'宁波港'},'pageNum':page,'pageSize':100,'order':1})
          exact_queries=[
              '非凡大港斩获殊勋茂绩 多重政策催发上行量能',
              '依托浙江海洋经济区 成长性卓越的综合性大港',
              '港口翘楚 增长稳定',
              '腹地资源 水深优势成就国际综合大港',
              '守正出奇的综合港口物流运营商',
              '市场份额提升 码头结构优化',
          ]
          for q in exact_queries:
              bodies.append({'keywords':q,'pageNum':1,'pageSize':50,'order':1})

          allrows={}
          for i,body in enumerate(bodies,1):
              data=json.dumps(body,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(ep,data=data,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read()
                  (out/f'response_{i:02d}.json').write_bytes(raw)
                  j=json.loads(raw)
                  rows=((j.get('data') or {}).get('dataList') or [])
                  print('QUERY',i,'ROWS',len(rows),'BODY',json.dumps(body,ensure_ascii=False),flush=True)
                  for row in rows:
                      did=str(row.get('docId') or '')
                      if did:
                          allrows[did]=row
              except Exception as e:
                  print('ERR',i,json.dumps(body,ensure_ascii=False),repr(e),flush=True)

          def clean(x):
              return re.sub(r'<[^>]+>','',html.unescape(str(x or ''))).strip()

          candidates=[]
          for row in allrows.values():
              title=clean(row.get('title'))
              stocks=row.get('stocks') or []
              exact_stock=any(str(s.get('key'))=='601018' for s in stocks if isinstance(s,dict))
              if not exact_stock and '宁波港' not in title and '宁波舟山港' not in title:
                  continue
              org=clean(row.get('orgName'))
              pages=int(row.get('pageNum') or 0)
              doc_type=row.get('docType')
              report_type=row.get('reportType')
              is_not_broker=bool(row.get('isNotBroker'))
              is_financial=('财报' in org or doc_type==5 or report_type==16)
              is_minutes=('调研' in title or '会议纪要' in title or '说明会' in title)
              is_commentary=any(k in title for k in ['点评','季报','年报','中报','半年报','一季报','三季报'])
              deep_title=any(k in title for k in ['深度','首次覆盖','新股研究','公司研究','综合港口物流运营商','核心竞争力','公司分析'])
              broker_ok=(not is_not_broker and not is_financial and org not in ('未知机构','发现报告','头豹研究院','浙江海港','财报',''))
              if not broker_ok or is_minutes:
                  continue
              score=0
              score += 100 if deep_title else 0
              score += min(pages,60)*2
              score -= 50 if is_commentary else 0
              score += 15 if doc_type==1 else 0
              score += 10 if report_type==11 else 0
              candidates.append({
                  'docId':row.get('docId'),'title':title,'orgName':org,'authors':row.get('authors'),
                  'date':row.get('pubTimeStr'),'pages':pages,'pdfPath':row.get('pdfPath'),
                  'docType':doc_type,'reportType':report_type,'isDeep':row.get('isDeep'),
                  'isNotBroker':is_not_broker,'stocks':stocks,'score':score,
              })
          candidates.sort(key=lambda x:(x['score'],x['pages'],x['date'] or ''),reverse=True)
          (out/'candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CANDIDATE_COUNT',len(candidates),flush=True)
          for rec in candidates[:80]:
              print('CANDIDATE',json.dumps(rec,ensure_ascii=False),flush=True)
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-broker-candidates
          path: quick_out
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
