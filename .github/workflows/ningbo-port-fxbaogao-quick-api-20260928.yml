name: Quick Ningbo Port fxbaogao direct PDF inspect 20260928

on:
  push:
    paths:
      - '.github/workflows/ningbo-port-fxbaogao-quick-api-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check direct PDF paths and anonymous APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.request, urllib.error
          from pathlib import Path
          out=Path('quick_out'); out.mkdir()
          ua={'User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/view?id=1422001','Accept':'application/json,application/pdf,*/*'}

          def get(url, name, timeout=20):
              req=urllib.request.Request(url,headers=ua)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read(); info={'url':url,'status':r.status,'final_url':r.geturl(),'bytes':len(raw),'content_type':r.headers.get('content-type'),'prefix':raw[:8].hex()}
                  print('GET',json.dumps(info,ensure_ascii=False),flush=True)
                  ext='pdf' if raw.startswith(b'%PDF-') else 'json' if 'json' in str(info['content_type']) else 'txt'
                  (out/f'{name}.{ext}').write_bytes(raw)
                  return raw,info
              except Exception as e:
                  info={'url':url,'error':repr(e)}; print('GETERR',json.dumps(info,ensure_ascii=False),flush=True); return b'',info

          def post(url, body, name):
              data=json.dumps(body,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,headers={**ua,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(); info={'url':url,'body':body,'status':r.status,'final_url':r.geturl(),'bytes':len(raw),'content_type':r.headers.get('content-type'),'prefix':raw[:8].hex()}
                  print('POST',json.dumps(info,ensure_ascii=False),flush=True); print(raw[:5000].decode('utf-8','replace'),flush=True)
                  (out/f'{name}.json').write_bytes(raw); return raw,info
              except Exception as e:
                  info={'url':url,'body':body,'error':repr(e)}; print('POSTERR',json.dumps(info,ensure_ascii=False),flush=True); return b'',info

          records=[]
          api='https://api.fxbaogao.com'
          for i,u in enumerate([
              f'{api}/mofoun/report/searchReportData/detail/anon?chartId=1422001&needParas=0',
              f'{api}/mofoun/report/searchReportData/detail/anon?chartId=1422001&needParas=1',
              f'{api}/mofoun/report/report/getReportPreviewImages?reportId=1422001',
              f'{api}/mofoun/report/readReport/readReport?reportId=1422001',
              f'{api}/mofoun/report/report/file/downloadReport?reportId=1422001',
              f'{api}/mofoun/report/report/report/preDownV2?reportId=1422001',
          ],1):
              raw,info=get(u,f'api_get_{i:02d}'); records.append(info)
          for i,b in enumerate([{'reportId':1422001},{'docId':1422001},{'id':1422001}],1):
              raw,info=post(f'{api}/mofoun/report/searchReport/detail',b,f'api_post_{i:02d}'); records.append(info)

          urls=[]
          for prefix in ('report','report-cn','report-en'):
              for date in ('2019/08/31','2019/09/07'):
                  urls += [
                    f'https://public.fxbaogao.com/{prefix}/{date}/1422001.pdf',
                    f'https://public.fxbaogao.com/{prefix}/{date}/1422001-1.pdf',
                    f'https://public.fxbaogao.com/{prefix}/{date}/1422001_1.pdf',
                  ]
          for i,u in enumerate(urls,1):
              raw,info=get(u,f'file_{i:02d}',12); records.append(info)
              if raw.startswith(b'%PDF-') and len(raw)>50000:
                  print('FOUND_DIRECT_PDF',u,len(raw),flush=True)
                  (out/f'FOUND_1422001_{i:02d}.pdf').write_bytes(raw)
                  break
          (out/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ningbo-port-fxbaogao-quick-api
          path: quick_out
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
