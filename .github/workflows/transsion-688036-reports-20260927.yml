name: Build Transsion Holdings 688036 reports ZIP 20260927

on:
  push:
    paths:
      - '.github/workflows/transsion-688036-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Discover official reports, download PDFs and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          STOCK = '688036'
          COMPANY = '传音控股'
          FULL_COMPANY = '深圳传音控股股份有限公司'
          TODAY = '2026-09-27'
          PACKAGE = '传音控股_688036_2020-2025年报及2026最新季报与半年报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def parse_json_or_jsonp(text: str):
              text = text.strip().lstrip('\ufeff')
              if text.startswith('{') or text.startswith('['):
                  return json.loads(text)
              match = re.search(r'^[^(]*\((.*)\)\s*;?$', text, flags=re.S)
              if match:
                  return json.loads(match.group(1))
              raise ValueError('unrecognized JSON/JSONP response')

          def clean_title(value: str) -> str:
              value = re.sub(r'<[^>]+>', '', value or '')
              value = value.replace('&nbsp;', '').replace('&#32;', '')
              return re.sub(r'\s+', '', value)

          def normalize_row(row: dict, source: str) -> dict:
              title = row.get('TITLE') or row.get('title') or row.get('announcementTitle') or row.get('bulletinTitle') or ''
              url = row.get('URL') or row.get('url') or row.get('adjunctUrl') or row.get('bulletinUrl') or ''
              date = row.get('SSEDATE') or row.get('date') or row.get('announcementTime') or row.get('bulletinDate') or ''
              return {
                  'title': clean_title(str(title)),
                  'url': str(url),
                  'date': str(date),
                  'source': source,
              }

          def query_sse() -> list[dict]:
              endpoint = 'https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
              rows: list[dict] = []
              for page in range(1, 8):
                  params = {
                      'isPagination': 'true',
                      'productId': STOCK,
                      'keyWord': '',
                      'securityType': '0101,120100,020100,020200,120200',
                      'reportType2': 'DQBG',
                      'reportType': '',
                      'beginDate': '2021-01-01',
                      'endDate': TODAY,
                      'pageHelp.pageSize': '100',
                      'pageHelp.pageCount': '50',
                      'pageHelp.pageNo': str(page),
                      'pageHelp.beginPage': str(page),
                      'pageHelp.cacheSize': '1',
                      'pageHelp.endPage': str(page + 4),
                      '_': str(int(time.time() * 1000)),
                  }
                  headers = {
                      'Referer': f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK}',
                      'Accept': 'application/json,text/javascript,*/*;q=0.8',
                  }
                  response = session.get(endpoint, params=params, headers=headers, timeout=60)
                  print('SSE_QUERY', page, response.status_code, len(response.content), response.url, flush=True)
                  response.raise_for_status()
                  data = parse_json_or_jsonp(response.text)
                  page_rows = data.get('result') or data.get('pageHelp', {}).get('data') or data.get('data') or []
                  if not page_rows:
                      break
                  rows.extend(normalize_row(row, 'SSE') for row in page_rows)
                  if len(page_rows) < 100:
                      break
                  time.sleep(0.4)
              return rows

          def query_cninfo_without_org() -> list[dict]:
              # Some CNINFO deployments accept stock code alone; this is only a fallback.
              endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              categories = [
                  'category_ndbg_szsh;',
                  'category_yjdbg_szsh;',
                  'category_bndbg_szsh;',
                  'category_sjdbg_szsh;',
              ]
              rows: list[dict] = []
              for category in categories:
                  payload = {
                      'pageNum': '1',
                      'pageSize': '30',
                      'column': 'sse',
                      'tabName': 'fulltext',
                      'plate': 'sh',
                      'stock': STOCK,
                      'searchkey': '',
                      'secid': '',
                      'category': category,
                      'trade': '',
                      'seDate': f'2021-01-01~{TODAY}',
                      'sortName': 'time',
                      'sortType': 'desc',
                      'isHLtitle': 'false',
                  }
                  try:
                      response = session.post(
                          endpoint,
                          data=payload,
                          headers={
                              'Referer': f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK}',
                              'Origin': 'https://www.cninfo.com.cn',
                              'X-Requested-With': 'XMLHttpRequest',
                          },
                          timeout=60,
                      )
                      print('CNINFO_FALLBACK', category, response.status_code, len(response.content), flush=True)
                      response.raise_for_status()
                      data = response.json()
                      for row in data.get('announcements') or []:
                          rows.append(normalize_row(row, 'CNINFO'))
                  except Exception as exc:
                      print('CNINFO_FALLBACK_WARNING', category, repr(exc), flush=True)
              return rows

          try:
              all_rows = query_sse()
          except Exception as exc:
              print('SSE_FATAL', repr(exc), flush=True)
              all_rows = []

          if not all_rows:
              all_rows = query_cninfo_without_org()

          unique: dict[tuple[str, str], dict] = {}
          for row in all_rows:
              if row['title'] and row['url']:
                  unique[(row['title'], row['url'])] = row
          all_rows = list(unique.values())

          print('DISCLOSURE_CANDIDATES_BEGIN', flush=True)
          for row in sorted(all_rows, key=lambda item: item['date'], reverse=True):
              print(json.dumps(row, ensure_ascii=False), flush=True)
          print('DISCLOSURE_CANDIDATES_END', flush=True)

          def date_key(row: dict) -> int:
              digits = re.sub(r'\D', '', row.get('date', ''))
              try:
                  return int(digits or 0)
              except Exception:
                  return 0

          def is_full_report(title: str) -> bool:
              bad = (
                  '摘要', '英文版', '审计报告', '内部控制', '社会责任', '环境、社会',
                  'ESG', '董事会工作', '监事会工作', '取消', '提示性公告',
                  '财务报表', '更正公告', '专项报告', '问询函', '回复公告',
              )
              return not any(term in title for term in bad)

          def annual_match(title: str, year: int) -> bool:
              patterns = (
                  f'{year}年年度报告',
                  f'{year}年度报告',
              )
              return any(pattern in title for pattern in patterns) and is_full_report(title)

          def make_url_variants(row: dict) -> list[str]:
              raw = row['url'].strip()
              urls: list[str] = []
              if raw.startswith('http://') or raw.startswith('https://'):
                  urls.append(raw)
              elif row['source'] == 'CNINFO' or raw.startswith('finalpage/'):
                  urls.append('https://static.cninfo.com.cn/' + raw.lstrip('/'))
              else:
                  path = '/' + raw.lstrip('/')
                  urls.append('https://www.sse.com.cn' + path)
                  urls.append('https://static.sse.com.cn' + path)

              expanded: list[str] = []
              for url in urls:
                  expanded.append(url)
                  if 'www.sse.com.cn/disclosure/' in url:
                      expanded.append(url.replace('www.sse.com.cn/disclosure/', 'static.sse.com.cn/disclosure/'))
                  if 'static.sse.com.cn/disclosure/' in url:
                      expanded.append(url.replace('static.sse.com.cn/disclosure/', 'www.sse.com.cn/disclosure/'))
              return list(dict.fromkeys(expanded))

          selected: list[dict] = []
          for year in range(2020, 2026):
              candidates = [row for row in all_rows if annual_match(row['title'], year)]
              if not candidates:
                  raise RuntimeError(f'未找到{year}年年度报告。')
              candidates.sort(
                  key=lambda row: (
                      ('修订' in row['title']) or ('更新' in row['title']) or ('更正' in row['title']),
                      date_key(row),
                  ),
                  reverse=True,
              )
              selected.append({
                  'filename': f'{year - 2019:02d}_传音控股_688036_{year}年年度报告.pdf',
                  'title': f'传音控股{year}年年度报告',
                  'period': f'{year}年度',
                  'row': candidates[0],
                  'min_pages': 80,
                  'min_bytes': 800_000,
              })

          quarter_candidates: list[dict] = []
          for row in all_rows:
              title = row['title']
              is_2026 = '2026' in title
              is_quarter = any(term in title for term in ('第一季度报告', '一季度报告', '第三季度报告', '三季度报告'))
              if is_2026 and is_quarter and is_full_report(title):
                  quarter_candidates.append(row)
          if not quarter_candidates:
              raise RuntimeError('未找到2026年季度报告。')
          quarter_candidates.sort(key=date_key, reverse=True)
          quarter_row = quarter_candidates[0]
          quarter_title = quarter_row['title']
          quarter_label = '2026年第三季度报告' if ('第三季度' in quarter_title or '三季度' in quarter_title) else '2026年第一季度报告'
          selected.append({
              'filename': f'07_传音控股_688036_{quarter_label}.pdf',
              'title': f'传音控股{quarter_label}',
              'period': '2026年第三季度' if '第三季度' in quarter_label else '2026年第一季度',
              'row': quarter_row,
              'min_pages': 4,
              'min_bytes': 80_000,
          })

          half_candidates: list[dict] = []
          for row in all_rows:
              title = row['title']
              if '2026' in title and ('半年度报告' in title or '中期报告' in title) and is_full_report(title):
                  half_candidates.append(row)
          if half_candidates:
              half_candidates.sort(key=date_key, reverse=True)
              selected.append({
                  'filename': '08_传音控股_688036_2026年半年度报告.pdf',
                  'title': '传音控股2026年半年度报告',
                  'period': '截至2026年6月30日止六个月',
                  'row': half_candidates[0],
                  'min_pages': 40,
                  'min_bytes': 400_000,
              })

          def download_pdf(urls: list[str], dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          referer = 'https://www.cninfo.com.cn/' if 'cninfo.com.cn' in url else 'https://www.sse.com.cn/'
                          with session.get(
                              url,
                              headers={'Referer': referer, 'Accept': 'application/pdf,*/*;q=0.8'},
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 600),
                          ) as response:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              header = fh.read(8)
                          if size < min_bytes or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF size/header: {size}, {header!r}')
                          tmp.replace(dest)
                          return str(response.url)
                      except Exception as exc:
                          tmp.unlink(missing_ok=True)
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in selected:
              dest = OUT / doc['filename']
              final_url = download_pdf(make_url_variants(doc['row']), dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'页数异常：{dest.name}仅{pages}页')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf校验失败：{dest.name}: {check.stderr[-2000:]}')

              data = dest.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in seen_hashes:
                  raise RuntimeError(f'检测到重复PDF：{dest.name}')
              seen_hashes.add(sha256)

              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'announcement_title': doc['row']['title'],
                  'announcement_date': doc['row']['date'],
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha256,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) < 7:
              raise RuntimeError(f'报告数量不足：{len(records)}')

          readme = [
              f'{FULL_COMPANY}（{STOCK}.SH）2020—2025年年度报告及2026年最新季报/半年报',
              '整理日期：2026-09-27',
              '',
              '收录内容：2020—2025年完整年度报告、截至整理日最新的2026年季度报告，以及2026年半年度报告（如公司已披露）。',
              '资料来源：上海证券交易所或中国证监会指定信息披露平台巨潮资讯。',
              '所有PDF均完成文件头、文件大小、页数、qpdf结构、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['title']}",
                  f"   文件：{record['filename']}",
                  f"   报告期：{record['period']}；页数：{record['pages']}；大小：{record['bytes'] / 1048576:.2f} MB",
                  f"   公告标题：{record['announcement_title']}；公告日期：{record['announcement_date']}",
                  f"   官方来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与官方来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{record['sha256']}  {record['filename']}\n" for record in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC失败：' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != len(records):
                  raise RuntimeError(f'ZIP内PDF数量异常：{len(pdfs)} != {len(records)}')

          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', zip_sha256, flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: transsion-688036-reports-20260927
          path: 传音控股_688036_2020-2025年报及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
