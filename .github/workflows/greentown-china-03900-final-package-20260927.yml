name: Build Greentown China 03900 annual and latest interim package 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-china-03900-final-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package official reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '绿城中国_03900_2020-2025年报_2026最新中期报告_官方原件'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {'filename':'01_绿城中国_03900_2020年年度报告.pdf','title':'绿城中国2020年年度报告','year':2020,'category':'年度报告','url':'https://doc.irasia.com/listco/hk/greentownchina/annual/2020/car2020.pdf','min_pages':100,'min_bytes':500_000},
              {'filename':'02_绿城中国_03900_2021年年度报告.pdf','title':'绿城中国2021年年度报告','year':2021,'category':'年度报告','url':'https://doc.irasia.com/listco/hk/greentownchina/annual/2021/car2021.pdf','min_pages':100,'min_bytes':500_000},
              {'filename':'03_绿城中国_03900_2022年年度报告.pdf','title':'绿城中国2022年年度报告','year':2022,'category':'年度报告','url':'https://doc.irasia.com/listco/hk/greentownchina/annual/2022/car2022.pdf','min_pages':100,'min_bytes':500_000},
              {'filename':'04_绿城中国_03900_2023年年度报告.pdf','title':'绿城中国2023年年度报告','year':2023,'category':'年度报告','url':'https://doc.irasia.com/listco/hk/greentownchina/annual/2023/car2023.pdf','min_pages':100,'min_bytes':500_000},
              {'filename':'05_绿城中国_03900_2024年年度报告.pdf','title':'绿城中国2024年年度报告','year':2024,'category':'年度报告','url':'https://doc.irasia.com/listco/hk/greentownchina/annual/2024/car2024.pdf','min_pages':100,'min_bytes':500_000},
              {'filename':'06_绿城中国_03900_2025年年度报告.pdf','title':'绿城中国2025年年度报告','year':2025,'category':'年度报告','url':'https://doc.irasia.com/listco/hk/greentownchina/annual/2025/car2025.pdf','min_pages':100,'min_bytes':500_000},
              {'filename':'07_绿城中国_03900_2026年中期报告_官网最新定期报告.pdf','title':'绿城中国2026年中期报告','year':2026,'category':'最新中期报告','url':'https://doc.irasia.com/listco/hk/greentownchina/interim/2026/intrepc.pdf','min_pages':40,'min_bytes':300_000},
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer':'https://www.greentownchina.com/tc/ir/reports.php',
          })

          def candidate_urls(url: str) -> list[str]:
              vals=[url]
              if url.startswith('https://doc.irasia.com/'):
                  vals.append(url.replace('https://doc.irasia.com/','http://doc.irasia.com/'))
              return vals

          def download(doc: dict, dest: Path) -> str:
              errors=[]
              for url in candidate_urls(doc['url']):
                  for attempt in range(1,5):
                      tmp=dest.with_suffix(dest.suffix+'.part')
                      try:
                          with session.get(url,timeout=(30,360),allow_redirects=True,stream=True) as r:
                              print('DOWNLOAD',dest.name,'attempt',attempt,'status',r.status_code,'url',url,'final',r.url,flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(1024*1024):
                                      if chunk: fh.write(chunk)
                          size=tmp.stat().st_size
                          head=tmp.read_bytes()[:8]
                          if size < doc['min_bytes'] or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt*2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def extract_sample(path: Path, reader: PdfReader) -> str:
              parts=[]
              page_count=len(reader.pages)
              indices=list(range(min(20,page_count)))
              if page_count>25:
                  indices += list(range(max(0,page_count-3),page_count))
              for i in dict.fromkeys(indices):
                  try:
                      parts.append(reader.pages[i].extract_text() or '')
                  except Exception:
                      pass
              txt='\n'.join(parts)
              if len(txt.strip()) < 200:
                  out_txt=path.with_suffix('.sample.txt')
                  cp=subprocess.run(['pdftotext','-f','1','-l',str(min(20,page_count)),str(path),str(out_txt)],capture_output=True,text=True)
                  if cp.returncode==0 and out_txt.exists():
                      txt += '\n' + out_txt.read_text(encoding='utf-8',errors='ignore')
                  out_txt.unlink(missing_ok=True)
              return txt

          records=[]
          hashes=set()
          identity_terms=['greentown china','綠城中國','绿城中国','greentown china holdings','03900','3900']
          annual_terms=['annual report','年度報告','年度报告','年報','年报']
          interim_terms=['interim report','中期報告','中期报告','中報','中报']

          for doc in docs:
              dest=out/doc['filename']
              final_url=download(doc,dest)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample=extract_sample(dest,reader).lower()
              metadata=' '.join(str(v or '') for v in (reader.metadata or {}).values()).lower()
              combined=sample+'\n'+metadata
              if not any(term.lower() in combined for term in identity_terms):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              expected_terms=annual_terms if doc['category']=='年度报告' else interim_terms
              if not any(term.lower() in combined for term in expected_terms):
                  raise RuntimeError(f'report type could not be verified in {dest.name}')
              if str(doc['year']) not in combined:
                  print('WARN report year not found in extracted text',dest.name,flush=True)

              q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if q.returncode not in (0,3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {q.stderr[-2000:]}')

              data=dest.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              if sha in hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              hashes.add(sha)
              rec={
                  'filename':doc['filename'],'title':doc['title'],'report_year':doc['year'],
                  'category':doc['category'],'source':'绿城中国官网年度/中期报告栏目（IRAsia官方文档服务器）',
                  'source_url':final_url,'pages':pages,'bytes':len(data),'sha256':sha,
              }
              records.append(rec)
              print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          if len(records)!=7:
              raise RuntimeError(f'document count mismatch: {len(records)}')
          years={r['report_year'] for r in records if r['category']=='年度报告'}
          if years != set(range(2020,2026)):
              raise RuntimeError(f'annual coverage mismatch: {years}')

          readme=[
              '绿城中国控股有限公司（03900.HK）2020—2025年年度报告及2026年最新中期报告',
              '整理日期：2026-09-27',
              '',
              '一、收录范围',
              '1. 2020、2021、2022、2023、2024及2025年完整年度报告，共6份。',
              '2. 绿城中国官网当前列出的最新完整定期财务报告：2026年中期报告，共1份。',
              '3. 合计7份官方PDF原件。',
              '',
              '二、关于“最新季报”',
              '绿城中国为香港上市公司，官网年度/中期报告栏目未提供独立季度报告。',
              '因此，本包以截至2026年6月30日止六个月的2026年中期报告作为最新一期定期财务报告。',
              '',
              '三、官方来源',
              'https://www.greentownchina.com/tc/ir/reports.php',
              '',
              '四、文件清单',
          ]
          for i,r in enumerate(records,1):
              readme += [
                  f"{i}. {r['title']}",
                  f"   类别：{r['category']}；文件：{r['filename']}",
                  f"   页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",
                  f"   来源：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += [
              '五、完整性核验',
              '所有PDF均完成文件头、公司身份、报告类型、页数、qpdf结构、重复文件及SHA-256检查；最终ZIP已完成CRC测试。',
          ]
          (out/'00_文件清单与范围说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as zf:
              for p in sorted(out.iterdir()):
                  zf.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad=zf.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=7: raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',zip_sha,flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-03900-annual-interim-final
          path: 绿城中国_03900_2020-2025年报_2026最新中期报告_官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
