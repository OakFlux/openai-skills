name: Dazhihui Annual Reports and Latest Quarter

on:
  push:
    branches:
      - chatgpt-dazhihui-filings-20261012
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_dazhihui_filings_20261012.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: dazhihui-filings-package
          path: |
            output/dazhihui_2020_2025_annual_reports_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
