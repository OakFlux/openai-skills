name: probe-syoung-300740-report-api

on:
  push:
    branches:
      - tmp/syoung-300740-api-probe-20261104

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe API variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/300740.html'})
          base='https://reportapi.eastmoney.com/report/list'
          variants=[
            {'code':'300740','cb':'callback123'},
            {'code':'300740','cb':'jQuery1124'},
            {'code':'300740'},
            {'code':'sz300740','cb':'callback123'},
            {'code':'300740.SZ','cb':'callback123'},
          ]
          for i,extra in enumerate(variants,1):
            params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2023-01-01','endTime':'2026-11-04','pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':''}
            params.update(extra)
            r=s.get(base,params=params,timeout=(30,120))
            print('VARIANT',i,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            print('BODY',repr(r.text[:1000]))
          PY
