name: Build verified Zhaojin Mining broker report package
on:
  push:
    branches:
      - tmp-zhaojin-final-pack-20260907
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work/pages work/final work/renders
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, shutil, zipfile
          from pathlib import Path
          import img2pdf, pymupdf, requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          OUT=Path('output'); WORK=Path('work'); PAGES=WORK/'pages'; FINAL=WORK/'final'; RENDERS=WORK/'renders'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          records=[]

          # 1) 2025 Zhongyou Securities deep report: all 29 publicly displayed original pages.
          image_paths=[]; image_hashes=set()
          base='https://oss.sdyanbao.com/page/2025/8/4/1218250'
          for idx in range(29):
              url=f'{base}/{idx}.png'
              r=s.get(url,headers={'Referer':base,'Accept':'image/png,image/*,*/*;q=0.8'},timeout=(20,120))
              r.raise_for_status(); data=r.content
              if len(data)<20000: raise RuntimeError(f'Image too small: page {idx+1}, {len(data)} bytes')
              digest=hashlib.sha256(data).hexdigest()
              if digest in image_hashes: raise RuntimeError(f'Duplicate page image: {idx+1}')
              image_hashes.add(digest)
              try:
                  im=Image.open(io.BytesIO(data)); im.verify(); im=Image.open(io.BytesIO(data)); width,height=im.size; fmt=im.format; im.close()
              except Exception as exc: raise RuntimeError(f'Invalid image page {idx+1}: {exc}')
              if width<700 or height<900: raise RuntimeError(f'Unexpected dimensions page {idx+1}: {width}x{height}')
              path=PAGES/f'2025_{idx+1:03d}.png'; path.write_bytes(data); image_paths.append(path)
              print('PAGE_OK',idx+1,len(data),width,height,fmt,flush=True)
          pdf2025=FINAL/'2025-07-31_中邮证券_海域金矿投产有望显著增厚公司业绩.pdf'
          pdf2025.write_bytes(img2pdf.convert([str(p) for p in image_paths]))
          data2025=pdf2025.read_bytes(); pages2025=len(PdfReader(io.BytesIO(data2025),strict=False).pages)
          if pages2025!=29: raise RuntimeError(f'2025 PDF page mismatch: {pages2025}')
          records.append({
              'filename':pdf2025.name,'path':str(pdf2025),'broker':'中邮证券','date':'2025-07-31',
              'title':'招金矿业（HK1818）深度报告：海域金矿投产有望显著增厚公司业绩',
              'pages':pages2025,'bytes':len(data2025),'sha256':hashlib.sha256(data2025).hexdigest(),
              'source':'https://oss.sdyanbao.com/page/2025/8/4/1218250',
              'format_note':'公开原报告逐页图像按原页序无删减合并为PDF'
          })

          # 2) 2024 Zheshang Securities original PDF from a public report download.
          url2024='https://cdn.hangyan.co/document_reports/3466271943412417652/202409_zhaojinkuangyeshengqianli_zhaojinerlai.pdf'
          r=s.get(url2024,headers={'Referer':'https://www.hangyan.co/reports/3466271943412417652','Accept':'application/pdf,*/*'},timeout=(30,180))
          r.raise_for_status(); data2024=r.content
          if not data2024.lstrip().startswith(b'%PDF') or len(data2024)<100000: raise RuntimeError('Invalid 2024 PDF')
          reader=PdfReader(io.BytesIO(data2024),strict=False); pages2024=len(reader.pages)
          if pages2024!=30: raise RuntimeError(f'2024 PDF page mismatch: {pages2024}')
          sample='\n'.join((p.extract_text() or '') for p in reader.pages[:3])
          if '招金矿业' not in sample or '浙商' not in sample: raise RuntimeError('2024 report identity check failed')
          pdf2024=FINAL/'2024-09-27_浙商证券_深聚潜力_招金而来.pdf'; pdf2024.write_bytes(data2024)
          records.append({
              'filename':pdf2024.name,'path':str(pdf2024),'broker':'浙商证券','date':'2024-09-27',
              'title':'招金矿业（01818.HK）深度报告：深聚潜力，“招”金而来',
              'pages':pages2024,'bytes':len(data2024),'sha256':hashlib.sha256(data2024).hexdigest(),
              'source':'https://www.hangyan.co/reports/3466271943412417652',
              'format_note':'公开下载的券商原始PDF'
          })

          # Render first pages for visual QA and produce a contact sheet.
          cards=[]
          for rec in records:
              doc=pymupdf.open(rec['path']); pix=doc[0].get_pixmap(matrix=pymupdf.Matrix(1.3,1.3),alpha=False); rp=RENDERS/(Path(rec['filename']).stem+'.png'); pix.save(str(rp)); doc.close()
              im=Image.open(rp).convert('RGB'); im.thumbnail((620,850)); card=Image.new('RGB',(680,960),'white'); card.paste(im,((680-im.width)//2,20));
              draw=ImageDraw.Draw(card); draw.text((20,900),f"{rec['broker']} | {rec['date']} | {rec['pages']} pages",fill='black'); cards.append(card); im.close()
          sheet=Image.new('RGB',(1360,960),'white'); sheet.paste(cards[0],(0,0)); sheet.paste(cards[1],(680,0)); sheet.save(OUT/'first_page_contact_sheet.jpg',quality=90)
          for card in cards: card.close()

          manifest=FINAL/'文件清单与校验值.csv'
          with manifest.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['序号','券商','发布日期','报告标题','PDF页数','文件大小_字节','SHA256','公开来源','文件版本说明','文件名']); w.writeheader()
              for i,rec in enumerate(records,1):
                  w.writerow({'序号':i,'券商':rec['broker'],'发布日期':rec['date'],'报告标题':rec['title'],'PDF页数':rec['pages'],'文件大小_字节':rec['bytes'],'SHA256':rec['sha256'],'公开来源':rec['source'],'文件版本说明':rec['format_note'],'文件名':rec['filename']})
          readme=FINAL/'README.txt'
          lines=['招金矿业（01818.HK）券商深度报告资料包','打包日期：2026-09-07','','收录2份完整公司深度报告。','已检查PDF可解析性、实际页数、公司身份及首页渲染；ZIP已完成CRC校验。','']
          for i,rec in enumerate(records,1): lines += [f"{i}. {rec['broker']}｜{rec['date']}｜{rec['title']}｜{rec['pages']}页",f"   版本：{rec['format_note']}",f"   来源：{rec['source']}"]
          readme.write_text('\n'.join(lines),encoding='utf-8')

          archive=OUT/'招金矿业_01818_券商深度报告_2份.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(FINAL.iterdir()): z.write(p,p.name)
          with zipfile.ZipFile(archive,'r') as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad is not None or len(pdfs)!=2: raise RuntimeError(f'ZIP validation failed: {bad}, {pdfs}')
          backup=OUT/'Zhaojin_Mining_01818_Broker_Deep_Reports_2.zip'; shutil.copy2(archive,backup)
          result={'ok':True,'archive':archive.name,'backup':backup.name,'archive_bytes':archive.stat().st_size,'zip_crc_ok':True,'records':records}
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PACKAGE_OK',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-broker-deep-reports-final
          path: output/*
          retention-days: 1
          if-no-files-found: error
