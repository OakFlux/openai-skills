name: Microprobe China Longgong Eastmoney reports 20260926

on:
  push:
    paths:
      - '.github/workflows/china-longgong-eastmoney-microprobe-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query report API and Bing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p microprobe
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import quote_plus
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          out=[]
          api='https://reportapi.eastmoney.com/report/list'
          tests=[
            {'code':'03339','qType':'0'},
            {'stockCode':'03339','qType':'0'},
            {'code':'3339','qType':'0'},
            {'code':'03339.HK','qType':'0'},
          ]
          for t in tests:
            p={'pageSize':'100','pageNo':'1','beginTime':'2005-01-01','endTime':'2026-09-26','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','author':'','p':'1','pageNum':'1','pageNumber':'1',**t}
            try:
              r=s.get(api,params=p,timeout=(8,12))
              text=r.text
              try:d=r.json()
              except Exception:
                m=re.search(r'^[^(]*\((.*)\)\s*;?$',text,re.S); d=json.loads(m.group(1)) if m else {'raw':text[:10000]}
              out.append({'test':t,'status':r.status_code,'url':r.url,'bytes':len(r.content),'data':d})
              print('RESULT',json.dumps(out[-1],ensure_ascii=False)[:20000],flush=True)
            except Exception as e:
              out.append({'test':t,'error':repr(e)}); print('ERR',t,repr(e),flush=True)
          Path('microprobe/eastmoney.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          for i,q in enumerate(['"中国龙工" 研报 PDF','"Lonking Holdings" research report PDF','site:pdf.dfcfw.com 中国龙工']):
            try:
              r=s.get('https://www.bing.com/search?q='+quote_plus(q),timeout=(8,12),headers={'User-Agent':'Mozilla/5.0'})
              Path(f'microprobe/bing_{i}.html').write_bytes(r.content)
              print('BING',q,r.status_code,len(r.content),flush=True)
            except Exception as e: print('BING_ERR',q,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: china-longgong-eastmoney-microprobe
          path: microprobe
          if-no-files-found: error
          retention-days: 7
