name: package-beiyuan-chemical-601568-broker-reports

on:
  push:
    branches:
      - tmp/beiyuan-chemical-601568-broker-final-20261104

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-arphic-gbsn00lp fonts-arphic-gkai00mp
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml reportlab pillow

      - name: Build validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html as html_module
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import (
              PageBreak,
              Paragraph,
              SimpleDocTemplate,
              Spacer,
              Table,
              TableStyle,
          )

          COMPANY = "北元化工"
          HISTORICAL_NAME = "北元集团"
          FULL_NAME = "陕西北元化工集团股份有限公司"
          CODE = "601568"
          PREPARED = "2026-11-04"
          ROOT_NAME = "北元化工_601568_券商研究报告_2份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          body_font = "/usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf"
          title_font = "/usr/share/fonts/truetype/arphic-gkai00mp/gkai00mp.ttf"
          if not Path(body_font).exists() or not Path(title_font).exists():
              raise FileNotFoundError("Required Chinese fonts were not found")
          pdfmetrics.registerFont(TTFont("CJKBody", body_font))
          pdfmetrics.registerFont(TTFont("CJKTitle", title_font))

          reports = [
              {
                  "sequence": 1,
                  "date": "2026-05-31",
                  "public_date": "2026-06-01",
                  "broker": "国泰海通证券",
                  "analyst": "刘威、沈唯、周志鹏",
                  "rating": "增持（首次覆盖）",
                  "report_type": "首次覆盖/公司研究",
                  "title": "依托资源优势，布局以PVC产品为核心的一体化产业链",
                  "document_form": "公开网页正文排版版（非券商原始PDF）",
                  "original_metadata_pages": 5,
                  "source_url": "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/833627200060/index.phtml",
                  "metadata_url": "https://www.nxny.com/author/25104_p1.html",
                  "filename": "01_20260531_国泰海通证券_北元化工首次覆盖_公开网页正文排版版_非原始PDF.pdf",
              },
              {
                  "sequence": 2,
                  "date": "2021-06-01",
                  "broker": "海通证券",
                  "analyst": "刘威、邓勇、李智",
                  "rating": "优于大市（首次覆盖）",
                  "report_type": "首次覆盖/公司研究",
                  "title": "依托资源优势，布局以PVC产品为核心的一体化产业链",
                  "document_form": "券商原始PDF",
                  "source_url": "https://file.iyanbao.com/pdf/664af-9b578c96-b468-4e9f-9d6f-714a237b50c2.pdf",
                  "filename": "02_20210601_海通证券_北元集团首次覆盖_券商原始PDF.pdf",
              },
          ]

          def fetch_bytes(url: str, *, referer: str | None = None, minimum: int = 1000) -> tuple[bytes, str, str]:
              last = None
              for attempt in range(5):
                  try:
                      headers = {"Accept": "application/pdf,text/html,*/*;q=0.8"}
                      if referer:
                          headers["Referer"] = referer
                      response = session.get(url, timeout=(30, 420), allow_redirects=True, headers=headers)
                      print("DOWNLOAD", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                      response.raise_for_status()
                      if len(response.content) >= minimum:
                          return response.content, response.url, response.headers.get("content-type", "")
                      last = RuntimeError(f"Response too small: {len(response.content)} bytes")
                  except Exception as exc:
                      last = exc
                      print("DOWNLOAD_ERROR", attempt, url, repr(exc))
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Download failed for {url}: {last}")

          def clean_text(value: str) -> str:
              value = html_module.unescape(value or "")
              value = value.replace("\u3000", " ").replace("\xa0", " ")
              value = re.sub(r"[ \t]+", " ", value)
              value = re.sub(r"\s*\n\s*", "\n", value)
              return value.strip()

          def extract_sina_report(html_bytes: bytes) -> tuple[str, list[str], str]:
              for encoding in ("gb18030", "gbk", "utf-8"):
                  try:
                      text = html_bytes.decode(encoding)
                      if "北元化工" in text or "北元集团" in text:
                          break
                  except Exception:
                      continue
              else:
                  text = html_bytes.decode("utf-8", errors="replace")

              soup = BeautifulSoup(text, "lxml")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()

              heading = clean_text((soup.find("h1") or soup.title).get_text(" ", strip=True))
              source_line = ""
              creab = soup.select_one(".creab")
              if creab:
                  source_line = clean_text(creab.get_text(" ", strip=True))

              containers = soup.select(".blk_container")
              if not containers:
                  containers = soup.select(".content")

              paragraphs: list[str] = []
              seen: set[str] = set()
              for container in containers:
                  nodes = container.find_all(["p", "h2", "h3", "h4", "li"], recursive=True)
                  if not nodes:
                      nodes = [container]
                  for node in nodes:
                      value = clean_text(node.get_text(" ", strip=True))
                      if not value or len(value) < 2:
                          continue
                      if value in seen:
                          continue
                      if any(marker in value for marker in ["文本中涉及股票", "免责声明", "新浪财经意见反馈留言板"]):
                          continue
                      seen.add(value)
                      paragraphs.append(value)

              if not paragraphs:
                  raise RuntimeError("No report paragraphs were extracted from the public page")
              joined = "".join(paragraphs)
              if len(joined) < 1200:
                  raise RuntimeError(f"Extracted report text is unexpectedly short: {len(joined)} characters")
              if CODE not in heading and COMPANY not in heading and HISTORICAL_NAME not in heading:
                  raise RuntimeError(f"Unexpected report heading: {heading}")
              print("EXTRACTED_HEADING", heading)
              print("EXTRACTED_SOURCE", source_line)
              print("EXTRACTED_PARAGRAPHS", len(paragraphs), "CHARS", len(joined))
              print("EXTRACTED_FIRST", paragraphs[:5])
              return heading, paragraphs, source_line

          def footer(canvas, doc):
              canvas.saveState()
              canvas.setFont("CJKBody", 8)
              canvas.setFillColor(colors.HexColor("#666666"))
              canvas.drawCentredString(A4[0] / 2, 10 * mm, f"第 {doc.page} 页")
              canvas.restoreState()

          def build_public_text_pdf(spec: dict, html_bytes: bytes, output: Path) -> tuple[int, int, int, str]:
              page_heading, paragraphs, source_line = extract_sina_report(html_bytes)
              styles = getSampleStyleSheet()
              styles.add(ParagraphStyle(
                  name="CJKCoverFlag", fontName="CJKTitle", fontSize=17, leading=24,
                  alignment=TA_CENTER, textColor=colors.HexColor("#9b1c1c"), spaceAfter=14,
              ))
              styles.add(ParagraphStyle(
                  name="CJKTitleMain", fontName="CJKTitle", fontSize=19, leading=28,
                  alignment=TA_CENTER, textColor=colors.HexColor("#1f2937"), spaceAfter=16,
              ))
              styles.add(ParagraphStyle(
                  name="CJKMeta", fontName="CJKBody", fontSize=10.5, leading=17,
                  alignment=TA_LEFT, textColor=colors.HexColor("#333333"), spaceAfter=5,
              ))
              styles.add(ParagraphStyle(
                  name="CJKSection", fontName="CJKTitle", fontSize=14, leading=21,
                  alignment=TA_LEFT, textColor=colors.HexColor("#1f2937"), spaceBefore=8, spaceAfter=7,
              ))
              styles.add(ParagraphStyle(
                  name="CJKBodyText", fontName="CJKBody", fontSize=10.5, leading=18,
                  alignment=TA_LEFT, firstLineIndent=21, textColor=colors.HexColor("#202020"), spaceAfter=7,
              ))
              styles.add(ParagraphStyle(
                  name="CJKSmall", fontName="CJKBody", fontSize=8.5, leading=13,
                  alignment=TA_LEFT, textColor=colors.HexColor("#555555"), spaceAfter=4,
              ))

              doc = SimpleDocTemplate(
                  str(output), pagesize=A4,
                  rightMargin=20 * mm, leftMargin=20 * mm,
                  topMargin=18 * mm, bottomMargin=18 * mm,
                  title=f"{COMPANY}：{spec['title']}",
                  author=spec["broker"],
                  subject="公开网页正文排版版（非券商原始PDF）",
              )
              story = []
              story.append(Paragraph("公开网页正文排版版（非券商原始PDF）", styles["CJKCoverFlag"]))
              story.append(Paragraph(html_module.escape(page_heading), styles["CJKTitleMain"]))

              meta_data = [
                  ["公司", f"{FULL_NAME}（{CODE}.SH；历史简称：{HISTORICAL_NAME}）"],
                  ["券商", spec["broker"]],
                  ["研究员", spec["analyst"]],
                  ["报告日期", f"{spec['date']}（公开转载日期：{spec['public_date']}）"],
                  ["评级", spec["rating"]],
                  ["报告类型", spec["report_type"]],
                  ["原报告页数元数据", f"{spec['original_metadata_pages']}页"],
              ]
              table = Table(meta_data, colWidths=[34 * mm, 122 * mm], hAlign="LEFT")
              table.setStyle(TableStyle([
                  ("FONTNAME", (0, 0), (-1, -1), "CJKBody"),
                  ("FONTSIZE", (0, 0), (-1, -1), 10),
                  ("LEADING", (0, 0), (-1, -1), 15),
                  ("BACKGROUND", (0, 0), (0, -1), colors.HexColor("#f2f4f7")),
                  ("TEXTCOLOR", (0, 0), (-1, -1), colors.HexColor("#222222")),
                  ("GRID", (0, 0), (-1, -1), 0.4, colors.HexColor("#b7bdc6")),
                  ("VALIGN", (0, 0), (-1, -1), "TOP"),
                  ("LEFTPADDING", (0, 0), (-1, -1), 6),
                  ("RIGHTPADDING", (0, 0), (-1, -1), 6),
                  ("TOPPADDING", (0, 0), (-1, -1), 5),
                  ("BOTTOMPADDING", (0, 0), (-1, -1), 5),
              ]))
              story.append(table)
              story.append(Spacer(1, 9 * mm))
              notice = (
                  "文件性质说明：本文件依据新浪财经公开展示的报告正文重新排版，"
                  "不属于券商发布的原始PDF，也不保留原PDF的图表、版式、书签、文本层元数据或附件。"
                  "正文内容未作改写；原报告版权归券商及作者所有，仅供研究与存档。"
              )
              story.append(Paragraph(notice, styles["CJKMeta"]))
              story.append(Spacer(1, 5 * mm))
              story.append(Paragraph(f"公开正文页来源：{html_module.escape(spec['source_url'])}", styles["CJKSmall"]))
              story.append(Paragraph(f"元数据交叉核验来源：{html_module.escape(spec['metadata_url'])}", styles["CJKSmall"]))
              if source_line:
                  story.append(Paragraph(f"公开页面署名信息：{html_module.escape(source_line)}", styles["CJKSmall"]))
              story.append(PageBreak())
              story.append(Paragraph("公开网页正文", styles["CJKSection"]))

              heading_markers = (
                  "投资要点", "核心观点", "公司简介", "盈利预测", "风险提示", "投资建议",
                  "公司概况", "行业", "资源优势", "一体化", "估值", "首次覆盖",
              )
              for paragraph in paragraphs:
                  escaped = html_module.escape(paragraph)
                  compact = re.sub(r"\s+", "", paragraph)
                  is_heading = (
                      len(compact) <= 34
                      and (compact.endswith("：") or compact.endswith(":") or any(compact.startswith(m) for m in heading_markers))
                  )
                  story.append(Paragraph(escaped, styles["CJKSection"] if is_heading else styles["CJKBodyText"]))

              story.append(Spacer(1, 6 * mm))
              story.append(Paragraph(
                  "说明：本排版版仅保存公开网页可见正文。若原券商PDF包含图表、估值表、附录或特定版式，"
                  "这些内容可能未在公开网页正文中完整呈现。",
                  styles["CJKSmall"],
              ))
              doc.build(story, onFirstPage=footer, onLaterPages=footer)

              reader = PdfReader(str(output), strict=False)
              actual_pages = len(reader.pages)
              text_check = "".join((page.extract_text() or "") for page in reader.pages)
              compact_check = re.sub(r"\s+", "", text_check)
              if COMPANY not in compact_check or CODE not in compact_check:
                  raise RuntimeError("Generated public-text PDF issuer validation failed")
              return actual_pages, max(actual_pages - 1, 1), len("".join(paragraphs)), source_line

          manifest = []

          # Newer report: public webpage text re-typeset, explicitly marked non-original.
          newer = reports[0]
          html_data, html_final_url, html_type = fetch_bytes(newer["source_url"], minimum=20_000)
          newer_path = PDF_DIR / newer["filename"]
          newer_pages, newer_body_pages, extracted_chars, source_line = build_public_text_pdf(newer, html_data, newer_path)
          newer_bytes = newer_path.read_bytes()
          manifest.append({
              **newer,
              "actual_pages": newer_pages,
              "report_body_pages": newer_body_pages,
              "extracted_text_characters": extracted_chars,
              "public_page署名": source_line,
              "bytes": len(newer_bytes),
              "sha256": hashlib.sha256(newer_bytes).hexdigest(),
              "downloaded_source_url": html_final_url,
              "content_type": html_type,
          })

          # 2021 report: original broker PDF.
          original = reports[1]
          original_data, original_final_url, original_type = fetch_bytes(original["source_url"], minimum=100_000)
          if not original_data.startswith(b"%PDF-"):
              raise RuntimeError("2021 report response is not a PDF")
          original_path = PDF_DIR / original["filename"]
          original_path.write_bytes(original_data)
          original_reader = PdfReader(str(original_path), strict=False)
          original_pages = len(original_reader.pages)
          original_text = "\n".join((page.extract_text() or "") for page in original_reader.pages[: min(5, original_pages)])
          compact_original = re.sub(r"\s+", "", original_text)
          if original_pages != 4:
              raise RuntimeError(f"Unexpected 2021 report page count: {original_pages}")
          if not (CODE in compact_original and (COMPANY in compact_original or HISTORICAL_NAME in compact_original or FULL_NAME in compact_original)):
              raise RuntimeError("2021 original PDF issuer validation failed")
          manifest.append({
              **original,
              "actual_pages": original_pages,
              "report_body_pages": original_pages,
              "bytes": len(original_data),
              "sha256": hashlib.sha256(original_data).hexdigest(),
              "downloaded_source_url": original_final_url,
              "content_type": original_type,
          })

          # Structural validation and previews.
          for item in manifest:
              path = PDF_DIR / item["filename"]
              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {path.name}: {check.stdout}")
              preview_page = 2 if "非券商原始PDF" in item["document_form"] else 1
              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", str(preview_page), "-l", str(preview_page), "-png", "-r", "150", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f"Preview failed for {path.name}: {render.stdout}")
              item["preview_file"] = str(Path("首页预览") / preview.name)

          readme = [
              f"{FULL_NAME}（{CODE}.SH）券商研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录2份公司级首次覆盖研究材料：1份券商原始PDF，以及1份公开网页正文排版版。",
              "2020年公开检索到的两份材料均为新股网下询价/申购建议报告，不属于公司深度研究，故未纳入。",
              "",
              "重要文件性质说明：",
              "1. 2021年海通证券报告为券商原始PDF。",
              "2. 2026年国泰海通证券报告的原始PDF未在可直接公开下载渠道取得；包内文件依据新浪财经公开正文排版，文件名和首页已明确标注‘非券商原始PDF’。",
              "3. 公开网页正文排版版可能不包含原报告中的图表、估值表、附件及原始版式，未绕过登录、会员或付费限制。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              source = item.get("downloaded_source_url") or item.get("source_url")
              readme.extend([
                  f"{index}. {item['filename']}",
                  f"   文件性质：{item['document_form']}",
                  f"   类型：{item['report_type']}；券商：{item['broker']}；研究员：{item['analyst']}",
                  f"   日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   PDF实际页数：{item['actual_pages']}；报告正文页数：{item['report_body_pages']}；文件大小：{item['bytes']}字节",
                  f"   公开来源：{source}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称与证券代码、报告标题、实际页数、qpdf结构、页面渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与文件性质说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "current_short_name": COMPANY,
              "historical_short_name": HISTORICAL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "original_pdf_count": sum(item["document_form"] == "券商原始PDF" for item in manifest),
              "public_text_pdf_count": sum("公开网页正文排版版" in item["document_form"] for item in manifest),
              "excluded_materials": [
                  "2020-09-24 国元证券《新股网下询价策略：北元集团、东鹏控股》",
                  "2020-09-22 东莞证券《新股网下申购询价建议报告：北元集团、澳弘电子》",
              ],
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "文件性质", "报告类型", "券商", "研究员", "日期", "标题", "评级", "PDF页数", "正文页数", "字节数", "SHA-256", "公开来源"])
              for item in manifest:
                  source = item.get("downloaded_source_url") or item.get("source_url")
                  writer.writerow([
                      item["filename"], item["document_form"], item["report_type"], item["broker"], item["analyst"], item["date"],
                      item["title"], item["rating"], item["actual_pages"], item["report_body_pages"], item["bytes"], item["sha256"], source,
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("beiyuan_chemical_601568_broker_research_reports_2.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 2:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 2")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": payload["original_pdf_count"],
              "public_text_pdf_count": payload["public_text_pdf_count"],
              "files": [{k: item[k] for k in ["filename", "document_form", "report_type", "broker", "analyst", "date", "title", "rating", "actual_pages", "report_body_pages", "bytes", "sha256"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: beiyuan-chemical-601568-broker-reports-2-20261104
          path: |
            beiyuan_chemical_601568_broker_research_reports_2.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
