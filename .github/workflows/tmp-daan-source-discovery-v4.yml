name: Temporary Daan Gene source discovery v4

on:
  push:
    branches: [tmp/daan-gene-broker-reports-20260829]
    paths: [.github/workflows/tmp-daan-source-discovery-v4.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect sources
        run: |
          mkdir -p out/pages out/js
          python - <<'PY'
          import html, json, re, traceback
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, unquote
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('out'); PAGES=OUT/'pages'; JS=OUT/'js'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5'})
          targets={
            '9fzt_current':'https://www.9fzt.com/detail/sz_002030_10_508957738559.html',
            '9fzt_old':'https://www.9fzt.com/detail/sz_002030_3_ba6aeea10aa02d017368232603806f9b.html',
            '9fzt_2020':'https://www.9fzt.com/detail/sz_002030_3_5d7cb1e6c7e03cb5b2b3905f02a30fc0.html',
            'sina_2016':'http://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/3124306/index.phtml',
            'sina_2020a':'http://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/648229670402/index.phtml',
            'sina_2020b':'http://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/684425869377/index.phtml',
            'fxbaogao':'https://www.fxbaogao.com/detail/63944',
            'nxny':'https://www.nxny.com/report/view_4461177.html',
            'hibor':'http://www.hibor.com.cn/repinfodetail_169609.html',
            'eastmoney':'https://data.eastmoney.com/report/stock.jshtml?stockcode=002030',
          }
          findings=[]; snippets=[]; all_script_urls=[]
          url_re=re.compile(r'''(?:(?:https?:)?\\?/\\?/[^\s"'<>]+|https?://[^\s"'<>]+|["']([^"']+\.pdf(?:\?[^"']*)?)["'])''',re.I)
          keys=('pdf','download','fileurl','attach','reportapi','list2','infocode','rptid','oss','cos','documenturl','reporturl')
          def safe_name(x): return re.sub(r'[^A-Za-z0-9_.-]+','_',x)[:120]
          def extract_candidates(text, base):
              out=set()
              text2=html.unescape(text).replace('\\/','/')
              for m in re.finditer(r'https?://[^\s"\'<>\\]+', text2, re.I): out.add(m.group(0).rstrip('),;'))
              for m in re.finditer(r'(?:(?:href|src|url|fileUrl|pdfUrl|downloadUrl|reportUrl)["\']?\s*[:=]\s*["\'])([^"\']+)', text2, re.I):
                  out.add(urljoin(base,m.group(1)))
              for m in re.finditer(r'["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']', text2, re.I): out.add(urljoin(base,m.group(1)))
              return sorted(out)
          for name,url in targets.items():
              try:
                  r=s.get(url,timeout=60,allow_redirects=True,headers={'Referer':'https://www.baidu.com/'})
                  txt=r.text
                  (PAGES/f'{name}.html').write_text(txt,encoding='utf-8',errors='ignore')
                  rec={'name':name,'requested':url,'final':r.url,'status':r.status_code,'type':r.headers.get('content-type'),'bytes':len(r.content),'title':'','scripts':[],'candidates':extract_candidates(txt,r.url)[:300]}
                  try:
                      soup=BeautifulSoup(txt,'html.parser'); rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                      for tag in soup.find_all('script',src=True):
                          su=urljoin(r.url,tag.get('src')); rec['scripts'].append(su); all_script_urls.append((name,su))
                  except Exception: pass
                  low=txt.lower()
                  for key in keys:
                      pos=0
                      while True:
                          i=low.find(key,pos)
                          if i<0: break
                          snippets.append(f'\n===== PAGE {name} KEY {key} @ {i} =====\n'+txt[max(0,i-500):i+1200])
                          pos=i+len(key)
                          if pos>1000000 or sum(1 for z in snippets if f'PAGE {name} KEY {key}' in z)>=8: break
                  findings.append(rec)
                  print(name,r.status_code,len(r.content),r.url,rec['title'][:80])
              except Exception as e:
                  findings.append({'name':name,'requested':url,'error':repr(e)}); print(name,'ERROR',repr(e))

          # Fetch scripts, especially bundles from Eastmoney and 9FZT.
          seen=set(); script_records=[]
          for owner,su in all_script_urls:
              if su in seen: continue
              seen.add(su)
              if len(seen)>120: break
              try:
                  r=s.get(su,timeout=60,headers={'Referer':targets.get(owner,'')})
                  text=r.text
                  fn=JS/(safe_name(owner+'_'+str(len(script_records))+'_'+Path(urlparse(su).path).name)+'.js')
                  fn.write_text(text,encoding='utf-8',errors='ignore')
                  hitkeys=[k for k in keys if k in text.lower()]
                  script_records.append({'owner':owner,'url':su,'status':r.status_code,'bytes':len(r.content),'hitkeys':hitkeys,'candidates':extract_candidates(text,su)[:300]})
                  if hitkeys:
                      low=text.lower()
                      for key in hitkeys:
                          start=0; n=0
                          while n<10:
                              i=low.find(key,start)
                              if i<0: break
                              snippets.append(f'\n===== SCRIPT {owner} {su} KEY {key} @ {i} =====\n'+text[max(0,i-700):i+1600])
                              start=i+len(key); n+=1
              except Exception as e: script_records.append({'owner':owner,'url':su,'error':repr(e)})

          # Matrix-test Eastmoney API using multiple code formats, qTypes and body shapes.
          api='https://reportapi.eastmoney.com/report/list2'
          variants=[]
          codevals=['002030','002030.SZ','SZ002030','0.002030','SZ.002030','300750','300750.SZ','*','']
          for code in codevals:
            for qtype in [0,1,2,None]:
              body={'pageSize':100,'beginTime':'2000-01-01','endTime':'2030-01-01','pageNo':1,'fields':'','orgCode':'','code':code,'rcode':'','p':1,'pageNum':1,'pageNumber':1}
              if qtype is not None: body['qType']=qtype
              for extras in [0,1]:
                b=dict(body)
                if extras: b.update({'industryCode':'*','industry':'*','rating':'*','ratingChange':'*'})
                try:
                  rr=s.post(api,json=b,timeout=60,headers={'Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/stock.jshtml'})
                  try: obj=rr.json()
                  except Exception: obj={}
                  data=obj.get('data') if isinstance(obj,dict) else None
                  variants.append({'code':code,'qType':qtype,'extras':extras,'status':rr.status_code,'bytes':len(rr.content),'count':len(data) if isinstance(data,list) else None,'keys':list(obj.keys()) if isinstance(obj,dict) else [],'prefix':rr.text[:500]})
                except Exception as e: variants.append({'code':code,'qType':qtype,'extras':extras,'error':repr(e)})

          (OUT/'pages.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'scripts.json').write_text(json.dumps(script_records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'api_matrix.json').write_text(json.dumps(variants,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'snippets.txt').write_text('\n'.join(snippets),encoding='utf-8')
          print('pages',len(findings),'scripts',len(script_records),'snippets',len(snippets))
          print('nonzero API', [v for v in variants if (v.get('count') or 0)>0][:10])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daan-source-discovery-v4
          path: out/
          retention-days: 3
