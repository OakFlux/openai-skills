name: Build verified Lee and Man Paper broker report package 20260908

on:
  push:
    paths:
      - '.github/workflows/lee-man-paper-package-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pymupdf
      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import fitz, requests
          from pypdf import PdfReader

          package = '理文造纸_券商深度报告_公开完整版_3份'
          out = Path(package)
          out.mkdir(exist_ok=True)
          work = Path('_lee_man_work')
          work.mkdir(exist_ok=True)
          renders = work / 'renders'
          renders.mkdir(exist_ok=True)

          reports = [
            {
              'filename':'01_中国银河证券_造纸大王续写传奇_20161218_30页.pdf',
              'broker':'中国银河证券',
              'date':'2016-12-18',
              'title':'造纸龙头系列研究之理文造纸：造纸大王续写传奇，纸品多元化助推公司迈向新台阶',
              'type':'公司深度报告',
              'expected_pages':30,
              'url':'https://img3.gelonghui.com/pdf201612/pdf20161222093213172.pdf',
              'referer':'https://www.gelonghui.com/'
            },
            {
              'filename':'02_第一上海证券_世界包装纸领先企业_20131231_13页.pdf',
              'broker':'第一上海证券',
              'date':'2013-12-31',
              'title':'理文纸业（2314）首发报告：世界包装纸领先企业',
              'type':'公司首次覆盖报告',
              'expected_pages':13,
              'url':'https://www.mystockhk.com/UploadFiles/informationpdf/31151342A498F7B0.pdf',
              'referer':'https://www.mystockhk.com/'
            },
            {
              'filename':'03_东吴证券_造纸行业研究框架_含理文造纸重点分析_20181212_24页.pdf',
              'broker':'东吴证券',
              'date':'2018-12-12',
              'title':'造纸行业研究框架——价格为核心指标，龙头具长期投资价值',
              'type':'行业深度报告（含理文造纸数据、估值及重点分析）',
              'expected_pages':24,
              'url':'https://pdf.dfcfw.com/pdf/H3_AP201812121267784633_1.pdf?1544632877000.pdf=',
              'referer':'https://data.eastmoney.com/'
            }
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'
          })

          records=[]
          for r in reports:
            dest=out/r['filename']
            errors=[]
            for attempt in range(1,5):
              try:
                resp=s.get(r['url'],headers={'Referer':r['referer']},timeout=(20,180),allow_redirects=True)
                data=resp.content
                print('DOWNLOAD',r['broker'],attempt,resp.status_code,len(data),resp.url,flush=True)
                if resp.status_code==200 and data[:5]==b'%PDF-' and len(data)>100000:
                  dest.write_bytes(data)
                  break
                errors.append(f'HTTP {resp.status_code}, bytes={len(data)}, head={data[:20]!r}')
              except Exception as e:
                errors.append(repr(e))
              time.sleep(attempt*2)
            else:
              raise RuntimeError(f"download failed for {r['title']}: {errors}")

            reader=PdfReader(str(dest),strict=False)
            actual_pages=len(reader.pages)
            if actual_pages != r['expected_pages']:
              raise RuntimeError(f"page mismatch for {dest.name}: {actual_pages} != {r['expected_pages']}")
            q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
            if q.returncode not in (0,3):
              raise RuntimeError(f"qpdf check failed for {dest.name}: {q.stderr[-1000:]}")

            doc=fitz.open(str(dest))
            sample_pages=sorted(set([0,actual_pages//2,actual_pages-1]))
            rendered=[]
            for pno in sample_pages:
              page=doc.load_page(pno)
              pix=page.get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
              img=renders/f"{r['broker']}_{pno+1:03d}.png"
              pix.save(str(img))
              if img.stat().st_size < 5000 or pix.width < 400 or pix.height < 400:
                raise RuntimeError(f"render validation failed for {dest.name} page {pno+1}")
              rendered.append(pno+1)
            doc.close()

            data=dest.read_bytes()
            records.append({
              **{k:v for k,v in r.items() if k not in ('referer',)},
              'actual_pages':actual_pages,
              'bytes':len(data),
              'sha256':hashlib.sha256(data).hexdigest(),
              'rendered_pages':rendered
            })

          readme=[
            '理文造纸（02314.HK）券商深度报告',
            '',
            '本压缩包收录3份无需登录或付费即可公开取得的完整PDF，共67页。',
            '其中前两份为理文造纸公司专项报告；第三份为造纸行业深度报告，含理文造纸数据、经营比较和估值分析。',
            '',
          ]
          for i,r in enumerate(records,1):
            readme += [
              f"{i}. {r['broker']}：《{r['title']}》",
              f"   日期：{r['date']}；类型：{r['type']}；实际页数：{r['actual_pages']}页；文件大小：{r['bytes']/1048576:.2f} MB",
              f"   公开来源：{r['url']}",
              f"   SHA-256：{r['sha256']}",
              ''
            ]
          readme += [
            '完整性核验：PDF文件头、实际页数、qpdf结构检查，以及每份报告首页/中间页/末页渲染测试。',
            '未纳入仅提供付费、登录或App预览的2026年报告，也未以短篇业绩点评凑数。',
            '历史评级、目标价和盈利预测不构成当前投资建议。'
          ]
          (out/'报告清单与核验说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zp=Path(package+'.zip')
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=True) as z:
            for p in sorted(out.iterdir()):
              z.write(p,arcname=f'{package}/{p.name}')
          with zipfile.ZipFile(zp) as z:
            bad=z.testzip()
            if bad: raise RuntimeError('ZIP CRC failure: '+bad)
            pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if len(pdfs)!=3: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP',zp,zp.stat().st_size,'PDFS',len(records),'PAGES',sum(r['actual_pages'] for r in records),flush=True)
          print('MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: lee-man-paper-broker-reports-final
          path: 理文造纸_券商深度报告_公开完整版_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload validation renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-man-paper-validation-renders
          path: _lee_man_work/renders/
          if-no-files-found: ignore
          retention-days: 7
