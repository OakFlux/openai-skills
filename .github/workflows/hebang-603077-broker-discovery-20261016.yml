name: Discover Hebang Biotechnology 603077 broker reports 20261016

on:
  push:
    paths:
      - '.github/workflows/hebang-603077-broker-discovery-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Query report metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery_out
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests

          STOCK='603077'
          sess=requests.Session()
          sess.trust_env=False
          sess.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/report/{STOCK}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          url='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          logs=[]
          for page in range(1,21):
              params={
                  'cb':'datatable','pageSize':'100','pageNo':str(page),
                  'industryCode':'*','stockCode':STOCK,'orgCode':'','emRating':'',
                  'beginTime':'2000-01-01','endTime':'2026-10-16','qType':'0',
              }
              data=None; last=None
              for attempt in range(1,7):
                  try:
                      r=sess.get(url,params=params,timeout=(20,120))
                      last={'status':r.status_code,'bytes':len(r.content),'head':r.text[:200]}
                      if r.status_code==200:
                          text=r.text.strip()
                          if text.startswith('{'):
                              data=json.loads(text)
                          else:
                              i=text.find('('); j=text.rfind(')')
                              if i>=0 and j>i:
                                  data=json.loads(text[i+1:j])
                          if data is not None: break
                  except Exception as e:
                      last={'error':repr(e)}
                  time.sleep(attempt)
              if data is None:
                  raise RuntimeError(f'API failed page {page}: {last}')
              rows=data.get('data') or []
              if isinstance(rows,dict):
                  rows=rows.get('list') or rows.get('data') or []
              logs.append({'page':page,'count':len(rows),'keys':list(data.keys())})
              if not rows: break
              all_rows.extend(rows)
              if len(rows)<100: break
              time.sleep(0.2)

          unique=[]; seen=set()
          for row in all_rows:
              code=str(row.get('infoCode') or '')
              key=code or json.dumps(row,ensure_ascii=False,sort_keys=True)
              if key in seen: continue
              seen.add(key); unique.append(row)

          def date(row): return str(row.get('publishDate') or '')[:10]
          def pages(row):
              try: return int(row.get('attachPages') or 0)
              except: return 0
          unique.sort(key=lambda r:(date(r),pages(r)),reverse=True)
          Path('discovery_out/hebang_603077_all_report_metadata.json').write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery_out/query_log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')

          lines=[f'TOTAL={len(unique)}']
          for r in unique:
              lines.append('\t'.join([
                  date(r), str(pages(r)), str(r.get('orgSName') or r.get('orgName') or ''),
                  str(r.get('title') or ''), str(r.get('infoCode') or ''),
                  str(r.get('column') or ''), str(r.get('reportType') or ''),
              ]))
          Path('discovery_out/hebang_603077_report_index.tsv').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:80]))
          PY

      - name: Upload discovery output
        uses: actions/upload-artifact@v4
        with:
          name: hebang-603077-broker-discovery-20261016
          path: discovery_out/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
