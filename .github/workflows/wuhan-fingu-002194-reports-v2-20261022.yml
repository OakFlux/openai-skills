name: Build Wuhan Fingu 002194 reports v2 20261022

on:
  push:
    paths:
      - '.github/workflows/wuhan-fingu-002194-reports-v2-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Extract corrected build script and run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          from pathlib import Path

          url = 'https://raw.githubusercontent.com/OakFlux/openai-skills/main/.github/workflows/wuhan-fingu-002194-reports-20261022.yml'
          text = requests.get(url, timeout=120).text
          lines = text.splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          block = lines[start:end]
          nonempty = [len(x) - len(x.lstrip(' ')) for x in block if x.strip()]
          indent = min(nonempty)
          script = '\n'.join(x[indent:] if len(x) >= indent else '' for x in block) + '\n'
          script = script.replace(
              "quarter_pattern = re.compile(r'2026年(?:第一季度报告|第三季度报告)')",
              "quarter_pattern = re.compile(r'2026年(?:(?:第?一)|(?:第?三))季度报告')",
          )
          script = script.replace(
              "period_score = 3 if '第三季度报告' in title else 1",
              "period_score = 3 if ('三季度报告' in title or '第三季度报告' in title) else 1",
          )
          Path('/tmp/wuhan_fingu_build.py').write_text(script, encoding='utf-8')
          print('SCRIPT_LINES', len(script.splitlines()))
          PY
          python /tmp/wuhan_fingu_build.py

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-fingu-002194-reports-final-v2
          path: |
            wuhan_fingu_002194_2020_2025_annual_latest_quarterly.zip
            武汉凡谷_002194_2020-2025年报及最新季报.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
