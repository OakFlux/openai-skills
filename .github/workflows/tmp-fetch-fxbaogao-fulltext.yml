name: Temporary fetch fxbaogao embedded full text

on:
  push:
    branches:
      - tmp/china-everbright-fxbaogao-fulltext-20260831

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check --quiet beautifulsoup4 lxml
      - name: Fetch one detail page and extract long attributes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --http1.1 --compressed --location --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 45 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36' \
            -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.6' \
            'https://www.fxbaogao.com/detail/5040903' -o out/detail.html
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import json, re

          html=Path('out/detail.html').read_text('utf-8',errors='replace')
          soup=BeautifulSoup(html,'lxml')
          candidates=[]
          for tag in soup.find_all(True):
              for key,val in tag.attrs.items():
                  if isinstance(val,list): val=' '.join(map(str,val))
                  val=str(val)
                  if len(val)>1000 or any(x in val for x in ['资负共振','中国光大控股(0165)','中国光大控股（0165']):
                      candidates.append({'tag':tag.name,'key':key,'length':len(val),'value':val})
          # Also collect very large scripts and visible nodes.
          scripts=[]
          for idx,tag in enumerate(soup.find_all('script')):
              val=tag.string or tag.get_text('',strip=False)
              if val and (len(val)>5000 or '资负共振' in val or '5040903' in val):
                  scripts.append({'index':idx,'id':tag.get('id'),'type':tag.get('type'),'length':len(val),'value':val})
          nodes=[]
          for tag in soup.find_all(['div','article','section','pre']):
              val=tag.get_text('\n',strip=True)
              if len(val)>5000:
                  nodes.append({'tag':tag.name,'id':tag.get('id'),'class':tag.get('class'),'length':len(val),'value':val})
          data={'html_length':len(html),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'candidates':candidates,'scripts':scripts,'nodes':nodes}
          Path('out/extracted.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HTML_LENGTH',len(html))
          print('TITLE',data['title'])
          print('CANDIDATES',[(x['tag'],x['key'],x['length'],x['value'][:80]) for x in candidates])
          print('SCRIPTS',[(x['index'],x['id'],x['length']) for x in scripts])
          print('NODES',[(x['tag'],x['id'],x['length']) for x in nodes[:20]])
          print('HAS_TITLE', '资负共振' in html, 'HAS_SECTION_5', '5.风险提示' in html or '5. 风险提示' in html)
          PY
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-5040903-fulltext
          path: out/
          retention-days: 3
          if-no-files-found: error