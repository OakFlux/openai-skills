name: Build Star Plus Legend 06683 broker deep report package 20260927

on:
  push:
    paths:
      - '.github/workflows/star-plus-legend-06683-broker-final-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf fonttools

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '巨星传奇_06683_券商深度报告_2份_公开完整PDF'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          reports = [
              {
                  'filename': '01_开源证券_巨星传奇_港股首次覆盖_把握健康生活红利焕新明星IP价值加速进击_2024-08-15_29页.pdf',
                  'broker': '开源证券',
                  'title': '把握健康生活红利，焕新明星IP价值，加速进击——港股公司首次覆盖报告',
                  'date': '2024-08-15',
                  'analysts': '初敏、方光照',
                  'rating': '买入（首次覆盖）',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202408151639297927_1.pdf',
                  'expected_pages': 29,
                  'min_bytes': 1_000_000,
                  'identity_terms': ['巨星传奇', '06683', '6683'],
                  'broker_terms': ['开源证券', 'kysec.cn'],
              },
              {
                  'filename': '02_西南证券_巨星传奇_IP创造重点发力粉丝带动零售变现_2024-01-04_21页.pdf',
                  'broker': '西南证券',
                  'title': 'IP创造重点发力，粉丝带动零售变现',
                  'date': '2024-01-04',
                  'analysts': '刘言',
                  'rating': '持有（首次覆盖）',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202401151617487226_1.pdf',
                  'expected_pages': 21,
                  'min_bytes': 1_000_000,
                  'identity_terms': ['巨星传奇', '6683'],
                  'broker_terms': ['西南证券', 'swsc.com.cn'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://data.eastmoney.com/',
          })

          def download_pdf(url: str, dest: Path, min_bytes: int) -> str:
              errors=[]
              for attempt in range(1,5):
                  tmp=dest.with_suffix(dest.suffix+'.part')
                  try:
                      with session.get(url,timeout=(30,240),allow_redirects=True,stream=True) as r:
                          print('DOWNLOAD',dest.name,'attempt',attempt,'status',r.status_code,'final',r.url,flush=True)
                          r.raise_for_status()
                          with tmp.open('wb') as fh:
                              for chunk in r.iter_content(1024*1024):
                                  if chunk: fh.write(chunk)
                      size=tmp.stat().st_size
                      with tmp.open('rb') as fh: head=fh.read(8)
                      if size < min_bytes or not head.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF: size={size}, head={head!r}')
                      tmp.replace(dest)
                      return str(r.url)
                  except Exception as exc:
                      errors.append(f'attempt {attempt}: {exc!r}')
                      tmp.unlink(missing_ok=True)
                      time.sleep(attempt*2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def sample_text(reader: PdfReader) -> str:
              n=len(reader.pages)
              idx=list(range(min(12,n)))
              if n>14: idx += list(range(max(0,n-3),n))
              parts=[]
              for i in dict.fromkeys(idx):
                  try: parts.append(reader.pages[i].extract_text() or '')
                  except Exception: pass
              return '\n'.join(parts)

          records=[]; seen=set()
          for rep in reports:
              dest=out/rep['filename']
              final_url=download_pdf(rep['url'],dest,rep['min_bytes'])
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages != rep['expected_pages']:
                  raise RuntimeError(f'page count mismatch for {dest.name}: {pages} != {rep["expected_pages"]}')
              text=sample_text(reader).lower()
              if not any(t.lower() in text for t in rep['identity_terms']):
                  raise RuntimeError(f'company identity not verified: {dest.name}')
              if not any(t.lower() in text for t in rep['broker_terms']):
                  raise RuntimeError(f'broker identity not verified: {dest.name}')
              check=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if check.returncode not in (0,3):
                  raise RuntimeError(f'qpdf check failed {dest.name}: {check.stderr[-1200:]}')
              data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in seen: raise RuntimeError('duplicate PDF detected')
              seen.add(sha)
              rec={
                  'filename':rep['filename'],'broker':rep['broker'],'title':rep['title'],
                  'publication_date':rep['date'],'analysts':rep['analysts'],'rating':rep['rating'],
                  'source_url':final_url,'pages':pages,'bytes':len(data),'sha256':sha,
              }
              records.append(rec)
              print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          readme=[
              '巨星传奇集团有限公司（06683.HK / 6683.HK）券商深度研究报告',
              '整理日期：2026-09-27',
              '',
              '收录原则：仅收录可公开直接取得、公司身份与券商身份可核验、篇幅达到公司深度或首次覆盖标准的完整PDF。',
              '未收录短篇业绩点评、只有网页摘要的报告、需要付费或加密权限的报告。',
              '',
              '文件清单：',
          ]
          for i,r in enumerate(records,1):
              readme.extend([
                  f'{i}. {r["broker"]}｜{r["title"]}',
                  f'   日期：{r["publication_date"]}；分析师：{r["analysts"]}；评级：{r["rating"]}',
                  f'   文件：{r["filename"]}',
                  f'   页数：{r["pages"]}；大小：{r["bytes"]/1048576:.2f} MB',
                  f'   来源：{r["source_url"]}',
                  f'   SHA-256：{r["sha256"]}',
                  '',
              ])
          readme.extend([
              '完整性核验：PDF文件头、实际页数、公司身份、券商身份、qpdf结构检查、重复文件检查、逐文件SHA-256及ZIP CRC。',
          ])
          (out/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in sorted(out.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=2: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',zip_sha,flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: star-plus-legend-06683-broker-deep-reports-final
          path: 巨星传奇_06683_券商深度报告_2份_公开完整PDF.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
