name: Discover ST Xiwang 000639 broker reports 20261020

on:
  push:
    branches:
      - tmp/st-xiwang-000639-broker-discovery-20261020-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query research-report sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, time
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})

          print('=== EASTMONEY REPORT API ===')
          api='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          for qtype in ['0','1','2']:
            for page in range(1,12):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'000639','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              r=s.get(api,params=params,timeout=(20,120)); print('status',qtype,page,r.status_code,len(r.content),r.url)
              try: d=r.json()
              except Exception:
                print(r.text[:500]); break
              batch=d.get('data') or []
              if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
              print('QTYPE',qtype,'PAGE',page,'HITS',d.get('hits'),'COUNT',len(batch) if isinstance(batch,list) else 'bad')
              if not isinstance(batch,list) or not batch: break
              all_rows.extend(batch)
              if len(batch)<100: break
              time.sleep(.1)
          seen=set(); out=[]
          for x in all_rows:
            info=str(x.get('infoCode') or x.get('info_code') or '')
            if not info or info in seen: continue
            seen.add(info)
            out.append({k:x.get(k) for k in ['infoCode','title','orgSName','orgCode','publishDate','attachPages','stockCode','stockName','researcher','emRatingName','ratingChange','indvInduName','predictNextTwoYearEps']})
          print('RESULT_COUNT',len(out))
          print(json.dumps(out,ensure_ascii=False,indent=2,default=str))

          print('\n=== SINA SEARCH PAGES ===')
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=2&symbol=000639',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=2&keyword=000639',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=2&keyword=%CE%F7%CD%F5%CA%B3%C6%B7',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=(20,120));
              enc=r.apparent_encoding or r.encoding or 'gb18030'; text=r.content.decode(enc,errors='replace')
              soup=BeautifulSoup(text,'lxml')
              print('\nURL',url,'STATUS',r.status_code,'BYTES',len(r.content),'TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              candidates=[]
              for a in soup.find_all('a',href=True):
                label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                href=urljoin(r.url,a['href'])
                if ('vReport_Show' in href or 'rptid' in href) and any(k in label for k in ['西王','000639','玉米油','食品']):
                  candidates.append({'label':label,'url':href})
              print(json.dumps(candidates[:100],ensure_ascii=False,indent=2))
            except Exception as e:
              print('SINA_ERROR',url,repr(e))
          PY
