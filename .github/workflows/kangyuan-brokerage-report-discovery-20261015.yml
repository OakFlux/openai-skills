name: Discover Kangyuan Pharmaceutical brokerage reports

on:
  push:
    paths:
      - '.github/workflows/kangyuan-brokerage-report-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query Eastmoney public research-report API
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          CODE = '600557'
          OUT = Path('kangyuan_brokerage_discovery')
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/600557.html',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          windows = [
              ('2010-01-01', '2014-12-31'),
              ('2015-01-01', '2019-12-31'),
              ('2020-01-01', '2022-12-31'),
              ('2023-01-01', '2024-12-31'),
              ('2025-01-01', '2026-10-15'),
          ]

          found = []
          seen = set()
          queries = []
          for begin, end in windows:
              for page in range(1, 20):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*', 'rating': '*',
                      'ratingchange': '*', 'beginTime': begin, 'endTime': end,
                      'pageNo': str(page), 'fields': '', 'qType': '0', 'orgCode': '',
                      'code': CODE, 'rcode': '', 'p': str(page), 'pageNum': str(page),
                      'pageNumber': str(page), '_': str(int(time.time() * 1000)),
                  }
                  response = session.get(endpoint, params=params, timeout=90)
                  print('QUERY', begin, end, page, response.status_code, len(response.content), response.url, flush=True)
                  response.raise_for_status()
                  payload = response.json() or {}
                  rows = payload.get('data') or []
                  queries.append({'begin': begin, 'end': end, 'page': page, 'hits': payload.get('hits'), 'rows': rows})
                  print('ROWS', len(rows), 'HITS', payload.get('hits'), flush=True)
                  if not rows:
                      break
                  for row in rows:
                      code = str(row.get('stockCode') or '')
                      name = str(row.get('stockName') or '')
                      if code == CODE or '康缘药业' in name:
                          info_code = str(row.get('infoCode') or '')
                          key = info_code or (row.get('title'), row.get('publishDate'), row.get('orgSName'))
                          if key not in seen:
                              seen.add(key)
                              found.append(row)
                              print('FOUND', json.dumps(row, ensure_ascii=False), flush=True)
                  if len(rows) < 100:
                      break

          found.sort(key=lambda row: str(row.get('publishDate') or ''), reverse=True)
          OUT.joinpath('found_reports.json').write_text(json.dumps(found, ensure_ascii=False, indent=2), encoding='utf-8')
          OUT.joinpath('query_snapshots.json').write_text(json.dumps(queries, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_FOUND', len(found), flush=True)
          for row in found:
              summary = {key: row.get(key) for key in (
                  'title', 'stockName', 'stockCode', 'orgSName', 'orgName', 'publishDate',
                  'infoCode', 'attachPages', 'attachSize', 'researcher', 'emRatingName',
                  'sRatingName', 'column', 'reportType', 'indvIsNew'
              )}
              print('SUMMARY', json.dumps(summary, ensure_ascii=False), flush=True)
          PY
      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: kangyuan-brokerage-report-discovery-20261015
          path: kangyuan_brokerage_discovery
          retention-days: 7
          compression-level: 6