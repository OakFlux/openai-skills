name: Inspect Yanbaoke report download links 20261012

on:
  push:
    paths:
      - '.github/workflows/yanbaoke-known-report-inspect-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect page and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          from bs4 import BeautifulSoup
          urls=['https://pc.yanbaoke.cn/info/hE6AtQEFRHTDLPWmNBfqzX']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://pc.yanbaoke.cn/','Accept-Language':'zh-CN,zh;q=0.9'})
          scripts=set()
          for url in urls:
            r=s.get(url,timeout=(15,60),allow_redirects=True)
            print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
            text=r.text; soup=BeautifulSoup(text,'lxml')
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
            anchors=[]
            for a in soup.find_all('a',href=True): anchors.append({'text':' '.join(a.get_text(' ',strip=True).split()),'href':urllib.parse.urljoin(r.url,a['href']),'title':a.get('title')})
            print('ANCHORS',json.dumps(anchors[:500],ensure_ascii=False),flush=True)
            for script in soup.find_all('script',src=True): scripts.add(urllib.parse.urljoin(r.url,script['src']))
            for pat in ('pdf','download','下载pdf','fileUrl','oss','hE6AtQEFRHTDLPWmNBfqzX','api/'):
              snips=[]
              for m in list(re.finditer(pat,text,re.I))[:100]: snips.append(text[max(0,m.start()-400):min(len(text),m.end()+800)])
              if snips: print('SNIPS',pat,json.dumps(snips[:50],ensure_ascii=False),flush=True)
          for i,url in enumerate(sorted(scripts),1):
            try:
              r=s.get(url,timeout=(15,60)); text=r.text
              print('SCRIPT',i,r.status_code,len(r.content),url,flush=True)
              hits=[]
              for pat in ('download','pdf','fileUrl','oss','report','info/'):
                for m in list(re.finditer(pat,text,re.I))[:100]: hits.append(text[max(0,m.start()-200):min(len(text),m.end()+400)])
              if hits: print('SCRIPT_HITS',url,json.dumps(hits[:100],ensure_ascii=False),flush=True)
            except Exception as e: print('SCRIPT_ERR',url,repr(e),flush=True)
          PY
