name: Build validated Xinjiang Joinworld research package

on:
  push:
    paths:
      - '.github/workflows/xinjiang-joinworld-broker-research-mixed-package-v3-20261022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4
      - name: Adjust archive-size guard and build
        run: |
          sed -i 's/len(archive_bytes) < 10_000/len(archive_bytes) < 2_000/' .github/scripts/package_xinjiang_joinworld_mixed_20261022.py
          python .github/scripts/package_xinjiang_joinworld_mixed_20261022.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: xinjiang-joinworld-broker-research-mixed-package-v3
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
