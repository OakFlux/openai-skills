name: Build fixed Jinyao Pharma 600488 brokerage package 20260929

on:
  push:
    paths:
      - '.github/workflows/jinyao-600488-brokerage-package-fixed-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests beautifulsoup4 reportlab pypdf

      - name: Run corrected packaging script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYFIX'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/jinyao-600488-brokerage-package-20260929.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = source.index(marker_start) + len(marker_start)
          end = source.index(marker_end, start)
          script = textwrap.dedent(source[start:end])
          script = script.replace("'min_bytes': 20_000", "'min_bytes': 5_000")
          Path('/tmp/build_jinyao_package.py').write_text(script, encoding='utf-8')
          PYFIX
          python /tmp/build_jinyao_package.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: jinyao-600488-brokerage-reports-fixed-20260929
          path: 津药药业_600488_券商深度及重点研究报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
