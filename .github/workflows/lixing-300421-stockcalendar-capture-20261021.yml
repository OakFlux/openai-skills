name: Capture Lixing stock calendar research events 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-stockcalendar-capture-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: Capture calendar APIs and research events
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          from playwright.async_api import async_playwright

          requests_seen=[]
          responses=[]
          matching=[]

          def walk(obj, source=''):
              if isinstance(obj, dict):
                  text=json.dumps(obj,ensure_ascii=False)
                  if ('300421' in text or '力星股份' in text) and any(k in text for k in ['研报','研究报告','陶瓷球','滚动体','机器人','800V']):
                      item=dict(obj); item['_source']=source; matching.append(item)
                  for v in obj.values(): walk(v,source)
              elif isinstance(obj,list):
                  for v in obj: walk(v,source)

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  context=await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                      locale='zh-CN',viewport={'width':1440,'height':1000})
                  page=await context.new_page()
                  def on_request(req):
                      u=req.url
                      if any(k in u.lower() for k in ['calendar','datacenter','api/data','stockcalendar']):
                          requests_seen.append({'method':req.method,'url':u,'post_data':req.post_data,'resource_type':req.resource_type})
                  async def on_response(resp):
                      try:
                          u=resp.url; ct=(resp.headers.get('content-type') or '').lower()
                          if not any(k in u.lower() for k in ['calendar','datacenter','api/data','stockcalendar']): return
                          item={'status':resp.status,'url':u,'content_type':ct}
                          if resp.status==200 and ('json' in ct or 'javascript' in ct or 'text' in ct):
                              body=await resp.text(); item['body_length']=len(body)
                              if len(body)<5_000_000:
                                  try:
                                      obj=json.loads(body); walk(obj,u); item['json']=True
                                  except Exception:
                                      if any(k in body for k in ['300421','力星股份','陶瓷球','研报']): item['excerpt']=body[:20000]
                          responses.append(item)
                      except Exception as exc:
                          responses.append({'error':repr(exc)})
                  page.on('request',on_request)
                  page.on('response',lambda r:asyncio.create_task(on_response(r)))
                  await page.goto('https://data.eastmoney.com/stockcalendar/300421.html',wait_until='domcontentloaded',timeout=90000)
                  await page.wait_for_timeout(25000)
                  body=''
                  try: body=re.sub(r'\s+',' ',(await page.locator('body').inner_text())[:100000])
                  except Exception: pass
                  links=[]
                  try:
                      links=await page.locator('a').evaluate_all("els=>els.map(a=>({text:(a.innerText||'').trim(),href:a.href})).filter(x=>x.href && (/研报|陶瓷|滚动体|机器人|300421/.test(x.text+' '+x.href)))")
                  except Exception: pass
                  await page.wait_for_timeout(3000)
                  await browser.close()

              dedup=[]; seen=set()
              for x in matching:
                  key=json.dumps(x,ensure_ascii=False,sort_keys=True)
                  if key not in seen: seen.add(key); dedup.append(x)
              out={'matching':dedup,'requests':requests_seen,'responses':responses,'body':body,'links':links}
              Path('lixing_stockcalendar_capture.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
              print('MATCHING',len(dedup))
              for x in dedup[:100]: print(json.dumps(x,ensure_ascii=False)[:8000])
              print('REQUESTS',len(requests_seen))
              for x in requests_seen: print('REQ',json.dumps(x,ensure_ascii=False)[:5000])
              print('LINKS',json.dumps(links,ensure_ascii=False)[:10000])

          asyncio.run(main())
          PY

      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: lixing-stockcalendar-capture
          path: lixing_stockcalendar_capture.json
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
