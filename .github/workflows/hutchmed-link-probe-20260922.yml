name: Probe HUTCHMED official report links 20260922

on:
  push:
    paths:
      - '.github/workflows/hutchmed-link-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe official pages
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re, requests
          from bs4 import BeautifulSoup

          urls = [
            'https://www.hutch-med.com/shareholder-information/financial-reports/',
            'https://www.hutch-med.com/shareholder-information/financial-reports-filings/',
            'https://www.hutch-med.com/shareholder-information/hk-listing-documents/',
            'https://www.hutch-med.com/shareholder-information/aim-rule-26/',
            'https://www.hutch-med.com/final-prospectus/',
            'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000001102',
          ]
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
            'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
            'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
          })
          out=[]
          for url in urls:
            out.append('\n'+'='*100+'\nURL '+url)
            try:
              r=s.get(url,timeout=(20,90),allow_redirects=True)
              out.append(f'STATUS {r.status_code} FINAL {r.url} BYTES {len(r.content)} CT {r.headers.get("content-type")}')
              text=r.text
              Path('html_'+re.sub(r'[^A-Za-z0-9]+','_',url)[-80:]+'.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'lxml')
              links=[]
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a.get('href'))
                label=' '.join(a.get_text(' ',strip=True).split())
                key=(label+' '+href).lower()
                if any(k in key for k in ['pdf','annual','interim','prospect','admission','listing document','form 20-f','2026 interim report']):
                  links.append({'text':label,'href':href})
              out.append(json.dumps(links,ensure_ascii=False,indent=2))
            except Exception as e:
              out.append('ERROR '+repr(e))
          Path('probe.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: hutchmed-link-probe
          path: |
            probe.txt
            html_*.html
          if-no-files-found: error
          retention-days: 7
