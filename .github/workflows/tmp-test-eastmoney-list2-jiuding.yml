name: Temporary Query Eastmoney List2 Jiuding Reports

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query list2 and verify PDF archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/002201.html',
              'Accept': 'application/json,text/plain,*/*',
          })

          for code in ['002201','SZ002201','002201.SZ']:
              body = {
                  'pageSize': 100,
                  'pageNo': 1,
                  'p': 1,
                  'pageNum': 1,
                  'pageNumber': 1,
                  'beginTime': '2000-01-01',
                  'endTime': '2030-01-01',
                  'code': code,
                  'industryCode': '*',
                  'rating': None,
                  'ratingChange': None,
                  'orgCode': None,
                  'rcode': ''
              }
              r = session.post('https://reportapi.eastmoney.com/report/list2', json=body, timeout=60)
              print('\nCODE', code, 'STATUS', r.status_code, 'TYPE', r.headers.get('content-type'), 'BYTES', len(r.content))
              print('HEAD', r.text[:500])
              r.raise_for_status()
              try:
                  payload = r.json()
              except Exception as exc:
                  print('JSON_ERROR', repr(exc)); continue
              data = payload.get('data') or []
              print('HITS', payload.get('hits'), 'SIZE', payload.get('size'), 'DATA', len(data))
              for item in data:
                  info = item.get('infoCode') or ''
                  record = {
                      'title': item.get('title'),
                      'org': item.get('orgSName') or item.get('orgName'),
                      'date': item.get('publishDate'),
                      'pages': item.get('attachPages'),
                      'size': item.get('attachSize'),
                      'infoCode': info,
                      'researcher': item.get('researcher'),
                      'stockName': item.get('stockName'),
                      'stockCode': item.get('stockCode'),
                  }
                  print('ITEM', json.dumps(record, ensure_ascii=False, sort_keys=True))
                  if info:
                      for prefix in ['H3','H2','H1']:
                          url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                          rr = session.get(url, timeout=45, allow_redirects=True, stream=True)
                          head = next(rr.iter_content(chunk_size=32), b'')
                          print('PDF', prefix, rr.status_code, rr.headers.get('content-type'), rr.headers.get('content-length'), head[:8], url)
                          rr.close()
          PY
