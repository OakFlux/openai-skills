name: Temporary broader Blackstone report catalogue search

on:
  push:
    branches:
      - tmp/blackstone-broker-reports-20260829
    paths:
      - .github/workflows/tmp-blackstone-more-metadata.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Search catalogue
        run: |
          python - <<'PY'
          import json
          import requests

          queries = [
              '黑石集团',
              '全球另类投资巨头',
              '另类投资巨头',
              '黑石集团概况',
              'Blackstone',
              '全球领先的另类资产管理公司',
              '全球另类资产管理巨头',
          ]
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          seen=set()
          for q in queries:
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/search',json={'page':1,'pageSize':100,'keyword':q},timeout=60)
                  r.raise_for_status()
                  rows=(r.json().get('data') or {}).get('files') or []
                  print('\nQUERY',q,'COUNT',len(rows))
              except Exception as e:
                  print('ERROR',q,repr(e)); continue
              for row in rows:
                  name=str(row.get('name') or '')
                  if not any(x.lower() in name.lower() for x in ['黑石','blackstone','另类投资','另类资产']):
                      continue
                  rid=row.get('id')
                  if rid in seen: continue
                  seen.add(rid)
                  try:
                      d=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=60).json()
                      detail=(d.get('data') or {}) if d.get('status')==1 else {}
                  except Exception as e:
                      detail={}; print('DETAIL_ERROR',rid,repr(e))
                  rec={
                      'id':rid,
                      'name':name,
                      'page_count':detail.get('page_count') or row.get('page_count'),
                      'time_text':detail.get('time_text') or row.get('time_text'),
                      'organization':((detail.get('organization') or {}).get('name') if isinstance(detail.get('organization'),dict) else detail.get('organization')),
                      'page_url':detail.get('page_url') or row.get('page_url'),
                      'data_source_uuid':detail.get('data_source_uuid') or row.get('data_source_uuid'),
                      'original_id':detail.get('original_id') or row.get('original_id'),
                      'file_size':detail.get('file_size') or row.get('file_size'),
                      'content_prefix':str(detail.get('content') or '')[:800],
                  }
                  print('MATCH',json.dumps(rec,ensure_ascii=False))
          PY
