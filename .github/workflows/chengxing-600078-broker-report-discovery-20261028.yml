name: Discover Chengxing broker report PDFs

on:
  push:
    paths:
      - '.github/workflows/chengxing-600078-broker-report-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Inspect report pages in detail
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          pages=[
            ('2026-02-06','https://news.10jqka.com.cn/field/sr/20260206/56153303.shtml'),
            ('2019-09-23','https://news.10jqka.com.cn/field/sr/20190923/21514037.shtml'),
            ('2014-10-16','https://news.10jqka.com.cn/field/sr/20141016/3611947.shtml'),
          ]
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://stockpage.10jqka.com.cn/600078/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
          })
          for date,url in pages:
            r=s.get(url,timeout=60,allow_redirects=True)
            text=r.content.decode('gb18030','replace')
            soup=BeautifulSoup(text,'lxml')
            plain='\n'.join(x.strip() for x in soup.get_text('\n').splitlines() if x.strip())
            print('\n===== PAGE',date,r.status_code,len(r.content),r.url,'=====')
            print('PLAIN_TEXT_START')
            print(plain[:20000])
            print('PLAIN_TEXT_END')
            for script in soup.find_all('script'):
              body=script.get_text('\n',strip=False)
              if any(k in body for k in ('澄星','pdfUrl','精细磷化工','国内磷酸龙头','研究员','评级')):
                print('SCRIPT_START')
                print(body[:30000])
                print('SCRIPT_END')
            for tag in soup.find_all(['a','iframe','embed','object']):
              attrs={k:tag.get(k) for k in ('href','src','data','id','class') if tag.get(k)}
              label=' '.join(tag.get_text(' ',strip=True).split())
              if attrs or label:
                blob=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in blob for k in ('pdf','download','报告','研报','original','attach','file')):
                  for k in ('href','src','data'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('LINKTAG',json.dumps({'label':label[:1000],'attrs':attrs},ensure_ascii=False))
            for pat in [
              r'window\.pdfUrl\s*=\s*"([^"]*)"',
              r'var\s+title\s*=\s*\'([^\']*)\'',
              r'var\s+content\s*=\s*\'((?:\\.|[^\'])*)\'',
              r'https?:\\?/\\?/[^"\'<>\s]+',
            ]:
              vals=[]
              for m in re.finditer(pat,text,re.S|re.I):
                vals.append(m.group(1) if m.lastindex else m.group(0))
              for v in list(dict.fromkeys(vals))[:50]:
                print('REGEX',v[:10000])
          PY
