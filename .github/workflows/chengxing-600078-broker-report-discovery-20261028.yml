name: Discover Chengxing broker report PDFs

on:
  push:
    paths:
      - '.github/workflows/chengxing-600078-broker-report-discovery-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Inspect 10jqka pages and Eastmoney report API
        run: |
          python - <<'PY'
          import json, re, time, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          s=requests.Session()
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=.8,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          pages=[
            ('2026-02-06','https://news.10jqka.com.cn/field/sr/20260206/56153303.shtml'),
            ('2019-09-23','https://news.10jqka.com.cn/field/sr/20190923/21514037.shtml'),
            ('2014-10-16','https://news.10jqka.com.cn/field/sr/20141016/3611947.shtml'),
            ('2013-04-18','https://news.10jqka.com.cn/field/sr/20130418/1752407.shtml'),
          ]
          for date,url in pages:
            try:
              r=s.get(url,timeout=60,allow_redirects=True,headers={'Referer':'https://stockpage.10jqka.com.cn/600078/'})
              print('\nPAGE',date,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              raw=r.content
              text=None
              for enc in ('utf-8','gb18030','gbk'):
                try:
                  text=raw.decode(enc); print('ENC',enc); break
                except Exception: pass
              if text is None: text=raw.decode('utf-8','replace')
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for m in soup.find_all('meta'):
                if m.get('name') or m.get('property'):
                  k=m.get('name') or m.get('property'); v=m.get('content')
                  if v and any(x in (k or '').lower() for x in ('title','description','keywords','author')): print('META',k,v[:1000])
              for tag in soup.find_all(['a','script','iframe','embed','object']):
                attrs={k:tag.get(k) for k in ('href','src','data','type','id','class') if tag.get(k)}
                label=' '.join(tag.get_text(' ',strip=True).split())
                blob=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in blob for k in ('pdf','download','研报','报告','source','attach','file','eastmoney','dfcfw')):
                  for k in ('href','src','data'):
                    if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                  print('TAG',tag.name,json.dumps({'label':label[:500],'attrs':attrs},ensure_ascii=False)[:3000])
              pats=[r'AP\d{18}',r'https?://[^\"\'<>\s]+',r'(?:pdf|file|download|url|source|attach)[A-Za-z_]*\s*[:=]\s*[\"\']([^\"\']+)[\"\']']
              for pat in pats:
                vals=[]
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if any(k in v.lower() for k in ('pdf','dfcfw','eastmoney','report','download','attach')) or re.fullmatch(r'AP\d{18}',v): vals.append(v)
                for v in list(dict.fromkeys(vals))[:100]: print('REGEX',v[:2000])
            except Exception as e: print('PAGE_ERROR',date,repr(e))

          # Scan narrow date windows globally in Eastmoney API to recover infoCode metadata.
          api='https://reportapi.eastmoney.com/report/list'
          s.headers.update({'Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
          windows=[('2026-02-05','2026-02-07'),('2019-09-22','2019-09-24'),('2014-10-15','2014-10-17'),('2013-04-17','2013-04-19')]
          found={}
          for begin,end in windows:
            for qtype in ('0','1','2'):
              for page in range(1,41):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(api,params=params,timeout=60); r.raise_for_status(); data=r.json(); rows=data.get('data') or []; hits=int(data.get('hits') or 0)
                  if page==1: print('API_META',begin,end,qtype,'hits',hits,'rows',len(rows))
                  for x in rows:
                    blob='|'.join(str(x.get(k) or '') for k in ('title','stockName','stockCode','orgName','orgSName'))
                    if '澄星' in blob or '600078' in blob or any(t in blob for t in ('精细磷化工龙头企业','磷化工一体化发展','国内磷酸龙头','处快速扩张的初期')):
                      info=str(x.get('infoCode') or '')
                      found[info]=x
                      print('MATCH',json.dumps(x,ensure_ascii=False))
                  if not rows or page*100>=hits: break
                  time.sleep(.08)
                except Exception as e:
                  print('API_ERROR',begin,end,qtype,page,repr(e)); break
          print('FOUND_COUNT',len(found))
          for info,x in found.items():
            print('FINAL',info,json.dumps(x,ensure_ascii=False))
            print('PDF',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf')
          PY
