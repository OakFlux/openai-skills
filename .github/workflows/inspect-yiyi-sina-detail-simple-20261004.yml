name: Inspect Yiyi Sina detail simple 20261004

on:
  push:
    paths:
      - '.github/workflows/inspect-yiyi-sina-detail-simple-20261004.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Read prospectus detail page
        run: |
          curl -L --max-time 120 -A 'Mozilla/5.0' 'https://vip.stock.finance.sina.com.cn/corp/view/vISSUE_RaiseExplanationDetail.php?stockid=001206&id=7213515' -o /tmp/page.bin
          iconv -f GB18030 -t UTF-8 /tmp/page.bin > /tmp/page.html || cp /tmp/page.bin /tmp/page.html
          echo '--- lines 390-520 ---'
          sed -n '390,520p' /tmp/page.html
          echo '--- all URLs and attributes ---'
          grep -Eio 'https?://[^"'"'"' <>]+|(?:href|src|action)=["'"'"'][^"'"'"']+' /tmp/page.html | head -400 || true
          echo '--- likely identifiers ---'
          grep -Ein -C 3 '7213515|招股说明书|下载|PDF|iframe|attachment|file|content' /tmp/page.html | head -500 || true
