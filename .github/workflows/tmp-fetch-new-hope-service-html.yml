name: Temporary fetch New Hope Service report page sources

on:
  push:
    branches:
      - tmp/new-hope-service-html-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch report pages and scripts
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          O=Path('output'); O.mkdir(exist_ok=True)
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          pages={
            'reportify':'https://reportify.cn/reports/1105126013194604544',
            'fxbaogao':'https://www.fxbaogao.com/detail/5488726',
            'founder':'https://www.foundersc.com/infoResearchMacro/8655160.jhtml',
          }
          for name,url in pages.items():
            r=S.get(url,timeout=40,allow_redirects=True)
            (O/f'{name}.html').write_bytes(r.content)
            print('PAGE',name,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            html=r.text
            soup=BeautifulSoup(html,'html.parser')
            scripts=[]
            for i,s in enumerate(soup.find_all('script')):
              src=s.get('src')
              if src: scripts.append(urllib.parse.urljoin(r.url,src))
              else:
                txt=s.string or s.get_text() or ''
                if txt.strip(): (O/f'{name}_inline_{i}.js').write_text(txt,encoding='utf-8',errors='ignore')
            (O/f'{name}_scripts.txt').write_text('\n'.join(scripts),encoding='utf-8')
            for i,full in enumerate(scripts[:50]):
              try:
                rr=S.get(full,timeout=35)
                (O/f'{name}_script_{i:02d}.js').write_bytes(rr.content)
                print('SCRIPT',name,i,rr.status_code,len(rr.content),full)
              except Exception as e: print('SCRIPTERR',name,i,full,e)
            urls=sorted(set(re.findall(r'https?://[^\"\'<>\\ ]+',html)))
            (O/f'{name}_urls.txt').write_text('\n'.join(urls),encoding='utf-8')
            ids=sorted(set(re.findall(r'(?:AP\d{10,24}|[0-9a-f]{8}-[0-9a-f-]{27,36}|\d{15,22})',html,re.I)))
            (O/f'{name}_ids.txt').write_text('\n'.join(ids),encoding='utf-8')
          PY
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload page sources
        uses: actions/upload-artifact@v4
        with:
          name: new-hope-service-report-page-sources
          path: output/
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
