name: Fetch QuantGroup public report viewer source 20260920

on:
  push:
    paths:
      - '.github/workflows/quantgroup-fast-view-source-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch sources and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          python - <<'PY'
          import requests,json,re,html
          from bs4 import BeautifulSoup
          from pathlib import Path
          from urllib.parse import urljoin
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls={
            'fosun_view':'https://www.fxbaogao.com/view?id=5553065',
            'yingli_org':'https://www.fxbaogao.com/archives/organization/%E7%9B%88%E7%AB%8B%E8%AF%81%E5%88%B8',
            'daily':'https://www.fxbaogao.com/detail/5610598'
          }
          summary={}
          for key,u in urls.items():
            try:
              r=s.get(u,timeout=(15,60),allow_redirects=True)
              Path(f'out/{key}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.content,'lxml')
              scripts=[]
              for i,x in enumerate(soup.find_all('script')):
                src=x.get('src')
                if src:
                  su=urljoin(r.url,src)
                  scripts.append(su)
                  try:
                    sr=s.get(su,timeout=(15,60))
                    if sr.status_code==200 and len(sr.content)<8_000_000:
                      Path(f'out/{key}_script_{i:02d}.js').write_bytes(sr.content)
                  except Exception: pass
              links=[{'text':a.get_text(' ',strip=True),'href':urljoin(r.url,a['href'])} for a in soup.find_all('a',href=True)]
              imgs=[urljoin(r.url,(im.get('src') or im.get('data-src') or im.get('data-original'))) for im in soup.find_all('img') if (im.get('src') or im.get('data-src') or im.get('data-original'))]
              summary[key]={'input':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'scripts':scripts,'links':links,'images':imgs,'urls':sorted(set(html.unescape(x).replace('\\/','/') for x in re.findall(r'https?://[^\s"\'<>]+',r.text)))}
            except Exception as e: summary[key]={'input':u,'error':repr(e)}
          Path('out/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "AI战略发展赋能|智能硬件打开增长新范式|量化派|report-image|pageCount|totalPage|page_count|total_page|\.pdf|download" out > out/grep_hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: quantgroup-fast-view-source
          path: out
          retention-days: 7
