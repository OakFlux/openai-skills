name: Run exact NEEQ delisted query for 400062 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-delisted-exact-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - name: Exact query
        run: |
          python - <<'PY'
          import json, requests
          BASE='https://www.neeq.com.cn'
          PAGE=BASE+'/disclosure/snadc_announcement.html'
          EP=BASE+'/disclosureInfoController/infoResult_en.do'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA})
          print('WARM',s.get(PAGE,timeout=30).status_code,s.cookies.get_dict())
          cb='jQuery183_test_1770000000000'
          need=['companyCd','companyName','disclosureTitle','disclosurePostTitle','destFilePath','publishDate','fileExt']
          for flag in (0,1):
            for dtype in ('5',''):
              for page in (0,1):
                data=[('flag',str(flag)),('disclosureType',dtype),('page',str(page)),('companyCd','400062'),('isNewThree','0'),('startTime','2015-01-01'),('endTime','2020-06-30'),('keyword','')]
                for x in need:data.append(('needFields',x))
                r=s.post(EP,params={'callback':cb,'_':'1770000000000'},data=data,headers={'User-Agent':UA,'Referer':PAGE,'Origin':BASE,'X-Requested-With':'XMLHttpRequest'},timeout=30)
                raw=r.text.strip(); print('\nQUERY',flag,dtype,page,r.status_code,len(raw),repr(raw[:400]))
                t=raw.rstrip(';')
                if t.startswith(cb+'(') and t.endswith(')'): t=t[len(cb)+1:-1]
                elif t.startswith('null(') and t.endswith(')'): t=t[5:-1]
                try: obj=json.loads(t)
                except Exception as e: print('PARSE_ERR',repr(e)); continue
                print('FULL',json.dumps(obj,ensure_ascii=False)[:30000])
          PY
