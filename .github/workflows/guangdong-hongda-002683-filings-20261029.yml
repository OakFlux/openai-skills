name: Build Guangdong Hongda 002683 filings package 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guangdong-hongda-002683-filings-20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import math
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '002683'
          SHORT_NAMES = ('广东宏大', '宏大爆破')
          FULL_NAMES = (
              '广东宏大控股集团股份有限公司',
              '广东宏大控股股份有限公司',
              '广东宏大爆破股份有限公司',
          )
          PACKAGE = '广东宏大_002683_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          common_headers = {
              'User-Agent': ua,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }

          def clean_title(value: str) -> str:
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', '', value)
              return re.sub(r'\s+', '', value)

          def discover_org_id() -> str | None:
              urls = [
                  f'https://www.cninfo.com.cn/new/information/topSearch/query?keyWord={CODE}&maxNum=10',
                  f'https://www.cninfo.com.cn/new/information/topSearch/query?keyWord=%E5%B9%BF%E4%B8%9C%E5%AE%8F%E5%A4%A7&maxNum=10',
              ]
              for url in urls:
                  try:
                      r = session.get(
                          url,
                          headers={**common_headers, 'Referer': 'https://www.cninfo.com.cn/'},
                          timeout=(20, 60),
                      )
                      print('TOP_SEARCH', url, r.status_code, len(r.content), r.headers.get('content-type', ''))
                      if r.status_code != 200:
                          continue
                      obj = r.json()
                      rows = obj if isinstance(obj, list) else (obj.get('data') or obj.get('records') or [])
                      for row in rows:
                          row_code = str(row.get('code') or row.get('stockCode') or row.get('secCode') or '')
                          org_id = row.get('orgId') or row.get('orgid') or row.get('org_id')
                          if row_code == CODE and org_id:
                              print('ORG_ID', org_id, json.dumps(row, ensure_ascii=False))
                              return str(org_id)
                  except Exception as exc:
                      print('TOP_SEARCH_ERROR', url, repr(exc))
              return None

          def query_cninfo(org_id: str, start: str, end: str) -> list[dict]:
              endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              headers = {
                  **common_headers,
                  'Referer': f'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search&code={CODE}',
                  'X-Requested-With': 'XMLHttpRequest',
                  'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              }
              try:
                  session.get('https://www.cninfo.com.cn/new/index', headers=common_headers, timeout=(20, 60))
              except Exception:
                  pass
              rows: list[dict] = []
              page = 1
              while True:
                  payload = {
                      'pageNum': str(page),
                      'pageSize': '100',
                      'column': 'szse',
                      'tabName': 'fulltext',
                      'plate': 'sz',
                      'stock': f'{CODE},{org_id}',
                      'searchkey': '',
                      'secid': '',
                      'category': '',
                      'trade': '',
                      'seDate': f'{start}~{end}',
                      'sortName': '',
                      'sortType': '',
                      'isHLtitle': 'true',
                  }
                  r = session.post(endpoint, headers=headers, data=payload, timeout=(30, 120))
                  print('CNINFO_QUERY', start, end, page, r.status_code, len(r.content), r.headers.get('content-type', ''))
                  r.raise_for_status()
                  obj = r.json()
                  anns = obj.get('announcements') or []
                  rows.extend(anns)
                  total = int(obj.get('totalAnnouncement') or len(rows))
                  if not anns or len(rows) >= total or page >= max(1, math.ceil(total / 100)):
                      break
                  page += 1
              return rows

          def choose_annual(year: int, announcements: list[dict]) -> dict | None:
              phrase = f'{year}年年度报告'
              excluded = ('摘要', '审计报告', '社会责任报告', '董事会工作报告', '财务决算报告', '更正公告', '取消')
              candidates = []
              for a in announcements:
                  title = clean_title(a.get('announcementTitle', ''))
                  if phrase not in title or any(x in title for x in excluded):
                      continue
                  score = 0
                  if title.endswith(phrase):
                      score += 100
                  if title == phrase:
                      score += 50
                  if any(x in title for x in ('更新后', '修订版', '更正后')):
                      score += 200
                  candidates.append((score, int(a.get('announcementTime') or 0), a, title))
              if not candidates:
                  return None
              candidates.sort(key=lambda x: (x[0], x[1]), reverse=True)
              chosen = candidates[0][2]
              chosen['_clean_title'] = candidates[0][3]
              return chosen

          def choose_q3(announcements: list[dict]) -> dict | None:
              candidates = []
              for a in announcements:
                  title = clean_title(a.get('announcementTitle', ''))
                  if ('2026年三季度报告' in title or '2026年第三季度报告' in title) and '摘要' not in title:
                      candidates.append((int(a.get('announcementTime') or 0), a, title))
              if not candidates:
                  return None
              candidates.sort(key=lambda x: x[0], reverse=True)
              chosen = candidates[0][1]
              chosen['_clean_title'] = candidates[0][2]
              return chosen

          ranges = {
              2020: ('2021-03-24', '2021-03-28'),
              2021: ('2022-03-24', '2022-03-28'),
              2022: ('2023-03-23', '2023-03-27'),
              2023: ('2024-03-28', '2024-04-02'),
              2024: ('2025-03-26', '2025-03-30'),
              2025: ('2026-03-25', '2026-03-29'),
          }

          fallback_urls = {
              2020: [
                  'https://static.cninfo.com.cn/finalpage/2021-03-26/1209451778.PDF',
                  'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2021/2021-3/2021-03-26/6976670.PDF',
              ],
              2021: [
                  'https://static.cninfo.com.cn/finalpage/2022-03-26/1212684946.PDF',
              ],
              2022: [
                  'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-3/2023-03-25/8912107.PDF',
              ],
              2023: [
                  'https://static.cninfo.com.cn/finalpage/2024-03-30/1219461708.PDF',
              ],
              2024: [
                  'https://static.cninfo.com.cn/finalpage/2025-03-28/1222924519.PDF',
              ],
              2025: [
                  'https://static.cninfo.com.cn/finalpage/2026-03-27/1225034262.PDF',
              ],
              2026: [
                  'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2026/2026-10/2026-10-27/12661265.PDF',
              ],
          }

          org_id = discover_org_id()
          items = []
          selected_announcements = []
          for year, (start, end) in ranges.items():
              urls = []
              chosen = None
              if org_id:
                  try:
                      chosen = choose_annual(year, query_cninfo(org_id, start, end))
                  except Exception as exc:
                      print('ANNUAL_QUERY_ERROR', year, repr(exc))
              if chosen:
                  adjunct = (chosen.get('adjunctUrl') or '').lstrip('/')
                  if adjunct:
                      urls.append('https://static.cninfo.com.cn/' + adjunct)
                  selected_announcements.append(chosen)
              urls.extend(x for x in fallback_urls[year] if x not in urls)
              items.append({
                  'label': f'{year}年年度报告',
                  'kind': 'annual',
                  'year': year,
                  'urls': urls,
                  'announcement_title': chosen.get('_clean_title') if chosen else None,
                  'announcement_id': chosen.get('announcementId') if chosen else None,
                  'announcement_time': chosen.get('announcementTime') if chosen else None,
              })

          q3_urls = []
          q3 = None
          if org_id:
              try:
                  q3 = choose_q3(query_cninfo(org_id, '2026-10-25', '2026-10-29'))
              except Exception as exc:
                  print('Q3_QUERY_ERROR', repr(exc))
          if q3:
              adjunct = (q3.get('adjunctUrl') or '').lstrip('/')
              if adjunct:
                  q3_urls.append('https://static.cninfo.com.cn/' + adjunct)
              selected_announcements.append(q3)
          q3_urls.extend(x for x in fallback_urls[2026] if x not in q3_urls)
          items.append({
              'label': '2026年第三季度报告',
              'kind': 'quarter',
              'year': 2026,
              'urls': q3_urls,
              'announcement_title': q3.get('_clean_title') if q3 else None,
              'announcement_id': q3.get('announcementId') if q3 else None,
              'announcement_time': q3.get('announcementTime') if q3 else None,
          })

          (ROOT / 'selected_announcements.json').write_text(
              json.dumps(selected_announcements, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          manifest = []
          for index, item in enumerate(items, 1):
              data = None
              source = ''
              attempts = []
              for url in item['urls']:
                  for attempt in range(4):
                      try:
                          if 'sina.com.cn' in url:
                              referer = 'https://vip.stock.finance.sina.com.cn/'
                          else:
                              referer = 'https://www.cninfo.com.cn/'
                          r = session.get(
                              url,
                              headers={
                                  **common_headers,
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url,
                              'attempt': attempt + 1,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50000:
                              data = r.content
                              source = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f'Download failed {item["label"]}: {attempts}')

              filename = f'{index:02d}_广东宏大_{item["label"]}.pdf'
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              minimum_pages = 100 if item['kind'] == 'annual' else 5
              if pages < minimum_pages:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(40, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              identity_terms = (*SHORT_NAMES, *FULL_NAMES, CODE)
              identity_hits = [x for x in identity_terms if re.sub(r'\s+', '', x) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{k: v for k, v in item.items() if k != 'urls'},
                  'candidate_urls': item['urls'],
                  'source_url': source,
                  'filename': str(Path('原始PDF') / filename),
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              })
              print('VERIFIED', item['label'], pages, len(data), sha, source)

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '广东宏大控股集团股份有限公司（002683.SZ）年度报告及最新季度报告资料包',
              '整理日期：2026-10-29',
              '',
              '收录范围：2020—2025年年度报告全文，以及截至整理日最新披露的2026年第三季度报告。',
              '2020年年度报告披露时公司证券简称为“宏大爆破”。',
              '不收录年度报告摘要、审计报告附件、社会责任报告或董事会工作报告。',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["label"]}',
                  f'   页数：{x["pages"]}页；文件：{x["filename"]}',
                  f'   来源：{x["source_url"]}',
                  f'   SHA-256：{x["sha256"]}',
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('guangdong_hongda_002683_2020_2025_annual_reports_latest_quarter.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: guangdong-hongda-002683-filings-final
          path: |
            广东宏大_002683_2020-2025年报及最新季报.zip
            guangdong_hongda_002683_2020_2025_annual_reports_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
