name: Collect All Yuheng Research Calendar Records

on:
  push:
    branches:
      - tmp-yuheng-002437-broker-reports-20261004

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - name: Collect all report event records
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          from pathlib import Path
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/stockcalendar/002437.html'})
          base='https://datacenter-web.eastmoney.com/api/data/v1/get'
          all_rows=[]
          for page in range(1,10):
            p={'reportName':'RPT_STOCKCALENDAR','columns':'ALL','filter':'(SECURITY_CODE="002437")','pageSize':'500','pageNumber':str(page),'source':'WEB','client':'WEB'}
            r=s.get(base,params=p,timeout=40); r.raise_for_status(); j=r.json()
            result=j.get('result') or {}; rows=result.get('data') or []
            print('PAGE',page,'SUCCESS',j.get('success'),'ROWS',len(rows),'PAGES',result.get('pages'),'COUNT',result.get('count'))
            if not rows: break
            all_rows.extend(rows)
            if page >= int(result.get('pages') or page): break
          reports=[r for r in all_rows if str(r.get('EVENT_TYPE_CODE'))=='020' or str(r.get('EVENT_TYPE'))=='研报']
          out=Path('calendar_all'); out.mkdir(exist_ok=True)
          (out/'all_rows.json').write_text(json.dumps(all_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'research_events.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL_ROWS',len(all_rows),'RESEARCH_EVENTS',len(reports))
          for x in reports:
            print(json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Yuheng-All-Research-Calendar-Records
          path: calendar_all/*.json
          retention-days: 3
