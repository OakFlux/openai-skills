name: Discover Pandairy 300898 filing URLs

on:
  push:
    paths:
      - '.github/workflows/pandairy-300898-discover-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Query CNINFO
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          code='300898'; org='gfbj0832559'; company='熊猫乳品'
          s=requests.Session()
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,backoff_factor=.5,status_forcelist=(403,429,500,502,503,504),allowed_methods=frozenset({'POST'}),raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':f'https://www.cninfo.com.cn/new/disclosure/stock?orgId={org}&stockCode={code}','Origin':'https://www.cninfo.com.cn','X-Requested-With':'XMLHttpRequest'})
          endpoint='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          searches=[
            ('招股说明书','2020-08-01','2020-10-31'),
            ('2020年年度报告','2021-03-01','2021-05-31'),
            ('2021年年度报告','2022-03-01','2022-05-31'),
            ('2022年年度报告','2023-03-01','2023-05-31'),
            ('2023年年度报告','2024-03-01','2024-05-31'),
            ('2024年年度报告','2025-03-01','2025-05-31'),
            ('2025年年度报告','2026-03-01','2026-05-31'),
            ('2026年三季度报告','2026-10-27','2026-10-28'),
            ('2026年第三季度报告','2026-10-27','2026-10-28'),
          ]
          for key,start,end in searches:
            print('\n===',key,start,end,'===',flush=True)
            seen=set()
            for column,plate,stock in [('szse','sz',f'{code},{org}'),('szse','sz',''),('sse','sz',f'{code},{org}')]:
              for page in range(1,8):
                payload={'pageNum':str(page),'pageSize':'100','column':column,'tabName':'fulltext','plate':plate,'stock':stock,'searchkey':key,'secid':'','category':'','trade':'','seDate':f'{start}~{end}','sortName':'time','sortType':'desc','isHLtitle':'true'}
                r=s.post(endpoint,data=payload,timeout=60)
                print('QUERY',column,plate,repr(stock),page,r.status_code,len(r.content),flush=True)
                if r.status_code!=200: continue
                try: data=r.json()
                except Exception: continue
                rows=data.get('announcements') or []
                for row in rows:
                  title=re.sub(r'<[^>]+>','',str(row.get('announcementTitle') or '')).replace('&amp;','&').strip()
                  code_blob=str(row.get('secCode') or row.get('stockCode') or '')
                  name=re.sub(r'<[^>]+>','',str(row.get('secName') or row.get('stockName') or '')).strip()
                  if code not in code_blob and company not in name: continue
                  ident=str(row.get('announcementId') or row.get('adjunctUrl') or title)
                  if ident in seen: continue
                  seen.add(ident)
                  print('MATCH',json.dumps({'title':title,'code':code_blob,'name':name,'adjunctUrl':row.get('adjunctUrl'),'announcementId':row.get('announcementId'),'announcementTime':row.get('announcementTime')},ensure_ascii=False),flush=True)
                if not rows: break
                total=int(data.get('totalAnnouncement') or data.get('totalRecordNum') or 0)
                if total and page*len(rows)>=total: break
                time.sleep(.05)
          PY
