name: Probe Kerry report images
on:
  push:
    branches: [chatgpt-kerry-report-images-20260906]
    paths: ['.github/workflows/probe-kerry-report-images.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/probe_kerry_report_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: kerry-image-probe
          path: |
            kerry-image-probe.json
            kerry-image-probe/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
