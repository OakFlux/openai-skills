name: Build verified Huabao-related broker deep report package

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-public-related-deep-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pillow pypdf pymupdf
      - name: Download complete public reports and build package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          import pymupdf
          from PIL import Image
          from pypdf import PdfReader

          package = 'Huabao_International_Related_Broker_Deep_Reports_2_Full_PDFs'
          root = Path(package)
          root.mkdir(exist_ok=True)
          work = Path('_huabao_related_work')
          work.mkdir(exist_ok=True)
          render_dir = work / 'renders'
          render_dir.mkdir(exist_ok=True)

          candidates = [
              {
                  'broker': 'Cinda Securities',
                  'broker_cn': '信达证券',
                  'date': '2026-08-17',
                  'title_cn': '轻工制造行业新型烟草：卷烟区域结构分化，新型烟草大势所趋，HNB产业链蓄势待发',
                  'pages': 46,
                  'base': 'https://oss.sdyanbao.com/page/2026/8/17/AP202608171828035449',
                  'filename': '01_Cinda_Securities_New_Tobacco_HNB_Industry_Deep_20260817.pdf',
                  'source_page': 'https://stock.stockstar.com/JC2026081700001565.shtml',
                  'relation': '报告投资建议明确将华宝国际列为HNB香精及烟草薄片产业链重点关注标的。',
              },
              {
                  'broker': 'Soochow Securities',
                  'broker_cn': '东吴证券',
                  'date': '2026-08-19',
                  'title_cn': '烟草行业专题报告（二）：新型烟草重塑巨头增长，中国迎来HNB产业机会',
                  'pages': 22,
                  'base': 'https://oss.sdyanbao.com/page/2026/8/19/AP202608191828156932',
                  'filename': '02_Soochow_Securities_Tobacco_HNB_Industry_Deep_20260819.pdf',
                  'source_page': 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/840475031888/index.phtml',
                  'relation': '报告投资建议明确将华宝国际列为烟草薄片和香精供应商重点关注标的。',
              },
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
          })

          def download_page(report: dict, index: int, dest: Path) -> dict:
              errors = []
              urls = [f"{report['base']}/{index}.png", f"{report['base']}/{index}.jpg", f"{report['base']}/{index}.jpeg"]
              for url in urls:
                  for attempt in range(1, 5):
                      try:
                          r = s.get(url, headers={'Referer':'https://www.sdyanbao.com/'}, timeout=(15, 120), allow_redirects=True)
                          sig = r.content[:16]
                          ok = sig.startswith(b'\x89PNG') or sig.startswith(b'\xff\xd8\xff') or sig.startswith(b'RIFF')
                          print('PAGE', report['broker_cn'], index + 1, attempt, r.status_code, len(r.content), url, flush=True)
                          if r.status_code == 200 and ok and len(r.content) > 12000:
                              dest.write_bytes(r.content)
                              with Image.open(dest) as im:
                                  im.verify()
                              with Image.open(dest) as im:
                                  width, height = im.size
                              if width < 600 or height < 800:
                                  raise RuntimeError(f'small image {width}x{height}')
                              return {
                                  'page': index + 1,
                                  'url': url,
                                  'bytes': len(r.content),
                                  'width': width,
                                  'height': height,
                                  'sha256': hashlib.sha256(r.content).hexdigest(),
                              }
                          errors.append(f'{url}: HTTP {r.status_code}/{len(r.content)}')
                      except Exception as exc:
                          errors.append(f'{url}: {exc!r}')
                      time.sleep(min(attempt, 3))
              raise RuntimeError(f"page download failed: {report['broker_cn']} p.{index+1}: {errors[-8:]}")

          records = []
          total_hashes = set()
          for report in candidates:
              image_dir = work / report['broker']
              image_dir.mkdir(exist_ok=True)
              images = []
              page_manifest = []
              seen = set()
              for index in range(report['pages']):
                  image_path = image_dir / f'{index:03d}.img'
                  meta = download_page(report, index, image_path)
                  if meta['sha256'] in seen:
                      raise RuntimeError(f"duplicate page image in {report['broker_cn']}: page {index+1}")
                  seen.add(meta['sha256'])
                  images.append(image_path)
                  page_manifest.append(meta)

              pdf_path = work / report['filename']
              doc = pymupdf.open()
              for image_path in images:
                  with Image.open(image_path) as im:
                      width, height = im.size
                  page = doc.new_page(width=width, height=height)
                  page.insert_image(page.rect, filename=str(image_path), keep_proportion=False)
              doc.set_metadata({
                  'title': report['title_cn'],
                  'author': report['broker_cn'],
                  'subject': '包含华宝国际（00336.HK）产业链分析的券商行业深度报告',
                  'keywords': '华宝国际,00336,HNB,新型烟草,烟草薄片,香精',
              })
              doc.save(str(pdf_path), garbage=4, deflate=True, clean=True)
              doc.close()

              data = pdf_path.read_bytes()
              if data[:5] != b'%PDF-':
                  raise RuntimeError(f'bad PDF header: {report["filename"]}')
              reader = PdfReader(str(pdf_path), strict=False)
              if reader.is_encrypted:
                  raise RuntimeError(f'encrypted output: {report["filename"]}')
              actual_pages = len(reader.pages)
              if actual_pages != report['pages']:
                  raise RuntimeError(f'page mismatch: {report["filename"]}: {actual_pages} != {report["pages"]}')
              q = subprocess.run(['qpdf','--check',str(pdf_path)],capture_output=True,text=True)
              if q.returncode not in (0,3):
                  raise RuntimeError(f'qpdf check failed: {q.stderr[-1500:]}')

              render_doc = pymupdf.open(str(pdf_path))
              rendered_pages = []
              for pno in sorted(set([0, actual_pages // 2, actual_pages - 1])):
                  pix = render_doc.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(1,1), alpha=False)
                  rp = render_dir / f"{report['broker']}_{pno+1:03d}.png"
                  pix.save(str(rp))
                  if rp.stat().st_size < 6000 or pix.width < 500 or pix.height < 700:
                      raise RuntimeError(f'render validation failed: {report["filename"]} page {pno+1}')
                  rendered_pages.append(pno + 1)
              render_doc.close()

              digest = hashlib.sha256(data).hexdigest()
              if digest in total_hashes:
                  raise RuntimeError('duplicate report PDFs')
              total_hashes.add(digest)
              final_pdf = root / report['filename']
              final_pdf.write_bytes(data)
              record = {
                  **report,
                  'actual_pages': actual_pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'rendered_pages': rendered_pages,
                  'source_type': '公开逐页原版图像按原页序合成PDF（未裁切、未重排）',
              }
              records.append(record)
              (work / f"page_manifest_{report['broker']}.json").write_text(json.dumps(page_manifest, ensure_ascii=False, indent=2), encoding='utf-8')
              print('VERIFIED', json.dumps(record, ensure_ascii=False), flush=True)

          readme_lines = [
              '华宝国际（00336.HK）相关券商深度报告资料包',
              '',
              '本包包含2份可离线打开的完整券商行业深度报告，共68页。两份报告均在投资建议中明确分析或列示华宝国际，重点覆盖HNB、新型烟草、烟草薄片和香精供应链。',
              '',
              '重要说明：公开渠道可检索到的2026年华宝国际纯公司深度报告原始全文均要求登录或会员权限，匿名端仅开放少量预览页。为避免把预览页冒充全文，本包没有收录残缺公司报告；改收录公开可完整取得、且明确覆盖华宝国际的券商行业深度报告。',
              '',
          ]
          for i, r in enumerate(records, 1):
              readme_lines += [
                  f"{i}. {r['broker_cn']}｜{r['date']}｜《{r['title_cn']}》",
                  f"   完整页数：{r['actual_pages']}页；文件大小：{r['bytes']/1048576:.2f} MB",
                  f"   与华宝国际的关联：{r['relation']}",
                  f"   公开来源说明页：{r['source_page']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme_lines += [
              '核验项目：逐页图像签名、图像尺寸、页面连续性、页面去重、PDF文件头、实际页数、qpdf结构、首页/中间页/末页渲染及ZIP CRC。',
              '文件由公开逐页原版图像按原顺序合成，正文内容未裁切或改写；由于是图像型PDF，文本搜索能力弱于券商原生矢量PDF。',
              '报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
          ]
          (root / 'README_重要说明.txt').write_text('\n'.join(readme_lines), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(package + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=7, allowZip64=True) as zf:
              for path in sorted(root.iterdir()):
                  zf.write(path, arcname=f'{package}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failed: {bad}')
              pdfs = [name for name in zf.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 2:
                  raise RuntimeError(f'PDF count mismatch: {pdfs}')

          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, flush=True)
          print('ZIP_SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Huabao_International_Related_Broker_Deep_Reports_2_Full_PDFs
          path: Huabao_International_Related_Broker_Deep_Reports_2_Full_PDFs.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huabao-related-build-diagnostics
          path: _huabao_related_work/
          retention-days: 3
          compression-level: 6
          if-no-files-found: ignore
