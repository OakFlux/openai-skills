name: Probe Deep Sanda prospectus sources
on:
  push:
    paths: ['.github/workflows/shensangda-000032-prospectus-probe-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python - <<'PY'
          import requests, re, json
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/notices/stock/000032.html'})
          art='AN201202240003353422'
          urls=[
            f'https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code={art}&client_source=web&page_index=1',
            f'https://data.eastmoney.com/notices/detail/000032/{art}.html',
          ]
          for u in urls:
            try:
              r=s.get(u,timeout=90); print('\nURL',u,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'BYTES',len(r.content))
              print(r.text[:10000])
            except Exception as e: print('ERR',u,repr(e))
          s.headers.update({'Referer':'https://www.cninfo.com.cn/new/commonUrl?url=disclosure/list/notice','X-Requested-With':'XMLHttpRequest'})
          u='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          for key in ['招股说明书','深圳桑达实业股份有限公司招股说明书','桑达 招股']:
            data={'pageNum':'1','pageSize':'30','column':'szse','tabName':'fulltext','plate':'sz','stock':'000032,gssz0000032','searchkey':key,'secid':'','category':'','trade':'','seDate':'1990-01-01~1995-12-31','sortName':'','sortType':'','isHLtitle':'true'}
            r=s.post(u,data=data,timeout=90); print('\nCNINFO',key,r.status_code,len(r.content)); print(r.text[:10000])
          PY
