name: Build Agile Group 03383 broker research PDF package 20260927

on:
  push:
    paths:
      - '.github/workflows/agile-group-03383-broker-reports-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download original broker PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE_DIR = Path('雅居乐集团_03383.HK_券商研究报告_原始PDF_3份')
          FINAL_ZIP = Path('雅居乐集团_03383.HK_券商研究报告_原始PDF_3份.zip')
          WORK = Path('_agile_work')
          PACKAGE_DIR.mkdir(exist_ok=True)
          WORK.mkdir(exist_ok=True)

          candidates = [
              {
                  'rank': 1,
                  'filename': '01_RHB_雅居乐集团_Non-Property_Businesses_Shine_2019-08-22.pdf',
                  'broker': 'RHB Research',
                  'title': 'Non-Property Businesses Shine; Keep BUY',
                  'date': '2019-08-22',
                  'min_pages': 8,
                  'urls': [
                      'https://research.rhbtradesmart.com/attachments/83/rhb-report-hk_agile-group-holdings_results-review_20190822_rhb-502721710545662905d5de92248dc3.pdf',
                      'http://research.rhbtradesmart.com/attachments/83/rhb-report-hk_agile-group-holdings_results-review_20190822_rhb-502721710545662905d5de92248dc3.pdf',
                  ],
              },
              {
                  'rank': 2,
                  'filename': '02_招银国际_雅居乐集团_Good_Incubator_2020-03-10.pdf',
                  'broker': '招银国际证券（CMBIS）',
                  'title': 'Good incubator',
                  'date': '2020-03-10',
                  'min_pages': 5,
                  'urls': [
                      'https://www.cmbi.com/upload/202003/20200310749716.pdf',
                      'https://hk-official.cmbi.info/upload/202003/20200310749716.pdf',
                      'http://www.cmbi.com/upload/202003/20200310749716.pdf',
                  ],
              },
              {
                  'rank': 3,
                  'filename': '03_招银国际_雅居乐集团_More_Spin-offs_Reflect_True_Value_2020-08-24.pdf',
                  'broker': '招银国际证券（CMBIS）',
                  'title': 'More spin-offs reflect true value',
                  'date': '2020-08-24',
                  'min_pages': 6,
                  'urls': [
                      'https://www.cmbi.com/upload/202008/20200824324068.pdf',
                      'https://hk-official.cmbi.info/upload/202008/20200824324068.pdf',
                      'http://www.cmbi.com/upload/202008/20200824324068.pdf',
                  ],
              },
              {
                  'rank': 4,
                  'filename': '04_招银国际_雅居乐集团_Disappointed_the_Market_2020-03-24.pdf',
                  'broker': '招银国际证券（CMBIS）',
                  'title': 'Disappointed the market',
                  'date': '2020-03-24',
                  'min_pages': 5,
                  'urls': [
                      'https://www.cmbi.com/upload/202003/20200324594051.pdf',
                      'https://hk-official.cmbi.info/upload/202003/20200324594051.pdf',
                      'http://www.cmbi.com/upload/202003/20200324594051.pdf',
                  ],
              },
              {
                  'rank': 5,
                  'filename': '05_券商研究_雅居乐集团_Priority_to_Margin_2019.pdf',
                  'broker': '公开券商研究原始PDF',
                  'title': 'Priority to Margin but Slowing Growth Rate',
                  'date': '2019-05',
                  'min_pages': 4,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP201905051326636961_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP201905051326636961_1.pdf?1557071283000.pdf=',
                  ],
              },
          ]

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0 Safari/537.36'
          HEADERS = {
              'User-Agent': UA,
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Cache-Control': 'no-cache',
          }

          def pdf_identity(path: Path, min_pages: int) -> tuple[int, str]:
              data = path.read_bytes()
              if len(data) < 30_000:
                  raise RuntimeError(f'file too small: {len(data)} bytes')
              if not data.startswith(b'%PDF-'):
                  raise RuntimeError(f'not a PDF header: {data[:40]!r}')
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < min_pages:
                  raise RuntimeError(f'page count {pages} below required {min_pages}')
              text_parts = []
              for page in reader.pages[:min(pages, 12)]:
                  try:
                      text_parts.append(page.extract_text() or '')
                  except Exception:
                      pass
              text = '\n'.join(text_parts)
              normalized = text.lower().replace(' ', '')
              identity_ok = (
                  'agilegroup' in normalized or
                  '雅居乐' in text or
                  '雅居樂' in text or
                  '3383hk' in normalized or
                  '03383hk' in normalized
              )
              if not identity_ok:
                  raise RuntimeError('Agile Group identity terms not found in extracted text')
              return pages, text[:1000]

          def qpdf_check(path: Path) -> None:
              proc = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if proc.returncode not in (0, 3):
                  raise RuntimeError('qpdf check failed: ' + proc.stderr[-1000:])

          def requests_download(url: str, dest: Path, referer: str) -> None:
              headers = dict(HEADERS)
              headers['Referer'] = referer
              with requests.get(url, headers=headers, stream=True, timeout=(30, 180), allow_redirects=True) as response:
                  response.raise_for_status()
                  with dest.open('wb') as f:
                      for chunk in response.iter_content(chunk_size=1024 * 256):
                          if chunk:
                              f.write(chunk)

          def curl_download(url: str, dest: Path, referer: str) -> None:
              subprocess.run([
                  'curl', '--fail', '--location', '--retry', '4', '--retry-all-errors',
                  '--connect-timeout', '30', '--max-time', '240', '--compressed',
                  '--user-agent', UA, '--referer', referer,
                  '--header', 'Accept: application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                  '--output', str(dest), url,
              ], check=True, capture_output=True, text=True)

          def wget_download(url: str, dest: Path, referer: str) -> None:
              subprocess.run([
                  'wget', '--quiet', '--timeout=60', '--tries=3', '--max-redirect=20',
                  '--user-agent=' + UA, '--referer=' + referer,
                  '--output-document=' + str(dest), url,
              ], check=True, capture_output=True, text=True)

          methods = [('requests', requests_download), ('curl', curl_download), ('wget', wget_download)]
          records = []
          errors = []

          for report in candidates:
              if len(records) >= 3:
                  break
              success = False
              for url in report['urls']:
                  referer = url.split('/upload/')[0] + '/' if '/upload/' in url else '/'.join(url.split('/')[:3]) + '/'
                  for method_name, method in methods:
                      temp = WORK / (report['filename'] + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          print(f"TRY {method_name}: {url}", flush=True)
                          method(url, temp, referer)
                          pages, _ = pdf_identity(temp, report['min_pages'])
                          qpdf_check(temp)
                          target = PACKAGE_DIR / report['filename']
                          shutil.move(str(temp), str(target))
                          data = target.read_bytes()
                          rec = {
                              'filename': report['filename'],
                              'broker': report['broker'],
                              'title': report['title'],
                              'date': report['date'],
                              'source_url': url,
                              'download_method': method_name,
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': hashlib.sha256(data).hexdigest(),
                          }
                          records.append(rec)
                          print('VALIDATED ' + json.dumps(rec, ensure_ascii=False), flush=True)
                          success = True
                          break
                      except Exception as exc:
                          temp.unlink(missing_ok=True)
                          msg = f"{report['filename']} | {method_name} | {url} | {type(exc).__name__}: {exc}"
                          errors.append(msg)
                          print('FAILED ' + msg, flush=True)
                  if success:
                      break
              if not success:
                  print('SKIP candidate after all methods failed: ' + report['filename'], flush=True)

          if len(records) != 3:
              raise RuntimeError('Only %d valid reports downloaded; errors:\n%s' % (len(records), '\n'.join(errors[-30:])))

          readme = [
              '雅居乐集团（03383.HK）券商研究报告原始PDF资料包',
              '整理日期：2026-09-27',
              '',
              '说明：',
              '1. 本包内含3份从公开原始地址直接下载的券商研究PDF，不是网页摘要、下载器或跳转链接。',
              '2. 每份文件均完成PDF文件头、公司身份、页数与qpdf结构校验。',
              '3. 报告年份以公开可稳定下载且内容完整者为准。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['broker']}：《{rec['title']}》",
                  f"   日期：{rec['date']}；页数：{rec['pages']}；大小：{rec['bytes'] / 1048576:.2f} MB",
                  f"   文件：{rec['filename']}",
                  f"   原始来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          (PACKAGE_DIR / '00_文件清单与校验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (PACKAGE_DIR / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (PACKAGE_DIR / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{r['sha256']}  {r['filename']}" for r in records) + '\n', encoding='utf-8'
          )

          with zipfile.ZipFile(FINAL_ZIP, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(PACKAGE_DIR.rglob('*')):
                  if path.is_file():
                      zf.write(path, arcname=str(PACKAGE_DIR / path.relative_to(PACKAGE_DIR)))

          with zipfile.ZipFile(FINAL_ZIP, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise RuntimeError(f'ZIP CRC failed for {bad}')
              pdf_entries = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
              if len(pdf_entries) != 3:
                  raise RuntimeError(f'ZIP contains {len(pdf_entries)} PDFs instead of 3')

          zip_data = FINAL_ZIP.read_bytes()
          print(json.dumps({
              'final_zip': str(FINAL_ZIP),
              'bytes': len(zip_data),
              'sha256': hashlib.sha256(zip_data).hexdigest(),
              'reports': records,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: agile-group-03383-broker-reports-original-pdf-3pack-20260927
          path: 雅居乐集团_03383.HK_券商研究报告_原始PDF_3份.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
