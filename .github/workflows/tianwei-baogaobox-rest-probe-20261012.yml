name: Probe Tianwei Electronics report metadata 20261012

on:
  push:
    paths:
      - '.github/workflows/tianwei-baogaobox-rest-probe-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, requests, re
          from pathlib import Path
          from urllib.parse import quote
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://www.baogaobox.com/wp-json/wp/v2/posts/20971',
            'https://www.baogaobox.com/wp-json/wp/v2/media?search=20971&per_page=100',
            'https://www.baogaobox.com/wp-json/wp/v2/search?search='+quote('天微电子')+'&per_page=100',
            'https://www.baogaobox.com/e/member/login/loginjs_report.php?id=20971',
            'https://www.baogaobox.com/wp-json/',
          ]
          out={}
          for i,u in enumerate(urls):
            try:
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              content_type=r.headers.get('content-type','')
              text=r.text
              Path(f'out/response_{i}.txt').write_text(text,encoding='utf-8',errors='replace')
              out[u]={'status':r.status_code,'final_url':r.url,'content_type':content_type,'bytes':len(r.content),'headers':dict(r.headers),'text_preview':text[:5000]}
              print('\nURL',u,'STATUS',r.status_code,'TYPE',content_type,'BYTES',len(r.content),'FINAL',r.url)
              print(text[:20000])
              print('PDFISH')
              for x in sorted(set(re.findall(r'https?://[^\s"\'<>]+',text))):
                if any(k in x.lower() for k in ['pdf','file','download','20971','240622']): print(x)
            except Exception as e:
              out[u]={'error':repr(e)}; print('ERROR',u,repr(e))
          Path('out/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianwei-baogaobox-rest-probe
          path: out
          retention-days: 7
          if-no-files-found: error
