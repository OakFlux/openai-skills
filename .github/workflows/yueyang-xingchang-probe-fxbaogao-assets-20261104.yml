name: Probe Yueyang Xingchang Fxbaogao assets 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-probe-fxbaogao-assets-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe report assets and frontend scripts
        shell: bash
        run: |
          python -m pip install --quiet requests pillow beautifulsoup4
          python - <<'PY'
          import io, json, re, requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from urllib.parse import urljoin

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          detail = 'https://www.fxbaogao.com/detail/3433347'
          r = s.get(detail, timeout=(30,180))
          print('DETAIL', r.status_code, len(r.content), r.url)
          text = r.text
          for needle in ['3433347', 'report-image', '__NEXT_DATA__', 'downloadUrl', 'pdfUrl', 'fileUrl', 'filePath', 'sourceUrl', 'docId', 'encodeUrl', 'api/', '/api', 'dr.fxbaogao']:
              print('\nNEEDLE', needle)
              pos = 0
              count = 0
              while True:
                  idx = text.find(needle, pos)
                  if idx < 0 or count >= 20:
                      break
                  print(text[max(0,idx-500):min(len(text),idx+1000)].replace('\n',' ')[:1600])
                  pos = idx + len(needle)
                  count += 1
              print('COUNT_SHOWN', count)

          soup = BeautifulSoup(text, 'html.parser')
          scripts = []
          for tag in soup.find_all('script', src=True):
              scripts.append(urljoin(detail, tag.get('src')))
          print('\nSCRIPTS', json.dumps(scripts, ensure_ascii=False, indent=2))
          for script in scripts:
              try:
                  js = s.get(script, timeout=(30,180))
                  print('\nSCRIPT', script, js.status_code, len(js.content), js.headers.get('content-type'))
                  if js.status_code != 200:
                      continue
                  body = js.text
                  hits = []
                  for pattern in [r'https?://[^\"\'<>\s]+', r'[/A-Za-z0-9_-]*(?:download|report|document|file|pdf)[/A-Za-z0-9_?&=.-]*']:
                      hits.extend(re.findall(pattern, body, re.I))
                  unique = []
                  for hit in hits:
                      if hit not in unique and any(tok in hit.lower() for tok in ('download','report','document','file','pdf','fxbaogao','api')):
                          unique.append(hit)
                  print('HITS', json.dumps(unique[:300], ensure_ascii=False))
                  for needle in ['download', 'docId', 'report-image', 'pdf', 'api.fxbaogao', '/api/', 'dr.fxbaogao']:
                      idx = body.find(needle)
                      if idx >= 0:
                          print('CONTEXT', needle, body[max(0,idx-1000):idx+2000])
              except Exception as e:
                  print('SCRIPT_ERR', script, repr(e))

          print('\nIMAGE_PROBE')
          base = 'https://public.fxbaogao.com/report-image/2022/11/01/3433347-{}.png'
          for i in range(1, 31):
              url = base.format(i)
              try:
                  rr = s.get(url, timeout=(30,180))
                  info = {'page':i,'status':rr.status_code,'bytes':len(rr.content),'type':rr.headers.get('content-type'),'url':url}
                  if rr.status_code == 200 and rr.content:
                      try:
                          im = Image.open(io.BytesIO(rr.content))
                          info.update({'format':im.format,'size':im.size,'mode':im.mode})
                      except Exception as e:
                          info['image_error']=repr(e)
                  print('IMAGE', json.dumps(info, ensure_ascii=False))
              except Exception as e:
                  print('IMAGE_ERR', i, repr(e))

          guesses = [
              'https://public.fxbaogao.com/report/2022/11/01/3433347.pdf',
              'https://public.fxbaogao.com/report-pdf/2022/11/01/3433347.pdf',
              'https://public.fxbaogao.com/report-file/2022/11/01/3433347.pdf',
              'https://public.fxbaogao.com/report-document/2022/11/01/3433347.pdf',
              'https://dr.fxbaogao.com/2022/11/01/3433347.pdf',
              'https://dr.fxbaogao.com/pdf/3433347.pdf',
              'https://dr.fxbaogao.com/report/2022/11/01/3433347.pdf',
              'https://dr.fxbaogao.com/report/3433347.pdf',
              'https://public.fxbaogao.com/3433347.pdf',
              'https://www.fxbaogao.com/download?id=3433347',
              'https://www.fxbaogao.com/api/download?id=3433347',
          ]
          print('\nPDF_GUESSES')
          for url in guesses:
              try:
                  rr=s.get(url,timeout=(30,180),allow_redirects=True)
                  print('GUESS', json.dumps({'url':url,'status':rr.status_code,'bytes':len(rr.content),'type':rr.headers.get('content-type'),'final':rr.url,'head':rr.content[:16].hex()},ensure_ascii=False))
              except Exception as e:
                  print('GUESS_ERR', url, repr(e))
          PY
