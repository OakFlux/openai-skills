name: Package verified Electric Chip broker reports

on:
  push:
    branches:
      - tmp/electric-chip-600877-broker-reports-20261104-v1
    paths:
      - .github/workflows/electric-chip-600877-broker-reports-20261104-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, verify and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = "电科芯片"
          CODE = "600877"
          ROOT_NAME = "电科芯片_600877_券商研究报告_2份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "sequence": 1,
                  "date": "2022-06-24",
                  "broker": "海通国际",
                  "analyst": "Xiaofei Zhang、Yang Zhou",
                  "rating": "优于大市（首次覆盖）",
                  "report_type": "首次覆盖/公司深度研究",
                  "title": "首次覆盖：业务战略转型发挥综效；北斗短报文应用爆发在即",
                  "infoCode": "AP202206241574390411",
                  "expected_pages": 18,
              },
              {
                  "sequence": 2,
                  "date": "2024-11-05",
                  "broker": "中航证券",
                  "analyst": "宋浩田、张超、梁晨",
                  "rating": "买入",
                  "report_type": "公司三季报点评",
                  "title": "2024年三季报点评：降价销售业绩短期承压，持续布局新兴产业",
                  "infoCode": "AP202411051640729008",
                  "expected_pages": 7,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def safe_name(text: str, limit: int = 86) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text).strip(" ._")
              return text[:limit] or "report"

          def download_pdf(info_code: str) -> tuple[bytes, str]:
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf",
              ]
              errors = []
              for url in urls:
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 300),
                              allow_redirects=True,
                              headers={"Referer": "https://data.eastmoney.com/", "Accept": "application/pdf,*/*;q=0.8"},
                          )
                          print("DOWNLOAD", response.status_code, len(response.content), response.headers.get("content-type"), url)
                          if response.status_code == 200 and response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                              return response.content, url
                          errors.append(f"{url}: status={response.status_code}, bytes={len(response.content)}")
                      except Exception as exc:
                          errors.append(f"{url}: {exc!r}")
                      time.sleep(1 + attempt)
              raise RuntimeError("PDF download failed: " + " | ".join(errors[-6:]))

          manifest = []
          for spec in reports:
              data, source_url = download_pdf(spec["infoCode"])
              filename = (
                  f"{spec['sequence']:02d}_{spec['date']}_{safe_name(spec['broker'])}_"
                  f"{safe_name(spec['title'])}_{spec['infoCode']}.pdf"
              )
              path = PDF_DIR / filename
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != spec["expected_pages"]:
                  raise RuntimeError(f"Unexpected page count for {filename}: {pages} vs {spec['expected_pages']}")
              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf validation failed for {filename}: {check.stdout}")
              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")
              item = {
                  **spec,
                  "filename": filename,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": source_url,
                  "preview": str(Path("首页预览") / preview.name),
              }
              manifest.append(item)

          readme = [
              f"{COMPANY}（{CODE}.SH）券商研究报告资料包",
              "整理日期：2026-11-04",
              "",
              "本包包含2份可公开下载并核验的券商原始PDF。",
              "公开渠道中的公司级券商覆盖较少：其中1份为18页首次覆盖深度研究，另1份为7页较新的公司三季报点评。未使用网页摘要、二次排版文件或付费页面内容补数。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   券商：{item['broker']}；类型：{item['report_type']}；研究员：{item['analyst']}",
                  f"   日期：{item['date']}；评级：{item['rating']}",
                  f"   标题：{item['title']}",
                  f"   实际页数：{item['pages']}；原始来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、报告页数、qpdf结构、首页渲染、逐文件SHA-256和ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")
          (ROOT / "manifest.json").write_text(json.dumps({
              "company": COMPANY,
              "stock_code": CODE,
              "prepared_on": "2026-11-04",
              "report_count": len(manifest),
              "files": manifest,
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "报告类型", "券商", "研究员", "日期", "标题", "评级", "页数", "字节数", "SHA-256", "原始PDF来源"])
              for item in manifest:
                  writer.writerow([item["filename"], item["report_type"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"], item["pages"], item["bytes"], item["sha256"], item["source_url"]])
          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("electric_chip_600877_broker_reports_2.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 2:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 2")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": 2,
              "files": [{k: item[k] for k in ["filename", "report_type", "broker", "analyst", "date", "title", "rating", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: electric-chip-600877-broker-reports-2-20261104
          path: |
            electric_chip_600877_broker_reports_2.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
