name: Temporary Test Public Mengtai PDF Endpoints V2

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-test-sdyanbao-mengtai-static-v2.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search first, then inspect detail and PDF endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          API = 'https://api.sdyanbao.com'
          STATIC = 'https://static.sdyanbao.com/'
          TARGET_TITLES = {
              '蒙泰高新：丙纶长丝行业领跑者 双基地强势进军碳纤维',
              '蒙泰高新：丙纶景气触底 布局碳纤维打开新增量',
          }
          OUT = Path('endpoint_probe_v2')
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://www.sdyanbao.com/report?keyword=%E8%92%99%E6%B3%B0%E9%AB%98%E6%96%B0',
              'Origin': 'https://www.sdyanbao.com',
              'Content-Type': 'application/json;charset=UTF-8',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Device': '1',
              'X-Token': '',
          })

          search_payload = {
              'device': 1,
              'hideTrader': 0,
              'onlyTitle': 0,
              'order': 0,
              'page': 1,
              'pageSize': 100,
              'keyword': '蒙泰高新',
              'opFrom': 1,
          }
          search_response = session.post(API + '/api/file/search', json=search_payload, timeout=60)
          print('SEARCH_META=' + json.dumps({
              'status': search_response.status_code,
              'bytes': len(search_response.content),
              'cookies': session.cookies.get_dict(),
              'body_head': search_response.text[:1000],
          }, ensure_ascii=False))
          search_response.raise_for_status()
          search_data = search_response.json()
          (OUT / 'search.json').write_text(json.dumps(search_data, ensure_ascii=False, indent=2), encoding='utf-8')

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          found = []
          for item in walk(search_data):
              title = str(item.get('name') or item.get('title') or '')
              if title in TARGET_TITLES:
                  candidate = {
                      'id': str(item.get('id')),
                      'title': title,
                      'page_count': item.get('page_count'),
                      'size': item.get('size'),
                      'author': item.get('author'),
                      'organization': item.get('organization'),
                  }
                  if candidate not in found:
                      found.append(candidate)
          print('FOUND=' + json.dumps(found, ensure_ascii=False))
          if len(found) != 2:
              raise RuntimeError(f'Expected exactly two target reports, found {len(found)}')

          def is_pdf(raw):
              return len(raw) > 20000 and raw.lstrip().startswith(b'%PDF')

          def response_record(label, response):
              raw = response.content
              record = {
                  'label': label,
                  'requested_url': response.request.url,
                  'final_url': response.url,
                  'status': response.status_code,
                  'content_type': response.headers.get('content-type'),
                  'content_length': response.headers.get('content-length'),
                  'content_disposition': response.headers.get('content-disposition'),
                  'bytes': len(raw),
                  'head_hex': raw[:32].hex(),
                  'head_text': raw[:250].decode('utf-8', errors='replace'),
                  'is_pdf': is_pdf(raw),
              }
              print('RESPONSE=' + json.dumps(record, ensure_ascii=False))
              return record

          saved = []
          for target in found:
              report_id = target['id']
              detail_response = session.post(
                  API + '/api/file/detail',
                  json={'id': report_id, 'opFrom': 1},
                  timeout=60,
              )
              response_record(report_id + ':detail', detail_response)
              detail_response.raise_for_status()
              detail_payload = detail_response.json()
              (OUT / f'{report_id}_detail.json').write_text(
                  json.dumps(detail_payload, ensure_ascii=False, indent=2), encoding='utf-8'
              )
              data = detail_payload.get('data')
              if not isinstance(data, dict):
                  raise RuntimeError(f'Detail failed for {report_id}: {detail_payload}')
              print('DETAIL=' + json.dumps({
                  'id': report_id,
                  'name': data.get('name'),
                  'page_count': data.get('page_count'),
                  'size': data.get('size'),
                  'author': data.get('author'),
                  'organization': data.get('organization'),
                  'online_url': data.get('online_url'),
                  'page_url': data.get('page_url'),
                  'oss_name': data.get('oss_name'),
                  'page_dir': data.get('page_dir'),
                  'image_name': data.get('image_name'),
                  'downloadName': data.get('downloadName'),
                  'is_unlock': data.get('is_unlock'),
                  'is_download': data.get('is_download'),
              }, ensure_ascii=False))

              candidates = []
              for base_url in [
                  data.get('online_url'),
                  data.get('page_url'),
                  urljoin(STATIC, str(data.get('oss_name') or '')),
              ]:
                  if not base_url:
                      continue
                  for candidate in [base_url, base_url + '.pdf', base_url + '?download=1', base_url + '?attname=1']:
                      if candidate not in candidates:
                          candidates.append(candidate)

              discovered = []
              for index, candidate in enumerate(candidates, start=1):
                  try:
                      response = session.get(
                          candidate,
                          headers={
                              'Accept': 'application/pdf,text/html,application/json,*/*',
                              'Referer': f'https://www.sdyanbao.com/detail/{report_id}',
                          },
                          timeout=120,
                          allow_redirects=True,
                      )
                      record = response_record(f'{report_id}:candidate:{index}', response)
                      if record['is_pdf']:
                          path = OUT / f'{report_id}_candidate_{index}.pdf'
                          path.write_bytes(response.content)
                          saved.append({'id': report_id, 'path': str(path), 'source': response.url})
                          continue
                      ctype = (response.headers.get('content-type') or '').lower()
                      if 'text' in ctype or 'json' in ctype or response.content[:1] in (b'<', b'{', b'['):
                          text = html.unescape(response.content.decode('utf-8', errors='ignore')).replace('\\/', '/')
                          (OUT / f'{report_id}_candidate_{index}.txt').write_text(text[:1000000], encoding='utf-8')
                          for pattern in [
                              r'https?://[^"\'<>\s]+?\.pdf(?:\?[^"\'<>\s]*)?',
                              r'https?://static\.sdyanbao\.com/[^"\'<>\s]+',
                              r'(?:src|href|url|file|pdfUrl|downloadUrl)\s*[:=]\s*["\']([^"\']+)["\']',
                          ]:
                              for value in re.findall(pattern, text, re.I):
                                  if isinstance(value, tuple):
                                      value = value[0]
                                  url = urljoin(response.url, value)
                                  if url not in discovered:
                                      discovered.append(url)
                  except Exception as exc:
                      print('CANDIDATE_ERROR=' + json.dumps({
                          'id': report_id, 'url': candidate, 'error': repr(exc)
                      }, ensure_ascii=False))

              print('DISCOVERED=' + json.dumps({'id': report_id, 'urls': discovered[:150]}, ensure_ascii=False))
              for index, candidate in enumerate(discovered[:50], start=1):
                  try:
                      response = session.get(candidate, timeout=120, allow_redirects=True)
                      record = response_record(f'{report_id}:discovered:{index}', response)
                      if record['is_pdf']:
                          path = OUT / f'{report_id}_discovered_{index}.pdf'
                          path.write_bytes(response.content)
                          saved.append({'id': report_id, 'path': str(path), 'source': response.url})
                  except Exception as exc:
                      print('DISCOVERED_ERROR=' + json.dumps({
                          'id': report_id, 'url': candidate, 'error': repr(exc)
                      }, ensure_ascii=False))

              for index, download_payload in enumerate([
                  {'id': report_id},
                  {'id': report_id, 'opFrom': 1},
                  {'id': report_id, 'beike': 0, 'opFrom': 1},
                  {'id': report_id, 'device': 1, 'opFrom': 1},
              ], start=1):
                  response = session.post(API + '/api/file/download', json=download_payload, timeout=60)
                  record = response_record(f'{report_id}:download:{index}', response)
                  if record['is_pdf']:
                      path = OUT / f'{report_id}_download_{index}.pdf'
                      path.write_bytes(response.content)
                      saved.append({'id': report_id, 'path': str(path), 'source': response.url})
                      continue
                  try:
                      body = response.json()
                  except Exception:
                      continue
                  print('DOWNLOAD_BODY=' + json.dumps({
                      'id': report_id, 'request': download_payload, 'response': body
                  }, ensure_ascii=False))
                  urls = []
                  for node in walk(body):
                      for value in node.values():
                          if isinstance(value, str) and value.startswith(('http://', 'https://')) and value not in urls:
                              urls.append(value)
                  for url_index, url in enumerate(urls, start=1):
                      fetched = session.get(url, timeout=120, allow_redirects=True)
                      fetched_record = response_record(
                          f'{report_id}:download-url:{index}:{url_index}', fetched
                      )
                      if fetched_record['is_pdf']:
                          path = OUT / f'{report_id}_download_url_{index}_{url_index}.pdf'
                          path.write_bytes(fetched.content)
                          saved.append({'id': report_id, 'path': str(path), 'source': fetched.url})

          print('SAVED=' + json.dumps(saved, ensure_ascii=False))
          (OUT / 'saved.json').write_text(json.dumps(saved, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: mengtai-sdyanbao-endpoint-probe-v2
          path: endpoint_probe_v2
          retention-days: 2
          if-no-files-found: error
