name: Fetch 51pdf page 7 source

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-p7-source-only-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch page and target detail
        run: |
          mkdir -p out
          python - <<'PY'
          import json, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          url='https://www.51pdf.cn/report_xg_p7/'
          r=s.get(url,timeout=60,allow_redirects=True)
          print('LIST',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
          Path('out/list.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser'); target=None
          for a in soup.find_all('a',href=True):
              label=' '.join(a.get_text(' ',strip=True).split())
              href=urljoin(r.url,a['href'])
              if '马矿股份' in label:
                  print('TARGET',json.dumps({'label':label,'href':href},ensure_ascii=False),flush=True); target=href
          if target:
              rr=s.get(target,timeout=60,allow_redirects=True)
              print('DETAIL',rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),flush=True)
              Path('out/detail.html').write_bytes(rr.content)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-601123-p7-source-only-20261104
          path: out/
          if-no-files-found: error
          retention-days: 7
