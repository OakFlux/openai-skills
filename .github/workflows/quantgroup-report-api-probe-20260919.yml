name: Probe Quantgroup report APIs 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-report-api-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Probe APIs
        shell: bash
        run: |
          python - <<'PY'
          import json,re,html
          from urllib.parse import quote,urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          urls=[]
          for code in ['02685','2685','02685.HK','2685.HK']:
              urls += [
                f'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&qType=0&code={code}',
                f'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&qType=0&codes={code}',
                f'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&qType=3&code={code}',
                f'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&qType=3&codes={code}',
                f'https://reportapi.eastmoney.com/report/list?cb=datatable&pageSize=100&pageNo=1&qType=1&code={code}',
              ]
          urls += [
            'https://data.eastmoney.com/report/stock.jshtml?encodeUrl=02685',
            'https://data.eastmoney.com/report/stock.jshtml?code=02685',
            'https://www.futunn.com/hk/stock/02685-HK/research',
            'https://www.futunn.com/hk/stock/02685-HK',
            'https://www.phillip.com.hk/en-us/research/',
            'https://www.poems.com.hk/en-us/research/',
            'https://www.chiefgroup.com.hk/en/research/',
            'https://www.bsgroup.com.hk/en/research',
            'https://www.gtjai.com/en/research',
            'https://www.fxbaogao.com/search?keyword='+quote('量化派'),
            'https://www.sdyanbao.com/search?keyword='+quote('量化派'),
            'https://www.hibor.com.cn/search?keyword='+quote('量化派'),
          ]
          for u in urls:
              try:
                  r=s.get(u,timeout=35,allow_redirects=True)
                  body=r.text
                  print('\nURL',u,'STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content))
                  if 'eastmoney' in u:
                      print('BODY',body[:3000])
                  else:
                      text=' '.join(BeautifulSoup(body,'lxml').get_text(' ',strip=True).split())
                      print('TEXT',text[:1200])
                      for needle in ['量化派','Quantgroup','02685','2685']:
                          if needle.lower() in body.lower(): print('FOUND',needle)
                      soup=BeautifulSoup(body,'lxml')
                      for a in soup.find_all('a',href=True):
                          tx=' '.join(a.get_text(' ',strip=True).split())
                          href=urljoin(r.url,a['href'])
                          low=(tx+' '+href).lower()
                          if any(k in low for k in ['量化派','quantgroup','02685','2685']): print('LINK',tx[:200],href[:800])
                  for m in re.findall(r'https?://[^\s"\'<>]+(?:\.pdf|PDF)(?:\?[^\s"\'<>]*)?',body):
                      if any(k in m.lower() for k in ['02685','2685','quant','report','research']): print('PDFURL',html.unescape(m)[:1200])
              except Exception as e: print('ERR',u,repr(e))
          PY
