name: Quick Huaying 000536 broker report metadata 20261012

on:
  push:
    paths:
      - '.triggers/huaying-000536-broker-metadata-quick-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query public report APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, re, html
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json,*/*','Referer':'https://data.eastmoney.com/'})
          code='000536'; company='华映科技'
          allrows=[]
          for page in range(1,4):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2008-01-01','endTime':'2026-10-12','pageNo':page,'fields':'','qType':'0','orgCode':'','code':code,'rcode':'','p':page,'pageNum':page,'pageNumber':page}
              try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=60)
                  print('EM',page,r.status_code,len(r.content),r.url,flush=True)
                  if r.status_code!=200: break
                  rows=r.json().get('data') or []
                  print('EM_ROWS',len(rows),flush=True)
                  for row in rows:
                      if code in json.dumps(row,ensure_ascii=False) or company in json.dumps(row,ensure_ascii=False):
                          print('EM_ROW',json.dumps(row,ensure_ascii=False),flush=True)
                          allrows.append(('em',row))
                  if len(rows)<100: break
              except Exception as e: print('EM_ERR',repr(e),flush=True); break
          ep='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          bodies=[{'stockCodes':[code],'pageNum':1,'pageSize':100,'order':1},{'keywords':company,'pageNum':1,'pageSize':100,'order':1},{'keywords':'华映科技 深度','pageNum':1,'pageSize':100,'order':1},{'keywords':'华映科技 首次覆盖','pageNum':1,'pageSize':100,'order':1}]
          for i,b in enumerate(bodies,1):
              try:
                  r=s.post(ep,json=b,timeout=60,headers={'Content-Type':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
                  print('FX',i,r.status_code,len(r.content),json.dumps(b,ensure_ascii=False),flush=True)
                  if r.status_code!=200: continue
                  rows=((r.json().get('data') or {}).get('dataList') or [])
                  print('FX_ROWS',len(rows),flush=True)
                  for row in rows:
                      if code in json.dumps(row,ensure_ascii=False) or company in json.dumps(row,ensure_ascii=False):
                          print('FX_ROW',json.dumps(row,ensure_ascii=False),flush=True)
                          allrows.append(('fx',row))
              except Exception as e: print('FX_ERR',repr(e),flush=True)
          print('TOTAL',len(allrows),flush=True)
          PY
