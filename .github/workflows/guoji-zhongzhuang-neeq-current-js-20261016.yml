name: Inspect current NEEQ announcement page JavaScript 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-current-js-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Parse current announcement page scripts and API calls
        run: |
          python -m pip install --quiet beautifulsoup4 lxml
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          page='https://www.neeq.com.cn/disclosure/announcement.html'
          r=s.get(page,timeout=40); print('PAGE',r.status_code,r.url,len(r.content),s.cookies.get_dict())
          print('HTML_HEAD',r.text[:5000])
          soup=BeautifulSoup(r.text,'lxml')
          scripts=[]
          for tag in soup.find_all('script'):
            src=tag.get('src')
            if src: scripts.append(urljoin(r.url,src))
            elif tag.string and any(k in tag.string for k in ('infoResult','disclosureInfo','companyCd','needFields')):
              print('\nINLINE_MATCH\n',tag.string[:20000])
          print('SCRIPT_COUNT',len(scripts))
          for u in scripts:
            try:
              rr=s.get(u,timeout=40); txt=rr.text
              print('SCRIPT',rr.status_code,u,'LEN',len(txt))
              if any(k in txt for k in ('infoResult','disclosureInfo','companyCd','needFields','noticeType')):
                print('\nMATCH_SCRIPT',u)
                for pat in ['infoResult','disclosureInfo','companyCd','needFields','noticeType','disclosureType','xxfcbj']:
                  pos=0; count=0
                  while count<20:
                    pos=txt.find(pat,pos)
                    if pos<0: break
                    print('CTX',pat,repr(txt[max(0,pos-700):pos+1500]))
                    pos+=len(pat); count+=1
            except Exception as exc: print('ERR',u,repr(exc))
          PY
