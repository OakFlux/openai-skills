name: Temporary Discover Jiuding New Materials Research PDFs

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover Eastmoney research metadata and PDF URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import requests

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': '*/*',
          })

          reports = {}
          for page_no in range(1, 8):
              params = {
                  'cb': 'datatable',
                  'pageNo': page_no,
                  'pageSize': 100,
                  'code': '002201',
                  'industryCode': '*',
                  'industry': '*',
                  'rating': '*',
                  'ratingChange': '*',
                  'beginTime': '2008-01-01',
                  'endTime': '2026-08-30',
                  'fields': '',
                  'qType': 0,
              }
              response = session.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=60)
              print('API', page_no, response.status_code, len(response.content), response.url)
              response.raise_for_status()
              match = re.match(r'^datatable\((.*)\)\s*;?$', response.text.strip(), flags=re.S)
              if not match:
                  raise RuntimeError('Unexpected JSONP response')
              payload = json.loads(match.group(1))
              batch = payload.get('data') or []
              print('PAGE', page_no, 'HITS', payload.get('hits'), 'BATCH', len(batch))
              for item in batch:
                  info = item.get('infoCode') or ''
                  if info:
                      reports[info] = item
              if len(batch) < 100:
                  break

          all_reports = list(reports.values())
          all_reports.sort(key=lambda x: x.get('publishDate') or '', reverse=True)
          print('UNIQUE_TOTAL', len(all_reports))

          print('\n=== ALL REPORTS ===')
          for item in all_reports:
              print(json.dumps({
                  'date': item.get('publishDate'),
                  'broker': item.get('orgSName') or item.get('orgName'),
                  'title': item.get('title'),
                  'pages': int(item.get('attachPages') or 0),
                  'size': item.get('attachSize'),
                  'infoCode': item.get('infoCode'),
                  'researcher': item.get('researcher'),
                  'rating': item.get('sRatingName'),
                  'stockCode': item.get('stockCode'),
                  'stockName': item.get('stockName'),
              }, ensure_ascii=False, sort_keys=True))

          print('\n=== SUBSTANTIAL / DEEP CANDIDATES ===')
          keywords = ['深度', '首次覆盖', '龙头', '成长', '玻纤', '风电', '复合材料', '新材料', '投资价值', '叶片', '高性能']
          for item in all_reports:
              title = item.get('title') or ''
              pages = int(item.get('attachPages') or 0)
              if pages >= 12 or any(keyword in title for keyword in keywords):
                  info = item.get('infoCode') or ''
                  pdf_url = f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
                  try:
                      rr = session.get(pdf_url, timeout=45, allow_redirects=True, stream=True)
                      head = next(rr.iter_content(chunk_size=32), b'')
                      pdf_ok = rr.status_code == 200 and head.startswith(b'%PDF')
                      length = rr.headers.get('content-length')
                      rr.close()
                  except Exception as exc:
                      pdf_ok = False
                      length = repr(exc)
                  print(json.dumps({
                      'date': item.get('publishDate'),
                      'broker': item.get('orgSName') or item.get('orgName'),
                      'title': title,
                      'pages': pages,
                      'infoCode': info,
                      'researcher': item.get('researcher'),
                      'rating': item.get('sRatingName'),
                      'pdf_ok': pdf_ok,
                      'content_length': length,
                      'pdf_url': pdf_url,
                      'stockName': item.get('stockName'),
                  }, ensure_ascii=False, sort_keys=True))
          PY
