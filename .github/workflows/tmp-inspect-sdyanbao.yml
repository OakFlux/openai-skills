name: Temporary Inspect Sdyanbao Endpoints

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-inspect-sdyanbao.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect sample detail, search and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from urllib.parse import urljoin,unquote,quote
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sdyanbao.com/'})
          urls=[
            'https://www.sdyanbao.com/detail/355422',
            'https://www.sdyanbao.com/search?keyword='+quote('蒙泰高新'),
            'https://www.sdyanbao.com/search/'+quote('蒙泰高新'),
            'https://www.sdyanbao.com/?s='+quote('蒙泰高新'),
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True); text=html.unescape(r.text).replace('\\/','/')
              print('PAGE='+json.dumps({'url':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')},ensure_ascii=False))
              links=[]
              for m in re.finditer(r'<(?:a|button|form|iframe|script)\b([^>]*)>(.*?)</(?:a|button|form|iframe|script)>',text,re.I|re.S):
                attrs=m.group(1); body=re.sub(r'<[^>]+>',' ',m.group(2));body=re.sub(r'\s+',' ',body).strip()
                vals=[]
                for k,v in re.findall(r'(href|src|action|data-[\w-]+|onclick|value)=["\']([^"\']+)["\']',attrs,re.I): vals.append((k,urljoin(r.url,html.unescape(unquote(v)))))
                blob=(attrs+' '+body+' '+str(vals)).lower()
                if any(k in blob for k in ['下载','download','pdf','search','query','keyword','报告','蒙泰']): links.append({'body':body[:180],'attrs':re.sub(r'\s+',' ',attrs)[:500],'vals':vals})
              print('LINKS='+json.dumps(links[:100],ensure_ascii=False))
              snippets=[]
              for needle in ['download','立即下载','.pdf','pdfurl','fileurl','detail/355422','search','keyword','api/','axios','fetch(']:
                for m in list(re.finditer(needle,text,re.I))[:20]: snippets.append(re.sub(r'\s+',' ',text[max(0,m.start()-350):m.start()+1100]))
              print('SNIPPETS='+json.dumps(snippets[:100],ensure_ascii=False))
              scripts=[urljoin(r.url,x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)]
              print('SCRIPTS='+json.dumps(scripts,ensure_ascii=False))
              for su in scripts:
                try:
                  q=s.get(su,timeout=60); body=q.text
                  hits=[]
                  for needle in ['download','pdf','search','keyword','api/','detail']:
                    for m in list(re.finditer(needle,body,re.I))[:20]: hits.append(re.sub(r'\s+',' ',body[max(0,m.start()-400):m.start()+1400]))
                  if hits: print('SCRIPT_HITS='+json.dumps({'url':su,'status':q.status_code,'bytes':len(q.content),'hits':hits[:80]},ensure_ascii=False))
                except Exception as e: print('SCRIPT_ERR='+json.dumps({'url':su,'error':repr(e)},ensure_ascii=False))
            except Exception as e: print('ERROR='+json.dumps({'url':url,'error':repr(e)},ensure_ascii=False))
          PY
