name: Build Jingxue 301010 broker research package

on:
  push:
    branches:
      - tmp-jingxue-broker-package-final-20261103

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='晶雪节能_301010_券商深度研究资料_3份'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/jingxue_broker_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('晶雪节能_301010_券商深度研究资料_3份')
          reports = [
              {
                  'order': 1,
                  'broker': '信达证券',
                  'date': '2023-10-23',
                  'title': '工商业制冷行业为何持续高景气？——工商业制冷行业深度报告',
                  'scope': '行业深度报告；设有“晶雪节能：国内节能保温板行业龙头，或将受益于冷库冷链建设”独立小节。',
                  'filename': '01_信达证券_工商业制冷行业为何持续高景气_2023-10-23.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202310241602873170_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202310241602873170.html',
                  'min_pages': 35,
                  'required_any': ['晶雪节能：国内节能保温板行业龙头', '晶雪节能:国内节能保温板行业龙头'],
                  'broker_terms': ['信达证券'],
              },
              {
                  'order': 2,
                  'broker': '东兴证券',
                  'date': '2024-12-15',
                  'title': '机械行业：冰雪产业高质量发展利好制冷设备',
                  'scope': '机械行业深度报告；在制冷设备受益标的中明确列示晶雪节能（301010）。',
                  'filename': '02_东兴证券_冰雪产业高质量发展利好制冷设备_2024-12-15.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202412161641308249_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202412161641308249.html',
                  'min_pages': 10,
                  'required_any': ['晶雪节能（301010）', '晶雪节能(301010)', '晶雪节能301010'],
                  'broker_terms': ['东兴证券'],
              },
              {
                  'order': 3,
                  'broker': '中泰证券',
                  'date': '2017-09-18',
                  'title': '冷链设备龙头，智能自动售货机受益无人零售大发展——中泰机械“精品研究”系列之三',
                  'scope': '历史关联公司深度报告，研究对象为大冷股份；报告对当时关联公司晶雪节能设有实质性专题分析。',
                  'filename': '03_中泰证券_冷链设备龙头智能自动售货机受益无人零售大发展_2017-09-18.pdf',
                  'url': 'https://stock.tianyancha.com/ResearchReport/eastmoney/7c21f38621370b563c426f279e30604c.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP201709190884172526.html',
                  'min_pages': 25,
                  'required_any': ['晶雪节能'],
                  'broker_terms': ['中泰证券', '中泰机械'],
                  'extra_terms': ['大冷股份'],
              },
          ]

          def new_session() -> requests.Session:
              session = requests.Session()
              session.trust_env = False
              session.mount('https://', HTTPAdapter(max_retries=Retry(
                  total=6,
                  connect=6,
                  read=6,
                  status=6,
                  backoff_factor=1.0,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET'],
                  raise_on_status=False,
              )))
              session.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              })
              return session

          def compact_text(reader: PdfReader) -> str:
              chunks: list[str] = []
              for page in reader.pages:
                  try:
                      chunks.append(page.extract_text() or '')
                  except Exception:
                      pass
              return re.sub(r'\s+', '', '\n'.join(chunks))

          records = []
          for report in reports:
              session = new_session()
              response = session.get(
                  report['url'],
                  headers={'Referer': report['info']},
                  timeout=(30, 240),
                  allow_redirects=True,
              )
              data = response.content
              if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 100_000:
                  raise RuntimeError(
                      f"{report['broker']}: HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get('content-type')}"
                  )

              destination = out / report['filename']
              destination.write_bytes(data)
              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f"{destination.name}: page count {pages} below {report['min_pages']}")

              compact = compact_text(reader)
              if '晶雪节能' not in compact and '301010' not in compact:
                  raise RuntimeError(f'{destination.name}: Jingxue reference not found')
              if not any(term.replace(' ', '') in compact for term in report['required_any']):
                  raise RuntimeError(f'{destination.name}: required Jingxue analysis marker not found')
              if not any(term.replace(' ', '') in compact for term in report['broker_terms']):
                  raise RuntimeError(f'{destination.name}: broker name not found')
              for term in report.get('extra_terms', []):
                  if term.replace(' ', '') not in compact:
                      raise RuntimeError(f'{destination.name}: required related-company marker {term} not found')

              sha = hashlib.sha256(data).hexdigest()
              record = {
                  **report,
                  'pages': pages,
                  'bytes': len(data),
                  'source': response.url,
                  'sha256': sha,
              }
              records.append(record)
              print(
                  'DOWNLOADED', report['broker'], report['title'],
                  'pages=', pages, 'bytes=', len(data),
                  'source=', response.url, 'sha256=', sha,
              )

          records.sort(key=lambda item: item['order'])
          lines = [
              '晶雪节能（301010）券商深度研究资料包',
              '整理日期：2026-11-03',
              '',
              '收录说明：',
              '1. 公开渠道中未检索到2—3份可直接下载的晶雪节能独立公司深度报告。为避免使用短点评、网页摘要或预览截图充数，本包收录3份完整券商深度PDF。',
              '2. 三份材料均包含晶雪节能的实质性分析或明确受益逻辑，但研究对象范围不同：一份含晶雪节能独立专题，一份将晶雪节能列为行业受益标的，一份为历史关联公司深度报告并含晶雪节能专题分析。',
              '3. 文件均已核验PDF结构、实际页数、券商名称、晶雪节能相关正文以及首页和末页渲染。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   报告日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   范围说明：{item['scope']}",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   信息页：{item['info']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f'合计：3份PDF，{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 10
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '晶雪节能|301010' "$pdf.txt"
            rm -f "$pdf.txt"

            stem="/tmp/jingxue_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/jingxue_broker_test.zip "$PACKAGE"
          unzip -t /tmp/jingxue_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/jingxue_broker_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f /tmp/jingxue_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Jingxue-301010-broker-deep-research-materials-3
          path: 晶雪节能_301010_券商深度研究资料_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
