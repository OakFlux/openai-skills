name: Build clean CITIC Telecom research PDFs without website navigation

on:
  push:
    branches:
      - chatgpt-citic-telecom-fast-package-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml reportlab pypdf pymupdf
      - name: Create clean searchable PDFs and ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports output/renders
          cat > /tmp/build_clean.py <<'PY'
          from __future__ import annotations
          import csv, hashlib, html, io, json, re, zipfile
          from pathlib import Path
          import requests, pymupdf
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_JUSTIFY
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.units import mm
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle

          OUT=Path('output'); PDF_DIR=OUT/'reports'; RENDER_DIR=OUT/'renders'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          reports=[
            {'order':1,'date':'2026-03-17','title':'CITIC Telecom - Company Guide','kind':'Company Guide / company-deep research page','url':'https://www.dbs.com.sg/treasures/aics/templatedata/article/equity/data/en/DBSV/012014/1883_HK.xml','filename':'01_DBS_CITIC_Telecom_Company_Guide_2026-03-17.pdf','mode':'guide'},
            {'order':2,'date':'2026-08-14','title':'CITIC Telecom - Stable 1H26 earnings; appealing 7%+ dividend yield','kind':'Latest company research update','url':'https://www.dbs.com.sg/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/082026/1883_HK_08142026.xml','filename':'02_DBS_CITIC_Telecom_1H26_Research_Update_2026-08-14.pdf','mode':'update'},
          ]
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          pdfmetrics.registerFont(TTFont('DV',font)); FONT='DV'
          styles=getSampleStyleSheet()
          styles.add(ParagraphStyle(name='TitleX',fontName=FONT,fontSize=18.5,leading=22,spaceAfter=9,textColor=colors.HexColor('#111111')))
          styles.add(ParagraphStyle(name='H2X',fontName=FONT,fontSize=12.2,leading=15,spaceBefore=10,spaceAfter=5,keepWithNext=True))
          styles.add(ParagraphStyle(name='BodyX',fontName=FONT,fontSize=9.25,leading=13.0,alignment=TA_JUSTIFY,spaceAfter=5.2,splitLongWords=True))
          styles.add(ParagraphStyle(name='MetaX',fontName=FONT,fontSize=8.4,leading=11.2,textColor=colors.HexColor('#444444'),spaceAfter=3))
          styles.add(ParagraphStyle(name='SmallX',fontName=FONT,fontSize=7.5,leading=10,textColor=colors.HexColor('#555555')))
          headings={'Quick View','Profile','Previous Close Price','Key Statistics','Recent Developments','Our Views','Risks','Valuation','Related Stories','1H26 Results Highlights','FY25 Results Highlights','Outlook','GENERAL DISCLOSURE/DISCLAIMER','RESTRICTIONS ON DISTRIBUTION','Research Platform: Insights Direct'}
          noise={'Created with Sketch.','Print','Download PDF','Have a question?','Yes, contact me','Start Now','Read More','Manage your portfolio from your iWealth account','Get more in-depth analysis from DBS Research','Show me more'}

          def digest(data:bytes)->str: return hashlib.sha256(data).hexdigest()
          def fetch_lines(r):
            resp=s.get(r['url'],timeout=(12,45),allow_redirects=True); resp.raise_for_status()
            soup=BeautifulSoup(resp.text,'lxml')
            root=soup.body or soup
            for tag in root(['script','style','noscript','svg','header','footer','nav']): tag.decompose()
            lines=[re.sub(r'\s+',' ',x).strip() for x in root.get_text('\n',strip=True).splitlines()]
            lines=[x for x in lines if x]
            if r['mode']=='guide':
              candidates=[]
              for i,x in enumerate(lines):
                if x=='CITIC Telecom' and 'Quick View' in lines[i+1:i+15]: candidates.append(i)
              if not candidates: raise RuntimeError('company guide start not found')
              start=candidates[-1]
            else:
              candidates=[i for i,x in enumerate(lines) if x==r['title'] or x.startswith('CITIC Telecom - Stable 1H26 earnings')]
              if not candidates: raise RuntimeError('1H26 update start not found')
              start=candidates[-1]
            body=lines[start:]
            end=len(body)
            for i,x in enumerate(body):
              if i>30 and x in {'Useful Links','Pricing Guide','Service Fees','Others','Contact','Markets'}:
                end=i; break
            body=body[:end]
            cleaned=[]
            for x in body:
              if x in noise or x.startswith('Image'): continue
              if cleaned and cleaned[-1]==x: continue
              cleaned.append(x)
            joined='\n'.join(cleaned); compact=re.sub(r'\s+','',joined).lower()
            if len(joined)<3500 or 'citictelecom' not in compact or not any(k in compact for k in ['1883','macau','ctm']): raise RuntimeError(f'content validation failed {len(joined)}')
            return cleaned,resp.url

          def make_pdf(lines,r,source,path):
            def footer(canvas,doc):
              canvas.saveState(); canvas.setFont(FONT,7); canvas.setFillColor(colors.HexColor('#666666')); canvas.drawCentredString(A4[0]/2,8*mm,str(doc.page)); canvas.restoreState()
            doc=SimpleDocTemplate(str(path),pagesize=A4,leftMargin=14*mm,rightMargin=14*mm,topMargin=14*mm,bottomMargin=15*mm,title=r['title'],author='DBS Bank (Hong Kong) Limited')
            story=[Paragraph(html.escape(r['title']),styles['TitleX'])]
            meta=[['Broker','DBS Bank (Hong Kong) Limited'],['Publication date',r['date']],['Report type',r['kind']],['Official public source',source],['Edition note','Searchable offline export of the complete public DBS research webpage. The original-layout download may require iWealth login.']]
            table=Table([[Paragraph('<b>'+html.escape(k)+'</b>',styles['SmallX']),Paragraph(html.escape(v),styles['SmallX'])] for k,v in meta],colWidths=[35*mm,141*mm])
            table.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,-1),colors.HexColor('#F4F4F4')),('BOX',(0,0),(-1,-1),0.5,colors.HexColor('#BBBBBB')),('INNERGRID',(0,0),(-1,-1),0.25,colors.HexColor('#DDDDDD')),('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),5),('RIGHTPADDING',(0,0),(-1,-1),5),('TOPPADDING',(0,0),(-1,-1),4),('BOTTOMPADDING',(0,0),(-1,-1),4)]))
            story += [table,Spacer(1,8)]
            skipped=False
            for x in lines:
              if not skipped and (x=='CITIC Telecom' or x==r['title'] or x.startswith('CITIC Telecom - Stable 1H26 earnings')):
                skipped=True; continue
              esc=html.escape(x)
              if x in headings or (x.isupper() and 5<=len(x)<=70): story.append(Paragraph(esc,styles['H2X']))
              elif re.match(r'^(Tsz Wang Tam|\d{1,2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) 20\d{2}|Publication Date)',x): story.append(Paragraph(esc,styles['MetaX']))
              elif x.startswith(('•','- ')): story.append(Paragraph('• '+html.escape(x.lstrip('•- ')),styles['BodyX']))
              else: story.append(Paragraph(esc,styles['BodyX']))
            story += [Spacer(1,10),Paragraph('Research copyright and views belong to DBS and the named analyst(s). This is an offline export of a publicly accessible DBS research page and is not investment advice.',styles['SmallX'])]
            doc.build(story,onFirstPage=footer,onLaterPages=footer)

          def verify(path):
            data=path.read_bytes(); reader=PdfReader(io.BytesIO(data),strict=False); pages=len(reader.pages)
            if b'%PDF' not in data[:4096] or pages<2: raise RuntimeError('invalid PDF')
            text=''.join((p.extract_text() or '') for p in reader.pages); compact=re.sub(r'\s+','',text).lower()
            if 'citictelecom' not in compact or not any(k in compact for k in ['1883','macau','ctm']): raise RuntimeError('PDF relevance failed')
            doc=pymupdf.open(str(path)); checks=[]
            for pno in sorted(set([0,pages//2,pages-1])):
              pix=doc.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(1.3,1.3),alpha=False); out=RENDER_DIR/f'{path.stem}_p{pno+1:03d}.png'; pix.save(str(out))
              if pix.width<500 or pix.height<650 or out.stat().st_size<5000: raise RuntimeError('render failed')
              checks.append({'page':pno+1,'file':out.name,'width':pix.width,'height':pix.height,'bytes':out.stat().st_size})
            doc.close(); return {'pages':pages,'bytes':len(data),'sha256':digest(data),'checks':checks}

          records=[]
          for r in reports:
            lines,source=fetch_lines(r); path=PDF_DIR/r['filename']; make_pdf(lines,r,source,path); v=verify(path)
            rec={'序号':r['order'],'文件名':path.name,'券商':'DBS Bank (Hong Kong) Limited / 星展银行（香港）','发布日期':r['date'],'报告标题':r['title'],'报告类型':r['kind'],'页数':v['pages'],'文件大小（字节）':v['bytes'],'来源类型':'DBS完整公开研究网页转存为可搜索PDF','官方公开研究页面':source,'SHA-256':v['sha256'],'渲染核验':v['checks']}
            records.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False),flush=True)
          if len({x['SHA-256'] for x in records})!=2: raise RuntimeError('duplicate reports')
          manifest=OUT/'报告清单与校验值.csv'; fields=['序号','文件名','券商','发布日期','报告标题','报告类型','页数','文件大小（字节）','来源类型','官方公开研究页面','SHA-256']
          with manifest.open('w',encoding='utf-8-sig',newline='') as f: w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader(); w.writerows(records)
          readme=OUT/'说明.txt'; readme.write_text('中信国际电讯（01883.HK）券商公司研究资料包\n\n收录2份星展银行（香港）公司研究资料：2026-03-17公司指南/深度研究页，以及2026-08-14最新1H26研究更新。\n\n星展官网正文可完整公开阅读，但原始版式PDF入口可能要求iWealth登录。因此本包使用官方完整公开研究网页制作可搜索离线PDF；不是一两页预览，也不是下载脚本。文件保留官方来源地址，并已核验PDF文件头、页数、公司名称及首/中/末页渲染。\n\n报告版权及观点归星展银行和分析师所有，仅供研究参考，不构成投资建议。\n',encoding='utf-8')
          zip_path=OUT/'CITIC_Telecom_01883_Broker_Research_2_Clean_Public_PDFs.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(PDF_DIR.glob('*.pdf')): z.write(p,arcname=p.name)
            z.write(manifest,arcname=manifest.name); z.write(readme,arcname=readme.name)
          with zipfile.ZipFile(zip_path) as z:
            if z.testzip() is not None or len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=2: raise RuntimeError('ZIP validation failed')
          summary={'zip_file':zip_path.name,'zip_bytes':zip_path.stat().st_size,'zip_sha256':digest(zip_path.read_bytes()),'reports':records}
          (OUT/'clean_package_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PACKAGE_READY',json.dumps(summary,ensure_ascii=False),flush=True)
          PY
          python /tmp/build_clean.py
      - uses: actions/upload-artifact@v4
        with:
          name: citic-telecom-clean-final-package
          path: |
            output/CITIC_Telecom_01883_Broker_Research_2_Clean_Public_PDFs.zip
            output/clean_package_summary.json
            output/renders/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
