name: Discover AUX Electric broker report PDFs 20260919

on:
  push:
    paths:
      - '.github/workflows/aux-electric-broker-report-discovery-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Probe report pages and extract download candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('aux_report_discovery')
          OUT.mkdir(exist_ok=True)
          targets = [
              'https://www.baogaobox.com/reports/251015000079481.html',
              'https://www.baogaobox.com/reports/260531000105908.html',
              'https://www.baogaobox.com/reports/260527000105506.html',
              'https://www.baogaobox.com/reports/260418000100701.html',
              'https://www.baogaobox.com/reports/260415000100416.html',
              'https://www.fhyanbao.com/rpview/1917676',
              'https://www.nxny.com/report/view_6305607.html',
              'https://www.vzkoo.com/read/20251015fa4cb1477b01027a9be317a5.html',
              'https://max.book118.com/html/2026/0530/6140145021012142.shtm',
              'https://www.360why.com/bg/7ee567000105506.html',
          ]
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Cache-Control': 'no-cache',
          })

          def clean_filename(url: str, i: int) -> str:
              host = urlparse(url).netloc.replace('.', '_')
              return f'{i:02d}_{host}.html'

          global_lines=[]
          for i, url in enumerate(targets, 1):
              fn=OUT/clean_filename(url,i)
              try:
                  r=session.get(url,timeout=(30,120),allow_redirects=True)
                  print('GET',url,'STATUS',r.status_code,'FINAL',r.url,'TYPE',r.headers.get('content-type'),'LEN',len(r.content),flush=True)
                  fn.write_bytes(r.content)
                  text=r.text
                  soup=BeautifulSoup(text,'lxml')
                  title=(soup.title.get_text(' ',strip=True) if soup.title else '')
                  scripts=[]
                  links=[]
                  for tag in soup.find_all(['a','script','iframe','embed','object','source','link']):
                      for attr in ('href','src','data','data-src','data-url','download-url'):
                          val=tag.get(attr)
                          if val:
                              absu=urljoin(r.url,html.unescape(val))
                              links.append(absu)
                              if tag.name=='script' and attr=='src': scripts.append(absu)
                  patterns = [
                      r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                      r'https?:\\?/\\?/[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                      r'["\']([^"\']*(?:download|down|file|pdf|report|resource|attachment|preview)[^"\']*)["\']',
                      r'(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|resourceUrl|reportUrl|url)\s*[:=]\s*["\']([^"\']+)["\']',
                  ]
                  candidates=set(links)
                  for pat in patterns:
                      for m in re.finditer(pat,text,re.I):
                          val=m.group(1) if m.lastindex else m.group(0)
                          val=html.unescape(val).replace('\\/','/')
                          candidates.add(urljoin(r.url,val))
                  # Collect interesting inline lines
                  interesting=[]
                  for ln in text.splitlines():
                      low=ln.lower()
                      if any(k in low for k in ('pdf','download','下载','reportid','fileid','resource','attachment','预览','token','oss','cos','cdn')):
                          s=re.sub(r'\s+',' ',ln).strip()
                          if s and len(s)<2500:
                              interesting.append(s)
                  rec={
                      'input_url':url,'status':r.status_code,'final_url':r.url,
                      'content_type':r.headers.get('content-type'),'bytes':len(r.content),
                      'title':title,'scripts':sorted(set(scripts)),
                      'candidates':sorted(candidates),
                      'interesting_lines':interesting[:500],
                  }
                  (OUT/f'{i:02d}_result.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                  global_lines.append(json.dumps(rec,ensure_ascii=False))

                  # Fetch same-host JS assets with indicative names, limited to 25
                  fetched=0
                  for j,su in enumerate(sorted(set(scripts))):
                      if fetched>=25: break
                      try:
                          sr=session.get(su,timeout=(20,90),allow_redirects=True)
                          if sr.status_code==200 and len(sr.content)<8_000_000:
                              sfn=OUT/f'{i:02d}_script_{j:02d}.js'
                              sfn.write_bytes(sr.content)
                              fetched+=1
                      except Exception as e:
                          print('SCRIPT_ERR',su,repr(e),flush=True)
                  time.sleep(1)
              except Exception as e:
                  err={'input_url':url,'error':repr(e)}
                  (OUT/f'{i:02d}_error.json').write_text(json.dumps(err,ensure_ascii=False,indent=2),encoding='utf-8')
                  global_lines.append(json.dumps(err,ensure_ascii=False))
                  print('ERR',url,repr(e),flush=True)
          (OUT/'all_results.jsonl').write_text('\n'.join(global_lines),encoding='utf-8')
          PY

          grep -RInE "https?[^[:space:]\"']+\.pdf|downloadUrl|download_url|pdfUrl|pdf_url|fileUrl|file_url|reportId|fileId|resourceUrl|attachment" aux_report_discovery > aux_report_discovery/grep_hits.txt || true
          find aux_report_discovery -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > aux_report_discovery/file_sizes.txt

      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: aux-electric-broker-report-discovery
          path: aux_report_discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
