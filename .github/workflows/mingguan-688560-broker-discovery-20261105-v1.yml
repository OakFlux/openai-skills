name: Discover Mingguan broker research reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mingguan-688560-broker-discovery-20261105-v1.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import requests

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
              'Origin': 'https://data.eastmoney.com',
              'Referer': 'https://data.eastmoney.com/report/688560.html',
          })
          payload = {
              'pageSize': 100,
              'pageNo': 1,
              'p': 1,
              'pageNum': 1,
              'pageNumber': 1,
              'beginTime': '2019-01-01',
              'endTime': '2026-11-05',
              'code': '688560',
              'industryCode': '*',
              'rating': None,
              'ratingChange': None,
              'orgCode': None,
              'rcode': '',
          }
          r = s.post('https://reportapi.eastmoney.com/report/list2', json=payload, timeout=60)
          print('STATUS', r.status_code, 'BYTES', len(r.content), 'CTYPE', r.headers.get('content-type'), flush=True)
          r.raise_for_status()
          data = r.json()
          rows = data.get('data') or []
          print('HITS', data.get('hits'), 'ROWS', len(rows), flush=True)
          out = []
          for row in rows:
              rec = {
                  'infoCode': row.get('infoCode'),
                  'title': row.get('title'),
                  'orgSName': row.get('orgSName'),
                  'orgName': row.get('orgName'),
                  'publishDate': row.get('publishDate'),
                  'researcher': row.get('researcher'),
                  'emRatingName': row.get('emRatingName'),
                  'ratingChange': row.get('ratingChange'),
                  'column': row.get('column'),
                  'reportType': row.get('reportType'),
                  'attachPages': row.get('attachPages'),
                  'attachSize': row.get('attachSize'),
                  'attachType': row.get('attachType'),
                  'encodeUrl': row.get('encodeUrl'),
                  'indvIsNew': row.get('indvIsNew'),
              }
              out.append(rec)
          print('REPORTS_JSON', json.dumps(out, ensure_ascii=False, indent=2), flush=True)
          open('mingguan_reports.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mingguan-688560-report-metadata-20261105-v1
          path: mingguan_reports.json
          retention-days: 3
