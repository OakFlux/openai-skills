name: Inspect sdyanbao asset patterns 839553 20260929

on:
  push:
    paths:
      - '.github/workflows/inspect-sdyanbao-js-839553-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect JavaScript strings and public candidate URLs
        run: |
          python - <<'PY'
          import requests,re,itertools
          s=requests.Session(); s.trust_env=False
          h={'User-Agent':'Mozilla/5.0'}
          scripts=['https://www.sdyanbao.com/_nuxt/0bec462.js','https://www.sdyanbao.com/_nuxt/7ff3a18.js','https://www.sdyanbao.com/_nuxt/359ac1f.js','https://www.sdyanbao.com/_nuxt/a94fdf1.js']
          for u in scripts:
              t=s.get(u,headers=h,timeout=60).text
              print('SCRIPT',u,len(t))
              for pat in [r'https?:[^\"\']+',r'[^\"\']*oss\.sdyanbao\.com[^\"\']*',r'[^\"\']*\.pdf[^\"\']*',r'[^\"\']*page_url[^\"\']*',r'[^\"\']*online_url[^\"\']*']:
                  vals=[]
                  for x in re.findall(pat,t,re.I):
                      if x not in vals: vals.append(x)
                  for x in vals[:30]: print('MATCH',pat,x[:500])
              for key in ['api/file/download','online_url','page_url','download(']:
                  for m in re.finditer(re.escape(key),t,re.I):
                      a=max(0,m.start()-500); b=min(len(t),m.end()+1200)
                      print('CTX',key,t[a:b][:1800])
                      break
          base='https://oss.sdyanbao.com'
          paths=[]
          for root in ['file','files','pdf','report','reports','download','uploads','upload']:
              for ext in ['pdf','PDF']:
                  paths += [f'/{root}/2024/11/18/1118124.{ext}',f'/{root}/1118124.{ext}',f'/{root}/2024/11/18/1118124/0.{ext}']
          paths += ['/page/2024/11/18/1118124.pdf','/page/2024/11/18/1118124/1118124.pdf','/page/2024/11/18/1118124/0.pdf']
          for p in paths:
              try:
                  r=s.get(base+p,headers=h,timeout=30,allow_redirects=True,stream=True)
                  ct=r.headers.get('content-type'); cl=r.headers.get('content-length')
                  head=next(r.iter_content(16),b'')
                  if r.status_code==200 or (cl and cl!='0'):
                      print('CAND',r.status_code,ct,cl,head,base+p,r.url)
                  r.close()
              except Exception as e: pass
          PY
