name: Temporary Daan Gene Sina and 9FZT probe v7

on:
  push:
    branches: [tmp/daan-gene-broker-reports-20260829]
    paths: [.github/workflows/tmp-daan-sina-9fzt-probe-v7.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Probe original report links
        run: |
          mkdir -p out/responses out/pdfs
          python - <<'PY'
          import json,re,html,hashlib,zipfile
          from pathlib import Path
          from urllib.parse import urljoin,quote
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          O=Path('out'); R=O/'responses'; P=O/'pdfs'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          reports=[
            ('3124306','2016-02-16','广州广证恒生证券','分子诊断行业待爆发，龙头达安笑傲江湖'),
            ('648229670402','2020-07-16','国海证券','上半年业绩超预期，公司发展迎里程碑拐点'),
            ('684425869377','2020-09-01','国海证券','2020年半年报点评：后疫情时代新冠筛查从严，下半年业绩持续受益'),
          ]
          records=[]; pdfs=[]
          def clean(x,n=100): return re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x)).strip(' ._')[:n]
          def save_pdf(content,meta,url):
            if len(content)<1500 or not content.lstrip().startswith(b'%PDF'): return False
            h=hashlib.sha256(content).hexdigest()
            if any(x['sha256']==h for x in pdfs): return True
            tmp=P/f'tmp_{h[:12]}.pdf'; tmp.write_bytes(content)
            try:
              rd=PdfReader(str(tmp)); pages=len(rd.pages); text=''
              for pg in rd.pages[:4]:
                try:text+='\n'+(pg.extract_text() or '')
                except:pass
            except Exception as e:
              print('BADPDF',url,repr(e)); tmp.unlink(missing_ok=True); return False
            fn=f"{meta['date']}_{clean(meta['org'],30)}_{clean(meta['title'])}_{pages}页.pdf"; tmp.rename(P/fn)
            pdfs.append({'file':fn,'pages':pages,'bytes':len(content),'sha256':h,'url':url,'identity':('达安基因' in text or '002030' in text),**meta})
            print('SAVED',fn,url); return True
          for rid,date,org,title in reports:
            meta={'rid':rid,'date':date,'org':org,'title':title}
            bases=['https://vip.stock.finance.sina.com.cn','http://vip.stock.finance.sina.com.cn','https://stock.finance.sina.com.cn','http://stock.finance.sina.com.cn']
            paths=[
              f'/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/url',
              f'/stock/go.php/vReport_Show/kind/lastest/rptid/{rid}/url',
              f'/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml/url',
              f'/stock/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml/url',
              f'/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml',
              f'/stock/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml',
            ]
            visited=set(); queue=[b+p for b in bases for p in paths]
            while queue and len(visited)<60:
              u=queue.pop(0)
              if u in visited: continue
              visited.add(u)
              try:
                rr=s.get(u,timeout=45,allow_redirects=True,headers={'Referer':f'https://vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml'})
                ispdf=rr.content.lstrip().startswith(b'%PDF')
                rec={'rid':rid,'requested':u,'status':rr.status_code,'final':rr.url,'type':rr.headers.get('content-type'),'bytes':len(rr.content),'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('Location')} for h in rr.history],'prefix':'%PDF' if ispdf else rr.text[:1000]}
                records.append(rec); print('GET',rid,rr.status_code,len(rr.content),rr.headers.get('content-type'),rr.url)
                if rr.status_code==200 and save_pdf(rr.content,meta,rr.url): continue
                if not ispdf:
                  txt=html.unescape(rr.text).replace('\\/','/')
                  (R/f'{rid}_{len(records)}.txt').write_text(txt,encoding='utf-8',errors='ignore')
                  links=set(re.findall(r'https?://[^\s"\'<>]+',txt,re.I))
                  try:
                    soup=BeautifulSoup(txt,'html.parser')
                    for tag in soup.find_all(True):
                      for a in ['href','src','data','action','value']:
                        v=tag.get(a)
                        if isinstance(v,str) and ('http' in v or '.pdf' in v.lower() or 'report' in v.lower() or 'download' in v.lower()): links.add(urljoin(rr.url,v))
                  except: pass
                  for link in links:
                    link=link.rstrip('),;')
                    if link not in visited and any(k in link.lower() for k in ['.pdf','download','attach','vreport','rptid','report']) and len(queue)<100: queue.append(link)
              except Exception as e: records.append({'rid':rid,'requested':u,'error':repr(e)}); print('ERR',rid,u,repr(e))

          # 9FZT detail and report landing pages, including query variants.
          nine=[
            ('508957738559','2016-02-16','广州广证恒生证券','分子诊断行业待爆发，龙头达安笑傲江湖'),
            ('ba6aeea10aa02d017368232603806f9b','2016-02-16','广州广证恒生证券','分子诊断行业待爆发，龙头达安笑傲江湖'),
            ('5d7cb1e6c7e03cb5b2b3905f02a30fc0','2020-07-16','国海证券','上半年业绩超预期，公司发展迎里程碑拐点')]
          for cid,date,org,title in nine:
            meta={'rid':cid,'date':date,'org':org,'title':title}
            urls=[
              f'https://www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId={cid}&content={quote(title)}',
              f'https://www.9fzt.com/others/report.html?contentId={cid}',
              f'https://api.9fzt.com/gw/news/api/1/article/detail?id={cid}',
              f'https://api-hq.chongnengjihua.com/news/api/1/article/detail?id={cid}',
              f'https://hq.chongnengjihua.com/news/api/1/article/detail?id={cid}',
            ]
            for u in urls:
              try:
                rr=s.get(u,timeout=45,allow_redirects=True,headers={'Referer':'https://www.9fzt.com/'})
                rec={'rid':cid,'requested':u,'status':rr.status_code,'final':rr.url,'type':rr.headers.get('content-type'),'bytes':len(rr.content),'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('Location')} for h in rr.history],'prefix':'%PDF' if rr.content.lstrip().startswith(b'%PDF') else rr.text[:1200]}
                records.append(rec); print('9FZT',cid,rr.status_code,len(rr.content),rr.headers.get('content-type'),rr.url)
                save_pdf(rr.content,meta,rr.url)
                if not rr.content.lstrip().startswith(b'%PDF'):
                  txt=html.unescape(rr.text).replace('\\/','/'); (R/f'9fzt_{cid}_{len(records)}.txt').write_text(txt,encoding='utf-8',errors='ignore')
                  for link in set(re.findall(r'https?://[^\s"\'<>]+',txt,re.I)):
                    link=link.rstrip('),;')
                    if any(k in link.lower() for k in ['.pdf','download','attach','file']):
                      try:
                        q=s.get(link,timeout=45,headers={'Referer':rr.url}); print('9FOLLOW',q.status_code,len(q.content),q.url); save_pdf(q.content,meta,q.url)
                      except Exception as e: print('9FERR',link,repr(e))
              except Exception as e: records.append({'rid':cid,'requested':u,'error':repr(e)}); print('9ERR',cid,u,repr(e))
          (O/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          with zipfile.ZipFile(O/'达安基因_券商深度报告.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in P.glob('*.pdf'): z.write(f,f.name)
            z.write(O/'pdfs.json','pdfs.json')
          print('PDF_COUNT',len(pdfs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daan-sina-9fzt-probe-v7
          path: out/
          retention-days: 3
