name: Weilong Official Filings Package

on:
  push:
    branches:
      - chatgpt-weilong-filings-20260927
    paths:
      - .github/workflows/weilong_filings_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate and package official filings
        run: python scripts/build_weilong_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: weilong-official-filings-package
          path: |
            output/卫龙美味_全部年报_招股说明书_最新定期财报.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
