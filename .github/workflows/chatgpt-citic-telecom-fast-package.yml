name: Build offline PDFs from full public DBS research pages

on:
  push:
    branches:
      - chatgpt-citic-telecom-fast-package-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml reportlab pypdf pymupdf
      - name: Fetch complete public research pages and create verified PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports output/renders
          cat > /tmp/build.py <<'PY'
          from __future__ import annotations
          import csv, hashlib, html, io, json, re, zipfile
          from pathlib import Path
          import requests, pymupdf
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER, TA_JUSTIFY, TA_LEFT
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.units import mm
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfbase import pdfmetrics
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, PageBreak, Table, TableStyle, KeepTogether

          OUT=Path('output'); PDF_DIR=OUT/'reports'; RENDER_DIR=OUT/'renders'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9'})

          items=[
            {
              'order':1,'date':'2026-03-17','kind':'Company Guide / company-deep research page',
              'title':'CITIC Telecom - Company Guide',
              'url':'https://www.dbs.com.sg/treasures/aics/templatedata/article/equity/data/en/DBSV/012014/1883_HK.xml',
              'filename':'01_DBS_CITIC_Telecom_Company_Guide_2026-03-17.pdf',
              'start_candidates':['CITIC Telecom','Quick View'],
            },
            {
              'order':2,'date':'2026-08-14','kind':'Latest company research update',
              'title':'CITIC Telecom - Stable 1H26 earnings; appealing 7%+ dividend yield',
              'url':'https://www.dbs.com.sg/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/082026/1883_HK_08142026.xml',
              'fallback_url':'https://www.dbs.com.sg/treasures/aics/templatedata/article/recentdevelopment/data/en/DBSV/032026/1883_HK_03172026.xml',
              'fallback_date':'2026-03-17',
              'fallback_title':'CITIC Telecom - FY25 earnings stabilise; appealing dividend yield',
              'filename':'02_DBS_CITIC_Telecom_Latest_Research_Update.pdf',
              'start_candidates':['CITIC Telecom -'],
            },
          ]

          # Use an installed Unicode-capable font when available. It also renders the Chinese note correctly.
          font_path=None
          for candidate in ['/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf','/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf']:
            if Path(candidate).exists(): font_path=candidate; break
          if font_path:
            pdfmetrics.registerFont(TTFont('BodyFont',font_path)); BODY_FONT='BodyFont'
          else: BODY_FONT='Helvetica'

          def hash_bytes(data:bytes)->str: return hashlib.sha256(data).hexdigest()

          def fetch_page(item:dict)->tuple[str,str,str,str]:
            attempts=[(item['url'],item['date'],item['title'])]
            if item.get('fallback_url'): attempts.append((item['fallback_url'],item['fallback_date'],item['fallback_title']))
            errors=[]
            for url,date,title in attempts:
              try:
                r=s.get(url,timeout=(12,45),allow_redirects=True); r.raise_for_status()
                text=r.text
                compact=re.sub(r'\s+','',BeautifulSoup(text,'lxml').get_text(' ',strip=True)).lower()
                if 'citictelecom' not in compact or len(compact)<2500:
                  raise RuntimeError(f'incomplete or irrelevant page: chars={len(compact)}')
                return text,r.url,date,title
              except Exception as exc: errors.append(f'{url}: {exc}')
            raise RuntimeError(' | '.join(errors))

          def extract_lines(page_html:str,item:dict,declared_title:str)->tuple[list[str],str]:
            soup=BeautifulSoup(page_html,'lxml')
            for tag in soup(['script','style','noscript','svg']): tag.decompose()
            raw=soup.get_text('\n',strip=True)
            lines=[]
            for x in raw.splitlines():
              line=re.sub(r'\s+',' ',x).strip()
              if line: lines.append(line)
            # Prefer the declared title; then find any CITIC Telecom title near the report body.
            start=None
            candidates=[declared_title,'CITIC Telecom'] if item['order']==1 else [declared_title,'CITIC Telecom -']
            for cand in candidates:
              for i,line in enumerate(lines):
                if line==cand or line.startswith(cand):
                  # Avoid navigation occurrence by requiring report-specific content shortly after it.
                  window=' '.join(lines[i:i+35]).lower()
                  if any(k in window for k in ['quick view','earnings','dividend','profile','results highlights','recommendation']):
                    start=i; break
              if start is not None: break
            if start is None: raise RuntimeError('could not locate report body')
            body=lines[start:]
            end=len(body)
            for i,line in enumerate(body):
              if i>30 and line in {'Useful Links','Pricing Guide','Service Fees','Contact','Markets'}:
                end=i; break
            body=body[:end]
            noise={
              'Created with Sketch.','Print','Download PDF','Have a question?','Yes, contact me','Start Now','Read More',
              'Manage your portfolio from your iWealth account','You need to enable JavaScript to run this app.',
            }
            cleaned=[]
            for line in body:
              if line in noise: continue
              if line.startswith('Image'): continue
              if cleaned and cleaned[-1]==line: continue
              cleaned.append(line)
            joined='\n'.join(cleaned)
            compact=re.sub(r'\s+','',joined).lower()
            if len(joined)<3500 or 'citictelecom' not in compact or not any(k in compact for k in ['1883','macau','ctm']):
              raise RuntimeError(f'extracted report content failed validation: chars={len(joined)}')
            # Use the actual page title if visible.
            actual_title=declared_title
            for line in cleaned[:20]:
              if line.startswith('CITIC Telecom -') or line=='CITIC Telecom':
                actual_title=line if line!='CITIC Telecom' else declared_title
                break
            return cleaned,actual_title

          styles=getSampleStyleSheet()
          styles.add(ParagraphStyle(name='ReportTitleX',fontName=BODY_FONT,fontSize=19,leading=23,spaceAfter=8,textColor=colors.HexColor('#111111')))
          styles.add(ParagraphStyle(name='H2X',fontName=BODY_FONT,fontSize=12.5,leading=15,spaceBefore=11,spaceAfter=5,textColor=colors.HexColor('#222222'),keepWithNext=True))
          styles.add(ParagraphStyle(name='BodyX',fontName=BODY_FONT,fontSize=9.4,leading=13.3,alignment=TA_JUSTIFY,spaceAfter=5.5,splitLongWords=True))
          styles.add(ParagraphStyle(name='MetaX',fontName=BODY_FONT,fontSize=8.8,leading=12,textColor=colors.HexColor('#444444'),spaceAfter=4))
          styles.add(ParagraphStyle(name='BulletX',fontName=BODY_FONT,fontSize=9.4,leading=13.2,leftIndent=11,firstLineIndent=-7,spaceAfter=4))
          styles.add(ParagraphStyle(name='SmallX',fontName=BODY_FONT,fontSize=7.7,leading=10.5,textColor=colors.HexColor('#555555')))

          heading_words={
            'Quick View','Profile','Previous Close Price','Key Statistics','Recent Developments','Our Views','Risks','Valuation',
            'Research Platform: Insights Direct','GENERAL DISCLOSURE/DISCLAIMER','RESTRICTIONS ON DISTRIBUTION',
            'FY25 Results Highlights','1H26 Results Highlights','Outlook','Related Stories','Investment Summary',
          }
          skip_exact={'CITIC Telecom - Company Guide'}

          def make_pdf(lines:list[str],item:dict,actual_title:str,actual_date:str,source_url:str,out_path:Path):
            def footer(canvas,doc):
              canvas.saveState(); canvas.setFont(BODY_FONT,7); canvas.setFillColor(colors.HexColor('#666666'))
              canvas.drawCentredString(A4[0]/2,8*mm,f'{doc.page}'); canvas.restoreState()
            doc=SimpleDocTemplate(str(out_path),pagesize=A4,rightMargin=14*mm,leftMargin=14*mm,topMargin=14*mm,bottomMargin=15*mm,
                                  title=actual_title,author='DBS Bank (Hong Kong) Limited')
            story=[]
            story.append(Paragraph(html.escape(actual_title),styles['ReportTitleX']))
            meta_data=[
              ['Broker','DBS Bank (Hong Kong) Limited / 星展银行（香港）'],
              ['Publication date',actual_date],
              ['Report type',item['kind']],
              ['Official public source',source_url],
              ['Edition note','Searchable offline export of the complete public DBS research webpage. The original-layout download may require iWealth login.'],
            ]
            tbl=Table([[Paragraph(f'<b>{html.escape(k)}</b>',styles['SmallX']),Paragraph(html.escape(v),styles['SmallX'])] for k,v in meta_data],colWidths=[36*mm,140*mm])
            tbl.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,-1),colors.HexColor('#F3F3F3')),('BOX',(0,0),(-1,-1),0.5,colors.HexColor('#BBBBBB')),('INNERGRID',(0,0),(-1,-1),0.25,colors.HexColor('#DDDDDD')),('VALIGN',(0,0),(-1,-1),'TOP'),('LEFTPADDING',(0,0),(-1,-1),5),('RIGHTPADDING',(0,0),(-1,-1),5),('TOPPADDING',(0,0),(-1,-1),4),('BOTTOMPADDING',(0,0),(-1,-1),4)]))
            story.extend([tbl,Spacer(1,8)])
            title_skipped=False
            for idx,line in enumerate(lines):
              if not title_skipped and (line==actual_title or line=='CITIC Telecom' or line in skip_exact):
                title_skipped=True; continue
              esc=html.escape(line)
              if line in heading_words or (line.isupper() and 5<=len(line)<=70):
                story.append(Paragraph(esc,styles['H2X']))
              elif line.startswith(('•','- ')):
                story.append(Paragraph('• '+html.escape(line.lstrip('•- ')),styles['BulletX']))
              elif re.match(r'^(Tsz Wang Tam|\d{1,2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) 20\d{2}|Publication Date)',line):
                story.append(Paragraph(esc,styles['MetaX']))
              elif len(line)<75 and (line.endswith(':') or line in {'Outlook','Profile','Risks','Valuation'}):
                story.append(Paragraph(esc,styles['H2X']))
              else:
                story.append(Paragraph(esc,styles['BodyX']))
            story.extend([Spacer(1,10),Paragraph('Research copyright and views belong to DBS and the named analyst(s). This file is an offline export of a publicly accessible research page and is not investment advice.',styles['SmallX'])])
            doc.build(story,onFirstPage=footer,onLaterPages=footer)

          def verify_pdf(path:Path)->dict:
            data=path.read_bytes()
            if b'%PDF' not in data[:4096] or len(data)<25000: raise RuntimeError(f'invalid PDF: {path.name}')
            reader=PdfReader(io.BytesIO(data),strict=False); pages=len(reader.pages)
            if pages<2: raise RuntimeError(f'PDF too short: {path.name} pages={pages}')
            all_text='\n'.join((p.extract_text() or '') for p in reader.pages)
            compact=re.sub(r'\s+','',all_text).lower()
            if 'citictelecom' not in compact or not any(x in compact for x in ['1883','macau','ctm']): raise RuntimeError(f'relevance failure: {path.name}')
            doc=pymupdf.open(str(path)); checks=[]
            for pno in sorted(set([0,pages//2,pages-1])):
              pix=doc.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(1.3,1.3),alpha=False)
              rp=RENDER_DIR/f'{path.stem}_p{pno+1:03d}.png'; pix.save(str(rp))
              if pix.width<500 or pix.height<650 or rp.stat().st_size<5000: raise RuntimeError(f'render failure: {path.name} p{pno+1}')
              checks.append({'page':pno+1,'file':rp.name,'width':pix.width,'height':pix.height,'bytes':rp.stat().st_size})
            doc.close()
            return {'pages':pages,'bytes':len(data),'sha256':hash_bytes(data),'checks':checks}

          records=[]
          for item in items:
            page_html,final_url,actual_date,declared_title=fetch_page(item)
            lines,actual_title=extract_lines(page_html,item,declared_title)
            if item['order']==2 and final_url==item.get('fallback_url'):
              item['kind']='Company research update (FY25 fallback)'
            out_path=PDF_DIR/item['filename']
            make_pdf(lines,item,actual_title,actual_date,final_url,out_path)
            v=verify_pdf(out_path)
            rec={
              '序号':item['order'],'文件名':out_path.name,'券商':'DBS Bank (Hong Kong) Limited / 星展银行（香港）',
              '发布日期':actual_date,'报告标题':actual_title,'报告类型':item['kind'],'页数':v['pages'],'文件大小（字节）':v['bytes'],
              '来源类型':'DBS完整公开研究网页转存为可搜索PDF','官方公开研究页面':final_url,'SHA-256':v['sha256'],'渲染核验':v['checks'],
            }
            records.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False),flush=True)

          if len(records)!=2 or len({r['SHA-256'] for r in records})!=2: raise RuntimeError('expected two distinct reports')
          manifest=OUT/'报告清单与校验值.csv'
          fields=['序号','文件名','券商','发布日期','报告标题','报告类型','页数','文件大小（字节）','来源类型','官方公开研究页面','SHA-256']
          with manifest.open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader(); w.writerows(records)
          readme=OUT/'说明.txt'
          readme.write_text(
            '中信国际电讯（01883.HK）券商公司研究资料包\n\n'
            '本包收录2份星展银行（香港）公司研究资料：一份公司指南/深度研究页，以及一份最新公司研究更新。\n\n'
            '星展官网完整研究正文可公开阅读，但原始版式PDF下载入口可能要求iWealth登录。'
            '本包据官方完整公开研究网页制作可搜索的离线PDF，不是只含一两页的预览，也不是下载脚本。'
            '文件保留官方来源地址，且已核验PDF文件头、可解析页数、公司名称及首/中/末页渲染。\n\n'
            '报告版权及观点归星展银行和相关分析师所有，仅供研究参考，不构成投资建议。\n',encoding='utf-8')
          zip_path=OUT/'CITIC_Telecom_01883_Broker_Research_2_Public_Full_PDFs.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(PDF_DIR.glob('*.pdf')): z.write(p,arcname=p.name)
            z.write(manifest,arcname=manifest.name); z.write(readme,arcname=readme.name)
          with zipfile.ZipFile(zip_path) as z:
            if z.testzip() is not None: raise RuntimeError('ZIP CRC failure')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=2: raise RuntimeError('wrong PDF count')
          summary={'zip_file':zip_path.name,'zip_bytes':zip_path.stat().st_size,'zip_sha256':hash_bytes(zip_path.read_bytes()),'reports':records}
          (OUT/'package_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PACKAGE_READY',json.dumps(summary,ensure_ascii=False),flush=True)
          PY
          python /tmp/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: citic-telecom-fast-final-package
          path: |
            output/CITIC_Telecom_01883_Broker_Research_2_Public_Full_PDFs.zip
            output/package_summary.json
            output/renders/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
