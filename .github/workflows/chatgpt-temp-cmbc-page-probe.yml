name: chatgpt-temp-cmbc-page-probe
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-cmbc-page-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe report page images
        shell: bash
        run: |
          python -m pip install --quiet requests pillow
          python <<'PY'
          import hashlib, io, json, time
          from pathlib import Path
          import requests
          from PIL import Image, ImageStat

          WORK=Path('cmbc_page_probe'); WORK.mkdir(exist_ok=True)
          reports=[
            {'id':889780,'name':'国海证券_江城新风貌多重利好共振','base':'https://oss.sdyanbao.com/page/2025/5/21/1196572','pages':26},
            {'id':857288,'name':'东北证券_区域战略打造对公业务优势','base':'https://oss.sdyanbao.com/page/2025/2/17/1149800','pages':29},
            {'id':848131,'name':'华创证券_基本面处改善通道','base':'https://oss.sdyanbao.com/page/2024/12/29/1133729','pages':22},
            {'id':870082,'name':'华泰证券_耕战略腹地强经营韧性','base':'https://oss.sdyanbao.com/page/2025/4/14/1168144','pages':28},
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8','Referer':'https://www.sdyanbao.com/'})
          out=[]
          for rep in reports:
            rdir=WORK/str(rep['id']); rdir.mkdir(exist_ok=True)
            indices=sorted(set([0,1,2,9,10,rep['pages']//2,rep['pages']-2,rep['pages']-1,rep['pages'],rep['pages']+1]))
            for idx in indices:
              url=f"{rep['base']}/{idx}.png"
              rec={'report_id':rep['id'],'name':rep['name'],'index':idx,'url':url}
              try:
                r=s.get(url,timeout=90,allow_redirects=True)
                rec.update({'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'final':r.url,'sha256':hashlib.sha256(r.content).hexdigest()})
                if r.status_code==200 and len(r.content)>1000:
                  try:
                    im=Image.open(io.BytesIO(r.content)); im.load()
                    rec.update({'format':im.format,'width':im.width,'height':im.height,'mode':im.mode,'stddev':round(float(ImageStat.Stat(im.convert('L').resize((64,64))).stddev[0]),4)})
                    path=rdir/f'{idx:03d}.{(im.format or "png").lower()}'
                    path.write_bytes(r.content); rec['file']=str(path.relative_to(WORK))
                  except Exception as e: rec['image_error']=repr(e)
              except Exception as e: rec['error']=repr(e)
              out.append(rec); print('PROBE '+json.dumps(rec,ensure_ascii=False),flush=True)
              time.sleep(.1)
          (WORK/'probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CMBC-Page-Probe
          path: cmbc_page_probe
          retention-days: 1
          compression-level: 6
