name: chatgpt-temp-avic-eastmoney-targeted
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-avic-eastmoney-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact report dates and probe public PDFs
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python <<'PY'
          import json,re,time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          W=Path('avic_eastmoney_targeted');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/javascript,*/*'})
          windows=[
            ('west','2024-12-30','2025-01-03',['中航科工','航空高科技旗舰平台','产业整合助力企业发展']),
            ('minsheng','2024-02-16','2024-02-21',['中航科工','港股唯一航空高科技产业集团','行稳致远迈向世界一流']),
            ('tianfeng','2023-03-10','2023-03-16',['中航科工','2357','航空高科技军民通用产品']),
            ('changjiang','2024-06-18','2024-06-23',['中航科工','低空经济']),
            ('huatai','2023-12-15','2023-12-21',['中航科工']),
          ]
          def parse(t):
            try:return json.loads(t)
            except:
              a=t.find('{');b=t.rfind('}')
              try:return json.loads(t[a:b+1]) if a>=0 and b>a else {}
              except:return {}
          matches=[];seen=set();logs=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          for label,begin,end,terms in windows:
            for endpoint in ['list','jg']:
              for q in range(0,9):
                page=1
                while page<=60:
                  p={'cb':'showData','pageSize':100,'pageNo':page,'qType':q,'beginTime':begin,'endTime':end,'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','ratingchange':'*','fields':'','orgCode':'','rcode':'','_':int(time.time()*1000)}
                  try:
                    r=s.get(f'https://reportapi.eastmoney.com/report/{endpoint}',params=p,timeout=60);o=parse(r.text);rows=o.get('data') or []
                    if isinstance(rows,dict):rows=rows.get('data') or rows.get('list') or []
                    if not isinstance(rows,list):rows=[]
                    total=int(o.get('TotalPage') or 0)
                    if page==1:L(f'START {label} {endpoint} q={q} rows={len(rows)} hits={o.get("hits")} total={total}')
                    for rec in rows:
                      blob=json.dumps(rec,ensure_ascii=False)
                      nblob=re.sub(r'\s+','',blob).lower()
                      score=sum(1 for t in terms if re.sub(r'\s+','',t).lower() in nblob)
                      # Company name/code is decisive, or at least two exact title phrases.
                      if ('中航科工' in blob or '02357' in blob or '2357.HK' in blob.upper()) or score>=2:
                        info=rec.get('infoCode') or rec.get('INFO_CODE') or ''
                        key=(endpoint,q,info,json.dumps(rec,sort_keys=True,ensure_ascii=False))
                        if key not in seen:
                          seen.add(key);item={'label':label,'endpoint':endpoint,'qtype':q,'page':page,'score':score,'record':rec};matches.append(item);L('MATCH '+json.dumps(item,ensure_ascii=False))
                    if not rows or page>=total:break
                    page+=1;time.sleep(.03)
                  except Exception as e:L(f'ERROR {label} {endpoint} q={q} p={page} {e!r}');break
          # Probe common full-PDF URL patterns for every unique info code.
          probes=[];seen_info=set()
          for item in matches:
            rec=item['record'];info=rec.get('infoCode') or rec.get('INFO_CODE') or ''
            if not info or info in seen_info:continue
            seen_info.add(info)
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf',f'https://pdf.dfcfw.com/pdf/{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/{info}.pdf']:
              try:
                rr=s.get(u,timeout=180,allow_redirects=True);row={'info':info,'url':u,'status':rr.status_code,'bytes':len(rr.content),'ct':rr.headers.get('content-type'),'final':rr.url}
                if rr.status_code==200 and rr.content.startswith(b'%PDF-'):
                  pth=W/f'{info}.pdf';pth.write_bytes(rr.content)
                  try:row['pages']=len(PdfReader(str(pth),strict=False).pages)
                  except Exception as e:row['pages_error']=repr(e)
                  row['pdf_file']=pth.name
                probes.append(row);L('PROBE '+json.dumps(row,ensure_ascii=False))
                if row.get('pdf_file'):break
              except Exception as e:
                row={'info':info,'url':u,'error':repr(e)};probes.append(row);L('PROBE_ERROR '+json.dumps(row,ensure_ascii=False))
          (W/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          (W/'probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          (W/'run.log').write_text('\n'.join(logs),encoding='utf-8')
          print('FINAL',json.dumps({'matches':len(matches),'unique_info_codes':len(seen_info),'valid_pdfs':sum(1 for x in probes if x.get('pdf_file'))},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AVIC-China-Eastmoney-Targeted
          path: avic_eastmoney_targeted
          retention-days: 1
          compression-level: 6
