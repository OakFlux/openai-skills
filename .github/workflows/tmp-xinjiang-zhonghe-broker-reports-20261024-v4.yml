name: Build Xinjiang Zhonghe broker deep-report package v4

on:
  push:
    branches:
      - tmp/xinjiang-zhonghe-broker-reports-20261024-v3
    paths:
      - .github/workflows/tmp-xinjiang-zhonghe-broker-reports-20261024-v4.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 trafilatura weasyprint pypdf

      - name: Build and validate package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='新疆众和_券商深度报告_3份'
          mkdir -p "$PACKAGE" /tmp/xjzh_check

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, html, re, time
          from pathlib import Path
          import requests, trafilatura
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from weasyprint import HTML

          OUT=Path('新疆众和_券商深度报告_3份')
          s=requests.Session(); s.trust_env=False
          retry=Retry(total=6,connect=6,read=6,status=6,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'],raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry,pool_connections=6,pool_maxsize=6))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5'})

          def fetch(url, *, accept='*/*', referer=None):
              last=None
              for i in range(6):
                  try:
                      h={'Accept':accept}
                      if referer: h['Referer']=referer
                      r=s.get(url,headers=h,timeout=(25,240),allow_redirects=True)
                      last=r
                      if r.status_code==200: return r
                  except Exception as e: last=e
                  time.sleep(1+i)
              raise RuntimeError(f'Fetch failed: {url}; last={last!r}')

          # Original 42-page East Asia Qianhai Securities report.
          original_url='https://pdf.dfcfw.com/pdf/H3_AP202208231577519189_1.pdf'
          r=fetch(original_url,accept='application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',referer='https://data.eastmoney.com/')
          if not r.content.startswith(b'%PDF-') or len(r.content)<100000:
              raise RuntimeError(f'Bad original PDF: {r.status_code}, {len(r.content)}, {r.headers.get("content-type")}')
          original=OUT/'01_东亚前海证券_首次覆盖_多业务领跑行业布局高端产品成利润增长点_原始PDF_2022-08-24.pdf'
          original.write_bytes(r.content)
          pages=len(PdfReader(str(original),strict=False).pages)
          if pages!=42: raise RuntimeError(f'Expected 42 pages, got {pages}')
          print('ORIGINAL',original.name,len(r.content),pages)

          def decode_response(resp):
              raw=resp.content
              ctype=(resp.headers.get('content-type') or '').lower()
              if any(x in ctype for x in ('gbk','gb2312','gb18030')):
                  return raw.decode('gb18030',errors='replace')
              for enc in ('utf-8','gb18030'):
                  try:
                      t=raw.decode(enc)
                      if t.count('\ufffd')<8: return t
                  except Exception: pass
              return raw.decode('utf-8',errors='replace')

          def clean(text):
              text=text.replace('\u3000',' ').replace('\xa0',' ')
              text=re.sub(r'\r\n?','\n',text)
              text=re.sub(r'[ \t]+',' ',text)
              out=[]; seen=set()
              noise={'首页','登录','注册','举报','查看详情','立即下载','返回顶部','相关深度报告REPORTS','相关深度报告'}
              for x in text.split('\n'):
                  x=x.strip(' |\t-')
                  if not x or x in noise: continue
                  if len(x)<=20 and x in seen: continue
                  if len(x)<=20: seen.add(x)
                  out.append(x)
              return '\n'.join(out).strip()

          def extract_one(url, required, minimum):
              resp=fetch(url,accept='text/html,application/xhtml+xml,*/*;q=0.8',referer='https://www.baidu.com/')
              source=decode_response(resp)
              text=trafilatura.extract(source,include_comments=False,include_tables=True,favor_recall=True,output_format='txt') or ''
              text=clean(text)
              if len(text)<minimum or not all(k in text for k in required):
                  soup=BeautifulSoup(source,'html.parser')
                  for tag in soup(['script','style','noscript','svg','nav','footer','form']): tag.decompose()
                  candidates=[]
                  for tag in soup.find_all(['article','main','section','div']):
                      t=clean(tag.get_text('\n',strip=True))
                      if len(t)>=minimum and all(k in t for k in required): candidates.append(t)
                  text=min(candidates,key=len) if candidates else clean(soup.get_text('\n',strip=True))
              if len(text)<minimum or not all(k in text for k in required):
                  raise RuntimeError(f'Insufficient text: {url}; chars={len(text)}')
              return text, resp.url

          def extract_first(urls,required,minimum):
              errs=[]
              for u in urls:
                  try:
                      t,f=extract_one(u,required,minimum)
                      print('TEXT',u,'FINAL',f,'CHARS',len(t)); return t,f
                  except Exception as e: errs.append(f'{u}: {e!r}')
              raise RuntimeError('\n'.join(errs))

          def blocks(text):
              items=re.split(r'\n\s*\n',text)
              if len(items)<3: items=text.split('\n')
              out=[]
              for item in items:
                  item=item.strip()
                  if not item: continue
                  if len(item)<=650: out.append(item); continue
                  buf=''
                  for part in re.split(r'(?<=[。！？；])',item):
                      if len(buf)+len(part)>580 and buf:
                          out.append(buf.strip()); buf=part
                      else: buf+=part
                  if buf.strip(): out.append(buf.strip())
              return out

          def render(filename,title,broker,analysts,date,original_pages,source,text):
              parts=[]
              for b in blocks(text):
                  esc=html.escape(b).replace('\n','<br>')
                  if re.match(r'^(第[一二三四五六七八九十]+[章节]|[一二三四五六七八九十]+[、.]|\d+(?:\.\d+)*[、. ])',b): parts.append(f'<h2>{esc}</h2>')
                  else: parts.append(f'<p>{esc}</p>')
              doc=f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
              @page{{size:A4;margin:17mm 16mm 19mm;@bottom-center{{content:counter(page);font-size:9pt;color:#666}}}}
              body{{font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif;color:#111;font-size:10.3pt;line-height:1.68}}
              h1{{font-size:18pt;line-height:1.35;margin:0 0 8mm}}h2{{font-size:13pt;line-height:1.45;margin:6mm 0 3mm;page-break-after:avoid}}
              .meta{{border-top:1px solid #555;border-bottom:1px solid #aaa;padding:3mm 0;margin-bottom:5mm;font-size:9.2pt;line-height:1.65}}
              .notice{{background:#f1f1f1;border-left:3px solid #777;padding:3mm 4mm;margin-bottom:6mm;font-size:9pt}}
              p{{margin:0 0 3.8mm;text-align:justify;orphans:3;widows:3}}.source{{border-top:1px solid #bbb;padding-top:4mm;word-break:break-all;font-size:8.5pt;color:#555;margin-top:8mm}}
              </style></head><body><h1>{html.escape(title)}</h1>
              <div class="meta">券商：{html.escape(broker)}<br>分析师：{html.escape(analysts)}<br>发布日期：{date}<br>原始报告标称页数：{original_pages}<br>本文件版本：公开全文导出版</div>
              <div class="notice">本文件根据公开可访问的研究报告全文页面重新排版生成，不是券商客户端原始附件PDF。研究观点未作实质改写；原版图表可能不完整。</div>
              {''.join(parts)}<div class="source">公开全文来源：{html.escape(source)}<br>资料仅供研究参考，不构成投资建议。</div></body></html>'''
              path=OUT/filename; HTML(string=doc,base_url=source).write_pdf(path); print('RENDERED',path.name,path.stat().st_size)

          east_text,east_source=extract_first([
              'https://www.vzkoo.com/read/202308035a2ef4b2897a87ce3c2b1345.html',
              'https://www.nxny.com/report/view_5362861.html'],['新疆众和','东方证券','电极箔'],1500)
          render('02_东方证券_被低估的电极箔一体化龙头_公开全文导出版_2023-08-01.pdf','新疆众和：被低估的电极箔一体化龙头','东方证券','刘洋、李一冉','2023-08-01','34页',east_source,east_text)

          sw_text,sw_source=extract_first([
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/812305320242/index.phtml',
              'https://www.sdyanbao.com/detail/922882',
              'https://www.sgpjbg.com.cn/bgdown/925460.html'],['新疆众和','氧化铝'],800)
          render('03_申万宏源_铝电子材料一体化完备氧化铝项目有望增厚利润_公开全文导出版_2025-09-27.pdf','新疆众和：铝电子材料一体化完备，氧化铝项目有望增厚利润','申万宏源','郭中伟、马焰明、陈松涛','2025-09-27','32页',sw_source,sw_text)

          for p in sorted(OUT.glob('*.pdf')): print('FILE',p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 70000
            set +e; qpdf --check "$pdf" >"$pdf.check" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.check"; exit "$rc"; fi
            rm -f "$pdf.check"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 2
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "/tmp/xjzh_check/$(basename "$pdf").first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "/tmp/xjzh_check/$(basename "$pdf").last" >/dev/null 2>&1
            test -s "/tmp/xjzh_check/$(basename "$pdf").first.png" && test -s "/tmp/xjzh_check/$(basename "$pdf").last.png"
            pdftotext "$pdf" "$pdf.txt" || true
            grep -Eq '新疆众和|众和' "$pdf.txt"
            rm -f "$pdf.txt"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          test "$(pdfinfo "$PACKAGE/01_东亚前海证券_首次覆盖_多业务领跑行业布局高端产品成利润增长点_原始PDF_2022-08-24.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 42

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          folder=Path('新疆众和_券商深度报告_3份')
          meta={
          '01_东亚前海证券_首次覆盖_多业务领跑行业布局高端产品成利润增长点_原始PDF_2022-08-24.pdf':('东亚前海证券','2022-08-24','首次覆盖：多业务领跑行业，布局高端产品成利润增长点','公开原始PDF','https://pdf.dfcfw.com/pdf/H3_AP202208231577519189_1.pdf'),
          '02_东方证券_被低估的电极箔一体化龙头_公开全文导出版_2023-08-01.pdf':('东方证券','2023-08-01','被低估的电极箔一体化龙头','公开全文导出版；原报告标称34页','https://www.vzkoo.com/read/202308035a2ef4b2897a87ce3c2b1345.html'),
          '03_申万宏源_铝电子材料一体化完备氧化铝项目有望增厚利润_公开全文导出版_2025-09-27.pdf':('申万宏源','2025-09-27','铝电子材料一体化完备，氧化铝项目有望增厚利润','公开全文导出版；原报告标称32页','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/812305320242/index.phtml')}
          lines=['新疆众和（600888）券商深度报告资料包','整理日期：2026-10-24','','版本说明：','1. 东亚前海证券报告为公开原始PDF。','2. 东方证券、申万宏源报告由公开全文页面重新排版生成，已明确标注“公开全文导出版”，不是券商客户端原始附件。','3. 导出版保留公开可取得的正文，原版图表可能不完整。','4. 资料仅供研究参考，不构成投资建议。','','文件清单：']
          sums=[]; total_pages=0; total_bytes=0
          for pdf in sorted(folder.glob('*.pdf')):
              broker,date,title,kind,source=meta[pdf.name]; data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace'); pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              total_pages+=pages; total_bytes+=len(data)
              lines += [f'- {pdf.name}',f'  券商：{broker}；日期：{date}；类型：{kind}；当前文件页数：{pages}',f'  标题：{title}',f'  公开来源：{source}',f'  SHA-256：{sha}']
              sums.append(f'{sha}  {pdf.name}')
          lines += ['',f'合计当前文件页数：{total_pages}页。',f'PDF合计大小：{total_bytes}字节。','全部PDF均通过文件头、大小、结构、公司名称、页数及首末页渲染检查；压缩包已通过完整解压测试。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Xinjiang-Zhonghe-600888-broker-deep-reports-3-v4
          path: 新疆众和_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
