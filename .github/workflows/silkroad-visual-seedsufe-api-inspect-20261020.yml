name: Inspect Seedsufe API for Silkroad Visual reports 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-seedsufe-api-inspect-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright requests
          python -m playwright install chromium

      - name: Inspect preview and search APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import re
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--no-sandbox'])
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
                      locale='zh-CN',
                      viewport={'width': 1440, 'height': 1000},
                  )
                  page = await context.new_page()
                  entries = []

                  async def on_response(resp):
                      try:
                          req = resp.request
                          url = resp.url
                          ct = (resp.headers.get('content-type') or '').lower()
                          blob = (url + ' ' + ct).lower()
                          if any(k in blob for k in ['api','getfiledetail','search','file','report','preview','1028589','seedsufe']):
                              item = {
                                  'status': resp.status,
                                  'url': url,
                                  'content_type': ct,
                                  'method': req.method,
                                  'post_data': req.post_data,
                                  'request_headers': req.headers,
                              }
                              if resp.status == 200 and ('json' in ct or 'text' in ct or 'javascript' in ct):
                                  try:
                                      item['body'] = (await resp.text())[:100000]
                                  except Exception as exc:
                                      item['body_error'] = repr(exc)
                              entries.append(item)
                      except Exception as exc:
                          print('RESPONSE_CAPTURE_ERROR', repr(exc))

                  page.on('response', lambda resp: asyncio.create_task(on_response(resp)))
                  print('OPEN_PREVIEW')
                  try:
                      await page.goto('https://report.seedsufe.com/preview/1028589', wait_until='domcontentloaded', timeout=60000)
                  except Exception as exc:
                      print('PREVIEW_GOTO_ERROR', repr(exc), page.url)
                  await page.wait_for_timeout(15000)
                  print('PREVIEW_URL', page.url, 'TITLE', await page.title())
                  try:
                      print('PREVIEW_BODY', re.sub(r'\s+',' ',(await page.locator('body').inner_text())[:15000]))
                  except Exception as exc:
                      print('PREVIEW_BODY_ERROR', repr(exc))
                  print('CAPTURED_PREVIEW', json.dumps(entries, ensure_ascii=False))

                  # Visit home/search pages and inspect DOM for search controls.
                  for home in ['https://report.seedsufe.com/', 'https://report.seedsufe.com/search', 'https://report.seedsufe.com/index']:
                      entries.clear()
                      print('\nOPEN_HOME', home)
                      try:
                          await page.goto(home, wait_until='domcontentloaded', timeout=60000)
                          await page.wait_for_timeout(8000)
                          print('HOME_URL', page.url, 'TITLE', await page.title())
                          body = re.sub(r'\s+',' ',(await page.locator('body').inner_text())[:12000])
                          print('HOME_BODY', body)
                          inputs = await page.locator('input').evaluate_all("els=>els.map((e,i)=>({i,type:e.type,placeholder:e.placeholder,name:e.name,id:e.id,value:e.value,outer:e.outerHTML.slice(0,500)}))")
                          buttons = await page.locator('button,a').evaluate_all("els=>els.map((e,i)=>({i,tag:e.tagName,text:(e.innerText||'').trim(),href:e.href||'',outer:e.outerHTML.slice(0,500)})).filter(x=>x.text||x.href)")
                          print('INPUTS', json.dumps(inputs, ensure_ascii=False))
                          print('BUTTONS', json.dumps(buttons[:300], ensure_ascii=False))
                          print('HOME_CAPTURED', json.dumps(entries, ensure_ascii=False))
                      except Exception as exc:
                          print('HOME_ERROR', home, repr(exc), page.url)

                  # Try search engine route patterns directly in the app.
                  queries = ['丝路视觉', '以技术呈现创意 用数字定义视界', '丝路视觉 以技术呈现创意 用数字定义视界']
                  routes = [
                      'https://report.seedsufe.com/search?keyword={q}',
                      'https://report.seedsufe.com/search?q={q}',
                      'https://report.seedsufe.com/?keyword={q}',
                      'https://report.seedsufe.com/?q={q}',
                  ]
                  from urllib.parse import quote
                  for query in queries:
                      for route in routes:
                          url = route.format(q=quote(query))
                          entries.clear()
                          print('\nOPEN_QUERY', query, url)
                          try:
                              await page.goto(url, wait_until='domcontentloaded', timeout=60000)
                              await page.wait_for_timeout(8000)
                              print('QUERY_URL', page.url, 'TITLE', await page.title())
                              body = re.sub(r'\s+',' ',(await page.locator('body').inner_text())[:15000])
                              print('QUERY_BODY', body)
                              print('QUERY_CAPTURED', json.dumps(entries, ensure_ascii=False))
                          except Exception as exc:
                              print('QUERY_ERROR', repr(exc), page.url)

                  await browser.close()

          asyncio.run(main())
          PY
