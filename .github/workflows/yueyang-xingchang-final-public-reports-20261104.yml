name: Build Yueyang Xingchang verified public broker reports 20261104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yueyang-xingchang-final-public-reports-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '000819'
          PACKAGE = '岳阳兴长_000819_券商研究报告_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for directory in (ROOT, PDFDIR, PREV):
              directory.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '中邮证券',
                  'date': '2022-09-18',
                  'title': '业绩符合预期，高端聚烯烃项目明年投产',
                  'classification': '公司首次覆盖报告',
                  'analysts': '钟浩',
                  'rating': '买入',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202209181578487364_1.pdf',
                  'source_page': 'https://data.eastmoney.com/report/info/AP202209181578487364.html',
                  'min_pages': 5,
                  'identity_tokens': ['岳阳兴长', '000819'],
                  'broker_tokens': ['中邮证券'],
                  'title_tokens': ['业绩符合预期', '高端聚烯烃项目明年投产'],
              },
              {
                  'broker': '中邮证券',
                  'date': '2022-10-27',
                  'title': 'Q3业绩符合预期，高端聚烯烃项目一期明年投产',
                  'classification': '公司跟踪研究报告',
                  'analysts': '钟浩',
                  'rating': '原报告未列明',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202210271579553053_1.pdf',
                  'source_page': 'https://data.eastmoney.com/report/info/AP202210271579553053.html',
                  'min_pages': 5,
                  'identity_tokens': ['岳阳兴长', '000819'],
                  'broker_tokens': ['中邮证券'],
                  'title_tokens': ['Q3业绩符合预期', '高端聚烯烃项目一期明年投产'],
              },
              {
                  'broker': '国联证券',
                  'date': '2023-06-25',
                  'title': '惠州项目即将投产，茂金属催化剂平台持续成长',
                  'classification': '公司跟踪研究报告',
                  'analysts': '柴沁虎',
                  'rating': '买入（维持）',
                  'url': 'https://file.iyanbao.com/pdf/e0e5c-18eefe2a-5daa-4a7e-90d5-97ed2704e72a.pdf',
                  'source_page': 'https://www.fxbaogao.com/detail/4093448',
                  'min_pages': 3,
                  'identity_tokens': ['岳阳兴长', '000819'],
                  'broker_tokens': ['国联证券'],
                  'title_tokens': ['惠州项目即将投产', '茂金属催化剂平台持续成长'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          user_agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-Za-z\u4e00-\u9fff]+', '', value or '').lower()

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:120]

          manifest = []
          for index, report in enumerate(reports, 1):
              attempts = []
              data = None
              for attempt in range(5):
                  try:
                      referer = 'https://data.eastmoney.com/report/'
                      if 'iyanbao.com' in report['url']:
                          referer = 'https://www.iyanbao.com/'
                      response = session.get(
                          report['url'],
                          headers={
                              'User-Agent': user_agent,
                              'Referer': referer,
                              'Accept': 'application/pdf,*/*;q=0.8',
                              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                          },
                          timeout=(30, 420),
                          allow_redirects=True,
                      )
                      attempts.append({
                          'attempt': attempt + 1,
                          'status': response.status_code,
                          'bytes': len(response.content),
                          'content_type': response.headers.get('content-type', ''),
                          'final_url': response.url,
                      })
                      if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 80000:
                          data = response.content
                          break
                      if response.status_code in (400, 401, 403, 404, 410):
                          break
                  except Exception as exc:
                      attempts.append({'attempt': attempt + 1, 'error': repr(exc)})
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'Download failed for {report["title"]}: {attempts}')

              filename = f"{index:02d}_{safe(report['broker'])}_岳阳兴长_{safe(report['title'])}_{report['date']}.pdf"
              destination = PDFDIR / filename
              destination.write_bytes(data)
              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(30, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = normalize(text)
              identity_hits = [token for token in report['identity_tokens'] if normalize(token) in compact]
              broker_hits = [token for token in report['broker_tokens'] if normalize(token) in compact]
              title_hits = [token for token in report['title_tokens'] if normalize(token) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch in {filename}')
              if len(compact) > 500 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch in {filename}')
              if len(compact) > 500 and not title_hits:
                  raise RuntimeError(f'Title mismatch in {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview_prefix = PREV / destination.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed for {filename}')

              sha256 = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'classification': report['classification'],
                  'analysts': report['analysts'],
                  'rating': report['rating'],
                  'source_page': report['source_page'],
                  'source_url': report['url'],
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha256,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'title_hits': title_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'broker identity', 'report title',
                      'page count', 'qpdf structure', 'first-page render',
                  ],
              })
              print('VERIFIED', report['broker'], report['title'], pages, len(data), sha256)

          total_pages = sum(item['actual_pages'] for item in manifest)
          readme = [
              '岳阳兴长石化股份有限公司（000819.SZ）券商研究报告资料包',
              '整理日期：2026-11-04', '',
              '本包收录3份公开可直接下载并完成完整性核验的券商原始PDF：1份首次覆盖报告、2份公司后续跟踪研究。',
              '公开渠道可检索到国联证券2022年10月31日的24页公司深度报告《炼化精细化工龙头，短期重点关注特种聚丙烯》，但其公开页面未提供无需登录即可取得的完整原始PDF，且公开预览不完整。因此本包未使用残缺预览页冒充完整报告。',
              '未使用行业周报或网页摘要凑数。', '',
          ]
          for position, item in enumerate(manifest, 1):
              readme += [
                  f'{position}. {item["broker"]}：《{item["title"]}》',
                  f'   日期：{item["date"]}；类型：{item["classification"]}',
                  f'   分析师：{item["analysts"]}；评级：{item["rating"]}',
                  f'   完整页数：{item["actual_pages"]}页；文件：{item["filename"]}',
                  f'   来源页面：{item["source_page"]}',
                  f'   PDF来源：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、报告标题、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip, 'r') as archive:
              bad_member = archive.testzip()
              pdf_members = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_member or len(pdf_members) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad_member}, pdf_count={len(pdf_members)}')

          english_zip = Path('yueyang_xingchang_000819_broker_research_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          final_sha = hashlib.sha256(chinese_zip.read_bytes()).hexdigest()
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', final_sha)
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: yueyang-xingchang-000819-public-broker-reports-final
          path: |
            岳阳兴长_000819_券商研究报告_3份.zip
            yueyang_xingchang_000819_broker_research_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
