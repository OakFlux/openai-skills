name: Package Makeng Mining 601123 official filings v4

on:
  push:
    paths:
      - '.github/workflows/makeng-mining-601123-official-filings-20261104-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'
      - name: Download and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, os, re, shutil, time, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import fitz, requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE='601123'
          COMPANY='马矿股份'
          FULL='福建马坑矿业股份有限公司'
          LISTING='2026-09-01'
          CUTOFF='2026-11-04'
          COMPACT='20261104'
          ROOT_NAME=f'{COMPANY}_{CODE}_上市以来全部年报_招股说明书及最新季报_附IPO审计报告_截至{COMPACT}'
          ROOT=Path('work')/ROOT_NAME
          NOTE=ROOT/'00_年报情况说明'
          PROS=ROOT/'01_招股说明书'
          AUDIT=ROOT/'02_IPO财务报告及审计报告'
          QUARTER=ROOT/'03_最新季度报告'
          PREVIEW=ROOT/'首页预览'
          DIST=Path('dist')
          for p in (NOTE,PROS,AUDIT,QUARTER,PREVIEW,DIST): p.mkdir(parents=True,exist_ok=True)

          s=requests.Session()
          retry=Retry(total=3,connect=3,read=3,status=3,backoff_factor=.7,status_forcelist=(408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)
          s.mount('https://',HTTPAdapter(max_retries=retry)); s.mount('http://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Connection':'close'})

          docs=[
            {
              'type':'prospectus','title':'首次公开发行股票并在主板上市招股说明书','date':'2026-08-27',
              'dest':PROS/'2026_马矿股份_首次公开发行股票并在主板上市招股说明书.pdf','min_pages':250,'term':'招股说明书',
              'urls':[
                ('http://pdffile.qianlong.com.cn:21380/NoticeFile/SH/Stock/2026-08-27/601123_20260827_KVSF.pdf','正式发行版公开镜像，文件标识与上交所公告一致'),
                ('https://static.sse.com.cn/stock/disclosure/announcement/c/202605/002132_20260529_ZFLM.pdf','上交所注册稿备用版本')
              ]
            },
            {
              'type':'ipo_audit_report','title':'发行人最近三年的财务报告和审计报告（2023—2025年度）','date':'2026-05-29',
              'dest':AUDIT/'2023-2025_马矿股份_财务报告及审计报告.pdf','min_pages':100,'term':None,
              'urls':[('https://static.sse.com.cn/stock/disclosure/announcement/c/202605/002132_20260529_OB7W.pdf','上交所IPO注册稿配套审计报告')]
            },
            {
              'type':'quarterly_report','title':'2026年第三季度报告','date':'2026-10-28',
              'dest':QUARTER/'2026Q3_马矿股份_2026年第三季度报告.pdf','min_pages':5,'term':'第三季度报告',
              'urls':[
                ('http://pdffile.qianlong.com.cn:21380/NoticeFile/SH/Stock/2026-10-28/601123_20261028_64RN.pdf','季度报告公开镜像，文件标识与上交所公告一致'),
                ('https://www.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-28/601123_20261028_64RN.pdf','上交所公告原文'),
                ('http://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-28/601123_20261028_64RN.pdf','上交所公告原文')
              ]
            }
          ]

          def inspect(data,min_pages,term):
            if len(data)<50000 or not data.startswith(b'%PDF'): raise ValueError(f'not pdf size={len(data)} head={data[:20]!r}')
            reader=PdfReader(io.BytesIO(data),strict=False)
            if reader.is_encrypted: reader.decrypt('')
            pages=len(reader.pages)
            if pages<min_pages: raise ValueError(f'pages {pages} < {min_pages}')
            idx=list(range(min(35,pages)))
            if pages>35: idx.extend(range(max(35,pages-5),pages))
            text=''
            for i in sorted(set(idx)):
              try: text+=reader.pages[i].extract_text() or ''
              except Exception: pass
            compact=re.sub(r'\s+','',text)
            if CODE not in compact and COMPANY not in compact and FULL not in compact: raise ValueError('company identity missing')
            if term and re.sub(r'\s+','',term) not in compact: raise ValueError(f'term missing: {term}')
            return pages

          def obtain(doc):
            errors=[]
            for url,note in doc['urls']:
              for referer in ('https://www.sse.com.cn/','https://act.ql18.com.cn/',None):
                try:
                  headers={'Referer':referer} if referer else {}
                  r=s.get(url,headers=headers,timeout=180,allow_redirects=True)
                  print('TRY',doc['type'],r.status_code,len(r.content),url,'referer=',referer,'->',r.url)
                  if r.status_code!=200: raise ValueError(f'status {r.status_code}')
                  pages=inspect(r.content,doc['min_pages'],doc['term'])
                  return r.content,url,r.url,note,pages
                except Exception as e:
                  errors.append(f'{url} [{referer}]: {e!r}')
                  print('FAIL',errors[-1]); time.sleep(.2)
            raise RuntimeError('all sources failed: '+' | '.join(errors))

          records=[]
          prospectus_version='正式发行版'
          for doc in docs:
            data,source,resolved,note,pages=obtain(doc)
            dest=Path(doc['dest'])
            if doc['type']=='prospectus' and 'ZFLM' in source:
              prospectus_version='注册稿备用版'
              dest=dest.with_name(dest.stem+'_注册稿备用版.pdf')
            dest.write_bytes(data)
            pdf=fitz.open(dest)
            if pdf.page_count!=pages: raise RuntimeError('parser page mismatch: '+str(dest))
            first=pdf.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
            last=pdf.load_page(pdf.page_count-1).get_pixmap(matrix=fitz.Matrix(.8,.8),alpha=False)
            if min(first.width,first.height,last.width,last.height)<100: raise RuntimeError('render failed: '+str(dest))
            first.save(PREVIEW/f'{dest.stem}.png'); pdf.close()
            rec={'document_type':doc['type'],'title':doc['title'],'date':doc['date'],'source_url':source,'resolved_url':resolved,'source_note':note,'relative_path':str(dest.relative_to(ROOT)).replace(os.sep,'/'),'file_name':dest.name,'file_size_bytes':dest.stat().st_size,'page_count':pages,'sha256':hashlib.sha256(data).hexdigest(),'pdf_header_valid':True,'first_page_rendered':True,'last_page_rendered':True,'company_identity_validated':True}
            records.append(rec); print('VERIFIED',json.dumps(rec,ensure_ascii=False))

          note=[
            '# 马矿股份（601123）年度报告情况说明','',
            f'- 公司于 **{LISTING}** 在上海证券交易所主板上市。',
            f'- 截至 **{CUTOFF}**，尚未进入首个上市公司年度报告披露期，因此上市以来已披露年度报告为 **0份**。',
            '- 为补充年度财务资料，本包收录IPO申报文件中的《发行人最近三年的财务报告和审计报告》，覆盖 **2023—2025年度**。',
            '- IPO审计报告不等同于上市公司定期年度报告。',
            f'- 招股说明书版本：{prospectus_version}。','- 最新季报：2026年第三季度报告。'
          ]
          (NOTE/'年报情况说明.md').write_text('\n'.join(note)+'\n',encoding='utf-8')
          manifest={'company':COMPANY,'full_company_name':FULL,'stock_code':CODE,'market':'上海证券交易所主板','listing_date':LISTING,'cutoff_date':CUTOFF,'listed_company_annual_report_count':0,'supplementary_audited_years':[2023,2024,2025],'prospectus_version':prospectus_version,'latest_quarter':'2026Q3','document_count':len(records),'documents':records,'generated_at_utc':datetime.now(timezone.utc).isoformat()}
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records)+'\n',encoding='utf-8')
          readme=[f'# {COMPANY}（{CODE}）官方披露文件包','',f'- 截止日期：{CUTOFF}',f'- 上市日期：{LISTING}','- 上市以来年度报告：0份（尚未进入首个年报披露期）。',f'- 招股说明书：1份（{prospectus_version}）。','- IPO财务报告及审计报告：1份，覆盖2023—2025年度。','- 最新季度报告：2026年第三季度报告。','- 已完成PDF文件头、双解析器页数、公司与文档类型身份、首末页渲染、SHA-256及ZIP CRC校验。','','## 文件清单','']
          for i,r in enumerate(records,1): readme += [f"{i}. `{r['relative_path']}`",f"   - 标题：{r['title']}",f"   - 日期：{r['date']}",f"   - 页数：{r['page_count']}；大小：{r['file_size_bytes']:,}字节",f"   - 来源：{r['source_url']}",f"   - SHA-256：`{r['sha256']}`"]
          (ROOT/'README.md').write_text('\n'.join(readme)+'\n',encoding='utf-8')

          cn=DIST/f'{ROOT_NAME}.zip'; en=DIST/f'makeng_mining_601123_prospectus_audited_financials_latest_quarter_{COMPACT}.zip'
          with zipfile.ZipFile(cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,str(p.relative_to(ROOT.parent)).replace(os.sep,'/'))
          shutil.copy2(cn,en)
          for p in (cn,en):
            with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise RuntimeError(f'CRC error {bad}')
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('PDF count mismatch')
            print('ZIP_VERIFIED',p,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          print('FINAL_JSON',json.dumps({'annual_report_count':0,'audited_years':[2023,2024,2025],'prospectus_version':prospectus_version,'latest_quarter':'2026Q3','document_count':len(records),'total_pages':sum(r['page_count'] for r in records),'chinese_zip':str(cn),'english_zip':str(en),'zip_size':cn.stat().st_size,'zip_sha256':hashlib.sha256(cn.read_bytes()).hexdigest(),'records':records},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-mining-601123-official-filings-20261104-v4
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
