name: AVIC XAC 000768 Official Filings Package

on:
  push:
    branches:
      - chatgpt-avic-xac-000768-filings-20260927
    paths:
      - .github/workflows/avic_xac_000768_filings_20260927.yml
      - scripts/build_avic_xac_000768_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, render, and package reports
        run: python scripts/build_avic_xac_000768_filings.py

      - name: List package files
        run: find output_avic_xac -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: avic-xac-000768-official-filings-package
          path: |
            output_avic_xac/中航西飞_000768_2020-2025年报及2026年第一季度报告.zip
            output_avic_xac/BUILD_SUMMARY.json
            output_avic_xac/verification/contact_sheet.jpg
          retention-days: 1
