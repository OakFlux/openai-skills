name: Probe KXJSKT Wuhan Fingu reports 20261022

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kx_wuhan_fingu_probe_20261022.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet selenium requests beautifulsoup4 lxml
      - name: Inspect page network and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os, re, time, urllib.parse, requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          url='https://www.kxjskt.com/wap/news/index.html'
          opts=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1920,3000','--lang=zh-CN','--ignore-certificate-errors']:
              opts.add_argument(a)
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36')
          opts.set_capability('goog:loggingPrefs',{'performance':'ALL','browser':'ALL'})
          d=webdriver.Chrome(options=opts); d.set_page_load_timeout(60)
          d.get(url); time.sleep(10)
          print('TITLE',d.title,'URL',d.current_url)
          src=d.page_source
          open('out/page.html','w',encoding='utf-8').write(src)
          d.save_screenshot('out/page.png')
          dom=[]
          for sel,attr in [('a','href'),('script','src'),('link','href'),('img','src'),('iframe','src'),('button','data-url')]:
              for e in d.find_elements(By.CSS_SELECTOR,sel):
                  v=e.get_attribute(attr)
                  if v: dom.append({'tag':sel,'attr':attr,'url':v,'text':(e.text or '')[:500],'outer':e.get_attribute('outerHTML')[:1000]})
          json.dump(dom,open('out/dom.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          perf=[]
          for item in d.get_log('performance'):
              try:
                  msg=json.loads(item['message'])['message']; method=msg.get('method'); p=msg.get('params',{}); obj=p.get('request') or p.get('response') or {}; u=obj.get('url')
                  if u: perf.append({'method':method,'url':u,'status':obj.get('status'),'mimeType':obj.get('mimeType')})
              except: pass
          json.dump(perf,open('out/network.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('DOM',len(dom),'NETWORK',len(perf))
          for x in dom:
              text=(x.get('text') or '')+' '+(x.get('url') or '')
              if any(k.lower() in text.lower() for k in ['pdf','download','report','研报','api','json']): print('DOMCAND',json.dumps(x,ensure_ascii=False))
          for x in perf:
              u=x['url']
              if any(k in u.lower() for k in ['api','json','pdf','report','download','news']): print('NETCAND',json.dumps(x,ensure_ascii=False))
          cookies={c['name']:c['value'] for c in d.get_cookies()}; d.quit()

          s=requests.Session(); s.trust_env=False; s.cookies.update(cookies)
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':url}
          scripts=[x['url'] for x in dom if x['tag']=='script' and x['url']]
          for i,u in enumerate(scripts):
              try:
                  r=s.get(u,headers=h,timeout=(15,60)); text=r.text
                  open(f'out/script_{i}.js','w',encoding='utf-8',errors='replace').write(text)
                  print('SCRIPT',i,r.status_code,len(r.content),u)
                  for pat in ['fetch(', 'axios', '/api/', '.pdf', 'download', 'report', 'stockCode', 'search']:
                      if pat.lower() in text.lower():
                          print('SCRIPT_HIT',i,pat)
                  urls=sorted(set(re.findall(r'https?://[^\s"\'`<>]+|/[A-Za-z0-9_./?=&%-]*(?:api|report|pdf|download|search)[A-Za-z0-9_./?=&%-]*',text,re.I)))
                  for v in urls[:300]: print('SCRIPT_URL',i,v[:1000])
              except Exception as e: print('SCRIPTERR',i,u,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kx-wuhan-fingu-probe
          path: out
          retention-days: 3
          if-no-files-found: error
