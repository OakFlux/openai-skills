name: Build Zhongjing Technology 003026 broker reports package 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zhongjing-003026-broker-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          STOCK_CODE='003026'
          COMPANY='中晶科技'
          COMPANY_FULL='浙江中晶科技股份有限公司'
          AS_OF='2026-10-28'
          PACKAGE='中晶科技_003026_券商深度与首次覆盖报告_完整版_截至20261028'
          ROOT=Path(PACKAGE)
          PDF_DIR=ROOT/'PDF原文'
          PREVIEW_DIR=ROOT/'首页预览'
          PDF_DIR.mkdir(parents=True,exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True,exist_ok=True)

          session=requests.Session(); session.trust_env=False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api='https://reportapi.eastmoney.com/report/list'
          rows=[]
          for page in range(1,10):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
                  'ratingChange':'*','beginTime':'2010-01-01','endTime':'2030-12-31',
                  'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':STOCK_CODE,
                  'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)
              }
              r=session.get(api,params=params,timeout=(20,120)); r.raise_for_status()
              d=r.json(); batch=d.get('data') or []
              print('INDEX_PAGE',page,'HITS',d.get('hits'),'ROWS',len(batch))
              if not batch: break
              rows.extend(batch)
              if len(batch)<100: break

          fallback=[
              {
                  'title':'公司首次覆盖报告：国产硅片龙头，前景可期',
                  'stockName':COMPANY,'stockCode':STOCK_CODE,'orgName':'开源证券股份有限公司','orgSName':'开源证券',
                  'publishDate':'2022-02-11 00:00:00.000','infoCode':'AP202202111546341099',
                  'attachPages':18,'attachSize':None,'emRatingName':'买入','sRatingName':'买入（首次）','researcher':'刘翔,罗通',
                  'column':'002004001002','reportType':2,
              },
              {
                  'title':'动态点评：深耕小尺寸半导体硅片，盈利能力突出',
                  'stockName':COMPANY,'stockCode':STOCK_CODE,'orgName':'国信证券股份有限公司','orgSName':'国信证券',
                  'publishDate':'2021-08-26 00:00:00.000','infoCode':'AP202108261512499224',
                  'attachPages':9,'attachSize':None,'emRatingName':'增持','sRatingName':'增持（首次）','researcher':'胡剑,胡慧,许亮,唐泓翼',
                  'column':'002004001002','reportType':2,
              },
          ]
          by_code={str(x.get('infoCode') or ''):x for x in rows if x.get('infoCode')}
          for x in fallback:
              by_code.setdefault(x['infoCode'],x)
          rows=list(by_code.values())

          def score(x:dict)->tuple:
              title=str(x.get('title') or '')
              pages=int(x.get('attachPages') or 0)
              positive=0
              for k,w in [('首次覆盖',60),('公司深度',55),('深度报告',55),('中小尺寸硅片领先厂商',50),('国产硅片龙头',45),('动态点评',20),('深耕小尺寸半导体硅片',25),('公司研究',15)]:
                  if k in title: positive+=w
              negative=sum(40 for k in ['年报点评','季报点评','中报点评','一季报点评','三季报点评','事件点评'] if k in title)
              return (positive-negative, pages, str(x.get('publishDate') or ''))

          candidates=[]
          for x in rows:
              pages=int(x.get('attachPages') or 0)
              title=str(x.get('title') or '')
              if str(x.get('stockCode') or STOCK_CODE)!=STOCK_CODE: continue
              if pages<8: continue
              if any(k in title for k in ['年报点评','季报点评','中报点评','一季报点评','三季报点评']): continue
              candidates.append(x)
          candidates.sort(key=score,reverse=True)
          print('CANDIDATE_COUNT',len(candidates))
          for x in candidates:
              print('CANDIDATE',json.dumps({k:x.get(k) for k in ['title','orgSName','publishDate','infoCode','attachPages','researcher','emRatingName','sRatingName']},ensure_ascii=False))

          selected=[]; seen_codes=set(); seen_brokers=set()
          # First pass: diversify brokers while preserving high score.
          for x in candidates:
              code=str(x.get('infoCode') or '')
              broker=str(x.get('orgSName') or x.get('orgName') or '')
              if not code or code in seen_codes or broker in seen_brokers: continue
              selected.append(x); seen_codes.add(code); seen_brokers.add(broker)
              if len(selected)>=3: break
          # Second pass: fill to three if diversification leaves fewer items.
          if len(selected)<3:
              for x in candidates:
                  code=str(x.get('infoCode') or '')
                  if not code or code in seen_codes: continue
                  selected.append(x); seen_codes.add(code)
                  if len(selected)>=3: break
          if len(selected)<2:
              raise RuntimeError(f'Only {len(selected)} usable reports found')

          def download(code:str):
              urls=[
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf',
              ]
              last=None
              for url in urls:
                  for attempt in range(7):
                      try:
                          r=session.get(url,timeout=(25,300),allow_redirects=True,headers={
                              'User-Agent':session.headers['User-Agent'],
                              'Referer':'https://data.eastmoney.com/report/',
                              'Accept':'application/pdf,*/*;q=0.8',
                          })
                          last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                          if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                              return r.content,url,last
                      except Exception as exc:
                          last={'url':url,'error':repr(exc)}
                      time.sleep(1+attempt)
              raise RuntimeError(f'download failed {code}: {last}')

          def safe_name(s:str)->str:
              s=re.sub(r'[\\/:*?"<>|]+','_',str(s or ''))
              s=re.sub(r'\s+','',s).strip('._')
              return s[:90] or '报告'

          manifest=[]
          for idx,x in enumerate(selected,1):
              code=str(x.get('infoCode') or '')
              data,url,meta=download(code)
              broker=str(x.get('orgSName') or x.get('orgName') or '券商')
              date=str(x.get('publishDate') or '')[:10]
              title=str(x.get('title') or '')
              filename=f'{idx:02d}_{safe_name(broker)}_中晶科技_{safe_name(title)}_{date}.pdf'
              dest=PDF_DIR/filename; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<8:
                  raise RuntimeError(f'too few pages: {filename} {pages}')
              text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(18,pages)])
              compact=re.sub(r'\s+','',text)
              if not any(k in compact for k in [COMPANY,STOCK_CODE,COMPANY_FULL]):
                  raise RuntimeError(f'issuer mismatch: {filename}')
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREVIEW_DIR/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000:
                  raise RuntimeError(f'preview failed: {filename}')
              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  'title':title,'broker':broker,'broker_full':x.get('orgName'),'date':date,
                  'analysts':x.get('researcher'),'rating':x.get('emRatingName') or x.get('sRatingName'),
                  'info_code':code,'index_pages':x.get('attachPages'),'actual_pages':pages,
                  'bytes':len(data),'filename':filename,'pdf_url':url,
                  'source_report_page':f'https://data.eastmoney.com/report/info/{code}.html',
                  'sha256':sha,'download_meta':meta,
                  'preview_file':str(Path('首页预览')/preview.name),
                  'document_nature':'券商原始完整PDF',
                  'validation':['PDF header','issuer identity','minimum page count','qpdf structure','first-page render'],
              })

          readme=[
              '浙江中晶科技股份有限公司（003026.SZ）券商深度与首次覆盖报告资料包',
              f'整理基准日：{AS_OF}','',
              f'本包收录{len(manifest)}份公开可直接取得并完成全文核验的券商原始完整PDF。',
              '筛选优先级：公司首次覆盖、公司深度及较长篇幅的首次评级报告；排除短篇年报、季报和事件点评。',''
          ]
          for i,m in enumerate(manifest,1):
              readme += [
                  f"{i}. {m['broker']}：《{m['title']}》",
                  f"   日期：{m['date']}；分析师：{m['analysts'] or '未列示'}；评级：{m['rating'] or '未列示'}",
                  f"   完整页数：{m['actual_pages']}页；文件：PDF原文/{m['filename']}",
                  f"   来源页面：{m['source_report_page']}",
                  f"   SHA-256：{m['sha256']}",'',
              ]
          readme += [
              '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'candidate_reports.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=len(manifest) or len(pdfs)<2:
                  raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)} manifest={len(manifest)}')
          short=Path('zhongjing_003026_broker_reports.zip')
          short.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('REPORT_COUNT',len(manifest))
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: zhongjing-003026-broker-reports-final-20261028
          path: |
            中晶科技_003026_券商深度与首次覆盖报告_完整版_截至20261028.zip
            zhongjing_003026_broker_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
