name: Temporary Fosun 2025 first page

on:
  push:
    branches:
      - tmp/fosun-international-broker-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-2025-firstpage.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public first page
        run: |
          mkdir -p firstpage
          curl -fL --retry 3 -A 'Mozilla/5.0' -e 'https://www.sgpjbg.com/baogao/900669.html' \
            'https://file.sgpjbg.com/fileroot2/2025-9/4/47ab7de9-0726-4072-ba85-b9e96d85ad39/47ab7de9-0726-4072-ba85-b9e96d85ad391.gif' \
            -o firstpage/fosun_2025_page1.gif
          file firstpage/fosun_2025_page1.gif
          test -s firstpage/fosun_2025_page1.gif
      - uses: actions/upload-artifact@v4
        with:
          name: fosun-2025-first-page
          path: firstpage/
          retention-days: 1
          if-no-files-found: error
