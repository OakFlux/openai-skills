name: Temporary Inspect 9fzt Report API Focused

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-inspect-9fzt-report-api-focused.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch page bundle and extract endpoint logic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin

          page='https://gmg.9fzt.com/report/HKSE/00200/800288177894.html'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':page,'Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(page,timeout=60);r.raise_for_status();html=r.text
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          scripts=[urljoin(r.url,x) for x in scripts]
          target=[x for x in scripts if '/pages/report/' in x]
          if not target:raise RuntimeError('report page chunk not found')
          u=target[0];q=s.get(u,timeout=60);q.raise_for_status();body=q.text
          out=Path('out');out.mkdir(exist_ok=True);(out/'report_page_chunk.js').write_text(body,encoding='utf-8')
          strings=sorted(set(re.findall(r'["\']([^"\']{2,500})["\']',body)))
          relevant=[x for x in strings if any(k in x.lower() for k in ['api','report','pdf','file','attach','download','content','detail','research','original','source'])]
          snippets=[]
          for needle in ['axios','fetch(','/api/','reportDetail','report/detail','reportId','report_id','pdf','download','fileUrl','file_url','origin','content','800288177894']:
            for m in list(re.finditer(re.escape(needle),body,re.I))[:200]:snippets.append({'needle':needle,'start':m.start(),'text':body[max(0,m.start()-1800):m.start()+5000]})
          result={'page':page,'chunk_url':u,'chunk_bytes':len(q.content),'relevant_strings':relevant,'snippets':snippets}
          (out/'focused.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('STRINGS='+json.dumps(relevant,ensure_ascii=False),flush=True)
          for x in snippets[:100]:print('SNIP',x['needle'],x['text'][:4000],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ninefzt-report-api-focused
          path: out
          retention-days: 3
