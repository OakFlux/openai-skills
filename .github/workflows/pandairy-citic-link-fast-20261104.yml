name: Fast discover CITIC Pandairy report link

on:
  push:
    paths:
      - '.github/workflows/pandairy-citic-link-fast-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Parse matching anchor
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          urls=['https://www.sgpjbg.com/labels/xiongmaozhaiquan.html','https://www.sgpjbg.com/labels/xiongmaozhaitedian.html']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9'})
          for url in urls:
            r=s.get(url,timeout=60,allow_redirects=True)
            print('FETCH',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a'):
              txt=a.get_text(' ',strip=True)
              href=a.get('href') or ''
              if '熊猫乳品' in txt or '深耕炼乳' in txt or '固乳机会市场' in txt or '熊猫乳品' in href:
                print('ANCHOR',json.dumps({'text':txt,'href':urljoin(r.url,href),'attrs':dict(a.attrs)},ensure_ascii=False),flush=True)
            for pat in [r'href=["\']([^"\']+)["\'][^>]*>[^<]*(?:熊猫乳品|深耕炼乳)',r'(?:熊猫乳品|深耕炼乳).{0,800}href=["\']([^"\']+)["\']']:
              for m in re.finditer(pat,r.text,re.I|re.S):
                print('REGEX_LINK',urljoin(r.url,m.group(1)),flush=True)
            idx=max(r.text.find('熊猫乳品-投资价值分析报告'),r.text.find('深耕炼乳'))
            if idx>=0:
              print('CONTEXT',r.text[max(0,idx-2500):idx+2500],flush=True)
          PY
