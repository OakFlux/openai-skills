name: Discover historical Dongbei B filings on SSE

on:
  push:
    paths:
      - '.github/workflows/dongbei-b-900956-sse-discover-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Query SSE announcement API
        run: |
          python - <<'PY'
          import json, time, requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          url='https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          s=requests.Session()
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=5,connect=5,read=5,status=5,backoff_factor=.7,status_forcelist=(403,408,429,500,502,503,504),allowed_methods=frozenset({'GET'}),raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=900956','Accept':'application/json,text/javascript,*/*;q=0.01','X-Requested-With':'XMLHttpRequest'})
          variants=[
            {'reportType':'ALL','reportType2':'DQBG','keyWord':''},
            {'reportType':'YEARLY','reportType2':'DQBG','keyWord':''},
            {'reportType':'ALL','reportType2':'','keyWord':'年度报告'},
            {'reportType':'ALL','reportType2':'','keyWord':'招股说明书'},
            {'reportType':'ALL','reportType2':'','keyWord':'换股吸收合并'},
          ]
          seen={}
          for v in variants:
            for page in range(1,30):
              params={
                'isPagination':'true','productId':'900956','keyWord':v['keyWord'],
                'securityType':'0101,120100,020100,020200,120200',
                'reportType2':v['reportType2'],'reportType':v['reportType'],
                'beginDate':'1999-01-01','endDate':'2020-11-23',
                'pageHelp.pageSize':'100','pageHelp.pageCount':'50','pageHelp.pageNo':str(page),
                'pageHelp.beginPage':'1','pageHelp.cacheSize':'1','pageHelp.endPage':'5',
                '_':str(int(time.time()*1000)),
              }
              r=s.get(url,params=params,timeout=60)
              print('GET',v,page,r.status_code,len(r.content),r.url)
              if r.status_code!=200: print(r.text[:500]); r.raise_for_status()
              obj=r.json(); result=obj.get('result') or obj.get('pageHelp',{}).get('data') or []
              print('META',json.dumps({'variant':v,'page':page,'rows':len(result),'pageHelp':obj.get('pageHelp')},ensure_ascii=False)[:3000])
              if not result: break
              for x in result:
                title=str(x.get('TITLE') or x.get('title') or x.get('BULLETIN_TYPE') or '')
                path=str(x.get('URL') or x.get('url') or x.get('BULLETIN_URL') or '')
                date=str(x.get('SSEDATE') or x.get('date') or x.get('BULLETIN_DATE') or '')
                key=(title,path,date); seen[key]=x
                if any(k in title for k in ('年度报告','招股说明书','换股吸收合并','上市公告')):
                  print('MATCH',json.dumps({'title':title,'date':date,'path':path,'raw':x},ensure_ascii=False))
              ph=obj.get('pageHelp') or {}
              page_count=int(ph.get('pageCount') or ph.get('pagecount') or 0)
              if page_count and page>=page_count: break
              if len(result)<100: break
              time.sleep(.15)
          print('UNIQUE_TOTAL',len(seen))
          PY
