name: Build Shimao Group 00813 annual reports package 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-annual-reports-package-20261012.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Download, validate, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '世茂集团_00813_2020-2025年报及2026最新中期报告'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'filename': '01_世茂集团_00813_2020年年度报告.pdf',
                  'year': 2020,
                  'period': '2020年度',
                  'type': '年度报告',
                  'filing_id': 1877873,
                  'event_date': '2021-03-30',
                  'urls': [
                      'https://files.quartr.com/reports/24538-2026-03-04.pdf?ref=U3RvY2tBbmFseXNpcw==',
                  ],
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '02_世茂集团_00813_2021年年度报告.pdf',
                  'year': 2021,
                  'period': '2021年度',
                  'type': '年度报告',
                  'filing_id': 1877875,
                  'event_date': '2023-07-28',
                  'urls': [
                      'https://files.quartr.com/reports/ff852-2026-03-04.pdf?ref=U3RvY2tBbmFseXNpcw==',
                  ],
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '03_世茂集团_00813_2022年年度报告.pdf',
                  'year': 2022,
                  'period': '2022年度',
                  'type': '年度报告',
                  'filing_id': 1877883,
                  'event_date': '2023-07-28',
                  'urls': [
                      'https://www.hkexnews.hk/listedco/listconews/sehk/2023/0920/2023092000348.pdf',
                      'https://files.quartr.com/reports/2cc3e-2025-12-02-01-35-28.pdf?ref=U3RvY2tBbmFseXNpcw==',
                  ],
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '04_世茂集团_00813_2023年年度报告.pdf',
                  'year': 2023,
                  'period': '2023年度',
                  'type': '年度报告',
                  'filing_id': 1877891,
                  'event_date': '2024-03-28',
                  'urls': [
                      'https://www.hkexnews.hk/listedco/listconews/sehk/2024/0429/2024042902184_c.pdf',
                      'https://files.quartr.com/reports/4c6d2-2025-12-02-01-08-22.pdf?ref=U3RvY2tBbmFseXNpcw==',
                  ],
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '05_世茂集团_00813_2024年年度报告.pdf',
                  'year': 2024,
                  'period': '2024年度',
                  'type': '年度报告',
                  'filing_id': 1877899,
                  'event_date': '2025-03-28',
                  'urls': [
                      'https://files.quartr.com/reports/11956-2025-12-02-01-48-15.pdf?ref=U3RvY2tBbmFseXNpcw==',
                  ],
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '06_世茂集团_00813_2025年年度报告.pdf',
                  'year': 2025,
                  'period': '2025年度',
                  'type': '年度报告',
                  'filing_id': 2802513,
                  'event_date': '2026-03-27',
                  'urls': [
                      'https://files.quartr.com/reports/a6a8e-2026-04-28-12-50-53.pdf?ref=U0E=',
                      'https://shimaogroup.hk/Upload/DownloadFile/iXPEeP_D6ic1',
                  ],
                  'min_pages': 60,
                  'min_bytes': 500_000,
              },
              {
                  'filename': '07_世茂集团_00813_2026年中期报告.pdf',
                  'year': 2026,
                  'period': '2026年中期',
                  'type': '中期报告',
                  'filing_id': 3686208,
                  'event_date': '2026-08-28',
                  'urls': [
                      'https://files.quartr.com/reports/d2a40767f43775c00121c4730b32ed32-2026-09-25-04-05-50.pdf?ref=U0E=',
                  ],
                  'min_pages': 35,
                  'min_bytes': 300_000,
              },
          ]

          def download(report: dict, destination: Path) -> str:
              errors: list[str] = []
              for url in report['urls']:
                  for attempt in range(1, 4):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://stockanalysis.com/filings/HKG:0813/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 900),
                          ) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = temp.stat().st_size
                          with temp.open('rb') as fh:
                              header = fh.read(8)
                          if size < report['min_bytes'] or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, header={header!r}')
                          temp.replace(destination)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f"download failed for {destination.name}: {errors}")

          records: list[dict] = []
          hashes: set[str] = set()
          company_terms = ('shimaogroup', 'shimaoproperty', '世茂集團', '世茂集团', '世茂房地產', '世茂房地产')

          for report in reports:
              destination = OUT / report['filename']
              source_url = download(report, destination)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'page count too small for {destination.name}: {pages}')

              sample_parts: list[str] = []
              for page_index in range(min(15, pages)):
                  try:
                      sample_parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              sample_text = ''.join(''.join(sample_parts).lower().split())
              if not any(term in sample_text for term in company_terms):
                  raise RuntimeError(f'company identity check failed for {destination.name}')
              if str(report['year']) not in sample_text:
                  print('WARNING year not found in extracted first-page sample', destination.name, flush=True)
              report_kind_terms = ('annualreport', '年報', '年度報告', 'interimreport', '中期報告', '中期报告')
              if not any(term in sample_text for term in report_kind_terms):
                  print('WARNING report kind not found in extracted first-page sample', destination.name, flush=True)

              qpdf = subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  capture_output=True,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf validation failed for {destination.name}: {qpdf.stderr[-2000:]}')

              render_root = OUT / (destination.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(destination), str(render_root)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed for {destination.name}: {render.stderr[-1000:]}')
              render_size = render_file.stat().st_size
              render_file.unlink(missing_ok=True)

              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              hashes.add(digest)

              record = {
                  'filename': destination.name,
                  'company': 'Shimao Group Holdings Limited / 世茂集团控股有限公司',
                  'stock_code': '00813.HK',
                  'period': report['period'],
                  'type': report['type'],
                  'event_date': report['event_date'],
                  'filing_id': report['filing_id'],
                  'source_pdf_url': source_url,
                  'filing_inventory_url': 'https://stockanalysis.com/filings/HKG:0813/',
                  'official_financial_reports_url': 'https://shimaogroup.hk/en/Financial/Index/',
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '世茂集团控股有限公司（Shimao Group Holdings Limited，00813.HK）2020—2025年年度报告及最新中期报告',
              '整理日期：2026-10-12',
              '',
              '收录范围：2020—2025年完整年度报告，共6份；以及截至整理日可获取的最新完整定期报告——2026年中期报告。',
              '说明：世茂集团为香港上市公司，通常按年度及半年度披露定期报告，并不按A股口径发布第一季度、第三季度报告，因此以2026年中期报告作为“最新季报”对应的最新定期财务报告。',
              '来源：优先采用港交所公开文件；其余文件由公开财报镜像获取，并与世茂集团公开财报目录及文件身份信息交叉核验。',
              '全部PDF均完成文件头、文件大小、页数、公司身份、qpdf结构、首页渲染、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['period']} {record['type']}（{record['pages']}页，{record['bytes']/1048576:.2f} MB）",
                  f"   文件：{record['filename']}",
                  f"   对应披露日期：{record['event_date']}",
                  f"   下载来源：{record['source_pdf_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 7:
                  raise RuntimeError(f'expected 7 PDFs, found {len(pdfs)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: shimao-00813-annual-reports-20261012
          path: 世茂集团_00813_2020-2025年报及2026最新中期报告.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
