name: probe-beiyuan-chemical-downloads-v2

on:
  push:
    branches:
      - tmp/beiyuan-chemical-601568-download-probe-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install parsers
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect report pages and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def fetch(url, **kwargs):
              r=s.get(url,timeout=kwargs.pop('timeout',(15,90)),allow_redirects=True,**kwargs)
              print('\nFETCH',r.status_code,len(r.content),r.headers.get('content-type'),r.url)
              return r

          pages=[
              ('nxny_2026','https://www.nxny.com/report/view_6306519.html'),
              ('sina_2026','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/833627200060/index.phtml'),
              ('sina_2021','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/675907804442/index.phtml'),
              ('sina_2020_gy','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/654247321522/index.phtml'),
              ('sina_2020_dg','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/654105906245/index.phtml'),
          ]

          for name,url in pages:
              print('\n================',name,'================')
              try:
                  r=fetch(url,headers={'Referer':'https://www.baidu.com/'})
                  enc=r.apparent_encoding or r.encoding or 'utf-8'
                  text=r.content.decode(enc,errors='replace')
                  print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:3])
                  soup=BeautifulSoup(text,'lxml')
                  print('META')
                  for meta in soup.find_all('meta'):
                      content=meta.get('content')
                      if content and any(k in (meta.get('name','')+meta.get('property','')+content).lower() for k in ['pdf','download','report','file','attach','6306519','601568']):
                          print('META_ITEM',meta)
                  print('HIDDEN_INPUTS')
                  for inp in soup.find_all('input'):
                      typ=(inp.get('type') or '').lower()
                      val=inp.get('value') or ''
                      if typ=='hidden' or any(k in (inp.get('id','')+inp.get('name','')+val).lower() for k in ['pdf','download','report','file','doc','url']):
                          print('INPUT',inp)
                  print('LINKS')
                  seen=set()
                  for tag in soup.find_all(['a','script','iframe','embed','object','img','source','video']):
                      vals=[]
                      for attr in ['href','src','data','data-src','data-url','url','content']:
                          v=tag.get(attr)
                          if v: vals.append((attr,v))
                      for attr,v in vals:
                          full=urljoin(r.url,html.unescape(v))
                          low=full.lower()
                          if any(k in low for k in ['pdf','download','report','file','attach','6306519','833627200060','675907804442','654247321522','654105906245']):
                              key=(attr,full)
                              if key not in seen:
                                  seen.add(key)
                                  print('LINK',tag.name,attr,full,'TEXT',tag.get_text(' ',strip=True)[:300])
                  patterns=[
                      r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                      r'https?://[^\s"\'<>]+(?:download|file|attach|report)[^\s"\'<>]{0,500}',
                      r'(?i)(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|docUrl|doc_url|sourceUrl|source_url|ossUrl|cosUrl)[^\n]{0,1200}',
                      r'(?i)(?:6306519|833627200060|675907804442|654247321522|654105906245)[^\n]{0,1200}',
                      r'(?i)(?:AP\d{10,}|infoCode|infocode)[^\n]{0,800}',
                  ]
                  for pi,pat in enumerate(patterns):
                      matches=list(re.finditer(pat,text,re.I|re.S))
                      print('PATTERN',pi,'COUNT',len(matches))
                      for m in matches[:80]:
                          snippet=re.sub(r'\s+',' ',text[max(0,m.start()-500):min(len(text),m.end()+1200)])
                          print('SNIP',pi,snippet[:2500])
                  # Fetch relevant first-party JS bundles and inspect.
                  scripts=[]
                  for tag in soup.find_all('script'):
                      src=tag.get('src')
                      if src:
                          full=urljoin(r.url,src)
                          if full not in scripts: scripts.append(full)
                  print('SCRIPT_COUNT',len(scripts))
                  for jsurl in scripts:
                      if not any(host in jsurl for host in ['nxny.com','sina.com.cn','sinaimg.cn']):
                          continue
                      try:
                          rr=fetch(jsurl,headers={'Referer':r.url},timeout=(15,60))
                          js=rr.content.decode(rr.apparent_encoding or 'utf-8',errors='replace')
                          if any(k in js.lower() for k in ['download','pdf','report','fileurl','6306519']):
                              print('JS_RELEVANT',jsurl)
                              for key in ['download','pdf','fileUrl','report','6306519','api/']:
                                  for m in list(re.finditer(re.escape(key),js,re.I))[:20]:
                                      print('JS_SNIP',key,re.sub(r'\s+',' ',js[max(0,m.start()-500):m.end()+1500])[:2600])
                      except Exception as e:
                          print('JS_ERR',jsurl,repr(e))
              except Exception as e:
                  print('PAGE_ERR',name,repr(e))

          print('\n=== COMMON NXNY ENDPOINT PROBES ===')
          base='https://www.nxny.com'
          paths=[
              '/report/down_6306519.html','/report/download_6306519.html','/report/pdf_6306519.html',
              '/report/down/6306519','/report/download/6306519','/report/6306519.pdf',
              '/download/6306519','/down/6306519','/api/report/6306519','/api/report/download/6306519',
              '/report/view_6306519.html?download=1','/report/view_6306519.html?type=download',
          ]
          for p in paths:
              try:
                  r=fetch(base+p,headers={'Referer':base+'/report/view_6306519.html','Accept':'application/pdf,text/html,*/*;q=0.8'})
                  print('ENDPOINT',p,'MAGIC',r.content[:30], 'HISTORY',[(h.status_code,h.url,h.headers.get('location')) for h in r.history])
              except Exception as e: print('ENDPOINT_ERR',p,repr(e))

          print('\n=== SINA URL ROUTES ===')
          for rid in ['833627200060','675907804442','654247321522','654105906245']:
              candidates=[
                  f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/url',
                  f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/url.phtml',
                  f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/download',
                  f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml?download=1',
              ]
              for u in candidates:
                  try:
                      r=fetch(u,headers={'Referer':f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml','Accept':'application/pdf,text/html,*/*;q=0.8'})
                      print('SINA_ROUTE',rid,u,'MAGIC',r.content[:30],'HISTORY',[(h.status_code,h.url,h.headers.get('location')) for h in r.history])
                  except Exception as e: print('SINA_ROUTE_ERR',rid,u,repr(e))
          PY
