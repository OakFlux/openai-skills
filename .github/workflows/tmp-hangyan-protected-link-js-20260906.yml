name: Temporary Hangyan protected-link JS inspection

on:
  push:
    branches:
      - tmp-hangyan-protected-link-js-20260906

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch asset and extract controller logic
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, re
          from pathlib import Path
          import requests

          out=Path('output'); out.mkdir(exist_ok=True)
          urls=[
            'https://cdn.hangyan.co/assets/application-ec845e69.js',
            'https://cdn.hangyan.co/assets/application-ec845e69.js.map',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.hangyan.co/'})
          summary=[]
          for idx,url in enumerate(urls,1):
            try:
              r=s.get(url,timeout=120)
              print('FETCH',r.status_code,len(r.content),r.headers.get('content-type'),url,flush=True)
              data=r.content
              (out/f'asset_{idx}.bin').write_bytes(data)
              text=data.decode('utf-8','replace')
              keys=['protected-link','protected_link','protectedLink','tokenValue','native-pdf','native_pdf','Turbo.visit','turboValue']
              snippets=[]
              for key in keys:
                for m in re.finditer(re.escape(key),text,re.I):
                  snippets.append({'key':key,'start':m.start(),'snippet':text[max(0,m.start()-1800):min(len(text),m.end()+3500)]})
              summary.append({'url':url,'status':r.status_code,'bytes':len(data),'snippets':snippets})
              print('SNIPPETS',url,len(snippets),flush=True)
              for item in snippets[:50]:
                print('---',item['key'],item['start'],'---',flush=True)
                print(item['snippet'][:6000],flush=True)
            except Exception as e:
              summary.append({'url':url,'error':repr(e)})
              print('ERR',url,repr(e),flush=True)
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-protected-link-js
          path: output/*
          retention-days: 1
          if-no-files-found: error
