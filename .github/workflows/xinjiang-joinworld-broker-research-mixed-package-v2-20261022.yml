name: Build Xinjiang Joinworld research package

on:
  push:
    paths:
      - '.github/workflows/xinjiang-joinworld-broker-research-mixed-package-v2-20261022.yml'
      - '.github/scripts/package_xinjiang_joinworld_mixed_20261022.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4
      - name: Build package
        run: python .github/scripts/package_xinjiang_joinworld_mixed_20261022.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: xinjiang-joinworld-broker-research-mixed-package-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
