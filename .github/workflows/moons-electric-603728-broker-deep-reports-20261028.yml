name: Package Moons Electric broker deep reports

on:
  push:
    paths:
      - '.github/workflows/moons-electric-603728-broker-deep-reports-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf 'pymupdf<2'

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          COMPANY = '鸣志电器'
          FULL_COMPANY = '上海鸣志电器股份有限公司'
          CODE = '603728'
          CUTOFF = '2026-10-28'
          CUT = '20261028'
          WORK = Path('work')
          DIST = Path('dist')
          TEMP_ROOT = WORK / f'{COMPANY}_{CODE}_券商深度报告_待定份数_截至{CUT}'
          REPORT_DIR = TEMP_ROOT / '券商深度报告'
          PREVIEW_DIR = TEMP_ROOT / '首页预览'
          for d in (REPORT_DIR, PREVIEW_DIR, DIST):
              d.mkdir(parents=True, exist_ok=True)

          # Priority order: recent first coverage, substantial company deep study,
          # then two validated 2023 company/first-coverage reports as fallbacks.
          candidates = [
              {
                  'priority': 1,
                  'broker': '华源证券',
                  'broker_probe': '华源证券',
                  'date': '2026-06-01',
                  'title': '先发布局灵巧手电机，拓展机器人产品矩阵',
                  'report_class': '首次覆盖报告',
                  'rating': '增持（首次）',
                  'authors': '赵梦妮',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202606011823126186_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP202606011823126186_1.pdf',
                  ],
                  'detail_url': 'https://data.cfi.cn/ybdata.aspx?id=20260601000335',
              },
              {
                  'priority': 2,
                  'broker': '广发证券',
                  'broker_probe': '广发证券',
                  'date': '2024-12-31',
                  'title': '虎啸龙鸣跃步进，青云之志藏空心',
                  'report_class': '公司深度研究',
                  'rating': '',
                  'authors': '',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202501021641504555_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP202501021641504555_1.pdf',
                  ],
                  'detail_url': 'https://data.eastmoney.com/report/info/AP202501021641504555.html',
              },
              {
                  'priority': 3,
                  'broker': '东吴证券',
                  'broker_probe': '东吴证券',
                  'date': '2023-06-05',
                  'title': '“灵巧手”一鸣惊人，“拓品类”志在千里',
                  'report_class': '公司深度研究',
                  'rating': '买入（首次）',
                  'authors': '曾朵红、谢哲栋',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202306051590419470_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H2_AP202306051590419470_1.pdf',
                  ],
                  'detail_url': 'https://data.eastmoney.com/report/info/AP202306051590419470.html',
              },
              {
                  'priority': 4,
                  'broker': '天风证券',
                  'broker_probe': '天风证券',
                  'date': '2023-09-13',
                  'title': '世界级运动控制制造商，把握人形机器人发展机遇',
                  'report_class': '首次覆盖报告',
                  'rating': '增持（首次）',
                  'authors': '孙潇雅',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202309131598375745_1.PDF',
                      'https://pdf.dfcfw.com/pdf/H2_AP202309131598375745_1.PDF',
                  ],
                  'detail_url': 'https://data.eastmoney.com/report/info/AP202309131598375745.html',
              },
          ]

          session = requests.Session()
          retry = Retry(
              total=6, connect=6, read=6, status=6, backoff_factor=1.0,
              status_forcelist=(403, 408, 429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}), raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/report/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
          })

          def safe_name(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]', '_', value)
              value = re.sub(r'\s+', '', value)
              return re.sub(r'_+', '_', value).strip('_. ')

          def file_sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          records = []
          failures = []
          for item in candidates:
              if len(records) >= 3:
                  break
              filename = safe_name(f"{item['date']}_{item['broker']}_{COMPANY}_{item['title']}.pdf")
              dest = REPORT_DIR / filename
              chosen_url = ''
              errors = []
              for url in item['urls']:
                  try:
                      r = session.get(
                          url,
                          headers={'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},
                          timeout=180,
                          allow_redirects=True,
                      )
                      print('DOWNLOAD', item['broker'], r.status_code, len(r.content), url, r.url, r.headers.get('content-type'))
                      if r.status_code == 200 and len(r.content) > 200_000 and r.content.startswith(b'%PDF'):
                          dest.write_bytes(r.content)
                          chosen_url = url
                          break
                      errors.append((url, r.status_code, len(r.content), repr(r.content[:24])))
                  except Exception as exc:
                      errors.append((url, repr(exc)))
              if not dest.exists():
                  failures.append({'broker': item['broker'], 'title': item['title'], 'errors': errors})
                  continue

              try:
                  reader = PdfReader(str(dest), strict=False)
                  pages = len(reader.pages)
                  if pages < 20:
                      raise RuntimeError(f'页数过少：{pages}')
                  doc = fitz.open(dest)
                  if doc.page_count != pages:
                      raise RuntimeError(f'页数解析不一致：pypdf={pages}, fitz={doc.page_count}')
                  first = doc.load_page(0).get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
                  last = doc.load_page(doc.page_count - 1).get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
                  if min(first.width, first.height, last.width, last.height) < 100:
                      raise RuntimeError('首末页渲染异常')
                  probe = ''
                  for p in range(min(6, doc.page_count)):
                      try:
                          probe += doc.load_page(p).get_text('text')
                      except Exception:
                          pass
                  first.save(PREVIEW_DIR / f'{dest.stem}.png')
                  doc.close()
                  if not any(k in probe for k in (COMPANY, FULL_COMPANY, CODE)):
                      raise RuntimeError('前六页未识别到公司名称或证券代码')
                  if item['broker_probe'] not in probe:
                      raise RuntimeError(f"前六页未识别到券商名称：{item['broker_probe']}")

                  rec = {
                      'broker': item['broker'],
                      'report_date': item['date'],
                      'title': item['title'],
                      'report_class': item['report_class'],
                      'rating': item['rating'],
                      'authors': item['authors'],
                      'source_url': chosen_url,
                      'detail_url': item['detail_url'],
                      'relative_path': str(dest.relative_to(TEMP_ROOT)).replace(os.sep, '/'),
                      'file_name': dest.name,
                      'file_size_bytes': dest.stat().st_size,
                      'page_count': pages,
                      'sha256': file_sha256(dest),
                      'pdf_header_valid': True,
                      'first_page_rendered': True,
                      'last_page_rendered': True,
                  }
                  records.append(rec)
                  print('VERIFIED', json.dumps(rec, ensure_ascii=False))
              except Exception as exc:
                  failures.append({'broker': item['broker'], 'title': item['title'], 'errors': errors + [repr(exc)]})
                  if dest.exists():
                      dest.unlink()
                  preview = PREVIEW_DIR / f'{dest.stem}.png'
                  if preview.exists():
                      preview.unlink()

          if len(records) < 2:
              raise RuntimeError(f'仅成功取得{len(records)}份完整深度报告；failures={failures}')

          count = len(records)
          final_root_name = f'{COMPANY}_{CODE}_券商深度报告_完整版{count}份_截至{CUT}'
          final_root = TEMP_ROOT.parent / final_root_name
          if final_root.exists():
              shutil.rmtree(final_root)
          TEMP_ROOT.rename(final_root)
          ROOT = final_root

          # Rebase relative paths after root rename (inner paths are unchanged).
          manifest = {
              'company': COMPANY,
              'full_company_name': FULL_COMPANY,
              'stock_code': CODE,
              'cutoff_date': CUTOFF,
              'document_count': count,
              'selection_policy': '优先选择近期首次覆盖和长篇公司深度报告，兼顾不同券商与研究视角；仅保留可完整下载且实际页数不少于20页的PDF。',
              'documents': records,
              'failed_candidates': failures,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              '\n'.join(f"{r['sha256']}  {r['relative_path']}" for r in records) + '\n',
              encoding='utf-8',
          )

          lines = [
              f'# {COMPANY}（{CODE}）券商深度报告包', '',
              f'- 截止日期：{CUTOFF}',
              f'- 收录数量：{count}份完整PDF。',
              '- 选择标准：近期首次覆盖、公司深度研究、篇幅不少于20页，并尽量覆盖不同券商。',
              '- 校验项目：PDF文件头、双解析器页数、公司与券商身份、首末页渲染、SHA-256及ZIP CRC。',
              '- 版权归原券商及作者所有，仅供个人研究参考，不构成投资建议。', '',
              '## 文件清单', '',
          ]
          for i, r in enumerate(records, 1):
              lines += [
                  f"{i}. `{r['relative_path']}`",
                  f"   - 券商：{r['broker']}",
                  f"   - 日期：{r['report_date']}",
                  f"   - 类型：{r['report_class']}",
                  f"   - 标题：{r['title']}",
                  f"   - 作者：{r['authors'] or '未预录，详见PDF封面'}",
                  f"   - 评级：{r['rating'] or '详见PDF封面'}",
                  f"   - 页数：{r['page_count']}；大小：{r['file_size_bytes']:,}字节",
                  f"   - 原始PDF：{r['source_url']}",
                  f"   - SHA-256：`{r['sha256']}`",
              ]
          (ROOT / 'README.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          final_cn = DIST / f'{final_root_name}.zip'
          final_en = DIST / f'moons_electric_603728_broker_deep_reports_{count}_full_{CUT}.zip'
          for p in (final_cn, final_en):
              if p.exists():
                  p.unlink()
          with zipfile.ZipFile(final_cn, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as zf:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      zf.write(p, str(p.relative_to(ROOT.parent)).replace(os.sep, '/'))
          shutil.copy2(final_cn, final_en)

          for p in (final_cn, final_en):
              with zipfile.ZipFile(p, 'r') as zf:
                  bad = zf.testzip()
                  pdfs = [n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if bad or len(pdfs) != count:
                      raise RuntimeError(f'ZIP校验失败：{p}; bad={bad}; pdfs={len(pdfs)}; expected={count}')
              print('ZIP_VERIFIED', p, p.stat().st_size, file_sha256(p))

          print('FINAL_JSON', json.dumps({
              'document_count': count,
              'reports': [{k: r[k] for k in ('broker', 'report_date', 'title', 'report_class', 'rating', 'authors', 'page_count')} for r in records],
              'chinese_zip': str(final_cn),
              'english_zip': str(final_en),
              'size': final_cn.stat().st_size,
              'sha256': file_sha256(final_cn),
              'failed_candidates': failures,
          }, ensure_ascii=False))
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: moons-electric-603728-broker-deep-reports-20261028
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
