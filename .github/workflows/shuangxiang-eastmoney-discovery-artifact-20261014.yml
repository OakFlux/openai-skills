name: Archive Shuangxiang Eastmoney report discovery results

on:
  push:
    paths:
      - '.github/workflows/shuangxiang-eastmoney-discovery-artifact-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Query public report APIs and save results
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, html, traceback
          from pathlib import Path
          from urllib.parse import quote, urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('shuangxiang_discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          summary=[]

          def save(name, content, binary=False):
              p=out/name
              if binary: p.write_bytes(content)
              else: p.write_text(content,encoding='utf-8')
              return str(p)

          def request(url, *, params=None, headers=None, name='response'):
              try:
                  r=s.get(url,params=params,headers=headers,timeout=90,allow_redirects=True)
                  meta={'name':name,'status':r.status_code,'url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'history':[{'status':x.status_code,'url':x.url} for x in r.history]}
                  summary.append(meta)
                  save(name+'.body',r.content,binary=True)
                  save(name+'.meta.json',json.dumps(meta,ensure_ascii=False,indent=2))
                  return r
              except Exception as e:
                  meta={'name':name,'error':repr(e),'traceback':traceback.format_exc()}
                  summary.append(meta); save(name+'.error.json',json.dumps(meta,ensure_ascii=False,indent=2)); return None

          base='https://reportapi.eastmoney.com/report/list'
          variants=[
              {'pageSize':'100','beginTime':'2009-01-01','endTime':'2026-10-14','pageNo':'1','qType':'0','code':'002395'},
              {'pageSize':'100','beginTime':'2009-01-01','endTime':'2026-10-14','pageNo':'1','qType':'1','code':'002395'},
              {'pageSize':'100','pageNo':'1','qType':'0','code':'002395'},
              {'cb':'callback','pageSize':'100','beginTime':'2009-01-01','endTime':'2026-10-14','pageNo':'1','qType':'0','code':'002395'},
              {'pageSize':'100','beginTime':'2009-01-01','endTime':'2026-10-14','pageNo':'1','qType':'0','code':'SZ002395'},
          ]
          for i,params in enumerate(variants,1):
              request(base,params=params,headers={'Referer':'https://data.eastmoney.com/report/002395.html','User-Agent':s.headers['User-Agent']},name=f'eastmoney_{i}')

          # Public Eastmoney stock report pages, which may embed the list API contract.
          for i,url in enumerate([
              'https://data.eastmoney.com/report/002395.html',
              'https://data.eastmoney.com/report/stock.jshtml?code=002395',
              'https://data.eastmoney.com/report/stock.jshtml?stockcode=002395',
          ],1):
              request(url,name=f'eastmoney_page_{i}')

          # Public Sina known report and list/search variants.
          sina_urls=[
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/629760863215/index.phtml',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=002395',
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?keyword='+quote('双象股份'),
              'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?stockcode=002395',
          ]
          for i,url in enumerate(sina_urls,1): request(url,name=f'sina_{i}')

          # Public Hibor archive/search pages.
          hibor_urls=[
              'https://www.hibor.com.cn/search.html?keyword='+quote('双象股份'),
              'https://www.hibor.com.cn/search.html?keyword=002395',
              'https://fxgroup.hibor.com.cn/Archiver/201912.html',
              'https://www.hibor.com.cn/archiver_houtai/201912.html',
              'https://fxgroup.hibor.com.cn/Archiver/201005.html',
              'https://www.hibor.com.cn/archiver_houtai/201005.html',
          ]
          for i,url in enumerate(hibor_urls,1): request(url,name=f'hibor_{i}')

          # Search engine HTML for candidate report titles and URLs.
          queries=[
              '"双象股份" 002395 研报 PDF',
              '"双象股份" 深度报告 PDF',
              '"双象股份(002395)" 公司研究 PDF',
              '"立足原料优势 看好公司PMMA产业链一体化布局"',
              '"双象股份" 东兴证券',
              '"双象股份" 光大证券',
              '"双象股份" 中信建投',
          ]
          for qi,q in enumerate(queries,1):
              request('https://www.bing.com/search',params={'q':q,'count':'50'},name=f'bing_{qi}')
              request('https://www.so.com/s',params={'q':q},name=f'so360_{qi}')

          save('summary.json',json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: shuangxiang-report-discovery-20261014
          path: shuangxiang_discovery
          if-no-files-found: error
          retention-days: 7
          compression-level: 6