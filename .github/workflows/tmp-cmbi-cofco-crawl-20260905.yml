name: Temporary CMBI COFCO Joycome report crawl

on:
  push:
    branches:
      - tmp-cmbi-cofco-crawl-20260905

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Crawl official CMBI research archive
        run: |
          python -m pip install requests beautifulsoup4 pypdf
          cat > /tmp/crawl_cmbi.py <<'PY'
          from __future__ import annotations
          import hashlib, io, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          hits=[]
          for page in range(1,181):
            url=f'https://www.cmbi.com.hk/market-stockreview?lang=en&page={page}'
            try:
              r=s.get(url,timeout=40); print('LIST',page,r.status_code,len(r.content))
              if r.status_code!=200: continue
              soup=BeautifulSoup(r.text,'html.parser')
              text=' '.join(soup.stripped_strings)
              links=[]
              for a in soup.find_all('a',href=True):
                title=' '.join(a.stripped_strings)
                href=urljoin(r.url,a['href'])
                if '/article/' in href: links.append((title,href))
              for title,href in links:
                blob=(title+' '+href).lower()
                if any(k in blob for k in ['中粮家佳康','中糧家佳康','cofco joycome','1610 hk','01610']):
                  item={'page':page,'title':title,'article_url':href}; hits.append(item); print('HIT',json.dumps(item,ensure_ascii=False))
              # Stop once the page is older than 2023 and we have passed expected date range.
              if page%20==0: time.sleep(0.5)
            except Exception as e: print('LISTERR',page,repr(e))

          # Also query common keyword parameters on the official site.
          for params in [
            '?lang=en&keyword=COFCO%20Joycome',
            '?lang=zh-CN&keyword=%E4%B8%AD%E7%B2%AE%E5%AE%B6%E4%BD%B3%E5%BA%B7',
            '?lang=en&search=1610',
            '?lang=en&q=1610',
          ]:
            try:
              u='https://www.cmbi.com.hk/market-stockreview'+params
              r=s.get(u,timeout=40); soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.find_all('a',href=True):
                title=' '.join(a.stripped_strings); href=urljoin(r.url,a['href']); blob=(title+' '+href).lower()
                if '/article/' in href and any(k in blob for k in ['中粮家佳康','中糧家佳康','cofco joycome','1610 hk','01610']):
                  item={'page':'keyword','title':title,'article_url':href}
                  if item not in hits: hits.append(item); print('KEYHIT',json.dumps(item,ensure_ascii=False))
            except Exception as e: print('KEYERR',params,repr(e))

          docs=[]; seen=set()
          for hit in hits:
            au=hit['article_url']
            if au in seen: continue
            seen.add(au)
            try:
              r=s.get(au,timeout=40); soup=BeautifulSoup(r.text,'html.parser')
              article_title=(soup.find('h1') or soup.find('h2'))
              article_title=' '.join(article_title.stripped_strings) if article_title else hit['title']
              candidates=[]
              for a in soup.find_all('a',href=True):
                href=urljoin(r.url,a['href']); label=' '.join(a.stripped_strings)
                if any(k in (href+' '+label).lower() for k in ['hk-official.cmbi.info','.pdf','read the report','阅读报告']): candidates.append(href)
              for iframe in soup.find_all('iframe',src=True): candidates.append(urljoin(r.url,iframe['src']))
              print('ARTICLE',au,article_title,'CANDIDATES',candidates)
              for u in dict.fromkeys(candidates):
                try:
                  rr=s.get(u,timeout=60,allow_redirects=True); data=rr.content
                  print('DOC',rr.status_code,len(data),rr.url,rr.headers.get('content-type'))
                  if data.lstrip().startswith(b'%PDF') and len(data)>50000:
                    reader=PdfReader(io.BytesIO(data),strict=False); pages=len(reader.pages)
                    text=' '.join((p.extract_text() or '') for p in reader.pages[:4]); text=re.sub(r'\s+',' ',text)
                    if not any(k.lower() in text.lower() for k in ['中粮家佳康','中糧家佳康','cofco joycome','1610 hk','01610']): continue
                    digest=hashlib.sha256(data).hexdigest()
                    fn=f'CMBI_{re.sub(r"[^A-Za-z0-9_-]+","_",article_title)[:80]}.pdf'
                    (out/fn).write_bytes(data)
                    doc={'file':fn,'article_url':au,'document_url':rr.url,'title':article_title,'pages':pages,'size':len(data),'sha256':digest,'text_head':text[:1500]}
                    docs.append(doc); print('VALID',json.dumps(doc,ensure_ascii=False)); break
                except Exception as e: print('DOCERR',u,repr(e))
            except Exception as e: print('ARTICLEERR',au,repr(e))
          (out/'hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'documents.json').write_text(json.dumps(docs,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_DOCS',len(docs))
          PY
          python /tmp/crawl_cmbi.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: cmbi-cofco-joycome-official-reports
          path: output
          retention-days: 1
          compression-level: 6
