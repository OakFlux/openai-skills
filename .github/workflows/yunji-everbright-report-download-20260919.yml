name: Download public Everbright Yunji report 20260919

on:
  push:
    paths:
      - '.github/workflows/yunji-everbright-report-download-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Download public PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, hashlib, json
          from pathlib import Path
          from pypdf import PdfReader
          from playwright.async_api import async_playwright

          URL='https://www.hangyan.co/reports/3739301018047874172'
          OUT=Path('everbright-output'); OUT.mkdir(exist_ok=True)
          PDF=OUT/'中国光大证券国际_云迹02670HK_新股预览北京云迹科技_2025-10-08.pdf'
          network=[]
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--disable-blink-features=AutomationControlled'])
              context=await browser.new_context(accept_downloads=True,user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',locale='zh-CN',viewport={'width':1440,'height':1000})
              page=await context.new_page()
              page.on('response',lambda r: network.append({'url':r.url,'status':r.status,'content_type':r.headers.get('content-type',''),'resource_type':r.request.resource_type}))
              resp=await page.goto(URL,wait_until='domcontentloaded',timeout=120000)
              print('GOTO',resp.status if resp else None,page.url,flush=True)
              await page.wait_for_timeout(7000)
              iframe=page.locator('iframe[data-native-pdf-target="iframe"]')
              print('TITLE',await page.title(),flush=True)
              print('IFRAME_SRC',await iframe.first.get_attribute('src') if await iframe.count() else None,flush=True)
              button=page.locator('[data-action="click->native-pdf#download"]').first
              downloaded=False
              if await button.count():
                try:
                  async with page.expect_download(timeout=45000) as info:
                    await button.click()
                  dl=await info.value
                  print('DOWNLOAD_SUGGESTED',dl.suggested_filename,flush=True)
                  await dl.save_as(str(PDF)); downloaded=True
                except Exception as e:
                  print('DOWNLOAD_ERROR',repr(e),flush=True)
              if not downloaded:
                candidates=[]
                if await iframe.count():
                  src=await iframe.first.get_attribute('src')
                  if src: candidates.append(src)
                for row in network:
                  if 'application/pdf' in row['content_type'].lower() or '.pdf' in row['url'].lower():
                    candidates.append(row['url'])
                for cand in list(dict.fromkeys(candidates)):
                  rr=await context.request.get(cand,headers={'Referer':URL},timeout=120000)
                  data=await rr.body()
                  print('FETCH',rr.status,len(data),cand,flush=True)
                  if rr.status==200 and data.startswith(b'%PDF-'):
                    PDF.write_bytes(data); downloaded=True; break
              (OUT/'network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
              await page.screenshot(path=str(OUT/'page.png'),full_page=False)
              await browser.close()
              if not downloaded: raise RuntimeError('download failed')
          asyncio.run(main())
          data=PDF.read_bytes(); reader=PdfReader(str(PDF),strict=False)
          print('PDF_VALID',len(reader.pages),len(data),hashlib.sha256(data).hexdigest(),flush=True)
          if not data.startswith(b'%PDF-') or len(reader.pages)<1: raise RuntimeError('invalid PDF')
          PY
      - name: Validate
        run: |
          qpdf --check everbright-output/*.pdf
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png everbright-output/*.pdf /tmp/everbright-first
          test -s /tmp/everbright-first.png
      - uses: actions/upload-artifact@v4
        with:
          name: yunji-everbright-public-pdf
          path: everbright-output
          retention-days: 14
          if-no-files-found: error
