name: Discover HJTime 603101 public broker report PDFs 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-fxbaogao-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf

      - name: Search metadata and probe public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          out=Path('discovery'); out.mkdir()
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept':'application/json,text/html,application/pdf,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Origin':'https://www.fxbaogao.com',
              'Referer':'https://www.fxbaogao.com/',
          })

          rows={}
          endpoints=[
              ('https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth', {'keywords':'汇嘉时代','pageIndex':1,'pageSize':50,'order':2,'nop':-1}),
              ('https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth', {'stockCodes':['603101'],'pageNum':1,'pageSize':100,'order':2}),
              ('https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth', {'advancedQuery':True,'advancedRequest':{'title':'汇嘉时代'},'pageNum':1,'pageSize':100,'order':2}),
          ]
          for i,(url,body) in enumerate(endpoints,1):
              try:
                  r=s.post(url,json=body,timeout=(20,90))
                  print('SEARCH',i,r.status_code,len(r.content),url,flush=True)
                  (out/f'search_{i}.json').write_bytes(r.content)
                  print('SEARCH_BODY',i,r.text[:30000],flush=True)
                  if r.status_code==200:
                      j=r.json(); data=j.get('data') or {}
                      candidates=[]
                      for key in ('dataList','list','rows','records'):
                          if isinstance(data.get(key),list): candidates.extend(data[key])
                      if isinstance(data,list): candidates.extend(data)
                      for row in candidates:
                          did=str(row.get('docId') or row.get('id') or row.get('reportId') or '')
                          if did: rows[did]=row
              except Exception as e:
                  print('SEARCH_ERR',i,repr(e),flush=True)

          print('ROWS_COUNT',len(rows),flush=True)
          for did,row in rows.items():
              print('ROW',did,json.dumps(row,ensure_ascii=False),flush=True)
          (out/'rows.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')

          # Ensure known report id is inspected.
          ids=set(rows); ids.add('5261391')
          script_urls=set(); interesting=set(); page_records=[]
          for did in sorted(ids):
              for template in ('https://www.fxbaogao.com/detail/{id}','https://www.fxbaogao.com/view?id={id}'):
                  url=template.format(id=did)
                  try:
                      r=s.get(url,timeout=(20,90),allow_redirects=True)
                      print('PAGE',did,r.status_code,len(r.content),r.url,flush=True)
                      (out/f'page_{did}_{"detail" if "detail" in url else "view"}.html').write_bytes(r.content)
                      if r.status_code!=200: continue
                      text=r.text; soup=BeautifulSoup(text,'lxml')
                      for tag in soup.find_all('script',src=True):
                          script_urls.add(urllib.parse.urljoin(r.url,tag['src']))
                      for m in re.finditer(r'https?://[^\s"\'<>]+',text):
                          u=m.group(0).replace('\\/','/').rstrip(');,]}')
                          if any(k in u.lower() for k in ('pdf','download','report','oss','file')): interesting.add(u)
                      snippets=[]
                      for pat in ('pdf','pdfPath','download','fileUrl','report/','report-cn/','点击查看原文','docId'):
                          for m in list(re.finditer(pat,text,re.I))[:30]:
                              snippets.append(text[max(0,m.start()-250):min(len(text),m.end()+500)])
                      rec={'docId':did,'url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '','snippets':snippets,'text':' '.join(soup.get_text(' ',strip=True).split())[:12000]}
                      page_records.append(rec)
                      print('PAGE_REC',did,json.dumps(rec,ensure_ascii=False)[:24000],flush=True)
                  except Exception as e:
                      print('PAGE_ERR',did,url,repr(e),flush=True)
          (out/'page_records.json').write_text(json.dumps(page_records,ensure_ascii=False,indent=2),encoding='utf-8')

          script_records=[]
          for idx,url in enumerate(sorted(script_urls),1):
              try:
                  r=s.get(url,timeout=(20,90)); print('SCRIPT',idx,r.status_code,len(r.content),url,flush=True)
                  if r.status_code!=200: continue
                  text=r.text; (out/f'script_{idx:03d}.js').write_text(text,encoding='utf-8',errors='replace')
                  hits=[]
                  for pat in ('pdfPath','download','fileUrl','report-cn','dr.fxbaogao','public.fxbaogao','oss-buy','preDown','readReport'):
                      for m in list(re.finditer(pat,text,re.I))[:100]:
                          hits.append(text[max(0,m.start()-250):min(len(text),m.end()+450)])
                  if hits:
                      script_records.append({'url':url,'hits':hits})
                      print('SCRIPT_HITS',url,json.dumps(hits[:50],ensure_ascii=False),flush=True)
              except Exception as e:
                  print('SCRIPT_ERR',url,repr(e),flush=True)
          (out/'script_records.json').write_text(json.dumps(script_records,ensure_ascii=False,indent=2),encoding='utf-8')

          # Collect path-like values recursively from metadata.
          values=set()
          def walk(v):
              if isinstance(v,dict):
                  for k,vv in v.items():
                      if isinstance(vv,str) and any(t in k.lower() for t in ('pdf','path','file','url','download')):
                          values.add(vv)
                      walk(vv)
              elif isinstance(v,list):
                  for vv in v: walk(vv)
              elif isinstance(v,str):
                  if '.pdf' in v.lower() or v.startswith('report/') or v.startswith('report-cn/'):
                      values.add(v)
          walk(rows)
          values.update(interesting)
          print('VALUES',json.dumps(sorted(values),ensure_ascii=False),flush=True)

          hosts=['https://dr.fxbaogao.com/','https://public.fxbaogao.com/','https://report.fxbaogao.com/','https://oss-buy.hufangde.com/','https://api.fxbaogao.com/']
          urls=[]
          for v in values:
              v=v.replace('\\/','/').lstrip('/')
              if v.startswith('http://') or v.startswith('https://'): urls.append(v)
              else:
                  for h in hosts: urls.append(h+v)
          urls=list(dict.fromkeys(urls))
          pdfs=[]
          for i,url in enumerate(urls,1):
              if len(url)>1500 or '${' in url: continue
              try:
                  r=s.get(url,timeout=(12,60),allow_redirects=True)
                  rec={'url':url,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'prefix':r.content[:8].hex()}
                  print('PROBE',json.dumps(rec,ensure_ascii=False),flush=True)
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>80000:
                      p=out/f'found_{len(pdfs)+1:02d}.pdf'; p.write_bytes(r.content)
                      rec['pages']=len(PdfReader(str(p),strict=False).pages); rec['file']=p.name
                      pdfs.append(rec); print('FOUND_PDF',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e:
                  print('PROBE_ERR',url,repr(e),flush=True)
          (out/'pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FOUND_COUNT',len(pdfs),flush=True)
          PY

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: hjtime-603101-fxbaogao-discovery
          path: discovery
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
