name: Baolidi Broker Report Probe

on:
  push:
    branches:
      - chatgpt-baolidi-broker-reports-20261004
    paths:
      - .github/workflows/baolidi_broker_report_probe_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Query Eastmoney public report API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, re, requests
          from pathlib import Path

          api='https://reportapi.eastmoney.com/report/list'
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':'https://data.eastmoney.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          rows=[]
          for code in ('300905','SZ300905'):
              for page in range(1,6):
                  params={
                      'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':'2000-01-01','endTime':'2030-12-31','pageNo':str(page),'fields':'','qType':'0',
                      'orgCode':'','code':code,'rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                  }
                  r=s.get(api,params=params,timeout=90,allow_redirects=True)
                  print('API',code,page,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
                  r.raise_for_status()
                  text=r.text.strip()
                  try:
                      obj=r.json()
                  except Exception:
                      m=re.search(r'^[^(]+\((.*)\)\s*;?$',text,re.S)
                      if not m: raise
                      obj=json.loads(m.group(1))
                  data=obj.get('data') or obj.get('Data') or obj.get('result') or []
                  if isinstance(data,dict):
                      data=data.get('data') or data.get('list') or data.get('records') or []
                  print('COUNT',len(data),'HITS',obj.get('hits'),'TOTALPAGE',obj.get('TotalPage') or obj.get('totalPage'))
                  for row in data:
                      print('ROW',json.dumps(row,ensure_ascii=False))
                  rows.extend(data)
                  total_page=obj.get('TotalPage') or obj.get('totalPage') or 1
                  try:
                      if page>=int(total_page): break
                  except Exception:
                      if not data: break
              if rows: break

          dedup={}
          for row in rows:
              info=str(row.get('infoCode') or row.get('info_code') or row.get('reportId') or '')
              if info: dedup[info]=row
          records=list(dedup.values())
          Path('output/baolidi_report_records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_RECORD_COUNT',len(records))
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: baolidi-broker-report-probe
          path: output/baolidi_report_records.json
          retention-days: 1
