name: South Precision Yanbaoke Download Probe

on:
  push:
    branches:
      - chatgpt-nanfangjinggong-reports-20260929
    paths:
      - .github/workflows/nanfang_yanbaoke_probe_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Inspect listing detail and download endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import io,json,re
          from pathlib import Path
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          start_urls=[
            'https://www.yanbaoke.com/tag/%E8%BD%B4%E6%89%BF',
            'https://www.yanbaoke.com/?s='+quote('南方精工'),
            'https://www.yanbaoke.com/search?q='+quote('南方精工'),
          ]
          detail_urls=[]
          for start in start_urls:
            try:
              r=session.get(start,timeout=60,allow_redirects=True)
              r.encoding=r.apparent_encoding or 'utf-8'
              print('\nSTART',start,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'),'ENC',r.encoding)
              Path('output/'+str(len(detail_urls))+'_listing.html').write_bytes(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              for a in soup.find_all('a',href=True):
                text=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                blob=text+' '+href
                if '南方精工' in blob or '国内滚针轴承民企龙头' in blob or '新能源汽车注入新活力' in blob or '进军飞机轮胎再制造' in blob:
                  print('MATCH_LINK',json.dumps({'text':text,'href':href},ensure_ascii=False))
                  if href not in detail_urls: detail_urls.append(href)
              for i,line in enumerate(r.text.splitlines(),1):
                if re.search(r'南方精工|国内滚针轴承民企龙头|新能源汽车注入新活力|进军飞机轮胎再制造|download|pdf',line,re.I):
                  print('LIST_LINE',i,line[:7000])
            except Exception as e: print('START_ERR',start,repr(e))

          print('\nDETAIL_URLS',json.dumps(detail_urls,ensure_ascii=False,indent=2))
          results=[]
          for idx,url in enumerate(detail_urls):
            try:
              r=session.get(url,timeout=60,allow_redirects=True)
              r.encoding=r.apparent_encoding or 'utf-8'
              html=r.text
              Path(f'output/detail_{idx}.html').write_bytes(r.content)
              soup=BeautifulSoup(html,'html.parser')
              print('\nDETAIL',idx,url,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'))
              print('DETAIL_TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              candidates=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data','data-src','data-url','data-file','value','content'):
                  v=tag.get(attr)
                  if not v or not isinstance(v,str): continue
                  full=urljoin(r.url,v.replace('\\/','/'))
                  blob=(tag.get_text(' ',strip=True)+' '+full+' '+str(tag.attrs)).lower()
                  if any(k in blob for k in ['.pdf','.doc','.ppt','download','file','attachment','preview','viewer','南方精工','002553']):
                    candidates.append({'tag':tag.name,'attr':attr,'text':tag.get_text(' ',strip=True)[:160],'url':full,'attrs':str(tag.attrs)[:500]})
              for pat in [r'https?://[^\"\'<>\\s]+',r'["\']([^"\']+\.(?:pdf|docx?|pptx?)(?:\?[^"\']*)?)["\']']:
                for m in re.finditer(pat,html,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=urljoin(r.url,v.replace('\\/','/'))
                  candidates.append({'tag':'regex','attr':'','text':'','url':v,'attrs':''})
              dedup=[]; seen=set()
              for c in candidates:
                u=c['url'].replace('&amp;','&')
                if u not in seen:
                  c['url']=u; dedup.append(c); seen.add(u)
              print('CANDIDATES',json.dumps(dedup,ensure_ascii=False,indent=2))
              for i,line in enumerate(html.splitlines(),1):
                if re.search(r'pdf|download|file|attachment|preview|viewer|api|南方精工|002553|docId|report',line,re.I):
                  print('DETAIL_LINE',i,line[:8000])

              scripts=[urljoin(r.url,t['src']) for t in soup.find_all('script',src=True)]
              for js_url in scripts:
                try:
                  jr=session.get(js_url,headers={'Referer':r.url},timeout=45)
                  jr.encoding=jr.apparent_encoding or 'utf-8'
                  if re.search(r'pdf|download|attachment|preview|viewer|api|fileUrl|docId',jr.text,re.I):
                    print('SCRIPT',js_url,jr.status_code,len(jr.content))
                    for j,line in enumerate(jr.text.splitlines(),1):
                      if re.search(r'pdf|download|attachment|preview|viewer|api|fileUrl|docId',line,re.I):
                        print('JSLINE',j,line[:8000])
                except Exception as e: print('SCRIPT_ERR',js_url,repr(e))

              for c in dedup:
                u=c['url']
                if not any(k in u.lower() for k in ['.pdf','download','attachment','file','preview']): continue
                try:
                  rr=session.get(u,headers={'Referer':r.url},timeout=120,allow_redirects=True)
                  print('TRY',u,rr.status_code,len(rr.content),rr.url,rr.headers.get('content-type'),repr(rr.content[:16]))
                  if rr.status_code==200 and rr.content.startswith(b'%PDF'):
                    reader=PdfReader(io.BytesIO(rr.content))
                    text=''
                    for p in range(min(3,len(reader.pages))):
                      try:text+=reader.pages[p].extract_text() or ''
                      except:pass
                    result={'detail':r.url,'pdf_url':u,'final_url':rr.url,'pages':len(reader.pages),'bytes':len(rr.content),'encrypted':bool(reader.is_encrypted),'text_excerpt':re.sub(r'\s+',' ',text)[:1500]}
                    results.append(result)
                    print('PDF_OK',json.dumps(result,ensure_ascii=False))
                except Exception as e: print('TRY_ERR',u,repr(e))
            except Exception as e: print('DETAIL_ERR',url,repr(e))
          Path('output/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\nFINAL_RESULTS',json.dumps(results,ensure_ascii=False,indent=2))
          PY

      - name: Upload probe metadata
        uses: actions/upload-artifact@v4
        with:
          name: nanfang-yanbaoke-probe
          path: output/
          retention-days: 1
