name: Build Xiangyang Bearing 000678 annual latest 20261005

on:
  push:
    paths:
      - '.github/workflows/xiangyang-bearing-000678-annual-latest-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = '000678'
          COMPANY = '襄阳轴承'
          FULL_COMPANY = '襄阳汽车轴承股份有限公司'
          TODAY = '2026-10-05'
          PACKAGE = '襄阳轴承_000678_2020-2025年报_2026最新半年度报告及一季报_官方原件'
          OUT = Path(PACKAGE)
          ART = Path('artifact_out')
          VERIFY = Path('verification_renders')
          for directory in (OUT, ART, VERIFY):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Origin': 'https://www.cninfo.com.cn',
              'Referer': 'https://www.cninfo.com.cn/',
              'X-Requested-With': 'XMLHttpRequest',
          })

          def get_json(url: str) -> Any:
              last: Exception | None = None
              for attempt in range(1, 5):
                  try:
                      response = session.get(url, timeout=(30, 180), allow_redirects=True)
                      print('GET', attempt, response.status_code, len(response.content), response.url, flush=True)
                      response.raise_for_status()
                      return response.json()
                  except Exception as exc:
                      last = exc
                      print('GET_ERR', attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'GET failed {url}: {last!r}')

          payload = get_json('https://www.cninfo.com.cn/new/data/szse_stock.json')
          stock_candidates: list[str] = []

          def walk(obj: Any) -> None:
              if isinstance(obj, dict):
                  blob = json.dumps(obj, ensure_ascii=False)
                  code = str(obj.get('code') or obj.get('secCode') or obj.get('stockCode') or obj.get('SECCODE') or '')
                  name = str(obj.get('zwjc') or obj.get('secName') or obj.get('stockName') or obj.get('name') or '')
                  org_id = obj.get('orgId') or obj.get('orgID') or obj.get('orgid')
                  if CODE in (code + blob) and (COMPANY in (name + blob) or FULL_COMPANY in blob) and org_id:
                      stock_candidates.append(f'{CODE},{org_id}')
                  for value in obj.values():
                      walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      walk(value)

          walk(payload)
          stock_candidates.extend([f'{CODE},gssz0000678', f'{CODE},9900000678', CODE])
          stock_candidates = list(dict.fromkeys(stock_candidates))
          print('STOCK_CANDIDATES', stock_candidates, flush=True)

          def post_query(stock_value: str, category: str, searchkey: str, date_range: str, page_num: int, page_size: int = 100) -> dict[str, Any]:
              url = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              data = {
                  'pageNum': str(page_num),
                  'pageSize': str(page_size),
                  'column': 'szse',
                  'tabName': 'fulltext',
                  'plate': 'sz',
                  'stock': stock_value,
                  'searchkey': searchkey,
                  'secid': '',
                  'category': category,
                  'trade': '',
                  'seDate': date_range,
                  'sortName': '',
                  'sortType': '',
                  'isHLtitle': 'true',
              }
              last: Exception | None = None
              for attempt in range(1, 5):
                  try:
                      response = session.post(url, data=data, timeout=(30, 180), allow_redirects=True)
                      print('QUERY', attempt, response.status_code, len(response.content), stock_value, category, searchkey, date_range, page_num, flush=True)
                      response.raise_for_status()
                      return response.json()
                  except Exception as exc:
                      last = exc
                      print('QUERY_ERR', attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'CNInfo query failed: {last!r}')

          categories = [
              'category_ndbg_szsh;category_bndbg_szsh;category_yjdbg_szsh;category_sjdbg_szsh',
              'category_ndbg_szsh',
              'category_bndbg_szsh;category_yjdbg_szsh;category_sjdbg_szsh',
          ]

          best_announcements: list[dict[str, Any]] = []
          chosen_stock = ''
          for stock_value in stock_candidates:
              local: list[dict[str, Any]] = []
              try:
                  for category in categories:
                      first = post_query(stock_value, category, '', f'2019-01-01~{TODAY}', 1, 100)
                      local.extend(first.get('announcements') or [])
                      total_pages = int(first.get('totalpages') or first.get('totalPages') or 1)
                      for page in range(2, min(total_pages, 10) + 1):
                          local.extend((post_query(stock_value, category, '', f'2019-01-01~{TODAY}', page, 100).get('announcements') or []))

                  for year in range(2019, 2027):
                      end = TODAY if year == 2026 else f'{year}-12-31'
                      date_range = f'{year}-01-01~{end}'
                      first = post_query(stock_value, '', '', date_range, 1, 100)
                      local.extend(first.get('announcements') or [])
                      total_pages = int(first.get('totalpages') or first.get('totalPages') or 1)
                      for page in range(2, min(total_pages, 10) + 1):
                          local.extend((post_query(stock_value, '', '', date_range, page, 100).get('announcements') or []))

                  if len(local) > len(best_announcements):
                      best_announcements = local
                      chosen_stock = stock_value
                  if local:
                      titles = ''.join(str(item.get('announcementTitle') or '') for item in local)
                      if '2025年年度报告' in titles and '2020年年度报告' in titles and '2026年半年度报告' in titles:
                          best_announcements = local
                          chosen_stock = stock_value
                          break
              except Exception as exc:
                  print('QUERY_VARIANT_ERR', stock_value, repr(exc), flush=True)

          if not best_announcements:
              raise RuntimeError('CNInfo returned no announcements for 襄阳轴承 000678')

          unique: dict[str, dict[str, Any]] = {}
          for item in best_announcements:
              code_blob = str(item.get('secCode') or item.get('stockCode') or '')
              name_blob = str(item.get('secName') or item.get('stockName') or '')
              if code_blob and CODE not in code_blob:
                  continue
              if name_blob and COMPANY not in name_blob and FULL_COMPANY not in name_blob:
                  continue
              key = str(item.get('announcementId') or item.get('adjunctUrl') or json.dumps(item, ensure_ascii=False, sort_keys=True))
              unique[key] = item
          announcements = list(unique.values())
          print('CHOSEN_STOCK', chosen_stock, 'ANNOUNCEMENT_COUNT', len(announcements), flush=True)
          if not announcements:
              raise RuntimeError('Filtered CNInfo announcements are empty')

          def plain_title(item: dict[str, Any]) -> str:
              title = str(item.get('announcementTitle') or item.get('title') or '')
              title = re.sub(r'<[^>]+>', '', title).replace('&nbsp;', ' ')
              return re.sub(r'\s+', ' ', title).strip()

          def pub_date(item: dict[str, Any]) -> str:
              value = item.get('announcementTime') or item.get('publishTime') or item.get('announcementDate')
              if isinstance(value, (int, float)):
                  return datetime.fromtimestamp(value / 1000, tz=timezone.utc).strftime('%Y-%m-%d')
              text = str(value or '')
              match = re.search(r'(20\d{2})[-/](\d{1,2})[-/](\d{1,2})', text)
              if match:
                  return f'{match.group(1)}-{int(match.group(2)):02d}-{int(match.group(3)):02d}'
              return text[:10]

          def pdf_url(item: dict[str, Any]) -> str:
              value = str(item.get('adjunctUrl') or item.get('url') or '').strip()
              if not value:
                  raise RuntimeError(f'No PDF URL: {item}')
              return value if value.startswith('http') else 'https://static.cninfo.com.cn/' + value.lstrip('/')

          excluded_common = [
              '摘要', '英文', '审计报告', '财务报告', '社会责任', 'ESG',
              '问询函', '取消', '提示性公告', '披露提示', '董事会决议', '监事会决议',
          ]

          annual_candidates: dict[int, list[tuple[tuple[int, int, str], dict[str, Any]]]] = {}
          for item in announcements:
              title = plain_title(item)
              if any(term in title for term in excluded_common):
                  continue
              match = re.search(r'(20\d{2})年年度报告', title)
              if not match:
                  continue
              year = int(match.group(1))
              if year < 2020 or year > 2025:
                  continue
              exact = int(bool(re.fullmatch(
                  rf'(?:襄阳轴承|襄阳汽车轴承股份有限公司)?[:：]?{year}年年度报告(?:（修订版）|\(修订版\)|（更新后）|\(更新后\))?',
                  title,
              )))
              revised = int(any(term in title for term in ['修订版', '更新后']))
              annual_candidates.setdefault(year, []).append(((exact, revised, pub_date(item)), item))

          annual_by_year: dict[int, dict[str, Any]] = {}
          for year, candidates in annual_candidates.items():
              candidates.sort(key=lambda entry: entry[0], reverse=True)
              annual_by_year[year] = candidates[0][1]

          expected_annual_years = list(range(2020, 2026))
          if not all(year in annual_by_year for year in expected_annual_years):
              found_titles = [plain_title(x) for x in announcements if '年度报告' in plain_title(x)]
              raise RuntimeError(f'Missing annual report(s); found years={sorted(annual_by_year)} titles={found_titles[:80]}')

          half_candidates: list[tuple[int, str, dict[str, Any]]] = []
          quarter_candidates: list[tuple[int, str, str, dict[str, Any]]] = []
          for item in announcements:
              title = plain_title(item)
              if any(term in title for term in excluded_common):
                  continue
              half = re.search(r'(20\d{2})年半年度报告', title)
              q1 = re.search(r'(20\d{2})年(?:第一|一)季度报告', title)
              q3 = re.search(r'(20\d{2})年(?:第三|三)季度报告', title)
              if half:
                  half_candidates.append((int(half.group(1)), pub_date(item), item))
              if q1:
                  quarter_candidates.append((int(q1.group(1)) * 10 + 1, pub_date(item), '第一季度报告', item))
              if q3:
                  quarter_candidates.append((int(q3.group(1)) * 10 + 3, pub_date(item), '第三季度报告', item))

          if not half_candidates or not quarter_candidates:
              raise RuntimeError('Latest half-year or quarterly report not found')
          half_candidates.sort(key=lambda entry: (entry[0], entry[1]), reverse=True)
          quarter_candidates.sort(key=lambda entry: (entry[0], entry[1]), reverse=True)
          half_year, _, half_item = half_candidates[0]
          quarter_period, _, quarter_kind, quarter_item = quarter_candidates[0]
          quarter_year = quarter_period // 10
          if half_year < 2026 or quarter_year < 2026:
              raise RuntimeError(f'Latest reports unexpectedly old: half={half_year}, quarter={quarter_year} {quarter_kind}')

          selected: list[dict[str, Any]] = []
          counter = 1
          for year in expected_annual_years:
              item = annual_by_year[year]
              selected.append({
                  'filename': f'{counter:02d}_襄阳轴承_000678_{year}年年度报告.pdf',
                  'category': '年度报告',
                  'report_year': year,
                  'title': plain_title(item),
                  'disclosure_date': pub_date(item),
                  'source_url': pdf_url(item),
                  'min_pages': 70,
              })
              counter += 1
          selected.append({
              'filename': f'{counter:02d}_襄阳轴承_000678_{half_year}年半年度报告_最新中期报告.pdf',
              'category': '最新半年度报告',
              'report_year': half_year,
              'title': plain_title(half_item),
              'disclosure_date': pub_date(half_item),
              'source_url': pdf_url(half_item),
              'min_pages': 35,
          })
          counter += 1
          selected.append({
              'filename': f'{counter:02d}_襄阳轴承_000678_{quarter_year}年{quarter_kind}_最新季报.pdf',
              'category': f'最新{quarter_kind}',
              'report_year': quarter_year,
              'title': plain_title(quarter_item),
              'disclosure_date': pub_date(quarter_item),
              'source_url': pdf_url(quarter_item),
              'min_pages': 5,
          })
          print('SELECTED', json.dumps(selected, ensure_ascii=False, indent=2), flush=True)

          def download_pdf(url: str, destination: Path) -> str:
              headers = {
                  'User-Agent': session.headers['User-Agent'],
                  'Referer': 'https://www.cninfo.com.cn/',
                  'Accept': 'application/pdf,*/*',
              }
              last: Exception | None = None
              for attempt in range(1, 5):
                  temporary = destination.with_suffix('.pdf.part')
                  try:
                      with requests.get(url, headers=headers, timeout=(30, 360), allow_redirects=True, stream=True) as response:
                          print('DOWNLOAD', destination.name, attempt, response.status_code, url, 'FINAL', response.url, flush=True)
                          response.raise_for_status()
                          with temporary.open('wb') as handle:
                              for chunk in response.iter_content(1024 * 1024):
                                  if chunk:
                                      handle.write(chunk)
                          final_url = response.url
                      data = temporary.read_bytes()
                      if len(data) < 50_000 or not data.startswith(b'%PDF-'):
                          raise RuntimeError('Invalid PDF response')
                      temporary.replace(destination)
                      return str(final_url)
                  except Exception as exc:
                      last = exc
                      temporary.unlink(missing_ok=True)
                      print('DOWNLOAD_ERR', destination.name, attempt, repr(exc), flush=True)
                      time.sleep(attempt * 2)
              raise RuntimeError(f'Download failed {destination.name}: {last!r}')

          def extract_sample(reader: PdfReader) -> str:
              count = len(reader.pages)
              indices = list(range(min(30, count)))
              if count > 35:
                  indices += list(range(max(0, count - 4), count))
              parts: list[str] = []
              for index in dict.fromkeys(indices):
                  try:
                      parts.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              return '\n'.join(parts)

          records: list[dict[str, Any]] = []
          seen_hashes: set[str] = set()
          for document in selected:
              destination = OUT / document['filename']
              final_url = download_pdf(document['source_url'], destination)
              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < document['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {destination.name}: {pages}')
              sample = extract_sample(reader)
              low = sample.lower()
              identity = COMPANY in sample or FULL_COMPANY in sample or CODE in sample or 'xiangyang' in low
              if not identity:
                  raise RuntimeError(f'Company identity not verified in {destination.name}')
              check = subprocess.run(['qpdf', '--check', str(destination)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed {destination.name}: {check.stderr[-1000:]}')
              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                  raise RuntimeError(f'Duplicate PDF: {destination.name}')
              seen_hashes.add(digest)
              record = {
                  **{key: document[key] for key in ('filename','category','report_year','title','disclosure_date')},
                  'source': '巨潮资讯网',
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '襄阳轴承（000678.SZ；襄阳汽车轴承股份有限公司）2020—2025年年度报告及最新定期财务报告',
              '整理日期：2026-10-05',
              '',
              '收录范围：',
              '1. 2020—2025年完整年度报告，共6份。若存在修订版或更新后版本，优先保留较新正式版本。',
              f'2. 最新完整半年度报告：{records[-2]["title"]}。',
              f'3. 严格意义上的最新季度报告：{records[-1]["title"]}。',
              '',
              '同时保留半年度报告与季度报告，是为了避免“最新季报”在日常口径和监管披露口径之间的歧义。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme += [
                  f'{index}. {record["filename"]}',
                  f'   类别：{record["category"]}；报告年度：{record["report_year"]}；披露日期：{record["disclosure_date"]}',
                  f'   官方标题：{record["title"]}',
                  f'   页数：{record["pages"]}；大小：{record["bytes"] / 1048576:.2f} MB',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ]
          readme.append('完整性核验：已检查PDF文件头、公司身份、实际页数、qpdf结构、重复文件及SHA-256；最终ZIP已通过CRC测试。')
          (OUT / '00_文件清单与范围说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in records), encoding='utf-8')
          (OUT / 'CNINFO公告索引.json').write_text(json.dumps(announcements, ensure_ascii=False, indent=2), encoding='utf-8')

          render_indices = [0, max(i for i, r in enumerate(records) if r['category'] == '年度报告'), len(records) - 2, len(records) - 1]
          for order, record_index in enumerate(dict.fromkeys(render_indices), 1):
              source = OUT / records[record_index]['filename']
              prefix = VERIFY / f'{order:02d}'
              result = subprocess.run([
                  'pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '110', str(source), str(prefix)
              ], capture_output=True, text=True)
              if result.returncode != 0:
                  raise RuntimeError(f'PDF render failed for {source.name}: {result.stderr[-1000:]}')

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != len(records):
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)} vs {len(records)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: xiangyang-bearing-000678-annual-latest-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: xiangyang-bearing-000678-verification-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
