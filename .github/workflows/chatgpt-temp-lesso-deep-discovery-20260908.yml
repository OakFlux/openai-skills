name: chatgpt-temp-lesso-deep-discovery-20260908
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-lesso-deep-discovery-20260908.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query public research APIs and pages
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python <<'PY'
          import json,re,urllib.parse,time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          W=Path('lesso_deep_discovery');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          logs=[]
          def L(x):x=str(x);print(x,flush=True);logs.append(x)
          def get(name,url,headers=None):
            try:
              r=s.get(url,headers=headers or {},timeout=90,allow_redirects=True)
              (W/name).write_bytes(r.content)
              L(f'GET {name} status={r.status_code} bytes={len(r.content)} type={r.headers.get("content-type")} final={r.url} head={r.text[:250]!r}')
              return r
            except Exception as e:L(f'GET_ERROR {name} {url} {e!r}');return None
          def post(name,url,payload,mode='json'):
            try:
              h={'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/','Accept':'application/json,text/plain,*/*'}
              r=s.post(url,json=payload if mode=='json' else None,data=payload if mode=='form' else None,headers=h,timeout=90)
              (W/name).write_bytes(r.content)
              L(f'POST {name} status={r.status_code} bytes={len(r.content)} type={r.headers.get("content-type")} head={r.text[:250]!r}')
              return r
            except Exception as e:L(f'POST_ERROR {name} {e!r}');return None
          # Eastmoney report APIs, with multiple stock-code conventions.
          base='https://reportapi.eastmoney.com/report/list'
          for i,code in enumerate(['02128','2128','HK02128','02128.HK']):
            q={'cb':'datatable','qType':'0','code':code,'pageSize':'100','pageNo':'1','beginTime':'2020-01-01','endTime':'2026-09-08','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'','fields':''}
            get(f'eastmoney_report_{i}.txt',base+'?'+urllib.parse.urlencode(q),{'Referer':'https://data.eastmoney.com/report/'})
          dc='https://datacenter-web.eastmoney.com/api/data/v1/get'
          for i,code in enumerate(['02128','2128']):
            q={'reportName':'RPT_RESEARCHREPORT_LIST','columns':'ALL','filter':f'(SECURITY_CODE="{code}")','pageNumber':'1','pageSize':'200','sortColumns':'REPORT_DATE','sortTypes':'-1','source':'WEB','client':'WEB'}
            get(f'eastmoney_dc_{i}.json',dc+'?'+urllib.parse.urlencode(q),{'Referer':'https://data.eastmoney.com/'})
          # Exact-title searches in the public index.
          terms=['中国联塑','工程塑管龙头，行业稳健强者愈强','工程塑管龙头，重视成长弹性及持续性','战略重心重回管道主业','2024年股东应占溢利同比减少28.9']
          all_hits=[]
          for i,term in enumerate(terms):
            payload={'device':1,'hideTrader':0,'onlyTitle':1,'order':0,'page':1,'pageSize':100,'keyword':term,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
            r=post(f'sdy_title_{i}.json','https://api.sdyanbao.com/api/file/search',payload)
            if r:
              try:
                obj=r.json();files=(obj.get('data') or {}).get('files') or []
                for x in files:
                  name=x.get('name','')
                  if term in name or ('中国联塑' in name and term=='中国联塑'):
                    all_hits.append(x);L('SDY_HIT '+json.dumps({k:x.get(k) for k in ['id','name','page_count','page_url','online_url','share_url','original_id','time_text','file_size','organization','type','stock']},ensure_ascii=False))
              except Exception as e:L(f'SDY_JSON_ERROR {i} {e!r}')
          # De-duplicate exact China Lesso hits and fetch public detail pages/API.
          uniq={int(x['id']):x for x in all_hits if x.get('id')}
          (W/'sdy_hits.json').write_text(json.dumps(list(uniq.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          for rid,x in uniq.items():
            get(f'sdy_page_{rid}.html',f'https://www.sdyanbao.com/detail/{rid}',{'Referer':'https://www.sdyanbao.com/'})
            for j,payload in enumerate([{'id':rid},{'fileId':rid},{'file_id':rid}]):
              post(f'sdy_detail_{rid}_{j}.json','https://api.sdyanbao.com/api/file/detail',payload)
          # Candidate public pages/mirrors.
          pages={
            'college_huatai.html':'https://www.collegesidekick.com/study-docs/5116858',
            'sgpjbg_huatai.html':'https://www.sgpjbg.com/baogao/141553.html',
            'jiufang_guangfa.html':'https://gmg.9fzt.com/report/HKSE/02128/767458486919.html',
            'sina_tianfeng.html':'https://finance.sina.cn/2022-01-23/detail-ikyakumy2055362.d.html',
            'hangyan_haitong.html':'https://www.hangyan.co/reports/3602560054089221584',
          }
          for n,u in pages.items():get(n,u)
          # Extract PDF-like URLs and API clues from all downloaded text.
          clues=[]
          for f in W.iterdir():
            if not f.is_file():continue
            try:t=f.read_text(encoding='utf-8',errors='ignore')
            except:continue
            urls=re.findall(r'https?://[^\"\'<>\\ ]+',t)
            for u in urls:
              ul=u.lower()
              if '.pdf' in ul or 'download' in ul or 'reportapi' in ul or 'file_url' in ul or 'pdfurl' in ul:
                clues.append({'file':f.name,'url':u[:1000]})
          (W/'clues.json').write_text(json.dumps(clues,ensure_ascii=False,indent=2),encoding='utf-8')
          (W/'run.log').write_text('\n'.join(logs)+'\n',encoding='utf-8')
          L(f'FINAL hits={len(uniq)} clues={len(clues)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: China-Lesso-deep-discovery
          path: lesso_deep_discovery
          retention-days: 1
          compression-level: 0
