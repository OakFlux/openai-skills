name: Probe Guangju 000096 Eastmoney qType1

on:
  push:
    branches:
      - tmp/guangju-000096-broker-reports-20261104-v1
    paths:
      - .github/workflows/guangju-000096-eastmoney-qtype1-probe-20261104-v5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe qType and parameter variants
        run: |
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Referer":"https://data.eastmoney.com/report/000096.html","Accept":"application/json,text/plain,*/*"})
          endpoints=["https://reportapi.eastmoney.com/report/list","https://reportapi.eastmoney.com/report/list2"]
          for endpoint in endpoints:
            for method in ["GET","POST_FORM","POST_JSON"]:
              for qtype in ["0","1",1,None]:
                for codekey in ["code","stockCode","securityCode"]:
                  body={
                    "pageSize":100,"pageNo":1,"p":1,"pageNum":1,"pageNumber":1,
                    "beginTime":"2010-01-01","endTime":"2026-11-04",
                    codekey:"000096","industryCode":"*","industry":"*",
                    "rating":None,"ratingChange":None,"orgCode":None,"rcode":"","fields":""
                  }
                  if qtype is not None: body["qType"]=qtype
                  try:
                    if method=="GET": r=s.get(endpoint,params=body,timeout=(15,90))
                    elif method=="POST_FORM": r=s.post(endpoint,data=body,timeout=(15,90))
                    else: r=s.post(endpoint,json=body,headers={"Content-Type":"application/json","Referer":"https://data.eastmoney.com/report/"},timeout=(15,90))
                    try: obj=r.json()
                    except: obj=None
                    rows=(obj or {}).get("data") or [] if isinstance(obj,dict) else []
                    hits=(obj or {}).get("hits") if isinstance(obj,dict) else None
                    if rows or hits or r.status_code!=200 or len(r.content)>150:
                      print("RESULT",endpoint,method,"qtype",qtype,"codekey",codekey,"status",r.status_code,"bytes",len(r.content),"hits",hits,"rows",len(rows),"text",r.text[:500])
                      for row in rows[:20]: print("ROW",json.dumps(row,ensure_ascii=False))
                  except Exception as exc:
                    print("ERROR",endpoint,method,qtype,codekey,repr(exc))
                  time.sleep(0.05)
          PY
