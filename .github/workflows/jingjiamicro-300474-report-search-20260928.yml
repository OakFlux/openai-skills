name: Inspect Jingjia Micro deep report metadata 20260928
on:
  push:
    paths:
      - '.github/workflows/jingjiamicro-300474-report-search-20260928.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch detail records
        run: |
          mkdir -p out
          python - <<'PY'
          import json, requests, time
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          ids=[903033,863963,772233,375181,336500,322536,271894]
          out={}
          for rid in ids:
              try:
                  r=s.post('https://api.sdyanbao.com/api/file/detail',json={'id':rid},timeout=60)
                  out[str(rid)]={'status':r.status_code,'body':r.json() if r.status_code==200 else r.text[:1000]}
              except Exception as e:
                  out[str(rid)]={'error':repr(e)}
              time.sleep(.2)
          Path('out/details.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:200000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jingjiamicro-report-details
          path: out
          retention-days: 7
