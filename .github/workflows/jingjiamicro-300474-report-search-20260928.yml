name: Build Jingjia Micro broker deep report previews 20260928

on:
  push:
    paths:
      - '.github/workflows/jingjiamicro-300474-report-search-20260928.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download public previews, build PDFs and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from io import BytesIO
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '景嘉微_300474_券商深度报告_公开预览版_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)
          work = Path('_jingjiamicro_report_work')
          work.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'report_id': 903033,
                  'broker': '华创证券',
                  'title': '景嘉微（300474）深度研究报告：专用GPU迭代破局，拥抱通用广阔市场',
                  'short_title': '专用GPU迭代破局，拥抱通用广阔市场',
                  'report_date': '2025-07-27',
                  'index_date': '2025-08-04',
                  'analysts': '吴鸣远；联系人：周楚薇',
                  'rating': '强推（维持）',
                  'target_price': '94.40元',
                  'original_pages': 31,
                  'page_url': 'https://oss.sdyanbao.com/page/2025/8/4/1218142',
              },
              {
                  'order': 2,
                  'report_id': 863963,
                  'broker': '浙商证券',
                  'title': '景嘉微（300474）深度报告：国产GPU先锋，技术积淀与研发优势驱动未来',
                  'short_title': '国产GPU先锋，技术积淀与研发优势驱动未来',
                  'report_date': '2025-03-17',
                  'index_date': '2025-03-25',
                  'analysts': '刘雯蜀、童非；研究助理：张致远',
                  'rating': '买入（首次）',
                  'target_price': '未在公开首页列示',
                  'original_pages': 21,
                  'page_url': 'https://oss.sdyanbao.com/page/2025/3/25/1159756',
              },
              {
                  'order': 3,
                  'report_id': 772233,
                  'broker': '民生证券',
                  'title': '景嘉微（300474）深度报告：国产GPU龙头，入局大算力时代',
                  'short_title': '国产GPU龙头，入局大算力时代',
                  'report_date': '2024-06-13',
                  'index_date': '2024-06-14',
                  'analysts': '方竞、宋晓东、孔厚融',
                  'rating': '推荐（首次评级）',
                  'target_price': '未在公开首页列示',
                  'original_pages': 31,
                  'page_url': 'https://oss.sdyanbao.com/page/2024/6/14/1023300',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def fetch_image(url: str) -> bytes:
              last = None
              for attempt in range(6):
                  try:
                      r = session.get(
                          url,
                          timeout=(20, 120),
                          allow_redirects=True,
                          headers={
                              'User-Agent': session.headers['User-Agent'],
                              'Referer': 'https://www.sdyanbao.com/',
                              'Accept': 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                          },
                      )
                      last = {
                          'status': r.status_code,
                          'bytes': len(r.content),
                          'content_type': r.headers.get('content-type',''),
                          'final_url': r.url,
                      }
                      if r.status_code == 200 and len(r.content) > 10000:
                          with Image.open(BytesIO(r.content)) as im:
                              im.verify()
                          return r.content
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Image download failed {url}: {last}')

          manifest = []
          for report in reports:
              preview_pages = min(10, int(report['original_pages']))
              wdir = work / f"r{report['order']}"
              wdir.mkdir(exist_ok=True)
              page_files = []
              source_images = []
              for pno in range(preview_pages):
                  source_url = f"{report['page_url'].rstrip('/')}/{pno}.png"
                  raw = fetch_image(source_url)
                  src = wdir / f'{pno:02d}_source.png'
                  src.write_bytes(raw)
                  with Image.open(src) as im:
                      rgba = im.convert('RGBA')
                      white = Image.new('RGBA', rgba.size, (255,255,255,255))
                      white.alpha_composite(rgba)
                      rgb = white.convert('RGB')
                      out = wdir / f'{pno:02d}.jpg'
                      rgb.save(out, 'JPEG', quality=95, subsampling=0)
                      page_files.append(out)
                      source_images.append({
                          'page': pno + 1,
                          'url': source_url,
                          'source_bytes': len(raw),
                          'width': rgb.width,
                          'height': rgb.height,
                      })

              safe_title = re.sub(r'[\\/:*?"<>|]+', '_', report['short_title'])
              pdf_name = (
                  f"{report['order']:02d}_{report['broker']}_景嘉微_{safe_title}_"
                  f"公开预览前{preview_pages}页_{report['report_date']}.pdf"
              )
              pdf_path = root / pdf_name
              images = [Image.open(p).convert('RGB') for p in page_files]
              try:
                  images[0].save(
                      pdf_path,
                      save_all=True,
                      append_images=images[1:],
                      resolution=150.0,
                      quality=95,
                  )
              finally:
                  for im in images:
                      im.close()

              reader = PdfReader(str(pdf_path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != preview_pages:
                  raise RuntimeError(f'PDF page mismatch {pdf_name}: {actual_pages} vs {preview_pages}')
              subprocess.run(
                  ['qpdf','--check',str(pdf_path)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = preview_dir / pdf_path.stem
              subprocess.run(
                  ['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(pdf_path),str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              cover = Path(str(prefix) + '.png')
              if not cover.exists() or cover.stat().st_size < 10000:
                  raise RuntimeError(f'Cover render failed: {pdf_name}')

              sha = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              manifest.append({
                  **report,
                  'source_detail_page': f"https://www.sdyanbao.com/detail/{report['report_id']}",
                  'public_preview_pages': preview_pages,
                  'pdf_file': pdf_name,
                  'actual_pdf_pages': actual_pages,
                  'bytes': pdf_path.stat().st_size,
                  'sha256': sha,
                  'cover_preview': str(Path('首页预览') / cover.name),
                  'source_images': source_images,
                  'document_nature': '公开预览原页；非券商原始完整PDF',
                  'validation': [
                      'all public preview images downloaded',
                      'source image integrity',
                      'transparent background composited to white',
                      'PDF page count',
                      'qpdf structure',
                      'first-page render',
                  ],
              })

          readme = [
              '景嘉微（300474.SZ）券商深度报告公开预览资料包',
              '整理日期：2026-09-28',
              '',
              '本包收录3份较新的券商公司深度报告，每份均保存公开展示的前10页原始预览页面。',
              '完整原始PDF在相关研报平台需要账户或下载权限；本包未绕过登录、会员或付费访问控制，因此全部文件均明确标注为“公开预览版”。',
              '',
          ]
          for i, r in enumerate(manifest, 1):
              readme += [
                  f"{i}. {r['broker']}：《{r['title']}》",
                  f"   报告日期：{r['report_date']}；公开索引日期：{r['index_date']}",
                  f"   分析师：{r['analysts']}；评级：{r['rating']}；目标价：{r['target_price']}",
                  f"   原报告：{r['original_pages']}页；本PDF：公开预览前{r['public_preview_pages']}页",
                  f"   来源页面：{r['source_detail_page']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += [
              '报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：预览图片完整性、白底校正、PDF页数、PDF结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / 'SHA256SUMS.txt').write_text(
              ''.join(f"{r['sha256']}  {r['pdf_file']}\n" for r in manifest),
              encoding='utf-8',
          )

          zpath = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')

          english = Path('Jingjia_Micro_300474_Broker_Deep_Reports_Public_Previews_3.zip')
          english.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP', zpath, zpath.stat().st_size, hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: jingjiamicro-300474-broker-deep-reports-public-previews-final
          path: |
            景嘉微_300474_券商深度报告_公开预览版_3份.zip
            Jingjia_Micro_300474_Broker_Deep_Reports_Public_Previews_3.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
