name: Query China Baoan reports with correct wildcards
on:
  push:
    paths:
      - '.github/workflows/china-baoan-reportapi-correct-probe-20261016.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          python - <<'PY'
          import json,time,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          url='https://reportapi.eastmoney.com/report/list'
          for code in ['000009','SZ000009','000009.SZ']:
            cb='datatable'+str(int(time.time()*1000))
            params={'cb':cb,'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2030-01-01','pageNo':'1','qType':'0','orgCode':'*','code':code,'rcode':'*','p':'1','pageNum':'1','pageNumber':'1','_':str(int(time.time()*1000))}
            r=s.get(url,params=params,timeout=60)
            text=r.text.strip()
            if text.startswith(cb+'(') and text.endswith(')'): text=text[len(cb)+1:-1]
            print('CODE',code,'STATUS',r.status_code,'URL',r.url,'BYTES',len(r.content),flush=True)
            print(text[:60000],flush=True)
          PY
