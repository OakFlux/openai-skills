name: Temporary Inspect SGPJBG Download Implementation

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-inspect-sgpjbg-known-page.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect known report pages and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,json,re,requests
          from urllib.parse import urljoin,unquote
          pages=['https://www.sgpjbg.com/baogao/129588.html','https://www.sgpjbg.com/bgdown/129588.html','https://www.sgpjbg.com/baogao/129617.html','https://www.sgpjbg.com/bgdown/129617.html']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/'})
          scripts=set()
          for url in pages:
            r=s.get(url,timeout=90,allow_redirects=True);t=html.unescape(r.text).replace('\\/','/')
            print('PAGE='+json.dumps({'url':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'cookies':s.cookies.get_dict()},ensure_ascii=False))
            urls=[]
            for pat in [r'https?://[^"\'<>\s]+',r'(?:href|src|action|data|value)=["\']([^"\']+)["\']']:
              for v in re.findall(pat,t,re.I):
                if isinstance(v,tuple):v=v[0]
                u=urljoin(r.url,html.unescape(unquote(v)))
                if any(k in u.lower() for k in ['pdf','down','download','file','report','view','preview','upload','img','baogao','bgdown']):
                  if u not in urls:urls.append(u)
            print('URLS='+json.dumps({'url':url,'urls':urls[:400]},ensure_ascii=False))
            contexts=[]
            for needle in ['download','下载PDF','立即下载','bgdown','pdf','fileurl','downurl','reportid','docid','getfile','ajax','login','积分','preview','viewer']:
              for m in list(re.finditer(needle,t,re.I))[:40]:
                frag=re.sub(r'\s+',' ',t[max(0,m.start()-500):m.start()+1600])
                if frag not in contexts:contexts.append(frag)
            print('CONTEXTS='+json.dumps({'url':url,'contexts':contexts[:160]},ensure_ascii=False))
            for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):scripts.add(urljoin(r.url,src))
          print('SCRIPTS='+json.dumps(sorted(scripts),ensure_ascii=False))
          for su in sorted(scripts):
            try:
              q=s.get(su,timeout=90);body=q.text.replace('\\/','/')
              contexts=[]
              for needle in ['download','bgdown','pdf','fileurl','downurl','reportid','docid','getfile','ajax','login','viewer']:
                for m in list(re.finditer(needle,body,re.I))[:50]:
                  frag=re.sub(r'\s+',' ',body[max(0,m.start()-500):m.start()+1800])
                  if frag not in contexts:contexts.append(frag)
              if contexts:print('SCRIPT_CONTEXTS='+json.dumps({'url':su,'status':q.status_code,'bytes':len(q.content),'contexts':contexts[:200]},ensure_ascii=False))
            except Exception as e:print('SCRIPT_ERR='+json.dumps({'url':su,'error':repr(e)},ensure_ascii=False))
          PY
