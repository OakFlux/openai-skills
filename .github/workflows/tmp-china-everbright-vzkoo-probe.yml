name: Temporary Vzkoo report probe

on:
  push:
    branches:
      - tmp/china-everbright-vzkoo-probe-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,requests,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6'})
          urls=['https://www.vzkoo.com/read/4661212100247425024.html','https://www.vzkoo.com/read/4661212100247425024']
          for u in urls:
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              print('\nFETCH',r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
              r.encoding=r.apparent_encoding or r.encoding or 'utf-8'; h=r.text
              print('START',repr(h[:1000]),'END',repr(h[-2000:]),flush=True)
              soup=BeautifulSoup(h,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None,'TEXT_LEN',len(soup.get_text('\n',strip=True)),flush=True)
              for tag in soup.find_all(['a','iframe','embed','object','source','img','script','button']):
                attrs=dict(tag.attrs); txt=tag.get_text(' ',strip=True)
                blob=(txt+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in blob for k in ['pdf','download','下载','4661212100247425024','oss','file','report']):
                  print('NODE',tag.name,'TEXT',repr(txt[:200]),'ATTRS',json.dumps(attrs,ensure_ascii=False),flush=True)
              for idx,tag in enumerate(soup.find_all('script')):
                val=tag.string or tag.get_text('',strip=False)
                if val and any(k in val.lower() for k in ['pdf','download','4661212100247425024','fileurl','oss','report']):
                  print('SCRIPT',idx,'SRC',tag.get('src'),'LEN',len(val),'START',repr(val[:5000]),'END',repr(val[-5000:]),flush=True)
              raw_urls=sorted(set(re.findall(r'https?://[^\"\'<>\\s]+',h)))
              print('URLS',json.dumps([x for x in raw_urls if any(k in x.lower() for k in ['pdf','download','file','oss','report'])][:500],ensure_ascii=False),flush=True)
            except Exception as e:
              print('ERROR',u,repr(e),flush=True)
          PY
