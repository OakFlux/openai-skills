name: Inspect Shimao property investor reports 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-property-ir-discovery-20261012.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect IR site and APIs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re, json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-TW,zh;q=0.9,en;q=0.8'})
          urls=[
            'https://www.shimaoproperty.com/zh-TW/Shimao/Index',
            'http://www.shimaoproperty.com/zh-TW/Shimao/Index',
            'https://www.shimaoproperty.com/zh-CN/Shimao/Index',
            'https://www.shimaoproperty.com/en-US/Shimao/Index',
            'https://www.shimaoproperty.com/',
          ]
          for url in urls:
            try:
              r=s.get(url,timeout=60,allow_redirects=True,verify=True)
              print('\nPAGE',url,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,flush=True)
              print('HEAD',r.text[:5000].replace('\n',' '),flush=True)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for tag in soup.find_all(['a','script','link','iframe','source']):
                for a in ('href','src','data-url','data-href','data-src'):
                  v=tag.get(a)
                  if v:
                    full=urljoin(r.url,v)
                    if full not in links: links.append(full)
              for v in links:
                if any(k in v.lower() for k in ['pdf','report','annual','interim','financial','api','ajax','download','json','js']):
                  print('LINK',v,flush=True)
              patterns=[r'https?://[^\"\'<> ]+\.pdf(?:\?[^\"\'<> ]*)?',r'[^\"\'<> ]+\.pdf(?:\?[^\"\'<> ]*)?',r'/(?:api|ajax)/[^\"\'<> ]+',r'url\s*[:=]\s*[\"\'][^\"\']+']
              for p in patterns:
                vals=[]
                for m in re.findall(p,r.text,re.I):
                  if isinstance(m,tuple): m=' '.join(m)
                  if m not in vals: vals.append(m)
                for v in vals[:300]: print('MATCH',v,flush=True)
            except Exception as e:
              print('ERROR',url,repr(e),flush=True)
          PY
