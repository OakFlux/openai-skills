name: Probe Seedsufe direct APIs for Silkroad Visual 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-seedsufe-direct-probe-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe direct APIs and scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Origin': 'https://report.seedsufe.com',
              'Referer': 'https://report.seedsufe.com/preview/1028589',
          })

          page_url='https://report.seedsufe.com/preview/1028589'
          r=s.get(page_url,timeout=(20,90),allow_redirects=True)
          text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
          print('PAGE',r.status_code,r.url,len(r.content),r.headers.get('content-type'))
          print('HTML_HEAD',repr(text[:5000]))
          soup=BeautifulSoup(text,'lxml')
          scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script',src=True)]
          print('SCRIPTS',json.dumps(scripts,ensure_ascii=False))

          for url in scripts:
              try:
                  js=s.get(url,timeout=(15,90),allow_redirects=True)
                  if js.status_code!=200:
                      print('JS_STATUS',js.status_code,url)
                      continue
                  body=js.content.decode(js.apparent_encoding or 'utf-8',errors='replace')
                  relevant=any(k in body for k in ['getFileDetail','minireport.seedsufe.com','1028589','fileDetail','searchFile','fileList'])
                  print('JS',len(body),'RELEVANT',relevant,url)
                  if relevant:
                      for key in ['getFileDetail','minireport.seedsufe.com','fileDetail','search','fileList','queryFile','getFileList','keyword']:
                          for match in re.finditer(key,body,re.I):
                              pos=match.start()
                              print('CTX',key,repr(body[max(0,pos-1500):pos+4000]))
                              break
              except Exception as exc:
                  print('JS_ERROR',url,repr(exc))

          api='https://minireport.seedsufe.com/api/v2/file/getFileDetail'
          payloads=[
              ('get',{'id':'1028589'}),
              ('get',{'fileId':'1028589'}),
              ('get',{'file_id':'1028589'}),
              ('post_json',{'id':1028589}),
              ('post_json',{'fileId':1028589}),
              ('post_json',{'file_id':1028589}),
              ('post_form',{'id':'1028589'}),
              ('post_form',{'fileId':'1028589'}),
          ]
          for method,payload in payloads:
              try:
                  if method=='get':
                      rr=s.get(api,params=payload,timeout=(15,60))
                  elif method=='post_json':
                      rr=s.post(api,json=payload,timeout=(15,60),headers={'Content-Type':'application/json'})
                  else:
                      rr=s.post(api,data=payload,timeout=(15,60),headers={'Content-Type':'application/x-www-form-urlencoded'})
                  print('API',method,payload,'=>',rr.status_code,rr.url,len(rr.content),rr.headers.get('content-type'),repr(rr.text[:10000]))
              except Exception as exc:
                  print('API_ERROR',method,payload,repr(exc))

          # Probe likely search/list endpoints with common payloads.
          bases=[
              'https://minireport.seedsufe.com/api/v2/file/search',
              'https://minireport.seedsufe.com/api/v2/file/getFileList',
              'https://minireport.seedsufe.com/api/v2/file/list',
              'https://minireport.seedsufe.com/api/v2/file/searchFile',
              'https://minireport.seedsufe.com/api/v2/search',
              'https://minireport.seedsufe.com/api/v2/file/query',
          ]
          search_payloads=[
              {'keyword':'丝路视觉','page':1,'pageSize':50},
              {'search':'丝路视觉','page':1,'pageSize':50},
              {'query':'丝路视觉','page':1,'pageSize':50},
              {'title':'丝路视觉','page':1,'pageSize':50},
              {'keywords':'丝路视觉','pageNum':1,'pageSize':50},
          ]
          for endpoint in bases:
              for payload in search_payloads:
                  try:
                      rr=s.post(endpoint,json=payload,timeout=(10,30),headers={'Content-Type':'application/json'})
                      if rr.status_code not in (404,405) or len(rr.content)>100:
                          print('SEARCH_API',endpoint,payload,'=>',rr.status_code,len(rr.content),rr.headers.get('content-type'),repr(rr.text[:12000]))
                  except Exception as exc:
                      print('SEARCH_ERROR',endpoint,payload,repr(exc))
          PY
