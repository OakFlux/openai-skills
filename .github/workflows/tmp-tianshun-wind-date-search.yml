name: Temporary Search Tianshun Wind Deep Reports by Date

on:
  push:
    branches:
      - tmp/tianshun-wind-reports-20260830
    paths:
      - .github/workflows/tmp-tianshun-wind-date-search.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search narrow date windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          from pathlib import Path
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Accept':'application/json,text/plain,*/*'})
          windows=[('2023-02-07','2023-02-11'),('2023-02-20','2023-02-23'),('2022-12-02','2022-12-06')]
          all_matches=[]; diagnostics=[]
          for begin,end in windows:
            for page in range(1,30):
              p={'industryCode':'*','pageSize':'100','industry':'*','rating':'','ratingchange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','_':str(int(time.time()*1000))}
              r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=60);r.raise_for_status();payload=r.json();rows=payload.get('data') or []
              diagnostics.append({'begin':begin,'end':end,'page':page,'hits':payload.get('hits'),'size':payload.get('size'),'rows':len(rows)})
              for x in rows:
                blob=json.dumps(x,ensure_ascii=False)
                if any(k in blob for k in ['天顺风能','收购长风切入海风赛道','深耕风塔十余载','将飞翼伏，以待东风']):
                  all_matches.append(x)
              if len(rows)<100:break
          Path('out').mkdir(exist_ok=True)
          Path('out/tianshun_date_matches.json').write_text(json.dumps({'matches':all_matches,'diagnostics':diagnostics},ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCHES='+json.dumps([{k:x.get(k) for k in ['infoCode','title','orgSName','publishDate','researcher','attachPages','attachSize','encodeUrl']} for x in all_matches],ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianshun-date-matches
          path: out/tianshun_date_matches.json
          retention-days: 3
