name: Discover Adisseo 600299 broker reports 20261016

on:
  push:
    paths:
      - '.github/workflows/adisseo-600299-broker-discovery-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney research report index
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json, re, time
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/stock.jshtml?stockCode=600299',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def parse(text):
              text=text.strip()
              try: return json.loads(text)
              except Exception: pass
              m=re.search(r'^[^(]*\((.*)\)\s*;?$', text, re.S)
              if m:
                  try: return json.loads(m.group(1))
                  except Exception: pass
              return None

          endpoint='https://reportapi.eastmoney.com/report/list'
          all_rows=[]; seen=set(); logs=[]
          for page in range(1,11):
              params={
                  'pageSize':'100','pageNo':str(page),'p':str(page),'pageNum':str(page),'pageNumber':str(page),
                  'qType':'0','industryCode':'*','industry':'*','rating':'*','ratingChange':'*',
                  'fields':'','orgCode':'','author':'','stockCode':'600299','rcode':'',
                  'beginTime':'2010-01-01','endTime':'2026-10-16'
              }
              data=None; last=None
              for attempt in range(5):
                  try:
                      r=s.get(endpoint,params=params,timeout=(20,120))
                      last={'status':r.status_code,'url':r.url,'bytes':len(r.content),'prefix':r.text[:300]}
                      if r.status_code==200:
                          data=parse(r.text)
                          if data is not None: break
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(1+attempt)
              logs.append(last)
              if data is None:
                  raise RuntimeError(f'API failed page {page}: {last}')
              rows=[]
              if isinstance(data,dict):
                  for key in ['data','result','list','rows']:
                      v=data.get(key)
                      if isinstance(v,list): rows.extend(v)
                      elif isinstance(v,dict):
                          for k2 in ['data','list','rows']:
                              v2=v.get(k2)
                              if isinstance(v2,list): rows.extend(v2)
              elif isinstance(data,list): rows=data
              if not rows: break
              for row in rows:
                  if not isinstance(row,dict): continue
                  code=str(row.get('infoCode') or row.get('info_code') or row.get('reportCode') or row.get('rcode') or '')
                  key=code or json.dumps(row,ensure_ascii=False,sort_keys=True)
                  if key in seen: continue
                  seen.add(key); all_rows.append(row)
              if len(rows)<100: break
              time.sleep(0.1)

          print('REQUESTS',json.dumps(logs,ensure_ascii=False,indent=2))
          print('ROWS_COUNT',len(all_rows))
          for i,row in enumerate(all_rows,1):
              print('ROW',i,json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
