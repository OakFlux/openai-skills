name: Package Tangshan Port broker deep reports 20261016
on:
  push:
    paths:
      - '.github/workflows/tangshan-port-601000-broker-reports-package-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          root = Path('唐山港_601000_券商深度报告_完整版3份_截至20261016')
          preview_dir = root / '首页预览'
          root.mkdir(parents=True, exist_ok=True)
          preview_dir.mkdir(exist_ok=True)

          reports = [
            {
              'date':'2023-11-20','broker':'国金证券','analysts':'郑树明、王凯婕','rating':'买入',
              'title':'港口主业量价齐升 分红仍有上升空间',
              'info_code':'AP202311201611686806','expected_pages':32,
              'filename':'2023-11-20_国金证券_港口主业量价齐升_分红仍有上升空间.pdf',
              'type':'公司深度报告'
            },
            {
              'date':'2023-08-21','broker':'国信证券','analysts':'高晟、姜明','rating':'增持',
              'title':'受益于渤海湾港口整合，装卸主业有望迎量价齐升',
              'info_code':'AP202308211595383238','expected_pages':32,
              'filename':'2023-08-21_国信证券_受益于渤海湾港口整合_装卸主业有望迎量价齐升.pdf',
              'type':'公司深度报告'
            },
            {
              'date':'2024-03-06','broker':'信达证券','analysts':'左前明','rating':'增持',
              'title':'公司深度报告：华北干散核心港口，业务稳健分红领跑',
              'info_code':'AP202403061625674422','expected_pages':26,
              'filename':'2024-03-06_信达证券_公司深度报告_华北干散核心港口_业务稳健分红领跑.pdf',
              'type':'公司深度报告'
            },
          ]

          session = requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/601000.html',
            'Accept':'application/pdf,text/html;q=0.9,*/*;q=0.8',
          })

          def sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def download(item, target):
              code=item['info_code']
              candidates=[
                f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
              ]
              traces=[]
              for url in candidates:
                  for attempt in range(1,4):
                      try:
                          r=session.get(url,timeout=90,allow_redirects=True)
                          data=r.content
                          traces.append({'url':url,'status':r.status_code,'bytes':len(data),'head':repr(data[:20])})
                          if r.status_code==200 and data.startswith(b'%PDF') and len(data)>100000:
                              target.write_bytes(data)
                              return url,traces
                      except Exception as exc:
                          traces.append({'url':url,'error':repr(exc)})
                      time.sleep(attempt)
              raise RuntimeError(f'Unable to download valid PDF for {item["info_code"]}: {traces}')

          manifest=[]
          for item in reports:
              target=root/item['filename']
              source_url,traces=download(item,target)
              q=subprocess.run(['qpdf','--check',str(target)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace')
              if q.returncode not in (0,3):
                  raise RuntimeError(f'qpdf failed for {target}: {q.returncode}\n{q.stdout}')
              reader=PdfReader(str(target))
              pages=len(reader.pages)
              if pages != item['expected_pages']:
                  raise RuntimeError(f'Unexpected page count for {target}: {pages}; expected {item["expected_pages"]}')
              txt=target.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(6,pages)),str(target),str(txt)],check=True)
              text=txt.read_text(encoding='utf-8',errors='replace')
              txt.unlink(missing_ok=True)
              identity_hits=[x for x in ['唐山港','唐山港集团股份有限公司','601000',item['broker']] if x in text]
              if not any(x in text for x in ['唐山港','唐山港集团股份有限公司','601000']):
                  raise RuntimeError(f'Company identity not found in first pages of {target}; hits={identity_hits}')
              if item['broker'] not in text:
                  raise RuntimeError(f'Broker identity not found in first pages of {target}')
              preview_stem=preview_dir/target.stem
              subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(target),str(preview_stem)],check=True)
              png=preview_stem.with_suffix('.png')
              if not png.exists() or png.stat().st_size < 10000:
                  raise RuntimeError(f'First-page render failed for {target}')
              entry=dict(item)
              entry.update({
                'source_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
                'source_url':source_url,
                'pages':pages,
                'bytes':target.stat().st_size,
                'sha256':sha256(target),
                'identity_hits':identity_hits,
                'qpdf_status':q.returncode,
                'qpdf_output':q.stdout.strip()[:2000],
                'download_attempts':traces,
              })
              manifest.append(entry)
              print('VERIFIED',json.dumps(entry,ensure_ascii=False,sort_keys=True))

          readme=[
            '# 唐山港（601000）券商深度报告',
            '',
            '整理日期：2026-10-16',
            '',
            '本压缩包收录3份公开可下载的券商公司深度报告原始PDF，优先选择篇幅较长、研究框架较完整的报告。',
            '',
            '## 报告清单',
            '',
          ]
          for i,x in enumerate(manifest,1):
              readme += [
                f'### {i}. {x["broker"]}｜{x["date"]}｜{x["type"]}',
                f'- 标题：{x["title"]}',
                f'- 分析师：{x["analysts"]}',
                f'- 评级：{x["rating"]}',
                f'- 页数：{x["pages"]}',
                f'- 文件：{x["filename"]}',
                f'- SHA-256：`{x["sha256"]}`',
                f'- 来源页：{x["source_page"]}',
                '',
              ]
          readme += [
            '## 校验说明','',
            '- 每份PDF均检查文件头、PDF结构、实际页数、公司名称、证券代码、研究机构名称及首页渲染。',
            '- 压缩包创建后执行CRC完整性测试。',
            '- 研报内容仅代表原研究机构观点，仅供资料研究，不构成投资建议。',
          ]
          (root/'README.md').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text('\n'.join(f'{x["sha256"]}  {x["filename"]}' for x in manifest)+'\n',encoding='utf-8')

          cn_zip=Path('唐山港_601000_券商深度报告_完整版3份_截至20261016.zip')
          en_zip=Path('tangshan_port_601000_broker_deep_reports_3_full_20261016.zip')
          for zpath in (cn_zip,en_zip):
              with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p,p.as_posix())
              with zipfile.ZipFile(zpath) as zf:
                  bad=zf.testzip()
                  if bad:
                      raise RuntimeError(f'ZIP CRC failure: {bad}')
                  pdfs=[n for n in zf.namelist() if n.lower().endswith('.pdf')]
                  if len(pdfs)!=3:
                      raise RuntimeError(f'Unexpected PDF count: {len(pdfs)}')
              print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',sha256(zpath))
          print('COUNTS',json.dumps({'reports':len(manifest),'pages':sum(x['pages'] for x in manifest)},ensure_ascii=False))
          PY
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: tangshan-port-601000-broker-deep-reports-3-20261016
          path: |
            唐山港_601000_券商深度报告_完整版3份_截至20261016.zip
            tangshan_port_601000_broker_deep_reports_3_full_20261016.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
