name: Baolidi Eastmoney Date Probe

on:
  push:
    branches:
      - chatgpt-baolidi-broker-reports-20261004
    paths:
      - .github/workflows/baolidi_eastmoney_date_probe_20261004.yml
      - scripts/probe_baolidi_eastmoney_by_date.py

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Query reports by date
        run: |
          mkdir -p output
          python scripts/probe_baolidi_eastmoney_by_date.py

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: baolidi-eastmoney-date-probe
          path: output/baolidi_eastmoney_date_probe/
          retention-days: 1
