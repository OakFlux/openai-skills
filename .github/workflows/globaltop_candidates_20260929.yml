name: Global Top Research Candidates

on:
  push:
    branches:
      - chatgpt-globaltop-reports-20260929
    paths:
      - .github/workflows/globaltop_candidates_20260929.yml

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Export candidate metadata
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json, re
          from urllib.parse import urlencode, urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          out={'eastmoney':{},'search_pages':[]}

          params={
            'pageSize':'100','pageNo':'1','qType':'0','code':'002640',
            'beginTime':'2010-01-01','endTime':'2026-09-29','fields':'',
            'industryCode':'*','industry':'*','rating':'*','ratingChange':'*','orgCode':'',
          }
          url='https://reportapi.eastmoney.com/report/list?'+urlencode(params)
          try:
            r=s.get(url,headers={'Referer':'https://data.eastmoney.com/report/002640.html'},timeout=60)
            out['eastmoney']['status']=r.status_code
            out['eastmoney']['url']=r.url
            out['eastmoney']['text_head']=r.text[:1000]
            obj=r.json()
            out['eastmoney']['top_keys']=list(obj.keys()) if isinstance(obj,dict) else []
            rows=[]
            raw_rows=[]
            if isinstance(obj,dict):
              for key in ('data','result','list','reports'):
                value=obj.get(key)
                if isinstance(value,list): raw_rows=value; break
                if isinstance(value,dict):
                  for sub in ('data','list','items'):
                    if isinstance(value.get(sub),list): raw_rows=value[sub]; break
                  if raw_rows: break
            elif isinstance(obj,list): raw_rows=obj
            for row in raw_rows:
              if not isinstance(row,dict): continue
              compact={}
              for key in (
                'infoCode','title','stockName','stockCode','orgSName','orgName','publishDate',
                'predictThisYearEps','predictNextYearEps','predictNextTwoYearEps','emRatingName',
                'indvInduName','author','authorID','attachUrl','pdfUrl','url','reportType','researcher'
              ):
                if key in row: compact[key]=row.get(key)
              compact['_all_keys']=sorted(row.keys())
              rows.append(compact)
            out['eastmoney']['count']=len(rows)
            out['eastmoney']['rows']=rows
          except Exception as exc:
            out['eastmoney']['error']=repr(exc)

          search_urls=[
            'https://data.eastmoney.com/report/002640.html',
            'https://www.nxny.com/report/search?q=%E8%B7%A8%E5%A2%83%E9%80%9A',
            'https://www.fxbaogao.com/search?keywords=%E8%B7%A8%E5%A2%83%E9%80%9A',
            'https://www.sgpjbg.com/search?q=%E8%B7%A8%E5%A2%83%E9%80%9A',
          ]
          for page_url in search_urls:
            rec={'url':page_url}
            try:
              r=s.get(page_url,timeout=60,allow_redirects=True)
              r.encoding=r.apparent_encoding or 'utf-8'
              rec.update({'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'title':''})
              soup=BeautifulSoup(r.text,'html.parser')
              rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              hits=[]
              for a in soup.find_all('a',href=True):
                text=' '.join(a.get_text(' ',strip=True).split())
                href=urljoin(r.url,a['href'])
                blob=text+' '+href
                if any(k in blob for k in ('跨境通','002640')):
                  hits.append({'text':text,'href':href})
              rec['hits']=hits[:500]
              rec['pdf_urls']=sorted(set(re.findall(r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r.text,re.I)))[:500]
            except Exception as exc:
              rec['error']=repr(exc)
            out['search_pages'].append(rec)

          with open('output/candidates.json','w',encoding='utf-8') as f:
            json.dump(out,f,ensure_ascii=False,indent=2)
          with open('output/candidates.txt','w',encoding='utf-8') as f:
            f.write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({'eastmoney_count':out.get('eastmoney',{}).get('count'),'search_page_counts':[len(x.get('hits',[])) for x in out['search_pages']]},ensure_ascii=False))
          PY

      - name: Upload candidate metadata
        uses: actions/upload-artifact@v4
        with:
          name: globaltop-research-candidates
          path: output/
          retention-days: 1
