name: Build Wuhan Fingu broker research-report package

on:
  push:
    branches: [tmp-wuhan-fingu-broker-deep-reports-20261024]
    paths: ['.github/workflows/tmp-wuhan-fingu-broker-package-20261024.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF and Chinese-font tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk tesseract-ocr tesseract-ocr-chi-sim
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 trafilatura weasyprint img2pdf pillow

      - name: Download, render, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='武汉凡谷_券商深度与公司研究报告_3份'
          mkdir -p "$PACKAGE" /tmp/wuhan_fingu_pages

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import html
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import img2pdf
          import requests
          import trafilatura
          from bs4 import BeautifulSoup
          from weasyprint import HTML

          OUT = Path('武汉凡谷_券商深度与公司研究报告_3份')
          TMP = Path('/tmp/wuhan_fingu_pages')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          s = requests.Session()
          s.headers.update({'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9'})

          # 1) 海通证券21页报告：使用报告站公开逐页预览图，按原页序合成为PDF。
          base = 'https://file.sgpjbg.com/fileroot1/2020-8/10/bd630d01-ef74-4a45-81de-dac3aadb5901/bd630d01-ef74-4a45-81de-dac3aadb5901'
          image_paths = []
          for page in range(1, 22):
              url = f'{base}{page}.gif'
              last = None
              for attempt in range(6):
                  try:
                      r = s.get(url, timeout=120)
                      r.raise_for_status()
                      if not (r.content.startswith(b'GIF8') or r.content.startswith(b'\x89PNG\r\n\x1a\n')):
                          raise RuntimeError(f'Unexpected image signature: {r.content[:12]!r}')
                      suffix = '.gif' if r.content.startswith(b'GIF8') else '.png'
                      path = TMP / f'{page:02d}{suffix}'
                      path.write_bytes(r.content)
                      image_paths.append(path)
                      print('PAGE', page, len(r.content), url)
                      break
                  except Exception as exc:
                      last = exc
                      if attempt == 5:
                          raise RuntimeError(f'Failed page {page}: {last}')
          if len(image_paths) != 21:
              raise RuntimeError(f'Expected 21 preview pages, got {len(image_paths)}')
          deep_pdf = OUT / '01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf'
          deep_pdf.write_bytes(img2pdf.convert([str(p) for p in image_paths]))

          def fetch_text(url: str, required: list[str]) -> str:
              r = s.get(url, timeout=180)
              r.raise_for_status()
              raw = r.content
              enc = r.encoding or ''
              if 'sina.com.cn' in url:
                  text_html = raw.decode('gb18030', errors='replace')
              else:
                  text_html = raw.decode('utf-8', errors='replace')
              extracted = trafilatura.extract(
                  text_html,
                  include_comments=False,
                  include_tables=True,
                  favor_recall=True,
                  output_format='txt',
              ) or ''
              extracted = re.sub(r'\n{3,}', '\n\n', extracted).strip()
              if len(extracted) < 1200 or not all(x in extracted for x in required):
                  soup = BeautifulSoup(text_html, 'html.parser')
                  for tag in soup(['script', 'style', 'noscript', 'svg']):
                      tag.decompose()
                  candidates = []
                  for tag in soup.find_all(['article', 'main', 'section', 'div']):
                      txt = re.sub(r'[ \t\r\f\v]+', ' ', tag.get_text('\n', strip=True))
                      txt = re.sub(r'\n{3,}', '\n\n', txt).strip()
                      if all(x in txt for x in required):
                          candidates.append(txt)
                  if candidates:
                      candidates.sort(key=len)
                      # Prefer the shortest complete container to reduce navigation noise.
                      extracted = candidates[0]
              if len(extracted) < 1200 or not all(x in extracted for x in required):
                  raise RuntimeError(f'Insufficient public full text from {url}: chars={len(extracted)}')
              return extracted

          def render_text_pdf(filename: str, title: str, broker: str, date: str, source: str, text: str, edition: str) -> None:
              paragraphs = []
              for block in re.split(r'\n\s*\n|(?=\n(?:[一二三四五六七八九十]+、|\d+[、.]))', text):
                  block = block.strip()
                  if block:
                      paragraphs.append(f'<p>{html.escape(block).replace(chr(10), "<br>")}</p>')
              body = '\n'.join(paragraphs)
              doc = f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
              @page {{ size: A4; margin: 18mm 17mm 20mm; @bottom-center {{ content: counter(page); font-size: 9pt; color: #666; }} }}
              body {{ font-family: "Noto Sans CJK SC", "Noto Sans CJK", sans-serif; color:#111; font-size:10.5pt; line-height:1.72; }}
              h1 {{ font-size:18pt; line-height:1.35; margin:0 0 10mm; }}
              .meta {{ border-top:1px solid #555; border-bottom:1px solid #aaa; padding:3mm 0; margin-bottom:7mm; font-size:9.5pt; color:#333; }}
              .notice {{ background:#f2f2f2; padding:3mm 4mm; margin-bottom:7mm; font-size:9pt; }}
              p {{ margin:0 0 4.5mm; text-align:justify; }}
              .source {{ word-break:break-all; font-size:8.5pt; color:#555; margin-top:10mm; }}
              </style></head><body>
              <h1>{html.escape(title)}</h1>
              <div class="meta">券商：{html.escape(broker)}　发布日期：{html.escape(date)}　版本：{html.escape(edition)}</div>
              <div class="notice">本文件由公开可访问的券商研究全文网页排版导出，不是券商客户端原始附件PDF。正文内容未作研究结论改写。</div>
              {body}
              <div class="source">公开来源：{html.escape(source)}</div>
              </body></html>'''
              HTML(string=doc, base_url=source).write_pdf(OUT / filename)

          sina_url = 'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/625253469469/index.phtml'
          sina_text = fetch_text(sina_url, ['武汉凡谷', '国信证券'])
          render_text_pdf(
              '02_国信证券_三季度盈利能力改善业绩符合预期_公开全文导出版_2019-10-24.pdf',
              '武汉凡谷：三季度盈利能力改善，业绩符合预期',
              '国信证券', '2019-10-24', sina_url, sina_text, '公开全文导出版'
          )

          cj_url = 'https://www.9fzt.com/detail/sz_002194_10_491131147358.html'
          cj_text = fetch_text(cj_url, ['武汉凡谷', '长江证券'])
          render_text_pdf(
              '03_长江证券_扩充先进产能强化市场优势地位推动自动化升级布局长期发展_公开全文导出版_2015-07-25.pdf',
              '武汉凡谷：扩充先进产能强化市场优势地位，推动自动化升级布局长期发展',
              '长江证券', '2015-07-25', cj_url, cj_text, '公开全文导出版'
          )

          print('CREATED', *[p.name for p in sorted(OUT.glob('*.pdf'))], sep='\n')
          PY

          # Core structural checks.
          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 2
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$pdf.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$pdf.last" >/dev/null 2>&1
            test -s "$pdf.first.png" && test -s "$pdf.last.png"
            rm -f "$pdf.first.png" "$pdf.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          test "$(pdfinfo "$PACKAGE/01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 21
          pdftoppm -f 1 -l 1 -singlefile -png -r 180 \
            "$PACKAGE/01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf" /tmp/deep_cover >/dev/null 2>&1
          tesseract /tmp/deep_cover.png /tmp/deep_cover -l chi_sim+eng >/dev/null 2>&1
          grep -Eq '武汉凡谷|凡谷' /tmp/deep_cover.txt
          grep -Eq '海通证券|海通' /tmp/deep_cover.txt

          for pdf in "$PACKAGE"/02_*.pdf "$PACKAGE"/03_*.pdf; do
            pdftotext "$pdf" "$pdf.txt"
            grep -Eq '武汉凡谷' "$pdf.txt"
            rm -f "$pdf.txt"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          folder=Path('武汉凡谷_券商深度与公司研究报告_3份')
          meta={
            '01_海通证券_专注基站射频三十年5G滤波器再塑发展新天地_公开预览重建版_2020-08-10.pdf': ('海通证券','2020-08-10','专注基站射频三十年，5G滤波器再塑发展新天地','首次覆盖公司深度报告；公开逐页预览重建版','https://www.sgpjbg.com/baogao/16990.html'),
            '02_国信证券_三季度盈利能力改善业绩符合预期_公开全文导出版_2019-10-24.pdf': ('国信证券','2019-10-24','三季度盈利能力改善，业绩符合预期','公司财报点评；公开全文导出版','https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/625253469469/index.phtml'),
            '03_长江证券_扩充先进产能强化市场优势地位推动自动化升级布局长期发展_公开全文导出版_2015-07-25.pdf': ('长江证券','2015-07-25','扩充先进产能强化市场优势地位，推动自动化升级布局长期发展','公司研究；公开全文导出版','https://www.9fzt.com/detail/sz_002194_10_491131147358.html'),
          }
          lines=['武汉凡谷（002194）券商深度与公司研究报告资料包','整理日期：2026-10-24','','版本说明：','1. 海通证券报告为21页首次覆盖深度报告，由公开逐页预览按原顺序合成为PDF；不是券商客户端原始附件。','2. 国信证券、长江证券报告由公开完整研究全文网页排版导出；不是券商客户端原始附件。','3. 所有文件均保留券商、日期、题名和公开来源；未将摘要冒充原始附件。','4. 资料仅供研究参考，不构成投资建议。','','文件清单：']
          sums=[]; total_pages=0; total_bytes=0
          for pdf in sorted(folder.glob('*.pdf')):
            broker,date,title,kind,source=meta[pdf.name]
            data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace')
            pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
            total_pages+=pages; total_bytes+=len(data)
            lines += [f'- {pdf.name}',f'  券商：{broker}；日期：{date}；类型：{kind}；页数：{pages}',f'  标题：{title}',f'  公开来源：{source}',f'  SHA-256：{sha}']
            sums.append(f'{sha}  {pdf.name}')
          lines += ['',f'合计页数：{total_pages}页。',f'PDF合计大小：{total_bytes}字节。','全部PDF均已通过文件头、文件大小、PDF结构、页数、公司名称及首末页渲染检查；海通证券报告首页另通过OCR核验公司与券商名称。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Wuhan-Fingu-002194-broker-reports-3
          path: 武汉凡谷_券商深度与公司研究报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
