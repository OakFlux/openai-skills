name: Extract CCCC report links from Huatai weekly PDFs 20260927

on:
  push:
    paths:
      - '.github/workflows/htsc-pdf-link-extract-cccc-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Download and extract annotations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          urls = [
            'https://crm.htsc.com.cn/doc/2020/10720402/5781e194-86f3-4e96-bec8-0fbaa36ee33f.pdf',
            'https://crm.htsc.com.cn/doc/2020/10720402/993f442e-befc-46ea-9302-a2b53ce9d96c.pdf',
            'https://crm.htsc.com.cn/doc/2020/10720402/f8dcf861-02df-422b-8b31-7488589ec677.pdf',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'})
          for i,u in enumerate(urls,1):
            p=Path(f'w{i}.pdf')
            r=s.get(u,timeout=(30,180)); print('DOWNLOAD',u,r.status_code,len(r.content),flush=True); r.raise_for_status(); p.write_bytes(r.content)
            reader=PdfReader(str(p),strict=False)
            print('PAGES',len(reader.pages),flush=True)
            for pi,page in enumerate(reader.pages):
              annots=page.get('/Annots') or []
              for a in annots:
                try:
                  obj=a.get_object()
                  action=obj.get('/A')
                  uri=None
                  if action:
                    action=action.get_object()
                    uri=action.get('/URI')
                  if not uri and obj.get('/Dest'):
                    uri=str(obj.get('/Dest'))
                  if uri:
                    print('ANNOT',i,pi,json.dumps(str(uri),ensure_ascii=False),flush=True)
                except Exception as e:
                  print('ANNOT_ERR',i,pi,repr(e),flush=True)
            # Also scan raw bytes and extracted text for URLs.
            raw=p.read_bytes().decode('latin1','ignore')
            vals=[]
            for pat in [r'https?://[^\s<>\)\]\}]+', r'crm\.htsc\.com\.cn[^\s<>\)\]\}]+']:
              for x in re.findall(pat,raw,re.I):
                if x not in vals: vals.append(x)
            print('RAW_URLS',i,json.dumps(vals[:200],ensure_ascii=False),flush=True)
          PY
