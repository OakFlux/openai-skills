name: Paginate Eastmoney reports for United Laboratories 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-eastmoney-paginated-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Paginate exact date windows and download matching PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pdfs out/previews
          python - <<'PY'
          from __future__ import annotations
          import requests,json,re,hashlib,subprocess,time
          from pathlib import Path
          from pypdf import PdfReader

          OUT=Path('out'); PDF=OUT/'pdfs'; PREV=OUT/'previews'
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          windows=[('2025-07-10','2025-07-17'),('2025-07-26','2025-08-01'),('2025-09-14','2025-09-21')]
          calls=[];matched=[];seen=set(); scanned=0
          phrases=['联邦制药','03933','3933.HK','03933.HK','创新突破，三靶点战略联姻诺和诺德','创新药初结硕果','抗生素龙头企业，掘金动保及代谢领域','抗生素龙头跻身创新']
          for begin,end in windows:
            for page in range(1,61):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
              try:
                r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(30,120))
                text=r.text.strip();m=re.match(r'^[\w$]+\((.*)\)\s*;?$',text,re.S)
                if m:text=m.group(1)
                d=json.loads(text);rows=d.get('data') or (d.get('result') or {}).get('data') or []
                if isinstance(rows,dict):rows=rows.get('data') or rows.get('list') or []
                if not isinstance(rows,list):rows=[]
                scanned+=len(rows)
                calls.append({'begin':begin,'end':end,'page':page,'rows':len(rows),'status':r.status_code,'bytes':len(r.content),'meta':{k:v for k,v in d.items() if k!='data'}})
                for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if any(x in blob for x in phrases):
                    info=row.get('infoCode') or row.get('infocode') or row.get('INFOCODE') or row.get('info_code')
                    key=str(info or blob)
                    if key not in seen:seen.add(key);matched.append(row)
                if len(rows)<100:break
              except Exception as e:
                calls.append({'begin':begin,'end':end,'page':page,'error':repr(e)});break
          (OUT/'calls.json').write_text(json.dumps(calls,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'matched_records.json').write_text(json.dumps(matched,ensure_ascii=False,indent=2),encoding='utf-8')
          vals=[]
          for row in matched:
            info=row.get('infoCode') or row.get('infocode') or row.get('INFOCODE') or row.get('info_code')
            if not info:continue
            title=str(row.get('title') or row.get('reportName') or 'report');org=str(row.get('orgSName') or row.get('orgName') or 'broker');date=str(row.get('publishDate') or '')[:10]
            data=None;used=None;attempts=[]
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time())}']:
              try:
                rr=s.get(u,timeout=(30,180),allow_redirects=True);attempts.append({'url':u,'status':rr.status_code,'final':rr.url,'bytes':len(rr.content),'type':rr.headers.get('content-type','')})
                if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>30000:data=rr.content;used=rr.url;break
              except Exception as e:attempts.append({'url':u,'error':repr(e)})
            if data is None:vals.append({'record':row,'attempts':attempts});continue
            safe=re.sub(r'[^0-9A-Za-z\u4e00-\u9fff._-]+','_',f'{date}_{org}_{title}')[:180];f=PDF/(safe+'.pdf');f.write_bytes(data)
            try:
              reader=PdfReader(str(f),strict=False);pages=len(reader.pages);first=(reader.pages[0].extract_text() or '')
              subprocess.run(['qpdf','--check',str(f)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(f),str(PREV/f.stem)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              vals.append({'file':f.name,'url':used,'pages':pages,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'first_text':first[:3000],'record':row,'attempts':attempts})
            except Exception as e:vals.append({'file':f.name,'url':used,'error':repr(e),'record':row,'attempts':attempts})
          (OUT/'validation.json').write_text(json.dumps(vals,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'scanned':scanned,'matched':matched,'validation':vals},ensure_ascii=False,indent=2))
          PY
          find out -type f -printf '%P %s bytes\n' | sort > out/file_sizes.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-eastmoney-paginated
          path: out
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
