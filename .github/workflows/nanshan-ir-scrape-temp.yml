name: Temporary Nanshan Reports Fetch

on:
  push:
    paths:
      - '.github/workflows/nanshan-ir-scrape-temp.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download official issuer PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          curl -fL --retry 6 --retry-delay 3 -A "$ua" -o out/Nanshan_Aluminium_International_2024_Annual_Report_OFFICIAL_IR.pdf 'https://www.nanshanintl.com/uploads/20250423/288e380122410bd2a0ede78c7bdecd6b.pdf'
          curl -fL --retry 6 --retry-delay 3 -A "$ua" -o out/Nanshan_Aluminium_International_2025_Annual_Report_OFFICIAL_IR.pdf 'https://www.nanshanintl.com/uploads/20260423/7f5ab2e6ad3503bfab4e73b90b164be2.pdf'
          curl -fL --retry 6 --retry-delay 3 -A "$ua" -o out/Nanshan_Aluminium_International_2026_Interim_Report_OFFICIAL_IR.pdf 'https://www.nanshanintl.com/uploads/20260911/7f4d08ba194a1205362ab1fcbc1daba8.pdf'
          for f in out/*.pdf; do
            test "$(head -c 5 "$f")" = '%PDF-'
            test "$(stat -c%s "$f")" -gt 100000
          done
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import hashlib, json
          rows=[]
          for p in sorted(Path('out').glob('*.pdf')):
              data=p.read_bytes()
              reader=PdfReader(str(p), strict=False)
              rows.append({
                  'file':p.name,
                  'bytes':len(data),
                  'pages':len(reader.pages),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'encrypted':bool(reader.is_encrypted),
              })
          Path('out/VALIDATION.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['file']}\n" for r in rows),encoding='utf-8')
          PY
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanshan-official-reports
          path: out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
