name: Temporary Nanshan IR Scrape

on:
  push:
    paths:
      - '.github/workflows/nanshan-ir-scrape-temp.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch live investor-relations pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m pip install --quiet beautifulsoup4
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          curl -fL --retry 5 -A "$ua" 'https://www.nanshanintl.com/ennews/ac/9/classid/22' -o out/ir_disclosure.html
          curl -fL --retry 5 -A "$ua" 'https://www.nanshanintl.com/ennews/ac/4/classid/9' -o out/ir_all.html
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          from urllib.parse import urljoin
          import re, json
          base='https://www.nanshanintl.com/'
          records=[]
          for fn in ['ir_disclosure.html','ir_all.html']:
              p=Path('out')/fn
              html=p.read_text(encoding='utf-8',errors='replace')
              soup=BeautifulSoup(html,'html.parser')
              anchors=[]
              for a in soup.find_all('a', href=True):
                  text=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(base,a['href'])
                  if ('2026 Interim Report' in text or '2025 Annual Report' in text or '2024 Annual Report' in text or 'GLOBAL OFFERING' in text or href.lower().endswith('.pdf')):
                      anchors.append({'text':text,'href':href,'attrs':dict(a.attrs)})
              records.append({'file':fn,'anchors':anchors,'pdf_urls':sorted(set(re.findall(r'https?://[^\"\'<>\s]+?\.pdf(?:\?[^\"\'<>\s]*)?',html,re.I)))})
          Path('out/parsed_links.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          detail_urls=[]
          for rec in records:
              for a in rec['anchors']:
                  if '2026 Interim Report' in a['text']:
                      detail_urls.append(a['href'])
          Path('out/2026_detail_urls.txt').write_text('\n'.join(dict.fromkeys(detail_urls)),encoding='utf-8')
          PY
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            name=$(printf '%s' "$u" | sha256sum | cut -c1-12)
            curl -fL --retry 5 -A "$ua" "$u" -o "out/detail_${name}.html"
          done < out/2026_detail_urls.txt
          grep -RniE '2026 Interim Report|\.pdf|upload|file|attachment|download' out > out/grep_hits.txt || true
      - name: Upload scrape artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanshan-ir-scrape
          path: out
          retention-days: 1
          compression-level: 6
