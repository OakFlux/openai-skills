name: chatgpt-temp-consun-package-final
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-consun-package-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public pages, validate PDFs, and package
        shell: bash
        run: |
          python -m pip install --quiet requests pillow img2pdf pypdf pymupdf
          python <<'PY'
          import hashlib, io, json, time, zipfile
          from pathlib import Path
          import img2pdf, pymupdf, requests
          from PIL import Image, ImageStat
          from pypdf import PdfReader

          WORK = Path('consun_final_work')
          ROOT = WORK / '康臣药业_01681_券商深度报告_3份'
          PDF_DIR = ROOT / 'PDF'
          IMG_DIR = WORK / '_images'
          QA_DIR = WORK / '_qa'
          for d in (PDF_DIR, IMG_DIR, QA_DIR): d.mkdir(parents=True, exist_ok=True)

          reports = [
            {'institution':'安信国际','date':'2024-06-20','title':'“高股息+稳增长”的肾科中成药领先企业','source_page':'https://www.sdyanbao.com/detail/774690','page_base':'https://oss.sdyanbao.com/page/2024/6/24/1026513','original_pages':13,'included_pages':10,'kind':'公司首次覆盖深度报告（公开试读）','filename':'2024-06-20_安信国际_康臣药业_高股息稳增长的肾科中成药领先企业_公开试读10页_原报告13页.pdf'},
            {'institution':'中邮证券','date':'2024-05-17','title':'高分红、业绩提速可期，被低估的肾科中成药龙头','source_page':'https://www.sdyanbao.com/detail/763116','page_base':'https://oss.sdyanbao.com/page/2024/5/20/1010107','original_pages':21,'included_pages':10,'kind':'公司首次覆盖深度报告（公开试读）','filename':'2024-05-17_中邮证券_康臣药业_高分红业绩提速可期被低估的肾科中成药龙头_公开试读10页_原报告21页.pdf'},
            {'institution':'兴业证券','date':'2024-05-16','title':'全年业绩持续稳健增长，派息比例大幅提升','source_page':'https://www.sdyanbao.com/detail/763200','page_base':'https://oss.sdyanbao.com/page/2024/5/20/1010255','original_pages':6,'included_pages':6,'kind':'公司跟踪报告（完整公开版）','filename':'2024-05-16_兴业证券_康臣药业_全年业绩持续稳健增长派息比例大幅提升_完整6页.pdf'},
          ]
          session=requests.Session(); session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          logs=[]
          def log(x): x=str(x); print(x,flush=True); logs.append(x)
          def fetch_image(url,dest,referer):
              last=None
              for attempt in range(1,5):
                  try:
                      r=session.get(url,headers={'Referer':referer},timeout=120,allow_redirects=True)
                      log(f'IMAGE attempt={attempt} status={r.status_code} bytes={len(r.content)} type={r.headers.get("content-type")} url={r.url}')
                      if r.status_code==200 and len(r.content)>20000:
                          im=Image.open(io.BytesIO(r.content)); im.verify(); dest.write_bytes(r.content); return r.url
                      last=RuntimeError(f'HTTP={r.status_code}, bytes={len(r.content)}')
                  except Exception as e: last=e; log(f'IMAGE_ERROR {url} {e!r}')
                  time.sleep(attempt)
              raise RuntimeError(f'Unable to fetch {url}: {last!r}')

          manifest=[]
          for ri,report in enumerate(reports,1):
              rdir=IMG_DIR/f'{ri:02d}'; rdir.mkdir(parents=True,exist_ok=True)
              norm=[]; source_urls=[]; dims=[]
              for idx in range(report['included_pages']):
                  url=f"{report['page_base']}/{idx}.png"; raw=rdir/f'{idx+1:02d}.png'
                  final_url=fetch_image(url,raw,report['source_page'])
                  with Image.open(raw) as im:
                      if im.width < 800 or im.height < 1100 or im.height/im.width < 1.25:
                          raise RuntimeError(f'Unexpected page dimensions {url}: {im.size}')
                      rgb=im.convert('RGB'); normalized=rdir/f'{idx+1:02d}_normalized.png'; rgb.save(normalized,'PNG',optimize=False)
                      dims.append({'page':idx+1,'width':im.width,'height':im.height})
                  norm.append(normalized); source_urls.append(final_url)
              pdf=PDF_DIR/report['filename']; data=img2pdf.convert([str(p) for p in norm],layout_fun=img2pdf.get_fixed_dpi_layout_fun((144,144))); pdf.write_bytes(data)
              if not data.startswith(b'%PDF-'): raise RuntimeError(f'Invalid PDF header {pdf.name}')
              pages=len(PdfReader(str(pdf),strict=False).pages)
              if pages != report['included_pages']: raise RuntimeError(f'Page count mismatch {pdf.name}: {pages}')
              doc=pymupdf.open(str(pdf)); checks=[]
              if doc.page_count != pages: raise RuntimeError(f'Renderer mismatch {pdf.name}')
              for page_no,tag in [(0,'first'),(pages//2,'middle'),(pages-1,'last')]:
                  pix=doc.load_page(page_no).get_pixmap(matrix=pymupdf.Matrix(1.0,1.0),alpha=False); png=QA_DIR/f'{ri:02d}_{tag}.png'; pix.save(str(png))
                  sd=float(ImageStat.Stat(Image.open(png).convert('L').resize((64,64))).stddev[0])
                  if sd<2.0: raise RuntimeError(f'Near blank page {pdf.name} p{page_no+1}')
                  checks.append({'page':page_no+1,'stddev':round(sd,4)})
              doc.close(); raw=pdf.read_bytes()
              rec={'date':report['date'],'institution':report['institution'],'title':report['title'],'stock_code':'01681.HK','kind':report['kind'],'included_pages':pages,'original_pages':report['original_pages'],'filename':f"PDF/{report['filename']}",'source_page':report['source_page'],'public_page_image_urls':source_urls,'page_dimensions':dims,'size_bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'render_checks':checks}
              manifest.append(rec); log('VALID '+json.dumps(rec,ensure_ascii=False))

          readme=['# 康臣药业（01681.HK）券商研究报告资料包','','本资料包收录两份公司首次覆盖长篇报告和一份公司跟踪报告。','公开来源仅展示长篇报告前10页，因此两份长篇报告的文件名已明确标注“公开试读”，未标为完整版；兴业证券6页报告按公开页面全部页数收录。','','| 日期 | 券商 | 报告题目 | 本包页数 | 原报告页数 | 完整性 |','|---|---|---|---:|---:|---|']
          for x in manifest:
              complete='完整公开版' if x['included_pages']==x['original_pages'] else '公开试读版'
              readme.append(f"| {x['date']} | {x['institution']} | {x['title']} | {x['included_pages']} | {x['original_pages']} | {complete} |")
          readme += ['','处理说明：','- PDF由公开报告详情页展示的高清逐页图片按原顺序合成。','- 未登录任何账户，未使用会员下载权限，未绕过访问限制。','- 已校验图片尺寸、PDF文件头和实际页数，并重新渲染检查首、中、尾页。','- ZIP已执行CRC完整性校验。','','详细来源和SHA-256校验值见 manifest.json 与 SHA256SUMS.txt。']
          (ROOT/'README.md').write_text('\n'.join(readme)+'\n',encoding='utf-8')
          (ROOT/'文件说明.txt').write_text('\n'.join(line.replace('# ','').replace('- ','') for line in readme if not line.startswith('|'))+'\n',encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps({'company':'康臣药业集团有限公司','stock_code':'01681.HK','checked_as_of':'2026-09-09','reports':manifest},ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['filename']}" for x in manifest)+'\n',encoding='utf-8')
          (WORK/'run.log').write_text('\n'.join(logs)+'\n',encoding='utf-8')
          z=WORK/'康臣药业_01681_券商深度报告_3份.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): archive.write(p,arcname=str(Path(ROOT.name)/p.relative_to(ROOT)))
          with zipfile.ZipFile(z) as archive:
              if archive.testzip(): raise RuntimeError('ZIP CRC failure')
              if len([n for n in archive.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('ZIP PDF count mismatch')
          zd=z.read_bytes(); meta={'filename':z.name,'size_bytes':len(zd),'sha256':hashlib.sha256(zd).hexdigest(),'pdf_count':3,'reports':manifest}
          (WORK/'zip_metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8'); print('FINAL '+json.dumps(meta,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Consun-01681-Broker-Reports-Final
          path: |
            consun_final_work/康臣药业_01681_券商深度报告_3份.zip
            consun_final_work/zip_metadata.json
            consun_final_work/run.log
            consun_final_work/_qa
          retention-days: 1
          compression-level: 0
