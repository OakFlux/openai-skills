name: Search public Ascletis reports
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/search-sdyanbao-ascletis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/search_sdyanbao_ascletis.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-ascletis-search
          path: sdyanbao_ascletis_search.json
          if-no-files-found: error
          retention-days: 1
