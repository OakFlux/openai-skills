name: Build Gogo 301510 all filings 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gogo-301510-all-filings-20261028-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='301510'
          SHORT='固高科技'
          FULL='固高科技股份有限公司'
          PACKAGE='固高科技_301510_全部年报_招股说明书_最新季报'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          items=[
            {
              'label':'2023年年度报告','filename':'01_2023年年度报告.pdf',
              'urls':['https://static.cninfo.com.cn/finalpage/2024-04-22/1219702294.PDF'],
              'min_pages':80,
            },
            {
              'label':'2024年年度报告','filename':'02_2024年年度报告.pdf',
              'urls':['https://static.cninfo.com.cn/finalpage/2025-04-25/1223267592.PDF'],
              'min_pages':80,
            },
            {
              'label':'2025年年度报告','filename':'03_2025年年度报告.pdf',
              'urls':[
                'https://disc.static.szse.cn/download/disc/disk03/finalpage/2026-04-29/786350f5-376f-4596-8d0e-38ba8251504b.pdf',
                'https://disc.static.szse.cn/disc/disk03/finalpage/2026-04-29/786350f5-376f-4596-8d0e-38ba8251504b.PDF',
              ],
              'min_pages':80,
            },
            {
              'label':'首次公开发行股票并在创业板上市招股说明书','filename':'04_首次公开发行股票并在创业板上市招股说明书.pdf',
              'urls':['https://static.cninfo.com.cn/finalpage/2023-08-08/1217478963.PDF'],
              'min_pages':200,
            },
            {
              'label':'2026年第一季度报告','filename':'05_2026年第一季度报告.pdf',
              'urls':['https://static.cninfo.com.cn/finalpage/2026-04-29/1225242763.PDF'],
              'min_pages':5,
            },
          ]

          s=requests.Session();s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          manifest=[]
          for item in items:
            data=None; source_url=''; attempts=[]
            for url in item['urls']:
              for attempt in range(7):
                try:
                  r=s.get(url,headers={'User-Agent':ua,'Referer':'https://www.cninfo.com.cn/','Accept':'application/pdf,*/*;q=0.8'},timeout=(30,360),allow_redirects=True)
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000:
                    data=r.content;source_url=url;break
                except Exception as exc:
                  attempts.append({'url':url,'attempt':attempt+1,'error':repr(exc)})
                time.sleep(1+attempt)
              if data:break
            if not data:raise RuntimeError(f"Download failed {item['label']}: {attempts}")

            dest=PDFDIR/item['filename'];dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False);pages=len(reader.pages)
            if pages<item['min_pages']:raise RuntimeError(f"Unexpectedly short PDF {item['label']}: {pages} pages")
            text=''
            for p in reader.pages[:min(12,pages)]:
              try:text+='\n'+(p.extract_text() or '')
              except Exception:pass
            compact=re.sub(r'\s+','',text)
            identity_hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
            if len(compact)>500 and not identity_hits:raise RuntimeError(f"Issuer mismatch {item['label']}")
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<8000:raise RuntimeError(f"Preview failed {item['label']}")
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'label':item['label'],'filename':str(Path('原始PDF')/item['filename']),
              'source_url':source_url,'pages':pages,'bytes':len(data),'sha256':sha,
              'identity_hits':identity_hits,'preview_file':str(Path('首页预览')/preview.name),
              'download_attempts':attempts,
              'validation':['PDF header','issuer identity','page count','qpdf structure','first-page render'],
            })

          total_pages=sum(x['pages'] for x in manifest)
          readme=[
            '固高科技股份有限公司（301510.SZ）公开披露文件资料包',
            '整理日期：2026-10-28','',
            '收录范围：公司上市后全部年度报告全文、首次公开发行股票并在创业板上市招股说明书全文，以及截至整理日最新已披露的季度报告。',
            '公司于2023年8月15日上市，因此年度报告范围为2023—2025年。',
            '公司2026年第三季度报告预约披露日已变更为2026年10月30日，截至2026年10月28日尚未披露，因此最新季报采用2026年第一季度报告。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['label']}",f"   页数：{x['pages']}页；文件：{x['filename']}",f"   来源：{x['source_url']}",f"   SHA-256：{x['sha256']}",'']
          readme += [f'合计：{len(manifest)}份PDF，{total_pages}页。','已核验PDF文件头、公司名称/证券代码、实际页数、文档结构、首页渲染、ZIP CRC和SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zcn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zcn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file():z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zcn) as z:
            bad=z.testzip();pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=5:raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)}')
          zen=Path('gogo_301510_all_annual_reports_prospectus_latest_quarter.zip');zen.write_bytes(zcn.read_bytes())
          print('FINAL_ZIP',zcn,zcn.stat().st_size,'SHA256',hashlib.sha256(zcn.read_bytes()).hexdigest())
          print('TOTAL_PAGES',total_pages)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: gogo-301510-all-filings-final
          path: |
            固高科技_301510_全部年报_招股说明书_最新季报.zip
            gogo_301510_all_annual_reports_prospectus_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
