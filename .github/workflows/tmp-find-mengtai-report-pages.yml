name: Temporary Find Exact Mengtai Report Archive Pages

on:
  push:
    branches: [tmp/fetch-mengtai-reports-20260830]
    paths: [.github/workflows/tmp-find-mengtai-report-pages.yml]

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-mengtai-reports-20260830
          fetch-depth: 0
      - name: Search exact titles
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import quote,unquote,urljoin,urlparse,parse_qs
          from bs4 import BeautifulSoup

          targets=[
            '蒙泰高新 丙纶长丝行业领跑者 双基地强势进军碳纤维',
            '蒙泰高新 丙纶景气触底 布局碳纤维打开新增量',
            '蒙泰高新 国内丙纶长丝龙头 募投扩产助力成长',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          found=[]
          def add(url,source,title=''):
            if not url:return
            url=html.unescape(unquote(url))
            if 'bing.com/ck/a' in url:
              q=parse_qs(urlparse(url).query)
              for key in ('u','url'):
                if key in q:
                  v=q[key][0]
                  if v.startswith('a1'):v=v[2:]
                  try:
                    import base64
                    v += '='*((4-len(v)%4)%4)
                    url=base64.urlsafe_b64decode(v).decode('utf-8','ignore')
                  except:pass
            m=re.search(r'https?://(?:www\.)?sgpjbg\.com/baogao/(\d+)\.html',url,re.I)
            if m:
              item={'id':m.group(1),'url':f'https://www.sgpjbg.com/baogao/{m.group(1)}.html','source':source,'anchor':title}
              if item['id'] not in [x['id'] for x in found]:found.append(item)
          for query in targets:
            qs=[
              ('bing',f'https://www.bing.com/search?q={quote("site:sgpjbg.com/baogao/ \""+query+"\"")}'),
              ('bing2',f'https://www.bing.com/search?q={quote("\""+query+"\" PDF")}'),
              ('baidu',f'https://www.baidu.com/s?wd={quote("site:sgpjbg.com/baogao/ "+query)}'),
              ('sogou',f'https://www.sogou.com/web?query={quote("site:sgpjbg.com/baogao/ "+query)}'),
            ]
            for source,u in qs:
              try:
                r=s.get(u,timeout=45,allow_redirects=True)
                text=html.unescape(r.text).replace('\\/','/')
                for raw in re.findall(r'https?://[^"\'<>\s]+',text,re.I):add(raw,source)
                soup=BeautifulSoup(text,'html.parser')
                for a in soup.find_all('a',href=True):add(urljoin(r.url,a['href']),source,' '.join(a.stripped_strings))
              except Exception:pass
          # Confirm each page title/text and retain only Mengtai pages.
          confirmed=[]
          for item in found:
            try:
              r=s.get(item['url'],timeout=45);text=html.unescape(r.text);soup=BeautifulSoup(text,'html.parser')
              visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S);visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S);visible=re.sub(r'<[^>]+>',' ',visible);visible=re.sub(r'\s+',' ',visible).strip()
              if '蒙泰高新' in visible or '300876' in visible:
                item.update({'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'visible_head':visible[:600]})
                confirmed.append(item)
            except Exception:pass
          # Known confirmed page, added defensively.
          if '141130' not in [x['id'] for x in confirmed]:confirmed.append({'id':'141130','url':'https://www.sgpjbg.com/baogao/141130.html','source':'known','title':'东北证券-蒙泰高新-丙纶长丝行业领跑者，双基地强势进军碳纤维'})
          Path('discoveries').mkdir(exist_ok=True)
          Path('discoveries/mengtai_report_pages_short.json').write_text(json.dumps(confirmed,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(confirmed,ensure_ascii=False))
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'OpenAI Report Discovery'
          git config user.email 'actions@users.noreply.github.com'
          git add discoveries/mengtai_report_pages_short.json
          git commit -m 'chore: persist exact Mengtai report archive pages' || exit 0
          git pull --rebase origin tmp/fetch-mengtai-reports-20260830
          git push origin HEAD:tmp/fetch-mengtai-reports-20260830
