name: Probe 9FZT Wuhan Fingu viewer 20261022

on:
  push:
    paths:
      - '.github/workflows/wuhan-fingu-9fzt-viewer-probe-20261022.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect viewer HTML and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':'https://www.9fzt.com/detail/sz_002194_10_650430884853.html'}
          url='https://www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId=650430884853&content=%E6%AD%A6%E6%B1%89%E5%87%A1%E8%B0%B7'
          r=s.get(url,headers=h,timeout=(20,120),allow_redirects=True)
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
          text=r.text
          for i,line in enumerate(text.splitlines(),1):
            low=line.lower()
            if any(k in low for k in ['650430884853','contentid','pdf','image','pageurl','fileurl','download','report','api/','article','iframe','src=']):
              if len(line)<30000:print('LINE',i,line[:29500])
          soup=BeautifulSoup(text,'lxml')
          scripts=[];urls=[]
          for tag in soup.find_all(True):
            for attr in ['href','src','data-src','data-url','data-file','data-pdf','content']:
              v=tag.get(attr)
              if not v:continue
              u=urllib.parse.urljoin(r.url,html.unescape(str(v)))
              if tag.name=='script' and attr=='src':scripts.append(u)
              if any(k in u.lower() for k in ['650430884853','pdf','image','report','article','api','download']):urls.append(u)
          for m in re.findall(r'https?://[^\s"\'<>]+',text):
            m=html.unescape(m)
            if any(k in m.lower() for k in ['650430884853','pdf','image','report','article','api','download']):urls.append(m)
          print('URLS',json.dumps(list(dict.fromkeys(urls))[:1000],ensure_ascii=False,indent=2))
          print('SCRIPTS',json.dumps(scripts,ensure_ascii=False,indent=2))
          for su in scripts:
            try:
              x=s.get(su,headers=h,timeout=(20,120));st=x.text
              print('\nSCRIPT',su,x.status_code,len(x.content))
              for pat in ['650430884853','contentId','contentDetail','view_the_article','pdf','fileUrl','file_url','imageUrl','image_url','pageUrl','download','reportDetail','articleDetail','/api/']:
                hits=list(re.finditer(pat,st,re.I))
                if hits:
                  print('PAT',pat,'COUNT',len(hits))
                  for m in hits[:30]:print('CTX',st[max(0,m.start()-550):m.end()+1500].replace('\n',' ')[:2200])
            except Exception as e:print('SCRIPTERR',su,repr(e))
          PY
