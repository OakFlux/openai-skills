name: Discover CCCC Development 2020 annual report 20260927

on:
  push:
    paths:
      - '.github/workflows/cccc-development-2020-report-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query official and public announcement APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, html
          from datetime import datetime, timezone, timedelta
          import requests

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          tz=timezone(timedelta(hours=8))
          def clean(v): return re.sub(r'\s+','',html.unescape(re.sub(r'<[^>]+>','',str(v or ''))))
          def date(v):
            try:
              n=int(v); n=n//1000 if n>10000000000 else n
              return datetime.fromtimestamp(n,tz=tz).strftime('%Y-%m-%d')
            except: return str(v)

          endpoint='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          headers={'Referer':'https://www.cninfo.com.cn/new/disclosure/stock?stockCode=000736&orgId=gssz0000736','Origin':'https://www.cninfo.com.cn','X-Requested-With':'XMLHttpRequest','Accept':'application/json, text/javascript, */*; q=0.01'}
          variants=[]
          for stock in ['', '000736,gssz0000736', '000736,中交地产']:
            for key in ['', '000736', '中交地产', '2020年年度报告']:
              for category in ['', 'category_ndbg_szsh']:
                variants.append((stock,key,category))
          seen=set()
          for stock,key,category in variants:
            form={'pageNum':'1','pageSize':'50','column':'szse','tabName':'fulltext','plate':'sz','stock':stock,'searchkey':key,'secid':'','category':category,'trade':'','seDate':'2021-03-01~2021-06-01','sortName':'time','sortType':'desc','isHLtitle':'true'}
            try:
              r=s.post(endpoint,data=form,headers=headers,timeout=(20,60)); print('CNINFO_QUERY',stock,key,category,'status',r.status_code,'len',len(r.content),flush=True); r.raise_for_status(); p=r.json(); items=p.get('announcements') or []
              print('CNINFO_ITEMS',len(items),flush=True)
              for x in items:
                if str(x.get('secCode') or '')!='000736': continue
                u=str(x.get('adjunctUrl') or ''); ident=u or str(x.get('announcementId') or '')
                if ident in seen: continue
                seen.add(ident)
                print('CNINFO_RESULT',json.dumps({'title':clean(x.get('announcementTitle')),'raw_title':x.get('announcementTitle'),'date':date(x.get('announcementTime')),'adjunctUrl':u,'announcementId':x.get('announcementId'),'secName':clean(x.get('secName'))},ensure_ascii=False),flush=True)
            except Exception as e: print('CNINFO_ERROR',repr(e),flush=True)

          em='https://np-anotice-stock.eastmoney.com/api/security/ann'
          for page in range(1,8):
            params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':'000736','f_node':'0','s_node':'0','begin_time':'2021-03-01','end_time':'2021-06-01'}
            try:
              r=s.get(em,params=params,headers={'Referer':'https://data.eastmoney.com/notices/stock/000736.html','Accept':'application/json, text/plain, */*'},timeout=(20,60)); print('EM_QUERY',page,r.status_code,r.url,flush=True); r.raise_for_status(); p=r.json(); items=((p.get('data') or {}).get('list') or []); print('EM_ITEMS',len(items),flush=True)
              for x in items:
                codes=x.get('codes') or []
                if not any(str(c.get('stock_code') or '')=='000736' for c in codes): continue
                title=clean(x.get('title'))
                if '2020' in title or '年度报告' in title:
                  print('EM_RESULT',json.dumps({'title':title,'date':str(x.get('notice_date') or '')[:10],'art_code':x.get('art_code'),'codes':codes},ensure_ascii=False),flush=True)
              if len(items)<100: break
            except Exception as e: print('EM_ERROR',repr(e),flush=True); break
          PY
