name: Probe Debon Sanwei report 20261014

on:
  push:
    branches:
      - tmp-sanwei-chemical-research-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 Pillow
      - env:
          PYTHONUTF8: "1"
        run: python tmp/probe_debon_sanwei_20261014.py
      - uses: actions/upload-artifact@v4
        with:
          name: debon-sanwei-probe
          path: debon_sanwei_probe/
          if-no-files-found: error
          retention-days: 1
