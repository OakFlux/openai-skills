name: Build final Haofan Bio report package

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-package-v3-20261020.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download and validate
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='昊帆生物_301393_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE"

          cat > /tmp/build.py <<'PY'
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import unquote, urljoin
          import requests

          OUT = Path('昊帆生物_301393_全部年报_招股说明书_最新季报')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          S = requests.Session()
          S.headers.update({'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7'})

          rows = [
            dict(order=1, kind='年度报告', period='2016年度', title='昊帆生物：2016年年度报告（采用2017年5月9日后续披露版本）',
                 source='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=3389063',
                 filename='01_昊帆生物_2016年年度报告_后续披露版.pdf', min_pages=5),
            dict(order=2, kind='年度报告', period='2017年度', title='昊帆生物：2017年年度报告',
                 source='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=4215080',
                 filename='02_昊帆生物_2017年年度报告.pdf', min_pages=20),
            dict(order=3, kind='年度报告', period='2018年度', title='昊帆生物：2018年年度报告',
                 source='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=5157316',
                 filename='03_昊帆生物_2018年年度报告.pdf', min_pages=20),
            dict(order=4, kind='招股说明书', period='首次公开发行并在创业板上市', title='昊帆生物：首次公开发行股票并在创业板上市招股说明书',
                 source='https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2023/2023-7/2023-07-07/9337216.PDF', direct=True,
                 filename='04_昊帆生物_首次公开发行股票并在创业板上市招股说明书.pdf', min_pages=100),
            dict(order=5, kind='年度报告', period='2023年度', title='昊帆生物：2023年年度报告',
                 source='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=9947191',
                 filename='05_昊帆生物_2023年年度报告.pdf', min_pages=50),
            dict(order=6, kind='年度报告', period='2024年度', title='昊帆生物：2024年年度报告',
                 source='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=10862097',
                 filename='06_昊帆生物_2024年年度报告.pdf', min_pages=50),
            dict(order=7, kind='年度报告', period='2025年度', title='昊帆生物：2025年年度报告',
                 source='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=12100428',
                 filename='07_昊帆生物_2025年年度报告.pdf', min_pages=50),
            dict(order=8, kind='最新季报', period='2026年第一季度', title='昊帆生物：2026年一季度报告',
                 source='https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=12156987',
                 filename='08_昊帆生物_2026年第一季度报告_最新季报.pdf', min_pages=5),
          ]

          anchor_re = re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''', re.I | re.S)
          pdf_re = re.compile(r'''https?://[^\s"'<>]+?\.pdf(?:\?[^\s"'<>]*)?''', re.I)

          def get(url, referer=None, pdf=False):
              headers = {'Accept': 'application/pdf,application/octet-stream;q=0.9,text/html;q=0.8,*/*;q=0.7'}
              if referer:
                  headers['Referer'] = referer
              last = None
              for n in range(8):
                  try:
                      r = S.get(url, headers=headers, timeout=300, allow_redirects=True)
                      r.raise_for_status()
                      if pdf and not r.content.startswith(b'%PDF-'):
                          raise RuntimeError(f'not PDF: {r.status_code} {r.headers.get("content-type")} {r.content[:40]!r}')
                      return r.content, r.url
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + n)
              raise RuntimeError(f'fetch failed {url}: {last}')

          # Establish a NEEQ browser session before requesting legacy files.
          for warm in ('https://www.neeq.com.cn/', 'https://www.neeq.com.cn/disclosure/'):
              try:
                  S.get(warm, timeout=60)
              except Exception:
                  pass

          def decode(raw):
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='replace')

          def obtain(row):
              if row.get('direct'):
                  data, final = get(unquote(row['source']), pdf=True)
                  return data, final
              raw, detail = get(row['source'])
              text = decode(raw)
              candidates = []
              for m in anchor_re.finditer(text):
                  href = unquote(html.unescape(m.group(1).strip()))
                  label = html.unescape(re.sub(r'\s+', '', re.sub(r'<[^>]+>', '', m.group(2))))
                  full = urljoin(detail, href)
                  if '.pdf' in full.lower() or '下载公告' in label or '公告原文' in label:
                      candidates.append((0 if '下载公告' in label else 1, full))
              for m in pdf_re.finditer(text):
                  candidates.append((2, unquote(html.unescape(m.group(0)))))
              seen = set()
              errors = []
              for _, candidate in sorted(candidates, key=lambda x: (x[0], len(x[1]))):
                  if candidate in seen:
                      continue
                  seen.add(candidate)
                  try:
                      data, final = get(candidate, referer=detail, pdf=True)
                      if len(data) > 50000:
                          return data, final
                  except Exception as exc:
                      errors.append(f'{candidate}: {exc}')
              raise RuntimeError(f'No valid PDF for {row["title"]}; errors={errors[:6]}')

          for row in rows:
              data, final = obtain(row)
              if len(data) < 50000:
                  raise RuntimeError(f'too small: {row["title"]} {len(data)}')
              (OUT / row['filename']).write_bytes(data)
              row['pdf_url'] = final
              row['bytes'] = len(data)
              print('SAVED', row['filename'], len(data), final)

          (OUT / '_metadata.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          python3 /tmp/build.py

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l 40 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '昊帆生物|昊帆生物科技|苏州昊帆' "$pdf.txt"
            rm -f "$pdf.txt"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$pdf.render" >/dev/null 2>&1
            test -s "$pdf.render.png"
            rm -f "$pdf.render.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          folder = Path('昊帆生物_301393_全部年报_招股说明书_最新季报')
          rows = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          by_name = {r['filename']: r for r in rows}
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 8:
              raise SystemExit(f'Expected 8 PDFs, found {len(pdfs)}')
          lines = [
              '苏州昊帆生物股份有限公司（昊帆生物，301393）',
              '全部公开年度报告、正式招股说明书及最新季报',
              '整理日期：2026-10-20', '', '收录说明：',
              '1. 收录公司新三板挂牌期间公开披露的2016—2018年度报告，以及创业板上市后公开披露的2023—2025年度报告，共6份。',
              '2. 2016年年度报告存在两次同名披露，本包采用2017年5月9日披露的后续版本。',
              '3. 公司于2019年7月10日在全国股转系统终止挂牌，至2023年7月12日在创业板上市；2019—2022年度没有以公众公司身份单独披露的年度报告，相关经审计历史财务信息已纳入正式招股说明书。',
              '4. 招股说明书采用2023年7月7日披露的正式发行版，未用招股意向书或申报稿替代。',
              '5. 截至2026年10月20日，正式三季报目录尚未列出2026年第三季度报告，故最新已披露季报为2026年第一季度报告。',
              '6. 2026年半年度报告不属于季度报告，未用其替代“最新季报”。',
              '7. 文件均为公开披露的原始PDF，仅供研究参考。', '', '文件清单：'
          ]
          sums=[]; total_pages=0; total_bytes=0
          for pdf in pdfs:
              r=by_name[pdf.name]; data=pdf.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              info=subprocess.check_output(['pdfinfo',str(pdf)],text=True,errors='replace',stderr=subprocess.DEVNULL)
              pages=int(next(x.split(':',1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              if pages < int(r['min_pages']): raise SystemExit(f'{pdf.name}: only {pages} pages')
              total_pages += pages; total_bytes += len(data)
              lines += [f'- {pdf.name}',f"  类型：{r['kind']}；报告期：{r['period']}；页数：{pages}；大小：{len(data)}字节",f"  标题：{r['title']}",f"  PDF来源：{r['pdf_url']}",f'  SHA-256：{sha}']
              sums.append(f'{sha}  {pdf.name}')
          lines += ['',f'合计页数：{total_pages}页。',f'PDF原件合计大小：{total_bytes}字节。','全部PDF均已通过文件头、文件大小、PDF结构、页数、正文公司名称及首页渲染检查。']
          (folder/'00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (folder/'_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Haofan-Bio-301393-all-annual-prospectus-latest-quarter-final
          path: 昊帆生物_301393_全部年报_招股说明书_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
