name: Package Kaichuang International 600097 reports 20261014

on:
  push:
    paths:
      - '.github/workflows/package-kaichuang-600097-annual-quarterly-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '开创国际_600097_2020-2025年报及2026年第一季度报告'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          VERIFY = Path('_verify_kaichuang')
          VERIFY.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'period': '2020年年度报告',
                  'filename': '01_开创国际_2020年年度报告.pdf',
                  'announcement_date': '2021-04-01',
                  'bulletin_id': '7006588',
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7006588&stockid=600097',
              },
              {
                  'order': 2,
                  'period': '2021年年度报告',
                  'filename': '02_开创国际_2021年年度报告.pdf',
                  'announcement_date': '2022-04-01',
                  'bulletin_id': '7948073',
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7948073&stockid=600097',
              },
              {
                  'order': 3,
                  'period': '2022年年度报告',
                  'filename': '03_开创国际_2022年年度报告.pdf',
                  'announcement_date': '2023-04-01',
                  'bulletin_id': '8946526',
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8946526&stockid=600097',
              },
              {
                  'order': 4,
                  'period': '2023年年度报告',
                  'filename': '04_开创国际_2023年年度报告.pdf',
                  'announcement_date': '2024-03-29',
                  'bulletin_id': '9910829',
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9910829&stockid=600097',
              },
              {
                  'order': 5,
                  'period': '2024年年度报告',
                  'filename': '05_开创国际_2024年年度报告.pdf',
                  'announcement_date': '2025-03-29',
                  'bulletin_id': '10825165',
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10825165&stockid=600097',
              },
              {
                  'order': 6,
                  'period': '2025年年度报告',
                  'filename': '06_开创国际_2025年年度报告.pdf',
                  'announcement_date': '2026-03-28',
                  'bulletin_id': '12026158',
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12026158&stockid=600097',
              },
              {
                  'order': 7,
                  'period': '2026年第一季度报告（截至2026-10-14最新季报）',
                  'filename': '07_开创国际_2026年第一季度报告_最新季报.pdf',
                  'announcement_date': '2026-04-29',
                  'bulletin_id': '12238704',
                  'source_page': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12238704&stockid=600097',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def attachment_urls(item: dict) -> list[str]:
              date = item['announcement_date']
              year = date[:4]
              month = str(int(date[5:7]))
              bulletin_id = item['bulletin_id']
              suffix = f'MRGG/CNSESH_STOCK/{year}/{year}-{month}/{date}/{bulletin_id}.PDF'
              return [
                  f'https://file.finance.sina.com.cn/211.154.219.97:9494/{suffix}',
                  f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/{suffix}',
                  f'http://file.finance.sina.com.cn/211.154.219.97:9494/{suffix}',
              ]

          def download_pdf(item: dict, destination: Path) -> tuple[str, dict]:
              errors = []
              for url in attachment_urls(item):
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': item['source_page'],
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=(25, 180),
                              allow_redirects=True,
                          )
                          meta = {
                              'candidate_url': url,
                              'status': response.status_code,
                              'final_url': response.url,
                              'content_type': response.headers.get('content-type', ''),
                              'bytes': len(response.content),
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 80_000:
                              destination.write_bytes(response.content)
                              return response.url, meta
                          errors.append(meta)
                      except Exception as exc:
                          errors.append({'candidate_url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1.2 + attempt)
              raise RuntimeError(f"Unable to download {item['period']}: {json.dumps(errors[-10:], ensure_ascii=False)}")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = []
          for item in reports:
              output = ROOT / item['filename']
              final_url, download_meta = download_pdf(item, output)

              # Structural checks.
              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(output)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              reader = PdfReader(str(output), strict=False)
              page_count = len(reader.pages)
              if page_count < 3:
                  raise RuntimeError(f"Unexpectedly short PDF: {output.name}, pages={page_count}")

              # Text check on opening pages.
              text_file = VERIFY / f"{item['order']:02d}.txt"
              subprocess.run(
                  ['pdftotext', '-f', '1', '-l', '5', '-layout', str(output), str(text_file)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              text = text_file.read_text(encoding='utf-8', errors='ignore')
              compact = re.sub(r'\s+', '', text)
              if '开创国际' not in compact and '上海开创国际海洋资源股份有限公司' not in compact:
                  raise RuntimeError(f"Company-name check failed: {output.name}")
              expected_year = re.search(r'(20\d{2})年', item['period'])
              if expected_year and expected_year.group(1) not in compact:
                  raise RuntimeError(f"Year check failed: {output.name}; expected {expected_year.group(1)}")

              # Render first page to verify the PDF is visually decodable.
              preview_prefix = VERIFY / f"{item['order']:02d}_preview"
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '110', '-singlefile', str(output), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f"First-page render failed: {output.name}")

              manifest.append({
                  **item,
                  'download_url': final_url,
                  'download_meta': download_meta,
                  'pages': page_count,
                  'bytes': output.stat().st_size,
                  'sha256': sha256(output),
              })
              print(json.dumps(manifest[-1], ensure_ascii=False))

          readme_lines = [
              '开创国际（600097.SH）2020-2025年年度报告及最新季度报告',
              '整理日期：2026-10-14',
              '',
              '文件范围：2020年至2025年年度报告全文，共6份；截至整理日，公司尚未披露2026年第三季度报告，最新季度报告为2026年第一季度报告。2026年半年度报告不属于季度报告，因此未纳入。',
              '',
          ]
          for entry in manifest:
              readme_lines.extend([
                  f"{entry['order']}. {entry['period']}",
                  f"   文件：{entry['filename']}",
                  f"   公告日期：{entry['announcement_date']}；PDF页数：{entry['pages']}页；文件大小：{entry['bytes']}字节",
                  f"   来源页面：{entry['source_page']}",
                  f"   SHA-256：{entry['sha256']}",
                  '',
              ])
          readme_lines.extend([
              '核验：全部PDF均通过qpdf结构检查、首页文字核对、页数检查和首页渲染检查。',
              '报告版权归上市公司及原披露平台所有，仅供研究参考。',
          ])
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme_lines), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{entry['sha256']}  {entry['filename']}\n" for entry in manifest),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{PACKAGE}/{path.relative_to(ROOT)}')

          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad is not None or len(pdfs) != 7:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          alias = Path('kaichuang_600097_reports_2020_2025_latest_quarter.zip')
          shutil.copyfile(zip_path, alias)
          zip_sha = sha256(zip_path)
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, zip_sha)
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: kaichuang-600097-annual-quarterly-reports-final
          path: |
            开创国际_600097_2020-2025年报及2026年第一季度报告.zip
            kaichuang_600097_reports_2020_2025_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
