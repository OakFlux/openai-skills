name: Save public Hangyan assets
on:
  push:
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Download public pages and JavaScript
        run: |
          mkdir -p out
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.hangyan.co/reports/3399260180989347557' -o out/report.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://www.hangyan.co/reports/3399260180989347557' 'https://cdn.hangyan.co/assets/application-ec845e69.js' -o out/application.js
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.hangyan.co/reports' -o out/reports_index.html
          wc -c out/*
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: hangyan-public-assets
          path: out
          retention-days: 1
          compression-level: 0
