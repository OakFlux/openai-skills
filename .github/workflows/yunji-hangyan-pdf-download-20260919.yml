name: Download public Hangyan Yunji PDF 20260919

on:
  push:
    paths:
      - '.github/workflows/yunji-hangyan-pdf-download-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Capture and download public PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, hashlib, json
          from pathlib import Path
          from pypdf import PdfReader
          from playwright.async_api import async_playwright

          URL='https://www.hangyan.co/reports/3858889155413018441'
          OUT=Path('hangyan-output'); OUT.mkdir(exist_ok=True)
          PDF=OUT/'兴证国际证券_云迹02670HK_中国酒店机器人龙头发力智能体应用_2026-03-22.pdf'
          network=[]

          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--disable-blink-features=AutomationControlled'])
              context=await browser.new_context(
                accept_downloads=True,
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
                locale='zh-CN', viewport={'width':1440,'height':1000}
              )
              page=await context.new_page()
              page.on('response',lambda r: network.append({'url':r.url,'status':r.status,'content_type':r.headers.get('content-type',''),'resource_type':r.request.resource_type}))
              resp=await page.goto(URL,wait_until='domcontentloaded',timeout=120000)
              print('GOTO',resp.status if resp else None,page.url,flush=True)
              await page.wait_for_timeout(8000)
              # inspect all frames and iframe src after controller initialization
              print('TITLE',await page.title(),flush=True)
              print('FRAMES',[f.url for f in page.frames],flush=True)
              iframe=page.locator('iframe[data-native-pdf-target="iframe"]')
              print('IFRAME_COUNT',await iframe.count(),flush=True)
              if await iframe.count():
                print('IFRAME_SRC',await iframe.first.get_attribute('src'),flush=True)
              for row in network:
                u=row['url'].lower(); ct=row['content_type'].lower()
                if any(k in u for k in ['.pdf','qingstor','hangyan-prod','document','webviewer','cache']) or 'application/pdf' in ct:
                  print('NET',json.dumps(row,ensure_ascii=False),flush=True)
              # First try the explicit public download button.
              button=page.locator('[data-action="click->native-pdf#download"]').first
              print('BUTTON',await button.count(),await button.is_visible() if await button.count() else False,flush=True)
              downloaded=False
              if await button.count():
                try:
                  async with page.expect_download(timeout=45000) as info:
                    await button.click()
                  dl=await info.value
                  print('DOWNLOAD_SUGGESTED',dl.suggested_filename,flush=True)
                  await dl.save_as(str(PDF))
                  downloaded=True
                except Exception as e:
                  print('DOWNLOAD_BUTTON_ERROR',repr(e),flush=True)
              # If no browser download event, use any public PDF response URL from network within browser context.
              if not downloaded:
                candidates=[]
                for row in network:
                  u=row['url']; ct=row['content_type'].lower()
                  if 'application/pdf' in ct or '.pdf' in u.lower():
                    candidates.append(u)
                # iframe can use a viewer URL with a file query parameter
                if await iframe.count():
                  src=await iframe.first.get_attribute('src')
                  if src: candidates.insert(0,src)
                print('CANDIDATES',json.dumps(candidates,ensure_ascii=False),flush=True)
                for cand in candidates:
                  try:
                    r=await context.request.get(cand,headers={'Referer':URL},timeout=120000)
                    data=await r.body()
                    print('CANDIDATE_FETCH',r.status,len(data),cand,(await r.all_headers()).get('content-type'),flush=True)
                    if r.status==200 and data.startswith(b'%PDF-'):
                      PDF.write_bytes(data); downloaded=True; break
                  except Exception as e:
                    print('CANDIDATE_ERROR',cand,repr(e),flush=True)
              await page.screenshot(path=str(OUT/'page.png'),full_page=False)
              (OUT/'network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
              await browser.close()
              if not downloaded:
                raise RuntimeError('public PDF download could not be captured')

          asyncio.run(main())
          data=PDF.read_bytes()
          if not data.startswith(b'%PDF-'):
            raise RuntimeError('output is not PDF')
          reader=PdfReader(str(PDF),strict=False)
          print('PDF_VALID',len(reader.pages),len(data),hashlib.sha256(data).hexdigest(),flush=True)
          if len(reader.pages)<3:
            raise RuntimeError('unexpectedly short PDF')
          PY

      - name: Validate PDF
        run: |
          qpdf --check hangyan-output/*.pdf
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png hangyan-output/*.pdf /tmp/hangyan-first
          test -s /tmp/hangyan-first.png

      - uses: actions/upload-artifact@v4
        with:
          name: yunji-hangyan-public-pdf
          path: hangyan-output
          retention-days: 14
          if-no-files-found: error
