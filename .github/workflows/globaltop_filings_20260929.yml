name: Global Top Official Filings Package

on:
  push:
    branches:
      - chatgpt-globaltop-filings-20260929
    paths:
      - .github/workflows/globaltop_filings_20260929.yml
      - scripts/build_globaltop_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf pymupdf pillow

      - name: Download, validate, and package reports
        run: python scripts/build_globaltop_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: globaltop-official-filings-package
          path: |
            output/跨境通_2020-2025年报_最新季报.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
