name: Build Daqo Energy 688303 brokerage deep reports ZIP 20260927

on:
  push:
    paths:
      - '.github/workflows/daqo-688303-brokerage-deep-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download selected deep reports and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '大全能源_688303_券商深度报告精选_3份'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'filename': '01_华通证券国际_2023-10-27_投资价值分析报告_N型先进产能与一体化布局.pdf',
                  'broker': '华通证券国际',
                  'date': '2023-10-27',
                  'title': '投资价值分析报告：具备业内少有N型先进产能，产业链一体化布局持续完善，核心竞争力进一步筑高',
                  'authors': '电新行业组',
                  'info_code': 'AP202310271605139650',
                  'expected_pages': 28,
                  'min_pages': 25,
                  'min_bytes': 700_000,
              },
              {
                  'filename': '02_东亚前海证券_2022-10-27_首次覆盖报告_高纯多晶硅产品领军者.pdf',
                  'broker': '东亚前海证券',
                  'date': '2022-10-27',
                  'title': '首次覆盖报告：高纯多晶硅产品领军者，成本+品质构建核心竞争力',
                  'authors': '段小虎',
                  'info_code': 'AP202210271579527848',
                  'expected_pages': 31,
                  'min_pages': 28,
                  'min_bytes': 1_500_000,
              },
              {
                  'filename': '03_东吴证券_2021-08-25_老牌硅料供应商_募资固产争龙头.pdf',
                  'broker': '东吴证券',
                  'date': '2021-08-25',
                  'title': '老牌硅料供应商，募资固产争龙头',
                  'authors': '曾朵红、陈瑶、黄钰豪',
                  'info_code': 'AP202108251512349326',
                  'expected_pages': 28,
                  'min_pages': 25,
                  'min_bytes': 1_200_000,
              },
          ]

          def candidate_urls(info_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.PDF',
              ]

          def download(report: dict, destination: Path) -> str:
              errors: list[str] = []
              for url in candidate_urls(report['info_code']):
                  for attempt in range(1, 4):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 420),
                          ) as response:
                              print('DOWNLOAD', destination.name, 'attempt', attempt, 'status', response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as file_handle:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          file_handle.write(chunk)
                          file_size = temp.stat().st_size
                          with temp.open('rb') as file_handle:
                              header = file_handle.read(8)
                          if file_size < report['min_bytes'] or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={file_size}, header={header!r}')
                          temp.replace(destination)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f"download failed for {destination.name}: {errors}")

          records: list[dict] = []
          seen_hashes: set[str] = set()

          for report in reports:
              destination = OUT / report['filename']
              source_url = download(report, destination)

              reader = PdfReader(str(destination), strict=False)
              page_count = len(reader.pages)
              if page_count < report['min_pages']:
                  raise RuntimeError(f'page count too small for {destination.name}: {page_count}')
              if abs(page_count - report['expected_pages']) > 3:
                  raise RuntimeError(f'unexpected page count for {destination.name}: {page_count}, expected about {report["expected_pages"]}')

              check = subprocess.run(['qpdf', '--check', str(destination)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {destination.name}: {check.stderr[-2000:]}')

              data = destination.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              seen_hashes.add(sha256)

              record = {
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'info_code': report['info_code'],
                  'source_url': source_url,
                  'pages': page_count,
                  'bytes': len(data),
                  'sha256': sha256,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '大全能源（688303.SH）券商深度报告精选',
              '整理日期：2026-09-27',
              '',
              '筛选原则：选择完整篇幅的投资价值分析、首次覆盖或公司深度报告，覆盖不同券商。',
              '资料来源：东方财富研究报告公开文件服务器。',
              '所有PDF均完成文件头、文件大小、页数、qpdf结构、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['broker']}，{record['date']}",
                  f"   标题：{record['title']}",
                  f"   作者：{record['authors']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   文件：{record['filename']}",
                  f"   来源：{record['source_url']}",
                  f"   信息代码：{record['info_code']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{record['sha256']}  {record['filename']}\n" for record in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise RuntimeError('ZIP CRC failure: ' + bad_file)
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 3:
                  raise RuntimeError(f'expected 3 PDFs, found {len(pdf_names)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: daqo-688303-brokerage-deep-reports-20260927
          path: 大全能源_688303_券商深度报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
