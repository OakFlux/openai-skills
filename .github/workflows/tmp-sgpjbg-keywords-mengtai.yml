name: Temporary Query SGPJBG Keyword Search Mengtai
on:
  push:
    branches: [tmp/fetch-mengtai-reports-20260830]
    paths: [.github/workflows/tmp-sgpjbg-keywords-mengtai.yml]
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fetch-mengtai-reports-20260830
          fetch-depth: 0
      - name: Query
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://www.sgpjbg.com/search.html','Accept-Language':'zh-CN,zh;q=0.9'})
          tests=[]
          for method in ['get','post']:
            for cd in ['0','1','2','3','']:
              data={'cx':'partner-pub-9256112255354802:2221863025','cd':cd,'keywords':'蒙泰高新'}
              try:
                r=(s.get('https://www.sgpjbg.com/search.html',params=data,timeout=60) if method=='get' else s.post('https://www.sgpjbg.com/search.html',data=data,timeout=60))
                text=html.unescape(r.text);soup=BeautifulSoup(text,'html.parser')
                links=[]
                for a in soup.find_all('a',href=True):
                  t=' '.join(a.stripped_strings);u=urljoin(r.url,a['href'])
                  if re.search(r'/baogao/\d+\.html',u) and ('蒙泰' in t or '300876' in t or '丙纶' in t or '碳纤维' in t):links.append({'text':t,'url':u})
                tests.append({'method':method,'cd':cd,'url':r.url,'status':r.status_code,'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'links':links})
              except Exception as e:tests.append({'method':method,'cd':cd,'error':repr(e)})
          Path('discoveries').mkdir(exist_ok=True)
          Path('discoveries/mengtai_sgpjbg_keyword_results.json').write_text(json.dumps(tests,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(tests,ensure_ascii=False))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'OpenAI Report Discovery'
          git config user.email 'actions@users.noreply.github.com'
          git add discoveries/mengtai_sgpjbg_keyword_results.json
          git commit -m 'chore: persist Mengtai SGPJBG keyword results' || exit 0
          git pull --rebase origin tmp/fetch-mengtai-reports-20260830
          git push origin HEAD:tmp/fetch-mengtai-reports-20260830
