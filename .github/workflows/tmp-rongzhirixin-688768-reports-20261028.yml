name: Build Rongzhirixin 688768 disclosure package

on:
  push:
    branches:
      - tmp-rongzhirixin-688768-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package disclosures
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='容知日新_688768_全部年报_招股说明书_最新季报'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/rzrx_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('容知日新_688768_全部年报_招股说明书_最新季报')
          session = requests.Session()
          session.trust_env = False
          session.mount('https://', HTTPAdapter(max_retries=Retry(
              total=8,
              connect=8,
              read=8,
              status=8,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          docs = [
              {
                  'order': 1,
                  'kind': 'prospectus',
                  'year': 2021,
                  'title': '首次公开发行股票并在科创板上市招股说明书',
                  'date': '2021-07-20',
                  'file': '01_容知日新_首次公开发行股票并在科创板上市招股说明书_2021-07-20.pdf',
                  'min_pages': 300,
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2021/2021-7/2021-07-20/7388381.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2021/2021-7/2021-07-20/7388381.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7388381&stockid=688768',
              },
              {
                  'order': 2,
                  'kind': 'annual',
                  'year': 2021,
                  'title': '2021年年度报告',
                  'date': '2022-04-15',
                  'file': '02_容知日新_2021年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://notice.10jqka.com.cn/api/pdf/41d12d8d5b1df3dd.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-15/7989056.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2022/2022-4/2022-04-15/7989056.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=7989056&stockid=688768',
              },
              {
                  'order': 3,
                  'kind': 'annual',
                  'year': 2022,
                  'title': '2022年年度报告',
                  'date': '2023-04-11',
                  'file': '03_容知日新_2022年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://notice.10jqka.com.cn/api/pdf/918c431e9361dc80.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-11/8970198.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2023/2023-4/2023-04-11/8970198.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8970198&stockid=688768',
              },
              {
                  'order': 4,
                  'kind': 'annual',
                  'year': 2023,
                  'title': '2023年年度报告',
                  'date': '2024-04-26',
                  'file': '04_容知日新_2023年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://notice.10jqka.com.cn/api/pdf/3232be91494a6d0e.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-26/10076054.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2024/2024-4/2024-04-26/10076054.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10076054&stockid=688768',
              },
              {
                  'order': 5,
                  'kind': 'annual',
                  'year': 2024,
                  'title': '2024年年度报告',
                  'date': '2025-04-25',
                  'file': '05_容知日新_2024年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://notice.10jqka.com.cn/api/pdf/8d00f0e0c1bb72d5.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-25/10967881.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-4/2025-04-25/10967881.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=10967881&stockid=688768',
              },
              {
                  'order': 6,
                  'kind': 'annual',
                  'year': 2025,
                  'title': '2025年年度报告',
                  'date': '2026-04-28',
                  'file': '06_容知日新_2025年年度报告.pdf',
                  'min_pages': 100,
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-04-28/1225200614.PDF',
                      'https://notice.10jqka.com.cn/api/pdf/99be3db3badae47f.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-28/12210549.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-28/12210549.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12210549&stockid=688768',
              },
              {
                  'order': 7,
                  'kind': 'quarter',
                  'year': 2026,
                  'title': '2026年第一季度报告',
                  'date': '2026-04-28',
                  'file': '07_容知日新_2026年第一季度报告.pdf',
                  'min_pages': 5,
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H2_AN202604271821611373_1.pdf',
                      'https://notice.10jqka.com.cn/api/pdf/483c3cc12890f2f3.pdf',
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-28/12210543.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-28/12210543.PDF',
                  ],
                  'index': 'https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12210543&stockid=688768',
              },
          ]

          def inspect(path: Path, doc: dict) -> tuple[bool, int, str]:
              try:
                  reader = PdfReader(str(path), strict=False)
                  pages = len(reader.pages)
                  if pages < int(doc['min_pages']):
                      return False, pages, f'page count below minimum: {pages}'
                  indexes = list(range(min(16, pages)))
                  if pages > 16:
                      indexes.append(pages - 1)
                  text = ''
                  for idx in dict.fromkeys(indexes):
                      try:
                          text += '\n' + (reader.pages[idx].extract_text() or '')
                      except Exception:
                          pass
                  compact = re.sub(r'\s+', '', text)
                  if '容知日新' not in compact and '安徽容知日新科技股份有限公司' not in compact:
                      return False, pages, 'company name mismatch'
                  if doc['kind'] == 'prospectus':
                      if '招股说明书' not in compact or '首次公开发行股票' not in compact:
                          return False, pages, 'prospectus title mismatch'
                  elif doc['kind'] == 'annual':
                      year = str(doc['year'])
                      if f'{year}年年度报告' not in compact and f'{year}年度报告' not in compact:
                          return False, pages, 'annual report title mismatch'
                  else:
                      if '第一季度报告' not in compact or str(doc['year']) not in compact:
                          return False, pages, 'quarterly report title mismatch'
                  return True, pages, ''
              except Exception as exc:
                  return False, 0, repr(exc)

          def download(doc: dict) -> dict:
              destination = out / doc['file']
              last = None
              for url in doc['urls']:
                  for attempt in range(3):
                      try:
                          response = session.get(
                              url,
                              headers={'Referer': doc['index']},
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 80_000:
                              raise RuntimeError(
                                  f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                              )
                          destination.write_bytes(data)
                          ok, pages, reason = inspect(destination, doc)
                          if not ok:
                              raise RuntimeError(reason)
                          sha = hashlib.sha256(data).hexdigest()
                          print('DOWNLOADED', doc['title'], 'pages=', pages, 'bytes=', len(data), 'source=', response.url, 'sha256=', sha)
                          return {
                              **doc,
                              'pages': pages,
                              'bytes': len(data),
                              'source': response.url,
                              'sha256': sha,
                          }
                      except Exception as exc:
                          last = exc
                          destination.unlink(missing_ok=True)
                          print('FAILED', doc['title'], url, repr(exc))
                          time.sleep(min(1 + attempt, 3))
              raise RuntimeError(f'Could not download {doc["title"]}: {last!r}')

          records = [download(doc) for doc in docs]
          records.sort(key=lambda item: item['order'])

          lines = [
              '容知日新（688768）全部年报、招股说明书及最新季报资料包',
              '整理日期：2026-10-28',
              '',
              '收录范围：',
              '1. 公司于2021年7月26日在科创板上市，上市公司年度报告自2021年度起披露；本包收录2021-2025年度报告全文，共5份。',
              '2. 收录2021年7月20日披露的首次公开发行股票并在科创板上市招股说明书正式发行版。',
              '3. 截至2026年10月28日，2026年第三季度报告尚未正式披露；本包收录2026年第一季度报告作为当前最新已披露季度报告。',
              '4. 未收录年度报告摘要、半年度报告、招股意向书、注册稿或申报稿。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              lines += [
                  f"{item['order']}. {item['file']}",
                  f"   文档：{item['title']}",
                  f"   披露日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   原始PDF：{item['source']}",
                  f"   公告/索引页：{item['index']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['file']}")
          lines += [
              f'合计：7份PDF，{total_pages}页，{total_bytes}字节。',
              '全部文件均为公开渠道直接下载的完整PDF，并已完成结构、页数、公司名称和报告标题核验。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 7

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 80000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '容知日新|安徽容知日新科技股份有限公司' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/rzrx_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/rzrx_test.zip "$PACKAGE"
          unzip -t /tmp/rzrx_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/rzrx_test.zip | grep -c '\.pdf$')" -eq 7
          rm -f /tmp/rzrx_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Rongzhirixin-688768-all-annual-reports-prospectus-latest-quarter
          path: 容知日新_688768_全部年报_招股说明书_最新季报/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
