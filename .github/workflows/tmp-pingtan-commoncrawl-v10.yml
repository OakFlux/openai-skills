name: Temporary Pingtan Development Common Crawl recovery v10

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-commoncrawl-v10.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf warcio
      - name: Query Common Crawl indexes and recover report attachments
        run: |
          mkdir -p out/warc out/pdfs
          python - <<'PY'
          import gzip, hashlib, html, io, json, re, time
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from warcio.archiveiterator import ArchiveIterator

          O=Path('out'); W=O/'warc'; P=O/'pdfs'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; academic-research/1.0; +https://openai.com/)','Accept-Language':'zh-CN,zh;q=0.9'})
          logs=[]; captures=[]; payload_records=[]; candidates=set(); pdfs=[]; seen_hash=set(); queried=set()
          def note(*a):
              x=' '.join(str(v) for v in a); print(x,flush=True); logs.append(x)
          def clean(x,n=95):return re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x or '')).strip(' ._')[:n] or 'report'
          def save_pdf(content,url,tag,meta=None):
              if len(content)<1500 or not content.lstrip().startswith(b'%PDF'):return False
              h=hashlib.sha256(content).hexdigest()
              if h in seen_hash:return True
              seen_hash.add(h); tmp=P/f'_tmp_{h[:12]}.pdf'; tmp.write_bytes(content)
              try:
                  rd=PdfReader(str(tmp)); pages=len(rd.pages); tx=''
                  for pg in rd.pages[:6]:
                      try:tx+='\n'+(pg.extract_text() or '')
                      except:pass
              except Exception as e:
                  note('BADPDF',url,repr(e)); tmp.unlink(missing_ok=True); return False
              ident=any(k in tx for k in ['平潭发展','中福实业','福建中福','000592'])
              title=(meta or {}).get('title') or tag; date=(meta or {}).get('date') or ''; org=(meta or {}).get('org') or '未知机构'
              fn=f'{date}_{clean(org,30)}_{clean(title)}_{pages}页_{h[:8]}.pdf'.strip('_')
              final=P/fn; tmp.rename(final)
              rec={'file':fn,'url':url,'pages':pages,'bytes':len(content),'sha256':h,'identity':ident,'text_prefix':tx[:900],**(meta or {})}
              pdfs.append(rec); note('SAVEDPDF',fn,'IDENT',ident,url); return True
          def add_links(text,base):
              raw=html.unescape(text).replace('\\/','/')
              try:
                  soup=BeautifulSoup(text,'html.parser')
                  for tag in soup.find_all(True):
                      for a in ['href','src','data','value','action']:
                          v=tag.get(a)
                          if isinstance(v,str) and v.strip():candidates.add(urljoin(base,v.strip()))
              except:pass
              for v in re.findall(r'https?://[^\s"\'<>]+',raw,re.I):candidates.add(v.rstrip('),;'))
              for v in re.findall(r'["\']([^"\']+(?:\.pdf|download|down|attach|file|report|rpt|doc)[^"\']*)["\']',raw,re.I):
                  candidates.add(urljoin(base,v))

          report_meta={
            '440149918114':{'date':'2013-12-12','org':'国海证券','title':'中福实业深度报告：乘平潭开发东风，2014年进入增长快车道'},
            '376416689327':{'date':'2011-11-16','org':'中信建投','title':'中福实业调研深度：主业稳健发展，借力平潭特区'},
            '375349674203':{'date':'2011-11-11','org':'宏源证券','title':'中福实业：依托林业资产，分享平潭政策红利'},
            '448703281041':{'date':'2014-03-21','org':'国金证券','title':'中福实业“X+1”主题推荐系列：扎根两岸家园，兑现业绩高成长'},
            '459957262560':{'date':'2014-07-14','org':'中信建投','title':'中福实业调研报告：平潭综合实验区开放开发超预期'},
          }
          target_meta={}
          targets=[]
          for rid,meta in report_meta.items():
              paths=[
                f'vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',
                f'vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/search/rptid/{rid}/url',
                f'vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml',
                f'vip.stock.finance.sina.com.cn/q/go.php/vReport_Show/kind/lastest/rptid/{rid}/url',
                f'stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',
                f'stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/url',
                f'stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml',
                f'stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/{rid}/url',
              ]
              for p in paths: targets.append(p); target_meta[p]=meta
          hibor={
            '601896':{'date':'2011-11-21','org':'宏源证券','title':'中福实业：依托林业资产，分享平潭政策红利'},
            '608471':{'date':'2011-11-16','org':'中信建投','title':'中福实业调研深度：主业稳健发展，借力平潭特区'},
            '927456':{'date':'2013-01-22','org':'海通证券','title':'中福实业：平潭全面建设助力公司业绩反转'},
            '1177086':{'date':'2013-12-12','org':'国海证券','title':'中福实业：乘平潭开发东风，2014年进入增长快车道'},
            '1248887':{'date':'2014-03-21','org':'国金证券','title':'中福实业：扎根两岸家园，兑现业绩高成长'},
            '1344452':{'date':'2014-07-14','org':'中信建投','title':'中福实业：建设两岸家园，共享自由港繁荣'},
          }
          for did,meta in hibor.items():
              for p in [f'www.hibor.com.cn/docdetail_{did}.html',f'www.hibor.com.cn/docdetail.asp?id={did}',f'www.hibor.com.cn/wap_detail.aspx?id={did}']:
                  targets.append(p); target_meta[p]=meta
          # An indexed 9FZT report with a strong company-deep title.
          p='www.9fzt.com/others/report.html?pushChannel=9fztgw&contentType=article&page=view_the_article&contentId=486549281752'
          targets.append(p); target_meta[p]={'date':'2015-06-02','org':'兴业证券','title':'平潭发展系列报告之一：平潭岛唯一上市标的，尽享地区成长红利'}

          # Select collections covering the period when the report pages and attachments were live.
          try:
              ci=s.get('https://index.commoncrawl.org/collinfo.json',timeout=60).json()
          except Exception as e:
              note('COLLINFO_ERR',repr(e)); ci=[]
          colls=[]
          for c in ci:
              cid=c.get('id','')
              m=re.search(r'CC-MAIN-(\d{4})',cid)
              if m and 2013 <= int(m.group(1)) <= 2020:colls.append(cid)
          colls=colls[:80]
          note('COLLECTIONS',len(colls),colls[:5],colls[-5:])

          # First pass: exact index queries. Avoid exploding request count by stopping a target after 8 captures.
          target_counts={}
          for ti,target in enumerate(targets):
              meta=target_meta[target]
              found=0
              for cid in colls:
                  if found>=8:break
                  idx=f'https://index.commoncrawl.org/{cid}-index'
                  params={'url':target,'output':'json','matchType':'exact'}
                  try:
                      r=s.get(idx,params=params,timeout=35)
                      if r.status_code!=200 or not r.text.strip() or r.text.lstrip().startswith('<'):
                          continue
                      for line in r.text.splitlines():
                          try:row=json.loads(line)
                          except:continue
                          row['_collection']=cid; row['_meta']=meta; captures.append(row); found+=1
                          note('CAPTURE',target,cid,row.get('timestamp'),row.get('status'),row.get('mime'),row.get('url'))
                          if found>=8:break
                  except Exception as e:
                      if 'Read timed out' not in repr(e):note('INDEXERR',target,cid,repr(e))
                  time.sleep(.05)
              target_counts[target]=found
              note('TARGETDONE',ti+1,'/',len(targets),target,'FOUND',found)
          (O/'captures.json').write_text(json.dumps(captures,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'target_counts.json').write_text(json.dumps(target_counts,ensure_ascii=False,indent=2),encoding='utf-8')

          # Fetch unique WARC records, prioritizing /url redirects and PDF MIME.
          unique=[]; seen=set()
          for row in captures:
              key=(row.get('filename'),row.get('offset'),row.get('length'))
              if key in seen:continue
              seen.add(key); unique.append(row)
          unique.sort(key=lambda x:(0 if ('/url' in x.get('url','') or 'pdf' in x.get('mime','').lower()) else 1,x.get('timestamp','')))
          for i,row in enumerate(unique[:260]):
              try:
                  off=int(row['offset']); length=int(row['length']); f=row['filename']
                  u='https://data.commoncrawl.org/'+f
                  rr=s.get(u,headers={'Range':f'bytes={off}-{off+length-1}'},timeout=90)
                  note('WARCGET',i,rr.status_code,len(rr.content),row.get('timestamp'),row.get('url'))
                  if rr.status_code not in (200,206):continue
                  rec=None
                  for ar in ArchiveIterator(io.BytesIO(rr.content)):
                      if ar.rec_type in ('response','resource'):
                          rec=ar; break
                  if rec is None:continue
                  payload=rec.content_stream().read()
                  status=''; ctype=''; loc=''
                  if rec.http_headers:
                      status=rec.http_headers.get_statuscode() or ''
                      ctype=rec.http_headers.get_header('Content-Type') or ''
                      loc=rec.http_headers.get_header('Location') or ''
                  meta=row.get('_meta') or {}
                  base=row.get('url') or target_meta.get(row.get('url',''),{}).get('url','')
                  outrec={'index':i,'timestamp':row.get('timestamp'),'url':base,'status':status,'type':ctype,'location':loc,'bytes':len(payload),'meta':meta}
                  if save_pdf(payload,base,f'cc_{i}',meta):outrec['pdf']=True
                  else:
                      text=payload.decode('utf-8','replace')
                      if '\ufffd' in text[:300]:
                          for enc in ['gb18030','gbk','big5']:
                              try:
                                  alt=payload.decode(enc,'replace')
                                  if alt.count('\ufffd')<text.count('\ufffd'):text=alt
                              except:pass
                      (W/f'payload_{i}.txt').write_text(text,encoding='utf-8',errors='ignore')
                      add_links(text,base)
                  if loc:
                      candidates.add(urljoin(base,loc))
                  payload_records.append(outrec)
              except Exception as e:note('WARCERR',i,repr(e))
              time.sleep(.1)
          (O/'payload_records.json').write_text(json.dumps(payload_records,ensure_ascii=False,indent=2),encoding='utf-8')

          # Live-follow recovered attachment-looking URLs.
          follow=[]
          for u in candidates:
              low=u.lower()
              if len(u)>1200 or low.startswith(('javascript:','mailto:','app:','data:')):continue
              if any(k in low for k in ['.pdf','download','attach','downfile','filedown','report','rptid','docdetail']) and not any(k in low for k in ['weibo.com','baidu.com','javascript']):
                  follow.append(u)
          follow=list(dict.fromkeys(follow))[:400]
          note('CANDIDATES',len(candidates),'FOLLOW',len(follow))
          live=[]
          for i,u in enumerate(follow):
              try:
                  r=s.get(u,timeout=50,allow_redirects=True,headers={'Referer':'https://finance.sina.com.cn/'})
                  rec={'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'history':[{'status':h.status_code,'url':h.url,'location':h.headers.get('Location')} for h in r.history]}
                  live.append(rec); note('LIVE',i,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                  # Infer metadata from any report ID in URL.
                  meta={}
                  for rid,m in report_meta.items():
                      if rid in u:meta=m;break
                  if save_pdf(r.content,r.url,f'live_{i}',meta):rec['pdf']=True
              except Exception as e:
                  live.append({'url':u,'error':repr(e)}); note('LIVEERR',i,u,repr(e))
              time.sleep(.12)
          (O/'candidates.json').write_text(json.dumps(sorted(candidates),ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'live.json').write_text(json.dumps(live,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          note('DONE','CAPTURES',len(captures),'PAYLOADS',len(payload_records),'PDFS',len(pdfs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-commoncrawl-v10
          path: out/
          retention-days: 3
