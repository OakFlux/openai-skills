name: Inspect Shimao financial report page 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-financial-page-discovery-20261012.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch financial report page
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'en-US,en;q=0.9,zh;q=0.8'})
          urls=['https://shimaogroup.hk/en/Financial/Index/','https://shimaogroup.hk/zh-TW/Financial/Index/','https://www.shimaogroup.hk/en/Financial/Index/','https://www.shimaogroup.hk/zh-TW/Financial/Index/']
          for url in urls:
            for verify in (False, True):
              try:
                r=s.get(url,timeout=(20,40),allow_redirects=True,verify=verify)
                print('\nPAGE',url,'VERIFY',verify,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,flush=True)
                text=r.text
                print('HEAD',text[:12000].replace('\n',' '),flush=True)
                soup=BeautifulSoup(text,'html.parser')
                for tag in soup.find_all(['a','script','link','iframe','form']):
                  for attr in ('href','src','action','data-url','data-href','data-src'):
                    v=tag.get(attr)
                    if v:
                      full=urljoin(r.url,v)
                      if any(k in full.lower() for k in ['downloadfile','pdf','financial','report','annual','interim','api','ajax','json','upload']):
                        print('LINK',full,'TEXT',tag.get_text(' ',strip=True)[:300],flush=True)
                for p in [r'/Upload/DownloadFile/[A-Za-z0-9_\-]+',r'https?://[^\"\'<> ]+\.pdf[^\"\'<> ]*',r'[^\"\'<> ]+\.pdf[^\"\'<> ]*']:
                  seen=[]
                  for m in re.findall(p,text,re.I):
                    if m not in seen: seen.append(m)
                  for m in seen: print('MATCH',m,flush=True)
                break
              except Exception as e:
                print('ERROR',url,'VERIFY',verify,repr(e),flush=True)
          PY
