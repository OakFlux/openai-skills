name: Temporary Fetch StarPower Filings

on:
  push:
    branches:
      - tmp/fetch-starpower-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests

          STOCK_ID = '603290'
          COMPANY = '斯达半导体股份有限公司'
          ROOT = Path('starpower_package')
          PDF_DIR = ROOT / '01_年度报告及半年度报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          specs = [
              {
                  'kind': 'annual_report',
                  'label': '2020年年度报告',
                  'date': '2021-04-09',
                  'filename': '01_斯达半导_2020年年度报告.pdf',
                  'keyword': '2020年年度报告',
                  'target': '2020年年度报告',
                  'prefer_revision': False,
                  'min_pages': 80,
              },
              {
                  'kind': 'annual_report',
                  'label': '2021年年度报告',
                  'date': '2022-04-09',
                  'filename': '02_斯达半导_2021年年度报告.pdf',
                  'keyword': '2021年年度报告',
                  'target': '2021年年度报告',
                  'prefer_revision': False,
                  'min_pages': 80,
              },
              {
                  'kind': 'annual_report',
                  'label': '2022年年度报告（修订版）',
                  'date': '2023-04-11',
                  'filename': '03_斯达半导_2022年年度报告_修订版.pdf',
                  'keyword': '2022年年度报告',
                  'target': '2022年年度报告',
                  'prefer_revision': True,
                  'min_pages': 80,
              },
              {
                  'kind': 'annual_report',
                  'label': '2023年年度报告',
                  'date': '2024-04-08',
                  'filename': '04_斯达半导_2023年年度报告.pdf',
                  'keyword': '2023年年度报告',
                  'target': '2023年年度报告',
                  'prefer_revision': False,
                  'min_pages': 80,
              },
              {
                  'kind': 'annual_report',
                  'label': '2024年年度报告',
                  'date': '2025-04-26',
                  'filename': '05_斯达半导_2024年年度报告.pdf',
                  'keyword': '2024年年度报告',
                  'target': '2024年年度报告',
                  'prefer_revision': False,
                  'min_pages': 80,
              },
              {
                  'kind': 'annual_report',
                  'label': '2025年年度报告',
                  'date': '2026-04-30',
                  'filename': '06_斯达半导_2025年年度报告.pdf',
                  'keyword': '2025年年度报告',
                  'target': '2025年年度报告',
                  'prefer_revision': False,
                  'min_pages': 80,
              },
              {
                  'kind': 'half_year_report',
                  'label': '2026年半年度报告',
                  'date': '2026-08-25',
                  'filename': '07_斯达半导_2026年半年度报告.pdf',
                  'keyword': '2026年半年度报告',
                  'target': '2026年半年度报告',
                  'prefer_revision': False,
                  'min_pages': 50,
                  'known_sina_detail_id': '12525003',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })

          def compact_text(value):
              return re.sub(r'\s+', '', html.unescape(str(value))).replace('（', '(').replace('）', ')')

          def decode_response(response):
              raw = response.content
              for encoding in ('utf-8', 'gb18030', 'gbk', 'big5'):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      continue
              return raw.decode('utf-8', errors='ignore')

          def collect_strings(value):
              if isinstance(value, dict):
                  for child in value.values():
                      yield from collect_strings(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from collect_strings(child)
              elif isinstance(value, str):
                  yield value

          def normalize_pdf_url(value):
              value = html.unescape(unquote(str(value))).replace('\\/', '/').strip()
              if value.startswith('//'):
                  return 'https:' + value
              if value.startswith('http://') or value.startswith('https://'):
                  return value
              if value.startswith('/'):
                  return 'https://static.sse.com.cn' + value
              return urljoin('https://static.sse.com.cn/', value)

          def extract_pdf_urls(value):
              urls = []
              for string in collect_strings(value):
                  if '.pdf' not in string.lower():
                      continue
                  for match in re.findall(r'(?:https?:)?//[^\s\"\'<>]+?\.pdf|/[^\s\"\'<>]+?\.pdf', string, flags=re.I):
                      url = normalize_pdf_url(match)
                      if url not in urls:
                          urls.append(url)
              return urls

          def query_sse(spec):
              endpoint = 'https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
              callback = 'jsonpCallback603290'
              params = {
                  'jsonCallBack': callback,
                  'isPagination': 'true',
                  'productId': STOCK_ID,
                  'securityType': '0101,120100,020100,020200,120200',
                  'reportType': 'ALL',
                  'reportType2': '',
                  'keyWord': spec['keyword'],
                  'beginDate': spec['date'],
                  'endDate': spec['date'],
                  'pageHelp.pageSize': '100',
                  'pageHelp.pageCount': '50',
                  'pageHelp.pageNo': '1',
                  'pageHelp.beginPage': '1',
                  'pageHelp.cacheSize': '1',
                  'pageHelp.endPage': '5',
              }
              response = session.get(
                  endpoint,
                  params=params,
                  headers={'Referer': 'https://www.sse.com.cn/disclosure/listedinfo/announcement/'},
                  timeout=60,
              )
              response.raise_for_status()
              text = decode_response(response)
              first = text.find('{')
              last = text.rfind('}')
              if first < 0 or last <= first:
                  return []
              payload = json.loads(text[first:last + 1])
              matches = []

              def walk(node):
                  if isinstance(node, dict):
                      blob = json.dumps(node, ensure_ascii=False)
                      compact_blob = compact_text(blob)
                      target = compact_text(spec['target'])
                      title_match = target in compact_blob
                      excluded = any(term in compact_blob for term in ['摘要', '审计报告', '业绩预告', '业绩快报'])
                      revision_ok = (not spec['prefer_revision']) or ('修订' in compact_blob)
                      company_ok = ('斯达半导' in compact_blob) or (STOCK_ID in compact_blob)
                      if title_match and not excluded and revision_ok and company_ok:
                          urls = extract_pdf_urls(node)
                          if urls:
                              matches.append({
                                  'source': '上交所公告系统',
                                  'metadata': blob,
                                  'urls': urls,
                              })
                      for child in node.values():
                          walk(child)
                  elif isinstance(node, list):
                      for child in node:
                          walk(child)

              walk(payload)
              unique = []
              seen = set()
              for item in matches:
                  for url in item['urls']:
                      if url not in seen:
                          seen.add(url)
                          unique.append({'url': url, 'source': item['source'], 'metadata': item['metadata']})
              return unique

          def parse_sina_anchors(page_url):
              response = session.get(page_url, headers={'Referer': 'https://finance.sina.com.cn/'}, timeout=60)
              response.raise_for_status()
              text = decode_response(response)
              anchors = []
              for match in re.finditer(r'<a\b([^>]*?)href=[\"\']([^\"\']+)[\"\']([^>]*)>(.*?)</a>', text, flags=re.I | re.S):
                  href = html.unescape(match.group(2)).replace('\\/', '/')
                  visible = re.sub(r'<[^>]+>', ' ', match.group(4))
                  visible = re.sub(r'\s+', ' ', html.unescape(visible)).strip()
                  if 'vCB_AllBulletinDetail' not in href:
                      continue
                  id_match = re.search(r'(?:[?&]|%3F|%26)id(?:=|%3D)(\d+)', href, flags=re.I)
                  if not id_match:
                      id_match = re.search(r'id/(\d+)', href, flags=re.I)
                  if id_match:
                      anchors.append({'id': id_match.group(1), 'title': visible, 'href': href})
              return anchors

          def sina_detail_pdf_urls(detail_id):
              detail = f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={detail_id}&stockid={STOCK_ID}'
              response = session.get(detail, headers={'Referer': 'https://vip.stock.finance.sina.com.cn/'}, timeout=60)
              response.raise_for_status()
              text = html.unescape(decode_response(response)).replace('\\/', '/')
              urls = []
              for match in re.findall(r'https?://[^\s\"\'<>]+?\.PDF', text, flags=re.I):
                  url = unquote(match)
                  if url not in urls:
                      urls.append(url)
              return urls

          def sina_fallback(spec):
              candidates = []
              known_id = spec.get('known_sina_detail_id')
              if known_id:
                  urls = sina_detail_pdf_urls(known_id)
                  if not urls:
                      year, month, _ = spec['date'].split('-')
                      urls = [
                          f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/{year}/{year}-{int(month)}/{spec["date"]}/{known_id}.PDF',
                          f'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/{year}/{year}-{int(month)}/{spec["date"]}/{known_id}.PDF',
                      ]
                  for url in urls:
                      candidates.append({'url': url, 'source': '新浪财经公开披露镜像', 'metadata': f'detail_id={known_id}'})
                  return candidates

              if spec['kind'] == 'annual_report':
                  page_url = f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK_ID}/page_type/ndbg.phtml'
              else:
                  page_url = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK_ID}.phtml'
              try:
                  anchors = parse_sina_anchors(page_url)
              except Exception as exc:
                  print(f'Sina listing failed for {spec["label"]}: {exc}', file=sys.stderr)
                  return candidates

              target = compact_text(spec['target'])
              ranked = []
              for anchor in anchors:
                  title = compact_text(anchor['title'])
                  if target not in title:
                      continue
                  if any(term in title for term in ['摘要', '审计报告']):
                      continue
                  score = 0
                  if spec['prefer_revision'] and '修订' in title:
                      score += 10
                  if compact_text(spec['label']) in title:
                      score += 5
                  ranked.append((score, anchor))
              ranked.sort(key=lambda pair: pair[0], reverse=True)
              for _, anchor in ranked:
                  try:
                      urls = sina_detail_pdf_urls(anchor['id'])
                  except Exception as exc:
                      print(f'Sina detail failed {anchor["id"]}: {exc}', file=sys.stderr)
                      urls = []
                  if not urls:
                      year, month, _ = spec['date'].split('-')
                      urls = [
                          f'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESH_STOCK/{year}/{year}-{int(month)}/{spec["date"]}/{anchor["id"]}.PDF',
                          f'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/{year}/{year}-{int(month)}/{spec["date"]}/{anchor["id"]}.PDF',
                      ]
                  for url in urls:
                      candidates.append({'url': url, 'source': '新浪财经公开披露镜像', 'metadata': anchor['title']})
              return candidates

          def looks_like_pdf(raw):
              return len(raw) > 100_000 and raw.lstrip().startswith(b'%PDF') and b'%%EOF' in raw[-16384:]

          def download_pdf(url):
              referer = 'https://www.sse.com.cn/' if 'sse.com.cn' in url else 'https://vip.stock.finance.sina.com.cn/'
              with session.get(url, headers={'Referer': referer}, timeout=150, allow_redirects=True, stream=True) as response:
                  response.raise_for_status()
                  data = bytearray()
                  for chunk in response.iter_content(chunk_size=1024 * 256):
                      if chunk:
                          data.extend(chunk)
                  raw = bytes(data)
                  if not looks_like_pdf(raw):
                      raise RuntimeError(
                          f'not a complete PDF: type={response.headers.get("content-type")}, '
                          f'bytes={len(raw)}, head={raw[:20]!r}'
                      )
                  return raw

          def pdf_page_count(path):
              completed = subprocess.run(['pdfinfo', str(path)], capture_output=True, text=True, check=True)
              match = re.search(r'^Pages:\s+(\d+)\s*$', completed.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_text(path, pages):
              parts = []
              with tempfile.TemporaryDirectory() as tmp:
                  tmp_dir = Path(tmp)
                  for page in pages:
                      output = tmp_dir / f'page_{page}.txt'
                      completed = subprocess.run(
                          ['pdftotext', '-f', str(page), '-l', str(page), '-enc', 'UTF-8', str(path), str(output)],
                          capture_output=True,
                          text=True,
                      )
                      if completed.returncode == 0 and output.exists():
                          parts.append(output.read_text(encoding='utf-8', errors='ignore'))
              return '\n'.join(parts)

          manifest = []
          sha_lines = []

          for spec in specs:
              candidates = query_sse(spec)
              for fallback in sina_fallback(spec):
                  if all(existing['url'] != fallback['url'] for existing in candidates):
                      candidates.append(fallback)
              print(f'CANDIDATES {spec["label"]}: {[item["url"] for item in candidates]}')
              if not candidates:
                  raise RuntimeError(f'No PDF candidates found for {spec["label"]}')

              path = PDF_DIR / spec['filename']
              errors = []
              selected = None
              for candidate in candidates:
                  for attempt in range(1, 4):
                      try:
                          print(f'GET {spec["label"]} attempt={attempt}: {candidate["url"]}')
                          raw = download_pdf(candidate['url'])
                          path.write_bytes(raw)
                          pages = pdf_page_count(path)
                          if pages < spec['min_pages']:
                              raise RuntimeError(f'only {pages} pages')
                          sample_pages = sorted(set([1, min(5, pages), min(20, pages), max(1, pages // 2), pages]))
                          text = extract_text(path, sample_pages)
                          compact = compact_text(text)
                          identity_ok = any(term in compact for term in [
                              compact_text(COMPANY), '斯达半导', STOCK_ID, 'StarPowerSemiconductor'
                          ])
                          title_ok = compact_text(spec['target']) in compact
                          if not identity_ok or not title_ok:
                              expanded = extract_text(path, list(range(1, min(30, pages) + 1)))
                              expanded_compact = compact_text(expanded)
                              identity_ok = any(term in expanded_compact for term in [
                                  compact_text(COMPANY), '斯达半导', STOCK_ID, 'StarPowerSemiconductor'
                              ])
                              title_ok = compact_text(spec['target']) in expanded_compact
                          if not identity_ok or not title_ok:
                              raise RuntimeError(f'identity/title mismatch: identity={identity_ok}, title={title_ok}')
                          selected = {
                              'raw': raw,
                              'pages': pages,
                              'sample_pages': sample_pages,
                              'identity_ok': identity_ok,
                              'title_ok': title_ok,
                              'candidate': candidate,
                          }
                          break
                      except Exception as exc:
                          errors.append(f'{candidate["url"]} attempt {attempt}: {exc}')
                          path.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
                  if selected:
                      break
              if not selected:
                  raise RuntimeError(f'Unable to download and verify {spec["label"]}:\n' + '\n'.join(errors))

              sha = hashlib.sha256(selected['raw']).hexdigest()
              rel = str(path.relative_to(ROOT))
              record = {
                  'document_type': spec['kind'],
                  'title': spec['label'],
                  'disclosure_date': spec['date'],
                  'file': rel,
                  'pages': selected['pages'],
                  'bytes': len(selected['raw']),
                  'sha256': sha,
                  'source': selected['candidate']['source'],
                  'source_url': selected['candidate']['url'],
                  'source_metadata': selected['candidate']['metadata'],
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': selected['identity_ok'],
                  'title_text_matched': selected['title_ok'],
                  'sampled_pages': selected['sample_pages'],
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {rel}')
              print(f'VERIFIED {spec["label"]}: pages={selected["pages"]}, bytes={len(selected["raw"])}')

          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '斯达半导体股份有限公司（斯达半导，603290）公开披露文件包',
              '',
              '内容范围：',
              '1. 2020—2025年六份完整年度报告；',
              '2. 2022年度报告采用公司后续披露的修订版；',
              '3. 截至2026年8月30日最新披露的2026年半年度报告。',
              '',
              '校验项目：PDF文件头与EOF、pdfinfo可解析页数、公司名称/证券代码与报告标题文字层、逐份SHA-256、ZIP CRC。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f'- {record["title"]}',
                  f'  披露日期：{record["disclosure_date"]}',
                  f'  文件：{record["file"]}',
                  f'  页数：{record["pages"]}',
                  f'  大小：{record["bytes"]} bytes',
                  f'  SHA256：{record["sha256"]}',
                  f'  来源：{record["source"]}',
                  f'  PDF地址：{record["source_url"]}',
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '斯达半导_603290_2020-2025年报_2026年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: starpower-filings
          path: 斯达半导_603290_2020-2025年报_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
