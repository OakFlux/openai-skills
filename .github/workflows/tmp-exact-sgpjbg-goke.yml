name: Temporary exact Goke Micro SGPJBG probe

on:
  push:
    branches:
      - tmp-goke-exact-sgpjbg-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pypdf

      - name: Inspect exact public report and download pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import urllib.parse
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          ids = [4827, 4806, 45352]
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/json,application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          explicit = set()
          pages = []

          for rid in ids:
              for kind in ['baogao', 'bgdown']:
                  url = f'https://www.sgpjbg.com/{kind}/{rid}.html'
                  try:
                      r = s.get(url, timeout=90, allow_redirects=True, headers={'Referer': 'https://www.sgpjbg.com/labels/guoxinpianshichang.html'})
                      print('\nPAGE', rid, kind, r.status_code, len(r.content), r.headers.get('content-type'), r.url)
                      print('HEADERS', json.dumps(dict(r.headers), ensure_ascii=False)[:5000])
                      print('COOKIES', s.cookies.get_dict())
                      print('BODY_HEAD', r.text[:3000].replace('\n',' ') if 'text' in (r.headers.get('content-type') or '') or 'html' in (r.headers.get('content-type') or '') else r.content[:100])
                      if r.status_code == 200 and r.content.startswith(b'%PDF-'):
                          p=Path(f'found_{rid}_{kind}.pdf'); p.write_bytes(r.content)
                          print('DIRECT_PDF', p, len(PdfReader(str(p)).pages))
                          continue
                      if r.status_code != 200:
                          continue
                      html = r.text
                      soup = BeautifulSoup(html, 'html.parser')
                      title = soup.title.get_text(' ', strip=True) if soup.title else ''
                      visible = ' '.join(soup.get_text(' ', strip=True).split())
                      print('TITLE', title)
                      print('VISIBLE', visible[:5000])
                      pages.append({'rid':rid,'kind':kind,'url':r.url,'title':title})

                      for form in soup.find_all('form'):
                          print('FORM', json.dumps({
                              'action': urllib.parse.urljoin(r.url, form.get('action') or ''),
                              'method': form.get('method'),
                              'id': form.get('id'),
                              'class': form.get('class'),
                              'inputs': [{k:x.get(k) for k in ['name','value','type','id']} for x in form.find_all('input')],
                          }, ensure_ascii=False)[:8000])

                      for tag in soup.find_all(['a','button','input','iframe','embed','object','source','script']):
                          blob = str(tag)
                          if any(k in blob.lower() for k in ['download','bgdown','pdf','attachment','file','下载','原文','vip','login']):
                              attrs={}
                              for attr in ['href','src','data','data-url','data-href','data-file','data-download','onclick','value','action','id','class','name']:
                                  if tag.get(attr) is not None:
                                      attrs[attr]=tag.get(attr)
                              print('TAG', json.dumps({'tag':tag.name,'text':tag.get_text(' ',strip=True)[:500],'attrs':attrs},ensure_ascii=False)[:8000])
                              for val in attrs.values():
                                  if isinstance(val, list): val=' '.join(map(str,val))
                                  for u in re.findall(r'https?://[^\s\"\'<>]+|/[A-Za-z0-9_./?=&%:+-]+', str(val)):
                                      explicit.add(urllib.parse.urljoin(r.url,u.strip('\\\"\'(),;')))

                      for pat in [
                          r'https?://[^\s\"\'<>]+\.pdf(?:\?[^\s\"\'<>]*)?',
                          r'https?://[^\s\"\'<>]+(?:download|bgdown|down|file|attachment)[^\s\"\'<>]*',
                          r'/[A-Za-z0-9_./?=&%:+-]*(?:download|bgdown|down|file|attachment)[A-Za-z0-9_./?=&%:+-]*',
                      ]:
                          for m in re.findall(pat, html, re.I):
                              explicit.add(urllib.parse.urljoin(r.url,m.strip('\\\"\'(),;')))

                      for script in soup.find_all('script', src=True):
                          jsurl=urllib.parse.urljoin(r.url,script['src'])
                          try:
                              jr=s.get(jsurl,timeout=45)
                              js=jr.text
                              if any(k in js.lower() for k in ['download','bgdown','.pdf','fileurl','attachment']):
                                  print('SCRIPT',jsurl,jr.status_code,len(jr.content))
                                  for needle in ['download','bgdown','.pdf','fileUrl','attachment']:
                                      for mm in list(re.finditer(re.escape(needle),js,re.I))[:10]:
                                          pos=mm.start(); print('SCRIPT_CTX',needle,js[max(0,pos-800):pos+2500].replace('\n',' ')[:3300])
                                  for pat in [
                                      r'https?://[^\s\"\'<>]+\.pdf(?:\?[^\s\"\'<>]*)?',
                                      r'https?://[^\s\"\'<>]+(?:download|bgdown|down|file|attachment)[^\s\"\'<>]*',
                                      r'/[A-Za-z0-9_./?=&%:+-]*(?:download|bgdown|down|file|attachment)[A-Za-z0-9_./?=&%:+-]*',
                                  ]:
                                      for m in re.findall(pat,js,re.I): explicit.add(urllib.parse.urljoin(r.url,m.strip('\\\"\'(),;')))
                          except Exception as e: print('SCRIPT_ERR',jsurl,repr(e))
                  except Exception as e:
                      print('PAGE_ERR',rid,kind,repr(e))

          print('\nEXPLICIT_URLS', len(explicit))
          for u in sorted(explicit): print('EXPLICIT',u)

          found=[]
          for u in sorted(explicit):
              low=u.lower()
              if any(k in low for k in ['login','register','vip','order','pay']):
                  continue
              try:
                  r=s.get(u,timeout=90,allow_redirects=True,headers={'Referer':'https://www.sgpjbg.com/labels/guoxinpianshichang.html'})
                  print('TEST',u,r.status_code,len(r.content),r.headers.get('content-type'),r.url,r.content[:12])
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100000:
                      p=Path(f'found_explicit_{len(found)+1}.pdf'); p.write_bytes(r.content)
                      reader=PdfReader(str(p),strict=False); pages_count=len(reader.pages)
                      text=''
                      for pg in reader.pages[:min(5,pages_count)]:
                          try:text += pg.extract_text() or ''
                          except Exception:pass
                      compact=re.sub(r'\s+','',text)
                      if '国科微' in compact or '300672' in compact:
                          found.append({'path':str(p),'url':r.url,'pages':pages_count,'bytes':len(r.content)})
                          print('FOUND',json.dumps(found[-1],ensure_ascii=False))
                      else:p.unlink()
              except Exception as e: print('TEST_ERR',u,repr(e))

          Path('probe.json').write_text(json.dumps({'pages':pages,'explicit':sorted(explicit),'found':found},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Goke_Micro_Exact_SGPJBG_Probe
          path: |
            probe.json
            found_*.pdf
          if-no-files-found: warn
          retention-days: 1
