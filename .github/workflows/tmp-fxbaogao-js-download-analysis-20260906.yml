name: Temporary FXBaoGao frontend download analysis

on:
  push:
    branches:
      - tmp-fxbaogao-js-download-analysis-20260906

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch and analyze frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out=Path('output'); out.mkdir(exist_ok=True)
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
          })
          pages=[
            'https://www.fxbaogao.com/rp?keywords=%E7%88%B1%E8%8A%AF%E5%85%83%E6%99%BA&order=2&nop=-1',
            'https://www.fxbaogao.com/detail/5480083',
            'https://www.fxbaogao.com/view?id=5480083',
          ]
          script_urls=[]
          for page_url in pages:
            r=s.get(page_url,timeout=(20,90),allow_redirects=True)
            print('PAGE',page_url,r.status_code,len(r.content),r.url,flush=True)
            if r.status_code!=200: continue
            soup=BeautifulSoup(r.text,'html.parser')
            for tag in soup.find_all('script',src=True):
              u=urljoin(r.url,tag['src'])
              if u not in script_urls: script_urls.append(u)
          # Include configuration explicitly.
          for u in [
            'https://static.fxbaogao.com/pub/js/config/production.js',
            'https://www.fxbaogao.com/_fxbg/2609031714/js/app-pages-fxbg-main-js.71ff9d5297a4e28fc829.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2609031714/js/common.449d2a6a483f7d6143a9.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2609031714/js/9.aaa91e44bc28a3bedda5.chunk.js',
            'https://www.fxbaogao.com/_fxbg/2609031714/js/29.cde1f2ce1b0ad15ee456.chunk.js',
          ]:
            if u not in script_urls: script_urls.append(u)

          keywords=[
            'pdfPath','fileUrl','downloadUrl','download','getReportPreviewImages','searchNoAuth',
            'reportId','docId','mofoun/report','report/report','getDownload','downloadReport',
            'report/download','pdfurl','pdfUrl','dr.fxbaogao','public.fxbaogao','authorization',
            'sign','signature','token','decrypt','encrypt','oss','presign','signedUrl','getUrl',
          ]
          endpoints=[]
          snippets=[]
          manifest=[]
          for i,u in enumerate(script_urls):
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('SCRIPT',i,r.status_code,len(r.content),u,flush=True)
              if r.status_code!=200: continue
              text=r.text
              filename=f'script_{i:03d}.js'
              (out/filename).write_text(text,encoding='utf-8',errors='ignore')
              manifest.append({'index':i,'url':u,'file':filename,'bytes':len(r.content)})
              low=text.lower()
              for kw in keywords:
                start=0; count=0
                while True:
                  pos=low.find(kw.lower(),start)
                  if pos<0: break
                  snippets.append({
                    'script_index':i,'script_url':u,'keyword':kw,'position':pos,
                    'snippet':text[max(0,pos-1500):min(len(text),pos+3500)],
                  })
                  count+=1; start=pos+len(kw)
                  if count>=30: break
              # Collect likely endpoints and hosts.
              patterns=[
                r'https?://[^"\'`\\\s<>]+',
                r'["\'](/[^"\']*(?:download|report|pdf|file|mofoun|preview|sign|token|oss)[^"\']*)["\']',
              ]
              for pat in patterns:
                for m in re.findall(pat,text,re.I):
                  value=''.join(m) if isinstance(m,tuple) else m
                  if len(value)>1000: continue
                  lv=value.lower()
                  if any(k in lv for k in ['download','report','pdf','file','mofoun','preview','sign','token','oss','fxbaogao']):
                    endpoints.append({'script_index':i,'script_url':u,'value':value})
            except Exception as e:
              print('SCRIPT_ERROR',i,u,repr(e),flush=True)
          # dedupe endpoints
          dedup=[]; seen=set()
          for x in endpoints:
            key=(x['script_url'],x['value'])
            if key in seen: continue
            seen.add(key); dedup.append(x)
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'keyword_snippets.json').write_text(json.dumps(snippets,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'endpoints.json').write_text(json.dumps(dedup,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SCRIPTS',len(manifest),'SNIPPETS',len(snippets),'ENDPOINTS',len(dedup),flush=True)
          for x in dedup[:500]: print('ENDPOINT',x['script_index'],x['value'][:1000],flush=True)
          PY
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-js-download-analysis
          path: output/*
          retention-days: 1
          if-no-files-found: error
