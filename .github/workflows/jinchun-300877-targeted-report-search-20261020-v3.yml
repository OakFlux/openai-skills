name: Targeted search Jinchun 300877 broker reports 20261020

on:
  push:
    branches:
      - tmp/jinchun-300877-targeted-report-search-20261020-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Search narrow report windows and Sina
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, requests, time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://data.eastmoney.com/report/','Accept-Language':'zh-CN,zh;q=0.9'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2020-06-01','2020-09-30'),
            ('2023-12-15','2024-01-15'),
            ('2024-01-01','2024-12-31'),
          ]
          seen=set(); matches=[]
          for begin,end in windows:
            for qtype in ['0','1','2']:
              print('\n### WINDOW',begin,end,'QTYPE',qtype)
              for page in range(1,80):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                try:
                  r=s.get(api,params=params,timeout=(20,120)); d=r.json(); batch=d.get('data') or []
                  if isinstance(batch,dict): batch=batch.get('list') or batch.get('data') or []
                  if page==1: print('hits',d.get('hits'),'first_count',len(batch) if isinstance(batch,list) else 'bad')
                  if not isinstance(batch,list) or not batch: break
                  for x in batch:
                    blob=' '.join(str(x.get(k) or '') for k in ['title','stockName','stockCode','orgSName','researcher'])
                    if any(term in blob for term in ['金春股份','安徽金春','300877','金春无纺布']):
                      obj={k:x.get(k) for k in ['infoCode','title','orgSName','orgCode','publishDate','attachPages','stockCode','stockName','researcher','emRatingName','ratingChange','indvInduName']}
                      key=json.dumps(obj,ensure_ascii=False,sort_keys=True,default=str)
                      if key not in seen:
                        seen.add(key); matches.append(obj)
                        print('MATCH',json.dumps(obj,ensure_ascii=False,default=str))
                  if len(batch)<100: break
                  time.sleep(.05)
                except Exception as e:
                  print('ERROR',begin,end,qtype,page,repr(e)); break
          print('\n### EASTMONEY_MATCHES')
          print(json.dumps(matches,ensure_ascii=False,indent=2,default=str))

          sina_urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=5&title=金春股份',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=5&title=金春',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?t1=2&symbol=sz300877',
          ]
          for u in sina_urls:
            print('\n### SINA',u)
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url)
              text=r.content.decode(r.apparent_encoding or 'gb18030',errors='replace')
              soup=BeautifulSoup(text,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              found=[]
              for a in soup.find_all('a',href=True):
                label=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                href=urljoin(r.url,a['href'])
                if '金春' in label or '300877' in label or 'vReport_Show' in href:
                  found.append({'label':label,'href':href})
              print(json.dumps(found[:1000],ensure_ascii=False,indent=2))
              # Print table rows containing company name or report links.
              for tr in soup.find_all('tr'):
                txt=re.sub(r'\s+',' ',tr.get_text(' ',strip=True))
                if '金春' in txt or '300877' in txt:
                  print('ROW',txt)
                  print('ROW_HTML',str(tr)[:5000])
            except Exception as e:
              print('SINA_ERROR',repr(e))
          PY
