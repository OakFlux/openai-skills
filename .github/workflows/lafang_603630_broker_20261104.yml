name: package-lafang-603630-broker-reports

on:
  push:
    branches:
      - tmp/lafang-603630-broker-20261104-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = "拉芳家化"
          FULL_NAME = "拉芳家化股份有限公司"
          CODE = "603630"
          PREPARED = "2026-11-04"
          ROOT_NAME = "拉芳家化_603630_券商深度研究报告_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  "sequence": 1,
                  "date": "2025-06-20",
                  "publish_date": "2025-06-22",
                  "broker": "辉立证券（香港）",
                  "analyst": "李晓然",
                  "rating": "中性（首次覆盖）",
                  "report_type": "首发报告/首次覆盖",
                  "title": "销售费用大幅增长，期待后续逐步起量",
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP202506221695407855_1.pdf?1750589945000.pdf=",
                  "filename": "01_20250620_辉立证券_销售费用大幅增长期待后续逐步起量_首次覆盖报告.pdf",
                  "minimum_pages": 2,
              },
              {
                  "sequence": 2,
                  "date": "2020-09-10",
                  "publish_date": "2020-09-10",
                  "broker": "国泰君安证券",
                  "analyst": "訾猛、彭瑛",
                  "rating": "增持（首次覆盖）",
                  "report_type": "公司首次覆盖报告",
                  "title": "凤凰涅槃，电商腾飞——拉芳家化首次覆盖报告",
                  "url": "https://img3.gelonghui.com/pdf/bbdca-40ae01be-95b4-4bd9-a749-c38db49f7ea0.pdf",
                  "filename": "02_20200910_国泰君安证券_凤凰涅槃电商腾飞_首次覆盖报告.pdf",
                  "minimum_pages": 15,
              },
              {
                  "sequence": 3,
                  "date": "2020-07-13",
                  "publish_date": "2020-07-13",
                  "broker": "浙商证券",
                  "analyst": "马莉；联系人：林骥川、詹陆雨",
                  "rating": "买入（首次评级）",
                  "report_type": "公司深度报告",
                  "title": "发力电商及品牌年轻化，民族日化开启新篇章",
                  "url": "https://pdf.dfcfw.com/pdf/H3_AP202007131391443735_1.pdf",
                  "filename": "03_20200713_浙商证券_发力电商及品牌年轻化_深度报告.pdf",
                  "minimum_pages": 20,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def download_pdf(url: str) -> tuple[bytes, str, str]:
              last_error = None
              for attempt in range(5):
                  try:
                      response = session.get(
                          url,
                          timeout=(30, 360),
                          allow_redirects=True,
                          headers={
                              "Accept": "application/pdf,*/*;q=0.8",
                              "Referer": "https://data.eastmoney.com/",
                          },
                      )
                      print("DOWNLOAD", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                      response.raise_for_status()
                      if response.content.startswith(b"%PDF-") and len(response.content) > 100_000:
                          return response.content, response.url, response.headers.get("content-type", "")
                      last_error = RuntimeError(f"Not a valid PDF response: {response.content[:60]!r}")
                  except Exception as exc:
                      last_error = exc
                      print("DOWNLOAD_ERROR", attempt, url, repr(exc))
                  time.sleep(1 + attempt)
              raise RuntimeError(f"Download failed for {url}: {last_error}")

          manifest = []
          accepted_names = [CODE, COMPANY, FULL_NAME, "Lafang China", "拉芳家化(603630)", "拉芳家化（603630）"]

          for report in reports:
              data, final_url, content_type = download_pdf(report["url"])
              output = PDF_DIR / report["filename"]
              output.write_bytes(data)

              reader = PdfReader(str(output), strict=False)
              pages = len(reader.pages)
              if pages < report["minimum_pages"]:
                  raise RuntimeError(f"Report unexpectedly short: {output.name}: {pages} pages")

              sample = "\n".join((page.extract_text() or "") for page in reader.pages[: min(12, pages)])
              compact = re.sub(r"\s+", "", sample)
              if not any(name.replace(" ", "") in compact for name in accepted_names):
                  raise RuntimeError(f"Issuer validation failed for {output.name}")

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {output.name}: {qpdf.stdout}")

              prefix = PREVIEW_DIR / output.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f"Preview rendering failed for {output.name}: {render.stdout}")

              record = {
                  **report,
                  "source_url": final_url,
                  "content_type": content_type,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(record)
              print("VALIDATED", record["broker"], record["date"], pages, record["sha256"], record["title"])
              print("FIRST_PAGE_TEXT", re.sub(r"\s+", " ", reader.pages[0].extract_text() or "")[:1200])

          readme = [
              f"{FULL_NAME}（{CODE}.SH）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录3份可公开下载并验证的券商原始PDF，包括2025年首次覆盖报告及两份2020年长篇公司深度/首次覆盖报告。",
              "未使用网页摘要、索引页或重新排版文件替代原始报告。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   券商：{item['broker']}；研究员：{item['analyst']}",
                  f"   报告日期：{item['date']}；公开发布日期：{item['publish_date']}；评级：{item['rating']}",
                  f"   类型：{item['report_type']}",
                  f"   标题：{item['title']}",
                  f"   页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   公开来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "券商", "报告日期", "公开发布日期", "研究员", "评级", "类型", "标题", "文件名", "页数", "字节数", "SHA-256", "公开来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["broker"], item["date"], item["publish_date"], item["analyst"], item["rating"],
                      item["report_type"], item["title"], item["filename"], item["pages"], item["bytes"],
                      item["sha256"], item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("lafang_603630_broker_deep_reports_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 3:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 3")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": [{key: item[key] for key in ["broker", "date", "publish_date", "analyst", "rating", "report_type", "title", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lafang-603630-broker-deep-reports-3-20261104
          path: |
            lafang_603630_broker_deep_reports_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
