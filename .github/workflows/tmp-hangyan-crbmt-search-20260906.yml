name: List Hangyan CR BMT search results
on:
  push:
    branches: [tmp-hangyan-crbmt-search-20260906]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and parse public search page
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urls=[
            'https://www.hangyan.co/reports?q=%E5%8D%8E%E6%B6%A6%E5%BB%BA%E6%9D%90%E7%A7%91%E6%8A%80',
            'https://www.hangyan.co/reports?q=%E5%8D%8E%E6%B6%A6%E6%B0%B4%E6%B3%A5',
            'https://www.hangyan.co/reports?q=01313'
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for url in urls:
              r=s.get(url,timeout=60)
              print('\nPAGE',url,'STATUS',r.status_code,'SIZE',len(r.content),'FINAL',r.url)
              soup=BeautifulSoup(r.text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              seen=set()
              for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href'])
                  text=' '.join(a.get_text(' ',strip=True).split())
                  if '/reports/' in href and href not in seen:
                      seen.add(href)
                      print('REPORT',href,'|',text[:500])
              for key in ['华润建材科技','华润水泥','01313','result-count','pagination']:
                  low=r.text.lower(); pos=0; count=0
                  while count<10:
                      idx=low.find(key.lower(),pos)
                      if idx<0: break
                      print('CTX',key,r.text[max(0,idx-300):min(len(r.text),idx+900)].replace('\n',' ')[:1200])
                      pos=idx+len(key); count+=1
          PY
