name: Search Eastmoney globally for historical Guoji Zhongzhuang filings 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-eastmoney-global-search-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Test global announcement search parameters
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          ep='https://np-anotice-stock.eastmoney.com/api/security/ann'
          terms=['二重重装','国机重装','国重装5','400062','二重集团（德阳）重型装备股份有限公司','国机重型装备集团股份有限公司']
          variants=[]
          for term in terms:
            variants += [
              {'stock_list':'','keyword':term},
              {'stock_list':'','search_keyword':term},
              {'stock_list':'','title':term},
              {'stock_list':term},
              {'stock_list':'400062','keyword':term},
              {'stock_list':'601399','keyword':term},
            ]
          for i,extra in enumerate(variants,1):
            p={'sr':'-1','page_size':'100','page_index':'1','ann_type':'A','client_source':'web','f_node':'0','s_node':'0','begin_time':'2015-01-01','end_time':'2020-06-30'}
            p.update(extra)
            try:
              r=s.get(ep,params=p,timeout=40); print('\nTRY',i,'STATUS',r.status_code,'URL',r.url,'LEN',len(r.text))
              data=r.json().get('data') or {}; rows=data.get('list') if isinstance(data,dict) else data; rows=rows or []
              print('ROWS',len(rows))
              for rec in rows:
                blob=json.dumps(rec,ensure_ascii=False,sort_keys=True)
                if any(x in blob for x in ('二重','国机重装','国重装','400062')):
                  print('MATCH',blob)
            except Exception as exc: print('ERR',repr(exc))
          PY
