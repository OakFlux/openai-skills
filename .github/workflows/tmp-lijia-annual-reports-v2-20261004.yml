name: Build Complete Lijia 835237 Reports Package V2

on:
  push:
    branches:
      - tmp-lijia-835237-annual-reports-20261004

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pypdf pymupdf

      - name: Download, verify and package complete report set
        shell: bash
        run: |
          cat > /tmp/build_lijia_reports_v2.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          import pymupdf
          import requests
          from pypdf import PdfReader

          OUT = Path('output_v2')
          RAW = OUT / 'raw'
          SELECTED = OUT / 'selected'
          RENDERS = OUT / 'renders'
          for p in (OUT, RAW, SELECTED, RENDERS):
              p.mkdir(parents=True, exist_ok=True)

          REPORTS = [
              {'type':'年度报告','year':2015,'date':'2016-04-26','art_code':'AN201604260014546466','title':'力佳科技2015年度报告'},
              {'type':'年度报告','year':2016,'date':'2017-04-24','art_code':'AN201704240527876806','title':'力佳科技2016年年度报告'},
              {'type':'年度报告','year':2017,'date':'2018-04-24','art_code':'AN201804241128982766','title':'力佳科技2017年年度报告'},
              {'type':'年度报告','year':2018,'date':'2019-04-26','art_code':'AN201904261323064843','title':'力佳科技2018年年度报告'},
              {'type':'年度报告','year':2019,'date':'2022-06-13','art_code':'AN202206131571915708','title':'力佳科技2019年年度报告（更正后）'},
              {'type':'年度报告','year':2020,'date':'2022-06-13','art_code':'AN202206131571916577','title':'力佳科技2020年年度报告（更正后）'},
              {'type':'年度报告','year':2021,'date':'2022-04-25','art_code':'AN202204251561518075','title':'力佳科技2021年年度报告'},
              {'type':'年度报告','year':2022,'date':'2023-04-25','art_code':'AN202304251585803027','title':'力佳科技2022年年度报告'},
              {'type':'年度报告','year':2023,'date':'2024-04-02','art_code':'AN202404021629521314','title':'力佳科技2023年年度报告'},
              {'type':'年度报告','year':2024,'date':'2025-04-22','art_code':'AN202504221660607748','title':'力佳科技2024年年度报告'},
              {'type':'年度报告','year':2025,'date':'2026-04-21','art_code':'AN202604211821393006','title':'力佳科技2025年年度报告'},
              {'type':'招股说明书','year':None,'date':'2022-11-10','art_code':'AN202211101580138558','title':'向不特定合格投资者公开发行股票并在北京证券交易所上市招股说明书'},
              {'type':'最新季度报告','year':2026,'date':'2026-04-21','art_code':'AN202604211821393066','title':'力佳科技2026年一季度报告'},
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36',
              'Accept': 'application/pdf,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Referer': 'https://data.eastmoney.com/notices/',
          })

          COMPANY_ALIASES = ('力佳科技','力佳电源','力佳电源科技','835237','920237')
          logs = []
          def log(msg):
              print(msg, flush=True)
              logs.append(msg)

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def urls(code: str):
              return [
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf?download=1',
              ]

          def download(report, dst: Path):
              for url in urls(report['art_code']):
                  try:
                      with session.get(url, timeout=120, stream=True, allow_redirects=True) as r:
                          r.raise_for_status()
                          with dst.open('wb') as f:
                              for chunk in r.iter_content(1024*256):
                                  if chunk:
                                      f.write(chunk)
                      if dst.stat().st_size < 80000:
                          raise RuntimeError(f'file too small: {dst.stat().st_size}')
                      with dst.open('rb') as f:
                          if f.read(5) != b'%PDF-':
                              raise RuntimeError('not PDF')
                      return url
                  except Exception as exc:
                      log(f'Download failed {url}: {exc}')
                      dst.unlink(missing_ok=True)
              raise RuntimeError(f"Unable to download {report['title']}")

          def validate(report, path: Path):
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              min_pages = 45 if report['type']=='年度报告' else (60 if report['type']=='招股说明书' else 5)
              if pages < min_pages:
                  raise RuntimeError(f"{report['title']} has only {pages} pages")
              text=[]
              for i in range(min(10,pages)):
                  try: text.append(reader.pages[i].extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','','\n'.join(text))
              if not any(x in compact for x in COMPANY_ALIASES):
                  raise RuntimeError(f"company identity not found in {report['title']}")
              doc=pymupdf.open(path)
              if doc.page_count != pages:
                  raise RuntimeError('page count mismatch')
              rdir=RENDERS/path.stem
              rdir.mkdir(parents=True,exist_ok=True)
              for idx in sorted(set([0,pages//2,pages-1])):
                  pix=doc.load_page(idx).get_pixmap(matrix=pymupdf.Matrix(1.0,1.0),alpha=False)
                  out=rdir/f'page-{idx+1:03d}.png'
                  pix.save(out)
                  if out.stat().st_size < 5000:
                      raise RuntimeError(f'blank render at page {idx+1}')
              doc.close()
              return pages

          manifest=[]
          readme=[
              '# 力佳科技（835237／920237）所有年度报告、招股说明书及最新季度报告',
              '',
              f'整理时间：{datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}',
              '',
              '收录范围：2015-2025年度报告、北交所上市招股说明书、截至2026-10-04最新完整季度报告。',
              '2019年和2020年年度报告采用公司后续披露的“更正后”版本。',
              '全部文件均为公开公告附件原始PDF；已检查PDF文件头、页面树与公司标识，并渲染抽查首页、中间页及末页。',
              '',
          ]

          for i,report in enumerate(REPORTS,1):
              raw=RAW/f"{report['art_code']}.pdf"
              source=download(report,raw)
              pages=validate(report,raw)
              if report['type']=='年度报告':
                  filename=f"{i:02d}_{report['year']}年年度报告.pdf"
              elif report['type']=='招股说明书':
                  filename=f"{i:02d}_招股说明书.pdf"
              else:
                  filename=f"{i:02d}_2026年第一季度报告.pdf"
              dst=SELECTED/filename
              dst.write_bytes(raw.read_bytes())
              item={**report,'pages':pages,'size_bytes':dst.stat().st_size,'package_filename':filename,'source_pdf_url':source,'sha256':sha256(dst)}
              manifest.append(item)
              log(f"Accepted {report['type']} {report.get('year')} {report['title']} [{pages} pages]")
              readme += [
                  f"## {i}. {report['title']}",
                  f"- 类型：{report['type']}",
                  f"- 公告日期：{report['date']}",
                  f"- 页数：{pages}",
                  f"- 文件：`{filename}`",
                  f"- 原始公开PDF：{source}",
                  f"- SHA-256：`{item['sha256']}`",
                  '',
              ]

          (SELECTED/'README_文件清单与来源.md').write_text('\n'.join(readme),encoding='utf-8')
          (SELECTED/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (SELECTED/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['package_filename']}" for x in manifest)+'\n',encoding='utf-8')
          (OUT/'run.log').write_text('\n'.join(logs),encoding='utf-8')

          zip_cn=OUT/'力佳科技_835237_所有年报_2015-2025_招股说明书及2026年一季报_20261004.zip'
          zip_en=OUT/'Lijia_Technology_835237_All_Annual_Reports_2015_2025_Prospectus_and_2026Q1.zip'
          for zp in (zip_cn,zip_en):
              with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as zf:
                  for p in sorted(SELECTED.iterdir()):
                      zf.write(p,arcname=p.name)
              with zipfile.ZipFile(zp) as zf:
                  bad=zf.testzip()
                  if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
              log(f'Created {zp.name}: {zp.stat().st_size} bytes; SHA256={sha256(zp)}')

          summary={
              'count':len(manifest),
              'annual_years':list(range(2015,2026)),
              'latest_quarter':'2026年第一季度报告',
              'reports':manifest,
              'zip_cn':str(zip_cn),'zip_cn_sha256':sha256(zip_cn),
              'zip_en':str(zip_en),'zip_en_sha256':sha256(zip_en),
          }
          (OUT/'package_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/build_lijia_reports_v2.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lijia-835237-Complete-Reports-Package
          path: |
            output_v2/*.zip
            output_v2/package_summary.json
            output_v2/run.log
          if-no-files-found: error
          retention-days: 3
