name: Temporary Inspect Hibor Download JavaScript

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect JavaScript and report source parameters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html,re,requests,json
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://www.hibor.com.cn/docdetail_47087.html'})
          urls=[
            'https://www.hibor.com.cn/JS/sysdownload.js',
            'https://www.hibor.com.cn/js/docdetailJSN.js?ver=2020',
            'https://www.hibor.com.cn/JS/login.js',
            'https://www.hibor.com.cn/JS/JavaScript.js',
            'https://www.hibor.com.cn/docdetail_47087.html',
            'http://www.hibor.com.cn/docdetail_191016.html',
            'http://www.hibor.com.cn/docdetail_423650.html',
            'http://www.hibor.com.cn/docdetail_47448.html',
          ]
          needles=['download','down','file','attach','pdf','docid','reportid','view','read','sysdw','checkauthor','source','original','getdoc','getfile','docdetail','id=']
          for url in urls:
              try:
                  r=s.get(url,timeout=60,allow_redirects=True)
                  raw=r.content
                  text=None
                  for enc in ('utf-8','gb18030','gbk'):
                      try:text=raw.decode(enc);break
                      except UnicodeDecodeError:pass
                  text=html.unescape(text or raw.decode('utf-8','ignore')).replace('\\/','/')
                  print('\nURL',url,'FINAL',r.url,'STATUS',r.status_code,'TYPE',r.headers.get('content-type'),'BYTES',len(raw))
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      low=line.lower()
                      if any(n in low for n in needles):
                          print('LINE',i,re.sub(r'\s+',' ',line)[:1800])
                  # also print compact snippets around explicit report id and file extensions
                  for pattern in [r'47087',r'191016',r'423650',r'47448',r'\.pdf',r'\.doc',r'\.zip',r'ajax',r'\.asp',r'/HiborWeb/']:
                      for m in list(re.finditer(pattern,text,flags=re.I))[:20]:
                          print('SNIP',pattern,re.sub(r'\s+',' ',text[max(0,m.start()-250):m.start()+700]))
              except Exception as exc:
                  print('ERR',url,repr(exc))
          PY
