name: Build final Pacific Basin broker report package with three verified PDFs 20260908

on:
  push:
    paths:
      - '.github/workflows/pacific-basin-final-three-reports-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf pymupdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import fitz
          import requests
          import urllib3
          from pypdf import PdfReader

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          package_name = '太平洋航运_券商研究报告_公开完整版_3份'
          out_dir = Path(package_name)
          work_dir = Path('_pacific_basin_final_work')
          render_dir = work_dir / 'renders'
          out_dir.mkdir(exist_ok=True)
          work_dir.mkdir(exist_ok=True)
          render_dir.mkdir(exist_ok=True)

          reports = [
              {
                  'order': 1,
                  'broker': '西南证券',
                  'title': '上半年业绩承压，基本面稳健长期向好',
                  'report_date': '2023-08-07',
                  'publish_date': '2023-08-09',
                  'authors': '胡光怿',
                  'rating': '买入（维持）',
                  'expected_pages': 7,
                  'filename': '01_西南证券_上半年业绩承压基本面稳健长期向好_20230807_7页.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202308091593593022_1.pdf',
                  'referer': 'https://data.eastmoney.com/report/zw_stock.jshtml?encodeUrl=',
                  'identity_terms': ['太平洋航运', '2343.HK'],
              },
              {
                  'order': 2,
                  'broker': '国泰君安国际',
                  'title': '抓住不确定性中的确定性',
                  'report_date': '2019-03-07',
                  'publish_date': '2019-03-07',
                  'authors': '吴效宇（Shawn Wu, CFA）',
                  'rating': '逢低买入；参考价2.17港元',
                  'expected_pages': 9,
                  'filename': '02_国泰君安国际_抓住不确定性中的确定性_20190307_9页.pdf',
                  'url': 'https://www.gtjai.com/UploadFiles/gtja_Report/2019/03/%E5%9B%BD%E6%B3%B0%E5%90%9B%E5%AE%89%E5%9B%BD%E9%99%85-%E5%A4%AA%E5%B9%B3%E6%B4%8B%E8%88%AA%E8%BF%90%20(2343%20HK)%20%E2%80%93%20%E6%8A%93%E4%BD%8F%E4%B8%8D%E7%A1%AE%E5%AE%9A%E6%80%A7%E4%B8%AD%E7%9A%84%E7%A1%AE%E5%AE%9A%E6%80%A7_20190307.pdf',
                  'referer': 'https://www.gtjai.com/',
                  'identity_terms': ['太平洋航运', '02343 HK', '2343 HK'],
              },
              {
                  'order': 3,
                  'broker': '德意志银行',
                  'title': 'Pacific Basin Shipping Ltd: 1H 2018 results - a solid return to the black',
                  'report_date': '2018-07-27',
                  'publish_date': '2018-07-27',
                  'authors': 'Deutsche Bank Research',
                  'rating': 'Buy；目标价2.52港元',
                  'expected_pages': 10,
                  'filename': '03_德意志银行_1H2018业绩重回盈利_20180727_10页_EN.pdf',
                  'url': 'https://img3.gelonghui.com/pdf201807/pdf20180731140034904.pdf',
                  'referer': 'https://www.gelonghui.com/',
                  'identity_terms': ['Pacific Basin', '2343.HK', '2343 HK'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download(report):
              errors = []
              for attempt in range(1, 6):
                  try:
                      response = session.get(
                          report['url'],
                          headers={
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              'Referer': report['referer'],
                              'Cache-Control': 'no-cache',
                          },
                          timeout=(25, 240),
                          allow_redirects=True,
                          verify=False,
                      )
                      data = response.content
                      print('DOWNLOAD', report['broker'], attempt, response.status_code, len(data), response.url, response.headers.get('content-type'), flush=True)
                      if response.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 100000:
                          return data, response.url
                      errors.append(f"HTTP {response.status_code}, {len(data)} bytes, sig={data[:12]!r}")
                  except Exception as exc:
                      errors.append(repr(exc))
                  time.sleep(attempt * 2)
              raise RuntimeError(f"Failed to download {report['broker']}: {errors[-5:]}")

          records = []
          for report in reports:
              data, final_url = download(report)
              path = out_dir / report['filename']
              path.write_bytes(data)

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != report['expected_pages']:
                  raise RuntimeError(f"Page mismatch for {report['broker']}: {pages} != {report['expected_pages']}")

              extracted = []
              for page_no in range(pages):
                  try:
                      extracted.append(reader.pages[page_no].extract_text() or '')
                  except Exception:
                      extracted.append('')
              searchable_text = '\n'.join(extracted)
              if searchable_text.strip() and not any(term.lower() in searchable_text.lower() for term in report['identity_terms']):
                  raise RuntimeError(f"Company identity not found in {report['broker']} PDF")

              qpdf = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f"qpdf failed for {report['broker']}: {qpdf.stderr[-1200:]}")

              pdf = fitz.open(str(path))
              rendered_pages = []
              for page_no in sorted(set([0, pages // 2, pages - 1])):
                  pix = pdf.load_page(page_no).get_pixmap(matrix=fitz.Matrix(1.0, 1.0), alpha=False)
                  image_path = render_dir / f"{report['order']:02d}_{page_no + 1:03d}.png"
                  pix.save(str(image_path))
                  if image_path.stat().st_size < 5000 or pix.width < 400 or pix.height < 400:
                      raise RuntimeError(f"Render failed for {report['broker']} page {page_no + 1}")
                  rendered_pages.append(page_no + 1)
              pdf.close()

              digest = hashlib.sha256(data).hexdigest()
              record = {
                  'broker': report['broker'],
                  'title': report['title'],
                  'report_date': report['report_date'],
                  'publish_date': report['publish_date'],
                  'authors': report['authors'],
                  'rating': report['rating'],
                  'pages': pages,
                  'bytes': len(data),
                  'filename': report['filename'],
                  'source_url': final_url,
                  'sha256': digest,
                  'rendered_pages': rendered_pages,
                  'source_type': '公开原始PDF',
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          total_pages = sum(item['pages'] for item in records)
          readme = [
              '太平洋航运（02343.HK）券商研究报告',
              '',
              f'本包包含3份可离线打开的完整PDF，共{total_pages}页。',
              '已排除需要登录、付费或仅能取得预览页的长篇报告。',
              '',
          ]
          for index, item in enumerate(records, 1):
              readme.extend([
                  f"{index}. {item['broker']}：《{item['title']}》",
                  f"   报告日期：{item['report_date']}；作者：{item['authors']}；评级/观点：{item['rating']}",
                  f"   实际页数：{item['pages']}页；文件大小：{item['bytes'] / 1048576:.2f} MB",
                  f"   文件名：{item['filename']}",
                  f"   来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ])
          readme.extend([
              '核验项目：PDF文件头、实际页数、公司身份、qpdf结构、首页/中间页/末页渲染、SHA-256及ZIP CRC。',
              '这些报告均为历史研究资料，其中评级、目标价和盈利预测不构成当前投资建议。',
          ])
          (out_dir / '报告清单与核验说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out_dir / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out_dir / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in records),
              encoding='utf-8',
          )

          zip_path = Path(package_name + '.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as archive:
              for file_path in sorted(out_dir.iterdir()):
                  archive.write(file_path, arcname=f'{package_name}/{file_path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise RuntimeError(f'ZIP CRC failed: {bad_file}')
              pdf_entries = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_entries) != 3:
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdf_entries)}')

          print('FINAL_PACKAGE', zip_path, zip_path.stat().st_size, 'PDFS', len(records), 'PAGES', total_pages, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: pacific-basin-three-broker-reports-final
          path: 太平洋航运_券商研究报告_公开完整版_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload validation renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacific-basin-three-report-renders
          path: _pacific_basin_final_work/renders/
          if-no-files-found: ignore
          retention-days: 7
