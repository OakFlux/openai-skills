name: Fetch public CMBI research archive page
on:
  push:
    branches: [tmp-cmbi-page-inspect-20260905]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch page
        run: |
          mkdir output
          curl -L --fail --max-time 60 -A 'Mozilla/5.0' 'https://www.cmbi.com.hk/market-stockreview?lang=en&page=74' -o output/page74.html
          grep -ioE '/article/[0-9]+\.html[^" ]*' output/page74.html | head -30 || true
          grep -i -C 2 -E 'COFCO|Joycome|1610|中粮家佳康|中糧家佳康' output/page74.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: cmbi-page74
          path: output
          retention-days: 1
