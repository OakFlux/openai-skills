name: Scan public CMBI archive for COFCO Joycome
on:
  push:
    branches: [tmp-cmbi-page-inspect-20260905]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan public archive pages
        run: |
          python -m pip install requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
          hits=[]
          for p in range(130,171):
              u=f'https://www.cmbi.com.hk/market-stockreview?lang=en&page={p}'
              r=s.get(u,timeout=30)
              soup=BeautifulSoup(r.text,'html.parser')
              items=[]
              for a in soup.find_all('a',href=True):
                  if '/article/' in a['href']:
                      title=' '.join(a.stripped_strings)
                      href=a['href']
                      items.append({'page':p,'title':title,'url':href})
                      blob=(title+' '+href).lower()
                      if any(k in blob for k in ['cofco joycome','1610 hk','01610','中粮家佳康','中糧家佳康']):
                          hits.append(items[-1]); print('HIT',json.dumps(items[-1],ensure_ascii=False))
              if items:
                  print('PAGE',p,items[0]['title'][:100],'--',items[-1]['title'][:100])
              Path(f'output/page_{p}.json').write_text(json.dumps(items,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding='utf-8')
          print('HIT_COUNT',len(hits))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cmbi-cofco-archive-scan
          path: output
          retention-days: 1
