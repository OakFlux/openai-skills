name: Temporary China Everbright raw HTML fast capture

on:
  push:
    branches:
      - tmp/china-everbright-raw-html-fast-20260831
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Fetch raw pages
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          out=Path('raw_pages'); out.mkdir()
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6'})
          targets=[
            ('fx_5370196.html','https://www.fxbaogao.com/detail/5370196'),
            ('fx_5040903.html','https://www.fxbaogao.com/detail/5040903'),
            ('hibor_5073681.html','https://www.hibor.com.cn/repinfodetail_5073681.html'),
            ('hibor_preview.gif','https://huibobjb.hibor.com.cn/CheckMd5File/img/2026/4/202604222229109838.gif'),
          ]
          manifest=[]
          for name,url in targets:
            try:
              r=s.get(url,timeout=35,allow_redirects=True,headers={'Referer':'https://www.fxbaogao.com/' if 'fx_' in name else 'https://www.hibor.com.cn/'})
              (out/name).write_bytes(r.content)
              row={'name':name,'url':url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'final':r.url,'encoding':r.encoding,'apparent':r.apparent_encoding}
              manifest.append(row)
              print('FETCH',json.dumps(row,ensure_ascii=False),flush=True)
            except Exception as e:
              row={'name':name,'url':url,'error':repr(e)}
              manifest.append(row)
              print('ERROR',json.dumps(row,ensure_ascii=False),flush=True)
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: china-everbright-raw-html-fast
          path: raw_pages/
          retention-days: 3
          if-no-files-found: error
