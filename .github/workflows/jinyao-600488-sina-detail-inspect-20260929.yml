name: Inspect selected Jinyao Sina report details 20260929

on:
  push:
    paths:
      - '.github/workflows/jinyao-600488-sina-detail-inspect-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect selected report detail pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          from html import unescape
          from urllib.parse import urljoin

          ids = [
              '737100241751',
              '569347040128',
              '413022474773',
              '375790000280',
          ]
          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'http://stock.finance.sina.com.cn/',
          })
          for rptid in ids:
              url = f'http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rptid}/index.phtml'
              r = s.get(url, timeout=(15, 45), allow_redirects=True)
              print('\n===== RPTID', rptid, 'STATUS', r.status_code, 'FINAL', r.url, 'BYTES', len(r.content), 'ENC', r.apparent_encoding, '=====', flush=True)
              r.raise_for_status()
              text = r.content.decode(r.apparent_encoding or 'gb18030', errors='replace')
              clean = unescape(re.sub(r'\s+', ' ', text))
              title_m = re.search(r'<title>(.*?)</title>', text, re.I|re.S)
              print('TITLE_TAG', unescape(re.sub(r'<[^>]+>', '', title_m.group(1))).strip() if title_m else '', flush=True)
              for keyword in ['pdf', 'PDF', '下载', '附件', 'download', 'file', '报告日期', '机构', '作者', '页数']:
                  positions = [m.start() for m in re.finditer(keyword, text, re.I)]
                  for pos in positions[:5]:
                      print('SNIPPET', keyword, unescape(text[max(0,pos-500):pos+1000]).replace('\n',' '), flush=True)
              for m in re.finditer(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']', text, re.I):
                  raw = unescape(m.group(1))
                  href = urljoin(r.url, raw)
                  if any(k in href.lower() for k in ['pdf','download','file','report','rpt','attach']) or rptid in href:
                      print('RESOURCE', href, flush=True)
              body_text = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', text, flags=re.I|re.S)
              body_text = unescape(re.sub(r'<[^>]+>', '\n', body_text))
              body_text = re.sub(r'\n\s*\n+', '\n', body_text)
              lines = [x.strip() for x in body_text.splitlines() if x.strip()]
              print('VISIBLE_HEAD', ' || '.join(lines[:80]), flush=True)
          PY
