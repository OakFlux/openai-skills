name: Scan China Baoan report titles by unique phrases
on:
  push:
    paths:
      - '.github/workflows/china-baoan-report-phrase-scan-20261016.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - shell: bash
        run: |
          python - <<'PY'
          import json,time,requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          url='https://reportapi.eastmoney.com/report/list'
          phrases=['手握贝特瑞','正负极腾飞','治理优化整装待发','材料老兵','公司治理有望优化','一体化布局再加码','电池材料业务迎高增长期','预见更好的贝特瑞','负极持续增长','正极盈利修复']
          windows=[('2021-06-01','2021-12-31'),('2020-01-01','2022-12-31')]
          matches={}
          for begin,end in windows:
            for page in range(1,401):
              cb=f'cb{page}{int(time.time()*1000)}'
              params={'cb':cb,'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'qType':'0','orgCode':'*','code':'*','rcode':'*','p':str(page),'pageNum':str(page),'pageNumber':str(page),'_':str(int(time.time()*1000))}
              r=s.get(url,params=params,timeout=60)
              text=r.text.strip()
              if text.startswith(cb+'(') and text.endswith(')'): text=text[len(cb)+1:-1]
              data=json.loads(text); rows=data.get('data') or []
              print('PAGE',begin,end,page,'ROWS',len(rows),'HITS',data.get('hits'),'TOTAL',data.get('TotalPage'),flush=True)
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                hit=[p for p in phrases if p in blob]
                if hit:
                  key=str(row.get('infoCode') or row.get('info_code') or len(matches))
                  matches[key]=row
                  print('MATCH',json.dumps({'phrases':hit,'row':row},ensure_ascii=False),flush=True)
              total=int(data.get('TotalPage') or 0)
              if not rows or (total and page>=total) or len(rows)<100: break
              time.sleep(.05)
            if matches: break
          print('FINAL_MATCHES',json.dumps(list(matches.values()),ensure_ascii=False,indent=2),flush=True)
          if not matches: raise RuntimeError('No phrase matches')
          PY
