name: Build final Greentown China broker public page package 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-03900-broker-public-pages-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install browser and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Capture public research pages and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import asyncio, hashlib, json, subprocess, zipfile
          from pathlib import Path
          from pypdf import PdfReader
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          PACKAGE = '绿城中国_03900_券商深度报告_公开资料版_3份'
          root = Path(PACKAGE); root.mkdir(exist_ok=True)
          previews = root / '首页预览'; previews.mkdir(exist_ok=True)

          reports = [
              {
                  'broker':'申万宏源',
                  'title':'绿城中国（03900.HK）：好房子引领者，理顺机制再出发',
                  'date':'2025-08-14',
                  'rating':'买入（首次覆盖）',
                  'original_pages':31,
                  'source_url':'https://www.fxbaogao.com/detail/4998036',
                  'file_kind':'公开研报预览页面PDF；不是31页完整原始报告',
                  'filename':'01_申万宏源_绿城中国_好房子引领者理顺机制再出发_公开预览页面版_2025-08-14.pdf',
              },
              {
                  'broker':'国联民生证券',
                  'title':'绿城中国（03900.HK）：改善房企标杆，“龙头战法”聚焦核心',
                  'date':'2025-02-21',
                  'rating':'买入',
                  'original_pages':29,
                  'source_url':'https://www.sgpjbg.com/bgdown/614257.html',
                  'file_kind':'公开报告预览页面PDF；不是29页完整原始报告',
                  'filename':'02_国联民生证券_绿城中国_改善房企标杆龙头战法聚焦核心_公开预览页面版_2025-02-21.pdf',
              },
              {
                  'broker':'第一上海证券',
                  'title':'绿城中国（03900.HK）：跻身第一梯队的品质标杆房企',
                  'date':'2025-05-13',
                  'rating':'买入（首次覆盖）',
                  'target_price':'11.80港元',
                  'original_pages':None,
                  'source_url':'https://gmg.9fzt.com/report/HKSE/03900/800631919576.html',
                  'file_kind':'公开研报页面PDF；不是券商完整原始PDF',
                  'filename':'03_第一上海证券_绿城中国_跻身第一梯队的品质标杆房企_公开研报页面版_2025-05-13.pdf',
              },
          ]

          async def capture(page, rec):
              url = rec['source_url']
              try:
                  await page.goto(url, wait_until='domcontentloaded', timeout=60000)
              except PlaywrightTimeoutError:
                  # Keep whatever content has loaded; public pages sometimes leave analytics connections open.
                  pass
              await page.wait_for_timeout(5000)
              try:
                  await page.evaluate("""
                  () => {
                    const selectors = [
                      'header','footer','nav','.header','.footer','.sidebar','.ad','.ads','.advertisement',
                      '.popup','.modal','.mask','.float','.fixed','.share','.login-box','.download-box',
                      '[class*=advert]','[class*=popup]','[class*=modal]','[class*=float]','[class*=sidebar]'
                    ];
                    for (const s of selectors) for (const el of document.querySelectorAll(s)) {
                      try { el.style.display='none'; } catch(e) {}
                    }
                    document.body.style.background='white';
                    document.documentElement.style.background='white';
                  }
                  """)
              except Exception:
                  pass
              # Expand lazy-loaded public content.
              for _ in range(8):
                  try:
                      await page.evaluate('window.scrollBy(0, Math.max(window.innerHeight, 900))')
                  except Exception:
                      break
                  await page.wait_for_timeout(250)
              await page.emulate_media(media='screen')
              out = root / rec['filename']
              await page.pdf(
                  path=str(out), format='A4', print_background=True,
                  margin={'top':'10mm','right':'9mm','bottom':'12mm','left':'9mm'},
                  prefer_css_page_size=False
              )
              return out

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      viewport={'width':1440,'height':1100}, locale='zh-CN',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
                  )
                  successful=[]
                  for rec in reports:
                      page = await context.new_page()
                      try:
                          out = await capture(page, rec)
                          if out.exists() and out.stat().st_size > 25000:
                              successful.append(rec)
                          else:
                              print('SMALL_OR_MISSING', rec['source_url'])
                      except Exception as exc:
                          print('CAPTURE_FAILED', rec['source_url'], repr(exc))
                      finally:
                          await page.close()
                  await browser.close()
                  return successful

          successful = asyncio.run(main())
          if len(successful) < 2:
              raise RuntimeError(f'Only {len(successful)} public report pages captured; at least 2 required')

          manifest=[]
          for rec in successful:
              pdf = root/rec['filename']
              reader=PdfReader(str(pdf),strict=False)
              pages=len(reader.pages)
              if pages < 1: raise RuntimeError(f'No PDF pages: {pdf}')
              subprocess.run(['qpdf','--check',str(pdf)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=previews/pdf.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','120','-singlefile',str(pdf),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size < 10000: raise RuntimeError(f'Preview failed: {pdf}')
              row={**rec,'actual_pdf_pages':pages,'bytes':pdf.stat().st_size,'sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),'preview_file':str(Path('首页预览')/preview.name),'validation':['PDF structure','page count','first-page render']}
              manifest.append(row)

          lines=['绿城中国（03900.HK）券商深度报告公开资料包','整理日期：2026-09-27','',
                 f'本包收录{len(manifest)}份公开可访问的券商研报预览页面或研报页面PDF。',
                 '相关完整原始PDF需要登录、会员或下载权限；本包没有绕过访问控制，所有文件均已在文件名和清单中标明性质。','']
          for i,r in enumerate(manifest,1):
              lines += [f"{i}. {r['broker']}：《{r['title']}》",f"   日期：{r['date']}；评级：{r['rating']}" + (f"；目标价：{r['target_price']}" if r.get('target_price') else ''),f"   文件性质：{r['file_kind']}",f"   本PDF页数：{r['actual_pdf_pages']}页" + (f"；原报告标称：{r['original_pages']}页" if r.get('original_pages') else ''),f"   来源页面：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          lines += ['报告内容及版权归原券商、作者与来源平台所有，仅供研究参考，不构成投资建议。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in manifest),encoding='utf-8')

          final_name=f'绿城中国_03900_券商深度报告_公开资料版_{len(manifest)}份.zip'
          zpath=Path(final_name)
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for f in sorted(root.rglob('*')):
                  if f.is_file(): z.write(f,arcname=f'{PACKAGE}/{f.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip();
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')]) != len(manifest): raise RuntimeError('PDF count mismatch')
          Path('final_filename.txt').write_text(final_name,encoding='utf-8')
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: greentown-03900-broker-public-pages-final
          path: |
            绿城中国_03900_券商深度报告_公开资料版_2份.zip
            绿城中国_03900_券商深度报告_公开资料版_3份.zip
            final_filename.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
