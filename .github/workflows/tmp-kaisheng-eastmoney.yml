name: Temporary Kaisheng Eastmoney research metadata

on:
  push:
    branches:
      - tmp-kaisheng-eastmoney-20260905

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch research metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = 'https://reportapi.eastmoney.com/report/list'
          all_rows = []
          for qtype in ('0','1','2'):
              params = {
                  'industryCode':'*', 'pageSize':'100', 'industry':'*',
                  'rating':'*', 'ratingChange':'*', 'beginTime':'2020-01-01',
                  'endTime':'2026-12-31', 'pageNo':'1', 'fields':'',
                  'qType':qtype, 'orgCode':'', 'code':'600876', 'rcode':'',
                  'p':'1', 'pageNum':'1', 'pageNumber':'1',
              }
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  'User-Agent':'Mozilla/5.0',
                  'Referer':'https://data.eastmoney.com/report/600876.html',
                  'Accept':'application/json,text/plain,*/*',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read().decode('utf-8','replace')
                  print('FETCH', qtype, len(body), body[:200], flush=True)
                  Path(f'output/qtype_{qtype}.json').write_text(body, encoding='utf-8')
                  obj = json.loads(body)
                  rows = obj.get('data') or obj.get('Data') or []
                  if isinstance(rows, dict):
                      rows = rows.get('data') or rows.get('list') or rows.get('records') or []
                  for row in rows:
                      all_rows.append(row)
                      print('ROW', json.dumps({k:row.get(k) for k in ['publishDate','orgSName','title','infoCode','attachPages','attachSize','stockName','stockCode','researcher']}, ensure_ascii=False), flush=True)
              except Exception as exc:
                  print('ERROR', qtype, repr(exc), flush=True)
          Path('output/all_rows.json').write_text(json.dumps(all_rows, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-eastmoney-metadata
          path: output/*
          retention-days: 1
          if-no-files-found: error
