name: Inspect Dongya Pharma prospectus links

on:
  push:
    branches: [tmp-dongya-pharma-605177-reports-20261020]
    paths: ['.github/workflows/tmp-dongya-prospectus-discovery-20261020.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect listing and detail pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,urllib.parse,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          listing='https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/605177.phtml'
          pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*;q=0.8'})
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read(); final=r.geturl(); headers=dict(r.headers)
              text=None
              for enc in ('utf-8','gb18030','gbk'):
                  try:
                      text=raw.decode(enc); break
                  except UnicodeDecodeError: pass
              if text is None: text=raw.decode('utf-8','replace')
              return text,final,headers
          text,final,headers=fetch(listing)
          print('LISTING',final,'LEN',len(text),'HEADERS',headers)
          targets=[]
          for m in pat.finditer(text):
              href=html.unescape(m.group(1).strip())
              label=re.sub(r'<[^>]+>','',m.group(2))
              label=html.unescape(re.sub(r'\s+','',label))
              full=urllib.parse.urljoin(final,href)
              if '招股说明书' in label:
                  print('ANCHOR',repr(label),full)
                  if '招股说明书摘要' not in label and '招股意向书' not in label and '申报稿' not in label:
                      targets.append((label,full))
          for label,url in targets:
              print('\n===== DETAIL',repr(label),url,'=====')
              t,f,h=fetch(url)
              print('FINAL',f,'LEN',len(t),'HEADERS',h)
              for m in re.finditer(r'''https?://[^\s"'<>]+''',t,re.I):
                  s=html.unescape(m.group(0))
                  if any(k in s.lower() for k in ('pdf','file.finance','sse')):
                      print('URLTOKEN',s[:1000])
              for m in pat.finditer(t):
                  href=html.unescape(m.group(1).strip())
                  lab=re.sub(r'<[^>]+>','',m.group(2))
                  lab=html.unescape(re.sub(r'\s+','',lab))
                  full=urllib.parse.urljoin(f,href)
                  if '下载' in lab or '公告原文' in lab or '.pdf' in full.lower() or 'file.finance' in full.lower():
                      print('DETAIL_ANCHOR',repr(lab),full)
              print('TAIL',t[-8000:])
          PY
