name: Target exact Huabao International broker reports

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-targeted-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pillow
      - name: Query exact titles and verify all public pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p targeted
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, time
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image

          api='https://api.sdyanbao.com/api/file/search'
          phrases=[
            '历尽千帆 涅槃重生',
            '历尽千帆，涅槃重生',
            '华宝国际 深度报告 历尽千帆',
            '香精行业龙头 业务结构多元',
            '华宝国际 香精行业龙头 业务结构多元',
            '经营拐点显现 多元业务矩阵共驱成长',
            '华宝国际 经营拐点显现 多元业务',
            '真实业绩成色靓丽 海外业务快速崛起',
            '华宝国际 2025年业绩公告点评',
            '业绩进入持续改善期 烟用原料静待绽放'
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'})
          found={}; qlog=[]
          for phrase in phrases:
            for only in (1,0):
              body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':50,'keyword':phrase,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              try:
                r=s.post(api,json=body,timeout=(15,45)); r.raise_for_status(); payload=r.json()
                rows=(payload.get('data') or {}).get('files') or []; total=int((payload.get('data') or {}).get('total') or 0)
                qlog.append({'phrase':phrase,'onlyTitle':only,'rows':len(rows),'total':total})
                print('QUERY',phrase,'ONLY',only,'ROWS',len(rows),'TOTAL',total,flush=True)
              except Exception as e:
                qlog.append({'phrase':phrase,'onlyTitle':only,'error':repr(e)}); print('FAIL',phrase,only,repr(e),flush=True); continue
              for x in rows:
                blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                title=str(x.get('name') or '')
                if ('华宝国际' in blob or '華寶國際' in blob or '00336' in blob or '0336.hk' in blob or any(key in title for key in ['历尽千帆','香精行业龙头','经营拐点显现','真实业绩成色靓丽','烟用原料静待绽放'])):
                  found[str(x.get('id'))]=x
              time.sleep(.15)

          candidates=[]
          for x in found.values():
            rec={'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),'page_url':x.get('page_url'),'share_url':x.get('share_url'),'organization':(x.get('organization') or {}).get('name'),'researcher':(x.get('researcher') or {}).get('name'),'type':(x.get('type') or {}).get('name'),'stock':x.get('stock'),'data_source':x.get('data_source'),'data_source_uuid':x.get('data_source_uuid')}
            try: pages=int(rec.get('page_count') or 0)
            except: pages=0
            base=(rec.get('page_url') or '').rstrip('/')
            checked=[]; accessible=0
            if 0 < pages <= 100 and base:
              for idx in range(pages):
                good=None
                for ext in ('png','jpg','jpeg'):
                  url=f'{base}/{idx}.{ext}'
                  try:
                    rr=s.get(url,headers={'Referer':f"https://www.sdyanbao.com/detail/{rec['id']}",'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'},timeout=(15,45))
                    sig=rr.content[:16]; ok=rr.status_code==200 and len(rr.content)>10000 and (sig.startswith(b'\x89PNG') or sig.startswith(b'\xff\xd8\xff') or sig.startswith(b'RIFF'))
                    if ok:
                      with Image.open(BytesIO(rr.content)) as im: w,h=im.size; im.verify()
                      if w>=500 and h>=700:
                        good={'url':url,'bytes':len(rr.content),'width':w,'height':h,'sha256':hashlib.sha256(rr.content).hexdigest()}; break
                  except Exception as e:
                    pass
                checked.append({'index':idx,'ok':bool(good),'good':good})
                print('PAGE',rec['id'],idx,'OK',bool(good),flush=True)
                if not good: break
                accessible+=1
            rec['accessible_pages']=accessible; rec['complete_public_pages']=pages>0 and accessible==pages; rec['page_checks']=checked
            candidates.append(rec)
          candidates.sort(key=lambda x:(bool(x.get('complete_public_pages')), int(x.get('page_count') or 0), str(x.get('date') or '')),reverse=True)
          Path('targeted/results.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('targeted/query_log.json').write_text(json.dumps(qlog,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SUMMARY',json.dumps([{k:v for k,v in x.items() if k!='page_checks'} for x in candidates],ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-targeted-results
          path: targeted/
          retention-days: 3
