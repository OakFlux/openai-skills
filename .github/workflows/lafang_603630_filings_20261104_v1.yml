name: package-lafang-603630-filings

on:
  push:
    branches:
      - tmp/lafang-603630-filings-20261104-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          COMPANY = "拉芳家化"
          FULL_NAME = "拉芳家化股份有限公司"
          CODE = "603630"
          PREPARED = "2026-11-04"
          ROOT_NAME = "拉芳家化_603630_2020-2025年报及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def extract_sina_download(detail_url: str) -> str:
              response = session.get(detail_url, timeout=(30, 180), allow_redirects=True)
              print("DETAIL", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
              response.raise_for_status()
              response.encoding = response.apparent_encoding or "gbk"
              soup = BeautifulSoup(response.text, "lxml")
              candidates = []
              for anchor in soup.find_all("a", href=True):
                  text = "".join(anchor.get_text(" ", strip=True).split())
                  href = urljoin(response.url, anchor["href"])
                  if "下载公告" in text or "file.finance.sina.com.cn" in href or href.lower().endswith(".pdf"):
                      candidates.append(href)
              for match in re.findall(r"https?://[^\s\"'<>]+", response.text):
                  if "file.finance.sina.com.cn" in match or match.lower().endswith(".pdf"):
                      candidates.append(match.replace("&amp;", "&"))
              for candidate in dict.fromkeys(candidates):
                  if "file.finance.sina.com.cn" in candidate or candidate.lower().endswith(".pdf"):
                      print("DETAIL_PDF", candidate)
                      return candidate
              raise RuntimeError(f"No downloadable PDF found on {detail_url}")

          url_2021 = extract_sina_download(
              "https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=8123739"
          )
          url_2022 = extract_sina_download(
              "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=9168665&stockid=603630"
          )

          reports = [
              {
                  "sequence": 1,
                  "period": "2020年年度报告",
                  "kind": "annual",
                  "announcement_date": "2021-04-28",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2021-04-28/1209843410.PDF",
                  ],
              },
              {
                  "sequence": 2,
                  "period": "2021年年度报告",
                  "kind": "annual",
                  "announcement_date": "2022-04-28",
                  "minimum_pages": 100,
                  "urls": [url_2021],
              },
              {
                  "sequence": 3,
                  "period": "2022年年度报告",
                  "kind": "annual",
                  "announcement_date": "2023-04-29",
                  "minimum_pages": 100,
                  "urls": [url_2022],
              },
              {
                  "sequence": 4,
                  "period": "2023年年度报告",
                  "kind": "annual",
                  "announcement_date": "2024-04-30",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2024-04-30/1219918337.PDF",
                  ],
              },
              {
                  "sequence": 5,
                  "period": "2024年年度报告",
                  "kind": "annual",
                  "announcement_date": "2025-04-29",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2025-04-29/1223378805.PDF",
                  ],
              },
              {
                  "sequence": 6,
                  "period": "2025年年度报告",
                  "kind": "annual",
                  "announcement_date": "2026-04-28",
                  "minimum_pages": 100,
                  "urls": [
                      "https://static.cninfo.com.cn/finalpage/2026-04-28/1225209704.PDF",
                  ],
              },
              {
                  "sequence": 7,
                  "period": "2026年第三季度报告",
                  "kind": "quarter",
                  "announcement_date": "2026-10-30",
                  "minimum_pages": 5,
                  "urls": [
                      "https://static.sse.com.cn/disclosure/listedinfo/announcement/c/new/2026-10-30/603630_20261030_UKTZ.pdf",
                      extract_sina_download(
                          "https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12678447&stockid=603630"
                      ),
                  ],
              },
          ]

          accepted_names = [CODE, COMPANY, FULL_NAME, "LAFANGJIAHUA", "LafangJiahua"]

          def compact_pdf_text(reader: PdfReader) -> str:
              indices = list(range(min(14, len(reader.pages))))
              if len(reader.pages) > 14:
                  indices.extend(range(max(14, len(reader.pages) - 2), len(reader.pages)))
              text = "\n".join((reader.pages[i].extract_text() or "") for i in sorted(set(indices)))
              return re.sub(r"\s+", "", text)

          def download_valid_pdf(report: dict) -> tuple[bytes, str, str, int]:
              last_error = None
              for url in report["urls"]:
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 360),
                              allow_redirects=True,
                              headers={
                                  "Accept": "application/pdf,*/*;q=0.8",
                                  "Referer": "https://www.cninfo.com.cn/",
                              },
                          )
                          print("DOWNLOAD", report["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          if not response.content.startswith(b"%PDF-") or len(response.content) < 50_000:
                              raise RuntimeError(f"Not a valid PDF response: {response.content[:40]!r}")

                          temp = Path("candidate.pdf")
                          temp.write_bytes(response.content)
                          reader = PdfReader(str(temp), strict=False)
                          pages = len(reader.pages)
                          if pages < report["minimum_pages"]:
                              raise RuntimeError(f"Report too short: {pages} pages")

                          compact = compact_pdf_text(reader)
                          if not any(name.replace(" ", "") in compact for name in accepted_names):
                              raise RuntimeError("Issuer validation failed")
                          if report["period"].replace(" ", "") not in compact:
                              raise RuntimeError("Period validation failed")

                          return response.content, response.url, response.headers.get("content-type", ""), pages
                      except Exception as exc:
                          last_error = exc
                          print("DOWNLOAD_ERROR", report["period"], attempt, url, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to obtain {report['period']}: {last_error}")

          manifest = []
          for report in reports:
              data, source_url, content_type, pages = download_valid_pdf(report)
              filename = f"{report['sequence']:02d}_{report['period']}.pdf"
              path = PDF_DIR / filename
              path.write_bytes(data)

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {filename}: {qpdf.stdout}")

              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "120", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")

              item = {
                  "sequence": report["sequence"],
                  "period": report["period"],
                  "kind": report["kind"],
                  "announcement_date": report["announcement_date"],
                  "filename": filename,
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": source_url,
                  "content_type": content_type,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(item)
              print("VALIDATED", item["period"], item["pages"], item["bytes"], item["sha256"])

          readme = [
              f"{FULL_NAME}（{CODE}.SH）2020—2025年年度报告及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：",
              "- 2020—2025年年度报告全文，共6份。",
              "- 截至整理日已披露的最新独立季度报告：2026年第三季度报告，共1份。",
              "",
              "已排除年度报告摘要、半年度报告、审计附件、提示性公告及其他非正文文件。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   报告期间：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、报告期间、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "file_count": len(manifest),
              "annual_report_count": sum(item["kind"] == "annual" for item in manifest),
              "latest_quarter": manifest[-1]["period"],
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "报告期间", "类型", "公告日期", "文件名", "页数", "字节数", "SHA-256", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["period"], item["kind"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"],
                      item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("lafang_603630_2020_2025_annual_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 7:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 7")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "file_count": len(manifest),
              "annual_report_count": 6,
              "latest_quarter": manifest[-1]["period"],
              "files": [{
                  key: item[key]
                  for key in ["period", "announcement_date", "pages", "bytes", "sha256", "source_url"]
              } for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lafang-603630-filings-20261104
          path: |
            lafang_603630_2020_2025_annual_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
