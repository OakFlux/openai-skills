name: Ningxin Materials Complete Filings Package

on:
  push:
    branches:
      - chatgpt-ningxin-materials-filings-20261004
    paths:
      - .github/workflows/ningxin_materials_filings_package_20261004.yml
      - scripts/build_ningxin_materials_filings_20261004.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Download, validate, and package disclosures
        run: python scripts/build_ningxin_materials_filings_20261004.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: ningxin-materials-complete-filings-package
          path: |
            output/ningxin_materials_all_annual_reports_prospectus_latest_quarter.zip
            output/BUILD_SUMMARY.json
            output/renders/contact_sheet.jpg
          retention-days: 2
          compression-level: 0
