name: Build Snowman Group broker research-report package

on:
  push:
    branches: [tmp-xueren-broker-reports-20261022-v2]
    paths: ['.github/workflows/tmp-xueren-broker-package-20261022-v2.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='雪人集团_券商研究报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local expected_pages="$3"
            local broker_pattern="$4"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 7 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002639' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 80000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -eq "$expected_pages"

            pdftotext -f 1 -l "$pages" "$out" "$out.txt" 2>/dev/null
            grep -Eq '福建雪人股份有限公司|福建雪人集团股份有限公司|雪人股份|雪人集团' "$out.txt"
            grep -Eq "$broker_pattern" "$out.txt"
            rm -f "$out.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$out" "$out.last" >/dev/null 2>&1
            test -s "$out.first.png" && test -s "$out.last.png"
            rm -f "$out.first.png" "$out.last.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201708110791490759_1.pdf' \
            "$PACKAGE/01_西南证券_深度布局燃料电池制冰龙头前景广阔_深度报告_2017-08-11.pdf" \
            17 \
            '西南证券|SOUTHWEST SECURITIES|西南'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201708290835893079_1.pdf' \
            "$PACKAGE/02_国金证券_营收增长盈利提升加快布局氢能源领域_公司研究_2017-08-29.pdf" \
            5 \
            '国金证券|SINOLINK SECURITIES|国金'

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP201705100568691513_1.pdf' \
            "$PACKAGE/03_长城国瑞证券_压缩机业务持续高增长佳运油气业绩贡献显著_公司研究_2017-05-10.pdf" \
            4 \
            '长城国瑞证券|长城国瑞|GREAT WALL GUORUI'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('雪人集团_券商研究报告_3份')
          meta = {
              '01_西南证券_深度布局燃料电池制冰龙头前景广阔_深度报告_2017-08-11.pdf': {
                  'broker': '西南证券',
                  'date': '2017-08-11',
                  'title': '深度布局燃料电池，制冰龙头前景广阔',
                  'type': '公司深度报告',
                  'index': 'AP201708110791490759',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201708110791490759_1.pdf',
              },
              '02_国金证券_营收增长盈利提升加快布局氢能源领域_公司研究_2017-08-29.pdf': {
                  'broker': '国金证券',
                  'date': '2017-08-29',
                  'title': '营收增长盈利提升，加快布局氢能源领域',
                  'type': '公司研究/中报点评报告',
                  'index': 'AP201708290835893079',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201708290835893079_1.pdf',
              },
              '03_长城国瑞证券_压缩机业务持续高增长佳运油气业绩贡献显著_公司研究_2017-05-10.pdf': {
                  'broker': '长城国瑞证券',
                  'date': '2017-05-10',
                  'title': '压缩机业务持续高增长，佳运油气业绩贡献显著',
                  'type': '公司研究报告',
                  'index': 'AP201705100568691513',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP201705100568691513_1.pdf',
              },
          }
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '雪人集团（002639，原简称“雪人股份”）券商研究报告资料包',
              '整理日期：2026-10-22',
              '',
              '收录说明：',
              '1. 公开个股研报索引共列出4份券商报告，其中仅西南证券报告达到长篇公司深度标准。',
              '2. 本包收录该17页深度报告，并补充2份同阶段完整公司研究报告。',
              '3. 排除2页动态点评、网页摘要和非券商材料。',
              '4. 三份文件均为公开渠道直接下载的券商原始PDF，仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；类型：{item['type']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  PDF来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、精确页数、正文公司名称、券商名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Snowman-Group-002639-broker-research-reports-3
          path: 雪人集团_券商研究报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
