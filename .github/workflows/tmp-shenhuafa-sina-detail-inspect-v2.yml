name: Inspect Shenhuafa Sina Pages V2

on:
  push:
    branches:
      - tmp-shenhuafa-000020-broker-reports-20260929

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect detail pages, linked assets, and Wayback
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/545414326060/index.phtml',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/648179160012/index.phtml'
          ]
          for u in urls:
            print('\n=== PAGE',u,'===')
            r=s.get(u,timeout=30); print('status',r.status_code,'len',len(r.content),'ctype',r.headers.get('content-type'))
            r.encoding=r.apparent_encoding or 'gb18030'; text=r.text
            print('title?',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:2])
            all_urls=[]
            for pat in [r'https?://[^\"\'<>\s]+', r'[\"\']([^\"\']+\.pdf(?:\?[^\"\']*)?)[\"\']']:
              for m in re.findall(pat,text,re.I):
                all_urls.append(urljoin(u,m))
            soup=BeautifulSoup(text,'html.parser')
            for tag in soup.find_all(['a','iframe','embed','object','script'],href=True): all_urls.append(urljoin(u,tag.get('href')))
            for tag in soup.find_all(['iframe','embed','script'],src=True): all_urls.append(urljoin(u,tag.get('src')))
            for tag in soup.find_all('object',data=True): all_urls.append(urljoin(u,tag.get('data')))
            print('candidate URLs:')
            for x in sorted(set(all_urls)):
              lx=x.lower()
              if any(k in lx for k in ('pdf','download','attach','report','file','rptid')):
                print(x[:1000])
            print('interesting lines:')
            for line in text.splitlines():
              ll=line.lower()
              if any(k in ll for k in ('pdf','download','attach','fileurl','reporturl','rptid')):
                print(line[:1600])
            cdx='https://web.archive.org/cdx/search/cdx'
            targets=[u, u.replace('https://','http://')]
            for target in targets:
              try:
                c=s.get(cdx,params={'url':target,'output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length','filter':'statuscode:200','collapse':'digest'},timeout=45)
                print('CDX',target,c.status_code,c.text[:6000])
              except Exception as e: print('CDX ERROR',target,e)
          # broad CDX wildcard query around rptids and Sina domain
          for q in ['*545414326060*','*648179160012*']:
            try:
              c=s.get('https://web.archive.org/cdx/search/cdx',params={'url':q,'output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length','filter':'statuscode:200','collapse':'digest'},timeout=45)
              print('BROAD CDX',q,c.status_code,c.text[:10000])
            except Exception as e: print('BROAD ERROR',q,e)
          PY
