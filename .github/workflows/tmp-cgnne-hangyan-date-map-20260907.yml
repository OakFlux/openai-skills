name: Map Hangyan dates for CGN New Energy reports
on:
  push:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Sample listing pages
        run: |
          python - <<'PY'
          import json,time,requests
          from bs4 import BeautifulSoup
          pages=[1500,1750,2000,2250,2500,2750,3000,3250,3500,3750,4000,4250,4500,4750,5000]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for p in pages:
              r=s.get('https://www.hangyan.co/reports',params={'page':p},timeout=90)
              soup=BeautifulSoup(r.text,'html.parser')
              cards=[]
              for a in soup.select('a[data-controller="protected-link"]'):
                  box=a.find_parent('div',class_=lambda c:c and 'box' in c.split())
                  meta=box.get_text(' ',strip=True) if box else a.get_text(' ',strip=True)
                  if ' | 20' in meta:
                      cards.append({'title':a.get_text(' ',strip=True),'meta':meta,'token':a.get('data-protected-link-token-value','')})
              print('\nPAGE',p,'STATUS',r.status_code,'SIZE',len(r.content),'COUNT',len(cards),flush=True)
              print('FIRST',json.dumps(cards[:2],ensure_ascii=False),flush=True)
              print('LAST',json.dumps(cards[-2:],ensure_ascii=False),flush=True)
              for c in cards:
                  if '中广核新能源' in c['title'] or '稳步成长的新能源运营商' in c['title'] or '清洁能源新栋梁' in c['title']:
                      print('MATCH',json.dumps(c,ensure_ascii=False),flush=True)
              time.sleep(1.5)
          PY
