name: Build Fujia 603219 broker deep reports

on:
  push:
    branches:
      - tmp-fujia-broker-reports-20261028

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='富佳股份_603219_券商深度报告_3份'
          mkdir -p "$PACKAGE" /tmp/fujia_broker_render

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('富佳股份_603219_券商深度报告_3份')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8,
              backoff_factor=1.2,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'],
              raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          reports = [
              {
                  'order': 1,
                  'broker': '开源证券',
                  'date': '2022-08-09',
                  'title': '公司首次覆盖报告：吸尘器代工主业稳健，洗地机新品类打开成长空间',
                  'filename': '01_开源证券_吸尘器代工主业稳健洗地机新品类打开成长空间_2022-08-09.pdf',
                  'pages': 23,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202208091577046025_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202208091577046025.html',
              },
              {
                  'order': 2,
                  'broker': '天风证券',
                  'date': '2024-04-19',
                  'title': '核心客户打造基本盘，储能赛道贡献新增量',
                  'filename': '02_天风证券_核心客户打造基本盘储能赛道贡献新增量_2024-04-19.pdf',
                  'pages': 25,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202404191630697810_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202404191630697810.html',
              },
              {
                  'order': 3,
                  'broker': '甬兴证券',
                  'date': '2024-11-06',
                  'title': '富佳股份首次覆盖报告：清洁电器前景可期，储能逐步贡献增量',
                  'filename': '03_甬兴证券_清洁电器前景可期储能逐步贡献增量_2024-11-06.pdf',
                  'pages': 20,
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202411081640780206_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202411081640780206.html',
              },
          ]

          def download(report: dict) -> tuple[str, bytes]:
              last = None
              candidates = [report['url'], report['url'] + '?download=1']
              for attempt in range(8):
                  for url in candidates:
                      try:
                          response = session.get(
                              url,
                              headers={'Referer': report['info']},
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          data = response.content
                          if response.status_code == 200 and data.startswith(b'%PDF-') and len(data) > 150_000:
                              return response.url, data
                          last = RuntimeError(
                              f'HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get("content-type")}'
                          )
                      except Exception as exc:
                          last = exc
                  time.sleep(min(2 + attempt, 10))
              raise RuntimeError(f'Failed to download {report["title"]}: {last!r}')

          records = []
          for report in reports:
              source, data = download(report)
              path = out / report['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != report['pages']:
                  raise RuntimeError(f'{path.name}: expected {report["pages"]} pages, got {actual_pages}')
              sha = hashlib.sha256(data).hexdigest()
              records.append({**report, 'source': source, 'bytes': len(data), 'sha256': sha})
              print('DOWNLOADED', path.name, 'pages=', actual_pages, 'bytes=', len(data), 'sha256=', sha)

          manifest = [
              '富佳股份（603219）券商深度报告资料包',
              '整理日期：2026-10-28',
              '',
              '收录原则：仅收录可直接公开下载并验证的券商原始完整PDF；未使用网页摘要、预览页或重新排版版本。',
              '',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for item in records:
              total_pages += item['pages']
              total_bytes += item['bytes']
              manifest += [
                  f"{item['order']}. {item['broker']}｜{item['title']}",
                  f"   发布日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   研报索引：{item['info']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          manifest += [
              f'三份PDF合计：{total_pages}页，{total_bytes}字节。',
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 150000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 15
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt"
            grep -Eq '富佳股份|宁波富佳实业股份有限公司' "$pdf.txt"
            case "$(basename "$pdf")" in
              01_*) grep -Eq '开源证券' "$pdf.txt" ;;
              02_*) grep -Eq '天风证券' "$pdf.txt" ;;
              03_*) grep -Eq '甬兴证券' "$pdf.txt" ;;
            esac
            rm -f "$pdf.txt"

            stem="/tmp/fujia_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 110 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 110 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          test "$(pdfinfo "$PACKAGE/01_开源证券_吸尘器代工主业稳健洗地机新品类打开成长空间_2022-08-09.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 23
          test "$(pdfinfo "$PACKAGE/02_天风证券_核心客户打造基本盘储能赛道贡献新增量_2024-04-19.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 25
          test "$(pdfinfo "$PACKAGE/03_甬兴证券_清洁电器前景可期储能逐步贡献增量_2024-11-06.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 20

          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/fujia_broker_test.zip "$PACKAGE"
          unzip -t /tmp/fujia_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/fujia_broker_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f /tmp/fujia_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Fujia-603219-broker-deep-reports-3
          path: 富佳股份_603219_券商深度报告_3份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
