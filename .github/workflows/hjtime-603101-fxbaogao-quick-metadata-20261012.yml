name: Quick HJTime 603101 fxbaogao metadata 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-fxbaogao-quick-metadata-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query public report APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          out=Path('quick'); out.mkdir()
          endpoints=[
            ('https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth',{'keywords':'汇嘉时代','pageIndex':1,'pageSize':100,'order':2,'nop':-1}),
            ('https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth',{'stockCodes':['603101'],'pageNum':1,'pageSize':100,'order':2}),
            ('https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth',{'advancedQuery':True,'advancedRequest':{'title':'汇嘉时代'},'pageNum':1,'pageSize':100,'order':2}),
          ]
          for i,(url,body) in enumerate(endpoints,1):
            data=json.dumps(body,ensure_ascii=False).encode('utf-8')
            req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/','Accept':'application/json,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=45) as r: raw=r.read()
              (out/f'response_{i}.json').write_bytes(raw)
              print('RESPONSE',i,len(raw),flush=True)
              j=json.loads(raw)
              print(json.dumps(j,ensure_ascii=False)[:100000],flush=True)
            except Exception as e:
              print('ERROR',i,repr(e),flush=True)
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hjtime-603101-fxbaogao-quick-metadata
          path: quick
          retention-days: 7
          if-no-files-found: error
